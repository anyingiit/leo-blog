{{- /* 推文栏目首页（/x/）：显示最近一个月，其他月份各一页（x/single.html）。不进首页、不进短文。 */ -}}
{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<div class="post-description">{{ . | markdownify }}</div>{{ end }}
</header>
{{- with index site.Data.xtl 0 }}{{ partial "x/month.html" (dict "month" ((time .date).Format "2006-01")) }}{{ end }}
{{- end }}
