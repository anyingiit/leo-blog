{{- /* 月记末尾：这个月的转发，每条一行。 */ -}}
<div class="x-rts">
<p class="x-rts-h">这个月还转发了</p>
<ul>
{{- range .Page.Params.xrts }}{{ with index $.Page.Params.xs . }}

{{- end }}{{ end }}
</ul>
</div>
