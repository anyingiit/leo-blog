{{- /* 月记里每条推文前的小标题：日期和时间，链接到原推。 */ -}}
{{- $x := index .Page.Params.xs (.Get "id") -}}
{{- $d := time (index $x.parts 0).date -}}
<p class="x-day" id="t{{ $x.id }}"><a href="{{ $x.url }}" rel="nofollow noopener noreferrer" target="_blank"><time datetime="{{ $d.Format "2006-01-02T15:04:05-07:00" }}">{{ $d | time.Format "1月2日 15:04" }}</time></a></p>
