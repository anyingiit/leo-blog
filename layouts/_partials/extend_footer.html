{{- /*
  1. 图集灯箱：点击（或用键盘选中后回车）正文图片全屏查看，同一篇里的图片可左右切换（方向键、按钮、手指滑动），
     图片的 alt 作为图注；Esc、关闭按钮或点空白处关闭，焦点回到原图。
  2. 短文栏目：超过约一屏的短文先折叠，可展开、收起；图片加载后重新判断。
     多张图片的原位分组在构建时完成，见 notes/list.html。
*/ -}}
<script>
(() => {
  const t = {
    prev: {{ i18n "zoom_prev" }}, next: {{ i18n "zoom_next" }}, close: {{ i18n "zoom_close" }}, label: {{ i18n "zoom_label" }},
    open: {{ i18n "zoom_open" }}, more: {{ i18n "zoom_more" }},
  };
  const zoomable = (img) => !img.closest("a") && !img.classList.contains("in-text");
  const selector = ".md-content img";

  // ---------- 图集灯箱 ----------
  let box, big, caption, counter, list = [], index = 0, opener = null;
  const show = (i) => {
    index = (i + list.length) % list.length;
    const img = list[index];
    big.src = img.dataset.zoom || img.currentSrc || img.src;
    big.alt = img.alt;
    caption.textContent = img.alt;
    counter.textContent = list.length > 1 ? `${index + 1} / ${list.length}` : "";
    box.classList.toggle("single", list.length < 2);
  };
  const build = () => {
    box = document.createElement("dialog");
    box.className = "img-zoom";
    box.setAttribute("aria-label", t.label);
    box.tabIndex = -1;
    box.innerHTML = '<figure><img alt=""><figcaption></figcaption></figure>' +
      `<button type="button" class="zoom-prev" aria-label="${t.prev}">‹</button>` +
      `<button type="button" class="zoom-next" aria-label="${t.next}">›</button>` +
      `<button type="button" class="zoom-close" aria-label="${t.close}">×</button>` +
      '<span class="zoom-count" aria-live="polite"></span>';
    big = box.querySelector("img");
    caption = box.querySelector("figcaption");
    counter = box.querySelector(".zoom-count");
    const on = (sel, fn) => box.querySelector(sel).addEventListener("click", (e) => { e.stopPropagation(); fn(); });
    on(".zoom-prev", () => show(index - 1));
    on(".zoom-next", () => show(index + 1));
    on(".zoom-close", () => box.close());
    box.addEventListener("click", () => box.close());
    box.addEventListener("close", () => opener && opener.focus());
    box.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") show(index - 1);
      if (e.key === "ArrowRight") show(index + 1);
    });
    let x0 = null;
    box.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
    box.addEventListener("pointerup", (e) => {
      if (x0 === null) return;
      const dx = e.clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 50) { show(index + (dx < 0 ? 1 : -1)); box.dataset.swiped = "1"; }
    });
    box.addEventListener("click", (e) => {
      if (box.dataset.swiped) { delete box.dataset.swiped; e.stopImmediatePropagation(); }
    }, true);
    document.body.append(box);
  };
  const gallery = (img) => [...(img.closest(".note-entry") || img.closest(".md-content")).querySelectorAll(selector)].filter(zoomable);
  const open = (img) => {
    list = gallery(img);
    if (!box) build();
    opener = img;
    // 第 9 张上标着「+N」，点它从第 10 张（没显示出来的第一张）看起
    show(list.indexOf(img) + (img.closest(".img-more") ? 1 : 0));
    box.showModal();
    box.focus();
  };
  // 图片能用键盘打开；没写说明（alt）的图片，读屏念「查看图片 3 / 12」，而不是只念「按钮」
  const fmt = (s, ...n) => n.reduce((r, x) => r.replace("%d", x), s);
  for (const img of document.querySelectorAll(selector)) {
    if (!zoomable(img)) continue;
    img.tabIndex = 0;
    img.setAttribute("role", "button");
    const all = gallery(img), more = img.closest(".img-more")?.querySelector(".note-more");
    const label = img.alt || fmt(t.open, all.indexOf(img) + 1, all.length);
    if (more) {
      more.setAttribute("aria-hidden", "true");
      img.setAttribute("aria-label", label + fmt(t.more, all.length - all.indexOf(img) - 1));
    } else if (!img.alt) img.setAttribute("aria-label", label);
  }
  document.addEventListener("click", (e) => {
    const img = e.target.closest(selector);
    if (img && zoomable(img)) open(img);
  });
  document.addEventListener("keydown", (e) => {
    const img = e.target.closest && e.target.closest(selector);
    if (img && zoomable(img) && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(img); }
  });

  // ---------- 短文栏目 ----------
  const bodies = document.querySelectorAll(".note-body");
  if (!bodies.length) return;

  // 折叠：先按已知宽高判断，没写宽高的图片（gif、svg、外链）加载后再判断一次
  const limit = 640;
  const fold = (body) => {
    if (body.dataset.folded || body.scrollHeight <= limit * 1.25) return;
    body.dataset.folded = "1";
    body.classList.add("is-folded");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "note-expand";
    btn.textContent = body.dataset.expand;
    btn.setAttribute("aria-expanded", "false");
    btn.addEventListener("click", () => {
      const folded = body.classList.toggle("is-folded");
      btn.textContent = folded ? body.dataset.expand : body.dataset.collapse;
      btn.setAttribute("aria-expanded", String(!folded));
      if (folded) body.closest(".note-entry").scrollIntoView({ block: "start" });
    });
    body.after(btn);
  };
  for (const body of bodies) {
    fold(body);
    for (const img of body.querySelectorAll("img:not([width])")) img.addEventListener("load", () => fold(body), { once: true });
  }
})();
</script>
{{- /* 3. 短片（layouts/_shortcodes/film.html）：点封面在全窗口的对话框里放映，深浅色跟随博客；关闭时卸载，声音随之停止 */ -}}
<script>
(() => {
  const openers = document.querySelectorAll(".film-open");
  if (!openers.length) return;
  const root = document.documentElement;
  const theme = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  let box, frame, link, opener;
  const sync = () => { try { frame.contentDocument.documentElement.dataset.theme = theme(); } catch {} };
  const build = () => {
    box = document.createElement("dialog");
    box.className = "film-dialog";
    box.innerHTML = '<div class="film-bar"><span class="film-name"></span><a class="film-tab" target="_blank" rel="noopener">{{ i18n "film_newtab" }} ↗</a><button type="button" class="film-close" aria-label="{{ i18n "zoom_close" }}">×</button></div><iframe allow="fullscreen; autoplay" allowfullscreen></iframe>';
    frame = box.querySelector("iframe"); link = box.querySelector(".film-tab");
    // 短片页面若先有标题、导语，把播放区（.player、video、canvas 或第一个 svg 所在处）滚到窗口中间
    frame.addEventListener("load", () => {
      sync();
      try { frame.contentDocument.querySelector("[data-film-player], .player, video, canvas, svg")?.scrollIntoView({ block: "center" }); } catch {}
    });
    box.querySelector(".film-close").onclick = () => box.close();
    box.addEventListener("close", () => { frame.src = "about:blank"; document.body.style.overflow = ""; opener?.focus(); });
    document.body.append(box);
    new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  };
  for (const b of openers) b.addEventListener("click", () => {
    if (!box) build();
    opener = b;
    box.querySelector(".film-name").textContent = b.dataset.title;
    box.setAttribute("aria-label", b.dataset.title);
    link.href = b.dataset.src; frame.title = b.dataset.title; frame.src = b.dataset.src;
    document.body.style.overflow = "hidden";
    box.showModal();
  });
})();
</script>
