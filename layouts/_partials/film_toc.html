{{- /* 短片章节目录（film_stage.html）：PaperMod 文章目录的样子。参数：f、chapters、open */ -}}
<details class="toc film-toc"{{ if .open }} open{{ end }}>
<summary><span class="title">{{ i18n "film_chapters" }}</span>{{ with .f.minutes }}<span class="film-toc-len"> · {{ printf (i18n "film_minutes") (int .) }}</span>{{ end }}</summary>
<div class="inner"><ul>
{{- range $i, $h := .chapters }}
<li data-chapter="{{ $i }}"><a href="#{{ $h.ID }}">{{ $h.Title | safeHTML }}</a><button type="button" class="film-seek" data-chapter="{{ $i }}" aria-label="{{ i18n "film_from_here" }}：{{ $h.Title | plainify }}" hidden><span class="film-at"></span> ▶</button></li>
{{- end }}
</ul></div>
</details>
