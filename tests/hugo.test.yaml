# 回归测试用的额外配置：在正式内容之外再挂上 tests/fixtures/content 里的测试短文（正式构建不会包含它们）
module:
  mounts:
    - source: content
      target: content
    - source: tests/fixtures/content
      target: content
    # 双语对照译文的版式预览（仅预览站）
    - source: tests/fixtures/bilingual-preview/content
      target: content
    - source: tests/fixtures/bilingual-preview/static
      target: static
    - source: static
      target: static
# 所有测试短文都在第一页，正式短文变多也不会把它们挤到下一页
pagination:
  pagerSize: 100
