# 回归测试用的额外配置：在正式内容之外再挂上 tests/fixtures/content 里的测试短文（正式构建不会包含它们）
module:
  mounts:
    - source: content
      target: content
    - source: tests/fixtures/content
      target: content
    # S-1 译本的四套方案原型（只在预览里出现）
    - source: tests/fixtures/s1-preview/content
      target: content
    - source: assets
      target: assets
    - source: tests/fixtures/s1-preview/assets
      target: assets
# 所有测试短文都在第一页，正式短文变多也不会把它们挤到下一页
pagination:
  pagerSize: 100
