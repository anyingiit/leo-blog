# 回归测试用的额外配置：在正式内容之外再挂上 tests/fixtures 里的测试短文和测试短片（正式构建不会包含它们）
# 写了某一类挂载（content、assets）就不再有默认挂载，所以正式目录也要列出来
module:
  mounts:
    - source: content
      target: content
    - source: tests/fixtures/content
      target: content
    # S-1 译本模板的测试样例（tests/s1.test.mjs，也出现在预览站 /s1-test/）：15 页节选，v0.9 是演示用的历史版本（还没发布下载文件）
    - source: tests/fixtures/s1-preview/options
      target: content
    # 双语对照译文的样例（也用于像素截图）：有一段没有译文，tests/bilingual.test.mjs 用它检查
    - source: tests/theme/site-fixture/content/translations/sample-essay
      target: content/translations/sample-essay
    - source: assets
      target: assets
    - source: tests/fixtures/assets
      target: assets
    - source: tests/fixtures/s1-preview/assets
      target: assets
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-test/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-test/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-test/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-test/v0.9/selected-definitions
# 所有测试短文都在第一页，正式短文变多也不会把它们挤到下一页
pagination:
  pagerSize: 100
