# 回归测试用的额外配置：在正式内容之外再挂上 tests/fixtures/content 里的测试短文（正式构建不会包含它们）
module:
  mounts:
    - source: content
      target: content
    - source: tests/fixtures/content
      target: content
    # S-1 译本的几套方案原型（只在预览里出现）：同一份节选挂到四个栏目下，v0.9 是演示用的历史版本
    - source: tests/fixtures/s1-preview/options
      target: content
    - source: assets
      target: assets
    - source: tests/fixtures/s1-preview/assets
      target: assets
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-wi/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-wi/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-wi/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-wi/v0.9/selected-definitions
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-d1/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-d1/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-d1/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-d1/v0.9/selected-definitions
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-d2/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-d2/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-d2/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-d2/v0.9/selected-definitions
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-d3/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-d3/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-d3/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-d3/v0.9/selected-definitions
    - source: tests/fixtures/s1-preview/versions/v1.0
      target: content/s1-d4/v1.0
    - source: tests/fixtures/s1-preview/versions/v0.9
      target: content/s1-d4/v0.9
    - source: tests/fixtures/s1-preview/versions/v1.0/cover
      target: content/s1-d4/v0.9/cover
    - source: tests/fixtures/s1-preview/versions/v1.0/selected-definitions
      target: content/s1-d4/v0.9/selected-definitions
# 所有测试短文都在第一页，正式短文变多也不会把它们挤到下一页
pagination:
  pagerSize: 100
