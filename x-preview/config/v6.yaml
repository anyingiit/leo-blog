# 整站预览：方案 6（只在预览分支上用，见 build.sh）
params:
  xpreview: { cur: 6 }
module:
  mounts:
    - { source: content, target: content }
    - { source: x-preview/out/v6/notes, target: content/notes }
    - { source: x-preview/out/v6/posts, target: content/posts }
    - { source: assets, target: assets }
    - { source: x-preview/src/media, target: assets/x-media }
