<text x="293.25 299.43 305.61 308.14" y="289.07" font-size="11.00" class="sc-loraregular">88.0</text><text x="370.50" y="289.07" font-size="11.00" class="sc-loraregular">71.3</text><text x="447.75 453.65 460.30 463.01" y="289.07" font-size="11.00" class="sc-loraregular">20.4</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 122.72 128.95 135.96 142.97 148.89 153.43 156.32" y="316.52" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="216.00 220.91 226.87 229.22" y="316.52" font-size="11.00" class="sc-loraregular">74.7</text><text x="293.25 299.43 305.39 308.09" y="316.52" font-size="11.00" class="sc-loraregular">84.3</text><text x="370.50 376.85 382.84 385.20" y="316.52" font-size="11.00" class="sc-loraregular">65.7</text><text x="447.75 453.41 459.37 462.07" y="316.52" font-size="11.00" class="sc-loraregular">24.5</text><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.10 109.48 118.54 126.97 131.81 140.10 153.60 162.41 167.25 170.68 178.97 187.40 195.59 203.61 212.05 219.84" y="603.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.7 AutomationBench</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">30</text><text x="81.70 87.36 93.35 98.77 104.74 109.90 114.15 120.13 122.66 125.29 132.50 134.96 137.48 140.11 147.06 149.69 155.36 160.52 163.23 166.04 174.98 180.14 186.21 190.83 193.36 195.99 202.27 204.73 207.36 210.41 215.77 221.91 227.28 232.94 235.99 238.44 241.07 247.33 253.30 257.17 263.02 271.95 277.04 280.91 283.72 289.56 295.57 301.79 307.21 313.28 318.59 324.58 327.04 329.67 334.83 338.54 345.02 347.83 352.88 355.38 360.75 366.52 372.73 378.15 380.61 384.25 389.79 395.57 401.14 406.56" y="704.45" font-size="10.00" class="sc-loraregular">Shepard, D., &amp; Salimans, R. (2026). AutomationBench. arXiv:2604.18934.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.72 203.18 206.81 212.36 218.14 223.71" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2604.18934</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="76.75" y="206.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="447.25" y="206.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">平均轮次</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="130.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度的自适应思考下运行内部运行框架，未启用安全分类器或回退。按照论文的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">实验方案，我们报告在全部</text><text x="206.89" y="98.23" font-size="11.00" class="sc-loraregular">108</text><text x="226.80" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个任务上三次试验平均的</text><text x="350.70 357.29 362.96 368.05 373.15 381.90" y="98.23" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="385.91" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="421.80 428.39 434.07 439.16 444.25 453.01" y="98.23" font-size="11.00" class="sc-loraregular">Pass@3</text><text x="459.13" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（三次试验中至</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">少一次正确）、</text><text x="149.00 155.59 161.26 166.36 171.45" y="113.85" font-size="11.00" class="sc-loraregular">Pass³</text><text x="175.52" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（三次试验全部正确）和每条轨迹的平均助手轮次数。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="157.91" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="157.91" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="184.93 191.11 197.76 200.36 206.72" y="157.91" font-size="11.00" class="sc-loraregular">80.6%</text><text x="219.18" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="233.07 239.66 245.34 250.43 255.52 264.28" y="157.91" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="268.28" y="157.91" font-size="11.00" class="sc-notoserifcjksc">，领先于在同一运行框架上评估的</text><text x="436.18 443.87 446.86 452.47 459.04 465.61 471.58 474.47 483.20 489.77 496.34" y="157.91" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="173.53" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="173.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.85 102.92 109.10 111.81 118.17" y="173.53" font-size="11.00" class="sc-loraregular">79.9%</text><text x="127.74" y="173.53" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="152.63 160.32 163.31 168.92 175.49 182.07 188.03 190.92 197.16 203.59 210.27 216.95 222.83 227.09 229.98" y="173.53" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="235.98" y="173.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="246.98 251.89 257.86 260.21 265.28" y="173.53" font-size="11.00" class="sc-loraregular">74.7%</text><text x="274.85" y="173.53" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="335.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="335.69" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 110.05 112.15 117.68 121.16 123.53 128.92 134.01 139.07 141.88 146.56 150.27 155.86 158.67 163.76" y="335.69" font-size="9.00" class="sc-lorabold">8.13.6.A] Toolathlon</text><text x="171.87" y="335.69" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="270.87" y="335.69" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="300.24" y="335.69" font-size="9.00" class="sc-loraregular">max</text><text x="320.07" y="335.69" font-size="9.00" class="sc-notoserifcjksc">推理强度的自适应思考下评估。</text><text x="446.07 451.46 456.10 460.27 464.44 471.60" y="335.69" font-size="9.00" class="sc-loraregular">Pass@1</text><text x="474.88" y="335.69" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="483.88 489.27 493.91 498.08 502.24 509.41" y="335.69" font-size="9.00" class="sc-loraregular">Pass@3</text><text x="516.79" y="335.69" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 77.39 82.04 86.20 90.37" y="347.39" font-size="9.00" class="sc-loraregular">Pass³</text><text x="96.07" y="347.39" font-size="9.00" class="sc-notoserifcjksc">按照论文的实验方案，在全部</text><text x="215.43" y="347.39" font-size="9.00" class="sc-loraregular">108</text><text x="231.72" y="347.39" font-size="9.00" class="sc-notoserifcjksc">个任务上基于每个任务</text><text x="324.09" y="347.39" font-size="9.00" class="sc-loraregular">3</text><text x="331.47" y="347.39" font-size="9.00" class="sc-notoserifcjksc">次试验计算。</text><text x="72.00" y="374.75" font-size="11.00" class="sc-notoserifcjksc">我们的运行框架在任务定义、提示词和基于执行的检查器上与</text><text x="474.99" y="374.75" font-size="11.00" class="sc-notoserifcjksc">逐字节一致，</text><text x="72.00" y="390.37" font-size="11.00" class="sc-notoserifcjksc">我们通过重放作者公开的参考轨迹验证了这一点。为控制实时依赖漂移，我们将金融数据源固定</text><text x="72.00" y="405.99" font-size="11.00" class="sc-notoserifcjksc">为运行时录制的快照，并固定容器镜像。少量上游检查器缺陷（例如，标准答案引用了一个后来</text><text x="72.00" y="421.61" font-size="11.00" class="sc-notoserifcjksc">已更名的代码仓库）对所有模型的影响是对称的，我们未作改动。</text><text x="72.00" y="488.09" font-size="11.00" class="sc-notoserifcjksc">关于与公开排行榜可比性的说明：我们得到的</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 339.42 345.86 352.53 359.21 365.10 369.35 372.25" y="488.09" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="381.13" y="488.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="395.03 402.72 405.71 411.32 417.88 424.46 430.42 433.32 442.05 448.62 455.18 460.28 463.17 469.13 471.84" y="488.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="480.91" y="488.09" font-size="11.00" class="sc-notoserifcjksc">数值比公开</text><text x="72.00" y="503.71" font-size="11.00" class="sc-notoserifcjksc">排行榜上的数值（</text><text x="160.00 165.07 169.07 171.67 178.03" y="503.71" font-size="11.00" class="sc-loraregular">71.6%</text><text x="190.49" y="503.71" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="204.39" y="503.71" font-size="11.00" class="sc-loraregular">76.2%</text><text x="234.00" y="503.71" font-size="11.00" class="sc-notoserifcjksc">）高出约</text><text x="280.89" y="503.71" font-size="11.00" class="sc-loraregular">3</text><text x="72.00" y="519.33" font-size="11.00" class="sc-notoserifcjksc">行框架未产生任何轨迹的运行（</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06" y="519.33" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="273.95" y="519.33" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="287.84 293.97 299.63" y="519.33" font-size="11.00" class="sc-loraregular">324</text><text x="308.49" y="519.33" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="344.38" y="519.33" font-size="11.00" class="sc-loraregular">8</text><text x="353.46" y="519.33" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="375.46" y="519.33" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="423.05" y="519.33" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="436.95" y="519.33" font-size="11.00" class="sc-loraregular">11</text><text x="447.85" y="519.33" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这</text><text x="72.00" y="534.95" font-size="11.00" class="sc-notoserifcjksc">些计为失败；排除这些后，我们的数值与作者公开的参考轨迹在运行间噪声范围内一致。</text><text x="72.00 78.89 85.45 89.71 96.15 105.98 111.58 115.83 118.93 125.36 131.97 138.81 144.78 151.45 157.30" y="627.45" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="163.89" y="623.79" font-size="6.60" class="sc-loraregular">30</text><text x="174.56" y="627.45" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="188.45" y="627.45" font-size="11.00" class="sc-loraregular">Zapier</text><text x="224.12" y="627.45" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，衡量智能体能否完成一个贴近现实的端到端业</text><text x="72.00" y="643.07" font-size="11.00" class="sc-notoserifcjksc">务工作流。任务基于销售、市场营销、运营、客服、财务和人力资源等领域的真实客户工作流模</text><text x="72.00" y="658.69" font-size="11.00" class="sc-notoserifcjksc">式设定。每个任务都会将智能体置于一家模拟公司中，该公司拥有数十个</text><text x="426.89 433.80 440.64 446.88 453.92 456.81 463.70 470.31" y="658.69" font-size="11.00" class="sc-loraregular">REST API</text><text x="476.89" y="658.69" font-size="11.00" class="sc-notoserifcjksc">端点，</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="707.20" width="157.13" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="72.00 80.93 84.30 89.20 98.25 101.89 111.64 120.48 131.30 139.48 149.24 160.05" y="622.91" font-size="14.00" class="sc-poppinsmedium">8.14 ARC-AGI</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 116.50 124.71 134.76 142.36 151.42 161.46 164.90 172.50 177.05 180.43 190.32 193.69 202.75 210.97 221.01 228.61 237.67 247.72 251.15 258.75" y="659.90" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 ARC-AGI-1 &amp; ARC-AGI-2</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">覆盖</text><text x="96.89" y="82.61" font-size="11.00" class="sc-loraregular">47</text><text x="110.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="154.82" y="82.61" font-size="11.00" class="sc-loraregular">CRM</text><text x="179.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="190.51" y="82.61" font-size="11.00" class="sc-loraregular">Slack</text><text x="217.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="228.18 236.55 242.98 249.42 255.77 258.76 264.72 267.61 278.13 284.56 289.28 295.19 300.28 306.85 312.53 318.32" y="82.61" font-size="11.00" class="sc-loraregular">Google Workspace</text><text x="327.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">等）。在仅给出一条自然语言指令的情况</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">下，智能体必须通过搜索自主发现正确的端点，进行数十次相互依赖的顺序</text><text x="437.89 444.78 451.39" y="98.23" font-size="11.00" class="sc-loraregular">API</text><text x="457.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">调用，查阅并遵</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">守分层业务政策文档，同时避开刻意设置的干扰项。每个任务的评分为通过</text><text x="435.00" y="113.85" font-size="11.00" class="sc-loraregular">/</text><text x="442.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">不通过，依据是否满</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">足针对模拟应用状态的所有确定性断言（例如，所有正确的</text><text x="360.89" y="129.47" font-size="11.00" class="sc-loraregular">CRM</text><text x="388.48" y="129.47" font-size="11.00" class="sc-notoserifcjksc">更新均已应用）。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 110.04 119.87 125.47 129.73 132.82 139.25 145.86 152.71 158.67 165.35 171.20" y="195.95" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="180.68" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的排行榜（衡量在一个非公开留出评估集上的表现）上，</text><text x="455.68 463.37 466.36 471.97 478.54 485.12 491.08 493.97 502.70 509.27 515.84" y="195.95" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="211.57" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="211.57" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="111.69" y="211.57" font-size="11.00" class="sc-notoserifcjksc">推理强度）得分</text><text x="191.58 197.49 203.85 206.39 213.22" y="211.57" font-size="11.00" class="sc-loraregular">26.0%</text><text x="222.79" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，较</text><text x="247.68 255.37 258.37 263.98 270.54 277.12 283.08 285.98 294.71 301.28 307.84 312.94 315.83 321.79 324.50" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="330.68" y="211.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="341.68" y="211.57" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="364.38" y="211.57" font-size="11.00" class="sc-notoserifcjksc">推理强度）的</text><text x="433.27 437.27 441.86 444.40 451.23" y="211.57" font-size="11.00" class="sc-loraregular">17.0%</text><text x="463.69" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="477.59 485.28 488.27 493.88 500.45 507.02" y="211.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="227.19" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40" y="227.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="124.29 128.30 132.89 135.59 141.55" y="227.19" font-size="11.00" class="sc-loraregular">17.4%</text><text x="154.02" y="227.19" font-size="11.00" class="sc-notoserifcjksc">有大幅提升。值得注意的是，在</text><text x="310.91" y="227.19" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="353.41" y="227.19" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="419.41 427.10 430.09 435.70 442.27 448.84 454.81 457.70 466.43 473.00 479.57 484.66 487.55" y="227.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="496.44" y="227.19" font-size="11.00" class="sc-notoserifcjksc">以每任务</text><text x="72.00 77.82 84.47 87.18 93.29" y="242.81" font-size="11.00" class="sc-loraregular">$0.89</text><text x="102.54" y="242.81" font-size="11.00" class="sc-notoserifcjksc">的成本取得</text><text x="160.43 166.09 172.06" y="242.81" font-size="11.00" class="sc-loraregular">24%</text><text x="184.52" y="242.81" font-size="11.00" class="sc-notoserifcjksc">的得分，以不到一半的成本显著超越了</text><text x="374.41 382.10 385.09 390.70 397.27 403.85 409.81 412.70 421.44 428.00 434.57 439.66 442.56 448.52 451.22" y="242.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="460.30" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="474.19 479.78 485.46 491.86 494.85 500.81 503.71" y="242.81" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="509.70" y="242.81" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="572.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="572.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.62 108.27 110.37 115.90 119.38 121.74 127.57 133.09 136.81 141.90 150.18 154.86 158.58 161.52 166.62 172.31 178.25 183.10 188.84 193.50" y="572.36" font-size="9.00" class="sc-lorabold">8.13.7.A] AutomationBench</text><text x="201.46" y="572.36" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="228.46 234.75 237.19 241.78 247.16 252.54 257.42 259.79 266.93 272.30 277.68 281.84 284.21" y="572.36" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="291.48" y="572.36" font-size="9.00" class="sc-notoserifcjksc">的表现高于此前任何</text><text x="374.85 381.14 383.59 388.18 393.55 398.93" y="572.36" font-size="9.00" class="sc-loraregular">Claude</text><text x="406.18" y="572.36" font-size="9.00" class="sc-notoserifcjksc">模型，且任务成本更低。</text><text x="72.00 78.89 85.79 93.27 98.65 105.48 113.86" y="683.98" font-size="11.00" class="sc-loraregular">ARC-AGI</text><text x="120.43" y="683.98" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="145.33 152.21 159.12 166.81 169.70 176.37 181.13 184.22 189.76 195.72 198.61 204.47 210.91 217.48 224.15 230.73 236.33 240.59 243.68 250.11" y="683.98" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="259.69" y="683.98" font-size="11.00" class="sc-notoserifcjksc">开发的流体智力基准测试，旨在衡量</text><text x="438.59" y="683.98" font-size="11.00" class="sc-loraregular">AI</text><text x="452.05" y="683.98" font-size="11.00" class="sc-notoserifcjksc">模型在仅给出少量</text><text x="72.00" y="699.60" font-size="11.00" class="sc-notoserifcjksc">（通常约</text><text x="118.89" y="699.60" font-size="11.00" class="sc-loraregular">3</text><text x="127.91" y="699.60" font-size="11.00" class="sc-notoserifcjksc">个）示例的情况下推理新颖模式的能力。模型会获得若干组满足某种</text></svg></div>

">证分数（在</text><text x="129.89 136.48 139.57 145.92" y="566.34" font-size="11.00" class="sc-loraregular">high</text><text x="155.40" y="566.34" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得），约为官方排行榜此前报告的最佳成绩的四倍。</text><text x="474.40 482.77 489.44 495.77 501.15 507.15 509.74 516.10 519.00 525.23 531.67" y="566.34" font-size="11.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="72.00" y="581.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="581.96" font-size="11.00" class="sc-loraregular">max</text><text x="110.13" y="581.96" font-size="11.00" class="sc-notoserifcjksc">推理强度下达到</text><text x="190.02 194.61 196.96 202.03 208.21" y="581.96" font-size="11.00" class="sc-loraregular">7.78%</text><text x="217.78" y="581.96" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="228.78 236.47 239.46 245.07 251.64 258.22 264.18 267.07 275.81 282.38 288.94 294.04 296.93 302.89 305.60" y="581.96" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="314.67" y="581.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="328.56 335.15 338.24 344.59" y="581.96" font-size="11.00" class="sc-loraregular">high</text><text x="354.07" y="581.96" font-size="11.00" class="sc-notoserifcjksc">推理强度下达到</text><text x="433.97" y="581.96" font-size="11.00" class="sc-loraregular">1.52%</text><text x="462.15" y="581.96" font-size="11.00" class="sc-notoserifcjksc">。在发布时，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="597.58" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="597.58" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="162.93" y="597.58" font-size="11.00" class="sc-loraregular">max</text><text x="187.16" y="597.58" font-size="11.00" class="sc-notoserifcjksc">推理强度下的结果尚不可得。</text></svg></div>

rifcjksc">）得分。</text><text x="72.00 78.89 85.79 93.48 96.38 103.04 107.81 110.90 116.43 122.39 125.28 131.15 137.58 144.15 150.83 157.40 163.00 167.26 170.35 176.79" y="389.73" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="186.37" y="389.73" font-size="11.00" class="sc-notoserifcjksc">还分享了一份关于</text><text x="277.26 284.95 287.94 293.55 300.12 306.70 312.66 315.55 324.29 330.85 337.42 342.51 345.40" y="389.73" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="354.29" y="389.73" font-size="11.00" class="sc-notoserifcjksc">如何处理该任务的分析，该分析由一个</text><text x="72.00" y="405.36" font-size="11.00" class="sc-loraregular">LLM</text><text x="97.71" y="405.36" font-size="11.00" class="sc-notoserifcjksc">评判模型审阅模型在单个游戏上的对话记录后生成。模型以</text><text x="386.60" y="405.36" font-size="11.00" class="sc-loraregular">100</text><text x="407.16" y="405.36" font-size="11.00" class="sc-notoserifcjksc">分完成了</text><text x="454.05 461.23 467.06 470.16" y="405.36" font-size="11.00" class="sc-loraregular">Axis</text><text x="107.76" y="420.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="118.76" y="420.98" font-size="11.00" class="sc-loraregular">ar25</text><text x="141.10" y="420.98" font-size="11.00" class="sc-notoserifcjksc">），用</text><text x="176.99" y="420.98" font-size="11.00" class="sc-loraregular">294</text><text x="198.11" y="420.98" font-size="11.00" class="sc-notoserifcjksc">次行动通过了全部八个关卡。评判模型认为，它在该游戏中的决定性优</text><text x="72.00" y="436.60" font-size="11.00" class="sc-notoserifcjksc">势在于将视觉谜题转化为显式的代数问题。到第</text><text x="305.89" y="436.60" font-size="11.00" class="sc-loraregular">2</text><text x="314.69" y="436.60" font-size="11.00" class="sc-notoserifcjksc">关时，它已推导出一个简单的反射方程；到第</text><text x="72.00" y="452.21" font-size="11.00" class="sc-loraregular">8</text><text x="81.07" y="452.21" font-size="11.00" class="sc-notoserifcjksc">关时，它已将其推广到二维反射，把</text><text x="259.97" y="452.21" font-size="11.00" class="sc-loraregular">60</text><text x="276.05" y="452.21" font-size="11.00" class="sc-notoserifcjksc">个目标划分为相互镜像的象限，并在执行前计算出每个</text><text x="72.00" y="499.08" font-size="11.00" class="sc-notoserifcjksc">到，失败的探索更新了模型的理解，而不是使其陷入循环。评判模型总结道：</text><text x="446.00" y="499.08" font-size="11.00" class="sc-loraregular">“</text><text x="450.40" y="499.08" font-size="11.00" class="sc-notoserifcjksc">一旦找到正确的本</text><text x="72.00" y="514.70" font-size="11.00" class="sc-notoserifcjksc">体，执行就极其可靠。</text><text x="182.00" y="514.70" font-size="11.00" class="sc-loraregular">”</text></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 102.93 106.31 114.50 117.93 126.22 137.68 145.25 152.19 157.02 165.04 170.03 177.59 185.78 193.80 202.23 210.03" y="212.29" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.1 BioMysteryBench</text><text x="72.00 80.29 83.42 87.97 95.25 98.38 105.88 109.26 115.03 123.84 128.68 136.47 144.91 153.10 156.53 164.82 168.20 176.38 179.81 188.11 191.54 199.97 204.29 212.58 217.57 231.07 239.88 244.72 248.15 255.95" y="481.22" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.2 LatchBio Bioinformatics</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估相互补充。尽管这些评估中有许多未公开发布，我们在下文对每项评估作简要介绍。除</text><text x="72.00 78.67 83.35 89.79 94.04 100.01 103.10 109.64 118.01 123.82" y="98.23" font-size="11.00" class="sc-loraregular">ProteinGym</text><text x="133.66" y="98.23" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="144.66 151.32 156.01 162.44 166.70 173.13 178.93 185.37 188.36" y="98.23" font-size="11.00" class="sc-loraregular">Protocols</text><text x="196.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和蛋白质设计之外的所有评估中，</text><text x="361.34 369.03 372.03 377.64 384.20 390.78" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.64" y="98.23" font-size="11.00" class="sc-notoserifcjksc">均可使用用于代码执行的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">bash</text><text x="98.65" y="113.85" font-size="11.00" class="sc-notoserifcjksc">工具、文件编辑器以及用于安装所需库的包管理器。在</text><text x="365.55 372.21 376.90 383.33 387.59 393.55 396.64 403.19 411.56 417.37" y="113.85" font-size="11.00" class="sc-loraregular">ProteinGym</text><text x="430.09" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="452.09 459.78 462.78 468.39 474.95 481.53" y="113.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="490.39" y="113.85" font-size="11.00" class="sc-notoserifcjksc">可使用</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular">bash</text><text x="98.65" y="129.47" font-size="11.00" class="sc-notoserifcjksc">工具和文件编辑器，但不能使用包管理器。在</text><text x="321.55 328.21 332.90 339.33 343.59 350.03 355.82 362.26 365.25" y="129.47" font-size="11.00" class="sc-loraregular">Protocols</text><text x="373.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="395.24 402.92 405.92 411.53 418.09 424.67" y="129.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="433.53" y="129.47" font-size="11.00" class="sc-notoserifcjksc">可使用</text><text x="469.42" y="129.47" font-size="11.00" class="sc-loraregular">bash</text><text x="493.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">、文件编</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">辑器和网络搜索工具。在蛋白质设计中，</text><text x="270.00 277.69 280.68 286.29 292.86 299.44" y="145.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="308.29" y="145.09" font-size="11.00" class="sc-notoserifcjksc">无法使用任何工具。</text><text x="72.00 78.75 81.85 88.05 97.98 103.79 108.88 113.14 119.10 124.05 129.66 136.50 142.47 149.14 154.99" y="242.39" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="164.48" y="242.39" font-size="11.00" class="sc-notoserifcjksc">评估模型解决困难分析难题的能力，这些难题需要将计算分析与生物学推理交</text><text x="72.00" y="258.01" font-size="11.00" class="sc-notoserifcjksc">替结合。给定未经处理的数据集，模型必须回答诸如从转录组数据中识别被敲除的基因、或确定</text><text x="72.00" y="273.63" font-size="11.00" class="sc-notoserifcjksc">是何种病毒感染了某个样本之类的问题。对于该基准测试，我们报告独立人类专家能够解决的问</text><text x="72.00" y="289.25" font-size="11.00" class="sc-notoserifcjksc">题子集（</text><text x="116.00 120.40 128.77 135.34 145.17 150.85 157.53 160.42 166.65 173.09 176.04 181.48 187.16 193.56 196.55 202.29" y="289.25" font-size="11.00" class="sc-loraregular">“Human Solvable”</text><text x="206.13" y="289.25" font-size="11.00" class="sc-notoserifcjksc">），以及人类尚未解决但具有客观真值答案的问题子集（</text><text x="481.13 485.53 493.90 500.47 510.31 515.98" y="289.25" font-size="11.00" class="sc-loraregular">“Human</text><text x="117.47" y="304.87" font-size="11.00" class="sc-notoserifcjksc">）。（请注意，根据外部反馈，我们从</text><text x="307.37 315.74 322.30 332.14 337.82 344.49 347.39 353.62 360.06 363.01 368.45 374.13 380.53 383.52" y="304.87" font-size="11.00" class="sc-loraregular">Human Solvable</text><text x="392.38" y="304.87" font-size="11.00" class="sc-notoserifcjksc">子集中移除了</text><text x="461.27" y="304.87" font-size="11.00" class="sc-loraregular">3</text><text x="470.29" y="304.87" font-size="11.00" class="sc-notoserifcjksc">道题，从</text><text x="156.55" y="320.49" font-size="11.00" class="sc-notoserifcjksc">子集中移除了</text><text x="225.44" y="320.49" font-size="11.00" class="sc-loraregular">6</text><text x="234.69" y="320.49" font-size="11.00" class="sc-notoserifcjksc">道题。）</text><text x="72.00" y="400.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.26 100.83 110.67 116.34 123.02 125.91 132.15 138.58 141.53 146.98 152.65 159.05 162.05" y="400.11" font-size="11.00" class="sc-loraregular">Human Solvable</text><text x="170.90" y="400.11" font-size="11.00" class="sc-notoserifcjksc">子集上，</text><text x="214.90 222.59 225.58 231.19 237.76 244.34 250.30 253.19 261.93 268.49 275.06 280.15 283.05" y="400.11" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="291.93" y="400.11" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="316.83 323.18 329.84 332.55 336.55" y="400.11" font-size="11.00" class="sc-loraregular">90.1%</text><text x="346.12" y="400.11" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="393.01 400.70 403.69 409.30 415.87 422.45 428.41 431.30 441.24 447.10 451.36 457.95 464.38 469.47 472.37" y="400.11" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="481.26" y="400.11" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="495.15 501.25 507.44 509.98 516.81" y="400.11" font-size="11.00" class="sc-loraregular">89.0%</text><text x="526.38" y="400.11" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="415.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="415.73" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="171.78" y="415.73" font-size="11.00" class="sc-loraregular">88.5%</text><text x="205.31" y="415.73" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="219.20 226.89 229.88 235.49 242.06 248.64 254.60 257.49 263.73 270.17 276.84 283.52 289.40 293.66 296.55" y="415.73" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="305.44" y="415.73" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="319.34 325.52 330.10 332.81 338.80" y="415.73" font-size="11.00" class="sc-loraregular">87.5%</text><text x="348.38" y="415.73" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="457.81" y="415.73" font-size="11.00" class="sc-notoserifcjksc">子集上，</text><text x="501.81 509.50 512.49 518.10 524.67 531.25" y="415.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="431.35" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="431.35" font-size="11.00" class="sc-notoserifcjksc">再次以</text><text x="146.64 152.60 158.78 161.49 167.45" y="431.35" font-size="11.00" class="sc-loraregular">49.4%</text><text x="179.91" y="431.35" font-size="11.00" class="sc-notoserifcjksc">领先，高于</text><text x="237.80 245.49 248.48 254.09 260.66 267.24 273.20 276.09 286.03 291.89 296.15 302.74 309.17 314.26 317.16" y="431.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="326.05" y="431.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="339.94" y="431.35" font-size="11.00" class="sc-loraregular">46.5%</text><text x="370.53" y="431.35" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="381.53 389.22 392.21 397.82 404.39 410.96 416.93 419.82 428.55 435.12 441.69 446.78 449.67 455.64 458.34" y="431.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="467.42" y="431.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="481.31" y="431.35" font-size="11.00" class="sc-loraregular">42.4%</text><text x="514.31" y="431.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="446.97" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="446.97" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="172.13" y="446.97" font-size="11.00" class="sc-loraregular">34.1%</text><text x="200.50" y="446.97" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="511.30" font-size="11.00" class="sc-notoserifcjksc">这些评估由</text><text x="129.89 136.49 142.09 146.35 152.20 158.72 165.48 168.57" y="511.30" font-size="11.00" class="sc-loraregular">LatchBio</text><text x="177.90" y="511.30" font-size="11.00" class="sc-notoserifcjksc">开发，评估解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="183.88" y="526.92" font-size="11.00" class="sc-notoserifcjksc">变体在一组</text><text x="241.77" y="526.92" font-size="11.00" class="sc-loraregular">115</text><text x="258.67" y="526.92" font-size="11.00" class="sc-notoserifcjksc">道经外部验证的问题上测试对空间转录组学数据（即映射</text><text x="72.00" y="542.54" font-size="11.00" class="sc-notoserifcjksc">到组织切片中物理位置的基因表达）的分析，要求模型根据这些结果回答关于样本的生物学问</text><text x="72.00" y="558.16" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="94.00 100.17 103.26 109.94 116.29 119.28 125.24 132.93 138.89 141.88 144.79 151.63 157.59 164.27 170.12" y="558.16" font-size="11.00" class="sc-loraregular">SingleCellBench</text><text x="179.60" y="558.16" font-size="11.00" class="sc-notoserifcjksc">变体在</text><text x="215.49" y="558.16" font-size="11.00" class="sc-loraregular">195</text><text x="234.74" y="558.16" font-size="11.00" class="sc-notoserifcjksc">道问题上测试对单细胞</text><text x="347.64" y="558.16" font-size="11.00" class="sc-loraregular">RNA</text><text x="372.71" y="558.16" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析，涵盖标注细胞类</text><text x="72.00" y="573.78" font-size="11.00" class="sc-notoserifcjksc">型、寻找差异表达基因和校正批次效应等标准工作流程。</text><text x="72.00" y="652.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="197.77" y="652.83" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="219.77 227.46 230.45 236.06 242.63 249.21 255.17 258.07 266.80 273.37 279.93 285.03 287.92" y="652.83" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="296.81" y="652.83" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="310.70" y="652.83" font-size="11.00" class="sc-loraregular">72.5%</text><text x="342.84" y="652.83" font-size="11.00" class="sc-notoserifcjksc">取得最高分，领先于</text><text x="444.74 452.42 455.42 461.03 467.59 474.17 480.13 483.03 492.96 498.82 503.08 509.67 516.10 521.20 524.09" y="652.83" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="72.00" y="668.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.25 98.43 101.14 107.05" y="668.45" font-size="11.00" class="sc-loraregular">69.2%</text><text x="116.62" y="668.45" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="127.62 135.30 138.30 143.91 150.47 157.05 163.01 165.91 172.14 178.58 185.26 191.93 197.82 202.07 204.97" y="668.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="213.86" y="668.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="227.75 234.03 238.62 241.32 247.51" y="668.45" font-size="11.00" class="sc-lorareg
