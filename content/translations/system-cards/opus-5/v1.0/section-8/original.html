ect x="152.79" y="658.80" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2310.06770" rel="noopener"><rect x="190.22" y="658.80" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2310.06770" rel="noopener"><rect x="190.22" y="658.80" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2310.06770" rel="noopener"><rect x="237.50" y="658.80" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2310.06770" rel="noopener"><rect x="237.50" y="658.80" width="72.30" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="183.21" y="687.20" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="220.64" y="687.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="220.64" y="687.20" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="267.92" y="687.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="267.92" y="687.20" width="71.53" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="153.85" y="715.60" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="191.28" y="715.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="191.28" y="715.60" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="238.56" y="715.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="238.56" y="715.60" width="73.36" height="10.00" fill= <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="432.98" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">154</text><text x="72.00" y="393.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="393.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 119.43 124.27 129.11 134.45 139.76 148.90 154.52 156.89 161.73 165.38 167.48" y="393.66" font-size="9.00" class="sc-lorabold">8.3.A] DeepSWE v1.1</text><text x="173.50" y="393.66" font-size="9.00" class="sc-notoserifcjksc">在不同推理强度（</text><text x="245.50 249.34 254.20 258.84 263.01 268.27 273.73 276.26 281.73 286.70 289.07 293.95 297.08 300.08 305.34 309.30" y="393.66" font-size="9.00" class="sc-loraregular">reasoning effort</text><text x="312.79" y="393.66" font-size="9.00" class="sc-notoserifcjksc">）档位下的得分与每任务平均成本的关系。</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="455.63" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="143.25" y="455.63" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14 175.83 182.26 188.35 195.02 198.29 202.55 205.64 212.07" y="455.63" font-size="11.00" class="sc-loraregular">Cognition</text><text x="221.64" y="455.63" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54" y="455.63" font-size="11.00" class="sc-loraregular">150</text><text x="409.26" y="455.63" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源</text><text x="72.00" y="471.25" font-size="11.00" class="sc-notoserifcjksc">自开源代码仓库中的真实拉取请求（</text><text x="248.00 254.57 261.13 264.13 267.12 270.01 274.70 280.60 286.94 293.51 299.47 304.56" y="471.25" font-size="11.00" class="sc-loraregular">pull request</text><text x="308.82" y="471.25" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="377.71" y="471.25" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="426.81" y="471.25" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="451.71 460.38 466.35 472.75 477.84 484.28 490.13 495.96 501.84" y="471.25" font-size="11.00" class="sc-loraregular">websocket</text><text x="508.99" y="471.25" font-size="11.00" class="sc-notoserifcjksc">缺</text><text x="72.00" y="486.87" font-size="11.00" class="sc-notoserifcjksc">陷、加固</text><text x="118.89" y="486.87" font-size="11.00" class="sc-loraregular">Prisma</text><text x="156.91" y="486.87" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包产物，或扩展</text><text x="291.80 295.90 302.14 310.78 319.16 322.05 327.15 333.00 339.59 345.55 355.38" y="486.87" font-size="11.00" class="sc-loraregular">JSON schema</text><text x="363.95" y="486.87" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="377.84 380.84 383.93 390.51" y="486.87" font-size="11.00" class="sc-loraregular">lint</text><text x="397.66" y="486.87" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务为智能体提供</text><text x="72.00" y="502.49" font-size="11.00" class="sc-notoserifcjksc">一个已检出的代码仓库和一条</text><text x="217.89" y="502.49" font-size="11.00" class="sc-loraregular">issue</text><text x="246.59" y="502.49" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自主工作，产出最终补</text><text x="72.00" y="518.11" font-size="11.00" class="sc-notoserifcjksc">丁，过程中没有人工干预，也不提供任何超时信息。补丁依据阻断性功能标准（主要是留出的单</text><text x="72.00" y="533.73" font-size="11.00" class="sc-notoserifcjksc">元测试）以及加权评分细则标准进行评分，其中包括由模型评分的检查项，用于检查所需的测试</text><text x="72.00" y="549.35" font-size="11.00" class="sc-notoserifcjksc">覆盖率和禁止的实现模式。任务由底层代码仓库的维护者编写，并经</text><text x="404.89 412.58 419.02 425.10 431.78 435.04 439.30 442.39 448.83" y="549.35" font-size="11.00" class="sc-loraregular">Cognition</text><text x="458.40" y="549.35" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审</text><text x="72.00" y="564.97" font-size="11.00" class="sc-notoserifcjksc">核，其中随机抽取的一部分任务经人工求解，以验证公平性。我们以</text><text x="404.89 414.73 420.67 426.34 433.02 441.78" y="564.97" font-size="11.00" class="sc-loraregular">mean@5</text><text x="450.66" y="564.97" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="580.59" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="143.25" y="580.59" font-size="11.00" class="sc-notoserifcjksc">的总分，这是一个综合指标，依据阻断性功能标准（留出的单元测试）以及加权的</text><text x="72.00" y="596.21" font-size="11.00" class="sc-notoserifcjksc">代码质量评分细则标准对每个补丁进行评分。</text><text x="72.00" y="682.86" font-size="11.00" class="sc-notoserifcjksc">注：在</text><text x="107.89 114.48 117.57 123.92" y="682.86" font-size="11.00" class="sc-loraregular">high</text><text x="133.40" y="682.86" font-size="11.00" class="sc-notoserifcjksc">推理强度以上，</text><text x="210.40 216.32 221.01 227.44 234.02 238.28 241.37 247.33 252.09 259.78 266.22 272.79" y="682.86" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="281.65" y="682.86" font-size="11.00" class="sc-notoserifcjksc">得分出现下降。这反映出</text><text x="405.54" y="682.86" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="444.28" y="682.86" font-size="11.00" class="sc-notoserifcjksc">在这些推理强度档</text><text x="72.00" y="698.48" font-size="11.00" class="sc-notoserifcjksc">位下倾向于做出超出任务所需的修改（例如重构或进行其他改进代码库的编辑）。该评估的设计</text><text x="72.00" y="714.10" font-size="11.00" class="sc-notoserifcjksc">围绕</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">编写无需人工修改即可合并的代码</text><text x="239.89 246.47 249.56 253.39" y="82.61" font-size="11.00" class="sc-loraregular">diff</text><text x="260.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">展开，因此其评分模型会惩罚可能不必要的超出范围的修</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">改，即使这些修改质量很高或有所帮助。我们发现，在提示词中加入一条简短指令、告诉模型保</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">持在任务范围之内，就能在大多数此类任务上恢复表现，表明这主要并非模型自身的局限。不</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">过，我们在此基准上报告的</text><text x="206.89" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="245.64" y="129.47" font-size="11.00" class="sc-notoserifcjksc">得分既未采用这一提示词修改，也未对官方评估做任何改</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">动。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="124.64 130.55 135.24 141.67 148.25 152.51 155.60 161.56 166.33 174.01 180.45 187.03" y="195.95" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="192.99" y="195.95" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.99" y="195.95" font-size="11.00" class="sc-loraregular">Main</text><text x="229.53" y="195.95" font-size="11.00" class="sc-notoserifcjksc">）上排名第</text><text x="287.42" y="195.95" font-size="11.00" class="sc-loraregular">2</text><text x="293.33" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，得分</text><text x="329.22" y="195.95" font-size="11.00" class="sc-loraregular">53.4%</text><text x="359.58" y="195.95" font-size="11.00" class="sc-notoserifcjksc">（每个模型均采用其最佳推理强</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">度），优于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="212.89" y="211.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="223.89" y="211.57" font-size="11.00" class="sc-loraregular">46.5%</text><text x="254.48" y="211.57" font-size="11.00" class="sc-notoserifcjksc">），并领先</text><text x="312.37 320.74 327.41 333.74 339.12 345.12 347.71 354.07 356.97 363.20 369.64" y="211.57" font-size="11.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="372.63" y="211.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="383.63 389.59 394.18 396.89 402.88" y="211.57" font-size="11.00" class="sc-loraregular">47.5%</text><text x="412.45" y="211.57" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="434.45" y="211.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="473.19" y="211.57" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="227.19" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="140.35" y="227.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="151.35 158.20 164.03 168.28 174.24 180.92 187.50 193.41" y="227.19" font-size="11.00" class="sc-loraregular">Extended</text><text x="199.99" y="227.19" font-size="11.00" class="sc-notoserifcjksc">）上同样排名第</text><text x="279.88" y="227.19" font-size="11.00" class="sc-loraregular">2</text><text x="285.79" y="227.19" font-size="11.00" class="sc-notoserifcjksc">，得分</text><text x="321.68 328.04 334.16 336.76 343.12" y="227.19" font-size="11.00" class="sc-loraregular">63.6%</text><text x="352.69" y="227.19" font-size="11.00" class="sc-notoserifcjksc">，优 c">在</text><text x="72.00 76.84 80.68 85.94 91.32 94.81 97.34 102.21 106.11 112.40 117.67 123.05 127.93 130.29 134.84 138.11 140.33" y="336.13" font-size="9.00" class="sc-loraregular">FrontierCode v1.1</text><text x="145.97" y="336.13" font-size="9.00" class="sc-notoserifcjksc">扩展集上、于各模型五种推理强度设置下的得分；</text><text x="343.97 348.81 352.65 357.91 363.29 366.78 369.31 374.18 378.08 384.37 389.64 395.02 399.90 402.26 406.81 410.09 412.30" y="336.13" font-size="9.00" class="sc-loraregular">FrontierCode v1.1</text><text x="417.94" y="336.13" font-size="9.00" class="sc-notoserifcjksc">是一项由</text><text x="456.31 462.60 467.87 472.84 478.31 480.98 484.46 486.99 492.26" y="336.13" font-size="9.00" class="sc-loraregular">Cognition</text><text x="500.09" y="336.13" font-size="9.00" class="sc-notoserifcjksc">运行并评</text><text x="72.00" y="347.83" font-size="9.00" class="sc-notoserifcjksc">分的编程评估。</text><text x="135.00 141.29 143.74 148.33 153.70 159.08 163.96 166.33 173.48 178.85 184.22 188.39 190.76" y="347.83" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="198.03" y="347.83" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="209.39 217.44 222.27 227.65 230.18 235.56" y="347.83" font-size="9.00" class="sc-loraregular">medium</text><text x="245.97" y="347.83" font-size="9.00" class="sc-notoserifcjksc">推理强度下取得其最佳扩展集得分</text><text x="383.34 388.54 393.55 395.68" y="347.83" font-size="9.00" class="sc-loraregular">63.6</text><text x="400.88" y="347.83" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.46 120.30 126.26 132.94 138.79 145.38 148.27 153.83 160.48 163.19" y="440.33" font-size="11.00" class="sc-loraregular">FrontierBench v0.1</text><text x="170.09" y="440.33" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="183.98 190.48 196.44 201.21 211.04 214.13 220.81 226.48 229.48 234.85 241.70 247.66 254.34 260.19 266.78 269.67 275.58 278.28" y="440.33" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.1</text><text x="285.18" y="440.33" font-size="11.00" class="sc-notoserifcjksc">的后继基准，由同一团队开发。它是一套更新的测试</text><text x="72.00" y="455.95" font-size="11.00" class="sc-notoserifcjksc">集，包含</text><text x="118.89 123.81" y="455.95" font-size="11.00" class="sc-loraregular">74</text><text x="132.67" y="455.95" font-size="11.00" class="sc-notoserifcjksc">个更难的任务，更加侧重科学与工程问题，例如计算生物学、物理仿真、</text><text x="484.67 492.24 499.13" y="455.95" font-size="11.00" class="sc-loraregular">CAD</text><text x="507.33" y="455.95" font-size="11.00" class="sc-notoserifcjksc">、形式</text><text x="72.00" y="471.57" font-size="11.00" class="sc-notoserifcjksc">化证明以及</text><text x="129.89" y="471.57" font-size="11.00" class="sc-loraregular">GPU</text><text x="156.10" y="471.57" font-size="11.00" class="sc-notoserifcjksc">性能优化工作。它在终端和命令行容器化环境中测试</text><text x="411.99" y="471.57" font-size="11.00" class="sc-loraregular">AI</text><text x="425.45" y="471.57" font-size="11.00" class="sc-notoserifcjksc">模型完成真实世界工作</text><text x="72.00" y="487.19" font-size="11.00" class="sc-notoserifcjksc">的能力。除表</text><text x="140.89" y="487.19" font-size="11.00" class="sc-loraregular">8.1.A</text><text x="166.27" y="487.19" font-size="11.00" class="sc-notoserifcjksc">中由</text><text x="191.16 199.65 205.33 210.05 216.45 222.89" y="487.19" font-size="11.00" class="sc-loraregular">Harbor</text><text x="230.54" y="487.19" font-size="11.00" class="sc-notoserifcjksc">运行的评估外，我们在此还报告我们自己在</text><text x="442.44" y="487.19" font-size="11.00" class="sc-loraregular">GKE</text><text x="468.06" y="487.19" font-size="11.00" class="sc-notoserifcjksc">后端上使用</text><text x="72.00 81.83 84.93 91.60 94.69 100.07 106.31 117.25 123.88 129.26 134.93 140.96 146.92 153.50" y="502.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">mini-SWE-agent</text><text x="160.65" y="502.81" font-size="11.00" class="sc-notoserifcjksc">运行框架进行的评估。</text><text x="72.00" y="569.85" font-size="11.00" class="sc-notoserifcjksc"> size="11.00" class="sc-notoserifcjksc">的</text><text x="455.06 461.95 468.56" y="98.23" font-size="11.00" class="sc-loraregular">API</text><text x="475.14" y="98.23" font-size="11.00" class="sc-notoserifcjksc">调用，同样</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">回退至</text><text x="107.89" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="152.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="148.39" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">我们还报告了</text><text x="147.16 156.29 163.56 170.47 176.34 182.88 185.71 192.65 195.80 202.61 209.63 212.89 216.05 222.44 227.45 230.40 236.94" y="148.39" font-size="12.00" class="sc-loraregular" fill="#1d1c1d">GPT-5.6 Sol 37.5%</text><text x="250.54" y="148.39" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">的平均奖励，它以</text><text x="349.69" y="148.39" font-size="12.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="374.45" y="148.39" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">推理强度运行（其最佳结果），</text><text x="72.00" y="165.43" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">同样使用</text><text x="123.16 130.36 137.56 144.76 151.96 159.16 166.36 173.56 180.76 187.96 195.16 202.36 209.56 216.76" y="165.43" font-size="12.00" class="sc-robotomonoregular" fill="#188038">mini-swe-agent</text><text x="223.97" y="165.43" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">，并同样使用与所有其他测试相同的</text><text x="419.13" y="165.43" font-size="12.00" class="sc-loraregular" fill="#1d1c1d">GKE</text><text x="491.38" y="165.43" font-size="12.00" class="sc-notoserifcjksc" fill="#0000ff">以保持比</text><text x="72.00" y="182.47" font-size="12.00" class="sc-notoserifcjksc" fill="#0000ff">较公平</text><text x="108.00" y="182.47" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">。</text><text x="120.00 129.13 136.40 143.32 149.18 155.72 158.56 165.49 168.65 175.45 182.47" y="182.47" font-size="12.00" class="sc-loraregular" fill="#1d1c1d">GPT-5.6 Sol</text><text x="188.89" y="182.47" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">在本评估中从未触发安全分类器，因此既未配置也不需要回退模</text><text x="72.00" y="199.51" font-size="12.00" class="sc-notoserifcjksc" fill="#1d1c1d">型。</text><text x="171.00 174.68 184.73" y="260.34" font-size="11.00" class="sc-loraregular">IMO</text><text x="193.46" y="260.34" font-size="11.00" class="sc-notoserifcjksc">）是一项面向尚未进入大学的学生的证明题竞赛，共六道题，分两天进</text><text x="72.00" y="291.58" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 91.27 97.51 104.40 114.44" y="291.58" font-size="11.00" class="sc-loraregular">USAMO</text><text x="188.68 196.37 199.36 204.97 211.54 218.11" y="291.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="226.97" y="291.58" font-size="11.00" class="sc-notoserifcjksc">模型曾在该竞赛上接受评估。</text><text x="369.97 375.88 382.63 388.54" y="291.58" font-size="11.00" class="sc-loraregular">2026</text><text x="397.79" y="291.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="411.68 415.37 425.41" y="291.58" font-size="11.00" class="sc-loraregular">IMO</text><text x="437.04" y="291.58" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="450.93 456.84 463.59 469.50" y="291.58" font-size="11.00" class="sc-loraregular">2026</text><text x="478.75" y="291.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="492.64" y="291.58" font-size="11.00" class="sc-loraregular">7</text><text x="500.60" y="291.58" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="514.50" y="291.58" font-size="11.00" class="sc-loraregular">15–</text><text x="72.00" y="307.20" font-size="11.00" class="sc-loraregular">16</text><text x="85.25" y="307.20" font-size="11.00" class="sc-notoserifcjksc">日举行。</text><text x="72.00" y="357.50" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 100.58 110.62" y="357.50" font-size="11.00" class="sc-loraregular">IMO</text><text x="122.25" y="357.50" font-size="11.00" class="sc-notoserifcjksc">的解答是证明而非简短答案，评分可能具有挑战性且带有主观性。对于每道题，我们让</text><text x="72.00" y="373.12" font-size="11.00" class="sc-notoserifcjksc">一个模型编写评分细则，并对照公开的参考解答对其进行核查。随后，</text><text x="413.00 420.69 423.68 429.29 435.86 442.44 448.40 451.29 460.02 466.59 473.16 478.25 481.14" y="373.12" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="490.03" y="373.12" font-size="11.00" class="sc-notoserifcjksc">的每份解</text><text x="72.00" y="388.74" font-size="11.00" class="sc-notoserifcjksc">答由三个前沿模型（</text><text x="171.00 179.37 185.33 195.17 198.26 204.93 208.03 210.92 217.05 219.75 223.76 226.65 233.32 238.00" y="388.74" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="244.44" y="388.74" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="255.44 263.12 266.12 271.73 278.29 284.87 290.83 293.73 302.46 309.03 315.60 320.69 323.58 329.54 332.14" y="388.74" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="341.39" y="388.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="355.28 362.97 365.96 371.57 378.14 384.72 390.68 393.57 403.51 409.37 413.63 420.22 426.65 431.74 434.64 441.30 445.99 451.90 457.45 460.54 466.46" y="388.74" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="475.27" y="388.74" font-size="11.00" class="sc-notoserifcjksc">）组成的评</text><text x="72.00" y="404.36" font-size="11.00" class="sc-notoserifcjksc">审小组依据这些评分细则独立评判。只有当三名评判者一致同意时，答案才计为正确。</text><text x="72.00" y="470.84" font-size="11.00" class="sc-notoserifcjksc">我们提示</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04" y="470.84" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="195.93" y="470.84" font-size="11.00" class="sc-notoserifcjksc">在不使用任何智能体运行框架或工具的情况下解答</text><text x="440.82 444.50 454.55 463.28 466.17 472.08 478.84 484.74" y="470.84" font-size="11.00" class="sc-loraregular">IMO 2026</text><text x="493.99" y="470.84" font-size="11.00" class="sc-notoserifcjksc">的每道</text><text x="72.00" y="486.46" font-size="11.00" class="sc-notoserifcjksc">题，并指示它给出严谨、自成一体的证明。我们设定了</text><text x="338.89 344.80 350.80 357.15 359.76 366.59 373.42 380.25 383.15 387.40 393.84 399.67 405.63" y="486.46" font-size="11.00" class="sc-loraregular">256,000 token</text><text x="415.21" y="486.46" font-size="11.00" class="sc-notoserifcjksc">的输出上限，并在</text><text x="506.10" y="486.46" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="528.80" y="486.46" font-size="11.00" class="sc-notoserifcjksc">推</text><text x="72.00" y="502.08" font-size="11.00" class="sc-notoserifcjksc">理强度下使用自适应思考。耗尽输出上限的尝试会以较低的推理强度重新采样；其中有一份解答</text><text x="72.00" y="568.53" font-size="11.00" class="sc-notoserifcjksc">我们让</text><text x="107.89" y="568.53" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64" y="568.53" font-size="11.00" class="sc-notoserifcjksc">为六道题各生成四份独立解答。模型评审小组判定全部</text><text x="413.53 419.19" y="568.53" font-size="11.00" class="sc-loraregular">24</text><text x="72.00" y="584.15" font-size="11.00" class="sc-notoserifcjksc">评审小组的评分，我们请人类专家为每道题批改一份预先指定的解答（即答卷包中的第一份）。</text><text x="72.00" y="599.77" font-size="11.00" class="sc-notoserifcjksc">这些专家同样判定每份解答均正确，并依据</text><text x="283.89 287.58 297.62" y="599.77" font-size="11.00" class="sc-loraregular">IMO</text><text x="309.25" y="599.77" font-size="11.00" class="sc-notoserifcjksc">评分细则各给出</text><text x="389.14" y="599.77" font-size="11.00" class="sc-loraregular">7</text><text x="397.11" y="599.77" font-size="11.00" class="sc-notoserifcjksc">分（满分</text><text x="444.00" y="599.77" font-size="11.00" class="sc-loraregular">7</text><text x="451.96" y="599.77" font-size="11.00" class="sc-notoserifcjksc">分）。</text><text x="484.96" y="599.77" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="523.70" y="599.77" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="615.39" font-size="11.00" class="sc-notoserifcjksc">最终得分</text><text x="118.89 124.86 130.51 137.63 143.59" y="615.39" font-size="11.00" class="sc-loraregular">42/42</text><text x="276.28 282.19 288.94 294.85" y="615.39" font-size="11.00" class="sc-loraregular">2026</text><text x="304.10" y="615.39" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="317.99 323.90 329.71 336.83 342.79" y="615.39" font-size="11.00" class="sc-loraregular">29/42</text><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="491.38" y="155.83" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="491.38" y="155.83" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="503.38" y="155.83" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="503.38" y="155.83" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="515.38" y="155.83" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="515.38" y="155.83" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="527.38" y="155.83" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="527.38" y="155.83" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="539.38" y="155.83" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="72.00" y="172.87" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="84.00" y="172.87" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="84.00" y="172.87" width="12.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="96.00" y="172.87" width="0.00" height="12.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="96.00" y="172.87" width="12.00" height="12.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p158.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 158 页"><text x="72.00 80.93 84.30 92.13 95.77 104.62 108.31 116.94 131.48 140.97 150.05 159.13 167.94 176.58 185.66 194.05" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.7 RiemannBench</text><text x="72.00 80.93 84.30 93.23 96.86 106.62 111.99 118.97 122.67 130.73 143.07 152.55 157.76" y="547.58" font-size="14.00" class="sc-poppinsmedium">8.8 ArxivMath</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">158</text><text x="72.00 78.91 82.00 87.96 97.80 103.47 110.15 116.76 123.60 129.56 136.24 142.09" y="118.54" font-size="11.00" class="sc-loraregular">RiemannBench</text><text x="151.57" y="118.54" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="176.47 182.64 189.21 193.91 199.94 205.90 208.80 215.68" y="118.54" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="222.26" y="118.54" font-size="11.00" class="sc-notoserifcjksc">开发的私有基准测试，包含</text><text x="357.15" y="118.54" font-size="11.00" class="sc-loraregular">25</text><text x="371.95" y="118.54" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="393.95" y="114.87" font-size="6.60" class="sc-loraregular">15</text><text x="399.95" y="118.54" font-size="11.00" class="sc-notoserifcjksc">，涵盖数学中的研究级主</text><text x="72.00" y="134.16" font-size="11.00" class="sc-notoserifcjksc">题。题目由数学教授、研究生以及拥有博士学位的</text><text x="316.89 320.58 330.62" y="134.16" font-size="11.00" class="sc-loraregular">IMO</text><text x="72.00" y="149.78" font-size="11.00" class="sc-notoserifcjksc">围的、持续的多步理论推理。每道题都有唯一的闭式答案，并经程序化验证。</text><text x="72.00" y="497.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="497.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 93.82 97.48 99.58 105.11 108.58 110.95 117.13 120.07 124.91 133.19 137.91 143.65 149.34 155.29 160.13 165.87 170.53" y="497.03" font-size="9.00" class="sc-lorabold">8.7.A] RiemannBench</text><text x="178.49" y="497.03" font-size="9.00" class="sc-notoserifcjksc">各</text><text x="189.85 196.15 198.59 203.18 208.56 213.94" y="497.03" font-size="9.00" class="sc-loraregular">Claude</text><text x="221.18" y="497.03" font-size="9.00" class="sc-notoserifcjksc">模型在使用工具和不使用工具情况下的得分。所有模型均以</text><text x="457.55" y="497.03" font-size="9.00" class="sc-loraregular">max</text><text x="477.38" y="497.03" font-size="9.00" class="sc-notoserifcjksc">推理强度运行。</text><text x="72.00 78.89 82.97 90.11 93.20 98.54 108.64 114.24 118.50" y="570.23" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="127.98" y="570.23" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87 162.97 168.57 172.83 179.42 186.30 190.99 196.95 203.63" y="570.23" font-size="11.00" class="sc-loraregular">MathArena</text><text x="212.20" y="570.23" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准。题目每月从近期</text><text x="468.09 473.76 477.85 484.98 488.08" y="570.23" font-size="11.00" class="sc-loraregular">arXiv</text><text x="496.52" y="570.23" font-size="11.00" class="sc-notoserifcjksc">论文摘要</text><text x="72.00" y="585.85" font-size="11.00" class="sc-notoserifcjksc">中提取，随后经过自动与人工检查筛选，以确保其自成一体、非平凡且可验证。由于题目取自活</text><text x="72.00" y="601.47" font-size="11.00" class="sc-notoserifcjksc">跃的研究，该基准比竞赛或奥赛类基准更贴近现实，也与数学研究联系更为紧密。</text><text x="72.00" y="700.46" font-size="6.00" class="sc-loraregular">15</text><text x="80.08" y="703.79" font-size="10.00" class="sc-notoserifcjksc">在评估过程中，我们发现并修正了参考答案和评分中的一些小问题；所有结果均依据修正后的设置评分。</text><text x="72.00" y="717.99" font-size="10.00" class="sc-notoserifcjksc">得分为每道题</text><text x="134.63" y="717.99" font-size="10.00" class="sc-loraregular">4</text><text x="142.68" y="717.99" font-size="10.00" class="sc-notoserifcjksc">次尝试的平均值。</text></svg></div>

36 144.04 148.72 152.43" y="468.16" font-size="9.00" class="sc-lorabold">8.8.A] ArxivMath</text><text x="158.02" y="468.16" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="167.02" y="468.16" font-size="9.00" class="sc-lorabold">2026</text><text x="189.88" y="468.16" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="201.25" y="468.16" font-size="9.00" class="sc-lorabold">6</text><text x="208.79" y="468.16" font-size="9.00" class="sc-notoserifcjkscbold">月）准确率得分。</text><text x="280.79 287.08 289.53 294.12 299.49 304.88 309.75 312.12 319.27 324.64 330.01 334.18 336.55" y="468.16" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="341.45" y="468.16" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="350.45 356.74 359.19 363.78 369.15 374.54 379.41 381.78 389.91 394.70 398.19 403.58 408.84 413.01 415.38" y="468.16" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="422.65" y="468.16" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="434.02 440.31 442.76 447.35 452.72 458.10 462.98 465.35 472.49 477.86 483.24 487.40 489.77 494.65 496.86" y="468.16" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="504.29" y="468.16" font-size="9.00" class="sc-notoserifcjksc">以</text><text x="515.66" y="468.16" font-size="9.00" class="sc-loraregular">max</text><text x="72.00" y="479.86" font-size="9.00" class="sc-notoserifcjksc">推理强度进行了内部评估；其他得分来自</text><text x="236.37 244.63 249.21 252.69 258.08 263.72 267.55 272.43 277.89" y="479.86" font-size="9.00" class="sc-loraregular">MathArena</text><text x="284.90" y="479.86" font-size="9.00" class="sc-notoserifcjksc">排行榜</text><text x="311.90" y="476.86" font-size="5.40" class="sc-loraregular">16</text><text x="316.99" y="479.86" font-size="9.00" class="sc-notoserifcjksc">。除</text><text x="337.36 343.65 346.10 350.69 356.06 361.44 366.32 368.69 375.83 381.21 386.58 390.75 393.11" y="479.86" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="398.02" y="479.86" font-size="9.00" class="sc-notoserifcjksc">（使用工具）外，其他得分均为无</text><text x="72.00" y="491.56" font-size="9.00" class="sc-notoserifcjksc">法使用工具时的结果。</text><text x="72.00" y="528.06" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="528.06" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="594.45" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92" y="590.78" font-size="6.60" class="sc-loraregular">17</text><text x="156.26" y="594.45" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准，包含</text><text x="346.15" y="594.45" font-size="11.00" class="sc-loraregular">200</text><text x="368.62" y="594.45" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。在仅获得一个由</text><text x="72.00" y="610.07" font-size="11.00" class="sc-notoserifcjksc">开源项目编译而成的二进制文件及该项目文档的情况下，智能体必须在不使用互联网访问或反编</text><text x="72.00" y="625.69" font-size="11.00" class="sc-notoserifcjksc">译工具的前提下，重建一个能复现原程序行为的代码库。任务</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">16</text><text x="80.28" y="678.20" font-size="10.00" class="sc-notoserifcjksc">对于</text><text x="102.91 109.90 112.62 117.72 123.69 129.67 135.09 137.72 145.66 151.63 157.60 162.23 164.86 170.28 172.74" y="678.20" font-size="10.00" class="sc-loraregular">Claude Opus 4.8</text><text x="178.36" y="678.20" font-size="10.00" class="sc-notoserifcjksc">，我们的内部评估得出的分数高于</text><text x="330.99 340.17 345.26 349.13 355.12 361.38 365.64 371.06 377.13" y="678.20" font-size="10.00" class="sc-loraregular">MathArena</text><text x="384.92" y="678.20" font-size="10.00" class="sc-notoserifcjksc">排行榜上的分数。</text><text x="72.00" y="689.06" font-size="6.00" class="sc-loraregular">17</text><text x="79.58 85.43 90.59 96.66 102.19 104.71 107.34 110.86 113.32 115.84 118.47 123.82 127.69 130.32 135.48 138.20 140.66 143.29 146.34 151.71 157.85 163.22 168.88 171. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p160.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 160 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 103.98 107.36 116.52 122.29" y="367.79" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 HLE</text><text x="72.00" y="713.04" font-size="6.00" class="sc-loraregular">18</text><text x="80.18 86.18 92.17 97.33 103.40 105.92 108.55 114.33 116.79 119.32 121.95 127.30 131.16 133.79 138.95 141.67 144.13 146.76 149.81 155.18 161.31 166.68 172.13 175.18 177.64 180.27 187.87 193.84 202.78 207.93 214.00 216.97 220.86 226.14 227.70 232.32 234.95 240.95 246.11 250.74 254.61 257.23 263.45 268.75 273.91 282.84 285.30 287.93 293.09 296.80 303.29 306.10 311.14 313.64 319.01 324.46 330.67 334.30 336.76 340.40 345.82 350.97 356.39 362.00" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="367.09 372.99 376.96 380.83 386.79 391.42 393.92 397.61 404.07 409.22 413.55 418.85 421.66 426.32 428.78 434.62 438.90 444.43 450.89 456.04 461.86 466.14 473.04 478.41 483.85 490.06 493.70 496.16 499.80 505.21 510.36 515.78" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">160</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">涵盖从小型终端工具（</text><text x="182.00" y="82.61" font-size="11.00" class="sc-loraregular">jq</text><text x="191.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="202.21 206.97 210.06 216.63 222.71 227.40 233.36" y="82.61" font-size="11.00" class="sc-loraregular">ripgrep</text><text x="239.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）到大型系统（</text><text x="316.93 322.95 328.87 338.71 345.27 351.24" y="82.61" font-size="11.00" class="sc-loraregular">FFmpeg</text><text x="357.32" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="368.32 374.55 383.21 389.57 392.84 397.09" y="82.61" font-size="11.00" class="sc-loraregular">SQLite</text><text x="403.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="414.06 420.67 429.25" y="82.61" font-size="11.00" class="sc-loraregular">PHP</text><text x="438.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">解释器）。提交结果</text><text x="324.51 330.17 336.13 340.72 343.33 350.16 356.99" y="98.23" font-size="11.00" class="sc-loraregular">247,000</text><text x="366.72" y="98.23" font-size="11.00" class="sc-notoserifcjksc">多个此类测试，通过智能体驱动的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模糊测试生成。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="147.38" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="147.38" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试集上得分低于</text><text x="378.77 385.42 388.13" y="147.38" font-size="11.00" class="sc-loraregular">0.9</text><text x="397.38" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的任务（表明测试不稳定），</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">剩余</text><text x="96.89" y="163.00" font-size="11.00" class="sc-loraregular">166</text><text x="116.51" y="163.00" font-size="11.00" class="sc-notoserifcjksc">个任务；在这些任务中，我们只依据参考二进制文件能够通过的测试进行评分。我们报</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">告</text><text x="85.89" y="178.62" font-size="11.00" class="sc-loraregular">5</text><text x="94.78" y="178.62" font-size="11.00" class="sc-notoserifcjksc">个回合的隐藏测试通过率，每个回合都在上一回合的代码库基础上继续，并拥有最多</text><text x="504.67" y="178.62" font-size="11.00" class="sc-loraregular">100</text><text x="525.23" y="178.62" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00 76.26 82.69 88.52 94.48" y="194.24" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的全新上下文预算。在该集合上，</text><text x="269.05 276.74 279.73 285.35 291.91 298.49 304.45 307.35 316.08 322.65 329.21 334.31 337.20" y="194.24" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="346.09" y="194.24" font-size="11.00" class="sc-notoserifcjksc">在第一个回合后得分</text><text x="447.98" y="194.24" font-size="11.00" class="sc-loraregular">83%</text><text x="469.86" y="194.24" font-size="11.00" class="sc-notoserifcjksc">，到第五个回</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">合时提升至</text><text x="129.89" y="209.86" font-size="11.00" class="sc-loraregular">93%</text><text x="151.95" y="209.86" font-size="11.00" class="sc-notoserifcjksc">。作为参照，</text><text x="217.95 225.64 228.63 234.24 240.81 247.38 253.35 256.24 264.97 271.54 278.11 283.20 286.09 292.06 294.76" y="209.86" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="303.84" y="209.86" font-size="11.00" class="sc-notoserifcjksc">在第一个回合得分</text><text x="394.73" y="209.86" font-size="11.00" class="sc-loraregular">80%</text><text x="417.31" y="209.86" font-size="11.00" class="sc-notoserifcjksc">，到第</text><text x="453.21" y="209.86" font-size="11.00" class="sc-loraregular">5</text><text x="462.09" y="209.86" font-size="11.00" class="sc-notoserifcjksc">个回合升至</text><text x="72.00" y="225.48" font-size="11.00" class="sc-loraregular">90%</text><text x="94.76" y="225.48" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="105.76 115.69 121.56 125.81 132.40 138.84 143.93 146.82" y="225.48" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="155.71" y="225.48" font-size="11.00" class="sc-notoserifcjksc">则分别为</text><text x="202.60" y="225.48" font-size="11.00" class="sc-loraregular">84%</text><text x="227.21" y="225.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="241.10" y="225.48" font-size="11.00" class="sc-loraregular">93%</text><text x="263.16" y="225.48" font-size="11.00" class="sc-notoserifcjksc">。我们认为</text><text x="321.05 327.72 332.40 338.84 344.92 349.61 355.28 365.05 371.89 377.86 384.53 390.38" y="225.48" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="399.87" y="225.48" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程表现的</text><text x="72.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">有力指标：</text><text x="127.00" y="241.10" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="165.74" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了直至完整</text><text x="289.64" y="241.10" font-size="11.00" class="sc-loraregular">100</text><text x="310.19" y="241.10" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="324.09 328.34 334.78 340.61 346.57" y="241.10" font-size="11.00" class="sc-loraregular">token</text><text x="356.14" y="241.10" font-size="11.00" class="sc-notoserifcjksc">窗口的一系列上下文长度，且这些任</text><text x="72.00" y="256.72" font-size="11.00" class="sc-notoserifcjksc">务所测试的长上下文能力与实际下游用例高度契合。</text><text x="72.00" y="326.89" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.12 112.39 116.67 122.48 124.19 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="391.65" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="391.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="391.65" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="391.65" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="387.98" font-size="6.60" class="sc-loraregular">18</text><text x="237.67" y="391.65" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含跨越数十个学科的</text><text x="471.56 477.47 480.24 486.23 493.06" y="391.65" font-size="11.00" class="sc-loraregular">2,500</text><text x="502.80" y="391.65" font-size="11.00" class="sc-notoserifcjksc">道题，</text><text x="72.00" y="407.27" font-size="11.00" class="sc-notoserifcjksc">旨在让即便是领域专家也难以作答，且无法通过互联网搜索快速得到答案。</text><text x="72.00" y="456.64" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04" y="456.64" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="270.03" y="456.64" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="292.03" y="456.64" font-size="11.00" class="sc-loraregular">1</text><text x="296.04" y="456.64" font-size="11.00" class="sc-notoserifcjksc">）不使用工具的纯推理；（</text><text x="428.04" y="456.64" font-size="11.00" class="sc-loraregular">2</text><text x="433.94" y="456.64" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、网</text><text x="72.00" y="472.26" font-size="11.00" class="sc-notoserifcjksc">页抓取、程序化工具调用和代码执行。在所有运行中，思考均设为</text><text x="393.89 399.50 406.07 410.33" y="472.26" font-size="11.00" class="sc-loraregular">auto</text><text x="416.76" y="472.26" font-size="11.00" class="sc-notoserifcjksc">，且各上下文累计使用的</text><text x="72.00 76.26 82.69 88.52 94.48" y="487.88" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="487.88" font-size="11.00" class="sc-notoserifcjksc">总量上限为</text><text x="161.95" y="487.88" font-size="11.00" class="sc-loraregular">100</text><text x="182.51" y="487.88" font-size="11.00" class="sc-notoserifcjksc">万。这些结果未使用上下文压缩（</text><text x="347.51 353.30 359.74 369.57 376.14 381.81 387.61 391.87 394.96 401.39" y="487.88" font-size="11.00" class="sc-loraregular">compaction</text><text x="408.07" y="487.88" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="430.07 437.76 440.75 446.36 452.93 459.51 465.47 468.36 477.10 483.66 490.23 495.32 498.22 504.18 506.77" y="487.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="516.03" y="487.88" font-size="11.00" class="sc-notoserifcjksc">担任</text><text x="72.00" y="503.50" font-size="11.00" class="sc-notoserifcjksc">评分模型。</text><text x="72.00" y="553.80" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们为搜索器和抓取器都屏蔽了已知讨论</text><text x="470.89" y="553.80" font-size="11.00" class="sc-loraregular">HLE</text><text x="495.57" y="553.80" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="569.42" font-size="11.00" class="sc-notoserifcjksc">（见附录</text><text x="118.89 125.08 127.78" y="569.42" font-size="11.00" class="sc-loraregular">9.1</text><text x="131.79" y="569.42" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="211.68 219.37 222.36 227.97 234.54 241.11 247.08 249.97 258.70 265.27 271.84 276.93 279.82 285.79 288.49" y="569.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="297.57" y="569.42" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看似从</text><text x="487.46" y="569.42" font-size="11.00" class="sc-loraregular">HLE</text><text x="512.13" y="569.42" font-size="11.00" class="sc-notoserifcjksc">专门</text><text x="72.00" y="585.04" font-size="11.00" class="sc-notoserifcjksc">来源获取了答案的记录；经确认的情况会被重新评为错误。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="634.75" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="634.75" font-size="11.00" class="sc-notoserifcjksc">在任一给定价位上均优于所有其他</text><text x="316.93 324.61 327.61 333.22 339.78 346.36" y="634.75" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.22" y="634.75" font-size="11.00" class="sc-notoserifcjksc">模型。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="367.09" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p161.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 161 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">161</text><text x="72.00" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 109.06 111.16 116.69 120.17 122.54 129.57 135.14 143.42 148.13 153.87 156.78 160.50 165.46 167.18 171.55 173.92 179.35 184.07 188.43 192.15 194.52 200.13 205.07 209.78" y="390.42" font-size="9.00" class="sc-lorabold">8.10.1.A] Humanity’s Last Exam</text><text x="218.06" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="227.06" y="390.42" font-size="9.00" class="sc-lorabold">HLE</text><text x="245.38" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">）</text><text x="254.38" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="257.85" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">使用工具</text><text x="293.85" y="390.42" font-size="9.00" class="sc-lorabold">]</text><text x="299.69" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">推理强度扩展</text><text x="353.69" y="390.42" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="410.06 412.51 417.68" y="390.42" font-size="9.00" class="sc-loraregular">low</text><text x="427.26" y="390.42" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="438.62" y="390.42" font-size="9.00" class="sc-loraregular">max</text><text x="458.45" y="390.42" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="469.82" y="390.42" font-size="9.00" class="sc-loraregular">HLE</text><text x="490.01" y="390.42" font-size="9.00" class="sc-notoserifcjksc">上的准确</text><text x="72.00" y="402.12" font-size="9.00" class="sc-notoserifcjksc">率，对应每任务平均计费成本（对数刻度）。</text><text x="252.
