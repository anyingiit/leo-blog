.66 452.66 463.66 474.66 485.66 496.66 507.66 518.66 529.66" y="486.87" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务为智能体提供</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="502.49" font-size="11.00" class="sc-notoserifcjksc">一个已检出的代码仓库和一条</text><text x="217.89 220.98 226.08 231.17 237.74" y="502.49" font-size="11.00" class="sc-loraregular">issue</text><text x="246.59 257.59 268.59 279.59 290.59 301.59 312.59 323.59 334.59 345.59 356.59 367.59 378.59 389.59 400.59 411.59 422.59 433.59 444.59 455.59 466.59 477.59 488.59 499.59 510.59" y="502.49" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自主工作，产出最终补</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="518.11" font-size="11.00" class="sc-notoserifcjksc">丁，过程中没有人工干预，也不提供任何超时信息。补丁依据阻断性功能标准（主要是留出的单</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="533.73" font-size="11.00" class="sc-notoserifcjksc">元测试）以及加权评分细则标准进行评分，其中包括由模型评分的检查项，用于检查所需的测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="549.35" font-size="11.00" class="sc-notoserifcjksc">覆盖率和禁止的实现模式。任务由底层代码仓库的维护者编写，并经</text><text x="404.89 412.58 419.02 425.10 431.78 435.04 439.30 442.39 448.83" y="549.35" font-size="11.00" class="sc-loraregular">Cognition</text><text x="458.40 469.40 480.40 491.40 502.40 513.40 524.40" y="549.35" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="564.97" font-size="11.00" class="sc-notoserifcjksc">核，其中随机抽取的一部分任务经人工求解，以验证公平性。我们以</text><text x="404.89 414.73 420.67 426.34 433.02 441.78" y="564.97" font-size="11.00" class="sc-loraregular">mean@5</text><text x="450.66 461.66" y="564.97" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="580.59" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="143.25 154.25 165.25 176.25 187.25 198.25 209.25 220.25 231.25 242.25 253.25 264.25 275.25 286.25 297.25 308.25 319.25 330.25 341.25 352.25 363.25 374.25 385.25 396.25 407.25 418.25 429.25 440.25 451.25 462.25 473.25 484.25 495.25 506.25 517.25 528.25" y="580.59" font-size="11.00" class="sc-notoserifcjksc">的总分，这是一个综合指标，依据阻断性功能标准（留出的单元测试）以及加权的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="596.21" font-size="11.00" class="sc-notoserifcjksc">代码质量评分细则标准对每个补丁进行评分。</text><text x="72.00 83.00 94.00" y="682.86" font-size="11.00" class="sc-notoserifcjksc">注：在</text><text x="107.89 114.48 117.57 123.92" y="682.86" font-size="11.00" class="sc-loraregular">high</text><text x="133.40 144.40 155.40 166.40 177.40 188.40 199.40" y="682.86" font-size="11.00" class="sc-notoserifcjksc">推理强度以上，</text><text x="210.40 216.32 221.01 227.44 234.02 238.28 241.37 247.33 252.09 259.78 266.22 272.79" y="682.86" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="281.65 292.65 303.65 314.65 325.65 336.65 347.65 358.65 369.65 380.65 391.65" y="682.86" font-size="11.00" class="sc-notoserifcjksc">得分出现下降。这反映出</text><text x="405.54 414.28 420.84 427.41 432.50 435.40" y="682.86" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="444.28 455.28 466.28 477.28 488.28 499.28 510.28 521.28" y="682.86" font-size="11.00" class="sc-notoserifcjksc">在这些推理强度档</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="698.48" font-size="11.00" class="sc-notoserifcjksc">位下倾向于做出超出任务所需的修改（例如重构或进行其他改进代码库的编辑）。该评估的设计</text><text x="72.00 83.00" y="714.10" font-size="11.00" class="sc-notoserifcjksc">围绕</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">编写无需人工修改即可合并的代码</text><text x="239.89 246.47 249.56 253.39" y="82.61" font-size="11.00" class="sc-loraregular">diff</text><text x="260.00 271.00 282.00 293.00 304.00 315.00 326.00 337.00 348.00 359.00 370.00 381.00 392.00 403.00 414.00 425.00 436.00 447.00 458.00 469.00 480.00 491.00 502.00 513.00 524.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">展开，因此其评分模型会惩罚可能不必要的超出范围的修</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">改，即使这些修改质量很高或有所帮助。我们发现，在提示词中加入一条简短指令、告诉模型保</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">持在任务范围之内，就能在大多数此类任务上恢复表现，表明这主要并非模型自身的局限。不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">过，我们在此基准上报告的</text><text x="206.89 215.63 222.19 228.76 233.85 236.75" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="245.64 256.64 267.64 278.64 289.64 300.64 311.64 322.64 333.64 344.64 355.64 366.64 377.64 388.64 399.64 410.64 421.64 432.64 443.64 454.64 465.64 476.64 487.64 498.64 509.64" y="129.47" font-size="11.00" class="sc-notoserifcjksc">得分既未采用这一提示词修改，也未对官方评估做任何改</text><text x="72.00 83.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">动。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="195.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="124.64 130.55 135.24 141.67 148.25 152.51 155.60 161.56 166.33 174.01 180.45 187.03" y="195.95" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="192.99" y="195.95" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.99 214.09 219.76 222.85" y="195.95" font-size="11.00" class="sc-loraregular">Main</text><text x="229.53 240.53 251.53 262.53 273.53" y="195.95" font-size="11.00" class="sc-notoserifcjksc">）上排名第</text><text x="287.42" y="195.95" font-size="11.00" class="sc-loraregular">2</text><text x="293.33 304.33 315.33" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，得分</text><text x="329.22 335.22 341.35 344.05 350.01" y="195.95" font-size="11.00" class="sc-loraregular">53.4%</text><text x="359.58 370.58 381.58 392.58 403.58 414.58 425.58 436.58 447.58 458.58 469.58 480.58 491.58 502.58" y="195.95" font-size="11.00" class="sc-notoserifcjksc">（每个模型均采用其最佳推理强</text><text x="72.00 83.00 94.00 105.00 116.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">度），优于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="212.89" y="211.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="223.89 229.85 236.21 238.91 244.91" y="211.57" font-size="11.00" class="sc-loraregular">46.5%</text><text x="254.48 265.48 276.48 287.48 298.48" y 485.85" y="487.25" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.55 505.55 516.55 527.55" y="487.25" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="502.87" font-size="11.00" class="sc-notoserifcjksc">度研究基准，旨在评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="435.00 443.09 450.53 457.36 465.05" y="502.87" font-size="11.00" class="sc-loraregular">DRACO</text><text x="476.68" y="502.87" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="490.57 494.58 501.41" y="502.87" font-size="11.00" class="sc-loraregular">100</text><text x="511.13 522.13" y="502.87" font-size="11.00" class="sc-notoserifcjksc">个精</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="518.49" font-size="11.00" class="sc-notoserifcjksc">选任务组成，这些任务源自多个领域的真实用户查询。问题依据专家编写的评分细则进行评分，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="534.11" font-size="11.00" class="sc-notoserifcjksc">评分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="600.81" font-size="11.00" class="sc-notoserifcjksc">我们在启用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 397.90 404.73" y="600.81" font-size="11.00" class="sc-loraregular">100</text><text x="414.45" y="600.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="428.35 432.60 439.04 444.87 450.83" y="600.81" font-size="11.00" class="sc-loraregular">token</text><text x="460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="600.81" font-size="11.00" class="sc-notoserifcjksc">上限的条件下评</text><text x="72.00 83.00" y="616.43" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="616.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18" y="616.43" font-size="11.00" class="sc-notoserifcjksc">模型。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p166.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 166 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">166</text><text x="72.00 83.00 94.00 105.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00 83.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">原始</text><text x="96.89 104.98 112.43 119.26 126.95" y="98.23" font-size="11.00" class="sc-loraregular">DRACO</text><text x="138.57 149.57 160.57 171.57" y="98.23" font-size="11.00" class="sc-notoserifcjksc">论文使用</text><text x="185.46 193.84 199.80 209.63 212.72 219.40 222.49 225.38 231.51 234.40 241.07 245.76" y="98.23" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="255.08 266.08 277.08 288.08 299.08 310.08 321.08 332.08 343.08 354.08 365.08 376.08 387.08 398.08 409.08 420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08 508.08 519.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们的评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中，我们使用</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.30" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="188.56 199.56 210.56 221.56 232.56 243.56 254.56 265.56 276.56 287.56 298.56 309.56 320.56 331.56 342.56 353.56 364.56 375.56 386.56 397.56 408.56 419.56 430.56 441.56 452.56" y="113.85" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用相同的二元</text><text x="466.45 476.55 483.39 489.65 497.24 505.51 513.89 523.99 530.83" y="113.85" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文</text><text x="162.89 168.76 174.72 177.42" y="129.47" font-size="11.00" class="sc-loraregular">§4.2</text><text x="186.22 197.22 208.22 219.22 230.22 241.22 252.22 263.22 274.22 285.22 296.22 307.22 318.22 329.22 340.22 351.22 362.22 373.22 384.22 395.22 406.22 417.22 428.22 439.22 450.22 461.22 472.22 483.22 494.22 505.22 516.22 527.22" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我们遵循论文的实验方案，对每个回答进行五</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">次独立评分运行并报告平均值。我们的评判提示词取自论文的</text><text x="369.00 380.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="393.89 401.58 404.29" y="145.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="410.28 421.28 432.28 443.28 454.28" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="468.18" y="145.09" font-size="11.00" class="sc-loraregular">A</text><text x="477.96 488.96 499.96 510.96 521.96" y="145.09" font-size="11.00" class="sc-notoserifcjksc">表明，评判</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">模型的选择可能使绝对分数变动</text><text x="228.89 232.90 239.73 246.22 252.12" y="160.71" font-size="11.00" class="sc-loraregular">10–25</text><text x="261.01 272.01 283.01 294.01 305.01 316.01 327.01 338.01 349.01 360.01 371.01 382.01 393.01 404.01 415.01 426.01 437.01 448.01 459.01 470.01 481.01 492.01 503.01 514.01 525.01" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数不能与论文的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">主要公布数字直接比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="238.34" font-size="11.00" class="sc-notoserifcjksc">除评判模型的更换之外，与原始论文唯一的其他差异在于：我们指示模型将完整的最终报告写入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="253.96" font-size="11.00" class="sc-notoserifcjksc">其执行环境中的一个文件，并且只对该文件的内容评分，而不是对完整的智能体对话记录评分；</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="269.58" font-size="11.00" class="sc-notoserifcjksc">这样可以将交付物与中间工具输出隔离开来。此前的</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="269.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18 377.18 388.18 399.18 410.18" y="269.58" font-size="11.00" class="sc-notoserifcjksc">评估则是用</text><text x="424.08 430.68 437.28 443.88 450.48 457.08 463.68 470.28" y="269.58" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="479.78 490.78 501.78 512.78 523.78" y="269.58" font-size="11.00" class="sc-notoserifcjksc">标签标记报</text><text x="72.00 83.00 94.00 105.00 116.00" y="285.20" font-size="11.00" class="sc-notoserifcjksc">告范围；在</text><text x="129.89 136.49 143.09 149.69" y="285.20" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="159.19 170.19 181.19 192.19 203.19 214.19 225.19 236.19 247.19 258.19 269.19 280.19 291.19 302.19 313.19 324.19 335.19 346.19 357.19 368.19 379.19 390.19 401.19 412.19 423.19 434.19 445.19 456.19 467.19 478.19 489.19 500.19 511.19 522.19" y="285.20" font-size="11.00" class="sc-notoserifcjksc">推理强度下，模型偶尔会遗漏这些标签，导致完整的报告被计为空白。基于文</text><text x="72.00" y="686.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="686.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.33 112.43 117.96 121.44 123.80 130.51 136.68 142.52 148.71" y="686.21" font-size="9.00" class="sc-lorabold">8.10.4.A] DRACO</text><text x="157.99 166.99 175.99 184.99 193.99 202.99" y="686.21" font-size="9.00" class="sc-notoserifcjkscbold">推理强度扩展</text><text x="211.99 220.99" y="686.21" font-size="9.00" class="sc-notoserifcjksc">。在</text><text x="232.36 237.56" y="686.21" font-size="9.00" class="sc-loraregular">98</text><text x="244.99" y="686.21" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="256.36 259.84 265.10 269.87 274.75" y="686.21" font-size="9.00" class="sc-loraregular">token</text><text x="282.58 291.58 300.58 309.58 318.58 327.58 336.58 345.58 354.58" y="686.21" font-size="9.00" class="sc-notoserifcjksc">预算下，推理强度从</text><text x="365.95 368.40 373.57" y="686.21" font-size="9.00" class="sc-loraregular">low</text><text x="383.15" y="686.21" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="394.52 402.56 407.21" y="686.21" font-size="9.00" class="sc-loraregular">max</text><text x="414.34" y="686.21" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="425.71 432.32 438.42 444.01 450.30" y="686.21" font-size="9.00" class="sc-loraregular">DRACO</text><text x="457.44 466.44 475.44 484.44 493.44 502.44 511.44 520.44 529.44" y="686.21" font-size="9.00" class="sc-notoserifcjksc">（智能体数据分析）</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00" y="697.91" font-size="9.00" class="sc-notoserifcjksc">上的归一化分数，对应每任务平均计费成本（对数刻度）。</text><text x="306.00 312.29 314.74 319.33 324.70 330.08" y="697.91" font-size="9.00" class="sc-loraregular">Claud 0.62 321.62 332.62 343.62 354.62 365.62 376.62 387.62 398.62 409.62 420.62 431.62 442.62 453.62 464.62 475.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个百分点。随着智能体数量增加，延迟与准确率同步改善：相对于单智能体</text><text x="489.52 493.52 500.35 507.18" y="113.85" font-size="11.00" class="sc-loraregular">1000</text><text x="516.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00 76.26 82.69 88.52 94.48" y="129.47" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05" y="129.47" font-size="11.00" class="sc-notoserifcjksc">基线，</text><text x="137.05" y="129.47" font-size="11.00" class="sc-loraregular">N</text><text x="148.33 159.33 170.33 181.33 192.33 203.33" y="129.47" font-size="11.00" class="sc-notoserifcjksc">智能体团队在</text><text x="217.22 225.60 231.43" y="129.47" font-size="11.00" class="sc-loraregular">N=5</text><text x="240.32" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="254.22 258.22" y="129.47" font-size="11.00" class="sc-loraregular">10</text><text x="267.94 278.94 289.94 300.94 311.94 322.94 333.94 344.94 355.94 366.94" y="129.47" font-size="11.00" class="sc-notoserifcjksc">个智能体时分别实现了</text><text x="380.84 386.83 389.43 395.79" y="129.47" font-size="11.00" class="sc-loraregular">5.6×</text><text x="404.51" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="418.40 424.40 427.10 433.46" y="129.47" font-size="11.00" class="sc-loraregular">5.9×</text><text x="442.18 453.18 464.18 475.18 486.18 497.18 508.18 519.18 530.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的加速，而异步子智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">能体团队的得分也比该基线高</text><text x="217.89 223.80 226.51" y="145.09" font-size="11.00" class="sc-loraregular">2.8</text><text x="235.58 246.58 257.58 268.58 279.58" y="145.09" font-size="11.00" class="sc-notoserifcjksc">个百分点。</text><t xt x="515.15 526.15" y="596.90" font-size="11.00" class="sc-notoserifcjksc">上限</text><text x="72.00" y="612.52" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 89.90 96.73" y="612.52" font-size="11.00" class="sc-loraregular">100</text><text x="106.45 117.45" y="612.52" font-size="11.00" class="sc-notoserifcjksc">万。</text><text x="72.00" y="646.05" font-size="11.00" class="sc-lorabold">N</text><text x="83.40 94.40 105.40 116.40 127.40" y="646.05" font-size="11.00" class="sc-notoserifcjkscbold">智能体团队</text><text x="138.40 149.40" y="646.05" font-size="11.00" class="sc-notoserifcjksc">。由</text><text x="163.29 171.67 177.50" y="646.05" font-size="11.00" class="sc-loraregular">N=5</text><text x="186.39" y="646.05" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="200.28 204.29" y="646.05" font-size="11.00" class="sc-loraregular">10</text><text x="214.01 225.01 236.01 247.01 258.01 269.01 280.01 291.01 302.01 313.01 324.01 335.01 346.01 357.01 368.01 379.01 390.01 401.01 412.01 423.01 434.01 445.01 456.01 467.01 478.01 489.01 500.01 511.01 522.01" y="646.05" font-size="11.00" class="sc-notoserifcjksc">个对等智能体组成的团队并发处理任务。其中一个智能体被指定为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="661.67" font-size="11.00" class="sc-notoserifcjksc">主智能体，负责协调工作，并在需要时提交最终答案，但所有智能体拥有相同的工具，并且都能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="677.29" font-size="11.00" class="sc-notoserifcjksc">看到完整的任务描述。除任务工具外，每个智能体还拥有两个消息工具：</text><text x="424.00 430.24 436.20 442.88 449.45 452.35 462.37 468.33 473.42 478.52 484.19 490.22" y="677.29" font-size="11.00" class="sc-loraregular">Send Message</text><text x="496.18 507.18 518.18 529.18" y="677.29" font-size="11.00" class="sc-notoserifcjksc">，用于向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="692.91" font-size="11.00" class="sc-notoserifcjksc">一个或多个队友发送消息（插入在接收方下一个工具结果之后）；以及</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p172.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 172 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">172</text><text x="72.00 82.52 88.19 91.46 95.72 98.61 102.27 108.71 113.47 116.36 126.38 132.35 137.44 142.53 148.21 154.24" y="82.61" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="160.20 171.20 182.20 193.20 204.20 215.20 226.20 237.20 248.20 259.20 270.20 281.20 292.20 303.20 314.20 325.20 336.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，它会阻塞采样，直到有消息到达。在</text><text x="350.09 356.76 361.44 367.88 373.96 378.65 384.32 394.09 400.93 406.90 413.57 419.42" y="82.61" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="428.91 439.91 450.91 461.91 472.91 483.91 494.91 505.91 516.91 527.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，每个智能体在各自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的任务代码仓库检出副本中工作，并可通过</text><text x="283.89 292.26 295.53" y="98.23" font-size="11.00" class="sc-loraregular">Git</text><text x="302.68 313.68 324.68 335.68 346.68 357.68 368.68 379.68 390.68 401.68 412.68" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">该运行框架旨在模拟多个智能体协作完成共享任务的真实场景，并通过让对等智能体并行工作来</text><text x="72.00 83.00 94.00 105.00 116.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">降低延迟。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">。在该运行框架中，我们从一个主智能体开始，它可以派生异步、长期存在的子智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">能体，同时保留对任务工具的直接访问。派生工具会立即返回确认信息，而不是等待子智能体执</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">行。每个子智能体只能看到主智能体提供的指令，而看不到原始任务描述；子智能体可以向任何</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">其他智能体以及主智能体发送消息。子智能体的最终回复会以消息形式传递给主智能体，此后该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">子智能体处于空闲状态，直到主智能体用新指令将其唤醒。子智能体拥有任务工具以及与</text><text x="503.89" y="258.43" font-size="11.00" class="sc-loraregular">N</text><text x="515.17 526.17" y="258.43" font-size="11.00" class="sc-notoserifcjksc">智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">体团队相同的通信工具（即</text><text x="206.89 213.13 219.09 225.77 232.35 235.24 245.26 251.22 256.32 261.41 267.09 273.11" y="274.05" font-size="11.00" class="sc-loraregular">Send Message</text><text x="281.97" y="274.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.86 306.38 312.05 315.32 319.58 322.47 326.13 332.57 337.33 340.22 350.25 356.21 361.30 366.39 372.07 378.10" y="274.05" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="384.06 395.06 406.06 417.06 428.06 439.06 450.06 461.06 472.06 483.06 494.06 505.06 516.06 527.06" y="274.05" font-size="11.00" class="sc-notoserifcjksc">）；主智能体还额外拥有创建子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="305.29" font-size="11.00" class="sc-notoserifcjksc">工具。对于搜索任务，只有主智能体的最终提交会被评分。可派生的子智能体数量没有上限。</text><text x="72.00 80.36 83.74 88.44 93.15 96.53" y="404.81" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.11.4</text><text x="108.22 121.22 134.22 147.22" y="404.81" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="432.69" font-size="11.00" class="sc-notoserifcjksc">我们展示的结果侧重于比较单智能体与多智能体运行框架之间的差异，包括分数、延迟、</text><text x="501.00 505.26 511.69 517.52 523.48" y="432.69" font-size="11.00" class="sc-loraregular">token</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="448.31" font-size="11.00" class="sc-notoserifcjksc">用量和成本。具体而言，</text><text x="193.00 197.26 203.69 209.52 215.48" y="448.31" font-size="11.00" class="sc-loraregular">token</text><text x="225.05 236.05 247.05 258.05 269.05 280.05 291.05 302.05 313.05 324.05 335.05 346.05 357.05 368.05 379.05 390.05" y="448.31" font-size="11.00" class="sc-notoserifcjksc">用量按一个任务上所有智能体消耗的</text><text x="403.95 408.20 414.64 420.47 426.43" y="448.31" font-size="11.00" class="sc-loraregular">token</text><text x="436.00 447.00 458.00 469.00 480.00 491.00 502.00 513.00 524.00" y="448.31" font-size="11.00" class="sc-notoserifcjksc">总数计算；成本基于</text><text x="72.00 76.26 82.69 88.52 94.48" y="463.93" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05" y="463.93" font-size="11.00" class="sc-notoserifcjksc">用量和按</text><text x="150.95 155.20 161.64 167.47 173.43" y="463.93" font-size="11.00" class="sc-loraregular">token</text><text x="183.00 194.00 205.00" y="463.93" font-size="11.00" class="sc-notoserifcjksc">计费的</text><text x="218.89 225.78 232.39" y="463.93" font-size="11.00" class="sc-loraregular">API</text><text x="238.97 249.97 260.97 271.97 282.97 293.97 304.97 315.97 326.97 337.97 348.97 359.97 370.97 381.97 392.97 403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97 491.97 502.97 513.97 524.97" y="463.93" font-size="11.00" class="sc-notoserifcjksc">价格计算，并假设缓存完全命中；延迟以推导的单任务延迟报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="479.55" font-size="11.00" class="sc-notoserifcjksc">告，而非原始的实际耗时。我们将每个智能体的输入和输出</text><text x="360.89 365.15 371.58 377.42 383.38" y="479.55" font-size="11.00" class="sc-loraregular">token</text><text x="392.95 403.95 414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95 502.95 513.95 524.95" y="479.55" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充</text><text x="72.00" y="495.17" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="113.05 124.05 135.05 146.05 157.05 168.05 179.05 190.05 201.05 212.05 223.05 234.05 245.05 256.05 267.05 278.05 289.05 300.05 311.05 322.05 333.05 344.05 355.05 366.05 377.05 388.05 399.05 410.05 421.05 432.05 443.05 454.05 465.05 476.05 487.05 498.05 509.05 520.05" y="495.17" font-size="11.00" class="sc-notoserifcjksc">）与解码速率，加上其实测的工具执行时间，然后取所有智能体延迟中的最大值。这样</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="510.79" font-size="11.00" class="sc-notoserifcjksc">可以将运行框架的结构性延迟（例如它需要多少串行的模型工作和工具时间）与服务端波动（例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="526.41" font-size="11.00" class="sc-notoserifcjksc">如批处理、排队、硬件）隔离开来，从而在同等条件下比较各运行框架。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">本节中的分数，无论是单智能体还是多智能体的</text><text x="305.89 312.65 317.33 323.66 332.47 337.56 343.52 351.21 357.65 367.48" y="610.80" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="376.94" y="610.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="390.84 397.50 402.19 408.62 414.71 419.39 425.07 434.84 441.68 447.64 454.32 460.17" y="610.80" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="466.76 477.76 488.76 499.76" y="610.80" font-size="11.00" class="sc-notoserifcjksc">，都是在</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="626.42" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="626.42" font-size="11.00" class="sc-notoserifcjksc">的预发布配置上收集的，使用了未发布的推理强度配置，且未启用安全防护分类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">器。这些分数有助于理解多智能体运行框架的相对性能，而非绝对性能。</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="691.75" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="143.05 154.05 165.05 176.05 187.05 198.05 209.05 220.05 231.05 242.05" y="691.75" font-size="11.00" class="sc-notoserifcjksc">的运行在事后由验证用</text><text x="255.94 263.63 266.62 272.23 278.80 285.38" y="691.75" font-size="11.00" class="sc-loraregular">Claude</text><text x="294.23 305.23 316.23 327.23 338.23 349.23 360.23 371.23 382.23 393.23 404.23 415.23 426.23 437.23 448.23 459.23 470.23 481.23 492.23 503.23 514.23 525.23" y="691.75" font-size="11.00" class="sc-notoserifcjksc">和一条自动化流水线进行扫描，以识别答案泄露；</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="707.37" font-size="11.00" class="sc-notoserifcjksc">任何被标记的问题都计为错误。</text></svg></div>

</text><text x="498.82 504.02 508.92" y="406.44" font-size="9.00" class="sc-loraregular">95%</text><text x="519.12 528.12" y="406.44" font-size="9.00" class="sc-notoserifcjksc">置信</text><text x="72.00 81.00 90.00" y="418.14" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="72.00 78.84 84.80 91.48 97.33 103.79 111.37 118.26" y="479.27" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="126.45 129.99" y="475.60" font-size="6.60" class="sc-loraregular">25</text><text x="136.48 147.48 158.48 169.48 180.48 191.48" y="479.27" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="205.38 212.96 219.84" y="479.27" font-size="11.00" class="sc-loraregular">CAD</text><text x="230.93 241.93 252.93 263.93 274.93 285.93 296.93 307.93" y="479.27" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="321.82 325.83 330.41 333.19 339.54 346.38" y="479.27" font-size="11.00" class="sc-loraregular">17,900</text><text x="356.11 367.11 378.11 389.11 400.11 411.11 422.11" y="479.27" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="436.00 443.69 449.37 455.83 464.58 471.15 477.11 482.06" y="479.27" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="490.76 501.76 512.76 523.76" y="479.27" font-size="11.00" class="sc-notoserifcjksc">程序构建</text><text x="72.00 83.00 94.00 105.00 116.00" y="494.89" font-size="11.00" class="sc-notoserifcjksc">而成，覆盖</text><text x="129.89 133.90 140.73" y="494.89" font-size="11.00" class="sc-loraregular">106</text><text x="149.98 160.98 171.98 182.98 193.98 204.98 215.98 226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98 325.98" y="494.89" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="339.87 343.56 349.79" y="494.89" font-size="11.00" class="sc-loraregular">ISO</text><text x="358.53" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.53 377.61 381.30" y="494.89" font-size="11.00" class="sc-loraregular">DIN</text><text x="389.68" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.68 407.52" y="494.89" font-size="11.00" class="sc-loraregular">EN</text><text x="415.90" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="426.90 433.79 440.03 450.12" y="494.89" font-size="11.00" class="sc-loraregular">ASME</text><text x="459.86" y="494.89" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="473.75 477.44 484.28" y="494.89" font-size="11.00" class="sc-loraregular">IEC</text><text x="494.86 505.86 516.86 527.86" y="494.89" font-size="11.00" class="sc-notoserifcjksc">规格表为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="510.51" font-size="11.00" class="sc-notoserifcjksc">依据。该基准测试将</text><text x="173.89 181.47 188.36" y="510.51" font-size="11.00" class="sc-loraregular">CAD</text><text x="199.45 210.45 221.45 232.45 243.45 254.45 265.45 276.45 287.45 298.45 309.45 320.45 331.45 342.45 353.45 364.45 375.45 386.45 397.45" y="510.51" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务；我们报告</text><text x="411.34 418.36 421.45 426.54 429.63 436.07 442.74 448.65 456.34 462.77 469.35" y="510.51" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="478.21 489.21 500.21 511.21" y="510.51" font-size="11.00" class="sc-notoserifcjksc">任务的结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="526.12" font-size="11.00" class="sc-notoserifcjksc">果，该任务要求模型根据多视图渲染图生成</text><text x="283.89 291.58 297.26 303.71 312.47 319.04 325.00 329.95" y="526.12" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="338.65 349.65 360.65" y="526.12" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00 83.00 94.00 105.00 116.00" y="592.83" font-size="11.00" class="sc-notoserifcjksc">我们内部的</text><text x="129.89 136.74 142.70 149.37 155.23 161.68 169.26 176.15" y="592.83" font-size="11.00" class=" aregular">PDF</text><text x="252.51 263.51 274.51 285.51 296.51 307.51 318.51 329.51 340.51 351.51 362.51 373.51 384.51 395.51 406.51 417.51 428.51 439.51" y="226.06" font-size="11.00" class="sc-notoserifcjksc">文件和标准库）以及一个图像裁剪工具。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">我们修复了运行框架中的一个缺陷：该缺陷会对超过</text><text x="327.89 331.90 338.73" y="276.92" font-size="11.00" class="sc-loraregular">100</text><text x="348.45 359.45 370.45 381.45" y="276.92" font-size="11.00" class="sc-notoserifcjksc">页但小于</text><text x="395.35 401.47 407.38 417.48" y="276.92" font-size="11.00" class="sc-loraregular">32MB</text><text x="427.21 438.21 449.21 460.21 471.21 482.21 493.21" y="276.92" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="507.11 513.72 521.80" y="276.92" font-size="11.00" class="sc-loraregular">PDF</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">进行不必要的截断。修复这一问题后，与我们此前发布的结果相比，内部运行框架得出的分数有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">了显著提升。我们使用更新后的运行框架重新运行了此前的模型，并在下方绘制了修正后的分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 35 .00 479.00 490.00 501.00 512.00 523.00" y="551.79" font-size="11.00" class="sc-notoserifcjksc">于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提取后的文本形式提供在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="567.41" font-size="11.00" class="sc-notoserifcjksc">沙箱化的环境中，并提供代码执行工具；</text><text x="340.25 351.25 362.25 373.25 384.25 395.25 406.25 417.25" y="567.41" font-size="11.00" class="sc-notoserifcjksc">是其中难度更高的</text><text x="431.14 435.14 441.27" y="567.41" font-size="11.00" class="sc-loraregular">133</text><text x="450.29 461.29 472.29 483.29 494.29 505.29 516.29 527.29" y="567.41" font-size="11.00" class="sc-notoserifcjksc">题子集，推荐用于</text><text x="72.00 83.00 94.00 105.00 116.00" y="583.03" font-size="11.00" class="sc-notoserifcjksc">前沿模型。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="633.89" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="633.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="212.49 223.49 234.49" y="633.89" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="248.39 253.46 259.64 262.34 266.35" y="633.89" font-size="11.00" class="sc-loraregular">78.1%</text><text x="275.92 286.92" y="633.89" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="371.06 382.06 393.06" y="633.89" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="406.95 413.31 419.67 422.37 428.73" y="633.89" font-size="11.00" class="sc-loraregular">66.9%</text><text x="438.30 449.30 460.30 471.30 482.30" y="633.89" font-size="11.00" class="sc-notoserifcjksc">。这略高于</text><text x="496.19 503.88 506.87 512.48 519.05 525.63" y="633.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="649.51" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70 127.70 138.70 149.70" y="649.51" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="163.60 168.67 173.26 175.85 182.21" y="649.51" font-size="11.00" class="sc-loraregular">77.6%</text><text x="194.67" y="649.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.57 214.92 221.28 223.99 229.89" y="649.51" font-size="11.00" class="sc-loraregular">66.2%</text><text x="239.46 250.46 261.46 272.46 283.46" y="649.51" font-size="11.00" class="sc-notoserifcjksc">），略低于</text><text x="297.36 305.05 308.04 313.65 320.22 326.79 332.76 335.65 345.58 351.44 355.70 362.29 368.72 373.82 376.71" y="649.51" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="382.71 393.71 404.71 415.71" y="649.51" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="429.60 434.67 440.85 443.39 450.22" y="649.51" font-size="11.00" class="sc-loraregular">79.0%</text><text x="462.69" y="649.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.58 482.86 487.45 490.15 494.16" y="649.51" font-size="11.00" class="sc-loraregular">67.1%</text><text x="503.73 514.73" y="649.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="665.13" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03" y="665.13" font-size="11.00" class="sc-notoserifcjksc">是在公开的</text><text x="206.93 216.95 222.91 228.00 233.10 238.77 244.80 250.76 255.85 258.75 265.63 272.24" y="665.13" font-size="11.00" class="sc-loraregular">Messages API</text><text x="278.82 289.82 300.82 311.82 322.82 333.82 344.82 355.82 366.82 377.82 388.82 399.82 410.82 421.82 432.82 443.82 454.82 465.82 476.82 487.82 498.82 509.82 520.82" y="665.13" font-size="11.00" class="sc-notoserifcjksc">上评估的，并启用了生产环境安全防护措施（安全分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="680.75" font-size="11.00" class="sc-notoserifcjksc">类器，在分类器拒绝时回退到</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.71" y="680.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89" y="680.75" font-size="11.00" class="sc-notoserifcjksc">）；对比模型则是在内部</text><text x="424.78 431.67 438.28" y="680.75" font-size="11.00" class="sc-loraregular">API</text><text x="444.86 455.86 466.86 477.86 488.86 499.86 510.86 521.86" y="680.75" font-size="11.00" class="sc-notoserifcjksc">上评估的，未启用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="696.37" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施。</text></svg></div>

142.29" font-size="11.00" class="sc-loraregular">MCP</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="142.29" font-size="11.00" class="sc-notoserifcjksc">服务器环境中进行多次工具调用，要求模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">型使用真实的</text><text x="140.89 147.78 154.39" y="157.91" font-size="11.00" class="sc-loraregular">API</text><text x="160.97 171.97 182.97 193.97 204.97 215.97 226.97 237.97 248.97 259.97 270.97 281.97 292.97 303.97 314.97 325.97 336.97 347.97 358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97" y="157.91" font-size="11.00" class="sc-notoserifcjksc">和真实数据、处理错误与重试，并在不同服务器之间进行协调。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="224.39" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03" y="224.39" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="184.93 191.11 197.10 199.81 205.99" y="224.39" font-size="11.00" class="sc-loraregular">85.8%</text><text x="218.45 229.45 240.45 251.45 262.45 273.45 284.45" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的通过率，高于</text><text x="298.35 307.08 313.65 320.21 325.31 328.20 334.16 336.87" y="224.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="345.94" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="359.84 366.02 371.93 374.63 380.54" y="224.39" font-size="11.00" class="sc-loraregular">82.2%</text><text x="390.11" y="224.39" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="401.11 407.21 413.40 416.10 420.11" y="224.39" font-size="11.00" class="sc-loraregular">89.1%</text><text x="432.57 443.57 454.57 465.57 476.57 487.57 498.57 509.57 520.57" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的平均要点覆盖率表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 1
