<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p176.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 176 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">176</text><text x="72.00 80.37 87.04 93.37 98.75 104.75 107.45" y="82.61" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="116.34" y="82.61" font-size="11.00" class="sc-notoserifcjksc">等模型上，我们注意到原始形状会因输出上的这种风格差异而报错，尽管其几何结构在</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">其他方面是等价的。这两项更改均已合并到</text><text x="283.89 292.26 295.53 299.79 308.16 314.73" y="98.23" font-size="11.00" class="sc-loraregular">GitHub</text><text x="324.02" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的参考代码仓库中。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">在所有运行中（无论是否使用工具），模型均配置为启用自适应思考和</text><text x="415.89" y="147.38" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="438.59" y="147.38" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">具的评估中，我们为模型提供了一个容器（其中已安装图像文件和标准库）以及一个图像裁剪工</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">具。我们在已公开的</text><text x="173.89 177.90 182.48 185.26 191.61 198.45" y="178.62" font-size="11.00" class="sc-loraregular">17,900</text><text x="208.18" y="178.62" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="222.07 229.09 232.18 237.28 240.37 246.80 253.48 259.39 267.07 273.51 280.09" y="178.62" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="288.94" y="178.62" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="368.84 372.84 375.45 382.28 389.11" y="178.62" font-size="11.00" class="sc-loraregular">1,000</text><text x="398.84" y="178.62" font-size="11.00" class="sc-notoserifcjksc">个文件组成子集进行评估；</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">根据以往经验，该子集上的得分与完整集合上的得分相差在</text><text x="360.89 367.55 370.09 376.92" y="194.24" font-size="11.00" class="sc-loraregular">0.01</text><text x="383.82" y="194.24" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="408.71 412.15 418.37" y="194.24" font-size="11.00" class="sc-loraregular">IoU</text><text x="426.64" y="194.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="437.64 443.14 449.52 455.30 461.26 464.25 467.14 470.59 476.80" y="194.24" font-size="11.00" class="sc-loraregular">voxel IoU</text><text x="485.07" y="194.24" font-size="11.00" class="sc-notoserifcjksc">）以内。我</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">们报告的是五次运行的平均体素</text><text x="228.89 232.34 238.55" y="209.86" font-size="11.00" class="sc-loraregular">IoU</text><text x="249.72" y="209.86" font-size="11.00" class="sc-notoserifcjksc">得分。</text><text x="72.00" y="261.25" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.74 98.70 105.37 111.23 117.68 125.26 132.15 140.34 143.24 150.25 153.35 158.44 161.53 167.96 174.64 180.55 188.24 194.67 201.25" y="261.25" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="210.11" y="261.25" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="261.25" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="261.25" font-size="11.00" class="sc-notoserifcjksc">个文件子集上，</text><text x="331.01 338.70 341.69 347.30 353.86 360.44 366.40 369.30 378.03 384.60 391.17 396.26 399.15" y="261.25" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="408.04" y="261.25" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的体素</text><text x="509.93 513.38 519.59" y="261.25" font-size="11.00" class="sc-loraregular">IoU</text><text x="72.00" y="276.87" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="107.89 114.55 117.25 123.38 129.74" y="276.87" font-size="11.00" class="sc-loraregular">0.366</text><text x="136.10" y="276.87" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="215.99 222.65 225.35 231.53 237.44" y="276.87" font-size="11.00" class="sc-loraregular">0.821</text><text x="241.44" y="276.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="252.44 260.13 263.12 268.73 275.30 281.88 287.84 290.74 299.47 306.04 312.60 317.70 320.59 326.55 329.26" y="276.87" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="338.33" y="276.87" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="407.23 413.88 416.59 422.49 427.56" y="276.87" font-size="11.00" class="sc-loraregular">0.277</text><text x="435.53" y="276.87" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="449.42 456.08 458.78 464.78 470.68" y="276.87" font-size="11.00" class="sc-loraregular">0.521</text><text x="474.69" y="276.87" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="485.69 493.38 496.37 501.98 508.55 515.12" y="276.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="292.49" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="292.49" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="190.84 197.50 200.21 206.07 211.14" y="292.49" font-size="11.00" class="sc-loraregular">0.378</text><text x="220.21" y="292.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="234.11 240.76 243.36 249.64 254.71" y="292.49" font-size="11.00" class="sc-loraregular">0.678</text><text x="260.89" y="292.49" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="605.14" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="605.14" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 128.85 133.70 139.44 144.10 149.57 155.70 161.71 168.54 170.91 177.05 179.99 184.36 187.30 192.39 198.14 202.93 209.12 214.22 219.58" y="605.14" font-size="9.00" class="sc-lorabold">8.12.2.A] BenchCAD Vision2Code</text><text x="226.79" y="605.14" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.79 278.08 280.53 285.12 290.49 295.88" y="605.14" font-size="9.00" class="sc-loraregular">Claude</text><text x="303.12" y="605.14" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="386.49" y="605.14" font-size="9.00" class="sc-loraregular">max</text><text x="406.31" y="605.14" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别在使用工具</text><text x="72.00" y="616.84" font-size="9.00" class="sc-notoserifcjksc">和不使用工具的条件下进行。得分为五次运行的平均值，图中显示</text><text x="335.37" y="616.84" font-size="9.00" class="sc-loraregular">95%</text><text x="355.67" y="616.84" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="400.67 405.35 412.20 417.65 422.84 427.24 432.14 434.27 439.47 441.84 446.94 452.21" y="616.84" font-size="9.00" class="sc-loraregular">*GPT-5.6 Sol</text><text x="457.02" y="616.84" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="495.39" y="616.84" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="529.26" y="616.84" font-size="9.00" class="sc-notoserifcjksc">公</text><text x="72.00" y="628.54" font-size="9.00" class="sc-notoserifcjksc">开报告的数据，在完整的</text><text x="173.37 176.64 180.40 182.66 187.87 193.46" y="628.54" font-size="9.00" class="sc-loraregular">17,900</text><text x="201.42" y="628.54" font-size="9.00" class="sc-notoserifcjksc">个文件上评估。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="657.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="657.45" font-size="11.00" class="sc-notoserifcjksc">模型在该评估上的表现越来越明显地随测试时计算而大幅提升，尤其是当模型配备了能够</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p177.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 177 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 106.32 109.70 119.89 127.74 140.72 149.01 154.00 157.44 166.25 169.63 177.12 180.26" y="498.70" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.3 OSWorld 2.0</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">27</text><text x="80.62 86.46 92.43 97.59 103.66 106.19 108.82 117.99 120.45 122.98 125.61 130.96 134.83 137.45 142.61 145.33 147.79 150.42 153.47 158.84 164.97 170.34 176.00 179.05 181.51 184.14 192.07 197.74 207.30 213.14 217.43 220.15 226.13 228.76 234.13 236.43 242.64 245.14 247.77 253.99 259.41 265.47 270.79 276.78 285.72 290.87 295.16 300.53 303.34 309.41 314.93 317.56 322.83 328.68 337.61 343.58 349.55 353.42 358.84 363.16 365.79 371.76 376.39 381.81 384.44 389.59 395.07 400.49 406.47 410.34 414.96 417.59 423.44 429.51 432.14 434.86 440.70 446.77 452.30 457.19 463.18 469.02 473.35 476.16 481.20 487.05" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">177</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">使用工具的情况下，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="248.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="261.93 268.77 274.73 281.41 287.26 293.72 301.30 308.18 316.38 319.27 326.29 329.38 334.47 337.56 344.00 350.67 356.58 364.27 370.71 377.28" y="82.61" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="386.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上大幅超越了</text><text x="455.03 462.72 465.71 471.32 477.89 484.47 490.43 493.32 503.26 509.12 513.38 519.96 526.40" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，在较高推理强度档位下尤为明显。</text><text x="72.00" y="438.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="438.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 128.85 133.70 139.44 144.10 149.57 155.70 161.71 168.54 170.91 177.05 179.99 184.36 187.30 192.39 198.14 202.93 209.12 214.22 219.58" y="438.05" font-size="9.00" class="sc-lorabold">8.12.2.B] BenchCAD Vision2Code</text><text x="226.79" y="438.05" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.79" y="438.05" font-size="9.00" class="sc-notoserifcjksc">模型在不同推理强度档位的自适应思考下评估，分别在使用工具和</text><text x="72.00" y="449.75" font-size="9.00" class="sc-notoserifcjksc">不使用工具的条件下进行。我们使用</text><text x="218.37 223.25 226.38 229.37 234.64 238.60" y="449.75" font-size="9.00" class="sc-loraregular">effort</text><text x="244.45" y="449.75" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行</text><text x="72.00" y="461.45" font-size="9.00" class="sc-notoserifcjksc">的平均值。图中显示</text><text x="155.37" y="461.45" font-size="9.00" class="sc-loraregular">95%</text><text x="175.67" y="461.45" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63 118.21 121.10 127.01 129.55" y="522.58" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="136.38" y="518.91" font-size="6.60" class="sc-loraregular">27</text><text x="145.86" y="522.58" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台实时运行的</text><text x="72.00 80.27 86.67 93.24 99.82 104.08" y="538.20" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="113.54" y="538.20" font-size="11.00" class="sc-notoserifcjksc">虚拟机交互、完成真实世界计算机任务的能力。我们沿用默认设置，分辨率为</text><text x="490.43" y="538.20" font-size="11.00" class="sc-loraregular">1080p</text><text x="520.84" y="538.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="553.82" font-size="11.00" class="sc-notoserifcjksc">每个任务的操作步数上限为</text><text x="206.89" y="553.82" font-size="11.00" class="sc-loraregular">500</text><text x="226.55" y="553.82" font-size="11.00" class="sc-notoserifcjksc">。对于需要评分模型的任务，我们使用</text><text x="416.44" y="553.82" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="461.15" y="553.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="603.75" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="603.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="124.64 133.37 139.61 150.12 156.56 161.28 164.27 170.85 173.74 179.65 182.19" y="603.75" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="191.91" y="603.75" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="238.80 243.88 250.53 253.24 259.23 264.30" y="603.75" font-size="11.00" class="sc-loraregular">70.57%</text><text x="276.77" y="603.75" font-size="11.00" class="sc-notoserifcjksc">的得分（首次尝试成功率，五次运行的平均值）。我们</text><text x="72.00" y="619.37" font-size="11.00" class="sc-notoserifcjksc">还在</text><text x="96.89 105.63 111.86 122.38 128.82 133.53 136.53 143.10 146.00 151.90 154.45" y="619.37" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="164.17" y="619.37" font-size="11.00" class="sc-notoserifcjksc">上评估了我们此前发布的模型（</text><text x="318.17 326.54 333.21 340.25 343.14 349.13 351.73 358.09 360.98 367.22 373.65" y="619.37" font-size="11.00" class="sc-loraregular">GPT 5.6 Sol</text><text x="379.54" y="619.37" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="393.43 403.53 410.10 415.19 421.15 424.04 430.21 436.78 442.46 447.18 453.08 455.98 459.98 462.69" y="619.37" font-size="11.00" class="sc-loraregular">Muse Spark 1.1</text><text x="469.58" y="619.37" font-size="11.00" class="sc-notoserifcjksc">的得分来自各</text><text x="72.00" y="634.99" font-size="11.00" class="sc-notoserifcjksc">自的发布文章）：</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="232.28" y="707.20" width="160.69" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 107.01 110.39 120.44 129.65 137.38 140.52 149.33 158.14" y="637.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.4 GDP.pdf</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">28</text><text x="81.22 86.83 92.80 97.08 102.55 107.97 110.60 116.86 120.21 122.67 125.30 128.34 133.71 139.85 145.22 150.88 153.92 156.38 159.01 166.62 173.97 179.18 181.64 187.61 193.59 196.97 199.47 202.09 209.08 214.24 220.31 222.94 228.22 231.86 238.07 244.28 250.50 253.12 259.38 262.73 265.36 274.30 280.14 286.12 291.54 294.26 298.89 301.52 310.45 315.61 320.24 324.11 329.52 333.85 336.48 340.35 346.34 351.76 354.38 360.36 366.21 371.53 377.50 386.43 391.85 397.83 401.70 406.32 408.95 412.82 418.81 423.90 427.77 430.39 434.72 440.69 446.76 449.39 453.26 459.24 464.66 467.29 475.18 481.02 485.31 488.03 494.01" y="704.45" font-size="10.00" class="sc-loraregular">Surge AI. (2026). GDP.pdf: Can $100B AI models master the documents that run the world?</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 109.01 113.64 119.61 123.89 129.37 134.78 140.77 146.53 148.99 154.15 156.75 163.64 169.46 172.18 178.03 183.55 189.96 195.44 201.42 207.38 212.27 218.24 224.22 227.50 232.38 237.68 242.84 248.91 253.54 257.17 263.38 269.59 275.41 280.30 285.45 288.26 293.15 302.09 307.93 313.91 319.33 322.05 326.68 331.57 340.50 345.66 350.29 354.16 359.57 363.82 368.71 372.58 378.57 383.98 388.87 394.85 400.70 406.02 411.98 420.92 426.34 432.32 436.18 440.81 445.70 449.57 455.56 460.64 464.51 469.40 473.73 479.70 485.76 490.65 494.52 500.51 505.93 510.73 518.62 524.47 528.76 531.48" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="283.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="283.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.31 120.78 123.15 130.07 135.38 143.91 149.00 153.24 156.05 161.42 163.78 168.58 170.54" y="283.92" font-size="9.00" class="sc-lorabold">8.12.3.A] OSWorld 2.0</text><text x="178.63" y="283.92" font-size="9.00" class="sc-notoserifcjksc">各模型得分。</text><text x="232.63" y="283.92" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="264.33" y="283.92" font-size="9.00" class="sc-notoserifcjksc">在这一新发布的基准测试上达到了最先进水平。</text><text x="72.00" y="322.98" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="322.98" font-size="11.00" class="sc-notoserifcjksc">不仅是我们迄今为止最强的计算机使用模型，在计算机使用效率上也实现了显著跃升。</text><text x="72.00" y="601.41" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.41" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.31 120.78 123.15 130.07 135.38 143.91 149.00 153.24 156.05 161.42 163.78 168.58 170.54" y="601.41" font-size="9.00" class="sc-lorabold">8.12.3.B] OSWorld 2.0</text><text x="178.63" y="601.41" font-size="9.00" class="sc-notoserifcjksc">各模型的价格与性能对比。</text><text x="72.00 80.37 88.46 94.20 96.90 103.47 110.05" y="661.45" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="113.77" y="657.79" font-size="6.60" class="sc-loraregular">28</text><text x="123.91" y="661.45" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="137.81 143.98 150.54 155.25 161.28 167.24 170.14 177.02" y="661.45" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="183.60" y="661.45" font-size="11.00" class="sc-notoserifcjksc">推出的专家级多模态推理基准测试，由</text><text x="373.49" y="661.45" font-size="11.00" class="sc-loraregular">100</text><text x="394.05" y="661.45" font-size="11.00" class="sc-notoserifcjksc">个真实世界提示词及</text><text x="495.94 502.56 510.64" y="661.45" font-size="11.00" class="sc-loraregular">PDF</text><text x="519.56" y="661.45" font-size="11.00" class="sc-notoserifcjksc">组</text><text x="72.00" y="677.07" font-size="11.00" class="sc-notoserifcjksc">成，直接取材于涵盖十个</text><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="498.75" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="72.00" y="707.20" width="465.45" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">领域的专业工作流，包括金融、医疗健康、法律、工程和保险。该基准测试考察模型能否解析、</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">我们使用内部运行框架评估</text><text x="206.89 215.26 223.35 229.09 231.80 238.36 244.94" y="163.58" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="248.66" y="163.58" font-size="11.00" class="sc-notoserifcjksc">，分别在使用工具和不使用工具的条件下进行。在不使用工</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">具的评估中，为与</text><text x="162.89 169.06 175.63 180.34 186.37" y="179.20" font-size="11.00" class="sc-loraregular">Surge</text><text x="195.22" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的输入提示词保持一致，我们向模型提供</text><text x="396.11" y="179.20" font-size="11.00" class="sc-loraregular">base64</text><text x="434.46" y="179.20" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="470.35 476.96 485.05" y="179.20" font-size="11.00" class="sc-loraregular">PDF</text><text x="491.08" y="179.20" font-size="11.00" class="sc-notoserifcjksc">。不过与</text><text x="72.00 78.17 84.74 89.45 95.47" y="194.82" font-size="11.00" class="sc-loraregular">Surge</text><text x="104.33" y="194.82" font-size="11.00" class="sc-notoserifcjksc">不同的是，对于超出我们</text><text x="228.22 235.11 241.72 245.40 248.30 254.42 260.33 270.43" y="194.82" font-size="11.00" class="sc-loraregular">API 32MB</text><text x="280.16" y="194.82" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="360.06 366.67 374.75" y="194.82" font-size="11.00" class="sc-loraregular">PDF</text><text x="380.78" y="194.82" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而非丢</text><text x="72.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">弃）。我们使用</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.06" y="210.44" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="198.03" y="210.44" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="222.92" y="210.44" font-size="11.00" class="sc-loraregular">Gemini 3 Flash</text><text x="301.13" y="210.44" font-size="11.00" class="sc-notoserifcjksc">作为评判模型。在使用工具的评估中，我们为模</text><text x="72.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">型提供了一个容器（其中已安装</text><text x="228.89 235.50 243.59" y="226.06" font-size="11.00" class="sc-loraregular">PDF</text><text x="252.51" y="226.06" font-size="11.00" class="sc-notoserifcjksc">文件和标准库）以及一个图像裁剪工具。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">我们修复了运行框架中的一个缺陷：该缺陷会对超过</text><text x="327.89" y="276.92" font-size="11.00" class="sc-loraregular">100</text><text x="348.45" y="276.92" font-size="11.00" class="sc-notoserifcjksc">页但小于</text><text x="395.35" y="276.92" font-size="11.00" class="sc-loraregular">32MB</text><text x="427.21" y="276.92" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="507.11 513.72 521.80" y="276.92" font-size="11.00" class="sc-loraregular">PDF</text><text x="72.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">进行不必要的截断。修复这一问题后，与我们此前发布的结果相比，内部运行框架得出的分数有</text><text x="72.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">了显著提升。我们使用更新后的运行框架重新运行了此前的模型，并在下方绘制了修正后的分</text><text x="72.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">数。我们报告的是平均评分项通过率（即各任务中被满足的评分细则条件所占比例，在已完成的</text><text x="72.00" y="339.40" font-size="11.00" class="sc-notoserifcjksc">运行上取平均），而非严格通过率。我们在全部</text><text x="305.89" y="339.40" font-size="11.00" class="sc-loraregular">100</text><text x="326.45" y="339.40" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并取五次运行的平均</text><text x="72.00" y="355.02" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.26 102.35 108.09 110.80 117.36 123.94" y="406.45" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="130.55" y="406.45" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55 160.24 163.23 168.84 175.41 181.99 187.95 190.84 199.58 206.14 212.71 217.80 220.70" y="406.45" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="229.59" y="406.45" font-size="11.00" class="sc-notoserifcjksc">不使用工具时的平均评分项通过率为</text><text x="408.48" y="406.45" font-size="11.00" class="sc-loraregular">83.4%</text><text x="439.03" y="406.45" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="72.00" y="422.07" font-size="11.00" class="sc-loraregular">85.5%</text><text x="102.45" y="422.07" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="113.45 121.14 124.13 129.74 136.31 142.88 148.85 151.74 160.47 167.04 173.61 178.70 181.59 187.55 190.26" y="422.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="199.34" y="422.07" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="268.23 273.30 277.89 280.59 286.59" y="422.07" font-size="11.00" class="sc-loraregular">77.5%</text><text x="299.05" y="422.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="312.94" y="422.07" font-size="11.00" class="sc-loraregular">84.8%</text><text x="343.55" y="422.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="354.55 362.23 365.23 370.84 377.40 383.98 389.94 392.84 402.77 408.63 412.89 419.48 425.91 431.01 433.90" y="422.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="442.79" y="422.07" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="478.68" y="422.07" font-size="11.00" class="sc-loraregular">81.8%</text><text x="510.22" y="422.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.18 82.77 85.47 91.60" y="437.69" font-size="11.00" class="sc-loraregular">87.3%</text><text x="101.17" y="437.69" font-size="11.00" class="sc-notoserifcjksc">。我们注意到，在不使用工具的设置下，</text><text x="299.17 306.86 309.85 315.46 322.03 328.61 334.57 337.46 346.20 352.76 359.33 364.42 367.32" y="437.69" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="376.21" y="437.69" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="390.10 397.79 400.78 406.39 412.96 419.53 425.50 428.39 437.12 443.69 450.26 455.35 458.24 464.20 466.91" y="437.69" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="475.99" y="437.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="489.88 497.57 500.56 506.17 512.74 519.32" y="437.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="453.31" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="453.31" font-size="11.00" class="sc-notoserifcjksc">均构成帕累托占优，以相同或更低的成本取得了显著更高的分数。不过，在使用工具的</text><text x="72.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">设置下，</text><text x="116.00 123.69 126.68 132.29 138.86 145.44 151.40 154.29 164.22 170.09 174.34 180.93 187.37 192.46 195.35" y="468.93" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24" y="468.93" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="218.13 226.51 234.59 240.33 243.04 249.61 256.18" y="468.93" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="262.79" y="468.93" font-size="11.00" class="sc-notoserifcjksc">上仍在</text><text x="298.69 306.38 309.37 314.98 321.55 328.12" y="468.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="336.98" y="468.93" font-size="11.00" class="sc-notoserifcjksc">模型中保持领先。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p180.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 180 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 116.94 121.25 125.57 129.00 136.80 144.82 155.04" y="496.47" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 OfficeQA</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">180</text><text x="72.00" y="395.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="395.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.56 111.65 117.19 120.66 123.03 129.82 136.52 141.45 143.48 148.89 154.25" y="395.68" font-size="9.00" class="sc-lorabold">8.12.4.A] GDP.pdf</text><text x="159.94" y="395.68" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="186.94" y="395.68" font-size="9.00" class="sc-notoserifcjksc">模型在不同推理强度档位的自适应思考下评估，分别在使用工具和不使用工具的条件下进</text><text x="72.00" y="407.38" font-size="9.00" class="sc-notoserifcjksc">行。我们使用</text><text x="128.37 133.24 136.38 139.37 144.64 148.60" y="407.38" font-size="9.00" class="sc-loraregular">effort</text><text x="154.45" y="407.38" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。平均评分项通过率为每个推理强度档位下五次运行的平均值。</text><text x="72.00" y="419.08" font-size="9.00" class="sc-notoserifcjksc">图中显示</text><text x="110.37" y="419.08" font-size="9.00" class="sc-loraregular">95%</text><text x="130.67" y="419.08" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="455.57" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="455.57" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="520.55" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46 143.60 149.20 153.46 159.13 165.53 170.30 173.39 179.24 185.15" y="520.55" font-size="11.00" class="sc-loraregular">Databricks</text><text x="193.13" y="520.55" font-size="11.00" class="sc-notoserifcjksc">推出的公开基准测试，评估模型在大量历史</text><text x="405.02 411.90 416.59 422.53 428.20 433.29 439.86 444.81 450.62 453.51 460.28 466.85 469.84 472.83 478.71 482.97 486.06" y="520.55" font-size="11.00" class="sc-loraregular">Treasury Bulletin</text><text x="492.74" y="520.55" font-size="11.00" class="sc-notoserifcjksc">（美国财</text><text x="72.00" y="536.17" font-size="11.00" class="sc-notoserifcjksc">政部公报）文档语料上进行端到端有据推理的能力。模型必须在整个语料中定位相关表格，并基</text><text x="72.00" y="551.79" font-size="11.00" class="sc-notoserifcjksc">于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提取后的文本形式提供在</text><text x="72.00" y="567.41" font-size="11.00" class="sc-notoserifcjksc">沙箱化的环境中，并提供代码执行工具；</text><text x="340.25" y="567.41" font-size="11.00" class="sc-notoserifcjksc">是其中难度更高的</text><text x="431.14" y="567.41" font-size="11.00" class="sc-loraregular">133</text><text x="450.29" y="567.41" font-size="11.00" class="sc-notoserifcjksc">题子集，推荐用于</text><text x="72.00" y="583.03" font-size="11.00" class="sc-notoserifcjksc">前沿模型。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="633.89" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="633.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="212.49" y="633.89" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="248.39" y="633.89" font-size="11.00" class="sc-loraregular">78.1%</text><text x="275.92" y="633.89" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="371.06" y="633.89" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="406.95" y="633.89" font-size="11.00" class="sc-loraregular">66.9%</text><text x="438.30" y="633.89" font-size="11.00" class="sc-notoserifcjksc">。这略高于</text><text x="496.19 503.88 506.87 512.48 519.05 525.63" y="633.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="649.51" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70" y="649.51" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="163.60 168.67 173.26 175.85 182.21" y="649.51" font-size="11.00" class="sc-loraregular">77.6%</text><text x="194.67" y="649.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.57" y="649.51" font-size="11.00" class="sc-loraregular">66.2%</text><text x="239.46" y="649.51" font-size="11.00" class="sc-notoserifcjksc">），略低于</text><text x="297.36 305.05 308.04 313.65 320.22 326.79 332.76 335.65 345.58 351.44 355.70 362.29 368.72 373.82 376.71" y="649.51" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="382.71" y="649.51" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="429.60 434.67 440.85 443.39 450.22" y="649.51" font-size="11.00" class="sc-loraregular">79.0%</text><text x="462.69" y="649.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.58 482.86 487.45 490.15 494.16" y="649.51" font-size="11.00" class="sc-loraregular">67.1%</text><text x="503.73" y="649.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="665.13" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="665.13" font-size="11.00" class="sc-notoserifcjksc">是在公开的</text><text x="206.93 216.95 222.91 228.00 233.10 238.77 244.80 250.76 255.85 258.75 265.63 272.24" y="665.13" font-size="11.00" class="sc-loraregular">Messages API</text><text x="278.82" y="665.13" font-size="11.00" class="sc-notoserifcjksc">上评估的，并启用了生产环境安全防护措施（安全分</text><text x="72.00" y="680.75" font-size="11.00" class="sc-notoserifcjksc">类器，在分类器拒绝时回退到</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.71" y="680.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="300.89" y="680.75" font-size="11.00" class="sc-notoserifcjksc">）；对比模型则是在内部</text><text x="424.78 431.67 438.28" y="680.75" font-size="11.00" class="sc-loraregular">API</text><text x="444.86" y="680.75" font-size="11.00" class="sc-notoserifcjksc">上评估的，未启用</text><text x="72.00" y="696.37" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.32 109.70 121.16 131.21 138.94 142.32 151.38 156.21 159.65 168.46" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.2 MCP Atlas</text><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.54 109.92 115.69 123.71 132.52 141.33 144.76 148.14 157.20 166.01 174.03 182.47 187.30 190.68 198.87 206.89 215.32 223.12 231.55 245.05 253.87 258.86" y="323.67" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.3 Legal Agent Benchmark</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="72.00 82.04 89.73 96.26 101.63 108.44 112.70 115.69 121.37" y="111.05" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="129.35" y="111.05" font-size="11.00" class="sc-notoserifcjksc">评估语言模型通过</text><text x="220.25 230.27 236.70 243.28 249.24 252.24 255.13 262.82 269.25 275.83 280.09 285.99 291.82 296.08 298.97 305.64 310.33 316.76 321.02 327.45 333.25 339.69" y="111.05" font-size="11.00" class="sc-loraregular">Model Context Protocol</text><text x="342.68" y="111.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="353.68 363.72 371.41" y="111.05" font-size="11.00" class="sc-loraregular">MCP</text><text x="378.08" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）进行真实世界工具使用的表</text><text x="72.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">果综合为准确的回答。任务涉及在类生产环境的</text><text x="305.89 315.94 323.62" y="142.29" font-size="11.00" class="sc-loraregular">MCP</text><text x="333.18" y="142.29" font-size="11.00" class="sc-notoserifcjksc">服务器环境中进行多次工具调用，要求模</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">型使用真实的</text><text x="140.89 147.78 154.39" y="157.91" font-size="11.00" class="sc-loraregular">API</text><text x="160.97" y="157.91" font-size="11.00" class="sc-notoserifcjksc">和真实数据、处理错误与重试，并在不同服务器之间进行协调。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="224.39" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="224.39" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="184.93" y="224.39" font-size="11.00" class="sc-loraregular">85.8%</text><text x="218.45" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的通过率，高于</text><text x="298.35" y="224.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="345.94" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="359.84" y="224.39" font-size="11.00" class="sc-loraregular">82.2%</text><text x="390.11" y="224.39" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="401.11 407.21 413.40 416.10 420.11" y="224.39" font-size="11.00" class="sc-loraregular">89.1%</text><text x="432.57" y="224.39" font-size="11.00" class="sc-notoserifcjksc">的平均要点覆盖率表</text><text x="72.00" y="240.01" font-size="11.00" class="sc-notoserifcjksc">明，剩余的失败大多是部分失败而非完全失败。在我们计算该基准测试分数之后，我们生产部署</text><text x="72.00" y="255.63" font-size="11.00" class="sc-notoserifcjksc">的推理强度设置可能略有变化，因此部分分数可能无法精确复现。</text><text x="72.00 78.36 84.32 90.40 96.08 99.07 101.96 108.85 114.88 120.84 127.42 131.68 134.57 141.41 147.37 154.05 159.90 166.49 176.32 182.00 186.72" y="347.77" font-size="11.00" class="sc-loraregular">Legal Agent Benchmark</text><text x="192.63" y="347.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63 210.17 217.06" y="347.77" font-size="11.00" class="sc-loraregular">LAB</text><text x="223.90" y="347.77" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="259.79 268.28 273.96 278.80 284.30 290.21 296.02 298.91 305.79" y="347.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Harvey AI</text><text x="312.37" y="347.77" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。该基准测试包含</text><text x="502.27 506.27 509.04 514.95 521.78" y="347.77" font-size="11.00" class="sc-loraregular">1,200</text><text x="72.00" y="363.39" font-size="11.00" class="sc-notoserifcjksc">多个任务，涵盖</text><text x="151.89 157.56" y="363.39" font-size="11.00" class="sc-loraregular">24</text><text x="166.41" y="363.39" font-size="11.00" class="sc-notoserifcjksc">个不同的执业领域。每个任务包含一个封闭文档集，其中有电子邮件往来、律</text><text x="72.00" y="379.01" font-size="11.00" class="sc-notoserifcjksc">所模板、程序性文件以及其他客户案件材料，智能体必须从中筛查信息以完成任务。任务指令以</text><text x="72.00" y="394.63" font-size="11.00" class="sc-notoserifcjksc">合伙人向授薪律师发出的简短</text><text x="215.00" y="394.63" font-size="11.00" class="sc-loraregular">“</text><text x="263.40" y="394.63" font-size="11.00" class="sc-loraregular">”</text><text x="267.24" y="394.63" font-size="11.00" class="sc-notoserifcjksc">形式撰写，并规定了预期的输出文档及其格式。评估采</text><text x="72.00" y="410.25" font-size="11.00" class="sc-notoserifcjksc">用通过</text><text x="105.00" y="410.25" font-size="11.00" class="sc-loraregular">/</text><text x="112.59" y="410.25" font-size="11.00" class="sc-notoserifcjksc">不通过方式，由</text><text x="192.48" y="410.25" font-size="11.00" class="sc-loraregular">LLM</text><text x="218.19" y="410.25" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="273.19 279.55 285.91 295.83 301.21 306.88 311.98 317.36 321.46 328.02 334.60 340.63" y="410.25" font-size="11.00" class="sc-loraregular">LLM-as-Judge</text><text x="346.59" y="410.25" font-size="11.00" class="sc-notoserifcjksc">）依据一套由专家撰写的评分细则标准</text><text x="72.00" y="425.87" font-size="11.00" class="sc-notoserifcjksc">进行（每个被评估任务的标准数：最少</text><text x="261.89 267.64" y="425.87" font-size="11.00" class="sc-loraregular">23</text><text x="276.66" y="425.87" font-size="11.00" class="sc-notoserifcjksc">条，中位数</text><text x="334.55" y="425.87" font-size="11.00" class="sc-loraregular">56</text><text x="349.79" y="425.87" font-size="11.00" class="sc-notoserifcjksc">条，最多</text><text x="396.69" y="425.87" font-size="11.00" class="sc-loraregular">194</text><text x="415.90" y="425.87" font-size="11.00" class="sc-notoserifcjksc">条）。</text><text x="448.90 455.45 462.34" y="425.87" font-size="11.00" class="sc-loraregular">LAB</text><text x="472.07" y="425.87" font-size="11.00" class="sc-notoserifcjksc">的标准报告方</text><text x="72.00" y="441.49" font-size="11.00" class="sc-notoserifcjksc">式仅在所有标准均满足时才将任务视为成功。</text><text x="72.00" y="509.69" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 111.90 114.67 120.41 126.54" y="509.69" font-size="11.00" class="sc-loraregular">1,235</text><text x="135.44" y="509.69" font-size="11.00" class="sc-notoserifcjksc">道题上测试了</text><text x="204.33 212.02 215.01 220.62 227.19 233.77 239.73 242.62 251.36 257.92 264.49 269.58 272.48" y="509.69" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="278.47" y="509.69" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="289.47 293.47 296.25 302.15 308.15" y="509.69" font-size="11.00" class="sc-loraregular">1,251</text><text x="315.06" y="509.69" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="361.95" y="509.69" font-size="11.00" class="sc-loraregular">16</text><text x="375.20" y="509.69" font-size="11.00" class="sc-notoserifcjksc">道因数据缺陷被排除；这些排除项</text><text x="72.00" y="525.31" font-size="11.00" class="sc-notoserifcjksc">是在测试前确定的）。它取得了</text><text x="228.89 234.64 240.76 243.47 249.46 255.65" y="525.31" font-size="11.00" class="sc-loraregular">23.58%</text><text x="265.21" y="525.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="276.21 282.04 284.94 291.59 294.30 300.26" y="525.31" font-size="11.00" class="sc-loraregular">± 0.48</text><text x="306.44" y="525.31" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="317.44" y="525.31" font-size="11.00" class="sc-loraregular">n=5</text><text x="335.95" y="525.31" font-size="11.00" class="sc-notoserifcjksc">）的全通过率和</text><text x="415.84 422.20 428.32 430.68 435.59 441.56" y="525.31" font-size="11.00" class="sc-loraregular">93.74%</text><text x="454.02" y="525.31" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通</text><text x="72.00" y="540.93" font-size="11.00" class="sc-notoserifcjksc">过率（自适应思考，</text><text x="171.00" y="540.93" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="193.70" y="540.93" font-size="11.00" class="sc-notoserifcjksc">推理强度）。</text><text x="259.70 267.39 270.38 275.99 282.55 289.13 295.09 297.99 306.72 313.29 319.86 324.95 327.84" y="540.93" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="336.73" y="540.93" font-size="11.00" class="sc-notoserifcjksc">是在公开的</text><text x="394.62 404.64 410.61 415.70 420.79 426.47 432.50 438.46 443.55 446.44 453.33 459.94" y="540.93" font-size="11.00" class="sc-loraregular">Messages API</text><text x="466.52" y="540.93" font-size="11.00" class="sc-notoserifcjksc">上、在生产环</text><text x="72.00" y="556.55" font-size="11.00" class="sc-notoserifcjksc">境安全防护措施下评估的，当安全分类器被触发时回退到</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04 424.00 426.71" y="556.55" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="432.89" y="556.55" font-size="11.00" class="sc-notoserifcjksc">。自我们此前报告</text><text x="72.00 78.54 85.43" y="572.17" font-size="11.00" class="sc-loraregular">LAB</text><text x="95.17" y="572.17" font-size="11.00" class="sc-notoserifcjksc">结果以来，我们对评分流水线做了少量修复：正确渲染</text><text x="362.06 364.77 371.34 377.78 383.55" y="572.17" font-size="11.00" class="sc-loraregular">.docx</text><text x="392.28" y="572.17" font-size="11.00" class="sc-notoserifcjksc">交付物中的</text><text x="450.17 460.69 467.12 471.81" y="572.17" font-size="11.00" class="sc-loraregular">Word</text><text x="481.28" y="572.17" font-size="11.00" class="sc-notoserifcjksc">修订痕迹，</text><text x="72.00" y="587.79" font-size="11.00" class="sc-notoserifcjksc">以及恢复因达到</text><text x="151.89 156.15 162.58 168.41 174.38" y="587.79" font-size="11.00" class="sc-loraregular">token</text><text x="183.95" y="587.79" font-size="11.00" class="sc-notoserifcjksc">上限而被截断的输出；我们估计，这两项修复合计会使任何被评估模型的</text><text x="72.00" y="603.41" font-size="11.00" class="sc-notoserifcjksc">全通过分数提高</text><text x="151.89 158.55 161.25 167.25 173.74" y="603.41" font-size="11.00" class="sc-loraregular">0.5–1</text><text x="180.64" y="603.41" font-size="11.00" class="sc-notoserifcjksc">个百分点。我们的运行框架是一个内部重新实现的版本，保留了</text><text x="491.53 498.07 504.96" y="603.41" font-size="11.00" class="sc-loraregular">LAB</text><text x="514.70" y="603.41" font-size="11.00" class="sc-notoserifcjksc">的任</text><text x="72.00" y="619.03" font-size="11.00" class="sc-notoserifcjksc">务内容、评分细则标准、全通过计分方式以及默认评判模型（</text><text x="369.00 376.69 379.68 385.29 391.86 398.44 404.40 407.29 413.53 419.96 426.64 433.32 439.20 443.46 446.35 452.31 454.91" y="619.03" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="461.27" y="619.03" font-size="11.00" class="sc-notoserifcjksc">），但工具集有</text><text x="72.00" y="634.65" font-size="11.00" class="sc-notoserifcjksc">所缩减。公开运行框架提供</text><text x="206.89" y="634.65" font-size="11.00" class="sc-loraregular">bash</text><text x="230.65" y="634.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="241.65 246.34 252.28 257.96" y="634.65" font-size="11.00" class="sc-loraregular">read</text><text x="264.53" y="634.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="275.53 284.34 289.11 292.37 296.63" y="634.65" font-size="11.00" class="sc-loraregular">write</text><text x="302.59" y="634.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="313.59 319.50 326.08 329.35" y="634.65" font-size="11.00" class="sc-loraregular">edit</text><text x="333.60" y="634.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="344.60 350.95 353.94 360.38" y="634.65" font-size="11.00" class="sc-loraregular">glob</text><text x="369.67" y="634.65" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.56 389.65 394.33 400.30" y="634.65" font-size="11.00" class="sc-loraregular">grep</text><text x="409.76" y="634.65" font-size="11.00" class="sc-notoserifcjksc">工具，而我们只提供</text><text x="511.65" y="634.65" font-size="11.00" class="sc-loraregular">bash</text><text x="72.00" y="650.27" font-size="11.00" class="sc-notoserifcjksc">和一个</text><text x="107.89 114.72 120.59 124.84 131.43 137.87" y="650.27" font-size="11.00" class="sc-loraregular">Python</text><text x="147.44" y="650.27" font-size="11.00" class="sc-notoserifcjksc">工具。根据</text><text x="205.33 213.82 219.50 224.34 229.84 235.75" y="650.27" font-size="11.00" class="sc-loraregular">Harvey</text><text x="244.45" y="650.27" font-size="11.00" class="sc-notoserifcjksc">在其留出集上的评估，</text><text x="354.45 362.14 365.13 370.74 377.30 383.88 389.84 392.74 401.47 408.04 414.61 419.70 422.59" y="650.27" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="431.48" y="650.27" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="467.37 471.38 475.38 477.74 482.81" y="650.27" font-size="11.00" class="sc-loraregular">11.7%</text><text x="495.27" y="650.27" font-size="11.00" class="sc-notoserifcjksc">的全通过</text><text x="72.00" y="665.89" font-size="11.00" class="sc-notoserifcjksc">率和</text><text x="96.89" y="665.89" font-size="11.00" class="sc-loraregular">94.1%</text><text x="128.39" y="665.89" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通过率。</text><a href="https://www.harvey.ai/" rel="noopener"><rect x="259.79" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="259.79" y="338.97" width="36.22" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="296.02" y="338.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="298.91" y="338.97" width="10.57" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 107.23 110.61 120.66 129.87 137.60 145.09 153.90 157.33 164.93 173.99" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.4 GDPval-AA</text><text x="72.00 80.29 83.42 87.97 95.69 98.82 107.13 110.51 119.57 128.62 136.23 144.41 149.40 152.84 160.85 165.17 172.97 181.78 188.72" y="296.89" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.5 AA-Briefcase</text><text x="72.00 80.29 83.42 87.97 95.69 98.82 107.17 110.55 117.88 126.17 134.46 137.89 146.70 151.54 159.97 163.40 171.69 180.13 183.51 192.53 200.54 205.53 208.97 213.28 216.71 224.73" y="474.43" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.6 Toolathlon Verified</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">29</text><text x="81.32 87.31 92.39 96.43 104.34 109.50 113.76 119.73 125.72 130.88 136.95 139.48 142.10 148.01 150.47 153.00 155.63 160.98 164.85 167.47 172.63 175.35 177.81 180.44 183.49 188.86 194.99 200.36 205.81 208.86 211.32 213.95 221.55 228.90 235.25 240.20 245.35 248.07 250.57 253.20 259.33 264.28 269.43 272.15 278.12 283.21 287.08 289.89 295.95 301.48 304.11 310.37 313.72 316.35 325.28 331.13 337.11 342.53 345.24 347.87 353.84 359.26 363.59 366.92 372.76 377.09 386.03 391.19 397.25 402.52 407.94 410.57 416.42 422.48 425.11 429.37 434.77 439.93 442.65 447.45 455.34 461.19 465.48 468.20 474.17 476.80 482.17 487.44 493.29 499.35 505.20 514.14 516.95 522.24 527.40 530.12 532.79" y="704.45" font-size="10.00" class="sc-loraregular">Patwardhan, T., et al. (2025). GDPval: Evaluating AI model performance on real-world economically</text><text x="72.00 76.95 82.11 84.82 90.79 95.95 101.77 104.49 109.91 112.53 116.40 121.56 126.19 131.56 136.18 138.64 141.27 146.43 150.14 156.63 159.44 164.48 166.98 172.35 177.80 181.44 187.48 189.79 196.00 201.42 206.75 211.21 216.63" y="717.26" font-size="10.00" class="sc-loraregular">valuable tasks. arXiv:2510.04374.</text><text x="221.72 227.62 231.59 235.45 241.42 246.05 248.55 252.24 258.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="115.05" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="115.05" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="250.94" y="115.05" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真实</text><text x="72.00" y="130.67" font-size="11.00" class="sc-notoserifcjksc">世界专业任务上测试</text><text x="173.89" y="130.67" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36" y="130.67" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用了</text><text x="311.25" y="130.67" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="352.65" y="130.67" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="366.55 374.92 383.00 389.99 395.43 401.11" y="130.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="406.99" y="130.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="461.99" y="127.00" font-size="6.60" class="sc-loraregular">29</text><text x="469.35" y="130.67" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="494.25" y="130.67" font-size="11.00" class="sc-loraregular">220</text><text x="515.78" y="130.67" font-size="11.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="146.29" font-size="11.00" class="sc-notoserifcjksc">务，涵盖</text><text x="118.89" y="146.29" font-size="11.00" class="sc-loraregular">9</text><text x="128.14" y="146.29" font-size="11.00" class="sc-notoserifcjksc">个主要行业的</text><text x="197.04" y="146.29" font-size="11.00" class="sc-loraregular">44</text><text x="211.85" y="146.29" font-size="11.00" class="sc-notoserifcjksc">种职业。任务模拟实际的专业工作成果，包括文档、幻灯片、图表</text><text x="72.00" y="161.91" font-size="11.00" class="sc-notoserifcjksc">和电子表格。模型在智能体循环中获得</text><text x="261.89" y="161.91" font-size="11.00" class="sc-loraregular">shell</text><text x="288.41" y="161.91" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来解决任务，其表现通过</text><text x="72.00" y="177.53" font-size="11.00" class="sc-notoserifcjksc">对模型输出进行盲评两两比较得出的</text><text x="250.89 257.73 263.87" y="177.53" font-size="11.00" class="sc-loraregular">ELO</text><text x="275.50" y="177.53" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="341.50 349.19 352.18 357.79 364.36 370.94 376.90 379.79 388.52 395.09 401.66 406.75 409.64" y="177.53" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="418.53" y="177.53" font-size="11.00" class="sc-notoserifcjksc">占据了排行榜前两名：</text><text x="72.00" y="193.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="94.70" y="193.15" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="152.59 159.43 165.57" y="193.15" font-size="11.00" class="sc-loraregular">ELO</text><text x="177.20" y="193.15" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="191.09" y="193.15" font-size="11.00" class="sc-loraregular">1861</text><text x="211.64" y="193.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="222.64" y="193.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="258.54" y="193.15" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="283.43" y="193.15" font-size="11.00" class="sc-loraregular">1827</text><text x="304.59" y="193.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="315.59" y="193.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="351.49" y="193.15" font-size="11.00" class="sc-notoserifcjksc">设置仍优于其他所有模型，同时比</text><text x="519.38" y="193.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="72.00" y="208.77" font-size="11.00" class="sc-notoserifcjksc">少用</text><text x="96.89" y="208.77" font-size="11.00" class="sc-loraregular">25%</text><text x="121.26" y="208.77" font-size="11.00" class="sc-notoserifcjksc">的输出</text><text x="157.15 161.41 167.84 173.67 179.63" y="208.77" font-size="11.00" class="sc-loraregular">token</text><text x="186.31" y="208.77" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="323.79" y="208.77" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="324.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="324.97" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="245.60" y="324.97" font-size="11.00" class="sc-notoserifcjksc">开发，是一个新的基准测试，面向由行业专家构建的复杂项</text><text x="72.00" y="340.59" font-size="11.00" class="sc-notoserifcjksc">目中的长程知识工作。模型需要完成为期数周的项目，其中包含许多相互关联的任务和数千个输</text><text x="72.00" y="356.21" font-size="11.00" class="sc-notoserifcjksc">入源文件；评分结合了评分细则打分以及由前沿模型评审团进行的成对评判，以衡量可验证的任</text><text x="72.00" y="371.83" font-size="11.00" class="sc-notoserifcjksc">务完成情况、分析质量和呈现质量。</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 295.03 301.59 308.16 313.25 316.15" y="371.83" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="325.03" y="371.83" font-size="11.00" class="sc-notoserifcjksc">占据了排行榜前三名：</text><text x="435.03" y="371.83" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="457.73" y="371.83" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="515.62 522.46 528.60" y="371.83" font-size="11.00" class="sc-loraregular">ELO</text><text x="72.00" y="387.45" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="387.45" font-size="11.00" class="sc-loraregular">1720</text><text x="107.71" y="387.45" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="118.71" y="387.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="154.60" y="387.45" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="179.50" y="387.45" font-size="11.00" class="sc-loraregular">1693</text><text x="202.34" y="387.45" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="213.34" y="387.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="242.64" y="387.45" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="267.53" y="387.45" font-size="11.00" class="sc-loraregular">1606</text><text x="291.09" y="387.45" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="302.09" y="387.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="335.09" y="387.45" font-size="11.00" class="sc-loraregular">/</text><text x="342.68" y="387.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="371.98" y="387.45" font-size="11.00" class="sc-notoserifcjksc">设置仍优于其他所有模型，同时比</text><text x="72.00" y="403.07" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="94.70" y="403.07" font-size="11.00" class="sc-notoserifcjksc">分别少用</text><text x="141.59" y="403.07" font-size="11.00" class="sc-loraregular">15%/33%</text><text x="193.47" y="403.07" font-size="11.00" class="sc-notoserifcjksc">的输出</text><text x="229.36 233.62 240.05 245.88 251.84" y="403.07" font-size="11.00" class="sc-loraregular">token</text><text x="258.52" y="403.07" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="396.00" y="403.07" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00 78.50 84.94 91.37 94.36 99.96 104.22 110.81 113.80 120.24" y="498.52" font-size="11.00" class="sc-loraregular">Toolathlon</text><text x="129.80" y="498.52" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="498.52" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="498.52" font-size="11.00" class="sc-notoserifcjksc">个真实世界工具使用任务，涵盖办公生产力、电子</text><text x="72.00" y="514.14" font-size="11.00" class="sc-notoserifcjksc">商务与运营、数据分析以及网络调研。任务以真实的应用状态为初始设定，并由基于执行的检查</text><text x="72.00" y="529.76" font-size="11.00" class="sc-notoserifcjksc">器评分，这些检查器会核验生成的产出物及其副作用。该基准测试在</text><text x="404.89" y="529.76" font-size="11.00" class="sc-loraregular">32</text><text x="419.82" y="529.76" font-size="11.00" class="sc-notoserifcjksc">个应用中提供了</text><text x="499.71" y="529.76" font-size="11.00" class="sc-loraregular">600</text><text x="522.63" y="529.76" font-size="11.00" class="sc-notoserifcjksc">多</text><text x="72.00" y="545.38" font-size="11.00" class="sc-notoserifcjksc">个工具，任务要求在长程任务中正确选择工具、进行多步骤编排，并给出与检查器要求完全一致</text><text x="280.51" y="561.00" font-size="11.00" class="sc-loraregular">20–26</text><text x="314.89" y="561.00" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。我们针对</text><text x="72.00" y="576.62" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这是作者的最终版本（</text><text x="248.00 253.91 260.66 266.57" y="576.62" font-size="11.00" class="sc-loraregular">2026</text><text x="275.82" y="576.62" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="289.71" y="576.62" font-size="11.00" class="sc-loraregular">6</text><text x="298.96" y="576.62" font-size="11.00" class="sc-notoserifcjksc">月），其中任务提示词、标准答案和评估器均经过</text><text x="72.00" y="592.24" font-size="11.00" class="sc-notoserifcjksc">人工审核并定稿，并公开了八个模型的参考轨迹以供外部验证。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="221.72" y="707.20" width="155.60" height="12.80" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="160.35" y="106.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="160.35" y="106.25" width="43.54" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="203.89" y="106.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="206.78" y="106.25" width="41.26" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="366.55" y="121.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="366.55" y="121.87" width="37.55" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="404.10" y="121.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="406.99" y="121.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="417.99" y="121.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="417.99" y="121.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="428.99" y="121.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="428.99" y="121.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="439.99" y="121.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="439.99" y="121.87" width="11.00" height="11.00" fill="transparent"/>
