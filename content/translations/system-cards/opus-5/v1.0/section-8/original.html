<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p165.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 165 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 107.84 111.22 120.44 128.65 137.71 147.75" y="463.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.4 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">21</text><text x="80.03 86.13 92.12 97.97 104.04 109.56 112.09 114.72 118.24 120.70 123.23 125.86 131.20 135.07 137.70 142.86 145.58 148.04 150.67 153.72 159.08 165.22 170.59 176.25 179.30 181.75 184.38 191.73 198.50 204.71 211.69 219.63 222.13 224.76 229.92 232.54 237.86 242.12 247.97 252.60 257.22 262.11 268.09 273.94 282.87 288.03 290.84 296.91 299.54 305.36 310.77 316.84 322.16 328.15 337.08 342.24 346.53 351.90 354.53 357.86 363.70 368.03 370.66 378.11 383.47 388.89 394.86 397.49 403.70 409.11 413.74 419.14 424.30 428.56 433.88 439.86 442.49 448.75 454.02 459.33 465.30 469.56 474.72 479.99 484.71" y="704.45" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: a cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">165</text><text x="72.00" y="389.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.45 112.55 118.08 121.55 123.92 130.75 135.59 140.44 145.77 151.15 156.00 160.71 164.96 169.62 175.10 181.81" y="389.49" font-size="9.00" class="sc-lorabold">8.10.3.A] DeepSearchQA</text><text x="190.19" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">推理强度扩展</text><text x="244.19" y="389.49" font-size="9.00" class="sc-notoserifcjksc">。在</text><text x="264.55" y="389.49" font-size="9.00" class="sc-loraregular">98</text><text x="277.18" y="389.49" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="288.55 292.03 297.30 302.07 306.95" y="389.49" font-size="9.00" class="sc-loraregular">token</text><text x="314.77" y="389.49" font-size="9.00" class="sc-notoserifcjksc">预算下，推理强度从</text><text x="398.14 400.59 405.77" y="389.49" font-size="9.00" class="sc-loraregular">low</text><text x="415.34" y="389.49" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="426.71" y="389.49" font-size="9.00" class="sc-loraregular">max</text><text x="446.54" y="389.49" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="72.00 78.71 83.54 88.42 93.74 98.84 103.70 108.34 112.18 116.96 122.25 129.29" y="401.19" font-size="9.00" class="sc-loraregular">DeepSearchQA</text><text x="134.93" y="401.19" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="143.93" y="401.19" font-size="9.00" class="sc-loraregular">900</text><text x="162.67" y="401.19" font-size="9.00" class="sc-notoserifcjksc">道多跳网络研究题）上的平均</text><text x="282.04" y="401.19" font-size="9.00" class="sc-loraregular">F1</text><text x="290.25" y="401.19" font-size="9.00" class="sc-notoserifcjksc">，对应每任务平均计费成本（对数刻度）。</text><text x="461.25 467.54 469.99 474.58 479.95 485.33 490.21 492.58 499.73 505.10 510.47 514.64 517.01" y="401.19" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="524.28" y="401.19" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="412.89" font-size="9.00" class="sc-notoserifcjksc">成本为实际</text><text x="119.37 125.00 130.41" y="412.89" font-size="9.00" class="sc-loraregular">API</text><text x="135.79" y="412.89" font-size="9.00" class="sc-notoserifcjksc">计费；对比模型的成本在可获得时为实际计费，否则为缓存命中估算。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="487.25" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="487.25" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="487.25" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="483.58" font-size="6.60" class="sc-loraregular">21</text><text x="414.83" y="487.25" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.73 446.28 452.24 457.01 463.57 466.57 472.47 478.30 481.57 485.85" y="487.25" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.55" y="487.25" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="502.87" font-size="11.00" class="sc-notoserifcjksc">度研究基准，旨在评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="435.00 443.09 450.53 457.36 465.05" y="502.87" font-size="11.00" class="sc-loraregular">DRACO</text><text x="476.68" y="502.87" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="490.57" y="502.87" font-size="11.00" class="sc-loraregular">100</text><text x="511.13" y="502.87" font-size="11.00" class="sc-notoserifcjksc">个精</text><text x="72.00" y="518.49" font-size="11.00" class="sc-notoserifcjksc">选任务组成，这些任务源自多个领域的真实用户查询。问题依据专家编写的评分细则进行评分，</text><text x="72.00" y="534.11" font-size="11.00" class="sc-notoserifcjksc">评分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="600.81" font-size="11.00" class="sc-notoserifcjksc">我们在启用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="600.81" font-size="11.00" class="sc-loraregular">100</text><text x="414.45" y="600.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="428.35 432.60 439.04 444.87 450.83" y="600.81" font-size="11.00" class="sc-loraregular">token</text><text x="460.40" y="600.81" font-size="11.00" class="sc-notoserifcjksc">上限的条件下评</text><text x="72.00" y="616.43" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="616.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="616.43" font-size="11.00" class="sc-notoserifcjksc">模型。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p166.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 166 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">166</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">原始</text><text x="96.89 104.98 112.43 119.26 126.95" y="98.23" font-size="11.00" class="sc-loraregular">DRACO</text><text x="138.57" y="98.23" font-size="11.00" class="sc-notoserifcjksc">论文使用</text><text x="185.46 193.84 199.80 209.63 212.72 219.40 222.49 225.38 231.51 234.40 241.07 245.76" y="98.23" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="255.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们的评估</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中，我们使用</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.30" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="188.56" y="113.85" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用相同的二元</text><text x="466.45 476.55 483.39 489.65 497.24 505.51 513.89 523.99 530.83" y="113.85" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文</text><text x="162.89" y="129.47" font-size="11.00" class="sc-loraregular">§4.2</text><text x="186.22" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我们遵循论文的实验方案，对每个回答进行五</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">次独立评分运行并报告平均值。我们的评判提示词取自论文的</text><text x="369.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="393.89" y="145.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="410.28" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="468.18" y="145.09" font-size="11.00" class="sc-loraregular">A</text><text x="477.96" y="145.09" font-size="11.00" class="sc-notoserifcjksc">表明，评判</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">模型的选择可能使绝对分数变动</text><text x="228.89" y="160.71" font-size="11.00" class="sc-loraregular">10–25</text><text x="261.01" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数不能与论文的</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">主要公布数字直接比较。</text><text x="72.00" y="238.34" font-size="11.00" class="sc-notoserifcjksc">除评判模型的更换之外，与原始论文唯一的其他差异在于：我们指示模型将完整的最终报告写入</text><text x="72.00" y="253.96" font-size="11.00" class="sc-notoserifcjksc">其执行环境中的一个文件，并且只对该文件的内容评分，而不是对完整的智能体对话记录评分；</text><text x="72.00" y="269.58" font-size="11.00" class="sc-notoserifcjksc">这样可以将交付物与中间工具输出隔离开来。此前的</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="269.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18" y="269.58" font-size="11.00" class="sc-notoserifcjksc">评估则是用</text><text x="424.08" y="269.58" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="479.78" y="269.58" font-size="11.00" class="sc-notoserifcjksc">标签标记报</text><text x="72.00" y="285.20" font-size="11.00" class="sc-notoserifcjksc">告范围；在</text><text x="129.89" y="285.20" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="159.19" y="285.20" font-size="11.00" class="sc-notoserifcjksc">推理强度下，模型偶尔会遗漏这些标签，导致完整的报告被计为空白。基于文</text><text x="72.00" y="686.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="686.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.33 112.43 117.96 121.44 123.80 130.51 136.68 142.52 148.71" y="686.21" font-size="9.00" class="sc-lorabold">8.10.4.A] DRACO</text><text x="157.99" y="686.21" font-size="9.00" class="sc-notoserifcjkscbold">推理强度扩展</text><text x="211.99" y="686.21" font-size="9.00" class="sc-notoserifcjksc">。在</text><text x="232.36" y="686.21" font-size="9.00" class="sc-loraregular">98</text><text x="244.99" y="686.21" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="256.36 259.84 265.10 269.87 274.75" y="686.21" font-size="9.00" class="sc-loraregular">token</text><text x="282.58" y="686.21" font-size="9.00" class="sc-notoserifcjksc">预算下，推理强度从</text><text x="365.95 368.40 373.57" y="686.21" font-size="9.00" class="sc-loraregular">low</text><text x="383.15" y="686.21" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="394.52" y="686.21" font-size="9.00" class="sc-loraregular">max</text><text x="414.34" y="686.21" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="425.71 432.32 438.42 444.01 450.30" y="686.21" font-size="9.00" class="sc-loraregular">DRACO</text><text x="457.44" y="686.21" font-size="9.00" class="sc-notoserifcjksc">（智能体数据分析）</text><text x="72.00" y="697.91" font-size="9.00" class="sc-notoserifcjksc">上的归一化分数，对应每任务平均计费成本（对数刻度）。</text><text x="306.00 312.29 314.74 319.33 324.70 330.08" y="697.91" font-size="9.00" class="sc-loraregular">Claude</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="369.00" y="136.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="369.00" y="136.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="380.00" y="136.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="380.00" y="136.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="391.00" y="136.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="393.89" y="136.29" width="16.39" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p167.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 167 页"><text x="504.00 507.28 512.42" y="751.80" font-size="9.00" class="sc-loraregular">167</text><text x="72.00" y="80.05" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="103.70" y="80.05" font-size="9.00" class="sc-notoserifcjksc">的成本为实际</text><text x="160.07 165.70 171.11" y="80.05" font-size="9.00" class="sc-loraregular">API</text><text x="176.49" y="80.05" font-size="9.00" class="sc-notoserifcjksc">计费；对比模型的成本在可获得时为实际计费，否则为缓存命中估算。</text><text x="72.00" y="126.70" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="126.70" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="153.25" font-size="11.00" class="sc-notoserifcjksc">我们在多种多智能体配置下评估了</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04" y="153.25" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="314.03" y="153.25" font-size="11.00" class="sc-notoserifcjksc">。在这些设置中，模型的多个实例协作完成同</text><text x="72.00" y="168.87" font-size="11.00" class="sc-notoserifcjksc">一个任务。下面我们重点介绍在两个基准测试上的结果：</text><text x="347.00 353.75 358.44 364.77 373.58 378.67 384.63 392.32 398.76 408.59" y="168.87" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="415.16" y="168.87" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="426.16" y="168.87" font-size="11.00" class="sc-loraregular">§8.11.1</text><text x="455.63" y="168.87" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="184.49" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92" y="184.49" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="158.92" y="184.49" font-size="11.00" class="sc-loraregular">§8.11.2</text><text x="190.29" y="184.49" font-size="11.00" class="sc-notoserifcjksc">），并介绍我们测试的运行框架（</text><text x="355.29" y="184.49" font-size="11.00" class="sc-loraregular">§8.11.3</text><text x="386.89" y="184.49" font-size="11.00" class="sc-notoserifcjksc">）以及测量方法（</text><text x="474.89" y="184.49" font-size="11.00" class="sc-loraregular">§8.11.4</text><text x="506.31" y="184.49" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="232.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.11.1</text><text x="104.33" y="232.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="159.43" y="232.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">BrowseComp</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="260.45" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="143.05" y="260.45" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们使用第</text><text x="464.94" y="260.45" font-size="11.00" class="sc-loraregular">8.11.3</text><text x="493.56" y="260.45" font-size="11.00" class="sc-notoserifcjksc">节所述的</text><text x="72.00" y="276.07" font-size="11.00" class="sc-notoserifcjksc">两类运行框架运行了多智能体</text><text x="217.89 224.65 229.33 235.66 244.47 249.56 255.52 263.21 269.65 279.48" y="276.07" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="286.05" y="276.07" font-size="11.00" class="sc-notoserifcjksc">，并采用第</text><text x="343.94" y="276.07" font-size="11.00" class="sc-loraregular">8.11.4</text><text x="372.40" y="276.07" font-size="11.00" class="sc-notoserifcjksc">节所述的方法分析了结果。图</text><text x="72.00" y="291.69" font-size="11.00" class="sc-loraregular">8.11.1.A</text><text x="108.09" y="291.69" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="132.98" y="291.69" font-size="11.00" class="sc-loraregular">8.11.1.B</text><text x="169.03" y="291.69" font-size="11.00" class="sc-notoserifcjksc">将多智能体</text><text x="226.92 233.68 238.36 244.69 253.50 258.59 264.56 272.24 278.68 288.51" y="291.69" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="297.97" y="291.69" font-size="11.00" class="sc-notoserifcjksc">结果与单智能体结果并列展示。以下是一些关键发</text><text x="72.00" y="307.31" font-size="11.00" class="sc-notoserifcjksc">现：</text><text x="72.00" y="657.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="657.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 126.47 130.72 135.75 143.05 147.41 152.25 158.45 163.54 171.78" y="657.49" font-size="9.00" class="sc-lorabold">8.11.1.A] BrowseComp</text><text x="179.56" y="657.49" font-size="9.00" class="sc-notoserifcjkscbold">在单智能体与多智能体配置下的准确率与延迟对比。</text><text x="386.56" y="657.49" font-size="9.00" class="sc-notoserifcjksc">如方法部分所述，本图中的分数是在</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76" y="669.19" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="135.03" y="669.19" font-size="9.00" class="sc-notoserifcjksc">的预发布配置上收集的，因此单智能体数字与上一节略有不同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p168.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 168 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">168</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">多智能体运行框架取得了最高分数，并在得分</text><text x="292.00" y="82.61" font-size="11.00" class="sc-lorabold">–</text><text x="298.19" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">延迟前沿上帕累托占优。</text><text x="419.19" y="82.61" font-size="11.00" class="sc-notoserifcjksc">每一种多智能体变体都达</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到或超过了最佳单智能体变体，其中</text><text x="250.89" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="264.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">智能体团队取得了我们的最高分</text><text x="421.51 427.87 434.00 436.60 442.95" y="98.23" font-size="11.00" class="sc-loraregular">93.6%</text><text x="452.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，比最佳单智能体</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">基线高</text><text x="107.89" y="113.85" font-size="11.00" class="sc-loraregular">3.1</text><text x="123.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个百分点。随着智能体数量增加，延迟与准确率同步改善：相对于单智能体</text><text x="489.52" y="113.85" font-size="11.00" class="sc-loraregular">1000</text><text x="516.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00 76.26 82.69 88.52 94.48" y="129.47" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="129.47" font-size="11.00" class="sc-notoserifcjksc">基线，</text><text x="137.05" y="129.47" font-size="11.00" class="sc-loraregular">N</text><text x="148.33" y="129.47" font-size="11.00" class="sc-notoserifcjksc">智能体团队在</text><text x="217.22" y="129.47" font-size="11.00" class="sc-loraregular">N=5</text><text x="240.32" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="254.22" y="129.47" font-size="11.00" class="sc-loraregular">10</text><text x="267.94" y="129.47" font-size="11.00" class="sc-notoserifcjksc">个智能体时分别实现了</text><text x="380.84 386.83 389.43 395.79" y="129.47" font-size="11.00" class="sc-loraregular">5.6×</text><text x="404.51" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="418.40" y="129.47" font-size="11.00" class="sc-loraregular">5.9×</text><text x="442.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的加速，而异步子智</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">能体团队的得分也比该基线高</text><text x="217.89" y="145.09" font-size="11.00" class="sc-loraregular">2.8</text><text x="235.58" y="145.09" font-size="11.00" class="sc-notoserifcjksc">个百分点。</text><text x="72.00" y="522.02" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="522.02" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 126.47 130.72 135.75 143.05 147.41 152.25 158.45 163.54 171.78" y="522.02" font-size="9.00" class="sc-lorabold">8.11.1.B] BrowseComp</text><text x="179.56" y="522.02" font-size="9.00" class="sc-notoserifcjkscbold">在单智能体与多智能体配置下的准确率与成本对比。</text><text x="386.56" y="522.02" font-size="9.00" class="sc-notoserifcjksc">如下文方法部分所述，本图中的分数是</text><text x="72.00" y="533.72" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="83.37 89.66 92.11 96.70 102.07 107.45 112.33 114.70 121.84 127.22 132.59 136.76 139.12" y="533.72" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="146.39" y="533.72" font-size="9.00" class="sc-notoserifcjksc">的预发布配置上收集的，因此单智能体数字与上一节略有不同。</text><text x="72.00" y="587.58" font-size="11.00" class="sc-notoserifcjksc">在得分</text><text x="105.00" y="587.58" font-size="11.00" class="sc-loraregular">–</text><text x="367.38" y="587.58" font-size="11.00" class="sc-loraregular">8.11.1.B</text><text x="403.43" y="587.58" font-size="11.00" class="sc-notoserifcjksc">显示，成本随智能体数量增</text><text x="72.00" y="603.20" font-size="11.00" class="sc-notoserifcjksc">加而与分数一同上升，这表明多智能体配置能够通过在智能体之间分配工作，有效地吸收额外的</text><text x="72.00 76.26 82.69 88.52 94.48" y="618.82" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="618.82" font-size="11.00" class="sc-notoserifcjksc">预算。综合来看，多智能体运行框架提供了一种延迟与成本的权衡：当延迟很重要时，</text><text x="522.05" y="618.82" font-size="11.00" class="sc-loraregular">N</text><text x="72.00" y="634.44" font-size="11.00" class="sc-notoserifcjksc">智能体团队或异步子智能体能够以更高的成本更快地达到给定分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p169.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 169 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 86.92 92.08 98.15 103.67 106.20 108.83 112.35 114.81 117.34 119.97 125.32 129.18 131.81 136.97 139.69 142.15 144.78 147.83 153.19 159.33 164.70 170.36 173.41 175.87 178.49 184.55 188.81 194.66 200.19 204.44 209.60 218.48 224.70 230.11 236.18 241.50 247.49 249.99 252.61 259.60 264.76 270.83 273.46 276.18 281.33 287.40 292.93 298.90 304.05 309.53 314.95 317.58 326.52 332.36 338.34 343.76 346.48 351.11 353.73 357.99 363.41 369.23 375.20 378.01 380.72 386.70 389.33 395.30 399.56 405.40 410.93 415.19 420.35 429.28 433.91 436.54 439.92 444.18 450.03 458.96 461.59 466.22 471.54 475.80 480.88 484.75 490.07 495.87" y="704.45" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.51 122.82 129.03 134.60 140.04 145.46 151.24 153.70 156.33 162.22 166.19 170.06 176.03 180.66 183.16 186.84 193.30 198.46 202.79 208.08 210.89 215.55 218.01 223.86 228.14 233.66 240.12 245.28 251.10 255.38 262.27 267.64 273.42 279.63 285.07 287.38 293.59 299.16 304.61 310.02" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2605.03546. https://arxiv.org/abs/2605.03546</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">169</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.11.2</text><text x="107.09" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="162.18" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">ProgramBench</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="110.83" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92" y="107.16" font-size="6.60" class="sc-loraregular">22</text><text x="157.90" y="110.83" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="215.80" y="110.83" font-size="11.00" class="sc-loraregular">200</text><text x="238.26" y="110.83" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体仅获得由某个开源</text><text x="72.00" y="126.45" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网访问或反编译工具的情况</text><text x="72.00" y="142.07" font-size="11.00" class="sc-notoserifcjksc">下，重建一个能够复现原始程序行为的代码库。单智能体结果已在第</text><text x="404.89 411.08 413.78 419.96 422.67" y="142.07" font-size="11.00" class="sc-loraregular">8.9.1</text><text x="429.57" y="142.07" font-size="11.00" class="sc-notoserifcjksc">节中介绍；本节介绍多</text><text x="72.00" y="157.69" font-size="11.00" class="sc-notoserifcjksc">智能体</text><text x="107.89 114.56 119.25 125.68 131.76 136.45 142.13 151.89 158.74 164.70 171.37 177.23" y="157.69" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="186.71" y="157.69" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="72.00" y="208.19" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.56 119.25 125.68 131.76 136.45 142.12 151.89 158.74 164.70 171.37 177.23" y="208.19" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="186.71" y="208.19" font-size="11.00" class="sc-notoserifcjksc">上将</text><text x="211.60" y="208.19" font-size="11.00" class="sc-loraregular">5</text><text x="220.49" y="208.19" font-size="11.00" class="sc-notoserifcjksc">智能体团队和异步子智能体两种运行框架与单智能体基线进行比较</text><text x="72.00" y="223.81" font-size="11.00" class="sc-notoserifcjksc">评估，每个智能体的</text><text x="173.89" y="223.81" font-size="11.00" class="sc-loraregular">100</text><text x="194.45" y="223.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="208.35 212.60 219.04 224.87 230.83" y="223.81" font-size="11.00" class="sc-loraregular">token</text><text x="240.40" y="223.81" font-size="11.00" class="sc-notoserifcjksc">上限相同。如第</text><text x="320.29 326.47 329.18 335.36 338.07" y="223.81" font-size="11.00" class="sc-loraregular">8.9.1</text><text x="344.97" y="223.81" font-size="11.00" class="sc-notoserifcjksc">节所述，我们排除了参考二进制文件在</text><text x="72.00" y="239.43" font-size="11.00" class="sc-notoserifcjksc">隐藏测试集上得分低于</text><text x="184.89 191.55 194.25" y="239.43" font-size="11.00" class="sc-loraregular">0.9</text><text x="203.51" y="239.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="217.40" y="239.43" font-size="11.00" class="sc-loraregular">34</text><text x="232.38" y="239.43" font-size="11.00" class="sc-notoserifcjksc">个任务，剩下</text><text x="301.27" y="239.43" font-size="11.00" class="sc-loraregular">166</text><text x="320.89" y="239.43" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="331.89" y="239.43" font-size="11.00" class="sc-loraregular">“</text><text x="336.29" y="239.43" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="358.29" y="239.43" font-size="11.00" class="sc-loraregular">”</text><text x="362.13" y="239.43" font-size="11.00" class="sc-notoserifcjksc">任务。我们在一系列中间快照处进行</text><text x="72.00" y="255.05" font-size="11.00" class="sc-notoserifcjksc">评分，并利用由此得到的各任务分数、延迟和</text><text x="294.89 299.15 305.59 311.42 317.38" y="255.05" font-size="11.00" class="sc-loraregular">token</text><text x="326.95" y="255.05" font-size="11.00" class="sc-notoserifcjksc">轨迹，构建图</text><text x="395.84 402.02 404.73 408.73 415.39 418.09 424.00 426.71" y="255.05" font-size="11.00" class="sc-loraregular">8.10.2.A</text><text x="436.49" y="255.05" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="461.38 467.56 470.27 474.27 480.93 483.63 489.54 492.24" y="255.05" font-size="11.00" class="sc-loraregular">8.10.2.B</text><text x="501.98" y="255.05" font-size="11.00" class="sc-notoserifcjksc">中的累</text><text x="72.00" y="270.67" font-size="11.00" class="sc-notoserifcjksc">积曲线。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p170.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 170 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">170</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92" y="414.42" font-size="9.00" class="sc-lorabold">8.11.2.A]</text><text x="121.76" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.13" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.50" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.50" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.31" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.31 193.00 198.76 203.00 208.10 213.11 217.39 222.10 230.33 236.28 241.12 246.86 251.52" y="414.42" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="259.48" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的分数与延迟对比。</text><text x="367.48" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一个点表示：如果每个问题都在该</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">秒数处停止，所通过隐藏测试的平均比例。阴影区域表示</text><text x="299.37" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="319.67" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="445.24" y="426.12" font-size="9.00" class="sc-notoserifcjksc">），由各任务间的分数</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">方差计算得出。随着问题完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍贡献数据的问题越少。如方法部分</text><text x="72.00" y="449.52" font-size="9.00" class="sc-notoserifcjksc">所述，本图中的分数是在</text><text x="173.37 179.66 182.11 186.70 192.07 197.45 202.33 204.70 211.84 217.21 222.59 226.76 229.12" y="449.52" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="236.39" y="449.52" font-size="9.00" class="sc-notoserifcjksc">的预发布配置上收集的。</text><text x="72.00" y="506.47" font-size="11.00" class="sc-notoserifcjksc">从图</text><text x="96.89" y="506.47" font-size="11.00" class="sc-loraregular">8.11.2.A</text><text x="134.89" y="506.47" font-size="11.00" class="sc-notoserifcjksc">可见，在完整的黄金任务集上，与单智能体相比，</text><text x="376.89" y="506.47" font-size="11.00" class="sc-loraregular">5</text><text x="385.78" y="506.47" font-size="11.00" class="sc-notoserifcjksc">智能体团队和异步子智能体在相</text><text x="72.00" y="522.09" font-size="11.00" class="sc-notoserifcjksc">同分数下均表现出延迟改善。具体而言，</text><text x="270.00" y="522.09" font-size="11.00" class="sc-loraregular">5</text><text x="278.89" y="522.09" font-size="11.00" class="sc-notoserifcjksc">智能体团队达到相同的</text><text x="391.78 398.44 401.03" y="522.09" font-size="11.00" class="sc-loraregular">0.6</text><text x="410.28" y="522.09" font-size="11.00" class="sc-notoserifcjksc">分时，延迟比单智能体改</text><text x="72.00" y="537.71" font-size="11.00" class="sc-notoserifcjksc">善</text><text x="85.89" y="537.71" font-size="11.00" class="sc-loraregular">2.2x</text><text x="106.24" y="537.71" font-size="11.00" class="sc-notoserifcjksc">。异步子智能体的曲线大体位于两者之间，相比单智能体有所改善，但幅度小于</text><text x="494.14" y="537.71" font-size="11.00" class="sc-loraregular">5</text><text x="503.02" y="537.71" font-size="11.00" class="sc-notoserifcjksc">智能体</text><text x="72.00" y="553.33" font-size="11.00" class="sc-notoserifcjksc">团队，之后反超领先，取得最高的最终分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p171.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 171 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">171</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92" y="414.42" font-size="9.00" class="sc-lorabold">8.11.2.B]</text><text x="121.76" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.13" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.50" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.50" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.31" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.31 193.00 198.76 203.00 208.10 213.11 217.39 222.10 230.33 236.28 241.12 246.86 251.52" y="414.42" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="259.48" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的分数与</text><text x="324.85 328.56 333.62 338.74 343.58" y="414.42" font-size="9.00" class="sc-lorabold">token</text><text x="351.69" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">对比。</text><text x="378.69" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一个点表示：如果每个问题都在</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">该</text><text x="83.37 86.85 92.12 96.89 101.76" y="426.12" font-size="9.00" class="sc-loraregular">token</text><text x="109.59" y="426.12" font-size="9.00" class="sc-notoserifcjksc">用量处停止，所通过隐藏测试的平均比例。阴影区域表示</text><text x="336.96" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="357.26" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间，由各任务间的分数方差计算得出。</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">随着问题完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍贡献数据的问题越少。如方法部分所述，本图中的</text><text x="72.00" y="449.52" font-size="9.00" class="sc-notoserifcjksc">分数是在</text><text x="110.37 116.66 119.11 123.70 129.07 134.45 139.33 141.70 148.84 154.21 159.59 163.76 166.12" y="449.52" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="173.39" y="449.52" font-size="9.00" class="sc-notoserifcjksc">的预发布配置上收集的。</text><text x="72.00" y="506.47" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="506.47" font-size="11.00" class="sc-loraregular">8.11.2.B</text><text x="123.84" y="506.47" font-size="11.00" class="sc-notoserifcjksc">显示了第</text><text x="170.74" y="506.47" font-size="11.00" class="sc-loraregular">8.11.1</text><text x="197.24" y="506.47" font-size="11.00" class="sc-notoserifcjksc">节所述的同样的延迟与成本的权衡。延迟上的收益来自对问题的并发处</text><text x="72.00" y="522.09" font-size="11.00" class="sc-notoserifcjksc">理以及消耗更多</text><text x="151.89 156.15 162.58 168.41 174.38" y="522.09" font-size="11.00" class="sc-loraregular">token</text><text x="181.05" y="522.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="553.40" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.11.3</text><text x="107.41" y="553.40" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="581.28" font-size="11.00" class="sc-notoserifcjksc">我们评估了两种多智能体运行框架。两者共享一组通用工具：搜索任务使用网络搜索、网页抓</text><text x="72.00" y="596.90" font-size="11.00" class="sc-notoserifcjksc">取、程序化工具调用（代码执行和</text><text x="239.89" y="596.90" font-size="11.00" class="sc-loraregular">bash</text><text x="263.65" y="596.90" font-size="11.00" class="sc-notoserifcjksc">），编程任务使用</text><text x="354.55" y="596.90" font-size="11.00" class="sc-loraregular">bash</text><text x="381.20" y="596.90" font-size="11.00" class="sc-notoserifcjksc">工具。每个智能体的</text><text x="483.09 487.35 493.78 499.61 505.58" y="596.90" font-size="11.00" class="sc-loraregular">token</text><text x="515.15" y="596.90" font-size="11.00" class="sc-notoserifcjksc">上限</text><text x="72.00" y="612.52" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="612.52" font-size="11.00" class="sc-loraregular">100</text><text x="106.45" y="612.52" font-size="11.00" class="sc-notoserifcjksc">万。</text><text x="72.00" y="646.05" font-size="11.00" class="sc-lorabold">N</text><text x="83.40" y="646.05" font-size="11.00" class="sc-notoserifcjkscbold">智能体团队</text><text x="138.40" y="646.05" font-size="11.00" class="sc-notoserifcjksc">。由</text><text x="163.29" y="646.05" font-size="11.00" class="sc-loraregular">N=5</text><text x="186.39" y="646.05" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="200.28" y="646.05" font-size="11.00" class="sc-loraregular">10</text><text x="214.01" y="646.05" font-size="11.00" class="sc-notoserifcjksc">个对等智能体组成的团队并发处理任务。其中一个智能体被指定为</text><text x="72.00" y="661.67" font-size="11.00" class="sc-notoserifcjksc">主智能体，负责协调工作，并在需要时提交最终答案，但所有智能体拥有相同的工具，并且都能</text><text x="72.00" y="677.29" font-size="11.00" class="sc-notoserifcjksc">看到完整的任务描述。除任务工具外，每个智能体还拥有两个消息工具：</text><text x="424.00 430.24 436.20 442.88 449.45 452.35 462.37 468.33 473.42 478.52 484.19 490.22" y="677.29" font-size="11.00" class="sc-loraregular">Send Message</text><text x="496.18" y="677.29" font-size="11.00" class="sc-notoserifcjksc">，用于向</text><text x="72.00" y="692.91" font-size="11.00" class="sc-notoserifcjksc">一个或多个队友发送消息（插入在接收方下一个工具结果之后）；以及</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p172.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 172 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">172</text><text x="72.00 82.52 88.19 91.46 95.72 98.61 102.27 108.71 113.47 116.36 126.38 132.35 137.44 142.53 148.21 154.24" y="82.61" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="160.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，它会阻塞采样，直到有消息到达。在</text><text x="350.09 356.76 361.44 367.88 373.96 378.65 384.32 394.09 400.93 406.90 413.57 419.42" y="82.61" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="428.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，每个智能体在各自</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的任务代码仓库检出副本中工作，并可通过</text><text x="283.89 292.26 295.53" y="98.23" font-size="11.00" class="sc-loraregular">Git</text><text x="302.68" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">该运行框架旨在模拟多个智能体协作完成共享任务的真实场景，并通过让对等智能体并行工作来</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">降低延迟。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">。在该运行框架中，我们从一个主智能体开始，它可以派生异步、长期存在的子智</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">能体，同时保留对任务工具的直接访问。派生工具会立即返回确认信息，而不是等待子智能体执</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">行。每个子智能体只能看到主智能体提供的指令，而看不到原始任务描述；子智能体可以向任何</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">其他智能体以及主智能体发送消息。子智能体的最终回复会以消息形式传递给主智能体，此后该</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">子智能体处于空闲状态，直到主智能体用新指令将其唤醒。子智能体拥有任务工具以及与</text><text x="503.89" y="258.43" font-size="11.00" class="sc-loraregular">N</text><text x="515.17" y="258.43" font-size="11.00" class="sc-notoserifcjksc">智能</text><text x="72.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">体团队相同的通信工具（即</text><text x="206.89 213.13 219.09 225.77 232.35 235.24 245.26 251.22 256.32 261.41 267.09 273.11" y="274.05" font-size="11.00" class="sc-loraregular">Send Message</text><text x="281.97" y="274.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.86 306.38 312.05 315.32 319.58 322.47 326.13 332.57 337.33 340.22 350.25 356.21 361.30 366.39 372.07 378.10" y="274.05" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="384.06" y="274.05" font-size="11.00" class="sc-notoserifcjksc">）；主智能体还额外拥有创建子</text><text x="72.00" y="305.29" font-size="11.00" class="sc-notoserifcjksc">工具。对于搜索任务，只有主智能体的最终提交会被评分。可派生的子智能体数量没有上限。</text><text x="72.00" y="404.81" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.11.4</text><text x="108.22" y="404.81" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="432.69" font-size="11.00" class="sc-notoserifcjksc">我们展示的结果侧重于比较单智能体与多智能体运行框架之间的差异，包括分数、延迟、</text><text x="501.00 505.26 511.69 517.52 523.48" y="432.69" font-size="11.00" class="sc-loraregular">token</text><text x="72.00" y="448.31" font-size="11.00" class="sc-notoserifcjksc">用量和成本。具体而言，</text><text x="193.00 197.26 203.69 209.52 215.48" y="448.31" font-size="11.00" class="sc-loraregular">token</text><text x="225.05" y="448.31" font-size="11.00" class="sc-notoserifcjksc">用量按一个任务上所有智能体消耗的</text><text x="403.95 408.20 414.64 420.47 426.43" y="448.31" font-size="11.00" class="sc-loraregular">token</text><text x="436.00" y="448.31" font-size="11.00" class="sc-notoserifcjksc">总数计算；成本基于</text><text x="72.00 76.26 82.69 88.52 94.48" y="463.93" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="463.93" font-size="11.00" class="sc-notoserifcjksc">用量和按</text><text x="150.95 155.20 161.64 167.47 173.43" y="463.93" font-size="11.00" class="sc-loraregular">token</text><text x="183.00" y="463.93" font-size="11.00" class="sc-notoserifcjksc">计费的</text><text x="218.89 225.78 232.39" y="463.93" font-size="11.00" class="sc-loraregular">API</text><text x="238.97" y="463.93" font-size="11.00" class="sc-notoserifcjksc">价格计算，并假设缓存完全命中；延迟以推导的单任务延迟报</text><text x="72.00" y="479.55" font-size="11.00" class="sc-notoserifcjksc">告，而非原始的实际耗时。我们将每个智能体的输入和输出</text><text x="360.89 365.15 371.58 377.42 383.38" y="479.55" font-size="11.00" class="sc-loraregular">token</text><text x="392.95" y="479.55" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充</text><text x="72.00" y="495.17" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="113.05" y="495.17" font-size="11.00" class="sc-notoserifcjksc">）与解码速率，加上其实测的工具执行时间，然后取所有智能体延迟中的最大值。这样</text><text x="72.00" y="510.79" font-size="11.00" class="sc-notoserifcjksc">可以将运行框架的结构性延迟（例如它需要多少串行的模型工作和工具时间）与服务端波动（例</text><text x="72.00" y="526.41" font-size="11.00" class="sc-notoserifcjksc">如批处理、排队、硬件）隔离开来，从而在同等条件下比较各运行框架。</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">本节中的分数，无论是单智能体还是多智能体的</text><text x="305.89 312.65 317.33 323.66 332.47 337.56 343.52 351.21 357.65 367.48" y="610.80" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="376.94" y="610.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="390.84 397.50 402.19 408.62 414.71 419.39 425.07 434.84 441.68 447.64 454.32 460.17" y="610.80" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="466.76" y="610.80" font-size="11.00" class="sc-notoserifcjksc">，都是在</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="626.42" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="626.42" font-size="11.00" class="sc-notoserifcjksc">的预发布配置上收集的，使用了未发布的推理强度配置，且未启用安全防护分类</text><text x="72.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">器。这些分数有助于理解多智能体运行框架的相对性能，而非绝对性能。</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="691.75" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="143.05" y="691.75" font-size="11.00" class="sc-notoserifcjksc">的运行在事后由验证用</text><text x="255.94 263.63 266.62 272.23 278.80 285.38" y="691.75" font-size="11.00" class="sc-loraregular">Claude</text><text x="294.23" y="691.75" font-size="11.00" class="sc-notoserifcjksc">和一条自动化流水线进行扫描，以识别答案泄露；</text><text x="72.00" y="707.37" font-size="11.00" class="sc-notoserifcjksc">任何被标记的问题都计为错误。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p173.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 173 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 103.15 106.53 116.58 125.01 133.82 138.81 143.65 151.94 160.75 165.74 174.55 183.36 191.80" y="408.17" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.1 Chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">173</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="110.77" font-size="11.00" class="sc-notoserifcjksc">我们在四个基准测试上评估了</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04" y="110.77" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="294.93" y="110.77" font-size="11.00" class="sc-notoserifcjksc">的多模态能力，这些基准测试取自真实世界的智能</text><text x="72.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">体任务，反映了模型在专业场景中的部署方式：复杂图表推理（</text><text x="380.00 387.69 394.28 399.95 404.79 409.05 415.49 421.57 426.25 431.93 438.50 445.01" y="126.39" font-size="11.00" class="sc-loraregular">Chartography</text><text x="450.82" y="126.39" font-size="11.00" class="sc-notoserifcjksc">）、基于多视图渲</text><text x="72.00" y="142.01" font-size="11.00" class="sc-notoserifcjksc">染图的</text><text x="107.89 115.47 122.36" y="142.01" font-size="11.00" class="sc-loraregular">CAD</text><text x="133.45" y="142.01" font-size="11.00" class="sc-notoserifcjksc">生成（</text><text x="166.45 173.29 179.25 185.93 191.78 198.24 205.81 212.70 220.90 223.79 230.81 233.90 238.99 242.08 248.52 255.19 261.10 268.79 275.23 281.80" y="142.01" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="287.77" y="142.01" font-size="11.00" class="sc-notoserifcjksc">）、智能体计算机使用（</text><text x="408.77 414.56 421.00 430.83 437.40 443.96 448.22 454.18 458.95 461.84 468.41 473.50" y="142.01" font-size="11.00" class="sc-loraregular">computer use</text><text x="479.46" y="142.01" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="490.46 499.20 505.43 515.95 522.38 527.10 530.10" y="142.01" font-size="11.00" class="sc-loraregular">OSWorld</text><text x="72.00 77.91 80.45" y="157.63" font-size="11.00" class="sc-loraregular">2.0</text><text x="87.28" y="157.63" font-size="11.00" class="sc-notoserifcjksc">）以及专业文档理解（</text><text x="197.28 205.65 213.74 219.48 222.18 228.75 235.33" y="157.63" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="239.05" y="157.63" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="201.72" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="201.72" font-size="11.00" class="sc-notoserifcjksc">展现出随测试时计算扩展的多模态能力。在</text><text x="360.93 368.61 375.20 380.88 385.72 389.98 396.41 402.49 407.18 412.86 419.42 425.94" y="201.72" font-size="11.00" class="sc-loraregular">Chartography</text><text x="434.64" y="201.72" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="448.53 456.90 464.99 470.73 473.43 480.00 486.58" y="201.72" font-size="11.00" class="sc-loraregular">GDP.pdf</text><text x="493.19" y="201.72" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="217.34" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="217.34" font-size="11.00" class="sc-notoserifcjksc">弥合了</text><text x="184.93 192.61 195.61 201.22 207.78 214.36 220.32 223.22 231.95 238.52 245.09 250.18 253.07 259.03 261.74" y="217.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="270.81" y="217.34" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="284 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 106.10 109.48 117.67 125.69 134.12 141.92 150.35 160.40 169.46" y="455.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.2 BenchCAD</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00" y="394.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="394.74" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 127.95 133.54 138.26 142.58 146.30 151.39 156.40 160.68 165.39 170.77 176.21" y="394.74" font-size="9.00" class="sc-lorabold">8.12.1.B] Chartography</text><text x="183.54" y="394.74" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="210.54" y="394.74" font-size="9.00" class="sc-notoserifcjksc">模型在不同推理强度档位下启用自适应思考进行评估，分别使用和不使用工具。我</text><text x="72.00" y="406.44" font-size="9.00" class="sc-notoserifcjksc">们使用</text><text x="101.37 106.25 109.38 112.37 117.64 121.60" y="406.44" font-size="9.00" class="sc-loraregular">effort</text><text x="127.45" y="406.44" font-size="9.00" class="sc-notoserifcjksc">参数来调整所花费的测试时计算量。分数为每个推理强度档位下五次运行的平均值。图中显示</text><text x="498.82" y="406.44" font-size="9.00" class="sc-loraregular">95%</text><text x="519.12" y="406.44" font-size="9.00" class="sc-notoserifcjksc">置信</text><text x="72.00" y="418.14" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="72.00 78.84 84.80 91.48 97.33 103.79 111.37 118.26" y="479.27" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="126.45" y="475.60" font-size="6.60" class="sc-loraregular">25</text><text x="136.48" y="479.27" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="205.38 212.96 219.84" y="479.27" font-size="11.00" class="sc-loraregular">CAD</text><text x="230.93" y="479.27" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="321.82 325.83 330.41 333.19 339.54 346.38" y="479.27" font-size="11.00" class="sc-loraregular">17,900</text><text x="356.11" y="479.27" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="436.00 443.69 449.37 455.83 464.58 471.15 477.11 482.06" y="479.27" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="490.76" y="479.27" font-size="11.00" class="sc-notoserifcjksc">程序构建</text><text x="72.00" y="494.89" font-size="11.00" class="sc-notoserifcjksc">而成，覆盖</text><text x="129.89" y="494.89" font-size="11.00" class="sc-loraregular">106</text><text x="149.98" y="494.89" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="339.87" y="494.89" font-size="11.00" class="sc-loraregular">ISO</text><text x="358.53" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.53 377.61 381.30" y="494.89" font-size="11.00" class="sc-loraregular">DIN</text><text x="389.68" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.68" y="494.89" font-size="11.00" class="sc-loraregular">EN</text><text x="415.90" y="494.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="426.90" y="494.89" font-size="11.00" class="sc-loraregular">ASME</text><text x="459.86" y="494.89" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="473.75" y="494.89" font-size="11.00" class="sc-loraregular">IEC</text><text x="494.86" y="494.89" font-size="11.00" class="sc-notoserifcjksc">规格表为</text><text x="72.00" y="510.51" font-size="11.00" class="sc-notoserifcjksc">依据。该基准测试将</text><text x="173.89 181.47 188.36" y="510.51" font-size="11.00" class="sc-loraregular">CAD</text><text x="199.45" y="510.51" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务；我们报告</text><text x="411.34 418.36 421.45 426.54 429.63 436.07 442.74 448.65 456.34 462.77 469.35" y="510.51" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="478.21" y="510.51" font-size="11.00" class="sc-notoserifcjksc">任务的结</text><text x="72.00" y="526.12" font-size="11.00" class="sc-notoserifcjksc">果，该任务要求模型根据多视图渲染图生成</text><text x="283.89 291.58 297.26 303.71 312.47 319.04 325.00 329.95" y="526.12" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="338.65" y="526.12" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="592.83" font-size="11.00" class="sc-notoserifcjksc">我们内部的</text><text x="129.89 136.74 142.70 149.37 155.23 161.68 169.26 176.15" y="592.83" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="187.24" y="592.83" font-size="11.00" class="sc-notoserifcjksc">实现与原始参考实现一致，仅有两处细微修改。</text><text x="418.24" y="589.16" font-size="6.60" class="sc-loraregular">26</text><text x="425.60" y="592.83" font-size="11.00" class="sc-notoserifcjksc">第一，我们修正了参考</text><text x="72.00" y="608.45" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="138.00 143.09 148.90 153.99 158.25 164.21 174.05 176.94 183.51 188.19 194.63 204.46 211.03" y="608.45" font-size="11.00" class="sc-loraregular">system prompt</text><text x="215.29" y="608.45" font-size="11.00" class="sc-notoserifcjksc">）中的一处笔误，该笔误将提供给模型的渲染视图中的四个相机位</text><text x="72.00" y="624.07" font-size="11.00" class="sc-notoserifcjksc">置全部对调了。第二，我们更新了评分方式，使其除</text><text x="327.89 338.41 344.84 349.56 355.47 362.04 365.03 370.71 377.38" y="624.07" font-size="11.00" class="sc-loraregular">Workplane</text><text x="386.24" y="624.07" font-size="11.00" class="sc-notoserifcjksc">外也接受原始形状。在</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">25</text><text x="81.12 87.22 93.21 98.37 104.44 109.97 112.49 115.12 122.92 125.38 127.90 130.53 135.88 139.75 142.38 147.54 150.26 152.72 155.35 158.40 163.77 169.91 175.28 180.94 183.99 186.45 189.08 195.30 200.72 206.79 212.11 217.98 224.87 231.13 238.58 241.08 243.71 249.97 252.60 257.87 263.72 272.66 278.63 282.89
