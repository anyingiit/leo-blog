.sc-notoserifcjksc { font-family: "sc-notoserifcjksc"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">更新日志</text><text x="72.00 77.91 84.66 90.57" y="116.21" font-size="11.00" class="sc-loraregular">2026</text><text x="99.82" y="116.21" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.71" y="116.21" font-size="11.00" class="sc-loraregular">8</text><text x="122.79" y="116.21" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="136.68" y="116.21" font-size="11.00" class="sc-loraregular">19</text><text x="149.93" y="116.21" font-size="11.00" class="sc-notoserifcjksc">日</text><text x="108.00" y="132.40" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="132.89" y="132.40" font-size="11.00" class="sc-loraregular">5.2.2.1</text><text x="165.72" y="132.40" font-size="11.00" class="sc-notoserifcjksc">节中补充了提示词注入（</text><text x="286.72 293.28 297.97 304.41 314.24 320.81 325.06 327.96 331.05 337.67 340.54 346.45 352.24 356.50 359.59 366.03" y="132.40" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="372.70" y="132.40" font-size="11.00" class="sc-notoserifcjksc">）的漏洞赏金结果。原版系统卡中</text><text x="108.00" y="148.02" font-size="11.00" class="sc-notoserifcjksc">有一条脚注说明这些结果将在之后补充。</text><text x="108.00" y="164.79" font-size="11.00" class="sc-notoserifcjksc">更新了第</text><text x="154.89" y="164.79" font-size="11.00" class="sc-loraregular">5.2.2.4</text><text x="189.67" y="164.79" font-size="11.00" class="sc-notoserifcjksc">节中的</text><text x="225.57 233.26 239.58 248.26 254.70 259.41" y="164.79" font-size="11.00" class="sc-loraregular">Cowork</text><text x="268.21" y="164.79" font-size="11.00" class="sc-notoserifcjksc">评估结果。我们发现</text><text x="370.11 377.80 380.79 386.40 392.97 399.54 405.51 408.40 417.13 423.70 430.27 435.36 438.25" y="164.79" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="447.14" y="164.79" font-size="11.00" class="sc-notoserifcjksc">所用的运行框架</text><text x="108.00" y="180.41" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="180.41" font-size="11.00" class="sc-loraregular">harness</text><text x="158.85" y="180.41" font-size="11.00" class="sc-notoserifcjksc">）与此前模型所用的运行框架不一致。所有其他模型的结果均已更新为使用与</text><text x="108.00" y="196.03" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.74" y="196.03" font-size="11.00" class="sc-notoserifcjksc">相同的运行框架。我们还发现</text><text x="292.64 300.32 306.65 315.33 321.76 326.48" y="196.03" font-size="11.00" class="sc-loraregular">Cowork</text><text x="335.28" y="196.03" font-size="11.00" class="sc-notoserifcjksc">运行框架不支持</text><text x="412.28" y="196.03" font-size="11.00" class="sc-loraregular">“</text><text x="416.68" y="196.03" font-size="11.00" class="sc-notoserifcjksc">关闭思考</text><text x="460.68" y="196.03" font-size="11.00" class="sc-loraregular">”</text><text x="464.52" y="196.03" font-size="11.00" class="sc-notoserifcjksc">，因此我们删</text><text x="108.00" y="211.65" font-size="11.00" class="sc-notoserifcjksc">除了这部分结果，仅保留启用</text><text x="251.00" y="211.65" font-size="11.00" class="sc-loraregular">“</text><text x="255.40" y="211.65" font-size="11.00" class="sc-notoserifcjksc">扩展思考（</text><text x="310.40 316.31 322.14 326.39 332.36 339.03 345.61 351.52 358.10 360.99 365.25 371.84 374.93 381.60 387.51 390.60 397.28" y="211.65" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="403.36" y="211.65" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="414.36" y="211.65" font-size="11.00" class="sc-loraregular">”</text><text x="418.20" y="211.65" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text></svg></div>
