y="164.79" font-size="11.00" class="sc-notoserifcjksc">所用的运行框架</text><text x="108.00" y="180.41" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="180.41" font-size="11.00" class="sc-loraregular">harness</text><text x="158.85" y="180.41" font-size="11.00" class="sc-notoserifcjksc">）与此前模型所用的运行框架不一致。所有其他模型的结果均已更新为使用与</text><text x="108.00" y="196.03" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.74" y="196.03" font-size="11.00" class="sc-notoserifcjksc">相同的运行框架。我们还发现</text><text x="292.64" y="196.03" font-size="11.00" class="sc-loraregular sc-k">Cowork</text><text x="335.28" y="196.03" font-size="11.00" class="sc-notoserifcjksc">运行框架不支持</text><text x="412.28" y="196.03" font-size="11.00" class="sc-loraregular">“</text><text x="416.68" y="196.03" font-size="11.00" class="sc-notoserifcjksc">关闭思考</text><text x="460.68" y="196.03" font-size="11.00" class="sc-loraregular">”</text><text x="464.52" y="196.03" font-size="11.00" class="sc-notoserifcjksc">，因此我们删</text><text x="108.00" y="211.65" font-size="11.00" class="sc-notoserifcjksc">除了这部分结果，仅保留启用</text><text x="251.00" y="211.65" font-size="11.00" class="sc-loraregular">“</text><text x="255.40" y="211.65" font-size="11.00" class="sc-notoserifcjksc">扩展思考（</text><text x="310.40" y="211.65" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="403.36" y="211.65" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="414.36" y="211.65" font-size="11.00" class="sc-loraregular">”</text><text x="418.20" y="211.65" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text></svg></div>
