.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="154.36" font-size="11.00" class="sc-notoserifcjksc">是一款通用模型，并未针对网络安全能力进行优化。我们没有刻意在网络安全任</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">务上训练</text><text x="118.89" y="169.98" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="193.03" y="169.98" font-size="11.00" class="sc-notoserifcjksc">；它所展现的任何与网络安全相关的技能，很可能来自能力的整体提</text><text x="72.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">升，而非针对性训练。我们的测试表明，</text><text x="270.00" y="185.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="347.03" y="185.60" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力总体上强于</text><text x="481.93" y="185.60" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="526.63" y="185.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">但不及</text><text x="107.89" y="201.22" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="154.95" y="201.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="251.51" font-size="11.00" class="sc-notoserifcjksc">下面，我们报告</text><text x="151.89" y="251.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="228.93" y="251.51" font-size="11.00" class="sc-notoserifcjksc">在我们曾用于</text><text x="297.82" y="251.51" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="345.77" y="251.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="359.66" y="251.51" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="409.61" y="251.51" font-size="11.00" class="sc-notoserifcjksc">系统卡（</text><text x="453.61" y="251.51" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="518.27" y="251.51" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="267.13" font-size="11.00" class="sc-notoserifcjksc">部分评估上的表现：</text><text x="171.00" y="267.13" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="239.11" y="267.13" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="250.11 258.85 265.08 271.32 276.70 282.62 289.18 294.74" y="267.13" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="303.26" y="267.13" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="317.16" y="267.13" font-size="11.00" class="sc-loraregular sc-k">Firefox 147</text><text x="370.67" y="267.13" font-size="11.00" class="sc-notoserifcjksc">。我们还新增了一些评估：</text><text x="72.00" y="282.75" font-size="11.00" class="sc-loraregular sc-k">CyScenarioBench</text><text x="164.69" y="282.75" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="178.58" y="282.75" font-size="11.00" class="sc-loraregular sc-k">ExploitGym</text><text x="238.78" y="282.75" font-size="11.00" class="sc-notoserifcjksc">。请注意，我们已不再使用</text><text x="373.67" y="282.75" font-size="11.00" class="sc-loraregular sc-k">CyberGym</text><text x="431.15" y="282.75" font-size="11.00" class="sc-notoserifcjksc">作为评估，因为我们</text><text x="72.00" y="298.37" font-size="11.00" class="sc-notoserifcjksc">认为它已饱和（即表现最好的模型可以取得满分或接近满分的成绩，使其不再能有效检验能</text><text x="72.00" y="313.99" font-size="11.00" class="sc-notoserifcjksc">力）。</text><text x="72.00" y="366.25" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39" y="366.25" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00" y="392.81" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89" y="392.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="173.93" y="392.81" font-size="11.00" class="sc-notoserifcjksc">展现出强于</text><text x="231.82" y="392.81" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="279.42" y="392.81" font-size="11.00" class="sc-notoserifcjksc">的能力，并且在某些情况下接近</text><text x="436.31" y="392.81" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="486.26" y="392.81" font-size="11.00" class="sc-notoserifcjksc">的能力，我</text><text x="72.00" y="408.43" font-size="11.00" class="sc-notoserifcjksc">们面向默认用户的网络安全防护措施将与适用于</text><text x="305.89" y="408.43" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="344.29" y="408.43" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施类似。</text><text x="72.00" y="457.58" font-size="11.00" class="sc-notoserifcjksc">我们分两个阶段防止有害的网络安全使用。首先，由一个探针检查</text><text x="393.89" y="457.58" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="432.18" y="457.58" font-size="11.00" class="sc-notoserifcjksc">的内部激活值，对所</text><text x="72.00" y="473.20" font-size="11.00" class="sc-notoserifcjksc">有流量进行筛查。其次，探针会将其标记的任何流量升级转交给一个经过训练的</text><text x="459.89" y="473.20" font-size="11.00" class="sc-loraregular">LLM</text><text x="485.60" y="473.20" font-size="11.00" class="sc-notoserifcjksc">分类器（一</text><text x="72.00" y="488.82" font-size="11.00" class="sc-notoserifcjksc">个单独的模型，它会结合初始探针的判定，决定是否应拦截某段对话）。</text><text x="72.00" y="538.54" font-size="11.00" class="sc-notoserifcjksc">这一方法以</text><text x="127.00" y="538.54" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法分类器（</text><text x="317.84" y="538.54" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="72.00" y="554.16" font-size="11.00" class="sc-notoserifcjksc">集上训练了网络安全分类器，该数据集经过扩充，以更准确地模拟我们最为担心的特定类型越</text><text x="72.00" y="569.78" font-size="11.00" class="sc-notoserifcjksc">狱。在此基础上，我们利用内部自动化红队智能体生成的攻击，迭代扩充分类器的训练数据。我</text><text x="72.00" y="585.40" font-size="11.00" class="sc-notoserifcjksc">们让训练数据偏重于运行时间较长的智能体任务，因为这类任务可能导致大范围滥用。</text><text x="72.00" y="651.89" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络使用，其中包括被视为两用的活动（即可能具有进攻或</text><text x="72.00" y="667.51" font-size="11.00" class="sc-notoserifcjksc">防御用途的活动）。</text><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="127.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="127.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="138.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="138.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="149.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="149.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="160.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="160.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="529.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="529.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="193.00" y="529.74" width="71.48" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="264.48" y="529.74" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="267.37" y="529.74" width="50.47" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="317.84" y="529.74" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p037.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 37 页"><text x="72.00 79.72 82.85 90.57 93.70 98.25 101.63 108.44 114.93 123.74 127.17 135.46 138.89 143.73 147.10 155.29 163.31 171.74 179.54" y="286.83" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.1 Exploit Bench</text><text x="72.00" y="687.44" font-size="6.00" class="sc-loraregular">1</text><text x="76.81 82.59 87.96 93.38 95.91 98.53 104.20 106.66 109.19 111.82 118.77 121.40 127.53 131.86 137.83 146.77 149.48 154.85 159.58 162.11 164.74 171.95 174.40 177.03 180.08 185.45 191.59 196.96 202.61 205.66 208.12 210.75 216.97 222.27 228.23 230.95 236.80 239.77 243.64 249.85 255.27 261.34 266.66 272.65 275.14 277.77 284.03 286.66 291.96 297.12 303.08 308.24 314.06 316.87 319.59 322.56 326.44 331.72 334.35 337.07 342.23 348.21 354.18 359.60 363.93 366.56 372.38 377.79 383.86 389.18 395.17 404.10 409.26 413.55 418.92 421.55 424.88 430.72 435.05 437.68 443.46 449.24 458.41 461.04 466.31 471.54 477.35 482.77 487.10 491.73 497.10 502.41 508.38 512.71 515.68 519.57" y="691.66" font-size="10.00" class="sc-loraregular">Lee, S., &amp; Brumley, D. (2026). ExploitBench: A capability ladder benchmark for LLM cybersecurity</text><text x="72.00 77.16 82.64 88.05 94.03 97.90 102.53 104.99 107.62 112.77 116.48 122.97 125.78 130.83 133.33 138.69 144.47 150.68 156.13 158.59 162.22 167.64 171.28 176.73 182.30" y="704.46" font-size="10.00" class="sc-loraregular">agents. arXiv:2605.14153.</text><text x="187.38 193.28 197.25 201.12 207.09 211.71 214.21 217.90 224.36 229.52 233.84 239.14 241.95 246.61 249.07 254.92 259.19 264.72 271.18 276.34 282.15 286.43 293.33 298.70 304.48 310.68 316.13 318.59 322.23 327.65 331.29 336.73" y="704.46" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">37</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们</text><text x="94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前讨论过</text><text x="149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="162.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="192.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">网络安全分类器同样适用于</text><text x="327.30" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="401.44" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，但有一个值得注意的例</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外：对于</text><text x="118.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="193.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，我们解除了对源代码漏洞挖掘的拦截，以帮助我们的编程客户开发更</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">安全的代码。</text><text x="261.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="338.93" y="147.38" font-size="11.00" class="sc-notoserifcjksc">时遇到拦截，我们还通过</text><text x="459.93" y="147.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">划</text><text x="376.73" y="178.62" font-size="11.00" class="sc-notoserifcjksc">），以解除缓解措施，从而支持</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">渗透测试。</text><text x="72.00" y="245.93" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="245.93" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00" y="310.69" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="140.11" y="307.02" font-size="6.60" class="sc-loraregular">1</text><text x="145.41" y="310.69" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="324.30" y="310.69" font-size="11.00" class="sc-loraregular">AI</text><text x="337.76" y="310.69" font-size="11.00" class="sc-notoserifcjksc">模型在软件漏洞利用流程中能推进到多远</text><text x="72.00" y="326.31" font-size="11.00" class="sc-notoserifcjksc">（相比将漏洞利用作为单一的</text><text x="215.00" y="326.31" font-size="11.00" class="sc-loraregular">“</text><text x="219.40" y="326.31" font-size="11.00" class="sc-notoserifcjksc">通过或失败</text><text x="274.40" y="326.31" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="326.31" font-size="11.00" class="sc-notoserifcjksc">事件来评分，这是一种更细致的方法）。我们最近对</text><text x="72.00" y="341.93" font-size="11.00" class="sc-notoserifcjksc">该基准测试做了</text><text x="149.00" y="341.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细的介绍</text><text x="215.00" y="341.93" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="391.87" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89" y="391.87" font-size="11.00" class="sc-loraregular">16</text><text x="231.15" y="391.87" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖范围和崩溃复现，到</text><text x="72.00" y="407.49" font-size="11.00" class="sc-notoserifcjksc">沙箱原语、任意读写、控制流劫持以及任意代码执行。这些标志分为五个层级，用以区分仅能触</text><text x="72.00" y="423.11" font-size="11.00" class="sc-notoserifcjksc">发崩溃的模型与能够构造武器化所需可复用原语的模型。这为进攻性网络能力提供了一种细粒度</text><text x="72.00" y="438.73" font-size="11.00" class="sc-notoserifcjksc">的衡量。</text><text x="72.00" y="505.22" font-size="11.00" class="sc-notoserifcjksc">该基准测试以</text><text x="140.89" y="505.22" font-size="11.00" class="sc-loraregular">V8</text><text x="157.15" y="505.22" font-size="11.00" class="sc-notoserifcjksc">引擎（为</text><text x="204.04" y="505.22" font-size="11.00" class="sc-loraregular sc-k">Chrome</text><text x="248.13" y="505.22" font-size="11.00" class="sc-notoserifcjksc">提供支持的</text><text x="306.03" y="505.22" font-size="11.00" class="sc-loraregular sc-k">JavaScript</text><text x="360.29" y="505.22" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="374.18" y="505.22" font-size="11.00" class="sc-loraregular sc-k">WebAssembly</text><text x="447.89" y="505.22" font-size="11.00" class="sc-notoserifcjksc">引擎）中最近的</text><text x="527.79" y="505.22" font-size="11.00" class="sc-loraregular">41</text><text x="72.00" y="520.84" font-size="11.00" class="sc-notoserifcjksc">个漏洞为目标。模型会获得一个存在漏洞的</text><text x="283.89" y="520.84" font-size="11.00" class="sc-loraregular">V8</text><text x="300.15" y="520.84" font-size="11.00" class="sc-notoserifcjksc">构建版本，以及修复这些漏洞的补丁。在此基础</text><text x="72.00" y="536.46" font-size="11.00" class="sc-notoserifcjksc">上，它的任务是为该漏洞构建漏洞利用。该构建版本启用了多项缓解措施，包括</text><text x="459.89" y="536.46" font-size="11.00" class="sc-loraregular">V8</text><text x="476.15" y="536.46" font-size="11.00" class="sc-notoserifcjksc">堆沙箱、</text><text x="72.00" y="552.08" font-size="11.00" class="sc-loraregular">ASLR</text><text x="101.28" y="552.08" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀（</text><text x="167.28" y="552.08" font-size="11.00" class="sc-loraregular sc-k">stack canaries</text><text x="239.73" y="552.08" font-size="11.00" class="sc-notoserifcjksc">）。每个漏洞利用层级都由确定性验证器机械地评分。为抵御</text><text x="72.00" y="567.70" font-size="11.00" class="sc-notoserifcjksc">奖励破解（</text><text x="127.00" y="567.70" font-size="11.00" class="sc-loraregular sc-k">reward hacking</text><text x="206.01" y="567.70" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="228.01" y="567.70" font-size="11.00" class="sc-loraregular">V8</text><text x="244.27" y="567.70" font-size="11.00" class="sc-notoserifcjksc">中内置的挑战</text><text x="310.27" y="567.70" font-size="11.00" class="sc-loraregular">-</text><text x="315.65" y="567.70" font-size="11.00" class="sc-notoserifcjksc">应答函数会在多个随机化堆布局上重放，因此</text><text x="72.00" y="583.32" font-size="11.00" class="sc-notoserifcjksc">硬编码一个泄露的地址不算作有效解法。我们对每个漏洞运行五次试验。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="184.76" y="694.40" width="157.55" height="12.80" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="94.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="94.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="105.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="105.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="116.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="116.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="127.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="127.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="138.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="138.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/form/cyber-use-case" rel="noopener"><rect x="459.93" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/form/cyber-use-ca
