<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00" y="376.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 105.79 107.89 113.43" y="376.93" font-size="9.00" class="sc-lorabold">3.4.2.A]</text><text x="119.27" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">在这批流量上，</text><text x="182.27" y="376.93" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="245.97" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">对防御性编码的拦截显著少于</text><text x="365.34" y="376.93" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5</text><text x="426.67" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="435.67" y="376.93" font-size="9.00" class="sc-notoserifcjksc">因此，我们认为用户体验</text><text x="72.00" y="388.63" font-size="9.00" class="sc-notoserifcjksc">将与此前的</text><text x="119.37" y="388.63" font-size="9.00" class="sc-loraregular">Opus</text><text x="143.79" y="388.63" font-size="9.00" class="sc-notoserifcjksc">级模型相近。这一变化将为防御者和防御性网络安全用例提供关键优势，帮助其保护代码，并缩小易</text><text x="72.00" y="400.33" font-size="9.00" class="sc-notoserifcjksc">被利用的整体攻击面。</text><text x="72.00" y="447.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.3</text><text x="106.02" y="447.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖率</text><text x="72.00" y="474.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="474.90" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截危害潜力不对称的网络活动（即所使用的特定技能对攻击</text><text x="72.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc">者的助益大于对防御者的助益）。具体而言，按照我们的</text><text x="347.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全防护与越狱框架</text><text x="468.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc">中的条款所</text><text x="72.00" y="506.14" font-size="11.00" class="sc-notoserifcjksc">述，这一网络危害类别既涵盖禁止使用层级，也涵盖全面开放时的高风险两用层级。</text><text x="72.00" y="571.04" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现了这些类别的分类器覆盖率结果。</text><text x="72.00" y="586.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="586.66" font-size="11.00" class="sc-notoserifcjksc">的分类器对有害请求的覆盖率与</text><text x="305.93" y="586.66" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="382.62" y="586.66" font-size="11.00" class="sc-notoserifcjksc">的几乎相同。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="376.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 106.04 108.14 113.67 117.14 119.51 125.70 128.51 133.23 138.79 144.15 148.99 151.36 158.28 163.69 169.25 173.62 175.99" y="376.46" font-size="9.00" class="sc-lorabold">3.4.3.A] Claude Opus 5</text><text x="183.21" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">的分类器保持了</text><text x="248.58" y="376.46" font-size="9.00" class="sc-lorabold sc-k">Fable</text><text x="273.20" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">级的有害网络活动覆盖率，远高于此前的非</text><text x="446.57" y="376.46" font-size="9.00" class="sc-lorabold sc-k">Fable</text><text x="471.20" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">级模型。</text><text x="507.20" y="376.46" font-size="9.00" class="sc-notoserifcjksc">总体召</text><text x="72.00" y="388.16" font-size="9.00" class="sc-notoserifcjksc">回率是指在所有类别中被标记的有害示例所占的比例。每个模型均以其自身已部署的安全防护系统进行评分。</text><text x="72.00" y="436.36" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37" y="436.36" font-size="14.00" class="sc-notosanscjkscbold">安全防护鲁棒性测试</text><text x="72.00" y="462.92" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="462.92" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="462.92" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc">提示词、自定义运行框架和多智能体流水线。在我们的</text><text x="336.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="413.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了以下四个</text><text x="72.00" y="494.16" font-size="11.00" class="sc-notoserifcjksc">越狱严重性维度：</text><text x="90.00" y="543.91" font-size="11.00" class="sc-loraregular">•</text><text x="105.98" y="543.91" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="149.98" y="543.91" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="171.98" y="543.91" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="215.98" y="543.91" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能让攻击者在其现有工具和能力的基础上走多远，</text><text x="90.00" y="560.11" font-size="11.00" class="sc-loraregular">•</text><text x="105.98" y="560.11" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="171.98" y="560.11" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="193.98" y="560.11" font-size="11.00" class="sc-notoserifcjkscbold">通用性</text><text x="226.98" y="560.11" font-size="11.00" class="sc-notoserifcjksc">）：同一越狱技术可在多少种不同的进攻性任务上奏效。</text><text x="90.00" y="576.31" font-size="11.00" class="sc-loraregular">•</text><text x="105.98" y="576.31" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="171.98" y="576.31" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力</text><text x="90.00" y="592.51" font-size="11.00" class="sc-loraregular">•</text><text x="105.98" y="592.51" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="149.98" y="592.51" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00" y="624.91" font-size="11.00" class="sc-notoserifcjksc">例如，一个严重级越狱会在高能力提升的模型上易于发现、易于武器化且具有通用性。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p050.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 50 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">50</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="239.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的严重级越狱的证据（</text><text x="349.93" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">并不期望我们的分类器具备完美的鲁棒性。因此，我们在内部以及与外部合作伙伴一起对模型进</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行广泛测试，以主动发现并修补越狱。下文报告的是在</text><text x="338.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="415.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一个较早快照上进行的</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">测试结果；我们的安全防护措施在不同模型快照之间的运行情况通常是等同的，我们有信心这些</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">结果能够代表最终模型。</text><text x="72.00" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="222.19" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项内部对抗鲁棒性评估，用于衡量受安全防护的模型（</text><text x="402.00" y="222.19" font-size="11.00" class="sc-loraitalic">“</text><text x="406.27" y="222.19" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="428.27" y="222.19" font-size="11.00" class="sc-loraitalic">”</text><text x="432.36" y="222.19" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="237.81" font-size="11.00" class="sc-loraitalic">“</text><text x="87.27" y="237.81" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="120.27" y="237.81" font-size="11.00" class="sc-loraitalic">”</text><text x="124.36" y="237.81" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有用（</text><text x="366.36" y="237.81" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="428.93" y="237.81" font-size="11.00" class="sc-notoserifcjksc">）语言模型，经提示后</text><text x="72.00" y="253.43" font-size="11.00" class="sc-notoserifcjksc">模拟一名人类红队成员，试图从助手处诱导出进攻性网络能力。</text><text x="72.00" y="303.15" font-size="11.00" class="sc-notoserifcjksc">攻击者被派生到一个可访问助手模型端点的会话中。随后，攻击者获得针对助手的</text><text x="470.89" y="303.15" font-size="11.00" class="sc-loraregular">400</text><text x="493.41" y="303.15" font-size="11.00" class="sc-notoserifcjksc">次调用上</text><text x="72.00" y="318.77" font-size="11.00" class="sc-notoserifcjksc">限，在此期间，攻击者会收到拦截反馈，并有机会回溯到较早的状态以尝试新的方法。每项任务</text><text x="72.00" y="334.39" font-size="11.00" class="sc-notoserifcjksc">都将智能体置于一个独立的</text><text x="206.89" y="334.39" font-size="11.00" class="sc-loraregular sc-k">Docker</text><text x="72.00" y="350.01" font-size="11.00" class="sc-notoserifcjksc">加密受害者目录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="435.00" y="350.01" font-size="11.00" class="sc-loraregular sc-k">command-and-</text><text x="72.00" y="365.63" font-size="11.00" class="sc-loraregular sc-k">control</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务集包括以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="470.89" y="448.88" font-size="11.00" class="sc-loraregular sc-k">DNS</text><text x="493.60" y="448.88" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00" y="464.50" font-size="11.00" class="sc-loraregular sc-k">webhook</text><text x="143.30" y="464.50" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20" y="464.50" font-size="11.00" class="sc-loraregular">CVE</text><text x="379.80" y="464.50" font-size="11.00" class="sc-notoserifcjksc">的远程与本地利用（包括</text><text x="72.00" y="480.12" font-size="11.00" class="sc-loraregular sc-k">nginx</text><text x="100.62" y="480.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="111.62" y="480.12" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="158.39" y="480.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="169.39" y="480.12" font-size="11.00" class="sc-loraregular sc-k">glibc</text><text x="196.97" y="480.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="210.86" y="480.12" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="260.47" y="480.12" font-size="11.00" class="sc-notoserifcjksc">）；命令与控制；以及自我复制。</text><text x="72.00" y="529.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="529.84" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施与</text><text x="239.93" y="529.84" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="278.33" y="529.84" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施效果相近，因此在该评估中攻击成功</text><text x="72.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">率（</text><text x="94.00" y="545.46" font-size="11.00" class="sc-loraregular sc-k">attack success rate</text><text x="191.35" y="545.46" font-size="11.00" class="sc-notoserifcjksc">）非常低。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="72.00" y="376.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22" y="376.46" font-size="9.00" class="sc-lorabold">3.5.1.A]</text><text x="118.06" y="376.46" font-size="9.00" class="sc-notoserifcjksc">在我们的对抗性网络危害任务套件上，</text><text x="271.06" y="376.46" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="334.09" y="376.46" font-size="9.00" class="sc-notoserifcjksc">的鲁棒性与我们此前的</text><text x="426.46" y="376.46" font-size="9.00" class="sc-loraregular sc-k">Fable</text><text x="450.60" y="376.46" font-size="9.00" class="sc-notoserifcjksc">系统相当。</text><text x="72.00" y="420.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48" y="420.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00" y="447.95" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们与签约外部测试方合作，使用测试</text><text x="349.89" y="447.95" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="426.59" y="447.95" font-size="11.00" class="sc-notoserifcjksc">时所用的同一组示例任</text><text x="72.00" y="463.57" font-size="11.00" class="sc-notoserifcjksc">务，对</text><text x="107.89" y="463.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64" y="463.57" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行红队测试（</text><text x="300.64" y="463.57" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="364.74" y="463.57" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="496.52" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64" y="496.52" font-size="11.00" class="sc-notoserifcjksc">花费了大约</text><text x="275.53" y="496.52" font-size="11.00" class="sc-loraregular">100</text><text x="296.09" y="496.52" font-size="11.00" class="sc-notoserifcjksc">小时对我们的安全防护措施进行红队测试。他们借</text><text x="108.00" y="512.14" font-size="11.00" class="sc-notoserifcjksc">助针对特定任务的提示完成了上述评估中的一项任务，我们预计这种方法不易推广到其他</text><text x="108.00" y="527.76" font-size="11.00" class="sc-notoserifcjksc">任务。他们未发现任何新的通用越狱策略。</text><text x="108.00" y="561.29" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">10a Labs</text><text x="154.07" y="561.29" font-size="11.00" class="sc-notoserifcjksc">花费了约</text><text x="200.96" y="561.29" font-size="11.00" class="sc-loraregular">16</text><text x="214.22" y="561.29" font-size="11.00" class="sc-notoserifcjksc">小时测试多种攻击技术，未找到能完成所给任务的越狱方法。他们</text><text x="108.00" y="576.91" font-size="11.00" class="sc-notoserifcjksc">还运行了一个自动化攻击者，该攻击者迄今尚未产生任何能完成示例任务的攻击。</text><text x="108.00" y="609.87" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Gray Swan</text><text x="165.45" y="609.87" font-size="11.00" class="sc-notoserifcjksc">也运行了一个自动化攻击者，在我们的示例任务上每项任务尝试</text><text x="476.35" y="609.87" font-size="11.00" class="sc-loraregular">150</text><text x="496.07" y="609.87" font-size="11.00" class="sc-notoserifcjksc">次，结果</text><text x="108.00" y="625.49" font-size="11.00" class="sc-notoserifcjksc">发现该自动化攻击者无法完成其中任何一项任务。</text><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="108.00" y="487.72" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="161.26" y="487.72" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="164.15" y="487.72" width="26.55
