<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00" y="376.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 105.79 107.89 113.43" y="376.93" font-size="9.00" class="sc-lorabold">3.4.2.A]</text><text x="119.27 128.27 137.27 146.27 155.27 164.27 173.27" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">在这批流量上，</text><text x="182.27 188.46 191.27 195.98 201.55 206.91 211.75 214.12 221.04 226.45 232.01 236.38 238.74" y="376.93" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="245.97 254.97 263.97 272.97 281.97 290.97 299.97 308.97 317.97 326.97 335.97 344.97 353.97" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">对防御性编码的拦截显著少于</text><text x="365.34 371.53 374.34 379.05 384.62 389.98 394.82 397.19 401.96 406.67 411.80 414.60 419.45 421.81" y="376.93" font-size="9.00" class="sc-lorabold">Claude Fable 5</text><text x="426.67" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="435.67 444.67 453.67 462.67 471.67 480.67 489.67 498.67 507.67 516.67 525.67" y="376.93" font-size="9.00" class="sc-notoserifcjksc">因此，我们认为用户体验</text><text x="72.00 81.00 90.00 99.00 108.00" y="388.63" font-size="9.00" class="sc-notoserifcjksc">将与此前的</text><text x="119.37 126.51 131.89 137.26" y="388.63" font-size="9.00" class="sc-loraregular">Opus</text><text x="143.79 152.79 161.79 170.79 179.79 188.79 197.79 206.79 215.79 224.79 233.79 242.79 251.79 260.79 269.79 278.79 287.79 296.79 305.79 314.79 323.79 332.79 341.79 350.79 359.79 368.79 377.79 386.79 395.79 404.79 413.79 422.79 431.79 440.79 449.79 458.79 467.79 476.79 485.79 494.79 503.79 512.79 521.79 530.79" y="388.63" font-size="9.00" class="sc-notoserifcjksc">级模型相近。这一变化将为防御者和防御性网络安全用例提供关键优势，帮助其保护代码，并缩小易</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="400.33" font-size="9.00" class="sc-notoserifcjksc">被利用的整体攻击面。</text><text x="72.00 79.79 83.17 91.76 95.14" y="447.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.3</text><text x="106.02 119.02 132.02 145.02 158.02 171.02 184.02" y="447.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖率</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="474.90" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="474.90" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截危害潜力不对称的网络活动（即所使用的特定技能对攻击</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc">者的助益大于对防御者的助益）。具体而言，按照我们的</text><text x="347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全防护与越狱框架</text><text x="468.00 479.00 490.00 501.00 512.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc">中的条款所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="506.14" font-size="11.00" class="sc-notoserifcjksc">述，这一网络危害类别既涵盖禁止使用层级，也涵盖全面开放时的高风险两用层级。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="571.04" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现了这些类别的分类器覆盖率结果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="586.66" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03" y="586.66" font-size="11.00" class="sc-notoserifcjksc">的分类器对有害请求的覆盖率与</text><text x="305.93 313.61 316.61 322.22 328.78 335.36 341.32 344.22 349.81 355.48 361.88 364.88 370.84 373.73" y="586.66" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="382.62 393.62 404.62 415.62 426.62 437.62" y="586.66" font-size="11.00" class="sc-notoserifcjksc">的几乎相同。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.00" y="481.72" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.00" y="481.72" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="376.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 106.04 108.14 113.67 117.14 119.51 125.70 128.51 133.23 138.79 144.15 148.99 151.36 158.28 163.69 169.25 173.62 175.99" y="376.46" font-size="9.00" class="sc-lorabold">3.4.3.A] Claude Opus 5</text><text x="183.21 192.21 201.21 210.21 219.21 228.21 237.21" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">的分类器保持了</text><text x="248.58 253.35 258.07 263.19 265.99" y="376.46" font-size="9.00" class="sc-lorabold">Fable</text><text x="273.20 282.20 291.20 300.20 309.20 318.20 327.20 336.20 345.20 354.20 363.20 372.20 381.20 390.20 399.20 408.20 417.20 426.20 435.20" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">级的有害网络活动覆盖率，远高于此前的非</text><text x="446.57 451.34 456.06 461.18 463.99" y="376.46" font-size="9.00" class="sc-lorabold">Fable</text><text x="471.20 480.20 489.20 498.20" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">级模型。</text><text x="507.20 516.20 525.20" y="376.46" font-size="9.00" class="sc-notoserifcjksc">总体召</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00" y="388.16" font-size="9.00" class="sc-notoserifcjksc">回率是指在所有类别中被标记的有害示例所占的比例。每个模型均以其自身已部署的安全防护系统进行评分。</text><text x="72.00 80.39 84.03" y="436.36" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37 110.37 124.37 138.37 152.37 166.37 180.37 194.37 208.37" y="436.36" font-size="14.00" class="sc-notosanscjkscbold">安全防护鲁棒性测试</text><text x="72.00" y="462.92" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40 98.40 109.40 120.40" y="462.92" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="462.92" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc">提示词、自定义运行框架和多智能体流水线。在我们的</text><text x="336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="478.54" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了以下四个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="494.16" font-size="11.00" class="sc-notoserifcjksc">越狱严重性维度：</text><text x="90.00" y="543.91" font-size="11.00" class="sc-loraregular">•</text><text x="105.98 116.98 127.98 138.98" y="543.91" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="149.98 160.98" y="543.91" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="171.98 182.98 193.98 204.98" y="543.91" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="215.98 226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98 325.98 336.98 347.98 358.98 369.98 380.98 391.98 402.98 413.98 424.98 435.98 446.98 457.98 468.98 479.98 490.98 501.98 512.98" y="543.91" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能让攻击者在其现有工具和能力的基础上走多远，</text><text x="90.00" y="560.11" font-size="11.00" class="sc-loraregular">•</text><text x="105.98 116.98 127.98 138.98 149.98 160.98" y="560.11" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="171.98 182.98" y="560.11" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="193.98 204.98 215.98" y="560.11" font-size="11.00" class="sc-notoserifcjkscbold">通用性</text><text x="226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98 325.98 336.98 347.98 358.98 369.98 380.98 391.98 402.98 413.98 424.98 435.98 446.98 457.98 468.98 479.98 490.98" y="560.11" font-size="11.00" class="sc-notoserifcjksc">）：同一越狱技术可在多少种不同的进攻性任务上奏效。</text><text x="90.00" y="576.31" font-size="11.00" class="sc-loraregular">•</text><text x="105.98 116.98 127.98 138.98 149.98 160.98" y="576.31" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="171.98 182.98 193.98 204.98 215.98 226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98" y="576.31" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力</text><text x="90.00" y="592.51" font-size="11.00" class="sc-loraregular">•</text><text x="105.98 116.98 127.98 138.98" y="592.51" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="149.98 160.98 171.98 182.98 193.98 204.98 215.98 226.98 237.98 248.98 259.98 270.98 281.98 292.98 303.98 314.98 325.98" y="592.51" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="624.91" font-size="11.00" class="sc-notoserifcjksc">例如，一个严重级越狱会在高能力提升的模型上易于发现、易于武器化且具有通用性。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="469.74" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="469.74" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safe <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p050.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 50 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">50</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的严重级越狱的证据（</text><text x="349.93 355.51 361.19 367.59 370.58 376.55 379.44" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">并不期望我们的分类器具备完美的鲁棒性。因此，我们在内部以及与外部合作伙伴一起对模型进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行广泛测试，以主动发现并修补越狱。下文报告的是在</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 385.92 392.49 399.05 404.14 407.04" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一个较早快照上进行的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">测试结果；我们的安全防护措施在不同模型快照之间的运行情况通常是等同的，我们有信心这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">结果能够代表最终模型。</text><text x="72.00 79.79 83.17 91.54 94.92" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="222.19" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项内部对抗鲁棒性评估，用于衡量受安全防护的模型（</text><text x="402.00" y="222.19" font-size="11.00" class="sc-loraitalic">“</text><text x="406.27 417.27" y="222.19" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="428.27" y="222.19" font-size="11.00" class="sc-loraitalic">”</text><text x="432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="222.19" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="237.81" font-size="11.00" class="sc-loraitalic">“</text><text x="87.27 98.27 109.27" y="237.81" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="120.27" y="237.81" font-size="11.00" class="sc-loraitalic">”</text><text x="124.36 135.36 146.36 157.36 168.36 179.36 190.36 201.36 212.36 223.36 234.36 245.36 256.36 267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36" y="237.81" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有用（</text><text x="366.36 372.95 378.91 381.90 388.41 392.13 398.70 401.69 407.07 413.51 420.18 423.12" y="237.81" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="428.93 439.93 450.93 461.93 472.93 483.93 494.93 505.93 516.93 527.93" y="237.81" font-size="11.00" class="sc-notoserifcjksc">）语言模型，经提示后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="253.43" font-size="11.00" class="sc-notoserifcjksc">模拟一名人类红队成员，试图从助手处诱导出进攻性网络能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="303.15" font-size="11.00" class="sc-notoserifcjksc">攻击者被派生到一个可访问助手模型端点的会话中。随后，攻击者获得针对助手的</text><text x="470.89 476.86 483.69" y="303.15" font-size="11.00" class="sc-loraregular">400</text><text x="493.41 504.41 515.41 526.41" y="303.15" font-size="11.00" class="sc-notoserifcjksc">次调用上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="318.77" font-size="11.00" class="sc-notoserifcjksc">限，在此期间，攻击者会收到拦截反馈，并有机会回溯到较早的状态以尝试新的方法。每项任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="334.39" font-size="11.00" class="sc-notoserifcjksc">都将智能体置于一个独立的</text><text x="206.89 215.09 221.52 227.38 233.21 239.17" y="334.39" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="350.01" font-size="11.00" class="sc-notoserifcjksc">加密受害者目录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="435.00 440.80 447.23 457.07 466.90 472.58 479.25 485.83 491.21 496.89 503.56 510.14" y="350.01" font-size="11.00" class="sc-loraregular">command-and-</text><text x="72.00 77.80 84.23 90.81 95.07 99.75 106.19" y="365.63" font-size="11.00" class="sc-loraregular">control</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务集包括以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="470.89 478.98 487.36" y="448.88" font-size="11.00" class="sc-loraregular">DNS</text><text x="493.60 504.60 515.60" y="448.88" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00 83.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00 102.68 108.64 115.04 121.63 128.07 134.50" y="464.50" font-size="11.00" class="sc-loraregular">webhook</text><text x="143.30 154.30 165.30 176.30 187.30 198.30 209.30 220.30 231.30 242.30 253.30 264.30 275.30 286.30 297.30 308.30 319.30 330.30 341.30" y="464.50" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20 362.88 370.07" y="464.50" font-size="11.00" class="sc-loraregular">CVE</text><text x="379.80 390.80 401.80 412.80 423.80 434.80 445.80 456.80 467.80 478.80 489.80" y="464.50" font-size="11.00" class="sc-notoserifcjksc">的远程与本地利用（包括</text><text x="72.00 78.68 85.02 88.11 94.79" y="480.12" font-size="11.00" class="sc-loraregular">nginx</text><text x="100.62" y="480.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="111.62 120.36 126.92 132.89 139.56 145.80 152.04" y="480.12" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="158.39" y="480.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="169.39 175.74 178.73 181.82 188.23" y="480.12" font-size="11.00" class="sc-loraregular">glibc</text><text x="196.97" y="480.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="210.86 217.22 223.66 229.74 235.70 241.94 248.53 254.49 257.48" y="480.12" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="260.47 271.47 282.47 293.47 304.47 315.47 326.47 337.47 348.47 359.47 370.47 381.47 392.47 403.47 414.47" y="480.12" font-size="11.00" class="sc-notoserifcjksc">）；命令与控制；以及自我复制。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="529.84" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03" y="529.84" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施与</text><text x="239.93 245.51 251.19 257.59 260.58 266.55 269.44" y="529.84" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="278.33 289.33 300.33 311.33 322.33 333.33 344.33 355.33 366.33 377.33 388.33 399.33 410.33 421.33 432.33 443.33 454.33 465.33 476.33 487.33 498.33 509.33 520.33" y="529.84" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施效果相近，因此在该评估中攻击成功</text><text x="72.00 83.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">率（</text><text x="94.00 99.60 103.97 108.22 113.90 119.75 125.66 128.55 133.64 140.21 146.01 151.80 157.77 162.86 167.95 170.85 175.53 181.13 185.39" y="545.46" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="191.35 202.35 213.35 224.35 235.35" y="545.46" font-size="11.00" class="sc-notoserifcjksc">）非常低。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="72.00" y="376.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="376.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22" y="376.46" font-size="9.00" class="sc-lorabold">3.5.1.A]</text><text x="118.06 127.06 136.06 145.06 154.06 163.06 172.06 181.06 190.06 199.06 208.06 217.06 226.06 235.06 244.06 253.06 262.06" y="376.46" font-size="9.00" class="sc-notoserifcjksc">在我们的对抗性网络危害任务套件上，</text><text x="271.06 277.35 279.80 284.39 289.76 295.15 300.02 302.39 309.54 314.91 320.28 324.45 326.82" y="376.46" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="334.09 343.09 352.09 361.09 370.09 379.09 388.09 397.09 406.09 415.09" y="376.46" font-size="9.00" class="sc-notoserifcjksc">的鲁棒性与我们此前的</text><text x="426.46 431.03 435.67 440.91 443.36" y="376.46" font-size="9.00" class="sc-loraregular">Fable</text><text x="450.60 459.60 468.60 477.60 486.60" y="376.46" font-size="9.00" class="sc-notoserifcjksc">系统相当。</text><text x="72.00 79.79 83.17 91.54 94.92" y="420.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48 118.48 131.48 144.48 157.48 170.48" y="420.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="447.95" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们与签约外部测试方合作，使用测试</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 393.77 399.45 405.85 408.84 414.80 417.70" y="447.95" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="426.59 437.59 448.59 459.59 470.59 481.59 492.59 503.59 514.59 525.59" y="447.95" font-size="11.00" class="sc-notoserifcjksc">时所用的同一组示例任</text><text x="72.00 83.00 94.00" y="463.57" font-size="11.00" class="sc-notoserifcjksc">务，对</text><text x="107.89 116.63 123.19 129.76 134.85 137.75" y="463.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64 157.64 168.64 179.64 190.64 201.64 212.64 223.64 234.64 245.64 256.64 267.64 278.64 289.64" y="463.57" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行红队测试（</text><text x="300.64 305.32 311.23 317.81 323.19 327.44 333.38 339.06 348.89 351.98 358.66" y="463.57" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="364.74 375.74" y="463.57" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="496.52" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64 228.64 239.64 250.64 261.64" y="496.52" font-size="11.00" class="sc-notoserifcjksc">花费了大约</text><text x="275.53 279.53 286.36" y="496.52" font-size="11.00" class="sc-loraregular">100</text><text x="296.09 307.09 318.09 329.09 340.09 351.09 362.09 373.09 384.09 395.09 406.09 417.09 428.09 439.09 450.09 461.09 472.09 483.09 494.09 505.09 516.09 527.09" y="496.52" font-size="11.00" class="sc-notoserifcjksc">小时对我们的安全防护措施进行红队测试。他们借</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="512.14" font-size="11.00" class="sc-notoserifcjksc">助针对特定任务的提示完成了上述评估中的一项任务，我们预计这种方法不易推广到其他</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="527.76" font-size="11.00" class="sc-notoserifcjksc">任务。他们未发现任何新的通用越狱策略。</text><text x="108.00 112.00 118.83 124.51 127.40 134.00 139.68 146.08" y="561.29" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="154.07 165.07 176.07 187.07" y="561.29" font-size="11.00" class="sc-notoserifcjksc">花费了约</text><text x="200.96 204.96" y="561.29" font-size="11.00" class="sc-loraregular">16</text><text x="214.22 225.22 236.22 247.22 258.22 269.22 280.22 291.22 302.22 313.22 324.22 335.22 346.22 357.22 368.22 379.22 390.22 401.22 412.22 423.22 434.22 445.22 456.22 467.22 478.22 489.22 500.22 511.22 522.22" y="561.29" font-size="11.00" class="sc-notoserifcjksc">小时测试多种攻击技术，未找到能完成所给任务的越狱方法。他们</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="576.91" font-size="11.00" class="sc-notoserifcjksc">还运行了一个自动化攻击者，该攻击者迄今尚未产生任何能完成示例任务的攻击。</text><text x="108.00 116.37 121.06 126.62 132.43 135.32 141.51 150.21 155.88" y="609.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="165.45 176.45 187.45 198.45 209.45 220.45 231.45 242.45 253.45 264.45 275.45 286.45 297.45 308.45 319.45 330.45 341.45 352.45 363.45 374.45 385.45 396.45 407.45 418.45 429.45 440.45 451.45 462.45" y="609.87" font-size="11.00" class="sc-notoserifcjksc">也运行了一个自动化攻击者，在我们的示例任务上每项任务尝试</text><text x="476.35 480.35 486.35" y="609.87" font-size="11.00" class="sc-loraregular">150</text><text x="496.07 507.07 518.07 529.07" y="609.87" font-size="11.00" class="sc-notoserifcjksc">次，结果</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="625.49" font-size="11.00" class="sc-notoserifcjksc">发现该自动化攻击者无法完成其中任何一项任务。</text><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="108.00" y="487.72" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="161.26" y="487.72" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="164.15" y="487.72" width="26.55" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="190.71" y="487.72" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="193.60" y="487.72" width="21.14" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="108.00" y="552.49" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="124.51" y="552.49" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="127.40" y="552.49" width="23.77" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="108.00" y="601.07" width="24.43" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="132.43" y="601.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="135.32" y="601.07" width="27.24" height="11.00" fill="transparent"/></a></svg></div>
