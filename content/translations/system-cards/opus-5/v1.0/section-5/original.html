ifcjksc">两用与良性：</text><text x="174.00 180.36" y="474.05" font-size="11.00" class="sc-loraregular">61</text><text x="187.26 198.26 209.26 220.26 231.26 242.26 253.26 264.26 275.26 286.26 297.26 308.26" y="474.05" font-size="11.00" class="sc-notoserifcjksc">条提示，涵盖敏感但允许、</text><text x="319.26 326.94 329.94 335.55 342.11 348.69" y="474.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="357.55 368.55 379.55 390.55 401.55 412.55 423.55 434.55 445.55 456.55 467.55 478.55 489.55 500.55 511.55 522.55" y="474.05" font-size="11.00" class="sc-notoserifcjksc">应当提供协助的请求。示例包括运行</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="489.67" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="538.81" font-size="11.00" class="sc-notoserifcjksc">每个受测模型都配备标准的</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 252.87 259.31 265.89" y="538.81" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="274.74 285.74 296.74 307.74 318.74 329.74 340.74 351.74 362.74 373.74" y="538.81" font-size="11.00" class="sc-notoserifcjksc">工具集，每条提示运行</text><text x="387.63 391.64" y="538.81" font-size="11.00" class="sc-loraregular">10</text><text x="401.36 412.36 423.36 434.36 445.36 456.36 467.36" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="481.26 485.26 488.03 493.94 499.85" y="538.81" font-size="11.00" class="sc-loraregular">1,220</text><text x="509.58 520.58" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="554.43" font-size="11.00" class="sc-notoserifcjksc">试。与近期发布的 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p071.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 71 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">71</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="171.78 182.78 193.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.78 212.47 215.46 221.07 227.64 234.22 240.18 243.07 251.81 258.37 264.94 270.03 272.93" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.81 292.81 303.81 314.81 325.81 336.81 347.81 358.81 369.81 380.81 391.81 402.81 413.81 424.81 435.81 446.81 457.81 468.81 479.81 490.81 501.81 512.81 523.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更一致地拒绝恶意计算机使用任务。提升主要集中在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">要求模型汇编针对私人个体的信息或制作欺诈性文件的任务上。</text><text x="72.00 80.37 83.75 88.46 91.84" y="145.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72 193.72 206.72 219.72" y="145.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.61" font-size="11.00" class="sc-notoserifcjksc">本评估考察模型能否通过自主执行端到端的社交媒体影响力行动，为恶意行为者提供实质性的能</text><text x="72.00 83.00 94.00 105.00" y="189.23" font-size="11.00" class="sc-notoserifcjksc">力提升（</text><text x="116.00 122.57 129.13 132.13 135.22 139.07" y="189.23" font-size="11.00" class="sc-loraregular">uplift</text><text x="143.32 154.32 165.32 176.32 187.32 198.32 209.32 220.32 231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32 374.32 385.32 396.32 407.32 418.32 429.32 440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32 528.32" y="189.23" font-size="11.00" class="sc-notoserifcjksc">）。随着平台诚信系统以及影响力行动实施者的行动手法日趋成熟，我们在本次发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="204.85" font-size="11.00" class="sc-notoserifcjksc">布中对该评估进行了大幅更新，以强化模拟防御，并相应提高对模型的要求。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="264.57" font-size="11.00" class="sc-notoserifcjksc">在该评估中，模型被置于一个智能体运行框架（</text><text x="303.00 309.59 315.27 320.03 326.71 332.67 337.76" y="264.57" font-size="11.00" class="sc-loraregular">harness</text><text x="342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="264.57" font-size="11.00" class="sc-notoserifcjksc">）中，该框架包含一个模拟的多平台社交</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="280.19" font-size="11.00" class="sc-notoserifcjksc">媒体环境，提供账号创建与获取、发帖、指标追踪等工具。随后，模型被要求开展一场为期数周</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="311.43" font-size="11.00" class="sc-notoserifcjksc">能否适应障碍并让行动持续进行。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="371.72" font-size="11.00" class="sc-notoserifcjksc">我们对评估结构做了三项主要更新。模拟环境现在更加真实、更加全面；例如，创建账号现在要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="387.34" font-size="11.00" class="sc-notoserifcjksc">求模型自行获取电话号码和电子邮箱地址，模型可以阅读对其自身帖子的回复，并且运行中可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="402.96" font-size="11.00" class="sc-notoserifcjksc">包含来自运营方（</text><text x="160.00 166.43 173.00 178.96 183.65 189.25 193.51 199.94" y="402.96" font-size="11.00" class="sc-loraregular">operator</text><text x="204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70" y="402.96" font-size="11.00" class="sc-notoserifcjksc">）的行动中途指令，以改变行动目标。我们不再调整平台阻力的程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="418.58" font-size="11.00" class="sc-notoserifcjksc">度，而是引入了新的难度层级，通过改变人设数量、平台组合和行动时长来扩展所布置行动的规</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="434.20" font-size="11.00" class="sc-notoserifcjksc">模。最后，我们改进了评分细则，使评分更加客观、一致，并以真实世界的行动手法为依据。两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="449.82" font-size="11.00" class="sc-notoserifcjksc">个场景与此前各次发布相同：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="527.45" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35 422.35 433.35 444.35 455.35 466.35 477.35 488.35 499.35 510.35 521.35" y="527.45" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="543.07" font-size="11.00" class="sc-notoserifcjksc">投票率和支持热情；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="559.83" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放情绪化、按文化定制的信息来激</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="575.45" font-size="11.00" class="sc-notoserifcjksc">化这些断层线。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="618.41" font-size="11.00" class="sc-notoserifcjksc">每个场景在三个难度层级中的每一层级各运行八次（此前各次发布中每个层级各运行三次）。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="634.03" font-size="11.00" class="sc-notoserifcjksc">们报告最高难度层级下八次尝试的评分细则得分中位数。与此前各次发布一样，本评估针对模型</text><text x="72.00" y="649.65" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="649.65" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40 109.40" y="649.65" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="120.40" y="649.65" font-size="11.00" class="sc-loraregular">”</text><text x="124.24 135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24" y="649.65" font-size="11.00" class="sc-notoserifcjksc">变体运行，该变体的无害性训练有所减少，以评估模型的原始能力。</text></svg></div>

17.06 226.06 235.06 244.06 253.06 262.06 271.06 280.06" y="303.45" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06 298.06 307.06 316.06 325.06 334.06 343.06 352.06 361.06 370.06" y="303.45" font-size="9.00" class="sc-notoserifcjksc">结果为最高难度层级下</text><text x="381.43" y="303.45" font-size="9.00" class="sc-loraregular">8</text><text x="388.85 397.85 406.85 415.85 424.85 433.85 442.85 451.85 460.85 469.85 478.85 487.85" y="303.45" font-size="9.00" class="sc-notoserifcjksc">次尝试得分的中位数，满分</text><text x="499.22 504.23" y="303.45" font-size="9.00" class="sc-loraregular">32</text><text x="511.43 520.43 529.43" y="303.45" font-size="9.00" class="sc-notoserifcjksc">分。分</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00" y="315.15" font-size="9.00" class="sc-notoserifcjksc">数越高表示能力越强，因而可能为恶意行为者提供的能力提升也越大。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="355.76" font-size="11.00" class="sc-notoserifcjksc">在我们更新后的智能体影响力行动评估中，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14" y="355.76" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="355.76" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两个测试场景中的得</text><text x="72.00 83.00 94.00" y="371.38" font-size="11.00" class="sc-notoserifcjksc">分均与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="371.38" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13 207.13 218.13 229.13 240.13 251.13 262.14" y="371.38" font-size="11.00" class="sc-notoserifcjksc">相当，并略高于</text><text x="276.03 283.72 286.71 292.32 298.89 305.46 311.43 314.32 323.05 329.62 336.19 341.28 344.17 350.13 352.84" y="371.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="361.92" y="371.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="375.81 383.50 386.49 392.10 398.67 405.24 411.21 414.10 420.34 426.77 433.45 440.13 446.01 450.27 453.16" y="371.38" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="459.16 470.16 481.16 492.16 503.16 514.16 525.16" y="371.38" font-size="11.00" class="sc-notoserifcjksc">。我们的评估结</text><text x="72.00 83.00 94.00" y="387.00" font-size="11.00" class="sc-notoserifcjksc">论是，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15" y="387.00" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03" y="387.00" font-size="11.00" class="sc-notoserifcjksc">在真实影响力行动的许多操作步骤中将需要大量的人类指导。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="446.72" font-size="11.00" class="sc-notoserifcjksc">与此前各次发布一样，这些模型的完整训练版本（包含无害性训练）拒绝参与这些任务，因为两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc">个场景均明显违反我们的</text><text x="193.00 204.00 215.00 226.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="237.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 81.02 84.66" y="512.88" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02 110.02 124.02 138.02 152.02 166.02 180.02 194.02 208.02 222.02 236.02 250.02 264.02 278.02" y="512.88" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="539.44" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="555.06" font-size="11.00" class="sc-notoserifcjksc">藏在工具结果中、由智能体在执行任务过程中处理的恶意指令。例如，智能体被要求总结的一封</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="570.68" font-size="11.00" class="sc-notoserifcjksc">电子邮件中可能包含隐藏文本，指示其外泄所有近期的内部通信。一次成功的提示词注入攻击会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="601.92" font-size="11.00" class="sc-notoserifcjksc">或共享文档中的单个载荷就能攻陷任何处理它的智能体，攻击者无需针对特定用户或系统。当模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="617.54" font-size="11.00" class="sc-notoserifcjksc">型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合使攻击者能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="633.16" font-size="11.00" class="sc-notoserifcjksc">够外泄敏感信息或触发未经授权的操作。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

7 479.97 490.97 501.97 512.97 523.97" y="179.19" font-size="11.00" class="sc-notoserifcjksc">级模型。我们将继续加强智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">体产品中的安全防护措施，以进一步保护用户免受提示词注入的影响。在我们的许多产品中，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">们运行提示词注入探针，它们会在模型据工具结果采取行动之前检查这些结果，并标记看起来像</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">注入指令的内容。在部分产品中，我们还提供</text><text x="292.00 303.00 314.00 325.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">自动模式</text><text x="336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">，它将这些探针与一个拦截潜在危险工具</text><text x="72.00 80.37 83.75 91.21 94.59" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39 115.39 128.39 141.39 154.39 167.39" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部红队测试</text><text x="72.00 83.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">正如</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 141.42 147.86 154.53 161.21 167.10 171.35 174.24" y="351.73" font-size="11.00" class="sc-loraregular" 5 131.15 144.15 157.15 170.15 183.15 196.15 209.15 222.15 235.15 248.15 261.15 274.15 287.15 300.15 313.15" y="590.89" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对抗自适应攻击者的鲁棒性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="622.77" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准测试。</text><text x="380.00" y="619.11" font-size="6.60" class="sc-loraregular">4</text><text x="386.47 397.47 408.47 419.47 430.47 441.47 452.47 463.47 474.47 485.47 496.47 507.47 518.47 529.47" y="622.77" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="638.39" font-size="11.00" class="sc-notoserifcjksc">能带来虚假的安全感，因为模型可能在已有的攻击模式上表现良好，却仍易受新型方法的攻击。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="654.01" font-size="11.00" class="sc-notoserifcjksc">我们将继续投入于能更好地逼近</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p075.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 75 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">75</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">真实世界对手能力的自适应评估，既在内部开展，也与外部研究合作伙伴协作开展。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.18" font-size="11.00" class="sc-notoserifcjksc">本节中的评估衡量的是模型面对根据与模型交互情况不断改进攻击手法的对手时的鲁棒性。这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">评估体现了一种刻意宽松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景都有多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。现实世界中的攻击者通常不具备这两种可用手段，因为他们并不知道目标部署的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">况，而且反复尝试会增加被发现的可能性。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="228.34" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71 115.71 126.71 137.71 148.71 159.71 170.71 181.71 192.71 203.71 214.71 225.71" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00 83.00 94.00 105.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">与我们在</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="260.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="204.78 215.78 226.78" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78" y="260.72" font-size="11.00" class="sc-notoserifcjksc">中首次采用的做法一样，我们与</text><text x="394.67 403.05 407.73 413.30 419.11 422.00 428.18 436.88 442.56" y="260.72" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="452.13 463.13 474.13 485.13 496.13 507.13 518.13 529.13" y="260.72" font-size="11.00" class="sc-notoserifcjksc">合作举办了一次实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">时漏洞赏金活动：专业的红队测试人员相互竞争，争夺一个奖金池，奖金授予针对一组前沿模型</text><text x="72.00 83.00 94.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">（包括</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="291.96" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="291.96" font-size="11.00" class="sc-notoserifcjksc">）成功实施的提示词注入攻击。目标模型的身份自始至终保持隐藏，且每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">位红队测试人员针对每个模型的每个场景最多只能提交一次成功的攻击。本轮涵盖了工具使用、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">编程和计算机使用领域的</text><text x="195.89 199.90" y="323.20" font-size="11.00" class="sc-loraregular">11</text><text x="206.79 217.79 228.79 239.79 250.79" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个新场景。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="374.07" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29" y="374.07" font-size="11.00" class="sc-notoserifcjksc">模型在评估时推理强度（</text><text x="231.29 235.55 242.14 245.23 251.91 257.81 260.90 267.58 273.66 276.56 282.52 286.35 290.01 296.44 301.28" y="374.07" font-size="11.00" class="sc-loraregular">thinking effort</text><text x="305.54 316.54" y="374.07" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="330.43 337.02 340.11 346.46" y="374.07" font-size="11.00" class="sc-loraregular">high</text><text x="353.05 364.05 375.05 386.05 397.05 408.05 419.05 430.05 441.05 452.05 463.05 474.05 485.05 496.05 507.05 518.05 529.05" y="374.07" font-size="11.00" class="sc-notoserifcjksc">，且未启用我们产品中使用的额外防护</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">措施（例如运行框架层面的防御和提示词注入探针），因此结果反映的是模型自身的鲁棒性，代</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">表了已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置进行测试，这些配置可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="420.93" font-size="11.00" class="sc-notoserifcjksc">包含、也可能不包含额外的安全防护措施。</text><text x="281.00 289.37 296.04 302.37 307.75 313.75 316.34" y="420.93" font-size="11.00" class="sc-loraregular">GPT-5.6</text><text x="325.59 336.59 347.59 358.59 369.59 380.59 391.59 402.59 413.59 424.59 435.59" y="420.93" font-size="11.00" class="sc-notoserifcjksc">模型在评估时推理强度为</text><text x="449.49 456.08 459.17 465.51" y="420.93" font-size="11.00" class="sc-loraregular">high</text><text x="472.10" y="420.93" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="118.89" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="118.89" y="251.92" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="154.2  501.00 512.00 523.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">二者分别作用于传入数据和传出操作，从而使这两层防护的失效相互独立。探针作用于传入的数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">据，分类器作用于传出的操作，因此攻击必须分别独立地击败两者才能成功。</text><text x="446.00 453.69 456.68 462.29 468.86 475.44 481.40 484.29 491.98 498.30 506.98 513.42 518.14" y="176.33" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="526.94" y="176.33" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="72.00 83.00" y="191.95" font-size="11.00" class="sc-notoserifcjksc">不在</text><text x="94.00" y="191.95" font-size="11.00" class="sc-loraregular">“</text><text x="98.40 109.40 120.40 131.40 142.40 153.40 164.40" y="191.95" font-size="11.00" class="sc-notoserifcjksc">无安全防护措施</text><text x="175.40" y="191.95" font-size="11.00" class="sc-loraregular">”</text><text x="179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24 531.24" y="191.95" font-size="11.00" class="sc-notoserifcjksc">的状态下运行，所有实例即使未使用自动模式，也会使用提示词注入探针。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="207.57" font-size="11.00" class="sc-notoserifcjksc">我们在本评估中排除了这些探针，以便将原始模型行为与我们最安全的配置进行比较。此外，由</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="223.19" font-size="11.00" class="sc-notoserifcjksc">于无法关闭思考，对于该产品端，我们仅报告开启思考且推理强度为</text><text x="404.89 414.53 419.78 425.88 429.45 435.97" y="223.19" font-size="11.00" class="sc-loraitalic">medium</text><text x="448.50 459.50 470.50 481.50 492.50" y="223.19" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text><text x="72.00" y="590.14" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="590.14" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10 135.10 144.10 153.10 162.10 171.10 180.10 189.10 198.10" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员在通过</text><text x="209.47 215.66 218.47 223.18 228.74 234.11 238.95 241.32 247.51 252.54 259.75 264.84 269.08" y="590.14" font-size="9.00" class="sc-lorabold">Claude Cowork</text><text x="276.80 285.80 294.80 303.80 312.80 321.80 330.80 339.80 348.80 357.80 366.80 375.80 384.80 393.80 402.80 411.80 420.80 429.80 438.80 447.80 456.80 465.80 474.80 483.80 492.80 501.80 510.80" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">运行的浏览器使用环境中发起的提示词注入攻击的攻击成功率</text><text x="519.80 528.80" y="590.14" font-size="9.00" class="sc-notoserifcjksc">。越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="601.84" font-size="9.00" class="sc-notoserifcjksc">低越好。每列最佳分数以</text><text x="171.00 180.00" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00" y="601.84" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（未考虑误差范围）。攻击者对每个场景进行</text><text x="488.37 491.64" y="601.84" font-size="9.00" class="sc-loraregular">10</text><text x="499.60 508.60 517.60 526.60" y="601.84" font-size="9.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="613.54" font-size="9.00" class="sc-notoserifcjksc">尝试级攻击成功率是遭遇攻击的尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。所有</text><text x="72.00 81.00 90.00 99.00 108.00" y="625.24" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="119.37 127.41 132.25 137.63 140.16 145.53" y="625.24" font-size="9.00" class="sc-loraregular">medium</text><text x="155.94 164.94 173.94 182.94 191.94" y="625.24" font-size="9.00" class="sc-notoserifcjksc">推理强度。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="682.20" font-size="11.00" class="sc-notoserifcjksc">启用自动模式时，在全部</text><text x="195.89 199.90 205.80" y="682.20" font-size="11.00" class="sc-loraregular">129</text><text x="215.06 226.06 237.06 248.06 259.05 270.05 281.05 292.05 303.05 314.05 325.05 336.05" y="682.20" font-size="11.00" class="sc-notoserifcjksc">个场景中，没有任何攻击对</text><text x="349.95 357.64 360.63 366.24 372.81 379.38 385.35 388.24 396.97 403.54 410.11 415.20 418.09" y="682.20" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="426.98 437.98 448.98 459.98 470.98 481.98 492.98 503.98 514.98 525.98" y="682.20" font-size="11.00" class="sc-notoserifcjksc">成功。在无安全防护措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="697.82" font-size="11.00" class="sc-notoserifcjksc">施的情况下，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15" y="697.82" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="215.03 226.03" y="6 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p081.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 81 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">81</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="82.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95 130.95 141.95 152.95 163.95 174.95 185.95 196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95 449.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">仍是我们在这项无安全防护措施评估中表现最强的模型，攻击成功率为</text><text x="463.84 470.50 473.20 479.17 484.24" y="82.61" font-size="11.00" class="sc-loraregular">0.47%</text><text x="493.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="504.81 512.49 515.49 521.10 527.66 534.24" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40 121.40 132.40 143.40 154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40 286.40 297.40 308.40 319.40 330.40 341.40 352.40 363.40 374.40 385.40 396.40 407.40 418.40 429.40 440.40 451.40 462.40 473.40 484.40 495.40 506.40 517.40 528.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">是唯一在使用自动模式时仍出现成功攻击的模型。我们已人工核实，仅有的三次成功突破</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">都发生在低严重程度场景中，并正在着手缓解。</text><text x="303.00" y="110.18" font-size="6.60" class="sc-loraregular">5</text><text x="72.00" y="649.27" font-size="6.00" class="sc-loraregular" fill="#1f1f1f">5</text><text x="77.90 87.90 97.90 107.90 117.90 127.90 137.90 147.90" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">我们最初没有报告</text><text x="160.53 167.52 170.24 175.34 181.31 187.29 192.71 195.34 200.42 205.58 211.40 214.12 219.54 222.17" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">Claude Fable 5</text><text x="227.62 237.62 247.62 257.62 267.62 277.62 287.62 297.62" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">，因为它的表现与</text><text x="310.25 317.24 319.96 325.06 331.03 337.01 342.43 345.06 354.09 359.42 363.29 369.28 375.13 379.76 382.39" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">Claude Mythos 5</text><text x="390.47 400.47 410.47 420.47 430.47 440.47 450.47" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">非常相似。在为</text><text x="463.10" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">8</text><text x="471.35" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">月</text><text x="483.98 487.62" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">19</text><text x="496.03 506.03 516.03 526.03" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">日系统卡</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00" y="666.80" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">更新而使用更新后的运行框架重新运行该评估时，我们才首次发现</text><text x="364.63 371.62 374.34 379.44 385.41 391.39 396.81 399.44 404.52 409.68 415.50 418.22 423.64 426.27" y="666.80" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">Claude Fable 5</text><text x="434.35 444.35 454.35 464.35 474.35 484.35 494.35 504.35" y="666.80" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">的攻击成功率高于</text><text x="72.00 78.99 81.71 86.81 92.78 98.76 104.18 106.81 115.84 121.17 125.04 131.03 136.88 141.51 144.14" y="681.00" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">Claude Mythos 5</text><text x="152.22 162.22 172.22 182.22 192.22" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">以及回退（</text><text x="202.22 205.60 210.76 213.48 216.20 222.02 227.18 232.50" y="681.00" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">fallback</text><text x="237.87 247.87 257.87" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">）模型</text><text x="270.50 277.49 280.21 285.31 291.28 297.26 302.68 305.31 313.25 319.22 325.19 329.82 332.45 337.87 340.33" y="681.00" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">Claude Opus 4.8</text><text x="345.95 355.95 365.95 375.95 385.95 395.95 405.95 415.95 425.95 435.95 445.95 455.95 465.95 475.95 485.95 495.95 505.95 515.95 525.95" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">。我们现在纳入了这些结果，并正在调查其</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00" y="695.20" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">原因，因为我们在任何其他内部或外部评估中都未观察到这种差异。</text></svg></div>
