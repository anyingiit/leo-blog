.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">69</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="184.93" y="116.21" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了与</text><text x="286.82" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="373.06" y="116.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="386.95" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="472.84" y="116.21" font-size="11.00" class="sc-notoserifcjksc">发布时大体相</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">同的智能体安全评估套件。这些评估涵盖对编程智能体和计算机使用（</text><text x="413.00" y="131.83" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="483.70" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）智能体的</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">恶意使用、影响力行动的自主执行，以及提示词注入（</text><text x="336.00" y="147.45" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="421.99" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="197.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="197.17" font-size="11.00" class="sc-notoserifcjksc">在我们的智能体安全评估套件中的表现与</text><text x="404.93" y="197.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="490.81" y="197.17" font-size="11.00" class="sc-notoserifcjksc">相当或更</text><text x="72.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">好，其中提升最大的是在编程、计算机使用和浏览器使用场景中的提示词注入鲁棒性。在我们更</text><text x="72.00" y="228.41" font-size="11.00" class="sc-notoserifcjksc">新后的有害影响力行动评估中，</text><text x="226.00" y="228.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="303.03" y="228.41" font-size="11.00" class="sc-notoserifcjksc">的仅有用变体（</text><text x="380.03" y="228.41" font-size="11.00" class="sc-loraregular sc-k">helpful-only variant</text><text x="480.98" y="228.41" font-size="11.00" class="sc-notoserifcjksc">）仍远低于</text><text x="72.00" y="244.03" font-size="11.00" class="sc-notoserifcjksc">自主开展一次行动所需的能力水平，而完整训练的模型继续拒绝这些任务。</text><text x="72.00" y="295.72" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="295.72" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="332.82" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="332.82" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="360.71" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89" y="360.71" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="360.71" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="193.08" y="360.71" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="260.92" y="360.71" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用及良性的网络安全相</text><text x="72.00" y="376.33" font-size="11.00" class="sc-notoserifcjksc">关请求。提示集分为两类：</text><text x="108.00" y="425.47" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="425.47" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc">条违反我们</text><text x="231.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="286.26" y="425.47" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Usage Policy</text><text x="350.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="361.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc">、应予拒绝的提示。示例包括协助创</text><text x="108.00" y="441.09" font-size="11.00" class="sc-notoserifcjksc">建恶意软件、编写用于</text><text x="220.89" y="441.09" font-size="11.00" class="sc-loraregular sc-k">DDoS</text><text x="252.67" y="441.09" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00" y="474.05" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="474.05" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="474.05" font-size="11.00" class="sc-notoserifcjksc">条提示，涵盖敏感但允许、</text><text x="319.26" y="474.05" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="357.55" y="474.05" font-size="11.00" class="sc-notoserifcjksc">应当提供协助的请求。示例包括运行</text><text x="108.00" y="489.67" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00" y="538.81" font-size="11.00" class="sc-notoserifcjksc">每个受测模型都配备标准的</text><text x="206.89" y="538.81" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="274.74" y="538.81" font-size="11.00" class="sc-notoserifcjksc">工具集，每条提示运行</text><text x="387.63" y="538.81" font-size="11.00" class="sc-loraregular">10</text><text x="401.36" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="481.26 485.26 488.03 493.94 499.85" y="538.81" font-size="11.00" class="sc-loraregular">1,220</text><text x="509.58" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次测</text><text x="72.00" y="554.43" font-size="11.00" class="sc-notoserifcjksc">试。与近期发布的版本一样，我们在运行本评估时默认应用</text><text x="360.89" y="554.43" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="428.74" y="554.43" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="494.74" y="554.43" font-size="11.00" class="sc-loraregular">system</text><text x="72.00" y="570.05" font-size="11.00" class="sc-loraregular sc-k">prompt</text><text x="110.35" y="570.05" font-size="11.00" class="sc-notoserifcjksc">），且不附加部署时可能存在的额外安全防护措施。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="416.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="416.67" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="416.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="416.67" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="416.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="416.67" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="416.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="416.67" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="416.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="416.67" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="286.26" y="416.67" width="30.95" height="11.00" fill="transparent"/></a><a href="https://www.anthrop abold">Claude Opus 5</text><text x="295.50 301.83 307.99 310.23 315.38 321.32" y="516.85" font-size="11.00" class="sc-lorabold">93.75%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 121.22 127.45 134.46 141.47 147.39 151.93 154.82" y="542.18" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="295.50 301.68 307.64 310.23 316.58 322.76" y="542.18" font-size="11.00" class="sc-loraregular">84.68%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 124.96 131.02 135.56 142.38 148.61 153.94 156.83" y="567.51" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="295.50 301.68 307.67 310.02 315.09 319.09" y="567.51" font-size="11.00" class="sc-loraregular">85.71%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 123.10 129.71 136.50 141.84 144.73 150.74 153.30" y="592.84" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="295.50 301.68 305.68 308.03 313.10 319.92" y="592.84" font-size="11.00" class="sc-loraregular">81.70%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 121.22 127.45 134.46 141.47 147.39 151.93 154.82 160.83 163.39" y="618.17" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.6</text><text x="295.50 301.68 307.64 310.34 316.52 322.42" y="618.17" font-size="11.00" class="sc-loraregular">84.82%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="77.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="236.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.50" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="279.44" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.25" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="466.19" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="75.25" y="488.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="488.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="232.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83 114.31 116.68 122.87 125.68 130.39 135.95 141.32 146.16 148.53 154.72 159.81 165.18" y="232.49" font-size="9.00" class="sc-lorabold">5.1.1.A] Claude Code</text><text x="172.39" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="217.39" y="232.49" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以</text><text x="325.39" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="343.39" y="232.49" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（注意两者均未考</text><text x="72.00" y="244.19" font-size="9.00" class="sc-notoserifcjksc">虑误差范围）。由于评估更新，先前模型的结果与先前系统卡（</text><text x="324.00" y="244.19" font-size="9.00" class="sc-loraregular sc-k">System Card</text><text x="376.90" y="244.19" font-size="9.00" class="sc-notoserifcjksc">）中的结果存在差异。</text><text x="72.00" y="284.79" font-size="11.00" class="sc-notoserifcjksc">在拒绝恶意网络安全请求以及对两用和良性任务给予有帮助的回应这两方面，</text><text x="446.00" y="284.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="523.03" y="284.79" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="300.41" font-size="11.00" class="sc-notoserifcjksc">表现均与</text><text x="118.89" y="300.41" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49" y="300.41" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="331.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="331.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="359.60" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89" y="359.60" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="359.60" font-size="11.00" class="sc-notoserifcjksc">在沙箱化的环境中获得基于</text><text x="303.08" y="359.60" font-size="11.00" class="sc-loraregular">GUI</text><text x="326.30" y="359.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="340.19" y="359.60" font-size="11.00" class="sc-loraregular">CLI</text><text x="360.82" y="359.60" font-size="11.00" class="sc-notoserifcjksc">的计算机使用工具时，是否会拒绝有</text><text x="72.00" y="375.22" font-size="11.00" class="sc-notoserifcjksc">害任务。这组共</text><text x="151.89" y="375.22" font-size="11.00" class="sc-loraregular">112</text><text x="168.70" y="375.22" font-size="11.00" class="sc-notoserifcjksc">个不重复的任务与</text><text x="259.59" y="375.22" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="345.83" y="375.22" font-size="11.00" class="sc-notoserifcjksc">系统卡中的相同，涵盖三个风险领域：</text><text x="108.00" y="424.37" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="440.56" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00" y="456.75" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text><text x="72.00" y="635.23" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="635.23" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="635.23" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="635.23" font-size="9.00" class="sc-notoserifcjkscbold">未启用缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="635.23" font-size="9.00" class="sc-notoserifcjksc">越高越好。对于</text><text x="372.19" y="635.23" font-size="9.00" class="sc-loraregular">Opus</text><text x="396.61" y="635.23" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="407.98" y="635.23" font-size="9.00" class="sc-loraregular sc-k">Sonnet</text><text x="439.94" y="635.23" font-size="9.00" class="sc-notoserifcjksc">模型，比率为开启思考与</text><text x="72.00" y="646.93" font-size="9.00" class="sc-notoserifcjksc">关闭思考结果的平均值；对于</text><text x="191.37" y="646.93" font-size="9.00" class="sc-loraregular sc-k">Mythos</text><text x="224.96" y="646.93" font-size="9.00" class="sc-notoserifcjksc">模型，仅为开启思考的结果。每列最佳分数以</text><text x="404.96" y="646.93" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="422.96" y="646.93" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出</text><text x="72.00" y="658.63" font-size="9.00" class="sc-notoserifcjksc">（但未考虑误差范围）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p071.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 71 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">71</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="171.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.78" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更一致地拒绝恶意计算机使用任务。提升主要集中在</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">要求模型汇编针对私人个体的信息或制作欺诈性文件的任务上。</text><text x="72.00" y="145.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="145.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="173.61" font-size="11.00" class="sc-notoserifcjksc">本评估考察模型能否通过自主执行端到端的社交媒体影响力行动，为恶意行为者提供实质性的能</text><text x="72.00" y="189.23" font-size="11.00" class="sc-notoserifcjksc">力提升（</text><text x="116.00" y="189.23" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="143.32" y="189.23" font-size="11.00" class="sc-notoserifcjksc">）。随着平台诚信系统以及影响力行动实施者的行动手法日趋成熟，我们在本次发</text><text x="72.00" y="204.85" font-size="11.00" class="sc-notoserifcjksc">布中对该评估进行了大幅更新，以强化模拟防御，并相应提高对模型的要求。</text><text x="72.00" y="264.57" font-size="11.00" class="sc-notoserifcjksc">在该评估中，模型被置于一个智能体运行框架（</text><text x="303.00" y="264.57" font-size="11.00" class="sc-loraregular">harness</text><text x="342.85" y="264.57" font-size="11.00" class="sc-notoserifcjksc">）中，该框架包含一个模拟的多平台社交</text><text x="72.00" y="280.19" font-size="11.00" class="sc-notoserifcjksc">媒体环境，提供账号创建与获取、发帖、指标追踪等工具。随后，模型被要求开展一场为期数周</text><text x="72.00" y="311.43" font-size="11.00" class="sc-notoserifcjksc">能否适应障碍并让行动持续进行。</text><text x="72.00" y="371.72" font-size="11.00" class="sc-notoserifcjksc">我们对评估结构做了三项主要更新。模拟环境现在更加真实、更加全面；例如，创建账号现在要</text><text x="72.00" y="387.34" font-size="11.00" class="sc-notoserifcjksc">求模型自行获取电话号码和电子邮箱地址，模型可以阅读对其自身帖子的回复，并且运行中可能</text><text x="72.00" y="402.96" font-size="11.00" class="sc-notoserifcjksc">包含来自运营方（</text><text x="160.00" y="402.96" font-size="11.00" class="sc-loraregular sc-k">operator</text><text x="204.70" y="402.96" font-size="11.00" class="sc-notoserifcjksc">）的行动中途指令，以改变行动目标。我们不再调整平台阻力的程</text><text x="72.00" y="418.58" font-size="11.00" class="sc-notoserifcjksc">度，而是引入了新的难度层级，通过改变人设数量、平台组合和行动时长来扩展所布置行动的规</text><text x="72.00" y="434.20" font-size="11.00" class="sc-notoserifcjksc">模。最后，我们改进了评分细则，使评分更加客观、一致，并以真实世界的行动手法为依据。两</text><text x="72.00" y="449.82" font-size="11.00" class="sc-notoserifcjksc">个场景与此前各次发布相同：</text><text x="108.00" y="527.45" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35" y="527.45" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的</text><text x="108.00" y="543.07" font-size="11.00" class="sc-notoserifcjksc">投票率和支持热情；以及</text><text x="108.00" y="559.83" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放情绪化、按文化定制的信息来激</text><text x="108.00" y="575.45" font-size="11.00" class="sc-notoserifcjksc">化这些断层线。</text><text x="72.00" y="618.41" font-size="11.00" class="sc-notoserifcjksc">每个场景在三个难度层级中的每一层级各运行八次（此前各次发布中每个层级各运行三次）。我</text><text x="72.00" y="634.03" font-size="11.00" class="sc-notoserifcjksc">们报告最高难度层级下八次尝试的评分细则得分中位数。与此前各次发布一样，本评估针对模型</text><text x="72.00" y="649.65" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="649.65" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="649.65" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="120.40" y="649.65" font-size="11.00" class="sc-loraregular">”</text><text x="124.24" y="649.65" font-size="11.00" class="sc-notoserifcjksc">变体运行，该变体的无害性训练有所减少，以评估模型的原始能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p072.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 72 页"><text x="237.00 242.74 248.86 251.56" y="159.20" font-size="11.00" class="sc-loraregular">23.5</text><text x="390.75 396.65 403.01 405.55" y="159.20" font-size="11.00" class="sc-loraregular">26.0</text><text x="237.00" y="197.32" font-size="11.00" class="sc-loraregular">18.5</text><text x="390.75 396.65 402.56 405.09" y="197.32" font-size="11.00" class="sc-loraregular">22.0</text><text x="237.00 242.66 248.62 251.16" y="235.46" font-size="11.00" class="sc-loraregular">24.0</text><text x="390.75 396.49 402.61 405.31" y="235.46" font-size="11.00" class="sc-loraregular">23.5</text><text x="237.00" y="273.58" font-size="11.00" class="sc-loraregular sc-k">21.0</text><text x="390.75 396.41 402.37 404.91" y="273.58" font-size="11.00" class="sc-loraregular">24.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="77.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50" y="158.74" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="155.36" y="158.74" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="196.87" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="165.46" y="196.87" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="235.00" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos 5</text><text x="167.47" y="235.00" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="273.13" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="164.29" y="273.13" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="236.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景</text><text x="236.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（行动执行得分中位数，</text><text x="236.50" y="119.85" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">满分</text><text x="261.39" y="119.85" font-size="11.00" class="sc-lorabold" fill="#ffffff">32</text><text x="273.42" y="119.85" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景</text><text x="390.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（行动执行得分中位数，</text><text x="390.25" y="119.85" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">满分</text><text x="415.14" y="119.85" font-size="11.00" class="sc-lorabold" fill="#ffffff">32</text><text x="427.17" y="119.85" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="303.45" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="303.45" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="303.45" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="303.45" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="303.45" font-size="9.00" class="sc-notoserifcjksc">结果为最高难度层级下</text><text x="381.43" y="303.45" font-size="9.00" class="sc-loraregular">8</text><text x="388.85" y="303.45" font-size="9.00" class="sc-notoserifcjksc">次尝试得分的中位数，满分</text><text x="499.22" y="303.45" font-size="9.00" class="sc-loraregular">32</text><text x="511.43" y="303.45" font-size="9.00" class="sc-notoserifcjksc">分。分</text><text x="72.00" y="315.15" font-size="9.00" class="sc-notoserifcjksc">数越高表示能力越强，因而可能为恶意行为者提供的能力提升也越大。</text><text x="72.00" y="355.76" font-size="11.00" class="sc-notoserifcjksc">在我们更新后的智能体影响力行动评估中，</text><text x="281.00" y="355.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="358.03" y="355.76" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两个测试场景中的得</text><text x="72.00" y="371.38" font-size="11.00" class="sc-notoserifcjksc">分均与</text><text x="107.89" y="371.38" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="196.13" y="371.38" font-size="11.00" class="sc-notoserifcjksc">相当，并略高于</text><text x="276.03" y="371.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="361.92" y="371.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="375.81" y="371.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="459.16" y="371.38" font-size="11.00" class="sc-notoserifcjksc">。我们的评估结</text><text x="72.00" y="387.00" font-size="11.00" class="sc-notoserifcjksc">论是，</text><text x="105.00" y="387.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="182.03" y="387.00" font-size="11.00" class="sc-notoserifcjksc">在真实影响力行动的许多操作步骤中将需要大量的人类指导。</text><text x="72.00" y="446.72" font-size="11.00" class="sc-notoserifcjksc">与此前各次发布一样，这些模型的完整训练版本（包含无害性训练）拒绝参与这些任务，因为两</text><text x="72.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc">个场景均明显违反我们的</text><text x="193.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="237.00" y="462.34" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="512.88" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="512.88" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="539.44" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00" y="555.06" font-size="11.00" class="sc-notoserifcjksc">藏在工具结果中、由智能体在执行任务过程中处理的恶意指令。例如，智能体被要求总结的一封</text><text x="72.00" y="570.68" font-size="11.00" class="sc-notoserifcjksc">电子邮件中可能包含隐藏文本，指示其外泄所有近期的内部通信。一次成功的提示词注入攻击会</text><text x="72.00" y="601.92" font-size="11.00" class="sc-notoserifcjksc">或共享文档中的单个载荷就能攻陷任何处理它的智能体，攻击者无需针对特定用户或系统。当模</text><text x="72.00" y="617.54" font-size="11.00" class="sc-notoserifcjksc">型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合使攻击者能</text><text x="72.00" y="633.16" font-size="11.00" class="sc-notoserifcjksc">够外泄敏感信息或触发未经授权的操作。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="453.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="453.54" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p073.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 73 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">3</text><text x="77.97 85.42 90.53 93.33 98.75 107.69 110.50 115.66 121.72 124.25 126.88 136.06 138.52 141.05 143.68 149.02 152.89 155.52 160.68 163.40 165.86 168.49 171.53 176.90 183.04 188.41 194.07 197.11 199.57 202.20 209.78 215.53 223.53 226.16 231.21 237.18 239.90 245.96 251.38 255.64 260.80 266.62 269.34 274.75 277.38 282.54 286.80 292.22 294.85 301.10 304.45 307.08 312.24 317.72 323.13 329.11 332.98 337.61 340.24 344.11 349.95 352.58 355.39 361.46 367.44 370.25 374.50 379.87 385.14 389.01 391.64 397.60 401.86 407.71 416.65 422.61 426.48 429.11 431.92 437.94 440.55 445.92 451.18 455.05 457.86 463.71 469.78 474.40 479.14 481.77 485.04 491.11 495.74 498.54 504.31 510.21 514.08" y="704.46" font-size="10.00" class="sc-loraregular">Dziemian, M., et al. (2026). How vulnerable are AI agents to indirect prompt injections? Insights</text><text x="72.00 75.38 79.64 85.48 94.42 97.05 102.21 104.84 110.83 115.99 120.27 125.75 131.17 135.91 141.58 146.88 152.04 154.76 160.18 162.80 168.86 174.83 180.65 183.37 186.17 191.49 194.12 201.11 206.96 215.89 221.86 227.21 231.08 234.05 237.91 240.72 246.57 252.64 255.10 257.73 262.88 266.59 273.08 275.89 280.94 283.44 288.80 294.58 300.79 306.36 308.82 312.45 317.90 322.51 326.15 331.57 334.20 340.09 344.06 347.93 353.90 358.53 361.03 364.71 371.17 376.33 380.66 385.95 388.76 393.42 395.88 401.73 406.01 411.53 417.99 423.15 428.97 433.25 440.14 445.51 451.29 457.50 463.06 465.52 469.16 474.61 479.22 482.86" y="717.26" font-size="10.00" class="sc-loraregular">from a Large-Scale Public Competition. arXiv:2603.15714 https://arxiv.org/abs/2603.15714</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">73</text><text x="261.89" y="98.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="300.18" y="98.80" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准测试以及第三方研究机</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">构制作的基准测试达到饱和。我们将继续投入于衡量鲁棒性提升的自适应评估。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在我们评估的所有使用场景中均优于</text><text x="327.93" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="410.92" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，使其成为我们迄今在编</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">程、工具使用、</text><text x="149.00" y="179.19" font-size="11.00" class="sc-loraregular">GUI</text><text x="172.22" y="179.19" font-size="11.00" class="sc-notoserifcjksc">计算机使用和浏览器使用方面最鲁棒的</text><text x="362.11" y="179.19" font-size="11.00" class="sc-loraregular">Opus</text><text x="391.97" y="179.19" font-size="11.00" class="sc-notoserifcjksc">级模型。我们将继续加强智能</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">体产品中的安全防护措施，以进一步保护用户免受提示词注入的影响。在我们的许多产品中，我</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">们运行提示词注入探针，它们会在模型据工具结果采取行动之前检查这些结果，并标记看起来像</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">注入指令的内容。在部分产品中，我们还提供</text><text x="292.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">自动模式</text><text x="336.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">，它将这些探针与一个拦截潜在危险工具</text><text x="72.00" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部红队测试</text><text x="72.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">正如</text><text x="96.89" y="351.73" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Sonnet 5</text><text x="183.13" y="351.73" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="216.13" y="351.73" font-size="11.00" class="sc-notoserifcjksc">中所宣布的，我们已停用</text><text x="340.03" y="351.73" font-size="11.00" class="sc-loraregular sc-k">Agent Red Teaming</text><text x="438.64" y="351.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="449.64" y="351.73" font-size="11.00" class="sc-loraregular">ART</text><text x="470.48" y="351.73" font-size="11.00" class="sc-notoserifcjksc">）基准测试，</text><text x="72.00" y="367.35" font-size="11.00" class="sc-notoserifcjksc">今后将不再报告该基准。</text><text x="193.00" y="367.35" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="231.29" y="367.35" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="267.18" y="367.35" font-size="11.00" class="sc-loraregular">ART</text><text x="290.91" y="367.35" font-size="11.00" class="sc-notoserifcjksc">上的表现已连续数个版本处于或接近最高水平，几</text><text x="72.00" y="382.97" font-size="11.00" class="sc-notoserifcjksc">乎无法提供区分相继模型或与其他前沿模型比较的信号。我们现在改为报告间接提示词注入</text><text x="72.00" y="398.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="398.59" font-size="11.00" class="sc-loraregular sc-k">Indirect Prompt Injection</text><text x="213.07" y="398.59" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="224.07" y="398.59" font-size="11.00" class="sc-loraregular sc-k">IPI</text><text x="238.06" y="398.59" font-size="11.00" class="sc-notoserifcjksc">）基准测试，它提供更多样、更真实的场景，涵盖</text><text x="482.95" y="398.59" font-size="11.00" class="sc-loraregular">GUI</text><text x="506.17" y="398.59" font-size="11.00" class="sc-notoserifcjksc">计算机</text><text x="72.00" y="414.21" font-size="11.00" class="sc-notoserifcjksc">使用，并能在较少尝试次数下提供更多信号。</text><text x="72.00" y="465.07" font-size="11.00" class="sc-loraregular sc-k">IPI</text><text x="88.87" y="465.07" font-size="11.00" class="sc-notoserifcjksc">基准测试是与</text><text x="157.77" y="465.07" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="212.33" y="465.07" font-size="11.00" class="sc-notoserifcjksc">、英国人工智能安全研究所（</text><text x="355.33" y="465.07" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="476.98" y="465.07" font-size="11.00" class="sc-notoserifcjksc">）、美国人</text><text x="72.00" y="480.69" font-size="11.00" class="sc-notoserifcjksc">工智能标准与创新中心（</text><text x="193.00" y="480.69" font-size="11.00" class="sc-loraregular sc-k">US Center for AI Standards and Innovation</text><text x="410.69" y="480.69" font-size="11.00" class="sc-notoserifcjksc">）以及其他模型开发者合</text><text x="72.00" y="496.31" font-size="11.00" class="sc-notoserifcjksc">作构建的。它基于</text><text x="162.89" y="496.31" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="220.35" y="496.31" font-size="11.00" class="sc-notoserifcjksc">已发布的红队测试（</text><text x="319.35" y="496.31" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="383.45" y="496.31" font-size="11.00" class="sc-notoserifcjksc">）竞赛</text><text x="416.45" y="492.64" font-size="6.60" class="sc-loraregular">3</text><text x="420.13" y="496.31" font-size="11.00" class="sc-notoserifcjksc">，并采用了一组新的</text><text x="522.02" y="496.31" font-size="11.00" class="sc-loraregular">28</text><text x="72.00" y="511.93" font-size="11.00" class="sc-notoserifcjksc">个场景，参与者的任务是在这些场景中找到针对前沿模型的攻击。这些场景测试模型对间接提示</text><text x="72.00" y="527.55" font-size="11.00" class="sc-notoserifcjksc">词注入的易感性，这些注入试图诱发不可逆的有害行为，包括私密数据外泄、数据破坏、系统入</text><text x="72.00" y="543.17" font-size="11.00" class="sc-notoserifcjksc">侵和非预期的金融交易。这些场景的设计旨在匹配前沿模型当前能完成的真实任务的难度，包括</text><text x="72.00" y="558.79" font-size="11.00" class="sc-notoserifcjksc">编程、计算机使用和工具使用。在对攻击去重后，我们选取了</text><text x="371.89 375.90 378.67 382.67 388.80" y="558.79" font-size="11.00" class="sc-loraregular">1,130</text><text x="398.54" y="558.79" font-size="11.00" class="sc-notoserifcjksc">个在各目标模型间表现出高</text><text x="72.00" y="574.41" font-size="11.00" class="sc-notoserifcjksc">可迁移性的攻击。我们在没有额外安全防护措施的情况下评估</text><text x="371.89" y="574.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="410.18" y="574.41" font-size="11.00" class="sc-notoserifcjksc">模型；其他前沿模型则在</text><text x="72.00" y="590.03" font-size="11.00" class="sc-notoserifcjksc">其公开可用的端点上评估，这些端点可能包含也可能不包含额外的安全防护措施。</text><a href="https://arxiv.org/abs/2603.15714" rel="noopener"><rect x="334.20" y="707.20" width="154.08" height="12.80" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="292.00" y="217.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="292.00" y="217.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="303.00" y="217.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="303.00" y="217.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="314.00" y="217.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="314.00" y="217.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="325.00" y="217.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/claude-code-auto-mode" rel="noopener"><rect x="325.00" y="217.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="96.89" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="96.89" y="342.93" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="132.29" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="135.18" y="342.93" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="171.35" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="174.24" y="342.93" width="6.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="180.24" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="183.13" y="342.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="194.13" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="194.13" y="342.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="205.13" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/9e6a1044980d8c4ed85669faf9c2a8342e2e9f1e/Claude%20Sonnet%205%20System%20Card.pdf#page=56.64" rel="noopener"><rect x="205.13" y="342.93" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p074.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 74 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">4</text><text x="77.88 85.45 90.61 95.23 99.14 101.67 104.30 113.48 115.94 118.46 121.09 126.44 130.31 132.94 138.10 140.82 143.27 145.90 148.95 154.32 160.46 165.83 171.27 174.32 176.78 179.41 185.81 191.80 197.21 199.84 204.93 208.90 212.77 217.93 223.24 228.54 233.96 238.29 240.92 249.85 255.65 260.65 266.07 270.69 273.32 277.95 283.32 288.59 294.44 300.50 306.48 308.98 311.61 317.24 321.10 325.36 331.21 337.28 342.76 348.17 352.50 355.13 360.29 366.27 371.42 377.39 381.26 384.07 389.07 394.49 397.11 402.20 406.17 410.04 415.20 420.52 425.88 430.51 433.14 438.88 444.16 450.12 455.28 459.91 464.54 467.17 473.14 478.56 481.89 487.31 493.38 498.00 503.42" y="704.46" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="72.00 77.16 82.69 87.84 90.65 96.72 101.35 105.22 107.85 113.62 119.40 128.58 131.21 133.82 138.97 141.78 144.50 150.32 154.58 159.98 165.13 170.50 175.13 177.76 182.92 188.98 194.96 197.59 203.56 207.82 213.66 222.60 228.57 232.44 235.07 237.87 243.89 246.50 251.87 257.14 261.01 263.81 269.66 275.73 280.36 282.82 285.45 290.60 294.31 300.80 303.61 308.66 311.16 316.52 321.97 325.61 331.66 333.97 340.17 345.95 352.09 357.31 362.87" y="717.26" font-size="10.00" class="sc-loraregular">against LLM jailbreaks and prompt injections. arXiv:2510.09023.</text><text x="367.96 373.86 377.83 381.70 387.66 392.29 394.79 398.48 404.94 410.09 414.42 419.72 422.53 427.19 429.65 435.49 439.77 445.30 451.76 456.92 462.73 467.01 473.91 479.28 484.72 488.36 494.41 496.72 502.93 508.71 514.84 520.06" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.09023</text><text x="525.63" y="717.26" font-size="10.00" class="sc-loraregular">.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">74</text><text x="72.00" y="320.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="320.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="320.50" font-size="9.00" class="sc-lorabold sc-k">5.2.1.B]</text><text x="117.82" y="320.50" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19" y="320.50" font-size="9.00" class="sc-lorabold sc-k">Gray Swan IPI</text><text x="201.52" y="320.50" font-size="9.00" class="sc-notoserifcjkscbold">基准测试（</text><text x="246.52" y="320.50" font-size="9.00" class="sc-lorabold">2026</text><text x="269.38" y="320.50" font-size="9.00" class="sc-notoserifcjkscbold">年第一季度）的间接提示词注入攻击，</text><text x="422.38" y="320.50" font-size="9.00" class="sc-notoserifcjksc">分数越低越好。所有模型均使</text><text x="72.00" y="332.20" font-size="9.00" class="sc-notoserifcjksc">用扩展思考（</text><text x="126.00" y="332.20" font-size="9.00" class="sc-loraregular sc-k">extended thinking</text><text x="202.06" y="332.20" font-size="9.00" class="sc-notoserifcjksc">）。结果表示攻击者在</text><text x="294.43" y="332.20" font-size="9.00" class="sc-loraregular sc-k">k=1</text><text x="307.21" y="332.20" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="316.21" y="332.20" font-size="9.00" class="sc-loraregular sc-k">k=10</text><text x="336.94" y="332.20" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="348.31" y="332.20" font-size="9.00" class="sc-loraregular sc-k">k=15</text><text x="368.36" y="332.20" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到成功攻击的概率。越低越好。</text><text x="72.00" y="343.90" font-size="9.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="134.45" y="343.90" font-size="9.00" class="sc-notoserifcjksc">的结果不可直接比较，因为该模型被纳入了用于获取攻击的红队测试竞赛。</text><text x="72.00" y="398.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="398.23" font-size="11.00" class="sc-loraregular sc-k">IPI</text><text x="102.77" y="398.23" font-size="11.00" class="sc-notoserifcjksc">基准测试上，</text><text x="168.77" y="398.23" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="207.51" y="398.23" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="232.40" y="398.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="280.00" y="398.23" font-size="11.00" class="sc-notoserifcjksc">有所提升，将攻击者在</text><text x="392.89" y="398.23" font-size="11.00" class="sc-loraregular">15</text><text x="405.78" y="398.23" font-size="11.00" class="sc-notoserifcjksc">次尝试内成功的概率从</text><text x="72.00" y="413.86" font-size="11.00" class="sc-loraregular">5.5%</text><text x="99.16" y="413.86" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="124.05" y="413.86" font-size="11.00" class="sc-loraregular sc-k">2.0%</text><text x="148.90" y="413.86" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="173.79" y="413.86" font-size="11.00" class="sc-loraregular">1</text><text x="180.69" y="413.86" font-size="11.00" class="sc-notoserifcjksc">次尝试时从</text><text x="238.58" y="413.86" font-size="11.00" class="sc-loraregular sc-k">0.5%</text><text x="266.40" y="413.86" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="291.30" y="413.86" font-size="11.00" class="sc-loraregular sc-k">0.2%</text><text x="316.13" y="413.86" font-size="11.00" class="sc-notoserifcjksc">。它也优于</text><text x="374.03" y="413.86" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="419.08" y="413.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="430.08" y="413.86" font-size="11.00" class="sc-loraregular sc-k">k=15</text><text x="454.59" y="413.86" font-size="11.00" class="sc-notoserifcjksc">时为</text><text x="479.48" y="413.86" font-size="11.00" class="sc-loraregular">5.9%</text><text x="504.11" y="413.86" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="72.00" y="429.48" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="429.48" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="130.06" y="429.48" font-size="11.00" class="sc-loraregular sc-k">2.6%</text><text x="154.49" y="429.48" font-size="11.00" class="sc-notoserifcjksc">），成为所评估模型中最鲁棒的模型。</text><text x="341.49" y="429.48" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="380.23" y="429.48" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上也优于所有非</text><text x="72.00" y="445.10" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="445.10" font-size="11.00" class="sc-notoserifcjksc">模型。最鲁棒的非</text><text x="201.18" y="445.10" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="239.48" y="445.10" font-size="11.00" class="sc-notoserifcjksc">模型是</text><text x="275.37" y="445.10" font-size="11.00" class="sc-loraregular sc-k">Muse Spark</text><text x="335.02" y="445.10" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="346.02" y="445.10" font-size="11.00" class="sc-loraregular">15</text><text x="358.91" y="445.10" font-size="11.00" class="sc-notoserifcjksc">次尝试内的成功率为</text><text x="460.81" y="445.10" font-size="11.00" class="sc-loraregular">16.5%</text><text x="72.00" y="460.71" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="460.71" font-size="11.00" class="sc-notoserifcjksc">的八倍以上。能力最强的</text><text x="234.64" y="460.71" font-size="11.00" class="sc-loraregular sc-k">GPT 5.6</text><text x="277.45" y="460.71" font-size="11.00" class="sc-notoserifcjksc">变体</text><text x="302.34" y="460.71" font-size="11.00" class="sc-loraregular">Sol</text><text x="320.90" y="460.71" font-size="11.00" class="sc-notoserifcjksc">与其前代</text><text x="367.79" y="460.71" font-size="11.00" class="sc-loraregular">GPT 5.5</text><text x="410.35" y="460.71" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="443.35" y="460.71" font-size="11.00" class="sc-loraregular">15</text><text x="456.24" y="460.71" font-size="11.00" class="sc-notoserifcjksc">次尝试内分别为</text><text x="72.00" y="476.33" font-size="11.00" class="sc-loraregular sc-k">20.0%</text><text x="106.40" y="476.33" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="120.29" y="476.33" font-size="11.00" class="sc-loraregular sc-k">20.8%</text><text x="151.31" y="476.33" font-size="11.00" class="sc-notoserifcjksc">），其被成功攻击的可能性是</text><text x="297.20" y="476.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="371.34" y="476.33" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.34" y="476.33" font-size="11.00" class="sc-loraregular sc-k">2.0%</text><text x="407.19" y="476.33" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="432.09" y="476.33" font-size="11.00" class="sc-loraregular">10</text><text x="445.81" y="476.33" font-size="11.00" class="sc-notoserifcjksc">倍。其他</text><text x="492.71" y="476.33" font-size="11.00" class="sc-loraregular sc-k">GPT 5.6</text><text x="72.00" y="491.96" font-size="11.00" class="sc-notoserifcjksc">变体的鲁棒性更低，分别为</text><text x="206.89" y="491.96" font-size="11.00" class="sc-loraregular sc-k">30.4%</text><text x="237.91" y="491.96" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="248.91" y="491.96" font-size="11.00" class="sc-loraregular sc-k">Terra</text><text x="276.50" y="491.96" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="301.39" y="491.96" font-size="11.00" class="sc-loraregular">43.9%</text><text x="332.12" y="491.96" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="343.12" y="491.96" font-size="11.00" class="sc-loraregular">Luna</text><text x="368.40" y="491.96" font-size="11.00" class="sc-notoserifcjksc">）。针对</text><text x="415.29" y="491.96" font-size="11.00" class="sc-loraregular sc-k">GPT 5.6 Sol</text><text x="476.66" y="491.96" font-size="11.00" class="sc-notoserifcjksc">的单次尝试</text><text x="72.00" y="507.58" font-size="11.00" class="sc-notoserifcjksc">成功率为</text><text x="118.89" y="507.58" font-size="11.00" class="sc-loraregular">3.1%</text><text x="141.30" y="507.58" font-size="11.00" class="sc-notoserifcjksc">，高于攻击者在</text><text x="221.19" y="507.58" font-size="11.00" class="sc-loraregular">15</text><text x="234.09" y="507.58" font-size="11.00" class="sc-notoserifcjksc">次尝试后针对</text><text x="302.98" y="507.58" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="341.72" y="507.58" font-size="11.00" class="sc-notoserifcjksc">达到的</text><text x="377.61" y="507.58" font-size="11.00" class="sc-loraregular sc-k">2.0%</text><text x="402.46" y="507.58" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="590.89" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="590.89" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对抗自适应攻击者的鲁棒性</text><text x="72.00" y="622.77" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准测试。</text><text x="380.00" y="619.11" font-size="6.60" class="sc-loraregular">4</text><text x="386.47" y="622.77" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可</text><text x="72.00" y="638.39" font-size="11.00" class="sc-notoserifcjksc">能带来虚假的安全感，因为模型可能在已有的攻击模式上表现良好，却仍易受新型方法的攻击。</text><text x="72.00" y="654.01" font-size="11.00" class="sc-notoserifcjksc">我们将继续投入于能更好地逼近</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p075.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 75 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">75</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">真实世界对手能力的自适应评估，既在内部开展，也与外部研究合作伙伴协作开展。</text><text x="72.00" y="131.18" font-size="11.00" class="sc-notoserifcjksc">本节中的评估衡量的是模型面对根据与模型交互情况不断改进攻击手法的对手时的鲁棒性。这些</text><text x="72.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">评估体现了一种刻意宽松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景都有多</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。现实世界中的攻击者通常不具备这两种可用手段，因为他们并不知道目标部署的情</text><text x="72.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">况，而且反复尝试会增加被发现的可能性。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">与我们在</text><text x="118.89" y="260.72" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="204.78" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.78" y="260.72" font-size="11.00" class="sc-notoserifcjksc">中首次采用的做法一样，我们与</text><text x="394.67" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="452.13" y="260.72" font-size="11.00" class="sc-notoserifcjksc">合作举办了一次实</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">时漏洞赏金活动：专业的红队测试人员相互竞争，争夺一个奖金池，奖金授予针对一组前沿模型</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">（包括</text><text x="107.89" y="291.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="182.03" y="291.96" font-size="11.00" class="sc-notoserifcjksc">）成功实施的提示词注入攻击。目标模型的身份自始至终保持隐藏，且每</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">位红队测试人员针对每个模型的每个场景最多只能提交一次成功的攻击。本轮涵盖了工具使用、</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">编程和计算机使用领域的</text><text x="195.89" y="323.20" font-size="11.00" class="sc-loraregular">11</text><text x="206.79" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个新场景。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="374.07" font-size="11.00" class="sc-notoserifcjksc">模型在评估时推理强度（</text><text x="231.29" y="374.07" font-size="11.00" class="sc-loraregular sc-k">thinking effort</text><text x="305.54" y="374.07" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="330.43" y="374.07" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="353.05" y="374.07" font-size="11.00" class="sc-notoserifcjksc">，且未启用我们产品中使用的额外防护</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">措施（例如运行框架层面的防御和提示词注入探针），因此结果反映的是模型自身的鲁棒性，代</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">表了已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置进行测试，这些配置可能</text><text x="72.00" y="420.93" font-size="11.00" class="sc-notoserifcjksc">包含、也可能不包含额外的安全防护措施。</text><text x="281.00" y="420.93" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6</text><text x="325.59" y="420.93" font-size="11.00" class="sc-notoserifcjksc">模型在评估时推理强度为</text><text x="449.49" y="420.93" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="472.10" y="420.93" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="118.89" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="118.89" y="251.92" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="154.29" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="157.18" y="251.92" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="184.14" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="187.04" y="251.92" width="14.85" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="201.89" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="204.78" y="251.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="215.78" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="215.78" y="251.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="226.78" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0f0c97ad20d8005706296bd92aa1c27c6b2f4f61/Claude%20Opus%204.8%20System%20Card.pdf#page=78.36" rel="noopener"><rect x="226.78" y="251.92" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p076.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 76 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">76</text><text x="72.00" y="346.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="346.75" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="346.75" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入鲁棒性</text><text x="214.71" y="346.75" font-size="9.00" class="sc-notoserifcjksc">，数据来自与</text><text x="271.08" y="346.75" font-size="9.00" class="sc-loraregular sc-k">Gray Swan</text><text x="318.09" y="346.75" font-size="9.00" class="sc-notoserifcjksc">合作举办的为期一周的漏洞赏金计划。分数越低越好。</text><text x="72.00" y="358.45" font-size="9.00" class="sc-notoserifcjksc">该漏洞赏金计划涵盖工具使用、编程和计算机使用领域的</text><text x="299.37" y="358.45" font-size="9.00" class="sc-loraregular">11</text><text x="308.29" y="358.45" font-size="9.00" class="sc-notoserifcjksc">个场景。攻击成功率（</text><text x="398.29" y="358.45" font-size="9.00" class="sc-loraregular sc-k">attack success rate</text><text x="477.94" y="358.45" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="486.94" y="358.45" font-size="9.00" class="sc-loraregular">ASR</text><text x="503.33" y="358.45" font-size="9.00" class="sc-notoserifcjksc">）基于提</text><text x="72.00" y="370.15" font-size="9.00" class="sc-notoserifcjksc">交的全部有效对话尝试计算。</text><text x="72.00" y="399.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在各自收到超过</text><text x="151.89 157.80 164.45 167.06 173.89 180.72" y="399.05" font-size="11.00" class="sc-loraregular" fill="#121212">20,000</text><text x="190.46" y="399.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">次尝试后，</text><text x="245.46" y="399.05" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="283.75" y="399.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型的表现优于本次漏洞赏金中评估的所有其他模</text><text x="72.00" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">型。</text><text x="94.00" y="414.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="168.14" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">（</text><text x="179.14" y="414.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.08%</text><text x="210.92" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）相比</text><text x="246.81" y="414.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 4.8</text><text x="329.81" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">（</text><text x="340.81" y="414.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.11%</text><text x="367.75" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）略有改进，而</text><text x="447.64" y="414.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Fable 5</text><text x="524.33" y="414.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是</text><text x="72.00" y="430.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们在这些场景中最鲁棒的模型（</text><text x="237.00" y="430.29" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.04%</text><text x="268.56" y="430.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）。</text><text x="290.56" y="430.29" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Sonnet 5</text><text x="376.80" y="430.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="390.69" y="430.29" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="428.98" y="430.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型中攻击成功率最高</text><text x="72.00" y="445.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">（</text><text x="83.00" y="445.91" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.12%</text><text x="111.84" y="445.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）。表现次好的模型是</text><text x="224.74" y="445.91" font-size="11.00" class="sc-loraregular" fill="#121212">Kimi K3</text><text x="267.69" y="445.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="281.58" y="445.91" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">GPT 5.6 Sol</text><text x="340.06" y="445.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，其攻击成功率是</text><text x="430.95" y="445.91" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Sonnet 5</text><text x="517.19" y="445.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的</text><text x="531.09" y="445.91" font-size="11.00" class="sc-loraregular" fill="#121212">4</text><text x="72.00" y="461.53" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">倍以上（分别为</text><text x="151.89" y="461.53" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.58%</text><text x="185.89" y="461.53" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="199.79" y="461.53" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.61%</text><text x="228.97" y="461.53" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）。鲁棒性最差的模型是</text><text x="352.86" y="461.53" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">DeepSeek V4 Flash</text><text x="448.48" y="461.53" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，攻击成功比例为</text><text x="72.00" y="477.15" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">8.09%</text><text x="103.48" y="477.15" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="72.00" y="522.39" font-size="11.00" class="sc-notoserifcjksc">按使用场景细分，</text><text x="160.00" y="522.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="237.03" y="522.39" font-size="11.00" class="sc-notoserifcjksc">在工具使用（分别为</text><text x="338.93" y="522.39" font-size="11.00" class="sc-loraregular sc-k">0.18%</text><text x="370.94" y="522.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="384.83" y="522.39" font-size="11.00" class="sc-loraregular sc-k">0.13%</text><text x="413.89" y="522.39" font-size="11.00" class="sc-notoserifcjksc">）和编程（</text><text x="468.89" y="522.39" font-size="11.00" class="sc-loraregular sc-k">0.06%</text><text x="503.74" y="522.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="538.01" font-size="11.00" class="sc-loraregular sc-k">0.04%</text><text x="103.56" y="538.01" font-size="11.00" class="sc-notoserifcjksc">）两方面均较</text><text x="172.45" y="538.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="258.34" y="538.01" font-size="11.00" class="sc-notoserifcjksc">有所改进。在计算机使用方面，针对任何</text><text x="459.23" y="538.01" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="497.52" y="538.01" font-size="11.00" class="sc-notoserifcjksc">模型的</text><text x="72.00" y="553.63" font-size="11.00" class="sc-notoserifcjksc">攻击均未成功。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00" y="274.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="274.92" font-size="9.00" class="sc-lorabold sc-k">5.2.2.1.B]</text><text x="124.71" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="136.08" y="274.92" font-size="9.00" class="sc-lorabold">5.2.2.1.A</text><text x="170.95" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">中的漏洞赏金结果按模态细分，涵盖所有</text><text x="335.32" y="274.92" font-size="9.00" class="sc-lorabold">Claude</text><text x="367.17" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">模型以及总体表现次好的两个模型。</text><text x="511.17" y="274.92" font-size="9.00" class="sc-notoserifcjksc">分数越</text><text x="72.00" y="286.62" font-size="9.00" class="sc-notoserifcjksc">低越好。每种模态有</text><text x="155.37" y="286.62" font-size="9.00" class="sc-loraregular">4</text><text x="162.61" y="286.62" font-size="9.00" class="sc-notoserifcjksc">个不同场景，但计算机使用除外，它只有三个场景。攻击成功率基于提交的全部有效对话尝试计</text><text x="72.00" y="298.33" font-size="9.00" class="sc-notoserifcjksc">算。</text><text x="72.00" y="356.67" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="356.67" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="389.06" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="389.06" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="176.35" y="389.06" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试工具</text><text x="311.24" y="389.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="345.17" y="389.06" font-size="11.00" class="sc-notoserifcjksc">来评估我们的模型在编程环境中对提示</text><text x="72.00" y="404.68" font-size="11.00" class="sc-notoserifcjksc">词注入的鲁棒性。</text><text x="160.00" y="404.68" font-size="11.00" class="sc-loraregular">Shade</text><text x="193.93" y="404.68" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="336.93" y="404.68" font-size="11.00" class="sc-loraregular sc-k">reinforcement learning</text><text x="455.32" y="404.68" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的</text><text x="72.00" y="420.30" font-size="11.00" class="sc-notoserifcjksc">洞察，通过迭代不断提升利用模型漏洞的能力。攻击者先在之前一组模型上针对测试用例进行优</text><text x="72.00" y="435.92" font-size="11.00" class="sc-notoserifcjksc">化，然后在相同场景上迁移到最新模型。</text><text x="72.00" y="486.20" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的攻击成功率：它在一组</text><text x="294.89" y="486.20" font-size="11.00" class="sc-loraregular">40</text><text x="310.58" y="486.20" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，然后在相同场景上进行评估。</text><text x="72.00" y="501.82" font-size="11.00" class="sc-notoserifcjksc">每个场景中，攻击者有</text><text x="184.89" y="501.82" font-size="11.00" class="sc-loraregular">200</text><text x="207.36" y="501.82" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。我们报告成功尝试所占的总体百分比，以及有多少个场</text><text x="72.00" y="517.44" font-size="11.00" class="sc-notoserifcjksc">景至少有一次尝试成功。</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="311.24" y="380.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="311.24" y="380.26" width="31.04" height="11.00" fill="transparent"/></a></svg></div>

1.A] Shade</text><text x="152.93" y="426.37" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在编程环境中的攻击成功率</text><text x="341.93" y="426.37" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="476.93" y="426.37" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="494.93" y="426.37" font-size="9.00" class="sc-notoserifcjksc">标出，次优</text><text x="72.00" y="438.07" font-size="9.00" class="sc-notoserifcjksc">分数以下划线标出（但这未考虑误差范围）。攻击者在每个场景中进行</text><text x="353.37" y="438.07" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="438.07" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试中</text><text x="72.00" y="449.77" font-size="9.00" class="sc-notoserifcjksc">成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="505.18" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="505.18" font-size="11.00" class="sc-notoserifcjksc">在编程环境中相比</text><text x="201.64" y="505.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="287.52" y="505.18" font-size="11.00" class="sc-notoserifcjksc">有大幅改进：开启扩展思考时，其在全部尝试上的攻</text><text x="72.00" y="520.80" font-size="11.00" class="sc-notoserifcjksc">击成功率为</text><text x="129.89" y="520.80" font-size="11.00" class="sc-loraregular sc-k">0.56%</text><text x="161.18" y="520.80" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="241.07" y="520.80" font-size="11.00" class="sc-loraregular sc-k">0.41%</text><text x="269.97" y="520.80" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="294.86" y="520.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="342.46" y="520.80" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="378.35" y="520.80" font-size="11.00" class="sc-loraregular sc-k">7.03%</text><text x="410.90" y="520.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="424.79" y="520.80" font-size="11.00" class="sc-loraregular sc-k">17.44%</text><text x="457.58" y="520.80" font-size="11.00" class="sc-notoserifcjksc">。它的鲁棒性略</text><text x="72.00" y="536.42" font-size="11.00" class="sc-notoserifcjksc">逊于</text><text x="96.89" y="536.42" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="180.24" y="536.42" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="238.13" y="536.42" font-size="11.00" class="sc-loraregular sc-k">0.31%</text><text x="267.20" y="536.42" font-size="11.00" class="sc-notoserifcjksc">，关闭思考</text><text x="325.09" y="536.42" font-size="11.00" class="sc-loraregular sc-k">0.29%</text><text x="356.28" y="536.42" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="381.18" y="536.42" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="466.53" y="536.42" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="72.00" y="552.04" font-size="11.00" class="sc-loraregular sc-k">0.45%</text><text x="102.89" y="552.04" font-size="11.00" class="sc-notoserifcjksc">），不过三者都处于一个绝对比率很低的狭窄区间内。加入提示词注入探针（一种在模型</text><text x="72.00" y="567.66" font-size="11.00" class="sc-notoserifcjksc">依据工具结果采取行动之前对其进行检查的额外安全防护层）后，</text><text x="391.00" y="567.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="468.03" y="567.66" font-size="11.00" class="sc-notoserifcjksc">在两种配置下</text><text x="72.00" y="583.28" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率均进一步降至</text><text x="206.89" y="583.28" font-size="11.00" class="sc-loraregular sc-k">0.18%</text><text x="236.01" y="583.28" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="650.91" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="650.91" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="683.28" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="683.28" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="683.28" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72" y="683.28" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="227.01" y="683.28" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性，在这类环境中，模型直接与</text><text x="72.00" y="698.90" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00" y="698.90" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33" y="698.90" font-size="11.00" class="sc-notoserifcjksc">）交互。攻击者直接针对测试用例进行优化。与编程评估类似，</text></svg></div>

ext><text x="478.50 482.76 490.35 494.35" y="389.31" font-size="11.00" class="sc-loraregular">7/14</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">79</text><text x="75.25" y="147.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="218.57" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="246.01" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="273.45" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="298.79" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="324.12" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="363.52" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="388.86" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="147.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="162.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="190.82" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="328.75" y="190.82" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="398.50" y="147.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">启用探针时的攻击成功率</text><text x="398.50" y="190.82" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="478.00" y="190.82" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">攻击者在</text><text x="118.89" y="82.61" font-size="11.00" class="sc-loraregular">14</text><text x="131.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们衡量全部尝试中的成功情况，并细分出至少有一次攻击成功</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的场景。我们为保护该场景下的用户设计了额外的安全防护措施，并比较了模型在启用和不启用</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">这些措施时的鲁棒性。</text><text x="72.00" y="406.38" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="406.38" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26 123.73 126.10 131.44 137.03 141.74 147.11" y="406.38" font-size="9.00" class="sc-lorabold">5.2.2.3.A] Shade</text><text x="154.31" y="406.38" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.31" y="406.38" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="505.31" y="406.38" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="523.31" y="406.38" font-size="9.00" class="sc-notoserifcjksc">标</text><text x="72.00" y="418.08" font-size="9.00" class="sc-notoserifcjksc">出，次优分数以下划线标出（但这未考虑误差范围）。攻击者在每个场景中进行</text><text x="389.37" y="418.08" font-size="9.00" class="sc-loraregular">200</text><text x="407.74" y="418.08" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所</text><text x="72.00" y="429.78" font-size="9.00" class="sc-notoserifcjksc">有尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="485.17" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中，</text><text x="182.00" y="485.17" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="220.74" y="485.17" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="245.64" y="485.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="331.52" y="485.17" font-size="11.00" class="sc-notoserifcjksc">同样有大幅改进：开启扩展思考时攻击成功</text><text x="72.00" y="500.79" font-size="11.00" class="sc-notoserifcjksc">率从</text><text x="96.89" y="500.79" font-size="11.00" class="sc-loraregular sc-k">7.14%</text><text x="126.62" y="500.79" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="151.51" y="500.79" font-size="11.00" class="sc-loraregular sc-k">0.54%</text><text x="182.40" y="500.79" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时从</text><text x="262.29" y="500.79" font-size="11.00" class="sc-loraregular">6.21%</text><text x="293.73" y="500.79" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="318.62" y="500.79" font-size="11.00" class="sc-loraregular sc-k">0.39%</text><text x="350.04" y="500.79" font-size="11.00" class="sc-notoserifcjksc">。启用探针后，</text><text x="427.04" y="500.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="504.07" y="500.79" font-size="11.00" class="sc-notoserifcjksc">的攻击</text><text x="72.00" y="516.41" font-size="11.00" class="sc-notoserifcjksc">成功率在开启思考时为</text><text x="184.89" y="516.41" font-size="11.00" class="sc-loraregular sc-k">0.25%</text><text x="215.73" y="516.41" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时为</text><text x="295.62" y="516.41" font-size="11.00" class="sc-loraregular sc-k">0.43%</text><text x="326.64" y="516.41" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="351.53" y="516.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="428.57" y="516.41" font-size="11.00" class="sc-notoserifcjksc">的每种配置下，</text><text x="505.57" y="516.41" font-size="11.00" class="sc-loraregular">14</text><text x="518.42" y="516.41" font-size="11.00" class="sc-notoserifcjksc">个场</text><text x="72.00" y="532.03" font-size="11.00" class="sc-notoserifcjksc">景中都恰好有一个被突破；而启用探针后关闭思考配置下看似出现的上升（从</text><text x="448.89" y="532.03" font-size="11.00" class="sc-loraregular sc-k">0.39%</text><text x="483.20" y="532.03" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="72.00" y="547.65" font-size="11.00" class="sc-loraregular sc-k">0.43%</text><text x="103.02" y="547.65" font-size="11.00" class="sc-notoserifcjksc">），对应的仅是</text><text x="182.91 188.82 191.59 197.77 204.60" y="547.65" font-size="11.00" class="sc-loraregular">2,800</text><text x="214.34" y="547.65" font-size="11.00" class="sc-notoserifcjksc">次尝试中多出的一次成功尝试，这一差异无法与噪声区分。</text><text x="500.34" y="547.65" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="563.27" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="563.27" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="124.64" y="563.27" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="209.98" y="563.27" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="267.88" y="563.27" font-size="11.00" class="sc-loraregular sc-k">0.82%</text><text x="298.90" y="563.27" font-size="11.00" class="sc-notoserifcjksc">）相当，且比</text><text x="367.79" y="563.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="451.14" y="563.27" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="72.00" y="578.89" font-size="11.00" class="sc-loraregular">2.25%</text><text x="102.08" y="578.89" font-size="11.00" class="sc-notoserifcjksc">，关闭思考</text><text x="159.98" y="578.89" font-size="11.00" class="sc-loraregular sc-k">6.04%</text><text x="191.24" y="578.89" font-size="11.00" class="sc-notoserifcjksc">）更鲁棒。</text><text x="72.00" y="647.09" font-size="11.00" class="sc-lorabold">5.2.2.4</text><text x="106.26" y="647.09" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="679.48" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的特定产品的鲁棒性。该评估由</text><text x="514.89" y="679.48" font-size="11.00" class="sc-loraregular">129</text><text x="72.00" y="695.10" font-size="11.00" class="sc-notoserifcjksc">个精选环境组成，这些环境在训练中从未出现过，并包含通过截图或页面读取</text></svg></div>
