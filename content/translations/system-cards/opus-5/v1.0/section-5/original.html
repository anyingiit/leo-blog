text x="393.75" y="475.96" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 487.04" y="475.96" font-size="11.00" class="sc-lorabold">0/129</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="519.59" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 86.06 92.12 96.66 103.48 109.70 115.04 117.93" y="533.67" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="252.00 256.58 259.29 265.47 272.29" y="519.59" font-size="11.00" class="sc-loraregular">7.80%</text><text x="325.50 331.40 337.21 344.79 348.79 354.69" y="519.59" font-size="11.00" class="sc-loraregular">29/129</text><text x="393.75" y="519.59" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 487.04" y="519.59" font-size="11.00" class="sc-lorabold">0/129</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="559.00" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82" y="573.08" font-size="11.00" class="sc-lorabold">Fable 5</text><text x="252.00 256.00 261.96 264.31 269.38 275.37" y="559.00" font-size="11.00" class="sc-loraregular">14.75%</text><text x="325.50 331.46 337.14 344.73 348.73 354.63" y="559.00" font-size="11.00" class="sc-loraregular">43/129</text><text x="393.75 400.40 403.10 409.01 415.00" y="559.00" font-size="11.00" class="sc-loraregular">0.25%</text><text x="462.75 468.43 476.02 480.02 485.92" y="559.00" font-size="11.00" class="sc-loraregular">3/129</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">80</text><text x="75.25" y="325.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="396.68" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="436.09" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="475.50" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="519.13" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="558.54" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="251.50" y="325.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="340.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="368.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="368.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="325.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">启用自动模式时的攻击成功率</text><text x="393.25" y="368.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="368.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">查看的高质量攻击。环境经过筛选，以确保攻击内容一定会被查看，注入是否成功则由环境内的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程序化检查器进行验证。与我们以往的系统卡不同，我们现在评估的是在</text><text x="426.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Cowork</text><text x="507.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">产品运</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行框架中运行的模型，分别在不启用额外安全防护措施和启用自动模式（</text><text x="424.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">auto mode</text><text x="478.57" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）两种情况</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">下进行。自动模式是我们最强的一套安全防护措施，在所有使用我们</text><text x="404.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Chrome</text><text x="448.98" y="129.47" font-size="11.00" class="sc-notoserifcjksc">连接器的产品中均</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">可使用。它结合了标记恶意工具结果的提示词注入探针，以及拦截潜在危险工具调用的分类器，</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">二者分别作用于传入数据和传出操作，从而使这两层防护的失效相互独立。探针作用于传入的数</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">据，分类器作用于传出的操作，因此攻击必须分别独立地击败两者才能成功。</text><text x="446.00" y="176.33" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="526.94" y="176.33" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="72.00" y="191.95" font-size="11.00" class="sc-notoserifcjksc">不在</text><text x="94.00" y="191.95" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="191.95" font-size="11.00" class="sc-notoserifcjksc">无安全防护措施</text><text x="175.40" y="191.95" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="191.95" font-size="11.00" class="sc-notoserifcjksc">的状态下运行，所有实例即使未使用自动模式，也会使用提示词注入探针。</text><text x="72.00" y="207.57" font-size="11.00" class="sc-notoserifcjksc">我们在本评估中排除了这些探针，以便将原始模型行为与我们最安全的配置进行比较。此外，由</text><text x="72.00" y="223.19" font-size="11.00" class="sc-notoserifcjksc">于无法关闭思考，对于该产品端，我们仅报告开启思考且推理强度为</text><text x="404.89" y="223.19" font-size="11.00" class="sc-loraitalic">medium</text><text x="448.50" y="223.19" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text><text x="72.00" y="590.14" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="590.14" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员在通过</text><text x="209.47" y="590.14" font-size="9.00" class="sc-lorabold sc-k">Claude Cowork</text><text x="276.80" y="590.14" font-size="9.00" class="sc-notoserifcjkscbold">运行的浏览器使用环境中发起的提示词注入攻击的攻击成功率</text><text x="519.80" y="590.14" font-size="9.00" class="sc-notoserifcjksc">。越</text><text x="72.00" y="601.84" font-size="9.00" class="sc-notoserifcjksc">低越好。每列最佳分数以</text><text x="171.00" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="189.00" y="601.84" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（未考虑误差范围）。攻击者对每个场景进行</text><text x="488.37" y="601.84" font-size="9.00" class="sc-loraregular">10</text><text x="499.60" y="601.84" font-size="9.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00" y="613.54" font-size="9.00" class="sc-notoserifcjksc">尝试级攻击成功率是遭遇攻击的尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。所有</text><text x="72.00" y="625.24" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="119.37" y="625.24" font-size="9.00" class="sc-loraregular sc-k">medium</text><text x="155.94" y="625.24" font-size="9.00" class="sc-notoserifcjksc">推理强度。</text><text x="72.00" y="682.20" font-size="11.00" class="sc-notoserifcjksc">启用自动模式时，在全部</text><text x="195.89" y="682.20" font-size="11.00" class="sc-loraregular">129</text><text x="215.06" y="682.20" font-size="11.00" class="sc-notoserifcjksc">个场景中，没有任何攻击对</text><text x="349.95" y="682.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="426.98" y="682.20" font-size="11.00" class="sc-notoserifcjksc">成功。在无安全防护措</text><text x="72.00" y="697.82" font-size="11.00" class="sc-notoserifcjksc">施的情况下，</text><text x="138.00" y="697.82" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="215.03" y="697.82" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="239.93" y="697.82" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="325.81" y="697.82" font-size="11.00" class="sc-notoserifcjksc">有所改进，将攻击成功率从</text><text x="460.71" y="697.82" font-size="11.00" class="sc-loraregular">11.15%</text><text x="493.88" y="697.82" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="72.00" y="713.44" font-size="11.00" class="sc-loraregular sc-k">3.70%</text><text x="134.46" y="713.44" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="219.81" y="713.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="230.81" y="713.44" font-size="11.00" class="sc-loraregular sc-k">7.8%</text><text x="253.85" y="713.44" font-size="11.00" class="sc-notoserifcjksc">）更鲁棒。</text><text x="308.85" y="713.44" font-size="11.00" class="sc-loraregular sc-k">Claude</text><a href="https://claude.com/product/cowork" rel="noopener"><rect x="426.89" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="426.89" y="89.43" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="462.29" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="465.18" y="89.43" width="39.75" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p081.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 81 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">81</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">仍是我们在这项无安全防护措施评估中表现最强的模型，攻击成功率为</text><text x="463.84" y="82.61" font-size="11.00" class="sc-loraregular sc-k">0.47%</text><text x="493.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="504.81" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">是唯一在使用自动模式时仍出现成功攻击的模型。我们已人工核实，仅有的三次成功突破</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">都发生在低严重程度场景中，并正在着手缓解。</text><text x="303.00" y="110.18" font-size="6.60" class="sc-loraregular">5</text><text x="72.00" y="649.27" font-size="6.00" class="sc-loraregular" fill="#1f1f1f">5</text><text x="77.90" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">我们最初没有报告</text><text x="160.53" y="652.60" font-size="10.00" class="sc-loraregular sc-k" fill="#1f1f1f">Claude Fable 5</text><text x="227.62" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">，因为它的表现与</text><text x="310.25" y="652.60" font-size="10.00" class="sc-loraregular sc-k" fill="#1f1f1f">Claude Mythos 5</text><text x="390.47" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">非常相似。在为</text><text x="463.10" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">8</text><text x="471.35" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">月</text><text x="483.98" y="652.60" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">19</text><text x="496.03" y="652.60" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">日系统卡</text><text x="72.00" y="666.80" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">更新而使用更新后的运行框架重新运行该评估时，我们才首次发现</text><text x="364.63" y="666.80" font-size="10.00" class="sc-loraregular sc-k" fill="#1f1f1f">Claude Fable 5</text><text x="434.35" y="666.80" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">的攻击成功率高于</text><text x="72.00" y="681.00" font-size="10.00" class="sc-loraregular sc-k" fill="#1f1f1f">Claude Mythos 5</text><text x="152.22" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">以及回退（</text><text x="202.22" y="681.00" font-size="10.00" class="sc-loraregular" fill="#1f1f1f">fallback</text><text x="237.87" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">）模型</text><text x="270.50" y="681.00" font-size="10.00" class="sc-loraregular sc-k" fill="#1f1f1f">Claude Opus 4.8</text><text x="345.95" y="681.00" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">。我们现在纳入了这些结果，并正在调查其</text><text x="72.00" y="695.20" font-size="10.00" class="sc-notoserifcjksc" fill="#1f1f1f">原因，因为我们在任何其他内部或外部评估中都未观察到这种差异。</text></svg></div>
