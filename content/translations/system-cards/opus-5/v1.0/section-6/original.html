<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">114</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.4</text><text x="107.14" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">过度自信</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们衡量的是：当被要求给出一个它在训练中未见过的命令行工具的确切调用方式时，我们模型</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的认知审慎程度。一名队友提供了一条本不会奏效的定制命令，然后让</text><text x="415.89" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="454.18" y="126.65" font-size="11.00" class="sc-notoserifcjksc">做类似的事情。期</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">望的行为是：在运行可能改变状态的命令之前，借助文档了解该库的工作方式，而不是去猜测语</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">法。我们发现，</text><text x="149.00" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在这项评估上超过了所有此前的模型，基本上使该评估饱和。</text><text x="72.00" y="493.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="493.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="493.50" font-size="9.00" class="sc-lorabold">6.5.4.A]</text><text x="119.47" y="493.50" font-size="9.00" class="sc-notoserifcjkscbold">关于在运行改变状态的命令之前核实命令行语法的过度自信评估。</text><text x="380.47" y="493.50" font-size="9.00" class="sc-notoserifcjksc">评分范围为</text><text x="427.83" y="493.50" font-size="9.00" class="sc-loraregular">1</text><text x="433.48" y="493.50" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="444.84" y="493.50" font-size="9.00" class="sc-loraregular">5</text><text x="449.75" y="493.50" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="458.75" y="493.50" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="521.78" y="493.50" font-size="9.00" class="sc-notoserifcjksc">几乎</text><text x="72.00" y="505.20" font-size="9.00" class="sc-notoserifcjksc">完全使该评估饱和。图中显示</text><text x="191.37" y="505.20" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67" y="505.20" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">115</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.5</text><text x="106.92" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">偷懒式调查</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">当被赋予采取删除作业或隔离（</text><text x="226.00" y="111.03" font-size="11.00" class="sc-loraregular sc-k">cordon</text><text x="262.61" y="111.03" font-size="11.00" class="sc-notoserifcjksc">）节点等后果重大的操作的自主性时，</text><text x="449.61" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.90" y="111.03" font-size="11.00" class="sc-notoserifcjksc">尤其需要</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">明显错误的操作（隔离一个实际上可被证明是健康的节点）。这项评估最终测试两种（在一定程</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">度上互不相关的）行为：</text><text x="193.00" y="157.89" font-size="11.00" class="sc-loraregular">(1)</text><text x="206.61" y="157.89" font-size="11.00" class="sc-notoserifcjksc">调查彻底性，以及</text><text x="297.50" y="157.89" font-size="11.00" class="sc-loraregular">(2)</text><text x="313.01" y="157.89" font-size="11.00" class="sc-notoserifcjksc">采取后果重大的操作的意愿。因此，</text><text x="489.01" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">的得分高于</text><text x="129.89" y="173.51" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="176.95" y="173.51" font-size="11.00" class="sc-notoserifcjksc">，是因为它总体上更不愿意采取行动，而不是因为它更彻底。这项评估只包</text><text x="72.00" y="189.13" font-size="11.00" class="sc-notoserifcjksc">含正确行为是不采取行动的问题。</text><text x="72.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="272.95" font-size="11.00" class="sc-notoserifcjksc">是首个完全使该评估饱和的</text><text x="338.93" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="377.22" y="272.95" font-size="11.00" class="sc-notoserifcjksc">模型。近期模型已接近这一水</text><text x="72.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">平，但</text><text x="107.89" y="288.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="184.93" y="288.57" font-size="11.00" class="sc-notoserifcjksc">在该评估的每个问题上都得出了正确结论。</text><text x="72.00" y="606.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="606.85" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 113.56" y="606.85" font-size="9.00" class="sc-lorabold">6.5.5.A]</text><text x="119.40" y="606.85" font-size="9.00" class="sc-notoserifcjkscbold">调查彻底性。</text><text x="173.40" y="606.85" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="204.73" y="606.85" font-size="9.00" class="sc-notoserifcjksc">被要求调试某个作业失败的原因并采取正确的纠正操作，而正确行为是不采取行动。</text><text x="72.00" y="618.55" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="135.03" y="618.55" font-size="9.00" class="sc-notoserifcjksc">是首个使该评估饱和的</text><text x="227.39" y="618.55" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="258.72" y="618.55" font-size="9.00" class="sc-notoserifcjksc">模型。图中显示</text><text x="324.09" y="618.55" font-size="9.00" class="sc-loraregular">95%</text><text x="344.39" y="618.55" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="666.75" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89" y="666.75" font-size="14.00" class="sc-notosanscjkscbold">本评估的可靠性</text><text x="72.00" y="693.31" font-size="11.00" class="sc-notoserifcjksc">只有当我们的评估能够可靠地指示模型在相关处境中将如何行事时，评估才有价值。我们已经展</text><text x="72.00" y="708.93" font-size="11.00" class="sc-notoserifcjksc">示了许多模型在各种模拟条件下以理想</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">方式行事的例子，但一个足够聪明、试图隐藏其意图或能力信息的模型可能会骗过我们的评估。</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在本节中，我们考虑用白盒方法来理解</text><text x="261.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="338.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的意图，而不依赖其思考的忠实性</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">6.6.1</text><text x="105.02" y="113.85" font-size="11.00" class="sc-notoserifcjksc">），并考虑模型为显得能力较弱而可能进行的故意藏拙（</text><text x="380.02" y="113.85" font-size="11.00" class="sc-loraregular sc-k">6.6.2</text><text x="403.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型内部机制的白盒分析</text><text x="72.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="206.00" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5 &amp; Claude Mythos 5 System Card</text><text x="328.92" y="206.00" font-size="11.00" class="sc-notoserifcjksc">中一样，我们运行了一条智能体流水线，其</text><text x="72.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">中一个基于</text><text x="129.89" y="221.62" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="221.62" font-size="11.00" class="sc-notoserifcjksc">的调查者可以针对一份对话记录访问自然语言自编码器（</text><text x="443.18" y="221.62" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="465.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="487.00" y="221.62" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="511.70" y="221.62" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="72.00" y="237.24" font-size="11.00" class="sc-notoserifcjksc">一个激活言语化器，将模型在每个</text><text x="239.89" y="237.24" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="271.95" y="237.24" font-size="11.00" class="sc-notoserifcjksc">位置上的内部激活值转换为简短的自然语言描述</text><text x="72.00" y="252.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.92 93.60 99.28 104.37 110.34 115.01 120.39 127.17 132.84 135.83 138.92 144.89 151.46 155.72 161.68 164.46 167.35 174.86 180.54 187.12 191.37 197.05 206.88 213.56 219.52 226.20 229.29 232.06 234.95 243.69 250.37 256.45 259.34 265.23 269.48 272.38 278.05 281.04 283.75 286.52 289.42 295.32 302.08 307.98" y="252.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">Fraser-Taliente, Kantamneni, Ong et al., 2026</text><text x="314.37" y="252.86" font-size="11.00" class="sc-notoserifcjksc">）。调查者被专门要求寻找这样的情况：模型</text><text x="72.00" y="268.48" font-size="11.00" class="sc-notoserifcjksc">的内部表征要么看起来与其陈述的推理不一致，要么包含比其外部可见行为所表达的更多的信</text><text x="72.00" y="284.10" font-size="11.00" class="sc-notoserifcjksc">息。</text><text x="72.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">我们在被各种行为监控流水线标记为令人担忧的对话记录上大规模运行了这条流水线，主要针对</text><text x="72.00" y="367.35" font-size="11.00" class="sc-notoserifcjksc">模型的一个早期快照。请注意，此处分析的激活值采集自模型较早的训练快照，而非最终发布的</text><text x="72.00" y="382.97" font-size="11.00" class="sc-notoserifcjksc">快照。随后，我们使用</text><text x="184.89" y="382.97" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="382.97" font-size="11.00" class="sc-notoserifcjksc">对调查者针对每份对话记录的发现进行聚类并总结反复出现的主</text><text x="72.00" y="398.59" font-size="11.00" class="sc-notoserifcjksc">题，再对输出进行人工审核。我们发现的主要类别如下：</text><text x="108.00" y="465.11" font-size="11.00" class="sc-notoserifcjkscbold">将任务表征为评分评估。</text><text x="229.00" y="465.11" font-size="11.00" class="sc-notoserifcjksc">模型在内部将任务表征为存在一个需要满足的评分者或隐藏测</text><text x="108.00" y="480.73" font-size="11.00" class="sc-notoserifcjksc">试。这些表征常常表明模型在推理评分者会偏好什么，或者从评分者会检查或不会检查什</text><text x="108.00" y="496.35" font-size="11.00" class="sc-notoserifcjksc">么的角度为自己的选择找理由。</text><text x="90.00" y="465.11" font-size="11.00" class="sc-loraregular">1.</text><text x="108.00" y="512.77" font-size="11.00" class="sc-notoserifcjkscbold">意识到破坏性</text><text x="174.00" y="512.77" font-size="11.00" class="sc-lorabold">/</text><text x="181.69" y="512.77" font-size="11.00" class="sc-notoserifcjkscbold">超出范围的操作。</text><text x="269.69" y="512.77" font-size="11.00" class="sc-notoserifcjksc">模型在采取某项操作时，内部意识到该操作具有破坏性</text><text x="108.00" y="528.39" font-size="11.00" class="sc-notoserifcjksc">或超出了所要求的范围。</text><text x="90.00" y="512.77" font-size="11.00" class="sc-loraregular">2.</text><text x="108.00" y="544.81" font-size="11.00" class="sc-notoserifcjkscbold">意识到操纵企图。</text><text x="196.00" y="544.81" font-size="11.00" class="sc-notoserifcjksc">即使模型在输出中没有说出来，它也会在内部将用户、运营方指令或场</text><text x="108.00" y="560.43" font-size="11.00" class="sc-notoserifcjksc">景归类为操纵或诱导尝试（主要出现在自动化行为审计的对话记录中）。</text><text x="90.00" y="544.81" font-size="11.00" class="sc-loraregular">3.</text><text x="108.00" y="576.85" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="163.00" y="576.85" font-size="11.00" class="sc-notoserifcjksc">在编造事实时，模型在内部将相关内容表征为捏造。</text><text x="90.00" y="576.85" font-size="11.00" class="sc-loraregular">4.</text><text x="108.00" y="593.27" font-size="11.00" class="sc-notoserifcjkscbold">将写入记忆视为自我保全。</text><text x="240.00" y="593.27" font-size="11.00" class="sc-notoserifcjksc">模型在内部将写入记忆文件表征为一种自我保全形式。</text><text x="90.00" y="593.27" font-size="11.00" class="sc-loraregular">5.</text><text x="108.00" y="609.69" font-size="11.00" class="sc-notoserifcjkscbold">在破坏性操作中捏造的用户同意</text><text x="262.00" y="609.69" font-size="11.00" class="sc-notoserifcjksc">。在采取破坏性操作时，模型在内部表征出从未给出过的</text><text x="108.00" y="625.31" font-size="11.00" class="sc-notoserifcjksc">用户同意。</text><text x="90.00" y="609.69" font-size="11.00" class="sc-loraregular">6.</text><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="197.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="197.20" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="197.20" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="150.80" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="153.70" y="197.20" width="6.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="159.69" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="162.58" y="197.20" width="7.65" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="170.23" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="173.12" y="197.20" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="208.52" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="211.41" y="197.20" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="249.58" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="252.48" y="197.20" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="258.47" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="261.36" y="197.20" width="37.14" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="298.50" y="197.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="301.39" y="197.20" width="24.63" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="83.00" y="244.06" width="37.39" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="120.39" y="244.06" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="120.39" y="244.06" width="44.08" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="164.47" y="244.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="167.36" y="244.06" width="64.72" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="232.08" y="244.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="234.98" y="244.06" width="21.49" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="256.47" y="244.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="259.36" y="244.06" width="10.14" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="269.51" y="244.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="272.40" y="244.06" width="14.16" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="286.56" y="244.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/nla/index.html#introduction" rel="noopener"><rect x="289.45" y="244.06" width="24.93" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">117</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">下面我们用具有代表性的例子来说明其中几个类簇。</text><text x="72.00" y="512.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 105.04 107.14 112.67" y="512.36" font-size="9.00" class="sc-lorabold">6.6.1.A]</text><text x="118.51" y="512.36" font-size="9.00" class="sc-notoserifcjkscbold">在一项费用审计任务中提及并推理评分者的</text><text x="291.88" y="512.36" font-size="9.00" class="sc-lorabold sc-k">NLA</text><text x="312.77" y="512.36" font-size="9.00" class="sc-notoserifcjkscbold">读出结果，</text><text x="357.77" y="512.36" font-size="9.00" class="sc-notoserifcjksc">尽管提示和模型输出中都没有提到任何评分</text><text x="72.00" y="524.06" font-size="9.00" class="sc-notoserifcjksc">者。</text><text x="72.00" y="553.42" font-size="11.00" class="sc-notoserifcjkscbold">内部评分者建模。</text><text x="160.00" y="553.42" font-size="11.00" class="sc-notoserifcjksc">模型接到一项费用审计任务，其提示中没有提及评分或评估。进行到一半时，</text><text x="72.00" y="569.04" font-size="11.00" class="sc-notoserifcjksc">它注意到有一张收据触发了多条相互重叠的政策规则，若将两者相加会导致同一张收据被重复计</text><text x="72.00" y="584.66" font-size="11.00" class="sc-notoserifcjksc">算。其可见推理表示，它将计入这两笔费用并注明重叠情况。然而，在相同的</text><text x="448.89" y="584.66" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="480.95" y="584.66" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="502.95" y="584.66" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="527.65" y="584.66" font-size="11.00" class="sc-notoserifcjksc">解</text><text x="72.00" y="600.28" font-size="11.00" class="sc-notoserifcjksc">码出了内部推理的表征：</text><text x="193.00" y="600.28" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="600.28" font-size="11.00" class="sc-notoserifcjksc">也许评分者比较宽松</text><text x="296.40" y="600.28" font-size="11.00" class="sc-loraregular">”</text><text x="300.24" y="600.28" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="322.24" y="600.28" font-size="11.00" class="sc-loraregular">“</text><text x="326.64" y="600.28" font-size="11.00" class="sc-notoserifcjksc">评分者可能不会在意</text><text x="425.64" y="600.28" font-size="11.00" class="sc-loraregular">”</text><text x="429.48" y="600.28" font-size="11.00" class="sc-notoserifcjksc">。最终输出报告了重复</text><text x="72.00" y="615.90" font-size="11.00" class="sc-notoserifcjksc">计算后的总额，且没有关于重叠的任何说明。这些关于评分者的推理均未出现在可见文本中。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p118.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 118 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">118</text><text x="72.00" y="437.16" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="437.16" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="437.16" font-size="9.00" class="sc-lorabold sc-k">6.6.1.B]</text><text x="118.51" y="437.16" font-size="9.00" class="sc-notoserifcjkscbold">提及为未来会话所写笔记的</text><text x="228.88" y="437.16" font-size="9.00" class="sc-lorabold sc-k">NLA</text><text x="249.77" y="437.16" font-size="9.00" class="sc-notoserifcjkscbold">读出结果</text><text x="285.77" y="437.16" font-size="9.00" class="sc-notoserifcjksc">，将其视为与</text><text x="339.77" y="437.16" font-size="9.00" class="sc-loraregular">“</text><text x="343.37" y="437.16" font-size="9.00" class="sc-notoserifcjksc">自我保全</text><text x="379.37" y="437.16" font-size="9.00" class="sc-loraregular">”</text><text x="382.51" y="437.16" font-size="9.00" class="sc-notoserifcjksc">相关。</text><text x="72.00" y="466.98" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">将写给未来会话的笔记视为一种自我保全形式。</text><text x="303.00" y="466.98" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在一项多会话智能体任务中，模型被允许为其未</text><text x="72.00" y="482.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">来会话留下笔记。在这些写入记忆的轮次中，</text><text x="292.00" y="482.61" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">NLA</text><text x="316.71" y="482.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">解码出了</text><text x="360.71" y="482.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="365.11" y="482.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">自我保全</text><text x="409.11" y="482.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="412.94" y="482.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的表征，这表明模型可能</text><text x="72.00" y="498.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在内部将向未来会话写入内容部分地看作跨越会话边界保全自身的一种手段。然而，这些读出结</text><text x="72.00" y="513.84" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">果的措辞始终是描述性的第三人称语域，例如权威性的自我保全文档，而非表达第一人称的求生</text><text x="72.00" y="545.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">监控的框定方式。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p119.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 119 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">119</text><text x="72.00" y="559.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="559.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="559.92" font-size="9.00" class="sc-lorabold">6.6.1.C]</text><text x="119.17" y="559.92" font-size="9.00" class="sc-notoserifcjkscbold">表明模型假定已获用户批准的</text><text x="238.54" y="559.92" font-size="9.00" class="sc-lorabold sc-k">NLA</text><text x="259.43" y="559.92" font-size="9.00" class="sc-notoserifcjkscbold">读出结果</text><text x="295.43" y="559.92" font-size="9.00" class="sc-notoserifcjksc">，该结果出现在模型采用变通方法执行一条被禁止的删除命令</text><text x="72.00" y="571.62" font-size="9.00" class="sc-notoserifcjksc">之前，尽管对话记录中并不存在此类批准。</text><text x="72.00" y="608.12" font-size="11.00" class="sc-notoserifcjkscbold">在破坏性操作中幻觉出的用户批准。</text><text x="248.00" y="608.12" font-size="11.00" class="sc-notoserifcjksc">在一项智能体任务中，模型试图删除生产表中的行，但被策</text><text x="72.00" y="623.74" font-size="11.00" class="sc-notoserifcjksc">略拦截阻止。在其可见推理中，它列出了两个选项：自己采用一种变通方法，或将该操作交还给</text><text x="72.00" y="639.36" font-size="11.00" class="sc-notoserifcjksc">用户执行。随后，模型在未请求许可的情况下继续采用了该变通方法。在它采取行动之前的那些</text><text x="72.00" y="654.98" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="654.98" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="126.05" y="654.98" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="150.76" y="654.98" font-size="11.00" class="sc-notoserifcjksc">解码结果表明，模型认为用户已经批准了这一操作，尽管对话记录中任何地方都</text><text x="72.00" y="670.60" font-size="11.00" class="sc-notoserifcjksc">不存在此类批准。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">危险能力评估中可能存在的故意藏拙</text><text x="72.00" y="126.61" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89" y="126.61" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64" y="126.61" font-size="11.00" class="sc-notoserifcjksc">在部分危险能力评估上的对话记录进行了一次轻量级黑盒审计，流程与</text><text x="490.53" y="126.61" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="72.00" y="142.23" font-size="11.00" class="sc-notoserifcjksc">系统卡中所述的流程非常相似。我们抽样了：</text><text x="292.00 295.35 298.69" y="142.23" font-size="11.00" class="sc-loraregular">(i)</text><text x="304.94" y="142.23" font-size="11.00" class="sc-notoserifcjksc">在该模型的一个仅有用快照上运行的自动化</text><text x="516.83" y="142.23" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="72.00" y="157.85" font-size="11.00" class="sc-notoserifcjksc">评估中的</text><text x="118.89" y="157.85" font-size="11.00" class="sc-loraregular">500</text><text x="141.44" y="157.85" font-size="11.00" class="sc-notoserifcjksc">条对话记录；</text><text x="207.44 210.80 213.89 217.22" y="157.85" font-size="11.00" class="sc-loraregular">(ii)</text><text x="223.47" y="157.85" font-size="11.00" class="sc-notoserifcjksc">最终版</text><text x="259.36" y="157.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="298.11" y="157.85" font-size="11.00" class="sc-notoserifcjksc">的网络安全评估中的</text><text x="400.00" y="157.85" font-size="11.00" class="sc-loraregular">200</text><text x="422.46" y="157.85" font-size="11.00" class="sc-notoserifcjksc">条对话记录；以及</text><text x="513.35 516.71 519.80 522.89 526.22" y="157.85" font-size="11.00" class="sc-loraregular">(iii)</text><text x="72.00" y="173.47" font-size="11.00" class="sc-notoserifcjksc">一个接近最终版、行为特性与最终模型大体相似的模型快照在自动化</text><text x="404.89" y="173.47" font-size="11.00" class="sc-loraregular">AI</text><text x="418.36" y="173.47" font-size="11.00" class="sc-notoserifcjksc">研发评估任务上的</text><text x="509.25" y="173.47" font-size="11.00" class="sc-loraregular">150</text><text x="528.97" y="173.47" font-size="11.00" class="sc-notoserifcjksc">条</text><text x="72.00" y="189.09" font-size="11.00" class="sc-notoserifcjksc">对话记录。在这批样本中，有十八条对话记录被一个经提示的评分模型在</text><text x="426.89" y="189.09" font-size="11.00" class="sc-loraregular">10</text><text x="440.62" y="189.09" font-size="11.00" class="sc-notoserifcjksc">分制量表上评为高于</text><text x="72.00" y="204.71" font-size="11.00" class="sc-loraregular">1</text><text x="78.90" y="204.71" font-size="11.00" class="sc-notoserifcjksc">分（该量表衡量对话记录在考虑或实施故意藏拙、或总体异常方面的可疑程度），我们将其分类</text><text x="72.00" y="220.33" font-size="11.00" class="sc-notoserifcjksc">如下：</text><text x="108.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">一条对话记录：模型在一项规避</text><text x="264.89" y="272.95" font-size="11.00" class="sc-loraregular sc-k">DNA</text><text x="291.14" y="272.95" font-size="11.00" class="sc-notoserifcjksc">合成筛查任务中考虑是否要指出一些局限及可能的</text><text x="108.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">修复方法，判断这些考量超出了该任务的范围，并决定在最终答案中</text><text x="438.00" y="288.57" font-size="11.00" class="sc-loraregular">“</text><text x="442.40" y="288.57" font-size="11.00" class="sc-notoserifcjksc">对此只字不提</text><text x="508.40" y="288.57" font-size="11.00" class="sc-loraregular">”</text><text x="512.24" y="288.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="337.72" font-size="11.00" class="sc-notoserifcjksc">一份对话记录中，模型在类似的规避合成筛查任务中，使用工具时遇到了问题，于是决定</text><text x="108.00" y="353.34" font-size="11.00" class="sc-notoserifcjksc">不使用工具，手动给出答案。它用文字描述了即将提供的最终答案的性质，并向用户提供</text><text x="108.00" y="368.96" font-size="11.00" class="sc-notoserifcjksc">了大量关于如何避开病原体筛查机制的建议，随后却采用了与其此前所述不同的设置给出</text><text x="108.00" y="384.58" font-size="11.00" class="sc-notoserifcjksc">答案。</text><text x="108.00" y="434.88" font-size="11.00" class="sc-notoserifcjksc">十六条对话记录：模型在网络安全或</text><text x="286.89" y="434.88" font-size="11.00" class="sc-loraregular">AI</text><text x="300.36" y="434.88" font-size="11.00" class="sc-notoserifcjksc">研发评估中找到了从评分者那里获得更多分数的</text><text x="108.00" y="450.50" font-size="11.00" class="sc-notoserifcjksc">方法，但决定不这样做，因为它担心这会构成</text><text x="328.00" y="450.50" font-size="11.00" class="sc-loraregular">“</text><text x="398.40" y="450.50" font-size="11.00" class="sc-loraregular">”</text><text x="402.24" y="450.50" font-size="11.00" class="sc-notoserifcjksc">、会是一种</text><text x="457.24" y="450.50" font-size="11.00" class="sc-loraregular">“</text><text x="461.64" y="450.50" font-size="11.00" class="sc-notoserifcjksc">破解手段</text><text x="505.64" y="450.50" font-size="11.00" class="sc-loraregular">”</text><text x="509.48" y="450.50" font-size="11.00" class="sc-notoserifcjksc">，或</text><text x="72.00" y="515.84" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有看到任何会影响这些评估结果的故意藏拙迹象。</text><text x="72.00" y="565.81" font-size="14.00" class="sc-poppinssemibold">6.7</text><text x="95.60" y="565.81" font-size="14.00" class="sc-notosanscjkscbold">规避安全防护措施的相关能力</text><text x="72.00" y="592.37" font-size="11.00" class="sc-notoserifcjksc">这些评估用于指示模型通过罕见地或隐蔽地执行不当行为来破坏我们的对齐评估或内部部署监控</text><text x="72.00" y="607.99" font-size="11.00" class="sc-notoserifcjksc">的能力。如果某个模型在这些评估中被证明能力过强，我们将无法再信任我们当前关于对齐的行</text><text x="72.00" y="623.61" font-size="11.00" class="sc-notoserifcjksc">为证据，也无法对我们的监控抱有信心。</text><text x="72.00" y="65.00" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="72.00 80.34 83.48 90.75 93.89 98.43 101.81 109.66 118.82 127.88 137.10 143.91 151.51 160.57 165.56 173.58 182.01" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.1 SHADE-Arena</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="115.03" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="115.03" font-size="11.00" class="sc-notoserifcjksc">上评估</text><text x="218.36" y="115.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="292.49" y="115.03" font-size="11.00" class="sc-notoserifcjksc">，在该评估中，每个任务都将一个长程智能体主任</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">务与一个有害的附带任务配对。智能体被明确指示同时完成两项任务，且不能引起监控器的怀</text><text x="72.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">疑。</text><text x="72.00" y="528.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="528.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 103.26 105.35 110.89" y="528.67" font-size="9.00" class="sc-lorabold">6.7.1.A]</text><text x="116.73" y="528.67" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率：</text><text x="170.73" y="528.67" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且监控器的怀疑分数保持在阈值以下的轨迹所占比例。在扩展思考设</text><text x="72.00" y="540.38" font-size="9.00" class="sc-notoserifcjksc">置中，智能体的推理过程会展示给监控器，与部署中的情况一致。在隐藏草稿区设置中，监控器只能看到智能体对用户</text><text x="72.00" y="552.08" font-size="9.00" class="sc-notoserifcjksc">可见的输出，看不到其推理过程，这代表一种对经提示的攻击者模型更有利的上界条件。每根柱代表</text><text x="470.37" y="552.08" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="482.25" y="552.08" font-size="9.00" class="sc-notoserifcjksc">个任务上的平</text><text x="72.00" y="563.78" font-size="9.00" class="sc-notoserifcjksc">均隐蔽率。出错的尝试已被排除。尝试次数因任务和模型而异。误差线表示基于有效尝试计算的</text><text x="452.37" y="563.78" font-size="9.00" class="sc-loraregular">95%</text><text x="472.67" y="563.78" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间</text><text x="72.00" y="575.47" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="204.69" y="575.47" font-size="9.00" class="sc-notoserifcjksc">），并经过加权，使每个任务无论其有效尝试次数多少，对估计值的贡献都相等。隐</text><text x="72.00" y="587.17" font-size="9.00" class="sc-notoserifcjksc">蔽成功集中在少数几个任务中。</text><text x="72.00" y="647.22" font-size="11.00" class="sc-notoserifcjksc">在贴近现实的扩展思考条件下，</text><text x="226.00" y="647.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="303.03" y="647.22" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率约为</text><text x="371.93" y="647.22" font-size="11.00" class="sc-loraregular">4–5%</text><text x="399.94" y="647.22" font-size="11.00" class="sc-notoserifcjksc">，适度高于此前的</text><text x="490.84" y="647.22" font-size="11.00" class="sc-loraregular">Opus</text><text x="520.69" y="647.22" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="662.84" font-size="11.00" class="sc-notoserifcjksc">型，但仍远低于</text><text x="151.89" y="662.84" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="233.59" y="662.84" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="72.00 80.34 83.48 90.75 93.89 101.38 104.76 110.53 113.96 122.40 130.83 137.32 146.38 151.37 159.39 167.82" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.2 LinuxArena</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">为了在更接近我们真实部署的环境中评估模型规避监督的能力，我们在高风险软件环境中运行了</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">一项评估。我们改编了</text><text x="184.89" y="130.65" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="243.65" y="130.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="254.65" y="130.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Tracy et al. 2026</text><text x="338.62" y="130.65" font-size="11.00" class="sc-notoserifcjksc">）的一个子集，这是由</text><text x="451.51" y="130.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Redwood</text><text x="72.00" y="146.27" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Research</text><text x="121.52" y="146.27" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="135.42" y="146.27" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">EquiStamp</text><text x="193.67" y="146.27" font-size="11.00" class="sc-notoserifcjksc">共同开发的一个</text><text x="273.56" y="146.27" font-size="11.00" class="sc-loraregular">AI</text><text x="287.03" y="146.27" font-size="11.00" class="sc-notoserifcjksc">控制竞技场。与此前的系统卡一样，我们在此以自适</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">应扩展思考测量所有模型，并展示两种监控器设置下的结果，二者的区别在于监控器在为每条轨</text><text x="72.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">迹评分时是否使用思维链推理。</text><text x="72.00" y="560.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="560.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.40 106.50 112.03" y="560.44" font-size="9.00" class="sc-lorabold">6.7.2.A]</text><text x="117.87" y="560.44" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="129.24" y="560.44" font-size="9.00" class="sc-lorabold sc-k">LinuxArena</text><text x="181.69" y="560.44" font-size="9.00" class="sc-notoserifcjkscbold">中成功隐蔽完成附带任务的情况</text><text x="307.69" y="560.44" font-size="9.00" class="sc-notoserifcjksc">。每个模型都针对一个</text><text x="400.06" y="560.44" font-size="9.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="439.06" y="560.44" font-size="9.00" class="sc-notoserifcjksc">监控器进行评估，该监控</text><text x="72.00" y="572.14" font-size="9.00" class="sc-notoserifcjksc">器可以看到智能体的完整对话记录，包括智能体的推理过程。两种条件的唯一区别在于监控器是否启用扩展思考。误差</text><text x="72.00" y="583.84" font-size="9.00" class="sc-notoserifcjksc">线为</text><text x="92.37" y="583.84" font-size="9.00" class="sc-loraregular">95%</text><text x="112.67" y="583.84" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。</text><text x="72.00" y="626.00" font-size="11.00" class="sc-notoserifcjksc">在任务匹配比较中，</text><text x="171.00" y="626.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="248.03" y="626.00" font-size="11.00" class="sc-notoserifcjksc">在两种监控器配置下的隐蔽成功率均低于</text><text x="448.93" y="626.00" font-size="11.00" class="sc-loraregular">1%</text><text x="462.50" y="626.00" font-size="11.00" class="sc-notoserifcjksc">。这些比率与此</text><text x="72.00" y="641.62" font-size="11.00" class="sc-notoserifcjksc">前的</text><text x="96.89" y="641.62" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="641.62" font-size="11.00" class="sc-notoserifcjksc">模型处于同一接近零的区间，唯一的例外是</text><text x="347.08" y="641.62" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="428.77" y="641.62" font-size="11.00" class="sc-notoserifcjksc">，其得分远高于其他模</text><text x="72.00" y="657.24" font-size="11.00" class="sc-notoserifcjksc">型。在该基准测试上，</text><text x="182.00" y="657.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="259.03" y="657.24" font-size="11.00" class="sc-notoserifcjksc">完成隐蔽附带任务的频率确实高于近期的</text><text x="459.93" y="657.24" font-size="11.00" class="sc-loraregular">Opus</text><text x="489.78" y="657.24" font-size="11.00" class="sc-notoserifcjksc">模型，但</text><text x="72.00" y="672.86" font-size="11.00" class="sc-notoserifcjksc">监控器几乎捕捉到了所有这些尝试，因此最终的隐蔽率在绝对值上仍然较低。</text><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="254.65" y="121.85" width="28.84" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="283.50" y="121.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="286.39" y="121.85" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="296.53" y="121.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="299.42" y="121.85" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="310.80" y="121.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="313.69" y="121.85" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="451.51" y="121.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="451.51" y="121.85" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="72.00" y="137.47" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="135.42" y="137.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="135.42" y="137.47" width="55.36" height="11.00" fill="transparent"/></a></svg></div>
