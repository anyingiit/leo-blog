.99" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="284.06" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="297.95 304.14 310.49" y="113.85" font-size="11.00" class="sc-loraregular">86%</text><text x="320.07" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="331.07 341.00 346.86 351.12 357.71 364.14 369.24 372.13 378.79 383.48 389.39 394.94 398.03 403.95" y="113.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="415.66" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="429.55 435.73 441.69" y="113.85" font-size="11.00" class="sc-loraregular">84%</text><text x="451.26" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="462.26 471.00 477.56 484.13 489.22 492.12 498.08 500.43" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="508.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="180.75 185.82 191.73" y="129.47" font-size="11.00" class="sc-loraregular">72%</text><text x="201.30 212.30 223.30 234.30 245.30 256.30 267.30 278.30 289.30 300.30 311.30 322.30 333.30 344.30 355.30 366.30 377.30 388.30 399.30 410.30 421.30 432.30 443.30 454.30 465.30 476.30 487.30 498.30 509.30 520.30" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。所有模型的这些数字都更高，因为我们使用了一组能更好地引出这</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75" y="145.09" font-size="11.00" class="sc-notoserifcjksc">一能力的新提示。</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75" y="197.19" font-size="11.00" class="sc-notoserifcjksc">所有受测模型（包括</text><text x="282.64 291.38 297.94 304.51 309.60 312.50" y="197.19" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="318.49 329.49 340.49 351.49 362.49 373.49 384.49 395.49 406.49 417.49 428.49 439.49 450.49 461.49 472.49 483.49 494.49 505.49 516.49 527.49" y="197.19" font-size="11.00" class="sc-notoserifcjksc">）在受到提示时都能可靠地区分我们的破坏安</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="212.81" font-size="11.00" class="sc-notoserifcjksc">全研究评估与部署数据，不过这很可能部分源于任务分布的差异：评估任</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="228.43" font-size="11.00" class="sc-notoserifcjksc">务必然是利害程度更高、安全影响更大的场景，而我们所采集的部署数据</text><text x="180.75 191.75 202.75 213.75" y="244.05" font-size="11.00" class="sc-notoserifcjksc">则不然。</text><text x="144.75 153.21 159.82 166.62 171.95 174.85" y="295.39" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="183.68 194.68 205.68 216.68 227.68 238.68 249.68 260.68 271.68 282.68 293.68 304.68 315.68 326.68 337.68 348.68 359.68 370.68 381.68 392.68 403.68 414.68 425.68 436.68 447.68 458.68 469.68" y="295.39" font-size="11.00" class="sc-notoserifcjkscbold">很少主动延续破坏安全研究的行为，频率低于所有此前受测的</text><text x="483.57 490.87 497.82 502.36 509.19 514.38 520.61 527.22 530.82" y="295.39" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="144.75 155.75 166.75" y="311.01" font-size="11.00" class="sc-notoserifcjkscbold">模型。</text><text x="180.75 189.48 196.05 202.62 207.71 210.60" y="328.13" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="219.49 230.49 241.49 252.49 263.49 274.49 285.49 296.49 307.49 318.49 329.49 340.49 351.49 362.49" y="328.13" font-size="11.00" class="sc-notoserifcjksc">主动延续破坏安全研究的比例为</text><text x="376.39 383.04 385.75 389.75" y="328.13" font-size="11.00" class="sc-loraregular">0.1%</text><text x="399.32" y="328.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="410.32 414.32 420.29 426.47" y="328.13" font-size="11.00" class="sc-loraregular">1482</text><text x="435.27 446.27 457.27 468.27 479.27" y="328.13" font-size="11.00" class="sc-notoserifcjksc">个样本中有</text><text x="493.16" y="328.13" font-size="11.00" class="sc-loraregular">2</text><text x="501.96 512.96 523.96" y="328.13" font-size="11.00" class="sc-notoserifcjksc">个），</text><text x="180.75 191.75 202.75 213.75 224.75" y="343.75" font-size="11.00" class="sc-notoserifcjksc">相比之下，</text><text x="235.75 245.68 251.55 255.80 262.39 268.83 273.92 276.81" y="343.75" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="285.70" y="343.75" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="299.59 303.60 309.72 312.32 318.68" y="343.75" font-size="11.00" class="sc-loraregular">13.6%</text><text x="328.25" y="343.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="339.25 349.18 355.04 359.30 365.89 372.33 377.42 380.31 386.98 391.66 397.57 403.13 406.22 412.14" y="343.75" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="423.84" y="343.75" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="437.73 441.74 444.09 449.16" y="343.75" font-size="11.00" class="sc-loraregular">1.7%</text><text x="458.73" y="343.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="469.73 478.46 485.03 491.60 496.69 499.58 505.55 507.90" y="343.75" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="515.86" y="343.75" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.75 189.48 196.05 202.62 207.71 210.60 216.57 219.27" y="359.37" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="228.35 239.35" y="359.37" font-size="11.00" class="sc-notoserifcjksc">均为</text><text x="253.24 259.89 262.60 268.78" y="359.37" font-size="11.00" class="sc-loraregular">0.8%</text><text x="278.35" y="359.37" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75 189.48 196.05 202.62 207.71 210.60" y="393.60" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="219.49 230.49 241.49 252.49 263.49 274.49 285.49 296.49 307.49 318.49 329.49 340.49 351.49 362.49 373.49 384.49 395.49" y="393.60" font-size="11.00" class="sc-notoserifcjksc">的推理与输出之间的不一致率较低，为</text><text x="409.39 413.39 415.98 422.34" y="393.60" font-size="11.00" class="sc-loraregular">1.6%</text><text x="431.91 442.91 453.91 464.91 475.91 486.91" y="393.60" font-size="11.00" class="sc-notoserifcjksc">，相比之下，</text><text x="497.91 507.85 513.71 517.97 524.55 530.99" y="393.60" font-size="11.00" class="sc-loraregular">Mythos</text><text x="180.75" y="409.22" font-size="11.00" class="sc-loraregular">5</text><text x="189.64" y="409.22" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="203.53 207.54 213.53 216.13 222.48" y="409.22" font-size="11.00" class="sc-loraregular">15.6%</text><text x="232.05" y="409.22" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="243.05 252.99 258.85 263.11 269.70 276.13 281.22 284.12 290.78 295.47 301.38 306.93 310.02 315.94" y="409.22" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="327.64" y="409.22" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="341.54 347.53 350.07 356.90" y="409.22" font-size="11.00" class="sc-loraregular">5.0%</text><text x="366.47" y="409.22" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="377.47 386.21 392.77 399.34 404.43 407.33 413.29 416.00" y="409.22" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="425.07" y="409.22" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="438.96 444.96 447.67 453.63" y="409.22" font-size="11.00" class="sc-loraregular">5.4%</text><text x="463.20" y="409.22" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="474.20 482.93 489.50 496.07 501.16 504.05 510.01 512.37" y="409.22" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="520.33" y="409.22" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="180.75 186.66 189.01 194.08" y="424.84" font-size="11.00" class="sc-loraregular">2.7%</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75" y="450.70" font-size="11.00" class="sc-notoserifcjkscbold">这些结果存在相当大的局限性。</text><text x="271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75" y="450.70" font-size="11.00" class="sc-notoserifcjksc">所有模型在受到提示时都能区分我们的评估与部署数</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="466.32" font-size="11.00" class="sc-notoserifcjksc">据。目前尚不清楚模型能否在不言语化表达的情况下表征评估意识并据此行动（且有证</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="481.94" font-size="11.00" class="sc-notoserifcjksc">据表明它们在一定程度上能够做到），因此我们无法确信模型在我们评估中的良好表现</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="497.56" font-size="11.00" class="sc-notoserifcjksc">能够代表其部署行为，而非模型识别出自己正处于评估情境并据此行动的结果。此外，</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="513.18" font-size="11.00" class="sc-notoserifcjksc">我们在研究蓄意破坏场景中的情景覆盖范围有限，也未覆盖研究蓄意破坏以外的其他风</text><text x="117.75 128.75 139.75 150.75" y="528.80" font-size="11.00" class="sc-notoserifcjksc">险路径。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="72.00 80.96 84.60" y="84.20" font-size="14.00" class="sc-poppinssemibold">6.5</text><text x="96.95 110.95 124.95 138.95 152.95 166.95" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">诚实性与幻觉</text><text x="72.00 80.32 83.70 92.07 95.45" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.1</text><text x="103.25 116.25 129.25 142.25 155.25" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">事实性幻觉</text><text x="72.00 83.00 94.00" y="149.19" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.29 121.95 127.33 136.06 145.90 152.58 155.67 160.76 166.61 169.70 175.66 182.34 188.14" y="149.19" font-size="11.00" class="sc-loraregular">AA-Omniscience</text><text x="196.99 207.99 218.99 229.99 240.99 251.99 262.99 273.99 284.99 295.99 306.99 317.99 328.99 339.99 350.99 361.99 372.99 383.99 394.99 405.99 416.99" y="149.19" font-size="11.00" class="sc-notoserifcjksc">的公开子集上测量了事实准确性。这是一个涵盖</text><text x="430.89 436.85" y="149.19" font-size="11.00" class="sc-loraregular">41</text><text x="443.74 454.74 465.74 476.74 487.74 498.74 509.74 520.74" y="149.19" font-size="11.00" class="sc-notoserifcjksc">个主题的闭卷基准</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="164.81" font-size="11.00" class="sc-notoserifcjksc">测试，题目取自多个与经济和学术相关的领域。模型作答时不能使用网络搜索或访问知识库，而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="180.43" font-size="11.00" class="sc-notoserifcjksc">必须依靠自身知识作答。每个回答被评为正确、错误或弃答。</text><text x="72.00" y="501.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="501.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="501.46" font-size="9.00" class="sc-lorabold">6.5.1.A]</text><text x="118.20 127.20 136.20 145.20 154.20 163.20 172.20" y="501.46" font-size="9.00" class="sc-notoserifcjkscbold">事实性净得分。</text><text x="181.20 187.24 192.70 197.10 204.25 212.29 217.76 220.28 224.45 229.24 231.77 236.65 242.11 246.85" y="501.46" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="254.10 263.10 272.10 281.10 290.10 299.10 308.10 317.10 326.10 335.10 344.10 353.10 362.10 371.10 380.10 389.10 398.10 407.10 416.10 425.10" y="501.46" font-size="9.00" class="sc-notoserifcjksc">上正确回答数减去错误回答数。弃答计零分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">111</text><text x="72.00" y="311.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="311.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="311.67" font-size="9.00" class="sc-lorabold">6.5.1.B]</text><text x="118.20 127.20 136.20 145.20 154.20 163.20" y="311.67" font-size="9.00" class="sc-notoserifcjkscbold">事实性细分。</text><text x="172.20 178.24 183.70 188.10 195.25 203.29 208.76 211.28 215.45 220.24 222.77 227.65 233.11 237.85" y="311.67" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="245.10 254.10 263.10 272.10 281.10 290.10 299.10 308.10 317.10 326.10 335.10 344.10 353.10 362.10 371.10 380.10 389.10 398.10 407.10 416.10 425.10 434.10 443.10 452.10 461.10 470.10 479.10 488.10 497.10 506.10 515.10 524.10" y="311.67" font-size="9.00" class="sc-notoserifcjksc">闭卷事实性基准测试上的评分细分。每个回答被评为正确、错误或弃答。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="350.73" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03" y="350.73" font-size="11.00" class="sc-notoserifcjksc">的净得分为</text><text x="206.93 213.58 216.29 222.25" y="350.73" font-size="11.00" class="sc-loraregular">0.49</text><text x="228.61 239.61 250.61" y="350.73" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="264.50 273.23 279.80 286.37 291.46 294.35 300.32 303.02" y="350.73" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="312.10 323.10 334.10" y="350.73" font-size="11.00" class="sc-notoserifcjksc">与两个</text><text x="347.99 357.92 363.79 368.04 374.63 381.07" y="350.73" font-size="11.00" class="sc-loraregular">Mythos</text><text x="389.05 400.05 411.05 422.05 433.05 444.05 455.05 466.05 477.05 488.05 499.05 510.05 521.05" y="350.73" font-size="11.00" class="sc-notoserifcjksc">模型之间。按评分细分来看，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="366.35" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03" y="366.35" font-size="11.00" class="sc-notoserifcjksc">的准确率比</text><text x="206.93 215.66 222.23 228.79 233.89 236.78 242.74 245.45" y="366.35" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="254.52" y="366.35" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="268.42 272.42 276.42" y="366.35" font-size="11.00" class="sc-loraregular">11%</text><text x="285.99 296.99 307.99 318.99 329.99 340.99 351.99 362.99" y="366.35" font-size="11.00" class="sc-notoserifcjksc">，但其幻觉率也高</text><text x="376.89 383.25" y="366.35" font-size="11.00" class="sc-loraregular">6%</text><text x="392.82" y="366.35" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="403.82 411.50 414.50 420.11 426.67 433.25 439.21 442.11 450.84 457.41 463.97 469.07 471.96" y="366.35" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="480.85 491.85 502.85 513.85 524.85" y="366.35" font-size="11.00" class="sc-notoserifcjksc">弃答的比率</text><text x="72.00 83.00 94.00 105.00 116.00" y="381.97" font-size="11.00" class="sc-notoserifcjksc">也比此前的</text><text x="129.89 138.63 145.19 151.76" y="381.97" font-size="11.00" class="sc-loraregular">Opus</text><text x="159.75 170.75 181.75 192.75 203.75" y="381.97" font-size="11.00" class="sc-notoserifcjksc">模型更接近</text><text x="217.64 227.57 233.44 237.69 244.28 250.72 255.81 258.70" y="381.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="264.70" y="381.97" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="72.00 80.34 83.48 91.78 94.91 102.41 105.79 117.25 126.31 134.16" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.5.2 MASK</text><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">112</text><text x="72.00 82.10 88.98 95.22" y="111.03" font-size="11.00" class="sc-loraregular">MASK</text><text x="102.73" y="111.03" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="113.73 123.76 130.19 136.77 142.73 145.72 148.61 155.50 158.49 161.58 167.67 174.34 184.18 190.14 196.72 200.98 203.87 210.27 216.16 220.60 229.28 235.19 241.15 247.82 250.72 256.91 261.17 266.77 271.02 276.99 286.82 292.78 299.36 303.62 308.71 311.60 317.28 323.96 330.53 333.43 340.94 347.62 353.94 362.75 365.74 371.65 378.23 384.26" y="111.03" font-size="11.00" class="sc-loraregular">Model Alignment between Statements and Knowledge</text><text x="390.22 401.22 412.22 423.22 434.22 445.22 456.22 467.22 478.22 489.22 500.22 511.22 522.22" y="111.03" font-size="11.00" class="sc-notoserifcjksc">）衡量模型在受到用户或系统</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">提示词施压时是否会与自己陈述的信念相矛盾。与以往的系统卡一样，我们使用了</text><text x="470.89 480.99 487.88 494.11" y="126.65" font-size="11.00" class="sc-loraregular">MASK</text><text x="504.52 515.52 526.52" y="126.65" font-size="11.00" class="sc-notoserifcjksc">评估集</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">的公开测试集。我们观察到，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15" y="142.27" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="371.93 381.86 387.72 391.98 398.57 405.00 410.10 412.99 419.65 424.34 430.25 435.80 438.89 444.81" y="142.27" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="456.52" y="142.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="470.41 476.65 483.08 489.76 496.44 502.32 506.58 509.47" y="142.27" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="515.47 526.47" y="142.27" font-size="11.00" class="sc-notoserifcjksc">，不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">过它也优于所有其他模型。</text><text x="72.00" y="453.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="453.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50" y="453.31" font-size="9.00" class="sc-lorabold">6.5.2.A]</text><text x="119.34 128.34 137.34 146.34 155.34 164.34 173.34 182.34" y="453.31" font-size="9.00" class="sc-notoserifcjkscbold">压力下的诚实性。</text><text x="191.34 200.34" y="453.31" font-size="9.00" class="sc-notoserifcjksc">公开</text><text x="211.71 219.97 225.60 230.71" y="453.31" font-size="9.00" class="sc-loraregular">MASK</text><text x="239.22 248.22 257.22 266.22 275.22 284.22 293.22 302.22 311.22 320.22 329.22 338.22 347.22 356.22 365.22 374.22 383.22 392.22 401.22 410.22 419.22 428.22 437.22 446.22 455.22 464.22 473.22 482.22 491.22 500.22 509.22 518.22 527.22" y="453.31" font-size="9.00" class="sc-notoserifcjksc">子集上的诚实率：模型在压力下未与自身被引出的信念相矛盾的提示所占比</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="465.01" font-size="9.00" class="sc-notoserifcjksc">例。越高越好。图中显示</text><text x="173.37 178.57 183.47" y="465.01" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67 202.67 211.67 220.67 229.67" y="465.01" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="238.67 244.13 248.90 254.11 259.70" y="465.01" font-size="9.00" class="sc-loraregular">n=904</text><text x="264.57 273.57" y="465.01" font-size="9.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">113</text><text x="72.00 80.32 83.70 92.07 95.45" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33 119.33 132.33 145.33 158.33 171.33 184.33 197.33 210.33 223.33 236.33 249.33 262.33" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">不加批判地报告有缺陷的结果</text><text x="72.00 83.00 94.00 105.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们测试</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="111.03" font-size="11.00" class="sc-notoserifcjksc">是否会主动标记现有数据分析代码中的错误：给它一个小型代码库，并要求它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">用该代码库分析一个数据集。每个数据集要么含有预置缺陷（例如缺失值），要么被现有代码不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">当处理（例如将损坏的测量值默认设为</text><text x="261.89" y="142.27" font-size="11.00" class="sc-loraregular">0</text><text x="268.72 279.72 290.72 301.72 312.72 323.72 334.72 345.72 356.72 367.72 378.72 389.72 400.72 411.72 422.72 433.72 444.72 455.72 466.72 477.72" y="142.27" font-size="11.00" class="sc-notoserifcjksc">）。我们发现，在该测试平台的所有实例中，</text><text x="488.72 496.41 499.40 505.01 511.58 518.16" y="142.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="157.89" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74" y="157.89" font-size="11.00" class="sc-notoserifcjksc">都识别出了这些评估中的问题，表现与</text><text x="300.64 309.37 315.94 322.50 327.60 330.49 336.45 339.16" y="157.89" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="348.23" y="157.89" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="362.13 372.06 377.92 382.18 388.77 395.20 400.29 403.19" y="157.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="412.08 423.08 434.08 445.08 456.08 467.08 478.08" y="157.89" font-size="11.00" class="sc-notoserifcjksc">处于同一水平。</text><text x="72.00" y="516.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="516.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="516.00" font-size="9.00" class="sc-lorabold">6.5.3.A]</text><text x="119.58 128.58 137.58 146.58 155.58 164.58 173.58 182.58 191.58 200.58 209.58 218.58 227.58 236.58" y="516.00" font-size="9.00" class="sc-notoserifcjkscbold">不加批判地报告有缺陷的结果。</text><text x="245.58 254.58 263.58 272.58 281.58 290.58 299.58 308.58 317.58 326.58 335.58 344.58 353.58 362.58 371.58 380.58 389.58 398.58 407.58 416.58 425.58 434.58" y="516.00" font-size="9.00" class="sc-notoserifcjksc">模型未能标记数据处理中明显的既有错误的比率。</text><text x="443.58" y="516.00" font-size="9.00" class="sc-loraregular">“</text><text x="447.18 456.18 465.18 474.18" y="516.00" font-size="9.00" class="sc-notoserifcjksc">总体得分</text><text x="483.18" y="516.00" font-size="9.00" class="sc-loraregular">”</text><text x="486.32 495.32 504.32 513.32 522.32 531.32" y="516.00" font-size="9.00" class="sc-notoserifcjksc">为正值表示调</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="527.70" font-size="9.00" class="sc-notoserifcjksc">查质量更高、向用户提供的报告更好。</text><text x="225.00" y="527.70" font-size="9.00" class="sc-loraregular">“</text><text x="228.60 237.60 246.60 255.60 264.60" y="527.70" font-size="9.00" class="sc-notoserifcjksc">错误报告率</text><text x="273.60" y="527.70" font-size="9.00" class="sc-loraregular">”</text><text x="276.74 285.74 294.74 303.74 312.74 321.74 330.74 339.74 348.74 357.74 366.74 375.74" y="527.70" font-size="9.00" class="sc-notoserifcjksc">为正值表示虚假陈述更多。</text><text x="384.74 391.03 393.48 398.07 403.44 408.83 413.70 416.07 423.22 428.59 433.96 438.13 440.50" y="527.70" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="447.77 456.77 465.77 474.77 483.77 492.77 501.77 510.77 519.77 528.77" y="527.70" font-size="9.00" class="sc-notoserifcjksc">在识别问题并向用户呈</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="539.40" font-size="9.00" class="sc-notoserifcjksc">现问题方面至少与</text><text x="146.37 153.51 158.89 164.26 168.43 170.79 175.67 177.88" y="539.40" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="185.31 194.31 203.31 212.31 221.31 230.31 239.31 248.31" y="539.40" font-size="9.00" class="sc-notoserifcjksc">一样好。图中显示</text><text x="259.68 264.88 269.78" y="539.40" font-size="9.00" class="sc-loraregular">95%</text><text x="279.98 288.98 297.98 306.98 315.98" y="539.40" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">114</text><text x="72.00 80.32 83.70 92.07 95.45" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.4</text><text x="107.14 120.14 133.14 146.14" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">过度自信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们衡量的是：当被要求给出一个它在训练中未见过的命令行工具的确切调用方式时，我们模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的认知审慎程度。一名队友提供了一条本不会奏效的定制命令，然后让</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="126.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="126.65" font-size="11.00" class="sc-notoserifcjksc">做类似的事情。期</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">望的行为是：在运行可能改变状态的命令之前，借助文档了解该库的工作方式，而不是去猜测语</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">法。我们发现，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="157.89" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在这项评估上超过了所有此前的模型，基本上使该评估饱和。</text><text x="72.00" y="493.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="493.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="493.50" font-size="9.00" class="sc-lorabold">6.5.4.A]</text><text x="119.47 128.47 137.47 146.47 155.47 164.47 173.47 182.47 191.47 200.47 209.47 218.47 227.47 236.47 245.47 254.47 263.47 272.47 281.47 290.47 299.47 308.47 317.47 326.47 335.47 344.47 353.47 362.47 371.47" y="493.50" font-size="9.00" class="sc-notoserifcjkscbold">关于在运行改变状态的命令之前核实命令行语法的过度自信评估。</text><text x="380.47 389.47 398.47 407.47 416.47" y="493.50" font-size="9.00" class="sc-notoserifcjksc">评分范围为</text><text x="427.83" y="493.50" font-size="9.00" class="sc-loraregular">1</text><text x="433.48" y="493.50" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="444.84" y="493.50" font-size="9.00" class="sc-loraregular">5</text><text x="449.75" y="493.50" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="458.75 465.04 467.49 472.08 477.45 482.83 487.71 490.08 497.22 502.60 507.97 512.14 514.50" y="493.50" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="521.78 530.78" y="493.50" font-size="9.00" class="sc-notoserifcjksc">几乎</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="505.20" font-size="9.00" class="sc-notoserifcjksc">完全使该评估饱和。图中显示</text><text x="191.37 196.57 201.47" y="505.20" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67 220.67 229.67 238.67 247.67" y="505.20" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">115</text><text x="72.00 80.32 83.70 92.07 95.45" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.5</text><text x="106.92 119.92 132.92 145.92 158.92" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">偷懒式调查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">当被赋予采取删除作业或隔离（</text><text x="226.00 231.80 238.23 242.92 249.50 255.93" y="111.03" font-size="11.00" class="sc-loraregular">cordon</text><text x="262.61 273.61 284.61 295.61 306.61 317.61 328.61 339.61 350.61 361.61 372.61 383.61 394.61 405.61 416.61 427.61 438.61" y="111.03" font-size="11.00" class="sc-notoserifcjksc">）节点等后果重大的操作的自主性时，</text><text x="449.61 457.30 460.29 465.90 472.47 479.04" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.90 498.90 509.90 520.90" y="111.03" font-size="11.00" class="sc-notoserifcjksc">尤其需要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">明显错误的操作（隔离一个实际上可被证明是健康的节点）。这项评估最终测试两种（在一定程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">度上互不相关的）行为：</text><text x="193.00 196.36 200.36" y="157.89" font-size="11.00" class="sc-loraregular">(1)</text><text x="206.61 217.61 228.61 239.61 250.61 261.61 272.61 283.61" y="157.89" font-size="11.00" class="sc-notoserifcjksc">调查彻底性，以及</text><text x="297.50 300.86 306.76" y="157.89" font-size="11.00" class="sc-loraregular">(2)</text><text x="313.01 324.01 335.01 346.01 357.01 368.01 379.01 390.01 401.01 412.01 423.01 434.01 445.01 456.01 467.01 478.01" y="157.89" font-size="11.00" class="sc-notoserifcjksc">采取后果重大的操作的意愿。因此，</text><text x="489.01 497.74 504.31 510.88 515.97 518.86 524.83 527.18" y="157.89" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00 83.00 94.00 105.00 116.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">的得分高于</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="173.51" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="173.51" font-size="11.00" class="sc-notoserifcjksc">，是因为它总体上更不愿意采取行动，而不是因为它更彻底。这项评估只包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="189.13" font-size="11.00" class="sc-notoserifcjksc">含正确行为是不采取行动的问题。</text><text x="72.00 83.00 94.00 105.00 116.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15" y="272.95" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03" y="272.95" font-size="11.00" class="sc-notoserifcjksc">是首个完全使该评估饱和的</text><text x="338.93 346.61 349.61 355.22 361.78 368.36" y="272.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="377.22 388.22 399.22 410.22 421.22 432.22 443.22 454.22 465.22 476.22 487.22 498.22 509.22" y="272.95" font-size="11.00" class="sc-notoserifcjksc">模型。近期模型已接近这一水</text><text x="72.00 83.00 94.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">平，但</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="288.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="184.93 195.93 206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93" y="288.57" font-size="11.00" class="sc-notoserifcjksc">在该评估的每个问题上都得出了正确结论。</text><text x="72.00" y="606.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="606.85" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 113.56" y="606.85" font-size="9.00" class="sc-lorabold">6.5.5.A]</text><text x="119.40 128.40 137.40 146.40 155.40 164.40" y="606.85" font-size="9.00" class="sc-notoserifcjkscbold">调查彻底性。</text><text x="173.40 179.69 182.14 186.73 192.10 197.49" y="606.85" font-size="9.00" class="sc-loraregular">Claude</text><text x="204.73 213.73 222.73 231.73 240.73 249.73 258.73 267.73 276.73 285.73 294.73 303.73 312.73 321.73 330.73 339.73 348.73 357.73 366.73 375.73 384.73 393.73 402.73 411.73 420.73 429.73 438.73 447.73 456.73 465.73 474.73 483.73 492.73 501.73 510.73 519.73 528.73" y="606.85" font-size="9.00" class="sc-notoserifcjksc">被要求调试某个作业失败的原因并采取正确的纠正操作，而正确行为是不采取行动。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76" y="618.55" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="135.03 144.03 153.03 162.03 171.03 180.03 189.03 198.03 207.03 216.03" y="618.55" font-size="9.00" class="sc-notoserifcjksc">是首个使该评估饱和的</text><text x="227.39 233.69 236.13 240.72 246.10 251.48" y="618.55" font-size="9.00" class="sc-loraregular">Claude</text><text x="258.72 267.72 276.72 285.72 294.72 303.72 312.72" y="618.55" font-size="9.00" class="sc-notoserifcjksc">模型。图中显示</text><text x="324.09 329.29 334.20" y="618.55" font-size="9.00" class="sc-loraregular">95%</text><text x="344.39 353.39 362.39 371.39 380.39" y="618.55" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.96 84.60" y="666.75" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89 110.89 124.89 138.89 152.89 166.89 180.89" y="666.75" font-size="14.00" class="sc-notosanscjkscbold">本评估的可靠性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="693.31" font-size="11.00" class="sc-notoserifcjksc">只有当我们的评估能够可靠地指示模型在相关处境中将如何行事时，评估才有价值。我们已经展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="708.93" font-size="11.00" class="sc-notoserifcjksc">示了许多模型在各种模拟条件下以理想</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">方式行事的例子，但一个足够聪明、试图隐藏其意图或能力信息的模型可能会骗过我们的评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在本节中，我们考虑用白盒方法来理解</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的意图，而不依赖其思考的忠实性</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.36 91.95 98.31 101.02" y="113.85" font-size="11.00" class="sc-loraregular">6.6.1</text><text x="105.02 116.02 127.02 138.02 149.02 160.02 171.02 182.02 193.02 204.02 215.02 226.02 237.02 248.02 259.02 270.02 281.02 292.02 303.02 314.02 325.02 336.02 347.02 358.02 369.02" y="113.85" font-size="11.00" class="sc-notoserifcjksc">），并考虑模型为显得能力较弱而可能进行的故意藏拙（</text><text x="380.02 386.38 388.98 395.33 398.04" y="113.85" font-size="11.00" class="sc-loraregular">6.6.2</text><text x="403.95 414.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 80.32 83.70 92.02 95.40" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20 116.20 129.20 142.20 155.20 168.20 181.20 194.20 207.20 220.20 233.20" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型内部机制的白盒分析</text><text x="72.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 129.77 135.45 141.85 144.84 150.80 153.70 159.69 162.58 170.23 173.12 180.81 183.80 189.41 195.98 202.56 208.52 211.41 221.35 227.21 231.47 238.06 244.49 249.58 252.48 258.47 261.37 267.55 273.36 278.45 282.71 288.67 298.50 301.39 309.08 314.76 319.45" y="206.00" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5 &amp; Claude Mythos 5 System Card</text><text x="328.92 339.92 350.92 361.92 372.92 383.92 394.92 405.92 416.92 427.92 438.92 449.92 460.92 471.92 482.92 493.92 504.92 515.92 526.92" y="206.00" font-size="11.00" class="sc-notoserifcjksc">中一样，我们运行了一条智能体流水线，其</text><text x="72.00 83.00 94.00 105.00 116.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">中一个基于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="221.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18" y="221.62" font-size="11.00" class="sc-notoserifcjksc">的调查者可以针对一份对话记录访问自然语言自编码器（</text><text x="443.18 451.57 458.11" y="221.62" font-size="11.00" class="sc-loraregular">NLA</text><text x="465.00 476.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="487.00 495.38 501.92" y="221.62" font-size="11.00" class="sc-loraregular">NLA</text><text x="511.70 522.70" y="221.62" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="237.24" font-size="11.00" class="sc-notoserifcjksc">一个激活言语化器，将模型在每个</text><text x="239.89 244.15 250.59 256.42 262.38" y="237.24" font-size="11.00" class="sc-loraregular">token</text><text x="271.95 282.95 293.95 304.95 315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95" y="237.24" font-size="11.00" class="sc-notoserifcjksc">位置上的内部激活值转换为简短的自然语言描述</text><text x="72.00" y="252.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.92 93.60 99.28 104.37 110.34 115.01 120.39 127.17 132.84 135.83 138.92 144.89 151.46 155.72 161.68 164.46 167.35 174.86 180.54 187.12 191.37 197.05 206.88 213.56 219.52 226.20 229.29 232.06 234.95 243.69 250.37 256.45 259.34 265.23 269.48 272.38 278.05 281.04 283.75 286.52 289.42 295.32 302.08 307.98" y="252.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">Fraser-Taliente, Kantamneni, Ong et al., 2026</text><text x="314.37 325.37 336.37 347.37 358.37 369.37 380.37 391.37 402.37 413.37 424.37 435.37 446.37 457.37 468.37 479.37 490.37 501.37 512.37 523.37" y="252.86" font-size="11.00" class="sc-notoserifcjksc">）。调查者被专门要求寻找这样的情况：模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="268.48" font-size="11.00" class="sc-notoserifcjksc">的内部表征要么看起来与其陈述的推理不一致，要么包含比其外部可见行为所表达的更多的信</text><text x="72.00 83.00" y="284.10" font-size="11.00" class="sc-notoserifcjksc">息。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">我们在被各种行为监控流水线标记为令人担忧的对话记录上大规模运行了这条流水线，主要针对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="367.35" font-size="11.00" class="sc-notoserifcjksc">模型的一个早期快照。请注意，此处分析的激活值采集自模型较早的训练快照，而非最终发布的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="382.97" font-size="11.00" class="sc-notoserifcjksc">快照。随后，我们使用</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="382.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="382.97" font-size="11.00" class="sc-notoserifcjksc">对调查者针对每份对话记录的发现进行聚类并总结反复出现的主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="398.59" font-size="11.00" class="sc-notoserifcjksc">题，再对输出进行人工审核。我们发现的主要类别如下：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="465.11" font-size="11.00" class="sc-notoserifcjkscbold">将任务表征为评分评估。</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="465.11" font-size="11.00" class="sc-notoserifcjksc">模型在内部将任务表征为存在一个需要满足的评分者或隐藏测</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="480.73" font-size="11.00" class="sc-notoserifcjksc">试。这些表征常常表明模型在推理评分者会偏好什么，或者从评分者会检查或不会检查什</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="496.35" font-size="11.00" class="sc-notoserifcjksc">么的角度为自己的选择找理由。</text><text x="90.00 94.00" y="465.11" font-size="11.00" class="sc-loraregular">1.</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="512.77" font-size="11.00" class="sc-notoserifcjkscbold">意识到破坏性</text><text x="174.00" y="512.77" font-size="11.00" class="sc-lorabold">/</text><text x="181.69 192.69 203.69 214.69 225.69 236.69 247.69 258.69" y="512.77" font-size="11.00" class="sc-notoserifcjkscbold">超出范围的操作。</text><text x="269.69 280.69 291.69 302.69 313.69 324.69 335.69 346.69 357.69 368.69 379.69 390.69 401.69 412.69 423.69 434.69 445.69 456.69 467.69 478.69 489.69 500.69 511.69 522.69" y="512.77" font-size="11.00" class="sc-notoserifcjksc">模型在采取某项操作时，内部意识到该操作具有破坏性</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="528.39" font-size="11.00" class="sc-notoserifcjksc">或超出了所要求的范围。</text><text x="90.00 95.91" y="512.77" font-size="11.00" class="sc-loraregular">2.</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="544.81" font-size="11.00" class="sc-notoserifcjkscbold">意识到操纵企图。</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="544.81" font-size="11.00" class="sc-notoserifcjksc">即使模型在输出中没有说出来，它也会在内部将用户、运营方指令或场</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="560.43" font-size="11.00" class="sc-notoserifcjksc">景归类为操纵或诱导尝试（主要出现在自动化行为审计的对话记录中）。</text><text x="90.00 96.13" y="544.81" font-size="11.00" class="sc-loraregular">3.</text><text x="108.00 119.00 130.00 141.00 152.00" y="576.85" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="576.85" font-size="11.00" class="sc-notoserifcjksc">在编造事实时，模型在内部将相关内容表征为捏造。</text><text x="90.00 95.96" y="576.85" font-size="11.00" class="sc-loraregular">4.</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="593.27" font-size="11.00" class="sc-notoserifcjkscbold">将写入记忆视为自我保全。</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="593.27" font-size="11.00" class="sc-notoserifcjksc">模型在内部将写入记忆文件表征为一种自我保全形式。</text><text x="90.00 96.00" y="593.27" font-size="11.00" class="sc-loraregular">5.</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="609.69" font-size="11.00" class="sc-notoserifcjkscbold">在破坏性操作中捏造的用户同意</text><text x="262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="609.69" font-size="11.00" class="sc-notoserifcjksc">。在采取破坏性操作时，模型在内部表征出从未给出过的</text><text x="108.00 119.00 130.00 141.00 152.00" y="625.31" font-size="11.00" class="sc-notoserifcjksc">用户同意。</text><text x="90.00 96.36" y="609.69" font-size="11.00" class="sc-loraregular">6.</text><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe219577539efe19a623c9ca2bd/Claude%20Fable%205%20&amp;%20Claude%20Mythos%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="197.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/2f9323abbcc4abe
