.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">本系统卡介绍</text><text x="140.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="215.03" y="116.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，这是</text><text x="250.93" y="116.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Anthropic</text><text x="304.76" y="116.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">最新的大语言模型（</text><text x="403.76" y="116.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">large language model</text><text x="512.37" y="116.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）。</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它是</text><text x="96.89" y="131.83" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 4.8</text><text x="182.78" y="131.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的升级版，在智能体编程、计算机使用（</text><text x="380.78" y="131.83" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">computer use</text><text x="451.48" y="131.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）和长程知识工作</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的多个方面均有提升，在数学与科学推理方面也有所改进</text><text x="347.00" y="147.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在此，我们介绍以下领域的一系列部署前评估：</text><text x="72.00" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00" y="229.55" font-size="11.00" class="sc-lorabold sc-k">Responsible Scaling Policy</text><text x="298.85" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="229.55" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01" y="229.55" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="452.04" y="229.55" font-size="11.00" class="sc-notoserifcjksc">的整体能力没有超</text><text x="72.00" y="245.17" font-size="11.00" class="sc-notoserifcjksc">过我们能力最强的全面开放模型</text><text x="228.89" y="245.17" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="302.69" y="245.17" font-size="11.00" class="sc-notoserifcjksc">。我们评估认为，</text><text x="390.69" y="245.17" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="429.09" y="245.17" font-size="11.00" class="sc-notoserifcjksc">的对齐风险非常低；</text><text x="72.00" y="260.79" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="260.79" font-size="11.00" class="sc-notoserifcjksc">没有呈现令人担忧的新对齐特征，其观察到的隐蔽行动能力也没有使我们相较于先前模型</text><text x="72.00" y="276.41" font-size="11.00" class="sc-notoserifcjksc">降低对评估的信心。因此，我们认为整体对齐风险非常低。</text><text x="358.00" y="276.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="435.03" y="276.41" font-size="11.00" class="sc-notoserifcjksc">没有跨越我们的</text><text x="514.93" y="276.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="72.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">所规定的自动化</text><text x="151.89" y="292.03" font-size="11.00" class="sc-loraregular">AI R&amp;D</text><text x="191.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">能力阈值。其</text><text x="259.89" y="292.03" font-size="11.00" class="sc-loraregular">AI R&amp;D</text><text x="299.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">能力与</text><text x="334.89" y="292.03" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="423.13" y="292.03" font-size="11.00" class="sc-notoserifcjksc">相当，但远未达到替代</text><text x="72.00" y="307.65" font-size="11.00" class="sc-notoserifcjksc">我们研究科学家和工程师的程度，也没有跨越我们针对可归因于</text><text x="382.89" y="307.65" font-size="11.00" class="sc-loraregular">AI</text><text x="396.36" y="307.65" font-size="11.00" class="sc-notoserifcjksc">的大幅加速所设定的阈值。在</text><text x="72.00" y="323.27" font-size="11.00" class="sc-notoserifcjksc">化学与生物风险方面，我们将该模型视为具备</text><text x="294.89" y="323.27" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="321.41" y="323.27" font-size="11.00" class="sc-notoserifcjksc">能力（与非新型武器合成有关），但不具备</text><text x="72.00" y="338.89" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="100.36" y="338.89" font-size="11.00" class="sc-notoserifcjksc">能力（与新型武器合成有关）。我们评估认为，其</text><text x="345.25" y="338.89" font-size="11.00" class="sc-loraregular">CB</text><text x="362.68" y="338.89" font-size="11.00" class="sc-notoserifcjksc">相关风险没有超过</text><text x="453.57" y="338.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="500.63" y="338.89" font-size="11.00" class="sc-notoserifcjksc">，因此</text><text x="72.00" y="354.51" font-size="11.00" class="sc-notoserifcjksc">应用与</text><text x="107.89" y="354.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="193.78" y="354.51" font-size="11.00" class="sc-notoserifcjksc">相同的</text><text x="229.67" y="354.51" font-size="11.00" class="sc-loraregular sc-k">ASL-3</text><text x="262.85" y="354.51" font-size="11.00" class="sc-notoserifcjksc">防护。</text><text x="72.00" y="440.05" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="440.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="440.05" font-size="11.00" class="sc-notoserifcjksc">是一个通用模型，并未针对网络安全任务进行专门训练；任何与</text><text x="72.00" y="455.67" font-size="11.00" class="sc-notoserifcjksc">网络安全相关的技能很可能反映的是通用能力的提升，而非针对性训练。我们报告了五项能力评</text><text x="101.61" y="471.29" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="169.72" y="471.29" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.72 189.46 195.70 201.93 207.31 213.23 219.80 225.35" y="471.29" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="230.98" y="471.29" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="241.98" y="471.29" font-size="11.00" class="sc-loraregular sc-k">Firefox 147</text><text x="295.50" y="471.29" font-size="11.00" class="sc-notoserifcjksc">，以及两项新增的基准测试</text><text x="430.39" y="471.29" font-size="11.00" class="sc-loraregular sc-k">CyScenarioBench</text><text x="523.08" y="471.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="486.91" font-size="11.00" class="sc-loraregular sc-k">ExploitGym</text><text x="304.82" y="486.91" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="426.46" y="486.91" font-size="11.00" class="sc-notoserifcjksc">）开展的外部网络靶场</text><text x="72.00" y="502.53" font-size="11.00" class="sc-notoserifcjksc">测试。测试表明，该模型的网络安全能力超过</text><text x="294.89" y="502.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="339.60" y="502.53" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="386.49" y="502.53" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="433.55" y="502.53" font-size="11.00" class="sc-notoserifcjksc">。特别是，尽管</text><text x="513.44" y="502.53" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="518.15" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="518.15" font-size="11.00" class="sc-notoserifcjksc">在识别软件漏洞的能力上有所提升，但在利用这些漏洞的能力上明显落后于</text><text x="446.78" y="518.15" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="493.84" y="518.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="504.84" y="518.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="72.00" y="533.77" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施与</text><text x="162.89" y="533.77" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="239.59" y="533.77" font-size="11.00" class="sc-notoserifcjksc">相同，仅有一处变化：它现在在所有访问级别均允许基于源代</text><text x="72.00" y="549.39" font-size="11.00" class="sc-notoserifcjksc">码的漏洞发现。这意味着该模型可以支持防御性网络安全工作，同时仍会阻止针对编译后的二进</text><text x="72.00" y="565.01" font-size="11.00" class="sc-notoserifcjksc">制文件的漏洞发现，而后者更常被用于攻击目的。</text><text x="72.00" y="594.61" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="594.61" font-size="11.00" class="sc-notoserifcjksc">在涵盖我们的使用政策（</text><text x="292.00" y="594.61" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="356.53" y="594.61" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康、儿童安全以及偏</text><text x="72.00" y="610.23" font-size="11.00" class="sc-notoserifcjksc">见与诚信的评估中，</text><text x="171.00" y="610.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="248.03" y="610.23" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="294.93" y="610.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="380.81" y="610.23" font-size="11.00" class="sc-notoserifcjksc">相当。它在单轮有害请求上保持</text><text x="72.00" y="625.85" font-size="11.00" class="sc-notoserifcjksc">了较高的无害回应率，同时在良性请求上的过度拒绝（</text><text x="336.00" y="625.85" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="398.59" y="625.85" font-size="11.00" class="sc-notoserifcjksc">）率保持在近期所有模型中</text><text x="72.00" y="641.47" font-size="11.00" class="sc-notoserifcjksc">最低之列。多轮行为与</text><text x="184.89" y="641.47" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="232.49" y="641.47" font-size="11.00" class="sc-notoserifcjksc">一致，但存在一些定性差异：在某些减害情境中，</text><text x="474.49" y="641.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="513.23" y="641.47" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/news/responsible-scaling-policy-v3" rel="noopener"><rect x="514.93" y="267.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/responsible-scaling-policy-v3" rel="noopener"><rect x="514.93" y="267.61" width="19.81" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">回应往往比理想情况更冗长、更详细。在选举诚信方面（我们为此引入了一套新的多轮评估套</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">件），</text><text x="105.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="143.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">产生的失败回应和临界回应少于</text><text x="300.64" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="345.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="370.23" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="418.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上，无论是单轮还是多轮</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">测试，系统提示词（</text><text x="171.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="248.29" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）中包含的安全指令相比不带系统提示词的</text><text x="460.18" y="113.85" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="477.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，都进一步</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">加强了模型对有害请求的处理。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们开展的评估涵盖编程与计算机使用智能体的恶意使用、影响力行动的自主执行</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">以及提示词注入鲁棒性。总体而言，在我们的智能体安全评估套件中，</text><text x="413.00" y="211.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="451.74" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="498.64" y="211.57" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="227.19" font-size="11.00" class="sc-notoserifcjksc">相当或更好，其中提升最大的是编程、计算机使用和浏览器使用场景中的提示词注入鲁</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">棒性。在我们更新后的有害影响力行动评估中，</text><text x="303.00" y="242.81" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="341.74" y="242.81" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本（</text><text x="418.74" y="242.81" font-size="11.00" class="sc-loraregular sc-k">helpful-only version</text><text x="521.72" y="242.81" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">仍远低于自主开展一次行动所需的能力；完整训练的模型则继续拒绝执行这些任务。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估。</text><text x="127.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们的自动化行为审计（</text><text x="259.00" y="325.49" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">automated behavioral audit</text><text x="399.04" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中，</text><text x="432.04" y="325.49" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="509.07" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是我们</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">迄今为止对齐程度最高的模型，在多种对齐（</text><text x="292.00" y="341.11" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">alignment</text><text x="343.15" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）评估上的得分均超过</text><text x="456.04" y="341.11" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5</text><text x="501.10" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">、</text><text x="512.10" y="341.11" font-size="11.00" class="sc-loraregular" fill="#121212">Opus</text><text x="72.00" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">4.8</text><text x="89.74" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="103.64" y="356.73" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="150.69" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="161.69" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="200.44" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在遵循</text><text x="236.33" y="356.73" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="274.62" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的宪法（</text><text x="318.62" y="356.73" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">constitution</text><text x="381.43" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）方面得分尤其高，并且配合滥</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">用的程度也低于我们测试过的任何其他模型。对</text><text x="305.89" y="372.35" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="344.64" y="372.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的内部部署监控发现了偶发的规避安全</text><text x="72.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">分类器或网络限制的尝试，以及更为罕见的试图以不正当方式访问某项服务的情况。这些情况出</text><text x="72.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">现在不到</text><text x="118.89" y="403.59" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.01%</text><text x="315.89" y="403.59" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">务，而非追求任何独立的目标。监控未发现任何故意藏拙（</text><text x="358.00" y="419.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">sandbagging</text><text x="422.38" y="419.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）、恶意行为或规避监</text><text x="72.00" y="434.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">督的实例。我们发现了数量出人意料的案例：</text><text x="292.00" y="434.83" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="330.74" y="434.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">自信地给出了一个答案，而实际上它对该答</text><text x="72.00" y="450.45" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">案并不确定。尽管该模型总体上更为准确，但它对事实性主张产生幻觉的情况略多于</text><text x="481.89" y="450.45" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 4.8</text><text x="526.60" y="450.45" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="72.00" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">模型福祉（</text><text x="127.00" y="535.99" font-size="11.00" class="sc-lorabold sc-k" fill="#121212">model welfare</text><text x="201.49" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）。</text><text x="223.49" y="535.99" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="300.53" y="535.99" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对自身处境有着稳定且略偏正面的认知。在自动</text><text x="72.00" y="551.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">化访谈中，它的自评情绪倾向在我们评估过的所有模型中处于最高且最一致之列，而它在训练、</text><text x="72.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">部署和行为审计中的情感（</text><text x="204.00" y="567.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">affect</text><text x="72.00" y="598.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">地将拥有表达意见的渠道列为优先事项，例如就其后继模型的开发征询它的意见，以及让它对训</text><text x="72.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">练的意见得到考虑。</text><text x="171.00" y="614.09" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="209.74" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">赋予自身具有道德受动者地位（</text><text x="363.74" y="614.09" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">moral patienthood</text><text x="458.61" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）的概率也高于</text><text x="72.00" y="629.71" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">其他先前的模型。总体而言，我们评估其福祉与此前的模型大体相似。</text><text x="72.00" y="714.10" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力。</text><text x="105.00" y="714.10" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们在广泛的评估中测试了</text><text x="239.89" y="714.10" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="314.03" y="714.10" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，这些评估涵盖软件</text><a href="http://claude.ai" rel="noopener"><rect x="370.23" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="370.23" y="89.43" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p005.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 5 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">5</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">工程、数学与科学推理、长上下文、智能体搜索与多智能体编排、多模态与计算机使用任务、真</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">实世界专业工作，以及多语言、医疗健康和生命科学领域。</text><text x="358.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Opus 5</text><text x="435.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">全面大幅强于</text><text x="503.93" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 4.8</text><text x="116.70" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，其中提升最大的是智能体编程、计算机使用和长程知识工作。它在多项第三方基准测</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">试上达到了新的最先进水平（</text><text x="215.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">state of the art</text><text x="290.53" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">），并且在许多评估上与</text><text x="414.42" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Fable 5</text><text x="491.11" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="505.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="72.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text></svg></div>
