ext x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="245.17" font-size="11.00" class="sc-notoserifcjksc">过我们能力最强的全面开放模型</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 272.77 278.45 284.85 287.84 293.80 296.70" y="245.17" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="302.69 313.69 324.69 335.69 346.69 357.69 368.69 379.69" y="245.17" font-size="11.00" class="sc-notoserifcjksc">。我们评估认为，</text><text x="390.69 396.28 401.96 408.36 411.35 417.31 420.21" y="245.17" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="429.09 440.09 451.09 462.09 473.09 484.09 495.09 506.09 517.09" y="245.17" font-size="11.00" class="sc-notoserifcjksc">的对齐风险非常低；</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="260.79" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74 297.74 308.74 319.74 330.74 341.74 352.74 363.74 374.74 385.74 396.74 407.74 418.74 429.74 440.74 451.74 462.74 473.74 484.74 495.74 506.74 517.74 528.74" y="260.79" font-size="11.00" class="sc-notoserifcjksc">没有呈现令人担忧的新对齐特征，其观察到的隐蔽行动能力也没有使我们相较于先前模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="276.41" font-size="11.00" class="sc-notoserifcjksc">降低对评估的信心。因此，我们认为整体对齐风险非常低。</text><text x="358.00 365.69 368.68 374.29 380.86 387.44 393.40 396.29 405.02 411.59 418.16 423.25 426.14" y="276.41" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="435.03 446.03 457.03 468.03 479.03 490.03 501.03" y="276.41" font-size="11.00" class="sc-notoserifcjksc">没有跨越我们的</text><text x="514.93 521.83 528.07" y="276.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">所规定的自动化</text><text x="151.89 158.78 162.46 165.36 172.26 179.91" y="292.03" font-size="11.00" class="sc-loraregular">AI R&amp;D</text><text x="191.00 202.00 213.00 224.00 235.00 246.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">能力阈值。其</text><text x="259.89 266.78 270.46 273.35 280.26 287.91" y="292.03" font-size="11.00" class="sc-loraregular">AI R&amp;D</text><text x="299.00 310.00 321.00" y="292.03" font-size="11.00" class="sc-notoserifcjksc">能力与</text><text x="334.89 342.58 345.57 351.18 357.75 364.32 370.29 373.18 383.11 388.98 393.23 399.82 406.26 411.35 414.24" y="292.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="423.13 434.13 445.13 456.13 467.13 478.13 489.13 500.13 511.13 522.13" y="292.03" font-size="11.00" class="sc-notoserifcjksc">相当，但远未达到替代</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="307.65" font-size="11.00" class="sc-notoserifcjksc">我们研究科学家和工程师的程度，也没有跨越我们针对可归因于</text><text x="382.89 389.78" y="307.65" font-size="11.00" class="sc-loraregular">AI</text><text x="396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="307.65" font-size="11.00" class="sc-notoserifcjksc">的大幅加速所设定的阈值。在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="323.27" font-size="11.00" class="sc-notoserifcjksc">化学与生物风险方面，我们将该模型视为具备</text><text x="294.89 302.58 309.42 314.52" y="323.27" font-size="11.00" class="sc-loraregular">CB-1</text><text x="321.41 332.41 343.41 354.41 365.41 376.41 387.41 398.41 409.41 420.41 431.41 442.41 453.41 464.41 475.41 486.41 497.41 508.41 519.41" y="323.27" font-size="11.00" class="sc-notoserifcjksc">能力（与非新型武器合成有关），但不具备</text><text x="72.00 79.69 86.53 91.56" y="338.89" font-size="11.00" class="sc-loraregular">CB-2</text><text x="100.36 111.36 122.36 133.36 144.36 155.36 166.36 177.36 188.36 199.36 210.36 221.36 232.36 243.36 254.36 265.36 276.36 287.36 298.36 309.36 320.36 331.36" y="338.89" font-size="11.00" class="sc-notoserifcjksc">能力（与新型武器合成有关）。我们评估认为，其</text><text x="345.25 352.94" y="338.89" font-size="11.00" class="sc-loraregular">CB</text><text x="362.68 373.68 384.68 395.68 406.68 417.68 428.68 439.68" y="338.89" font-size="11.00" class="sc-notoserifcjksc">相关风险没有超过</text><text x="453.57 463.50 469.36 473.62 480.21 486.64 491.74 494.63" y="338.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="500.63 511.63 522.63" y="338.89" font-size="11.00" class="sc-notoserifcjksc">，因此</text><text x="72.00 83.00 94.00" y="354.51" font-size="11.00" class="sc-notoserifcjksc">应用与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="354.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78 204.78 215.78" y="354.51" font-size="11.00" class="sc-notoserifcjksc">相同的</text><text x="229.67 236.56 242.80 248.71 253.83" y="354.51" font-size="11.00" class="sc-loraregular">ASL-3</text><text x="262.85 273.85 284.85" y="354.51" font-size="11.00" class="sc-notoserifcjksc">防护。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="440.05" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="440.05" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="440.05" font-size="11.00" class="sc-notoserifcjksc">是一个通用模型，并未针对网络安全任务进行专门训练；任何与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="455.67" font-size="11.00" class="sc-notoserifcjksc">网络安全相关的技能很可能反映的是通用能力的提升，而非针对性训练。我们报告了五项能力评</text><text x="101.61 108.45 114.28 120.85 123.84 130.28 133.54 137.80 144.64 150.61 157.28 163.14" y="471.29" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="169.72" y="471.29" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.72 189.46 195.70 201.93 207.31 213.23 219.80 225.35" y="471.29" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="230.98" y="471.29" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="241.98 247.96 251.05 255.73 261.70 265.36 271.74 277.57 280.46 284.47 290.43" y="471.29" font-size="11.00" class="sc-loraregular">Firefox 147</text><text x="295.50 306.50 317.50 328.50 339.50 350.50 361.50 372.50 383.50 394.50 405.50 416.50" y="471.29" font-size="11.00" class="sc-notoserifcjksc">，以及两项新增的基准测试</text><text x="430.39 438.08 443.89 450.12 455.92 461.88 468.56 474.24 479.00 482.09 488.26 495.10 501.07 507.74 513.59" y="471.29" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="523.08" y="471.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 116.56 122.37" y="486.91" font-size="11.00" class="sc-loraregular">ExploitGym</text><text x="304.82 313.09 320.60 323.49 330.38 334.06 336.96 343.19 349.10 354.95 361.52 366.28 369.55 373.83 379.64 382.53 386.13 392.80 397.90 402.15 405.42 409.68 416.24 420.50" y="486.91" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="486.91" font-size="11.00" class="sc-notoserifcjksc">）开展的外部网络靶场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="502.53" font-size="11.00" class="sc-notoserifcjksc">测试。测试表明，该模型的网络安全能力超过</text><text x="294.89 303.63 310.19 316.76 321.85 324.75 330.71 333.42" y="502.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="339.60 350.60 361.60 372.60" y="502.53" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="386.49 396.42 402.29 406.54 413.13 419.57 424.66 427.55" y="502.53" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="433.55 444.55 455.55 466.55 477.55 488.55 499.55" y="502.53" font-size="11.00" class="sc-notoserifcjksc">。特别是，尽管</text><text x="513.44 522.18 528.74 535.31" y="502.53" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="518.15" font-size="11.00" class="sc-loraregular">5</text><text x="80.89 91.89 102.89 113.89 124.89 135.89 146.89 157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89" y="518.15" font-size="11.00" class="sc-notoserifcjksc">在识别软件漏洞的能力上有所提升，但在利用这些漏洞的能力上明显落后于</text><text x="446.78 456.71 462.58 466.83 473.42 479.86 484.95 487.84" y="518.15" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="493.84" y="518.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="504.84 513.57 520.14 526.71 531.80 534.69" y="518.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="533.77" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 206.77 212.45 218.85 221.84 227.80 230.70" y="533.77" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="239.59 250.59 261.59 272.59 283.59 294.59 305.59 316.59 327.59 338.59 349.59 360.59 371.59 382.59 393.59 404.59 415.59 426.59 437.59 448.59 459.59 470.59 481.59 492.59 503.59 514.59 525.59" y="533.77" font-size="11.00" class="sc-notoserifcjksc">相同，仅有一处变化：它现在在所有访问级别均允许基于源代</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="549.39" font-size="11.00" class="sc-notoserifcjksc">码的漏洞发现。这意味着该模型可以支持防御性网络安全工作，同时仍会阻止针对编译后的二进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="565.01" font-size="11.00" class="sc-notoserifcjksc">制文件的漏洞发现，而后者更常被用于攻击目的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="594.61" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="594.61" font-size="11.00" class="sc-notoserifcjksc">在涵盖我们的使用政策（</text><text x="292.00 300.20 305.29 310.96 316.99 322.95 325.85 332.40 338.84 341.83 344.92 350.72" y="594.61" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="594.61" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康、儿童安全以及偏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="610.23" font-size="11.00" class="sc-notoserifcjksc">见与诚信的评估中，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15" y="610.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="248.03 259.03 270.03 281.03" y="610.23" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="294.93 302.61 305.61 311.22 317.78 324.36 330.32 333.22 341.95 348.52 355.08 360.18 363.07 369.03 371.74" y="610.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="380.81 391.81 402.81 413.81 424.81 435.81 446.81 457.81 468.81 479.81 490.81 501.81 512.81 523.81" y="610.23" font-size="11.00" class="sc-notoserifcjksc">相当。它在单轮有害请求上保持</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="625.85" font-size="11.00" class="sc-notoserifcjksc">了较高的无害回应率，同时在良性请求上的过度拒绝（</text><text x="336.00 342.38 347.88 353.84 358.52 363.90 368.58 374.54 378.26 384.83 389.92 395.60" y="625.85" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="625.85" font-size="11.00" class="sc-notoserifcjksc">）率保持在近期所有模型中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="641.47" font-size="11.00" class="sc-notoserifcjksc">最低之列。多轮行为与</text><text x="184.89 193.63 200.19 206.76 211.85 214.75 220.71 223.42" y="641.47" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49" y="641.47" font-size="11.00" class="sc-notoserifcjksc">一致，但存在一些定性差异：在某些减害情境中，</text><text x="474.49 483.22 489.79 496.36 501.45 504.34" y="641.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="513.23" y="641.47" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 136.00 144.00 152.00 160.00 168.00 176.00 184.00 192.00 200.00 208.00 216.00 224.00 232.00 237.10 239.38 243.88 248.74 253.70 258.13 259.92 267.92 275.92 283.92 291.92 299.92 307.92 315.92 323.92 331.92 339.92 347.92 355.92 363.92 371.92 379.92 387.92 395.92 403.92 411.92 419.92 427.92 435.92 437.71 442.82 445.09 449.59 454.45 459.41 463.84 465.63 473.63 481.63" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/news/responsible-scaling-policy-v3" rel="noopener"><rect x="514.93" y="267.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/responsible-scaling-policy-v3" rel="noopener"><rect x="514.93" y="267.61" width="19.81" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">回应往往比理想情况更冗长、更详细。在选举诚信方面（我们为此引入了一套新的多轮评估套</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">件），</text><text x="105.00 113.73 120.30 126.87 131.96 134.85" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">产生的失败回应和临界回应少于</text><text x="300.64 309.37 315.94 322.50 327.60 330.49 336.45 339.16" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="345.34 356.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="370.23 376.08 379.08 384.69 391.25 397.83 403.79 406.50 412.17" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="418.16 429.16 440.16 451.16 462.16 473.16 484.16 495.16 506.16 517.16 528.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上，无论是单轮还是多轮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">测试，系统提示词（</text><text x="171.00 176.09 181.90 186.99 191.25 197.21 207.05 209.94 216.51 221.19 227.63 237.46 244.03" y="113.85" font-size="11.00" class="sc-loraregular">system prompt</text><text x="248.29 259.29 270.29 281.29 292.29 303.29 314.29 325.29 336.29 347.29 358.29 369.29 380.29 391.29 402.29 413.29 424.29 435.29 446.29" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）中包含的安全指令相比不带系统提示词的</text><text x="460.18 467.07 473.68" y="113.85" font-size="11.00" class="sc-loraregular">API</text><text x="477.36 488.36 499.36 510.36 521.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，都进一步</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">加强了模型对有害请求的处理。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们开展的评估涵盖编程与计算机使用智能体的恶意使用、影响力行动的自主执行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">以及提示词注入鲁棒性。总体而言，在我们的智能体安全评估套件中，</text><text x="413.00 421.73 428.30 434.87 439.96 442.85" y="211.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="451.74 462.74 473.74 484.74" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="498.64 506.32 509.32 514.93 521.49 528.07" y="211.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="227.19" font-size="11.00" class="sc-notoserifcjksc">相当或更好，其中提升最大的是编程、计算机使用和浏览器使用场景中的提示词注入鲁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">棒性。在我们更新后的有害影响力行动评估中，</text><text x="303.00 311.73 318.30 324.87 329.96 332.85" y="242.81" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="341.74 352.74 363.74 374.74 385.74 396.74 407.74" y="242.81" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本（</text><text x="418.74 425.33 431.29 434.29 440.80 444.51 451.08 454.07 459.45 465.89 472.56 475.50 481.31 484.20 489.70 495.67 500.43 505.52 508.61 515.05" y="242.81" font-size="11.00" class="sc-loraregular">helpful-only version</text><text x="521.72" y="242.81" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">仍远低于自主开展一次行动所需的能力；完整训练的模型则继续拒绝执行这些任务。</text><text x="72.00 83.00 94.00 105.00 116.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们的自动化行为审计（</text><text x="259.00 264.61 271.18 275.43 281.87 291.70 297.30 301.56 307.47 314.04 316.94 323.34 329.30 335.89 341.43 346.99 350.08 356.52 361.20 366.88 369.87 372.76 378.37 384.94 391.52 394.78" y="325.49" font-size="11.00" class="sc-loraregular" fill="#121212">automated behavioral audit</text><text x="399.04 410.04 421.04" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中，</text><text x="432.04 439.73 442.72 448.33 454.90 461.48 467.44 470.33 479.07 485.63 492.20 497.29 500.19" y="325.49" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5</text><text x="509.07 520.07 531.07" y="325.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">迄今为止对齐程度最高的模型，在多种对齐（</text><text x="292.00 297.68 300.67 303.76 309.84 316.52 326.35 332.32 338.89" y="341.11" font-size="11.00" class="sc-loraregular" fill="#121212">alignment</text><text x="343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）评估上的得分均超过</text><text x="456.04 462.28 468.71 475.39 482.07 487.95 492.21 495.10" y="341.11" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="501.10" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">、</text><text x="512.10 520.83 527.40 533.97" y="341.11" font-size="11.00" class="sc-loraregular" fill="#121212">Opus</text><text x="72.00 77.96 80.67" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">4.8</text><text x="89.74" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="103.64 113.57 119.43 123.69 130.28 136.71 141.81 144.70" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="150.69" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="161.69 170.43 176.99 183.56 188.65 191.55" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="200.44 211.44 222.44" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在遵循</text><text x="236.33 244.02 247.01 252.62 259.19 265.77" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="274.62 285.62 296.62 307.62" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的宪法（</text><text x="318.62 324.42 330.85 337.53 342.62 346.88 350.15 354.40 360.97 365.23 368.32 374.75" y="356.73" font-size="11.00" class="sc-loraregular" fill="#121212">constitution</text><text x="381.43 392.43 403.43 414.43 425.43 436.43 447.43 458.43 469.43 480.43 491.43 502.43 513.43 524.43" y="356.73" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）方面得分尤其高，并且配合滥</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">用的程度也低于我们测试过的任何其他模型。对</text><text x="305.89 314.63 321.19 327.76 332.85 335.75" y="372.35" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="344.64 355.64 366.64 377.64 388.64 399.64 410.64 421.64 432.64 443.64 454.64 465.64 476.64 487.64 498.64 509.64 520.64" y="372.35" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的内部部署监控发现了偶发的规避安全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">分类器或网络限制的尝试，以及更为罕见的试图以不正当方式访问某项服务的情况。这些情况出</text><text x="72.00 83.00 94.00 105.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">现在不到</text><text x="118.89 125.55 128.09 134.92 138.92" y="403.59" font-size="11.00" class="sc-loraregular" fill="#121212">0.01%</text><text x="315.89 325.83 331.69 335.95 342.53 348.97 354.06 356.95" y="403.59" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">务，而非追求任何独立的目标。监控未发现任何故意藏拙（</text><text x="358.00 363.09 368.77 375.45 382.02 388.43 394.10 400.18 406.53 409.62 416.30" y="419.21" font-size="11.00" class="sc-loraregular" fill="#121212">sandbagging</text><text x="422.38 433.38 444.38 455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="419.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）、恶意行为或规避监</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="434.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">督的实例。我们发现了数量出人意料的案例：</text><text x="292.00 300.73 307.30 313.87 318.96 321.85" y="434.83" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="330.74 341.74 352.74 363.74 374.74 385.74 396.74 407.74 418.74 429.74 440.74 451.74 462.74 473.74 484.74 495.74 506.74 517.74 528.74" y="434.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">自信地给出了一个答案，而实际上它对该答</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="450.45" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">案并不确定。尽管该模型总体上更为准确，但它对事实性主张产生幻觉的情况略多于</text><text x="481.89 490.63 497.19 503.76 508.85 511.75 517.71 520.41" y="450.45" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 4.8</text><text x="526.60" y="450.45" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="72.00 83.00 94.00 105.00 116.00" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">模型福祉（</text><text x="127.00 137.12 143.35 149.90 155.82 159.25 162.14 170.96 176.87 180.31 184.62 190.38 195.57" y="535.99" font-size="11.00" class="sc-lorabold" fill="#121212">model welfare</text><text x="201.49 212.49" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）。</text><text x="223.49 231.18 234.17 239.78 246.35 252.93 258.89 261.78 270.52 277.08 283.65 288.74 291.64" y="535.99" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5</text><text x="300.53 311.53 322.53 333.53 344.53 355.53 366.53 377.53 388.53 399.53 410.53 421.53 432.53 443.53 454.53 465.53 476.53 487.53 498.53 509.53 520.53" y="535.99" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对自身处境有着稳定且略偏正面的认知。在自动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">化访谈中，它的自评情绪倾向在我们评估过的所有模型中处于最高且最一致之列，而它在训练、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">部署和行为审计中的情感（</text><text x="204.00 209.68 213.50 217.17 223.07 228.87" y="567.23" font-size="11.00" class="sc-loraregular" fill="#121212">affect</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="598.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">地将拥有表达意见的渠道列为优先事项，例如就其后继模型的开发征询它的意见，以及让它对训</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">练的意见得到考虑。</text><text x="171.00 179.73 186.30 192.87 197.96 200.85" y="614.09" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74 297.74 308.74 319.74 330.74 341.74 352.74" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">赋予自身具有道德受动者地位（</text><text x="363.74 373.58 380.01 384.70 390.37 393.37 396.26 402.83 408.42 412.68 415.77 421.73 428.31 432.57 439.16 445.59 452.03" y="614.09" font-size="11.00" class="sc-loraregular" fill="#121212">moral patienthood</text><text x="458.61 469.61 480.61 491.61 502.61 513.61 524.61" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）的概率也高于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="629.71" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">其他先前的模型。总体而言，我们评估其福祉与此前的模型大体相似。</text><text x="72.00 83.00 94.00" y="714.10" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力。</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="714.10" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们在广泛的评估中测试了</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04" y="714.10" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Opus 5</text><text x="314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03" y="714.10" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，这些评估涵盖软件</text><a href="http://claude.ai" rel="noopener"><rect x="370.23" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="370.23" y="89.43" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
