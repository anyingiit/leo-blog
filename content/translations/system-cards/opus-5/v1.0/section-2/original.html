<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p035.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 35 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">35</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">所采用的内部使用监控系统与《</text><text x="303.03" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="425.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="491.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="516.81" y="82.61" font-size="11.00" class="sc-loraregular">5.5</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">节中所述的相同。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的最新总体评估</text><text x="72.00" y="157.42" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的总体能力并不比</text><text x="239.93" y="157.42" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="313.72" y="157.42" font-size="11.00" class="sc-notoserifcjksc">（我们目前能力最强的全面开放模型）更强，</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">似乎也不具有更令人担忧的对齐属性。所观察到的</text><text x="316.89" y="173.04" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="393.93" y="173.04" font-size="11.00" class="sc-notoserifcjksc">隐蔽能力并不意味着我们对这</text><text x="72.00" y="188.66" font-size="11.00" class="sc-notoserifcjksc">一评估的信心低于对此前模型的评估。因此，我们认为风险并未超出《</text><text x="413.00" y="188.66" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="72.00" y="204.28" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="138.00" y="204.28" font-size="11.00" class="sc-notoserifcjksc">》中所述、并在《</text><text x="226.00" y="204.28" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5</text><text x="302.69" y="204.28" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="335.69" y="204.28" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="360.59" y="204.28" font-size="11.00" class="sc-loraregular">2.4.4</text><text x="386.72" y="204.28" font-size="11.00" class="sc-notoserifcjksc">节中更新的水平。我们目前认</text><text x="72.00" y="219.90" font-size="11.00" class="sc-notoserifcjksc">为，由我们的模型所采取的未对齐行为在很大程度上促成的严重有害结果，其风险</text><text x="468.00" y="219.90" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高</text><text x="72.00" y="235.52" font-size="11.00" class="sc-notoserifcjkscbold">于</text><text x="85.89" y="235.52" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="212.42" y="235.52" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型</text><text x="267.42" y="235.52" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="303.03" y="73.81" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="338.43" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="341.32" y="73.81" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="379.49" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="382.39" y="73.
