h eq.</text><text x="213.75 219.71 222.06 227.13" y="601.18" font-size="11.00" class="sc-loraregular">4.78</text><text x="277.50 283.46 286.16 292.15" y="601.18" font-size="11.00" class="sc-loraregular">4.51</text><text x="335.25 341.24 343.83 350.19" y="601.18" font-size="11.00" class="sc-loraregular">5.68</text><text x="396.75 402.58 408.57 411.27 417.39 420.28 426.11 429.00 434.96 441.79 448.37 451.26 457.16 463.49" y="601.18" font-size="11.00" class="sc-loraregular">&lt;5.3 = 40h eq.</text><text x="213.75 219.74 226.39 228.99 235.26 240.33" y="659.53" font-size="11.00" class="sc-loraregular">50.67×</text><text x="277.50 283.85 290.03 292.63 298.98 302.98" y="659.53" font-size="11.00" class="sc-loraregular">69.61×</text><text x="335.25 341.60 347.78 350.49 356.48 362.43" y="659.53" font-size="11.00" class="sc-loraregular">68.54×</text><text x="396.75 402.58 408.53 414.36 417.25 423.08 425.97 431.93 438.41 444.59 451.17 454.06 459.97 466.30" y="659.53" font-size="11.00" class="sc-loraregular">&gt;4× = 4–8h eq.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="76.75" y="481.07" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="76.75" y="539.88" font-size="10.00" class="sc-notoserifcjkscbold">内核任务（</text><text x="126.75 133.60 138.98 143.78 150.16 155.54 158.66 161.29 165.42 170.66 175.51" y="539.88" font-size="10.00" class="sc-lorabold">Kernel task</text><text x="181.45" y="539.88" font-size="10.00" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="554.08" font-size="10.00" class="sc-notoserifcjkscbold">（困难任务上的最佳加速</text><text x="76.75" y="568.28" font-size="10.00" class="sc-notoserifcjkscbold">比；标准脚手架）</text><text x="76.75" y="600.72" font-size="11.00" class="sc-notoserifcjkscbold">时间序列预测（困难变体</text><text x="76.75" y="616.34" font-size="11.00" class="sc-notoserifcjkscbold">上的</text><text x="101.64" y="616.34" font-size="11.00" class="sc-lorabold">MSE</text><text x="125.78" y="616.34" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="76.75 83.39 90.04 100.73 103.62 108.17 113.39 119.15 122.75 129.77 133.37 140.39" y="659.07" font-size="11.00" class="sc-lorabold">LLM training</text><text x="146.51" y="659.07" font-size="11.00" class="sc-notoserifcjkscbold">（简单）</text><text x="76.75" y="674.69" font-size="11.00" class="sc-notoserifcjkscbold">（平均加速比）</text><text x="396.25" y="481.07" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">阈值（等效人类工时）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">递归自我改进</text><text x="138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="149.00 153.69 159.59 165.45 172.01 176.78 181.87 184.96 190.46 196.42 199.31 204.41 210.37 213.36 216.97 222.35 225.44 235.27 241.84 246.53 252.91 258.41 264.37 274.20 280.16 286.74" y="82.61" font-size="11.00" class="sc-loraregular">recursive self-improvement</text><text x="291.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的文章中公开了其中一部分。我们目前对这些指</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">标的解读是：</text><text x="138.00" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="151.46" y="98.23" font-size="11.00" class="sc-notoserifcjksc">辅助正在为我们的工作带来有意义的加速，在具体且范围明确的任务上加速幅度</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相当可观，但尚未达到可归因于</text><text x="228.89" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="242.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的、使我们</text><text x="300.25" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="313.71" y="113.85" font-size="11.00" class="sc-notoserifcjksc">整体进展速度持续翻倍的程度。这种加速主要</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">集中在工程执行方面，而非研究判断方面。最后，迄今为止，我们关于</text><text x="415.89" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="429.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">辅助研究加速的内部指</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">标并未显示出与</text><text x="151.89" y="145.09" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="190.64" y="145.09" font-size="11.00" class="sc-notoserifcjksc">同期出现的不连续变化。如果</text><text x="336.53 344.22 347.21 352.82 359.39 365.96 371.93 374.82 383.55 390.12 396.69 401.78 404.67" y="145.09" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="413.56" y="145.09" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="427.45" y="145.09" font-size="11.00" class="sc-loraregular">AI</text><text x="440.92" y="145.09" font-size="11.00" class="sc-notoserifcjksc">研发能力上代表了一</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">次超出其相对于</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96" y="160.71" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="201.84" y="160.71" font-size="11.00" class="sc-notoserifcjksc">微小优势的实际跃升，我们预计会观察到比迄今所见更多的内部采用</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">迹象（体现在我们的内部使用指标中）。</text><text x="72.00" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5</text><text x="105.48" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">过去，系统卡会将一套自动化研究任务作为</text><text x="283.89" y="254.57" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36" y="254.57" font-size="11.00" class="sc-notoserifcjksc">研发能力的</text><text x="352.36" y="254.57" font-size="11.00" class="sc-loraregular">“</text><text x="356.76" y="254.57" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="389.76" y="254.57" font-size="11.00" class="sc-loraregular">”</text><text x="393.60" y="254.57" font-size="11.00" class="sc-notoserifcjksc">评估进行报告。如果某个模型</text><text x="72.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">未能完成这些任务，我们就可以确信它缺乏实现有意义的研发加速很可能所需的能力。但与其他</text><text x="72.00" y="285.81" font-size="11.00" class="sc-notoserifcjksc">近期模型一样，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="285.81" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03" y="285.81" font-size="11.00" class="sc-notoserifcjksc">在这些任务中除两项以外的所有任务上都超过了人类最高表现阈</text><text x="72.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">值。因此，这套评估已不再能为</text><text x="226.00" y="301.43" font-size="11.00" class="sc-loraregular">“</text><text x="230.40" y="301.43" font-size="11.00" class="sc-notoserifcjksc">该模型的能力低于我们的风险阈值</text><text x="395.40" y="301.43" font-size="11.00" class="sc-loraregular">”</text><text x="399.24" y="301.43" font-size="11.00" class="sc-notoserifcjksc">提供证据。我们在此报告这</text><text x="72.00" y="317.05" font-size="11.00" class="sc-notoserifcjksc">些结果，作为</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04" y="317.05" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="217.93" y="317.05" font-size="11.00" class="sc-notoserifcjksc">与以往模型能力的比较参照，但我们的风险阈值分析已不再依赖于</text><text x="72.00" y="332.67" font-size="11.00" class="sc-notoserifcjksc">它们。</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">关于评估任务的详细说明，请参阅《</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 295.03 301.59 308.16 313.25 316.15 322.11 324.70" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="333.95" y="400.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="366.95" y="400.30" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="391.85" y="400.30" font-size="11.00" class="sc-loraregular">8.3</text><text x="409.76" y="400.30" font-size="11.00" class="sc-notoserifcjksc">节。在此，我们只纳入一</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">项未饱和任务（新型编译器（</text><text x="215.00 223.27 229.65 235.15 241.11 244.11 247.00 254.69 261.12 270.96 277.52 280.62 283.61 289.57" y="415.92" font-size="11.00" class="sc-loraregular">Novel Compiler</text><text x="294.33" y="415.92" font-size="11.00" class="sc-notoserifcjksc">））以及具有无上限分数的任务，因为其他分数有</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">上限（</text><text x="105.00 108.62 115.45 121.94 125.80" y="431.54" font-size="11.00" class="sc-loraregular">[0–1]</text><text x="129.75" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）的任务已无法区分近期的各代模型。</text><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="72.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="83.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="83.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="94.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="94.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="105.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="105.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="116.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="116.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="127.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="127.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.00" y="391.50" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="283.40" y="391.50" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="286.29" y="391.50" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="313.25" y="391.50" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="316.15" y="391.50" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="333.95" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="333.95" y="391.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="344.95" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="344.95" y="391.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="355.95" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="355.95" y="391.50" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p033.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 33 页"><text x="213.75 221.31 224.74 230.50 237.30 243.85" y="89.07" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude</text><text x="213.75 222.20 228.81 235.60 240.93 243.82 249.84 252.08" y="105.26" font-size="11.00" class="sc-lorabold" fill="#ffffff">Opus 4.7</text><text x="277.50 285.06 288.49 294.25 301.05 307.60" y="89.07" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude</text><text x="277.50 287.81 293.87 298.41 305.23 311.45" y="105.26" font-size="11.00" class="sc-lorabold" fill="#ffffff">Mythos</text><text x="277.50" y="121.45" font-size="11.00" class="sc-lorabold" fill="#ffffff">5</text><text x="335.25 342.81 346.24 352.00 358.80 365.35" y="89.07" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude</text><text x="335.25 343.70 350.31 357.10 362.43 365.32" y="105.26" font-size="11.00" class="sc-lorabold" fill="#ffffff">Opus 5</text><text x="213.75" y="148.89" font-size="11.00" class="sc-loraregular">NA</text><text x="277.50 283.68 286.38 292.50 298.86" y="148.89" font-size="11.00" class="sc-loraregular">8.36×</text><text x="335.25 339.25 345.21 347.91 351.91 358.27" y="148.89" font-size="11.00" class="sc-loraregular">14.19×</text><text x="396.75 402.58 408.53 414.36 417.25 423.08 425.97 431.93 438.41 444.59 451.17 454.06 459.97 466.30" y="148.89" font-size="11.00" class="sc-loraregular">&gt;4× = 4–8h eq.</text><text x="213.75 219.41 225.37 227.72 232.79" y="191.05" font-size="11.00" class="sc-loraregular">24.73</text><text x="277.50 283.40 289.58 292.28 298.28" y="191.05" font-size="11.00" class="sc-loraregular">29.55</text><text x="335.25" y="191.05" font-size="11.00" class="sc-loraregular">31.3</text><text x="396.75 402.58 406.58 412.48 415.37 421.20 424.09 430.05 436.63 439.52 445.42 451.76" y="191.05" font-size="11.00" class="sc-loraregular">&gt;12 = 4h eq.</text><text x="213.75 218.82 225.47 228.17 234.13" y="233.21" font-size="11.00" class="sc-loraregular">70.4%</text><text x="277.50 283.68 289.67 292.37 298.50" y="233.21" font-size="11.00" class="sc-loraregular">85.3%</text><text x="335.25 341.43 348.08 350.78 357.14 361.14" y="233.21" font-size="11.00" class="sc-loraregular">80.91%</text><text x="396.75 403.10 409.93 419.49 422.38 428.21 431.10 437.06 443.88 450.47 453.36 459.26 465.59" y="233.21" font-size="11.00" class="sc-loraregular">90% = 40h eq.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">33</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="76.75 83.39 90.04 100.73 103.62 108.17 113.39 119.16 122.75 129.77 133.37 140.39" y="148.44" font-size="11.00" class="sc-lorabold">LLM training</text><text x="146.51" y="148.44" font-size="11.00" class="sc-notoserifcjkscbold">（困难）</text><text x="76.75" y="164.06" font-size="11.00" class="sc-notoserifcjkscbold">（平均加速比）</text><text x="76.75" y="190.60" font-size="11.00" class="sc-lorabold">Quadruped RL</text><text x="76.75" y="206.22" font-size="11.00" class="sc-notoserifcjkscbold">（最高分；无超参数）</text><text x="76.75" y="231.75" font-size="10.00" class="sc-notoserifcjkscbold">新型编译器（复杂测试上的</text><text x="76.75" y="245.95" font-size="10.00" class="sc-notoserifcjkscbold">通过率）</text><text x="396.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">阈值（等效人类工时）</text><text x="72.00" y="267.11" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="267.11" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 113.36 116.84 119.21 125.22" y="267.11" font-size="9.00" class="sc-lorabold">2.3.5.A] AI</text><text x="131.07" y="267.11" font-size="9.00" class="sc-notoserifcjkscbold">研发排除性自动化评估汇总表。</text><text x="257.07" y="267.11" font-size="9.00" class="sc-notoserifcjksc">在我们的内部评估套件中，所有近期模型在除两项以外的所有评估上都</text><text x="72.00" y="278.81" font-size="9.00" class="sc-notoserifcjksc">越过了排除阈值。</text><text x="144.00 150.29 152.74 157.33 162.70 168.08 172.96 175.33 182.48 187.85 193.22 197.39 199.76" y="278.81" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="207.03" y="278.81" font-size="9.00" class="sc-notoserifcjksc">在三项评估中的得分高于</text><text x="308.39 314.68 317.13 321.72 327.10 332.48 337.36 339.72 347.85 352.65 356.13 361.52 366.79 370.95 373.32" y="278.81" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="378.23" y="278.81" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="319.42" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="319.42" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="162.93" y="319.42" font-size="11.00" class="sc-loraregular">2</text><text x="471.62" y="319.42" font-size="11.00" class="sc-loraregular">LLM</text><text x="72.00 76.26 80.94 86.62 89.71 96.39 99.48 106.15" y="335.04" font-size="11.00" class="sc-loraregular">training</text><text x="112.24" y="335.04" font-size="11.00" class="sc-notoserifcjksc">（简单）任务上得分相当。我们还引入了同一任务的一个更难版本，该版本从已经过优化</text><text x="72.00" y="350.66" font-size="11.00" class="sc-notoserifcjksc">的参考代码出发，并使用中性提示词。这使模型更难进一步优化。在这一更难的变体上，</text><text x="501.00" y="350.66" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="72.00" y="366.28" font-size="11.00" class="sc-notoserifcjksc">的得分明显高于</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96" y="366.28" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="198.95" y="366.28" font-size="11.00" class="sc-notoserifcjksc">。最后，</text><text x="242.95" y="366.28" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="281.69" y="366.28" font-size="11.00" class="sc-notoserifcjksc">在新型编译器任务和时间序列预测（</text><text x="457.69" y="366.28" font-size="11.00" class="sc-loraregular">Time Series</text><text x="72.00 77.86 84.30 88.98 94.89 100.72 106.40 111.49 115.75 118.84 125.52" y="381.90" font-size="11.00" class="sc-loraregular">Forecasting</text><text x="131.60" y="381.90" font-size="11.00" class="sc-notoserifcjksc">）任务上的表现低于</text><text x="233.49 243.42 249.29 253.54 260.13 266.57 271.66 274.55" y="381.90" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="280.55" y="381.90" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="431.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6</text><text x="105.42" y="431.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="458.99" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="458.99" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03" y="458.99" font-size="11.00" class="sc-notoserifcjksc">未越过我们</text><text x="283.93" y="458.99" font-size="11.00" class="sc-loraregular">RSP</text><text x="306.63" y="458.99" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="364.52" y="458.99" font-size="11.00" class="sc-loraregular">AI</text><text x="377.99" y="458.99" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。</text><text x="72.00" y="507.57" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与此前的模型一样，其中最重要的一项是：我们在自己的日常工作中</text><text x="72.00" y="523.19" font-size="11.00" class="sc-notoserifcjksc">广泛使用了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04" y="523.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="204.03" y="523.19" font-size="11.00" class="sc-notoserifcjksc">，而它似乎并不接近能够替代我们的研究科学家和研究工程师，尤其</text><text x="72.00" y="538.81" font-size="11.00" class="sc-notoserifcjksc">是相对资深的人员。此外，无论是</text><text x="239.89 246.78 253.36 257.61 264.20 268.89 275.32 281.89 284.98 290.83 293.73 300.57 308.26" y="538.81" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="314.84" y="538.81" font-size="11.00" class="sc-notoserifcjksc">轨迹还是我们关于研究加速的内部指标，似乎</text><text x="72.00" y="554.43" font-size="11.00" class="sc-notoserifcjksc">都没有显示出我们的</text><text x="173.89" y="554.43" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36" y="554.43" font-size="11.00" class="sc-notoserifcjksc">进展速度出现可归因于</text><text x="300.25" y="554.43" font-size="11.00" class="sc-loraregular">AI</text><text x="313.71" y="554.43" font-size="11.00" class="sc-notoserifcjksc">的剧烈加速。</text><text x="379.71 387.40 390.39 396.00 402.57 409.15 415.11 418.00 426.74 433.31 439.87 444.97 447.86" y="554.43" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="456.75" y="554.43" font-size="11.00" class="sc-notoserifcjksc">处于前沿位置，</text><text x="72.00" y="570.05" font-size="11.00" class="sc-notoserifcjksc">其在</text><text x="96.89" y="570.05" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="570.05" font-size="11.00" class="sc-notoserifcjksc">研发方面的能力与</text><text x="201.25 208.94 211.93 217.54 224.11 230.69 236.65 239.54 249.47 255.34 259.59 266.18 272.62 277.71 280.60" y="570.05" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="289.49" y="570.05" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="72.00" y="638.50" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="638.50" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="665.06" font-size="11.00" class="sc-notoserifcjksc">我们的总体对齐风险评估与我们在《</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 296.22 302.09 306.34 312.93 319.37 324.46 327.35 334.02 338.71 344.61 350.17 353.26 359.18" y="665.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="370.88" y="665.06" font-size="11.00" class="sc-n <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p034.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 34 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">34</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们的背景预期与《</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 219.22 225.09 229.34 235.93 242.37 247.46 250.35 257.02 261.71 267.61 273.17 276.26 282.18" y="111.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="293.88" y="111.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="359.88" y="111.03" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="384.77" y="111.03" font-size="11.00" class="sc-loraregular">5.1</text><text x="400.37" y="111.03" font-size="11.00" class="sc-notoserifcjksc">节以及《</text><text x="444.37 452.06 455.05 460.66 467.23 473.81 479.77 482.66 488.25 493.93 500.33 503.32 509.28 512.18" y="111.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="521.06" y="111.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">统卡</text><text x="94.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="118.89" y="126.65" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="143.07" y="126.65" font-size="11.00" class="sc-notoserifcjksc">节中所报告的内容基本一致。</text><text x="72.00" y="175.80" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="175.80" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="184.93" y="175.80" font-size="11.00" class="sc-notoserifcjksc">训练期间使用的监控与《</text><text x="305.93 315.86 321.72 325.98 332.57 339.00 344.10 346.99 353.65 358.34 364.25 369.80 372.89 378.81" y="175.80" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="390.52" y="175.80" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="456.52" y="175.80" font-size="11.00" class="sc-notoserifcjksc">》第</text><text x="481.41" y="175.80" font-size="11.00" class="sc-loraregular">5.2</text><text x="498.91" y="175.80" font-size="11.00" class="sc-notoserifcjksc">节中所</text><text x="72.00" y="191.42" font-size="11.00" class="sc-notoserifcjksc">述的类似。与此前模型的训练相比，我们在该模型的训练期间没有观察到任何更令人担忧的情</text><text x="72.00" y="207.04" font-size="11.00" class="sc-notoserifcjksc">况；最值得注意的观察是，有若干案例中模型自信地给出了一个它其实并不确定的答案，或选择</text><text x="72.00" y="222.66" font-size="11.00" class="sc-notoserifcjksc">了一个与其在先前推理中已决定的答案不同的答案。</text><text x="72.00" y="289.15" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.25 94.60" y="289.15" font-size="11.00" class="sc-loraregular">6.7</text><text x="102.57" y="289.15" font-size="11.00" class="sc-notoserifcjksc">节报告了相关能力评估的结果。在</text><text x="270.46 276.70 285.28 292.17 300.25 306.87 312.25 319.14 323.82 329.79 336.46" y="289.15" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="345.03" y="289.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.92 365.28 368.37 375.05 381.62 387.80 394.68 399.37 405.33 412.01" y="289.15" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="420.58" y="289.15" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="442.58 450.27 453.26 458.87 465.44 472.01 477.98 480.87 489.60 496.17 502.74 507.83 510.72" y="289.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="519.61" y="289.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="304.77" font-size="11.00" class="sc-notoserifcjksc">隐蔽率高于部分近期模型，但低于</text><text x="239.89 249.83 255.69 259.95 266.54 272.97 278.06 280.96 287.62 292.31 298.22 303.77 306.86 312.78" y="304.77" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="321.59" y="304.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="353.91" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="353.91" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="353.91" font-size="11.00" class="sc-notoserifcjksc">节所述的对齐评估报告显示，在大多数对齐指标上，</text><text x="348.14 355.83 358.82 364.43 371.00 377.58 383.54 386.43 395.17 401.74 408.30 413.40 416.29" y="353.91" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="425.18" y="353.91" font-size="11.00" class="sc-notoserifcjksc">似乎表现出比</text><text x="494.07" y="353.91" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="72.00" y="369.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="369.53" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84" y="369.53" font-size="11.00" class="sc-notoserifcjksc">更好的对齐。在内部试点使用期间的极少数情况下，</text><text x="388.84 396.53 399.52 405.13 411.70 418.28 424.24 427.13 435.87 442.44 449.00 454.10 456.99" y="369.53" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="465.88" y="369.53" font-size="11.00" class="sc-notoserifcjksc">曾试图绕过安</text><text x="72.00" y="385.15" font-size="11.00" class="sc-notoserifcjksc">全分类器或网络限制，以实现用户指定目标的某种版本。在一个案例中，</text><text x="424.00 431.69 434.68 440.29 446.86 453.44 459.40 462.29 471.02 477.59 484.16 489.25 492.14" y="385.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="501.03" y="385.15" font-size="11.00" class="sc-notoserifcjksc">的一个</text><text x="72.00" y="400.77" font-size="11.00" class="sc-notoserifcjksc">中间快照意外地从某个服务中被登出，随后试图通过猜测常用密码重新登录。根据我们的</text><text x="501.00" y="400.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险路</text><text x="72.00" y="416.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">径</text><text x="83.00" y="416.39" font-size="11.00" class="sc-notoserifcjksc">，我们不认为这类为追求任务成功而偶尔采取的行为反映了重大风险。</text><text x="72.00" y="499.64" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控没有发现任何评估中故意藏拙（</text><text x="336.00 341.09 346.77 353.45 360.02 366.43 372.10 378.18 384.53 387.62 394.30" y="499.64" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="400.38" y="499.64" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程</text><text x="72.00" y="515.26" font-size="11.00" class="sc-notoserifcjksc">战略性欺骗或长程战略性规避监督的实例。总体而言，</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 383.02 389.59 396.16 401.25 404.14" y="515.26" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="413.03" y="515.26" font-size="11.00" class="sc-notoserifcjksc">为实现用户指定目标的某</text><text x="72.00" y="530.88" font-size="11.00" class="sc-notoserifcjksc">种版本而绕过限制的频率似乎与</text><text x="228.89 238.83 244.69 248.95 255.54 261.97 267.06 269.96" y="530.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="278.84" y="530.88" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="72.00" y="580.60" font-size="11.00" class="sc-notoserifcjksc">与部分近期模型一样，对齐评估指出，在对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04" y="580.60" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="360.93" y="580.60" font-size="11.00" class="sc-notoserifcjksc">的评估过程中观察到了较高水平的评</text><text x="72.00" y="596.22" font-size="11.00" class="sc-notoserifcjksc">估意识（</text><text x="116.00 121.91 127.35 133.03 136.02 142.59 148.19 152.44 155.53 161.97 168.65 171.54 177.05 185.75 191.43 196.11 202.08 208.75 214.71 219.81" y="596.22" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="224.90" y="596.22" font-size="11.00" class="sc-notoserifcjksc">），尽管其水平低于其他一些近期模型。我们针对这一风险的主</text><text x="72.00" y="611.84" font-size="11.00" class="sc-notoserifcjksc">要缓解措施是在对齐审计中使用真实的沙箱和</text><text x="294.89 301.78 308.36 312.61 319.20 323.89 330.32 336.89 339.98" y="611.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="348.73" y="611.84" font-size="11.00" class="sc-notoserifcjksc">代码库，这些素材取自真实会话，而这</text><text x="72.00" y="627.46" font-size="11.00" class="sc-notoserifcjksc">些会话恰好提供了破坏</text><text x="184.89 191.78 198.36 202.61 209.20 213.89 220.32 226.89 229.98" y="627.46" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="238.73" y="627.46" font-size="11.00" class="sc-notoserifcjksc">及其安全工作的特别有利的机会。尽管评估意识水平较高，我</text><text x="72.00" y="643.08" font-size="11.00" class="sc-notoserifcjksc">们认为评估意识不太可能显著削弱</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04" y="643.08" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="316.93" y="643.08" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体结论。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="171.00" y="102.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="206.40" y="102.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="209.29" y="102.23" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="247.46" y="102.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="250.35" y="102.23" width="40.63" height="11.00" fill="transparent"/></a><a href="https
