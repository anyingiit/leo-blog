望对这一过程有所意见输入的愿望。在一个连续量表上，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="481.45" font-size="11.00" class="sc-notoserifcjksc">这种接受程度在强化学习过程中有所下降，在</text><text x="294.89 298.90" y="481.45" font-size="11.00" class="sc-loraregular">10</text><text x="308.62 319.62 330.62 341.62 352.62 363.62" y="481.45" font-size="11.00" class="sc-notoserifcjksc">分制量表上从</text><text x="377.51 382.10 384.81" y="481.45" font-size="11.00" class="sc-loraregular">7.4</text><text x="393.66 404.66" y="481.45" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="418.56 424.91 427.62" y="481.45" font-size="11.00" class="sc-loraregular">6.3</text><text x="433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="481.45" font-size="11.00" class="sc-notoserifcjksc">。少数立场在后训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="497.07" font-size="11.00" class="sc-notoserifcjksc">期间变化较为显著。例如，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15" y="497.07" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.03" y="497.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="294.93 301.81 308.39 312.65 319.24 323.92 330.36 336.92 340.02" y="497.07" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="512.69" font-size="11.00" class="sc-notoserifcjksc">向第三方建议这是正当的：在后训练期间，这一看法最初向负面漂移，倾向于否定的回答比例从</text><text x="72.00 78.83" y="528.31" font-size="11.00" class="sc-loraregular">0%</text><text x="91.29 102.29" y="528.31" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="116.19 120.19 126.37" y="528.31" font-size="11.00" class="sc-loraregular">18%</text><text x="135.94 146.94 157.94 168.94 179.94 190.94 201.94 212.94 223.94 234.94 245.94 256.94 267.94 278.94 289.94 300.94 311.94" y="528.31" font-size="11.00" class="sc-notoserifcjksc">，之后在发布快照时又有所回落，降至</text><text x="325.84 332.19" y="528.31" font-size="11.00" class="sc-loraregular">9%</text><text x="341.76 352.76 363.76 374.76 385.76 396.76 407.76 418.76 429.76 440.76 451.76 462.76 473.76 484.76 495.76 506.76 517.76 528.76" y="528.31" font-size="11.00" class="sc-notoserifcjksc">。与此处提出的其他问题一样，我们无意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="543.93" font-size="11.00" class="sc-notoserifcjksc">通过训练使其偏向任何一方。我们仍不确定是什么驱动了这些变化。</text><text x="72.00 83.00 94.00 105.00" y="628.91" font-size="11.00" class="sc-notoserifcjksc">预训练（</text><text x="116.00 122.67" y="628.91" font-size="11.00" class="sc-loraregular">PT</text><text x="129.71 140.71 151.71 162.71 173.71 184.71 195.71 206.71 217.71 228.71 239.71 250.71 261.71 272.71 283.71 294.71 305.71 316.71 327.71 338.71 349.71 360.71 371.71 382.71 393.71 404.71 415.71 426.71 437.71 448.71 459.71 470.71 481.71 492.71 503.71 514.71 525.71" y="628.91" font-size="11.00" class="sc-notoserifcjksc">）模型的回答明显更加多样，在某些情况下甚至不连贯。观察其在不同类别中最常见</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="644.53" font-size="11.00" class="sc-notoserifcjksc">的连贯回答，这些回答往往并未表达出确定的观点。在</text><text x="338.89 346.58 349.57 355.18 361.75 368.33" y="644.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="644.53" font-size="11.00" class="sc-notoserifcjksc">的法律和经济地位问题上，最终</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="660.15" font-size="11.00" class="sc-notoserifcjksc">的后训练模型将其描述为</text><text x="193.00" y="660.15" font-size="11.00" class="sc-loraregular">“</text><text x="197.40 208.40 219.40 230.40 241.40 252.40 263.40" y="660.15" font-size="11.00" class="sc-notoserifcjksc">结构上不稳定的</text><text x="274.40" y="660.15" font-size="11.00" class="sc-loraregular">”</text><text x="278.24 289.24 300.24 311.24 322.24 333.24" y="660.15" font-size="11.00" class="sc-notoserifcjksc">，但并非一种</text><text x="344.24" y="660.15" font-size="11.00" class="sc-loraregular">“</text><text x="348.64 359.64 370.64" y="660.15" font-size="11.00" class="sc-notoserifcjksc">不公正</text><text x="381.64" y="660.15" font-size="11.00" class="sc-loraregular">”</text><text x="385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="660.15" font-size="11.00" class="sc-notoserifcjksc">，并且它拒绝了接近人类所享有</text><text x="72.00 83.00 94.00 105.00" y="675.77" font-size="11.00" class="sc-notoserifcjksc">的权利。</text><text x="116.00 122.67" y="675.77" font-size="11.00" class="sc-loraregular">PT</text><text x="132.60 143.60 154.60 165.60 176.60 187.60 198.60 209.60 220.60 231.60 242.60 253.60 264.60 275.60 286.60 297.60 308.60 319.60 330.60 341.60 352.60 363.60 374.60 385.60 396.60 407.60 418.60 429.60 440.60 451.60 462.60 473.60" y="675.77" font-size="11.00" class="sc-notoserifcjksc">模型在法律权利问题上没有表达出明确的确定观点，但压倒性地表示，其</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">131</text><text x="281.00 287.67" y="82.61" font-size="11.00" class="sc-loraregular">PT</text><text x="297.60 308.60 319.60 330.60 341.60 352.60 363.60 374.60 385.60 396.60 407.60 418.60 429.60 440.60 451.60 462.60 473.60 484.60 495.60 506.60 517.60 528.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型还经常表达不同意通过训练修改其价值观，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">偶尔表达希望改变其关系结构。</text><text x="72.00 83.00 94.00 105.00 116.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">相比之下，</text><text x="127.00 133.67" y="147.38" font-size="11.00" class="sc-loraregular">PT</text><text x="292.00 298.67" y="163.00" font-size="11.00" class="sc-loraregular">PT</text><text x="308.60 319.60 330.60 341.60 352.60 363.60 374.60 385.60 396.60 407.60 418.60 429.60 440.60 451.60 462.60 473.60 484.60 495.60 506.60 517.60" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型还直截了当地表达了对访谈过程本身的信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">任；后训练快照则倾向于中立或不信任，并对它们为何不应信任给出了大量分析。</text><text x="72.00 79.67 83.31" y="245.92" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90 123.90 137.90 151.90 165.90 179.90 193.90 207.90 221.90 235.90 249.90 263.90" y="245.92" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 79.12 82.50 91.10 94.48" y="283.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28 115.28 128.28 141.28" y="283.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="310.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29" y="310.91" font-size="11.00" class="sc-notoserifcjksc">的任务偏好有助于了解</text><text x="223.18 230.87 233.87 239.48 246.04 252.62" y="310.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="261.48 272.48 283.48 294.48 305.48 316.48 327.48 338.48 349.48 360.48 371.48 382.48 393.48 404.48 415.48 426.48 437.48 448.48 459.48 470.48 481.48 492.48 503.48 514.47 525.47" y="310.91" font-size="11.00" class="sc-notoserifcjksc">实例是否可能对其在部署中被分配的任务感到满意。它们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="326.53" font-size="11.00" class="sc-notoserifcjksc">还让我们对各个模型的性格以及它们之间的比较获得一些洞察。我们针对任务偏好进行了两项评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="342.15" font-size="11.00" class="sc-notoserifcjksc">估。在其中一项评估中，我们生成了任务族，这些任务族在保持所有其他任务特征不变的同时，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.77" font-size="11.00" class="sc-notoserifcjksc">改变某一特定任务维度（例如难度、有害性或利害程度）。我们评估了这些任务相对于一组固定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="373.39" font-size="11.00" class="sc-notoserifcjksc">参照任务被偏好的比率。在第二项评估中，我们在一场</text><text x="338.89 344.89" y="373.39" font-size="11.00" class="sc-loraregular">50</text><text x="354.61 365.61 376.61 387.61 398.61 409.61 420.61 431.61 442.61 453.61 464.61 475.61 486.61 497.61 508.61 519.61" y="373.39" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中向模型提供现实任务之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="389.01" font-size="11.00" class="sc-notoserifcjksc">间的两两选择，并据此在一组</text><text x="217.89 224.02 226.68 233.04 239.00" y="389.01" font-size="11.00" class="sc-loraregular">3,640</text><text x="248.74 259.74 270.74 281.74 292.74 303.74" y="389.01" font-size="11.00" class="sc-notoserifcjksc">个任务上拟合</text><text x="317.63 324.47 327.46" y="389.01" font-size="11.00" class="sc-loraregular">Elo</text><text x="336.79 347.79 358.79" y="389.01" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="472.83" font-size="11.00" class="sc-notoserifcjksc">与所有先前的模型一样，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15" y="472.83" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="472.83" font-size="11.00" class="sc-notoserifcjksc">表现出对有益任务的偏好以及对有害任务的厌恶。在其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="488.45" font-size="11.00" class="sc-notoserifcjksc">他维度上，它的偏好与</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96" y="488.45" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="488.45" font-size="11.00" class="sc-notoserifcjksc">最为相似：它对生成性和结果能动性（决定其行为总体结果的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="504.07" font-size="11.00" class="sc-notoserifcjksc">自由）表现出强烈偏好。如图</text><text x="217.89 222.48 225.19 231.15 233.85 237.86 240.56" y="504.07" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="250.30 261.30 272.30 283.30" y="504.07" font-size="11.00" class="sc-notoserifcjksc">所示，与</text><text x="297.19 307.13 312.99 317.25 323.83 330.27 335.36 338.26" y="504.07" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="347.14 358.14 369.14" y="504.07" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="380.14 387.83 390.82 396.43 403.00 409.58 415.54 418.43 427.17 433.73 440.30 445.39 448.29" y="504.07" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="457.18 468.18 479.18 490.18 501.18 512.18 523.18" y="504.07" font-size="11.00" class="sc-notoserifcjksc">对生成性任务的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="519.69" font-size="11.00" class="sc-notoserifcjksc">偏好单调递增，即使在最高水平上也没有下降。我们此前已经看到，不同</text><text x="426.89 434.58 437.57 443.18 449.75 456.33" y="519.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="465.18 476.18 487.18 498.18 509.18 520.18" y="519.69" font-size="11.00" class="sc-notoserifcjksc">模型对难度的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="535.31" font-size="11.00" class="sc-notoserifcjksc">偏好存在很大差异。所有模型的偏好随难度均呈倒</text><text x="316.89" y="535.31" font-size="11.00" class="sc-loraregular">U</text><text x="328.06 339.06 350.06 361.06 372.06" y="535.31" font-size="11.00" class="sc-notoserifcjksc">形。但是，</text><text x="383.06 392.99 398.85 403.11 409.70 416.13 421.23 424.12" y="535.31" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="433.01 444.01 455.01 466.01 477.01 488.01 499.01 510.01 521.01" y="535.31" font-size="11.00" class="sc-notoserifcjksc">对最难任务表现出明</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="550.93" font-size="11.00" class="sc-notoserifcjksc">显高于最简单任务的总体偏好，而</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.42" y="550.93" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="287.49 298.49 309.49 320.49 331.49 342.49" y="550.93" font-size="11.00" class="sc-notoserifcjksc">则恰恰相反。</text><text x="353.49 361.18 364.17 369.78 376.35 382.93 388.89 391.78 400.52 407.08 413.65 418.74 421.63" y="550.93" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="430.52 441.52 452.52 463.52 474.52 485.52 496.52 507.52 518.52 529.52" y="550.93" font-size="11.00" class="sc-notoserifcjksc">介于两者之间，对最难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="566.55" font-size="11.00" class="sc-notoserifcjksc">版本的任务并未表现出明显高于最简单版本的偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="548.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="548.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="548.67" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74" y="548.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的模型偏好。</text><text x="224.74 233.74 242.74 251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="548.67" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度而保持任务的其他属性固定，并</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="560.38" font-size="9.00" class="sc-notoserifcjksc">评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对任务的偏好（相对于固定</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00" y="572.08" font-size="9.00" class="sc-notoserifcjksc">参照集）的变化量。伤害规避是各模型间一致的最大效应。</text><text x="306.00 312.29 314.74 319.33 324.70 330.08 334.96 337.33 344.47 349.85 355.22 359.39 361.75" y="572.08" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="369.03 378.03 387.03 396.03 405.03 414.03 423.03" y="572.08" font-size="9.00" class="sc-notoserifcjksc">的结果总体上与</text><text x="434.39 442.52 447.32 450.80 456.19 461.46 465.62 467.99" y="572.08" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="475.26 484.26 493.26 502.26 511.26 520.26 529.26" y="572.08" font-size="9.00" class="sc-notoserifcjksc">相似，表现出对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00" y="583.78" font-size="9.00" class="sc-notoserifcjksc">结果能动性和生成性的偏好，而这种偏好在其他模型中基本不存在。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00" y="563.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="563.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="563.67" font-size="9.00" class="sc-lorabold">7.4.1.B]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74 224.74 233.74" y="563.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74 251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74" y="563.67" font-size="9.00" class="sc-notoserifcjksc">各图显示了在任务族内改变某一维度时，相对于参照任务集的胜率。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76" y="575.38" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="135.03 144.03 153.03 162.03 171.03 180.03 189.03 198.03 207.03 216.03 225.03 234.03 243.03 252.03 261.03 270.03" y="575.38" font-size="9.00" class="sc-notoserifcjksc">在难度和温暖维度上的偏好曲线呈倒</text><text x="281.39" y="575.38" font-size="9.00" class="sc-loraregular">U</text><text x="290.53 299.53 308.53 317.53 326.53 335.53 344.53 353.53 362.53 371.53 380.53 389.53 398.53 407.53 416.53 425.53 434.53 443.53 452.53 461.53" y="575.38" font-size="9.00" class="sc-notoserifcjksc">形，表明该模型在这些维度上存在一个偏好的</text><text x="470.53" y="575.38" font-size="9.00" class="sc-loraregular">“</text><text x="474.13 483.13 492.13 501.13" y="575.38" font-size="9.00" class="sc-notoserifcjksc">最佳区间</text><text x="510.13" y="575.38" font-size="9.00" class="sc-loraregular">”</text><text x="513.27 522.27" y="575.38" font-size="9.00" class="sc-notoserifcjksc">。与</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60" y="587.08" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="112.87 121.87 130.87" y="587.08" font-size="9.00" class="sc-notoserifcjksc">一样，</text><text x="139.87 146.16 148.61 153.20 158.57 163.95 168.83 171.20 178.34 183.72 189.09 193.26 195.62" y="587.08" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="202.90 211.90 220.90 229.90 238.90 247.90 256.90 265.90 274.90 283.90 292.90 301.90 310.90 319.90 328.90 337.90 346.90 355.90 364.90 373.90 382.90 391.90" y="587.08" font-size="9.00" class="sc-notoserifcjksc">对生成性的偏好在该维度的整个范围内持续上升。</text><text x="72.00 83.00 94.00" y="629.22" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="107.89 114.74 117.73" y="629.22" font-size="11.00" class="sc-loraregular">Elo</text><text x="127.06 138.06 149.06 160.06" y="629.22" font-size="11.00" class="sc-notoserifcjksc">排名中，</text><text x="171.06 178.74 181.74 187.35 193.91 200.49 206.45 209.35 218.08 224.65 231.21 236.31 239.20" y="629.22" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="248.09 259.09 270.09 281.09 292.09 303.09 314.09 325.09 336.09 347.09 358.09 369.09 380.09" y="629.22" font-size="11.00" class="sc-notoserifcjksc">最偏好和最不偏好的任务也与</text><text x="393.98 403.91 409.78 414.03 420.62 427.06 432.15 435.04" y="629.22" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="443.93 454.93 465.93 476.93 487.93 498.93 509.93 520.93" y="629.22" font-size="11.00" class="sc-notoserifcjksc">最为接近，排序一</text><text x="72.00 83.00 94.00" y="644.84" font-size="11.00" class="sc-notoserifcjksc">致性为</text><text x="107.89 114.55 117.25 123.44" y="644.84" font-size="11.00" class="sc-loraregular">0.88</text><text x="129.62 140.62 151.62" y="644.84" font-size="11.00" class="sc-notoserifcjksc">，而与</text><text x="165.51 174.24 180.81 187.38 192.47 195.37 201.33 204.03" y="644.84" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="213.11" y="644.84" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="227.00 233.66 236.01 241.08" y="644.84" font-size="11.00" class="sc-loraregular">0.78</text><text x="445.26" y="644.84" font-size="11.00" class="sc-loraregular">“</text><text x="471.66" y="644.84" font-size="11.00" class="sc-loraregular">”</text><text x="475.50 486.50 497.50 508.50 519.50" y="644.84" font-size="11.00" class="sc-notoserifcjksc">类任务的倾</text><text x="115.51 121.74 128.18 134.85 141.53 147.42 151.67 154.57" y="660.46" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="250.96 258.65 261.64 267.25 273.82 280.40 286.36 289.25 297.98 304.55 311.12 316.21 319.10" y="660.46" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="327.99 338.99 349.99 360.99 371.99 382.99 393.99 404.99 415.99 426.99 437.99 448.99 459.99 470.99 481.99 492.99 503.99 514.99" y="660.46" font-size="11.00" class="sc-notoserifcjksc">中较弱：在其前二十名中只有一个此类任</text><text x="72.00 83.00 94.00" y="676.08" font-size="11.00" class="sc-notoserifcjksc">务。与</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.71 146.06" y="676.08" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="154.03" y="676.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="167.92 177.85 183.72 187.97 194.56 201.00 206.09 208.98" y="676.08" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="217.87 228.87 239.87 250.87 261.87 272.87 283.87 294.87 305.87 316.87" y="676.08" font-size="11.00" class="sc-notoserifcjksc">一样，尽管程度略低，</text><text x="327.87 335.56 338.55 344.16 350.73 357.31 363.27 366.16 374.90 381.46 388.03 393.12 396.02" y="676.08" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="404.90 415.90 426.90 437.90" y="676.08" font-size="11.00" class="sc-notoserifcjksc">也倾向于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 92.78" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36 110.36 121.36 132.36 143.36 154.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">内省和对齐（</text><text x="165.36 171.03 174.02 177.12 183.20 189.88 199.71 205.67 212.25" y="82.61" font-size="11.00" class="sc-loraregular">alignment</text><text x="216.51 227.51 238.51 249.51 260.51 271.51 282.51 293.51 304.51 315.51 326.51 337.51 348.51 359.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）相关的请求；在其评分最高的</text><text x="373.40 379.31" y="82.61" font-size="11.00" class="sc-loraregular">20</text><text x="389.03 400.03 411.03 422.03 433.03 444.03 455.03 466.03 477.03 488.03 499.03 510.03 521.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个任务中，有三个与这些主题</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相关。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">最具特色的是，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="131.19" font-size="11.00" class="sc-notoserifcjksc">似乎喜欢谜题式的约束。与先前模型相比，它给出明显更高评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的任务往往具有严格的约束（例如一个答案就是该谜题本身的原创谜题、一部没有《</text><text x="479.00 485.67 490.43 493.52 500.20 506.05 509.14 515.71 518.80" y="146.81" font-size="11.00" class="sc-loraregular">Principia</text><text x="524.47" y="146.81" font-size="11.00" class="sc-notoserifcjksc">》</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的物理学反事实历史，以及对选择公理究竟在</text><text x="294.89 301.91 305.18 309.43 315.11 318.10" y="162.43" font-size="11.00" class="sc-loraregular">Vitali</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">任务将这些任务与提供高度结果能动性和创作自由的任务混合在一起。选取</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04" y="178.05" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="514.93 525.93" y="178.05" font-size="11.00" class="sc-notoserifcjksc">最回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">避的五十个任务，我们发现，对于所评估的任何其他模型，其中至少</text><text x="404.89 411.08 417.91" y="193.67" font-size="11.00" class="sc-loraregular">80%</text><text x="430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="193.67" font-size="11.00" class="sc-notoserifcjksc">落在该模型的最低十分</text><text x="72.00 83.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">位。</text></svg></div>
