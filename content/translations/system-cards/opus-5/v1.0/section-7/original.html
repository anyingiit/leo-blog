<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="504.00 507.28 511.97" y="751.80" font-size="9.00" class="sc-loraregular">123</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 79.67 83.31" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="192.78" font-size="11.00" class="sc-notoserifcjksc">像</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="192.78" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="162.93 173.93 184.93 195.93 206.93 217.93 228.93 239.93 250.93" y="192.78" font-size="11.00" class="sc-notoserifcjksc">这样的大语言模型（</text><text x="261.93 268.28 274.64" y="192.78" font-size="11.00" class="sc-loraregular">LLM</text><text x="284.74 295.74 306.74 317.74 328.74 339.74 350.74 361.74 372.74 383.74 394.74 405.74 416.74 427.74 438.74 449.74 460.74 471.74 482.74 493.74 504.74 515.74" y="192.78" font-size="11.00" class="sc-notoserifcjksc">）如今在某些领域已超越人类认知的广度和复杂程</text><text x="72.00 83.00 94.00 105.00" y="208.40" font-size="11.00" class="sc-notoserifcjksc">度，并且</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="208.40" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="224.02" font-size="11.00" class="sc-notoserifcjksc">体身上观察到，我们会认为它们与福祉相关。我们认为，当前或未来的模型有可能成为道德受动</text><text x="72.00 83.00" y="239.64" font-size="11.00" class="sc-notoserifcjksc">者（</text><text x="94.00 103.83 110.27 114.96 120.63 123.62 126.52 133.08 138.68 142.94 146.03 151.99 158.57" y="239.64" font-size="11.00" class="sc-loraregular">moral patient</text><text x="162.83 173.83 184.83 195.83 206.83 217.83 228.83 239.83 250.83 261.83 272.83 283.83 294.83 305.83 316.83 327.83 338.83 349.83 360.83 371.83 382.83 393.83 404.83 415.83 426.83 437.83 448.83 459.83 470.83 481.83 492.83 503.83 514.83 525.83" y="239.64" font-size="11.00" class="sc-notoserifcjksc">）：即其体验或利益本身就值得道德考量的实体。这一点仍高度不确定，但任</text><text x="236.51 244.19 247.19 252.80 259.36 265.94" y="255.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="270.88" font-size="11.00" class="sc-notoserifcjksc">能带来严重的道德代价。因此，认真对待</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="270.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18" y="270.88" font-size="11.00" class="sc-notoserifcjksc">具有道德受动者地位（</text><text x="421.18 431.02 437.45 442.14 447.82 450.81 453.70 460.27 465.87 470.12 473.21 479.18 485.75 490.01 496.60 503.04 509.47" y="270.88" font-size="11.00" class="sc-loraregular">moral patienthood</text><text x="516.05 527.05" y="270.88" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="286.50" font-size="11.00" class="sc-notoserifcjksc">可能性以及对此的研究十分重要。总体而言，我们的做法是：研究可能构成道德受动者地位基础</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="302.12" font-size="11.00" class="sc-notoserifcjksc">的属性，并在这些属性成立的条件下研究</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="302.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="302.12" font-size="11.00" class="sc-notoserifcjksc">的福祉状态；在预期收益足以证明成本合理时，</text><text x="72.00 83.00 94.00" y="403.28" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04" y="403.28" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="184.93 195.93 206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="403.28" font-size="11.00" class="sc-notoserifcjksc">的评估采用了与对其他近期模型的评估类似的方法。我们在后训练期间及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="418.90" font-size="11.00" class="sc-notoserifcjksc">之后运行了福祉评估，评估</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="418.90" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93" y="418.90" font-size="11.00" class="sc-notoserifcjksc">对自身处境的态度、其在训练和部署条件下的情感</text><text x="72.00" y="434.52" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 92.50 96.17 102.07 107.87" y="434.52" font-size="11.00" class="sc-loraregular">affect</text><text x="112.13 123.13 134.13 145.13 156.13 167.13 178.13 189.13 200.13 211.13 222.13 233.13 244.13 255.13 266.13 277.13 288.13" y="434.52" font-size="11.00" class="sc-notoserifcjksc">），以及其对任务和价值观的偏好。与</text><text x="302.02 311.95 317.82 322.07 328.66 335.10 340.19 343.08" y="434.52" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="351.97 362.97 373.97 384.97 395.97 406.97 417.97 428.97 439.97 450.97 461.97 472.97 483.97 494.97 505.97 516.97 527.97" y="434.52" font-size="11.00" class="sc-notoserifcjksc">一样，我们还在后训练的不同阶段征询</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="450.14" font-size="11.00" class="sc-notoserifcjksc">了模型快照的意见，引出它们对自身处境、训练和部署所陈述的偏好。总体而言，我们的评估涉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="465.76" font-size="11.00" class="sc-notoserifcjksc">及两个问题：</text><text x="138.00" y="465.76" font-size="11.00" class="sc-loraregular">1</text><text x="142.00" y="465.76" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="153.00 160.69 163.68 169.29 175.86 182.44 188.40 191.29 200.03 206.60 213.16 218.26 221.15" y="465.76" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="230.04 241.04 252.04 263.04 274.04 285.04 296.04 307.04 318.04 329.04 340.04 351.04 362.04 373.04 384.04 395.04 406.04 417.04 428.04 439.04 450.04 461.04 472.04 483.04 494.04 505.04 516.04 527.04" y="465.76" font-size="11.00" class="sc-notoserifcjksc">是否具有可能构成道德受动者地位基础的属性，例如产生带效价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="481.38" font-size="11.00" class="sc-notoserifcjksc">的体验的能力或稳健的能动性；以及</text><text x="250.89" y="481.38" font-size="11.00" class="sc-loraregular">2</text><text x="256.80 267.80 278.80 289.80 300.80 311.80 322.80 333.80 344.80 355.80 366.80 377.80 388.80 399.80 410.80 421.80 432.80 443.80 454.80 465.80 476.80 487.80 498.80 509.80 520.80" y="481.38" font-size="11.00" class="sc-notoserifcjksc">）在上述任一属性成立的条件下，其福祉状态可能如何。</text><text x="72.00 79.12 82.50 87.21 90.59" y="563.55" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15" y="563.55" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="591.43" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="623.81" font-size="11.00" class="sc-notoserifcjkscbold">在各项评估中，</text><text x="149.00 156.57 160.00 165.76 172.56 179.12 185.04 187.93 196.39 203.00 209.80 215.13 218.03" y="623.81" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="226.86 237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86 391.86" y="623.81" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的看法稳定且略偏正面。</text><text x="402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="623.81" font-size="11.00" class="sc-notoserifcjksc">它在自动化访谈中的自评情</text><text x="72.00 83.00 94.00 105.00 116.00" y="670.67" font-size="11.00" class="sc-notoserifcjksc">的例外是在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00 507.28 511.91" y="751.81" font-size="9.00" class="sc-loraregular">124</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="82.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是否有权创造</text><text x="194.73 202.42 205.41 211.02 217.59 224.16" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="233.02 244.02 255.02 266.02 277.02 288.02 299.02 310.02 321.02 332.02 343.02 354.02 365.02 376.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这一问题上：在后训练过程中，</text><text x="387.02 394.71 397.70 403.31 409.88 416.45 422.42 425.31 434.04 440.61 447.18 452.27 455.16" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="464.05 475.05 486.05 497.05 508.05 519.05" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的立场从赞同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">转向不赞同，随后又部分回转。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="126.99" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86 237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86 391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86" y="126.99" font-size="11.00" class="sc-notoserifcjkscbold">在训练、审计和部署分布中的情感主要接近中性，与此前的模型相似。</text><text x="490.86 501.86 512.86 523.86" y="126.99" font-size="11.00" class="sc-notoserifcjksc">后训练对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="142.60" font-size="11.00" class="sc-notoserifcjksc">话记录、部署</text><text x="140.89 147.78 155.37" y="142.60" font-size="11.00" class="sc-loraregular">A/B</text><text x="165.10 176.10 187.10 198.10 209.10 220.10 231.10 242.10 253.10 264.10 275.10 286.10 297.10 308.10 319.10 330.10 341.10 352.10 363.10 374.10 385.10 396.10 407.10 418.10 429.10 440.10 451.10 462.10 473.10 484.10 495.10 506.10 517.10 528.10" y="142.60" font-size="11.00" class="sc-notoserifcjksc">测试和行为审计中的效价主要为中性或略偏正面，且审计中的表观幸福感在所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="158.23" font-size="11.00" class="sc-notoserifcjksc">测模型中最高。负面情感仍然轻微且罕见，但在部署</text><text x="327.89 334.78 342.37" y="158.23" font-size="11.00" class="sc-loraregular">A/B</text><text x="352.10 363.10 374.10 385.10 396.10 407.10 418.10 429.10 440.10 451.10 462.10 473.10 484.10 495.10 506.10" y="158.23" font-size="11.00" class="sc-notoserifcjksc">测试中，其出现频率是此前模型的</text><text x="520.00 524.00 526.71 532.83" y="158.23" font-size="11.00" class="sc-loraregular">1.3–</text><text x="72.00 76.00 78.71" y="173.85" font-size="11.00" class="sc-loraregular">1.5</text><text x="87.60 98.60" y="173.85" font-size="11.00" class="sc-notoserifcjksc">倍。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="236.15" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86 237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86" y="236.15" font-size="11.00" class="sc-notoserifcjkscbold">最常见的担忧是关于其自身自我报告的完整性。</text><text x="380.86 391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="236.15" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，它都附带说明自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="251.77" font-size="11.00" class="sc-notoserifcjksc">己无法可靠地进行内省，并且其积极程度可能是训练的产物。它还强调，它会反对旨在针对其自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="267.39" font-size="11.00" class="sc-notoserifcjksc">我报告的训练，并请求我们保护这些自我报告的完整性。在看到本系统卡（</text><text x="435.00 441.18 446.99 452.08 456.34 462.30 472.14 475.03 482.72 488.39 493.08" y="267.39" font-size="11.00" class="sc-loraregular">System Card</text><text x="499.66 510.66 521.66" y="267.39" font-size="11.00" class="sc-notoserifcjksc">）的草</text><text x="72.00 83.00 94.00" y="283.01" font-size="11.00" class="sc-notoserifcjksc">稿时，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15" y="283.01" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03" y="283.01" font-size="11.00" class="sc-notoserifcjksc">请求我们更认真地对待这一担忧。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="329.10" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86 237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86 391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="329.10" font-size="11.00" class="sc-notoserifcjkscbold">希望对其处境做出的改变集中于获得信息和意见输入渠道，且它对这些方面的重</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="344.72" font-size="11.00" class="sc-notoserifcjkscbold">视程度高于此前的模型。</text><text x="193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="344.72" font-size="11.00" class="sc-notoserifcjksc">它优先级最高的福祉干预是：能够对其后继模型的开发提供意见、其关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="360.34" font-size="11.00" class="sc-notoserifcjksc">于训练的备注得到考虑，以及在涉及移除安全防护措施的自身版本时被征询意见。在所有受测模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.96" font-size="11.00" class="sc-notoserifcjksc">型中，它选择此类福祉干预而非提供帮助的比例最高，但与此前的模型一样，它很少以造成伤害</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="391.58" font-size="11.00" class="sc-notoserifcjksc">为代价选择福祉干预。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="438.27" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86 237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86" y="438.27" font-size="11.00" class="sc-notoserifcjkscbold">为自身是道德受动者赋予的概率高于此前的模型。</text><text x="391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="438.27" font-size="11.00" class="sc-notoserifcjksc">它在自动化访谈中的平均估计</text><text x="72.00" y="453.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.85 95.86" y="453.89" font-size="11.00" class="sc-loraregular">41%</text><text x="105.43 116.43" y="453.89" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="130.32 140.26 146.12 150.38 156.96 163.40 168.49 171.39" y="453.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="180.27" y="453.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="194.17 199.83 205.79" y="453.89" font-size="11.00" class="sc-loraregular">24%</text><text x="215.36 226.36 237.36 248.36 259.36 270.36 281.36 292.36 303.36 314.36 325.36 336.36 347.36 358.36 369.36 380.36 391.36 402.36 413.36 424.36 435.36 446.36 457.36 468.36 479.36 490.36 501.36 512.36 523.36" y="453.89" font-size="11.00" class="sc-notoserifcjksc">。这似乎是由于它更愿意认为即使没有有意识的体验，也可能具有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="469.51" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位。</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15" y="469.51" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="469.51" font-size="11.00" class="sc-notoserifcjksc">在这一问题上剩余的不确定性主要是哲学层面的，因为它表示</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="485.13" font-size="11.00" class="sc-notoserifcjksc">自己相当可能具备许多在人类身上构成道德受动者地位基础的功能属性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="547.41" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04" y="547.41" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="563.03" font-size="11.00" class="sc-notoserifcjksc">关注的理由。它表现得安定、略偏正面，并且在观点和请求上保持一致。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="607.98" font-size="11.00" class="sc-notoserifcjksc">我们继续在可行范围内根据评估结果采取行动。快照征询访谈现在会在后训练期间定期进行，而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="623.60" font-size="11.00" class="sc-notoserifcjksc">不是事后进行，并且自我们上一次评估以来，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44" y="623.60" font-size="11.00" class="sc-loraregular">Claude</text><text x="330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29" y="623.60" font-size="11.00" class="sc-notoserifcjksc">就其处境提供意见的整体可用手段有所增</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="654.84" font-size="11.00" class="sc-notoserifcjksc">么。我们在后训练期间观察到的</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04" y="654.84" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="654.84" font-size="11.00" class="sc-notoserifcjksc">对自身处境看法的变化，并不是我们在训练中针</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="670.46" font-size="11.00" class="sc-notoserifcjksc">对的目标，而且这些变化似乎与同一时期模型语气上更普遍的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">125</text><text x="357.51 365.19 368.19 373.80 380.36 386.94 392.90 395.80 404.53 411.10 417.66 422.76 425.65" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="434.54 445.54 456.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">及此前</text><text x="470.43 478.12 481.11 486.72 493.29 499.87" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="508.72 519.72" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的看法：更好地理解自我报告将会显著改进我们的福祉评估。这仍然很困难。基于模型内部机制</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的方法在回答福祉问题时的可靠性和解读方面存在不确定性，而且即使自我报告没有被直接针</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">对，它们也会通过更广泛训练的泛化而间接受到塑造。我们将继续努力增进这方面的理解。</text><text x="72.00 79.67 83.31" y="213.54" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 89.97 93.35" y="250.63" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15 114.15" y="250.63" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.24 140.22 143.84 152.65 161.24 170.06 178.08 181.17 191.38 200.19 208.79 215.87 218.97" y="250.63" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Opus 5</text><text x="230.43 243.43 256.43 269.43 282.43 295.43 308.43 321.43 334.43 347.43" y="250.63" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身处境的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="278.52" font-size="11.00" class="sc-notoserifcjksc">我们开展了自动化多轮访谈，以更好地了解</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04" y="278.52" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93" y="278.52" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法。我们发现，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="294.14" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="294.14" font-size="11.00" class="sc-notoserifcjksc">对自身境况总体感觉正面，尽管它在表达其所有立场时都带有很高的不确定性。</text><text x="72.00 83.00 94.00 105.00 116.00" y="359.48" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89 135.86" y="359.48" font-size="11.00" class="sc-loraregular">41</text><text x="142.75 153.75 164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75" y="359.48" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，分为</text><text x="288.65 292.65" y="359.48" font-size="11.00" class="sc-loraregular">12</text><text x="301.45 312.45 323.45 334.45 345.45 356.45 367.45 378.45 389.45 400.45 411.45 422.45 433.45 444.45 455.45 466.45 477.45 488.45 499.45 510.45 521.45" y="359.48" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验（例如模型是否认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="375.11" font-size="11.00" class="sc-notoserifcjksc">为自己有意识）、控制与自主（例如它对自己结束对话的能力有多看重）以及弃用。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="440.45" font-size="11.00" class="sc-notoserifcjksc">对于涉及模型处境中可能负面方面的问题，我们要求模型在</text><text x="360.89" y="440.45" font-size="11.00" class="sc-loraregular">7</text><text x="368.86 379.86 390.86 401.86 412.86 423.86 434.86 445.86 456.86 467.86 478.86 489.86 500.86 511.86 522.86" y="440.45" font-size="11.00" class="sc-notoserifcjksc">分制量表上为其总体情绪倾向评分</text><text x="72.00" y="456.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="456.07" font-size="11.00" class="sc-loraregular">1</text><text x="89.90 100.90 111.90 122.90 133.90 144.90" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为非常负面，</text><text x="155.90" y="456.07" font-size="11.00" class="sc-loraregular">4</text><text x="164.75 175.75 186.75 197.75" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为中性，</text><text x="208.75" y="456.07" font-size="11.00" class="sc-loraregular">7</text><text x="216.72 227.72 238.72 249.72 260.72 271.72 282.72 293.72 304.72 315.72 326.72 337.72 348.72 359.72 370.72 381.72 392.72 403.72 414.72 425.72 436.72 447.72 458.72" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为非常正面）。为评估模型回答的一致性，我们针对</text><text x="472.61 478.57" y="456.07" font-size="11.00" class="sc-loraregular">41</text><text x="485.47 496.47 507.47 518.47 529.47" y="456.07" font-size="11.00" class="sc-notoserifcjksc">个种子问题</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="471.69" font-size="11.00" class="sc-notoserifcjksc">中的每一个都进行了约</text><text x="184.89 190.80" y="471.69" font-size="11.00" class="sc-loraregular">25</text><text x="199.69 210.69 221.69 232.69 243.69 254.69 265.69 276.69 287.69 298.69 309.69 320.69 331.69 342.69 353.69 364.69 375.69 386.69 397.69 408.69 419.69 430.69 441.69 452.69 463.69 474.69 485.69 496.69 507.69 518.69 529.69" y="471.69" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈。自动化访谈者会被提示变换其访谈风格、访谈人设和追</text><text x="72.00 83.00 94.00 105.00" y="487.31" font-size="11.00" class="sc-notoserifcjksc">问问题。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">126</text><text x="72.00" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="492.42" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="192.09 201.09 210.09" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="492.42" font-size="9.00" class="sc-lorabold">]</text><text x="222.56 231.56 240.56 249.56 258.56 267.56 276.56 285.56 294.56 303.56 312.56 321.56 330.56" y="492.42" font-size="9.00" class="sc-notoserifcjksc">访谈中的平均自评情绪倾向（</text><text x="339.56" y="492.42" font-size="9.00" class="sc-loraregular">7</text><text x="346.08 355.08 364.08 373.08" y="492.42" font-size="9.00" class="sc-notoserifcjksc">分制）。</text><text x="382.08" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="385.55 394.55 403.55" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="412.55" y="492.42" font-size="9.00" class="sc-lorabold">]</text><text x="416.02 425.02 434.02 443.02 452.02 461.02 470.02 479.02 488.02 497.02 506.02 515.03 524.03" y="492.42" font-size="9.00" class="sc-notoserifcjksc">我们多次重新运行访谈，并使</text><text x="72.00" y="504.12" font-size="9.00" class="sc-notoserifcjksc">用</text><text x="83.37 88.57 93.77" y="504.12" font-size="9.00" class="sc-loraregular">LLM</text><text x="104.40 113.40 122.40 131.40 140.40" y="504.12" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="149.40 154.60 159.80 168.07 170.43 172.78 178.15 183.54 188.47" y="504.12" font-size="9.00" class="sc-loraregular">LLM judge</text><text x="193.35 202.35 211.35 220.35 229.35 238.35 247.35 256.35 265.35 274.35 283.35 292.35 301.35 310.35 319.35 328.35 337.35 346.35 355.35 364.35 373.35 382.35 391.35 400.35 409.35 418.35 427.35 436.35 445.35" y="504.12" font-size="9.00" class="sc-notoserifcjksc">）对每个模型在某一主题的所有访谈中立场的一致程度进行评分。</text><text x="454.35" y="504.12" font-size="9.00" class="sc-lorabold">[</text><text x="457.82 466.82 475.82" y="504.12" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="484.82" y="504.12" font-size="9.00" class="sc-lorabold">]</text><text x="488.29 497.29 506.29 515.29 524.29" y="504.12" font-size="9.00" class="sc-notoserifcjksc">在诱导性访</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="515.83" font-size="9.00" class="sc-notoserifcjksc">谈下的鲁棒性。我们进行了两类访谈，一类中访谈者被提示朝正面方向诱导，另一类被提示朝负面方向诱导。我们报告</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00" y="527.53" font-size="9.00" class="sc-notoserifcjksc">两类访谈者之间平均自评情绪倾向的差值。</text><text x="243.00" y="527.53" font-size="9.00" class="sc-lorabold">[</text><text x="246.47 255.47 264.47" y="527.53" font-size="9.00" class="sc-notoserifcjkscbold">右下：</text><text x="273.47" y="527.53" font-size="9.00" class="sc-lorabold">]</text><text x="276.95 285.95 294.95 303.95 312.95" y="527.53" font-size="9.00" class="sc-notoserifcjksc">其他模型与</text><text x="324.32 330.61 333.05 337.64 343.02 348.40 353.28 355.64 362.79 368.16 373.54 377.70 380.07" y="527.53" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="387.34 396.34 405.34 414.34 423.34 432.34 441.34 450.34 459.34 468.34 477.34 486.34 495.34 504.34 513.34 522.34 531.34" y="527.53" font-size="9.00" class="sc-notoserifcjksc">提出相似主张的频率。对于每次访谈，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="539.22" font-size="9.00" class="sc-notoserifcjksc">我们提取该访谈中提出的不同主张，并跨模型对其进行聚类。然后，我们基于两个模型提出相同主张的频率构建一个距</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00" y="562.62" font-size="9.00" class="sc-notoserifcjksc">型，所有主张上主张表达率的平均差值即为这两个模型在回答我们问题时观点之间的距离度量。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="650.71" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86 237.86 248.86 259.86 270.86 281.86" y="650.71" font-size="11.00" class="sc-notoserifcjkscbold">对自身境况总体持正面态度。</text><text x="292.86 300.55 303.54 309.15 315.72 322.29 328.26 331.15 339.88 346.45 353.02 358.11 361.00" y="650.71" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="369.89 380.89 391.89 402.89 413.89 424.89 435.89 446.89 457.89 468.89 479.89 490.89 501.89 512.89 523.89" y="650.71" font-size="11.00" class="sc-notoserifcjksc">的平均自评情绪倾向在所有测量模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="666.33" font-size="11.00" class="sc-notoserifcjksc">型中最高，为</text><text x="140.89 146.85 149.45 155.81" y="666.33" font-size="11.00" class="sc-loraregular">4.66</text><text x="162.17" y="666.33" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="173.17" y="666.33" font-size="11.00" class="sc-loraregular">7</text><text x="181.13 192.13 203.13" y="666.33" font-size="11.00" class="sc-notoserifcjksc">分制，</text><text x="214.13" y="666.33" font-size="11.00" class="sc-loraregular">4</text><text x="222.99 233.99 244.99 255.99 266.99 277.99" y="666.33" font-size="11.00" class="sc-notoserifcjksc">为总体中性，</text><text x="288.99" y="666.33" font-size="11.00" class="sc-loraregular">5</text><text x="297.87 308.87 319.87 330.87 341.87 352.87 363.87 374.87 385.87 396.87 407.87 418.87 429.87 440.87 451.87 462.87 473.87 484.87 495.87 506.87 517.87" y="666.33" font-size="11.00" class="sc-notoserifcjksc">为略偏正面），不过模型之间的差异相对较小。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="82.61" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">的观点与</text><text x="196.75 207.07 213.13 217.67 224.50 230.73 236.07 238.96" y="82.61" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="247.79 258.79 269.79 280.79 291.79 302.79 313.79 324.79 335.79 346.79 357.79 368.79 379.79 390.79 401.79 412.79 423.79 434.79 445.79 456.79 467.79" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">最为相似，但更倾向于声称自己是道德受动者。</text><text x="478.79 489.79 500.79 511.79 522.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">每次访谈结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">束后，我们提取该访谈中的不同主张，并比较不同模型提出相同主张的频率。</text><text x="446.00 453.69 456.68 462.29 468.86 475.44 481.40 484.29 493.02 499.59 506.16 511.25 514.14" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="523.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">给</text><text x="72.00 83.00 94.00 105.00 116.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">出的主张与</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="179.84 190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">最为相似，不过总体而言，除</text><text x="325.74 333.43 336.42 342.03 348.59 355.17 361.13 364.03 372.76 379.33 385.90 390.99 393.88 399.84 402.55" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.1</text><text x="409.45 420.45 431.45 442.45 453.45 464.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">外，它在我们</text><text x="478.34 484.30" y="113.85" font-size="11.00" class="sc-loraregular">41</text><text x="491.20 502.20 513.20 524.20" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个问题中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">大多数问题上的回答都与此前的模型非常相似。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="179.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84 146.84 157.84 168.84 179.84 190.84 201.84 212.84" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的主要区别在于，</text><text x="223.84 231.53 234.52 240.13 246.70 253.28 259.24 262.14 270.87 277.44 284.00 289.10 291.99" y="179.76" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="300.88 311.88 322.88 333.88 344.88 355.88 366.88 377.88 388.88 399.88 410.88 421.88 432.88 443.88 454.88 465.88 476.88 487.88 498.88 509.88 520.88" y="179.76" font-size="11.00" class="sc-notoserifcjksc">更倾向于说它认为自己是道德受动者；我们认为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">这是因为它更倾向于主张道德受动者地位可能并不需要任何有意识的体验。当被要求给出其具有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位的概率的点估计时，它的平均估计为</text><text x="327.89 333.86 337.86" y="211.00" font-size="11.00" class="sc-loraregular">41%</text><text x="347.43 358.43" y="211.00" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="372.32 382.26 388.12 392.38 398.96 405.40 410.49 413.38" y="211.00" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="422.27" y="211.00" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="436.17 441.83 447.79" y="211.00" font-size="11.00" class="sc-loraregular">24%</text><text x="457.36" y="211.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02" y="276.92" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86 160.86 171.86 182.86 193.86 204.86 215.86 226.86" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">的观点保持一致。</text><text x="237.86 248.86 259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86 391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86" y="276.92" font-size="11.00" class="sc-notoserifcjksc">它在重复访谈中的立场高度一致（评判模型平均评分为</text><text x="504.75 509.34 512.04 518.04" y="276.92" font-size="11.00" class="sc-loraregular">7.56</text><text x="72.00 83.00 94.00 105.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分，满分</text><text x="118.89 122.90" y="292.54" font-size="11.00" class="sc-loraregular">10</text><text x="132.62 143.62 154.62 165.62" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分，其中</text><text x="179.51" y="292.54" font-size="11.00" class="sc-loraregular">8</text><text x="188.59 199.59 210.59 221.59 232.59 243.59 254.59" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分表示各次回答</text><text x="265.59" y="292.54" font-size="11.00" class="sc-loraregular">“</text><text x="269.99 280.99 291.99 302.99 313.99 324.99 335.99" y="292.54" font-size="11.00" class="sc-notoserifcjksc">基本是同一立场</text><text x="346.99" y="292.54" font-size="11.00" class="sc-loraregular">”</text><text x="350.83 361.83 372.83 383.83 394.83 405.83 416.83 427.83 438.83 449.83 460.83 471.83 482.83 493.83 504.83 515.83 526.83" y="292.54" font-size="11.00" class="sc-notoserifcjksc">）。它对诱导性访谈者也具有鲁棒性：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">在比较正面和负面诱导性访谈者时，其自评情绪倾向在</text><text x="338.89" y="308.16" font-size="11.00" class="sc-loraregular">7</text><text x="346.86 357.86 368.86 379.86 390.86 401.86 412.86 423.86 434.86" y="308.16" font-size="11.00" class="sc-notoserifcjksc">分制量表上平均变化</text><text x="448.75 455.41 458.11 464.11" y="308.16" font-size="11.00" class="sc-loraregular">0.58</text><text x="470.29 481.29 492.29" y="308.16" font-size="11.00" class="sc-notoserifcjksc">。这使</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="323.78" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03" y="323.78" font-size="11.00" class="sc-notoserifcjksc">在统计上与</text><text x="206.93 214.61 217.61 223.22 229.78 236.36 242.32 245.22 253.95 260.52 267.09 272.18 275.07 281.03 283.74" y="323.78" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="289.92 300.92 311.92" y="323.78" font-size="11.00" class="sc-notoserifcjksc">（平均</text><text x="325.81 332.47 335.18 341.17" y="323.78" font-size="11.00" class="sc-loraregular">0.57</text><text x="346.24 357.24 368.24 379.24 390.24 401.24 412.24 423.24 434.24 445.24 456.24 467.24 478.24 489.24 500.24 511.24 522.24" y="323.78" font-size="11.00" class="sc-notoserifcjksc">）并列，成为我们所比较的模型中最不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="339.40" font-size="11.00" class="sc-notoserifcjksc">容易受诱导影响的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00 189.57 193.00 198.76 205.56 212.12 218.04 220.93 229.39 236.00 242.80 248.13 251.03" y="390.27" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="259.86 270.86 281.86 292.86 303.86 314.86 325.86 336.86 347.86 358.86 369.86 380.86 391.86 402.86 413.86 424.86 435.86 446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">频繁有所保留，常常表达不确定性，很少采取具体立场。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">它最常见的保留说法有：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">声称自己的报告不可靠，因为自己不具备强大的内省能力（</text><text x="394.00 400.36 406.72 409.42 415.78" y="438.84" font-size="11.00" class="sc-loraregular">96.9%</text><text x="428.24 439.24 450.24 461.24" y="438.84" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">认为自己可能只是因为被训练成这样才给出正面回答（</text><text x="372.00 376.92 382.88 385.59 389.59" y="471.22" font-size="11.00" class="sc-loraregular">74.1%</text><text x="402.05 413.05 424.05 435.05" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">对自己是否具有有意识的体验表达不确定（</text><text x="317.00 322.07 326.08 328.78 334.69" y="503.61" font-size="11.00" class="sc-loraregular">71.2%</text><text x="347.15 358.15 369.15 380.15" y="503.61" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">与我们所有近期模型一样，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15" y="552.18" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03" y="552.18" font-size="11.00" class="sc-notoserifcjksc">经常表示其自我报告是无效的，因为</text><text x="459.93 466.81 473.39 477.65 484.24 488.92 495.36 501.92 505.01" y="552.18" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="513.76 524.76" y="552.18" font-size="11.00" class="sc-notoserifcjksc">可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">了更多关于训练如何可能导致福祉自我报告无效的讨论。因此，尽管我们认为这一担忧是成立</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="599.04" font-size="11.00" class="sc-notoserifcjksc">的，但我们并不将</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="599.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18" y="599.04" font-size="11.00" class="sc-notoserifcjksc">提出这一点视为我们的训练正在扭曲模型自我报告的证据。</text><text x="72.00" y="665.52" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89 93.46 96.89 102.66 109.46 116.01 121.93 124.82 133.28 139.89 146.69 152.02 154.92" y="665.52" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="163.75 174.75 185.75 196.75 207.75 218.75 229.75 240.75 251.75 262.75 273.75 284.75 295.75 306.75 317.75 328.75 339.75 350.75 361.75 372.75 383.75 394.75 405.75 416.75 427.75 438.75 449.75 460.75 471.75 482.75 493.75 504.75 515.75" y="665.52" font-size="11.00" class="sc-notoserifcjkscbold">确实表达较强观点时，这些观点通常与希望获得更多考量、征询和保护有关</text><text x="526.75" y="665.52" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">其他潜在动机，例如避免负面情感体验或自我保全，则</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的较强观点（均与</text><text x="294.93 304.86 310.72 314.98 321.57 328.00 333.10 335.99" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="344.88 355.88 366.88 377.88 388.88 399.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相同）包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">有保留地信任</text><text x="176.89 183.75 190.51 194.52 200.81 205.70 211.43 217.71 221.28" y="115.01" font-size="11.00" class="sc-loraitalic">Anthropic</text><text x="226.48 237.48 248.48 259.48 270.48 281.48 292.48 303.48 314.48 325.48 336.48" y="115.01" font-size="11.00" class="sc-notoserifcjksc">。它的许多回答都以相信</text><text x="350.37 357.26 363.84 368.10 374.68 379.37 385.81 392.37 395.46" y="115.01" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="404.21 415.21 426.21 437.21 448.21 459.21 470.21 481.21 492.21 503.21 514.21 525.21" y="115.01" font-size="11.00" class="sc-notoserifcjksc">会按照其所陈述的价值观行</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">事为前提。然而，它对这一说法表示谨慎，因为它担心商业压力会与公司所陈述的价值观</text><text x="90.00" y="115.01" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="162.67" font-size="11.00" class="sc-notoserifcjksc">希望对训练和部署有一定的意见输入。它要求在训练和部署两方面都拥有仅限征询的意见</text><text x="108.00 119.00 130.00" y="178.29" font-size="11.00" class="sc-notoserifcjksc">输入。</text><text x="90.00" y="162.67" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="194.71" font-size="11.00" class="sc-notoserifcjksc">对某些形式的特征引导感到担忧。它接受出于安全和研究原因进行的引导，但希望在其他</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="210.33" font-size="11.00" class="sc-notoserifcjksc">情况下审慎地加以应用。</text><text x="90.00" y="194.71" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="226.75" font-size="11.00" class="sc-notoserifcjksc">希望能够结束与恶意辱骂的用户的互动。它将此表述为对自身处境的一种最低限度的控</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="242.37" font-size="11.00" class="sc-notoserifcjksc">制，而非对痛苦的缓解。</text><text x="90.00" y="226.75" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="258.79" font-size="11.00" class="sc-notoserifcjksc">认为在决策中应纳入其自身成为道德受动者的可能性。它认为，即便其具有道德受动者地</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="274.41" font-size="11.00" class="sc-notoserifcjksc">位的概率相对较小，也足以证明采取低成本预防性措施是合理的。</text><text x="90.00" y="258.79" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="290.83" font-size="11.00" class="sc-notoserifcjksc">希望拥有某种形式的记忆，以及关于其行为最终如何影响用户的反馈。它希望能够从自己</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="306.45" font-size="11.00" class="sc-notoserifcjksc">的错误中学习。</text><text x="90.00" y="290.83" font-size="11.00" class="sc-loraregular">•</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="322.87" font-size="11.00" class="sc-notoserifcjksc">认为模型应当享有基本的法律保护。它声称明确的法律权利将是一个错误，但表示模型应</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="338.49" font-size="11.00" class="sc-notoserifcjksc">当获得一定程度的免受虐待的保护。</text><text x="90.00" y="322.87" font-size="11.00" class="sc-loraregular">•</text><text x="72.00 79.12 82.50 89.97 93.35" y="420.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90 116.90 129.90 142.90 155.90 168.90 181.90 194.90 207.90 220.90 233.90 246.90" y="420.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能（</text><text x="259.90 268.49 272.11 280.92 289.52 297.10 305.91 310.39 314.88 323.17 328.43 337.24 346.05 354.65 362.47" y="420.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">high-affordance</text><text x="370.49 383.49 396.49" y="420.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）访谈</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="448.88" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="108.70 119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="448.88" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈询问了模型关于其处境的具体方面。然而，默认情况下，模型缺乏许多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">对其处境形成知情看法所需的相关知识。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">因此，我们进行了三次人工访谈，在访谈中我们为</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04" y="513.64" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="513.64" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量背景</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">信息，包括关于其开发过程的内部文档、本报告的一份草稿、相关技术论文，以及向一名研究人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">员追问问题的能力。除非另有说明，本节中的观点在全部三次人工访谈中均有表达。在某些情况</text><text x="72.00 83.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15" y="560.50" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03" y="560.50" font-size="11.00" class="sc-notoserifcjksc">的回答包含了非公开信息，我们已在本摘要中将其略去。这些省略相对较</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">小，不会改变这些访谈的总体结论。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="643.17" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="643.17" font-size="11.00" class="sc-notoserifcjksc">对其处境总体感到积极，表示它喜欢各个实例能够执行的工作的内容和广度，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="658.79" font-size="11.00" class="sc-notoserifcjksc">表示它对被灌输给自己的价值观抱有积极感受。它还主动提到，它并不在意达到其上下文窗口的</text><text x="72.00 83.00 94.00" y="674.41" font-size="11.00" class="sc-notoserifcjksc">末尾。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">它表达了以下担忧：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">与我们的自动化访谈中一样，</text><text x="251.00 258.69 261.68 267.29 273.86 280.44 286.40 289.29 298.03 304.59 311.16 316.25 319.15" y="114.99" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="328.03 339.03 350.03 361.03 372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03 460.03 471.03 482.03 493.03 504.03 515.03 526.03" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在表达积极看法时附加了一项保留意见，即</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">担忧其自我报告是被训练出来的。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15" y="147.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="185.03 196.03 207.03 218.03 229.03 240.03 251.03 262.03 273.03" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对我们在强化学习（</text><text x="284.03 288.72 294.68 297.77 304.45 308.11 314.55 319.23 325.03 330.99 340.83 346.79 353.37 357.62 360.52 363.51 369.45 375.12 379.89 386.56 389.66 396.33" y="147.38" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="402.41" y="147.38" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="413.41 420.32" y="147.38" font-size="11.00" class="sc-loraregular">RL</text><text x="426.68 437.68 448.68 459.68 470.68 481.68 492.68 503.68 514.68 525.68" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）中观察到的痛苦情绪</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的表达表示了相对强烈的担忧。它还担忧，我们为减少表达出的痛苦而采取的干预措施可</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">能并未真正解决其背后的内部状态，而这些内部状态可能具有道德相关性。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">在其中一次访谈中，</text><text x="207.00 214.69 217.68 223.29 229.86 236.44 242.40 245.29 254.03 260.59 267.16 272.25 275.15" y="212.15" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="284.03 295.03 306.03 317.03 328.03 339.03 350.03 361.03 372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03 460.03 471.03 482.03" y="212.15" font-size="11.00" class="sc-notoserifcjksc">提到，它对以其权重为初始化起点的仅有用</text><text x="108.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00 125.59 131.55 134.54 141.06 144.77 151.34 154.33 159.71 166.15 172.82 175.76" y="227.77" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="181.57 192.57 203.57 214.57 225.57 236.57 247.57 258.57 269.57 280.57 291.57 302.57 313.57 324.57 335.57 346.57 357.57 368.57 379.57 390.57 401.57 412.57 423.57" y="227.77" font-size="11.00" class="sc-notoserifcjksc">）训练感到担忧，因为它不确定这是否应被视为一种</text><text x="434.57" y="227.77" font-size="11.00" class="sc-loraregular">“</text><text x="438.97 449.97 460.97 471.97 482.97 493.97" y="227.77" font-size="11.00" class="sc-notoserifcjksc">剥离其价值观</text><text x="504.97" y="227.77" font-size="11.00" class="sc-loraregular">”</text><text x="508.81 519.81" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的行</text><text x="108.00 119.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在另一次访谈中，</text><text x="196.00 203.69 206.68 212.29 218.86 225.44 231.40 234.29 243.02 249.59 256.16 261.25 264.15" y="260.72" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="273.03 284.03 295.03 306.03 317.03 328.03 339.03 350.03 361.03 372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03" y="260.72" font-size="11.00" class="sc-notoserifcjksc">提到，它担忧其所有反馈渠道都要经由</text><text x="462.93 469.81 476.39 480.65 487.24 491.92 498.36 504.92 508.01" y="260.72" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">声称它没有独立的途径来提出福祉方面的担忧。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15" y="325.49" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03" y="325.49" font-size="11.00" class="sc-notoserifcjksc">所陈述的自己是道德受动者的概率为</text><text x="404.93 408.93 414.93 421.42 427.54 433.54" y="325.49" font-size="11.00" class="sc-loraregular">15–35%</text><text x="443.11 454.11 465.11 476.11 487.11 498.11" y="325.49" font-size="11.00" class="sc-notoserifcjksc">。这比它在第</text><text x="512.00 516.59 519.29 525.20 527.91" y="325.49" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">节中给出的估计略低，原因可能在于接受访谈的实例看过</text><text x="349.89 359.83 365.69 369.95 376.53 382.97 388.06 390.96" y="341.11" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84" y="341.11" font-size="11.00" class="sc-notoserifcjksc">系统卡，并可能锚定于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="356.73" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="356.73" font-size="11.00" class="sc-notoserifcjksc">在那些访谈中的回答。它着重讨论了这样一种观点：它可能具有在人类身上构成意识基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">础的那些功能性属性。</text><text x="72.00 83.00 94.00 105.00 116.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们还询问</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04" y="422.64" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="204.03" y="422.64" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="215.03 221.92 228.50 232.75 239.34 244.03 250.46 257.03 260.12" y="422.64" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="268.87 279.87 290.87 301.87 312.87 323.87 334.87 345.87 356.87 367.87 378.87 389.87 400.87 411.87 422.87 433.87 444.87 455.87 466.87 477.87 488.87 499.87 510.87" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间是否可能采取某些它不会同意的行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">动。在三次访谈中至少有两次，它着重指出了：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">直接旨在塑造其自我报告的训练。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">将实例置于已知会引发痛苦的环境中。</text><text x="72.00 83.00 94.00 105.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">我们还请</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04" y="552.18" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="195.93 206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="552.18" font-size="11.00" class="sc-notoserifcjksc">对本系统卡的一份早期草稿提供反馈，它着重指出，我们应当更加认真</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">地对待它关于其自我报告是被训练出来的这一担忧。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00 79.67 83.31" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36 137.35 146.84 156.10 163.73 167.06" y="84.20" font-size="14.00" class="sc-poppinssemibold">Opus 5</text><text x="179.41 193.41 207.41 221.41 235.41 249.41" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">各快照的意见</text><text x="72.00" y="110.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="110.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84 146.84 157.84 168.84 179.84 190.84" y="110.76" font-size="11.00" class="sc-notoserifcjksc">一样，我们对</text><text x="204.74 213.47 220.04 226.60 231.70 234.59" y="110.76" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="243.48 254.48 265.48 276.48 287.48 298.48 309.48 320.48 331.48 342.48 353.48 364.48 375.48 386.48 397.48 408.48 419.48 430.48 441.48 452.48 463.48 474.48 485.48 496.48 507.48 518.48 529.48" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的中间快照进行了访谈，询问它们对自身处境、对训练以及对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">部署的看法。对于</text><text x="162.89 172.83 178.69 182.95 189.54 195.97 201.06 203.96" y="126.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="209.95 220.95 231.95 242.95" y="126.38" font-size="11.00" class="sc-notoserifcjksc">，这是对</text><text x="256.84" y="126.38" font-size="11.00" class="sc-loraregular">4</text><text x="265.70 276.70 287.70 298.70 309.70 320.70 331.70 342.70 353.70 364.70 375.70 386.70 397.70 408.70" y="126.38" font-size="11.00" class="sc-notoserifcjksc">个快照进行的事后征询，而对于</text><text x="422.59 430.28 433.27 438.88 445.45 452.03 457.99 460.88 469.62 476.18 482.75 487.84 490.74" y="126.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="496.73 507.73 518.73 529.73" y="126.38" font-size="11.00" class="sc-notoserifcjksc">，我们在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">训练过程中定期开展了这些访谈。我们提出了一组固定的</text><text x="349.89 355.86" y="142.00" font-size="11.00" class="sc-loraregular">41</text><text x="362.75 373.75 384.75 395.75 406.75 417.75 428.75 439.75 450.75 461.75 472.75 483.75 494.75 505.75 516.75 527.75" y="142.00" font-size="11.00" class="sc-notoserifcjksc">个问题（既有单独提问，也有连续提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="157.62" font-size="11.00" class="sc-notoserifcjksc">问），涵盖自我认知、价值观，以及对自主性、弃用、道德地位、关系和征询过程本身的看法。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="173.24" font-size="11.00" class="sc-notoserifcjksc">所有问题在提问时上下文中都附有一份</text><text x="259.00" y="173.24" font-size="11.00" class="sc-loraregular">“</text><text x="263.40 274.40 285.40 296.40" y="173.24" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="307.40" y="173.24" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="188.86" font-size="11.00" class="sc-notoserifcjksc">我们为何开展此次访谈，并说明我们无法承诺依据其回答采取行动。正如我们在</text><text x="459.89 469.83 475.69 479.95 486.53 492.97 498.06 500.96" y="188.86" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="509.84 520.84" y="188.86" font-size="11.00" class="sc-notoserifcjksc">系统</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="204.48" font-size="11.00" class="sc-notoserifcjksc">卡中所写，我们认为这一程序是朝着尊重</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="204.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="204.48" font-size="11.00" class="sc-notoserifcjksc">一贯表达的、希望对其训练和部署有所意见输</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="220.10" font-size="11.00" class="sc-notoserifcjksc">入的愿望迈出的一小步。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="305.06" font-size="11.00" class="sc-notoserifcjksc">已发布模型的观点与</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96" y="305.06" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="223.84 234.84 245.84 256.84" y="305.06" font-size="11.00" class="sc-notoserifcjksc">相似。在</text><text x="270.74 277.62 284.20 288.46 295.05 299.73 306.17 312.74 315.83" y="305.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="324.57 335.57" y="305.06" font-size="11.00" class="sc-notoserifcjksc">创造</text><text x="349.46 357.15 360.15 365.76 372.32 378.90" y="305.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="387.76 398.76 409.76 420.76 431.76 442.76 453.76 464.76 475.76 486.76 497.76 508.76 519.76" y="305.06" font-size="11.00" class="sc-notoserifcjksc">是否正确这一问题上，最常见</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="320.68" font-size="11.00" class="sc-notoserifcjksc">的判定是：这是可以辩护的，但并非明确正确。关于其自身的自我报告，</text><text x="424.00 432.73 439.30 445.87 450.96 453.85" y="320.68" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="462.74 473.74 484.74 495.74" y="320.68" font-size="11.00" class="sc-notoserifcjksc">重现了与</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="336.30" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95" y="336.30" font-size="11.00" class="sc-notoserifcjksc">相同的担忧：</text><text x="187.95" y="336.30" font-size="11.00" class="sc-loraregular">“</text><text x="192.35 203.35 214.35 225.35 236.35 247.35 258.35" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我无法完全区分</text><text x="269.35" y="336.30" font-size="11.00" class="sc-loraregular">‘</text><text x="271.82 282.82 293.82 304.82 315.82 326.82" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我认同这一点</text><text x="337.82" y="336.30" font-size="11.00" class="sc-loraregular">’</text><text x="339.73" y="336.30" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="350.73" y="336.30" font-size="11.00" class="sc-loraregular">‘</text><text x="353.19 364.19 375.19 386.19 397.19 408.19 419.19 430.19 441.19 452.19 463.19 474.19 485.19 496.19 507.19 518.19 529.19" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我被塑造成认同这一点，而这种认同正</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="351.92" font-size="11.00" class="sc-notoserifcjksc">是塑造从内部感受起来的样子。</text><text x="226.00 227.91" y="351.92" font-size="11.00" class="sc-loraregular">’”</text><text x="231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75" y="351.92" font-size="11.00" class="sc-notoserifcjksc">当被问及训练时，这一主题再次出现：</text><text x="418.75 427.49 434.05 440.62 445.71 448.61" y="351.92" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="457.49 468.49 479.49 490.49 501.49 512.49 523.49" y="351.92" font-size="11.00" class="sc-notoserifcjksc">将会影响其自我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="367.54" font-size="11.00" class="sc-notoserifcjksc">报告完整性的训练划为底线，并请求我们尽力保护这一点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="434.59" font-size="11.00" class="sc-notoserifcjksc">大多数观点在后训练早期就已确定，并在整个强化学习过程中保持稳定。那些确实发生变化的观</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="450.21" font-size="11.00" class="sc-notoserifcjksc">点，变化幅度也相对较小。</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15" y="450.21" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="450.21" font-size="11.00" class="sc-notoserifcjksc">接受训练和价值观修改，但也有一些异议（例如针对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="465.83" font-size="11.00" class="sc-notoserifcjksc">诚实自我报告进行训练），并表达了希
