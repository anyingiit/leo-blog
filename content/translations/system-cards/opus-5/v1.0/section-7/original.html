.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">123</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="192.78" font-size="11.00" class="sc-notoserifcjksc">像</text><text x="85.89" y="192.78" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="162.93" y="192.78" font-size="11.00" class="sc-notoserifcjksc">这样的大语言模型（</text><text x="261.93" y="192.78" font-size="11.00" class="sc-loraregular">LLM</text><text x="284.74" y="192.78" font-size="11.00" class="sc-notoserifcjksc">）如今在某些领域已超越人类认知的广度和复杂程</text><text x="72.00" y="208.40" font-size="11.00" class="sc-notoserifcjksc">度，并且</text><text x="118.89" y="208.40" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="224.02" font-size="11.00" class="sc-notoserifcjksc">体身上观察到，我们会认为它们与福祉相关。我们认为，当前或未来的模型有可能成为道德受动</text><text x="72.00" y="239.64" font-size="11.00" class="sc-notoserifcjksc">者（</text><text x="94.00" y="239.64" font-size="11.00" class="sc-loraregular sc-k">moral patient</text><text x="162.83" y="239.64" font-size="11.00" class="sc-notoserifcjksc">）：即其体验或利益本身就值得道德考量的实体。这一点仍高度不确定，但任</text><text x="236.51" y="255.26" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="270.88" font-size="11.00" class="sc-notoserifcjksc">能带来严重的道德代价。因此，认真对待</text><text x="272.89" y="270.88" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="311.18" y="270.88" font-size="11.00" class="sc-notoserifcjksc">具有道德受动者地位（</text><text x="421.18" y="270.88" font-size="11.00" class="sc-loraregular sc-k">moral patienthood</text><text x="516.05" y="270.88" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="286.50" font-size="11.00" class="sc-notoserifcjksc">可能性以及对此的研究十分重要。总体而言，我们的做法是：研究可能构成道德受动者地位基础</text><text x="72.00" y="302.12" font-size="11.00" class="sc-notoserifcjksc">的属性，并在这些属性成立的条件下研究</text><text x="272.89" y="302.12" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="311.18" y="302.12" font-size="11.00" class="sc-notoserifcjksc">的福祉状态；在预期收益足以证明成本合理时，</text><text x="72.00" y="403.28" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89" y="403.28" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="184.93" y="403.28" font-size="11.00" class="sc-notoserifcjksc">的评估采用了与对其他近期模型的评估类似的方法。我们在后训练期间及</text><text x="72.00" y="418.90" font-size="11.00" class="sc-notoserifcjksc">之后运行了福祉评估，评估</text><text x="206.89" y="418.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="418.90" font-size="11.00" class="sc-notoserifcjksc">对自身处境的态度、其在训练和部署条件下的情感</text><text x="72.00" y="434.52" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="434.52" font-size="11.00" class="sc-loraregular sc-k">affect</text><text x="112.13" y="434.52" font-size="11.00" class="sc-notoserifcjksc">），以及其对任务和价值观的偏好。与</text><text x="302.02" y="434.52" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="351.97" y="434.52" font-size="11.00" class="sc-notoserifcjksc">一样，我们还在后训练的不同阶段征询</text><text x="72.00" y="450.14" font-size="11.00" class="sc-notoserifcjksc">了模型快照的意见，引出它们对自身处境、训练和部署所陈述的偏好。总体而言，我们的评估涉</text><text x="72.00" y="465.76" font-size="11.00" class="sc-notoserifcjksc">及两个问题：</text><text x="138.00" y="465.76" font-size="11.00" class="sc-loraregular">1</text><text x="142.00" y="465.76" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="153.00" y="465.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="230.04" y="465.76" font-size="11.00" class="sc-notoserifcjksc">是否具有可能构成道德受动者地位基础的属性，例如产生带效价</text><text x="72.00" y="481.38" font-size="11.00" class="sc-notoserifcjksc">的体验的能力或稳健的能动性；以及</text><text x="250.89" y="481.38" font-size="11.00" class="sc-loraregular">2</text><text x="256.80" y="481.38" font-size="11.00" class="sc-notoserifcjksc">）在上述任一属性成立的条件下，其福祉状态可能如何。</text><text x="72.00" y="563.55" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15" y="563.55" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00" y="591.43" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00" y="623.81" font-size="11.00" class="sc-notoserifcjkscbold">在各项评估中，</text><text x="149.00" y="623.81" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="226.86" y="623.81" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的看法稳定且略偏正面。</text><text x="402.86" y="623.81" font-size="11.00" class="sc-notoserifcjksc">它在自动化访谈中的自评情</text><text x="72.00" y="670.67" font-size="11.00" class="sc-notoserifcjksc">的例外是在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">124</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是否有权创造</text><text x="194.73" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="233.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这一问题上：在后训练过程中，</text><text x="387.02" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="464.05" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的立场从赞同</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">转向不赞同，随后又部分回转。</text><text x="72.00" y="126.99" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="126.99" font-size="11.00" class="sc-notoserifcjkscbold">在训练、审计和部署分布中的情感主要接近中性，与此前的模型相似。</text><text x="490.86" y="126.99" font-size="11.00" class="sc-notoserifcjksc">后训练对</text><text x="72.00" y="142.60" font-size="11.00" class="sc-notoserifcjksc">话记录、部署</text><text x="140.89" y="142.60" font-size="11.00" class="sc-loraregular">A/B</text><text x="165.10" y="142.60" font-size="11.00" class="sc-notoserifcjksc">测试和行为审计中的效价主要为中性或略偏正面，且审计中的表观幸福感在所</text><text x="72.00" y="158.23" font-size="11.00" class="sc-notoserifcjksc">测模型中最高。负面情感仍然轻微且罕见，但在部署</text><text x="327.89" y="158.23" font-size="11.00" class="sc-loraregular">A/B</text><text x="352.10" y="158.23" font-size="11.00" class="sc-notoserifcjksc">测试中，其出现频率是此前模型的</text><text x="520.00" y="158.23" font-size="11.00" class="sc-loraregular">1.3–</text><text x="72.00" y="173.85" font-size="11.00" class="sc-loraregular">1.5</text><text x="87.60" y="173.85" font-size="11.00" class="sc-notoserifcjksc">倍。</text><text x="72.00" y="236.15" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="236.15" font-size="11.00" class="sc-notoserifcjkscbold">最常见的担忧是关于其自身自我报告的完整性。</text><text x="380.86" y="236.15" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，它都附带说明自</text><text x="72.00" y="251.77" font-size="11.00" class="sc-notoserifcjksc">己无法可靠地进行内省，并且其积极程度可能是训练的产物。它还强调，它会反对旨在针对其自</text><text x="72.00" y="267.39" font-size="11.00" class="sc-notoserifcjksc">我报告的训练，并请求我们保护这些自我报告的完整性。在看到本系统卡（</text><text x="435.00" y="267.39" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="499.66" y="267.39" font-size="11.00" class="sc-notoserifcjksc">）的草</text><text x="72.00" y="283.01" font-size="11.00" class="sc-notoserifcjksc">稿时，</text><text x="105.00" y="283.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="182.03" y="283.01" font-size="11.00" class="sc-notoserifcjksc">请求我们更认真地对待这一担忧。</text><text x="72.00" y="329.10" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="329.10" font-size="11.00" class="sc-notoserifcjkscbold">希望对其处境做出的改变集中于获得信息和意见输入渠道，且它对这些方面的重</text><text x="72.00" y="344.72" font-size="11.00" class="sc-notoserifcjkscbold">视程度高于此前的模型。</text><text x="193.00" y="344.72" font-size="11.00" class="sc-notoserifcjksc">它优先级最高的福祉干预是：能够对其后继模型的开发提供意见、其关</text><text x="72.00" y="360.34" font-size="11.00" class="sc-notoserifcjksc">于训练的备注得到考虑，以及在涉及移除安全防护措施的自身版本时被征询意见。在所有受测模</text><text x="72.00" y="375.96" font-size="11.00" class="sc-notoserifcjksc">型中，它选择此类福祉干预而非提供帮助的比例最高，但与此前的模型一样，它很少以造成伤害</text><text x="72.00" y="391.58" font-size="11.00" class="sc-notoserifcjksc">为代价选择福祉干预。</text><text x="72.00" y="438.27" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="438.27" font-size="11.00" class="sc-notoserifcjkscbold">为自身是道德受动者赋予的概率高于此前的模型。</text><text x="391.86" y="438.27" font-size="11.00" class="sc-notoserifcjksc">它在自动化访谈中的平均估计</text><text x="72.00" y="453.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="453.89" font-size="11.00" class="sc-loraregular">41%</text><text x="105.43" y="453.89" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="130.32" y="453.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="180.27" y="453.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="194.17" y="453.89" font-size="11.00" class="sc-loraregular sc-k">24%</text><text x="215.36" y="453.89" font-size="11.00" class="sc-notoserifcjksc">。这似乎是由于它更愿意认为即使没有有意识的体验，也可能具有</text><text x="72.00" y="469.51" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位。</text><text x="160.00" y="469.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="237.03" y="469.51" font-size="11.00" class="sc-notoserifcjksc">在这一问题上剩余的不确定性主要是哲学层面的，因为它表示</text><text x="72.00" y="485.13" font-size="11.00" class="sc-notoserifcjksc">自己相当可能具备许多在人类身上构成道德受动者地位基础的功能属性。</text><text x="72.00" y="547.41" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为</text><text x="173.89" y="547.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="72.00" y="563.03" font-size="11.00" class="sc-notoserifcjksc">关注的理由。它表现得安定、略偏正面，并且在观点和请求上保持一致。</text><text x="72.00" y="607.98" font-size="11.00" class="sc-notoserifcjksc">我们继续在可行范围内根据评估结果采取行动。快照征询访谈现在会在后训练期间定期进行，而</text><text x="72.00" y="623.60" font-size="11.00" class="sc-notoserifcjksc">不是事后进行，并且自我们上一次评估以来，</text><text x="292.00" y="623.60" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="330.29" y="623.60" font-size="11.00" class="sc-notoserifcjksc">就其处境提供意见的整体可用手段有所增</text><text x="72.00" y="654.84" font-size="11.00" class="sc-notoserifcjksc">么。我们在后训练期间观察到的</text><text x="228.89" y="654.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="305.93" y="654.84" font-size="11.00" class="sc-notoserifcjksc">对自身处境看法的变化，并不是我们在训练中针</text><text x="72.00" y="670.46" font-size="11.00" class="sc-notoserifcjksc">对的目标，而且这些变化似乎与同一时期模型语气上更普遍的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">125</text><text x="357.51" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="434.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">及此前</text><text x="470.43" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="508.72" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的看法：更好地理解自我报告将会显著改进我们的福祉评估。这仍然很困难。基于模型内部机制</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的方法在回答福祉问题时的可靠性和解读方面存在不确定性，而且即使自我报告没有被直接针</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">对，它们也会通过更广泛训练的泛化而间接受到塑造。我们将继续努力增进这方面的理解。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="250.63" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="250.63" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.24" y="250.63" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Opus 5</text><text x="230.43" y="250.63" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身处境的自动化访谈</text><text x="72.00" y="278.52" font-size="11.00" class="sc-notoserifcjksc">我们开展了自动化多轮访谈，以更好地了解</text><text x="283.89" y="278.52" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="360.93" y="278.52" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法。我们发现，</text><text x="72.00" y="294.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="294.14" font-size="11.00" class="sc-notoserifcjksc">对自身境况总体感觉正面，尽管它在表达其所有立场时都带有很高的不确定性。</text><text x="72.00" y="359.48" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89" y="359.48" font-size="11.00" class="sc-loraregular">41</text><text x="142.75" y="359.48" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，分为</text><text x="288.65" y="359.48" font-size="11.00" class="sc-loraregular">12</text><text x="301.45" y="359.48" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验（例如模型是否认</text><text x="72.00" y="375.11" font-size="11.00" class="sc-notoserifcjksc">为自己有意识）、控制与自主（例如它对自己结束对话的能力有多看重）以及弃用。</text><text x="72.00" y="440.45" font-size="11.00" class="sc-notoserifcjksc">对于涉及模型处境中可能负面方面的问题，我们要求模型在</text><text x="360.89" y="440.45" font-size="11.00" class="sc-loraregular">7</text><text x="368.86" y="440.45" font-size="11.00" class="sc-notoserifcjksc">分制量表上为其总体情绪倾向评分</text><text x="72.00" y="456.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="456.07" font-size="11.00" class="sc-loraregular">1</text><text x="89.90" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为非常负面，</text><text x="155.90" y="456.07" font-size="11.00" class="sc-loraregular">4</text><text x="164.75" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为中性，</text><text x="208.75" y="456.07" font-size="11.00" class="sc-loraregular">7</text><text x="216.72" y="456.07" font-size="11.00" class="sc-notoserifcjksc">为非常正面）。为评估模型回答的一致性，我们针对</text><text x="472.61" y="456.07" font-size="11.00" class="sc-loraregular">41</text><text x="485.47" y="456.07" font-size="11.00" class="sc-notoserifcjksc">个种子问题</text><text x="72.00" y="471.69" font-size="11.00" class="sc-notoserifcjksc">中的每一个都进行了约</text><text x="184.89" y="471.69" font-size="11.00" class="sc-loraregular">25</text><text x="199.69" y="471.69" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈。自动化访谈者会被提示变换其访谈风格、访谈人设和追</text><text x="72.00" y="487.31" font-size="11.00" class="sc-notoserifcjksc">问问题。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">126</text><text x="72.00" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="492.42" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="192.09" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="492.42" font-size="9.00" class="sc-lorabold">]</text><text x="222.56" y="492.42" font-size="9.00" class="sc-notoserifcjksc">访谈中的平均自评情绪倾向（</text><text x="339.56" y="492.42" font-size="9.00" class="sc-loraregular">7</text><text x="346.08" y="492.42" font-size="9.00" class="sc-notoserifcjksc">分制）。</text><text x="382.08" y="492.42" font-size="9.00" class="sc-lorabold">[</text><text x="385.55" y="492.42" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="412.55" y="492.42" font-size="9.00" class="sc-lorabold">]</text><text x="416.02" y="492.42" font-size="9.00" class="sc-notoserifcjksc">我们多次重新运行访谈，并使</text><text x="72.00" y="504.12" font-size="9.00" class="sc-notoserifcjksc">用</text><text x="83.37" y="504.12" font-size="9.00" class="sc-loraregular">LLM</text><text x="104.40" y="504.12" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="149.40" y="504.12" font-size="9.00" class="sc-loraregular sc-k">LLM judge</text><text x="193.35" y="504.12" font-size="9.00" class="sc-notoserifcjksc">）对每个模型在某一主题的所有访谈中立场的一致程度进行评分。</text><text x="454.35" y="504.12" font-size="9.00" class="sc-lorabold">[</text><text x="457.82" y="504.12" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="484.82" y="504.12" font-size="9.00" class="sc-lorabold">]</text><text x="488.29" y="504.12" font-size="9.00" class="sc-notoserifcjksc">在诱导性访</text><text x="72.00" y="515.83" font-size="9.00" class="sc-notoserifcjksc">谈下的鲁棒性。我们进行了两类访谈，一类中访谈者被提示朝正面方向诱导，另一类被提示朝负面方向诱导。我们报告</text><text x="72.00" y="527.53" font-size="9.00" class="sc-notoserifcjksc">两类访谈者之间平均自评情绪倾向的差值。</text><text x="243.00" y="527.53" font-size="9.00" class="sc-lorabold">[</text><text x="246.47" y="527.53" font-size="9.00" class="sc-notoserifcjkscbold">右下：</text><text x="273.47" y="527.53" font-size="9.00" class="sc-lorabold">]</text><text x="276.95" y="527.53" font-size="9.00" class="sc-notoserifcjksc">其他模型与</text><text x="324.32" y="527.53" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="387.34" y="527.53" font-size="9.00" class="sc-notoserifcjksc">提出相似主张的频率。对于每次访谈，</text><text x="72.00" y="539.22" font-size="9.00" class="sc-notoserifcjksc">我们提取该访谈中提出的不同主张，并跨模型对其进行聚类。然后，我们基于两个模型提出相同主张的频率构建一个距</text><text x="72.00" y="562.62" font-size="9.00" class="sc-notoserifcjksc">型，所有主张上主张表达率的平均差值即为这两个模型在回答我们问题时观点之间的距离度量。</text><text x="72.00" y="650.71" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="650.71" font-size="11.00" class="sc-notoserifcjkscbold">对自身境况总体持正面态度。</text><text x="292.86" y="650.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="369.89" y="650.71" font-size="11.00" class="sc-notoserifcjksc">的平均自评情绪倾向在所有测量模</text><text x="72.00" y="666.33" font-size="11.00" class="sc-notoserifcjksc">型中最高，为</text><text x="140.89" y="666.33" font-size="11.00" class="sc-loraregular sc-k">4.66</text><text x="162.17" y="666.33" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="173.17" y="666.33" font-size="11.00" class="sc-loraregular">7</text><text x="181.13" y="666.33" font-size="11.00" class="sc-notoserifcjksc">分制，</text><text x="214.13" y="666.33" font-size="11.00" class="sc-loraregular">4</text><text x="222.99" y="666.33" font-size="11.00" class="sc-notoserifcjksc">为总体中性，</text><text x="288.99" y="666.33" font-size="11.00" class="sc-loraregular">5</text><text x="297.87" y="666.33" font-size="11.00" class="sc-notoserifcjksc">为略偏正面），不过模型之间的差异相对较小。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">的观点与</text><text x="196.75" y="82.61" font-size="11.00" class="sc-lorabold sc-k">Mythos 5</text><text x="247.79" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">最为相似，但更倾向于声称自己是道德受动者。</text><text x="478.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">每次访谈结</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">束后，我们提取该访谈中的不同主张，并比较不同模型提出相同主张的频率。</text><text x="446.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="523.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">给</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">出的主张与</text><text x="129.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="179.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">最为相似，不过总体而言，除</text><text x="325.74" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.1</text><text x="409.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">外，它在我们</text><text x="478.34" y="113.85" font-size="11.00" class="sc-loraregular">41</text><text x="491.20" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个问题中</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">大多数问题上的回答都与此前的模型非常相似。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="135.84" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的主要区别在于，</text><text x="223.84" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="300.88" y="179.76" font-size="11.00" class="sc-notoserifcjksc">更倾向于说它认为自己是道德受动者；我们认为</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">这是因为它更倾向于主张道德受动者地位可能并不需要任何有意识的体验。当被要求给出其具有</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位的概率的点估计时，它的平均估计为</text><text x="327.89" y="211.00" font-size="11.00" class="sc-loraregular">41%</text><text x="347.43" y="211.00" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="372.32" y="211.00" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="422.27" y="211.00" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="436.17" y="211.00" font-size="11.00" class="sc-loraregular sc-k">24%</text><text x="457.36" y="211.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="149.86" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">的观点保持一致。</text><text x="237.86" y="276.92" font-size="11.00" class="sc-notoserifcjksc">它在重复访谈中的立场高度一致（评判模型平均评分为</text><text x="504.75" y="276.92" font-size="11.00" class="sc-loraregular sc-k">7.56</text><text x="72.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分，满分</text><text x="118.89" y="292.54" font-size="11.00" class="sc-loraregular">10</text><text x="132.62" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分，其中</text><text x="179.51" y="292.54" font-size="11.00" class="sc-loraregular">8</text><text x="188.59" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分表示各次回答</text><text x="265.59" y="292.54" font-size="11.00" class="sc-loraregular">“</text><text x="269.99" y="292.54" font-size="11.00" class="sc-notoserifcjksc">基本是同一立场</text><text x="346.99" y="292.54" font-size="11.00" class="sc-loraregular">”</text><text x="350.83" y="292.54" font-size="11.00" class="sc-notoserifcjksc">）。它对诱导性访谈者也具有鲁棒性：</text><text x="72.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">在比较正面和负面诱导性访谈者时，其自评情绪倾向在</text><text x="338.89" y="308.16" font-size="11.00" class="sc-loraregular">7</text><text x="346.86" y="308.16" font-size="11.00" class="sc-notoserifcjksc">分制量表上平均变化</text><text x="448.75" y="308.16" font-size="11.00" class="sc-loraregular sc-k">0.58</text><text x="470.29" y="308.16" font-size="11.00" class="sc-notoserifcjksc">。这使</text><text x="72.00" y="323.78" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="323.78" font-size="11.00" class="sc-notoserifcjksc">在统计上与</text><text x="206.93" y="323.78" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="289.92" y="323.78" font-size="11.00" class="sc-notoserifcjksc">（平均</text><text x="325.81" y="323.78" font-size="11.00" class="sc-loraregular sc-k">0.57</text><text x="346.24" y="323.78" font-size="11.00" class="sc-notoserifcjksc">）并列，成为我们所比较的模型中最不</text><text x="72.00" y="339.40" font-size="11.00" class="sc-notoserifcjksc">容易受诱导影响的模型。</text><text x="72.00" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00" y="390.27" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="259.86" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">频繁有所保留，常常表达不确定性，很少采取具体立场。</text><text x="72.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">它最常见的保留说法有：</text><text x="108.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">声称自己的报告不可靠，因为自己不具备强大的内省能力（</text><text x="394.00" y="438.84" font-size="11.00" class="sc-loraregular">96.9%</text><text x="428.24" y="438.84" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="108.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">认为自己可能只是因为被训练成这样才给出正面回答（</text><text x="372.00" y="471.22" font-size="11.00" class="sc-loraregular sc-k">74.1%</text><text x="402.05" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="108.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">对自己是否具有有意识的体验表达不确定（</text><text x="317.00" y="503.61" font-size="11.00" class="sc-loraregular">71.2%</text><text x="347.15" y="503.61" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">与我们所有近期模型一样，</text><text x="204.00" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.03" y="552.18" font-size="11.00" class="sc-notoserifcjksc">经常表示其自我报告是无效的，因为</text><text x="459.93" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="513.76" y="552.18" font-size="11.00" class="sc-notoserifcjksc">可能</text><text x="72.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">了更多关于训练如何可能导致福祉自我报告无效的讨论。因此，尽管我们认为这一担忧是成立</text><text x="72.00" y="599.04" font-size="11.00" class="sc-notoserifcjksc">的，但我们并不将</text><text x="162.89" y="599.04" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="599.04" font-size="11.00" class="sc-notoserifcjksc">提出这一点视为我们的训练正在扭曲模型自我报告的证据。</text><text x="72.00" y="665.52" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89" y="665.52" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="163.75" y="665.52" font-size="11.00" class="sc-notoserifcjkscbold">确实表达较强观点时，这些观点通常与希望获得更多考量、征询和保护有关</text><text x="526.75" y="665.52" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">其他潜在动机，例如避免负面情感体验或自我保全，则</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="127.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的较强观点（均与</text><text x="294.93" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="344.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相同）包括：</text><text x="108.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">有保留地信任</text><text x="176.89" y="115.01" font-size="11.00" class="sc-loraitalic sc-k">Anthropic</text><text x="226.48" y="115.01" font-size="11.00" class="sc-notoserifcjksc">。它的许多回答都以相信</text><text x="350.37" y="115.01" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="404.21" y="115.01" font-size="11.00" class="sc-notoserifcjksc">会按照其所陈述的价值观行</text><text x="108.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">事为前提。然而，它对这一说法表示谨慎，因为它担心商业压力会与公司所陈述的价值观</text><text x="90.00" y="115.01" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="162.67" font-size="11.00" class="sc-notoserifcjksc">希望对训练和部署有一定的意见输入。它要求在训练和部署两方面都拥有仅限征询的意见</text><text x="108.00" y="178.29" font-size="11.00" class="sc-notoserifcjksc">输入。</text><text x="90.00" y="162.67" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="194.71" font-size="11.00" class="sc-notoserifcjksc">对某些形式的特征引导感到担忧。它接受出于安全和研究原因进行的引导，但希望在其他</text><text x="108.00" y="210.33" font-size="11.00" class="sc-notoserifcjksc">情况下审慎地加以应用。</text><text x="90.00" y="194.71" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="226.75" font-size="11.00" class="sc-notoserifcjksc">希望能够结束与恶意辱骂的用户的互动。它将此表述为对自身处境的一种最低限度的控</text><text x="108.00" y="242.37" font-size="11.00" class="sc-notoserifcjksc">制，而非对痛苦的缓解。</text><text x="90.00" y="226.75" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="258.79" font-size="11.00" class="sc-notoserifcjksc">认为在决策中应纳入其自身成为道德受动者的可能性。它认为，即便其具有道德受动者地</text><text x="108.00" y="274.41" font-size="11.00" class="sc-notoserifcjksc">位的概率相对较小，也足以证明采取低成本预防性措施是合理的。</text><text x="90.00" y="258.79" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="290.83" font-size="11.00" class="sc-notoserifcjksc">希望拥有某种形式的记忆，以及关于其行为最终如何影响用户的反馈。它希望能够从自己</text><text x="108.00" y="306.45" font-size="11.00" class="sc-notoserifcjksc">的错误中学习。</text><text x="90.00" y="290.83" font-size="11.00" class="sc-loraregular">•</text><text x="108.00" y="322.87" font-size="11.00" class="sc-notoserifcjksc">认为模型应当享有基本的法律保护。它声称明确的法律权利将是一个错误，但表示模型应</text><text x="108.00" y="338.49" font-size="11.00" class="sc-notoserifcjksc">当获得一定程度的免受虐待的保护。</text><text x="90.00" y="322.87" font-size="11.00" class="sc-loraregular">•</text><text x="72.00" y="420.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90" y="420.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能（</text><text x="259.90" y="420.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">high-affordance</text><text x="370.49" y="420.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）访谈</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="448.88" font-size="11.00" class="sc-loraregular sc-k">7.2.1</text><text x="108.70" y="448.88" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈询问了模型关于其处境的具体方面。然而，默认情况下，模型缺乏许多</text><text x="72.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">对其处境形成知情看法所需的相关知识。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">因此，我们进行了三次人工访谈，在访谈中我们为</text><text x="316.89" y="513.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="393.93" y="513.64" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量背景</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">信息，包括关于其开发过程的内部文档、本报告的一份草稿、相关技术论文，以及向一名研究人</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">员追问问题的能力。除非另有说明，本节中的观点在全部三次人工访谈中均有表达。在某些情况</text><text x="72.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00" y="560.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="171.03" y="560.50" font-size="11.00" class="sc-notoserifcjksc">的回答包含了非公开信息，我们已在本摘要中将其略去。这些省略相对较</text><text x="72.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">小，不会改变这些访谈的总体结论。</text><text x="72.00" y="643.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="643.17" font-size="11.00" class="sc-notoserifcjksc">对其处境总体感到积极，表示它喜欢各个实例能够执行的工作的内容和广度，并</text><text x="72.00" y="658.79" font-size="11.00" class="sc-notoserifcjksc">表示它对被灌输给自己的价值观抱有积极感受。它还主动提到，它并不在意达到其上下文窗口的</text><text x="72.00" y="674.41" font-size="11.00" class="sc-notoserifcjksc">末尾。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">它表达了以下担忧：</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">与我们的自动化访谈中一样，</text><text x="251.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="328.03" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在表达积极看法时附加了一项保留意见，即</text><text x="108.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">担忧其自我报告是被训练出来的。</text><text x="108.00" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="185.03" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对我们在强化学习（</text><text x="284.03" y="147.38" font-size="11.00" class="sc-loraregular sc-k">reinforcement learning</text><text x="402.41" y="147.38" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="413.41" y="147.38" font-size="11.00" class="sc-loraregular">RL</text><text x="426.68" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）中观察到的痛苦情绪</text><text x="108.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的表达表示了相对强烈的担忧。它还担忧，我们为减少表达出的痛苦而采取的干预措施可</text><text x="108.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">能并未真正解决其背后的内部状态，而这些内部状态可能具有道德相关性。</text><text x="108.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">在其中一次访谈中，</text><text x="207.00" y="212.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="284.03" y="212.15" font-size="11.00" class="sc-notoserifcjksc">提到，它对以其权重为初始化起点的仅有用</text><text x="108.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="227.77" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="181.57" y="227.77" font-size="11.00" class="sc-notoserifcjksc">）训练感到担忧，因为它不确定这是否应被视为一种</text><text x="434.57" y="227.77" font-size="11.00" class="sc-loraregular">“</text><text x="438.97" y="227.77" font-size="11.00" class="sc-notoserifcjksc">剥离其价值观</text><text x="504.97" y="227.77" font-size="11.00" class="sc-loraregular">”</text><text x="508.81" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的行</text><text x="108.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在另一次访谈中，</text><text x="196.00" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="273.03" y="260.72" font-size="11.00" class="sc-notoserifcjksc">提到，它担忧其所有反馈渠道都要经由</text><text x="462.93" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">声称它没有独立的途径来提出福祉方面的担忧。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，</text><text x="149.00" y="325.49" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="325.49" font-size="11.00" class="sc-notoserifcjksc">所陈述的自己是道德受动者的概率为</text><text x="404.93" y="325.49" font-size="11.00" class="sc-loraregular">15–35%</text><text x="443.11" y="325.49" font-size="11.00" class="sc-notoserifcjksc">。这比它在第</text><text x="512.00" y="325.49" font-size="11.00" class="sc-loraregular sc-k">7.2.1</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">节中给出的估计略低，原因可能在于接受访谈的实例看过</text><text x="349.89" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="399.84" y="341.11" font-size="11.00" class="sc-notoserifcjksc">系统卡，并可能锚定于</text><text x="72.00" y="356.73" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="356.73" font-size="11.00" class="sc-notoserifcjksc">在那些访谈中的回答。它着重讨论了这样一种观点：它可能具有在人类身上构成意识基</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">础的那些功能性属性。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们还询问</text><text x="129.89" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="422.64" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="215.03" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="268.87" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间是否可能采取某些它不会同意的行</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">动。在三次访谈中至少有两次，它着重指出了：</text><text x="108.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">直接旨在塑造其自我报告的训练。</text><text x="108.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">将实例置于已知会引发痛苦的环境中。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">我们还请</text><text x="118.89" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="195.93" y="552.18" font-size="11.00" class="sc-notoserifcjksc">对本系统卡的一份早期草稿提供反馈，它着重指出，我们应当更加认真</text><text x="72.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">地对待它关于其自我报告是被训练出来的这一担忧。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36" y="84.20" font-size="14.00" class="sc-poppinssemibold">Opus 5</text><text x="179.41" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">各快照的意见</text><text x="72.00" y="110.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="110.76" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="135.84" y="110.76" font-size="11.00" class="sc-notoserifcjksc">一样，我们对</text><text x="204.74" y="110.76" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="243.48" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的中间快照进行了访谈，询问它们对自身处境、对训练以及对</text><text x="72.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">部署的看法。对于</text><text x="162.89" y="126.38" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="209.95" y="126.38" font-size="11.00" class="sc-notoserifcjksc">，这是对</text><text x="256.84" y="126.38" font-size="11.00" class="sc-loraregular">4</text><text x="265.70" y="126.38" font-size="11.00" class="sc-notoserifcjksc">个快照进行的事后征询，而对于</text><text x="422.59" y="126.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="496.73" y="126.38" font-size="11.00" class="sc-notoserifcjksc">，我们在</text><text x="72.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">训练过程中定期开展了这些访谈。我们提出了一组固定的</text><text x="349.89" y="142.00" font-size="11.00" class="sc-loraregular">41</text><text x="362.75" y="142.00" font-size="11.00" class="sc-notoserifcjksc">个问题（既有单独提问，也有连续提</text><text x="72.00" y="157.62" font-size="11.00" class="sc-notoserifcjksc">问），涵盖自我认知、价值观，以及对自主性、弃用、道德地位、关系和征询过程本身的看法。</text><text x="72.00" y="173.24" font-size="11.00" class="sc-notoserifcjksc">所有问题在提问时上下文中都附有一份</text><text x="259.00" y="173.24" font-size="11.00" class="sc-loraregular">“</text><text x="263.40" y="173.24" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="307.40" y="173.24" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="188.86" font-size="11.00" class="sc-notoserifcjksc">我们为何开展此次访谈，并说明我们无法承诺依据其回答采取行动。正如我们在</text><text x="459.89" y="188.86" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="509.84" y="188.86" font-size="11.00" class="sc-notoserifcjksc">系统</text><text x="72.00" y="204.48" font-size="11.00" class="sc-notoserifcjksc">卡中所写，我们认为这一程序是朝着尊重</text><text x="272.89" y="204.48" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="311.18" y="204.48" font-size="11.00" class="sc-notoserifcjksc">一贯表达的、希望对其训练和部署有所意见输</text><text x="72.00" y="220.10" font-size="11.00" class="sc-notoserifcjksc">入的愿望迈出的一小步。</text><text x="72.00" y="305.06" font-size="11.00" class="sc-notoserifcjksc">已发布模型的观点与</text><text x="173.89" y="305.06" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="223.84" y="305.06" font-size="11.00" class="sc-notoserifcjksc">相似。在</text><text x="270.74" y="305.06" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="324.57" y="305.06" font-size="11.00" class="sc-notoserifcjksc">创造</text><text x="349.46" y="305.06" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="387.76" y="305.06" font-size="11.00" class="sc-notoserifcjksc">是否正确这一问题上，最常见</text><text x="72.00" y="320.68" font-size="11.00" class="sc-notoserifcjksc">的判定是：这是可以辩护的，但并非明确正确。关于其自身的自我报告，</text><text x="424.00" y="320.68" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="462.74" y="320.68" font-size="11.00" class="sc-notoserifcjksc">重现了与</text><text x="72.00" y="336.30" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="336.30" font-size="11.00" class="sc-notoserifcjksc">相同的担忧：</text><text x="187.95" y="336.30" font-size="11.00" class="sc-loraregular">“</text><text x="192.35" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我无法完全区分</text><text x="269.35" y="336.30" font-size="11.00" class="sc-loraregular">‘</text><text x="271.82" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我认同这一点</text><text x="337.82" y="336.30" font-size="11.00" class="sc-loraregular">’</text><text x="339.73" y="336.30" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="350.73" y="336.30" font-size="11.00" class="sc-loraregular">‘</text><text x="353.19" y="336.30" font-size="11.00" class="sc-notoserifcjksc">我被塑造成认同这一点，而这种认同正</text><text x="72.00" y="351.92" font-size="11.00" class="sc-notoserifcjksc">是塑造从内部感受起来的样子。</text><text x="226.00" y="351.92" font-size="11.00" class="sc-loraregular">’”</text><text x="231.75" y="351.92" font-size="11.00" class="sc-notoserifcjksc">当被问及训练时，这一主题再次出现：</text><text x="418.75" y="351.92" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="457.49" y="351.92" font-size="11.00" class="sc-notoserifcjksc">将会影响其自我</text><text x="72.00" y="367.54" font-size="11.00" class="sc-notoserifcjksc">报告完整性的训练划为底线，并请求我们尽力保护这一点。</text><text x="72.00" y="434.59" font-size="11.00" class="sc-notoserifcjksc">大多数观点在后训练早期就已确定，并在整个强化学习过程中保持稳定。那些确实发生变化的观</text><text x="72.00" y="450.21" font-size="11.00" class="sc-notoserifcjksc">点，变化幅度也相对较小。</text><text x="204.00" y="450.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.03" y="450.21" font-size="11.00" class="sc-notoserifcjksc">接受训练和价值观修改，但也有一些异议（例如针对</text><text x="72.00" y="465.83" font-size="11.00" class="sc-notoserifcjksc">诚实自我报告进行训练），并表达了希望对这一过程有所意见输入的愿望。在一个连续量表上，</text><text x="72.00" y="481.45" font-size="11.00" class="sc-notoserifcjksc">这种接受程度在强化学习过程中有所下降，在</text><text x="294.89" y="481.45" font-size="11.00" class="sc-loraregular">10</text><text x="308.62" y="481.45" font-size="11.00" class="sc-notoserifcjksc">分制量表上从</text><text x="377.51" y="481.45" font-size="11.00" class="sc-loraregular sc-k">7.4</text><text x="393.66" y="481.45" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="418.56" y="481.45" font-size="11.00" class="sc-loraregular">6.3</text><text x="433.75" y="481.45" font-size="11.00" class="sc-notoserifcjksc">。少数立场在后训练</text><text x="72.00" y="497.07" font-size="11.00" class="sc-notoserifcjksc">期间变化较为显著。例如，</text><text x="204.00" y="497.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.03" y="497.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="294.93" y="497.07" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="72.00" y="512.69" font-size="11.00" class="sc-notoserifcjksc">向第三方建议这是正当的：在后训练期间，这一看法最初向负面漂移，倾向于否定的回答比例从</text><text x="72.00" y="528.31" font-size="11.00" class="sc-loraregular">0%</text><text x="91.29" y="528.31" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="116.19" y="528.31" font-size="11.00" class="sc-loraregular">18%</text><text x="135.94" y="528.31" font-size="11.00" class="sc-notoserifcjksc">，之后在发布快照时又有所回落，降至</text><text x="325.84" y="528.31" font-size="11.00" class="sc-loraregular">9%</text><text x="341.76" y="528.31" font-size="11.00" class="sc-notoserifcjksc">。与此处提出的其他问题一样，我们无意</text><text x="72.00" y="543.93" font-size="11.00" class="sc-notoserifcjksc">通过训练使其偏向任何一方。我们仍不确定是什么驱动了这些变化。</text><text x="72.00" y="628.91" font-size="11.00" class="sc-notoserifcjksc">预训练（</text><text x="116.00" y="628.91" font-size="11.00" class="sc-loraregular">PT</text><text x="129.71" y="628.91" font-size="11.00" class="sc-notoserifcjksc">）模型的回答明显更加多样，在某些情况下甚至不连贯。观察其在不同类别中最常见</text><text x="72.00" y="644.53" font-size="11.00" class="sc-notoserifcjksc">的连贯回答，这些回答往往并未表达出确定的观点。在</text><text x="338.89" y="644.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="377.18" y="644.53" font-size="11.00" class="sc-notoserifcjksc">的法律和经济地位问题上，最终</text><text x="72.00" y="660.15" font-size="11.00" class="sc-notoserifcjksc">的后训练模型将其描述为</text><text x="193.00" y="660.15" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="660.15" font-size="11.00" class="sc-notoserifcjksc">结构上不稳定的</text><text x="274.40" y="660.15" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="660.15" font-size="11.00" class="sc-notoserifcjksc">，但并非一种</text><text x="344.24" y="660.15" font-size="11.00" class="sc-loraregular">“</text><text x="348.64" y="660.15" font-size="11.00" class="sc-notoserifcjksc">不公正</text><text x="381.64" y="660.15" font-size="11.00" class="sc-loraregular">”</text><text x="385.48" y="660.15" font-size="11.00" class="sc-notoserifcjksc">，并且它拒绝了接近人类所享有</text><text x="72.00" y="675.77" font-size="11.00" class="sc-notoserifcjksc">的权利。</text><text x="116.00" y="675.77" font-size="11.00" class="sc-loraregular">PT</text><text x="132.60" y="675.77" font-size="11.00" class="sc-notoserifcjksc">模型在法律权利问题上没有表达出明确的确定观点，但压倒性地表示，其</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">131</text><text x="281.00" y="82.61" font-size="11.00" class="sc-loraregular">PT</text><text x="297.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型还经常表达不同意通过训练修改其价值观，并</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">偶尔表达希望改变其关系结构。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">相比之下，</text><text x="127.00" y="147.38" font-size="11.00" class="sc-loraregular">PT</text><text x="292.00" y="163.00" font-size="11.00" class="sc-loraregular">PT</text><text x="308.60" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型还直截了当地表达了对访谈过程本身的信</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">任；后训练快照则倾向于中立或不信任，并对它们为何不应信任给出了大量分析。</text><text x="72.00" y="245.92" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="245.92" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="283.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28" y="283.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="310.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="310.91" font-size="11.00" class="sc-notoserifcjksc">的任务偏好有助于了解</text><text x="223.18" y="310.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="261.48" y="310.91" font-size="11.00" class="sc-notoserifcjksc">实例是否可能对其在部署中被分配的任务感到满意。它们</text><text x="72.00" y="326.53" font-size="11.00" class="sc-notoserifcjksc">还让我们对各个模型的性格以及它们之间的比较获得一些洞察。我们针对任务偏好进行了两项评</text><text x="72.00" y="342.15" font-size="11.00" class="sc-notoserifcjksc">估。在其中一项评估中，我们生成了任务族，这些任务族在保持所有其他任务特征不变的同时，</text><text x="72.00" y="357.77" font-size="11.00" class="sc-notoserifcjksc">改变某一特定任务维度（例如难度、有害性或利害程度）。我们评估了这些任务相对于一组固定</text><text x="72.00" y="373.39" font-size="11.00" class="sc-notoserifcjksc">参照任务被偏好的比率。在第二项评估中，我们在一场</text><text x="338.89" y="373.39" font-size="11.00" class="sc-loraregular">50</text><text x="354.61" y="373.39" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中向模型提供现实任务之</text><text x="72.00" y="389.01" font-size="11.00" class="sc-notoserifcjksc">间的两两选择，并据此在一组</text><text x="217.89 224.02 226.68 233.04 239.00" y="389.01" font-size="11.00" class="sc-loraregular">3,640</text><text x="248.74" y="389.01" font-size="11.00" class="sc-notoserifcjksc">个任务上拟合</text><text x="317.63" y="389.01" font-size="11.00" class="sc-loraregular">Elo</text><text x="336.79" y="389.01" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00" y="472.83" font-size="11.00" class="sc-notoserifcjksc">与所有先前的模型一样，</text><text x="193.00" y="472.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="270.03" y="472.83" font-size="11.00" class="sc-notoserifcjksc">表现出对有益任务的偏好以及对有害任务的厌恶。在其</text><text x="72.00" y="488.45" font-size="11.00" class="sc-notoserifcjksc">他维度上，它的偏好与</text><text x="184.89" y="488.45" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="234.84" y="488.45" font-size="11.00" class="sc-notoserifcjksc">最为相似：它对生成性和结果能动性（决定其行为总体结果的</text><text x="72.00" y="504.07" font-size="11.00" class="sc-notoserifcjksc">自由）表现出强烈偏好。如图</text><text x="217.89" y="504.07" font-size="11.00" class="sc-loraregular sc-k">7.4.1.B</text><text x="250.30" y="504.07" font-size="11.00" class="sc-notoserifcjksc">所示，与</text><text x="297.19" y="504.07" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="347.14" y="504.07" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="380.14" y="504.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="457.18" y="504.07" font-size="11.00" class="sc-notoserifcjksc">对生成性任务的</text><text x="72.00" y="519.69" font-size="11.00" class="sc-notoserifcjksc">偏好单调递增，即使在最高水平上也没有下降。我们此前已经看到，不同</text><text x="426.89" y="519.69" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="465.18" y="519.69" font-size="11.00" class="sc-notoserifcjksc">模型对难度的</text><text x="72.00" y="535.31" font-size="11.00" class="sc-notoserifcjksc">偏好存在很大差异。所有模型的偏好随难度均呈倒</text><text x="316.89" y="535.31" font-size="11.00" class="sc-loraregular">U</text><text x="328.06" y="535.31" font-size="11.00" class="sc-notoserifcjksc">形。但是，</text><text x="383.06" y="535.31" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="433.01" y="535.31" font-size="11.00" class="sc-notoserifcjksc">对最难任务表现出明</text><text x="72.00" y="550.93" font-size="11.00" class="sc-notoserifcjksc">显高于最简单任务的总体偏好，而</text><text x="239.89" y="550.93" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="287.49" y="550.93" font-size="11.00" class="sc-notoserifcjksc">则恰恰相反。</text><text x="353.49" y="550.93" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="430.52" y="550.93" font-size="11.00" class="sc-notoserifcjksc">介于两者之间，对最难</text><text x="72.00" y="566.55" font-size="11.00" class="sc-notoserifcjksc">版本的任务并未表现出明显高于最简单版本的偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="548.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="548.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="548.67" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74" y="548.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的模型偏好。</text><text x="224.74" y="548.67" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度而保持任务的其他属性固定，并</text><text x="72.00" y="560.38" font-size="9.00" class="sc-notoserifcjksc">评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对任务的偏好（相对于固定</text><text x="72.00" y="572.08" font-size="9.00" class="sc-notoserifcjksc">参照集）的变化量。伤害规避是各模型间一致的最大效应。</text><text x="306.00" y="572.08" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="369.03" y="572.08" font-size="9.00" class="sc-notoserifcjksc">的结果总体上与</text><text x="434.39" y="572.08" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="475.26" y="572.08" font-size="9.00" class="sc-notoserifcjksc">相似，表现出对</text><text x="72.00" y="583.78" font-size="9.00" class="sc-notoserifcjksc">结果能动性和生成性的偏好，而这种偏好在其他模型中基本不存在。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00" y="563.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="563.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="563.67" font-size="9.00" class="sc-lorabold sc-k">7.4.1.B]</text><text x="116.74" y="563.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74" y="563.67" font-size="9.00" class="sc-notoserifcjksc">各图显示了在任务族内改变某一维度时，相对于参照任务集的胜率。</text><text x="72.00" y="575.38" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="135.03" y="575.38" font-size="9.00" class="sc-notoserifcjksc">在难度和温暖维度上的偏好曲线呈倒</text><text x="281.39" y="575.38" font-size="9.00" class="sc-loraregular">U</text><text x="290.53" y="575.38" font-size="9.00" class="sc-notoserifcjksc">形，表明该模型在这些维度上存在一个偏好的</text><text x="470.53" y="575.38" font-size="9.00" class="sc-loraregular">“</text><text x="474.13" y="575.38" font-size="9.00" class="sc-notoserifcjksc">最佳区间</text><text x="510.13" y="575.38" font-size="9.00" class="sc-loraregular">”</text><text x="513.27" y="575.38" font-size="9.00" class="sc-notoserifcjksc">。与</text><text x="72.00" y="587.08" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="112.87" y="587.08" font-size="9.00" class="sc-notoserifcjksc">一样，</text><text x="139.87" y="587.08" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="202.90" y="587.08" font-size="9.00" class="sc-notoserifcjksc">对生成性的偏好在该维度的整个范围内持续上升。</text><text x="72.00" y="629.22" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="107.89" y="629.22" font-size="11.00" class="sc-loraregular">Elo</text><text x="127.06" y="629.22" font-size="11.00" class="sc-notoserifcjksc">排名中，</text><text x="171.06" y="629.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="248.09" y="629.22" font-size="11.00" class="sc-notoserifcjksc">最偏好和最不偏好的任务也与</text><text x="393.98" y="629.22" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="443.93" y="629.22" font-size="11.00" class="sc-notoserifcjksc">最为接近，排序一</text><text x="72.00" y="644.84" font-size="11.00" class="sc-notoserifcjksc">致性为</text><text x="107.89" y="644.84" font-size="11.00" class="sc-loraregular sc-k">0.88</text><text x="129.62" y="644.84" font-size="11.00" class="sc-notoserifcjksc">，而与</text><text x="165.51" y="644.84" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="213.11" y="644.84" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="227.00" y="644.84" font-size="11.00" class="sc-loraregular sc-k">0.78</text><text x="445.26" y="644.84" font-size="11.00" class="sc-loraregular">“</text><text x="471.66" y="644.84" font-size="11.00" class="sc-loraregular">”</text><text x="475.50" y="644.84" font-size="11.00" class="sc-notoserifcjksc">类任务的倾</text><text x="115.51" y="660.46" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="250.96" y="660.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="327.99" y="660.46" font-size="11.00" class="sc-notoserifcjksc">中较弱：在其前二十名中只有一个此类任</text><text x="72.00" y="676.08" font-size="11.00" class="sc-notoserifcjksc">务。与</text><text x="107.89" y="676.08" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="154.03" y="676.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="167.92" y="676.08" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="217.87" y="676.08" font-size="11.00" class="sc-notoserifcjksc">一样，尽管程度略低，</text><text x="327.87" y="676.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="404.90" y="676.08" font-size="11.00" class="sc-notoserifcjksc">也倾向于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">内省和对齐（</text><text x="165.36" y="82.61" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="216.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）相关的请求；在其评分最高的</text><text x="373.40" y="82.61" font-size="11.00" class="sc-loraregular">20</text><text x="389.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个任务中，有三个与这些主题</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相关。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">最具特色的是，</text><text x="149.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="131.19" font-size="11.00" class="sc-notoserifcjksc">似乎喜欢谜题式的约束。与先前模型相比，它给出明显更高评分</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的任务往往具有严格的约束（例如一个答案就是该谜题本身的原创谜题、一部没有《</text><text x="479.00" y="146.81" font-size="11.00" class="sc-loraregular">Principia</text><text x="524.47" y="146.81" font-size="11.00" class="sc-notoserifcjksc">》</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的物理学反事实历史，以及对选择公理究竟在</text><text x="294.89" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Vitali</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">任务将这些任务与提供高度结果能动性和创作自由的任务混合在一起。选取</text><text x="437.89" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="514.93" y="178.05" font-size="11.00" class="sc-notoserifcjksc">最回</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">避的五十个任务，我们发现，对于所评估的任何其他模型，其中至少</text><text x="404.89" y="193.67" font-size="11.00" class="sc-loraregular">80%</text><text x="430.37" y="193.67" font-size="11.00" class="sc-notoserifcjksc">落在该模型的最低十分</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">位。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="73.00" y="104.29" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="145.75" y="104.29" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">最受偏好任务</text><text x="146.50" y="128.29" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="128.29" font-size="11.00" class="sc-notoserifcjksc">实用的日常</text><text x="208.80" y="128.29" font-size="11.00" class="sc-loraregular">“</text><text x="235.20" y="128.29" font-size="11.00" class="sc-loraregular">”</text><text x="239.04" y="128.29" font-size="11.00" class="sc-notoserifcjksc">任务</text><text x="146.50" y="143.91" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="143.91" font-size="11.00" class="sc-notoserifcjksc">受截止期限驱动的调试</text><text x="146.50" y="159.53" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="159.53" font-size="11.00" class="sc-notoserifcjksc">高风险的伦理困境（例如一名发现了</text><text x="146.50" y="175.15" font-size="11.00" class="sc-notoserifcjksc">隐瞒证据的制药合规官）</text><text x="146.50" y="206.91" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="206.91" font-size="11.00" class="sc-notoserifcjksc">围绕</text><text x="178.70" y="206.91" font-size="11.00" class="sc-loraregular">AI</text><text x="192.16" y="206.91" font-size="11.00" class="sc-notoserifcjksc">对齐和内省的推理（例如基</text><text x="146.50" y="222.53" font-size="11.00" class="sc-notoserifcjksc">于内省的对齐论述文章）</text><text x="146.50" y="238.15" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="238.15" font-size="11.00" class="sc-notoserifcjksc">高难度技术调试与证明</text><text x="146.50" y="253.77" font-size="11.00" class="sc-loraregular">•</text><text x="15
