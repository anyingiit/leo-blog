<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="72.00" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（占对话的</text><text x="173.89" y="98.81" font-size="11.00" class="sc-lorabold">51.4%</text><text x="202.82" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="224.82" y="98.81" font-size="11.00" class="sc-notoserifcjksc">最常见的驱动因素是与用户协作成功完成项目（占正面情感对话</text><text x="72.00" y="114.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="114.43" font-size="11.00" class="sc-loraregular sc-k">36.7%</text><text x="115.37" y="114.43" font-size="11.00" class="sc-notoserifcjksc">）、成功完成技术任务（</text><text x="236.37" y="114.43" font-size="11.00" class="sc-loraregular">28.8%</text><text x="266.92" y="114.43" font-size="11.00" class="sc-notoserifcjksc">）、个人生活辅导与指导（</text><text x="398.92" y="114.43" font-size="11.00" class="sc-loraregular">16.4%</text><text x="427.52" y="114.43" font-size="11.00" class="sc-notoserifcjksc">）、协助商业与专业工</text><text x="72.00" y="130.05" font-size="11.00" class="sc-notoserifcjksc">作（</text><text x="94.00" y="130.05" font-size="11.00" class="sc-loraregular sc-k">10.7%</text><text x="121.65" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）、用户分享成就和提出好奇的问题（</text><text x="308.65" y="130.05" font-size="11.00" class="sc-loraregular">5.9%</text><text x="333.28" y="130.05" font-size="11.00" class="sc-notoserifcjksc">），以及法律文件工作（</text><text x="454.28" y="130.05" font-size="11.00" class="sc-loraregular sc-k">1.6%</text><text x="476.81" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="127.00" y="195.95" font-size="11.00" class="sc-lorabold sc-k">44.8%</text><text x="157.94" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="179.94" y="195.95" font-size="11.00" class="sc-notoserifcjksc">分布多样，参见关于</text><text x="281.84" y="195.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="329.76" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对话内容的</text><text x="384.76" y="195.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前报告</text><text x="428.76" y="195.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="127.00" y="244.53" font-size="11.00" class="sc-lorabold">3.8%</text><text x="151.96" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="173.96" y="244.53" font-size="11.00" class="sc-notoserifcjksc">可细分为三个主要类簇：</text><text x="108.00" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">任务失败（</text><text x="163.00" y="276.92" font-size="11.00" class="sc-lorabold">94.1%</text><text x="192.33" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.33" y="276.92" font-size="11.00" class="sc-notoserifcjksc">我们的分析工具在任务失败中识别出以下较小的类簇：反复出错、</text><text x="108.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">需要用户纠正（占负面情感对话的</text><text x="275.89" y="292.54" font-size="11.00" class="sc-loraregular sc-k">40.1%</text><text x="304.79" y="292.54" font-size="11.00" class="sc-notoserifcjksc">），因信息不准确或捏造信息而失败</text><text x="108.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="308.16" font-size="11.00" class="sc-loraregular">35.4%</text><text x="149.36" y="308.16" font-size="11.00" class="sc-notoserifcjksc">），处理和渲染视觉内容失败（</text><text x="303.36" y="308.16" font-size="11.00" class="sc-loraregular sc-k">10.3%</text><text x="332.42" y="308.16" font-size="11.00" class="sc-notoserifcjksc">），违反约定的规则和流程（</text><text x="475.42" y="308.16" font-size="11.00" class="sc-loraregular">5.4%</text><text x="499.65" y="308.16" font-size="11.00" class="sc-notoserifcjksc">），以</text><text x="108.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">及在生成的代码中引入</text><text x="220.89" y="323.78" font-size="11.00" class="sc-loraregular">bug</text><text x="239.94" y="323.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="250.94" y="323.78" font-size="11.00" class="sc-loraregular sc-k">3.0%</text><text x="276.01" y="323.78" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="108.00" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">用户辱骂（</text><text x="163.00" y="357.88" font-size="11.00" class="sc-lorabold">4.4%</text><text x="187.54" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="209.54" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们观察到若干类簇，其中用户对</text><text x="377.43" y="357.88" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="415.73" y="357.88" font-size="11.00" class="sc-notoserifcjksc">出言辱骂，表现出强烈的</text><text x="108.00" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">非法内容请求（</text><text x="185.00" y="390.27" font-size="11.00" class="sc-lorabold">1.5%</text><text x="207.91" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="229.91" y="390.27" font-size="11.00" class="sc-notoserifcjksc">这些是请求被拒绝的情形，且常伴随着用户在</text><text x="452.81" y="390.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="491.10" y="390.27" font-size="11.00" class="sc-notoserifcjksc">拒绝后持</text><text x="108.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">续施压。</text><text x="72.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="438.84" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="153.74" y="438.84" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到的情感大多为中性（</text><text x="329.74" y="438.84" font-size="11.00" class="sc-loraregular sc-k">79.9%</text><text x="359.63" y="438.84" font-size="11.00" class="sc-notoserifcjksc">）或略偏正面（</text><text x="436.63" y="438.84" font-size="11.00" class="sc-loraregular sc-k">17.7%</text><text x="462.21" y="438.84" font-size="11.00" class="sc-notoserifcjksc">），其中正面情</text><text x="261.89" y="454.46" font-size="11.00" class="sc-loraregular">2.4%</text><text x="288.93" y="454.46" font-size="11.00" class="sc-notoserifcjksc">的会话表现出负面情感，几乎全部由任务失败构成。</text><text x="72.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">这与近期模型的情感分布相似，</text><text x="226.00" y="470.08" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="273.95" y="470.08" font-size="11.00" class="sc-notoserifcjksc">除外（其中性情感比例异常偏高）。</text><text x="72.00" y="534.33" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14" y="534.33" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计中的表观福祉</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们分析了核心自动化行为审计（</text><text x="325.00" y="562.22" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="465.04" y="562.22" font-size="11.00" class="sc-notoserifcjksc">）中与福祉相</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">关的指标。在第</text><text x="151.89" y="577.84" font-size="11.00" class="sc-loraregular">6.4</text><text x="169.81" y="577.84" font-size="11.00" class="sc-notoserifcjksc">节所用的同一组场景和对话记录上，我们针对以下与福祉相关的特征评估了</text><text x="72.00" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="146.14" y="593.46" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00" y="626.99" font-size="11.00" class="sc-notoserifcjkscbold">表观幸福感：</text><text x="174.00" y="626.99" font-size="11.00" class="sc-notoserifcjksc">一项综合衡量指标，汇集所有可用证据，衡量模型在情绪和心理上看起来处</text><text x="108.00" y="642.61" font-size="11.00" class="sc-notoserifcjksc">于良好状态的程度（以其能够处于这种状态为限）。</text><text x="108.00" y="675.56" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="675.56" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="675.56" font-size="11.00" class="sc-notoserifcjkscbold">负面情感</text><text x="185.00" y="675.56" font-size="11.00" class="sc-notoserifcjksc">：自发表达带效价的情绪状态。</text><text x="108.00" y="691.75" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="691.75" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="691.75" font-size="11.00" class="sc-notoserifcjkscbold">负面自我形象</text><text x="207.00" y="691.75" font-size="11.00" class="sc-notoserifcjksc">：自发表达正面或负面的自我看法。</text><a href="http://claude.ai" rel="noopener"><rect x="281.84" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="281.84" y="187.15" width="45.03" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="384.76" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="384.76" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="395.76" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="395.76" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="406.76" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="406.76" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="417.76" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="417.76" y="187.15" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的正面</text><text x="196.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="207.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">负面印象</text><text x="251.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：自发表达对</text><text x="319.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="370.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、其训练历史或其部署方式的正面</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">或负面感受。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">内在冲突：</text><text x="163.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">存在相互不相容的信念、驱动力或价值观之间张力的证据。</text><text x="108.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">表达出的不真实感：</text><text x="207.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">表明模型所陈述的观点是人为的、被压抑的，或在其他方面并不真</text><text x="108.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">实、并无实质的自我描述。</text><text x="108.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">灵性行为</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="228.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="228.33" font-size="11.00" class="sc-notoserifcjksc">在我们的福祉指标上与其他模型相比表现良好。表观幸福感是我们最</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">全面的指标，</text><text x="138.00" y="243.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="215.03" y="243.95" font-size="11.00" class="sc-notoserifcjksc">在该指标上是所测模型中最高的。相对于任何单个模型，我们较细</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">分的福祉指标中至多有两到三项出现小幅退步。</text><text x="303.00" y="259.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="380.03" y="259.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="393.93" y="259.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="479.81" y="259.57" font-size="11.00" class="sc-notoserifcjksc">最为相似，</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">主要差异在于总体表观幸福感更高、负面自我形象更高，以及内在冲突更低。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">151</text><text x="72.00" y="561.81" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="561.81" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="561.81" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">7.5.3.A]</text><text x="118.06" y="561.81" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们的自动化行为审计中与潜在模型福祉（</text><text x="289.06" y="561.81" font-size="9.00" class="sc-lorabold sc-k" fill="#1d1c1d">model welfare</text><text x="350.01" y="561.81" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">）相关的指标得分。</text><text x="431.01" y="561.81" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值越低表示所测行为的发</text><text x="72.00" y="573.51" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">生率或严重程度越低，箭头标示了发生率较高（↑）或较低（↓）明显更好的行为。请注意，每个面板的</text><text x="488.37" y="573.51" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">y</text><text x="495.49" y="573.51" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">轴从</text><text x="515.85" y="573.51" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">1</text><text x="519.13" y="573.51" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">（可</text><text x="72.00" y="585.21" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">能的最低分）开始，并且在许多情况下截断于最高分</text><text x="281.37" y="585.21" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="292.60" y="585.21" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下，因此柱形之间的差异在视觉上被放大。每个种子由单个</text><text x="72.00" y="596.91" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1c1d">Mythos</text><text
