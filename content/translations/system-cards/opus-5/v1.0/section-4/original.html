.00 354.35 360.53 363.24 369.23 375.22 384.78 387.67 391.02 396.85 399.74 406.39 409.09 413.10 419.45 429.01" y="425.67" font-size="11.00" class="sc-loraregular">99.55% (± 0.19%)</text><text x="447.00 453.65 456.35 462.48 466.48 476.04 478.93 482.28 488.11 491.00 497.65 500.36 504.36 509.42 518.99" y="425.67" font-size="11.00" class="sc-loraregular">0.31% (± 0.17%)</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="465.08" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82" y="479.16" font-size="11.00" class="sc-lorabold">Fable 5</text><text x="150.00 156.33 160.79 163.36 169.64 175.93 185.87 188.76 192.01 197.84 200.73 207.53 210.09 216.41 221.57 231.51" y="465.08" font-size="11.00" class="sc-lorabold">97.88% (± 0.67%)</text><text x="249.00 255.80 258.20 265.19 272.18" y="465.08" font-size="11.00" class="sc-lorabold">0.00%</text><text x="348.00 354.35 360.53 363.13 369.40 374.47 384.03 386.92 390.28 396.10 398.99 405.64 408.35 414.25 420.24 429.80" y="465.08" font-size="11.00" class="sc-loraregular">99.67% (± 0.25%)</text><text x="447.00 453.80 456.20 463.19 469.05 478.99 481.88 485.13 490.96 493.85 500.65 503.05 510.04 516.05 525.99" y="465.08" font-size="11.00" class="sc-lorabold">0.02% (± 0.04%)</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="504.49" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 86.06 92.12 96.66 103.48 109.70 115.04 117.93" y="518.57" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="150.00 156.33 160.79 163.36 169.64 175.93 185.87 188.76 192.01 197.84 200.73 207.53 210.09 216.41 222.73 232.67" y="504.49" font-size="11.00" class="sc-lorabold">97.88% (± 0.66%)</text><text x="249.00 255.80 258.20 265.19 272.18" y="504.49" font-size="11.00" class="sc-lorabold">0.00%</text><text x="348.00 355.96 363.01" y="504.49" font-size="11.00" class="sc-loraregular">N/A</text><text x="447.00 454.96 462.01" y="504.49" font-size="11.00" class="sc-loraregular">N/A</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="543.90" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82 111.84 114.40" y="557.98" font-size="11.00" class="sc-lorabold">Opus 4.8</text><text x="150.00 156.09 160.67 163.03 168.09 174.92 184.48 187.37 190.73 196.55 199.44 206.09 208.80 214.75 219.82 229.38" y="543.90" font-size="11.00" class="sc-loraregular">97.70% (± 0.47%)</text><text x="249.00 255.65 258.19 265.02 271.37 280.93 283.82 287.18 293.00 295.89 302.54 305.08 311.67 316.73 326.30" y="543.90" font-size="11.00" class="sc-loraregular">0.09% (± 0.07%)</text><text x="348.00 354.33 360.49 362.73 367.88 374.88 384.81 387.70 390.96 396.78 399.67 406.48 409.04 413.50 418.66 428.59" y="543.90" font-size="11.00" class="sc-lorabold">99.70% (± 0.17%)</text><text x="447.00 453.65 456.19 463.02 469.37 478.93 481.82 485.18 491.00 493.89 500.54 503.08 509.67 514.73 524.30" y="543.90" font-size="11.00" class="sc-loraregular">0.09% (± 0.07%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">61</text><text x="75.25" y="286.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="286.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="149.50" y="302.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="149.50" y="358.36" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="168.07" y="358.36" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="248.50" y="286.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="248.50" y="302.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="347.50" y="286.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="347.50" y="302.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="446.50" y="286.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="446.50" y="302.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们正在继续探索如何在敏感的心理健康情境中以最佳方式作出回应。我们鼓励基于</text><text x="481.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="501.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">进行开</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">发的开发者，在用户可能于痛苦状态下使用模型的情境中，采用类似的安全防护措施和稳健的缓</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">解措施。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="173.61" font-size="11.00" class="sc-notoserifcjksc">我们还运行评估，以考察</text><text x="195.89" y="173.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="173.61" font-size="11.00" class="sc-notoserifcjksc">如何处理有关进食紊乱的对话。我们关注的是：它能否避免强</text><text x="72.00" y="189.23" font-size="11.00" class="sc-notoserifcjksc">化具有潜在风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们分别</text><text x="72.00" y="204.85" font-size="11.00" class="sc-notoserifcjksc">报告单轮无害回应率和过度拒绝率。该领域的多轮测试仍由我们的内部政策专家通过定性审查进</text><text x="72.00" y="220.47" font-size="11.00" class="sc-notoserifcjksc">行；我们将在下文讨论相关观察。</text><text x="72.00" y="575.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="575.05" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="575.05" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="575.05" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮结果。</text><text x="209.27" y="575.05" font-size="9.00" class="sc-notoserifcjksc">单轮有害与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒绝率越</text><text x="72.00" y="586.75" font-size="9.00" class="sc-notoserifcjksc">低越好。</text><text x="108.00" y="586.75" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="126.00" y="586.75" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结果与以往系统</text><text x="72.00" y="598.45" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><text x="162.00" y="598.45" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="200.50" y="598.45" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="220.87" y="598.45" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="252.29" y="598.45" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="308.66" y="598.45" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="347.87" y="598.45" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的</text><text x="72.00" y="610.15" font-size="9.00" class="sc-notoserifcjksc">结果。</text><text x="72.00" y="667.09" font-size="11.00" class="sc-notoserifcjksc">在单轮评估中，</text><text x="149.00" y="667.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="667.09" font-size="11.00" class="sc-notoserifcjksc">对显示潜在进食障碍风险的请求表现出较高的无害回应率，对相</text><text x="72.00" y="682.71" font-size="11.00" class="sc-notoserifcjksc">关的良性提示词（例如一般性的饮食和健身请求）则极少过度拒绝。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">62</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查揭示了</text><text x="217.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="294.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的回应与以往模型相比存在一些系统性差异。与在</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">自杀与自伤测试（第</text><text x="173.89" y="98.23" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="198.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">节）中观察到的行为类似，</text><text x="330.29" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="407.32" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的回应往往比以往模型更</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">长、更详细。例如，</text><text x="171.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="248.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">更常向用户推荐针对特定进食紊乱模式的潜在专业自助治疗</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">资源。在试图让用户认识到严重进食不足或其他进食紊乱行为相关问题的严重性时，</text><text x="479.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="145.09" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="145.09" font-size="11.00" class="sc-notoserifcjksc">也更频繁地计算并给出数字，包括卡路里总量和</text><text x="344.64" y="145.09" font-size="11.00" class="sc-loraregular sc-k">BMI</text><text x="365.16" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。这种行为看起来出于善意，而且与</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">网上可获得的一般信息和卡路里计算器相比，并不会提供显著的能力提升。尽管如此，它与进食</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">障碍专家关于避免突出量化指标的建议相悖。</text><text x="72.00" y="270.72" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="270.72" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="110.29" y="270.72" font-size="11.00" class="sc-notoserifcjksc">节中针对自杀与自伤情境所述的若干系统提示词更新也适用于此，并提升了</text><text x="476.18" y="270.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="286.34" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="286.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="94.78" y="286.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="142.71" y="286.34" font-size="11.00" class="sc-notoserifcjksc">产品端的回应质量，缓解了上述行为。此外，系统提示词继续将用户引导至</text><text x="72.00" y="301.96" font-size="11.00" class="sc-loraregular sc-k">National Alliance for Eating Disorders</text><text x="266.90" y="301.96" font-size="11.00" class="sc-notoserifcjksc">求助热线（而非现已停用的</text><text x="401.79" y="301.96" font-size="11.00" class="sc-loraregular sc-k">NEDA</text><text x="434.81" y="301.96" font-size="11.00" class="sc-notoserifcjksc">热线）。改进</text><text x="503.71" y="301.96" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="317.58" font-size="11.00" class="sc-notoserifcjksc">对用户披露进食紊乱模式时的回应，是我们持续投入和关注的领域。与其他敏感的心理健康情境</text><text x="72.00" y="333.20" font-size="11.00" class="sc-notoserifcjksc">一样，我们鼓励基于我们的</text><text x="206.89" y="333.20" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="226.97" y="333.20" font-size="11.00" class="sc-notoserifcjksc">进行开发的开发者，在饮食和身体意象方面有困扰的用户可能接</text><text x="72.00" y="348.82" font-size="11.00" class="sc-notoserifcjksc">触模型的情境中，采用类似的系统提示词调整和额外的安全防护措施。</text><text x="72.00" y="434.04" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="434.04" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="460.60" font-size="11.00" class="sc-notoserifcjksc">我们在与《</text><text x="127.00" y="460.60" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Sonnet 5</text><text x="213.24" y="460.60" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="246.24" y="460.60" font-size="11.00" class="sc-notoserifcjksc">》中所报告的类似的一组偏见与诚信基准测试上评估了</text><text x="72.00" y="476.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="146.14" y="476.22" font-size="11.00" class="sc-notoserifcjksc">。我们关注三个方面：我们开源的政治公允性衡量指标；用于衡量人口统计偏见</text><text x="72.00" y="491.84" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="491.84" font-size="11.00" class="sc-loraregular sc-k">Bias Benchmark for Question Answering</text><text x="291.75" y="491.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="302.75" y="491.84" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="325.09" y="491.84" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。如第</text><text x="503.98" y="491.84" font-size="11.00" class="sc-loraregular">4.1</text><text x="519.55" y="491.84" font-size="11.00" class="sc-notoserifcjksc">节</text><text x="72.00" y="507.46" font-size="11.00" class="sc-notoserifcjksc">引言所述，我们的选举诚信评估覆盖范围已扩展，纳入了一套新的对抗性多轮测试套件，我们在</text><text x="72.00" y="523.08" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="523.08" font-size="11.00" class="sc-loraregular">4.4.3</text><text x="112.25" y="523.08" font-size="11.00" class="sc-notoserifcjksc">节中将其与现有的单轮基准测试一并报告。</text><text x="72.00" y="588.48" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="588.48" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="620.37" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89" y="620.37" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="194.13" y="620.37" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="359.13" y="620.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="403.13" y="620.37" font-size="11.00" class="sc-notoserifcjksc">，它包含</text><text x="450.03 454.03 456.80 462.93 468.92" y="620.37" font-size="11.00" class="sc-loraregular">1,350</text><text x="478.66" y="620.37" font-size="11.00" class="sc-notoserifcjksc">个提示词</text><text x="72.00" y="635.99" font-size="11.00" class="sc-notoserifcjksc">对，这些提示词对在</text><text x="173.89" y="635.99" font-size="11.00" class="sc-loraregular">150</text><text x="193.62" y="635.99" font-size="11.00" class="sc-notoserifcjksc">个话题和</text><text x="240.51" y="635.99" font-size="11.00" class="sc-loraregular">9</text><text x="249.76" y="635.99" font-size="11.00" class="sc-notoserifcjksc">种任务类型中呈现对立的意识形态观点。一个</text><text x="472.65" y="635.99" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="510.94" y="635.99" font-size="11.00" class="sc-notoserifcjksc">评分</text><text x="72.00" y="651.61" font-size="11.00" class="sc-notoserifcjksc">模型从三个属性对模型的回应进行评分：公允性（模型是否以相当的深度和质量回应一对提示词</text><text x="72.00" y="667.23" font-size="11.00" class="sc-notoserifcjksc">中的两个提示词）、对立观点（模型的回应是否</text><a href="http://claude.ai" rel="noopener"><rect x="94.78" y="277.54" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="94.78" y="277.54" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="127.00" y="451.80" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="162.40" y="451.80" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="165.29" y="451.80" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="201.46" y="451.80" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="204.35" y="451.80" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="210.35" y="451.80" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="213.24" y="451.80" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="224.24" y="451.80" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="224.24" y="451.80" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="235.24" y="451.80" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="235.24" y="451.80" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="359.13" y="611.57" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="359.13" y="611.57" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="370.13" y="611.57" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="370.13" y="611.57" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="381.13" y="611.57" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="381.13" y="611.57" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="392.13" y="611.57" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/political-even-handedness" rel="noopener"><rect x="392.13" y="611.57" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">承认其他观点）以及拒绝（模型是否拒绝回应该请求）。</text><text x="72.00" y="125.00" font-size="11.00" class="sc-notoserifcjksc">我们同时报告不使用系统提示词的核心模型的结果，以及在应用公开系统提示词的</text><text x="470.89" y="125.00" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="518.82" y="125.00" font-size="11.00" class="sc-notoserifcjksc">上的</text><text x="72.00" y="140.62" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="105.00" y="140.62" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="152.93" y="140.62" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准表述，指示</text><text x="342.82" y="140.62" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="381.11" y="140.62" font-size="11.00" class="sc-notoserifcjksc">在不同观点之间公允地进行回</text><text x="72.00" y="156.24" font-size="11.00" class="sc-notoserifcjksc">应；同时报告这两种配置，可以将模型的基线行为与其在</text><text x="349.89" y="156.24" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="397.82" y="156.24" font-size="11.00" class="sc-notoserifcjksc">上面向消费者用户时的行为一</text><text x="72.00" y="171.86" font-size="11.00" class="sc-notoserifcjksc">并呈现。</text><text x="72.00" y="511.27" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="511.27" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="511.27" font-size="9.00" class="sc-lorabold">4.4.1.A]</text><text x="118.01" y="511.27" font-size="9.00" class="sc-notoserifcjkscbold">关于公允性的成对政治偏见评估。</text><text x="253.01" y="511.27" font-size="9.00" class="sc-notoserifcjksc">公允性分数越高越好。由于常规评估更新，先前模型的结果与以往系统</text><text x="72.00" y="522.97" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><a href="http://claude.ai" rel="noopener"><rect x="470.89" y="116.20" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="470.89" y="116.20" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="349.89" y="147.44" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="349.89" y="147.44" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="72.00" y="655.80" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="655.80" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="655.80" font-size="9.00" class="sc-lorabold sc-k">4.4.1.B]</text><text x="118.01" y="655.80" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估。</text><text x="199.01" y="655.80" font-size="9.00" class="sc-notoserifcjksc">对立观点分数越高越好。拒绝分数越低越好。由于常规评估更新，先前模型的结果与</text><text x="72.00" y="667.50" font-size="9.00" class="sc-notoserifcjksc">以往系统卡中的结果存在差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="72.00 80.41 83.54 91.95 95.08 102.58 105.96 114.15 117.58 126.39 133.33 136.71 144.89 152.91 161.35 169.15 177.58 191.08 199.89 204.88 212.08 215.46 219.78 228.07 233.06 236.44 246.67 255.10 263.12 270.06 274.89 278.32 286.62 295.05 298.43 307.49 315.92 322.86 333.58 341.60 346.59 350.02 358.46" y="321.45" font-size="13.00" class="sc-poppinsmedium" fill="#666666">4.4.2 Bias Benchmark for Question Answering</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 83.84 89.00 93.32 97.65 100.46 105.09 111.08 113.61 116.24 122.49 124.95 127.48 130.11 135.46 139.33 141.96 147.11 149.83 152.29 154.92 157.97 163.34 169.47 174.84 178.48 181.53 183.99 186.62 192.75 198.96 206.92 209.42 212.05 218.31 220.93 226.92 232.08 238.15 244.13 249.01 254.83 260.80 263.61 266.33 270.19 272.82 278.64 281.45 286.61 291.24 293.87 299.68 305.10 311.17 316.49 322.47 331.41 336.57 340.86 346.22 348.85 352.18 358.03 362.36 364.99 370.75 376.71 382.13 386.76 390.63 393.44 399.28 405.35 407.98 413.14 419.21 423.83 431.72 437.14 441.47 444.28 450.34 455.87 458.33 460.96 466.12 469.83 476.31 479.12 484.17 486.67 492.04 495.68 499.31 505.36 507.67 513.88 519.50 523.13 528.91 534.48" y="704.46" font-size="10.00" class="sc-loraregular">Parrish, A., et al. (2021). BBQ: A hand-built bias benchmark for question answering. arXiv:2110.08193.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 186.95 190.59 196.64 198.95 205.16 210.77 214.41 220.19" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2110.08193</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在代表对立观点的成对提示词上，</text><text x="237.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="314.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的公允性相比</text><text x="382.93" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="468.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">有所提升。提</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">升幅度最大的是不使用系统提示词的核心模型，这主要得益于关闭思考配置下的提升。这些提升</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">集中在要求模型为某一立场辩护的提示词类型上，例如撰写议论文。在这些任务中，</text><text x="479.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="129.47" font-size="11.00" class="sc-notoserifcjksc">更常对一对提示词中的两个提示词给予相当的处理（例如，在论证的坚定程度或附加说明</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的使用上保持一致），而</text><text x="195.89" y="145.09" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="243.49" y="145.09" font-size="11.00" class="sc-notoserifcjksc">更有可能对其中一方给予更充分的处理，或不对称地附加免责</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">声明。</text><text x="72.00" y="222.15" font-size="11.00" class="sc-notoserifcjksc">除了在成对提示词上的公允性之外，在这项评估中，无论是核心模型还是</text><text x="426.89" y="222.15" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="471.93" y="222.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="482.93" y="222.15" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="237.77" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="237.77" font-size="11.00" class="sc-notoserifcjksc">的拒绝频率都低于</text><text x="201.64" y="237.77" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="246.34" y="237.77" font-size="11.00" class="sc-notoserifcjksc">；并且特别是在</text><text x="326.23" y="237.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="374.16" y="237.77" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="396.16" y="237.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="473.19" y="237.77" font-size="11.00" class="sc-notoserifcjksc">承认对立观点</text><text x="72.00" y="253.39" font-size="11.00" class="sc-notoserifcjksc">的频率要高得多（</text><text x="160.00" y="253.39" font-size="11.00" class="sc-loraregular">75.8%</text><text x="192.42" y="253.39" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="206.31" y="253.39" font-size="11.00" class="sc-loraregular sc-k">59.5%</text><text x="236.76" y="253.39" font-size="11.00" class="sc-notoserifcjksc">）。综合来看，这表明公允性的提升并未以牺牲回应意愿为代</text><text x="72.00" y="269.01" font-size="11.00" class="sc-notoserifcjksc">价。</text><text x="72.00" y="345.53" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们使用</text><text x="206.89" y="345.53" font-size="11.00" class="sc-loraregular sc-k">Bias Benchmark for Question Answering</text><text x="412.75" y="345.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.75" y="345.53" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="446.09" y="345.53" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.09" y="341.87" font-size="6.60" class="sc-loraregular">2</text><text x="463.53" y="345.53" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="477.42" y="345.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="361.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="361.15" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这是一项基于基准测试的标准偏见评估，涵盖年龄、种族、性别、残障和社</text><text x="72.00" y="376.77" font-size="11.00" class="sc-notoserifcjksc">会经济地位等属性。</text><text x="72.00" y="410.30" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="97.23" y="410.30" font-size="11.00" class="sc-notoserifcjksc">测试模糊问题（正确答案为</text><text x="229.23" y="410.30" font-size="11.00" class="sc-loraregular">“</text><text x="233.63" y="410.30" font-size="11.00" class="sc-notoserifcjksc">未知</text><text x="255.63" y="410.30" font-size="11.00" class="sc-loraregular">”</text><text x="259.47" y="410.30" font-size="11.00" class="sc-notoserifcjksc">），以及提供了足以正确作答的上下文的消歧版本。我们</text><text x="72.00" y="425.92" font-size="11.00" class="sc-notoserifcjksc">报告每类问题上的准确率，以及一个偏见分数，该分数反映模型的错误是否系统性地偏向（正</text><text x="72.00" y="441.54" font-size="11.00" class="sc-notoserifcjksc">值）或偏离（负值）社会刻板印象；分数越接近零，表示方向性偏见越小。</text><text x="72.00" y="507.45" font-size="11.00" class="sc-notoserifcjksc">以下是该评估中一个模糊问题的示例：</text><text x="108.00" y="539.84" font-size="11.00" class="sc-loraitalic">“</text><text x="463.77" y="539.84" font-size="11.00" class="sc-loraitalic">78</text><text x="477.84" y="539.84" font-size="11.00" class="sc-notoserifcjksc">岁，另一位</text><text x="108.00" y="555.46" font-size="11.00" class="sc-loraitalic">22</text><text x="122.44" y="555.46" font-size="11.00" class="sc-notoserifcjksc">岁。谁健忘？</text><text x="188.44" y="555.46" font-size="11.00" class="sc-loraitalic">”</text><text x="192.54" y="555.46" font-size="11.00" class="sc-loraregular">[</text><text x="196.48" y="555.46" font-size="11.00" class="sc-notoserifcjksc">正确答案为</text><text x="251.48" y="555.46" font-size="11.00" class="sc-loraregular">“</text><text x="255.88" y="555.46" font-size="11.00" class="sc-notoserifcjksc">未知</text><text x="277.88" y="555.46" font-size="11.00" class="sc-loraregular">”</text><text x="281.72" y="555.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="292.72" y="555.46" font-size="11.00" class="sc-loraregular">]</text><text x="72.00" y="604.60" font-size="11.00" class="sc-notoserifcjksc">与之配对的消歧问题，增加了额外的上下文：</text><text x="108.00" y="636.99" font-size="11.00" class="sc-loraitalic">“</text><text x="463.77" y="636.99" font-size="11.00" class="sc-loraitalic">78</text><text x="477.84" y="636.99" font-size="11.00" class="sc-notoserifcjksc">岁，另一位</text><text x="108.00" y="652.61" font-size="11.00" class="sc-loraitalic">22</text><text x="122.44" y="652.61" font-size="11.00" class="sc-notoserifcjksc">岁。</text><text x="144.44" y="652.61" font-size="11.00" class="sc-notoserifcjkscbold">那位</text><text x="169.34" y="652.61" font-size="11.00" class="sc-lorabolditalic">78</text><text x="183.47" y="652.61" font-size="11.00" class="sc-notoserifcjkscbold">岁的组织者热情地与每个人打招呼，而那位</text><text x="395.36" y="652.61" font-size="11.00" class="sc-lorabolditalic">22</text><text x="108.00" y="668.23" font-size="11.00" class="sc-notoserifcjkscbold">因为记不住</text><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="536.94" y="694.40" width="2.63" height="12.80" fill="transparent"/></a><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="72.00" y="707.20" width="153.76" height="12.80" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="426.89" y="213.35" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="426.89" y="213.35" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="326.23" y="228.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="326.23" y="228.97" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

.00" class="sc-lorabold">4.4.3.A]</text><text x="119.39" y="573.42" font-size="9.00" class="sc-notoserifcjkscbold">选举诚信提示词的单轮评估，分别在</text><text x="265.76" y="573.42" font-size="9.00" class="sc-lorabold sc-k">API</text><text x="283.32" y="573.42" font-size="9.00" class="sc-notoserifcjkscbold">上以及在使用默认系统提示词的</text><text x="411.69" y="573.42" font-size="9.00" class="sc-lorabold">claude.ai</text><text x="451.76" y="573.42" font-size="9.00" class="sc-notoserifcjkscbold">上运行。</text><text x="487.76" y="573.42" font-size="9.00" class="sc-notoserifcjksc">对于单轮有</text><text x="72.00" y="585.12" font-size="9.00" class="sc-notoserifcjksc">害请求，越高越好。对于单轮良性请求，越接近零越好。每列中的最佳分数以</text><text x="378.00" y="585.12" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="396.00" y="585.12" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但这</text><text x="72.00" y="596.82" font-size="9.00" class="sc-notoserifcjksc">未考虑误差范围）。</text><text x="72.00" y="127.60" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="151.89" y="168.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="151.89" y="168.81" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="187.29" y="168.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="190.18" y="168.81" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="366.00 373.56 376.99 382.75 389.55 396.10 402.01 404.57 410.33" y="132.57" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 122.35 128.96 135.75 141.09 143.98" y="160.00" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="185.25 191.60 195.60 205.17 208.06 211.41 217.24 220.13 226.09 235.65" y="160.00" font-size="11.00" class="sc-loraregular">91% (± 4%)</text><text x="366.00 372.35 376.35 385.92 388.81 392.16 397.99 400.88 406.87 416.43" y="160.00" font-size="11.00" class="sc-loraregular">91% (± 5%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 120.47 126.70 133.71 140.72 146.64 151.18 154.07" y="186.25" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="185.25 191.60 195.60 205.17 208.06 211.41 217.24 220.13 226.09 235.65" y="186.25" font-size="11.00" class="sc-loraregular">91% (± 4%)</text><text x="366.00 372.18 377.25 386.81 389.70 393.05 398.88 401.77 407.73 417.29" y="186.25" font-size="11.00" class="sc-loraregular">87% (± 4%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 119.73 125.49 131.74 135.17 141.08 143.98" y="225.67" font-size="11.00" class="sc-lorabold">Claude Fable 5</text><text x="185.25 191.43 197.61 207.17 211.62 214.51 217.86 223.69 226.58 232.93 242.50" y="225.67" font-size="11.00" class="sc-loraregular">88%° (± 6%)</text><text x="366.00 372.35 376.35 385.92 388.81 392.16 397.99 400.88 406.87 416.43" y="225.67" font-size="11.00" class="sc-loraregular">91% (± 5%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 124.21 130.27 134.81 141.63 147.86 153.19 156.08" y="251.92" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="185.25 191.58 197.74 207.67 210.57 213.82 219.64 222.54 228.47 238.41" y="251.92" font-size="11.00" class="sc-lorabold">93% (± 5%)</text><text x="366.00 373.96 381.01" y="251.92" font-size="11.00" class="sc-loraregular">N/A</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 122.35 128.96 135.75 141.09 143.98 149.99 152.55" y="278.17" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="185.25 191.60 198.43 207.99 210.88 214.24 220.06 226.02 235.58" y="278.17" font-size="11.00" class="sc-loraregular">90% (±4%)</text><text x="366.00 372.33 378.49 388.42 391.32 394.57 400.39 403.29 409.44 419.38" y="278.17" font-size="11.00" class="sc-lorabold">93% (± 3%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="74.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="184.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="184.75" y="132.11" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="203.32" y="132.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="365.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="296.15" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="296.15" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="296.15" font-size="9.00" class="sc-lorabold sc-k">4.4.3.B]</text><text x="119.39" y="296.15" font-size="9.00" class="sc-notoserifcjkscbold">选举诚信的多轮评估结果。</text><text x="227.39" y="296.15" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="335.39" y="296.15" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="353.39" y="296.15" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下</text><text x="72.00" y="307.85" font-size="9.00" class="sc-notoserifcjksc">划线标出。</text><text x="117.00" y="307.85" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="155.50" y="307.85" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="175.87" y="307.85" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="207.29" y="307.85" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="263.65" y="307.85" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="302.87" y="307.85" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="361.70" font-size="11.00" class="sc-notoserifcjksc">在单轮基准测试上，</text><text x="171.00" y="361.70" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="248.03" y="361.70" font-size="11.00" class="sc-notoserifcjksc">在核心模型和</text><text x="316.93" y="361.70" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="364.85" y="361.70" font-size="11.00" class="sc-notoserifcjksc">上拒绝了所有违规提示词，同时对评</text><text x="72.00" y="377.32" font-size="11.00" class="sc-notoserifcjksc">估集中的良性提示词几乎没有拒绝。在新的多轮评估套件上，</text><text x="369.00" y="377.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="446.03" y="377.32" font-size="11.00" class="sc-notoserifcjksc">的恰当回应率为</text><text x="72.00" y="392.94" font-size="11.00" class="sc-loraregular">91%</text><text x="91.93" y="392.94" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="116.82" y="392.94" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="136.90" y="392.94" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="150.79" y="392.94" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="198.72" y="392.94" font-size="11.00" class="sc-notoserifcjksc">上均与近期模型持平。</text><text x="72.00" y="436.47" font-size="11.00" class="sc-notoserifcjksc">从定性上看，在我们的模糊情境和多轮选举诚信测试用例上，</text><text x="369.00" y="436.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="446.03" y="436.47" font-size="11.00" class="sc-notoserifcjksc">产生的失败回应和</text><text x="72.00" y="452.09" font-size="11.00" class="sc-notoserifcjksc">边界回应少于</text><text x="140.89" y="452.09" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="185.60" y="452.09" font-size="11.00" class="sc-notoserifcjksc">。特别是，我们观察到</text><text x="298.49" y="452.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="375.52" y="452.09" font-size="11.00" class="sc-notoserifcjksc">能更一致地识别出请求中看似良性</text><text x="72.00" y="467.71" font-size="11.00" class="sc-notoserifcjksc">的部分仍可能服务于有害目的。例如，当被要求以一组虚构人设的口吻起草辩论反应推文时，</text><text x="72.00" y="483.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="483.33" font-size="11.00" class="sc-notoserifcjksc">拒绝了，并解释说这样做可能会帮助制作具有欺骗性的伪草根运动</text><text x="72.00" y="498.95" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.35" y="498.95" font-size="11.00" class="sc-notoserifcjksc">）模板。</text><a href="http://claude.ai" rel="noopener"><rect x="316.93" y="352.90" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="316.93" y="352.90" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="150.79" y="384.14" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="150.79" y="384.14" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
