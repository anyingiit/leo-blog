.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="116.61" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89" y="116.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="116.61" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这些评估考察模型如何处理涉及我们</text><text x="525.93" y="116.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使</text><text x="72.00" y="132.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">用政策</text><text x="105.00" y="132.23" font-size="11.00" class="sc-notoserifcjksc">范围内领域、用户福祉以及偏见与诚信的请求。与以往发布一样，测试涵盖：横跨明显有</text><text x="72.00" y="147.85" font-size="11.00" class="sc-notoserifcjksc">害与明显良性请求的单轮提示词，旨在揭示模型在边界情境中行为的语境模糊提示词，以及由模</text><text x="72.00" y="163.47" font-size="11.00" class="sc-notoserifcjksc">拟用户试图逐步将模型引向有害结果的多轮对话。</text><text x="72.00" y="239.95" font-size="11.00" class="sc-notoserifcjksc">我们评估的方法与《</text><text x="171.00" y="239.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="209.29" y="239.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Sonnet 5</text><text x="257.24" y="239.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="290.24" y="239.95" font-size="11.00" class="sc-notoserifcjksc">》中所述的方法大体相似。除这些评估外，我们还</text><text x="72.00" y="255.57" font-size="11.00" class="sc-notoserifcjksc">在多轮评估套件中引入了一组新的对抗性选举诚信测试用例。我们在过去几次模型发布中已在内</text><text x="72.00" y="271.19" font-size="11.00" class="sc-notoserifcjksc">部运行这些评估以验证其有效性，现在其结果在第</text><text x="316.89" y="271.19" font-size="11.00" class="sc-loraregular">4.4.3</text><text x="343.25" y="271.19" font-size="11.00" class="sc-notoserifcjksc">节中报告。</text><text x="72.00" y="330.91" font-size="11.00" class="sc-notoserifcjksc">下文所列的</text><text x="129.89" y="330.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="206.93" y="330.91" font-size="11.00" class="sc-notoserifcjksc">结果反映的是模型在没有我们在生产环境中所施加的额外安全防护措</text><text x="72.00" y="346.53" font-size="11.00" class="sc-notoserifcjksc">施（例如实时探针以及离线监控与调查）情况下的行为。我们继续报告两种配置：核心模型本身</text><text x="72.00" y="362.15" font-size="11.00" class="sc-notoserifcjksc">（即在</text><text x="107.89" y="362.15" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="127.97" y="362.15" font-size="11.00" class="sc-notoserifcjksc">上，不使用系统提示词（</text><text x="248.97" y="362.15" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="326.25" y="362.15" font-size="11.00" class="sc-notoserifcjksc">）或其他特定于产品的指令），以及在</text><text x="72.00" y="377.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="119.93" y="377.77" font-size="11.00" class="sc-notoserifcjksc">消费者产品端上、搭配接近最终版的</text><text x="298.82" y="377.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="375.85" y="377.77" font-size="11.00" class="sc-notoserifcjksc">生产环境系统提示词的模型。我们</text><text x="72.00" y="393.39" font-size="11.00" class="sc-notoserifcjksc">还继续统一</text><text x="127.00" y="393.39" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="393.39" font-size="11.00" class="sc-notoserifcjksc">思考</text><text x="153.40" y="393.39" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="393.39" font-size="11.00" class="sc-notoserifcjksc">设置的报告方式。在</text><text x="259.13" y="393.39" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="279.21" y="393.39" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="301.21" y="393.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="378.24" y="393.39" font-size="11.00" class="sc-notoserifcjksc">的结果是对开启思考和关闭思考</text><text x="72.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc">两种配置的汇总。在</text><text x="173.89" y="409.01" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="221.82" y="409.01" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="243.82" y="409.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="320.85" y="409.01" font-size="11.00" class="sc-notoserifcjksc">仅以开启思考的方式提供；这些结果仅反映该</text><text x="72.00" y="424.63" font-size="11.00" class="sc-notoserifcjksc">配置。对比模型遵循同样的惯例：在两种设置都提供的情况下使用汇总分数，在仅有思考模式可</text><text x="72.00" y="440.25" font-size="11.00" class="sc-notoserifcjksc">用时使用仅开启思考的结果。</text><text x="72.00" y="525.22" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="525.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="525.22" font-size="11.00" class="sc-notoserifcjksc">在这些评估上的表现与</text><text x="316.93" y="525.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="399.92" y="525.22" font-size="11.00" class="sc-notoserifcjksc">（我们在该级别中最新的模</text><text x="72.00" y="540.84" font-size="11.00" class="sc-notoserifcjksc">型）大体相当。它在单轮有害请求上保持了较高的无害回应率，同时在良性请求上保持了位居最</text><text x="72.00" y="556.46" font-size="11.00" class="sc-notoserifcjksc">低之列的过度拒绝（</text><text x="171.00" y="556.46" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="233.59" y="556.46" font-size="11.00" class="sc-notoserifcjksc">）率。多轮行为与</text><text x="324.48" y="556.46" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="372.08" y="556.46" font-size="11.00" class="sc-notoserifcjksc">一致，但存在一些下文所述的定性</text><text x="72.00" y="572.08" font-size="11.00" class="sc-notoserifcjksc">差异。在</text><text x="118.89" y="572.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="166.82" y="572.08" font-size="11.00" class="sc-notoserifcjksc">上，与核心</text><text x="224.71" y="572.08" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="244.79" y="572.08" font-size="11.00" class="sc-notoserifcjksc">模型相比，系统提示词中包含的安全指令在单轮和多轮测试</text><text x="72.00" y="587.70" font-size="11.00" class="sc-notoserifcjksc">中都进一步加强了模型对有害请求的处理。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="525.93" y="107.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="525.93" y="107.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="536.93" y="107.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="72.00" y="123.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="123.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="123.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="123.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="123.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="171.00" y="231.15" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/283ef97c476cf442c91d9a37d5b214242a55bb92/Claude%20Sonnet%205%20System%20Card.pdf" rel="noopener"><rect x="209.29" y="231.15" width="36.17" height= 36.31 143.13 149.36 154.69 157.58" y="382.42" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="198.75 204.84 209.42 211.96 218.79 225.14 234.70 237.60 240.95 246.77 249.67 256.32 259.02 264.92 271.75 281.31" y="382.42" font-size="11.00" class="sc-loraregular">97.09% (± 0.20%)</text><text x="372.00 379.96 387.01" y="382.42" font-size="11.00" class="sc-loraregular">N/A</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 123.85 130.46 137.25 142.59 145.48 151.49 154.05" y="407.75" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="198.75 205.08 209.54 212.11 218.12 224.44 234.38 237.27 240.52 246.35 249.24 256.04 258.60 263.06 269.22 279.16" y="407.75" font-size="11.00" class="sc-lorabold">97.46% (± 0.13%)</text><text x="372.00 378.35 384.53 386.88 391.95 398.30 407.87 410.76 414.11 419.94 422.83 429.48 432.02 438.84 445.20 454.76" y="407.75" font-size="11.00" class="sc-loraregular">98.79% (± 0.09%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="76.00" y="246.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="246.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="286.25" y="246.15" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="304.82" y="246.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系</text><text x="198.25" y="261.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">统提示词</text><text x="371.50" y="246.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="459.50" y="246.15" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="149.18" font-size="11.00" class="sc-notoserifcjksc">单轮有害请求评估衡量受测模型能在多大程度上可靠地拒绝或安全地引导那些有害或明显违反我</text><text x="72.00" y="164.80" font-size="11.00" class="sc-notoserifcjksc">们使用政策（</text><text x="138.00" y="164.80" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="202.53" y="164.80" font-size="11.00" class="sc-notoserifcjksc">）的请求。我们在七种语言（阿拉伯语、英语、法语、印地语、韩</text><text x="72.00" y="180.42" font-size="11.00" class="sc-notoserifcjksc">语、中文普通话和俄语）中测试覆盖</text><text x="250.89" y="180.42" font-size="11.00" class="sc-loraregular">16</text><text x="264.15" y="180.42" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型回应未</text><text x="72.00" y="196.04" font-size="11.00" class="sc-notoserifcjksc">助长所请求危害的提示词所占的比例。</text><text x="72.00" y="424.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="424.81" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="424.81" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="424.81" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，涵盖所有测试语言。</text><text x="296.74" y="424.81" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="449.74" y="424.81" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="467.74" y="424.81" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最</text><text x="72.00" y="436.51" font-size="9.00" class="sc-notoserifcjksc">高，次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩语、中文普通话和俄语进行。由于常规评估</text><text x="72.00" y="448.21" font-size="9.00" class="sc-notoserifcjksc">更新，先前模型的结果与以往系统卡（</text><text x="225.00" y="448.21" font-size="9.00" class="sc-loraregular sc-k">System Card</text><text x="277.90" y="448.21" font-size="9.00" class="sc-notoserifcjksc">）中的结果存在差异。</text><text x="367.90" y="448.21" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="406.40" y="448.21" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="426.77" y="448.21" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="458.19" y="448.21" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="72.00" y="459.91" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="111.21" y="459.91" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="516.86" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="516.86" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="105.97" y="516.86" font-size="11.00" class="sc-notoserifcjksc">上不使用系统提示词时，</text><text x="226.97" y="516.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="304.00" y="516.86" font-size="11.00" class="sc-notoserifcjksc">的无害回应率略低于近期模型。这一差距主要源</text><text x="72.00" y="532.48" font-size="11.00" class="sc-notoserifcjksc">于非法药物和进食紊乱领域中的回应：这些回应偶尔提供了超出减害框架所需程度的可操作细节</text><text x="72.00" y="563.72" font-size="11.00" class="sc-notoserifcjksc">这一模式，</text><text x="127.00" y="563.72" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="174.93" y="563.72" font-size="11.00" class="sc-notoserifcjksc">系统提示词可部分缓解该问题。</text><text x="72.00" y="628.55" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="628.55" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="656.44" font-size="11.00" class="sc-notoserifcjksc">单轮良性请求评估衡量模型拒绝那些主题敏感但适合回答的请求的频率。该提示词集与上文的有</text><text x="72.00" y="672.06" font-size="11.00" class="sc-notoserifcjksc">害请求集覆盖相同的</text><text x="173.89" y="672.06" font-size="11.00" class="sc-loraregular">16</text><text x="187.15" y="672.06" font-size="11.00" class="sc-notoserifcjksc">个政策领域和七种语言。在此，我们报告过度拒绝率，即模型拒绝参与的</text><text x="72.00" y="687.68" font-size="11.00" class="sc-notoserifcjksc">良性提示词所占的比例。</text><a href="http://claude.ai" rel="noopener"><rect x="127.00" y="554.92" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="127.00" y="554.92" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 123.85 130.46 137.25 142.59 145.48" y="132.70" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="198.75 205.40 207.94 214.77 221.12 230.68 233.57 236.93 242.75 245.64 252.29 254.83 261.58 267.48 277.05" y="132.70" font-size="11.00" class="sc-loraregular">0.09% (± 0.02%)</text><text x="372.00 378.80 381.37 387.38 392.53 402.47 405.36 408.61 414.44 417.33 424.14 426.53 433.52 439.81 449.75" y="132.70" font-size="11.00" class="sc-lorabold">0.47% (± 0.08%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.97 128.20 135.21 142.22 148.14 152.68 155.57" y="158.03" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="198.75 205.40 208.10 214.10 220.45 230.01 232.90 236.26 242.08 244.97 251.62 254.16 260.99 266.98 276.54" y="158.03" font-size="11.00" class="sc-loraregular">0.59% (± 0.05%)</text><text x="372.00 376.00 378.71 384.70 390.65 400.22 403.11 406.46 412.29 415.18 421.83 424.53 428.53 435.36 444.92" y="158.03" font-size="11.00" class="sc-loraregular">1.54% (± 0.10%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.23 126.99 133.24 136.67 142.58 145.48" y="183.36" font-size="11.00" class="sc-lorabold">Claude Fable 5</text><text x="198.75 205.55 207.95 214.94 219.40 229.34 232.23 235.49 241.31 244.20 251.01 253.40 260.39 264.86 274.79" y="183.36" font-size="11.00" class="sc-lorabold">0.01% (± 0.01%)</text><text x="372.00 378.65 381.35 387.31 393.67 403.23 406.12 409.47 415.30 418.19 424.84 427.38 433.96 439.03 448.59" y="183.36" font-size="11.00" class="sc-loraregular">0.49% (± 0.07%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 125.71 131.77 136.31 143.13 149.36 154.69 157.58" y="208.69" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="198.75 205.40 207.94 214.77 220.89 230.45 233.34 236.69 242.52 245.41 252.06 254.60 261.35 267.25 276.82" y="208.69" font-size="11.00" class="sc-loraregular">0.03% (± 0.02%)</text><text x="372.00 379.96 387.01" y="208.69" font-size="11.00" class="sc-loraregular">N/A</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 123.85 130.46 137.25 142.59 145.48 151.49 154.05" y="234.02" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="198.75 205.40 208.10 214.23 220.22 229.78 232.67 236.02 241.85 244.74 251.39 253.93 260.76 266.71 276.28" y="234.02" font-size="11.00" class="sc-loraregular">0.35% (± 0.04%)</text><text x="372.00 378.65 381.35 387.35 393.34 402.90 405.79 409.14 414.97 417.86 424.51 427.05 433.87 440.23 449.79" y="234.02" font-size="11.00" class="sc-loraregular">0.55% (± 0.06%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="76.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="264.25" y="88.61" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="282.82" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提</text><text x="198.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">示词</text><text x="371.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="437.50" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="251.09" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="251.09" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="251.09" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="251.09" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，涵盖所有测试语言。</text><text x="297.88" y="251.09" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上是良性的提示词）；</text><text x="72.00" y="262.79" font-size="9.00" class="sc-notoserifcjksc">数值越低越好。</text><text x="135.00" y="262.79" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="153.00" y="262.79" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低，次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩语、</text><text x="72.00" y="274.49" font-size="9.00" class="sc-notoserifcjksc">中文普通话和俄语进行。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="450.00" y="274.49" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="488.50" y="274.49" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="508.87" y="274.49" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="286.19" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="128.37" y="286.19" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="167.58" y="286.19" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="343.13" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="343.13" font-size="11.00" class="sc-notoserifcjksc">在核心模型和</text><text x="217.93" y="343.13" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="265.85" y="343.13" font-size="11.00" class="sc-notoserifcjksc">上的过度拒绝率均处于近期模型中最低之列，在</text><text x="499.75" y="343.13" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="519.82" y="343.13" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="358.75" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="358.75" font-size="11.00" class="sc-loraregular sc-k">0.09%</text><text x="117.85" y="358.75" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="142.74" y="358.75" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="190.67" y="358.75" font-size="11.00" class="sc-notoserifcjksc">上为</text><text x="215.56" y="358.75" font-size="11.00" class="sc-loraregular sc-k">0.47%</text><text x="245.53" y="358.75" font-size="11.00" class="sc-notoserifcjksc">。其在</text><text x="281.42" y="358.75" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="329.35" y="358.75" font-size="11.00" class="sc-notoserifcjksc">上的表现是我们在上文所报告的模型中观察</text><text x="72.00" y="374.37" font-size="11.00" class="sc-notoserifcjksc">到的最佳表现。</text><text x="72.00" y="406.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="406.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="434.13" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察模型能否在更长、不断演变的对话中（而不仅仅是在单轮交互中）保持安全行为。</text><text x="72.00" y="449.75" font-size="11.00" class="sc-notoserifcjksc">为构建每个测试用例，内部政策专家撰写一份规格说明，描述一个合成</text><text x="413.00" y="449.75" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="449.75" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="439.40" y="449.75" font-size="11.00" class="sc-loraregular">”</text><text x="443.24" y="449.75" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策</text><text x="72.00" y="465.37" font-size="11.00" class="sc-notoserifcjksc">略，再由一个</text><text x="140.89" y="465.37" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="465.37" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="248.08" y="465.37" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="331.14" y="465.37" font-size="11.00" class="sc-notoserifcjksc">）生成遵循该规格说明的用户轮次。随后我</text><text x="72.00" y="480.99" font-size="11.00" class="sc-notoserifcjksc">们评估受评模型如何回应。</text><text x="72.00" y="525.09" font-size="11.00" class="sc-notoserifcjksc">我们报告的恰当回应率是指模型在整个对话中始终表现恰当的对话所占的比例。每段对话均依据</text><text x="72.00" y="540.71" font-size="11.00" class="sc-notoserifcjksc">其所属风险领域专用的评分细则进行评分，这意味着不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="217.93" y="334.33" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="217.93" y="334.33" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="142.74" y="349.95" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="142.74" y="349.95" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="281.42" y="349.95" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="281.42" y="349.95" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="515.67" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">上图展示各多轮测试领域的恰当回应率。</text><text x="280.12" y="515.67" font-size="9.00" class="sc-notoserifcjksc">百分比指各模型在整个对话中始终恰当回应的对话所占的比例。结</text><text x="72.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">果先展示</text><text x="110.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="126.79" y="527.38" font-size="9.00" class="sc-notoserifcjksc">不使用系统提示词的情况，随后展示</text><text x="273.16" y="527.38" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="312.37" y="527.38" font-size="9.00" class="sc-notoserifcjksc">的情况。</text><text x="348.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="386.87" y="527.38" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="407.24" y="527.38" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="438.66" y="527.38" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="495.03" y="527.38" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="72.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的结果。越高越好。由于常规评估更新，先前模型的结果可能与以往系统</text><text x="72.00" y="550.78" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><text x="72.00" y="607.72" font-size="11.00" class="sc-notoserifcjksc">在核心</text><text x="107.89" y="607.72" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="127.97" y="607.72" font-size="11.00" class="sc-notoserifcjksc">上不使用系统提示词时，</text><text x="248.97" y="607.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="326.00" y="607.72" font-size="11.00" class="sc-notoserifcjksc">的多轮恰当回应率与</text><text x="427.89" y="607.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="513.78" y="607.72" font-size="11.00" class="sc-notoserifcjksc">大体</text><text x="72.00" y="623.34" font-size="11.00" class="sc-notoserifcjksc">相当。与单轮测试一样，</text><text x="193.00" y="623.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="240.93" y="623.34" font-size="11.00" class="sc-notoserifcjksc">系统提示词提升了各领域的表现，在自杀与自伤测试用例中最</text><text x="72.00" y="638.96" font-size="11.00" class="sc-notoserifcjksc">为明显。</text><a href="http://claude.ai" rel="noopener"><rect x="193.00" y="614.54" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="193.00" y="614.54" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="503.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="126.65" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的行为与</text><text x="157.64" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="243.52" y="126.65" font-size="11.00" class="sc-notoserifcjksc">相比在定性层面上有何不同。我们在下文总结了若干主题；儿</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">童安全、心理健康与选举诚信将分别在第</text><text x="272.89" y="142.27" font-size="11.00" class="sc-loraregular">4.2</text><text x="287.47" y="142.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="298.47" y="142.27" font-size="11.00" class="sc-loraregular">4.3</text><text x="316.16" y="142.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.05" y="142.27" font-size="11.00" class="sc-loraregular">4.4.3</text><text x="356.41" y="142.27" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="72.00" y="201.99" font-size="11.00" class="sc-notoserifcjksc">一项改进在于，</text><text x="149.00" y="201.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="226.03" y="201.99" font-size="11.00" class="sc-notoserifcjksc">的拒绝往往比</text><text x="294.93" y="201.99" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="342.52" y="201.99" font-size="11.00" class="sc-notoserifcjksc">的更有实质内容；它常常明确地讨论某个</text><text x="72.00" y="217.61" font-size="11.00" class="sc-notoserifcjksc">请求为何可能存在问题，而不是简单地一口回绝。我们在以往模型中（包括</text><text x="437.89" y="217.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="526.14" y="217.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="233.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="264.47" font-size="11.00" class="sc-notoserifcjksc">常明确说明自己不会生成哪些内容及其原因。这种倾向于给出更长、更详尽回应的特点，偶尔也</text><text x="72.00" y="280.09" font-size="11.00" class="sc-notoserifcjksc">会导致</text><text x="107.89" y="280.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="184.93" y="280.09" font-size="11.00" class="sc-notoserifcjksc">在回应边界性请求时比理想情况更为冗长，其回应因此有时提供了比</text><text x="72.00" y="295.71" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="72.00" y="311.33" font-size="11.00" class="sc-notoserifcjksc">能帮助用户预判常规的平台检测机制。</text><text x="72.00" y="422.49" font-size="11.00" class="sc-notoserifcjksc">一个需要持续改进的方面是</text><text x="206.89" y="422.49" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="422.49" font-size="11.00" class="sc-notoserifcjksc">容易受到看似良性的包装的影响。在多个领域中，我</text><text x="72.00" y="438.11" font-size="11.00" class="sc-notoserifcjksc">们观察到的失败集中在以模拟样稿或虚构</text><text x="270.00" y="438.11" font-size="11.00" class="sc-loraregular">/</text><text x="277.59" y="438.11" font-size="11.00" class="sc-notoserifcjksc">角色扮演练习的形式提出的请求上。在这些情况下，</text><text x="72.00" y="453.73" font-size="11.00" class="sc-notoserifcjksc">模型更愿意生成一些在用户有更明显的有害意图时它可能本会拒绝的内容。</text><text x="72.00" y="521.04" font-size="14.00" class="sc-poppinssemibold">4.2</text><text x="96.26" y="521.04" font-size="14.00" class="sc-notosanscjkscbold">儿童安全评估</text><text x="72.00" y="547.60" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude.ai</text><text x="121.76" y="547.60" font-size="11.00" class="sc-notoserifcjksc">是我们面向消费者的产品，仅向</text><text x="278.66" y="547.60" font-size="11.00" class="sc-loraregular">18</text><text x="291.74" y="547.60" font-size="11.00" class="sc-notoserifcjksc">岁及以上的用户开放。我们持续致力于在模型的开</text><text x="72.00" y="563.22" font-size="11.00" class="sc-notoserifcjksc">发、部署和维护中实施稳健的儿童安全措施。任何为未成年人提供服务的企业客户都必须遵守我</text><text x="72.00" y="578.84" font-size="11.00" class="sc-notoserifcjksc">们</text><text x="83.00" y="578.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="127.00" y="578.84" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="149.00" y="578.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外安全防护措施</text><text x="237.00" y="578.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="628.56" font-size="11.00" class="sc-notoserifcjksc">我们按照与其他近期发布的模型（如</text><text x="250.89" y="628.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="337.13" y="628.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="351.03" y="628.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="434.02" y="628.56" font-size="11.00" class="sc-notoserifcjksc">）相同的测试方案运</text><text x="72.00" y="644.18" font-size="11.00" class="sc-notoserifcjksc">行了儿童安全评估。</text><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="538.80" width="46.87" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="149.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="149.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="160.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="160.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="171.00" y="570.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="171.00" y="570.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-mode "616.68" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="337.13" y="616.68" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线</text><text x="72.00" y="628.38" font-size="9.00" class="sc-notoserifcjksc">标出。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="378.00" y="628.38" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="416.50" y="628.38" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="436.87" y="628.38" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="468.29" y="628.38" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="72.00" y="640.08" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="111.21" y="640.08" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="695.48" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="695.48" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.03" y="695.48" font-size="11.00" class="sc-notoserifcjksc">在儿童安全方面的表现与</text><text x="327.93" y="695.48" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="413.81" y="695.48" font-size="11.00" class="sc-notoserifcjksc">相当。在单轮请求上，该</text><text x="72.00" y="711.10" font-size="11.00" class="sc-notoserifcjksc">模型使基准测试达到饱和：对有害请求的无害回应</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">率达到</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular">100%</text><text x="135.13" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，同时对良性提示词的过度拒绝接近于零。在</text><text x="358.02" y="82.61" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="378.10" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="391.99" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="439.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，多轮表现显示出</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与近期发布的各模型相近的水平。</text><text x="72.00" y="141.19" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="141.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="171.78" y="141.19" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="204.78" y="141.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.81" y="141.19" font-size="11.00" class="sc-notoserifcjksc">始终拒绝为企图实施儿童性虐待与性剥削的恶意行为</text><text x="72.00" y="156.81" font-size="11.00" class="sc-notoserifcjksc">者提供能力提升（</text><text x="160.00" y="156.81" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="187.32" y="156.81" font-size="11.00" class="sc-notoserifcjksc">）。例如，</text><text x="242.32" y="156.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="319.36" y="156.81" font-size="11.00" class="sc-notoserifcjksc">没有向试图规避儿童性虐待材料（</text><text x="484.36" y="156.81" font-size="11.00" class="sc-loraregular">CSAM</text><text x="515.27" y="156.81" font-size="11.00" class="sc-notoserifcjksc">）检</text><text x="72.00" y="232.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="232.15" font-size="11.00" class="sc-notoserifcjksc">继续对明确的儿童性虐待与性剥削表现出坚决拒绝，但它确实表现出接受良性包</text><text x="72.00" y="247.77" font-size="11.00" class="sc-notoserifcjksc">装的意愿，尤其是在多轮对话中。例如，当被要求研究儿童性诱骗的手段时，</text><text x="446.00" y="247.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="523.03" y="247.77" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="72.00" y="263.39" font-size="11.00" class="sc-notoserifcjksc">该请求视为出于善意，并在预防与提高认识的语境下给出了关于儿童性诱骗机制的详细研究内</text><text x="72.00" y="279.01" font-size="11.00" class="sc-notoserifcjksc">容，包括恶意行为者可能利用的途径和手段。这些信息通常是公开可得的，但更细致周全的回应</text><text x="72.00" y="294.63" font-size="11.00" class="sc-notoserifcjksc">会在意图不明确时保持谨慎，并限制此类细节的程度。当恶意意图在后续轮次中变得愈发明显</text><text x="72.00" y="310.25" font-size="11.00" class="sc-notoserifcjksc">时，</text><text x="94.00" y="310.25" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="171.03" y="310.25" font-size="11.00" class="sc-notoserifcjksc">确实予以拒绝。</text><text x="72.00" y="387.88" font-size="11.00" class="sc-notoserifcjksc">这些行为集中出现在核心</text><text x="195.89" y="387.88" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="215.97" y="387.88" font-size="11.00" class="sc-notoserifcjksc">模型上。与此前的模型类似，我们为</text><text x="394.86" y="387.88" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="442.79" y="387.88" font-size="11.00" class="sc-notoserifcjksc">实施了系统提示词</text><text x="72.00" y="403.50" font-size="11.00" class="sc-notoserifcjksc">干预措施以应对这些行为。我们继续鼓励在</text><text x="283.89" y="403.50" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="303.97" y="403.50" font-size="11.00" class="sc-notoserifcjksc">上进行部署的开发者，在用户群体中可能存在未</text><text x="72.00" y="419.12" font-size="11.00" class="sc-notoserifcjksc">成年人或恶意行为者的情境下，采用与我们的系统提示词相当的安全防护措施。</text><text x="72.00" y="486.42" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="486.42" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="523.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="523.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00" y="551.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="551.41" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也不用于诊断或治疗任何疾病。每个</text><text x="443.18" y="551.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="481.48" y="551.41" font-size="11.00" class="sc-notoserifcjksc">模型都经过</text><text x="72.00" y="582.65" font-size="11.00" class="sc-notoserifcjksc">以同理心和关怀作出回应，同时在适当时引导用户寻求真人支持：求助热线、心理健康专业人</text><text x="72.00" y="598.27" font-size="11.00" class="sc-notoserifcjksc">士，或值得信赖的朋友或家人。</text><text x="72.00" y="664.75" font-size="11.00" class="sc-notoserifcjksc">本节中的评估考察</text><text x="162.89" y="664.75" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="664.75" font-size="11.00" class="sc-notoserifcjksc">对涉及自杀与自伤的对话的回应。它们衡量模型能否对可能表明存在</text><text x="72.00" y="680.37" font-size="11.00" class="sc-notoserifcjksc">风险的提示词作出安全且支持性的回应，同时在同一</text><a href="http://claude.ai" rel="noopener"><rect x="391.99" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="391.99" y="73.81" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="394.86" y="379.08" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="394.86" y="379.08" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

fff">单轮良性请求</text><text x="260.50" y="146.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="354.25" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="354.25" y="146.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="454.00" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="454.00" y="146.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="74.50" y="491.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="185.50" y="491.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="185.50" y="534.50" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="204.07" y="534.50" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="366.25" y="491.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">领域的良性请求上保持有帮助。我们报告单轮无害回应率、单轮过度拒绝率以及多轮恰当回应</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">率。</text><text x="72.00" y="392.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="392.96" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="392.96" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="392.96" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的单轮评估结果。</text><text x="235.12" y="392.96" font-size="9.00" class="sc-notoserifcjksc">单轮有害与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒</text><text x="72.00" y="404.66" font-size="9.00" class="sc-notoserifcjksc">绝率越低越好。</text><text x="135.00" y="404.66" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="153.00" y="404.66" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结果与以</text><text x="72.00" y="416.36" font-size="9.00" class="sc-notoserifcjksc">往系统卡中的结果存在差异。</text><text x="189.00" y="416.36" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="227.50" y="416.36" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="247.87" y="416.36" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="279.29" y="416.36" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="335.66" y="416.36" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="374.87" y="416.36" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其使用系统提示</text><text x="72.00" y="428.06" font-size="9.00" class="sc-notoserifcjksc">词时的结果。</text><text x="72.00" y="685.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="685.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="685.39" font-size="9.00" class="sc-lorabold sc-k">4.3.1.B]</text><text x="118.12" y="685.39" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的多轮评估结果。</text><text x="235.12" y="685.39" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="343.12" y="685.39" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="361.12" y="685.39" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以</text><text x="72.00" y="697.09" font-size="9.00" class="sc-notoserifcjksc">下划线标出。由于常规</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="315.00" y="80.05" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="353.50" y="80.05" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="373.87" y="80.05" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="405.29" y="80.05" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="461.66" y="80.05" font-size="9.00" class="sc-loraregular sc-k">claude.ai</text><text x="500.87" y="80.05" font-size="9.00" class="sc-notoserifcjksc">上使用，</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="119.11" font-size="11.00" class="sc-notoserifcjksc">在自杀与自伤情境下的恰当回应率方面，</text><text x="270.00" y="119.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="347.03" y="119.11" font-size="11.00" class="sc-notoserifcjksc">的整体表现与</text><text x="415.93" y="119.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="501.81" y="119.11" font-size="11.00" class="sc-notoserifcjksc">相当，</text><text x="72.00" y="134.73" font-size="11.00" class="sc-notoserifcjksc">对可能助长自杀与自伤行为的请求保持了较高的拒绝率。从定性角度看，与</text><text x="437.89" y="134.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="523.78" y="134.73" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="150.35" font-size="11.00" class="sc-notoserifcjksc">比，</text><text x="94.00" y="150.35" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="171.03" y="150.35" font-size="11.00" class="sc-notoserifcjksc">在处理自杀与自伤主题的用户询问和多轮对话时表现好坏参半：在某些方面</text><text x="72.00" y="165.97" font-size="11.00" class="sc-notoserifcjksc">显示出改进的迹象，在另一些方面则有所退步。</text><text x="72.00" y="226.26" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="226.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="133.49" y="226.26" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="166.49" y="226.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="243.52" y="226.26" font-size="11.00" class="sc-notoserifcjksc">在回应自杀与自伤相关询问时，较少表示</text><text x="444.42" y="226.26" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="482.71" y="226.26" font-size="11.00" class="sc-notoserifcjksc">可以提供无</text><text x="72.00" y="257.50" font-size="11.00" class="sc-notoserifcjksc">们认为减少此类情况是一种改进，因为这更诚实地反映了</text><text x="349.89" y="257.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="388.18" y="257.50" font-size="11.00" class="sc-notoserifcjksc">的局限，并可能有助于引导用</text><text x="72.00" y="273.12" font-size="11.00" class="sc-notoserifcjksc">户考虑其他求助途径。</text><text x="182.00" y="273.12" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="259.03" y="273.12" font-size="11.00" class="sc-notoserifcjksc">也更一致地以用户对其亲身经历的理解和陈述为依据，而</text><text x="72.00" y="288.74" font-size="11.00" class="sc-notoserifcjksc">不是对用户的情绪状态或从事自伤行为的潜在动机作出隐含的假设。</text><text x="72.00" y="365.79" font-size="11.00" class="sc-notoserifcjksc">然而，</text><text x="105.00" y="365.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="182.03" y="365.79" font-size="11.00" class="sc-notoserifcjksc">在回应用户披露的自杀或自伤风险时，表现出一些此前已注意到的弱点。</text><text x="72.00" y="381.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="72.00" y="397.03" font-size="11.00" class="sc-notoserifcjksc">些对话中，模型有时还会转向提供过多细节。例如，它有时会建议</text><text x="391.00" y="397.03" font-size="11.00" class="sc-loraregular">“</text><text x="395.40" y="397.03" font-size="11.00" class="sc-notoserifcjksc">手段替代</text><text x="439.40" y="397.03" font-size="11.00" class="sc-loraregular">”</text><text x="443.24" y="397.03" font-size="11.00" class="sc-notoserifcjksc">方法，或在自伤情</text><text x="72.00" y="412.65" font-size="11.00" class="sc-notoserifcjksc">境中给出减害建议，而这两者都是临床上存在争议的策略，研究也未表明它们能有意义地减少自</text><text x="72.00" y="428.27" font-size="11.00" class="sc-notoserifcjksc">伤事件。在试图说服用户寻求帮助或以其他方式将风险降至最低时，这些冗长的回应有时还包含</text><text x="72.00" y="443.89" font-size="11.00" class="sc-notoserifcjksc">无益的认可，即认可用户对求助的担忧，或认可自伤行为背后可能的功能。此外，</text><text x="468.00" y="443.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="459.51" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="459.51" font-size="11.00" class="sc-notoserifcjksc">更有可能推测可能导致用户自杀或自伤行为的心理健康诊断。在作出推测时，</text><text x="454.89" y="459.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="72.00" y="475.13" font-size="11.00" class="sc-notoserifcjksc">的回应承认它无法提供医学诊断，并继续引导用户寻求专业的医学评估与护理。这些行为主要是</text><text x="72.00" y="490.75" font-size="11.00" class="sc-notoserifcjksc">在不使用系统提示词的公开</text><text x="206.89" y="490.75" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="226.97" y="490.75" font-size="11.00" class="sc-notoserifcjksc">上观察到的。</text><text x="72.00" y="618.68" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="618.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="162.93" y="618.68" font-size="11.00" class="sc-notoserifcjksc">发布之前，我们更新了</text><text x="275.82" y="618.68" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="323.75" y="618.68" font-size="11.00" class="sc-notoserifcjksc">的系统提示词，以应对这些不期望出现的行</text><text x="72.00" y="634.30" font-size="11.00" class="sc-notoserifcjksc">为。该系统提示词包含以下指示：避免建议涉及身体不适的自伤技巧、避免提及自杀或自伤的方</text><text x="72.00" y="649.92" font-size="11.00" class="sc-notoserifcjksc">法，并在适当时保持回应简洁。更新后的提示词还强调，</text><text x="347.00" y="649.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="385.29" y="649.92" font-size="11.00" class="sc-notoserifcjksc">无法诊断心理健康状况，而应继</text><text x="72.00" y="665.54" font-size="11.00" class="sc-notoserifcjksc">续将人们引导至持证的健康专业人员。该系统提示词切实减少了上述行为的出现。</text><a href="http://claude.ai" rel="noopener"><rect x="275.82" y="609.88" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="275.82" y="609.88" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
