.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="118.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00" y="118.21" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="191.66" y="118.21" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55" y="118.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="320.30" y="118.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="374.14" y="118.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="410.03" y="118.21" font-size="11.00" class="sc-loraregular">Opus</text><text x="439.88" y="118.21" font-size="11.00" class="sc-notoserifcjksc">级模型，并报告了针</text><text x="72.00" y="133.83" font-size="11.00" class="sc-notoserifcjksc">对其能力及安全特性的多种评估。</text><text x="72.00" y="168.18" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="168.18" font-size="14.00" class="sc-notosanscjkscbold">模型训练与特性</text><text x="72.00" y="205.28" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.</text><text x="91.27" y="205.28" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与流程</text><text x="72.00" y="233.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="233.17" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开及非公</text><text x="72.00" y="248.79" font-size="11.00" class="sc-notoserifcjksc">开数据集，以及由其他模型生成的合成数据。在训练过程中，我们使用了多种数据清洗和过滤方</text><text x="72.00" y="264.41" font-size="11.00" class="sc-notoserifcjksc">法，包括去重和分类。我们使用一个名为</text><text x="272.89" y="264.41" font-size="11.00" class="sc-loraregular sc-k">ClaudeBot</text><text x="328.54" y="264.41" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。</text><text x="72.00" y="280.03" font-size="11.00" class="sc-notoserifcjksc">该爬虫遵循行业标准做法，遵守网站运营者设置的</text><text x="316.89 321.29 325.98 332.41 338.82 345.25 349.51 354.60 357.17 361.56 367.39 371.65" y="280.03" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="378.38" y="280.03" font-size="11.00" class="sc-notoserifcjksc">指令，这些指令表明运营者是否</text><text x="72.00" y="295.65" font-size="11.00" class="sc-notoserifcjksc">允许爬取其网站内容。我们不会访问受密码保护的页面，也不会访问需要登录或</text><text x="459.89" y="295.65" font-size="11.00" class="sc-loraregular sc-k">CAPTCHA</text><text x="514.11" y="295.65" font-size="11.00" class="sc-notoserifcjksc">验证</text><text x="72.00" y="311.27" font-size="11.00" class="sc-notoserifcjksc">的页面。我们会对所使用的训练数据开展尽职调查。该爬虫以透明方式运行；网站运营者可以轻</text><text x="72.00" y="326.89" font-size="11.00" class="sc-notoserifcjksc">松识别它何时爬取了其网页，并向我们表明其偏好。</text><text x="72.00" y="421.28" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00" y="421.28" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="209.74" y="421.28" font-size="11.00" class="sc-notoserifcjksc">经过了严格的后训练和微调，目的是使其成为一个行为符合</text><text x="498.64" y="421.28" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="72.00" y="436.90" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的宪法（</text><text x="116.00" y="436.90" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">constitution</text><text x="178.81" y="436.90" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="189.81" y="436.90" font-size="11.00" class="sc-notoserifcjksc">中所述价值观的助手。</text><text x="299.81" y="436.90" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="338.10" y="436.90" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使用与用户输入相同</text><text x="72.00" y="452.52" font-size="11.00" class="sc-notoserifcjksc">的语言进行回应。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00" y="496.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="496.05" font-size="11.00" class="sc-notoserifcjksc">的知识截止日期为</text><text x="239.93" y="496.05" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="267.74" y="496.05" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="281.64" y="496.05" font-size="11.00" class="sc-loraregular">5</text><text x="290.53" y="496.05" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00" y="526.78" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2</text><text x="90.64" y="526.78" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00" y="558.67" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="558.67" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00" y="574.29" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00" y="574.29" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="180.83" y="574.29" font-size="11.00" class="sc-notoserifcjksc">只会与这样的平台合作：认同我们为工作者提供公平且合乎道德的报酬这</text><text x="72.00" y="589.91" font-size="11.00" class="sc-notoserifcjksc">一理念，并承诺无论在何地均践行安全的工作场所规范，遵循我们在采购合同中详细规定的众包</text><text x="72.00" y="605.53" font-size="11.00" class="sc-notoserifcjksc">工作者福祉标准。</text><text x="72.00" y="670.36" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.3</text><text x="90.97" y="670.36" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">使用政策与支持</text><text x="72.00" y="702.24" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="702.24" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="702.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="702.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83" y="702.24" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="256.36" y="702.24" font-size="11.00" class="sc-notoserifcjksc">）详细规定了我们模型的禁止用途，以及我们对</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="498.64" y="412.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="498.64" y="412.48" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="534.03" y="412.48" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="428.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="428.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="428.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="428.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="428.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="105.00" y="428.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="105.00" y="428.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="116.00" y="428.10" width="62.81" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="178.81" y="428.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="693.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="693.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="693.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="693.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="693.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="693.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="693.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="693.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">高风险场景和其他特定场景中使用的要求。</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Frontier Compliance</text><text x="72.00" y="130.61" font-size="11.00" class="sc-loraregular sc-k">Framework</text><text x="129.77" y="130.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="140.77" y="130.61" font-size="11.00" class="sc-loraregular sc-k">“FCF”</text><text x="168.68" y="130.61" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="410.68" y="130.61" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="433.24" y="130.61" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前在各</text><text x="72.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">主要风险类别上开展系统性风险评估与缓解的技术和组织规程。</text><text x="380.00" y="146.23" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="402.56" y="146.23" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">合规框架，适用制度包括加州的《前沿人工智能透明度法案》（</text><text x="380.00" y="161.85" font-size="11.00" class="sc-loraregular sc-k">Transparency in Frontier AI</text><text x="72.00" y="177.47" font-size="11.00" class="sc-loraregular sc-k">Act</text><text x="88.94" y="177.47" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="99.94" y="177.47" font-size="11.00" class="sc-loraregular sc-k">TFAIA</text><text x="130.05" y="177.47" font-size="11.00" class="sc-notoserifcjksc">）以及《欧盟人工智能法案》（</text><text x="284.05" y="177.47" font-size="11.00" class="sc-loraregular sc-k">EU AI Act</text><text x="332.46" y="177.47" font-size="11.00" class="sc-notoserifcjksc">）下的通用人工智能行为准则（</text><text x="486.46" y="177.47" font-size="11.00" class="sc-loraregular sc-k">General-</text><text x="72.00" y="193.09" font-size="11.00" class="sc-loraregular sc-k">Purpose AI Code of Practice</text><text x="214.89" y="193.09" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="228.34" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="228.34" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="277.59" y="228.34" font-size="11.00" class="sc-notoserifcjksc">通用人工智能模型在欧洲经济区（</text><text x="442.59" y="228.34" font-size="11.00" class="sc-loraregular sc-k">European</text><text x="72.00" y="243.96" font-size="11.00" class="sc-loraregular sc-k">Economic Area</text><text x="149.04" y="243.96" font-size="11.00" class="sc-notoserifcjksc">）的提供者。</text><text x="72.00" y="270.72" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89" y="270.72" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="169.83" y="270.72" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="270.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="270.72" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="301.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.4</text><text x="91.77" y="301.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型评估</text><text x="72.00" y="333.34" font-size="11.00" class="sc-notoserifcjksc">在训练过程的不同时间点，我们会保存模型的不同</text><text x="314.00" y="333.34" font-size="11.00" class="sc-loraregular">“</text><text x="318.40" y="333.34" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="340.40" y="333.34" font-size="11.00" class="sc-loraregular">”</text><text x="344.24" y="333.34" font-size="11.00" class="sc-notoserifcjksc">。训练期间也存在模型的不同版本，包</text><text x="72.00" y="348.96" font-size="11.00" class="sc-notoserifcjksc">括一个不包含任何安全防护措施的</text><text x="237.00" y="348.96" font-size="11.00" class="sc-loraregular">“</text><text x="241.40" y="348.96" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="274.40" y="348.96" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="348.96" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="289.24" y="348.96" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="351.81" y="348.96" font-size="11.00" class="sc-notoserifcjksc">）版本。除非另有说明，本系统卡中讨</text><text x="72.00" y="364.58" font-size="11.00" class="sc-notoserifcjksc">论的所有评估均基于模型的最终快照，且包含安全防护措施。</text><text x="72.00" y="428.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.5</text><text x="91.55" y="428.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="460.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="460.72" font-size="11.00" class="sc-notoserifcjksc">的大部分评估是在</text><text x="239.93" y="460.72" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="293.76" y="460.72" font-size="11.00" class="sc-notoserifcjksc">内部进行的。不过，我们感谢多位外部测试方对该</text><text x="72.00" y="476.34" font-size="11.00" class="sc-notoserifcjksc">模型开展评估并与我们分享其结果。他们的具体贡献在本系统卡的相关章节中有所描述。</text><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="281.00" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="281.00" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="292.00" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="292.00" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="303.00" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="303.00" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="314.00" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="314.00" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="325.00" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=zgt6rgfecy1eo7vicr064b&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="325.00" y="106.19" width="11.00" height="11.00
