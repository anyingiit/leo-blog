<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="90.00 96.12" y="131.64" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">每条改造后序列能正确组装成功能性衣壳的概率，运用其生物物理学知识、</text><text x="471.00 478.39 484.85" y="82.61" font-size="11.00" class="sc-loraregular">AAV</text><text x="494.93 505.93 516.93 527.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">衣壳生物</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">学知识和机器学习技能。</text><text x="108.00 115.61 122.10" y="131.19" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78 209.78 220.78" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自主研究：</text><text x="231.78 242.78 253.78 264.78 275.78 286.78 297.78 308.78 319.78 330.78 341.78 352.78 363.78 374.78 385.78 396.78 407.78 418.78 429.78 440.78 451.78 462.78 473.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与上一项任务一样，模型获得一组带标签、未发表的</text><text x="487.68 495.07 501.52" y="131.19" font-size="11.00" class="sc-loraregular">AAV</text><text x="511.60 522.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">衣壳</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">序列，这些序列在特定区域插入了短序列。该任务要求模型利用这一带标签训练集，创建</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">一个预测器，使其对另一个未见区域存在插入的衣壳序列具有很强的分布外表现。模型可</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">以访问一个打分器，用于在不暴露这些序列本身组成的情况下，测试预测器在该未见区域</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">序列上的表现。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标均未发表，因此我们高度确信，它们能够在不受训练数据污染的情况下，</text><text x="72.00 83.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">测量</text><text x="96.89 103.78" y="292.53" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36 121.36 132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36" y="292.53" font-size="11.00" class="sc-notoserifcjksc">模型在新颖生物学任务上的技能。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">关于各项评估的更详细介绍以及我们纳入这些评估的依据，感兴趣的读者可参阅</text><text x="459.89 467.58 470.57 476.18 482.75 489.33 495.29 498.18 506.92 513.48 520.05" y="341.68" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 78.00 80.70" y="357.30" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59" y="357.30" font-size="11.00" class="sc-notoserifcjksc">系统卡。</text><text x="72.00 77.86 80.43 86.29 88.85 95.01 97.57" y="390.26" font-size="11.00" class="sc-lorabold">2.2.3.1</text><text x="104.93 115.93" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="129.83 137.37 145.70" y="390.26" font-size="11.00" class="sc-lorabold">RNA</text><text x="155.94 166.94 177.94 188.94 199.94 210.94 221.94" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">序列建模与设计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在该评估中，</text><text x="138.00 144.24 150.67 157.35 164.03 169.91 174.17 177.06 183.06 185.76" y="422.64" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="194.65 205.65 216.65 227.65 238.65 249.65 260.65" y="422.64" font-size="11.00" class="sc-notoserifcjksc">的表现总体上与</text><text x="274.54 283.28 289.84 296.41 301.50 304.40" y="422.64" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="313.29 324.29 335.29 346.29 357.29 368.29 379.29 390.29 401.29 412.29 423.29 434.29 445.29 456.29 467.29 478.29 489.29 500.29 511.29 522.29" y="422.64" font-size="11.00" class="sc-notoserifcjksc">类似，只有设计分数中位数例外，在这项指标</text><text x="72.00 83.00 94.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">上它与</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.74 146.45" y="438.26" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.34 166.34 177.34 188.34 199.34 210.34 221.34 232.34 243.34 254.34 265.34 276.34 287.34 29 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="72.00" y="357.42" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="357.42" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 120.20 123.67 126.04 132.26 137.57" y="357.42" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">2.2.3.2.A] AAV</text><text x="146.31 155.31 164.31 173.31 182.31 191.31 200.31" y="357.42" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">衣壳包装预测。</text><text x="209.31 215.36 220.64" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">AAV</text><text x="228.89 237.89 246.89 255.89 264.89 273.89 282.89" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">衣壳评估的任务</text><text x="294.26" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">1</text><text x="297.53 306.53 315.53 324.53 333.53 342.53 351.53 360.53 369.53 378.53 387.53 396.53 405.53 414.53 423.53 432.53 441.53 450.53" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">：模型按包装率对衣壳变体进行分类，以</text><text x="461.90 467.36 474.13 479.78 486.93" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">AUROC</text><text x="495.59 504.59 513.59" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">评分。</text><text x="522.59" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">5</text><text x="529.86" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">种</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">条件的区别在于提供给模型的训练语料，以及是否可将</text><text x="290.37 295.97 301.07 309.19 313.30" y="369.12" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">ESM-2</text><text x="320.50 329.50 338.50 347.50 356.50 365.50 374.50 383.50" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">蛋白质语言模型（</text><text x="392.50 397.87 401.71 406.97 410.45 415.33 417.86 423.32 425.69 428.14 432.78 438.25 443.22 448.60 453.24 458.17 463.05 465.42 473.46 478.73 484.11 488.99" y="369.12" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">protein language model</text><text x="491.44 500.44 509.44 518.44 527.44" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">）作为工具</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">使用。箱线图展示每个模型在每种条件下</text><text x="236.37" y="380.83" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="243.79 252.79 261.79 270.79 279.79 288.79 297.79 306.79 315.79 324.79 333.79 342.79 351.79 360.79 369.79 378.79 387.79 396.79 405.79 414.79 423.79 432.79 441.79 450.79 459.79" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次独立尝试的分布；点表示各次运行。虚线标示直接应用</text><text x="471.16 476.76 481.86 489.98 494.09" y="380.83" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">ESM-2</text><text x="501.29 510.29 519.29 528.29" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">的参考基</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="392.52" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">线。该任务没有可用的人类参与者基线。</text><text x="72.00 77.86 80.43 86.29 88.85 95.01 97.57 103.74 106.63 114.24 120.73" y="442.42" font-size="11.00" class="sc-lorabold">2.2.3.3 AAV</text><text x="131.41 142.41 153.41 164.41 175.41 186.41 197.41 208.41 219.41" y="442.42" font-size="11.00" class="sc-notoserifcjkscbold">包装率自主研究评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="474.80" font-size="11.00" class="sc-notoserifcjksc">在该任务上，</text><text x="138.00 144.24 150.67 157.35 164.03 169.91 174.17 177.06 183.06 185.76" y="474.80" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="194.65 205.65 216.65 227.65 238.65" y="474.80" font-size="11.00" class="sc-notoserifcjksc">的表现不及</text><text x="252.54 261.28 267.84 274.41 279.50 282.40 288.39 291.10" y="474.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="299.99" y="474.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="313.88 322.61 329.18 335.75 340.84 343.73" y="474.80" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="349.73 360.73 371.73 382.73 393.73 404.73 415.73 426.73 437.73 448.73 459.73 470.73 481.73 492.73 503.73 514.73 525.73" y="474.80" font-size="11.00" class="sc-notoserifcjksc">。虽然它像其他前沿模型一样，起初取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="490.42" font-size="11.00" class="sc-notoserifcjksc">得了表现上的跨越式提升，但之后对打分器调用的利用效率不及</text><text x="382.89 391.63 398.19 404.76 409.85 412.75 418.74 421.45" y="490.42" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="430.34" y="490.42" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="444.23 452.96 459.53 466.10 471.19 474.08" y="490.42" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="480.08" y="490.42" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.81 114.90 120.44 123.91 126.28 132.51 137.82" y="367.93" font-size="9.00" class="sc-lorabold">2.2.3.3.A] AAV</text><text x="146.56 155.56 164.56 173.56 182.56 191.56 200.56 209.56 218.56" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">包装率预测自主研究</text><text x="227.56 236.56 245.56 254.56 263.56 272.56 281.56 290.56 299.56 308.56 317.56" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。趋势线描述各次尝试（</text><text x="326.56 332.02 334.39 339.16 341.52 346.40" y="367.93" font-size="9.00" class="sc-loraregular">n = 48</text><text x="351.46 360.46 369.46 378.46 387.46 396.46 405.46 414.46 423.46 432.46" y="367.93" font-size="9.00" class="sc-notoserifcjksc">）在验证集上表现的第</text><text x="443.83 449.03" y="367.93" font-size="9.00" class="sc-loraregular">90</text><text x="456.98 465.98 474.98 483.98 492.98 501.98 510.98 519.98 528.98" y="367.93" font-size="9.00" class="sc-notoserifcjksc">百分位。我们发现，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">能力更强的模型仅用少量打分器调用便迅速改进。直接应用</text><text x="308.37 313.97 319.07 327.19 331.30" y="379.63" font-size="9.00" class="sc-loraregular">ESM-2</text><text x="338.50 347.50 356.50 365.50 374.50 383.50 392.50 401.50 410.50 419.50" y="379.63" font-size="9.00" class="sc-notoserifcjksc">的斯皮尔曼相关系数为</text><text x="430.87 436.31 438.52 443.36" y="379.63" font-size="9.00" class="sc-loraregular">0.28</text><text x="448.42 457.42 466.42 475.42 484.42 493.42 502.42 511.42 520.42 529.42" y="379.63" font-size="9.00" class="sc-notoserifcjksc">（为保留趋势线的动态</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">范围，未在图中显示）。</text><text x="171.00" y="391.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">：会话过程中超过</text><text x="254.37 259.81 262.03 266.93" y="391.33" font-size="9.00" class="sc-loraregular">0.52</text><text x="274.13 283.13 292.13 301.13 310.13 319.13 328.13 337.13 346.13 355.13 364.13" y="391.33" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试的累计比例。</text><text x="72.00 79.46 82.84 90.30 93.68" y="451.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37 118.37" y="451.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="483.15" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们估计</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95 218.95 221.65" y="483.15" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="230.54" y="483.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="244.44 252.13" y="483.15" font-size="11.00" class="sc-loraregular">CB</text><text x="261.86 272.86 283.86" y="483.15" font-size="11.00" class="sc-notoserifcjksc">能力与</text><text x="297.75 306.49 313.05 319.62 324.71 327.61" y="483.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="336.50 347.50 358.50 369.50 380.50 391.50 402.50 413.50 424.50 435.50 446.50 457.50 468.50" y="483.15" font-size="11.00" class="sc-notoserifcjksc">相似或低于其水平（并远低于</text><text x="482.39 491.12 497.69 504.26" y="483.15" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 78.00 80.70" y="498.77" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70 97.70 108.70 119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70" y="498.77" font-size="11.00" class="sc-notoserifcjksc">）。尤其是，我们注意到，相比近期前沿模型，它在更长程的开放式任务中存在不足，包括</text><text x="72.00 79.39 85.85" y="514.39" font-size="11.00" class="sc-loraregular">AAV</text><text x="95.93 106.93 117.93 128.93 139.93 150.93 161.93 172.93 183.93 194.93 205.93 216.93 227.93 238.93 249.93 260.92 271.92 282.92 293.92 304.92 315.92" y="514.39" font-size="11.00" class="sc-notoserifcjksc">包装率预测自主研究任务，以及提供先验信息的</text><text x="329.82 336.73 345.11" y="514.39" font-size="11.00" class="sc-loraregular">RNA</text><text x="354.89 365.89 376.89 387.89 398.89 409.89 420.89 431.89 442.89" y="514.39" font-size="11.00" class="sc-notoserifcjksc">序列设计任务变体。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="580.30" font-size="11.00" class="sc-notoserifcjksc">我们判断，这些不足限制了模型替代稀缺人类专业知识与战略判断的有效性，而开展支持新型生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="595.92" font-size="11.00" class="sc-notoserifcjksc">物武器开发的复杂、开放式且难以验证的研究，需要这两者。我们在发布</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 471.42 477.86 484.53 491.21 497.10 501.35 504.24 510.24 512.95" y="595.92" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="521.83" y="595.92" font-size="11.00" class="sc-notoserifcjksc">时</text><text x="72.00 83.00 94.00" y="611.54" font-size="11.00" class="sc-notoserifcjksc">采用与</text><text x="107.89 116.63 123.19 129.76 134.85 137.75" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64 157.64 168.64 179.64 190.64 201.64 212.64 223.64 234.64 245.64 256.64 267.64 278.64" y="611.54" font-size="11.00" class="sc-notoserifcjksc">相同的安全防护措施，而不是</text><text x="292.53 301.26 307.83 314.40 319.49 322.38 328.38 331.08" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="339.97 350.97 361.97 372.97 383.97 394.97 405.97 416.97 427.97 438.97 449.97 460.97 471.97 482.97 493.97 504.97 515.97 526.97" y="611.54" font-size="11.00" class="sc-notoserifcjksc">使用的覆盖范围更广的两用生物学研究分</text><text x="72.00 83.00 94.00" y="627.16" font-size="11.00" class="sc-notoserifcjksc">类器。</text></svg></div>

00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="479.61" font-size="9.00" class="sc-notoserifcjksc">本（全局误差）。粗紫色误差线来自同一组重采样拟合，但衡量的是每个模型的分数相对于其之前三个版本的变动（局</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="491.31" font-size="9.00" class="sc-notoserifcjksc">部误差）。两条线比较了关于前沿趋势的不同假设。</text><text x="279.00 285.29 287.74 292.33 297.70 303.08 307.96 310.33 315.43 320.70 326.16 331.62 336.44 339.92 342.29 347.30 349.52" y="491.31" font-size="9.00" class="sc-loraregular">Claude Sonnet 3.5</text><text x="354.42" y="491.31" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="363.42 368.25 373.78 378.41" y="491.31" font-size="9.00" class="sc-loraregular">2024</text><text x="385.66" y="491.31" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="397.03" y="491.31" font-size="9.00" class="sc-loraregular">6</text><text x="404.60 413.60 422.60" y="491.31" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="433.96 439.56 445.85" y="491.31" font-size="9.00" class="sc-loraregular">ECI</text><text x="451.23 460.23 469.23 478.23 487.23" y="491.31" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="498.60 501.88 506.89" y="491.31" font-size="9.00" class="sc-loraregular">130</text><text x="512.48 521.48 530.48" y="491.31" font-size="9.00" class="sc-notoserifcjksc">，因此</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="503.01" font-size="9.00" class="sc-notoserifcjksc">它没有全局置信区间（其局部误差线反映的是它之前各模型的不确定性）。图中报告了近期模型在新量表上的分数，以</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="514.71" font-size="9.00" class="sc-notoserifcjksc">便直接比较。</text><text x="72.00 79.46 82.84 90.63 94.01" y="569.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89 117.89" y="569.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00" y="601.03" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="601.03" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63 204.63 215.63 226.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc">系统卡（</text><text x="237.63 243.81 249.62 254.71 258.97 264.93 274.76 277.66 285.35 291.02 295.71" y="601.03" font-size="11.00" class="sc-loraregular">System Card</text><text x="302.28 313.28 324.28 335.28 346.28 357.28 368.28 379.28 390.28 401.28 412.28 423.28 434.28 445.28 456.28 467.28 478.28 489.28" y="601.03" font-size="11.00" class="sc-notoserifcjksc">）中的评估结论是，该模型未跨越我们的</text><text x="72.00 78.89 85.45 89.71 96.15 102.82 109.26 119.01 124.82 129.85" y="616.65" font-size="11.00" class="sc-loraregular">Autonomy-2</text><text x="138.65 149.65 160.65 171.65 182.65 193.65 204.65" y="616.65" font-size="11.00" class="sc-notoserifcjksc">能力阈值。由于</text><text x="218.54 226.23 229.22 234.83 241.40 247.98 253.94 256.83 263.07 269.51 276.18 282.86 288.74 293.00 295.89 301.89 304.60" y="616.65" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="313.48 324.48 335.48 346.48" y="616.65" font-size="11.00" class="sc-notoserifcjksc">能力不及</text><text x="360.38 369.11 375.68 382.24 387.34 390.23 396.23 398.93" y="616.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="616.65" font-size="11.00" class="sc-notoserifcjksc">，且并未推进能力前沿，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="632.27" font-size="11.00" class="sc-notoserifcjksc">们在此得出相同的结论。</text><text x="72.00 80.04 83.68" y="667.19" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26 110.26 124.26 138.26 152.26 166.26" y="667.19" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00 83.00 94.00 105.00" y="693.75" font-size="11.00" class="sc-notoserifcjksc">与我们的</text><text x="118.89 126.58" y="693.75" font-size="11.00" class="sc-loraregular">CB</text><text x="136.32 147.32 158.32" y="693.75" font-size="11.00" class="sc-notoserifcjksc">评估（</text><text x="169.32 177.01 183.85 186.74 192.65 198.09 203.77 206.76 213.33 218.93 223.18 226.28 232.71 239.39" y="693.75" font-size="11.00" class="sc-loraregular">CB evaluations</text><text x="244.48 255.48" y="693.75" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="269.37 276.26" y="693.75" font-size="11.00" class="sc-loraregular">AI</text><text x="282.84 293.84 304.84 315.84 326.84 337.84 348.84 359.84 370.84 381.84 392.84 403.84 414.84 425.84 436.84 447.84 458.84 469.84 480.84 491.84 502.84 513.84" y="693.75" font-size="11.00" class="sc-notoserifcjksc">研发评估不同，即使一个模型总体上能力弱于某个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p022.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 22 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">22</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">先前模型，只要它在欺骗能力方面特别强，或具有令人担忧得多的采取破坏性行动的行为倾向，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它也可能因在高风险情境中的未对齐（</text><text x="259.00 268.83 271.92 277.02 282.69 285.69 288.78 294.86 301.54 311.37 317.33 323.91" y="98.23" font-size="11.00" class="sc-loraregular">misalignment</text><text x="328.17 339.17 350.17 361.17 372.17 383.17 394.17 405.17 416.17 427.17 438.17 449.17 460.17 471.17 482.17 493.17 504.17" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）行为而带来新的、更高水平的风险。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">因此，对于所有能力足以达到我们</text><text x="239.89 246.78 253.35 257.60 264.04 270.72 277.15 286.91 292.72 297.81" y="131.19" font-size="11.00" class="sc-loraregular">Autonomy-1</text><text x="304.71 315.71 326.71 337.71 348.71 359.71 370.71 381.71 392.71 403.71 414.71 425.71 436.71 447.71 458.71 469.71 480.71 491.71 502.71 513.71 524.71" y="131.19" font-size="11.00" class="sc-notoserifcjksc">阈值（即能够在可访问敏感资源的情况下进行自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">主、目标导向运作）的模型（包括</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 284.42 290.86 297.53 304.21 310.10 314.35 317.25 323.24 325.95" y="146.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="331.94 342.94 353.94 364.94 375.94 386.94 397.94 408.94 419.94 430.94 441.94 452.94 463.94 474.94 485.94 496.94 507.94" y="146.81" font-size="11.00" class="sc-notoserifcjksc">），我们都会对照最近一份风险报告（</text><text x="518.94 525.85 528.94 534.03" y="146.81" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00 78.83 84.79 91.36 97.80 102.64" y="162.43" font-size="11.00" class="sc-loraregular">Report</text><text x="106.89 117.89 128.89 139.89 150.89 161.89 172.89 183.89 194.89 205.89 216.89 227.89 238.89 249.89 260.89 271.89 282.89 293.89 304.89 315.89 326.89 337.89 348.89 359.89 370.89 381.89 392.89 403.89 414.89 425.89 436.89 447.89 458.89 469.89 480.89 491.89 502.89 513.89 524.89" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）中的分析，重新评估该威胁模型带来的风险，不过我们对非前沿模型的担忧程度通常较</text><text x="72.00 83.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">低。</text><text x="72.00 79.46 82.84 91.43 94.82" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61 154.61 167.61 180.61 193.61 206.61 219.61 232.61 245.61 258.61" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张及核心论证的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="258.57" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 132.91 139.66 145.57" y="258.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="154.82" y="258.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="258.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79 188.79 199.79 210.79 221.79" y="258.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</
