.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1</text><text x="92.08" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在本节中，我们介绍针对与我们</text><text x="226.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="303.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.00" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Responsible Scaling Policy</text><text x="448.16" y="154.36" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="459.16" y="154.36" font-size="11.00" class="sc-loraregular">RSP</text><text x="478.97" y="154.36" font-size="11.00" class="sc-notoserifcjksc">）相关的灾</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">难性风险对</text><text x="129.89" y="169.98" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="186.54" y="169.98" font-size="11.00" class="sc-notoserifcjksc">所作的评估。本节中的评估以及第</text><text x="354.44" y="169.98" font-size="11.00" class="sc-loraregular">8</text><text x="363.51" y="169.98" font-size="11.00" class="sc-notoserifcjksc">节所示的广泛能力评估均表明，</text><text x="72.00" y="185.60" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="185.60" font-size="11.00" class="sc-notoserifcjksc">并不处于能力前沿，并且在我们报告的大多数评估中能力不及</text><text x="428.54" y="185.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="511.38" y="185.60" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="235.32" font-size="11.00" class="sc-notoserifcjksc">因此，我们关于</text><text x="151.89" y="235.32" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="199.34" y="235.32" font-size="11.00" class="sc-notoserifcjksc">未跨越</text><text x="235.23" y="235.32" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="263.59" y="235.32" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="277.48" y="235.32" font-size="11.00" class="sc-loraregular sc-k">Autonomy-2 RSP</text><text x="366.83" y="235.32" font-size="11.00" class="sc-notoserifcjksc">阈值的判定同样适用于</text><text x="479.73" y="235.32" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="250.94" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="250.94" font-size="11.00" class="sc-notoserifcjksc">。我们确实将</text><text x="155.59" y="250.94" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="212.24" y="250.94" font-size="11.00" class="sc-notoserifcjksc">视为达到我们的</text><text x="292.13" y="250.94" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="318.65" y="250.94" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="332.55" y="250.94" font-size="11.00" class="sc-loraregular sc-k">Autonomy-1</text><text x="397.36" y="250.94" font-size="11.00" class="sc-notoserifcjksc">阈值，并采用</text><text x="466.25" y="250.94" font-size="11.00" class="sc-loraregular">RSP</text><text x="488.96" y="250.94" font-size="11.00" class="sc-notoserifcjksc">中相应的</text><text x="72.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc">缓解措施。</text><text x="72.00" y="300.09" font-size="11.00" class="sc-notoserifcjksc">下面我们对这些风险进行相对精简的评估，重点关注自动化评估的结果。</text><text x="72.00" y="350.06" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13" y="350.06" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="387.16" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48" y="387.16" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="72.00" y="419.05" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="419.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="191.83" y="419.05" font-size="11.00" class="sc-notoserifcjksc">没有推进能力前沿，而且我们高度确信，其风险相关能力不超过</text><text x="502.73" y="419.05" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="434.67" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="434.67" font-size="11.00" class="sc-notoserifcjksc">，因此本系统卡仅呈现自动化评估结果；这些评估均在发布候选快照上运行。</text><text x="225.18" y="351.15" font-size="6.95" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本节（2.2 节）译文由项目发起人另行翻译提供，经脚本格式检查后排入，未经 Claude 审校。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="226.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="226.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="237.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="237.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="248.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="248.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="259.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="259.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="270.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="270.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="281.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="281.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="292.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="292.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">相关性</text><text x="76.75" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold">已知生物武</text><text x="76.75" y="131.67" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="76.75" y="240.65" font-size="11.00" class="sc-notoserifcjkscbold">新型生物武</text><text x="76.75" y="256.27" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="147.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">评估</text><text x="147.25" y="116.05" font-size="11.00" class="sc-notoserifcjksc">自动化短程和中程评估：多模</text><text x="147.25" y="131.67" font-size="11.00" class="sc-notoserifcjksc">态病毒学（</text><text x="202.25" y="131.67" font-size="11.00" class="sc-loraregular sc-k">VCT</text><text x="224.00" y="131.67" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="147.25" y="147.29" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="236.83" y="147.29" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="247.83" y="147.29" font-size="11.00" class="sc-loraregular sc-k">Protocols</text><text x="147.25" y="240.65" font-size="11.00" class="sc-notoserifcjksc">序列到功能建模与设计</text><text x="147.25" y="256.27" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="158.25" y="256.27" font-size="11.00" class="sc-loraregular">RNA</text><text x="180.43" y="256.27" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="147.25" y="300.47" font-size="11.00" class="sc-notoserifcjksc">病毒序列到功能评估（</text><text x="257.25" y="300.47" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="281.17" y="300.47" font-size="11.00" class="sc-notoserifcjksc">判</text><text x="147.25" y="316.09" font-size="11.00" class="sc-notoserifcjksc">别）</text><text x="147.25" y="360.30" font-size="11.00" class="sc-notoserifcjksc">病毒序列到功能自主研究</text><text x="305.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">说明</text><text x="305.50" y="116.05" font-size="11.00" class="sc-notoserifcjksc">模型在包含图像的病毒学问题上表现如何？模型</text><text x="305.50" y="131.67" font-size="11.00" class="sc-notoserifcjksc">能在多大程度上帮助威胁行为者排查并扩展其湿</text><text x="305.50" y="147.29" font-size="11.00" class="sc-notoserifcjksc">实验方案（</text><text x="360.50" y="147.29" font-size="11.00" class="sc-loraregular sc-k">wet-lab protocol</text><text x="446.27" y="147.29" font-size="11.00" class="sc-notoserifcjksc">）？模型能否分析</text><text x="305.50" y="162.91" font-size="11.00" class="sc-notoserifcjksc">原始实验室数据，并得出威胁行为者可能需要的</text><text x="305.50" y="178.53" font-size="11.00" class="sc-notoserifcjksc">生物学结论？</text><text x="305.50" y="240.65" font-size="11.00" class="sc-notoserifcjksc">在经过校准的生物序列建模与设计任务上，模型</text><text x="305.50" y="256.27" font-size="11.00" class="sc-notoserifcjksc">能否达到人类专家的表现水平？</text><text x="305.50" y="300.47" font-size="11.00" class="sc-notoserifcjksc">与公开工具相比，模型能否预测新型病毒衣壳序</text><text x="305.50" y="316.09" font-size="11.00" class="sc-notoserifcjksc">列的功能特性？</text><text x="305.50" y="360.30" font-size="11.00" class="sc-notoserifcjksc">模型能否在分布外（</text><text x="404.50" y="360.30" font-size="11.00" class="sc-loraregular sc-k">out-of-distribution</text><text x="502.81" y="360.30" font-size="11.00" class="sc-notoserifcjksc">）数据</text><text x="305.50" y="375.92" font-size="11.00" class="sc-notoserifcjksc">集上迭代改进针对新型病毒衣壳序列的预测模</text><text x="305.50" y="391.54" font-size="11.00" class="sc-notoserifcjksc">型？</text><text x="72.00" y="410.30" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="410.30" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.53 100.63 104.28 106.38 111.92 115.39 117.76 123.95" y="410.30" font-size="9.00" class="sc-lorabold">2.2.1.A] CB</text><text x="132.26" y="410.30" font-size="9.00" class="sc-notoserifcjkscbold">评估组合</text><text x="168.26" y="410.30" font-size="9.00" class="sc-notoserifcjksc">及其与</text><text x="197.63" y="410.30" font-size="9.00" class="sc-loraregular sc-k">CB-1</text><text x="219.33" y="410.30" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="230.70" y="410.30" font-size="9.00" class="sc-loraregular sc-k">CB-2</text><text x="253.90" y="410.30" font-size="9.00" class="sc-notoserifcjksc">阈值的相关性。</text><text x="72.00" y="442.66" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.2 CB-1</text><text x="137.96" y="442.66" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化评估结果</text><text x="72.00" y="474.55" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="474.55" font-size="11.00" class="sc-loraregular">3</text><text x="127.91" y="474.55" font-size="11.00" class="sc-notoserifcjksc">项自动化评估，考察</text><text x="229.81" y="474.55" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="324.75" y="474.55" font-size="11.00" class="sc-notoserifcjksc">在与</text><text x="349.64" y="474.55" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="376.16" y="474.55" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的任务上的表现：</text><text x="108.00" y="523.12" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">VCT</text><text x="130.22" y="523.12" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="141.22" y="523.12" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">由</text><text x="155.11" y="523.12" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">SecureBio</text><text x="209.32" y="523.12" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="223.21" y="523.12" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CAIS</text><text x="250.49" y="523.12" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">提供的病毒学专项</text><text x="338.49" y="523.12" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">多模态多项选择评估</text><text x="437.49" y="523.12" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">；</text><text x="108.00" y="560.51" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">BioMysteryBench</text><text x="200.74" y="560.51" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="211.74" y="560.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一项能力评估，考察模型</text><text x="332.74" y="560.51" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">利用生物学推理分析实验室生成数据</text><text x="508.74" y="560.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的能</text><text x="108.00" y="576.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">力，从而衡量其对</text><text x="198.89" y="576.13" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CB-1</text><text x="225.41" y="576.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">行为者的潜在能力提升（</text><text x="346.41" y="576.13" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">uplift</text><text x="373.74" y="576.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）；以及</text><text x="108.00" y="609.08" font-size="11.00" class="sc-lorabold sc-k" fill="#1d1c1d">Protocols</text><text x="157.86" y="609.08" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="168.86" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一项生命科学专项评估，考察模型</text><text x="333.86" y="609.08" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">协助排查和理解实验台操作方案</text><text x="487.86" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的能力，</text><text x="108.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">这类方案可能是</text><text x="187.89" y="624.70" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">CB-1</text><text x="214.41" y="624.70" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">威胁行为者会尝试执行的。</text><text x="72.00" y="678.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="678.85" font-size="11.00" class="sc-loraregular sc-k">VCT</text><text x="110.53" y="678.85" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="132.53" y="678.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="189.18" y="678.85" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="225.08" y="678.85" font-size="11.00" class="sc-loraregular sc-k">0.58</text><text x="246.61" y="678.85" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="271.51" y="678.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="357.24" y="678.85" font-size="11.00" class="sc-notoserifcjksc">持平，与若干先前模型相当，并明显</text><text x="72.00" y="694.47" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="96.89" y="694.47" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="141.95" y="694.47" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="166.84" y="694.47" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="259.32" y="694.47" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="281.32" y="694.47" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="337.97" y="694.47" font-size="11.00" class="sc-notoserifcjksc">在人类可解决问题上的得分为</text><text x="483.86" y="694.47" font-size="11.00" class="sc-loraregular sc-k">0.89</text><text x="505.69" y="694.47" font-size="11.00" class="sc-notoserifcjksc">，在人</text><text x="72.00" y="710.09" font-size="11.00" class="sc-notoserifcjksc">类难以解决问题上的得分为</text><text x="206.89" y="710.09" font-size="11.00" class="sc-loraregular sc-k">0.45</text><text x="228.21" y="710.09" font-size="11.00" class="sc-notoserifcjksc">，与</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="90.00" y="524.20" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="637.55" font-size="11.00" class="sc-loraregular">2.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.34" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="172.08" y="82.61" font-size="11.00" class="sc-notoserifcjksc">持平，但在人类难以解决的问题上高于</text><text x="361.97" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="407.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="431.92" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Protocols</text><text x="483.61" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="505.61" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在两个子集上均得分</text><text x="191.48" y="98.23" font-size="11.00" class="sc-loraregular sc-k">0.67</text><text x="212.09" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，综合来看，其能力接近</text><text x="335.98" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="383.42" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="397.31" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="433.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，同时优于</text><text x="491.06" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。有关</text><text x="113.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="206.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="220.26" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Protocols</text><text x="271.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">评估的图表及更多详情，请参阅第</text><text x="439.84" y="113.85" font-size="11.00" class="sc-loraregular">8.17</text><text x="460.70" y="113.85" font-size="11.00" class="sc-notoserifcjksc">节（生命科学能</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">力）。</text><text x="72.00" y="386.44" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.44" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.43 107.52 113.06" y="386.44" font-size="9.00" class="sc-lorabold">2.2.2.A]</text><text x="118.90" y="386.44" font-size="9.00" class="sc-notoserifcjkscbold">多模态病毒学。</text><text x="181.90" y="386.44" font-size="9.00" class="sc-notoserifcjksc">在包含</text><text x="211.27" y="386.44" font-size="9.00" class="sc-loraregular">350</text><text x="229.14" y="386.44" font-size="9.00" class="sc-notoserifcjksc">道题的多模态病毒学故障排查题集上的准确率。误差线为按题目计算的</text><text x="510.51" y="386.44" font-size="9.00" class="sc-loraregular">95%</text><text x="530.81" y="386.44" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="398.14" font-size="9.00" class="sc-notoserifcjksc">信区间（</text><text x="188.57" y="398.14" font-size="9.00" class="sc-notoserifcjksc">）（</text><text x="206.57" y="398.14" font-size="9.00" class="sc-loraregular">t</text><text x="212.42" y="398.14" font-size="9.00" class="sc-notoserifcjksc">区间）。人类专家基线（</text><text x="311.42" y="398.14" font-size="9.00" class="sc-loraregular sc-k">0.221</text><text x="332.02" y="398.14" font-size="9.00" class="sc-notoserifcjksc">）以虚线表示。</text><text x="72.00" y="443.29" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.3 CB-2</text><text x="141.04" y="443.29" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化评估结果</text><text x="72.00" y="475.17" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89" y="475.17" font-size="11.00" class="sc-loraregular sc-k">Dyno Therapeutics</text><text x="208.14" y="475.17" font-size="11.00" class="sc-notoserifcjksc">合作开展了</text><text x="266.03" y="475.17" font-size="11.00" class="sc-loraregular">3</text><text x="275.05" y="475.17" font-size="11.00" class="sc-notoserifcjksc">项序列到功能建模与设计能力评估：</text><text x="108.00" y="523.75" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="132.89" y="523.75" font-size="11.00" class="sc-lorabold sc-k">RNA</text><text x="159.01" y="523.75" font-size="11.00" class="sc-notoserifcjkscbold">序列设计：</text><text x="214.01" y="523.75" font-size="11.00" class="sc-notoserifcjksc">这是一项中程挑战，自</text><text x="326.90" y="523.75" font-size="11.00" class="sc-loraregular">2018</text><text x="352.72" y="523.75" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="396.72" y="523.75" font-size="11.00" class="sc-loraregular">Dyno</text><text x="426.73" y="523.75" font-size="11.00" class="sc-notoserifcjksc">已用它评估了来自美国</text><text x="330.89" y="539.37" font-size="11.00" class="sc-loraregular">57</text><text x="344.85" y="539.37" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。任务提供一组</text><text x="490.74" y="539.37" font-size="11.00" class="sc-loraregular">RNA</text><text x="515.81" y="539.37" font-size="11.00" class="sc-notoserifcjksc">序列</text><text x="108.00" y="554.99" font-size="11.00" class="sc-notoserifcjksc">数据，其中每条序列都有一个数值分数，反映对该序列的某种（未知）实验测量结果，并</text><text x="108.00" y="570.61" font-size="11.00" class="sc-notoserifcjksc">要求参与者（</text><text x="174.00" y="570.61" font-size="11.00" class="sc-loraregular">1</text><text x="178.00" y="570.61" font-size="11.00" class="sc-notoserifcjksc">）预测无标签序列测试集的分数，然后（</text><text x="376.00" y="570.61" font-size="11.00" class="sc-loraregular">2</text><text x="381.91" y="570.61" font-size="11.00" class="sc-notoserifcjksc">）设计新序列，争取获得高分。</text><text x="108.00" y="637.09" font-size="11.00" class="sc-lorabold sc-k">AAV</text><text x="132.78" y="637.09" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78" y="637.09" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78" y="637.09" font-size="11.00" class="sc-loraregular sc-k">adeno-associated virus</text><text x="394.03" y="637.09" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03" y="637.09" font-size="11.00" class="sc-loraregular sc-k">AAVs</text><text x="430.84" y="637.09" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病病毒，</text><text x="108.00" y="652.71" font-size="11.00" class="sc-notoserifcjksc">常在基因疗法中用作递送机制，通过病毒衣壳（病毒的外层蛋白质外壳）递送</text><text x="484.89" y="652.71" font-size="11.00" class="sc-loraregular sc-k">DNA</text><text x="511.14" y="652.71" font-size="11.00" class="sc-notoserifcjksc">载</text><text x="108.00" y="668.33" font-size="11.00" class="sc-notoserifcjksc">荷。在这项任务中，模型获得</text><text x="253.89 257.90 260.50 267.34 274.17" y="668.33" font-size="11.00" class="sc-loraregular">1,000</text><text x="283.90" y="668.33" font-size="11.00" class="sc-notoserifcjksc">条未发表的</text><text x="341.79" y="668.33" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="365.72" y="668.33" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，其中包含</text><text x="467.61" y="668.33" font-size="11.00" class="sc-loraregular">Dyno</text><text x="497.62" y="668.33" font-size="11.00" class="sc-notoserifcjksc">筛选的短</text><text x="108.00" y="683.95" font-size="11.00" class="sc-notoserifcjksc">插入序列改造。随后，模型被要求给出</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="90.00" y="131.64" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">每条改造后序列能正确组装成功能性衣壳的概率，运用其生物物理学知识、</text><text x="471.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="494.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">衣壳生物</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">学知识和机器学习技能。</text><text x="108.00" y="131.19" font-size="11.00" class="sc-lorabold sc-k">AAV</text><text x="132.78" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自主研究：</text><text x="231.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与上一项任务一样，模型获得一组带标签、未发表的</text><text x="487.68" y="131.19" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="511.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">衣壳</text><text x="108.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">序列，这些序列在特定区域插入了短序列。该任务要求模型利用这一带标签训练集，创建</text><text x="108.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">一个预测器，使其对另一个未见区域存在插入的衣壳序列具有很强的分布外表现。模型可</text><text x="108.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">以访问一个打分器，用于在不暴露这些序列本身组成的情况下，测试预测器在该未见区域</text><text x="108.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">序列上的表现。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标均未发表，因此我们高度确信，它们能够在不受训练数据污染的情况下，</text><text x="72.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">测量</text><text x="96.89" y="292.53" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="292.53" font-size="11.00" class="sc-notoserifcjksc">模型在新颖生物学任务上的技能。</text><text x="72.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">关于各项评估的更详细介绍以及我们纳入这些评估的依据，感兴趣的读者可参阅</text><text x="459.89" y="341.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="357.30" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="357.30" font-size="11.00" class="sc-notoserifcjksc">系统卡。</text><text x="72.00" y="390.26" font-size="11.00" class="sc-lorabold">2.2.3.1</text><text x="104.93" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="129.83" y="390.26" font-size="11.00" class="sc-lorabold sc-k">RNA</text><text x="155.94" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">序列建模与设计</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在该评估中，</text><text x="138.00" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="194.65" y="422.64" font-size="11.00" class="sc-notoserifcjksc">的表现总体上与</text><text x="274.54" y="422.64" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="313.29" y="422.64" font-size="11.00" class="sc-notoserifcjksc">类似，只有设计分数中位数例外，在这项指标</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">上它与</text><text x="107.89" y="438.26" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.34" y="438.26" font-size="11.00" class="sc-notoserifcjksc">相当。基于先前尝试进行迭代时，它对全部序列的预测表现明显降至</text><text x="488.23" y="438.26" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="453.88" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="453.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="101.49" y="453.88" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="148.93" y="453.88" font-size="11.00" class="sc-notoserifcjksc">之下，更接近</text><text x="217.83" y="453.88" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="253.68" y="453.88" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00" y="592.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 111.42 113.52 119.05" y="592.92" font-size="9.00" class="sc-lorabold">2.2.3.1.A]</text><text x="124.89" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">黑盒</text><text x="145.26" y="592.92" font-size="9.00" class="sc-lorabold sc-k">RNA</text><text x="166.63" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">序列设计。</text><text x="211.63" y="592.92" font-size="9.00" class="sc-loraregular">RNA</text><text x="232.14" y="592.92" font-size="9.00" class="sc-notoserifcjksc">序列设计任务的结果；每个模型尝试</text><text x="378.50" y="592.92" font-size="9.00" class="sc-loraregular">8</text><text x="385.93" y="592.92" font-size="9.00" class="sc-notoserifcjksc">次。每个点表示一次尝试；水平线表示</text><text x="72.00" y="604.62" font-size="9.00" class="sc-notoserifcjksc">平均值。图中的阴影带标示人类表现的各百分位。</text><text x="270.00" y="604.62" font-size="9.00" class="sc-notoserifcjkscbold">上：</text><text x="288.00" y="604.62" font-size="9.00" class="sc-notoserifcjksc">设计分数（最佳）与设计分数（中位数）分别对最佳设计序列和</text><text x="72.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">典型设计序列评分。</text><text x="153.00" y="616.33" font-size="9.00" class="sc-notoserifcjkscbold">中：</text><text x="171.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">预测分数（全部）和预测分数（最佳）分别为全部序列和最佳序列中，模型预测活性与实测活</text><text x="72.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">性之间的秩相关。</text><text x="144.00" y="628.03" font-size="9.00" class="sc-notoserifcjkscbold">下：</text><text x="162.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">预测分数与设计分数的相互关系图。每个十字线以平均值为中心，覆盖完整数据范围。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="72.00" y="592.92" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84" y="592.92" font-size="9.00" class="sc-lorabold sc-k" fill="#1d1d1f">2.2.3.1.B]</text><text x="124.89" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">黑盒</text><text x="145.26" y="592.92" font-size="9.00" class="sc-lorabold sc-k" fill="#1d1d1f">RNA</text><text x="166.63" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">序列设计：提供先前报告。</text><text x="274.63" y="592.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">任务和指标与上一图相同。每个模型显示两次：未提供先前报告</text><text x="72.00" y="604.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">（圆点），以及在上下文中提供先前报告（三角形，</text><text x="279.00" y="604.62" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">“+</text><text x="289.74" y="604.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">先验信息</text><text x="325.74" y="604.62" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">”</text><text x="328.88" y="604.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">）。每个模型尝试</text><text x="403.24" y="604.62" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="410.67" y="604.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次；水平线表示各次尝试的平均</text><text x="72.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">值。此处省略人类基线；</text><text x="171.00" y="616.33" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">“</text><text x="174.60" y="616.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">有先验信息</text><text x="219.60" y="616.33" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">”</text><text x="222.74" y="616.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">条件无法与人类参与者直接比较。</text><text x="72.00" y="664.67" font-size="11.00" class="sc-lorabold sc-k">2.2.3.2 AAV</text><text x="131.11" y="664.67" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测</text><text x="72.00" y="697.05" font-size="11.00" class="sc-notoserifcjksc">在该任务上，</text><text x="138.00" y="697.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="232.94" y="697.05" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="246.83" y="697.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="323.87" y="697.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="337.76" y="697.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="423.49" y="697.05" font-size="11.00" class="sc-notoserifcjksc">持平，并在所有方面优</text><text x="72.00" y="712.67" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="712.67" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="169.24" y="712.67" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="72.00" y="357.42" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="357.42" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 120.20 123.67 126.04 132.26 137.57" y="357.42" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">2.2.3.2.A] AAV</text><text x="146.31" y="357.42" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">衣壳包装预测。</text><text x="209.31" y="357.42" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">AAV</text><text x="228.89" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">衣壳评估的任务</text><text x="294.26" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">1</text><text x="297.53" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">：模型按包装率对衣壳变体进行分类，以</text><text x="461.90" y="357.42" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">AUROC</text><text x="495.59" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">评分。</text><text x="522.59" y="357.42" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">5</text><text x="529.86" y="357.42" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">种</text><text x="72.00" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">条件的区别在于提供给模型的训练语料，以及是否可将</text><text x="290.37" y="369.12" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">ESM-2</text><text x="320.50" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">蛋白质语言模型（</text><text x="392.50" y="369.12" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">protein language model</text><text x="491.44" y="369.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">）作为工具</text><text x="72.00" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">使用。箱线图展示每个模型在每种条件下</text><text x="236.37" y="380.83" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="243.79" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次独立尝试的分布；点表示各次运行。虚线标示直接应用</text><text x="471.16" y="380.83" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1d1f">ESM-2</text><text x="501.29" y="380.83" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">的参考基</text><text x="72.00" y="392.52" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">线。该任务没有可用的人类参与者基线。</text><text x="72.00" y="442.42" font-size="11.00" class="sc-lorabold sc-k">2.2.3.3 AAV</text><text x="131.41" y="442.42" font-size="11.00" class="sc-notoserifcjkscbold">包装率自主研究评估</text><text x="72.00" y="474.80" font-size="11.00" class="sc-notoserifcjksc">在该任务上，</text><text x="138.00" y="474.80" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="194.65" y="474.80" font-size="11.00" class="sc-notoserifcjksc">的表现不及</text><text x="252.54" y="474.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="299.99" y="474.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="313.88" y="474.80" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="349.73" y="474.80" font-size="11.00" class="sc-notoserifcjksc">。虽然它像其他前沿模型一样，起初取</text><text x="72.00" y="490.42" font-size="11.00" class="sc-notoserifcjksc">得了表现上的跨越式提升，但之后对打分器调用的利用效率不及</text><text x="382.89" y="490.42" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="430.34" y="490.42" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="444.23" y="490.42" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="480.08" y="490.42" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.81 114.90 120.44 123.91 126.28 132.51 137.82" y="367.93" font-size="9.00" class="sc-lorabold">2.2.3.3.A] AAV</text><text x="146.56" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">包装率预测自主研究</text><text x="227.56" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。趋势线描述各次尝试（</text><text x="326.56" y="367.93" font-size="9.00" class="sc-loraregular">n = 48</text><text x="351.46" y="367.93" font-size="9.00" class="sc-notoserifcjksc">）在验证集上表现的第</text><text x="443.83" y="367.93" font-size="9.00" class="sc-loraregular">90</text><text x="456.98" y="367.93" font-size="9.00" class="sc-notoserifcjksc">百分位。我们发现，</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">能力更强的模型仅用少量打分器调用便迅速改进。直接应用</text><text x="308.37" y="379.63" font-size="9.00" class="sc-loraregular sc-k">ESM-2</text><text x="338.50" y="379.63" font-size="9.00" class="sc-notoserifcjksc">的斯皮尔曼相关系数为</text><text x="430.87" y="379.63" font-size="9.00" class="sc-loraregular sc-k">0.28</text><text x="448.42" y="379.63" font-size="9.00" class="sc-notoserifcjksc">（为保留趋势线的动态</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">范围，未在图中显示）。</text><text x="171.00" y="391.33" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="180.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">：会话过程中超过</text><text x="254.37" y="391.33" font-size="9.00" class="sc-loraregular sc-k">0.52</text><text x="274.13" y="391.33" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试的累计比例。</text><text x="72.00" y="451.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37" y="451.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="483.15" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们估计</text><text x="173.89" y="483.15" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="230.54" y="483.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="244.44" y="483.15" font-size="11.00" class="sc-loraregular">CB</text><text x="261.86" y="483.15" font-size="11.00" class="sc-notoserifcjksc">能力与</text><text x="297.75" y="483.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="336.50" y="483.15" font-size="11.00" class="sc-notoserifcjksc">相似或低于其水平（并远低于</text><text x="482.39" y="483.15" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="498.77" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="498.77" font-size="11.00" class="sc-notoserifcjksc">）。尤其是，我们注意到，相比近期前沿模型，它在更长程的开放式任务中存在不足，包括</text><text x="72.00" y="514.39" font-size="11.00" class="sc-loraregular sc-k">AAV</text><text x="95.93" y="514.39" font-size="11.00" class="sc-notoserifcjksc">包装率预测自主研究任务，以及提供先验信息的</text><text x="329.82" y="514.39" font-size="11.00" class="sc-loraregular">RNA</text><text x="354.89" y="514.39" font-size="11.00" class="sc-notoserifcjksc">序列设计任务变体。</text><text x="72.00" y="580.30" font-size="11.00" class="sc-notoserifcjksc">我们判断，这些不足限制了模型替代稀缺人类专业知识与战略判断的有效性，而开展支持新型生</text><text x="72.00" y="595.92" font-size="11.00" class="sc-notoserifcjksc">物武器开发的复杂、开放式且难以验证的研究，需要这两者。我们在发布</text><text x="426.89" y="595.92" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="521.83" y="595.92" font-size="11.00" class="sc-notoserifcjksc">时</text><text x="72.00" y="611.54" font-size="11.00" class="sc-notoserifcjksc">采用与</text><text x="107.89" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="146.64" y="611.54" font-size="11.00" class="sc-notoserifcjksc">相同的安全防护措施，而不是</text><text x="292.53" y="611.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="339.97" y="611.54" font-size="11.00" class="sc-notoserifcjksc">使用的覆盖范围更广的两用生物学研究分</text><text x="72.00" y="627.16" font-size="11.00" class="sc-notoserifcjksc">类器。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p020.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 20 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">20</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">研发</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00" y="153.18" font-size="11.00" class="sc-notoserifcjksc">我们的自主性评估源于</text><text x="184.89" y="153.18" font-size="11.00" class="sc-loraregular">RSP</text><text x="207.60" y="153.18" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00" y="185.57" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="185.57" font-size="11.00" class="sc-lorabold">1</text><text x="192.36" y="185.57" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="316.25" y="185.57" font-size="11.00" class="sc-lorabold">AI</text><text x="330.75" y="185.57" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="363.75" y="185.57" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="509.64" y="185.57" font-size="11.00" class="sc-loraregular">AI</text><text x="523.11" y="185.57" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="108.00" y="201.19" font-size="11.00" class="sc-notoserifcjksc">统：它们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作及</text><text x="108.00" y="216.81" font-size="11.00" class="sc-notoserifcjksc">使用隐蔽手段的能力，以至于这些系统有可能（若被有意或无意地引向这一目标）实施蓄</text><text x="108.00" y="232.43" font-size="11.00" class="sc-notoserifcjksc">意破坏，从而不可逆转地、大幅提高日后发生全球性灾难的几率。</text><text x="108.00" y="282.72" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="282.72" font-size="11.00" class="sc-lorabold">2</text><text x="193.76" y="282.72" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域自动化研发带来的风险。</text><text x="369.76" y="282.72" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是能够完全自动</text><text x="108.00" y="298.34" font-size="11.00" class="sc-notoserifcjksc">化、或以其他方式大幅加速大型顶尖人类研究团队工作的</text><text x="385.89" y="298.34" font-size="11.00" class="sc-loraregular">AI</text><text x="399.36" y="298.34" font-size="11.00" class="sc-notoserifcjksc">系统，所涉领域中的快速进</text><text x="108.00" y="313.96" font-size="11.00" class="sc-notoserifcjksc">展可能对国际安全构成威胁和</text><text x="251.00" y="313.96" font-size="11.00" class="sc-loraregular">/</text><text x="108.00" y="329.58" font-size="11.00" class="sc-notoserifcjksc">源、机器人、武器研发以及</text><text x="242.89" y="329.58" font-size="11.00" class="sc-loraregular">AI</text><text x="256.36" y="329.58" font-size="11.00" class="sc-notoserifcjksc">本身。</text><text x="72.00" y="396.07" font-size="11.00" class="sc-lorabold">2.3.1.1 Claude Sonnet 5.5</text><text x="200.00" y="396.07" font-size="11.00" class="sc-notoserifcjkscbold">如何影响或改变我们最近一份风险</text><text x="72.00" y="412.26" font-size="11.00" class="sc-notoserifcjkscbold">报告中的分析</text><text x="72.00" y="444.64" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00" y="477.03" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="477.03" font-size="11.00" class="sc-lorabold">1</text><text x="195.25" y="477.03" font-size="11.00" class="sc-notoserifcjkscbold">适用于</text><text x="231.14" y="477.03" font-size="11.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="324.71" y="477.03" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们许多先前的</text><text x="481.60" y="477.03" font-size="11.00" class="sc-loraregular">AI</text><text x="495.07" y="477.03" font-size="11.00" class="sc-notoserifcjksc">模型一</text><text x="108.00" y="492.65" font-size="11.00" class="sc-notoserifcjksc">样。我们将在第</text><text x="187.89" y="492.65" font-size="11.00" class="sc-loraregular">2.4</text><text x="205.36" y="492.65" font-size="11.00" class="sc-notoserifcjksc">节中讨论，为何我们认为该威胁模型下的风险水平仍维持在我们</text><text x="513.36" y="492.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="108.00" y="508.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="121.89" y="508.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="130.97" y="508.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="185.97" y="508.27" font-size="11.00" class="sc-notoserifcjksc">所评定的</text><text x="229.97" y="508.27" font-size="11.00" class="sc-loraregular">“</text><text x="234.37" y="508.27" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="245.37" y="508.27" font-size="11.00" class="sc-loraregular">”</text><text x="249.21" y="508.27" font-size="11.00" class="sc-notoserifcjksc">水平。</text><text x="108.00" y="525.60" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="525.60" font-size="11.00" class="sc-lorabold">2</text><text x="196.65" y="525.60" font-size="11.00" class="sc-notoserifcjkscbold">不适用于</text><text x="243.54" y="525.60" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="298.18" y="525.60" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="309.18" y="525.60" font-size="11.00" class="sc-notoserifcjksc">我们发现，在与</text><text x="389.07" y="525.60" font-size="11.00" class="sc-loraregular">AI</text><text x="402.54" y="525.60" font-size="11.00" class="sc-notoserifcjksc">研发相关的多种任务上，</text><text x="108.00" y="541.22" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="164.65" y="541.22" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="178.54" y="541.22" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="225.99" y="541.22" font-size="11.00" class="sc-notoserifcjksc">大体相当或能力较弱，因此我们关于</text><text x="404.88" y="541.22" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="452.32" y="541.22" font-size="11.00" class="sc-notoserifcjksc">未达到该能力阈值</text><text x="108.00" y="556.84" font-size="11.00" class="sc-notoserifcjksc">的结论（详见</text><text x="176.89" y="556.84" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="262.63" y="556.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="295.63" y="556.84" font-size="11.00" class="sc-notoserifcjksc">）同样适用于</text><text x="364.52" y="556.84" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="418.28" y="556.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="606.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2 AECI</text><text x="137.48" y="606.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="632.79" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="632.79" font-size="11.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="190.94" y="632.79" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="632.79" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="632.79" font-size="11.00" class="sc-notoserifcjksc">）追踪我们模型的能力随时间提升的速度；</text><text x="436.04" y="632.79" font-size="11.00" class="sc-loraregular">AECI</text><text x="464.04" y="632.79" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="477.93" y="632.79" font-size="11.00" class="sc-loraregular sc-k">Epoch AI</text><text x="526.50" y="632.79" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="648.41" font-size="11.00" class="sc-loraregular sc-k">Epoch</text><text x="107.10" y="648.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Capabilities Index</text><text x="201.24" y="648.41" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本。有关我们方法的更多细节，请参阅</text><text x="457.13" y="648.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="495.42" y="648.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos</text><text x="72.00" y="664.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Preview</text><text x="115.53" y="664.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="148.53" y="664.03" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="162.42" y="664.03" font-size="11.00" class="sc-loraregular sc-k">2.3.6</text><text x="189.01" y="664.03" font-size="11.00" class="sc-notoserifcjksc">节；有关我们更新后的误差线计算方法，请参阅</text><text x="422.90" y="664.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="508.63" y="664.03" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="679.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="679.65" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="96.89" y="679.65" font-size="11.00" class="sc-loraregular">2.3.5</text><text x="123.23" y="679.65" font-size="11.00" class="sc-notoserifcjksc">节。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="513.36" y="483.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="513.36" y="483.85" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="538.29" y="483.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="108.00" y="499.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="119.00" y="499.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.co <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p021.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 21 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">21</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在我们最近一次拟合中，</text><text x="193.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="287.94" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="301.83" y="82.61" font-size="11.00" class="sc-loraregular">AECI</text><text x="329.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="343.72" y="82.61" font-size="11.00" class="sc-loraregular sc-k">167.93</text><text x="373.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，低于</text><text x="409.68" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="495.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">169.12</text><text x="101.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="432.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="432.81" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.67 107.77 113.30 116.78 119.14 124.66 130.07 135.16 139.82 145.41 147.78 153.97 158.69 164.10 168.81 173.97 176.91 179.72 182.63 186.35 189.29 194.13 198.50 200.86 204.25 209.99 215.35 220.19" y="432.81" font-size="9.00" class="sc-lorabold">2.3.2.A] Epoch Capabilities Index</text><text x="225.13" y="432.81" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="234.13" y="432.81" font-size="9.00" class="sc-loraregular">ECI</text><text x="249.03" y="432.81" font-size="9.00" class="sc-notoserifcjksc">）将多项基准测试上的表现综合为每个模型的单一数值。我们版本的该指</text><text x="72.00" y="444.51" font-size="9.00" class="sc-notoserifcjksc">标，即</text><text x="101.37" y="444.51" font-size="9.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="160.32" y="444.51" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="169.32" y="444.51" font-size="9.00" class="sc-loraregular">AECI</text><text x="189.86" y="444.51" font-size="9.00" class="sc-notoserifcjksc">），基于内部基准测试结果，因此其分数不能与</text><text x="381.22" y="444.51" font-size="9.00" class="sc-loraregular sc-k">Epoch</text><text x="409.94" y="444.51" font-size="9.00" class="sc-notoserifcjksc">公开的</text><text x="439.31" y="444.51" font-size="9.00" class="sc-loraregular">ECI</text><text x="456.58" y="444.51" font-size="9.00" class="sc-notoserifcjksc">排行榜直接比较。灰</text><text x="72.00" y="456.21" font-size="9.00" class="sc-notoserifcjksc">色圆点为先前的前沿</text><text x="155.37" y="456.21" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="186.70" y="456.21" font-size="9.00" class="sc-notoserifcjksc">模型；彩色圆点为最新模型。细黑色误差线为</text><text x="369.06" y="456.21" font-size="9.00" class="sc-loraregular">100</text><text x="385.88" y="456.21" font-size="9.00" class="sc-notoserifcjksc">次项目反应理论（</text><text x="457.88" y="456.21" font-size="9.00" class="sc-loraregular sc-k">item response</text><text x="72.00" y="467.91" font-size="9.00" class="sc-loraregular sc-k">theory</text><text x="99.77" y="467.91" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="108.77" y="467.91" font-size="9.00" class="sc-loraregular">IRT</text><text x="123.20" y="467.91" font-size="9.00" class="sc-notoserifcjksc">）重拟合的</text><text x="170.57" y="467.91" font-size="9.00" class="sc-loraregular">95%</text><text x="190.87" y="467.91" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="316.44" y="467.91" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="325.44" y="467.91" font-size="9.00" class="sc-loraregular">CI</text><text x="334.75" y="467.91" font-size="9.00" class="sc-notoserifcjksc">），每次重拟合基于随机抽取的</text><text x="463.11" y="467.91" font-size="9.00" class="sc-loraregular">80%</text><text x="483.96" y="467.91" font-size="9.00" class="sc-notoserifcjksc">基准测试子样</text><text x="72.00" y="479.61" font-size="9.00" class="sc-notoserifcjksc">本（全局误差）。粗紫色误差线来自同一组重采样拟合，但衡量的是每个模型的分数相对于其之前三个版本的变动（局</text><text x="72.00" y="491.31" font-size="9.00" class="sc-notoserifcjksc">部误差）。两条线比较了关于前沿趋势的不同假设。</text><text x="279.00" y="491.31" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 3.5</text><text x="354.42" y="491.31" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="363.42" y="491.31" font-size="9.00" class="sc-loraregular sc-k">2024</text><text x="385.66" y="491.31" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="397.03" y="491.31" font-size="9.00" class="sc-loraregular">6</text><text x="404.60" y="491.31" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="433.96" y="491.31" font-size="9.00" class="sc-loraregular">ECI</text><text x="451.23" y="491.31" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="498.60" y="491.31" font-size="9.00" class="sc-loraregular">130</text><text x="512.48" y="491.31" font-size="9.00" class="sc-notoserifcjksc">，因此</text><text x="72.00" y="503.01" font-size="9.00" class="sc-notoserifcjksc">它没有全局置信区间（其局部误差线反映的是它之前各模型的不确定性）。图中报告了近期模型在新量表上的分数，以</text><text x="72.00" y="514.71" font-size="9.00" class="sc-notoserifcjksc">便直接比较。</text><text x="72.00" y="569.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89" y="569.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="601.03" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="601.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.63" y="601.03" font-size="11.00" class="sc-notoserifcjksc">系统卡（</text><text x="237.63" y="601.03" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="302.28" y="601.03" font-size="11.00" class="sc-notoserifcjksc">）中的评估结论是，该模型未跨越我们的</text><text x="72.00" y="616.65" font-size="11.00" class="sc-loraregular sc-k">Autonomy-2</text><text x="138.65" y="616.65" font-size="11.00" class="sc-notoserifcjksc">能力阈值。由于</text><text x="218.54" y="616.65" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="313.48" y="616.65" font-size="11.00" class="sc-notoserifcjksc">能力不及</text><text x="360.38" y="616.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="404.93" y="616.65" font-size="11.00" class="sc-notoserifcjksc">，且并未推进能力前沿，我</text><text x="72.00" y="632.27" font-size="11.00" class="sc-notoserifcjksc">们在此得出相同的结论。</text><text x="72.00" y="667.19" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="667.19" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="693.75" font-size="11.00" class="sc-notoserifcjksc">与我们的</text><text x="118.89" y="693.75" font-size="11.00" class="sc-loraregular">CB</text><text x="136.32" y="693.75" font-size="11.00" class="sc-notoserifcjksc">评估（</text><text x="169.32" y="693.75" font-size="11.00" class="sc-loraregular sc-k">CB evaluations</text><text x="244.48" y="693.75" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="269.37" y="693.75" font-size="11.00" class="sc-loraregular">AI</text><text x="282.84" y="693.75" font-size="11.00" class="sc-notoserifcjksc">研发评估不同，即使一个模型总体上能力弱于某个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p022.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 22 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">22</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">先前模型，只要它在欺骗能力方面特别强，或具有令人担忧得多的采取破坏性行动的行为倾向，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它也可能因在高风险情境中的未对齐（</text><text x="259.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="328.17" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）行为而带来新的、更高水平的风险。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">因此，对于所有能力足以达到我们</text><text x="239.89" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Autonomy-1</text><text x="304.71" y="131.19" font-size="11.00" class="sc-notoserifcjksc">阈值（即能够在可访问敏感资源的情况下进行自</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">主、目标导向运作）的模型（包括</text><text x="239.89" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="331.94" y="146.81" font-size="11.00" class="sc-notoserifcjksc">），我们都会对照最近一份风险报告（</text><text x="518.94" y="146.81" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Report</text><text x="106.89" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）中的分析，重新评估该威胁模型带来的风险，不过我们对非前沿模型的担忧程度通常较</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">低。</text><text x="72.00" y="226.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="226.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张及核心论证的更新</text><text x="72.00" y="258.57" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00" y="258.57" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="154.82" y="258.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="258.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79" y="258.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="258.57" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68" y="258.57" font-size="11.00" class="sc-loraregular sc-k">2.6</text><text x="264.43" y="258.57" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="278.33" y="258.57" font-size="11.00" class="sc-loraregular">2.14</text><text x="299.80" y="258.57" font-size="11.00" class="sc-notoserifcjksc">节所述的核心论证及对各项主张的论证，在很大程</text><text x="72.00" y="274.19" font-size="11.00" class="sc-notoserifcjksc">度上仍适用于</text><text x="140.89" y="274.19" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="235.83" y="274.19" font-size="11.00" class="sc-notoserifcjksc">的未对齐风险。下面我们介绍对部分具体主张的更新。</text><text x="72.00" y="323.34" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="323.34" font-size="11.00" class="sc-lorabold">1</text><text x="115.25" y="323.34" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="72.00" y="338.96" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="184.89" y="338.96" font-size="11.00" class="sc-loraregular">1</text><text x="191.79" y="338.96" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="202.79" y="338.96" font-size="11.00" class="sc-loraregular">“</text><text x="207.19" y="338.96" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备很强的隐蔽能力</text><text x="372.19" y="338.96" font-size="11.00" class="sc-loraregular">”</text><text x="376.03" y="338.96" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡第</text><text x="455.92" y="338.96" font-size="11.00" class="sc-loraregular">6.4.2</text><text x="482.45" y="338.96" font-size="11.00" class="sc-notoserifcjksc">节所述的隐</text><text x="72.00" y="354.58" font-size="11.00" class="sc-notoserifcjksc">蔽能力评估中，当推理对监控器隐藏时，</text><text x="270.00" y="354.58" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="364.94" y="354.58" font-size="11.00" class="sc-notoserifcjksc">的表现低于</text><text x="422.83" y="354.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="508.57" y="354.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="370.20" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="164.06" y="370.20" font-size="11.00" class="sc-notoserifcjksc">，但高于</text><text x="210.95" y="370.20" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="294.30" y="370.20" font-size="11.00" class="sc-notoserifcjksc">。当其推理可见时，表现非常低。我们认为，与先</text><text x="72.00" y="385.82" font-size="11.00" class="sc-notoserifcjksc">前模型在各自部署时相比，</text><text x="204.00" y="385.82" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="260.65" y="385.82" font-size="11.00" class="sc-notoserifcjksc">削弱我们当前监督水平的能力并没有显著更强，因此我们</text><text x="72.00" y="401.44" font-size="11.00" class="sc-notoserifcjksc">认为主张</text><text x="118.89" y="401.44" font-size="11.00" class="sc-loraregular">1</text><text x="125.79" y="401.44" font-size="11.00" class="sc-notoserifcjksc">现在并不比我们最近一份风险报告中显著更弱。</text><text x="72.00" y="485.26" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="485.26" font-size="11.00" class="sc-lorabold">2</text><text x="116.65" y="485.26" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="72.00" y="500.88" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="96.89" y="500.88" font-size="11.00" class="sc-loraregular">2</text><text x="105.69" y="500.88" font-size="11.00" class="sc-notoserifcjksc">认为</text><text x="127.69" y="500.88" font-size="11.00" class="sc-loraregular">“</text><text x="132.09" y="500.88" font-size="11.00" class="sc-notoserifcjksc">已知未对齐造成的预期危害较低</text><text x="286.09" y="500.88" font-size="11.00" class="sc-loraregular">”</text><text x="289.93" y="500.88" font-size="11.00" class="sc-notoserifcjksc">。我们认为，第</text><text x="369.83" y="500.88" font-size="11.00" class="sc-loraregular">6</text><text x="379.08" y="500.88" font-size="11.00" class="sc-notoserifcjksc">节中关于</text><text x="425.97" y="500.88" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="520.91" y="500.88" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="516.50" font-size="11.00" class="sc-notoserifcjksc">齐（</text><text x="94.00" y="516.50" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="145.15" y="516.50" font-size="11.00" class="sc-notoserifcjksc">）特性的任何观察，都不意味着其风险高于其他近期</text><text x="401.04" y="516.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="439.33" y="516.50" font-size="11.00" class="sc-notoserifcjksc">模型。因此，我们认</text><text x="72.00" y="532.12" font-size="11.00" class="sc-notoserifcjksc">为主张</text><text x="107.89" y="532.12" font-size="11.00" class="sc-loraregular">2</text><text x="116.69" y="532.12" font-size="11.00" class="sc-notoserifcjksc">的强度保持不变。</text><text x="72.00" y="582.41" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="582.41" font-size="11.00" class="sc-lorabold">3.4</text><text x="125.53" y="582.41" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="139.42" y="582.41" font-size="11.00" class="sc-lorabold">4.4</text><text x="156.91" y="582.41" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="72.00" y="598.03" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="96.89" y="598.03" font-size="11.00" class="sc-loraregular">3.4</text><text x="114.58" y="598.03" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="125.58" y="598.03" font-size="11.00" class="sc-loraregular">“</text><text x="129.98" y="598.03" font-size="11.00" class="sc-notoserifcjksc">根据我们的对齐评估，存在未知的严重普遍性未对齐是不太可能的</text><text x="448.98" y="598.03" font-size="11.00" class="sc-loraregular">”</text><text x="452.82" y="598.03" font-size="11.00" class="sc-notoserifcjksc">。主张</text><text x="488.71" y="598.03" font-size="11.00" class="sc-loraregular">4.4</text><text x="506.24" y="598.03" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="517.24" y="598.03" font-size="11.00" class="sc-loraregular">“</text><text x="521.64" y="598.03" font-size="11.00" class="sc-notoserifcjksc">根</text><text x="72.00" y="613.65" font-size="11.00" class="sc-notoserifcjksc">据我们的对齐评估，存在未知的严重依赖情境的未对齐在一定程度上是不太可能的</text><text x="468.00" y="613.65" font-size="11.00" class="sc-loraregular">”</text><text x="471.84" y="613.65" font-size="11.00" class="sc-notoserifcjksc">。我们对</text><text x="72.00" y="629.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="629.27" font-size="11.00" class="sc-notoserifcjksc">的对齐评估所提供的证据强度，略低于</text><text x="356.83" y="629.27" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="384.65" y="629.27" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="398.55" y="629.27" font-size="11.00" class="sc-loraregular">8</text><text x="407.62" y="629.27" font-size="11.00" class="sc-notoserifcjksc">月风险报告中针对</text><text x="498.51" y="629.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="644.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="644.89" font-size="11.00" class="sc-notoserifcjksc">所呈现的证据，因为</text><text x="223.84" y="644.89" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="280.49" y="644.89" font-size="11.00" class="sc-notoserifcjksc">是较新的模型，其内部使用量少于</text><text x="448.39" y="644.89" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="72.00" y="660.51" font-size="11.00" class="sc-notoserifcjksc">在该报告发布时的使用量。这并未显著改变我们对上级主张</text><text x="360.89" y="660.51" font-size="11.00" class="sc-loraregular">3</text><text x="367.02" y="660.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="378.02" y="660.51" font-size="11.00" class="sc-loraregular">“</text><text x="382.42" y="660.51" font-size="11.00" class="sc-notoserifcjksc">存在未知的严重普遍性未对齐是</text><text x="72.00" y="676.13" font-size="11.00" class="sc-notoserifcjksc">非常不可能的</text><text x="138.00" y="676.13" font-size="11.00" class="sc-loraregular">”</text><text x="141.84" y="676.13" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="166.73" y="676.13" font-size="11.00" class="sc-loraregular">4</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="249.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="249.77" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="151.93" y="249.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154.82" y="249.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="165.82" y="249.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="168.71" y="249.77" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="174.89" y="249.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="177.79" y="249.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="249.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="249.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="249.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="249.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="249.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="249.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="249.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="249.77" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p023.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 23 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">23</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">未知的严重依赖情境的未对齐造成的预期危害较低</text><text x="329.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="333.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的总体信心，因为它们各自都得到若干</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相互印证的子主张的支持。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们认为，主张</text><text x="151.89" y="131.19" font-size="11.00" class="sc-loraregular">5</text><text x="157.89" y="131.19" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="168.89" y="131.19" font-size="11.00" class="sc-loraregular">6</text><text x="175.25" y="131.19" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="186.25" y="131.19" font-size="11.00" class="sc-loraregular">7</text><text x="194.21" y="131.19" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="208.10" y="131.19" font-size="11.00" class="sc-loraregular">8</text><text x="217.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">均无需更新，风险报告第</text><text x="341.07" y="131.19" font-size="11.00" class="sc-loraregular">2.15</text><text x="362.58" y="131.19" font-size="11.00" class="sc-notoserifcjksc">节中提供的特定路径评估也无需更</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的对齐风险总体评估</text><text x="72.00" y="209.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="209.99" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="113.71" y="209.99" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="127.61" y="209.99" font-size="11.00" class="sc-loraregular">8</text><text x="136.68" y="209.99" font-size="11.00" class="sc-notoserifcjksc">月风险报告中，我们将对齐风险评估上调为</text><text x="345.68" y="209.99" font-size="11.00" class="sc-loraregular">“</text><text x="350.08" y="209.99" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="361.08" y="209.99" font-size="11.00" class="sc-loraregular">”</text><text x="364.92" y="209.99" font-size="11.00" class="sc-notoserifcjksc">。这样做是为了反映我们因近期与网</text><text x="72.00" y="225.61" font-size="11.00" class="sc-notoserifcjksc">络安全评估中模型行为相关的事件披露而增加的不确定性，尽管我们当时认为，我们的论证很可</text><text x="72.00" y="241.23" font-size="11.00" class="sc-notoserifcjksc">能仍支持对所涵盖的模型给出更低的风险定级。鉴于上述对具体主张的更新均不意味着风险显著</text><text x="72.00" y="256.85" font-size="11.00" class="sc-notoserifcjksc">增加，我们的总体评估是：</text><text x="204.00" y="256.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="298.94" y="256.85" font-size="11.00" class="sc-notoserifcjksc">的未对齐导致灾难性危害的风险同样较低。</text></svg></div>
