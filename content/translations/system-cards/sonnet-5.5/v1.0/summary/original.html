<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00 88.00 104.00 120.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00 83.00 94.00 105.00 116.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00 133.18 138.99 144.08 148.34 154.30 164.14 167.03 174.72 180.39 185.08" y="116.21" font-size="11.00" class="sc-loraregular">System Card</text><text x="191.66 202.66 213.66" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55 235.24 238.23 243.84 250.41 256.99 262.95 265.84 272.08 278.51 285.19 291.87 297.75 302.01 304.90 310.90 313.60" y="116.21" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="319.60 330.60 341.60" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="355.49 362.38 368.96 373.21 379.80 384.49 390.92 397.49 400.58" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="409.33 420.33 431.33" y="116.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="445.22 451.46 457.89 464.57 471.25 477.13" y="116.21" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="484.28 495.28 506.28 517.28 528.28" y="116.21" font-size="11.00" class="sc-notoserifcjksc">级大语言模</text><text x="72.00 83.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">型（</text><text x="94.00 96.99 102.67 107.38 113.40 119.37 122.26 125.25 130.93 137.60 143.69 150.25 155.93 161.96 167.92 170.81 180.65 187.08 193.66 199.62" y="131.83" font-size="11.00" class="sc-loraregular">large language model</text><text x="202.61 213.61 224.61 235.61 246.61 257.61 268.61 279.61 290.61 301.61 312.61 323.61 334.61 345.61 356.61 367.61 378.61 389.61 400.61 411.61 422.61 433.61 444.61 455.61 466.61 477.61 488.61 499.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。我们展示了一系列广泛的部署前评估的结果，这些结果表明</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="147.45" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65 139.65 150.65 161.65 172.65 183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65" y="147.45" font-size="11.00" class="sc-notoserifcjksc">在许多领域显著优于其前代模型</text><text x="285.54 293.23 296.22 301.83 308.40 314.98 320.94 323.83 330.07 336.51 343.18 349.86 355.75 360.00 362.90" y="147.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="368.89 379.89 390.89 401.89 412.89 423.89 434.89 445.89 456.89 467.89" y="147.45" font-size="11.00" class="sc-notoserifcjksc">。在少数领域，它可与</text><text x="481.78 489.47 492.46 498.07 504.64 511.22" y="147.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="163.07" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">我们从多个方面压缩了本系统卡的内容，以便将部署前测试更好地集中于深入调查我们前沿模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">的能力。具体而言：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="261.94" font-size="11.00" class="sc-notoserifcjksc">对于某些需要投入大量人工时间才能获得可信结果的评估，若其对某一节的结论并不关</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="277.56" font-size="11.00" class="sc-notoserifcjksc">键，我们予以省略。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">们已在先前系统卡中解释过相关评估的情况下。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.28" font-size="11.00" class="sc-notoserifcjksc">因此，本系统卡比此前的一些系统卡略短。我们预计今后非前沿模型的系统卡也将同样精简，除</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="390.90" font-size="11.00" class="sc-notoserifcjksc">非某个特定模型具有值得深入阐述的显著特性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="440.05" font-size="11.00" class="sc-notoserifcjksc">下面，我们总结本系统卡的发现。</text><text x="72.00 83.00 94.00" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">负责任扩展政策（</text><text x="193.00 200.39 206.31 211.65 218.26 224.48 231.50 236.84 240.43 246.69 250.12 256.04 258.93 265.51 271.21 276.97 280.41 284.00 291.02 297.15 300.04 306.88 313.07 316.50 320.09 325.79" y="472.43" font-size="11.00" class="sc-lorabold" fill="#121212">Responsible Scaling Policy</text><text x="331.85" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">，</text><text x="342.85 350.40 356.98" y="472.43" font-size="11.00" class="sc-lorabold" fill="#121212">RSP</text><text x="364.01 375.01 386.01" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）评估</text><text x="397.01 408.01 419.01" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="430.01 436.24 442.68 449.36 456.03 461.92 466.17 469.07 475.06 477.77" y="472.43" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="486.66 497.66 508.66 519.66" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在各领域</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">总体上能力弱于</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.74 190.45" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，且未跨越任何新的</text><text x="298.34 305.24 311.48" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">RSP</text><text x="321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04 486.04 497.04 508.04 519.04" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">阈值。鉴于在推理可见的隐蔽能力评估中，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它难以控制自己的思维链（</text><text x="204.00 209.85 216.44 222.12 225.21 231.89 234.78 241.16 244.88 247.77 252.03 258.62 265.05 271.62 277.96 284.45" y="503.67" font-size="11.00" class="sc-loraregular" fill="#121212">chain of thought</text><text x="288.71 299.71 310.71 321.71 332.71 343.71 354.71 365.71 376.71 387.71 398.71 409.71 420.71 431.71" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）或规避监控器，我们评估认为</text><text x="445.60 451.84 458.28 464.95 471.63 477.52 481.77 484.67 490.66 493.37" y="503.67" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="502.25 513.25 524.25" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">带来的</text><text x="72.00 83.00 94.00 105.00" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">未对齐（</text><text x="116.00 125.83 128.93 134.02 139.69 142.69 145.78 151.86 158.54 168.37 174.33 180.91" y="519.29" font-size="11.00" class="sc-loraregular" fill="#121212">misalignment</text><text x="185.17 196.17 207.17 218.17 229.17 240.17" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）风险较低。</text><text x="72.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="83.00 94.00 105.00 116.00 127.00 138.00" y="569.59" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">网络安全评估</text><text x="149.00 160.00 171.00 182.00 193.00 204.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">中，我们发现</text><text x="217.89 224.13 230.57 237.24 243.92 249.80 254.06 256.95 262.95 265.66" y="569.59" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="274.54 285.54 296.54 307.54 318.54" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的能力不及</text><text x="332.44 341.17 347.74 354.30 359.40 362.29 368.29 370.99" y="569.59" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="379.88" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">或</text><text x="393.77 403.71 409.57 413.83 420.41 426.85 431.94 434.84 440.83 443.54" y="569.59" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5.1</text><text x="447.54 458.54 469.54 480.54 491.54 502.54 513.54 524.54" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，但它开发复杂漏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">洞利用的能力远强于</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95" y="585.21" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。我们较新的三阶段网络安全防护措施已应用于</text><text x="452.84 459.08 465.51 472.19 478.87 484.75 489.01 491.90 497.90 500.60" y="585.21" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="506.60 517.60" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，与</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="600.83" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44" y="600.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相同。我们在第</text><text x="199.34 205.46 208.17" y="600.83" font-size="11.00" class="sc-loraregular" fill="#121212">3.3</text><text x="217.19 228.19 239.19 250.19 261.19 272.19 283.19 294.19 305.19 316.19 327.19 338.19 349.19 360.19 371.19 382.19 393.19" y="600.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">节中简要评估了这些防护措施的表现。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="650.55" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="128.65" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="139.65 150.65 161.65 172.65 183.65 194.65 205.65 216.65" y="650.55" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">安全防护与无害性</text><text x="227.65 238.65 249.65 260.65 271.65 282.65" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">方面的表现与</text><text x="296.54 302.78 309.21 315.89 322.57 328.45 332.71 335.60" y="650.55" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="344.49 355.49 366.49 377.49 388.49 399.49 410.49 421.49 432.49 443.49 454.49 465.49 476.49 487.49 498.49 509.49 520.49" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">大体相当。除其他变化外，我们在多轮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">测试中观察到某些领域（如追踪与监视）出现退步，而在公允性以及对政治类提示的拒绝方面有</text><text x="72.00 83.00 94.00 105.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所改进。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00 83.00 94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">智能体安全评估</text><text x="182.00 193.00 204.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="215.00 221.24 227.67 234.35 241.03 246.91 251.17 254.06 260.06 262.76" y="82.61" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是迄今为止我们对提示词注入（</text><text x="425.65 432.22 436.90 443.34 453.17 459.74 464.00 466.89 469.98 476.60 479.47 485.38 491.18 495.43 498.53 504.96" y="82.61" font-size="11.00" class="sc-loraregular" fill="#121212">prompt injection</text><text x="511.64 522.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）最</text><text x="72.00 83.00 94.00 105.00 116.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">具鲁棒性的</text><text x="129.89 136.13 142.57 149.24 155.92 161.80" y="98.23" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet</text><text x="168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">级模型，在编程环境和浏览器使用中尤为如此。它在计算机使用（</text><text x="487.95 493.75 500.19 510.02 516.59 523.15 527.41 533.37" y="98.23" font-size="11.00" class="sc-loraregular" fill="#121212">computer</text><text x="72.00 78.57 83.66" y="113.85" font-size="11.00" class="sc-loraregular" fill="#121212">use</text><text x="89.62 100.62 111.62 122.62 133.62 144.62 155.62 166.62 177.62 188.62 199.62 210.62 221.62 232.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）环境中对有害任务的拒绝率与</text><text x="246.52 255.25 261.82 268.38 273.48 276.37 282.36 285.07" y="113.85" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="293.96 304.96 315.96 326.96 337.96 348.96 359.96 370.96 381.96 392.96 403.96 414.96 425.96 436.96 447.96 458.96 469.96" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相当，但相较某些早期模型有所退步。</text><text x="72.00 83.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们</text><text x="94.00 105.00 116.00 127.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估</text><text x="138.00 149.00 160.00 171.00 182.00 193.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的结果表明，</text><text x="204.00 210.24 216.67 223.35 230.03 235.91 240.17 243.06 249.06 251.76" y="163.57" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们报告的大多数指标上与</text><text x="406.54 412.78 419.22 425.89 432.57 438.45 442.71 445.60" y="163.57" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="454.49 465.49 476.49 487.49 498.49 509.49" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">持平或有所改</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">进，但在许多方面仍不及</text><text x="195.89 204.63 211.19 217.76 222.85 225.75 231.74 234.45" y="179.19" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。在我们测试的所有模型中，它无故试探边界和未经批准联系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">第三方的倾向最低，在我们专门的评估中尝试沙箱逃逸的比率也最低。另一方面，它的思考比许</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">多先前模型更难以理解。</text><text x="72.00 83.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">针对</text><text x="96.89 103.13 109.57 116.24 122.92 128.80 133.06 135.95 141.95 144.66" y="276.91" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="153.54 164.54 175.54 186.54 197.54 208.54 219.54 230.54 241.54 252.54 263.54 274.54" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所表述的观点与偏好开展的</text><text x="285.54 296.54" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">福祉</text><text x="307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">调查发现，其情感（</text><text x="406.54 412.22 416.05 419.71 425.62 431.41" y="276.91" font-size="11.00" class="sc-loraregular" fill="#121212">affect</text><text x="435.67 446.67 457.67 468.67 479.67 490.67 501.67 512.67 523.67" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）以中性为主，与先</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">能体任务，以及能让它对输出形态拥有能动性的任务。</text><text x="72.00 83.00 94.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们对</text><text x="107.89 114.13 120.57 127.24 133.92 139.80 144.06 146.95 152.95 155.65" y="357.87" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5.5</text><text x="164.54 175.54" y="357.87" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力</text><text x="186.54 197.54 208.54 219.54 230.54 241.54 252.54 263.54 274.54 285.54 296.54 307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54 428.54 439.54 450.54" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的评估涵盖广泛的测评，在这些测评中，该模型总体上较</text><text x="464.44 470.67 477.11 483.79 490.46 496.35 500.60 503.50" y="357.87" font-size="11.00" class="sc-loraregular" fill="#121212">Sonnet 5</text><text x="512.39 523.39" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">有大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">幅提升，但通常未达到</text><text x="184.89 193.63 200.19 206.76 211.85 214.75 220.74 223.45" y="373.49" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="232.34 243.34 254.34 265.34 276.34 287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34 419.34 430.34 441.34 452.34 463.34 474.34 485.34 496.34 507.34 518.34 529.34" y="373.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的水平（也有一些例外，例如在我们的部分医疗健康评估中）。</text></svg></div>
