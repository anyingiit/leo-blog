.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00" y="116.21" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="191.66" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="319.60" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="355.49" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="409.33" y="116.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="445.22" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="484.28" y="116.21" font-size="11.00" class="sc-notoserifcjksc">级大语言模</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">型（</text><text x="94.00" y="131.83" font-size="11.00" class="sc-loraregular sc-k">large language model</text><text x="202.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。我们展示了一系列广泛的部署前评估的结果，这些结果表明</text><text x="72.00" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="147.45" font-size="11.00" class="sc-notoserifcjksc">在许多领域显著优于其前代模型</text><text x="285.54" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="368.89" y="147.45" font-size="11.00" class="sc-notoserifcjksc">。在少数领域，它可与</text><text x="481.78" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="163.07" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">我们从多个方面压缩了本系统卡的内容，以便将部署前测试更好地集中于深入调查我们前沿模型</text><text x="72.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">的能力。具体而言：</text><text x="108.00" y="261.94" font-size="11.00" class="sc-notoserifcjksc">对于某些需要投入大量人工时间才能获得可信结果的评估，若其对某一节的结论并不关</text><text x="108.00" y="277.56" font-size="11.00" class="sc-notoserifcjksc">键，我们予以省略。</text><text x="108.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">们已在先前系统卡中解释过相关评估的情况下。</text><text x="72.00" y="375.28" font-size="11.00" class="sc-notoserifcjksc">因此，本系统卡比此前的一些系统卡略短。我们预计今后非前沿模型的系统卡也将同样精简，除</text><text x="72.00" y="390.90" font-size="11.00" class="sc-notoserifcjksc">非某个特定模型具有值得深入阐述的显著特性。</text><text x="72.00" y="440.05" font-size="11.00" class="sc-notoserifcjksc">下面，我们总结本系统卡的发现。</text><text x="72.00" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">负责任扩展政策（</text><text x="193.00" y="472.43" font-size="11.00" class="sc-lorabold sc-k" fill="#121212">Responsible Scaling Policy</text><text x="331.85" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">，</text><text x="342.85" y="472.43" font-size="11.00" class="sc-lorabold" fill="#121212">RSP</text><text x="364.01" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）评估</text><text x="397.01" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="430.01" y="472.43" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="486.66" y="472.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在各领域</text><text x="72.00" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">总体上能力弱于</text><text x="151.89" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="196.44" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，且未跨越任何新的</text><text x="298.34" y="488.05" font-size="11.00" class="sc-loraregular" fill="#121212">RSP</text><text x="321.04" y="488.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">阈值。鉴于在推理可见的隐蔽能力评估中，</text><text x="72.00" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它难以控制自己的思维链（</text><text x="204.00" y="503.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">chain of thought</text><text x="288.71" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）或规避监控器，我们评估认为</text><text x="445.60" y="503.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="502.25" y="503.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">带来的</text><text x="72.00" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">未对齐（</text><text x="116.00" y="519.29" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">misalignment</text><text x="185.17" y="519.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）风险较低。</text><text x="72.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="83.00" y="569.59" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">网络安全评估</text><text x="149.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">中，我们发现</text><text x="217.89" y="569.59" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="274.54" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的能力不及</text><text x="332.44" y="569.59" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="379.88" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">或</text><text x="393.77" y="569.59" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="447.54" y="569.59" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，但它开发复杂漏</text><text x="72.00" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">洞利用的能力远强于</text><text x="173.89" y="585.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5</text><text x="218.95" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。我们较新的三阶段网络安全防护措施已应用于</text><text x="452.84" y="585.21" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="506.60" y="585.21" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，与</text><text x="72.00" y="600.83" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="119.44" y="600.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相同。我们在第</text><text x="199.34" y="600.83" font-size="11.00" class="sc-loraregular" fill="#121212">3.3</text><text x="217.19" y="600.83" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">节中简要评估了这些防护措施的表现。</text><text x="72.00" y="650.55" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="128.65" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在</text><text x="139.65" y="650.55" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">安全防护与无害性</text><text x="227.65" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">方面的表现与</text><text x="296.54" y="650.55" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5</text><text x="344.49" y="650.55" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">大体相当。除其他变化外，我们在多轮</text><text x="72.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">测试中观察到某些领域（如追踪与监视）出现退步，而在公允性以及对政治类提示的拒绝方面有</text><text x="72.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所改进。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们的</text><text x="105.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">智能体安全评估</text><text x="182.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">发现，</text><text x="215.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="271.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">是迄今为止我们对提示词注入（</text><text x="425.65" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">prompt injection</text><text x="511.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）最</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">具鲁棒性的</text><text x="129.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet</text><text x="168.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">级模型，在编程环境和浏览器使用中尤为如此。它在计算机使用（</text><text x="487.95" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">computer</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular" fill="#121212">use</text><text x="89.62" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）环境中对有害任务的拒绝率与</text><text x="246.52" y="113.85" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="293.96" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相当，但相较某些早期模型有所退步。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们</text><text x="94.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估</text><text x="138.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的结果表明，</text><text x="204.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="260.65" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们报告的大多数指标上与</text><text x="406.54" y="163.57" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5</text><text x="454.49" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">持平或有所改</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">进，但在许多方面仍不及</text><text x="195.89" y="179.19" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="240.44" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。在我们测试的所有模型中，它无故试探边界和未经批准联系</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">第三方的倾向最低，在我们专门的评估中尝试沙箱逃逸的比率也最低。另一方面，它的思考比许</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">多先前模型更难以理解。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">针对</text><text x="96.89" y="276.91" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="153.54" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所表述的观点与偏好开展的</text><text x="285.54" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">福祉</text><text x="307.54" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">调查发现，其情感（</text><text x="406.54" y="276.91" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">affect</text><text x="435.67" y="276.91" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）以中性为主，与先</text><text x="72.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">能体任务，以及能让它对输出形态拥有能动性的任务。</text><text x="72.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们对</text><text x="107.89" y="357.87" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5.5</text><text x="164.54" y="357.87" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力</text><text x="186.54" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的评估涵盖广泛的测评，在这些测评中，该模型总体上较</text><text x="464.44" y="357.87" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Sonnet 5</text><text x="512.39" y="357.87" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">有大</text><text x="72.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">幅提升，但通常未达到</text><text x="184.89" y="373.49" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5.5</text><text x="232.34" y="373.49" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的水平（也有一些例外，例如在我们的部分医疗健康评估中）。</text></svg></div>
