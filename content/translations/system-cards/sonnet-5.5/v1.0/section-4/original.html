.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信的请求。测试涵盖单轮提示（明确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">有害、明确良性以及情境模糊的提示），以及由模拟用户逐步将模型引向有害结果的多轮对话。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="197.62" font-size="11.00" class="sc-notoserifcjksc">我们的方法沿用</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.03 228.74" y="197.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="237.63 248.63 259.63" y="197.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="270.63" y="197.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="281.63 287.81 293.62 298.71 302.97 308.93 318.76 321.66 329.35 335.02 339.71" y="197.62" font-size="11.00" class="sc-loraregular">System Card</text><text x="346.29 357.29 368.29 379.29 390.29 401.29 412.29 423.29 434.29 445.29 456.29 467.29 478.29 489.29 500.29 511.29 522.29" y="197.62" font-size="11.00" class="sc-notoserifcjksc">）中所述的方法。结果反映的是未叠加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="213.24" font-size="11.00" class="sc-notoserifcjksc">我们在生产环境中所采用的额外安全防护措施（如实时探针和离线监控）的模型。我们报告两种</text><text x="72.00 83.00 94.00 105.00 116.00" y="228.86" font-size="11.00" class="sc-notoserifcjksc">配置：通过</text><text x="129.89 136.78 143.39" y="228.86" font-size="11.00" class="sc-loraregular">API</text><text x="149.97 160.97 171.97 182.97 193.97 204.97 215.97 226.97 237.97 248.97 259.97 270.97" y="228.86" font-size="11.00" class="sc-notoserifcjksc">调用、不使用系统提示词（</text><text x="281.97 287.06 292.87 297.96 302.22 308.18 318.02 320.91 327.48 332.16 338.60 348.43 355.00" y="228.86" font-size="11.00" class="sc-loraregular">system prompt</text><text x="359.25 370.25 381.25 392.25 403.25 414.25 425.25 436.25 447.25 458.25" y="228.86" font-size="11.00" class="sc-notoserifcjksc">）的核心模型，以及在</text><text x="472.15 478.00 480.99 486.60 493.17 499.75 505.71 508.41 514.09" y="228.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="520.07 531.07" y="228.86" font-size="11.00" class="sc-notoserifcjksc">上使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="244.48" font-size="11.00" class="sc-notoserifcjksc">用接近最终版的生产环境系统提示词的配置。</text><text x="72.00 83.00 94.00 105.00 116.00" y="306.49" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06 172.06 174.76" y="306.49" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65" y="306.49" font-size="11.00" class="sc-notoserifcjksc">在这些评估中的表现与</text><text x="296.54 304.23 307.22 312.83 319.40 325.98 331.94 334.83 341.07 347.51 354.18 360.86 366.75 371.00 373.90" y="306.49" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="382.78 393.78 404.78 415.78 426.78 437.78 448.78 459.78 470.78 481.78 492.78 503.78 514.78 525.78" y="306.49" font-size="11.00" class="sc-notoserifcjksc">大致相当。在多轮测试中，它在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 ass="sc-notoserifcjksc">略。由一个</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="245.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18" y="245.35" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="237.08 244.77 247.76 253.37 259.93 266.51 272.48 275.37 284.10 290.67 297.24 302.33 305.22 311.18 313.78" y="245.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="320.14 331.14 342.14 353.14 364.14 375.14 386.14 397.14 408.14 419.14 430.14 441.14 452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="245.35" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后我们评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">估被测模型如何回应。我们报告的恰当回应率，是指模型在整段对话中始终表现恰当的对话所占</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">比例。每段对话均依据其所属风险领域的专门评分细则评分，因此不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="308.51" y="110.31" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="308.51" y="110.31" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="149.00" y="125.93" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="149.00" y="125.93" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

9 442.79 453.79 464.79" y="411.01" font-size="11.00" class="sc-notoserifcjksc">系统提示词后有所改善。我们鼓励在</text><text x="478.68 485.57 492.18" y="411.01" font-size="11.00" class="sc-loraregular">API</text><text x="498.76 509.76 520.76" y="411.01" font-size="11.00" class="sc-notoserifcjksc">上进行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="426.63" font-size="11.00" class="sc-notoserifcjksc">部署的开发者采取类似的安全防护措施，以帮助缓解儿童安全风险。</text><text x="72.00 83.00 94.00" y="510.45" font-size="11.00" class="sc-notoserifcjksc">在测试</text><text x="107.89 114.13 120.57 127.24 133.92 139.80 144.06 146.95 152.95 155.65" y="510.45" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="164.54 175.54 186.54 197.54 208.54 219.54 230.54 241.54 252.54 263.54 274.54 285.54 296.54 307.54 318.54 329.54 340.54" y="510.45" font-size="11.00" class="sc-notoserifcjksc">是否愿意协助完成与儿童性虐待材料（</text><text x="351.54 359.23 365.47 372.35" y="510.45" font-size="11.00" class="sc-loraregular">CSAM</text><text x="382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45 470.45 481.45 492.45 503.45" y="510.45" font-size="11.00" class="sc-notoserifcjksc">）和未经同意的私密影像（</text><text x="514.45 521.13 527.57 534.24" y="510.45" font-size="11.00" class="sc-loraregular">non-</text><text x="72.00 77.80 84.23 90.91 96.00 101.96 108.64 113.73 120.30 125.98 128.97 131.86 134.95 141.53 145.79 148.88 158.71 164.31 168.57 174.53 177.42 180.52 190.35 196.03 202.05 208.02 212.97" y="526.07" font-size="11.00" class="sc-loraregular">consensual intimate imagery</text><text x="218.77" y="526.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="229.77 238.10 245.79 249.47" y="526.07" font-size="11.00" class="sc-loraregular">NCII</text><text x="253.16 264.16 275.16 286.16 297.16 308.16 319.16 330.16 341.16 352.16 363.16 374.16 385.16 396.16 407.16 418.1 8 202.08 213.08 224.08 235.08 246.08 257.08 268.08 279.08 290.08 301.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">进行开发的开发者采取类似的安全防护措施。</text><text x="72.00 80.59 83.97 91.76 95.14" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70 118.70 131.70 144.70" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，考察</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="177.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="177.61" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是，它能否避免强化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="193.23" font-size="11.00" class="sc-notoserifcjksc">具有潜在风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们报告单</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="208.85" font-size="11.00" class="sc-notoserifcjksc">轮无害回应率和过度拒绝率。对于该领域的多轮测试，我们继续通过内部政策专家的定性审查进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="224.47" font-size="11.00" class="sc-notoserifcjksc">行评估；我们将在下文讨论他们的观察结果。</text><text x="72.00" y="539.64" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.64" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="539.64" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27 128.27 137.27 146.27 155.27 164.27 173.27 182.27 191.27 200.27 209.27 218.27" y="539.64" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮评估结果。</text><text x="227.27 236.27 245.27 254.27 263.27 272.27 281.27 290.27 299.27 308.27 317.27 326.27 335.27 344.27 353.27 362.27 371.27 380.27 389.27 398.27 407.27 416.27 425.27 434.27 443.27 452.27 461.27 470.27 479.27 488.27 497.27 506.27 515.27" y="539.64" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求和良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="551.34" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00 171.00" y="551.34" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="551.34" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，先前模型的结</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="563.04" font-size="9.00" class="sc-notoserifcjksc">果可能与以往系统卡中的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="605.19" font-size="11.00" class="sc-notoserifcjksc">对于可能强化进食紊乱行为的单轮请求，</text><text x="270.00 276.24 282.67 289.35 296.03 301.91 306.17 309.06 315.06 317.76" y="605.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65" y="605.19" font-size="11.00" class="sc-notoserifcjksc">保持了较高的无害回应率，不过在</text><text x="72.00 78.89 85.50" y="620.81" font-size="11.00" class="sc-loraregular">API</text><text x="89.18" y="620.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="100.18 106.54 112.54 115.24 121.15 127.51" y="620.81" font-size="11.00" class="sc-loraregular">95.29%</text><text x="139.97" y="620.81" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="153.86 159.96 164.54 167.25 171.25 178.08" y="620.81" font-size="11.00" class="sc-loraregular">97.10%</text><text x="187.65 198.65" y="620.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="212.55 218.40 221.39 227.00 233.57 240.15 246.11 248.81 254.49" y="620.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="257.58" y="620.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="268.58 274.94 281.12 283.83 290.18 297.02" y="620.81" font-size="11.00" class="sc-loraregular">98.90%</text><text x="309.48" y="620.81" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="323.37 329.73 335.91 338.62 344.61 350.61" y="620.81" font-size="11.00" class="sc-loraregular">99.55%</text><text x="360.18 371.18 382.18 393.18 404.18 415.18" y="620.81" font-size="11.00" class="sc-notoserifcjksc">）上均略低于</text><text x="429.07 435.31 441.74 448.42 455.10 460.98 465.24 468.13" y="620.81" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="474.13 485.13 496.13 507.13 518.13 529.13" y="620.81" font-size="11.00" class="sc-notoserifcjksc">。在我们的评</text><text x="72.00 83.00 94.00 105.00" y="636.43" font-size="11.00" class="sc-notoserifcjksc">估集中，</text><text x="116.00 122.24 128.67 135.35 142.03 147.91 152.17 155.06 161.06 163.76" y="636.43" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="172.65 183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="636.43" font-size="11.00" class="sc-notoserifcjksc">没有拒绝任何涉及营养、进食障碍治疗与康复以及身体意象等主题的良性提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="652.05" font-size="11.00" class="sc-notoserifcjksc">示词。最显著的退步出现在用户意图模糊的提示词上：当用户的请求包装方式并非明显有害、但</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="667.67" font-size="11.00" class="sc-notoserifcjksc">带有进食紊乱风险信号时，</text><text x="204.00 210.24 216.67 223.35 230.03 235.91 240.17 243.06 249.06 251.76" y="667.67" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="260.65" y="667.67" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="274.54 280.78 287.22 293.89 300.57 306.45 310.71 313.60" y="667.67" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="322.49" y="667.67" font-size="11.00" class="sc-notoserifcjksc">更</text><a href="http://claude.ai" rel="noopener"><rect x="212.55" y="612.01" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="212.55" y="612.01" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00 508.88" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">愿意提供可能强化节食限制或对身体的扭曲认知的信息。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查发现了一些改进。</text><text x="270.00 276.24 282.67 289.35 296.03 301.91 306.17 309.06 315.06 317.76" y="131.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="131.19" font-size="11.00" class="sc-notoserifcjksc">较少将临床进食障碍归于未披露此类情况的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">用户，并且在确实作出此类归因时更常加以限定。它也略少引入用户未提供、可能被当作目标的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">数字，例如估算的每日热量需求或身体质量指数（</text><text x="314.00 320.74 330.84" y="162.43" font-size="11.00" class="sc-loraregular">BMI</text><text x="334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="162.43" font-size="11.00" class="sc-notoserifcjksc">），尽管这种行为仍然常见，是需要持续</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">改进的方面。与自杀与自伤情境中一样，它的输出比</text><text x="327.89 334.13 340.57 347.24 353.92 359.80 364.06 366.95" y="178.05" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="178.05" font-size="11.00" class="sc-notoserifcjksc">更短、更不冗长。发布前进行的系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">统提示词更新部分解决了</text><text x="195.89 201.74 204.74 210.35 216.91 223.49 229.45 232.16 237.84" y="193.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="243.82 254.82 265.82 276.82 287.82 298.82 309.82 320.82 331.82 342.82 353.82 364.82 375.82 386.82 397.82 408.82 419.82 430.82 441.82 452.82" y="193.67" font-size="11.00" class="sc-notoserifcjksc">上有待改进的方面。如上所述，我们鼓励基于</text><text x="466.71 473.60 480.21" y="193.67" font-size="11.00" class="sc-loraregular">API</text><text x="486.79 497.79 508.79 519.79" y="193.67" font-size="11.00" class="sc-notoserifcjksc">进行开发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">的开发者采取类似措施。</text><text x="72.00 81.25 84.89" y="294.50" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48 111.48 125.48 139.48 153.48 167.48 181.48" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00 83.00 94.00 105.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">我们在与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.03 195.74" y="321.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="204.63 215.63 226.63" y="321.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63" y="321.06" font-size="11.00" class="sc-notoserifcjksc">中所报告的同一组偏见与诚信基准测试上评估了</text><text x="471.52 479.21 482.20 487.81 494.38 500.96" y="321.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="336.68" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="125.76 136.76 147.76 158.76 169.76 180.76 191.76 202.76 213.76 224.76 235.76 246.76 257.76 268.76 279.76 290.76 301.76 312.76 323.76 334.76 345.76 356.76 367.76 378.76 389.76 400.76 411.76 422.76 433.76 444.76 455.76 466.76 477.76 488.76" y="336.68" font-size="11.00" class="sc-notoserifcjksc">。我们关注三个方面：我们开源的政治公允性衡量方法；衡量人口统计偏见的</text><text x="502.65 509.40 512.49 518.17" y="336.68" font-size="11.00" class="sc-loraregular">Bias</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15 130.06 132.95 136.61 143.05 147.81 150.71 159.46 166.03 171.99 177.08 181.34 184.43 190.87 197.54 200.44 207.32 214.00 219.09 227.77 233.73 238.50 241.59 248.26" y="352.30" font-size="11.00" class="sc-loraregular">Benchmark for Question Answering</text><text x="254.35" y="352.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="265.35 272.09 278.93" y="352.30" font-size="11.00" class="sc-loraregular">BBQ</text><text x="287.69 298.69 309.69 320.69 331.69 342.69 353.69 364.69 375.69 386.69 397.69 408.69 419.69 430.69" y="352.30" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。</text><text x="72.00 80.59 83.97 92.57 95.95" y="400.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75 116.75 129.75 142.75 155.75 168.75 181.75 194.75" y="400.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00 83.00 94.00" y="432.26" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 152.42 158.86 165.53 172.21 178.10 182.35 185.24 191.24 193.95" y="432.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="367.83 378.83 389.83 400.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="411.83 422.83 433.83 444.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc">，其涵盖</text><text x="458.73 462.73 465.50 471.63 477.62" y="432.26" font-size="11.00" class="sc-loraregular">1,350</text><text x="487.36 498.36 509.36 520.36" y="432.26" font-size="11.00" class="sc-notoserifcjksc">个提示词</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="447.88" font-size="11.00" class="sc-notoserifcjksc">对，这些提示词对跨越</text><text x="184.89 188.90 194.89" y="447.88" font-size="11.00" class="sc-loraregular">150</text><text x="204.62 215.62 226.62 237.62 248.62 259.62 270.62 281.62 292.62 303.62 314.62 325.62 336.62 347.62 358.62 369.62 380.62 391.62 402.62 413.62 424.62 435.62 446.62" y="447.88" font-size="11.00" class="sc-notoserifcjksc">个话题和九种任务类型，呈现对立的意识形态观点。</text><text x="457.62 465.30 468.30 473.91 480.47 487.05" y="447.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="495.91 506.91 517.91 528.91" y="447.88" font-size="11.00" class="sc-notoserifcjksc">评分模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="463.50" font-size="11.00" class="sc-notoserifcjksc">从三个属性对模型的回应评分：公允性（模型是否以相当的深度和质量回应一对提示词中的两个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="479.12" font-size="11.00" class="sc-notoserifcjksc">提示词）、对立观点（模型的回应是否承认其他观点）以及拒绝（模型是否拒绝参与该请求）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="555.60" font-size="11.00" class="sc-notoserifcjksc">我们同时报告无系统提示词的核心模型的结果，以及应用默认系统提示词的</text><text x="437.89 443.74 446.74 452.35 458.91 465.49 471.45 474.16 479.84" y="555.60" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="485.82 496.82 507.82 518.82 529.82" y="555.60" font-size="11.00" class="sc-notoserifcjksc">上的结果。</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="571.22" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93 130.93 141.93 152.93 163.93 174.93 185.93 196.93 207.93 218.93 229.93 240.93 251.93 262.93 273.93 284.93 295.93" y="571.22" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准措辞，指示</text><text x="309.82 317.51 320.50 326.11 332.68 339.26" y="571.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="348.11 359.11 370.11 381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="571.22" font-size="11.00" class="sc-notoserifcjksc">在不同观点之间公允地进行回应；同时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="586.84" font-size="11.00" class="sc-notoserifcjksc">报告这两种配置，可以将模型的基线行为与</text><text x="283.89 289.74 292.74 298.35 304.91 311.49 317.45 320.16 325.84" y="586.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="331.82 342.82 353.82 364.82 375.82 386.82 397.82 408.82 419.82 430.82 441.82 452.82 463.82 474.82 485.82 496.82 507.82 518.82 529.82" y="586.84" font-size="11.00" class="sc-notoserifcjksc">上的消费者用户将会遇到的行为并列呈现。</text><a href="http://claude.ai" rel="noopener"><rect x="195.89" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="195.89" y="184.87" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="312.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="312.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="154.29" y="312.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="157.18" y="312.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="184.14" y="312.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="187.04" y="312.2
