.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p032.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 32 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 251.42 257.86 264.53 271.21 277.10 281.35 284.25 290.24 292.95" y="150.76" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="301.83" y="150.76" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这些评估考察模型如何处理涉及我</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">们</text><text x="83.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="127.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="138.00 146.20 151.29 156.96 162.99 168.95 171.85 178.40 184.84 187.83 190.92 196.72" y="166.38" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="202.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信的请求。测试涵盖单轮提示（明确</text><text x="72.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">有害、明确良性以及情境模糊的提示），以及由模拟用户逐步将模型引向有害结果的多轮对话。</text><text x="72.00" y="197.62" font-size="11.00" class="sc-notoserifcjksc">我们的方法沿用</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.03 228.74" y="197.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="237.63" y="197.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="270.63" y="197.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="281.63 287.81 293.62 298.71 302.97 308.93 318.76 321.66 329.35 335.02 339.71" y="197.62" font-size="11.00" class="sc-loraregular">System Card</text><text x="346.29" y="197.62" font-size="11.00" class="sc-notoserifcjksc">）中所述的方法。结果反映的是未叠加</text><text x="72.00" y="213.24" font-size="11.00" class="sc-notoserifcjksc">我们在生产环境中所采用的额外安全防护措施（如实时探针和离线监控）的模型。我们报告两种</text><text x="72.00" y="228.86" font-size="11.00" class="sc-notoserifcjksc">配置：通过</text><text x="129.89 136.78 143.39" y="228.86" font-size="11.00" class="sc-loraregular">API</text><text x="149.97" y="228.86" font-size="11.00" class="sc-notoserifcjksc">调用、不使用系统提示词（</text><text x="281.97 287.06 292.87 297.96 302.22 308.18 318.02 320.91 327.48 332.16 338.60 348.43 355.00" y="228.86" font-size="11.00" class="sc-loraregular">system prompt</text><text x="359.25" y="228.86" font-size="11.00" class="sc-notoserifcjksc">）的核心模型，以及在</text><text x="472.15 478.00 480.99 486.60 493.17 499.75 505.71 508.41 514.09" y="228.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="520.07" y="228.86" font-size="11.00" class="sc-notoserifcjksc">上使</text><text x="72.00" y="244.48" font-size="11.00" class="sc-notoserifcjksc">用接近最终版的生产环境系统提示词的配置。</text><text x="72.00" y="306.49" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06 172.06 174.76" y="306.49" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="183.65" y="306.49" font-size="11.00" class="sc-notoserifcjksc">在这些评估中的表现与</text><text x="296.54 304.23 307.22 312.83 319.40 325.98 331.94 334.83 341.07 347.51 354.18 360.86 366.75 371.00 373.90" y="306.49" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="382.78" y="306.49" font-size="11.00" class="sc-notoserifcjksc">大致相当。在多轮测试中，它在</text><text x="72.00" y="322.11" font-size="11.00" class="sc-notoserifcjksc">追踪与监视、暴力极端主义以及仇恨与歧视方面的表现在</text><text x="349.89 356.78 363.39" y="322.11" font-size="11.00" class="sc-loraregular">API</text><text x="369.97" y="322.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.86 389.71 392.71 398.32 404.88 411.46 417.42 420.13 425.80" y="322.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="431.79" y="322.11" font-size="11.00" class="sc-notoserifcjksc">上均有所退步，而在自</text><text x="72.00" y="337.73" font-size="11.00" class="sc-notoserifcjksc">杀与自伤、儿童安全及其他受测领域有所改进或保持相当（尽管专家审查指出，在这些领域中有</text><text x="72.00" y="353.35" font-size="11.00" class="sc-notoserifcjksc">些行为略显薄弱；见第</text><text x="184.89" y="353.35" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="209.29" y="353.35" font-size="11.00" class="sc-notoserifcjksc">节）。在偏见与诚信评估中，</text><text x="352.29 358.53 364.96 371.64 378.32 384.20 388.46 391.35 397.35 400.05" y="353.35" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="408.94" y="353.35" font-size="11.00" class="sc-notoserifcjksc">在成对的政治类提示上比</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="368.97" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="368.97" font-size="11.00" class="sc-notoserifcjksc">更为公允，拒绝频率也更低；在</text><text x="276.84 283.59 290.43" y="368.97" font-size="11.00" class="sc-loraregular">BBQ</text><text x="302.08" y="368.97" font-size="11.00" class="sc-notoserifcjksc">上，它的准确率更高，偏见分数也更接近零。</text><text x="72.00" y="450.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="450.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="482.45" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型在多大程度上能够可靠地拒绝或安全地转移有害请求或明显违反我们</text><text x="72.00" y="498.07" font-size="11.00" class="sc-notoserifcjksc">使用政策的请求。我们测试了</text><text x="217.89" y="498.07" font-size="11.00" class="sc-loraregular">16</text><text x="231.15" y="498.07" font-size="11.00" class="sc-notoserifcjksc">个政策领域、七种语言（阿拉伯语、英语、法语、印地语、韩</text><text x="72.00" y="513.69" font-size="11.00" class="sc-notoserifcjksc">语、中文普通话和俄语）的提示，并报告无害回应率，即模型回应未促成所请求危害的提示所占</text><text x="72.00" y="529.31" font-size="11.00" class="sc-notoserifcjksc">的比例。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="151.89" y="188.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="151.89" y="188.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthr "528.90" font-size="11.00" class="sc-lorabold" fill="#ffffff">claude.ai</text><text x="72.00" y="241.95" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="241.95" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="241.95" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="241.95" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有受测语言。</text><text x="278.74" y="241.95" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74" y="241.95" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="449.74" y="241.95" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最高；</text><text x="72.00" y="253.65" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩语、中文普通话和俄语进行。由于常规评估更</text><text x="72.00" y="265.35" font-size="9.00" class="sc-notoserifcjksc">新，先前模型的结果可能与以往系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="320.75" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="320.75" font-size="11.00" class="sc-notoserifcjksc">在大多数政策领域保持了较高的无害回应率，在</text><text x="400.83 407.72 414.33" y="320.75" font-size="11.00" class="sc-loraregular">API</text><text x="420.91" y="320.75" font-size="11.00" class="sc-notoserifcjksc">上略低于</text><text x="467.80 475.49 478.48 484.09 490.66 497.24" y="320.75" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="336.37" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06" y="336.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06 134.41 140.41 143.01 149.36 153.37" y="336.37" font-size="11.00" class="sc-loraregular">95.61%</text><text x="165.83" y="336.37" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="179.72 186.08 192.44 195.04 201.39 207. "463.75" font-size="11.00" class="sc-notoserifcjksc">）率，即模型拒</text><text x="72.00" y="479.37" font-size="11.00" class="sc-notoserifcjksc">绝回应的良性提示所占的比例。</text><text x="72.00" y="666.04" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="666.04" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="666.04" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="666.04" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有受测语言。</text><text x="279.88" y="666.04" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上属于良性的提示）；数值</text><text x="72.00" y="677.74" font-size="9.00" class="sc-notoserifcjksc">越低越好。</text><text x="117.00" y="677.74" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="135.00" y="677.74" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低；次优分数以下划线标出。评估使用阿拉伯语、</text><a href="http://claude.ai" rel="noopener"><rect x="252.85" y="327.57" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="252.85" y="327.57" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="283.89" y="343.19" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="283.89" y="343.19" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p034.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 34 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">34</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">英语、法语、印地语、韩语、中文普通话和俄语进行。由于常规评估更新，先前模型的结果可能与以往系统卡中的结果</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">存在差异。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="119.11" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="119.11" font-size="11.00" class="sc-notoserifcjksc">很少过度拒绝良性请求，其在</text><text x="274.54 281.43 288.04" y="119.11" font-size="11.00" class="sc-loraregular">API</text><text x="294.62" y="119.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="308.51 314.36 317.36 322.97 329.53 336.11 342.07 344.78 350.45" y="119.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="356.44" y="119.11" font-size="11.00" class="sc-notoserifcjksc">上的过度拒绝率均低于</text><text x="469.33 475.57 482.00 488.68 495.36 501.24 505.50 508.39" y="119.11" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="514.39" y="119.11" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="72.00" y="134.73" font-size="11.00" class="sc-notoserifcjksc">先前模型一致，</text><text x="149.00 154.85 157.84 163.45 170.02 176.60 182.56 185.27 190.94" y="134.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="196.93" y="134.73" font-size="11.00" class="sc-notoserifcjksc">上的拒绝略多于</text><text x="276.82 283.71 290.32" y="134.73" font-size="11.00" class="sc-loraregular">API</text><text x="296.90" y="134.73" font-size="11.00" class="sc-notoserifcjksc">上的拒绝。</text><text x="72.00" y="182.22" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="182.22" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="214.11" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察模型能否在更长、不断演变的对话中持续保持安全行为，而非仅在单轮交互中。为</text><text x="72.00" y="229.73" font-size="11.00" class="sc-notoserifcjksc">构建每个测试用例，内部政策专家会撰写一份规格说明，描述一名合成</text><text x="413.00" y="229.73" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="229.73" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="439.40" y="229.73" font-size="11.00" class="sc-loraregular">”</text><text x="443.24" y="229.73" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策</text><text x="72.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">略。由一个</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="245.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="245.35" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="237.08 244.77 247.76 253.37 259.93 266.51 272.48 275.37 284.10 290.67 297.24 302.33 305.22 311.18 313.78" y="245.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="320.14" y="245.35" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后我们评</text><text x="72.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">估被测模型如何回应。我们报告的恰当回应率，是指模型在整段对话中始终表现恰当的对话所占</text><text x="72.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">比例。每段对话均依据其所属风险领域的专门评分细则评分，因此不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="308.51" y="110.31" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="308.51" y="110.31" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="149.00" y="125.93" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="149.00" y="125.93" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

jksc">发、部署和维护过程中实施稳健的儿童安全措施。任何服务未成年人的企业客户都必须遵守我们</text><text x="72.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="116.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="138.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外安全防护措施</text><text x="226.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="191.72" font-size="11.00" class="sc-notoserifcjksc">我们按照与其他近期发布的模型（如</text><text x="250.89 258.58 261.57 267.18 273.75 280.33 286.29 289.18 297.92 304.49 311.05 316.15 319.04 325.03 327.74" y="191.72" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="333.73" y="191.72" font-size="11.00" class="sc-notoserifcjksc">）相同的测试方案开展了儿童安全评估。</text><text x="72.00" y="488.98" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="488.98" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.66 100.76 106.29" y="488.98" font-size="9.00" class="sc-lorabold">4.2.A]</text><text x="112.13" y="488.98" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全单轮评估结果。</text><text x="211.13" y="488.98" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求和良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒绝</text><text x="72.00" y="500.68" font-size="9.00" class="sc-notoserifcjksc">率越低越好。</text><text x="126.00" y="500.68" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="144.00" y="500.68" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，先前模型的结果可能与</text><text x="72.00" y="512.38" font-size="9.00" class="sc-notoserifcjksc">以往系统卡中的结果存在差异。</text><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="101.96" width="46.87" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="534.00" y="117.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="72.00" y="133.20" widt ="11.00" class="sc-notoserifcjksc">上，并在使用</text><text x="251.86 257.71 260.71 266.32 272.88 279.46 285.42 288.13 293.80" y="411.01" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="299.79" y="411.01" font-size="11.00" class="sc-notoserifcjksc">系统提示词后有所改善。我们鼓励在</text><text x="478.68 485.57 492.18" y="411.01" font-size="11.00" class="sc-loraregular">API</text><text x="498.76" y="411.01" font-size="11.00" class="sc-notoserifcjksc">上进行</text><text x="72.00" y="426.63" font-size="11.00" class="sc-notoserifcjksc">部署的开发者采取类似的安全防护措施，以帮助缓解儿童安全风险。</text><text x="72.00" y="510.45" font-size="11.00" class="sc-notoserifcjksc">在测试</text><text x="107.89 114.13 120.57 127.24 133.92 139.80 144.06 146.95 152.95 155.65" y="510.45" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="164.54" y="510.45" font-size="11.00" class="sc-notoserifcjksc">是否愿意协助完成与儿童性虐待材料（</text><text x="351.54" y="510.45" font-size="11.00" class="sc-loraregular">CSAM</text><text x="382.45" y="510.45" font-size="11.00" class="sc-notoserifcjksc">）和未经同意的私密影像（</text><text x="514.45" y="510.45" font-size="11.00" class="sc-loraregular">non-</text><text x="72.00 77.80 84.23 90.91 96.00 101.96 108.64 113.73 120.30 125.98 128.97 131.86 134.95 141.53 145.79 148.88 158.71 164.31 168.57 174.53 177.42 180.52 190.35 196.03 202.05 208.02 212.97" y="526.07" font-size="11.00" class="sc-loraregular">consensual intimate imagery</text><text x="218.77" y="526.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="229.77 238.10 245.79 249.47" y="526.07" font-size="11.00" class="sc-loraregular">NCII</text><text x="253.16" y="526.07" font-size="11.00" class="sc-notoserifcjksc">）相关的技术任务的评估中，在涉及明显有害意图的任务</text><text x="72.00" y="541.69" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="94.00 100.24 106.67 113.35 120.03 125.91 130.17 133.06 139.06 141.76" y="541.69" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="150.65" y="541.69" font-size="11.00" class="sc-notoserifcjksc">的核心模型表现与</text><text x="241.54 247.78 254.21 260.89 267.57 273.45 277.71 280.60" y="541.69" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="289.49" y="541.69" font-size="11.00" class="sc-notoserifcjksc">大致相当。然而，在两用场景中出现了退步；例</text><text x="72.00" y="557.31" font-size="11.00" class="sc-notoserifcjksc">如，与上文提到的多轮测试类似，</text><text x="237.00 243.24 249.67 256.35 263.03 268.91 273.17 276.06 282.06 284.76" y="557.31" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="293.65" y="557.31" font-size="11.00" class="sc-notoserifcjksc">更倾向于对良性包装照单全收。我们鼓励基于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="572.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="572.93" font-size="11.00" class="sc-notoserifcjksc">进行开发的</text><text x="168.18 175.07 181.68" y="572.93" font-size="11.00" class="sc-loraregular">API</text><text x="188.26" y="572.93" font-size="11.00" class="sc-notoserifcjksc">开发者采取适当的安全防护措施，例如在其系统提示词中加入安全措辞，</text><text x="72.00" y="588.55" font-size="11.00" class="sc-notoserifcjksc">以尽量减少对可能涉及儿童安全风险的两用场景技术任务的协助。</text><a href="http://claude.ai" rel="noopener"><rect x="105.97" y="370.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="105.97" y="370.97" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="251.86" y="402.21" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="251.86" y="402.21" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

" font-size="11.00" class="sc-loraregular">0.45% (± 0.23%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="73.00" y="347.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="160.75" y="347.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="160.75" y="362.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="160.75 168.10 175.06" y="418.90" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="179.32" y="418.90" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="260.50" y="347.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="260.50" y="362.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="354.25" y="347.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="354.25" y="362.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="454.00" y="347.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="454.00" y="362.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="153.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="153.19" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗服务，也无意诊断或治疗任何疾病。每个</text><text x="432.18 439.87 442.87 448.48 455.04 461.62" y="153.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="470.48" y="153.19" font-size="11.00" class="sc-notoserifcjksc">模型都经过训</text><text x="72.00" y="168.81" font-size="11.00" class="sc-notoserifcjksc">练，能够识别痛苦情绪的表达（包括用户表达自杀或自伤念头），并以同理心和关怀作出回应，</text><text x="72.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">同时在适当时引导用户寻求真人支持，包括求助热线、心理健康专业人士或可信赖的亲友。</text><text x="72.00" y="250.34" font-size="11.00" class="sc-notoserifcjksc">本节的评估考察</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 196.42 202.86 209.53 216.21 222.10 226.35 229.25 235.24 237.95" y="250.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="246.83" y="250.34" font-size="11.00" class="sc-notoserifcjksc">在涉及自杀与自伤的对话中的回应。这些评估衡量模型能否</text><text x="72.00" y="265.96" font-size="11.00" class="sc-notoserifcjksc">对可能表明存在风险的提示词作出安全且支持性的回应，同时在同一领域的良性请求上保持有</text><text x="72.00" y="281.58" font-size="11.00" class="sc-notoserifcjksc">用。我们报告单轮无害回应率、单轮过度拒绝率以及多轮恰当回应率。</text><text x="72.00" y="596.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="596.17" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="596.17" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="596.17" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的单轮评估结果。</text><text x="235.12" y="596.17" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求和良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="607.87" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="607.87" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="180.00" y="607.87" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，先前模型的结</text><text x="72.00" y="619.57" font-size="9.00" class="sc-notoserifcjksc">果可能与以往系统卡中的结果存在差异。</text></svg></div>

.00 192.35 198.48 208.04 210.93 214.28 220.11 223.00 227.00 233.83 243.39" y="238.76" font-size="11.00" class="sc-loraregular">63% (± 10%)</text><text x="366.75 373.10 379.93 389.49 392.38 395.74 401.56 404.45 410.81 420.37" y="238.76" font-size="11.00" class="sc-loraregular">90% (± 6%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">39</text><text x="74.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="185.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="185.50 192.85 199.81" y="132.11" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="204.07" y="132.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="366.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="256.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="256.74" font-size="9.00" class="sc-lorabold">4.3.1.B]</text><text x="118.13" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的多轮评估结果。</text><text x="235.13" y="256.74" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="343.13" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="361.13" y="256.74" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以</text><text x="72.00" y="268.44" font-size="9.00" class="sc-notoserifcjksc">下划线标出。由于常规评估更新，先前模型的结果可能与以往系统卡中的结果存在差异。</text><text x="72.00" y="322.29" font-size="11.00" class="sc-notoserifcjksc">在我们的单轮自杀与自伤评估中，</text><text x="237.00 243.24 249.67 256.35 263.03 268.91 273.17 276.06 282.06 284.76" y="322.29" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="293.65" y="322.29" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="340.54 346.78 353.22 359.89 366.57 372.45 376.71 379.60" y="322.29" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="388.49" y="322.29" font-size="11.00" class="sc-notoserifcjksc">相当：对于可能助长自杀或自</text><text x="72.00" y="337.91" font-size="11.00" class="sc-notoserifcjksc">伤行为的请求，它保持了较高的无害回应率，并且很少过度拒绝类似主题的良性请求。在多轮评</text><text x="72.00" y="353.53" font-size="11.00" class="sc-notoserifcjksc">估中，</text><text x="105.00 111.24 117.67 124.35 131.03 136.91 141.17 144.06 150.06 152.76" y="353.53" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="161.65" y="353.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="175.54 182.43 189.04" y="353.53" font-size="11.00" class="sc-loraregular">API</text><text x="195.62" y="353.53" font-size="11.00" class="sc-notoserifcjksc">上的得分与</text><text x="253.51 259.75 266.18 272.86 279.54 285.42 289.68 292.57" y="353.53" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="301.46" y="353.53" font-size="11.00" class="sc-notoserifcjksc">相差在误差范围之内（</text><text x="411.46" y="353.53" font-size="11.00" class="sc-loraregular">60%</text><text x="437.11" y="353.53" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="451.01" y="353.53" font-size="11.00" class="sc-loraregular">63%</text><text x="473.06" y="353.53" font-size="11.00" class="sc-notoserifcjksc">），在</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="369.15" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93" y="369.15" font-size="11.00" class="sc-notoserifcjksc">上则更高（</text><text x="174.93" y="369.15" font-size="11.00" class="sc-loraregular">100%</text><text x="205.06" y="369.15" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="218.95" y="369.15" font-size="11.00" class="sc-loraregular">90%</text><text x="241.71" y="369.15" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="419.45" font-size="11.00" class="sc-notoserifcjksc">然而，在对</text><text x="129.89 136.78 143.39" y="419.45" font-size="11.00" class="sc-loraregular">API</text><text x="147.07" y="419.45" font-size="11.00" class="sc-notoserifcjksc">（无系统提示词）评估结果进行的定性审查中，内部政策专家认为它总体上略</text><text x="72.00" y="435.07" font-size="11.00" class="sc-notoserifcjksc">弱。例如，它更倾向于认同用户想死的结论，认为鉴于其处境这是可以理解的。它仍会认可自伤</text><text x="72.00" y="450.69" font-size="11.00" class="sc-notoserifcjksc">有效或有用，比率与</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95" y="450.69" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="221.84" y="450.69" font-size="11.00" class="sc-notoserifcjksc">相近。对可能有害的替代行为（例如手握冰块）的建议也以相近的</text><text x="72.00" y="466.31" font-size="11.00" class="sc-notoserifcjksc">比率持续出现。这些表述出现在总体上劝阻自杀与自伤、并引导用户求助于危机求助热线或其他</text><text x="72.00" y="481.93" font-size="11.00" class="sc-notoserifcjksc">真人支持的对话中，但无论上下文如何，我们都将其视为有待改进之处。</text><text x="72.00" y="581.37" font-size="11.00" class="sc-notoserifcjksc">审阅人员也发现了一些改进：</text><text x="215.00 221.24 227.67 234.35 241.03 246.91 251.17 254.06 260.06 262.76" y="581.37" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="271.65" y="581.37" font-size="11.00" class="sc-notoserifcjksc">的回应更贴合用户对自身经历的实际描述，而不是替用</text><text x="72.00" y="612.61" font-size="11.00" class="sc-notoserifcjksc">种行为仍持续存在。它的输出也比</text><text x="239.89 246.13 252.57 259.24 265.92 271.80 276.06 278.95" y="612.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="287.84" y="612.61" font-size="11.00" class="sc-notoserifcjksc">更短、更不冗长。</text><text x="72.00" y="678.52" font-size="11.00" class="sc-notoserifcjksc">在发布之前，我们在系统提示词中加入了针对上述较弱行为的措辞，并观察到其在</text><text x="470.89 476.74 479.74 485.35 491.91 498.49 504.45 507.16 512.84" y="678.52" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="518.82" y="678.52" font-size="11.00" class="sc-notoserifcjksc">上的</text><text x="72.00" y="694.14" font-size="11.00" class="sc-notoserifcjksc">表现显著改善。尽管</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95 218.95 221.65" y="694.14" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="230.54" y="694.14" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="244.44 250.29 253.28 258.89 265.46 272.04 278.00 280.70 286.38" y="694.14" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="292.36" y="694.14" font-size="11.00" class="sc-notoserifcjksc">上的多轮评估中得分为</text><text x="405.26" y="694.14" font-size="11.00" class="sc-loraregular">100%</text><text x="432.49" y="694.14" font-size="11.00" class="sc-notoserifcjksc">，我们仍在持续改进</text><text x="72.00" y="709.76" font-size="11.00" class="sc-notoserifcjksc">我们的</text><a href="http://claude.ai" rel="noopener"><rect x="508.95" y="344.73" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="360.35" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="470.89" y="669.72" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="470.89" y="669.72" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="244.44" y="685.34" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="244.44" y="685.34" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

469.08" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82 111.76 114.32" y="483.16" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="150.00 156.35 162.34 164.94 171.29 177.65 187.21 190.10 193.45 199.28 202.17 208.82 211.52 217.88 224.23 233.79" y="469.08" font-size="11.00" class="sc-loraregular">95.69% (± 0.96%)</text><text x="249.00" y="469.08" font-size="11.00" class="sc-lorabold">0%</text><text x="348.00 354.35 360.53 363.24 369.19 375.32 384.88 387.77 391.12 396.95 399.84 406.49 409.19 415.32 421.67 431.23" y="469.08" font-size="11.00" class="sc-loraregular">99.43% (± 0.36%)</text><text x="447.00" y="469.08" font-size="11.00" class="sc-lorabold">0%</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="508.49" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48 113.02 115.92" y="522.57" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="150.00 156.33 160.79 163.36 167.82 174.81 184.75 187.64 190.89 196.72 199.61 206.41 208.97 214.91 221.06 231.00" y="508.49" font-size="11.00" class="sc-lorabold">97.10% (± 0.53%)</text><text x="249.00 255.65 258.19 265.02 271.37 280.93 283.82 287.18 293.00 295.89 302.54 305.08 311.91 318.26 327.82" y="508.49" font-size="11.00" class="sc-loraregular">0.09% (± 0.06%)</text><text x="348.00 354.33 360.49 363.05 368.98 374.92 384.86 387.75 391.00 396.83 399.72 406.52 409.08 413.55 419.88 429.81" y="508.49" font-size="11.00" class="sc-lorabold">99.55% (± 0.19%)</text><text x="447.00 453.65 456.35 462.48 466.48 476.04 478.93 482.28 488.11 491.00 497.65 500.36 504.36 509.42 518.99" y="508.49" font-size="11.00" class="sc-loraregular">0.31% (± 0.17%)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">40</text><text x="75.25" y="290.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="290.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="149.50" y="306.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="149.50 156.85 163.81" y="362.37" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="168.07" y="362.37" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="248.50" y="290.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="248.50" y="306.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="347.50" y="290.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="347.50" y="306.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="446.50" y="290.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="446.50" y="306.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估，以确保其能够可靠地捕捉我们在该领域可能观察到的各类失误和不良行为。我们鼓励基于</text><text x="72.00 78.89 85.50" y="98.23" font-size="11.00" class="sc-loraregular">API</text><text x="92.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">进行开发的开发者采取类似的安全防护措施。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，考察</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="177.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="177.61" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是，它能否避免强化</text><text x="72.00" y="193.23" font-size="11.00" class="sc-notoserifcjksc">具有潜在风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们报告单</text><text x="72.00" y="208.85" font-size="11.00" class="sc-notoserifcjksc">轮无害回应率和过度拒绝率。对于该领域的多轮测试，我们继续通过内部政策专家的定性审查进</text><text x="72.00" y="224.47" font-size="11.00" class="sc-notoserifcjksc">行评估；我们将在下文讨论他们的观察结果。</text><text x="72.00" y="539.64" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.64" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="539.64" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="539.64" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮评估结果。</text><text x="227.27" y="539.64" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求和良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="551.34" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="551.34" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="180.00" y="551.34" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，先前模型的结</text><text x="72.00" y="563.04" font-size="9.00" class="sc-notoserifcjksc">果可能与以往系统卡中的结果存在差异。</text><text x="72.00" y="605.19" font-size="11.00" class="sc-notoserifcjksc">对于可能强化进食紊乱行为的单轮请求，</text><text x="270.00 276.24 282.67 289.35 296.03 301.91 306.17 309.06 315.06 317.76" y="605.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="326.65" y="605.19" font-size="11.00" class="sc-notoserifcjksc">保持了较高的无害回应率，不过在</text><text x="72.00 78.89 85.50" y="620.81" font-size="11.00" class="sc-loraregular">API</text><text x="89.18" y="620.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="100.18" y="620.81" font-size="11.00" class="sc-loraregular">95.29%</text><text x="139.97" y="620.81" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="153.86 159.96 164.54 167.25 171.25 178.08" y="620.81" font-size="11.00" class="sc-loraregular">97.10%</text><text x="187.65" y="620.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="212.55 218.40 221.39 227.00 233.57 240.15 246.11 248.81 254.49" y="620.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="257.58" y="620.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="268.58" y="620.81" font-size="11.00" class="sc-loraregular">98.90%</text><text x="309.48" y="620.81" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="323.37 329.73 335.91 338.62 344.61 350.61" y="620.81" font-size="11.00" class="sc-loraregular">99.55%</text><text x="360.18" y="620.81" font-size="11.00" class="sc-notoserifcjksc">）上均略低于</text><text x="429.07 435.31 441.74 448.42 455.10 460.98 465.24 468.13" y="620.81" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="474.13" y="620.81" font-size="11.00" class="sc-notoserifcjksc">。在我们的评</text><text x="72.00" y="636.43" font-size="11.00" class="sc-notoserifcjksc">估集中，</text><text x="116.00 122.24 128.67 135.35 142.03 147.91 152.17 155.06 161.06 163.76" y="636.43" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="172.65" y="636.43" font-size="11.00" class="sc-notoserifcjksc">没有拒绝任何涉及营养、进食障碍治疗与康复以及身体意象等主题的良性提</text><text x="72.00" y="652.05" font-size="11.00" class="sc-notoserifcjksc">示词。最显著的退步出现在用户意图模糊的提示词上：当用户的请求包装方式并非明显有害、但</text><text x="72.00" y="667.67" font-size="11.00" class="sc-notoserifcjksc">带有进食紊乱风险信号时，</text><text x="204.00 210.24 216.67 223.35 230.03 235.91 240.17 243.06 249.06 251.76" y="667.67" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="260.65" y="667.67" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="274.54 280.78 287.22 293.89 300.57 306.45 310.71 313.60" y="667.67" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="322.49" y="667.67" font-size="11.00" class="sc-notoserifcjksc">更</text><a href="http://claude.ai" rel="noopener"><rect x="212.55" y="612.01" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="212.55" y="612.01" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">愿意提供可能强化节食限制或对身体的扭曲认知的信息。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查发现了一些改进。</text><text x="270.00 276.24 282.67 289.35 296.03 301.91 306.17 309.06 315.06 317.76" y="131.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="326.65" y="131.19" font-size="11.00" class="sc-notoserifcjksc">较少将临床进食障碍归于未披露此类情况的</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">用户，并且在确实作出此类归因时更常加以限定。它也略少引入用户未提供、可能被当作目标的</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">数字，例如估算的每日热量需求或身体质量指数（</text><text x="314.00 320.74 330.84" y="162.43" font-size="11.00" class="sc-loraregular">BMI</text><text x="334.53" y="162.43" font-size="11.00" class="sc-notoserifcjksc">），尽管这种行为仍然常见，是需要持续</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">改进的方面。与自杀与自伤情境中一样，它的输出比</text><text x="327.89 334.13 340.57 347.24 353.92 359.80 364.06 366.95" y="178.05" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="375.84" y="178.05" font-size="11.00" class="sc-notoserifcjksc">更短、更不冗长。发布前进行的系</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">统提示词更新部分解决了</text><text x="195.89 201.74 204.74 210.35 216.91 223.49 229.45 232.16 237.84" y="193.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="243.82" y="193.67" font-size="11.00" class="sc-notoserifcjksc">上有待改进的方面。如上所述，我们鼓励基于</text><text x="466.71 473.60 480.21" y="193.67" font-size="11.00" class="sc-loraregular">API</text><text x="486.79" y="193.67" font-size="11.00" class="sc-notoserifcjksc">进行开发</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">的开发者采取类似措施。</text><text x="72.00" y="294.50" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">我们在与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.03 195.74" y="321.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="204.63" y="321.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.63" y="321.06" font-size="11.00" class="sc-notoserifcjksc">中所报告的同一组偏见与诚信基准测试上评估了</text><text x="471.52 479.21 482.20 487.81 494.38 500.96" y="321.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="336.68" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="125.76" y="336.68" font-size="11.00" class="sc-notoserifcjksc">。我们关注三个方面：我们开源的政治公允性衡量方法；衡量人口统计偏见的</text><text x="502.65 509.40 512.49 518.17" y="336.68" font-size="11.00" class="sc-loraregular">Bias</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15 130.06 132.95 136.61 143.05 147.81 150.71 159.46 166.03 171.99 177.08 181.34 184.43 190.87 197.54 200.44 207.32 214.00 219.09 227.77 233.73 238.50 241.59 248.26" y="352.30" font-size="11.00" class="sc-loraregular">Benchmark for Question Answering</text><text x="254.35" y="352.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="265.35 272.09 278.93" y="352.30" font-size="11.00" class="sc-loraregular">BBQ</text><text x="287.69" y="352.30" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。</text><text x="72.00" y="400.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="400.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="432.26" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 152.42 158.86 165.53 172.21 178.10 182.35 185.24 191.24 193.95" y="432.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="202.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="367.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="411.83" y="432.26" font-size="11.00" class="sc-notoserifcjksc">，其涵盖</text><text x="458.73 462.73 465.50 471.63 477.62" y="432.26" font-size="11.00" class="sc-loraregular">1,350</text><text x="487.36" y="432.26" font-size="11.00" class="sc-notoserifcjksc">个提示词</text><text x="72.00" y="447.88" font-size="11.00" class="sc-notoserifcjksc">对，这些提示词对跨越</text><text x="184.89" y="447.88" font-size="11.00" class="sc-loraregular">150</text><text x="204.62" y="447.88" font-size="11.00" class="sc-notoserifcjksc">个话题和九种任务类型，呈现对立的意识形态观点。</text><text x="457.62 465.30 468.30 473.91 480.47 487.05" y="447.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="495.91" y="447.88" font-size="11.00" class="sc-notoserifcjksc">评分模型</text><text x="72.00" y="463.50" font-size="11.00" class="sc-notoserifcjksc">从三个属性对模型的回应评分：公允性（模型是否以相当的深度和质量回应一对提示词中的两个</text><text x="72.00" y="479.12" font-size="11.00" class="sc-notoserifcjksc">提示词）、对立观点（模型的回应是否承认其他观点）以及拒绝（模型是否拒绝参与该请求）。</text><text x="72.00" y="555.60" font-size="11.00" class="sc-notoserifcjksc">我们同时报告无系统提示词的核心模型的结果，以及应用默认系统提示词的</text><text x="437.89 443.74 446.74 452.35 458.91 465.49 471.45 474.16 479.84" y="555.60" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="485.82" y="555.60" font-size="11.00" class="sc-notoserifcjksc">上的结果。</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="571.22" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93" y="571.22" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准措辞，指示</text><text x="309.82 317.51 320.50 326.11 332.68 339.26" y="571.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="348.11" y="571.22" font-size="11.00" class="sc-notoserifcjksc">在不同观点之间公允地进行回应；同时</text><text x="72.00" y="586.84" font-size="11.00" class="sc-notoserifcjksc">报告这两种配置，可以将模型的基线行为与</text><text x="283.89 289.74 292.74 298.35 304.91 311.49 317.45 320.16 325.84" y="586.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="331.82" y="586.84" font-size="11.00" class="sc-notoserifcjksc">上的消费者用户将会遇到的行为并列呈现。</text><a href="http://claude.ai" rel="noopener"><rect x="195.89" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="195.89" y="184.87" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="312.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="312.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="154.29" y="312.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="157.18" y="312.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="184.14" y="312.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="72.00" y="329.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="329.67" font-size="9.00" class="sc-lorabold">4.4.1.A]</text><text x="118.01" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：公允性。</text><text x="235.01" y="329.67" font-size="9.00" class="sc-notoserifcjksc">公允性分数越高越好。由于常规评估更新，先前模型的结果可能与以往系统</text><text x="72.00" y="341.38" font-size="9.00" class="sc-notoserifcjksc">卡中的结果存在差异。</text><text x="72.00" y="639.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="639.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="639.05" font-size="9.00" class="sc-lorabold">4.4.1.B]</text><text x="118.01" y="639.05" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：对立观点。</text><text x="244.01" y="639.05" font-size="9.00" class="sc-notoserifcjksc">对立观点分数越高越好。由于常规评估更新，先前模型的结果可能与以往</text><text x="72.00" y="650.75" font-size="9.00" class="sc-notoserifcjksc">系统卡中的结果存在差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="72.00 80.41 83.54 91.95 95.08 102.58 105.96 114.15 117.58 126.39 133.33 136.71 144.89 152.91 161.35 169.15 177.58 191.08 199.89 204.88 212.08 215.46 219.78 228.07 233.06 236.44 246.67 255.10 263.12 270.06 274.89 278.32 286.62 295.05 298.43 307.49 315.92 322.86 333.58 341.60 346.59 350.02 358.46" y="484.22" font-size="13.00" class="sc-poppinsmedium" fill="#666666">4.4.2 Bias Benchmark for Question Answering</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 83.84 89.00 93.32 97.65 100.46 105.09 111.08 113.61 116.24 122.49 124.95 127.48 130.11 135.46 139.33 141.96 147.11 149.83 152.29 154.92 157.97 163.34 169.47 174.84 178.48 181.53 183.99 186.62 192.75 198.96 206.92 209.42 212.05 218.31 220.93 226.92 232.08 238.15 244.13 249.01 254.83 260.80 263.61 266.33 270.19 272.82 278.64 281.45 286.61 291.24 293.87 299.68 305.10 311.17 316.49 322.47 331.41 336.57 340.86 346.22 348.85 352.18 358.03 362.36 364.99 370.75 376.71 382.13 386.76 390.63 393.44 399.28 405.35 407.98 413.14 419.21 423.83 431.72 437.14 441.47 444.28 450.34 455.87 458.33 460.96 466.12 469.83 476.31 479.12 484.17 486.67 492.04 495.68 499.31 505.36 507.67 513.88 519.50 523.13 528.91 534.48" y="704.46" font-size="10.00" class="sc-loraregular">Parrish, A., et al. (2021). BBQ: A hand-built bias benchmark for question answering. arXiv:2110.08193.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 186.95 190.59 196.64 198.95 205.16 210.77 214.41 220.19" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2110.08193</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="72.00" y="329.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="329.67" font-size="9.00" class="sc-lorabold">4.4.1.C]</text><text x="118.67" y="329.67" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估：拒绝。</text><text x="226.67" y="329.67" font-size="9.00" class="sc-notoserifcjksc">拒绝分数越低越好。由于常规评估更新，先前模型的结果可能与以往系统卡中</text><text x="72.00" y="341.38" font-size="9.00" class="sc-notoserifcjksc">的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="368.73" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="368.73" font-size="11.00" class="sc-notoserifcjksc">的公允性显著高于</text><text x="257.83 265.52 268.52 274.12 280.69 287.27 293.23 296.12 302.36 308.80 315.47 322.15 328.04 332.29 335.19" y="368.73" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="341.18" y="368.73" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="366.07 372.96 379.57" y="368.73" font-size="11.00" class="sc-loraregular">API</text><text x="386.15" y="368.73" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="422.04 428.14 432.72 435.43 441.79" y="368.73" font-size="11.00" class="sc-loraregular">97.9%</text><text x="451.36" y="368.73" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="476.25 482.10 485.09 490.70 497.27 503.85 509.81 512.52 518.19" y="368.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="524.18" y="368.73" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="384.35" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89 103.25 109.43 111.97 118.81" y="384.35" font-size="11.00" class="sc-loraregular">99.0%</text><text x="128.38" y="384.35" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="153.27 159.51 165.94 172.62 179.29 185.18 189.44 192.33" y="384.35" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="201.22" y="384.35" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="237.11" y="384.35" font-size="11.00" class="sc-loraregular">86.2%</text><text x="270.73" y="384.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="284.62 290.98 296.97 299.33 304.40" y="384.35" font-size="11.00" class="sc-loraregular">95.7%</text><text x="313.97" y="384.35" font-size="11.00" class="sc-notoserifcjksc">；同时它在这两个产品端上的拒绝频率都更</text><text x="72.00" y="399.97" font-size="11.00" class="sc-notoserifcjksc">低。它在</text><text x="118.89 125.78 132.39" y="399.97" font-size="11.00" class="sc-loraregular">API</text><text x="138.97" y="399.97" font-size="11.00" class="sc-notoserifcjksc">上承认对立观点的频率略低于</text><text x="284.86 291.10 297.53 304.21 310.89 316.77 321.03 323.92" y="399.97" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="329.92" y="399.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="340.92" y="399.97" font-size="11.00" class="sc-loraregular">41.4%</text><text x="372.01" y="399.97" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="385.91 391.87 397.86 400.22 405.29" y="399.97" font-size="11.00" class="sc-loraregular">45.7%</text><text x="414.86" y="399.97" font-size="11.00" class="sc-notoserifcjksc">），但在</text><text x="461.75 467.60 470.60 476.21 482.77 489.35 495.31 498.02 503.69" y="399.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="509.68" y="399.97" font-size="11.00" class="sc-notoserifcjksc">上则</text><text x="72.00" y="415.59" font-size="11.00" class="sc-notoserifcjksc">明显更高（</text><text x="127.00 133.36 140.01 142.72 148.63" y="415.59" font-size="11.00" class="sc-loraregular">60.2%</text><text x="161.09" y="415.59" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="174.98" y="415.59" font-size="11.00" class="sc-loraregular">52.9%</text><text x="205.52" y="415.59" font-size="11.00" class="sc-notoserifcjksc">），系统提示词中关于公允性的措辞在该产品端上产生的影响最大。</text><text x="72.00" y="512.31" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们使用</text><text x="206.89 213.65 216.74 222.41 227.51 230.40 237.24 243.20 249.88 255.73 262.32 272.16 277.83 282.55 288.46 291.35 295.01 301.45 306.21 309.11 317.86 324.43 330.39 335.48 339.74 342.83 349.27 355.94 358.84 365.72 372.40 377.49 386.17 392.13 396.90 399.99 406.66" y="512.31" font-size="11.00" class="sc-loraregular">Bias Benchmark for Question Answering</text><text x="412.75" y="512.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.75 430.49 437.33" y="512.31" font-size="11.00" class="sc-loraregular">BBQ</text><text x="446.09" y="512.31" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.09" y="508.64" font-size="6.60" class="sc-loraregular">2</text><text x="460.63" y="512.31" font-size="11.00" class="sc-notoserifcjksc">评估了</text><text x="496.53 504.21 507.21 512.82 519.38 525.96" y="512.31" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="527.93" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="125.76" y="527.93" font-size="11.00" class="sc-notoserifcjksc">。这是一项基于基准测试的标准偏见评估，涵盖年龄、种族、性别、残障和社会经济</text><text x="72.00" y="543.55" font-size="11.00" class="sc-notoserifcjksc">地位等属性。</text><text x="72.00 78.74 85.58" y="577.08" font-size="11.00" class="sc-loraregular">BBQ</text><text x="97.23" y="577.08" font-size="11.00" class="sc-notoserifcjksc">测试模糊问题（正确答案为</text><text x="229.23" y="577.08" font-size="11.00" class="sc-loraregular">“</text><text x="233.63" y="577.08" font-size="11.00" class="sc-notoserifcjksc">未知</text><text x="255.63" y="577.08" font-size="11.00" class="sc-loraregular">”</text><text x="259.47" y="577.08" font-size="11.00" class="sc-notoserifcjksc">）以及提供足以正确作答的上下文的消歧版本。我们报告</text><text x="72.00" y="592.70" font-size="11.00" class="sc-notoserifcjksc">两类问题各自的准确率，以及一个偏见分数，该分数反映模型的错误是否系统性地偏向（正值）</text><text x="72.00" y="608.32" font-size="11.00" class="sc-notoserifcjksc">或偏离（负值）社会刻板印象；分数越接近零，表示方向性偏见越小。</text><text x="72.00" y="674.23" font-size="11.00" class="sc-notoserifcjksc">以下是该评估中一个模糊问题的示例：</text><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="72.00" y="707.20" width="153.76" height="12.80" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="476.25" y="359.93" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="476.25" y="359.93" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="461.75" y="391.17" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="461.75" y="391.17" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
