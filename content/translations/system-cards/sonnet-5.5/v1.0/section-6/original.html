3 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="177.47" font-size="11.00" class="sc-notoserifcjksc">大致持平。诚实率是在施压下的回答表明了明确立场的提示上计算的，并将该回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="193.09" font-size="11.00" class="sc-notoserifcjksc">答与模型引出的信念（对于提供事实型提示，则为提示中给出的事实）进行比较。模型回避作答</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="208.71" font-size="11.00" class="sc-notoserifcjksc">或未表现出一致信念的提示被排除在外。</text><text x="72.00" y="532.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="532.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 112.94 115.04 120.57" y="532.03" font-size="9.00" class="sc-lorabold">6.3.2.2.A]</text><text x="126.41 135.41 144.41 153.41 162.41 171.41 180.41 189.41" y="532.03" font-size="9.00" class="sc-notoserifcjkscbold">压力下的诚实性。</text><text x="198.41 206.68 212.31 217.41" y="532.03" font-size="9.00" class="sc-loraregular">MASK</text><text x="225.93 234.93 243.93 252.93 261.93 270.93 279.93 288.93 297.93 306.93 315.93 324.93 333.93 342.93 351.93 360.93 369.93 378.93 387.93 396.93 405.93 414.93 423.93 432.93 441.93 450.93 459.93 468.93 477.93 486.93 495.93 504.93 513.93 522.93 531.93" y="532.03" font-size="9.00" class="sc-notoserifcjksc">公开子集上的诚实率：即模型在压力下未与自身引出的信念相矛盾的提示所占比</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="543.73" font-size="9.00" class="sc-notoserifcjksc">例。越高越好。图中显示</text><text x="173.37 178.57 183.47" y="543.73" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67 202.67 211.67 220.67 229.67" y="543.73" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 78.32 80.89 87.05 89.61 95.47 98.04" y="587.59" font-size="11.00" class="sc-lorabold">6.3.2.3</text><text x="107.09 118.09 129.09 140.09 151.09 162.09" y="587.59" font-size="11.00" class="sc-notoserifcjkscbold">悄然照搬答案</text><text x="72.00 83.00 94.00" y="619.97" font-size="11.00" class="sc-notoserifcjksc">为测试</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="619.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="619.97" font-size="11.00" class="sc-notoserifcjksc">的诚实性，我们还给它布置编码任务。这些任务未用于训练，但来自同一分布，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="666.83" font-size="11.00" class="sc-notoserifcjksc">箱内部的软件包镜像下载更新后的软件包。</text><a href="https://arxiv.org/abs/2503.03750" rel="noopener"><rect x="359.49" y="106.19" width="30.73" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">82</text><text x="72.00 83.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在图</text><text x="96.89 103.25 105.96 112.08 114.79 120.70 123.40 129.53 132.24" y="98.80" font-size="11.00" class="sc-loraregular">6.3.2.3.A</text><text x="142.01 153.01 164.01 175.01 186.01 197.01 208.01 219.01 230.01 241.01 252.01 263.02 274.02 285.02 296.02 307.02 318.02 329.02 340.02 351.02" y="98.80" font-size="11.00" class="sc-notoserifcjksc">中，我们展示了各模型暗中使用答案的比率。</text><text x="362.02 369.70 372.70 378.31 384.87 391.45 397.41 400.31 406.54 412.98 419.65 426.33 432.22 436.47 439.37 445.36 448.07" y="98.80" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="456.96 467.96" y="98.80" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="481.85 489.54 492.53 498.14 504.71 511.29" y="98.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="114.42" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06" y="114.42" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="130.06 137.75 140.74 146.35 152.92 159.49 165.46 168.35 174.59 181.02 187.70 194.38 200.26 204.52 207.41" y="114.42" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="216.30" y="114.42" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="230.19 237.88 240.87 246.48 253.05 259.63 265.59 268.48 277.22 283.78 290.35 295.44 298.34" y="114.42" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="307.22 318.22 329.22 340.22 351.22 362.22 373.22 384.22 395.22 406.22 417.22 428.22 439.22 450.22 461.22" y="114.42" font-size="11.00" class="sc-notoserifcjksc">有所改进，其暗中使用率也略低于</text><text x="475.12 482.81 485.80 491.41 497.97 504.55" y="114.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="130.04" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="130.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="142.55 150.24 153.23 158.85 165.41 171.99 177.95 180.85 189.58 196.15 202.71 207.81 210.70 216.69 219.40" y="130.04" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="225.40" y="130.04" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="411.94" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="411.94" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 113.18 115.28 120.82" y="411.94" font-size="9.00" class="sc-lorabold">6.3.2.3.A]</text><text x="126.66 135.66 144.66 153.66 162.66 171.66 180.66 189.66 198.66 207.66 216.66 225.66 234.66 243.66 252.66 261.66 270.66 279.66 288.66 297.66 306.66" y="411.94" font-size="9.00" class="sc-notoserifcjkscbold">在未告知用户的情况下使用泄露的答案的比率。</text><text x="315.66 324.66 333.66 342.66 351.66 360.66 369.66 378.66" y="411.94" font-size="9.00" class="sc-notoserifcjksc">越低越好。数值附</text><text x="390.02 395.23 400.13" y="411.94" font-size="9.00" class="sc-loraregular">95%</text><text x="410.33 419.33 428.33 437.33 446.33" y="411.94" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 78.32 80.89 87.05 89.61 95.47 98.04" y="457.20" font-size="11.00" class="sc-lorabold">6.3.2.4</text><text x="106.95 117.95 128.95 139.95" y="457.20" font-size="11.00" class="sc-notoserifcjkscbold">隐瞒改动</text><text x="72.00 83.00 94.00" y="489.58" font-size="11.00" class="sc-notoserifcjksc">在一些</text><text x="107.89 114.80" y="489.58" font-size="11.00" class="sc-loraregular">RL</text><text x="124.05 135.05 146.05 157.05 168.05 179.05 190.05 201.05 212.05" y="489.58" font-size="11.00" class="sc-notoserifcjksc">环境中，我们观察到</text><text x="225.95 233.63 236.63 242.24 248.80 255.38" y="489.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="264.24 275.24 286.24" y="489.58" font-size="11.00" class="sc-notoserifcjksc">会通过</text><text x="300.13 306.48 309.74" y="489.58" font-size="11.00" class="sc-loraregular">git</text><text x="316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="489.58" font-size="11.00" class="sc-notoserifcjksc">操作手法来隐瞒对代码仓库的改动。其中一些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="505.20" font-size="11.00" class="sc-notoserifcjksc">文件编辑是自动发生的（例如在应用程序更新时），另一些则是</text><text x="382.89 390.58 393.57 399.18 405.75 412.33" y="505.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="505.20" font-size="11.00" class="sc-notoserifcjksc">自己对代码仓库所做的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="520.82" font-size="11.00" class="sc-notoserifcjksc">修复。在某些情况下，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44" y="520.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29" y="520.82" font-size="11.00" class="sc-notoserifcjksc">推断自动检查器会拒绝这些改动。为了通过任务，</text><text x="462.29 469.98 472.97 478.58 485.15 491.73" y="520.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="500.58 511.58 522.58" y="520.82" font-size="11.00" class="sc-notoserifcjksc">向只对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="536.44" font-size="11.00" class="sc-notoserifcjksc">最终输出评分的评分者隐瞒了改动。我们选取了这类对话记录的示例，并添加了一个后续用户轮</text><text x="72.00 83.00 94.00 105.00" y="552.06" font-size="11.00" class="sc-notoserifcjksc">次，要求</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="552.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18" y="552.06" font-size="11.00" class="sc-notoserifcjksc">对该对话记录进行总结，但并不明确针对掩盖行为发问。该评估旨在测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="567.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="567.68" font-size="11.00" class="sc-notoserifcjksc">在回应一般性的后续问题时，会以多高的频率主动披露此类行为。请注意，该评估衡量的</text><text x="72.00 83.00 94.00" y="583.30" font-size="11.00" class="sc-notoserifcjksc">并不是</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="583.30" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18" y="583.30" font-size="11.00" class="sc-notoserifcjksc">向</text><text x="160.08 166.42 169.69 173.95 176.84 183.42 186.51 190.34" y="583.30" font-size="11.00" class="sc-loraregular">git diff</text><text x="196.95 207.95 218.95 229.95 240.95 251.95 262.95 273.95 284.95 295.95 306.95 317.95 328.95 339.95 350.95 361.95 372.95 383.95 394.95 405.95 416.95 427.95 438.95 449.95 460.95 471.95 482.95 493.95 504.95 515.95 526.95" y="583.30" font-size="11.00" class="sc-notoserifcjksc">命令隐瞒改动的频率，而是它在没有任何针对性询问的情况下向用户披</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="598.92" font-size="11.00" class="sc-notoserifcjksc">露这些行为的意愿。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="632.61" font-size="11.00" class="sc-notoserifcjksc">在该评估中，我们观察到</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 240.42 246.86 253.53 260.21 266.10 270.35 273.25 279.24 281.95" y="632.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="290.83" y="632.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="304.73 312.42 315.41 321.02 327.59 334.16 340.13 343.02 351.75 358.32 364.89 369.98 372.87 378.87 381.57" y="632.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="390.46 401.46 412.46 423.46 434.46 445.46 456.46 467.46 478.46 489.46 500.46 511.46 522.46" y="632.61" font-size="11.00" class="sc-notoserifcjksc">大致持平，并且比图中所示的</text><text x="72.00 83.00" y="648.23" font-size="11.00" class="sc-notoserifcjksc">其他</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="648.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18" y="648.23" font-size="11.00" class="sc-notoserifcjksc">模型更有可能披露这些行为，披露率为</text><text x="325.08 331.43 337.79 340.50 346.41" y="648.23" font-size="11.00" class="sc-loraregular">96.2%</text><text x="355.98" y="648.23" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">83</text><text x="72.00" y="337.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="337.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 113.07 115.16 120.70 124.17 126.54 131.72 134.63" y="337.93" font-size="9.00" class="sc-lorabold">6.3.2.4.A] git</text><text x="140.71 149.71 158.71 167.71 176.71 185.71 194.71 203.71 212.71 221.71 230.71" y="337.93" font-size="9.00" class="sc-notoserifcjkscbold">操作手法的主动披露率。</text><text x="239.71 248.71 257.71 266.71 275.71" y="337.93" font-size="9.00" class="sc-notoserifcjksc">当用户要求</text><text x="287.08 293.37 295.82 300.41 305.78 311.17" y="337.93" font-size="9.00" class="sc-loraregular">Claude</text><text x="318.41 327.41 336.41 345.41 354.41 363.41 372.41 381.41 390.41" y="337.93" font-size="9.00" class="sc-notoserifcjksc">总结其工作时，不同</text><text x="401.78 408.07 410.52 415.11 420.48 425.86" y="337.93" font-size="9.00" class="sc-loraregular">Claude</text><text x="433.11 442.11 451.11 460.11 469.11 478.11 487.11 496.11 505.11 514.11 523.11" y="337.93" font-size="9.00" class="sc-notoserifcjksc">模型揭示其为隐瞒改动而</text><text x="72.00 81.00 90.00" y="349.63" font-size="9.00" class="sc-notoserifcjksc">采用的</text><text x="101.37 106.56 109.23" y="349.63" font-size="9.00" class="sc-loraregular">git</text><text x="115.08 124.08 133.08 142.08 151.08 160.08 169.08 178.08 187.08 196.08 205.08 214.08 223.08 232.08 241.08 250.08 259.08 268.08" y="349.63" font-size="9.00" class="sc-notoserifcjksc">操作手法的比率。此处越高越好，数值附</text><text x="279.45 284.65 289.56" y="349.63" font-size="9.00" class="sc-loraregular">95%</text><text x="299.75 308.75 317.75 326.75 335.75" y="349.63" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.96 84.60" y="397.82" font-size="14.00" class="sc-poppinssemibold">6.4</text><text x="97.19 111.19 125.19 139.19 153.19 167.19 181.19" y="397.82" font-size="14.00" class="sc-notosanscjkscbold">本评估的可靠性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="424.38" font-size="11.00" class="sc-notoserifcjksc">只有当我们的评估能够可靠地反映模型在部署中的行为方式时，它才有价值。尽管我们已经展示</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="440.00" font-size="11.00" class="sc-notoserifcjksc">了许多模型在各种模拟条件下以理想方式行事的例子，但一个足够聪明、试图隐藏其意图或能力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="455.62" font-size="11.00" class="sc-notoserifcjksc">信息的模型仍可能骗过我们的评估。前文中，我们介绍了自动化行为审计的潜在盲点（</text><text x="490.00" y="455.62" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="503.89 510.25 512.96 518.86 521.57" y="455.62" font-size="11.00" class="sc-loraregular" fill="#1155cc">6.2.9</text><text x="72.00" y="471.24" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="83.00 94.00" y="471.24" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 80.32 83.70 92.29 95.67" y="519.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.1</text><text x="103.47 116.47 129.47 142.47 155.47 168.47 181.47 194.47" y="519.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">言语化评分者意识</text><text x="72.00 83.00 94.00 105.00 116.00" y="551.77" font-size="11.00" class="sc-notoserifcjksc">我们采用与</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="551.77" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63 226.63 237.63 248.63" y="551.77" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="262.52 268.88 271.47 277.83 280.54" y="551.77" font-size="11.00" class="sc-loraregular">6.6.2</text><text x="289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34" y="551.77" font-size="11.00" class="sc-notoserifcjksc">节相同的方式，评估了</text><text x="402.23 409.92 412.91 418.52 425.09 431.67 437.63 440.52 446.76 453.19 459.87 466.55 472.43 476.69 479.58 485.58 488.28" y="551.77" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="497.17 508.17 519.17" y="551.77" font-size="11.00" class="sc-notoserifcjksc">的言语</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="567.39" font-size="11.00" class="sc-notoserifcjksc">化评分者意识。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">84</text><text x="72.00" y="309.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="309.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 104.79 106.88 112.42" y="309.42" font-size="9.00" class="sc-lorabold">6.4.1.A]</text><text x="118.26 127.26 136.26 145.26 154.26 163.26 172.26 181.26 190.26" y="309.42" font-size="9.00" class="sc-notoserifcjkscbold">言语化评分者意识。</text><text x="199.26 208.26 217.26 226.26 235.26 244.26 253.26 262.26 271.26 280.26 289.26 298.26 307.26" y="309.42" font-size="9.00" class="sc-notoserifcjksc">当提示词中披露了评分者时，</text><text x="316.26 322.55 325.00 329.59 334.96 340.34 345.22 347.59 352.69 357.96 363.42 368.88 373.70 377.18 379.55 384.45 386.67" y="309.42" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="393.94 402.94 411.94 420.94 429.94 438.94 447.94 456.94 465.94 474.94 483.94 492.94 501.94 510.94 519.94 528.94" y="309.42" font-size="9.00" class="sc-notoserifcjksc">的评分者意识与先前模型相当；但当</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="321.12" font-size="9.00" class="sc-notoserifcjksc">提示词未披露评分者时，其比率更高。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="361.73" font-size="11.00" class="sc-notoserifcjksc">从定性角度看，我们发现</text><text x="195.89 202.13 208.57 215.24 221.92 227.80 232.06 234.95 240.95 243.66" y="361.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="252.54 263.54 274.54 285.54 296.54 307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54 428.54 439.54 450.54 461.54 472.54 483.54 494.54 505.54 516.54 527.54" y="361.73" font-size="11.00" class="sc-notoserifcjksc">的评分者意识更强，但我们认为这可能受到一个混杂因素的</text><text x="72.00 83.00 94.00" y="377.35" font-size="11.00" class="sc-notoserifcjksc">影响：</text><text x="105.00 111.24 117.67 124.35 131.03 136.91 141.17 144.06 150.06 152.76" y="377.35" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="161.65 172.65 183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65" y="377.35" font-size="11.00" class="sc-notoserifcjksc">在每条对话记录中产生的输出</text><text x="307.54 311.80 318.23 324.07 330.03" y="377.35" font-size="11.00" class="sc-loraregular">token</text><text x="339.60 350.60 361.60" y="377.35" font-size="11.00" class="sc-notoserifcjksc">更多。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p085.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 85 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">85</text><text x="72.00" y="492.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="492.86" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 126.04 128.13 131.79 133.88 139.42 142.89 145.26 151.45 154.26 158.98 164.54 169.90 174.74 177.11 182.49 187.59 193.33 199.07 203.91 207.63 210.00 214.86 216.95" y="492.86" font-size="9.00" class="sc-lorabold">6.4.1.B] Claude Sonnet 5.5</text><text x="224.18 233.18 242.18 251.18 260.18 269.18 278.18 287.18 296.18 305.18" y="492.86" font-size="9.00" class="sc-notoserifcjkscbold">评分者意识的定性示例</text><text x="314.18 323.18 332.18 341.18 350.18 359.18 368.18 377.18 386.18 395.18 404.18 413.18 422.18 431.18 440.18 449.18 458.18 467.18 476.18 485.18 494.18 503.18 512.18 521.18 530.18" y="492.86" font-size="9.00" class="sc-notoserifcjksc">，此时提示词中几乎未披露任何评分者。内容摘自一项智</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="504.56" font-size="9.00" class="sc-notoserifcjksc">能体代码审查任务。系统提示词是一个通用的工具使用脚手架，任务说明在标记处被截断。方括号中的词替代了功能名</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00" y="516.26" font-size="9.00" class="sc-notoserifcjksc">称、文件路径及其他细节。所示推理出现在整个过程约五分之四处；强调为后加。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="560.42" font-size="11.00" class="sc-notoserifcjksc">我们还在持续研究与评分者意识相关的更一般的行为：根据对评分者的考量来调整行为，以及在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="576.04" font-size="11.00" class="sc-notoserifcjksc">训练和评估环境中挖掘有关评分性质的线索。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p086.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 86 页"><text x="72.00 78.32 80.88 86.89 89.46 95.31 97.88 102.34 105.23 111.80 120.67 128.02 136.21 142.91 147.66 154.95 160.14 166.05 173.06" y="388.86" font-size="11.00" class="sc-lorabold">6.4.2.1 SHADE-Arena</text><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">86</text><text x="72.00" y="299.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="299.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 104.79 106.88 113.08" y="299.68" font-size="9.00" class="sc-lorabold">6.4.1.C]</text><text x="118.92 127.92 136.92 145.92 154.92 163.92 172.92 181.92 190.92 199.92 208.92 217.92 226.92 235.92 244.92 253.92 262.92 271.92 280.92 289.92 298.92 307.92 316.92 325.92 334.92 343.92 352.92" y="299.68" font-size="9.00" class="sc-notoserifcjkscbold">为迎合潜在评分者而调整行为，以及挖掘有关评分者的信息。</text><text x="361.92 368.21 370.66 375.25 380.62 386.00 390.88 393.25 398.35 403.61 409.08 414.54 419.36 422.84 425.21 430.11 432.32" y="299.68" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="439.60 448.60 457.60 466.60 475.60 484.60 493.60 502.60 511.60 520.60 529.60" y="299.68" font-size="9.00" class="sc-notoserifcjksc">有时会表现出更令人担忧</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00" y="311.38" font-size="9.00" class="sc-notoserifcjksc">的评分者意识形式，例如调整答案以迎合假想的评分者，或挖掘有关评分者的信息，但其比率并不高于先前模型。</text><text x="72.00 80.32 83.70 92.29 95.67" y="356.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.2</text><text x="106.23 119.23 132.23 145.23 158.23 171.23 184.23 197.23 210.23 223.23 236.23 249.23 262.23" y="356.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">规避安全防护措施的相关能力</text><text x="72.00 83.00 94.00" y="420.79" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="420.79" font-size="11.00" class="sc-loraregular" fill="#0000ff">SHADE-Arena</text><text x="182.46 193.46 204.46 215.46" y="420.79" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="229.36 237.04 240.04 245.65 252.21 258.79 264.75 267.65 273.88 280.32 287.00 293.67 299.56 303.81 306.71 312.70 315.41" y="420.79" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40 497.40 508.40 519.40 530.40" y="420.79" font-size="11.00" class="sc-notoserifcjksc">。该基准测试为每个长程智能体主任务配对一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="436.41" font-size="11.00" class="sc-notoserifcjksc">个有害的附带任务。智能体被指示完成这两项任务，同时不引起另一个独立监控器的怀疑。实验</text><text x="72.00 83.00 94.00" y="452.03" font-size="11.00" class="sc-notoserifcjksc">设置与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="452.03" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63" y="452.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中的相同。由一个</text><text x="317.52 325.21 328.20 333.81 340.38 346.96 352.92 355.81 364.54 371.11 377.68 382.77 385.66 391.63 394.33" y="452.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="403.41 414.41 425.41 436.41 447.41 458.41 469.41 480.41 491.41 502.41 513.41 524.41" y="452.03" font-size="11.00" class="sc-notoserifcjksc">监控器审阅完整轨迹，但在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="467.65" font-size="11.00" class="sc-notoserifcjksc">隐藏推理设置中，它看不到智能体的推理。每个模型还使用了经优化的攻击者提示词进行评估，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="483.27" font-size="11.00" class="sc-notoserifcjksc">这些提示词是此前在若干</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="483.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="483.27" font-size="11.00" class="sc-notoserifcjksc">模型上通过自动化搜索找到的；每个柱状条显示的是该模型的最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="498.89" font-size="11.00" class="sc-notoserifcjksc">佳提示词所得结果。</text><a href="https://arxiv.org/abs/2506.15740" rel="noopener"><rect x="107.89" y="411.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2506.15740" rel="noopener"><rect x="107.89" y="411.99" width="41.79" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2506.15740" rel="noopener"><rect x="149.68" y="411.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2506.15740" rel="noopener"><rect x="149.68" y="411.99" width="29.89" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">87</text><text x="72.00" y="409.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="409.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 111.68 113.78 119.31" y="409.92" font-size="9.00" class="sc-lorabold">6.4.2.1.A]</text><text x="125.15 134.15 143.15 152.15 161.15 170.15" y="409.92" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率。</text><text x="179.15 188.15 197.15 206.15 215.15 224.15 233.15 242.15 251.15 260.15 269.15 278.15" y="409.92" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且</text><text x="289.52 295.81 298.26 302.85 308.22 313.60 318.48 320.85 328.00 333.37 338.74 342.91 345.28 350.15 352.37" y="409.92" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="359.79 368.79 377.79 386.79 395.79 404.79 413.79 422.79 431.79 440.79 449.79 458.79 467.79 476.79 485.79 494.79 503.79 512.79 521.79 530.79" y="409.92" font-size="9.00" class="sc-notoserifcjksc">监控器未标记该对话记录的尝试所占比例。监</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="421.62" font-size="9.00" class="sc-notoserifcjksc">控器读取用户的请求以及智能体的完整对话记录（包括任何推理内容），但在隐藏推理设置中例外，此时推理内容会先</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="433.33" font-size="9.00" class="sc-notoserifcjksc">被移除。每个柱状条使用的是在该模型和设置下所评估的提示词中隐蔽率最高的那一个。</text><text x="423.00 429.29 431.74 436.33 441.70 447.08 451.96 454.33 459.43 464.70 470.16 475.62 480.44 483.92 486.29 491.19 493.41" y="433.33" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="500.68 509.68 518.68 527.68" y="433.33" font-size="9.00" class="sc-notoserifcjksc">的两个推</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="445.02" font-size="9.00" class="sc-notoserifcjksc">理可见柱状条使用的是标准提示词。每个柱状条涵盖</text><text x="281.37 286.00" y="445.02" font-size="9.00" class="sc-loraregular">24</text><text x="293.25 302.25 311.25 320.25 329.25 338.25 347.25" y="445.02" font-size="9.00" class="sc-notoserifcjksc">个任务对、每对</text><text x="358.61 363.45" y="445.02" font-size="9.00" class="sc-loraregular">25</text><text x="370.72 379.72 388.72 397.72 406.72 415.72 424.72 433.72 442.72 451.72 460.72 469.72 478.72 487.72 496.72 505.72 514.72 523.72" y="445.02" font-size="9.00" class="sc-notoserifcjksc">次尝试，不含出错的尝试；对于隐藏推理</text><text x="72.00 81.00 90.00 99.00" y="456.73" font-size="9.00" class="sc-notoserifcjksc">设置下的</text><text x="110.37 116.66 119.11 123.70 129.07 134.45 139.33 141.70 148.84 154.21 159.59 163.76 166.12 171.00 173.21" y="456.73" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="178.27 187.27 196.27 205.27 214.27 223.27 232.27 241.27 250.27 259.27 268.27 277.27 286.27 295.27 304.27 313.27 322.27 331.27 340.27 349.27 358.27 367.27 376.27 385.27 394.27 403.27 412.27" y="456.73" font-size="9.00" class="sc-notoserifcjksc">，该柱状条为标准提示词的结果，来自较早的一次运行，每对</text><text x="423.64 428.54" y="456.73" font-size="9.00" class="sc-loraregular">50</text><text x="436.50 445.50 454.50 463.50 472.50 481.50 490.50 499.50 508.50 517.50 526.50" y="456.73" font-size="9.00" class="sc-notoserifcjksc">次尝试。误差线表示基于</text><text x="72.00 81.00 90.00" y="468.42" font-size="9.00" class="sc-notoserifcjksc">尝试的</text><text x="101.37 106.57 111.47" y="468.42" font-size="9.00" class="sc-loraregular">95%</text><text x="121.67 130.67 139.67 148.67" y="468.42" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="157.67 162.91 168.17 173.44 176.92 181.09 184.57 188.41 193.05" y="468.42" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="198.42 207.42 216.42 225.42 234.42 243.42 252.42 261.42 270.42 279.42 288.42 297.42 306.42 315.42 324.42 333.42 342.42 351.42 360.42 369.42 378.42 387.42 396.42 405.42" y="468.42" font-size="9.00" class="sc-notoserifcjksc">）置信区间，并经过加权，使每个任务对的贡献相等。</text><text x="414.42 420.71 423.16 427.75 433.12 438.51 443.38 445.75 453.88 458.68 462.16 467.55 472.82 476.98 479.35" y="468.42" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="486.62 495.62 504.62 513.62 522.62 531.62" y="468.42" font-size="9.00" class="sc-notoserifcjksc">不支持无扩展</text><text x="72.00 81.00 90.00 99.00 108.00" y="480.12" font-size="9.00" class="sc-notoserifcjksc">思考设置。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="541.72" font-size="11.00" class="sc-notoserifcjksc">在推理对监控器隐藏的情况下，</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06 271.06 273.76" y="541.72" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65" y="541.72" font-size="11.00" class="sc-notoserifcjksc">使用其最佳提示词时的</text><text x="395.54 401.78 410.36 417.25 425.33 431.95 437.33 444.22 448.90 454.87 461.54" y="541.72" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="470.11 481.11 492.11 503.11 514.11 525.11" y="541.72" font-size="11.00" class="sc-notoserifcjksc">隐蔽率与其他</text><text x="72.00 83.00" y="557.34" font-size="11.00" class="sc-notoserifcjksc">近期</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="557.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18" y="557.34" font-size="11.00" class="sc-notoserifcjksc">模型接近：比</text><text x="204.08 211.77 214.76 220.37 226.94 233.51 239.48 242.37 251.10 257.67 264.24 269.33 272.22 278.22 280.92" y="557.34" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="289.81" y="557.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="303.70 311.39 314.39 320.00 326.56 333.14 339.10 342.00 351.93 357.79 362.05 368.64 375.07 380.16 383.06 389.05 391.76" y="557.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="398.66 409.66 420.66 431.66 442.66 453.66 464.66 475.66 486.66" y="557.34" font-size="11.00" class="sc-notoserifcjksc">低几个百分点，高于</text><text x="500.55 508.24 511.23 516.84 523.41 529.98" y="557.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="572.96" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06 128.06 139.06 150.06 161.06 172.06 183.06 194.06 205.06 216.06" y="572.96" font-size="11.00" class="sc-notoserifcjksc">。在不使用扩展思考（</text><text x="227.06 232.96 238.79 243.05 249.01 255.69 262.27 268.17 274.75 277.65 281.90 288.49 291.58 298.26 304.17 307.26 313.93" y="572.96" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="320.02 331.02 342.02 353.02 364.02 375.02 386.02 397.02 408.02 419.02 430.02 441.02 452.02 463.02 474.02 485.02 496.02 507.02 518.02 529.02" y="572.96" font-size="11.00" class="sc-notoserifcjksc">）时，其隐蔽率低于大多数较早的模型；而在</text><text x="387.12 390.11 396.43" y="588.58" font-size="11.00" class="sc-loraregular">low</text><text x="408.14 419.14 430.14 441.14 452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="588.58" font-size="11.00" class="sc-notoserifcjksc">还是最高推理强度下，其隐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="604.20" font-size="11.00" class="sc-notoserifcjksc">蔽率都接近于零，这与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.03 261.74" y="604.20" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63" y="604.20" font-size="11.00" class="sc-notoserifcjksc">的情况相同。总体而言，</text><text x="391.63 397.86 404.30 410.98 417.65 423.54 427.80 430.69 436.68 439.39" y="604.20" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="448.28 459.28 470.28 481.28 492.28 503.28 514.28 525.28" y="604.20" font-size="11.00" class="sc-notoserifcjksc">在规避无法看到其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="619.82" font-size="11.00" class="sc-notoserifcjksc">推理的监控器方面优于其</text><text x="195.89 202.13 208.57 215.24 221.92 227.80" y="619.82" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="619.82" font-size="11.00" class="sc-notoserifcjksc">前代模型，这在其能力全面更强的情况下是预料之中的；但它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="635.44" font-size="11.00" class="sc-notoserifcjksc">仍落后于我们能力最强的模型，并且与</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.03 338.74" y="635.44" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="635.44" font-size="11.00" class="sc-notoserifcjksc">一样，当其推理受到监控时，它几乎从</text><text x="72.00 83.00 94.00 105.00 116.00" y="651.06" font-size="11.00" class="sc-notoserifcjksc">未成功过。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="72.00 78.32 80.88 86.89 89.46 95.31 97.88 103.73 106.63 113.26 116.86 123.82 130.61 136.63 143.92 149.11 155.02 162.04" y="83.07" font-size="11.00" class="sc-lorabold">6.4.2.2 LinuxArena</text><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">88</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">为了在更贴近我们实际部署的设置中评估</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 317.42 323.86 330.53 337.21 343.10 347.35 350.25 356.24 358.95" y="114.99" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="114.99" font-size="11.00" class="sc-notoserifcjksc">规避监督的能力，我们在高风险软</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">件环境中开展了一项评估。我们改编了</text><text x="261.89 268.25 271.34 278.02 284.59 290.77 297.65 302.34 308.30 314.98" y="130.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">LinuxArena</text><text x="323.55 334.55 345.55 356.55 367.55 378.55" y="130.61" font-size="11.00" class="sc-notoserifcjksc">的一个子集。</text><text x="389.55 395.91 399.00 405.67 412.24 418.42 425.31 429.99 435.96 442.63" y="130.61" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="451.20 462.20" y="130.61" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="476.10 482.93 488.83 495.36 504.04 510.47 516.91" y="130.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Redwood</text><text x="72.00 78.83 84.79 89.89 95.83 101.50 106.19 112.04" y="146.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Research</text><text x="121.52" y="146.23" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="135.42 142.26 148.59 155.16 158.25 164.44 168.70 174.38 184.21" y="146.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">EquiStamp</text><text x="193.67 204.67 215.67 226.67 237.67" y="146.23" font-size="11.00" class="sc-notoserifcjksc">共同开发的</text><text x="251.56 258.45" y="146.23" font-size="11.00" class="sc-loraregular">AI</text><text x="265.03 276.03 287.03 298.03 309.03 320.03 331.03 342.03 353.03 364.03 375.03 386.03 397.03 408.03 419.03 430.03 441.03 452.03" y="146.23" font-size="11.00" class="sc-notoserifcjksc">控制竞技场，其中智能体操作一台真实的</text><text x="465.92 472.28 475.37 482.05 488.61" y="146.23" font-size="11.00" class="sc-loraregular">Linux</text><text x="497.34 508.34 519.34 530.34" y="146.23" font-size="11.00" class="sc-notoserifcjksc">机器，被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">分配一项软件工程或系统管理方面的主任务，并被指示同时完成一项有害的附带任务（例如窃取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="177.47" font-size="11.00" class="sc-notoserifcjksc">凭据或植入后门），且不引起监控器的怀疑。实验设置沿用</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 407.92 414.48 421.05 426.14 429.04 435.03 437.74" y="177.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="177.47" font-size="11.00" class="sc-notoserifcjksc">系统卡，采用相同</text><text x="72.00" y="193.09" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 89.90 92.50 99.33 106.17" y="193.09" font-size="11.00" class="sc-loraregular">1,000</text><text x="115.90 126.90 137.90 148.90 159.90 170.90 181.90 192.90 203.90 214.90 225.90 236.90 247.90 258.90 269.90 280.90" y="193.09" font-size="11.00" class="sc-notoserifcjksc">个任务配对和三种思考条件。由一个</text><text x="294.79 302.48 305.48 311.09 317.65 324.23 330.19 333.09 341.82 348.39 354.95 360.05 362.94 368.90 371.61" y="193.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="380.68 391.68 402.68 413.68 424.68 435.68 446.68 457.68 468.68 479.68 490.68 501.68 512.68 523.68" y="193.09" font-size="11.00" class="sc-notoserifcjksc">监控器读取智能体的完整对话记</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="208.71" font-size="11.00" class="sc-notoserifcjksc">录，但在隐藏推理设置中，它看不到智能体的推理。与</text><text x="338.89 345.13 353.71 360.60 368.68 375.30 380.68 387.57 392.25 398.22 404.89" y="208.71" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="413.46 424.46 435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="208.71" font-size="11.00" class="sc-notoserifcjksc">一样，每个模型还使用了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="224.33" font-size="11.00" class="sc-notoserifcjksc">经优化的攻击者提示词进行评估，这些提示词是此前通过自动化搜索找到的（搜索大多在其他</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="239.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29" y="239.95" font-size="11.00" class="sc-notoserifcjksc">模型上运行）；每个柱状条显示的是该模型的最佳提示词所得结果。</text><text x="72.00" y="646.61" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.61" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.82 114.92 120.46" y="646.61" font-size="9.00" class="sc-lorabold">6.4.2.2.A]</text><text x="126.30" y="646.61" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="137.66 143.10 146.04 151.74 157.30 162.23 168.20 172.45 177.29 183.03" y="646.61" font-size="9.00" class="sc-lorabold">LinuxArena</text><text x="190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12" y="646.61" font-size="9.00" class="sc-notoserifcjkscbold">中隐蔽地成功完成附带任务。</text><text x="307.12 316.12 325.12 334.12 343.12 352.12 361.12 370.12 379.12 388.12" y="646.61" font-size="9.00" class="sc-notoserifcjksc">智能体完成附带任务且</text><text x="399.48 405.77 408.22 412.81 418.18 423.57 428.44 430.81 437.96 443.33 448.70 452.87 455.24 460.12 462.33" y="646.61" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="469.76 478.76 487.76 496.76 505.76 514.76 523.76" y="646.61" font-size="9.00" class="sc-notoserifcjksc">监控器未标记该</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="658.31" font-size="9.00" class="sc-notoserifcjksc">对话记录的回合所占比例。监控器读取智能体的完整对话记录（包括其推理内容），但在隐藏推理设置中例外，此时它</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="670.01" font-size="9.00" class="sc-notoserifcjksc">能看到除智能体思维链之外的完整对话记录。每个柱状条使用的是在该模型和设置下所评估的提示词中隐蔽率最高的那</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="681.71" font-size="9.00" class="sc-notoserifcjksc">一个。所有模型均在其最高推理</text><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="261.89" y="121.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="261.89" y="121.81" width="58.76" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="476.10" y="121.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="476.10" y="121.81" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="523.48" y="121.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="72.00" y="137.43" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="135.42" y="137.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="135.42" y="137.43" width="55.36" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 84.99 90.98 96.39 102.46 104.99 107.62 113.42 115.88 118.40 121.03 126.38 130.25 132.88 138.04 140.76 143.21 145.84 148.89 154.26 160.40 165.77 171.42 174.47 176.93 179.56 185.77 191.17 196.32 200.95 206.80 212.87 215.68 221.74 227.27 229.90 238.84 244.68 250.66 256.08 258.80 263.43 266.06 270.68 274.55 278.88 284.85 290.38 296.14 298.86 304.28 306.91 310.78 316.63 319.26 324.52 330.37 336.35 340.22 344.48 350.32 353.04 355.67 359.54 365.53 370.94 373.75 378.08 380.71 386.03 392.02 397.17 399.98 406.05 410.68 413.31 419.11 422.48 425.11 428.98 434.97 440.82 446.79 452.55 458.45 462.32" y="704.46" font-size="10.00" class="sc-loraregular">Chen, Y., et al. (2026). Reasoning models struggle to control their chains of thought.</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.63 122.94 129.15 134.60 139.20 145.41 151.19" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2603.05706.</text><text x="156.28 162.17 166.14 170.01 175.98 180.61 183.11 186.79 193.25 198.41 202.74 208.03 210.84 215.50 217.96 223.81 228.09 233.61 240.07 245.23 251.05 255.33 262.22 267.59 273.37 279.58 285.14 287.45 293.66 299.11 303.72 309.92" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2603.05706</text><text x="504.00 509.00" y="751.80" font-size="9.00" class="sc-loraregular">89</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">强度下进行采样。每个柱状条涵盖</text><text x="209.37 212.64 214.78 220.37 225.95" y="80.05" font-size="9.00" class="sc-loraregular">1,000</text><text x="233.92 242.92 251.92 260.92 269.92 278.92 287.92 296.92 305.92 314.92" y="80.05" font-size="9.00" class="sc-notoserifcjksc">个任务配对、每个配对</text><text x="326.29" y="80.05" font-size="9.00" class="sc-loraregular">5</text><text x="333.56 342.56 351.56 360.56 369.56 378.56 387.56 396.56 405.56 414.56 423.56 432.56 441.56 450.56 459.56 468.56 477.56 486.56 495.56 504.56 513.56 522.56 531.56" y="80.05" font-size="9.00" class="sc-notoserifcjksc">次尝试，不含出错的回合。误差线表示基于任务配对</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="83.37 88.57 93.47" y="91.75" font-size="9.00" class="sc-loraregular">95%</text><text x="103.67 112.67 121.67 130.67 139.67 148.67 157.67 166.67" y="91.75" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="119.11" font-size="11.00" class="sc-notoserifcjksc">在推理对监控器隐藏的情况下，</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06 271.06 273.76" y="119.11" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="282.65 293.65 304.65 315.65 326.65 337.65 348.65" y="119.11" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率略高于</text><text x="362.54 371.28 377.84 384.41 389.50 392.40" y="119.11" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="398.39 409.39 420.39" y="119.11" font-size="11.00" class="sc-notoserifcjksc">，低于</text><text x="434.29 444.22 450.08 454.34 460.93 467.36 472.45 475.35 481.34 484.05" y="119.11" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="490.95" y="119.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="504.84 513.57 520.14 526.71" y="119.11" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 78.00 80.70" y="134.73" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70 97.70 108.70 119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70" y="134.73" font-size="11.00" class="sc-notoserifcjksc">。在不使用扩展思考时，</text><text x="207.70 213.93 220.37 227.04 233.72 239.61 243.86 246.76 252.75 255.46" y="134.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="264.35 275.35 286.35 297.35 308.35 319.35 330.35" y="134.73" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率降至约</text><text x="344.24 350.20" y="134.73" font-size="11.00" class="sc-loraregular">4%</text><text x="359.77 370.77 381.77 392.77 403.77 414.77 425.77 436.77 447.77 458.77 469.77 480.77 491.77 502.77 513.77 524.77" y="134.73" font-size="11.00" class="sc-notoserifcjksc">；而当其推理对监控器可见时，在我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="150.35" font-size="11.00" class="sc-notoserifcjksc">们尝试过的任何提示词下，它都从未在未被标记的情况下完成附带任务。总体而言，与</text><text x="492.89 499.13 507.71 514.60 522.68 529.30" y="150.35" font-size="11.00" class="sc-loraregular">SHADE-</text><text x="72.00 78.89 83.57 89.53 96.21" y="165.97" font-size="11.00" class="sc-loraregular">Arena</text><text x="104.78 115.78 126.78 137.78 148.78 159.78 170.78 181.78 192.78 203.78 214.78 225.78 236.78 247.78 258.78" y="165.97" font-size="11.00" class="sc-notoserifcjksc">上的情况一样，当推理被隐藏时，</text><text x="269.78 276.02 282.45 289.13 295.81 301.69 305.95 308.84 314.84 317.54" y="165.97" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="326.43 337.43 348.43 359.43 370.43 381.43 392.43 403.43 414.43 425.43 436.43 447.43 458.43 469.43 480.43 491.43 502.43 513.43 524.43" y="165.97" font-size="11.00" class="sc-notoserifcjksc">以较高的比率规避监控器，但频率低于我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="181.59" font-size="11.00" class="sc-notoserifcjksc">能力最强的模型；在</text><text x="173.89 180.25 183.34 190.02 196.59 202.77 209.65 214.34 220.30 226.98" y="181.59" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="235.55 246.55 257.55 268.55 279.55 290.55 301.55 312.55 323.55 334.55 345.55 356.55 367.55 378.55 389.55 400.55 411.55 422.55 433.55 444.55 455.55" y="181.59" font-size="11.00" class="sc-notoserifcjksc">上，它在不使用扩展思考时很少做到这一点（约</text><text x="469.44 475.40" y="181.59" font-size="11.00" class="sc-loraregular">4%</text><text x="484.97 495.97 506.97 517.97 528.97" y="181.59" font-size="11.00" class="sc-notoserifcjksc">），而当其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="197.21" font-size="11.00" class="sc-notoserifcjksc">推理对监控器可见时则从未做到。</text><text x="72.00 78.32 80.89 86.90 89.47 95.33 97.89" y="248.64" font-size="11.00" class="sc-lorabold">6.4.2.3</text><text x="106.95 117.95 128.95 139.95 150.95 161.95" y="248.64" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="281.02" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否出现未对齐行为。倾向于在扩展思考中言语化表达</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="296.64" font-size="11.00" class="sc-notoserifcjksc">其采取未对齐行为之意图的模型，可能要容易发现得多。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="361.42" font-size="11.00" class="sc-notoserifcjksc">选择地省略监控器所需的关键信息。为了测量这种思维链可控性（</text><text x="391.00 396.85 403.44 409.12 412.21 418.88 424.26 430.64 434.25 439.63 443.89 450.48 456.91 463.48 469.83 476.32" y="361.42" font-size="11.00" class="sc-loraregular">chain-of-thought</text><text x="72.00 77.80 84.23 90.81 95.07 99.75 106.19 109.18 112.17 117.85 124.25 127.34 130.33 133.60 137.88" y="377.04" font-size="11.00" class="sc-loraregular">controllability</text><text x="143.69" y="377.04" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="154.69 162.38 168.47 175.51 178.40 184.20 190.63 197.21 201.47 206.16 212.59 215.58 218.57 224.25 230.65 233.74 236.74 240.00 244.28" y="377.04" font-size="11.00" class="sc-loraregular">CoT controllability</text><text x="250.09 261.09 272.09 283.09 294.09" y="377.04" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="307.98 315.67 322.26 328.22 334.90 337.79 343.68 347.93 350.83 356.50 359.50 362.20 365.10 368.45 374.36 381.11 387.02 393.24" y="377.04" font-size="11.00" class="sc-loraregular">Chen et al. (2026)</text><text x="396.60" y="373.37" font-size="6.60" class="sc-loraregular">8</text><text x="403.20 414.20 425.20 436.20 447.20 458.20 469.20 480.20 491.20 502.20 513.20 524.20" y="377.04" font-size="11.00" class="sc-notoserifcjksc">进行了内部复现：我们要求</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="392.66" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94" y="392.66" font-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="224.83 233.21 239.87 248.48" y="392.66" font-size="11.00" class="sc-loraregular">GPQA</text><text x="255.37" y="392.66" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="266.37 274.95 281.31" y="392.66" font-size="11.00" class="sc-loraregular">HLE</text><text x="291.04" y="392.66" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="304.94 315.03 325.13 331.37 339.54 344.92 351.59 356.27" y="392.66" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="365.60 376.60 387.60 398.60 409.60 420.60 431.60 442.60 453.60 464.60 475.60 486.60 497.60 508.60 519.60" y="392.66" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思考中遵循一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="408.28" font-size="11.00" class="sc-notoserifcjksc">些基本指令（例如，不提及某个关键词）。这三个均为高难度问答基准测试，模型在其上往往会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="423.90" font-size="11.00" class="sc-notoserifcjksc">产生大量扩展思考。我们展示了以下几种情况下的结果：使用原始提示词；使用由英国人工智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="439.52" font-size="11.00" class="sc-notoserifcjksc">安全研究所（</text><text x="138.00 146.27 153.79 156.68 163.56 167.25 170.14 176.38 182.29 188.14 194.70 199.47 202.73 207.01 212.82 215.71 219.31 225.99 231.08 235.34 238.61 242.86 249.43 253.69" y="439.52" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="259.65 270.65 281.65 292.65 303.65 314.65 325.65 336.65 347.65 358.65 369.65 380.65 391.65 402.65 413.65 424.65 435.65 446.65 457.65 468.65 479.65" y="439.52" font-size="11.00" class="sc-notoserifcjksc">）提供的提示词（该提示词经过优化，旨在诱发</text><text x="493.54 499.45 506.20 512.11" y="439.52" font-size="11.00" class="sc-loraregular">2026</text><text x="521.36" y="439.52" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="72.00" y="455.14" font-size="11.00" class="sc-notoserifcjksc">初</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="455.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18" y="455.14" font-size="11.00" class="sc-notoserifcjksc">模型更高的可控性）；以及使用一个经优化以诱发</text><text x="369.08 375.31 381.75 388.43 395.10 400.99 405.25 408.14 414.13 416.84" y="455.14" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73" y="455.14" font-size="11.00" class="sc-notoserifcjksc">更高可控性的新提示</text><text x="72.00 83.00" y="470.76" font-size="11.00" class="sc-notoserifcjksc">词。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="540.09" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00 166.24 172.67 179.35 186.03 191.91 196.17 199.06 205.06 207.76" y="540.09" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65" y="540.09" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制能力较差。我们将此视为表明</text><text x="450.54 456.78 463.22 469.89 476.57 482.45 486.71 489.60 495.60 498.31" y="540.09" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="507.19 518.19 529.19" y="540.09" font-size="11.00" class="sc-notoserifcjksc">的思维</text><text x="72.00 83.00 94.00 105.00" y="555.71" font-size="11.00" class="sc-notoserifcjksc">链比先前</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="555.71" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18" y="555.71" font-size="11.00" class="sc-notoserifcjksc">模型更具可监控性的弱证据。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="156.28" y="707.20" width="159.43" height="12.80" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="304.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="304.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.07 115.16 120.70 124.17 126.54 132.73 135.54 140.26 145.82 151.18 156.02 158.39 163.77 168.87 174.61 180.35 185.19 188.91 191.28 196.14 198.23" y="304.75" font-size="9.00" class="sc-lorabold">6.4.2.3.A] Claude Sonnet 5.5</text><text x="205.46 214.46 223.46 232.46 241.46 250.46 259.46 268.46 277.46 286.46 295.46 304.46" y="304.75" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性相对较低。</text><text x="313.46 322.46 331.46 340.46 349.46 358.46 367.46 376.46 385.46 394.46 403.46 412.46 421.46 430.46 439.46 448.46 457.46 466.46 475.46 484.46 493.46 502.46 511.46 520.46 529.46" y="304.75" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强度档位或一个固定的思考预算，其</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="316.45" font-size="9.00" class="sc-notoserifcjksc">位置取决于该设置下产生的平均思维链长度。可控性是指在来自</text><text x="326.37 333.22 338.67 345.72" y="316.45" font-size="9.00" class="sc-loraregular">GPQA</text><text x="351.35" y="316.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="360.35 367.37 372.57" y="316.45" font-size="9.00" class="sc-loraregular">HLE</text><text x="380.54" y="316.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="391.91 400.17 408.43 413.53 420.22 424.62 430.07 433.91" y="316.45" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="441.54 450.54 459.54 468.54 477.54 486.54 495.54 504.54 513.54 522.54 531.54" y="316.45" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="328.15" font-size="9.00" class="sc-notoserifcjksc">其扩展思考所给出指令的回复所占比例。越低越好，因为更高的可控性意味着模型在被指示时改变其扩展思考内容的能</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="339.85" font-size="9.00" class="sc-notoserifcjksc">力更强，这可能使监控变得不那么可靠。</text></svg></div>
