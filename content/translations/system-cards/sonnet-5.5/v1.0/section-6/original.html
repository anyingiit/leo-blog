-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="224.83" y="392.66" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="255.37" y="392.66" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="266.37" y="392.66" font-size="11.00" class="sc-loraregular">HLE</text><text x="291.04" y="392.66" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="304.94 315.03 325.13 331.37 339.54 344.92 351.59 356.27" y="392.66" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="365.60" y="392.66" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思考中遵循一</text><text x="72.00" y="408.28" font-size="11.00" class="sc-notoserifcjksc">些基本指令（例如，不提及某个关键词）。这三个均为高难度问答基准测试，模型在其上往往会</text><text x="72.00" y="423.90" font-size="11.00" class="sc-notoserifcjksc">产生大量扩展思考。我们展示了以下几种情况下的结果：使用原始提示词；使用由英国人工智能</text><text x="72.00" y="439.52" font-size="11.00" class="sc-notoserifcjksc">安全研究所（</text><text x="138.00" y="439.52" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="259.65" y="439.52" font-size="11.00" class="sc-notoserifcjksc">）提供的提示词（该提示词经过优化，旨在诱发</text><text x="493.54" y="439.52" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="521.36" y="439.52" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="72.00" y="455.14" font-size="11.00" class="sc-notoserifcjksc">初</text><text x="85.89" y="455.14" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="455.14" font-size="11.00" class="sc-notoserifcjksc">模型更高的可控性）；以及使用一个经优化以诱发</text><text x="369.08" y="455.14" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="425.73" y="455.14" font-size="11.00" class="sc-notoserifcjksc">更高可控性的新提示</text><text x="72.00" y="470.76" font-size="11.00" class="sc-notoserifcjksc">词。</text><text x="72.00" y="540.09" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00" y="540.09" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="216.65" y="540.09" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制能力较差。我们将此视为表明</text><text x="450.54" y="540.09" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="507.19" y="540.09" font-size="11.00" class="sc-notoserifcjksc">的思维</text><text x="72.00" y="555.71" font-size="11.00" class="sc-notoserifcjksc">链比先前</text><text x="118.89" y="555.71" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="555.71" font-size="11.00" class="sc-notoserifcjksc">模型更具可监控性的弱证据。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="156.28" y="707.20" width="159.43" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">90</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="304.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="304.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.07 115.16 120.70 124.17 126.54 132.73 135.54 140.26 145.82 151.18 156.02 158.39 163.77 168.87 174.61 180.35 185.19 188.91 191.28 196.14 198.23" y="304.75" font-size="9.00" class="sc-lorabold">6.4.2.3.A] Claude Sonnet 5.5</text><text x="205.46" y="304.75" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性相对较低。</text><text x="313.46" y="304.75" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强度档位或一个固定的思考预算，其</text><text x="72.00" y="316.45" font-size="9.00" class="sc-notoserifcjksc">位置取决于该设置下产生的平均思维链长度。可控性是指在来自</text><text x="326.37" y="316.45" font-size="9.00" class="sc-loraregular sc-k">GPQA</text><text x="351.35" y="316.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="360.35" y="316.45" font-size="9.00" class="sc-loraregular">HLE</text><text x="380.54" y="316.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="391.91 400.17 408.43 413.53 420.22 424.62 430.07 433.91" y="316.45" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="441.54" y="316.45" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对</text><text x="72.00" y="328.15" font-size="9.00" class="sc-notoserifcjksc">其扩展思考所给出指令的回复所占比例。越低越好，因为更高的可控性意味着模型在被指示时改变其扩展思考内容的能</text><text x="72.00" y="339.85" font-size="9.00" class="sc-notoserifcjksc">力更强，这可能使监控变得不那么可靠。</text></svg></div>
