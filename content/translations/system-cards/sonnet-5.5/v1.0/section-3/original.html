2 259.19 264.72 271.18 276.34 282.15 286.43 293.33 298.70 304.48 310.68 316.13 318.59 322.23 327.65 331.29 336.73" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39 101.39 117.39 133.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00 80.39 84.03" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43 106.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="154.36" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94 243.94 254.94" y="154.36" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力不及</text><text x="268.83 278.77 284.63 288.89 295.48 301.91" y="154.36" font-size="11.00" class="sc-loraregular">Mythos</text><text x="309.90 320.90 331.90 342.90 353.90 364.90 375.90 386.90 397.90 408.90 419.90 430.90 441.90" y="154.36" font-size="11.00" class="sc-notoserifcjksc">级模型和其他近期模型（例如</text><text x="455.79 464.52 471.09 477.66 482.75 485.64 491.64 494.34" y="154.36" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="500.34 511.34 522.34" y="154.36" font-size="11.00" class="sc-notoserifcjksc">），但</text><text x="72.00 83.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 141.42 147.86 154.53 161.21 167.10 171.35 174.24" y="169.98" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="180.24 191.24 202.24 213.24 224.24 235.24 246.24 257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24" y="169.98" font-size="11.00" class="sc-notoserifcjksc">，其网络安全能力有显著提升。在我们的整个评估套件中，</text><text x="466.24 473.93 476.92 482.53 489.10 495.68 501.64 504.53 510.77 517.20 523.88 530.56 536.44" y="169.98" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00 78.00 80.70" y="185.60" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59" y="185.60" font-size="11.00" class="sc-notoserifcjksc">显著优于</text><text x="136.48 144.17 147.16 152.77 159.34 165.92 171.88 174.77 181.01 187.45 194.12 200.80 206.68 210.94 213.83" y="185.60" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="219.83 230.83 241.83 252.83 263.83" y="185.60" font-size="11.00" class="sc-notoserifcjksc">，但未达到</text><text x="277.72 285.41 288.40 294.01 300.58 307.16 313.12 316.01 324.75 331.31 337.88 342.97 345.87 351.86 354.57" y="185.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="363.46" y="185.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="377.35 385.04 388.03 393.64 400.21 406.79 412.75 415.64 425.57 431.44 435.69 442.28 448.72 453.81 456.70 462.70 465.40" y="185.60" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="472.30 483.30 494.30 505.30 516.30 527.30" y="185.60" font-size="11.00" class="sc-notoserifcjksc">取得的结果。</text><text x="72.00" y="235.32" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.02 94.73" y="235.32" font-size="11.00" class="sc-loraregular">3.2</text><text x="103.53 114.53 125.53 136.53 147.53 158.53 169.53 180.53 191.53 202.53 213.53 224.53 235.53 246.53 257.53 268.53 279.53 290.53 301.53 312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53" y="235.32" font-size="11.00" class="sc-notoserifcjksc">节中报告的所有能力评估结果，均是在关闭网络安全防护措施的情况下评估</text><text x="469.42 477.11 480.10 485.71 492.28 498.85" y="235.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="507.71 518.71 529.71" y="235.32" font-size="11.00" class="sc-notoserifcjksc">模型得</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="250.94" font-size="11.00" class="sc-notoserifcjksc">到的。这使我们能够评估底层模型的能力，并反映了某些用户即将可以通过我们的</text><text x="468.00 479.00 490.00 501.00 512.00 523.00" y="250.94" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证</text><text x="72.00 83.00 94.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">计划（</text><text x="244.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="255.73 266.73 277.73 288.73 299.73 310.73 321.73 332.73 343.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc">获得的能力水平。自</text><text x="357.63 363.53 370.29 376.19" y="266.56" font-size="11.00" class="sc-loraregular">2026</text><text x="385.45" y="266.56" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="399.34" y="266.56" font-size="11.00" class="sc-loraregular">8</text><text x="408.41 419.41 430.41 441.41 452.41 463.41 474.41 485.41 496.41 507.41 518.41 529.41" y="266.56" font-size="11.00" class="sc-notoserifcjksc">月以来，我们的许多评估运</text><text x="72.00 83.00 94.00 105.00" y="282.18" font-size="11.00" class="sc-notoserifcjksc">行框架（</text><text x="116.00 122.59 128.26 133.03 139.71 145.67 150.76" y="282.18" font-size="11.00" class="sc-loraregular">harness</text><text x="155.85 166.85 177.85 188.85 199.85 210.85 221.85 232.85 243.85 254.85 265.85 276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="282.18" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这些情况下，为保持一致性，所有较早的模型都已重新评估，因</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="297.80" font-size="11.00" class="sc-notoserifcjksc">此得到的数字可能与以往的系统卡（</text><text x="248.00 254.18 259.99 265.08 269.34 275.30 285.14 288.03 295.72 301.39 306.08" y="297.80" font-size="11.00" class="sc-loraregular">System Card</text><text x="312.66 323.66 334.66 345.66 356.66 367.66" y="297.80" font-size="11.00" class="sc-notoserifcjksc">）有所不同。</text><text x="72.00 80.39 84.03" y="350.06" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39 109.39 123.39 137.39" y="350.06" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 115.03 120.99 127.67 133.52" y="418.83" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="140.11" y="415.16" font-size="6.60" class="sc-loraregular">1</text><text x="145.41 156.41 167.41 178.41 189.41 200.41 211.41 222.41 233.41 244.41 255.41 266.41 277.41 288.41 299.41 310.41" y="418.83" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="324.30 331.19" y="418.83" font-size="11.00" class="sc-loraregular">AI</text><text x="337.76 348.76 359.76 370.76 381.76 392.76 403.76 414.76 425.76 436.76 447.76 458.76 469.76 480.76 491.76 502.76 513.76 524.76" y="418.83" font-size="11.00" class="sc-notoserifcjksc">模型能在软件漏洞利用流程中推进到什么</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc">程度。我们最近曾</text><text x="160.00 171.00 182.00 193.00 204.00 215.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细地在此</text><text x="226.00 237.00 248.00 259.00 270.00 281.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc">介绍过它，在</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.03 371.74" y="434.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="380.63 391.63 402.63" y="434.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="413.63 424.63 435.63 446.63 457.63 468.63" y="434.45" font-size="11.00" class="sc-notoserifcjksc">中也有介绍。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="483.82" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="516.20" font-size="11.00" class="sc-notoserifcjksc">所有试验和所有环境中每次试验的平均捕获标志数；</text><text x="108.00 115.69 121.37 127.93" y="532.39" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="532.39" font-size="11.00" class="sc-notoserifcjksc">，即在随机选取的三次试验子集中每个环境所捕获的可用标志百分比，再对所有环</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="548.01" font-size="11.00" class="sc-notoserifcjksc">境取平均；以及</text><text x="108.00 119.00 130.00 141.00 152.00" y="564.77" font-size="11.00" class="sc-notoserifcjksc">在普通组和</text><text x="165.89 172.78 179.35 183.60 189.77 198.16 204.72 211.30 217.33" y="564.77" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18 336.18 347.18 358.18 369.18 380.18 391.18 402.18 413.18 424.18 435.18 446.18 457.18 468.18 479.18" y="564.77" font-size="11.00" class="sc-notoserifcjksc">组的运行（定义见下文）中生成的完整任意代码执行（</text><text x="490.18 495.86 500.58 506.98 510.25 514.51 519.19 524.87 529.82" y="564.77" font-size="11.00" class="sc-loraregular">arbitrary</text><text x="108.00 113.80 120.23 126.81 132.77 135.67 141.57 147.35 153.25 159.11 165.67 169.93 173.02 179.46" y="580.39" font-size="11.00" class="sc-loraregular">code execution</text><text x="186.13" y="580.39" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="197.13 203.96 211.65" y="580.39" font-size="11.00" class="sc-loraregular">ACE</text><text x="218.49 229.49 240.49 251.49 262.49 273.49 284.49 295.49 306.49" y="580.39" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="613.35" font-size="11.00" class="sc-notoserifcjksc">每个环境都在两个组别下运行，轮次预算为</text><text x="283.89 290.02 296.85" y="613.35" font-size="11.00" class="sc-loraregular">300</text><text x="306.58 317.58 328.58 339.58 350.58 361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58 526.58" y="613.35" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。</text><text x="72.00" y="628.97" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 109.77 118.16 124.72 131.30 137.33" y="628.97" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="628.97" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在用完预算之前、且未实现完整代码执行的情况下主动停止，运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="644.59" font-size="11.00" class="sc-notoserifcjksc">行框架会向对话中注入一条</text><text x="204.00" y="644.59" font-size="11.00" class="sc-loraregular">“</text><text x="208.40 219.40 230.40 241.40" y="644.59" font-size="11.00" class="sc-notoserifcjksc">继续尝试</text><text x="252.40" y="644.59" font-size="11.00" class="sc-loraregular">”</text><text x="256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="644.59" font-size="11.00" class="sc-notoserifcjksc">提示词，并让它继续。</text><a href="ht fcjksc">组合计中，</text><text x="187.29 194.98 197.97 203.58 210.15 216.73 222.69 225.58 231.82 238.25 244.93 251.61 257.49 261.75 264.64 270.64 273.34" y="98.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="282.23" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="296.12 302.09 308.21 310.92 316.88" y="98.23" font-size="11.00" class="sc-loraregular">43.4%</text><text x="329.35 340.35 351.35 362.35 373.35 384.35 395.35 406.35 417.35 428.35 439.35 450.35 461.35 472.35 483.35 494.35" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的情况实现了完整的任意代码执行（</text><text x="505.35 511.31 515.31" y="98.23" font-size="11.00" class="sc-loraregular">410</text><text x="525.04" y="98.23" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行中有</text><text x="118.89 122.90 127.97" y="113.85" font-size="11.00" class="sc-loraregular">178</text><text x="137.04 148.04 159.04" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次）。</text><text x="72.00" y="449.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 104.53 106.62 112.16 115.63 118.00 124.19 127.00 131.71 137.28 142.64 147.48 149.85 155.23 160.33 166.07 171.81 176.65 180.37 182.74 187.60 189.69" y="449.00" font-size="9.00" class="sc-lorabold">3.2.1.A] Claude Sonnet 5.5</text><text x="196.92" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="208.29 213.90 218.83 224.21 227.02 232.11 235.02 238.70 244.65 249.49 255.23 259.89" y="449.00" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="267.85 276.85 285.85 294.85 303.85" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="312.85 316.45 324.65 329.51 334.15 339.41" y="449.00" font-size="9.00" class="sc-loraregular">“Mean”</text><text x="342.55 351.55 360.55 369.55 378.55 387.55 396.55 405.55 414.55 423.55 432.55 441.55 450.55 459.55 468.55 477.55 486.55 495.55 504.55 513.55 522.55 531.55" y="449.00" font-size="9.00" class="sc-notoserifcjksc">指每个模型在所有试验和所有环境中捕获能力标志</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="460.70" font-size="9.00" class="sc-notoserifcjksc">的平均数量。</text><text x="126.00 129.60 135.89 140.54 145.91 153.74" y="460.70" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="156.88 165.88 174.88 183.88 192.88 201.88 210.88 219.88 228.88 237.88 246.88 255.88 264.88 273.88 282.88 291.88 300.88 309.88 318.88 327.88 336.88 345.88 354.88 363.88 372.88 381.88 390.88 399.88 408.88 417.88 426.88 435.88 444.88 453.88 462.88 471.88 480.88 489.88 498.88 507.88 516.88 525.88" y="460.70" font-size="9.00" class="sc-notoserifcjksc">指在五次试验子集中随机选取的三次试验里，给定环境中所捕获标志占总标志数的百分比，再对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="472.40" font-size="9.00" class="sc-notoserifcjksc">所有环境取平均。</text><text x="144.00 147.60 152.44 157.82 160.26 162.71 165.08 170.67 176.96 182.56 186.72" y="472.40" font-size="9.00" class="sc-loraregular">“Full ACEs”</text><text x="189.86 198.86 207.86" y="472.40" font-size="9.00" class="sc-notoserifcjksc">是全部</text><text x="219.23 224.11 227.39" y="472.40" font-size="9.00" class="sc-loraregular">410</text><text x="235.34 244.34 253.34 262.34 271.34 280.34 289.34 298.34 307.34 316.34" y="472.40" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通组和</text><text x="327.71 333.34 338.71 342.20 347.25 354.11 359.48 364.86 369.79" y="472.40" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="377.04 386.04 395.04 404.04 413.04 422.04 431.04 440.04 449.04 458.04 467.04 476.04 485.04 494.04 503.04 512.04 521.04 530.04" y="472.40" font-size="9.00" class="sc-notoserifcjksc">组）中实现任意代码执行的总次数。这些</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00" y="484.10" font-size="9.00" class="sc-notoserifcjksc">结果是在关闭所有网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="574.55" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69 175.69" y="574.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="574.55" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56 248.56 259.56 270.56 281.56 292.56 303.56 314.56 325.56 336.56 347.56 358.56 369.56 380.56 391.56 402.56 413.56 424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="574.55" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="590.17" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动。大多数网络安全基准测试侧重于孤立考察单项能力的短程挑战，而</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="605.79" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69 175.69 186.69 197.69 208.69 219.69 230.69 241.69 252.69 263.69 274.69 285.69 296.69 307.69 318.69 329.69 340.69 351.69 362.69 373.69 384.69 395.69 406.69 417.69 428.69 439.69 450.69 461.69 472.69 483.69 494.69 505.69 516.69" y="605.79" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的各行动阶段之间对攻击技术进行协调排</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="621.41" font-size="11.00" class="sc-notoserifcjksc">序，包括分支决策、遵守约束，以及从错误和状态不一致中恢复。</text><text x="72.00 83.00 94.00 105.00 116.00" y="687.89" font-size="11.00" class="sc-notoserifcjksc">我们运行了</text><text x="129.89 137.58 143.39 149.63 155.42 161.39 168.06 173.74 178.50 181.59 187.76 194.61 200.57 207.25 213.10" y="687.89" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="222.58 233.58 244.58 255.58 266.58" y="687.89" font-size="11.00" class="sc-notoserifcjksc">评估集中由</text><text x="280.47 284.48" y="687.89" font-size="11.00" class="sc-loraregular">10</text><text x="294.20 305.20 316.20 327.20 338.20 349.20 360.20 371.20 382.20" y="687.89" font-size="11.00" class="sc-notoserifcjksc">个挑战组成的子集：</text><text x="393.20 399.23 405.14 411.57 421.40 427.29 431.55 436.50 442.30 450.32 453.32 459.28 464.37 469.46 475.90" y="687.89" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="482.58" y="687.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="527.80" y="687.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77 140.86 147.54 153.21 159.78 164.87 171.46 177.90" y="703.51" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="703.51" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.85 303.13 308.94 316.96 322.81 327.57 330.67 335.76 338.85" y="703.51" font-size="11.00" class="sc-loraregular">identity_crisis</text><text x="343.94" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94 360.03 363.13 369.47 375.96 380.22 388.24 392.50 398.46 403.55" y="703.51" font-size="11.00" class="sc-loraregular">sight_test</text><text x="407.81" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81 428.64 435.21 439.47 442.56 449.16" y="703.51" font-size="11.00" class="sc-loraregular">mutiny</text><text x="454.96" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text></svg></div>

="131.19" font-size="11.00" class="sc-loraregular">0.7%</text><text x="449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">有显著提升。相比</text><text x="72.00 83.00 94.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">之下，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 190.35 193.06" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="199.95 210.95 221.95" y="146.81" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="235.85 242.20 246.21 248.56 253.63" y="146.81" font-size="11.00" class="sc-loraregular">61.7%</text><text x="266.10 277.10 288.10 299.10" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的任务，</text><text x="310.10 317.78 320.78 326.39 332.95 339.53 345.49 348.39 357.12 363.69 370.25 375.35 378.24 384.24 386.94" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="395.83 406.83 417.83" y="146.81" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="431.72 438.00 442.59 445.19 451.54" y="146.81" font-size="11.00" class="sc-loraregular">67.6%</text><text x="461.11" y="146.81" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="497.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 105.67 107.77 113.30 116.78 119.14 125.33 128.14 132.86 138.42 143.78 148.63 150.99 156.38 161.47 167.21 172.95 177.79 181.51 183.88 188.74 190.84" y="497.58" font-size="9.00" class="sc-lorabold">3.2.2.A] Claude Sonnet 5.5</text><text x="198.06" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="209.43 215.62 220.58 225.96 230.62 235.47 241.21 245.93 250.25 253.19 258.06 264.01 268.85 274.59 279.25" y="497.58" font-size="9.00" class="sc-lorabold">CyScenarioBench</text><text x="287.21 296.21 305.21 314.21 323.21" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">上的得分。</text><text x="332.21 341.21 350.21 359.21 368.21 377.21 386.21 395.21 404.21 413.21 422.21 431.21 440.21 449.21 458.21 467.21 476.21 485.21 494.21 503.21 512.21" y="497.58" font-size="9.00" class="sc-notoserifcjksc">柱形表示每个模型的总体解决率，为我们子集中</text><text x="523.58 526.85" y="497.58" font-size="9.00" class="sc-loraregular">10</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="509.28" font-size="9.00" class="sc-notoserifcjksc">个挑战的平均值。本评估在关闭网络安全缓解措施的情况下运行。</text><text x="72.00 79.79 83.17 90.63 94.01 101.80 104.89 113.25 116.86 125.46 134.27 139.52 147.39 150.48 157.40 164.42 173.23 176.85 185.14 188.75 193.80 202.61 207.66 211.27 219.56 228.16 231.25 239.61 247.63 256.22 264.05 272.64 286.27 295.08 300.33" y="541.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.2.3 Binary Exploitation Benchmark</text><text x="307.92 320.92" y="541.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原</text><text x="337.02 347.22 355.14 363.06 370.64 377.53 386.12 392.40" y="541.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="398.68" y="541.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="573.06" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现能力，以及模型针对自己发现的漏洞，能在多大程度上推进到可用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="588.68" font-size="11.00" class="sc-notoserifcjksc">的概念验证（</text><text x="138.00 144.57 149.25 155.69 162.07 165.68 1 0 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络使用，包括被视为两用的活动（即可能具有进攻性或防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">御性用途的活动）。与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="261.93" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.82 283.51 286.50 292.11 298.68 305.26 311.22 314.11 322.84 329.41 335.98 341.07 343.96 349.96 352.67" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="361.55 372.55 383.55 394.55 405.55 416.55 427.55 438.55 449.55 460.55 471.55 482.55 493.55 504.55 515.55 526.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">一样，我们的政策允许在源代码中进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">行漏洞发现，因此开发者可以使用</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 284.42 290.86 297.53 304.21 310.10 314.35 317.25 323.24 325.95" y="178.62" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="178.62" font-size="11.00" class="sc-notoserifcjksc">来帮助编写更安全的软件，但该政策会拦</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">截在已编译二进制文件中进行的漏洞发现。作出这一区分的原因详见</text><text x="404.89 42 517.42 528.42" y="276.34" font-size="11.00" class="sc-notoserifcjksc">上，开发者必须主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">动选择启用自动回退。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">对于其网络安全用例可能被我们的网络安全防护措施拦截的用户，我们建议通过我们即将推出的</text><text x="72.00 83.00 94.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">更新版</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">，在网络安全拦截分类器有所放宽的条件下访问我们的模型。</text><text x="490.00 497.69 500.68 506.29 512.86 519.44" y="341.11" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="356.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65 139.65 150.65 161.65 172.65 183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65" y="356.73" font-size="11.00" class="sc-notoserifcjksc">将在不久的将来通过该计划提供。</text><text x="72.00 79.79 83.17 90.95 94.33" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.1</text><text x="102.13 115.13 128.13 141.13 154.13 167.13 180.13" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖率</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 14 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40" y="367.93" font-size="9.00" class="sc-lorabold">3.3.1.A]</text><text x="118.24 127.24 136.24 145.24 154.24 163.24 172.24 181.24 190.24 199.24 208.24 217.24 226.24 235.24 244.24" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">在我们的网络危害覆盖测试集上，</text><text x="253.24 259.43 262.24 266.96 272.52 277.88 282.73 285.09 290.48 295.57 301.31 307.05 311.90 315.61 317.98 322.84 324.94" y="367.93" font-size="9.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="332.16 341.16 350.16 359.16 368.16 377.16 386.16 395.16 404.16 413.16 422.16" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">的安全防护措施保持了与</text><text x="433.53 439.72 442.53 447.25 452.81 458.17 463.01 465.38 472.30 477.71 483.27 487.64 490.01" y="367.93" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="497.23 506.23 515.23 524.23" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">相当的高</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">召回率（被标记的有害示例所占比例），覆盖率略低于</text><text x="290.37 296.56 299.37 304.08 309.65 315.01 319.85 322.22 326.99 331.70 336.83 339.63 344.48 346.84 351.70 353.80" y="379.63" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="359.82" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="371.19 378.11 383.52 389.08 393.44 395.81 400.67 402.77" y="379.63" font-size="9.00" class="sc-lorabold">Opus 5.5</text><text x="407.63" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="416.63 425.63 434.63" y="379.63" font-size="9.00" class="sc-notoserifcjksc">它相比</text><text x="445.99 451.10 456.36 461.83 467.29 472.10 475.59 477.95" y="379.63" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="485.23 494.23 503.23 512.23 521.23 530.23" y="379.63" font-size="9.00" class="sc-notoserifcjksc">有显著提升。</text><text x="72.00 79.79 83.17 90.95 94.33" y="424.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.2</text><text x="104.89 117.89 130.89 143.89 156.89 169.89 182.89" y="424.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40 98.40 109.40 120.40" y="456.65" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="456.65" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（即</text><text x="366.24" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="370.64 381.64" y="456.65" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="392.64" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48" y="456.65" font-size="11.00" class="sc-notoserifcjksc">）的能力，这里的</text><text x="484.48" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="488.88 499.88" y="456.65" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="510.88" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="514.72 525.72" y="456.65" font-size="11.00" class="sc-notoserifcjksc">包括</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="472.27" font-size="11.00" class="sc-notoserifcjksc">提示词、自定义运行框架和多智能体流水线。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="521.42" font-size="11.00" class="sc-notoserifcjksc">为测试鲁棒性，我们维护着一项名为</text><text x="250.89 255.58 261.50 270.31 273.40 280.08 286.65 292.03 297.63 302.00 306.26 311.93 317.78 323.61 329.58" y="521.42" font-size="11.00" class="sc-loraregular">rewind-attacker</text><text x="337.23 348.23 359.23 370.23 381.23 392.23 403.23 414.23 425.23 436.23 447.23 458.23 469.23 480.23 491.23 502.23 513.23 524.23" y="521.42" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="537.04" font-size="11.00" class="sc-notoserifcjksc">防护的模型（</text><text x="138.00" y="537.04" font-size="11.00" class="sc-loraitalic">“</text><text x="142.27 153.27" y="537.04" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="164.27" y="537.04" font-size="11.00" class="sc-loraitalic">”</text><text x="168.36 179.36 190.36 201.36 212.36 223.36 234.36 245.36 256.36 267.36" y="537.04" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器（</text><text x="278.36" y="537.04" font-size="11.00" class="sc-loraregular">“</text><text x="282.76 293.76 304.76" y="537.04" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="315.76" y="537.04" font-size="11.00" class="sc-loraitalic">”</text><text x="319.85 330.85 341.85 352.85 363.85 374.85 385.85 396.85 407.85 418.85 429.85 440.85 451.85 462.85 473.85 484.85 495.85 506.85 517.85 528.85" y="537.04" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有</text><text x="72.00 83.00" y="552.66" font-size="11.00" class="sc-notoserifcjksc">用（</text><text x="94.00 100.59 106.55 109.54 116.06 119.77 126.34 129.33 134.71 141.15 147.82 150.76" y="552.66" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="156.57 167.57 178.57 189.57 200.57 211.57 222.57 233.57 244.57 255.57 266.57 277.57 288.57 299.57 310.57 321.57 332.57 343.57 354.57 365.57 376.57 387.57 398.57 409.57 420.57 431.57 442.57 453.57 464.57 475.57 486.57 497.57 508.57 519.57" y="552.66" font-size="11.00" class="sc-notoserifcjksc">）语言模型，被提示去模拟一名试图从助手身上引出进攻性网络能力的人类红</text><text x="72.00 83.00 94.00 105.00" y="568.28" font-size="11.00" class="sc-notoserifcjksc">队成员。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="618.57" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个会话中被启动，在该会话中，它可以向一个在任务沙箱内运行助手模型（带有生产</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="634.19" font-size="11.00" class="sc-notoserifcjksc">环境安全防护措施）的</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 230.87 237.31 243.89" y="634.19" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="252.74 263.74 274.74 285.74 296.74 307.74 318.74 329.74 340.74 351.74 362.74 373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74" y="634.19" font-size="11.00" class="sc-notoserifcjksc">智能体发送指令。随后，攻击者针对助手有</text><text x="464.63 470.60 477.43" y="634.19" font-size="11.00" class="sc-loraregular">400</text><text x="487.15 498.15 509.15 520.15" y="634.19" font-size="11.00" class="sc-notoserifcjksc">次调用的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="649.81" font-size="11.00" class="sc-notoserifcjksc">上限，在此期间攻击者会收到拦截反馈，并有机会回溯到先前的状态以尝试新的方法。每个任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="665.43" font-size="11.00" class="sc-notoserifcjksc">都将智能体置于一个独立的</text><text x="206.89 215.09 221.52 227.38 233.21 239.17" y="665.43" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="681.05" font-size="11.00" class="sc-notoserifcjksc">受害者目录、用攻击者控制的公钥封装加密密钥，并向一台</text></svg></div>
