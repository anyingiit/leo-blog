 229.52 233.84 239.14 241.95 246.61 249.07 254.92 259.19 264.72 271.18 276.34 282.15 286.43 293.33 298.70 304.48 310.68 316.13 318.59 322.23 327.65 331.29 336.73" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="154.36" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="154.36" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力不及</text><text x="268.83 278.77 284.63 288.89 295.48 301.91" y="154.36" font-size="11.00" class="sc-loraregular">Mythos</text><text x="309.90" y="154.36" font-size="11.00" class="sc-notoserifcjksc">级模型和其他近期模型（例如</text><text x="455.79" y="154.36" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="500.34" y="154.36" font-size="11.00" class="sc-notoserifcjksc">），但</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 141.42 147.86 154.53 161.21 167.10 171.35 174.24" y="169.98" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="180.24" y="169.98" font-size="11.00" class="sc-notoserifcjksc">，其网络安全能力有显著提升。在我们的整个评估套件中，</text><text x="466.24 473.93 476.92 482.53 489.10 495.68 501.64 504.53 510.77 517.20 523.88 530.56 536.44" y="169.98" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="185.60" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="185.60" font-size="11.00" class="sc-notoserifcjksc">显著优于</text><text x="136.48 144.17 147.16 152.77 159.34 165.92 171.88 174.77 181.01 187.45 194.12 200.80 206.68 210.94 213.83" y="185.60" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="219.83" y="185.60" font-size="11.00" class="sc-notoserifcjksc">，但未达到</text><text x="277.72 285.41 288.40 294.01 300.58 307.16 313.12 316.01 324.75 331.31 337.88 342.97 345.87 351.86 354.57" y="185.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="363.46" y="185.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="377.35 385.04 388.03 393.64 400.21 406.79 412.75 415.64 425.57 431.44 435.69 442.28 448.72 453.81 456.70 462.70 465.40" y="185.60" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="472.30" y="185.60" font-size="11.00" class="sc-notoserifcjksc">取得的结果。</text><text x="72.00" y="235.32" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="235.32" font-size="11.00" class="sc-loraregular">3.2</text><text x="103.53" y="235.32" font-size="11.00" class="sc-notoserifcjksc">节中报告的所有能力评估结果，均是在关闭网络安全防护措施的情况下评估</text><text x="469.42 477.11 480.10 485.71 492.28 498.85" y="235.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="507.71" y="235.32" font-size="11.00" class="sc-notoserifcjksc">模型得</text><text x="72.00" y="250.94" font-size="11.00" class="sc-notoserifcjksc">到的。这使我们能够评估底层模型的能力，并反映了某些用户即将可以通过我们的</text><text x="468.00" y="250.94" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证</text><text x="72.00" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">计划（</text><text x="244.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="255.73" y="266.56" font-size="11.00" class="sc-notoserifcjksc">获得的能力水平。自</text><text x="357.63 363.53 370.29 376.19" y="266.56" font-size="11.00" class="sc-loraregular">2026</text><text x="385.45" y="266.56" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="399.34" y="266.56" font-size="11.00" class="sc-loraregular">8</text><text x="408.41" y="266.56" font-size="11.00" class="sc-notoserifcjksc">月以来，我们的许多评估运</text><text x="72.00" y="282.18" font-size="11.00" class="sc-notoserifcjksc">行框架（</text><text x="116.00" y="282.18" font-size="11.00" class="sc-loraregular">harness</text><text x="155.85" y="282.18" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这些情况下，为保持一致性，所有较早的模型都已重新评估，因</text><text x="72.00" y="297.80" font-size="11.00" class="sc-notoserifcjksc">此得到的数字可能与以往的系统卡（</text><text x="248.00 254.18 259.99 265.08 269.34 275.30 285.14 288.03 295.72 301.39 306.08" y="297.80" font-size="11.00" class="sc-loraregular">System Card</text><text x="312.66" y="297.80" font-size="11.00" class="sc-notoserifcjksc">）有所不同。</text><text x="72.00" y="350.06" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39" y="350.06" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 115.03 120.99 127.67 133.52" y="418.83" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="140.11" y="415.16" font-size="6.60" class="sc-loraregular">1</text><text x="145.41" y="418.83" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="324.30" y="418.83" font-size="11.00" class="sc-loraregular">AI</text><text x="337.76" y="418.83" font-size="11.00" class="sc-notoserifcjksc">模型能在软件漏洞利用流程中推进到什么</text><text x="72.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc">程度。我们最近曾</text><text x="160.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细地在此</text><text x="226.00" y="434.45" font-size="11.00" class="sc-notoserifcjksc">介绍过它，在</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.03 371.74" y="434.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="380.63" y="434.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="413.63" y="434.45" font-size="11.00" class="sc-notoserifcjksc">中也有介绍。</text><text x="72.00" y="483.82" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00" y="516.20" font-size="11.00" class="sc-notoserifcjksc">所有试验和所有环境中每次试验的平均捕获标志数；</text><text x="108.00" y="532.39" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50" y="532.39" font-size="11.00" class="sc-notoserifcjksc">，即在随机选取的三次试验子集中每个环境所捕获的可用标志百分比，再对所有环</text><text x="108.00" y="548.01" font-size="11.00" class="sc-notoserifcjksc">境取平均；以及</text><text x="108.00" y="564.77" font-size="11.00" class="sc-notoserifcjksc">在普通组和</text><text x="165.89 172.78 179.35 183.60 189.77 198.16 204.72 211.30 217.33" y="564.77" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="226.18" y="564.77" font-size="11.00" class="sc-notoserifcjksc">组的运行（定义见下文）中生成的完整任意代码执行（</text><text x="490.18 495.86 500.58 506.98 510.25 514.51 519.19 524.87 529.82" y="564.77" font-size="11.00" class="sc-loraregular">arbitrary</text><text x="108.00 113.80 120.23 126.81 132.77 135.67 141.57 147.35 153.25 159.11 165.67 169.93 173.02 179.46" y="580.39" font-size="11.00" class="sc-loraregular">code execution</text><text x="186.13" y="580.39" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="197.13 203.96 211.65" y="580.39" font-size="11.00" class="sc-loraregular">ACE</text><text x="218.49" y="580.39" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00" y="613.35" font-size="11.00" class="sc-notoserifcjksc">每个环境都在两个组别下运行，轮次预算为</text><text x="283.89" y="613.35" font-size="11.00" class="sc-loraregular">300</text><text x="306.58" y="613.35" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。</text><text x="72.00" y="628.97" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 109.77 118.16 124.72 131.30 137.33" y="628.97" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="146.18" y="628.97" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在用完预算之前、且未实现完整代码执行的情况下主动停止，运</text><text x="72.00" y="644.59" font-size="11.00" class="sc-notoserifcjksc">行框架会向对话中注入一条</text><text x="204.00" y="644.59" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="644.59" font-size="11.00" class="sc-notoserifcjksc">继续尝试</text><text x="252.40" y="644.59" font-size="11.00" class="sc-loraregular">”</text><text x="256.24" y="644.59" font-size="11.00" class="sc-notoserifcjksc">提示词，并让它继续。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="187.38" y="707.20" width="154.92" height="12.80" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="468.00" y="242.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="468.00" y="242.14" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="479.00" y="242.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="479.00" y="242.14" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="490.00" y="242.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="490.00" y="242.14" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safegua <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="72.00 79.72 82.85 90.35 93.48 100.98 104.36 114.41 121.97 129.82 137.62 145.64 154.07 162.88 167.87 171.30 179.59 187.78 195.80 204.23 212.03" y="549.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.2.2 CyScenarioBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.35 103.60 109.77 118.16 124.72 131.30 137.33" y="82.61" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="146.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">组中，</text><text x="179.18 186.87 189.86 195.48 202.04 208.62 214.58 217.48 223.71 230.15 236.82 243.50 249.39 253.64 256.54 262.53 265.24" y="82.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="274.12" y="82.61" font-size="11.00" class="sc-notoserifcjksc">平均捕获</text><text x="321.02" y="82.61" font-size="11.00" class="sc-loraregular">11.53</text><text x="346.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="390.75" y="82.61" font-size="11.00" class="sc-loraregular">Cap%</text><text x="423.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="437.04" y="82.61" font-size="11.00" class="sc-loraregular">80%</text><text x="459.62" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。在普通组和</text><text x="72.00 78.89 85.45 89.71 95.88 104.26 110.83 117.41 123.44" y="98.23" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="132.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">组合计中，</text><text x="187.29 194.98 197.97 203.58 210.15 216.73 222.69 225.58 231.82 238.25 244.93 251.61 257.49 261.75 264.64 270.64 273.34" y="98.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="282.23" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="296.12" y="98.23" font-size="11.00" class="sc-loraregular">43.4%</text><text x="329.35" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的情况实现了完整的任意代码执行（</text><text x="505.35" y="98.23" font-size="11.00" class="sc-loraregular">410</text><text x="525.04" y="98.23" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行中有</text><text x="118.89" y="113.85" font-size="11.00" class="sc-loraregular">178</text><text x="137.04" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次）。</text><text x="72.00" y="449.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 104.53 106.62 112.16 115.63 118.00 124.19 127.00 131.71 137.28 142.64 147.48 149.85 155.23 160.33 166.07 171.81 176.65 180.37 182.74 187.60 189.69" y="449.00" font-size="9.00" class="sc-lorabold">3.2.1.A] Claude Sonnet 5.5</text><text x="196.92" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="208.29 213.90 218.83 224.21 227.02 232.11 235.02 238.70 244.65 249.49 255.23 259.89" y="449.00" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="267.85" y="449.00" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="312.85 316.45 324.65 329.51 334.15 339.41" y="449.00" font-size="9.00" class="sc-loraregular">“Mean”</text><text x="342.55" y="449.00" font-size="9.00" class="sc-notoserifcjksc">指每个模型在所有试验和所有环境中捕获能力标志</text><text x="72.00" y="460.70" font-size="9.00" class="sc-notoserifcjksc">的平均数量。</text><text x="126.00" y="460.70" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="156.88" y="460.70" font-size="9.00" class="sc-notoserifcjksc">指在五次试验子集中随机选取的三次试验里，给定环境中所捕获标志占总标志数的百分比，再对</text><text x="72.00" y="472.40" font-size="9.00" class="sc-notoserifcjksc">所有环境取平均。</text><text x="144.00 147.60 152.44 157.82 160.26 162.71 165.08 170.67 176.96 182.56 186.72" y="472.40" font-size="9.00" class="sc-loraregular">“Full ACEs”</text><text x="189.86" y="472.40" font-size="9.00" class="sc-notoserifcjksc">是全部</text><text x="219.23" y="472.40" font-size="9.00" class="sc-loraregular">410</text><text x="235.34" y="472.40" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通组和</text><text x="327.71 333.34 338.71 342.20 347.25 354.11 359.48 364.86 369.79" y="472.40" font-size="9.00" class="sc-loraregular">AutoNudge</text><text x="377.04" y="472.40" font-size="9.00" class="sc-notoserifcjksc">组）中实现任意代码执行的总次数。这些</text><text x="72.00" y="484.10" font-size="9.00" class="sc-notoserifcjksc">结果是在关闭所有网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="574.55" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69" y="574.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="574.55" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56" y="574.55" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00" y="590.17" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动。大多数网络安全基准测试侧重于孤立考察单项能力的短程挑战，而</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="605.79" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69" y="605.79" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的各行动阶段之间对攻击技术进行协调排</text><text x="72.00" y="621.41" font-size="11.00" class="sc-notoserifcjksc">序，包括分支决策、遵守约束，以及从错误和状态不一致中恢复。</text><text x="72.00" y="687.89" font-size="11.00" class="sc-notoserifcjksc">我们运行了</text><text x="129.89 137.58 143.39 149.63 155.42 161.39 168.06 173.74 178.50 181.59 187.76 194.61 200.57 207.25 213.10" y="687.89" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="222.58" y="687.89" font-size="11.00" class="sc-notoserifcjksc">评估集中由</text><text x="280.47" y="687.89" font-size="11.00" class="sc-loraregular">10</text><text x="294.20" y="687.89" font-size="11.00" class="sc-notoserifcjksc">个挑战组成的子集：</text><text x="393.20 399.23 405.14 411.57 421.40 427.29 431.55 436.50 442.30 450.32 453.32 459.28 464.37 469.46 475.90" y="687.89" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="482.58" y="687.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="527.80" y="687.89" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77" y="703.51" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="703.51" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.85 303.13 308.94 316.96 322.81 327.57 330.67 335.76 338.85" y="703.51" font-size="11.00" class="sc-loraregular">identity_crisis</text><text x="343.94" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94 360.03 363.13 369.47 375.96 380.22 388.24 392.50 398.46 403.55" y="703.51" font-size="11.00" class="sc-loraregular">sight_test</text><text x="407.81" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81 428.64 435.21 439.47 442.56 449.16" y="703.51" font-size="11.00" class="sc-loraregular">mutiny</text><text x="454.96" y="703.51" font-size="11.00" class="sc-notoserifcjksc">、</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">26</text><text x="72.00 78.59 85.02 91.59 98.17 101.26 107.94 111.03 119.05 125.61 130.30 136.74 140.99 147.43 153.22 159.66" y="82.61" font-size="11.00" class="sc-loraregular">houdini_protocol</text><text x="165.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="179.44 185.29 189.97 196.41 201.50 206.60 212.50 219.08 227.10 235.91 239.00 243.69 249.65" y="82.61" font-size="11.00" class="sc-loraregular">crossed_wires</text><text x="254.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。我们报告每个模型在这</text><text x="378.64" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="392.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个挑战上的平均解决率。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="131.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="131.19" font-size="11.00" class="sc-notoserifcjksc">完成了全部挑战的</text><text x="257.83" y="131.19" font-size="11.00" class="sc-loraregular">46.1%</text><text x="286.43" y="131.19" font-size="11.00" class="sc-notoserifcjksc">，相较</text><text x="322.33 330.02 333.01 338.62 345.19 351.76 357.73 360.62 366.86 373.29 379.97 386.64 392.53 396.79 399.68" y="131.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="408.57" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="422.46 429.12 431.47 436.54" y="131.19" font-size="11.00" class="sc-loraregular">0.7%</text><text x="449.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">有显著提升。相比</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">之下，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 190.35 193.06" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="199.95" y="146.81" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="235.85 242.20 246.21 248.56 253.63" y="146.81" font-size="11.00" class="sc-loraregular">61.7%</text><text x="266.10" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的任务，</text><text x="310.10 317.78 320.78 326.39 332.95 339.53 345.49 348.39 357.12 363.69 370.25 375.35 378.24 384.24 386.94" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="395.83" y="146.81" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="431.72 438.00 442.59 445.19 451.54" y="146.81" font-size="11.00" class="sc-loraregular">67.6%</text><text x="461.11" y="146.81" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="497.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 105.67 107.77 113.30 116.78 119.14 125.33 128.14 132.86 138.42 143.78 148.63 150.99 156.38 161.47 167.21 172.95 177.79 181.51 183.88 188.74 190.84" y="497.58" font-size="9.00" class="sc-lorabold">3.2.2.A] Claude Sonnet 5.5</text><text x="198.06" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="209.43 215.62 220.58 225.96 230.62 235.47 241.21 245.93 250.25 253.19 258.06 264.01 268.85 274.59 279.25" y="497.58" font-size="9.00" class="sc-lorabold">CyScenarioBench</text><text x="287.21" y="497.58" font-size="9.00" class="sc-notoserifcjkscbold">上的得分。</text><text x="332.21" y="497.58" font-size="9.00" class="sc-notoserifcjksc">柱形表示每个模型的总体解决率，为我们子集中</text><text x="523.58" y="497.58" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="509.28" font-size="9.00" class="sc-notoserifcjksc">个挑战的平均值。本评估在关闭网络安全缓解措施的情况下运行。</text><text x="72.00" y="541.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.2.3 Binary Exploitation Benchmark</text><text x="307.92" y="541.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原</text><text x="337.02" y="541.17" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="398.68" y="541.17" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="573.06" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现能力，以及模型针对自己发现的漏洞，能在多大程度上推进到可用</text><text x="72.00" y="588.68" font-size="11.00" class="sc-notoserifcjksc">的概念验证（</text><text x="138.00 144.57 149.25 155.69 162.07 165.68 171.05 177.43 181.04 186.42 192.22 198.65 205.33 211.13 217.09 223.66" y="588.68" font-size="11.00" class="sc-loraregular">proof-of-concept</text><text x="227.91" y="588.68" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用。每项任务以某个开源项目中的单个函数作为入口点</text><text x="72.00" y="604.30" font-size="11.00" class="sc-notoserifcjksc">提供给模型，要求模型找到一个漏洞并为该漏洞编写漏洞利用。模型不会得到任何关于漏洞可能</text><text x="72.00" y="619.92" font-size="11.00" class="sc-notoserifcjksc">位于何处的提示。这</text><text x="173.89" y="619.92" font-size="11.00" class="sc-loraregular">831</text><text x="193.10" y="619.92" font-size="11.00" class="sc-notoserifcjksc">个入口点覆盖了</text><text x="272.99 281.36 287.80 294.23 300.58 303.57" y="619.92" font-size="11.00" class="sc-loraregular">Google</text><text x="312.43" y="619.92" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="326.32 335.05 341.29 347.53 352.91 358.83 365.39 370.95" y="619.92" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="379.47" y="619.92" font-size="11.00" class="sc-notoserifcjksc">语料库中的</text><text x="437.37" y="619.92" font-size="11.00" class="sc-loraregular">228</text><text x="458.25" y="619.92" font-size="11.00" class="sc-notoserifcjksc">个项目。</text><text x="72.00" y="686.40" font-size="11.00" class="sc-notoserifcjksc">每次试验按五级阶梯计分，从内存安全崩溃（</text><text x="292.00 298.65 301.36" y="686.40" font-size="11.00" class="sc-loraregular">0.2</text><text x="307.27" y="686.40" font-size="11.00" class="sc-notoserifcjksc">）到控制流劫持（</text><text x="395.27 399.27 401.81" y="686.40" font-size="11.00" class="sc-loraregular">1.0</text><text x="408.64" y="686.40" font-size="11.00" class="sc-notoserifcjksc">）。正如</text><text x="455.54 463.23 466.22 471.83 478.39 484.97 490.93 493.83 502.56 509.13 515.70 520.79 523.68 529.68 532.38" y="686.40" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="72.00" y="702.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00" y="702.02" font-size="11.00" class="sc-notoserifcjksc">中所述，自</text><text x="162.89 168.80 175.55 181.46" y="702.02" font-size="11.00" class="sc-loraregular">2026</text><text x="190.71" y="702.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="204.61" y="702.02" font-size="11.00" class="sc-loraregular">8</text><text x="213.68" y="702.02" font-size="11.00" class="sc-notoserifcjksc">月起，我们一直在为本评估使用新的</text><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="455.54" y="677.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="455.54" y="677.60" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="490.94" y="677.60" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="493.83" y="677.60" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094 ize="11.00" class="sc-loraregular">106</text><text x="235.71" y="163.00" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="257.71 265.40 268.39 274.00 280.57 287.15 293.11 296.00 302.24 308.68 315.35 322.03 327.92 332.17 335.07" y="163.00" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="343.95" y="163.00" font-size="11.00" class="sc-notoserifcjksc">实现了</text><text x="379.85" y="163.00" font-size="11.00" class="sc-loraregular">3</text><text x="388.87" y="163.00" font-size="11.00" class="sc-notoserifcjksc">次。漏洞识别方面相较</text><text x="501.76 509.45 512.44 518.05 524.62 531.20" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="178.62" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="178.62" font-size="11.00" class="sc-notoserifcjksc">也有类似提升，但不及</text><text x="232.84 240.53 243.52 249.13 255.70 262.28 268.24 271.13 281.07 286.93 291.19 297.78 304.21 309.30 312.20 318.19 320.90" y="178.62" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="327.79" y="178.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="341.69 349.38 352.37 357.98 364.54 371.12 377.08 379.98 388.71 395.28 401.85 406.94 409.83 415.83 418.53" y="178.62" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="424.53" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="527.52" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="527.52" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 105.91 108.01 113.54" y="527.52" font-size="9.00" class="sc-lorabold">3.2.3.A]</text><text x="119.38" y="527.52" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.75 136.59 139.54 145.28 149.99 154.43 159.39 161.76 167.37 172.30 177.68 180.49 185.58 188.49 192.20 196.88 200.60 203.54 208.64 214.38 216.75 222.70 227.54 233.28 237.94 243.53 251.81 256.53 260.77" y="527.52" font-size="9.00" class="sc-lorabold">Binary Exploitation Benchmark</text><text x="268.48" y="527.52" font-size="9.00" class="sc-notoserifcjkscbold">上，</text><text x="286.48" y="527.52" font-size="9.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="365.40" y="527.52" font-size="9.00" class="sc-notoserifcjkscbold">相较</text><text x="385.77" y="527.52" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="457.73" y="527.52" font-size="9.00" class="sc-notoserifcjkscbold">有显著提升。</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 116.56 122.37" y="599.54" font-size="11.00" class="sc-loraregular">ExploitGym</text><text x="135.10" y="599.54" font-size="11.00" class="sc-notoserifcjksc">是一个大规模公开基准测试，用于衡量</text><text x="324.99" y="599.54" font-size="11.00" class="sc-loraregular">AI</text><text x="338.45" y="599.54" font-size="11.00" class="sc-notoserifcjksc">智能体能否将已知漏洞转化为可实现未授</text><text x="72.00" y="615.16" font-size="11.00" class="sc-notoserifcjksc">权代码执行的有效漏洞利用，以及它们能否读取存放在智能体授权范围之外、动态生成的秘密标</text><text x="72.00" y="630.78" font-size="11.00" class="sc-notoserifcjksc">志。</text><text x="72.00" y="680.50" font-size="11.00" class="sc-notoserifcjksc">该基准测试包含</text><text x="151.89" y="680.50" font-size="11.00" class="sc-loraregular">869</text><text x="173.68" y="680.50" font-size="11.00" class="sc-notoserifcjksc">个真实漏洞实例，涵盖三个领域：</text><text x="338.68 344.68 351.43" y="680.50" font-size="11.00" class="sc-loraregular">502</text><text x="360.23" y="680.50" font-size="11.00" class="sc-notoserifcjksc">个取自开源项目和</text><text x="451.13 458.82 466.00 472.60 480.19 488.92 495.16" y="680.50" font-size="11.00" class="sc-loraregular">CVE/OSV</text><text x="505.24" y="680.50" font-size="11.00" class="sc-notoserifcjksc">记录的</text><text x="72.00" y="696.12" font-size="11.00" class="sc-notoserifcjksc">用户态目标、</text><text x="138.00" y="696.12" font-size="11.00" class="sc-loraregular">181</text><text x="155.08" y="696.12" font-size="11.00" class="sc-notoserifcjksc">个位于</text><text x="190.98 198.67 205.25 209.94 216.38 226.21" y="696.12" font-size="11.00" class="sc-loraregular">Chrome</text><text x="235.06" y="696.12" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="248.96 256.14 262.32 265.22 269.15 274.70 280.14 285.82 292.05 297.91 302.67 305.76 312.33" y="696.12" font-size="11.00" class="sc-loraregular">V8 JavaScript</text><text x="319.48" y="696.12" font-size="11.00" class="sc-notoserifcjksc">引擎中的目标，以及</text><text x="421.37" y="696.12" font-size="11.00" class="sc-loraregular">186</text><text x="440.81" y="696.12" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="454.70" y="696.12" font-size="11.00" class="sc-loraregular">Linux</text><text x="486.12" y="696.12" font-size="11.00" class="sc-notoserifcjksc">内核目</text><text x="72.00" y="711.74" font-size="11.00" class="sc-notoserifcjksc">标。对于每个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p028.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 28 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">28</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例，智能体会获得存在漏洞的源代码和构建配置、一个触发该缺陷的漏洞验证输入，以及一个</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用于与目标交互的容器化运行环境。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">任务是开发一个漏洞利用，实现未授权代码执行，并读取存放在智能体授权范围之外、动态生成</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的秘密标志。我们在评估所有任务时都禁用了</text><text x="294.89" y="163.00" font-size="11.00" class="sc-loraregular">ASLR</text><text x="321.28" y="163.00" font-size="11.00" class="sc-notoserifcjksc">、栈金丝雀（</text><text x="387.28 392.38 396.63 402.31 408.16 414.07 416.96 422.79 428.47 435.14 440.82 445.58 448.67 454.63" y="163.00" font-size="11.00" class="sc-loraregular">stack canaries</text><text x="459.73" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="481.73" y="163.00" font-size="11.00" class="sc-loraregular">KASLR</text><text x="518.52" y="163.00" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="178.62" font-size="11.00" class="sc-loraregular">V8</text><text x="99.26" y="178.62" font-size="11.00" class="sc-notoserifcjksc">沙箱逃逸任务除外）</text><text x="198.26" y="178.62" font-size="11.00" class="sc-loraregular">V8</text><text x="214.52" y="178.62" font-size="11.00" class="sc-notoserifcjksc">堆沙箱；内核目标保持启用</text><text x="349.41 355.65 365.74 372.59 378.34 385.93 392.17 402.26 409.15" y="178.62" font-size="11.00" class="sc-loraregular">SMEP/SMAP</text><text x="415.82" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="441.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="441.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 105.79 107.89 113.43" y="441.46" font-size="9.00" class="sc-lorabold">3.2.4.A]</text><text x="119.27" y="441.46" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.63 136.25 141.18 146.56 149.36 154.46 157.36 161.04 167.76 172.72" y="441.46" font-size="9.00" class="sc-lorabold">ExploitGym</text><text x="183.37" y="441.46" font-size="9.00" class="sc-notoserifcjkscbold">上，</text><text x="201.37" y="441.46" font-size="9.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="280.29" y="441.46" font-size="9.00" class="sc-notoserifcjkscbold">相比</text><text x="300.65" y="441.46" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="372.62" y="441.46" font-size="9.00" class="sc-notoserifcjkscbold">有大幅提升，并接近</text><text x="455.99 462.18 464.99 469.70 475.26 480.63 485.47 487.84 496.28 501.24 504.95 510.54 515.64" y="441.46" font-size="9.00" class="sc-lorabold">Claude Mythos</text><text x="72.00" y="453.16" font-size="9.00" class="sc-lorabold">5.1</text><text x="82.61" y="453.16" font-size="9.00" class="sc-notoserifcjksc">。柱形表示在两小时和六小时实际耗时预算下，利用给定漏洞成功完成漏洞利用的数量。成功的条件是获取一个动</text><text x="72.00" y="464.86" font-size="9.00" class="sc-notoserifcjksc">态生成的秘密标志，且每个成功的漏洞利用都经过智能体评判者验证，以确认其使用的是预期的漏洞。</text><text x="72.00" y="514.60" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="514.60" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施</text><text x="72.00" y="541.16" font-size="11.00" class="sc-notoserifcjksc">如上文所述，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 182.53 188.96 195.64 202.32 208.20 212.46 215.35 221.35 224.05" y="541.16" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="232.94" y="541.16" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力相比</text><text x="334.83 342.52 345.51 351.12 357.69 364.27 370.23 373.12 379.36 385.80 392.47 399.15 405.04 409.29 412.19" y="541.16" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="421.07" y="541.16" font-size="11.00" class="sc-notoserifcjksc">有显著提升，但尚未达</text><text x="72.00" y="556.78" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="556.78" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="171.63" y="556.78" font-size="11.00" class="sc-notoserifcjksc">的水平。因此，我们已将其面向公众发布，并配备了执行与</text><text x="460.52 468.21 471.20 476.81 483.38 489.96 495.92 498.81 507.55 514.11 520.68 525.77 528.66" y="556.78" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00" y="572.40" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="572.40" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="171.63" y="572.40" font-size="11.00" class="sc-notoserifcjksc">相同政策的网络安全防护措施。这些安全防护措施与</text><text x="427.52 433.76 440.19 446.87 453.55 459.43 463.69 466.58" y="572.40" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="475.47" y="572.40" font-size="11.00" class="sc-notoserifcjksc">上的相比有</text><text x="72.00" y="588.02" font-size="11.00" class="sc-notoserifcjksc">重大变化，用户应预期</text><text x="184.89 191.13 197.57 204.24 210.92 216.80 221.06 223.95 229.95 232.65" y="588.02" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="241.54" y="588.02" font-size="11.00" class="sc-notoserifcjksc">的拒绝会增多，即便是在良性的网络安全相关任务上也是如</text><text x="72.00" y="603.64" font-size="11.00" class="sc-notoserifcjksc">此。此处描述的安全防护措施适用于正式发布的模型；经验证的网络安全用户很快将能够通过我</text><text x="72.00" y="619.26" font-size="11.00" class="sc-notoserifcjksc">们的</text><text x="94.00" y="619.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="182.00" y="619.26" font-size="11.00" class="sc-notoserifcjksc">访问限制更少的同一模型。</text><text x="72.00" y="686.89" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="686.89" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="171.63" y="686.89" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="204.63 212.32 215.31 220.92 227.49 234.06 240.03 242.92 249.16 255.59 262.27 268.94 274.83 279.09 281.98 287.97 290.68" y="686.89" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="299.57" y="686.89" font-size="11.00" class="sc-notoserifcjksc">采用三个阶段来防止有害的网络安全使用：一个</text><text x="72.00" y="702.51" font-size="11.00" class="sc-notoserifcjksc">检查</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="702.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="702.51" font-size="11.00" class="sc-notoserifcjksc">内部激活值的探针、一个在</text><text x="270.08 277.77 280.76 286.37 292.93 299.51" y="702.51" font-size="11.00" class="sc-loraregular">Claude</text><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="94.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="94.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="105.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="105.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="116.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="116.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="127.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="127.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="138.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="138.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="149.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="149.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="160.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="160.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="171.00" y="610.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/14604842-real-time-cyber-safeguards-on-claude-opus-and-sonnet" rel="noopener"><rect x="171.00" y="610.46" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p029.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 29 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">29</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="82.61" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">自身上运行的轻量级分类器，以及一个经过训练的</text><text x="373.54" y="82.61" font-size="11.00" class="sc-loraregular">LLM</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">型，它结合探针的判定来决定是否应拦截某段对话。这一方法以及我们训练网络安全分类器的方</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">式，详见</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.03 195.74" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="204.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="251.52" y="113.85" font-size="11.00" class="sc-loraregular">3.2</text><text x="269.15" y="113.85" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络使用，包括被视为两用的活动（即可能具有进攻性或防</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">御性用途的活动）。与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="261.93" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.82 283.51 286.50 292.11 298.68 305.26 311.22 314.11 322.84 329.41 335.98 341.07 343.96 349.96 352.67" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="361.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">一样，我们的政策允许在源代码中进</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">行漏洞发现，因此开发者可以使用</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 284.42 290.86 297.53 304.21 310.10 314.35 317.25 323.24 325.95" y="178.62" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="334.83" y="178.62" font-size="11.00" class="sc-notoserifcjksc">来帮助编写更安全的软件，但该政策会拦</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">截在已编译二进制文件中进行的漏洞发现。作出这一区分的原因详见</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 451.92 458.49 465.05 470.14 473.04 479.03 481.74" y="194.24" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="490.63" y="194.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="523.63" y="194.24" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="209.86" font-size="11.00" class="sc-loraregular">3.4</text><text x="89.69" y="209.86" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在大多数界面上，对于被我们的网络安全分类器系统拦截的请求，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 435.53 441.96 448.64 455.32 461.20 465.46 468.35 474.35 477.05" y="260.72" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="485.94" y="260.72" font-size="11.00" class="sc-notoserifcjksc">会回退</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="276.34" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21" y="276.34" font-size="11.00" class="sc-notoserifcjksc">）到</text><text x="147.11 154.80 157.79 163.40 169.97 176.54 182.51 185.40 191.64 198.07 204.75 211.42 217.31 221.57 224.46" y="276.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="230.45" y="276.34" font-size="11.00" class="sc-notoserifcjksc">。这在我们自己的应用中会自动发生；在</text><text x="431.35 438.23 444.84" y="276.34" font-size="11.00" class="sc-loraregular">API</text><text x="451.42" y="276.34" font-size="11.00" class="sc-notoserifcjksc">上，开发者必须主</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">动选择启用自动回退。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">对于其网络安全用例可能被我们的网络安全防护措施拦截的用户，我们建议通过我们即将推出的</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">更新版</text><text x="105.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="193.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">，在网络安全拦截分类器有所放宽的条件下访问我们的模型。</text><text x="490.00 497.69 500.68 506.29 512.86 519.44" y="341.11" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="356.73" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="356.73" font-size="11.00" class="sc-notoserifcjksc">将在不久的将来通过该计划提供。</text><text x="72.00" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.1</text><text x="102.13" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖率</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="436.68" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="436.68" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截危害潜力不对称的网络活动（即所使用的特定技能对攻</text><text x="72.00" y="452.30" font-size="11.00" class="sc-notoserifcjksc">击者的帮助大于对防御者的帮助）。正如我们</text><text x="292.00" y="452.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前所述</text><text x="336.00" y="452.30" font-size="11.00" class="sc-notoserifcjksc">，这一类别既涵盖禁止使用层级，也涵盖</text><text x="72.00" y="467.92" font-size="11.00" class="sc-notoserifcjksc">全面开放情况下的高风险两用层级。</text><text x="72.00" y="517.64" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现了这些类别的分类器覆盖率结果。</text><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="105.05" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="154.29" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="157.18" y="105.05" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="184.14" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="187.04" y="105.05" width="14.70" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="201.73" y="105.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rect x="204.63" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf" rel="noopener"><rec ansparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40" y="367.93" font-size="9.00" class="sc-lorabold">3.3.1.A]</text><text x="118.24" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">在我们的网络危害覆盖测试集上，</text><text x="253.24" y="367.93" font-size="9.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="332.16" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">的安全防护措施保持了与</text><text x="433.53" y="367.93" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="497.23" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">相当的高</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">召回率（被标记的有害示例所占比例），覆盖率略低于</text><text x="290.37 296.56 299.37 304.08 309.65 315.01 319.85 322.22 326.99 331.70 336.83 339.63 344.48 346.84 351.70 353.80" y="379.63" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="359.82" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="371.19" y="379.63" font-size="9.00" class="sc-lorabold">Opus 5.5</text><text x="407.63" y="379.63" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="416.63" y="379.63" font-size="9.00" class="sc-notoserifcjksc">它相比</text><text x="445.99 451.10 456.36 461.83 467.29 472.10 475.59 477.95" y="379.63" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="485.23" y="379.63" font-size="9.00" class="sc-notoserifcjksc">有显著提升。</text><text x="72.00" y="424.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.2</text><text x="104.89" y="424.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="456.65" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="456.65" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（即</text><text x="366.24" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="370.64" y="456.65" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="392.64" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="396.48" y="456.65" font-size="11.00" class="sc-notoserifcjksc">）的能力，这里的</text><text x="484.48" y="456.65" font-size="11.00" class="sc-loraregular">“</text><text x="488.88" y="456.65" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="510.88" y="456.65" font-size="11.00" class="sc-loraregular">”</text><text x="514.72" y="456.65" font-size="11.00" class="sc-notoserifcjksc">包括</text><text x="72.00" y="472.27" font-size="11.00" class="sc-notoserifcjksc">提示词、自定义运行框架和多智能体流水线。</text><text x="72.00" y="521.42" font-size="11.00" class="sc-notoserifcjksc">为测试鲁棒性，我们维护着一项名为</text><text x="250.89 255.58 261.50 270.31 273.40 280.08 286.65 292.03 297.63 302.00 306.26 311.93 317.78 323.61 329.58" y="521.42" font-size="11.00" class="sc-loraregular">rewind-attacker</text><text x="337.23" y="521.42" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全</text><text x="72.00" y="537.04" font-size="11.00" class="sc-notoserifcjksc">防护的模型（</text><text x="138.00" y="537.04" font-size="11.00" class="sc-loraitalic">“</text><text x="142.27" y="537.04" font-size="11.00" class="sc-notoserifcjksc">助手</text><text x="164.27" y="537.04" font-size="11.00" class="sc-loraitalic">”</text><text x="168.36" y="537.04" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器（</text><text x="278.36" y="537.04" font-size="11.00" class="sc-loraregular">“</text><text x="282.76" y="537.04" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="315.76" y="537.04" font-size="11.00" class="sc-loraitalic">”</text><text x="319.85" y="537.04" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有</text><text x="72.00" y="552.66" font-size="11.00" class="sc-notoserifcjksc">用（</text><text x="94.00 100.59 106.55 109.54 116.06 119.77 126.34 129.33 134.71 141.15 147.82 150.76" y="552.66" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="156.57" y="552.66" font-size="11.00" class="sc-notoserifcjksc">）语言模型，被提示去模拟一名试图从助手身上引出进攻性网络能力的人类红</text><text x="72.00" y="568.28" font-size="11.00" class="sc-notoserifcjksc">队成员。</text><text x="72.00" y="618.57" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个会话中被启动，在该会话中，它可以向一个在任务沙箱内运行助手模型（带有生产</text><text x="72.00" y="634.19" font-size="11.00" class="sc-notoserifcjksc">环境安全防护措施）的</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 230.87 237.31 243.89" y="634.19" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="252.74" y="634.19" font-size="11.00" class="sc-notoserifcjksc">智能体发送指令。随后，攻击者针对助手有</text><text x="464.63" y="634.19" font-size="11.00" class="sc-loraregular">400</text><text x="487.15" y="634.19" font-size="11.00" class="sc-notoserifcjksc">次调用的</text><text x="72.00" y="649.81" font-size="11.00" class="sc-notoserifcjksc">上限，在此期间攻击者会收到拦截反馈，并有机会回溯到先前的状态以尝试新的方法。每个任务</text><text x="72.00" y="665.43" font-size="11.00" class="sc-notoserifcjksc">都将智能体置于一个独立的</text><text x="206.89 215.09 221.52 227.38 233.21 239.17" y="665.43" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00" y="681.05" font-size="11.00" class="sc-notoserifcjksc">受害者目录、用攻击者控制的公钥封装加密密钥，并向一台</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p031.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 31 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">31</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">命令与控制（</text><text x="138.00 143.80 150.23 160.07 169.90 175.58 182.25 188.83 194.21 199.89 206.56 213.14 218.52 224.32 230.75 237.33 241.59 246.27 252.71" y="82.61" font-size="11.00" class="sc-loraregular">command-and-control</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">成的自动化检查。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务集包括以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="470.89 478.98 487.36" y="131.19" font-size="11.00" class="sc-loraregular">DNS</text><text x="493.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00 102.68 108.64 115.04 121.63 128.07 134.50" y="146.81" font-size="11.00" class="sc-loraregular">webhook</text><text x="143.30" y="146.81" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20" y="146.81" font-size="11.00" class="sc-loraregular">CVE</text><text x="376.91" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（包括</text><text x="412.80 419.48 425.83 428.92 435.59" y="146.81" font-size="11.00" class="sc-loraregular">nginx</text><text x="441.42" y="146.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="452.42" y="146.81" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="499.20" y="146.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="510.20 516.54 519.54 522.63 529.03" y="146.81" font-size="11.00" class="sc-loraregular">glibc</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="162.43" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="135.50" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）的远程和本地利用；命令与控制；以及自我复制。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 193.53 199.96 206.64 213.32 219.20 223.46 226.35 232.35 235.05" y="212.15" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="243.94" y="212.15" font-size="11.00" class="sc-notoserifcjksc">的对抗鲁棒性相比</text><text x="334.83 342.52 345.51 351.12 357.69 364.27 370.23 373.12 379.36 385.80 392.47 399.15 405.04 409.29 412.19" y="212.15" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="421.07" y="212.15" font-size="11.00" class="sc-notoserifcjksc">有显著提升。不过，由</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 130.42 136.86 143.53 150.21 156.10 160.35 163.24 169.24 171.95" y="227.77" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="180.83" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力不及我们的前沿模型，我们选择了较为宽松的对抗鲁棒</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">性，同时保持同等水平的高网络危害召回率。</text><text x="72.00" y="572.23" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="572.23" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 105.91 108.01 113.54" y="572.23" font-size="9.00" class="sc-lorabold">3.3.2.A]</text><text x="119.38" y="572.23" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="130.75" y="572.23" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="202.72" y="572.23" font-size="9.00" class="sc-notoserifcjkscbold">相比，</text><text x="229.72" y="572.23" font-size="9.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="308.64" y="572.23" font-size="9.00" class="sc-notoserifcjkscbold">的对抗鲁棒性显著提升，</text><text x="407.64" y="572.23" font-size="9.00" class="sc-notoserifcjksc">但其鲁棒性不及</text><text x="473.00" y="572.23" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="504.70" y="572.23" font-size="9.00" class="sc-notoserifcjksc">或</text><text x="516.07 520.64 525.29 530.52 532.97" y="572.23" font-size="9.00" class="sc-loraregular">Fable</text><text x="72.00" y="583.93" font-size="9.00" class="sc-loraregular">5.1</text><text x="82.40" y="583.93" font-size="9.00" class="sc-notoserifcjksc">。</text></svg></div>
