.95" y="419.08" font-size="9.00" class="sc-loraregular sc-k">Surge AI</text><text x="201.42" y="419.08" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果，在不使用工具的条件下评估。</text><text x="72.00" y="448.41" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="448.41" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="172.13" y="448.41" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="205.13" y="448.41" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="300.07" y="448.41" font-size="11.00" class="sc-notoserifcjksc">在视觉推理和工具使用能力上有显著提升，并与</text><text x="72.00" y="464.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="464.03" font-size="11.00" class="sc-notoserifcjksc">不相上下。无论是否使用工具，</text><text x="311.73" y="464.03" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="368.38" y="464.03" font-size="11.00" class="sc-notoserifcjksc">都在较低成本区间扩展了得分</text><text x="511.38" y="464.03" font-size="11.00" class="sc-loraregular">–</text><text x="517.87" y="464.03" font-size="11.00" class="sc-notoserifcjksc">成本</text><text x="72.00" y="479.65" font-size="11.00" class="sc-notoserifcjksc">前沿，同时在较高推理强度档位上保持竞争力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.32 109.70 117.89 125.91 134.34 142.14 150.57 160.62 169.68" y="497.33" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.2 BenchCAD</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">18</text><text x="80.18 86.28 92.27 97.43 103.50 109.02 111.55 114.18 121.98 124.44 126.97 129.60 134.94 138.81 141.44 146.60 149.32 151.78 154.41 157.45 162.82 168.96 174.33 179.99 183.03 185.49 188.12 194.34 199.76 205.83 211.14 217.01 223.90 230.16 237.60 240.10 242.73 248.99 251.62 256.88 262.73 271.67 277.64 281.90 287.31 293.30 298.72 304.79 309.41 312.22 317.22 322.64 325.17 327.80 330.61 336.67 342.65 348.62 353.25 357.12 361.61 366.89 371.78 376.41 380.28 385.43 391.50 397.48 402.64 406.90 412.87 415.50 421.32 426.74 432.81 438.12 444.11 453.05 458.21 462.49 467.86 470.49 473.82 479.67" y="704.45" font-size="10.00" class="sc-loraregular">Zhang, H., et al. (2026). BenchCAD: A comprehensive, industry-standard benchmark for</text><text x="72.00 77.97 82.23 88.07 93.60 97.86 103.02 111.95 120.89 125.98 129.85 132.66 137.97 140.60 147.49 153.75 160.95 163.41 166.04 171.20 174.91 181.40 184.21 189.25 191.75 197.12 202.90 209.11 214.55 217.01 220.65 226.86 232.48 238.25 243.70" y="717.26" font-size="10.00" class="sc-loraregular">programmatic CAD. arXiv:2605.10865.</text><text x="248.79 254.69 258.66 262.52 268.49 273.12 275.62 279.31 285.76 290.92 295.25 300.55 303.36 308.01 310.47 316.32 320.60 326.13 332.58 337.74 343.56 347.84 354.74 360.10 365.88 372.09 377.54 380.00 383.63 389.84 395.46 401.24" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.10865</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00" y="423.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="423.43" font-size="9.00" class="sc-lorabold sc-k">8.13.1.B]</text><text x="122.00" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="214.37" y="423.43" font-size="9.00" class="sc-lorabold sc-k">Chartography</text><text x="276.15" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="303.15" y="423.43" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考、采用不同推理强度档位的条件下，</text><text x="72.00" y="435.13" font-size="9.00" class="sc-notoserifcjksc">分别在使用和不使用工具的情况下接受评估。我们使用</text><text x="290.37" y="435.13" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="316.45" y="435.13" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">度档位下五次运行的平均值，并显示</text><text x="218.37" y="446.83" font-size="9.00" class="sc-loraregular">95%</text><text x="238.67" y="446.83" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按</text><text x="313.04" y="446.83" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="329.46" y="446.83" font-size="9.00" class="sc-notoserifcjksc">标准定价计费，并采用每次运行的实际缓存使用情</text><text x="72.00" y="458.53" font-size="9.00" class="sc-notoserifcjksc">况。</text><text x="72.00" y="525.19" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="126.45" y="521.52" font-size="6.60" class="sc-loraregular">18</text><text x="135.45" y="525.19" font-size="11.00" class="sc-notoserifcjksc">是一项程序化</text><text x="204.35" y="525.19" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="229.90" y="525.19" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="320.79 324.80 329.38 332.16 338.51 345.35" y="525.19" font-size="11.00" class="sc-loraregular">17,900</text><text x="355.08" y="525.19" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="434.97" y="525.19" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="489.73" y="525.19" font-size="11.00" class="sc-notoserifcjksc">程序构建</text><text x="72.00" y="540.81" font-size="11.00" class="sc-notoserifcjksc">而成，涵盖</text><text x="129.89" y="540.81" font-size="11.00" class="sc-loraregular">106</text><text x="149.98" y="540.81" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="339.87" y="540.81" font-size="11.00" class="sc-loraregular">ISO</text><text x="358.53" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.53" y="540.81" font-size="11.00" class="sc-loraregular sc-k">DIN</text><text x="389.68" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.68" y="540.81" font-size="11.00" class="sc-loraregular">EN</text><text x="415.90" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="426.90" y="540.81" font-size="11.00" class="sc-loraregular">ASME</text><text x="459.86" y="540.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="473.75" y="540.81" font-size="11.00" class="sc-loraregular">IEC</text><text x="494.86" y="540.81" font-size="11.00" class="sc-notoserifcjksc">规格表为</text><text x="72.00" y="556.43" font-size="11.00" class="sc-notoserifcjksc">依据。该基准测试将</text><text x="173.89" y="556.43" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="199.45" y="556.43" font-size="11.00" class="sc-notoserifcjksc">能力分解为四项相互匹配的任务；我们报告</text><text x="411.34" y="556.43" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="478.21" y="556.43" font-size="11.00" class="sc-notoserifcjksc">任务上的结</text><text x="72.00" y="572.05" font-size="11.00" class="sc-notoserifcjksc">果，该任务要求模型根据多视图渲染图生成</text><text x="283.89" y="572.05" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="338.65" y="572.05" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="638.75" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="638.75" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="638.75" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="654.37" font-size="11.00" class="sc-notoserifcjksc">评估时，模型会获得一个装有图像文件和标准库的容器，以及一个图像裁剪工具。</text><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="248.79" y="707.20" width="157.90" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们在已发布的</text><text x="151.89 155.90 160.48 163.26 169.61 176.45" y="82.61" font-size="11.00" class="sc-loraregular">17,900</text><text x="186.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="200.07" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="266.94" y="82.61" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="346.84 350.84 353.45 360.28 367.11" y="82.61" font-size="11.00" class="sc-loraregular">1,000</text><text x="376.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个文件组成子集，对模型进行评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">估；根据以往经验，该子集的得分能够反映完整题集上的得分，误差在</text><text x="415.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">0.01</text><text x="438.82" y="98.23" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="463.71" y="98.23" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="481.64" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="492.64" y="98.23" font-size="11.00" class="sc-loraregular sc-k">voxel</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="89.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）以内。我们报告五次运行的平均体素</text><text x="279.82" y="113.85" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="300.65" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分数。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="210.11" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="147.38" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="147.38" font-size="11.00" class="sc-notoserifcjksc">个文件子集上，</text><text x="331.01" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="425.95" y="147.38" font-size="11.00" class="sc-notoserifcjksc">不使用工具的体素</text><text x="516.84" y="147.38" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">分数为</text><text x="107.89" y="163.00" font-size="11.00" class="sc-loraregular sc-k">0.747</text><text x="132.85" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，使用工具为</text><text x="201.75" y="163.00" font-size="11.00" class="sc-loraregular sc-k">0.963</text><text x="229.95" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="240.95" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="326.68" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="395.58" y="163.00" font-size="11.00" class="sc-loraregular sc-k">0.730</text><text x="425.51" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="439.40" y="163.00" font-size="11.00" class="sc-loraregular sc-k">0.962</text><text x="467.38" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="492.28" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="178.62" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="186.00" y="178.62" font-size="11.00" class="sc-loraregular sc-k">0.606</text><text x="217.70" y="178.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="231.59" y="178.62" font-size="11.00" class="sc-loraregular sc-k">0.926</text><text x="259.57" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="518.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="518.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.67 111.77 117.31 120.78 123.15 129.10 133.94 139.68 144.34 149.81 155.94 161.96 168.79 171.15 177.29 180.23 184.60 187.54 192.64 198.38 203.18 209.37 214.46 219.82" y="518.08" font-size="9.00" class="sc-lorabold">8.13.2.A] BenchCAD Vision2Code</text><text x="227.03" y="518.08" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="272.03" y="518.08" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="303.36" y="518.08" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考和</text><text x="404.73" y="518.08" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="423.30" y="518.08" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下，分别在使</text><text x="72.00" y="529.78" font-size="9.00" class="sc-notoserifcjksc">用和不使用工具的情况下接受评估。得分为五次运行的平均值，并显示</text><text x="353.37" y="529.78" font-size="9.00" class="sc-loraregular">95%</text><text x="373.67" y="529.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="418.67" y="529.78" font-size="9.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="470.34" y="529.78" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="481.71" y="529.78" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="72.00" y="541.48" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="110.37" y="541.48" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="144.24" y="541.48" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果。</text><text x="72.00" y="570.83" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="570.83" font-size="11.00" class="sc-notoserifcjksc">在该评估上的表现随测试时计算的增加而显著提升，尤其是在模型配备了能够对中间输出</text><text x="72.00" y="586.45" font-size="11.00" class="sc-notoserifcjksc">进行视觉验证的工具时。使用工具时，</text><text x="259.00" y="586.45" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="297.29" y="586.45" font-size="11.00" class="sc-notoserifcjksc">模型在更高的推理强度档位上拓展了得分</text><text x="495.29" y="586.45" font-size="11.00" class="sc-loraregular">–</text><text x="501.78" y="586.45" font-size="11.00" class="sc-notoserifcjksc">成本前</text><text x="72.00" y="602.07" font-size="11.00" class="sc-notoserifcjksc">沿，取得了近乎满分的体素</text><text x="206.89" y="602.07" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="227.72" y="602.07" font-size="11.00" class="sc-notoserifcjksc">分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.54 109.92 120.11 127.96 140.94 149.24 154.23 157.66 166.47 169.85 177.35 180.48" y="497.33" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.3 OSWorld 2.1</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">19</text><text x="80.28 86.13 92.10 97.25 103.32 105.85 108.48 117.66 120.11 122.64 125.27 130.62 134.49 137.12 142.28 145.00 147.45 150.08 153.13 158.50 164.64 170.01 175.66 178.71 181.17 183.80 191.74 197.40 206.96 212.81 217.10 219.82 225.79 228.42 233.79 236.10 242.31 244.81 247.43 253.65 259.07 265.14 270.46 276.44 285.38 290.54 294.83 300.19 303.00 309.07 314.60 317.23 322.49 328.34 337.28 343.25 349.21 353.08 358.50 362.83 365.46 371.43 376.05 381.47 384.10 389.26 394.74 400.15 406.13 410.00 414.63 417.26 423.11 429.17 431.80 434.52 440.37 446.44 451.96 456.85 462.84 468.69 473.02 475.82 480.86 486.71" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00" y="423.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="423.43" font-size="9.00" class="sc-lorabold sc-k">8.13.2.B]</text><text x="123.15" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="215.51" y="423.43" font-size="9.00" class="sc-lorabold sc-k">BenchCAD Vision2Code</text><text x="319.40" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="364.40" y="423.43" font-size="9.00" class="sc-notoserifcjksc">各模型均在不同推理强度档位下以自适应思</text><text x="72.00" y="435.13" font-size="9.00" class="sc-notoserifcjksc">考进行评估。我们使用</text><text x="164.37" y="435.13" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="190.45" y="435.13" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值，并</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">显示</text><text x="92.37" y="446.83" font-size="9.00" class="sc-loraregular">95%</text><text x="112.67" y="446.83" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按</text><text x="187.04" y="446.83" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="203.46" y="446.83" font-size="9.00" class="sc-notoserifcjksc">标准定价计费，并采用每次运行的实际缓存使用情况。</text><text x="72.00" y="525.19" font-size="11.00" class="sc-loraregular sc-k">OSWorld 2.1</text><text x="133.72" y="521.52" font-size="6.60" class="sc-loraregular">19</text><text x="142.83" y="525.19" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="200.72" y="525.19" font-size="11.00" class="sc-loraregular">108</text><text x="220.63" y="525.19" font-size="11.00" class="sc-notoserifcjksc">项长程计算机使用（</text><text x="319.63" y="525.19" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="390.33" y="525.19" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，在这些任</text><text x="72.00" y="540.81" font-size="11.00" class="sc-notoserifcjksc">务中，智能体通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="393.89" y="540.81" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="435.43" y="540.81" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每项任务依</text><text x="72.00" y="556.43" font-size="11.00" class="sc-notoserifcjksc">据一组加权检查点进行评分。我们报告两项指标：部分得分（各任务在所有检查点上所获分值的</text><text x="72.00" y="572.05" font-size="11.00" class="sc-notoserifcjksc">平均值）和严格通过率（所有检查点均满足的任务所占比例），二者均为五次独立运行平均得到</text><text x="72.00" y="587.67" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="587.67" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="121.10" y="587.67" font-size="11.00" class="sc-notoserifcjksc">。我们采用该基准测试的默认设置（</text><text x="297.10" y="587.67" font-size="11.00" class="sc-loraregular">1080p</text><text x="330.41" y="587.67" font-size="11.00" class="sc-notoserifcjksc">分辨率，每项任务的操作步数上限为</text><text x="72.00" y="603.29" font-size="11.00" class="sc-loraregular">500</text><text x="91.66" y="603.29" font-size="11.00" class="sc-notoserifcjksc">），推理强度为</text><text x="171.55" y="603.29" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="191.35" y="603.29" font-size="11.00" class="sc-notoserifcjksc">。对于需要评分模型的任务，我们使用了</text><text x="392.25" y="603.29" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="475.24" y="603.29" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="234.91" y="707.20" width="158.07" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用了该基准测试</text><text x="184.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="212.71" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="226.61" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="235.86" y="82.61" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="249.75" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="263.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">日版本（</text><text x="307.48" y="82.61" font-size="11.00" class="sc-loraregular">v2.1</text><text x="325.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的任务文件、任务资源及配套</text><text x="482.54" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Web</text><text x="508.32" y="82.61" font-size="11.00" class="sc-notoserifcjksc">应</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用。智能体保留每一张截图，并使用</text><text x="250.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude API</text><text x="309.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的服务端上下文管理，在对话超过</text><text x="477.15" y="98.23" font-size="11.00" class="sc-loraregular sc-k">100k token</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">后对其进行压缩。本节中的所有模型均在相同配置下评估，该配置与</text><text x="404.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="490.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">系统卡中</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的配置相同。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="179.76" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="202.83" y="179.76" font-size="11.00" class="sc-loraregular sc-k">80.1%</text><text x="234.84" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的部分得分和</text><text x="303.74" y="179.76" font-size="11.00" class="sc-loraregular">43.5%</text><text x="336.99" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的严格通过率。</text><text x="413.99" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="499.72" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的部分</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="107.89" y="195.38" font-size="11.00" class="sc-loraregular">81.8%</text><text x="136.54" y="195.38" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="216.43" y="195.38" font-size="11.00" class="sc-loraregular sc-k">48.7%</text><text x="245.57" y="195.38" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="256.57" y="195.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="342.81" y="195.38" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="411.70" y="195.38" font-size="11.00" class="sc-loraregular sc-k">57.0%</text><text x="441.23" y="195.38" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="72.00" y="211.00" font-size="11.00" class="sc-loraregular sc-k">25.6%</text><text x="102.43" y="211.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="522.76" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="522.76" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.92 112.01 117.55" y="522.76" font-size="9.00" class="sc-lorabold">8.13.3.A]</text><text x="123.39" y="522.76" font-size="9.00" class="sc-notoserifcjkscbold">各模型的</text><text x="161.76" y="522.76" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.1</text><text x="215.31" y="522.76" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="242.31" y="522.76" font-size="9.00" class="sc-notoserifcjksc">柱状图显示</text><text x="289.67" y="522.76" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="308.24" y="522.76" font-size="9.00" class="sc-notoserifcjksc">推理强度下的部分得分和严格通过率，以及基于五次运行</text><text x="72.00" y="534.46" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="83.37" y="534.46" font-size="9.00" class="sc-loraregular">95%</text><text x="103.67" y="534.46" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">131</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold sc-k">8.13.3.B] Claude Sonnet 5.5</text><text x="199.94" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="208.94" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="279.60" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="290.97" y="413.53" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="362.93" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="374.30" y="413.53" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.1</text><text x="427.85" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与性能对比。</text><text x="517.85" y="413.53" font-size="9.00" class="sc-notoserifcjksc">每个</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">点代表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="326.37" y="425.23" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="342.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">输入、输出及提示缓存的标准定价计算的平均每任</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">务成本。得分为</text><text x="137.37" y="436.93" font-size="9.00" class="sc-loraregular sc-k">OSWorld 2.1</text><text x="190.23" y="436.93" font-size="9.00" class="sc-notoserifcjksc">评分者给出的部分得分，取五次运行的平均值。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.63 121.94 126.26 129.69 137.49 145.51 155.73" y="527.57" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 OfficeQA</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold">8.13.3.C] Claude Sonnet 5.5</text><text x="200.60" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="209.60" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="280.26" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="291.63" y="413.53" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="363.59" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="374.96" y="413.53" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.1</text><text x="428.51" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与严格通过率对</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjkscbold">比。</text><text x="90.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">每个点代表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="362.37" y="425.23" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="378.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">输入、输出及提示缓存的标准定价计算的</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">平均每任务成本。严格通过率仅在所有检查点均满足时才将任务计为通过，取五次运行的平均值。</text><text x="72.00" y="486.67" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="486.67" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="555.66" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46" y="555.66" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="193.13" y="555.66" font-size="11.00" class="sc-notoserifcjksc">推出的公开基准测试，用于评估基于大量历史美国《财政部公报》</text><text x="72.00" y="571.28" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="571.28" font-size="11.00" class="sc-loraregular sc-k">U.S. Treasury Bulletin</text><text x="193.21" y="571.28" font-size="11.00" class="sc-notoserifcjksc">）文档语料的端到端有据推理。大多数</text><text x="432.67" y="571.28" font-size="11.00" class="sc-notoserifcjksc">问题要求模型在给定</text><text x="72.00" y="586.90" font-size="11.00" class="sc-notoserifcjksc">的文档中找到正确的表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估，</text><text x="72.00" y="602.52" font-size="11.00" class="sc-notoserifcjksc">相关文档已预先选定并以提取后的文本形式提供；</text><text x="384.25" y="602.52" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模型的、难度更</text><text x="72.00" y="618.14" font-size="11.00" class="sc-notoserifcjksc">高的</text><text x="96.89" y="618.14" font-size="11.00" class="sc-loraregular">133</text><text x="116.04" y="618.14" font-size="11.00" class="sc-notoserifcjksc">题子集。</text><text x="72.00" y="675.00" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="675.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="675.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="675.00" font-size="11.00" class="sc-notoserifcjksc">推理强度下于</text><text x="321.99" y="675.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="357.88" y="675.00" font-size="11.00" class="sc-loraregular">76.9%</text><text x="387.95" y="675.00" font-size="11.00" class="sc-notoserifcjksc">，于</text><text x="483.08" y="675.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="72.00" y="690.62" font-size="11.00" class="sc-loraregular sc-k">65.6%</text><text x="102.88" y="690.62" font-size="11.00" class="sc-notoserifcjksc">。这低于</text><text x="149.77" y="690.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="232.61" y="690.62" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="279.50" y="690.62" font-size="11.00" class="sc-loraregular">78.9%</text><text x="312.28" y="690.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="326.18" y="690.62" font-size="11.00" class="sc-loraregular sc-k">67.7%</text><text x="354.04" y="690.62" font-size="11.00" class="sc-notoserifcjksc">），高于相同设置下的</text><text x="466.93" y="690.62" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="706.24" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="117.06" y="706.24" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="163.95" y="706.24" font-size="11.00" class="sc-loraregular">75.1%</text><text x="194.19" y="706.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.08" y="706.24" font-size="11.00" class="sc-loraregular">62.1%</text><text x="236.63" y="706.24" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.01 110.39 116.16 124.18 132.99 141.80 145.23 148.61 157.67 166.48 174.50 182.93 187.77 191.15 199.33 207.35 215.79 223.59 232.02 245.52 254.33 259.32" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.2 Legal Agent Benchmark</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.23 110.61 120.66 129.87 137.60 145.09 153.90 157.33 164.93 173.99" y="457.74" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.3 GDPval-AA</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.56 92.65 96.69 104.60 109.76 114.01 119.99 125.98 131.14 137.20 139.73 142.36 148.27 150.73 153.26 155.89 161.24 165.10 167.73 172.89 175.61 178.07 180.70 183.75 189.11 195.25 200.62 206.07 209.12 211.58 214.20 221.81 229.16 235.51 240.45 245.61 248.33 250.83 253.46 259.59 264.53 269.69 272.41 278.38 283.47 287.34 290.14 296.21 301.74 304.37 310.63 313.97 316.60 325.54 331.39 337.37 342.78 345.50 348.13 354.10 359.52 363.85 367.17 373.02 377.35 386.29 391.44 397.51 402.78 408.20 410.83 416.67 422.74 425.37 429.63 435.03 440.18 442.90 447.71 455.60 461.45 465.73 468.45 474.43 477.06 482.43 487.70 493.54 499.61 505.46 514.40 517.20 522.50 527.66 530.38 533.05" y="704.45" font-size="10.00" class="sc-loraregular">Patwardhan, T., et al. (2025). GDPval: Evaluating AI model performance on real-world economically</text><text x="72.00 76.95 82.11 84.82 90.79 95.95 101.77 104.49 109.91 112.53 116.40 121.56 126.19 131.56 136.18 138.64 141.27 146.43 150.14 156.63 159.44 164.48 166.98 172.35 177.80 181.44 187.48 189.79 196.00 201.42 206.75 211.21 216.63" y="717.26" font-size="10.00" class="sc-loraregular">valuable tasks. arXiv:2510.04374.</text><text x="221.72 227.62 231.59 235.45 241.42 246.05 248.55 252.24 258.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00" y="115.03" font-size="11.00" class="sc-loraregular sc-k">Legal Agent Benchmark</text><text x="192.63" y="115.03" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63" y="115.03" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="223.90" y="115.03" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="248.79" y="115.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Harvey AI</text><text x="301.37" y="115.03" font-size="11.00" class="sc-notoserifcjksc">推出的开源基准测试，包含</text><text x="436.27" y="115.03" font-size="11.00" class="sc-loraregular">27</text><text x="450.14" y="115.03" font-size="11.00" class="sc-notoserifcjksc">个不同执业领域的</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">超过</text><text x="96.89 102.80 105.41 112.24 116.24" y="130.65" font-size="11.00" class="sc-loraregular">2,010</text><text x="125.98" y="130.65" font-size="11.00" class="sc-notoserifcjksc">项任务。每项任务包含一个封闭文档集，其中包括电子邮件往来、律所模板、程序性</text><text x="72.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">文件以及其他客户事务材料，智能体必须对其进行筛查才能完成任务。任务指令以合伙人向授薪</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">律师提出的简短</text><text x="149.00" y="161.89" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="161.89" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="161.89" font-size="11.00" class="sc-notoserifcjksc">的形式撰写。指令还规定了预期的输出文档及其格式。评估采用通过</text><text x="531.24" y="161.89" font-size="11.00" class="sc-loraregular">/</text><text x="72.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">不通过的方式，使用大语言模型作为评判者，依据一套由专家撰写的评分细则标准进行。按照</text><text x="72.00" y="193.13" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="95.17" y="193.13" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式，只有当所有标准均满足时，任务才被视为成功。</text><text x="72.00" y="260.76" font-size="11.00" class="sc-notoserifcjksc">除公开任务外，</text><text x="149.00" y="260.76" font-size="11.00" class="sc-loraregular sc-k">Harvey</text><text x="188.12" y="260.76" font-size="11.00" class="sc-notoserifcjksc">还维护着一个包含</text><text x="279.01" y="260.76" font-size="11.00" class="sc-loraregular">120</text><text x="298.64" y="260.76" font-size="11.00" class="sc-notoserifcjksc">道题目、未公开发布的留出集。</text><text x="72.00" y="276.38" font-size="11.00" class="sc-notoserifcjksc">在该留出集上独立报告</text><text x="184.89" y="276.38" font-size="11.00" class="sc-loraregular sc-k">Harvey LAB</text><text x="247.18" y="276.38" font-size="11.00" class="sc-notoserifcjksc">的结果，所用运行框架由</text><text x="461.65" y="276.38" font-size="11.00" class="sc-notoserifcjksc">团队维护（</text><text x="516.65" y="276.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">有关</text><text x="72.00" y="292.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其方法论的更多信息见此处</text><text x="204.00" y="292.00" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="341.72" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="341.72" font-size="11.00" class="sc-notoserifcjksc">在留出集上于</text><text x="235.83" y="341.72" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="265.13" y="341.72" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得</text><text x="345.02" y="341.72" font-size="11.00" class="sc-loraregular sc-k">11.7%</text><text x="372.92" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="441.81" y="341.72" font-size="11.00" class="sc-loraregular">92.1%</text><text x="473.25" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的平均评分项</text><text x="72.00" y="357.34" font-size="11.00" class="sc-notoserifcjksc">通过率（在</text><text x="129.89" y="357.34" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="152.59" y="357.34" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="221.48" y="357.34" font-size="11.00" class="sc-loraregular">10%</text><text x="244.78" y="357.34" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="313.67" y="357.34" font-size="11.00" class="sc-loraregular">93.1%</text><text x="345.33" y="357.34" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通过率）。与我们上一份</text><text x="72.00" y="372.96" font-size="11.00" class="sc-notoserifcjksc">系统卡一样，早期模型的得分采用</text><text x="330.48" y="372.96" font-size="11.00" class="sc-notoserifcjksc">测得的结果，而非</text><text x="421.37" y="372.96" font-size="11.00" class="sc-loraregular sc-k">Harvey</text><text x="460.49" y="372.96" font-size="11.00" class="sc-notoserifcjksc">报告的结果，以</text><text x="72.00" y="388.58" font-size="11.00" class="sc-notoserifcjksc">便所有模型都在同一运行框架上进行比较。因此，这些得分可能与该变更之前发布的系统卡中的</text><text x="72.00" y="404.20" font-size="11.00" class="sc-notoserifcjksc">得分略有不同。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66 143.57 146.27" y="485.83" font-size="11.00" class="sc-loraregular">GDPval-AA v2.1</text><text x="153.17" y="485.83" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="257.65" y="485.83" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真</text><text x="72.00" y="501.45" font-size="11.00" class="sc-notoserifcjksc">实世界专业任务上测试</text><text x="184.89" y="501.45" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="501.45" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="311.25" y="501.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="352.65" y="501.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="366.55" y="501.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDPval</text><text x="406.99" y="501.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="461.99" y="497.78" font-size="6.60" class="sc-loraregular">20</text><text x="469.64" y="501.45" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="494.53" y="501.45" font-size="11.00" class="sc-loraregular">220</text><text x="516.07" y="501.45" font-size="11.00" class="sc-notoserifcjksc">项任</text><text x="72.00" y="517.07" font-size="11.00" class="sc-notoserifcjksc">务，涵盖九大主要行业的</text><text x="195.89" y="517.07" font-size="11.00" class="sc-loraregular">44</text><text x="210.71" y="517.07" font-size="11.00" class="sc-notoserifcjksc">种职业。任务对应真实的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="532.69" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="532.69" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="532.69" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，性能通过基于模</text><text x="72.00" y="548.31" font-size="11.00" class="sc-notoserifcjksc">型输出盲评两两比较得出的</text><text x="206.89" y="548.31" font-size="11.00" class="sc-loraregular">Elo</text><text x="226.06" y="548.31" font-size="11.00" class="sc-notoserifcjksc">评分来衡量，并以</text><text x="316.95" y="548.31" font-size="11.00" class="sc-loraregular sc-k">DeepSeek V4.1 Flash</text><text x="419.27" y="548.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="430.27" y="548.31" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="450.07" y="548.31" font-size="11.00" class="sc-notoserifcjksc">）为锚点，定为</text><text x="72.00 76.00 78.67 85.02 91.85" y="563.93" font-size="11.00" class="sc-loraregular">1,600</text><text x="101.59" y="563.93" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00" y="625.89" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="625.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="625.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="625.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="272.42" y="625.89" font-size="11.00" class="sc-loraregular">Elo</text><text x="291.59" y="625.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="305.48" y="625.89" font-size="11.00" class="sc-loraregular">1844</text><text x="327.59" y="625.89" font-size="11.00" class="sc-notoserifcjksc">，仅比</text><text x="363.48" y="625.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="386.18" y="625.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="455.07" y="625.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="641.51" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="641.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.70" y="641.51" font-size="11.00" class="sc-loraregular">1846</text><text x="120.20" y="641.51" font-size="11.00" class="sc-notoserifcjksc">）低</text><text x="145.10" y="641.51" font-size="11.00" class="sc-loraregular">2</text><text x="153.89" y="641.51" font-size="11.00" class="sc-notoserifcjksc">分。它领先于</text><text x="222.79" y="641.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="245.48" y="641.51" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="270.38" y="641.51" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="350.89" y="641.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="361.89" y="641.51" font-size="11.00" class="sc-loraregular">1735</text><text x="383.08" y="641.51" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="405.08" y="641.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.78" y="641.51" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="452.67" y="641.51" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="657.13" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="657.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="657.13" font-size="11.00" class="sc-loraregular">1449</text><text x="111.28" y="657.13" font-size="11.00" class="sc-notoserifcjksc">）以及所有非</text><text x="180.17" y="657.13" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="218.46" y="657.13" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="265.36" y="657.13" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="301.26" y="657.13" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="367.26" y="657.13" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="423.91" y="657.13" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="459.80" y="657.13" font-size="11.00" class="sc-loraregular">1725</text><text x="480.78" y="657.13" font-size="11.00" class="sc-notoserifcjksc">，同时使用</text><text x="72.00" y="672.75" font-size="11.00" class="sc-notoserifcjksc">的输出</text><text x="107.89" y="672.75" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="139.95" y="672.75" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="153.84" y="672.75" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="176.54" y="672.75" font-size="11.00" class="sc-notoserifcjksc">下少约</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="221.72" y="707.20" width="155.60" height="12.80" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="248.79" y="106.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="248.79" y="106.23" width="36.22" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="285.02" y="1 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.92 111.30 120.36 129.42 137.02 145.21 150.20 153.63 161.65 165.96 173.76 182.57 189.51" y="133.86" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.4 AA-Briefcase</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.82 111.20 118.53 126.82 135.11 138.54 147.35 152.19 160.62 164.05 172.34 180.78 188.38 197.40 205.42 210.41 213.84 218.15 221.58 229.60" y="360.51" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.5 Toolathlon-Verified</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">67%</text><text x="92.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="230.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="285.40" y="78.94" font-size="6.60" class="sc-loraregular">21</text><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="161.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="161.95" font-size="11.00" class="sc-loraregular">v1.1</text><text x="160.29" y="161.95" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="264.76" y="161.95" font-size="11.00" class="sc-notoserifcjksc">开发，是一个由行业专家构建的新基准测试，用于衡量复</text><text x="72.00" y="177.57" font-size="11.00" class="sc-notoserifcjksc">杂项目中的长程知识工作。模型需要完成为期数周、包含大量相互关联任务和数千个输入源文件</text><text x="72.00" y="193.19" font-size="11.00" class="sc-notoserifcjksc">的项目。评分结合了评分细则打分以及由前沿模型评审团进行的成对评判，以衡量可验证的任务</text><text x="72.00" y="208.81" font-size="11.00" class="sc-notoserifcjksc">成功、分析质量和呈现质量。</text><text x="72.00" y="259.11" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="259.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="259.11" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="259.11" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="272.42" y="259.11" font-size="11.00" class="sc-loraregular">Elo</text><text x="291.59" y="259.11" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="305.48" y="259.11" font-size="11.00" class="sc-loraregular">1811</text><text x="323.67" y="259.11" font-size="11.00" class="sc-notoserifcjksc">，仅比</text><text x="359.57" y="259.11" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="382.26" y="259.11" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="407.15" y="259.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="490.00" y="259.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="501.00" y="259.11" font-size="11.00" class="sc-loraregular">1822</text><text x="523.00" y="259.11" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="274.73" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="85.89" y="274.73" font-size="11.00" class="sc-loraregular">11</text><text x="96.79" y="274.73" font-size="11.00" class="sc-notoserifcjksc">分；在</text><text x="132.69" y="274.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="168.59" y="274.73" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="237.48" y="274.73" font-size="11.00" class="sc-loraregular sc-k">1746</text><text x="258.72" y="274.73" font-size="11.00" class="sc-notoserifcjksc">。这两种设置均领先于</text><text x="371.61" y="274.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="394.31" y="274.73" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="419.20" y="274.73" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="290.35" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="290.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71" y="290.35" font-size="11.00" class="sc-loraregular sc-k">1678</text><text x="117.24" y="290.35" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="139.24" y="290.35" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="161.94" y="290.35" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="186.83" y="290.35" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="270.18" y="290.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="281.18" y="290.35" font-size="11.00" class="sc-loraregular">1359</text><text x="303.66" y="290.35" font-size="11.00" class="sc-notoserifcjksc">）以及所有非</text><text x="372.56" y="290.35" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="410.85" y="290.35" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="457.74" y="290.35" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="493.64" y="290.35" font-size="11.00" class="sc-notoserifcjksc">推理强度</text><text x="72.00" y="305.97" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00" y="305.97" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="150.65" y="305.97" font-size="11.00" class="sc-notoserifcjksc">使用的输出</text><text x="208.54" y="305.97" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="240.60" y="305.97" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="254.49" y="305.97" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="277.19" y="305.97" font-size="11.00" class="sc-notoserifcjksc">下少约</text><text x="313.08" y="305.97" font-size="11.00" class="sc-loraregular">61%</text><text x="333.01" y="305.97" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="470.49" y="305.97" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="388.59" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="129.80" y="388.59" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="388.59" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="388.59" font-size="11.00" class="sc-notoserifcjksc">项真实世界工具使用任务，涵盖办公效率、电子商</text><text x="72.00" y="404.21" font-size="11.00" class="sc-notoserifcjksc">务与运营、数据分析和网页调研。任务从预先填充了真实感数据的应用中开始，并由基于执行的</text><text x="72.00" y="419.83" font-size="11.00" class="sc-notoserifcjksc">检查器进行评分，这些检查器既验证生成的产出物，也验证相关应用或网站中的变更。该基准测</text><text x="72.00" y="435.45" font-size="11.00" class="sc-notoserifcjksc">试在</text><text x="96.89" y="435.45" font-size="11.00" class="sc-loraregular">32</text><text x="111.82" y="435.45" font-size="11.00" class="sc-notoserifcjksc">个应用中提供了</text><text x="191.71" y="435.45" font-size="11.00" class="sc-loraregular">600</text><text x="214.63" y="435.45" font-size="11.00" class="sc-notoserifcjksc">多种工具。任务要求在长程中正确选择工具、进行多步骤顺序编</text><text x="72.00" y="451.07" font-size="11.00" class="sc-notoserifcjksc">排，并给出与检查器要求完全一致的输出；在我们的运行中，轨迹平均约为</text><text x="437.89" y="451.07" font-size="11.00" class="sc-loraregular">20–32</text><text x="472.05" y="451.07" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。</text><text x="72.00" y="466.69" font-size="11.00" class="sc-notoserifcjksc">我们针对</text><text x="221.99" y="466.69" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这是作者的最终版本（</text><text x="397.99" y="466.69" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="425.80" y="466.69" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="439.70" y="466.69" font-size="11.00" class="sc-loraregular">6</text><text x="448.95" y="466.69" font-size="11.00" class="sc-notoserifcjksc">月），其中任务提</text><text x="72.00" y="482.31" font-size="11.00" class="sc-notoserifcjksc">示词、标准答案和评估器均经过人工审核并最终确定，并公布了八个模型的参考轨迹以供外部验</text><text x="72.00" y="497.93" font-size="11.00" class="sc-notoserifcjksc">证。</text><text x="72.00" y="566.71" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="566.71" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="202.83" y="566.71" font-size="11.00" class="sc-loraregular sc-k">77.8%</text><text x="233.84" y="566.71" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="247.74" y="566.71" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="282.95" y="566.71" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="307.84" y="566.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="393.57" y="566.71" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="407.47" y="566.71" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="487.98" y="566.71" font-size="11.00" class="sc-notoserifcjksc">（均为</text><text x="72.00" y="582.33" font-size="11.00" class="sc-loraregular sc-k">77.8%</text><text x="100.12" y="582.33" font-size="11.00" class="sc-notoserifcjksc">）持平，并领先于</text><text x="191.01" y="582.33" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="274.36" y="582.33" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="285.36" y="582.33" font-size="11.00" class="sc-loraregular sc-k">74.7%</text><text x="313.23" y="582.33" font-size="11.00" class="sc-notoserifcjksc">）。其</text><text x="349.12" y="582.33" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="389.35" y="582.33" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="403.24" y="582.33" font-size="11.00" class="sc-loraregular">85.2%</text><text x="433.60" y="582.33" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="444.60" y="582.33" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="474.02" y="582.33" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="487.91" y="582.33" font-size="11.00" class="sc-loraregular">68.5%</text><text x="518.72" y="582.33" font-size="11.00" class="sc-notoserifcjksc">，且</text><text x="72.00" y="597.95" font-size="11.00" class="sc-notoserifcjksc">每条轨迹的平均助手轮次（</text><text x="204.00" y="597.95" font-size="11.00" class="sc-loraregular sc-k">31.6</text><text x="223.08" y="597.95" font-size="11.00" class="sc-notoserifcjksc">）多于表中其他模型。在</text><text x="346.98" y="597.95" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="367.62" y="597.95" font-size="11.00" class="sc-notoserifcjksc">次试验中，有两次（</text><text x="466.62" y="597.95" font-size="11.00" class="sc-loraregular sc-k">0.6%</text><text x="491.80" y="597.95" font-size="11.00" class="sc-notoserifcjksc">）被生产</text><text x="72.00" y="613.57" font-size="11.00" class="sc-notoserifcjksc">环境安全分类器中止，计为失败。对比模型的数据转引自</text><text x="349.89" y="613.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="435.63" y="613.57" font-size="11.00" class="sc-notoserifcjksc">系统卡。遵循论文的</text><text x="72.00" y="629.19" font-size="11.00" class="sc-notoserifcjksc">评估方案，我们报告在全部</text><text x="206.89" y="629.19" font-size="11.00" class="sc-loraregular">108</text><text x="226.80" y="629.19" font-size="11.00" class="sc-notoserifcjksc">项任务上对</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">21</text><text x="162.39" y="678.20" font-size="10.00" class="sc-notoserifcjksc">在我们原生</text><text x="215.02" y="678.20" font-size="10.00" class="sc-loraregular sc-k">Claude Platform</text><text x="292.59" y="678.20" font-size="10.00" class="sc-notoserifcjksc">上的</text><text x="315.22" y="678.20" font-size="10.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="366.72" y="678.20" font-size="10.00" class="sc-notoserifcjksc">预发布部署中运行了</text><text x="459.35 466.96 474.31 480.66 485.61 490.77 493.49 498.38 505.10 511.36 513.99 519.04 524.41 526.87" y="678.20" font-size="10.00" class="sc-loraregular">GDPval-AA v2.1</text><text x="72.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">和</text><text x="84.63 91.35 97.41 102.30 108.44 112.77 115.58 121.00 124.33 129.63 134.79 139.42 144.84 147.47 152.52 156.16 158.62" y="692.40" font-size="10.00" class="sc-loraregular">AA-Briefcase v1.1</text><text x="162.26" y="692.40" font-size="10.00" class="sc-notoserifcjksc">；我们发现该部署存在一个缺陷，可能会降低对使用结构化输出的请求的响应质量。</text><text x="72.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">我们预计，这对</text><text x="144.63" y="706.60" font-size="10.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="196.13" y="706.60" font-size="10.00" class="sc-notoserifcjksc">得分的影响（如有）较小，且会导致其表现被低估。该缺陷现已修复。</text><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="72.00" y="153.15" width="19.44" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="153.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="153.15" width="46.79" height="11.00" fill="transparent"/></a></svg></div>
