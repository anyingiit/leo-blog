 128.95 135.96 142.97 148.89 153.43 156.32" y="323.55" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="216.00" y="323.55" font-size="11.00" class="sc-loraregular sc-k">74.7</text><text x="293.25 299.43 305.39 308.09" y="323.55" font-size="11.00" class="sc-loraregular">84.3</text><text x="370.50 376.85 382.84 385.20" y="323.55" font-size="11.00" class="sc-loraregular">65.7</text><text x="447.75 453.41 459.37 462.07" y="323.55" font-size="11.00" class="sc-loraregular">24.5</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="76.75" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="447.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">平均轮次</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">三次试验取平均的</text><text x="162.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="198.10" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，同时报告</text><text x="256.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="293.33" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（三次试验中至少一次正确）、</text><text x="447.33" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="473.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（三次试验全</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">部正确）以及每条轨迹的平均助手轮次。</text><text x="72.00" y="345.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="345.25" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.62 111.72 117.25 120.73 123.09 128.48 133.58 138.64 141.44 146.12 149.84 155.43 158.24 163.33" y="345.25" font-size="9.00" class="sc-lorabold">8.14.5.A] Toolathlon</text><text x="171.44" y="345.25" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="270.44" y="345.25" font-size="9.00" class="sc-notoserifcjksc">各模型均以自适应思考和</text><text x="371.81" y="345.25" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="390.38" y="345.25" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估；</text><text x="471.38" y="345.25" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="356.95" font-size="9.00" class="sc-loraregular">5.5</text><text x="84.02" y="356.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.02" y="356.95" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="163.17" y="356.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="174.54" y="356.95" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="242.78" y="356.95" font-size="9.00" class="sc-notoserifcjksc">在运行时启用了安全分类器。按照论文的评估方案，</text><text x="449.78" y="356.95" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="478.58" y="356.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="487.58" y="356.95" font-size="9.00" class="sc-loraregular sc-k">Pass@3</text><text x="520.50" y="356.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="368.65" font-size="9.00" class="sc-loraregular sc-k">Pass³</text><text x="96.07" y="368.65" font-size="9.00" class="sc-notoserifcjksc">均基于全部</text><text x="143.43" y="368.65" font-size="9.00" class="sc-loraregular">108</text><text x="159.72" y="368.65" font-size="9.00" class="sc-notoserifcjksc">项任务的三次试验计算。</text><text x="72.00" y="395.45" font-size="11.00" class="sc-notoserifcjksc">我们的运行框架沿用了</text><text x="287.98" y="395.45" font-size="11.00" class="sc-notoserifcjksc">的任务定义、提示词和基于执行的检查器，并加入了</text><text x="72.00" y="411.07" font-size="11.00" class="sc-notoserifcjksc">少量针对特定环境的配置补丁；我们通过在自己的运行框架中重新运行两个参考模型（</text><text x="490.00" y="411.07" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="72.00" y="426.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="426.69" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="130.60" y="426.69" font-size="11.00" class="sc-notoserifcjksc">），并在排除空结果后与作者公布的结果相吻合，对这些补丁进行了验证。为控制实</text><text x="72.00" y="442.31" font-size="11.00" class="sc-notoserifcjksc">时依赖漂移，我们将金融数据源固定为运行时记录的快照，并固定容器镜像。少量上游检查器缺</text><text x="72.00" y="457.93" font-size="11.00" class="sc-notoserifcjksc">陷（例如，标准答案引用了一个此后已更名的代码仓库）未作改动。</text><text x="72.00" y="524.99" font-size="11.00" class="sc-notoserifcjksc">关于与已公布排行榜的可比性的说明：我们测得的</text><text x="316.89" y="524.99" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="364.84" y="524.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.74" y="524.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="464.62" y="524.99" font-size="11.00" class="sc-notoserifcjksc">数据比已公布</text><text x="72.00" y="540.61" font-size="11.00" class="sc-notoserifcjksc">排行榜上的数据（分别为</text><text x="195.89" y="540.61" font-size="11.00" class="sc-loraregular sc-k">71.6%</text><text x="226.39" y="540.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="240.28" y="540.61" font-size="11.00" class="sc-loraregular">76.2%</text><text x="269.89" y="540.61" font-size="11.00" class="sc-notoserifcjksc">）分别高</text><text x="316.78" y="540.61" font-size="11.00" class="sc-loraregular">3.1</text><text x="332.51" y="540.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="346.41" y="540.61" font-size="11.00" class="sc-loraregular sc-k">3.7</text><text x="362.85" y="540.61" font-size="11.00" class="sc-notoserifcjksc">个百分点。</text><text x="417.85" y="540.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="465.80" y="540.61" font-size="11.00" class="sc-notoserifcjksc">差距中约</text><text x="512.69" y="540.61" font-size="11.00" class="sc-loraregular">1.8</text><text x="528.48" y="540.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="556.23" font-size="11.00" class="sc-notoserifcjksc">百分点、</text><text x="116.00" y="556.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="201.89" y="556.23" font-size="11.00" class="sc-notoserifcjksc">差距中约</text><text x="248.78" y="556.23" font-size="11.00" class="sc-loraregular sc-k">2.7</text><text x="265.01" y="556.23" font-size="11.00" class="sc-notoserifcjksc">个百分点，来自作者的运行框架未生成任何轨迹的运行</text><text x="72.00" y="571.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="571.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="130.95" y="571.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="144.84" y="571.85" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="165.49" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="201.38" y="571.85" font-size="11.00" class="sc-loraregular">8</text><text x="210.46" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次；</text><text x="232.46" y="571.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="318.35" y="571.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="332.24" y="571.85" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="352.89" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="388.78" y="571.85" font-size="11.00" class="sc-loraregular">11</text><text x="399.68" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这些运行计</text><text x="72.00" y="587.47" font-size="11.00" class="sc-notoserifcjksc">为失败；排除这些运行后，我们的数据与作者公布的参考轨迹在运行间噪声范围内一致。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.86 111.23 120.29 128.73 133.56 141.85 155.36 164.17 169.00 172.43 180.72 189.16 197.35 205.37 213.80 221.60" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.6 AutomationBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00" y="400.35" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="400.35" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.93 112.03 117.57 121.04 123.41 129.23 134.76 138.47 143.57 151.85 156.53 160.25 163.19 168.28 173.97 179.92 184.76 190.50 195.17" y="400.35" font-size="9.00" class="sc-lorabold">8.14.6.A] AutomationBench</text><text x="203.12" y="400.35" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="230.12" y="400.35" font-size="9.00" class="sc-notoserifcjksc">在其曲线上的每一个点，</text><text x="329.12" y="400.35" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="406.80" y="400.35" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="418.17" y="400.35" font-size="9.00" class="sc-loraregular sc-k">AutomationBench</text><text x="495.72" y="400.35" font-size="9.00" class="sc-notoserifcjksc">通过率都高</text><text x="72.00" y="412.05" font-size="9.00" class="sc-notoserifcjksc">于</text><text x="83.37" y="412.05" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="122.60" y="412.05" font-size="9.00" class="sc-notoserifcjksc">在相同或更低估计每任务成本下所达到的通过率。除</text><text x="331.96" y="412.05" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="409.64" y="412.05" font-size="9.00" class="sc-notoserifcjksc">外，所有模型的成本均为</text><text x="511.01" y="412.05" font-size="9.00" class="sc-loraregular">Zapier</text><text x="72.00" y="423.75" font-size="9.00" class="sc-notoserifcjksc">在其排行榜上公布的每任务数据；</text><text x="207.00" y="423.75" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="284.68" y="423.75" font-size="9.00" class="sc-notoserifcjksc">的每任务成本由</text><text x="350.05" y="423.75" font-size="9.00" class="sc-loraregular sc-k">Anthropic</text><text x="394.09" y="423.75" font-size="9.00" class="sc-notoserifcjksc">根据</text><text x="414.46" y="423.75" font-size="9.00" class="sc-loraregular">Zapier</text><text x="443.64" y="423.75" font-size="9.00" class="sc-notoserifcjksc">记录的</text><text x="473.00" y="423.75" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="499.23" y="423.75" font-size="9.00" class="sc-notoserifcjksc">数量，按</text><text x="72.00" y="435.45" font-size="9.00" class="sc-notoserifcjksc">含提示缓存的标准定价计算得出，采用的是</text><text x="245.37" y="435.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="315.51" y="435.45" font-size="9.00" class="sc-notoserifcjksc">系统卡中所用的方法。</text><text x="72.00" y="478.93" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="163.89" y="475.26" font-size="6.60" class="sc-loraregular">22</text><text x="173.88" y="478.93" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="187.77" y="478.93" font-size="11.00" class="sc-loraregular">Zapier</text><text x="220.54" y="475.26" font-size="6.60" class="sc-loraregular sc-k">23</text><text x="230.55" y="478.93" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，用于衡量智能体能否完成真实的端到端业务工</text><text x="72.00" y="494.55" font-size="11.00" class="sc-notoserifcjksc">作流。任务源自销售、市场营销、运营、客户支持、财务和人力资源等领域的真实客户工作流模</text><text x="72.00" y="510.17" font-size="11.00" class="sc-notoserifcjksc">式。每项任务将智能体置于一家模拟公司中；整个基准测试共有约</text><text x="393.89" y="510.17" font-size="11.00" class="sc-loraregular">500</text><text x="416.44" y="510.17" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="430.34" y="510.17" font-size="11.00" class="sc-loraregular sc-k">REST API</text><text x="480.33" y="510.17" font-size="11.00" class="sc-notoserifcjksc">端点，覆盖</text><text x="72.00" y="525.79" font-size="11.00" class="sc-loraregular">47</text><text x="85.93" y="525.79" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="129.93" y="525.79" font-size="11.00" class="sc-loraregular">CRM</text><text x="154.62" y="525.79" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="165.62" y="525.79" font-size="11.00" class="sc-loraregular">Slack</text><text x="192.29" y="525.79" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="203.29" y="525.79" font-size="11.00" class="sc-loraregular sc-k">Google Workspace</text><text x="302.29" y="525.79" font-size="11.00" class="sc-notoserifcjksc">等）。智能体会收到一条自然语言指令。随后，</text><text x="72.00" y="541.41" font-size="11.00" class="sc-notoserifcjksc">它必须通过搜索自主发现正确的端点；进行数十次相互依赖的顺序</text><text x="393.89" y="541.41" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="413.97" y="541.41" font-size="11.00" class="sc-notoserifcjksc">调用；查阅并遵守多层级</text><text x="72.00" y="557.03" font-size="11.00" class="sc-notoserifcjksc">的业务政策文档；并正确避开刻意设置的干扰项。每项任务按通过</text><text x="391.00" y="557.03" font-size="11.00" class="sc-loraregular">/</text><text x="398.59" y="557.03" font-size="11.00" class="sc-notoserifcjksc">不通过评分。只有当针对模</text><text x="72.00" y="572.65" font-size="11.00" class="sc-notoserifcjksc">拟应用状态的所有确定性断言均成立时（例如，所有正确的</text><text x="360.89" y="572.65" font-size="11.00" class="sc-loraregular">CRM</text><text x="388.48" y="572.65" font-size="11.00" class="sc-notoserifcjksc">更新均已应用），任务才算通</text><text x="72.00" y="588.27" font-size="11.00" class="sc-notoserifcjksc">过。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">22</text><text x="421.41 427.31 431.28 435.15 441.12 445.75 448.25 451.94 458.84 464.00 468.33 473.63 476.44 481.10 483.56 489.41 493.69 499.22" y="690.99" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/</text><text x="72.00" y="705.19" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">abs/2604.18934</text><text x="72.00" y="716.06" font-size="6.00" class="sc-loraregular sc-k">23</text><text x="81.10" y="719.39" font-size="10.00" class="sc-notoserifcjksc">结果基于</text><text x="123.73" y="719.39" font-size="10.00" class="sc-loraregular">Zapier</text><text x="156.15" y="719.39" font-size="10.00" class="sc-notoserifcjksc">私有评估集的</text><text x="218.78" y="719.39" font-size="10.00" class="sc-loraregular sc-k">1.0.6</text><text x="241.55" y="719.39" font-size="10.00" class="sc-notoserifcjksc">版本。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="421.41" y="682.99" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="458.84" y="682.99" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="458.84" y="682.99" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="506.12" y="682.99" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="697.19" width="73.36" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">137</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">Zapier</text><text x="107.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在其</text><text x="132.56" y="82.61" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="227.34" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估集上评估了</text><text x="307.24" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="399.28" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="424.18" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="446.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在启用</text><text x="164.54" y="98.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="184.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">默认回退机制的情况下得分为</text><text x="330.51" y="98.23" font-size="11.00" class="sc-loraregular sc-k">44.7%</text><text x="359.43" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="370.43" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="456.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在以默认回退机</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">制重新运行以拒绝告终的任务后得分为</text><text x="261.89" y="113.85" font-size="11.00" class="sc-loraregular">42.5%</text><text x="292.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（未重新运行时为</text><text x="382.93" y="113.85" font-size="11.00" class="sc-loraregular sc-k">40.0%</text><text x="414.49" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，如</text><text x="439.38" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="525.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">统卡中所报告）。</text><text x="72.00" y="165.50" font-size="14.00" class="sc-poppinssemibold">8.15</text><text x="102.06" y="165.50" font-size="14.00" class="sc-notosanscjkscbold">医疗健康</text><text x="72.00" y="192.06" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="192.06" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="173.54" y="192.06" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="184.54" y="192.06" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="318.39" y="192.06" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="332.28" y="192.06" font-size="11.00" class="sc-loraregular sc-k">PhysicianBench</text><text x="415.43" y="192.06" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="462.32" y="192.06" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="207.68" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="207.68" font-size="11.00" class="sc-notoserifcjksc">，主要涵盖面向患者的聊天机器人用例、面向医疗服务提供者的聊天机器人用例，以及涉及电</text><text x="72.00" y="223.30" font-size="11.00" class="sc-notoserifcjksc">子健康记录（</text><text x="138.00" y="223.30" font-size="11.00" class="sc-loraregular sc-k">electronic health record</text><text x="261.57" y="223.30" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="272.57" y="223.30" font-size="11.00" class="sc-loraregular">EHR</text><text x="294.90" y="223.30" font-size="11.00" class="sc-notoserifcjksc">）工具使用的智能体医疗健康任务。图中所示的所</text><text x="72.00" y="238.92" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="85.89" y="238.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="238.92" font-size="11.00" class="sc-notoserifcjksc">模型均在启用安全分类器的情况下运行。为实现同等条件下的比较，我们在每项评估中</text><text x="72.00" y="254.54" font-size="11.00" class="sc-notoserifcjksc">对所有评分细则评分使用同一个评分模型。对于</text><text x="305.89" y="254.54" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="374.43" y="254.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="388.33" y="254.54" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="519.28" y="254.54" font-size="11.00" class="sc-notoserifcjksc">，我</text><text x="72.00" y="270.16" font-size="11.00" class="sc-notoserifcjksc">们通过</text><text x="107.89" y="270.16" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="149.30" y="270.16" font-size="11.00" class="sc-notoserifcjksc">的公开</text><text x="185.19" y="270.16" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="202.37" y="270.16" font-size="11.00" class="sc-notoserifcjksc">、在不使用系统提示词的情况下对其模型重新采样；对于</text><text x="72.00" y="285.78" font-size="11.00" class="sc-loraregular sc-k">PhysicianBench</text><text x="152.26" y="285.78" font-size="11.00" class="sc-notoserifcjksc">，我们对所有模型使用相同的运行框架。随后，我们依据基准测试的标准，使用</text><text x="72.00" y="301.40" font-size="11.00" class="sc-loraregular">Opus</text><text x="101.85" y="301.40" font-size="11.00" class="sc-notoserifcjksc">对回答进行评分。我们对</text><text x="225.75" y="301.40" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="294.29" y="301.40" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="308.18" y="301.40" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="442.03" y="301.40" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="466.92" y="301.40" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="317.02" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="317.02" font-size="11.00" class="sc-notoserifcjksc">，对</text><text x="111.74" y="317.02" font-size="11.00" class="sc-loraregular sc-k">PhysicianBench</text><text x="194.89" y="317.02" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="219.79" y="317.02" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="293.92" y="317.02" font-size="11.00" class="sc-notoserifcjksc">。图</text><text x="318.82" y="317.02" font-size="11.00" class="sc-loraregular">8.15.A</text><text x="350.19" y="317.02" font-size="11.00" class="sc-notoserifcjksc">显示了各模型在</text><text x="430.08" y="317.02" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="452.78" y="317.02" font-size="11.00" class="sc-notoserifcjksc">推理强度下随时间</text><text x="72.00" y="332.64" font-size="11.00" class="sc-notoserifcjksc">的进展。</text><text x="72.00" y="593.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="593.58" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.60 104.70 110.23 113.71 116.07 122.26 125.07 129.79 135.35 140.71" y="593.58" font-size="9.00" class="sc-lorabold">8.15.A] Claude</text><text x="147.92" y="593.58" font-size="9.00" class="sc-notoserifcjkscbold">模型医疗健康评估得分随时间的变化。</text><text x="300.92" y="593.58" font-size="9.00" class="sc-notoserifcjksc">所有模型均使用</text><text x="366.29" y="593.58" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="384.86" y="593.58" font-size="9.00" class="sc-notoserifcjksc">推理强度运行。</text><text x="72.00" y="619.81" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="140.54" y="619.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="154.43" y="619.81" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="288.28" y="619.81" font-size="11.00" class="sc-notoserifcjksc">的得分同时展示了经过与未经过长度校正的结果，</text><text x="72.00" y="635.43" font-size="11.00" class="sc-notoserifcjksc"> 度为</text><text x="341.60 347.51 350.11 356.94 363.77" y="666.67" font-size="11.00" class="sc-loraregular">2,000</text><text x="373.51" y="666.67" font-size="11.00" class="sc-notoserifcjksc">个字符的回答得分保持不变，更长</text><text x="347.00 352.91 355.51 362.35 369.18" y="682.29" font-size="11.00" class="sc-loraregular">2,000</text><text x="378.91" y="682.29" font-size="11.00" class="sc-notoserifcjksc">字符的参考长度和两个比率）均</text><text x="72.00" y="697.91" font-size="11.00" class="sc-notoserifcjksc">由</text></svg></div>

能带来多大帮助，取决于任务类型。</text><text x="72.00" y="209.99" font-size="11.00" class="sc-notoserifcjkscbold">一般健康问题（</text><text x="149.00" y="209.99" font-size="11.00" class="sc-lorabold sc-k">HealthBench</text><text x="216.71" y="209.99" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="238.71" y="209.99" font-size="11.00" class="sc-notoserifcjksc">在长度校正后得分上，全部五个推理强度档位的得分彼此相差</text><text x="72.00" y="225.61" font-size="11.00" class="sc-notoserifcjksc">不超过</text><text x="107.89" y="225.61" font-size="11.00" class="sc-loraregular sc-k">0.7</text><text x="124.87" y="225.61" font-size="11.00" class="sc-notoserifcjksc">个百分点（</text><text x="179.87" y="225.61" font-size="11.00" class="sc-loraregular sc-k">64.7%</text><text x="212.07" y="225.61" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="225.97" y="225.61" font-size="11.00" class="sc-loraregular">65.4%</text><text x="256.56" y="225.61" font-size="11.00" class="sc-notoserifcjksc">）。从</text><text x="292.45" y="225.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="315.15" y="225.61" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="329.04" y="225.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="362.05" y="225.61" font-size="11.00" class="sc-notoserifcjksc">，每个回答的响应时间为</text><text x="485.94" y="225.61" font-size="11.00" class="sc-loraregular">8</text><text x="495.01" y="225.61" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="508.91" y="225.61" font-size="11.00" class="sc-loraregular">13</text><text x="72.00" y="241.23" font-size="11.00" class="sc-notoserifcjksc">秒，在</text><text x="107.89" y="241.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="130.59" y="241.23" font-size="11.00" class="sc-notoserifcjksc">下约为</text><text x="166.48" y="241.23" font-size="11.00" class="sc-loraregular">36</text><text x="181.86" y="241.23" font-size="11.00" class="sc-notoserifcjksc">秒。</text><text x="72.00" y="292.02" font-size="11.00" class="sc-notoserifcjkscbold">来自医疗专业人员的问题（</text><text x="204.00" y="292.02" font-size="11.00" class="sc-lorabold sc-k">HealthBench Professional</text><text x="339.62" y="292.02" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="361.62" y="292.02" font-size="11.00" class="sc-notoserifcjksc">在长度校正后得分上，</text><text x="471.62" y="292.02" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="491.42" y="292.02" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="307.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="111.61" y="307.64" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="122.61" y="307.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="151.90" y="307.64" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="165.80" y="307.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="201.70" y="307.64" font-size="11.00" class="sc-notoserifcjksc">推理强度档位的得分彼此相差约</text><text x="358.59" y="307.64" font-size="11.00" class="sc-loraregular sc-k">0.6</text><text x="377.09" y="307.64" font-size="11.00" class="sc-notoserifcjksc">个百分点以内（</text><text x="454.09" y="307.64" font-size="11.00" class="sc-loraregular sc-k">67.6%</text><text x="486.38" y="307.64" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="72.00" y="323.26" font-size="11.00" class="sc-loraregular">68.2%</text><text x="102.72" y="323.26" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="124.72" y="323.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="147.42" y="323.26" font-size="11.00" class="sc-notoserifcjksc">推理强度得分</text><text x="216.31" y="323.26" font-size="11.00" class="sc-loraregular sc-k">69.2%</text><text x="247.04" y="323.26" font-size="11.00" class="sc-notoserifcjksc">，比它们高</text><text x="304.93" y="323.26" font-size="11.00" class="sc-loraregular sc-k">1.0</text><text x="321.20" y="323.26" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="335.09" y="323.26" font-size="11.00" class="sc-loraregular sc-k">1.6</text><text x="350.94" y="323.26" font-size="11.00" class="sc-notoserifcjksc">个百分点，在噪声范围内。</text><text x="482.94" y="323.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="505.64" y="323.26" font-size="11.00" class="sc-notoserifcjksc">推理强</text><text x="72.00" y="338.88" font-size="11.00" class="sc-notoserifcjksc">度对原始得分的提升更大，高出</text><text x="228.89" y="338.88" font-size="11.00" class="sc-loraregular">3</text><text x="237.91" y="338.88" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="251.81" y="338.88" font-size="11.00" class="sc-loraregular">5</text><text x="260.69" y="338.88" font-size="11.00" class="sc-notoserifcjksc">个百分点（</text><text x="315.69" y="338.88" font-size="11.00" class="sc-loraregular sc-k">77.1%</text><text x="341.63" y="338.88" font-size="11.00" class="sc-notoserifcjksc">，对比</text><text x="377.53" y="338.88" font-size="11.00" class="sc-loraregular">71.8%</text><text x="407.95" y="338.88" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="421.84" y="338.88" font-size="11.00" class="sc-loraregular sc-k">74.0%</text><text x="451.67" y="338.88" font-size="11.00" class="sc-notoserifcjksc">）。从</text><text x="487.56" y="338.88" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="510.25" y="338.88" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="72.00" y="354.50" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="107.90" y="354.50" font-size="11.00" class="sc-notoserifcjksc">推理强度，每个回答的响应时间为</text><text x="275.79" y="354.50" font-size="11.00" class="sc-loraregular">12</text><text x="288.60" y="354.50" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="302.49" y="354.50" font-size="11.00" class="sc-loraregular">26</text><text x="317.65" y="354.50" font-size="11.00" class="sc-notoserifcjksc">秒，在</text><text x="353.54" y="354.50" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="376.24" y="354.50" font-size="11.00" class="sc-notoserifcjksc">下约为</text><text x="412.13" y="354.50" font-size="11.00" class="sc-loraregular">160</text><text x="432.21" y="354.50" font-size="11.00" class="sc-notoserifcjksc">秒。</text><text x="72.00" y="408.00" font-size="11.00" class="sc-notoserifcjkscbold">可访问电子健康记录的智能体健康任务（</text><text x="270.00" y="408.00" font-size="11.00" class="sc-lorabold sc-k">PhysicianBench</text><text x="353.36" y="408.00" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="375.36" y="408.00" font-size="11.00" class="sc-notoserifcjksc">推理强度影响很大。</text><text x="474.36" y="408.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="497.05" y="408.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="423.62" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="114.50" y="423.62" font-size="11.00" class="sc-notoserifcjksc">推理强度无法区分（</text><text x="213.50" y="423.62" font-size="11.00" class="sc-loraregular sc-k">27.2%</text><text x="245.07" y="423.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="258.96" y="423.62" font-size="11.00" class="sc-loraregular sc-k">30.0%</text><text x="290.69" y="423.62" font-size="11.00" class="sc-notoserifcjksc">），在此之上每提高一档都带来提升，每任务模型</text><text x="72.00" y="439.24" font-size="11.00" class="sc-notoserifcjksc">耗时从</text><text x="107.89" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="137.19" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的不到</text><text x="184.08" y="439.24" font-size="11.00" class="sc-loraregular">2</text><text x="192.88" y="439.24" font-size="11.00" class="sc-notoserifcjksc">分钟，增至</text><text x="250.78" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="286.67" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的约</text><text x="322.57" y="439.24" font-size="11.00" class="sc-loraregular">4</text><text x="331.42" y="439.24" font-size="11.00" class="sc-notoserifcjksc">分钟，以及</text><text x="389.32" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="412.01" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的约</text><text x="447.90" y="439.24" font-size="11.00" class="sc-loraregular">14</text><text x="460.76" y="439.24" font-size="11.00" class="sc-notoserifcjksc">分半钟。</text><text x="72.00" y="490.02" font-size="11.00" class="sc-notoserifcjksc">对于当前公开的健康领域问答基准测试，</text><text x="270.00" y="490.02" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="292.70" y="490.02" font-size="11.00" class="sc-notoserifcjksc">推理强度已能获得几乎全部的长度校正后得分，而</text><text x="72.00" y="505.64" font-size="11.00" class="sc-notoserifcjksc">原始得分在</text><text x="129.89" y="505.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="152.59" y="505.64" font-size="11.00" class="sc-notoserifcjksc">推理强度下最高。对于智能体临床基准测试，提高推理强度会带来显著提升。</text><text x="72.00" y="557.25" font-size="14.00" class="sc-poppinssemibold">8.16</text><text x="102.00" y="557.25" font-size="14.00" class="sc-notosanscjkscbold">多语言表现</text><text x="222.61" y="583.81" font-size="11.00" class="sc-loraregular sc-k">Global MMLU</text><text x="293.08" y="583.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="304.08" y="583.81" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="347.15" y="583.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="372.05" y="583.81" font-size="11.00" class="sc-loraregular sc-k">Multi-task Indic Language</text><text x="72.00" y="599.43" font-size="11.00" class="sc-loraregular sc-k">Understanding Benchmark</text><text x="209.33" y="599.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="220.33" y="599.43" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="248.63" y="599.43" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="259.63" y="595.77" font-size="6.60" class="sc-loraregular sc-k">24</text><text x="332.11" y="599.43" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="424.16" y="599.43" font-size="11.00" class="sc-notoserifcjksc">，以考察其在多种语言</text><text x="72.00" y="615.05" font-size="11.00" class="sc-notoserifcjksc">上的表现。</text><text x="72.00" y="648.58" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="117.97" y="648.58" font-size="11.00" class="sc-notoserifcjksc">将标准</text><text x="153.86" y="648.58" font-size="11.00" class="sc-loraregular sc-k">MMLU</text><text x="191.46" y="648.58" font-size="11.00" class="sc-notoserifcjksc">评估扩展到</text><text x="249.35" y="648.58" font-size="11.00" class="sc-loraregular">42</text><text x="264.11" y="648.58" font-size="11.00" class="sc-notoserifcjksc">种语言，涵盖从法语、德语等高资源语言到约鲁巴语、伊</text><text x="72.00" y="664.20" font-size="11.00" class="sc-notoserifcjksc">博语和</text><a href="https://arxiv.org/abs/2411.02538" rel="noopener"><rect x="151.09" y="707.20" width="154.24" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p140.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 140 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">140</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">齐切瓦语等低资源语言。</text><text x="193.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="224.19" y="82.61" font-size="11.00" class="sc-notoserifcjksc">涵盖</text><text x="249.08" y="82.61" font-size="11.00" class="sc-loraregular">11</text><text x="311.59" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="325.32" y="82.61" font-size="11.00" class="sc-notoserifcjksc">种印度语言（孟加拉语、古吉拉特语、印地</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">语、卡纳达语、马拉雅拉姆语、马拉地语、奥里亚语、旁遮普语、泰米尔语和泰卢固语）以及英</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.16.1 GMMLU</text><text x="159.43" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="177.61" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="131.86" y="177.61" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="153.86" y="177.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="248.80" y="177.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="262.70" y="177.61" font-size="11.00" class="sc-loraregular">42</text><text x="277.46" y="177.61" font-size="11.00" class="sc-notoserifcjksc">种语言上的平均准确率为</text><text x="401.35" y="177.61" font-size="11.00" class="sc-loraregular">92.1%</text><text x="429.90" y="177.61" font-size="11.00" class="sc-notoserifcjksc">，低于</text><text x="465.79" y="177.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="193.23" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="193.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="103.48" y="193.23" font-size="11.00" class="sc-loraregular">94.3%</text><text x="137.10" y="193.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="150.99" y="193.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="234.39" y="193.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="248.29" y="193.23" font-size="11.00" class="sc-loraregular sc-k">94.0%</text><text x="279.55" y="193.23" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="315.44" y="193.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="401.68" y="193.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="415.57" y="193.23" font-size="11.00" class="sc-loraregular sc-k">89.2%</text><text x="446.04" y="193.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="520.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="520.57" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 108.67 110.76 116.30 119.77 122.14 128.93 137.67 146.42 151.74" y="520.57" font-size="9.00" class="sc-lorabold">8.16.1.A] GMMLU</text><text x="160.95" y="520.57" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="214.95" y="520.57" font-size="9.00" class="sc-notoserifcjksc">所有</text><text x="235.31" y="520.57" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="266.64" y="520.57" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="314.01" y="520.57" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="332.58" y="520.57" font-size="9.00" class="sc-notoserifcjksc">推理强度下的自适应思考。分数为单次试验的结果。</text><text x="72.00" y="532.27" font-size="9.00" class="sc-notoserifcjksc">未向任何模型提供工具或自定义系统提示词。</text><text x="72.00" y="564.60" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.16.2 MILU</text><text x="144.12" y="564.60" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00" y="596.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="596.48" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="117.08" y="596.48" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="139.08" y="596.48" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="234.02" y="596.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="247.91" y="596.48" font-size="11.00" class="sc-loraregular">11</text><text x="258.81" y="596.48" font-size="11.00" class="sc-notoserifcjksc">种语言上的平均准确率为</text><text x="382.71" y="596.48" font-size="11.00" class="sc-loraregular sc-k">91.6%</text><text x="411.59" y="596.48" font-size="11.00" class="sc-notoserifcjksc">，低于</text><text x="447.48" y="596.48" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="72.00" y="612.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="612.10" font-size="11.00" class="sc-loraregular">93.1%</text><text x="117.55" y="612.10" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="131.44" y="612.10" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="214.85" y="612.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="228.74" y="612.10" font-size="11.00" class="sc-loraregular sc-k">93.0%</text><text x="260.17" y="612.10" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="296.06" y="612.10" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="382.30" y="612.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="396.19" y="612.10" font-size="11.00" class="sc-loraregular sc-k">89.3%</text><text x="426.88" y="612.10" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 109.81 111.91 117.44 120.92 123.28 132.03 135.51 140.83" y="367.00" font-size="9.00" class="sc-lorabold">8.16.2.A] MILU</text><text x="150.04" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="204.04" y="367.00" font-size="9.00" class="sc-notoserifcjksc">所有</text><text x="224.41" y="367.00" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="255.74" y="367.00" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="303.10" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="321.67" y="367.00" font-size="9.00" class="sc-notoserifcjksc">推理强度下的自适应思考。分数为</text><text x="459.04" y="367.00" font-size="9.00" class="sc-loraregular">5</text><text x="466.31" y="367.00" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">未向任何模型提供工具或自定义系统提示词。</text><text x="72.00" y="414.07" font-size="14.00" class="sc-poppinssemibold">8.17</text><text x="100.71" y="414.07" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00" y="446.63" font-size="11.00" class="sc-notoserifcjksc">本节报告支持有益生命科学研究的能力评估，涵盖生物信息学、基于细胞的检测与生物医学图像</text><text x="72.00" y="462.25" font-size="11.00" class="sc-notoserifcjksc">分析、药物化学、蛋白质设计、从头蛋白质结合剂设计以及实验方案。除非另有说明，每个</text><text x="72.00" y="477.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="477.87" font-size="11.00" class="sc-notoserifcjksc">得分均为每道题五次尝试的平均值，采样时使用自适应思考，推理强度为</text><text x="465.18" y="477.87" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="484.99" y="477.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="495.99" y="477.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="493.49" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="493.49" font-size="11.00" class="sc-notoserifcjksc">通过</text><text x="153.54" y="493.49" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="173.62" y="493.49" font-size="11.00" class="sc-notoserifcjksc">进行评估，且关闭了其生物安全防护措施，因此这些结果反映的是底层模型</text><text x="72.00" y="509.11" font-size="11.00" class="sc-notoserifcjksc">的能力，而非已部署系统的能力。在可获得的情况下，我们还报告了</text><text x="404.89" y="509.11" font-size="11.00" class="sc-loraregular">GPT</text><text x="426.97" y="509.11" font-size="11.00" class="sc-notoserifcjksc">‑</text><text x="430.78" y="509.11" font-size="11.00" class="sc-loraregular sc-k">6 Astra</text><text x="469.52" y="509.11" font-size="11.00" class="sc-notoserifcjksc">的得分，其通</text><text x="72.00" y="524.73" font-size="11.00" class="sc-notoserifcjksc">过</text><text x="85.89" y="524.73" font-size="11.00" class="sc-loraregular sc-k">OpenAI API</text><text x="147.37" y="524.73" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="161.26" y="524.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="183.96" y="524.73" font-size="11.00" class="sc-notoserifcjksc">推理强度运行。同样，我们报告了</text><text x="351.85" y="524.73" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="428.18" y="524.73" font-size="11.00" class="sc-notoserifcjksc">在最高思考级别下的得</text><text x="72.00" y="540.35" font-size="11.00" class="sc-notoserifcjksc">分。任一模型上被安全过滤器拦截的尝试均不计入我们的评估结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p142.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 142 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 102.93 106.31 114.50 117.93 126.22 137.68 145.25 152.19 157.02 165.04 170.03 177.59 185.78 193.80 202.23 210.03" y="659.17" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.1 BioMysteryBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">142</text><text x="72.00" y="613.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="613.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 109.03" y="613.78" font-size="9.00" class="sc-lorabold">8.17.A]</text><text x="114.87" y="613.78" font-size="9.00" class="sc-notoserifcjkscbold">生命科学基准测试。</text><text x="195.87" y="613.78" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="273.55" y="613.78" font-size="9.00" class="sc-notoserifcjksc">及对比模型在所示各基准测试上的表现；各基准测试的结果将在以</text><text x="72.00" y="625.48" font-size="9.00" class="sc-notoserifcjksc">下各节中讨论。</text><text x="72.00" y="689.25" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="164.48" y="689.25" font-size="11.00" class="sc-notoserifcjksc">评估模型解决困难分析难题的能力，这些难题需要将计算分析与生物学推理交</text><text x="72.00" y="704.87" font-size="11.00" class="sc-notoserifcjksc">织进行。给定实验</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 105.88 109.26 115.03 123.84 128.68 136.47 144.91 153.10 156.53 164.82 168.20 176.38 179.81 188.11 191.54 199.97 204.29 212.58 217.57 231.07 239.88 244.72 248.15 255.95" y="196.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.2 LatchBio Bioinformatics</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">数据集，模型必须回答诸如从转录组数据中识别被敲除的基因、或判断哪种病毒感染了样本等问</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="94.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="188.94" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="202.83" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Human Solvable</text><text x="287.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">子集（</text><text x="320.84" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Human Solvable subset</text><text x="439.15" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）上的表现与</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="191.24" y="113.85" font-size="11.00" class="sc-loraregular sc-k">89.2%</text><text x="224.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="238.50" y="113.85" font-size="11.00" class="sc-loraregular sc-k">87.5%</text><text x="267.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">），在</text><text x="387.98" y="113.85" font-size="11.00" class="sc-notoserifcjksc">子集（</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">subset</text><text x="105.30" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）上则高于后者（</text><text x="193.30" y="129.47" font-size="11.00" class="sc-loraregular sc-k">44.7%</text><text x="225.11" y="129.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="239.00" y="129.47" font-size="11.00" class="sc-loraregular">32.9%</text><text x="269.67" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。请注意，我们在重新运行所有</text><text x="437.56" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="475.85" y="129.47" font-size="11.00" class="sc-notoserifcjksc">模型时，从</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">其网络允许列表中少移除了两个域名，而在</text><text x="283.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="349.39" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的运行以及</text><text x="407.28" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="483.61" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="497.50" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Human</text><text x="116.53" y="160.71" font-size="11.00" class="sc-notoserifcjksc">运行中保留了这些域名。</text><text x="72.00" y="226.19" font-size="11.00" class="sc-notoserifcjksc">这组评估由</text><text x="129.89" y="226.19" font-size="11.00" class="sc-loraregular sc-k">LatchBio</text><text x="177.90" y="226.19" font-size="11.00" class="sc-notoserifcjksc">开发，评估模型解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="183.88" y="241.81" font-size="11.00" class="sc-notoserifcjksc">变体测试空间转录组学和染色质可及性数据的分析，</text><text x="436.88" y="241.81" font-size="11.00" class="sc-loraregular sc-k">SingleCellBench</text><text x="522.48" y="241.81" font-size="11.00" class="sc-notoserifcjksc">变</text><text x="72.00" y="257.43" font-size="11.00" class="sc-notoserifcjksc">体测试单细胞</text><text x="140.89" y="257.43" font-size="11.00" class="sc-loraregular">RNA</text><text x="165.96" y="257.43" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析。在这两个变体中，</text><text x="341.96" y="257.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="380.25" y="257.43" font-size="11.00" class="sc-notoserifcjksc">都可以使用用于代码执行的</text><text x="515.15" y="257.43" font-size="11.00" class="sc-loraregular">bash</text><text x="72.00" y="273.05" font-size="11.00" class="sc-notoserifcjksc">工具、一个文件编辑器以及一组预先指定的已安装软件包。</text><text x="358.00" y="273.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="452.94" y="273.05" font-size="11.00" class="sc-notoserifcjksc">在两者上的表现均</text><text x="72.00" y="288.67" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="288.67" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="172.13" y="288.67" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="349.16" y="288.67" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="363.05" y="288.67" font-size="11.00" class="sc-loraregular">68.9%</text><text x="394.22" y="288.67" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="405.22" y="288.67" font-size="11.00" class="sc-loraregular sc-k">SingleCellBench 59.1%</text><text x="522.18" y="288.67" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="304.29" font-size="11.00" class="sc-loraregular">56.5%</text><text x="102.62" y="304.29" font-size="11.00" class="sc-notoserifcjksc">），并且在两者上均与</text><text x="215.52" y="304.29" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="301.25" y="304.29" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="334.25" y="304.29" font-size="11.00" class="sc-loraregular sc-k">72.0%</text><text x="367.06" y="304.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="380.96" y="304.29" font-size="11.00" class="sc-loraregular">61.2%</text><text x="409.50" y="304.29" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="370.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.3</text><text x="109.83" y="370.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">形态</text><text x="135.83" y="370.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">–</text><text x="144.96" y="370.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">分子匹配</text><text x="72.00" y="402.14" font-size="11.00" class="sc-notoserifcjksc">该基准测试与</text><text x="140.89" y="402.14" font-size="11.00" class="sc-loraregular sc-k">Axiom Bio</text><text x="195.33" y="402.14" font-size="11.00" class="sc-notoserifcjksc">合作开发，评估模型能否将来自</text><text x="352.23" y="402.14" font-size="11.00" class="sc-loraregular sc-k">Axiom</text><text x="387.49" y="402.14" font-size="11.00" class="sc-notoserifcjksc">人类肝脏体外检测的四组多通</text><text x="72.00" y="417.76" font-size="11.00" class="sc-notoserifcjksc">道细胞成像数据，与处理每组图像中各孔的四种打乱顺序的分子</text><text x="380.00" y="417.76" font-size="11.00" class="sc-loraregular">–</text><text x="386.49" y="417.76" font-size="11.00" class="sc-notoserifcjksc">剂量扰动进行匹配。</text><text x="485.49" y="417.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="433.38" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="433.38" font-size="11.00" class="sc-notoserifcjksc">的表现优于</text><text x="186.54" y="433.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="269.89" y="433.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="280.89" y="433.38" font-size="11.00" class="sc-loraregular sc-k">25.0%</text><text x="314.63" y="433.38" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="328.52" y="433.38" font-size="11.00" class="sc-loraregular">6.8%</text><text x="353.34" y="433.38" font-size="11.00" class="sc-notoserifcjksc">），并与</text><text x="400.23" y="433.38" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="483.63" y="433.38" font-size="11.00" class="sc-notoserifcjksc">相当</text><text x="72.00" y="449.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="449.00" font-size="11.00" class="sc-loraregular">25.8%</text><text x="113.36" y="449.00" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="497.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.4</text><text x="110.64" y="497.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">药物化学</text><text x="72.00" y="529.53" font-size="11.00" class="sc-notoserifcjksc">该基准测试评估模型能否对类药分子的吸收、分布和代谢（</text><text x="358.00" y="529.53" font-size="11.00" class="sc-loraregular sc-k">ADME</text><text x="389.91" y="529.53" font-size="11.00" class="sc-notoserifcjksc">）相关性质进行推理。</text><text x="499.91" y="529.53" font-size="11.00" class="sc-loraregular">504</text><text x="521.59" y="529.53" font-size="11.00" class="sc-notoserifcjksc">道</text><text x="72.00" y="545.15" font-size="11.00" class="sc-notoserifcjksc">题中的每一道都以化学结构的形式给出若干来自药物发现项目的真实化合物，并询问哪个候选化</text><text x="72.00" y="560.77" font-size="11.00" class="sc-notoserifcjksc">合物的某一此类性质的测量值最高或最低。</text><text x="281.00" y="560.77" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="375.94" y="560.77" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="422.83" y="560.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="508.57" y="560.77" font-size="11.00" class="sc-notoserifcjksc">相当</text><text x="72.00" y="576.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="576.39" font-size="11.00" class="sc-loraregular">65.3%</text><text x="116.65" y="576.39" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="130.54" y="576.39" font-size="11.00" class="sc-loraregular">63.5%</text><text x="161.30" y="576.39" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="623.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.5</text><text x="110.42" y="623.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">蛋白质设计</text><text x="72.00" y="656.92" font-size="11.00" class="sc-notoserifcjksc">这些基准测试评估</text><text x="162.89" y="656.92" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="656.92" font-size="11.00" class="sc-notoserifcjksc">的蛋白质设计能力。序列生成任务（</text><text x="377.18" y="656.92" font-size="11.00" class="sc-loraregular sc-k">Sequence Generation task</text><text x="511.07" y="656.92" font-size="11.00" class="sc-notoserifcjksc">）评</text><text x="72.00" y="672.54" font-size="11.00" class="sc-notoserifcjksc">估</text><text x="85.89" y="672.54" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="672.54" font-size="11.00" class="sc-notoserifcjksc">在多种设计约束条件下生成新型蛋白质序列的能力。文库排序任务（</text><text x="454.18" y="672.54" font-size="11.00" class="sc-loraregular sc-k">Library Ranking</text><text x="72.00" y="688.16" font-size="11.00" class="sc-loraregular">task</text><text x="92.93" y="688.16" font-size="11.00" class="sc-notoserifcjksc">）评估</text><text x="128.83" y="688.16" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="167.12" y="688.16" font-size="11.00" class="sc-notoserifcjksc">为实验测试确定蛋白质设计优先级的能力。对于序列</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 106.67 110.05 117.78 122.78 131.07 135.90 144.19 151.99 160.28 163.71" y="467.06" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.8 Protocols</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">生成，我们每道题只运行了</text><text x="206.89" y="82.61" font-size="11.00" class="sc-loraregular">1</text><text x="213.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次尝试；对于文库排序，每道题运行</text><text x="392.68" y="82.61" font-size="11.00" class="sc-loraregular">3</text><text x="401.70" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="445.70" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在两者上均较</text><text x="140.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="227.13" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有大幅提升（序列生成</text><text x="340.03" y="98.23" font-size="11.00" class="sc-loraregular sc-k">51.0%</text><text x="371.86" y="98.23" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="385.75" y="98.23" font-size="11.00" class="sc-loraregular sc-k">20.2%</text><text x="416.50" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；文库排序</text><text x="474.39" y="98.23" font-size="11.00" class="sc-loraregular">54.8%</text><text x="507.70" y="98.23" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">44.0%</text><text x="102.87" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.6</text><text x="110.36" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">从头蛋白质结合剂设计</text><text x="72.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc">该基准测试评估</text><text x="151.89" y="177.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="177.61" font-size="11.00" class="sc-notoserifcjksc">能否独立开展一个持续较长的蛋白质设计项目。对于</text><text x="446.08" y="177.61" font-size="11.00" class="sc-loraregular">15</text><text x="458.97" y="177.61" font-size="11.00" class="sc-notoserifcjksc">个蛋白质靶标中</text><text x="72.00" y="193.23" font-size="11.00" class="sc-notoserifcjksc">的每一个，</text><text x="127.00" y="193.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="165.29" y="193.23" font-size="11.00" class="sc-notoserifcjksc">都会获得该靶标的结构，以及</text><text x="311.18" y="193.23" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="325.70" y="193.23" font-size="11.00" class="sc-notoserifcjksc">小时实际耗时的固定预算，用于针对该靶标</text><text x="72.00" y="208.85" font-size="11.00" class="sc-notoserifcjksc">设计一组</text><text x="118.89" y="208.85" font-size="11.00" class="sc-loraregular">30</text><text x="134.74" y="208.85" font-size="11.00" class="sc-notoserifcjksc">个微型蛋白结合剂。这些蛋白质靶标在这篇</text><text x="343.74" y="208.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">博客文章</text><text x="387.74" y="208.85" font-size="11.00" class="sc-notoserifcjksc">中有所介绍；我们在本评估中</text><text x="72.00" y="224.47" font-size="11.00" class="sc-notoserifcjksc">排除了</text><text x="107.89" y="224.47" font-size="11.00" class="sc-loraregular">Cas9</text><text x="132.71" y="224.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="143.71" y="224.47" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="238.65" y="224.47" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="285.54" y="224.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="371.28" y="224.47" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="404.28" y="224.47" font-size="11.00" class="sc-loraregular">82.3%</text><text x="437.66" y="224.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="451.56" y="224.47" font-size="11.00" class="sc-loraregular sc-k">82.6%</text><text x="482.17" y="224.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="289.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.7</text><text x="109.17" y="289.31" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">生物医学图像分析</text><text x="72.00" y="321.19" font-size="11.00" class="sc-notoserifcjksc">该基准测试使用来自公开生物医学图像分析竞赛的数据，评估模型对生物医学图像进行定量分析</text><text x="72.00" y="336.81" font-size="11.00" class="sc-notoserifcjksc">的能力。任务输入涵盖</text><text x="184.89" y="336.81" font-size="11.00" class="sc-loraregular">CT</text><text x="199.62" y="336.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="210.62" y="336.81" font-size="11.00" class="sc-loraregular">MRI</text><text x="231.31" y="336.81" font-size="11.00" class="sc-notoserifcjksc">、组织病理、皮肤镜、视网膜、超声、显微及其他成像。我们对</text><text x="72.00" y="352.43" font-size="11.00" class="sc-notoserifcjksc">评分进行了缩放，以反映</text><text x="195.89" y="352.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="352.43" font-size="11.00" class="sc-notoserifcjksc">的表现相对于相应竞赛中所取得最佳结果的水平。我们每道题</text><text x="72.00" y="368.05" font-size="11.00" class="sc-notoserifcjksc">运行了</text><text x="107.89" y="368.05" font-size="11.00" class="sc-loraregular">1</text><text x="114.79" y="368.05" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="158.79" y="368.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="253.73" y="368.05" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="300.62" y="368.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="386.36" y="368.05" font-size="11.00" class="sc-notoserifcjksc">相近（</text><text x="419.36" y="368.05" font-size="11.00" class="sc-loraregular">72.2%</text><text x="451.41" y="368.05" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="465.31" y="368.05" font-size="11.00" class="sc-loraregular">71.4%</text><text x="492.62" y="368.05" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="383.67" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="137.49" y="383.67" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="151.39" y="383.67" font-size="11.00" class="sc-loraregular sc-k">77.5%</text><text x="182.21" y="383.67" font-size="11.00" class="sc-notoserifcjksc">的得分领先，</text><text x="248.21" y="383.67" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="324.54" y="383.67" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="360.43" y="383.67" font-size="11.00" class="sc-loraregular sc-k">37.8%</text><text x="389.34" y="383.67" font-size="11.00" class="sc-notoserifcjksc">（基于其</text><text x="436.23" y="383.67" font-size="11.00" class="sc-loraregular">91</text><text x="449.49" y="383.67" font-size="11.00" class="sc-notoserifcjksc">个案例中已完成的</text><text x="72.00" y="399.29" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="87.36" y="399.29" font-size="11.00" class="sc-notoserifcjksc">个计算；两个未完成，不计入得分）。</text><text x="72.00" y="497.15" font-size="11.00" class="sc-notoserifcjksc">这项评估考察模型协助完成分子生物学实验方案的能力。故障排查变体（</text><text x="424.00" y="497.15" font-size="11.00" class="sc-loraregular sc-k">Troubleshooting</text><text x="72.00" y="512.77" font-size="11.00" class="sc-loraregular sc-k">variant</text><text x="107.49" y="512.77" font-size="11.00" class="sc-notoserifcjksc">）要求</text><text x="143.38" y="512.77" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="181.67" y="512.77" font-size="11.00" class="sc-notoserifcjksc">发现并修复实验方案中的问题。</text><text x="335.67" y="512.77" font-size="11.00" class="sc-loraregular sc-k">Understanding (V2)</text><text x="438.10" y="512.77" font-size="11.00" class="sc-notoserifcjksc">变体是由</text><text x="484.99" y="512.77" font-size="11.00" class="sc-loraregular">Benchling</text><text x="72.00" y="528.39" font-size="11.00" class="sc-notoserifcjksc">创建的一组题目，它向</text><text x="184.89" y="528.39" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="528.39" font-size="11.00" class="sc-notoserifcjksc">提供一份真实的实验方案（例如</text><text x="380.08" y="528.39" font-size="11.00" class="sc-loraregular sc-k">protocols.io</text><text x="443.90" y="528.39" font-size="11.00" class="sc-notoserifcjksc">文档、厂商手册或</text><text x="72.00" y="544.01" font-size="11.00" class="sc-notoserifcjksc">核心实验平台指南），以及一个关于应用或调整该方案的实际问题。在这两个变体上，</text><text x="490.00" y="544.01" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="559.63" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="559.63" font-size="11.00" class="sc-notoserifcjksc">均较</text><text x="153.54" y="559.63" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="239.78" y="559.63" font-size="11.00" class="sc-notoserifcjksc">有所提升（故障排查</text><text x="341.68" y="559.63" font-size="11.00" class="sc-loraregular sc-k">67.3%</text><text x="373.84" y="559.63" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="387.73" y="559.63" font-size="11.00" class="sc-loraregular sc-k">49.9%</text><text x="418.51" y="559.63" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="429.51" y="559.63" font-size="11.00" class="sc-loraregular sc-k">Understanding (V2)</text><text x="72.00" y="575.25" font-size="11.00" class="sc-loraregular sc-k">66.6%</text><text x="106.13" y="575.25" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="120.03" y="575.25" font-size="11.00" class="sc-loraregular">58.9%</text><text x="150.84" y="575.25" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="343.74" y="200.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="343.74" y="200.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="354.74" y="200.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="354.74" y="200.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="365.74" y="200.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="365.74" y="200.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="376.74" y="200.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="376.74" y="200.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
