28.52" y="126.99" font-size="11.00" class="sc-notoserifcjksc">在一个自包含的环境中依据自然语言指令工作，并根据隐藏的、特定于任务的测试对</text><text x="72.00" y="142.61" font-size="11.00" class="sc-notoserifcjksc">其产出物进行评分。</text><text x="72.00" y="169.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="169.38" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，在</text><text x="334.83 341.33 347.30 352.06 361.89 364.99 371.66 377.34 380.33 385.71 392.55 398.51 405.19 411.04 417.63 423.01 429.25 435.10 438.19 444.15 450.83 456.63" y="169.38" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="465.48" y="169.38" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="72.00" y="185.00" font-size="11.00" class="sc-loraregular sc-k">59.9%</text><text x="102.81" y="185.00" font-size="11.00" class="sc-notoserifcjksc">；回退机制在任何请求或试验中均未触发。</text><text x="311.81" y="185.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="397.55" y="185.00" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="422.44" y="185.00" font-size="11.00" class="sc-loraregular sc-k">58.7%</text><text x="451.61" y="185.00" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="462.61" y="185.00" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="200.62" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="200.62" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="112.49" y="200.62" font-size="11.00" class="sc-loraregular sc-k">52.6%</text><text x="142.92" y="200.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="153.92" y="200.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="230.95" y="200.62" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="255.84" y="200.62" font-size="11.00" class="sc-loraregular sc-k">29.0%</text><text x="286.87" y="200.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="297.87" y="200.62" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="374.57" y="200.62" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="399.46" y="200.62" font-size="11.00" class="sc-loraregular sc-k">24.7%</text><text x="428.08" y="200.62" font-size="11.00" class="sc-notoserifcjksc">。按任务聚类的标准</text><text x="72.00" y="216.24" font-size="11.00" class="sc-notoserifcjksc">误，</text><text x="94.00" y="216.24" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="150.65" y="216.24" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="164.54" y="216.24" font-size="11.00" class="sc-loraregular sc-k">±4.7</text><text x="186.65" y="216.24" font-size="11.00" class="sc-notoserifcjksc">分，其他模型为</text><text x="266.55" y="216.24" font-size="11.00" class="sc-loraregular">±3.5–4.8</text><text x="311.44" y="216.24" font-size="11.00" class="sc-notoserifcjksc">分（</text><text x="333.44" y="216.24" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="380.88" y="216.24" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="394.77" y="216.24" font-size="11.00" class="sc-loraregular">±4.8</text><text x="415.45" y="216.24" font-size="11.00" class="sc-notoserifcjksc">）。与</text><text x="451.35 457.85 463.81 468.57 478.41 481.50 488.17 493.85 496.84 502.22 509.06 515.03 521.70 527.55" y="216.24" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="72.00" y="231.86" font-size="11.00" class="sc-loraregular sc-k">4.0</text><text x="90.23" y="231.86" font-size="11.00" class="sc-notoserifcjksc">一样，我们在不允许互联网出站访问的条件下运行评估，基于历史运行日志预先缓存模型运</text><text x="72.00" y="247.48" font-size="11.00" class="sc-notoserifcjksc">行所需的资源，并据此重新构建镜像。</text><text x="72.00" y="292.72" font-size="11.00" class="sc-notoserifcjksc">报告的数字使用</text><text x="151.89" y="292.72" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--bare</text><text x="194.39" y="292.72" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="241.29" y="292.72" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="309.13" y="292.72" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="323.03" y="292.72" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="345.72" y="292.72" font-size="11.00" class="sc-notoserifcjksc">推理强度测得。作为参考，公开排行榜</text><text x="72.00" y="308.34" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="96.89" y="308.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="173.93" y="308.34" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="220.82" y="308.34" font-size="11.00" class="sc-loraregular sc-k">30.0%</text><text x="252.54" y="308.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="263.54" y="308.34" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="340.24" y="308.34" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="354.13" y="308.34" font-size="11.00" class="sc-loraregular">21.4%</text><text x="382.28" y="308.34" font-size="11.00" class="sc-notoserifcjksc">，均与我们内部设置的结果相差</text><text x="72.00" y="323.96" font-size="11.00" class="sc-notoserifcjksc">在预期噪声范围内。</text><text x="171.00" y="323.96" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="212.40" y="323.96" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="237.30" y="323.96" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="302.79" y="323.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="316.68" y="323.96" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="339.38" y="323.96" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="419.27" y="323.96" font-size="11.00" class="sc-loraregular sc-k">64.6%</text><text x="450.12" y="323.96" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="461.12" y="323.96" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="502.52" y="323.96" font-size="11.00" class="sc-notoserifcjksc">尚未报</text><text x="72.00" y="339.58" font-size="11.00" class="sc-notoserifcjksc">告</text><text x="85.89" y="339.58" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Sol</text><text x="140.45" y="339.58" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="154.35 160.85 166.81 171.57 181.41 184.50 191.17 196.85 199.84 205.22 212.06 218.02 224.70 230.55 237.14 240.04 246.27 252.13 255.22 261.18 267.86 273.65" y="339.58" font-size="11.00" class="sc-loraregular">Terminal-Bench Science</text><text x="282.51" y="339.58" font-size="11.00" class="sc-notoserifcjksc">分数，公开排行榜也没有。</text><text x="72.00" y="424.67" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="152.07" y="421.00" font-size="6.60" class="sc-loraregular">13</text><text x="161.04" y="424.67" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="174.93" y="424.67" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="222.98" y="424.67" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，包含</text><text x="335.87" y="424.67" font-size="11.00" class="sc-loraregular">34</text><text x="350.86" y="424.67" font-size="11.00" class="sc-notoserifcjksc">个超长程工程与研究任务，涵盖系统实</text><text x="72.00" y="440.29" font-size="11.00" class="sc-notoserifcjksc">现、性能优化、科学计算、</text><text x="204.00" y="440.29" font-size="11.00" class="sc-loraregular">AI</text><text x="217.46" y="440.29" font-size="11.00" class="sc-notoserifcjksc">研究和视觉推理，例如将</text><text x="341.36" y="440.29" font-size="11.00" class="sc-loraregular sc-k">Quantum Espresso</text><text x="441.15" y="440.29" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="455.04" y="440.29" font-size="11.00" class="sc-loraregular sc-k">Fortran</text><text x="496.37" y="440.29" font-size="11.00" class="sc-notoserifcjksc">移植到</text><text x="72.00" y="455.91" font-size="11.00" class="sc-loraregular">Rust</text><text x="94.82" y="455.91" font-size="11.00" class="sc-notoserifcjksc">、构建一个能运行飞行模拟器的</text><text x="251.72" y="455.91" font-size="11.00" class="sc-loraregular sc-k">OpenGL</text><text x="297.15" y="455.91" font-size="11.00" class="sc-notoserifcjksc">场景渲染器，以及对大语言模型（</text><text x="462.15" y="455.91" font-size="11.00" class="sc-loraregular">LLM</text><text x="484.96" y="455.91" font-size="11.00" class="sc-notoserifcjksc">）进行后训</text><text x="72.00" y="471.53" font-size="11.00" class="sc-notoserifcjksc">练，使其能玩一款交互式解谜游戏。最强的模型通常每个任务工作近</text><text x="404.89" y="471.53" font-size="11.00" class="sc-loraregular">20</text><text x="420.52" y="471.53" font-size="11.00" class="sc-notoserifcjksc">小时，且距离使该基准饱</text><text x="72.00" y="487.15" font-size="11.00" class="sc-notoserifcjksc">和仍相去甚远。每个模型都在</text><text x="217.89" y="487.15" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="265.94" y="487.15" font-size="11.00" class="sc-notoserifcjksc">自己的智能体运行框架中以</text><text x="400.83" y="487.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="423.53" y="487.15" font-size="11.00" class="sc-notoserifcjksc">推理强度运行，每个任</text><text x="72.00" y="502.77" font-size="11.00" class="sc-notoserifcjksc">务进行五次试验，报告的分数为每个任务五次试验的平均值。</text><text x="72.00" y="562.95" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="562.95" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="562.95" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="263.80" y="562.95" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="299.69" y="562.95" font-size="11.00" class="sc-loraregular">61.9%</text><text x="328.68" y="562.95" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="353.58" y="562.95" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="401.63" y="562.95" font-size="11.00" class="sc-notoserifcjksc">评估的模型中排名第三，落</text><text x="72.00" y="578.57" font-size="11.00" class="sc-notoserifcjksc">后于</text><text x="96.89" y="578.57" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="159.49" y="578.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="170.49" y="578.57" font-size="11.00" class="sc-loraregular">65.5%</text><text x="201.12" y="578.57" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="226.01" y="578.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="308.85" y="578.57" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="319.85" y="578.57" font-size="11.00" class="sc-loraregular">62.3%</text><text x="350.52" y="578.57" font-size="11.00" class="sc-notoserifcjksc">），领先于</text><text x="408.41" y="578.57" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="594.19" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="594.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71" y="594.19" font-size="11.00" class="sc-loraregular">56.3%</text><text x="126.46" y="594.19" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="151.35" y="594.19" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="211.61" y="594.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="222.61" y="594.19" font-size="11.00" class="sc-loraregular">32.2%</text><text x="252.83" y="594.19" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="619.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="619.53" font-size="11.00" class="sc-loraregular">34</text><text x="100.88" y="619.53" font-size="11.00" class="sc-notoserifcjksc">个任务中的</text><text x="158.77" y="619.53" font-size="11.00" class="sc-loraregular">8</text><text x="167.84" y="619.53" font-size="11.00" class="sc-notoserifcjksc">个上，</text><text x="200.84" y="619.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="257.49" y="619.53" font-size="11.00" class="sc-notoserifcjksc">取得了所有公开可用模型中的最高分，其中包括性能优</text><text x="72.00" y="635.15" font-size="11.00" class="sc-notoserifcjksc">化、系统实现和视觉推理方面的任务。</text><a href="https://www.frontierswe.com/blog/v2" rel="noopener"><rect x="235.38" y="707.20" width="183.97" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="72.00 80.93 84.30 93.23 96.86 107.68 116.76 122.13 129.61 138.53 143.91 152.72 161.35 170.44 178.83 187.91 191.55 200.60 203.97" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.8 CursorBench 4.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">115</text><text x="72.00" y="116.76" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">CursorBench 4.0</text><text x="160.12" y="116.76" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="174.01" y="116.76" font-size="11.00" class="sc-loraregular">Cursor</text><text x="212.22" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的智能体编程基准测试。它包含取自真实世界</text><text x="435.11" y="116.76" font-size="11.00" class="sc-loraregular">Cursor</text><text x="473.31" y="116.76" font-size="11.00" class="sc-notoserifcjksc">使用场景的编</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">程任务，并在</text><text x="140.89" y="132.38" font-size="11.00" class="sc-loraregular">Cursor</text><text x="179.10" y="132.38" font-size="11.00" class="sc-notoserifcjksc">的生产环境智能体运行框架中端到端运行。所有分数均由</text><text x="456.99" y="132.38" font-size="11.00" class="sc-loraregular">Cursor</text><text x="495.19" y="132.38" font-size="11.00" class="sc-notoserifcjksc">独立测量</text><text x="72.00" y="148.00" font-size="11.00" class="sc-notoserifcjksc">并报告；</text><text x="116.00" y="148.00" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="210.94" y="148.00" font-size="11.00" class="sc-notoserifcjksc">的每任务成本是我们根据</text><text x="334.83" y="148.00" font-size="11.00" class="sc-loraregular">Cursor</text><text x="373.04" y="148.00" font-size="11.00" class="sc-notoserifcjksc">报告的</text><text x="408.93" y="148.00" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="440.98" y="148.00" font-size="11.00" class="sc-notoserifcjksc">数按标准定价估算</text><text x="72.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">的，其他所有成本均为</text><text x="184.89" y="163.62" font-size="11.00" class="sc-loraregular">Cursor</text><text x="223.10" y="163.62" font-size="11.00" class="sc-notoserifcjksc">公布的数据。</text><text x="72.00" y="213.91" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="213.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.54" y="213.91" font-size="11.00" class="sc-loraregular sc-k">CursorBench</text><text x="212.44" y="213.91" font-size="11.00" class="sc-notoserifcjksc">上的得分为：</text><text x="278.44" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="301.13" y="213.91" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="359.03" y="213.91" font-size="11.00" class="sc-loraregular">55.5%</text><text x="389.29" y="213.91" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="400.29" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="436.19" y="213.91" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="450.08" y="213.91" font-size="11.00" class="sc-loraregular">53.1%</text><text x="478.48" y="213.91" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="489.48" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="518.78" y="213.91" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="72.00" y="229.53" font-size="11.00" class="sc-loraregular sc-k">47.8%</text><text x="101.01" y="229.53" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="112.01" y="229.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="154.51" y="229.53" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="168.40" y="229.53" font-size="11.00" class="sc-loraregular sc-k">39.2%</text><text x="198.89" y="229.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="565.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.87" y="565.03" font-size="9.00" class="sc-lorabold">8.8.A]</text><text x="112.71" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下</text><text x="196.07" y="565.03" font-size="9.00" class="sc-lorabold sc-k">CursorBench 4.0</text><text x="269.68" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">得分与每任务平均成本的关系。</text><text x="395.68" y="565.03" font-size="9.00" class="sc-loraregular">Cursor</text><text x="426.94" y="565.03" font-size="9.00" class="sc-notoserifcjksc">在其生产环境智能体运行框</text><text x="72.00" y="576.73" font-size="9.00" class="sc-notoserifcjksc">架中端到端执行了该评估，并独立测量和报告了分数。对于</text><text x="308.37" y="576.73" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="386.05" y="576.73" font-size="9.00" class="sc-notoserifcjksc">以外的模型，分数和每任务成本均为</text><text x="72.00" y="588.43" font-size="9.00" class="sc-loraregular">Cursor</text><text x="103.26" y="588.43" font-size="9.00" class="sc-notoserifcjksc">于</text><text x="114.62" y="588.43" font-size="9.00" class="sc-loraregular sc-k">2026</text><text x="137.38" y="588.43" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="148.75" y="588.43" font-size="9.00" class="sc-loraregular">9</text><text x="156.32" y="588.43" font-size="9.00" class="sc-notoserifcjksc">月在其公开排行榜上公布的数据。</text><text x="291.32" y="588.43" font-size="9.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="337.67" y="588.43" font-size="9.00" class="sc-notoserifcjksc">的分数来自</text><text x="385.04" y="588.43" font-size="9.00" class="sc-loraregular">Cursor</text><text x="416.29" y="588.43" font-size="9.00" class="sc-notoserifcjksc">直接发给我们的结果表（其每</text><text x="72.00" y="600.13" font-size="9.00" class="sc-notoserifcjksc">任务成本是我们根据该表中的</text><text x="191.37" y="600.13" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="217.59" y="600.13" font-size="9.00" class="sc-notoserifcjksc">数按标准定价估算的）。每个模型均显示五个推理强度档位（</text><text x="460.59" y="600.13" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="476.80" y="600.13" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="485.80" y="600.13" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="518.20" y="600.13" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="93.60" y="611.83" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="102.60" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="131.97" y="611.83" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="143.34" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="159.54" y="611.83" font-size="9.00" class="sc-notoserifcjksc">），但</text><text x="188.91" y="611.83" font-size="9.00" class="sc-loraregular sc-k">Grok 4.7</text><text x="225.38" y="611.83" font-size="9.00" class="sc-notoserifcjksc">除外，它仅显示三个档位（</text><text x="333.38" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="365.78" y="611.83" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="374.78" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="398.76" y="611.83" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="410.12" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="437.13" y="611.83" font-size="9.00" class="sc-notoserifcjksc">）。两个来源均未提供不</text><text x="72.00" y="623.53" font-size="9.00" class="sc-notoserifcjksc">确定性区间，因此图中未显示。请注意，</text><text x="234.00" y="623.53" font-size="9.00" class="sc-loraregular">y</text><text x="241.12" y="623.53" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="261.49" y="623.53" font-size="9.00" class="sc-loraregular sc-k">23%</text><text x="281.39" y="623.53" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的差异在视觉上被放大。</text><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="72.00" y="107.96" width="67.00" height="11.00" fill="transparent"/></a><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="139.00" y="107.96" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="141.89" y="107.96" width="15.33" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="72.00 80.93 84.30 93.18 96.82 106.57 111.95 121.18 124.88 132.94 145.28 154.76 159.97" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.9 ArXivMath</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00" y="116.76" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="127.98" y="116.76" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87" y="116.76" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="212.20" y="116.76" font-size="11.00" class="sc-notoserifcjksc">维护的一项研究级数学最终答案型基准测试。题目每月从近期的</text><text x="72.00" y="132.38" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="100.43" y="132.38" font-size="11.00" class="sc-notoserifcjksc">论文中提取，再经过自动与人工检查加以筛选，以确保题目自成一体、不平凡且可验证。由</text><text x="72.00" y="148.00" font-size="11.00" class="sc-notoserifcjksc">于题目取自活跃的研究工作，该基准测试比竞赛</text><text x="305.89" y="148.00" font-size="11.00" class="sc-loraregular">/</text><text x="316.38" y="148.00" font-size="11.00" class="sc-notoserifcjksc">奥赛类基准测试更贴近现实，与数学研究的联</text><text x="72.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">系也更紧密。</text><text x="72.00" y="230.10" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89" y="230.10" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="196.87" y="230.10" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87" y="230.10" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="257.69" y="230.10" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="230.10" font-size="11.00" class="sc-loraregular">8</text><text x="280.66" y="230.10" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.66" y="230.10" font-size="11.00" class="sc-loraregular">57</text><text x="316.62" y="230.10" font-size="11.00" class="sc-notoserifcjksc">道题）上评估了</text><text x="396.51" y="230.10" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="488.56" y="230.10" font-size="11.00" class="sc-notoserifcjksc">。与早期</text><text x="72.00" y="245.72" font-size="11.00" class="sc-notoserifcjksc">版本不同，</text><text x="127.00" y="245.72" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="186.32" y="245.72" font-size="11.00" class="sc-notoserifcjksc">现在优先选用能够解决或否定先前提出的猜想的结果，</text><text x="450.32" y="245.72" font-size="11.00" class="sc-loraregular">57</text><text x="464.28" y="245.72" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="511.18" y="245.72" font-size="11.00" class="sc-loraregular">25</text><text x="525.97" y="245.72" font-size="11.00" class="sc-notoserifcjksc">道</text><text x="72.00" y="261.34" font-size="11.00" class="sc-notoserifcjksc">来自此类结果，</text><text x="149.00" y="261.34" font-size="11.00" class="sc-loraregular">“</text><text x="153.40" y="261.34" font-size="11.00" class="sc-notoserifcjksc">其表述方式使得仅猜测猜想中的值会得到错误答案</text><text x="395.40" y="261.34" font-size="11.00" class="sc-loraregular">”</text><text x="399.24" y="261.34" font-size="11.00" class="sc-notoserifcjksc">。因此，该题集奖励的是推导</text><text x="72.00" y="276.96" font-size="11.00" class="sc-notoserifcjksc">出答案，而非回忆已有文献。</text><text x="72.00" y="327.26" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="327.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.54" y="327.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="165.24" y="327.26" font-size="11.00" class="sc-notoserifcjksc">推理强度下，不使用工具得分</text><text x="311.13" y="327.26" font-size="11.00" class="sc-loraregular">86.8%</text><text x="342.13" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，使用工具（代码执行沙箱，无互联网访</text><text x="72.00" y="342.88" font-size="11.00" class="sc-notoserifcjksc">问）得分</text><text x="118.89" y="342.88" font-size="11.00" class="sc-loraregular">95.2%</text><text x="149.43" y="342.88" font-size="11.00" class="sc-notoserifcjksc">，结果为每题四次尝试的平均值。作为对比，在相同设置下，</text><text x="446.43" y="342.88" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="529.83" y="342.88" font-size="11.00" class="sc-notoserifcjksc">不</text><text x="72.00" y="358.50" font-size="11.00" class="sc-notoserifcjksc">使用工具得分</text><text x="140.89" y="358.50" font-size="11.00" class="sc-loraregular">82.9%</text><text x="171.62" y="358.50" font-size="11.00" class="sc-notoserifcjksc">，使用工具得分</text><text x="251.51" y="358.50" font-size="11.00" class="sc-loraregular">92.1%</text><text x="280.05" y="358.50" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="291.05" y="358.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="376.79" y="358.50" font-size="11.00" class="sc-notoserifcjksc">则分别得分</text><text x="434.68" y="358.50" font-size="11.00" class="sc-loraregular">91.2%</text><text x="466.12" y="358.50" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="480.01" y="358.50" font-size="11.00" class="sc-loraregular">96.9%</text><text x="511.36" y="358.50" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="408.74" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="131.32" y="408.74" font-size="11.00" class="sc-notoserifcjksc">自己的</text><text x="167.22" y="408.74" font-size="11.00" class="sc-loraregular">8</text><text x="176.29" y="408.74" font-size="11.00" class="sc-notoserifcjksc">月排行榜采用不同的设置：每个模型在其厂商的智能体运行框架中运行，可</text><text x="72.00" y="424.36" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="424.36" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="136.44" y="424.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="150.33" y="424.36" font-size="11.00" class="sc-loraregular sc-k">SageMath</text><text x="200.64" y="424.36" font-size="11.00" class="sc-notoserifcjksc">；提示词要求模型在找不到解答时给出最佳猜测；每题两次尝试；并</text><text x="72.00" y="439.98" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="439.98" font-size="11.00" class="sc-loraregular">LLM</text><text x="122.60" y="439.98" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="177.60" y="439.98" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="231.31" y="439.98" font-size="11.00" class="sc-notoserifcjksc">）。在该设置下，他们报告</text><text x="366.21" y="439.98" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Sol</text><text x="417.87" y="439.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="428.87" y="439.98" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="448.68" y="439.98" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="484.57" y="439.98" font-size="11.00" class="sc-loraregular sc-k">93.0%</text><text x="516.00" y="439.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="455.60" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="134.60" y="455.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="145.60" y="455.60" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="165.40" y="455.60" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="201.30" y="455.60" font-size="11.00" class="sc-loraregular sc-k">88.6%</text><text x="232.19" y="455.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="243.19" y="455.60" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="323.69" y="455.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="334.69" y="455.60" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="361.10" y="455.60" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="396.99" y="455.60" font-size="11.00" class="sc-loraregular sc-k">87.7%</text><text x="424.76" y="455.60" font-size="11.00" class="sc-notoserifcjksc">。这些数字与我们</text><text x="512.76" y="455.60" font-size="11.00" class="sc-loraregular">“</text><text x="517.16" y="455.60" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="72.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">工具</text><text x="94.00" y="471.22" font-size="11.00" class="sc-loraregular">”</text><text x="97.84" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的结果最为接近，但不可直接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 103.98 107.36 115.09 120.09 128.38 137.19 142.18 150.99 164.49 172.68 180.70 189.13 196.93" y="486.97" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 ProgramBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">117</text><text x="72.00" y="385.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76" y="385.75" font-size="9.00" class="sc-lorabold">8.9.A]</text><text x="112.60" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="204.97" y="385.75" font-size="9.00" class="sc-lorabold sc-k">ArXivMath</text><text x="251.15" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="260.15" y="385.75" font-size="9.00" class="sc-lorabold">2026</text><text x="283.01" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="294.38" y="385.75" font-size="9.00" class="sc-lorabold">8</text><text x="301.90" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">月）准确率得分。</text><text x="373.90" y="385.75" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="449.21" y="385.75" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="458.21" y="385.75" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="525.99" y="385.75" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="397.45" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="140.24" y="397.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="151.60" y="397.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="214.63" y="397.45" font-size="9.00" class="sc-notoserifcjksc">均在内部评估，未启用安全防护分类器，推理强度为</text><text x="424.00" y="397.45" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="440.20" y="397.45" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="449.20" y="397.45" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="526.88" y="397.45" font-size="9.00" class="sc-notoserifcjksc">是</text><text x="72.00" y="409.15" font-size="9.00" class="sc-notoserifcjksc">在发布检查点的预发布服务部署上评估的。</text><text x="72.00" y="446.07" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="446.07" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00" y="515.06" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="150.82" y="515.06" font-size="11.00" class="sc-notoserifcjksc">是一项长上下文智能体编程基准测试，包含</text><text x="362.71" y="515.06" font-size="11.00" class="sc-loraregular">200</text><text x="385.17" y="515.06" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得</text><text x="72.00" y="530.68" font-size="11.00" class="sc-notoserifcjksc">由某个开源项目编译而成的二进制文件及该项目的文档，必须在不使用互联网或反编译工具的情</text><text x="72.00" y="546.30" font-size="11.00" class="sc-notoserifcjksc">况下重建一个能复现原程序行为的代码库。任务涵盖从小型终端工具（</text><text x="413.00" y="546.30" font-size="11.00" class="sc-loraregular">jq</text><text x="422.21" y="546.30" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="433.21" y="546.30" font-size="11.00" class="sc-loraregular sc-k">ripgrep</text><text x="470.93" y="546.30" font-size="11.00" class="sc-notoserifcjksc">）到大型系统</text><text x="72.00" y="561.92" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="561.92" font-size="11.00" class="sc-loraregular sc-k">FFmpeg</text><text x="123.39" y="561.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="134.39" y="561.92" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="169.13" y="561.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.13" y="561.92" font-size="11.00" class="sc-loraregular sc-k">PHP</text><text x="204.88" y="561.92" font-size="11.00" class="sc-notoserifcjksc">解释器）。提交结果依据超过</text><text x="350.77 356.44 362.40 366.99 369.59 376.43 383.26" y="561.92" font-size="11.00" class="sc-loraregular">247,000</text><text x="392.99" y="561.92" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测试进行评</text><text x="72.00" y="577.54" font-size="11.00" class="sc-notoserifcjksc">分，这些测试通过智能体驱动的模糊测试生成。</text><text x="72.00" y="644.59" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="644.59" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="644.59" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件在隐藏测试集上得分低于</text><text x="356.77" y="644.59" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="375.38" y="644.59" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳定</text><text x="72.00" y="660.21" font-size="11.00" class="sc-notoserifcjksc">性），剩余</text><text x="129.89" y="660.21" font-size="11.00" class="sc-loraregular">166</text><text x="149.51" y="660.21" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务中，我们只依据参考二进制文件能够通过的测试计分。我们</text><text x="72.00" y="675.83" font-size="11.00" class="sc-notoserifcjksc">使用与上游代码仓库相同的</text><text x="206.89" y="675.83" font-size="11.00" class="sc-loraregular sc-k">mini-swe-agent</text><text x="291.47" y="675.83" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六小时的时</text><text x="72.00" y="691.45" font-size="11.00" class="sc-notoserifcjksc">间限制。在该</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p118.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 118 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 100.20 103.58 112.74 118.51" y="238.25" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.1 HLE</text><text x="72.00" y="713.03" font-size="6.00" class="sc-loraregular">14</text><text x="80.06 86.06 92.05 97.21 103.28 105.80 108.43 114.21 116.67 119.20 121.83 127.18 131.04 133.67 138.83 141.55 144.01 146.64 149.69 155.06 161.19 166.56 172.01 175.06 177.52 180.15 187.75 193.72 202.66 207.81 213.88 216.85 220.74 226.02 227.58 232.20 234.83 240.83 245.99 250.62 254.49 257.11 263.33 268.63 273.79 282.72 285.18 287.81 292.97 296.68 303.17 305.98 311.02 313.52 318.89 324.34 330.55 334.18 336.64 340.28 345.70 350.85 356.27 361.88" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="366.97 372.87 376.84 380.71 386.67 391.30 393.80 397.49 403.95 409.10 413.43 418.73 421.54 426.20 428.66 434.50 438.78 444.31 450.77 455.92 461.74 466.02 472.92 478.29 483.73 489.94 493.58 496.04 499.68 505.09 510.24 515.66" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">118</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">任务集上，</text><text x="127.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="221.94" y="82.61" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="246.83" y="82.61" font-size="11.00" class="sc-loraregular sc-k">79.7%</text><text x="275.08" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="299.98" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="386.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="411.11" y="82.61" font-size="11.00" class="sc-loraregular sc-k">77.3%</text><text x="439.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="450.17" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89" y="98.23" font-size="11.00" class="sc-loraregular">91.2%</text><text x="125.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89" y="131.19" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="197.71" y="131.19" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="384.71" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="441.36" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了一系</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">列上下文长度，最长可达完整的</text><text x="228.89" y="146.81" font-size="11.00" class="sc-loraregular">100</text><text x="249.45" y="146.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="263.35" y="146.81" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="295.40" y="146.81" font-size="11.00" class="sc-notoserifcjksc">窗口，且这些任务所考察的长上下文能力与实际的</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">下游用例高度契合。</text><text x="72.00" y="197.36" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="197.36" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="266.12" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="266.12" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="266.12" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="266.12" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="262.45" font-size="6.60" class="sc-loraregular">14</text><text x="237.53" y="266.12" font-size="11.00" class="sc-notoserifcjksc">是一项多模态基准测试，包含横跨数十个学科的</text><text x="471.43 477.33 480.11 486.10 492.93" y="266.12" font-size="11.00" class="sc-loraregular">2,500</text><text x="502.67" y="266.12" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="281.74" font-size="11.00" class="sc-notoserifcjksc">目。这些题目由领域专家编写和审核，仅保留前沿大语言模型无法回答的题目，并且经过设计，</text><text x="72.00" y="297.36" font-size="11.00" class="sc-notoserifcjksc">使其无法通过互联网搜索快速作答。</text><text x="72.00" y="347.30" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="347.30" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="287.94" y="347.30" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="309.94" y="347.30" font-size="11.00" class="sc-loraregular">1</text><text x="313.95" y="347.30" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具）；（</text><text x="445.95" y="347.30" font-size="11.00" class="sc-loraregular">2</text><text x="451.85" y="347.30" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、</text><text x="72.00" y="362.92" font-size="11.00" class="sc-notoserifcjksc">网页抓取、程序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="415.89" y="362.92" font-size="11.00" class="sc-robotomonoregular" fill="#188038">auto</text><text x="442.30" y="362.92" font-size="11.00" class="sc-notoserifcjksc">，每次尝试的任务</text><text x="72.00" y="378.54" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="107.89" y="378.54" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="165.23" y="378.54" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。</text><text x="319.23" y="378.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="405.18" y="378.54" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="428.79" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具版本中出现结果污染，我们对搜索器和抓取器都屏蔽了已知讨论</text><text x="459.89" y="428.79" font-size="11.00" class="sc-loraregular">HLE</text><text x="484.57" y="428.79" font-size="11.00" class="sc-notoserifcjksc">的来源（见</text><text x="72.00" y="444.41" font-size="11.00" class="sc-notoserifcjksc">附录</text><text x="96.89" y="444.41" font-size="11.00" class="sc-loraregular sc-k">9.1</text><text x="109.79" y="444.41" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="120.79" y="444.41" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="131.79" y="444.41" font-size="11.00" class="sc-notoserifcjksc">我们还使用文本规则筛查每一条回答正确的对话记录，查找是否有使用</text><text x="475.68" y="444.41" font-size="11.00" class="sc-loraregular">HLE</text><text x="500.35" y="444.41" font-size="11.00" class="sc-notoserifcjksc">特定来</text><text x="72.00" y="460.03" font-size="11.00" class="sc-notoserifcjksc">源的迹象，并使用</text><text x="162.89" y="460.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="239.93" y="460.03" font-size="11.00" class="sc-notoserifcjksc">审查每一条被标记的对话记录。经确认的作弊情形会被重新判</text><text x="72.00" y="475.65" font-size="11.00" class="sc-notoserifcjksc">为错误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="366.97" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p119.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 119 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">119</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 127.66 133.22 141.50 146.21 151.96 154.86 158.58 163.54 165.27 169.63 172.00 177.43 182.15 186.52 190.23 192.60 198.22 203.15 207.86" y="367.00" font-size="9.00" class="sc-lorabold">8.11.1.A] Humanity’s Last Exam</text><text x="216.14" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.00" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">，使用工具）推理强度扩展</text><text x="351.46" y="367.00" font-size="9.00" class="sc-notoserifcjksc">。随着推理强度从</text><text x="425.83" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="444.40" y="367.00" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="473.76" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="489.97" y="367.00" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="498.97" y="367.00" font-size="9.00" class="sc-loraregular">HLE</text><text x="519.15" y="367.00" font-size="9.00" class="sc-notoserifcjksc">准确</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">率与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.15 106.53 115.74 123.96 133.02 143.06" y="428.07" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.2 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">15</text><text x="80.08 86.18 92.17 98.02 104.08 109.61 112.14 114.77 118.29 120.75 123.28 125.90 131.25 135.12 137.75 142.91 145.63 148.09 150.71 153.76 159.13 165.27 170.64 176.29 179.34 181.80 184.43 191.78 198.55 204.75 211.74 219.68 222.18 224.81 231.06 233.69 239.01 243.27 249.12 253.74 258.37 263.26 269.24 275.09 284.02 289.18 291.99 298.06 300.69 306.50 311.92 317.99 323.31 329.29 338.23 343.39 347.68 353.05 355.67 359.00 364.85 369.18 371.81 379.25 384.62 390.04 396.01 398.64 404.84 410.26 414.89 420.29 425.45 429.70 435.02 441.01 443.64 449.90 455.16 460.48 466.45 470.71 475.87 481.13 485.86" y="704.46" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: A cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.00" font-size="9.00" class="sc-lorabold sc-k">8.11.1.B] Humanity’s Last Exam</text><text x="216.14" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.00" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">，无工具）测试时计算扩展</text><text x="351.46" y="367.00" font-size="9.00" class="sc-notoserifcjksc">。随着推理强度从</text><text x="425.83" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="444.40" y="367.00" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="473.76" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="489.97" y="367.00" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="498.97" y="367.00" font-size="9.00" class="sc-loraregular">HLE</text><text x="519.15" y="367.00" font-size="9.00" class="sc-notoserifcjksc">准确</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">率与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费用。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="455.94" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="455.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10" y="455.94" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="408.89" y="452.27" font-size="6.60" class="sc-loraregular">15</text><text x="414.89" y="455.94" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.78" y="455.94" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="494.60" y="455.94" font-size="11.00" class="sc-notoserifcjksc">推出的一</text><text x="72.00" y="471.56" font-size="11.00" class="sc-notoserifcjksc">项深度研究基准测试，用于评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="479.00" y="471.56" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="520.68" y="471.56" font-size="11.00" class="sc-notoserifcjksc">包</text><text x="72.00" y="487.18" font-size="11.00" class="sc-notoserifcjksc">含</text><text x="85.89" y="487.18" font-size="11.00" class="sc-loraregular">100</text><text x="106.45" y="487.18" font-size="11.00" class="sc-notoserifcjksc">个精选任务，源自跨多个领域的用户查询。回答依据专家编写的评分细则进行评分，评分</text><text x="72.00" y="502.80" font-size="11.00" class="sc-notoserifcjksc">维度涵盖事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="569.50" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="569.50" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="454.12" y="569.50" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="585.12" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89" y="585.12" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="585.12" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="618.08" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89" y="618.08" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="160.57" y="618.08" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46" y="618.08" font-size="11.00" class="sc-loraregular sc-k">Gemini 3 Pro</text><text x="288.08" y="618.08" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已无法使用。在我们</text><text x="72.00" y="633.70" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89" y="633.70" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="259.85" y="633.70" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用同样的二元</text><text x="72.00" y="649.32" font-size="11.00" class="sc-loraregular sc-k">MET/UNMET</text><text x="146.32" y="649.32" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="649.32" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="649.32" font-size="11.00" class="sc-notoserifcjksc">节中的公式将其汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="616.18" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的实验方案，对每个回答进行五次独立的评分运行并记录平均值。我们的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">判提示词取自论文的</text><text x="171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="212.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="270.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="279.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变化</text><text x="491.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="505.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="519.47" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但会保持系统排序不变，因此我们的分数不能与论文的主要公布数字直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00" y="195.39" font-size="11.00" class="sc-loraregular sc-k">prompt</text><text x="110.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，预算为</text><text x="443.24" y="195.39" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="500.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件。随后我们只对该文件的内容评分，而不是对</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">完整的智能体对话记录评分，从而将交付物与中间工具输出隔离开来。</text><text x="72.00" y="555.10" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="555.10" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="173.95" y="555.10" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32" y="555.10" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37" y="555.10" font-size="9.00" class="sc-notoserifcjksc">任务预算下，随着推理强度从</text><text x="507.74" y="555.10" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="526.30" y="555.10" font-size="9.00" class="sc-notoserifcjksc">提</text><text x="72.00" y="566.80" font-size="9.00" class="sc-notoserifcjksc">升到</text><text x="92.37" y="566.80" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.57" y="566.80" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="117.57" y="566.80" font-size="9.00" class="sc-loraregular sc-k">DRACO</text><text x="151.67" y="566.80" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费</text><text x="72.00" y="578.50" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00" y="644.27" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">WANDR</text><text x="112.72" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72" y="644.27" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68" y="644.27" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="333.50" y="644.27" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，旨在为</text><text x="479.40" y="644.27" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="521.08" y="644.27" font-size="11.00" class="sc-notoserifcjksc">深</text><text x="72.00" y="659.89" font-size="11.00" class="sc-notoserifcjksc">度研究基准测试提供一个广度搜索方面的对应基准测试。它包含</text><text x="382.89" y="659.89" font-size="11.00" class="sc-loraregular">500</text><text x="405.44" y="659.89" font-size="11.00" class="sc-notoserifcjksc">个任务，模型须在任务中搜</text><text x="72.00" y="675.51" font-size="11.00" class="sc-notoserifcjksc">索数十到数百个实体，查找关于每个实体的事实，并在结构化记录中列出这些事实及其引用来</text><text x="72.00" y="691.13" font-size="11.00" class="sc-notoserifcjksc">源。我们运行的是该评估的修改版本；下文说明了方法上的差异。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="193.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="195.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="635.47" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="635.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="635.47" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="635.47" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="635.47" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="635.47" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="635.47" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="98.80" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="454.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89" y="114.42" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可使用与被测模型相同的网页抓</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">取工具。评分者会重新抓取被引用的</text><text x="250.89" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="272.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后由评判模型判断这些参考来源是否支持该解答。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32" y="179.77" font-size="11.00" class="sc-loraregular sc-k">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型在所</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">要求的事实收集中完成了多少）之间取得平衡。当只有部分所需事实能够得到验证时，给予部分</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">得分。结果为</text><text x="140.89" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="163.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不会导致整个任</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">务失败。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线网络搜索和网页抓取工具，只能访问一个冻结索引；而</text><text x="72.00" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="126.82" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的版本使用实时网络。</text><text x="236.82" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="275.11" y="292.53" font-size="11.00" class="sc-notoserifcjksc">模型使用</text><text x="322.01" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="407.96" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进行评判，而</text><text x="476.86" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="72.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="308.15" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="138.31" y="308.15" font-size="11.00" class="sc-notoserifcjksc">。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="394.20" y="308.15" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="449.02" y="308.15" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，</text><text x="72.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">我们的结果不能与竞争对手模型的已报告数字直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63" y="653.19" font-size="9.00" class="sc-loraregular sc-k">980k token</text><text x="473.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 103.15 106.53 117.99 126.43 129.86 134.69 138.12 145.73 154.78 163.60 171.61 180.05 184.88 188.26 195.99 200.99 209.28 218.09 223.08 231.89 245.39 253.58 261.60 270.03 277.83" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.1 Multi-Agent ProgramBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">123</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="153.19" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="153.19" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="186.71" y="153.19" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="233.60" y="153.19" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="328.54" y="153.19" font-size="11.00" class="sc-notoserifcjksc">在小型多智能体团队中运行的能力。</text><text x="72.00" y="168.81" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="150.82" y="168.81" font-size="11.00" class="sc-notoserifcjksc">是一项包含</text><text x="208.71" y="168.81" font-size="11.00" class="sc-loraregular">200</text><text x="231.17" y="168.81" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。每个任务都要求重建一个代</text><text x="72.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">码库以复现某个程序的行为，且只能以该程序编译后的二进制文件和文档作为参考（详见第</text><text x="72.00" y="200.05" font-size="11.00" class="sc-loraregular sc-k">8.10.1</text><text x="101.15" y="200.05" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="232.50" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一种是固定的五智能体团</text><text x="72.00" y="248.12" font-size="11.00" class="sc-notoserifcjksc">队，另一种是动态生成的异步子智能体。我们在</text><text x="305.89" y="248.12" font-size="11.00" class="sc-loraregular">1</text><text x="309.90" y="248.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="320.90" y="248.12" font-size="11.00" class="sc-loraregular">2</text><text x="329.70" y="248.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="343.59" y="248.12" font-size="11.00" class="sc-loraregular">4</text><text x="352.45" y="248.12" font-size="11.00" class="sc-notoserifcjksc">小时的时间预算下分别评估了每种运行</text><text x="72.00" y="263.74" font-size="11.00" class="sc-notoserifcjksc">框架的性能。关于运行框架和预算机制的详细信息，请参阅</text><text x="360.89" y="263.74" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="408.34" y="263.74" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="455.23" y="263.74" font-size="11.00" class="sc-loraregular">8.12</text><text x="476.92" y="263.74" font-size="11.00" class="sc-notoserifcjksc">节。图</text><text x="72.00" y="279.36" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="109.99" y="279.36" font-size="11.00" class="sc-notoserifcjksc">展示了各延迟预算下的得分比较。</text><text x="72.00" y="650.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="650.78" font-size="9.00" class="sc-lorabold">8.12.1.A] 166</text><text x="138.13" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="650.78" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94" y="650.78" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="239.11" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟关系。</text><text x="347.11" y="650.78" font-size="9.00" class="sc-notoserifcjksc">多智能体团队在得分</text><text x="428.11" y="650.78" font-size="9.00" class="sc-loraregular">–</text><text x="433.42" y="650.78" font-size="9.00" class="sc-notoserifcjksc">延迟帕累托前沿上占据主</text><text x="72.00" y="662.48" font-size="9.00" class="sc-notoserifcjksc">导。延迟为每任务的推导延迟（见</text><text x="209.37" y="662.48" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="248.18" y="662.48" font-size="9.00" class="sc-notoserifcjksc">系统卡第</text><text x="286.55" y="662.48" font-size="9.00" class="sc-loraregular">8.12.5</text><text x="311.42" y="662.48" font-size="9.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="689.83" font-size="11.00" class="sc-notoserifcjksc">在时间预算越来越紧的情况下，多智能体团队在得分</text><text x="325.00" y="689.83" font-size="11.00" class="sc-loraregular">–</text><text x="331.49" y="689.83" font-size="11.00" class="sc-notoserifcjksc">延迟帕累托前沿上占据主导。采用</text><text x="499.38" y="689.83" font-size="11.00" class="sc-loraregular">1</text><text x="506.28" y="689.83" font-size="11.00" class="sc-notoserifcjksc">小时预</text><text x="72.00" y="705.45" font-size="11.00" class="sc-notoserifcjksc">算的异步子智能体团队，其性能超过了采用</text><text x="283.89" y="705.45" font-size="11.00" class="sc-loraregular">4</text><text x="292.75" y="705.45" font-size="11.00" class="sc-notoserifcjksc">小时预算的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">124</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">单智能体。图</text><text x="140.89" y="82.61" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="178.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">展示了各实验组和各预算下的总</text><text x="335.74" y="82.61" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="367.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">数比较。</text><text x="72.00" y="458.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="458.50" font-size="9.00" class="sc-lorabold sc-k">8.12.1.B] 166</text><text x="138.13" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="458.50" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94" y="458.50" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="239.11" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与</text><text x="304.48" y="458.50" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="331.33" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">数关系。</text><text x="367.33" y="458.50" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="393.55" y="458.50" font-size="9.00" class="sc-notoserifcjksc">数衡量的是进入每个智能体上下文窗</text><text x="72.00" y="470.20" font-size="9.00" class="sc-notoserifcjksc">口的全部内容（每项只计一次）：新输入（任务提示词、工具结果、来自其他智能体的消息）加上所有生成的输出（包</text><text x="72.00" y="481.90" font-size="9.00" class="sc-notoserifcjksc">括思考内容），并在所有智能体和窗口上求和。</text><text x="72.00" y="510.80" font-size="11.00" class="sc-notoserifcjksc">该图突显了得分与成本之间的权衡。多智能体团队会并发地产生和消耗更多</text><text x="437.89" y="510.80" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="467.05" y="510.80" font-size="11.00" class="sc-notoserifcjksc">，以便在给定</text><text x="72.00" y="526.42" font-size="11.00" class="sc-notoserifcjksc">预算内完成更多任务内容。请注意，这些评估中</text><text x="305.89" y="526.42" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="400.83" y="526.42" font-size="11.00" class="sc-notoserifcjksc">的服务速度可能与外部实际</text><text x="72.00" y="542.04" font-size="11.00" class="sc-notoserifcjksc">体验到的不同，因此在这些延迟预算下报告的绝对得分和</text><text x="349.89" y="542.04" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="381.95" y="542.04" font-size="11.00" class="sc-notoserifcjksc">数不具有普适性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 116.80 125.23 134.04 139.03 143.87 152.16 160.97 165.96 174.77 183.58 192.02" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 Chartography</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">125</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="152.96" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="142.82" y="149.29" font-size="6.60" class="sc-loraregular">16</text><text x="151.93" y="152.96" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="165.82" y="152.96" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="211.61" y="152.96" font-size="11.00" class="sc-notoserifcjksc">推出的一项图表理解基准测试，包含</text><text x="390.51" y="152.96" font-size="11.00" class="sc-loraregular">100</text><text x="411.07" y="152.96" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测</text><text x="72.00" y="168.58" font-size="11.00" class="sc-notoserifcjksc">试中很少评估的专业图表类型。其中包括</text><text x="272.89 280.41 286.08 292.65 295.64 301.32 307.99 314.48 324.51 330.47 333.56 339.52" y="168.58" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="347.18" y="168.58" font-size="11.00" class="sc-notoserifcjksc">生存曲线图、</text><text x="413.18" y="168.58" font-size="11.00" class="sc-loraregular">K</text><text x="72.00" y="184.20" font-size="11.00" class="sc-notoserifcjksc">线图、风玫瑰图、桑基图、伯德图和三维曲面图。由于不同类型的图表可被读取的精度不同，每</text><text x="72.00" y="199.82" font-size="11.00" class="sc-notoserifcjksc">个答案都依据专家针对该特定图表设定的可接受范围进行评分，而不是采用单一的固定容差。</text><text x="72.00" y="266.52" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为启用自适应思考和</text><text x="305.89" y="266.52" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59" y="266.52" font-size="11.00" class="sc-notoserifcjksc">推理强度。模型分别在使用和不使用工具的</text><text x="72.00" y="282.14" font-size="11.00" class="sc-notoserifcjksc">情况下接受评估。在使用工具评估时，模型会获得一个装有图像文件和标准库的容器，以及一个</text><text x="72.00" y="297.76" font-size="11.00" class="sc-notoserifcjksc">图像裁剪工具。我们内部的</text><text x="206.89" y="297.76" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="280.60" y="297.76" font-size="11.00" class="sc-notoserifcjksc">评分实现与官方代码仓库中的任务及专家确定的可接</text><text x="72.00" y="313.38" font-size="11.00" class="sc-notoserifcjksc">受答案范围一致。</text><text x="160.00" y="309.72" font-size="6.60" class="sc-loraregular">17</text><text x="165.45" y="313.38" font-size="11.00" class="sc-notoserifcjksc">为确保不同模型之间的评分可比，我们遵循</text><text x="377.34" y="313.38" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="423.13" y="313.38" font-size="11.00" class="sc-notoserifcjksc">排行榜的做法，使用</text><text x="72.00" y="329.00" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="158.91" y="329.00" font-size="11.00" class="sc-notoserifcjksc">作为评分者。</text><text x="72.00" y="396.59" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="396.59" font-size="11.00" class="sc-notoserifcjksc">不使用工具得分</text><text x="246.83" y="396.59" font-size="11.00" class="sc-loraregular sc-k">61.6%</text><text x="275.72" y="396.59" font-size="11.00" class="sc-notoserifcjksc">，使用工具得分</text><text x="355.61" y="396.59" font-size="11.00" class="sc-loraregular sc-k">90.2%</text><text x="386.81" y="396.59" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="397.81" y="396.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="483.54" y="396.59" font-size="11.00" class="sc-notoserifcjksc">分别得分</text><text x="72.00" y="412.21" font-size="11.00" class="sc-loraregular">64.4%</text><text x="105.45" y="412.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="119.34" y="412.21" font-size="11.00" class="sc-loraregular sc-k">89.0%</text><text x="150.57" y="412.21" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="161.57" y="412.21" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="244.98" y="412.21" font-size="11.00" class="sc-notoserifcjksc">分别得分</text><text x="291.87" y="412.21" font-size="11.00" class="sc-loraregular">44.8%</text><text x="325.14" y="412.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="339.04" y="412.21" font-size="11.00" class="sc-loraregular">88.4%</text><text x="369.64" y="412.21" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="380.64" y="412.21" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="437.29" y="412.21" font-size="11.00" class="sc-notoserifcjksc">的原始视觉推理性能</text><text x="72.00" y="427.83" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="96.89" y="427.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="179.73" y="427.83" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="215.63" y="427.83" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Sol</text><text x="270.19" y="427.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="284.08" y="427.83" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="349.57" y="427.83" font-size="11.00" class="sc-notoserifcjksc">之间。使用工具时，</text><text x="448.57" y="427.83" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="505.22" y="427.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00" y="443.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="443.45" font-size="11.00" class="sc-notoserifcjksc">不相上下。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-lo
