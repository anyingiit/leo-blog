350.59 356.55 366.38" y="498.94" font-size="11.00" class="sc-loraregular">JSON schema</text><text x="374.95" y="498.94" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="388.84 391.84 394.93 401.51" y="498.94" font-size="11.00" class="sc-loraregular">lint</text><text x="408.66" y="498.94" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务都会向智能</text><text x="72.00" y="514.56" font-size="11.00" class="sc-notoserifcjksc">体提供一个已检出的代码仓库、一份</text><text x="250.89" y="514.56" font-size="11.00" class="sc-loraregular">issue</text><text x="279.59" y="514.56" font-size="11.00" class="sc-notoserifcjksc">描述，以及该仓库的测试、</text><text x="411.59 414.58 417.68 424.25" y="514.56" font-size="11.00" class="sc-loraregular">lint</text><text x="431.40" y="514.56" font-size="11.00" class="sc-notoserifcjksc">和代码风格指南。智</text><text x="72.00" y="530.18" font-size="11.00" class="sc-notoserifcjksc">能体在可访问互联网的容器化环境中自主工作，产出最终补丁，过程中没有人工干预，也不提供</text><text x="72.00" y="545.80" font-size="11.00" class="sc-notoserifcjksc">任何超时信息。补丁依据阻断性功能标准（主要是留出的单元测试，另有范围与性能阻断项）和</text><text x="72.00" y="561.42" font-size="11.00" class="sc-notoserifcjksc">加权评分细则标准进行评分，其中包括针对所需测试覆盖范围和禁止的实现模式的、由模型评分</text><text x="72.00" y="577.04" font-size="11.00" class="sc-notoserifcjksc">的检查项。任务由底层代码仓库的维护者编写，并经</text><text x="327.89 335.58 342.02 348.10 354.78 358.04 362.30 365.39 371.83" y="577.04" font-size="11.00" class="sc-loraregular">Cognition</text><text x="381.40" y="577.04" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，此外还</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">11</text><text x="79.00 86.45 91.87 97.94 103.47 105.99 108.62 115.11 117.57 120.09 122.72 128.07 131.94 134.57 139.73 142.45 144.91 147.54 150.59 155.96 162.10 167.47 172.92 175.97 178.43 181.06 186.73 196.68 202.70 207.59 213.81 219.23 225.30 230.62 236.61 239.24 245.30 249.56 255.41 257.91 260.54 267.53 272.69 278.76 281.39 287.65 291.00 293.63 298.79 304.27 309.69 315.67 319.54 324.17 326.80 331.43 337.28 339.96 3 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="72.00 80.93 84.30 93.28 96.92 104.81 113.44 118.82 133.36 137.05 146.13 155.62 159.31 167.50 176.31 184.94 194.03 202.42 211.50 219.69 228.14 236.53 240.23 248.86 257.94 266.34 274.97 278.61 287.58 290.95" y="657.80" font-size="14.00" class="sc-poppinsmedium">8.6 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">113</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的</text><text x="107.89 114.39 120.36 125.12 134.95 138.04 144.72 150.40 153.39 158.77 165.61 171.57 178.25 184.10" y="82.61" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="193.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">版本</text><text x="215.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对超时和资源非常敏感</text><text x="325.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="336.58 342.55 345.09" y="82.61" font-size="11.00" class="sc-loraregular">4.0</text><text x="354.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">通过延长超时时间，并在少数可从中</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">受益的任务中自适应地提高</text><text x="206.89 214.34 221.23" y="98.23" font-size="11.00" class="sc-loraregular">RAM</text><text x="234.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="248.11" y="98.23" font-size="11.00" class="sc-loraregular">CPU</text><text x="273.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">配额，在很大程度上解决了这些问题。在少数任务中，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">沙箱服务提供商仍可能是一个混杂因素，但我们预计其作用将显著小于以往版本。我们还发现，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">此次升级降低了各种运行框架（</text><text x="226.00" y="129.47" font-size="11.00" class="sc-loraregular">harness</text><text x="265.85" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）带来的混杂效应（例如</text><text x="389.75" y="129.47" font-size="11.00" class="sc-loraregular">CLI</text><text x="410.37" y="129.47" font-size="11.00" class="sc-notoserifcjksc">内存占用、上下文压缩</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 105.07 111.63 117.31 123.11 127.36 130.45 136.89" y="145.09" font-size="11.00" class="sc-loraregular">compaction</text><text x="143.57" y="145.09" font-size="11.00" class="sc-notoserifcjksc">）策略和容器通信协议），最终使</text><text x="311.46 317.96 323.92 328.68 338.52 341.61 348.29 353.96 356.96 362.33 369.18 375.14 381.82 387.67" y="145.09" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="397.15" y="145.09" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="228.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，在</text><text x="334.83 341.33 347.30 352.06 361.89 364.99 371.66 377.34 380.33 385.71 392.55 398.51 405.19 411.04 417.63 420.52 426.49 429.03" y="228.34" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="438.75" y="228.34" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="474.64 479.71 486.37 488.97 495.32" y="228.34" font-size="11.00" class="sc-loraregular">70.6%</text><text x="504.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">；被安</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">全防护措施标记的请求按照默认的服务端回退（</text><text x="303.00" y="243.96" font-size="11.00" class="sc-loraregular">fallback</text><text x="342.21" y="243.96" font-size="11.00" class="sc-notoserifcjksc">）策略，由回退模型作答（占请求的</text><text x="72.00" y="259.58" font-size="11.00" class="sc-loraregular">1.2%</text><text x="94.19" y="259.58" font-size="11.00" class="sc-notoserifcjksc">，影响了</text><text x="141.08" y="259.58" font-size="11.00" class="sc-loraregular">1.5%</text><text x="166.25" y="259.58" font-size="11.00" class="sc-notoserifcjksc">的试验，其中有一次尝试中止而未作答）。我们在不允许互联网出站访问的条</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">件下运行评估，基于历史运行日志预先缓存模型运行所需的资源，并据此重新构建镜像。原则</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">上，这可能对分数产生负面影响（如果模型想使用在线资源却被阻止），但我们在</text><text x="470.89 477.13 483.57 490.24 496.92 502.80 507.06 509.95 515.95 518.66" y="290.82" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="527.54" y="290.82" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">尚未观察到这种情况。</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">作为对比，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="374.06" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73" y="374.06" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="237.63" y="374.06" font-size="11.00" class="sc-loraregular">66.4%</text><text x="268.58" y="374.06" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="279.58" y="374.06" font-size="11.00" class="sc-loraregular">2.5%</text><text x="306.65" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的请求被安全防护措施标记，影响了</text><text x="485.54" y="374.06" font-size="11.00" class="sc-loraregular">10%</text><text x="508.84" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的试</text><text x="72.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">验），</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 190.35 193.05" y="389.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="199.95" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="224.85 231.20 237.86 240.56 246.92" y="389.68" font-size="11.00" class="sc-loraregular">60.9%</text><text x="256.49" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="267.49 275.18 278.17 283.78 290.35 296.93 302.89 305.78 311.37 317.05 323.45 326.44 332.40 335.30 341.29 344.00" y="389.68" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="350.89" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="375.79" y="389.68" font-size="11.00" class="sc-loraregular">55.8%</text><text x="406.24" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="417.24 424.92 427.92 433.53 440.09 446.67 452.63 455.53 464.26 470.83 477.39 482.49 485.38" y="389.68" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="494.27" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00" y="405.30" font-size="11.00" class="sc-loraregular">52.3%</text><text x="102.31" y="405.30" font-size="11.00" class="sc-notoserifcjksc">。分数取平均值的方式为：</text><text x="234.30 240.54 246.98 253.65 260.33 266.22 270.47 273.37 279.36 282.07" y="405.30" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="290.96" y="405.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="304.85" y="405.30" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="352.29" y="405.30" font-size="11.00" class="sc-notoserifcjksc">每个任务五次试验（共</text><text x="465.18" y="405.30" font-size="11.00" class="sc-loraregular">330</text><text x="487.16" y="405.30" font-size="11.00" class="sc-notoserifcjksc">次试</text><text x="72.00" y="420.92" font-size="11.00" class="sc-notoserifcjksc">验），</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="420.92" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66" y="420.92" font-size="11.00" class="sc-notoserifcjksc">每个任务</text><text x="208.55" y="420.92" font-size="11.00" class="sc-loraregular">10</text><text x="222.28" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="280.18" y="420.92" font-size="11.00" class="sc-loraregular">660</text><text x="302.62" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="357.62" y="420.92" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="396.36" y="420.92" font-size="11.00" class="sc-notoserifcjksc">每个任务</text><text x="443.25" y="420.92" font-size="11.00" class="sc-loraregular">15</text><text x="456.14" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="514.04" y="420.92" font-size="11.00" class="sc-loraregular">990</text><text x="72.00" y="436.54" font-size="11.00" class="sc-notoserifcjksc">次试验）。若将试验视为相互独立，</text><text x="248.00 254.24 260.67 267.35 274.03 279.91 284.17 287.06 293.06 295.76" y="436.54" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="304.65" y="436.54" font-size="11.00" class="sc-notoserifcjksc">的标准误为</text><text x="362.54" y="436.54" font-size="11.00" class="sc-loraregular">±2.5</text><text x="385.87" y="436.54" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="407.87" y="436.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="455.32" y="436.54" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="469.21 475.04 480.95 483.54" y="436.54" font-size="11.00" class="sc-loraregular">±2.6</text><text x="492.79" y="436.54" font-size="11.00" class="sc-notoserifcjksc">分，其他</text><text x="72.00" y="452.16" font-size="11.00" class="sc-notoserifcjksc">模型为</text><text x="107.89 113.72 117.73 120.32 126.68 133.17" y="452.16" font-size="11.00" class="sc-loraregular">±1.6–2</text><text x="141.97" y="452.16" font-size="11.00" class="sc-notoserifcjksc">分。报告的数字使用</text><text x="243.86" y="452.16" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--bare</text><text x="286.36" y="452.16" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="333.26 340.95 343.94 349.55 356.11 362.69 368.65 371.55 379.24 385.67 392.25" y="452.16" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="398.21" y="452.16" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="409.21" y="452.16" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="431.91" y="452.16" font-size="11.00" class="sc-notoserifcjksc">推理强度测得，但</text><text x="72.00" y="467.78" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="467.78" font-size="11.00" class="sc-notoserifcjksc">除外，它与其自身系统卡一致，报告的是</text><text x="320.34" y="467.78" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="356.23" y="467.78" font-size="11.00" class="sc-notoserifcjksc">推理强度下的结果（在</text><text x="469.13" y="467.78" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="491.82" y="467.78" font-size="11.00" class="sc-notoserifcjksc">推理强度</text><text x="72.00" y="483.40" font-size="11.00" class="sc-notoserifcjksc">下它得分</text><text x="118.89" y="483.40" font-size="11.00" class="sc-loraregular">64.8%</text><text x="149.67" y="483.40" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="174.56" y="483.40" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="210.46" y="483.40" font-size="11.00" class="sc-notoserifcjksc">的差异在噪声范围内）。</text><text x="72.00" y="537.57" font-size="11.00" class="sc-notoserifcjksc">作为参考，公开排行榜报告</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="537.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="283.93" y="537.57" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="330.82" y="537.57" font-size="11.00" class="sc-loraregular">51.8%</text><text x="359.28" y="537.57" font- 00" class="sc-loraregular">Cursor</text><text x="373.04" y="148.00" font-size="11.00" class="sc-notoserifcjksc">报告的</text><text x="408.93 413.19 419.62 425.45 431.41" y="148.00" font-size="11.00" class="sc-loraregular">token</text><text x="440.98" y="148.00" font-size="11.00" class="sc-notoserifcjksc">数按标准定价估算</text><text x="72.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">的，其他所有成本均为</text><text x="184.89" y="163.62" font-size="11.00" class="sc-loraregular">Cursor</text><text x="223.10" y="163.62" font-size="11.00" class="sc-notoserifcjksc">公布的数据。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="213.91" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="213.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.54 150.23 156.80 161.56 166.66 173.09 177.62 184.46 190.43 197.10 202.96" y="213.91" font-size="11.00" class="sc-loraregular">CursorBench</text><text x="212.44" y="213.91" font-size="11.00" class="sc-notoserifcjksc">上的得分为：</text><text x="278.44" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="301.13" y="213.91" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="359.03" y="213.91" font-size="11.00" class="sc-loraregular">55.5%</text><text x="389.29" y="213.91" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="400.29" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="436.19" y="213.91" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="450.08" y="213.91" font-size="11.00" class="sc-loraregular">53.1%</text><text x="478.48" y="213.91" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="489.48" y="213.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="518.78" y="213.91" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="72.00 77.96 82.55 85.26 91.44" y="229.53" font-size="11.00" class="sc-loraregular">47.8%</text><text x="101.01" y="229.53" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="112.01" y="229.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="154.51" y="229.53" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="168.40 174.53 180.71 183.41 189.32" y="229.53" font-size="11.00" class="sc-loraregular">39.2%</text><text x="198.89" y="229.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="565.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.87" y="565.03" font-size="9.00" class="sc-lorabold">8.8.A]</text><text x="112.71" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下</text><text x="196.07 202.27 207.83 212.11 216.48 221.57 225.56 231.51 236.35 242.09 246.75 252.34 254.71 259.63 261.59" y="565.03" font-size="9.00" class="sc-lorabold">CursorBench 4.0</text><text x="269.68" y="565.03" font-size="9.00" class="sc-notoserifcjkscbold">得分与每任务平均成本的关系。</text><text x="395.68" y="565.03" font-size="9.00" class="sc-loraregular">Cursor</text><text x="426.94" y="565.03" font-size="9.00" class="sc-notoserifcjksc">在其生产环境智能体运行框</text><text x="72.00" y="576.73" font-size="9.00" class="sc-notoserifcjksc">架中端到端执行了该评估，并独立测量和报告了分数。对于</text><text x="308.37 314.66 317.11 321.70 327.07 332.45 337.33 339.70 344.80 350.06 355.53 360.99 365.81 369.29 371.66 376.56 378.77" y="576.73" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="386.05" y="576.73" font-size="9.00" class="sc-notoserifcjksc">以外的模型，分数和每任务成本均为</text><text x="72.00" y="588.43" font-size="9.00" class="sc-loraregular">Cursor</text><text x="103.26" y="588.43" font-size="9.00" class="sc-notoserifcjksc">于</text><text x="114.62 119.46 124.98 129.82" y="588.43" font-size="9.00" class="sc-loraregular">2026</text><text x="137.38" y="588.43" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="148.75" y="588.43" font-size="9.00" class="sc-loraregular">9</text><text x="156.32" y="588.43" font-size="9.00" class="sc-notoserifcjksc">月在其公开排行榜上公布的数据。</text><text x="291.32 296.42 301.69 307.15 312.61 317.43 320.91 323.28 328.18 330.40" y="588.43" font-size="9.00" class="sc-loraregular">Sonnet 5.5</text><text x="337.67" y="588.43" font-size="9.00" class="sc-notoserifcjksc">的分数来自</text><text x="385.04" y="588.43" font-size="9.00" class="sc-loraregular">Cursor</text><text x="416.29" y="588.43" font-size="9.00" class="sc-notoserifcjksc">直接发给我们的结果表（其每</text><text x="72.00" y="600.13" font-size="9.00" class="sc-notoserifcjksc">任务成本是我们根据该表中的</text><text x="191.37 194.85 200.12 204.88 209.76" y="600.13" font-size="9.00" class="sc-loraregular">token</text><text x="217.59" y="600.13" font-size="9.00" class="sc-notoserifcjksc">数按标准定价估算的）。每个模型均显示五个推理强度档位（</text><text x="460.59" y="600.13" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="476.80" y="600.13" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="485.80" y="600.13" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="518.20" y="600.13" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="93.60" y="611.83" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="102.60" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="131.97" y="611.83" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="143.34" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="159.54" y="611.83" font-size="9.00" class="sc-notoserifcjksc">），但</text><text x="188.91 195.76 199.59 204.86 209.69 212.06 216.94 218.86" y="611.83" font-size="9.00" class="sc-loraregular">Grok 4.7</text><text x="225.38" y="611.83" font-size="9.00" class="sc-notoserifcjksc">除外，它仅显示三个档位（</text><text x="333.38" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="365.78" y="611.83" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="374.78" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="398.76" y="611.83" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="410.12" y="611.83" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="437.13" y="611.83" font-size="9.00" class="sc-notoserifcjksc">）。两个来源均未提供不</text><text x="72.00" y="623.53" font-size="9.00" class="sc-notoserifcjksc">确定性区间，因此图中未显示。请注意，</text><text x="234.00" y="623.53" font-size="9.00" class="sc-loraregular">y</text><text x="241.12" y="623.53" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="261.49 266.18 271.20" y="623.53" font-size="9.00" class="sc-loraregular">23%</text><text x="281.39" y="623.53" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的差异在视觉上被放大。</text><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="72.00" y="107.96" width="67.00" height="11.00" fill="transparent"/></a><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="139.00" y="107.96" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cursor.com/cursorbench" rel="noopener"><rect x="141.89" y="107.96" width="15.33" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="72.00 80.93 84.30 93.18 96.82 106.57 111.95 121.18 124.88 132.94 145.28 154.76 159.97" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.9 ArXivMath</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00 78.89 82.97 90.11 93.20 98.54 108.64 114.24 118.50" y="116.76" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="127.98" y="116.76" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87 162.97 168.57 172.83 179.42 186.30 190.99 196.95 203.63" y="116.76" font-size="11.00" class="sc-loraregular">MathArena</text><text x="212.20" y="116.76" font-size="11.00" class="sc-notoserifcjksc">维护的一项研究级数学最终答案型基准测试。题目每月从近期的</text><text x="72.00 77.68 81.76 88.90 91.99" y="132.38" font-size="11.00" class="sc-loraregular">arXiv</text><text x="100.43" y="132.38" font-size="11.00" class="sc-notoserifcjksc">论文中提取，再经过自动与人工检查加以筛选，以确保题目自成一体、不平凡且可验证。由</text><text x="72.00" y="148.00" font-size="11.00" class="sc-notoserifcjksc">于题目取自活跃的研究工作，该基准测试比竞赛</text><text x="305.89" y="148.00" font-size="11.00" class="sc-loraregular">/</text><text x="316.38" y="148.00" font-size="11.00" class="sc-notoserifcjksc">奥赛类基准测试更贴近现实，与数学研究的联</text><text x="72.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">系也更紧密。</text><text x="72.00" y="230.10" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89 147.78 151.86 159.00 162.09 167.44 177.53 183.13 187.39" y="230.10" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="196.87" y="230.10" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87 235.78 242.53 248.44" y="230.10" font-size="11.00" class="sc-loraregular">2026</text><text x="257.69" y="230.10" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="230.10" font-size="11.00" class="sc-loraregular">8</text><text x="280.66" y="230.10" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.66" y="230.10" font-size="11.00" class="sc-loraregular">57</text><text x="316.62" y="230.10" font-size="11.00" class="sc-notoserifcjksc">道题）上评估了</text><text x="396.51 404.20 407.19 412.80 419.37 425.95 431.91 434.80 441.04 447.47 454.15 460.83 466.71 470.97 473.86 479.86 482.56" y="230.10" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="488.56" y="230.10" font-size="11.00" class="sc-notoserifcjksc">。与早期</text><text x="72.00" y="245.72" font-size="11.00" class="sc-notoserifcjksc">版本不同，</text><text x="127.00 137.10 142.70 146.95 153.54 160.43 165.11 171.08 177.75" y="245.72" font-size="11.00" class="sc-loraregular">MathArena</text><text x="186.32" y="245.72" font-size="11.00" class="sc-notoserifcjksc">现在优先选用能够解决或否定先前提出的猜想的结果，</text><text x="450.32" y="245.72" font-size="11.00" class="sc-loraregular">57</text><text x="464.28" y="245.72" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="511.18" y="245.72" font-size="11.00" class="sc-loraregular">25</text><text x="525.97" y="245.72" font-size="11.00" class="sc-notoserifcjksc">道</text><text x="72.00" y="261.34" font-size="11.00" class="sc-notoserifcjksc">来自此类结果，</text><text x="149.00" y="261.34" font-size="11.00" class="sc-loraregular">“</text><text x="153.40" y="261.34" font-size="11.00" class="sc-notoserifcjksc">其表述方式使得仅猜测猜想中的值会得到错误答案</text><text x="395.40" y="261.34" font-size="11.00" class="sc-loraregular">”</text><text x="399.24" y="261.34" font-size="11.00" class="sc-notoserifcjksc">。因此，该题集奖励的是推导</text><text x="72.00" y="276.96" font-size="11.00" class="sc-notoserifcjksc">出答案，而非回忆已有文献。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="327.26" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="327.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.54" y="327.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="165.24" y="327.26" font-size="11.00" class="sc-notoserifcjksc">推理强度下，不使用工具得分</text><text x="311.13" y="327.26" font-size="11.00" class="sc-loraregular">86.8%</text><text x="342.13" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，使用工具（代码执行沙箱，无互联网访</text><text x="72.00" y="342.88" font-size="11.00" class="sc-notoserifcjksc">问）得分</text><text x="118.89" y="342.88" font-size="11.00" class="sc-loraregular">95.2%</text><text x="149.43" y="342.88" font-size="11.00" class="sc-notoserifcjksc">，结果为每题四次尝试的平均值。作为对比，在相同设置下，</text><text x="446.43 454.12 457.11 462.72 469.29 475.86 481.83 484.72 490.31 495.98 502.39 505.38 511.34 514.23 520.23 522.93" y="342.88" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="529.83" y="342.88" font-size="11.00" class="sc-notoserifcjksc">不</text><text x="72.00" y="358.50" font-size="11.00" class="sc-notoserifcjksc">使用工具得分</text><text x="140.89" y="358.50" font-size="11.00" class="sc-loraregular">82.9%</text><text x="171.62" y="358.50" font-size="11.00" class="sc-notoserifcjksc">，使用工具得分</text><text x="251.51" y="358.50" font-size="11.00" class="sc-loraregular">92.1%</text><text x="280.05" y="358.50" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="291.05 298.74 301.73 307.35 313.91 320.49 326.45 329.35 338.08 344.65 351.21 356.31 359.20 365.19 367.90" y="358.50" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="376.79" y="358.50" font-size="11.00" class="sc-notoserifcjksc">则分别得分</text><text x="434.68" y="358.50" font-size="11.00" class="sc-loraregular">91.2%</text><text x="466.12" y="358.50" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="480.01" y="358.50" font-size="11.00" class="sc-loraregular">96.9%</text><text x="511.36" y="358.50" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 82.10 87.70 91.95 98.54 105.43 110.12 116.08 122.75" y="408.74" font-size="11.00" class="sc-loraregular">MathArena</text><text x="131.32" y="408.74" font-size="11.00" class="sc-notoserifcjksc">自己的</text><text x="167.22" y="408.74" font-size="11.00" class="sc-loraregular">8</text><text x="176.29" y="408.74" font-size="11.00" class="sc-notoserifcjksc">月排行榜采用不同的设置：每个模型在其厂商的智能体运行框架中运行，可</text><text x="72.00" y="424.36" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 103.72 109.59 113.84 120.43 126.87" y="424.36" font-size="11.00" class="sc-loraregular">Python</text><text x="136.44" y="424.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="150.33 156.57 162.24 168.27 174.10 184.20 189.80 194.06" y="424.36" font-size="11.00" class="sc-loraregular">SageMath</text><text x="200.64" y="424.36" font-size="11.00" class="sc-notoserifcjksc">；提示词要求模型在找不到解答时给出最佳猜测；每题两次尝试；并</text><text x="72.00" y="439.98" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="439.98" font-size="11.00" class="sc-loraregular">LLM</text><text x="122.60" y="439.98" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="177.60 183.96 190.32 200.41 203.31 206.18 212.75 219.32 225.35" y="439.98" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="231.31" y="439.98" font-size="11.00" class="sc-notoserifcjksc">）。在该设置下，他们报告</text><text x="366.21 374.58 381.24 387.58 392.96 399.32 402.21 408.45 414.88" y="439.98" font-size="11.00" class="sc-loraregular">GPT-6 Sol</text><text x="417.87" y="439.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="428.87" y="439.98" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="448.68" y="439.98" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="484.57 490.93 497.05 499.60 506.43" y="439.98" font-size="11.00" class="sc-loraregular">93.0%</text><text x="516.00" y="439.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 80.37 87.04 93.37 98.75 105.11 108.00 114.89 119.98 124.24 128. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 103.98 107.36 115.09 120.09 128.38 137.19 142.18 150.99 164.49 172.68 180.70 189.13 196.93" y="486.97" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 ProgramBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">117</text><text x="72.00" y="385.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76" y="385.75" font-size="9.00" class="sc-lorabold">8.9.A]</text><text x="112.60" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="204.97 210.93 214.77 221.06 223.94 228.49 237.17 241.85 245.57" y="385.75" font-size="9.00" class="sc-lorabold">ArXivMath</text><text x="251.15" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="260.15" y="385.75" font-size="9.00" class="sc-lorabold">2026</text><text x="283.01" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="294.38" y="385.75" font-size="9.00" class="sc-lorabold">8</text><text x="301.90" y="385.75" font-size="9.00" class="sc-notoserifcjkscbold">月）准确率得分。</text><text x="373.90 380.19 382.64 387.23 392.60 397.98 402.86 405.23 410.33 415.59 421.06 426.52 431.33 434.82 437.18 442.09 444.30" y="385.75" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="449.21" y="385.75" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="458.21 464.50 466.95 471.54 476.91 482.29 487.17 489.54 496.68 502.06 507.43 511.60 513.96 518.87 521.08" y="385.75" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="525.99" y="385.75" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 107.90 112.54 117.78 120.23 125.11 127.48 132.38 134.60" y="397.45" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="140.24" y="397.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="151.60 157.90 160.34 164.93 170.31 175.69 180.57 182.93 190.08 195.45 200.83 204.99 207.36" y="397.45" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="214.63" y="397.45" font-size="9.00" class="sc-notoserifcjksc">均在内部评估，未启用安全防护分类器，推理强度为</text><text x="424.00" y="397.45" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="440.20" y="397.45" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="449.20 455.49 457.94 462.53 467.90 473.29 478.16 480.53 485.63 490.90 496.36 501.82 506.64 510.12 512.49 517.39 519.61" y="397.45" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="526.88" y="397.45" font-size="9.00" class="sc-notoserifcjksc">是</text><text x="72.00" y="409.15" font-size="9.00" class="sc-notoserifcjksc">在发布检查点的预发布服务部署上评估的。</text><text x="72.00" y="446.07" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="446.07" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="515.06" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82" y="515.06" font-size="11.00" class="sc-notoserifcjksc">是一项长上下文智能体编程基准测试，包含</text><text x="362.71" y="515.06" font-size="11.00" class="sc-loraregular">200</text><text x="385.17" y="515.06" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得</text><text x="72.00" y="530.68" font-size="11.00" class="sc-notoserifcjksc">由某个开源项目编译而成的二进制文件及该项目的文档，必须在不使用互联网或反编译工具的情</text><text x="72.00" y="546.30" font-size="11.00" class="sc-notoserifcjksc">况下重建一个能复现原程序行为的代码库。任务涵盖从小型终端工具（</text><text x="413.00" y="546.30" font-size="11.00" class="sc-loraregular">jq</text><text x="422.21" y="546.30" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="433.21 437.97 441.06 447.63 453.71 458.40 464.36" y="546.30" font-size="11.00" class="sc-loraregular">ripgrep</text><text x="470.93" y="546.30" font-size="11.00" class="sc-notoserifcjksc">）到大型系统</text><text x="72.00" y="561.92" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.03 94.95 104.78 111.35 117.31" y="561.92" font-size="11.00" class="sc-loraregular">FFmpeg</text><text x="123.39" y="561.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="134.39 140.63 149.29 155.64 158.91 163.17" y="561.92" font-size="11.00" class="sc-loraregular">SQLite</text><text x="169.13" y="561.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="180.13 186.74 195.32" y="561.92" font-size="11.00" class="sc-loraregular">PHP</text><text x="204.88" y="561.92" font-size="11.00" class="sc-notoserifcjksc">解释器）。提交结果依据超过</text><text x="350.77 356.44 362.40 366.99 369.59 376.43 383.26" y="561.92" font-size="11.00" class="sc-loraregular">247,000</text><text x="392.99" y="561.92" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测试进行评</text><text x="72.00" y="577.54" font-size="11.00" class="sc-notoserifcjksc">分，这些测试通过智能体驱动的模糊测试生成。</text><text x="72.00" y="644.59" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="644.59" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="644.59" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件在隐藏测试集上得分低于</text><text x="356.77 363.42 366.13" y="644.59" font-size="11.00" class="sc-loraregular">0.9</text><text x="375.38" y="644.59" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳定</text><text x="72.00" y="660.21" font-size="11.00" class="sc-notoserifcjksc">性），剩余</text><text x="129.89" y="660.21" font-size="11.00" class="sc-loraregular">166</text><text x="149.51" y="660.21" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务中，我们只依据参考二进制文件能够通过的测试计分。我们</text><text x="72.00" y="675.83" font-size="11.00" class="sc-notoserifcjksc">使用与上游代码仓库相同的</text><text x="206.89 216.73 219.82 226.50 229.59 234.97 240.06 248.74 254.70 260.08 265.75 271.78 277.74 284.32" y="675.83" font-size="11.00" class="sc-loraregular">mini-swe-agent</text><text x="291.47" y="675.83" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六小时的时</text><text x="72.00" y="691.45" font-size="11.00" class="sc-notoserifcjksc">间限制。在该</text></svg></div>

，而</text><text x="299.98 307.66 310.66 316.27 322.83 329.41 335.37 338.27 344.50 350.94 357.62 364.29 370.18 374.43 377.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="386.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="411.11 416.18 420.77 423.47 429.60" y="82.61" font-size="11.00" class="sc-loraregular">77.3%</text><text x="439.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="450.17 457.86 460.85 466.46 473.03 479.61 485.57 488.46 497.19 503.76 510.33 515.42 518.31 524.31 527.02" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="96.89" y="98.23" font-size="11.00" class="sc-loraregular">91.2%</text><text x="125.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89 125.56 130.24 136.68 142.76 147.45 153.12 162.89 169.74 175.70 182.37 188.23" y="131.19" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="197.71" y="131.19" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="384.71 390.95 397.38 404.06 410.73 416.62 420.88 423.77 429.76 432.47" y="131.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="441.36" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了一系</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">列上下文长度，最长可达完整的</text><text x="228.89" y="146.81" font-size="11.00" class="sc-loraregular">100</text><text x="249.45" y="146.81" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="263.35 267.60 274.04 279.87 285.83" y="146.81" font-size="11.00" class="sc-loraregular">token</text><text x="295.40" y="146.81" font-size="11.00" class="sc-notoserifcjksc">窗口，且这些任务所考察的长上下文能力与实际的</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">下游用例高度契合。</text><text x="72.00" y="197.36" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="197.36" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.12 112.39 116.67 122.48 124.19 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="266.12" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="266.12" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="266.12" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="266.12" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="262.45" font-size="6.60" class="sc-loraregular">14</text><text x="237.53" y="266.12" font-size="11.00" class="sc-notoserifcjksc">是一项多模态基准测试，包含横跨数十个学科的</text><text x="471.43 477.33 480.11 486.10 492.93" y="266.12" font-size="11.00" class="sc-loraregular">2,500</text><text x="502.67" y="266.12" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="281.74" font-size="11.00" class="sc-notoserifcjksc">目。这些题目由领域专家编写和审核，仅保留前沿大语言模型无法回答的题目，并且经过设计，</text><text x="72.00" y="297.36" font-size="11.00" class="sc-notoserifcjksc">使其无法通过互联网搜索快速作答。</text><text x="72.00" y="347.30" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 240.42 246.86 253.53 260.21 266.10 270.35 273.25 279.24 281.95" y="347.30" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="287.94" y="347.30" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="309.94" y="347.30" font-size="11.00" class="sc-loraregular">1</text><text x="313.95" y="347.30" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具）；（</text><text x="445.95" y="347.30" font-size="11.00" class="sc-loraregular">2</text><text x="451.85" y="347.30" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、</text><text x="72.00" y="362.92" font-size="11.00" class="sc-notoserifcjksc">网页抓取、程序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="415.89" y="362.92" font-size="11.00" class="sc-robotomonoregular" fill="#188038">auto</text><text x="442.30" y="362.92" font-size="11.00" class="sc-notoserifcjksc">，每次尝试的任务</text><text x="72.00" y="378.54" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="107.89 114.25 120.43 127.26 133.17 136.06 140.32 146.76 152.59 158.55" y="378.54" font-size="11.00" class="sc-loraregular">980k token</text><text x="165.23" y="378.54" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。</text><text x="319.23 326.91 329.91 335.52 342.08 348.66 354.62 357.52 366.25 372.82 379.38 384.48 387.37 393.33 395.93" y="378.54" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="405.18" y="378.54" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="428.79" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具版本中出现结果污染，我们对搜索器和抓取器都屏蔽了已知讨论</text><text x="459.89" y="428.79" font-size="11.00" class="sc-loraregular">HLE</text><text x="484.57" y="428.79" font-size="11.00" class="sc-notoserifcjksc">的来源（见</text><text x="72.00" y="444.41" font-size="11.00" class="sc-notoserifcjksc">附录</text><text x="96.89 103.07 105.78" y="444.41" font-size="11.00" class="sc-loraregular">9.1</text><text x="109.79" y="444.41" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="120.79" y="444.41" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="131.79" y="444.41" font-size="11.00" class="sc-notoserifcjksc">我们还使用文本规则筛查每一条回答正确的对话记录，查找是否有使用</text><text x="475.68" y="444.41" font-size="11.00" class="sc-loraregular">HLE</text><text x="500.35" y="444.41" font-size="11.00" class="sc-notoserifcjksc">特定来</text><text x="72.00" y="460.03" font-size="11.00" class="sc-notoserifcjksc">源的迹象，并使用</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04" y="460.03" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="239.93" y="460.03" font-size="11.00" class="sc-notoserifcjksc">审查每一条被标记的对话记录。经确认的作弊情形会被重新判</text><text x="72.00" y="475.65" font-size="11.00" class="sc-notoserifcjksc">为错误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="366.97" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>

85</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 127.66 133.22 141.50 146.21 151.96 154.86 158.58 163.54 165.27 169.63 172.00 177.43 182.15 186.52 190.23 192.60 198.22 203.15 207.86" y="367.00" font-size="9.00" class="sc-lorabold">8.11.1.B] Humanity’s Last Exam</text><text x="216.14" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.00" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">，无工具）测试时计算扩展</text><text x="351.46" y="367.00" font-size="9.00" class="sc-notoserifcjksc">。随着推理强度从</text><text x="425.83" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="444.40" y="367.00" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="473.76" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="489.97" y="367.00" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="498.97" y="367.00" font-size="9.00" class="sc-loraregular">HLE</text><text x="519.15" y="367.00" font-size="9.00" class="sc-notoserifcjksc">准确</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">率与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费用。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="455.94" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="455.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="455.94" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="452.27" font-size="6.60" class="sc-loraregular">15</text><text x="414.89" y="455.94" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.78 446.33 452.30 457.06 463.63 466.62 472.53 478.36 481.62 485.90" y="455.94" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.60" y="455.94" font-size="11.00" class="sc-notoserifcjksc">推出的一</text><text x="72.00" y="471.56" font-size="11.00" class="sc-notoserifcjksc">项深度研究基准测试，用于评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="479.00 487.09 494.53 501.36 509.05" y="471.56" font-size="11.00" class="sc-loraregular">DRACO</text><text x="520.68" y="471.56" font-size="11.00" class="sc-notoserifcjksc">包</text><text x="72.00" y="487.18" font-size="11.00" class="sc-notoserifcjksc">含</text><text x="85.89" y="487.18" font-size="11.00" class="sc-loraregular">100</text><text x="106.45" y="487.18" font-size="11.00" class="sc-notoserifcjksc">个精选任务，源自跨多个领域的用户查询。回答依据专家编写的评分细则进行评分，评分</text><text x="72.00" y="502.80" font-size="11.00" class="sc-notoserifcjksc">维度涵盖事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="569.50" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="569.50" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="569.50" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="585.12" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="585.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="585.12" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="618.08" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="618.08" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57" y="618.08" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 258.38 264.51 267.40 274.07 278.76" y="618.08" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="288.08" y="618.08" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已无法使用。在我们</text><text x="72.00" y="633.70" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.00 250.60" y="633.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="259.85" y="633.70" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用同样的二元</text><text x="72.00 82.10 88.94 95.20 102.79 111.06 119.44 129.54 136.38" y="649.32" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="146.32" y="649.32" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="649.32" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="649.32" font-size="11.00" class="sc-notoserifcjksc">节中的公式将其汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="616.18" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的实验方案，对每个回答进行五次独立的评分运行并记录平均值。我们的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">判提示词取自论文的</text><text x="171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="212.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="270.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="279.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变化</text><text x="491.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="505.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="519.47" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但会保持系统排序不变，因此我们的分数不能与论文的主要公布数字直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="195.39" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，预算为</text><text x="443.24 449.60 455.78 462.61 468.52 471.41 475.67 482.10 487.93 493.89" y="195.39" font-size="11.00" class="sc-loraregular">980k token</text><text x="500.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件。随后我们只对该文件的内容评分，而不是对</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">完整的智能体对话记录评分，从而将交付物与中间工具输出隔离开来。</text><text x="72.00" y="555.10" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="555.10" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="173.95" y="555.10" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32" y="555.10" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37" y="555.10" font-size="9.00" class="sc-notoserifcjksc">任务预算下，随着推理强度从</text><text x="507.74" y="555.10" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="526.30" y="555.10" font-size="9.00" class="sc-notoserifcjksc">提</text><text x="72.00" y="566.80" font-size="9.00" class="sc-notoserifcjksc">升到</text><text x="92.37" y="566.80" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.57" y="566.80" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="117.57 124.18 130.28 135.87 142.16" y="566.80" font-size="9.00" class="sc-loraregular">DRACO</text><text x="151.67" y="566.80" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费</text><text x="72.00" y="578.50" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00 82.46 89.35 97.73 105.81" y="644.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="644.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="644.27" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50" y="644.27" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，旨在为</text><text x="479.40 487.48 494.93 501.76 509.45" y="644.27" font-size="11.00" class="sc-loraregular">DRACO</text><text x="521.08" y="644.27" font-size="11.00" class="sc-notoserifcjksc">深</text><text x="72.00" y="659.89" font-size="11.00" class="sc-notoserifcjksc">度研究基准测试提供一个广度搜索方面的对应基准测试。它包含</text><text x="382.89" y="659.89" font-size="11.00" class="sc-loraregular">500</text><text x="405.44" y="659.89" font-size="11.00" class="sc-notoserifcjksc">个任务，模型须在任务中搜</text><text x="72.00" y="675.51" font-size="11.00" class="sc-notoserifcjksc">索数十到数百个实体，查找关于每个实体的事实，并在结构化记录中列出这些事实及其引用来</text><text x="72.00" y="691.13" font-size="11.00" class="sc-notoserifcjksc">源。我们运行的是该评估的修改版本；下文说明了方法上的差异。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="193.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="195.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="635.47" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="635.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="635.47" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="635.47" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="635.47" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="635.47" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="635.47" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="98.80" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="114.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可使用与被测模型相同的网页抓</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">取工具。评分者会重新抓取被引用的</text><text x="250.89" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="272.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后由评判模型判断这些参考来源是否支持该解答。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32 171.42 177.80 181.65 185.90 188.80 194.83" y="179.77" font-size="11.00" class="sc-loraregular">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型在所</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">要求的事实收集中完成了多少）之间取得平衡。当只有部分所需事实能够得到验证时，给予部分</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">得分。结果为</text><text x="140.89" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="163.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不会导致整个任</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">务失败。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线网络搜索和网页抓取工具，只能访问一个冻结索引；而</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="292.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的版本使用实时网络。</text><text x="236.82 244.51 247.51 253.12 259.68 266.26" y="292.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.11" y="292.53" font-size="11.00" class="sc-notoserifcjksc">模型使用</text><text x="322.01 329.70 332.69 338.30 344.87 351.44 357.41 360.30 369.03 375.60 382.17 387.26 390.15 396.11 398.71" y="292.53" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="407.96" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进行评判，而</text><text x="476.86 483.41 489.37 494.14 500.70 503.70 509.60 515.43 518.70 522.98" y="292.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 105.26 111.93 118.27 123.65 129.64 132.35" y="308.15" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="138.31" y="308.15" font-size="11.00" class="sc-notoserifcjksc">。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="394.20 400.76 406.72 411.48 418.05 421.04 426.95 432.78 436.04 440.32" y="308.15" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="449.02" y="308.15" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，</text><text x="72.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">我们的结果不能与竞争对手模型的已报告数字直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63 431.83 436.89 442.48 447.31 449.68 453.16 458.42 463.19 468.07" y="653.19" font-size="9.00" class="sc-loraregular">980k token</text><text x="473.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 103.15 106.53 117.99 126.43 129.86 134.69 138.12 145.73 154.78 163.60 171.61 180.05 184.88 188.26 195.99 200.99 209.28 218.09 223.08 231.89 245.39 253.58 261.60 270.03 277.83" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.1 Multi-Agent ProgramBench</text><text x="504.00 507.28 511.97" y="751.80" font-size="9.00" class="sc-loraregular">123</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="153.19" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.56 119.25 125.68 131.76 136.45 142.12 151.89 158.74 164.70 171.37 177.23" y="153.19" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="186.71" y="153.19" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="233.60 241.29 244.28 249.89 256.46 263.04 269.00 271.89 278.13 284.56 291.24 297.92 303.80 308.06 310.95 316.95 319.65" y="153.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="328.54" y="153.19" font-size="11.00" class="sc-notoserifcjksc">在小型多智能体团队中运行的能力。</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="168.81" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82" y="168.81" font-size="11.00" class="sc-notoserifcjksc">是一项包含</text><text x="208.71" y="168.81" font-size="11.00" class="sc-loraregular">200</text><text x="231.17" y="168.81" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。每个任务都要求重建一个代</text><text x="72.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">码库以复现某个程序的行为，且只能以该程序编译后的二进制文件和文档作为参考（详见第</text><text x="72.00 78.18 80.89 84.89 91.55 94.25" y="200.05" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="101.15" y="200.05" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="232.50" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一种是固定的五智能体团</text><text x="72.00" y="248.12" font-size="11.00" class="sc-notoserifcjksc">队，另一种是动态生成的异步子智能体。我们在</text><text x="305.89" y="248.12" font-size="11.00" class="sc-loraregular">1</text><text x="309.90" y="248.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="320.90" y="248.12" font-size="11.00" class="sc-loraregular">2</text><text x="329.70" y="248.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="343.59" y="248.12" font-size="11.00" class="sc-loraregular">4</text><text x="352.45" y="248.12" font-size="11.00" class="sc-notoserifcjksc">小时的时间预算下分别评估了每种运行</text><text x="72.00" y="263.74" font-size="11.00" class="sc-notoserifcjksc">框架的性能。关于运行框架和预算机制的详细信息，请参阅</text><text x="360.89" y="263.74" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="408.34" y="263.74" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="455.23" y="263.74" font-size="11.00" class="sc-loraregular">8.12</text><text x="476.92" y="263.74" font-size="11.00" class="sc-notoserifcjksc">节。图</text><text x="72.00" y="279.36" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="109.99" y="279.36" font-size="11.00" class="sc-notoserifcjksc">展示了各延迟预算下的得分比较。</text><text x="72.00" y="650.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="650.78" font-size="9.00" class="sc-lorabold">8.12.1.A] 166</text><text x="138.13" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="650.78" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 178.39 182.64 187.73 192.74 197.02 201.74 209.96 215.91 220.75 226.49 231.16" y="650.78" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="239.11" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟关系。</text><text x="347.11" y="650.78" font-size="9.00" class="sc-notoserifcjksc">多智能体团队在得分</text><text x="428.11" y="650.78" font-size="9.00" class="sc-loraregular">–</text><text x="433.42" y="650.78" font-size="9.00" class="sc-notoserifcjksc">延迟帕累托前沿上占据主</text><text x="72.00" y="662.48" font-size="9.00" class="sc-notoserifcjksc">导。延迟为每任务的推导延迟（见</text><text x="209.37" y="662.48" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="248.18" y="662.48" font-size="9.00" class="sc-notoserifcjksc">系统卡第</text><text x="286.55" y="662.48" font-size="9.00" class="sc-loraregular">8.12.5</text><text x="311.42" y="662.48" font-size="9.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="689.83" font-size="11.00" class="sc-notoserifcjksc">在时间预算越来越紧的情况下，多智能体团队在得分</text><text x="325.00" y="689.83" font-size="11.00" class="sc-loraregular">–</text><text x="331.49" y="689.83" font-size="11.00" class="sc-notoserifcjksc">延迟帕累托前沿上占据主导。采用</text><text x="499.38" y="689.83" font-size="11.00" class="sc-loraregular">1</text><text x="506.28" y="689.83" font-size="11.00" class="sc-notoserifcjksc">小时预</text><text x="72.00" y="705.45" font-size="11.00" class="sc-notoserifcjksc">算的异步子智能体团队，其性能超过了采用</text><text x="283.89" y="705.45" font-size="11.00" class="sc-loraregular">4</text><text x="292.75" y="705.45" font-size="11.00" class="sc-notoserifcjksc">小时预算的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00 507.28 511.91" y="751.81" font-size="9.00" class="sc-loraregular">124</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">单智能体。图</text><text x="140.89" y="82.61" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="178.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">展示了各实验组和各预算下的总</text><text x="335.74 339.99 346.43 352.26 358.22" y="82.61" font-size="11.00" class="sc-loraregular">token</text><text x="367.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">数比较。</text><text x="72.00" y="458.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="458.50" font-size="9.00" class="sc-lorabold">8.12.1.B] 166</text><text x="138.13" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="458.50" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 178.39 182.64 187.73 192.74 197.02 201.74 209.96 215.91 220.75 226.49 231.16" y="458.50" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="239.11" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与</text><text x="304.48 308.20 313.25 318.38 323.22" y="458.50" font-size="9.00" class="sc-lorabold">token</text><text x="331.33" y="458.50" font-size="9.00" class="sc-notoserifcjkscbold">数关系。</text><text x="367.33 370.81 376.07 380.84 385.72" y="458.50" font-size="9.00" class="sc-loraregular">token</text><text x="393.55" y="458.50" font-size="9.00" class="sc-notoserifcjksc">数衡量的是进入每个智能体上下文窗</text><text x="72.00" y="470.20" font-size="9.00" class="sc-notoserifcjksc">口的全部内容（每项只计一次）：新输入（任务提示词、工具结果、来自其他智能体的消息）加上所有生成的输出（包</text><text x="72.00" y="481.90" font-size="9.00" class="sc-notoserifcjksc">括思考内容），并在所有智能体和窗口上求和。</text><text x="72.00" y="510.80" font-size="11.00" class="sc-notoserifcjksc">该图突显了得分与成本之间的权衡。多智能体团队会并发地产生和消耗更多</text><text x="437.89 442.15 448.58 454.42 460.38" y="510.80" font-size="11.00" class="sc-loraregular">token</text><text x="467.05" y="510.80" font-size="11.00" class="sc-notoserifcjksc">，以便在给定</text><text x="72.00" y="526.42" font-size="11.00" class="sc-notoserifcjksc">预算内完成更多任务内容。请注意，这些评估中</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 350.42 356.86 363.53 370.21 376.10 380.35 383.25 389.24 391.95" y="526.42" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="400.83" y="526.42" font-size="11.00" class="sc-notoserifcjksc">的服务速度可能与外部实际</text><text x="72.00" y="542.04" font-size="11.00" class="sc-notoserifcjksc">体验到的不同，因此在这些延迟预算下报告的绝对得分和</text><text x="349.89 354.15 360.58 366.42 372.38" y="542.04" font-size="11.00" class="sc-loraregular">token</text><text x="381.95" y="542.04" font-size="11.00" class="sc-notoserifcjksc">数不具有普适性。</text></svg></div>

" class="sc-notoserifcjksc">个答案都依据专家针对该特定图表设定的可接受范围进行评分，而不是采用单一的固定容差。</text><text x="72.00" y="266.52" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为启用自适应思考和</text><text x="305.89" y="266.52" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59" y="266.52" font-size="11.00" class="sc-notoserifcjksc">推理强度。模型分别在使用和不使用工具的</text><text x="72.00" y="282.14" font-size="11.00" class="sc-notoserifcjksc">情况下接受评估。在使用工具评估时，模型会获得一个装有图像文件和标准库的容器，以及一个</text><text x="72.00" y="297.76" font-size="11.00" class="sc-notoserifcjksc">图像裁剪工具。我们内部的</text><text x="206.89 214.58 221.17 226.85 231.69 235.94 242.38 248.46 253.15 258.82 265.39 271.90" y="297.76" font-size="11.00" class="sc-loraregular">Chartography</text><text x="280.60" y="297.76" font-size="11.00" class="sc-notoserifcjksc">评分实现与官方代码仓库中的任务及专家确定的可接</text><text x="72.00" y="313.38" font-size="11.00" class="sc-notoserifcjksc">受答案范围一致。</text><text x="160.00" y="309.72" font-size="6.60" class="sc-loraregular">17</text><text x="165.45" y="313.38" font-size="11.00" class="sc-notoserifcjksc">为确保不同模型之间的评分可比，我们遵循</text><text x="377.34 383.51 390.08 394.78 400.81 406.77 409.67 416.55" y="313.38" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="423.13" y="313.38" font-size="11.00" class="sc-notoserifcjksc">排行榜的做法，使用</text><text x="72.00" y="329.00" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="158.91" y="329.00" font-size="11.00" class="sc-notoserifcjksc">作为评分者。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="396.59" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="396.59" font-size="11.00" class="sc-notoserifcjksc">不使用工具得分</text><text x="246.83 253.19 257.20 259.79 266.15" y="396.59" font-size="11.00" class="sc-loraregular">61.6%</text><text x="275.72" y="396.59" font-size="11.00" class="sc-notoserifcjksc">，使用工具得分</text><text x="35 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.32 109.70 117.89 125.91 134.34 142.14 150.57 160.62 169.68" y="497.33" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.2 BenchCAD</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">18</text><text x="80.18 86.28 92.27 97.43 103.50 109.02 111.55 114.18 121.98 124.44 126.97 129.60 134.94 138.81 141.44 146.60 149.32 151.78 154.41 157.45 162.82 168.96 174.33 179.99 183.03 185.49 188.12 194.34 199.76 205.83 211.14 217.01 223.90 230.16 237.60 240.10 242.73 248.99 251.62 256.88 262.73 271.67 277.64 281.90 287.31 293.30 298.72 304.79 309.41 312.22 317.22 322.64 325.17 327.80 330.61 336.67 342.65 348.62 353.25 357.12 361.61 366.89 371.78 376.41 380.28 385.43 391.50 397.48 402.64 406.90 412.87 415.50 421.32 426.74 432.81 438.12 444.11 453.05 458.21 462.49 467.86 470.49 473.82 479.67" y="704.45" font-size="10.00" class="sc-loraregular">Zhang, H., et al. (2026). BenchCAD: A comprehensive, industry-standard benchmark for</text><text x="72.00 77.97 82.23 88.07 93.60 97.86 103.02 111.95 120.89 125.98 129.85 132.66 137.97 140.60 147.49 153.75 160.95 163.41 166.04 171.20 174.91 181.40 184.21 189.25 191.75 197.12 202.90 209.11 214.55 217.01 220.65 226.86 232.48 238.25 243.70" y="717.26" font-size="10.00" class="sc-loraregular">programmatic CAD. arXiv:2605.10865.</text><text x="248.79 254.69 258.66 262.52 268.49 273.12 275.62 279.31 285.76 290.92 295.25 300.55 303.36 308.01 310.47 316.32 320.60 326.13 332.58 337.74 343.56 347.84 354.74 360.10 365.88 372.09 377.54 380.00 383.63 389.84 395.46 401.24" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.10865</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00" y="423.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.16" y="423.43" font-size="9.00" class="sc-lorabold">8.13.1.B]</text><text x="122.00" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="214.37 220.56 226.15 230.87 235.19 238.91 244.00 249.01 253.29 258.00 263.38 268.82" y="423.43" font-size="9.00" class="sc-lorabold">Chartography</text><text x="276.15" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="303.15" y="423.43" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考、采用不同推理强度档位的条件下，</text><text x="72.00" y="435.13" font-size="9.00" class="sc-notoserifcjksc">分别在使用和不使用工具的情况下接受评估。我们使用</text><text x="290.37 295.24 298.38 301.37 306.64 310.60" y="435.13" font-size="9.00" class="sc-loraregular">effort</text><text x="316.45" y="435.13" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">度档位下五次运行的平均值，并显示</text><text x="218.37" y="446.83" font-size="9.00" class="sc-loraregular">95%</text><text x="238.67" y="446.83" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按</text><text x="313.04 318.67 324.08" y="446.83" font-size="9.00" class="sc-loraregular">API</text><text x="329.46" y="446.83" font-size="9.00" class="sc-notoserifcjksc">标准定价计费，并采用每次运行的实际缓存使用情</text><text x="72.00" y="458.53" font-size="9.00" class="sc-notoserifcjksc">况。</text><text x="72.00 78.84 84.80 91.48 97.33 103.79 111.37 118.26" y="525.19" font-size="11.00" class="sc-loraregular">BenchCAD</text><text x="126.45" y="521.52" font-size="6.60" class="sc-loraregular">18</text><text x="135.45" y="525.19" font-size="11.00" class="sc-notoserifcjksc">是一项程序化</text><text x="204.35 211.93 218.81" y="525.19" font-size="11.00" class="sc-loraregular">CAD</text><text x="229.90" y="525.19" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="320.79 324.80 329.38 332.16 338.51 345.35" y="525.19" font-size="11.00" class="sc-loraregular">17,900</text><text x="355.08" y="525.19" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="434.97 442.66 448.34 454.80 463.55 470.12 476.08 481.03" y="525.19" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="489.73" y="525.19" font-size="11.00" class="sc-notoserifcjksc">程序构建</text><text x="72.00" y="540.81" font-size="11.00" class="sc-notoserifcjksc">而成，涵盖</text><text x="129.89" y="540.81" font-size="11.00" class="sc-loraregular">106</text><text x="149.98" y="540.81" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="339.87" y="540.81" font-size="11.00" class="sc-loraregular">ISO</text><text x="358.53" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.53 377.61 381.30" y="540.81" font-size="11.00" class="sc-loraregular">DIN</text><text x="389.68" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.68" y="540.81" font-size="11.00" class="sc-loraregular">EN</text><text x="415.90" y="540.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="426.90" y="540.81" font-size="11.00" class="sc-loraregular">ASME</text><text x="459.86" y="540.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="473.75" y="540.81" font-size="11.00" class="sc-loraregular">IEC</text><text x="494.86" y="540.81" font-size="11.00" class="sc-notoserifcjksc">规格表为</text><text x="72.00" y="556.43" font-size="11.00" class="sc-notoserifcjksc">依据。该基准测试将</text><text x="173.89 181.47 188.36" y="556.43" font-size="11.00" class="sc-loraregular">CAD</text><text x="199.45" y="556.43" font-size="11.00" class="sc-notoserifcjksc">能力分解为四项相互匹配的任务；我们报告</text><text x="411.34 418.36 421.45 426.54 429.63 436.07 442.74 448.65 456.34 462.77 469.35" y="556.43" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="478.21" y="556.43" font-size="11.00" class="sc-notoserifcjksc">任务上的结</text><text x="72.00" y="572.05" font-size="11.00" class="sc-notoserifcjksc">果，该任务要求模型根据多视图渲染图生成</text><text x="283.89 291.58 297.26 303.71 312.47 319.04 325.00 329.95" y="572.05" font-size="11.00" class="sc-loraregular">CadQuery</text><text x="338.65" y="572.05" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="638.75" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="638.75" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="638.75" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="654.37" font-size="11.00" class="sc-notoserifcjksc">评估时，模型会获得一个装有图像文件和标准库的容器，以及一个图像裁剪工具。</text><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="248.79" y="707.20" width="157.90" height="12.80" fill="transparent"/></a></svg></div>
