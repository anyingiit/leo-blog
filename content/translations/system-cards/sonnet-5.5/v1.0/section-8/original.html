507.15 518.15 529.15" y="145.09" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评</text><text x="72.00 83.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="228.34" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94 243.94 254.94 265.94 276.94 287.94 298.94 309.94 320.94" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，在</text><text x="334.83 341.33 347.30 352.06 361.89 364.99 371.66 377.34 380.33 385.71 392.55 398.51 405.19 411.04 417.63 420.52 426.49 429.03" y="228.34" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="438.75 449.75 460.75" y="228.34" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="474.64 479.71 486.37 488.97 495.32" y="228.34" font-size="11.00" class="sc-loraregular">70.6%</text><text x="504.89 515.89 526.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">；被安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">全防护措施标记的请求按照默认的服务端回退（</text><text x="303.00 306.72 312.39 315.39 318.38 324.78 330.46 336.31" y="243.96" font-size="11.00" class="sc-loraregular">fallback</text><text x="342.21 353.21 364.21 375.21 386.21 397.21 408.21 419.21 430.21 441.21 452.21 463.21 474.21 485.21 496.21 507.21" y="243.96" font-size="11.00" class="sc-notoserifcjksc">）策略，由回退模型作答（占请求的</text><text x="72.00 76.00 78.71 84.62" y="259.58" font-size="11.00" class="sc-loraregular">1.2%</text><text x="94.19 105.19 116.19 127.19" y="259.58" font-size="11.00" class="sc-notoserifcjksc">，影响了</text><text x="141.08 145.08 147.79 153.79" y="259.58" font-size="11.00" class="sc-loraregular">1.5%</text><text x="166.25 177.25 188.25 199.25 210 c">（</text><text x="279.58 285.49 288.19 294.19" y="374.06" font-size="11.00" class="sc-loraregular">2.5%</text><text x="306.65 317.65 328.65 339.65 350.65 361.65 372.65 383.65 394.65 405.65 416.65 427.65 438.65 449.65 460.65 471.65" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的请求被安全防护措施标记，影响了</text><text x="485.54 489.55 496.38" y="374.06" font-size="11.00" class="sc-loraregular">10%</text><text x="508.84 519.84" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的试</text><text x="72.00 83.00 94.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">验），</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 190.35 193.05" y="389.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="199.95 210.95" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="224.85 231.20 237.86 240.56 246.92" y="389.68" font-size="11.00" class="sc-loraregular">60.9%</text><text x="256.49" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="267.49 275.18 278.17 283.78 290.35 296.93 302.89 305.78 311.37 317.05 323.45 326.44 332.40 335.30 341.29 344.00" y="389.68" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="350.89 361.89" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="375.79 381.78 387.78 390.48 396.67" y="389.68" font-size="11.00" class="sc-loraregular">55.8%</text><text x="406.24" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="417.24 424.92 427.92 433.53 440.09 446.67 452.63 455.53 464.26 470.83 477.39 482.49 485.38" y="389.68" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="494.27 505.27" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00 78.00 83.90 86.61 92.74" y="405.30" font-size="11.00" class="sc-loraregular">52.3%</text><text x="102.31 113.31 124.31 135.30 146.30 157.30 168.30 179.30 190.30 201.30 212.30 223.30" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="72.00 80.93 84.30 93.18 96.82 106.57 111.95 121.18 124.88 132.94 145.28 154.76 159.97" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.9 ArXivMath</text><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00 78.89 82.97 90.11 93.20 98.54 108.64 114.24 118.50" y="116.76" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="127.98 138.98" y="116.76" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87 162.97 168.57 172.83 179.42 186.30 190.99 196.95 203.63" y="116.76" font-size="11.00" class="sc-loraregular">MathArena</text><text x="212.20 223.20 234.20 245.20 256.20 267.20 278.20 289.20 300.20 311.20 322.20 333.20 344.20 355.20 366.20 377.20 388.20 399.20 410.20 421.20 432.20 443.20 454.20 465.20 476.20 487.20 498.20 509.20" y="116.76" font-size="11.00" class="sc-notoserifcjksc">维护的一项研究级数学最终答案型基准测试。题目每月从近期的</text><text x="72.00 77.68 81.76 88.90 91.99" y="132.38" font-size="11.00" class="sc-loraregular">arXiv</text><text x="100.43 111.43 122.43 133.43 144.43 155.43 166.43 177.43 188.43 199.43 210.43 221.43 232.43 243.43 254.43 265.43 276.43 287.43 298.43 309.43 320.43 331.43 342.43 353.43 364.43 375.43 386.43 397.43 408.43 419.43 430.43 441.43 452.43 463.43 474.43 485.43 496.43 507.43 518.43 529.43" y="132.38" font-size="11.00" class="sc-notoserifcjksc">论文中提取，再经过自动与人工检查加以筛选，以确保题目自成一体、不平凡且可验证。由</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="148.00" font-size="11.00" class="sc-notoserifcjksc">于题目取自活跃的研究工作，该基准测试比竞赛</text><text x="305.89" y="148.00" font-size="11.00" class="sc-loraregular">/</text><text x="316.38 327.38 338.38 349.38 360.38 371.38 382.38 393.38 404.38 415.38 426.38 437.38 448.38 459.38 470.38 481.38 492.38 503.38 514.38 525.38" y="148.00" font-size="11.00" class="sc-notoserifcjksc">奥赛类基准测试更贴近现实，与数学研究的联</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">系也更紧密。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="230.10" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89 147.78 151.86 159.00 162.09 167.44 177.53 183.13 187.39" y="230.10" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="196.87 207.87 218.87" y="230.10" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87 235.78 242.53 248.44" y="230.10" font-size="11.00" class="sc-loraregular">2026</text><text x="257.69" y="230.10" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="230.10" font-size="11.00" class="sc-loraregular">8</text><text x="280.66 291.66" y="230.10" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.66 308.65" y="230.10" font-size="11.00" class="sc-loraregular">57</text><text x="316.62 327.62 338.62 349.62 360.62 371.62 382.62" y="230.10" font-size="11.00" class="sc-notoserifcjksc">道题）上评估了</text><text x="396.51 404.20 407.19 412.80 419.37 425.95 431.91 434.80 441.04 447.47 454.15 460.83 466.71 470.97 473.86 479.86 482.56" y="230.10" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="488.56 499.56 510.56 521.56" y="230.10" font-size="11.00" class="sc-notoserifcjksc">。与早期</text><text x="72.00 83.00 94.00 105.00 116.00" y="245.72" font-size="11.00" class="sc-notoserifcjksc">版本不同，</text><text x="127.00 137.10 142.70 146.95 153.54 160.43 165.11 171.08 177.75" y="245.72" font-size="11.00" class="sc-loraregular">MathArena</text><text x="186.32 197.32 208.32 219.32 230.32 241.32 252.32 263.32 274.32 285.32 296.32 307.32 318.32 329.32 340.32 351.32 362.32 373.32 384.32 395.32 406.32 417.32 428.32 439.32" y="245.72" font-size="11.00" class="sc-notoser 网络搜索费用。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="455.94" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="455.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="455.94" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89 411.29" y="452.27" font-size="6.60" class="sc-loraregular">15</text><text x="414.89 425.89" y="455.94" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.78 446.33 452.30 457.06 463.63 466.62 472.53 478.36 481.62 485.90" y="455.94" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.60 505.60 516.60 527.60" y="455.94" font-size="11.00" class="sc-notoserifcjksc">推出的一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="471.56" font-size="11.00" class="sc-notoserifcjksc">项深度研究基准测试，用于评估模型在真实用户可能提出的复杂研究问题上的表现。</text><text x="479.00 487.09 494.53 501.36 509.05" y="471.56" font-size="11.00" class="sc-loraregular">DRACO</text><text x="520.68" y="471.56" font-size="11.00" class="sc-notoserifcjksc">包</text><text x="72.00" y="487.18" font-size="11.00" class="sc-notoserifcjksc">含</text><text x="85.89 89.90 96.73" y="487.18" font-size="11.00" class="sc-loraregular">100</text><text x="106.45 117.45 128.45 139.45 150.45 161.45 172.45 183.45 194.45 205.45 216.45 227.45 238.45 249.45 260.45 271.45 282.45 293.45 304.45 315.45 326.45 337.45 348.45 359.45 370.45 381.45 392.45 403.45 414.45 425.45 436.45 447.45 458.45 469.45 480.45 491.45 502.45 513.45 524.45" y="487.18" font-size="11.00" class="sc-notoserifcjksc">个精选任务，源自跨多个领域的用户查询。回答依据专家编写的评分细则进行评分，评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="502.80" font-size="11.00" class="sc-notoserifcjksc">维度涵盖事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="569.50" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="569.50" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12 465.12 476.12 487.12 498.12 509.12 520.12" y="569.50" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00 83.00 94.00 105.00" y="585.12" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="585.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18" y="585.12" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00 83.00 94.00 105.00" y="618.08" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="618.08" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57 171.57 182.57 193.57 204.57" y="618.08" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 258.38 264.51 267.40 274.07 278.76" y="618.08" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="288.08 299.08 310.08 321.08 332.08 343.08 354.08 365.08 376.08 387.08 398.08 409.08 420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08 508.08 519.08 530.08" y="618.08" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已无法使用。在我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="633.70" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.00 250.60" y="633.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="633.70" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用同样的二元</text><text x="72.00 82.10 88.94 95.20 102.79 111.06 119.44 129.54 136.38" y="649.32" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="146.32 157.32 168.32 179.32 190.32 201.32 212.32 223.32 234.32" y="649.32" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21 254.17 256.88" y="649.32" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68 276.68 287.68 298.68 309.68 320.68 331.68 342.68 353.68 364.68 375.68 386.68 397.68" y="649.32" font-size="11.00" class="sc-notoserifcjksc">节中的公式将其汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="616.18" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的实验方案，对每个回答进行五次独立的评分运行并记录平均值。我们的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">判提示词取自论文的</text><text x="171.00 182.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="195.89 203.58 206.29" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="212.28 223.28 234.28 245.28 256.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="270.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="279.96 290.96 301.96 312.96 323.96 334.96 345.96 356.96 367.96 378.96 389.96 400.96 411.96 422.96 433.96 444.96 455.96 466.96 477.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变化</text><text x="491.85 495.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="505.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="519.47 525.38" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但会保持系统排序不变，因此我们的分数不能与论文的主要公布数字直接比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89 401.58 404.29" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14 424.14 435.14 446.14 457.14 468.14 479.14 490.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14 506.24 512.04 517.14 521.39 527.36" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="195.39" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35 121.35 132.35 143.35 154.35 165.35 176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35 374.35 385.35 396.35 407.35 418.35 429.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，预算为</text><text x="443.24 449.60 455.78 462.61 468.52 471.41 475.67 482.10 487.93 493.89" y="195.39" font-size="11.00" class="sc-loraregular">980k token</text><text x="500.57 511.57 522.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件。随后我们只对该文件的内容评分，而不是对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">完整的智能体对话记录评分，从而将交付物与中间工具输出隔离开来。</text><text x="72.00" y="555.10" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="555.10" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95 164.95" y="555.10" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="173.95 182.95 191.95 200.95 209.95 218.95 227.95 236.95 245.95 254.95 263.95 272.95 281.95 290.95 299.95 308.95 317.95 326.95 335.95 344.95 353.95" y="555.10" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32 370.52 375.58 381.17" y="555.10" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37 397.37 406.37 415.37 424.37 433.37 442.37 451.37 460.37 469.37 478.37 487.37 496.37" y="555.10" font-size="9.00" class="sc-notoserifcjksc">任务预算下，随着推理强度从</text><text x="507.74 513.14 518.54" y="555.10" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="526.30" y="555.10" font-size="9.00" class="sc-notoserifcjksc">提</text><text x="72.00 81.00" y="566.80" font-size="9.00" class="sc-notoserifcjksc">升到</text><text x="92.37 97.77 103.17" y="566.80" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.57" y="566.80" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="117.57 124.18 130.28 135.87 142.16" y="566.80" font-size="9.00" class="sc-loraregular">DRACO</text><text x="151.67 160.67 169.67 178.67 187.67 196.67 205.67 214.67 223.67 232.67 241.67 250.67 259.67 268.67 277.67 286.67 295.67 304.67 313.67 322.67 331.67 340.67 349.67 358.67 367.67 376.67 385.67 394.67 403.67 412.67 421.67 430.67 439.67 448.67 457.67 466.67 475.67 484.67 493.67 502.67 511.67 520.67 529.67" y="566.80" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，不含网络搜索费</text><text x="72.00 81.00" y="578.50" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00 82.46 89.35 97.73 105.81" y="644.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="644.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="644.27" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="644.27" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50 344.50 355.50 366.50 377.50 388.50 399.50 410.50 421.50 432.50 443.50 454.50 465.50" y="644.27" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，旨在为</text><text x="479.40 487.48 494.93 501.76 509.45" y="644.27" font-size="11.00" class="sc-loraregular">DRACO</text><text x="521.08" y="644.27" font-size="11.00" class="sc-notoserifcjksc">深</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="659.89" font-size="11.00" class="sc-notoserifcjksc">度研究基准测试提供一个广度搜索方面的对应基准测试。它包含</text><text x="382.89 388.89 395.72" y="659.89" font-size="11.00" class="sc-loraregular">500</text><text x="405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="659.89" font-size="11.00" class="sc-notoserifcjksc">个任务，模型须在任务中搜</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="675.51" font-size="11.00" class="sc-notoserifcjksc">索数十到数百个实体，查找关于每个实体的事实，并在结构化记录中列出这些事实及其引用来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="691.13" font-size="11.00" class="sc-notoserifcjksc">源。我们运行的是该评估的修改版本；下文说明了方法上的差异。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="193.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="195.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="635.47" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="635.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="635.47" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="635.47" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="635.47" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="635.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="635.47" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="635.47" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="98.80" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12 465.12 476.12 487.12 498.12 509.12 520.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00 83.00 94.00 105.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="114.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可使用与被测模型相同的网页抓</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">取工具。评分者会重新抓取被引用的</text><text x="250.89 259.17 266.07" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="272.43 283.43 294.43 305.43 316.43 327.43 338.43 349.43 360.43 371.43 382.43 393.43 404.43 415.43 426.43 437.43 448.43 459.43 470.43 481.43 492.43 503.43 514.43 525.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后由评判模型判断这些参考来源是否支持该解答。</text><text x="72.00 83.00 94.00 105.00 116.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29 151.32" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32 171.42 177.80 181.65 185.90 188.80 194.83" y="179.77" font-size="11.00" class="sc-loraregular">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67 224.67 235.67 246.67 257.67 268.67 279.67 290.67 301.67 312.67 323.67 334.67 345.67 356.67 367.67 378.67 389.67 400.67 411.67 422.67 433.67 444.67 455.67 466.67 477.67 488.67 499.67 510.67 521.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型在所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">要求的事实收集中完成了多少）之间取得平衡。当只有部分所需事实能够得到验证时，给予部分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">得分。结果为</text><text x="140.89 146.89 153.72" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不会导致整个任</text><text x="72.00 83.00 94.00 105.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">务失败。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线网络搜索和网页抓取工具，只能访问一个冻结索引；而</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="292.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82 137.82 148.82 159.82 170.82 181.82 192.82 203.82 214.82 225.82" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的版本使用实时网络。</text><text x="236.82 244.51 247.51 253.12 259.68 266.26" y="292.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.11 286.11 297.11 308.11" y="292.53" font-size="11.00" class="sc-notoserifcjksc">模型使用</text><text x="322.01 329.70 332.69 338.30 344.87 351.44 357.41 360.30 369.03 375.60 382.17 387.26 390.15 396.11 398.71" y="292.53" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="407.96 418.96 429.96 440.96 451.96 462.96" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进行评判，而</text><text x="476.86 483.41 489.37 494.14 500.70 503.70 509.60 515.43 518.70 522.98" y="292.53" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00 83.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 105.26 111.93 118.27 123.65 129.64 132.35" y="308.15" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="138.31 149.31 160.31 171.31 182.31 193.31 204.31 215.31 226.31 237.31 248.31 259.31 270.31 281.31 292.31 303.31 314.31 325.31 336.31 347.31 358.31 369.31 380.31" y="308.15" font-size="11.00" class="sc-notoserifcjksc">。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="394.20 400.76 406.72 411.48 418.05 421.04 426.95 432.78 436.04 440.32" y="308.15" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="449.02 460.02 471.02 482.02 493.02 504.02 515.03 526.03" y="308.15" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">我们的结果不能与竞争对手模型的已报告数字直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10 175.24" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26 190.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26 208.26 217.26 226.26 235.26 244.26 253.26 262.26 271.26 280.26 289.26 298.26 307.26 316.26 325.26 334.26 343.26 352.26 361.26 370.26 379.26 388.26 397.26 406.26 415.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63 431.83 436.89 442.48 447.31 449.68 453.16 458.42 463.19 468.07" y="653.19" font-size="9.00" class="sc-loraregular">980k token</text><text x="473.54 482.54 491.54 500.54 509.54 518.54 527.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 103.15 106.53 117.99 126.43 129.86 134.69 138.12 145.73 154.78 163.60 171.61 180.05 184.88 188.26 195.99 200.99 209.28 218.09 223.08 231.89 245.39 253.58 261.60 270.03 277.83" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.1 Multi-Agent ProgramBench</text><text x="504.00 507.28 511.97" y="751.80" font-size="9.00" class="sc-loraregular">123</text><text x="72.00 81.00 84.64 89.71" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08 115.08 129.08 143.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00 83.00 94.00" y="153.19" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.56 119.25 125.68 131.76 136.45 142.12 151.89 158.74 164.70 171.37 177.23" y="153.19" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="186.71 197.71 208.71 219.71" y="153.19" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="233.60 241.29 244.28 249.89 256.46 263.04 269.00 271.89 278.13 284.56 291.24 297.92 303.80 308.06 310.95 316.95 319.65" y="153.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54" y="153.19" font-size="11.00" class="sc-notoserifcjksc">在小型多智能体团队中运行的能力。</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="168.81" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82 161.82 172.82 183.82 194.82" y="168.81" font-size="11.00" class="sc-notoserifcjksc">是一项包含</text><text x="208.71 214.62 221.45" y="168.81" font-size="11.00" class="sc-loraregular">200</text><text x="231.17 242.17 253.17 264.17 275.17 286.17 297.17 308.17 319.17 330.17 341.17 352.17 363.17 374.17 385.17 396.17 407.17 418.17 429.17 440.17 451.17 462.17 473.17 484.17 495.17 506.17 517.17 528.17" y="168.81" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。每个任务都要求重建一个代</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">码库以复现某个程序的行为，且只能以该程序编译后的二进制文件和文档作为参考（详见第</text><text x="72.00 78.18 80.89 84.89 91.55 94.25" y="200.05" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="101.15 112.15 123.15" y="200.05" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="232.50" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一种是固定的五智能体团</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="248.12" font-size="11.00" class="sc-notoserifcjksc">队，另一种是动态生成的异步子智能体。我们在</text><text x="305.89" y="248.12" font-size="11.00" class="sc-loraregular">1</text><text x="309.90" y="248.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="320.90" y="248.12" font-size="11.00" class="sc-loraregular">2</text><text x="329.70" y="248.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="343.59" y="248.12" font-size="11.00" class="sc-loraregular">4</text><text x="352.45 363.45 374.45 385.45 396.45 407.45 418.45 429.45 440.45 451.45 462.45 473.45 484.45 495.45 506.45 517.45 528.45" y="248.12" font-size="11.00" class="sc-notoserifcjksc">小时的时间预算下分别评估了每种运行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="263.74" font-size="11.00" class="sc-notoserifcjksc">框架的性能。关于运行框架和预算机制的详细信息，请参阅</text><text x="360.89 369.63 376.19 382.76 387.85 390.75 396.74 399.45" y="263.74" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="408.34 419.34 430.34 441.34" y="263.74" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="455.23 461.41 464.12 468.12" y="263.74" font-size="11.00" class="sc-loraregular">8.12</text><text x="476.92 487.92 498.92" y="263.74" font-size="11.00" class="sc-notoserifcjksc">节。图</text><text x="72.00 78.18 80.89 84.89 90.80 93.50 97.51 100.21" y="279.36" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="109.99 120.99 131.99 142.99 153.99 164.99 175.99 186.99 197.99 208.99 219.99 230.99 241.99 252.99 263.99" y="279.36" font-size="11.00" class="sc-notoserifcjksc">展示了各延迟预算下的得分比较。</text><text x="72.00" y="650.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="650.78" font-size="9.00" class="sc-lorabold">8.12.1.A] 166</text><text x="138.13" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="650.78" font-size="9.00" class="sc-lorabold">“</text><text x="150.94 159.94" y="650.78" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 178.39 182.64 187.73 192.74 197.02 201.74 209.96 215.91 220.75 226.49 231.16" y="650.78" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="239.11 248.11 257.11 266.11 275.11 284.11 293.11 302.11 311.11 320.11 329.11 338.11" y="650.78" font-size="9.00"  91.80 98.40 105.00" y="423.62" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="114.50 125.50 136.50 147.50 158.50 169.50 180.50 191.50 202.50" y="423.62" font-size="11.00" class="sc-notoserifcjksc">推理强度无法区分（</text><text x="213.50 219.41 223.99 226.70 232.61" y="423.62" font-size="11.00" class="sc-loraregular">27.2%</text><text x="245.07" y="423.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="258.96 265.09 271.74 274.29 281.12" y="423.62" font-size="11.00" class="sc-loraregular">30.0%</text><text x="290.69 301.69 312.69 323.69 334.69 345.69 356.69 367.69 378.69 389.69 400.69 411.69 422.69 433.69 444.69 455.69 466.69 477.69 488.69 499.69 510.69 521.69" y="423.62" font-size="11.00" class="sc-notoserifcjksc">），在此之上每提高一档都带来提升，每任务模型</text><text x="72.00 83.00 94.00" y="439.24" font-size="11.00" class="sc-notoserifcjksc">耗时从</text><text x="107.89 114.49 121.09 127.69" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="137.19 148.19 159.19 170.19" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的不到</text><text x="184.08" y="439.24" font-size="11.00" class="sc-loraregular">2</text><text x="192.88 203.88 214.88 225.88 236.88" y="439.24" font-size="11.00" class="sc-notoserifcjksc">分钟，增至</text><text x="250.78 257.38 263.98 270.58 277.18" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="286.67 297.67 308.67" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的约</text><text x="322.57" y="439.24" font-size="11.00" class="sc-loraregular">4</text><text x="331.42 342.42 353.42 364.42 375.42" y="439.24" font-size="11.00" class="sc-notoserifcjksc">分钟，以及</text><text x="389.32 395.92 402.52" y="439.24" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="412.01 423.01 434.01" y="439.24" font-size="11.00" class="sc-notoserifcjksc">下的约</text><text x="447.90 451.91" y="439.24" font-size="11.00" class="sc-lorareg
