<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="72.00 80.93 84.30 92.61 96.25 106.17 114.80 123.44 132.92 141.37 155.35 162.68 166.32 174.38 179.28 182.65" y="324.12" font-size="14.00" class="sc-poppinsmedium">8.3 DeepSWE v1.1</text><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="439.05" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="72.00" y="124.35" font-size="14.00" class="sc-poppinssemibold">8.2 SWE-Bench Pro</text><text x="205.49" y="124.35" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="219.49" y="124.35" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="307.05" y="124.35" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="324.38" y="124.35" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00 78.24 89.18 95.80 101.18 108.03 113.99 120.66 126.52" y="156.91" font-size="11.00" class="sc-loraregular">SWE-Bench</text><text x="133.11" y="156.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.11" y="156.91" font-size="11.00" class="sc-loraregular sc-k">Software Engineering Bench</text><text x="289.87" y="156.91" font-size="11.00" class="sc-notoserifcjksc">）在真实世界软件工程任务上测试</text><text x="457.76" y="156.91" font-size="11.00" class="sc-loraregular">AI</text><text x="471.22" y="156.91" font-size="11.00" class="sc-notoserifcjksc">模型。我们报</text><text x="72.00" y="172.53" font-size="11.00" class="sc-notoserifcjksc">告三个变体，每个分数均为五次试验的平均值：</text><text x="108.00 114.24 125.18 131.80 137.18 144.03 149.99 156.66 162.52" y="205.26" font-size="11.00" class="sc-loraregular">SWE-Bench</text><text x="172.00" y="205.26" font-size="11.00" class="sc-lorabold sc-k">Pro</text><text x="190.45" y="201.60" font-size="6.60" class="sc-loraregular">11</text><text x="198.14" y="205.26" font-size="11.00" class="sc-notoserifcjksc">的题目取自持续维护的代码仓库，涉及大型多文件</text><text x="443.04" y="205.26" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="460.25" y="205.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="471.25" y="205.26" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="527.90" y="205.26" font-size="11.00" class="sc-notoserifcjksc">取</text><text x="108.00" y="220.88" font-size="11.00" class="sc-notoserifcjksc">得了</text><text x="132.89" y="220.88" font-size="11.00" class="sc-loraregular">81.3%</text><text x="161.48" y="220.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 114.24 125.18 131.80 137.18 144.02 149.99 156.66 162.52" y="237.88" font-size="11.00" class="sc-loraregular">SWE-Bench</text><text x="172.00" y="237.88" font-size="11.00" class="sc-lorabold sc-k">Multilingual</text><text x="239.82" y="237.88" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖</text><text x="341.72" y="237.88" font-size="11.00" class="sc-loraregular">9</text><text x="350.97" y="237.88" font-size="11.00" class="sc-notoserifcjksc">种编程语言的</text><text x="419.86" y="237.88" font-size="11.00" class="sc-loraregular">300</text><text x="442.54" y="237.88" font-size="11.00" class="sc-notoserifcjksc">道题目。</text><text x="486.54" y="237.88" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="108.00" y="253.50" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="143.89" y="253.50" font-size="11.00" class="sc-loraregular sc-k">90.3%</text><text x="175.31" y="253.50" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 114.24 125.18 131.80 137.18 144.03 149.99 156.66 162.52" y="270.04" font-size="11.00" class="sc-loraregular">SWE-Bench</text><text x="172.00" y="270.04" font-size="11.00" class="sc-lorabold sc-k">Multimodal</text><text x="232.86" y="266.37" font-size="6.60" class="sc-loraregular">12</text><text x="241.70" y="270.04" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="255.59" y="270.04" font-size="11.00" class="sc-loraregular">issue</text><text x="284.29" y="270.04" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图、设计稿）。</text><text x="504.29" y="270.04" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="108.00" y="285.66" font-size="11.00" class="sc-loraregular">5.5</text><text x="125.59" y="285.66" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="161.48" y="285.66" font-size="11.00" class="sc-loraregular">54.3%</text><text x="191.84" y="285.66" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="352.78" font-size="11.00" class="sc-loraregular sc-k">DeepSWE</text><text x="125.48" y="352.78" font-size="11.00" class="sc-notoserifcjksc">是一组包含</text><text x="183.38" y="352.78" font-size="11.00" class="sc-loraregular">113</text><text x="200.40" y="352.78" font-size="11.00" class="sc-notoserifcjksc">个长程软件工程任务的测试集，旨在衡量前沿编程智能体的能力。这</text><text x="72.00" y="368.40" font-size="11.00" class="sc-notoserifcjksc">些任务类型多样，反映了真实世界的复杂性，并且为避免基准污染而从零编写。</text><text x="457.00" y="368.40" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="513.65" y="368.40" font-size="11.00" class="sc-notoserifcjksc">在五</text><text x="72.00" y="384.02" font-size="11.00" class="sc-notoserifcjksc">次试验中的平均得分为</text><text x="184.89" y="384.02" font-size="11.00" class="sc-loraregular sc-k">71.0%</text><text x="212.91" y="384.02" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="467.70" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">FrontierCode</text><text x="143.25" y="467.70" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14" y="467.70" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Cognition</text><text x="221.64" y="467.70" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54" y="467.70" font-size="11.00" class="sc-loraregular">150</text><text x="409.26" y="467.70" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源</text><text x="72.00" y="483.32" font-size="11.00" class="sc-notoserifcjksc">自开源代码仓库中的真实拉取请求（</text><text x="248.00" y="483.32" font-size="11.00" class="sc-loraregular sc-k">pull request</text><text x="308.82" y="483.32" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="377.71" y="483.32" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="426.81" y="483.32" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="451.71" y="483.32" font-size="11.00" class="sc-loraregular sc-k">websocket</text><text x="508.99" y="483.32" font-size="11.00" class="sc-notoserifcjksc">错</text><text x="72.00" y="498.94" font-size="11.00" class="sc-notoserifcjksc">误、加固</text><text x="118.89" y="498.94" font-size="11.00" class="sc-loraregular">Prisma</text><text x="156.91" y="498.94" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包产物，以及扩展</text><text x="302.80" y="498.94" font-size="11.00" class="sc-loraregular sc-k">JSON schema</text><text x="374.95" y="498.94" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="388.84" y="498.94" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="408.66" y="498.94" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务都会向智能</text><text x="72.00" y="514.56" font-size="11.00" class="sc-notoserifcjksc">体提供一个已检出的代码仓库、一份</text><text x="250.89" y="514.56" font-size="11.00" class="sc-loraregular">issue</text><text x="279.59" y="514.56" font-size="11.00" class="sc-notoserifcjksc">描述，以及该仓库的测试、</text><text x="411.59" y="514.56" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="431.40" y="514.56" font-size="11.00" class="sc-notoserifcjksc">和代码风格指南。智</text><text x="72.00" y="530.18" font-size="11.00" class="sc-notoserifcjksc">能体在可访问互联网的容器化环境中自主工作，产出最终补丁，过程中没有人工干预，也不提供</text><text x="72.00" y="545.80" font-size="11.00" class="sc-notoserifcjksc">任何超时信息。补丁依据阻断性功能标准（主要是留出的单元测试，另有范围与性能阻断项）和</text><text x="72.00" y="561.42" font-size="11.00" class="sc-notoserifcjksc">加权评分细则标准进行评分，其中包括针对所需测试覆盖范围和禁止的实现模式的、由模型评分</text><text x="72.00" y="577.04" font-size="11.00" class="sc-notoserifcjksc">的检查项。任务由底层代码仓库的维护者编写，并经</text><text x="327.89" y="577.04" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="381.40" y="577.04" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，此外还</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">11</text><text x="79.00 86.45 91.87 97.94 103.47 105.99 108.62 115.11 117.57 120.09 122.72 128.07 131.94 134.57 139.73 142.45 144.91 147.54 150.59 155.96 162.10 167.47 172.92 175.97 178.43 181.06 186.73 196.68 202.70 207.59 213.81 219.23 225.30 230.62 236.61 239.24 245.30 249.56 255.41 257.91 260.54 267.53 272.69 278.76 281.39 287.65 291.00 293.63 298.79 304.27 309.69 315.67 319.54 324.17 326.80 331.43 337.28 339.96 344.96 350.38 353.01 355.73 361.58 367.65 373.18 378.07 384.06 389.91 394.24 397.05 402.08 407.93 414.00 416.63 421.26 427.06 430.56 434.60 442.51 447.67 451.93 457.35 459.98 465.40 471.47 477.24 480.05 486.12 491.49 496.91 501.24 504.05 510.12" y="678.20" font-size="10.00" class="sc-loraregular">Deng, X., et al. (2025). SWE-Bench Pro: Can AI agents solve long-horizon software engineering</text><text x="183.21 189.11 193.08 196.95 202.92 207.55 210.05 213.74 220.64 225.80 230.13 235.43 238.24 242.90 245.36 251.21 255.49 261.02 267.92 273.08 278.90 283.18 290.08 295.45 300.90 307.11 312.73 315.19 318.83 324.61 330.39 335.81" y="692.40" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2509.16941</text><text x="72.00" y="703.26" font-size="6.00" class="sc-loraregular">12</text><text x="80.04 85.89 91.05 97.12 102.65 105.17 107.80 111.32 113.78 116.30 118.93 124.28 128.15 130.78 135.94 138.66 141.12 143.75 146.80 152.17 158.31 163.46 168.76 171.81 174.27 176. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">111</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">随机抽取了一个子集进行人工求解，以验证其公平性。我们报告总分，即阻断性功能标准与加权</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">代码质量评分细则标准的综合得分。</text><text x="72.00" y="124.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="124.99" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="121.79" y="124.99" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="187.79" y="124.99" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="282.73" y="124.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="296.63" y="124.99" font-size="11.00" class="sc-loraregular">Main</text><text x="325.06" y="124.99" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="360.95" y="124.99" font-size="11.00" class="sc-loraregular">52.1%</text><text x="389.14" y="124.99" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="414.03" y="124.99" font-size="11.00" class="sc-loraregular sc-k">Extended</text><text x="465.55" y="124.99" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="72.00" y="140.61" font-size="11.00" class="sc-loraregular">64.4%</text><text x="102.56" y="140.61" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="127.45" y="140.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="150.15" y="140.61" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="216.15" y="140.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="272.80" y="140.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="286.69" y="140.61" font-size="11.00" class="sc-loraregular">Main</text><text x="315.13" y="140.61" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="351.02" y="140.61" font-size="11.00" class="sc-loraregular">46.2%</text><text x="381.52" y="140.61" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="406.41" y="140.61" font-size="11.00" class="sc-loraregular sc-k">Extended</text><text x="457.94" y="140.61" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="493.83" y="140.61" font-size="11.00" class="sc-loraregular sc-k">59.1%</text><text x="522.29" y="140.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="174.09" font-size="11.00" class="sc-notoserifcjksc">注：该评估的目标是无需人工修改即可合并的代码</text><text x="316.89" y="174.09" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="334.11" y="174.09" font-size="11.00" class="sc-notoserifcjksc">。其评分会惩罚超出范围的修改，即使这</text><text x="72.00" y="189.71" font-size="11.00" class="sc-notoserifcjksc">些修改质量很高或有所帮助。我们报告的</text><text x="272.89" y="189.71" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="329.54" y="189.71" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上的分数基于官方评估，未做</text><text x="72.00" y="205.33" font-size="11.00" class="sc-notoserifcjksc">任何改动。</text><text x="72.00" y="586.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="586.85" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.01 101.11 106.64" y="586.85" font-size="9.00" class="sc-lorabold">8.4.A]</text><text x="112.48" y="586.85" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下</text><text x="195.85" y="586.85" font-size="9.00" class="sc-lorabold sc-k">FrontierCode v1.1 Main</text><text x="296.62" y="586.85" font-size="9.00" class="sc-notoserifcjkscbold">得分与每任务平均输出</text><text x="388.99" y="586.85" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="415.84" y="586.85" font-size="9.00" class="sc-notoserifcjkscbold">数的关系</text><text x="451.84" y="586.85" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="460.84" y="586.85" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="477.04" y="586.85" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="486.04" y="586.85" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="518.44" y="586.85" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="598.55" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="93.60" y="598.55" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="102.60" y="598.55" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="131.97" y="598.55" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="143.34" y="598.55" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="159.54" y="598.55" font-size="9.00" class="sc-notoserifcjksc">；</text><text x="168.54" y="598.55" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="222.13" y="598.55" font-size="9.00" class="sc-notoserifcjksc">另含</text><text x="242.50" y="598.55" font-size="9.00" class="sc-robotomonoregular" fill="#188038">none</text><text x="264.10" y="598.55" font-size="9.00" class="sc-notoserifcjksc">）。图中所有模型的评估均由</text><text x="383.47" y="598.55" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="427.24" y="598.55" font-size="9.00" class="sc-notoserifcjksc">运行并报告结果；</text><text x="499.24" y="598.55" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="530.57" y="598.55" font-size="9.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="610.25" font-size="9.00" class="sc-notoserifcjksc">型在</text><text x="92.37" y="610.25" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="147.88" y="610.25" font-size="9.00" class="sc-notoserifcjksc">中运行，</text><text x="183.88" y="610.25" font-size="9.00" class="sc-loraregular">GPT</text><text x="204.31" y="610.25" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="233.68" y="610.25" font-size="9.00" class="sc-loraregular sc-k">Codex CLI</text><text x="279.46" y="610.25" font-size="9.00" class="sc-notoserifcjksc">中运行。</text><text x="315.46" y="610.25" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="359.24" y="610.25" font-size="9.00" class="sc-notoserifcjksc">的结果文件报告了每个模型的</text><text x="478.60" y="610.25" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="504.83" y="610.25" font-size="9.00" class="sc-notoserifcjksc">数，但未</text><text x="72.00" y="621.95" font-size="9.00" class="sc-notoserifcjksc">报告</text><text x="92.37" y="621.95" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="170.05" y="621.95" font-size="9.00" class="sc-notoserifcjksc">的成本，因此</text><text x="226.41" y="621.95" font-size="9.00" class="sc-loraregular">x</text><text x="233.55" y="621.95" font-size="9.00" class="sc-notoserifcjksc">轴以对数刻度显示每任务平均输出</text><text x="370.92" y="621.95" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="397.14" y="621.95" font-size="9.00" class="sc-notoserifcjksc">数。</text><text x="415.14" y="621.95" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="492.82" y="621.95" font-size="9.00" class="sc-notoserifcjksc">的每个数据</text><text x="72.00" y="633.65" font-size="9.00" class="sc-notoserifcjksc">点都标注了其推理强度档位；对于其他每个模型，标注的点为其最低和最高推理强度档位，以及其得分最高的档位</text><text x="72.00" y="645.35" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00" y="645.35" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="134.59" y="645.35" font-size="9.00" class="sc-notoserifcjksc">另标注了</text><text x="172.95" y="645.35" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="189.16" y="645.35" font-size="9.00" class="sc-notoserifcjksc">）。未标注的点按推理强度顺序沿折线排列。结果文件未提供不确定性区间，因此图中未</text><text x="72.00" y="657.05" font-size="9.00" class="sc-notoserifcjksc">显示；</text><text x="99.00" y="657.05" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="142.78" y="657.05" font-size="9.00" class="sc-notoserifcjksc">发布的图表报告了误差线。请注意，</text><text x="286.78" y="657.05" font-size="9.00" class="sc-loraregular">y</text><text x="293.90" y="657.05" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="314.26" y="657.05" font-size="9.00" class="sc-loraregular">27%</text><text x="333.44" y="657.05" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的差异在视觉上被放大。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="72.00 80.93 84.30 93.24 96.88 104.77 113.40 118.78 133.31 137.01 146.09 155.58 159.27 167.45 176.27 184.90 193.98 202.38 211.46 215.10 224.15 227.52" y="594.18" font-size="14.00" class="sc-poppinsmedium">8.5 Terminal-Bench 4.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">112</text><text x="72.00" y="436.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="436.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="436.78" font-size="9.00" class="sc-lorabold sc-k">8.4.B]</text><text x="112.48" y="436.78" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下</text><text x="195.85" y="436.78" font-size="9.00" class="sc-lorabold sc-k">FrontierCode v1.1 Extended</text><text x="314.96" y="436.78" font-size="9.00" class="sc-notoserifcjkscbold">得分与每任务平均输出</text><text x="407.33" y="436.78" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="434.18" y="436.78" font-size="9.00" class="sc-notoserifcjkscbold">数的关系</text><text x="470.18" y="436.78" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="479.18" y="436.78" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="495.38" y="436.78" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="448.48" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="104.41" y="448.48" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="113.41" y="448.48" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="135.01" y="448.48" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="144.01" y="448.48" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="173.38" y="448.48" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="184.75" y="448.48" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="200.95" y="448.48" font-size="9.00" class="sc-notoserifcjksc">；</text><text x="209.95" y="448.48" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="263.54" y="448.48" font-size="9.00" class="sc-notoserifcjksc">另含</text><text x="283.90" y="448.48" font-size="9.00" class="sc-robotomonoregular" fill="#188038">none</text><text x="305.51" y="448.48" font-size="9.00" class="sc-notoserifcjksc">）。图中所有模型的评估均由</text><text x="424.87" y="448.48" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="468.65" y="448.48" font-size="9.00" class="sc-notoserifcjksc">运行并报告结果；</text><text x="72.00" y="460.18" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="103.33" y="460.18" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="132.70" y="460.18" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="188.21" y="460.18" font-size="9.00" class="sc-notoserifcjksc">中运行，</text><text x="224.21" y="460.18" font-size="9.00" class="sc-loraregular">GPT</text><text x="244.64" y="460.18" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="274.01" y="460.18" font-size="9.00" class="sc-loraregular sc-k">Codex CLI</text><text x="319.79" y="460.18" font-size="9.00" class="sc-notoserifcjksc">中运行。</text><text x="355.79" y="460.18" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="399.56" y="460.18" font-size="9.00" class="sc-notoserifcjksc">的结果文件报告了每个模型的</text><text x="72.00" y="471.88" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="98.23" y="471.88" font-size="9.00" class="sc-notoserifcjksc">数，但未报告</text><text x="154.59" y="471.88" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="232.27" y="471.88" font-size="9.00" class="sc-notoserifcjksc">的成本，因此</text><text x="288.64" y="471.88" font-size="9.00" class="sc-loraregular">x</text><text x="295.78" y="471.88" font-size="9.00" class="sc-notoserifcjksc">轴以对数刻度显示每任务平均输出</text><text x="433.14" y="471.88" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="459.37" y="471.88" font-size="9.00" class="sc-notoserifcjksc">数。</text><text x="477.37" y="471.88" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="483.58" font-size="9.00" class="sc-loraregular">5.5</text><text x="86.39" y="483.58" font-size="9.00" class="sc-notoserifcjksc">的每个数据点都标注了其推理强度档位；对于其他每个模型，标注的点为其最低和最高推理强度档位，以及其得分</text><text x="72.00" y="495.28" font-size="9.00" class="sc-notoserifcjksc">最高的档位（</text><text x="126.00" y="495.28" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="179.59" y="495.28" font-size="9.00" class="sc-notoserifcjksc">另标注了</text><text x="217.95" y="495.28" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="236.52" y="495.28" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="247.89" y="495.28" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="274.89" y="495.28" font-size="9.00" class="sc-notoserifcjksc">）。未标注的点按推理强度顺序沿折线排列。结果文件未提供不确</text><text x="72.00" y="506.98" font-size="9.00" class="sc-notoserifcjksc">定性区间，因此图中未显示；</text><text x="189.00" y="506.98" font-size="9.00" class="sc-loraregular sc-k">Cognition</text><text x="232.78" y="506.98" font-size="9.00" class="sc-notoserifcjksc">发布的图表报告了误差线。请注意，</text><text x="376.78" y="506.98" font-size="9.00" class="sc-loraregular">y</text><text x="383.90" y="506.98" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="404.26" y="506.98" font-size="9.00" class="sc-loraregular">41%</text><text x="422.61" y="506.98" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的</text><text x="72.00" y="518.68" font-size="9.00" class="sc-notoserifcjksc">差异在视觉上被放大。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.65 166.19" y="622.83" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="175.92" y="622.83" font-size="11.00" class="sc-notoserifcjksc">在容器化的终端和命令行环境中，以真实世界的工作测试模型。它包含</text><text x="519.81" y="622.83" font-size="11.00" class="sc-loraregular">66</text><text x="72.00" y="638.45" font-size="11.00" class="sc-notoserifcjksc">个任务，侧重于与科学相关的问题和前沿工程问题，例如计算生物学、物理仿真、</text><text x="468.00" y="638.45" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="490.66" y="638.45" font-size="11.00" class="sc-notoserifcjksc">、形式化</text><text x="72.00" y="654.07" font-size="11.00" class="sc-notoserifcjksc">证明以及</text><text x="118.89" y="654.07" font-size="11.00" class="sc-loraregular">GPU</text><text x="145.10" y="654.07" font-size="11.00" class="sc-notoserifcjksc">性能优化工作。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="72.00 80.93 84.30 93.28 96.92 104.81 113.44 118.82 133.36 137.05 146.13 155.62 159.31 167.50 176.31 184.94 194.03 202.42 211.50 219.69 228.14 236.53 240.23 248.86 257.94 266.34 274.97 278.61 287.58 290.95" y="657.80" font-size="14.00" class="sc-poppinsmedium">8.6 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">113</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的</text><text x="107.89 114.39 120.36 125.12 134.95 138.04 144.72 150.40 153.39 158.77 165.61 171.57 178.25 184.10" y="82.61" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="193.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">版本</text><text x="215.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对超时和资源非常敏感</text><text x="325.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="336.58" y="82.61" font-size="11.00" class="sc-loraregular sc-k">4.0</text><text x="354.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">通过延长超时时间，并在少数可从中</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">受益的任务中自适应地提高</text><text x="206.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">RAM</text><text x="234.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="248.11" y="98.23" font-size="11.00" class="sc-loraregular">CPU</text><text x="273.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">配额，在很大程度上解决了这些问题。在少数任务中，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">沙箱服务提供商仍可能是一个混杂因素，但我们预计其作用将显著小于以往版本。我们还发现，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">此次升级降低了各种运行框架（</text><text x="226.00" y="129.47" font-size="11.00" class="sc-loraregular">harness</text><text x="265.85" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）带来的混杂效应（例如</text><text x="389.75" y="129.47" font-size="11.00" class="sc-loraregular">CLI</text><text x="410.37" y="129.47" font-size="11.00" class="sc-notoserifcjksc">内存占用、上下文压缩</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">compaction</text><text x="143.57" y="145.09" font-size="11.00" class="sc-notoserifcjksc">）策略和容器通信协议），最终使</text><text x="311.46 317.96 323.92 328.68 338.52 341.61 348.29 353.96 356.96 362.33 369.18 375.14 381.82 387.67" y="145.09" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="397.15" y="145.09" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下，在</text><text x="334.83 341.33 347.30 352.06 361.89 364.99 371.66 377.34 380.33 385.71 392.55 398.51 405.19 411.04 417.63 420.52 426.49 429.03" y="228.34" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="438.75" y="228.34" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="474.64" y="228.34" font-size="11.00" class="sc-loraregular sc-k">70.6%</text><text x="504.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">；被安</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">全防护措施标记的请求按照默认的服务端回退（</text><text x="303.00" y="243.96" font-size="11.00" class="sc-loraregular">fallback</text><text x="342.21" y="243.96" font-size="11.00" class="sc-notoserifcjksc">）策略，由回退模型作答（占请求的</text><text x="72.00" y="259.58" font-size="11.00" class="sc-loraregular">1.2%</text><text x="94.19" y="259.58" font-size="11.00" class="sc-notoserifcjksc">，影响了</text><text x="141.08" y="259.58" font-size="11.00" class="sc-loraregular">1.5%</text><text x="166.25" y="259.58" font-size="11.00" class="sc-notoserifcjksc">的试验，其中有一次尝试中止而未作答）。我们在不允许互联网出站访问的条</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">件下运行评估，基于历史运行日志预先缓存模型运行所需的资源，并据此重新构建镜像。原则</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">上，这可能对分数产生负面影响（如果模型想使用在线资源却被阻止），但我们在</text><text x="470.89" y="290.82" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="527.54" y="290.82" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">尚未观察到这种情况。</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">作为对比，</text><text x="127.00" y="374.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="212.73" y="374.06" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="237.63" y="374.06" font-size="11.00" class="sc-loraregular">66.4%</text><text x="268.58" y="374.06" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="279.58" y="374.06" font-size="11.00" class="sc-loraregular">2.5%</text><text x="306.65" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的请求被安全防护措施标记，影响了</text><text x="485.54" y="374.06" font-size="11.00" class="sc-loraregular">10%</text><text x="508.84" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的试</text><text x="72.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">验），</text><text x="105.00" y="389.68" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="199.95" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="224.85" y="389.68" font-size="11.00" class="sc-loraregular sc-k">60.9%</text><text x="256.49" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="267.49" y="389.68" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="350.89" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="375.79" y="389.68" font-size="11.00" class="sc-loraregular">55.8%</text><text x="406.24" y="389.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="417.24" y="389.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="494.27" y="389.68" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00" y="405.30" font-size="11.00" class="sc-loraregular">52.3%</text><text x="102.31" y="405.30" font-size="11.00" class="sc-notoserifcjksc">。分数取平均值的方式为：</text><text x="234.30" y="405.30" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="290.96" y="405.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="304.85" y="405.30" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="352.29" y="405.30" font-size="11.00" class="sc-notoserifcjksc">每个任务五次试验（共</text><text x="465.18" y="405.30" font-size="11.00" class="sc-loraregular">330</text><text x="487.16" y="405.30" font-size="11.00" class="sc-notoserifcjksc">次试</text><text x="72.00" y="420.92" font-size="11.00" class="sc-notoserifcjksc">验），</text><text x="105.00" y="420.92" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="161.66" y="420.92" font-size="11.00" class="sc-notoserifcjksc">每个任务</text><text x="208.55" y="420.92" font-size="11.00" class="sc-loraregular">10</text><text x="222.28" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="280.18" y="420.92" font-size="11.00" class="sc-loraregular">660</text><text x="302.62" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="357.62" y="420.92" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="396.36" y="420.92" font-size="11.00" class="sc-notoserifcjksc">每个任务</text><text x="443.25" y="420.92" font-size="11.00" class="sc-loraregular">15</text><text x="456.14" y="420.92" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="514.04" y="420.92" font-size="11.00" class="sc-loraregular">990</text><text x="72.00" y="436.54" font-size="11.00" class="sc-notoserifcjksc">次试验）。若将试验视为相互独立，</text><text x="248.00" y="436.54" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="304.65" y="436.54" font-size="11.00" class="sc-notoserifcjksc">的标准误为</text><text x="362.54" y="436.54" font-size="11.00" class="sc-loraregular">±2.5</text><text x="385.87" y="436.54" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="407.87" y="436.54" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="455.32" y="436.54" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="469.21" y="436.54" font-size="11.00" class="sc-loraregular sc-k">±2.6</text><text x="492.79" y="436.54" font-size="11.00" class="sc-notoserifcjksc">分，其他</text><text x="72.00" y="452.16" font-size="11.00" class="sc-notoserifcjksc">模型为</text><text x="107.89 113.72 117.73 120.32 126.68 133.17" y="452.16" font-size="11.00" class="sc-loraregular">±1.6–2</text><text x="141.97" y="452.16" font-size="11.00" class="sc-notoserifcjksc">分。报告的数字使用</text><text x="243.86" y="452.16" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--bare</text><text x="286.36" y="452.16" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="333.26" y="452.16" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="398.21" y="452.16" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="409.21" y="452.16" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="431.91" y="452.16" font-size="11.00" class="sc-notoserifcjksc">推理强度测得，但</text><text x="72.00" y="467.78" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="467.78" font-size="11.00" class="sc-notoserifcjksc">除外，它与其自身系统卡一致，报告的是</text><text x="320.34" y="467.78" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="356.23" y="467.78" font-size="11.00" class="sc-notoserifcjksc">推理强度下的结果（在</text><text x="469.13" y="467.78" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="491.82" y="467.78" font-size="11.00" class="sc-notoserifcjksc">推理强度</text><text x="72.00" y="483.40" font-size="11.00" class="sc-notoserifcjksc">下它得分</text><text x="118.89" y="483.40" font-size="11.00" class="sc-loraregular">64.8%</text><text x="149.67" y="483.40" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="174.56" y="483.40" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="210.46" y="483.40" font-size="11.00" class="sc-notoserifcjksc">的差异在噪声范围内）。</text><text x="72.00" y="537.57" font-size="11.00" class="sc-notoserifcjksc">作为参考，公开排行榜报告</text><text x="206.89" y="537.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="537.57" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="330.82" y="537.57" font-size="11.00" class="sc-loraregular">51.8%</text><text x="359.28" y="537.57" font-size="11.00" class="sc-notoserifcjksc">，与我们内部设置的结果相差在噪声</text><text x="72.00" y="553.19" font-size="11.00" class="sc-notoserifcjksc">范围内。</text><text x="116.00" y="553.19" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="157.40" y="553.19" font-size="11.00" class="sc-notoserifcjksc">报告其</text><text x="193.30" y="553.19" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="258.79" y="553.19" font-size="11.00" class="sc-notoserifcjksc">的最终</text><text x="294.68 301.18 307.15 311.91 321.74 324.84 331.51 337.19 340.18 345.56 352.40 358.36 365.04 370.89 377.48 380.37 386.34 388.88" y="553.19" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="398.60" y="553.19" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="434.49" y="553.19" font-size="11.00" class="sc-loraregular sc-k">57.9%</text><text x="463.71" y="553.19" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="488.60" y="553.19" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="517.90" y="553.19" font-size="11.00" class="sc-notoserifcjksc">推理</text><text x="72.00" y="568.81" font-size="11.00" class="sc-notoserifcjksc">强度下测得（在其报告中，</text><text x="204.00" y="568.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="226.70" y="568.81" font-size="11.00" class="sc-notoserifcjksc">推理强度的表现略低于</text><text x="339.59" y="568.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="365.99" y="568.81" font-size="11.00" class="sc-notoserifcjksc">，因此我们选取了其最高数字）。公</text><text x="72.00" y="584.43" font-size="11.00" class="sc-notoserifcjksc">开排行榜还报告了</text><text x="162.89" y="584.43" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="204.30" y="584.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="218.19" y="584.43" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="281.34" y="584.43" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="317.23" y="584.43" font-size="11.00" class="sc-loraregular sc-k">37.3%</text><text x="346.09" y="584.43" font-size="11.00" class="sc-notoserifcjksc">，使用</text><text x="381.98" y="584.43" font-size="11.00" class="sc-loraregular sc-k">Codex CLI</text><text x="437.94" y="584.43" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="451.83" y="584.43" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="474.53" y="584.43" font-size="11.00" class="sc-notoserifcjksc">推理强度下测</text><text x="72.00" y="600.05" font-size="11.00" class="sc-notoserifcjksc">得。</text><text x="94.00" y="600.05" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="135.40" y="600.05" font-size="11.00" class="sc-notoserifcjksc">尚未报告</text><text x="182.30" y="600.05" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Sol</text><text x="236.86" y="600.05" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="250.75 257.25 263.21 267.98 277.81 280.90 287.58 293.25 296.25 301.63 308.47 314.43 321.11 326.96 333.55 336.44 342.40 344.94" y="600.05" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="354.67" y="600.05" font-size="11.00" class="sc-notoserifcjksc">分数，公开排行榜也没有。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 160.18 166.41 172.26 175.36 181.32 187.99 193.79" y="688.47" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="202.65" y="688.47" font-size="11.00" class="sc-notoserifcjksc">是一个由斯坦福大学主导的社区基准，包含</text><text x="414.54" y="688.47" font-size="11.00" class="sc-loraregular">70</text><text x="429.34" y="688.47" font-size="11.00" class="sc-notoserifcjksc">个取自科学研究工作流</text><text x="72.00" y="704.09" font-size="11.00" class="sc-notoserifcjksc">的任务，由</text><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="237.58" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="237.58" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="248.58" y="73.81" width="0.00" height="11.00" fill="transparent"/></
