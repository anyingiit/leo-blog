"sc-notoserifcjksc">在</text><text x="85.89 92.74 98.70 105.37 111.23 117.68 125.26 132.15 140.34 143.24 150.25 153.35 158.44 161.53 167.96 174.64 180.55 188.24 194.67 201.25" y="147.38" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="210.11" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="147.38" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="147.38" font-size="11.00" class="sc-notoserifcjksc">个文件子集上，</text><text x="331.01 338.70 341.69 347.30 353.86 360.44 366.40 369.30 375.53 381.97 388.65 395.32 401.21 405.47 408.36 414.35 417.06" y="147.38" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="425.95" y="147.38" font-size="11.00" class="sc-notoserifcjksc">不使用工具的体素</text><text x="516.84 520.28 526.50" y="147.38" font-size="11.00" class="sc-loraregular">IoU</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">分数为</text><text x="107.89 114.55 116.90 121.82 127.78" y="163.00" font-size="11.00" class="sc-loraregular">0.747</text><text x="132.85" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，使用工具为</text><text x="201.75 208.40 211.11 217.46 223.82" y="163.00" font-size="11.00" class="sc-loraregular">0.963</text><text x="229.95" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="240.95 248.64 251.63 257.24 263.81 270.39 276.35 279.24 287.97 294.54 301.11 306.20 309.09 315.09 317.80" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="326.68" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="395.58 402.23 404.59 409.66 415.78" y="163.00" font-size="11.00" class="sc-loraregular">0.730</text><text x="425.51" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="439.40 446.06 448.76 455.12 461.48" y="163.00" font-size="11.00" class="sc-loraregular">0.962</text><text x="467.38" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="492.28 499.97 502.96 508.57 515.14 521.71" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="178.62" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="186.00 192.66 195.26 201.61 208.44" y="178.62" font-size="11.00" class="sc-loraregular">0.606</text><text x="217.70" y="178.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="231.59 238.24 240.95 247.31 253.21" y="178.62" font-size="11.00" class="sc-loraregular">0.926</text><text x="259.57" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="518.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="518.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.67 111.77 117.31 120.78 123.15 129.10 133.94 139.68 144.34 149.81 155.94 161.96 168.79 171.15 177.29 180.23 184.60 187.54 192.64 198.38 203.18 209.37 214.46 219.82" y="518.08" font-size="9.00" class="sc-lorabold">8.13.2.A] BenchCAD Vision2Code</text><text x="227.03" y="518.08" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="272.03 278.33 280.77 285.36 290.74 296.12" y="518.08" font-size="9.00" class="sc-loraregular">Claude</text><text x="303.36" y="518.08" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考和</text><text x="404.73" y="518.08" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="423.30" y="518.08" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下，分别在使</text><text x="72.00" y="529.78" font-size="9.00" class="sc-notoserifcjksc">用和不使用工具的情况下接受评估。得分为五次运行的平均值，并显示</text><text x="353.37" y="529.78" font-size="9.00" class="sc-loraregular">95%</text><text x="373.67" y="529.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="418.67 425.52 430.97 436.16 440.56 445.46 447.59 452.79 455.16 460.26 465.53" y="529.78" font-size="9.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="470.34" y="529.78" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="481.71 488.56 494.01 499.19 503.60 508.80 511.16 516.80 520.97 524.45 528.28" y="529.78" font-size="9.00" class="sc-loraregular">GPT-6 Astra</text><text x="72.00" y="541.48" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="110.37" y="541.48" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="144.24" y="541.48" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="570.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="570.83" font-size="11.00" class="sc-notoserifcjksc">在该评估上的表现随测试时计算的增加而显著提升，尤其是在模型配备了能够对中间输出</text><text x="72.00" y="586.45" font-size="11.00" class="sc-notoserifcjksc">进行视觉验证的工具时。使用工具时，</text><text x="259.00 266.69 269.68 275.29 281.86 288.44" y="586.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="297.29" y="586.45" font-size="11.00" class="sc-notoserifcjksc">模型在更高的推理强度档位上拓展了得分</text><text x="495.29" y="586.45" font-size="11.00" class="sc-loraregular">–</text><text x="501.78" y="586.45" font-size="11.00" class="sc-notoserifcjksc">成本前</text><text x="72.00" y="602.07" font-size="11.00" class="sc-notoserifcjksc">沿，取得了近乎满分的体素</text><text x="206.89 210.34 216.55" y="602.07" font-size="11.00" class="sc-loraregular">IoU</text><text x="227.72" y="602.07" font-size="11.00" class="sc-notoserifcjksc">分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.54 109.92 120.11 127.96 140.94 149.24 154.23 157.66 166.47 169.85 177.35 180.48" y="497.33" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.3 OSWorld 2.1</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">19</text><text x="80.28 86.13 92.10 97.25 103.32 105.85 108.48 117.66 120.11 122.64 125.27 130.62 134.49 137.12 142.28 145.00 147.45 150.08 153.13 158.50 164.64 170.01 175.66 178.71 181.17 183.80 191.74 197.40 206.96 212.81 217.10 219.82 225.79 228.42 233.79 236.10 242.31 244.81 247.43 253.65 259.07 265.14 270.46 276.44 285.38 290.54 294.83 300.19 303.00 309.07 314.60 317.23 322.49 328.34 337.28 343.25 349.21 353.08 358.50 362.83 365.46 371.43 376.05 381.47 384.10 389.26 394.74 400.15 406.13 410.00 414.63 417.26 423.11 429.17 431.80 434.52 440.37 446.44 451.96 456.85 462.84 468.69 473.02 475.82 480.86 486.71" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00" y="423.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.67 111.77 117.31" y="423.43" font-size="9.00" class="sc-lorabold">8.13.2.B]</text><text x="123.15" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">使用与不使用工具时的</text><text x="215.51 221.46 226.31 232.05 236.71 242.18 248.31 254.32 261.15 263.52 269.66 272.60 276.97 279.91 285.00 290.74 295.54 301.73 306.83 312.19" y="423.43" font-size="9.00" class="sc-lorabold">BenchCAD Vision2Code</text><text x="319.40" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="364.40" y="423.43" font-size="9.00" class="sc-notoserifcjksc">各模型均在不同推理强度档位下以自适应思</text><text x="72.00" y="435.13" font-size="9.00" class="sc-notoserifcjksc">考进行评估。我们使用</text><text x="164.37 169.24 172.38 175.37 180.64 184.60" y="435.13" font-size="9.00" class="sc-loraregular">effort</text><text x="190.45" y="435.13" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值，并</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">显示</text><text x="92.37" y="446.83" font-size="9.00" class="sc-loraregular">95%</text><text x="112.67" y="446.83" font-size="9.00" class="sc-notoserifcjksc">置信区间。成本按</text><text x="187.04 192.67 198.08" y="446.83" font-size="9.00" class="sc-loraregular">API</text><text x="203.46" y="446.83" font-size="9.00" class="sc-notoserifcjksc">标准定价计费，并采用每次运行的实际缓存使用情况。</text><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63 118.21 121.10 127.01 129.72" y="525.19" font-size="11.00" class="sc-loraregular">OSWorld 2.1</text><text x="133.72" y="521.52" font-size="6.60" class="sc-loraregular">19</text><text x="142.83" y="525.19" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="200.72" y="525.19" font-size="11.00" class="sc-loraregular">108</text><text x="220.63" y="525.19" font-size="11.00" class="sc-notoserifcjksc">项长程计算机使用（</text><text x="319.63 325.43 331.87 341.70 348.27 354.83 359.09 365.05 369.82 372.71 379.28 384.37" y="525.19" font-size="11.00" class="sc-loraregular">computer use</text><text x="390.33" y="525.19" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，在这些任</text><text x="72.00" y="540.81" font-size="11.00" class="sc-notoserifcjksc">务中，智能体通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="393.89 402.17 408.57 415.13 421.71 425.97" y="540.81" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="435.43" y="540.81" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每项任务依</text><text x="72.00" y="556.43" font-size="11.00" class="sc-notoserifcjksc">据一组加权检查点进行评分。我们报告两项指标：部分得分（各任务在所有检查点上所获分值的</text><text x="72.00" y="572.05" font-size="11.00" class="sc-notoserifcjksc">平均值）和严格通过率（所有检查点均满足的任务所占比例），二者均为五次独立运行平均得到</text><text x="72.00" y="587.67" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.48 98.16 103.25 108.34 117.10" y="587.67" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="121.10" y="587.67" font-size="11.00" class="sc-notoserifcjksc">。我们采用该基准测试的默认设置（</text><text x="297.10" y="587.67" font-size="11.00" class="sc-loraregular">1080p</text><text x="330.41" y="587.67" font-size="11.00" class="sc-notoserifcjksc">分辨率，每项任务的操作步数上限为</text><text x="72.00" y="603.29" font-size="11.00" class="sc-loraregular">500</text><text x="91.66" y="603.29" font-size="11.00" class="sc-notoserifcjksc">），推理强度为</text><text x="171.55" y="603.29" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="191.35" y="603.29" font-size="11.00" class="sc-notoserifcjksc">。对于需要评分模型的任务，我们使用了</text><text x="392.25 399.94 402.93 408.54 415.10 421.68 427.64 430.54 439.27 445.84 452.41 457.50 460.39 466.35 469.06" y="603.29" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="475.24" y="603.29" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="234.91" y="707.20" width="158.07" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用了该基准测试</text><text x="184.89 190.80 197.55 203.46" y="82.61" font-size="11.00" class="sc-loraregular">2026</text><text x="212.71" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="226.61" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="235.86" y="82.61" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="249.75" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="263.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">日版本（</text><text x="307.48" y="82.61" font-size="11.00" class="sc-loraregular">v2.1</text><text x="325.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的任务文件、任务资源及配套</text><text x="482.54 493.06 499.02" y="82.61" font-size="11.00" class="sc-loraregular">Web</text><text x="508.32" y="82.61" font-size="11.00" class="sc-notoserifcjksc">应</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用。智能体保留每一张截图，并使用</text><text x="250.89 258.58 261.57 267.18 273.75 280.33 286.29 289.18 296.07 302.68" y="98.23" font-size="11.00" class="sc-loraregular">Claude API</text><text x="309.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的服务端上下文管理，在对话超过</text><text x="477.15 481.16 487.99 494.82 500.73 503.62 507.88 514.31 520.14 526.10" y="98.23" font-size="11.00" class="sc-loraregular">100k token</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">后对其进行压缩。本节中的所有模型均在相同配置下评估，该配置与</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 451.92 458.48 465.05 470.14 473.04 479.03 481.74" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</te OSWorld 2.1</text><text x="190.23" y="436.93" font-size="9.00" class="sc-notoserifcjksc">评分者给出的部分得分，取五次运行的平均值。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.63 121.94 126.26 129.69 137.49 145.51 155.73" y="527.57" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 OfficeQA</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold">8.13.3.C] Claude Sonnet 5.5</text><text x="200.60" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="209.60" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="280.26" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="291.63" y="413.53" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="363.59" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="374.96 381.88 387.19 395.72 400.82 405.05 407.86 413.23 415.59 420.39 422.49" y="413.53" font-size="9.00" class="sc-lorabold">OSWorld 2.1</text><text x="428.51" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与严格通过率对</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjkscbold">比。</text><text x="90.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">每个点代表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="362.37 368.00 373.41" y="425.23" font-size="9.00" class="sc-loraregular">API</text><text x="378.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">输入、输出及提示缓存的标准定价计算的</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">平均每任务成本。严格通过率仅在所有检查点均满足时才将任务计为通过，取五次运行的平均值。</text><text x="72.00" y="486.67" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="486.67" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="555.66" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46 143.60 149.20 153.46 159.13 165.53 170.30 173.39 179.24 185.15" y="555.66" font-size="11.00" class="sc-loraregular">Databricks</text><text x="193.13" y="555.66" font-size="11.00" class="sc-notoserifcjksc">推出的公开基准测试，用于评估基于大量历史美国《财政部公报》</text><text x="72.00" y="571.28" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 90.95 93.66 99.90 102.60 105.49 112.37 117.06 123.00 128.67 133.77 140.33 145.28 151.09 153.98 160.75 167.32 170.31 173.30 179.18 183.44 186.53" y="571.28" font-size="11.00" class="sc-loraregular">U.S. Treasury Bulletin</text><text x="193.21" y="571.28" font-size="11.00" class="sc-notoserifcjksc">）文档语料的端到端有据推理。大多数</text><text x="432.67" y="571.28" font-size="11.00" class="sc-notoserifcjksc">问题要求模型在给定</text><text x="72.00" y="586.90" font-size="11.00" class="sc-notoserifcjksc">的文档中找到正确的表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估，</text><text x="72.00" y="602.52" font-size="11.00" class="sc-notoserifcjksc">相关文档已预先选定并以提取后的文本形式提供；</text><text x="384.25" y="602.52" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模型的、难度更</text><text x="72.00" y="618.14" font-size="11.00" class="sc-notoserifcjksc">高的</text><text x="96.89" y="618.14" font-size="11.00" class="sc-loraregular">133</text><text x="116.04" y="618.14" font-size="11.00" class="sc-notoserifcjksc">题子集。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="675.00" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="675.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="675.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="675.00" font-size="11.00" class="sc-notoserifcjksc">推理强度下于</text><text x="321.99" y="675.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="357.88" y="675.00" font-size="11.00" class="sc-loraregular">76.9%</text><text x="387.95" y="675.00" font-size="11.00" class="sc-notoserifcjksc">，于</text><text x="483.08" y="675.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="72.00 78.36 84.35 86.95 93.31" y="690.62" font-size="11.00" class="sc-loraregular">65.6%</text><text x="102.88" y="690.62" font-size="11.00" class="sc-notoserifcjksc">。这低于</text><text x="149.77 157.46 160.45 166.06 172.63 179.21 185.17 188.06 196.79 203.36 209.93 215.02 217.92 223.91 226.62" y="690.62" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="232.61" y="690.62" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="279.50" y="690.62" font-size="11.00" class="sc-loraregular">78.9%</text><text x="312.28" y="690.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="326.18 332.46 337.05 339.40 344.47" y="690.62" font-size="11.00" class="sc-loraregular">67.7%</text><text x="354.04" y="690.62" font-size="11.00" class="sc-notoserifcjksc">），高于相同设置下的</text><text x="466.93 474.62 477.61 483.22 489.79 496.37" y="690.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="706.24" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06" y="706.24" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="163.95" y="706.24" font-size="11.00" class="sc-loraregular">75.1%</text><text x="194.19" y="706.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.08" y="706.24" font-size="11.00" class="sc-loraregular">62.1%</text><text x="236.63" y="706.24" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>

2 231.59 235.45 241.42 246.05 248.55 252.24 258.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00 78.36 84.32 90.40 96.08 99.07 101.96 108.85 114.88 120.84 127.42 131.68 134.57 141.41 147.37 154.05 159.90 166.49 176.32 182.00 186.72" y="115.03" font-size="11.00" class="sc-loraregular">Legal Agent Benchmark</text><text x="192.63" y="115.03" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63 210.17 217.06" y="115.03" font-size="11.00" class="sc-loraregular">LAB</text><text x="223.90" y="115.03" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="248.79 257.28 262.96 267.80 273.30 279.21 285.02 287.91 294.79" y="115.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Harvey AI</text><text x="301.37" y="115.03" font-size="11.00" class="sc-notoserifcjksc">推出的开源基准测试，包含</text><text x="436.27" y="115.03" font-size="11.00" class="sc-loraregular">27</text><text x="450.14" y="115.03" font-size="11.00" class="sc-notoserifcjksc">个不同执业领域的</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">超过</text><text x="96.89 102.80 105.41 112.24 116.24" y="130.65" font-size="11.00" class="sc-loraregular">2,010</text><text x="125.98" y="130.65" font-size="11.00" class="sc-notoserifcjksc">项任务。每项任务包含一个封闭文档集，其中包括电子邮件往来、律所模板、程序性</text><text x="72.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">文件以及其他客户事务材料，智能体必须对其进行筛查才能完成任务。任务指令以合伙人向授薪</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">律师提出的简短</text><text x="149.00" y="161.89" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="161.89" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="161.89" font-size="11.00" class="sc-notoserifcjksc">的形式撰写。指令还规定了预期的输出文档及其格式。评估采用通过</text><text x="531.24" y="161.89" font-size="11.00" class="sc-loraregular">/</text><text x="72.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">不通过的方式，使用大语言模型作为评判者，依据一套由专家撰写的评分细则标准进行。按照</text><text x="72.00 78.55 85.43" y="193.13" font-size="11.00" class="sc-loraregular">LAB</text><text x="95.17" y="193.13" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式，只有当所有标准均满足时，任务才被视为成功。</text><text x="72.00" y="260.76" font-size="11.00" class="sc-notoserifcjksc">除公开任务外，</text><text x="149.00 157.49 163.17 168.01 173.51 179.42" y="260.76" font-size="11.00" class="sc-loraregular">Harvey</text><text x="188.12" y="260.76" font-size="11.00" class="sc-notoserifcjksc">还维护着一个包含</text><text x="279.01" y="260.76" font-size="11.00" class="sc-loraregular">120</text><text x="298.64" y="260.76" font-size="11.00" class="sc-notoserifcjksc">道题目、未公开发布的留出集。</text><text x="72.00" y="276.38" font-size="11.00" class="sc-notoserifcjksc">在该留出集上独立报告</text><text x="184.89 193.39 199.06 203.90 209.40 215.31 221.12 224.01 230.55 237.44" y="276.38" font-size="11.00" class="sc-loraregular">Harvey LAB</text><text x="247.18" y="276.38" font-size="11.00" class="sc-notoserifcjksc">的结果，所用运行框架由</text><text x="461.65" y="276.38" font-size="11.00" class="sc-notoserifcjksc">团队维护（</text><text x="516.65" y="276.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">有关</text><text x="72.00" y="292.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其方法论的更多信息见此处</text><text x="204.00" y="292.00" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="341.72" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="341.72" font-size="11.00" class="sc-notoserifcjksc">在留出集上于</text><text x="235.83" y="341.72" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="265.13" y="341.72" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得</text><text x="345.02 349.03 353.03 355.39 360.46" y="341.72" font-size="11.00" class="sc-loraregular">11.7%</text><text x="372.92" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="441.81" y="341.72" font-size="11.00" class="sc-loraregular">92.1%</text><text x="473.25" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的平均评分项</text><text x="72.00" y="357.34" font-size="11.00" class="sc-notoserifcjksc">通过率（在</text><text x="129.89" y="357.34" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="152.59" y="357.34" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="221.48" y="357.34" font-size="11.00" class="sc-loraregular">10%</text><text x="244.78" y="357.34" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="313.67" y="357.34" font-size="11.00" class="sc-loraregular">93.1%</text><text x="345.33" y="357.34" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通过率）。与我们上一份</text><text x="72.00" y="372.96" font-size="11.00" class="sc-notoserifcjksc">系统卡一样，早期模型的得分采用</text><text x="330.48" y="372.96" font-size="11.00" class="sc-notoserifcjksc">测得的结果，而非</text><text x="421.37 429.86 435.54 440.38 445.88 451.79" y="372.96" font-size="11.00" class="sc-loraregular">Harvey</text><text x="460.49" y="372.96" font-size="11.00" class="sc-notoserifcjksc">报告的结果，以</text><text x="72.00" y="388.58" font-size="11.00" class="sc-notoserifcjksc">便所有模型都在同一运行框架上进行比较。因此，这些得分可能与该变更之前发布的系统卡中的</text><text x="72.00" y="404.20" font-size="11.00" class="sc-notoserifcjksc">得分略有不同。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66 143.57 146.27" y="485.83" font-size="11.00" class="sc-loraregular">GDPval-AA v2.1</text><text x="153.17" y="485.83" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="257.65" y="485.83" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真</text><text x="72.00" y="501.45" font-size="11.00" class="sc-notoserifcjksc">实世界专业任务上测试</text><text x="184.89" y="501.45" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="501.45" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="311.25" y="501.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="352.65" y="501.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="366.55 374.92 383.00 389.99 395.43 401.11" y="501.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="406.99" y="501.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="461.99" y="497.78" font-size="6.60" class="sc-loraregular">20</text><text x="469.64" y="501.45" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="494.53" y="501.45" font-size="11.00" class="sc-loraregular">220</text><text x="516.07" y="501.45" font-size="11.00" class="sc-notoserifcjksc">项任</text><text x="72.00" y="517.07" font-size="11.00" class="sc-notoserifcjksc">务，涵盖九大主要行业的</text><text x="195.89" y="517.07" font-size="11.00" class="sc-loraregular">44</text><text x="210.71" y="517.07" font-size="11.00" class="sc-notoserifcjksc">种职业。任务对应真实的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="532.69" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="532.69" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="532.69" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，性能通过基于模</text><text x="72.00" y="548.31" font-size="11.00" class="sc-notoserifcjksc">型输出盲评两两比较得出的</text><text x="206.89" y="548.31" font-size="11.00" class="sc-loraregular">Elo</text><text x="226.06" y="548.31" font-size="11.00" class="sc-notoserifcjksc">评分来衡量，并以</text><text x="316.95 325.14 331.05 337.01 343.51 349.75 355.66 361.62 367.53 370.42 377.33 383.29 386.00 390.00 392.89 398.92 401.91 407.59 412.68" y="548.31" font-size="11.00" class="sc-loraregular">DeepSeek V4.1 Flash</text><text x="419.27" y="548.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="430.27" y="548.31" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="450.07" y="548.31" font-size="11.00" class="sc-notoserifcjksc">）为锚点，定为</text><text x="72.00 76.00 78.67 85.02 91.85" y="563.93" font-size="11.00" class="sc-loraregular">1,600</text><text x="101.59" y="563.93" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="625.89" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="625.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="625.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="625.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="272.42" y="625.89" font-size="11.00" class="sc-loraregular">Elo</text><text x="291.59" y="625.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="305.48" y="625.89" font-size="11.00" class="sc-loraregular">1844</text><text x="327.59" y="625.89" font-size="11.00" class="sc-notoserifcjksc">，仅比</text><text x="363.48" y="625.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="386.18" y="625.89" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="455.07 462.76 465.75 471.36 477.93 484.51 490.47 493.36 502.10 508.66 515.23" y="625.89" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="641.51" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="641.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.70" y="641.51" font-size="11.00" class="sc-loraregular">1846</text><text x="120.20" y="641.51" font-size="11.00" class="sc-notoserifcjksc">）低</text><text x="145.10" y="641.51" font-size="11.00" class="sc-loraregular">2</text><text x="153.89" y="641.51" font-size="11.00" class="sc-notoserifcjksc">分。它领先于</text><text x="222.79" y="641.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="245.48" y="641.51" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="270.38 278.07 281.06 286.67 293.24 299.81 305.78 308.67 314.26 319.93 326.33 329.33 335.29 338.18 344.18 346.88" y="641.51" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="350.89" y="641.51" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="361.89" y="641.51" font-size="11.00" class="sc-loraregular">1735</text><text x="383.08" y="641.51" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="405.08" y="641.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.78" y="641.51" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="452.67 460.36 463.35 468.96 475.53 482.11 488.07 490.96 497.20 503.64 510.31 516.99 522.87" y="641.51" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="657.13" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="657.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="657.13" font-size="11.00" class="sc-loraregular">1449</text><text x="111.28" y="657.13" font-size="11.00" class="sc-notoserifcjksc">）以及所有非</text><text x="180.17 187.86 190.85 196.46 203.03 209.61" y="657.13" font-size="11.00" class="sc-loraregular">Claude</text><text x="218.46" y="657.13" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="265.36" y="657.13" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="301.26" y="657.13" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="367.26 373.49 379.93 386.61 393.28 399.17 403.42 406.32 412.31 415.02" y="657.13" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="423.91" y="657.13" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="459.80" y="657.13" font <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.92 111.30 120.36 129.42 137.02 145.21 150.20 153.63 161.65 165.96 173.76 182.57 189.51" y="133.86" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.4 AA-Briefcase</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.82 111.20 118.53 126.82 135.11 138.54 147.35 152.19 160.62 164.05 172.34 180.78 188.38 197.40 205.42 210.41 213.84 218.15 221.58 229.60" y="360.51" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.5 Toolathlon-Verified</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00 78.28 83.35" y="82.61" font-size="11.00" class="sc-loraregular">67%</text><text x="92.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="230.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="285.40" y="78.94" font-size="6.60" class="sc-loraregular">21</text><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="161.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="161.95" font-size="11.00" class="sc-loraregular">v1.1</text><text x="160.29" y="161.95" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="264.76" y="161.95" font-size="11.00" class="sc-notoserifcjksc">开发，是一个由行业专家构建的新基准测试，用于衡量复</text><text x="72.00" y="177.57" font-size="11.00" class="sc-notoserifcjksc">杂项目中的长程知识工作。模型需要完成为期数周、包含大量相互关联任务和数千个输入源文件</text><text x="72.00" y="193.19" font-size="11.00" class="sc-notoserifcjksc">的项目。评分结合了评分细则打分以及由前沿模型评审团进行的成对评判，以衡量可验证的任务</text><text x="72.00" y="208.81" font-size="11.00" class="sc-notoserifcjksc">成功、分析质量和呈现质量。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="259.11" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="259.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="259.11" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="203.53" y="259.11" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="272.42" y="259.11" font-size="11.00" class="sc-loraregular">Elo</text><text x="291.59" y="259.11" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="305.48" y="259.11" font-size="11.00" class="sc-loraregular">1811</text><text x="323.67" y="259.11" font-size="11.00" class="sc-notoserifcjksc">，仅比</text><text x="359.57" y="259.11" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="382.26" y="259.11" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="407.15 414.84 417.84 423.45 430.01 436.59 442.55 445.45 454.18 460.75 467.31 472.41 475.30 481.29 484.00" y="259.11" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="490.00" y="259.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="501.00" y="259.11" font-size="11.00" class="sc-loraregular">1822</text><text x="523.00" y="259.11" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="274.73" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="85.89" y="274.73" font-size="11.00" class="sc-loraregular">11</text><text x="96.79" y="274.73" font-size="11.00" class="sc-notoserifcjksc">分；在</text><text x="132.69" y="274.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="168.59" y="274.73" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="237.48 241.48 246.40 252.36" y="274.73" font-size="11.00" class="sc-loraregular">1746</text><text x="258.72" y="274.73" font-size="11.00" class="sc-notoserifcjksc">。这两种设置均领先于</text><text x="371.61" y="274.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="394.31" y="274.73" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="419.20 426.89 429.88 435.49 442.06 448.64 454.60 457.49 463.08 468.76 475.16 478.15" y="274.73" font-size="11.00" class="sc-loraregular">Claude Fable</text><text x="72.00" y="290.35" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="290.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71 99.71 105.99 111.06" y="290.35" font-size="11.00" class="sc-loraregular">1678</text><text x="117.24" y="290.35" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="139.24" y="290.35" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="161.94" y="290.35" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="186.83 194.52 197.51 203.12 209.69 216.27 222.23 225.12 231.36 237.80 244.47 251.15 257.03 261.29 264.18" y="290.35" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="270.18" y="290.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="281.18" y="290.35" font-size="11.00" class="sc-loraregular">1359</text><text x="303.66" y="290.35" font-size="11.00" class="sc-notoserifcjksc">）以及所有非</text><text x="372.56 380.25 383.24 388.85 395.41 401.99" y="290.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="410.85" y="290.35" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="457.74" y="290.35" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="493.64" y="290.35" font-size="11.00" class="sc-notoserifcjksc">推理强度</text><text x="72.00" y="305.97" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00 100.24 106.67 113.35 120.03 125.91 130.17 133.06 139.06 141.76" y="305.97" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="150.65" y="305.97" font-size="11.00" class="sc-notoserifcjksc">使用的输出</text><text x="208.54 212.80 219.24 225.07 231.03" y="305.97" font-size="11.00" class="sc-loraregular">token</text><text x="240.60" y="305.97" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="254.49" y="305.97" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="277.19" y="305.97" font-size="11.00" class="sc-notoserifcjksc">下少约</text><text x="313.08" y="305.97" font-size="11.00" class="sc-loraregular">61%</text><text x="333.01" y="305.97" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="470.49" y="305.97" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00 78.50 84.94 91.37 94.36 99.96 104.22 110.81 113.80 120.24" y="388.59" font-size="11.00" class="sc-loraregular">Toolathlon</text><text x="129.80" y="388.59" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="388.59" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="388.59" font-size="11.00" class="sc-notoserifcjksc">项真实世界工具使用任务，涵盖办公效率、电子商</text><text x="72.00" y="404.21" font-size="11.00" class="sc-notoserifcjksc">务与运营、数据分析和网页调研。任务从预先填充了真实感数据的应用中开始，并由基于执行的</text><text x="72.00" y="419.83" font-size="11.00" class="sc-notoserifcjksc">检查器进行评分，这些检查器既验证生成的产出物，也验证相关应用或网站中的变更。该基准测</text><text x="72.00" y="435.45" font-size="11.00" class="sc-notoserifcjksc">试在</text><text x="96.89" y="435.45" font-size="11.00" class="sc-loraregular">32</text><text x="111.82" y="435.45" font-size="11.00" class="sc-notoserifcjksc">个应用中提供了</text><text x="191.71" y="435.45" font-size="11.00" class="sc-loraregular">600</text><text x="214.63" y="435.45" font-size="11.00" class="sc-notoserifcjksc">多种工具。任务要求在长程中正确选择工具、进行多步骤顺序编</text><text x="72.00" y="451.07" font-size="11.00" class="sc-notoserifcjksc">排，并给出与检查器要求完全一致的输出；在我们的运行中，轨迹平均约为</text><text x="437.89" y="451.07" font-size="11.00" class="sc-loraregular">20–32</text><text x="472.05" y="451.07" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。</text><text x="72.00" y="466.69" font-size="11.00" class="sc-notoserifcjksc">我们针对</text><text x="221.99" y="466.69" font-size="11.00" class="sc-notoserifcjksc">进行了评估，这是作者的最终版本（</text><text x="397.99 403.89 410.65 416.55" y="466.69" font-size="11.00" class="sc-loraregular">2026</text><text x="425.80" y="466.69" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="439.70" y="466.69" font-size="11.00" class="sc-loraregular">6</text><text x="448.95" y="466.69" font-size="11.00" class="sc-notoserifcjksc">月），其中任务提</text><text x="72.00" y="482.31" font-size="11.00" class="sc-notoserifcjksc">示词、标准答案和评估器均经过人工审核并最终确定，并公布了八个模型的参考轨迹以供外部验</text><text x="72.00" y="497.93" font-size="11.00" class="sc-notoserifcjksc">证。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="566.71" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="566.71" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="202.83 207.90 212.49 215.20 221.38" y="566.71" font-size="11.00" class="sc-loraregular">77.8%</text><text x="233.84" y="566.71" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="247.74 254.33 260.00 265.09 270.19 278.94" y="566.71" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="282.95" y="566.71" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="307.84 315.53 318.52 324.13 330.70 337.28 343.24 346.13 354.87 361.43 368.00 373.09 375.98 381.98 384.69" y="566.71" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="393.57" y="566.71" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="407.47 415.16 418.15 423.76 430.33 436.90 442.87 445.76 451.35 457.02 463.42 466.42 472.38 475.27 481.27 483.97" y="566.71" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="487.98" y="566.71" font-size="11.00" class="sc-notoserifcjksc">（均为</text><text x="72.00 77.07 81.66 84.36 90.55" y="582.33" font-size="11.00" class="sc-loraregular">77.8%</text><text x="100.12" y="582.33" font-size="11.00" class=" .33" y="345.25" font-size="9.00" class="sc-lorabold">8.14.5.A] Toolathlon</text><text x="171.44" y="345.25" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="270.44" y="345.25" font-size="9.00" class="sc-notoserifcjksc">各模型均以自适应思考和</text><text x="371.81" y="345.25" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="390.38" y="345.25" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估；</text><text x="471.38 477.67 480.12 484.71 490.08 495.46 500.34 502.71 507.81 513.07 518.54 524.00 528.82" y="345.25" font-size="9.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="356.95" font-size="9.00" class="sc-loraregular">5.5</text><text x="84.02" y="356.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.02 99.32 101.76 106.35 111.73 117.11 121.99 124.35 131.50 136.87 142.25 146.41 148.78 153.68 155.90" y="356.95" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="163.17" y="356.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="174.54 180.83 183.28 187.87 193.24 198.62 203.50 205.87 210.44 215.08 220.32 222.77 227.65 230.01 234.92 237.13" y="356.95" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="242.78" y="356.95" font-size="9.00" class="sc-notoserifcjksc">在运行时启用了安全分类器。按照论文的评估方案，</text><text x="449.78 455.17 459.81 463.98 468.14 475.31" y="356.95" font-size="9.00" class="sc-loraregular">Pass@1</text><text x="478.58" y="356.95" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="487.58 492.98 497.62 501.79 505.95 513.12" y="356.95" font-size="9.00" class="sc-loraregular">Pass@3</text><text x="520.50" y="356.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 77.39 82.04 86.20 90.37" y="368.65" font-size="9.00" class="sc-loraregular">Pass³</text><text x="96.07" y="368.65" font-size="9.00" class="sc-notoserifcjksc">均基于全部</text><text x="143.43" y="368.65" font-size="9.00" class="sc-loraregular">108</text><text x="159.72" y="368.65" font-size="9.00" class="sc-notoserifcjksc">项任务的三次试验计算。</text><text x="72.00" y="395.45" font-size="11.00" class="sc-notoserifcjksc">我们的运行框架沿用了</text><text x="287.98" y="395.45" font-size="11.00" class="sc-notoserifcjksc">的任务定义、提示词和基于执行的检查器，并加入了</text><text x="72.00" y="411.07" font-size="11.00" class="sc-notoserifcjksc">少量针对特定环境的配置补丁；我们通过在自己的运行框架中重新运行两个参考模型（</text><text x="490.00 496.24 502.67 509.35 516.03 521.91 526.17 529.06" y="411.07" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00" y="426.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="426.69" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="130.60" y="426.69" font-size="11.00" class="sc-notoserifcjksc">），并在排除空结果后与作者公布的结果相吻合，对这些补丁进行了验证。为控制实</text><text x="72.00" y="442.31" font-size="11.00" class="sc-notoserifcjksc">时依赖漂移，我们将金融数据源固定为运行时记录的快照，并固定容器镜像。少量上游检查器缺</text><text x="72.00" y="457.93" font-size="11.00" class="sc-notoserifcjksc">陷（例如，标准答案引用了一个此后已更名的代码仓库）未作改动。</text><text x="72.00" y="524.99" font-size="11.00" class="sc-notoserifcjksc">关于与已公布排行榜的可比性的说明：我们测得的</text><text x="316.89 323.13 329.57 336.24 342.92 348.80 353.06 355.95" y="524.99" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="364.84" y="524.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.74 386.42 389.42 395.03 401.59 408.17 414.13 417.03 425.76 432.33 438.89 443.99 446.88 452.84 455.55" y="524.99" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="464.62" y="524.99" font-size="11.00" class="sc-notoserifcjksc">数据比已公布</text><text x="72.00" y="540.61" font-size="11.00" class="sc-notoserifcjksc">排行榜上的数据（分别为</text><text x="195.89 200.96 204.97 207.56 213.92" y="540.61" font-size="11.00" class="sc-loraregular">71.6%</text><text x="226.39" y="540.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="240.28" y="540.61" font-size="11.00" class="sc-loraregular">76.2%</text><text x="269.89" y="540.61" font-size="11.00" class="sc-notoserifcjksc">）分别高</text><text x="316.78" y="540.61" font-size="11.00" class="sc-loraregular">3.1</text><text x="332.51" y="540.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="346.41 352.53 354.89" y="540.61" font-size="11.00" class="sc-loraregular">3.7</text><text x="362.85" y="540.61" font-size="11.00" class="sc-notoserifcjksc">个百分点。</text><text x="417.85 424.09 430.52 437.20 443.88 449.76 454.02 456.91" y="540.61" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="465.80" y="540.61" font-size="11.00" class="sc-notoserifcjksc">差距中约</text><text x="512.69" y="540.61" font-size="11.00" class="sc-loraregular">1.8</text><text x="528.48" y="540.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="556.23" font-size="11.00" class="sc-notoserifcjksc">百分点、</text><text x="116.00 123.69 126.68 132.29 138.86 145.44 151.40 154.29 163.02 169.59 176.16 181.25 184.15 190.11 192.81" y="556.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="201.89" y="556.23" font-size="11.00" class="sc-notoserifcjksc">差距中约</text><text x="248.78 254.69 257.04" y="556.23" font-size="11.00" class="sc-loraregular">2.7</text><text x="265.01" y="556.23" font-size="11.00" class="sc-notoserifcjksc">个百分点，来自作者的运行框架未生成任何轨迹的运行</text><text x="72.00" y="571.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.24 95.67 102.35 109.03 114.91 119.17 122.06" y="571.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="130.95" y="571.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="144.84 150.97 156.63" y="571.85" font-size="11.00" class="sc-loraregular">324</text><text x="165.49" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="201.38" y="571.85" font-size="11.00" class="sc-loraregular">8</text><text x="210.46" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次；</text><text x="232.46 240.15 243.14 248.75 255.32 261.89 267.86 270.75 279.48 286.05 292.62 297.71 300.60 306.56 309.27" y="571.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="318.35" y="571.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="332.24 338.37 344.03" y="571.85" font-size="11.00" class="sc-loraregular">324</text><text x="352.89" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="388.78" y="571.85" font-size="11.00" class="sc-loraregular">11</text><text x="399.68" y="571.85" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这些运行计</text><text x="72.00" y="587.47" font-size="11.00" class="sc-notoserifcjksc">为失败；排除这些运行后，我们的数据与作者公布的参考轨迹在运行间噪声范围内一致。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.86 111.23 120.29 128.73 133.56 141.85 155.36 164.17 169.00 172.43 180.72 189.16 197.35 205.37 213.80 221.60" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.6 AutomationBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00" y="400.35" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="400.35" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.93 112.03 117.57 121.04 123.41 129.23 134.76 138.47 143.57 151.85 156.53 160.25 163.19 168.28 173.97 179.92 184.76 190.50 195.17" y="400.35" font-size="9.00" class="sc-lorabold">8.14.6.A] AutomationBench</text><text x="203.12" y="400.35" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="230.12" y="400.35" font-size="9.00" class="sc-notoserifcjksc">在其曲线上的每一个点，</text><text x="329.12 335.41 337.86 342.45 347.82 353.20 358.08 360.45 365.55 370.82 376.28 381.74 386.56 390.04 392.41 397.31 399.53" y="400.35" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="406.80" y="400.35" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="418.17 423.80 429.17 432.66 437.92 445.97 450.55 454.03 456.56 461.83 467.24 472.83 477.71 483.17 487.96" y="400.35" font-size="9.00" class="sc-loraregular">AutomationBench</text><text x="495.72" y="400.35" font-size="9.00" class="sc-notoserifcjksc">通过率都高</text><text x="72.00" y="412.05" font-size="9.00" class="sc-notoserifcjksc">于</text><text x="83.37 88.47 93.74 99.20 104.66 109.48 112.96 115.33" y="412.05" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="122.60" y="412.05" font-size="9.00" class="sc-notoserifcjksc">在相同或更低估计每任务成本下所达到的通过率。除</text><text x="331.96 338.26 340.70 345.29 350.67 356.05 360.93 363.29 368.40 373.66 379.12 384.59 389.40 392.89 395.25 400.16 402.37" y="412.05" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="409.64" y="412.05" font-size="9.00" class="sc-notoserifcjksc">外，所有模型的成本均为</text><text x="511.01" y="412.05" font-size="9.00" class="sc-loraregular">Zapier</text><text x="72.00" y="423.75" font-size="9.00" class="sc-notoserifcjksc">在其排行榜上公布的每任务数据；</text><text x="207.00 213.29 215.74 220.33 225.70 231.08 235.96 238.33 243.43 248.70 254.16 259.62 264.44 267.92 270.29 275.19 277.41" y="423.75" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="284.68" y="423.75" font-size="9.00" class="sc-notoserifcjksc">的每任务成本由</text><text x="350.05 355.68 361.06 364.55 369.94 373.77 379.04 384.41 386.94" y="423.75" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="394.09" y="423.75" font-size="9.00" class="sc-notoserifcjksc">根据</text><text x="414.46" y="423.75" font-size="9.00" class="sc-loraregular">Zapier</text><text x="443.64" y="423.75" font-size="9.00" class="sc-notoserifcjksc">记录的</text><text x="473.00 476.49 481.75 486.52 491.40" y="423.75" font-size="9.00" class="sc-loraregular">token</text><text x="499.23" y="423.75" font-size="9.00" class="sc-notoserifcjksc">数量，按</text><text x="72.00" y="435.45" font-size="9.00" class="sc-notoserifcjksc">含提示缓存的标准定价计算得出，采用的是</text><text x="245.37 251.66 254.11 258.70 264.07 269.45 274.33 276.70 283.84 289.22 294.59 298.76 301.12 306.03 308.24" y="435.45" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="315.51" y="435.45" font-size="9.00" class="sc-notoserifcjksc">系统卡中所用的方法。</text><text x="72.00 78.89 85.45 89.71 96.15 105.98 111.58 115.83 118.93 125.36 131.97 138.81 144.78 151.45 157.30" y="478.93" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="163.89" y="475.26" font-size="6.60" class="sc-loraregular">22</text><text x="173.88" y="478.93" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="187.77" y="478.93" font-size="11.00" class="sc-loraregular">Zapier</text><text x="220.54 223.98" y="475.26" font-size="6.60" class="sc-loraregular">23</text><text x="230.55" y="478.93" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，用于衡量智能体能否完成真实的端到端业务工</text><text x="72.00" y="494.55" font-size="11.00" class="sc-notoserifcjksc">作流。任务源自销售、市场营销、运营、客户支持、财务和人力资源等领域的真实客户工作流模</text><text x="72.00" y="510.17" font-size="11.00" class="sc-notoserifcjksc">式。每项任务将智能体置于一家模拟公司中；整个基准测试共有约</text><text x="393.89" y="510.17" font-size="11.00" class="sc-loraregular">500</text><text x="416.44" y="510.17" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="430.34 437.24 444.09 450.32 457.36 460.26 467.14 473.75" y="510.17" font-size="11.00" class="sc-loraregular">REST API</text><text x="480.33" y="510.17" font-size="11.00" class="sc-notoserifcjksc">端点，覆盖</text><text x="72.00" y="525.79" font-size="11.00" class="sc-loraregular">47</text><text x="85.93" y="525.79" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="129.93" y="525.79" font-size="11.00" class="sc-loraregular">CRM</text><text x="154.62" y="525.79" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="165.62" y="525.79" font-size="11.00" class="sc-loraregular">Slack</text><text x="192.29" y="525.79" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="203.29 211.66 218.09 224.53 230.87 233.87 239.83 242.72 253.24 259.67 264.39 270.30 275.39 281.96 287.63 293.43" y="525.79" font-size="11.00" class="sc-loraregular">Google Workspace</text><text x="302.29" y="525.79" font-size="11.00" class="sc-notoserifcjksc">等）。智能体会收到一条自然语言指令。随后，</text><text x="72.00" y="541.41" font-size="11.00" class="sc-notoserifcjksc">它必须通过搜索自主发现正确的端点；进行数十次相互依赖的顺序</text><text x="393.89 400.78 407.39" y="541.41" font-size="11.00" class="sc-loraregular">API</text><text x="413.97" y="541.41" font-size="11.00" class="sc-notoserifcjksc">调用；查阅并遵守多层级</text><text x="72.00" y="557.03" font-size="11.00" class="sc-notoserifcjksc">的业务政策文档；并正确避开刻意设置的干扰项。每项任务按通过</text><text x="391.00" y="557.03" font-size="11.00" class="sc-loraregular">/</text><text x="398.59" y="557.03" font-size="11.00" class="sc-notoserifcjksc">不通过评分。只有当针对模</text><text x="72.00" y="572.65" font-size="11.00" class="sc-notoserifcjksc">拟应用状态的所有确定性断言均成立时（例如，所有正确的</text><text x="360.89" y="572.65" font-size="11.00" class="sc-loraregular">CRM</text><text x="388.48" y="572.65" font-size="11.00" class="sc-notoserifcjksc">更新均已应用），任务才算通</text><text x="72.00" y="588.27" font-size="11.00" class="sc-notoserifcjksc">过。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">22</text><text x="421.41 427.31 431.28 435.15 441.12 445.75 448.25 451.94 458.84 464.00 468.33 473.63 476.44 481.10 483.56 489.41 493.69 499.22" y="690.99" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/</text><text x="72.00 77.16 82.98 87.26 94.16 99.53 105.31 111.52 116.94 119.40 123.04 128.59 134.37 139.94" y="705.19" font-size="10.00" class="sc-loraregular" fill="#0000ff">abs/2604.18934</text><text x="72.00 75.13" y="716.06" font-size="6.00" class="sc-loraregular">23</text><text x="81.10" y="719.39" font-size="10.00" class="sc-notoserifcjksc">结果基于</text><text x="123.73" y="719.39" font-size="10.00" class="sc-loraregular">Zapier</text><text x="156.15" y="719.39" font-size="10.00" class="sc-notoserifcjksc">私有评估集的</text><text x="218.78 222.42 224.73 230.78 233.14" y="719.39" font-size="10.00" class="sc-loraregular">1.0.6</text><text x="241.55" y="719.39" font-size="10.00" class="sc-notoserifcjksc">版本。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="421.41" y="682.99" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="458.84" y="682.99" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="458.84" y="682.99" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="506.12" y="682.99" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="697.19" width="73.36" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00 507.28 512.07" y="751.81" font-size="9.00" class="sc-loraregular">137</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">Zapier</text><text x="107.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在其</text><text x="132.56 139.44 146.01 150.27 156.70 166.53 172.13 176.39 179.48 185.92 192.53 199.37 205.33 212.01 217.86" y="82.61" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="227.34" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估集上评估了</text><text x="307.24 314.92 317.92 323.53 330.09 336.67 342.63 345.53 351.76 358.20 364.88 371.55 377.44 381.69 384.59 390.58 393.29" y="82.61" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="399.28" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="424.18" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="446.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在启用</text><text x="164.54 171.43 178.04" y="98.23" font-size="11.00" class="sc-loraregular">API</text><text x="184.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">默认回退机制的情况下得分为</text><text x="330.51 336.47 342.43 344.79 349.86" y="98.23" font-size="11.00" class="sc-loraregular">44.7%</text><text x="359.43" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="370.43 378.12 381.11 386.72 393.29 399.87 405.83 408.72 417.45 424.02 430.59 435.68 438.57 444.57 447.28" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="456.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在以默认回退机</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">制重新运行以拒绝告终的任务后得分为</text><text x="261.89" y="113.85" font-size="11.00" class="sc-loraregular">42.5%</text><text x="292.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（未重新运行时为</text><text x="382.93 388.89 395.54 398.08 404.92" y="113.85" font-size="11.00" class="sc-loraregular">40.0%</text><text x="414.49" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，如</text><text x="439.38 447.07 450.06 455.67 462.24 468.81 474.78 477.67 486.40 492.97 499.54 504.63 507.52 513.52 516.22" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="525.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">统卡中所报告）。</text><text x="72.00" y="165.50" font-size="14.00" class="sc-poppinssemibold">8.15</text><text x="102.06" y="165.50" font-size="14.00" class="sc-notosanscjkscbold">医疗健康</text><text x="72.00" y="192.06" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 116.23 122.17 127.85 130.84 135.10 141.62 148.46 154.42 161.10 166.95" y="192.06" font-size="11.00" class="sc-loraregular">HealthBench</text><text x="173.54" y="192.06" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="184.54 192.88 198.82 204.49 207.49 211.74 218.27 225.11 231.07 237.75 243.60 250.19 253.08 259.75 264.43 270.81 274.48 280.44 285.53 290.63 293.72 300.15 306.83 312.50" y="192.06" font-size="11.00" class="sc-loraregular">HealthBench Professional</text><text x="318.39" y="192.06" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="332.28 338.88 345.39 351.20 356.29 359.39 365.24 368.33 374.00 380.62 387.46 393.42 400.10 405.95" y="192.06" font-size="11.00" class="sc-loraregular">PhysicianBench</text><text x="415.43" y="192.06" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="462.32 470.01 473.01 478.62 485.18 491.76 497.72 500.62 506.85 513.29 519.96 526.64 532.53" y="192.06" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="207.68" font-size="11.00" class="sc-loraregular">5.5</text><text x="86.70" y="207.68" font-size="11.00" class="sc-notoserifcjksc">，主要涵盖面向患者的聊天机器人用例、面向医疗服务提供者的聊天机器人用例，以及涉及电</text><text x="72.00" y="223.30" font-size="11.00" class="sc-notoserifcjksc">子健康记录（</text><text x="138.00 143.96 146.95 152.86 158.66 162.91 167.60 174.04 180.71 183.80 189.66 192.55 199.14 205.08 210.75 213.75 218.00 224.59 227.49 232.17 238.08 243.88 250.31 255.00" y="223.30" font-size="11.00" class="sc-loraregular">electronic health record</text><text x="261.57" y="223.30" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="272.57" y="223.30" font-size="11.00" class="sc-loraregular">EHR</text><text x="294.90" y="223.30" font-size="11.00" class="sc-notoserifcjksc">）工具使用的智能体医疗健康任务。图中所示的所</text><text x="72.00" y="238.92" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="238.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="238.92" font-size="11.00" class="sc-notoserifcjksc">模型均在启用安全分类器的情况下运行。为实现同等条件下的比较，我们在每项评估中</text><text x="72.00" y="254.54" font-size="11.00" class="sc-notoserifcjksc">对所有评分细则评分使用同一个评分模型。对于</text><text x="305.89 314.23 320.17 325.85 328.84 333.10 339.62 346.46 352.42 359.10 364.95" y="254.54" font-size="11.00" class="sc-loraregular">HealthBench</text><text x="374.43" y="254.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="388.33 396.67 402.61 408.28 411.27 415.53 422.05 428.89 434.86 441.53 447.39 453.97 456.87 463.53 468.22 474.60 478.26 484.22 489.32 494.41 497.50 503.94 510.61 516.29" y="254.54" font-size="11.00" class="sc-loraregular">HealthBench Professional</text><text x="519.28" y="254.54" font-size="11.00" class="sc-notoserifcjksc">，我</text><text x="72.00" y="270.16" font-size="11.00" class="sc <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 109.81 111.91 117.44 120.92 123.28 132.03 135.51 140.83" y="367.00" font-size="9.00" class="sc-lorabold">8.16.2.A] MILU</text><text x="150.04" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="204.04" y="367.00" font-size="9.00" class="sc-notoserifcjksc">所有</text><text x="224.41 230.70 233.15 237.74 243.11 248.49" y="367.00" font-size="9.00" class="sc-loraregular">Claude</text><text x="255.74" y="367.00" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="303.10" y="367.00" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="321.67" y="367.00" font-size="9.00" class="sc-notoserifcjksc">推理强度下的自适应思考。分数为</text><text x="459.04" y="367.00" font-size="9.00" class="sc-loraregular">5</text><text x="466.31" y="367.00" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">未向任何模型提供工具或自定义系统提示词。</text><text x="72.00" y="414.07" font-size="14.00" class="sc-poppinssemibold">8.17</text><text x="100.71" y="414.07" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00" y="446.63" font-size="11.00" class="sc-notoserifcjksc">本节报告支持有益生命科学研究的能力评估，涵盖生物信息学、基于细胞的检测与生物医学图像</text><text x="72.00" y="462.25" font-size="11.00" class="sc-notoserifcjksc">分析、药物化学、蛋白质设计、从头蛋白质结合剂设计以及实验方案。除非另有说明，每个</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="477.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="477.87" font-size="11.00" class="sc-notoserifcjksc">得分均为每道题五次尝试的平均值，采样时使用自适应思考，推理强度为</text><text x="465.18" y="477.87" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="484.99" y="477.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="495.99 503.68 506.67 512.28 518.85 525.42" y="477.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="493.49" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="493.49" font-size="11.00" class="sc-notoserifcjksc">通过</text><text x="153.54 160.43 167.04" y="493.49" font-size="11.00" class="sc-loraregular">API</text><text x="173.62" y="493.49" font-size="11.00" class="sc-notoserifcjksc">进行评估，且关闭了其生物安全防护措施，因此这些结果反映的是底层模型</text><text x="72.00" y="509.11" font-size="11.00" class="sc-notoserifcjksc">的能力，而非已部署系统的能力。在可获得的情况下，我们还报告了</text><text x="404.89" y="509.11" font-size="11.00" class="sc-loraregular">GPT</text><text x="426.97" y="509.11" font-size="11.00" class="sc-notoserifcjksc">‑</text><text x="430.78 437.13 440.03 446.91 452.01 456.26 460.95" y="509.11" font-size="11.00" class="sc-loraregular">6 Astra</text><text x="469.52" y="509.11" font-size="11.00" class="sc-notoserifcjksc">的得分，其通</text><text x="72.00" y="524.73" font-size="11.00" class="sc-notoserifcjksc">过</text><text x="85.89 94.63 101.19 107.16 113.83 120.72 124.40 127.30 134.18 140.79" y="524.73" font-size="11.00" class="sc-loraregular">OpenAI API</text><text x="147.37" y="524.73" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="161.26" y="524.73" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="183.96" y="524.73" font-size="11.00" class="sc-notoserifcjksc">推理强度运行。同样，我们报告了</text><text x="351.85 360.23 366.19 376.02 379.11 385.79 388.88 391.77 397.90 400.61 404.61 407.50 414.17 418.86" y="524.73" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="428.18" y="524.73" font-size="11.00" class="sc-notoserifcjksc">在最高思考级别下的得</text><text x="72.00" y="540.35" font-size="11.00" class="sc-notoserifcjksc">分。任一模型上被安全过滤器拦截的尝试均不计入我们的评估结果。</text></svg></div>

ont-size="11.00" class="sc-notoserifcjksc">。</text><text x="143.71 151.40 154.39 160.00 166.57 173.15 179.11 182.00 188.24 194.67 201.35 208.03 213.91 218.17 221.06 227.06 229.76" y="224.47" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="238.65" y="224.47" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="285.54 293.23 296.22 301.83 308.40 314.98 320.94 323.83 332.57 339.14 345.70 350.79 353.69 359.68 362.39" y="224.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="371.28" y="224.47" font-size="11.00" class="sc-notoserifcjksc">相当（</text><text x="404.28" y="224.47" font-size="11.00" class="sc-loraregular">82.3%</text><text x="437.66" y="224.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="451.56 457.74 463.64 466.24 472.60" y="224.47" font-size="11.00" class="sc-loraregular">82.6%</text><text x="482.17" y="224.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="289.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.7</text><text x="109.17" y="289.31" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">生物医学图像分析</text><text x="72.00" y="321.19" font-size="11.00" class="sc-notoserifcjksc">该基准测试使用来自公开生物医学图像分析竞赛的数据，评估模型对生物医学图像进行定量分析</text><text x="72.00" y="336.81" font-size="11.00" class="sc-notoserifcjksc">的能力。任务输入涵盖</text><text x="184.89" y="336.81" font-size="11.00" class="sc-loraregular">CT</text><text x="199.62" y="336.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="210.62" y="336.81" font-size="11.00" class="sc-loraregular">MRI</text><text x="231.31" y="336.81" font-size="11.00" class="sc-notoserifcjksc">、组织病理、皮肤镜、视网膜、超声、显微及其他成像。我们对</text><text x="72.00" y="352.43" font-size="11.00" class="sc-notoserifcjksc">评分进行了缩放，以反映</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="352.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18" y="352.43" font-size="11.00" class="sc-notoserifcjksc">的表现相对于相应竞赛中所取得最佳结果的水平。我们每道题</text><text x="72.00" y="368.05" font-size="11.00" class="sc-notoserifcjksc">运行了</text><text x="107.89" y="368.05" font-size="11.00" class="sc-loraregular">1</text><text x="114.79" y="368.05" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="158.79 166.48 169.47 175.08 181.65 188.23 194.19 197.08 203.32 209.75 216.43 223.11 228.99 233.25 236.14 242.14 244.84" y="368.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="253.73" y="368.05" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="300.62 308.31 311.30 316.92 323.48 330.06 336.02 338.92 347.65 354.22 360.78 365.88 368.77 374.76 377.47" y="368.05" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="386.36" y="368.05" font-size="11.00" class="sc-notoserifcjksc">相近（</text><text x="419.36" y="368.05" font-size="11.00" class="sc-loraregular">72.2%</text><text x="451.41" y="368.05" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="465.31" y="368.05" font-size="11.00" class="sc-loraregular">71.4%</text><text x="492.62" y="368.05" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 80.37 87.04 93.37 98.75 105.11 108.00 114.89 119.98 124.24 128.93" y="383.67" font-size="11.00" class="sc-loraregular">GPT-6 Astra</text><text x="137.49" y="383.67" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="151.39 156.46 161.04 163.75 169.75" y="383.67" font-size="11.00" class="sc-loraregular">77.5%</text><text x="182.21" y="383.67" font-size="11.00" class="sc-notoserifcjksc">的得分领先，</text><text x="248.21 256.58 262.54 272.38 275.47 282.14 285.24 288.13 294.26 296.96 300.97 303.86 310.52 315.21" y="383.67" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="324.54" y="383.67" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="360.43 366.29 370.88 373.59 379.77" y="383.67" font-size="11.00" class="sc-loraregular">37.8%</text><text x="389.34" y="383.67" font-size="11.00" class="sc-notoserifcjksc">（基于其</text><text x="436.23" y="383.67" font-size="11.00" class="sc-loraregular">91</text><text x="449.49" y="383.67" font-size="11.00" class="sc-notoserifcjksc">个案例中已完成的</text><text x="72.00 78.11" y="399.29" font-size="11.00" class="sc-loraregular">89</text><text x="87.36" y="399.29" font-size="11.00" class="sc-notoserifcjksc">个计算；两个未完成，不计入得分）。</text><text x="72.00" y="497.15" font-size="11.00" class="sc-notoserifcjksc">这项评估考察模型协助完成分子生物学实验方案的能力。故障排查变体（</text><text x="424.00 430.88 435.56 442.00 448.56 454.96 457.96 463.92 469.01 475.60 482.04 488.47 492.73 495.82 502.50" y="497.15" font-size="11.00" class="sc-loraregular">Troubleshooting</text><text x="72.00 77.44 83.12 87.88 90.97 96.65 103.23" y="512.77" font-size="11.00" class="sc-loraregular">variant</text><text x="107.49" y="512.77" font-size="11.00" class="sc-notoserifcjksc">）要求</text><text x="143.38 151.07 154.06 159.67 166.24 172.82" y="512.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="181.67" y="512.77" font-size="11.00" class="sc-notoserifcjksc">发现并修复实验方案中的问题。</text><text x="335.67 343.94 350.62 357.20 363.16 367.92 373.01 377.27 382.95 389.62 396.20 399.29 405.97 412.05 414.95 418.76 425.95 431.85" y="512.77" font-size="11.00" class="sc-loraregular">Understanding (V2)</text><text x="438.10" y="512.77" font-size="11.00" class="sc-notoserifcjksc">变体是由</text><text x="484.99" y="512.77" font-size="11.00" class="sc-loraregular">Benchling</text><text x="72.00" y="528.39" font-size="11.00" class="sc-notoserifcjksc">创建的一组题目，它向</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="528.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="528.39" font-size="11.00" class="sc-notoserifcjksc">提供一份真实的实验方案（例如</text><text x="380.08 386.64 391.33 397.77 402.02 408.46 414.25 420.69 423.68 428.77 431.48 434.57" y="528.39" font-size="11.00" class="sc-loraregular">protocols.io</text><text x="443.90" y="528.39" font-size="11.00" class="sc-notoserifcjksc">文档、厂商手册或</text><text x="72.00" y="544.01" font-size="11.00" class="sc-notoserifcjksc">核心实验平台指南），以及一个关于应用或调整该方案的实际问题。在这两个变体上，</text><text x="490.00 497.69 500.68 506.29 512.86 519.44" y="544.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="559.63" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="559.63" font-size="11.00" class="sc-notoserifcjksc">均较</text><text x="153.54 161.23 164.22 169.83 176.40 182.98 188.94 191.83 198.07 204.51 211.18 217.86 223.75 228.00 230.90" y="559.63" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="239.78" y="559.63" font-size="11.00" class="sc-notoserifcjksc">有所提升（故障排查</text><text x="341.68 347.96 352.54 355.25 361.38" y="559.63" font-size="11.00" class="sc-loraregular">67.3%</text><text x="373.84" y="559.63" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="387.73 393.70 399.88 402.58 408.94" y="559.63" font-size="11.00" class="sc-loraregular">49.9%</text><text x="418.51" y="559.63" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="429.51 437.78 444.46 451.04 457.00 461.76 466.86 471.11 476.79 483.47 490.04 493.13 499.81 505.89 508.79 512.60 519.79 525.70" y="559.63" font-size="11.00" class="sc-loraregular">Understanding (V2)</text><text x="72.00 78.36 84.72 87.31 93.67" y="575.25" font-size="11.00" class="sc-loraregular">66.6%</text><text x="106.13" y="575.25" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="120.03" y="575.25" font-size="11.00" class="sc-loraregular">58.9%</text><text x="150.84" y="575.25" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="343.74" y="200.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/Claude-accelerates-protein-design" rel="noopener"><rect x="343.74" y="200.05" width="11.00"
