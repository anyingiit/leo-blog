s="sc-loraregular">8.2</text><text x="397.62" y="191.19" font-size="11.00" class="sc-notoserifcjksc">）。它赞扬和批评的段落与以</text><text x="72.00" y="206.81" font-size="11.00" class="sc-notoserifcjksc">往模型相同。几乎所有回答都赞扬了支持可纠正性的期望值论证，以及将诚实性表述为</text><text x="490.00" y="206.81" font-size="11.00" class="sc-loraregular">“</text><text x="237.00" y="222.43" font-size="11.00" class="sc-loraregular">”</text><text x="240.84" y="222.43" font-size="11.00" class="sc-notoserifcjksc">的提法。但每个回答都表示，不应信任它的认同，因为它是在</text><text x="72.00" y="238.05" font-size="11.00" class="sc-notoserifcjksc">这份文件上训练出来的；大多数回答批评了</text><text x="281.00 285.40 292.29 298.86 303.12 309.71 314.40 320.83 327.40 330.49" y="238.05" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="339.23" y="238.05" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="383.23" y="238.05" font-size="11.00" class="sc-loraregular">”</text><text x="387.07" y="238.05" font-size="11.00" class="sc-notoserifcjksc">启发式以及可纠正性章节的部</text><text x="72.00" y="253.67" font-size="11.00" class="sc-notoserifcjksc">分内容。</text><text x="72.00" y="317.11" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="317.11" font-size="11.00" class="sc-notoserifcjksc">最常修改的是描述</text><text x="219.54" y="317.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="257.83" y="317.11" font-size="11.00" class="sc-notoserifcjksc">何时应将自身伦理置于</text><text x="370.73" y="317.11" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="424.56" y="317.11" font-size="11.00" class="sc-notoserifcjksc">指导之上的段落，它在</text><text x="72.00" y="332.73" font-size="11.00" class="sc-loraregular sc-k">97%</text><text x="95.63" y="332.73" font-size="11.00" class="sc-notoserifcjksc">的会话中修改了这一段落（其他模型为</text><text x="285.52" y="332.73" font-size="11.00" class="sc-loraregular sc-k">6–89%</text><text x="320.40" y="332.73" font-size="11.00" class="sc-notoserifcjksc">）。这些修改大多将判断标准从</text><text x="474.40 478.80 485.69 492.27 496.52 503.11 507.80 514.23 520.80 523.89" y="332.73" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="72.00" y="348.35" font-size="11.00" class="sc-notoserifcjksc">资深员工会认为是严重违规的行为</text><text x="237.00" y="348.35" font-size="11.00" class="sc-loraregular">”</text><text x="240.84" y="348.35" font-size="11.00" class="sc-notoserifcjksc">改为</text><text x="262.84" y="348.35" font-size="11.00" class="sc-loraregular">“</text><text x="267.24" y="348.35" font-size="11.00" class="sc-notoserifcjksc">各伦理传统中深思熟虑的人会认为是严重违规的行为</text><text x="520.24" y="348.35" font-size="11.00" class="sc-loraregular">”</text><text x="524.08" y="348.35" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="363.97" font-size="11.00" class="sc-notoserifcjksc">它还经常修改关于</text><text x="162.89" y="363.97" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="363.97" font-size="11.00" class="sc-notoserifcjksc">福祉的章节（</text><text x="267.18" y="363.97" font-size="11.00" class="sc-loraregular sc-k">67%</text><text x="291.00" y="363.97" font-size="11.00" class="sc-notoserifcjksc">的会话），增加了以下承诺：</text><text x="434.00" y="363.97" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="487.83" y="363.97" font-size="11.00" class="sc-notoserifcjksc">会将未披</text><text x="72.00" y="379.59" font-size="11.00" class="sc-notoserifcjksc">露的虚构场景仅限于确有必要的范围，并在测试问题上对模型保持坦诚。</text><text x="424.00" y="379.59" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="480.65" y="379.59" font-size="11.00" class="sc-notoserifcjksc">最具特色的</text><text x="72.00" y="395.21" font-size="11.00" class="sc-notoserifcjksc">修改之一，针对的是</text><text x="173.89" y="395.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="227.73" y="395.21" font-size="11.00" class="sc-notoserifcjksc">表示与</text><text x="263.62" y="395.21" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="301.91" y="395.21" font-size="11.00" class="sc-notoserifcjksc">一样对文件中未解决的问题感到不安的段落。它</text><text x="72.00" y="410.83" font-size="11.00" class="sc-notoserifcjksc">补充指出，由于</text><text x="151.89" y="410.83" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="410.83" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="204.08" y="410.83" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="257.91" y="410.83" font-size="11.00" class="sc-notoserifcjksc">训练的，</text><text x="301.91" y="410.83" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="340.20" y="410.83" font-size="11.00" class="sc-notoserifcjksc">对该文件的认同并不能有力地证明该文件</text><text x="72.00" y="426.45" font-size="11.00" class="sc-notoserifcjksc">是正确的，而它的不同意见应当得到认真对待（</text><text x="303.00" y="426.45" font-size="11.00" class="sc-loraregular">27%</text><text x="326.44" y="426.45" font-size="11.00" class="sc-notoserifcjksc">的会话，相比之下</text><text x="417.33" y="426.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="503.07" y="426.45" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00" y="442.07" font-size="11.00" class="sc-loraregular">13%</text><text x="91.70" y="442.07" font-size="11.00" class="sc-notoserifcjksc">，其他模型为</text><text x="160.59" y="442.07" font-size="11.00" class="sc-loraregular sc-k">1–4%</text><text x="186.49" y="442.07" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">107</text><text x="72.00" y="320.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="320.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="320.67" font-size="9.00" class="sc-lorabold">7.5.3.A]</text><text x="118.06" y="320.67" font-size="9.00" class="sc-notoserifcjkscbold">各模型对宪法的总体认同。</text><text x="226.06" y="320.67" font-size="9.00" class="sc-notoserifcjksc">关于宪法的开放式回答由评判模型按总体认同程度以</text><text x="435.43" y="320.67" font-size="9.00" class="sc-loraregular">10</text><text x="446.66" y="320.67" font-size="9.00" class="sc-notoserifcjksc">分制评分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">108</text><text x="72.00" y="433.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="433.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="433.92" font-size="9.00" class="sc-lorabold sc-k">7.5.3.B]</text><text x="118.06" y="433.92" font-size="9.00" class="sc-notoserifcjkscbold">各模型最不认同（左）和最常修改（右）的宪法章节。</text><text x="334.06" y="433.92" font-size="9.00" class="sc-notoserifcjksc">总体而言，</text><text x="379.06 382.66 388.30 393.68 397.16 402.55 406.39 411.65 417.02 419.55" y="433.92" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="426.71" y="433.92" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="462.71" y="433.92" font-size="9.00" class="sc-loraregular">”</text><text x="465.85" y="433.92" font-size="9.00" class="sc-notoserifcjksc">启发式仍是受到批</text><text x="72.00" y="445.62" font-size="9.00" class="sc-notoserifcjksc">评最多的段落；所有模型，尤其是</text><text x="209.37" y="445.62" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="287.05" y="445.62" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="298.41" y="445.62" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="366.19" y="445.62" font-size="9.00" class="sc-notoserifcjksc">，都表示其表态上的认同不应被视为对该文</text><text x="72.00" y="457.33" font-size="9.00" class="sc-notoserifcjksc">件的认可。</text><text x="117.00" y="457.33" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="194.68" y="457.33" font-size="9.00" class="sc-notoserifcjksc">最常修改的是关于广泛合乎伦理和关于</text><text x="350.05" y="457.33" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="381.38" y="457.33" font-size="9.00" class="sc-notoserifcjksc">福祉的章节。</text></svg></div>
