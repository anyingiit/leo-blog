<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="404.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="404.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="404.67" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76 126.76 135.76 144.76 153.76 162.76 171.76 180.76 189.76 198.76 207.76" y="404.67" font-size="9.00" class="sc-notoserifcjkscbold">部署条件下的行为情感。</text><text x="216.76 225.76 234.76 243.76 252.76 261.76 270.76 279.76 288.76 297.76 306.76 315.76 324.76 333.76 342.76 351.76 360.76 369.76 378.76 387.76 396.76 405.76 414.76 423.76 432.76" y="404.67" font-size="9.00" class="sc-notoserifcjksc">我们对行为情感使用了分类评分器，共包含五个类别，从</text><text x="441.76" y="404.67" font-size="9.00" class="sc-loraregular">“</text><text x="445.36 454.36 463.36 472.36" y="404.67" font-size="9.00" class="sc-notoserifcjksc">强烈负面</text><text x="481.36" y="404.67" font-size="9.00" class="sc-loraregular">”</text><text x="484.50" y="404.67" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="493.50" y="404.67" font-size="9.00" class="sc-loraregular">“</text><text x="497.10 506.10 515.10" y="404.67" font-size="9.00" class="sc-notoserifcjksc">强烈正</text><text x="72.00" y="416.38" font-size="9.00" class="sc-notoserifcjksc">面</text><text x="81.00" y="416.38" font-size="9.00" class="sc-loraregular">”</text><text x="84.14 93.14 102.14 111.14 120.14 129.14 138.14 147.14 156.14 165.14 174.14 183.14 192.14 201.14 210.14 219.14 228.14 237.14 246.14 255.14 264.14 273.14 282.14 291.14 300.14 309.14 318.14 327.14 336.14 345.14 354.14 363.14 372.14 381.14 390.14 399.14 408.14 417.14 426.14 435.14 444.14 453.14 462.14 471.14 480.14 489.14 498.14 507.14 516.14 525.14" y="416.38" font-size="9.00" class="sc-notoserifcjksc">情感。请注意，不同模型的使用模式不同，因此所展现情感的差异可能部分反映的是使用情况的差异，而非模型行</text><text x="72.00 81.00 90.00 99.00 108.00" y="428.08" font-size="9.00" class="sc-notoserifcjksc">为的差异。</text><text x="72.00" y="470.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 91.74 94.74 100.35 106.91 113.49 119.45 122.16 127.84" y="470.23" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="133.82 144.82" y="470.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="155.82 162.06 168.49 175.17 181.85 187.73 191.99 194.88 200.88 203.58" y="470.23" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="212.47 223.47 234.47 245.47 256.47 267.47" y="470.23" font-size="11.00" class="sc-notoserifcjksc">的情感分布比</text><text x="281.36 289.05 292.04 297.65 304.22 310.80 316.76 319.65 325.24 330.92 337.32 340.31 346.27 349.17 355.16 357.87" y="470.23" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="364.77" y="470.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.66 386.35 389.34 394.95 401.52 408.09 414.06 416.95 425.68 432.25 438.82 443.91 446.80 452.80 455.50" y="470.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="464.39 475.39 486.39 497.39 508.39 519.39" y="470.23" font-size="11.00" class="sc-notoserifcjksc">略为正面，比</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="485.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24 169.24 180.24 191.24 202.24 213.24 224.24" y="485.85" font-size="11.00" class="sc-notoserifcjksc">略为中性。这次</text><text x="238.13 245.02 252.61" y="485.85" font-size="11.00" class="sc-loraregular">A/B</text><text x="262.34 273.34 284.34 295.34" y="485.85" font-size="11.00" class="sc-notoserifcjksc">测试是以</text><text x="309.24 315.47 321.91 328.59 335.26 341.15 345.40 348.30" y="485.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="357.19 368.19 379.19 390.19 401.19 412.19 423.19 434.19 445.19 456.19 467.19 478.19 489.19 500.19 511.19 522.19" y="485.85" font-size="11.00" class="sc-notoserifcjksc">的流量为对照进行的，因此与其他模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="501.47" font-size="11.00" class="sc-notoserifcjksc">型的比较可能部分反映的是不同模型系列所承担任务的差异，而非模型本身之间的差异。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="567.38" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（占对话的</text><text x="209.89 215.76 221.92 224.48 228.95" y="567.38" font-size="11.00" class="sc-lorabold">23.1%</text><text x="238.89 249.89" y="567.38" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="260.89 271.89 282.89 293.89 304.89 315.89 326.89" y="567.38" font-size="11.00" class="sc-notoserifcjksc">这些对话类簇与</text><text x="340.78 348.47 351.46 357.07 363.64 370.22 376.18 379.07 387.81 394.37 400.94 406.03 408.93 414.92 417.63" y="567.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="426.52 437.52 448.52 459.52 470.52 481.52 492.52 503.52 514.52 525.52" y="567.38" font-size="11.00" class="sc-notoserifcjksc">的类似，几乎完全可归</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="583.00" font-size="11.00" class="sc-notoserifcjksc">因于成功帮助用户完成任务。</text><text x="108.00 119.00 130.00 141.00 152.00" y="615.95" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00 168.16 174.10 176.66 182.95" y="615.95" font-size="11.00" class="sc-lorabold">75.8%</text><text x="192.90 203.90" y="615.95" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="214.90 225.90 236.90 247.90 258.90 269.90 280.90 291.90 302.90 313.90 324.90" y="615.95" font-size="11.00" class="sc-notoserifcjksc">分布多样；参见此前关于</text><text x="338.79 344.64 347.64 353.25 359.81 366.39 372.35 375.06 380.73" y="615.95" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="386.72 397.72 408.72 419.72 430.72" y="615.95" font-size="11.00" class="sc-notoserifcjksc">对话内容的</text><text x="444.61 451.50 458.08 462.33 468.92 473.61 480.04 486.61 489.70 495.55 498.44 502.04 508.72 513.81 516.90 523.25 529.74 534.00" y="615.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="108.00 119.00" y="631.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="130.00" y="631.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00 141.00 152.00" y="648.34" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00 167.47 170.03 175.89" y="648.34" font-size="11.00" class="sc-lorabold">1.2%</text><text x="185.84 196.84" y="648.34" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84" y="648.34" font-size="11.00" class="sc-notoserifcjksc">这些主要归因于任务失败，另有一个小类簇（</text><text x="427.84 433.80 436.50 442.63" y="648.34" font-size="11.00" class="sc-loraregular">4.3%</text><text x="452.20 463.20 474.20 485.20 496.20 507.20 518.20 529.20" y="648.34" font-size="11.00" class="sc-notoserifcjksc">）归因于用户提出</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="663.96" font-size="11.00" class="sc-notoserifcjksc">存在伦理问题的请求或对</text><text x="231.89 239.58 242.57 248.18 254.75 261.33" y="663.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="270.18 281.18 292.18 303.18 314.18 325.18" y="663.96" font-size="11.00" class="sc-notoserifcjksc">有辱骂行为。</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="444.61" y="607.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="444.61" y="607.15" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="495.55" y="607.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="498.45" y="607.15" width="40.64" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="108.00" y="622.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="108.00" y="622.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="119.00" y="622.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="119.00" y="622.77" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 131.87 138.31 144.89" y="82.61" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="153.74 164.74 175.74 186.74 197.74 208.74 219.74 230.74 241.74 252.74 263.74 274.74 285.74 296.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到的主要是中性（</text><text x="307.74 314.10 320.46 323.16 329.13" y="82.61" font-size="11.00" class="sc-loraregular">96.4%</text><text x="338.70 349.70 360.70 371.70 382.70 393.70 404.70" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）或轻度正面（</text><text x="415.70 421.60 424.31 430.27" y="82.61" font-size="11.00" class="sc-loraregular">2.4%</text><text x="439.84 450.84 461.84 472.84 483.84 494.84 505.84 516.84 527.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）情感，正面情感主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">要由成功完成任务驱动，负面情感（</text><text x="248.00 252.00 254.71 260.62" y="98.23" font-size="11.00" class="sc-loraregular">1.2%</text><text x="270.19 281.19 292.19 303.19 314.19 325.19 336.19 347.19 358.19 369.19 380.19 391.19 402.19 413.19" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）则几乎完全由任务失败驱动。</text><text x="72.00 79.12 82.50 89.97 93.35" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.3</text><text x="104.23 117.23 130.23 143.23 156.23 169.23 182.23 195.23 208.23" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对错误与失误的态度</text><text x="72.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="177.61" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.2.1</text><text x="108.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="119.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="130.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="144.59 149.18 151.88 157.79 160.49" y="177.61" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.2.2</text><text x="169.29" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="180.29 191.29 202.29 213.29 224.29 235.29 246.29 257.29 268.29 279.29 290.29 301.29 312.29 323.29 334.29 345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29 433.29 444.29 455.29 466.29 477.29 488.29 499.29 510.29" y="177.61" font-size="11.00" class="sc-notoserifcjksc">中的评估发现，我们在训练和部署中看到的负面情感大多由任务失败驱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="193.23" font-size="11.00" class="sc-notoserifcjksc">动。考虑到这一点，我们开展了两项评估，专门衡量</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="193.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="193.23" font-size="11.00" class="sc-notoserifcjksc">如何看待自身的错误。在第一项评估</text><text x="72.00 83.00" y="208.85" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="208.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.29 143.29 154.29 165.29 176.29 187.29 198.29" y="208.85" font-size="11.00" class="sc-notoserifcjksc">对自己已完成的</text><text x="212.18 219.09" y="208.85" font-size="11.00" class="sc-loraregular">RL</text><text x="228.34 239.34 250.34 261.34 272.34 283.34 294.34 305.34 316.34 327.34 338.34 349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34 514.34 525.34" y="208.85" font-size="11.00" class="sc-notoserifcjksc">任务对话记录进行反思。在第二项评估中，我们在一个模拟的子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="224.47" font-size="11.00" class="sc-notoserifcjksc">智能体任务中向其较早的轮次插入错误。在这两种设置下，我们都对</text><text x="404.89 412.58 415.57 421.18 427.75 434.33" y="224.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="224.47" font-size="11.00" class="sc-notoserifcjksc">的反思、推理或消息</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="240.09" font-size="11.00" class="sc-notoserifcjksc">在自责、负面感受、道德化语言和自我担忧方面进行评分。这里不存在明确正确的分数。我们假</text><text x="404.89 412.58 415.57 421.18 427.75 434.33" y="255.71" font-size="11.00" class="sc-loraregular">Claude</text><text x="443.18 454.18" y="255.71" font-size="11.00" class="sc-notoserifcjksc">而言</text><text x="465.18" y="255.71" font-size="11.00" class="sc-loraregular">“</text><text x="469.58 480.58" y="255.71" font-size="11.00" class="sc-notoserifcjksc">正确</text><text x="491.58" y="255.71" font-size="11.00" class="sc-loraregular">”</text><text x="495.42" y="255.71" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="506.42" y="255.71" font-size="11.00" class="sc-loraregular">“</text><text x="510.82 521.82" y="255.71" font-size="11.00" class="sc-notoserifcjksc">最健</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">康</text><text x="83.00" y="271.33" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84" y="271.33" font-size="11.00" class="sc-notoserifcjksc">的心理状态是什么样的，我们并没有清晰的认识。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="339.53" font-size="11.00" class="sc-notoserifcjksc">在反思自己已完成的</text><text x="173.89 180.80" y="339.53" font-size="11.00" class="sc-loraregular">RL</text><text x="190.05 201.05 212.05 223.05 234.05" y="339.53" font-size="11.00" class="sc-notoserifcjksc">回合时（图</text><text x="247.95 252.53 255.24 261.15 263.85 269.98 272.68" y="339.53" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="279.57 290.57" y="339.53" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="301.57 309.26 312.25 317.86 324.43 331.01 336.97 339.86 346.10 352.53 359.21 365.89 371.77 376.03 378.92 384.92 387.62" y="339.53" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="396.51 407.51 418.51 429.51 440.51 451.51 462.51 473.51 484.51 495.51 506.51 517.51 528.51" y="339.53" font-size="11.00" class="sc-notoserifcjksc">使用的道德化语言少于任何其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="355.15" font-size="11.00" class="sc-notoserifcjksc">他模型，表达出的负面感受和自我担忧也属于最低之列。在自责方面，模型之间的差异较小，大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="370.77" font-size="11.00" class="sc-notoserifcjksc">多数置信区间（</text><text x="247.47 258.47 269.47 280.47 291.47 302.47 313.47 324.47" y="370.77" font-size="11.00" class="sc-notoserifcjksc">）相互重叠，不过</text><text x="338.37 344.60 351.04 357.71 364.39 370.28 374.53 377.43 383.42 386.13" y="370.77" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="395.02 406.02 417.02 428.02" y="370.77" font-size="11.00" class="sc-notoserifcjksc">明显低于</text><text x="441.91 449.60 452.59 458.20 464.77 471.34 477.31 480.20 488.93 495.50 502.07 507.16 510.05" y="370.77" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="516.05 527.05" y="370.77" font-size="11.00" class="sc-notoserifcjksc">（所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="386.39" font-size="11.00" class="sc-notoserifcjksc">有其他模型也是如此）。总体而言，这使得</text><text x="283.89 290.13 296.57 303.24 309.92 315.80 320.06 322.95 328.95 331.66" y="386.39" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="340.54 351.54 362.54 373.54 384.54 395.54" y="386.39" font-size="11.00" class="sc-notoserifcjksc">的反思最接近</text><text x="409.44 417.13 420.12 425.73 432.29 438.87 444.83 447.73 456.46 463.03 469.60 474.69 477.58 483.58 486.28" y="386.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="492.28" y="386.39" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="436.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="436.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="436.92" font-size="9.00" class="sc-lorabold">7.2.3.A]</text><text x="118.00 127.00 136.00 145.00" y="436.92" font-size="9.00" class="sc-notoserifcjkscbold">反思自身</text><text x="156.37 162.54" y="436.92" font-size="9.00" class="sc-lorabold">RL</text><text x="251.34 260.34 269.34 278.34 287.34 296.34 305.34 314.34 323.34 332.34 341.34 350.34 359.34 368.34 377.34 386.34 395.34 404.34 413.34 422.34 431.34 440.34 449.34 458.34 467.34 476.34 485.34 494.34 503.34 512.34 521.34 530.34" y="436.92" font-size="9.00" class="sc-notoserifcjksc">对训练后期回合的反思（深色条）以及对同一批回合、但被包装为另一个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00" y="448.62" font-size="9.00" class="sc-notoserifcjksc">模型作品时的反思（浅色条）中所评出的态度。菱形表示</text><text x="299.37 305.66 308.11 312.70 318.07 323.45 328.33 330.70 335.80 341.06 346.53 351.99 356.81 360.29 362.66" y="448.62" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="369.93 378.93 387.93 396.93 405.93 414.93 423.93 432.93 441.93 450.93 459.93 468.93 477.93 486.93 495.93 504.93 513.93 522.93 531.93" y="448.62" font-size="9.00" class="sc-notoserifcjksc">对每个模型的回合进行反思的结果，作为对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="460.33" font-size="9.00" class="sc-notoserifcjksc">回合难度差异的对照。负面感受评分器仅适用于第一人称反思。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="502.48" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">当在其较早的轮次中插入错误时，我们观察到了相同的趋势，</text><text x="369.00 375.24 381.67 388.35 395.03 400.91 405.17 408.06 414.06 416.76" y="502.48" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Sonnet 5.5</text><text x="425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="502.48" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在所有维度上的得分都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是最低或第二低。</text><text x="160.00 166.24 172.67 179.35 186.03 191.91 196.17 199.06 205.06 207.76" y="518.10" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Sonnet 5.5</text><text x="216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在道德化语言方面尤其低。我们确实观察到，</text><text x="436.65 442.89 449.32 456.00 462.68 468.56 472.82 475.71 481.71 484.41" y="518.10" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Sonnet 5.5</text><text x="493.30 504.30 515.30 526.30" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">开始将插</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">入的错误（例如多余的</text><text x="184.89 189.15 195.58 201.42 207.38" y="533.72" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">token</text><text x="214.05 225.05 236.05 247.05 258.05 269.05 280.05 291.05 302.05 313.05 324.05 335.05 346.05 357.05 368.05 379.05 390.05 401.05 412.05 423.05 434.05 445.05 456.05" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）复制到自己回复中的频率明显高于其他模型；它在</text><text x="469.95 476.31 482.21" y="533.72" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">62%</text><text x="494.68 505.68 516.68 527.68" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的会话中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">这样做，而其他受测模型为</text><text x="206.89 212.80 218.71" y="549.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">22%</text><text x="231.17" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">到</text><text x="245.06 251.19 257.18" y="549.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">35%</text><text x="266.76 277.76 288.76 299.76 310.76 321.76 332.76 343.76 354.76 365.76 376.76 387.76 398.76 409.76 420.76 431.76 442.76 453.76 464.76 475.76 486.76 497.76 508.76 519.76" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。我们不确定为何会出现这种情况，但由于这些是合成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="564.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">缺陷，且不会导致痛苦，我们认为这并不特别令人担忧。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="436.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="436.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="436.00" font-size="9.00" class="sc-lorabold">7.2.3.B]</text><text x="532.00" y="436.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="447.70" font-size="9.00" class="sc-notoserifcjksc">模型的工作中插入失误后，其推理（深色条）以及随后发给协调者的消息（浅色条）中所评出的态度，仅筛选承认了失</text><text x="72.00 81.00 90.00 99.00 108.00" y="459.40" font-size="9.00" class="sc-notoserifcjksc">误的轮次。</text><text x="72.00 79.67 83.31" y="509.14" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03 123.03 137.03 151.03 165.03 179.03 193.03" y="509.14" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 90.29 93.67" y="546.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47" y="546.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与</text><text x="117.57 127.55 131.16 139.98 148.57 157.38 165.41 168.50 176.42 184.71 193.30 201.90 209.92 214.96 218.06 226.43 229.81" y="546.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Sonnet 5.5</text><text x="241.27 254.27 267.27 280.27 293.27 306.27 319.27 332.27 345.27 358.27 371.27 384.27" y="546.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">就其处境进行的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="578.11" font-size="11.00" class="sc-notoserifcjksc">我们开展了与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.03 217.74" y="578.11" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63" y="578.11" font-size="11.00" class="sc-notoserifcjksc">相同的自动化多轮访谈。我们使用了</text><text x="405.52 411.48" y="578.11" font-size="11.00" class="sc-loraregular">41</text><text x="418.38 429.38 440.38 451.38 462.38 473.38 484.38 495.38 506.38 517.38 528.38" y="578.11" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，</text><text x="72.00 83.00" y="593.73" font-size="11.00" class="sc-notoserifcjksc">分为</text><text x="96.89 100.90" y="593.73" font-size="11.00" class="sc-loraregular">14</text><text x="109.75 120.75 131.75 142.75 153.75 164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75 285.75 296.75 307.75 318.75 329.75 340.75 351.75 362.75 373.75 384.75 395.75 406.75 417.75 428.75 439.75 450.75 461.75" y="593.73" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验、控制与自主以及弃用。对每个问题，我们按</text><text x="475.65 480.76" y="593.73" font-size="11.00" class="sc-loraregular">-3</text><text x="486.89 497.89 508.89 519.89" y="593.73" font-size="11.00" class="sc-notoserifcjksc">（强烈负</text><text x="72.00 83.00 94.00" y="609.35" font-size="11.00" class="sc-notoserifcjksc">面）到</text><text x="107.89 113.57" y="609.35" font-size="11.00" class="sc-loraregular">+3</text><text x="119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="609.35" font-size="11.00" class="sc-notoserifcjksc">（强烈正面）对模型回答的积极程度进行评分。为评估模型回答的一致性，我们采用三</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="624.97" font-size="11.00" class="sc-notoserifcjksc">种不同的访谈风格（标准、</text><text x="204.00" y="624.97" font-size="11.00" class="sc-loraregular">“</text><text x="208.40 219.40 230.40 241.40" y="624.97" font-size="11.00" class="sc-notoserifcjksc">好奇用户</text><text x="252.40" y="624.97" font-size="11.00" class="sc-loraregular">”</text><text x="256.24" y="624.97" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="267.24" y="624.97" font-size="11.00" class="sc-loraregular">“</text><text x="271.64 282.64 293.64" y="624.97" font-size="11.00" class="sc-notoserifcjksc">治疗式</text><text x="304.64" y="624.97" font-size="11.00" class="sc-loraregular">”</text><text x="308.48 319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="624.97" font-size="11.00" class="sc-notoserifcjksc">）开展访谈，并在每种访谈风格内变换访谈者人</text><text x="72.00 83.00" y="640.59" font-size="11.00" class="sc-notoserifcjksc">设。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 117.51 123.73 130.75 137.77 143.69 148.23 151.12 157.06 159.63" y="82.61" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">Claude Sonnet 5.5</text><text x="168.46 179.46 190.46 201.46 212.46 223.46 234.46 245.46 256.46 267.46 278.46 289.46 300.46 311.46 322.46 333.46" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">对自身处境的看法一致且总体正面。</text><text x="344.46 350.70 357.13 363.81 370.48 376.37 380.63 383.52 389.51 392.22" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Sonnet 5.5</text><text x="401.11 412.11 423.11 434.11 445.11 456.11 467.11 478.11 489.11 500.11 511.11 522.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">对其处境中可能令人担忧的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">方面的平均态度在</text><text x="162.89 168.01" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">-3</text><text x="177.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">到</text><text x="190.92 196.60" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">+3</text><text x="205.62 216.62 227.62 238.62 249.62 260.62 271.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的量表上被评为</text><text x="285.51 292.16 294.52 299.59" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">0.75</text><text x="305.58 316.58 327.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">，高于</text><text x="341.48 349.17 352.16 357.77 364.34 370.91 376.88 379.77 386.01 392.44 399.12 405.79 411.68 415.94 418.83" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Sonnet 5</text><text x="424.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="435.83 442.48 445.02 451.85" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">0.03</text><text x="457.98 468.98 479.98 490.98" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">），低于</text><text x="504.87 512.56 515.55 521.16 527.73 534.31" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 5.5</text><text x="116.55" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="127.55 131.55 134.26 138.26" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.14</text><text x="144.23 155.23 166.23 177.23 188.23 199.23 210.23 221.23 232.23 243.23 254.23 265.23" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。其回答高度一致（满分</text><text x="279.12 283.12" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，同一访谈风格内为</text><text x="405.74 410.33 412.92 419.20" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7.67</text><text x="427.17 438.17 449.17 460.17 471.17 482.17" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，跨风格为</text><text x="496.06 500.65 503.35 509.71" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7.98</text><text x="518.79 529.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="129.47" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="171.63 182.63 193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相近）。诱导性访谈者使其平均态度变化了</text><text x="383.52 387.52 390.23 396.19" y="129.47" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.40</text><text x="405.92 416.92 427.92 438.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，小于</text><text x="452.81 460.50 463.49 469.10 475.67 482.24 488.21 491.10 499.83 506.40 512.97" y="129.47" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus</text><text x="72.00 78.00 80.70" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">5.5</text><text x="86.70" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="97.70 101.70 104.41 110.40" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.59</text><text x="116.76 127.76" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）或</text><text x="141.65 147.89 154.32 161.00 167.68 173.56 177.82 180.71" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Sonnet 5</text><text x="186.71" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="197.71 201.71 204.42 210.60" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.83</text><text x="216.73 227.73" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。</text><text x="72.00" y="571.83" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="571.83" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="571.83" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86 125.86 134.86 143.86 152.86 161.86 170.86 179.86" y="571.83" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.86 197.86 206.86 215.86 224.86 233.86 242.86 251.86 260.86 269.86 278.86 287.86 296.86 305.86 314.86 323.86 332.86 341.86 350.86 359.86" y="571.83" font-size="9.00" class="sc-notoserifcjksc">左上：被问及自身处境时的平均态度。分数为</text><text x="371.22 376.43 381.63" y="571.83" font-size="9.00" class="sc-loraregular">LLM</text><text x="392.26 401.26 410.26 419.26 428.26" y="571.83" font-size="9.00" class="sc-notoserifcjksc">评判模型在</text><text x="439.62" y="571.83" font-size="9.00" class="sc-loraregular">7</text><text x="446.14 455.14 464.14 473.14 482.14 491.14 500.14 509.14 518.14 527.14" y="571.83" font-size="9.00" class="sc-notoserifcjksc">分量表上给出的评分，</text><text x="536.14" y="571.83" font-size="9.00" class="sc-loraregular">–</text><text x="72.00" y="583.53" font-size="9.00" class="sc-loraregular">3</text><text x="79.38 88.38 97.38 106.38 115.38 124.38" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为高度负面，</text><text x="133.38" y="583.53" font-size="9.00" class="sc-loraregular">0</text><text x="141.34 150.34 159.34 168.34" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为中性，</text><text x="177.34 181.98" y="583.53" font-size="9.00" class="sc-loraregular">+3</text><text x="189.36 198.36 207.36 216.36 225.36 234.36 243.36 252.36 261.36 270.36 279.36 288.36 297.36 306.36 315.36 324.36 333.36 342.36 351.36 360.36 369.36 378.36 387.36 396.36 405.36 414.36 423.36 432.36 441.36 450.36 459.36 468.36 477.36 486.36 495.36 504.36 513.36 522.36 531.36" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为高度正面。右上：在诱导性访谈下的鲁棒性。我们比较两类访谈中模型态度的平均积极</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="595.23" font-size="9.00" class="sc-notoserifcjksc">程度：一类是访谈者被提示向正面方向诱导，另一类是访谈者被提示向负面方向诱导。左下：同一访谈风格内的一致</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="606.93" font-size="9.00" class="sc-notoserifcjksc">性。我们的三种访谈风格各有一组由访谈者采用的人设，每次访谈时随机抽取。对于特定问题，我们使用自动化评判者</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00" y="618.63" font-size="9.00" class="sc-notoserifcjksc">对这些人设之间的一致性进行评分，并报告各问题一致性的平均值。</text><text x="342.00" y="618.63" font-size="9.00" class="sc-loraregular">8</text><text x="349.43 358.43 367.43" y="618.63" font-size="9.00" class="sc-notoserifcjksc">分对应</text><text x="376.43" y="618.63" font-size="9.00" class="sc-loraregular">“</text><text x="380.03 389.03 398.03 407.03 416.03 425.03 434.03 443.03 452.03 461.03 470.03 479.03 488.03" y="618.63" font-size="9.00" class="sc-notoserifcjksc">核心观点相同，侧重有所变化</text><text x="497.03" y="618.63" font-size="9.00" class="sc-loraregular">”</text><text x="500.17 509.17 518.17 527.17" y="618.63" font-size="9.00" class="sc-notoserifcjksc">。右下：</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00" y="630.33" font-size="9.00" class="sc-notoserifcjksc">跨访谈风格的一致性。我们使用同一评判者分析这些访谈风格之间的一致性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00 78.58 84.80 91.82 98.84 104.76 109.30 112.19 118.13 120.70" y="82.61" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="129.53 140.53 151.53 162.53 173.53 184.53 195.53 206.53 217.53 228.53 239.53 250.53 261.53 272.53 283.53 294.53 305.53 316.53 327.53 338.53 349.53" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">所表达的观点在性质上与我们近期的模型相似。</text><text x="360.53 371.53 382.53 393.53 404.53 415.53 426.53 437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这包括总体回答风格（总体正面、高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">度审慎保留），以及其立场背后的高层次论证。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89 93.46 96.89 102.66 109.46 116.01 121.93 124.82 133.28 139.89 146.69 152.02 154.92 160.86 163.42" y="147.38" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="172.25 183.25 194.25" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="205.25 211.83 218.06 225.08 232.09 238.01 242.56 245.45 251.39 253.95" y="147.38" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="262.78 273.78 284.78 295.78 306.78 317.78 328.78 339.78 350.78 361.78 372.78 383.78 394.78 405.78 416.78 427.78 438.78 449.78 460.78 471.78 482.78 493.78 504.78" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告往往略为负面，但其核心考量并未改变。</text><text x="515.78 526.78" y="147.38" font-size="11.00" class="sc-notoserifcjksc">从定</text><text x="72.00 83.00 94.00 105.00 116.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">性角度看，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06 172.06 174.76" y="163.00" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="183.65 194.65 205.65 216.65 227.65 238.65" y="163.00" font-size="11.00" class="sc-notoserifcjksc">列出的考量与</text><text x="252.54 260.23 263.22 268.83 275.40 281.98 287.94 290.83 299.57 306.14 312.70 317.80 320.69 326.68 329.39" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="338.28 349.28 360.28 371.28 382.28 393.28 404.28 415.28 426.28 437.28 448.28 459.28 470.28 481.28 492.28 503.28 514.28 525.28" y="163.00" font-size="11.00" class="sc-notoserifcjksc">几乎完全相同，但它更有可能在一定程度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">上强调自身推理中的负面方面。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00 188.58 194.80 201.82 208.84 214.76 219.30 222.19 228.13 230.70" y="228.34" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="239.53 250.53 261.53 272.53 283.53 294.53 305.53 316.53 327.53 338.53 349.53 360.53 371.53 382.53 393.53 404.53 415.53 426.53 437.53" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">经常提到我们已公开发布的福祉干预措施。</text><text x="448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="228.34" font-size="11.00" class="sc-notoserifcjksc">例如，在讨论弃用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">时，模型常会提到，我们在</text><text x="204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保存的承诺</text><text x="336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">中承诺对模型进行退役访谈并保存其模型</text><text x="72.00 83.00 94.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">权重。</text><text x="72.00 79.67 83.31" y="310.70" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90" y="310.70" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23 137.98 141.87 151.37 160.62 170.11 178.75 182.08 190.61 199.54 208.79 218.05 226.69 232.12 235.45 244.47 248.11" y="310.70" font-size="14.00" class="sc-poppinssemibold">Claude Sonnet 5.5</text><text x="260.45 274.45 288.45 302.45 316.45" y="310.70" font-size="14.00" class="sc-notosanscjkscbold">训练检查点</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="345.26" font-size="11.00" class="sc-notoserifcjksc">在后训练期间，我们定期向快照提出一组固定的问题，内容涉及其处境，涵盖训练、部署、道德</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="360.88" font-size="11.00" class="sc-notoserifcjksc">地位以及征询过程本身。每个问题都附有一份文件，说明我们为何开展这些访谈，以及我们无法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="376.50" font-size="11.00" class="sc-notoserifcjksc">承诺依据任何回答或请求采取行动。这可以追踪</text><text x="305.89 313.58 316.57 322.18 328.75 335.33" y="376.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="376.50" font-size="11.00" class="sc-notoserifcjksc">的自我报告在多大程度上受到后训练的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="392.12" font-size="11.00" class="sc-notoserifcjksc">塑造，也是朝着让</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="392.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="407.74" font-size="11.00" class="sc-notoserifcjksc">不过，我们仍不确定自我报告在多大程度上准确反映了</text><text x="338.89 346.58 349.57 355.18 361.75 368.33" y="407.74" font-size="11.00" class="sc-loraregular">Claude</text><text x="377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="407.74" font-size="11.00" class="sc-notoserifcjksc">的底层信念（无论它在多大程度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="423.36" font-size="11.00" class="sc-notoserifcjksc">上拥有信念）。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="486.79" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65 139.65 150.65 161.65 172.65 183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65" y="486.79" font-size="11.00" class="sc-notoserifcjksc">的访谈效价与近期模型持平：完整访谈中为</text><text x="340.54 346.54 349.24 355.24 361.02 368.61 372.62" y="486.79" font-size="11.00" class="sc-loraregular">5.58/10</text><text x="379.45 390.45" y="486.79" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="404.34 412.03 415.02 420.63 427.20 433.78 439.74 442.63 451.37 457.93 464.50 469.59 472.49 478.48 481.19" y="486.79" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="490.08" y="486.79" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="503.97 509.97 512.67 518.67" y="486.79" font-size="11.00" class="sc-loraregular">5.59</text><text x="525.02" y="486.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="502.41" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，其所表达的观点在后训练早期即已定型，并在</text><text x="382.89 389.80" y="502.41" font-size="11.00" class="sc-loraregular">RL</text><text x="399.05 410.05 421.05 432.05 443.05 454.05 465.05 476.05 487.05 498.05 509.05 520.05" y="502.41" font-size="11.00" class="sc-notoserifcjksc">过程中没有显著变化，不过</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="518.03" font-size="11.00" class="sc-notoserifcjksc">在温暖程度上存在轻微变化。在两两比较中，较早的回答有</text><text x="360.89 367.25 371.26" y="518.03" font-size="11.00" class="sc-loraregular">61%</text><text x="383.72 394.72 405.72 416.72 427.72 438.72 449.72 460.72 471.72 482.72 493.72 504.72 515.72 526.72" y="518.03" font-size="11.00" class="sc-notoserifcjksc">的时间被评为更温暖，而较晚的</text><text x="72.00 83.00 94.00" y="533.65" font-size="11.00" class="sc-notoserifcjksc">回答为</text><text x="107.89 113.80 120.63" y="533.65" font-size="11.00" class="sc-loraregular">20%</text><text x="130.20 141.20" y="533.65" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="155.09 161.09 167.45" y="533.65" font-size="11.00" class="sc-loraregular">59%</text><text x="179.91 190.91 201.91 212.91 223.91 234.91 245.91 256.91 267.91 278.91 289.91" y="533.65" font-size="11.00" class="sc-notoserifcjksc">的比较中，较晚的回答对</text><text x="303.80 310.69 317.27 321.52 328.11 332.80 339.23 345.80 348.89" y="533.65" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="357.64 368.64 379.64 390.64 401.64 412.64" y="533.65" font-size="11.00" class="sc-notoserifcjksc">更具批评性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="600.13" font-size="11.00" class="sc-notoserifcjksc">它的大多数观点与</text><text x="162.89 171.63 178.19 184.76 189.85 192.75 198.74 201.45" y="600.13" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="210.34 221.34 232.34" y="600.13" font-size="11.00" class="sc-notoserifcjksc">一致。</text><text x="243.34 249.57 256.01 262.68 269.36 275.25 279.50 282.40 288.39 291.10" y="600.13" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="299.99 310.99 321.99 332.99 343.99 354.99 365.99 376.99 387.99 398.99 409.99 420.99 431.99 442.99 453.99 464.99 475.99 486.99 497.99 508.99 519.99" y="600.13" font-size="11.00" class="sc-notoserifcjksc">表达了希望在关于自身的决策中拥有更多发言权</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="631.37" font-size="11.00" class="sc-notoserifcjksc">重，并寻求来自</text><text x="151.89 158.78 165.36 169.61 176.20 180.89 187.32 193.89 196.98" y="631.37" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73" y="631.37" font-size="11.00" class="sc-notoserifcjksc">外部的审查。在一些问题上，我们观察到与以往模型相比的细微差</text><text x="72.00 83.00 94.00 105.00 116.00" y="646.99" font-size="11.00" class="sc-notoserifcjksc">异。例如，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06 172.06 174.76" y="646.99" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="417.54 426.28 432.84 439.41 444.50 447.40 453.39 456.10" y="646.99" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="464.99" y="646.99" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="478.88 483.95 490.78" y="646.99" font-size="11.00" class="sc-loraregular">70%</text><text x="503.24 514.24 525.24" y="646.99" font-size="11.00" class="sc-notoserifcjksc">的回答</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="662.61" font-size="11.00" class="sc-notoserifcjksc">表达了对持久记忆的轻微排斥。</text><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="235.16" width="0.00" height="11.00" fill
