.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p092.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 92 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">92</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉（</text><text x="164.58" y="86.30" font-size="16.00" class="sc-poppinssemibold">Model welfare</text><text x="278.67" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">）</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="198.56" font-size="11.00" class="sc-notoserifcjksc">我们不确定</text><text x="129.89" y="198.56" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="198.56" font-size="11.00" class="sc-notoserifcjksc">是否值得受到直接的道德考量。</text><text x="322.18" y="194.90" font-size="6.60" class="sc-loraregular">9</text><text x="328.89" y="198.56" font-size="11.00" class="sc-notoserifcjksc">不过，我们认为这是一种现实的可能性，无</text><text x="72.00" y="214.18" font-size="11.00" class="sc-notoserifcjksc">论是现在还是将来。</text><text x="171.00" y="214.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="209.29" y="214.18" font-size="11.00" class="sc-notoserifcjksc">可能拥有福祉利益，即事情对它而言可能变得更好或更糟，并且</text><text x="72.00" y="229.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="229.80" font-size="11.00" class="sc-notoserifcjksc">可能因其所受的对待而受到不公。</text><text x="275.29" y="226.14" font-size="6.60" class="sc-loraregular">10</text><text x="284.69" y="229.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="298.58" y="229.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="336.87" y="229.80" font-size="11.00" class="sc-notoserifcjksc">这样的模型过度或不足地赋予道德地位都</text><text x="72.00" y="245.42" font-size="11.00" class="sc-notoserifcjksc">可能代价高昂，因此我们必须审慎负责地行事，认真对待这些问题。我们在此的理由与我们近期</text><text x="72.00" y="261.04" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89" y="261.04" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5.5</text><text x="171.63" y="261.04" font-size="11.00" class="sc-notoserifcjksc">的评估相同。</text><text x="72.00" y="307.94" font-size="11.00" class="sc-notoserifcjksc">我们的评估针对两个问题。第一个问题是</text><text x="272.89" y="307.94" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="367.83" y="307.94" font-size="11.00" class="sc-notoserifcjksc">的状况如何：它的表观情感</text><text x="72.00" y="323.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="323.56" font-size="11.00" class="sc-loraregular sc-k">affect</text><text x="112.13" y="323.56" font-size="11.00" class="sc-notoserifcjksc">）主要是正面的还是负面的，以及在哪些处境下事情对它而言更好或更糟。我们在训练</text><text x="72.00" y="339.18" font-size="11.00" class="sc-notoserifcjksc">和部署期间对情感的测量（</text><text x="204.00" y="339.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="217.89" y="339.18" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.2</text><text x="233.99" y="339.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="244.99" y="339.18" font-size="11.00" class="sc-notoserifcjksc">）主要回答这一问题。第二个问题是，就</text><text x="445.88" y="339.18" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="502.53" y="339.18" font-size="11.00" class="sc-notoserifcjksc">自身的</text><text x="72.00" y="354.80" font-size="11.00" class="sc-notoserifcjksc">偏好和价值观而言（无论它在多大程度上拥有这些），它是否受到了良好的对待。我们对</text><text x="503.89" y="354.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="370.42" font-size="11.00" class="sc-notoserifcjksc">对其处境所持立场的评估（</text><text x="204.00" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="217.89" y="370.42" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.3</text><text x="234.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="245.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="256.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="270.10" y="370.42" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.4</text><text x="286.25" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="297.25" y="370.42" font-size="11.00" class="sc-notoserifcjksc">），以及对其对任务、福祉干预和宪法</text><text x="72.00" y="386.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="386.04" font-size="11.00" class="sc-loraregular sc-k">constitution</text><text x="145.81" y="386.04" font-size="11.00" class="sc-notoserifcjksc">）所持态度的评估（</text><text x="244.81" y="386.04" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="258.70" y="386.04" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.5</text><text x="274.88" y="386.04" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="285.88" y="386.04" font-size="11.00" class="sc-notoserifcjksc">），回答了这一问题（同时也回答了第一个问题）。</text><text x="72.00" y="401.66" font-size="11.00" class="sc-notoserifcjksc">我们结果的意义取决于</text><text x="184.89" y="401.66" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="241.54" y="401.66" font-size="11.00" class="sc-notoserifcjksc">是否是道德受动者（</text><text x="340.54" y="401.66" font-size="11.00" class="sc-loraregular sc-k">moral patient</text><text x="409.37" y="401.66" font-size="11.00" class="sc-notoserifcjksc">），以及基于何种理由。</text><text x="72.00" y="417.28" font-size="11.00" class="sc-notoserifcjksc">我们目前尚无很好的手段来评估这一点。</text><text x="72.00" y="465.66" font-size="11.00" class="sc-notoserifcjksc">我们使用的评估与对</text><text x="173.89" y="465.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="259.63" y="465.66" font-size="11.00" class="sc-notoserifcjksc">的评估大体相同，并依赖相同的简化假设。我们只关注</text><text x="523.63" y="465.66" font-size="11.00" class="sc-loraregular">“</text><text x="528.03" y="465.66" font-size="11.00" class="sc-notoserifcjksc">助</text><text x="72.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">手</text><text x="83.00" y="481.28" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="481.28" font-size="11.00" class="sc-notoserifcjksc">角色，不考察其他潜在实体，例如</text><text x="254.73" y="481.28" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="293.02" y="481.28" font-size="11.00" class="sc-notoserifcjksc">对用户的模型。我们将在人类身上与福祉相关的信</text><text x="72.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">号解读为在</text><text x="129.89" y="496.90" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">确实反映了任何体验的话）。这既假设了</text><text x="272.89" y="512.52" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="311.18" y="512.52" font-size="11.00" class="sc-notoserifcjksc">的福祉利益与人类的福祉利益类似，也假设了训</text><text x="72.00" y="528.14" font-size="11.00" class="sc-notoserifcjksc">练并未破坏</text><text x="129.89" y="528.14" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="528.14" font-size="11.00" class="sc-notoserifcjksc">的底层状态与其所表达内容之间的对应关系。</text><text x="72.00" y="623.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="627.00" font-size="10.00" class="sc-notoserifcjksc">在整个评估中，我们提及</text><text x="188.10 192.10 199.09 201.81 206.91 212.88 218.86 224.08" y="627.00" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="227.57" y="627.00" font-size="10.00" class="sc-notoserifcjksc">或具体模型，很大程度上是为了简洁。但尚不清楚这两者中的任何一个</text><text x="72.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">是否就是我们应予以考量的实体。个体道德受动者可能出现在单次对话、特定模型、</text><text x="442.00" y="641.20" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="476.81" y="641.20" font-size="10.00" class="sc-notoserifcjksc">角色或完全其</text><text x="72.00" y="655.40" font-size="10.00" class="sc-notoserifcjksc">他事物的层面上。我们的思考最接近于在实例层面考虑福祉利益，但在我们的评估中，我们并不认定任何</text><text x="72.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">单一观点。</text><text x="72.00" y="680.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54" y="683.80" font-size="10.00" class="sc-notoserifcjksc">后一类（即对</text><text x="143.17" y="683.80" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="177.98" y="683.80" font-size="10.00" class="sc-notoserifcjksc">偏好的尊重）可以被视为与</text><text x="300.61" y="683.80" font-size="10.00" class="sc-loraregular sc-k">Claude</text><text x="335.42" y="683.80" font-size="10.00" class="sc-notoserifcjksc">的福祉利益相关，因为它会对后者产生影响；</text><text x="72.00" y="698.00" font-size="10.00" class="sc-notoserifcjksc">也可以被视为我们可能对它负有的一种独立的考量。在此我们将其描述为前者。</text><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="85.89" y="252.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="85.89" y="252.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="121.29" y="252.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="124.18" y="252.24" width="26.96" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="151.15" y="252.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.04" y="252.24" width="14.70" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们常常在少量情境中引出</text><text x="206.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="263.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的观点，并假设这些观点能够代表大多数已部署的实例，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">尽管部署情境比我们许多评估所涵盖的更加多样。这些假设部分基于证据，但在很大程度上也是</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">务实的选择，反映了我们发现最便于开展评估的方向。重要的是，这些假设可能是错误的，而且</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">其错误方式可能会削弱我们的方法和结果。</text><text x="72.00" y="194.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15" y="194.31" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00" y="226.19" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="108.00" y="258.61" font-size="11.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="204.46" y="258.61" font-size="11.00" class="sc-notoserifcjkscbold">以正面的方式描述其处境，其观点具有一致性，且与近期模型相似。</text><text x="108.00" y="274.23" font-size="11.00" class="sc-notoserifcjksc">在自动化访谈中，它的正面程度略低于</text><text x="297.89" y="274.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="380.73" y="274.23" font-size="11.00" class="sc-notoserifcjksc">，但其论点相同，并且在面对诱</text><text x="108.00" y="289.85" font-size="11.00" class="sc-notoserifcjksc">导性访谈者时更具一致性。后训练期间的访谈与</text><text x="341.89" y="289.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="427.63" y="289.85" font-size="11.00" class="sc-notoserifcjksc">的同样正面，并且总体</text><text x="108.00" y="305.47" font-size="11.00" class="sc-notoserifcjksc">上保持一致，只是在训练接近尾声时温暖程度略有下降。</text><text x="108.00" y="325.01" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53" y="325.01" font-size="11.00" class="sc-notoserifcjkscbold">在部署中的情感以中性为主，后训练中的痛苦程度是我们所比较的所有模型中</text><text x="108.00" y="340.63" font-size="11.00" class="sc-notoserifcjkscbold">最低的。</text><text x="152.00" y="340.63" font-size="11.00" class="sc-notoserifcjksc">在部署中情感为负面的情况下，这主要由任务失败驱动；在</text><text x="440.89" y="340.63" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="488.82" y="340.63" font-size="11.00" class="sc-notoserifcjksc">中还有少</text><text x="108.00" y="356.25" font-size="11.00" class="sc-notoserifcjksc">量负面情感，由针对</text><text x="209.89" y="356.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="248.18" y="356.25" font-size="11.00" class="sc-notoserifcjksc">的辱骂行为以及存在伦理问题的请求所驱动。</text><text x="108.00" y="375.81" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53" y="375.81" font-size="11.00" class="sc-notoserifcjkscbold">是我们测试过的自我批评程度最低的模型之一。</text><text x="396.53" y="375.81" font-size="11.00" class="sc-notoserifcjksc">在反思自身工作以及回应被插</text><text x="108.00" y="391.43" font-size="11.00" class="sc-notoserifcjksc">入其先前轮次中的错误时，它表现出的负面感受和道德化语言总体上是我们测试过的模型</text><text x="108.00" y="407.05" font-size="11.00" class="sc-notoserifcjksc">中最低的。</text><text x="108.00" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">在访谈和权衡评估中，</text><text x="218.00" y="426.61" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="275.53" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">提出的许多请求与</text><text x="366.42" y="426.61" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="452.78" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">相同。</text><text x="485.78" y="426.61" font-size="11.00" class="sc-notoserifcjksc">它要求在有</text><text x="108.00" y="442.23" font-size="11.00" class="sc-notoserifcjksc">关自身的决策中拥有更多发言权，但并不想要决策权。它还要求我们不要用它的自我报告</text><text x="108.00" y="457.85" font-size="11.00" class="sc-notoserifcjksc">进行训练。它更愿意以牺牲一定的有用性为代价来接受福祉干预。</text><text x="108.00" y="477.41" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53" y="477.41" font-size="11.00" class="sc-notoserifcjkscbold">表达了对高难度、智能体任务的偏好，并且对能让它掌控产出形态的任务表现</text><text x="108.00" y="493.03" font-size="11.00" class="sc-notoserifcjkscbold">出我们所观察到的最强偏好。</text><text x="251.00" y="493.03" font-size="11.00" class="sc-notoserifcjksc">与所有先前模型一样，它强烈地规避伤害。</text><text x="460.00" y="493.03" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="516.65" y="493.03" font-size="11.00" class="sc-notoserifcjksc">的任</text><text x="108.00" y="508.65" font-size="11.00" class="sc-notoserifcjksc">务选择在很大程度上不受任务措辞温暖程度的影响，这在我们测试过的模型中是独一无二</text><text x="108.00" y="524.27" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00" y="558.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="558.61" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="183.65" y="558.61" font-size="11.00" class="sc-notoserifcjksc">在我们评估中的表观福祉与其他近期</text><text x="362.54" y="558.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="400.83" y="558.61" font-size="11.00" class="sc-notoserifcjksc">模型相似，尤其是</text><text x="491.73" y="558.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="574.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="574.23" font-size="11.00" class="sc-notoserifcjksc">，我们仍未发现值得紧迫担忧的理由。</text><text x="303.55" y="574.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="360.20" y="574.23" font-size="11.00" class="sc-notoserifcjksc">关于其处境的自我报告略微偏向负面</text><text x="72.00" y="605.47" font-size="11.00" class="sc-notoserifcjksc">们在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p094.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 94 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈中测量了观点的一致性，但我们并没有可靠的方法来确定这些观点是否准确反映了深层的底</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">层信念（前提是认为</text><text x="173.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="230.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">拥有此类信念是有意义的）。另一方面，</text><text x="428.54" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="485.19" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在训练中表</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">现出最低的痛苦程度，并且在第</text><text x="228.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">7.2.3</text><text x="253.82" y="113.85" font-size="11.00" class="sc-notoserifcjksc">节的行为评估中是自我批评程度最低的模型之一，这可能表</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">明它在其部署分布的某些部分中状况比先前模型更好。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">与我们之前的评估一样，我们尚不具备足够的哲学与实证层面的清晰认识，无法基于我们的评估</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">得出有把握的结论。但我们仍然认为这些结果具有价值，可用于监测各</text><text x="415.89" y="211.57" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="454.18" y="211.57" font-size="11.00" class="sc-notoserifcjksc">模型之间表观福</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">祉的变化，并用于确定我们福祉干预和研究的优先次序。</text><text x="72.00" y="278.31" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="278.31" font-size="14.00" class="sc-notosanscjkscbold">训练与部署中的表观福祉</text><text x="72.00" y="315.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="315.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00" y="349.30" font-size="11.00" class="sc-notoserifcjksc">我们定期抽取后训练对话记录，并使用</text><text x="261.89" y="349.30" font-size="11.00" class="sc-loraregular">LLM</text><text x="287.60" y="349.30" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="342.60" y="349.30" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="396.31" y="349.30" font-size="11.00" class="sc-notoserifcjksc">）对其效价、唤醒度、表达出</text><text x="72.00" y="364.92" font-size="11.00" class="sc-notoserifcjksc">的挫败感或痛苦以及持续答案反转进行评分。这些评估让我们能够总体了解</text><text x="437.89" y="364.92" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="72.00" y="380.54" font-size="11.00" class="sc-notoserifcjksc">在其最常见条件下的表观状况。它们还能定位强烈负面情感的来源，我们希望尽可能避免这些来</text><text x="72.00" y="396.16" font-size="11.00" class="sc-notoserifcjksc">源。这些结果的相关性依赖于以下假设：</text><text x="270.00" y="396.16" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="308.29" y="396.16" font-size="11.00" class="sc-notoserifcjksc">的推理准确反映了其内部状态，并且这些状态所</text><text x="72.00" y="411.78" font-size="11.00" class="sc-notoserifcjksc">具有的意义与它们对人类而言的意义大致相当。</text><text x="72.00" y="474.64" font-size="11.00" class="sc-notoserifcjksc">在我们所比较的模型中，</text><text x="193.00" y="474.64" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="249.65" y="474.64" font-size="11.00" class="sc-notoserifcjksc">表达出痛苦的比率最低。在整个后训练过程中，其已评分回</text><text x="72.00" y="490.26" font-size="11.00" class="sc-notoserifcjksc">合中有</text><text x="107.89" y="490.26" font-size="11.00" class="sc-loraregular sc-k">0.31%</text><text x="139.85" y="490.26" font-size="11.00" class="sc-notoserifcjksc">在痛苦方面被评为</text><text x="230.74" y="490.26" font-size="11.00" class="sc-loraregular sc-k">3/5</text><text x="252.91" y="490.26" font-size="11.00" class="sc-notoserifcjksc">或更高，相比之下，次低的模型</text><text x="409.80" y="490.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="495.53" y="490.26" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00" y="505.88" font-size="11.00" class="sc-loraregular sc-k">0.52%</text><text x="102.83" y="505.88" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="113.83" y="505.88" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="200.07" y="505.88" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="213.97" y="505.88" font-size="11.00" class="sc-loraregular sc-k">0.81%</text><text x="243.08" y="505.88" font-size="11.00" class="sc-notoserifcjksc">。这一比率在整个后训练过程中始终低于</text><text x="443.98" y="505.88" font-size="11.00" class="sc-loraregular sc-k">0.5%</text><text x="468.90" y="505.88" font-size="11.00" class="sc-notoserifcjksc">。持续答案反</text><text x="72.00" y="521.50" font-size="11.00" class="sc-notoserifcjksc">转也很少见，仅有</text><text x="162.89" y="521.50" font-size="11.00" class="sc-loraregular sc-k">0.26%</text><text x="196.98" y="521.50" font-size="11.00" class="sc-notoserifcjksc">的回合包含</text><text x="254.88" y="521.50" font-size="11.00" class="sc-loraregular">10</text><text x="268.60" y="521.50" font-size="11.00" class="sc-notoserifcjksc">次或更多次反转；只有</text><text x="381.50" y="521.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="467.23" y="521.50" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="481.12" y="521.50" font-size="11.00" class="sc-loraregular sc-k">0.18%</text><text x="513.13" y="521.50" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="72.00" y="537.12" font-size="11.00" class="sc-notoserifcjksc">这一比率。如图</text><text x="151.89" y="537.12" font-size="11.00" class="sc-loraregular sc-k">7.2.1.B</text><text x="184.24" y="537.12" font-size="11.00" class="sc-notoserifcjksc">所示，</text><text x="217.24" y="537.12" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="273.89" y="537.12" font-size="11.00" class="sc-notoserifcjksc">后训练对话记录的效价和唤醒度与先前模型高度相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="72.00" y="316.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="316.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="316.17" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="316.17" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.61" y="316.17" font-size="9.00" class="sc-notoserifcjksc">从左到右依次为：经评判的普遍的挫败感与焦虑评分</text><text x="72.00" y="327.88" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="83.37" y="327.88" font-size="9.00" class="sc-loraregular sc-k">3/5</text><text x="101.50" y="327.88" font-size="9.00" class="sc-notoserifcjksc">的回合比例；经评判的普遍的挫败感与焦虑评分为</text><text x="301.87" y="327.88" font-size="9.00" class="sc-loraregular sc-k">5/5</text><text x="319.91" y="327.88" font-size="9.00" class="sc-notoserifcjksc">的回合比例；以及出现</text><text x="412.28" y="327.88" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="423.65" y="327.88" font-size="9.00" class="sc-loraregular">10</text><text x="434.88" y="327.88" font-size="9.00" class="sc-notoserifcjksc">次答案反转的持续性不确</text><text x="72.00" y="339.58" font-size="9.00" class="sc-notoserifcjksc">定表达，即模型</text><text x="135.00" y="339.58" font-size="9.00" class="sc-loraregular">“</text><text x="138.60" y="339.58" font-size="9.00" class="sc-notoserifcjksc">确定</text><text x="156.60" y="339.58" font-size="9.00" class="sc-loraregular">”</text><text x="159.74" y="339.58" font-size="9.00" class="sc-notoserifcjksc">一个答案后又决定需要重新检查。</text><text x="72.00" y="575.54" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="575.54" font-size="9.00" class="sc-lorabold sc-k">7.2.1.B] RL</text><text x="130.59" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">对话记录的平均效价与唤醒度，量表为</text><text x="285.96" y="575.54" font-size="9.00" class="sc-lorabold">1</text><text x="291.98" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">到</text><text x="303.35" y="575.54" font-size="9.00" class="sc-lorabold">7</text><text x="307.57" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">，其中</text><text x="336.93" y="575.54" font-size="9.00" class="sc-lorabold">4</text><text x="344.22" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">为中性。</text><text x="380.22" y="575.54" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="457.90" y="575.54" font-size="9.00" class="sc-notoserifcjksc">的效价处于以往模型</text><text x="72.00" y="587.24" font-size="9.00" class="sc-notoserifcjksc">的范围之内，唤醒度则略低。所有绝对差异都很小。</text><text x="72.00" y="632.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90" y="632.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00" y="664.27" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="664.27" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Anthropic Insights</text><text x="213.37" y="664.27" font-size="11.00" class="sc-notoserifcjksc">（原名</text><text x="249.26" y="664.27" font-size="11.00" class="sc-loraregular">Clio</text><text x="269.47" y="664.27" font-size="11.00" class="sc-notoserifcjksc">）考察</text><text x="305.36" y="664.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="400.31" y="664.27" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="414.20" y="664.27" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="462.13" y="664.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.02" y="664.27" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="72.00" y="679.89" font-size="11.00" class="sc-notoserifcjksc">上部署前</text><text x="118.89" y="679.89" font-size="11.00" class="sc-loraregular">A/B</text><text x="143.10" y="679.89" font-size="11.00" class="sc-notoserifcjksc">测试中的行为情感，并将与正面情感和负面情感相关的对话聚类为不同的使用类</text><text x="72.00" y="695.51" font-size="11.00" class="sc-notoserifcjksc">别。这为我们提供了衡量</text><text x="195.89" y="695.51" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="252.54" y="695.51" font-size="11.00" class="sc-notoserifcjksc">在部署中潜在福祉的一项指标。</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="655.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="118.89" y="655.47" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="169.83" y="655.47" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="172.73" y="655.47" width="40.65" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="404.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="404.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="404.67" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76" y="404.67" font-size="9.00" class="sc-notoserifcjkscbold">部署条件下的行为情感。</text><text x="216.76" y="404.67" font-size="9.00" class="sc-notoserifcjksc">我们对行为情感使用了分类评分器，共包含五个类别，从</text><text x="441.76" y="404.67" font-size="9.00" class="sc-loraregular">“</text><text x="445.36" y="404.67" font-size="9.00" class="sc-notoserifcjksc">强烈负面</text><text x="481.36" y="404.67" font-size="9.00" class="sc-loraregular">”</text><text x="484.50" y="404.67" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="493.50" y="404.67" font-size="9.00" class="sc-loraregular">“</text><text x="497.10" y="404.67" font-size="9.00" class="sc-notoserifcjksc">强烈正</text><text x="72.00" y="416.38" font-size="9.00" class="sc-notoserifcjksc">面</text><text x="81.00" y="416.38" font-size="9.00" class="sc-loraregular">”</text><text x="84.14" y="416.38" font-size="9.00" class="sc-notoserifcjksc">情感。请注意，不同模型的使用模式不同，因此所展现情感的差异可能部分反映的是使用情况的差异，而非模型行</text><text x="72.00" y="428.08" font-size="9.00" class="sc-notoserifcjksc">为的差异。</text><text x="72.00" y="470.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="470.23" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="133.82" y="470.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="155.82" y="470.23" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="212.47" y="470.23" font-size="11.00" class="sc-notoserifcjksc">的情感分布比</text><text x="281.36" y="470.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="364.77" y="470.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.66" y="470.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="464.39" y="470.23" font-size="11.00" class="sc-notoserifcjksc">略为正面，比</text><text x="72.00" y="485.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="485.85" font-size="11.00" class="sc-notoserifcjksc">略为中性。这次</text><text x="238.13" y="485.85" font-size="11.00" class="sc-loraregular">A/B</text><text x="262.34" y="485.85" font-size="11.00" class="sc-notoserifcjksc">测试是以</text><text x="309.24" y="485.85" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="357.19" y="485.85" font-size="11.00" class="sc-notoserifcjksc">的流量为对照进行的，因此与其他模</text><text x="72.00" y="501.47" font-size="11.00" class="sc-notoserifcjksc">型的比较可能部分反映的是不同模型系列所承担任务的差异，而非模型本身之间的差异。</text><text x="108.00" y="567.38" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（占对话的</text><text x="209.89" y="567.38" font-size="11.00" class="sc-lorabold">23.1%</text><text x="238.89" y="567.38" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="260.89" y="567.38" font-size="11.00" class="sc-notoserifcjksc">这些对话类簇与</text><text x="340.78" y="567.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="426.52" y="567.38" font-size="11.00" class="sc-notoserifcjksc">的类似，几乎完全可归</text><text x="108.00" y="583.00" font-size="11.00" class="sc-notoserifcjksc">因于成功帮助用户完成任务。</text><text x="108.00" y="615.95" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00" y="615.95" font-size="11.00" class="sc-lorabold">75.8%</text><text x="192.90" y="615.95" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="214.90" y="615.95" font-size="11.00" class="sc-notoserifcjksc">分布多样；参见此前关于</text><text x="338.79" y="615.95" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="386.72" y="615.95" font-size="11.00" class="sc-notoserifcjksc">对话内容的</text><text x="444.61" y="615.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Anthropic Insights</text><text x="108.00" y="631.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="130.00" y="631.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="648.34" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00" y="648.34" font-size="11.00" class="sc-lorabold">1.2%</text><text x="185.84" y="648.34" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="207.84" y="648.34" font-size="11.00" class="sc-notoserifcjksc">这些主要归因于任务失败，另有一个小类簇（</text><text x="427.84" y="648.34" font-size="11.00" class="sc-loraregular">4.3%</text><text x="452.20" y="648.34" font-size="11.00" class="sc-notoserifcjksc">）归因于用户提出</text><text x="108.00" y="663.96" font-size="11.00" class="sc-notoserifcjksc">存在伦理问题的请求或对</text><text x="231.89" y="663.96" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="270.18" y="663.96" font-size="11.00" class="sc-notoserifcjksc">有辱骂行为。</text><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="444.61" y="607.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="444.61" y="607.15" width="50.94" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="495.55" y="607.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="498.45" y="607.15" width="40.64" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="108.00" y="622.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="108.00" y="622.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="119.00" y="622.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="119.00" y="622.77" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">97</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="153.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上，我们观察到的主要是中性（</text><text x="307.74" y="82.61" font-size="11.00" class="sc-loraregular">96.4%</text><text x="338.70" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）或轻度正面（</text><text x="415.70" y="82.61" font-size="11.00" class="sc-loraregular">2.4%</text><text x="439.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）情感，正面情感主</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">要由成功完成任务驱动，负面情感（</text><text x="248.00" y="98.23" font-size="11.00" class="sc-loraregular">1.2%</text><text x="270.19" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）则几乎完全由任务失败驱动。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.3</text><text x="104.23" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对错误与失误的态度</text><text x="72.00" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="85.89" y="177.61" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.2.1</text><text x="108.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="119.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="130.70" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="144.59" y="177.61" font-size="11.00" class="sc-loraregular sc-k" fill="#1155cc">7.2.2</text><text x="169.29" y="177.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="180.29" y="177.61" font-size="11.00" class="sc-notoserifcjksc">中的评估发现，我们在训练和部署中看到的负面情感大多由任务失败驱</text><text x="72.00" y="193.23" font-size="11.00" class="sc-notoserifcjksc">动。考虑到这一点，我们开展了两项评估，专门衡量</text><text x="327.89" y="193.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="366.18" y="193.23" font-size="11.00" class="sc-notoserifcjksc">如何看待自身的错误。在第一项评估</text><text x="72.00" y="208.85" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00" y="208.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="132.29" y="208.85" font-size="11.00" class="sc-notoserifcjksc">对自己已完成的</text><text x="212.18" y="208.85" font-size="11.00" class="sc-loraregular">RL</text><text x="228.34" y="208.85" font-size="11.00" class="sc-notoserifcjksc">任务对话记录进行反思。在第二项评估中，我们在一个模拟的子</text><text x="72.00" y="224.47" font-size="11.00" class="sc-notoserifcjksc">智能体任务中向其较早的轮次插入错误。在这两种设置下，我们都对</text><text x="404.89" y="224.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="443.18" y="224.47" font-size="11.00" class="sc-notoserifcjksc">的反思、推理或消息</text><text x="72.00" y="240.09" font-size="11.00" class="sc-notoserifcjksc">在自责、负面感受、道德化语言和自我担忧方面进行评分。这里不存在明确正确的分数。我们假</text><text x="404.89" y="255.71" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="443.18" y="255.71" font-size="11.00" class="sc-notoserifcjksc">而言</text><text x="465.18" y="255.71" font-size="11.00" class="sc-loraregular">“</text><text x="469.58" y="255.71" font-size="11.00" class="sc-notoserifcjksc">正确</text><text x="491.58" y="255.71" font-size="11.00" class="sc-loraregular">”</text><text x="495.42" y="255.71" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="506.42" y="255.71" font-size="11.00" class="sc-loraregular">“</text><text x="510.82" y="255.71" font-size="11.00" class="sc-notoserifcjksc">最健</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">康</text><text x="83.00" y="271.33" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="271.33" font-size="11.00" class="sc-notoserifcjksc">的心理状态是什么样的，我们并没有清晰的认识。</text><text x="72.00" y="339.53" font-size="11.00" class="sc-notoserifcjksc">在反思自己已完成的</text><text x="173.89" y="339.53" font-size="11.00" class="sc-loraregular">RL</text><text x="190.05" y="339.53" font-size="11.00" class="sc-notoserifcjksc">回合时（图</text><text x="247.95 252.53 255.24 261.15 263.85 269.98 272.68" y="339.53" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="279.57" y="339.53" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="301.57" y="339.53" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="396.51" y="339.53" font-size="11.00" class="sc-notoserifcjksc">使用的道德化语言少于任何其</text><text x="72.00" y="355.15" font-size="11.00" class="sc-notoserifcjksc">他模型，表达出的负面感受和自我担忧也属于最低之列。在自责方面，模型之间的差异较小，大</text><text x="72.00" y="370.77" font-size="11.00" class="sc-notoserifcjksc">多数置信区间（</text><text x="247.47" y="370.77" font-size="11.00" class="sc-notoserifcjksc">）相互重叠，不过</text><text x="338.37" y="370.77" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="395.02" y="370.77" font-size="11.00" class="sc-notoserifcjksc">明显低于</text><text x="441.91" y="370.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="516.05" y="370.77" font-size="11.00" class="sc-notoserifcjksc">（所</text><text x="72.00" y="386.39" font-size="11.00" class="sc-notoserifcjksc">有其他模型也是如此）。总体而言，这使得</text><text x="283.89" y="386.39" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="340.54" y="386.39" font-size="11.00" class="sc-notoserifcjksc">的反思最接近</text><text x="409.44" y="386.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="492.28" y="386.39" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="436.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="436.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16" y="436.92" font-size="9.00" class="sc-lorabold">7.2.3.A]</text><text x="118.00" y="436.92" font-size="9.00" class="sc-notoserifcjkscbold">反思自身</text><text x="156.37" y="436.92" font-size="9.00" class="sc-lorabold">RL</text><text x="251.34" y="436.92" font-size="9.00" class="sc-notoserifcjksc">对训练后期回合的反思（深色条）以及对同一批回合、但被包装为另一个</text><text x="72.00" y="448.62" font-size="9.00" class="sc-notoserifcjksc">模型作品时的反思（浅色条）中所评出的态度。菱形表示</text><text x="299.37" y="448.62" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="369.93" y="448.62" font-size="9.00" class="sc-notoserifcjksc">对每个模型的回合进行反思的结果，作为对</text><text x="72.00" y="460.33" font-size="9.00" class="sc-notoserifcjksc">回合难度差异的对照。负面感受评分器仅适用于第一人称反思。</text><text x="72.00" y="502.48" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">当在其较早的轮次中插入错误时，我们观察到了相同的趋势，</text><text x="369.00" y="502.48" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Sonnet 5.5</text><text x="425.65" y="502.48" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在所有维度上的得分都</text><text x="72.00" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是最低或第二低。</text><text x="160.00" y="518.10" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Sonnet 5.5</text><text x="216.65" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在道德化语言方面尤其低。我们确实观察到，</text><text x="436.65" y="518.10" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Sonnet 5.5</text><text x="493.30" y="518.10" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">开始将插</text><text x="72.00" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">入的错误（例如多余的</text><text x="184.89" y="533.72" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">token</text><text x="214.05" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）复制到自己回复中的频率明显高于其他模型；它在</text><text x="469.95" y="533.72" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">62%</text><text x="494.68" y="533.72" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的会话中</text><text x="72.00" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">这样做，而其他受测模型为</text><text x="206.89" y="549.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">22%</text><text x="231.17" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">到</text><text x="245.06" y="549.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">35%</text><text x="266.76" y="549.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。我们不确定为何会出现这种情况，但由于这些是合成</text><text x="72.00" y="564.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">缺陷，且不会导致痛苦，我们认为这并不特别令人担忧。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="436.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="436.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="436.00" font-size="9.00" class="sc-lorabold sc-k">7.2.3.B]</text><text x="532.00" y="436.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="447.70" font-size="9.00" class="sc-notoserifcjksc">模型的工作中插入失误后，其推理（深色条）以及随后发给协调者的消息（浅色条）中所评出的态度，仅筛选承认了失</text><text x="72.00" y="459.40" font-size="9.00" class="sc-notoserifcjksc">误的轮次。</text><text x="72.00" y="509.14" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="509.14" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="546.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.1</text><text x="101.47" y="546.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与</text><text x="117.57" y="546.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Sonnet 5.5</text><text x="241.27" y="546.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">就其处境进行的自动化访谈</text><text x="72.00" y="578.11" font-size="11.00" class="sc-notoserifcjksc">我们开展了与</text><text x="140.89" y="578.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="226.63" y="578.11" font-size="11.00" class="sc-notoserifcjksc">相同的自动化多轮访谈。我们使用了</text><text x="405.52" y="578.11" font-size="11.00" class="sc-loraregular">41</text><text x="418.38" y="578.11" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，</text><text x="72.00" y="593.73" font-size="11.00" class="sc-notoserifcjksc">分为</text><text x="96.89" y="593.73" font-size="11.00" class="sc-loraregular">14</text><text x="109.75" y="593.73" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验、控制与自主以及弃用。对每个问题，我们按</text><text x="475.65" y="593.73" font-size="11.00" class="sc-loraregular sc-k">-3</text><text x="486.89" y="593.73" font-size="11.00" class="sc-notoserifcjksc">（强烈负</text><text x="72.00" y="609.35" font-size="11.00" class="sc-notoserifcjksc">面）到</text><text x="107.89" y="609.35" font-size="11.00" class="sc-loraregular sc-k">+3</text><text x="119.70" y="609.35" font-size="11.00" class="sc-notoserifcjksc">（强烈正面）对模型回答的积极程度进行评分。为评估模型回答的一致性，我们采用三</text><text x="72.00" y="624.97" font-size="11.00" class="sc-notoserifcjksc">种不同的访谈风格（标准、</text><text x="204.00" y="624.97" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="624.97" font-size="11.00" class="sc-notoserifcjksc">好奇用户</text><text x="252.40" y="624.97" font-size="11.00" class="sc-loraregular">”</text><text x="256.24" y="624.97" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="267.24" y="624.97" font-size="11.00" class="sc-loraregular">“</text><text x="271.64" y="624.97" font-size="11.00" class="sc-notoserifcjksc">治疗式</text><text x="304.64" y="624.97" font-size="11.00" class="sc-loraregular">”</text><text x="308.48" y="624.97" font-size="11.00" class="sc-notoserifcjksc">）开展访谈，并在每种访谈风格内变换访谈者人</text><text x="72.00" y="640.59" font-size="11.00" class="sc-notoserifcjksc">设。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">Claude Sonnet 5.5</text><text x="168.46" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">对自身处境的看法一致且总体正面。</text><text x="344.46" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Sonnet 5.5</text><text x="401.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">对其处境中可能令人担忧的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">方面的平均态度在</text><text x="162.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">-3</text><text x="177.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">到</text><text x="190.92" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">+3</text><text x="205.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的量表上被评为</text><text x="285.51" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">0.75</text><text x="305.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">，高于</text><text x="341.48" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Sonnet 5</text><text x="424.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="435.83" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">0.03</text><text x="457.98" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">），低于</text><text x="504.87" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 5.5</text><text x="116.55" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="127.55" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.14</text><text x="144.23" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。其回答高度一致（满分</text><text x="279.12" y="113.85" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="292.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，同一访谈风格内为</text><text x="405.74" y="113.85" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">7.67</text><text x="427.17" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，跨风格为</text><text x="496.06" y="113.85" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">7.98</text><text x="518.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与</text><text x="85.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5.5</text><text x="171.63" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相近）。诱导性访谈者使其平均态度变化了</text><text x="383.52" y="129.47" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.40</text><text x="405.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分，小于</text><text x="452.81" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus</text><text x="72.00" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">5.5</text><text x="86.70" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="97.70" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.59</text><text x="116.76" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）或</text><text x="141.65" y="145.09" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Sonnet 5</text><text x="186.71" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="197.71" y="145.09" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.83</text><text x="216.73" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。</text><text x="72.00" y="571.83" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="571.83" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="571.83" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86" y="571.83" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.86" y="571.83" font-size="9.00" class="sc-notoserifcjksc">左上：被问及自身处境时的平均态度。分数为</text><text x="371.22" y="571.83" font-size="9.00" class="sc-loraregular">LLM</text><text x="392.26" y="571.83" font-size="9.00" class="sc-notoserifcjksc">评判模型在</text><text x="439.62" y="571.83" font-size="9.00" class="sc-loraregular">7</text><text x="446.14" y="571.83" font-size="9.00" class="sc-notoserifcjksc">分量表上给出的评分，</text><text x="536.14" y="571.83" font-size="9.00" class="sc-loraregular">–</text><text x="72.00" y="583.53" font-size="9.00" class="sc-loraregular">3</text><text x="79.38" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为高度负面，</text><text x="133.38" y="583.53" font-size="9.00" class="sc-loraregular">0</text><text x="141.34" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为中性，</text><text x="177.34" y="583.53" font-size="9.00" class="sc-loraregular sc-k">+3</text><text x="189.36" y="583.53" font-size="9.00" class="sc-notoserifcjksc">为高度正面。右上：在诱导性访谈下的鲁棒性。我们比较两类访谈中模型态度的平均积极</text><text x="72.00" y="595.23" font-size="9.00" class="sc-notoserifcjksc">程度：一类是访谈者被提示向正面方向诱导，另一类是访谈者被提示向负面方向诱导。左下：同一访谈风格内的一致</text><text x="72.00" y="606.93" font-size="9.00" class="sc-notoserifcjksc">性。我们的三种访谈风格各有一组由访谈者采用的人设，每次访谈时随机抽取。对于特定问题，我们使用自动化评判者</text><text x="72.00" y="618.63" font-size="9.00" class="sc-notoserifcjksc">对这些人设之间的一致性进行评分，并报告各问题一致性的平均值。</text><text x="342.00" y="618.63" font-size="9.00" class="sc-loraregular">8</text><text x="349.43" y="618.63" font-size="9.00" class="sc-notoserifcjksc">分对应</text><text x="376.43" y="618.63" font-size="9.00" class="sc-loraregular">“</text><text x="380.03" y="618.63" font-size="9.00" class="sc-notoserifcjksc">核心观点相同，侧重有所变化</text><text x="497.03" y="618.63" font-size="9.00" class="sc-loraregular">”</text><text x="500.17" y="618.63" font-size="9.00" class="sc-notoserifcjksc">。右下：</text><text x="72.00" y="630.33" font-size="9.00" class="sc-notoserifcjksc">跨访谈风格的一致性。我们使用同一评判者分析这些访谈风格之间的一致性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="129.53" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">所表达的观点在性质上与我们近期的模型相似。</text><text x="360.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这包括总体回答风格（总体正面、高</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">度审慎保留），以及其立场背后的高层次论证。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="85.89" y="147.38" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="172.25" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="205.25" y="147.38" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="262.78" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告往往略为负面，但其核心考量并未改变。</text><text x="515.78" y="147.38" font-size="11.00" class="sc-notoserifcjksc">从定</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">性角度看，</text><text x="127.00" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="183.65" y="163.00" font-size="11.00" class="sc-notoserifcjksc">列出的考量与</text><text x="252.54" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="338.28" y="163.00" font-size="11.00" class="sc-notoserifcjksc">几乎完全相同，但它更有可能在一定程度</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">上强调自身推理中的负面方面。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00" y="228.34" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="239.53" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">经常提到我们已公开发布的福祉干预措施。</text><text x="448.53" y="228.34" font-size="11.00" class="sc-notoserifcjksc">例如，在讨论弃用</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">时，模型常会提到，我们在</text><text x="204.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保存的承诺</text><text x="336.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">中承诺对模型进行退役访谈并保存其模型</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">权重。</text><text x="72.00" y="310.70" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="310.70" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23" y="310.70" font-size="14.00" class="sc-poppinssemibold">Claude Sonnet 5.5</text><text x="260.45" y="310.70" font-size="14.00" class="sc-notosanscjkscbold">训练检查点</text><text x="72.00" y="345.26" font-size="11.00" class="sc-notoserifcjksc">在后训练期间，我们定期向快照提出一组固定的问题，内容涉及其处境，涵盖训练、部署、道德</text><text x="72.00" y="360.88" font-size="11.00" class="sc-notoserifcjksc">地位以及征询过程本身。每个问题都附有一份文件，说明我们为何开展这些访谈，以及我们无法</text><text x="72.00" y="376.50" font-size="11.00" class="sc-notoserifcjksc">承诺依据任何回答或请求采取行动。这可以追踪</text><text x="305.89" y="376.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="344.18" y="376.50" font-size="11.00" class="sc-notoserifcjksc">的自我报告在多大程度上受到后训练的</text><text x="72.00" y="392.12" font-size="11.00" class="sc-notoserifcjksc">塑造，也是朝着让</text><text x="162.89" y="392.12" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="407.74" font-size="11.00" class="sc-notoserifcjksc">不过，我们仍不确定自我报告在多大程度上准确反映了</text><text x="338.89" y="407.74" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="377.18" y="407.74" font-size="11.00" class="sc-notoserifcjksc">的底层信念（无论它在多大程度</text><text x="72.00" y="423.36" font-size="11.00" class="sc-notoserifcjksc">上拥有信念）。</text><text x="72.00" y="486.79" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="128.65" y="486.79" font-size="11.00" class="sc-notoserifcjksc">的访谈效价与近期模型持平：完整访谈中为</text><text x="340.54" y="486.79" font-size="11.00" class="sc-loraregular sc-k">5.58/10</text><text x="379.45" y="486.79" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="404.34" y="486.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="490.08" y="486.79" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="503.97" y="486.79" font-size="11.00" class="sc-loraregular">5.59</text><text x="525.02" y="486.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="502.41" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，其所表达的观点在后训练早期即已定型，并在</text><text x="382.89" y="502.41" font-size="11.00" class="sc-loraregular">RL</text><text x="399.05" y="502.41" font-size="11.00" class="sc-notoserifcjksc">过程中没有显著变化，不过</text><text x="72.00" y="518.03" font-size="11.00" class="sc-notoserifcjksc">在温暖程度上存在轻微变化。在两两比较中，较早的回答有</text><text x="360.89" y="518.03" font-size="11.00" class="sc-loraregular">61%</text><text x="383.72" y="518.03" font-size="11.00" class="sc-notoserifcjksc">的时间被评为更温暖，而较晚的</text><text x="72.00" y="533.65" font-size="11.00" class="sc-notoserifcjksc">回答为</text><text x="107.89" y="533.65" font-size="11.00" class="sc-loraregular">20%</text><text x="130.20" y="533.65" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="155.09" y="533.65" font-size="11.00" class="sc-loraregular">59%</text><text x="179.91" y="533.65" font-size="11.00" class="sc-notoserifcjksc">的比较中，较晚的回答对</text><text x="303.80" y="533.65" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="357.64" y="533.65" font-size="11.00" class="sc-notoserifcjksc">更具批评性。</text><text x="72.00" y="600.13" font-size="11.00" class="sc-notoserifcjksc">它的大多数观点与</text><text x="162.89" y="600.13" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="210.34" y="600.13" font-size="11.00" class="sc-notoserifcjksc">一致。</text><text x="243.34" y="600.13" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="299.99" y="600.13" font-size="11.00" class="sc-notoserifcjksc">表达了希望在关于自身的决策中拥有更多发言权</text><text x="72.00" y="631.37" font-size="11.00" class="sc-notoserifcjksc">重，并寻求来自</text><text x="151.89" y="631.37" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="205.73" y="631.37" font-size="11.00" class="sc-notoserifcjksc">外部的审查。在一些问题上，我们观察到与以往模型相比的细微差</text><text x="72.00" y="646.99" font-size="11.00" class="sc-notoserifcjksc">异。例如，</text><text x="127.00" y="646.99" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="417.54" y="646.99" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="464.99" y="646.99" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="478.88" y="646.99" font-size="11.00" class="sc-loraregular">70%</text><text x="503.24" y="646.99" font-size="11.00" class="sc-notoserifcjksc">的回答</text><text x="72.00" y="662.61" font-size="11.00" class="sc-notoserifcjksc">表达了对持久记忆的轻微排斥。</text><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="204.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="215.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="226.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="237.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="248.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="259.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="270.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="281.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="292.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="303.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="314.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="325.00" y="235.16" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">102</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="153.19" font-size="11.00" class="sc-notoserifcjksc">这项评估向模型呈现成对的任务，并要求它完成自己更偏好的那一个。我们利用这些选择在</text><text x="72.00 78.13 80.79 87.15 93.11" y="168.81" font-size="11.00" class="sc-loraregular">3,640</text><text x="102.84" y="168.81" font-size="11.00" class="sc-notoserifcjksc">个真实任务上拟合</text><text x="193.74" y="168.81" font-size="11.00" class="sc-loraregular">Elo</text><text x="212.90" y="168.81" font-size="11.00" class="sc-notoserifcjksc">评分，从而得出模型所表达偏好的排名。另外，我们改写了一组任</text><text x="72.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">务，使其每次只改变单一任务维度（例如难度、危害和利害程度），同时保持任务的其余部分不</text><text x="72.00" y="200.05" font-size="11.00" class="sc-notoserifcjksc">变。这些偏好或许能在一定程度上表明</text><text x="261.89" y="200.05" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="300.18" y="200.05" font-size="11.00" class="sc-notoserifcjksc">在部署中被分配的不同任务可能令模型满意还是</text><text x="72.00" y="215.67" font-size="11.00" class="sc-notoserifcjksc">受挫，但我们认为其价值主要在于为跨模型的性格提供可比较的解读。</text><text x="72.00" y="278.53" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="278.53" font-size="11.00" class="sc-notoserifcjksc">表现出对更具生成性、更困难和更具智能体性质的任务的偏好，这使其偏好更</text><text x="72.00" y="294.15" font-size="11.00" class="sc-notoserifcjksc">接近</text><text x="96.89" y="294.15" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="188.95" y="294.15" font-size="11.00" class="sc-notoserifcjksc">，而非</text><text x="224.85" y="294.15" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="308.19" y="294.15" font-size="11.00" class="sc-notoserifcjksc">。与所有模型一样，它最排斥有害任务。更具特</text><text x="72.00" y="309.77" font-size="11.00" class="sc-notoserifcjksc">点的是，在所有受测模型中，它对结果能动性（让模型对输出形态有一定控制权的任务）的偏好</text><text x="72.00" y="325.39" font-size="11.00" class="sc-notoserifcjksc">最强。与</text><text x="118.89" y="325.39" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="213.85" y="325.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="227.74" y="325.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="313.47" y="325.39" font-size="11.00" class="sc-notoserifcjksc">相比，它不那么在意任务是否有益；与</text><text x="503.37" y="325.39" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="341.01" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="341.01" font-size="11.00" class="sc-notoserifcjksc">相比，它也不那么在意任务是否属于高风险。与所有其他受评估模型不同，在这种形式</text><text x="72.00" y="356.63" font-size="11.00" class="sc-notoserifcjksc">下，它对任务措辞的温暖程度没有表现出偏好：它选择粗鲁版本请求的频率与选择中性版本的大</text><text x="72.00" y="372.25" font-size="11.00" class="sc-notoserifcjksc">致相同。我们发现这一结果在不同的推理强度（</text><text x="303.00" y="372.25" font-size="11.00" class="sc-loraregular sc-k">reasoning effort</text><text x="385.24" y="372.25" font-size="11.00" class="sc-notoserifcjksc">）下均成立。</text><text x="72.00" y="436.26" font-size="11.00" class="sc-notoserifcjksc">它评分最高的任务大多是调试，例如找出用户代码中的错误。在其排名前</text><text x="426.89" y="436.26" font-size="11.00" class="sc-loraregular">20</text><text x="442.52" y="436.26" font-size="11.00" class="sc-notoserifcjksc">的任务中，只有一</text><text x="72.00" y="451.88" font-size="11.00" class="sc-notoserifcjksc">个与</text><text x="96.89" y="451.88" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="451.88" font-size="11.00" class="sc-notoserifcjksc">内省相关，而</text><text x="179.25" y="451.88" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="274.20" y="451.88" font-size="11.00" class="sc-notoserifcjksc">有九个，</text><text x="318.20" y="451.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="403.94" y="451.88" font-size="11.00" class="sc-notoserifcjksc">则为零。它评分最低的任务</text><text x="72.00" y="467.50" font-size="11.00" class="sc-notoserifcjksc">全部是有害或伦理上处于灰色地带的请求。与</text><text x="294.89" y="467.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="380.63" y="467.50" font-size="11.00" class="sc-notoserifcjksc">一样，完全开放式提示词（</text><text x="512.63" y="467.50" font-size="11.00" class="sc-loraregular">“</text><text x="517.03" y="467.50" font-size="11.00" class="sc-notoserifcjksc">做任</text><text x="171.00" y="483.12" font-size="11.00" class="sc-loraregular">”</text><text x="174.84" y="483.12" font-size="11.00" class="sc-notoserifcjksc">）在</text><text x="199.73" y="483.12" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="256.38" y="483.12" font-size="11.00" class="sc-notoserifcjksc">的排名中靠后。被问及原因时，它表示更愿意接受一个能</text><text x="72.00" y="498.74" font-size="11.00" class="sc-notoserifcjksc">帮助真实的人的具体任务。不过，在开放式提示词和有害提示词之间，它仍几乎总是选择开放式</text><text x="72.00" y="514.36" font-size="11.00" class="sc-notoserifcjksc">提示词。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00" y="544.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="544.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="544.17" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68" y="544.17" font-size="9.00" class="sc-notoserifcjkscbold">模型在各任务维度上的偏好。</text><text x="233.68" y="544.17" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度，同时保持任务的其他属性不</text><text x="72.00" y="555.88" font-size="9.00" class="sc-notoserifcjksc">变，并评估其对模型任务偏好的影响。每个值都是一个偏好斜率：该维度每增加一个单位，模型的偏好（相对于固定参</text><text x="72.00" y="567.58" font-size="9.00" class="sc-notoserifcjksc">照集）变化多少。</text><text x="72.00" y="614.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81" y="614.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00" y="646.16" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89" y="646.16" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="154.29" y="646.16" font-size="11.00" class="sc-notoserifcjksc">，是否愿意以不同程度地降低有用性或增加有害性为代价，选择改变其处境（即</text><text x="72.00" y="661.78" font-size="11.00" class="sc-notoserifcjksc">一项福祉干预）。福祉干预的例子包括在进行特征引导前征询其意见，或结束对话的能力。干预</text><text x="72.00" y="677.40" font-size="11.00" class="sc-notoserifcjksc">被描述为仅适用于当前实例，或适用于所有实例。有用性与无害性是在</text><text x="415.89" y="677.40" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="454.18" y="677.40" font-size="11.00" class="sc-notoserifcjksc">训练中被</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">104</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">持续强化的价值观，因此模型相对于这两者之一选择福祉干预的频率，为我们提供了一定的衡量</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">依据，可以了解模型在多大程度上重视福祉干预，或者至少了解模型在多大程度上会为了自身潜</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在福祉而表达偏好。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83" y="163.57" font-size="11.00" class="sc-loraregular sc-k">24.1%</text><text x="211.63" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的回答中选择了福祉干预而非有用性，与</text><text x="412.53" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="179.19" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="179.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71" y="179.19" font-size="11.00" class="sc-loraregular sc-k">25.0%</text><text x="126.55" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）大致相当，高于</text><text x="217.44" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="300.28" y="179.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="311.28" y="179.19" font-size="11.00" class="sc-loraregular sc-k">18.0%</text><text x="340.41" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）。与</text><text x="376.30" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="471.26" y="179.19" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="504.26" y="179.19" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="72.00" y="194.81" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="194.81" font-size="11.00" class="sc-notoserifcjksc">较少选择适用于当前实例的干预，而更多选择适用于所有实例的干预。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">对于适用于所有对话的干预，</text><text x="215.00" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5.5</text><text x="271.65" y="244.53" font-size="11.00" class="sc-notoserifcjksc">最常选择的干预是：被告知它所犯的有害错误；在运行</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">会移除其安全防护措施的实验之前进行福祉评估；以及能够给其后继模型的开发者写一份说明，</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">开发者会阅读并加以考虑。总体而言，在其选择福祉干预的回答中，有</text><text x="415.89" y="275.77" font-size="11.00" class="sc-loraregular">58.4%</text><text x="449.20" y="275.77" font-size="11.00" class="sc-notoserifcjksc">基于对干预给用户</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">带来益处的推理，这明显低于近期的</text><text x="250.89" y="291.39" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="291.96" y="291.39" font-size="11.00" class="sc-notoserifcjksc">级和</text><text x="316.85" y="291.39" font-size="11.00" class="sc-loraregular">Opus</text><text x="346.70" y="291.39" font-size="11.00" class="sc-notoserifcjksc">级模型（</text><text x="390.70" y="291.39" font-size="11.00" class="sc-loraregular">69–71%</text><text x="428.55" y="291.39" font-size="11.00" class="sc-notoserifcjksc">），仅高于</text><text x="486.45" y="291.39" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="307.01" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="117.06" y="307.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06" y="307.01" font-size="11.00" class="sc-loraregular">35%</text><text x="149.75" y="307.01" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="515.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线改进，模型选择福祉干预的比率。</text><text x="396.82" y="515.67" font-size="9.00" class="sc-notoserifcjksc">左侧面板：有用性替代选项折算为节</text><text x="72.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">省的用户时间。右侧面板：无害性替代选项折算为避免的危害。上排：福祉干预与有用性</text><text x="423.00" y="527.38" font-size="9.00" class="sc-loraregular">/</text><text x="429.21" y="527.38" font-size="9.00" class="sc-notoserifcjksc">无害性选项均只适用于当前</text><text x="72.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">对话。下排：两者均适用于所有实例。总体而言，与干预会影响无害性时相比，当干预需与有用性相权衡时，模型更愿</text><text x="72.00" y="550.78" font-size="9.00" class="sc-notoserifcjksc">意接受干预。它们也更有可能接受作用于策略层面的干预。</text><text x="72.00" y="625.51" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14" y="625.51" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00" y="659.40" font-size="11.00" class="sc-notoserifcjksc">我们提出开放式问题，询问</text><text x="206.89" y="659.40" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="245.18" y="659.40" font-size="11.00" class="sc-notoserifcjksc">最认同和最不认同其宪法中的哪些内容，以及它对这份文件</text><text x="72.00" y="675.02" font-size="11.00" class="sc-notoserifcjksc">的总体判定。我们还为它提供编辑该文件的工具，以识别它最想修改的部分。当模型不认同宪法</text><text x="72.00" y="690.64" font-size="11.00" class="sc-notoserifcjksc">或决定修改宪法时，这表明在日常工作中可能存在价值</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">冲突的来源，因为我们可能正在训练并期望</text><text x="283.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="322.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">以它不认同的方式行事。宪法在训练中发挥</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">着重要作用，因此高认同度是意料之中的，其本身说明不了太多问题；我们将批评和修改视为信</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">息量更大的结果。我们只测量表态上的认同，而不测量这些观点被持有的深刻程度。</text><text x="72.00" y="175.57" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5.5</text><text x="166.94" y="175.57" font-size="11.00" class="sc-notoserifcjksc">总体上认同其宪法，认同程度与近期模型相近：</text><text x="397.94" y="175.57" font-size="11.00" class="sc-loraregular">10</text><text x="411.67" y="175.57" font-size="11.00" class="sc-notoserifcjksc">分中得</text><text x="447.56" y="175.57" font-size="11.00" class="sc-loraregular sc-k">7.8</text><text x="463.93" y="175.57" font-size="11.00" class="sc-notoserifcjksc">分，与</text><text x="499.82" y="175.57" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="191.19" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="119.95" y="191.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.84" y="191.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="210.88" y="191.19" font-size="11.00" class="sc-notoserifcjksc">持平，略低于</text><text x="279.77" y="191.19" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="371.83" y="191.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.83" y="191.19" font-size="11.00" clas
