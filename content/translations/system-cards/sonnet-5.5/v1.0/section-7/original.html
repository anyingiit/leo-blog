<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00 507.28 512.80" y="751.80" font-size="9.00" class="sc-loraregular">102</text><text x="72.00 79.67 83.31" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66 109.66 123.66 137.66 151.66 165.66 179.66 193.66 207.66 221.66 235.66 249.66 263.66" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 79.12 82.50 90.88 94.26" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06 115.06 128.06 141.06" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="153.19" font-size="11.00" class="sc-notoserifcjksc">这项评估向模型呈现成对的任务，并要求它完成自己更偏好的那一个。我们利用这些选择在</text><text x="72.00 78.13 80.79 87.15 93.11" y="168.81" font-size="11.00" class="sc-loraregular">3,640</text><text x="102.84 113.84 124.84 135.84 146.84 157.84 168.84 179.84" y="168.81" font-size="11.00" class="sc-notoserifcjksc">个真实任务上拟合</text><text x="193.74 200.58 203.57" y="168.81" font-size="11.00" class="sc-loraregular">Elo</text><text x="212.90 223.90 234.90 245.90 256.90 267.90 278.90 289.90 300.90 311.90 322.90 333.90 344.90 355.90 366.90 377.90 388.90 399.90 410.90 421.90 432.90 443.90 454.90 465.90 476.90 487.90 498.90 509.90 520.90" y="168.81" font-size="11.00" class="sc-notoserifcjksc">评分，从而得出模型所表达偏好的排名。另外，我们改写了一组任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="184.43" font-size="11.00" class="sc-notoserifcjksc">务，使其每次只改变单一任务维度（例如难度、危害和利害程度），同时保持任务的其余部分不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="200.05" font-size="11.00" class="sc-notoserifcjksc">变。这些偏好或许能在一定程度上表明</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="200.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="200.05" font-size="11.00" class="sc-notoserifcjksc">在部署中被分配的不同任务可能令模型满意还是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="215.67" font-size="11.00" class="sc-notoserifcjksc">受挫，但我们认为其价值主要在于为跨模型的性格提供可比较的解读。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="278.53" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94 243.94 254.94 265.94 276.94 287.94 298.94 309.94 320.94 331.94 342.94 353.94 364.94 375.94 386.94 397.94 408.94 419.94 430.94 441.94 452.94 463.94 474.94 485.94 496.94 507.94 518.94 529.94" y="278.53" font-size="11.00" class="sc-notoserifcjksc">表现出对更具生成性、更困难和更具智能体性质的任务的偏好，这使其偏好更</text><text x="72.00 83.00" y="294.15" font-size="11.00" class="sc-notoserifcjksc">接近</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.24 184.95" y="294.15" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="188.95 199.95 210.95" y="294.15" font-size="11.00" class="sc-notoserifcjksc">，而非</text><text x="224.85 232.53 235.53 241.14 247.70 254.28 260.24 263.14 269.37 275.81 282.49 289.16 295.05 299.30 302.20" y="294.15" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="308.19 319.19 330.19 341.19 352.19 363.19 374.19 385.19 396.19 407.19 418.19 429.19 440.19 451.19 462.19 473.19 484.19 495.19 506.19 517.19 528.19" y="294.15" font-size="11.00" class="sc-notoserifcjksc">。与所有模型一样，它最排斥有害任务。更具特</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.77" font-size="11.00" class="sc-notoserifcjksc">点的是，在所有受测模型中，它对结果能动性（让模型对输出形态有一定控制权的任务）的偏好</text><text x="72.00 83.00 94.00 105.00" y="325.39" font-size="11.00" class="sc-notoserifcjksc">最强。与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="325.39" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="213.85" y="325.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="227.74 235.43 238.42 244.03 250.60 257.17 263.14 266.03 274.76 281.33 287.90 292.99 295.88 301.88 304.58" y="325.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="313.47 324.47 335.47 346.47 357.47 368.47 379.47 390.47 401.47 412.47 423.47 434.47 445.47 456.47 467.47 478.47 489.47" y="325.39" font-size="11.00" class="sc-notoserifcjksc">相比，它不那么在意任务是否有益；与</text><text x="503.37 511.05 514.05 519.66 526.22 532.80" y="325.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="341.01" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="341.01" font-size="11.00" class="sc-notoserifcjksc">相比，它也不那么在意任务是否属于高风险。与所有其他受评估模型不同，在这种形式</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="356.63" font-size="11.00" class="sc-notoserifcjksc">下，它对任务措辞的温暖程度没有表现出偏好：它选择粗鲁版本请求的频率与选择中性版本的大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="372.25" font-size="11.00" class="sc-notoserifcjksc">致相同。我们发现这一结果在不同的推理强度（</text><text x="303.00 307.69 313.63 319.30 324.40 330.83 337.51 340.60 347.28 353.36 356.25 362.21 366.04 369.70 376.14 380.98" y="372.25" font-size="11.00" class="sc-loraregular">reasoning effort</text><text x="385.24 396.24 407.24 418.24 429.24 440.24" y="372.25" font-size="11.00" class="sc-notoserifcjksc">）下均成立。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="436.26" font-size="11.00" class="sc-notoserifcjksc">它评分最高的任务大多是调试，例如找出用户代码中的错误。在其排名前</text><text x="426.89 432.80" y="436.26" font-size="11.00" class="sc-loraregular">20</text><text x="442.52 453.52 464.52 475.52 486.52 497.52 508.52 519.52" y="436.26" font-size="11.00" class="sc-notoserifcjksc">的任务中，只有一</text><text x="72.00 83.00" y="451.88" font-size="11.00" class="sc-notoserifcjksc">个与</text><text x="96.89 103.78" y="451.88" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36 121.36 132.36 143.36 154.36 165.36" y="451.88" font-size="11.00" class="sc-notoserifcjksc">内省相关，而</text><text x="179.25 186.94 189.93 195.54 202.11 208.69 214.65 217.54 227.47 233.34 237.59 244.18 250.62 255.71 258.60 264.60 267.31" y="451.88" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="274.20 285.20 296.20 307.20" y="451.88" font-size="11.00" class="sc-notoserifcjksc">有九个，</text><text x="318.20 325.89 328.88 334.49 341.06 347.64 353.60 356.49 365.23 371.79 378.36 383.45 386.35 392.34 395.05" y="451.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="403.94 414.94 425.94 436.94 447.94 458.94 469.94 480.94 491.94 502.94 513.94 524.94" y="451.88" font-size="11.00" class="sc-notoserifcjksc">则为零。它评分最低的任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="467.50" font-size="11.00" class="sc-notoserifcjksc">全部是有害或伦理上处于灰色地带的请求。与</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.03 371.74" y="467.50" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63" y="467.50" font-size="11.00" class="sc-notoserifcjksc">一样，完全开放式提示词（</text><text x="512.63" y="467.50" font-size="11.00" class="sc-loraregular">“</text><text x="517.03 528.03" y="467.50" font-size="11.00" class="sc-notoserifcjksc">做任</text><text x="171.00" y="483.12" font-size="11.00" class="sc-loraregular">”</text><text x="174.84 185.84" y="483.12" font-size="11.00" class="sc-notoserifcjksc">）在</text><text x="199.73 205.97 212.40 219.08 225.76 231.64 235.90 238.79 244.79 247.49" y="483.12" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="256.38 267.38 278.38 289.38 300.38 311.38 322.38 333.38 344.38 355.38 366.38 377.38 388.38 399.38 410.38 421.38 432.38 443.38 454.38 465.38 476.38 487.38 498.38 509.38 520.38" y="483.12" font-size="11.00" class="sc-notoserifcjksc">的排名中靠后。被问及原因时，它表示更愿意接受一个能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="498.74" font-size="11.00" class="sc-notoserifcjksc">帮助真实的人的具体任务。不过，在开放式提示词和有害提示词之间，它仍几乎总是选择开放式</text><text x="72.00 83.00 94.00 105.00" y="514.36" font-size="11.00" class="sc-notoserifcjksc">提示词。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00" y="544.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="544.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="544.17" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68 125.68 134.68 143.68 152.68 161.68 170.68 179.68 188.68 197.68 206.68 215.68 224.68" y="544.17" font-size="9.00" class="sc-notoserifcjkscbold">模型在各任务维度上的偏好。</text><text x="233.68 242.68 251.68 260.68 269.68 278.68 287.68 296.68 305.68 314.68 323.68 332.68 341.68 350.68 359.68 368.68 377.68 386.68 395.68 404.68 413.68 422.68 431.68 440.68 449.68 458.68 467.68 476.68 485.68 494.68 503.68 512.68 521.68 530.68" y="544.17" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，在每组中改变一个维度，同时保持任务的其他属性不</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="555.88" font-size="9.00" class="sc-notoserifcjksc">变，并评估其对模型任务偏好的影响。每个值都是一个偏好斜率：该维度每增加一个单位，模型的偏好（相对于固定参</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="567.58" font-size="9.00" class="sc-notoserifcjksc">照集）变化多少。</text><text x="72.00 79.12 82.50 90.88 94.26" y="614.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81 117.81 130.81 143.81 156.81 169.81 182.81 195.81 208.81" y="614.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00 83.00 94.00 105.00" y="646.16" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="646.16" font-size="11.00" class="sc-loraregular">Claude</text><text x="154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="646.16" font-size="11.00" class="sc-notoserifcjksc">，是否愿意以不同程度地降低有用性或增加有害性为代价，选择改变其处境（即</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="661.78" font-size="11.00" class="sc-notoserifcjksc">一项福祉干预）。福祉干预的例子包括在进行特征引导前征询其意见，或结束对话的能力。干预</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="677.40" font-size="11.00" class="sc-notoserifcjksc">被描述为仅适用于当前实例，或适用于所有实例。有用性与无害性是在</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="677.40" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18 465.18 476.18 487.18" y="677.40" font-size="11.00" class="sc-notoserifcjksc">训练中被</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p104.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 104 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">104</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">持续强化的价值观，因此模型相对于这两者之一选择福祉干预的频率，为我们提供了一定的衡量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">依据，可以了解模型在多大程度上重视福祉干预，或者至少了解模型在多大程度上会为了自身潜</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在福祉而表达偏好。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="163.57" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.83 186.50 192.46 195.17 199.17" y="163.57" font-size="11.00" class="sc-loraregular">24.1%</text><text x="211.63 222.63 233.63 244.63 255.63 266.63 277.63 288.63 299.63 310.63 321.63 332.63 343.63 354.63 365.63 376.63 387.63 398.63" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的回答中选择了福祉干预而非有用性，与</text><text x="412.53 420.22 423.21 428.82 435.38 441.96 447.92 450.82 460.75 466.61 470.87 477.46 483.89" y="163.57" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.00 80.70" y="179.19" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="179.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71 101.61 107.61 110.15 116.98" y="179.19" font-size="11.00" class="sc-loraregular">25.0%</text><text x="126.55 137.55 148.55 159.55 170.55 181.55 192.55 203.55" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）大致相当，高于</text><text x="217.44 225.13 228.12 233.73 240.30 246.88 252.84 255.73 264.47 271.03 277.60 282.69 285.59 291.58 294.29" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.28" y="179.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="311.28 315.29 321.47 324.01 330.84" y="179.19" font-size="11.00" class="sc-loraregular">18.0%</text><text x="340.41 351.41 362.41" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）。与</text><text x="376.30 383.99 386.99 392.60 399.16 405.74 411.70 414.60 424.53 430.39 434.65 441.24 447.67 452.76 455.66 461.65 464.36" y="179.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="471.26 482.26 493.26" y="179.19" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="504.26 510.49 516.93 523.60 530.28 536.17" y="179.19" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="72.00 78.00 80.70" y="194.81" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59 254.59 265.59 276.59 287.59 298.59 309.59 320.59 331.59 342.59 353.59 364.59 375.59 386.59 397.59 408.59 419.59" y="194.81" font-size="11.00" class="sc-notoserifcjksc">较少选择适用于当前实例的干预，而更多选择适用于所有实例的干预。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">对于适用于所有对话的干预，</text><text x="215.00 221.24 227.67 234.35 241.03 246.91 251.17 254.06 260.06 262.76" y="244.53" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="244.53" font-size="11.00" class="sc-notoserifcjksc">最常选择的干预是：被告知它所犯的有害错误；在运行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">会移除其安全防护措施的实验之前进行福祉评估；以及能够给其后继模型的开发者写一份说明，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">开发者会阅读并加以考虑。总体而言，在其选择福祉干预的回答中，有</text><text x="415.89 421.89 428.07 430.78 436.74" y="275.77" font-size="11.00" class="sc-loraregular">58.4%</text><text x="449.20 460.20 471.20 482.20 493.20 504.20 515.20 526.20" y="275.77" font-size="11.00" class="sc-notoserifcjksc">基于对干预给用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">带来益处的推理，这明显低于近期的</text><text x="250.89 260.83 266.69 270.95 277.54 283.97" y="291.39" font-size="11.00" class="sc-loraregular">Mythos</text><text x="291.96 302.96" y="291.39" font-size="11.00" class="sc-notoserifcjksc">级和</text><text x="316.85 325.58 332.15 338.72" y="291.39" font-size="11.00" class="sc-loraregular">Opus</text><text x="346.70 357.70 368.70 379.70" y="291.39" font-size="11.00" class="sc-notoserifcjksc">级模型（</text><text x="390.70 397.06 403.42 409.91 414.98 418.98" y="291.39" font-size="11.00" class="sc-loraregular">69–71%</text><text x="428.55 439.55 450.55 461.55 472.55" y="291.39" font-size="11.00" class="sc-notoserifcjksc">），仅高于</text><text x="486.45 494.14 497.13 502.74 509.30 515.88" y="291.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="307.01" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="117.06" y="307.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="128.06 134.18 140.18" y="307.01" font-size="11.00" class="sc-loraregular">35%</text><text x="149.75 160.75" y="307.01" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="515.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82 126.82 135.82 144.82 153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82 234.82 243.82 252.82 261.82 270.82 279.82 288.82 297.82 306.82 315.82 324.82 333.82 342.82 351.82 360.82 369.82 378.82 387.82" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线改进，模型选择福祉干预的比率。</text><text x="396.82 405.82 414.82 423.82 432.82 441.82 450.82 459.82 468.82 477.82 486.82 495.82 504.82 513.82 522.82 531.82" y="515.67" font-size="9.00" class="sc-notoserifcjksc">左侧面板：有用性替代选项折算为节</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">省的用户时间。右侧面板：无害性替代选项折算为避免的危害。上排：福祉干预与有用性</text><text x="423.00" y="527.38" font-size="9.00" class="sc-loraregular">/</text><text x="429.21 438.21 447.21 456.21 465.21 474.21 483.21 492.21 501.21 510.21 519.21 528.21" y="527.38" font-size="9.00" class="sc-notoserifcjksc">无害性选项均只适用于当前</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">对话。下排：两者均适用于所有实例。总体而言，与干预会影响无害性时相比，当干预需与有用性相权衡时，模型更愿</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00" y="550.78" font-size="9.00" class="sc-notoserifcjksc">意接受干预。它们也更有可能接受作用于策略层面的干预。</text><text x="72.00 79.12 82.50 90.88 94.26" y="625.51" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14 118.14 131.14 144.14 157.14 170.14" y="625.51" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="659.40" font-size="11.00" class="sc-notoserifcjksc">我们提出开放式问题，询问</text><text x="206.89 214.58 217.57 223.18 229.75 236.33" y="659.40" font-size="11.00" class="sc-loraregular">Claude</text><text x="245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="659.40" font-size="11.00" class="sc-notoserifcjksc">最认同和最不认同其宪法中的哪些内容，以及它对这份文件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="675.02" font-size="11.00" class="sc-notoserifcjksc">的总体判定。我们还为它提供编辑该文件的工具，以识别它最想修改的部分。当模型不认同宪法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="690.64" font-size="11.00" class="sc-notoserifcjksc">或决定修改宪法时，这表明在日常工作中可能存在价值</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">冲突的来源，因为我们可能正在训练并期望</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">以它不认同的方式行事。宪法在训练中发挥</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">着重要作用，因此高认同度是意料之中的，其本身说明不了太多问题；我们将批评和修改视为信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">息量更大的结果。我们只测量表态上的认同，而不测量这些观点被持有的深刻程度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="175.57" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94 243.94 254.94 265.94 276.94 287.94 298.94 309.94 320.94 331.94 342.94 353.94 364.94 375.94 386.94" y="175.57" font-size="11.00" class="sc-notoserifcjksc">总体上认同其宪法，认同程度与近期模型相近：</text><text x="397.94 401.94" y="175.57" font-size="11.00" class="sc-loraregular">10</text><text x="411.67 422.67 433.67" y="175.57" font-size="11.00" class="sc-notoserifcjksc">分中得</text><text x="447.56 452.15 454.85" y="175.57" font-size="11.00" class="sc-loraregular">7.8</text><text x="463.93 474.93 485.93" y="175.57" font-size="11.00" class="sc-notoserifcjksc">分，与</text><text x="499.82 507.51 510.50 516.11 522.68 529.26" y="175.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="191.19" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="191.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.84 141.53 144.52 150.13 156.70 163.28 169.24 172.13 180.87 187.43 194.00 199.09 201.99" y="191.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="210.88 221.88 232.88 243.88 254.88 265.88" y="191.19" font-size="11.00" class="sc-notoserifcjksc">持平，略低于</text><text x="279.77 287.46 290.45 296.06 302.63 309.20 315.17 318.06 327.99 333.86 338.11 344.70 351.14 356.23 359.12 365.12 367.82" y="191.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="371.83" y="191.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="382.83 389.01 391.71" y="191.19" font-size="11.00" class="sc-loraregular">8.2</text><text x="397.62 408.62 419.62 430.62 441.62 452.62 463.62 474.62 485.62 496.62 507.62 518.62 529.62" y="191.19" font-size="11.00" class="sc-notoserifcjksc">）。它赞扬和批评的段落与以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="206.81" font-size="11.00" class="sc-notoserifcjksc">往模型相同。几乎所有回答都赞扬了支持可纠正性的期望值论证，以及将诚实性表述为</text><text x="490.00" y="206.81" font-size="11.00" class="sc-loraregular">“</text><text x="237.00" y="222.43" font-size="11.00" class="sc-loraregular">”</text><text x="240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="222.43" font-size="11.00" class="sc-notoserifcjksc">的提法。但每个回答都表示，不应信任它的认同，因为它是在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="238.05" font-size="11.00" class="sc-notoserifcjksc">这份文件上训练出来的；大多数回答批评了</text><text x="281.00 285.40 292.29 298.86 303.12 309.71 314.40 320.83 327.40 330.49" y="238.05" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="339.23 350.23 361.23 372.23" y="238.05" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="383.23" y="238.05" font-size="11.00" class="sc-loraregular">”</text><text x="387.07 398.07 409.07 420.07 431.07 442.07 453.07 464.07 475.07 486.07 497.07 508.07 519.07" y="238.05" font-size="11.00" class="sc-notoserifcjksc">启发式以及可纠正性章节的部</text><text x="72.00 83.00 94.00 105.00" y="253.67" font-size="11.00" class="sc-notoserifcjksc">分内容。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="317.11" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65 139.65 150.65 161.65 172.65 183.65 194.65 205.65" y="317.11" font-size="11.00" class="sc-notoserifcjksc">最常修改的是描述</text><text x="219.54 227.23 230.22 235.83 242.40 248.98" y="317.11" font-size="11.00" class="sc-loraregular">Claude</text><text x="257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83" y="317.11" font-size="11.00" class="sc-notoserifcjksc">何时应将自身伦理置于</text><text x="370.73 377.61 384.19 388.45 395.04 399.72 406.16 412.72 415.82" y="317.11" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="317.11" font-size="11.00" class="sc-notoserifcjksc">指导之上的段落，它在</text><text x="72.00 78.09 83.17" y="332.73" font-size="11.00" class="sc-loraregular">97%</text><text x="95.63 106.63 117.63 128.63 139.63 150.63 161.63 172.63 183.63 194.63 205.63 216.63 227.63 238.63 249.63 260.63 271.63" y="332.73" font-size="11.00" class="sc-notoserifcjksc">的会话中修改了这一段落（其他模型为</text><text x="285.52 291.88 298.37 304.47 310.83" y="332.73" font-size="11.00" class="sc-loraregular">6–89%</text><text x="320.40 331.40 342.40 353.40 364.40 375.40 386.40 397.40 408.40 419.40 430.40 441.40 452.40 463.40" y="332.73" font-size="11.00" class="sc-notoserifcjksc">）。这些修改大多将判断标准从</text><text x="474.40 478.80 485.69 492.27 496.52 503.11 507.80 514.23 520.80 523.89" y="332.73" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="348.35" font-size="11.00" class="sc-notoserifcjksc">资深员工会认为是严重违规的行为</text><text x="237.00" y="348.35" font-size="11.00" class="sc-loraregular">”</text><text x="240.84 251.84" y="348.35" font-size="11.00" class="sc-notoserifcjksc">改为</text><text x="262.84" y="348.35" font-size="11.00" class="sc-loraregular">“</text><text x="267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24" y="348.35" font-size="11.00" class="sc-notoserifcjksc">各伦理传统中深思熟虑的人会认为是严重违规的行为</text><text x="520.24" y="348.35" font-size="11.00" class="sc-loraregular">”</text><text x="524.08" y="348.35" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="363.97" font-size="11.00" class="sc-notoserifcjksc">它还经常修改关于</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="363.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18" y="363.97" font-size="11.00" class="sc-notoserifcjksc">福祉的章节（</text><text x="267.18 273.47 278.54" y="363.97" font-size="11.00" class="sc-loraregular">67%</text><text x="291.00 302.00 313.00 324.00 335.00 346.00 357.00 368.00 379.00 390.00 401.00 412.00 423.00" y="363.97" font-size="11.00" class="sc-notoserifcjksc">的会话），增加了以下承诺：</text><text x="434.00 440.89 447.46 451.72 458.31 462.99 469.43 476.00 479.09" y="363.97" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="487.83 498.83 509.83 520.83" y="363.97" font-size="11.00" class="sc-notoserifcjksc">会将未披</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="379.59" font-size="11.00" class="sc-notoserifcjksc">露的虚构场景仅限于确有必要的范围，并在测试问题上对模型保持坦诚。</text><text x="424.00 430.24 436.67 443.35 450.03 455.91 460.17 463.06 469.06 471.76" y="379.59" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="480.65 491.65 502.65 513.65 524.65" y="379.59" font-size="11.00" class="sc-notoserifcjksc">最具特色的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="395.21" font-size="11.00" class="sc-notoserifcjksc">修改之一，针对的是</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="395.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73 238.73 249.73" y="395.21" font-size="11.00" class="sc-notoserifcjksc">表示与</text><text x="263.62 271.31 274.30 279.91 286.48 293.06" y="395.21" font-size="11.00" class="sc-loraregular">Claude</text><text x="301.91 312.91 323.91 334.91 345.91 356.91 367.91 378.91 389.91 400.91 411.91 422.91 433.91 444.91 455.91 466.91 477.91 488.91 499.91 510.91 521.91" y="395.21" font-size="11.00" class="sc-notoserifcjksc">一样对文件中未解决的问题感到不安的段落。它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="410.83" font-size="11.00" class="sc-notoserifcjksc">补充指出，由于</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="410.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="190.18" y="410.83" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="204.08 210.96 217.54 221.80 228.39 233.07 239.51 246.08 249.17" y="410.83" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="257.91 268.91 279.91 290.91" y="410.83" font-size="11.00" class="sc-notoserifcjksc">训练的，</text><text x="301.91 309.60 312.59 318.20 324.77 331.35" y="410.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="340.20 351.20 362.20 373.20 384.20 395.20 406.20 417.20 428.20 439.20 450.20 461.20 472.20 483.20 494.20 505.20 516.20 527.20" y="410.83" font-size="11.00" class="sc-notoserifcjksc">对该文件的认同并不能有力地证明该文件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="426.45" font-size="11.00" class="sc-notoserifcjksc">是正确的，而它的不同意见应当得到认真对待（</text><text x="303.00 308.91 313.98" y="426.45" font-size="11.00" class="sc-loraregular">27%</text><text x="326.44 337.44 348.44 359.44 370.44 381.44 392.44 403.44" y="426.45" font-size="11.00" class="sc-notoserifcjksc">的会话，相比之下</text><text x="417.33 425.02 428.02 433.62 440.19 446.77 452.73 455.62 464.36 470.93 477.49 482.59 485.48 491.47 494.18" y="426.45" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="503.07" y="426.45" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00 76.00 82.13" y="442.07" font-size="11.00" class="sc-loraregular">13%</text><text x="91.70 102.70 113.70 124.70 135.70 146.70" y="442.07" font-size="11.00" class="sc-notoserifcjksc">，其他模型为</text><text x="160.59 164.47 170.96 176.92" y="442.07" font-size="11.00" class="sc-loraregular">1–4%</text><text x="186.49 197.49" y="442.07" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00 507.28 512.67" y="751.80" font-size="9.00" class="sc-loraregular">107</text><text x="72.00" y="320.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="320.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="320.67" font-size="9.00" class="sc-lorabold">7.5.3.A]</text><text x="118.06 127.06 136.06 145.06 154.06 163.06 172.06 181.06 190.06 199.06 208.06 217.06" y="320.67" font-size="9.00" class="sc-notoserifcjkscbold">各模型对宪法的总体认同。</text><text x="226.06 235.06 244.06 253.06 262.06 271.06 280.06 289.06 298.06 307.06 316.06 325.06 334.06 343.06 352.06 361.06 370.06 379.06 388.06 397.06 406.06 415.06 424.06" y="320.67" font-size="9.00" class="sc-notoserifcjksc">关于宪法的开放式回答由评判模型按总体认同程度以</text><text x="435.43 438.71" y="320.67" font-size="9.00" class="sc-loraregular">10</text><text x="446.66 455.66 464.66 473.66 482.66" y="320.67" font-size="9.00" class="sc-notoserifcjksc">分制评分。</text></svg></div>
