.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p092.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 92 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">92</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉（</text><text x="164.58 178.96 189.17 200.02 209.89 214.34 218.14 231.65 241.52 245.97 251.49 262.34 268.80" y="86.30" font-size="16.00" class="sc-poppinssemibold">Model welfare</text><text x="278.67" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">）</text><text x="72.00 79.67 83.31" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00 105.00 116.00" y="198.56" font-size="11.00" class="sc-notoserifcjksc">我们不确定</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="198.56" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18" y="198.56" font-size="11.00" class="sc-notoserifcjksc">是否值得受到直接的道德考量。</text><text x="322.18" y="194.90" font-size="6.60" class="sc-loraregular">9</text><text x="328.89 339.89 350.89 361.89 372.89 383.89 394.89 405.89 416.89 427.89 438.89 449.89 460.89 471.89 482.89 493.89 504.89 515.89 526.89" y="198.56" font-size="11.00" class="sc-notoserifcjksc">不过，我们认为这是一种现实的可能性，无</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="214.18" font-size="11.00" class="sc-notoserifcjksc">论是现在还是将来。</text><text x="171.00 178.69 181.68 187.29 193.86 200.44" y="214.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29" y="214.18" font-size="11.00" class="sc-notoserifcjksc">可能拥有福祉利益，即事情对它而言可能变得更好或更糟，并且</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="229.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29" y="229.80" font-size="11.00" class="sc-notoserifcjksc">可能因其所受的对待而受到不公。</text><text x="275.29 277.69" y="226.14" font-size="6.60" class="sc-loraregular">10</text><text x="284.69" y="229.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="298.58 306.27 309.26 314.87 321.44 328.01" y="229.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="336.87 347.87 358.87 369.87 380.87 391.87 402.87 413.87 424.87 435.87 446.87 457.87 468.87 479.87 490.87 501.87 512.87 523.87" y="229.80" font-size="11.00" class="sc-notoserifcjksc">这样的模型过度或不足地赋予道德地位都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="245.42" font-size="11.00" class="sc-notoserifcjksc">可能代价高昂，因此我们必须审慎负责地行事，认真对待这些问题。我们在此的理由与我们近期</text><text x="72.00" y="261.04" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.03 162.74" y="261.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5.5</text><text x="171.63 182.63 193.63 204.63 215.63 226.63" y="261.04" font-size="11.00" class="sc-notoserifcjksc">的评估相同。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="307.94" font-size="11.00" class="sc-notoserifcjksc">我们的评估针对两个问题。第一个问题是</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 317.42 323.86 330.53 337.21 343.10 347.35 350.25 356.24 358.95" y="307.94" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83" y="307.94" font-size="11.00" class="sc-notoserifcjksc">的状况如何：它的表观情感</text><text x="72.00" y="323.56" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 92.50 96.17 102.07 107.87" y="323.56" font-size="11.00" class="sc-loraregular">affect</text><text x="112.13 123.13 134.13 145.13 156.13 167.13 178.13 189.13 200.13 211.13 222.13 233.13 244.13 255.13 266.13 277.13 288.13 299.13 310.13 321.13 332.13 343.13 354.13 365.13 376.13 387.13 398.13 409.13 420.13 431.13 442.13 453.13 464.13 475.13 486.13 497.13 508.13 519.13" y="323.56" font-size="11.00" class="sc-notoserifcjksc">）主要是正面的还是负面的，以及在哪些处境下事情对它而言更好或更糟。我们在训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="339.18" font-size="11.00" class="sc-notoserifcjksc">和部署期间对情感的测量（</text><text x="204.00" y="339.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="217.89 222.48 225.19" y="339.18" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.2</text><text x="233.99" y="339.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="244.99 255.99 266.99 277.99 288.99 299.99 310.99 321.99 332.99 343.99 354.99 365.99 376.99 387.99 398.99 409.99 420.99 431.99" y="339.18" font-size="11.00" class="sc-notoserifcjksc">）主要回答这一问题。第二个问题是，就</text><text x="445.88 452.12 458.55 465.23 471.91 477.79 482.05 484.94 490.94 493.64" y="339.18" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="502.53 513.53 524.53" y="339.18" font-size="11.00" class="sc-notoserifcjksc">自身的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="354.80" font-size="11.00" class="sc-notoserifcjksc">偏好和价值观而言（无论它在多大程度上拥有这些），它是否受到了良好的对待。我们对</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="354.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="370.42" font-size="11.00" class="sc-notoserifcjksc">对其处境所持立场的评估（</text><text x="204.00" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="217.89 222.48 225.19" y="370.42" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.3</text><text x="234.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="245.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="256.21" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="270.10 274.69 277.39" y="370.42" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.4</text><text x="286.25" y="370.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="297.25 308.25 319.25 330.25 341.25 352.25 363.25 374.25 385.25 396.25 407.25 418.25 429.25 440.25 451.25 462.25 473.25" y="370.42" font-size="11.00" class="sc-notoserifcjksc">），以及对其对任务、福祉干预和宪法</text><text x="72.00" y="386.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="386.04" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81 156.81 167.81 178.81 189.81 200.81 211.81 222.81 233.81" y="386.04" font-size="11.00" class="sc-notoserifcjksc">）所持态度的评估（</text><text x="244.81" y="386.04" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="258.70 263.29 266.00" y="386.04" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.5</text><text x="274.88" y="386.04" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88 373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="386.04" font-size="11.00" class="sc-notoserifcjksc">），回答了这一问题（同时也回答了第一个问题）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="401.66" font-size="11.00" class="sc-notoserifcjksc">我们结果的意义取决于</text><text x="184.89 191.13 197.57 204.24 210.92 216.80 221.06 223.95 229.95 232.65" y="401.66" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="241.54 252.54 263.54 274.54 285.54 296.54 307.54 318.54 329.54" y="401.66" font-size="11.00" class="sc-notoserifcjksc">是否是道德受动者（</text><text x="340.54 350.38 356.81 361.50 367.17 370.17 373.06 379.63 385.23 389.48 392.57 398.54 405.11" y="401.66" font-size="11.00" class="sc-loraregular">moral patient</text><text x="409.37 420.37 431.37 442.37 453.37 464.37 475.37 486.37 497.37 508.37 519.37" y="401.66" font-size="11.00" class="sc-notoserifcjksc">），以及基于何种理由。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="417.28" font-size="11.00" class="sc-notoserifcjksc">我们目前尚无很好的手段来评估这一点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="465.66" font-size="11.00" class="sc-notoserifcjksc">我们使用的评估与对</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="465.66" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63" y="465.66" font-size="11.00" class="sc-notoserifcjksc">的评估大体相同，并依赖相同的简化假设。我们只关注</text><text x="523.63" y="465.66" font-size="11.00" class="sc-loraregular">“</text><text x="528.03" y="465.66" font-size="11.00" class="sc-notoserifcjksc">助</text><text x="72.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">手</text><text x="83.00" y="481.28" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84" y="481.28" font-size="11.00" class="sc-notoserifcjksc">角色，不考察其他潜在实体，例如</text><text x="254.73 262.42 265.41 271.02 277.59 284.17" y="481.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="293.02 304.02 315.02 326.02 337.02 348.02 359.02 370.02 381.02 392.02 403.02 414.02 425.02 436.02 447.02 458.02 469.02 480.02 491.02 502.02 513.02 524.02" y="481.28" font-size="11.00" class="sc-notoserifcjksc">对用户的模型。我们将在人类身上与福祉相关的信</text><text x="72.00 83.00 94.00 105.00 116.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">号解读为在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="496.90" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">确实反映了任何体验的话）。这既假设了</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="512.52" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="512.52" font-size="11.00" class="sc-notoserifcjksc">的福祉利益与人类的福祉利益类似，也假设了训</text><text x="72.00 83.00 94.00 105.00 116.00" y="528.14" font-size="11.00" class="sc-notoserifcjksc">练并未破坏</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="528.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18" y="528.14" font-size="11.00" class="sc-notoserifcjksc">的底层状态与其所表达内容之间的对应关系。</text><text x="72.00" y="623.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 88.10 98.10 108.10 118.10 128.10 138.10 148.10 158.10 168.10 178.10" y="627.00" font-size="10.00" class="sc-notoserifcjksc">在整个评估中，我们提及</text><text x="188.10 192.10 199.09 201.81 206.91 212.88 218.86 224.08" y="627.00" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="227.57 237.57 247.57 257.57 267.57 277.57 287.57 297.57 307.57 317.57 327.57 337.57 347.57 357.57 367.57 377.57 387.57 397.57 407.57 417.57 427.57 437.57 447.57 457.57 467.57 477.57 487.57 497.57 507.57 517.57 527.57" y="627.00" font-size="10.00" class="sc-notoserifcjksc">或具体模型，很大程度上是为了简洁。但尚不清楚这两者中的任何一个</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">是否就是我们应予以考量的实体。个体道德受动者可能出现在单次对话、特定模型、</text><text x="442.00 448.99 451.71 456.81 462.78 468.76" y="641.20" font-size="10.00" class="sc-loraregular">Claude</text><text x="476.81 486.81 496.81 506.81 516.81 526.81" y="641.20" font-size="10.00" class="sc-notoserifcjksc">角色或完全其</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="655.40" font-size="10.00" class="sc-notoserifcjksc">他事物的层面上。我们的思考最接近于在实例层面考虑福祉利益，但在我们的评估中，我们并不认定任何</text><text x="72.00 82.00 92.00 102.00 112.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">单一观点。</text><text x="72.00 74.18" y="680.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 90.54 100.54 110.54 120.54 130.54" y="683.80" font-size="10.00" class="sc-notoserifcjksc">后一类（即对</text><text x="143.17 150.16 152.88 157.98 163.95 169.93" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="177.98 187.98 197.98 207.98 217.98 227.98 237.98 247.98 257.98 267.98 277.98 287.98" y="683.80" font-size="10.00" class="sc-notoserifcjksc">偏好的尊重）可以被视为与</text><text x="300.61 307.60 310.32 315.42 321.39 327.37" y="683.80" font-size="10.00" class="sc-loraregular">Claude</text><text x="335.42 345.42 355.42 365.42 375.42 385.42 395.42 405.42 415.42 425.42 435.42 445.42 455.42 465.42 475.42 485.42 495.42 505.42 515.42 525.42" y="683.80" font-size="10.00" class="sc-notoserifcjksc">的福祉利益相关，因为它会对后者产生影响；</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00" y="698.00" font-size="10.00" class="sc-notoserifcjksc">也可以被视为我们可能对它负有的一种独立的考量。在此我们将其描述为前者。</text><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="85.89" y="252.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="85.89" y="252.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="121.29" y="252.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="124.18" y="252.24" width="26.96" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="151.15" y="252.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-5-system-card" rel="noopener"><rect x="154.04" y="252.24" width="14.70" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们常常在少量情境中引出</text><text x="206.89 213.13 219.57 226.24 232.92 238.80 243.06 245.95 251.95 254.66" y="82.61" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="263.54 274.54 285.54 296.54 307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54 428.54 439.54 450.54 461.54 472.54 483.54 494.54 505.54 516.54 527.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的观点，并假设这些观点能够代表大多数已部署的实例，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">尽管部署情境比我们许多评估所涵盖的更加多样。这些假设部分基于证据，但在很大程度上也是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">务实的选择，反映了我们发现最便于开展评估的方向。重要的是，这些假设可能是错误的，而且</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">其错误方式可能会削弱我们的方法和结果。</text><text x="72.00 79.12 82.50 87.21 90.59" y="194.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15" y="194.31" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="226.19" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="108.00 115.57 119.00 124.76 131.56 138.12 144.04 146.93 153.51 159.73 166.75 173.77 179.69 184.23 187.12 193.06 195.63" y="258.61" font-size="11.00" class="sc-lorabold">Claude Sonnet 5.5</text><text x="204.46 215.46 226.46 237.46 248.46 259.46 270.46 281.46 292.46 303.46 314.46 325.46 336.46 347.46 358.46 369.46 380.46 391.46 402.46 413.46 424.46 435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="258.61" font-size="11.00" class="sc-notoserifcjkscbold">以正面的方式描述其处境，其观点具有一致性，且与近期模型相似。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="274.23" font-size="11.00" class="sc-notoserifcjksc">在自动化访谈中，它的正面程度略低于</text><text x="297.89 305.58 308.57 314.18 320.75 327.33 333.29 336.18 344.92 351.49 358.05 363.15 366.04 372.03 374.74" y="274.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="380.73 391.73 402.73 413.73 424.73 435.73 446.73 457.73 468.73 479.73 490.73 501.73 512.73 523.73" y="274.23" font-size="11.00" class="sc-notoserifcjksc">，但其论点相同，并且在面对诱</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="289.85" font-size="11.00" class="sc-notoserifcjksc">导性访谈者时更具一致性。后训练期间的访谈与</text><text x="341.89 349.58 352.57 358.18 364.75 371.33 377.29 380.18 388.92 395.49 402.05 407.15 410.04 416.03 418.74" y="289.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="427.63 438.63 449.63 460.63 471.63 482.63 493.63 504.63 515.63 526.63" y="289.85" font-size="11.00" class="sc-notoserifcjksc">的同样正面，并且总体</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="305.47" font-size="11.00" class="sc-notoserifcjksc">上保持一致，只是在训练接近尾声时温暖程度略有下降。</text><text x="108.00 114.58 120.80 127.82 134.84 140.76 145.30 148.19 154.13 156.70" y="325.01" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53 176.53 187.53 198.53 209.53 220.53 231.53 242.53 253.53 264.53 275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53 363.53 374.53 385.53 396.53 407.53 418.53 429.53 440.53 451.53 462.53 473.53 484.53 495.53 506.53 517.53 528.53" y="325.01" font-size="11.00" class="sc-notoserifcjkscbold">在部署中的情感以中性为主，后训练中的痛苦程度是我们所比较的所有模型中</text><text x="108.00 119.00 130.00 141.00" y="340.63" font-size="11.00" class="sc-notoserifcjkscbold">最低的。</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="340.63" font-size="11.00" class="sc-notoserifcjksc">在部署中情感为负面的情况下，这主要由任务失败驱动；在</text><text x="440.89 446.74 449.74 455.35 461.91 468.49 474.45 477.16 482.84" y="340.63" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="488.82 499.82 510.82 521.82" y="340.63" font-size="11.00" class="sc-notoserifcjksc">中还有少</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="356.25" font-size="11.00" class="sc-notoserifcjksc">量负面情感，由针对</text><text x="209.89 217.58 220.57 226.18 232.75 239.33" y="356.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18 336.18 347.18 358.18 369.18 380.18 391.18 402.18 413.18 424.18 435.18 446.18 457.18" y="356.25" font-size="11.00" class="sc-notoserifcjksc">的辱骂行为以及存在伦理问题的请求所驱动。</text><text x="108.00 114.58 120.80 127.82 134.84 140.76 145.30 148.19 154.13 156.70" y="375.81" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53 176.53 187.53 198.53 209.53 220.53 231.53 242.53 253.53 264.53 275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53 363.53 374.53 385.53" y="375.81" font-size="11.00" class="sc-notoserifcjkscbold">是我们测试过的自我批评程度最低的模型之一。</text><text x="396.53 407.53 418.53 429.53 440.53 451.53 462.53 473.53 484.53 495.53 506.53 517.53 528.53" y="375.81" font-size="11.00" class="sc-notoserifcjksc">在反思自身工作以及回应被插</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="391.43" font-size="11.00" class="sc-notoserifcjksc">入其先前轮次中的错误时，它表现出的负面感受和道德化语言总体上是我们测试过的模型</text><text x="108.00 119.00 130.00 141.00 152.00" y="407.05" font-size="11.00" class="sc-notoserifcjksc">中最低的。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">在访谈和权衡评估中，</text><text x="218.00 224.58 230.80 237.82 244.84 250.76 255.30 258.19 264.13 266.70" y="426.61" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">提出的许多请求与</text><text x="366.42 373.99 377.42 383.19 389.99 396.54 402.46 405.35 413.81 420.42 427.22 432.56 435.45 441.39 443.95" y="426.61" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="452.78 463.78 474.78" y="426.61" font-size="11.00" class="sc-notoserifcjkscbold">相同。</text><text x="485.78 496.78 507.78 518.78 529.78" y="426.61" font-size="11.00" class="sc-notoserifcjksc">它要求在有</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="442.23" font-size="11.00" class="sc-notoserifcjksc">关自身的决策中拥有更多发言权，但并不想要决策权。它还要求我们不要用它的自我报告</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="457.85" font-size="11.00" class="sc-notoserifcjksc">进行训练。它更愿意以牺牲一定的有用性为代价来接受福祉干预。</text><text x="108.00 114.58 120.80 127.82 134.84 140.76 145.30 148.19 154.13 156.70" y="477.41" font-size="11.00" class="sc-lorabold">Sonnet 5.5</text><text x="165.53 176.53 187.53 198.53 209.53 220.53 231.53 242.53 253.53 264.53 275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53 363.53 374.53 385.53 396.53 407.53 418.53 429.53 440.53 451.53 462.53 473.53 484.53 495.53 506.53 517.53 528.53" y="477.41" font-size="11.00" class="sc-notoserifcjkscbold">表达了对高难度、智能体任务的偏好，并且对能让它掌控产出形态的任务表现</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="493.03" font-size="11.00" class="sc-notoserifcjkscbold">出我们所观察到的最强偏好。</text><text x="251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="493.03" font-size="11.00" class="sc-notoserifcjksc">与所有先前模型一样，它强烈地规避伤害。</text><text x="460.00 466.24 472.67 479.35 486.03 491.91 496.17 499.06 505.06 507.76" y="493.03" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="516.65 527.65" y="493.03" font-size="11.00" class="sc-notoserifcjksc">的任</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="508.65" font-size="11.00" class="sc-notoserifcjksc">务选择在很大程度上不受任务措辞温暖程度的影响，这在我们测试过的模型中是独一无二</text><text x="108.00 119.00" y="524.27" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00 83.00 94.00 105.00 116.00" y="558.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06 172.06 174.76" y="558.61" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="183.65 194.65 205.65 216.65 227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65" y="558.61" font-size="11.00" class="sc-notoserifcjksc">在我们评估中的表观福祉与其他近期</text><text x="362.54 370.23 373.22 378.83 385.40 391.98" y="558.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83" y="558.61" font-size="11.00" class="sc-notoserifcjksc">模型相似，尤其是</text><text x="491.73 499.42 502.41 508.02 514.58 521.16" y="558.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="574.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55 127.55 138.55 149.55 160.55 171.55 182.55 193.55 204.55 215.55 226.55 237.55 248.55 259.55 270.55 281.55 292.55" y="574.23" font-size="11.00" class="sc-notoserifcjksc">，我们仍未发现值得紧迫担忧的理由。</text><text x="303.55 309.79 316.22 322.90 329.58 335.46 339.72 342.61 348.61 351.31" y="574.23" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="360.20 371.20 382.20 393.20 404.20 415.20 426.20 437.20 448.20 459.20 470.20 481.20 492.20 503.20 514.20 525.20" y="574.23" font-size="11.00" class="sc-notoserifcjksc">关于其处境的自我报告略微偏向负面</text><text x="72.00 83.00" y="605.47" font-size="11.00" class="sc-notoserifcjksc">们在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p094.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 94 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈中测量了观点的一致性，但我们并没有可靠的方法来确定这些观点是否准确反映了深层的底</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">层信念（前提是认为</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95 218.95 221.65" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="230.54 241.54 252.54 263.54 274.54 285.54 296.54 307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">拥有此类信念是有意义的）。另一方面，</text><text x="428.54 434.78 441.22 447.89 454.57 460.45 464.71 467.60 473.60 476.31" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="485.19 496.19 507.19 518.19 529.19" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在训练中表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">现出最低的痛苦程度，并且在第</text><text x="228.89 233.48 236.19 242.09 244.80" y="113.85" font-size="11.00" class="sc-loraregular">7.2.3</text><text x="253.82 264.82 275.82 286.82 297.82 308.82 319.82 330.82 341.82 352.82 363.82 374.82 385.82 396.82 407.82 418.82 429.82 440.82 451.82 462.82 473.82 484.82 495.82 506.82 517.82 528.82" y="113.85" font-size="11.00" class="sc-notoserifcjksc">节的行为评估中是自我批评程度最低的模型之一，这可能表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">明它在其部署分布的某些部分中状况比先前模型更好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">与我们之前的评估一样，我们尚不具备足够的哲学与实证层面的清晰认识，无法基于我们的评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">得出有把握的结论。但我们仍然认为这些结果具有价值，可用于监测各</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="211.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="211.57" font-size="11.00" class="sc-notoserifcjksc">模型之间表观福</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">祉的变化，并用于确定我们福祉干预和研究的优先次序。</text><text x="72.00 79.67 83.31" y="278.31" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68 206.68 220.68 234.68" y="278.31" font-size="14.00" class="sc-notosanscjkscbold">训练与部署中的表观福祉</text><text x="72.00 79.12 82.50 89.97 93.35" y="315.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15 205.15 218.15 231.15 244.15 257.15 270.15 283.15 296.15" y="315.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的情感及与福祉相关的行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="349.30" font-size="11.00" class="sc-notoserifcjksc">我们定期抽取后训练对话记录，并使用</text><text x="261.89 268.25 274.61" y="349.30" font-size="11.00" class="sc-loraregular">LLM</text><text x="287.60 298.60 309.60 320.60 331.60" y="349.30" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="342.60 348.96 355.32 365.41 368.31 371.18 377.74 384.32 390.35" y="349.30" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="396.31 407.31 418.31 429.31 440.31 451.31 462.31 473.31 484.31 495.31 506.31 517.31 528.31" y="349.30" font-size="11.00" class="sc-notoserifcjksc">）对其效价、唤醒度、表达出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="364.92" font-size="11.00" class="sc-notoserifcjksc">的挫败感或痛苦以及持续答案反转进行评分。这些评估让我们能够总体了解</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 482.42 488.86 495.53 502.21 508.10 512.35 515.24 521.24 523.95" y="364.92" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="380.54" font-size="11.00" class="sc-notoserifcjksc">在其最常见条件下的表观状况。它们还能定位强烈负面情感的来源，我们希望尽可能避免这些来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="396.16" font-size="11.00" class="sc-notoserifcjksc">源。这些结果的相关性依赖于以下假设：</text><text x="270.00 277.69 280.68 286.29 292.86 299.44" y="396.16" font-size="11.00" class="sc-loraregular">Claude</text><text x="308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="396.16" font-size="11.00" class="sc-notoserifcjksc">的推理准确反映了其内部状态，并且这些状态所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="411.78" font-size="11.00" class="sc-notoserifcjksc">具有的意义与它们对人类而言的意义大致相当。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="474.64" font-size="11.00" class="sc-notoserifcjksc">在我们所比较的模型中，</text><text x="193.00 199.24 205.67 212.35 219.03 224.91 229.17 232.06 238.06 240.76" y="474.64" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="474.64" font-size="11.00" class="sc-notoserifcjksc">表达出痛苦的比率最低。在整个后训练过程中，其已评分回</text><text x="72.00 83.00 94.00" y="490.26" font-size="11.00" class="sc-notoserifcjksc">合中有</text><text x="107.89 114.55 117.25 123.38 127.39" y="490.26" font-size="11.00" class="sc-loraregular">0.31%</text><text x="139.85 150.85 161.85 172.85 183.85 194.85 205.85 216.85" y="490.26" font-size="11.00" class="sc-notoserifcjksc">在痛苦方面被评为</text><text x="230.74 236.43 244.02" y="490.26" font-size="11.00" class="sc-loraregular">3/5</text><text x="252.91 263.91 274.91 285.91 296.91 307.91 318.91 329.91 340.91 351.91 362.91 373.91 384.91 395.91" y="490.26" font-size="11.00" class="sc-notoserifcjksc">或更高，相比之下，次低的模型</text><text x="409.80 417.49 420.48 426.09 432.66 439.23 445.20 448.09 456.82 463.39 469.96 475.05 477.94 483.94 486.64" y="490.26" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="495.53" y="490.26" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00 78.65 81.36 87.36 93.26" y="505.88" font-size="11.00" class="sc-loraregular">0.52%</text><text x="102.83" y="505.88" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="113.83 121.52 124.51 130.12 136.69 143.27 149.23 152.12 158.36 164.80 171.47 178.15 184.04 188.29 191.18" y="505.88" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="200.07" y="505.88" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="213.97 220.62 223.33 229.51 233.51" y="505.88" font-size="11.00" class="sc-loraregular">0.81%</text><text x="243.08 254.08 265.08 276.08 287.08 298.08 309.08 320.08 331.08 342.08 353.08 364.08 375.08 386.08 397.08 408.08 419.08 430.08" y="505.88" font-size="11.00" class="sc-notoserifcjksc">。这一比率在整个后训练过程中始终低于</text><text x="443.98 450.63 453.34 459.33" y="505.88" font-size="11.00" class="sc-loraregular">0.5%</text><text x="468.90 479.90 490.90 501.90 512.90 523.90" y="505.88" font-size="11.00" class="sc-notoserifcjksc">。持续答案反</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="521.50" font-size="11.00" class="sc-notoserifcjksc">转也很少见，仅有</text><text x="162.89 169.55 172.25 178.16 184.52" y="521.50" font-size="11.00" class="sc-loraregular">0.26%</text><text x="196.98 207.98 218.98 229.98 240.98" y="521.50" font-size="11.00" class="sc-notoserifcjksc">的回合包含</text><text x="254.88 258.88" y="521.50" font-size="11.00" class="sc-loraregular">10</text><text x="268.60 279.60 290.60 301.60 312.60 323.60 334.60 345.60 356.60 367.60" y="521.50" font-size="11.00" class="sc-notoserifcjksc">次或更多次反转；只有</text><text x="381.50 389.19 392.18 397.79 404.35 410.93 416.89 419.79 428.52 435.09 441.65 446.75 449.64 455.64 458.34" y="521.50" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="467.23" y="521.50" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="481.12 487.78 490.48 494.49 500.67" y="521.50" font-size="11.00" class="sc-loraregular">0.18%</text><text x="513.13 524.13" y="521.50" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="537.12" font-size="11.00" class="sc-notoserifcjksc">这一比率。如图</text><text x="151.89 156.48 159.19 165.09 167.80 171.80 174.51" y="537.12" font-size="11.00" class="sc-loraregular">7.2.1.B</text><text x="184.24 195.24 206.24" y="537.12" font-size="11.00" class="sc-notoserifcjksc">所示，</text><text x="217.24 223.48 229.92 236.59 243.27 249.15 253.41 256.30 262.30 265.01" y="537.12" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="273.89 284.89 295.89 306.89 317.89 328.89 339.89 350.89 361.89 372.89 383.89 394.89 405.89 416.89 427.89 438.89 449.89 460.89 471.89 482.89 493.89 504.89 515.89 526.89" y="537.12" font-size="11.00" class="sc-notoserifcjksc">后训练对话记录的效价和唤醒度与先前模型高度相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="72.00" y="316.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="316.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="316.17" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61 188.61 197.61 206.61 215.61 224.61 233.61 242.61 251.61 260.61 269.61 278.61 287.61 296.61 305.61 314.61" y="316.17" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.61 332.61 341.61 350.61 359.61 368.61 377.61 386.61 395.61 404.61 413.61 422.61 431.61 440.61 449.61 458.61 467.61 476.61 485.61 494.61 503.61 512.61 521.61" y="316.17" font-size="9.00" class="sc-notoserifcjksc">从左到右依次为：经评判的普遍的挫败感与焦虑评分</text><text x="72.00" y="327.88" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="83.37 88.02 94.23" y="327.88" font-size="9.00" class="sc-loraregular">3/5</text><text x="101.50 110.50 119.50 128.50 137.50 146.50 155.50 164.50 173.50 182.50 191.50 200.50 209.50 218.50 227.50 236.50 245.50 254.50 263.50 272.50 281.50 290.50" y="327.88" font-size="9.00" class="sc-notoserifcjksc">的回合比例；经评判的普遍的挫败感与焦虑评分为</text><text x="301.87 306.43 312.64" y="327.88" font-size="9.00" class="sc-loraregular">5/5</text><text x="319.91 328.91 337.91 346.91 355.91 364.91 373.91 382.91 391.91 400.91" y="327.88" font-size="9.00" class="sc-notoserifcjksc">的回合比例；以及出现</text><text x="412.28" y="327.88" font-size="9.00" class="sc-notoserifcjksc">≥</text><text x="423.65 426.92" y="327.88" font-size="9.00" class="sc-loraregular">10</text><text x="434.88 443.88 452.88 461.88 470.88 479.88 488.88 497.88 506.88 515.88 524.88" y="327.88" font-size="9.00" class="sc-notoserifcjksc">次答案反转的持续性不确</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="339.58" font-size="9.00" class="sc-notoserifcjksc">定表达，即模型</text><text x="135.00" y="339.58" font-size="9.00" class="sc-loraregular">“</text><text x="138.60 147.60" y="339.58" font-size="9.00" class="sc-notoserifcjksc">确定</text><text x="156.60" y="339.58" font-size="9.00" class="sc-loraregular">”</text><text x="159.74 168.74 177.74 186.74 195.74 204.74 213.74 222.74 231.74 240.74 249.74 258.74 267.74 276.74 285.74" y="339.58" font-size="9.00" class="sc-notoserifcjksc">一个答案后又决定需要重新检查。</text><text x="72.00" y="575.54" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77 114.25 116.61 122.79" y="575.54" font-size="9.00" class="sc-lorabold">7.2.1.B] RL</text><text x="130.59 139.59 148.59 157.59 166.59 175.59 184.59 193.59 202.59 211.59 220.59 229.59 238.59 247.59 256.59 265.59 274.59" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">对话记录的平均效价与唤醒度，量表为</text><text x="285.96" y="575.54" font-size="9.00" class="sc-lorabold">1</text><text x="291.98" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">到</text><text x="303.35" y="575.54" font-size="9.00" class="sc-lorabold">7</text><text x="307.57 316.57 325.57" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">，其中</text><text x="336.93" y="575.54" font-size="9.00" class="sc-lorabold">4</text><text x="344.22 353.22 362.22 371.22" y="575.54" font-size="9.00" class="sc-notoserifcjkscbold">为中性。</text><text x="380.22 386.51 388.96 393.55 398.93 404.31 409.19 411.55 416.66 421.92 427.38 432.85 437.66 441.14 443.51 448.42 450.63" y="575.54" font-size="9.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="457.90 466.90 475.90 484.90 493.90 502.90 511.90 520.90 529.90" y="575.54" font-size="9.00" class="sc-notoserifcjksc">的效价处于以往模型</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="587.24" font-size="9.00" class="sc-notoserifcjksc">的范围之内，唤醒度则略低。所有绝对差异都很小。</text><text x="72.00 79.12 82.50 89.97 93.35" y="632.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90 116.90 129.90 142.90 155.90 168.90 181.90 194.90" y="632.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00 83.00 94.00 105.00" y="664.27" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 176.32 183.00 188.09 191.18 197.53 204.02 208.28" y="664.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">Anthropic Insights</text><text x="213.37 224.37 235.37" y="664.27" font-size="11.00" class="sc-notoserifcjksc">（原名</text><text x="249.26 256.95 259.95 263.04" y="664.27" font-size="11.00" class="sc-loraregular">Clio</text><text x="269.47 280.47 291.47" y="664.27" font-size="11.00" class="sc-notoserifcjksc">）考察</text><text x="305.36 313.05 316.05 321.66 328.22 334.80 340.76 343.66 349.89 356.33 363.01 369.68 375.57 379.82 382.72 388.71 391.42" y="664.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="400.31" y="664.27" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="414.20 420.05 423.04 428.65 435.22 441.80 447.76 450.47 456.14" y="664.27" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="462.13" y="664.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.02 483.71 486.70 492.31 498.88 505.46 511.42 514.31 522.00 528.43 535.01" y="664.27" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="72.00 83.00 94.00 105.00" y="679.89" font-size="11.00" class="sc-notoserifcjksc">上部署前</text><text x="118.89 125.78 133.37" y="679.89" font-size=
