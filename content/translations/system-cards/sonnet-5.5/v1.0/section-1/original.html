.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p009.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 9 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">9</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="116.21" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="180.83 187.72 194.30 198.55 205.14 209.83 216.26 222.83 225.92" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="234.67" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="377.67 380.66 386.34 391.04 397.07 403.03 405.93 408.92 414.60 421.27 427.36 433.92 439.60 445.63 451.59 454.48 464.32 470.75 477.33 483.29" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="486.28" y="116.21" font-size="11.00" class="sc-notoserifcjksc">），以全</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">面开放的方式发布。在本系统卡（</text><text x="237.00 243.18 248.99 254.08 258.34 264.30 274.14 277.03 284.72 290.39 295.08" y="131.83" font-size="11.00" class="sc-loraregular">System Card</text><text x="301.66" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了在七个领域开展的一系列部署</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">前评估的结果：负责任扩展政策（</text><text x="237.00 243.83 249.79 254.89 261.45 267.89 274.57 279.66 282.75 289.15 292.14 298.11 301.00 307.24 313.07 318.74 321.73 324.82 331.50 337.58 340.48 347.03 353.47 356.46 359.55 365.35" y="147.45" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="371.16" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无</text><text x="72.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">害性、智能体安全、对齐（</text><text x="204.00 209.68 212.67 215.76 221.84 228.52 238.35 244.32 250.89" y="163.07" font-size="11.00" class="sc-loraregular">alignment</text><text x="255.15" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）、模型福祉（</text><text x="332.15 341.98 348.42 355.00 360.96 363.95 366.84 375.52 381.49 384.48 388.20 393.87 398.56" y="163.07" font-size="11.00" class="sc-loraregular">model welfare</text><text x="404.52" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="225.13" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="225.13" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00" y="240.75" font-size="11.00" class="sc-notoserifcjksc">公开数据集，以及其他来源（例如由其他模型生成的合成数据）。该混合数据还可能包括来自反</text><text x="72.00" y="256.37" font-size="11.00" class="sc-notoserifcjksc">馈或错误报告的用户数据，或用户明确允许用于训练的数据。在训练过程中，我们采用了多种数</text><text x="72.00" y="271.99" font-size="11.00" class="sc-notoserifcjksc">据清洗和过滤方法，包括去重和分类。我们使用一个名为</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.11 391.96 398.39" y="271.99" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="405.54" y="271.99" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站</text><text x="72.00" y="287.61" font-size="11.00" class="sc-notoserifcjksc">获取训练数据。该爬虫遵循业界标准的最佳实践，遵守网站运营者所设置的</text><text x="435.00 439.40 444.09 450.52 456.92 463.36 467.61 472.71 475.28 479.67 485.50 489.76" y="287.61" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="493.60" y="287.61" font-size="11.00" class="sc-notoserifcjksc">指令，这</text><text x="72.00" y="303.23" font-size="11.00" class="sc-notoserifcjksc">些指令表明他们是否允许抓取其网站内容。我们不会访问受密码保护的页面，也不会访问需要登</text><text x="72.00" y="318.85" font-size="11.00" class="sc-notoserifcjksc">录或</text><text x="96.89 104.47 111.36 118.02 125.06 132.75 141.33" y="318.85" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="151.11" y="318.85" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数据开展尽职调查。该爬虫以透明方式运</text><text x="72.00" y="334.47" font-size="11.00" class="sc-notoserifcjksc">行；网站运营者可以轻松识别它何时抓取过其网页，并向我们表明其偏好。</text><text x="72.00" y="435.62" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 177.24 183.67 190.35 197.03 202.91 207.17 210.06 216.06 218.76" y="435.62" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="227.65" y="435.62" font-size="11.00" class="sc-notoserifcjksc">经过了严格的后训练和微调，旨在使其成为一个行为符合</text><text x="505.54 513.23 516.22 521.83 528.40 534.98" y="435.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00" y="451.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="94.00" y="451.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.18 141.89 146.99 149.88 155.68 162.11 168.79 173.88 178.14 181.41 185.66 192.23 196.49 199.58 206.01" y="451.24" font-size="11.00" class="sc-loraregular">Claude’s constitution</text><text x="212.69" y="451.24" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="333.69 341.38 344.37 349.98 356.55 363.13" y="451.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="371.98" y="451.24" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使用与用户输</text><text x="72.00" y="466.86" font-size="11.00" class="sc-notoserifcjksc">入相同的语言进行回复。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="516.58" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65" y="516.58" font-size="11.00" class="sc-notoserifcjksc">可靠的知识截止日期为</text><text x="241.54 247.45 254.20 260.11" y="516.58" font-size="11.00" class="sc-loraregular">2026</text><text x="269.36" y="516.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="283.26" y="516.58" font-size="11.00" class="sc-loraregular">6</text><text x="292.51" y="516.58" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00" y="550.37" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="550.37" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="576.93" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="576.93" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00" y="592.55" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="592.55" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83" y="592.55" font-size="11.00" class="sc-notoserifcjksc">只会与符合以下条件的平台合作：认同我们为工作者提供公平且合乎道德</text><text x="72.00" y="608.17" font-size="11.00" class="sc-notoserifcjksc">的报酬这一理念，并且无论身处何地，都致力于践行安全的工作场所规范，遵循我们在采购合同</text><text x="72.00" y="623.79" font-size="11.00" class="sc-notoserifcjksc">中详细规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="505.54" y="426.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="505.54" y="426.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="442.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="116.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="116.76" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36" y="116.76" font-size="11.00" class="sc-notoserifcjksc">）详细规定了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景中使用的要求。</text><text x="72.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00 363.92 368.60 375.04 381.62 385.87 388.97 394.93 399.69 402.58 410.27 416.71 426.54 433.11 436.10 439.19 444.87 451.54 457.34 463.30 466.20 472.11 476.80 482.48 492.31 498.23 506.91 513.34 518.06" y="165.34" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="523.97" y="165.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 77.95 85.64" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="91.67" y="180.96" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="333.67 339.62 347.31" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="356.23" y="180.96" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前在各主要风险类别中</text><text x="72.00" y="196.58" font-size="11.00" class="sc-notoserifcjksc">开展系统性风险评估与缓解的技术和组织规程。</text><text x="303.00 308.95 316.64" y="196.58" font-size="11.00" class="sc-loraregular">FCF</text><text x="325.56" y="196.58" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的合规框架，这些</text><text x="72.00" y="212.20" font-size="11.00" class="sc-notoserifcjksc">制度包括加利福尼亚州的《前沿人工智能透明度法案》（</text><text x="347.00 353.88 358.56 364.24 370.91 376.01 382.57 388.25 392.94 398.90 405.57 411.37 417.18 420.07 423.16 429.84 432.73 438.65 443.34 449.77 456.35 460.61 463.70 469.66 474.42 477.32 484.20 487.89 490.78 497.67 503.46" y="212.20" font-size="11.00" class="sc-loraregular">Transparency in Frontier AI Act</text><text x="507.72" y="212.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="518.72" y="212.20" font-size="11.00" class="sc-loraregular">SB</text><text x="72.00" y="227.82" font-size="11.00" class="sc-loraregular">53</text><text x="84.12" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）以及《欧盟人工智能法案》（</text><text x="238.12 244.96 253.24 256.13 263.02 266.70 269.59 276.48 282.28" y="227.82" font-size="11.00" class="sc-loraregular">EU AI Act</text><text x="286.53" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）下的《通用人工智能行为准则》（</text><text x="462.53 470.90 476.87 483.54 489.51 494.19 499.87 502.86" y="227.82" font-size="11.00" class="sc-loraregular">General-</text><text x="72.00 78.67 85.23 90.00 96.56 103.00 108.09 114.05 116.95 123.83 127.52 130.41 138.10 144.53 151.11 157.07 159.97 166.35 170.07 172.96 179.62 184.31 189.99 195.78 200.04 203.13 208.93" y="243.44" font-size="11.00" class="sc-loraregular">Purpose AI Code of Practice</text><text x="214.89" y="243.44" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="278.68" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59" y="278.68" font-size="11.00" class="sc-notoserifcjksc">通用人工智能模型在欧洲经济区（</text><text x="442.59 449.33 455.90 460.59 467.02 473.59 479.53 485.20" y="278.68" font-size="11.00" class="sc-loraregular">European</text><text x="72.00 78.84 84.64 91.07 97.75 104.19 114.02 117.11 122.96 125.86 132.74 137.43 143.37" y="294.30" font-size="11.00" class="sc-loraregular">Economic Area</text><text x="149.04" y="294.30" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="327.26" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="327.26" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="361.04" font-size="14.00" class="sc-poppinssemibold">1.4</text><text x="93.29" y="361.04" font-size="14.00" class="sc-notosanscjkscbold">模型评估</text><text x="72.00" y="387.60" font-size="11.00" class="sc-notoserifcjksc">在训练过程中的不同时间点，我们会为模型保存不同的</text><text x="336.00" y="387.60" font-size="11.00" class="sc-loraregular">“</text><text x="340.40" y="387.60" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="362.40" y="387.60" font-size="11.00" class="sc-loraregular">”</text><text x=" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">传统</text><text x="132.89" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="146.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="160.25" y="82.61" font-size="11.00" class="sc-loraregular">ML</text><text x="179.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">开发、研究或一般编程中的绝大多数情形。这些分类器触发的拦截将回退</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="121.89 128.13 134.57 141.24 147.92 153.80 158.06 160.95" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="166.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药研发的拦截分类器，其行为与</text><text x="407.89 415.58 418.57 424.18 430.75 437.33 443.29 446.18 454.92 461.48 468.05 473.14 476.04 482.03 484.74" y="114.99" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="493.63" y="114.99" font-size="11.00" class="sc-notoserifcjksc">等先前模</text><text x="108.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">型类似，且没有回退模型。</text><text x="108.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们用于防止对我们的模型进行蒸馏（例如试图提取模型的隐藏推理）的分类器，将在</text><text x="108.00 114.24 120.67 127.35 134.03 139.91 144.17 147.06 153.06 155.76" y="179.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="164.65" y="179.19" font-size="11.00" class="sc-notoserifcjksc">上直接拦截，且没有回退模型。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上述回退行为适用于我们的第一方产品，以及在我们的</text><text x="338.89 345.78 352.39" y="212.15" font-size="11.00" class="sc-loraregular">API</text><text x="358.97" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上选择启用此类回退的开发者；通过</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">其他平台和提供商使用我们模型的流量可能会出现不同的行为。我们所有的拦截类安全防护措施</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">均以透明拦截方式运行，不会暗中更改模型的回复。</text><text x="72.00" y="294.50" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="321.06" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94" y="321.06" font-size="11.00" class="sc-notoserifcjksc">的大多数评估由</text><text x="246.83 253.72 260.30 264.55 271.14 275.83 282.27 288.83 291.92" y="321.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="300.67" y="321.06" font-size="11.00" class="sc-notoserifcjksc">内部完成。不过，我们感谢多家外部测试方对该</text><text x="72.00" y="336.68" font-size="11.00" class="sc-notoserifcjksc">模型开展评估并与我们分享其结果。他们的具体贡献在本系统卡的相关章节中加以说明。</text></svg></div>
