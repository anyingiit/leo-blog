0 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">前评估的结果：负责任扩展政策（</text><text x="237.00 243.83 249.79 254.89 261.45 267.89 274.57 279.66 282.75 289.15 292.14 298.11 301.00 307.24 313.07 318.74 321.73 324.82 331.50 337.58 340.48 347.03 353.47 356.46 359.55 365.35" y="147.45" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="371.16 382.16 393.16 404.16 415.16 426.16 437.16 448.16 459.16 470.16 481.16 492.16 503.16 514.16 525.16" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">害性、智能体安全、对齐（</text><text x="204.00 209.68 212.67 215.76 221.84 228.52 238.35 244.32 250.89" y="163.07" font-size="11.00" class="sc-loraregular">alignment</text><text x="255.15 266.15 277.15 288.15 299.15 310.15 321.15" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）、模型福祉（</text><text x="332.15 341.98 348.42 355.00 360.96 363.95 366.84 375.52 381.49 384.48 388.20 393.87 398.56" y="163.07" font-size="11.00" class="sc-loraregular">model welfare</text><text x="404.52 415.52 426.52 437.52 448.52 459.52" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00 77.07 80.71" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="225.13" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94 243.94 254.94 265.94 276.94 287.94 298.94 309.94 320.94 331.94 342.94 353.94 364.94 375.94 386.94 397.94 408.94 419.94 430.94 441.94 452.94 463.94 474.94 485.94 496.94 507.94 518.94 529.94" y="225.13" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="240.75" font-size="11.00" class="sc-notoserifcjksc">公开数据集，以及其他来源（例如由其他模型生成的合成数据）。该混合数据还可能包括来自反</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="256.37" font-size="11.00" class="sc-notoserifcjksc">馈或错误报告的用户数据，或用户明确允许用于训练的数据。在训练过程中，我们采用了多种数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="271.99" font-size="11.00" class="sc-notoserifcjksc">据清洗和过滤方法，包括去重和分类。我们使用一个名为</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.11 391.96 398.39" y="271.99" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="271.99" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="287.61" font-size="11.00" class="sc-notoserifcjksc">获取训练数据。该爬虫遵循业界标准的最佳实践，遵守网站运营者所设置的</text><text x="435.00 439.40 444.09 450.52 456.92 463.36 467.61 472.71 475.28 479.67 485.50 489.76" y="287.61" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="493.60 504.60 515.60 526.60" y="287.61" font-size="11.00" class="sc-notoserifcjksc">指令，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="303.23" font-size="11.00" class="sc-notoserifcjksc">些指令表明他们是否允许抓取其网站内容。我们不会访问受密码保护的页面，也不会访问需要登</text><text x="72.00 83.00" y="318.85" font-size="11.00" class="sc-notoserifcjksc">录或</text><text x="96.89 104.47 111.36 118.02 125.06 132.75 141.33" y="318.85" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="151.11 162.11 173.11 184.11 195.11 206.11 217.11 228.11 239.11 250.11 261.11 272.11 283.11 294.11 305.11 316.11 327.11 338.11 349.11 360.11 371.11 382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11" y="318.85" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数据开展尽职调查。该爬虫以透明方式运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="334.47" font-size="11.00" class="sc-notoserifcjksc">行；网站运营者可以轻松识别它何时抓取过其网页，并向我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="435.62" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 177.24 183.67 190.35 197.03 202.91 207.17 210.06 216.06 218.76" y="435.62" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="227.65 238.65 249.65 260.65 271.65 282.65 293.65 304.65 315.65 326.65 337.65 348.65 359.65 370.65 381.65 392.65 403.65 414.65 425.65 436.65 447.65 458.65 469.65 480.65 491.65" y="435.62" font-size="11.00" class="sc-notoserifcjksc">经过了严格的后训练和微调，旨在使其成为一个行为符合</text><text x="505.54 513.23 516.22 521.83 528.40 534.98" y="435.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00 83.00" y="451.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="94.00" y="451.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.18 141.89 146.99 149.88 155.68 162.11 168.79 173.88 178.14 181.41 185.66 192.23 196.49 199.58 206.01" y="451.24" font-size="11.00" class="sc-loraregular">Claude’s constitution</text><text x="212.69 223.69 234.69 245.69 256.69 267.69 278.69 289.69 300.69 311.69 322.69" y="451.24" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="333.69 341.38 344.37 349.98 356.55 363.13" y="451.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="371.98 382.98 393.98 404.98 415.98 426.98 437.98 448.98 459.98 470.98 481.98 492.98 503.98 514.98 525.98" y="451.24" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使用与用户输</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="466.86" font-size="11.00" class="sc-notoserifcjksc">入相同的语言进行回复。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.06 119.76" y="516.58" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="128.65 139.65 150.65 161.65 172.65 183.65 194.65 205.65 216.65 227.65" y="516.58" font-size="11.00" class="sc-notoserifcjksc">可靠的知识截止日期为</text><text x="241.54 247.45 254.20 260.11" y="516.58" font-size="11.00" class="sc-loraregular">2026</text><text x="269.36" y="516.58" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="283.26" y="516.58" font-size="11.00" class="sc-loraregular">6</text><text x="292.51 303.51" y="516.58" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00 77.07 80.71" y="550.37" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08 106.08 120.08 134.08 148.08" y="550.37" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="576.93" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="576.93" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00 83.00 94.00 105.00 116.00" y="592.55" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="592.55" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="592.55" font-size="11.00" class="sc-notoserifcjksc">只会与符合以下条件的平台合作：认同我们为工作者提供公平且合乎道德</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="608.17" font-size="11.00" class="sc-notoserifcjksc">的报酬这一理念，并且无论身处何地，都致力于践行安全的工作场所规范，遵循我们在采购合同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="623.79" font-size="11.00" class="sc-notoserifcjksc">中详细规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="505.54" y="426.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="505.54" y="426.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="442.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="442.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="442.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="108.00 119.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">传统</text><text x="132.89 139.78" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="146.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="160.25 170.35" y="82.61" font-size="11.00" class="sc-loraregular">ML</text><text x="179.60 190.60 201.60 212.60 223.60 234.60 245.60 256.60 267.60 278.60 289.60 300.60 311.60 322.60 333.60 344.60 355.60 366.60 377.60 388.60 399.60 410.60 421.60 432.60 443.60 454.60 465.60 476.60 487.60 498.60 509.60 520.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">开发、研究或一般编程中的绝大多数情形。这些分类器触发的拦截将回退</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="121.89 128.13 134.57 141.24 147.92 153.80 158.06 160.95" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="166.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药研发的拦截分类器，其行为与</text><text x="407.89 415.58 418.57 424.18 430.75 437.33 443.29 446.18 454.92 461.48 468.05 473.14 476.04 482.03 484.74" y="114.99" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="493.63 504.63 515.63 526.63" y="114.99" font-size="11.00" class="sc-notoserifcjksc">等先前模</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">型类似，且没有回退模型。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们用于防止对我们的模型进行蒸馏（例如试图提取模型的隐藏推理）的分类器，将在</text><text x="108.00 114.24 120.67 127.35 134.03 139.91 144.17 147.06 153.06 155.76" y="179.19" font-size="11.00" class="sc-loraregular">Sonnet 5.5</text><text x="164.65 175.65 186.65 197.65 208.65 219.65 230.65 241.65 252.65 263.65 274.65 285.65 296.65 307.65" y="179.19" font-size="11.00" class="sc-notoserifcjksc">上直接拦截，且没有回退模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上述回退行为适用于我们的第一方产品，以及在我们的</text><text x="338.89 345.78 352.39" y="212.15" font-size="11.00" class="sc-loraregular">API</text><text x="358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="212.15" font-size="11.00" class="sc-notoserifcjksc">上选择启用此类回退的开发者；通过</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">其他平台和提供商使用我们模型的流量可能会出现不同的行为。我们所有的拦截类安全防护措施</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">均以透明拦截方式运行，不会暗中更改模型的回复。</text><text x="72.00 77.07 80.71" y="294.50" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00 107.00 121.00 135.00" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.35 158.05" y="321.06" font-size="11.00" class="sc-loraregular">Claude Sonnet 5.5</text><text x="166.94 177.94 188.94 199.94 210.94 221.94 232.94" y="321.06" font-size="11.00" class="sc-notoserifcjksc">的大多数评估由</text><text x="246.83 253.72 260.30 264.55 271.14 275.83 282.27 288.83 291.92" y="321.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="300.67 311.67 322.67 333.67 344.67 355.67 366.67 377.67 388.67 399.67 410.67 421.67 432.67 443.67 454.67 465.67 476.67 487.67 498.67 509.67 520.67" y="321.06" font-size="11.00" class="sc-notoserifcjksc">内部完成。不过，我们感谢多家外部测试方对该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="336.68" font-size="11.00" class="sc-notoserifcjksc">模型开展评估并与我们分享其结果。他们的具体贡献在本系统卡的相关章节中加以说明。</text></svg></div>
