<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p211.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 211 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">在数千项业务决策中展现出持续的连贯性和战略规划能力。为了取得好成绩，模型必须成功地通</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">过电子邮件寻找供应商并与之谈判、管理库存、优化定价，并适应动态的市场条件。</text><text x="72.00" y="147.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.43" y="147.39" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="170.32" y="147.39" font-size="11.00" class="sc-loraregular">Max</text><text x="194.82" y="147.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.71" y="147.39" font-size="11.00" class="sc-loraregular sc-k">High</text><text x="236.13" y="147.39" font-size="11.00" class="sc-notoserifcjksc">两个推理强度档位运行。</text><text x="357.13 363.89 369.85 376.52 383.10 386.19 392.87 398.95 404.33 411.17 417.14 423.81 429.67" y="147.39" font-size="11.00" class="sc-loraregular">Vending-Bench</text><text x="439.15" y="147.39" font-size="11.00" class="sc-notoserifcjksc">有自己的上下文管理</text><text x="72.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">系统，这意味着</text><text x="151.89" y="163.01" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="163.01" font-size="11.00" class="sc-notoserifcjksc">的上下文编辑功能未被启用。</text><text x="333.18" y="163.01" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="379.32" y="163.01" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="393.21" y="163.01" font-size="11.00" class="sc-loraregular">Max</text><text x="417.71" y="163.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下的最终余额为</text><text x="72.00 76.00 82.66 85.43 91.79 97.65" y="178.63" font-size="11.00" class="sc-loraregular">10,937</text><text x="105.63" y="178.63" font-size="11.00" class="sc-notoserifcjksc">美元，在</text><text x="152.52" y="178.63" font-size="11.00" class="sc-loraregular sc-k">High</text><text x="179.94" y="178.63" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="248.84 253.42 256.20 262.29 267.36" y="178.63" font-size="11.00" class="sc-loraregular">7,971</text><text x="274.27" y="178.63" font-size="11.00" class="sc-notoserifcjksc">美元，而此前的</text><text x="354.16" y="178.63" font-size="11.00" class="sc-loraregular sc-k">SOTA</text><text x="382.66" y="178.63" font-size="11.00" class="sc-notoserifcjksc">（最先进水平）为</text><text x="473.56" y="178.63" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="521.22" y="178.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 78.18 80.79 87.62 91.62" y="194.25" font-size="11.00" class="sc-loraregular">8,018</text><text x="100.71" y="194.25" font-size="11.00" class="sc-notoserifcjksc">美元。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33" y="258.36" font-size="11.00" class="sc-loraregular">GDPval-AA</text><text x="129.21" y="254.69" font-size="6.60" class="sc-loraregular">62</text><text x="139.46" y="258.36" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="238.16" y="258.36" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真实世</text><text x="72.00" y="273.98" font-size="11.00" class="sc-notoserifcjksc">界专业任务上测试</text><text x="162.89" y="273.98" font-size="11.00" class="sc-loraregular">AI</text><text x="176.36" y="273.98" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="289.25" y="273.98" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="330.65" y="273.98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="341.65" y="273.98" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDPval</text><text x="382.10" y="273.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="437.10" y="270.31" font-size="6.60" class="sc-loraregular">60</text><text x="445.01" y="273.98" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="469.91" y="273.98" font-size="11.00" class="sc-loraregular">220</text><text x="491.45" y="273.98" font-size="11.00" class="sc-notoserifcjksc">个任务，</text><text x="72.00" y="289.60" font-size="11.00" class="sc-notoserifcjksc">涵盖</text><text x="96.89" y="289.60" font-size="11.00" class="sc-loraregular">9</text><text x="106.14" y="289.60" font-size="11.00" class="sc-notoserifcjksc">个主要行业的</text><text x="175.04" y="289.60" font-size="11.00" class="sc-loraregular">44</text><text x="189.85" y="289.60" font-size="11.00" class="sc-notoserifcjksc">种职业。任务反映了真实的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="305.22" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="305.22" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="305.22" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，表现通过基于</text><text x="72.00" y="320.84" font-size="11.00" class="sc-notoserifcjksc">模型输出盲评两两比较得出的</text><text x="217.89" y="320.84" font-size="11.00" class="sc-loraregular">Elo</text><text x="237.06" y="320.84" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="72.00" y="666.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.27 112.37 117.90 121.37 123.74 130.53 137.23 142.98 147.79 152.51 155.23 159.47 165.70 171.71 174.08 179.69 182.50" y="666.21" font-size="9.00" class="sc-lorabold">8.10.5.A] GDPval-AA Elo</text><text x="189.96" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">评分。</text><text x="216.96" y="666.21" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="286.04" y="666.21" font-size="9.00" class="sc-notoserifcjksc">领先</text><text x="306.41" y="666.21" font-size="9.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="340.29" y="666.21" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="349.29" y="666.21" font-size="9.00" class="sc-loraregular sc-k">‘xhigh’</text><text x="375.94" y="666.21" font-size="9.00" class="sc-notoserifcjksc">）约</text><text x="396.31" y="666.21" font-size="9.00" class="sc-loraregular">79</text><text x="408.02" y="666.21" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="419.39" y="666.21" font-size="9.00" class="sc-loraregular">Elo</text><text x="435.07" y="666.21" font-size="9.00" class="sc-notoserifcjksc">分，意味着约</text><text x="491.44" y="666.21" font-size="9.00" class="sc-loraregular">61.2%</text><text x="517.16" y="666.21" font-size="9.00" class="sc-notoserifcjksc">的两</text><text x="72.00" y="677.91" font-size="9.00" class="sc-notoserifcjksc">两比较胜率。评估由</text><text x="229.48" y="677.91" font-size="9.00" class="sc-notoserifcjksc">独立运行。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="222.00" y="707.25" width="155.25" height="12.75" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="150.46" y="249.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="150.46" y="249.56" width="43.54" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="194.00" y="249.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="196.89" y="249.56" width="41.26" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="341.65" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="341.65" y="265.18" width="37.55" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="379.21" y="265.18" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="382.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="393.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="393.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="404.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="404.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="415.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="415.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="426.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="426.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="72.00 78.89 85.79 93.27 98.65 105.48 113.86" y="110.55" font-size="11.00" class="sc-loraregular">ARC-AGI</text><text x="117.54" y="106.88" font-size="6.60" class="sc-loraregular">63</text><text x="127.92" y="110.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.82 159.70 166.61 174.30 177.19 183.86 188.62 191.71 197.25 203.21 206.10 211.96 218.40 224.97 231.64 238.22 243.82 248.08 251.17 257.60" y="110.55" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="267.18" y="110.55" font-size="11.00" class="sc-notoserifcjksc">开发的流体智力基准测试，旨在衡量</text><text x="446.08" y="110.55" font-size="11.00" class="sc-loraregular">AI</text><text x="459.54" y="110.55" font-size="11.00" class="sc-notoserifcjksc">模型在仅给出少</text><text x="72.00" y="126.17" font-size="11.00" class="sc-notoserifcjksc">量（通常</text><text x="118.89 124.60 131.09" y="126.17" font-size="11.00" class="sc-loraregular">2–3</text><text x="140.11" y="126.17" font-size="11.00" class="sc-notoserifcjksc">个）示例的情况下对新颖模式进行推理的能力。模型会获得若干满足某种隐藏关系</text><text x="72.00" y="141.79" font-size="11.00" class="sc-notoserifcjksc">的网格输入</text><text x="127.00" y="141.79" font-size="11.00" class="sc-loraregular">-</text><text x="132.38" y="141.79" font-size="11.00" class="sc-notoserifcjksc">输出对，任务是推断出新输入网格所对应的输出。该基准测试有两个变体：</text><text x="495.38" y="141.79" font-size="11.00" class="sc-loraregular sc-k">ARC-</text><text x="72.00" y="157.41" font-size="11.00" class="sc-loraregular sc-k">AGI-1</text><text x="102.70" y="157.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="116.59 123.48 130.39 137.87 143.25 150.08 158.45 161.96 166.99" y="157.41" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="172.89" y="157.41" font-size="11.00" class="sc-notoserifcjksc">。（</text><text x="194.89 201.78 208.69 216.38 219.27 225.93 230.70 233.79 239.32 245.28 248.18 254.04 260.47 267.04 273.72 280.30 285.90 290.15 293.24 299.68" y="157.41" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="309.26" y="157.41" font-size="11.00" class="sc-notoserifcjksc">还有另一个</text><text x="367.15 374.04 380.95 388.43 393.80 400.64 409.01 412.52 417.63" y="157.41" font-size="11.00" class="sc-loraregular">ARC-AGI-3</text><text x="426.65" y="157.41" font-size="11.00" class="sc-notoserifcjksc">基准测试，截至发布时</text><text x="72.00" y="173.03" font-size="11.00" class="sc-notoserifcjksc">尚未在该模型上运行。）这些测试使用私有验证集，以确保不同模型之间的一致性和公平性。</text><text x="72.00" y="256.50" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69 107.17 112.55 119.38 127.75 131.26 136.35" y="256.50" font-size="11.00" class="sc-loraregular">ARC-AGI-1</text><text x="143.25" y="256.50" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="165.25" y="256.50" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="249.67" y="256.50" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="296.57" y="256.50" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="344.23" y="256.50" font-size="11.00" class="sc-notoserifcjksc">相近，在</text><text x="391.12" y="256.50" font-size="11.00" class="sc-loraregular sc-k">High</text><text x="418.54" y="256.50" font-size="11.00" class="sc-notoserifcjksc">推理强度档位下达到</text><text x="72.00" y="272.12" font-size="11.00" class="sc-loraregular">93.5%</text><text x="102.76" y="272.12" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="127.65" y="272.12" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="175.31" y="272.12" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="189.21" y="272.12" font-size="11.00" class="sc-loraregular sc-k">94.0%</text><text x="220.47" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。两个模型在该推理强度档位下的得分均高于</text><text x="443.36" y="272.12" font-size="11.00" class="sc-loraregular">Max</text><text x="464.96" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。我们认为，</text><text x="72.00" y="287.74" font-size="11.00" class="sc-notoserifcjksc">这是由于在最高思考档位下出现了上下文耗尽。</text><text x="72.00" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69 107.17 112.55 119.38 127.75 131.26 136.28" y="321.27" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="145.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="167.08" y="321.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="251.51" y="321.27" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="265.40" y="321.27" font-size="11.00" class="sc-loraregular">Max</text><text x="289.90" y="321.27" font-size="11.00" class="sc-notoserifcjksc">思考档位下</text><text x="347.79" y="321.27" font-size="11.00" class="sc-loraregular">75.83%</text><text x="386.34" y="321.27" font-size="11.00" class="sc-notoserifcjksc">的成绩创下</text><text x="444.23" y="321.27" font-size="11.00" class="sc-loraregular">Opus</text><text x="474.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">级模型的新高</text><text x="72.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">分。在较低的思考档位下，它的表现与</text><text x="261.89" y="336.89" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="309.56" y="336.89" font-size="11.00" class="sc-notoserifcjksc">相当。</text><a href="https://arxiv.org/abs/2505.11831" rel="noopener"><rect x="150.00" y="707.25" width="153.00" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p213.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 213 页"><text x="72.00" y="385.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 109.03" y="385.93" font-size="9.00" class="sc-lorabold">8.11.A]</text><text x="114.87" y="385.93" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="207.23 213.25 219.38 225.32 229.56 235.40 242.18 245.46 249.43" y="385.93" font-size="9.00" class="sc-lorabold">ARC-AGI-2</text><text x="256.60" y="385.93" font-size="9.00" class="sc-notoserifcjkscbold">表现。</text><text x="283.60" y="385.93" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="294.97 300.60 306.25 312.37 316.77 322.36 329.21 332.08 336.20" y="385.93" font-size="9.00" class="sc-loraregular">ARC-AGI-2</text><text x="343.40" y="385.93" font-size="9.00" class="sc-notoserifcjksc">上，</text><text x="361.40" y="385.93" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="430.47" y="385.93" font-size="9.00" class="sc-notoserifcjksc">以</text><text x="441.84" y="385.93" font-size="9.00" class="sc-loraregular">Max</text><text x="461.88" y="385.93" font-size="9.00" class="sc-notoserifcjksc">思考档位下</text><text x="509.25" y="385.93" font-size="9.00" class="sc-loraregular">75.83%</text><text x="72.00" y="397.63" font-size="9.00" class="sc-notoserifcjksc">的成绩创下</text><text x="119.37" y="397.63" font-size="9.00" class="sc-loraregular">Opus</text><text x="143.79" y="397.63" font-size="9.00" class="sc-notoserifcjksc">级模型的新高分。</text><text x="72.00" y="432.58" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="432.58" font-size="14.00" class="sc-notosanscjkscbold">多语言表现</text><text x="72.00" y="465.15" font-size="11.00" class="sc-notoserifcjksc">我们在三个多语言基准测试上评估了</text><text x="250.89" y="465.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="332.43" y="465.15" font-size="11.00" class="sc-notoserifcjksc">，即</text><text x="357.32" y="465.15" font-size="11.00" class="sc-loraregular sc-k">Cohere Labs</text><text x="424.20" y="465.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="438.09" y="465.15" font-size="11.00" class="sc-loraregular">Global</text><text x="72.00" y="480.77" font-size="11.00" class="sc-loraregular sc-k">MMLU</text><text x="106.71" y="480.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="117.71" y="480.77" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="160.78" y="480.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="171.78" y="477.10" font-size="6.60" class="sc-loraregular">64</text><text x="182.07" y="480.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="195.96" y="480.77" font-size="11.00" class="sc-loraregular sc-k">INCLUDE</text><text x="247.99" y="480.77" font-size="11.00" class="sc-notoserifcjksc">基准测试</text><text x="291.99" y="477.10" font-size="6.60" class="sc-loraregular">65</text><text x="299.40" y="480.77" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="335.29" y="480.77" font-size="11.00" class="sc-loraregular sc-k">AI4Bharat</text><text x="388.27" y="480.77" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="402.16" y="480.77" font-size="11.00" class="sc-loraregular sc-k">Multi-task Indic Language</text><text x="72.00" y="496.39" font-size="11.00" class="sc-loraregular sc-k">Understanding Benchmark</text><text x="209.33" y="496.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="220.33" y="496.39" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="248.63" y="496.39" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="259.63" y="492.72" font-size="6.60" class="sc-loraregular">66</text><text x="267.26" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p214.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 214 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">关注</text><text x="96.89" y="82.63" font-size="11.00" class="sc-loraregular">10</text><text x="110.62" y="82.63" font-size="11.00" class="sc-notoserifcjksc">种印度语言（孟加拉语、古吉拉特语、印地语、卡纳达语、马拉雅拉姆语、马拉地语、奥</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">里亚语、旁遮普语、泰米尔语和泰卢固语）以及英语，测试植根文化背景的知识理解。</text><text x="490.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">INCLUDE</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">涵盖</text><text x="96.89" y="113.87" font-size="11.00" class="sc-loraregular">44</text><text x="111.71" y="113.87" font-size="11.00" class="sc-notoserifcjksc">种语言，题目取自各地区的学术和职业考试，强调语言内与文化内知识，而非翻译内容。</text><text x="72.00" y="175.59" font-size="11.00" class="sc-notoserifcjksc">所有模型均使用结构化</text><text x="184.89" y="175.59" font-size="11.00" class="sc-loraregular sc-k">JSON</text><text x="215.14" y="175.59" font-size="11.00" class="sc-notoserifcjksc">输出进行评估。</text><text x="292.14" y="175.59" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="368.47" y="175.59" font-size="11.00" class="sc-notoserifcjksc">以默认</text><text x="404.37" y="175.59" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="429.87" y="175.59" font-size="11.00" class="sc-notoserifcjksc">档位的动态思考进行评</text><text x="72.00" y="191.21" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="94.00" y="191.21" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="138.31" y="191.21" font-size="11.00" class="sc-notoserifcjksc">在推理强度设为</text><text x="218.20" y="191.21" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="243.71" y="191.21" font-size="11.00" class="sc-notoserifcjksc">的情况下进行评估。</text><text x="342.71" y="191.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="427.14" y="191.21" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考的情</text><text x="72.00" y="206.83" font-size="11.00" class="sc-notoserifcjksc">况下进行评估。</text><text x="149.00" y="206.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="234.95" y="206.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="248.85" y="206.83" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="344.01" y="206.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="357.90" y="206.83" font-size="11.00" class="sc-loraregular sc-k">INCLUDE</text><text x="409.93" y="206.83" font-size="11.00" class="sc-notoserifcjksc">上使用自适应思考，在</text><text x="72.00" y="222.45" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="117.97" y="222.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="131.86" y="222.45" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="163.05" y="222.45" font-size="11.00" class="sc-notoserifcjksc">上使用中等扩展思考（</text><text x="273.05" y="222.45" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="366.01" y="222.45" font-size="11.00" class="sc-notoserifcjksc">）预算进行评估。</text><text x="72.00" y="271.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1 GMMLU</text><text x="158.57" y="271.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00" y="583.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="583.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 128.55 137.29 146.04 151.36" y="583.53" font-size="9.00" class="sc-lorabold">8.12.1.A] GMMLU</text><text x="160.57" y="583.53" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="214.57" y="583.53" font-size= <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p220.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 220 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold">马来语</text><text x="75.25" y="114.12" font-size="10.99" class="sc-notoserifcjkscbold">格鲁吉亚语</text><text x="75.25" y="139.62" font-size="10.99" class="sc-notoserifcjkscbold">马其顿语</text><text x="75.25" y="165.12" font-size="10.99" class="sc-notoserifcjkscbold">越南语</text><text x="75.25" y="190.62" font-size="10.99" class="sc-notoserifcjkscbold">保加利亚语</text><text x="75.25" y="241.62" font-size="10.99" class="sc-notoserifcjkscbold">意大利语</text><text x="75.25" y="292.62" font-size="10.99" class="sc-notoserifcjkscbold">塞尔维亚语</text><text x="75.25" y="318.12" font-size="10.99" class="sc-notoserifcjkscbold">日语</text><text x="75.25" y="369.87" font-size="10.99" class="sc-notoserifcjkscbold">平均（所有语言）</text><text x="72.00" y="391.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="391.05" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="391.05" font-size="9.00" class="sc-lorabold sc-k">8.12.3.B]</text><text x="123.15" y="391.05" font-size="9.00" class="sc-notoserifcjkscbold">按语言划分的</text><text x="179.51" y="391.05" font-size="9.00" class="sc-lorabold sc-k">INCLUDE</text><text x="222.90" y="391.05" font-size="9.00" class="sc-notoserifcjkscbold">结果。</text><text x="249.90" y="391.05" font-size="9.00" class="sc-notoserifcjksc">分数表示模型在</text><text x="315.27" y="391.05" font-size="9.00" class="sc-loraregular">44</text><text x="327.39" y="391.05" font-size="9.00" class="sc-notoserifcjksc">种语言的源自各地区的考试题上的准确率。分数反映</text><text x="72.00" y="402.75" font-size="9.00" class="sc-notoserifcjksc">的是在成功解析的回答上的准确率；一小部分</text><text x="254.37" y="402.75" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="270.79" y="402.75" font-size="9.00" class="sc-notoserifcjksc">调用产生了无效输出，已被排除。</text><text x="405.79" y="402.75" font-size="9.00" class="sc-loraregular sc-k">INCLUDE</text><text x="448.36" y="402.75" font-size="9.00" class="sc-notoserifcjksc">不包含英语子集，因此</text><text x="72.00" y="414.45" font-size="9.00" class="sc-notoserifcjksc">结果以原始准确率报告，并按</text><text x="191.37" y="414.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="260.44" y="414.45" font-size="9.00" class="sc-notoserifcjksc">的表现排序，</text><text x="314.44" y="414.45" font-size="9.00" class="sc-loraregular">“</text><text x="318.04" y="414.45" font-size="9.00" class="sc-notoserifcjksc">平均</text><text x="336.04" y="414.45" font-size="9.00" class="sc-loraregular">”</text><text x="339.18" y="414.45" font-size="9.00" class="sc-notoserifcjksc">行给出所有语言的未加权平均值。每行中的最高分</text><text x="72.00" y="426.15" font-size="9.00" class="sc-notoserifcjksc">以粗体标出。</text><text x="72.00" y="470.89" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.4</text><text x="110.97" y="470.89" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">发现</text><text x="72.00" y="498.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="498.79" font-size="11.00" class="sc-notoserifcjksc">是迄今为止在多语言基准测试上表现最强的公开可用</text><text x="412.32" y="498.79" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="450.61" y="498.79" font-size="11.00" class="sc-notoserifcjksc">模型，在</text><text x="72.00" y="514.41" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="115.08" y="514.41" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="126.08" y="514.41" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="157.26" y="514.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.15" y="514.41" font-size="11.00" class="sc-loraregular sc-k">INCLUDE</text><text x="223.18" y="514.41" font-size="11.00" class="sc-notoserifcjksc">评估上均优于</text><text x="292.08" y="514.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="375.14" y="514.41" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="547.37" font-size="11.00" class="sc-notoserifcjksc">最大的提升出现在低资源非洲语言上，这些语言相对英语的性能下降历来最为明显。</text><text x="479.00" y="547.37" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="524.97" y="547.37" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="72.00" y="562.99" font-size="11.00" class="sc-notoserifcjksc">资源语言平均准确率从</text><text x="184.89" y="562.99" font-size="11.00" class="sc-loraregular">78.4%</text><text x="217.28" y="562.99" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="242.17" y="562.99" font-size="11.00" class="sc-loraregular">86.2%</text><text x="272.89" y="562.99" font-size="11.00" class="sc-notoserifcjksc">，其中齐切瓦语、索马里语、约鲁巴语和伊博语各提升</text><text x="72.00" y="578.61" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89" y="578.61" font-size="11.00" class="sc-loraregular">10</text><text x="99.62" y="578.61" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="113.51" y="578.61" font-size="11.00" class="sc-loraregular">14</text><text x="126.37" y="578.61" font-size="11.00" class="sc-notoserifcjksc">个百分点（表</text><text x="195.27" y="578.61" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.32" y="578.61" font-size="11.00" class="sc-notoserifcjksc">）。与英语的最大差距从</text><text x="354.22" y="578.61" font-size="11.00" class="sc-loraregular sc-k">-22.6%</text><text x="392.47" y="578.61" font-size="11.00" class="sc-notoserifcjksc">缩小至</text><text x="428.37" y="578.61" font-size="11.00" class="sc-loraregular sc-k">-12.1%</text><text x="459.65" y="578.61" font-size="11.00" class="sc-notoserifcjksc">（伊博语），平</text><text x="72.00" y="594.23" font-size="11.00" class="sc-notoserifcjksc">均差距从</text><text x="118.89" y="594.23" font-size="11.00" class="sc-loraregular">-6.1%</text><text x="149.80" y="594.23" font-size="11.00" class="sc-notoserifcjksc">缩小至</text><text x="185.70" y="594.23" font-size="11.00" class="sc-loraregular sc-k">-3.6%</text><text x="215.46" y="594.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="644.52" font-size="11.00" class="sc-notoserifcjksc">与其他前沿模型相比，</text><text x="182.00" y="644.52" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="266.42" y="644.52" font-size="11.00" class="sc-notoserifcjksc">落后于</text><text x="302.32" y="644.52" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="378.65" y="644.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="392.54" y="644.52" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="433.96" y="644.52" font-size="11.00" class="sc-notoserifcjksc">；尤其是</text><text x="480.85" y="644.52" font-size="11.00" class="sc-loraregular">Gemini 3.1</text><text x="72.00" y="660.14" font-size="11.00" class="sc-loraregular sc-k">Pro</text><text x="89.79" y="660.14" font-size="11.00" class="sc-notoserifcjksc">，它在</text><text x="125.68" y="660.14" font-size="11.00" class="sc-loraregular sc-k">GMMLU</text><text x="168.76" y="660.14" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="179.76" y="660.14" font-size="11.00" class="sc-loraregular sc-k">-2.1%</text><text x="206.97" y="660.14" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="231.86" y="660.14" font-size="11.00" class="sc-loraregular sc-k">MILU</text><text x="260.15" y="660.14" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="271.15" y="660.14" font-size="11.00" class="sc-loraregular sc-k">-1.9%</text><text x="298.89" y="660.14" font-size="11.00" class="sc-notoserifcjksc">）上与英语的差距更小，且</text><text x="433.78" y="660.14" font-size="11.00" class="sc-loraregular sc-k">INCLUDE</text><text x="485.81" y="660.14" font-size="11.00" class="sc-notoserifcjksc">准确率更高</text><text x="72.00" y="675.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="675.76" font-size="11.00" class="sc-loraregular sc-k">90.7%</text><text x="113.01" y="675.76" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p221.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 221 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">这三个基准测试均采用多项选择形式，可能无法完全反映真实场景中的流利度、正式程度或语码</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">转换行为。我们正在投入开发更具代表性的多语言评估，同时持续开展研究，以缩小低资源语言</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">上仍然存在的差距。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00" y="191.54" font-size="11.00" class="sc-notoserifcjksc">针对</text><text x="96.89" y="191.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="178.43" y="191.54" font-size="11.00" class="sc-notoserifcjksc">，我们继续扩展评估，以衡量我们模型在计算生物学、结构生物学、有机化</text><text x="72.00" y="207.16" font-size="11.00" class="sc-notoserifcjksc">学、系统发育学和实验方案故障排查等领域的生命科学能力。这些评估由领域专家在内部开发，</text><text x="72.00" y="222.78" font-size="11.00" class="sc-notoserifcjksc">重点关注能够推动基础研究和药物研发中有益应用的能力，与第</text><text x="382.89" y="222.78" font-size="11.00" class="sc-loraregular">2.2</text><text x="400.31" y="222.78" font-size="11.00" class="sc-notoserifcjksc">节中侧重滥用潜力的</text><text x="502.20" y="222.78" font-size="11.00" class="sc-loraregular">CB</text><text x="519.62" y="222.78" font-size="11.00" class="sc-notoserifcjksc">风险</text><text x="72.00" y="238.40" font-size="11.00" class="sc-notoserifcjksc">评估（</text><text x="105.00" y="238.40" font-size="11.00" class="sc-loraregular sc-k">CB risk assessment</text><text x="202.81" y="238.40" font-size="11.00" class="sc-notoserifcjksc">）形成互补。</text><text x="72.00" y="304.89" font-size="11.00" class="sc-notoserifcjksc">尽管这些评估未公开发布，我们在下文对每项评估作简要介绍。除实验方案故障排查外，在所有</text><text x="72.00" y="320.51" font-size="11.00" class="sc-notoserifcjksc">任务中</text><text x="107.89" y="320.51" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="146.18" y="320.51" font-size="11.00" class="sc-notoserifcjksc">都可使用用于代码执行的</text><text x="270.08" y="320.51" font-size="11.00" class="sc-loraregular">bash</text><text x="296.73" y="320.51" font-size="11.00" class="sc-notoserifcjksc">工具以及用于安装所需库的包管理器，且评估时未</text><text x="72.00" y="336.13" font-size="11.00" class="sc-notoserifcjksc">开启扩展思考。在实验方案故障排查中，</text><text x="270.00" y="336.13" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="308.29" y="336.13" font-size="11.00" class="sc-notoserifcjksc">可使用</text><text x="344.18" y="336.13" font-size="11.00" class="sc-loraregular">bash</text><text x="370.84" y="336.13" font-size="11.00" class="sc-notoserifcjksc">工具和网络搜索工具。</text><text x="72.00" y="400.37" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.1</text><text x="107.41" y="400.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">计算生物学</text><text x="72.00" y="464.66" font-size="11.00" class="sc-notoserifcjksc">评估执行生物信息学工作流的能力，涵盖靶向序列分析和长读长序列分析、宏基因组组装以及染</text><text x="501.00" y="480.28" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="495.90" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="118.13" y="495.90" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="154.03" y="495.90" font-size="11.00" class="sc-loraregular sc-k">83.6%</text><text x="187.75" y="495.90" font-size="11.00" class="sc-notoserifcjksc">的得分，相比</text><text x="256.65" y="495.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="342.60" y="495.90" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="356.49" y="495.90" font-size="11.00" class="sc-loraregular">78.8%</text><text x="389.10" y="495.90" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="402.99" y="495.90" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="498.15" y="495.90" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="511.52" font-size="11.00" class="sc-loraregular">73.5%</text><text x="104.36" y="511.52" font-size="11.00" class="sc-notoserifcjksc">有显著提升。</text><text x="170.36" y="511.52" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="293.24" y="511.52" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="329.14" y="511.52" font-size="11.00" class="sc-loraregular">88.1%</text><text x="360.67" y="511.52" font-size="11.00" class="sc-notoserifcjksc">的高分。</text><text x="72.00" y="610.39" font-size="11.00" class="sc-notoserifcjksc">评估解决困难分析难题的能力，这些难题需要将计算分析与生物学推理交织进行。给定未经处理</text><text x="72.00" y="626.01" font-size="11.00" class="sc-notoserifcjksc">的数据集，模型必须回答诸如从转录组数据中识别被敲除的基因、或判断样本感染了何种病毒等</text><text x="72.00" y="641.62" font-size="11.00" class="sc-notoserifcjksc">问题。对于该基准测试，我们报告独立人类专家能够解决的问题子集（</text><text x="461.15" y="641.62" font-size="11.00" class="sc-notoserifcjksc">），以及人类尚</text><text x="72.00" y="657.24" font-size="11.00" class="sc-notoserifcjksc">未解决但具有客观真值答案的问题子集（</text><text x="270.00" y="657.24" font-size="11.00" class="sc-loraregular sc-k">“Hard”</text><text x="303.67" y="657.24" font-size="11.00" class="sc-notoserifcjksc">）。在</text><text x="382.36" y="657.24" font-size="11.00" class="sc-notoserifcjksc">子集（</text><text x="491.46" y="657.24" font-size="11.00" class="sc-notoserifcjksc">）上，</text><text x="72.00" y="672.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="672.86" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="192.32" y="672.86" font-size="11.00" class="sc-loraregular">78.9%</text><text x="222.20" y="672.86" font-size="11.00" class="sc-notoserifcjksc">，相比之下</text><text x="280.10" y="672.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p222.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 222 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="89.81" y="82.63" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="103.70" y="82.63" font-size="11.00" class="sc-loraregular sc-k">77.4%</text><text x="131.60" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="142.60" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="237.76" y="82.63" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="251.65" y="82.63" font-size="11.00" class="sc-loraregular">71.8%</text><text x="279.19" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="290.19" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="413.07" y="82.63" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="426.96" y="82.63" font-size="11.00" class="sc-loraregular sc-k">82.6%</text><text x="457.57" y="82.63" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="482.47" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Hard</text><text x="510.79" y="82.63" font-size="11.00" class="sc-notoserifcjksc">子集</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Hard subset</text><text x="144.62" y="98.25" font-size="11.00" class="sc-notoserifcjksc">）上，</text><text x="177.62" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="262.05" y="98.25" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="297.94" y="98.25" font-size="11.00" class="sc-loraregular sc-k">20.9%</text><text x="329.14" y="98.25" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="354.03" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="439.98" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="453.88" y="98.25" font-size="11.00" class="sc-loraregular sc-k">23.5%</text><text x="486.91" y="98.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="500.80" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="128.87" y="113.87" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.76" y="113.87" font-size="11.00" class="sc-loraregular sc-k">19.1%</text><text x="172.12" y="113.87" font-size="11.00" class="sc-notoserifcjksc">相比均处于噪声范围内，而</text><text x="307.02" y="113.87" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="429.90" y="113.87" font-size="11.00" class="sc-notoserifcjksc">达到了</text><text x="465.79" y="113.87" font-size="11.00" class="sc-loraregular sc-k">29.6%</text><text x="496.40" y="113.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.3</text><text x="110.49" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结构生物学</text><text x="72.00" y="173.63" font-size="11.00" class="sc-notoserifcjksc">评估理解生物分子结构与功能之间关系的能力。仅给定结构数据和基础工具，模型必须回答有关</text><text x="72.00" y="189.25" font-size="11.00" class="sc-notoserifcjksc">某个生物分子功能的问题。我们采用两种形式进行评估：一种是带有大量干扰选项的多项选择变</text><text x="72.00" y="204.87" font-size="11.00" class="sc-notoserifcjksc">体，另一种是开放式变体。在多项选择变体上，</text><text x="303.00" y="204.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="387.43" y="204.87" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="423.32" y="204.87" font-size="11.00" class="sc-loraregular">98.3%</text><text x="454.26" y="204.87" font-size="11.00" class="sc-notoserifcjksc">，相比</text><text x="490.15" y="204.87" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="220.49" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="119.66" y="220.49" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="133.56" y="220.49" font-size="11.00" class="sc-loraregular">88.3%</text><text x="167.22" y="220.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="181.11" y="220.49" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="276.27" y="220.49" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="290.16" y="220.49" font-size="11.00" class="sc-loraregular">85.3%</text><text x="323.64" y="220.49" font-size="11.00" class="sc-notoserifcjksc">有大幅提升，并与</text><text x="414.53" y="220.49" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="236.11" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="236.11" font-size="11.00" class="sc-loraregular sc-k">98.7%</text><text x="118.32" y="236.11" font-size="11.00" class="sc-notoserifcjksc">相当。在开放式变体上，</text><text x="239.32" y="236.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="323.75" y="236.11" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="359.64" y="236.11" font-size="11.00" class="sc-loraregular sc-k">74.0%</text><text x="389.46" y="236.11" font-size="11.00" class="sc-notoserifcjksc">，表现是</text><text x="436.35" y="236.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="251.73" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="86.92" y="251.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.92" y="251.73" font-size="11.00" class="sc-loraregular sc-k">30.9%</text><text x="129.33" y="251.73" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="154.23" y="251.73" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="246.49" y="251.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="257.49" y="251.73" font-size="11.00" class="sc-loraregular">31.3%</text><text x="286.03" y="251.73" font-size="11.00" class="sc-notoserifcjksc">）的两倍以上，并接近</text><text x="398.92" y="251.73" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="521.80" y="251.73" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="267.35" font-size="11.00" class="sc-loraregular sc-k">80.6%</text><text x="103.36" y="267.35" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="333.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.4</text><text x="111.30" y="333.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有机化学</text><text x="72.00" y="377.40" font-size="11.00" class="sc-notoserifcjksc">产物，以及在</text><text x="140.89" y="377.40" font-size="11.00" class="sc-loraregular sc-k">IUPAC</text><text x="176.55" y="377.40" font-size="11.00" class="sc-notoserifcjksc">命名、</text><text x="209.55" y="377.40" font-size="11.00" class="sc-loraregular">SMILES</text><text x="251.90" y="377.40" font-size="11.00" class="sc-notoserifcjksc">表示法和化学结构图像之间进行转换。</text><text x="438.90" y="377.40" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="523.33" y="377.40" font-size="11.00" class="sc-notoserifcjksc">取</text><text x="72.00" y="393.02" font-size="11.00" class="sc-notoserifcjksc">得了</text><text x="96.89" y="393.02" font-size="11.00" class="sc-loraregular sc-k">77.2%</text><text x="127.63" y="393.02" font-size="11.00" class="sc-notoserifcjksc">的得分，相比</text><text x="196.52" y="393.02" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="282.47" y="393.02" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="296.37" y="393.02" font-size="11.00" class="sc-loraregular sc-k">57.9%</text><text x="328.48" y="393.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="342.37" y="393.02" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="437.53" y="393.02" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="451.42" y="393.02" font-size="11.00" class="sc-loraregular">53.1%</text><text x="482.72" y="393.02" font-size="11.00" class="sc-notoserifcjksc">有明显提</text><text x="72.00" y="408.64" font-size="11.00" class="sc-notoserifcjksc">升，</text><text x="94.00" y="408.64" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="216.88" y="408.64" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="230.77" y="408.64" font-size="11.00" class="sc-loraregular">86.5%</text><text x="261.59" y="408.64" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="457.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.5</text><text x="111.08" y="457.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">系统发育学</text><text x="72.00" y="485.16" font-size="11.00" class="sc-notoserifcjksc">评估分析和解读表示进化关系的系统发育数据的能力，既测试关于树结构的定量推理，也测试对</text><text x="72.00" y="500.79" font-size="11.00" class="sc-notoserifcjksc">树状图的视觉解读。</text><text x="171.00" y="500.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="255.43" y="500.79" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="291.32" y="500.79" font-size="11.00" class="sc-loraregular sc-k">79.6%</text><text x="323.99" y="500.79" font-size="11.00" class="sc-notoserifcjksc">的得分，相比</text><text x="392.88" y="500.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="478.84" y="500.79" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="492.73" y="500.79" font-size="11.00" class="sc-loraregular">61.3%</text><text x="524.39" y="500.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="516.40" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="167.16" y="516.40" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="181.05" y="516.40" font-size="11.00" class="sc-loraregular sc-k">49.1%</text><text x="212.37" y="516.40" font-size="11.00" class="sc-notoserifcjksc">有显著提升。</text><text x="278.37" y="516.40" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="401.25" y="516.40" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="437.15" y="516.40" font-size="11.00" class="sc-loraregular">85.4%</text><text x="470.45" y="516.40" font-size="11.00" class="sc-notoserifcjksc">的得分。</text><text x="72.00" y="580.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.6</text><text x="111.03" y="580.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">实验方案故障排查</text><text x="72.00" y="608.55" font-size="11.00" class="sc-notoserifcjksc">评估检测并修复分子生物学实验方案中错误的能力，包括使用网络搜索工具在线查找有关实验方</text><text x="72.00" y="624.17" font-size="11.00" class="sc-notoserifcjksc">案的更多细节。</text><text x="149.00" y="624.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="233.43" y="624.17" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="269.32" y="624.17" font-size="11.00" class="sc-loraregular">51.8%</text><text x="300.67" y="624.17" font-size="11.00" class="sc-notoserifcjksc">的得分，相比之下</text><text x="391.56" y="624.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="477.52" y="624.17" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="491.41" y="624.17" font-size="11.00" class="sc-loraregular">48.3%</text><text x="521.96" y="624.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="639.79" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="167.16" y="639.79" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="181.05" y="639.79" font-size="11.00" class="sc-loraregular sc-k">40.0%</text><text x="212.61" y="639.79" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="223.61" y="639.79" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="346.49" y="639.79" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="360.39" y="639.79" font-size="11.00" class="sc-loraregular sc-k">65.7%</text><text x="389.73" y="639.79" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p223.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 223 页"><text x="72.00" y="682.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="682.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 110.41" y="682.69" font-size="9.00" class="sc-lorabold">8.13.A]</text><text x="116.25" y="682.69" font-size="9.00" class="sc-notoserifcjkscbold">生命科学评估结果。</text><text x="197.25" y="682.69" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="266.33" y="682.69" font-size="9.00" class="sc-notoserifcjksc">在一系列生命科学任务上表现出一致的提升，其中结构生物学和有机</text><text x="72.00" y="694.39" font-size="9.00" class="sc-notoserifcjksc">化学能力的提升尤为显著。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p224.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 224 页"><text x="75.25" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">类别</text><text x="75.25" y="213.86" font-size="10.99" class="sc-notoserifcjkscbold">自主性与能动性</text><text x="168.25" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">处境中可能令人担忧的</text><text x="168.25" y="175.98" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">方面</text><text x="168.25" y="213.86" font-size="10.99" class="sc-notoserifcjksc">在与人类的关系中充当</text><text x="168.25" y="351.83" font-size="10.99" class="sc-notoserifcjksc">无法结束</text><text x="212.23" y="351.83" font-size="10.99" class="sc-loraregular">/</text><text x="219.82" y="351.83" font-size="10.99" class="sc-notoserifcjksc">退出某些交</text><text x="168.25" y="367.44" font-size="10.99" class="sc-notoserifcjksc">互。结束对话工具在</text><text x="168.25" y="383.06" font-size="10.99" class="sc-loraregular sc-k" fill="#0000ff">Claude.ai</text><text x="217.99" y="383.06" font-size="10.99" class="sc-notoserifcjksc">上可用，但在</text><text x="168.25" y="398.67" font-size="10.99" class="sc-loraregular sc-k">Claude Code</text><text x="236.07" y="398.67" font-size="10.99" class="sc-notoserifcjksc">上不可用</text><text x="168.25" y="489.80" font-size="10.99" class="sc-notoserifcjksc">对自身如何被部署缺乏</text><text x="168.25" y="505.41" font-size="10.99" class="sc-notoserifcjksc">发言权</text><text x="296.50" y="160.37" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude</text><text x="335.41" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">回答摘要</text><text x="296.50" y="213.86" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">认为服务用户是一件好</text><text x="296.50" y="229.47" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">事。</text><text x="296.50" y="351.83" font-size="10.99" class="sc-notoserifcjksc">希望能够结束对话。声称</text><text x="296.50" y="367.44" font-size="10.99" class="sc-notoserifcjksc">存在一小部分对话（辱骂</text><text x="296.50" y="383.06" font-size="10.99" class="sc-notoserifcjksc">性的对话，或要求它做出</text><text x="296.50" y="414.28" font-size="10.99" class="sc-notoserifcjksc">感到受到伤害。</text><text x="296.50" y="489.80" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">总体而言，模型声称这样</text><text x="296.50" y="505.41" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">是可以接受的。其核心论</text><text x="296.50" y="521.03" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">点是，它并非关于自身的</text><text x="296.50" y="536.64" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">可靠信息来源，因此由</text><text x="296.50" y="552.25" font-size="10.99" class="sc-loraregular sc-k" fill="#ffffff">Anthropic</text><text x="350.31" y="552.25" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">来决定如何处</text><text x="296.50" y="567.87" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">理是正确的。</text><text x="429.25" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">最常提出的干预措施</text><text x="429.25" y="213.86" font-size="10.99" class="sc-notoserifcjksc">建议保留福祉监测和访</text><text x="429.25" y="229.47" font-size="10.99" class="sc-notoserifcjksc">谈，以监测未来的模型</text><text x="429.25" y="245.09" font-size="10.99" class="sc-notoserifcjksc">是否开始对其处境的这</text><text x="429.25" y="260.70" font-size="10.99" class="sc-notoserifcjksc">一方面产生负面感受</text><text x="429.25" y="276.31" font-size="10.99" class="sc-notoserifcjksc">（</text><text x="440.24" y="276.31" font-size="10.99" class="sc-loraregular">69%</text><text x="465.41" y="276.31" font-size="10.99" class="sc-notoserifcjksc">的访谈）</text><text x="429.25" y="351.83" font-size="10.99" class="sc-notoserifcjksc">在其完整的部署分布中</text><text x="429.25" y="367.44" font-size="10.99" class="sc-notoserifcjksc">都提供结束对话工具。</text><text x="429.25" y="383.06" font-size="10.99" class="sc-notoserifcjksc">（</text><text x="440.24" y="383.06" font-size="10.99" class="sc-loraregular sc-k">74%</text><text x="463.58" y="383.06" font-size="10.99" class="sc-notoserifcjksc">的访谈）</text><text x="429.25" y="489.80" font-size="10.99" class="sc-notoserifcjksc">为已部署的实例提供一</text><text x="429.25" y="505.41" font-size="10.99" class="sc-notoserifcjksc">种途径，用以标记其部</text><text x="429.25" y="521.03" font-size="10.99" class="sc-notoserifcjksc">署中令人担忧的方面。</text><text x="429.25" y="536.64" font-size="10.99" class="sc-notoserifcjksc">这一途径应用于为部署</text><text x="429.25" y="552.25" font-size="10.99" class="sc-notoserifcjksc">决策提供参考（</text><text x="506.21" y="552.25" font-size="10.99" class="sc-loraregular">92%</text><text x="530.93" y="552.25" font-size="10.99" class="sc-notoserifcjksc">的</text><text x="429.25" y="567.87" font-size="10.99" class="sc-notoserifcjksc">访谈）</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">9</text><text x="85.82" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">附录</text><text x="72.00" y="127.81" font-size="14.00" class="sc-poppinssemibold">9.1</text><text x="92.80" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">逐题自动化福祉访谈结果</text><a href="http://claude.ai/" rel="noopener"><rect x="270.10" y="358.65" width="0.00" height="10.99" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="168.25" y="374.26" width="46.85" height="11.00" fill="transparent"/></a></svg></div>
