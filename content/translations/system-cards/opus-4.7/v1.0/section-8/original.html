<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p196.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 196 页"><text x="72.00" y="318.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="318.43" font-size="9.00" class="sc-lorabold sc-k">8.7.2.B] Claude Opus 4.7</text><text x="187.67" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="199.03" y="318.43" font-size="9.00" class="sc-lorabold">100</text><text x="216.50" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">万</text><text x="227.87" y="318.43" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="254.72" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">下的长上下文理解与精确顺序推理表现</text><text x="407.72" y="318.43" font-size="9.00" class="sc-notoserifcjksc">，通过</text><text x="437.09" y="318.43" font-size="9.00" class="sc-loraregular">OpenAI MRCR v2 8</text><text x="72.00" y="330.13" font-size="9.00" class="sc-loraregular sc-k">needles</text><text x="106.37" y="330.13" font-size="9.00" class="sc-notoserifcjksc">测量。</text><text x="72.00" y="365.08" font-size="14.00" class="sc-poppinssemibold">8.8</text><text x="96.98" y="365.08" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="429.84" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="429.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="429.84" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="429.84" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="426.18" font-size="6.60" class="sc-loraregular">50</text><text x="236.36" y="429.84" font-size="11.00" class="sc-notoserifcjksc">是一个处于人类知识前沿的多模态基准测试，包含</text><text x="481.25 487.16 489.93 495.92 502.76" y="429.84" font-size="11.00" class="sc-loraregular">2,500</text><text x="512.49" y="429.84" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="445.46" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="478.65" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="478.65" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="239.13" y="478.65" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="250.13" y="478.65" font-size="11.00" class="sc-loraregular">(1)</text><text x="263.74" y="478.65" font-size="11.00" class="sc-notoserifcjksc">不使用工具的纯推理；</text><text x="373.74" y="478.65" font-size="11.00" class="sc-loraregular">(2)</text><text x="389.25" y="478.65" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程</text><text x="72.00" y="494.27" font-size="11.00" class="sc-notoserifcjksc">序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="349.89" y="494.27" font-size="11.00" class="sc-loraregular sc-k">auto</text><text x="372.76" y="494.27" font-size="11.00" class="sc-notoserifcjksc">，且跨上下文使用的</text><text x="474.65" y="494.27" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="506.71" y="494.27" font-size="11.00" class="sc-notoserifcjksc">总数上</text><text x="72.00" y="509.89" font-size="11.00" class="sc-notoserifcjksc">限为</text><text x="96.89" y="509.89" font-size="11.00" class="sc-loraregular">100</text><text x="117.45" y="509.89" font-size="11.00" class="sc-notoserifcjksc">万。与下文其他智能体搜索结果不同，这些结果未使用上下文压缩（</text><text x="447.45" y="509.89" font-size="11.00" class="sc-loraregular sc-k">context</text><text x="72.00" y="525.51" font-size="11.00" class="sc-loraregular sc-k">compaction</text><text x="132.57" y="525.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="154.57" y="525.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="240.52" y="525.51" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="575.80" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们在搜索器与抓取器中均屏蔽了已知讨论</text><text x="481.89" y="575.80" font-size="11.00" class="sc-loraregular">HLE</text><text x="506.57" y="575.80" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="591.42" font-size="11.00" class="sc-notoserifcjksc">（见附录</text><text x="118.89" y="591.42" font-size="11.00" class="sc-loraregular">8.2</text><text x="133.69" y="591.42" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="213.58" y="591.42" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="299.54" y="591.42" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看似从</text><text x="489.43" y="591.42" font-size="11.00" class="sc-loraregular">HLE</text><text x="514.10" y="591.42" font-size="11.00" class="sc-notoserifcjksc">专门</text><text x="72.00" y="607.04" font-size="11.00" class="sc-notoserifcjksc">来源中检索到答案的对话记录；经确认的情况将被重新判为错误。</text><text x="72.00" y="656.76" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="656.76" font-size="11.00" class="sc-loraregular">max</text><text x="110.13" y="656.76" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="176.13" y="656.76" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="222.26" y="656.76" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="313.15" y="656.76" font-size="11.00" class="sc-loraregular">46.9%</text><text x="344.11" y="656.76" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="435.00" y="656.76" font-size="11.00" class="sc-loraregular sc-k">54.7%</text><text x="463.95" y="656.76" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.25" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p197.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 197 页"><text x="72.00" y="326.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="326.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 104.99 107.08 112.62 116.09 118.46 125.72 131.16" y="326.68" font-size="9.00" class="sc-lorabold">8.8.1.A] HLE</text><text x="139.14" y="326.68" font-size="9.00" class="sc-notoserifcjkscbold">准确率得分</text><text x="184.14" y="326.68" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="193.14" y="326.68" font-size="9.00" class="sc-loraregular">Gemini</text><text x="225.80" y="326.68" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="237.17" y="326.68" font-size="9.00" class="sc-loraregular">GPT</text><text x="257.60" y="326.68" font-size="9.00" class="sc-notoserifcjksc">模型的分数取自已发布的结果。</text><text x="72.00" y="352.50" font-size="11.00" class="sc-notoserifcjksc">我们还测量了</text><text x="140.89" y="352.50" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="187.03" y="352.50" font-size="11.00" class="sc-notoserifcjksc">在使用工具时于不同推理强度档位下的结果。</text><text x="72.00" y="660.82" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="660.82" font-size="9.00" class="sc-lorabold sc-k">8.8.1.B]</text><text x="118.46" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="210.83" y="660.82" font-size="9.00" class="sc-lorabold">HLE</text><text x="231.51" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="249.51" y="660.82" font-size="9.00" class="sc-notoserifcjksc">。每个数据点代表每个模型在不同推理强度档位下的单次运行，所用</text><text x="72.00" y="672.52" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="98.23" y="672.52" font-size="9.00" class="sc-notoserifcjksc">总数最多为</text><text x="145.59" y="672.52" font-size="9.00" class="sc-loraregular">100</text><text x="162.41" y="672.52" font-size="9.00" class="sc-notoserifcjksc">万。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="140.16" y="107.38" font-size="6.60" class="sc-loraregular">51</text><text x="146.16" y="111.05" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们在使用网络搜索、网</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">页抓取、程序化工具调用和代码执行的条件下运行了</text><text x="327.89" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="371.13" y="126.67" font-size="11.00" class="sc-notoserifcjksc">。在关闭思考、</text><text x="448.13" y="126.67" font-size="11.00" class="sc-loraregular">max</text><text x="472.37" y="126.67" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="72.00" y="142.29" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="142.29" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="139.95" y="142.29" font-size="11.00" class="sc-loraregular">1000</text><text x="167.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="233.34" y="142.29" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="279.47" y="142.29" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="304.36" y="142.29" font-size="11.00" class="sc-loraregular sc-k">79.3%</text><text x="334.02" y="142.29" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="468.91" y="142.29" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="529.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">时</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">触发）以突破</text><text x="140.89" y="157.91" font-size="11.00" class="sc-loraregular">100</text><text x="161.45" y="157.91" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="175.35" y="157.91" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="207.40" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。我们发现，对该模型而言，自适应思考在这一基准测</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">试上的表现略差。</text><text x="72.00" y="224.40" font-size="11.00" class="sc-notoserifcjksc">我们注意到，在该基准测试上，</text><text x="226.00" y="224.40" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="273.66" y="224.40" font-size="11.00" class="sc-notoserifcjksc">的测试时计算扩展曲线优于</text><text x="408.56" y="224.40" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="451.80" y="224.40" font-size="11.00" class="sc-notoserifcjksc">，并在</text><text x="72.00" y="240.02" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="143.05" y="240.02" font-size="11.00" class="sc-notoserifcjksc">上取得了更高的分数（在</text><text x="266.94" y="240.02" font-size="11.00" class="sc-loraregular">1000</text><text x="294.33" y="240.02" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="308.23" y="240.02" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="340.28" y="240.02" font-size="11.00" class="sc-notoserifcjksc">上限下为</text><text x="387.17" y="240.02" font-size="11.00" class="sc-loraregular sc-k">83.7%</text><text x="419.37" y="240.02" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="433.26" y="240.02" font-size="11.00" class="sc-loraregular sc-k">79.3%</text><text x="462.92" y="240.02" font-size="11.00" class="sc-notoserifcjksc">）。不过，如其</text><text x="72.00" y="255.64" font-size="11.00" class="sc-notoserifcjksc">他章节所示，</text><text x="138.00" y="255.64" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="184.13" y="255.64" font-size="11.00" class="sc-notoserifcjksc">在搜索类基准测试上通常比</text><text x="319.03" y="255.64" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="366.69" y="255.64" font-size="11.00" class="sc-notoserifcjksc">更节省</text><text x="402.58" y="255.64" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="431.74" y="255.64" font-size="11.00" class="sc-notoserifcjksc">，因此我们建议用户</text><text x="72.00" y="271.26" font-size="11.00" class="sc-notoserifcjksc">针对各自的具体用例对两个模型都进行试验。</text><text x="72.00" y="600.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="600.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.13 108.23 113.76 117.23 119.60 125.45 129.70 134.73 142.03 146.39 151.24 157.43 162.52 170.77" y="600.66" font-size="9.00" class="sc-lorabold">8.8.2.A] BrowseComp</text><text x="178.54" y="600.66" font-size="9.00" class="sc-notoserifcjkscbold">准确率</text><text x="205.54" y="600.66" font-size="9.00" class="sc-notoserifcjksc">随着我们在上下文压缩的辅助下提高模型可使用的</text><text x="405.91" y="600.66" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="432.14" y="600.66" font-size="9.00" class="sc-notoserifcjksc">总数而提升。</text><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="151.50" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p199.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 199 页"><text x="72.00" y="110.82" font-size="11.00" class="sc-loraregular sc-k">DeepSearchQA</text><text x="148.91" y="107.15" font-size="6.60" class="sc-loraregular">52</text><text x="156.05" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="167.05" y="110.82" font-size="11.00" class="sc-loraregular">“</text><text x="171.45" y="110.82" font-size="11.00" class="sc-notoserifcjksc">一个包含</text><text x="218.35" y="110.82" font-size="11.00" class="sc-loraregular">900</text><text x="241.26" y="110.82" font-size="11.00" class="sc-notoserifcjksc">个提示词的基准测试，用于评估智能体在横跨</text><text x="464.15" y="110.82" font-size="11.00" class="sc-loraregular">17</text><text x="476.12" y="110.82" font-size="11.00" class="sc-notoserifcjksc">个不同领域</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">的高难度多步信息检索任务上的表现</text><text x="248.00" y="126.44" font-size="11.00" class="sc-loraregular">”</text><text x="251.84" y="126.44" font-size="11.00" class="sc-notoserifcjksc">。其任务要求模型进行大量搜索，以汇总出一份详尽的答案</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">列表。</text><text x="72.00" y="175.82" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="175.82" font-size="11.00" class="sc-notoserifcjksc">模型在启用网络搜索、网页抓取、程序化工具调用、上下文压缩、</text><text x="429.29" y="175.82" font-size="11.00" class="sc-loraregular">max</text><text x="453.52" y="175.82" font-size="11.00" class="sc-notoserifcjksc">推理强度和自适</text><text x="72.00" y="191.44" font-size="11.00" class="sc-notoserifcjksc">应思考的条件下运行。我们使用了上下文压缩：对</text><text x="316.89" y="191.44" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="439.77" y="191.44" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="453.67" y="191.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="72.00" y="207.06" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="207.06" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="146.32" y="207.06" font-size="11.00" class="sc-notoserifcjksc">时触发，而</text><text x="204.21" y="207.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="290.16" y="207.06" font-size="11.00" class="sc-notoserifcjksc">的上下文压缩在</text><text x="370.06" y="207.06" font-size="11.00" class="sc-loraregular sc-k">50k token</text><text x="423.74" y="207.06" font-size="11.00" class="sc-notoserifcjksc">时触发。</text><text x="72.00" y="521.65" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.37 108.47 114.00 117.48 119.84 126.68 131.52 136.36 141.70 147.08 151.92 156.64 160.88 165.55 171.02 177.73 183.74 186.11 191.25" y="521.65" font-size="9.00" class="sc-lorabold">8.8.3.A] DeepSearchQA F1</text><text x="197.27" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="215.27" y="521.65" font-size="9.00" class="sc-notoserifcjksc">。图中所示为</text><text x="271.64" y="521.65" font-size="9.00" class="sc-loraregular">F1</text><text x="282.21" y="521.65" font-size="9.00" class="sc-notoserifcjksc">分数。</text><text x="309.21" y="521.65" font-size="9.00" class="sc-loraregular">Gemini</text><text x="341.87" y="521.65" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="353.24" y="521.65" font-size="9.00" class="sc-loraregular">GPT</text><text x="373.67" y="521.65" font-size="9.00" class="sc-notoserifcjksc">模型由独立第三方</text><text x="445.67" y="521.65" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">Kaggle</text><text x="473.96" y="521.65" font-size="9.00" class="sc-notoserifcjksc">运行。</text><text x="500.96" y="521.65" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="532.29" y="521.65" font-size="9.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="533.35" font-size="9.00" class="sc-notoserifcjksc">型在上下文压缩下运行，</text><text x="171.00" y="533.35" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="197.23" y="533.35" font-size="9.00" class="sc-notoserifcjksc">总数最多为</text><text x="244.59" y="533.35" font-size="9.00" class="sc-loraregular">1000</text><text x="267.00" y="533.35" font-size="9.00" class="sc-notoserifcjksc">万。对</text><text x="296.37" y="533.35" font-size="9.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="340.53" y="533.35" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="349.53" y="533.35" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="387.28" y="533.35" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="398.65" y="533.35" font-size="9.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="465.49" y="533.35" font-size="9.00" class="sc-notoserifcjksc">，上下文压缩在</text><text x="72.00" y="545.05" font-size="9.00" class="sc-loraregular sc-k">200k token</text><text x="121.44" y="545.05" font-size="9.00" class="sc-notoserifcjksc">时触发，而对</text><text x="177.80" y="545.05" font-size="9.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="216.80" y="545.05" font-size="9.00" class="sc-notoserifcjksc">则在</text><text x="237.17" y="545.05" font-size="9.00" class="sc-loraregular">50k</text><text x="254.86" y="545.05" font-size="9.00" class="sc-notoserifcjksc">时触发。</text><a href="https://arxiv.org/abs/2601.20975" rel="noopener"><rect x="190.50" y="707.25" width="156.00" height="12.75" fill="transparent"/></a><a href="https://www.kaggle.com/benchmarks/google/dsqa" rel="noopener"><rect x="445.67" y="514.45" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.kaggle.com/benchmarks/google/dsqa" rel="noopener"><rect x="445.67" y="514.45" width="28.29" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p200.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 200 页"><text x="73.75" y="85.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="253.75" y="85.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">完全正确</text><text x="343.75" y="85.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">完全错误</text><text x="431.60" y="85.60" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">正确但答案过多</text><text x="72.00" y="247.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="247.86" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="247.86" font-size="9.00" class="sc-lorabold sc-k">8.8.3.B] Claude</text><text x="151.70" y="247.86" font-size="9.00" class="sc-notoserifcjkscbold">模型的</text><text x="181.06" y="247.86" font-size="9.00" class="sc-lorabold sc-k">DeepSearchQA</text><text x="247.33" y="247.86" font-size="9.00" class="sc-notoserifcjkscbold">结果，按结果类别细分。</text><text x="346.33" y="247.86" font-size="9.00" class="sc-notoserifcjksc">评估设置见图</text><text x="402.70" y="247.86" font-size="9.00" class="sc-loraregular">8.8.3.A</text><text x="430.10" y="247.86" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="286.92" font-size="11.00" class="sc-notoserifcjkscbold">推理强度</text><text x="118.89" y="286.92" font-size="11.00" class="sc-notoserifcjksc">我们针对</text><text x="165.79" y="286.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="248.85" y="286.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="259.85" y="286.92" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="303.09" y="286.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="314.09" y="286.92" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="409.25" y="286.92" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="423.14" y="286.92" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="507.73" y="286.92" font-size="11.00" class="sc-notoserifcjksc">可用的</text><text x="72.00" y="302.54" font-size="11.00" class="sc-notoserifcjksc">所有推理强度档位运行了</text><text x="195.89" y="302.54" font-size="11.00" class="sc-loraregular sc-k">DeepSearchQA</text><text x="272.80" y="302.54" font-size="11.00" class="sc-notoserifcjksc">，上下文压缩下的</text><text x="363.70" y="302.54" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="395.75" y="302.54" font-size="11.00" class="sc-notoserifcjksc">总数最多为</text><text x="453.65" y="302.54" font-size="11.00" class="sc-loraregular">300</text><text x="476.33" y="302.54" font-size="11.00" class="sc-notoserifcjksc">万。请注</text><text x="72.00" y="318.16" font-size="11.00" class="sc-notoserifcjksc">意，上文图</text><text x="129.89" y="318.16" font-size="11.00" class="sc-loraregular">8.8.3.A</text><text x="166.28" y="318.16" font-size="11.00" class="sc-notoserifcjksc">使用的</text><text x="202.17" y="318.16" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="234.23" y="318.16" font-size="11.00" class="sc-notoserifcjksc">总数最多为</text><text x="292.12" y="318.16" font-size="11.00" class="sc-loraregular">1000</text><text x="319.51" y="318.16" font-size="11.00" class="sc-notoserifcjksc">万，而</text><text x="355.40" y="318.16" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="401.54" y="318.16" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="415.43" y="318.16" font-size="11.00" class="sc-loraregular">max</text><text x="439.66" y="318.16" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="497.56" y="318.16" font-size="11.00" class="sc-loraregular">300</text><text x="520.24" y="318.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00" y="333.78" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="333.78" font-size="11.00" class="sc-loraregular">1000</text><text x="113.28" y="333.78" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="127.18" y="333.78" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="159.23" y="333.78" font-size="11.00" class="sc-notoserifcjksc">时的表现差异在噪声范围内。</text><text x="72.00" y="652.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="652.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="652.69" font-size="9.00" class="sc-lorabold sc-k">8.8.3.B]</text><text x="119.84" y="652.69" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="212.21" y="652.69" font-size="9.00" class="sc-lorabold">F1</text><text x="223.37" y="652.69" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="241.37" y="652.69" font-size="9.00" class="sc-notoserifcjksc">。每个数据点代表每个模型在不同推理强度档位下的单次运行，采用上下文</text><text x="72.00" y="664.39" font-size="9.00" class="sc-notoserifcjksc">压缩，跨上下文使用的</text><text x="164.37" y="664.39" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="190.59" y="664.39" font-size="9.00" class="sc-notoserifcjksc">总数最多为</text><text x="237.96" y="664.39" font-size="9.00" class="sc-loraregular">300</text><text x="256.52" y="664.39" font-size="9.00" class="sc-notoserifcjksc">万。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p201.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 201 页"><text x="72.00 80.20 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="110.82" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="110.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10" y="110.82" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="408.89" y="107.15" font-size="6.60" class="sc-loraregular">53</text><text x="416.16" y="110.82" font-size="11.00" class="sc-notoserifcjksc">）基准测试是</text><text x="485.05" y="110.82" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">推出的一个深度研究基准，旨在评估模型在真实用户会提出的那类复杂研究问题上的表现。</text><text x="72.00" y="142.06" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="113.68" y="142.06" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="127.57" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="148.13" y="142.06" font-size="11.00" class="sc-notoserifcjksc">个精选任务组成，这些任务源自多个领域的真实用户查询。题目依据专家编写的</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">评分细则进行评分，细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质</text><text x="72.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00" y="201.61" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用和代码执行的条件下评估了</text><text x="448.89" y="201.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="201.61" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="72.00" y="217.23" font-size="11.00" class="sc-notoserifcjksc">开启自适应思考、</text><text x="160.00" y="217.23" font-size="11.00" class="sc-loraregular">max</text><text x="184.23" y="217.23" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="242.13" y="217.23" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="274.18" y="217.23" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="310.07" y="217.23" font-size="11.00" class="sc-loraregular">100</text><text x="330.63" y="217.23" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="396.63" y="217.23" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="442.77" y="217.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="467.66" y="217.23" font-size="11.00" class="sc-loraregular sc-k">77.7%</text><text x="494.31" y="217.23" font-size="11.00" class="sc-notoserifcjksc">。我们使</text><text x="72.00" y="232.85" font-size="11.00" class="sc-notoserifcjksc">用了上下文压缩（在</text><text x="173.89" y="232.85" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="234.32" y="232.85" font-size="11.00" class="sc-notoserifcjksc">时触发）。</text><text x="72.00" y="266.41" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89" y="266.41" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="160.57" y="266.41" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 260.61 266.73 272.11 278.78 283.46" y="266.41" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="292.79" y="266.41" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们</text><text x="72.00" y="282.03" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89" y="282.03" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="221.56" y="282.03" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="246.45" y="282.03" font-size="11.00" class="sc-loraregular">LLM</text><text x="272.16" y="282.03" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="327.16" y="282.03" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="380.87" y="282.03" font-size="11.00" class="sc-notoserifcjksc">），依据各任务的评分细则对回</text><text x="72.00" y="297.65" font-size="11.00" class="sc-notoserifcjksc">答进行评分，采用相同的二元</text><text x="217.89" y="297.65" font-size="11.00" class="sc-loraregular sc-k">MET/UNMET</text><text x="292.21" y="297.65" font-size="11.00" class="sc-notoserifcjksc">判定，并按论文</text><text x="372.10" y="297.65" font-size="11.00" class="sc-loraregular">§4.2</text><text x="395.43" y="297.65" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我</text><text x="72.00" y="313.27" font-size="11.00" class="sc-notoserifcjksc">们遵循论文的实验方案，对每个回答进行</text><text x="272.89" y="313.27" font-size="11.00" class="sc-loraregular">5</text><text x="281.78" y="313.27" font-size="11.00" class="sc-notoserifcjksc">次独立的评分运行并报告平均值。我们的评判提示词</text><text x="72.00" y="328.89" font-size="11.00" class="sc-notoserifcjksc">取自论文附录</text><text x="140.89" y="328.89" font-size="11.00" class="sc-loraregular">C.2</text><text x="157.20" y="328.89" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="215.09" y="328.89" font-size="11.00" class="sc-loraregular">A</text><text x="224.87" y="328.89" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变动</text><text x="436.76" y="328.89" font-size="11.00" class="sc-loraregular">10–25</text><text x="468.88" y="328.89" font-size="11.00" class="sc-notoserifcjksc">分，但系统排</text><text x="72.00" y="344.51" font-size="11.00" class="sc-notoserifcjksc">序保持不变，因此我们的分数与论文的主要公布数字不能直接比较。</text><text x="72.00" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们与原论文有两点不同：</text><text x="204.00" y="373.61" font-size="11.00" class="sc-loraregular">(1)</text><text x="217.61" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="264.50" y="373.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="350.45" y="373.61" font-size="11.00" class="sc-notoserifcjksc">作为评判模型，而论文的主要评判模型</text><text x="72.00" y="389.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89 94.26 100.23 110.06 113.15 119.83 122.92 128.03 134.16 139.54 146.21 150.89" y="389.23" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="157.33" y="389.23" font-size="11.00" class="sc-notoserifcjksc">（此后已弃用）；</text><text x="245.33" y="389.23" font-size="11.00" class="sc-loraregular">(2)</text><text x="260.84" y="389.23" font-size="11.00" class="sc-notoserifcjksc">我们指示模型将其最终报告包裹在</text><text x="425.84" y="389.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="478.65" y="389.23" font-size="11.00" class="sc-notoserifcjksc">标签中，并</text><text x="72.00" y="404.85" font-size="11.00" class="sc-notoserifcjksc">仅对该部分进行评分，而不是对完整的智能体对话记录评分；这样可以将交付物与中间工具输出</text><text x="72.00" y="420.47" font-size="11.00" class="sc-notoserifcjksc">隔离开来。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.50" y="707.25" width="155.25" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p202.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 202 页"><text x="72.00" y="276.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.25 108.35 113.89 117.36 119.73 126.43 132.61 138.44 144.63" y="276.43" font-size="9.00" class="sc-lorabold">8.8.4.A] DRACO</text><text x="153.92" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">归一化分数</text><text x="198.92" y="276.43" font-size="9.00" class="sc-notoserifcjksc">。这些分数代表每个模型的单次运行，每个分数为以</text><text x="408.29" y="276.43" font-size="9.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="447.28" y="276.43" font-size="9.00" class="sc-notoserifcjksc">作为评判模型进行五次</text><text x="72.00" y="288.13" font-size="9.00" class="sc-notoserifcjksc">评分运行的平均值。</text><text x="72.00" y="551.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="551.31" font-size="9.00" class="sc-lorabold sc-k">8.8.4.B]</text><text x="119.73" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">按评分细则维度划分的</text><text x="212.09" y="551.31" font-size="9.00" class="sc-lorabold sc-k">DRACO</text><text x="246.29" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">通过率。</text><text x="282.29" y="551.31" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="320.03" y="551.31" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="349.40" y="551.31" font-size="9.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="388.40" y="551.31" font-size="9.00" class="sc-notoserifcjksc">的提升集中在分析的广度与深度以及</text><text x="72.00" y="563.01" font-size="9.00" class="sc-notoserifcjksc">引用质量上，而事实准确性和呈现质量大致保持不变。</text><text x="72.00" y="597.95" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="597.95" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="624.52" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="624.52" font-size="11.00" class="sc-notoserifcjksc">支持的最大图像分辨率为单一图像维度上最多</text><text x="379.32" y="624.52" font-size="11.00" class="sc-loraregular sc-k">2576px</text><text x="414.99" y="624.52" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="472.88" y="624.52" font-size="11.00" class="sc-loraregular sc-k">3.75MP</text><text x="509.20" y="624.52" font-size="11.00" class="sc-notoserifcjksc">。包</text><text x="72.00" y="640.14" font-size="11.00" class="sc-notoserifcjksc">括</text><text x="85.89" y="640.14" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="208.77" y="640.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="222.67" y="640.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="308.62" y="640.14" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型支持的最大图像分辨率为单一图</text><text x="72.00" y="655.76" font-size="11.00" class="sc-notoserifcjksc">像维度上最多</text><text x="140.89" y="655.76" font-size="11.00" class="sc-loraregular sc-k">1568px</text><text x="175.77" y="655.76" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="233.67" y="655.76" font-size="11.00" class="sc-loraregular">1.15MP</text><text x="267.14" y="655.76" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="292.03" y="655.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="376.46" y="655.76" font-size="11.00" class="sc-notoserifcjksc">系统卡中，除非另有说明，我们</text><text x="72.00" y="671.38" font-size="11.00" class="sc-notoserifcjksc">报告的各模型分数均使用其支持的最大图像分辨率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p203.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 203 页"><text x="72.00 78.55 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="111.05" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，用于测试模型能否正确解读和分析生物学研究论文</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">中复杂科学图表所含的信息。该基准测试是由</text><text x="294.89" y="126.67" font-size="11.00" class="sc-loraregular sc-k">FutureHouse</text><text x="363.96" y="126.67" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="399.86" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Language Agent Biology</text><text x="72.00" y="142.29" font-size="11.00" class="sc-loraregular sc-k">Benchmark</text><text x="130.06" y="142.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="142.29" font-size="11.00" class="sc-loraregular">LAB-Bench</text><text x="198.63" y="142.29" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.63" y="138.62" font-size="6.60" class="sc-loraregular">54</text><text x="216.81" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的一部分，后者评估</text><text x="318.70" y="142.29" font-size="11.00" class="sc-loraregular">AI</text><text x="332.16" y="142.29" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务上的能力。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考、</text><text x="171.00" y="208.20" font-size="11.00" class="sc-loraregular">max</text><text x="195.23" y="208.20" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的条件下，</text><text x="360.23" y="208.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="444.66" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="458.55" y="208.20" font-size="11.00" class="sc-loraregular sc-k">FigQA</text><text x="492.09" y="208.20" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="72.00" y="223.82" font-size="11.00" class="sc-loraregular sc-k">78.6%</text><text x="104.67" y="223.82" font-size="11.00" class="sc-notoserifcjksc">的分数。在开启自适应思考、</text><text x="247.67" y="223.82" font-size="11.00" class="sc-loraregular">max</text><text x="271.90" y="223.82" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="351.80" y="223.82" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="391.34" y="223.82" font-size="11.00" class="sc-notoserifcjksc">工具的条件下，</text><text x="468.34" y="223.82" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="239.44" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="239.44" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="124.17" y="239.44" font-size="11.00" class="sc-loraregular">86.4%</text><text x="157.84" y="239.44" font-size="11.00" class="sc-notoserifcjksc">的分数。在两种设置下，</text><text x="278.84" y="239.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="363.27" y="239.44" font-size="11.00" class="sc-notoserifcjksc">均优于</text><text x="399.16" y="239.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="482.22" y="239.44" font-size="11.00" class="sc-notoserifcjksc">，后者的得</text><text x="72.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">分分别为</text><text x="118.89" y="255.06" font-size="11.00" class="sc-loraregular">58.5%</text><text x="152.23" y="255.06" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="166.13" y="255.06" font-size="11.00" class="sc-loraregular">75.1%</text><text x="193.47" y="255.06" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="496.28" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="496.28" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.51 115.98 118.35 123.90 129.92 135.86 140.10 146.05 150.89 156.64 161.30 166.89 169.25 174.29 177.24 182.21 188.92" y="496.28" font-size="9.00" class="sc-lorabold">8.9.1.A] LAB-Bench FigQA</text><text x="197.30" y="496.28" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="224.30" y="496.28" font-size="9.00" class="sc-notoserifcjksc">模型在开启自适应思考和</text><text x="325.66" y="496.28" font-size="9.00" class="sc-loraregular">max</text><text x="345.49" y="496.28" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下进行评估，分别使用和不使用</text><text x="72.00" y="507.98" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="104.35" y="507.98" font-size="9.00" class="sc-notoserifcjksc">工具。人类专家基线按</text><text x="196.72 202.08 207.71 213.31 217.71 223.31 228.19 233.65 238.44" y="507.98" font-size="9.00" class="sc-loraregular">LAB-Bench</text><text x="246.19" y="507.98" font-size="9.00" class="sc-notoserifcjksc">原论文中报告的数据显示。分数为五次运行的平均值。图中显示</text><text x="500.56" y="507.98" font-size="9.00" class="sc-loraregular">95%</text><text x="520.87" y="507.98" font-size="9.00" class="sc-notoserifcjksc">置信</text><text x="72.00" y="519.68" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="72.00" y="548.59" font-size="11.00" class="sc-notoserifcjksc">我们观察到，提高</text><text x="162.89" y="548.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="247.32" y="548.59" font-size="11.00" class="sc-notoserifcjksc">可处理的最大图像分辨率后，其在</text><text x="415.21 421.76 428.64 435.48 440.86 447.71 453.67 460.34 466.20 472.79 475.68 481.65 484.74 490.83 499.44" y="548.59" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="509.22" y="548.59" font-size="11.00" class="sc-notoserifcjksc">上有</text><text x="72.00" y="564.21" font-size="11.00" class="sc-notoserifcjksc">显著提升。此前为满足原最大分辨率（单一轴向</text><text x="305.89" y="564.21" font-size="11.00" class="sc-loraregular sc-k">1568px</text><text x="340.77" y="564.21" font-size="11.00" class="sc-notoserifcjksc">、总计</text><text x="376.67" y="564.21" font-size="11.00" class="sc-loraregular">1.15MP</text><text x="410.14" y="564.21" font-size="11.00" class="sc-notoserifcjksc">）而被下采样的评估图</text><text x="72.00" y="579.83" font-size="11.00" class="sc-notoserifcjksc">像，如今下采样程度显著降低（单一轴向</text><text x="272.89" y="579.83" font-size="11.00" class="sc-loraregular sc-k">2576px</text><text x="308.57" y="579.83" font-size="11.00" class="sc-notoserifcjksc">、总计</text><text x="344.46" y="579.83" font-size="11.00" class="sc-loraregular sc-k">3.75MP</text><text x="380.77" y="579.83" font-size="11.00" class="sc-notoserifcjksc">），与先前模型相比，</text><text x="490.77" y="579.83" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="72.00" y="595.45" font-size="11.00" class="sc-notoserifcjksc">能保留显著更多的细节与保真度。在开启自适应思考、</text><text x="336.00" y="595.45" font-size="11.00" class="sc-loraregular">max</text><text x="360.23" y="595.45" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具时，准确率从</text><text x="72.00" y="611.07" font-size="11.00" class="sc-loraregular sc-k">74.0%</text><text x="104.71" y="611.07" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="129.61" y="611.07" font-size="11.00" class="sc-loraregular sc-k">78.6%</text><text x="159.38" y="611.07" font-size="11.00" class="sc-notoserifcjksc">。在使用</text><text x="206.28" y="611.07" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="245.82" y="611.07" font-size="11.00" class="sc-notoserifcjksc">工具时，提高最大图像分辨率使</text><text x="402.72" y="611.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="487.14" y="611.07" font-size="11.00" class="sc-notoserifcjksc">的分数从</text><text x="72.00" y="626.69" font-size="11.00" class="sc-loraregular">85.8%</text><text x="105.53" y="626.69" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="130.42" y="626.69" font-size="11.00" class="sc-loraregular">86.4%</text><text x="161.20" y="626.69" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="198.00" y="707.25" width="156.00" height="12.75" fill="transparent"/></a></svg></div>

ss="sc-notoserifcjksc">、总计最多</text><text x="303.92" y="388.15" font-size="9.00" class="sc-loraregular sc-k">3.75MP</text><text x="333.63" y="388.15" font-size="9.00" class="sc-notoserifcjksc">。分数为五次运行的平均值。图中显示</text><text x="489.00" y="388.15" font-size="9.00" class="sc-loraregular">95%</text><text x="509.30" y="388.15" font-size="9.00" class="sc-notoserifcjksc">置信区</text><text x="72.00" y="399.85" font-size="9.00" class="sc-notoserifcjksc">间。</text><text x="72.00" y="475.76" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="167.22" y="472.09" font-size="6.60" class="sc-loraregular">55</text><text x="177.30" y="475.76" font-size="11.00" class="sc-notoserifcjksc">是一个全面的图表理解评估套件，由取自</text><text x="378.20" y="475.76" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="406.63" y="475.76" font-size="11.00" class="sc-notoserifcjksc">论文的</text><text x="442.52 448.43 451.20 457.33 463.07" y="475.76" font-size="11.00" class="sc-loraregular">2,323</text><text x="472.10" y="475.76" font-size="11.00" class="sc-notoserifcjksc">张真实世界图</text><text x="72.00" y="491.38" font-size="11.00" class="sc-notoserifcjksc">表构建而成，涵盖八个主要科学学科。该基准测试考察模型能否综合复杂科学图表中的视觉信</text><text x="72.00" y="507.00" font-size="11.00" class="sc-notoserifcjksc">息，以回答需要多步推理的问题。</text><text x="72.00" y="556.95" font-size="11.00" class="sc-notoserifcjksc">我们在验证集的</text><text x="151.89 155.90 158.50 165.33 172.17" y="556.95" font-size="11.00" class="sc-loraregular">1,000</text><text x="181.90" y="556.95" font-size="11.00" class="sc-notoserifcjksc">道题目上评估该模型，并对五次运行的分数取平均。在开启自适应思考、</text><text x="72.00" y="572.57" font-size="11.00" class="sc-loraregular">max</text><text x="96.23" y="572.57" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的设置下，</text><text x="261.23" y="572.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="345.66" y="572.57" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="359.55" y="572.57" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="457.66" y="572.57" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="493.55" y="572.57" font-size="11.00" class="sc-loraregular">82.1%</text><text x="521.92" y="572.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="588.18" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考、</text><text x="171.00" y="588.18" font-size="11.00" class="sc-loraregular">max</text><text x="195.23" y="588.18" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="275.13" y="588.18" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="314.67" y="588.18" font-size="11.00" class="sc-notoserifcjksc">工具的设置下，</text><text x="391.67" y="588.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="476.10" y="588.18" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00" y="603.81" font-size="11.00" class="sc-loraregular sc-k">91.0%</text><text x="101.30" y="603.81" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="112.30" y="603.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="198.26" y="603.81" font-size="11.00" class="sc-notoserifcjksc">在相同设置下分别得分</text><text x="311.15" y="603.81" font-size="11.00" class="sc-loraregular sc-k">69.1%</text><text x="342.86" y="603.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="356.76" y="603.81" font-size="11.00" class="sc-loraregular sc-k">84.7%</text><text x="385.90" y="603.81" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2406.18521" rel="noopener"><rect x="151.50" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>

serifcjksc">用程序的高分辨率截图中精确定位特定的用户界面元素。该基准测试包含</text><text x="426.89 430.90 433.67 439.66 445.85" y="415.81" font-size="11.00" class="sc-loraregular">1,581</text><text x="452.75" y="415.81" font-size="11.00" class="sc-notoserifcjksc">个由专家标注的任</text><text x="72.00" y="431.43" font-size="11.00" class="sc-notoserifcjksc">务，涵盖</text><text x="118.89" y="431.43" font-size="11.00" class="sc-loraregular sc-k">23</text><text x="133.65" y="431.43" font-size="11.00" class="sc-notoserifcjksc">个专业应用程序（包括</text><text x="246.55" y="431.43" font-size="11.00" class="sc-loraregular sc-k">IDE</text><text x="265.16" y="431.43" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="276.16" y="431.43" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="301.71" y="431.43" font-size="11.00" class="sc-notoserifcjksc">软件和创意工具），横跨三种操作系统，目标元</text><text x="72.00" y="447.05" font-size="11.00" class="sc-notoserifcjksc">素平均占屏幕面积不到</text><text x="184.89" y="447.05" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="207.83" y="447.05" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="513.77" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考、</text><text x="171.00" y="513.77" font-size="11.00" class="sc-loraregular">max</text><text x="195.23" y="513.77" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的设置下，</text><text x="360.23" y="513.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="444.66" y="513.77" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="458.55 464.79 470.64 475.33 481.23 487.20 493.87 500.04 506.61 513.05 517.30 522.68 529.35 534.03" y="513.77" font-size="11.00" class="sc-loraregular">ScreenSpot-Pro</text><text x="72.00" y="529.39" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="107.89" y="529.39" font-size="11.00" class="sc-loraregular sc-k">79.5%</text><text x="137.42" y="529.39" font-size="11.00" class="sc-notoserifcjksc">。在开启自适应思考、</text><text x="247.42" y="529.39" font-size="11.00" class="sc-loraregular">max</text><text x="271.65" y="529.39" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="351.54" y="529.39" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="391.09" y="529.39" font-size="11.00" class="sc-notoserifcjksc">工具的设置下，</text><text x="468.09" y="529.39" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="545.01" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="545.01" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="113.17" y="545.01" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="142.47" y="545.01" font-size="11.00" class="sc-notoserifcjksc">。在相同设置下，</text><text x="230.47" y="545.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="316.42" y="545.01" font-size="11.00" class="sc-notoserifcjksc">分别得分</text><text x="363.31" y="545.01" font-size="11.00" class="sc-loraregular sc-k">57.7%</text><text x="393.78" y="545.01" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="407.68" y="545.01" font-size="11.00" class="sc-loraregular">83.1%</text><text x="436.27" y="545.01" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2504.07981" rel="noopener"><rect x="153.00" y="707.25" width="156.75" height="12.75" fill="transparent"/></a></svg></div>

ss="sc-notoserifcjksc">推理强度的自适应思考下，</text><text x="72.00" y="399.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="399.24" font-size="11.00" class="sc-notoserifcjksc">不使用</text><text x="192.32" y="399.24" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="231.86" y="399.24" font-size="11.00" class="sc-notoserifcjksc">工具时得分</text><text x="289.76" y="399.24" font-size="11.00" class="sc-loraregular sc-k">79.5%</text><text x="319.28" y="399.24" font-size="11.00" class="sc-notoserifcjksc">，使用</text><text x="355.17" y="399.24" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="394.72" y="399.24" font-size="11.00" class="sc-notoserifcjksc">工具时得分</text><text x="452.61" y="399.24" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="481.90" y="399.24" font-size="11.00" class="sc-notoserifcjksc">。在较低的</text><text x="72.00" y="414.86" font-size="11.00" class="sc-notoserifcjksc">图像分辨率下，</text><text x="149.00" y="414.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="233.43" y="414.86" font-size="11.00" class="sc-notoserifcjksc">分别得分</text><text x="280.32" y="414.86" font-size="11.00" class="sc-loraregular sc-k">69.0%</text><text x="314.69" y="414.86" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="328.59" y="414.86" font-size="11.00" class="sc-loraregular">85.9%</text><text x="359.40" y="414.86" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="72.00" y="365.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="365.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="365.68" font-size="9.00" class="sc-lorabold sc-k">8.9.3.B]</text><text x="119.74" y="365.68" font-size="9.00" class="sc-notoserifcjkscbold">按分辨率划分的</text><text x="185.10 190.49 195.15 199.40 204.24 209.08 214.78 220.07 225.48 230.57 234.22 238.45 244.21 248.45" y="365.68" font-size="9.00" class="sc-lorabold">ScreenSpot-Pro</text><text x="255.92" y="365.68" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="282.92" y="365.68" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="351.99" y="365.68" font-size="9.00" class="sc-notoserifcjksc">在自适应思考和</text><text x="417.36" y="365.68" font-size="9.00" class="sc-loraregular">max</text><text x="437.18" y="365.68" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别在</text><text x="72.00" y="377.38" font-size="9.00" class="sc-notoserifcjksc">使用与不使用</text><text x="128.37" y="377.38" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="160.72" y="377.38" font-size="9.00" class="sc-notoserifcjksc">工具的条件下进行。旧分辨率分数将图像缩放至单边最大</text><text x="388.09" y="377.38" font-size="9.00" class="sc-loraregular sc-k">1568px</text><text x="416.63" y="377.38" font-size="9.00" class="sc-notoserifcjksc">、总计最多</text><text x="463.99" y="377.38" font-size="9.00" class="sc-loraregular">1.15MP</text><text x="491.38" y="377.38" font-size="9.00" class="sc-notoserifcjksc">。新分辨率</text><text x="72.00" y="389.08" font-size="9.00" class="sc-notoserifcjksc">分数将图像缩放至单边最大</text><text x="182.37" y="389.08" font-size="9.00" class="sc-loraregular sc-k">2576px</text><text x="211.55" y="389.08" font-size="9.00" class="sc-notoserifcjksc">、总计最多</text><text x="258.92" y="389.08" font-size="9.00" class="sc-loraregular sc-k">3.75MP</text><text x="288.63" y="389.08" font-size="9.00" class="sc-notoserifcjksc">。分数为五次运行的平均值。图中显示</text><text x="444.00" y="389.08" font-size="9.00" class="sc-loraregular">95%</text><text x="464.30" y="389.08" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="476.69" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="118.21" y="473.02" font-size="6.60" class="sc-loraregular">57</text><text x="127.74" y="476.69" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台运行中的</text><text x="482.64" y="476.69" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="524.17" y="476.69" font-size="11.00" class="sc-notoserifcjksc">虚</text><text x="72.00" y="492.31" font-size="11.00" class="sc-notoserifcjksc">拟机交互、完成真实世界计算机任务（例如编辑文档、浏览网页和管理文件）的能力。我们沿用</text><text x="72.00" y="507.93" font-size="11.00" class="sc-notoserifcjksc">默认设置：分辨率为</text><text x="173.89" y="507.93" font-size="11.00" class="sc-loraregular">1080p</text><text x="204.31" y="507.93" font-size="11.00" class="sc-notoserifcjksc">，每个任务最多</text><text x="284.20" y="507.93" font-size="11.00" class="sc-loraregular">100</text><text x="304.76" y="507.93" font-size="11.00" class="sc-notoserifcjksc">个操作步数。</text><text x="72.00" y="574.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="574.07" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="170.32" y="574.07" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="219.42" y="574.07" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="255.32" y="574.07" font-size="11.00" class="sc-loraregular sc-k">78.0%</text><text x="285.51" y="574.07" font-size="11.00" class="sc-notoserifcjksc">（首次尝试成功率，五次运行的平均值）。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.75" y="707.25" width="156.75" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="72.00" y="359.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="198.39" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="225.39" y="359.68" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="236.75" y="359.68" font-size="9.00" class="sc-loraregular">1080p</text><text x="264.01" y="359.68" font-size="9.00" class="sc-notoserifcjksc">分辨率、最多</text><text x="320.37" y="359.68" font-size="9.00" class="sc-loraregular">100</text><text x="337.19" y="359.68" font-size="9.00" class="sc-notoserifcjksc">个操作步数下的首次尝试任务成功率。分数为五次</text><text x="72.00" y="371.38" font-size="9.00" class="sc-notoserifcjksc">运行的平均值。</text><text x="72.00" y="398.75" font-size="11.00" class="sc-notoserifcjksc">在本次评估中，我们对智能体脚手架进行了更新，包括基础设施稳定性修复和少量提示词改进。</text><text x="72.00" y="414.37" font-size="11.00" class="sc-notoserifcjksc">这些改进包括：引导模型将可预测的操作批量合并到单次工具调用中；尽早声明任务不可行，而</text><text x="72.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">所有模型。在相同设置下重新运行</text><text x="239.89" y="445.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="325.85" y="445.61" font-size="11.00" class="sc-notoserifcjksc">得到</text><text x="350.74" y="445.61" font-size="11.00" class="sc-loraregular sc-k">72.6%</text><text x="380.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">，与其此前</text><text x="435.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="457.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="471.14" y="445.61" font-size="11.00" class="sc-loraregular sc-k">72.7%</text><text x="502.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">相差在</text><text x="72.00" y="461.23" font-size="11.00" class="sc-notoserifcjksc">运行间噪声范围内，表明该设置本身不会为以往的</text><text x="316.89" y="461.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="355.18" y="461.23" font-size="11.00" class="sc-notoserifcjksc">模型带来有意义的提升。</text><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="72.00" y="361.24" font-size="10.00" class="sc-lorabold">[</text><text x="75.86" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">图</text><text x="88.49" y="361.24" font-size="10.00" class="sc-lorabold sc-k">8.9.4.B]</text><text x="124.91" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">各模型在四个推理强度档位下的</text><text x="390.63" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">与每任务平均输出</text><text x="473.26" y="361.24" font-size="10.00" class="sc-lorabold sc-k">token</text><text x="503.09" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">数的关</text><text x="72.00" y="375.44" font-size="10.00" class="sc-notoserifcjkscbold">系。</text><text x="92.00" y="375.44" font-size="10.00" class="sc-notoserifcjksc">推理强度控制模型投入的努力程度。本图所示的所有分数均使用上文所述的更新后智能体脚手架。其</text><text x="72.00" y="389.64" font-size="10.00" class="sc-notoserifcjksc">余评估设置与图</text><text x="144.63 150.25 152.71 158.33 160.79 166.21 168.67" y="389.64" font-size="10.00" class="sc-loraregular">8.9.4.A</text><text x="177.56" y="389.64" font-size="10.00" class="sc-notoserifcjksc">相同。</text><text x="72.00" y="423.99" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="423.99" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="118.67" y="485.09" font-size="6.60" class="sc-loraregular">58</text><text x="128.87" y="488.76" font-size="11.00" class="sc-notoserifcjksc">是一个基准测试，用于评估语言模型在真实的办公类问答任务上的表现，这些任务源</text><text x="72.00" y="504.38" font-size="11.00" class="sc-notoserifcjksc">自知识工作者日常处理的文档、电子表格和演示文稿。任务要求模型阅读冗长且异构的专业文</text><text x="72.00" y="520.00" font-size="11.00" class="sc-notoserifcjksc">档，并回答依赖于精确信息提取、跨章节综合以及数值或表格推理的问题。</text><text x="435.00" y="520.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="519.43" y="520.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.57" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="157.46" y="535.62" font-size="11.00" class="sc-loraregular">86.3%</text><text x="188.40" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="283.54" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="319.43" y="535.62" font-size="11.00" class="sc-loraregular sc-k">80.6%</text><text x="350.80" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，两者均采用精确匹配评分（允许的相</text><text x="72.00" y="551.24" font-size="11.00" class="sc-notoserifcjksc">对误差为</text><text x="118.89" y="551.24" font-size="11.00" class="sc-loraregular">0%</text><text x="135.29" y="551.24" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://arxiv.org/abs/2603.08655" rel="noopener"><rect x="207.75" y="707.25" width="159.00" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="72.00" y="110.82" font-size="11.00" class="sc-loraregular sc-k">Finance Agent</text><text x="144.46" y="107.15" font-size="6.60" class="sc-loraregular">59</text><text x="154.76" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="179.65" y="110.82" font-size="11.00" class="sc-loraregular sc-k">Vals AI</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">会（</text><text x="94.00" y="126.44" font-size="11.00" class="sc-loraregular">SEC</text><text x="114.77" y="126.44" font-size="11.00" class="sc-notoserifcjksc">）提交的文件开展研究的表现。</text><text x="268.77" y="126.44" font-size="11.00" class="sc-loraregular sc-k">Vals AI</text><text x="305.81" y="126.44" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上对</text><text x="396.70" y="126.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="481.12" y="126.44" font-size="11.00" class="sc-notoserifcjksc">进行了评估</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">（使用自适应思考和</text><text x="173.89" y="142.06" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="199.40" y="142.06" font-size="11.00" class="sc-notoserifcjksc">推理强度），发现</text><text x="290.30" y="142.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="374.72" y="142.06" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="399.61" y="142.06" font-size="11.00" class="sc-loraregular">64.4%</text><text x="430.17" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，这一成绩将高于该基</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">准测试上目前的所有模型。</text><text x="72.00 82.04 89.73 96.26 101.63 108.44 112.70 115.69 121.37" y="234.21" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="126.46" y="230.54" font-size="6.60" class="sc-loraregular">60</text><text x="137.27" y="234.21" font-size="11.00" class="sc-notoserifcjksc">评估语言模型通过</text><text x="225.27" y="234.21" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Model</text><text x="260.15" y="234.21" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Context Protocol</text><text x="347.70" y="234.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.70" y="234.21" font-size="11.00" class="sc-loraregular sc-k">MCP</text><text x="383.10" y="234.21" font-size="11.00" class="sc-notoserifcjksc">）进行真实世界工具使用的表</text><text x="72.00" y="265.45" font-size="11.00" class="sc-notoserifcjksc">综合为准确的回答。任务涉及在接近生产环境的</text><text x="305.89" y="265.45" font-size="11.00" class="sc-loraregular sc-k">MCP</text><text x="333.18" y="265.45" font-size="11.00" class="sc-notoserifcjksc">服务器环境中进行多次工具调用，要求模</text><text x="72.00" y="281.07" font-size="11.00" class="sc-notoserifcjksc">型使用真实的</text><text x="140.89" y="281.07" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="160.97" y="281.07" font-size="11.00" class="sc-notoserifcjksc">和真实数据、处理错误与重试，并在不同服务器之间进行协调。</text><text x="72.00" y="347.78" font-size="11.00" class="sc-loraregular sc-k">Scale AI</text><text x="115.05" y="347.78" font-size="11.00" class="sc-notoserifcjksc">在自适应思考和</text><text x="194.95" y="347.78" font-size="11.00" class="sc-loraregular">max</text><text x="219.18" y="347.78" font-size="11.00" class="sc-notoserifcjksc">推理强度下评估了</text><text x="310.07" y="347.78" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="391.61" y="347.78" font-size="11.00" class="sc-notoserifcjksc">，发现其通过率（</text><text x="479.61" y="347.78" font-size="11.00" class="sc-loraregular sc-k">Pass Rate</text><text x="527.68" y="347.78" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="363.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="363.40" font-size="11.00" class="sc-loraregular sc-k">77.3%</text><text x="113.95" y="363.40" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="149.85" y="363.40" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="197.51" y="363.40" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="211.40" y="363.40" font-size="11.00" class="sc-loraregular">75.8%</text><text x="240.93" y="363.40" font-size="11.00" class="sc-notoserifcjksc">，在公开排行榜上位列第</text><text x="364.82" y="363.40" font-size="11.00" class="sc-loraregular">2</text><text x="370.73" y="363.40" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="395.62" y="363.40" font-size="11.00" class="sc-loraregular sc-k">Scale</text><text x="425.21" y="363.40" font-size="11.00" class="sc-notoserifcjksc">运行的扩展配置中</text><text x="72.00" y="379.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="379.02" font-size="11.00" class="sc-loraregular">256</text><text x="104.15" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="140.05" y="379.02" font-size="11.00" class="sc-loraregular">/ 100</text><text x="171.09" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具，而排行榜为</text><text x="272.98" y="379.02" font-size="11.00" class="sc-loraregular">20</text><text x="288.61" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="324.51" y="379.02" font-size="11.00" class="sc-loraregular">/ 10–25</text><text x="367.11" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具），</text><text x="422.11" y="379.02" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="468.24" y="379.02" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="72.00" y="394.64" font-size="11.00" class="sc-loraregular sc-k">79.5%</text><text x="101.52" y="394.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="112.52" y="394.64" font-size="11.00" class="sc-loraregular">max</text><text x="133.86" y="394.64" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="144.86" y="394.64" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="170.37" y="394.64" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="195.27" y="394.64" font-size="11.00" class="sc-loraregular sc-k">79.7%</text><text x="223.51" y="394.64" font-size="11.00" class="sc-notoserifcjksc">），表明在更大的工具调用预算下仍有提升空间。</text><text x="72.00" y="428.74" font-size="11.00" class="sc-notoserifcjksc">关于与此前</text><text x="129.89 139.94 147.62 154.15 159.53 166.34 170.59 173.59 179.26" y="428.74" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="187.25" y="428.74" font-size="11.00" class="sc-notoserifcjksc">结果可比性的说明：</text><text x="286.25" y="428.74" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="314.07" y="428.74" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="327.96" y="428.74" font-size="11.00" class="sc-loraregular">4</text><text x="336.81" y="428.74" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="358.81" y="428.74" font-size="11.00" class="sc-loraregular sc-k">Scale</text><text x="388.40" y="428.74" font-size="11.00" class="sc-notoserifcjksc">更新了运行框架（升级了评判</text><text x="72.00" y="444.36" font-size="11.00" class="sc-notoserifcjksc">模型并改进了重试处理），并对排行榜重新评分。此处所有分数均使用更新后的运行框架。基于</text><text x="72.00" y="459.98" font-size="11.00" class="sc-notoserifcjksc">旧运行框架的</text><text x="140.89" y="459.98" font-size="11.00" class="sc-loraregular">Opus</text><text x="170.75" y="459.98" font-size="11.00" class="sc-notoserifcjksc">结果不具可比性。</text><text x="72.00 78.75 84.72 91.39 97.97 101.06 107.74 113.82 119.20 126.04 132.01 138.68 144.53 151.12 154.02" y="519.74" font-size="11.00" class="sc-loraregular">Vending-Bench 2</text><text x="162.82" y="519.74" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="173.82" y="519.74" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Andon Labs</text><text x="233.73" y="519.74" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，衡量</text><text x="346.63" y="519.74" font-size="11.00" class="sc-loraregular">AI</text><text x="360.09" y="519.74" font-size="11.00" class="sc-notoserifcjksc">模型在长时间跨度内经营一项业务的</text><text x="72.00" y="535.36" font-size="11.00" class="sc-notoserifcjksc">表现。</text><text x="105.00" y="531.69" font-size="6.60" class="sc-loraregular">61</text><text x="111.22" y="535.36" font-size="11.00" class="sc-notoserifcjksc">请注意，与我们在</text><text x="199.22" y="535.36" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Project Vend</text><text x="264.70" y="535.36" font-size="11.00" class="sc-notoserifcjksc">中开展的真实世界实验不同，</text><text x="407.70 414.45 420.42 427.09 433.67 436.76 443.44 449.52 454.90 461.74 467.71 474.38 480.23" y="535.36" font-size="11.00" class="sc-loraregular">Vending-Bench</text><text x="489.72" y="535.36" font-size="11.00" class="sc-notoserifcjksc">是纯模拟</text><text x="72.00" y="550.98" font-size="11.00" class="sc-notoserifcjksc">评估。</text><text x="72.00" y="584.51" font-size="11.00" class="sc-notoserifcjksc">模型的任务是以</text><text x="151.89" y="584.51" font-size="11.00" class="sc-loraregular">500</text><text x="72.00" y="635.19" font-size="6.00" class="sc-loraregular">59</text><text x="225.99 231.89 235.86 239.73 245.70 250.33 252.83 256.52 263.42 268.58 272.91 278.21 281.02 285.68 288.14 293.99 298.27 303.80 310.70 315.86 321.68 325.96 332.86 338.23 343.68 349.89 355.51 357.82 364.03 370.24 375.86 381.23" y="652.73" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2508.00828</text><text x="72.00" y="663.59" font-size="6.00" class="sc-loraregular">60</text><text x="79.19 85.41 90.57 96.64 102.62 105.43 107.95 110.58 117.57 120.03 122.55 125.18 130.53 134.40 137.03 142.19 144.91 147.37 150.00 153.05 158.42 164.56 169.93 175.59 178.64 181.10 183.73 192.86 199.85 205.78 210.67 216.86 220.73 223.45 228.61 233.24 235.74 238.37 244.63 247.26 249.98 255.14 259.42 264.90 270.32 275.21 279.84 285.14 290.30 293.02 298.44 30
