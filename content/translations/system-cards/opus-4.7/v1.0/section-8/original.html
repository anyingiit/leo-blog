"sc-notoserifcjksc">阅</text><text x="83.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的工程博客</text><text x="160.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="304.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="304.89" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="192.32 198.68 204.86 207.56 213.53" y="304.89" font-size="11.00" class="sc-loraregular">69.4%</text><text x="225.99" y="304.89" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，该结果为</text><text x="338.88 344.99" y="304.89" font-size="11.00" class="sc-loraregular">89</text><text x="354.24" y="304.89" font-size="11.00" class="sc-notoserifcjksc">个不同任务各进行</text><text x="445.13" y="304.89" font-size="11.00" class="sc-loraregular">5</text><text x="454.02" y="304.89" font-size="11.00" class="sc-notoserifcjksc">次尝试后的平均值</text><text x="72.00" y="320.51" font-size="11.00" class="sc-notoserifcjksc">（共计</text><text x="107.89" y="320.51" font-size="11.00" class="sc-loraregular">445</text><text x="128.71" y="320.51" font-size="11.00" class="sc-notoserifcjksc">次试验）。我们将</text><text x="219.60 227.29 230.28 235.89 242.46 249.03 255.00 257.89 266.62 273.19 279.76 284.85 287.74 293.71 296.06" y="320.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="304.02" y="320.51" font-size="11.00" class="sc-notoserifcjksc">配置为在关闭思考的情况下运行。</text><text x="469.02 475.52 481.49 486.25 496.08 499.17 505.85 511.53 514.52" y="320.51" font-size="11.00" class="sc-loraregular">Terminal-</text><text x="72.00" y="336.13" font-size="11.00" class="sc-loraregular">Bench</text><text x="106.82" y="336.13" font-size="11.00" class="sc-notoserifcjksc">对推理延迟较为敏感：固定的实际耗时超时意味着解码较慢的端点在每个任务中完成的回</text><text x="72.00" y="351.75" font-size="11.00" class="sc-notoserifcjksc">合更少。我们报告的分数使用生产环境</text><text x="261.89 268.78 275.39" y="351.75" font-size="11.00" class="sc-loraregular">API</text><text x="281.97" y="351.75" font-size="11.00" class="sc-notoserifcjksc">端点，以考虑这些动态因素。</text><text x="72.00 80.37 85.06 90.73 97.31 103.88 109.48 113.73 119.70 125.08 131.43 137.34 142.84 148.80 151.79 154.69 163.06 169.49 175.93 182.27 185.27 191.23 196.61 203.27 207.96 214.39 220.77 224.49 227.39 236.14 244.34" y="429.77" font-size="11.00" class="sc-loraregular">Graduate-Level Google-Proof Q&amp;A</text><text x="254.12" y="429.77" font-size="11.00" class="sc-notoserifcjksc">基准测试（</text><text x="309.12 317.49 324.15 332.77" y="429.77" font-size="11.00" class="sc-loraregular">GPQA</text><text x="339.65" y="429.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="350.65" y="426.10" font-size="6.60" class="sc-loraregular">45</text><text x="357.83" y="429.77" font-size="11.00" class="sc-notoserifcjksc">是一组具有挑战性的多项选择科学</text><text x="72.00" y="445.39" font-size="11.00" class="sc-notoserifcjksc">题。我们使用包含</text><text x="162.89" y="445.39" font-size="11.00" class="sc-loraregular">198</text><text x="182.33" y="445.39" font-size="11.00" class="sc-notoserifcjksc">道题的</text><text x="218.22" y="445.39" font-size="11.00" class="sc-loraregular">Diamond</text><text x="72.00" y="461.01" font-size="11.00" class="sc-notoserifcjksc">答不对。</text><text x="116.00 123.69 126.68 132.29 138.86 145.44 151.40 154.29 163.02 169.59 176.16 181.25 184.15 190.11 192.46" y="461.01" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="200.42" y="461.01" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="214.32 222.69 229.35 237.97 244.85 247.75 255.94 259.03 264.71 274.54 280.98 287.65" y="461.01" font-size="11.00" class="sc-loraregular">GPQA Diamond</text><text x="297.13" y="461.01" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="344.02" y="461.01" font-size="11.00" class="sc-loraregular">94.2%</text><text x="377.42" y="461.01" font-size="11.00" class="sc-notoserifcjksc">的成绩，为</te .92 373.49 378.58 381.47 387.44 390.03" y="222.98" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="399.28" y="222.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="413.18 420.87 423.86 429.47 436.03 442.61 448.57 451.47 461.40 467.26 471.52 478.11 484.54" y="222.98" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="238.60" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="238.60" font-size="11.00" class="sc-notoserifcjksc">）依据既定的评分细则进行评判。最终得分取任一评判者所给分数中的最低值。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="288.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="288.89" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="203.32 209.68 215.86 218.56 224.69" y="288.89" font-size="11.00" class="sc-loraregular">69.3%</text><text x="234.26" y="288.89" font-size="11.00" class="sc-notoserifcjksc">，为每道题</text><text x="292.15" y="288.89" font-size="11.00" class="sc-loraregular">10</text><text x="305.88" y="288.89" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值。我们在批处理</text><text x="462.78 469.66 476.27" y="288.89" font-size="11.00" class="sc-loraregular">API</text><text x="482.85" y="288.89" font-size="11.00" class="sc-notoserifcjksc">中使用</text><text x="72.00 81.83 87.74 94.32 97.41 103.98" y="304.51" font-size="11.00" class="sc-loraregular">medium</text><text x="116.70" y="304.51" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="171.70 175.96 182.40 188.23 194.19" y="304.51" font-size="11.00" class="sc-loraregular">token</text><text x="203.76" y="304.51" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="239.65" y="304.51" font-size="11.00" class="sc-loraregular">300k</text><text x="265.35" y="304.51" font-size="11.00" class="sc-notoserifcjksc">；更高的推理强度经常超出</text><text x="400.24 407.13 413.74" y="30 1.00" class="sc-notoserifcjksc">日引入的</text><text x="127.78" y="157.91" font-size="11.00" class="sc-loraregular">v2</text><text x="142.14" y="157.91" font-size="11.00" class="sc-notoserifcjksc">修复。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">与较简单的</text><text x="127.00" y="208.20" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="208.20" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="208.20" font-size="11.00" class="sc-notoserifcjksc">测试不同，</text><text x="234.24" y="208.20" font-size="11.00" class="sc-loraregular">MRCR</text><text x="268.74" y="208.20" font-size="11.00" class="sc-notoserifcjksc">要求模型在多个相同的请求中识别出正确序数的那一个</text><text x="390.51" y="223.82" font-size="11.00" class="sc-loraregular">2</text><text x="399.31" y="223.82" font-size="11.00" class="sc-notoserifcjksc">首或第</text><text x="435.20" y="223.82" font-size="11.00" class="sc-loraregular">4</text><text x="72.00" y="239.44" font-size="11.00" class="sc-notoserifcjksc">试长上下文理解能力与精确的顺序推理能力。</text><text x="72.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.07 130.45 137.13 143.04 148.95 155.52 158.51" y="289.16" font-size="11.00" class="sc-loraregular">8-needle</text><text x="167.37" y="289.16" font-size="11.00" class="sc-notoserifcjksc">变体，这是该评估中难度最高的设置。在所报告的变体中，</text><text x="453.37" y="289.16" font-size="11.00" class="sc-loraregular">256k</text><text x="480.43" y="289.16" font-size="11.00" class="sc-notoserifcjksc">分档对应</text><text x="72.00 76.26 82.69 88.52 94.48" y="304.78" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="304.78" font-size="11.00" class="sc-notoserifcjksc">数位于</text><text x="139.95 143.30 147.31 153.21 159.39 165.30 168.07 170.97 176.87 182.87 189.23 194.88" y="304.78" font-size="11.00" class="sc-loraregular">(128k, 256k]</text><text x="201.73" y="304.78" font-size="11.00" class="sc-notoserifcjksc">区间的提示词，</text><text x="278.73" y="304.78" font-size=" xt x="217.66" y="429.84" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="426.18" font-size="6.60" class="sc-loraregular">50</text><text x="236.36" y="429.84" font-size="11.00" class="sc-notoserifcjksc">是一个处于人类知识前沿的多模态基准测试，包含</text><text x="481.25 487.16 489.93 495.92 502.76" y="429.84" font-size="11.00" class="sc-loraregular">2,500</text><text x="512.49" y="429.84" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="445.46" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="478.65" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 204.63 211.19 217.76 222.85 225.75 231.71 234.06" y="478.65" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="239.13" y="478.65" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="250.13" y="478.65" font-size="11.00" class="sc-loraregular">(1)</text><text x="263.74" y="478.65" font-size="11.00" class="sc-notoserifcjksc">不使用工具的纯推理；</text><text x="373.74" y="478.65" font-size="11.00" class="sc-loraregular">(2)</text><text x="389.25" y="478.65" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程</text><text x="72.00" y="494.27" font-size="11.00" class="sc-notoserifcjksc">序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="349.89 355.50 362.07 366.33" y="494.27" font-size="11.00" class="sc-loraregular">auto</text><text x="372.76" y="494.27" font-size="11.00" class="sc-notoserifcjksc">，且跨上下文使用的</text><text x="474.65 478.91 485.35 491.18 497.14" y="494.27" font-size="11.00" class="sc-loraregular">token</text><text x="506.71" y="494.27" font-size="11.00" class="sc-notoserifcjksc">总数上</text><text x="72.00" y="509.89" font-size="11.00" class="sc-notoserifcjksc">限为</text><text x="96.89" y="509.89" font-size="11.00" class="sc-loraregular">100</text><text x="117.45" y="509.89" font-size="11.00" class="sc-notoserifcjksc">万。与下文其他智能体搜索结果不同，这些结果未使用上下文压缩（</text><text x="447.45 453.25 459.68 466.26 470.52 476.43 482.26" y="509.89" font-size="11. "222.26" y="656.76" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="313.15" y="656.76" font-size="11.00" class="sc-loraregular">46.9%</text><text x="344.11" y="656.76" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="435.00 441.00 446.96 449.31 454.38" y="656.76" font-size="11.00" class="sc-loraregular">54.7%</text><text x="463.95" y="656.76" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.25" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p197.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 197 页"><text x="72.00" y="326.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="326.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 104.99 107.08 112.62 116.09 118.46 125.72 131.16" y="326.68" font-size="9.00" class="sc-lorabold">8.8.1.A] HLE</text><text x="139.14" y="326.68" font-size="9.00" class="sc-notoserifcjkscbold">准确率得分</text><text x="184.14" y="326.68" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="193.14" y="326.68" font-size="9.00" class="sc-loraregular">Gemini</text><text x="225.80" y="326.68" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="237.17" y="326.68" font-size="9.00" class="sc-loraregular">GPT</text><text x="257.60" y="326.68" font-size="9.00" class="sc-notoserifcjksc">模型的分数取自已发布的结果。</text><text x="72.00" y="352.50" font-size="11.00" class="sc-notoserifcjksc">我们还测量了</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.06" y="352.50" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="187.03" y="352.50" font-size="11.00" class="sc-notoserifcjksc">在使用工具时于不同推理强度档位下的结果。</text><text x="72.00" y="660.82" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 104.99 107.08 112.62" y="660.82" font-size="9.00" class="sc-lorabold">8.8.1.B]</text><text x="118.46" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">不同推理强度档位下的</text><text x="210.83" y="660.82" font-size="9.00" class="sc-lorabold">HLE</text><text x="231.51" y="660.82" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="249.51" y="660.82" font-size="9.00" class="sc-notoserifcjksc">。每个数据点代表每个模型在不同推理强度档位下的单次运行，所用</text><text x="72.00 75.48 80.75 85.52 90.40" y="672.52" font-size="9.00" class="sc-loraregular">token</text><text x="98.23" y="672.52" font-size="9.00" class="sc-notoserifcjksc">总数最多为</text><text x="145.59" y="672.52" font-size="9.00" class="sc-loraregular">100</text><text x="162.41" y="672.52" font-size="9.00" class="sc-notoserifcjksc">万。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="111.05" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="140.16" y="107.38" font-size="6.60" class="sc-loraregular">51</text><text x="146.16" y="111.05" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们在使用网络搜索、网</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">页抓取、程序化工具调用和代码执行的条件下运行了</text><text x="327.89 336.63 343.19 349.76 354.85 357.75 363.71 366.06" y="126.67" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="371.13" y="126.67" font-size="11.00" class="sc-notoserifcjksc">。在关闭思考、</text><text x="448.13" y="126.67" font-size="11.00" class="sc-loraregular">max</text><text x="472.37" y="126.67" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="72.00 76.26 82.69 88.52 94.48" y="142.29" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="142.29" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="139.95" y="142.29" font-size="11.00" class="sc-loraregular">1000</text><text x="167.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="233.34 242.07 248.64 255.21 260.30 263.19 269.15 271.51" y="142.29" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="279.47" y="142.29" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="304.36 309.43 315.62 318.32 324.45" y="142.29" font-size="11.00" class="sc-loraregular">79.3%</text><text x="334.02" y="142.29" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="468.91 474.82 481.65 488.48 494.39 497.28 501.54 507.97 513.80 519.77" y="142.29" font-size="11.00" class="sc-loraregular">200k token</text><text x="529.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">时</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">触发）以突破</text><text x="140.89" y="157.91" font-size="11.00" class="sc-loraregular">100</text><text x="161.45" y="157.91" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="175.35 179.60 186.04 191.87 197.83" y="157.91" font-size="11.00" class="sc-loraregular">token</text><text x="207.40" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。我们发现，对该模型而言，自适应思考在这一基准测</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">试上的表现略差。</text><text x="72.00" y="224.40" font-size="11.00" class="sc-notoserifcjksc">我们注意到，在该基准测试上，</text><text x="226.00 234.73 241.30 247.87 252.96 255.85 261.82 264.41" y="224.40" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="273.66" y="224.40" font-size="11.00" class="sc-notoserifcjksc">的测试时计算扩展曲线优于</text><text x="408.56 417.29 423.86 430.42 435.52 438.41 444.37 446.73" y="224.40" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="451.80" y="224.40" font-size="11.00" class="sc-notoserifcjksc">，并在</text><text x="72.00 78.75 83.44 89.77 98.58 103.67 109.63 117.32 123.76 133.59" y="240.02" font-size="11.00" class="sc-loraregular">BrowseComp</text><text x="143.05" y="240.02" font-size="11.00" class="sc-notoserifcjksc">上取得了更高的分数（在</text><text x="266.94" y="240.02" font-size="11.00" class="sc-loraregular">1000</text><text x="294.33" y="240.02" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="308.23 312.48 318.92 324.75 330.71" y="240.02" font-size="11.00" class="sc-loraregular">token</text><text x="340.28" y="240.02" font-size="11.00" class="sc-notoserifcjksc">上限下为</text><text x="387.17 393.35 399.48 401.84 406.91" y="240.02" font-size="11.00" class="sc-loraregular">83.7%</text><text x="419.37" y="240.02" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="433.26 438.33 444.52 447.22 453.35" y="240.02" font-size="11.00" class="sc-loraregular">79.3%</text><text x="462.92" y="240.02" font-size="11.00" class="sc-notoserifcjksc">）。不过，如其</text><text x="72.00" y="255.64" font-size="11.00" class="sc-notoserifcjksc">他章节所示，</text><text x="138.00 146.73 153.30 159.87 164.96 167.85 173.82 176.17" y="255.64" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="184.13" y="255.64" font-size="11.00" class="sc-notoserifcjksc">在搜索类基准测试上通常比</text><text x="319.03 327.76 334.33 340.90 345.99 348.88 354.84 357.44" y="255.64" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="366.69" y="255.64" font-size="11.00" class="sc-notoserifcjksc">更节省</text><text x="402.58 406.84 413.28 419.11 425.07" y="255.64" font-size="11.00" class="sc-loraregular">token</text><text x="431.74" y="255.64" font-size="11.00" class="sc-notoserifcjksc">，因此我们建议用户</text><text x="72.00" y="271.26" font-size="11.00" class="sc-notoserifcjksc">针对各自的具体用例对两个模型都进行试验。</text><text x="72.00" y="600.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="600.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.13 108.23 113.76 117.23 119.60 125.45 129.70 134.73 142.03 146.39 151.24 157.43 162.52 170.77" y="600.66" font-size="9.00" class="sc-lorabold">8.8.2.A] BrowseComp</text><text x="178.54" y="600.66" font-size="9.00" class="sc-notoserifcjkscbold">准确率</text><text x="205.54" y="600.66" font-size="9.00" class="sc-notoserifcjksc">随着我们在上下文压缩的辅助下提高模型可使用的</text><text x="405.91 409.39 414.66 419.43 424.31" y="600.66" font-size="9.00" class="sc-loraregular">token</text><text x="432.14" y="600.66" font-size="9.00" class="sc-notoserifcjksc">总数而提升。</text><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="151.50" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p199.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 199 页"><text x="72.00 80.19 86.10 92.06 98.57 104.80 110.74 116.42 121.10 126.96 133.41 142.03" y="110.82" font-size="11.00" class="sc-loraregular">DeepSearchQA</text><text x="148.91" y="107.15" font-size="6.60" class="sc-loraregular">52</text><text x="156.05" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="167.05" y="110.82" font-size="11.00" class="sc-loraregular">“</text><text x="171.45" y="110.82" font-size="11.00" class="sc-notoserifcjksc">一个包含</text><text x="218.35" y="110.82" font-size="11.00" class="sc-loraregular">900</text><text x="241.26" y="110.82" font-size="11.00" class="sc-notoserifcjksc">个提示词的基准测试，用于评估智能体在横跨</text><text x="464.15" y="110.82" font-size="11.00" class="sc-loraregular">17</text><text x="476.12" y="110.82" font-size="11.00" class="sc-notoserifcjksc">个不同领域</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">的高难度多步信息检索任务上的表现</text><text x="248.00" y="126.44" font-size="11.00" class="sc-loraregular">”</text><text x="251.84" y="126.44" font-size="11.00" class="sc-notoserifcjksc">。其任务要求模型进行大量搜索，以汇总出一份详尽的答案</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">列表。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="175.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="175.82" font-size="11.00" class="sc-notoserifcjksc">模型在启用网络搜索、网页抓取、程序化工具调用、上下文压缩、</text><text x="429.29" y="175.82" font-size="11.00" class="sc-loraregular">max</text><text x="453.52" y="175.82" font-size="11.00" class="sc-notoserifcjksc">推理强度和自适</text><text x="72.00" y="191.44" font-size="11.00" class="sc-notoserifcjksc">应思考的条件下运行。我们使用了上下文压缩：对</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25 402 lar">300</text><text x="256.52" y="664.39" font-size="9.00" class="sc-notoserifcjksc">万。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p201.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 201 页"><text x="72.00 80.20 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="110.82" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="110.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="110.82" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="107.15" font-size="6.60" class="sc-loraregular">53</text><text x="416.16" y="110.82" font-size="11.00" class="sc-notoserifcjksc">）基准测试是</text><text x="485.05 491.61 497.57 502.33 508.90 511.89 517.80 523.63 526.90 531.18" y="110.82" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">推出的一个深度研究基准，旨在评估模型在真实用户会提出的那类复杂研究问题上的表现。</text><text x="72.00 80.09 87.53 94.36 102.05" y="142.06" font-size="11.00" class="sc-loraregular">DRACO</text><text x="113.68" y="142.06" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="127.57" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="148.13" y="142.06" font-size="11.00" class="sc-notoserifcjksc">个精选任务组成，这些任务源自多个领域的真实用户查询。题目依据专家编写的</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">评分细则进行评分，细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质</text><text x="72.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00" y="201.61" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用和代码执行的条件下评估了</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="201.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="201.61" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="72.00" y="217.23" font-size="11.00" class="sc-notoserifcjksc">开启自适应思考、</text><text x="160.00" y="217.23" font-size="11.00" class="sc-loraregular">max</text><text x="184.23" y="217.23" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="242.13 246.38 252.82 258.65 264.61" y="217.23" font-size="11.00" class="sc-loraregular">token</text><text x="274.18" y="217.23" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="310.07" y="217.23" font-size="11.00" class="sc-loraregular">100</text><text x="330.63" y="217.23" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="396.63 405.37 411.93 418.50 423.59 426.49 432.45 434.80" y="217.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="442.77" y="217.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="467.66 472.73 477.32 479.67 484.74" y="217.23" font-size="11.00" class="sc-loraregular">77.7%</text><text x="494.31" y="217.23" font-size="11.00" class="sc-notoserifcjksc">。我们使</text><text x="72.00" y="232.85" font-size="11.00" class="sc-notoserifcjksc">用了上下文压缩（在</text><text x="173.89 179.80 186.63 193.46 199.37 202.26 206.52 212.95 218.78 224.75" y="232.85" font-size="11.00" class="sc-loraregular">200k token</text><text x="234.32" y="232.85" font-size="11.00" class="sc-notoserifcjksc">时触发）。</text><text x="72.00" y="266.41" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="266.41" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57" y="266.41" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 260.61 266.73 272.11 278.78 283.46" y="266.41" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="292.79" y="266.41" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们</text><text x="72.00" y="282.03" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89 182.63 189.19 195.76 200.85 203.75 209.71 212.31" y="282.03" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="221.56" y="282.03" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="246.45" y="282.03" font-size="11.00" class="sc-loraregular">LLM</text><text x="272.16" y="282.03" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="327.16 333.51 339.87 349.97 352.86 355.73 362.30 368.88 374.91" y="282.03" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="380.87" y="282.03" font-size="11.00" class="sc-notoserifcjksc">），依据各任务的评分细则对回</text><text x="72.00" y="297.65" font-size="11.00" class="sc-notoserifcjksc">答进行评分，采用相同的二元</text><text x="217.89 227.99 234.83 241.09 248.68 256.95 265.34 275.43 282.28" y="297.65" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="292.21" y="297.65" font-size="11.00" class="sc-notoserifcjksc">判定，并按论文</text><text x="372.10" y="297.65" font-size="11.00" class="sc-loraregular">§4.2</text><text x="395.43" y="297.65" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我</text><text x="72.00" y="313.27" font-size="11.00" class="sc-notoserifcjksc">们遵循论文的实验方案，对每个回答进行</text><text x="272.89" y="313.27" font-size="11.00" class="sc-loraregular">5</text><text x="281.78" y="313.27" font-size="11.00" class="sc-notoserifcjksc">次独立的评分运行并报告平均值。我们的评判提示词</text><text x="72.00" y="328.89" font-size="11.00" class="sc-notoserifcjksc">取自论文附录</text><text x="140.89" y="328.89" font-size="11.00" class="sc-loraregular">C.2</text><text x="157.20" y="328.89" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="215.09" y="328.89" font-size="11.00" class="sc-loraregular">A</text><text x="224.87" y="328.89" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变动</text><text x="436.76" y="328.89" font-size="11.00" class="sc-loraregular">10–25</text><text x="468.88" y="328.89" font-size="11.00" class="sc-notoserifcjksc">分，但系统排</text><text x="72.00" y="344.51" font-size="11.00" class="sc-notoserifcjksc">序保持不变，因此我们的分数与论文的主要公布数字不能直接比较。</text><text x="72.00" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们与原论文有两点不同：</text><text x="204.00" y="373.61" font-size="11.00" class="sc-loraregular">(1)</text><text x="217.61" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="264.50 272.19 275.18 280.79 287.36 293.94 299.90 302.79 311.53 318.09 324.66 329.75 332.65 338.61 341.20" y="373.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="350.45" y="373.61" font-size="11.00" class="sc-notoserifcjksc">作为评判模型，而论文的主要评判模型</text><text x="72.00" y="389.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89 94.26 100.23 110.06 113.15 119.83 122.92 128.03 134.16 139.54 146.21 150.89" y="389.23" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="157.33" y="389.23" font-size="11.00" class="sc-notoserifcjksc">（此后已弃用）；</text><text x="245.33" y="389.23" font-size="11.00" class="sc-loraregular">(2)</text><text x="260.84" y="389.23" font-size="11.00" class="sc-notoserifcjksc">我们指示模型将其最终报告包裹在</text><text x="425.84" y="389.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="478.65" y="389.23" font-size="11.00" class="sc-notoserifcjksc">标签中，并</text><text x="72.00" y="404.85" font-size="11.00" class="sc-notoserifcjksc">仅对该部分进行评分，而不是对完整的智能体对话记录评分；这样可以将交付物与中间工具输出</text><text x="72.00" y="420.47" font-size="11.00" class="sc-notoserifcjksc">隔离开来。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.50" y="707.25" width="155.25" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p202.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 202 页"><text x="72.00" y="276.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.25 108.35 113.89 117.36 119.73 126.43 132.61 138.44 144.63" y="276.43" font-size="9.00" class="sc-lorabold">8.8.4.A] DRACO</text><text x="153.92" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">归一化分数</text><text x="198.92" y="276.43" font-size="9.00" class="sc-notoserifcjksc">。这些分数代表每个模型的单次运行，每个分数为以</text><text x="408.29 415.43 420.80 426.18 430.34 432.71 437.59 439.71" y="276.43" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="447.28" y="276.43" font-size="9.00" class="sc-notoserifcjksc">作为评判模型进行五次</text><text x="72.00" y="288.13" font-size="9.00" class="sc-notoserifcjksc">评分运行的平均值。</text><text x="72.00" y="551.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.25 108.35 113.89" y="551.31" font-size="9.00" class="sc-lorabold">8.8.4.B]</text><text x="119.73" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">按评分细则维度划分的</text><text x="212.09 218.80 224.97 230.80 237.00" y="551.31" font-size="9.00" class="sc-lorabold">DRACO</text><text x="246.29" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">通过率。</text><text x="282.29 289.43 294.80 300.18 304.34 306.71 311.59 313.52" y="551.31" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="320.03" y="551.31" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="349.40 356.54 361.92 367.29 371.46 373.82 378.70 380.83" y="551.31" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="388.40" y="551.31" font-size="9.00" class="sc-notoserifcjksc">的提升集中在分析的广度与深度以及</text><text x="72.00" y="563.01" font-size="9.00" class="sc-notoserifcjksc">引用质量上，而事实准确性和呈现质量大致保持不变。</text><text x="72.00" y="597.95" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="597.95" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="624.52" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="624.52" font-size="11.00" class="sc-notoserifcjksc">支持的最大图像分辨率为单一图像维度上最多</text><text x="379.32 385.23 391.22 396.29 402.65 409.16" y="624.52" font-size="11.00" class="sc-loraregular">2576px</text><text x="414.99" y="624.52" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="472.88 479.01 481.37 486.44 492.43 502.53" y="624.52" font-size="11.00" class="sc-loraregular">3.75MP</text><text x="509.20" y="624.52" font-size="11.00" class="sc-notoserifcjksc">。包</text><text x="72.00" y="640.14" font-size="11.00" class="sc-notoserifcjksc">括</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="640.14" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77" y="640.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="222.67 230.36 233.35 238.96 245.53 252.10 258.07 260.96 269.69 276.26 282.83 287.92 290.81 296.77 299.37" y="640.14" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="308.62" y="640.14" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型支持的最大图像分辨率为单一图</text><text x="72.00" y="655.76" font-size="11.00" class="sc-notoserifcjksc">像维度上最多</text><text x="140.89 144.90 150.89 157.25 163.43 169.94" y="655.76" font-size="11.00" class="sc-loraregular">1568px</text><text x="175.77" y="655.76" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="233.67" y="655.76" font-size="11.00" class="sc-loraregular">1.15MP</text><text x="267.14" y="655.76" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="292.03 299.72 302.71 308.32 314.89 321.47 327.43 330.32 339.06 345.63 352.19 357.29 360.18 366.14 368.49" y="655.76" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="376.46" y="655.76" font-size="11.00" class="sc-notoserifcjksc">系统卡中，除非另有说明，我们</text><text x="72.00" y="671.38" font-size="11.00" class="sc-notoserifcjksc">报告的各模型分数均使用其支持的最大图像分辨率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p203.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 203 页"><text x="72.00 78.55 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="111.05" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，用于测试模型能否正确解读和分析生物学研究论文</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">中复杂科学图表所含的信息。该基准测试是由</text><text x="294.89 300.81 307.38 311.64 318.20 322.89 328.67 337.01 343.45 350.01 355.11" y="126.67" font-size="11.00" class="sc-loraregular">FutureHouse</text><text x="363.96" y="126.67" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="399.86 406.46 412.13 418.81 424.89 431.46 437.13 443.16 449.12 452.02 458.90 464.93 470.89 477.47 481.73 484.62 491.38 494.47 500.90 503.89 510.33 516.63" y="126.67" font-size="11.00" class="sc-loraregular">Language Agent Biology</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15" y="142.29" font-size="11.00" class="sc-loraregular">Benchmark</text><text x="130.06" y="142.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="142.29" font-size="11.00" class="sc-loraregular">LAB-Bench</text><text x="198.63" y="142.29" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.63" y="138.62" font-size="6.60" class="sc-loraregular">54</text><text x="216.81" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的一部分，后者评估</text><text x="318.70" y="142.29" font-size="11.00" class="sc-loraregular">AI</text><text x="332.16" y="142.29" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务上的能力。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考、</text><text x="171.00" y="208.20" font-size="11.00" class="sc-loraregular">max</text><text x="195.23" y="208.20" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的条件下，</text><text x="360.23 367.92 370.91 376.52 383.09 389.67 395.63 398.52 407.26 413.82 420.39 425.48 428.38 434.34 436.69" y="208.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="444.66" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="458.55 464.52 467.62 473.70 482.31" y="208.20" font-size="11.00" class="sc-loraregular">FigQA</text><text x="492.09" y="208.20" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="72.00 77.07 83.25 85.85 92.21" y="223.82" font-size="11.00" class="sc-loraregular">78.6%</text><text x="104.67" y="223.82" font-size="11.00" class="sc-notoserifcjksc">的分数。在开启自适应思考、</text><text x="247.67" y="223.82" font-size="11.00" class="sc-loraregular">max</text><text x="271.90" y="223.82" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="351.80 358.63 364.49 368.75 375.34 381.77" y="223.82" font-size="11.00" class="sc-loraregular">Python</text><text x="391.34" y="223.82" font-size="11.00" class="sc-notoserifcjksc">工具的条件下，</text><text x="468.34 476.03 479.02 484.63 491.20 497.78 503.74 506.63 515.37 521.93 528.50" y="223.82" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.32" y="239.44" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28" y="239.44" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="124.17" y="239.44" font-size="11.00" class="sc-loraregular">86.4%</text><text x="157.84" y="239.44" font-size="11.00" class="sc-notoserifcjksc">的分数。在两种设置下，</text><text x="278.84 286.53 289.52 295.14 301.70 308.28 314.24 317.14 325.87 332.44 339.00 344.10 346.99 352.95 355.30" y="239.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="363.27" y="239.44" font-size="11.00" class="sc-notoserifcjksc">均优于</text><text x="399.16 406.85 409.84 415.45 422.02 428.60 434.56 437.45 446. ont-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具时，准确率从</text><text x="72.00 76.92 82.88 85.42 92.25" y="611.07" font-size="11.00" class="sc-loraregular">74.0%</text><text x="104.71" y="611.07" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="129.61 134.68 140.86 143.46 149.81" y="611.07" font-size="11.00" class="sc-loraregular">78.6%</text><text x="159.38" y="611.07" font-size="11.00" class="sc-notoserifcjksc">。在使用</text><text x="206.28 213.11 218.97 223.23 229.82 236.25" y="611.07" font-size="11.00" class="sc-loraregular">Python</text><text x="245.82" y="611.07" font-size="11.00" class="sc-notoserifcjksc">工具时，提高最大图像分辨率使</text><text x="402.72 410.40 413.40 419.01 425.57 432.15 438.11 441.01 449.74 456.31 462.87 467.97 470.86 476.82 479.18" y="611.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="487.14" y="611.07" font-size="11.00" class="sc-notoserifcjksc">的分数从</text><text x="72.00" y="626.69" font-size="11.00" class="sc-loraregular">85.8%</text><text x="105.53" y="626.69" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="130.42" y="626.69" font-size="11.00" class="sc-loraregular">86.4%</text><text x="161.20" y="626.69" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="198.00" y="707.25" width="156.00" height="12.75" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="72.00" y="359.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="198.39" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="225.39" y="359.68" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="236.75" y="359.68" font-size="9.00" class="sc-loraregular">1080p</text><text x="264.01" y="359.68" font-size="9.00" class="sc-notoserifcjksc">分辨率、最多</text><text x="320.37" y="359.68" font-size="9.00" class="sc-loraregular">100</text><text x="337.19" y="359.68" font-size="9.00" class="sc-notoserifcjksc">个操作步数下的首次尝试任务成功率。分数为五次</text><text x="72.00" y="371.38" font-size="9.00" class="sc-notoserifcjksc">运行的平均值。</text><text x="72.00" y="398.75" font-size="11.00" class="sc-notoserifcjksc">在本次评估中，我们对智能体脚手架进行了更新，包括基础设施稳定性修复和少量提示词改进。</text><text x="72.00" y="414.37" font-size="11.00" class="sc-notoserifcjksc">这些改进包括：引导模型将可预测的操作批量合并到单次工具调用中；尽早声明任务不可行，而</text><text x="72.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">所有模型。在相同设置下重新运行</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.00 316.60" y="445.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="325.85" y="445.61" font-size="11.00" class="sc-notoserifcjksc">得到</text><text x="350.74 355.81 361.72 364.31 370.67" y="445.61" font-size="11.00" class="sc-loraregular">72.6%</text><text x="380.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">，与其此前</text><text x="435.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="457.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="471.14 476.21 482.11 484.47 489.54" y="445.61" font-size="11.00" class="sc-loraregular">72.7%</text><text x="502.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">相差在</text><text x="72.00" y="461.23" font-size="11.00" class="sc-notoserifcjksc">运行间噪声范围内，表明该设置本身不会为以往的</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="461.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18" y="461.23" font-size="11.00" class="sc-notoserifcjksc">模型带来有意义的提升。</text><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="72.00" y="361.24" font-size="10.00" class="sc-lorabold">[</text><text x="75.86" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">图</text><text x="88.49 94.21 96.54 102.14 104.47 109.94 112.27 118.42" y="361.24" font-size="10.00" class="sc-lorabold">8.9.4.B]</text><text x="124.91" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">各模型在四个推理强度档位下的</text><text x="390.63" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">与每任务平均输出</text><text x="473.26 477.39 483.01 488.70 494.08" y="361.24" font-size="10.00" class="sc-lorabold">token</text><text x="503.09" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">数的关</text><text x="72.00" y="375.44" font-size="10.00" class="sc-notoserifcjkscbold">系。</text><text x="92.00" y="375.44" font-size="10.00" class="sc-notoserifcjksc">推理强度控制模型投入的努力程度。本图所示的所有分数均使用上文所述的更新后智能体脚手架。其</text><text x="72.00" y="389.64" font-size="10.00" class="sc-notoserifcjksc">余评估设置与图</text><text x="144.63 150.25 152.71 158.33 160.79 166.21 168.67" y="389.64" font-size="10.00" class="sc-loraregular">8.9.4.A</text><text x="177.56" y="389.64" font-size="10.00" class="sc-notoserifcjksc">相同。</text><text x="72.00" y="423.99" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="423.99" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="118.67" y="485.09" font-size="6.60" class="sc-loraregular">58</text><text x="128.87" y="488.76" font-size="11.00" class="sc-notoserifcjksc">是一个基准测试，用于评估语言模型在真实的办公类问答任务上的表现，这些任务源</text><text x="72.00" y="504.38" font-size="11.00" class="sc-notoserifcjksc">自知识工作者日常处理的文档、电子表格和演示文稿。任务要求模型阅读冗长且异构的专业文</text><text x="72.00" y="520.00" font-size="11.00" class="sc-notoserifcjksc">档，并回答依赖于精确信息提取、跨章节综合以及数值或表格推理的问题。</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 482.02 488.59 495.16 500.25 503.14 509.11 511.46" y="520.00" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="519.43" y="520.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.57" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="157.46" y="535.62" font-size="11.00" class="sc-loraregular">86.3%</text><text x="188.40" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="283.54" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="319.43 325.62 332.27 334.87 341.23" y="535.62" font-size="11.00" class="sc-loraregular">80.6%</text><text x="350.80" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，两者均采用精确匹配评分（允许的相</text><text x="72.00" y="551.24" font-size="11.00" class="sc-notoserifcjksc">对误差为</text><text x="118.89" y="551.24" font-size="11.00" class="sc-loraregular">0%</text><text x="135.29" y="551.24" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://arxiv.org/abs/2603.08655" rel="noopener"><rect x="207.75" y="707.25" width="159.00" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="72.00 77.97 81.06 87.74 93.42 100.09 105.89 111.85 114.75 121.63 127.66 133.62 140.20" y="110.82" font-size="11.00" class="sc-loraregular">Finance Agent</text><text x="144.46" y="107.15" font-size="6.60" class="sc-loraregular">59</text><text x="154.76" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="179.65 186.57 192.25 195.24 200.33 203.23 210.11" y="110.82" font-size="11.00" class="sc-loraregular">Vals AI</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">会（</text><text x="94.00" y="126.44" font-size="11.00" class="sc-loraregular">SEC</text><text x="114.77" y="126.44" font-size="11.00" class="sc-notoserifcjksc">）提交的文件开展研究的表现。</text><text x="268.77 275.69 281.36 284.36 289.45 292.34 299.23" y="126.44" font-size="11.00" class="sc-loraregular">Vals AI</text><text x="305.81" y="126.44" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上对</text><text x="396.70 404.39 407.38 412.99 419.56 426.13 432.10 434.99 443.72 450.29 456.86 461.95 464.84 470.80 473.16" y="126.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="481.12" y="126.44" font-size="11.00" class="sc-notoserifcjksc">进行了评估</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">（使用自适应思考和</text><text x="173.89 180.48 183.57 189.92" y="142.06" font-size="11.00" class="sc-loraregular">high</text><text x="199.40" y="142.06" font-size="11.00" class="sc-notoserifcjksc">推理强度），发现</text><text x="290.30 297.98 300.98 306.59 313.15 319.73 325.69 328.59 337.32 343.89 350.45 355.55 358.44 364.40 366.76" y="142.06" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="374.72" y="142.06" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="399.61" y="142.06" font-size="11.00" class="sc-loraregular">64.4%</text><text x="430.17" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，这一成绩将高于该基</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">准测试上目前的所有模型。</text><text x="72.00 82.04 89.73 96.26 101.63 108.44 112.70 115.69 121.37" y="234.21" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="126.46" y="230.54" font-size="6.60" class="sc-loraregular">60</text><text x="137.27" y="234.21" font-size="11.00" class="sc-notoserifcjksc">评估语言模型通过</text><text x="225.27 235.29 241.72 248.30 254.26" y="234.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Model</text><text x="260.15 267.84 274.27 280.85 285.11 291.01 296.84 301.10 303.99 310.66 315.35 321.78 326.04 332.47 338.27 344.71" y="234.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Context Protocol</text><text x="347.70" y="234.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.70 368.74 376.43" y="234.21" font-size="11.00" class="sc-loraregular">MCP</text><text x="383.10" y="234.21" font-size="11.00" class="sc-notoserifcjksc">）进行真实世界工具使用的表</text><text x="72.00" y="265.45" font-size="11.00" class="sc-notoserifcjksc">综合为准确的回答。任务涉及在接近生产环境的</text><text x="305.89 315.94 323.62" y="265.45" font-size="11.00" class="sc-loraregular">MCP</text><text x="333.18" y="265.45" font-size="11.00" class="sc-notoserifcjksc">服务器环境中进行多次工具调用，要求模</text><text x="72.00" y="281.07" font-size="11.00" class="sc-notoserifcjksc">型使用真实的</text><text x="140.89 147.78 154.39" y="281.07" font-size="11.00" class="sc-loraregular">API</text><text x="160.97" y="281.07" font-size="11.00" class="sc-notoserifcjksc">和真实数据、处理错误与重试，并在不同服务器之间进行协调。</text><text x="72.00 78.24 84.07 89.74 92.74 98.70 101.59 108.48" y="347.78" font-size="11.00" class="sc-loraregular">Scale AI</text><text x="115.05" y="347.78" font-size="11.00" class="sc-notoserifcjksc">在自适应思考和</text><text x="194.95" y="347.78" font-size="11.00" class="sc-loraregular">max</text><text x="219.18" y="347.78" font-size="11.00" class="sc-notoserifcjksc">推理强度下评估了</text><text x="310.07 317.76 320.75 326.36 332.93 339.51 345.47 348.36 357.10 363.67 370.23 375.32 378.22 384.18 386.53" y="347.78" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="391.61" y="347.78" font-size="11.00" class="sc-notoserifcjksc">，发现其通过率（</text><text x="479.61 486.19 491.87 496.96 502.06 504.95 511.86 517.46 521.71" y="347.78" font-size="11.00" class="sc-loraregular">Pass Rate</text><text x="527.68" y="347.78" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="363.40" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 90.96 95.55 98.26 104.38" y="363.40" font-size="11.00" class="sc-loraregular">77.3%</text><text x="113.95" y="363.40" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="149.85 158.58 165.15 171.71 176.81 179.70 185.66 188.26" y="363.40" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="197.51" y="363.40" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="211.40" y="363.40" font-size="11.00" class="sc-loraregular">75.8%</text><text x="240.93" y="363.40" font-size="11.00" class="sc-notoserifcjksc">，在公开排行榜上位列第</text><text x="364.82" y="363.40" font-size="11.00" class="sc-loraregular">2</text><text x="370.73" y="363.40" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="395.62 401.86 407.69 413.36 416.36" y="363.40" font-size="11.00" class="sc-loraregular">Scale</text><text x="425.21" y="363.40" font-size="11.00" class="sc-notoserifcjksc">运行的扩展配置中</text><text x="72.00" y="379.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="379.02" font-size="11.00" class="sc-loraregular">256</text><text x="104.15" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="140.05" y="379.02" font-size="11.00" class="sc-loraregular">/ 100</text><text x="171.09" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具，而排行榜为</text><text x="272.98" y="379.02" font-size="11.00" class="sc-loraregular">20</text><text x="288.61" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="324.51" y="379.02" font-size="11.00" class="sc-loraregular">/ 10–25</text><text x="367.11" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具），</text><text x="422.11 430.84 437.41 443.98 449.07 451.96 457.92 460.28" y="379.02" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="468.24" y="379.02" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="72.00 77.07 83.25 85.96 91.95" y="394.64" font-size="11.00" class="sc-loraregular">79.5%</text><text x="101.52" y="394.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="112.52" y="394.64" font-size="11.00" class="sc-loraregular">max</text><text x="133.86" y="394.64" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="144.86 151.45 154.54 160.89" y="394.64" font-size="11.00" class="sc-loraregular">high</text><text x="170.37" y="394.64" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="195.27 200.34 206.52 208.87 213.94" y="394.64" font-size="11.00" class="sc-loraregular">79.7%</text><text x="223.51" y="394.64" font-size="11.00" class="sc-notoserifcjksc">），表明在更大的工具调用预算下仍有提升空间。</text><text x="72.00" y="428.74" font-size="11.00" class="sc-notoserifcjksc">关于与此前</text><text x="129.89 139.94 147.62 154.15 159.53 166.34 170.59 173.59 179.26" y="428.74" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="187.25" y="428.74" font-size="11.00" class="sc-notoserifcjksc">结果可比性的说明：</text><text x="286.25 292.15 298.91 304.82" y="428.74" font-size="11.00" class="sc-loraregular">2026</text><text x="314.07" y="428.74" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="327.96" y="428.74" font-size="11.00" class="sc-loraregular">4</text><text x="336.81" y="428.74" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="358.81 365.05 370.88 376.56 379.55" y="428.74" font-size="11.00" class="sc-loraregula <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p211.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 211 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">在数千项业务决策中展现出持续的连贯性和战略规划能力。为了取得好成绩，模型必须成功地通</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">过电子邮件寻找供应商并与之谈判、管理库存、优化定价，并适应动态的市场条件。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="147.39" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.43" y="147.39" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="170.32" y="147.39" font-size="11.00" class="sc-loraregular">Max</text><text x="194.82" y="147.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.71 217.21 220.30 226.65" y="147.39" font-size="11.00" class="sc-loraregular">High</text><text x="236.13" y="147.39" font-size="11.00" class="sc-notoserifcjksc">两个推理强度档位运行。</text><text x="357.13 363.89 369.85 376.52 383.10 386.19 392.87 398.95 404.33 411.17 417.14 423.81 429.67" y="147.39" font-size="11.00" class="sc-loraregular">Vending-Bench</text><text x="439.15" y="147.39" font-size="11.00" class="sc-notoserifcjksc">有自己的上下文管理</text><text x="72.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">系统，这意味着</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="163.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="190.18" y="163.01" font-size="11.00" class="sc-notoserifcjksc">的上下文编辑功能未被启用。</text><text x="333.18 341.92 348.49 355.05 360.15 363.04 369.00 371.35" y="163.01" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="379.32" y="163.01" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="393.21" y="163.01" font-size="11.00" class="sc-loraregular">Max</text><text x="417.71" y="163.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下的最终余额为</text><text x="72.00 76.00 82.66 85.43 91.79 97.65" y="178.63" font-size="11.00" class="sc-loraregular">10,937</text><text x="105.63" y="178.63" font-size="11.00" class="sc-notoserifcjksc">美元，在</text><text x="152.52 161.02 164.11 170.46" y="178.63" font-size="11.00" class="sc-loraregular">High</text><text x="179.94" y="178.63" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="248.84 253.42 256.20 262.29 267.36" y="178.63" font-size="11.00" class="sc-loraregular">7,971</text><text x="274.27" y="178.63" font-size="11.00" class="sc-notoserifcjksc">美元，而此前的</text><text x="354.16 360.40 369.00 375.78" y="178.63" font-size="11.00" class="sc-loraregular">SOTA</text><text x="382.66" y="178.63" font-size="11.00" class="sc-notoserifcjksc">（最先进水平）为</text><text x="473.56 482.29 488.86 495.42 500.52 503.41 509.37 511.97" y="178.63" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="521.22" y="178.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 78.18 80.79 87.62 91.62" y="194.25" font-size="11.00" class="sc-loraregular">8,018</text><text x="100.71" y="194.25" font-size="11.00" class="sc-notoserifcjksc">美元。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33" y="258.36" font-size="11.00" class="sc-loraregular">GDPval-AA</text><text x="129.21" y="254.69" font-size="6.60" class="sc-loraregular">62</text><text x="139.46" y="258.36" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="238.16" y="258.36" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真实世</text><text x="72.00" y="273.98" font-size="11.00" class="sc-notoserifcjksc">界专业任务上测试</text><text x="162.89" y="273.98" font-size="11.00" class="sc-loraregular">AI</text><text x="176.36" y="273.98" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="289.25" y="273.98" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="330.65" y="273.98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="341.65 350.03 358.11 365.10 370.54 376.22" y="273.98" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="382.10" y="273.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="437.10" y="270.31" font-size="6.60" class="sc-loraregular">60</text><text x="445.01" y="273.98" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="469.91" y="273.98" font-size="11.00" class="sc-loraregular">220</text><text x="491.45" y="273.98" font-size="11.00" class="sc-notoserifcjksc">个任务，</text><text x="72.00" y="289.60" font-size="11.00" class="sc-notoserifcjksc">涵盖</text><text x="96.89" y="289.60" font-size="11.00" class="sc-loraregular">9</text><text x="106.14" y="289.60" font-size="11.00" class="sc-notoserifcjksc">个主要行业的</text><text x="175.04" y="289.60" font-size="11.00" class="sc-loraregular">44</text><text x="189.85" y="289.60" font-size="11.00" class="sc-notoserifcjksc">种职业。任务反映了真实的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="305.22" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="305.22" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="305.22" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，表现通过基于</text><text x="72.00" y="320.84" font-size="11.00" class="sc-notoserifcjksc">模型输出盲评两两比较得出的</text><text x="217.89" y="320.84" font-size="11.00" class="sc-loraregular">Elo</text><text x="237.06" y="320.84" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="72.00" y="666.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.27 112.37 117.90 121.37 123.74 130.53 137.23 142.98 147.79 152.51 155.23 159.47 165.70 171.71 174.08 179.69 182.50" y="666.21" font-size="9.00" class="sc-lorabold">8.10.5.A] GDPval-AA Elo</text><text x="189.96" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">评分。</text><text x="216.96 223.25 225.70 230.29 235.66 241.05 245.92 248.29 255.44 260.81 266.18 270.35 272.72 277.60 279.52" y="666.21" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="286.04" y="666.21" font-size="9.00" class="sc-notoserifcjksc">领先</text><text x="306.41 313.25 318.71 323.89 328.29 333.20 335.41" y="666.21" font-size="9.00" class="sc-loraregular">GPT-5.4</text><text x="340.29" y="666.21" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="349.29 351.31 356.08 361.47 364.00 369.19 374.37" y="666.21" font-size="9.00" class="sc-loraregular">‘xhigh’</text><text x="375.94" y="666.21" font-size="9.00" class="sc-notoserifcjksc">）约</text><text x="396.31" y="666.21" font-size="9.00" class="sc-loraregular">79</text><text x="408.02" y="666.21" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="419.39" y="666.21" font-size="9.00" class="sc-loraregular">Elo</text><text x="435.07" y="666.21" font-size="9.00" class="sc-notoserifcjksc">分，意味着约</text><text x="491.44" y="666.21" font-size="9.00" class="sc-loraregular">61.2%</text><text x="517.16" y="666.21" font-size="9.00" class="sc-notoserifcjksc">的两</text><text x="72.00" y="677.91" font-size="9.00" class="sc-notoserifcjksc">两比较胜率。评估由</text><text x="229.48" y="677.91" font-size="9.00" class="sc-notoserifcjksc">独立运行。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="222.00" y="707.25" width="155.25" height="12.75" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="150.46" y="249.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="150.46" y="249.56" width="43.54" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="194.00" y="249.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="196.89" y="249.56" width="41.26" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="341.65" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="341.65" y="265.18" width="37.55" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="379.21" y="265.18" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="382.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="393.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="393.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="404.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="404.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="415.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="415.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="426.10" y="265.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/gdpval" rel="noopener"><rect x="426.10" y="265.18" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="72.00 78.89 85.79 93.27 98.65 105.48 113.86" y="110.55" font-size="11.00" class="sc-loraregular">ARC-AGI</text><text x="117.54" y="106.88" font-size="6.60" class="sc-loraregular">63</text><text x="127.92" y="110.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.82 159.70 166.61 174.30 177.19 183.86 188.62 191.71 197.25 203.21 206.10 211.96 218.40 224.97 231.64 238.22 243.82 248.08 251.17 257.60" y="110.55" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="267.18" y="110.55" font-size="11.00" class="sc-notoserifcjksc">开发的流体智力基准测试，旨在衡量</text><text x="446.08" y="110.55" font-size="11.00" class="sc-loraregular">AI</text><text x="459.54" y="110.55" font-size="11.00" class="sc-notoserifcjksc">模型在仅给出少</text><text x="72.00" y="126.17" font-size="11.00" class="sc-notoserifcjksc">量（通常</text><text x="118.89 124.60 131.09" y="126.17" font-size="11.00" class="sc-loraregular">2–3</text><text x="140.11" y="126.17" font-size="11.00" class="sc-notoserifcjksc">个）示例的情况下对新颖模式进行推理的能力。模型会获得若干满足某种隐藏关系</text><text x="72.00" y="141.79" font-size="11.00" class="sc-notoserifcjksc">的网格输入</text><text x="127.00" y="141.79" font-size="11.00" class="sc-loraregular">-</text><text x="132.38" y="141.79" font-size="11.00" class="sc-notoserifcjksc">输出对，任务是推断出新输入网格所对应的输出。该基准测试有两个变体：</text><text x="495.38 502.26 509.17 516.65" y="141.79" font-size="11.00" class="sc-loraregular">ARC-</text><text x="72.00 78.83 87.20 90.71 95.80" y="157.41" font-size="11.00" class="sc-loraregular">AGI-1</text><text x="102.70" y="157.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="116.59 123.48 130.39 137.87 143.25 150.08 158.45 161.96 166.99" y="157.41" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="172.89" y="157.41" font-size="11.00" class="sc-notoserifcjksc">。（</text><text x="194.89 201.78 208.69 216.38 219.27 225.93 230.70 233.79 239.32 245.28 248.18 254.04 260.47 267.04 273.72 280.30 285.90 290.15 293.24 299.68" y="157.41" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="309.26" y="157.41" font-size="11.00" class="sc-notoserifcjksc">还有另一个</text><text x="367.15 374.04 380.95 388.43 393.80 400.64 409.01 412.52 417.63" y="157.41" font-size="11.00" class="sc-loraregular">ARC-AGI-3</text><text x="426.65" y="157.41" font-size="11.00" class="sc-notoserifcjksc">基准测试，截至发布时</text><text x="72.00" y="173.03" font-size="11.00" class="sc-notoserifcjksc">尚未在该模型上运行。）这些测试使用私有验证集，以确保不同模型之间的一致性和公平性。</text><text x="72.00" y="256.50" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69 107.17 112.55 119.38 127.75 131.26 136.35" y="256.50" font-size="11.00" class="sc-loraregular">ARC-AGI-1</text><text x="143.25" y="256.50" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="165.25 172.94 175.93 181.54 188.11 194.68 200.65 203.54 212.27 218.84 225.41 230.50 233.39 239.35 241.71" y="256.50" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="249.67" y="256.50" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="296.57 305.30 311.87 318.43 323.53 326.42 332.38 334.98" y="256.50" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="344.23" y="256.50" font-size="11.00" class="sc-notoserifcjksc">相近，在</text><text x="391.12 399.62 402.72 409.06" y="256.50" font-size="11.00" class="sc-loraregular">High</text><text x="418.54" y="256.50" font-size="11.00" class="sc-notoserifcjksc">推理强度档位下达到</text><text x="72.00" y="272.12" font-size="11.00" class="sc-loraregular">93.5%</text><text x="102.76" y="272.12" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="127.65 136.38 142.95 149.52 154.61 157.50 163.47 166.06" y="272.12" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="175.31" y="272.12" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="189.21 195.56 201.53 204.07 210.90" y="272.12" font-size="11.00" class="sc-loraregular">94.0%</text><text x="220.47" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。两个模型在该推理强度档位下的得分均高于</text><text x="443.36" y="272.12" font-size="11.00" class="sc-loraregular">Max</text><text x="464.96" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。我们认为，</text><text x="72.00" y="287.74" font-size="11.00" class="sc-notoserifcjksc">这是由于在最高思考档位下出现了上下文耗尽。</text><text x="72.00" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69 107.17 112.55 119.38 127.75 131.26 136.28" y="321.27" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="145.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="167.08 174.77 177.76 183.38 189.94 196.52 202.48 205.38 214.11 220.68 227.24 232.34 235.23 241.19 243.54" y="321.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="251.51" y="321.27" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="265.40" y="321.27" font-size="11.00" class="sc-loraregular">Max</text><text x="289.90" y="321.27" font-size="11.00" class="sc-notoserifcjksc">思考档位下</text><text x="347.79" y="321.27" font-size="11.00" class="sc-loraregular">75.83%</text><text x="386.34" y="321.27" font-size="11.00" class="sc-notoserifcjksc">的成绩创下</text><text x="444.23" y="321.27" font-size="11.00" class="sc-loraregular">Opus</text><text x="474.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">级模型的新高</text><text x="72.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">分。在较低的思考档位下，它的表现与</text><text x="261.89 270.63 277.19 283.76 288.85 291.75 297.71 300.30" y="336.89" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="309.56" y="336.89" font-size="11.00" class="sc-notoserifcjksc">相当。</text><a href="https://arxiv.org/abs/2505.11831" rel="noopener"><rect x="150.00" y="707.25" width="153.00" height="12.75" fill="transparent"/></a></svg></div>
