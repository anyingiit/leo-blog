<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="72.00" y="152.68" font-size="13.99" class="sc-poppinsmedium">8.3 Terminal-Bench 2.0</text><text x="72.00" y="407.32" font-size="13.99" class="sc-poppinsmedium">8.4 GPQA Diamond</text><text x="72.00" y="516.24" font-size="13.99" class="sc-poppinsmedium">8.5 MMMLU</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">193</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">所有</text><text x="96.89 103.13 114.08 120.70 126.08 132.48 138.44 145.12 150.97" y="82.63" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="160.45" y="82.63" font-size="11.00" class="sc-notoserifcjksc">变体均使用标准配置，且采样结果中包含思考块。有关我们的记忆化筛查，请</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">参阅</text><text x="94.00 103.93 109.80 114.05 120.64 127.08" y="98.25" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos</text><text x="135.06 141.73 146.42 152.32 157.88 160.97 166.89" y="98.25" font-size="11.00" class="sc-loraregular" fill="#0000ff">Preview</text><text x="178.59" y="98.25" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="211.59" y="98.25" font-size="11.00" class="sc-notoserifcjksc">中的第</text><text x="247.48" y="98.25" font-size="11.00" class="sc-loraregular">8.2.1</text><text x="271.88" y="98.25" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="175.12" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="172.97" y="171.46" font-size="6.60" class="sc-loraregular">44</text><text x="180.12" y="175.12" font-size="11.00" class="sc-notoserifcjksc">由斯坦福大学和</text><text x="260.02 266.62 272.23 278.79 285.37 291.33 294.23 297.82 304.50 309.59 313.85 317.12 321.37 327.94 332.20" y="175.12" font-size="11.00" class="sc-loraregular">Laude Institute</text><text x="341.05" y="175.12" font-size="11.00" class="sc-notoserifcjksc">的研究人员开发，在终端和命令行环境中</text><text x="72.00" y="190.74" font-size="11.00" class="sc-notoserifcjksc">的真实世界任务上测试</text><text x="184.89" y="190.74" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="190.74" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="223.93" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 116.38 122.06 126.78 133.18 139.62" y="223.93" font-size="11.00" class="sc-loraregular">Harbor</text><text x="147.27" y="223.93" font-size="11.00" class="sc-notoserifcjksc">脚手架（</text><text x="191.27 196.37 202.20 207.87 211.70 215.36 221.80 224.79" y="223.93" font-size="11.00" class="sc-loraregular">scaffold</text><text x="231.37" y="223.93" font-size="11.00" class="sc-notoserifcjksc">）中使用</text><text x="278.26 284.76 290.72 295.49 305.32 308.41 315.09 321.66 326.75 331.78" y="223.93" font-size="11.00" class="sc-loraregular">Terminus-2</text><text x="340.58" y="223.93" font-size="11.00" class="sc-notoserifcjksc">运行框架和默认解析器运行</text><text x="475.47 481.97 487.93 492.70 502.53 505.62 512.30 517.97 520.97" y="223.93" font-size="11.00" class="sc-loraregular">Terminal-</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 106.82 112.72 115.26" y="239.55" font-size="11.00" class="sc-loraregular">Bench 2.0</text><text x="122.09" y="239.55" font-size="11.00" class="sc-notoserifcjksc">。每个任务都在一个隔离的</text><text x="256.99 264.39 270.96 277.36 283.32 288.08 294.76 300.65 304.90 310.87 315.96 318.85 325.42 331.85" y="239.55" font-size="11.00" class="sc-loraregular">Kubernetes pod</text><text x="341.32" y="239.55" font-size="11.00" class="sc-notoserifcjksc">中运行，保证资源为基准测试规定上限的</text><text x="72.00" y="255.17" font-size="11.00" class="sc-loraregular">1×</text><text x="81.83" y="255.17" font-size="11.00" class="sc-notoserifcjksc">（硬性抢占上限为</text><text x="172.73" y="255.17" font-size="11.00" class="sc-loraregular">3×</text><text x="184.68" y="255.17" font-size="11.00" class="sc-notoserifcjksc">），超时设为</text><text x="253.58" y="255.17" font-size="11.00" class="sc-loraregular">1×</text><text x="263.41" y="255.17" font-size="11.00" class="sc-notoserifcjksc">，以保证对基准测试的忠实度。有关此配置的详情，请参</text><text x="72.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc">阅</text><text x="83.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的工程博客</text><text x="160.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="304.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="304.89" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="192.32 198.68 204.86 207.56 213.53" y="304.89" font-size="11.00" class="sc-loraregular">69.4%</text><text x="225.99" y="304.89" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，该结果为</text><text x="338.88 344.99" y="304.89" font-size="11.00" class="sc-loraregular">89</text><text x="354.24" y="304.89" font-size="11.00" class="sc-notoserifcjksc">个不同任务各进行</text><text x="445.13" y="304.89" font-size="11.00" class="sc-loraregular">5</text><text x="454.02" y="304.89" font-size="11.00" class="sc-notoserifcjksc">次尝试后的平均值</text><text x="72.00" y="320.51" font-size="11.00" class="sc-notoserifcjksc">（共计</text><text x="107.89" y="320.51" font-size="11.00" class="sc-loraregular">445</text><text x="128.71" y="320.51" font-size="11.00" class="sc-notoserifcjksc">次试验）。我们将</text><text x="219.60 227.29 230.28 235.89 242.46 249.03 255.00 257.89 266.62 273.19 279.76 284.85 287.74 293.71 296.06" y="320.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="304.02" y="320.51" font-size="11.00" class="sc-notoserifcjksc">配置为在关闭思考的情况下运行。</text><text x="469.02 475.52 481.49 486.25 496.08 499.17 505.85 511.53 514.52" y="320.51" font-size="11.00" class="sc-loraregular">Terminal-</text><text x="72.00" y="336.13" font-size="11.00" class="sc-loraregular">Bench</text><text x="106.82" y="336.13" font-size="11.00" class="sc-notoserifcjksc">对推理延迟较为敏感：固定的实际耗时超时意味着解码较慢的端点在每个任务中完成的回</text><text x="72.00" y="351.75" font-size="11.00" class="sc-notoserifcjksc">合更少。我们报告的分数使用生产环境</text><text x="261.89 268.78 275.39" y="351.75" font-size="11.00" class="sc-loraregular">API</text><text x="281.97" y="351.75" font-size="11.00" class="sc-notoserifcjksc">端点，以考虑这些动态因素。</text><text x="72.00 80.37 85.06 90.73 97.31 103.88 109.48 113.73 119.70 125.08 131.43 137.34 142.84 148.80 151.79 154.69 163.06 169.49 175.93 182.27 185.27 191.23 196.61 203.27 207.96 214.39 220.77 224.49 227.39 236.14 244.34" y="429.77" font-size="11.00" class="sc-loraregular">Graduate-Level Google-Proof Q&amp;A</text><text x="254.12" y="429.77" font-size="11.00" class="sc-notoserifcjksc">基准测试（</text><text x="309.12 317.49 324.15 332.77" y="429.77" font-size="11.00" class="sc-loraregular">GPQA</text><text x="339.65" y="429.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="350.65" y="426.10" font-size="6.60" class="sc-loraregular">45</text><text x="357.83" y="429.77" font-size="11.00" class="sc-notoserifcjksc">是一组具有挑战性的多项选择科学</text><text x="72.00" y="445.39" font-size="11.00" class="sc-notoserifcjksc">题。我们使用包含</text><text x="162.89" y="445.39" font-size="11.00" class="sc-loraregular">198</text><text x="182.33" y="445.39" font-size="11.00" class="sc-notoserifcjksc">道题的</text><text x="218.22" y="445.39" font-size="11.00" class="sc-loraregular">Diamond</text><text x="267.60" y="445.39" font-size="11.00" class="sc-notoserifcjksc sc-liga">子集——这些题目领域专家能够答对，而大多数非专家则</text><text x="72.00" y="461.01" font-size="11.00" class="sc-notoserifcjksc">答不对。</text><text x="116.00 123.69 126.68 132.29 138.86 145.44 151.40 154.29 163.02 169.59 176.16 181.25 184.15 190.11 192.46" y="461.01" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="72.00" y="88.10" font-size="13.99" class="sc-poppinsmedium">8.6 USAMO 2026</text><text x="72.00" y="444.51" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.7.1 GraphWalks</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">194</text><text x="72.00" y="110.78" font-size="11.00" class="sc-notoserifcjksc">美国数学奥林匹克（</text><text x="171.00 179.27 185.51 192.40 195.29 205.39 210.99 215.24 221.83 227.79 237.63 243.23 247.48 250.57 256.40 262.08 265.07 267.97 276.70 279.64 285.44 295.28 301.85 304.94 310.61" y="110.78" font-size="11.00" class="sc-loraregular">USA Mathematical Olympiad</text><text x="317.19" y="110.78" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="328.19 336.46 342.70 349.58 359.63" y="110.78" font-size="11.00" class="sc-loraregular">USAMO</text><text x="368.36" y="110.78" font-size="11.00" class="sc-notoserifcjksc">）是一项面向高中生、共六道题、</text><text x="72.00" y="126.40" font-size="11.00" class="sc-notoserifcjksc">为期两天的证明题竞赛。在美国的数学奥林匹克赛道中，它是</text><text x="371.89" y="126.40" font-size="11.00" class="sc-loraregular">AIME</text><text x="402.30" y="126.40" font-size="11.00" class="sc-notoserifcjksc">之后的下一级比赛；</text><text x="501.30" y="126.40" font-size="11.00" class="sc-loraregular">AIME</text><text x="72.00" y="142.02" font-size="11.00" class="sc-notoserifcjksc">去年曾是热门的</text><text x="151.89" y="142.02" font-size="11.00" class="sc-loraregular">AI</text><text x="165.36" y="142.02" font-size="11.00" class="sc-notoserifcjksc">基准测试，但如今已饱和。</text><text x="297.36 303.26 310.02 315.92" y="142.02" font-size="11.00" class="sc-loraregular">2026</text><text x="325.18" y="142.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="339.07 347.34 353.58 360.46 370.51" y="142.02" font-size="11.00" class="sc-loraregular">USAMO</text><text x="382.13" y="142.02" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="396.03 401.93 408.69 414.60" y="142.02" font-size="11.00" class="sc-loraregular">2026</text><text x="423.85" y="142.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="437.74" y="142.02" font-size="11.00" class="sc-loraregular">3</text><text x="446.76" y="142.02" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="460.65 466.56 470.43 476.92 482.83" y="142.02" font-size="11.00" class="sc-loraregular">21–22</text><text x="491.63" y="142.02" font-size="11.00" class="sc-notoserifcjksc">日举行，</text><text x="72.00" y="157.64" font-size="11.00" class="sc-notoserifcjksc">晚于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.35" y="157.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="181.32" y="157.64" font-size="11.00" class="sc-notoserifcjksc">的训练数据截止日期。</text><text x="72.00" y="191.74" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 105.17 111.40 118.29 128.33" y="191.74" font-size="11.00" class="sc-loraregular">USAMO</text><text x="139.96" y="191.74" font-size="11.00" class="sc-notoserifcjksc">的解答是证明而非简短答案，评分可能具有挑战性且带有主观性。我们遵循</text><text x="72.00 82.10 87.70 91.95 98.54 105.43 110.12 116.08 122.75" y="207.36" font-size="11.00" class="sc-loraregular">MathArena</text><text x="128.43" y="203.69" font-size="6.60" class="sc-loraregular">47</text><text x="135.05" y="207.36" font-size="11.00" class="sc-notoserifcjksc">的评分方法：每份证明先由一个中立模型（</text><text x="344.05 352.42 358.38 368.22 371.31 377.98 381.08 383.97 390.10 392.80 396.81 399.70 406.36 411.05" y="207.36" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="417.49" y="207.36" font-size="11.00" class="sc-notoserifcjksc">）改写，再由</text><text x="486.38" y="207.36" font-size="11.00" class="sc-loraregular">3</text><text x="495.40" y="207.36" font-size="11.00" class="sc-notoserifcjksc">个前沿模</text><text x="72.00" y="222.98" font-size="11.00" class="sc-notoserifcjksc">型组成的评审团（我们使用的是</text><text x="228.89 237.26 243.23 253.06 256.15 262.83 265.92 268.81 274.94 277.65 281.65 284.54 291.21 295.89" y="222.98" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="302.33" y="222.98" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="313.33 321.02 324.01 329.62 336.19 342.77 348.73 351.62 360.35 366.92 373.49 378.58 381.47 387.44 390.03" y="222.98" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="399.28" y="222.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="413.18 420.87 423.86 429.47 436.03 442.61 448.57 451.47 461.40 467.26 471.52 478.11 484.54" y="222.98" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="238.60" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="238.60" font-size="11.00" class="sc-notoserifcjksc">）依据既定的评分细则进行评判。最终得分取任一评判者所给分数中的最低值。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="288.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="288.89" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="203.32 209.68 215.86 218.56 224.69" y="288.89" font-size="11.00" class="sc-loraregular">69.3%</text><text x="234.26" y="288.89" font-size="11.00" class="sc-notoserifcjksc">，为每道题</text><text x="292.15" y="288.89" font-size="11.00" class="sc-loraregular">10</text><text x="305.88" y="288.89" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值。我们在批处理</text><text x="462.78 469.66 476.27" y="288.89" font-size="11.00" class="sc-loraregular">API</text><text x="482.85" y="288.89" font-size="11.00" class="sc-notoserifcjksc">中使用</text><text x="72.00 81.83 87.74 94.32 97.41 103.98" y="304.51" font-size="11.00" class="sc-loraregular">medium</text><text x="116.70" y="304.51" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="171.70 175.96 182.40 188.23 194.19" y="304.51" font-size="11.00" class="sc-loraregular">token</text><text x="203.76" y="304.51" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="239.65" y="304.51" font-size="11.00" class="sc-loraregular">300k</text><text x="265.35" y="304.51" font-size="11.00" class="sc-notoserifcjksc">；更高的推理强度经常超出</text><text x="400.24 407.13 413.74" y="304.51" font-size="11.00" class="sc-loraregular">API</text><text x="420.32" y="304.51" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="434.21 438.47 444.90 450.73 456.69" y="304.51" font-size="11.00" class="sc-loraregular">token</text><text x="466.26" y="304.51" font-size="11.00" class="sc-notoserifcjksc">上限。我们使</text><text x="72.00" y="320.13" font-size="11.00" class="sc-notoserifcjksc">用</text><text x="85.89 94.63 101.19 107.76 112.85 115.75 121.71 124.31" y="320.13" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="133.56" y="320.13" font-size="11.00" class="sc-notoserifcjksc">将我们的运行框架校准到</text><text x="257.45 267.55 273.15 277.40 283.99 290.88 295.56 301.53 308.20" y="320.13" font-size="11.00" class="sc-loraregular">MathArena</text><text x="316.77" y="320.13" font-size="11.00" class="sc-notoserifcjksc">公布的分数。</text><text x="382.77 392.87 398.47 402.73 409.31 416.20 420.89 426.85 433.53" y="320.13" font-size="11.00" class="sc-loraregular">MathArena</text><text x="442.10" y="320.13" font-size="11.00" class="sc-notoserifcjksc">测得的结果为</text><text x="72.00 77.96 82.55 85.09 91.92" y="335.75" font-size="11.00" class="sc-loraregular">47.0%</text><text x="101.49" y="335.75" font-size="11.00" class="sc-notoserifcjksc">，但它将</text><text x="148.38 157.12 163.68 170.25 175.35 178.24 184.20 186.80" y="335.75" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="196.05" y="335.75" font-size="11.00" class="sc-notoserifcjksc">的思考</text><text x="231.94 236.20 242.63 248.46 254.42" y="335.75" font-size="11.00" class="sc-loraregular">token</text><text x="263.99" y="335.75" font-size="11.00" class="sc-notoserifcjksc">限制在</text><text x="299.89" y="335.75" font-size="11.00" class="sc-loraregular">120k</text><text x="322.54" y="335.75" font-size="11.00" class="sc-notoserifcjksc">。我们在相同设置下的测量结果为</text><text x="490.43" y="335.75" font-size="11.00" class="sc-loraregular">51.9%</text><text x="519.06" y="335.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="351.37" font-size="11.00" class="sc-notoserifcjksc">差距在</text><text x="107.89" y="351.37" font-size="11.00" class="sc-loraregular">5%</text><text x="126.35" y="351.37" font-size="11.00" class="sc-notoserifcjksc">以内；在不受限制的</text><text x="228.24 234.83 237.92 244.27" y="351.37" font-size="11.00" class="sc-loraregular">high</text><text x="253.75" y="351.37" font-size="11.00" class="sc-notoserifcjksc">推理强度思考下，我们测得</text><text x="388.65 397.38 403.95 410.51 415.61 418.50 424.46 427.06" y="351.37" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="436.31" y="351.37" font-size="11.00" class="sc-notoserifcjksc">的成绩为</text><text x="483.20" y="351.37" font-size="11.00" class="sc-loraregular">66.2%</text><text x="514.10" y="351.37" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="403.62" font-size="14.00" class="sc-poppinssemibold">8.7</text><text x="95.65" y="403.62" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00 80.37 85.06 90.73 97.30 103.46 113.98 119.65 122.64 128.55" y="468.39" font-size="11.00" class="sc-loraregular">GraphWalks</text><text x="133.64" y="464.72" font-size="6.60" class="sc-loraregular">48</text><text x="140.93" y="468.39" font-size="11.00" class="sc-notoserifcjksc">是一个多跳长上下文基准测试：上下文窗口中填充了一个由十六进制哈希节点构成</text><text x="72.00" y="484.01" font-size="11.00" class="sc-notoserifcjksc">的有向图，模型必须从一个随机起始节点出发执行广度优先搜索（</text><text x="391.00 397.74 403.77" y="484.01" font-size="11.00" class="sc-loraregular">BFS</text><text x="410.01" y="484.01" font-size="11.00" class="sc-notoserifcjksc">）或识别父节点。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="533.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="533.38" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="170.32 177.06 183.09 189.33 192.22 198.13 204.12 210.48 217.50 222.59 226.59" y="533.38" font-size="11.00" class="sc-loraregular">BFS 256K-1M</text><text x="239.58" y="533.38" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="275.48 281.47 287.65 290.25 296.61" y="533.38" font-size="11.00" class="sc-loraregular">58.6%</text><text x="306.18" y="533.38" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="331.07 337.64 343.32 348.00 353.96 360.54 364.80 369.89 372.78 378.69 384.69 391.04 396.70 401.79 405.80" y="533.38" font-size="11.00" class="sc-loraregular">parents 256k-1M</text><text x="418.79" y="533.38" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="454.68" y="533.38" font-size="11.00" class="sc-loraregular">75.1%</text><text x="482.03" y="533.38" font-size="11.00" class="sc-notoserifcjksc">，均为</text><text x="517.92" y="533.38" font-size="11.00" class="sc-loraregular">5</text><text x="526.81" y="533.38" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="549.00" font-size="11.00" class="sc-notoserifcjksc">试验的平均值。该结果无法通过公开</text><text x="250.89 257.78 264.39" y="549.00" font-size="11.00" class="sc-loraregular">API</text><text x="270.97" y="549.00" font-size="11.00" class="sc-notoserifcjksc">复现，因为半数题目超过了其</text><text x="416.86" y="549.00" font-size="11.00" class="sc-loraregular">100</text><text x="437.42" y="549.00" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="451.31 455.57 462.01 467.84 473.80" y="549.00" font-size="11.00" class="sc-loraregular">token</text><text x="483.37" y="549.00" font-size="11.00" class="sc-notoserifcjksc">的上限；在</text> <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="72.00" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.7.2 OpenAI MRCR v2</text><text x="72.00" y="695.51" font-size="6.60" class="sc-loraregular">49</text><text x="82.28 88.42 94.27 100.25 104.51 109.67 115.66 120.81 123.53 126.25 129.06 131.69 137.04 140.91 143.54 148.70 151.42 153.88 156.41 159.03 162.08 167.45 173.59 178.74 184.04 187.09 189.72 198.89 201.70 207.02 213.01 218.43 221.15 226.31 232.38 237.85 243.27 245.99 251.84 254.34 256.97 262.75 268.60 274.67 280.19 282.82 288.09 293.94 299.92 303.79 309.16 314.46 318.32 320.95 326.32 331.27 336.43 339.15 345.12 350.21 354.08 356.88 362.73 368.80 373.43 376.06 381.88 387.25 392.43 398.27 404.34 410.32 412.95 418.94 424.00 429.28 433.91 437.77 442.93 448.25 453.62 458.25 460.88 465.93 468.74 473.90 476.52 479.24 484.33 488.20 493.62 499.60" y="700.15" font-size="10.00" class="sc-loraregular">Vodrahalli et al., (2024) Michelangelo: Long context evaluations beyond haystacks via latent</text><text x="72.00 76.63 80.50 84.83 90.80 96.06 99.93 105.90 110.16 115.58 118.21 123.97 129.94 135.35 139.68 142.49 147.91" y="715.34" font-size="10.00" class="sc-loraregular">structure queries</text><text x="155.17 161.07 165.04 168.91 174.87 179.50 182.00 185.69 192.15 197.31 201.64 206.94 209.75 214.40 216.86 222.71 226.99 232.52 238.98 244.14 249.96 254.23 261.13 266.28 271.70 277.91 283.53 285.99 289.63 294.99 300.77 306.19" y="715.34" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2409.12640</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular">OpenAI MRCR</text><text x="145.01" y="111.05" font-size="11.00" class="sc-notoserifcjksc">（多轮共指消解，</text><text x="233.01 243.11 249.67 252.66 256.92 260.01 265.39 272.22 278.66 285.22 291.90 298.48 301.37 309.06 315.50 320.88 327.71 333.67 337.33 343.29 347.98 353.94 360.62 366.42 372.38 375.27 382.10 388.06 393.16 399.59 402.58 409.15 413.41 416.50 422.93" y="111.05" font-size="11.00" class="sc-loraregular">Multi-Round Co-Reference Resolution</text><text x="429.61" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）是一个公开可用的基</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">准测试，用于评估语言模型在长上下文中定位并区分多条相似信息的能力。该测试最初由</text><text x="72.00 78.75 85.19 91.77 96.45 102.13 108.72 114.39 117.39 120.38 123.47 126.36 132.25 136.50 139.40 145.07 148.07 150.77 153.66 157.02 162.93 169.68 175.35 181.18" y="142.29" font-size="11.00" class="sc-loraregular">Vodrahalli et al. (2024)</text><text x="184.53" y="138.62" font-size="6.60" class="sc-loraregular">49</text><text x="191.92" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的论文提出，我们使用的是</text><text x="326.82" y="142.29" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="368.22" y="142.29" font-size="11.00" class="sc-notoserifcjksc">发布的版本，并包含</text><text x="470.11 476.02 482.77 488.68" y="142.29" font-size="11.00" class="sc-loraregular">2025</text><text x="497.57" y="142.29" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="511.46" y="142.29" font-size="11.00" class="sc-loraregular">12</text><text x="524.27" y="142.29" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="72.00" y="157.91" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="157.91" font-size="11.00" class="sc-notoserifcjksc">日引入的</text><text x="127.78" y="157.91" font-size="11.00" class="sc-loraregular">v2</text><text x="142.14" y="157.91" font-size="11.00" class="sc-notoserifcjksc">修复。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">与较简单的</text><text x="127.00" y="208.20" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="208.20" font-size="11.00" class="sc-notoserifcjksc">大海捞针</text><text x="175.40" y="208.20" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="208.20" font-size="11.00" class="sc-notoserifcjksc">测试不同，</text><text x="234.24" y="208.20" font-size="11.00" class="sc-loraregular">MRCR</text><text x="268.74" y="208.20" font-size="11.00" class="sc-notoserifcjksc">要求模型在多个相同的请求中识别出正确序数的那一个</text><text x="72.00" y="223.82" font-size="11.00" class="sc-notoserifcjksc sc-liga">实例——例如，从一段冗长的对话中准确检索出关于某一主题的第</text><text x="390.51" y="223.82" font-size="11.00" class="sc-loraregular">2</text><text x="399.31" y="223.82" font-size="11.00" class="sc-notoserifcjksc">首或第</text><text x="435.20" y="223.82" font-size="11.00" class="sc-loraregular">4</text><text x="444.05" y="223.82" font-size="11.00" class="sc-notoserifcjksc sc-liga">首诗——从而同时测</text><text x="72.00" y="239.44" font-size="11.00" class="sc-notoserifcjksc">试长上下文理解能力与精确的顺序推理能力。</text><text x="72.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.07 130.45 137.13 143.04 148.95 155.52 158.51" y="289.16" font-size="11.00" class="sc-loraregular">8-needle</text><text x="167.37" y="289.16" font-size="11.00" class="sc-notoserifcjksc">变体，这是该评估中难度最高的设置。在所报告的变体中，</text><text x="453.37" y="289.16" font-size="11.00" class="sc-loraregular">256k</text><text x="480.43" y="289.16" font-size="11.00" class="sc-notoserifcjksc">分档对应</text><text x="72.00 76.26 82.69 88.52 94.48" y="304.78" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="304.78" font-size="11.00" class="sc-notoserifcjksc">数位于</text><text x="139.95 143.30 147.31 153.21 159.39 165.30 168.07 170.97 176.87 182.87 189.23 194.88" y="304.78" font-size="11.00" class="sc-loraregular">(128k, 256k]</text><text x="201.73" y="304.78" font-size="11.00" class="sc-notoserifcjksc">区间的提示词，</text><text x="278.73" y="304.78" font-size="11.00" class="sc-loraregular">1M</text><text x="295.73" y="304.78" font-size="11.00" class="sc-notoserifcjksc">分档对应</text><text x="342.62 346.88 353.31 359.14 365.11" y="304.78" font-size="11.00" class="sc-loraregular">token</text><text x="374.68" y="304.78" font-size="11.00" class="sc-notoserifcjksc">数位于</text><text x="410.57 413.92 419.92 425.58 431.55 437.45 440.23 443.12 447.12 453.88 459.54 465.50 471.16" y="304.78" font-size="11.00" class="sc-loraregular">(524k, 1024k]</text><text x="478.01" y="304.78" font-size="11.00" class="sc-notoserifcjksc">区间的提示</text><text x="72.00" y="320.40" font-size="11.00" class="sc-notoserifcjksc">词。所报告的分数为</text><text x="173.89 183.91 189.85 195.53 202.21 205.10 215.20 220.80 225.05 230.91 237.50 240.39 247.30 252.90 257.15 260.24" y="320.40" font-size="11.00" class="sc-loraregular">Mean Match Ratio</text><text x="266.68" y="320.40" font-size="11.00" class="sc-notoserifcjksc">（平均匹配率），其定义见该评估在线数据集中的</text><text x="508.68 513.08 521.42 527.74" y="320.40" font-size="11.00" class="sc-loraregular" fill="#0000ff">“How</text><text x="72.00 76.26 82.69 85.58 90.35 96.92 103.34" y="336.02" font-size="11.00" class="sc-loraregular" fill="#0000ff">to run”</text><text x="107.18" y="336.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">部分</text><text x="129.18" y="336.02" font-size="11.00" class="sc-notoserifcjksc">。对于与竞争模型的对比结果，我们同时报告来自</text><text x="371.18 378.87 385.30 391.88 396.14 402.04 407.87 412.13 415.02 421.91 426.60 432.56 439.23" y="336.02" font-size="11.00" class="sc-loraregular" fill="#0000ff">Context Arena</text><text x="444.91" y="336.02" font-size="11.00" class="sc-notoserifcjksc">的评估结果（即由</text><text x="72.00" y="351.64" font-size="11.00" class="sc-notoserifcjksc">外部评估方运行）以及各模型提供方自行报告的性能。</text><text x="72.00" y="632.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 93.82 97.48 99.58 104.37 106.47 112.01 115.48 117.85 124.04 126.85 131.56 137.12 142.49 147.33 149.70 156.62 162.03 167.59 171.95 174.32 179.24 181.08" y="632.12" font-size="9.00" class="sc-lorabold">8.7.2.A] Claude Opus 4.7</text><text x="187.67" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="199.03 203.83 208.69 213.87 216.23 219.95 225.01 230.13 234.97" y="632.12" font-size="9.00" class="sc-lorabold">256 token</text><text x="243.08" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">下的长上下文理解与精确顺序推理表现</text><text x="396.08" y="632.12" font-size="9.00" class="sc-notoserifcjksc">，通过</text><text x="425.45 432.59 437.97 442.84 448.31 453.94 456.96 459.32 467.59 473.24 479.53 485.18 487.55 492.09 496.93 499.29 504.35 506.72 512.18 517.01 521.85 527.23 529.68 534.55" y="632.12" font-size="9.00" class="sc-loraregular">OpenAI MRCR v2 8 needles</text><text x="72.00" y="643.82" font-size="9.00" class="sc-notoserifcjksc">测量。</text><a href="https://arxiv.org/abs/2409.12640" rel="noopener"><rect x="155.25" y="705.00" width="157.50" height="12.75" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="508.68" y="311.60" width="4.40" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="513.08" y="311.60" width="23.47" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="536.55" y="311.60" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="72.00" y="327.22" width="10.69" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="82.69" y="327.22" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="85.58" y="327.22" width="21.59" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopen .43" font-size="9.00" class="sc-notoserifcjkscbold">万</text><text x="227.87 231.59 236.65 241.77 246.61" y="318.43" font-size="9.00" class="sc-lorabold">token</text><text x="254.72" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">下的长上下文理解与精确顺序推理表现</text><text x="407.72" y="318.43" font-size="9.00" class="sc-notoserifcjksc">，通过</text><text x="437.09" y="318.43" font-size="9.00" class="sc-loraregular">OpenAI MRCR v2 8</text><text x="72.00 77.46 82.30 87.13 92.51 94.96 99.84" y="330.13" font-size="9.00" class="sc-loraregular">needles</text><text x="106.37" y="330.13" font-size="9.00" class="sc-notoserifcjksc">测量。</text><text x="72.00" y="365.08" font-size="14.00" class="sc-poppinssemibold">8.8</text><text x="96.98" y="365.08" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.12 112.39 116.67 122.48 124.19 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="429.84" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="429.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="429.84" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="429.84" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="426.18" font-size="6.60" class="sc-loraregular">50</text><text x="236.36" y="429.84" font-size="11.00" class="sc-notoserifcjksc">是一个处于人类知识前沿的多模态基准测试，包含</text><text x="481.25 487.16 489.93 495.92 502.76" y="429.84" font-size="11.00" class="sc-loraregular">2,500</text><text x="512.49" y="429.84" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="445.46" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="478.65" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 204.63 211.19 217.76 222.85 225.75 231.71 234.06" y="478.65" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="239.13" y="478.65" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="250.13" y="478.65" font-size="11.00" class="sc-loraregular">(1)</text><text x="263.74" y="478.65" font-size="11.00" class="sc-notoserifcjksc">不使用工具的纯推理；</text><text x="373.74" y="478.65" font-size="11.00" class="sc-loraregular">(2)</text><text x="389.25" y="478.65" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程</text><text x="72.00" y="494.27" font-size="11.00" class="sc-notoserifcjksc">序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="349.89 355.50 362.07 366.33" y="494.27" font-size="11.00" class="sc-loraregular">auto</text><text x="372.76" y="494.27" font-size="11.00" class="sc-notoserifcjksc">，且跨上下文使用的</text><text x="474.65 478.91 485.35 491.18 497.14" y="494.27" font-size="11.00" class="sc-loraregular">token</text><text x="506.71" y="494.27" font-size="11.00" class="sc-notoserifcjksc">总数上</text><text x="72.00" y="509.89" font-size="11.00" class="sc-notoserifcjksc">限为</text><text x="96.89" y="509.89" font-size="11.00" class="sc-loraregular">100</text><text x="117.45" y="509.89" font-size="11.00" class="sc-notoserifcjksc">万。与下文其他智能体搜索结果不同，这些结果未使用上下文压缩（</text><text x="447.45 453.25 459.68 466.26 470.52 476.43 482.26" y="509.89" font-size="11.00" class="sc-loraregular">context</text><text x="72.00 77.80 84.23 94.07 100.63 106.31 112.11 116.36 119.45 125.89" y="525.51" font-size="11.00" class="sc-loraregular">compaction</text><text x="132.57" y="525.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="154.57 162.26 165.25 170.86 177.42 184.00 189.96 192.86 201.59 208.16 214.73 219.82 222.71 228.67 231.27" y="525.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="240.52" y="525.51" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="575.80" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们在搜索器与抓取器中均屏蔽了已知讨论</text><text x="481.89" y="575.80" font-size="11.00" class="sc-loraregular">HLE</text><text x="506.57" y="575.80" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="591.42" font-size="11.00" class="sc-notoserifcjksc">（见附录</text><text x="118.89" y="591.42" font-size="11.00" class="sc-loraregular">8.2</text><text x="133.69" y="591.42" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="213.58 221.27 224.26 229.87 236.44 243.02 248.98 251.87 260.61 267.17 273.74 278.83 281.73 287.69 290.28" y="591.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="299.54" y="591.42" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看似从</text><text x="489.43" y="591.42" font-size="11.00" class="sc-loraregular">HLE</text><text x="514.10" y="591.42" font-size="11.00" class="sc-notoserifcjksc">专门</text><text x="72.00" y="607.04" font-size="11.00" class="sc-notoserifcjksc">来源中检索到答案的对话记录；经确认的情况将被重新判为错误。</text><text x="72.00" y="656.76" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="656.76" font-size="11.00" class="sc-loraregular">max</text><text x="110.13" y="656.76" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="176.13 184.86 191.43 197.99 203.09 205.98 211.94 214.30" y="656.76" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="222.26" y="656.76" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="313.15" y="656.76" font-size="11.00" class="sc-loraregular">46.9%</text><text x="344.11" y="656.76" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="435.00 441.00 446.96 449.31 454.38" y="656.76" font-size="11.00" class="sc-loraregular">54.7%</text><text x="463.95" y="656.76" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.25" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>

.60" class="sc-loraregular">51</text><text x="146.16" y="111.05" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们在使用网络搜索、网</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">页抓取、程序化工具调用和代码执行的条件下运行了</text><text x="327.89 336.63 343.19 349.76 354.85 357.75 363.71 366.06" y="126.67" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="371.13" y="126.67" font-size="11.00" class="sc-notoserifcjksc">。在关闭思考、</text><text x="448.13" y="126.67" font-size="11.00" class="sc-loraregular">max</text><text x="472.37" y="126.67" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="72.00 76.26 82.69 88.52 94.48" y="142.29" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="142.29" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="139.95" y="142.29" font-size="11.00" class="sc-loraregular">1000</text><text x="167.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="233.34 242.07 248.64 255.21 260.30 263.19 269.15 271.51" y="142.29" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="279.47" y="142.29" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="304.36 309.43 315.62 318.32 324.45" y="142.29" font-size="11.00" class="sc-loraregular">79.3%</text><text x="334.02" y="142.29" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="468.91 474.82 481.65 488.48 494.39 497.28 501.54 507.97 513.80 519.77" y="142.29" font-size="11.00" class="sc-loraregular">200k token</text><text x="529.34" y="142.29" font-size="11.00" class="sc-notoserifcjksc">时</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">触发）以突破</text><text x="140.89" y="157.91" font-size="11.00" class="sc-loraregular">100</text><text x="161.45" y="157.91" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="175.35 179.60 186.04 191.87 197.83" y="157.91" font-size="11.00" class="sc-loraregular">token</text><text x="207.40" y=" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p201.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 201 页"><text x="72.00" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.8.4 DRACO</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">53</text><text x="81.24 87.34 93.33 99.18 105.25 110.77 113.30 115.93 119.45 121.91 124.44 127.07 132.42 136.29 138.92 144.08 146.79 149.25 151.88 154.93 160.30 166.44 171.81 177.47 180.52 182.98 185.61 192.95 199.72 205.93 212.92 220.86 223.36 225.98 231.14 233.77 239.09 243.35 249.20 253.83 258.46 263.35 269.32 275.17 284.11 289.27 292.08 298.15 300.78 306.59 312.01 318.08 323.40 329.39 338.33 343.49 347.77 353.14 355.77 359.10 364.95 369.28 371.91 379.36 384.73 390.14 396.11 398.74 404.95 410.37 415.00 420.40 425.55 429.81 435.13 441.12 443.75 450.01 455.28 460.60 466.56 470.82 475.98 481.25 485.98" y="704.46" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: a cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.84 93.77 99.74 102.46 107.81 111.68 117.10 123.17 128.59 133.21 137.84 140.37 143.00 148.16 154.23 160.21 162.84 170.78 176.59 179.20 184.57 189.84 193.71 196.52 201.57 204.54 208.43 213.33 215.79 218.42 223.58 227.29 233.78 236.59 241.64 244.14 249.51 255.28 261.42 266.79 269.25 272.89 276.53 282.31 287.93 293.37" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.46 304.36 308.33 312.20 318.17 322.80 325.30 328.99 335.44 340.60 344.93 350.23 353.04 357.70 360.16 366.01 370.29 375.81 382.27 387.43 393.25 397.53 404.43 409.80 415.57 421.71 427.08 429.54 433.18 436.82 442.60 448.22" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">201</text><text x="72.00 80.20 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="110.82" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="110.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="110.82" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="107.15" font-size="6.60" class="sc-loraregular">53</text><text x="416.16" y="110.82" font-size="11.00" class="sc-notoserifcjksc">）基准测试是</text><text x="485.05 491.61 497.57 502.33 508.90 511.89 517.80 523.63 526.90 531.18" y="110.82" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">推出的一个深度研究基准，旨在评估模型在真实用户会提出的那类复杂研究问题上的表现。</text><text x="72.00 80.09 87.53 94.36 102.05" y="142.06" font-size="11.00" class="sc-loraregular">DRACO</text><text x="113.68" y="142.06" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="127.57" y="142.06" font-size="11.00" class="sc-loraregular">100</text><text x="148.13" y="142.06" font-size="11.00" class="sc-notoserifcjksc">个精选任务组成，这些任务源自多个领域的真实用户查询。题目依据专家编写的</text><text x="72.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">评分细则进行评分，细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质</text><text x="72.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00" y="201.61" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用和代码执行的条件下评估了</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="201.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18" y="201.61" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="72.00" y="217.23" font-size="11.00" class="sc-notoserifcjksc">开启自适应思考、</text><text x="160.00" y="217.23" font-size="11.00" class="sc-loraregular">max</text><text x="184.23" y="217.23" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="242.13 246.38 252.82 258.65 264.61" y="217.23" font-size="11.00" class="sc-loraregular">token</text><text x="274.18" y="217.23" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="310.07" y="217.23" font-size="11.00" class="sc-loraregular">100</text><text x="330.63" y="217.23" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="396.63 405.37 411.93 418.50 423.59 426.49 432.45 434.80" y="217.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="442.77" y="217.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="467.66 472.73 477.32 479.67 484.74" y="217.23" font-size="11.00" class="sc-loraregular">77.7%</text><text x="494.31" y="217.23" font-size="11.00" class="sc-notoserifcjksc">。我们使</text><text x="72.00" y="232.85" font-size="11.00" class="sc-notoserifcjksc">用了上下文压缩（在</text><text x="173.89 179.80 186.63 193.46 199.37 202.26 206.52 212.95 218.78 224.75" y="232.85" font-size="11.00" class="sc-loraregular">200k token</text><text x="234.32" y="232.85" font-size="11.00" class="sc-notoserifcjksc">时触发）。</text><text x="72.00" y="266.41" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="266.41" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57" y="266.41" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 260.61 266.73 272.11 278.78 283.46" y="266.41" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="292.79" y="266.41" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们</text><text x="72.00" y="282.03" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89 182.63 189.19 195.76 200.85 203.75 209.71 212.31" y="282.03" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="221.56" y="282.03" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="246.45" y="282.03" font-size="11.00" class="sc-loraregular">LLM</text><text x="272.16" y="282.03" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="327.16 333.51 339.87 349.97 352.86 355.73 362.30 368.88 374.91" y="282.03" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="380.87" y="282.03" font-size="11.00" class="sc-notoserifcjksc">），依据各任务的评分细则对回</text><text x="72.00" y="297.65" font-size="11.00" class="sc-notoserifcjksc">答进行评分，采用相同的二元</text><text x="217.89 227.99 234.83 241.09 248.68 256.95 265.34 275.43 282.28" y="297.65" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="292.21" y="297.65" font-size="11.00" class="sc-notoserifcjksc">判定，并按论文</text><text x="372.10" y="297.65" font-size="11.00" class="sc-loraregular">§4.2</text><text x="395.43" y="297.65" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我</text><text x="72.00" y="313.27" font-size="11.00" class="sc-notoserifcjksc">们遵循论文的实验方案，对每个回答进行</text><text x="272.89" y="313.27" font-size="11.00" class="sc-loraregular">5</text><text x="281.78" y="313.27" font-size="11.00" class="sc-notoserifcjksc">次独立的评分运行并报告平均值。我们的评判提示词</text><text x="72.00" y="328.89" font-size="11.00" class="sc-notoserifcjksc">取自论文附录</text><text x="140.89" y="328.89" font-size="11.00" class="sc-loraregular">C.2</text><text x="157.20" y="328.89" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="215.09" y="328.89" font-size="11.00" class="sc-loraregular">A</text><text x="224.87" y="328.89" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变动</text><text x="436.76" y="328.89" font-size="11.00" class="sc-loraregular">10–25</text><text x="468.88" y="328.89" font-size="11.00" class="sc-notoserifcjksc">分，但系统排</text><text x="72.00" y="344.51" font-size="11.00" class="sc-notoserifcjksc">序保持不变，因此我们的分数与论文的主要公布数字不能直接比较。</text><text x="72.00" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们与原论文有两点不同：</text><text x="204.00" y="373.61" font-size="11.00" class="sc-loraregular">(1)</text><text x="217.61" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="264.50 272.19 275.18 280.79 287.36 293.94 299.90 302.79 311.53 318.09 324.66 329.75 332.65 338.61 341.20" y="373.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="350.45" y="373.61" font-size="11.00" class="sc-notoserifcjksc">作为评判模型，而论文的主要评判模型</text><text x="72.00" y="389.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89 94.26 100.23 110.06 113.15 119.83 122.92 128.03 134.16 139.54 146.21 150.89" y="389.23" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="157.33" y="389.23" font-size="11.00" class="sc-notoserifcjksc">（此后已弃用）；</text><text x="245.33" y="389.23" font-size="11.00" class="sc-loraregular">(2)</text><text x="260.84" y="389.23" font-size="11.00" class="sc-notoserifcjksc">我们指示模型将其最终报告包裹在</text><text x="425.84" y="389.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="478.65" y="389.23" font-size="11.00" class="sc-notoserifcjksc">标签中，并</text><text x="72.00" y="404.85" font-size="11.00" class="sc-notoserifcjksc">仅对该部分进行评分，而不是对完整的智能体对话记录评分；这样可以将交付物与中间工具输出</text><text x="72.00" y="420.47" font-size="11.00" class="sc-notoserifcjksc">隔离开来。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.50" y="707.25" width="155.25" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p202.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 202 页"><text x="504.00 508.83 514.36" y="751.81" font-size="9.00" class="sc-loraregular">202</text><text x="72.00" y="276.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.25 108.35 113.89 117.36 119.73 126.43 132.61 138.44 144.63" y="276.43" font-size="9.00" class="sc-lorabold">8.8.4.A] DRACO</text><text x="153.92" y="276.43" font-size="9.00" class="sc-notoserifcjkscbold">归一化分数</text><text x="198.92" y="276.43" font-size="9.00" class="sc-notoserifcjksc">。这些分数代表每个模型的单次运行，每个分数为以</text><text x="408.29 415.43 420.80 426.18 430.34 432.71 437.59 439.71" y="276.43" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="447.28" y="276.43" font-size="9.00" class="sc-notoserifcjksc">作为评判模型进行五次</text><text x="72.00" y="288.13" font-size="9.00" class="sc-notoserifcjksc">评分运行的平均值。</text><text x="72.00" y="551.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.23 101.33 106.25 108.35 113.89" y="551.31" font-size="9.00" class="sc-lorabold">8.8.4.B]</text><text x="119.73" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">按评分细则维度划分的</text><text x="212.09 218.80 224.97 230.80 237.00" y="551.31" font-size="9.00" class="sc-lorabold">DRACO</text><text x="246.29" y="551.31" font-size="9.00" class="sc-notoserifcjkscbold">通过率。</text><text x="282.29 289.43 294.80 300.18 304.34 306.71 311.59 313.52" y="551.31" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="320.03" y="551.31" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="349.40 356.54 361.92 367.29 371.46 373.82 378.70 380.83" y="551.31" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="388.40" y="551.31" font-size="9.00" class="sc-notoserifcjksc">的提升集中在分析的广度与深度以及</text><text x="72.00" y="563.01" font-size="9.00" class="sc-notoserifcjksc">引用质量上，而事实准确性和呈现质量大致保持不变。</text><text x="72.00" y="597.95" font-size="14.00" class="sc-poppinssemibold">8.9</text><text x="96.74" y="597.95" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="624.52" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="624.52" font-size="11.00" class="sc-notoserifcjksc">支持的最大图像分辨率为单一图像维度上最多</text><text x="379.32 385.23 391.22 396.29 402.65 409.16" y="624.52" font-size="11.00" class="sc-loraregular">2576px</text><text x="414.99" y="624.52" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="472.88 479.01 481.37 486.44 492.43 502.53" y="624.52" font-size="11.00" class="sc-loraregular">3.75MP</text><text x="509.20" y="624.52" font-size="11.00" class="sc-notoserifcjksc">。包</text><text x="72.00" y="640.14" font-size="11.00" class="sc-notoserifcjksc">括</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="640.14" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77" y="640.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="222.67 230.36 233.35 238.96 245.53 252.10 258.07 260.96 269.69 276.26 282.83 287.92 290.81 296.77 299.37" y="640.14" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="308.62" y="640.14" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型支持的最大图像分辨率为单一图</text><text x="72.00" y="655.76" font-size="11.00" class="sc-notoserifcjksc">像维度上最多</text><text x="140.89 144.90 150.89 157.25 163.43 169.94" y="655.76" font-size="11.00" class="sc-loraregular">1568px</text><text x="175.77" y="655.76" font-size="11.00" class="sc-notoserifcjksc">、总计最多</text><text x="233.67" y="655.76" font-size="11.00" class="sc-loraregular">1.15MP</text><text x="267.14" y="655.76" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="292.03 299.72 302.71 308.32 314.89 321.47 327.43 330.32 339.06 345.63 352.19 357.29 360.18 366.14 368.49" y="655.76" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="376.46" y="655.76" font-size="11.00" class="sc-notoserifcjksc">系统卡中，除非另有说明，我们</text><text x="72.00" y="671.38" font-size="11.00" class="sc-notoserifcjksc">报告的各模型分数均使用其支持的最大图像分辨率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p203.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 203 页"><text x="72.00" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.9.1 LAB-Bench FigQA</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">54</text><text x="81.15 87.15 92.25 98.22 102.48 107.89 113.87 117.74 120.27 122.90 126.42 128.88 131.51 140.69 143.15 145.68 148.30 153.65 157.52 160.15 165.31 168.03 170.49 173.12 176.17 181.54 187.67 192.82 198.12 201.17 203.63 206.26 212.21 218.47 224.69 229.41 235.63 241.05 247.12 252.44 258.43 260.93 263.56 272.66 278.06 283.22 287.85 293.82 298.15 300.96 307.02 312.55 315.18 320.48 325.64 331.61 336.77 342.59 345.39 348.11 351.08 354.95 357.76 363.18 367.81 370.44 376.24 379.62 382.25 384.97 390.12 396.19 401.72 407.69 412.85 418.33 423.75 426.37 435.31 441.16 447.14 452.56 455.28 459.91 462.54 465.86 471.71 476.04 478.67 484.49 487.30 493.15 495.87 501.72 507.44" y="704.46" font-size="10.00" class="sc-loraregular">Laurent, J. M., et al. (2024). LAB-Bench: Measuring capabilities of language models for biology</text><text x="72.00 76.26 81.68 86.31 91.71 96.86 101.12 106.44 112.43 114.89 117.52 122.68 126.39 132.87 135.68 140.73 143.23 148.38 153.80 159.79 163.96 166.42 170.06 176.26 181.83 187.61 192.98" y="717.26" font-size="10.00" class="sc-loraregular">research. arXiv:2407.10362.</text><text x="198.07 203.97 207.94 211.80 217.77 222.40 224.90 228.59 235.05 240.21 244.54 249.84 252.64 257.30 259.76 265.61 269.89 275.42 281.88 287.04 292.85 297.13 304.03 309.18 314.60 320.59 324.76 327.22 330.86 337.06 342.63 348.41" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2407.10362</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">203</text><text x="72.00 78.55 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="111.05" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，用于测试模型能否正确解读和分析生物学研究论文</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">中复杂科学图表所含的信息。该基准测试是由</text><text x="294.89 300.81 307.38 311.64 318.20 322.89 328.67 337.01 343.45 350.01 355.11" y="126.67" font-size="11.00" class="sc-loraregular">FutureHouse</text><text x="363.96" y="126.67" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="399.86 406.46 412.13 418.81 424.89 431.46 437.13 443.16 449.12 452.02 458.90 464.93 470.89 477.47 481.73 484.62 491.38 494.47 500.90 503.89 510.33 516.63" y="126.67" font-size="11.00" class="sc-loraregular">Language Agent Biology</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15" y="142.29" font-size="11.00" class="sc-loraregular">Benchmark</text><text x="130.06" y="142.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="142.29" font-size="11.00" class="sc-loraregular">LAB-Bench</text><text x="198.63" y="142.29" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.63" y="138.62" font-size="6.60" class="sc-loraregular">54</text><text x="216.81" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的一部分，后者评估</text><text x="318.70" y="142.29" font-size="11.00" class="sc-loraregular">AI</text><text x="332.16" y="142.29" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务上的能力。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考、</text><text x="171.00" y="208.20" font-size="11.00" class="sc-loraregular">max</text><text x="195.23" y="208.20" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的条件下，</text><text x="360.23 367.92 370.91 376.52 383.09 389.67 395.63 398.52 407.26 413.82 420.39 425.48 428.38 434.34 436.69" y="208.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="444.66" y="208.20" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="458.55 464.52 467.62 473.70 482.31" y="208.20" font-size="11.00" class="sc-loraregular">FigQA</text><text x="492.09" y="208.20" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="72.00 77.07 83.25 85.85 92.21" y="223.82" font-size="11.00" class="sc-loraregular">78.6%</text><text x="104.67" y="223.82" font-size="11.00" class="sc-notoserifcjksc">的分数。在开启自适应思考、</text><text x="247.67" y="223.82" font-size="11.00" class="sc-loraregular">max</text><text x="271.90" y="223.82" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="351.80 358.63 364.49 368.75 375.34 381.77" y="223.82" font-size="11.00" class="sc-loraregular">Python</text><text x="391.34" y="223.82" font-size="11.00" class="sc-notoserifcjksc">工具的条件下，</text><text x="468.34 476.03 479.02 484.63 491.20 497.78 503.74 506.63 515.37 521.93 528.50" y="223.82" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.32" y="239.44" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28" y="239.44" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="124.17" y="239.44" font-size="11.00" class="sc-loraregular">86.4%</text><text x="157.84" y="239.44" font-size="11.00" class="sc-notoserifcjksc">的分数。在两种设置下，</text><text x="278.84 286.53 289.52 295.14 301.70 308.28 314.24 317.14 325.87 332.44 339.00 344.10 346.99 352.95 355.30" y="239.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="363.27" y="239.44" font-size="11.00" class="sc-notoserifcjksc">均优于</text><text x="399.16 406.85 409.84 415.45 422.02 428.60 434.56 437.45 446.19 452.75 459.32 464.41 467.31 473.27 475.86" y="239.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="482.22" y="239.44" font-size="11.00" class="sc-notoserifcjksc">，后者的得</text><text x="72.00" y="255.06" font-size="11.00" class="sc-notoserifcjksc">分分别为</text><tex .00" class="sc-loraregular">78.0%</text><text x="285.51" y="574.07" font-size="11.00" class="sc-notoserifcjksc">（首次尝试成功率，五次运行的平均值）。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.75" y="707.25" width="156.75" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">208</text><text x="72.00" y="359.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="359.68" font-size="9.00" class="sc-lorabold sc-liga"><tspan x="86.84 91.99 94.09 99.13 101.22 106.15 108.24 113.78 117.25 119.62 126.54 131.85 140.38 145.48 149.71 152.52 157.81 162.04 167.71 172.55 176.87">8.9.4.A] OSWorld-Veri</tspan><tspan x="179.81">fi</tspan><tspan x="185.81 190.66">ed</tspan></text><text x="198.39" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="225.39" y="359.68" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="236.75" y="359.68" font-size="9.00" class="sc-loraregular">1080p</text><text x="264.01" y="359.68" font-size="9.00" class="sc-notoserifcjksc">分辨率、最多</text><text x="320.37" y="359.68" font-size="9.00" class="sc-loraregular">100</text><text x="337.19" y="359.68" font-size="9.00" class="sc-notoserifcjksc">个操作步数下的首次尝试任务成功率。分数为五次</text><text x="72.00" y="371.38" font-size="9.00" class="sc-notoserifcjksc">运行的平均值。</text><text x="72.00" y="398.75" font-size="11.00" class="sc-notoserifcjksc">在本次评估中，我们对智能体脚手架进行了更新，包括基础设施稳定性修复和少量提示词改进。</text><text x="72.00" y="414.37" font-size="11.00" class="sc-notoserifcjksc">这些改进包括：引导模型将可预测的操作批量合并到单次工具调用中；尽早声明任务不可行，而</text><text x="72.00" y="429.99" font-size="11.00" class="sc-notoserifcjksc">不是尝试变通办法；以及在每一轮次中让模型知晓剩余的步数预算。这些脚手架改动统一应用于</text><text x="72.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">所有模型。在相同设置下重新运行</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.00 316.60" y="445.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="325.85" y="445.61" font-size="11.00" class="sc-notoserifcjksc">得到</text><text x="350.74 355.81 361.72 364.31 370.67" y="445.61" font-size="11.00" class="sc-loraregular">72.6%</text><text x="380.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">，与其此前</text><text x="435.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="457.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="471.14 476.21 482.11 484.47 489.54" y="445.61" font-size="11.00" class="sc-loraregular">72.7%</text><text x="502.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">相差在</text><text x="72.00" y="461.23" font-size="11.00" class="sc-notoserifcjksc">运行间噪声范围内，表明该设置本身不会为以往的</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="461.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18" y="461.23" font-size="11.00" class="sc-notoserifcjksc">模型带来有意义的提升。</text><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="72.00" y="464.89" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 OfficeQA</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">58</text><text x="81.27" y="704.46" font-size="10.00" class="sc-loraregular sc-liga"><tspan x="81.27 89.21 95.18 99.81 104.97 110.95 113.67 118.56 126.50 132.57 138.10 140.63 143.26 150.08 152.54 155.07 157.70 163.05 166.92 169.55 174.71 177.43 179.89 182.52 185.57 190.93 197.07 202.44 208.10 211.15 213.61 216.24 224.18">Opsahl-Ong, K., et al. (2026). Of</tspan><tspan x="227.65">fi</tspan><tspan x="233.88 239.15 244.57 252.40 258.66 261.29 267.34 271.60 277.45 279.95 282.58 288.84 294.91 297.54 302.96 308.93 312.80 318.22 322.55 328.52 332.85 335.66 340.29 345.70 348.33 354.15 359.57 365.64 370.96 376.95 385.88 391.04 395.33 400.70 403.33 406.66 412.51 416.84 419.47 424.88 430.95 436.93 441.82 445.69 451.54 456.43 461.85 467.91 473.89 476.52 482.05 486.31 492.16 498.13 504.20 510.17 515.54">ceQA Pro: An enterprise benchmark for end-to-end grounded</tspan></text><text x="72.00 76.26 81.66 86.82 91.45 97.29 103.36 106.17 112.24 117.77 120.23 122.86 128.02 131.73 138.21 141.02 146.07 148.57 153.94 159.72 165.93 171.50 173.80 180.01 185.63 191.41 196.86 202.31" y="717.26" font-size="10.00" class="sc-loraregular">reasoning. arXiv:2603.08655.</text><text x="207.40 213.29 217.26 221.13 227.10 231.73 234.23 237.92 244.38 249.54 253.86 259.16 261.97 266.63 269.09 274.94 279.22 284.75 291.20 296.36 302.18 306.46 313.36 318.73 324.51 330.72 336.28 338.59 344.80 350.42 356.20 361.65" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2603.08655</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">209</text><text x="72.00" y="361.24" font-size="10.00" class="sc-lorabold">[</text><text x="75.86" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">图</text><text x="88.49 94.21 96.54 102.14 104.47 109.94 112.27 118.42" y="361.24" font-size="10.00" class="sc-lorabold">8.9.4.B]</text><text x="124.91" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">各模型在四个推理强度档位下的</text><text x="267.54" y="361.24" font-size="10.00" class="sc-lorabold sc-liga"><tspan x="267.54 275.23 281.13 290.61 296.27 300.98 304.10 309.97 314.68 320.97 326.35 331.15">OSWorld-Veri</tspan><tspan x="334.42">fi</tspan><tspan x="341.09 346.47 352.43 355.06 361.07 366.31 371.16 376.01 383.94">ed pass@1</tspan></text><text x="390.63" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">与每任务平均输出</text><text x="473.26 477.39 483.01 488.70 494.08" y="361.24" font-size="10.00" class="sc-lorabold">token</text><text x="503.09" y="361.24" font-size="10.00" class="sc-notoserifcjkscbold">数的关</text><text x="72.00" y="375.44" font-size="10.00" class="sc-notoserifcjkscbold">系。</text><text x="92.00" y="375.44" font-size="10.00" class="sc-notoserifcjksc">推理强度控制模型投入的努力程度。本图所示的所有分数均使用上文所述的更新后智能体脚手架。其</text><text x="72.00" y="389.64" font-size="10.00" class="sc-notoserifcjksc">余评估设置与图</text><text x="144.63 150.25 152.71 158.33 160.79 166.21 168.67" y="389.64" font-size="10.00" class="sc-loraregular">8.9.4.A</text><text x="177.56" y="389.64" font-size="10.00" class="sc-notoserifcjksc">相同。</text><text x="72.00" y="423.99" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="423.99" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="72.00" y="488.76" font-size="11.00" class="sc-loraregular sc-liga"><tspan x="72.00 80.73">Of</tspan><tspan x="84.56">fi</tspan><tspan x="91.42 97.21 103.17 111.79">ceQA</tspan></text><text x="118.67" y="485.09" font-size="6.60" class="sc-loraregular">58</text><text x="128.87" y="488.76" font-size="11.00" class="sc-notoserifcjksc">是一个基准测试，用于评估语言模型在真实的办公类问答任务上的表现，这些任务源</text><text x="72.00" y="504.38" font-size="11.00" class="sc-notoserifcjksc">自知识工作者日常处理的文档、电子表格和演示文稿。任务要求模型阅读冗长且异构的专业文</text><text x="72.00" y="520.00" font-size="11.00" class="sc-notoserifcjksc">档，并回答依赖于精确信息提取、跨章节综合以及数值或表格推理的问题。</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 482.02 488.59 495.16 500.25 503.14 509.11 511.46" y="520.00" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="519.43" y="520.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="535.62" font-size="11.00" class="sc-loraregular sc-liga"><tspan x="72.00 80.73">Of</tspan><tspan x="84.56">fi</tspan><tspan x="91.42 97.21 103.17 111.79">ceQA</tspan></text><text x="121.57" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="157.46" y="535.62" font-size="11.00" class="sc-loraregular">86.3%</text><text x="188.40" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="213.30" y="535.62" font-size="11.00" class="sc-loraregular sc-liga"><tspan x="213.30 222.03">Of</tspan><tspan x="225.86">fi</tspan><tspan x="232.71 238.51 244.47 253.08 259.97 262.86 269.53 274.21">ceQA Pro</tspan></text><text x="283.54" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="319.43 325.62 332.27 334.87 341.23" y="535.62" font-size="11.00" class="sc-loraregular">80.6%</text><text x="350.80" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，两者均采用精确匹配评分（允许的相</text><text x="72.00" y="551.24" font-size="11.00" class="sc-notoserifcjksc">对误差为</text><text x="118.89" y="551.24" font-size="11.00" class="sc-loraregular">0%</text><text x="135.29" y="551.24" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://arxiv.org/abs/2603.08655" rel="noopener"><rect x="207.75" y="707.25" width="159.00" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="72.00" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.2 Finance Agent</text><text x="72.00" y="210.33" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.3 MCP Atlas</text><text x="72.00" y="495.64" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.4 VendingBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">210</text><text x="72.00 77.97 81.06 87.74 93.42 100.09 105.89 111.85 114.75 121.63 127.66 133.62 140.20" y="110.82" font-size="11.00" class="sc-loraregular">Finance Agent</text><text x="144.46" y="107.15" font-size="6.60" class="sc-loraregular">59</text><text x="154.76" y="110.82" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="179.65 186.57 192.25 195.24 200.33 203.23 210.11" y="110.82" font-size="11.00" class="sc-loraregular">Vals AI</text><text x="216.69" y="110.82" font-size="11.00" class="sc-notoserifcjksc">发布的公开基准测试，评估模型针对上市公司向美国证券交易委员</text><text x="72.00" y="126.44" font-size="11.00" class="sc-notoserifcjksc">会（</text><text x="94.00" y="126.44" font-size="11.00" class="sc-loraregular">SEC</text><text x="114.77" y="126.44" font-size="11.00" class="sc-notoserifcjksc">）提交的文件开展研究的表现。</text><text x="268.77 275.69 281.36 284.36 289.45 292.34 299.23" y="126.44" font-size="11.00" class="sc-loraregular">Vals AI</text><text x="305.81" y="126.44" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上对</text><text x="396.70 404.39 407.38 412.99 419.56 426.13 432.10 434.99 443.72 450.29 456.86 461.95 464.84 470.80 473.16" y="126.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="481.12" y="126.44" font-size="11.00" class="sc-notoserifcjksc">进行了评估</text><text x="72.00" y="142.06" font-size="11.00" class="sc-notoserifcjksc">（使 rifcjksc">。在</text><text x="395.62 401.86 407.69 413.36 416.36" y="363.40" font-size="11.00" class="sc-loraregular">Scale</text><text x="425.21" y="363.40" font-size="11.00" class="sc-notoserifcjksc">运行的扩展配置中</text><text x="72.00" y="379.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="379.02" font-size="11.00" class="sc-loraregular">256</text><text x="104.15" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="140.05" y="379.02" font-size="11.00" class="sc-loraregular">/ 100</text><text x="171.09" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具，而排行榜为</text><text x="272.98" y="379.02" font-size="11.00" class="sc-loraregular">20</text><text x="288.61" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个轮次</text><text x="324.51" y="379.02" font-size="11.00" class="sc-loraregular">/ 10–25</text><text x="367.11" y="379.02" font-size="11.00" class="sc-notoserifcjksc">个工具），</text><text x="422.11 430.84 437.41 443.98 449.07 451.96 457.92 460.28" y="379.02" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="468.24" y="379.02" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="72.00 77.07 83.25 85.96 91.95" y="394.64" font-size="11.00" class="sc-loraregular">79.5%</text><text x="101.52" y="394.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="112.52" y="394.64" font-size="11.00" class="sc-loraregular">max</text><text x="133.86" y="394.64" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="144.86 151.45 154.54 160.89" y="394.64" font-size="11.00" class="sc-loraregular">high</text><text x="170.37" y="394.64" font-size="11.00" class="sc-notoserifcjksc">下为</text><text x="195.27 200.34 206.52 208.87 213.94" y="394.64" font-size="11.00" class="sc-loraregular">79.7%</text><text x="223.51" y="394.64" font-size="11.00" class="sc-notoserifcjksc">），表明在更大的工具调用预算下仍有提升空间。</text><text x="72.00" y="428.74" font-size="11.00" class="sc-notoserifcjksc">关于与此前</text><text x="129.89 139.94 147.62 154.15 159.53 166.34 170.59 173.59 179.26" y="428.74" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="187.25" y="428.74" font-size="11.00" class="sc-notoserifcjksc">结果可比性的说明：</text><text x="286.25 292.15 298.91 304.82" y="428.74" font-size="11.00" class="sc-loraregular">2026</text><text x="314.07" y="428.74" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="327.96" y="428.74" font-size="11.00" class="sc-loraregular">4</text><text x="336.81" y="428.74" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="358.81 365.05 370.88 376.56 379.55" y="428.74" font-size="11.00" class="sc-loraregular">Scale</text><text x="388.40" y="428.74" font-size="11.00" class="sc-notoserifcjksc">更新了运行框架（升级了评判</text><text x="72.00" y="444.36" font-size="11.00" class="sc-notoserifcjksc">模型并改进了重试处理），并对排行榜重新评分。此处所有分数均使用更新后的运行框架。基于</text><text x="72.00" y="459.98" font-size="11.00" class="sc-notoserifcjksc">旧运行框架的</text><text x="140.89" y="459.98" font-size="11.00" class="sc-loraregular">Opus</text><text x="170.75" y="459.98" font-size="11.00" class="sc-notoserifcjksc">结果不具可比性。</text><text x="72.00 78.75 84.72 91.39 97.97 101.06 107.74 113.82 119.20 126.04 132.01 138.68 144.53 151.12 154.02" y="519.74" font-size="11.00" class="sc-loraregular">Vending-Bench 2</text><text x="162.82" y="519.74" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="173.82 180.70 187.38 193.96 200.39 207.07 209.96 216.56 222.24 228.64" y="519.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Andon Labs</text><text x="233.73" y="519.74" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，衡量</text><text x="346.63" y="519.74" font-size="11.00" class="sc-loraregular">AI</text><text x="360.09" y="519.74" font-size="11.00" class="sc-notoserifcjksc">模型在长时间跨度内经营一项业务的</text><text x="72.00" y="535.36" font-size="11.00" class="sc-notoserifcjksc">表现。</text><text x="105.00" y="531.69" font-size="6.60" class="sc-loraregular">61</text><text x="111.22" y="535.36" fo 98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="341.65 350.03 358.11 365.10 370.54 376.22" y="273.98" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="382.10" y="273.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="437.10" y="270.31" font-size="6.60" class="sc-loraregular">60</text><text x="445.01" y="273.98" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="469.91" y="273.98" font-size="11.00" class="sc-loraregular">220</text><text x="491.45" y="273.98" font-size="11.00" class="sc-notoserifcjksc">个任务，</text><text x="72.00" y="289.60" font-size="11.00" class="sc-notoserifcjksc">涵盖</text><text x="96.89" y="289.60" font-size="11.00" class="sc-loraregular">9</text><text x="106.14" y="289.60" font-size="11.00" class="sc-notoserifcjksc">个主要行业的</text><text x="175.04" y="289.60" font-size="11.00" class="sc-loraregular">44</text><text x="189.85" y="289.60" font-size="11.00" class="sc-notoserifcjksc">种职业。任务反映了真实的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="305.22" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="305.22" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="305.22" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，表现通过基于</text><text x="72.00" y="320.84" font-size="11.00" class="sc-notoserifcjksc">模型输出盲评两两比较得出的</text><text x="217.89" y="320.84" font-size="11.00" class="sc-loraregular">Elo</text><text x="237.06" y="320.84" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="72.00" y="666.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.27 112.37 117.90 121.37 123.74 130.53 137.23 142.98 147.79 152.51 155.23 159.47 165.70 171.71 174.08 179.69 182.50" y="666.21" font-size="9.00" class="sc-lorabold">8.10.5.A] GDPval-AA Elo</text><text x="189.96" y="666.21" font-size="9.00" class="sc-notoserifcjkscbold">评分。</text><text x="216.96 223.25 225.70 230.29 235.66 241.05 245.92 248.29 255.44 260.81 266.18 270.35 272.72 277.60 279.52" y="666.21" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="286.04" y="666.21" font-size="9.00" class="sc-notoserifcjksc">领先</text><text x="306.41 313.25 318.71 323.89 328.29 333.20 335.41" y="666.21" font-size="9.00" class="sc-loraregular">GPT-5.4</text><text x="340.29" y="666.21" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="349.29 351.31 356.08 361.47 364.00 369.19 374.37" y="666.21" font-size="9.00" class="sc-loraregular">‘xhigh’</text><text x="375.94" y="666.21" font-size="9.00" class="sc-notoserifcjksc">）约</text><text x="396.31" y="666.21" font-size="9.00" class="sc-loraregular">79</text><text x="408.02" y="666.21" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="419.39" y="666.21" font-size="9.00" class="sc-loraregular">Elo</text><text x="435.07" y="666.21" font-size="9.00" class="sc-notoserifcjksc">分，意味着约</text><text x="491.44" y="666.21" font-size="9.00" class="sc-loraregular">61.2%</text><text x="517.16" y="666.21" font-size="9.00" class="sc-notoserifcjksc">的两</text><text x="72.00" y="677.91" font-size="9.00" class="sc-notoserifcjksc">两比较胜率。评估由</text><text x="155.37" y="677.91" font-size="9.00" class="sc-loraregular sc-liga"><tspan x="155.37 161.00 164.96 168.44">Arti</tspan><tspan x="170.97">fi</tspan><tspan x="176.58 181.37 183.90 188.54 190.99 193.36 198.99 204.45 209.10 211.50 216.25 220.42 222.95">cial Analysis</tspan></text><text x="229.48" y="677.91" font-size="9.00" class="sc-notoserifcjksc">独立运行。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="222.00" y="707.25" width="155.25" height="12.75" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="150.46" y="249.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/" rel="noopener"><rect x="
