cjksc">次试验的平均</text><text x="72.00" y="299.95" font-size="9.00" class="sc-notoserifcjksc">值。上下文窗口大小因评估而异，且不超过</text><text x="245.37" y="299.95" font-size="9.00" class="sc-loraregular">100</text><text x="262.19" y="299.95" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="273.55" y="299.95" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="297.41" y="299.95" font-size="9.00" class="sc-notoserifcjksc">。每行中的最高分以</text><text x="378.41" y="299.95" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="396.41" y="299.95" font-size="9.00" class="sc-notoserifcjksc">标出。竞争对手的数据取自各开发者</text><text x="72.00" y="311.65" font-size="9.00" class="sc-notoserifcjksc">已发布的系统卡或基准测试排行榜。有关早期</text><text x="254.37" y="311.65" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="285.70" y="311.65" font-size="9.00" class="sc-notoserifcjksc">模型的评估细节，请参阅</text><text x="384.70" y="311.65" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="455.02" y="311.65" font-size="9.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="482.02" y="311.65" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="372.54" font-size="14.00" class="sc-poppinssemibold">8.2 SWE-bench Verified</text><text x="237.87" y="372.54" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="251.87" y="372.54" font-size="14.00" class="sc-poppinssemibold">Pro</text><text x="274.97" y="372.54" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="288.97" y="372.54" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="376.53" y="372.54" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="393.86" y="372.54" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00" y="399.11" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="132.67" y="399.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="143.67" y="399.11" font-size="11.00" class="sc-loraregular sc-k">Software Engineering Bench</text><text x="289.43" y="399.11" font-size="11.00" class="sc-notoserifcjksc">）在真实世界软件工程任务上测试</text><text x="457.32" y="399.11" font-size="11.00" class="sc-loraregular">AI</text><text x="470.78" y="399.11" font-size="11.00" class="sc-notoserifcjksc">模型。我们报</text><text x="72.00" y="414.73" font-size="11.00" class="sc-notoserifcjksc">告四个变体，其分数均为</text><text x="195.89" y="414.73" font-size="11.00" class="sc-loraregular">5</text><text x="204.78" y="414.73" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值：</text><text x="211.47" y="443.79" font-size="6.60" class="sc-loraregular">41</text><text x="217.45" y="447.45" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="228.45" y="447.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="266.96" y="447.45" font-size="11.00" class="sc-notoserifcjksc">）是一个包含</text><text x="335.85" y="447.45" font-size="11.00" class="sc-loraregular">500</text><text x="358.40" y="447.45" font-size="11.00" class="sc-notoserifcjksc">道题目的子集，每道题都经人类工程</text><text x="108.00" y="463.07" font-size="11.00" class="sc-notoserifcjksc">师验证为可解。</text><text x="185.00" y="463.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="269.42" y="463.07" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="316.32" y="463.07" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="345.61" y="463.07" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="479.84" font-size="11.00" class="sc-loraregular sc-k">SWE-bench Pro</text><text x="189.35" y="476.17" font-size="6.60" class="sc-loraregular">42</text><text x="196.47" y="479.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="207.47" y="479.84" font-size="11.00" class="sc-loraregular sc-k">Scale</text><text x="234.16" y="479.84" font-size="11.00" class="sc-notoserifcjksc">）是一个难度更高的变体：题目取自活跃维护的代码仓库，涉</text><text x="108.00" y="495.46" font-size="11.00" class="sc-notoserifcjksc">及规模更大的多文件</text><text x="209.89" y="495.46" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="227.11" y="495.46" font-size="11.00" class="sc-notoserifcjksc">，且不存在公开的真值泄露。</text><text x="370.11" y="495.46" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="416.24" y="495.46" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="463.14" y="495.46" font-size="11.00" class="sc-loraregular">64.3%</text><text x="493.86" y="495.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="528.64" font-size="11.00" class="sc-loraregular sc-k">SWE-bench Multilingual</text><text x="235.53" y="528.64" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖</text><text x="337.43" y="528.64" font-size="11.00" class="sc-loraregular">9</text><text x="346.68" y="528.64" font-size="11.00" class="sc-notoserifcjksc">种编程语言的</text><text x="415.57" y="528.64" font-size="11.00" class="sc-loraregular">300</text><text x="438.25" y="528.64" font-size="11.00" class="sc-notoserifcjksc">道题目。</text><text x="482.25" y="528.64" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="528.39" y="528.64" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="108.00" y="544.26" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="143.89" y="544.26" font-size="11.00" class="sc-loraregular sc-k">80.5%</text><text x="175.00" y="544.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="560.80" font-size="11.00" class="sc-loraregular sc-k">SWE-bench Multimodal</text><text x="230.08" y="557.13" font-size="6.60" class="sc-loraregular">43</text><text x="237.33" y="560.80" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="251.22" y="560.80" font-size="11.00" class="sc-loraregular">issue</text><text x="279.92" y="560.80" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图、设计稿）。</text><text x="499.92" y="560.80" font-size="11.00" class="sc-loraregular">Opus</text <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">所有</text><text x="96.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="160.45" y="82.63" font-size="11.00" class="sc-notoserifcjksc">变体均使用标准配置，且采样结果中包含思考块。有关我们的记忆化筛查，请</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">参阅</text><text x="94.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos</text><text x="135.06" y="98.25" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Preview</text><text x="178.59" y="98.25" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="211.59" y="98.25" font-size="11.00" class="sc-notoserifcjksc">中的第</text><text x="247.48" y="98.25" font-size="11.00" class="sc-loraregular">8.2.1</text><text x="271.88" y="98.25" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="175.12" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="172.97" y="171.46" font-size="6.60" class="sc-loraregular">44</text><text x="180.12" y="175.12" font-size="11.00" class="sc-notoserifcjksc">由斯坦福大学和</text><text x="260.02" y="175.12" font-size="11.00" class="sc-loraregular sc-k">Laude Institute</text><text x="341.05" y="175.12" font-size="11.00" class="sc-notoserifcjksc">的研究人员开发，在终端和命令行环境中</text><text x="72.00" y="190.74" font-size="11.00" class="sc-notoserifcjksc">的真实世界任务上测试</text><text x="184.89" y="190.74" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="190.74" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="223.93" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="223.93" font-size="11.00" class="sc-loraregular sc-k">Harbor</text><text x="147.27" y="223.93" font-size="11.00" class="sc-notoserifcjksc">脚手架（</text><text x="191.27" y="223.93" font-size="11.00" class="sc-loraregular sc-k">scaffold</text><text x="231.37" y="223.93" font-size="11.00" class="sc-notoserifcjksc">）中使用</text><text x="278.26" y="223.93" font-size="11.00" class="sc-loraregular sc-k">Terminus-2</text><text x="340.58" y="223.93" font-size="11.00" class="sc-notoserifcjksc">运行框架和默认解析器运行</text><text x="475.47" y="223.93" font-size="11.00" class="sc-loraregular sc-k">Terminal-</text><text x="72.00" y="239.55" font-size="11.00" class="sc-loraregular sc-k">Bench 2.0</text><text x="122.09" y="239.55" font-size="11.00" class="sc-notoserifcjksc">。每个任务都在一个隔离的</text><text x="256.99" y="239.55" font-size="11.00" class="sc-loraregular sc-k">Kubernetes pod</text><text x="341.32" y="239.55" font-size="11.00" class="sc-notoserifcjksc">中运行，保证资源为基准测试规定上限的</text><text x="72.00" y="255.17" font-size="11.00" class="sc-loraregular">1×</text><text x="172.73" y="255.17" font-size="11.00" class="sc-loraregular">3×</text><text x="184.68" y="255.17" font-size="11.00" class="sc-notoserifcjksc">），超时设为</text><text x="253.58" y="255.17" font-size="11.00" class="sc-loraregular">1×</text><text x="263.41" y="255.17" font-size="11.00" class="sc-notoserifcjksc">，以保证对基准测试的忠实度。有关此配置的详情，请参</text><text x="72.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc">阅</text><text x="83.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的工程博客</text><text x="160.00" y="270.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="304.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="304.89" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="192.32" y="304.89" font-size="11.00" class="sc-loraregular sc-k">69.4%</text><text x="225.99" y="304.89" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，该结果为</text><text x="338.88" y="304.89" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="354.24" y="304.89" font-size="11.00" class="sc-notoserifcjksc">个不同任务各进行</text><text x="445.13" y="304.89" font-size="11.00" class="sc-loraregular">5</text><text x="454.02" y="304.89" font-size="11.00" class="sc-notoserifcjksc">次尝试后的平均值</text><text x="72.00" y="320.51" font-size="11.00" class="sc-notoserifcjksc">（共计</text><text x="107.89" y="320.51" font-size="11.00" class="sc-loraregular">445</text><text x="128.71" y="320.51" font-size="11.00" class="sc-notoserifcjksc">次试验）。我们将</text><text x="219.60" y="320.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="304.02" y="320.51" font-size="11.00" class="sc-notoserifcjksc">配置为在关闭思考的情况下运行。</text><text x="469.02" y="320.51" font-size="11.00" class="sc-loraregular sc-k">Terminal-</text><text x="72.00" y="336.13" font-size="11.00" class="sc-loraregular">Bench</text><text x="106.82" y="336.13" font-size="11.00" class="sc-notoserifcjksc">对推理延迟较为敏感：固定的实际耗时超时意味着解码较慢的端点在每个任务中完成的回</text><text x="72.00" y="351.75" font-size="11.00" class="sc-notoserifcjksc">合更少。我们报告的分数使用生产环境</text><text x="261.89" y="351.75" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="281.97" y="351.75" font-size="11.00" class="sc-notoserifcjksc">端点，以考虑这些动态因素。</text><text x="72.00 80.37 85.06 90.73 97.31 103.88 109.48 113.73 119.70 125.08 131.43 137.34 142.84 148.80 151.79 154.69 163.06 169.49 175.93 182.27 185.27 191.23 196.61 203.27 207.96 214.39 220.77 224.49 227.39 236.14 244.34" y="429.77" font-size="11.00" class="sc-loraregular">Graduate-Level Google-Proof Q&amp;A</text><text x="254.12" y="429.77" font-size="11.00" class="sc-notoserifcjksc">基准测试（</text><text x="309.12" y="429.77" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="339.65" y="429.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="350.65" y="426.10" font-size="6.60" class="sc-loraregular">45</text><text x="357.83" y="429.77" font-size="11.00" class="sc-notoserifcjksc">是一组具有挑战性的多项选择科学</text><text x="72.00" y="445.39" font-size="11.00" class="sc-notoserifcjksc">题。我们使用包含</text><text x="162.89" y="445.39" font-size="11.00" class="sc-loraregular">198</text><text x="182.33" y="445.39" font-size="11.00" class="sc-notoserifcjksc">道题的</text><text x="218.22" y="445.39" font-size="11.00" class="sc-loraregular">Diamond</text><text x="72.00" y="461.01" font-size="11.00" class="sc-notoserifcjksc">答不对。</text><text x="116.00" y="461.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="200.42" y="461.01" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="214.32" y="461.01" font-size="11.00" class="sc-loraregular sc-k">GPQA Diamond</text><text x="297.13" y="461.01" font-size="11.00" class="sc-notoserifcjksc">上取得了</text><text x="344.02" y="461.01" font-size="11.00" class="sc-loraregular">94.2%</text><text x="377.42" y="461.01" font-size="11.00" class="sc-notoserifcjksc">的成绩，为</text><text x="435.31" y="461.01" font-size="11.00" class="sc-loraregular">10</text><text x="449.04" y="461.01" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="538.69" font-size="11.00" class="sc-loraregular sc-k">MMMLU</text><text x="116.80" y="535.02" font-size="6.60" class="sc-loraregular">46</text><text x="124.19" y="538.69" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="135.20" y="538.69" font-size="11.00" class="sc-loraregular sc-k">Multilingual Massive Multitask Language Understanding</text><text x="422.13" y="538.69" font-size="11.00" class="sc-notoserifcjksc">）测试</text><text x="458.02" y="538.69" font-size="11.00" class="sc-loraregular">14</text><text x="470.88" y="538.69" font-size="11.00" class="sc-notoserifcjksc">种非英语语言</text><text x="72.00" y="554.31" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="85.89" y="554.31" font-size="11.00" class="sc-loraregular">57</text><text x="99.85" y="554.31" font-size="11.00" class="sc-notoserifcjksc">个学术科目的知识与推理能力。</text><text x="253.85" y="554.31" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="338.28" y="554.31" font-size="11.00" class="sc-notoserifcjksc">在所有非英语语言组合上取得了</text><text x="495.17" y="554.31" font-size="11.00" class="sc-loraregular">91.5%</text><text x="526.70" y="554.31" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="569.93" font-size="11.00" class="sc-notoserifcjksc">成绩（</text><text x="105.00" y="569.93" font-size="11.00" class="sc-loraregular">3</text><text x="114.02" y="569.93" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值），每次运行均采用自适应思考、</text><text x="356.02" y="569.93" font-size="11.00" class="sc-loraregular">max</text><text x="380.25" y="569.93" font-size="11.00" class="sc-notoserifcjksc">推理强度和默认采样设置</text><text x="72.00" y="585.55" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="585.55" font-size="11.00" class="sc-loraregular sc-k">temperature</text><text x="147.34" y="585.55" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="158.34" y="585.55" font-size="11.00" class="sc-loraregular">top_p</text><text x="190.18" y="585.55" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="649.27" font-size="6.00" class="sc-loraregular">44</text><text x="78.50 87.61 93.03 97.36 101.69 104.50 107.22 109.94 112.46 115.09 124.27 126.73 129.36 135.62 138.08 140.60 143.23 148.58 152.45 155.08 160.24 162.96 165.42 168.05 171.10 176.47 182.61 187.98 193.64 196.69 199.15 201.78 207.69 213.11 217.44 226.38 229.19 235.26 240.42 243.14 248.03 254.25 259.67 265.74 271.06 277.05 279.55 282.18 288.40 293.82 299.89 305.21 311.20 320.14 325.30 329.59 334.96 337.77 343.84 349.37 352.00 357.16 362.64 368.06 374.04 377.91 382.54 385.17 391.02 397.09 399.72 405.71 410.87 415.13 421.11 423.63 426.26 430.52 435.92 441.08 443.80 446.61 451.24 455.11 457.92 463.24 465.87 469.74 474.90 479.53 484.90 489.53 492.16 494.97" y="652.6  x="267.79" y="658.81" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2601.11868" rel="noopener"><rect x="305.22" y="658.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2601.11868" rel="noopener"><rect x="305.22" y="658.81" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2601.11868" rel="noopener"><rect x="352.50" y="658.81" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2601.11868" rel="noopener"><rect x="352.50" y="658.81" width="69.92" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="72.00" y="687.21" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="109.43" y="687.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="109.43" y="687.21" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="156.71" y="687.21" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="156.71" y="687.21" width="68.58" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2009.03300" rel="noopener"><rect x="155.51" y="715.61" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2009.03300" rel="noopener"><rect x="192.94" y="715.61" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2009.03300" rel="noopener"><rect x="192.94" y="715.61" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2009.03300" rel="noopener"><rect x="240.22" y="715.61" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2009.03300" rel="noopener"><rect x="240.22" y="715.61" width="77.65" height="10.00" fill="tra <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="171.00" y="110.78" font-size="11.00" class="sc-loraregular sc-k">USA Mathematical Olympiad</text><text x="317.19" y="110.78" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="328.19" y="110.78" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="368.36" y="110.78" font-size="11.00" class="sc-notoserifcjksc">）是一项面向高中生、共六道题、</text><text x="371.89" y="126.40" font-size="11.00" class="sc-loraregular">AIME</text><text x="402.30" y="126.40" font-size="11.00" class="sc-notoserifcjksc">之后的下一级比赛；</text><text x="501.30" y="126.40" font-size="11.00" class="sc-loraregular">AIME</text><text x="72.00" y="142.02" font-size="11.00" class="sc-notoserifcjksc">去年曾是热门的</text><text x="151.89" y="142.02" font-size="11.00" class="sc-loraregular">AI</text><text x="165.36" y="142.02" font-size="11.00" class="sc-notoserifcjksc">基准测试，但如今已饱和。</text><text x="297.36" y="142.02" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="325.18" y="142.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="339.07" y="142.02" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="382.13" y="142.02" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="396.03" y="142.02" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="423.85" y="142.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="437.74" y="142.02" font-size="11.00" class="sc-loraregular">3</text><text x="446.76" y="142.02" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="460.65 466.56 470.43 476.92 482.83" y="142.02" font-size="11.00" class="sc-loraregular">21–22</text><text x="491.63" y="142.02" font-size="11.00" class="sc-notoserifcjksc">日举行，</text><text x="72.00" y="157.64" font-size="11.00" class="sc-notoserifcjksc">晚于</text><text x="96.89" y="157.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="181.32" y="157.64" font-size="11.00" class="sc-notoserifcjksc">的训练数据截止日期。</text><text x="72.00" y="191.74" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="191.74" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="139.96" y="191.74" font-size="11.00" class="sc-notoserifcjksc">的解答是证明而非简短答案，评分可能具有挑战性且带有主观性。我们遵循</text><text x="72.00" y="207.36" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="128.43" y="203.69" font-size="6.60" class="sc-loraregular">47</text><text x="135.05" y="207.36" font-size="11.00" class="sc-notoserifcjksc">的评分方法：每份证明先由一个中立模型（</text><text x="344.05" y="207.36" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="417.49" y="207.36" font-size="11.00" class="sc-notoserifcjksc">）改写，再由</text><text x="486.38" y="207.36" font-size="11.00" class="sc-loraregular">3</text><text x="495.40" y="207.36" font-size="11.00" class="sc-notoserifcjksc">个前沿模</text><text x="72.00" y="222.98" font-size="11.00" class="sc-notoserifcjksc">型组成的评审团（我们使用的是</text><text x="228.89" y="222.98" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="302.33" y="222.98" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="313.33" y="222.98" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="399.28" y="222.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="413.18" y="222.98" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="238.60" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="238.60" font-size="11.00" class="sc-notoserifcjksc">）依据既定的评分细则进行评判。最终得分取任一评判者所给分数中的最低值。</text><text x="72.00" y="288.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="288.89" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="203.32" y="288.89" font-size="11.00" class="sc-loraregular sc-k">69.3%</text><text x="234.26" y="288.89" font-size="11.00" class="sc-notoserifcjksc">，为每道题</text><text x="292.15" y="288.89" font-size="11.00" class="sc-loraregular">10</text><text x="305.88" y="288.89" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值。我们在批处理</text><text x="462.78" y="288.89" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="482.85" y="288.89" font-size="11.00" class="sc-notoserifcjksc">中使用</text><text x="72.00" y="304.51" font-size="11.00" class="sc-loraregular sc-k">medium</text><text x="116.70" y="304.51" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="171.70" y="304.51" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="203.76" y="304.51" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="239.65" y="304.51" font-size="11.00" class="sc-loraregular">300k</text><text x="265.35" y="304.51" font-size="11.00" class="sc-notoserifcjksc">；更高的推理强度经常超出</text><text x="400.24" y="304.51" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="420.32" y="304.51" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="434.21" y="304.51" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="466.26" y="304.51" font-size="11.00" class="sc-notoserifcjksc">上限。我们使</text><text x="72.00" y="320.13" font-size="11.00" class="sc-notoserifcjksc">用</text><text x="85.89" y="320.13" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="133.56" y="320.13" font-size="11.00" class="sc-notoserifcjksc">将我们的运行框架校准到</text><text x="257.45" y="320.13" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="316.77" y="320.13" font-size="11.00" class="sc-notoserifcjksc">公布的分数。</text><text x="382.77" y="320.13" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="442.10" y="320.13" font-size="11.00" class="sc-notoserifcjksc">测得的结果为</text><text x="72.00" y="335.75" font-size="11.00" class="sc-loraregular sc-k">47.0%</text><text x="101.49" y="335.75" font-size="11.00" class="sc-notoserifcjksc">，但它将</text><text x="148.38" y="335.75" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="196.05" y="335.75" font-size="11.00" class="sc-notoserifcjksc">的思考</text><text x="231.94" y="335.75" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="263.99" y="335.75" font-size="11.00" class="sc-notoserifcjksc">限制在</text><text x="299.89" y="335.75" font-size="11.00" class="sc-loraregular">120k</text><text x="322.54" y="335.75" font-size="11.00" class="sc-notoserifcjksc">。我们在相同设置下的测量结果为</text><text x="490.43" y="335.75" font-size="11.00" class="sc-loraregular">51.9%</text><text x="519.06" y="335.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="351.37" font-size="11.00" class="sc-notoserifcjksc">差距在</text><text x="107.89" y="351.37" font-size="11.00" class="sc-loraregular">5%</text><text x="126.35" y="351.37" font-size="11.00" class="sc-notoserifcjksc">以内；在不受限制的</text><text x="228.24" y="351.37" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="253.75" y="351.37" font-size="11.00" class="sc-notoserifcjksc">推理强度思考下，我们测得</text><text x="388.65" y="351.37" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="436.31" y="351.37" font-size="11.00" class="sc-notoserifcjksc">的成绩为</text><text x="483.20" y="351.37" font-size="11.00" class="sc-loraregular">66.2%</text><text x="514.10" y="351.37" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="403.62" font-size="14.00" class="sc-poppinssemibold">8.7</text><text x="95.65" y="403.62" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00" y="468.39" font-size="11.00" class="sc-loraregular sc-k">GraphWalks</text><text x="133.64" y="464.72" font-size="6.60" class="sc-loraregular">48</text><text x="72.00" y="484.01" font-size="11.00" class="sc-notoserifcjksc">的有向图，模型必须从一个随机起始节点出发执行广度优先搜索（</text><text x="391.00" y="484.01" font-size="11.00" class="sc-loraregular sc-k">BFS</text><text x="410.01" y="484.01" font-size="11.00" class="sc-notoserifcjksc">）或识别父节点。</text><text x="72.00" y="533.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="533.38" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="170.32" y="533.38" font-size="11.00" class="sc-loraregular sc-k">BFS 256K-1M</text><text x="239.58" y="533.38" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="275.48" y="533.38" font-size="11.00" class="sc-loraregular sc-k">58.6%</text><text x="306.18" y="533.38" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="331.07" y="533.38" font-size="11.00" class="sc-loraregular sc-k">parents 256k-1M</text><text x="418.79" y="533.38" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="454.68" y="533.38" font-size="11.00" class="sc-loraregular">75.1%</text><text x="482.03" y="533.38" font-size="11.00" class="sc-notoserifcjksc">，均为</text><text x="517.92" y="533.38" font-size="11.00" class="sc-loraregular">5</text><text x="526.81" y="533.38" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="549.00" font-size="11.00" class="sc-notoserifcjksc">试验的平均值。该结果无法通过公开</text><text x="250.89" y="549.00" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="270.97" y="549.00" font-size="11.00" class="sc-notoserifcjksc">复现，因为半数题目超过了其</text><text x="416.86" y="549.00" font-size="11.00" class="sc-loraregular">100</text><text x="437.42" y="549.00" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="451.31" y="549.00" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="483.37" y="549.00" font-size="11.00" class="sc-notoserifcjksc">的上限；在</text><text x="72.00" y="564.62" font-size="11.00" class="sc-loraregular">256K</text><text x="100.67" y="564.62" font-size="11.00" class="sc-notoserifcjksc">题目子集上，</text><text x="166.67" y="564.62" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="212.80" y="564.62" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="226.69" y="564.62" font-size="11.00" class="sc-loraregular sc-k">BFS</text><text x="248.59" y="564.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="284.49" y="564.62" font-size="11.00" class="sc-loraregular">76.91%</text><text x="318.55" y="564.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="343.45" y="564.62" font-size="11.00" class="sc-loraregular sc-k">parents</text><text x="385.16" y="564.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="421.05" y="564.62" font-size="11.00" class="sc-loraregular">93.57%</text><text x="456.88" y="564.62" font-size="11.00" class="sc-notoserifcjksc">。与以往的</text><text x="72.00" y="580.24" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="580.24" font-size="11.00" class="sc-notoserifcjksc">模型一样，我们的评分修正了已发布</text><text x="289.18" y="580.24" font-size="11.00" class="sc-loraregular">F1</text><text x="302.11" y="580.24" font-size="11.00" class="sc-notoserifcjksc">指标中的一处歧义（真值集合为空时，空预测记</text><text x="72.00" y="595.86" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="595.86" font-size="11.00" class="sc-loraregular sc-k">1.0</text><text x="102.16" y="595.86" font-size="11.00" class="sc-notoserifcjksc">分而非</text><text x="138.05" y="595.86" font-size="11.00" class="sc-loraregular">0</text><text x="147.78" y="595.86" font-size="11.00" class="sc-notoserifcjksc">分），并澄清了</text><text x="227.67" y="595.86" font-size="11.00" class="sc-loraregular sc-k">BFS</text><text x="249.57" y="595.86" font-size="11.00" class="sc-notoserifcjksc">提示词，要求返回恰好位于深度</text><text x="406.47" y="595.86" font-size="11.00" class="sc-loraregular">N</text><text x="417.74" y="595.86" font-size="11.00" class="sc-notoserifcjksc">的节点，而非深度不超过</text><text x="72.00" y="611.48" font-size="11.00" class="sc-loraregular">N</text><text x="83.28" y="611.48" font-size= <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular">OpenAI MRCR</text><text x="145.01" y="111.05" font-size="11.00" class="sc-notoserifcjksc">（多轮共指消解，</text><text x="233.01 243.11 249.67 252.66 256.92 260.01 265.39 272.22 278.66 285.22 291.90 298.48 301.37 309.06 315.50 320.88 327.71 333.67 337.33 343.29 347.98 353.94 360.62 366.42 372.38 375.27 382.10 388.06 393.16 399.59 402.58 409.15 413.41 416.50 422.93" y="111.05" font-size="11.00" class="sc-loraregular">Multi-Round Co-Reference Resolution</text><text x="429.61" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）是一个公开可用的基</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">准测试，用于评估语言模型在长上下文中定位并区分多条相似信息的能力。该测试最初由</text><text x="72.00" y="142.29" font-size="11.00" class="sc-loraregular sc-k">Vodrahalli et al. (2024)</text><text x="184.53" y="138.62" font-size="6.60" class="sc-loraregular">49</text><text x="191.92" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的论文提出，我们使用的是</text><text x="326.82" y="142.29" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="368.22" y="142.29" font-size="11.00" class="sc-notoserifcjksc">发布的版本，并包含</text><text x="470.11" y="142.29" font-size="11.00" class="sc-loraregular sc-k">2025</text><text x="497.57" y="142.29" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="511.46" y="142.29" font-size="11.00" class="sc-loraregular">12</text><text x="524.27" y="142.29" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="72.00" y="157.91" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="157.91" font-size="11.00" class="sc-notoserifcjksc">日引入的</text><text x="127.78" y="157.91" font-size="11.00" class="sc-loraregular">v2</text><text x="142.14" y="157.91" font-size="11.00" class="sc-notoserifcjksc">修复。</text><text x="72.00" y="208.20" font-size="11.00" class="sc-notoserifcjksc">与较简单的</text><text x="127.00" y="208.20" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="208.20" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="208.20" font-size="11.00" class="sc-notoserifcjksc">测试不同，</text><text x="234.24" y="208.20" font-size="11.00" class="sc-loraregular">MRCR</text><text x="268.74" y="208.20" font-size="11.00" class="sc-notoserifcjksc">要求模型在多个相同的请求中识别出正确序数的那一个</text><text x="390.51" y="223.82" font-size="11.00" class="sc-loraregular">2</text><text x="399.31" y="223.82" font-size="11.00" class="sc-notoserifcjksc">首或第</text><text x="435.20" y="223.82" font-size="11.00" class="sc-loraregular">4</text><text x="72.00" y="239.44" font-size="11.00" class="sc-notoserifcjksc">试长上下文理解能力与精确的顺序推理能力。</text><text x="72.00" y="289.16" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="289.16" font-size="11.00" class="sc-loraregular sc-k">8-needle</text><text x="167.37" y="289.16" font-size="11.00" class="sc-notoserifcjksc">变体，这是该评估中难度最高的设置。在所报告的变体中，</text><text x="453.37" y="289.16" font-size="11.00" class="sc-loraregular">256k</text><text x="480.43" y="289.16" font-size="11.00" class="sc-notoserifcjksc">分档对应</text><text x="72.00" y="304.78" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="304.78" font-size="11.00" class="sc-notoserifcjksc">数位于</text><text x="139.95 143.30 147.31 153.21 159.39 165.30 168.07 170.97 176.87 182.87 189.23 194.88" y="304.78" font-size="11.00" class="sc-loraregular">(128k, 256k]</text><text x="201.73" y="304.78" font-size="11.00" class="sc-notoserifcjksc">区间的提示词，</text><text x="278.73" y="304.78" font-size="11.00" class="sc-loraregular">1M</text><text x="295.73" y="304.78" font-size="11.00" class="sc-notoserifcjksc">分档对应</text><text x="342.62" y="304.78" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="374.68" y="304.78" font-size="11.00" class="sc-notoserifcjksc">数位于</text><text x="410.57 413.92 419.92 425.58 431.55 437.45 440.23 443.12 447.12 453.88 459.54 465.50 471.16" y="304.78" font-size="11.00" class="sc-loraregular">(524k, 1024k]</text><text x="478.01" y="304.78" font-size="11.00" class="sc-notoserifcjksc">区间的提示</text><text x="72.00" y="320.40" font-size="11.00" class="sc-notoserifcjksc">词。所报告的分数为</text><text x="173.89" y="320.40" font-size="11.00" class="sc-loraregular sc-k">Mean Match Ratio</text><text x="266.68" y="320.40" font-size="11.00" class="sc-notoserifcjksc">（平均匹配率），其定义见该评估在线数据集中的</text><text x="508.68" y="320.40" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">“How</text><text x="72.00" y="336.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">to run”</text><text x="107.18" y="336.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">部分</text><text x="129.18" y="336.02" font-size="11.00" class="sc-notoserifcjksc">。对于与竞争模型的对比结果，我们同时报告来自</text><text x="371.18" y="336.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Context Arena</text><text x="444.91" y="336.02" font-size="11.00" class="sc-notoserifcjksc">的评估结果（即由</text><text x="72.00" y="351.64" font-size="11.00" class="sc-notoserifcjksc">外部评估方运行）以及各模型提供方自行报告的性能。</text><text x="72.00" y="632.12" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 93.82 97.48 99.58 104.37 106.47 112.01 115.48 117.85 124.04 126.85 131.56 137.12 142.49 147.33 149.70 156.62 162.03 167.59 171.95 174.32 179.24 181.08" y="632.12" font-size="9.00" class="sc-lorabold">8.7.2.A] Claude Opus 4.7</text><text x="187.67" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="199.03" y="632.12" font-size="9.00" class="sc-lorabold sc-k">256 token</text><text x="243.08" y="632.12" font-size="9.00" class="sc-notoserifcjkscbold">下的长上下文理解与精确顺序推理表现</text><text x="396.08" y="632.12" font-size="9.00" class="sc-notoserifcjksc">，通过</text><text x="425.45" y="632.12" font-size="9.00" class="sc-loraregular sc-k">OpenAI MRCR v2 8 needles</text><text x="72.00" y="643.82" font-size="9.00" class="sc-notoserifcjksc">测量。</text><a href="https://arxiv.org/abs/2409.12640" rel="noopener"><rect x="155.25" y="705.00" width="157.50" height="12.75" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="508.68" y="311.60" width="4.40" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="513.08" y="311.60" width="23.47" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="536.55" y="311.60" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="72.00" y="327.22" width="10.69" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="82.69" y="327.22" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="85.58" y="327.22" width="21.59" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="107.18" y="327.22" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="118.18" y="327.22" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/mrcr#how-to-run" rel="noopener"><rect x="118.18" y="327.22" width="11.00" height="11.00" fill="transparent"/></a><a href="https://contextarena.ai/" rel="noopener"><rect x="371.18" y="327.22" width="0.00" height="11.00" fill="transparent"/></a><a href="https://contextarena.ai/" rel="noopener"><
