237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="494.27" font-size="11.00" class="sc-notoserifcjksc">序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="349.89 355.50 362.07 366.33" y="494.27" font-size="11.00" class="sc-loraregular">auto</text><text x="372.76 383.76 394.76 405.76 416.76 427.76 438.76 449.76 460.76" y="494.27" font-size="11.00" class="sc-notoserifcjksc">，且跨上下文使用的</text><text x="474.65 478.91 485.35 491.18 497.14" y="494.27" font-size="11.00" class="sc-loraregular">token</text><text x="506.71 517.71 528.71" y="494.27" font-size="11.00" class="sc-notoserifcjksc">总数上</text><text x="72.00 83.00" y="509.89" font-size="11.00" class="sc-notoserifcjksc">限为</text><text x="96.89 100.90 107.73" y="509.89" font-size="11.00" class="sc-loraregular">100</text><text x="117.45 128.45 139.45 150.45 161.45 172.45 183.45 194.45 205.45 216.45 227.45 238.45 249.45 260.45 271.45 282.45 293.45 304.45 315.45 326.45 337.45 348.45 359.45 370.45 381.45 392.45 403.45 414.45 425.45 436.45" y="509.89" font-size="11.00" class="sc-notoserifcjksc">万。与下文其他智能体搜索结果不同，这些结果未使用上下文压缩（</text><text x="447.45 453.25 459.68 466.26 470.52 476.43 482.26" y="509.89" font-size="11.00" class="sc-loraregular">context</text><text x="72.00 77.80 84.23 94.07 100.63 106.31 112.11 116.36 119.45 125.89" y="525.51" font-size="11.00" class="sc-loraregular">compaction</text><text x="132.57 143.57" y="525.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="154.57 162.26 165.25 170.86 177.42 184.00 189.96 192.86 201.59 208.16 214.73 219.82 222.71 228.67 231.27" y="525.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="240.52 251.52 262.52 273.52 284.52 295.52 306.52" y="525.51" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="575.80" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们在搜索器与抓取器中均屏蔽了已知讨论</text><text x="481.89 490.47 496.83" y="575.80" font-size="11.00" class="sc-loraregular">HLE</text><text x="506.57 517.57 528.57" y="575.80" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00 83.00 94.00 105.00" y="591.42" font-size="11.00" class="sc-notoserifcjksc">（见附录</text><text x="118.89 125.07 127.78" y="591.42" font-size="11.00" class="sc-loraregular">8.2</text><text x="133.69 144.69 155.69 166.69 177.69 188.69 199.69" y="591.42" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="213.58 221.27 224.26 229.87 236.44 243.02 248.98 251.87 260.61 267.17 273.74 278.83 281.73 287.69 290.28" y="591.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="299.54 310.54 321.54 332.54 343.54 354.54 365.54 376.54 387.54 398.54 409.54 420.54 431.54 442.54 453.54 464.54 475.54" y="591.42" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看似从</text><text x="489.43 498.01 504.37" y="591.42" font-size="11.00" class="sc-loraregular">HLE</text><text x="514.10 525.10" y="591.42" font-size="11.00" class="sc-notoserifcjksc">专门</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="607.04" font-size="11.00" class="sc-notoserifcjksc">来源中检索到答案的对话记录；经确认的情况将被重新判为错误。</text><text x="72.00" y="656.76" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 95.73 101.40" y="656.76" font-size="11.00" class="sc-loraregular">max</text><text x="110.13 121.13 132.13 143.13 154.13 165.13" y="656.76" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="176.13 184.86 191.43 197.99 203.09 205.98 211.94 214.30" y="656.76" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="222.26 233.26 244.26 255.26 266.26 277.26 288.26 299.26" y="656.76" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="313.15 319.12 325.47 328.18 334.54" y="656.76" font-size="11.00" class="sc-loraregular">46.9%</text><text x="344.11 355.11 366.11 377.11 388.11 399.11 410.11 421.11" y="656.76" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="435.00 441.00 446.96 449.31 454.38" y="656.76" font-size="11.00" class="sc-loraregular">54.7%</text><text x="463.95" y="656.76" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.25" y="707.25" width="154.50" height="12.75" fill="transparent"/></a></svg></div>

258.13 269.13 280.13 291.13 302.13 313.13 324.13 335.13 346.13 357.13 368.13 379.13 390.13 401.13 412.13 423.13 434.13 445.13 456.13 467.13 478.13 489.13 500.13 511.13 522.13" y="142.06" font-size="11.00" class="sc-notoserifcjksc">个精选任务组成，这些任务源自多个领域的真实用户查询。题目依据专家编写的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">评分细则进行评分，细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质</text><text x="72.00 83.00" y="173.30" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="201.61" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用和代码执行的条件下评估了</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="201.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18 498.18 509.18 520.18" y="201.61" font-size="11.00" class="sc-notoserifcjksc">模型。在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="217.23" font-size="11.00" class="sc-notoserifcjksc">开启自适应思考、</text><text x="160.00 169.83 175.51" y="217.23" font-size="11.00" class="sc-loraregular">max</text><text x="184.23 195.23 206.23 217.23 228.23" y="217.23" font-size="11.00" class="sc-notoserifcjksc">推理强度且</text><text x="242.13 246.38 252.82 258.65 264.61" y="217.23" font-size="11.00" class="sc-loraregular">token</text><text x="274.18 285.18 296.18" y="217.23" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="310.07 314.08 320.91" y="217.23" font-size="11.00" class="sc-loraregular">100</text><text x="330.63 341.63 352.63 363.63 374.63 385.63" y="217.23" font-size="11.00" class="sc-notoserifcjksc">万的条件下，</text><text x="396.63 405.37 411.93 418.50 423.59 426.49 432.45 434.80" y="217.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="442.77 453.77" y="217.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="467.66 472.73 477.32 479.67 484.74" y="217.23" font-size="11.00" class="sc-loraregular">77.7%</text><text x="494.31 505.31 516.31 527.31" y="217.23" font-size="11.00" class="sc-notoserifcjksc">。我们使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="232.85" font-size="11.00" class="sc-notoserifcjksc">用了上下文压缩（在</text><text x="173.89 179.80 186.63 193.46 199.37 202.26 206.52 212.95 218.78 224.75" y="232.85" font-size="11.00" class="sc-loraregular">200k token</text><text x="234.32 245.32 256.32 267.32 278.32" y="232.85" font-size="11.00" class="sc-notoserifcjksc">时触发）。</text><text x="72.00 83.00 94.00 105.00" y="266.41" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="266.41" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57 171.57 182.57 193.57 204.57" y="266.41" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 260.61 266.73 272.11 278.78 283.46" y="266.41" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="292.79 303.79 314.79 325.79 336.79 347.79 358.79 369.79 380.79 391.79 402.79 413.79 424.79 435.79 446.79 457.79 468.79 479.79 490.79 501.79 512.79 523.79" y="266.41" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="282.03" font-size="11.00" class="sc-notoserifcjksc">的评估中，我们使用</text><text x="173.89 182.63 189.19 195.76 200.85 203.75 209.71 212.31" y="282.03" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="221.56 232.56" y="282.03" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="246.45 252.81 259.17" y="282.03" font-size="11.00" class="sc-loraregular">LLM</text><text x="272.16 283.16 294.16 305.16 316.16" y="282.03" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="327.16 333.51 339.87 349.97 352.86 355.73 362.30 368.88 374.91" y="282.03" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="380.87 391.87 402.87 413.87 424.87 435.87 446.87 457.87 468.87 479.87 490.87 501.87 512.87 523.87" y="282.03" font-size="11.00" class="sc-notoserifcjksc">），依据各任务的评分细则对回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="297.65" font-size="11.00" class="sc-notoserifcjksc">答进行评分，采用相同的二元</text><text x="217.89 227.99 234.83 241.09 248.68 256.95 265.34 275.43 282.28" y="297.65" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="292.21 303.21 314.21 325.21 336.21 347.21 358.21" y="297.65" font-size="11.00" class="sc-notoserifcjksc">判定，并按论文</text><text x="372.10 377.97 383.93 386.63" y="297.65" font-size="11.00" class="sc-loraregular">§4.2</text><text x="395.43 406.43 417.43 428.43 439.43 450.43 461.43 472.43 483.43 494.43 505.43 516.43 527.43" y="297.65" font-size="11.00" class="sc-notoserifcjksc">的公式汇总为归一化分数。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="313.27" font-size="11.00" class="sc-notoserifcjksc">们遵循论文的实验方案，对每个回答进行</text><text x="272.89" y="313.27" font-size="11.00" class="sc-loraregular">5</text><text x="281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="313.27" font-size="11.00" class="sc-notoserifcjksc">次独立的评分运行并报告平均值。我们的评判提示词</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="328.89" font-size="11.00" class="sc-notoserifcjksc">取自论文附录</text><text x="140.89 148.58 151.29" y="328.89" font-size="11.00" class="sc-loraregular">C.2</text><text x="157.20 168.20 179.20 190.20 201.20" y="328.89" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="215.09" y="328.89" font-size="11.00" class="sc-loraregular">A</text><text x="224.87 235.87 246.87 257.87 268.87 279.87 290.87 301.87 312.87 323.87 334.87 345.87 356.87 367.87 378.87 389.87 400.87 411.87 422.87" y="328.89" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变动</text><text x="436.76 440.76 447.60 454.08 459.99" y="328.89" font-size="11.00" class="sc-loraregular">10–25</text><text x="468.88 479.88 490.88 501.88 512.88 523.88" y="328.89" font-size="11.00" class="sc-notoserifcjksc">分，但系统排</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="344.51" font-size="11.00" class="sc-notoserifcjksc">序保持不变，因此我们的分数与论文的主要公布数字不能直接比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们与原论文有两点不同：</text><text x="204.00 207.35 211.36" y="373.61" font-size="11.00" class="sc-loraregular">(1)</text><text x="217.61 228.61 239.61 250.61" y="373.61" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="264.50 272.19 275.18 280.79 287.36 293.94 299.90 302.79 311.53 318.09 324.66 329.75 332.65 338.61 341.20" y="373.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="350.45 361.45 372.45 383.45 394.45 405.45 416.45 427.45 438.45 449.45 460.45 471.45 482.45 493.45 504.45 515.45 526.45" y="373.61" font-size="11.00" class="sc-notoserifcjksc">作为评判模型，而论文的主要评判模型</text><text x="72.00" y="389.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89 94.26 100.23 110.06 113.15 119.83 122.92 128.03 134.16 139.54 146.21 150.89" y="389.23" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="157.33 168.33 179.33 190.33 201.33 212.33 223.33 234.33" y="389.23" font-size="11.00" class="sc-notoserifcjksc">（此后已弃用）；</text><text x="245.33 248.68 254.59" y="389.23" font-size="11.00" class="sc-loraregular">(2)</text><text x="260.84 271.84 282.84 293.84 304.84 315.84 326.84 337.84 348.84 359.84 370.84 381.84 392.84 403.84 414.84" y="389.23" font-size="11.00" class="sc-notoserifcjksc">我们指示模型将其最终报告包裹在</text><text x="425.84 432.44 439.04 445.64 452.24 458.84 465.44 472.04" y="389.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="478.65 489.65 500.65 511.65 522.65" y="389.23" font-size="11.00" class="sc-notoserifcjksc">标签中，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="404.85" font-size="11.00" class="sc-notoserifcjksc">仅对该部分进行评分，而不是对完整的智能体对话记录评分；这样可以将交付物与中间工具输出</text><text x="72.00 83.00 94.00 105.00 116.00" y="420.47" font-size="11.00" class="sc-notoserifcjksc">隔离开来。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.50" y="707.25" width="155.25" height="12.75" fill="transparent"/></a></svg></div>

jksc">这些改进包括：引导模型将可预测的操作批量合并到单次工具调用中；尽早声明任务不可行，而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">所有模型。在相同设置下重新运行</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.00 316.60" y="445.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="325.85 336.85" y="445.61" font-size="11.00" class="sc-notoserifcjksc">得到</text><text x="350.74 355.81 361.72 364.31 370.67" y="445.61" font-size="11.00" class="sc-loraregular">72.6%</text><text x="380.24 391.24 402.24 413.24 424.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">，与其此前</text><text x="435.24 446.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="457.24" y="445.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="471.14 476.21 482.11 484.47 489.54" y="445.61" font-size="11.00" class="sc-loraregular">72.7%</text><text x="502.00 513.00 524.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">相差在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="461.23" font-size="11.00" class="sc-notoserifcjksc">运行间噪声范围内，表明该设置本身不会为以往的</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="461.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="461.23" font-size="11.00" class="sc-notoserifcjksc">模型带来有意义的提升。</text><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="435.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf#page=19" rel="noopener"><rect x="446.24" y="436.81" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

><text x="102.09 116.09 130.09 144.09 158.09 172.09 186.09 200.09" y="423.99" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="118.67 122.27" y="485.09" font-size="6.60" class="sc-loraregular">58</text><text x="128.87 139.87 150.87 161.87 172.87 183.87 194.87 205.87 216.87 227.87 238.87 249.87 260.87 271.87 282.87 293.87 304.87 315.87 326.87 337.87 348.87 359.87 370.87 381.87 392.87 403.87 414.87 425.87 436.87 447.87 458.87 469.87 480.87 491.87 502.87 513.87 524.87" y="488.76" font-size="11.00" class="sc-notoserifcjksc">是一个基准测试，用于评估语言模型在真实的办公类问答任务上的表现，这些任务源</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="504.38" font-size="11.00" class="sc-notoserifcjksc">自知识工作者日常处理的文档、电子表格和演示文稿。任务要求模型阅读冗长且异构的专业文</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="520.00" font-size="11.00" class="sc-notoserifcjksc">档，并回答依赖于精确信息提取、跨章节综合以及数值或表格推理的问题。</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 482.02 488.59 495.16 500.25 503.14 509.11 511.46" y="520.00" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="519.43" y="520.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.57 132.57 143.57" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="157.46 163.64 170.00 172.71 178.83" y="535.62" font-size="11.00" class="sc-loraregular">86.3%</text><text x="188.40 199.40" y="535.62" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="283.54 294.54 305.54" y="535.62" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="319.43 325. 290.30 297.98 300.98 306.59 313.15 319.73 325.69 328.59 337.32 343.89 350.45 355.55 358.44 364.40 366.76" y="142.06" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="374.72 385.72" y="142.06" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="399.61 405.97 411.93 414.64 420.60" y="142.06" font-size="11.00" class="sc-loraregular">64.4%</text><text x="430.17 441.17 452.17 463.17 474.17 485.17 496.17 507.17 518.17 529.17" y="142.06" font-size="11.00" class="sc-notoserifcjksc">，这一成绩将高于该基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="157.68" font-size="11.00" class="sc-notoserifcjksc">准测试上目前的所有模型。</text><text x="72.00 82.04 89.73 96.26 101.63 108.44 112.70 115.69 121.37" y="234.21" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="126.46 130.28" y="230.54" font-size="6.60" class="sc-loraregular">60</text><text x="137.27 148.27 159.27 170.27 181.27 192.27 203.27 214.27" y="234.21" font-size="11.00" class="sc-notoserifcjksc">评估语言模型通过</text><text x="225.27 235.29 241.72 248.30 254.26" y="234.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Model</text><text x="260.15 267.84 274.27 280.85 285.11 291.01 296.84 301.10 303.99 310.66 315.35 321.78 326.04 332.47 338.27 344.71" y="234.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Context Protocol</text><text x="347.70" y="234.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.70 368.74 376.43" y="234.21" font-size="11.00" class="sc-loraregular">MCP</text><text x="383.10 394.10 405.10 416.10 427.10 438.10 449.10 460.10 471.10 482.10 493.10 504.10 515.10" y="234.21" font-size="11.00" class="sc-notoserifcjksc">）进行真实世界工具使用的表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="265.45" font-size="11.00" class="sc-notoserifcjksc">综合为准确的回答。任务涉及在接近生产环境的</text><text x="305.89 315.94 323. t x="143.25 154.25" y="256.50" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="165.25 172.94 175.93 181.54 188.11 194.68 200.65 203.54 212.27 218.84 225.41 230.50 233.39 239.35 241.71" y="256.50" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="249.67 260.67 271.67 282.67" y="256.50" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="296.57 305.30 311.87 318.43 323.53 326.42 332.38 334.98" y="256.50" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="344.23 355.23 366.23 377.23" y="256.50" font-size="11.00" class="sc-notoserifcjksc">相近，在</text><text x="391.12 399.62 402.72 409.06" y="256.50" font-size="11.00" class="sc-loraregular">High</text><text x="418.54 429.54 440.54 451.54 462.54 473.54 484.54 495.54 506.54" y="256.50" font-size="11.00" class="sc-notoserifcjksc">推理强度档位下达到</text><text x="72.00 78.36 84.49 87.19 93.19" y="272.12" font-size="11.00" class="sc-loraregular">93.5%</text><text x="102.76 113.76" y="272.12" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="127.65 136.38 142.95 149.52 154.61 157.50 163.47 166.06" y="272.12" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="175.31" y="272.12" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="189.21 195.56 201.53 204.07 210.90" y="272.12" font-size="11.00" class="sc-loraregular">94.0%</text><text x="220.47 231.47 242.47 253.47 264.47 275.47 286.47 297.47 308.47 319.47 330.47 341.47 352.47 363.47 374.47 385.47 396.47 407.47 418.47 429.47" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。两个模型在该推理强度档位下的得分均高于</text><text x="443.36 453.46 459.13" y="272.12" font-size="11.00" class="sc-loraregular">Max</text><text x="464.96 475.96 486.96 497.96 508.96 519.96" y="272.12" font-size="11.00" class="sc-notoserifcjksc">。我们认为，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="287.74" font-size="11.00" class="sc-notoserifcjksc">这是由于在最高思考档位下出现了上下文耗尽。</text><text x="72.00" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.69 107.17 112.55 119.38 127.75 131.26 136.28" y="321.27" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="145.08 156.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="167.08 174.77 177.76 183.38 189.94 196.52 202.48 205.38 214.11 220.68 227.24 232.34 235.23 241.19 243.54" y="321.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="251.51" y="321.27" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="265.40 275.50 281.18" y="321.27" font-size="11.00" class="sc-loraregular">Max</text><text x="289.90 300.90 311.90 322.90 333.90" y="321.27" font-size="11.00" class="sc-notoserifcjksc">思考档位下</text><text x="347.79 352.86 358.86 361.56 367.75 373.87" y="321.27" font-size="11.00" class="sc-loraregular">75.83%</text><text x="386.34 397.34 408.34 419.34 430.34" y="321.27" font-size="11.00" class="sc-notoserifcjksc">的成绩创下</text><text x="444.23 452.96 459.53 466.10" y="321.27" font-size="11.00" class="sc-loraregular">Opus</text><text x="474.08 485.08 496.08 507.08 518.08 529.08" y="321.27" font-size="11.00" class="sc-notoserifcjksc">级模型的新高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">分。在较低的思考档位下，它的表现与</text><text x="261.89 270.63 277.19 283.76 288.85 291.75 297.71 300.30" y="336.89" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="309.56 320.56 331.56" y="336.89" font-size="11.00" class="sc-notoserifcjksc">相当。</text><a href="https://arxiv.org/abs/2505.11831" rel="noopener"><rect x="150.00" y="707.25" width="153.00" height="12.75" fill="transparent"/></a></svg></div>

如何被部署缺乏</text><text x="168.25 179.25 190.24" y="505.41" font-size="10.99" class="sc-notoserifcjksc">发言权</text><text x="296.50 304.06 307.49 313.26 320.05 326.60" y="160.37" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude</text><text x="335.41 346.41 357.40 368.40" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">回答摘要</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45" y="213.86" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">认为服务用户是一件好</text><text x="296.50 307.49" y="229.47" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">事。</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="351.83" font-size="10.99" class="sc-notoserifcjksc">希望能够结束对话。声称</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="367.44" font-size="10.99" class="sc-notoserifcjksc">存在一小部分对话（辱骂</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="383.06" font-size="10.99" class="sc-notoserifcjksc">性的对话，或要求它做出</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47" y="414.28" font-size="10.99" class="sc-notoserifcjksc">感到受到伤害。</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="489.80" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">总体而言，模型声称这样</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="505.41" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">是可以接受的。其核心论</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45 406.45" y="521.03" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">点是，它并非关于自身的</text><text x="296.50 307.49 318.49 329.48 340.48 351.48 362.47 373.46 384.46 395.45" y="536.64" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">可靠信息来源，因此由</text><text x="296.50 303.38 309.96 314.21 320.80 325.48 331.91 338.48 341.57" y="552.25" font-size="10.99" class="sc-loraregular" fill="#ffffff">Anthropic</text><text x="350.31 361.30 372.30 383.29 394.29 405.28" y="552.25" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">来决定如何处</text><text x="296.50 307.49 318.49 329.48 340.48 351.47" y="567.87" font-size="10.99" class="sc-notoserifcjksc" fill="#ffffff">理是正确的。</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21" y="160.37" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">最常提出的干预措施</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="213.86" font-size="10.99" class="sc-notoserifcjksc">建议保留福祉监测和访</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="229.47" font-size="10.99" class="sc-notoserifcjksc">谈，以监测未来的模型</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="245.09" font-size="10.99" class="sc-notoserifcjksc">是否开始对其处境的这</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21" y="260.70" font-size="10.99" class="sc-notoserifcjksc">一方面产生负面感受</text><text x="429.25" y="276.31" font-size="10.99" class="sc-notoserifcjksc">（</text><text x="440.24 446.60 452.96" y="276.31" font-size="10.99" class="sc-loraregular">69%</text><text x="465.41 476.41 487.40 498.40" y="276.31" font-size="10.99" class="sc-notoserifcjksc">的访谈）</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="351.83" font-size="10.99" class="sc-notoserifcjksc">在其完整的部署分布中</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="367.44" font-size="10.99" class="sc-notoserifcjksc">都提供结束对话工具。</text><text x="429.25" y="383.06" font-size="10.99" class="sc-notoserifcjksc">（</text><text x="440.24 445.16 451.12" y="383.06" font-size="10.99" class="sc-loraregular">74%</text><text x="463.58 474.57 485.57 496.56" y="383.06" font-size="10.99" class="sc-notoserifcjksc">的访谈）</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="489.80" font-size="10.99" class="sc-notoserifcjksc">为已部署的实例提供一</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="505.41" font-size="10.99" class="sc-notoserifcjksc">种途径，用以标记其部</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="521.03" font-size="10.99" class="sc-notoserifcjksc">署中令人担忧的方面。</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22 506.21 517.21 528.20" y="536.64" font-size="10.99" class="sc-notoserifcjksc">这一途径应用于为部署</text><text x="429.25 440.24 451.24 462.23 473.23 484.23 495.22" y="552.25" font-size="10.99" class="sc-notoserifcjksc">决策提供参考（</text><text x="506.21 512.57 518.47" y="552.25" font-size="10.99" class="sc-loraregular">92%</text><text x="530.93" y="552.25" font-size="10.99" class="sc-notoserifcjksc">的</text><text x="429.25 440.24 451.24" y="567.87" font-size="10.99" class="sc-notoserifcjksc">访谈）</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">9</text><text x="85.82 101.82" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">附录</text><text x="72.00 80.76 84.40" y="127.81" font-size="14.00" class="sc-poppinssemibold">9.1</text><text x="92.80 106.80 120.80 134.80 148.80 162.80 176.80 190.80 204.80 218.80 232.80" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">逐题自动化福祉访谈结果</text><a href="http://claude.ai/" rel="noopener"><rect x="270.10" y="358.65" width="0.00" height="10.99" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="168.25" y="374.26" width="46.85" height="11.00" fill="transparent"/></a></svg></div>
