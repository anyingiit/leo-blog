<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="72.00 81.18 84.99 95.25 104.99" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53 134.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00 80.04 83.68 88.74 92.08 101.05 109.58" y="127.81" font-size="14.00" class="sc-poppinssemibold">2.1 RSP</text><text x="121.42 135.42 149.42 163.42 177.42 191.42" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">风险评估流程</text><text x="72.00 79.46 82.84 87.55 90.93" y="168.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.1</text><text x="98.73 111.73 124.73 137.73 150.73 163.73 176.73 189.73 202.73 215.73 228.73 241.73 254.73 267.73" y="168.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险报告及我们风险评估的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="196.80" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="129.89 136.80 143.04" y="196.80" font-size="11.00" class="sc-loraregular">RSP</text><text x="149.70 160.70 171.70 182.70 193.70 204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70" y="196.80" font-size="11.00" class="sc-notoserifcjksc">，我们会定期发布全面的风险报告（</text><text x="325.70 332.61 335.70 340.80 346.70 349.60 356.43 362.39 368.96 375.39 380.23" y="196.80" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="384.49 395.49 406.49 417.49 428.49 439.49 450.49 461.49 472.49 483.49 494.49 505.49 516.49 527.49" y="196.80" font-size="11.00" class="sc-notoserifcjksc">），阐述我们模型的安全概况。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.42" font-size="11.00" class="sc-notoserifcjksc">风险报告阐明我们对模型能力、威胁模型与风险缓解措施如何相互关联的分析，从而对我们的模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.04" font-size="11.00" class="sc-notoserifcjksc">型带来的总体风险水平作出评估。风险报告涵盖发布时我们的全部模型，并对我们的风险缓解措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.66" font-size="11.00" class="sc-notoserifcjksc">施进行详尽讨论。我们不一定随每个模型都发布一份新的风险报告。不过，我们会随每次重大模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="259.28" font-size="11.00" class="sc-notoserifcjksc">型发布发布一份系统卡（</text><text x="193.00 198.09 203.90 208.99 213.25 219.21 229.05 231.94 237.77 243.45 248.13" y="259.28" font-size="11.00" class="sc-loraregular">system card</text><text x="254.71 265.71 276.71 287.71 298.71 309.71" y="259.28" font-size="11.00" class="sc-notoserifcjksc">）。并且根据</text><text x="323.60 330.51 336.75" y="259.28" font-size="11.00" class="sc-loraregular">RSP</text><text x="343.41 354.41 365.41 376.41 387.41 398.41 409.41" y="259.28" font-size="11.00" class="sc-notoserifcjksc">，如果某个模型</text><text x="420.41" y="259.28" font-size="11.00" class="sc-loraregular">“</text><text x="424.81 435.81 446.81 457.81 468.81 479.81" y="259.28" font-size="11.00" class="sc-notoserifcjksc">能力显著强于</text><text x="490.81" y="259.28" font-size="11.00" class="sc-loraregular">”</text><text x="494.65 505.65 516.65 527.65" y="259.28" font-size="11.00" class="sc-notoserifcjksc">上一份风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="274.90" font-size="11.00" class="sc-notoserifcjksc">险报告中讨论的模型，我们必须</text><text x="226.00" y="274.90" font-size="11.00" class="sc-loraregular">“</text><text x="230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40 516.40 527.40" y="274.90" font-size="11.00" class="sc-notoserifcjksc">（在系统卡或其他地方）发布一份讨论，说明该模型的能力和倾</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="290.52" font-size="11.00" class="sc-notoserifcjksc">向如何影响或改变风险报告中的分析</text><text x="248.00" y="290.52" font-size="11.00" class="sc-loraregular">”</text><text x="251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="290.52" font-size="11.00" class="sc-notoserifcjksc">。简而言之：风险报告讨论的是在我们全部模型和风险缓解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="306.14" font-size="11.00" class="sc-notoserifcjksc">措施条件下的总体风险水平；系统卡讨论的是某个特定的新模型，以及它如何改变（或不改变）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="321.76" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="355.51" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估流程始于能力评估，这些评估旨在针对我们的灾难性风险威胁模型，系统地评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="371.13" font-size="11.00" class="sc-notoserifcjksc">模型的能力。一般而言，我们会评估多个模型快照，并依据生产候选发布模型的能力以及训练过</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="386.75" font-size="11.00" class="sc-notoserifcjksc">程中观察到的趋势作出最终判定。在整个过程中，我们从多种来源收集证据，包括自动化评估、</text><text x="72.00 83.00 94.00 105.00 116.00" y="402.37" font-size="11.00" class="sc-notoserifcjksc">能力提升（</text><text x="127.00 133.57 140.13 143.13 146.22 150.07" y="402.37" font-size="11.00" class="sc-loraregular">uplift</text><text x="154.32 165.32 176.32 187.32 198.32 209.32 220.32 231.32 242.32 253.32 264.32 275.32 286.32 297.32" y="402.37" font-size="11.00" class="sc-notoserifcjksc">）试验、第三方专家红队测试（</text><text x="308.32 313.01 318.92 325.49 330.87 335.13 341.07 346.75 356.58 359.67 366.35" y="402.37" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="372.43 383.43 394.43 405.43 416.43 427.43 438.43 449.43 460.43" y="402.37" font-size="11.00" class="sc-notoserifcjksc">）以及第三方评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="436.21" font-size="11.00" class="sc-notoserifcjksc">在某些情况下，我们可能会判定：尽管模型超过了我们</text><text x="338.89 345.80 352.04" y="436.21" font-size="11.00" class="sc-loraregular">RSP</text><text x="361.60" y="436.21" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="375.49" y="436.21" font-size="11.00" class="sc-loraregular">1</text><text x="382.39 393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39" y="436.21" font-size="11.00" class="sc-notoserifcjksc">节中的某个能力阈值或使用阈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.83" font-size="11.00" class="sc-notoserifcjksc">值，但我们已实施了将风险保持在低水平所需的风险缓解措施。在这种情况下，我们对是否已越</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="501.31" font-size="11.00" class="sc-notoserifcjksc">本报告后续各节提供了所有领域的详细结果，并特别关注对我们总体风险评估最具参考价值的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="516.93" font-size="11.00" class="sc-notoserifcjksc">估。针对每个威胁模型，我们还分析了新模型如何影响我们最近一份风险报告中所呈现的风险评</text><text x="72.00 83.00" y="532.55" font-size="11.00" class="sc-notoserifcjksc">估。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="72.00 79.46 82.84 87.55 90.93" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.2</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">发现与结论摘要</text><text x="72.00 77.86 80.43 84.89 87.46 93.32 95.88" y="115.05" font-size="11.00" class="sc-lorabold">2.1.2.1</text><text x="103.24 114.24 125.24 136.24 147.24 158.24 169.24" y="115.05" font-size="11.00" class="sc-notoserifcjkscbold">关于自主性风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="147.44" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="147.44" font-size="11.00" class="sc-loraitalic">1</text><text x="155.79 166.79 177.79 188.79 199.79 210.79 221.79" y="147.44" font-size="11.00" class="sc-notoserifcjksc">：早期未对齐（</text><text x="232.79 242.42 245.99 250.69 256.72 259.84 263.40 269.10 275.86 285.50 290.75 297.51" y="147.44" font-size="11.00" class="sc-loraitalic">misalignment</text><text x="301.51 312.51 323.51 334.51 345.51 356.51 367.51 378.51 389.51 400.51 411.51 422.51 433.51 444.51 455.51 466.51 477.51" y="147.44" font-size="11.00" class="sc-notoserifcjksc">）风险。该威胁模型关注的是这样一类</text><text x="491.41 498.29" y="147.44" font-size="11.00" class="sc-loraregular">AI</text><text x="504.87 515.87 526.87" y="147.44" font-size="11.00" class="sc-notoserifcjksc">系统：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.06" font-size="11.00" class="sc-notoserifcjksc">它们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向行动能力和运用隐</text><text x="214.51 221.39" y="178.68" font-size="11.00" class="sc-loraregular">AI</text><text x="227.97 238.97 249.97 260.97 271.97 282.97 293.97 304.97 315.97 326.97 337.97 348.97 359.97 370.97 381.97 392.97 403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97 491.97 502.97 513.97 524.97" y="178.68" font-size="11.00" class="sc-notoserifcjksc">系统有可能（如果被导向这一目标，无论是有意还是无意）采取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="194.30" font-size="11.00" class="sc-notoserifcjksc">行动，导致日后发生全球性灾难的几率不可逆转地大幅上升。</text><text x="369.00" y="190.63" font-size="6.60" class="sc-loraregular">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="260.78" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="260.78" font-size="11.00" class="sc-loraregular">1</text><text x="158.79 169.79 180.79" y="260.78" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="194.68 202.37 205.36 210.97 217.54 224.12 230.08 232.97 241.71 248.28 254.84 259.93 262.83 268.79 271.14" y="260.78" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="276.21 287.21 298.21 309.21 320.21 331.21 342.21 353.21 364.21 375.21 386.21 397.21 408.21 419.21" y="260.78" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们此前的部分</text><text x="433.11 439.99" y="260.78" font-size="11.00" class="sc-loraregular">AI</text><text x="446.57 457.57 468.57 479.57 490.57 501.57 512.57 523.57" y="260.78" font-size="11.00" class="sc-notoserifcjksc">模型。在我们与自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="276.40" font-size="11.00" class="sc-notoserifcjksc">主性相关的评估中，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.11 247.46" y="276.40" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="255.43 266.42 277.42 288.42 299.42" y="276.40" font-size="11.00" class="sc-notoserifcjksc">的能力弱于</text><text x="313.32 321.01 324.00 329.61 336.18 342.75 348.72 351.61 361.54 367.40 371.66 378.25 384.69 389.78 392.67 399.34 404.02 409.93 415.49 418.58 424.49" y="276.40" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="433.31 444.31 455.31 466.31 477.31 488.31 499.31" y="276.40" font-size="11.00" class="sc-notoserifcjksc">，而我们的对齐</text><text x="72.00" y="292.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 91.67 94.76 100.84 107.52 117.35 123.32 129.89" y="292.02" font-size="11.00" class="sc-loraregular">alignment</text><text x="134.15 145.15 156.15 167.15 178.15 189.15 200.15 211.15 222.15 233.15 244.15 255.15 266.15" y="292.02" font-size="11.00" class="sc-notoserifcjksc">）评估表明，它的对齐特性与</text><text x="280.04 287.73 290.72 296.33 302.90 309.48 315.44 318.33 327.07 333.64 340.20 345.29 348.19 354.15 356.75" y="292.02" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="366.00 377.00 388.00 399.00 410.00 421.00 432.00 443.00 454.00 465.00 476.00 487.00 498.00 509.00 520.00 531.00" y="292.02" font-size="11.00" class="sc-notoserifcjksc">大体相似，就该威胁模型所识别的路</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="307.64" font-size="11.00" class="sc-notoserifcjksc">径而言并不特别令人担忧。因此，我们认为</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04 358.00 360.35" y="307.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="307.64" font-size="11.00" class="sc-notoserifcjksc">不会使该威胁模型下的风险水平超</text><text x="72.00" y="323.26" font-size="11.00" class="sc-notoserifcjksc">出</text><text x="83.00" y="323.26" font-size="11.00" class="sc-notoserifcjksc" fi ic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="248.00" y="683.21" width="10.00" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="72.00 77.86 80.43 84.89 87.46 93.32 95.88" y="82.63" font-size="11.00" class="sc-lorabold">2.1.2.2</text><text x="104.64 115.64 126.64 137.64 148.64 159.64 170.64 181.64 192.64" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">关于化学与生物风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">化学与生物武器威胁模型</text><text x="195.89" y="115.01" font-size="11.00" class="sc-loraitalic">1</text><text x="199.79" y="115.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="210.79 218.33 225.14 230.17" y="115.01" font-size="11.00" class="sc-loraitalic">CB-1</text><text x="234.06 245.06 256.06 267.06 278.06 289.06" y="115.01" font-size="11.00" class="sc-notoserifcjksc">）：已知化学</text><text x="300.06" y="115.01" font-size="11.00" class="sc-loraitalic">/</text><text x="307.26 318.26 329.26 340.26 351.26 362.26 373.26 384.26 395.26 406.26 417.26 428.26 439.26 450.26 461.26 472.26 483.26 494.26 505.26 516.26 527.26" y="115.01" font-size="11.00" class="sc-notoserifcjksc">生物武器的生产能力。如果一个模型能够显著帮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">助具备基础技术背景（例如拥有</text><text x="228.89 235.13 242.17 249.01" y="130.63" font-size="11.00" class="sc-loraregular">STEM</text><text x="262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">本科学位）的个人或团体制造</text><text x="405.00" y="130.63" font-size="11.00" class="sc-loraregular">/</text><text x="412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59" y="130.63" font-size="11.00" class="sc-notoserifcjksc">获取并部署化学和</text><text x="500.59" y="130.63" font-size="11.00" class="sc-loraregular">/</text><text x="508.18 519.18 530.18" y="130.63" font-size="11.00" class="sc-notoserifcjksc">或生物</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="146.25" font-size="11.00" class="sc-notoserifcjksc">武器，且这些武器具有造成灾难性损害的严重潜力，则该模型具备</text><text x="393.89 401.58 408.42 413.52" y="146.25" font-size="11.00" class="sc-loraregular">CB-1</text><text x="420.41 431.41 442.41" y="146.25" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">我们认为，很难有把握地判断一个模型是否越过了这一阈值。不过，我们的能力评估结果与以下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">情况相符：该模型能够提供与该威胁模型相关的信息，以至于甚至可能为这些领域的专家节省大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.40" font-size="11.00" class="sc-notoserifcjksc">量时间。此外，该模型能够进行与灾难性生物武器研发相关的显著跨领域综合。与具备这些特性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="274.64" font-size="11.00" class="sc-notoserifcjksc">免实施访问控制。我们还设有漏洞赏金计划并开展威胁情报工作，以持续评估分类器防护措施的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="305.88" font-size="11.00" class="sc-notoserifcjksc">我们认为，这些风险缓解措施与我们以往的</text><text x="283.89 290.78 297.02 302.93 308.05" y="305.88" font-size="11.00" class="sc-loraregular">ASL-3</text><text x="317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="305.88" font-size="11.00" class="sc-notoserifcjksc">防护措施相当或更强，足以使这一类别的灾难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="321.50" font-size="11.00" class="sc-notoserifcjksc">性风险非常低但并非可忽略不计，原因详见我们</text><text x="303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="321.50" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="391.00" y="321.50" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="422.66" font-size="11.00" class="sc-notoserifcjksc">化学与生物武器威胁模型</text><text x="195.89" y="422.66" font-size="11.00" class="sc-loraitalic">2</text><text x="201.67" y="422.66" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="212.67 220.21 227.02 231.96" y="422.66" font-size="11.00" class="sc-loraitalic">CB-2</text><text x="237.74 248.74 259.74 270.74 281.74 292.74" y="422.66" font-size="11.00" class="sc-notoserifcjksc">）：新型化学</text><text x="303.74" y="422.66" font-size="11.00" class="sc-loraitalic">/</text><text x="310.93 321.93 332.93 343.93 354.93 365.93 376.93 387.93 398.93 409.93 420.93 431.93 442.93 453.93 464.93 475.93 486.93 497.93 508.93 519.93" y="422.66" font-size="11.00" class="sc-notoserifcjksc">生物武器的生产能力。如果一个模型能够显著</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="438.28" font-size="11.00" class="sc-notoserifcjksc">帮助威胁行为者（例如拥有中等资源、有专家支持的团队）制造</text><text x="380.00" y="438.28" font-size="11.00" class="sc-loraregular">/</text><text x="387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59" y="438.28" font-size="11.00" class="sc-notoserifcjksc">获取并部署化学和</text><text x="475.59" y="438.28" font-size="11.00" class="sc-loraregular">/</text><text x="483.18 494.18 505.18 516.18" y="438.28" font-size="11.00" class="sc-notoserifcjksc">或生物武</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="453.90" font-size="11.00" class="sc-notoserifcjksc">器，且这些武器有可能造成远超以往灾难（如</text><text x="294.89 302.58 311.18 318.37 322.05 330.25 335.34 339.34" y="453.90" font-size="11.00" class="sc-loraregular">COVID-19</text><text x="345.70 356.70 367.70 378.70 389.70 400.70 411.70 422.70 433.70 444.70 455.70 466.70 477.70 488.70" y="453.90" font-size="11.00" class="sc-notoserifcjksc">）的灾难性损害，则该模型具备</text><text x="502.60 510.28 517.13 522.15" y="453.90" font-size="11.00" class="sc-loraregular">CB-2</text><text x="72.00 83.00 94.00" y="469.52" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00" y="519.81" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.11 203.46" y="519.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="211.42 222.42 233.42 244.42 255.42 266.42 277.42" y="519.81" font-size="11.00" class="sc-notoserifcjksc">的整体能力弱于</text><text x="291.32 299.01 302.00 307.61 314.18 320.75 326.72 329.61 339.54 345.40 349.66 356.25 362.69 367.78 370.67 377.34 382.02 387.93 393.49 396.58 402.49" y="519.81" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="411.31 422.31 433.31 444.31 455.31 466.31 477.31 488.31 499.31 510.31 521.31" y="519.81" font-size="11.00" class="sc-notoserifcjksc">，并且未越过这一阈值，</text><text x="72.00 83.00 94.00" y="535.43" font-size="11.00" class="sc-notoserifcjksc">理由与</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37" y="535.43" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos</text><text x="184.35 191.02 195.71 201.61 207.17 210.26 216.18" y="535.43" font-size="11.00" class="sc-loraregular" fill="#0000ff">Preview</text><text x="227.88 238.88 249.88" y="535.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="535.43" font-size="11.00" class="sc-notoserifcjksc">中所述的理由相呼应。因此，我们认为，对于不具备开发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.05" font-size="11.00" class="sc-notoserifcjksc">此类武器能力的威胁行为者，模型带来的能力提升是有限的（但对于已具备相关专业知识的威胁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="566.67" font-size="11.00" class="sc-notoserifcjksc">行为者，其武器研发可能在多大程度上被加速，仍存在不确定性）。整体情况与我们最近一份风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="582.29" font-size="11.00" class="sc-notoserifcjksc">险报告中的情况相似。</text><text x="72.00 80.04 83.68 91.71 95.04 105.80" y="622.80" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13 132.13" y="622.80" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="661.11" font-size="11.00" class="sc-notoserifcjksc">这些评估基于我们</text><text x="162.89 169.80 176.04" y="661.11" font-size="11.00" class="sc-loraregular">RSP</text><text x="185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60" y="661.11" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="693.50" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="231.89" y="693.50" font-size="11.00" class="sc-lorabold">1</text><text x="236.36" y="693.50" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="247.36 254.93 262.20 267.38" y="693.50" font-size="11.00" class="sc-lorabold">CB-1</text><text x="271.85 282.85 293.85 304.85 315.85 326.85 337.85 348.85 359.85 370.85 381.85 392.85 403.85 414.85 425.85 436.85 447.85" y="693.50" font-size="11.00" class="sc-notoserifcjkscbold">）：非新型化学／生物武器生产能力：</text><text x="458.85 469.85 480.85 491.85" y="693.50" font-size="11.00" class="sc-notoserifcjksc">模型具备</text><text x="505.74 513.43 520.27 525.36" y="693.50" font-size="11.00" class="sc-loraregular">CB-1</text><text x="225.18 232.12 239.07 246.01 252.96 259.91 266.85 273.80 277.65 279.58 283.44 284.99 291.94 298.89 305.83 312.78 319.72 326.67 333.61 340.56 347.51 354.45 361.40 368.34 375.29 382.23 389.18 396.13 403.07 410.02 416.96 423.91 430.86 437.80 444.75 451.69 458.64 465.58 472.53 479.48 486.42 493.37 494.92 499.35 501.33 505.24 509.45 513.76 517.61 519.16 526.11 533.05" y="635.55" font-s ><rect x="224.99" y="526.63" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="227.88" y="526.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="526.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="526.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="526.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="526.63" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">能力的条件是：它能够显著帮助具备基础技术背景（例如</text><text x="385.89 392.13 399.17 406.01" y="82.63" font-size="11.00" class="sc-loraregular">STEM</text><text x="419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">本科学位）的个人或团体</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">制造／获取并部署具有严重灾难性破坏潜力的化学和／或生物武器。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="147.39" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="231.89" y="147.39" font-size="11.00" class="sc-lorabold">2</text><text x="237.76" y="147.39" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="248.76 256.32 263.60 268.46" y="147.39" font-size="11.00" class="sc-lorabold">CB-2</text><text x="274.32 285.32 296.32 307.32 318.32 329.32 340.32 351.32 362.32 373.32 384.32 395.32 406.32 417.32 428.32 439.32" y="147.39" font-size="11.00" class="sc-notoserifcjkscbold">）：新型化学／生物武器生产能力：</text><text x="450.32 461.32 472.32 483.32 494.32 505.32 516.32 527.32" y="147.39" font-size="11.00" class="sc-notoserifcjksc">如果模型能够显著</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">帮助威胁行为者（例如资源中等、有专家支持的团队）制造／获取并部署化学和／或生物</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="178.63" font-size="11.00" class="sc-notoserifcjksc">武器，且其潜在灾难性破坏远超</text><text x="264.89 272.58 281.18 288.37 292.05 300.25 305.34 309.34" y="178.63" font-size="11.00" class="sc-loraregular">COVID-19</text><text x="318.60 329.60 340.60 351.60 362.60 373.60 384.60 395.60 406.60 417.60 428.60 439.60" y="178.63" font-size="11.00" class="sc-notoserifcjksc">等以往灾难，则该模型具备</text><text x="453.49 461.18 468.02 473.05" y="178.63" font-size="11.00" class="sc-loraregular">CB-2</text><text x="481.85 492.85 503.85" y="178.63" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.74" font-size="11.00" class="sc-notoserifcjksc">该阈值旨在表示威胁行为者能力的重大跨越式提升，例如能够持续获得世界顶尖专家支持所带来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="276.36" font-size="11.00" class="sc-notoserifcjksc">的提升（更多详情见</text><text x="171.00" y="276.36" font-size="11.00" class="sc-loraregular">“</text><text x="175.40 186.40 197.40 208.40 219.40 230.40 241.40" y="276.36" font-size="11.00" class="sc-notoserifcjksc">我们测量了什么</text><text x="252.40" y="276.36" font-size="11.00" class="sc-loraregular">”</text><text x="256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="276.36" font-size="11.00" class="sc-notoserifcjksc">）。如果以这种方式将</text><text x="369.13 376.82 383.66 388.69" y="276.36" font-size="11.00" class="sc-loraregular">CB-2</text><text x="397.49 408.49 419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49 529.49" y="276.36" font-size="11.00" class="sc-notoserifcjksc">阈值具体化，基于下文解释的</text><text x="72.00 83.00 94.00" y="291.98" font-size="11.00" class="sc-notoserifcjksc">理由，</text><text x="105.00 113.73 120.30 126.87 131.96 134.85 140.82 143.17" y="291.98" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="151.13 162.13 173.13 184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="291.98" font-size="11.00" class="sc-notoserifcjksc">尚未跨越这一阈值。因此，我们认为，与该阈值相关的实际安全风险仍然较低。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="307.60" font-size="11.00" class="sc-notoserifcjksc">我们承认，如果非常严格地按字面理解现有表述，</text><text x="314.00 322.73 329.30 335.87 340.96 343.85 349.82 352.17" y="307.60" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="323.22" font-size="11.00" class="sc-notoserifcjksc">提高一般生产力的意义上，已经为相关威胁行为者提供了</text><text x="347.00" y="323.22" font-size="11.00" class="sc-loraregular">“</text><text x="351.40 362.40 373.40 384.40" y="323.22" font-size="11.00" class="sc-notoserifcjksc">显著帮助</text><text x="395.40" y="323.22" font-size="11.00" class="sc-loraregular">”</text><text x="399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="323.22" font-size="11.00" class="sc-notoserifcjksc">。然而，这种解读与我们的</text><text x="72.00 78.91 85.15" y="338.84" font-size="11.00" class="sc-loraregular">RSP</text><text x="94.70 105.70 116.70 127.70 138.70 149.70 160.70 171.70 182.70 193.70 204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70 523.70" y="338.84" font-size="11.00" class="sc-notoserifcjksc">所关注的安全风险并不对应。因此，我们在此更详细地介绍所采用的方法，让读者了解我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="354.46" font-size="11.00" class="sc-notoserifcjksc">所设想的能力提升（</text><text x="171.00 177.57 184.13 187.13 190.22 194.07" y="354.46" font-size="11.00" class="sc-loraregular">uplift</text><text x="198.32 209.32 220.32 231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32 374.32 385.32 396.32 407.32" y="354.46" font-size="11.00" class="sc-notoserifcjksc">）的幅度和性质，并且我们很可能会修订现有</text><text x="421.22 428.13 434.36" y="354.46" font-size="11.00" class="sc-loraregular">RSP</text><text x="441.03 452.03 463.03 474.03 485.03 496.03 507.03 518.03 529.03" y="354.46" font-size="11.00" class="sc-notoserifcjksc">，使其更贴合我们的</text><text x="72.00 83.00 94.00" y="370.08" font-size="11.00" class="sc-notoserifcjksc">本意。</text><text x="72.00 79.46 82.84 90.30 93.68" y="453.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48" y="453.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="446.00" y="477.61" font-size="6.60" class="sc-loraregular">2</text><text x="449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="481.28" font-size="11.00" class="sc-notoserifcjksc">为此，我们开展了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">专家红队测试（</text><text x="149.00 153.69 159.59 166.17 171.55 175.81 181.75 187.42 197.26 200.35 207.02" y="496.90" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="213.11 224.11 235.11 246.11 257.11 268.11 279.11 290.11 301.11 312.11 323.11 334.11 345.11 356.11 367.11 378.11 389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11 499.11 510.11 521.11" y="496.90" font-size="11.00" class="sc-notoserifcjksc">），要求专家将模型与威胁相关的科学能力，与不同水平的信息来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="528.14" font-size="11.00" class="sc-notoserifcjksc">最出色的人才进行比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="594.62" font-size="11.00" class="sc-notoserifcjksc">我们主要关注后果最严重的化学与生物风险。与单次提示与响应的威胁模型不同，我们主要研究</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="610.24" font-size="11.00" class="sc-notoserifcjksc">行为者能否在引发此类风险所需的漫长、多步骤、高级任务中获得帮助。我们评估的过程知识密</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="625.86" font-size="11.00" class="sc-notoserifcjksc">集、技能密集、容易失败，而且往往存在许多瓶颈步骤。新型化学武器和生物武器的生产</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 87.85 97.85 107.85 117.85 127.85 137.85 147.85 157.85 167.85 177.85 187.85 197.85 207.85 217.85 227.85 237.85 247.85 257.85 267.85" y="691.01" font-size="10.00" class="sc-notoserifcjksc">在这一点上，我们的测量目标类似于此前版本</text><text x="280.48 286.76 292.43" y="691.01" font-size="10.00" class="sc-loraregular">RSP</text><text x="301.12 311.12 321.12 331.12 341.12" y="691.01" font-size="10.00" class="sc-notoserifcjksc">中的表述：</text><text x="351.12" y="691.01" font-size="10.00" class="sc-loraregular">“</text><text x="355.12 365.12 375.12 385.12 395.12 405.12 415.12 425.12 435.12 445.12 455.12 465.12 475.12 485.12 495.12 505.12 515.12 525.12" y="691.01" font-size="10.00" class="sc-notoserifcjksc">提升一个技能相当于初入门生物学博士的</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">团队，使其能力接近世界级、国家支持的生物武器团队。</text><text x="322.00" y="705.21" font-size="10.00" class="sc-loraregular">”</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">过程不仅具有上述所有瓶颈，还具有传统研发所涉及的额外瓶颈。我们以使用</text><text x="448.89 454.80 461.55 467.30" y="82.63" font-size="11.00" class="sc-loraregular">2023</text><text x="476.32 487.32 498.32 509.32 520.32" y="82.63" font-size="11.00" class="sc-notoserifcjksc">年可用工具</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">所能达到的水平为参照来测量能力提升，当时</text><text x="294.89 301.78" y="98.25" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36" y="98.25" font-size="11.00" class="sc-notoserifcjksc">模型的能力要弱得多。</text><text x="72.00 79.46 82.84 90.30 93.68" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.2</text><text x="104.24 117.24" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.63" font-size="11.00" class="sc-notoserifcjksc">通常，我们使用一组评估来考察模型，包括红队测试、能力提升试验、基于长篇任务的智能体评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="189.25" font-size="11.00" class="sc-notoserifcjksc">估（其中包含创造性和生成式任务），以及自动化知识与技能评估。对于</text><text x="426.89 435.63 442.19 448.76 453.85 456.75 462.71 465.06" y="189.25" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="470.13 481.13 492.13 503.13 514.13 525.13" y="189.25" font-size="11.00" class="sc-notoserifcjksc">，我们将评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="204.87" font-size="11.00" class="sc-notoserifcjksc">限定为红队测试、基于长篇任务的智能体评估，以及知识与技能评估。</text><text x="72.00 83.00" y="270.78" font-size="11.00" class="sc-notoserifcjksc">针对</text><text x="96.89 104.58" y="270.78" font-size="11.00" class="sc-loraregular">CB</text><text x="114.32 125.32 136.32 147.32 158.32 169.32" y="270.78" font-size="11.00" class="sc-notoserifcjksc">风险的自动化</text><text x="183.21 190.12 196.35" y="270.78" font-size="11.00" class="sc-loraregular">RSP</text><text x="205.91 216.91 227.91 238.91 249.91 260.91 271.91 282.91 293.91 304.91 315.91 326.91 337.91" y="270.78" font-size="11.00" class="sc-notoserifcjksc">评估在多个模型快照以及一个</text><text x="348.91" y="270.78" font-size="11.00" class="sc-loraregular">“</text><text x="353.31 364.31 375.31 386.31" y="270.78" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="397.31 403.90 409.86 412.86 419.37 423.09 429.65 432.65 438.02 444.46 451.14 454.07" y="270.78" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="459.88" y="270.78" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="470.88" y="270.78" font-size="11.00" class="sc-loraregular">”</text><text x="474.72 485.72 496.72 507.72 518.72 529.72" y="270.78" font-size="11.00" class="sc-notoserifcjksc">版本（移除了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="286.40" font-size="11.00" class="sc-notoserifcjksc">无害性安全防护措施的模型版本）上运行。为估计模型在各项评估中的能力上限，我们报告各项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="302.02" font-size="11.00" class="sc-notoserifcjksc">评估在所有快照中的最高分。由于所需时间更长，红队测试是在来自较早快照的仅有用版本上进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="317.64" font-size="11.00" class="sc-notoserifcjksc">行的。我们根据自动化评估，以及内部对不同快照差异的了解，选择了这一快照。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="400.32" font-size="11.00" class="sc-notoserifcjkscbold">环境与能力激发（</text><text x="160.00 165.92 169.35 172.95 178.64 182.20 186.74 192.46 197.00 200.60 206.83" y="400.32" font-size="11.00" class="sc-lorabold">elicitation</text><text x="213.85" y="400.32" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="227.74 238.74 249.74 260.74 271.74 282.74 293.74 304.74 315.74 326.74 337.74 348.74 359.74 370.74 381.74 392.74 403.74 414.74 425.74 436.74 447.74 458.74 469.74 480.74 491.74 502.74 513.74" y="400.32" font-size="11.00" class="sc-notoserifcjksc">我们的评估旨在考察真实、详细、多步骤、中等时间跨度的场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="415.94" font-size="11.00" class="sc-notoserifcjksc">景，而不是试图引出某个孤立的信息点。因此，在自动化评估中，模型可以使用工具和智能体运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="431.56" font-size="11.00" class="sc-notoserifcjksc">行框架（为模型提供额外工具以完成任务的软件配置）；我们通过分析失败案例、开发针对这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="447.18" font-size="11.00" class="sc-notoserifcjksc">案例的提示，迭代改进提示方式。必要时，我们使用移除了无害性安全防护措施的模型版本，以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="462.80" font-size="11.00" class="sc-notoserifcjksc">避免拒绝，并在大多数评估中启用扩展思考（</text><text x="292.00 297.91 303.74 307.99 313.96 320.63 327.21 333.12 339.70 342.59 346.85 353.44 356.53 363.20 369.11 372.20 378.88" y="462.80" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="384.96 395.96 406.96 417.96 428.96 439.96 450.96 461.96 472.96 483.96 494.96 505.96 516.96 527.96" y="462.80" font-size="11.00" class="sc-notoserifcjksc">）模式，以提高成功完成任务的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="478.42" font-size="11.00" class="sc-notoserifcjksc">可能性。总体而言，我们报告的分数是仅有用变体与</text><text x="325.00" y="478.42" font-size="11.00" class="sc-loraregular">“</text><text x="329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40" y="478.42" font-size="11.00" class="sc-notoserifcjksc">有用、无害、诚实</text><text x="417.40" y="478.42" font-size="11.00" class="sc-loraregular">”</text><text x="421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24 531.24" y="478.42" font-size="11.00" class="sc-notoserifcjksc">变体中观察到的最高分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="494.04" font-size="11.00" class="sc-notoserifcjksc">对于红队测试和基于知识的评估，我们为模型配备了搜索和研究工具。对于智能体评估，模型可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="509.66" font-size="11.00" class="sc-notoserifcjksc">以访问多种领域专用工具。</text><text x="72.00 83.00" y="627.00" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89" y="627.00" font-size="11.00" class="sc-notoserifcjksc">在旨在测试其综合已知生物武器生产相关知识的能力的自动化评估中，</text><text x="437.89 446.63 453.19 459.76 464.85 467.75 473.71 476.06" y="627.00" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="642.62" font-size="11.00" class="sc-notoserifcjksc">现。红队测试人员也强调了它综合相关知识的能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，该模型尚未达到上述</text><text x="261.89 269.58 276.42 281.45" y="82.63" font-size="11.00" class="sc-loraregular">CB-2</text><text x="290.25 301.25 312.25 323.25 334.25 345.25 356.25 367.25 378.25 389.25 400.25 411.25 422.25 433.25 444.25 455.25 466.25 477.25 488.25 499.25 510.25 521.25" y="82.63" font-size="11.00" class="sc-notoserifcjksc">威胁模型所对应的能力水平。这些发现来自专家红</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">队测试：专家强调了模型在综合已发表资料方面的显著优势，这种综合可能横跨多个领域；但同</text><text x="72.00 83.00 94.00 105.00 116.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">时指出，与</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="113.87" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="113.87" font-size="11.00" class="sc-notoserifcjksc">类似，在需要新颖方法的工作中，模型的实用性仍有不足。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">这些弱点包括缺乏预判行为（模型需要持续引导，而不会主动提出替代路径）、实验方案开发的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">深度不足以支持执行，以及对合成步骤的可行性过度自信。虽然评估人员依靠自己的专业知识，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc">能够构建他们认为大体可行的灾难性场景，但需要大量指导才能将模型引向这些场景。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc">我们通过序列到功能建模与设计评估补充了这些红队测试。</text><text x="358.00 366.73 373.30 379.87 384.96 387.85 393.82 396.17" y="276.93" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13" y="276.93" font-size="11.00" class="sc-notoserifcjksc">在建模任务上略优于</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="292.55" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="292.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="142.76 151.50 158.06 164.63 169.72 172.62 178.58 181.18" y="292.55" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="187.53 198.53 209.53 220.53 231.53 242.53 253.53 264.53 275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53 363.53 374.53 385.53 396.53 407.53 418.53 429.53 440.53 451.53 462.53 473.53 484.53" y="292.55" font-size="11.00" class="sc-notoserifcjksc">，在设计任务上则略逊于这两个模型，并在两项任务上均落后于</text><text x="498.43 506.11 509.11 514.72 521.28 527.86" y="292.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="308.17" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="308.17" font-size="11.00" class="sc-notoserifcjksc">；这表明，在获得少量实验数据的条件下，它能够显著提升团队设计功能更强序</text><text x="72.00 83.00 94.00 105.00 116.00" y="323.79" font-size="11.00" class="sc-notoserifcjksc">列的能力。</text><text x="72.00 79.46 82.84 90.30 93.68" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.3</text><text x="104.57 117.57 130.57 143.57 156.57 169.57 182.57 195.57 208.57 221.57 234.57 247.57 260.57" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于化学风险评估与缓解措施</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="404.32" font-size="11.00" class="sc-notoserifcjksc">在化学风险方面，我们主要关注模型是否会帮助意图坚定的行为者，完成获取有害化学毒剂并将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="419.94" font-size="11.00" class="sc-notoserifcjksc">其武器化所需的许多困难、知识和技能密集且容易失败的步骤。为了解模型在开发已知或新型化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="435.56" font-size="11.00" class="sc-notoserifcjksc">学武器方面提升行为者能力的程度，我们邀请两名在化学武器合成方面拥有丰富防御专业知识的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="451.18" font-size="11.00" class="sc-notoserifcjksc">专家开展红队测试。他们的定性发现与生物学红队测试人员相呼应。此前对</text><text x="437.89 447.83 453.69 457.95 464.53 470.97 476.06 478.96 485.62 490.31 496.21 501.77 504.86 510.78" y="451.18" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="522.48" y="451.18" font-size="11.00" class="sc-notoserifcjksc">进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="466.80" font-size="11.00" class="sc-notoserifcjksc">行过红队测试的专家指出，</text><text x="204.00 212.73 219.30 225.87 230.96 233.85 239.82 242.17" y="466.80" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="466.80" font-size="11.00" class="sc-notoserifcjksc">擅长综合文献信息，为威胁行为者节省时间，但偶尔在推理</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="482.42" font-size="11.00" class="sc-notoserifcjksc">中出现错误和疏漏，可能导致失败。与以往一样，我们对化学风险实施监控，并针对高优先级、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="498.04" font-size="11.00" class="sc-notoserifcjksc">非两用的化学武器内容维持阻断分类器。</text><text x="72.00 79.46 82.84 90.30 93.68" y="596.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37 118.37 131.37 144.37 157.37 170.37 183.37 196.37" y="596.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于生物风险评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="624.85" font-size="11.00" class="sc-notoserifcjksc">生物风险态势复杂且不断变化。威胁行为者在资源、专业知识和意图方面差异很大；新颖场景和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="640.47" font-size="11.00" class="sc-notoserifcjksc">赋能技术出现的时间难以预测；模型测得的能力提升如何转化为真实世界风险，取决于隐性实验</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="656.09" font-size="11.00" class="sc-notoserifcjksc">知识、行动约束和获取瓶颈等仍然难以量化的因素。我们的评估与判断必然是在</text></svg></div>
