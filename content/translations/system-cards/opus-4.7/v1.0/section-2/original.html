<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="163.59" font-size="11.00" class="sc-notoserifcjksc">基于作为自动化行为审计（</text><text x="204.00 209.61 216.18 220.43 226.87 236.70 242.30 246.56 252.47 259.04 261.94 268.34 274.30 280.89 286.43 291.99 295.08 301.52 306.20 311.88 314.87 317.76 323.37 329.94 336.52 339.78" y="163.59" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="344.04 355.04 366.04 377.04 388.04 399.04 410.04 421.04 432.04 443.04 454.04 465.04 476.04 487.04 498.04 509.04" y="163.59" font-size="11.00" class="sc-notoserifcjksc">）一部分而开展的几项非常轻量的评</text><text x="349.89 356.78" y="179.21" font-size="11.00" class="sc-loraregular">AI</text><text x="363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36" y="179.21" font-size="11.00" class="sc-notoserifcjksc">开发者，其倾向也不会发生重要变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="194.83" font-size="11.00" class="sc-notoserifcjksc">化。（据非正式观察，在自动化行为审计测试中，模型对</text><text x="349.89 356.78 363.36 367.61 374.20 378.89 385.32 391.89 394.98" y="194.83" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="194.83" font-size="11.00" class="sc-notoserifcjksc">及其领导层的看法往往比对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="210.45" font-size="11.00" class="sc-notoserifcjksc">其他前沿开发者更为正面，不过这尚未达到构成破坏倾向的程度。）</text><text x="217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89" y="277.76" font-size="11.00" class="sc-notoserifcjkscbold">监控及相关安全防护措施：</text><text x="349.89 360.89" y="277.76" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="374.79 381.67 388.25 392.51 399.10 403.78 410.22 416.78 419.87" y="277.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="428.62 439.62 450.62 461.62 472.62 483.62 494.62 505.62 516.62 527.62" y="277.76" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们对第三</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="293.38" font-size="11.00" class="sc-notoserifcjksc">方部署的监控能力要弱得多。不过，我们仍然认为，迈向灾难性危害的步骤相当有可能被其运营</text><text x="72.00 83.00" y="309.00" font-size="11.00" class="sc-notoserifcjksc">方（</text><text x="94.00 100.43 107.00 112.96 117.65 123.25 127.51 133.94" y="309.00" font-size="11.00" class="sc-loraregular">operator</text><text x="111.55 122.55 133.55 144.55 155.55" y="277.76" font-size="11.00" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="239.89 250.89 261.89 272.89 283.89" y="376.56" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="376.56" font-size="11.00" class="sc-notoserifcjksc">我们的服务条款不允许第三方使用我们的工具开发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="392.18" font-size="11.00" class="sc-notoserifcjksc">与我们竞争的前沿模型。</text><text x="117.00 128.00 139.00 150.00 161.00 172.00" y="376.56" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00 77.86 80.43 86.44 89.01 95.17 97.73" y="425.96" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49 117.49" y="425.96" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="425.96" font-size="11.00" class="sc-lorabold">8</text><text x="137.67 148.67 159.67 170.67 181.67 192.67 203.67 214.67 225.67 236.67 247.67 258.67 269.67 280.67" y="425.96" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="458.34" font-size="11.00" class="sc-notoserifcjksc">我们的模型在主要国家政府内部的使用会带来一定的对齐风险，尤其是在其被极为广泛地使用的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="473.96" font-size="11.00" class="sc-notoserifcjksc">情况下。例如，一个未对齐的模型可能处于能够影响到达重要决策者的信息和观点的位置，或者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="489.58" font-size="11.00" class="sc-notoserifcjksc">利用关键系统中的漏洞来造成广泛的影响。</text><text x="239.89 250.89 261.89 272.89 283.89 294.89 305.89" y="540.13" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="316.89 327.89" y="540.13" font-size="11.00" class="sc-notoserifcjksc">如第</text><text x="341.79" y="540.13" font-size="11.00" class="sc-loraregular">6</text><text x="351.04 362.04 373.04 384.04 395.04 406.04 417.04 428.04 439.04 450.04" y="540.13" font-size="11.00" class="sc-notoserifcjksc">节所讨论，我们不认为</text><text x="463.93 471.62 474.61 480.22 486.79 493.37 499.33 502.22 510.96 517.52 524.09" y="540.13" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.32" y="555.75" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28 99.28 110.28 121.28 132.28 143.28 154.28 165.28 176.28 187.28 198.28 209.28 220.28 231.28 242.28 253.28 264.28 275.28 286.28 297.28 308.28 319.28 330.28 341.28 352.28 363.28 374.28 385.28 396.28 407.28 418.28" y="555.75" font-size="11.00" class="sc-notoserifcjksc">具有会导致其试图破坏政府决策或运作的连贯目标或倾向。基于作为第</text><text x="432.17 438.53 441.24 447.14 449.85" y="555.75" font-size="11.00" class="sc-loraregular">6.2.3</text><text x="458.87 469.87 480.87 491.87 502.87 513.87 524.87" y="555.75" font-size="11.00" class="sc-notoserifcjksc">节所述自动化行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="571.37" font-size="11.00" class="sc-notoserifcjksc">为审计一部分而开展的几项非常轻量的评估，我们预计，即使模型被部署在政府环境中，其倾向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="586.99" font-size="11.00" class="sc-notoserifcjksc">也不会发生重要变化。</text><text x="117.00 128.00 139.00 150.00 161.00 172.00" y="540.13" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="654.30" font-size="11.00" class="sc-notoserifcjksc">然而，在这一情境下，很难完全排除第三方对手蓄意植入的行为后门所带来的风险。迄今为止，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="669.92" font-size="11.00" class="sc-notoserifcjksc">我们尚未看到此类攻击的任何成功案例，但我们对政府使用情况的可见度有限，这使</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们更难在足够真实的处境下开展部署前测试，从而难以确信我们能够发现此类源自第三方的被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">植入后门的行为。</text><text x="239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89" y="132.03" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="132.03" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00 83.00 94.00 105.00 116.00" y="147.65" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89 136.78 143.36 147.61 154.20 158.89 165.32 171.89 174.98" y="147.65" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="178.89" font-size="11.00" class="sc-notoserifcjksc">用，我们的模型才可能显著影响相关官员的观点或以其他方式采取高风险行动。鉴于</text><text x="481.89 488.78" y="178.89" font-size="11.00" class="sc-loraregular">AI</text><text x="495.36 506.36 517.36 528.36" y="178.89" font-size="11.00" class="sc-notoserifcjksc">模型目前</text><text x="117.00 128.00 139.00 150.00 161.00 172.00" y="132.03" font-size=
