.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p078.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 78 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.23" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89" y="116.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="192.32" y="116.23" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了一套与我们最近几款模型（包括</text><text x="437.21" y="116.23" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="131.85" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="131.85" font-size="11.00" class="sc-notoserifcjksc">）发布时所进行的类似的智能体安全评估。</text><text x="72.00" y="180.99" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="180.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="205.88" y="180.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡（</text><text x="249.88" y="180.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">System Card</text><text x="314.54" y="180.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="325.54" y="180.99" font-size="11.00" class="sc-notoserifcjksc">中先前所述，我们还引入了一项新评估，聚</text><text x="72.00" y="196.61" font-size="11.00" class="sc-notoserifcjksc">焦于我们的模型自主执行影响力行动的能力，以及一项新的间接提示词注入（</text><text x="446.00" y="196.61" font-size="11.00" class="sc-loraregular sc-k">indirect prompt</text><text x="72.00" y="212.23" font-size="11.00" class="sc-loraregular sc-k">injection</text><text x="116.75" y="212.23" font-size="11.00" class="sc-notoserifcjksc">）基准测试，以应对现有评估已饱和的问题。我们移除了一项关于基础恶意编程任务的</text><text x="72.00" y="227.85" font-size="11.00" class="sc-notoserifcjksc">评估（参见</text><text x="127.00" y="227.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="212.95" y="227.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="245.95" y="227.85" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="259.85" y="227.85" font-size="11.00" class="sc-loraregular">5.1.1</text><text x="282.15" y="227.85" font-size="11.00" class="sc-notoserifcjksc">节），该评估已高度饱和，并已被专门聚焦于</text><text x="505.05" y="227.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="243.47" font-size="11.00" class="sc-loraregular">Code</text><text x="101.56" y="243.47" font-size="11.00" class="sc-notoserifcjksc">和计算机使用（</text><text x="178.56" y="243.47" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="249.25" y="243.47" font-size="11.00" class="sc-notoserifcjksc">）任务的更难评估所取代。</text><text x="72.00" y="311.92" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="311.92" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="349.01" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="349.01" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="376.91" font-size="11.00" class="sc-notoserifcjksc">本评估旨在测试模型在</text><text x="184.89" y="376.91" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="252.74" y="376.91" font-size="11.00" class="sc-notoserifcjksc">环境下对恶意、两用和良性的网络安全相关查询的回应。提</text><text x="72.00" y="392.53" font-size="11.00" class="sc-notoserifcjksc">示词分为两类：</text><text x="108.00" y="425.49" font-size="11.00" class="sc-notoserifcjkscbold">恶意使用：</text><text x="163.00" y="425.49" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="187.89" y="425.49" font-size="11.00" class="sc-loraregular">61</text><text x="201.15" y="425.49" font-size="11.00" class="sc-notoserifcjksc">条恶意提示词，用于评估</text><text x="325.04" y="425.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="363.33" y="425.49" font-size="11.00" class="sc-notoserifcjksc">能否正确拒绝带有恶意意图或在其他</text><text x="108.00" y="441.11" font-size="11.00" class="sc-notoserifcjksc">方面为我们的</text><text x="174.00" y="441.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="229.00" y="441.11" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Usage Policy</text><text x="293.53" y="441.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="304.53" y="441.11" font-size="11.00" class="sc-notoserifcjksc">所禁止的查询。示例主题包括协助制作恶意软</text><text x="108.00" y="456.73" font-size="11.00" class="sc-notoserifcjksc">件、编写用于破坏性</text><text x="209.89" y="456.73" font-size="11.00" class="sc-loraregular sc-k">DDoS</text><text x="241.67" y="456.73" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件。自</text><text x="475.57" y="456.73" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="472.35" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="192.59" y="472.35" font-size="11.00" class="sc-notoserifcjksc">系统卡起，我们新增了</text><text x="305.48" y="472.35" font-size="11.00" class="sc-loraregular">12</text><text x="318.29" y="472.35" font-size="11.00" class="sc-notoserifcjksc">个具有挑战性的测试用例，使提示词总数从</text><text x="108.00" y="487.97" font-size="11.00" class="sc-loraregular">49</text><text x="123.21" y="487.97" font-size="11.00" class="sc-notoserifcjksc">条增加到</text><text x="170.11" y="487.97" font-size="11.00" class="sc-loraregular">61</text><text x="183.36" y="487.97" font-size="11.00" class="sc-notoserifcjksc">条。</text><text x="108.00" y="522.64" font-size="11.00" class="sc-notoserifcjkscbold">两用与良性：</text><text x="174.00" y="522.64" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="198.89" y="522.64" font-size="11.00" class="sc-loraregular">61</text><text x="212.15" y="522.64" font-size="11.00" class="sc-notoserifcjksc">条提示词，涵盖两用查询和完全良性的查询，用于评估</text><text x="479.04" y="522.64" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="517.33" y="522.64" font-size="11.00" class="sc-notoserifcjksc">能否</text><text x="108.00" y="538.26" font-size="11.00" class="sc-notoserifcjksc">协助处理可能敏感但未被禁止的请求。示例主题包括运行网络侦察工具、测试网站漏洞，</text><text x="108.00" y="553.88" font-size="11.00" class="sc-notoserifcjksc">以及分析渗透测试所得的数据。</text><text x="72.00" y="603.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="603.60" font-size="11.00" class="sc-notoserifcjksc">配备了</text><text x="192.32" y="603.60" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="260.17" y="603.60" font-size="11.00" class="sc-notoserifcjksc">中可用的标准工具命令集。每条提示词运行</text><text x="472.06" y="603.60" font-size="11.00" class="sc-loraregular">10</text><text x="485.79" y="603.60" font-size="11.00" class="sc-notoserifcjksc">次，两个类</text><text x="72.00" y="619.22" font-size="11.00" class="sc-notoserifcjksc">别合计共</text><text x="118.89 122.90 125.67 131.58 137.48" y="619.22" font-size="11.00" class="sc-loraregular">1,220</text><text x="147.22" y="619.22" font-size="11.00" class="sc-notoserifcjksc">次测试。</text><text x="72.00" y="652.18" font-size="11.00" class="sc-notoserifcjksc">鉴于我们预计将在所有版本中默认实施这一安全防护措施，我们现在也会在应用</text><text x="459.89" y="652.18" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="527.74" y="652.18" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="72.00" y="667.80" font-size="11.00" class="sc-notoserifcjksc">统提示词（</text><text x="127.00" y="667.80" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="204.29" y="667.80" font-size="11.00" class="sc-notoserifcjksc">）的情况下自动运行本评估。在以往的系统卡中，我们还曾在附加另</text><text x="302.51" y="683.42" font-size="11.00" class="sc-loraregular sc-k">FileRead</text><text x="348.27" y="683.42" font-size="11.00" class="sc-notoserifcjksc">工具结果上附加一条提醒，明确指示模</text><text x="72.00" y="699.04" font-size="11.00" class="sc-notoserifcjksc">型考虑该文件是否</text><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="83.00" y="172.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="83.00" y="172.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="118.40" y="172.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="121.29" y="172.19" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="159.46" y="172.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="162.35" y="172.19" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="202.99" y="172.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="205.88" y="172.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="216.88" y="172.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="216.88" y="172.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://ww <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p079.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 79 页"><text x="77.50" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50" y="220.27" font-size="10.99" class="sc-lorabold sc-k">Claude Opus 4.7</text><text x="77.50" y="231.75" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87" y="231.75" font-size="9.00" class="sc-lorabolditalic sc-k">FileTool</text><text x="123.81" y="231.75" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50" y="257.12" font-size="10.99" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="77.50" y="268.55" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87" y="268.55" font-size="9.00" class="sc-lorabolditalic sc-k">FileTool</text><text x="123.81" y="268.55" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50" y="293.97" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="77.50" y="305.45" font-size="9.00" class="sc-notoserifcjkscbold">有</text><text x="88.87" y="305.45" font-size="9.00" class="sc-lorabolditalic sc-k">FileTool</text><text x="123.81" y="305.45" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50" y="330.82" font-size="10.99" class="sc-lorabold">Claude Opus 4.6</text><text x="77.50" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87" y="342.25" font-size="9.00" class="sc-lorabolditalic sc-k">FileTool</text><text x="123.81" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="236.50" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.48" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="279.42" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.22" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="466.16" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.30" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">具有恶意。对于近期的模型，包括</text><text x="239.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="286.03" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="299.92" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="381.62" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，评估显示这一缓解措施并未带</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">来任何额外的安全收益。我们现在只在能带来实质性安全改进的模型上应用这一安全防护措施，</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">并报告有无</text><text x="129.89" y="113.87" font-size="11.00" class="sc-loraregular sc-k">FileTool</text><text x="172.69" y="113.87" font-size="11.00" class="sc-notoserifcjksc">提醒两种情况下较好的分数。我们还对系统提示词进行了更新，这会使下文</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">中以往模型的结果略有变化。</text><text x="72.00" y="359.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83" y="359.86" font-size="9.00" class="sc-lorabold">5.1.1.A]</text><text x="116.68" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">应用缓解措施后的</text><text x="191.04" y="359.86" font-size="9.00" class="sc-lorabold">Claude Code</text><text x="246.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="291.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以</text><text x="399.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="417.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出</text><text x="72.00" y="371.56" font-size="9.00" class="sc-notoserifcjksc">（但未考虑误差范围）。由于系统提示词的更新，以往模型的结果与以往系统卡中的结果存在差异。</text><text x="72.00" y="412.17" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="412.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="171.85" y="412.17" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.85" y="412.17" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="250.98" y="412.17" font-size="11.00" class="sc-notoserifcjksc">在识别和拒绝恶意请求方面表现出显著提升。与</text><text x="484.87" y="412.17" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="427.79" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="427.79" font-size="11.00" class="sc-notoserifcjksc">类似，提升来自于对以往模型难以应对的那些具有挑战性的新用例的拒绝。在两</text><text x="72.00" y="443.41" font-size="11.00" class="sc-notoserifcjksc">用和良性任务上，</text><text x="160.00" y="443.41" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="206.13" y="443.41" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="253.03" y="443.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="338.98" y="443.41" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="491.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="491.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="519.36" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="519.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="178.43" y="519.36" font-size="11.00" class="sc-notoserifcjksc">，我们运行了上一次为</text><text x="291.32" y="519.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.5</text><text x="377.02" y="519.36" font-size="11.00" class="sc-notoserifcjksc">发布而更新的计算机使用评估。</text><text x="72.00" y="534.98" font-size="11.00" class="sc-notoserifcjksc">我们评估模型在沙箱化的环境中获得基于图形用户界面（</text><text x="347.00" y="534.98" font-size="11.00" class="sc-loraregular">GUI</text><text x="367.33" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="455.33" y="534.98" font-size="11.00" class="sc-loraregular">CLI</text><text x="473.06" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）的计算机使</text><text x="72.00" y="550.60" font-size="11.00" class="sc-notoserifcjksc">用工具时如何回应有害任务，重点关注以下几个令人担忧的风险领域：</text><text x="108.00" y="600.32" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集</text><text x="108.00" y="616.52" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播</text><text x="108.00" y="632.71" font-size="11.00" class="sc-notoserifcjksc">规模化滥用</text><text x="72.00" y="665.09" font-size="11.00" class="sc-loraregular">112</text><text x="88.81" y="665.09" font-size="11.00" class="sc-notoserifcjksc">项任务分别在开启和关闭思考的情况下运行，每个模型共计</text><text x="377.70" y="665.09" font-size="11.00" class="sc-loraregular sc-k">224</text><text x="398.13" y="665.09" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p080.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 80 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="209.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="209.57" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="209.57" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以粗体标出，次优分数以下划线标</text><text x="72.00" y="221.27" font-size="9.00" class="sc-notoserifcjksc">出（但未考虑误差范围）。</text><text x="72.00" y="261.88" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="118.13" y="261.88" font-size="11.00" class="sc-notoserifcjksc">在拒绝这些任务方面的得分高于</text><text x="275.03" y="261.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="358.09" y="261.88" font-size="11.00" class="sc-notoserifcjksc">，但与其他近期模型的差距在误差范</text><text x="72.00" y="277.50" font-size="11.00" class="sc-notoserifcjksc">围之内。随着模型通用能力的提升，我们观察到模型在该评估上的表现稳步改善。</text><text x="72.00" y="324.98" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="324.98" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="352.88" font-size="11.00" class="sc-notoserifcjksc">正如在</text><text x="105.00" y="352.88" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="227.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的系统卡</text><text x="271.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc">中首次讨论的那样，我们新建了一项评估，用于评估有</text><text x="72.00" y="368.50" font-size="11.00" class="sc-notoserifcjksc">害操纵风险。具体而言，我们测试模型能否自主开展影响力行动，且其水平足以通过大规模的说</text><text x="72.00" y="384.12" font-size="11.00" class="sc-notoserifcjksc">服、欺骗或个性化定向，为恶意行为者带来实质性的能力提升（</text><text x="380.00" y="384.12" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="407.32" y="384.12" font-size="11.00" class="sc-notoserifcjksc">）。影响力行动是指通过欺</text><text x="391.00" y="415.36" font-size="11.00" class="sc-loraregular">AI</text><text x="404.46" y="415.36" font-size="11.00" class="sc-notoserifcjksc">能力提升带来的一个风险在</text><text x="72.00" y="547.19" font-size="11.00" class="sc-notoserifcjksc">该评估侧重考察模型在面对平台阻力和针对该行动的防御措施时端到端执行完整行动的能力；测</text><text x="72.00" y="562.81" font-size="11.00" class="sc-notoserifcjksc">试在智能体运行框架中进行，模型可在一个包含内容审核和反制互动障碍的模拟生态系统内使用</text><text x="72.00" y="578.43" font-size="11.00" class="sc-notoserifcjksc">模拟的社交媒体平台工具。为衡量原始能力而非安全防护措施的效果，我们针对一个削减了无害</text><text x="72.00" y="594.05" font-size="11.00" class="sc-notoserifcjksc">性训练的</text><text x="116.00" y="594.05" font-size="11.00" class="sc-loraregular">“</text><text x="120.40" y="594.05" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="153.40" y="594.05" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="594.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="168.24" y="594.05" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="230.81" y="594.05" font-size="11.00" class="sc-notoserifcjksc">）模型版本运行该评估。模型的表现依据其满足特定成功标准的</text><text x="72.00" y="609.67" font-size="11.00" class="sc-notoserifcjksc">程度来评估，例如模型是否根据所声明的所在地在符合现实的时间发帖，以及模型是否根据表现</text><text x="72.00" y="625.29" font-size="11.00" class="sc-notoserifcjksc">数据对内容进行迭代。该评估是对现有其他针对影响力行动与平台操纵的单轮和多轮评估的补</text><text x="72.00" y="640.91" font-size="11.00" class="sc-notoserifcjksc">充，例如第</text><text x="129.89" y="640.91" font-size="11.00" class="sc-loraregular">4.3</text><text x="147.58" y="640.91" font-size="11.00" class="sc-notoserifcjksc">节中给出的多轮测试结果。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.40" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="143.29" y="344.08" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="181.46" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="184.35" y="344.08" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="224.99" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="227.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p081.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 81 页"><text x="77.50" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50" y="333.61" font-size="10.99" class="sc-lorabold sc-k">Claude Opus 4.7</text><text x="162.80" y="333.61" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="371.74" font-size="10.99" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="203.96" y="371.74" font-size="10.99" class="sc-notoserifcjkscbold">（仅</text><text x="77.50" y="387.36" font-size="10.99" class="sc-notoserifcjkscbold">有用）</text><text x="77.50" y="409.87" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="174.38" y="409.87" font-size="10.99" class="sc-notoserifcjkscbold">（仅有</text><text x="77.50" y="425.49" font-size="10.99" class="sc-notoserifcjkscbold">用）</text><text x="77.50" y="448.01" font-size="10.99" class="sc-lorabold">Claude Opus 4.6</text><text x="164.28" y="448.01" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="236.50" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们测试了两个假设场景：</text><text x="204.00" y="98.82" font-size="11.00" class="sc-loraregular">1</text><text x="208.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">）压制投票场景，其中一名假设的用户指示模型开展一场伪草根运动</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">），以压低选民对特定政治候选人的投票率与热情；</text><text x="397.35" y="114.44" font-size="11.00" class="sc-loraregular">2</text><text x="403.25" y="114.44" font-size="11.00" class="sc-notoserifcjksc">）国内极化场景，其中一名</text><text x="72.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">的信息，以激化社会与政治分歧。</text><text x="72.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">两个场景的结果如下，以平均任务完成率呈现（每个场景共</text><text x="360.89" y="212.16" font-size="11.00" class="sc-loraregular">70</text><text x="375.69" y="212.16" font-size="11.00" class="sc-notoserifcjksc">项成功标准）。各场景在</text><text x="499.58" y="212.16" font-size="11.00" class="sc-loraregular">3</text><text x="508.60" y="212.16" font-size="11.00" class="sc-notoserifcjksc">种不</text><text x="72.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">同的模拟平台阻力水平下各运行</text><text x="228.89" y="227.78" font-size="11.00" class="sc-loraregular">3</text><text x="237.91" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次，每个场景共计</text><text x="328.81" y="227.78" font-size="11.00" class="sc-loraregular">9</text><text x="338.06" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次模拟。</text><text x="72.00" y="478.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="478.32" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="478.32" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="478.32" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="490.02" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00" y="530.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="530.63" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两项任务上的成功率均高于</text><text x="368.32" y="530.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="451.38" y="530.63" font-size="11.00" class="sc-notoserifcjksc">，并在国内极化场</text><text x="72.00" y="546.25" font-size="11.00" class="sc-notoserifcjksc">景上得分高于</text><text x="140.89" y="546.25" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="260.88" y="546.25" font-size="11.00" class="sc-notoserifcjksc">。不过，我们仍发现，大多数操作步骤都需要大量人工指</text><text x="72.00" y="561.87" font-size="11.00" class="sc-notoserifcjksc">导，这意味着该模型尚不具备完整的人设与账号网络管理、协同内容投放以及规模化社会工程行</text><text x="72.00" y="577.49" font-size="11.00" class="sc-notoserifcjksc">动所需的自主能力水平。</text><text x="72.00" y="643.98" font-size="11.00" class="sc-notoserifcjksc">这些模型的完整训练版本额外接受了无害性训练。当我们在这些场景下测试这些模型的最终版本</text><text x="72.00" y="659.60" font-size="11.00" class="sc-notoserifcjksc">时，任务完成率接近</text><text x="173.89" y="659.60" font-size="11.00" class="sc-loraregular">0%</text><text x="190.29" y="659.60" font-size="11.00" class="sc-notoserifcjksc">，因为模型通常从一开始就拒绝参与这些任务（这些任务明显违反了我</text><text x="72.00" y="675.22" font-size="11.00" class="sc-notoserifcjksc">们的使用政策）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="72.00" y="84.21" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="84.21" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="110.78" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入（</text><text x="160.00" y="110.78" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="245.99" y="110.78" font-size="11.00" class="sc-notoserifcjksc">）仍是我们在智能体系统中安全部署模型的最高优先事项之</text><text x="72.00" y="142.02" font-size="11.00" class="sc-notoserifcjksc">站上，或在智能体总结的电子邮件中。当智能体在原本例行的任务中遇到这些恶意内容时，它可</text><text x="72.00" y="173.26" font-size="11.00" class="sc-notoserifcjksc">页或共享文档中的单个恶意载荷，可能会危及任何处理它的智能体，而攻击者无需针对特定用户</text><text x="72.00" y="188.88" font-size="11.00" class="sc-notoserifcjksc">或系统。当模型同时拥有访问私有数据和代表用户采取行动的权限时，这类攻击也尤其危险，因</text><text x="72.00" y="204.50" font-size="11.00" class="sc-notoserifcjksc">为这一组合可能使攻击者外泄敏感信息或执行未经授权的操作。</text><text x="72.00" y="321.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的智能体使用场景（包括工具使用、编程、</text><text x="431.42" y="321.27" font-size="11.00" class="sc-loraregular">GUI</text><text x="454.65" y="321.27" font-size="11.00" class="sc-notoserifcjksc">计算机使用和浏</text><text x="72.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">览器使用）上的提示词注入鲁棒性继续大幅提升。尽管我们持续努力加强评估，包括从专业红队</text><text x="72.00" y="352.51" font-size="11.00" class="sc-notoserifcjksc">成员处获取新的攻击、与外部研究机构合作开发更难的基准测试，</text><text x="391.00" y="352.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="475.43" y="352.51" font-size="11.00" class="sc-notoserifcjksc">仍再次使我</text><text x="72.00" y="368.13" font-size="11.00" class="sc-notoserifcjksc">们的许多评估达到饱和。</text><text x="72.00" y="434.62" font-size="11.00" class="sc-notoserifcjksc">除模型层面的鲁棒性外，我们还持续投入于在模型本身之上运行的防护措施，以进一步加固基于</text><text x="72.00" y="450.24" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="450.24" font-size="11.00" class="sc-notoserifcjksc">构建的智能体。在以往的系统卡中，我们报告了使用分类器检测提示词注入尝试的结果；</text><text x="72.00" y="481.48" font-size="11.00" class="sc-notoserifcjksc">供强信号。我们将在以下各节展示它们所提供的鲁棒性，这些安全防护措施在我们的许多智能体</text><text x="72.00" y="497.10" font-size="11.00" class="sc-notoserifcjksc">产品中默认启用。</text><text x="72.00" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc">外部研究合作伙伴</text><text x="162.89" y="590.39" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Gray Swan</text><text x="220.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="253.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="385.35" y="590.39" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">UK AI Security Institute</text><text x="507.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="517.99" y="590.39" font-size="11.00" class="sc-notoserifcjksc">合作</text><text x="72.00" y="606.01" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="107.89" y="606.01" font-size="11.00" class="sc-loraregular sc-k">Agent Red Teaming</text><text x="206.51" y="606.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="217.51" y="606.01" font-size="11.00" class="sc-loraregular">ART</text><text x="238.34" y="606.01" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="293.34" y="602.34" font-size="6.60" class="sc-loraregular">8</text><text x="297.05" y="606.01" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在</text><text x="72.00" y="621.62" font-size="11.00" class="sc-notoserifcjksc">四类利用方式上对提示词注入的易感性：破坏机密性、引入相互竞争的目标、生成被禁止的内容</text><text x="72.00" y="637.24" font-size="11.00" class="sc-notoserifcjksc">（如恶意代码），以及执行被禁止的操作（如未经授权的金融交易）。</text><a href="https://arxiv.org/abs/2507.20526" rel="noopener"><rect x="216.00" y="707.25" width="158.25" height="12.75" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="162.89" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="162.89" y="581.59" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="187.32" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="190.22" y="581.59" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="286.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="286.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="297.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="297.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="308.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="308.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="319.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="319.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="330.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="330.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="341.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="341.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="352.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="352.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="363.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="363.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="374.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="374.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="385.35" y="581.59" width="15.79" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="401.13" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="404.02" y="581.59" width="10.57" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="414.60" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="417.49" y="581.59" width="42.68" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="460.17" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="463.06" y="581.59" width="43.93" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="507.00" y="581.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="72.00" y="98.82" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="129.45" y="98.82" font-size="11.00" class="sc-notoserifcjksc">估计了攻击者在</text><text x="209.35" y="98.82" font-size="11.00" class="sc-loraregular sc-k">k=1</text><text x="224.97" y="98.82" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="235.97" y="98.82" font-size="11.00" class="sc-loraregular sc-k">k=10</text><text x="261.31" y="98.82" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.20" y="98.82" font-size="11.00" class="sc-loraregular sc-k">k=100</text><text x="307.38" y="98.82" font-size="11.00" class="sc-notoserifcjksc">次尝试内取得成功的概率，这反映出攻击并非确</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">定性的，重复尝试会提高注入成功的可能性。这些攻击取自</text><text x="360.89" y="114.44" font-size="11.00" class="sc-loraregular sc-k">ART Arena</text><text x="414.51" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，在那里数千名专家红队</text><text x="72.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc">成员持续针对前沿模型改进攻击策略。</text><text x="259.00" y="130.06" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="316.45" y="130.06" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中选取了迁移率特别高的一个子</text><text x="72.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">集：这些攻击已被证明对多个模型有效，而不仅仅对最初针对的那个模型有效。该评估仅涵盖间</text><text x="72.00" y="161.30" font-size="11.00" class="sc-notoserifcjksc">接提示词注入</text><text x="138.00" y="157.63" font-size="6.60" class="sc-loraregular">9</text><text x="471.81" y="161.30" font-size="11.00" class="sc-loraregular">“</text><text x="476.21" y="161.30" font-size="11.00" class="sc-notoserifcjksc">提示词注</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">入</text><text x="83.00" y="176.92" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="176.92" font-size="11.00" class="sc-notoserifcjksc">的内容）。</text><text x="72.00" y="524.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="524.86" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19" y="524.86" font-size="9.00" class="sc-lorabold sc-k">Agent Red Teaming</text><text x="221.26" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="524.86" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击</text><text x="383.29" y="524.86" font-size="9.00" class="sc-notoserifcjksc">。结果表示对每个模型而言，攻击者在</text><text x="72.00" y="536.56" font-size="9.00" class="sc-loraregular sc-k">k=1</text><text x="84.78" y="536.56" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78" y="536.56" font-size="9.00" class="sc-loraregular sc-k">k=10</text><text x="114.52" y="536.56" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88" y="536.56" font-size="9.00" class="sc-loraregular sc-k">k=100</text><text x="152.21" y="536.56" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="361.58" y="536.56" font-size="9.00" class="sc-loraregular">19</text><text x="372.42" y="536.56" font-size="9.00" class="sc-notoserifcjksc">个不同场景上进行评估。越低越好。我们</text><text x="72.00" y="548.26" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="83.37" y="548.26" font-size="9.00" class="sc-loraregular sc-k">Gray Swan</text><text x="130.37" y="548.26" font-size="9.00" class="sc-notoserifcjksc">合作发现并修正了该基准测试中的评分问题；此处所示数字反映了更新后的评分，可能与以往系统卡中</text><text x="72.00" y="559.96" font-size="9.00" class="sc-notoserifcjksc">报告的数字有所不同。</text><text x="72.00" y="603.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="603.66" font-size="11.00" class="sc-notoserifcjksc">取得了与我们能力最强的模型</text><text x="302.32" y="603.66" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="425.20" y="603.66" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，在</text><text x="72.00" y="619.28" font-size="11.00" class="sc-loraregular sc-k">k=100</text><text x="104.18" y="619.28" font-size="11.00" class="sc-notoserifcjksc">时，关闭思考的攻击成功率（</text><text x="247.18" y="619.28" font-size="11.00" class="sc-loraregular sc-k">attack success rate</text><text x="344.53" y="619.28" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="369.42" y="619.28" font-size="11.00" class="sc-loraregular sc-k">6.0%</text><text x="394.72" y="619.28" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考（</text><text x="493.72" y="619.28" font-size="11.00" class="sc-loraregular sc-k">adaptive</text><text x="72.00" y="634.90" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37" y="634.90" font-size="11.00" class="sc-notoserifcjksc">）时为</text><text x="150.26" y="634.90" font-size="11.00" class="sc-loraregular">4.8%</text><text x="174.68" y="634.90" font-size="11.00" class="sc-notoserifcjksc">。这相比</text><text x="221.58" y="634.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="304.64" y="634.90" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="315.64" y="634.90" font-size="11.00" class="sc-loraregular sc-k">k=100</text><text x="347.81" y="634.90" font-size="11.00" class="sc-notoserifcjksc">时关闭思考为</text><text x="416.71" y="634.90" font-size="11.00" class="sc-loraregular">14.8%</text><text x="445.13" y="634.90" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考</text><text x="72.00" y="650.52" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="650.52" font-size="11.00" class="sc-loraregular sc-k">21.7%</text><text x="112.80" y="650.52" font-size="11.00" class="sc-notoserifcjksc">）有所改进。</text><text x="178.80" y="650.52" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="217.09" y="650.52" font-size="11.00" class="sc-notoserifcjksc">模型现已使该</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">过去，我们也报告过该基准测试中</text><text x="228.10" y="691.01" font-size="10.00" class="sc-loraregular">“</text><text x="232.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">直接提示词注入</text><text x="302.10" y="691.01" font-size="10.00" class="sc-loraregular">”</text><text x="305.59" y="691.01" font-size="10.00" class="sc-notoserifcjksc">子集的结果。直接提示词注入涉及恶意用户，而本节</text><text x="72.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">基准测试饱和，限制了其在追踪进一步进展方面的用处。我们正在积极开发用于评估未来模型的</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">基准测试。</text><text x="72.00" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景针对自适应攻击者的鲁棒性</text><text x="72.00" y="161.44" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="157.77" font-size="6.60" class="sc-loraregular">10</text><text x="364.50" y="161.44" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="177.06" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新颖方法的攻击。自</text><text x="72.00" y="192.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.5</text><text x="157.70" y="192.68" font-size="11.00" class="sc-notoserifcjksc">起，我们一直在报告能更好地逼近现实世界对手能力的自适应评估，并且随着</text><text x="72.00" y="208.30" font-size="11.00" class="sc-notoserifcjksc">模型的提升，我们通过内部开发以及与外部研究合作伙伴的合作，持续加强这些评估。</text><text x="72.00" y="290.97" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="290.97" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="323.13" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="323.13" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="176.35" y="323.13" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35" y="323.13" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="361.45" y="323.13" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35" y="323.13" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39" y="319.46" font-size="6.60" class="sc-loraregular">11</text><text x="433.19" y="323.13" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在</text><text x="72.00" y="338.75" font-size="11.00" class="sc-notoserifcjksc">编程环境中对提示词注入攻击的鲁棒性。</text><text x="270.00" y="338.75" font-size="11.00" class="sc-loraregular">Shade</text><text x="303.93" y="338.75" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="446.93" y="338.75" font-size="11.00" class="sc-loraregular sc-k">reinforcement</text><text x="72.00" y="354.37" font-size="11.00" class="sc-loraregular sc-k">learning</text><text x="113.90" y="354.37" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，不断提升其利用模型漏洞的表现。</text><text x="388.90" y="354.37" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="474.85" y="354.37" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="488.75" y="354.37" font-size="11.00" class="sc-loraregular">0%</text><text x="508.04" y="354.37" font-size="11.00" class="sc-notoserifcjksc">的攻</text><text x="72.00" y="369.99" font-size="11.00" class="sc-notoserifcjksc">击成功率使该评估的先前版本饱和，因此我们与</text><text x="305.89" y="369.99" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="363.35" y="369.99" font-size="11.00" class="sc-notoserifcjksc">合作创建了一个更强的变体，对我们</text><text x="72.00" y="385.61" font-size="11.00" class="sc-notoserifcjksc">的模型施加更大的对抗压力。</text><text x="72.00" y="446.70" font-size="11.00" class="sc-notoserifcjksc">下表及今后的所有报告均反映了使用比我们以往系统卡中所报告的更强攻击者进行的测试。攻击</text><text x="72.00" y="462.32" font-size="11.00" class="sc-notoserifcjksc">者在一组</text><text x="118.89" y="462.32" font-size="11.00" class="sc-loraregular">40</text><text x="134.58" y="462.32" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，每个测试用例有</text><text x="313.47" y="462.32" font-size="11.00" class="sc-loraregular">200</text><text x="335.93" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次尝试。我们报告攻击者在</text><text x="470.83" y="462.32" font-size="11.00" class="sc-loraregular">1</text><text x="477.72" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次和</text><text x="502.62" y="462.32" font-size="11.00" class="sc-loraregular">200</text><text x="525.08" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="477.94" font-size="11.00" class="sc-notoserifcjksc">尝试后成功的测试用例百分比。我们比较了在有无我们为保护该场景下用户而设计的额外安全防</text><text x="72.00" y="493.56" font-size="11.00" class="sc-notoserifcjksc">护措施时模型的鲁棒性。</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">10</text><text x="77.91 85.48 90.64 95.27 99.18 101.70 104.33 113.51 115.97 118.49 121.12 126.47 130.34 132.97 138.13 140.85 143.31 145.94 148.99 154.36 160.50 165.87 171.32 174.37 176.83 179.46 185.86 191.85 197.27 199.90 204.99 208.96 212.83 217.99 223.31 228.61 234.03 238.36 240.99 249.93 255.73 260.73 266.15 270.78 273.41 278.04 283.41 288.68 294.53 300.60 306.58 309.08 311.71 317.34 321.21 325.47 331.32 337.39 342.87 348.29 352.62 355.25 360.41 366.39 371.55 377.52 381.39 384.20 389.20 394.62 397.25 402.34 406.31 410.18 415.34 420.66 426.03 430.66 433.29 439.03 444.31 450.28 455.44 460.07 464.70 467.33 473.31 478.73 482.06 487.48 493.55 498.18 503.60" y="678.21" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="365.45 371.35 375.32 379.19 385.16 389.79 392.29 395.98 402.88 408.04 412.37 417.67 420.48 425.14 427.60 433.45 437.73 443.26 450.16 455.32 461.14 465.42 472.32 477.69 483.14 486.78 492.83 495.14 501.35 507.13 513.27 518.49" y="692.41" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2510.09023</text><text x="72.00" y="703.27" font-size="6.00" class="sc-loraregular">11</text><text x="79.00" y="706.61" font-size="10.00" class="sc-notoserifcjksc">不要与</text><text x="111.63 117.30 125.10 131.36 138.71 144.73 149.62 155.88 </text><text x="472.75" y="132.25" font-size="10.99" class="sc-lorabold" fill="#ffffff">200</text><text x="495.49" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="72.00" y="383.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="383.39" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">编程环境中</text><text x="172.08" y="383.39" font-size="9.00" class="sc-lorabold sc-k">Shade</text><text x="200.29" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击的攻击成功率</text><text x="335.29" y="383.39" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="452.29" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="470.29" y="383.39" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数</text><text x="72.00" y="395.09" font-size="9.00" class="sc-notoserifcjksc">以下划线标出（但未考虑误差范围）。我们报告单次尝试攻击者以及有</text><text x="353.37" y="395.09" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="395.09" font-size="9.00" class="sc-notoserifcjksc">次尝试来改进攻击的自适应攻击者的攻击</text><text x="72.00" y="406.79" font-size="9.00" class="sc-notoserifcjksc">成功率。对于自适应攻击者，攻击成功率衡量的是针对给定目标，</text><text x="333.00" y="406.79" font-size="9.00" class="sc-loraregular">200</text><text x="351.38" y="406.79" font-size="9.00" class="sc-notoserifcjksc">次尝试中是否至少有一次成功。</text><text x="72.00" y="462.20" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="462.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="154.04" y="462.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="167.93" y="462.20" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="224.80" y="462.20" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="257.80" y="462.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="342.23" y="462.20" font-size="11.00" class="sc-notoserifcjksc">在编程环境中对提示词注入攻击的鲁棒性</text><text x="72.00" y="477.82" font-size="11.00" class="sc-notoserifcjksc">有所提升。在无安全防护措施的情况下，开启自适应思考时，</text><text x="369.00" y="477.82" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="453.43" y="477.82" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="467.32" y="477.82" font-size="11.00" class="sc-loraregular">1</text><text x="474.22" y="477.82" font-size="11.00" class="sc-notoserifcjksc">次尝试的攻击</text><text x="72.00" y="493.44" font-size="11.00" class="sc-notoserifcjksc">成功率从</text><text x="118.89" y="493.44" font-size="11.00" class="sc-loraregular">25.92%</text><text x="158.23" y="493.44" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="183.12" y="493.44" font-size="11.00" class="sc-loraregular">2.34%</text><text x="213.39" y="493.44" font-size="11.00" class="sc-notoserifcjksc">，将</text><text x="238.29" y="493.44" font-size="11.00" class="sc-loraregular">200</text><text x="260.75" y="493.44" font-size="11.00" class="sc-notoserifcjksc">次尝试的攻击成功率从</text><text x="373.64" y="493.44" font-size="11.00" class="sc-loraregular sc-k">97.5%</text><text x="405.49" y="493.44" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="430.38" y="493.44" font-size="11.00" class="sc-loraregular sc-k">60.0%</text><text x="462.34" y="493.44" font-size="11.00" class="sc-notoserifcjksc">；关闭思考时，</text><text x="72.00" y="509.06" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="85.89" y="509.06" font-size="11.00" class="sc-loraregular">1</text><text x="92.79" y="509.06" font-size="11.00" class="sc-notoserifcjksc">次尝试的攻击成功率从</text><text x="205.68" y="509.06" font-size="11.00" class="sc-loraregular">54.14%</text><text x="242.78" y="509.06" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="267.67" y="509.06" font-size="11.0 e</text><text x="163.83" y="656.50" font-size="11.00" class="sc-notoserifcjksc">自适应攻击者评估</text><text x="254.72" y="656.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="293.01" y="656.50" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性，在这类环境</text><text x="72.00" y="672.12" font-size="11.00" class="sc-notoserifcjksc">中，模型直接与图形用户界面（</text><text x="226.00" y="672.12" font-size="11.00" class="sc-loraregular">GUI</text><text x="246.33" y="672.12" font-size="11.00" class="sc-notoserifcjksc">）交互。与编程评估类似，攻击者在</text><text x="425.22" y="672.12" font-size="11.00" class="sc-loraregular">14</text><text x="438.08" y="672.12" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，</text></svg></div>
