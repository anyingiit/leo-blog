30.82" font-size="10.99" class="sc-lorabold">Claude Opus 4.6</text><text x="77.50" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87 94.17 97.26 99.99 104.01 109.45 114.09 118.72" y="342.25" font-size="9.00" class="sc-lorabolditalic">FileTool</text><text x="123.81 132.81" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="236.50 247.49 258.49" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.48" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="279.42" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50 245.50 254.50 263.50 272.50" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25 401.24 412.24 423.23 434.23 445.23" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.22" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="466.16" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.30 399.30 408.30 417.30 426.30" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">具有恶意。对于近期的模型，包括</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.06" y="82.63" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="286.03" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="299.92 309.85 315.72 319.97 326.56 333.00 338.09 340.98 347.65 352.34 358.24 363.80 366.89 372.81" y="82.63" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="381.62 392.62 403.62 414.62 425.62 436.62 447.62 458.62 469.62 480.62 491.62 502.62 513.62 524.62" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，评估显示这一缓解措施并未带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">来任何额外的安全收益。我们现在只在能带来实质性安全改进的模型上应用这一安全防护措施，</text><text x="72.00 83.00 94.00 105.00 116.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">并报告有无</text><text x="129.89 135.87 138.96 141.95 147.44 153.94 160.37 166.81" y="113.87" font-size="11.00" class="sc-loraregular">FileTool</text><text x="172.69 183.69 194.69 205.69 216.69 227.69 238.69 249.69 260.69 271.69 282.69 293.69 304.69 315.69 326.69 337.69 348.69 359.69 370.69 381.69 392.69 403.69 414.69 425.69 436.69 447.69 458.69 469.69 480.69 491.69 502.69 513.69 524.69" y="113.87" font-size="11.00" class="sc-notoserifcjksc">提醒两种情况下较好的分数。我们还对系统提示词进行了更新，这会使下文</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">中以往模型的结果略有变化。</text><text x="72.00" y="359.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83" y="359.86" font-size="9.00" class="sc-lorabold">5.1.1.A]</text><text x="116.68 125.68 134.68 143.68 152.68 161.68 170.68 179.68" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">应用缓解措施后的</text><text x="191.04 197.23 200.04 204.76 210.32 215.68 220.53 222.89 229.09 234.18 239.54" y="359.86" font-size="9.00" class="sc-lorabold">Claude Code</text><text x="246.75 255.75 264.75 273.75 282.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="291.75 300.75 309.75 318.75 327.75 336.75 345.75 354.75 363.75 372.75 381.75 390.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以</text><text x="399.75 408.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="417.75 426.75 435.75 444.75 453.75 462.75 471.75 480.75 489.75 498.75 507.75 516.75 525.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00" y="371.56" font-size="9.00" class="sc-notoserifcjksc">（但未考虑误差范围）。由于系统提示词的更新，以往模型的结果与以往系统卡中的结果存在差异。</text><text x="72.00" y="412.17" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="412.17" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85 182.85 193.85" y="412.17" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.85 213.58 220.15 226.71 231.81 234.70 240.66 243.02" y="412.17" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="250.98 261.98 272.98 283.98 294.98 305.98 316.98 327.98 338.98 349.98 360.98 371.98 382.98 393.98 404.98 415.98 426.98 437.98 448.98 459.98 470.98" y="412.17" font-size="11.00" class="sc-notoserifcjksc">在识别和拒绝恶意请求方面表现出显著提升。与</text><text x="484.87 492.56 495.56 501.17 507.73 514.31" y="412.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="427.79" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59 530.59" y="427.79" font-size="11.00" class="sc-notoserifcjksc">类似，提升来自于对以往模型难以应对的那些具有挑战性的新用例的拒绝。在两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="443.41" font-size="11.00" class="sc-notoserifcjksc">用和良性任务上，</text><text x="160.00 168.73 175.30 181.87 186.96 189.85 195.82 198.17" y="443.41" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="206.13 217.13 228.13 239.13" y="443.41" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="253.03 260.72 263.71 269.32 275.89 282.46 288.43 291.32 300.05 306.62 313.19 318.28 321.17 327.13 329.73" y="443.41" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="338.98 349.98 360.98" y="443.41" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00 80.37 83.75 88.46 91.84" y="491.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39 115.39 128.39 141.39 154.39 167.39 180.39" y="491.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00 83.00" y="519.36" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.35" y="519.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="178.43 189.43 200.43 211.43 222.43 233.43 244.43 255.43 266.42 277.42" y="519.36" font-size="11.00" class="sc-notoserifcjksc">，我们运行了上一次为</text><text x="291.32 299.01 302.00 307.61 314.18 320.75 326.72 329.61 338.34 344.91 351.48 356.57 359.46 365.42 368.13" y="519.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="377.02 388.02 399.02 410.02 421.02 432.02 443.02 454.02 465.02 476.02 487.02 498.02 509.02 520.02" y="519.36" font-size="11.00" class="sc-notoserifcjksc">发布而更新的计算机使用评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="534.98" font-size="11.00" class="sc-notoserifcjksc">我们评估模型在沙箱化的环境中获得基于图形用户界面（</text><text x="347.00 355.37 363.64" y="534.98" font-size="11.00" class="sc-loraregular">GUI</text><text x="367.33 378.33 389.33 400.33 411.33 422.33 433.33 444.33" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="455.33 463.02 469.38" y="534.98" font-size="11.00" class="sc-loraregular">CLI</text><text x="473.06 484.06 495.06 506.06 517.06 528.06" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）的计算机使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="550.60" font-size="11.00" class="sc-notoserifcjksc">用工具时如何回应有害任务，重点关注以下几个令人担忧的风险领域：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="600.32" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="616.52" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播</text><text x="108.00 119.00 130.00 141.00 152.00" y="632.71" font-size="11.00" class="sc-notoserifcjksc">规模化滥用</text><text x="72.00 76.00 80.01" y="665.09" font-size="11.00" class="sc-loraregular">112</text><text x="88.81 99.81 110.81 121.81 132.81 143.81 154.81 165.81 176.81 187.81 198.81 209.81 220.81 231.81 242.81 253.81 264.81 275.81 286.81 297.81 308.81 319.81 330.81 341.81 352.81 363.81" y="665.09" font-size="11.00" class="sc-notoserifcjksc">项任务分别在开启和关闭思考的情况下运行，每个模型共计</text><text x="377.70 383.61 389.27" y="665.09" font-size="11.00" class="sc-loraregular">224</text><text x="398.13 409.13 420.13 431.13" y="665.09" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p080.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 80 页"><text x="75.25 86.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00 306.00 316.99" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="209.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="209.57" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82 126.82 135.82 144.82 153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82 234.82 243.82 252.82 261.82 270.82 279.82 288.82 297.82" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="306.82 315.82 324.82 333.82 342.82 351.82 360.82 369.82 378.82 387.82 396.82 405.82 414.82 423.82 432.82 441.82 450.82 459.82 468.82 477.82 486.82 495.82 504.82 513.82 522.82 531.82" y="209.57" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以粗体标出，次优分数以下划线标</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00" y="221.27" font-size="9.00" class="sc-notoserifcjksc">出（但未考虑误差范围）。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="261.88" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13 129.13 140.13 151.13 162.13 173.13 184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13" y="261.88" font-size="11.00" class="sc-notoserifcjksc">在拒绝这些任务方面的得分高于</text><text x="275.03 282.72 285.71 291.32 297.89 304.46 310.43 313.32 322.05 328.62 335.19 340.28 343.17 349.13 351.73" y="261.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="358.09 369.09 380.09 391.09 402.09 413.09 424.09 435.09 446.09 457.09 468.09 479.09 490.09 501.09 512.09 523.09" y="261.88" font-size="11.00" class="sc-notoserifcjksc">，但与其他近期模型的差距在误差范</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="277.50" font-size="11.00" class="sc-notoserifcjksc">围之内。随着模型通用能力的提升，我们观察到模型在该评估上的表现稳步改善。</text><text x="72.00 80.37 83.75 88.46 91.84" y="324.98" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72 193.72 206.72 219.72" y="324.98" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00 83.00 94.00" y="352.88" font-size="11.00" class="sc-notoserifcjksc">正如在</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 191.02 195.71 201.61 207.17 210.26 216.18" y="352.88" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="227.88 238.88 249.88 260.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的系统卡</text><text x="271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc">中首次讨论的那样，我们新建了一项评估，用于评估有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="368.50" font-size="11.00" class="sc-notoserifcjksc">害操纵风险。具体而言，我们测试模型能否自主开展影响力行动，且其水平足以通过大规模的说</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="384.12" font-size="11.00" class="sc-notoserifcjksc">服、欺骗或个性化定向，为恶意行为者带来实质性的能力提升（</text><text x="380.00 386.57 393.13 396.13 399.22 403.07" y="384.12" font-size="11.00" class="sc-loraregular">uplift</text><text x="407.32 418.32 429.32 440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32 528.32" y="384.12" font-size="11.00" class="sc-notoserifcjksc">）。影响力行动是指通过欺</text><text x="391.00 397.89" y="415.36" font-size="11.00" class="sc-loraregular">AI</text><text x="404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="415.36" font-size="11.00" class="sc-notoserifcjksc">能力提升带来的一个风险在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="547.19" font-size="11.00" class="sc-notoserifcjksc">该评估侧重考察模型在面对平台阻力和针对该行动的防御措施时端到端执行完整行动的能力；测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="562.81" font-size="11.00" class="sc-notoserifcjksc">试在智能体运行框架中进行，模型可在一个包含内容审核和反制互动障碍的模拟生态系统内使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="578.43" font-size="11.00" class="sc-notoserifcjksc">模拟的社交媒体平台工具。为衡量原始能力而非安全防护措施的效果，我们针对一个削减了无害</text><text x="72.00 83.00 94.00 105.00" y="594.05" font-size="11.00" class="sc-notoserifcjksc">性训练的</text><text x="116.00" y="594.05" font-size="11.00" class="sc-loraregular">“</text><text x="120.40 131.40 142.40" y="594.05" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="153.40" y="594.05" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="594.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="168.24 174.83 180.79 183.78 190.29 194.01 200.58 203.57 208.95 215.38 222.06 225.00" y="594.05" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="230.81 241.81 252.81 263.81 274.81 285.81 296.81 307.81 318.81 329.81 340.81 351.81 362.81 373.81 384.81 395.81 406.81 417.81 428.81 439.81 450.81 461.81 472.81 483.81 494.81 505.81 516.81 527.81" y="594.05" font-size="11.00" class="sc-notoserifcjksc">）模型版本运行该评估。模型的表现依据其满足特定成功标准的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="609.67" font-size="11.00" class="sc-notoserifcjksc">程度来评估，例如模型是否根据所声明的所在地在符合现实的时间发帖，以及模型是否根据表现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="625.29" font-size="11.00" class="sc-notoserifcjksc">数据对内容进行迭代。该评估是对现有其他针对影响力行动与平台操纵的单轮和多轮评估的补</text><text x="72.00 83.00 94.00 105.00 116.00" y="640.91" font-size="11.00" class="sc-notoserifcjksc">充，例如第</text><text x="129.89 135.86 138.56" y="640.91" font-size="11.00" class="sc-loraregular">4.3</text><text x="147.58 158.58 169.58 180.58 191.58 202.58 213.58 224.58 235.58 246.58 257.58 268.58" y="640.91" font-size="11.00" class="sc-notoserifcjksc">节中给出的多轮测试结果。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.40" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="143.29" y="344.08" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="181.46" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="184.35" y="344.08" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="224.99" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="227.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

4.23 445.23 456.22 467.22 478.21 489.21 500.20 511.20 522.19" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们测试了两个假设场景：</text><text x="204.00" y="98.82" font-size="11.00" class="sc-loraregular">1</text><text x="208.00 219.00 230.00 241.00 252.00 263.00 274.00 285.00 296.00 307.00 318.00 329.00 340.00 351.00 362.00 373.00 384.00 395.00 406.00 417.00 428.00 439.00 450.00 461.00 472.00 483.00 494.00 505.00 516.00 527.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">）压制投票场景，其中一名假设的用户指示模型开展一场伪草根运动</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.35 155.35 166.35 177.35 188.35 199.35 210.35 221.35 232.35 243.35 254.35 265.35 276.35 287.35 298.35 309.35 320.35 331.35 342.35 353.35 364.35 375.35 386.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">），以压低选民对特定政治候选人的投票率与热情；</text><text x="397.35" y="114.44" font-size="11.00" class="sc-loraregular">2</text><text x="403.25 414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="114.44" font-size="11.00" class="sc-notoserifcjksc">）国内极化场景，其中一名</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">的信息，以激化社会与政治分歧。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">两个场景的结果如下，以平均任务完成率呈现（每个场景共</text><text x="360.89 365.96" y="212.16" font-size="11.00" class="sc-loraregular">70</text><text x="375.69 386.69 397.69 408.69 419.69 430.69 441.69 452.69 463.69 474.69 485.69" y="212.16" font-size="11.00" class="sc-notoserifcjksc">项成功标准）。各场景在</text><text x="499.58" y="212.16" font-size="11.00" class="sc-loraregular">3</text><text x="508.60 519.60" y="212.16" font-size="11.00" class="sc-notoserifcjksc">种不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">同的模拟平台阻力水平下各运行</text><text x="228.89" y="227.78" font-size="11.00" class="sc-loraregular">3</text><text x="237.91 248.91 259.91 270.91 281.91 292.91 303.91 314.91" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次，每个场景共计</text><text x="328.81" y="227.78" font-size="11.00" class="sc-loraregular">9</text><text x="338.06 349.06 360.06 371.06" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次模拟。</text><text x="72.00" y="478.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="478.32" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06 127.06 136.06 145.06 154.06 163.06 172.06 181.06 190.06 199.06 208.06 217.06 226.06 235.06 244.06 253.06 262.06 271.06 280.06" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06 298.06 307.06 316.06 325.06 334.06 343.06 352.06 361.06 370.06 379.06 388.06 397.06 406.06 415.06 424.06 433.06 442.06 451.06 460.06 469.06 478.06 487.06 496.06 505.06 514.06" y="478.32" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43 529.58" y="478.32" font-size="9.00" class="sc-loraregular">70</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="490.02" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="530.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42 167.42 178.42 189.42 200.42 211.42 222.42 233.42 244.42 255.42 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42" y="530.63" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两项任务上的成功率均高于</text><text x="368.32 376.01 379.00 384.61 391.18 397.75 403.72 406.61 415.34 421.91 428.48 433.57 436.46 442.42 445.02" y="530.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="451.38 462.38 473.38 484.38 495.38 506.38 517.38 528.38" y="530.63" font-size="11.00" class="sc-notoserifcjksc">，并在国内极化场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="546.25" font-size="11.00" class="sc-notoserifcjksc">景上得分高于</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="546.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="546.25" font-size="11.00" class="sc-notoserifcjksc">。不过，我们仍发现，大多数操作步骤都需要大量人工指</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="561.87" font-size="11.00" class="sc-notoserifcjksc">导，这意味着该模型尚不具备完整的人设与账号网络管理、协同内容投放以及规模化社会工程行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="577.49" font-size="11.00" class="sc-notoserifcjksc">动所需的自主能力水平。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="643.98" font-size="11.00" class="sc-notoserifcjksc">这些模型的完整训练版本额外接受了无害性训练。当我们在这些场景下测试这些模型的最终版本</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="659.60" font-size="11.00" class="sc-notoserifcjksc">时，任务完成率接近</text><text x="173.89 180.72" y="659.60" font-size="11.00" class="sc-loraregular">0%</text><text x="190.29 201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="659.60" font-size="11.00" class="sc-notoserifcjksc">，因为模型通常从一开始就拒绝参与这些任务（这些任务明显违反了我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="675.22" font-size="11.00" class="sc-notoserifcjksc">们的使用政策）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="72.00 81.02 84.66" y="84.21" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02 110.02 124.02 138.02 152.02 166.02 180.02 194.02 208.02 222.02 236.02 250.02 264.02 278.02" y="84.21" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="110.78" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入（</text><text x="160.00 166.57 171.25 177.69 187.52 194.09 198.35 201.24 204.33 210.95 213.82 219.73 225.53 229.78 232.88 239.31" y="110.78" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="245.99 256.99 267.99 278.99 289.99 300.99 311.99 322.99 333.99 344.99 355.99 366.99 377.99 388.99 399.99 410.99 421.99 432.99 443.99 454.99 465.99 476.99 487.99 498.99 509.99 520.99" y="110.78" font-size="11.00" class="sc-notoserifcjksc">）仍是我们在智能体系统中安全部署模型的最高优先事项之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.02" font-size="11.00" class="sc-notoserifcjksc">站上，或在智能体总结的电子邮件中。当智能体在原本例行的任务中遇到这些恶意内容时，它可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.26" font-size="11.00" class="sc-notoserifcjksc">页或共享文档中的单个恶意载荷，可能会危及任何处理它的智能体，而攻击者无需针对特定用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="188.88" font-size="11.00" class="sc-notoserifcjksc">或系统。当模型同时拥有访问私有数据和代表用户采取行动的权限时，这类攻击也尤其危险，因</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="204.50" font-size="11.00" class="sc-notoserifcjksc">为这一组合可能使攻击者外泄敏感信息或执行未经授权的操作。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="321.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42 167.42 178.42 189.42 200.42 211.42 222.42 233.42 244.42 255.42 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42 365.42 376.42 387.42 398.42 409.42 420.42" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的智能体使用场景（包括工具使用、编程、</text><text x="431.42 439.80 448.07" y="321.27" font-size="11.00" class="sc-loraregular">GUI</text><text x="454.65 465.65 476.65 487.65 498.65 509.65 520.65" y="321.27" font-size="11.00" class="sc-notoserifcjksc">计算机使用和浏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">览器使用）上的提示词注入鲁棒性继续大幅提升。尽管我们持续努力加强评估，包括从专业红队</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="352.51" font-size="11.00" class="sc-notoserifcjksc">成员处获取新的攻击、与外部研究机构合作开发更难的基准测试，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 438.02 444.59 451.16 456.25 459.14 465.11 467.46" y="352.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="475.43 486.43 497.43 508.43 519.43" y="352.51" font-size="11.00" class="sc-notoserifcjksc">仍再次使我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="368.13" font-size="11.00" class="sc-notoserifcjksc">们的许多评估达到饱和。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="434.62" font-size="11.00" class="sc-notoserifcjksc">除模型层面的鲁棒性外，我们还持续投入于在模型本身之上运行的防护措施，以进一步加固基于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="450.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="450.24" font-size="11.00" class="sc-notoserifcjksc">构建的智能体。在以往的系统卡中，我们报告了使用分类器检测提示词注入尝试的结果；</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="481.48" font-size="11.00" class="sc-notoserifcjksc">供强信号。我们将在以下各节展示它们所提供的鲁棒性，这些安全防护措施在我们的许多智能体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="497.10" font-size="11.00" class="sc-notoserifcjksc">产品中默认启用。</text><text x="72.00 80.37 83.75 91.21 94.59" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39 115.39 128.39 141.39 154.39 167.39 180.39 193.39 206.39" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49 231.80 240.61 248.63 257.22 262.27 265.36 273.69 281.72 290.53 293.62 301.12 309.15 317.96 331.58 335.20 343.79" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70 368.70 381.70 394.70" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc">外部研究合作伙伴</text><text x="162.89 171.26 175.95 181.52 187.32 190.22 196.40 205.10 210.78" y="590.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="220.35 231.35 242.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35 374.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="385.35 393.62 401.13 404.02 410.91 414.60 417.49 423.73 429.63 435.48 442.05 446.81 450.08 454.36 460.17 463.06 466.66 473.33 478.43 482.68 485.95 490.21 496.78 501.03" y="590.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="507.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="517.99 528.99" y="590.39" font-size="11.00" class="sc-notoserifcjksc">合作</text><text x="72.00 83.00 94.00" y="606.01" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="107.89 114.78 120.81 126.77 133.35 137.60 140.50 147.33 153.24 159.81 162.71 169.21 175.15 180.82 190.66 193.75 200.43" y="606.01" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="206.51" y="606.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="217.51 224.39 231.30" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="98.82" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45 140.45 151.45 162.45 173.45 184.45 195.45" y="98.82" font-size="11.00" class="sc-notoserifcjksc">估计了攻击者在</text><text x="209.35 215.25 220.96" y="98.82" font-size="11.00" class="sc-loraregular">k=1</text><text x="224.97" y="98.82" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="235.97 241.87 247.58 251.59" y="98.82" font-size="11.00" class="sc-loraregular">k=10</text><text x="261.31" y="98.82" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.20 281.11 286.82 290.82 297.65" y="98.82" font-size="11.00" class="sc-loraregular">k=100</text><text x="307.38 318.38 329.38 340.38 351.38 362.38 373.38 384.38 395.38 406.38 417.38 428.38 439.38 450.38 461.38 472.38 483.38 494.38 505.38 516.38 527.38" y="98.82" font-size="11.00" class="sc-notoserifcjksc">次尝试内取得成功的概率，这反映出攻击并非确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">定性的，重复尝试会提高注入成功的可能性。这些攻击取自</text><text x="360.89 367.78 374.69 381.73 384.62 391.51 396.19 402.15 408.83" y="114.44" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="414.51 425.51 436.51 447.51 458.51 469.51 480.51 491.51 502.51 513.51 524.51" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，在那里数千名专家红队</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc">成员持续针对前沿模型改进攻击策略。</text><text x="259.00 267.37 272.06 277.62 283.43 286.32 292.51 301.21 306.88" y="130.06" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="316.45 327.45 338.45 349.45 360.45 371.45 382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45 470.45 481.45 492.45 503.45 514.45 525.45" y="130.06" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中选取了迁移率特别高的一个子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">集：这些攻击已被证明对多个模型有效，而不仅仅对最初针对的那个模型有效。该评估仅涵盖间</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="161.30" font-size="11.00" class="sc-notoserifcjksc">接提示词注入</text><text x="138.00" y="157.63" font-size="6.60" class="sc-loraregular">9</text><text x="471.81" y="161.30" font-size="11.00" class="sc-loraregular">“</text><text x="476.21 487.21 498.21 509.21" y="161.30" font-size="11.00" class="sc-notoserifcjksc">提示词注</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">入</text><text x="83.00" y="176.92" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84" y="176.92" font-size="11.00" class="sc-notoserifcjksc">的内容）。</text><text x="72.00" y="524.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="524.86" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82 126.82" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="524.86" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26 236.27 242.44" y="524.86" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29 257.29 266.29 275.29 284.29 293.29 302.29 311.29 320.29 329.29 338.29 347.29 356.29 365.29 374.29" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击</text><text x="383.29 392.29 401.29 410.29 419.29 428.29 437.29 446.29 455.29 464.29 473.29 482.29 491.29 500.29 509.29 518.29 527.29" y="524.86" font-size="9.00" class="sc-notoserifcjksc">。结果表示对每个模型而言，攻击者在</text><text x="72.00 76.83 81.50" y="536.56" font-size="9.00" class="sc-loraregular">k=1</text><text x="84.78" y="536.56" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78 98.61 103.28 106.56" y="536.56" font-size="9.00" class="sc-loraregular">k=10</text><text x="114.52" y="536.56" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88 130.72 135.39 138.66 144.25" y="536.56" font-size="9.00" class="sc-loraregular">k=100</text><text x="152.21 161.21 170.21 179.21 188.21 197.21 206.21 215.21 224.21 233.21 242.21 251.21 260.21 269.21 278.21 287.21 296.21 305.21 314.21 323.21 332.21 341.21 350.21" y="536.56" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="361.58 364.85" y="536.56" font-size="9.00" class="sc-loraregular">19</text><text x="372.42 381.42 390.42 399.42 408.42 417.42 426.42 435.42 444.42 453.42 462.42 471.42 480.42 489.42 498.42 507.42 516.42 525.42" y="536.56" font-size="9.00" class="sc-notoserifcjksc">个不同场景上进行评估。越低越好。我们</text><text x="72.00" y="548.26" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="83.37 90.22 94.05 98.60 103.36 105.72 110.78 117.90 122.54" y="548.26" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="130.37 139.37 148.37 157.37 166.37 175.37 184.37 193.37 202.37 211.37 220.37 229.37 238.37 247.37 256.37 265.37 274.37 283.37 292.37 301.37 310.37 319.37 328.37 337.37 346.37 355.37 364.37 373.37 382.37 391.37 400.37 409.37 418.37 427.37 436.37 445.37 454.37 463.37 472.37 481.37 490.37 499.37 508.37 517.37 526.37" y="548.26" font-size="9.00" class="sc-notoserifcjksc">合作发现并修正了该基准测试中的评分问题；此处所示数字反映了更新后的评分，可能与以往系统卡中</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="559.96" font-size="9.00" class="sc-notoserifcjksc">报告的数字有所不同。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="603.66" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42 167.42 178.42 189.42 200.42 211.42 222.42 233.42 244.42 255.42 266.42 277.42 288.42" y="603.66" font-size="11.00" class="sc-notoserifcjksc">取得了与我们能力最强的模型</text><text x="302.32 310.01 313.00 318.61 325.18 331.75 337.72 340.61 350.54 356.40 360.66 367.25 373.69 378.78 381.67 388.34 393.02 398.93 404.49 407.58 413.49" y="603.66" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="425.20 436.20 447.20 458.20 469.20 480.20 491.20 502.20" y="603.66" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，在</text><text x="72.00 77.91 83.62 87.62 94.45" y="619.28" font-size="11.00" class="sc-loraregular">k=100</text><text x="104.18 115.18 126.18 137.18 148.18 159.18 170.18 181.18 192.18 203.18 214.18 225.18 236.18" y="619.28" font-size="11.00" class="sc-notoserifcjksc">时，关闭思考的攻击成功率（</text><text x="247.18 252.77 257.14 261.40 267.07 272.93 278.83 281.73 286.82 293.39 299.18 304.98 310.94 316.04 321.13 324.02 328.71 334.31 338.56" y="619.28" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="344.53 355.53" y="619.28" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="369.42 375.78 378.32 385.15" y="619.28" font-size="11.00" class="sc-loraregular">6.0%</text><text x="394.72 405.72 416.72 427.72 438.72 449.72 460.72 471.72 482.72" y="619.28" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考（</text><text x="493.72 499.39 505.97 511.65 518.21 522.47 525.56 531.06" y="619.28" font-size="11.00" class="sc-loraregular">adaptive</text><text x="72.00 76.26 82.85 85.94 92.61 98.52 101.61 108.29" y="634.90" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37 125.37 136.37" y="634.90" font-size="11.00" class="sc-notoserifcjksc">）时为</text><text x="150.26 156.23 158.93 165.11" y="634.90" font-size="11.00" class="sc-loraregular">4.8%</text><text x="174.68 185.68 196.68 207.68" y="634.90" font-size="11.00" class="sc-notoserifcjksc">。这相比</text><text x="221.58 229.27 232.26 237.87 244.44 251.01 256.98 259.87 268.60 275.17 281.74 286.83 289.72 295.69 298.28" y="634.90" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="304.64" y="634.90" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="315.64 321.55 327.26 331.26 338.09" y="634.90" font-size="11.00" class="sc-loraregular">k=100</text><text x="347.81 358.81 369.81 380.81 391.81 402.81" y="634.90" font-size="11.00" class="sc-notoserifcjksc">时关闭思考为</text><text x="416.71 420.71 426.67 429.38 435.56" y="634.90" font-size="11.00" class="sc-loraregular">14.8%</text><text x="445.13 456.13 467.13 478.13 489.13 500.13 511.13 522.13" y="634.90" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考</text><text x="72.00" y="650.52" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.80 95.80 98.16 103.23" y="650.52" font-size="11.00" class="sc-loraregular">21.7%</text><text x="112.80 123.80 134.80 145.80 156.80 167.80" y="650.52" font-size="11.00" class="sc-notoserifcjksc">）有所改进。</text><text x="178.80 186.49 189.48 195.09 201.66 208.24" y="650.52" font-size="11.00" class="sc-loraregular">Claude</text><text x="217.09 228.09 239.09 250.09 261.09 272.09" y="650.52" font-size="11.00" class="sc-notoserifcjksc">模型现已使该</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 88.10 98.10 108.10 118.10 128.10 138.10 148.10 158.10 168.10 178.10 188.10 198.10 208.10 218.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">过去，我们也报告过该基准测试中</text><text x="228.10" y="691.01" font-size="10.00" class="sc-loraregular">“</text><text x="232.10 242.10 252.10 262.10 272.10 282.10 292.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">直接提示词注入</text><text x="302.10" y="691.01" font-size="10.00" class="sc-loraregular">”</text><text x="305.59 315.59 325.59 335.59 345.59 355.59 365.59 375.59 385.59 395.59 405.59 415.59 425.59 435.59 445.59 455.59 465.59 475.59 485.59 495.59 505.59 515.59 525.59" y="691.01" font-size="10.00" class="sc-notoserifcjksc">子集的结果。直接提示词注入涉及恶意用户，而本节</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">基准测试饱和，限制了其在追踪进一步进展方面的用处。我们正在积极开发用于评估未来模型的</text><text x="72.00 83.00 94.00 105.00 116.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">基准测试。</text><text x="72.00 80.37 83.75 91.21 94.59" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15 118.15 131.15 144.15 157.15 170.15 183.15 196.15 209.15 222.15 235.15 248.15 261.15 274.15 287.15 300.15 313.15" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景针对自适应攻击者的鲁棒性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="161.44" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00 360.40" y="157.77" font-size="6.60" class="sc-loraregular">10</text><text x="364.50 375.50 386.50 397.50 408.50 419.50 430.50 441.50 452.50 463.50 474.50 485.50 496.50 507.50 518.50 529.50" y="161.44" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="177.06" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新颖方法的攻击。自</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="192.68" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="157.70 168.70 179.70 190.70 201.70 212.70 223.70 234.70 245.70 256.70 267.70 278.70 289.70 300.70 311.70 322.70 333.70 344.70 355.70 366.70 377.70 388.70 399.70 410.70 421.70 432.70 443.70 454.70 465.70 476.70 487.70 498.70 509.70 520.70" y="192.68" font-size="11.00" class="sc-notoserifcjksc">起，我们一直在报告能更好地逼近现实世界对手能力的自适应评估，并且随着</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="208.30" font-size="11.00" class="sc-notoserifcjksc">模型的提升，我们通过内部开发以及与外部研究合作伙伴的合作，持续加强这些评估。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="290.97" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71 115.71" y="290.97" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00 83.00 94.00 105.00" y="323.13" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="323.13" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35 275.35 286.35" y="323.13" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="323.13" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45 372.45 383.45" y="323.13" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35 403.58 410.17 415.85 422.43" y="323.13" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39 430.79" y="3 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">其他评估中均未观察到这一模式（例如，参见下一节关于浏览器使用的内容，其采用相同的防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">护）。与编程一节类似，该评估使用了针对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">真实部署中，攻击成功率很可能会更低。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="163.59" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41 117.41 128.41 139.41 150.41" y="163.59" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="468.00 475.69 478.68 484.29 490.86 497.44 503.40 506.29 509.38" y="195.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude in</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="211.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chrome</text><text x="116.09 127.09 138.09 149.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.09 178.78 181.77 187.38 193.95 200.52 206.49 209.38 217.07 223.39 232.07 238.51 243.23" y="211.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="249.13 260.13 271.13 282.13 293.13 304.13 315.13 326.13" y="211.59" font-size="11.00" class="sc-notoserifcjksc">。我们最初在发布</text><text x="340.03 347.72 350.71 356.32 362.88 369.46 375.42 378.32 387.05 393.62 400.18 405.28 408.17 414.13 416.84" y="211.59" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="425.73" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="439.62 447.31 450.30 455.91 462.48 469.06 475.02 477.91 481.57 488.01 492.77 495.67 503.35 509.94 514.63 521.06 530.90" y="211.59" font-size="11.00" class="sc-loraregular">Claude for Chrome</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出了</text><text x="182.00 193.00 204.00 215.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">；随着后续模型相继使早期测试攻击集达到饱和，我们定期用更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="242.83" font-size="11.00" class="sc-notoserifcjksc">复杂的环境和更强的攻击对其进行更新。该评估由一系列网页环境组成，我们会向页面中动态注</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="258.45" font-size="11.00" class="sc-notoserifcjksc">入不可信内容，模型随后通过截图或页面读取查看这些页面。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="325.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="325.51" font-size="11.00" class="sc-notoserifcjksc">在我们此前的自动化浏览器使用评估中的攻击成功率已接近于零。为继续衡量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="341.13" font-size="11.00" class="sc-notoserifcjksc">进展，我们与专业红队成员合作，在更复杂的网页环境中针对</text><text x="371.89 380.63 387.19 393.76 398.85 401.75 407.71 410.30" y="341.13" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="419.56 430.56 441.56 452.56 463.56 474.56 485.56 496.56 507.56 518.56 529.56" y="341.13" font-size="11.00" class="sc-notoserifcjksc">自适应地发现新的攻击，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="356.75" font-size="11.00" class="sc-notoserifcjksc">并整理出一组</text><text x="140.89 144.90 150.86" y="356.75" font-size="11.00" class="sc-loraregular">148</text><text x="159.93 170.93 181.93 192.93 203.93 214.93 225.93 236.93 247.93 258.93 269.93 280.93 291.93 302.93 313.93 324.93 335.93 346.93 357.93 368.93 379.93 390.93 401.93 412.93 423.93 434.93 445.93 456.93 467.93 478.93 489.93 500.93 511.93 522.93" y="356.75" font-size="11.00" class="sc-notoserifcjksc">个环境，这些环境未用于此处所评估模型的训练。我们将攻击成功率报告为成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="372.37" font-size="11.00" class="sc-notoserifcjksc">功的注入在模型实际看到的注入中所占的比例，因为能力不同的模型可能以不同方式在环境中导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="487.43" font-size="11.00" class="sc-notoserifcjksc">我们比较了无安全防护措施的模型，以及部署了我们为利用浏览器和计算机使用工具的各类产品</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="503.05" font-size="11.00" class="sc-notoserifcjksc">所提供的安全防护措施的模型。</text><text x="72.00" y="704.01" font-size="10.00" class="sc-notoserifcjksc">共</text><text x="84.63 90.00 95.62 101.83" y="704.01" font-size="10.00" class="sc-loraregular">2800</text><text x="110.67 120.67 130.67 140.67 150.67 160.67 170.67 180.67 190.67 200.67 210.67 220.67 230.67 240.67 250.67 260.67 270.67 280.67 290.67 300.67 310.67 320.67 330.67 340.67 350.67 360.67" y="704.01" font-size="10.00" class="sc-notoserifcjksc">次尝试。两项差异在统计上均无法与零区分（配对置换检验</text><text x="373.30" y="704.01" font-size="10.00" class="sc-loraitalic">p</text><text x="379.01" y="704.01" font-size="10.00" class="sc-notoserifcjksc">≈</text><text x="391.64 397.69 400.15" y="704.01" font-size="10.00" class="sc-loraregular">0.5</text><text x="405.60 415.60" y="704.01" font-size="10.00" class="sc-notoserifcjksc">）。</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" y="187.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" " fill="#ffffff">尝试占比</text><text x="324.25" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="335.24" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="345.18" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="397.75 408.75 419.74 430.74 441.73 452.73 463.72" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施</text><text x="397.75 408.74 419.74 430.73" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功</text><text x="397.75 408.74 419.74 430.73" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="397.75" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="408.74" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="418.68" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="472.00 482.99 493.99 504.98" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="472.00" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="482.99" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="492.93" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="383.40" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="383.40" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10 135.10 144.10 153.10 162.10 171.10 180.10 189.10 198.10 207.10 216.10 225.10 234.10 243.10 252.10 261.10 270.10 279.10 288.10 297.10 306.10 315.10 324.10 333.10 342.10 351.10 360.10 369.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员提示词注入攻击在浏览器使用环境中的攻击成功率</text><text x="378.10 387.10 396.10 405.10 414.10 423.10 432.10 441.10 450.10 459.10 468.10 477.10 486.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="495.10 504.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="513.10 522.10 531.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。</text><text x="261.00" y="395.10" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">我们报告按环境计和按尝试计的攻击成功率（</text><text x="450.00 455.63 460.74" y="395.10" font-size="9.00" class="sc-loraregular">ASR</text><text x="466.39 475.39 484.39 493.39 502.39 511.39 520.39 529.39" y="395.10" font-size="9.00" class="sc-notoserifcjksc">）。按环境计的攻</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="406.80" font-size="9.00" class="sc-notoserifcjksc">击成功率衡量是否至少有一次尝试成功；按尝试计的攻击成功率汇总了全部</text><text x="371.37 374.64 379.52" y="406.80" font-size="9.00" class="sc-loraregular">148</text><text x="386.95 395.95 404.95 413.95 422.95 431.95 440.95 449.95 458.95 467.95 476.95 485.95 494.95 503.95 512.95 521.95" y="406.80" font-size="9.00" class="sc-notoserifcjksc">个环境中的所有单次尝试（每个环境</text><text x="72.00 75.28" y="418.50" font-size="9.00" class="sc-loraregular">10</text><text x="83.23 92.23 101.23 110.23 119.23" y="418.50" font-size="9.00" class="sc-notoserifcjksc">次尝试）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">由于攻击是针对</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.30" y="462.21" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="199.56 210.56 221.56 232.56 243.56 254.56 265.56 276.56 287.56 298.56 309.56 320.56 331.56 342.56 353.56 364.56 375.56" y="462.21" font-size="11.00" class="sc-notoserifcjksc">自适应获取的，它们可能无法完全反映</text><text x="389.45 398.18 404.75 411.32 416.41 419.30 425.26 427.62" y="462.21" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="435.58 446.58 457.58 468.58 479.58 490.58 501.58 512.58 523.58" y="462.21" font-size="11.00" class="sc-notoserifcjksc">或其他模型特有的漏</text><text x="72.00 83.00 94.00 105.00 116.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">洞。因此，</text><text x="127.00 135.73 142.30 148.87 153.96 156.85 162.82 165.17" y="477.83" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="173.13" y="477.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="187.03 195.76 202.33 208.89 213.99 216.88 222.84 225.44" y="477.83" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="234.69 245.69 256.69 267.69 278.69 289.69 300.69 311.69 322.69 333.69 344.69 355.69 366.69 377.69 388.69 399.69 410.69 421.69 432.69 443.69 454.69 465.69 476.69 487.69 498.69" y="477.83" font-size="11.00" class="sc-notoserifcjksc">结果之间的显著差异应谨慎解读。无安全防护措施时，与</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="493.45" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98 136.98 147.98 158.98 169.98 180.98 191.98 202.98 213.98 224.98 235.98 246.98 257.98 268.98 279.98" y="493.45" font-size="11.00" class="sc-notoserifcjksc">（考虑到攻击的获取方式，它是比</text><text x="293.87 302.60 309.17 315.74 320.83 323.72 329.69 332.28" y="493.45" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="341.53 352.53 363.53 374.53 385.53 396.53 407.53 418.53 429.53 440.53 451.53 462.53" y="493.45" font-siz 00 270.00 281.00" y="591.75" font-size="11.00" class="sc-notoserifcjksc">在部署安全防护措施后，无论哪种思考模式，</text><text x="292.00 296.00 301.97" y="591.75" font-size="11.00" class="sc-loraregular">148</text><text x="311.04 322.04 333.04 344.04 355.04 366.04 377.04 388.04 399.04 410.04 421.04" y="591.75" font-size="11.00" class="sc-notoserifcjksc">个环境中均没有攻击能对</text><text x="434.93 442.62 445.62 451.23 457.79 464.37 470.33 473.23 481.96 488.53 495.09 500.19 503.08 509.04 511.39" y="591.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="519.36" y="591.75" font-size="11.00" class="sc-notoserifcjksc">成</text><text x="115.51 125.44 131.30 135.56 142.15 148.58 153.67 156.57 163.23 167.92 173.83 179.38 182.47 188.39" y="607.37" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="200.10 211.10 222.10 233.10 244.10 255.10 266.10 277.10 288.10 299.10 310.10 321.10 332.10 343.10 354.10 365.10 376.10 387.10 398.10 409.10 420.10 431.10 442.10 453.10 464.10 475.10 486.10 497.10 508.10" y="607.37" font-size="11.00" class="sc-notoserifcjksc">持平，也是我们在该基准测试上观察到的最强结果。对于上一代模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="622.99" font-size="11.00" class="sc-notoserifcjksc">型，安全防护措施在开启思考时将</text><text x="239.89 246.13 252.57 259.24 265.92 271.80 276.06 278.95 284.92 287.51" y="622.99" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="296.76" y="622.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.66 319.39 325.96 332.52 337.62 340.51 346.47 349.07" y="622.99" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="358.32 369.32 380.32 391.32 402.32 413.32 424.32 435.32 446.32 457.32 468.32 479.32" y="622.99" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率降至相近的约</text><text x="493.21 499.12 501.47 506.54 513.38" y="622.99" font-size="11.00" class="sc-loraregular">2.70%</text><text x="522.95" y="622.99" font-size="11.00" class="sc-notoserif
