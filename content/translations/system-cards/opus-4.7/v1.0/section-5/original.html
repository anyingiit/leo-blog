fenses" rel="noopener"><rect x="204.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="215.00" y="218.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="215.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="76.75" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="182.91" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="208.24" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="233.57" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="260.32" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="287.06" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="313.81" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="340.55" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="365.88" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="250.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施</text><text x="250.00" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功</text><text x="250.00" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="250.00" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="260.99" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="270.93" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="324.25" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="324.25" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="335.24" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="345.18" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="397.75" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施</text><text x="397.75" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功</text><text x="397.75" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="397.75" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="408.74" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="418.68" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="472.00" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="472.00" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="482.99" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="492.93" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="383.40" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="383.40" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员提示词注入攻击在浏览器使用环境中的攻击成功率</text><text x="378.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="495.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="513.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。</text><text x="261.00" y="395.10" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="270.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">我们报告按环境计和按尝试计的攻击成功率（</text><text x="450.00" y="395.10" font-size="9.00" class="sc-loraregular">ASR</text><text x="466.39" y="395.10" font-size="9.00" class="sc-notoserifcjksc">）。按环境计的攻</text><text x="72.00" y="406.80" font-size="9.00" class="sc-notoserifcjksc">击成功率衡量是否至少有一次尝试成功；按尝试计的攻击成功率汇总了全部</text><text x="371.37" y="406.80" font-size="9.00" class="sc-loraregular">148</text><text x="386.95" y="406.80" font-size="9.00" class="sc-notoserifcjksc">个环境中的所有单次尝试（每个环境</text><text x="72.00" y="418.50" font-size="9.00" class="sc-loraregular">10</text><text x="83.23" y="418.50" font-size="9.00" class="sc-notoserifcjksc">次尝试）。</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">由于攻击是针对</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.30" y="462.21" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="199.56" y="462.21" font-size="11.00" class="sc-notoserifcjksc">自适应获取的，它们可能无法完全反映</text><text x="389.45 398.18 404.75 411.32 416.41 419.30 425.26 427.62" y="462.21" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="435.58" y="462.21" font-size="11.00" class="sc-notoserifcjksc">或其他模型特有的漏</text><text x="72.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">洞。因此，</text><text x="127.00 135.73 142.30 148.87 153.96 156.85 162.82 165.17" y="477.83" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="173.13" y="477.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="187.03 195.76 202.33 208.89 213.99 216.88 222.84 225.44" y="477.83" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="234.69" y="477.83" font-size="11.00" class="sc-notoserifcjksc">结果之间的显著差异应谨慎解读。无安全防护措施时，与</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="493.45" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98" y="493.45" font-size="11.00" class="sc-notoserifcjksc">（考虑到攻击的获取方式，它是比</text><text x="293.87 302.60 309.17 315.74 320.83 323.72 329.69 332.28" y="493.45" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="341.53" y="493.45" font-size="11.00" class="sc-notoserifcjksc">更可靠的比较对象）相比，</text><text x="473.53 481.22 484.21 489.82 496.39 502.97 508.93 511.82 520.56 527.12 533.69" y="493.45" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.32" y="509.07" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28" y="509.07" font-size="11.00" class="sc-notoserifcjksc">将开启思考时按环境计的攻击成功率降低了</text><text x="300.17" y="509.07" font-size="11.00" class="sc-loraregular">13×</text><text x="319.03" y="509.07" font-size="11.00" class="sc-notoserifcjksc">以上，从</text><text x="365.92 371.92 377.88 380.42 387.25 393.24" y="509.07" font-size="11.00" class="sc-loraregular">54.05%</text><text x="405.71" y="509.07" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="430.60 436.56 439.10 445.93 451.93" y="509.07" font-size="11.00" class="sc-loraregular">4.05%</text><text x="461.50" y="509.07" font-size="11.00" class="sc-notoserifcjksc">，这使</text><text x="497.39 506.13 512.69 519.26 524.35 527.25 533.21 535.56" y="509.07" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00" y="524.69" font-size="11.00" class="sc-notoserifcjksc">在无防护时的表现更接近</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="524.69" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="280.48" y="524.69" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="294.38 301.03 303.63 309.98 316.17" y="524.69" font-size="11.00" class="sc-loraregular">0.68%</text><text x="325.74" y="524.69" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="591.75" font-size="11.00" class="sc-notoserifcjksc">在部署安全防护措施后，无论哪种思考模式，</text><text x="292.00" y="591.75" font-size="11.00" class="sc-loraregular">148</text><text x="311.04" y="591.75" font-size="11.00" class="sc-notoserifcjksc">个环境中均没有攻击能对</text><text x="434.93 442.62 445.62 451.23 457.79 464.37 470.33 473.23 481.96 488.53 495.09 500.19 503.08 509.04 511.39" y="591.75" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="519.36" y="591.75" font-size="11.00" class="sc-notoserifcjksc">成</text><text x="115.51 125.44 131.30 135.56 142.15 148.58 153.67 156.57 163.23 167.92 173.83 179.38 182.47 188.39" y="607.37" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="200.10" y="607.37" font-size="11.00" class="sc-notoserifcjksc">持平，也是我们在该基准测试上观察到的最强结果。对于上一代模</text><text x="72.00" y="622.99" font-size="11.00" class="sc-notoserifcjksc">型，安全防护措施在开启思考时将</text><text x="239.89 246.13 252.57 259.24 265.92 271.80 276.06 278.95 284.92 287.51" y="622.99" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="296.76" y="622.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.66 319.39 325.96 332.52 337.62 340.51 346.47 349.07" y="622.99" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="358.32" y="622.99" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率降至相近的约</text><text x="493.21 499.12 501.47 506.54 513.38" y="622.99" font-size="11.00" class="sc-loraregular">2.70%</text><text x="522.95" y="622.99" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="712.06" font-size="5.40" class="sc-loraregular">13</text><text x="79.34" y="715.06" font-size="9.00" class="sc-notoserifcjksc">攻击是针对</text><text x="126.71 133.00 135.45 140.04 145.41 150.79 155.67 158.04 165.18 170.56 175.93 180.10 182.46 187.34 189.46" y="715.06" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="197.03" y="715.06" font-size="9.00" class="sc-notoserifcjksc">自适应获取的，然后迁移到其他模型上。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们正在通过针对性攻击发现，继续调查特定于模型的漏洞。我们也在持续提升安全防护措施的</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">鲁棒性，同时尽量减少延迟以及对正常使用的干扰。</text></svg></div>
