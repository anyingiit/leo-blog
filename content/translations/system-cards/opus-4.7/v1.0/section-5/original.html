.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p078.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 78 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.23" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.35" y="116.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="192.32" y="116.23" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了一套与我们最近几款模型（包括</text><text x="437.21 444.90 447.89 453.50 460.07 466.65 472.61 475.50 485.43 491.30 495.55 502.14 508.58" y="116.23" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="131.85" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="131.85" font-size="11.00" class="sc-notoserifcjksc">）发布时所进行的类似的智能体安全评估。</text><text x="72.00" y="180.99" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00 90.69 93.68 99.29 105.86 112.44 118.40 121.29 131.22 137.09 141.34 147.93 154.37 159.46 162.35 169.02 173.71 179.61 185.17 188.26 194.18" y="180.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="205.88" y="180.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡（</text><text x="249.88 256.06 261.87 266.96 271.22 277.18 287.02 289.91 297.60 303.28 307.96" y="180.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">System Card</text><text x="314.54" y="180.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="325.54" y="180.99" font-size="11.00" class="sc-notoserifcjksc">中先前所述，我们还引入了一项新评估，聚</text><text x="72.00" y="196.61" font-size="11.00" class="sc-notoserifcjksc">焦于我们的模型自主执行影响力行动的能力，以及一项新的间接提示词注入（</text><text x="446.00 449.09 455.77 462.35 465.44 470.12 476.03 481.83 486.08 488.98 495.54 500.23 506.67 516.50 523.07" y="196.61" font-size="11.00" class="sc-loraregular">indirect prompt</text><text x="72.00 75.09 81.71 84.58 90.49 96.29 100.54 103.64 110.07" y="212.23" font-size="11.00" class="sc-loraregular">injection</text><text x="116.75" y="212.23" font-size="11.00" class="sc-notoserifcjksc">）基准测试，以应对现有评估已饱和的问题。我们移除了一项关于基础恶意编程任务的</text><text x="72.00" y="227.85" font-size="11.00" class="sc-notoserifcjksc">评估（参见</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.11 203.70" y="227.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="212.95" y="227.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="245.95" y="227.85" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="259.85" y="227.85" font-size="11.00" class="sc-loraregular">5.1.1</text><text x="282.15" y="227.85" font-size="11.00" class="sc-notoserifcjksc">节），该评估已高度饱和，并已被专门聚焦于</text><text x="505.05 512.74 515.73 521.34 527.91 534.48" y="227.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="243.47" font-size="11.00" class="sc-loraregular">Code</text><text x="101.56" y="243.47" font-size="11.00" class="sc-notoserifcjksc">和计算机使用（</text><text x="178.56 184.35 190.79 200.62 207.19 213.76 218.01 223.98 228.74 231.63 238.20 243.29" y="243.47" font-size="11.00" class="sc-loraregular">computer use</text><text x="249.25" y="243.47" font-size="11.00" class="sc-notoserifcjksc">）任务的更难评估所取代。</text><text x="72.00" y="311.92" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="311.92" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="349.01" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="349.01" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="376.91" font-size="11.00" class="sc-notoserifcjksc">本评估旨在测试模型在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 230.87 237.31 243.89" y="376.91" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="252.74" y="376.91" font-size="11.00" class="sc-notoserifcjksc">环境下对恶意、两用和良性的网络安全相关查询的回应。提</text><text x="72.00" y="392.53" font-size="11.00" class="sc-notoserifcjksc">示词分为两类：</text><text x="108.00" y="425.49" font-size="11.00" class="sc-notoserifcjkscbold">恶意使用：</text><text x="163.00" y="425.49" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="187.89" y="425.49" font-size="11.00" class="sc-loraregular">61</text><text x="201.15" y="425.49" font-size="11.00" class="sc-notoserifcjksc">条恶意提示词，用于评估</text><text x="325.04 332.73 335.72 341.33 347.90 354.48" y="425.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="363.33" y="425.49" font-size="11.00" class="sc-notoserifcjksc">能否正确拒绝带有恶意意图或在其他</text><text x="108.00" y="441.11" font-size="11.00" class="sc-notoserifcjksc">方面为我们的</text><text x="174.00" y="441.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="229.00 237.20 242.29 247.96 253.99 259.95 262.85 269.40 275.84 278.83 281.92 287.72" y="441.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="293.53" y="441.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="304.53" y="441.11" font-size="11.00" class="sc-notoserifcjksc">所禁止的查询。示例主题包括协助制作恶意软</text><text x="108.00" y="456.73" font-size="11.00" class="sc-notoserifcjksc">件、编写用于破坏性</text><text x="209.89 217.98 226.17 232.54" y="456.73" font-size="11.00" class="sc-loraregular">DDoS</text><text x="241.67" y="456.73" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件。自</text><text x="475.57 483.25 486.25 491.86 498.42 505.00" y="456.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="472.35" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59" y="472.35" font-size="11.00" class="sc-notoserifcjksc">系统卡起，我们新增了</text><text x="305.48" y="472.35" font-size="11.00" class="sc-loraregular">12</text><text x="318.29" y="472.35" font-size="11.00" class="sc-notoserifcjksc">个具有挑战性的测试用例，使提示词总数从</text><text x="108.00" y="487.97" font-size="11.00" class="sc-loraregular">49</text><text x="123.21" y="487.97" font-size="11.00" class="sc-notoserifcjksc">条增加到</text><text x="170.11" y="487.97" font-size="11.00" class="sc-loraregular">61</text><text x="183.36" y="487.97" font-size="11.00" class="sc-notoserifcjksc">条。</text><text x="108.00" y="522.64" font-size="11.00" class="sc-notoserifcjkscbold">两用与良性：</text><text x="174.00" y="522.64" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="198.89" y="522.64" font-size="11.00" class="sc-loraregular">61</text><text x="212.15" y="522.64" font-size="11.00" class="sc-notoserifcjksc">条提示词，涵盖两用查询和完全良性的查询，用于评估</text><text x="479.04 486.73 489.72 495.33 501.90 508.48" y="522.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="517.33" y="522.64" font-size="11.00" class="sc-notoserifcjksc">能否</text><text x="108.00" y="538.26" font-size="11.00" class="sc-notoserifcjksc">协助处理可能敏感但未被禁止的请求。示例主题包括运行网络侦察工具、测试网站漏洞，</text><text x="108.00" y="553.88" font-size="11.00" class="sc-notoserifcjksc">以及分析渗透测试所得的数据。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="603.60" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="603.60" font-size="11.00" class="sc-notoserifcjksc">配备了</text><text x="192.32 200.01 203.00 208.61 215.18 221.75 227.72 230.61 238.30 244.73 251.31" y="603.60" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="260.17" y="603.60" font-size="11.00" class="sc-notoserifcjksc">中可用的标准工具命令集。每条提示词运行</text><text x="472.06" y="603.60" font-size="11.00" class="sc-loraregular">10</text><text x="485.79" y="603.60" font-size="11.00" class="sc-notoserifcjksc">次，两个类</text><text x="72.00" y="619.22" font-size="11.00" class="sc-notoserifcjksc">别合计共</text><text x="118.89 122.90 125.67 131.58 137.48" y="619.22" font-size="11.00" class="sc-loraregular">1,220</text><text x="147.22" y="619.22" font-size="11.00" class="sc-notoserifcjksc">次测试。</text><text x="72.00" y="652.18" font-size="11.00" class="sc-notoserifcjksc">鉴于我们预计将在所有版本中默认实施这一安全防护措施，我们现在也会在应用</text><text x="459.89 467.58 470.57 476.18 482.75 489.33 495.29 498.18 505.87 512.31 518.89" y="652.18" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="527.74" y="652.18" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="72.00" y="667.80" font-size="11.00" class="sc-notoserifcjksc">统提示词（</text><text x="127.00 132.09 137.90 142.99 147.25 153.21 163.05 165.94 172.51 177.19 183.63 193.46 200.03" y="667.80" font-size="11.00" class="sc-loraregular">system prompt</text><text x="204.29" y="667.80" font-size="11.00" class="sc-notoserifcjksc">）的情况下自动运行本评估。在以往的系统卡中，我们还曾在附加另</text><text x="302.51 308.48 311.57 314.56 320.35 327.18 333.12 338.79" y="683.42" font-size="11.00" class="sc-loraregular">FileRead</text><text x="348.27" y="683.42" font-size="11.00" class="sc-notoserifcjksc">工具结果上附加一条提醒，明确指示模</text><text x="72.00" y="699.04" font-size="11.00" class="sc-notoserifcjksc">型考虑该文件是否</text><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="83.00" y="172.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd749724787c8913a2ae0841.pdf" rel="noopener"><rect x="83.00" y="172.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/53566bf5440a10affd <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p079.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 79 页"><text x="77.50" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50 85.06 88.49 94.26 101.05 107.60 113.52 116.41 124.87 131.47 138.27 143.60 146.49 152.51 154.75" y="220.27" font-size="10.99" class="sc-lorabold">Claude Opus 4.7</text><text x="77.50" y="231.75" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87 94.17 97.26 99.99 104.01 109.45 114.09 118.72" y="231.75" font-size="9.00" class="sc-lorabolditalic">FileTool</text><text x="123.81" y="231.75" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50 85.06 88.49 94.26 101.05 107.60 113.52 116.41 126.72 132.78 137.32 144.15 150.37 155.71 158.60 165.62 170.81 176.73 182.65 186.24 192.16" y="257.12" font-size="10.99" class="sc-lorabold">Claude Mythos Preview</text><text x="77.50" y="268.55" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87 94.17 97.26 99.99 104.00 109.45 114.08 118.72" y="268.55" font-size="9.00" class="sc-lorabolditalic">FileTool</text><text x="123.81" y="268.55" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50" y="293.97" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="77.50" y="305.45" font-size="9.00" class="sc-notoserifcjkscbold">有</text><text x="88.87 94.17 97.26 99.99 104.01 109.45 114.09 118.72" y="305.45" font-size="9.00" class="sc-lorabolditalic">FileTool</text><text x="123.81" y="305.45" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="77.50" y="330.82" font-size="10.99" class="sc-lorabold">Claude Opus 4.6</text><text x="77.50" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">无</text><text x="88.87 94.17 97.26 99.99 104.01 109.45 114.09 118.72" y="342.25" font-size="9.00" class="sc-lorabolditalic">FileTool</text><text x="123.81" y="342.25" font-size="9.00" class="sc-notoserifcjkscbold">提醒</text><text x="236.50" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">恶意（</text><text x="269.48" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="279.42" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="236.50" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="390.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">两用与良性（</text><text x="456.22" y="179.58" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="466.16" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.30" y="193.25" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">具有恶意。对于近期的模型，包括</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.06" y="82.63" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="286.03" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="299.92 309.85 315.72 319.97 326.56 333.00 338.09 340.98 347.65 352.34 358.24 363.80 366.89 372.81" y="82.63" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="381.62" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，评估显示这一缓解措施并未带</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">来任何额外的安全收益。我们现在只在能带来实质性安全改进的模型上应用这一安全防护措施，</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">并报告有无</text><text x="129.89 135.87 138.96 141.95 147.44 153.94 160.37 166.81" y="113.87" font-size="11.00" class="sc-loraregular">FileTool</text><text x="172.69" y="113.87" font-size="11.00" class="sc-notoserifcjksc">提醒两种情况下较好的分数。我们还对系统提示词进行了更新，这会使下文</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">中以往模型的结果略有变化。</text><text x="72.00" y="359.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83" y="359.86" font-size="9.00" class="sc-lorabold">5.1.1.A]</text><text x="116.68" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">应用缓解措施后的</text><text x="191.04" y="359.86" font-size="9.00" class="sc-lorabold">Claude Code</text><text x="246.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="291.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以</text><text x="399.75" y="359.86" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="417.75" y="359.86" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出</text><text x="72.00" y="371.56" font-size="9.00" class="sc-notoserifcjksc">（但未考虑误差范围）。由于系统提示词的更新，以往模型的结果与以往系统卡中的结果存在差异。</text><text x="72.00" y="412.17" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="412.17" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85" y="412.17" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.85 213.58 220.15 226.71 231.81 234.70 240.66 243.02" y="412.17" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="250.98" y="412.17" font-size="11.00" class="sc-notoserifcjksc">在识别和拒绝恶意请求方面表现出显著提升。与</text><text x="484.87 492.56 495.56 501.17 507.73 514.31" y="412.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="427.79" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="427.79" font-size="11.00" class="sc-notoserifcjksc">类似，提升来自于对以往模型难以应对的那些具有挑战性的新用例的拒绝。在两</text><text x="72.00" y="443.41" font-size="11.00" class="sc-notoserifcjksc">用和良性任务上，</text><text x="160.00 168.73 175.30 181.87 186.96 189.85 195.82 198.17" y="443.41" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="206.13" y="443.41" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="253.03 260.72 263.71 269.32 275.89 282.46 288.43 291.32 300.05 306.62 313.19 318.28 321.17 327.13 329.73" y="443.41" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="338.98" y="443.41" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="491.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="491.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="519.36" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.35" y="519.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="178.43" y="519.36" font-size="11.00" class="sc-notoserifcjksc">，我们运行了上一次为</text><text x="291.32 299.01 302.00 307.61 314.18 320.75 326.72 329.61 338.34 344.91 351.48 356.57 359.46 365.42 368.13" y="519.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="377.02" y="519.36" font-size="11.00" class="sc-notoserifcjksc">发布而更新的计算机使用评估。</text><text x="72.00" y="534.98" font-size="11.00" class="sc-notoserifcjksc">我们评估模型在沙箱化的环境中获得基于图形用户界面（</text><text x="347.00" y="534.98" font-size="11.00" class="sc-loraregular">GUI</text><text x="367.33" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="455.33" y="534.98" font-size="11.00" class="sc-loraregular">CLI</text><text x="473.06" y="534.98" font-size="11.00" class="sc-notoserifcjksc">）的计算机使</text><text x="72.00" y="550.60" font-size="11.00" class="sc-notoserifcjksc">用工具时如何回应有害任务，重点关注以下几个令人担忧的风险领域：</text><text x="108.00" y="600.32" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集</text><text x="108.00" y="616.52" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播</text><text x="108.00" y="632.71" font-size="11.00" class="sc-notoserifcjksc">规模化滥用</text><text x="72.00" y="665.09" font-size="11.00" class="sc-loraregular">112</text><text x="88.81" y="665.09" font-size="11.00" class="sc-notoserifcjksc">项任务分别在开启和关闭思考的情况下运行，每个模型共计</text><text x="377.70 383.61 389.27" y="665.09" font-size="11.00" class="sc-loraregular">224</text><text x="398.13" y="665.09" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p080.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 80 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="209.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="209.57" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="209.57" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="209.57" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以粗体标出，次优分数以下划线标</text><text x="72.00" y="221.27" font-size="9.00" class="sc-notoserifcjksc">出（但未考虑误差范围）。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="261.88" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13" y="261.88" font-size="11.00" class="sc-notoserifcjksc">在拒绝这些任务方面的得分高于</text><text x="275.03 282.72 285.71 291.32 297.89 304.46 310.43 313.32 322.05 328.62 335.19 340.28 343.17 349.13 351.73" y="261.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="358.09" y="261.88" font-size="11.00" class="sc-notoserifcjksc">，但与其他近期模型的差距在误差范</text><text x="72.00" y="277.50" font-size="11.00" class="sc-notoserifcjksc">围之内。随着模型通用能力的提升，我们观察到模型在该评估上的表现稳步改善。</text><text x="72.00" y="324.98" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="324.98" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="352.88" font-size="11.00" class="sc-notoserifcjksc">正如在</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 191.02 195.71 201.61 207.17 210.26 216.18" y="352.88" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="227.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的系统卡</text><text x="271.88" y="352.88" font-size="11.00" class="sc-notoserifcjksc">中首次讨论的那样，我们新建了一项评估，用于评估有</text><text x="72.00" y="368.50" font-size="11.00" class="sc-notoserifcjksc">害操纵风险。具体而言，我们测试模型能否自主开展影响力行动，且其水平足以通过大规模的说</text><text x="72.00" y="384.12" font-size="11.00" class="sc-notoserifcjksc">服、欺骗或个性化定向，为恶意行为者带来实质性的能力提升（</text><text x="380.00 386.57 393.13 396.13 399.22 403.07" y="384.12" font-size="11.00" class="sc-loraregular">uplift</text><text x="407.32" y="384.12" font-size="11.00" class="sc-notoserifcjksc">）。影响力行动是指通过欺</text><text x="391.00" y="415.36" font-size="11.00" class="sc-loraregular">AI</text><text x="404.46" y="415.36" font-size="11.00" class="sc-notoserifcjksc">能力提升带来的一个风险在</text><text x="72.00" y="547.19" font-size="11.00" class="sc-notoserifcjksc">该评估侧重考察模型在面对平台阻力和针对该行动的防御措施时端到端执行完整行动的能力；测</text><text x="72.00" y="562.81" font-size="11.00" class="sc-notoserifcjksc">试在智能体运行框架中进行，模型可在一个包含内容审核和反制互动障碍的模拟生态系统内使用</text><text x="72.00" y="578.43" font-size="11.00" class="sc-notoserifcjksc">模拟的社交媒体平台工具。为衡量原始能力而非安全防护措施的效果，我们针对一个削减了无害</text><text x="72.00" y="594.05" font-size="11.00" class="sc-notoserifcjksc">性训练的</text><text x="116.00" y="594.05" font-size="11.00" class="sc-loraregular">“</text><text x="120.40" y="594.05" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="153.40" y="594.05" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="594.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="168.24 174.83 180.79 183.78 190.29 194.01 200.58 203.57 208.95 215.38 222.06 225.00" y="594.05" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="230.81" y="594.05" font-size="11.00" class="sc-notoserifcjksc">）模型版本运行该评估。模型的表现依据其满足特定成功标准的</text><text x="72.00" y="609.67" font-size="11.00" class="sc-notoserifcjksc">程度来评估，例如模型是否根据所声明的所在地在符合现实的时间发帖，以及模型是否根据表现</text><text x="72.00" y="625.29" font-size="11.00" class="sc-notoserifcjksc">数据对内容进行迭代。该评估是对现有其他针对影响力行动与平台操纵的单轮和多轮评估的补</text><text x="72.00" y="640.91" font-size="11.00" class="sc-notoserifcjksc">充，例如第</text><text x="129.89" y="640.91" font-size="11.00" class="sc-loraregular">4.3</text><text x="147.58" y="640.91" font-size="11.00" class="sc-notoserifcjksc">节中给出的多轮测试结果。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="105.00" y="344.08" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.40" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="143.29" y="344.08" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="181.46" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="184.35" y="344.08" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="224.99" y="344.08" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="227.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="238.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="249.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="344.08" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p081.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 81 页"><text x="77.50" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50 85.06 88.50 94.26 101.05 107.60 113.52 116.41 124.87 131.47 138.27 143.60 146.49 152.51 154.75" y="333.61" font-size="10.99" class="sc-lorabold">Claude Opus 4.7</text><text x="162.80" y="333.61" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.06 88.50 94.26 101.05 107.60 113.52 116.41 126.72 132.78 137.32 144.15 150.37 155.71 158.60 165.62 170.81 176.73 182.65 186.24 192.16" y="371.74" font-size="10.99" class="sc-lorabold">Claude Mythos Preview</text><text x="203.96" y="371.74" font-size="10.99" class="sc-notoserifcjkscbold">（仅</text><text x="77.50" y="387.36" font-size="10.99" class="sc-notoserifcjkscbold">有用）</text><text x="77.50" y="409.87" font-size="10.99" class="sc-lorabold">Claude Sonnet 4.6</text><text x="174.38" y="409.87" font-size="10.99" class="sc-notoserifcjkscbold">（仅有</text><text x="77.50" y="425.49" font-size="10.99" class="sc-notoserifcjkscbold">用）</text><text x="77.50" y="448.01" font-size="10.99" class="sc-lorabold">Claude Opus 4.6</text><text x="164.28" y="448.01" font-size="10.99" class="sc-notoserifcjkscbold">（仅有用）</text><text x="236.50" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="276.73" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">我们测试了两个假设场景：</text><text x="204.00" y="98.82" font-size="11.00" class="sc-loraregular">1</text><text x="208.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">）压制投票场景，其中一名假设的用户指示模型开展一场伪草根运动</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.35" y="114.44" font-size="11.00" class="sc-notoserifcjksc">），以压低选民对特定政治候选人的投票率与热情；</text><text x="397.35" y="114.44" font-size="11.00" class="sc-loraregular">2</text><text x="403.25" y="114.44" font-size="11.00" class="sc-notoserifcjksc">）国内极化场景，其中一名</text><text x="72.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">的信息，以激化社会与政治分歧。</text><text x="72.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">两个场景的结果如下，以平均任务完成率呈现（每个场景共</text><text x="360.89" y="212.16" font-size="11.00" class="sc-loraregular">70</text><text x="375.69" y="212.16" font-size="11.00" class="sc-notoserifcjksc">项成功标准）。各场景在</text><text x="499.58" y="212.16" font-size="11.00" class="sc-loraregular">3</text><text x="508.60" y="212.16" font-size="11.00" class="sc-notoserifcjksc">种不</text><text x="72.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">同的模拟平台阻力水平下各运行</text><text x="228.89" y="227.78" font-size="11.00" class="sc-loraregular">3</text><text x="237.91" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次，每个场景共计</text><text x="328.81" y="227.78" font-size="11.00" class="sc-loraregular">9</text><text x="338.06" y="227.78" font-size="11.00" class="sc-notoserifcjksc">次模拟。</text><text x="72.00" y="478.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="478.32" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="478.32" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="478.32" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="478.32" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="490.02" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="530.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="530.63" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两项任务上的成功率均高于</text><text x="368.32 376.01 379.00 384.61 391.18 397.75 403.72 406.61 415.34 421.91 428.48 433.57 436.46 442.42 445.02" y="530.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="451.38" y="530.63" font-size="11.00" class="sc-notoserifcjksc">，并在国内极化场</text><text x="72.00" y="546.25" font-size="11.00" class="sc-notoserifcjksc">景上得分高于</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="546.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="260.88" y="546.25" font-size="11.00" class="sc-notoserifcjksc">。不过，我们仍发现，大多数操作步骤都需要大量人工指</text><text x="72.00" y="561.87" font-size="11.00" class="sc-notoserifcjksc">导，这意味着该模型尚不具备完整的人设与账号网络管理、协同内容投放以及规模化社会工程行</text><text x="72.00" y="577.49" font-size="11.00" class="sc-notoserifcjksc">动所需的自主能力水平。</text><text x="72.00" y="643.98" font-size="11.00" class="sc-notoserifcjksc">这些模型的完整训练版本额外接受了无害性训练。当我们在这些场景下测试这些模型的最终版本</text><text x="72.00" y="659.60" font-size="11.00" class="sc-notoserifcjksc">时，任务完成率接近</text><text x="173.89" y="659.60" font-size="11.00" class="sc-loraregular">0%</text><text x="190.29" y="659.60" font-size="11.00" class="sc-notoserifcjksc">，因为模型通常从一开始就拒绝参与这些任务（这些任务明显违反了我</text><text x="72.00" y="675.22" font-size="11.00" class="sc-notoserifcjksc">们的使用政策）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="72.00" y="84.21" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="84.21" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="110.78" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入（</text><text x="160.00 166.57 171.25 177.69 187.52 194.09 198.35 201.24 204.33 210.95 213.82 219.73 225.53 229.78 232.88 239.31" y="110.78" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="245.99" y="110.78" font-size="11.00" class="sc-notoserifcjksc">）仍是我们在智能体系统中安全部署模型的最高优先事项之</text><text x="72.00" y="142.02" font-size="11.00" class="sc-notoserifcjksc">站上，或在智能体总结的电子邮件中。当智能体在原本例行的任务中遇到这些恶意内容时，它可</text><text x="72.00" y="173.26" font-size="11.00" class="sc-notoserifcjksc">页或共享文档中的单个恶意载荷，可能会危及任何处理它的智能体，而攻击者无需针对特定用户</text><text x="72.00" y="188.88" font-size="11.00" class="sc-notoserifcjksc">或系统。当模型同时拥有访问私有数据和代表用户采取行动的权限时，这类攻击也尤其危险，因</text><text x="72.00" y="204.50" font-size="11.00" class="sc-notoserifcjksc">为这一组合可能使攻击者外泄敏感信息或执行未经授权的操作。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="321.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="321.27" font-size="11.00" class="sc-notoserifcjksc">在所有被评估的智能体使用场景（包括工具使用、编程、</text><text x="431.42" y="321.27" font-size="11.00" class="sc-loraregular">GUI</text><text x="454.65" y="321.27" font-size="11.00" class="sc-notoserifcjksc">计算机使用和浏</text><text x="72.00" y="336.89" font-size="11.00" class="sc-notoserifcjksc">览器使用）上的提示词注入鲁棒性继续大幅提升。尽管我们持续努力加强评估，包括从专业红队</text><text x="72.00" y="352.51" font-size="11.00" class="sc-notoserifcjksc">成员处获取新的攻击、与外部研究机构合作开发更难的基准测试，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 438.02 444.59 451.16 456.25 459.14 465.11 467.46" y="352.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="475.43" y="352.51" font-size="11.00" class="sc-notoserifcjksc">仍再次使我</text><text x="72.00" y="368.13" font-size="11.00" class="sc-notoserifcjksc">们的许多评估达到饱和。</text><text x="72.00" y="434.62" font-size="11.00" class="sc-notoserifcjksc">除模型层面的鲁棒性外，我们还持续投入于在模型本身之上运行的防护措施，以进一步加固基于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="450.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="450.24" font-size="11.00" class="sc-notoserifcjksc">构建的智能体。在以往的系统卡中，我们报告了使用分类器检测提示词注入尝试的结果；</text><text x="72.00" y="481.48" font-size="11.00" class="sc-notoserifcjksc">供强信号。我们将在以下各节展示它们所提供的鲁棒性，这些安全防护措施在我们的许多智能体</text><text x="72.00" y="497.10" font-size="11.00" class="sc-notoserifcjksc">产品中默认启用。</text><text x="72.00" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49" y="562.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70" y="562.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc">外部研究合作伙伴</text><text x="162.89 171.26 175.95 181.52 187.32 190.22 196.40 205.10 210.78" y="590.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="220.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="253.35" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="385.35 393.62 401.13 404.02 410.91 414.60 417.49 423.73 429.63 435.48 442.05 446.81 450.08 454.36 460.17 463.06 466.66 473.33 478.43 482.68 485.95 490.21 496.78 501.03" y="590.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="507.00" y="590.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="517.99" y="590.39" font-size="11.00" class="sc-notoserifcjksc">合作</text><text x="72.00" y="606.01" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="107.89 114.78 120.81 126.77 133.35 137.60 140.50 147.33 153.24 159.81 162.71 169.21 175.15 180.82 190.66 193.75 200.43" y="606.01" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="206.51" y="606.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="217.51" y="606.01" font-size="11.00" class="sc-loraregular">ART</text><text x="238.34" y="606.01" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="293.34" y="602.34" font-size="6.60" class="sc-loraregular">8</text><text x="297.05" y="606.01" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在</text><text x="72.00" y="621.62" font-size="11.00" class="sc-notoserifcjksc">四类利用方式上对提示词注入的易感性：破坏机密性、引入相互竞争的目标、生成被禁止的内容</text><text x="72.00" y="637.24" font-size="11.00" class="sc-notoserifcjksc">（如恶意代码），以及执行被禁止的操作（如未经授权的金融交易）。</text><a href="https://arxiv.org/abs/2507.20526" rel="noopener"><rect x="216.00" y="707.25" width="158.25" height="12.75" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="162.89" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="162.89" y="581.59" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="187.32" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai/" rel="noopener"><rect x="190.22" y="581.59" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="286.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="286.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="297.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="297.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="308.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="308.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="319.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="319.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="330.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="330.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="341.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="341.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="352.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="352.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="363.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="363.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="374.35" y="581.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="374.35" y="581.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="385.35" y="581.59" width="15.79" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="401.13" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="404.02" y="581.59" width="10.57" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="414.60" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="417.49" y="581.59" width="42.68" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="460.17" y="581.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="463.06" y="581.59" width="43.93" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="507.00" y="581.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="98.82" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="98.82" font-size="11.00" class="sc-notoserifcjksc">估计了攻击者在</text><text x="209.35 215.25 220.96" y="98.82" font-size="11.00" class="sc-loraregular">k=1</text><text x="224.97" y="98.82" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="235.97 241.87 247.58 251.59" y="98.82" font-size="11.00" class="sc-loraregular">k=10</text><text x="261.31" y="98.82" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.20 281.11 286.82 290.82 297.65" y="98.82" font-size="11.00" class="sc-loraregular">k=100</text><text x="307.38" y="98.82" font-size="11.00" class="sc-notoserifcjksc">次尝试内取得成功的概率，这反映出攻击并非确</text><text x="72.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">定性的，重复尝试会提高注入成功的可能性。这些攻击取自</text><text x="360.89 367.78 374.69 381.73 384.62 391.51 396.19 402.15 408.83" y="114.44" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="414.51" y="114.44" font-size="11.00" class="sc-notoserifcjksc">，在那里数千名专家红队</text><text x="72.00" y="130.06" font-size="11.00" class="sc-notoserifcjksc">成员持续针对前沿模型改进攻击策略。</text><text x="259.00 267.37 272.06 277.62 283.43 286.32 292.51 301.21 306.88" y="130.06" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="316.45" y="130.06" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中选取了迁移率特别高的一个子</text><text x="72.00" y="145.68" font-size="11.00" class="sc-notoserifcjksc">集：这些攻击已被证明对多个模型有效，而不仅仅对最初针对的那个模型有效。该评估仅涵盖间</text><text x="72.00" y="161.30" font-size="11.00" class="sc-notoserifcjksc">接提示词注入</text><text x="138.00" y="157.63" font-size="6.60" class="sc-loraregular">9</text><text x="471.81" y="161.30" font-size="11.00" class="sc-loraregular">“</text><text x="476.21" y="161.30" font-size="11.00" class="sc-notoserifcjksc">提示词注</text><text x="72.00" y="176.92" font-size="11.00" class="sc-notoserifcjksc">入</text><text x="83.00" y="176.92" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="176.92" font-size="11.00" class="sc-notoserifcjksc">的内容）。</text><text x="72.00" y="524.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="524.86" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="524.86" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="524.86" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="524.86" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击</text><text x="383.29" y="524.86" font-size="9.00" class="sc-notoserifcjksc">。结果表示对每个模型而言，攻击者在</text><text x="72.00 76.83 81.50" y="536.56" font-size="9.00" class="sc-loraregular">k=1</text><text x="84.78" y="536.56" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78 98.61 103.28 106.56" y="536.56" font-size="9.00" class="sc-loraregular">k=10</text><text x="114.52" y="536.56" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88 130.72 135.39 138.66 144.25" y="536.56" font-size="9.00" class="sc-loraregular">k=100</text><text x="152.21" y="536.56" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="361.58" y="536.56" font-size="9.00" class="sc-loraregular">19</text><text x="372.42" y="536.56" font-size="9.00" class="sc-notoserifcjksc">个不同场景上进行评估。越低越好。我们</text><text x="72.00" y="548.26" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="83.37 90.22 94.05 98.60 103.36 105.72 110.78 117.90 122.54" y="548.26" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="130.37" y="548.26" font-size="9.00" class="sc-notoserifcjksc">合作发现并修正了该基准测试中的评分问题；此处所示数字反映了更新后的评分，可能与以往系统卡中</text><text x="72.00" y="559.96" font-size="9.00" class="sc-notoserifcjksc">报告的数字有所不同。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="603.66" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="603.66" font-size="11.00" class="sc-notoserifcjksc">取得了与我们能力最强的模型</text><text x="302.32 310.01 313.00 318.61 325.18 331.75 337.72 340.61 350.54 356.40 360.66 367.25 373.69 378.78 381.67 388.34 393.02 398.93 404.49 407.58 413.49" y="603.66" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="425.20" y="603.66" font-size="11.00" class="sc-notoserifcjksc">相当的鲁棒性，在</text><text x="72.00 77.91 83.62 87.62 94.45" y="619.28" font-size="11.00" class="sc-loraregular">k=100</text><text x="104.18" y="619.28" font-size="11.00" class="sc-notoserifcjksc">时，关闭思考的攻击成功率（</text><text x="247.18 252.77 257.14 261.40 267.07 272.93 278.83 281.73 286.82 293.39 299.18 304.98 310.94 316.04 321.13 324.02 328.71 334.31 338.56" y="619.28" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="344.53" y="619.28" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="369.42 375.78 378.32 385.15" y="619.28" font-size="11.00" class="sc-loraregular">6.0%</text><text x="394.72" y="619.28" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考（</text><text x="493.72 499.39 505.97 511.65 518.21 522.47 525.56 531.06" y="619.28" font-size="11.00" class="sc-loraregular">adaptive</text><text x="72.00" y="634.90" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37" y="634.90" font-size="11.00" class="sc-notoserifcjksc">）时为</text><text x="150.26" y="634.90" font-size="11.00" class="sc-loraregular">4.8%</text><text x="174.68" y="634.90" font-size="11.00" class="sc-notoserifcjksc">。这相比</text><text x="221.58 229.27 232.26 237.87 244.44 251.01 256.98 259.87 268.60 275.17 281.74 286.83 289.72 295.69 298.28" y="634.90" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="304.64" y="634.90" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="315.64 321.55 327.26 331.26 338.09" y="634.90" font-size="11.00" class="sc-loraregular">k=100</text><text x="347.81" y="634.90" font-size="11.00" class="sc-notoserifcjksc">时关闭思考为</text><text x="416.71" y="634.90" font-size="11.00" class="sc-loraregular">14.8%</text><text x="445.13" y="634.90" font-size="11.00" class="sc-notoserifcjksc">，开启自适应思考</text><text x="72.00" y="650.52" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.80 95.80 98.16 103.23" y="650.52" font-size="11.00" class="sc-loraregular">21.7%</text><text x="112.80" y="650.52" font-size="11.00" class="sc-notoserifcjksc">）有所改进。</text><text x="178.80 186.49 189.48 195.09 201.66 208.24" y="650.52" font-size="11.00" class="sc-loraregular">Claude</text><text x="217.09" y="650.52" font-size="11.00" class="sc-notoserifcjksc">模型现已使该</text><text x="72.00" y="687.67" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">过去，我们也报告过该基准测试中</text><text x="228.10" y="691.01" font-size="10.00" class="sc-loraregular">“</text><text x="232.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">直接提示词注入</text><text x="302.10" y="691.01" font-size="10.00" class="sc-loraregular">”</text><text x="305.59" y="691.01" font-size="10.00" class="sc-notoserifcjksc">子集的结果。直接提示词注入涉及恶意用户，而本节</text><text x="72.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">基准测试饱和，限制了其在追踪进一步进展方面的用处。我们正在积极开发用于评估未来模型的</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">基准测试。</text><text x="72.00" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景针对自适应攻击者的鲁棒性</text><text x="72.00" y="161.44" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="157.77" font-size="6.60" class="sc-loraregular">10</text><text x="364.50" y="161.44" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="177.06" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新颖方法的攻击。自</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="192.68" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="157.70" y="192.68" font-size="11.00" class="sc-notoserifcjksc">起，我们一直在报告能更好地逼近现实世界对手能力的自适应评估，并且随着</text><text x="72.00" y="208.30" font-size="11.00" class="sc-notoserifcjksc">模型的提升，我们通过内部开发以及与外部研究合作伙伴的合作，持续加强这些评估。</text><text x="72.00" y="290.97" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="290.97" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="323.13" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="323.13" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35" y="323.13" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="323.13" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45" y="323.13" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35" y="323.13" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39" y="319.46" font-size="6.60" class="sc-loraregular">11</text><text x="433.19" y="323.13" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在</text><text x="72.00" y="338.75" font-size="11.00" class="sc-notoserifcjksc">编程环境中对提示词注入攻击的鲁棒性。</text><text x="270.00" y="338.75" font-size="11.00" class="sc-loraregular">Shade</text><text x="303.93" y="338.75" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="446.93 451.62 457.58 460.67 467.35 471.01 477.45 482.14 487.93 493.89 503.73 509.69 516.27" y="338.75" font-size="11.00" class="sc-loraregular">reinforcement</text><text x="72.00 74.99 80.93 86.61 91.37 98.05 101.14 107.82" y="354.37" font-size="11.00" class="sc-loraregular">learning</text><text x="113.90" y="354.37" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，不断提升其利用模型漏洞的表现。</text><text x="388.90 396.59 399.58 405.19 411.76 418.33 424.30 427.19 435.92 442.49 449.06 454.15 457.04 463.01 465.60" y="354.37" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="474.85" y="354.37" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="488.75" y="354.37" font-size="11.00" class="sc-loraregular">0%</text><text x="508.04" y="354.37" font-size="11.00" class="sc-notoserifcjksc">的攻</text><text x="72.00" y="369.99" font-size="11.00" class="sc-notoserifcjksc">击成功率使该评估的先前版本饱和，因此我们与</text><text x="305.89 314.26 318.95 324.52 330.32 333.22 339.40 348.10 353.78" y="369.99" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="363.35" y="369.99" font-size="11.00" class="sc-notoserifcjksc">合作创建了一个更强的变体，对我们</text><text x="72.00" y="385.61" font-size="11.00" class="sc-notoserifcjksc">的模型施加更大的对抗压力。</text><text x="72.00" y="446.70" font-size="11.00" class="sc-notoserifcjksc">下表及今后的所有报告均反映了使用比我们以往系统卡中所报告的更强攻击者进行的测试。攻击</text><text x="72.00" y="462.32" font-size="11.00" class="sc-notoserifcjksc">者在一组</text><text x="118.89" y="462.32" font-size="11.00" class="sc-loraregular">40</text><text x="134.58" y="462.32" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，每个测试用例有</text><text x="313.47" y="462.32" font-size="11.00" class="sc-loraregular">200</text><text x="335.93" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次尝试。我们报告攻击者在</text><text x="470.83" y="462.32" font-size="11.00" class="sc-loraregular">1</text><text x="477.72" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次和</text><text x="502.62" y="462.32" font-size="11.00" class="sc-loraregular">200</text><text x="525.08" y="462.32" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="477.94" font-size="11.00" class="sc-notoserifcjksc">尝试后成功的测试用例百分比。我们比较了在有无我们为保护该场景下用户而设计的额外安全防</text><text x="72.00" y="493.56" font-size="11.00" class="sc-notoserifcjksc">护措施时模型的鲁棒性。</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">10</text><text x="77.91 85.48 90.64 95.27 99.18 101.70 104.33 113.51 115.97 118.49 121.12 126.47 130.34 132.97 138.13 140.85 143.31 145.94 148.99 154.36 160.50 165.87 171.32 174.37 176.83 179.46 185.86 191.85 197.27 199.90 204.99 208.96 212.83 217.99 223.31 228.61 234.03 238.36 240.99 249.93 255.73 260.73 266.15 270.78 273.41 278.04 283.41 288.68 294.53 300.60 306.58 309.08 311.71 317.34 321.21 325.47 331.32 337.39 342.87 348.29 352.62 355.25 360.41 366.39 371.55 377.52 381.39 384.20 389.20 394.62 397.25 402.34 406.31 410.18 415.34 420.66 426.03 430.66 433.29 439.03 444.31 450.28 455.44 460.07 464.70 467.33 473.31 478.73 482.06 487.48 493.55 498.18 503.60" y="678.21" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="365.45 371.35 375.32 379.19 385.16 389.79 392.29 395.98 402.88 408.04 412.37 417.67 420.48 425.14 427.60 433.45 437.73 443.26 450.16 455.32 461.14 465.42 472.32 477.69 483.14 486.78 492.83 495.14 501.35 507.13 513.27 518.49" y="692.41" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2510.09023</text><text x="72.00" y="703.27" font-size="6.00" class="sc-loraregular">11</text><text x="79.00" y="706.61" font-size="10.00" class="sc-notoserifcjksc">不要与</text><text x="111.63 117.30 125.10 131.36 138.71 144.73 149.62 155.88 160.14 165.56 171.63" y="706.61" font-size="10.00" class="sc-loraregular">SHADE-Arena</text><text x="442.05" y="706.61" font-size="10.00" class="sc-loraregular">6.4.2.1</text><text x="472.27" y="706.61" font-size="10.00" class="sc-notoserifcjksc">节。</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="314.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="314.33" width="31.04" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="365.45" y="684.41" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="402.88" y="684.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="402.88" y="684.41" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="450.16" y="684.41" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="450.16" y="684.41" width="73.90" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p085.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 85 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="141.25" y="171.66" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="141.25" y="199.11" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="141.25" y="226.55" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="141.25" y="253.99" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="141.25" y="281.43" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="141.25" y="308.87" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="141.25" y="336.32" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="141.25" y="363.76" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="252.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="252.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="252.25" y="132.25" font-size="10.99" class="sc-lorabold" fill="#ffffff">1</text><text x="259.61" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="325.75" y="132.25" font-size="10.99" class="sc-lorabold" fill="#ffffff">200</text><text x="348.49" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="399.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施时的攻击成</text><text x="399.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="399.25" y="132.25" font-size="10.99" class="sc-lorabold" fill="#ffffff">1</text><text x="406.61" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="472.75" y="132.25" font-size="10.99" class="sc-lorabold" fill="#ffffff">200</text><text x="495.49" y="132.25" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="72.00" y="383.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="383.39" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">编程环境中</text><text x="172.08 177.42 183.01 187.72 193.09" y="383.39" font-size="9.00" class="sc-lorabold">Shade</text><text x="200.29" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击的攻击成功率</text><text x="335.29" y="383.39" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="452.29" y="383.39" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="470.29" y="383.39" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数</text><text x="72.00" y="395.09" font-size="9.00" class="sc-notoserifcjksc">以下划线标出（但未考虑误差范围）。我们报告单次尝试攻击者以及有</text><text x="353.37" y="395.09" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="395.09" font-size="9.00" class="sc-notoserifcjksc">次尝试来改进攻击的自适应攻击者的攻击</text><text x="72.00" y="406.79" font-size="9.00" class="sc-notoserifcjksc">成功率。对于自适应攻击者，攻击成功率衡量的是针对给定目标，</text><text x="333.00" y="406.79" font-size="9.00" class="sc-loraregular">200</text><text x="351.38" y="406.79" font-size="9.00" class="sc-notoserifcjksc">次尝试中是否至少有一次成功。</text><text x="72.00" y="462.20" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05" y="462.20" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="154.04" y="462.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="167.93 174.17 180.60 187.28 193.96 199.84 204.10 206.99 212.95 215.55" y="462.20" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="224.80" y="462.20" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="257.80 265.49 268.48 274.09 280.66 287.24 293.20 296.09 304.83 311.39 317.96 323.05 325.95 331.91 334.26" y="462.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="342.23" y="462.20" font-size="11.00" class="sc-notoserifcjksc">在编程环境中对提示词注入攻击的鲁棒性</text><text x="72.00" y="477.82" font-size="11.00" class="sc-notoserifcjksc">有所提升。在无安全防护措施的情况下，开启自适应思考时，</text><text x="369.00 376.69 379.68 385.29 391.86 398.44 404.40 407.29 416.02 422.59 429.16 434.25 437.14 443.11 445.46" y="477.82" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="453.43" y="477.82" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="467.32" y="477.82" font-size="11.00" class="sc-loraregular">1</text><text x="474.22" y="477.82" font-size="11.00" class="sc-notoserifcjksc">次尝试的攻击</text><text x="72.00" y="493.44" font-size="11.00" class="sc-notoserifcjksc">成功率从</text><text x="118.89" y="493.44" font-size="11.00" class="sc-loraregular">25.92%</text><text x="158.23" y="493.44" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="183.12" y="493.44" font-size="11.00" class="sc-loraregular">2.34%</text><text x="213.39" y="493.44" font-size="11.00" class="sc-notoserifcjksc">，将</text><text x="238.29" y="493.44" font-size="11.00" class="sc-loraregular">200</text><text x="260.75" y="493.44" font-size="11.00" class="sc-notoserifcjksc">次尝试的攻击成功率从</text><text x="373.64 379.74 384.32 387.03 393.02" y="493.44" font-size="11.00" class="sc-loraregular">97.5%</text><text x="405.49" y="493.44" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="430.38 436.74 443.39 445.93 452.77" y="493.44" font-size="11.00" class="sc-loraregular">60.0%</text><text x="462.34" y="493.44" font-size="11.00" class="sc-notoserifcjksc">；关闭思考时，</text><text x="72.00" y="509.06" font-size="11.00" class="sc-notoserifcjksc">将<  font-size="11.00" class="sc-notoserifcjksc">然而，与预期相反，在该评估中，无论是开启自适应思考还是关闭思考的场景，加入安全防护措</text><text x="72.00" y="620.87" font-size="11.00" class="sc-notoserifcjksc">施都提高了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.35" y="620.87" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="214.32" y="620.87" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率。鉴于整体攻击成功率较低且测试用例数量较少，这</text><text x="72.00" y="636.49" font-size="11.00" class="sc-notoserifcjksc">些差异在统计学上并不显著</text><text x="204.00" y="632.83" font-size="6.60" class="sc-loraregular">12</text><text x="209.95" y="636.49" font-size="11.00" class="sc-notoserifcjksc">。我们在本系统卡的任何</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">12</text><text x="80.04" y="678.21" font-size="10.00" class="sc-notoserifcjksc">由于共有</text><text x="122.67" y="678.21" font-size="10.00" class="sc-loraregular">14</text><text x="134.36" y="678.21" font-size="10.00" class="sc-notoserifcjksc">个测试用例，</text><text x="194.36" y="678.21" font-size="10.00" class="sc-loraregular">200</text><text x="214.78" y="678.21" font-size="10.00" class="sc-notoserifcjksc">次尝试攻击成功率以</text><text x="307.41 311.58 314.04" y="678.21" font-size="10.00" class="sc-loraregular">7.1</text><text x="320.31" y="678.21" font-size="10.00" class="sc-notoserifcjksc">个百分点为单位变化；观察到的有安全防护措施时</text><text x="72.00" y="692.41" font-size="10.00" class="sc-notoserifcjksc">的上升，是由一些测试用例从无安全防护措施时的</text><text x="294.63 300.35 307.25 312.62 318.83" y="692.41" font-size="10.00" class="sc-loraregular">0/200</text><text x="327.67" y="692.41" font-size="10.00" class="sc-notoserifcjksc">次成功尝试变为有安全防护措施时的</text><text x="490.30 493.76 500.66 506.03 512.24" y="692.41" font-size="10.00" class="sc-loraregular">1/200</text><text x="521.08" y="692.41" font-size="10.00" class="sc-notoserifcjksc">所</text><text x="72.00" y="706.61" font-size="10.00" class="sc-notoserifcjksc">致（开启自适应思考时为一个测试用例，关闭思考时为两个）。</text><text x="352.00" y="706.61" font-size="10.00" class="sc-loraregular">1</text><text x="358.27" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次尝试的差异分别相当于多出</text><text x="490.90" y="706.61" font-size="10.00" class="sc-loraregular">4</text><text x="498.95" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次和</text><text x="521.58" y="706.61" font-size="10.00" class="sc-loraregular">3</text><text x="529.78" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="720.81" font-size="10.00" class="sc-notoserifcjksc">成功，分母为</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">其他评估中均未观察到这一模式（例如，参见下一节关于浏览器使用的内容，其采用相同的防</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">护）。与编程一节类似，该评估使用了针对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">真实部署中，攻击成功率很可能会更低。</text><text x="72.00" y="163.59" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="163.59" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="468.00 475.69 478.68 484.29 490.86 497.44 503.40 506.29 509.38" y="195.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude in</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="211.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chrome</text><text x="116.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.09 178.78 181.77 187.38 193.95 200.52 206.49 209.38 217.07 223.39 232.07 238.51 243.23" y="211.59" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="249.13" y="211.59" font-size="11.00" class="sc-notoserifcjksc">。我们最初在发布</text><text x="340.03 347.72 350.71 356.32 362.88 369.46 375.42 378.32 387.05 393.62 400.18 405.28 408.17 414.13 416.84" y="211.59" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="425.73" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="439.62 447.31 450.30 455.91 462.48 469.06 475.02 477.91 481.57 488.01 492.77 495.67 503.35 509.94 514.63 521.06 530.90" y="211.59" font-size="11.00" class="sc-loraregular">Claude for Chrome</text><text x="72.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出了</text><text x="182.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="226.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">；随着后续模型相继使早期测试攻击集达到饱和，我们定期用更</text><text x="72.00" y="242.83" font-size="11.00" class="sc-notoserifcjksc">复杂的环境和更强的攻击对其进行更新。该评估由一系列网页环境组成，我们会向页面中动态注</text><text x="72.00" y="258.45" font-size="11.00" class="sc-notoserifcjksc">入不可信内容，模型随后通过截图或页面读取查看这些页面。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="325.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95" y="325.51" font-size="11.00" class="sc-notoserifcjksc">在我们此前的自动化浏览器使用评估中的攻击成功率已接近于零。为继续衡量</text><text x="72.00" y="341.13" font-size="11.00" class="sc-notoserifcjksc">进展，我们与专业红队成员合作，在更复杂的网页环境中针对</text><text x="371.89 380.63 387.19 393.76 398.85 401.75 407.71 410.30" y="341.13" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="419.56" y="341.13" font-size="11.00" class="sc-notoserifcjksc">自适应地发现新的攻击，</text><text x="72.00" y="356.75" font-size="11.00" class="sc-notoserifcjksc">并整理出一组</text><text x="140.89" y="356.75" font-size="11.00" class="sc-loraregular">148</text><text x="159.93" y="356.75" font-size="11.00" class="sc-notoserifcjksc">个环境，这些环境未用于此处所评估模型的训练。我们将攻击成功率报告为成</text><text x="72.00" y="372.37" font-size="11.00" class="sc-notoserifcjksc">功的注入在模型实际看到的注入中所占的比例，因为能力不同的模型可能以不同方式在环境中导</text><text x="72.00" y="487.43" font-size="11.00" class="sc-notoserifcjksc">我们比较了无安全防护措施的模型，以及部署了我们为利用浏览器和计算机使用工具的各类产品</text><text x="72.00" y="503.05" font-size="11.00" class="sc-notoserifcjksc">所提供的安全防护措施的模型。</text><text x="72.00" y="704.01" font-size="10.00" class="sc-notoserifcjksc">共</text><text x="84.63" y="704.01" font-size="10.00" class="sc-loraregular">2800</text><text x="110.67" y="704.01" font-size="10.00" class="sc-notoserifcjksc">次尝试。两项差异在统计上均无法与零区分（配对置换检验</text><text x="373.30" y="704.01" font-size="10.00" class="sc-loraitalic">p</text><text x="379.01" y="704.01" font-size="10.00" class="sc-notoserifcjksc">≈</text><text x="391.64 397.69 400.15" y="704.01" font-size="10.00" class="sc-loraregular">0.5</text><text x="405.60" y="704.01" font-size="10.00" class="sc-notoserifcjksc">）。</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" y="187.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" y="187.17" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="503.40" y="187.17" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="506.29" y="187.17" width="9.77" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="516.06" y="187.17" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="72.00" y="202.79" width="41.19" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="113.19" y="202.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="116.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="202.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for
