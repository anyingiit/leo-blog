次尝试</text><text x="472.00" y="174.64" font-size="10.99" class="sc-lorabold" fill="#ffffff">200</text><text x="494.74" y="174.64" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">次尝试</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们测量</text><text x="118.89" y="82.63" font-size="11.00" class="sc-loraregular">1</text><text x="125.79" y="82.63" font-size="11.00" class="sc-notoserifcjksc">次和</text><text x="150.68" y="82.63" font-size="11.00" class="sc-loraregular">200</text><text x="173.15" y="82.63" font-size="11.00" class="sc-notoserifcjksc">次尝试后的成功情况。我们比较了在有无我们为保护该场景下用户而设计的</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">额外安全防护措施时模型的鲁棒性。</text><text x="72.00" y="413.10" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.10" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01 123.49 125.86 131.19 136.78 141.50 146.86" y="413.10" font-size="9.00" class="sc-lorabold">5.2.2.2.A] Shade</text><text x="154.07" y="413.10" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.07" y="413.10" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="487.07" y="413.10" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="505.07" y="413.10" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="424.80" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。我们报告单次尝试攻击者的攻击成功率，以及有</text><text x="452.37" y="424.80" font-size="9.00" class="sc-loraregular">200</text><text x="470.74" y="424.80" font-size="9.00" class="sc-notoserifcjksc">次尝试机会来改</text><text x="72.00" y="436.50" font-size="9.00" class="sc-notoserifcjksc">进攻击的自适应攻击者的攻击成功率。对于自适应攻击者，攻击成功率衡量的是对于给定目标，</text><text x="450.00" y="436.50" font-size="9.00" class="sc-loraregular">200</text><text x="468.38" y="436.50" font-size="9.00" class="sc-notoserifcjksc">次尝试中是否至少</text><text x="72.00" y="448.20" font-size="9.00" class="sc-notoserifcjksc">有一次成功。</text><text x="72.00" y="491.91" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="491.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="171.85" y="491.91" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.85" y="491.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="289.27" y="491.91" font-size="11.00" class="sc-notoserifcjksc">在图形用户界面（</text><text x="377.27" y="491.91" font-size="11.00" class="sc-loraregular">GUI</text><text x="397.60" y="491.91" font-size="11.00" class="sc-notoserifcjksc">）环境中抵御提示词注入攻击</text><text x="72.00" y="507.53" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性也有所提升。无安全防护措施时，</text><text x="281.00" y="507.53" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="365.43" y="507.53" font-size="11.00" class="sc-notoserifcjksc">在开启自适应思考时攻击成功率降</text><text x="72.00" y="523.15" font-size="11.00" class="sc-notoserifcjksc">低（</text><text x="94.00" y="523.15" font-size="11.00" class="sc-loraregular">1</text><text x="100.90" y="523.15" font-size="11.00" class="sc-notoserifcjksc">次尝试时从</text><text x="158.79" y="523.15" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="206.45" y="523.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="220.35" y="523.15" font-size="11.00" class="sc-loraregular sc-k">17.8%</text><text x="250.29" y="523.15" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="275.18" y="523.15" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="321.32" y="523.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="335.21" y="523.15" font-size="11.00" class="sc-loraregular sc-k">0.46%</text><text x="366.46" y="523.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="377.46" y="523.15" font-size="11.00" class="sc-loraregular">200</text><text x="399.92" y="523.15" font-size="11.00" class="sc-notoserifcjksc">次尝试时从</text><text x="457.81" y="523.15" font-size="11.00" class="sc-loraregular sc-k">78.6%</text><text x="490.48" y="523.15" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="72.00" y="538.77" font-size="11.00" class="sc-loraregular sc-k">7.14%</text><text x="98.83" y="538.77" font-size="11.00" class="sc-notoserifcjksc">），在关闭思考时同样降低（</text><text x="241.83" y="538.77" font-size="11.00" class="sc-loraregular">1</text><text x="248.73" y="538.77" font-size="11.00" class="sc-notoserifcjksc">次尝试时从</text><text x="306.62" y="538.77" font-size="11.00" class="sc-loraregular sc-k">20.0%</text><text x="341.02" y="538.77" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="365.91" y="538.77" font-size="11.00" class="sc-loraregular sc-k">0.39%</text><text x="397.33" y="538.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="408.33" y="538.77" font-size="11.00" class="sc-loraregular">200</text><text x="430.79" y="538.77" font-size="11.00" class="sc-notoserifcjksc">次尝试时从</text><text x="488.68" y="538.77" font-size="11.00" class="sc-loraregular sc-k">85.7%</text><text x="520.74" y="538.77" font-size="11.00" class="sc-notoserifcjksc">降</text><text x="72.00" y="554.39" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89" y="554.39" font-size="11.00" class="sc-loraregular">21.43%</text><text x="120.17" y="554.39" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="605.25" font-size="11.00" class="sc-notoserifcjksc">然而，与预期相反，在该评估中，无论是开启自适应思考还是关闭思考的场景，加入安全防护措</text><text x="72.00" y="620.87" font-size="11.00" class="sc-notoserifcjksc">施都提高了</text><text x="129.89" y="620.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="214.32" y="620.87" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率。鉴于整体攻击成功率较低且测试用例数量较少，这</text><text x="72.00" y="636.49" font-size="11.00" class="sc-notoserifcjksc">些差异在统计学上并不显著</text><text x="204.00" y="632.83" font-size="6.60" class="sc-loraregular">12</text><text x="209.95" y="636.49" font-size="11.00" class="sc-notoserifcjksc">。我们在本系统卡的任何</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">12</text><text x="80.04" y="678.21" font-size="10.00" class="sc-notoserifcjksc">由于共有</text><text x="122.67" y="678.21" font-size="10.00" class="sc-loraregular">14</text><text x="134.36" y="678.21" font-size="10.00" class="sc-notoserifcjksc">个测试用例，</text><text x="194.36" y="678.21" font-size="10.00" class="sc-loraregular">200</text><text x="214.78" y="678.21" font-size="10.00" class="sc-notoserifcjksc">次尝试攻击成功率以</text><text x="307.41" y="678.21" font-size="10.00" class="sc-loraregular sc-k">7.1</text><text x="320.31" y="678.21" font-size="10.00" class="sc-notoserifcjksc">个百分点为单位变化；观察到的有安全防护措施时</text><text x="72.00" y="692.41" font-size="10.00" class="sc-notoserifcjksc">的上升，是由一些测试用例从无安全防护措施时的</text><text x="294.63" y="692.41" font-size="10.00" class="sc-loraregular sc-k">0/200</text><text x="327.67" y="692.41" font-size="10.00" class="sc-notoserifcjksc">次成功尝试变为有安全防护措施时的</text><text x="490.30" y="692.41" font-size="10.00" class="sc-loraregular sc-k">1/200</text><text x="521.08" y="692.41" font-size="10.00" class="sc-notoserifcjksc">所</text><text x="72.00" y="706.61" font-size="10.00" class="sc-notoserifcjksc">致（开启自适应思考时为一个测试用例，关闭思考时为两个）。</text><text x="352.00" y="706.61" font-size="10.00" class="sc-loraregular">1</text><text x="358.27" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次尝试的差异分别相当于多出</text><text x="490.90" y="706.61" font-size="10.00" class="sc-loraregular">4</text><text x="498.95" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次和</text><text x="521.58" y="706.61" font-size="10.00" class="sc-loraregular">3</text><text x="529.78" y="706.61" font-size="10.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="720.81" font-size="10.00" class="sc-notoserifcjksc">成功，分母为</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">其他评估中均未观察到这一模式（例如，参见下一节关于浏览器使用的内容，其采用相同的防</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">护）。与编程一节类似，该评估使用了针对</text><text x="283.89" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">真实部署中，攻击成功率很可能会更低。</text><text x="72.00" y="163.59" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="163.59" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="468.00" y="195.97" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude in</text><text x="72.00" y="211.59" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Chrome</text><text x="116.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.09" y="211.59" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Cowork</text><text x="249.13" y="211.59" font-size="11.00" class="sc-notoserifcjksc">。我们最初在发布</text><text x="340.03" y="211.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.5</text><text x="425.73" y="211.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="439.62" y="211.59" font-size="11.00" class="sc-loraregular sc-k">Claude for Chrome</text><text x="72.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出了</text><text x="182.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="226.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">；随着后续模型相继使早期测试攻击集达到饱和，我们定期用更</text><text x="72.00" y="242.83" font-size="11.00" class="sc-notoserifcjksc">复杂的环境和更强的攻击对其进行更新。该评估由一系列网页环境组成，我们会向页面中动态注</text><text x="72.00" y="258.45" font-size="11.00" class="sc-notoserifcjksc">入不可信内容，模型随后通过截图或页面读取查看这些页面。</text><text x="72.00" y="325.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="157.95" y="325.51" font-size="11.00" class="sc-notoserifcjksc">在我们此前的自动化浏览器使用评估中的攻击成功率已接近于零。为继续衡量</text><text x="72.00" y="341.13" font-size="11.00" class="sc-notoserifcjksc">进展，我们与专业红队成员合作，在更复杂的网页环境中针对</text><text x="371.89" y="341.13" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="419.56" y="341.13" font-size="11.00" class="sc-notoserifcjksc">自适应地发现新的攻击，</text><text x="72.00" y="356.75" font-size="11.00" class="sc-notoserifcjksc">并整理出一组</text><text x="140.89" y="356.75" font-size="11.00" class="sc-loraregular">148</text><text x="159.93" y="356.75" font-size="11.00" class="sc-notoserifcjksc">个环境，这些环境未用于此处所评估模型的训练。我们将攻击成功率报告为成</text><text x="72.00" y="372.37" font-size="11.00" class="sc-notoserifcjksc">功的注入在模型实际看到的注入中所占的比例，因为能力不同的模型可能以不同方式在环境中导</text><text x="72.00" y="487.43" font-size="11.00" class="sc-notoserifcjksc">我们比较了无安全防护措施的模型，以及部署了我们为利用浏览器和计算机使用工具的各类产品</text><text x="72.00" y="503.05" font-size="11.00" class="sc-notoserifcjksc">所提供的安全防护措施的模型。</text><text x="72.00" y="704.01" font-size="10.00" class="sc-notoserifcjksc">共</text><text x="84.63" y="704.01" font-size="10.00" class="sc-loraregular">2800</text><text x="110.67" y="704.01" font-size="10.00" class="sc-notoserifcjksc">次尝试。两项差异在统计上均无法与零区分（配对置换检验</text><text x="373.30" y="704.01" font-size="10.00" class="sc-loraitalic">p</text><text x="379.01" y="704.01" font-size="10.00" class="sc-notoserifcjksc">≈</text><text x="391.64" y="704.01" font-size="10.00" class="sc-loraregular sc-k">0.5</text><text x="405.60" y="704.01" font-size="10.00" class="sc-notoserifcjksc">）。</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" y="187.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="468.00" y="187.17" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="503.40" y="187.17" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="506.29" y="187.17" width="9.77" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="516.06" y="187.17" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="72.00" y="202.79" width="41.19" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="113.19" y="202.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="116.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="202.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="127.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="138.09" y="202.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="138.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="149.09" y="202.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="149.09" y="202.79" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="171.09" y="202.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="171.09" y="202.79" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="206.49" y="202.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="209.38" y="202.79" width="39.75" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="182.00" y="218.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="182.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="193.00" y="218.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="193.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="204.00" y="218.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="204.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="215.00" y="218.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/prompt-injection-defenses" rel="noopener"><rect x="215.00" y="218.41" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="76.75" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="182.91" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="208.24" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="233.57" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="260.32" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="287.06" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="313.81" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="340.55" font-size="10.99" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="365.88" font-size="10.99" class="sc-notoserifcjkscbold">关闭思考</text><text x="250.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施</text><text x="250.00" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功</text><text x="250.00" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="250.00" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="260.99" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="270.93" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="324.25" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="324.25" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="335.24" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="345.18" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="397.75" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施</text><text x="397.75" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功</text><text x="397.75" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="397.75" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="408.74" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="418.68" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="472.00" y="143.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="472.00" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="482.99" y="159.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">%</text><text x="492.93" y="159.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="383.40" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="383.40" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员提示词注入攻击在浏览器使用环境中的攻击成功率</text><text x="378.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="495.10" y="383.40" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="513.10" y="383.40" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。</text><text x="261.00" y="395.10" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="270.00" y="395.10" font-size="9.00" class="sc-notoserifcjksc">我们报告按环境计和按尝试计的攻击成功率（</text><text x="450.00" y="395.10" font-size="9.00" class="sc-loraregular">ASR</text><text x="466.39" y="395.10" font-size="9.00" class="sc-notoserifcjksc">）。按环境计的攻</text><text x="72.00" y="406.80" font-size="9.00" class="sc-notoserifcjksc">击成功率衡量是否至少有一次尝试成功；按尝试计的攻击成功率汇总了全部</text><text x="371.37" y="406.80" font-size="9.00" class="sc-loraregular">148</text><text x="386.95" y="406.80" font-size="9.00" class="sc-notoserifcjksc">个环境中的所有单次尝试（每个环境</text><text x="72.00" y="418.50" font-size="9.00" class="sc-loraregular">10</text><text x="83.23" y="418.50" font-size="9.00" class="sc-notoserifcjksc">次尝试）。</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">由于攻击是针对</text><text x="151.89" y="462.21" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="199.56" y="462.21" font-size="11.00" class="sc-notoserifcjksc">自适应获取的，它们可能无法完全反映</text><text x="389.45" y="462.21" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="435.58" y="462.21" font-size="11.00" class="sc-notoserifcjksc">或其他模型特有的漏</text><text x="72.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">洞。因此，</text><text x="127.00" y="477.83" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="173.13" y="477.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="187.03" y="477.83" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="234.69" y="477.83" font-size="11.00" class="sc-notoserifcjksc">结果之间的显著差异应谨慎解读。无安全防护措施时，与</text><text x="72.00" y="493.45" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="125.98" y="493.45" font-size="11.00" class="sc-notoserifcjksc">（考虑到攻击的获取方式，它是比</text><text x="293.87" y="493.45" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="341.53" y="493.45" font-size="11.00" class="sc-notoserifcjksc">更可靠的比较对象）相比，</text><text x="473.53" y="493.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="509.07" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="509.07" font-size="11.00" class="sc-notoserifcjksc">将开启思考时按环境计的攻击成功率降低了</text><text x="300.17" y="509.07" font-size="11.00" class="sc-loraregular">13×</text><text x="319.03" y="509.07" font-size="11.00" class="sc-notoserifcjksc">以上，从</text><text x="365.92" y="509.07" font-size="11.00" class="sc-loraregular sc-k">54.05%</text><text x="405.71" y="509.07" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="430.60" y="509.07" font-size="11.00" class="sc-loraregular sc-k">4.05%</text><text x="461.50" y="509.07" font-size="11.00" class="sc-notoserifcjksc">，这使</text><text x="497.39" y="509.07" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="72.00" y="524.69" font-size="11.00" class="sc-notoserifcjksc">在无防护时的表现更接近</text><text x="195.89" y="524.69" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="280.48" y="524.69" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="294.38" y="524.69" font-size="11.00" class="sc-loraregular sc-k">0.68%</text><text x="325.74" y="524.69" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="591.75" font-size="11.00" class="sc-notoserifcjksc">在部署安全防护措施后，无论哪种思考模式，</text><text x="292.00" y="591.75" font-size="11.00" class="sc-loraregular">148</text><text x="311.04" y="591.75" font-size="11.00" class="sc-notoserifcjksc">个环境中均没有攻击能对</text><text x="434.93" y="591.75" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="519.36" y="591.75" font-size="11.00" class="sc-notoserifcjksc">成</text><text x="115.51" y="607.37" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="200.10" y="607.37" font-size="11.00" class="sc-notoserifcjksc">持平，也是我们在该基准测试上观察到的最强结果。对于上一代模</text><text x="72.00" y="622.99" font-size="11.00" class="sc-notoserifcjksc">型，安全防护措施在开启思考时将</text><text x="239.89" y="622.99" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="296.76" y="622.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.66" y="622.99" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="358.32" y="622.99" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率降至相近的约</text><text x="493.21" y="622.99" font-size="11.00" class="sc-loraregular sc-k">2.70%</text><text x="522.95" y="622.99" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="712.06" font-size="5.40" class="sc-loraregular">13</text><text x="79.34" y="715.06" font-size="9.00" class="sc-notoserifcjksc">攻击是针对</text><text x="126.71" y="715.06" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="197.03" y="715.06" font-size="9.00" class="sc-notoserifcjksc">自适应获取的，然后迁移到其他模型上。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们正在通过针对性攻击发现，继续调查特定于模型的漏洞。我们也在持续提升安全防护措施的</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">鲁棒性，同时尽量减少延迟以及对正常使用的干扰。</text></svg></div>
