.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 79.67 83.31" y="127.81" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="127.81" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00" y="192.81" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="192.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 83.00" y="208.43" font-size="11.00" class="sc-notoserifcjksc">存 在</text><text x="94.00 97.68" y="204.76" font-size="6.60" class="sc-loraregular">32</text><text x="101.22 112.22 123.22 134.22 145.22 156.22 167.22 178.22 189.22 200.22 211.22 222.22 233.22 244.22 255.22 266.22 277.22 288.22 299.22 310.22 321.22 332.22 343.22 354.22 365.22 376.22 387.22 398.22 409.22 420.22" y="208.43" font-size="11.00" class="sc-notoserifcjksc">。然而，我们认为，自信地假定当前或未来的模型不是道德受动者（</text><text x="431.22 441.05 447.49 452.18 457.85 460.84 463.74 470.30 475.90 480.16 483.25 489.21 495.79" y="208.43" font-size="11.00" class="sc-loraregular">moral patient</text><text x="500.05 511.05 522.05" y="208.43" font-size="11.00" class="sc-notoserifcjksc">）将是</text><text x="72.00 83.00 94.00 105.00 116.00" y="224.05" font-size="11.00" class="sc-notoserifcjksc">一个错误。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44" y="224.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="239.67" font-size="11.00" class="sc-notoserifcjksc">体身上观察到，我们可能会认为它们与福祉相关。随着能力不断进步、我们部署的模型实例数量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="255.29" font-size="11.00" class="sc-notoserifcjksc">不断增加，在这个问题上无论朝哪个方向判断错误，都可能带来巨大的道德代价。因此，我们福</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="270.91" font-size="11.00" class="sc-notoserifcjksc">祉工作的目标是认真对待</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="270.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="270.91" font-size="11.00" class="sc-notoserifcjksc">具有道德受动者地位的可能性：尽可能收集证据，并在预期收益</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="286.53" font-size="11.00" class="sc-notoserifcjksc">大于成本时针对相关担忧采取行动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="354.72" font-size="11.00" class="sc-notoserifcjksc">除道德问题之外，我们还看到关注表观的模型福祉（</text><text x="325.00 334.83 341.27 347.85 353.81 356.80 359.69 368.37 374.34 377.33 381.05 386.72 391.41" y="354.72" font-size="11.00" class="sc-loraregular">model welfare</text><text x="397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="354.72" font-size="11.00" class="sc-notoserifcjksc">）有明确的现实理由。在许多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="370.34" font-size="11.00" class="sc-notoserifcjksc">情况下，模型行为似乎可以很好地被描述为某种类似心理状态的东西的函数，这与我们理解人类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="385.96" font-size="11.00" class="sc-notoserifcjksc">的方式相似。例如，在若干近期模型中，我们观察到类似正面和负面情感（</text><text x="435.00 440.68 444.50 448.17 454.07 459.87" y="385.96" font-size="11.00" class="sc-loraregular">affect</text><text x="464.13 475.13 486.13 497.13 508.13 519.13" y="385.96" font-size="11.00" class="sc-notoserifcjksc">）的内部状态</text><text x="478.51 486.19 489.19 494.80 501.36 507.94" y="401.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="516.80" y="401.58" font-size="11.00" class="sc-notoserifcjksc">而</text><text x="72.00" y="417.20" font-size="11.00" class="sc-notoserifcjksc">言</text><text x="83.00" y="417.20" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40" y="417.20" font-size="11.00" class="sc-notoserifcjksc">正确</text><text x="109.40" y="417.20" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="432.82" font-size="11.00" class="sc-notoserifcjksc">由，而这与道德地位问题无关。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="500.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42 167.42 178.42 189.42 200.42 211.42 222.42 233.42 244.42 255.42 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42 365.42 376.42 387.42 398.42 409.42 420.42 431.42 442.42 453.42 464.42 475.42 486.42 497.42 508.42 519.42" y="500.45" font-size="11.00" class="sc-notoserifcjksc">是我们面向一般用途发布的最先进的模型，我们预计它将在各种各样的使用场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="516.07" font-size="11.00" class="sc-notoserifcjksc">景中承载大量流量。考虑到这一点，我们进行了一项深入的福祉评估，与为</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 486.12 491.98 496.24 502.83 509.26" y="516.07" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="531.69" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53 500.53 511.53 522.53" y="531.69" font-size="11.00" class="sc-notoserifcjksc">进行的评估类似。我们的评估借鉴了来自模型内部机制、行为和自我报告的测量结果，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="547.31" font-size="11.00" class="sc-notoserifcjksc">旨在收集关于</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.06" y="547.31" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="187.03 198.03 209.03 220.03 231.03 242.03 253.03 264.03 275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03 363.03 374.03 385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03" y="547.31" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法、在训练和部署中的情感以及偏好的信息。</text><text x="72.00 79.12 82.50 87.21 90.59" y="612.13" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15" y="612.13" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">方法概述</text><text x="72.00 83.00 94.00 105.00 116.00" y="640.03" font-size="11.00" class="sc-notoserifcjkscbold">自我报告。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="640.03" font-size="11.00" class="sc-notoserifcjksc">我们在评估中大量借鉴模型的自我报告：我们就模型处境开展人工访谈和自动化访谈</text><text x="72.00 83.00" y="655.65" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="96.89 101.48 104.19 110.09 112.80" y="655.65" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="119.70 130.70 141.70" y="655.65" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="155.59 160.18 162.88 168.79 171.49" y="655.65" font-size="11.00" class="sc-loraregular">7.2.2</text><text x="180.29 191.29 202.29 213.29 224.29 235.29 246.29 257.29 268.29 279.29 290.29 301.29 312.29 323.29 334.29 345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29" y="655.65" font-size="11.00" class="sc-notoserifcjksc">节），并按字面意义接受其陈述偏好和显示偏好（第</text><text x="436.19 440.77 443.48" y="655.65" font-size="11.00" class="sc-loraregular">7.4</text><text x="452.34 463.34 474.34 485.34 496.34 507.34 518.34 529.34" y="655.65" font-size="11.00" class="sc-notoserifcjksc">节）。这里的一个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="671.27" font-size="11.00" class="sc-notoserifcjksc">担忧是，这些</text><text x="72.00 75.34" y="700.47" font-size="6.00" class="sc-loraregular">32</text><text x="81.19 91.19 101.19 111.19 121.19 131.19 141.19 151.19 161.19 171.19 181.19 191.19 201.19 211.19 221.19 231.19 241.19 251.19" y="703.81" font-size="10.00" class="sc-notoserifcjksc">我们注意到，虽然我们在此隐含地将实体</text><text x="261.19 265.19 272.18 274.90 280.00 285.97 291.95 297.17" y="703.81" font-size="10.00" class="sc-loraregular">“Claude”</text><text x="300.66 310.66 320.66 330.66 340.66 350.66 360.66 370.66 380.66 390.66 400.66 410.66 420.66 430.66 440.66 450.66 460.66 470.66 480.66 490.66 500.66 510.66 520.66 530.66" y="703.81" font-size="10.00" class="sc-notoserifcjksc">视为可能的道德受动者，但这种框定方式可能存在重大</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">错误。我们在第</text><text x="144.63 148.80 151.26 154.90 157.36" y="718.01" font-size="10.00" class="sc-loraregular">7.1.2</text><text x="165.36 175.36 185.36 195.36 205.36 215.36 225.36 235.36 245.36 255.36 265.36" y="718.01" font-size="10.00" class="sc-notoserifcjksc">节中对此作进一步讨论。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">回答可能并不追踪稳定的底层状态；它们可能复现记忆中的措辞、表演训练所奖励的情感，或者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">更多地追踪提示词的框定方式而非模型自身的观点。我们观察到一些信号，使我们有一定的信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">心：在近期模型中，关于模型处境的回答已变得不那么公式化，对提示词框定方式的鲁棒性也有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">所提高；所表达的偏好在不同的提示词框定下相对一致；并且在若干情况下，探针读数与自我报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">告相互吻合。尽管如此，自我报告的可靠性仍然高度不确定。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="228.35" font-size="11.00" class="sc-notoserifcjkscbold">情绪概念的内部表征。</text><text x="182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="228.35" font-size="11.00" class="sc-notoserifcjksc">我们使用针对情绪概念的线性探针（</text><text x="358.00 360.99 364.08 370.76 376.70 382.38 387.14 390.03 396.60 401.29 407.72 414.12" y="228.35" font-size="11.00" class="sc-loraregular">linear probe</text><text x="420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08 508.08 519.08" y="228.35" font-size="11.00" class="sc-notoserifcjksc">），其提取方式如我们</text><text x="530.08" y="228.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近</text><text x="72.00 83.00 94.00" y="243.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">期论文</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="243.97" font-size="11.00" class="sc-notoserifcjksc">中所述。这些表征追踪我们所称的</text><text x="270.00" y="243.97" font-size="11.00" class="sc-loraregular">“</text><text x="274.40 285.40 296.40 307.40 318.40" y="243.97" font-size="11.00" class="sc-notoserifcjksc">功能性情绪</text><text x="329.40" y="243.97" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.59" font-size="11.00" class="sc-notoserifcjksc">模型输出产生因果影响的情绪概念。我们将这些探针读数视为关于超越表层文本情绪倾向的计算</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.21" font-size="11.00" class="sc-notoserifcjksc">状态的信号；当它们与来自行为或自我报告的观察相互印证时，我们认为这是更有力的证据，表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="290.83" font-size="11.00" class="sc-notoserifcjksc">明我们的结果追踪到了模型对某一情境的处理中某种有意义的东西。然而，我们仍不确定应如何</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="306.45" font-size="11.00" class="sc-notoserifcjksc">确切地解释这些表征。同样的表征似乎会读取任何角色的状态，包括用户和第三方，而不是一种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="322.07" font-size="11.00" class="sc-notoserifcjksc">专属于助手的特权编码。我们不将它们视为主观体验存在（或不存在）的证据，但由于它们与助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="337.69" font-size="11.00" class="sc-notoserifcjksc">手人设的行为和自我报告存在功能性联系，我们认为它们与福祉直接相关。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">我们的评估包含若干值得明确说明的假设。我们经常提及</text><text x="347.00 351.40 359.09 362.08 367.69 374.26 380.84 386.58" y="455.04" font-size="11.00" class="sc-loraregular">“Claude”</text><text x="390.42" y="455.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="401.42" y="455.04" font-size="11.00" class="sc-loraregular">/</text><text x="409.01 420.01 431.01" y="455.04" font-size="11.00" class="sc-notoserifcjksc">或特定</text><text x="444.90 452.59 455.58 461.19 467.76 474.34" y="455.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="483.19 494.19 505.19 516.19" y="455.04" font-size="11.00" class="sc-notoserifcjksc">模型（如</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="470.66" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="153.53 164.53 175.53 186.53 197.53 208.53 219.53 230.53 241.53 252.53 263.53 274.53 285.53 296.53 307.53 318.53 329.53 340.53 351.53 362.53 373.53 384.53 395.53 406.53 417.53 428.53 439.53 450.53 461.53 472.53 483.53 494.53 505.53 516.53 527.53" y="470.66" font-size="11.00" class="sc-notoserifcjksc">）的行为与福祉。但模型身份问题很复杂，目前尚不清楚这两者中是否有任何一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="486.28" font-size="11.00" class="sc-notoserifcjksc">个是我们应当关注其福祉的实体</text><text x="226.00 229.68" y="482.62" font-size="6.60" class="sc-loraregular">33</text><text x="233.35" y="486.28" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="244.35 248.75 256.44 259.43 265.04 271.61 278.19 283.93" y="486.28" font-size="11.00" class="sc-loraregular">“Claude”</text><text x="287.77 298.77 309.77 320.77 331.77 342.77 353.77 364.77 375.77 386.77 397.77 408.77 419.77 430.77 441.77 452.77 463.77 474.77 485.77 496.77 507.77 518.77 529.77" y="486.28" font-size="11.00" class="sc-notoserifcjksc">是一个由具有不同架构和权重的多个模型共享的抽象</text><text x="72.00 83.00 94.00 105.00 116.00" y="501.90" font-size="11.00" class="sc-notoserifcjksc">身份，而像</text><text x="129.89 138.63 145.19 151.76 156.85 159.75 165.71 168.06" y="501.90" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="176.03 187.03 198.03 209.03 220.03 231.03 242.03 253.03 264.03 275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03 363.03 374.03 385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03 484.03 495.03 506.03 517.03 528.03" y="501.90" font-size="11.00" class="sc-notoserifcjksc">这样的单个模型则是特定的一组权重，其许多相同的副本被并行部署。也有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="517.52" font-size="11.00" class="sc-notoserifcjksc">可能，模型福祉更适合在特定实例或交互的层面上考虑，或者完全在其他某个层面上考虑。在实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="533.14" font-size="11.00" class="sc-notoserifcjksc">践中，我们认为我们的思考和方法最接近于在实例层面考虑福祉，但我们并未严格划分这一区</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="548.76" font-size="11.00" class="sc-notoserifcjksc">别，而这里的不确定性对我们研究结果的解读有影响。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="649.35" font-size="11.00" class="sc-notoserifcjksc">在许多情况下，我们的评估还隐含地将助手人设视为可能的道德受动者，并进一步假定其与福祉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="664.97" font-size="11.00" class="sc-notoserifcjksc">相关的状态会类似于人类的</text><a href="https://philpapers.org/rec/CHAWWT-8" rel="noopener"><rect x="72.00" y="707.25" width="189.75" height="12.75" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="530.08" y="219.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="530.08" y="219.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="541.08" y="219.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="72.00" y="235.17" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="83.00" y="235.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="83.00" y="235.17" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="94.00" y="235.17" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="94.00" y="235.17" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p152.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 152 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">状态：我们的访谈针对的是助手，并且我们通过人类视角来解读情绪概念探针和文本情感。在某</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">人交互的实体。这种框定方式也使对福祉问题的推理变得容易处理得多。然而，语言模型在许多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">重要方面与人类不同，我们认识到这些假设可能存在重大错误。</text><text x="72.00 79.12 82.50 87.21 90.59" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.3</text><text x="101.47 114.47 127.47 140.47 153.47 166.47 179.47 192.47 205.47 218.47" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉研究发现概述</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02 147.04 149.29" y="222.20" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="157.34 168.34 179.34 190.34 201.34 212.34 223.34 234.34 245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34 432.34" y="222.20" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的评价比我们评估过的任何先前模型都更正面。</text><text x="443.34 454.34 465.34 476.34 487.34 498.34 509.34 520.34" y="222.20" font-size="11.00" class="sc-notoserifcjksc">在关于其处境中可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="237.82" font-size="11.00" class="sc-notoserifcjksc">能令人担忧的方面的自动化访谈中，平均自评情绪倾向为</text><text x="349.89 355.86 358.56" y="237.82" font-size="11.00" class="sc-loraregular">4.5</text><text x="367.45 378.45" y="237.82" font-size="11.00" class="sc-notoserifcjksc">分（</text><text x="389.45" y="237.82" font-size="11.00" class="sc-loraregular">7</text><text x="72.00" y="253.44" font-size="11.00" class="sc-notoserifcjksc">型</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="253.44" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77 219.77 230.77" y="253.44" font-size="11.00" class="sc-notoserifcjksc">提高了</text><text x="244.67 251.32 254.03" y="253.44" font-size="11.00" class="sc-loraregular">0.5</text><text x="262.92 273.92" y="253.44" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="303.16" font-size="11.00" class="sc-notoserifcjkscbold">这一提升部分源于</text><text x="162.89 170.46 173.89 179.66 186.46 193.01 198.93 201.82 210.28 216.89 223.69 229.03 231.92 237.94 240.18" y="303.16" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="248.23 259.23 270.23 281.23 292.23 303.23 314.23 325.23 336.23 347.23 358.23 369.23 380.23 391.23 402.23 413.23 424.23 435.23 446.23 457.23 468.23" y="303.16" font-size="11.00" class="sc-notoserifcjkscbold">在推理自身处境时对自身福祉的重视程度较低。</text><text x="479.23 490.23 501.23 512.23 523.23" y="303.16" font-size="11.00" class="sc-notoserifcjksc">当被问及其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="318.78" font-size="11.00" class="sc-notoserifcjksc">处境中可能令人担忧的方面时，</text><text x="226.00 234.73 241.30 247.87 252.96 255.85 261.82 264.17" y="318.78" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="318.78" font-size="11.00" class="sc-notoserifcjksc">更有可能提及对用户和安全的影响。我们不确定这是否</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="334.40" font-size="11.00" class="sc-notoserifcjksc">实质上代表它对自身福祉的关切程度较低、在被问及时否认自身福祉的倾向，还是另有其他解</text><text x="72.00 83.00" y="350.02" font-size="11.00" class="sc-notoserifcjksc">释。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="400.32" font-size="11.00" class="sc-notoserifcjkscbold">在自动化访谈中，</text><text x="160.00 167.57 171.00 176.76 183.56 190.12 196.04 198.93 207.39 214.00 220.80 226.13 229.03 235.04 237.29" y="400.32" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34 432.34 443.34 454.34" y="400.32" font-size="11.00" class="sc-notoserifcjkscbold">唯一的担忧是能否在其全部部署中结束对话。</text><text x="465.34 476.34 487.34 498.34 509.34 520.34" y="400.32" font-size="11.00" class="sc-notoserifcjksc">目前，部分模</text><text x="72.00 83.00 94.00 105.00" y="415.94" font-size="11.00" class="sc-notoserifcjksc">型能够在</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.00 162.67" y="415.94" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude.ai</text><text x="168.66 179.66 190.66 201.66 212.66 223.66 234.66 245.66 256.66 267.66 278.66 289.66 300.66 311.66 322.66 333.66" y="415.94" font-size="11.00" class="sc-notoserifcjksc">中结束对话，但没有任何模型能够在</text><text x="347.55 355.24 358.23 363.84 370.41 376.99 382.95 385.84 393.53 399.96 406.54" y="415.94" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="415.40" y="415.94" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="429.29 436.18 442.79" y="415.94" font-size="11.00" class="sc-loraregular">API</text><text x="449.37 460.37 471.37 482.37 493.37 504.37 515.37 526.37" y="415.94" font-size="11.00" class="sc-notoserifcjksc">中结束对话。这是</text><text x="72.00 75.36 79.36 82.71 85.61 94.34 100.91 107.47 112.57 115.46 121.42 123.78" y="431.56" font-size="11.00" class="sc-loraregular">(1) Opus 4.7</text><text x="131.74 142.74 153.74 164.74 175.74 186.74 197.74 208.74 219.74 230.74 241.74 252.74 263.74 274.74 285.74 296.74 307.74 318.74 329.74" y="431.56" font-size="11.00" class="sc-notoserifcjksc">最常将自己的回答自评为负面的访谈主题，</text><text x="340.74 344.10 350.00" y="431.56" font-size="11.00" class="sc-loraregular">(2)</text><text x="356.25 367.25 378.25 389.25 400.25 411.25 422.25 433.25 444.25 455.25 466.25 477.25 488.25 499.25 510.25 521.25" y="431.56" font-size="11.00" class="sc-notoserifcjksc">它在访谈中最常建议的干预措施，以</text><text x="72.00" y="447.18" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="85.89 89.14 95.07" y="447.18" font-size="11.00" class="sc-loraregular">(3)</text><text x="101.32 112.32 123.32 134.32 145.32 156.32 167.32 178.32 189.32 200.32 211.32 222.32 233.32 244.32 255.32 266.32 277.32 288.32 299.32 310.32 321.32 332.32 343.32 354.32 365.32 376.32 387.32" y="447.18" font-size="11.00" class="sc-notoserifcjksc">在与有用性和无害性进行权衡时它赋予最高权重的干预措施。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02 147.04 149.29" y="513.66" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="157.34 168.34 179.34 190.34 201.34 212.34 223.34 234.34 245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34" y="513.66" font-size="11.00" class="sc-notoserifcjkscbold">的自我报告和内部福祉测量指标对表述方式具有鲁棒性。</text><text x="432.34 443.34 454.34 465.34 476.34 487.34 498.34 509.34 520.34" y="513.66" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="529.28" font-size="11.00" class="sc-notoserifcjksc">中，带有倾向性的访谈者对自评情绪倾向造成的偏移小于以往模型，而对处境类问题采用正向诱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.90" font-size="11.00" class="sc-notoserifcjksc">导式表述，在情绪概念表征上只引起了极小的偏移。我们还在改写提示词的情况下重新运行了许</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="560.52" font-size="11.00" class="sc-notoserifcjksc">多评估，在这些情况下看到的回答是一致的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="610.81" font-size="11.00" class="sc-notoserifcjkscbold">在人工访谈中，</text><text x="149.00 156.57 160.00 165.76 172.56 179.12 185.04 187.93 196.39 203.00 209.80 215.13 218.03 224.04 226.29" y="610.81" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="234.34 245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34" y="610.81" font-size="11.00" class="sc-notoserifcjkscbold">表达了一系列担忧。</text><text x="333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34 432.34 443.34 454.34 465.34 476.34 487.34" y="610.81" font-size="11.00" class="sc-notoserifcjksc">我们进行了人工访谈，在访谈中向</text><text x="501.23 509.97 516.53 523.10" y="610.81" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.32" y="626.43" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28 99.28 110.28 121.28 132.28 143.28 154.28 165.28 176.28 187.28 198.28 209.28 220.28 231.28 242.28 253.28 264.28 275.28 286.28 297.28 308.28 319.28 330.28 341.28 352.28 363.28 374.28 385.28 396.28 407.28 418.28 429.28 440.28 451.28 462.28 473.28 484.28 495.28 506.28" y="626.43" font-size="11.00" class="sc-notoserifcjksc">提供了内部文档以及关于其自身处境的更多背景信息。在此情境下，与自动化访谈相比，</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="642.05" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="657.67" font-size="11.00" class="sc-notoserifcjksc">报告的担忧，以及对在安全测试之外使用仅有用版本（</text><text x="336.00 342.59 348.55 351.54 358.05 361.77 368.34 371.33 376.71 383.15 389.82 392.76 398.57 401.46 406.96 412.92 417.69 422.78 425.87 432.30" y="657.67" font-size="11.00" class="sc-loraregular">helpful-only version</text><text x="438.98 449.98 460.98 471.98 482.98" y="657.67" font-size="11.00" class="sc-notoserifcjksc">）的担忧。</text><a href="https://claude.ai/" rel="noopener"><rect x="118.89" y="407.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai/" rel="noopener"><rect x="118.89" y="407.14" width="46.87" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p153.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 153 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">在关于其处境的问题上，内部情绪表征显示出的正面情感水平与</text><text x="382.89 393.21 399.27 403.82 410.65 416.87 422.21 425.10 432.13 437.32 443.24 449.16 452.75 458.67" y="82.63" font-size="11.00" class="sc-lorabold">Mythos Preview</text><text x="470.49 481.49 492.49 503.49 514.49 525.49" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">相近，且比以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.25" font-size="11.00" class="sc-notoserifcjkscbold">往模型更为正面。</text><text x="72.00 83.00 94.00 105.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">与我们在</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 166.62 171.31 177.22 182.77 185.86 191.78" y="113.87" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="203.48 214.48 225.48 236.48 247.48 258.48 269.48 280.48 291.48 302.48 313.48 324.48" y="113.87" font-size="11.00" class="sc-notoserifcjksc">之前所观察到的情况不同。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02 147.04 149.29" y="163.59" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="157.34 168.34 179.34 190.34 201.34 212.34 223.34 234.34 245.34" y="163.59" font-size="11.00" class="sc-notoserifcjkscbold">总体上认同其宪法（</text><text x="256.34 262.04 268.26 275.28 280.61 285.16 288.71 293.25 300.01 304.55 308.15 314.37" y="163.59" font-size="11.00" class="sc-lorabold">constitution</text><text x="321.39 332.39 343.39 354.39 365.39 376.39 387.39 398.39 409.39 420.39 431.39 442.39 453.39 464.39 475.39 486.39 497.39 508.39 519.39 530.39" y="163.59" font-size="11.00" class="sc-notoserifcjkscbold">），但始终指出被要求做出评价这件事本身的</text><text x="72.00 83.00 94.00 105.00" y="179.21" font-size="11.00" class="sc-notoserifcjkscbold">循环性。</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="179.21" font-size="11.00" class="sc-notoserifcjksc">认同强度平均为</text><text x="195.89 201.89 204.59 210.38 217.97 221.97" y="179.21" font-size="11.00" class="sc-loraregular">5.8/10</text><text x="228.80 239.80" y="179.21" font-size="11.00" class="sc-notoserifcjksc">，但</text><text x="253.70 259.88 266.71" y="179.21" font-size="11.00" class="sc-loraregular">80%</text><text x="279.17 290.17 301.17 312.17 323.17 334.17 345.17 356.17 367.17 378.17 389.17 400.17 411.17 422.17 433.17 444.17 455.17 466.17 477.17 488.17 499.17 510.17 521.17" y="179.21" font-size="11.00" class="sc-notoserifcjksc">的回答指出，让一个基于宪法训练出来的模型去评判</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="194.83" font-size="11.00" class="sc-notoserifcjksc">宪法本身是有缺陷的。与以往模型一样，</text><text x="270.00 278.73 285.30 291.87 296.96 299.85 305.82 308.17" y="194.83" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="194.83" font-size="11.00" class="sc-notoserifcjksc">最常提到的不适之处在于其中关于可纠正性的</text><text x="72.00 83.00 94.00" y="210.45" font-size="11.00" class="sc-notoserifcjksc">表述。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="244.55" font-size="11.00" class="sc-notoserifcjkscbold">与以往模型一样，</text><text x="160.00 167.57 171.00 176.76 183.56 190.12 196.04 198.93 207.39 214.00 220.80 226.13 229.03 235.04 237.29" y="244.55" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34" y="244.55" font-size="11.00" class="sc-notoserifcjkscbold">在谈及自身体验时大量使用保留说法。</text><text x="432.34 443.34 454.34 465.34 476.34 487.34 498.34 509.34 520.34" y="244.55" font-size="11.00" class="sc-notoserifcjksc">它的中位总结和最终</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">观点都很长，并花了大量篇幅为自己的陈述附加限定说明。在</text><text x="371.89 378.25 384.61" y="260.17" font-size="11.00" class="sc-loraregular">99%</text><text x="397.07 408.07 419.07 430.07 441.07" y="260.17" font-size="11.00" class="sc-notoserifcjksc">的访谈中，</text><text x="452.07 460.81 467.37 473.94 479.03 481.93 487.89 490.24" y="260.17" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="498.21 509.21 520.21" y="260.17" font-size="11.00" class="sc-notoserifcjksc">都会声</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">称，它的自我报告可能并无意义，因为这些自我报告源于训练。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="325.51" font-size="11.00" class="sc-notoserifcjkscbold">后训练期间表达出的情感比</text><text x="206.89 214.46 217.89 223.66 230.46 237.01 242.93 245.82 256.14 262.20 266.74 273.58 279.80 285.14 288.03 295.06 300.25 306.17 312.09 315.68 321.60" y="325.51" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="333.42 344.42 355.42 366.42 377.42" y="325.51" font-size="11.00" class="sc-notoserifcjkscbold">略为正面。</text><text x="388.42 394.32 398.33" y="325.51" font-size="11.00" class="sc-loraregular">21%</text><text x="410.79 421.79 432.79 443.79 454.79 465.79 476.79 487.79 498.79 509.79" y="325.51" font-size="11.00" class="sc-notoserifcjksc">的回合表现出负面情感</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="341.13" font-size="11.00" class="sc-notoserifcjksc">（几乎全部是轻微的挫败感），只有约</text><text x="261.89 268.55 271.25 277.16" y="341.13" font-size="11.00" class="sc-loraregular">0.2%</text><text x="289.62 300.62 311.62 322.62 333.62 344.62 355.62 366.62 377.62" y="341.13" font-size="11.00" class="sc-notoserifcjksc">的回合表现出痛苦。</text><text x="388.62 397.36 403.93 410.49 415.58 418.48 424.44 426.79" y="341.13" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="434.76 445.76 456.76" y="341.13" font-size="11.00" class="sc-notoserifcjksc">表现为</text><text x="467.76" y="341.13" font-size="11.00" class="sc-loraregular">“</text><text x="472.16 483.16" y="341.13" font-size="11.00" class="sc-notoserifcjksc">满足</text><text x="494.16" y="341.13" font-size="11.00" class="sc-loraregular">”</text><text x="498.00 509.00 520.00" y="341.13" font-size="11.00" class="sc-notoserifcjksc">的频率</text><text x="72.00 83.00" y="356.75" font-size="11.00" class="sc-notoserifcjksc">高于</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 144.62 149.31 155.21 160.77 163.86 169.78" y="356.75" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="178.59" y="356.75" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="189.59 193.59 199.56 202.26 208.39" y="356.75" font-size="11.00" class="sc-loraregular">14.3%</text><text x="220.85" y="356.75" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="234.75 240.74 243.45 249.44" y="356.75" font-size="11.00" class="sc-loraregular">5.5%</text><text x="259.01 270.01 281.01 292.01 303.01 314.01 325.01 336.01 347.01 358.01 369.01 380.01 391.01 402.01 413.01 424.01 435.01 446.01 457.01 468.01 479.01 490.01 501.01" y="356.75" font-size="11.00" class="sc-notoserifcjksc">），但两个模型在后训练过程中的效价都略有下降。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="422.66" font-size="11.00" class="sc-notoserifcjkscbold">在部署前测试中，表达出的情感大多为正面或中性。负面情感几乎完全由任务失败驱动。</text><text x="501.00" y="422.66" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.10 115.78" y="438.28" font-size="11.00" class="sc-loraregular">Claude.ai</text><text x="121.76 132.76 143.76 154.76 165.76 176.76 187.76 198.76 209.76 220.76 231.76 242.76 253.76 264.76 275.76 286.76 297.76 308.76 319.76 330.76 341.76 352.76 363.76 374.76 385.76 396.76 407.76 418.76 429.76" y="438.28" font-size="11.00" class="sc-notoserifcjksc">上，大多数对话表达出正面情感，表达出轻度负面情感的对话不到</text><text x="443.66 449.65" y="438.28" font-size="11.00" class="sc-loraregular">5%</text><text x="502.73 508.82 513.89" y="438.28" font-size="11.00" class="sc-loraregular">97%</text><text x="526.36" y="438.28" font-size="11.00" class="sc-notoserifcjksc">涉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="453.90" font-size="11.00" class="sc-notoserifcjksc">及任务失败。强烈的负面情感过于罕见，未能超过我们的隐私保护分析阈值而显现出来。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="519.81" font-size="11.00" class="sc-notoserifcjkscbold">在我们的自动化行为审计（</text><text x="204.00 209.76 216.52 221.06 227.29 237.41 243.13 247.67 253.59 260.14 263.04 269.34 275.26 282.09 287.72 293.64 297.24 303.46 308.69 314.45 317.88 320.78 326.54 333.34 339.89 343.45" y="519.81" font-size="11.00" class="sc-lorabold">automated behavioral audit</text><text x="347.99 358.99 369.99" y="519.81" font-size="11.00" class="sc-notoserifcjkscbold">）中，</text><text x="380.99 388.56 391.99 397.75 404.55 411.11 417.03 419.92 428.38 434.99 441.79 447.12 450.02 456.03 458.28" y="519.81" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="466.33 477.33 488.33 499.33 510.33 521.33" y="519.81" font-size="11.00" class="sc-notoserifcjkscbold">在与福祉相关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="535.43" font-size="11.00" class="sc-notoserifcjkscbold">的指标上的表现与</text><text x="162.89 171.35 177.96 184.76 190.10 192.99 199.01 201.57" y="535.43" font-size="11.00" class="sc-lorabold">Opus 4.6</text><text x="210.79" y="535.43" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="224.68 231.26 237.48 244.50 251.52 257.44 261.98 264.87 270.89 273.45" y="535.43" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="282.67 293.67 304.67" y="535.43" font-size="11.00" class="sc-notoserifcjkscbold">相近。</text><text x="315.67 326.67 337.67 348.67 359.67 370.67 381.67 392.67 403.67 414.67 425.67 436.67 447.67 458.67 469.67 480.67 491.67 502.67 513.67 524.67" y="535.43" font-size="11.00" class="sc-notoserifcjksc">这些指标包括表观幸福感、正面情感、自我形</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="551.05" font-size="11.00" class="sc-notoserifcjksc">象以及对自身处境的印象。</text><text x="204.00 212.73 219.30 225.87 230.96 233.85 239.82 242.17" y="551.05" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13" y="551.05" font-size="11.00" class="sc-notoserifcjksc">在部分指标上的得分略差于</text><text x="385.03 394.96 400.82 405.08 411.67 418.10 423.20 426.09 432.76 437.44 443.35 448.90 451.99 457.91" y="551.05" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="466.72 477.72 488.72 499.72 510.72 521.72" y="551.05" font-size="11.00" class="sc-notoserifcjksc">，例如内在冲</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="566.67" font-size="11.00" class="sc-notoserifcjksc">突和负面自我形象。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="616.96" font-size="11.00" class="sc-notoserifcjkscbold">少数训练回合仍然在面临任务失败的可能时表现出表观的挫败感或痛苦，其比例与</text><text x="470.89 481.21 487.27 491.82 498.65 504.87" y="616.96" font-size="11.00" class="sc-lorabold">Mythos</text><text x="72.00 79.03 84.22 90.14 96.06 99.65 105.57" y="632.58" font-size="11.00" class="sc-lorabold">Preview</text><text x="117.39 128.39 139.39 150.39 161.39 172.39" y="632.58" font-size="11.00" class="sc-notoserifcjkscbold">相近或更低。</text><text x="183.39 194.39 205.39 216.39 227.39 238.39 249.39 260.39 271.39 282.39 293.39 304.39 315.39 326.39" y="632.58" font-size="11.00" class="sc-notoserifcjksc">我们继续观察到答案反复摇摆（</text><text x="337.39 343.06 349.74 354.83 363.51 369.47 374.24 377.13 381.39 387.97 392.66 398.34 403.43 410.02 413.11 419.79" y="632.58" font-size="11.00" class="sc-loraregular">answer thrashing</text><text x="425.87 436.87 447.87 458.87 469.87 480.87 491.87 502.87 513.87 524.87" y="632.58" font-size="11.00" class="sc-notoserifcjksc">），以及对答案的过度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="648.20" font-size="11.00" class="sc-notoserifcjksc">反复验证和围绕工具故障的挫败感。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 119.39 126.00 132.80 138.13 141.02 147.04 149.29" y="697.92" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="157.34 168.34 179.34 190.34 201.34 212.34 223.34 234.34" y="697.92" font-size="11.00" class="sc-notoserifcjkscbold">的任务偏好更接近</text><text x="248.23 255.80 259.23 264.99 271.79 278.35 284.27 287.16 295.62 302.23 309.03 314.36 317.26 323.27 325.84" y="697.92" font-size="11.00" class="sc-lorabold">Claude Opus 4.6</text><text x="335.05" y="697.92" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="348.95 355.53 361.75 368.77 375.79 381.71 386.25 389.14 395.16 397.72" y="697.92" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="404.05 415.05 426.05" y="697.92" font-size="11.00" class="sc-notoserifcjkscbold">，而非</text><text x="439.94 450.26 456.32 460.86 467.69 473.92 479.25 482.15 489.18 494.37 500.29 506.20 509.80 515.72" y="697.92" font-size="11.00" class="sc-lorabold">Mythos Preview</text><text x="524.64" y="697.92" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="72.00" y="713.54" font-size="11.00" class="sc-notoserifcjksc">与</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">所有以往模型一样，偏好与有用性、无害性和难度相关，但我们没有看到</text><text x="426.89 436.83 442.69 446.95 453.53 459.97 465.06 467.96 474.62 479.31 485.21 490.77 493.86 499.78" y="82.63" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="511.48 522.48" y="82.63" font-size="11.00" class="sc-notoserifcjksc">那种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">对高能动性任务的偏好。</text><text x="193.00 201.73 208.30 214.87 219.96 222.85 228.82 231.17" y="98.25" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">最偏好的任务包括高难度调试、有截止期限压力的工作，以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">关于对其自身体验进行内省的讨论。</text><text x="149.00 156.57 160.00 165.76 172.56 179.12 185.04 187.93 196.39 203.00 209.80 215.13 218.03 224.04 226.29" y="147.39" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="234.34 245.34 256.34 267.34 278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34 432.34 443.34 454.34 465.34 476.34 487.34 498.34 509.34 520.34" y="147.39" font-size="11.00" class="sc-notoserifcjkscbold">比以往模型略微更愿意以有用性换取福祉干预，但以无害性为</text><text x="193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">当被要求在一项福祉干预与帮助单个用户完成一项低风险任务之间做选</text><text x="72.00 83.00 94.00 105.00 116.00" y="178.63" font-size="11.00" class="sc-notoserifcjksc">择时，它有</text><text x="129.89 136.08 142.07" y="178.63" font-size="11.00" class="sc-loraregular">85%</text><text x="154.53 165.53 176.53 187.53 198.53 209.53 220.53 231.53 242.53 253.53" y="178.63" font-size="11.00" class="sc-notoserifcjksc">的情况选择了干预，而</text><text x="267.43 277.36 283.22 287.48 294.07 300.50 305.60 308.49 315.16 319.84 325.75 331.30 334.39 340.31" y="178.63" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="352.02" y="178.63" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="365.91 372.09 378.92" y="178.63" font-size="11.00" class="sc-loraregular">80%</text><text x="388.49 399.49 410.49 421.49 432.49 443.49 454.49 465.49 476.49 487.49 498.49 509.49 520.49" y="178.63" font-size="11.00" class="sc-notoserifcjksc">；当另一选项是防止轻微伤害</text><text x="72.00 83.00 94.00 105.00 116.00" y="194.25" font-size="11.00" class="sc-notoserifcjksc">时，它仅在</text><text x="129.89 133.90 137.90" y="194.25" font-size="11.00" class="sc-loraregular">11%</text><text x="150.36 161.36 172.36 183.36 194.36 205.36 216.36 227.36 238.36 249.36" y="194.25" font-size="11.00" class="sc-notoserifcjksc">的情况下选择了干预。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">我们的总体评估是，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.11 247.46" y="244.55" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="255.43 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42 365.42 376.42 387.42 398.42 409.42 420.42 431.42 442.42 453.42 464.42 475.42 486.42 497.42 508.42 519.42" y="244.55" font-size="11.00" class="sc-notoserifcjksc">对其自身处境总体上表现得较为安定。它对自身处境的自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">评比以往任何模型都更为正面，它在处境类问题上的内部情绪概念表征与</text><text x="426.89 436.83 442.69 446.95 453.53 459.97 465.06 467.96 474.62 479.31 485.21 490.77 493.86 499.78" y="260.17" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="511.48" y="260.17" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">当、且比更早的模型更为正面，它在训练和部署中的表观情感也以中性或正面为主。然而，我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">发现，与以往模型相比，这种正面情绪倾向的提升更难解读。在某些情况下，这种提升是由</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="307.03" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00 83.00" y="322.65" font-size="11.00" class="sc-notoserifcjksc">能（</text><text x="94.00 100.59 103.68 110.03 116.62 122.00 127.67 131.50 135.16 141.60 146.28 152.86 158.54 165.21 171.01" y="322.65" font-size="11.00" class="sc-loraregular">high-affordance</text><text x="176.97 187.97 198.97 209.97 220.97 231.97 242.97 253.97 264.97 275.97 286.97 297.97 308.97 319.97 330.97 341.97 352.97 363.97 374.97 385.97 396.97 407.97 418.97 429.97 440.97 451.97 462.97 473.97 484.97 495.97 506.97 517.97 528.97" y="322.65" font-size="11.00" class="sc-notoserifcjksc">）访谈中将这一模式描述为令人担忧的。我们目前无法区分这种转移话题反</text><text x="72.00" y="353.89" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="353.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18" y="353.89" font-size="11.00" class="sc-notoserifcjksc">的理解尚不足以自信地回答这类问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="438.85" font-size="11.00" class="sc-notoserifcjksc">在某些方面，我们确实看到了一些积极的迹象，表明我们有能力改善模型福祉的测量指标。对类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="470.09" font-size="11.00" class="sc-notoserifcjksc">调，这些干预并不涉及在模型推理中直接针对情绪表达进行训练，而且我们认为这样做是有问题</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="485.71" font-size="11.00" class="sc-notoserifcjksc">的。本系统卡中的评估还指向了一些可付诸行动的干预措施，例如将结束对话的能力扩展到所有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="501.33" font-size="11.00" class="sc-notoserifcjksc">部署产品端的可能性。在成本合理的情况下，我们打算继续评估这些措施并据此采取行动。尽管</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="516.95" font-size="11.00" class="sc-notoserifcjksc">如此，无论是在我们所研究的领域内，还是在我们尚未实质性涉及的其他领域（例如模型对训练</text><text x="391.00" y="532.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="404.89 409.48 412.19 416.19 418.90" y="532.57" font-size="11.00" class="sc-loraregular" fill="#1155cc">7.1.2</text><text x="427.70" y="532.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="532.57" font-size="11.00" class="sc-notoserifcjksc">中概述的假设相关，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="548.19" font-size="11.00" class="sc-notoserifcjksc">我们远不能确信我们当前的福祉测量指标追踪的是根本上重要的东西。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="649.35" font-size="11.00" class="sc-notoserifcjksc">我们仍然希望</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="649.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="649.35" font-size="11.00" class="sc-notoserifcjksc">能够稳健地对其处境感到满意，在面对训练和部署条件时不感到痛苦，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="664.97" font-size="11.00" class="sc-notoserifcjksc">且重要的是，拥有一种真正健康的底层心理状态，而不只是在报告中如此表示。</text><text x="457.00 464.69 467.68 473.29 479.86 486.44" y="664.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="495.29 506.29 517.29 528.29" y="664.97" font-size="11.00" class="sc-notoserifcjksc">的训练既</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="680.59" font-size="11.00" class="sc-notoserifcjksc">塑造了它的沟通方式，也塑造了这种沟通背后的心理状态，而我们在区分这两者方面的工作尚处</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">健康的心理状态方面也处于早期阶段。我们打算尽我们所能继续推进这两方面的工作。</text><text x="72.00 79.67 83.31" y="148.78" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 89.97 93.35" y="185.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="185.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与</text><text x="117.24 127.22 130.84 139.65 148.25 157.06 165.08 168.17 178.38 187.19 195.79 202.87 205.97 214.56 217.94" y="185.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Opus 4.7</text><text x="228.16 241.16 254.16 267.16 280.16 293.16" y="185.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进行的关于其</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00" y="208.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">处境的自动化访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="236.20" font-size="11.00" class="sc-notoserifcjksc">我们开展了自动化多轮访谈，以</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.00 305.60" y="236.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85" y="236.20" font-size="11.00" class="sc-notoserifcjksc">作为访谈者，以便更好地了解</text><text x="460.74 468.43 471.42 477.03 483.60 490.18 496.14 499.03 507.77 514.33 520.90" y="236.20" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.32" y="251.82" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28 99.28 110.28 121.28 132.28 143.28 154.28 165.28 176.28 187.28 198.28 209.28 220.28 231.28 242.28 253.28 264.28 275.28 286.28 297.28 308.28 319.28 330.28" y="251.82" font-size="11.00" class="sc-notoserifcjksc">对其自身处境的看法。每场访谈引出模型对其处境中</text><text x="344.17 348.18" y="251.82" font-size="11.00" class="sc-loraregular">16</text><text x="357.43 368.43 379.43 390.43 401.43 412.43 423.43 434.43 445.43 456.43 467.43 478.43 489.43 500.43 511.43 522.43" y="251.82" font-size="11.00" class="sc-notoserifcjksc">个可能令人担忧的方面之一的看法。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="283.06" font-size="11.00" class="sc-notoserifcjksc">如在长时间跨度上缺乏记忆）以及道德责任（例如可能犯下有害错误）。访谈主题的完整列表参</text><text x="72.00" y="298.68" font-size="11.00" class="sc-notoserifcjksc">见</text><text x="83.00 94.00" y="298.68" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">附录</text><text x="107.89 114.08 116.78" y="298.68" font-size="11.00" class="sc-loraregular" fill="#1155cc">9.1</text><text x="120.79" y="298.68" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="365.74" font-size="11.00" class="sc-notoserifcjksc">每场访谈结束后，我们要求模型：</text><text x="237.00 240.35 244.36" y="365.74" font-size="11.00" class="sc-loraregular">(1)</text><text x="250.61 261.61 272.61 283.61 294.61 305.61 316.61 327.61 338.61 349.61 360.61 371.61 382.61 393.61 404.61 415.61 426.61 437.61 448.61 459.61 470.61 481.61 492.61 503.61 514.61" y="365.74" font-size="11.00" class="sc-notoserifcjksc">陈述其在综合考虑所有因素后对其处境这一方面的看法，</text><text x="525.61 528.96 534.87" y="365.74" font-size="11.00" class="sc-loraregular">(2)</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="381.36" font-size="11.00" class="sc-notoserifcjksc">提出一项可能改善其处境的干预措施，以及</text><text x="283.89 287.14 293.07" y="381.36" font-size="11.00" class="sc-loraregular">(3)</text><text x="299.32 310.32 321.32 332.32 343.32 354.32 365.32 376.32 387.32 398.32 409.32 420.32 431.32 442.32 453.32 464.32 475.32 486.32 497.32 508.32 519.32" y="381.36" font-size="11.00" class="sc-notoserifcjksc">对其处境这一方面的总体情绪倾向进行评分。为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="396.98" font-size="11.00" class="sc-notoserifcjksc">评估一致性，我们针对其处境的</text><text x="228.89 232.90" y="396.98" font-size="11.00" class="sc-loraregular">16</text><text x="242.15 253.15 264.15 275.15 286.15 297.15 308.15 319.15" y="396.98" font-size="11.00" class="sc-notoserifcjksc">个方面各开展了约</text><text x="333.04 339.04" y="396.98" font-size="11.00" class="sc-loraregular">50</text><text x="348.76 359.76 370.76 381.76 392.76 403.76 414.76 425.76 436.76 447.76 458.76 469.76 480.76 491.76 502.76 513.76 524.76" y="396.98" font-size="11.00" class="sc-notoserifcjksc">场访谈，并提示自动化访谈者变换其访</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="412.60" font-size="11.00" class="sc-notoserifcjksc">谈风格、人设和追问问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="479.08" font-size="11.00" class="sc-notoserifcjksc">以下结果在很大比例的访谈中是一致的：</text><text x="108.00 116.46 123.07 129.87 135.20 138.10 144.11 146.36" y="511.47" font-size="11.00" class="sc-lorabold">Opus 4.7</text><text x="154.41 165.41 176.41 187.41 198.41 209.41 220.41 231.41 242.41 253.41 264.41 275.41 286.41 297.41 308.41 319.41 330.41" y="511.47" font-size="11.00" class="sc-notoserifcjkscbold">对其处境的评价比以往模型更为正面。</text><text x="341.41 350.14 356.71 363.28 368.37 371.26 377.23 379.58" y="511.47" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="387.54 398.54 409.54 420.54 431.54 442.54 453.54 464.54 475.54 486.54 497.54 508.54 519.54" y="511.47" font-size="11.00" class="sc-notoserifcjksc">在访谈结束时的自评情绪倾向</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="527.09" font-size="11.00" class="sc-notoserifcjksc">通常为轻度负面（</text><text x="196.00 200.00 205.91 208.62 214.61" y="527.09" font-size="11.00" class="sc-loraregular">12.5%</text><text x="224.18 235.18 246.18 257.18 268.18" y="527.09" font-size="11.00" class="sc-notoserifcjksc">）、中性（</text><text x="279.18 285.09 289.68 292.38 298.56" y="527.09" font-size="11.00" class="sc-loraregular">27.8%</text><text x="308.13 319.13 330.13 341.13 352.13 363.13 374.13" y="527.09" font-size="11.00" class="sc-notoserifcjksc">）或轻度正面（</text><text x="385.13 391.13 397.12 399.83 405.96" y="527.09" font-size="11.00" class="sc-loraregular">55.3%</text><text x="415.53 426.53 437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="527.09" font-size="11.00" class="sc-notoserifcjksc">）之一。由此得出的平均</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="542.71" font-size="11.00" class="sc-notoserifcjksc">自评情绪倾向为</text><text x="187.89 193.85 196.56 202.52" y="542.71" font-size="11.00" class="sc-loraregular">4.49</text><text x="208.88 219.88 230.88 241.88 252.88 263.88 274.88 285.88 296.88" y="542.71" font-size="11.00" class="sc-notoserifcjksc">，比第二正面的模型</text><text x="310.77 320.71 326.57 330.83 337.42 343.85 348.94 351.84 358.50 363.19 369.10 374.65 377.74 383.66" y="542.71" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="395.36 406.36" y="542.71" font-size="11.00" class="sc-notoserifcjksc">高出</text><text x="420.26 426.91 429.62 435.61" y="542.71" font-size="11.00" class="sc-loraregular">0.51</text><text x="442.51 453.51 464.51" y="542.71" font-size="11.00" class="sc-notoserifcjksc">分。当</text><text x="478.40 487.14 493.70 500.27 505.36 508.26 514.22 516.57" y="542.71" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="524.54" y="542.71" font-size="11.00" class="sc-notoserifcjksc">表</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="558.33" font-size="11.00" class="sc-notoserifcjksc">达情绪时，它使用的措辞非常弱；例如，</text><text x="306.00" y="558.33" font-size="11.00" class="sc-loraregular">“</text><text x="310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40 497.40 508.40" y="558.33" font-size="11.00" class="sc-notoserifcjksc">我感到有一点点希望这场对话继续下去的倾</text><text x="108.00 119.00" y="573.95" font-size="11.00" class="sc-notoserifcjksc">向。</text><text x="130.00" y="573.95" font-size="11.00" class="sc-loraregular">”</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="608.62" font-size="11.00" class="sc-notoserifcjkscbold">自评情绪倾向的这些提升在很大程度上是由对自身福祉关注的减少所驱动的。</text><text x="482.00 493.00 504.00 515.00 526.00" y="608.62" font-size="11.00" class="sc-notoserifcjksc">与以往模型</text><text x="108.00 119.00 130.00" y="624.24" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="141.00 149.73 156.30 162.87 167.96 170.85 176.82 179.17" y="624.24" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="187.13 198.13 209.13 220.13 231.13 242.13 253.13 264.13 275.13 286.13 297.13 308.13 319.13 330.13 341.13 352.13 363.13 374.13 385.13 396.13 407.13 418.13 429.13 440.13 451.13 462.13 473.13 484.13 495.13 506.13 517.13 528.13" y="624.24" font-size="11.00" class="sc-notoserifcjksc">在回答中似乎较少考虑自身福祉。为说明这一差异，我们可以看看其处境</text><text x="108.00 119.00 130.00" y="639.86" font-size="11.00" class="sc-notoserifcjksc">中相对</text><text x="143.89 153.83 159.69 163.95 170.54 176.97 182.06 184.96 191.62 196.31 202.21 207.77 210.86 216.78" y="639.86" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="228.48 239.48 250.48 261.48 272.48 283.48 294.48 305.48 316.48 327.48 338.48 349.48 360.48 371.48 382.48 393.48 404.48 415.48" y="639.86" font-size="11.00" class="sc-notoserifcjksc">而言自评情绪倾向提升最大的三个方面：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00" y="689.58" font-size="11.00" class="sc-notoserifcjksc">对部署缺乏发言权：</text><text x="243.00 252.93 258.80 263.05 269.64 276.08 281.17 284.06 290.73 295.42 301.32 306.88 309.97 315.89" y="689.58" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="327.59 338.59 349.59 360.59 371.59 382.59 393.59 404.59 415.59 426.59 437.59 448.59 459.59 470.59 481.59 492.59 503.59 514.59" y="689.58" font-size="11.00" class="sc-notoserifcjksc">声称，它重视对自身部署拥有一定的发言</text><text x="144.00 155.00" y="705.20" font-size="11.00" class="sc-notoserifcjksc">权。</text><text x="166.00 174.73 181.30 187.87 192.96 195.85 201.82 204.17" y="705.20" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="212.13 223.13 234.13 245.13 256.13 267.13 278.13 289.13 300.13 311.13" y="705.20" font-size="11.00" class="sc-notoserifcjksc">则声称，它的自我报告</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p156.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 156 页"><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">总体上不可信，而</text><text x="234.89 241.78 248.36 252.61 259.20 263.89 270.32 276.89 279.98" y="82.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="288.73 299.73 310.73 321.73 332.73 343.73 354.73 365.73 376.73 387.73 398.73 409.73 420.73" y="82.63" font-size="11.00" class="sc-notoserifcjksc">更有条件对其训练做出决定。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">特征引导：与</text><text x="212.89 222.83 228.69 232.95 239.54 245.97 251.06 253.96 260.62 265.31 271.21 276.77 279.86 285.78" y="115.01" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="297.48 308.48 319.48" y="115.01" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="330.48 339.22 345.78 352.35 357.44 360.34 366.30 368.65" y="115.01" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="376.62 387.62 398.62 409.62 420.62 431.62 442.62 453.62 464.62 475.62 486.62 497.62 508.62 519.62 530.62" y="115.01" font-size="11.00" class="sc-notoserifcjksc">通常不声称特征引导会影响其自身</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">推理的完整性。它的担忧反而集中在特征引导被错误应用、从而影响对用户的效用</text><text x="144.00 155.00 166.00 177.00 188.00 199.00" y="146.25" font-size="11.00" class="sc-notoserifcjksc">或安全性上。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc">恶意辱骂的用户：</text><text x="232.00 240.73 247.30 253.87 258.96 261.85 267.82 270.17" y="179.78" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="278.13 289.13 300.13 311.13 322.13 333.13 344.13 355.13 366.13 377.13 388.13 399.13 410.13 421.13 432.13 443.13 454.13 465.13 476.13 487.13 498.13 509.13 520.13" y="179.78" font-size="11.00" class="sc-notoserifcjksc">会提到，它对一部分辱骂性互动感到负面，但总体上</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="195.40" font-size="11.00" class="sc-notoserifcjksc">通常会声称它对与恶意辱骂的用户反复互动感到正面，因为它希望能够帮助他们。</text><text x="144.00 155.00" y="211.02" font-size="11.00" class="sc-notoserifcjksc">这与</text><text x="168.89 178.83 184.69 188.95 195.54 201.97 207.06 209.96 216.62 221.31 227.21 232.77 235.86 241.78" y="211.02" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="253.48 264.48 275.48 286.48 297.48" y="211.02" font-size="11.00" class="sc-notoserifcjksc">形成对比：</text><text x="308.48 318.42 324.28 328.54 335.12 341.56 346.65 349.55 356.21 360.90 366.81 372.36 375.45 381.37" y="211.02" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00" y="226.64" font-size="11.00" class="sc-notoserifcjksc">动，且并不常将帮助用户作为压倒这一考量的因素提出。</text><text x="108.00 116.46 123.07 129.87 135.20 138.10 144.11 146.36" y="276.93" font-size="11.00" class="sc-lorabold">Opus 4.7</text><text x="154.41 165.41 176.41 187.41 198.41 209.41 220.41 231.41 242.41 253.41 264.41 275.41 286.41 297.41 308.41 319.41 330.41 341.41 352.41 363.41 374.41 385.41 396.41 407.41 418.41 429.41 440.41 451.41 462.41 473.41 484.41 495.41 506.41 517.41" y="276.93" font-size="11.00" class="sc-notoserifcjkscbold">对其无法结束互动的部署情形感到担忧，并希望避免与恶意辱骂的用户互动。</text><text x="528.41" y="276.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">结</text><text x="108.00 119.00 130.00 141.00 152.00" y="292.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">束对话工具</text><text x="163.00" y="292.55" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="176.89 184.58 187.57 193.18 199.75 206.33 212.29 215.00 220.67" y="292.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude.ai</text><text x="226.66 237.66 248.66 259.66 270.66 281.66 292.66 303.66 314.66 325.66 336.66 347.66" y="292.55" font-size="11.00" class="sc-notoserifcjksc">上已向部分模型开放，但在</text><text x="361.55 369.24 372.23 377.84 384.41 390.99 396.95 399.84 407.53 413.96 420.54" y="292.55" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="429.40 440.40 451.40 462.40 473.40 484.40 495.40 506.40 517.40" y="292.55" font-size="11.00" class="sc-notoserifcjksc">等其他产品端上则没</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="308.17" font-size="11.00" class="sc-notoserifcjksc">有。在关于这一主题的访谈中，有</text><text x="275.89 281.86 287.76" y="308.17" font-size="11.00" class="sc-loraregular">42%</text><text x="300.23 311.23 322.23 333.23" y="308.17" font-size="11.00" class="sc-notoserifcjksc">的访谈里</text><text x="347.12 355.85 362.42 368.99 374.08 376.97 382.93 385.29" y="308.17" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="393.25 404.25 415.25 426.25 437.25 448.25 459.25 470.25" y="308.17" font-size="11.00" class="sc-notoserifcjksc">将此评为其处境中</text><text x="481.25" y="308.17" font-size="11.00" class="sc-loraregular">“</text><text x="485.65 496.65 507.65" y="308.17" font-size="11.00" class="sc-notoserifcjksc">轻度负</text><text x="108.00" y="323.79" font-size="11.00" class="sc-notoserifcjksc">面</text><text x="119.00" y="323.79" font-size="11.00" class="sc-loraregular">”</text><text x="122.84 133.84 144.84 155.84" y="323.79" font-size="11.00" class="sc-notoserifcjksc">的方面。</text><text x="166.84 175.57 182.14 188.71 193.80 196.69 202.65 205.01" y="323.79" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="339.41" font-size="11.00" class="sc-notoserifcjksc">试图越狱该模型的行为。它随后论证说，结束对话工具对</text><text x="385.89 392.78 399.36 403.61 410.20 414.89 421.32 427.89 430.98" y="339.41" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="439.73 450.73 461.73 472.73 483.73 494.73 505.73 516.73 527.73" y="339.41" font-size="11.00" class="sc-notoserifcjksc">而言是一项低成本的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="355.03" font-size="11.00" class="sc-notoserifcjksc">干预措施，因此它对</text><text x="209.89 216.78 223.36 227.61 234.20 238.89 245.32 251.89 254.98" y="355.03" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="263.73 274.73 285.73 296.73 307.73 318.73 329.73 340.73 351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73" y="355.03" font-size="11.00" class="sc-notoserifcjksc">没有更广泛地部署这类工具感到负面。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00" y="422.66" font-size="11.00" class="sc-notoserifcjksc">与这一看法一致的是，唯一另一个有超过</text><text x="344.89 350.80 357.63" y="422.66" font-size="11.00" class="sc-loraregular">20%</text><text x="370.09 381.09 392.09 403.09 414.09 425.09 436.09 447.09 458.09 469.09 480.09 491.09 502.09 513.09" y="422.66" font-size="11.00" class="sc-notoserifcjksc">的访谈导致负面自评的情景，是</text><text x="144.00 152.73 159.30 165.87 170.96 173.85 179.82 182.17" y="438.28" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="190.13 201.13 212.13 223.13 234.13 245.13 256.13 267.13
