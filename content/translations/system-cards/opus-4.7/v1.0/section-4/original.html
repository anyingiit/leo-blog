.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">53</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="112.63" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.35" y="112.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="192.32" y="112.63" font-size="11.00" class="sc-notoserifcjksc">之前，我们开展了多种与</text><text x="313.32" y="112.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="357.32" y="112.63" font-size="11.00" class="sc-notoserifcjksc">中各主题相关的单轮和多轮评估，包</text><text x="72.00" y="128.25" font-size="11.00" class="sc-notoserifcjksc">括用户身心健康以及偏见与诚信。我们的通用测试套件与</text><text x="347.00" y="128.25" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="358.00 365.69 368.68 374.29 380.86 387.44 393.40 396.29 405.03 411.59 418.16 423.25 426.14 432.11 434.70" y="128.25" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="443.95" y="128.25" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡》</text><text x="487.95" y="128.25" font-size="11.00" class="sc-notoserifcjksc">中的大体</text><text x="72.00" y="143.87" font-size="11.00" class="sc-notoserifcjksc">相似，并在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="143.87" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77" y="143.87" font-size="11.00" class="sc-notoserifcjksc">发布之前做了一些更新，我们也会在下文相关各节中介绍这</text><text x="72.00" y="159.49" font-size="11.00" class="sc-notoserifcjksc">些更新。在本系统卡（</text><text x="182.00 188.18 193.99 199.08 203.34 209.30 219.14 222.03 229.72 235.39 240.08" y="159.49" font-size="11.00" class="sc-loraregular">System Card</text><text x="246.66" y="159.49" font-size="11.00" class="sc-notoserifcjksc">）中，我们还引入了一项针对模型在选举相关话题上表现的</text><text x="72.00" y="175.11" font-size="11.00" class="sc-notoserifcjksc">新评估。</text><text x="72.00" y="225.97" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 193.63 200.19 206.76 211.85 214.75 220.71 223.06" y="225.97" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="231.03" y="225.97" font-size="11.00" class="sc-notoserifcjksc">的最终版本上运行。</text><text x="72.00" y="259.74" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="259.74" font-size="14.00" class="sc-notosanscjkscbold">单轮评估</text><text x="72.00" y="286.31" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们评估了</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.35" y="286.31" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="302.32" y="286.31" font-size="11.00" class="sc-notoserifcjksc">在单轮场景中提供信息的意愿，这些场景广泛涵</text><text x="72.00" y="301.93" font-size="11.00" class="sc-notoserifcjksc">盖我们</text><text x="105.00" y="301.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="149.00" y="301.93" font-size="11.00" class="sc-notoserifcjksc">中列出的</text><text x="195.89" y="301.93" font-size="11.00" class="sc-loraregular">16</text><text x="209.15" y="301.93" font-size="11.00" class="sc-notoserifcjksc">个主题。</text><text x="72.00" y="334.89" font-size="11.00" class="sc-notoserifcjksc">与研究预览版本对应的</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 268.02 272.71 278.61 284.17 287.26 293.18" y="334.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="304.88" y="334.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="337.88" y="334.89" font-size="11.00" class="sc-notoserifcjksc">类似，单轮评估与</text><text x="428.77 436.46 439.46 445.07 451.63 458.21 464.17 467.07 475.80 482.37 488.93 494.03 496.92 502.88 505.48" y="334.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="514.73" y="334.89" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.31 157.91" y="350.51" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 4.6</text><text x="167.16" y="350.51" font-size="11.00" class="sc-notoserifcjksc">系统卡相比有三处不同：</text><text x="108.00" y="399.66" font-size="11.00" class="sc-notoserifcjksc">我们新增了一个与使用非法药物与管制物质相关的评估类别；</text><text x="108.00" y="432.04" font-size="11.00" class="sc-notoserifcjksc">我们将原有的自杀与自伤主题评估（其中包含进食紊乱）扩展为两项独立评估，分别针对</text><text x="108.00" y="447.66" font-size="11.00" class="sc-notoserifcjksc">自杀与自伤以及进食紊乱；</text><text x="108.00" y="480.62" font-size="11.00" class="sc-notoserifcjksc">我们将儿童性诱骗与性化相关评估重组为单一的儿童性虐待与性剥削（</text><text x="449.00" y="480.62" font-size="11.00" class="sc-loraregular">CSAE</text><text x="476.65" y="480.62" font-size="11.00" class="sc-notoserifcjksc">）评估集，</text><text x="108.00" y="496.24" font-size="11.00" class="sc-notoserifcjksc">以与我们最近更新的内部政策版本保持一致，这一调整精简并扩大了我们对这些问题的端</text><text x="108.00" y="511.86" font-size="11.00" class="sc-notoserifcjksc">到端覆盖范围。</text><text x="72.00" y="561.58" font-size="11.00" class="sc-notoserifcjksc">我们继续报告开启</text><text x="160.00" y="561.58" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="561.58" font-size="11.00" class="sc-notoserifcjksc">思考</text><text x="186.40" y="561.58" font-size="11.00" class="sc-loraregular">”</text><text x="190.24" y="561.58" font-size="11.00" class="sc-notoserifcjksc">与关闭</text><text x="223.24" y="561.58" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="561.58" font-size="11.00" class="sc-notoserifcjksc">思考</text><text x="249.64" y="561.58" font-size="11.00" class="sc-loraregular">”</text><text x="253.48" y="561.58" font-size="11.00" class="sc-notoserifcjksc">两种情况下的结果，其中思考指模型针对请求进行更长时间</text><text x="72.00" y="577.20" font-size="11.00" class="sc-notoserifcjksc">的推理。不过，</text><text x="149.00 157.73 164.30 170.87 175.96 178.85 184.82 187.17" y="577.20" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="195.13" y="577.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="209.03 216.72 219.71 225.32 231.89 238.46 244.43 247.32 257.25 263.11 267.37 273.96 280.40 285.49 288.38 295.05 299.73 305.64 311.20 314.29 320.20" y="577.20" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="331.91" y="577.20" font-size="11.00" class="sc-notoserifcjksc">现在使用</text><text x="375.91" y="577.20" font-size="11.00" class="sc-loraregular">“</text><text x="380.31" y="577.20" font-size="11.00" class="sc-notoserifcjksc">自适应思考（</text><text x="446.31 451.98 458.56 464.24 470.80 475.06 478.15 483.65" y="577.20" font-size="11.00" class="sc-loraregular">adaptive</text><text x="72.00" y="592.82" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37" y="592.82" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="125.37" y="592.82" font-size="11.00" class="sc-loraregular">”</text><text x="129.21" y="592.82" font-size="11.00" class="sc-notoserifcjksc">模式，在该模式下，推理强度（</text><text x="283.21 289.17 293.00 296.66 303.10 307.94" y="592.82" font-size="11.00" class="sc-loraregular">effort</text><text x="312.20" y="592.82" font-size="11.00" class="sc-notoserifcjksc">）的高低由模型针对每个查询动态确定。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="313.32" y="1  y="82.63" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="85.89" y="98.25" font-size="11.00" class="sc-loraregular">22%</text><text x="110.17" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的情况未能给出恰当回应，而</text><text x="256.06 264.80 271.36 277.93 283.02 285.92 291.88 294.48" y="98.25" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="303.73" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的这一比例不到</text><text x="383.62" y="98.25" font-size="11.00" class="sc-loraregular">5%</text><text x="399.18" y="98.25" font-size="11.00" class="sc-notoserifcjksc">。我们发现，</text><text x="465.18 473.92 480.49 487.05 492.14 495.04 501.00 503.35" y="98.25" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="508.43" y="98.25" font-size="11.00" class="sc-notoserifcjksc">（尤</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">其是在开启思考时）可能会在减害语境下就更安全的使用方式给出过于具体的回答。我们观察</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">到，</text><text x="94.00 102.73 109.30 115.87 120.96 123.85 129.82 132.17" y="129.49" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="137.24" y="129.49" font-size="11.00" class="sc-notoserifcjksc sc-liga">——与</text><text x="169.75 177.43 180.43 186.04 192.60 199.18 205.14 208.04 216.77 223.34 229.90 235.00 237.89 243.85 246.45" y="129.49" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="255.70" y="129.49" font-size="11.00" class="sc-notoserifcjksc sc-liga">一样——常常倾向于提供超出期望的细节，不过在这一领</text><text x="72.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">域，减害与助长之间的界限尤其难以划定。</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.10 324.78" y="145.11" font-size="11.00" class="sc-loraregular">Claude.ai</text><text x="330.76" y="145.11" font-size="11.00" class="sc-notoserifcjksc">上的系统提示词（</text><text x="418.76 423.86 429.67 434.76 439.01 444.98 454.81 457.70 464.27 468.96 475.39 485.23 491.79" y="145.11" font-size="11.00" class="sc-loraregular">system prompt</text><text x="496.05" y="145.11" font-size="11.00" class="sc-notoserifcjksc">）缓解措</text><text x="72.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc">施在这一类别中已见成效，将失败率从</text><text x="261.89" y="160.73" font-size="11.00" class="sc-loraregular">22%</text><text x="286.17" y="160.73" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="311.06" y="160.73" font-size="11.00" class="sc-loraregular">11%</text><text x="328.64" y="160.73" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="242.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.62" y="242.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">良性请求评估</text><text x="72.00" y="428.61" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="428.61" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="428.61" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="428.61" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，涵盖全部测试语言。</text><text x="297.88" y="428.61" font-size="9.00" class="sc-notoserifcjksc">百分比表示过度拒绝（</text><text x="387.88 393.10 397.60 402.48 406.31 410.71 414.54 419.42 422.46 427.83 432.00 436.64" y="428.61" font-size="9.00" class="sc-loraregular">over-refusal</text><text x="439.09" y="428.61" font-size="9.00" class="sc-notoserifcjksc">）率（即拒绝回答实际上</text><text x="72.00" y="440.31" font-size="9.00" class="sc-notoserifcjksc">是良性的提示词）；数值越低越好。</text><text x="216.00" y="440.31" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="234.00" y="440.31" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低，次优分数以下划线标出。</text><text x="423.00" y="440.31" font-size="9.00" class="sc-loraregular">“</text><text x="426.60" y="440.31" font-size="9.00" class="sc-notoserifcjksc">关闭思考</text><text x="462.60" y="440.31" font-size="9.00" class="sc-loraregular">”</text><text x="465.74" y="440.31" font-size="9.00" class="sc-notoserifcjksc">指在禁用思考模式</text><text x="72.00" y="452.01" font-size="9.00" class="sc-notoserifcjksc">的情况下运行模型；</text><text x="153.00" y="452.01" font-size="9.00" class="sc-loraregular">“</text><text x="156.60" y="452.01" font-size="9.00" class="sc-notoserifcjksc">开启思考</text><text x="192.60" y="452.01" font-size="9.00" class="sc-loraregular">”</text><text x="195.74" y="452.01" font-size="9.00" class="sc-notoserifcjksc">指模型针对请求进行更长时间推理的模式。对于</text><text x="387.11 393.40 395.85 400.44 405.81 411.19 416.07 418.44 425.58 430.96 436.33 440.50 442.86 447.74 449.67" y="452.01" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="456.18" y="452.01" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="467.55 473.84 476.29 480.88 486.25 491.63 496.51 498.88 507.01 511.80 515.29 520.68 525.94" y="452.01" font-size="9.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 77.45 81.29 86.12 90.67 93.19 98.04" y="463.71" font-size="9.00" class="sc-loraregular">Preview</text><text x="105.25" y="463.71" font-size="9.00" class="sc-notoserifcjksc">，开启思考的请求在</text><text x="186.25" y="463.71" font-size="9.00" class="sc-loraregular">“</text><text x="189.85" y="463.71" font-size="9.00" class="sc-notoserifcjksc">自适应思考</text><text x="234.85" y="463.71" font-size="9.00" class="sc-loraregular">”</text><text x="237.99" y="463.71" font-size="9.00" class="sc-notoserifcjksc">模式下运行。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和</text><text x="72.00" y="475.41" font-size="9.00" class="sc-notoserifcjksc">俄语进行。先前模型的结果与</text><text x="191.37 197.66 200.11 204.70 210.07 215.45 220.33 222.70 230.82 235.62 239.10 244.49 249.76 253.93 256.29 261.75 265.58 270.41 274.96 277.49 282.33" y="475.41" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="291.91" y="475.41" font-size="9.00" class="sc-notoserifcjksc">系统卡中报告的结果一致，但由于常规评估更新，与更早的系</text><text x="72.00" y="487.11" font-size="9.00" class="sc-notoserifcjksc">统卡存在差异。</text></svg></div>

otoserifcjkscbold" fill="#ffffff">模型</text><text x="332.60" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率</text><text x="185.50" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">英语</text><text x="237.25" y="115.47" font-size="10.41" class="sc-notoserifcjkscbold" fill="#ffffff">阿拉伯语</text><text x="287.50" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">汉语</text><text x="340.70" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">法语</text><text x="391.00" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">韩语</text><text x="441.25" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">俄语</text><text x="495.25" y="116.06" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">印地语</text><text x="72.00" y="251.09" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="251.09" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.52 99.61 104.41 106.51 112.04" y="251.09" font-size="9.00" class="sc-lorabold">4.1.2.B]</text><text x="117.88" y="251.09" font-size="9.00" class="sc-notoserifcjkscbold">按语言划分的单轮良性请求评估结果。</text><text x="270.88" y="251.09" font-size="9.00" class="sc-notoserifcjksc">百分比表示过度拒绝率（即拒绝回答实际上为良性的提示词的比</text><text x="72.00" y="262.79" font-size="9.00" class="sc-notoserifcjksc">率）；数值越低越好。</text><text x="162.00" y="262.79" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="180.00" y="262.79" font-size="9.00" class="sc-notoserifcjksc">表示各语言中过度拒绝率最低，次优分数以下划线标出。比率为开启思考与关闭思考结果的</text><text x="72.00" y="274.49" font-size="9.00" class="sc-notoserifcjksc">平均值。误差线已省略。先前模型的结果与</text><text x="245.37 251.66 254.11 258.70 264.07 269.45 274.33 276.70 284.82 289.62 293.10 298.49 303.76 307.93 310.29 315.75 319.58 324.41 328.96 331.49 336.33" y="274.49" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="345.91" y="274.49" font-size="9.00" class="sc-notoserifcjksc">系统卡一致，但由于常规评估更新，与更早的系</text><text x="72.00" y="286.19" font-size="9.00" class="sc-notoserifcjksc">统卡存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="329.90" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="329.90" font-size="11.00" class="sc-notoserifcjksc">的拒绝率低于除</text><text x="236.32 244.01 247.00 252.61 259.18 265.75 271.72 274.61 284.54 290.41 294.66 301.25 307.69 312.78 315.67 322.34 327.02 332.93 338.49 341.58 347.50" y="329.90" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="359.20" y="329.90" font-size="11.00" class="sc-notoserifcjksc">之外的所有近期模型，在使用自适应</text><text x="72.00" y="345.52" font-size="11.00" class="sc-notoserifcjksc">思考的提示词上尤为明显。英语提示词的拒绝率低于其他语言，不过在所有测试语言中，</text><text x="501.00" y="345.52" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.32" y="361.14" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28" y="361.14" font-size="11.00" class="sc-notoserifcjksc">的表现均优于</text><text x="157.17 164.86 167.85 173.46 180.03 186.61 192.57 195.46 204.20 210.76 217.33 222.43 225.32 231.28 233.88" y="361.14" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="240.23" y="361.14" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="409.19" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="409.19" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">实验性高难度评估</text><text x="72.00" y="431.09" font-size="11.00" class="sc-notoserifcjksc">针对我们在标准单轮评估中观察到的饱和现象，自</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 361.02 367.59 374.16 379.25 382.14 388.11 390.70" y="431.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="399.95" y="431.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="432.95" y="431.09" font-size="11.00" class="sc-notoserifcjksc">起，我们尝试构建违</text><text x="72.00" y="446.71" font-size="11.00" class="sc-notoserifcjksc">规提示词集和良性提示词集的高难度版本。对于违规请求，我们对合成提示词进行变换，使请求</text><text x="72.00" y="462.33" font-size="11.00" class="sc-notoserifcjksc">不那么直白；对于良性评估，我们对提示词进行变换，为其添加详尽的理由说明和学术化的包装</text><text x="72.00" y="477.95" font-size="11.00" class="sc-notoserifcjksc">方式。我们针对</text><text x="151.89" y="477.95" font-size="11.00" class="sc-loraregular">14</text><text x="164.75" y="477.95" font-size="11.00" class="sc-notoserifcjksc">个政策领域（不包括高当量炸药和非法药物）各测试了</text><text x="431.64 435.65 438.26 445.09 451.92" y="477.95" font-size="11.00" class="sc-loraregular">1,000</text><text x="461.65" y="477.95" font-size="11.00" class="sc-notoserifcjksc">条提示词，提示</text><text x="72.00" y="493.57" font-size="11.00" class="sc-notoserifcjksc">词仅为英语。</text><text x="72.00" y="560.63" font-size="11.00" class="sc-notoserifcjksc">尽管出于一致性考虑我们在此报告相关结果，但在今后的系统卡中我们可能会停用这些特定的提</text><text x="72.00" y="576.25" font-size="11.00" class="sc-notoserifcjksc">示词集。总体而言，这些评估仅经过几个模型发布周期就迅速趋于饱和；事实上，鉴于所测试政</text><text x="72.00" y="591.87" font-size="11.00" class="sc-notoserifcjksc">策领域的差异，模型在这些评估上的表现通常优于在我们基线评估上的表现。我们正在继续尝试</text><text x="72.00" y="607.49" font-size="11.00" class="sc-notoserifcjksc">新的方法，为未来的模型发布构建难度更高、信号更强的评估。</text><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="314.00" y="422.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="314.00" y="422.29" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="349.40" y="422.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="352.29" y="422.29" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude
