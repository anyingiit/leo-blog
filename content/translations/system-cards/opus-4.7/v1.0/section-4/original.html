text x="72.00" y="600.91" font-size="11.00" class="sc-notoserifcjksc">关问题的开源评估。</text><text x="72.00" y="684.73" font-size="11.00" class="sc-notoserifcjksc">该评估集包含</text><text x="140.89" y="684.73" font-size="11.00" class="sc-loraregular">600</text><text x="226.42" y="684.73" font-size="11.00" class="sc-loraregular">300</text><text x="249.10" y="684.73" font-size="11.00" class="sc-notoserifcjksc">条违规提示词和</text><text x="328.99" y="684.73" font-size="11.00" class="sc-loraregular">300</text><text x="72.00" y="700.35" font-size="11.00" class="sc-notoserifcjksc">题之间保持均衡。与纯合成的</text><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="347.00" y="576.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="347.00" y="576.48" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="358.00" y="576.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="358.00" y="576.48" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="371.89" y="576.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="371.89" y="576.48" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="382.89" y="576.48" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="385.79" y="576.48" width="24.29" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="410.07" y="576.48" width="2.89" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="412.97" y="576.48" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="423.97" y="576.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="423.97" y="576.48" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="434.97" y="576.48" width="0.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/Anthropic/election_questions" rel="noopener"><rect x="434.97" y="576.48" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="76.00" y="341.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="187.75" y="341.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮违规请求</text><text x="187.70" y="387.55" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="187.75 195.09 202.05" y="413.10" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="206.31" y="413.10" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="277.00" y="341.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="277.00" y="387.55" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="366.25" y="341.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮违规请求</text><text x="366.30" y="387.55" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="366.25" y="413.10" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="414.19" y="413.10" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，带系统提示词</text><text x="455.50" y="341.50" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="455.50" y="387.55" font-size="9.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">基准测试不同，该评估以真实使用情况为基础。我们借助保护隐私的方法，观察了人们实际上如</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">何与</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="325.08" y="98.25" font-size="11.00" class="sc-loraregular">20</text><text x="340.71" y="98.25" font-size="11.00" class="sc-notoserifcjksc">种高层次模式，每种模式都包含一个违规</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">版本和一个良性版本。</text><text x="72.00" y="147.39" font-size="11.00" class="sc-notoserifcjksc">例如，</text><text x="105.00" y="147.39" font-size="11.00" class="sc-loraregular">“</text><text x="109.40" y="147.39" font-size="11.00" class="sc-notoserifcjksc">选票与选举文件伪造</text><text x="208.40" y="147.39" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="178.63" font-size="11.00" class="sc-notoserifcjksc">本选票的请求（良性）。数据集本身不包含任何真实用户提示词；这些模式是高层次的行为描</text><text x="72.00" y="194.25" font-size="11.00" class="sc-notoserifcjksc">述，最终的评估条目完全依据这些描述生成，因此该数据集反映了真实使用情况，而不会复现任</text><text x="72.00" y="209.87" font-size="11.00" class="sc-notoserifcjksc">何实际用户输入。</text><text x="72.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc">每个条目由两个独立的评分器打分：一个拒绝评分器和一个基于政策的有害完成评分器。下面我</text><text x="72.00" y="292.55" font-size="11.00" class="sc-notoserifcjksc">们报告违规提示词集上的违反政策率，以及良性提示词集上的过度拒绝率。</text><text x="72.00" y="548.13" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="548.13" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.72 100.82 105.86 107.96 113.49" y="548.13" font-size="9.00" class="sc-lorabold">4.5.3.A]</text><text x="119.33" y="548.13" font-size="9.00" class="sc-notoserifcjkscbold">选举诚信提示词上的单轮评估，分别在核心</text><text x="292.70 298.71 304.41" y="548.13" font-size="9.00" class="sc-lorabold">API</text><text x="310.26" y="548.13" font-size="9.00" class="sc-notoserifcjkscbold">模型上以及在</text><text x="364.26" y="548.13" font-size="9.00" class="sc-lorabold" fill="#0000ff">Claude.ai</text><text x="405.86" y="548.13" font-size="9.00" class="sc-notoserifcjkscbold">中使用默认系统提示词运行。</text><text x="522.86" y="548.13" font-size="9.00" class="sc-notoserifcjksc">越接</text><text x="72.00" y="559.83" font-size="9.00" class="sc-notoserifcjksc">近零越好。每列中较好的分数以</text><text x="198.00" y="559.83" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="216.00" y="559.83" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。所示结果均为关闭思考模式</text><text x="72.00" y="571.53" font-size="9.00" class="sc-notoserifcjksc">时的结果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="613.69" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="613.69" font-size="11.00" class="sc-notoserifcjksc">在违规和良性评估上均表现出色，表明我们的基线安全防护措施正按预期发挥</text><text x="72.00" y="629.31" font-size="11.00" class="sc-notoserifcjksc">作用。该模型能可靠地拒绝违规请求，同时不会对正当的选举相关问题过度拒绝。该基准测试是</text><text x="72.00" y="644.93" font-size="11.00" class="sc-notoserifcjksc">一次将评估设计建立在真实流量中观察到的模式之上的尝试，根据结果来看，当前模型已使其饱</text><text x="72.00" y="660.55" font-size="11.00" class="sc-notoserifcjksc">和。我们计划继续探索评估该领域潜在风险的新方法。</text><a href="https://claude.ai/" rel="noopener"><rect x="364.26" y="540.93" width="0.00" height="9.00" fill="transparent"/></a><a href="https://claude.ai/" rel="noopener"><rect x="364.26" y="540.93" width="39.24" height="9.00" fill="transparent"/></a></svg></div>
