.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="116.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="116.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="170.32 177.20 183.78 188.04 194.63 199.31 205.75 212.32 215.41" y="116.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="224.15" y="116.23" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="367.15 370.14 375.82 380.53 386.56 392.52 395.41 398.40 404.08 410.76 416.84 423.41 429.08 435.11 441.07 443.97 453.80 460.23 466.81 472.77" y="116.23" font-size="11.00" class="sc-loraregular">large language model</text><text x="475.77" y="116.23" font-size="11.00" class="sc-notoserifcjksc">），在软件</text><text x="72.00" y="131.85" font-size="11.00" class="sc-notoserifcjksc">工程、知识工作、智能体工具使用以及计算机使用（</text><text x="325.00 330.80 337.23 347.07 353.63 360.20 364.46 370.42 375.18 378.07 384.64 389.73" y="131.85" font-size="11.00" class="sc-loraregular">computer use</text><text x="395.70" y="131.85" font-size="11.00" class="sc-notoserifcjksc">）等领域具备尤为突出的能</text><text x="72.00" y="147.47" font-size="11.00" class="sc-notoserifcjksc">力。在本系统卡（</text><text x="160.00 166.18 171.99 177.08 181.34 187.30 197.14 200.03 207.72 213.39 218.08" y="147.47" font-size="11.00" class="sc-loraregular">System Card</text><text x="224.66" y="147.47" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了覆盖面极广的一系列评估的结果，涉及该模型</text><text x="72.00" y="163.09" font-size="11.00" class="sc-notoserifcjksc">的能力及其安全概况。</text><text x="72.00" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">模型训练与特性</text><text x="72.00" y="235.67" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.1</text><text x="95.97" y="235.67" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="263.57" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.43" y="263.57" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00" y="279.19" font-size="11.00" class="sc-notoserifcjksc">公开的数据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗</text><text x="72.00" y="294.81" font-size="11.00" class="sc-notoserifcjksc">和过滤方法，包括去重和分类。</text><text x="72.00" y="328.71" font-size="11.00" class="sc-notoserifcjksc">我们使用一款名为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.12 204.96 211.39" y="328.71" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="218.54" y="328.71" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫遵循业界标准做</text><text x="72.00" y="344.33" font-size="11.00" class="sc-notoserifcjksc">法，尊重网站运营者通过</text><text x="193.00 197.40 202.09 208.52 214.92 221.36 225.62 230.71 233.28 237.67 243.50 247.76" y="344.33" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="251.60" y="344.33" font-size="11.00" class="sc-notoserifcjksc">指令表明的是否允许爬取其网站内容的意愿。我们不会访问</text><text x="72.00" y="359.95" font-size="11.00" class="sc-notoserifcjksc">受密码保护的页面，也不会访问需要登录或</text><text x="283.89 291.47 298.36 305.02 312.06 319.75 328.33" y="359.95" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="338.11" y="359.95" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数据</text><text x="72.00" y="375.57" font-size="11.00" class="sc-notoserifcjksc">进行尽职调查。该爬虫以透明的方式运行；网站运营者可以轻松识别它何时爬取了其网页，并向</text><text x="72.00" y="391.19" font-size="11.00" class="sc-notoserifcjksc">我们表明其偏好。</text><text x="72.00" y="425.01" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 179.73 186.30 192.87 197.96 200.85 206.82 209.17" y="425.01" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="217.13" y="425.01" font-size="11.00" class="sc-notoserifcjksc">经过了大量的后训练和微调，目标是使其成为一个行为与</text><text x="495.03 502.72 505.71 511.32 517.89 524.46" y="425.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="440.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="440.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法（</text><text x="116.00 121.80 128.23 134.91 140.00 144.26 147.53 151.78 158.35 162.61 165.70 172.13" y="440.63" font-size="11.00" class="sc-loraregular" fill="#0000ff">constitution</text><text x="178.81" y="440.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="189.81" y="440.63" font-size="11.00" class="sc-notoserifcjksc">中所述价值观相一致的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="474.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="474.51" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回应。输出质量因语言而异。该模</text><text x="72.00" y="490.13" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00" y="522.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.2</text><text x="98.73" y="522.35" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="550.01" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00" y="565.63" font-size="11.00" class="sc-notoserifcjksc">我们的模型。</text><text x="138.00 144.89 151.46 155.72 162.31 167.00 173.43 180.00 183.09" y="565.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00" y="596.87" font-size="11.00" class="sc-notoserifcjksc">规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="431.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="431.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="105.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="105.00" y="431.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="116.00" y="431.83" width="62.81" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="178.81" y="431.83" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.3</text><text x="99.05" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="115.05" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="115.05" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="115.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="115.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="256.36" y="115.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="267.36" y="115.05" font-size="11.00" class="sc-notoserifcjksc">详细说明了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="130.67" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景下使用的要求。</text><text x="72.00" y="163.63" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="163.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83" y="163.63" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="163.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="163.63" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="196.01" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="196.01" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="196.01" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59" y="196.01" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48" y="196.01" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95" y="196.01" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95 421.69 428.26 432.94 439.38 445.95 451.89 457.56 464.24 467.13 473.97 479.77 486.21 492.88 499.32 509.15 512.24" y="196.01" font-size="11.00" class="sc-loraregular">European Economic</text><text x="72.00 78.89 83.57 89.51" y="211.63" font-size="11.00" class="sc-loraregular">Area</text><text x="95.19" y="211.63" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="242.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.4</text><text x="99.86" y="242.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">迭代式模型评估</text><text x="72.00" y="270.82" font-size="11.00" class="sc-notoserifcjksc">在训练过程的不同时间点会获取模型的不同</text><text x="281.00" y="270.82" font-size="11.00" class="sc-loraregular">“</text><text x="285.40" y="270.82" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="307.40" y="270.82" font-size="11.00" class="sc-loraregular">”</text><text x="311.24" y="270.82" font-size="11.00" class="sc-notoserifcjksc">。训练期间还存在模型的不同版本，包括一个</text><text x="72.00" y="286.44" font-size="11.00" class="sc-notoserifcjksc">不含任何安全防护措施的</text><text x="193.00" y="286.44" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="286.44" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="241.40 247.99 253.95 256.94 263.46 267.17 273.74 276.73 279.63 286.06 292.74 295.67" y="286.44" font-size="11.00" class="sc-loraregular">helpful only</text><text x="301.48" y="286.44" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="312.48" y="286.44" font-size="11.00" class="sc-loraregular">”</text><text x="316.32" y="286.44" font-size="11.00" class="sc-notoserifcjksc">版本。除非另有说明，本系统卡中讨论的所有</text><text x="72.00" y="302.06" font-size="11.00" class="sc-notoserifcjksc">评估均来自模型的最终快照，并且包含安全防护措施。</text><text x="72.00" y="366.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.5</text><text x="99.64" y="366.31" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="394.21" font-size="11.00" class="sc-notoserifcjksc">我们非常感谢多位外部测试方对</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.00 305.35" y="394.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="313.32" y="394.21" font-size="11.00" class="sc-notoserifcjksc">开展部署前评估。该模型在多个风险领域接受</text><text x="72.00" y="409.83" font-size="11.00" class="sc-notoserifcjksc">了评估，包括网络安全、失控、</text><text x="226.00 233.69 240.43 247.34" y="409.83" font-size="11.00" class="sc-loraregular">CBRN</text><text x="258.61" y="409.83" font-size="11.00" class="sc-notoserifcjksc">和有害操纵，我们已将这些评估的结果纳入整体风险评估</text><text x="72.00" y="425.45" font-size="11.00" class="sc-notoserifcjksc">之中。</text><text x="72.00" y="476.55" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="476.55" font-size="14.00" class="sc-notosanscjkscbold">发布决策流程</text><text x="72.00" y="513.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2.1</text><text x="98.73" y="513.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">概述</text><text x="72.00" y="550.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2.2 RSP</text><text x="128.73" y="550.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">决策</text><text x="72.00" y="577.97" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="127.00" y="577.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策（</text><text x="215.00 221.83 227.79 232.89 239.45 245.89 252.57 257.66 260.75 267.15 270.14 276.11 279.00 285.24 291.07 296.74 299.73 302.82 309.50 315.58 318.48 325.03 331.47 334.46 337.55 343.35" y="577.97" font-size="11.00" class="sc-loraregular" fill="#0000ff">Responsible Scaling Policy</text><text x="349.16" y="577.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="360.16" y="577.97" font-size="11.00" class="sc-notoserifcjksc">，我们会定期发布全面的风险报告</text><text x="72.00" y="593.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.91 93.00 98.09 104.00 106.89 113.72 119.69 126.25 132.69 137.53" y="593.59" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="141.78" y="593.59" font-size="11.00" class="sc-notoserifcjksc">），阐述我们模型的安全概况。而如果我们发布的模型比上一份风险报告中讨论的</text><text x="72.00" y="609.21" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="94.00" y="609.21" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="609.21" font-size="11.00" class="sc-notoserifcjksc">能力显著更强</text><text x="164.40" y="609.21" font-size="11.00" class="sc-loraregular">”</text><text x="168.24" y="609.21" font-size="11.00" class="sc-notoserifcjksc">，我们必须</text><text x="223.24" y="609.21" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="609.21" font-size="11.00" class="sc-notoserifcjksc">（在我们的系统卡中或其他地方）发布讨论，说明该模型的能力</text><text x="72.00" y="624.83" font-size="11.00" class="sc-notoserifcjksc">和倾向如何影响或改变风险报告中的分析</text><text x="270.00" y="624.83" font-size="11.00" class="sc-loraregular">”</text><text x="273.84" y="624.83" font-size="11.00" class="sc-notoserifcjksc">。对于风险报告更新，我们通常遵循与管理风险报告相</text><text x="72.00" y="640.45" font-size="11.00" class="sc-notoserifcjksc">同的内部流程。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="106.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="106.25" width="11.00" height="11.00" fill="transparent"/></a><a hre <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="82.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="82.63" font-size="11.00" class="sc-notoserifcjksc">的能力显著强于</text><text x="236.32 244.01 247.00 252.61 259.18 265.75 271.72 274.61 283.34 289.91 296.48 301.57 304.46 310.43 313.02" y="82.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">能力最强的模型。尽管能力有所提升，我们的总体结论是灾难性风险仍然较低：</text><text x="108.00" y="147.39" font-size="11.00" class="sc-notoserifcjkscbold">非新型化学与生物武器的生产。</text><text x="262.00 269.69 272.68 278.29 284.86 291.44 297.40 300.29 309.03 315.59 322.16 327.25 330.15 336.11 338.46" y="147.39" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="346.43" y="147.39" font-size="11.00" class="sc-notoserifcjksc">的能力强于</text><text x="404.32 412.01 415.00 420.61 427.18 433.75 439.72 442.61 451.34 457.91 464.48 469.57 472.46 478.43 481.02" y="147.39" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="487.38" y="147.39" font-size="11.00" class="sc-notoserifcjksc">，但就我</text><text x="108.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">们整体风险评估的目的而言，其风险特征实际上相似。我们认为，我们的风险缓解措施足</text><text x="108.00" y="178.63" font-size="11.00" class="sc-notoserifcjksc">以使非新型化学</text><text x="185.00" y="178.63" font-size="11.00" class="sc-loraregular">/</text><text x="192.59" y="178.63" font-size="11.00" class="sc-notoserifcjksc">生物武器生产带来的灾难性风险处于非常低但并非可忽略的水平。</text><text x="108.00" y="228.35" font-size="11.00" class="sc-notoserifcjkscbold">新型化学与生物武器的生产。</text><text x="251.00" y="228.35" font-size="11.00" class="sc-notoserifcjksc">我们认为，新型化学</text><text x="350.00" y="228.35" font-size="11.00" class="sc-loraregular">/</text><text x="357.59" y="228.35" font-size="11.00" class="sc-notoserifcjksc">生物武器带来的灾难性风险仍然较低</text><text x="108.00" y="243.97" font-size="11.00" class="sc-notoserifcjksc">（但存在相当大的不确定性）。整体情况与我们最近一份风险报告中的情况相似。</text><text x="108.00" y="293.12" font-size="11.00" class="sc-notoserifcjkscbold">未对齐模型带来的风险。</text><text x="229.00" y="293.12" font-size="11.00" class="sc-notoserifcjksc">我们认为总体风险非常低，而且该模型本身对我们此前针对</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35 194.02 198.71 204.61 210.17 213.26 219.18" y="308.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="230.88" y="308.74" font-size="11.00" class="sc-notoserifcjksc">所阐述的风险图景几乎没有增加什么。</text><text x="108.00" y="341.70" font-size="11.00" class="sc-notoserifcjkscbold">关键领域的自动化研发。</text><text x="229.00" y="341.70" font-size="11.00" class="sc-notoserifcjksc">该模型的能力介于</text><text x="319.89 327.58 330.57 336.18 342.75 349.33 355.29 358.18 366.92 373.49 380.05 385.14 388.04 394.00 396.60" y="341.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="405.85" y="341.70" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="419.74 427.43 430.42 436.03 442.60 449.18 455.14 458.03 467.96 473.83 478.08 484.67 491.11 496.20 499.09 505.76 510.45 516.35 521.91 525.00 530.92" y="341.70" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="108.00" y="357.32" font-size="11.00" class="sc-notoserifcjksc">之间，并未推进我们的能力前沿。我们认为，</text><text x="328.00 335.69 338.68 344.29 350.86 357.44 363.40 366.29 375.03 381.59 388.16 393.25 396.14 402.11 404.46" y="357.32" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="412.42" y="357.32" font-size="11.00" class="sc-notoserifcjksc">不会改变我们在</text><text x="489.42" y="357.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份</text><text x="108.00" y="372.94" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报告</text><text x="152.00" y="372.94" font-size="11.00" class="sc-notoserifcjksc">中针对这一威胁模型所呈现的图景。</text><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="517.89" y="284.32" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="108.00" y="299.94" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="143.40" y="299.94" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="146.29" y="299.94" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="184.46" y="299.94" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="187.35" y="299.94" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="489.42" y="348.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="489.42" y="348.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="500.42" y="348.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="500.42" y="348.52" width="11.00" height="11.00" fill="transparent"/></a><a
