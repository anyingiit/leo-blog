<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60 97.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="116.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="116.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="170.32 177.20 183.78 188.04 194.63 199.31 205.75 212.32 215.41" y="116.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="224.15 235.15 246.15 257.15 268.15 279.15 290.15 301.15 312.15 323.15 334.15 345.15 356.15" y="116.23" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="367.15 370.14 375.82 380.53 386.56 392.52 395.41 398.40 404.08 410.76 416.84 423.41 429.08 435.11 441.07 443.97 453.80 460.23 466.81 472.77" y="116.23" font-size="11.00" class="sc-loraregular">large language model</text><text x="475.77 486.77 497.77 508.77 519.77" y="116.23" font-size="11.00" class="sc-notoserifcjksc">），在软件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="131.85" font-size="11.00" class="sc-notoserifcjksc">工程、知识工作、智能体工具使用以及计算机使用（</text><text x="325.00 330.80 337.23 347.07 353.63 360.20 364.46 370.42 375.18 378.07 384.64 389.73" y="131.85" font-size="11.00" class="sc-loraregular">computer use</text><text x="395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70" y="131.85" font-size="11.00" class="sc-notoserifcjksc">）等领域具备尤为突出的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="147.47" font-size="11.00" class="sc-notoserifcjksc">力。在本系统卡（</text><text x="160.00 166.18 171.99 177.08 181.34 187.30 197.14 200.03 207.72 213.39 218.08" y="147.47" font-size="11.00" class="sc-loraregular">System Card</text><text x="224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66 400.66 411.66 422.66 433.66 444.66 455.66 466.66 477.66 488.66 499.66 510.66 521.66" y="147.47" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了覆盖面极广的一系列评估的结果，涉及该模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="163.09" font-size="11.00" class="sc-notoserifcjksc">的能力及其安全概况。</text><text x="72.00 77.07 80.71" y="198.57" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11" y="198.57" font-size="14.00" class="sc-notosanscjkscbold">模型训练与特性</text><text x="72.00 76.71 80.09 84.79 88.17" y="235.67" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.1</text><text x="95.97 108.97 121.97 134.97 147.97 160.97 173.97" y="235.67" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="263.57" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.43 167.43 178.43 189.43 200.43 211.43 222.43 233.43 244.43 255.43 266.43 277.43 288.43 299.43 310.43 321.43 332.43 343.43 354.43 365.43 376.43 387.43 398.43 409.43 420.43 431.43 442.43 453.43 464.43 475.43 486.43 497.43 508.43 519.43" y="263.57" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="279.19" font-size="11.00" class="sc-notoserifcjksc">公开的数据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="294.81" font-size="11.00" class="sc-notoserifcjksc">和过滤方法，包括去重和分类。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="328.71" font-size="11.00" class="sc-notoserifcjksc">我们使用一款名为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.12 204.96 211.39" y="328.71" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="218.54 229.54 240.54 251.54 262.54 273.54 284.54 295.54 306.54 317.54 328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="328.71" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫遵循业界标准做</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="344.33" font-size="11.00" class="sc-notoserifcjksc">法，尊重网站运营者通过</text><text x="193.00 197.40 202.09 208.52 214.92 221.36 225.62 230.71 233.28 237.67 243.50 247.76" y="344.33" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="344.33" font-size="11.00" class="sc-notoserifcjksc">指令表明的是否允许爬取其网站内容的意愿。我们不会访问</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="359.95" font-size="11.00" class="sc-notoserifcjksc">受密码保护的页面，也不会访问需要登录或</text><text x="283.89 291.47 298.36 305.02 312.06 319.75 328.33" y="359.95" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="338.11 349.11 360.11 371.11 382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="359.95" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.57" font-size="11.00" class="sc-notoserifcjksc">进行尽职调查。该爬虫以透明的方式运行；网站运营者可以轻松识别它何时爬取了其网页，并向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="391.19" font-size="11.00" class="sc-notoserifcjksc">我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="425.01" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 179.73 186.30 192.87 197.96 200.85 206.82 209.17" y="425.01" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13" y="425.01" font-size="11.00" class="sc-notoserifcjksc">经过了大量的后训练和微调，目标是使其成为一个行为与</text><text x="495.03 502.72 505.71 511.32 517.89 524.46" y="425.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="440.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00 94.00 105.00" y="440.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法（</text><text x="116.00 121.80 128.23 134.91 140.00 144.26 147.53 151.78 158.35 162.61 165.70 172.13" y="440.63" font-size="11.00" class="sc-loraregular" fill="#0000ff">constitution</text><text x="178.81" y="440.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="189.81 200.81 211.81 222.81 233.81 244.81 255.81 266.81 277.81 288.81 299.81 310.81 321.81" y="440.63" font-size="11.00" class="sc-notoserifcjksc">中所述价值观相一致的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="474.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="474.51" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回应。输出质量因语言而异。该模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="490.13" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00 76.71 80.09 84.79 88.17" y="522.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.2</text><text x="98.73 111.73 124.73 137.73 150.73" y="522.35" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="550.01" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="565.63" font-size="11.00" class="sc-notoserifcjksc">我们的模型。</text><text x="138.00 144.89 151.46 155.72 162.31 167.00 173.43 180.00 183.09" y="565.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="596.87" font-size="11.00" class="sc-notoserifcjksc">规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="431.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="94.00" y="431.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="105.00" y="431.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www. 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="163.01" font-size="11.00" class="sc-notoserifcjksc">们整体风险评估的目的而言，其风险特征实际上相似。我们认为，我们的风险缓解措施足</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="178.63" font-size="11.00" class="sc-notoserifcjksc">以使非新型化学</text><text x="185.00" y="178.63" font-size="11.00" class="sc-loraregular">/</text><text x="192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59" y="178.63" font-size="11.00" class="sc-notoserifcjksc">生物武器生产带来的灾难性风险处于非常低但并非可忽略的水平。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="228.35" font-size="11.00" class="sc-notoserifcjkscbold">新型化学与生物武器的生产。</text><text x="251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="228.35" font-size="11.00" class="sc-notoserifcjksc">我们认为，新型化学</text><text x="350.00" y="228.35" font-size="11.00" class="sc-loraregular">/</text><text x="357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59 511.59 522.59" y="228.35" font-size="11.00" class="sc-notoserifcjksc">生物武器带来的灾难性风险仍然较低</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="243.97" font-size="11.00" class="sc-notoserifcjksc">（但存在相当大的不确定性）。整体情况与我们最近一份风险报告中的情况相似。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="293.12" font-size="11.00" class="sc-notoserifcjkscbold">未对齐模型带来的风险。</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00" y="293.12" font-size="11.00" class="sc-notoserifcjksc">我们认为总体风险非常低，而且该模型本身对我们此前针对</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35 194.02 198.71 204.61 210.17 213.26 219.18" y="308.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="230.88 241.88 252.88 263.88 274.88 285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88 373.88 384.88 395.88 406.88" y="308.74" font-size="11.00" class="sc-notoserifcjksc">所阐述的风险图景几乎没有增加什么。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="341.70" font-size="11.00" class="sc-notoserifcjkscbold">关键领域的自动化研发。</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="341.70" font-size="11.00" class="sc-notoserifcjksc">该模型的能力介于</text><text x="319.89 327.58 330.57 336.18 342.75 349.33 355.29 358.18 366.92 373.49 380.05 385.14 388.04 394.00 396.60" y="341.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="405.85" y="341.70" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="419.74 427.43 430.42 436.03 442.60 449.18 455.14 458.03 467.96 473.83 478.08 484.67 491.11 496.20 499.09 505.76 510.45 516.35 521.91 525.00 530.92" y="341.70" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="357.32" font-size="11.00" class="sc-notoserifcjksc">之间，并未推进我们的能力前沿。我们认为，</text><text x="328.00 335.69 338.68 344.29 350.86 357.44 363.40 366.29 375.03 381.59 388.16 393.25 396.14 402.11 404.46" y="357.32" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="412.42 423.42 434.42 445.42 456.42 467.42 478.42" y="357.32" font-size="11.00" class="sc-notoserifcjksc">不会改变我们在</text><text x="489.42 500.42 511.42 522.42" y="357.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份</text><text x="108.00 119.00 130.00 141.00" y="372.94" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报告</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="372.94" font-size="11.00" class="sc-notoserifcjksc">中针对这一威胁模型所呈现的图景。</text><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="517.89" y="284.32" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="108.00" y="299.94" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="143.40" y="299.94" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="146.29" y="299.94" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="184.46" y="299.94" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="187.35" y="299.94" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="489.42" y="348.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="489.42" y="348.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="500.42" y="348.52" width="0.00" height="11.00
