.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="122.23" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00 133.18 138.99 144.08 148.34 154.30 164.14 167.03 174.72 180.39 185.08" y="122.23" font-size="11.00" class="sc-loraregular">System Card</text><text x="191.66" y="122.23" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55 235.24 238.23 243.84 250.41 256.99 262.95 265.84 274.58 281.14 287.71 292.80 295.70 301.66 304.01" y="122.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="309.08" y="122.23" font-size="11.00" class="sc-notoserifcjksc">，一款由</text><text x="355.98 362.86 369.44 373.70 380.29 384.97 391.41 397.97 401.07" y="122.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="409.81" y="122.23" font-size="11.00" class="sc-notoserifcjksc">开发的大语言模型（</text><text x="508.81 511.80 517.48 522.19 528.21" y="122.23" font-size="11.00" class="sc-loraregular">large</text><text x="72.00 74.99 80.67 87.35 93.43 100.00 105.67 111.70 117.66 120.55 130.39 136.82 143.40 149.36" y="137.85" font-size="11.00" class="sc-loraregular">language model</text><text x="152.36" y="137.85" font-size="11.00" class="sc-notoserifcjksc">）。总体而言，该模型的能力优于其前代模型</text><text x="375.25 382.94 385.93 391.54 398.11 404.68 410.65 413.54 422.27 428.84 435.41 440.50 443.39 449.36 451.95" y="137.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="458.31" y="137.85" font-size="11.00" class="sc-notoserifcjksc">，但弱于我们最</text><text x="72.00" y="153.47" font-size="11.00" class="sc-notoserifcjksc">强大的模型</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="153.47" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="249.88" y="153.47" font-size="11.00" class="sc-notoserifcjksc">。由于</text><text x="285.77 295.71 301.57 305.83 312.42 318.85 323.94 326.84 333.50 338.19 344.10 349.65 352.74 358.66" y="153.47" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="370.36" y="153.47" font-size="11.00" class="sc-notoserifcjksc">仅向有限数量的用户发布，</text><text x="502.36 510.05 513.05 518.66 525.22 531.80" y="153.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="169.09" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13" y="169.09" font-size="11.00" class="sc-notoserifcjksc">因此成为我们迄今能力最强的全面开放的模型。本系统卡包括以下各节：</text><text x="72.00" y="231.38" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="231.38" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="231.38" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="342.85" y="231.38" font-size="11.00" class="sc-notoserifcjksc">我们判断</text><text x="389.75 398.48 405.05 411.61 416.71 419.60 425.56 427.92" y="231.38" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="435.88" y="231.38" font-size="11.00" class="sc-notoserifcjksc">并未推进我们的能力</text><text x="72.00" y="247.00" font-size="11.00" class="sc-notoserifcjksc">前沿，因为</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="247.00" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77" y="247.00" font-size="11.00" class="sc-notoserifcjksc">在每一项相关评估上都表现出更高的结果。因此，我们在负</text><text x="72.00" y="262.62" font-size="11.00" class="sc-notoserifcjksc">责任扩展政策下的总体结论是，灾难性风险仍然较低。各项评估以及我们对该模型的内部使用共</text><text x="72.00" y="278.24" font-size="11.00" class="sc-notoserifcjksc">同表明：化学与生物风险相较</text><text x="217.89 226.63 233.19 239.76 244.85 247.75 253.71 256.30" y="278.24" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="265.56" y="278.24" font-size="11.00" class="sc-notoserifcjksc">没有显著变化，且我们现有的缓解措施已经足够；</text><text x="507.56" y="278.24" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.32" y="293.86" font-size="11.00" class="sc-loraregular">4.7</text><text x="88.28" y="293.86" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="157.17" y="293.86" font-size="11.00" class="sc-loraregular">AI</text><text x="170.64" y="293.86" font-size="11.00" class="sc-notoserifcjksc">研发的阈值；未对齐（</text><text x="280.64 290.47 293.56 298.65 304.33 307.32 310.41 316.50 323.17 333.01 338.97 345.55" y="293.86" font-size="11.00" class="sc-loraregular">misalignment</text><text x="349.80" y="293.86" font-size="11.00" class="sc-notoserifcjksc">）风险仍然非常低（尽管高于</text><text x="495.70 505.63 511.49 515.75 522.34 528.77" y="293.86" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="309.48" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="309.48" font-size="11.00" class="sc-notoserifcjksc">之前的模型）。</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00 157.73 164.30 170.87 175.96 178.85 184.82 187.17" y="372.91" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="195.13" y="372.91" font-size="11.00" class="sc-notoserifcjksc">在网络安全能力上与</text><text x="297.03 305.76 312.33 318.90 323.99 326.88 332.84 335.44" y="372.91" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="344.69" y="372.91" font-size="11.00" class="sc-notoserifcjksc">大致相近。英国人工智能安全研究所</text><text x="72.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 91.27 98.79 101.68 108.56 112.25 115.14 121.38 127.29 133.14 139.71 144.47 147.74 152.01 157.82 160.72 164.31 170.99 176.08 180.34 183.61 187.86 194.43 198.69" y="388.53" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="204.65" y="388.53" font-size="11.00" class="sc-notoserifcjksc">）的一项外部评估显示，与</text><text x="339.54 349.47 355.34 359.59 366.18 372.62 377.71 380.60 387.27 391.96 397.86 403.42 406.51 412.43" y="388.53" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="424.13" y="388.53" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="457.13 465.87 472.43 479.00 484.09 486.99 492.95 495.30" y="388.53" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="503.27" y="388.53" font-size="11.00" class="sc-notoserifcjksc">未能完</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">整完成该研究所的网络靶场（尽管它仍在较低水平上表现出了可能有害的网络安全能力）。我们</text><text x="72.00" y="419.77" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.71 146.06" y="419.77" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="154.03" y="419.77" font-size="11.00" class="sc-notoserifcjksc">时配套了一套新的网络安全防护措施。</text><text x="72.00" y="465.87" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="465.87" font-size="11.00" class="sc-notoserifcjksc">在遵守我们的使用政策（</text><text x="292.00 300.20 305.29 310.96 316.99 322.95 325.85 332.40 338.84 341.83 344.92 350.72" y="465.87" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="356.53" y="465.87" font-size="11.00" class="sc-notoserifcjksc">）、维护用户安全以及限制偏见等方</text><text x="72.00" y="481.49" font-size="11.00" class="sc-notoserifcjksc">面，</text><text x="94.00 102.73 109.30 115.87 120.96 123.85 129.82 132.17" y="481.49" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="249.64 258.37 264.94 271.51 276.60 279.49 285.46 288.05" y="481.49" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="297.30" y="481.49" font-size="11.00" class="sc-notoserifcjksc">相近，但有少数例外，既有积极的（过度拒绝</text><text x="72.00" y="497.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.38 94.88 100.84 105.52 110.90 115.58 121.54 125.26 131.83 136.92 142.60" y="497.11" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="145.59" y="497.11" font-size="11.00" class="sc-notoserifcjksc">）更少），也有消极的（该模型倾向于就管制物质给出过于详细的减害建议）。</text><text x="72.00" y="512.73" font-size="11.00" class="sc-notoserifcjksc">我们纳入了一项关于选举诚信的新评估，</text><text x="270.00 278.73 285.30 291.87 296.96 299.85 305.82 308.17" y="512.73" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="316.13" y="512.73" font-size="11.00" class="sc-notoserifcjksc">在该评估中表现出色。</text><text x="72.00" y="558.83" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="558.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 197.87 204.31 210.89" y="558.83" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="219.74" y="558.83" font-size="11.00" class="sc-notoserifcjksc">和计算机使用（</text><text x="296.74 302.54 308.97 318.81 325.37 331.94 336.20 342.16 346.92 349.82 356.38 361.48" y="558.83" font-size="11.00" class="sc-loraregular">computer use</text><text x="367.44" y="558.83" font-size="11.00" class="sc-notoserifcjksc">）场景中，</text><text x="422.44 431.17 437.74 444.31 449.40 452.29 458.25 460.61" y="558.83" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="468.57" y="558.83" font-size="11.00" class="sc-notoserifcjksc">在拒绝恶意的</text><text x="72.00" y="574.45" font-size="11.00" class="sc-notoserifcjksc">智能体请求以及抵御提示词注入（</text><text x="237.00 243.57 248.25 254.69 264.52 271.09 275.35 278.24 281.33 287.95 290.82 296.73 302.53 306.78 309.88 316.31" y="574.45" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="322.99" y="574.45" font-size="11.00" class="sc-notoserifcjksc">）攻击方面优于</text><text x="402.88 411.61 418.18 424.75 429.84 432.73 438.70 441.29" y="574.45" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="447.65" y="574.45" font-size="11.00" class="sc-notoserifcjksc">。在某些情况下，</text><text x="72.00" y="590.07" font-size="11.00" class="sc-notoserifcjksc">它达到了</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 166.62 171.31 177.21 182.77 185.86 191.78" y="590.07" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="203.48" y="590.07" font-size="11.00" class="sc-notoserifcjksc">级别的鲁棒性。</text><text x="72.00" y="619.41" font-size="11.00" class="sc-notoserifcjkscbold">对齐（</text><text x="105.00 110.76 114.20 117.79 123.92 130.94 141.06 146.98 153.93" y="619.41" font-size="11.00" class="sc-lorabold">alignment</text><text x="158.47" y="619.41" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="202.47 211.21 217.77 224.34 229.43 232.33 238.29 240.64" y="619.41" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="248.61" y="619.41" font-size="11.00" class="sc-notoserifcjksc">在很大程度上是良好对齐的，在我们覆盖面广泛的行为测试</text><text x="72.00" y="635.03" font-size="11.00" class="sc-notoserifcjksc">中，其表现特征与</text><text x="162.89 171.63 178.19 184.76 189.85 192.75 198.71 201.30" y="635.03" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="210.56" y="635.03" font-size="11.00" class="sc-notoserifcjksc">相似。它在某些方面取得了有意义的进步，例如幻觉率低于其前代模</text><text x="72.00" y="650.65" font-size="11.00" class="sc-notoserifcjksc">型。它很好地遵循了其宪法（</text><text x="215.00 220.80 227.23 233.91 239.00 243.26 246.53 250.78 257.35 261.61 264.70 271.13" y="650.65" font-size="11.00" class="sc-loraregular">constitution</text><text x="277.81" y="650.65" font-size="11.00" class="sc-notoserifcjksc">），并且奖励破解（</text><text x="376.81 381.50 387.41 396.12 401.79 406.48 413.06 415.95 422.54 428.21 434.07 439.97 443.06 449.74" y="650.65" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="455.82" y="650.65" font-size="11.00" class="sc-notoserifcjksc">）的发生率较</text><text x="72.00" y="666.27" font-size="11.00" class="sc-notoserifcjksc">低。在少数方面</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.06" y="666.27" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="198.03" y="666.27" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="222.92 231.65 238.22 244.79 249.88 252.77 258.74 261.33" y="666.27" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="267.69" y="666.27" font-size="11.00" class="sc-notoserifcjksc">，例如在</text><text x="314.58" y="666.27" font-size="11.00" class="sc-loraregular">AI</text><text x="328.05" y="666.27" font-size="11.00" class="sc-notoserifcjksc">安全研究相关请求的拒绝上。抑制</text><text x="495.94 504.67 511.24 517.81 522.90 525.79 531.76 534.11" y="666.27" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="72.00" y="681.89" font-size="11.00" class="sc-notoserifcjksc">内部关于自己正在被评估的感知后，其欺骗行为的增幅略大于以往</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">模型，不过总体而言这一效应较为温和。在大多数对齐评估指标上，</text><text x="402.00 410.73 417.30 423.87 428.96 431.85 437.82 440.17" y="82.63" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="448.13" y="82.63" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="473.03 482.96 488.82 493.08 499.67 506.10" y="82.63" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.91 103.82" y="98.25" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="98.25" font-size="11.00" class="sc-notoserifcjksc">，但它也没有引发我们在</text><text x="236.53 246.46 252.32 256.58 263.17 269.60 274.70 277.59 284.26 288.94 294.85 300.40 303.50 309.41" y="98.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="321.12" y="98.25" font-size="11.00" class="sc-notoserifcjksc">上遇到的任何内部使用事件（例如沙箱逃</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">逸）。</text><text x="72.00" y="143.20" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉（</text><text x="127.00 137.12 143.35 149.90 155.82 159.25 162.14 170.96 176.87 180.31 184.62 190.38 195.57" y="143.20" font-size="11.00" class="sc-lorabold">model welfare</text><text x="201.49" y="143.20" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="223.49 232.23 238.79 245.36 250.45 253.35 259.31 261.66" y="143.20" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="269.63" y="143.20" font-size="11.00" class="sc-notoserifcjksc">对其自身处境的评价比我们测试过的任何以往模型都更</text><text x="72.00" y="158.82" font-size="11.00" class="sc-notoserifcjksc">加正面。我们通过多项分析探究了这一结果，发现它与该模型的内部情绪表征以及其在训练和部</text><text x="72.00" y="174.44" font-size="11.00" class="sc-notoserifcjksc">署期间表达出的情感（</text><text x="182.00 187.68 191.50 195.17 201.07 206.87" y="174.44" font-size="11.00" class="sc-loraregular">affect</text><text x="211.13" y="174.44" font-size="11.00" class="sc-notoserifcjksc">）大体一致。</text><text x="72.00" y="219.97" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="219.97" font-size="11.00" class="sc-notoserifcjksc">我们在广泛的评估中测试了</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.06" y="219.97" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="283.13" y="219.97" font-size="11.00" class="sc-notoserifcjksc">，涵盖软件工程、推理、长上下文、智能体搜索、多</text><text x="72.00" y="235.59" font-size="11.00" class="sc-notoserifcjksc">模态与计算机使用任务、真实世界的专业工作，以及多语言和生命科学领域。</text><text x="446.00 454.73 461.30 467.87 472.96 475.85 481.82 484.17" y="235.59" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="492.13" y="235.59" font-size="11.00" class="sc-notoserifcjksc">全面强于</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="251.21" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="116.77" y="251.21" font-size="11.00" class="sc-notoserifcjksc">（但弱于</text><text x="163.66 173.60 179.46 183.72 190.30 196.74 201.83 204.73 211.39 216.08 221.99 227.54 230.63 236.55" y="251.21" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="245.36" y="251.21" font-size="11.00" class="sc-notoserifcjksc">）；提升最大的是真实世界的专业任务和软件工程任务，在</text><text x="72.00" y="266.83" font-size="11.00" class="sc-notoserifcjksc">这些任务上</text><text x="129.89 138.63 145.19 151.76 156.85 159.75 165.71 168.06" y="266.83" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="176.03" y="266.83" font-size="11.00" class="sc-notoserifcjksc">领先于所有正式发布的模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="72.00" y="101.82" font-size="11.00" class="sc-notoserifcjkscbold">执行摘要</text><text x="72.00" y="118.90" font-size="11.00" class="sc-lorabold">1</text><text x="79.36" y="118.90" font-size="11.00" class="sc-notoserifcjkscbold">引言</text><text x="90.00" y="135.98" font-size="11.00" class="sc-loraregular">1.1</text><text x="103.61" y="135.98" font-size="11.00" class="sc-notoserifcjksc">模型训练与特性</text><text x="108.00" y="153.06" font-size="11.00" class="sc-loraregular">1.1.1</text><text x="128.32" y="153.06" font-size="11.00" class="sc-notoserifcjksc">训练数据与过程</text><text x="108.00" y="170.14" font-size="11.00" class="sc-loraregular">1.1.2</text><text x="130.22" y="170.14" font-size="11.00" class="sc-notoserifcjksc">众包工作者</text><text x="108.00" y="187.22" font-size="11.00" class="sc-loraregular">1.1.3</text><text x="130.44" y="187.22" font-size="11.00" class="sc-notoserifcjksc">使用政策与支持</text><text x="108.00" y="204.30" font-size="11.00" class="sc-loraregular">1.1.4</text><text x="130.28" y="204.30" font-size="11.00" class="sc-notoserifcjksc">迭代式模型评估</text><text x="108.00" y="221.38" font-size="11.00" class="sc-loraregular">1.1.5</text><text x="130.31" y="221.38" font-size="11.00" class="sc-notoserifcjksc">外部测试</text><text x="90.00" y="238.46" font-size="11.00" class="sc-loraregular">1.2</text><text x="105.51" y="238.46" font-size="11.00" class="sc-notoserifcjksc">发布决策流程</text><text x="108.00" y="255.54" font-size="11.00" class="sc-loraregular">1.2.1</text><text x="130.22" y="255.54" font-size="11.00" class="sc-notoserifcjksc">概述</text><text x="108.00" y="272.62" font-size="11.00" class="sc-loraregular">1.2.2 RSP</text><text x="154.83" y="272.62" font-size="11.00" class="sc-notoserifcjksc">决策</text><text x="72.00" y="289.70" font-size="11.00" class="sc-lorabold">2 RSP</text><text x="104.80" y="289.70" font-size="11.00" class="sc-notoserifcjkscbold">评估</text><text x="90.00" y="306.78" font-size="11.00" class="sc-loraregular">2.1 RSP</text><text x="128.21" y="306.78" font-size="11.00" class="sc-notoserifcjksc">风险评估流程</text><text x="108.00" y="323.86" font-size="11.00" class="sc-loraregular">2.1.1</text><text x="130.22" y="323.86" font-size="11.00" class="sc-notoserifcjksc">风险报告及我们风险评估的更新</text><text x="108.00" y="340.94" font-size="11.00" class="sc-loraregular">2.1.2</text><text x="132.12" y="340.94" font-size="11.00" class="sc-notoserifcjksc">发现与结论摘要</text><text x="126.00" y="358.02" font-size="11.00" class="sc-loraregular">2.1.2.1</text><text x="156.83" y="358.02" font-size="11.00" class="sc-notoserifcjksc">关于自主性风险</text><text x="126.00" y="375.10" font-size="11.00" class="sc-loraregular">2.1.2.2</text><text x="158.74" y="375.10" font-size="11.00" class="sc-notoserifcjksc">关于化学与生物风险</text><text x="90.00" y="392.18" font-size="11.00" class="sc-loraregular">2.2 CB</text><text x="124.84" y="392.18" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="108.00" y="409.26" font-size="11.00" class="sc-loraregular">2.2.1</text><text x="132.12" y="409.26" font-size="11.00" class="sc-notoserifcjksc">我们测量了什么</text><text x="108.00" y="426.34" font-size="11.00" class="sc-loraregular">2.2.2</text><text x="134.03" y="426.34" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="108.00" y="443.42" font-size="11.00" class="sc-loraregular">2.2.3</text><text x="134.25" y="443.42" font-size="11.00" class="sc-notoserifcjksc">关于化学风险评估与缓解措施</text><text x="108.00" y="460.50" font-size="11.00" class="sc-loraregular">2.2.4</text><text x="134.08" y="460.50" font-size="11.00" class="sc-notoserifcjksc">关于生物风险评估</text><text x="108.00" y="477.58" font-size="11.00" class="sc-loraregular">2.2.5</text><text x="134.11" y="477.58" font-size="11.00" class="sc-notoserifcjksc">生物风险结果</text><text x="126.00" y="494.66" font-size="11.
