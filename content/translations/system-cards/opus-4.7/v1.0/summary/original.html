.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="122.23" font-size="11.00" class="sc-notoserifcjksc">本系统卡（</text><text x="127.00" y="122.23" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="191.66" y="122.23" font-size="11.00" class="sc-notoserifcjksc">）介绍</text><text x="227.55" y="122.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="309.08" y="122.23" font-size="11.00" class="sc-notoserifcjksc">，一款由</text><text x="355.98" y="122.23" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="409.81" y="122.23" font-size="11.00" class="sc-notoserifcjksc">开发的大语言模型（</text><text x="508.81" y="122.23" font-size="11.00" class="sc-loraregular sc-k">large</text><text x="72.00" y="137.85" font-size="11.00" class="sc-loraregular sc-k">language model</text><text x="152.36" y="137.85" font-size="11.00" class="sc-notoserifcjksc">）。总体而言，该模型的能力优于其前代模型</text><text x="375.25" y="137.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="458.31" y="137.85" font-size="11.00" class="sc-notoserifcjksc">，但弱于我们最</text><text x="72.00" y="153.47" font-size="11.00" class="sc-notoserifcjksc">强大的模型</text><text x="129.89" y="153.47" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="249.88" y="153.47" font-size="11.00" class="sc-notoserifcjksc">。由于</text><text x="285.77" y="153.47" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="370.36" y="153.47" font-size="11.00" class="sc-notoserifcjksc">仅向有限数量的用户发布，</text><text x="502.36" y="153.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="169.09" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="118.13" y="169.09" font-size="11.00" class="sc-notoserifcjksc">因此成为我们迄今能力最强的全面开放的模型。本系统卡包括以下各节：</text><text x="72.00" y="231.38" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00" y="231.38" font-size="11.00" class="sc-lorabold sc-k">Responsible Scaling Policy</text><text x="298.85" y="231.38" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="342.85" y="231.38" font-size="11.00" class="sc-notoserifcjksc">我们判断</text><text x="389.75" y="231.38" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="435.88" y="231.38" font-size="11.00" class="sc-notoserifcjksc">并未推进我们的能力</text><text x="72.00" y="247.00" font-size="11.00" class="sc-notoserifcjksc">前沿，因为</text><text x="129.89" y="247.00" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="252.77" y="247.00" font-size="11.00" class="sc-notoserifcjksc">在每一项相关评估上都表现出更高的结果。因此，我们在负</text><text x="72.00" y="262.62" font-size="11.00" class="sc-notoserifcjksc">责任扩展政策下的总体结论是，灾难性风险仍然较低。各项评估以及我们对该模型的内部使用共</text><text x="72.00" y="278.24" font-size="11.00" class="sc-notoserifcjksc">同表明：化学与生物风险相较</text><text x="217.89" y="278.24" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="265.56" y="278.24" font-size="11.00" class="sc-notoserifcjksc">没有显著变化，且我们现有的缓解措施已经足够；</text><text x="507.56" y="278.24" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="293.86" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="293.86" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="157.17" y="293.86" font-size="11.00" class="sc-loraregular">AI</text><text x="170.64" y="293.86" font-size="11.00" class="sc-notoserifcjksc">研发的阈值；未对齐（</text><text x="280.64" y="293.86" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="349.80" y="293.86" font-size="11.00" class="sc-notoserifcjksc">）风险仍然非常低（尽管高于</text><text x="495.70" y="293.86" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="309.48" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="309.48" font-size="11.00" class="sc-notoserifcjksc">之前的模型）。</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="372.91" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="195.13" y="372.91" font-size="11.00" class="sc-notoserifcjksc">在网络安全能力上与</text><text x="297.03" y="372.91" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="344.69" y="372.91" font-size="11.00" class="sc-notoserifcjksc">大致相近。英国人工智能安全研究所</text><text x="72.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="388.53" font-size="11.00" class="sc-loraregular sc-k">UK AI Security Institute</text><text x="204.65" y="388.53" font-size="11.00" class="sc-notoserifcjksc">）的一项外部评估显示，与</text><text x="339.54" y="388.53" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="424.13" y="388.53" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="457.13" y="388.53" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="503.27" y="388.53" font-size="11.00" class="sc-notoserifcjksc">未能完</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">整完成该研究所的网络靶场（尽管它仍在较低水平上表现出了可能有害的网络安全能力）。我们</text><text x="72.00" y="419.77" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89" y="419.77" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="154.03" y="419.77" font-size="11.00" class="sc-notoserifcjksc">时配套了一套新的网络安全防护措施。</text><text x="72.00" y="465.87" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="465.87" font-size="11.00" class="sc-notoserifcjksc">在遵守我们的使用政策（</text><text x="292.00" y="465.87" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="356.53" y="465.87" font-size="11.00" class="sc-notoserifcjksc">）、维护用户安全以及限制偏见等方</text><text x="72.00" y="481.49" font-size="11.00" class="sc-notoserifcjksc">面，</text><text x="94.00" y="481.49" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="249.64" y="481.49" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="297.30" y="481.49" font-size="11.00" class="sc-notoserifcjksc">相近，但有少数例外，既有积极的（过度拒绝</text><text x="72.00" y="497.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="497.11" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="145.59" y="497.11" font-size="11.00" class="sc-notoserifcjksc">）更少），也有消极的（该模型倾向于就管制物质给出过于详细的减害建议）。</text><text x="72.00" y="512.73" font-size="11.00" class="sc-notoserifcjksc">我们纳入了一项关于选举诚信的新评估，</text><text x="270.00" y="512.73" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="316.13" y="512.73" font-size="11.00" class="sc-notoserifcjksc">在该评估中表现出色。</text><text x="72.00" y="558.83" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="558.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="151.89" y="558.83" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="219.74" y="558.83" font-size="11.00" class="sc-notoserifcjksc">和计算机使用（</text><text x="296.74" y="558.83" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="367.44" y="558.83" font-size="11.00" class="sc-notoserifcjksc">）场景中，</text><text x="422.44" y="558.83" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="468.57" y="558.83" font-size="11.00" class="sc-notoserifcjksc">在拒绝恶意的</text><text x="72.00" y="574.45" font-size="11.00" class="sc-notoserifcjksc">智能体请求以及抵御提示词注入（</text><text x="237.00" y="574.45" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="322.99" y="574.45" font-size="11.00" class="sc-notoserifcjksc">）攻击方面优于</text><text x="402.88" y="574.45" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="447.65" y="574.45" font-size="11.00" class="sc-notoserifcjksc">。在某些情况下，</text><text x="72.00" y="590.07" font-size="11.00" class="sc-notoserifcjksc">它达到了</text><text x="118.89" y="590.07" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="203.48" y="590.07" font-size="11.00" class="sc-notoserifcjksc">级别的鲁棒性。</text><text x="72.00" y="619.41" font-size="11.00" class="sc-notoserifcjkscbold">对齐（</text><text x="105.00" y="619.41" font-size="11.00" class="sc-lorabold sc-k">alignment</text><text x="158.47" y="619.41" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="202.47" y="619.41" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="248.61" y="619.41" font-size="11.00" class="sc-notoserifcjksc">在很大程度上是良好对齐的，在我们覆盖面广泛的行为测试</text><text x="72.00" y="635.03" font-size="11.00" class="sc-notoserifcjksc">中，其表现特征与</text><text x="162.89" y="635.03" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="210.56" y="635.03" font-size="11.00" class="sc-notoserifcjksc">相似。它在某些方面取得了有意义的进步，例如幻觉率低于其前代模</text><text x="72.00" y="650.65" font-size="11.00" class="sc-notoserifcjksc">型。它很好地遵循了其宪法（</text><text x="215.00" y="650.65" font-size="11.00" class="sc-loraregular sc-k">constitution</text><text x="277.81" y="650.65" font-size="11.00" class="sc-notoserifcjksc">），并且奖励破解（</text><text x="376.81" y="650.65" font-size="11.00" class="sc-loraregular sc-k">reward hacking</text><text x="455.82" y="650.65" font-size="11.00" class="sc-notoserifcjksc">）的发生率较</text><text x="72.00" y="666.27" font-size="11.00" class="sc-notoserifcjksc">低。在少数方面</text><text x="151.89" y="666.27" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="198.03" y="666.27" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="222.92" y="666.27" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="267.69" y="666.27" font-size="11.00" class="sc-notoserifcjksc">，例如在</text><text x="314.58" y="666.27" font-size="11.00" class="sc-loraregular">AI</text><text x="328.05" y="666.27" font-size="11.00" class="sc-notoserifcjksc">安全研究相关请求的拒绝上。抑制</text><text x="495.94" y="666.27" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="72.00" y="681.89" font-size="11.00" class="sc-notoserifcjksc">内部关于自己正在被评估的感知后，其欺骗行为的增幅略大于以往</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">模型，不过总体而言这一效应较为温和。在大多数对齐评估指标上，</text><text x="402.00" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="448.13" y="82.63" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="473.03" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="98.25" font-size="11.00" class="sc-notoserifcjksc">，但它也没有引发我们在</text><text x="236.53" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="321.12" y="98.25" font-size="11.00" class="sc-notoserifcjksc">上遇到的任何内部使用事件（例如沙箱逃</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">逸）。</text><text x="72.00" y="143.20" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉（</text><text x="127.00" y="143.20" font-size="11.00" class="sc-lorabold sc-k">model welfare</text><text x="201.49" y="143.20" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="223.49" y="143.20" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="269.63" y="143.20" font-size="11.00" class="sc-notoserifcjksc">对其自身处境的评价比我们测试过的任何以往模型都更</text><text x="72.00" y="158.82" font-size="11.00" class="sc-notoserifcjksc">加正面。我们通过多项分析探究了这一结果，发现它与该模型的内部情绪表征以及其在训练和部</text><text x="72.00" y="174.44" font-size="11.00" class="sc-notoserifcjksc">署期间表达出的情感（</text><text x="182.00" y="174.44" font-size="11.00" class="sc-loraregular sc-k">affect</text><text x="211.13" y="174.44" font-size="11.00" class="sc-notoserifcjksc">）大体一致。</text><text x="72.00" y="219.97" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="219.97" font-size="11.00" class="sc-notoserifcjksc">我们在广泛的评估中测试了</text><text x="239.89" y="219.97" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="283.13" y="219.97" font-size="11.00" class="sc-notoserifcjksc">，涵盖软件工程、推理、长上下文、智能体搜索、多</text><text x="72.00" y="235.59" font-size="11.00" class="sc-notoserifcjksc">模态与计算机使用任务、真实世界的专业工作，以及多语言和生命科学领域。</text><text x="446.00" y="235.59" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="492.13" y="235.59" font-size="11.00" class="sc-notoserifcjksc">全面强于</text><text x="72.00" y="251.21" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="116.77" y="251.21" font-size="11.00" class="sc-notoserifcjksc">（但弱于</text><text x="163.66" y="251.21" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="245.36" y="251.21" font-size="11.00" class="sc-notoserifcjksc">）；提升最大的是真实世界的专业任务和软件工程任务，在</text><text x="72.00" y="266.83" font-size="11.00" class="sc-notoserifcjksc">这些任务上</text><text x="129.89" y="266.83" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="176.03" y="266.83" font-size="11.00" class="sc-notoserifcjksc">领先于所有正式发布的模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="72.00" y="101.82" font-size="11.00" class="sc-notoserifcjkscbold">执行摘要</text><text x="72.00" y="118.90" font-size="11.00" class="sc-lorabold">1</text><text x="79.36" y="118.90" font-size="11.00" class="sc-notoserifcjkscbold">引言</text><text x="90.00" y="135.98" font-size="11.00" class="sc-loraregular">1.1</text><text x="103.61" y="135.98" font-size="11.00" class="sc-notoserifcjksc">模型训练与特性</text><text x="108.00" y="153.06" font-size="11.00" class="sc-loraregular">1.1.1</text><text x="128.32" y="153.06" font-size="11.00" class="sc-notoserifcjksc">训练数据与过程</text><text x="108.00" y="170.14" font-size="11.00" class="sc-loraregular">1.1.2</text><text x="130.22" y="170.14" font-size="11.00" class="sc-notoserifcjksc">众包工作者</text><text x="108.00" y="187.22" font-size="11.00" class="sc-loraregular">1.1.3</text><text x="130.44" y="187.22" font-size="11.00" class="sc-notoserifcjksc">使用政策与支持</text><text x="108.00" y="204.30" font-size="11.00" class="sc-loraregular">1.1.4</text><text x="130.28" y="204.30" font-size="11.00" class="sc-notoserifcjksc">迭代式模型评估</text><text x="108.00" y="221.38" font-size="11.00" class="sc-loraregular">1.1.5</text><text x="130.31" y="221.38" font-size="11.00" class="sc-notoserifcjksc">外部测试</text><text x="90.00" y="238.46" font-size="11.00" class="sc-loraregular">1.2</text><text x="105.51" y="238.46" font-size="11.00" class="sc-notoserifcjksc">发布决策流程</text><text x="108.00" y="255.54" font-size="11.00" class="sc-loraregular">1.2.1</text><text x="130.22" y="255.54" font-size="11.00" class="sc-notoserifcjksc">概述</text><text x="108.00" y="272.62" font-size="11.00" class="sc-loraregular">1.2.2 RSP</text><text x="154.83" y="272.62" font-size="11.00" class="sc-notoserifcjksc">决策</text><text x="72.00" y="289.70" font-size="11.00" class="sc-lorabold">2 RSP</text><text x="104.80" y="289.70" font-size="11.00" class="sc-notoserifcjkscbold">评估</text><text x="90.00" y="306.78" font-size="11.00" class="sc-loraregular">2.1 RSP</text><text x="128.21" y="306.78" font-size="11.00" class="sc-notoserifcjksc">风险评估流程</text><text x="108.00" y="323.86" font-size="11.00" class="sc-loraregular">2.1.1</text><text x="130.22" y="323.86" font-size="11.00" class="sc-notoserifcjksc">风险报告及我们风险评估的更新</text><text x="108.00" y="340.94" font-size="11.00" class="sc-loraregular">2.1.2</text><text x="132.12" y="340.94" font-size="11.00" class="sc-notoserifcjksc">发现与结论摘要</text><text x="126.00" y="358.02" font-size="11.00" class="sc-loraregular">2.1.2.1</text><text x="156.83" y="358.02" font-size="11.00" class="sc-notoserifcjksc">关于自主性风险</text><text x="126.00" y="375.10" font-size="11.00" class="sc-loraregular">2.1.2.2</text><text x="158.74" y="375.10" font-size="11.00" class="sc-notoserifcjksc">关于化学与生物风险</text><text x="90.00" y="392.18" font-size="11.00" class="sc-loraregular">2.2 CB</text><text x="124.84" y="392.18" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="108.00" y="409.26" font-size="11.00" class="sc-loraregular">2.2.1</text><text x="132.12" y="409.26" font-size="11.00" class="sc-notoserifcjksc">我们测量了什么</text><text x="108.00" y="426.34" font-size="11.00" class="sc-loraregular">2.2.2</text><text x="134.03" y="426.34" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="108.00" y="443.42" font-size="11.00" class="sc-loraregular">2.2.3</text><text x="134.25" y="443.42" font-size="11.00" class="sc-notoserifcjksc">关于化学风险评估与缓解措施</text><text x="108.00" y="460.50" font-size="11.00" class="sc-loraregular">2.2.4</text><text x="134.08" y="460.50" font-size="11.00" class="sc-notoserifcjksc">关于生物风险评估</text><text x="108.00" y="477.58" font-size="11.00" class="sc-loraregular">2.2.5</text><text x="134.11" y="477.58" font-size="11.00" class="sc-notoserifcjksc">生物风险结果</text><text x="126.00" y="494.66" font-size="11.00" class="sc-loraregular">2.2.5.1</text><text x="158.82" y="494.66" font-size="11.00" class="sc-notoserifcjksc">专家红队测试</text><text x="126.00" y="511.74" font-size="11.00" class="sc-loraregular">2.2.5.2</text><text x="160.73" y="511.74" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="174.62" y="511.74" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="201.14" y="511.74" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的自动化评估</text><text x="126.00" y="528.82" font-size="11.00" class="sc-loraregular">2.2.5.3</text><text x="160.95" y="528.82" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="174.84" y="528.82" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="203.20" y="528.82" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的自动化评估</text><text x="90.00" y="545.90" font-size="11.00" class="sc-loraregular">2.3 AI</text><text x="121.10" y="545.90" font-size="11.00" class="sc-notoserifcjksc">研发</text><text x="108.00" y="562.98" font-size="11.00" class="sc-loraregular">2.3.1</text><text x="132.34" y="562.98" font-size="11.00" class="sc-notoserifcjksc">自主性评估</text><text x="126.00" y="579.85" font-size="10.79" class="sc-loraregular sc-k">2.3.1.1 Claude Opus 4.7</text><text x="239.27" y="579.85" font-size="10.79" class="sc-notoserifcjksc">如何影响或改变我们最近一份</text><text x="126.00" y="595.17" font-size="10.79" class="sc-notoserifcjksc">风险报告中的分析</text><text x="108.00" y="611.22" font-size="11.00" class="sc-loraregular">2.3.2</text><text x="134.25" y="611.22" font-size="11.00" class="sc-notoserifcjksc">关于我们判定背后理由的概要说明</text><text x="108.00" y="628.30" font-size="11.00" class="sc-loraregular">2.3.3</text><text x="134.47" y="628.30" font-size="11.00" class="sc-notoserifcjksc">关于我们对关键能力阈值的操作化定义的说明</text><text x="108.00" y="645.38" font-size="11.00" class="sc-loraregular">2.3.4</text><text x="134.30" y="645.38" font-size="11.00" class="sc-notoserifcjksc">基于任务的评估</text><text x="126.00" y="662.46" font-size="11.00" class="sc-loraregu
