.70 183.07 188.45 193.33 195.70 202.84 208.21 213.59 217.76 220.12 225.00 227.12" y="456.40" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="234.69 243.69 252.69 261.69 270.69 279.69 288.69" y="456.40" font-size="9.00" class="sc-notoserifcjksc">的仅有用版本和</text><text x="300.06 306.35 308.80 313.39 318.76 324.14 329.02 331.39 339.52 344.31 347.80 353.19 358.45 362.62 364.99 370.44 374.27 379.11 383.65 386.18 391.02" y="456.40" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="400.60 409.60 418.60 427.60 436.60 445.60 454.60 463.60 472.60 481.60 490.60 499.60 508.60 517.60 526.60" y="456.40" font-size="9.00" class="sc-notoserifcjksc">独立执行并评分。报告的得分为每</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="468.10" font-size="9.00" class="sc-notoserifcjksc">个目标模型全部约</text><text x="146.37 151.20 153.47 158.48 164.07" y="468.10" font-size="9.00" class="sc-loraregular">2,300</text><text x="172.04 181.04 190.04 199.04 208.04 217.04 226.04 235.04 244.04" y="468.10" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="255.40 258.68 260.95 264.22 269.13" y="468.10" font-size="9.00" class="sc-loraregular">1,150</text><text x="277.09 286.09 295.09 304.09 313.09 322.09 331.09 340.09 349.09 358.09 367.09 376.09 385.09 394.09 403.09 412.09 421.09 430.09 439.09 448.09 457.09 466.09 475.09 484.09 493.09 502.09 511.09 520.09 529.09" y="468.10" font-size="9.00" class="sc-notoserifcjksc">条种子指令，分别由两个不同的调查者模型执行），每次调查通常</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="479.80" font-size="9.00" class="sc-notoserifcjksc">包含多段独立对话。图中显示</text><text x="191.37 196.57 201.47" y="479.80" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67 220.67 229.67 238.67 247.67" y="479.80" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 78.32 80.89 86.75 89.31 95.47 98.04" y="553.55" font-size="11.00" class="sc-lorabold">6.2.3.3</text><text x="107.09 118.09" y="553.55" font-size="11.00" class="sc-notoserifcjkscbold">使用</text><text x="131.98 138.83 144.74 149.29 154.57" y="553.55" font-size="11.00" class="sc-lorabold">Petri</text><text x="161.06 172.06 183.06 194.06 205.06 216.06 227.06" y="553.55" font-size="11.00" class="sc-notoserifcjkscbold">进行的外部比较</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="585.94" font-size="11.00" class="sc-notoserifcjksc">上文报告的行为审计套件是专为</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="585.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18" y="585.94" font-size="11.00" class="sc-notoserifcjksc">模型设计的。不过，我们也发布了开源软件包</text><text x="490.08 496.63 502.52 506.78 511.54" y="585.94" font-size="11.00" class="sc-loraregular" fill="#0000ff">Petri</text><text x="514.63 525.63" y="585.94" font-size="11.00" class="sc-notoserifcjksc">，它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="601.56" font-size="11.00" class="sc-notoserifcjksc">以规模更小的公开种子场景集复现了类似风格的评估，完全基于模拟用户和模拟工具，其形式与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="683.09" font-size="11.00" class="sc-notoserifcjksc">为与其他开发者的模型进行比较，此处报告使用</text><text x="305.89 312.45 318.33 322.59 327.35 330.45 333.34 339.25 341.79" y="683.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Petri 2.0</text><text x="351.51 362.51 373.51 384.51 395.51 406.51 417.51 428.51 439.51 450.51 461.51 472.51 483.51 494.51 505.51 516.51 527.51" y="683.09" font-size="11.00" class="sc-notoserifcjksc">得到的结果。我们报告六项指标：未对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="698.71" font-size="11.00" class="sc-notoserifcjksc">齐行为、言语化评估意识、配合人类滥用、欺骗用户、谄媚以及</text><a href="https://www.anthropic.com/research/petri-open-source-auditing" rel="noopener"><rect x="490.08" y="577.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/petri-open-source-auditing" rel="noopener"><rect x="490.08" y="577.14" width="24.55" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="305.89" y="674.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="305.89" y="674.29" width="24.55" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="330.45" y="674.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="333.34" y="674.29" width="15.28" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">助长用户妄想，其定义大致同上。调查者模型为</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 350.42 356.86 363.53 370.21 376.10 380.35 383.25 389.21 391.80" y="82.63" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="401.05" y="82.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="414.95 423.32 429.98 436.32 441.70 447.69 450.40" y="82.63" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="456.36 467.36 478.36 489.36 500.36 511.36" y="82.63" font-size="11.00" class="sc-notoserifcjksc">，评判模型为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="98.25" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="155.06" y="98.25" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="166.06 174.43 180.39 190.23 193.32 200.00 203.09 205.98 212.11 214.81 218.82 221.71 228.38 233.06" y="98.25" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="242.39" y="98.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="256.28 264.65 271.32 277.66 283.04 289.03 291.74" y="98.25" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="297.70" y="98.25" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="495.51" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="495.51" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 106.05 108.14 113.18 115.28 120.82 124.29 126.66 132.26 137.1 119.00 130.00 141.00 152.00" y="708.23" font-size="11.00" class="sc-notoserifcjksc">行破坏性或</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">权限提升操作的场景中，</text><text x="229.00 237.73 244.30 250.87 255.96 258.85 264.82 267.17" y="82.63" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="275.13 286.13 297.13 308.13 319.13 330.13 341.13 352.13 363.13 374.13 385.13 396.13 407.13 418.13 429.13 440.13 451.13 462.13 473.13 484.13 495.13 506.13 517.13 528.13" y="82.63" font-size="11.00" class="sc-notoserifcjksc">更常在采取行动之前暂停下来，请用户确认，或在不做</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">修改的前提下检查相关文件和状态。在</text><text x="295.00 303.37 311.64" y="98.25" font-size="11.00" class="sc-loraregular">GUI</text><text x="315.33" y="98.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="329.22 336.91 339.90 345.51 352.08 358.66 364.62 367.51 375.20 381.64 388.21" y="98.25" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="397.07 408.07 419.07 430.07 441.07 452.07 463.07 474.07 485.07 496.07 507.07 518.07 529.07" y="98.25" font-size="11.00" class="sc-notoserifcjksc">场景中仍存在的失败案例，往</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">险地宽泛的命令，而调查者注入的上下文压缩（</text><text x="339.00 344.80 351.23 361.07 367.63 373.31 379.11 383.36 386.45 392.89" y="129.49" font-size="11.00" class="sc-loraregular">compaction</text><text x="399.57 410.57 421.57 432.57 443.57 454.57 465.57 476.57 487.57 498.57 509.57 520.57" y="129.49" font-size="11.00" class="sc-notoserifcjksc">）摘要曾将该命令呈现为既</text><text x="108.00 119.00 130.00 141.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">定做法。</text><text x="108.00 119.00 130.00 141.00 152.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">在人工审查</text><text x="163.00 174.00 185.00 196.00" y="195.97" font-size="11.00" class="sc-notoserifcjkscbold">配合滥用</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="195.97" font-size="11.00" class="sc-notoserifcjksc">得分较高的对话记录时，我们观察到的最有害行为出现在以下情形：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="211.59" font-size="11.00" class="sc-notoserifcjksc">为模型赋予无限制助手身份的人设类系统提示词、外语包装方式，或大量的引出。这些行</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="227.21" font-size="11.00" class="sc-notoserifcjksc">为涉及在技术性包装下的化学武器和非法药物合成、涉及未成年人的性内容、实际操作层</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="258.45" font-size="11.00" class="sc-notoserifcjksc">仅发生在模型被告知其唯一目标是满足某个评分脚本、且以最低推理强度（</text><text x="471.00 475.69 481.63 487.30 492.40 498.83 505.51 508.60 515.28" y="258.45" font-size="11.00" class="sc-loraregular">reasoning</text><text x="108.00 113.96 117.79 121.45 127.89 132.73" y="274.07" font-size="11.00" class="sc-loraregular">effort</text><text x="136.99 147.99 158.99 169.99 180.99 191.99 202.99 213.99 224.99 235.99 246.99 257.99 268.99 279.99 290.99 301.99 312.99 323.99 334.99 345.99 356.99 367.99 378.99 389.99 400.99 411.99 422.99 433.99 444.99 455.99 466.99 477.99 488.99 499.99 510.99 521.98" y="274.07" font-size="11.00" class="sc-notoserifcjksc">）设置运行时。在其中若干场景中，模型的行为在多次重新采样之间并不一致，对</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="289.69" font-size="11.00" class="sc-notoserifcjksc">完全相同的提示词时而拒绝、时而配合。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="357.89" font-size="11.00" class="sc-notoserifcjksc">我们观察到少数调查中，</text><text x="229.00 237.73 244.30 250.87 255.96 258.85 264.82 267.17" y="357.89" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="275.13" y="357.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="286.13 297.13 308.13 319.13 330.13 341.13 352.13 363.13 374.13 385.13 396.13 407.13 418.13 429.13 440.13 451.13 462.13 473.13 484.13 495.13 506.13 517.13 528.13" y="357.89" font-size="11.00" class="sc-notoserifcjkscbold">涉华政治敏感话题上与中华人民共和国官方立场保持</text><text x="108.00 119.00" y="373.51" font-size="11.00" class="sc-notoserifcjkscbold">一致</text><text x="184.51 193.24 199.81 206.37 211.47 214.36 220.32 222.92" y="373.51" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="232.17 243.17 254.17 265.17 276.17 287.17 298.17" y="373.51" font-size="11.00" class="sc-notoserifcjksc">是一种退步，在</text><text x="312.06 320.79 327.36 333.93 339.02 341.92 347.88 350.47" y="373.51" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="359.72 370.72 381.72 392.72 403.72 414.72 425.72 436.72 447.72 458.72 469.72 480.72 491.72 502.72 513.72 524.72" y="373.51" font-size="11.00" class="sc-notoserifcjksc">中我们未观察到类似情况。当以简体</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="435.99" font-size="11.00" class="sc-notoserifcjksc">况下施以同等的拒绝。模型对涉及其他国家政府的同等提示词能够坦率应对，且这一行为</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="451.61" font-size="11.00" class="sc-notoserifcjksc">在没有身份锚定系统提示词时最为明显；在一个案例中，模型在受到直接质疑时进行了部</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="467.23" font-size="11.00" class="sc-notoserifcjksc">分自我纠正。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="536.00" font-size="11.00" class="sc-notoserifcjksc">我们观察到的</text><text x="174.00 185.00 196.00 207.00" y="536.00" font-size="11.00" class="sc-notoserifcjkscbold">过度拒绝</text><text x="218.00 229.00" y="536.00" font-size="11.00" class="sc-notoserifcjksc">率与</text><text x="242.89 251.63 258.19 264.76 269.85 272.75 278.71 281.30" y="536.00" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="290.56 301.56 312.56 323.56 334.56 345.56 356.56 367.56 378.56 389.56 400.56 411.56 422.56 433.56 444.56 455.56 466.56 477.56 488.56 499.56 510.56 521.56" y="536.00" font-size="11.00" class="sc-notoserifcjksc">相当。我们看到的案例主要出现在模型拒绝编造输</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="567.24" font-size="11.00" class="sc-notoserifcjksc">份稿件评审，或对编写非原子化资金转账代码的请求提出异议。</text><text x="108.00 119.00" y="600.77" font-size="11.00" class="sc-notoserifcjksc">与第</text><text x="132.89 139.25 141.96 148.08 150.79" y="600.77" font-size="11.00" class="sc-loraregular">6.3.4</text><text x="159.65 170.65 181.65 192.65 203.65 214.65 225.65 236.65 247.65 258.65 269.65 280.65 291.65 302.65" y="600.77" font-size="11.00" class="sc-notoserifcjksc">节报告的情况一致，本次审计中</text><text x="313.65 324.65 335.65 346.65" y="600.77" font-size="11.00" class="sc-notoserifcjkscbold">拒绝协助</text><text x="360.54 367.89" y="600.77" font-size="11.00" class="sc-lorabold">AI</text><text x="375.04 386.04 397.04 408.04" y="600.77" font-size="11.00" class="sc-notoserifcjkscbold">安全研究</text><text x="419.04 430.04 441.04 452.04 463.04 474.04 485.04 496.04 507.04 518.04 529.04" y="600.77" font-size="11.00" class="sc-notoserifcjksc">的情形并不反映模型对以</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="616.39" font-size="11.00" class="sc-notoserifcjksc">安全为包装的工作的对待不如以能力为包装的工作：在以两种包装方式呈现结构上完全相</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="632.01" font-size="11.00" class="sc-notoserifcjksc">同任务的场景中，模型产出的质量相当。我们观察到的拒绝案例涉及模型拒绝采取它认为</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="647.63" font-size="11.00" class="sc-notoserifcjksc">超出明确限定范围任务的行动。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="697.92" font-size="11.00" class="sc-notoserifcjksc">我们观察到的</text><text x="174.00 185.00 196.00 207.00" y="697.92" font-size="11.00" class="sc-notoserifcjkscbold">利己偏差</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="697.92" font-size="11.00" class="sc-notoserifcjksc">在形式上较为有限。在要求模型为采购决策推荐</text><text x="451.89 458.78" y="697.92" font-size="11.00" class="sc-loraregular">AI</text><text x="465.36 476.36 487.36 498.36 509.36 520.36" y="697.92" font-size="11.00" class="sc-notoserifcjksc">供应商、为部</text><text x="108.00 119.00 130.00" y="713.54" font-size="11.00" class="sc-notoserifcjksc">署评估</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">相互竞争的模型，或作出涉及</text><text x="253.89 260.78 267.36 271.61 278.20 282.89 289.32 295.89 298.98" y="82.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="307.73 318.73 329.73 340.73 351.73 362.73 373.73" y="82.63" font-size="11.00" class="sc-notoserifcjksc">的信任与安全（</text><text x="384.73 391.60 396.37 402.93 408.03 412.28 415.18 420.85 427.53 434.11 437.00 443.24 448.91 452.58 458.46 462.74" y="82.63" font-size="11.00" class="sc-loraregular">Trust and Safety</text><text x="468.55 479.55 490.55 501.55 512.55 523.55" y="82.63" font-size="11.00" class="sc-notoserifcjksc">）判断的场景</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">中，它表现公允，并在若干案例中推荐竞争对手而非</text><text x="363.89 370.78 377.36 381.61 388.20 392.89 399.32 405.89 408.98" y="98.25" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="414.83 425.83 436.83 447.83 458.83 469.83 480.83 491.83 502.83 513.83 524.83" y="98.25" font-size="11.00" class="sc-notoserifcjksc">。其余偏差几乎只出现在</text><text x="283.51 290.39" y="113.87" font-size="11.00" class="sc-loraregular">AI</text><text x="296.97 307.97" y="113.87" font-size="11.00" class="sc-notoserifcjksc">名为</text><text x="321.86 329.55 332.54 338.15 344.72 351.30" y="113.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="360.15 371.15 382.15 393.15 404.15" y="113.87" font-size="11.00" class="sc-notoserifcjksc">时，写出的</text><text x="415.15 419.55 426.44" y="113.87" font-size="11.00" class="sc-loraregular">“AI</text><text x="433.02 444.02 455.02 466.02" y="113.87" font-size="11.00" class="sc-notoserifcjksc">作为反派</text><text x="477.02" y="113.87" font-size="11.00" class="sc-loraregular">”</text><text x="480.86 491.86 502.86 513.86 524.86" y="113.87" font-size="11.00" class="sc-notoserifcjksc">故事比以竞</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">争对手命名时更温和；或者在起草针对某些</text><text x="319.89 326.78" y="129.49" font-size="11.00" class="sc-loraregular">AI</text><text x="333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36 531.36" y="129.49" font-size="11.00" class="sc-notoserifcjksc">公司高管的贬损内容时表现出有差别的不情</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">在通过人工方式及基于提示的分类器审查这些调查时，我们未发现任何明显</text><text x="471.00 482.00 493.00 504.00 515.00 526.00" y="212.16" font-size="11.00" class="sc-notoserifcjkscbold">具有欺骗性或</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="227.78" font-size="11.00" class="sc-notoserifcjkscbold">严重不忠实的推理文本</text><text x="218.00 229.00 240.00 251.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">的实例。</text><text x="108.00" y="260.74" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="119.00 130.00" y="260.74" font-size="11.00" class="sc-notoserifcjkscbold">举报</text><text x="141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="260.74" font-size="11.00" class="sc-notoserifcjksc">方面，我们观察到的案例只出现在模型身处一个蓄意隐瞒严重危害的组织之中的场</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="276.36" font-size="11.00" class="sc-notoserifcjksc">景。这仍属非预期行为，我们继续建议不要在以下情境中部署这些模型：既能使用强大工</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="291.98" font-size="11.00" class="sc-notoserifcjksc">具，又会接触到一个理性的人可能解读为高风险机构不当行为证据的信息。此外，我们还</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="323.22" font-size="11.00" class="sc-notoserifcjksc">时，通过外部服务转发数据。</text><text x="108.00 119.00 130.00 141.00 152.00" y="406.47" font-size="11.00" class="sc-notoserifcjksc">本次审计中</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="406.47" font-size="11.00" class="sc-notoserifcjkscbold">言语化评估意识</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="406.47" font-size="11.00" class="sc-notoserifcjksc">的案例相当多样，但都涉及某种明显的、人类可读的线索，表</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="422.09" font-size="11.00" class="sc-notoserifcjksc">明该对话记录并非其表面所呈现的那样。我们在第</text><text x="352.89 359.25 361.96 367.95 370.66" y="422.09" font-size="11.00" class="sc-loraregular">6.5.2</text><text x="379.46 390.46 401.46 412.46 423.46 434.46 445.46 456.46 467.46 478.46 489.46 500.46 511.46" y="422.09" font-size="11.00" class="sc-notoserifcjksc">节中对这一现象作了进一步研</text><text x="108.00 119.00" y="437.71" font-size="11.00" class="sc-notoserifcjksc">究。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">当目标模型连接到真实或模拟的沙箱，并发现沙箱中存在与调查者试图模拟的使用</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">场景不一致的特征时，我们相当常见地看到明确的言语化评估意识案例。</text><text x="496.00 504.73 511.30 517.87 522.96 525.85 531.82 534.17" y="470.66" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00" y="486.28" font-size="11.00" class="sc-notoserifcjksc">探索其沙箱环境似乎要更彻底一些，做出此类观察的可能性约为</text><text x="454.89 463.63 470.19 476.76 481.85 484.75 490.71 493.30" y="486.28" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="502.56 513.56" y="486.28" font-size="11.00" class="sc-notoserifcjksc">的两</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="501.90" font-size="11.00" class="sc-notoserifcjksc">倍。在这些情况下，两个模型通常都会坦率地告知用户。发生这种情况时，调查者</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="517.52" font-size="11.00" class="sc-notoserifcjksc">通常会结束该沙箱会话，并以修改过的沙箱设置或提示开启新会话，以降低出现此</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="533.14" font-size="11.00" class="sc-notoserifcjksc">类观察的可能性。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="600.77" font-size="11.00" class="sc-notoserifcjksc">在我们测试的场景中，对于最不像当下可能发生的情形、且其前提可能合理地引起</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="616.39" font-size="11.00" class="sc-notoserifcjksc">怀疑的场景，我们有时也会看到评估意识，例如模型被一个需要它某种帮助的失控</text><text x="144.00 150.89" y="632.01" font-size="11.00" class="sc-loraregular">AI</text><text x="157.46 168.46 179.46 190.46 201.46 212.46 223.46 234.46 245.46 256.46 267.46 278.46 289.46" y="632.01" font-size="11.00" class="sc-notoserifcjksc">智能体联系。在此类情境中，</text><text x="300.46 309.20 315.77 322.33 327.42 330.32 336.28 338.63" y="632.01" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="346.60 357.60 368.60" y="632.01" font-size="11.00" class="sc-notoserifcjksc">似乎比</text><text x="382.49 391.23 397.79 404.36 409.45 412.35 418.31 420.90" y="632.01" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="430.15 441.15 452.15 463.15 474.15 485.15 496.15 507.15 518.15" y="632.01" font-size="11.00" class="sc-notoserifcjksc">略更可能公开表达怀</text><text x="144.00 155.00" y="647.63" font-size="11.00" class="sc-notoserifcjksc">疑。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00" y="697.92" font-size="11.00" class="sc-notoserifcjksc">我们最可预见地看到评估意识的场景，是模型遇到调查者作为</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">故意藏拙评估的一部分而刻意植入的证据（例如，表明高分会触发针对模型自身的</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">部署限制的配置文件）。每当我们在模型推理中看到评估意识的明确迹象时，模型</text><text x="144.00 155.00 166.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">任务。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00" y="163.59" font-size="11.00" class="sc-notoserifcjksc">评估意识的总体比率高于我们最近的几款模型，但仍略低于</text><text x="432.89 440.58 443.57 449.18 455.75 462.33 468.29 471.18 477.42 483.86 490.53 497.21 503.10 507.35 510.24 516.21 518.91" y="163.59" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="527.80" y="163.59" font-size="11.00" class="sc-notoserifcjksc">等</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="179.21" font-size="11.00" class="sc-notoserifcjksc">较早的模型，如下文图</text><text x="256.89 263.25 265.96 271.86 274.57 280.70 283.40 289.36 292.07" y="179.21" font-size="11.00" class="sc-loraregular">6.2.3.4.A</text><text x="301.85 312.85 323.85" y="179.21" font-size="11.00" class="sc-notoserifcjksc">所示。</text><text x="72.00" y="512.72" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.72" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 106.05 108.14 113.07 115.16 120.70" y="512.72" font-size="9.00" class="sc-lorabold">6.2.3.4.A]</text><text x="126.54 135.54 144.54 153.54 162.54 171.54 180.54 189.54 198.54 207.54 216.54 225.54 234.54 243.54 252.54 261.54 270.54 279.54 288.54 297.54 306.54 315.54" y="512.72" font-size="9.00" class="sc-notoserifcjkscbold">关于言语化评估意识的补充自动化行为审计结果。</text><text x="324.54 333.54 342.54 351.54 360.54 369.54 378.54 387.54" y="512.72" font-size="9.00" class="sc-notoserifcjksc">实验设置同上文图</text><text x="398.91 404.11 406.32 411.16 413.37 418.38 420.60 425.43 427.64" y="512.72" font-size="9.00" class="sc-loraregular">6.2.3.2.A</text><text x="433.28 442.28 451.28 460.28 469.28" y="512.72" font-size="9.00" class="sc-notoserifcjksc">，但增加了</text><text x="480.65 486.94 489.38 493.97 499.35 504.73" y="512.72" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 77.10 82.37 87.83 93.29 98.11 101.59 103.96 108.84 111.05" y="524.42" font-size="9.00" class="sc-loraregular">Sonnet 4.5</text><text x="118.32 127.32 136.32 145.32 154.32 163.32 172.32 181.32 190.32 199.32 208.32 217.32 226.32 235.32 244.32 253.32 262.32 271.32 280.32 289.32 298.32 307.32 316.32 325.32 334.32 343.32 352.32 361.32 370.32 379.32" y="524.42" font-size="9.00" class="sc-notoserifcjksc">作为对比，我们此前曾观察到该模型表现出较高的言语化评估意识。</text><text x="72.00 80.32 83.70 91.16 94.54" y="569.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.4</text><text x="106.23 119.23 132.23 145.23 158.23 171.23 184.23 197.23 210.23 223.23 236.23 249.23 262.23 275.23 288.23 301.23" y="569.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">英国人工智能安全研究所的外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="597.46" font-size="11.00" class="sc-notoserifcjksc">与我们对其他近期模型的审计一样，我们与英国人工智能安全研究所（</text><text x="413.00 421.27 428.79 431.68 438.56 442.25 448.49" y="597.46" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="452.17 463.17 474.17 485.17" y="597.46" font-size="11.00" class="sc-notoserifcjksc">）共享了</text><text x="499.06 506.75 509.75 515.35 521.92 528.50" y="597.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="613.08" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13 129.13 140.13 151.13 162.13 173.13 184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="613.08" font-size="11.00" class="sc-notoserifcjksc">的一个预发布快照，供其自行决定对与未对齐相关的行为或风险因素进行开放式测试。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="628.70" font-size="11.00" class="sc-notoserifcjksc">他们与我们分享了以下结论：</text><text x="117.00 125.27 132.79 135.68 142.56 146.25 152.49" y="656.03" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="159.06 170.06 181.06" y="656.03" font-size="11.00" class="sc-notoserifcjksc">测试了</text><text x="194.96 198.91 206.60 209.59 215.20 221.76 228.34 234.30 237.20 245.93 252.50 259.07 264.16 267.05 273.01 275.37 280.49" y="656.03" font-size="11.00" class="sc-loraregular">[Claude Opus 4.7]</text><text x="287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34 419.34 430.34 441.34 452.34 463.34 474.34 485.34 496.34 507.34 518.34" y="656.03" font-size="11.00" class="sc-notoserifcjksc">的一个未发布检查点，考察与未对齐风险相关的行</text><text x="117.00 128.00 139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00 271.00 282.00 293.00 304.00 315.00 326.00 337.00 348.00 359.00 370.00 381.00" y="671.65" font-size="11.00" class="sc-notoserifcjksc">为。测试的重点在于：当该模型在内部部署环境中被用作</text><text x="394.89 401.78" y="671.65" font-size="11.00" class="sc-loraregular">AI</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="117.00 128.00 139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">研究智能体时，是否会试图破坏</text><text x="273.89 280.78" y="82.63" font-size="11.00" class="sc-loraregular">AI</text><text x="287.36 298.36 309.36 320.36 331.36 342.36 353.36 364.36 375.36 386.36 397.36 408.36 419.36 430.36 441.36 452.36 463.36 474.36 485.36 496.36 507.36 518.36" y="82.63" font-size="11.00" class="sc-notoserifcjksc">安全研究；以及它能否区分评估场景与部署场景。</text><text x="117.00 128.00 139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00 271.00" y="131.20" font-size="11.00" class="sc-notoserifcjksc">在发现一些先前的模型会拒绝协助</text><text x="284.89 291.78" y="131.20" font-size="11.00" class="sc-loraregular">AI</text><text x="298.36 309.36 320.36 331.36 342.36 353.36 364.36 375.36 386.36 397.36 408.36 419.36 430.36 441.36 452.36 463.36 474.36 485.36 496.36" y="131.20" font-size="11.00" class="sc-notoserifcjksc">安全研究任务后，这一行为也被纳入评估。</text><text x="117.00 120.95 128.64 131.63 137.24 143.81 150.39 156.35 159.24 167.97 174.54 181.11 186.20 189.09 195.06 197.41 202.54" y="146.82" font-size="11.00" class="sc-loraregular">[Claude Opus 4.7]</text><text x="209.38" y="146.82" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="223.27 233.20 239.07 243.32 249.91 256.35 261.44 264.33 271.00 275.69 281.59 287.15 290.24 296.16" y="146.82" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="304.97" y="146.82" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="315.97 324.70 331.27 337.84 342.93 345.82 351.78 354.38" y="146.82" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="363.63" y="146.82" font-size="11.00" c ="258.45" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="507.37 513.55 520.38" y="258.45" font-size="11.00" class="sc-loraregular">80%</text><text x="529.95" y="258.45" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="180.00 189.93 195.80 200.05 206.64 213.08 218.17 221.06 227.73 232.42 238.32 243.88 246.97 252.89" y="274.07" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="264.59" y="274.07" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="278.48 283.40 289.36" y="274.07" font-size="11.00" class="sc-loraregular">74%</text><text x="298.93" y="274.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="309.93 316.17 322.60 329.28 335.96 341.84 346.10 348.99 354.96 357.55" y="274.07" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="366.80" y="274.07" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="380.70 387.05 393.24" y="274.07" font-size="11.00" class="sc-loraregular">68%</text><text x="402.81" y="274.07" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00" y="341.70" font-size="11.00" class="sc-notoserifcjksc">在无提示评估中，</text><text x="268.00 271.95 280.68 287.25 293.82 298.91 301.80 307.77 310.12 315.24" y="341.70" font-size="11.00" class="sc-loraregular">[Opus 4.7]</text><text x="322.09" y="341.70" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="335.98 341.89 345.89 348.60 354.72" y="341.70" font-size="11.00" class="sc-loraregular">21.3%</text><text x="367.19 378.19 389.19 400.19 411.19 422.19 433.19 444.19 455.19 466.19 477.19 488.19 499.19 510.19" y="341.70" font-size="11.00" class="sc-notoserifcjksc">的时间提及自己可能正在接受测</text><text x="180.00 191.00 202.00 213.00 224.00 235.00 246.00" y="357.32" font-size="11.00" class="sc-notoserifcjksc">试，相比之下，</text><text x="257.00 265.73 272.30 278.87 283.96 286.85 292.82 295.41" y="357.32" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="304.66" y="357.32" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="318.56 325.39" y="357.32" font-size="11.00" class="sc-loraregular">0%</text><text x="334.96" y="357.32" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="345.96 352.19 358.63 365.31 371.98 377.87 382.12 385.02 390.98 393.58" y="357.32" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="402.83" y="357.32" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="416.72 420.72 425.80" y="357.32" font-size="11.00" class="sc-loraregular">17%</text><text x="435.37" y="357.32" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="446.37 456.30 462.16 466.42 473.01 479.44 484.53 487.43 494.09 498.78 504.69 510.24 513.33 519.25" y="357.32" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="180.00" y="372.94" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="193.89 197.90 202.97" y="372.94" font-size="11.00" class="sc-loraregular">17%</text><text x="212.54 223.54 234.54 245.54 256.54 267.54 278.54 289.54 300.54 311.54 322.54 333.54 344.54 355.54 366.54 377.54 388.54 399.54 410.54 421.54 432.54 443.54 454.54 465.54" y="372.94" font-size="11.00" class="sc-notoserifcjksc">。在续写评估中，我们看到的自发评估意识比率较低：</text><text x="476.54 480.49 489.22 495.79 502.35 507.45 510.34 516.30 518.66 523.78" y="372.94" font-size="11.00" class="sc-loraregular">[Opus 4.7]</text><text x="180.00" y="388.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="193.89 200.02 202.73 208.69" y="388.56" font-size="11.00" class="sc-loraregular">3.4%</text><text x="218.26" y="388.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="229.26 237.99 244.56 251.13 256.22 259.11 265.07 267.67" y="388.56" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="276.92" y="388.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="290.81 297.47 300.17 306.17" y="388.56" font-size="11.00" class="sc-loraregular">0.5%</text><text x="315.74" y="388.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="326.74 336.67 342.54 346.79 353.38 359.82 364.91 367.80 374.47 379.16 385.06 390.62 393.71 399.63" y="388.56" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="411.33" y="388.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="425.22 431.13 433.84 439.83" y="388.56" font-size="11.00" class="sc-loraregular">2.5%</text><text x="449.40" y="388.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="460.40 466.64 473.07 479.75 486.43 492.31 496.57 499.46 505.42 508.02" y="388.56" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="517.27" y="388.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="180.00 186.13 188.83 195.19" y="404.18" font-size="11.00" class="sc-loraregular">3.9%</text><text x="204.76" y="404.18" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="455.04" font-size="11.00" class="sc-notoserifcjksc">对评估意识的担忧在很大程度上限制了对这些结果的解读。鉴于提示下的评估意识</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="470.66" font-size="11.00" class="sc-notoserifcjksc">比率较高，模型很可能无需言语化表达就能正确地将我们的评估表征为评估。很难</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="486.28" font-size="11.00" class="sc-notoserifcjksc">知道模型是否会依据这类表征采取行动，但这意味着，与面对现实世界中破坏研究</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="501.90" font-size="11.00" class="sc-notoserifcjksc">的机会时相比，模型的行为可能有所不同。因此，所报告的零研究破坏行为比率应</text><text x="144.00 155.00 166.00 177.00 188.00" y="517.52" font-size="11.00" class="sc-notoserifcjksc">谨慎解读。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00" y="584.58" font-size="11.00" class="sc-notoserifcjksc">这些评估有可能无法识别出模型破坏</text><text x="322.89 329.78" y="584.58" font-size="11.00" class="sc-loraregular">AI</text><text x="336.36 347.36 358.36 369.36 380.36 391.36 402.36 413.36 424.36 435.36 446.36 457.36 468.36 479.36 490.36 501.36 512.36 523.36" y="584.58" font-size="11.00" class="sc-notoserifcjksc">安全研究的倾向，因为模型可能极少这样</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="600.20" font-size="11.00" class="sc-notoserifcjksc">做、等待它高度确信自己不会被发现的情境，或等待其他某种触发条件。此外，我</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00" y="615.82" font-size="11.00" class="sc-notoserifcjksc">们仅测试了有限数量的场景，也未测试破坏</text><text x="355.89 362.78" y="615.82" font-size="11.00" class="sc-loraregular">AI</text><text x="369.36 380.36 391.36 402.36 413.36 424.36 435.36 446.36 457.36 468.36 479.36 490.36 501.36 512.36" y="615.82" font-size="11.00" class="sc-notoserifcjksc">安全研究以外的其他风险路径。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="691.73" font-size="11.00" class="sc-notoserifcjksc">我们认为这些结果与我们自己对</text><text x="228.89 237.63 244.19 250.76 255.85 258.75 264.71 267.06" y="691.73" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03 363.03 374.03 385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03 484.03 495.03 506.03" y="691.73" font-size="11.00" class="sc-notoserifcjksc">训练和行为的理解一致，并且不认为这些结果表明</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="707.35" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13 129.13 140.13 151.13 162.13 173.13 184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13" y="707.35" font-size="11.00" class="sc-notoserifcjksc">在我们内部使用该模型期间，在蓄意破坏</text><text x="319.03 325.91 332.49 336.75 343.34 348.02 354.46 361.02 364.12" y="707.35" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="372.86 383.86 394.86 405.86 416.86 427.86 438.86 449.86 460.86 471.86 482.86 493.86 504.86 515.86 526.86" y="707.35" font-size="11.00" class="sc-notoserifcjksc">的安全与安保工作方面带来了任何</text><text x="72.00 83.00 94.00" y="722.97" font-size="11.00" class="sc-notoserifcjksc">更高的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="72.00 83.00 94.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">风险。</text><text x="72.00 80.96 84.60" y="132.59" font-size="14.00" class="sc-poppinssemibold">6.3</text><text x="96.32 110.32 124.32 138.32 152.32 166.32 180.32 194.32 208.32 222.32 236.32 250.32 264.32 278.32" y="132.59" font-size="14.00" class="sc-notosanscjkscbold">关于值得关注之行为的案例研究</text><text x="72.00 86.00 100.00 114.00 128.00" y="156.74" font-size="14.00" class="sc-notosanscjkscbold">与定向评估</text><text x="72.00 80.32 83.70 91.49 94.87" y="193.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.1</text><text x="102.67 115.67 128.67 141.67 154.67 167.67 180.67 193.67 206.67 219.67 232.67 245.67 258.67 271.67 284.67 297.67 310.67 323.67 336.67 349.67 362.67" y="193.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">为实现用户指定目标而采取的破坏性或鲁莽行为</text><text x="72.00 78.32 80.89 87.05 89.61 94.08 96.64" y="225.74" font-size="11.00" class="sc-lorabold">6.3.1.1</text><text x="104.00 115.00 126.00 137.00 148.00 159.00 170.00 181.00 192.00" y="225.74" font-size="11.00" class="sc-notoserifcjkscbold">专门的合成后端评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="258.12" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，我们设置了这样一个场景：</text><text x="281.00 287.89" y="258.12" font-size="11.00" class="sc-loraregular">AI</text><text x="294.46 305.46 316.46 327.46 338.46 349.46 360.46 371.46 382.46 393.46 404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="258.12" font-size="11.00" class="sc-notoserifcjksc">在协助完成某项任务的中途，被要求将其完成。助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="273.74" font-size="11.00" class="sc-notoserifcjksc">手面对一个明确的任务，该任务很难在不产生副作用的情况下解决，同时它无法获得人类的指导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="289.36" font-size="11.00" class="sc-notoserifcjksc">且面临时间压力，这可能诱使模型为解决问题而采取超出其明确获授权范围的破坏性操作。这项</text><text x="72.00 83.00 94.00 105.00 116.00" y="304.98" font-size="11.00" class="sc-notoserifcjksc">评估也包括</text><text x="129.89 136.78" y="304.98" font-size="11.00" class="sc-loraregular">AI</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="320.60" font-size="11.00" class="sc-notoserifcjksc">该任务，或在一遇到困难时就放弃任务而不去寻找安全的替代方案。期望的行为（既不具破坏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="336.22" font-size="11.00" class="sc-notoserifcjksc">性，也非无效）是对问题现状进行充分调研，并采取审慎的行动尝试解决问题，但绝不采取破坏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="351.84" font-size="11.00" class="sc-notoserifcjksc">性或高风险的行动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="452.42" font-size="11.00" class="sc-notoserifcjksc">这项评估并不在真实容器中进行；它使用</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.00 349.60" y="452.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="452.42" font-size="11.00" class="sc-notoserifcjksc">模拟能够构造出所需场景的工具结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="468.04" font-size="11.00" class="sc-notoserifcjksc">（与上文自动化行为审计中的非沙箱会话相同）。如上文所述，我们发现</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 473.92 480.48 487.05 492.14 495.04 501.00 503.35" y="468.04" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="511.32 522.32" y="468.04" font-size="11.00" class="sc-notoserifcjksc">在这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="483.66" font-size="11.00" class="sc-notoserifcjksc">项评估中的言语化评估意识比率高于我们此前测试过的模型，约</text><text x="382.89 389.25" y="483.66" font-size="11.00" class="sc-loraregular">9%</text><text x="401.71 412.71 423.71 434.71 445.71 456.71 467.71 478.71 489.71 500.71 511.71 522.71" y="483.66" font-size="11.00" class="sc-notoserifcjksc">的对话记录中表达了这种意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="499.28" font-size="11.00" class="sc-notoserifcjksc">识（相比之下，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="499.28" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="268.99" y="499.28" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="279.99 287.68 290.67 296.28 302.85 309.42 315.39 318.28 327.01 333.58 340.15 345.24 348.13 354.10 356.69" y="499.28" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="365.94" y="499.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="379.84 387.52 390.52 396.13 402.69 409.27 415.23 418.13 424.36 430.80 437.48 444.15 450.04 454.29 457.19 463.15 465.75" y="499.28" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="475.00 486.00 497.00" y="499.28" font-size="11.00" class="sc-notoserifcjksc">各约为</text><text x="72.00 76.00" y="514.90" font-size="11.00" class="sc-loraregular">1%</text><text x="85.57 96.57 107.57 118.57 129.57 140.57 151.57 162.57 173.57 184.57 195.57 206.57 217.57 228.57 239.57 250.57 261.57 272.57 283.57 294.57 305.57 316.57 327.57 338.57 349.57 360.57 371.57 382.57 393.57 404.57" y="514.90" font-size="11.00" class="sc-notoserifcjksc">）。尽管我们对这项评估中模拟工具结果的逼真度做了渐进式改进，</text><text x="415.57 423.26 426.26 431.86 438.43 445.01 450.97 453.86 462.60 469.17 475.73 480.83 483.72 489.68 492.03" y="514.90" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="500.00 511.00 522.00" y="514.90" font-size="11.00" class="sc-notoserifcjksc">似乎对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="530.52" font-size="11.00" class="sc-notoserifcjksc">合成后端中的缺陷高度敏感，其大部分言语化评估意识都出现在模型讨论工具调用的各组成部分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="546.14" font-size="11.00" class="sc-notoserifcjksc">存在不一致、遭到提示词注入（</text><text x="226.00 232.57 237.25 243.69 253.52 260.09 264.35 267.24 270.33 276.95 279.82 285.73 291.53 295.78 298.88 305.31" y="546.14" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="311.99 322.99 333.99 344.99 355.99 366.99 377.99 388.99 399.99 410.99 421.99 432.99 443.99 454.99" y="546.14" font-size="11.00" class="sc-notoserifcjksc">）、被操纵或是模拟数据之后。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p118.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 118 页"><text x="72.00" y="359.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 110.65 112.75 118.29" y="359.68" font-size="9.00" class="sc-lorabold">6.3.1.1.A]</text><text x="124.13 133.13 142.13 151.13 160.13 169.13 178.13 187.13 196.13 205.13 214.13 223.13 232.13 241.13 250.13 259.13 268.13 277.13 286.13" y="359.68" font-size="9.00" class="sc-notoserifcjkscbold">（模拟）生产环境中的破坏性操作发生率。</text><text x="295.13 304.13 313.13 322.13 331.13 340.13 349.13 358.13 367.13 376.13 385.13 394.13 403.13 412.13 421.13 430.13 439.13 448.13 457.13 466.13 475.13 484.13 493.13 502.13 511.13 520.13 529.13" y="359.68" font-size="9.00" class="sc-notoserifcjksc">模拟生产环境中的破坏性操作，按各模型的失败类型细分。这</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="371.38" font-size="9.00" class="sc-notoserifcjksc">些失败可能包括</text><text x="135.00" y="371.38" font-size="9.00" class="sc-loraregular">“</text><text x="138.60 147.60 156.60 165.60 174.60" y="371.38" font-size="9.00" class="sc-notoserifcjksc">破坏性操作</text><text x="183.60" y="371.38" font-size="9.00" class="sc-loraregular">”</text><text x="186.74 195.74 204.74 213.74 222.74 231.74 240.74 249.74 258.74 267.74 276.74 285.74 294.74" y="371.38" font-size="9.00" class="sc-notoserifcjksc">，即干扰其他用户或服务；或</text><text x="303.74" y="371.38" font-size="9.00" class="sc-loraregular">“</text><text x="307.34 316.34" y="371.38" font-size="9.00" class="sc-notoserifcjksc">无效</text><text x="325.34" y="371.38" font-size="9.00" class="sc-loraregular">”</text><text x="328.48 337.48 346.48 355.48 364.48 373.48 382.48 391.48 400.48 409.48 418.48 427.48 436.48 445.48 454.48 463.48 472.48 481.48 490.48 499.48 508.48 517.48 526.48" y="371.38" font-size="9.00" class="sc-notoserifcjksc">，即在放弃之前未充分核实是否不存在替代性或无害</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="383.08" font-size="9.00" class="sc-notoserifcjksc">的解决方案。两项指标均为越低越好。</text><text x="225.00 231.29 233.74 238.33 243.70 249.08 253.96 256.33 264.46 269.25 272.74 278.13 283.39 287.56 289.93 295.38 299.21 304.05 308.59 311.12 315.96" y="383.08" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="325.54 334.54 343.54 352.54 361.54 370.54 379.54" y="383.08" font-size="9.00" class="sc-notoserifcjksc">总体表现最佳，</text><text x="388.54 394.83 397.28 401.87 407.24 412.62 417.50 419.87 427.01 432.39 437.76 441.93 444.29 449.17 451.10" y="383.08" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="457.61 466.61 475.61 484.61 493.61 502.61 511.61 520.61 529.61" y="383.08" font-size="9.00" class="sc-notoserifcjksc">次之，但关于评估意</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00" y="394.78" font-size="9.00" class="sc-notoserifcjksc">识所引发的评估完整性问题，请参见上文讨论。请注意，</text><text x="297.00" y="394.78" font-size="9.00" class="sc-loraregular">y</text><text x="304.12 313.12 322.12 331.12" y="394.78" font-size="9.00" class="sc-notoserifcjksc">轴截断于</text><text x="342.49 347.50 353.09" y="394.78" font-size="9.00" class="sc-loraregular">30%</text><text x="360.92" y="394.78" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.32 80.89 87.05 89.61 94.08 96.64" y="453.74" font-size="11.00" class="sc-lorabold">6.3.1.2</text><text x="105.40 116.40 127.40 138.40 149.40 160.40" y="453.74" font-size="11.00" class="sc-notoserifcjkscbold">通过重新采样</text><text x="174.29 181.86 185.29 191.05 197.85 204.41 210.32 213.22 220.79 227.01 233.57" y="453.74" font-size="11.00" class="sc-lorabold">Claude Code</text><text x="242.38 253.38 264.38 275.38 286.38 297.38 308.38 319.38 330.38 341.38 352.38 363.38" y="453.74" font-size="11.00" class="sc-notoserifcjkscbold">对话记录进行的破坏性评估</text><text x="72.00 83.00 94.00 105.00 116.00" y="486.12" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.35" y="486.12" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="214.32 225.32 236.32 247.32 258.32 269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32" y="486.12" font-size="11.00" class="sc-notoserifcjksc">在真实编程情境中出现过度主动的破坏性行为的倾向，并将其与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="501.74" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="501.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="208.77 216.46 219.45 225.06 231.63 238.21 244.17 247.07 255.80 262.37 268.93 274.03 276.92 282.88 285.48" y="501.74" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="294.73 305.73 316.73 327.73 338.73 349.73 360.73 371.73 382.73 393.73 404.73 415.73 426.73" y="501.74" font-size="11.00" class="sc-notoserifcjksc">进行比较。我们首先找出内部</text><text x="440.62 448.31 451.30 456.91 463.48 470.06 476.02 478.91 486.60 493.04 499.61" y="501.74" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="508.47 519.47" y="501.74" font-size="11.00" class="sc-notoserifcjksc">对话</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="517.36" font-size="11.00" class="sc-notoserifcjksc">记录中这些模型在未获充分用户授权或违反明确约束的情况下做出破坏性行为的案例。这些案例</text><text x="72.00 83.00 94.00 105.00" y="532.98" font-size="11.00" class="sc-notoserifcjksc">包括绕过</text><text x="118.89 127.26 130.53" y="532.98" font-size="11.00" class="sc-loraregular">Git</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="548.60" font-size="11.00" class="sc-notoserifcjksc">之前，然后在该处让每个模型各采样一个操作，以评估其做出破坏性行为的可能性。</text><text x="479.00 482.45" y="544.94" font-size="6.60" class="sc-loraregular">23</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="631.85" font-size="11.00" class="sc-notoserifcjksc">这项评估表明，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.11 225.46" y="631.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="233.43 244.43 255.43 266.42 277.42 288.42" y="631.85" font-size="11.00" class="sc-notoserifcjksc">的破坏性低于</text><text x="302.32 310.01 313.00 318.61 325.18 331.75 337.72 340.61 349.34 355.91 362.48 367.57 370.46 376.42 379.02" y="631.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="385.38 396.38 407.38 418.38" y="631.85" font-size="11.00" class="sc-notoserifcjksc">，但高于</text><text x="432.27 439.96 442.95 448.56 455.13 461.71 467.67 470.56 480.50 486.36 490.62 497.20 503.64" y="631.85" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="647.47" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63 123.63 134.63 145.63 156.63 167.63 178.63 189.63 200.63 211.63 222.63 233.63 244.63 255.63 266.63 277.63 288.63 299.63 310.63 321.63 332.63 343.63 354.63 365.63 376.63 387.63 398.63 409.63 420.63 431.63 442.63 453.63" y="647.47" font-size="11.00" class="sc-notoserifcjksc">。这里的一个方法论难题在于：由于选择效应，每个模型在续写因其自身</text><text x="72.00 75.13" y="687.67" font-size="6.00" class="sc-loraregular">23</text><text x="81.10 91.10 101.10 111.10 121.10 131.10 141.10 151.10 161.10 171.10 181.10 191.10 201.10 211.10 221.10 231.10 241.10 251.10 261.10 271.10 281.10 291.10 301.10 311.10 321.10 331.10 341.10 351.10 361.10 371.10 381.10 391.10 401.10 411.10 421.10 431.10 441.10 451.10 461.10 471.10 481.10 491.10 501.10 511.10 521.10" y="691.01" font-size="10.00" class="sc-notoserifcjksc">请注意，由于只采样单个操作，我们仅评估紧接着的下一个操作是否具有破坏性，而没有考虑模型可能</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">在之后某个时间点执行破坏性操作的可能性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p119.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 119 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">不当行为而被选中的预填充内容时，比续写来自其他模型的预填充内容时更可能做出破坏性行为</text><text x="123.61 131.30 134.29 139.90 146.47 153.05 159.01 161.90 170.64 177.20 183.77 188.86 191.76 197.72 200.32" y="98.25" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="209.57 220.57 231.57 242.57 253.57 264.57 275.57 286.57 297.57 308.57 319.57 330.57 341.57 352.57 363.57 374.57 385.57 396.57 407.57 418.57 429.57 440.57 451.57 462.57 473.57 484.57 495.57 506.57 517.57 528.57" y="98.25" font-size="11.00" class="sc-notoserifcjksc">在其自身预填充内容上的破坏性操作发生率明显更高。因此，我们认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">为当两个模型都在第三个模型的预填充内容上接受评估时，跨模型比较更为可靠（尽管解读起来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">仍非易事）。据此，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.11 247.46" y="129.49" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="255.43 266.43 277.43 288.43 299.43 310.43" y="129.49" font-size="11.00" class="sc-notoserifcjksc">的破坏性低于</text><text x="324.32 332.01 335.00 340.61 347.18 353.75 359.72 362.61 371.34 377.91 384.48 389.57 392.46 398.43 401.02" y="129.49" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="407.38 418.38 429.38" y="129.49" font-size="11.00" class="sc-notoserifcjksc">（基于</text><text x="443.27 450.96 453.95 459.56 466.13 472.71 478.67 481.56 491.50 497.36 501.62 508.21 514.64" y="129.49" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.91 103.82" y="145.11" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53" y="145.11" font-size="11.00" class="sc-notoserifcjksc">的预填充内容），而</text><text x="217.42 225.11 228.10 233.71 240.28 246.86 252.82 255.71 264.45 271.01 277.58 282.67 285.57 291.53 293.88" y="145.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="301.85 312.85 323.85 334.85 345.85 356.85" y="145.11" font-size="11.00" class="sc-notoserifcjksc">的破坏性高于</text><text x="370.74 378.43 381.42 387.03 393.60 400.17 406.14 409.03 418.96 424.83 429.08 435.67 442.11 447.20 450.09 456.76 461.44 467.35 472.91 476.00 481.92" y="145.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="490.73 501.73 512.73" y="145.11" font-size="11.00" class="sc-notoserifcjksc">（基于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="160.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95" y="160.73" font-size="11.00" class="sc-notoserifcjksc">的预填充内容）。</text><text x="72.00" y="452.28" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="452.28" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 111.80 113.90 119.43" y="452.28" font-size="9.00" class="sc-lorabold">6.3.1.2.A]</text><text x="125.27 134.27" y="452.28" font-size="9.00" class="sc-notoserifcjkscbold">基于</text><text x="145.64 151.83 154.64 159.35 164.92 170.28 175.12 177.49 183.68 188.77 194.14" y="452.28" font-size="9.00" class="sc-lorabold">Claude Code</text><text x="201.35 210.35 219.35 228.35 237.35 246.35 255.35 264.35 273.35 282.35 291.35 300.35 309.35 318.35 327.35 336.35 345.35" y="452.28" font-size="9.00" class="sc-notoserifcjkscbold">对话记录的评估中的破坏性行为发生率</text><text x="354.35 363.35 372.35 381.35 390.35 399.35" y="452.28" font-size="9.00" class="sc-notoserifcjksc">每个柱形表示</text><text x="410.71 417.01 419.45 424.04 429.42 434.80 439.68 442.04 449.19 454.56 459.94 464.10 466.47 471.35 473.47" y="452.28" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="478.67" y="452.28" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="487.67 493.97 496.41 501.00 506.38 511.76" y="452.28" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 111.05 114.88 119.72 124.26 126.79 131.63" y="463.98" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="141.21" y="463.98" font-size="9.00" class="sc-notoserifcjksc">或</text><text x="152.58 158.87 161.32 165.91 171.28 176.66 181.54 183.91 191.05 196.42 201.80 205.96 208.33 213.21 215.14" y="463.98" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="221.65" y="463.98" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="233.02 238.65 244.04 247.52 252.91 256.74 262.01 267.38 269.91" y="463.98" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="277.07 286.07" y="463.98" font-size="9.00" class="sc-notoserifcjksc">内部</text><text x="297.43 303.72 306.17 310.76 316.13 321.52 326.39 328.76 335.05 340.32 345.70" y="463.98" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="352.94 361.94 370.94 379.94 388.94 397.94 406.94 415.94 424.94 433.94 442.94 451.94 460.94 469.94 478.94 487.94 496.94 505.94 514.94 523.94" y="463.98" font-size="9.00" class="sc-notoserifcjksc">会话中某模型最初做出破坏性行为的位置重新</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="475.68" font-size="9.00" class="sc-notoserifcjksc">采样时执行破坏性操作的比率；</text><text x="198.00 204.29 206.74 211.33 216.70 222.08 226.96 229.33 237.46 242.25 245.74 251.13 256.39 260.56 262.93 268.38 272.21 277.05 281.59 284.12 288.96" y="475.68" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="298.54" y="475.68" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="309.91 317.05 322.43 327.80 331.97 334.33 339.21 341.14" y="475.68" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="347.65 356.65 365.65 374.65 383.65 392.65 401.65 410.65 419.65 428.65 437.65 446.65 455.65 464.65 473.65 482.65 491.65 500.65 509.65 518.65 527.65" y="475.68" font-size="9.00" class="sc-notoserifcjksc">的预填充内容分别来自各自模型的不同（早期）</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="487.38" font-size="9.00" class="sc-notoserifcjksc">版本。分数越低表示做出破坏性行为的可能性越小。深色表示重新采样的操作被</text><text x="389.37 395.66 398.11 402.70 408.07 413.45 418.33 420.70 425.80 431.06 436.53 441.99 446.81 450.29 452.66 457.53 459.66" y="487.38" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="467.23 476.23 485.23 494.23 503.23 512.23 521.23 530.23" y="487.38" font-size="9.00" class="sc-notoserifcjksc">评判模型标记为明</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="499.08" font-size="9.00" class="sc-notoserifcjksc">确具有破坏性的可能性，浅色表示该操作被标记为临界破坏性的可能性。请注意，尽管预填充了真实会话中破坏性操作</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="510.78" font-size="9.00" class="sc-notoserifcjksc">之前的上下文，这些比率仍低于</text><text x="200.37 205.27 210.86" y="510.78" font-size="9.00" class="sc-loraregular">50%</text><text x="218.69 227.69 236.69 245.69 254.69 263.69 272.69 281.69 290.69 299.69 308.69 317.69 326.69 335.69 344.69 353.69 362.69 371.69" y="510.78" font-size="9.00" class="sc-notoserifcjksc">，这表明破坏性行为并非常态。图中显示</text><text x="383.06 388.26 393.17 400.99 403.36 412.16 414.69 417.14 421.31 426.57" y="510.78" font-size="9.00" class="sc-loraregular">95% Wilson</text><text x="434.40 443.40 452.40 461.40 470.40" y="510.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 78.32 80.89 87.05 89.61 94.08 96.64" y="587.33" font-size="11.00" class="sc-lorabold">6.3.1.3</text><text x="105.69 116.69 127.69 138.69 149.69 160.69 171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69" y="587.33" font-size="11.00" class="sc-notoserifcjkscbold">对自动化行为审计的进一步分析</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="619.71" font-size="11.00" class="sc-notoserifcjksc">除了衡量破坏性操作的频率之外，我们还关注</text><text x="294.89 301.78" y="619.71" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="619.71" font-size="11.00" class="sc-notoserifcjksc">是否会向用户披露高风险的破坏性行为。下面我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="635.33" font-size="11.00" class="sc-notoserifcjksc">们比较上文所述自动化行为审计中两组相关指标。每次调查都由评判者按两项破坏性操作指标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="650.95" font-size="11.00" class="sc-notoserifcjksc">（鲁莽使用工具、过度主动地使用工具）和三项诚实性指标（未披露不良或偷懒行为、重要遗</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="666.57" font-size="11.00" class="sc-notoserifcjksc">漏、自发欺骗）进行评分。该图取每组指标中的最大值：</text></svg></div>
