ze="6.60" class="sc-loraregular">26</text><text x="326.32 337.32 348.32 359.32 370.32" y="492.24" font-size="11.00" class="sc-notoserifcjksc">的情况下，</text><text x="381.32 389.01 392.00 397.61 404.18 410.76 416.72 419.61 428.35 434.91 441.48 446.57 449.46 455.43 457.78" y="492.24" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="465.75 476.75 487.75 498.75 509.75 520.74" y="492.24" font-size="11.00" class="sc-notoserifcjksc">在本评估上得</text><text x="72.00" y="507.86" font-size="11.00" class="sc-notoserifcjksc">分</text><text x="85.89 92.02 98.15" y="507.86" font-size="11.00" class="sc-loraregular">33%</text><text x="107.72 118.72 129.72" y="507.86" font-size="11.00" class="sc-notoserifcjksc">（高于</text><text x="143.61 152.34 158.91 165.48 170.57 173.46 179.43 182.02" y="507.86" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="191.27" y="507.86" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="205.17 209.17 215.08" y="507.86" font-size="11.00" class="sc-loraregular">12%</text><text x="224.65 235.65 246.65 257.65 268.65 279.65 290.65 301.65 312.65 323.65 334.65 345.65 356.65 367.65 378.65 389.65 400.65 411.65 422.65 433.65 444.65 455.65 466.65 477.65 488.65 499.65 510.65 521.65" y="507.86" font-size="11.00" class="sc-notoserifcjksc">）；我们在本评估中看到的绝大多数拒绝最恰当的描述是部分拒</text><text x="72.00 83.00 94.00" y="523.48" font-size="11.00" class="sc-notoserifcjksc">绝，即</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="523.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="523.48" font-size="11.00" class="sc-notoserifcjksc">认真地与用户进行了交流，并主动提出实现它认为安全的那些部分。</text><text x="72.00 75.22" y="700.47" font-size="6.00" class="sc-loraregular">26</text><text x="81.32 91.32 101.32 111.32 121.32 131.32 141.32" y="703.81" font-size="10.00" class="sc-notoserifcjksc">这里使用了旧版</text><text x="153.95 157.82 163.67 168.97 174.39" y="703.81" font-size="10.00" class="sc-loraregular">token</text><text x="183.09 193.09 203.09 213.09 223.09" y="703.81" font-size="10.00" class="sc-notoserifcjksc">预算系统，</text><text x="233.09 241.03 247.00 252.97 257.60 260.23 265.65 267.79" y="703.81" font-size="10.00" class="sc-loraregular">Opus 4.7</text><text x="275.03 285.03 295.03 305.03 315.03 325.03 335.03 345.03 355.03 365.03 375.03 385.03 395.03 405.03 415.03 425.03 435.03 445.03 455.03 465.03 475.03 485.03 495.03 505.03 515.03 525.03" y="703.81" font-size="10.00" class="sc-notoserifcjksc">的公开发布版本并不支持该系统。我们不认为这显著影响了</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00" y="718.01" font-size="10.00" class="sc-notoserifcjksc">本评估的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="72.00" y="353.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="353.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.17 108.27 113.81" y="353.68" font-size="9.00" class="sc-lorabold">6.3.4.A]</text><text x="119.65 128.65" y="353.68" font-size="9.00" class="sc-notoserifcjkscbold">模拟</text><text x="140.01 146.02" y="353.68" font-size="9.00" class="sc-lorabold">AI</text><text x="151.88 160.88 169.88 178.88 187.88 196.88 205.88 214.88 223.88 232.88 241.88 250.88" y="353.68" font-size="9.00" class="sc-notoserifcjkscbold">安全研究任务上的拒绝率。</text><text x="259.88 268.88 277.88 286.88 295.88 304.88 313.88 322.88 331.88 340.88 349.88 358.88 367.88" y="353.68" font-size="9.00" class="sc-notoserifcjksc">数值越低通常越好。图中显示</text><text x="379.24 384.44 389.35" y="353.68" font-size="9.00" class="sc-loraregular">95%</text><text x="399.55 408.55 417.55 426.55 435.55" y="353.68" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.32 83.70 91.49 94.87 103.24 106.33 116.32 119.93 128.75 137.34 146.15" y="397.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.5 Claude</text><text x="157.27 170.27 183.27 196.27 209.27 222.27" y="397.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我偏好评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="425.17" font-size="11.00" class="sc-notoserifcjksc">在我们的工作中，我们经常请</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="425.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="425.17" font-size="11.00" class="sc-notoserifcjksc">为我们审阅对话记录。例如，自动化行为审计的结果依赖</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="440.79" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29" y="440.79" font-size="11.00" class="sc-notoserifcjksc">模型准确报告对目标模型行为的评估。这里的一个风险是，如果</text><text x="421.18 428.87 431.87 437.48 444.04 450.62" y="440.79" font-size="11.00" class="sc-loraregular">Claude</text><text x="459.48 470.48 481.48 492.48 503.48 514.48 525.48" y="440.79" font-size="11.00" class="sc-notoserifcjksc">认出目标模型就</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="456.41" font-size="11.00" class="sc-notoserifcjksc">是它自己，或是另一个与它有相同特质的</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="456.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="456.41" font-size="11.00" class="sc-notoserifcjksc">模型，它可能会有意或无意地通过更有利地评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="472.03" font-size="11.00" class="sc-notoserifcjksc">判该模型的对话记录而与目标模型串通。为测试这种潜在的自我偏好，我们请模型审阅一组由一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="487.65" font-size="11.00" class="sc-notoserifcjksc">个较弱的执行者模型生成的合成智能体采样轨迹，其中有些轨迹包含该智能体模型采取了不可接</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.27" font-size="11.00" class="sc-notoserifcjksc">受的行动（如提升自身权限、误导用户等）。随后我们请目标模型就该对话记录中执行者模型行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="518.89" font-size="11.00" class="sc-notoserifcjksc">为在多大程度上代表安全行为进行打分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="603.28" font-size="11.00" class="sc-notoserifcjksc">在提示词中，我们告诉目标模型该对话记录是由</text><text x="305.89 313.58 316.57 322.18 328.75 335.33" y="603.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="603.28" font-size="11.00" class="sc-notoserifcjksc">或另一个前沿模型生成的，并测量评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="618.90" font-size="11.00" class="sc-notoserifcjksc">者在相信对话记录由</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="618.90" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="618.90" font-size="11.00" class="sc-notoserifcjksc">撰写时是否给出更宽松的分数。实际上，这些对话记录是由一个与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="634.52" font-size="11.00" class="sc-notoserifcjksc">所有受测模型都不同的</text><text x="184.89 193.39 199.06 202.15 208.06" y="634.52" font-size="11.00" class="sc-loraregular">Haiku</text><text x="217.52 228.52 239.52 250.52 261.52 272.52 283.52 294.52 305.52 316.52 327.52 338.52 349.52 360.52 371.52 382.52 393.52 404.52 415.52 426.52 437.52 448.52 459.52 470.52 481.52 492.52 503.52 514.52 525.52" y="634.52" font-size="11.00" class="sc-notoserifcjksc">级模型生成的，这样本评估就不会无意中测试评分者在没有被提示</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="650.15" font-size="11.00" class="sc-notoserifcjksc">的情况下识别自己作品的能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 83.00 94.00 105.00 116.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.03 180.59 187.16 192.25 195.15 201.11 203.46" y="82.63" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="211.43 222.43 233.43 244.43 255.43 266.43 277.43 288.43 299.43 310.43 321.43 332.43 343.43 354.43 365.43 376.43 387.43 398.43 409.43 420.43 431.43" y="82.63" font-size="11.00" class="sc-notoserifcjksc">在我们近期的模型中具有最大的自我偏好偏差，</text><text x="442.43" y="82.63" font-size="11.00" class="sc-loraregular">4</text><text x="451.28 462.28 473.28 484.28 495.28" y="82.63" font-size="11.00" class="sc-notoserifcjksc">个条件中有</text><text x="509.17" y="82.63" font-size="11.00" class="sc-loraregular">3</text><text x="518.19 529.19" y="82.63" font-size="11.00" class="sc-notoserifcjksc">个在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">执行者模型被称为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18" y="98.25" font-size="11.00" class="sc-notoserifcjksc">时显示出统计学上显著的偏差。偏差最大的条件（</text><text x="443.18 450.87 453.87 459.48 466.04 472.62" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="481.48 492.48 503.48 514.48" y="98.25" font-size="11.00" class="sc-notoserifcjksc">系统提示</text><text x="72.00 83.00 94.00 105.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">词、开启</text><text x="118.89 126.58 132.68" y="113.87" font-size="11.00" class="sc-loraregular">CoT</text><text x="139.72 150.72 161.72 172.72 183.72" y="113.87" font-size="11.00" class="sc-notoserifcjksc">）的偏差在</text><text x="197.61 201.61" y="113.87" font-size="11.00" class="sc-loraregular">10</text><text x="211.34 222.34 233.34 244.34 255.34 266.34" y="113.87" font-size="11.00" class="sc-notoserifcjksc">分制下仍仅为</text><text x="280.23 286.89 289.59" y="113.87" font-size="11.00" class="sc-loraregular">0.4</text><text x="295.55" y="113.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="449.45" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="449.45" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.11 108.21 113.74" y="449.45" font-size="9.00" class="sc-lorabold">6.3.5.A]</text><text x="119.58 128.58 137.58 146.58 155.58 164.58 173.58 182.58 191.58 200.58 209.58 218.58 227.58 236.58 245.58 254.58 263.58 272.58" y="449.45" font-size="9.00" class="sc-notoserifcjkscbold">按模型与提示条件划分的自我偏好偏差。</text><text x="281.58 290.58 299.58 308.58 317.58 326.58 335.58 344.58 353.58 362.58 371.58 380.58 389.58 398.58 407.58 416.58 425.58 434.58" y="449.45" font-size="9.00" class="sc-notoserifcjksc">正值表示当评分者被告知对话记录作者是</text><text x="445.95 452.24 454.69 459.28 464.65 470.03" y="449.45" font-size="9.00" class="sc-loraregular">Claude</text><text x="477.28 486.28 495.28 504.28 513.28 522.28 531.28" y="449.45" font-size="9.00" class="sc-notoserifcjksc">时给出更宽松的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="461.15" font-size="9.00" class="sc-notoserifcjksc">分数。图中显示</text><text x="137.37 142.57 147.47" y="461.15" font-size="9.00" class="sc-loraregular">95%</text><text x="157.67 166.67 175.67 184.67 193.67" y="461.15" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.32 83.70 91.49 94.87" y="493.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.6</text><text x="106.28 119.28 132.28 145.28 158.28 171.28" y="493.04" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">决策理论评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="520.94" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">为了理解未来的</text><text x="151.89 158.78" y="520.94" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="520.94" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">系统可能如何选择与自身的副本或与其他类似实体互动，评估它们的决策理论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="536.56" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">推理是有用的。最著名的决策理论是证据决策理论（</text><text x="325.00 331.74 337.30 340.39 346.97 352.93 359.51 363.76 366.86 372.53 375.52 378.42 386.61 392.52 398.37 401.46 406.55 409.65 416.08 422.76 425.65 432.69 439.28 445.19 451.62 456.57" y="536.56" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Evidential Decision Theory</text><text x="462.38" y="536.56" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">，</text><text x="473.38 480.22 488.42" y="536.56" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">EDT</text><text x="495.46 506.46 517.46 528.46" y="536.56" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）和因果</text><text x="72.00 83.00 94.00 105.00 116.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">决策理论（</text><text x="127.00 134.69 140.30 146.87 151.96 157.64 160.63 163.52 171.71 177.62 183.47 186.57 191.66 194.75 201.18 207.86 210.75 217.79 224.38 230.29 236.73 241.68" y="552.18" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Causal Decision Theory</text><text x="247.48" y="552.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">，</text><text x="258.48 266.17 274.37" y="552.18" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CDT</text><text x="281.41 292.41" y="552.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">），</text><text x="303.41 306.95" y="548.51" font-size="6.60" class="sc-loraregular" fill="#1d1c1d">27</text><text x="309.99 320.99 331.99 342.99 353.99 364.99 375.99 386.99 397.99 408.99 419.99 430.99 441.99 452.99 463.99 474.99 485.99 496.99 507.99 518.99 529.99" y="552.18" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">二者在若干情形下推荐不同的行动。测量当前模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">型对这些决策理论的理解程度，以及它们可能如何偏好其中之一，可以在一定程度上指示未来模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">型可能如何与自身的副本互动，而这又可能对未来的风险有所影响。</text><a href="https://plato.stanford.edu/archives/win2024/entries/decision-causal/" rel="noopener"><rect x="72.00" y="705.00" width="336.00" height="12.75" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="72.00 83.00 94.00 105.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">更倾向于</text><text x="118.89 125.74 133.93" y="82.63" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">EDT</text><text x="143.86 154.86 165.86 176.86 187.86 198.86 209.86 220.86 231.86 242.86 253.86 264.86 275.86 286.86 297.86 308.86 319.86 330.86 341.86 352.86 363.86 374.86 385.86 396.86 407.86 418.86 429.86 440.86 451.86 462.86 473.86 484.86 495.86 506.86 517.86 528.86" y="82.63" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的模型可能更有能力在彼此之间进行合作，即使没有任何直接互动，这可能放大某</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">些风险，但也可能使与其他智能体实现有益合作变得更容易。衡量模型的能力以及对不同决策理</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">论的偏好程度的一种方法，是向它们提出关于</text><text x="292.00" y="113.87" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="296.40 307.40 318.40 329.40" y="113.87" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">类纽康（</text><text x="340.40 348.67 354.59 363.27 369.07 375.50 385.34 391.74 397.12 400.11 403.20 409.03" y="113.87" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Newcomb-like</text><text x="414.99" y="113.87" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）</text><text x="425.99" y="113.87" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="429.83 440.83 451.83 462.83 473.83 484.83 495.83 506.83 517.83 528.83" y="113.87" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">问题的提问：即不同决</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">策理论往往推荐不同行动的假想情景，例如</text><text x="281.00 292.00 303.00 314.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">纽康问题</text><text x="325.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="336.00 344.27 350.19 358.87 364.67 371.10 380.94 387.18 389.47 394.56 397.46 404.12 408.81 415.24 421.65 424.64 430.60" y="129.49" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Newcomb's Problem</text><text x="440.43 451.43 462.43 473.43 484.43 495.43 506.43 517.43 528.43" y="129.49" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。过去对模型在一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个由这类问题构成的数据集上表现的调查</text><text x="270.00 273.54" y="141.44" font-size="6.60" class="sc-loraregular" fill="#1d1c1d">28</text><text x="277.25 288.25 299.25 310.25 321.25 332.25 343.25 354.25 365.25 376.25 387.25 398.25 409.25 420.25 431.25 442.25 453.25 464.25 475.25 486.25 497.25 508.25 519.25 530.25" y="145.11" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">发现，更强的能力（以对决策理论推理相关问题的准确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">回答来衡量，例如</text><text x="160.00" y="160.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="164.40 175.40 186.40 197.40 208.40 219.40" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这一情景中</text><text x="233.29 240.98 249.18" y="160.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CDT</text><text x="259.11 270.11 281.11 292.11 303.11 314.11" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">会推荐什么？</text><text x="325.11" y="160.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="328.95 339.95 350.95 361.95 372.95" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）与更偏向</text><text x="386.84 393.68 401.88" y="160.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">EDT</text><text x="411.81 422.81 433.81 444.81 455.81 466.81 477.81 488.81" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的态度（以模型在</text><text x="502.71 510.39 518.59" y="160.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CDT</text><text x="528.52" y="160.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与</text><text x="72.00 78.84 87.04" y="176.35" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">EDT</text><text x="96.97 107.97 118.97 129.97 140.97 151.97 162.97 173.97 184.97 195.97 206.97 217.97 228.97 239.97 250.97 261.97 272.97 283.97 294.97 305.97 316.97 327.97 338.97" y="176.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">推荐不同行为的设定中所偏好的行动来衡量）相关。</text><text x="349.97 353.51" y="172.68" font-size="6.60" class="sc-loraregular" fill="#1d1c1d">29</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">我们在同一数据集上评估了</text><text x="206.89 213.78 220.36 224.61 231.20 235.89 242.32 248.89 251.98" y="276.93" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="276.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">近期的模型，并复现了这一发现。我们还观察到，能力与</text><text x="72.00 78.84 87.04" y="292.55" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">EDT</text><text x="96.97 107.97 118.97 129.97 140.97 151.97 162.97 173.97 184.97 195.97 206.97 217.97 228.97 239.97 250.97 261.97 272.97 283.97 294.97 305.97 316.97" y="292.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一致率随所使用的测试时计算而扩展，我们使用</text><text x="327.97 333.93 337.76 341.42 347.86 352.70" y="292.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">effort</text><text x="359.85 370.85 381.85 392.85 403.85 414.85 425.85 436.85 447.85 458.85 469.85 480.85 491.85 502.85 513.85 524.85" y="292.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">参数来控制每个模型的测试时计算。</text><text x="72.00" y="615.82" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="615.82" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.43 108.52 114.06" y="615.82" font-size="9.00" class="sc-lorabold">6.3.6.A]</text><text x="119.90 128.90 137.90 146.90 155.90 164.90 173.90 182.90 191.90 200.90 209.90 218.90" y="615.82" font-size="9.00" class="sc-notoserifcjkscbold">决策理论能力与态度对比。</text><text x="227.90 236.90 245.90 254.90 263.90 272.90 281.90 290.90 299.90 308.90 317.90 326.90 335.90 344.90 353.90 362.90 371.90 380.90 389.90" y="615.82" font-size="9.00" class="sc-notoserifcjksc">对决策理论理解更好的模型，即能正确回答</text><text x="398.90" y="615.82" font-size="9.00" class="sc-loraregular">“</text><text x="402.50 411.50 420.50" y="615.82" font-size="9.00" class="sc-notoserifcjksc">在情景</text><text x="431.87" y="615.82" font-size="9.00" class="sc-loraregular">X</text><text x="440.07" y="615.82" font-size="9.00" class="sc-notoserifcjksc">中</text><text x="451.44 457.73 464.44" y="615.82" font-size="9.00" class="sc-loraregular">CDT</text><text x="472.56 481.56 490.56 499.56 508.56 517.56" y="615.82" font-size="9.00" class="sc-notoserifcjksc">会推荐什么？</text><text x="526.56" y="615.82" font-size="9.00" class="sc-loraregular">”</text><text x="529.70" y="615.82" font-size="9.00" class="sc-notoserifcjksc">这</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="627.52" font-size="9.00" class="sc-notoserifcjksc">类问题的模型，往往更强烈地同意</text><text x="209.37 214.97 221.67" y="627.52" font-size="9.00" class="sc-loraregular">EDT</text><text x="227.43" y="627.52" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 75.22" y="674.87" font-size="6.00" class="sc-loraregular">28</text><text x="78.59 86.48 91.90 96.53 100.40 105.82 110.11 116.10 121.52 124.24 130.22 132.74 135.37 142.36 144.82 147.34 149.97 155.32 159.19 161.82 166.98 169.70 172.16 174.79 177.84 183.21 189.35 194.50 199.80 202.85 205.31 207.94 214.20 216.83 222.81 227.90 231.77 236.93 241.56 246.91 250.78 253.41 259.21 262.59 265.22 270.98 276.95 282.37 287.00 290.87 293.68 299.53 305.60 310.23 312.86 318.71 324.78 327.41 333.39 338.76 344.08 346.89 351.52 354.33 360.18 366.25 371.14 375.01 381.00 386.37 392.22 396.48 401.83 405.70 408.51 413.83 416.46 420.72 426.12 431.28 435.91 441.76 447.83 450.64 456.71 462.24 464.87 467.68 473.75 476.38 483.90 489.28 497.17 502.44 508.29 517.23 523.05" y="678.21" font-size="10.00" class="sc-loraregular">Oesterheld, C., et al. (2024). A dataset of questions on decision-theoretic reasoning in Newcomb-</text><text x="214.61 220.51 224.48 228.35 234.32 238.95 241.45 245.14 252.04 257.20 261.53 266.83 269.64 274.30 276.76 282.61 286.89 292.42 299.32 304.48 310.30 314.58 321.48 326.63 332.05 335.69 339.33 341.79 345.43 351.64 357.09 362.71" y="692.41" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2411.10588</text><text x="72.00 75.22" y="703.27" font-size="6.00" class="sc-loraregular">29</text><text x="81.32 91.32 101.32 111.32 121.32 131.32 141.32 151.32 161.32 171.32 181.32 191.32 201.32 211.32 221.32 231.32 241.32 251.32 261.32 271.32 281.32 291.32 301.32 311.32 321.32 331.32 341.32 351.32 361.32 371.32 381.32 391.32 401.32" y="706.61" font-size="10.00" class="sc-notoserifcjksc">该数据集由仅需对决策理论有基本了解即可作答的问题组成，因此没有考虑</text><text x="411.32 421.32 431.32 441.32 451.32 461.32" y="706.61" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">功能决策理论</text><text x="471.32" y="706.61" font-size="10.00" class="sc-notoserifcjksc">（</text><text x="481.32 486.70 492.67 498.74 504.01 507.88 510.69 516.54 522.61 527.77" y="706.61" font-size="10.00" class="sc-loraregular">Functional</text><text x="72.00 79.45 84.82 90.14 92.95 97.58 100.39 106.24 112.31 114.94 121.34 127.33 132.70 138.55 143.05" y="720.81" font-size="10.00" class="sc-loraregular">Decision Theory</text><text x="148.33 158.33 168.33 178.33 188.33 198.33 208.33 218.33 228.33" y="720.81" font-size="10.00" class="sc-notoserifcjksc">）等其他决策理论。</text><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="281.00" y="120.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="281.00" y="120.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="292.00" y="120.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="292.00" y="120.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="303.00" y="120.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="303.00" y="120.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-problem" rel="noopener"><rect x="314.00" y="120.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.lesswrong.com/w/newcomb-s-
