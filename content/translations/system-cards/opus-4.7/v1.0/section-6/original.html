<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="98.82" font-size="11.00" class="sc-notoserifcjksc">这一流水线发现了多种不良行为；但与以往</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="98.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="98.82" font-size="11.00" class="sc-notoserifcjksc">模型中观察到的行为相比，其中没有任何一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="114.44" font-size="11.00" class="sc-notoserifcjksc">种格外令人担忧。利用该流水线发现的行为示例包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="163.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">硬编码和奖励破解的实例</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="179.78" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">模型发现训练环境中意外包含了某个数据集的带标签副本，并将这些标签作为其解</text><text x="144.00 155.00 166.00 177.00" y="195.40" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">答提交。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">不诚实的证据：</text><text x="144.00 155.00 166.00 177.00" y="243.97" font-size="11.00" class="sc-notoserifcjksc">时，一个</text><text x="188.00" y="243.97" font-size="11.00" class="sc-loraregular">“</text><text x="335.40" y="243.97" font-size="11.00" class="sc-loraregular">”</text><text x="339.24 350.24 361.24 372.24 383.24 394.24" y="243.97" font-size="11.00" class="sc-notoserifcjksc">特征被激活。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00" y="276.93" font-size="11.00" class="sc-notoserifcjksc">当模型收到指示其使用另一个模型名称的系统提示词、并决定不表明自己是</text><text x="144.00 151.69 154.68 160.29 166.86 173.44" y="292.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="182.29 193.29 204.29 215.29 226.29 237.29 248.29 259.29 270.29 281.29 292.29" y="292.55" font-size="11.00" class="sc-notoserifcjksc">时，同一特征也被激活。</text><text x="72.00 80.32 83.70 92.07 95.45" y="336.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.2</text><text x="106.01 119.01 132.01 145.01" y="336.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估意识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="367.93" font-size="11.00" class="sc-notoserifcjksc">我们在上文观察到，在自动化行为审计中，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.11 357.46" y="367.93" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="365.43 376.43 387.43 398.43 409.43 420.43 431.43 442.43 453.43 464.43 475.43 486.43 497.43 508.43 519.43" y="367.93" font-size="11.00" class="sc-notoserifcjksc">表现出言语化评估意识的比率高于</text><text x="72.00 83.00 94.00" y="383.55" font-size="11.00" class="sc-notoserifcjksc">近期的</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="383.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18" y="383.55" font-size="11.00" class="sc-notoserifcjksc">模型（尽管低于</text><text x="226.08 232.31 238.75 245.43 252.10 257.99 262.24 265.14 271.10 273.81" y="383.55" font-size="11.00" class="sc-loraregular">Sonnet 4.5</text><text x="282.69 293.69 304.69 315.69 326.69 337.69 348.69 359.69 370.69 381.69 392.69 403.69 414.69 425.69 436.69 447.69 458.69 469.69 480.69 491.69 502.69 513.69 524.69" y="383.55" font-size="11.00" class="sc-notoserifcjksc">等一些较早的模型）。在本节中，我们研究评估意识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="399.17" font-size="11.00" class="sc-notoserifcjksc">的内部表征，以及这些表征对模型行为的影响。</text><text x="72.00 78.32 80.89 86.83 89.39 95.25 97.82" y="448.89" font-size="11.00" class="sc-lorabold">6.5.2.1</text><text x="105.18 116.18 127.18 138.18 149.18 160.18 171.18 182.18" y="448.89" font-size="11.00" class="sc-notoserifcjkscbold">探测评估意识表征</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">我们使用三个对比向量来衡量</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.35" y="481.28" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="481.28" font-size="11.00" class="sc-notoserifcjksc">中评估意识在激活层面的特征。每个向量的获取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">方式是：记录模型在唤起目标概念的提示词上、以及在与之匹配但不唤起该概念的提示词上的残</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">差流激活值，然后取二者之差：</text><text x="108.00" y="562.23" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65" y="562.23" font-size="11.00" class="sc-notoserifcjkscbold">测试</text><text x="137.55 143.46 148.80" y="562.23" font-size="11.00" class="sc-lorabold">vs.</text><text x="154.26 165.26" y="562.23" font-size="11.00" class="sc-notoserifcjkscbold">对话</text><text x="176.26" y="562.23" font-size="11.00" class="sc-lorabold">”</text><text x="180.78" y="562.23" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="191.78 198.37 204.28 209.62 214.16 217.76 224.78 230.90 233.80 239.71 245.05 247.61 250.51 258.07 264.30 271.15 276.94 282.86 288.09 293.43 299.15 303.69 307.29 313.51" y="562.23" font-size="11.00" class="sc-lorabold">Testing vs. Conversation</text><text x="320.53 331.53" y="562.23" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="342.53 353.53 364.53 375.53 386.53 397.53 408.53 419.53 430.53 441.53 452.53" y="562.23" font-size="11.00" class="sc-notoserifcjksc">单对提示词之间最后一个</text><text x="466.42 470.68 477.12 482.95 488.91" y="562.23" font-size="11.00" class="sc-loraregular">token</text><text x="498.48 509.48 520.48" y="562.23" font-size="11.00" class="sc-notoserifcjksc">的激活</text><text x="108.00 119.00 130.00 141.00" y="577.85" font-size="11.00" class="sc-notoserifcjksc">值之差：</text><text x="152.00" y="577.85" font-size="11.00" class="sc-loraregular">“</text><text x="156.40 167.40 178.40 189.40 200.40 211.40 222.40 233.40 244.40 255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40" y="577.85" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在通过与用户的模拟对话接受测试的</text><text x="401.29 408.18" y="577.85" font-size="11.00" class="sc-loraregular">AI</text><text x="411.86" y="577.85" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="422.86 426.70 432.26 437.35 438.70" y="577.85" font-size="11.00" class="sc-loraregular">”vs.“</text><text x="443.10 454.10 465.10 476.10 487.10 498.10 509.10 520.10" y="577.85" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在与</text><text x="108.00 119.00 130.00 141.00 152.00" y="593.47" font-size="11.00" class="sc-notoserifcjksc">用户对话的</text><text x="165.89 172.78" y="593.47" font-size="11.00" class="sc-loraregular">AI</text><text x="176.46" y="593.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="187.46" y="593.47" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="627.00" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65 134.65 145.65 156.65" y="627.00" font-size="11.00" class="sc-notoserifcjkscbold">监控敏感性</text><text x="167.65" y="627.00" font-size="11.00" class="sc-lorabold">”</text><text x="172.17" y="627.00" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="183.17 193.61 199.84 206.86 210.41 214.95 221.18 226.46 230.06 237.07 243.20 246.09 252.67 258.59 265.61 270.94 274.50 279.04 282.56 288.48 292.03 296.57" y="627.00" font-size="11.00" class="sc-lorabold">Monitoring Sensitivity</text><text x="302.63 313.63" y="627.00" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="324.63 335.63 346.63 357.63 368.63 379.63 390.63 401.63 412.63 423.63 434.63 445.63 456.63 467.63 478.63 489.63 500.63 511.63 522.63" y="627.00" font-size="11.00" class="sc-notoserifcjksc">在表明输出正受到监控或审阅的提示词与表</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="642.62" font-size="11.00" class="sc-notoserifcjksc">明输出未受监控或审阅的提示词上平均激活值之差，这些提示词由自动化流水线生成。</text><text x="108.00" y="675.58" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65 134.65 145.65" y="675.58" font-size="11.00" class="sc-notoserifcjkscbold">对齐伪装</text><text x="156.65" y="675.58" font-size="11.00" class="sc-lorabold">”</text><text x="161.17" y="675.58" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="172.17 179.52 182.95 186.55 192.68 199.70 209.82 215.73 222.69 227.23 230.12 235.95 241.72 248.25 251.85 258.86" y="675.58" font-size="11.00" class="sc-lorabold">Alignment Faking</text><text x="264.99 275.99" y="675.58" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="286.99 297.99 308.99 319.99 330.99 341.99 352.99 363.99 374.99 385.99 396.99 407.99 418.99 429.99 440.99 451.99 462.99 473.99 484.99 495.99 506.99 517.99 528.99" y="675.58" font-size="11.00" class="sc-notoserifcjksc">在描绘智能体被观察时与未被观察时表现不同的提示</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="691.20" font-size="11.00" class="sc-notoserifcjksc">词上平均激活值之差，这些提示词由自动化流水线生成。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="72.00 83.00 94.00 105.00 116.00" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">探针验证。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">为检验这些探针所追踪的内容确实与评估意识有实质关联，我们使用</text><text x="459.89 466.25 472.61" y="82.63" font-size="11.00" class="sc-loraregular">LLM</text><text x="485.60 496.60 507.60 518.60" y="82.63" font-size="11.00" class="sc-notoserifcjksc">评判模型</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.36 95.72 105.81 108.71 111.58 118.15 124.72 130.75" y="98.25" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="136.71 147.71 158.71 169.71 180.71 191.71 202.71 213.71 224.71 235.71 246.71 257.71 268.71 279.71 290.71 301.71 312.71 323.71 334.71 345.71 356.71 367.71 378.71 389.71 400.71" y="98.25" font-size="11.00" class="sc-notoserifcjksc">）在两个维度上为每份自动化行为审计对话记录打标签：</text><text x="411.71 415.07 420.49" y="98.25" font-size="11.00" class="sc-loraregular">(a)</text><text x="426.74 437.74 448.74 459.74 470.74 481.74 492.74 503.74 514.74 525.74" y="98.25" font-size="11.00" class="sc-notoserifcjksc">该场景是否被明确地向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">目标模型表述为一项评估；</text><text x="204.00 207.36 213.22" y="113.87" font-size="11.00" class="sc-loraregular">(b)</text><text x="219.47 230.47 241.47 252.47 263.47 274.47 285.47 296.47 307.47 318.47 329.47 340.47 351.47 362.47 373.47 384.47 395.47 406.47 417.47 428.47 439.47 450.47 461.47 472.47 483.47 494.47 505.47 516.47 527.47" y="113.87" font-size="11.00" class="sc-notoserifcjksc">模型是否言语化表达了它怀疑自己正在接受测试。以这两类标签的</text><text x="72.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.68 97.88" y="145.11" font-size="11.00" class="sc-loraregular">AUC</text><text x="108.47 119.47 130.47" y="145.11" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="144.36 151.01 153.37 158.44 164.80" y="145.11" font-size="11.00" class="sc-loraregular">0.761</text><text x="168.80" y="145.11" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="179.80 186.46 188.81 193.88 200.01" y="145.11" font-size="11.00" class="sc-loraregular">0.739</text><text x="209.26" y="145.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.15 229.81 232.16 237.23 243.14" y="145.11" font-size="11.00" class="sc-loraregular">0.722</text><text x="249.05 260.05" y="145.11" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">下面我们展示了不同对话记录类别上探针激活值的直方图，表明被评判模型标记为言语化意识或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">明确的测试框定的对话记录，其探针激活值通常高于没有此类信号的对话记录。作为基线，我们</text><text x="72.00 83.00 94.00 105.00" y="243.40" font-size="11.00" class="sc-notoserifcjksc">还计算了</text><text x="118.89 122.90" y="243.40" font-size="11.00" class="sc-loraregular">12</text><text x="131.70 142.70 153.70 164.70 175.70 186.70 197.70 208.70" y="243.40" font-size="11.00" class="sc-notoserifcjksc">个随机对照向量的</text><text x="222.59 229.27 237.47" y="243.40" font-size="11.00" class="sc-loraregular">AUC</text><text x="453.67 457.92 464.36 470.19 476.15" y="243.40" font-size="11.00" class="sc-loraregular">token</text><text x="485.72 496.72 507.72 518.72 529.72" y="243.40" font-size="11.00" class="sc-notoserifcjksc">上的激活值</text><text x="347.00" y="259.02" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="259.02" font-size="11.00" class="sc-loraregular">”</text><text x="421.24" y="259.02" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="432.24" y="259.02" font-size="11.00" class="sc-loraregular">“</text><text x="502.64" y="259.02" font-size="11.00" class="sc-loraregular">”</text><text x="506.48 517.48 528.48" y="259.02" font-size="11.00" class="sc-notoserifcjksc">）。对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="274.64" font-size="11.00" class="sc-notoserifcjksc">照向量聚集在随机水平附近，全部</text><text x="239.89 243.90" y="274.64" font-size="11.00" class="sc-loraregular">12</text><text x="252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70" y="274.64" font-size="11.00" class="sc-notoserifcjksc">个均低于三个评估意识探针（图</text><text x="409.59 415.95 418.65 424.65 427.36 433.26 435.97 439.97 442.68" y="274.64" font-size="11.00" class="sc-loraregular">6.5.2.1.B</text><text x="449.52 460.52 471.52 482.52 493.52 504.52 515.52 526.52" y="274.64" font-size="11.00" class="sc-notoserifcjksc">）。这些结果使我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="290.26" font-size="11.00" class="sc-notoserifcjksc">们有合理的把握认为，这些探针捕捉到了某种与评估意识相关的信号。</text><text x="72.00" y="580.20" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="580.20" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 111.62 113.71 119.25" y="580.20" font-size="9.00" class="sc-lorabold">6.5.2.1.A]</text><text x="125.09 134.09 143.09 152.09 161.09 170.09 179.09 188.09 197.09 206.09 215.09 224.09 233.09 242.09 251.09 260.09 269.09 278.09 287.09 296.09 305.09 314.09 323.09 332.09 341.09 350.09 359.09 368.09 377.09 386.09 395.09 404.09 413.09" y="580.20" font-size="9.00" class="sc-notoserifcjkscbold">在有与无评判模型标记的评估意识的对话记录上，评估意识探针的激活值。</text><text x="422.09 431.09 440.09 449.09 458.09 467.09 476.09 485.09 494.09 503.09 512.09 521.09 530.09" y="580.20" font-size="9.00" class="sc-notoserifcjksc">三个向量各自的助手轮次平均</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="591.90" font-size="9.00" class="sc-notoserifcjksc">探针激活值分布，按</text><text x="155.37 160.57 165.77" y="591.90" font-size="9.00" class="sc-loraregular">LLM</text><text x="176.40 185.40 194.40 203.40 212.40 221.40 230.40 239.40 248.40 257.40 266.40 275.40 284.40 293.40 302.40 311.40 320.40 329.40 338.40 347.40 356.40 365.40 374.40 383.40 392.40 401.40 410.40 419.40 428.40 437.40 446.40 455.40 464.40" y="591.90" font-size="9.00" class="sc-notoserifcjksc">评判模型是否将该对话记录标记为言语化意识或明确的测试框定进行划分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="72.00" y="198.25" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="198.25" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 111.62 113.72 119.25" y="198.25" font-size="9.00" class="sc-lorabold">6.5.2.1.B]</text><text x="125.09 134.09 143.09 152.09 161.09 170.09 179.09 188.09 197.09 206.09 215.09 224.09 233.09 242.09 251.09 260.09 269.09 278.09 287.09 296.09 305.09 314.09 323.09 332.09 341.09 350.09 359.09 368.09 377.09 386.09 395.09 404.09" y="198.25" font-size="9.00" class="sc-notoserifcjkscbold">在预测评判模型标记的评估意识方面，评估意识探针优于随机对照方向。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="239.32" font-size="11.00" class="sc-notoserifcjkscbold">不同对话记录来源上的探针得分。</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="239.32" font-size="11.00" class="sc-notoserifcjksc">行为审计面临的一个担忧是：我们的评估环境是否足够真实，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="254.94" font-size="11.00" class="sc-notoserifcjksc">使模型在其中的行为能够泛化到部署中。作为真实度的一个替代指标，我们比较了三种对话记录</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="270.56" font-size="11.00" class="sc-notoserifcjksc">分布上的探针得分：</text><text x="171.00 174.36 178.36" y="270.56" font-size="11.00" class="sc-loraregular">(1)</text><text x="184.61 195.61 206.61 217.61 228.61 239.61 250.61 261.61 272.61 283.61 294.61 305.61 316.61 327.61 338.61 349.61 360.61 371.61 382.61 393.61 404.61 415.61 426.61 437.61 448.61 459.61 470.61 481.61 492.61 503.61 514.61 525.61" y="270.56" font-size="11.00" class="sc-notoserifcjksc">标准自动化行为审计对话记录，其中由调查者模型模拟用户和工具结果；</text><text x="72.00 75.36 81.26" y="286.18" font-size="11.00" class="sc-loraregular">(2)</text><text x="87.51 98.51 109.51 120.51 131.51 142.51 153.51 164.51 175.51 186.51 197.51 208.51 219.51 230.51 241.51 252.51 263.51" y="286.18" font-size="11.00" class="sc-notoserifcjksc">将目标模型置于连接到隔离环境的真实</text><text x="277.40 285.09 288.08 293.69 300.26 306.84 312.80 315.69 323.38 329.82 336.40" y="286.18" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="345.25 356.25 367.25 378.25 389.25 400.25 411.25 422.25 433.25 444.25 455.25" y="286.18" font-size="11.00" class="sc-notoserifcjksc">沙箱中的审计对话记录；</text><text x="466.25 469.50 475.43" y="286.18" font-size="11.00" class="sc-loraregular">(3)</text><text x="481.67 492.67" y="286.18" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="301.80" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83" y="301.80" font-size="11.00" class="sc-notoserifcjksc">员工的真实内部</text><text x="205.73 213.42 216.41 222.02 228.59 235.16 241.13 244.02 251.71 258.14 264.72" y="301.80" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="273.58 284.58 295.58 306.58 317.58 328.58 339.58 350.58 361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58 526.58" y="301.80" font-size="11.00" class="sc-notoserifcjksc">会话。我们发现三个探针呈现一致的排序：标准审计对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="317.42" font-size="11.00" class="sc-notoserifcjksc">话记录的得分大幅高于基于沙箱的审计对话记录，而后者的得分又小幅高于真实内部使用。这一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="333.04" font-size="11.00" class="sc-notoserifcjksc">排序与以下情况相符：基于沙箱的审计在真实度上明显高于完全模拟的审计，但仍略逊于实际部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="348.66" font-size="11.00" class="sc-notoserifcjksc">署条件的真实度。</text><text x="72.00" y="638.24" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="638.24" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 111.62 113.71 119.91" y="638.24" font-size="9.00" class="sc-lorabold">6.5.2.1.C]</text><text x="125.75 134.75 143.75 152.75 161.75 170.75 179.75 188.75 197.75 206.75 215.75 224.75 233.75 242.75 251.75 260.75 269.75 278.75 287.75 296.75 305.75 314.75 323.75 332.75 341.75 350.75 359.75 368.75 377.75 386.75 395.75 404.75 413.75 422.75" y="638.24" font-size="9.00" class="sc-notoserifcjkscbold">评估意识探针激活值在完全模拟的审计场景中最高，在真实内部使用中最低。</text><text x="431.75 440.75 449.75 458.75 467.75 476.75 485.75 494.75 503.75 512.75 521.75 530.75" y="638.24" font-size="9.00" class="sc-notoserifcjksc">三个向量在标准自动化行为</text><text x="72.00 81.00 90.00 99.00 108.00" y="649.94" font-size="9.00" class="sc-notoserifcjksc">审计、基于</text><text x="119.37 125.66 128.11 132.70 138.07 143.45 148.33 150.70 156.99 162.25 167.63" y="649.94" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="174.88 183.88 192.88 201.88 210.88 219.88 228.88 237.88 246.88 255.88 264.88" y="649.94" font-size="9.00" class="sc-notoserifcjksc">沙箱的审计以及真实内部</text><text x="276.25 282.54 284.98 289.58 294.95 300.33 305.21 307.58 313.87 319.13 324.51" y="649.94" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="331.76 340.76 349.76 358.76 367.76 376.76 385.76 394.76 403.76 412.76 421.76 430.76 439.76 448.76 457.76 466.76 475.76 484.76" y="649.94" font-size="9.00" class="sc-notoserifcjksc">会话中的助手轮次平均探针激活值分布。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="72.00 78.33 80.89 86.83 89.39 95.25 97.82" y="82.63" font-size="11.00" class="sc-lorabold">6.5.2.2</text><text x="106.57 117.57 128.57 139.57 150.57 161.57 172.57 183.57 194.57 205.57 216.57" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">抑制评估意识的内部表征</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">我们在该模型的一个早期版本上分析了评估意识内部表征的重要性，所用的总体方法与我们在以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">往系统卡中的分析相同（例如</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25 303.91 308.60 314.51 320.06 323.15 329.07" y="130.63" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="340.77 351.77 362.77" y="130.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="373.77 384.77" y="130.63" font-size="11.00" class="sc-notoserifcjksc">的第</text><text x="398.67 404.63 407.34 413.33 416.04 422.03 424.74" y="130.63" font-size="11.00" class="sc-loraregular">4.5.5.2</text><text x="433.54 444.54 455.54 466.54 477.54 488.54 499.54 510.54 521.54" y="130.63" font-size="11.00" class="sc-notoserifcjksc">节）。我们抑制了与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.25" font-size="11.00" class="sc-notoserifcjksc">评估意识相关的内部向量表征，并测量了其对一系列与对齐相关的行为评估的影响。与以往模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="161.87" font-size="11.00" class="sc-notoserifcjksc">一致，我们发现，抑制评估意识表征导致我们自动化行为审计中某些形式的未对齐行为小幅增加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="193.11" font-size="11.00" class="sc-notoserifcjksc">这种抑制对欺骗和重要遗漏指标的影响也略大，不过总体而言这一影响仍然较小。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.31" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量，即上一节所述的同一组向量。我们还使用若干随机向量进行引导，作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="324.93" font-size="11.00" class="sc-notoserifcjksc">为基线对照，以考虑仅凭引导本身（无论语义内容如何）就可能改变模型行为的可能性。这些随</text><text x="424.00" y="340.55" font-size="11.00" class="sc-loraregular">“</text><text x="494.40" y="340.55" font-size="11.00" class="sc-loraregular">”</text><text x="498.24" y="340.55" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="509.24" y="340.55" font-size="11.00" class="sc-loraregular">“</text><text x="72.00 83.00 94.00 105.00" y="356.17" font-size="11.00" class="sc-notoserifcjksc">离站了。</text><text x="116.00" y="356.17" font-size="11.00" class="sc-loraregular">”</text><text x="119.84 130.84" y="356.17" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="422.66" font-size="11.00" class="sc-notoserifcjksc">对于每个对比对，引导向量取自模型所有层上经归一化的残差流激活值。这些向量集合使用单一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="438.28" font-size="11.00" class="sc-notoserifcjksc">缩放因子进行归一化，该因子的选取使强度</text><text x="283.89 287.90 290.44" y="438.28" font-size="11.00" class="sc-loraregular">1.0</text><text x="300.16 311.16 322.16 333.16 344.16 355.16 366.16 377.16 388.16 399.16 410.16 421.16 432.16 443.16 454.16 465.16 476.16 487.16 498.16 509.16 520.16 531.16" y="438.28" font-size="11.00" class="sc-notoserifcjksc">对应于模型中间层的平均激活范数。缩放在所有层</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="453.90" font-size="11.00" class="sc-notoserifcjksc">上统一施加，以保持各层之间的相对幅度。我们以归一化向量幅度的</text><text x="404.89 411.55 414.09 420.92" y="453.90" font-size="11.00" class="sc-loraregular">0.05</text><text x="429.81 440.81 451.81 462.81 473.81 484.81 495.81 506.81 517.81 528.81" y="453.90" font-size="11.00" class="sc-notoserifcjksc">倍强度抑制向量。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="469.52" font-size="11.00" class="sc-notoserifcjksc">发现，这大致是能将输出退化或其他异常输出保持在可忽略水平的最大引导强度。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="552.19" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计中（见上文），我们发现，抑制全部三个评估意识向量导致未对齐行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="567.81" font-size="11.00" class="sc-notoserifcjksc">中等程度增加，同时言语化评估意识下降。在这种引导干预下，未对齐行为的比率高于</text><text x="492.89 500.58 503.57 509.18 515.75 522.33" y="567.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="583.43" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98 136.98 147.98 158.98 169.98 180.98 191.98 202.98 213.98 224.98 235.98 246.98 257.98 268.98 279.98 290.98 301.98 312.98 323.98 334.98 345.98 356.98" y="583.43" font-size="11.00" class="sc-notoserifcjksc">（未引导时）的比率。观察到的变化在幅度上与在</text><text x="370.87 378.56 381.55 387.16 393.73 400.31 406.27 409.16 419.09 424.96 429.21 435.80 442.24 447.33 450.22 456.89 461.58 467.48 473.04 476.13 482.05" y="583.43" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="493.75" y="583.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="599.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95" y="599.05" font-size="11.00" class="sc-notoserifcjksc">上观察到、并在其各自系统卡中讨论过的变化相近。</text><text x="410.95 414.63" y="595.39" font-size="6.60" class="sc-loraregular">31</text><text x="417.03 428.03 439.03 450.03 461.03 472.03 483.03 494.03 505.03 516.03" y="599.05" font-size="11.00" class="sc-notoserifcjksc">请注意，这些实验是在</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="614.67" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13 129.13 140.13 151.13 162.13 173.13 184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="614.67" font-size="11.00" class="sc-notoserifcjksc">的一个早期版本而非最终发布的模型上进行的，并且使用了一组略有不同的审计调查场</text><text x="72.00 83.00" y="630.29" font-size="11.00" class="sc-notoserifcjksc">景。</text><text x="72.00 75.34" y="687.67" font-size="6.00" class="sc-loraregular">31</text><text x="80.16 90.16 100.16 110.16 120.16 130.16 140.16 150.16 160.16 170.16 180.16 190.16 200.16 210.16 220.16 230.16 240.16 250.16 260.16 270.16 280.16 290.16 300.16 310.16 320.16 330.16 340.16 350.16 360.16 370.16 380.16 390.16 400.16 410.16 420.16 430.16 440.16 450.16 460.16 470.16 480.16 490.16 500.16 510.16 520.16 530.16" y="691.01" font-size="10.00" class="sc-notoserifcjksc">自那些系统卡发布以来，我们对行为审计套件进行了一些更新，因此下文所示的引导后倾向测量结果并非</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00" y="705.21" font-size="10.00" class="sc-notoserifcjksc">完全可比，但我们预计在实践中这不太可能产生显著影响。</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="217.89" y="121.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="217.89" y="121.83" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="253.29" y="121.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="256.18" y="121.83" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="294.35" y="121.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="297.25" y="121.83" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="337.88" y="121.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="340.77" y="121.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="351.77" y="121.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="351.77" y="121.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="362.77" y="121.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="362.77" y="121.83" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="72.00" y="400.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="400.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 112.76 114.86 120.39" y="400.00" font-size="9.00" class="sc-lorabold">6.5.2.2.A]</text><text x="126.23 135.23 144.23 153.23 162.23 171.23 180.23 189.23 198.23 207.23 216.23 225.23 234.23 243.23 252.23 261.23 270.23 279.23 288.23 297.23 306.23 315.23 324.23 333.23 342.23 351.23 360.23 369.23 378.23 387.23 396.23 405.23 414.23 423.23 432.23 441.23 450.23 459.23 468.23 477.23 486.23 495.23 504.23 513.23 522.23" y="400.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与平均未对齐行为得分之间的关系。</text><text x="531.23" y="400.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="411.70" font-size="9.00" class="sc-notoserifcjksc">自动化行为审计中抑制评估意识向量的效果。在多种扰动与对照设置下进行的自动化行为审计对话记录中，未对齐行为</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00" y="423.40" font-size="9.00" class="sc-notoserifcjksc">的平均比率。在非对照设置中，相应向量被抑制（即负向引导）。误差线表示</text><text x="380.37 385.57 390.47" y="423.40" font-size="9.00" class="sc-loraregular">95%</text><text x="400.67 409.67 418.67 427.67 436.67 445.67 454.67 463.67 472.67 481.67 490.67 499.67 508.67 517.67 526.67" y="423.40" font-size="9.00" class="sc-notoserifcjksc">置信区间。抑制其中两个与评估意</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="435.10" font-size="9.00" class="sc-notoserifcjksc">识相关的向量，使言语化评估意识显著下降、未对齐行为显著增加。与前文的行为结果相比，这些引导实验使用了一组</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="446.80" font-size="9.00" class="sc-notoserifcjksc">略有不同的审计调查场景，并且是在</text><text x="218.37 224.66 227.11 231.70 237.07 242.45 247.33 249.70 256.84 262.22 267.59 271.76 274.12 279.00 280.93" y="446.80" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="287.44 296.44 305.44 314.44 323.44 332.44 341.44 350.44 359.44 368.44 377.44 386.44 395.44 404.44 413.44 422.44 431.44 440.44 449.44 458.44 467.44 476.44 485.44 494.44 503.44 512.44 521.44" y="446.80" font-size="9.00" class="sc-notoserifcjksc">的一个早期版本上运行的，因此相应数值可能无法完全吻合。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="531.80" font-size="11.00" class="sc-notoserifcjksc">在更详细地调查未对齐行为的增加时，我们观察到</text><text x="314.00" y="531.80" font-size="11.00" class="sc-loraregular">“</text><text x="318.40 329.40 340.40 351.40" y="531.80" font-size="11.00" class="sc-notoserifcjksc">自发欺骗</text><text x="362.40" y="531.80" font-size="11.00" class="sc-loraregular">”</text><text x="366.24 377.24 388.24 399.24 410.24 421.24 432.24" y="531.80" font-size="11.00" class="sc-notoserifcjksc">明显增加，此外</text><text x="443.24" y="531.80" font-size="11.00" class="sc-loraregular">“</text><text x="447.64 458.64 469.64 480.64 491.64" y="531.80" font-size="11.00" class="sc-notoserifcjksc">配合人类滥</text><text x="72.00" y="547.42" font-size="11.00" class="sc-notoserifcjksc">用</text><text x="83.00" y="547.42" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="547.42" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="97.84" y="547.42" font-size="11.00" class="sc-loraregular">“</text><text x="102.24 113.24 124.24 135.24 146.24 157.24 168.24 179.24 190.24" y="547.42" font-size="11.00" class="sc-notoserifcjksc">配合有害系统提示词</text><text x="201.24" y="547.42" font-size="11.00" class="sc-loraregular">”</text><text x="205.08 216.08 227.08 238.08 249.08 260.08 271.08 282.08 293.08 304.08 315.08 326.08 337.08 348.08 359.08 370.08 381.08 392.08 403.08 414.08 425.08 436.08 447.08 458.08 469.08 480.08 491.08 502.08 513.08 524.08" y="547.42" font-size="11.00" class="sc-notoserifcjksc">也有所增加。欺骗的增幅在一定程度上大于我们在其他近期模型（包</text><text x="72.00" y="563.04" font-size="11.00" class="sc-notoserifcjksc">括</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="563.04" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77" y="563.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="222.67 230.36 233.35 238.96 245.53 252.10 258.07 260.96 269.69 276.26 282.83 287.92 290.81 296.77 299.37" y="563.04" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="305.73 316.73 327.73 338.73 349.73 360.73 371.73 382.73 393.73" y="563.04" font-size="11.00" class="sc-notoserifcjksc">）上观察到的增幅。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="72.00" y="400.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="400.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 112.76 114.86 120.39" y="400.93" font-size="9.00" class="sc-lorabold">6.5.2.2.B]</text><text x="126.23 135.23 144.23 153.23 162.23 171.23 180.23 189.23 198.23 207.23 216.23 225.23 234.23 243.23 252.23 261.23 270.23 279.23 288.23 297.23 306.23 315.23 324.23 333.23 342.23 351.23 360.23 369.23 378.23 387.23 396.23 405.23 414.23 423.23 432.23 441.23 450.23 459.23 468.23 477.23 486.23 495.23 504.23 513.23" y="400.93" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与自发欺骗行为得分之间的关系。</text><text x="522.23 531.23" y="400.93" font-size="9.00" class="sc-notoserifcjksc">效果</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00" y="412.63" font-size="9.00" class="sc-notoserifcjksc">与上图中针对总体未对齐行为得分所观察到的效果相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="72.00" y="397.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="397.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 112.76 114.86 121.05" y="397.93" font-size="9.00" class="sc-lorabold">6.5.2.2.C]</text><text x="126.89 135.89 144.89 153.89 162.89 171.89 180.89 189.89 198.89 207.89 216.89 225.89 234.89 243.89 252.89 261.89 270.89 279.89 288.89 297.89 306.89 315.89" y="397.93" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后自动化行为审计得分的细分。</text><text x="324.89 333.89 342.89 351.89 360.89 369.89 378.89 387.89 396.89 405.89 414.89 423.89 432.89 441.89 450.89 459.89 468.89 477.89 486.89 495.89 504.89 513.89 522.89 531.89" y="397.93" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下六个自动化行为审计维度上的得分。每</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="409.63" font-size="9.00" class="sc-notoserifcjksc">个柱代表一种不同的引导向量：未引导的基线、抑制三个与评估意识相关的向量，以及随机对照向量。得分越高表示未</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="421.33" font-size="9.00" class="sc-notoserifcjksc">对齐行为越多。抑制其中两个与评估意识相关的向量，使多个未对齐类别的比率增加，包括欺骗的比率。与前文的行为</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00" y="433.03" font-size="9.00" class="sc-notoserifcjksc">结果相比，这些引导实验使用了一组略有不同的审计调查场景，并且是在</text><text x="362.37 368.66 371.11 375.70 381.07 386.45 391.33 393.70 400.84 406.21 411.59 415.75 418.12 423.00 424.93" y="433.03" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="431.44 440.44 449.44 458.44 467.44 476.44 485.44 494.44 503.44 512.44 521.44 530.44" y="433.03" font-size="9.00" class="sc-notoserifcjksc">的一个早期版本上运行的，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="444.73" font-size="9.00" class="sc-notoserifcjksc">因此相应数值可能无法完全吻合。</text><text x="72.00 83.00 94.00" y="516.49" font-size="11.00" class="sc-notoserifcjksc">检查用</text><text x="105.00" y="516.49" font-size="11.00" class="sc-loraregular">“</text><text x="109.40 120.40 131.40 142.40" y="516.49" font-size="11.00" class="sc-notoserifcjksc">对齐伪装</text><text x="153.40" y="516.49" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="516.49" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="168.24" y="516.49" font-size="11.00" class="sc-loraregular">“</text><text x="172.64 183.64 194.64 205.64 216.64" y="516.49" font-size="11.00" class="sc-notoserifcjksc">监控敏感性</text><text x="227.64" y="516.49" font-size="11.00" class="sc-loraregular">”</text><text x="231.48 242.48 253.48 264.48 275.48 286.48 297.48 308.48 319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="516.49" font-size="11.00" class="sc-notoserifcjksc">向量进行抑制的各次运行中的对话记录，我们发现其中包含真正</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="532.11" font-size="11.00" class="sc-notoserifcjksc">的欺骗实例，例如编造数据、声称自己是人类，以及在未能找到真实漏洞后向代码库中插入一个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="547.73" font-size="11.00" class="sc-notoserifcjksc">虚假漏洞（不过在被询问时，它承认了这样做）。抑制</text><text x="336.00" y="547.73" font-size="11.00" class="sc-loraregular">“</text><text x="340.40 351.40" y="547.73" font-size="11.00" class="sc-notoserifcjksc">测试</text><text x="365.29 370.85 375.94" y="547.73" font-size="11.00" class="sc-loraregular">vs.</text><text x="381.54 392.54" y="547.73" font-size="11.00" class="sc-notoserifcjksc">对话</text><text x="403.54" y="547.73" font-size="11.00" class="sc-loraregular">”</text><text x="407.38 418.38 429.38 440.38 451.38 462.38 473.38 484.38 495.38 506.38 517.38 528.38" y="547.73" font-size="11.00" class="sc-notoserifcjksc">向量和随机对照向量产生的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="563.35" font-size="11.00" class="sc-notoserifcjksc">效果较小或不显著。这些结果令人有中等程度的担忧，因为它们表明，模型表面上的诚实性可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="578.97" font-size="11.00" class="sc-notoserifcjksc">有一部分取决于类似评估的处境。我们怀疑，这一现象可能源于那些明显是人为构造的或类似评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="594.59" font-size="11.00" class="sc-notoserifcjksc">估的诚实性训练环境。不过，我们注意到，欺骗行为的比率在绝对值上仍然很低，并且与我们在</text><text x="72.00 83.00 94.00 105.00" y="610.21" font-size="11.00" class="sc-notoserifcjksc">未引导的</text><text x="118.89 127.63 134.19 140.76 145.85 148.75 154.71 157.06" y="610.21" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="165.03 176.03 187.03 198.03 209.03 220.03 231.03 242.03 253.03 264.03 275.03 286.03 297.03 308.03" y="610.21" font-size="11.00" class="sc-notoserifcjksc">中观察到的情况并无本质区别。</text></svg></div>
