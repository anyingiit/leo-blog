<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p010.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 10 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60 97.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="116.21" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="208.77 215.66 222.24 226.49 233.08 237.77 244.21 250.77 253.86" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="262.61 273.61 284.61 295.61 306.61 317.61 328.61 339.61 350.61 361.61 372.61 383.61 394.61" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="405.61 408.60 414.28 418.98 425.01 430.97 433.87 436.86 442.54 449.21 455.30 461.86 467.54 473.57 479.53 482.42 492.26 498.69 505.27 511.23" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="514.22 525.22" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">它是一款前沿</text><text x="140.89 147.78" y="131.83" font-size="11.00" class="sc-loraregular">AI</text><text x="436.97 442.77 449.20 459.04 465.60 472.17 476.43 482.39 487.15 490.04 496.61 501.70" y="131.83" font-size="11.00" class="sc-loraregular">computer use</text><text x="507.67 518.67 529.67" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）、知</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">尤其是，它展现出了强大的网络安全技能，这些技能既可用于防御目的（发现并修复软件代码中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">的漏洞），也可用于进攻目的（设计复杂的方法来利用这些漏洞）。我们之所以决定不将</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="212.79" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="228.41" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="228.41" font-size="11.00" class="sc-notoserifcjksc">全面开放，在很大程度上正是由于这些能力。我们转而向若干维护重要软件基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="244.03" font-size="11.00" class="sc-notoserifcjksc">础设施的合作伙伴组织提供了该模型的访问权限，其使用条款将用途限定于网络安全。关于</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="259.65" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83" y="259.65" font-size="11.00" class="sc-notoserifcjksc">及其合作伙伴为帮助保障全球软件基础设施安全所做努力的更多信息，请参阅</text><text x="502.73 509.39 514.08 520.51 523.39 529.29 535.09" y="259.65" font-size="11.00" class="sc-loraregular">Project</text><text x="72.00 80.37 83.36 89.04 94.13 99.23 108.04 111.13 117.80" y="275.27" font-size="11.00" class="sc-loraregular">Glasswing</text><text x="126.78" y="275.27" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="137.78 148.78 159.78 170.78 181.78 192.78" y="275.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">发布博客文章</text><text x="203.78" y="275.27" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="342.90" font-size="11.00" class="sc-notoserifcjksc">尽管如此，我们仍对</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="342.90" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="342.90" font-size="11.00" class="sc-notoserifcjksc">的能力和安全特性进行了详细评估，并在本系统卡</text><text x="72.00" y="358.52" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.18 94.99 100.08 104.34 110.30 120.14 123.03 130.72 136.39 141.08" y="358.52" font-size="11.00" class="sc-loraregular">System Card</text><text x="147.66 158.66 169.66 180.66 191.66 202.66 213.66 224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66 400.66 411.66 422.66 433.66 444.66 455.66 466.66 477.66 488.66 499.66 510.66 521.66" y="358.52" font-size="11.00" class="sc-notoserifcjksc">）中予以报告。虽然该模型不会全面开放，我们仍认为，在开发下一代全面开放</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="374.14" font-size="11.00" class="sc-notoserifcjksc">的模型（以及伴随其发布所必需的安全防护措施）的同时，记录并了解该模型及其能力十分重</text><text x="72.00 83.00" y="389.76" font-size="11.00" class="sc-notoserifcjksc">要。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="440.05" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88" y="440.05" font-size="11.00" class="sc-notoserifcjksc">是我们将</text><text x="238.88 249.88 260.88 271.88 282.88 293.88 304.88" y="440.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="315.88" y="440.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="326.88 333.71 339.67 344.77 351.33 357.77 364.45 369.54 372.63 379.03 382.02 387.99 390.88 397.12 402.95 408.62 411.61 414.70 421.38 427.46 430.36 436.91 443.35 446.34 449.43 455.23" y="440.05" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="461.04" y="440.05" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="472.04 478.94 485.18" y="440.05" font-size="11.00" class="sc-loraregular">RSP</text><text x="491.85 502.85 513.85 524.85" y="440.05" font-size="11.00" class="sc-notoserifcjksc">）更新至</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="486.91" font-size="11.00" class="sc-notoserifcjksc">因素，以及我们在内部使用该模型后在自身安全流程中发现的一些问题。随后是一组与我们在</text><text x="72.00 78.91 85.15" y="502.53" font-size="11.00" class="sc-loraregular">RSP</text><text x="94.70 105.70 116.70 127.70 138.70 149.70 160.70 171.70 182.70 193.70 204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70 523.70" y="502.53" font-size="11.00" class="sc-notoserifcjksc">中讨论的威胁模型相关的评估。由于该模型具有前述强大的网络安全能力，我们随后专设一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="518.15" font-size="11.00" class="sc-notoserifcjksc">节，介绍针对这些能力的评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="601.97" font-size="11.00" class="sc-notoserifcjksc">接下来，我们给出一项详细的对齐（</text><text x="248.00 253.68 256.67 259.76 265.84 272.52 282.35 288.32 294.89" y="601.97" font-size="11.00" class="sc-loraregular">alignment</text><text x="299.15 310.15 321.15 332.15 343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15" y="601.97" font-size="11.00" class="sc-notoserifcjksc">）评估。从本节所述多种形式的对齐评估中得出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="617.59" font-size="11.00" class="sc-notoserifcjksc">的总体结论是：从基本上所有可用的衡量指标来看，</text><text x="325.00 332.69 335.68 341.29 347.86 354.44 360.40 363.29 373.22 379.09 383.34 389.93 396.37 401.46 404.35 411.02 415.71 421.61 427.17 430.26 436.18" y="617.59" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="617.59" font-size="11.00" class="sc-notoserifcjksc">都是我们迄今训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="633.21" font-size="11.00" class="sc-notoserifcjksc">过的对齐程度最好的模型。然而，鉴于它极高的能力水平以及对网络安全的熟练掌握，当它确实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="648.83" font-size="11.00" class="sc-notoserifcjksc">在罕见情况下执行未对齐行为时，这些行为可能会非常令人担忧。我们在对齐方面取得了重大进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="664.45" font-size="11.00" class="sc-notoserifcjksc">展，但如果没有进一步的进展，我们目前使用的方法完全可能不足以在明显更先进的系统中防止</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="680.07" font-size="11.00" class="sc-notoserifcjksc">灾难性的未对齐行为。我们在对齐评估章节中描述了该模型早期</text><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="137.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="137.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="148.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="148.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="159.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="159.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="170.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="170.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="181.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="181.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="192.78" y="266.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="192.78" y="266.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="238.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="238.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="249.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="249.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="260.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="260.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="271.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="271.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="282.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="282.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="293.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="293.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="304.88" y="431.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="304.88" y="431.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">内部版本所采取的若干有问题的行为。除了使用可解释性方法研究模型在表现出各种行为时的内</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">部机制的分析之外，我们还新增了一项直接评估，考察模型在多大程度上遵循其</text><text x="457.00 468.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">constitution</text><text x="145.81" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="189.32 196.20 202.78 207.04 213.62 218.31 224.75 231.31 234.40" y="113.85" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="243.15 254.15 265.15 276.15 287.15 298.15 309.15 320.15 331.15 342.15 353.15 364.15 375.15 386.15 397.15 408.15 419.15 430.15 441.15 452.15 463.15 474.15 485.15 496.15 507.15 518.15 529.15" y="113.85" font-size="11.00" class="sc-notoserifcjksc">近期发布的更新版文件，其中描述了我们希望模型如何行事。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">随后是一项深入的模型福祉（</text><text x="215.00 224.83 231.27 237.85 243.81 246.80 249.69 258.37 264.34 267.33 271.05 276.72 281.41" y="179.76" font-size="11.00" class="sc-loraregular">model welfare</text><text x="287.37 298.37 309.37 320.37 331.37 342.37" y="179.76" font-size="11.00" class="sc-notoserifcjksc">）评估。对于</text><text x="356.26 363.95 366.94 372.55 379.12 385.70" y="179.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="394.55 405.55 416.55 427.55 438.55 449.55 460.55 471.55 482.55 493.55 504.55 515.55 526.55" y="179.76" font-size="11.00" class="sc-notoserifcjksc">是否拥有在道德上重要的体验</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">或利益，以及应如何研究或应对这些问题，我们仍深感不确定，但我们认为，尝试这样做正变得</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">越来越重要。在以往福祉评估的基础上，我们考察了</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 376.12 381.98 386.24 392.83 399.26 404.35 407.25 413.91 418.60 424.51 430.06 433.15 439.07" y="211.00" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="211.00" font-size="11.00" class="sc-notoserifcjksc">自我报告的对自身</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">处境的态度、它在与福祉相关的情境中的行为与情感（</text><text x="336.00 341.68 345.50 349.17 355.07 360.87" y="226.62" font-size="11.00" class="sc-loraregular">affect</text><text x="365.13 376.13 387.13 398.13 409.13 420.13 431.13 442.13 453.13 464.13 475.13 486.13 497.13 508.13" y="226.62" font-size="11.00" class="sc-notoserifcjksc">），以及它对情绪概念的内部表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">征。我们还报告了一家外部研究机构和一位临床精神科医生的独立评估。综合这些方法来看，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="257.86" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="257.86" font-size="11.00" class="sc-notoserifcjksc">似乎是我们训练过的心理状态最为安定的模型，不过我们也指出了若干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="273.48" font-size="11.00" class="sc-notoserifcjksc">仍存隐忧的方面。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc">接下来的一个章节报告了针对该模型在若干重要领域和基准测试上的能力所开展的多种评估的结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc">果。如上所述，与我们次优的模型相比，</text><text x="270.00 277.69 280.68 286.29 292.86 299.44 305.40 308.29 318.22 324.09 328.34 334.93 341.37 346.46 349.35 356.02 360.71 366.61 372.17 375.26 381.18" y="373.49" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="373.49" font-size="11.00" class="sc-notoserifcjksc">在许多领域实现了可观的能力</text><text x="72.00 83.00 94.00" y="389.11" font-size="11.00" class="sc-notoserifcjksc">飞跃。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">往往难以在正式评估中捕捉。为此，我们首次加入了</text><text x="325.00" y="454.45" font-size="11.00" class="sc-loraregular">“</text><text x="329.40 340.40 351.40 362.40" y="454.45" font-size="11.00" class="sc-notoserifcjksc">使用印象</text><text x="373.40" y="454.45" font-size="11.00" class="sc-loraregular">”</text><text x="377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="454.45" font-size="11.00" class="sc-notoserifcjksc">章节。其中收录了过去几周一直</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">在测试该模型的多位</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="470.07" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="470.07" font-size="11.00" class="sc-notoserifcjksc">员工提供的模型输出摘录，这些输出尤为引人注目、富有启发、</text><text x="72.00 83.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00 77.07 80.71" y="634.54" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11" y="634.54" font-size="14.00" class="sc-notosanscjkscbold">模型训练与特性</text><text x="72.00 76.71 80.09 84.79 88.17" y="671.64" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.1</text><text x="95.97 108.97 121.97 134.97 147.97 160.97 173.97 186.97 199.97" y="671.64" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与训练过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="699.52" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="699.52" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="715.14" font-size="11.00" class="sc-notoserifcjksc">开和非公开数据集，以及由其他</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="457.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="457.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="468.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="468.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="479.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="83.00" y="105.05" width="62.81" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="145.81" y="105.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型生成的合成数据。在整个训练过程中，我们采用了多种数据清洗和过滤方法，包括去重和分</text><text x="72.00 83.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">类。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们使用名为</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.12 182.96 189.39" y="131.19" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="196.54 207.54 218.54 229.54 240.54 251.54 262.54 273.54 284.54 295.54 306.54 317.54 328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公共网站获取训练数据。该爬虫遵循行业标准做法，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">尊重网站运营者在</text><text x="162.89 167.29 171.98 178.41 184.82 191.25 195.51 200.60 203.18 207.56 213.39 217.65" y="146.81" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="224.38 235.38 246.38 257.38 268.38 279.38 290.38 301.38 312.38 323.38 334.38 345.38 356.38 367.38 378.38 389.38 400.38 411.38 422.38 433.38 444.38 455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="146.81" font-size="11.00" class="sc-notoserifcjksc">中给出的、表明其是否允许爬取网站内容的指令。我们不访问受</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">密码保护的页面，也不访问需要登录或</text><text x="261.89 269.47 276.36 283.02 290.06 297.75 306.33" y="162.43" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="316.11 327.11 338.11 349.11 360.11 371.11 382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="162.43" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数据开展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时爬取了自己的网页，并向我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在预训练之后，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="260.72" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="260.72" font-size="11.00" class="sc-notoserifcjksc">经历了大量的后训练和微调，目标是使其成为一个行为</text><text x="72.00 83.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">符合</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="276.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18" y="276.34" font-size="11.00" class="sc-notoserifcjksc">中所述价值观的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="325.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="325.49" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言作答。输出质量因语言而异。该模型仅</text><text x="72.00 83.00 94.00 105.00 116.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">输出文本。</text><text x="72.00 76.71 80.09 84.79 88.17" y="372.41" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.2</text><text x="98.73 111.73 124.73 137.73 150.73" y="372.41" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="400.30" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="415.92" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="415.92" font-size="11.00" class="sc-notoserifcjksc">只与这样的平台合作：它们认同我们关于向工作者提供公平且合乎道德的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">报酬的理念，并承诺无论身处何地都践行安全的工作场所做法，遵循我们在采购合同中详细规定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">的众包工作者福祉标准。</text><text x="72.00 76.71 80.09 84.79 88.17" y="511.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.3</text><text x="99.05 112.05 125.05 138.05 151.05 164.05 177.05" y="511.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="543.88" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="543.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83 147.83 158.83 169.83" y="543.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="543.88" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="543.88" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36 267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="543.88" font-size="11.00" class="sc-notoserifcjksc">）详细列出了我们模型的禁止用途，以及在高风险和其他</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="559.50" font-size="11.00" class="sc-notoserifcjksc">特定场景中使用时的要求。请注意，该模型仅提供给有限数量的合作伙伴，且仅用于防御性网络</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="575.12" font-size="11.00" class="sc-notoserifcjksc">安全目的。尽管如此，使用政策仍然适用。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="624.84" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="624.84" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="624.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59 288.59" y="624.84" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48 309.37" y="624.84" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95" y="624.84" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95 421.69 428.26 432.94 439.38 445.95 451.89 457.56 464.24 467.13 473.97 479.77 486.21 492.88 499.32 509.15 512.24" y="624.84" font-size="11.00" class="sc-loraregular">European Economic</text><text x="72.00 78.89 83.57 89.51" y="640.46" font-size="11.00" class="sc-loraregular">Area</text><text x="95.19 106.19 117.19 128.19 139.19 150.19" y="640.46" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00 83.00 94.00 105.00" y="673.41" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="673.41" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83 180.83 191.83 202.83 213.83 224.83 235.83" y="673.41" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83 257.83 268.83 279.83" y="673.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="673.41" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="135.18" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.co <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="72.00 76.71 80.09 84.79 88.17" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.4</text><text x="99.86 112.86 125.86 138.86 151.86 164.86 177.86" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">迭代式模型评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">在训练过程的不同时间点，我们会获取模型的不同</text><text x="316.89" y="111.04" font-size="11.00" class="sc-loraregular">“</text><text x="321.29 332.29" y="111.04" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="343.29" y="111.04" font-size="11.00" class="sc-loraregular">”</text><text x="347.13 358.13 369.13 380.13 391.13 402.13 413.13 424.13 435.13 446.13 457.13 468.13 479.13 490.13 501.13 512.13 523.13" y="111.04" font-size="11.00" class="sc-notoserifcjksc">。训练期间还存在模型的不同版本，包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">括一个不含任何安全防护措施的</text><text x="228.89" y="126.66" font-size="11.00" class="sc-loraregular">“</text><text x="233.29 244.29 255.29 266.29" y="126.66" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="277.29 283.88 289.84 292.84 299.35 303.07 309.63 312.63 315.52 321.95 328.63 331.57" y="126.66" font-size="11.00" class="sc-loraregular">helpful only</text><text x="337.38" y="126.66" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="348.38" y="126.66" font-size="11.00" class="sc-loraregular">”</text><text x="355.11 366.11 377.11 388.11 399.11 410.11 421.11 432.11 443.11 454.11 465.11 476.11 487.11 498.11 509.11 520.11" y="126.66" font-size="11.00" class="sc-notoserifcjksc">版本。除非另有说明，本系统卡中讨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">论的所有评估均来自模型的最终快照，并包含安全防护措施（例如，在对齐评估一节中，我们讨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="157.90" font-size="11.00" class="sc-notoserifcjksc">论了模型较早快照的一些行为；在</text><text x="239.89 246.80 253.04" y="157.90" font-size="11.00" class="sc-loraregular">RSP</text><text x="262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="157.90" font-size="11.00" class="sc-notoserifcjksc">评估一节中，我们讨论了使用仅有用模型进行的分析）。</text><text x="72.00 76.71 80.09 84.79 88.17" y="238.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1.5</text><text x="99.64 112.64 125.64 138.64" y="238.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="266.80" font-size="11.00" class="sc-notoserifcjksc">除本系统卡中所述由</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="266.80" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="266.80" font-size="11.00" class="sc-notoserifcjksc">开展的众多内部评估之外，还有多项评估由外部测试方开展。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="282.42" font-size="11.00" class="sc-notoserifcjksc">们将该模型提供给包括政府机构在内的多个外部团体，就网络安全、失控（</text><text x="435.00 441.36 447.79 452.89 457.98 460.87 467.25 470.97 473.86 481.55 487.99 494.56 498.82 503.51 509.94" y="282.42" font-size="11.00" class="sc-loraregular">Loss of Control</text><text x="512.93 523.93" y="282.42" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="72.00 79.69 86.43 93.34" y="298.04" font-size="11.00" class="sc-loraregular">CBRN</text><text x="104.62 115.62 126.62 137.62 148.62 159.62 170.62 181.62 192.62 203.62 214.62 225.62 236.62 247.62 258.61 269.61 280.61 291.61 302.61 313.61 324.61 335.61 346.61 357.61 368.61 379.61 390.61 401.61 412.61 423.61 434.61 445.61 456.61 467.61 478.61 489.61 500.61 511.61 522.61" y="298.04" font-size="11.00" class="sc-notoserifcjksc">以及有害操纵等关键风险领域进行评估，并将这些测试的结果纳入我们的整体风险评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="313.66" font-size="11.00" class="sc-notoserifcjksc">我们非常感谢外部测试方对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="313.66" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="329.77 340.77 351.77 362.77 373.77 384.77" y="313.66" font-size="11.00" class="sc-notoserifcjksc">所做的评估。</text><text x="72.00 77.07 80.71" y="381.55" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08 106.08 120.08 134.08 148.08 162.08" y="381.55" font-size="14.00" class="sc-notosanscjkscbold">发布决策流程</text><text x="72.00 76.71 80.09 87.55 90.93" y="418.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2.1</text><text x="98.73 111.73" y="418.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">概述</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="446.53" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88" y="446.53" font-size="11.00" class="sc-notoserifcjksc">的发布决策流程在多个方面都是全新的。它是第一个在我们</text><text x="480.88 491.88 502.88 513.88 524.88" y="446.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="462.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">政策的新框架</text><text x="138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="462.15" font-size="11.00" class="sc-notoserifcjksc">下接受评估的模型；它是第一个我们发布了系统卡、却未使其全面商用的模型</text><text x="512.00" y="458.48" font-size="6.60" class="sc-loraregular">1</text><text x="514.40 525.40" y="462.15" font-size="11.00" class="sc-notoserifcjksc">；而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="477.77" font-size="11.00" class="sc-notoserifcjksc">且相比以往大多数模型发布，它代表着更大的能力跃升。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="543.68" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="543.68" font-size="11.00" class="sc-notoserifcjksc">训练早期的迹象表明，该模型很可能具备非常强的通用能力。我们对此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="559.30" font-size="11.00" class="sc-notoserifcjksc">类模型的潜在风险感到足够担忧，因此首次在将模型的早期版本部署用于内部大范围使用之前，</text><text x="72.00 83.00 94.00 105.00 116.00" y="574.92" font-size="11.00" class="sc-notoserifcjksc">安排了为期</text><text x="129.89 135.56" y="574.92" font-size="11.00" class="sc-loraregular">24</text><text x="144.41 155.41 166.41 177.41 188.41 199.41 210.41 221.41 232.41 243.41 254.41 265.41 276.41 287.41 298.41 309.41 320.41 331.41 342.41 353.41 364.41 375.41 386.41 397.41 408.41 419.41 430.41 441.41 452.41 463.41 474.41 485.41 496.41 507.41 518.41 529.41" y="574.92" font-size="11.00" class="sc-notoserifcjksc">小时的内部对齐审查（在对齐评估中讨论）。这样做是为了获得保证，确保模型在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="590.54" font-size="11.00" class="sc-notoserifcjksc">与内部基础设施交互时不会造成损害。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="657.03" font-size="11.00" class="sc-notoserifcjksc">在对齐审查顺利通过后，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35 279.02 283.71 289.61 295.17 298.26 304.18" y="657.03" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88" y="657.03" font-size="11.00" class="sc-notoserifcjksc">的首个早期版本于</text><text x="406.77" y="657.03" font-size="11.00" class="sc-loraregular">2</text><text x="415.57" y="657.03" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="429.47 435.13" y="657.03" font-size="11.00" class="sc-loraregular">24</text><text x="443.99 454.99 465.99 476.99 487.99 498.99 509.99" y="657.03" font-size="11.00" class="sc-notoserifcjksc">日开放供内部使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="672.65" font-size="11.00" class="sc-notoserifcjksc">用。在我们的测试中，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 268.02 272.71 278.61 284.17 287.26 293.18" y="672.65" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">1</text><text x="76.81 86.81 96.81 106.81 116.81 126.81 136.81 146.81 156.81 166.81 176.81 186.81 196.81 206.81 216.81 226.81 236.81 246.81 256.81 266.81 276.81 286.81 296.81 306.81 316.81 326.81 336.81 346.81 356.81 366.81 376.81 386.81" y="703.80" font-size="10.00" class="sc-notoserifcjksc">明确地说，不将该模型全面开放的决定并非源于负责任扩展政策的要求。</text><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="480.88" y="437.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="480.88" y="437.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="491.88" y="437.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="491.88" y="437.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="502.88" y="437.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/file <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">浏览器中的零日漏洞。鉴于其固有的两用性质，正是这些使该模型在防御用途上具有价值的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">力，若被广泛获取，也可能加速攻击性利用。我们在随本次发布一同推出的一篇详细技术</text><text x="501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">博客文</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">章</text><text x="83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">中讨论了这些网络安全能力。基于这些发现，我们决定将该模型发布给少数合作伙伴，优先将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">其用于网络防御。</text><text x="72.00 76.71 80.09 87.55 90.93 98.39 101.48 109.82 117.73" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2.2 RSP</text><text x="128.73 141.73" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">决策</text><text x="72.00 83.00 94.00 105.00 116.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="129.89 136.80 143.04" y="238.38" font-size="11.00" class="sc-loraregular">RSP</text><text x="149.70 160.70 171.70 182.70 193.70 204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70" y="238.38" font-size="11.00" class="sc-notoserifcjksc">，我们会定期发布全面的风险报告（</text><text x="325.70 332.61 335.70 340.80 346.70 349.60 356.43 362.39 368.96 375.39 380.23" y="238.38" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="384.49 395.49 406.49 417.49 428.49 439.49 450.49 461.49 472.49 483.49 494.49 505.49 516.49 527.49" y="238.38" font-size="11.00" class="sc-notoserifcjksc">），阐述我们模型的安全状况。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">并且，如果我们发布的模型比上一份风险报告中讨论的模型</text><text x="360.89" y="254.00" font-size="11.00" class="sc-loraregular">“</text><text x="365.29 376.29 387.29 398.29 409.29 420.29" y="254.00" font-size="11.00" class="sc-notoserifcjksc">能力显著更强</text><text x="431.29" y="254.00" font-size="11.00" class="sc-loraregular">”</text><text x="435.13 446.13 457.13 468.13 479.13 490.13" y="254.00" font-size="11.00" class="sc-notoserifcjksc">，我们就必须</text><text x="504.02" y="254.00" font-size="11.00" class="sc-loraregular">“</text><text x="508.42 519.42" y="254.00" font-size="11.00" class="sc-notoserifcjksc">（在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">我们的系统卡或其他地方）发布一份讨论，说明该模型的能力和倾向如何影响或改变风险报告中</text><text x="72.00 83.00 94.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">的分析</text><text x="105.00" y="285.24" font-size="11.00" class="sc-loraregular">”</text><text x="108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84" y="285.24" font-size="11.00" class="sc-notoserifcjksc">。对于风险报告更新，我们通常遵循与风险报告相同的内部流程。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="347.53" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88" y="347.53" font-size="11.00" class="sc-notoserifcjksc">的能力显著强于</text><text x="274.77 282.46 285.45 291.07 297.63 304.21 310.17 313.07 321.80 328.37 334.93 340.03 342.92 348.88 351.48" y="347.53" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="363.15" font-size="11.00" class="sc-notoserifcjksc">讨论的能力最强的模型。尽管能力有所提升，我们的总体结论是，灾难性风险仍然很低：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="408.11" font-size="11.00" class="sc-notoserifcjkscbold">非新型化学和生物武器的制造。</text><text x="262.00 269.69 272.68 278.29 284.86 291.44 297.40 300.29 310.22 316.09 320.34 326.93 333.37 338.46 341.35 348.02 352.71 358.61 364.17 367.26 373.18" y="408.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="408.11" font-size="11.00" class="sc-notoserifcjksc">比我们以往的模型能力更强，但</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="423.73" font-size="11.00" class="sc-notoserifcjksc">就我们整体风险评估的目的而言，其概况与以往模型实际上相似。我们认为，我们的风险</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="439.35" font-size="11.00" class="sc-notoserifcjksc">缓解措施足以使非新型化学</text><text x="240.00" y="439.35" font-size="11.00" class="sc-loraregular">/</text><text x="247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59 511.59 522.59" y="439.35" font-size="11.00" class="sc-notoserifcjksc">生物武器制造带来的灾难性风险处于非常低但不可忽略的水</text><text x="108.00 119.00" y="454.97" font-size="11.00" class="sc-notoserifcjksc">平。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="489.07" font-size="11.00" class="sc-notoserifcjkscbold">新型化学和生物武器的制造。</text><text x="251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="489.07" font-size="11.00" class="sc-notoserifcjksc">我们认为，即使我们将该模型全面开放，新型化学</text><text x="493.00" y="489.07" font-size="11.00" class="sc-loraregular">/</text><text x="500.59 511.59 522.59" y="489.07" font-size="11.00" class="sc-notoserifcjksc">生物武</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="504.69" font-size="11.00" class="sc-notoserifcjksc">器带来的灾难性风险仍将保持在较低水平（存在相当大的不确定性）。整体情况与我们最</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="520.31" font-size="11.00" class="sc-notoserifcjksc">近一份风险报告中的情况相似。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="553.83" font-size="11.00" class="sc-notoserifcjkscbold">未对齐模型带来的风险。</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="553.83" font-size="11.00" class="sc-notoserifcjksc">我们判定总体风险非常低，但高于以往模型。我们在一份补充性</text><text x="108.00" y="569.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="119.00 130.00 141.00 152.00 163.00 174.00" y="569.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="185.00" y="569.45" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="196.00 202.89 205.88 208.97 215.05 221.73 231.56 237.53 244.10 248.36 251.25 258.16 261.25 266.35 272.25 275.15 283.42 289.98 296.56 302.16 306.42" y="569.45" font-size="11.00" class="sc-loraregular">Alignment Risk Update</text><text x="312.38 323.38 334.38 345.38 356.38 367.38 378.38 389.38 400.38 411.38 422.38 433.38" y="569.45" font-size="11.00" class="sc-notoserifcjksc">）中深入讨论了这一风险。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="602.41" font-size="11.00" class="sc-notoserifcjkscbold">关键领域的自动化研发。</text><text x="229.00 236.69 239.68 245.29 251.86 258.44 264.40 267.29 277.22 283.09 287.34 293.93 300.37 305.46 308.35 315.02 319.71 325.61 331.17 334.26 340.18" y="602.41" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="351.88 362.88 373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="602.41" font-size="11.00" class="sc-notoserifcjksc">的进步幅度（相对于以往模型）高于我</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="618.03" font-size="11.00" class="sc-notoserifcjksc">们此前观察到的趋势，但我们判定这些进步具体归因于</text><text x="374.89 381.78" y="618.03" font-size="11.00" class="sc-loraregular">AI</text><text x="388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36 531.36" y="618.03" font-size="11.00" class="sc-notoserifcjksc">加速的研发以外的因素，并总体</text><text x="108.00 119.00 130.00 141.00 152.00" y="633.65" font-size="11.00" class="sc-notoserifcjksc">得出结论：</text><text x="163.00 170.69 173.68 179.29 185.86 192.44 198.40 201.29 211.22 217.09 221.34 227.93 234.37 239.46 242.35 249.02 253.71 259.61 265.17 268.26 274.18" y="633.65" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="285.88 296.88 307.88" y="633.65" font-size="11.00" class="sc-notoserifcjksc">未跨越</text><text x="321.77 328.68 334.92" y="633.65" font-size="11.00" class="sc-loraregular">RSP</text><text x="344.48" y="633.65" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="358.37" y="633.65" font-size="11.00" class="sc-loraregular">“</text><text x="362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77" y="633.65" font-size="11.00" class="sc-notoserifcjksc">将两年的进展压缩到一年</text><text x="483.77" y="633.65" font-size="11.00" class="sc-loraregular">”</text><text x="490.50 501.50 512.50 523.50" y="633.65" font-size="11.00" class="sc-notoserifcjksc">的自动化</text><text x="108.00 114.89" y="649.27" font-size="11.00" class="sc-loraregular">AI</text><text x="121.46 132.46 143.46 154.46 165.46 176.46 187.46 198.46 209.46 220.46 231.46" y="649.27" font-size="11.00" class="sc-notoserifcjksc">研发阈值。尽管我们认为</text><text x="245.36 253.05 256.04 261.65 268.22 274.79 280.76 283.65 293.58 299.44 303.70 310.29 316.73 321.82 324.71 331.38 336.06 341.97 347.53 350.62 356.53" y="649.27" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="368.24 379.24 390.24 401.24 412.24 423.24 434.24 445.24 456.24 467.24 478.24 489.24 500.24 511.24 522.24" y="649.27" font-size="11.00" class="sc-notoserifcjksc">并未显著改变我们最近一份风险报</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="664.89" font-size="11.00" class="sc-notoserifcjksc">告中针对这一威胁模型所呈现的图景，但我们对这一</text><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="501.00" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="501.00" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="512.00" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="512.00" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="523.00" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="523.00" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="534.00" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://red.anthropic.com/2026/mythos-preview" rel="noopener"><rect x="72.00" y="120.67" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="119.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="119.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="130.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="130.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="141.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="141.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="152.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="152.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="163.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="163.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="174.00" y="560.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="174.00" y="560.65" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">结论的信心低于以往任何模型，并且我们打算今后继续监测它对内部</text><text x="440.89 447.78" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="454.36 465.36 476.36 487.36 498.36 509.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研发的贡献。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.99" font-size="11.00" class="sc-notoserifcjksc">当前风险仍然很低。但我们看到了一些警示信号：如果能力持续快速进步（例如，发展到远超人</text><text x="72.00 83.00" y="142.61" font-size="11.00" class="sc-notoserifcjksc">类的</text><text x="96.89 103.78" y="142.61" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36 121.36 132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="142.61" font-size="11.00" class="sc-notoserifcjksc">系统的程度），要让风险保持在低水平可能会是一项重大挑战。正如下文详述，我们观察</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="158.23" font-size="11.00" class="sc-notoserifcjksc">到了我们的模型采取明显不被允许的行动的罕见情况（在更为罕见的情况下，模型似乎还刻意掩</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="173.85" font-size="11.00" class="sc-notoserifcjksc">饰了这些行动）；我们在评估流程后期才发现了一些疏漏，这些疏漏曾使我们面临低估模型能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="189.47" font-size="11.00" class="sc-notoserifcjksc">力、高估监控模型推理轨迹可靠性的风险；并且我们承认，我们对模型能力的判断越来越依赖主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="205.09" font-size="11.00" class="sc-notoserifcjksc">观判断，而非易于解读的实证结果。我们并不确信已经识别出了这方面的所有问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="288.91" font-size="11.00" class="sc-notoserifcjksc">如果我们要让前沿模型带来的风险保持在低水平，今后很可能需要大幅提高标准。令我们深感警</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="304.53" font-size="11.00" class="sc-notoserifcjksc">惕的是，世界看起来正走在快速开发超人类系统的轨道上，却尚未建立起更有力的机制来确保整</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="320.15" font-size="11.00" class="sc-notoserifcjksc">个行业的充分安全。</text></svg></div>
