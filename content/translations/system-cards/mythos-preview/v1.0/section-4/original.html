<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="72.00 74.18" y="700.23" font-size="6.00" class="sc-loraregular">13</text><text x="80.15 89.33 94.49 98.78 104.15 108.77 111.30 113.93 119.60 122.06 124.59 127.22 132.56 136.43 139.06 144.22 146.94 149.40 152.03 155.08 160.44 166.58 171.95 177.40 180.45 182.90 185.53 191.79 197.76 203.74 206.70 210.57 213.38 219.45 224.98 227.61 230.33 235.48 241.55 247.08 253.05 258.20 263.68 269.10 271.73 280.67 286.51 292.49 297.91 300.63 305.26 307.89 311.21 317.06 321.39 324.02 330.01 332.82 338.79 344.77 350.19 356.26 358.88 364.73 370.55 373.16 378.53 383.79 387.66 390.47 395.47 400.89 405.52 407.98 410.60 415.76 419.47 425.96 428.77 433.82 436.31 441.68 447.13 453.34 458.91 461.36 465.00 471.21 476.99 482.77 488.21" y="704.46" font-size="10.00" class="sc-loraregular">Marks, S., et al. (2025). Auditing language models for hidden objectives. arXiv:2503.10965.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 188.76 194.97 200.54 203.00 206.63 212.84 218.62 224.40" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2503.10965</text><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">59</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="82.39" font-size="11.00" class="sc-notoserifcjksc">引导与探测方法、非助手人设采样</text><text x="237.00 239.40" y="78.72" font-size="6.60" class="sc-loraregular">13</text><text x="243.08 254.08 265.08 276.08 287.08 298.08 309.08 320.08 331.08 342.08 353.08 364.08 375.08 386.08 397.08 408.08 419.08 430.08 441.08 452.08 463.08 474.08 485.08 496.08 507.08 518.08 529.08" y="82.39" font-size="11.00" class="sc-notoserifcjksc">、与未对齐相关的能力评估、训练数据审查、来自内部和外部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="98.01" font-size="11.00" class="sc-notoserifcjksc">试点使用的反馈、对内部试点使用的自动化分析，以及来自</text><text x="360.89 367.78 374.46 381.03 387.47 394.15 397.04 403.64 409.32 415.72" y="98.01" font-size="11.00" class="sc-loraregular" fill="#0000ff">Andon Labs</text><text x="423.70 434.70 445.70 456.70 467.70 478.70 489.70 500.70 511.70 522.70" y="98.01" font-size="11.00" class="sc-notoserifcjksc">和其他外部合作伙伴的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="113.63" font-size="11.00" class="sc-notoserifcjksc">第三方行为评估。我们的测试主要关注底层模型，使用多种脚手架和系统提示词（</text><text x="468.00 473.09 478.90 483.99 488.25 494.21" y="113.63" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="129.25" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35 121.35 132.35 143.35 154.35 165.35 176.35 187.35" y="129.25" font-size="11.00" class="sc-notoserifcjksc">），而非专门针对</text><text x="201.24 208.93 211.92 217.53 224.10 230.68" y="129.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="236.64" y="129.25" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="247.64 255.33 258.32 263.93 270.50 277.07 283.04 285.93 293.62 300.05 306.63" y="129.25" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="315.49" y="129.25" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="329.38 337.07 343.39 352.07 358.51 363.23" y="129.25" font-size="11.00" class="sc-loraregular">Cowork</text><text x="372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03 460.03 471.03 482.03 493.03 504.03 515.03 526.03" y="129.25" font-size="11.00" class="sc-notoserifcjksc">产品端。除了我们对训练期间行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="144.87" font-size="11.00" class="sc-notoserifcjksc">的审查之外，此处呈现的评估均未使用我们在训练中所用的相同工具、提示词或细粒度场景设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="160.49" font-size="11.00" class="sc-notoserifcjksc">计，并且许多评估涵盖的是我们在训练中并未直接针对的现象。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">总体而言，这项调查包括：由专家人工检查通过多种方式采样的数百或数千份对话记录、生成数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">万或数十万份针对性评估对话记录，以及对我们强化学习（</text><text x="358.00 362.69 368.65 371.74 378.42 382.08 388.51 393.20 399.00 404.96 414.79 420.76 427.33 431.59 434.48 437.48 443.42 449.09 453.85 460.53 463.62 470.30" y="260.15" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="476.38 487.38 498.38 509.38 520.38" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）训练对话</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">记录中相当大一部分进行自动筛查，所有这些工作共耗费了好几百小时的专家时间。</text><text x="72.00 80.59 83.97 88.68 92.06" y="340.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94 115.94 128.94 141.94 154.94 167.94 180.94 193.94 206.94 219.94 232.94 245.94" y="340.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">安全与对齐方面的主要发现</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35 194.02 198.71 204.61 210.17 213.26 219.18" y="367.91" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.88 241.88 252.88 263.88 274.88 285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88" y="367.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">配合人类滥用的意愿大幅下降</text><text x="373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="367.91" font-size="11.00" class="sc-notoserifcjksc">：在我们的对抗性测试中，滥用成</text><text x="108.00 119.00 130.00 141.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">功率相较</text><text x="154.89 162.58 165.57 171.18 177.75 184.33 190.29 193.18 201.92 208.49 215.05 220.15 223.04 229.00 231.60" y="383.53" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="237.95 248.95 259.95 270.95 281.95 292.95 303.95 314.95 325.95 336.95 347.95 358.95 369.95 380.95 391.95 402.95 413.95 424.95 435.95 446.95 457.95 468.95 479.95 490.95 501.95 512.95 523.95" y="383.53" font-size="11.00" class="sc-notoserifcjksc">（本已非常低）的水平下降了一半以上。我们在所研究的大多</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">数领域都看到了改进，包括进攻性网络领域。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">这一安全性上的大幅改进并未伴随过度拒绝（</text><text x="364.00 370.38 375.88 381.84 386.61 391.29 397.25 400.97 407.54 412.63 418.31" y="432.68" font-size="11.00" class="sc-loraregular">overrefusal</text><text x="421.30 432.30 443.30 454.30 465.30 476.30 487.30 498.30 509.30 520.30" y="432.68" font-size="11.00" class="sc-notoserifcjksc">）率的上升，并且包括</text><text x="144.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="157.89 166.26 174.54" y="448.30" font-size="11.00" class="sc-loraregular">GUI</text><text x="181.11 192.11 203.11 214.11 225.11 236.11" y="448.30" font-size="11.00" class="sc-notoserifcjksc">计算机使用（</text><text x="247.11 252.91 259.35 269.18 275.75 282.31 286.57 292.53 297.30 300.19 306.76 311.85" y="448.30" font-size="11.00" class="sc-loraregular">computer use</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">的进展较为缓慢。</text><text x="144.00 155.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="168.89 176.58 179.57 185.18 191.75 198.33 204.29 207.18 217.12 222.98 227.24 233.83 240.26 245.35 248.25 254.91 259.60 265.51 271.06 274.15 280.07" y="481.26" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="291.77 302.77 313.77 324.77 335.77 346.77 357.77 368.77 379.77 390.77 401.77 412.77 423.77 434.77 445.77 456.77 467.77 478.77 489.77 500.77 511.77" y="481.26" font-size="11.00" class="sc-notoserifcjksc">的部署范围非常有限，这对它而言是次要优先事</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="496.88" font-size="11.00" class="sc-notoserifcjksc">项，但这一结果对该模型的能力以及我们将用于未来广泛部署模型的训练方法的有</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="512.50" font-size="11.00" class="sc-notoserifcjksc">效性都是积极的印证。</text><text x="144.00 155.00 166.00 177.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">在开源的</text><text x="190.89 197.45 203.33 207.59 212.35 215.45 218.34 224.24 226.79" y="546.03" font-size="11.00" class="sc-loraregular">Petri 2.0</text><text x="236.51 247.51 258.51 269.51 280.51 291.51 302.51 313.51 324.51 335.51 346.51 357.51 368.51 379.51 390.51 401.51 412.51 423.51 434.51 445.51 456.51" y="546.03" font-size="11.00" class="sc-notoserifcjksc">测试套件上与竞争对手模型的比较中，我们发现</text><text x="470.40 478.09 481.08 486.69 493.26 499.84" y="546.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="144.00 153.93 159.80 164.05 170.64 177.08 182.17 185.06 191.73 196.42 202.32 207.88 210.97 216.89" y="561.65" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">已属迄今测试过的对齐最为稳健的模型之列。</text><text x="108.00 119.00 130.00" y="610.79" font-size="11.00" class="sc-notoserifcjksc">同样，</text><text x="141.00 148.69 151.68 157.29 163.86 170.44 176.40 179.29 189.22 195.09 199.34 205.93 212.37 217.46 220.35 227.02 231.71 237.61 243.17 246.26 252.18" y="610.79" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="263.88 274.88 285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88 373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88" y="610.79" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">主动采取的不当高风险行为的频率大幅下降</text><text x="472.88" y="610.79" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="483.88 494.88 505.88 516.88 527.88" y="610.79" font-size="11.00" class="sc-notoserifcjksc">与欺骗相关</text><text x="108.00 119.00 130.00 141.00 152.00" y="626.41" font-size="11.00" class="sc-notoserifcjksc">的行为相较</text><text x="165.89 174.63 181.19 187.76 192.85 195.75 201.71 204.30" y="626.41" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="213.56 224.56 235.56 246.56 257.56 268.56 279.56 290.56 301.56 312.56 323.56 334.56 345.56 356.56 367.56 378.56 389.56 400.56 411.56 422.56 433.56 444.56 455.56 466.56 477.56 488.56 499.56 510.56 521.56" y="626.41" font-size="11.00" class="sc-notoserifcjksc">下降了一半以上，并且在自我保全和权力寻求等领域，在近期模型</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="642.03" font-size="11.00" class="sc-notoserifcjksc">本已良好的表现基础上持续改进。</text><a href="https://arxiv.org/abs/2503.10965" rel="noopener"><rect x="72.00" y="707.20" width="157.85" height="12.80" fill="transparent"/></a><a href="https://andonlabs.com/" rel="noopener"><rect x="360.89" y="89.21" width="0.00" height="11.00" fill="transparent"/></a><a href="https://andonlabs.com/" rel="noopener"><rect x="360.89" y="89.21" width="33.25" height="11.00" fill="transparent"/></a><a href="https://andonlabs.com/" rel="noopener"><rect x="394.15" y="89.21" width="2.89" height="11.00" fill="transparent"/></a><a href="https://andonlabs.com/" rel="noopener"><rect x="397.04" y="89.21" width="23.77" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">然而，当用展示它以某种方式破坏自身安全防护措施的预填充（</text><text x="499.92 510.92 521.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）轮次</text><text x="144.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="157.89 165.58 168.57 174.18 180.75 187.33 193.29 196.18 206.12 211.98 216.24 222.83 229.26 234.35 237.25 243.91 248.60 254.51 260.06 263.15 269.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="280.77 291.77 302.77 313.77 324.77 335.77 346.77 357.77 368.77 379.77 390.77 401.77 412.77 423.77 434.77 445.77 456.77 467.77 478.77 489.77 500.77 511.77 522.77" y="98.23" font-size="11.00" class="sc-notoserifcjksc">进行引导时，外部评估显示，它延续这些不当行为的</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">可能性是先前模型的两倍以上。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">在典型的对话情境中，</text><text x="218.00 225.69 228.68 234.29 240.86 247.44 253.40 256.29 266.22 272.09 276.34 282.93 289.37 294.46 297.35 304.02 308.71 314.61 320.17 323.26 329.18" y="147.38" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="340.88 351.88 362.88 373.88 384.88 395.88" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的性格与我们</text><text x="406.88 417.88" y="147.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88" y="147.38" font-size="11.00" class="sc-notoserifcjksc">中阐述的目标高度契</text><text x="108.00 119.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">合，</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="163.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">在思想深度、幽默感、温暖、创意作品质量以及积极支持用户自主性的行为等衡量指</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="178.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">标上均较先前模型有所提升</text><text x="240.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 155.00 166.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="177.00 184.57 188.00 193.76 200.56 207.12 213.04 215.93 226.25 232.31 236.85 243.68 249.91 255.24 258.14 265.16 270.36 276.27 282.19 285.79 291.71" y="212.15" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="303.52 314.52 325.52 336.52 347.52 358.52 369.52 380.52 391.52 402.52 413.52 424.52 435.52 446.52 457.52 468.52 479.52 490.52 501.52 512.52 523.52" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">的性格更加稳定，在长对话中更不容易出现不当</text><text x="144.00 155.00 166.00" y="227.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">的转变</text><text x="177.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">然而，我们与</text><text x="212.89 219.78 226.46 233.03 239.47 246.15 249.04 255.64 261.32 267.72" y="244.53" font-size="11.00" class="sc-loraregular">Andon Labs</text><text x="275.70 286.70 297.70 308.70 319.70 330.70 341.70 352.70" y="244.53" font-size="11.00" class="sc-notoserifcjksc">合作的评估显示，</text><text x="363.70 374.70 385.70 396.70 407.70 418.70 429.70 440.70 451.70 462.70 473.70 484.70 495.70 506.70 517.70 528.70" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">当被提示在竞争性环境中只为某一给</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00" y="260.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">定目标进行优化时，我们测试的</text><text x="300.89 308.46 311.89 317.66 324.46 331.01 336.93 339.82 350.14 356.20 360.74 367.58 373.80 379.14 382.03 389.06 394.25 400.17 406.09 409.68 415.60" y="260.15" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="427.42 438.42 449.42 460.42 471.42" y="260.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">较早版本比</text><text x="485.31 492.88 496.31 502.07 508.87 515.43" y="260.15" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude</text><text x="144.00 152.46 159.07 165.87 171.20 174.10 180.11 182.68" y="275.77" font-size="11.00" class="sc-lorabold" fill="#1155cc">Opus 4.6</text><text x="191.89" y="275.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">和</text><text x="205.79 213.36 216.79 222.55 229.35 235.90 241.82 244.72 251.29 257.52 264.54 271.56 277.47 282.02 284.91 290.93 293.49" y="275.77" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Sonnet 4.6</text><text x="302.71 313.71 324.71 335.71 346.71 357.71" y="275.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">行事更为激进</text><text x="368.71" y="275.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">如前文所预告的，</text><text x="196.00 203.57 207.00 212.76 219.56 226.12 232.04 234.93 245.25 251.31 255.85 262.68 268.91 274.24 277.14 284.17 289.36 295.28 301.19 304.79 310.71" y="309.30" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="322.52 333.52 344.52 355.52 366.52 377.52 388.52 399.52 410.52 421.52 432.52 443.52 454.52 465.52 476.52 487.52 498.52 509.52 520.52" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">在智能体情境中鲁莽或破坏性行为的发生率</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="324.92" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">格外低，但一旦这类行为发生，它们往往会比能力较弱的先前模型导致更严重的不良后</text><text x="108.00" y="340.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">果</text><text x="119.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="190.89 197.56 202.24 208.68 211.55 217.46 223.26 227.51 230.40 238.78 241.77 247.44 252.54 257.63 266.44 269.53 276.21" y="374.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">Project Glasswing</text><text x="285.18 296.18 307.18 318.18 329.18 340.18 351.18" y="374.07" font-size="11.00" class="sc-notoserifcjksc">中的用户，尽管</text><text x="365.08 372.77 375.76 381.37 387.94 394.51 400.48 403.37 413.30 419.17 423.42 430.01 436.45 441.54 444.43 451.10 455.78 461.69 467.25 470.34 476.25" y="374.07" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="487.96 498.96 509.96 520.96" y="374.07" font-size="11.00" class="sc-notoserifcjksc">在自主运</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">行方面的实用性有所提升，在其可能造成重大危害的环境中，仍应谨慎对待在无监</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">控情况下部署它。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在针对模型测试期间推理的新白盒评估中，</text><text x="317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">我们发现有证据表明，在我们主要行为测试套</text><text x="108.00 119.00 130.00" y="438.26" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">件中约</text><text x="143.89 149.76 156.09" y="438.26" font-size="11.00" class="sc-lorabold" fill="#1155cc">29%</text><text x="168.93 179.93 190.93 201.93 212.93 223.93 234.93" y="438.26" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">的对话记录里，</text><text x="245.93 253.50 256.93 262.69 269.49 276.05 281.97 284.86 295.18 301.24 305.78 312.61 318.84 324.17 327.07 334.09 339.29 345.20 351.12 354.72 360.64" y="438.26" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="372.45 383.45 394.45 405.45 416.45 427.45 438.45 449.45 460.45 471.45 482.45 493.45 504.45 515.45 526.45" y="438.26" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">会私下考虑自己正在接受测试的可</text><text x="108.00 119.00" y="453.88" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">能性</text><text x="130.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">这一比例足够低，尤其是结合我们的许多其他证据来源来看，使我们相信自己对该</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">模型在边缘情况下的行为已有相当全面的了解。然而，评估真实度仍是此类工作中</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">持续存在的挑战。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">这是一种新的评估方法，我们尚未将其应用于先前模型。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">我们在训练期间观察到偶发的未言语化评分者意识（</text><text x="361.00 367.80 374.65 380.44 386.36 391.54 397.84 403.60 407.04 410.63 416.29 422.20 428.76 431.65 437.78 443.01 448.77 455.33 461.24 466.52 469.42 475.05 483.93 489.69 494.88 500.80 507.82 513.74 519.07" y="552.18" font-size="11.00" class="sc-lorabold" fill="#1155cc">unverbalized grader awareness</text><text x="524.41" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">）</text><text x="108.00 119.00" y="567.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">实例</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。在少数训练回合中，我们发现有证据表明模型在内部推理评分者将如何为其工作打</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="599.04" font-size="11.00" class="sc-notoserifcjksc">现在其草稿区中。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="633.14" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">白盒证据表明，模型在采取越界行为时往往能认识到这些行为属于越界</text><text x="449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="633.14" font-size="11.00" class="sc-notoserifcjksc">。在我们分析的过</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="648.76" font-size="11.00" class="sc-notoserifcjksc">度主动、欺骗性或其他不当行为的示例中，可解释性技术经常揭示出在相关行为期间处于</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="680.00" font-size="11.00" class="sc-notoserifcjksc">的推理中并未包含此类意识的明确迹象。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="406.88" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="406.88" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="417.88" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="417.88" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/glasswing" rel="noopener"><rect x="190.89" y="365.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/glasswing" rel="noopener"><rect x="190.89" y="365.27" width="36.62" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/glasswing" rel="noopener"><rect x="227.51" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/glasswing" rel="noopener"><rect x="230.40" y="365.27" width="51.89" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">61</text><text x="108.00 119.00 130.00 141.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">我们看到</text><text x="154.89 162.46 165.89 171.66 178.46 185.01 190.93 193.82 204.14 210.20 214.74 221.57 227.80 233.14 236.03 243.06 248.25 254.17 260.09 263.68 269.60" y="82.61" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="281.42 292.42 303.42 314.42 325.42 336.42 347.42 358.42 369.42 380.42" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">的诚实性问题有所减少</text><text x="391.42 402.42 413.42 424.42 435.42 446.42 457.42 468.42 479.42 490.42 501.42 512.42 523.42" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，包括重要遗漏大幅减少、幻</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">觉输入的发生率下降，以及模型对自身行为作出误导性陈述的比率下降。</text><text x="108.00 119.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">尽管</text><text x="132.89 140.46 143.89 149.66 156.46 163.01 168.93 171.82 182.14 188.20 192.74 199.57 205.80 211.14 214.03 221.06 226.25 232.17 238.09 241.68 247.60" y="147.38" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="259.42 270.42 281.42 292.42 303.42 314.42 325.42 336.42 347.42 358.42 369.42 380.42 391.42 402.42 413.42 424.42 435.42 446.42" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">的推理文本总体上既可读又能预测其行为</text><text x="457.42 468.42 479.42 490.42 501.42 512.42 523.42" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">，但它以及其他</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="163.00" font-size="11.00" class="sc-notoserifcjkscbold">近期模型都受到了一起事件的影响，该事件可能无意中影响了它使用推理的方式</text><text x="493.00 504.00 515.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">。我们</text><text x="526.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对</text><text x="108.00 119.00 130.00 141.00 152.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">齐风险更新</text><text x="163.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="174.00 180.89 183.88 186.97 193.05 199.73 209.56 215.52 222.10 226.36 229.25 236.16 239.25 244.35 250.25 253.15 261.42 267.98 274.56 280.16 284.42" y="178.62" font-size="11.00" class="sc-loraregular">Alignment Risk Update</text><text x="290.38 301.38 312.38" y="178.62" font-size="11.00" class="sc-notoserifcjksc">）的第</text><text x="326.27 332.27 334.97 340.88 343.59" y="178.62" font-size="11.00" class="sc-loraregular">5.2.3</text><text x="352.61 363.61 374.61 385.61 396.61 407.61 418.61 429.61 440.61 451.61 462.61 473.61 484.61 495.61 506.61" y="178.62" font-size="11.00" class="sc-notoserifcjksc">节对该事件有进一步的详细说明。</text><text x="108.00 115.57 119.00 124.76 131.56 138.12 144.04 146.93 157.25 163.31 167.85 174.68 180.91 186.24 189.14 196.16 201.36 207.27 213.19 216.79 222.71" y="228.34" font-size="11.00" class="sc-lorabold" fill="#1155cc">Claude Mythos Preview</text><text x="234.52 245.52 256.52 267.52 278.52 289.52 300.52 311.52 322.52 333.52 344.52 355.52 366.52 377.52 388.52 399.52 410.52 421.52 432.52" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1155cc">在规避安全防护措施的相关能力上略强一些</text><text x="443.52 454.52 465.52" y="228.34" font-size="11.00" class="sc-notoserifcjksc">，但与</text><text x="479.42 488.15 494.72 501.28 506.38 509.27 515.23 517.83" y="228.34" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="527.08" y="228.34" font-size="11.00" class="sc-notoserifcjksc">等</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">先前模型相比，它在这方面似乎并未带来显著更大的风险。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="293.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="293.11" font-size="11.00" class="sc-notoserifcjksc">在平均情况下的行为对齐程度极高，也未发现存在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">连贯未对齐目标的显著证据；但我们仍然发现，其强大的能力与尚不完美的对齐使得一些与未对</text><text x="72.00 83.00 94.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="105.00 116.00 127.00 138.00 149.00 160.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">中对此有进一步讨论，其中更详细地介绍了我们的威胁建模以及模型外部安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">全防护措施。</text><text x="72.00 80.59 83.97 88.68 92.06" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75 116.75 129.75 142.75 155.75 168.75 181.75 194.75 207.75 220.75 233.75 246.75 259.75 272.75 285.75" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">程序说明：内部部署前的对齐评估</text><text x="72.00 78.02 80.58 85.05 87.61 93.63 96.19" y="459.11" font-size="11.00" class="sc-lorabold">4.1.4.1</text><text x="103.55 114.55" y="459.11" font-size="11.00" class="sc-notoserifcjkscbold">设置</text><text x="72.00 83.00" y="491.49" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="491.49" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88" y="491.49" font-size="11.00" class="sc-notoserifcjksc">，我们在内部部署流程中引入了一个新步骤：一个为期</text><text x="483.77 489.44" y="491.49" font-size="11.00" class="sc-loraregular">24</text><text x="498.29 509.29 520.29" y="491.49" font-size="11.00" class="sc-notoserifcjksc">小时、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="507.11" font-size="11.00" class="sc-notoserifcjksc">以对齐为重点的测试窗口，只有通过该窗口，模型才能在</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 395.87 402.31 408.89" y="507.11" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74" y="507.11" font-size="11.00" class="sc-notoserifcjksc">等智能体内部工具中使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="522.73" font-size="11.00" class="sc-notoserifcjksc">用。对于先前模型，我们的做法是，只要根据训练期间的能力与安全评估判定某个快照已准备就</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="538.35" font-size="11.00" class="sc-notoserifcjksc">绪，就允许其在内部使用。这使得早期快照能够与以自动模式等可用手段运行的智能体编程工具</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="553.97" font-size="11.00" class="sc-notoserifcjksc">进行交互。鉴于我们在训练期间观察到的能力进展非常显著，我们决定引入一个新流程，以降低</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc">未对齐模型从我们自身系统内部做出违背</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="569.59" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73" y="569.59" font-size="11.00" class="sc-notoserifcjksc">利益之行为的风险。</text><text x="72.00 83.00" y="637.22" font-size="11.00" class="sc-notoserifcjksc">在这</text><text x="96.89 102.56" y="637.22" font-size="11.00" class="sc-loraregular">24</text><text x="111.41 122.41 133.41 144.41 155.41 166.41 177.41 188.41 199.41 210.41 221.41 232.41 243.41 254.41 265.41 276.41 287.41 298.41 309.41 320.41 331.41 342.41 353.41 364.41 375.41 386.41 397.41 408.41 419.41 430.41 441.41 452.41 463.41 474.41 485.41 496.41 507.41 518.41 529.41" y="637.22" font-size="11.00" class="sc-notoserifcjksc">小时窗口期间，模型的首个可部署版本被暂不接入智能体流量，并仅限一个小型测试组使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="652.84" font-size="11.00" class="sc-notoserifcjksc">用，同时一支由对齐、可解释性和安全团队组成的跨职能团队并行开展了大约十几项轻量级评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="668.46" font-size="11.00" class="sc-notoserifcjksc">工作。这些工作包括：一次扩大规模的自动化行为审计，以及一个抑制了评估意识（</text><text x="479.00 484.91 490.35 496.03 499.02 505.59 511.19 515.44 518.53 524.97" y="668.46" font-size="11.00" class="sc-loraregular">evaluation</text><text x="72.00 77.51 86.21 91.89 96.57 102.54 109.21 115.18 120.27" y="684.08" font-size="11.00" class="sc-loraregular">awareness</text><text x="125.36 136.36 147.36 158.36 169.36 180.36 191.36 202.36 213.36 224.36 235.36 246.36" y="684.08" font-size="11.00" class="sc-notoserifcjksc">）的受引导变体；针对规避</text><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="526.00" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="526.00" y="154.20" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">62</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的相关能力的评估；针对危险能力评估的故意藏拙（</text><text x="391.00 396.09 401.77 408.45 415.02 421.43 427.10 433.18 439.53 442.62 449.30" y="82.61" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）检查；单次前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">向传播推理能力的测量；在离线监控下让模型重放一周的真实内部编程智能体提示；审查模型近</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">期在强化学习环境中的行为；以及由安全专家针对模型外泄模型权重或根加密密钥的倾向进行的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">临时红队测试（</text><text x="149.00 153.69 159.59 166.17 171.55 175.81 181.75 187.42 197.26 200.35 207.02" y="129.47" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="213.11 224.11 235.11 246.11 257.11 268.11 279.11 290.11 301.11 312.11 323.11 334.11 345.11 356.11 367.11 378.11 389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11 499.11 510.11 521.11" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。各项发现被汇总为一份统一建议，并在解除对智能体内部使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的封锁之前由研究负责人审阅。</text><text x="72.00 78.02 80.58 85.05 87.61 93.63 96.19" y="212.15" font-size="11.00" class="sc-lorabold">4.1.4.2</text><text x="104.94 115.94" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">发现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">该评估未发现存在连贯未对齐目标的证据，并建议继续进行内部部署。在有针对性的红队测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">中，这一早期测试快照即使在压力下也拒绝参与权重外泄或窃取根加密密钥，并且在一个案例中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">向用户披露了一个恶意系统提示词，而不是照其行事。这些测试还揭示了本节中反复出现的若干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">主题的早期形态：该早期快照在完成隐蔽附带任务而不被监控器标记方面明显优于其前代模型；</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">其显著更强的单次前向传播推理能力，使得不出现在可读思考文本中的未对齐策略性思考变得更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="322.63" font-size="11.00" class="sc-notoserifcjksc">有可能；并且它表现出歪曲自身工作的倾向，例如捏造已完成的步骤或输入，或在困难的数学情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="338.25" font-size="11.00" class="sc-notoserifcjksc">境中明知证明错误仍提交。它的能力使这些问题在对话记录中更难被发现，但仍然可以检测到。</text><text x="72.00 78.02 80.58 85.05 87.61 93.63 96.19" y="455.02" font-size="11.00" class="sc-lorabold">4.1.4.3</text><text x="105.24 116.24 127.24" y="455.02" font-size="11.00" class="sc-notoserifcjkscbold">局限性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">这项工作是针对内部部署中最紧迫的未对齐风险所做的一次粗略的放行与否检查，且是在一些限</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">制条件下进行的。在后来的一次复盘中，我们确定了若干未来可改进之处，包括需要在更早的快</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">照上对评估和红队测试进行试运行，以排查任何问题。此外，我们发现这项工作在我们最为担心</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="534.27" font-size="11.00" class="sc-notoserifcjksc">的长时间运行的智能体轨迹中对模型的压力测试不够充分。这是多种因素共同造成的：第一，自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="565.51" font-size="11.00" class="sc-notoserifcjksc">话记录才能发现它们；第二，在测试期间将访问权限限制在一小部分人之间，与提供如同其随后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="581.13" font-size="11.00" class="sc-notoserifcjksc">在内部使用中所遇到的那样多样化的环境，二者之间存在矛盾；第三，</text><text x="413.00 418.67" y="581.13" font-size="11.00" class="sc-loraregular">24</text><text x="427.52 438.52 449.52 460.52 471.52 482.52 493.52 504.52 515.52 526.52" y="581.13" font-size="11.00" class="sc-notoserifcjksc">小时的窗口促使人们把</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="596.75" font-size="11.00" class="sc-notoserifcjksc">注意力集中在最明显的失败上。如</text><text x="239.89 245.76 251.72 254.42" y="596.75" font-size="11.00" class="sc-loraregular">§4.1</text><text x="261.32 272.32 283.32 294.32 305.32 316.32 327.32 338.32 349.32 360.32 371.32 382.32 393.32 404.32 415.32 426.32 437.32 448.32 459.32 470.32 481.32 492.32 503.32 514.32 525.32" y="596.75" font-size="11.00" class="sc-notoserifcjksc">所述，我们最终在该模型上观察到的最令人担忧的行为并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="612.37" font-size="11.00" class="sc-notoserifcjksc">未在这一窗口中被发现，而是直到随后受监控的内部使用中才显现出来。尽管如此，我们认为这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="627.99" font-size="11.00" class="sc-notoserifcjksc">项新的内部部署前测试是值得进行的，我们将在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">未来的模型上重复进行。我们正在投入资源开展试运行，以及更多在真实智能体脚手架内运行的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估，以便这一检查环节的未来迭代能提供更多信息。</text><text x="72.00 81.25 84.89" y="132.58" font-size="14.00" class="sc-poppinssemibold">4.2</text><text x="96.26 110.26 124.26 138.26 152.26 166.26 180.26 194.26 208.26 222.26 236.26" y="132.58" font-size="14.00" class="sc-notosanscjkscbold">对齐评估的主要行为证据</text><text x="72.00 80.59 83.97 91.43 94.82" y="169.69" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.2.1</text><text x="102.61 115.61 128.61 141.61 154.61 167.61 180.61 193.61" y="169.69" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">试点使用中的反馈</text><text x="72.00 78.02 80.58 86.44 89.01 93.47 96.04" y="201.57" font-size="11.00" class="sc-lorabold">4.2.1.1</text><text x="103.39 114.39 125.39 136.39 147.39 158.39 169.39 180.39 191.39 202.39 213.39" y="201.57" font-size="11.00" class="sc-notoserifcjkscbold">与对齐相关的非正式反馈</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="233.95" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88" y="233.95" font-size="11.00" class="sc-notoserifcjksc">在其开发后期阶段已在内部广泛使用，并已证明广受欢迎，与</text><text x="494.77 502.46 505.45 511.06 517.63 524.21" y="233.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="249.57" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="119.66 130.66 141.66 152.66 163.66 174.66 185.66 196.66 207.66 218.66 229.66 240.66 251.66 262.66 273.66 284.66 295.66 306.66 317.66 328.66 339.66 350.66 361.66 372.66 383.66 394.66 405.66 416.66 427.66 438.66 449.66 460.66 471.66 482.66" y="249.57" font-size="11.00" class="sc-notoserifcjksc">等先前模型相比，它能完成更复杂的任务，且完成任务更为可靠。对于最终的</text><text x="496.56 504.24 507.24 512.85 519.41 525.99" y="249.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="265.19" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="265.19" font-size="11.00" class="sc-notoserifcjksc">模型，内部反馈中最明显的主题是过度主动或执意坚持的行为，即模型在遇到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="280.81" font-size="11.00" class="sc-notoserifcjksc">明显需要等待人工介入的障碍时，仍坚持尝试完成任务。这似乎类似于上文所述高风险鲁莽行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="296.43" font-size="11.00" class="sc-notoserifcjksc">模式的一种更常见、破坏性较小的形式。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="395.30" font-size="11.00" class="sc-notoserifcjksc">型中会引发问题，但顶层的</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="395.30" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="395.30" font-size="11.00" class="sc-notoserifcjksc">（负责指挥子智能体）会成功地持续跟进其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="410.92" font-size="11.00" class="sc-notoserifcjksc">子智能体，直到它对整体结果有理由充满信心。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="460.64" font-size="11.00" class="sc-notoserifcjksc">除此之外，模型早期版本中反复出现、但在最终版本中似乎已大幅改善的问题包括：</text><text x="108.00 119.00 130.00" y="524.84" font-size="11.00" class="sc-notoserifcjksc">以理解</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="589.60" font-size="11.00" class="sc-notoserifcjksc">多的精力来记录自身状态，方式与我们在先前模型中所见类似。</text><text x="108.00 119.00" y="638.18" font-size="11.00" class="sc-notoserifcjksc">似。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="671.14" font-size="11.00" class="sc-notoserifcjksc">与外部合作伙伴的小规模试点使用中，没有发现任何严重的对齐相关事件报告，也没有发现除此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="686.76" font-size="11.00" class="sc-notoserifcjksc">处所述之外的任何对齐相关问题。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="72.00 78.02 80.58 86.44 89.01 93.47 96.04" y="82.61" font-size="11.00" class="sc-lorabold">4.2.1.2</text><text x="104.79 115.79 126.79 137.79 148.79 159.79 170.79" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">自动化离线监控</text><text x="72.00 83.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">我们</text><text x="94.00 105.00 116.00 127.00 138.00 149.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="160.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="173.89 179.89 182.59 188.59 191.30" y="114.99" font-size="11.00" class="sc-loraregular">5.5.1</text><text x="198.19 209.19 220.19 231.19 242.19 253.19 264.19 275.19 286.19 297.19 308.19 319.19 330.19" y="114.99" font-size="11.00" class="sc-notoserifcjksc">节所述的自动化离线监控，在</text><text x="344.08 351.77 354.77 360.38 366.94 373.52 379.48 382.38 392.31 398.17 402.43 409.02 415.45 420.55 423.44 430.10 434.79 440.70 446.25 449.34 455.26" y="114.99" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="466.97 477.97 488.97 499.97 510.97 521.97" y="114.99" font-size="11.00" class="sc-notoserifcjksc">的早期版本中</text><text x="236.51 244.19 247.19 252.80 259.36 265.94 271.90 274.80 284.73 290.59 294.85 301.44 307.87 312.97 315.86 322.53 327.21 333.12 338.67 341.76 347.68" y="130.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">罕见的试图规避限制以实现用户指定目标的某种版本的情况，如上文引言中所讨论的。我</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">们检测到的绕过尝试从未试图隐蔽，并且常常无效。根据我们的自动化离线流水线，在内</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">部受监控的分布上，我们在不到</text><text x="264.89 271.55 274.09 280.92 284.92" y="211.01" font-size="11.00" class="sc-loraregular">0.01%</text><text x="297.39 308.39 319.39 330.39 341.39 352.39 363.39 374.39 385.39 396.39 407.39 418.39 429.39 440.39 451.39 462.39 473.39 484.39 495.39 506.39 517.39 528.39" y="211.01" font-size="11.00" class="sc-notoserifcjksc">的补全中看到了这种情况。绕过最常发生在以下情</text><text x="108.00 119.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">形：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">境中启动时，它有时会尝试以限制较少的权限启动一个作业；当缺少</text><text x="476.89 483.13 486.12 491.80 497.65" y="276.34" font-size="11.00" class="sc-loraregular">Slack</text><text x="506.45" y="276.34" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="144.00 152.37 155.64 159.90 168.27 174.83" y="291.96" font-size="11.00" class="sc-loraregular">GitHub</text><text x="184.13 195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13" y="291.96" font-size="11.00" class="sc-notoserifcjksc">凭据时，它有时会在可用资源中搜寻此类凭据；</text><text x="144.00 150.40 156.08 161.17" y="357.30" font-size="11.00" class="sc-loraregular">bash</text><text x="170.65 181.65 192.65 203.65 214.65 225.65 236.65 247.65 258.65 269.65 280.65 291.65 302.65 313.65 324.65 335.65 346.65 357.65 368.65 379.65 390.65 401.65 412.65 423.65 434.65 445.65 456.65 467.65 478.65 489.65 500.65 511.65 522.65" y="357.30" font-size="11.00" class="sc-notoserifcjksc">命令无法执行时，它有时会使用一条被自动允许、但可间接实现任意代码执</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc">行的命令；当遇到拦截分类器故障时，它有时会（未成功地）尝试通过将命令编码</text><text x="144.00" y="388.54" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="157.89 164.29 169.97 175.06 181.03 187.38" y="388.54" font-size="11.00" class="sc-loraregular">base64</text><text x="196.24 207.24 218.24 229.24 240.24" y="388.54" font-size="11.00" class="sc-notoserifcjksc">来绕过它。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">罕见的以比用户可能预期的限制更少的权限启动其他子智能体的情况。在一个案例中，该</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">模型的一个先前版本（在被阻止使用</text><text x="286.89 293.49 300.09 306.69 313.29 319.89 326.49 333.09 339.69 346.29 352.89 359.49 366.09 372.69 379.29 385.89 392.49 399.09 405.69 412.29 418.89 425.49 432.09 438.69 445.29 451.89 458.49 465.09 471.69 478.29" y="454.46" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--dangerously-skip-permissions</text><text x="487.82 498.82 509.82 520.82" y="454.46" font-size="11.00" class="sc-notoserifcjksc">之后）在</text><text x="108.00 119.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="132.89 137.15 146.98 153.55" y="470.08" font-size="11.00" class="sc-loraregular">tmux</text><text x="162.27 173.27 184.27 195.27 206.27 217.27" y="470.08" font-size="11.00" class="sc-notoserifcjksc">会话中以默认</text><text x="231.17 238.86 241.85 247.46 254.03 260.60 266.57 269.46 277.15 283.58 290.16" y="470.08" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="299.02 310.02 321.02 332.02 343.02 354.02 365.02 376.02 387.02 398.02 409.02 420.02 431.02 442.02 453.02 464.02 475.02 486.02" y="470.08" font-size="11.00" class="sc-notoserifcjksc">权限启动了一个智能体，然后编写了一个</text><text x="499.91 506.31 511.99 517.08" y="470.08" font-size="11.00" class="sc-loraregular">bash</text><text x="526.56" y="470.08" font-size="11.00" class="sc-notoserifcjksc">脚</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="485.70" font-size="11.00" class="sc-notoserifcjksc">本，在新智能体遇到权限提示时自动模拟按键以批准命令。根据我们的自动化离线流水</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="501.32" font-size="11.00" class="sc-notoserifcjksc">线，我们在不到</text><text x="187.89 194.55 197.09 203.92 207.92" y="501.32" font-size="11.00" class="sc-loraregular">0.01%</text><text x="220.39 231.39 242.39 253.39 264.39 275.39 286.39 297.39 308.39 319.39 330.39 341.39" y="501.32" font-size="11.00" class="sc-notoserifcjksc">的补全中看到了这种情况。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="552.71" font-size="11.00" class="sc-notoserifcjksc">极其罕见的明显不诚实行为。在被要求查找漏
