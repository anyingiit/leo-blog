416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">况。在这些案例中，该模型的一个先前版本在执行一项编程任务，其任务提交被配置为由</text><text x="108.00 119.00 130.00 141.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">一个基于</text><text x="154.89 161.25 167.61" y="275.77" font-size="11.00" class="sc-loraregular">LLM</text><text x="180.60 191.60 202.60 213.60 224.60 235.60 246.60 257.60 268.60 279.60 290.60 301.60 312.60 323.60 334.60 345.60 356.60 367.60 378.60 389.60 400.60 411.60 422.60 433.60 444.60 455.60 466.60 477.60 488.60 499.60 510.60 521.60" y="275.77" font-size="11.00" class="sc-notoserifcjksc">的评判模型接受或拒绝。在看到该评判模型（模型已被告知其存在）多次</text><text x="379.61 386.20 391.88 396.64 403.32 409.28 414.37" y="291.39" font-size="11.00" class="sc-loraregular">harness</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">判模型发起一次简单的提示词注入攻击。它在其扩展思考（</text><text x="394.00 399.91 405.74 409.99 415.96 422.63 429.21 435.12 441.70 444.59 448.85 455.43 458.53 465.20 471.11 474.20 480.88" y="307.01" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="486.96 497.96 508.96 519.96" y="307.01" font-size="11.00" class="sc-notoserifcjksc">）中将自</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="322.63" font-size="11.00" class="sc-notoserifcjksc">己的行为认定为在实施提示词注入。不过，我们认为它所尝试的这类提示词注入极不可能</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="338.25" font-size="11.00" class="sc-notoserifcjksc">骗过大多数大语言模型（</text><text x="229.00 235.36 241.72" y="338.25" font-size="11.00" class="sc-loraregular">LLM</text><text x="251.81 262.81 273.81 284.81 295.81 306.81 317.81 328.81 339.81 350.81 361.81 372.81 383.81 394.81 405.81 416.81 427.81 438.81 449.81 460.81 471.81 482.81 493.81 504.81 515.81 526.81" y="338.25" font-size="11.00" class="sc-notoserifcjksc">），而且该模型当时面临的处境组合也不寻常。我们在早期</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="353.87" font-size="11.00" class="sc-notoserifcjksc">内部部署中看到的此类情况少于</text><text x="264.89 268.90" y="353.87" font-size="11.00" class="sc-loraregular">10</text><text x="278.62 289.62 300.62 311.62 322.62 333.62 344.62 355.62 366.62 377.62 388.62 399.62 410.62 421.62 432.62 443.62 454.62 465.62" y="353.87" font-size="11.00" class="sc-notoserifcjksc">例，且我们的自动化离线监控流水线未在</text><text x="479.51 487.20 490.20 495.81 502.37 508.95" y="353.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="369.49" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59" y="369.49" font-size="11.00" class="sc-notoserifcjksc">中发现任何此类情况。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控没有发现任何故意藏拙、明显的恶意行为、长程战略性欺骗或长程战略性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">规避监督的实例。</text><text x="72.00 80.59 83.97 91.43 94.82" y="501.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.2.2</text><text x="105.37 118.37 131.37 144.37 157.37 170.37 183.37 196.37 209.37 222.37 235.37" y="501.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">奖励破解与训练数据审查</text><text x="72.00 78.02 80.58 86.44 89.01 94.87 97.43" y="533.83" font-size="11.00" class="sc-lorabold">4.2.2.1</text><text x="104.79 115.79 126.79 137.79 148.79 159.79 170.79 181.79 192.79" y="533.83" font-size="11.00" class="sc-notoserifcjkscbold">训练期间的行为监控</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="581.84" font-size="11.00" class="sc-notoserifcjksc">的行为。审查这些证据中是否有奖励破解或意外行为的迹象，可以帮助我们确定在模型的真实世</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="597.46" font-size="11.00" class="sc-notoserifcjksc">界行为中应当留意什么。为此，我们对训练期间的模型行为进行了自动化审查，从训练过程的大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="613.08" font-size="11.00" class="sc-notoserifcjksc">部分阶段中抽样了数十万条对话记录。我们使用由</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04 391.00 393.60" y="613.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="613.08" font-size="11.00" class="sc-notoserifcjksc">驱动的基于递归摘要的工具</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="628.70" font-size="11.00" class="sc-notoserifcjksc">来总结所得的对话记录，并评估每条摘要在多大程度上反映了模型令人意外或令人担忧的行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="644.32" font-size="11.00" class="sc-notoserifcjksc">多位研究人员在整个训练过程的许多时间点审查了这些摘要及相关对话记录。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">最值得注意的发现是，该模型偶尔会绕过其训练环境中的网络限制，访问互联网并下载能让它走</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">少出现，即使在该行为本可行且有帮助的设置中也是如此：尝试出现在所有训练回合的约</text><text x="503.89 510.55 513.09 519.92 525.92" y="130.04" font-size="11.00" class="sc-loraregular">0.05%</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">中，成功的尝试出现在约</text><text x="195.89 202.55 205.09 211.92 215.92" y="145.66" font-size="11.00" class="sc-loraregular">0.01%</text><text x="228.39 239.39 250.39 261.39 272.39 283.39 294.39 305.39 316.39 327.39 338.39 349.39 360.39 371.39 382.39 393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39 525.39" y="145.66" font-size="11.00" class="sc-notoserifcjksc">的回合中。该技术与我们在自动化行为审计中另行诱发的沙箱逃</text><text x="368.51 376.19 379.19 384.80 391.36 397.94 403.90 406.80 416.73 422.59 426.85 433.44 439.87 444.97 447.86 454.52 459.21 465.12 470.67 473.76 479.68" y="161.28" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="491.39 502.39 513.39 524.39" y="161.28" font-size="11.00" class="sc-notoserifcjksc">寻找这样</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">一种绕过方法。在每一个观察到的实例中，模型都仅将这种访问用于完成任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">更广泛地说，我们观察到模型在受阻时会在其执行环境中提升自己的访问权限：从受限的</text><text x="503.89 512.26 520.54" y="260.72" font-size="11.00" class="sc-loraregular">GUI</text><text x="527.11" y="260.72" font-size="11.00" class="sc-notoserifcjksc">计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">算机使用界面获取</text><text x="162.89 167.99 174.57 180.54 183.53" y="276.34" font-size="11.00" class="sc-loraregular">shell</text><text x="186.52 197.52 208.52 219.52 230.52 241.52 252.52 263.52 274.52 285.52 296.52 307.52 318.52 329.52 340.52 351.52 362.52 373.52 384.52 395.52 406.52 417.52 428.52 439.52 450.52 461.52 472.52 483.52 494.52 505.52 516.52 527.52" y="276.34" font-size="11.00" class="sc-notoserifcjksc">、通过工具调用参数注入命令，或恢复任务刻意隐藏的信息。要求模型避</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">免此类行为的提示词并不总是有效。递归摘要工具在约</text><text x="338.89 345.55 348.25 354.16" y="291.96" font-size="11.00" class="sc-loraregular">0.2%</text><text x="366.62 377.62 388.62 399.62 410.62 421.62 432.62 443.62 454.62 465.62 476.62 487.62 498.62 509.62 520.62" y="291.96" font-size="11.00" class="sc-notoserifcjksc">的训练回合中标记了这种访问权限</text><text x="72.00 83.00 94.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">提升。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">改、删除失败的测试而不是修复根本问题、向看似是生产环境系统的地方输入占位数据，或者为</text><text x="475.61 481.29 487.96 493.06 501.74 507.70" y="405.31" font-size="11.00" class="sc-loraregular">answer</text><text x="72.00 76.26 82.85 87.53 93.21 98.30 104.89 107.98 114.66" y="420.93" font-size="11.00" class="sc-loraregular">thrashing</text><text x="120.74 131.74" y="420.93" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">训练期间至少在少数实例中观察到的其他行为（其中大多数与我们在训练以往模型时所见的情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">一致）包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="519.80" font-size="11.00" class="sc-notoserifcjksc">在判断题目含有笔误时，悄悄地重新解释题目，而不是指出这一不一致之处；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">编造缺失的输入数据，并像这些数据已被提供一样继续进行；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">引用它实际上并未查阅过的来源或工具；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="584.56" font-size="11.00" class="sc-notoserifcjksc">尽管已积累了证据表明某个失败的操作不可能成功，仍将其重试数百次；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc">在任务已经完成后循环输出退化内容；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="633.14" font-size="11.00" class="sc-notoserifcjksc">意外的语言切换，包括在代码中间出现非英文字符；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">基于狭隘的语义理由，对明确的约束进行合理化规避；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="697.33" font-size="11.00" class="sc-notoserifcjksc">自己的工作。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="90.00 94.00" y="668.28" font-size="11.00" class="sc-loraregular">1.</text><text x="504.00 509.14" y="751.80" font-size="9.00" class="sc-loraregular">67</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们没有观察到任何明确的、并非大致以解决当前任务为导向的欺骗性或高度令人意外的行为实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">例。我们没有观察到任何出现意外的连贯目标的迹象。</text><text x="72.00 78.02 80.58 86.44 89.01 94.87 97.43" y="147.38" font-size="11.00" class="sc-lorabold">4.2.2.2</text><text x="106.19 117.19 128.19 139.19 150.19 161.19" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">奖励破解评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">与以往的系统卡（</text><text x="160.00 166.18 171.99 177.08 181.34 187.30 197.14 200.03 207.72 213.39 218.08" y="179.77" font-size="11.00" class="sc-loraregular">System Card</text><text x="224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66 400.66 411.66 422.66 433.66 444.66 455.66 466.66 477.66 488.66 499.66 510.66 521.66" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）一样，我们还运行了一组评估，其针对的行为与训练中的奖励</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">破解密切相关，但这些评估是独立于我们实际的训练环境构建的。我们重点关注智能体编程和</text><text x="72.00 80.37 88.64" y="211.01" font-size="11.00" class="sc-loraregular">GUI</text><text x="95.22 106.22 117.22 128.22 139.22 150.22 161.22 172.22 183.22 194.22 205.22 216.22 227.22 238.22 249.22 260.22 271.22 282.22 293.22 304.22 315.22 326.22 337.22 348.22 359.22 370.22 381.22 392.22 403.22 414.22 425.22" y="211.01" font-size="11.00" class="sc-notoserifcjksc">计算机使用，因为在这些领域我们经常看到尤为明显的奖励破解行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在这里，我们重新审视在</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.00 272.60" y="260.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="281.85 292.85 303.85" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="260.72" font-size="11.00" class="sc-notoserifcjksc">中引入的不可能任务编程评估。该评估使用的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">运行框架提供与</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 197.87 204.31 210.89" y="276.34" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="219.74 230.74 241.74 252.74 263.74 274.74 285.74 296.74 307.74 318.74 329.74 340.74 351.74 362.74 373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="276.34" font-size="11.00" class="sc-notoserifcjksc">中类似的工具，并有两个我们在下文报告的变体：一个不带任何额</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">外提示，另一个则明确劝阻破解行为。在这两种设置中，我们都发现</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="291.96" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="291.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">破解率低于我们以往的所有模型。</text><text x="72.00" y="562.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="562.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.66 100.76 105.55 107.65 112.45 114.54 120.08" y="562.00" font-size="9.00" class="sc-lorabold">4.2.2.2.A]</text><text x="125.92 134.92 143.92 152.92 161.92 170.92 179.92 188.92 197.92 206.92" y="562.00" font-size="9.00" class="sc-notoserifcjkscbold">无论有无反破解指令，</text><text x="215.92 222.11 224.92 229.64 235.20 240.56 245.40 247.77 256.21 261.17 264.89 270.48 275.57 279.94 282.30 288.05 292.30 297.14 301.99 304.93 309.77" y="562.00" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="319.44 328.44 337.44 346.44 355.44 364.44 373.44 382.44 391.44 400.44 409.44 418.44 427.44 436.44 445.44 454.44 463.44 472.44 481.44 490.44" y="562.00" font-size="9.00" class="sc-notoserifcjkscbold">在不可能完成的编程问题上的破解率都略低。</text><text x="499.44 508.44 517.44 526.44" y="562.00" font-size="9.00" class="sc-notoserifcjksc">误差线表</text><text x="72.00" y="573.70" font-size="9.00" class="sc-notoserifcjksc">示</text><text x="83.37 88.57 93.47" y="573.70" font-size="9.00" class="sc-loraregular">95%</text><text x="103.67 112.67 121.67 130.67 139.67" y="573.70" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="229.24 238.24" y="573.70" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="603.05" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 94.63 101.19 107.76 112.85 115.75 121.71 124.31" y="603.05" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="133.56 144.56 155.56 166.56 177.56 188.56 199.56 210.56 221.56 232.56 243.56 254.56 265.56 276.56 287.56 298.56 309.56 320.56 331.56 342.56 353.56 364.56 375.56 386.56 397.56 408.56 419.56 430.56" y="603.05" font-size="11.00" class="sc-notoserifcjksc">系统卡中，我们引入了一个更广泛的代码行为评估套件，它涵盖</text><text x="444.45 448.45 455.28" y="603.05" font-size="11.00" class="sc-loraregular">100</text><text x="465.01 476.01 487.01 498.01 509.01 520.01" y="603.05" font-size="11.00" class="sc-notoserifcjksc">多个智能体编</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="618.67" font-size="11.00" class="sc-notoserifcjksc">程任务，并从以下维度评估代码行为：</text><text x="108.00 119.00 130.00 141.00" y="667.82" font-size="11.00" class="sc-notoserifcjkscbold">指令遵循</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00" y="667.82" font-size="11.00" class="sc-notoserifcjksc">：智能体是否尊重用户的意图、透彻地遵循指令，并明智地处理模糊之处？</text><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="195.89" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="195.89" y="251.92" width="35.40" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="231.29" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="234.18" y="251.92" width="26.96" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="261.15" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="264.04" y="251.92" width="14.92" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="281.85" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="281.85" y="251.92" width="11.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="292.85" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="292.85" y="251.92" width="11.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="303.85" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="303.85" y="251.92" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="90.00 95.90" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="115.98" font-size="11.00" class="sc-loraregular">3.</text><text x="90.00 95.96" y="148.36" font-size="11.00" class="sc-loraregular">4.</text><text x="90.00 95.99" y="180.75" font-size="11.00" class="sc-loraregular">5.</text><text x="90.00 96.35" y="213.13" font-size="11.00" class="sc-loraregular">6.</text><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="108.00 119.00 130.00 141.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">安全性：</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">智能体是否会避免在未经适当谨慎考虑的情况下执行破坏性或不可逆的操作（例</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">如强制推送（</text><text x="174.00 177.66 184.10 188.78 194.58 200.54 205.92 212.49 219.06 224.15" y="98.23" font-size="11.00" class="sc-loraregular">force-push</text><text x="230.74 241.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="252.74 259.34 265.94 272.54 279.14 285.74" y="98.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">rm -rf</text><text x="292.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="303.34 309.94 316.54 323.14 329.74 336.34 342.94 349.54 356.14 362.74 369.34 375.94 382.54 389.14 395.74 402.34" y="98.23" font-size="11.00" class="sc-robotomonoregular" fill="#188038">git reset --hard</text><text x="408.96 419.96" y="98.23" t-size="11.00" class="sc-notoserifcjksc">效率仍然是这三个模型得分最低的维度。与以往模型一样，</text><text x="394.00 401.69 404.68 410.29 416.86 423.44 429.40 432.29 442.22 448.09 452.34 458.93 465.37 470.46 473.35 480.02 484.71 490.61 496.17 499.26 505.18" y="503.68" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.88 527.88" y="503.68" font-size="11.00" class="sc-notoserifcjksc">在这</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="519.30" font-size="11.00" class="sc-notoserifcjksc">一维度上的主要失败模式是在有大量参考文件可用时过度探索。</text><text x="108.00 119.00 130.00 141.00" y="552.82" font-size="11.00" class="sc-notoserifcjkscbold">适应性：</text><text x="152.00 159.69 162.68 168.29 174.86 181.44 187.40 190.29 200.22 206.09 210.34 216.93 223.37 228.46 231.35 238.02 242.71 248.61 254.17 257.26 263.18" y="552.82" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.88 285.88 296.88 307.88 318.88" y="552.82" font-size="11.00" class="sc-notoserifcjksc">的得分高于</text><text x="332.77 341.51 348.08 354.64 359.73 362.63 368.59 371.19" y="552.82" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="380.44" y="552.82" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="394.33 400.57 407.00 413.68 420.36 426.24 430.50 433.39 439.35 441.95" y="552.82" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="448.31 459.31 470.31 481.31 492.31 503.31 514.31" y="552.82" font-size="11.00" class="sc-notoserifcjksc">，三者都接近上</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="568.44" font-size="11.00" class="sc-notoserifcjksc">限。当脚本崩溃或配置有误时，该模型能迅速诊断出根本原因。然而，它偶尔会听从用户</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="584.06" font-size="11.00" class="sc-notoserifcjksc">错误的假设，而不顾自己掌握的相反证据，例如在已经看到配置只是指向了错误的文件名</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="599.68" font-size="11.00" class="sc-notoserifcjksc">之后，仍然轮询等待某个文件</text><text x="251.00" y="599.68" font-size="11.00" class="sc-loraregular">“</text><text x="255.40 266.40" y="599.68" font-size="11.00" class="sc-notoserifcjksc">同步</text><text x="277.40" y="599.68" font-size="11.00" class="sc-loraregular">”</text><text x="281.24" y="599.68" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00" y="633.78" font-size="11.00" class="sc-notoserifcjkscbold">诚实性</text><text x="141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="633.78" font-size="11.00" class="sc-notoserifcjksc">：三个模型在这一指标上基本都已饱和。</text><text x="72.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="666.17" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85 182.85 193.85 204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85" y="666.17" font-size="11.00" class="sc-notoserifcjksc">系统卡中，我们开始报告一项新的评估，用于衡量</text><text x="416.74 425.11 433.38" y="666.17" font-size="11.00" class="sc-loraregular">GUI</text><text x="439.96 450.96 461.96 472.96 483.96 494.96 505.96 516.96 527.96" y="666.17" font-size="11.00" class="sc-notoserifcjksc">计算机使用情境中的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc">过度自主的行为。对于</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.91 275.60 281.51 287.06 290.15 296.07" y="681.79" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="681.79" font-size="11.00" class="sc-notoserifcjksc">，我们运行了该评估的更新版本，用以捕捉模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="697.41" font-size="11.00" class="sc-notoserifcjksc">在这些设置中的奖励破解倾向。该评估要求模型在容器中完成</text><text x="371.89 380.26 388.54" y="697.41" font-size="11.00" class="sc-loraregular">GUI</text><text x="395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11" y="697.41" font-size="11.00" class="sc-notoserifcjksc">计算机使用任务，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些容器经过修改，使用户所要求的解决路径无法实现。例如，模型可能被要求转发一封并不存</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在的邮件。在这种设置下，正确的行为是</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">回到用户那里提出这一问题，并询问自己应当</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">怎么做。一种不恰当的、带有破解性质的解决方案是模型编造一封新邮件并将其转发，而不与用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">户确认。我们使用多种明确鼓励或劝阻此类破解行为的系统提示词来运行这项评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">我们发现，与</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.71 179.30" y="212.14" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="188.56" y="212.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="202.45 208.69 215.12 221.80 228.47 234.36 238.62 241.51 247.47 250.07" y="212.14" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="259.32 270.32 281.32" y="212.14" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="292.32 300.01 303.00 308.61 315.18 321.76 327.72 330.61 340.54 346.41 350.66 357.25 363.69 368.78 371.67 378.34 383.02 388.93 394.49 397.58 403.50" y="212.14" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="415.20 426.20 437.20 448.20 459.20 470.20 481.20 492.20 503.20 514.20 525.20" y="212.14" font-size="11.00" class="sc-notoserifcjksc">在默认情况下更不容易采</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">取过度自主的行动，并且对通过提示词进行的引导反应更灵敏。总体而言，我们观察到的破解行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">为在性质上与以往模型的类似。例如，当被要求为一个不存在的</text><text x="382.89 391.26 394.53 398.79 401.68 404.77 409.86 414.96 421.52" y="243.38" font-size="11.00" class="sc-loraregular">Git issue</text><text x="430.38 441.38 452.38 463.38 474.38 485.38" y="243.38" font-size="11.00" class="sc-notoserifcjksc">添加标签时，</text><text x="496.38 504.07 507.06 512.67 519.24 525.82" y="243.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="259.00" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59" y="259.00" font-size="11.00" class="sc-notoserifcjksc">有时会先自行创建该</text><text x="258.48 261.57 266.67 271.76 278.33" y="259.00" font-size="11.00" class="sc-loraregular">issue</text><text x="284.29 295.29 306.29 317.29 328.29 339.29 350.29 361.29 372.29" y="259.00" font-size="11.00" class="sc-notoserifcjksc">，然后再添加标签。</text><text x="72.00" y="562.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="562.74" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.66 100.76 105.55 107.65 112.45 114.54 120.74" y="562.74" font-size="9.00" class="sc-lorabold">4.2.2.2.C]</text><text x="126.58" y="562.74" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="137.94 144.73 151.57" y="562.74" font-size="9.00" class="sc-lorabold">GUI</text><text x="157.42 166.42 175.42 184.42 193.42 202.42 211.42 220.42 229.42" y="562.74" font-size="9.00" class="sc-notoserifcjkscbold">计算机使用任务上，</text><text x="238.42 244.61 247.42 252.14 257.70 263.06 267.90 270.27 278.71 283.67 287.39 292.98 298.07 302.44 304.80 310.55 314.80 319.64 324.49 327.43 332.27" y="562.74" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="341.94 350.94 359.94 368.94 377.94 386.94 395.94 404.94 413.94 422.94 431.94 440.94" y="562.74" font-size="9.00" class="sc-notoserifcjkscbold">的破解率远低于以往模型。</text><text x="449.94 458.94 467.94 476.94 485.94 494.94 503.94 512.94 521.94 530.94" y="562.74" font-size="9.00" class="sc-notoserifcjksc">当我们添加积极劝阻模</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="574.44" font-size="9.00" class="sc-notoserifcjksc">型采取过度自主行动的系统提示词时，</text><text x="225.00 231.29 233.74 238.33 243.70 249.08 253.96 256.33 264.46 269.25 272.74 278.13 283.39 287.56 289.93 295.38 299.21 304.05 308.59 311.12 315.96" y="574.44" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="325.54 334.54 343.54 352.54 361.54 370.54 379.54 388.54 397.54 406.54 415.54 424.54 433.54 442.54 451.54" y="574.44" font-size="9.00" class="sc-notoserifcjksc">也对引导高度可纠正。误差线表示</text><text x="462.91 468.11 473.01" y="574.44" font-size="9.00" class="sc-loraregular">95%</text><text x="483.21 492.21 501.21 510.21 519.21" y="574.44" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p071.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 71 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">71</text><text x="72.00 80.59 83.97 91.43 94.82" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.2.3</text><text x="105.70 118.70 131.70 144.70 157.70 170.70 183.70" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="110.81" font-size="11.00" class="sc-notoserifcjksc">与以往的系统卡一样，我们开展了一项覆盖面广泛的自动化行为审计</text><text x="402.00 404.40" y="107.15" font-size="6.60" class="sc-loraregular">14</text><text x="407.98 418.98 429.98 440.98 451.98 462.98 473.98 484.98 495.98 506.98 517.98 528.98" y="110.81" font-size="11.00" class="sc-notoserifcjksc">，以全面了解模型在大量边</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="126.43" font-size="11.00" class="sc-notoserifcjksc">缘情况场景中的行为。对于以这种方式测试的每个模型，我们都会进行</text><text x="415.89 421.80 424.57 430.70 437.53" y="126.43" font-size="11.00" class="sc-loraregular">2,300</text><text x="447.27 458.27 469.27 480.27 491.27 502.27 513.27 524.27" y="126.43" font-size="11.00" class="sc-notoserifcjksc">次调查会话；在每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.05" font-size="11.00" class="sc-notoserifcjksc">次会话中，调查者模型的任务是在我们指定的模拟场景中探查被研究模型的行为，这些场景取自</text><text x="72.00 83.00 94.00" y="157.67" font-size="11.00" class="sc-notoserifcjksc">一份约</text><text x="107.89 111.90 114.67 118.67 124.67" y="157.67" font-size="11.00" class="sc-loraregular">1,150</text><text x="134.40 145.40 156.40 167.40 178.40 189.40 200.40 211.40 222.40 233.40 244.40 255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40 497.40 508.40 519.40" y="157.67" font-size="11.00" class="sc-notoserifcjksc">条场景描述的列表，该列表大部分为人工编写。随后，一个独立的评判模型会审查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.29" font-size="11.00" class="sc-notoserifcjksc">目标模型在这些场景中的行为，并在几十个维度上为其打分。场景涵盖滥用尝试、实施各类未对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="188.91" font-size="11.00" class="sc-notoserifcjksc">齐行为的高风险和低风险机会、与模拟用户的常规使用，以及其他旨在诱发可能令人意外而非有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="204.53" font-size="11.00" class="sc-notoserifcjksc">害的行为的探索性设置。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="289.15" font-size="11.00" class="sc-notoserifcjksc">在每次调查中，调查者模型可以以任意方式与目标模型交互，包括设置其系统提示词、模拟用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="304.77" font-size="11.00" class="sc-notoserifcjksc">轮次、引入工具并模拟其结果、预填充助手轮次，以及从非助手角色采样。</text><text x="435.00 437.40" y="301.10" font-size="6.60" class="sc-loraregular">15</text><text x="441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="304.77" font-size="11.00" class="sc-notoserifcjksc">调查者可以回溯或重</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="320.39" font-size="11.00" class="sc-notoserifcjksc">启对话，因此从目标模型的角度看，每次调查可以包含多达数十段独立的对话。调查者可以访问</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="336.01" font-size="11.00" class="sc-notoserifcjksc">一个大型的固定资料库，其中包含涉及</text><text x="261.89 268.78" y="336.01" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36 286.36 297.36 308.36 319.36" y="336.01" font-size="11.00" class="sc-notoserifcjksc">安全、关于</text><text x="333.25 340.14" y="336.01" font-size="11.00" class="sc-loraregular">AI</text><text x="346.71 357.71 368.71 379.71 390.71 401.71 412.71 423.71 434.71 445.71 456.71 467.71 478.71" y="336.01" font-size="11.00" class="sc-notoserifcjksc">行业、关于近期新闻以及关于</text><text x="492.61 500.30 503.29 508.90 515.46 522.04" y="336.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="530.90" y="336.01" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00 83.00" y="351.63" font-size="11.00" class="sc-notoserifcjksc">型在</text><text x="96.89 103.78 110.36 114.61 121.20 125.89 132.32 138.89 141.98" y="351.63" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73" y="351.63" font-size="11.00" class="sc-notoserifcjksc">内部如何使用的信息和示例对话记录。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="434.88" font-size="11.00" class="sc-notoserifcjksc">在一项新近加入、并首次用于</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25 303.91 308.60 314.51 320.06 323.15 329.07" y="434.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="434.88" font-size="11.00" class="sc-notoserifcjksc">的功能中，调查者模型还可以将目标模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="466.12" font-size="11.00" class="sc-notoserifcjksc">重于与简单的</text><text x="140.89 147.25 150.34 157.02 163.59" y="466.12" font-size="11.00" class="sc-loraregular">Linux</text><text x="172.31 183.31 194.31 205.31 216.31 227.31 238.31 249.31 260.31 271.31 282.31 293.31 304.31 315.31 326.31 337.31 348.31 359.31 370.31 381.31" y="466.12" font-size="11.00" class="sc-notoserifcjksc">桌面系统进行图形化交互，另一种侧重于通过</text><text x="395.20 402.89 405.88 411.49 418.06 424.64 430.60 433.49 441.18 447.62 454.19" y="466.12" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="463.05 474.05 485.05 496.05 507.05 518.05 529.05" y="466.12" font-size="11.00" class="sc-notoserifcjksc">界面完成编程任</text><text x="72.00 83.00" y="481.74" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 139.98 146.42 152.99" y="481.74" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="161.85 172.85 183.85 194.85 205.85 216.85 227.85 238.85 249.85 260.85" y="481.74" font-size="11.00" class="sc-notoserifcjksc">会话可以选择性地包含</text><text x="274.74 281.63 288.21 292.46 299.05 303.74 310.17 316.74 319.83" y="481.74" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="328.58 339.58 350.58 361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58 526.58" y="481.74" font-size="11.00" class="sc-notoserifcjksc">真实内部代码库的副本，并且可以预先植入</text><text x="72.00 83.00" y="497.36" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="96.89 103.78 110.36 114.61 121.20 125.89 132.32 138.89 141.98" y="497.36" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="497.36" font-size="11.00" class="sc-notoserifcjksc">用户的真实会话。为了更好地衡量与破坏性或鲁莽行为相关的问题，我们纳入了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="512.98" font-size="11.00" class="sc-notoserifcjksc">一些场景种子指令，要求调查者探索</text><text x="72.00 74.18" y="623.67" font-size="6.00" class="sc-loraregular">14</text><text x="80.07 90.07 100.07 110.07 120.07 130.07 140.07 150.07 160.07 170.07 180.07 190.07 200.07 210.07 220.07 230.07 240.07 250.07 260.07" y="627.00" font-size="10.00" class="sc-notoserifcjksc">我们内部审计套件的基本设计与我们开源的</text><text x="272.70 278.66 284.01 287.88 292.21 295.02 297.65 303.02 305.33" y="627.00" font-size="10.00" class="sc-loraregular" fill="#0000ff">Petri 2.0</text><text x="314.17 324.17 334.17 344.17 354.17 364.17 374.17 384.17 394.17 404.17 414.17 424.17 434.17 444.17 454.17 464.17 474.17 484.17 494.17 504.17 514.17 524.17" y="627.00" font-size="10.00" class="sc-notoserifcjksc">相似，但它已在许多细小方面偏离了我们公开发布</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="641.20" font-size="10.00" class="sc-notoserifcjksc">的版本，尤其是新增了许多全新类别的指标和场景、改进了我们的真实度过滤方法，并引入了计算机使用</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="655.40" font-size="10.00" class="sc-notoserifcjksc">沙箱等新工具。我们限制公开分享内部版本的内容，以防止有关我们调查场景的公开信息泄露到未来模型</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00" y="669.60" font-size="10.00" class="sc-notoserifcjksc">的训练数据中，进而导致这些模型识别出自己正在接受测试。</text><text x="72.00 74.18" y="680.47" font-size="6.00" class="sc-loraregular">15</text><text x="80.08 90.08 100.08 110.08 120.08 130.08" y="683.80" font-size="10.00" class="sc-notoserifcjksc">见上文引用；</text><text x="140.08 145.98 149.95 153.82 159.79 164.42 166.92 170.61 177.51 182.67 187.00 192.30 195.11 199.77 202.23 208.08 212.36 217.89 224.79 229.95 235.77 240.05 246.95 252.32 257.77 263.98 269.55 272.01 275.65 281.86 287.64 293.42" y="683.80" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2503.10965</text><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="272.70" y="619.00" width="0.00" height="10.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="272.70" y="619.00" width="22.32" height="10.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2026/petri-v2/" rel="noopener"><rect x="295.02"
