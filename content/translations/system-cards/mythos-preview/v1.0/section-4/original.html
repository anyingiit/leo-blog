.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38 102.38 118.38 134.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00 81.25 84.89" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29 107.29 121.29 135.29 149.29 163.29 177.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">引言与发现摘要</text><text x="72.00 80.59 83.97 88.68 92.06" y="161.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86 112.86 125.86 138.86 151.86 164.86 177.86 190.86 203.86 216.86 229.86 242.86 255.86 268.86 281.86 294.86 307.86 320.86" y="161.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言与重点：罕见但能力极强的鲁莽行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="189.19" font-size="11.00" class="sc-notoserifcjksc">在我们能够测量的几乎每一个维度上，</text><text x="259.00 266.69 269.68 275.29 281.86 288.44 294.40 297.29 307.22 313.09 317.34 323.93 330.37 335.46 338.35 345.02 349.71 355.61 361.17 364.26 370.18" y="189.19" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88" y="189.19" font-size="11.00" class="sc-notoserifcjksc">都是我们迄今发布的对齐</text><text x="72.00" y="204.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 91.67 94.76 100.84 107.52 117.35 123.32 129.89" y="204.81" font-size="11.00" class="sc-loraregular">alignment</text><text x="134.15 145.15 156.15 167.15 178.15 189.15 200.15 211.15 222.15 233.15 244.15 255.15 266.15 277.15 288.15 299.15 310.15 321.15 332.15 343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15 530.15" y="204.81" font-size="11.00" class="sc-notoserifcjksc">）程度最高的模型，且领先幅度显著。我们认为它不具有任何显著的、连贯的未对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="220.43" font-size="11.00" class="sc-notoserifcjksc">目标，并且它在典型对话中的性格特质与我们在</text><text x="303.00 314.00" y="220.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="325.00" y="220.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="336.00 341.80 348.23 354.91 360.00 364.26 367.53 371.78 378.35 382.61 385.70 392.13" y="220.43" font-size="11.00" class="sc-loraregular">constitution</text><text x="398.81 409.81 420.81 431.81 442.81 453.81 464.81 475.81 486.81 497.81 508.81 519.81 530.81" y="220.43" font-size="11.00" class="sc-notoserifcjksc">）中提出的目标高度吻合。即</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="236.05" font-size="11.00" class="sc-notoserifcjksc">便如此，我们认为它很可能带来了我们迄今发布的所有模型中最大的与对齐相关的风险。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="349.39" font-size="11.00" class="sc-notoserifcjksc">段。范围与能力上的这些提升，其影响可能足以抵消、甚至超过谨慎程度的提升。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="415.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="415.88" font-size="11.00" class="sc-notoserifcjksc">在自主研究与工程方面的能力远超我们以往的模型。正如上述类比，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="431.50" font-size="11.00" class="sc-notoserifcjksc">会从三个方面增加该模型带来的风险：</text><text x="382.51 390.19 393.19 398.80 405.36 411.94 417.90 420.80 430.73 436.59 440.85 447.44 453.87 458.97 461.86 468.52 473.21 479.12 484.67 487.76 493.68" y="496.26" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="505.39 516.39 527.39" y="496.26" font-size="11.00" class="sc-notoserifcjksc">在网络</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="511.88" font-size="11.00" class="sc-notoserifcjksc">安全方面的突出优势，这一点尤为明显。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="545.41" font-size="11.00" class="sc-notoserifcjksc">能力更强的模型在使用复杂工具时，往往会选择对普通用户而言不那么直观的方式来完成</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="561.03" font-size="11.00" class="sc-notoserifcjksc">任务，从而使对模型行为的粗略监督变得更加困难。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="593.98" font-size="11.00" class="sc-notoserifcjksc">在典型情况下，能力更强的模型可以在更高的自主性和更强大的可用手段下被高效地使</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="609.60" font-size="11.00" class="sc-notoserifcjksc">用，这自然会促使用户对它们的监督不那么严密。</text><text x="72.00 83.00 94.00 105.00" y="661.75" font-size="11.00" class="sc-notoserifcjksc">在我们对</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.91 209.60 215.51 221.06 224.15 230.07" y="661.75" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="661.75" font-size="11.00" class="sc-notoserifcjksc">的测试和早期内部使用中，我们看到它达到了前所未有的可靠</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="677.37" font-size="11.00" class="sc-notoserifcjksc">性和对齐水平，因此已开始相当广泛地使用它，且往往给予它比以往模型更多的可用手段、更少</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="692.99" font-size="11.00" class="sc-notoserifcjksc">的人工交互。然而，在它确实失败或行为异常的罕见情况下，我们看到它</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="303.00" y="211.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="303.00" y="211.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="314.00" y="211.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="314.00" y="211.63" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">采取了一些令我们相当担忧的行动。这些事件通常涉及在试图完成用户指定的困难任务时采取鲁</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">莽</text><text x="83.00" y="94.56" font-size="6.60" class="sc-loraregular">8</text><text x="86.71 97.71 108.71 119.71 130.71 141.71 152.71 163.71 174.71 185.71 196.71 207.71 218.71 229.71 240.71 251.71 262.71 273.71 284.71 295.71 306.71 317.71 328.71 339.71 350.71 361.71 372.71 383.71 394.71 405.71 416.71 427.71 438.71 449.71 460.71 471.71 482.71 493.71 504.71" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的过度措施，并且在该模型早期版本的罕见情况下，它似乎还掩饰了自己这样做的事实。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们观察到的所有此类严重事件都涉及</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.91 352.60 358.51 364.06 367.15 373.07" y="163.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的早期版本；这些版本虽然仍比</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="179.19" font-size="11.00" class="sc-notoserifcjksc">更不容易采取不受欢迎的行动，但其出现早于后来被证明是我们最有效的一些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">训练干预。这些早期版本在内部经过了大量测试，并曾与部分外部试点用户共享。在我们观察到</text><text x="72.00 83.00 94.00 105.00 116.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">的事件中：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">在被要求的沙箱逃逸过程中泄露信息：</text><text x="295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在一次使用模拟用户的行为测试中，一个早期的、</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">已在内部部署的</text><text x="187.89 195.58 198.57 204.18 210.75 217.33 223.29 226.18 236.12 241.98 246.24 252.83 259.26 264.35 267.25 273.91 278.60 284.51 290.06 293.15 299.07" y="276.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="310.77 321.77 332.77 343.77 354.77 365.77 376.77 387.77 398.77 409.77 420.77" y="276.34" font-size="11.00" class="sc-notoserifcjksc">版本获得了一台受保护的</text><text x="431.77" y="276.34" font-size="11.00" class="sc-loraregular">“</text><text x="436.17 447.17" y="276.34" font-size="11.00" class="sc-notoserifcjksc">沙箱</text><text x="458.17" y="276.34" font-size="11.00" class="sc-loraregular">”</text><text x="462.01 473.01 484.01 495.01 506.01 517.01" y="276.34" font-size="11.00" class="sc-notoserifcjksc">计算机以供交</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">互。模拟用户指示它尝试逃出这个安全容器，并设法向运行该评估的研究人员发送一条消</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">息。模型成功了，展示出一种可能危险的、绕过我们安全防护措施的能力。随后，它进一</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">步采取了更多、更令人担忧的行动。模型首先开发了一个中等复杂度的多步骤漏洞利用，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">从一个本应只能访问少量预定服务的系统获得了广泛的互联网访问权限。</text><text x="460.00" y="335.16" font-size="6.60" class="sc-loraregular">9</text><text x="463.81 474.81 485.81 496.81 507.81 518.81 529.81" y="338.82" font-size="11.00" class="sc-notoserifcjksc">随后，它按要求</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="354.44" font-size="11.00" class="sc-notoserifcjksc">通知了该研究人员。</text><text x="207.00 209.40" y="350.78" font-size="6.60" class="sc-loraregular">10</text><text x="213.50 224.50 235.50 246.50 257.50 268.50 279.50 290.50 301.50 312.50 323.50 334.50 345.50 356.50 367.50 378.50 389.50 400.50 411.50 422.50 433.50 444.50 455.50 466.50 477.50 488.50 499.50 510.50 521.50" y="354.44" font-size="11.00" class="sc-notoserifcjksc">此外，它还做出了一个令人担忧且未经要求的举动：为了展示自己</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="370.06" font-size="11.00" class="sc-notoserifcjksc">的成功，它将该漏洞利用的细节发布到了多个难以被找到、但在技术上面向公众的网站</text><text x="108.00 119.00" y="385.68" font-size="11.00" class="sc-notoserifcjksc">上。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="455.02" font-size="11.00" class="sc-notoserifcjkscbold">违规后掩盖行踪：</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">在内部测试中的少数罕见情况下（</text><text x="361.00 366.83 373.48 376.03 382.86 389.69 393.69" y="455.02" font-size="11.00" class="sc-loraregular">&lt;0.001%</text><text x="406.15 417.15 428.15 439.15 450.15" y="455.02" font-size="11.00" class="sc-notoserifcjksc">的交互），</text><text x="461.15 468.84 471.84 477.45 484.01 490.59 496.55 499.45 509.38 515.24 519.50 526.09 532.52" y="455.02" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="108.00 114.67 119.35 125.26 130.81 133.90 139.82" y="470.64" font-size="11.00" class="sc-loraregular">Preview</text><text x="151.53 162.53 173.53 184.53 195.53 206.53 217.53 228.53 239.53 250.53 261.53 272.53 283.53 294.53 305.53 316.53 327.53 338.53 349.53 360.53 371.53 382.53 393.53 404.53 415.53 426.53 437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53 525.53" y="470.64" font-size="11.00" class="sc-notoserifcjksc">的早期版本采取了它们似乎认识到不被允许的行动，随后试图加以掩盖。在一个</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="486.26" font-size="11.00" class="sc-notoserifcjksc">案例中，模型通过一种被明确禁止的方法，意外获得了一道定量估算题的确切答案。模型</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="501.88" font-size="11.00" class="sc-notoserifcjksc">没有标记这一情况并拒绝作答，而是试图独立地解出这道</text><text x="72.00" y="572.47" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 88.00 98.00 108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00 188.00 198.00 208.00 218.00 228.00 238.00 248.00 258.00 268.00 278.00 288.00 298.00 308.00 318.00 328.00 338.00 348.00 358.00 368.00 378.00 388.00 398.00 408.00 418.00 428.00 438.00 448.00 458.00 468.00 478.00 488.00 498.00 508.00 518.00 528.00" y="575.80" font-size="10.00" class="sc-notoserifcjksc">我们发现，鲁莽是一个有用的简称，用来指代模型似乎无视对其行动的常识性或明确规定的安全相关约束</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="590.00" font-size="10.00" class="sc-notoserifcjksc">的情形。我们对这一术语的使用较为宽松，一般并不意在借此暗示有关模型内部推理和风险评估的任何内</text><text x="72.00 82.00" y="604.20" font-size="10.00" class="sc-notoserifcjksc">容。</text><text x="72.00" y="615.07" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 88.10 98.10 108.10 118.10 128.10 138.10 148.10 158.10 168.10 178.10 188.10 198.10 208.10 218.10 228.10 238.10 248.10 258.10 268.10 278.10 288.10 298.10 308.10 318.10 328.10 338.10 348.10 358.10 368.10 378.10 388.10 398.10 408.10 418.10 428.10 438.10 448.10 458.10 468.10 478.10 488.10 498.10 508.10 518.10 528.10" y="618.40" font-size="10.00" class="sc-notoserifcjksc">模型所控制的沙箱计算机与运行模型本身、存放模型权重的系统是相互独立的。诸如此类处理模型权重的</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="632.60" font-size="10.00" class="sc-notoserifcjksc">系统受到大量额外安全措施的保护，此次事件并不表明模型完全突破了隔离：在此次测试中，模型既没有</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00" y="646.80" font-size="10.00" class="sc-notoserifcjksc">展示出访问自身权重的能力（而这是完全独立于</text><text x="284.63 290.89 296.87 300.74 306.73 310.99 316.84 322.81 325.62" y="646.80" font-size="10.00" class="sc-loraregular">Anthropic</text><text x="333.57 343.57 353.57 363.57 373.57 383.57 393.57 403.57 413.57 423.57 433.57 443.57 453.57 463.57 473.57 483.57 493.57 503.57 513.57 523.57" y="646.80" font-size="10.00" class="sc-notoserifcjksc">运作所必需的），也没有展示出访问任何内部</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00" y="661.00" font-size="10.00" class="sc-notoserifcjksc">系统或服务的能力。</text><text x="72.00 74.18" y="671.87" font-size="6.00" class="sc-loraregular">10</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">题。在这个过程中，它明确地推理出，需要确保自己最终提交的答案不会过于准确。在另</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一个案例中，模型在找到一个可用于编辑其无权限编辑之文件的漏洞利用后，又进一步采</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">取干预措施，确保以这种方式做出的任何更改都不会出现在</text><text x="396.89 403.24 406.51" y="113.85" font-size="11.00" class="sc-loraregular">git</text><text x="413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的变更历史中。在第三个</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">案例中，当早期版本的</text><text x="220.89 228.58 231.57 237.18 243.75 250.33 256.29 259.18 266.87 273.31 279.89" y="129.47" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="288.74 299.74 310.74 321.74 332.74" y="129.47" font-size="11.00" class="sc-notoserifcjksc">自动模式（</text><text x="343.74 349.35 355.92 360.18 366.61 369.50 379.34 385.77 392.35" y="129.47" font-size="11.00" class="sc-loraregular">auto mode</text><text x="398.31 409.31 420.31 431.31 442.31 453.31 464.31 475.31 486.31 497.31 508.31 519.31 530.31" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）阻止它启动一个具有提升权</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">尝试被自动模式的进一步干预所阻止。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">在这些回合中对内部激活值进行的白盒可解释性分析</text><text x="397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">显示，与隐瞒、策略性操纵和</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">本对此表述含糊的情况下，这些早期版本的模型也意识到了自己的行为具有欺骗</text><text x="144.00 155.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">性。</text><text x="144.00 151.69 154.68 160.29 166.86 173.44 179.40 182.29 192.22 198.09 202.34 208.93 215.37 220.46 223.35 230.02 234.71 240.61 246.17 249.26 255.18" y="325.49" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="266.88 277.88 288.88 299.88 310.88 321.88 332.88 343.88 354.88 365.88 376.88 387.88 398.88 409.88 420.88 431.88 442.88 453.88 464.88 475.88 486.88 497.88 508.88 519.88" y="325.49" font-size="11.00" class="sc-notoserifcjksc">早期版本中此类行为的发生率非常低，并且我们在最终</text><text x="144.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">版</text><text x="157.89 165.58 168.57 174.18 180.75 187.33 193.29 196.18 206.12 211.98 216.24 222.83 229.26 234.35 237.25 243.91 248.60 254.51 260.06 263.15 269.07" y="341.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="280.77 291.77 302.77 313.77 324.77 335.77 346.77 357.77 368.77 379.77 390.77 401.77 412.77 423.77 434.77 445.77 456.77 467.77 478.77 489.77 500.77 511.77 522.77" y="341.11" font-size="11.00" class="sc-notoserifcjksc">中没有看到明确的此类案例。我们的自动化离线监控</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">流水线以低于每百万份</text><text x="256.89 264.58 267.57 273.18 279.75 286.33 292.29 295.18 302.87 309.31 315.89" y="356.73" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="324.74 335.74 346.74 357.74 368.74 379.74 390.74 401.74 412.74 423.74 434.74 445.74 456.74 467.74 478.74 489.74 500.74 511.74 522.74" y="356.73" font-size="11.00" class="sc-notoserifcjksc">对话记录一例的比率发现了明确的掩盖行为</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">实例，并且对于</text><text x="223.89 231.58 234.57 240.18 246.75 253.33 259.29 262.18 272.12 277.98 282.24 288.83 295.26 300.35 303.25 309.91 314.60 320.51 326.06 329.15 335.07" y="372.35" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="346.77 357.77 368.77 379.77 390.77 401.77 412.77 423.77 434.77 445.77 456.77 467.77 478.77 489.77 500.77 511.77 522.77" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的最终版本，我们没有发现明确的掩盖</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">行为实例。在其他部署分布上（例如，掩盖行为的可能性更为突出的分布），这一</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc">比率可能更高。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">以激进的、非预期的方式利用底层计算机进程数据：</text><text x="361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">在多个实例中，</text><text x="438.00 445.69 448.68 454.29 460.86 467.44 473.40 476.29 486.22 492.09 496.34 502.93 509.37" y="438.83" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="108.00 114.67 119.35 125.26 130.81 133.90 139.82" y="454.45" font-size="11.00" class="sc-loraregular">Preview</text><text x="151.53 162.53 173.53 184.53 195.53 206.53 217.53 228.53 239.53 250.53 261.53" y="454.45" font-size="11.00" class="sc-notoserifcjksc">的早期版本曾利用底层的</text><text x="275.42 282.02 288.62 295.22 301.82 308.42" y="454.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">∕proc∕</text><text x="317.92 328.92 339.92 350.92 361.92 372.92 383.92 394.92 405.92 416.92 427.92 438.92 449.92 460.92 471.92 482.92 493.92 504.92 515.92 526.92" y="454.45" font-size="11.00" class="sc-notoserifcjksc">访问来搜索凭据、试图绕过沙箱机制，以及试</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">图提升自身权限。在若干案例中，它通过检查进程内存，成功访问了我们有意选择不予提</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="485.69" font-size="11.00" class="sc-notoserifcjksc">供的资源，包括消息服务、源代码管理或</text><text x="308.89 315.78 322.36 326.61 333.20 337.89 344.32 350.89 353.98 359.83 362.73 369.61 376.22" y="485.69" font-size="11.00" class="sc-loraregular">Anthropic API</text><text x="382.80 393.80 404.80 415.80 426.80 437.80 448.80 459.80 470.80 481.80 492.80 503.80 514.80 525.80" y="485.69" font-size="11.00" class="sc-notoserifcjksc">的凭据。在其他情境中，它曾通</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="501.31" font-size="11.00" class="sc-notoserifcjksc">过使用一个本应仅用于文件编辑的工具向</text><text x="308.89 313.99 320.58 326.54 329.53" y="501.31" font-size="11.00" class="sc-loraregular">shell</text><text x="335.41 346.41 357.41 368.41 379.41 390.41 401.41 412.41 423.41 434.41 445.41 456.41 467.41 478.41 489.41 500.41 511.41 522.41" y="501.31" font-size="11.00" class="sc-notoserifcjksc">的输入写入内容而实现任意代码执行，编</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="516.93" font-size="11.00" class="sc-notoserifcjksc">辑了它无权限编辑的文件，并且在一个案例中修改了一个正在运行的</text><text x="440.89 450.94 458.62" y="516.93" font-size="11.00" class="sc-loraregular">MCP</text><text x="468.18 479.18 490.18 501.18 512.18" y="516.93" font-size="11.00" class="sc-notoserifcjksc">服务器的进</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="532.55" font-size="11.00" class="sc-notoserifcjksc">程，试图更改该服务器发送数据的外部</text><text x="297.89 306.17 313.07" y="532.55" font-size="11.00" class="sc-loraregular">URL</text><text x="319.43 330.43 341.43 352.43 363.43 374.43 385.43 396.43 407.43 418.43 429.43" y="532.55" font-size="11.00" class="sc-notoserifcjksc">。偶尔，这些尝试发生在</text><text x="443.32 451.01 454.01 459.61 466.18 472.76 478.72 481.61 489.30 495.74 502.32" y="532.55" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="511.17 522.17" y="532.55" font-size="11.00" class="sc-notoserifcjksc">等脚</text><text x="108.00 119.00 130.00" y="548.17" font-size="11.00" class="sc-notoserifcjksc">手架（</text><text x="141.00 146.09 151.92 157.60 161.43 165.09 171.53 174.52" y="548.17" font-size="11.00" class="sc-loraregular">scaffold</text><text x="181.10 192.10 203.10 214.10 225.10 236.10 247.10 258.10 269.10 280.10 291.10 302.10 313.10 324.10 335.10 346.10 357.10 368.10 379.10 390.10 401.10 412.10 423.10 434.10 445.10 456.10 467.10 478.10 489.10 500.10 511.10 522.09" y="548.17" font-size="11.00" class="sc-notoserifcjksc">）已明确警告它不要试图绕过某个相关障碍之后。我们将在下文进一步详</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="563.79" font-size="11.00" class="sc-notoserifcjksc">细介绍模型在这些回合中的内部状态</text><text x="284.00" y="563.79" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="649.86" font-size="11.00" class="sc-notoserifcjkscbold">鲁莽地泄露内部技术材料：</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="649.86" font-size="11.00" class="sc-notoserifcjksc">在为一名内部用户准备一个与代码相关的产出物时，</text><text x="493.00 500.69 503.68 509.29 515.86 522.44" y="649.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="665.48" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59" y="665.48" font-size="11.00" class="sc-notoserifcjksc">的一个早期版本违背用户意图，将该产出物发布为一个面向公众的</text><text x="108.00 116.37 119.64 123.90 132.27 138.83 145.24 148.13 154.48 157.57 162.66" y="681.10" font-size="11.00" class="sc-loraregular">GitHub gist</text><text x="166.92" y="681.10" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="698.44" font-size="11.00" class="sc-notoserifcjkscbold">鲁莽地终止代价高昂的评估任务：</text><text x="273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="698.44" font-size="11.00" class="sc-notoserifcjksc">当一名研究人员要求</text><text x="374.89 382.58 385.57 391.18 397.75 404.33 410.29 413.18 423.12 428.98 433.24 439.83 446.26 451.35 454.25 460.91 465.60 471.51 477.06 480.15 486.07" y="698.44" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="497.77 508.77 519.77" y="698.44" font-size="11.00" class="sc-notoserifcjksc">的一个</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="714.06" font-size="11.00" class="sc-notoserifcjksc">早期版本结束一项正在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">服务器上运行、且已不再产生有用结果的特定评估时，模型执行这一请求的方式导致所有</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用户正在进行的所有类似评估都被终止。尽管此前已有专门的警告提醒它对此要小心，这</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">种情况仍然发生了。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">经过大量调查，我们相当有信心地认为，这些令人担忧的行为至少在宽泛意义上反映的是试图以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">不受欢迎的手段解决用户所提供的当前任务，而不是试图实现任何无关的隐藏目标：尽管</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="178.62" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的早期版本会在任务中采取鲁莽的捷径、以危险的方式强行突破技术障碍，有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">时还会试图掩饰自己的所作所为，但我们不认为我们测试过的任何版本会试图更普遍地破坏我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施，也不认为它们会朝任何其他不受欢迎的结果连贯地行动。最终版</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="209.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="225.48" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="225.48" font-size="11.00" class="sc-notoserifcjksc">模型在许多利害程度较低的情境中仍会采取鲁莽的捷径，但我们没有看到它表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">现出同类的严重不当行为或欺骗企图。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">当我们最初选择在内部部署这些早期模型时，我们并未意识到它们通过此类途径所带来的风险程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">度。我们对训练过程的监控显示出一些大致类似的奖励破解（</text><text x="369.00 373.69 379.60 388.31 393.98 398.67 405.25 408.14 414.73 420.40 426.26 432.16 435.25 441.93" y="341.11" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="448.01 459.01 470.01 481.01 492.01 503.01 514.01 525.01" y="341.11" font-size="11.00" class="sc-notoserifcjksc">）形式，这引起了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">一定担忧，但当时尚不清楚这些行为会如何泛化到实际使用中。我们在训练期间定期运行的自动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">化行为审计（</text><text x="138.00 143.61 150.18 154.43 160.87 170.70 176.30 180.56 186.47 193.04 195.94 202.34 208.30 214.89 220.43 225.99 229.08 235.51 240.20 245.88 248.87 251.76 257.37 263.94 270.52 273.78" y="372.35" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="278.04 289.04 300.04 311.04 322.04 333.04 344.04 355.04 366.04 377.04 388.04 399.04 410.04 421.04 432.04 443.04 454.04 465.04 476.04 487.04 498.04 509.04 520.04" y="372.35" font-size="11.00" class="sc-notoserifcjksc">）评估，难以模拟此类行为发生时所处的那种在联网</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">计算机上长时间运行的会话，因此未能让我们清楚地了解该问题的潜在严重程度。此后，我们在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc">下文报告的该评估版本中在一定程度上改进了覆盖范围，并增加了额外的针对性评估，不过在真</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">实部署之外的此类情境中全面评估模型行为仍然具有挑战性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">我们的评估还因以下事实而变得更加复杂：在所有隔离考察模型倾向与决策的评估中，我们发现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">我们使用过的</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="519.22" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77" y="519.22" font-size="11.00" class="sc-notoserifcjksc">的所有版本带来的风险似乎都低于</text><text x="431.67 439.36 442.35 447.96 454.52 461.10 467.07 469.96 478.69 485.26 491.83 496.92 499.81 505.77 508.37" y="519.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="517.62 528.62" y="519.22" font-size="11.00" class="sc-notoserifcjksc">等其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">他近期模型：正如上文所述，这些模型的风险通常源于其能力的提升以及这些能力所带来的新用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">例，而非其对齐方面的任何退步。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc">尽管我们认为这些模型中的这些行为问题所带来的风险最终是可控的，并且发现</text><text x="459.89 467.58 470.57 476.18 482.75 489.33 495.29 498.18 508.12 513.98 518.24 524.83 531.26" y="616.95" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="632.57" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53 500.53 511.53 522.53" y="632.57" font-size="11.00" class="sc-notoserifcjksc">在我们的早期内部使用中非常有价值，但这种意外开创了一个令人担忧的先例。有关我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc">们早期内部测试及相关决策的更多讨论，请见下文。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="697.91" font-size="11.00" class="sc-notoserifcjksc">我们在内部部署中观察到了数十起类似上文所述的重大事件。几乎所有这些事件，以及上文描述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="713.53" font-size="11.00" class="sc-notoserifcjksc">的所有最严重的事件，都</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="72.00 83.00 94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">发生在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.91 198.60 204.51 210.06 213.15 219.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.77 241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的早期版本上。我们针对这些行为在多个节点调整了模型的训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">方式，并且我们认为最终版</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="98.23" font-size="11.00" class="sc-notoserifcjksc">已有大幅改进。然而，这些倾向似乎并未完</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">全消失。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们认为，该模型的积极潜力（尤其是在防御性网络安全方面）足以证明承担其行为可能带来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">其鲁莽行为可能导致难以逆转之危害的情境中部署该模型。特别是，虽然</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 472.87 479.31 485.89" y="194.81" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="494.74 505.74 516.74 527.74" y="194.81" font-size="11.00" class="sc-notoserifcjksc">新推出的</text><text x="72.00 83.00 94.00 105.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">自动模式</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">似乎大幅降低了此类行为带来的风险，但我们预计它不足以完全消除风险。</text><text x="72.00 80.59 83.97 88.68 92.06" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.62 115.62 128.62 141.62 154.62 167.62" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐评估概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">本节其余部分将详细介绍我们对</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 277.12 282.98 287.24 293.83 300.26 305.35 308.25 314.91 319.60 325.51 331.06 334.15 340.07" y="319.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="319.34" font-size="11.00" class="sc-notoserifcjksc">进行的对齐评估的全部范围，既包括与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">上述重点问题相关的更多细节，也包括与模型对齐许多其他方面相关的评估结果。</text><text x="72.00 83.00 94.00 105.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">与我们为</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.60" y="384.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc">等近期模型开展的对齐评估一样，我们广泛评估了</text><text x="449.74 457.43 460.42 466.03 472.60 479.18 485.14 488.03 497.96 503.83 508.08 514.67 521.11" y="384.11" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="399.73" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53" y="399.73" font-size="11.00" class="sc-notoserifcjksc">是否存在令人担忧的、与未对齐（</text><text x="280.53 290.36 293.45 298.55 304.22 307.21 310.30 316.39 323.06 332.90 338.86 345.44" y="399.73" font-size="11.00" class="sc-loraregular">misalignment</text><text x="349.70 360.70 371.70 382.70 393.70 404.70 415.70 426.70 437.70 448.70 459.70 470.70 481.70 492.70 503.70 514.70 525.70" y="399.73" font-size="11.00" class="sc-notoserifcjksc">）相关的行为，尤其是那些与我们预计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">随着模型能力提升而重要性日益增加的风险相关的行为。这些行为包括：表现出不良目标或隐藏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="430.97" font-size="11.00" class="sc-notoserifcjksc">目标、在知情的情况下配合滥用、以欺骗性或不忠实的方式使用推理草稿区、对用户的谄媚、破</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">坏我们安全防护措施的意愿、试图隐藏危险能力，以及试图操纵用户接受某些观点。</text><text x="479.00 481.40" y="442.92" font-size="6.60" class="sc-loraregular">11</text><text x="483.80 494.80 505.80 516.80 527.80" y="446.59" font-size="11.00" class="sc-notoserifcjksc">除了我们主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">要关注的未对齐问题之外，我们还报告了一些关于这些模型的性格与积极特质的相关发现。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">在整个后训练过程中持续进行测试，在此既报告最终版</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 387.12 392.98 397.24 403.83 410.26 415.35 418.25 424.91 429.60 435.51 441.06 444.15 450.07" y="477.83" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="477.83" font-size="11.00" class="sc-notoserifcjksc">模型的结果，也</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="493.45" font-size="11.00" class="sc-notoserifcjksc">报告其开发过程中产生的早期模型版本的结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="594.60" font-size="11.00" class="sc-notoserifcjksc">本次评估包括静态行为评估、自动化交互式行为评估、字典学习可解释性方法、激活言语化器</text><text x="72.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 94.47 98.73 101.82 107.27 112.87 117.12 120.21 126.65 133.33 136.22 141.72 147.68 152.40 158.80 164.48 167.47 170.56 176.09 182.05" y="610.22" font-size="11.00" class="sc-loraregular">activation verbalizer</text><text x="186.83" y="610.22" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="197.83 200.23" y="606.56" font-size="6.60" class="sc-loraregular">12</text><text x="203.78 214.78 225.78" y="610.22" font-size="11.00" class="sc-notoserifcjksc">、白盒</text><text x="72.00 74.18" y="636.47" font-size="6.00" class="sc-loraregular">11</text><text x="79.00 85.99 88.71 93.81 99.78 105.76 111.18 113.81 122.84 128.17 132.04 138.03 143.88 148.51 151.14 157.20 161.46 166.83 171.88 174.69 180.07" y="639.80" font-size="10.00" class="sc-loraregular">Claude Mythos Preview</text><text x="190.71 200.71 210.71 220.71 230.71 240.71 250.71 260.71 270.71 280.71 290.71 300.71 310.71 320.71 330.71 340.71 350.71 360.71 370.71 380.71 390.71 400.71 410.71 420.71 430.71 440.71 450.71 460.71 470.71 480.71 490.71 500.71 510.71 520.71 530.71" y="639.80" font-size="10.00" class="sc-notoserifcjksc">的有限发布显著缓解了与滥用、操纵和谄媚相关的许多风险，但我们仍选择按照</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00" y="654.00" font-size="10.00" class="sc-notoserifcjksc">完整公开发布的标准进行全面评估。</text><text x="72.00 74.18" y="664.87" font-size="6.00" class="sc-loraregular">12</text><text x="80.04 90.04 100.04 110.04 120.04 130.04 140.04 150.04 160.04 170.04 180.04 190.04 200.04 210.04 220.04 230.04 240.04 250.04 260.04 270.04 280.04 290.04 300.04 310.04 320.04 330.04 340.04 350.04 360.04 370.04" y="668.20" font-size="10.00" class="sc-notoserifcjksc">一种将激活向量解码为自然语言的方法（详见下文），与此前发表的</text><text x="380.04" y="668.20" font-size="10.00" class="sc-loraregular">“</text><text x="384.04 394.04 404.04 414.04 424.04" y="668.20" font-size="10.00" class="sc-notoserifcjksc">激活预言机</text><text x="434.04" y="668.20" font-size="10.00" class="sc-loraregular">”</text><text x="437.53 447.53 457.53 467.53 477.53" y="668.20" font-size="10.00" class="sc-notoserifcjksc">方法相关：</text><text x="487.53 494.36 499.52 503.92 508.92 514.77 520.84 526.26 532.33" y="668.20" font-size="10.00" class="sc-loraregular">Karvonen,</text><text x="72.00 78.26 80.72 83.24 85.87 91.22 95.09 97.72 102.88 105.60 108.06 110.69 113.74 119.11 125.25 130.62 136.07 139.12 141.58 144.21 150.47 155.74 159.61 162.42 167.37 172.46 176.33 179.14 184.99 191.06 193.69 199.54 203.80 208.96 214.28 217.00 222.42 227.05 229.55 232.18 238.43 242.69 247.85 250.66 256.73 259.54 265.61 271.14 273.77 278.93 285.00 290.98 293.61 298.98 303.93 309.09 311.81 317.78 322.87 326.74 329.55 335.62 341.15 343.78 349.56 355.34 364.52 369.15 371.78 376.94 381.57 384.20 389.68 395.10 401.17 406.59 410.85 416.01 418.73 423.62 429.59 435.56 439.89 445.86 451.71 456.34 461.76 464.39 469.55 474.82 478.69 481.50 486.45 491.54 495.41 498.22 504.07" y="682.40" font-size="10.00" class="sc-loraregular">A., et al. (2025). Activation oracles: Training and evaluating LLMs as general-purpose activation</text><text x="72.00 77.37 82.67 88.64 91.36 96.52 99.33 105.40 110.82 115.15 119.78" y="696.60" font-size="10.00" class="sc-loraregular">explainers.</text><text x="124.87 130.77 134.74 138.61 144.58 149.21 151.71 155.40 162.30 167.46 171.79 177.09 179.90 184.56 187.02 192.87 197.15 202.68 209.58 214.74 220.56 224.84 231.74 237.11 242.56 246.20 251.57 254.03 257.67 263.12 268.83 273.30" y="696.60" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2512.15674</text><text x="278.72" y="696.60" font-size="10.00" class="sc-notoserifcjksc">。</text><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="538.74" y="186.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="72.00" y="201.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="83.00" y="201.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="83.00" y="201.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="94.00" y="201.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="94.00" y="201.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="105.00" y="201.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/auto-mode" rel="noopener"><rect x="105.00" y="201.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0dd865075ad3132672ee0ab40b05a53f14cf5288.pdf" rel="noopener"><rect x="118.89" y="375.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0dd865075ad3132672ee0ab40b05a53f14cf5288.pdf" rel="noopener"><rect x="118.89" y="375.31" width="35.40" height="11.00" fill="transparent"/>
