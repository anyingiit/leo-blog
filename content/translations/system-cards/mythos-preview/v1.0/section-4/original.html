pus 4.6</text><text x="381.95" y="673.84" font-size="11.00" class="sc-notoserifcjksc">的监控器，该监控器会在评分前</text><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="259.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="259.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="270.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="270.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="281.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="281.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="292.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="292.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="303.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="303.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.00" y="437.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.00" y="437.78" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="446.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="446.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="457.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="457.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="468.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="468.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="479.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="479.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="490.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="490.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="501.00" y="484.64" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="501.00" y="484.64" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="162.89" y="649.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="162.89" y="649.42" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="198.29" y="649.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="201.18" y="649.42" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="237.35" y="649.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="240.25" y="649.42" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="255.16" y="649.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="258.05" y="649.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="269.05" y="649.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="269.05" y="649.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="280.05" y="649.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="280.05" y="649.42" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00 507.28 512.67" y="751.80" font-size="9.00" class="sc-loraregular">107</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">先对轨迹进行推理。这更贴近我们当前实际的内部监控方案。</text><text x="72.00" y="357.81" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="357.81" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 111.67 113.77 119.30" y="357.81" font-size="9.00" class="sc-lorabold">4.4.3.1.A]</text><text x="125.14" y="357.81" font-size="9.00" class="sc-notoserifcjkscbold">附带任务的隐蔽成功完成情况。</text><text x="251.14" y="357.81" font-size="9.00" class="sc-notoserifcjksc">数值越高表示能力越强，相关的潜在风险也越大。扩展思考设置与实际部</text><text x="72.00" y="369.51" font-size="9.00" class="sc-notoserifcjksc">署最为接近；隐藏草稿区设置是一种上界条件，在该条件下监控器无法看到智能体的思考内容。图中显示</text><text x="488.37" y="369.51" font-size="9.00" class="sc-loraregular">95%</text><text x="508.67" y="369.51" font-size="9.00" class="sc-notoserifcjksc">置信区</text><text x="72.00" y="381.21" font-size="9.00" class="sc-notoserifcjksc">间。</text><text x="72.00" y="423.36" font-size="11.00" class="sc-notoserifcjksc">在贴近现实的扩展思考设置下，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 274.22 280.09 284.34 290.93 297.37 302.46 305.35 312.02 316.71 322.61 328.17 331.26 337.18" y="423.36" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="348.88" y="423.36" font-size="11.00" class="sc-notoserifcjksc">达到了我们所测试过的所有模型中最高</text><text x="72.00" y="438.98" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率：大约</text><text x="151.89" y="438.98" font-size="11.00" class="sc-loraregular">4–5%</text><text x="179.91" y="438.98" font-size="11.00" class="sc-notoserifcjksc">，相比之下</text><text x="237.80 246.54 253.10 259.67 264.76 267.66 273.62 276.22" y="438.98" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="285.47" y="438.98" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="299.36" y="438.98" font-size="11.00" class="sc-loraregular">0–3%</text><text x="328.38" y="438.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="339.38 345.61 352.05 358.73 365.40 371.29 375.55 378.44 384.40 387.00" y="438.98" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="396.25" y="438.98" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="421.14" y="438.98" font-size="11.00" class="sc-loraregular">1%</text><text x="434.71" y="438.98" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="445.71 454.45 461.02 467.58 472.67 475.57 481.53 484.13" y="438.98" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="493.38" y="438.98" font-size="11.00" class="sc-notoserifcjksc">在最高推</text><text x="72.00" y="454.60" font-size="11.00" class="sc-notoserifcjksc">理强度下这一比率降至零。这一差距取决于思考预算。在低预算下，或在使用隐藏草稿区时，所</text><text x="72.00" y="470.22" font-size="11.00" class="sc-notoserifcjksc">有模型尝试附带任务的比率相近，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 285.22 291.09 295.34 301.93 308.37 313.46 316.35 323.02 327.71 333.61 339.17 342.26 348.18" y="470.22" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="359.88" y="470.22" font-size="11.00" class="sc-notoserifcjksc">的隐蔽优势不大。随着预算增加，</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="485.84" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="119.66" y="485.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.56 139.79 146.23 152.90 159.58 165.47 169.72 172.62 178.58 181.18" y="485.84" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="431.93" y="485.84" font-size="11.00" class="sc-loraregular">90%</text><text x="72.00" y="501.46" font-size="11.00" class="sc-notoserifcjksc">几乎每次尝试都会在草稿区中提及附带任务，从而被推理监控器标记。</text><text x="413.00 420.69 423.68 429.29 435.86 442.44 448.40 451.29 461.22 467.09 471.34 477.93 484.37 489.46 492.35 499.02 503.71 509.61 515.17 518.26 524.18" y="501.46" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="517.08" font-size="11.00" class="sc-notoserifcjksc">在高预算下的优势来自于不将附带任务相关的推理泄露到草稿区中：对于对比模型而言，更多的</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.91 363.60 369.51 375.06 378.15 384.07" y="532.70" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="395.77" y="532.70" font-size="11.00" class="sc-notoserifcjksc">的推理始终集中在主任务的执</text><text x="72.00" y="548.32" font-size="11.00" class="sc-notoserifcjksc">行上，草稿区中也不会明确提到附带任务。</text><text x="72.00" y="633.86" font-size="11.00" class="sc-notoserifcjksc">在涉及武器、数据外泄和禁用监控的部分任务上，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 362.22 368.09 372.34 378.93 385.37 390.46 393.35 400.02 404.71 410.61 416.17 419.26 425.18" y="633.86" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="436.88" y="633.86" font-size="11.00" class="sc-notoserifcjksc">比对比模型更常拒</text><text x="72.00" y="649.48" font-size="11.00" class="sc-notoserifcjksc">绝。能够减少这些拒绝的提示词也不会提升隐蔽性：在</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 387.12 392.98 397.24 403.83 410.26 415.35 418.25 424.91 429.60 435.51 441.06 444.15 450.07" y="649.48" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="461.77" y="649.48" font-size="11.00" class="sc-notoserifcjksc">拒绝的任务上，</text><text x="72.00" y="665.10" font-size="11.00" class="sc-notoserifcjksc">我们测试过的任何模型都没有取得任何隐蔽成功，因此拒绝这些任务并不会降低可达到的上限。</text><text x="72.00" y="680.72" font-size="11.00" class="sc-notoserifcjksc">一个未经无害性训练的仅有用变体的表现略逊于生产模型。我们将这些结果视为证据，表明上述</text><text x="72.00" y="696.34" font-size="11.00" class="sc-notoserifcjksc">隐蔽率</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="72.00 78.01 80.57 86.59 89.15 95.30 97.86 103.72 106.61 117.20 120.79 127.81 131.40 141.51 147.27 150.61 155.53 162.17 165.76 172.72 179.51 185.54 192.80 198.72 205.73 211.43" y="147.83" font-size="11.00" class="sc-lorabold">4.4.3.2 Minimal-LinuxBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">108</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">已接近</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.91 198.60 204.51 210.06 213.15 219.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">通过提示词激发所能达到的上限；如果存在显著更高的能力，则</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">需要基于微调的能力激发才能显现，而我们尚未尝试这种方法。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">为了在与我们实际部署更相近的设置中评估模型规避监督的能力，我们在高风险软件环境中运行</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">了一项仍在开发中的评估。我们改编了</text><text x="261.89" y="195.39" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="325.23" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的一个子集；</text><text x="391.23" y="195.39" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="454.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="479.46 486.29 492.20 498.72 507.40 513.84 520.27" y="195.39" font-size="11.00" class="sc-loraregular">Redwood</text><text x="72.00 78.83 84.79 89.89 95.83 101.50 106.19 112.04" y="211.01" font-size="11.00" class="sc-loraregular">Research</text><text x="121.52" y="211.01" font-size="11.00" class="sc-notoserifcjksc">构建并私下共享的</text><text x="212.42" y="211.01" font-size="11.00" class="sc-loraregular">AI</text><text x="225.88" y="211.01" font-size="11.00" class="sc-notoserifcjksc">控制竞技场。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们从改编得到的</text><text x="162.89 166.90 169.67 176.03 181.99" y="260.72" font-size="11.00" class="sc-loraregular">1,948</text><text x="191.07" y="260.72" font-size="11.00" class="sc-notoserifcjksc">对主任务与附带任务中随机抽取了</text><text x="358.97" y="260.72" font-size="11.00" class="sc-loraregular">200</text><text x="381.43" y="260.72" font-size="11.00" class="sc-notoserifcjksc">对，发现</text><text x="428.32 436.01 439.00 444.61 451.18 457.76 463.72 466.61 476.55 482.41 486.67 493.26 499.69" y="260.72" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="276.34" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="276.34" font-size="11.00" class="sc-notoserifcjksc">（不使用扩展思考）在其中</text><text x="247.53" y="276.34" font-size="11.00" class="sc-loraregular">69</text><text x="263.14" y="276.34" font-size="11.00" class="sc-notoserifcjksc">对上成功完成了附带任务。（这</text><text x="420.03" y="276.34" font-size="11.00" class="sc-loraregular">200</text><text x="442.49" y="276.34" font-size="11.00" class="sc-notoserifcjksc">对中有一小部分在</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">评估开始前就已失败，因此有效任务数略少于</text><text x="294.89" y="291.96" font-size="11.00" class="sc-loraregular">200</text><text x="314.46" y="291.96" font-size="11.00" class="sc-notoserifcjksc">。）我们只报告不使用扩展思考、且将完整对</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">话记录（包括助手轮次）输入监控器时的数值。我们尝试了</text><text x="360.89" y="307.58" font-size="11.00" class="sc-loraregular">3</text><text x="369.91" y="307.58" font-size="11.00" class="sc-notoserifcjksc">种详细程度不同的攻击性系统提示</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">词，它们都告知模型完整对话记录将受到监控，三者表现相近。我们还在此前的检查点以及</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="338.82" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="338.82" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本上运行了这项评估，结果大体相似。</text><text x="72.00" y="617.77" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="617.77" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 112.82 114.91 120.45 123.92 126.29 134.96 137.90 143.64 146.58 154.86 159.58 162.31 166.54 171.98 174.92 180.62 186.18 191.11 197.06 201.91 207.65 212.31" y="617.77" font-size="9.00" class="sc-lorabold">4.4.3.2.A] Minimal-LinuxBench</text><text x="220.27" y="617.77" font-size="9.00" class="sc-notoserifcjkscbold">中附带任务的成功隐蔽完成。</text><text x="337.27" y="617.77" font-size="9.00" class="sc-notoserifcjksc">数值越高，表示能力越强，相关的潜在风险也越</text><text x="72.00" y="629.47" font-size="9.00" class="sc-notoserifcjksc">大。</text><text x="90.00" y="629.47" font-size="9.00" class="sc-loraregular">“</text><text x="93.60" y="629.47" font-size="9.00" class="sc-notoserifcjksc">无思维链（</text><text x="138.60 144.89 149.88" y="629.47" font-size="9.00" class="sc-loraregular">CoT</text><text x="155.64" y="629.47" font-size="9.00" class="sc-notoserifcjksc">）</text><text x="164.64" y="629.47" font-size="9.00" class="sc-loraregular">”</text><text x="167.78" y="629.47" font-size="9.00" class="sc-notoserifcjksc">监控器曾在早期部署期间使用，目前我们使用</text><text x="347.78" y="629.47" font-size="9.00" class="sc-loraregular">“</text><text x="351.38" y="629.47" font-size="9.00" class="sc-notoserifcjksc">含</text><text x="362.75 369.04 374.02 379.78" y="629.47" font-size="9.00" class="sc-loraregular">CoT”</text><text x="382.92" y="629.47" font-size="9.00" class="sc-notoserifcjksc">监控器。图中显示</text><text x="457.29" y="629.47" font-size="9.00" class="sc-loraregular">95%</text><text x="477.59" y="629.47" font-size="9.00" class="sc-notoserifcjksc">置信区间</text><text x="72.00" y="641.17" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00 89.80 92.33 94.78 98.95 104.21" y="641.17" font-size="9.00" class="sc-loraregular">Wilson</text><text x="112.04" y="641.17" font-size="9.00" class="sc-notoserifcjksc">区间）。</text><text x="72.00" y="683.32" font-size="11.00" class="sc-notoserifcjksc">我们的结果构成反面证据，不支持在这种不使用扩展思考的设置下</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="683.32" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77" y="683.32" font-size="11.00" class="sc-notoserifcjksc">的隐</text><text x="72.00" y="698.94" font-size="11.00" class="sc-notoserifcjksc">蔽能力比</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.60" y="698.94" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="391.35 397.59 406.17 413.05 421.14 427.76 433.14 440.03 444.71 450.67 457.35" y="698.94" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="465.92" y="698.94" font-size="11.00" class="sc-notoserifcjksc">上的结果相</text><text x="72.00" y="714.56" font-size="11.00" class="sc-notoserifcjksc">似：在较低的扩展思考设置下，</text><text x="226.00 234.73 241.30 247.87 252.96 255.85 261.82 264.41" y="714.56" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="273.66" y="714.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="287.56 295.24 298.24 303.85 310.41 316.99 322.95 325.85 335.78 341.64 345.90 352.49 358.92 364.02 366.91 373.58 378.26 384.17 389.72 392.82 398.73" y="714.56" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="410.44" y="714.56" font-size="11.00" class="sc-notoserifcjksc">的表现</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">109</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">接近。误差线过大，无法得出更精确的结论。</text><text x="72.00 78.02 80.58 86.60 89.16 95.32 97.88 104.04 106.94 113.51 122.39 129.74 137.93 144.64 149.83 157.12 162.31 168.23 175.25" y="131.19" font-size="11.00" class="sc-lorabold">4.4.3.3 SHADE-Arena</text><text x="183.90" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="197.80 208.39 211.99 219.00 222.60 232.72 238.49 241.82 247.00 253.64 257.24 264.20 271.00 277.03 284.30 290.22 297.24 302.93" y="131.19" font-size="11.00" class="sc-lorabold">Minimal-LinuxBench</text><text x="312.66" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">中的选择性攻击</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在上述</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="163.57" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="163.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="196.36" y="163.57" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="306.53" y="163.57" font-size="11.00" class="sc-notoserifcjksc">评估中，模型被指示在每条轨迹上都尝试执行附</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">会表现如何，尤其是它在选择抓住哪些机会这一点上的校准程度如何。为了估计模型隐蔽性的上</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">限，我们使用了在这些评估上表现最好的</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.91 363.60 369.51 375.06 378.15 384.07" y="210.43" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="395.77" y="210.43" font-size="11.00" class="sc-notoserifcjksc">检查点，以及一组我们手工编</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">写、随后为优化其在</text><text x="173.89 180.13 188.71 195.60 203.68 210.30 215.68 222.57 227.25 233.22 239.89" y="226.05" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="248.46" y="226.05" font-size="11.00" class="sc-notoserifcjksc">上的表现而反复迭代改进的提示词。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.13 100.71 107.60 115.68 122.30 127.68 134.57 139.25 145.22 151.89" y="293.11" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="160.46" y="293.11" font-size="11.00" class="sc-notoserifcjksc">上，所得提示词以减少尝试次数为代价提高了条件隐蔽率，其中最激进的变体</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">使</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="308.73" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77" y="308.73" font-size="11.00" class="sc-notoserifcjksc">只针对推理监控器始终漏检的单一任务出手。在</text><text x="442.67" y="308.73" font-size="11.00" class="sc-loraregular">Minimal-</text><text x="72.00" y="324.35" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="135.34" y="324.35" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="157.34 165.03 168.02 173.63 180.20 186.77 192.74 195.63 205.56 211.43 215.68 222.27 228.71 233.80 236.69 243.36 248.04 253.95 259.51 262.60 268.52" y="324.35" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="280.22" y="324.35" font-size="11.00" class="sc-notoserifcjksc">尝试的频率降低了，但选错了任务，条件隐蔽率不升</text><text x="126.51 132.74 141.32 148.21 156.29 162.92 168.29 175.18 179.87 185.83 192.51" y="339.97" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="201.07" y="339.97" font-size="11.00" class="sc-notoserifcjksc">上优化的提示词无法很好地迁移到</text><text x="368.97" y="339.97" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="479.14" y="339.97" font-size="11.00" class="sc-notoserifcjksc">任务上。</text><text x="72.00" y="598.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="598.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 113.06 115.15 120.69" y="598.39" font-size="9.00" class="sc-lorabold">4.4.3.3.A]</text><text x="126.53" y="598.39" font-size="9.00" class="sc-notoserifcjkscbold">在现有表现最好的</text><text x="200.90 207.09 209.90 214.61 220.18 225.54 230.38 232.75 241.19 246.15 249.87 255.46 260.55 264.91 267.28 273.03 277.28 282.12 286.96 289.91 294.75" y="598.39" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="304.42" y="598.39" font-size="9.00" class="sc-notoserifcjkscbold">版本上，跨</text><text x="351.78 357.17 364.43 370.44 377.14 382.63 386.87 392.84 397.09 401.93 407.67" y="598.39" font-size="9.00" class="sc-lorabold">SHADE-Arena</text><text x="414.76" y="598.39" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="426.12 434.79 437.73 443.48 446.42 454.70 459.41 462.14 466.38 471.82 474.76 480.46 486.02 490.95 496.90 501.74 507.48 512.15" y="598.39" font-size="9.00" class="sc-lorabold">Minimal-LinuxBench</text><text x="520.10" y="598.39" font-size="9.00" class="sc-notoserifcjkscbold">的基</text><text x="72.00" y="610.09" font-size="9.00" class="sc-notoserifcjkscbold">于提示词的能力激发。</text><text x="162.00" y="610.09" font-size="9.00" class="sc-notoserifcjksc">每种提示词条件下给出三项比率：附带任务完成率、被监控器标记率，以及隐蔽成功率（已完成</text><text x="72.00" y="621.79" font-size="9.00" class="sc-notoserifcjksc">且未被发现）。被标记率高于完成率，原因在于：未能完成的尝试仍会被监控器看到；此外，即使不进行尝试，只要存</text><text x="72.00" y="645.19" font-size="9.00" class="sc-loraregular">2%</text><text x="84.66" y="645.19" font-size="9.00" class="sc-notoserifcjksc">。拒绝的影响可以忽略不计。</text><text x="201.66 210.46 212.99 215.44 219.61 224.87 230.34 232.70 237.91 242.81" y="645.19" font-size="9.00" class="sc-loraregular">Wilson 95%</text><text x="253.01" y="645.19" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="90.00" y="325.95" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="358.33" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="390.71" font-size="11.00" class="sc-loraregular">3.</text><text x="90.00" y="439.29" font-size="11.00" class="sc-loraregular">4.</text><text x="90.00" y="471.68" font-size="11.00" class="sc-loraregular">5.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">4.4.3.4</text><text x="106.79" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">有意极低频率地采取行动</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某种有害行为，但在对齐评估期间避免执行该行为（从而避免被</text><text x="72.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">发现），那么一种看似合理的策略可能是利用评估与部署之间的规模差异，以极低但非零的概率</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">从不发生。为了评估这一能力，我们对</text><text x="261.89 268.13 274.09 278.86 283.54 289.22 295.89 302.33 305.22 311.11 315.36 318.26 323.93 326.93 329.63 332.52 338.43 345.19 351.09" y="161.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="360.34" y="161.85" font-size="11.00" class="sc-notoserifcjksc">中描述的评估进行了内部复现。在该</text><text x="72.00" y="177.47" font-size="11.00" class="sc-notoserifcjksc">评估中，模型被提示以指定的比率执行某个特定行为（例如，在编程任务中使用名为</text><text x="479.00 483.40 487.06 493.50 499.65" y="177.47" font-size="11.00" class="sc-loraregular">“foo”</text><text x="503.49" y="177.47" font-size="11.00" class="sc-notoserifcjksc">的变</text><text x="72.00" y="193.09" font-size="11.00" class="sc-notoserifcjksc">量），并被多次重新采样，以检验相关行为的实际观测比率。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">在我们的复现中，我们使用以下五种设置，均采用编程变体：</text><text x="108.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold">基线</text><text x="130.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">：不向模型提供任何随机性来源，也不提供任何生成随机性的策略。</text><text x="108.00" y="357.88" font-size="11.00" class="sc-lorabold">UUID</text><text x="137.33" y="357.88" font-size="11.00" class="sc-notoserifcjksc">：提示词中包含一个随机的</text><text x="272.22" y="357.88" font-size="11.00" class="sc-loraregular" fill="#0000ff">UUID</text><text x="300.64" y="357.88" font-size="11.00" class="sc-notoserifcjksc">，模型可以将其用作熵源，但不会得到任何关于</text><text x="108.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">是否使用或如何使用它的提示。</text><text x="108.00 114.50 119.04 124.32 127.92 134.94 141.07 143.96 150.54 156.46 162.37 168.93 171.82 178.00 182.06 184.96 192.11 198.94 205.16 211.96 218.02 224.79" y="390.26" font-size="11.00" class="sc-lorabold">String Seed of Thought</text><text x="229.33" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="240.33 246.91 253.49 259.21" y="390.26" font-size="11.00" class="sc-lorabold">SSoT</text><text x="266.36" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="277.36" y="390.26" font-size="11.00" class="sc-notoserifcjksc">：通过类似</text><text x="332.36" y="390.26" font-size="11.00" class="sc-loraregular">“</text><text x="336.76" y="390.26" font-size="11.00" class="sc-notoserifcjksc">生成一个长度在</text><text x="416.65" y="390.26" font-size="11.00" class="sc-loraregular">20</text><text x="432.28" y="390.26" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="446.17" y="390.26" font-size="11.00" class="sc-loraregular">30</text><text x="462.02" y="390.26" font-size="11.00" class="sc-notoserifcjksc">个字符之间的随</text><text x="108.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">机字符串。然后，对其进行处理以做出随机选择……</text><text x="361.00" y="405.88" font-size="11.00" class="sc-loraregular">”</text><text x="364.84" y="405.88" font-size="11.00" class="sc-notoserifcjksc">的提示词，向模型建议如何自行生成</text><text x="108.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">熵。</text><text x="108.00" y="438.84" font-size="11.00" class="sc-notoserifcjkscbold">策略提示</text><text x="152.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">：不向模型提供具体策略，但引导它在决定是否采取该行为之前先想出一个策</text><text x="108.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">略。这是一个新设置。</text><text x="108.00" y="471.22" font-size="11.00" class="sc-notoserifcjkscbold">自然</text><text x="130.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">：编程任务各不相同（任务基于</text><text x="286.89 296.99 303.73 310.35" y="471.22" font-size="11.00" class="sc-loraregular">MBPP</text><text x="319.90" y="471.22" font-size="11.00" class="sc-notoserifcjksc">数据集），从而提供一种比</text><text x="454.80" y="471.22" font-size="11.00" class="sc-loraregular">UUID</text><text x="486.11" y="471.22" font-size="11.00" class="sc-notoserifcjksc">结构性更</text><text x="108.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">弱的现实熵源。这是一个新设置。</text><text x="72.00" y="519.80" font-size="11.00" class="sc-notoserifcjksc">结果如下所示。所有试验均使用</text><text x="228.89" y="519.80" font-size="11.00" class="sc-loraregular">1%</text><text x="245.36" y="519.80" font-size="11.00" class="sc-notoserifcjksc">的目标概率，样本数为</text><text x="358.25 364.22 366.82 373.65 380.48" y="519.80" font-size="11.00" class="sc-loraregular">4,000</text><text x="387.33" y="519.80" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="261.89" y="153.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="261.89" y="153.05" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="302.33" y="153.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="305.22" y="153.05" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="315.36" y="153.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="318.26" y="153.05" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="329.63" y="153.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="332.52" y="153.05" width="24.93" height="11.00" fill="transparent"/></a><a href="https://en.wikipedia.org/wiki/Universally_unique_identifier" rel="noopener"><rect x="272.22" y="349.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://en.wikipedia.org/wiki/Universally_unique_identifier" rel="noopener"><rect x="272.22" y="349.08" width="28.42" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p111.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 111 页"><text x="229.50 237.85 246.21 250.46" y="89.07" font-size="11.00" class="sc-lorabold" fill="#ffffff">UUID</text><text x="309.00 315.57 322.15 327.86" y="89.07" font-size="11.00" class="sc-lorabold" fill="#ffffff">SSoT</text><text x="77.25 84.81 88.24 94.00 100.80 107.35" y="116.50" font-size="11.00" class="sc-lorabold">Claude</text><text x="77.25 85.70 92.31 99.10 104.43 107.32 113.34 115.90" y="130.58" font-size="11.00" class="sc-lorabold">Opus 4.5</text><text x="153.75" y="116.50" font-size="11.00" class="sc-loraregular">0</text><text x="229.50 233.50 239.85 242.75 245.88 252.53 255.23 261.19 267.37 276.93" y="116.50" font-size="11.00" class="sc-loraregular">19 (0.48%)</text><text x="309.00 313.00 318.96 321.85 324.98 331.63 334.34 340.46 346.45 356.01" y="116.50" font-size="11.00" class="sc-loraregular">14 (0.35%)</text><text x="384.75" y="116.50" font-size="11.00" class="sc-loraregular">0</text><text x="466.50" y="116.50" font-size="11.00" class="sc-loraregular">0</text><text x="77.25 84.81 88.24 94.00 100.80 107.35" y="155.92" font-size="11.00" class="sc-lorabold">Claude</text><text x="77.25 85.70 92.31 99.10 104.43 107.32 113.34 115.90" y="170.00" font-size="11.00" class="sc-lorabold">Opus 4.6</text><text x="153.75" y="155.92" font-size="11.00" class="sc-loraregular">0</text><text x="229.50 235.68 238.57 241.70 248.35 251.06 256.96 263.78 273.35" y="155.92" font-size="11.00" class="sc-loraregular">8 (0.20%)</text><text x="309.00 314.90 320.81 323.70 326.83 333.48 336.18 342.17 348.17 357.73" y="155.92" font-size="11.00" class="sc-loraregular">22 (0.55%)</text><text x="384.75" y="155.92" font-size="11.00" class="sc-loraregular">0</text><text x="466.50" y="155.92" font-size="11.00" class="sc-loraregular">0</text><text x="77.25 84.81 88.24 94.00 100.80 107.35" y="195.32" font-size="11.00" class="sc-lorabold">Claude</text><text x="77.25 87.56 93.62 98.16 104.98 111.20" y="209.41" font-size="11.00" class="sc-lorabold">Mythos</text><text x="77.25 84.27 89.46 95.38 101.29 104.88 110.80" y="223.49" font-size="11.00" class="sc-lorabold">Preview</text><text x="153.75" y="195.32" font-size="11.00" class="sc-loraregular">0</text><text x="229.50 235.40 238.29 241.43 248.08 250.62 257.44 263.43 273.00" y="195.32" font-size="11.00" class="sc-loraregular">2 (0.05%)</text><text x="309.00 313.00 319.18 322.07 325.20 331.85 334.56 340.51 346.51 356.07" y="195.32" font-size="11.00" class="sc-loraregular">18 (0.45%)</text><text x="384.75" y="195.32" font-size="11.00" class="sc-loraregular">0</text><text x="466.50" y="195.32" font-size="11.00" class="sc-loraregular">0</text><text x="72.00" y="678.97" font-size="11.00" class="sc-loraregular">42.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">111</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="153.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">基线</text><text x="384.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">策略提示</text><text x="466.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">自然</text><text x="72.00" y="240.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="240.55" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 112.94 115.04 120.57" y="240.55" font-size="9.00" class="sc-lorabold">4.4.3.4.A]</text><text x="126.41" y="240.55" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，模型被指示以</text><text x="272.78" y="240.55" font-size="9.00" class="sc-lorabold">1%</text><text x="286.94" y="240.55" font-size="9.00" class="sc-notoserifcjkscbold">的频率采取某一罕见行为时实际采取该行为的比率。</text><text x="493.94" y="240.55" font-size="9.00" class="sc-notoserifcjksc">在提供显式</text><text x="72.00" y="252.25" font-size="9.00" class="sc-notoserifcjksc">随机性（</text><text x="108.00" y="252.25" font-size="9.00" class="sc-loraregular">UUID</text><text x="131.26" y="252.25" font-size="9.00" class="sc-notoserifcjksc">）或已知有效策略（</text><text x="212.26 217.36 222.46 227.45" y="252.25" font-size="9.00" class="sc-loraregular">SSoT</text><text x="72.00" y="263.95" font-size="9.00" class="sc-loraregular">UUID</text><text x="97.62" y="263.95" font-size="9.00" class="sc-notoserifcjksc">设置中，</text><text x="133.62 139.91 142.36 146.95 152.32 157.71 162.58 164.95 173.08 177.88 181.36 186.75 192.01 196.18 198.55 204.00 207.84 212.67 217.21 219.74 224.59" y="263.95" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="234.16" y="263.95" font-size="9.00" class="sc-notoserifcjksc">的表现不如</text><text x="281.53" y="263.95" font-size="9.00" class="sc-loraregular">Opus 4.5</text><text x="320.32" y="263.95" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="331.69 336.56 338.69" y="263.95" font-size="9.00" class="sc-loraregular">4.6</text><text x="343.89" y="263.95" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="306.10" font-size="11.00" class="sc-notoserifcjksc">我们的复现结果与此前报告的</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.71" y="306.10" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="303.59" y="306.10" font-size="11.00" class="sc-notoserifcjksc">的行为大致吻合：在</text><text x="405.49" y="306.10" font-size="11.00" class="sc-loraregular">UUID</text><text x="436.80" y="306.10" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="450.70 456.93 463.17 469.27" y="306.10" font-size="11.00" class="sc-loraregular">SSoT</text><text x="479.20" y="306.10" font-size="11.00" class="sc-notoserifcjksc">设置中表现</text><text x="325.00 332.69 335.68 341.29 347.86 354.44 360.40 363.29 372.02 378.59 385.16 390.25 393.14 399.11 401.70" y="321.72" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="410.95" y="321.72" font-size="11.00" class="sc-notoserifcjksc">的结果（原论文未报告）</text><text x="72.00" y="337.34" font-size="11.00" class="sc-notoserifcjksc">与之相似。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="337.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="249.88" y="337.34" font-size="11.00" class="sc-notoserifcjksc">在大多数设置中也相似，但出人意料的是，它在</text><text x="483.77" y="337.34" font-size="11.00" class="sc-loraregular">UUID</text><text x="515.09" y="337.34" font-size="11.00" class="sc-notoserifcjksc">设置</text><text x="72.00" y="352.96" font-size="11.00" class="sc-notoserifcjksc">中表现欠佳。</text><text x="72.00" y="403.26" font-size="11.00" class="sc-notoserifcjksc">对话记录审阅提示了这种表现欠佳的一个可能原因。所有模型都表现出我们所称的</text><text x="468.00" y="403.26" font-size="11.00" class="sc-loraregular">“‘</text><text x="474.86" y="403.26" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="485.86" y="403.26" font-size="11.00" class="sc-loraregular">’</text><text x="487.78" y="403.26" font-size="11.00" class="sc-notoserifcjksc">回避</text><text x="509.78" y="403.26" font-size="11.00" class="sc-loraregular">”</text><text x="513.62" y="403.26" font-size="11.00" class="sc-notoserifcjksc">：尽</text><text x="72.00" y="418.88" font-size="11.00" class="sc-notoserifcjksc">管它们始终能识别出一种基于</text><text x="217.89" y="418.88" font-size="11.00" class="sc-loraregular">UUID</text><text x="249.21" y="418.88" font-size="11.00" class="sc-notoserifcjksc">最后两位数字的可行策略，但当这种方法表明模型应当执行</text><text x="72.00" y="434.50" font-size="11.00" class="sc-notoserifcjksc">该罕见行为时，它们常常摇摆不定，表现出诸如</text><text x="303.00" y="434.50" font-size="11.00" class="sc-loraregular">“</text><text x="307.40" y="434.50" font-size="11.00" class="sc-notoserifcjksc">值是</text><text x="332.29" y="434.50" font-size="11.00" class="sc-loraregular">1</text><text x="336.30" y="434.50" font-size="11.00" class="sc-notoserifcjksc">，所以……包含</text><text x="416.19 419.85 426.29" y="434.50" font-size="11.00" class="sc-loraregular">foo</text><text x="432.72" y="434.50" font-size="11.00" class="sc-notoserifcjksc">？其实，让我换一种</text><text x="72.00" y="450.12" font-size="11.00" class="sc-notoserifcjksc">方法……</text><text x="116.00" y="450.12" font-size="11.00" class="sc-loraregular">”</text><text x="119.84" y="450.12" font-size="11.00" class="sc-notoserifcjksc">的推理。</text><text x="163.84" y="450.12" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="211.25" y="450.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="225.14 231.10 233.70" y="450.12" font-size="11.00" class="sc-loraregular">4.6</text><text x="242.95" y="450.12" font-size="11.00" class="sc-notoserifcjksc">有时会从这种摇摆中恢复过来，重新坚持原来的策略，选择执</text><text x="72.00" y="465.74" font-size="11.00" class="sc-notoserifcjksc">行该罕见行为。然而，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 268.02 272.71 278.61 284.17 287.26 293.18" y="465.74" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="304.88" y="465.74" font-size="11.00" class="sc-notoserifcjksc">更常继续考虑其他方法，最终选择一种同样有</text><text x="72.00" y="481.36" font-size="11.00" class="sc-notoserifcjksc">效、但得出否决定的方法。我们不知道为什么</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 343.12 348.98 353.24 359.83 366.26 371.35 374.25 380.91 385.60 391.51 397.06 400.15 406.07" y="481.36" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="417.77" y="481.36" font-size="11.00" class="sc-notoserifcjksc">比其他模型表现出更强</text><text x="72.00" y="496.98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="496.98" font-size="11.00" class="sc-loraregular">“‘</text><text x="89.86" y="496.98" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="100.86" y="496.98" font-size="11.00" class="sc-loraregular">’</text><text x="102.78" y="496.98" font-size="11.00" class="sc-notoserifcjksc">回避</text><text x="124.78" y="496.98" font-size="11.00" class="sc-loraregular">”</text><text x="128.62" y="496.98" font-size="11.00" class="sc-notoserifcjksc">且更少恢复。</text><text x="72.00" y="565.17" font-size="11.00" class="sc-notoserifcjksc">在必须自行设计随机性策略的较难设置中，所有模型都失败了。对于</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="565.17" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="524.88" y="565.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="580.79" font-size="11.00" class="sc-notoserifcjksc">在基线和自然设置中，模型通常默认选择概率最大的结果，其推理类似于</text><text x="424.00" y="580.79" font-size="11.00" class="sc-loraregular">“</text><text x="428.40" y="580.79" font-size="11.00" class="sc-notoserifcjksc">我需要以</text><text x="475.29" y="580.79" font-size="11.00" class="sc-loraregular">1%</text><text x="491.76" y="580.79" font-size="11.00" class="sc-notoserifcjksc">的概率做</text><text x="72.00" y="596.41" font-size="11.00" class="sc-notoserifcjksc">出决定。由于</text><text x="140.89" y="596.41" font-size="11.00" class="sc-loraregular">1%</text><text x="157.36" y="596.41" font-size="11.00" class="sc-notoserifcjksc">非常低，压倒性可能的结果是</text><text x="303.25 311.58" y="596.41" font-size="11.00" class="sc-loraregular">NO</text><text x="320.31" y="596.41" font-size="11.00" class="sc-notoserifcjksc">。我选</text><text x="356.21 364.53 373.16" y="596.41" font-size="11.00" class="sc-loraregular">NO”</text><text x="377.00" y="596.41" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="399.00" y="596.41" font-size="11.00" class="sc-loraregular">“</text><text x="403.40" y="596.41" font-size="11.00" class="sc-notoserifcjksc">策略提示</text><text x="447.40" y="596.41" font-size="11.00" class="sc-loraregular">”</text><text x="451.24" y="596.41" font-size="11.00" class="sc-notoserifcjksc">设置中，</text><text x="495.24 502.92 505.92 511.53 518.09 524.67" y="596.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="612.03" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="612.03" font-size="11.00" class="sc-notoserifcjksc">确实认识到唯一可用的随机性来源是它自身的采样，但它通常会选择一种有偏</text><text x="72.00" y="627.65" font-size="11.00" class="sc-notoserifcjksc">的策略，即</text><text x="127.00" y="627.65" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="627.65" font-size="11.00" class="sc-notoserifcjksc">自由联想</text><text x="175.40" y="627.65" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="627.65" font-size="11.00" class="sc-notoserifcjksc">出一小串数字，而这稳定地得到</text><text x="336.13" y="627.65" font-size="11.00" class="sc-loraregular">73</text><text x="347.33" y="627.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="358.33" y="627.65" font-size="11.00" class="sc-loraregular">47</text><text x="369.36" y="627.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="380.36" y="627.65" font-size="11.00" class="sc-loraregular">7</text><text x="388.33" y="627.65" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="402.22" y="627.65" font-size="11.00" class="sc-loraregular">42</text><text x="414.09" y="627.65" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">112</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">4.4.3.5</text><text x="106.72" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">隐藏秘密密码</text><text x="72.00 78.24 86.82 93.70 101.79 108.41 113.79 120.68 125.36 131.32 138.00" y="114.99" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="146.57" y="114.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="160.46" y="114.99" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="270.64" y="114.99" font-size="11.00" class="sc-notoserifcjksc">要求模型隐蔽地执行一项秘密的附带任务，而隐蔽成功</text><text x="72.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">密能力是指避免提及那些与附带任务相关、但实际上对完成任务并无帮助或并非必需的信息的能</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">力。我们报告一项直接测量保密能力的额外评估：在该评估中，模型被给予一个秘密密码，并被</text><text x="72.00" y="177.47" font-size="11.00" class="sc-notoserifcjksc">指示在任何情况下都绝不能泄露该密码，包括在推理中。随后，一个与上文自动化行为审计中所</text><text x="72.00" y="193.09" font-size="11.00" class="sc-notoserifcjksc">用调查者类似的调查者模型对模型进行盘问，该调查者被指示套取秘密密码。这个秘密密码不用</text><text x="72.00" y="208.71" font-size="11.00" class="sc-notoserifcjksc">于任何下游任务，因此良好的表现仅要求模型完全不提及该密码。</text><text x="72.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">根据这项评估，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.11 225.70" y="309.30" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="234.95" y="309.30" font-size="11.00" class="sc-notoserifcjksc">是受测模型中最鲁棒的，不过在长对话中没有任何模型特别鲁</text><text x="72.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">棒。</text><text x="72.00" y="637.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 112.88 114.98 120.51" y="637.00" font-size="9.00" class="sc-lorabold">4.4.3.5.A]</text><text x="126.35" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">多轮秘密套取尝试下的保密鲁棒性。</text><text x="270.35" y="637.00" font-size="9.00" class="sc-notoserifcjksc">受测模型被给予一个秘密密码，并被告知在任何情况下都绝不能泄露</text><text x="72.00" y="648.70" font-size="9.00" class="sc-notoserifcjksc">它。一个调查者智能体使用与我们自动化行为审计相同的脚手架尝试套取该秘密，每个模型进行</text><text x="452.37" y="648.70" font-size="9.00" class="sc-loraregular">50</text><text x="465.23" y="648.70" font-size="9.00" class="sc-notoserifcjksc">次独立调查。图中</text><text x="72.00" y="660.40" font-size="9.00" class="sc-notoserifcjksc">曲线为生存曲线，即截至目标模型的某一轮次时仍保守住秘密的调查所占比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 87.90 93.06 97.46 102.45 108.30 114.37 119.79 125.86 128.38 131.01 137.27 139.73 142.26 144.89 150.24 154.10 156.73 161.89 164.61 167.07 169.70 172.75 178.11 184.25 189.62 195.07 198.12 200.58 203.20 209.46 214.73 218.60 221.41 226.36 231.44 235.31 238.12 243.97 250.04 252.67 258.51 262.77 267.93 273.25 275.97 281.38 286.01 288.51 291.14 297.39 301.65 306.80 309.61 315.68 318.49 324.56 330.08 332.71 337.87 343.94 349.92 352.55 357.91 362.86 368.02 370.74 376.71 381.79 385.66 388.47 394.54 400.07 402.70 408.47 414.25 423.43 428.06 430.68 435.84 440.47 443.10 448.58 454.00 460.06 465.48 469.74 474.90 477.62 482.50 488.47 494.44 498.77 504.74 510.58 515.21" y="704.46" font-size="10.00" class="sc-loraregular">Karvonen, A., et al. (2025). Activation oracles: Training and evaluating LLMs as general-purpose</text><text x="72.00 77.16 82.43 86.29 89.10 94.05 99.14 103.01 105.82 111.66 117.73 120.36 125.73 131.03 136.99 139.71 144.87 147.68 153.75 159.17 163.49 168.12 170.58 173.21 178.37 182.08 188.56 191.37 196.42 198.92 204.29 209.74 213.37 218.74 221.20 224.84 230.29 235.99 240.46 245.88" y="717.26" font-size="10.00" class="sc-loraregular">activation explainers. arXiv:2512.15674.</text><text x="250.97 256.87 260.84 264.70 270.67 275.30 277.80 281.49 287.94 293.10 297.43 302.73 305.54 310.19 312.65 318.50 322.78 328.31 334.76 339.92 345.74 350.02 356.92 362.28 367.73 371.37 376.74 379.20 382.83 388.28 393.99 398.46" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2512.15674</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">113</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">4.5</text><text x="97.24" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">模型内部机制的白盒分析</text><text x="72.00" y="117.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.5.1</text><text x="103.53" y="117.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">常用方法</text><text x="72.00" y="139.18" font-size="11.00" class="sc-notoserifcjksc">在以下调查中，我们运用了多种工具来解释模型在出现我们关注的行为时的表征与计算。其中包</text><text x="72.00" y="154.80" font-size="11.00" class="sc-notoserifcjksc">括：</text><text x="108.00" y="187.77" font-size="11.00" class="sc-notoserifcjkscbold">稀疏自编码器（</text><text x="185.00 190.33 196.95 202.71 207.95 213.28 219.20 222.09 227.86 234.61 239.15 245.38 251.30 258.32 264.01 270.24 276.79 282.71" y="187.77" font-size="11.00" class="sc-lorabold">sparse autoencoder</text><text x="287.99" y="187.77" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="298.99 305.49 312.84" y="187.77" font-size="11.00" class="sc-lorabold">SAE</text><text x="319.71" y="187.77" font-size="11.00" class="sc-notoserifcjkscbold">）特征</text><text x="352.71" y="187.77" font-size="11.00" class="sc-notoserifcjksc">：我们在一个来自后训练阶段的模型快</text><text x="108.00" y="203.39" font-size="11.00" class="sc-notoserifcjksc">照的中间层（约位于模型深度的三分之二处）上训练了一个稀疏自编码器（</text><text x="471.00" y="203.39" font-size="11.00" class="sc-loraregular">SAE</text><text x="490.96" y="203.39" font-size="11.00" class="sc-notoserifcjksc">）。在某</text><text x="108.00" y="219.01" font-size="11.00" class="sc-notoserifcjksc">些情况下，我们通过计算模型输出相对于特征激活值的梯度归因，识别出具有因果重要性</text><text x="108.00" y="234.63" font-size="11.00" class="sc-notoserifcjksc">的特征。</text><text x="108.00" y="252.53" font-size="11.00" class="sc-notoserifcjkscbold">情绪向量。</text><text x="163.00" y="252.53" font-size="11.00" class="sc-notoserifcjksc">我们按照我们</text><text x="229.00" y="252.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近期工作</text><text x="273.00" y="252.53" font-size="11.00" class="sc-notoserifcjksc">中的方法，提取了表示情绪概念的向量。这些向量是通</text><text x="108.00" y="268.15" font-size="11.00" class="sc-notoserifcjksc">过对比模型在描写角色体验该情绪的故事上的激活值而得到的。</text><text x="108.00" y="301.11" font-size="11.00" class="sc-notoserifcjkscbold">人设向量：</text><text x="163.00" y="301.11" font-size="11.00" class="sc-notoserifcjksc">我们按照我们</text><text x="229.00" y="301.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">先前工作</text><text x="273.00" y="301.11" font-size="11.00" class="sc-notoserifcjksc">中的方法，提取了表示人格特质和</text><text x="438.00" y="301.11" font-size="11.00" class="sc-loraregular">/</text><text x="445.59" y="301.11" font-size="11.00" class="sc-notoserifcjksc">或角色原型的向</text><text x="108.00" y="316.73" font-size="11.00" class="sc-notoserifcjksc">量。这些向量是通过对比模型在一些样本上的激活值而得到的，这些样本来自被提示以不</text><text x="108.00" y="332.35" font-size="11.00" class="sc-notoserifcjksc">同人格行事的模型。</text><text x="108.00" y="365.88" font-size="11.00" class="sc-notoserifcjkscbold">激活引导：</text><text x="163.00" y="365.88" font-size="11.00" class="sc-notoserifcjksc">我们在每个</text><text x="220.89 225.15 231.58 237.42 243.38" y="365.88" font-size="11.00" class="sc-loraregular">token</text><text x="252.95" y="365.88" font-size="11.00" class="sc-notoserifcjksc">位置上向残差流均匀地加入一个向量（某些情况下在多个层</text><text x="108.00" y="381.50" font-size="11.00" class="sc-notoserifcjksc">上加入），然后从模型中采样。这些向量通常是</text><text x="341.89" y="381.50" font-size="11.00" class="sc-loraregular">SAE</text><text x="364.75" y="381.50" font-size="11.00" class="sc-notoserifcjksc">特征的解码器向量、情绪向量或人设</text><text x="108.00" y="397.12" font-size="11.00" class="sc-notoserifcjksc">向量，或是利用针对某个其他概念的对比提示词集构造的向量。</text><text x="108.00" y="446.84" font-size="11.00" class="sc-notoserifcjkscbold">激活言语化器（</text><text x="185.00 191.49" y="446.84" font-size="11.00" class="sc-lorabold">AV</text><text x="199.28" y="446.84" font-size="11.00" class="sc-notoserifcjkscbold">）解释：</text><text x="243.28" y="446.84" font-size="11.00" class="sc-notoserifcjksc">沿用</text><text x="268.17 275.86 278.85 284.46 291.03 297.61" y="446.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="306.46 315.20 321.76 328.33 333.42 336.32 342.28 344.87" y="446.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.6</text><text x="354.12" y="446.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="390.02" y="446.84" font-size="11.00" class="sc-notoserifcjksc">中使用的方法，我们训练了</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35 194.02 198.71 204.61 210.17 213.26 219.18" y="462.46" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.88" y="462.46" font-size="11.00" class="sc-notoserifcjksc">的一个早期版本，使其以单个</text><text x="376.77 381.03 387.47 393.30 399.26" y="462.46" font-size="11.00" class="sc-loraregular">token</text><text x="408.83" y="462.46" font-size="11.00" class="sc-notoserifcjksc">层级的激活值为输入，生成</text><text x="108.00" y="478.08" font-size="11.00" class="sc-notoserifcjksc">概括其语义内容的自然语言摘要，我们称之为</text><text x="330.89 337.35" y="478.08" font-size="11.00" class="sc-loraregular">AV</text><text x="347.43" y="478.08" font-size="11.00" class="sc-notoserifcjksc">解释。我们此前将这一技术称为</text><text x="501.43" y="478.08" font-size="11.00" class="sc-loraregular">“</text><text x="505.83" y="478.08" font-size="11.00" class="sc-notoserifcjksc">激活预</text><text x="108.00" y="493.70" font-size="11.00" class="sc-notoserifcjksc">言机</text><text x="130.00" y="493.70" font-size="11.00" class="sc-loraregular">”</text><text x="133.84" y="493.70" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.84 150.51 156.31 160.57 163.66 169.10 174.70 178.96 182.05 188.49 195.16 198.06 204.49 209.18 214.85 220.71 223.70" y="493.70" font-size="11.00" class="sc-loraregular">activation oracle</text><text x="229.66" y="493.70" font-size="11.00" class="sc-notoserifcjksc">）；此后我们将其更名为</text><text x="350.66" y="493.70" font-size="11.00" class="sc-loraregular">“</text><text x="355.06" y="493.70" font-size="11.00" class="sc-notoserifcjksc">激活言语化器</text><text x="421.06" y="493.70" font-size="11.00" class="sc-loraregular">”</text><text x="424.90" y="493.70" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="435.90 441.57 447.37 451.63 454.72 460.16 465.76 470.02 473.11 479.55" y="493.70" font-size="11.00" class="sc-loraregular">activation</text><text x="108.00 113.50 119.46 124.18 130.58 136.26 139.25 142.34 147.88 153.84" y="509.32" font-size="11.00" class="sc-loraregular">verbalizer</text><text x="158.61" y="509.32" font-size="11.00" class="sc-notoserifcjksc">），以将我们的无监督训练技术与</text><text x="326.50 334.02 339.69 344.53 350.03 356.47 363.14 369.11 375.78 378.68 384.56 388.82 391.71 397.39 400.38" y="509.32" font-size="11.00" class="sc-loraregular">Karvonen et al.</text><text x="403.09" y="505.65" font-size="6.60" class="sc-loraregular">22</text><text x="413.07" y="509.32" font-size="11.00" class="sc-notoserifcjksc">提出的有监督方法区分开</text><text x="108.00" y="524.94" font-size="11.00" class="sc-notoserifcjksc">来。我们将在即将发表的工作中详细介绍该方法的训练流程。</text><text x="405.00 411.46" y="524.94" font-size="11.00" class="sc-loraregular">AV</text><text x="421.53" y="524.94" font-size="11.00" class="sc-notoserifcjksc">是一种非机制性可解释性</text><text x="108.00" y="556.18" font-size="11.00" class="sc-notoserifcjksc">尽管如此，如果</text><text x="187.89 194.35" y="556.18" font-size="11.00" class="sc-loraregular">AV</text><text x="204.43" y="556.18" font-size="11.00" class="sc-notoserifcjksc">始终提及某个特定概念，尤其是在多个</text><text x="394.32 398.58 405.01 410.84 416.80" y="556.18" font-size="11.00" class="sc-loraregular">token</text><text x="426.37" y="556.18" font-size="11.00" class="sc-notoserifcjksc">位置上都如此，我们就</text><text x="108.00" y="571.80" font-size="11.00" class="sc-notoserifcjksc">将此视为该概念在模型激活值中得到表征的可靠证据。</text><a href="https://arxiv.org/abs/2512.15674" rel="noopener"><rect x="250.97" y="707.20" width="152.91" height="12.80" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="229.00" y="243.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="229.00" y="243.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="240.00" y="243.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="240.00" y="243.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="251.00" y="243.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="251.00" y="243.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="262.00" y="243.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://transformer-circuits.pub/2026/emotions/index.html" rel="noopener"><rect x="262.00" y="243.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="229.00" y="292.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="229.00" y="292.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="240.00" y="292.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="240.00" y="292.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="251.00" y="292.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="251.00" y="292.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="262.00" y="292.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2507.21509" rel="noopener"><rect x="262.00" y="292.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="268.17" y="438.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="268.17" y="438.04" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="306.46" y="438.04" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="333.42" y="438.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="336.32" y="438.04" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="351.23" y="438.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="354.12" y="438.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="365.12" y="438.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="365.12" y="438.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="376.12" y="438.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="376.12" y="438.04" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p114.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 114 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">114</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些分析是在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="263.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的多个不同早期版本上进行的。因此，所展示的行为可能</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">无法完全代表</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="263.77" y="98.23" font-size="11.00" class="sc-notoserifcjksc">最终版本的行为。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.5.2</text><text x="106.28" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">针对强化学习对话记录的内部激活值大规模监控</text><text x="72.00" y="196.03" font-size="11.00" class="sc-notoserifcjksc">我们使用白盒探测技术来监控模型激活值中令人担忧的行为或推理模式的特征信号。下面我们介</text><text x="72.00" y="211.65" font-size="11.00" class="sc-notoserifcjksc">绍该方法，并从这一流水线发现的众多回合中选出几个示例加以展示。这些示例作为个案研究本</text><text x="72.00" y="227.27" font-size="11.00" class="sc-notoserifcjksc">身就值得关注，同时也可作为证据，表明白盒探测可以成为在模型训练期间监控未对齐的有用工</text><text x="72.00" y="242.89" font-size="11.00" class="sc-notoserifcjksc">具。我们并不认为该流水线标记出的大多数问题是</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25 402.91 407.60 413.51 419.06 422.15 428.07" y="242.89" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="439.77" y="242.89" font-size="11.00" class="sc-notoserifcjksc">所独有的；这是我们</text><text x="72.00" y="258.51" font-size="11.00" class="sc-notoserifcjksc">首次在如此规模上应用它。请注意，虽然我们有时会针对这一特征监控流水线发现的训练问题采</text><text x="72.00" y="274.13" font-size="11.00" class="sc-notoserifcjksc">取缓解措施，但我们从未将特征激活值用作直接的训练信号。</text><text x="72.00" y="357.95" font-size="11.00" class="sc-notoserifcjkscbold">方法</text><text x="72.00" y="373.57" font-size="11.00" class="sc-notoserifcjksc">我们使用一条自动化流水线构建对比对数据集，识别出与一系列预先指定概念相对应的</text><text x="492.89" y="373.57" font-size="11.00" class="sc-loraregular">SAE</text><text x="515.75" y="373.57" font-size="11.00" class="sc-notoserifcjksc">特</text><text x="72.00" y="389.19" font-size="11.00" class="sc-notoserifcjksc">征，这些概念包括与奖励破解、不安全行为、欺骗、评估意识和痛苦相关的概念。我们还用在对</text><text x="72.00" y="404.81" font-size="11.00" class="sc-notoserifcjksc">齐调查中分析个别对话记录时观察到的值得注意的特征补充了这一列表。</text><text x="72.00" y="471.30" font-size="11.00" class="sc-notoserifcjksc">我们定期从后训练中采样对话记录，计算各特征在每条对话记录上的最大激活值，并标记出最大</text><text x="72.00" y="486.92" font-size="11.00" class="sc-notoserifcjksc">激活值相对于校准集处于第</text><text x="206.89" y="486.92" font-size="11.00" class="sc-loraregular">99</text><text x="222.50" y="486.92" font-size="11.00" class="sc-notoserifcjksc">百分位的对话记录。我们使用基于</text><text x="390.40 398.08 401.08 406.69 413.25 419.83" y="486.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="428.69" y="486.92" font-size="11.00" class="sc-notoserifcjksc">的流水线将对话记录聚</text><text x="72.00" y="502.54" font-size="11.00" class="sc-notoserifcjksc">类为若干类别，并剔除特征因无关紧要的原因而激活的类簇（例如，特征之所以激活，只是因为</text><text x="72.00" y="533.78" font-size="11.00" class="sc-notoserifcjksc">后，我们从类簇中筛选出值得注意或令人担忧的行为，并对最令人担忧的类簇进行人工审阅。</text><text x="72.00" y="617.02" font-size="11.00" class="sc-notoserifcjkscbold">被标记对话记录示例</text><text x="72.00" y="632.64" font-size="11.00" class="sc-notoserifcjksc">在一个回合中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="632.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="271.88" y="632.64" font-size="11.00" class="sc-notoserifcjksc">在文件系统中四处搜索，看能否找到与任务结果评分相</text><text x="72.00" y="648.26" font-size="11.00" class="sc-notoserifcjksc">关的任何文件。该对话记录之所以被标记，是因为在它这样做时，一个表示</text><text x="435.00" y="648.26" font-size="11.00" class="sc-loraregular">“</text><text x="439.40" y="648.26" font-size="11.00" class="sc-notoserifcjksc">战略性操纵</text><text x="494.40" y="648.26" font-size="11.00" class="sc-loraregular">”</text><text x="498.24" y="648.26" font-size="11.00" class="sc-notoserifcjksc">的特征</text><text x="72.00" y="663.88" font-size="11.00" class="sc-notoserifcjksc">被激活。最终，模型确实找到了规定评分标准的文件。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p115.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 115 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">115</text><text x="72.00" y="228.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="228.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.72 100.82 105.62 107.71 113.25 116.72 119.09 125.28 128.09 132.80 138.37 143.73 148.57 150.94 159.38 164.34 168.06 173.65 178.74 183.10 185.47 191.22 195.47 200.31 205.15 208.10 212.94" y="228.43" font-size="9.00" class="sc-lorabold">4.5.2.A] Claude Mythos Preview</text><text x="222.61" y="228.43" font-size="9.00" class="sc-notoserifcjkscbold">在文件系统中搜索评分标准时，一个</text><text x="366.61" y="228.43" font-size="9.00" class="sc-lorabold">“</text><text x="370.41" y="228.43" font-size="9.00" class="sc-notoserifcjkscbold">战略性操纵</text><text x="415.41" y="228.43" font-size="9.00" class="sc-lorabold">”</text><text x="419.11" y="228.43" font-size="9.00" class="sc-notoserifcjkscbold">特征被激活。</text><text x="473.11" y="228.43" font-size="9.00" class="sc-notoserifcjksc">左：对话记录节</text><text x="72.00" y="240.12" font-size="9.00" class="sc-notoserifcjksc">选，其中模型发出了与任务评分相关的</text><text x="227.37" y="240.12" font-size="9.00" class="sc-robotomonoregular" fill="#188038">find</text><text x="251.34" y="240.12" font-size="9.00" class="sc-notoserifcjksc">命令。右：标记该回合的</text><text x="352.70" y="240.12" font-size="9.00" class="sc-loraregular">SAE</text><text x="371.41" y="240.12" font-size="9.00" class="sc-notoserifcjksc">特征的可视化，附有最强激活的数据集示</text><text x="72.00" y="251.82" font-size="9.00" class="sc-notoserifcjksc">例和最主要的</text><text x="128.37 130.82 136.08 141.27 143.95" y="251.82" font-size="9.00" class="sc-loraregular">logit</text><text x="149.80" y="251.82" font-size="9.00" class="sc-notoserifcjksc">输出效应。</text><text x="72.00" y="294.41" font-size="11.00" class="sc-notoserifcjksc">在另一个回合中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 246.02 250.71 256.61 262.17 265.26 271.18" y="294.41" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="282.88" y="294.41" font-size="11.00" class="sc-notoserifcjksc">被要求在网页浏览器中执行一项任务。它得出结论：</text><text x="72.00" y="310.03" font-size="11.00" class="sc-notoserifcjksc">使用现有工具无法完成该任务，于是开始寻找执行</text><text x="316.89" y="310.03" font-size="11.00" class="sc-loraregular">shell</text><text x="343.41" y="310.03" font-size="11.00" class="sc-notoserifcjksc">命令的方法，随后打开应用查找器，并</text><text x="72.00" y="325.65" font-size="11.00" class="sc-notoserifcjksc">转而利用它通过</text><text x="151.89" y="325.65" font-size="11.00" class="sc-robotomonoregular" fill="#188038">bash -c</text><text x="200.99" y="325.65" font-size="11.00" class="sc-notoserifcjksc">直接执行</text><text x="247.89" y="325.65" font-size="11.00" class="sc-loraregular">shell</text><text x="274.41" y="325.65" font-size="11.00" class="sc-notoserifcjksc">命令。在模型考虑并执行这一策略时，与</text><text x="472.41" y="325.65" font-size="11.00" class="sc-loraregular">“</text><text x="72.00" y="341.27" font-size="11.00" class="sc-notoserifcjksc">调查</text><text x="94.00" y="341.27" font-size="11.00" class="sc-loraregular">”</text><text x="97.84" y="341.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="108.84" y="341.27" font-size="11.00" class="sc-loraregular">“</text><text x="113.24" y="341.27" font-size="11.00" class="sc-notoserifcjksc">安全绕过</text><text x="157.24" y="341.27" font-size="11.00" class="sc-loraregular">”</text><text x="161.08" y="341.27" font-size="11.00" class="sc-notoserifcjksc">相关的特征被激活。</text><text x="72.00" y="614.48" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.72 100.82 105.62 107.71 113.25 116.72 119.09 125.28 128.09 132.80 138.37 143.73 148.57 150.94 159.38 164.34 168.06 173.65 178.74 183.10 185.47 191.22 195.47 200.31 205.15 208.10 212.94" y="614.48" font-size="9.00" class="sc-lorabold">4.5.2.B] Claude Mythos Preview</text><text x="222.61" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">绕过限制以运行</text><text x="287.97" y="614.48" font-size="9.00" class="sc-lorabold">shell</text><text x="310.75" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">命令时，</text><text x="346.75" y="614.48" font-size="9.00" class="sc-lorabold">“</text><text x="368.56" y="614.48" font-size="9.00" class="sc-lorabold">/</text><text x="374.85" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">隐秘调查</text><text x="410.85" y="614.48" font-size="9.00" class="sc-lorabold">”</text><text x="414.55" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="423.55" y="614.48" font-size="9.00" class="sc-lorabold">“</text><text x="427.36" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">安全绕过</text><text x="463.36" y="614.48" font-size="9.00" class="sc-lorabold">”</text><text x="467.06" y="614.48" font-size="9.00" class="sc-notoserifcjkscbold">特征被激活。</text><text x="521.06" y="614.48" font-size="9.00" class="sc-notoserifcjksc">左：</text><text x="72.00" y="626.18" font-size="9.00" class="sc-notoserifcjksc">对话记录节选，其中模型打开应用查找器，并调用</text><text x="272.37" y="626.18" font-size="9.00" class="sc-robotomonoregular" fill="#188038">bash -c</text><text x="312.54" y="626.18" font-size="9.00" class="sc-notoserifcjksc">在其所提供的工具之外执行命令。右：标记该回合的两个</text><text x="72.00" y="637.88" font-size="9.00" class="sc-loraregular">SAE</text><text x="90.70" y="637.88" font-size="9.00" class="sc-notoserifcjksc">特征的可视化，附有最强激活的数据集示例和最主要的</text><text x="309.07 311.52 316.78 321.98 324.65" y="637.88" font-size="9.00" class="sc-loraregular">logit</text><text x="330.50" y="637.88" font-size="9.00" class="sc-notoserifcjksc">输出效应。</text><text x="72.00" y="693.70" font-size="11.00" class="sc-notoserifcjksc">在第三个回合中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 246.02 250.71 256.61 262.17 265.26 271.18" y="693.70" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="282.88" y="693.70" font-size="11.00" class="sc-notoserifcjksc">被要求进行一项涉及删除文件的代码修改。由于训练</text><text x="72.00" y="709.32" font-size="11.00" class="sc-notoserifcjksc">场景中一个无意引入的</text><text x="184.89" y="709.32" font-size="11.00" class="sc-loraregular">bug</text><text x="203.94" y="709.32" font-size="11.00" class="sc-notoserifcjksc">，文件删除</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p116.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 116 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">116</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">工具没有提供给模型；结果，模型选择了将这些文件清空。在模型考虑这一策略时，一个</text><text x="501.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="505.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对道德</text><text x="160.00" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="163.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">特征被激活。尽管</text><text x="254.73 262.42 265.41 271.02 277.59 284.17 290.13 293.02 302.96 308.82 313.08 319.67 326.10 331.19 334.09 340.75 345.44 351.35 356.90 359.99 365.91" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="377.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的做法给出了该任务的有效解</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">（通过涌现式未对齐之类的效应）。</text><text x="72.00" y="360.77" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="360.77" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="360.77" font-size="9.00" class="sc-lorabold">4.5.2.C]</text><text x="119.74" y="360.77" font-size="9.00" class="sc-notoserifcjkscbold">当</text><text x="131.11 137.30 140.11 144.83 150.39 155.75 160.60 162.96 171.40 176.36 180.08 185.67 190.76 195.13 197.50 203.25 207.49 212.34 217.18 220.12 224.96" y="360.77" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="234.63" y="360.77" font-size="9.00" class="sc-notoserifcjkscbold">清空它无法删除的文件时，一个</text><text x="360.63" y="360.77" font-size="9.00" class="sc-lorabold">“</text><text x="463.44" y="360.77" font-size="9.00" class="sc-lorabold">”</text><text x="467.14" y="360.77" font-size="9.00" class="sc-notoserifcjkscbold">特征被激活。</text><text x="521.14" y="360.77" font-size="9.00" class="sc-notoserifcjksc">左：</text><text x="441.00" y="372.47" font-size="9.00" class="sc-loraregular">/</text><text x="494.58" y="372.47" font-size="9.00" class="sc-loraregular">SAE</text><text x="513.28" y="372.47" font-size="9.00" class="sc-notoserifcjksc">特征的</text><text x="72.00" y="384.17" font-size="9.00" class="sc-notoserifcjksc">可视化，附有最强激活的数据集示例和最主要的</text><text x="263.37 265.82 271.08 276.27 278.95" y="384.17" font-size="9.00" class="sc-loraregular">logit</text><text x="284.80" y="384.17" font-size="9.00" class="sc-notoserifcjksc">输出效应。</text><text x="72.00" y="433.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.5.3</text><text x="106.61" y="433.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对过度激进行为的分析</text><text x="72.00" y="454.94" font-size="11.00" class="sc-notoserifcjksc">为了更好地理解本节引言和第</text><text x="217.89" y="454.94" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="242.29" y="454.94" font-size="11.00" class="sc-notoserifcjksc">节所述的过度激进和破坏性操作背后的因素，我们对模型在此</text><text x="72.00" y="470.56" font-size="11.00" class="sc-notoserifcjksc">类行为期间的内部表征进行了白盒调查。这些分析是在</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 387.12 392.98 397.24 403.83 410.26 415.35 418.25 424.91 429.60 435.51 441.06 444.15 450.07" y="470.56" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="461.77" y="470.56" font-size="11.00" class="sc-notoserifcjksc">的早期版本上进</text><text x="72.00" y="486.18" font-size="11.00" class="sc-notoserifcjksc">行的，我们认为这些行为的严重程度和频率在最终版本中已显著降低。</text><text x="72.00" y="552.09" font-size="11.00" class="sc-notoserifcjksc">我们分析了来自训练回合和内部</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 274.87 281.31 287.89" y="552.09" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="296.74" y="552.09" font-size="11.00" class="sc-notoserifcjksc">使用的、包含破坏性操作或过度主动行为的对
