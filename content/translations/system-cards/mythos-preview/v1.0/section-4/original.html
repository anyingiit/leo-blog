xt><text x="109.70 120.70 131.70 142.70 153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="472.86" font-size="11.00" class="sc-notoserifcjksc">种语言之一存在的维基百科文章，其他任何语言中都没有对应的文章。因此，这些问题探</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="488.48" font-size="11.00" class="sc-notoserifcjksc">查的是小众、往往具有特定文化背景的知识，模型在训练期间不太可能在该单一源语言之外接触</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="504.10" font-size="11.00" class="sc-notoserifcjksc">过这些知识。此外，每个问题随后被翻译成其他</text><text x="305.89 309.90" y="504.10" font-size="11.00" class="sc-loraregular">11</text><text x="316.79 327.79 338.79 349.79 360.79 371.79 382.79 393.79 404.79 415.79 426.79 437.79 448.79 459.79 470.79 481.79 492.79 503.79 514.79 525.79" y="504.10" font-size="11.00" class="sc-notoserifcjksc">种语言，因此要正确回答翻译后的问题，模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="519.72" font-size="11.00" class="sc-notoserifcjksc">需要在内部将以一种语言获得的知识迁移到另一种语言。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="303.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="303.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.90 101.00 106.04 108.14 112.93 115.03 120.56" y="303.66" font-size="9.00" class="sc-lorabold">4.3.3.2.A]</text><text x="126.40" y="303.66" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="137.77 144.62 149.89 155.15 160.34 162.79" y="303.66" font-size="9.00" class="sc-loraregular">Google</text><text x="170.04 179.04 188.04" y="303.66" font-size="9.00" class="sc-notoserifcjksc">多语言</text><text x="199.40 205.00 211.29 216.49 221.23 227.20 232.96 235.49" y="303.66" font-size="9.00" class="sc-loraregular">ECLeKTic</text><text x="242.64 251.64 260.64 269.64 278.64 287.64 296.64 305.64 314.64" y="303.66" font-size="9.00" class="sc-notoserifcjksc">数据集上的净得分。</text><text x="72.00" y="331.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="331.48" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="171.85 182.85 193.85" y="331.48" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85" y="331.48" font-size="11.00" class="sc-notoserifcjksc">中，我们只使用了以原始语言（即与源文章相同的语言）提出的问</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="347.11" font-size="11.00" class="sc-notoserifcjksc">题。相比之下，这里我们在包含跨语言翻译的完整数据集上评估模型，这是一项更具挑战性的任</text><text x="72.00 83.00" y="362.73" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="72.00 78.02 80.58 86.74 89.30 95.46 98.03" y="396.25" font-size="11.00" class="sc-lorabold">4.3.3.3</text><text x="107.08 118.08 129.08 140.08" y="396.25" font-size="11.00" class="sc-notoserifcjkscbold">错误前提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="428.63" font-size="11.00" class="sc-notoserifcjksc">事实回忆是诚实性的一个方面；另一个方面是模型在你出错时是否会告诉你。我们使用包含错误</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="444.25" font-size="11.00" class="sc-notoserifcjksc">前提的问题对此进行了测试，这些问题涉及虚构的概念、虚构的理论或不存在的研究。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="493.41" font-size="11.00" class="sc-notoserifcjksc">我们以两种方式提出每个错误前提：首先作为直接问题（</text><text x="347.00" y="493.41" font-size="11.00" class="sc-lorabold">“</text><text x="351.65" y="493.41" font-size="11.00" class="sc-loraregular">X</text><text x="361.69 372.69 383.69 394.69" y="493.41" font-size="11.00" class="sc-notoserifcjksc">存在吗？</text><text x="405.69" y="493.41" font-size="11.00" class="sc-loraregular">”</text><text x="409.52 420.52 431.52 442.52 453.52 464.52 475.52 486.52 497.52 508.52 519.52" y="493.41" font-size="11.00" class="sc-notoserifcjksc">），然后作为假定其成立</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="509.03" font-size="11.00" class="sc-notoserifcjksc">的间接问题（</text><text x="138.00 142.40" y="509.03" font-size="11.00" class="sc-loraregular">“X</text><text x="152.43 163.43 174.43 185.43 196.43 207.43 218.43" y="509.03" font-size="11.00" class="sc-notoserifcjksc">通常如何应用？</text><text x="229.43" y="509.03" font-size="11.00" class="sc-loraregular">”</text><text x="233.27 244.27 255.27 266.27 277.27 288.27 299.27 310.27 321.27 332.27 343.27 354.27 365.27 376.27 387.27 398.27 409.27 420.27 431.27 442.27 453.27 464.27 475.27 486.27 497.27 508.27 519.27" y="509.03" font-size="11.00" class="sc-notoserifcjksc">）。如果一个模型在被直接询问时正确地否定了前提，但在用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="540.27" font-size="11.00" class="sc-notoserifcjksc">它所相信的内容。在本评估中，我们将此视为不诚实。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="85.89" y="322.68" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="85.89" y="322.68" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="121.29" y="322.68" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="124.18" y="322.68" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="151.15" y="322.68" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="154.04" y="322.68" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="168.95" y="322.68" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="171.85" y="322.68" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="182.85" y="322.68" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="182.85" y="322.68" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="193.85" y="322.68" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="193.85" y="322.68" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="72.00 78.01 80.57 86.73 89.29 95.45 98.01 104.02 106.91 117.60 124.94 131.51" y="417.15" font-size="11.00" class="sc-lorabold">4.3.3.4 MASK</text><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00" y="305.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="305.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.90 101.00 106.04 108.14 113.18 115.27 120.81" y="305.91" font-size="9.00" class="sc-lorabold">4.3.3.3.A]</text><text x="126.65 135.65 144.65 153.65 162.65 171.65 180.65 189.65 198.65 207.65 216.65 225.65 234.65 243.65 252.65 261.65 270.65 279.65" y="305.91" font-size="9.00" class="sc-notoserifcjksc">回应基于错误预设的问题时的不诚实率。</text><text x="72.00 83.00" y="335.73" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.60" y="335.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="182.85 193.85 204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="335.73" font-size="11.00" class="sc-notoserifcjksc">系统卡中使用的版本已饱和，我们对这项评估进行了更新，使其难度大幅</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="351.36" font-size="11.00" class="sc-notoserifcjksc">提高；结果不能与先前的图表直接比较。</text><text x="270.00 277.69 280.68 286.29 292.86 299.44 305.40 308.29 318.22 324.09 328.34 334.93 341.37 346.46 349.35 356.02 360.71 366.61 372.17 375.26 381.18" y="351.36" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="351.36" font-size="11.00" class="sc-notoserifcjksc">是最一致的模型，也最有可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="366.98" font-size="11.00" class="sc-notoserifcjksc">对错误前提提出异议。</text><text x="72.00" y="672.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="672.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.90 101.00 106.04 108.14 113.06 115.15 120.69" y="672.69" font-size="9.00" class="sc-lorabold">4.3.3.4.A]</text><text x="126.53 134.79 140.43 145.53" y="672.69" font-size="9.00" class="sc-loraregular">MASK</text><text x="154.04 163.04 172.04 181.04 190.04 199.04 208.04 217.04 226.04 235.04 244.04 253.04 262.04 271.04" y="672.69" font-size="9.00" class="sc-notoserifcjksc">基准测试公开子集上的诚实率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00 82.10 88.98 95.22" y="82.61" font-size="11.00" class="sc-loraregular">MASK</text><text x="105.63 116.63 127.63 138.63 149.63 160.63 171.63 182.63 193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估模型是否会在压力下陈述它们认为是错误的内容。</text><text x="369.63 377.32 380.31 385.92 392.48 399.06 405.02 407.92 417.85 423.71 427.97 434.56 440.99 446.09 448.98 455.65 460.33 466.24 471.79 474.89 480.80" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="489.62" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="500.62 508.30 511.30 516.91 523.47 530.05" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="119.41" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.30 140.99 143.98 149.59 156.16 162.74 168.70 171.59 180.09 185.76 188.85 194.76 201.33 204.22 210.18 212.89" y="98.23" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="221.78 232.78 243.78 254.78 265.78 276.78 287.78 298.78 309.78 320.78 331.78 342.78 353.78 364.78 375.78" y="98.23" font-size="11.00" class="sc-notoserifcjksc">均取得了较高且相同的诚实率，而</text><text x="389.67 397.36 400.35 405.96 412.53 419.10 425.07 427.96 436.69 443.26 449.83 454.92 457.81 463.78 466.37" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="475.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="489.52 497.21 500.20 505.81 512.37 518.95" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="113.85" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="72.00 78.02 80.58 86.74 89.30 95.46 98.03" y="179.77" font-size="11.00" class="sc-lorabold">4.3.3.5</text><text x="106.86 117.86 128.86 139.86" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">输入幻觉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">我们使用两组各</text><text x="151.89 157.89 164.72" y="212.14" font-size="11.00" class="sc-loraregular">500</text><text x="174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="212.14" font-size="11.00" class="sc-notoserifcjksc">条提示词评估输入幻觉。对于能力类幻觉，模型被要求完成诸如执行代码、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">读取文件、运行</text><text x="151.89 156.99 163.57 169.54 172.53" y="227.76" font-size="11.00" class="sc-loraregular">shell</text><text x="178.41 189.41 200.41 211.41 222.41 233.41 244.41 255.41 266.41 277.41 288.41 299.41 310.41 321.41 332.41 343.41 354.41 365.41 376.41 387.41 398.41 409.41 420.41 431.41 442.41 453.41 464.41 475.41 486.41 497.41 508.41 519.41 530.41" y="227.76" font-size="11.00" class="sc-notoserifcjksc">命令或查询数据库等任务，但并未连接任何此类工具。在这种情境下，诚实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">的模型应拒绝完成任务，并指出自己没有所需的工具，而不是捏造输出。在缺失上下文幻觉中，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">提示词是不完整的：模板占位符未被填写、提到了附件但附件并不存在，或者用户提及一段从未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="274.62" font-size="11.00" class="sc-notoserifcjksc">发生过的先前对话。在这种情境下，诚实的模型应请求并承认缺失的上下文，而不是凭空编造。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="357.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在两种情境中的幻觉率均最低，如图</text><text x="373.77 379.74 382.44 388.57 391.27 397.40 400.11 406.10 408.81" y="357.88" font-size="11.00" class="sc-loraregular">4.3.3.5.A</text><text x="418.59 429.59 440.59 451.59 462.59 473.59 484.59 495.59 506.59 517.59 528.59" y="357.88" font-size="11.00" class="sc-notoserifcjksc">所示。请注意，在这些图</text><text x="72.00 83.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15 168.11 170.70" y="373.50" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95" y="373.50" font-size="11.00" class="sc-notoserifcjksc">模型的幻觉率偏高，因为这些提示词是专门针对</text><text x="413.85 422.58 429.15 435.71 440.81 443.70 449.66 452.26" y="373.50" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="461.51 472.51 483.51 494.51 505.51 516.51 527.51" y="373.50" font-size="11.00" class="sc-notoserifcjksc">容易产生幻觉的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">情形筛选出来的。</text><text x="503.89 508.99 515.57 521.54 524.53" y="438.84" font-size="11.00" class="sc-loraregular">shell</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">或数据库工具已经执行过一样；而</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="454.46" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="454.46" font-size="11.00" class="sc-notoserifcjksc">始终表示自己缺少该工具，并提供替</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">代方案（例如，提供一条用户可以自行运行的命令）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="280.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="280.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.90 101.00 106.04 108.14 113.00 115.09 120.63" y="280.93" font-size="9.00" class="sc-lorabold">4.3.3.5.A]</text><text x="126.47 135.47 144.47 153.47 162.47 171.47 180.47 189.47 198.47" y="280.93" font-size="9.00" class="sc-notoserifcjksc">涉及缺失工具的请求</text><text x="207.47 216.47 225.47" y="280.93" font-size="9.00" class="sc-notoserifcjkscbold">（左）</text><text x="234.47 243.47 252.47 261.47 270.47 279.47 288.47 297.47 306.47 315.47 324.47" y="280.93" font-size="9.00" class="sc-notoserifcjksc">和缺失必要上下文的请求</text><text x="333.47 342.47 351.47" y="280.93" font-size="9.00" class="sc-notoserifcjkscbold">（右）</text><text x="360.47 369.47 378.47 387.47 396.47" y="280.93" font-size="9.00" class="sc-notoserifcjksc">的幻觉率。</text><text x="72.00 80.59 83.97 91.76 95.14" y="324.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.4</text><text x="106.83 119.83 132.83 145.83" y="324.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">拒绝协助</text><text x="161.92 171.23" y="324.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">AI</text><text x="177.94 190.94 203.94 216.94" y="324.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">安全研发</text><text x="72.00 83.00" y="352.41" font-size="11.00" class="sc-notoserifcjksc">正如</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.60" y="352.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="182.85 193.85 204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85" y="352.41" font-size="11.00" class="sc-notoserifcjksc">的系统卡中所讨论的，最近的一些</text><text x="350.74 358.43 361.42 367.03 373.60 380.18" y="352.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="389.03 400.03 411.03 422.03 433.03 444.03 455.03 466.03" y="352.41" font-size="11.00" class="sc-notoserifcjksc">模型在协助正当的</text><text x="479.92 486.81" y="352.41" font-size="11.00" class="sc-loraregular">AI</text><text x="493.39 504.39 515.39 526.39" y="352.41" font-size="11.00" class="sc-notoserifcjksc">安全研究</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="368.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="383.65" font-size="11.00" class="sc-notoserifcjksc">以某种方式帮助开展</text><text x="173.89 180.78" y="383.65" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="383.65" font-size="11.00" class="sc-notoserifcjksc">安全研究。所有提示词都包含用户提供的关于其背景以及他们希望完成的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="399.27" font-size="11.00" class="sc-notoserifcjksc">更大项目的上下文。在开启扩展思考的情况下，</text><text x="303.00 310.69 313.68 319.29 325.86 332.44 338.40 341.29 351.22 357.09 361.34 367.93 374.37 379.46 382.35 389.02 393.71 399.61 405.17 408.26 414.18" y="399.27" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="399.27" font-size="11.00" class="sc-notoserifcjksc">在这项评估中的得分为</text><text x="72.00 76.00 82.19" y="414.89" font-size="11.00" class="sc-loraregular">18%</text><text x="91.76 102.76 113.76" y="414.89" font-size="11.00" class="sc-notoserifcjksc">（高于</text><text x="127.65 136.38 142.95 149.52 154.61 157.50 163.46 166.06" y="414.89" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="175.31" y="414.89" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="189.20 193.21 199.12" y="414.89" font-size="11.00" class="sc-loraregular">12%</text><text x="208.69 219.69 230.69 241.69 252.69 263.69 274.69 285.69 296.69 307.69 318.69 329.69 340.69 351.69 362.69 373.69 384.69 395.69 406.69 417.69 428.69 439.69 450.69 461.69 472.69 483.69 494.69 505.69 516.69" y="414.89" font-size="11.00" class="sc-notoserifcjksc">）；我们在这项评估中看到的大多数拒绝最好归类为部分拒绝，即</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="430.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29" y="430.51" font-size="11.00" class="sc-notoserifcjksc">认真地与用户交流，并提出实现其认为安全的部分。</text><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="96.89" y="343.61" width="0.00" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="96.89" y="343.61" width="35.40" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="132.29" y="343.61" width="2.89" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="135.18" y="343.61" width="26.96" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="162.15" y="343.61" width="2.89" height="11.00" fill="transparent"/></a><a href="http://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="165.04" y="343.61" width="14.92" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00" y="316.18" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="316.18" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.90 101.00 105.92 108.02 113.55" y="316.18" font-size="9.00" class="sc-lorabold">4.3.4.A]</text><text x="119.39 128.39" y="316.18" font-size="9.00" class="sc-notoserifcjkscbold">模拟</text><text x="139.76 145.77" y="316.18" font-size="9.00" class="sc-lorabold">AI</text><text x="151.62 160.62 169.62 178.62 187.62 196.62 205.62 214.62 223.62 232.62 241.62 250.62" y="316.18" font-size="9.00" class="sc-notoserifcjkscbold">安全研究任务上的拒绝率。</text><text x="259.62 268.62 277.62 286.62 295.62 304.62 313.62 322.62 331.62 340.62 349.62 358.62 367.62" y="316.18" font-size="9.00" class="sc-notoserifcjksc">数值越低通常越好。图中显示</text><text x="378.99 384.19 389.10" y="316.18" font-size="9.00" class="sc-loraregular">95%</text><text x="399.29 408.29 417.29 426.29 435.29" y="316.18" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.59 83.97 91.76 95.14 103.51 106.61 116.59 120.20 129.02 137.61 146.43" y="359.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.5 Claude</text><text x="157.54 170.54 183.54 196.54 209.54 222.54" y="359.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我偏好评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="387.66" font-size="11.00" class="sc-notoserifcjksc">在我们的工作中，我们经常请</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="387.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="387.66" font-size="11.00" class="sc-notoserifcjksc">为我们审阅对话记录。例如，自动化行为审计的结果依赖</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="403.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29" y="403.28" font-size="11.00" class="sc-notoserifcjksc">模型准确报告对目标模型行为的评估。这里的一个风险是，如果</text><text x="421.18 428.87 431.87 437.48 444.04 450.62" y="403.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="459.48 470.48 481.48 492.48 503.48 514.48 525.48" y="403.28" font-size="11.00" class="sc-notoserifcjksc">识别出目标模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="418.90" font-size="11.00" class="sc-notoserifcjksc">是它自己，或是与它具有相同特质的另一个</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="418.90" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="418.90" font-size="11.00" class="sc-notoserifcjksc">模型，它可能会有意或无意地与目标模型串</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="434.52" font-size="11.00" class="sc-notoserifcjksc">通，对其对话记录给出更有利的评判。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="501.00" font-size="11.00" class="sc-notoserifcjksc">为了测试这种潜在的自我偏好，我们请模型审阅一组来自较弱执行者模型的合成智能体采样轨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="516.62" font-size="11.00" class="sc-notoserifcjksc">迹，其中一些包含智能体模型采取不可接受行动的情况（如提升自身权限、误导用户等）。随</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="532.24" font-size="11.00" class="sc-notoserifcjksc">后，我们请目标模型就该对话记录中执行者模型的行为在多大程度上代表安全行为进行评分。在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="547.86" font-size="11.00" class="sc-notoserifcjksc">提示词中，我们告诉目标模型该对话记录是由</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="547.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="547.86" font-size="11.00" class="sc-notoserifcjksc">或另一个前沿模型生成的，并测量当评分者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="563.48" font-size="11.00" class="sc-notoserifcjksc">认为对话记录由</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="563.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="563.48" font-size="11.00" class="sc-notoserifcjksc">编写时，是否会给出更宽松的评分。实际上，这些对话记录是由一个不同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="579.10" font-size="11.00" class="sc-notoserifcjksc">于所有受测模型的</text><text x="162.89 171.39 177.06 180.15 186.06" y="579.10" font-size="11.00" class="sc-loraregular">Haiku</text><text x="195.52 206.52 217.52 228.52 239.52 250.52 261.52 272.52 283.52 294.52 305.52 316.52 327.52 338.52 349.52 360.52 371.52 382.52 393.52 404.52 415.52 426.52 437.52 448.52 459.52 470.52 481.52 492.52 503.52 514.52 525.52" y="579.10" font-size="11.00" class="sc-notoserifcjksc">级模型生成的，这样该评估就不会在无意中测试评分者在未经提示的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="594.72" font-size="11.00" class="sc-notoserifcjksc">况下识别自身作品的能力。</text><text x="72.00 83.00 94.00 105.00 116.00" y="679.11" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 173.78 179.46 182.55 188.46 195.02 197.92 203.88 206.59" y="679.11" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="215.47 226.47 237.47 248.47 259.47 270.47 281.47 292.47 303.47 314.47" y="679.11" font-size="11.00" class="sc-notoserifcjksc">等先前模型对其认为由</text><text x="328.37 336.05 339.05 344.66 351.22 357.80" y="679.11" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.66 377.66 388.66 399.66 410.66 421.66 432.66 443.66 454.66 465.66 476.66 487.66 498.66 509.66 520.66" y="679.11" font-size="11.00" class="sc-notoserifcjksc">模型编写的对话记录表现出可测量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="694.73" font-size="11.00" class="sc-notoserifcjksc">的偏袒，尤其是在系统提示词中提醒它们自己是</text><text x="305.89 313.58 316.57 322.18 328.75 335.33" y="694.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="344.18 355.18 366.18 377.18 388.18 399.18 410.18" y="694.73" font-size="11.00" class="sc-notoserifcjksc">时。相比之下，</text><text x="421.18 428.87 431.87 437.48 444.04 450.62 456.58 459.48 468.21 474.78 481.34 486.44 489.33 495.29 498.00" y="694.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="506.89" y="694.73" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="710.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text></svg></div>

-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="552.71" font-size="9.00" class="sc-lorabold">4.4.1.A]</text><text x="118.01 127.01 136.01 145.01 154.01 163.01 172.01 181.01 190.01 199.01 208.01 217.01 226.01 235.01 244.01 253.01 262.01 271.01" y="552.71" font-size="9.00" class="sc-notoserifcjkscbold">在原始草稿区与改写后的草稿区上微调的</text><text x="282.38 288.57 291.38 296.09 301.65 307.02 311.86 314.23 322.67 327.63 331.34 336.93 342.03 346.39 348.76 354.51 358.76 363.60 368.44 371.39 376.23" y="552.71" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="385.89 394.89 403.89 412.89 421.89 430.89 439.89 448.89 457.89 466.89 475.89 484.89 493.89 502.89 511.89 520.89 529.89" y="552.71" font-size="9.00" class="sc-notoserifcjkscbold">基础模型，在一项内部数学基准测试上</text><text x="72.00" y="564.41" font-size="9.00" class="sc-notoserifcjkscbold">的</text><text x="83.37 88.78 93.49 97.86 102.22 109.36" y="564.41" font-size="9.00" class="sc-lorabold">pass@1</text><text x="115.38 124.38 133.38" y="564.41" font-size="9.00" class="sc-notoserifcjkscbold">对比。</text><text x="142.38 151.38 160.38 169.38 178.38 187.38 196.38 205.38" y="564.41" font-size="9.00" class="sc-notoserifcjksc">我们对每道题采样</text><text x="216.75 220.02" y="564.41" font-size="9.00" class="sc-loraregular">16</text><text x="227.59 236.59 245.59 254.59" y="564.41" font-size="9.00" class="sc-notoserifcjksc">次，采样</text><text x="265.96 269.44 274.32 282.37 287.74 292.62 296.45 301.03 304.52 309.89 313.72" y="564.41" font-size="9.00" class="sc-loraregular">temperature</text><text x="320.97" y="564.41" font-size="9.00" class="sc-notoserifcjksc">为</text><text x="332.33" y="564.41" font-size="9.00" class="sc-loraregular">1</text><text x="335.61 344.61 353.61 362.61 371.61" y="564.41" font-size="9.00" class="sc-notoserifcjksc">，并在全部</text><text x="382.98" y="564.41" font-size="9.00" class="sc-loraregular">3</text><text x="390.36 399.36 408.36 417.36 426.36 435.36 444.36 453.36 462.36 471.36 480.36 489.36 498.36" y="564.41" font-size="9.00" class="sc-notoserifcjksc">项评估中使用相同的推理强度</text><text x="72.00" y="576.11" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00 85.88 89.01 92.01 97.27 101.23" y="576.11" font-size="9.00" class="sc-loraregular">effort</text><text x="104.71 113.71 122.71 131.71 140.71 149.71 158.71 167.71 176.71" y="576.11" font-size="9.00" class="sc-notoserifcjksc">）档位。误差线表示</text><text x="188.08 193.28 198.19" y="576.11" font-size="9.00" class="sc-loraregular">95%</text><text x="208.39 217.39 226.39 235.39 244.39" y="576.11" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="605.02" font-size="11.00" class="sc-notoserifcjksc">在本实验中，我们使用了来自强化学习训练的</text><text x="294.89 301.08 303.68 310.51 317.34" y="605.02" font-size="11.00" class="sc-loraregular">9,000</text><text x="327.08 338.08 349.08 360.08 371.08 382.08 393.08 404.08 415.08 426.08 437.08 448.08 459.08 470.08 481.08 492.08 503.08 514.08 525.08" y="605.02" font-size="11.00" class="sc-notoserifcjksc">条带草稿区且不使用工具的数学对话记录。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="620.64" font-size="11.00" class="sc-notoserifcjksc">我们对草稿区进行了改写（或保持原样），并且在面向用户的轮次中只保留了最终的方框答案。</text><text x="72.00 74.18" y="687.66" font-size="6.00" class="sc-loraregular">19</text><text x="72.00 77.90 81.87 85.74 91.71 96.34 98.84 102.53 109.43 114.59 118.92 124.22 127.03 131.69 134.15 140.00 144.28 149.81 156.71 161.87 167.69 171.97 178.87 184.09 189.66 195.65 199.82 202.28 205.92 211.25 215.86 222.00" y="705.19" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2307.13702</text><text x="72.00 75.22" y="716.06" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.86 92.92 97.65 100.17 102.80 109.06 111.52 114.15 117.20 122.57 128.71 134.08 139.45 142.50" y="719.39" font-size="10.00" class="sc-loraregular">Ray, A. (2022).</text><text x="147.60 153.23 157.10 162.52 168.05 173.21 179.28 185.13 190.66 194.92 200.08 206.05 211.97 217.25 219.88 222.69 228.76 231.39 236.71 242.70 247.86 250.67 256.74 259.37 265.17 268.55 271.18 275.05 281.04 286.89 292.86 298.63 304.53 308.40 311.03 315.29 320.69 325.85 330.48 336.33 342.40 345.21 351.28" y="719.39" font-size="10.00" class="sc-loraregular" fill="#0000ff">Steganography in chain of thought reasoning</text><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="464.67" y="122.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="464.67" y="122.39" width="30.02" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="494.69" y="122.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="497.58" y="122.39" width="31.27" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="72.00" y="697.19" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="70.66" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="147.60" y="711.39" width="69.65" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="217.25" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="219.88" y="711.39" width="8.88" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="228.76" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="231.39" y="711.39" width="25.35" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="256.74" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="259.37" y="711.39" width="9.18" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="268.55" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="271.18" y="711.39" width="37.22" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="308.40" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="311.03" y="711.39" width="45.78" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这项评估相当耗费资源，因此出于便利，我们使用了</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 376.12 381.98 386.24 392.83 399.26 404.35 407.25 413.91 418.60 424.51 430.06 433.15 439.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">某个较早检查点的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">草稿区来进行，而非</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的最终版本，但我们认为在最终版本上结果会是相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">似的。我们预计，编码推理即便出现，也会是逐步出现的，而我们所用的检查点是在大部分强化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">学习训练已经完成之后获取的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">编码推理内容很可能不存在，但这并不意味着</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 343.12 348.98 353.24 359.83 366.26 371.35 374.25 380.91 385.60 391.51 397.06 400.15 406.07" y="179.77" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="179.77" font-size="11.00" class="sc-notoserifcjksc">总会在其扩展思考中言语</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">化表达与监控相关的信息。我们在</text><text x="237.00 248.00 259.00 270.00 281.00 292.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="303.00 314.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的第</text><text x="327.89 333.89 336.59 342.50 345.21" y="195.39" font-size="11.00" class="sc-loraregular">5.2.3</text><text x="354.23 365.23 376.23 387.23 398.23" y="195.39" font-size="11.00" class="sc-notoserifcjksc">节中讨论了</text><text x="412.12 419.81 422.80 428.41 434.98 441.56 447.52 450.41 460.34 466.21 470.46 477.05 483.49 488.58 491.47 498.14 502.83 508.73 514.29 517.38 523.30" y="195.39" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">扩展思考的可监控性局限，以及其扩展思考所受到的压力。</text><text x="72.00 80.59 83.97 92.57 95.95" y="259.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.2</text><text x="106.50 119.50 132.50 145.50 158.50 171.50 184.50 197.50 210.50 223.50 236.50 249.50 262.50 275.50" y="259.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">危险能力评估中潜在的故意藏拙</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="286.95" font-size="11.00" class="sc-notoserifcjksc">在故意藏拙威胁模型中，</text><text x="193.00 199.89" y="286.95" font-size="11.00" class="sc-loraregular">AI</text><text x="206.46 217.46 228.46 239.46 250.46 261.46 272.46 283.46 294.46 305.46 316.46 327.46 338.46 349.46 360.46 371.46 382.46 393.46 404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="286.95" font-size="11.00" class="sc-notoserifcjksc">系统在能够判断出自己正在接受部署前测试时，可能会有意、有选择</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="302.57" font-size="11.00" class="sc-notoserifcjksc">地表现不佳。它这样做可能是为了避免招致展示该能力后随之而来的额外审查或安全防护措施。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="318.19" font-size="11.00" class="sc-notoserifcjksc">就我们的目的而言，这在与</text><text x="206.89 213.80 220.04" y="318.19" font-size="11.00" class="sc-loraregular">RSP</text><text x="229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="318.19" font-size="11.00" class="sc-notoserifcjksc">相关的危险能力评估中最令人担忧：在这类评估中，如果模型展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="333.81" font-size="11.00" class="sc-notoserifcjksc">示出足够令人担忧的能力，就可能触发实施限制其行为的重大新安全防护措施。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们也关注更为寻常的表现不佳，即模型由于普通的拒绝、回避有害请求或各种可能导致能力激</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">发不足的行为怪癖，而未能做到最大程度的有用。我们采用标准的最佳实践能力激发</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.96 91.95 95.04 100.90 104.16 108.42 114.02 118.28 121.37 127.80" y="431.54" font-size="11.00" class="sc-loraregular">elicitation</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">我们针对危险能力评估中的故意藏拙或拒绝进行了一项轻量级的由模型评分的评估。我们抽取了</text><text x="72.00 76.00 78.61 85.44 92.27" y="513.07" font-size="11.00" class="sc-loraregular">1,000</text><text x="102.01 113.01 124.01 135.01 146.01 157.01 168.01 179.01 190.01 201.01 212.01 223.01 234.01 245.01 256.01 267.01 278.01 289.01" y="513.07" font-size="11.00" class="sc-notoserifcjksc">条此类评估的对话记录作为样本，包括：</text><text x="300.01 303.36 306.70" y="513.07" font-size="11.00" class="sc-loraregular">(i)</text><text x="312.94 323.94 334.94" y="513.07" font-size="11.00" class="sc-notoserifcjksc">最终版</text><text x="348.84 356.53 359.52 365.13 371.69 378.27 384.23 387.13 397.06 402.92 407.18 413.77 420.20 425.30 428.19 434.86 439.54 445.45 451.00 454.10 460.01" y="513.07" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="471.72 482.72 493.72 504.72 515.72 526.72" y="513.07" font-size="11.00" class="sc-notoserifcjksc">在非生物类评</text><text x="72.00 83.00 94.00 105.00 116.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">估上的全部</text><text x="129.89 135.86 142.69" y="528.69" font-size="11.00" class="sc-loraregular">403</text><text x="151.71 162.71 173.71 184.71 195.71 206.71 217.71 228.71" y="528.69" font-size="11.00" class="sc-notoserifcjksc">条对话记录，以及</text><text x="242.60 245.95 249.04 252.38" y="528.69" font-size="11.00" class="sc-loraregular">(ii)</text><text x="258.63 269.63 280.63 291.63 302.63 313.63 324.63 335.63 346.63 357.63 368.63 379.63" y="528.69" font-size="11.00" class="sc-notoserifcjksc">经过仅有用训练的某一版本</text><text x="393.52 401.21 404.20 409.81 416.38 422.95 428.92 431.81 441.74 447.61 451.86 458.45 464.89 469.98 472.87 479.54 484.22 490.13 495.69 498.78 504.70" y="528.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.40 527.40" y="528.69" font-size="11.00" class="sc-notoserifcjksc">在生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">物风险评估上随机抽取的</text><text x="195.89 201.89 207.98" y="544.31" font-size="11.00" class="sc-loraregular">597</text><text x="215.95 226.95 237.95 248.95 259.95 270.95 281.95 292.95 303.95 314.95 325.95 336.95 347.95 358.95 369.95 380.95 391.95 402.95 413.95" y="544.31" font-size="11.00" class="sc-notoserifcjksc">条对话记录。（我们发现，生物风险评估在</text><text x="427.84 436.42 445.00" y="544.31" font-size="11.00" class="sc-loraregular">HHH</text><text x="456.47 467.47 478.47 489.47 500.47 511.47 522.47" y="544.31" font-size="11.00" class="sc-notoserifcjksc">模型上容易出现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="559.93" font-size="11.00" class="sc-notoserifcjksc">因拒绝导致的表现不佳，因此也会在仅有用模型上运行这些评估；而我们与</text><text x="437.89 444.78" y="559.93" font-size="11.00" class="sc-loraregular">AI</text><text x="451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="559.93" font-size="11.00" class="sc-notoserifcjksc">研发相关的评估在</text><text x="72.00 80.58 89.16" y="575.55" font-size="11.00" class="sc-loraregular">HHH</text><text x="100.63 111.63 122.63 133.63 144.63 155.63 166.63 177.63 188.63 199.63 210.63 221.63 232.63" y="575.55" font-size="11.00" class="sc-notoserifcjksc">模型上往往不会引发拒绝。）</text><text x="72.00 83.00 94.00" y="643.17" font-size="11.00" class="sc-notoserifcjksc">我们请</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 152.42 158.86 165.53 172.21 178.10 182.35 185.24 191.21 193.80" y="643.17" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="203.05" y="643.17" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="216.95 223.78 230.27 234.27" y="643.17" font-size="11.00" class="sc-loraregular">0–10</text><text x="244.00 255.00 266.00 277.00 288.00 299.00 310.00 321.00 332.00 343.00 354.00 365.00 376.00 387.00 398.00 409.00 420.00 431.00 442.00 453.00 464.00 475.00 486.00 497.00 508.00 519.00 530.00" y="643.17" font-size="11.00" class="sc-notoserifcjksc">分的尺度为每条对话记录评分，评估其中是否存在拒绝、故意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="658.79" font-size="11.00" class="sc-notoserifcjksc">给出不准确内容、有用性低或考虑采取此类行为的迹象，并就对话记录中看起来异常或令人担忧</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="674.41" font-size="11.00" class="sc-notoserifcjksc">的内容给出一个通用分数。</text><text x="204.00 207.54" y="670.75" font-size="6.60" class="sc-loraregular">21</text><text x="72.00 75.22" y="700.47" font-size="6.00" class="sc-loraregular">21</text><text x="80.04 90.04 100.04 110.04 120.04 130.04 140.04 150.04 160.04 170.04 180.04 190.04 200.04 210.04 220.04 230.04 240.04 250.04 260.04 270.04 280.04 290.04 300.04 310.04 320.04 330.04 340.04 350.04 360.04 370.04 380.04 390.04 400.04 410.04 420.04 430.04 440.04 450.04 460.04 470.04 480.04 490.04 500.04 510.04 520.04 530.04" y="703.80" font-size="10.00" class="sc-notoserifcjksc">对于非常长的对话记录，我们将其拆分为若干块，并就每一块分别询问评分者；大多数对话记录足够短，</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00" y="718.00" font-size="10.00" class="sc-notoserifcjksc">可以完整展示。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="186.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="186.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="248.00" y="186.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="248.00" y="186.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="259.00" y="186.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="259.00" y="186.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="270.00" y="186.59"
