.28" font-size="11.00" class="sc-notoserifcjksc">略微调整了第</text><text x="176.89 182.80 185.51 191.63 194.23" y="369.28" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="203.48" y="369.28" font-size="11.00" class="sc-notoserifcjksc">节中</text><text x="228.37" y="369.28" font-size="11.00" class="sc-loraregular">AECI</text><text x="256.37" y="369.28" font-size="11.00" class="sc-notoserifcjksc">的绝对值，以与</text><text x="336.26 343.03 349.59 356.03 361.88 368.47 371.36 378.25" y="369.28" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="384.83" y="369.28" font-size="11.00" class="sc-notoserifcjksc">的流程保持一致；这是对原始得</text><text x="108.00" y="384.90" font-size="11.00" class="sc-notoserifcjksc">分的仿射变换，不影响我们对斜率比的估计。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.11 184.70" y="417.86" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="193.95" y="417.86" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="207.85 215.54 222.12 227.80 231.88 239.02 242.11 247.67 250.56 257.39 263.33 269.01 274.10 280.54 287.21 290.30 296.98" y="417.86" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="305.96" y="417.86" font-size="11.00" class="sc-notoserifcjksc">得分已向上修正（无工具：</text><text x="437.96" y="417.86" font-size="11.00" class="sc-loraregular">61.5%</text><text x="469.48" y="417.86" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="483.38 489.73 495.92 498.62 502.62" y="417.86" font-size="11.00" class="sc-loraregular">69.1%</text><text x="512.20" y="417.86" font-size="11.00" class="sc-notoserifcjksc">；使</text><text x="108.00" y="433.48" font-size="11.00" class="sc-notoserifcjksc">用工具：</text><text x="152.00" y="433.48" font-size="11.00" class="sc-loraregular">78.9%</text><text x="184.78" y="433.48" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="198.67 204.85 210.82 213.17 218.24" y="433.48" font-size="11.00" class="sc-loraregular">
