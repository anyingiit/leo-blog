="174.98" font-size="11.00" class="sc-loraregular">ECI</text><text x="394.21" y="174.98" font-size="11.00" class="sc-notoserifcjksc">分支版本与公开排行榜。</text><text x="108.00" y="207.36" font-size="11.00" class="sc-notoserifcjksc">更正了第</text><text x="154.89" y="207.36" font-size="11.00" class="sc-loraregular">5.1.2</text><text x="179.10" y="207.36" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="215.00" y="207.36" font-size="11.00" class="sc-loraregular">5.9</text><text x="232.95" y="207.36" font-size="11.00" class="sc-notoserifcjksc">节中</text><text x="257.84" y="207.36" font-size="11.00" class="sc-loraregular sc-k">Eleos AI Research</text><text x="350.99" y="207.36" font-size="11.00" class="sc-notoserifcjksc">的研究发现，以反映其报告的最新版</text><text x="108.00" y="222.98" font-size="11.00" class="sc-notoserifcjksc">本。</text><text x="72.00" y="255.94" font-size="11.00" class="sc-lorabold">2026</text><text x="99.94" y="255.94" font-size="11.00" class="sc-notoserifcjkscbold">年</text><text x="113.83" y="255.94" font-size="11.00" class="sc-lorabold">4</text><text x="122.74" y="255.94" font-size="11.00" class="sc-notoserifcjkscbold">月</text><text x="136.64" y="255.94" font-size="11.00" class="sc-lorabold">14</text><text x="150.01" y="255.94" font-size="11.00" class="sc-notoserifcjkscbold">日</text><text x="108.00" y="272.13" font-size="11.00" class="sc-notoserifcjksc">删除了第</text><text x="154.89" y="272.13" font-size="11.00" class="sc-loraregular sc-k">2.3.6</text><text x="181.48" y="272.13" font-size="11.00" class="sc-notoserifcjksc">节中关于</text><text x="228.37" y="272.13" font-size="11.00" class="sc-loraregular">AI</text><text x="241.84" y="272.13" font-size="11.00" class="sc-notoserifcjksc">赋能的加速的一条说明。先前版本认为，促成</text><text x="464.73" y="272.13" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="108.00" y="287.75" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="151.53" y="287.75" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="187.42" y="287.75" font-size="11.00" class="sc-loraregular">AI</text><text x="200.88" y="287.75" font-size="11.00" class="sc-notoserifcjksc">赋能的加速反映的将是更早模型的能力，而非</text><text x="423.78" y="287.75" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="508.37" y="287.75" font-size="11.00" class="sc-notoserifcjksc">本身的</text><text x="108.00" y="303.37" font-size="11.00" class="sc-notoserifcjksc">能力。尽管这一点是准确的，但其引用方式有误：它并不能作为</text><text x="418.89" y="303.37" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="503.48" y="303.37" font-size="11.00" class="sc-notoserifcjksc">未达到</text><text x="108.00" y="318.99" font-size="11.00" class="sc-notoserifcjksc">我们第二个自主性阈值的论据。我们已在第</text><text x="319.89" y="318.99" font-size="11.00" class="sc-loraregular">1.2.2</text><text x="344.02" y="318.99" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="379.91" y="318.99" font-size="11.00" class="sc-loraregular">2.3.1</text><text x="404.25" y="318.99" font-size="11.00" class="sc-notoserifcjksc">节中补充了相关表述，以澄</text><text x="108.00" y="334.61" font-size="11.00" class="sc-notoserifcjksc">清这一点。</text><text x="108.00" y="369.28" font-size="11.00" class="sc-notoserifcjksc">略微调整了第</text><text x="176.89" y="369.28" font-size="11.00" class="sc-loraregular sc-k">2.3.6</text><text x="203.48" y="369.28" font-size="11.00" class="sc-notoserifcjksc">节中</text><text x="228.37" y="369.28" font-size="11.00" class="sc-loraregular">AECI</text><text x="256.37" y="369.28" font-size="11.00" class="sc-notoserifcjksc">的绝对值，以与</text><text x="336.26" y="369.28" font-size="11.00" class="sc-loraregular sc-k">Epoch AI</text><text x="384.83" y="369.28" font-size="11.00" class="sc-notoserifcjksc">的流程保持一致；这是对原始得</text><text x="108.00" y="384.90" font-size="11.00" class="sc-notoserifcjksc">分的仿射变换，不影响我们对斜率比的估计。</text><text x="108.00" y="417.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="193.95" y="417.86" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="207.85" y="417.86" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="305.96" y="417.86" font-size="11.00" class="sc-notoserifcjksc">得分已向上修正（无工具：</text><text x="437.96" y="417.86" font-size="11.00" class="sc-loraregular">61.5%</text><text x="469.48" y="417.86" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="483.38" y="417.86" font-size="11.00" class="sc-loraregular sc-k">69.1%</text><text x="512.20" y="417.86" font-size="11.00" class="sc-notoserifcjksc">；使</text><text x="108.00" y="433.48" font-size="11.00" class="sc-notoserifcjksc">用工具：</text><text x="152.00" y="433.48" font-size="11.00" class="sc-loraregular">78.9%</text><text x="184.78" y="433.48" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="198.67" y="433.48" font-size="11.00" class="sc-loraregular sc-k">84.7%</text><text x="227.81" y="433.48" font-size="11.00" class="sc-notoserifcjksc">）。此次修正是在修复了一个评估运行框架（</text><text x="447.81" y="433.48" font-size="11.00" class="sc-loraregular">harness</text><text x="487.67" y="433.48" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="498.67" y="433.48" font-size="11.00" class="sc-loraregular">bug</text><text x="520.61" y="433.48" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="108.00" y="449.10" font-size="11.00" class="sc-notoserifcjksc">后做出的：该</text><text x="176.89" y="449.10" font-size="11.00" class="sc-loraregular">bug</text><text x="198.84" y="449.10" font-size="11.00" class="sc-notoserifcjksc">导致自动评分器将</text><text x="289.73" y="449.10" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="375.68" y="449.10" font-size="11.00" class="sc-notoserifcjksc">的一部分正确回答判为错误。该</text><text x="108.00" y="464.72" font-size="11.00" class="sc-loraregular">bug</text><text x="129.95" y="464.72" font-size="11.00" class="sc-notoserifcjksc">仅针对</text><text x="165.84" y="464.72" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="213.50" y="464.72" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="227.39" y="464.72" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="322.61" y="464.72" font-size="11.00" class="sc-notoserifcjksc">，未影响其他模型或其他评估。模型行为没</text><text x="108.00" y="480.34" font-size="11.00" class="sc-notoserifcjksc">有变化，现有得分与此前在</text><text x="242.89" y="480.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="328.85" y="480.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="361.85" y="480.34" font-size="11.00" class="sc-notoserifcjksc">中报告的得分一致。</text><text x="108.00" y="531.20" font-size="11.00" class="sc-notoserifcjksc">调整了</text><text x="143.89" y="531.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="229.85" y="531.20" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="243.74" y="531.20" font-size="11.00" class="sc-loraregular sc-k">USAMO 2026</text><text x="314.62" y="531.20" font-size="11.00" class="sc-notoserifcjksc">上的得分，改为报告不限思考预算下的得分</text><text x="108.00" y="546.82" font-size="11.00" class="sc-notoserifcjksc">（与我们评估</text><text x="176.89" y="546.82" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="261.48" y="546.82" font-size="11.00" class="sc-notoserifcjksc">的方式一致）。这使该模型的表现从</text><text x="440.38" y="546.82" font-size="11.00" class="sc-loraregular">42.3%</text><text x="473.54" y="546.82" font-size="11.00" class="sc-notoserifcjksc">提升至</text><text x="108.00" y="562.44" font-size="11.00" class="sc-loraregular">66.2%</text><text x="138.90" y="562.44" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="242.89" y="471.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="242.89" y="471
