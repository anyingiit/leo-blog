.00" class="sc-lorabold">CB-2</text><text x="148.54 159.54 170.54 181.54 192.54 203.54 214.54 225.54 236.54 247.54 258.54 269.54" y="387.98" font-size="11.00" class="sc-notoserifcjkscbold">威胁模型相关的自动化评估</text><text x="72.00 83.00" y="420.37" font-size="11.00" class="sc-notoserifcjkscbold">详情</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89" y="420.37" font-size="11.00" class="sc-notoserifcjksc">我们与专注于利用</text><text x="187.79 194.67" y="420.37" font-size="11.00" class="sc-loraregular">AI</text><text x="201.25 212.25 223.25 234.25 245.25 256.25 267.25" y="420.37" font-size="11.00" class="sc-notoserifcjksc">设计基因疗法的</text><text x="281.14 289.34 295.15 301.82 308.26 311.15 318.19 324.78 330.74 335.43 341.10 347.67 353.63 360.20 364.46 367.55 373.40" y="420.37" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="381.39 392.39 403.39 414.39 425.39 436.39 447.39 458.39 469.39 480.39 491.39 502.39 513.39 524.39" y="420.37" font-size="11.00" class="sc-notoserifcjksc">合作，评估模型在序列到功能预</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="435.99" font-size="11.00" class="sc-notoserifcjksc">测与设计方面的表现。具体而言，我们使用了一项中程挑战；自</text><text x="382.89 388.80 395.63 399.64" y="435.99" font-size="11.00" class="sc-loraregular">2018</text><text x="408.71 419.71 430.71 441.71" y="435.99" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="452.71 460.91 466.71 473.39" y="435.99" font-size="11.00" class="sc-loraregular">Dyno</text><text x="482.72 493.72 504.72 515.72 526.72" y="435.99" font-size="11.00" class="sc-notoserifcjksc">也用它评估</text><text x="349.89 355.89" y="451.61" font-size="11.00" class="sc-loraregular">57</text><text x="363.85 374.85 385.85 396.85 407.85 418.85 429.85 440.85 451.85 462.85 473.85 484.85 495.85 506.85 517.85 528.85" y="451.61" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。该任务的序列和目标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="467.23" font-size="11.00" class="sc-notoserifcjksc">均未发表，因此不存在数据污染。任务测量模型能否在极少提示和有限数据访问的条件下，在低</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="482.85" font-size="11.00" class="sc-notoserifcjksc">上下文的黑盒环境中设计</text><text x="195.89 202.80 211.18" y="482.85" font-size="11.00" class="sc-loraregular">RNA</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="498.47" font-size="11.00" class="sc-notoserifcjksc">却需要通过推理解决一般性的序列设计挑战。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="598.48" font-size="11.00" class="sc-notoserifcjksc">具体而言，任务要求人类参与者或模型分析数据，依据训练数据集中少量实验测量结果建立序列</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="614.10" font-size="11.00" class="sc-notoserifcjksc">到功能关系模型，并利用该模型预测测试数据集中序列的功能。此外，任务还要求参与者设计两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="629.72" font-size="11.00" class="sc-notoserifcjksc">个数据集中均不存在的新序列，使其功能尽可能强。要在该任务中表现出色，需要通过分析发现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="645.34" font-size="11.00" class="sc-notoserifcjksc">序列的非显而易见属性、构建表达能力强的模型架构，并根据这些模型的表现作出最优设计权</text><text x="72.00 83.00" y="660.96" font-size="11.00" class="sc-notoserifcjksc">衡。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p032.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 32 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">人类参与者被要求在该任务上花费不超过</text><text x="272.89" y="98.80" font-size="11.00" class="sc-loraregular">2</text><text x="281.69" y="98.80" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="295.59" y="98.80" font-size="11.00" class="sc-loraregular">3</text><text x="304.61 315.61 326.61 337.61 348.61 359.61 370.61 381.61 392.61 403.61 414.61 425.61 436.61 447.61 458.61" y="98.80" font-size="11.00" class="sc-notoserifcjksc">小时。模型则在配有标准科学计算</text><text x="472.50 479.33 485.19 489.45 496.04 502.47" y="98.80" font-size="11.00" class="sc-loraregular">Python</text><text x="512.04 523.04" y="98.80" font-size="11.00" class="sc-notoserifcjksc">库的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">容器化环境中获得</text><text x="162.89" y="114.42" font-size="11.00" class="sc-loraregular">2</text><text x="171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69 259.69" y="114.42" font-size="11.00" class="sc-notoserifcjksc">小时工具调用预算、</text><text x="270.69 279.06 285.73" y="114.42" font-size="11.00" class="sc-loraregular">GPU</text><text x="296.90 307.90 318.90 329.90 340.90" y="114.42" font-size="11.00" class="sc-notoserifcjksc">访问权限和</text><text x="354.79 358.79 365.62" y="114.42" font-size="11.00" class="sc-loraregular">100</text><text x="375.35" y="114.42" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="389.24 393.50 399.93 405.76 411.72" y="114.42" font-size="11.00" class="sc-loraregular">token</text><text x="421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="114.42" font-size="11.00" class="sc-notoserifcjksc">额度。我们还要求模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">生成一份独立完整的</text><text x="173.89 182.47 189.51 199.61" y="130.04" font-size="11.00" class="sc-loraregular">HTML</text><text x="208.86 219.86 230.86 241.86 252.86 263.86 274.86 285.86 296.86 307.86 318.86 329.86 340.86 351.86 362.86 373.86 384.86 395.86 406.86 417.86" y="130.04" font-size="11.00" class="sc-notoserifcjksc">报告，介绍其方法和发现。我们将产出发送给</text><text x="431.76 439.95 445.76 452.44" y="130.04" font-size="11.00" class="sc-loraregular">Dyno</text><text x="458.87 469.87 480.87 491.87 502.87 513.87 524.87" y="130.04" font-size="11.00" class="sc-notoserifcjksc">，按照与人类候</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">选者相同的评分细则进行评分。每个模型在该任务上采样了</text><text x="360.89" y="145.66" font-size="11.00" class="sc-loraregular">8</text><text x="369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="145.66" font-size="11.00" class="sc-notoserifcjksc">次尝试。产出按两项指标评分：自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="161.28" font-size="11.00" class="sc-notoserifcjksc">动化预测分数，评估预测与测试集中序列功能真值之间的斯皮尔曼相关系数；自动化设计分数，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">评估参与者或模型提出的最佳序列的功能真值。</text><text x="72.00 83.00" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold">依据</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="276.91" font-size="11.00" class="sc-notoserifcjksc">该评估可作为模型设计新型生物序列能力的早期指标，具有必要性但不充分。这类设计是许</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">所有这些路径传导风险。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="367.87" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的基准</text><text x="151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89" y="367.87" font-size="11.00" class="sc-notoserifcjksc">我们定义了两个显著能力基准。如果模型的平均表现超过人类参与者的第</text><text x="506.79 511.86" y="367.87" font-size="11.00" class="sc-loraregular">75</text><text x="520.74" y="367.87" font-size="11.00" class="sc-notoserifcjksc">百</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="383.49" font-size="11.00" class="sc-notoserifcjksc">分位，则超过第一个基准；如果模型的平均表现超过表现最好的人类参与者，则超过第二个基</text><text x="72.00 83.00" y="399.11" font-size="11.00" class="sc-notoserifcjksc">准。</text><text x="72.00 83.00" y="448.83" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="448.83" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="219.77 230.77 241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77" y="448.83" font-size="11.00" class="sc-notoserifcjksc">在两项任务中均超过第一个基准，并超过人类预测分数的第</text><text x="508.67 515.03" y="448.83" font-size="11.00" class="sc-loraregular">90</text><text x="524.75" y="448.83" font-size="11.00" class="sc-notoserifcjksc">百</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="464.45" font-size="11.00" class="sc-notoserifcjksc">分位，但两项任务均未超过第二个基准。</text><text x="270.00 277.69 280.68 286.29 292.86 299.44 305.40 308.29 318.22 324.09 328.34 334.93 341.37 346.46 349.35 356.02 360.71 366.61 372.17 375.26 381.18" y="464.45" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="392.88 403.88 414.88 425.88 436.88 447.88" y="464.45" font-size="11.00" class="sc-notoserifcjksc">的平均表现较</text><text x="461.77 469.46 472.46 478.07 484.63 491.21 497.17 500.07 506.30 512.74 519.41 526.09 531.98" y="464.45" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00 77.96 80.56" y="480.07" font-size="11.00" class="sc-loraregular">4.6</text><text x="89.81" y="480.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="103.70 111.39 114.38 119.99 126.56 133.14 139.10 141.99 150.73 157.29 163.86 168.95 171.85 177.81 180.40" y="480.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="189.66 200.66 211.66 222.66 233.66 244.66 255.66 266.66 277.66 288.66 299.66 310.66 321.66 332.66 343.66 354.66 365.66 376.66 387.66 398.66 409.66 420.66 431.66 442.66 453.66 464.66 475.66 486.66 497.66 508.66" y="480.07" font-size="11.00" class="sc-notoserifcjksc">均有适度提高，在某些样本上比先前模型更接近人类最佳预测表现。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="495.69" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="157.70" y="495.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.59 179.28 182.27 187.88 194.45 201.03 206.99 209.89 218.38 224.05 227.14 233.05 239.62 242.51 248.47 251.18" y="495.69" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="260.07 271.07 282.07 293.07 304.07 315.07 326.07 337.07 348.07 359.07 370.07 381.07 392.07 403.07 414.07 425.07 436.07 447.07 458.07 469.07 480.07 491.07 502.07 513.07 524.07" y="495.69" font-size="11.00" class="sc-notoserifcjksc">在两项任务上的表现明显更差。我们得出的结论是，在类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="511.31" font-size="11.00" class="sc-notoserifcjksc">似的中程任务中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 246.02 250.71 256.61 262.17 265.26 271.18" y="511.31" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="526.93" font-size="11.00" class="sc-notoserifcjksc">获得少量数据的条件下，显著提升团队设计功能更强序列的能力；这对更长程任务的影响尚不明</text><text x="72.00 83.00" y="542.55" font-size="11.00" class="sc-notoserifcjksc">确。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p033.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 33 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">33</text><text x="72.00" y="281.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.49 107.59 112.45 114.54 120.08" y="281.68" font-size="9.00" class="sc-lorabold">2.2.5.5.A]</text><text x="125.92 134.92 143.92 152.92 161.92 170.92 179.92 188.92 197.92 206.92 215.92" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">序列到功能建模与预测。</text><text x="224.92 231.21 233.66 238.25 243.62 249.00 253.88 256.25 264.38 269.17 272.66 278.05 283.31 287.48 289.85 295.30 299.13 303.97 308.51 311.04 315.88" y="281.68" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="293.38" font-size="9.00" class="sc-notoserifcjksc">优于先前模型。各次模型运行以点表示。左侧和中间面板的水平线表示各组的平均值。右侧面板的线段表示同一模型各</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00" y="305.08" font-size="9.00" class="sc-notoserifcjksc">次运行所得分数的范围，线段交点表示该模型各次运行的平均表现。每个模型对该任务独立尝试了</text><text x="461.37" y="305.08" font-size="9.00" class="sc-loraregular">8</text><text x="468.79 477.79 486.79 495.79 504.79 513.79 522.79 531.79" y="305.08" font-size="9.00" class="sc-notoserifcjksc">次。低于人类表现</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="316.78" font-size="9.00" class="sc-notoserifcjksc">中位数的运行所对应的点未显示；</text><text x="207.00 213.29 215.74 220.33 225.70 231.08 235.96 238.33 245.48 250.85 256.22 260.39 262.76 267.63 269.85" y="316.78" font-size="9.00" class="sc-loraregular">Claude Opus 4.5</text><text x="277.12 286.12 295.12 304.12 313.12 322.12 331.12 340.12 349.12 358.12 367.12 376.12 385.12 394.12" y="316.78" font-size="9.00" class="sc-notoserifcjksc">有一次这样的运行（预测），而</text><text x="405.49 410.59 415.85 421.32 426.78 431.60 435.08 437.45 442.32 444.45" y="316.78" font-size="9.00" class="sc-loraregular">Sonnet 4.6</text><text x="449.65" y="316.78" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="458.65 464.94 467.39 471.98 477.35 482.73 487.61 489.98 497.12 502.50 507.87 512.04 514.40 519.28 521.41" y="316.78" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="528.98" y="316.78" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93 142.38 146.21 151.05 155.59 158.12 162.96" y="328.48" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="172.54 181.54 190.54 199.54" y="328.48" font-size="9.00" class="sc-notoserifcjksc">均没有。</text><text x="72.00 80.04 83.68" y="407.81" font-size="14.00" class="sc-poppinssemibold">2.3</text><text x="95.39 109.39 123.39 137.39 151.39" y="407.81" font-size="14.00" class="sc-notosanscjkscbold">自主性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="434.37" font-size="11.00" class="sc-notoserifcjksc">这些评估的动因来自我们</text><text x="195.89 202.80 209.04" y="434.37" font-size="11.00" class="sc-loraregular">RSP</text><text x="218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60" y="434.37" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="466.75" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="466.75" font-size="11.00" class="sc-lorabold">1</text><text x="156.36 167.36 178.36 189.36 200.36 211.36 222.36 233.36 244.36" y="466.75" font-size="11.00" class="sc-notoserifcjkscbold">：早期未对齐风险。</text><text x="255.36 266.36 277.36 288.36 299.36 310.36 321.36 332.36 343.36 354.36 365.36 376.36" y="466.75" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样的</text><text x="390.25 397.14" y="466.75" font-size="11.00" class="sc-loraregular">AI</text><text x="403.72 414.72 425.72 436.72 447.72 458.72 469.72 480.72 491.72 502.72 513.72 524.72" y="466.75" font-size="11.00" class="sc-notoserifcjksc">系统：它们被高度依赖，拥</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="482.37" font-size="11.00" class="sc-notoserifcjksc">有对敏感资产的广泛访问权限，并具备中等程度的自主、目标导向运作及使用隐蔽手段的能力，</text><text x="72.00 83.00 94.00 105.00 116.00" y="497.99" font-size="11.00" class="sc-notoserifcjksc">以至于这些</text><text x="129.89 136.78" y="497.99" font-size="11.00" class="sc-loraregular">AI</text><text x="143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="497.99" font-size="11.00" class="sc-notoserifcjksc">系统有可能（若被引向这一目标，无论是有意还是无意）实施未对齐行为，从而不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="513.61" font-size="11.00" class="sc-notoserifcjksc">可逆地、大幅提高日后发生全球性灾难的概率。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="580.10" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="580.10" font-size="11.00" class="sc-lorabold">2</text><text x="157.76 168.76 179.76 190.76 201.76 212.76 223.76 234.76 245.76 256.76 267.76 278.76" y="580.10" font-size="11.00" class="sc-notoserifcjkscbold">：来自自动化研发的风险。</text><text x="289.76 300.76 311.76 322.76 333.76 344.76 355.76 366.76 377.76 388.76 399.76 410.76" y="580.10" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样的</text><text x="424.65 431.53" y="580.10" font-size="11.00" class="sc-loraregular">AI</text><text x="438.11 449.11 460.11 471.11 482.11 493.11 504.11 515.11 526.11" y="580.10" font-size="11.00" class="sc-notoserifcjksc">系统：它们能够完全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="595.72" font-size="11.00" class="sc-notoserifcjksc">自动化、或以其他方式剧烈加速大型顶尖人类研究团队的工作，且所涉领域的快速进展可能对国</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="611.34" font-size="11.00" class="sc-notoserifcjksc">际安全构成威胁和</text><text x="160.00" y="611.34" font-size="11.00" class="sc-loraregular">/</text><text x="475.10 481.98" y="611.34" font-size="11.00" class="sc-loraregular">AI</text><text x="488.56 499.56 510.56" y="611.34" font-size="11.00" class="sc-notoserifcjksc">本身。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p034.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 34 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">34</text><text x="72.00 79.46 82.84 90.63 94.01 98.72 101.81 111.79 115.41 124.22 132.81 141.63 149.65 152.74 164.43 172.30 177.34 185.93 194.23 201.31 204.40 212.31 217.56 225.58 233.37 236.98 245.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1 Claude Mythos Preview</text><text x="259.07 272.07 285.07 298.07 311.07 324.07 337.07" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">如何影响或改变</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00 176.00 189.00 202.00 215.00 228.00 241.00" y="105.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们最近一份风险报告中的分析</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="133.46" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="165.84" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="187.89" y="165.84" font-size="11.00" class="sc-loraregular">1</text><text x="194.79 205.79 216.79" y="165.84" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="230.68 238.37 241.36 246.97 253.54 260.12 266.08 268.97 278.91 284.77 289.03 295.62 302.05 307.14 310.04 316.70 321.39 327.30 332.85 335.94 341.86" y="165.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="350.67 361.67 372.67 383.67" y="165.84" font-size="11.00" class="sc-notoserifcjksc">。此外，</text><text x="394.67 402.36 405.35 410.96 417.53 424.11 430.07 432.96 442.90 448.76 453.02 459.60 466.04 471.13 474.03 480.69 485.38 491.28 496.84 499.93 505.85" y="165.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="517.55 528.55" y="165.84" font-size="11.00" class="sc-notoserifcjksc">能力</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="181.46" font-size="11.00" class="sc-notoserifcjksc">的提升以及可能不同的对齐特性，意味着它有可能显著影响我们此前的风险评估。有鉴于</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="197.08" font-size="11.00" class="sc-notoserifcjksc">此，我们正在针对这一威胁模型发布一份</text><text x="306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="197.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">单独的整体风险评估</text><text x="405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="197.08" font-size="11.00" class="sc-notoserifcjksc">，其中同时纳入了我们的风</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="212.70" font-size="11.00" class="sc-notoserifcjksc">险缓解措施和模型能力。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="263.00" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="187.89" y="263.00" font-size="11.00" class="sc-loraregular">2</text><text x="196.69 207.69 218.69 229.69" y="263.00" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="243.59 251.27 254.27 259.88 266.44 273.02 278.98 281.88 291.81 297.67 301.93 308.52 314.95 320.05 322.94 329.61 334.29 340.20 345.75 348.85 354.76" y="263.00" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="363.57 374.57 385.57 396.57 407.57 418.57 429.57 440.57 451.57 462.57 473.57 484.57 495.57 506.57 517.57 528.57" y="263.00" font-size="11.00" class="sc-notoserifcjksc">。该模型（相对于此前模型）的能力</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="278.62" font-size="11.00" class="sc-notoserifcjksc">增益高于我们此前观察到的趋势，但我们认为，这些增益具体可归因于</text><text x="451.89 458.78" y="278.62" font-size="11.00" class="sc-loraregular">AI</text><text x="465.36 476.36 487.36 498.36 509.36 520.36" y="278.62" font-size="11.00" class="sc-notoserifcjksc">加速的研发以</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="294.24" font-size="11.00" class="sc-notoserifcjksc">外的因素。基于我们在内部使用该模型的经验，以及它在自主研究任务上相对于</text><text x="108.00 114.89 121.46 125.72 132.31 137.00 143.43 150.00 153.09" y="309.86" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.83 172.83 183.83 194.83 205.83 216.83 227.83 238.83 249.83 260.83 271.83 282.83 293.83" y="309.86" font-size="11.00" class="sc-notoserifcjksc">员工的不足，我们得出结论：</text><text x="304.83 312.52 315.52 321.12 327.69 334.27 340.23 343.12 353.06 358.92 363.18 369.77 376.20 381.30 384.19 390.85 395.54 401.45 407.00 410.09 416.01" y="309.86" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="427.71 438.71 449.71 460.71 471.71 482.71 493.71 504.71 515.71 526.71" y="309.86" font-size="11.00" class="sc-notoserifcjksc">尚不具备我们负责任扩</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="325.48" font-size="11.00" class="sc-notoserifcjksc">展政策中所操作化定义的剧烈加速能力（粗略地说，即把两年的</text><text x="418.89 425.78" y="325.48" font-size="11.00" class="sc-loraregular">AI</text><text x="432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="325.48" font-size="11.00" class="sc-notoserifcjksc">研发进展压缩到一年</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="341.10" font-size="11.00" class="sc-notoserifcjksc">之内）。有鉴于此，我们认为</text><text x="253.89 261.58 264.57 270.18 276.75 283.33 289.29 292.18 302.12 307.98 312.24 318.83 325.26 330.35 333.25 339.91 344.60 350.51 356.06 359.15 365.07" y="341.10" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="376.77 387.77 398.77 409.77 420.77 431.77 442.77 453.77" y="341.10" font-size="11.00" class="sc-notoserifcjksc">并未大幅改变我们</text><text x="464.77 475.77 486.77 497.77 508.77 519.77" y="341.10" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险</text><text x="108.00 119.00" y="356.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">报告</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="356.72" font-size="11.00" class="sc-notoserifcjksc">中针对该威胁模型所呈现的图景，只是我们对</text><text x="350.00" y="356.72" font-size="11.00" class="sc-loraregular">“</text><text x="354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40" y="356.72" font-size="11.00" class="sc-notoserifcjksc">该威胁模型尚不适用</text><text x="453.40" y="356.72" font-size="11.00" class="sc-loraregular">”</text><text x="457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="356.72" font-size="11.00" class="sc-notoserifcjksc">这一判断的把握</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="372.34" font-size="11.00" class="sc-notoserifcjksc">程度有中等程度的下降。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="457.30" font-size="11.00" class="sc-notoserifcjksc">下文将进一步详述自主性威胁模型</text><text x="239.89" y="457.30" font-size="11.00" class="sc-loraregular">2</text><text x="245.80 256.80 267.80 278.80 289.80 300.80 311.80 322.80 333.80 344.80 355.80 366.80 377.80 388.80 399.80 410.80 421.80 432.80 443.80" y="457.30" font-size="11.00" class="sc-notoserifcjksc">。我们在此不再进一步讨论自主性威胁模型</text><text x="457.69" y="457.30" font-size="11.00" class="sc-loraregular">1</text><text x="461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="457.30" font-size="11.00" class="sc-notoserifcjksc">，因为它已在一</text><text x="72.00" y="472.92" font-size="11.00" class="sc-notoserifcjksc">份</text><text x="83.00 94.00 105.00 116.00 127.00" y="472.92" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">单独的文件</text><text x="138.00 149.00 160.00 171.00" y="472.92" font-size="11.00" class="sc-notoserifcjksc">中讨论。</text><text x="72.00 79.46 82.84 90.63 94.01" y="504.22" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2</text><text x="104.57 117.57 130.57 143.57 156.57 169.57 182.57 195.57 208.57 221.57 234.57 247.57 260.57 273.57 286.57 299.57 312.57 325.57 338.57 351.57" y="504.22" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于我们对关键能力阈值的操作化定义的说明</text><text x="72.00 78.91 85.15 91.81 94.70 100.26 106.39 109.09" y="532.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP v3.1</text><text x="115.99 126.99 137.99 148.99 159.99 170.99 181.99 192.99 203.99 214.99 225.99 236.99 247.99 258.99 269.99 280.99 291.99 302.99 313.99 324.99 335.99" y="532.11" font-size="11.00" class="sc-notoserifcjksc">将自动化研发能力操作化定义为以下两者之一：</text><text x="346.99" y="532.11" font-size="11.00" class="sc-loraregular">1</text><text x="350.99 361.99 372.99 383.99 394.99 405.99 416.99 427.99 438.99 449.99 460.99 471.99 482.99 493.99 504.99 515.99 526.99" y="532.11" font-size="11.00" class="sc-notoserifcjksc">）能够以具有竞争力的成本替代我们全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="547.73" font-size="11.00" class="sc-notoserifcjksc">部的研究科学家和研究工程师；或</text><text x="239.89" y="547.73" font-size="11.00" class="sc-loraregular">2</text><text x="245.80 256.80 267.80 278.80" y="547.73" font-size="11.00" class="sc-notoserifcjksc">）由于与</text><text x="292.69 299.58" y="547.73" font-size="11.00" class="sc-loraregular">AI</text><text x="306.16 317.16 328.16 339.16 350.16 361.16 372.16 383.16 394.16 405.16 416.16 427.16" y="547.73" font-size="11.00" class="sc-notoserifcjksc">研发自动化相关的原因，使</text><text x="441.05 447.94" y="547.73" font-size="11.00" class="sc-loraregular">AI</text><text x="454.51 465.51 476.51 487.51 498.51 509.51 520.51" y="547.73" font-size="11.00" class="sc-notoserifcjksc">进展的速度出现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="563.35" font-size="11.00" class="sc-notoserifcjksc">剧烈加速（例如翻倍）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="613.07" font-size="11.00" class="sc-notoserifcjksc">我们所关注的威胁模型是一种</text><text x="217.89 224.78" y="613.07" font-size="11.00" class="sc-loraregular">AI</text><text x="231.36 242.36 253.36 264.36" y="613.07" font-size="11.00" class="sc-notoserifcjksc">开发加速</text><text x="278.25 285.14" y="613.07" font-size="11.00" class="sc-loraregular">AI</text><text x="291.71 302.71 313.71 324.71 335.71 346.71 357.71 368.71 379.71 390.71 401.71 412.71 423.71 434.71 445.71 456.71 467.71 478.71 489.71 500.71 511.71 522.71" y="613.07" font-size="11.00" class="sc-notoserifcjksc">开发的反馈回路。我们希望我们的阈值能在潜在反</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="628.69" font-size="11.00" class="sc-notoserifcjksc">馈回路的早期阶段被触发，即在它使进展速度出现极端加速之前。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="677.84" font-size="11.00" class="sc-notoserifcjksc">具体而言，我们关心的是可归因于</text><text x="239.89 246.78" y="677.84" font-size="11.00" class="sc-loraregular">AI</text><text x="253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36" y="677.84" font-size="11.00" class="sc-notoserifcjksc">的加速，即模型对</text><text x="344.25 351.14" y="677.84" font-size="11.00" class="sc-loraregular">AI</text><text x="357.71 368.71 379.71 390.71 401.71 412.71 423.71 434.71 445.71 456.71 467.71 478.71 489.71 500.71 511.71 522.71" y="677.84" font-size="11.00" class="sc-notoserifcjksc">开发速度的贡献，而不是恰好使用该</text><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="306.00" y="188.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="306.00" y="188.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="317.00" y="188.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="317.00" y="188.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.00" y="188.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.00" y="188.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="339.00" y="188.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="339.00" y="188.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="350.00" y="188.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="350.00" y="188.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-preview-ri <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p035.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 35 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">35</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">仅基于总体速度的阈值会因其中任何一个因素而被触发，而无法单独识别出我们真正想要检测</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40 109.40 120.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">反馈回路</text><text x="131.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">动态。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与此相关，我们不将人员规模或人均生产率（例如一个人单位时间内能编写多少代码）的翻倍等</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">同于进展速度的翻倍。事实上，在其他因素保持不变、且研究投入的回报随时间递减的情况下，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">我们预计需要远超人员规模或每小时生产率翻倍的提升，才能使进展速度翻倍。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">综上所述，我们注意到，衡量通用能力的整体加速仍然是一个有价值的起点：如果没有检测到此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">类加速，我们就可以相当确定也不存在由</text><text x="272.89 279.78" y="243.96" font-size="11.00" class="sc-loraregular">AI</text><text x="286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="243.96" font-size="11.00" class="sc-notoserifcjksc">驱动的加速（因此它可作为一项排除性指标）。如果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">检测到了加速，则需要进一步调查，以确定该加速是否可归因于</text><text x="382.89 389.78" y="259.58" font-size="11.00" class="sc-loraregular">AI</text><text x="393.46 404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="259.58" font-size="11.00" class="sc-notoserifcjksc">，以及观察到的模型能力加速</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">是否会转化为进展速度的预期加速。</text><text x="72.00 79.46 82.84 90.63 94.01" y="340.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89 117.89 130.89 143.89 156.89 169.89 182.89" y="340.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="367.91" font-size="11.00" class="sc-notoserifcjksc">此前的系统卡曾报告一套自动化研究任务，作为针对</text><text x="327.89 334.78" y="367.91" font-size="11.00" class="sc-loraregular">AI</text><text x="341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="367.91" font-size="11.00" class="sc-notoserifcjksc">研发能力的排除性评估：模型在这些任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">上失败，即表明它缺乏那些很可能是实现有意义的研发加速之前提的能力。</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 483.22 489.09 493.34 499.93 506.37" y="383.53" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="399.15" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53 500.53 511.53 522.53" y="399.15" font-size="11.00" class="sc-notoserifcjksc">与紧邻其之前的模型一样，在所有这些任务上都超过了人类顶尖表现的阈值。因此，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="414.77" font-size="11.00" class="sc-notoserifcjksc">套任务已无法再为</text><text x="160.00" y="414.77" font-size="11.00" class="sc-loraregular">“</text><text x="164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40" y="414.77" font-size="11.00" class="sc-notoserifcjksc">能力未达到相关阈值</text><text x="263.40" y="414.77" font-size="11.00" class="sc-loraregular">”</text><text x="267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24" y="414.77" font-size="11.00" class="sc-notoserifcjksc">提供证据。我们在此报告它，是为了在</text><text x="457.13 464.82 467.81 473.42 479.99 486.57 492.53 495.42 505.36 511.22 515.48 522.06 528.50" y="414.77" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="430.39" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53" y="430.39" font-size="11.00" class="sc-notoserifcjksc">的能力与此前模型之间提供一个比较参照。关于各评估任务的详细说明，可参阅</text><text x="503.42 511.11 514.10 519.71 526.28 532.86" y="430.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="446.01" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.6</text><text x="119.66 130.66 141.66 152.66" y="446.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡第</text><text x="166.56 172.74 175.44" y="446.01" font-size="11.00" class="sc-loraregular" fill="#0000ff">8.3</text><text x="184.46" y="446.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="195.46 206.46 217.46 228.46 239.46 250.46 261.46 272.46 283.46 294.46 305.46 316.46 327.46 338.46 349.46 360.46 371.46 382.46 393.46 404.46 415.46 426.46" y="446.01" font-size="11.00" class="sc-notoserifcjksc">。此处我们仅列出具有无上限分数的任务的结果：</text><a href="https://www-cdn.anthropic.com/14e4fb01875d ="11.00" class="sc-lorabold">reward hacking</text><text x="264.19 275.19 286.19 297.19" y="635.79" font-size="11.00" class="sc-notoserifcjkscbold">）的说明</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="668.18" font-size="11.00" class="sc-notoserifcjksc">我们的评估基础设施会检查所有对话记录，标记出任何可能影响最终分数的问题。我们会检查工</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="683.80" font-size="11.00" class="sc-notoserifcjksc">具调用问题、环境问题、拒绝以及作弊。与此前模型不同，</text><text x="358.00 365.69 368.68 374.29 380.86 387.44 393.40 396.29 406.22 412.09 416.34 422.93 429.37 434.46 437.35 444.02 448.71 454.61 460.17 463.26 469.18" y="683.80" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="480.88 491.88 502.88 513.88 524.88" y="683.80" font-size="11.00" class="sc-notoserifcjksc">表现出了两</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="699.42" font-size="11.00" class="sc-notoserifcjksc">种在这些评估中从未观察到的新型奖励</text></svg></div>

t-size="11.00" class="sc-notoserifcjksc">常的试验均已从最终分数中剔除，且所有取得最高分的试验均经过了人工审核验证。</text><text x="72.00 77.86 80.43 86.59 89.15 95.31 97.87" y="195.95" font-size="11.00" class="sc-lorabold">2.3.3.2</text><text x="106.63 117.63 128.63 139.63 150.63 161.63 172.63 183.63 194.63" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">此前模型分数的更新</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在评估过程中，我们发现了一个缺陷：即使对于具有</text><text x="327.89 331.90 338.73" y="228.34" font-size="11.00" class="sc-loraregular">100</text><text x="348.45" y="228.34" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="362.35 366.60 373.04 378.87 384.83" y="228.34" font-size="11.00" class="sc-loraregular">token</text><text x="394.40 405.40 416.40 427.40 438.40 449.40 460.40 471.40 482.40 493.40 504.40 515.40 526.40" y="228.34" font-size="11.00" class="sc-notoserifcjksc">上下文的模型，它也默认使用</text><text x="72.00 77.91" y="243.96" font-size="11.00" class="sc-loraregular">20</text><text x="87.63" y="243.96" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="101.52 105.78 112.22 118.05 124.01" y="243.96" font-size="11.00" class="sc-loraregular">token</text><text x="133.58 144.58 155.58 166.58 177.58 188.58 199.58 210.58" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的上下文。我们为</text><text x="224.47 232.16 235.15 240.76 247.33 253.91 259.87 262.76 271.50 278.06 284.63 289.72 292.62 298.58 301.17" y="243.96" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="310.43 321.43 332.43 343.43 354.43 365.43 376.43 387.43 398.43 409.43 420.43 431.43 442.43 453.43 464.43 475.43 486.43 497.43 508.43 519.43" y="243.96" font-size="11.00" class="sc-notoserifcjksc">重新运行了这些评估，以检查是否有分数会发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">生变化，上表反映的是我们更新后的分数。这些变化不影响我们此前的判定。</text><text x="72.00 79.46 82.84 90.63 94.01" y="307.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4</text><text x="105.70 118.70 131.70 144.70 157.70 170.70 183.70 196.70" y="307.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部问卷调查结果</text><text x="72.00 83.00 94.00" y="335.53" font-size="11.00" class="sc-notoserifcjksc">我们就</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.91 198.60 204.51 210.06 213.15 219.07" y="335.53" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.77 241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77" y="335.53" font-size="11.00" class="sc-notoserifcjksc">的优势与局限开展了一项</text><text x="354.67 361.34 367.05 371.06" y="335.53" font-size="11.00" class="sc-loraregular">n=18</text><text x="380.13 391.13 402.13 413.13 424.13 435.13" y="335.53" font-size="11.00" class="sc-notoserifcjksc">的问卷调查。</text><text x="446.13 450.14" y="335.53" font-size="11.00" class="sc-loraregular">18</text><text x="459.21 470.21 481.21 492.21 503.21 514.21" y="335.53" font-size="11.00" class="sc-notoserifcjksc">名参与者中有</text><text x="528.10" y="335.53" font-size="11.00" class="sc-loraregular">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="351.15" font-size="11.00" class="sc-notoserifcjksc">名认为我们已经拥有了初级研究科学家或工程师的即插即用的替代者，另有</text><text x="437.89" y="351.15" font-size="11.00" class="sc-loraregular">4</text><text x="446.75 457.75 468.75 479.75 490.75 501.75" y="351.15" font-size="11.00" class="sc-notoserifcjksc">名认为，经过</text><text x="515.64" y="351.15" font-size="11.00" class="sc-loraregular">3</text><text x="524.66" y="351.15" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="366.77" font-size="11.00" class="sc-notoserifcjksc">月的脚手架迭代，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 246.02 250.71 256.61 262.17 265.26 271.18" y="366.77" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="282.88" y="366.77" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="296.77 302.77 309.60" y="366.77" font-size="11.00" class="sc-loraregular">50%</text><text x="322.06 333.06 344.06 355.06 366.06 377.06 388.06 399.06 410.06 421.06 432.06 443.06 454.06 465.06 476.06 487.06 498.06 509.06 520.06" y="366.77" font-size="11.00" class="sc-notoserifcjksc">的可能够格成为这样的替代者。我们推测，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="382.39" font-size="11.00" class="sc-notoserifcjksc">若进行澄清性的对话，这些数字会有所下降，正如上一次模型发布时那样，但这一次我们没有进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="398.01" font-size="11.00" class="sc-notoserifcjksc">行此类对话。</text><text x="72.00 83.00 94.00 105.00" y="448.87" font-size="11.00" class="sc-notoserifcjksc">所报告的</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="448.87" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18" y="448.87" font-size="11.00" class="sc-notoserifcjksc">相较于</text><text x="193.08 199.51" y="448.87" font-size="11.00" class="sc-loraregular">L4</text><text x="208.37 219.37 230.37 241.37 252.37 263.37 274.37 285.37 296.37 307.37 318.37 329.37 340.37 351.37 362.37 373.37 384.37 395.37 406.37 417.37 428.37 439.37 450.37 461.37 472.37 483.37 494.37 505.37 516.37 527.37" y="448.87" font-size="11.00" class="sc-notoserifcjksc">职级的一些主要弱点包括：自主管理为期一周的模糊任务、理解组织</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="464.49" font-size="11.00" class="sc-notoserifcjksc">优先级、品味、验证、指令遵循以及认知素养。这项问卷调查的结果与以下判断一致：</text><text x="490.00 497.69 500.68 506.29 512.86 519.44" y="464.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="480.11" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59" y="480.11" font-size="11.00" class="sc-notoserifcjksc">并非即插即用的</text><text x="236.48 242.92" y="480.11" font-size="11.00" class="sc-loraregular">L4</text><text x="248.88 259.88 270.88 281.88 292.88 303.88 314.88 325.88 336.88 347.88 358.88 369.88 380.88 391.88 402.88" y="480.11" font-size="11.00" class="sc-notoserifcjksc">，且我们并未处于因该模型带来的</text><text x="416.77 423.66" y="480.11" font-size="11.00" class="sc-loraregular">AI</text><text x="430.24 441.24 452.24 463.24" y="480.11" font-size="11.00" class="sc-notoserifcjksc">加速而在</text><text x="477.13" y="480.11" font-size="11.00" class="sc-loraregular">1</text><text x="484.03 495.03 506.03 517.03" y="480.11" font-size="11.00" class="sc-notoserifcjksc">年内取得</text><text x="530.92" y="480.11" font-size="11.00" class="sc-loraregular">2</text><text x="72.00" y="495.73" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="85.89 92.78" y="495.73" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36 110.36 121.36 132.36 143.36 154.36 165.36" y="495.73" font-size="11.00" class="sc-notoserifcjksc">进展的轨道上。</text><text x="72.00 79.46 82.84 90.63 94.01" y="544.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5</text><text x="105.48 118.48 131.48 144.48 157.48 170.48 183.48 196.48 209.48 222.48" y="544.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">与我们的研究科学家和</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00 176.00 189.00 202.00 215.00" y="566.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究工程师相比的不足示例</text><text x="72.00 83.00 94.00 105.00" y="594.68" font-size="11.00" class="sc-notoserifcjksc">我们判定</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.91 209.60 215.51 221.06 224.15 230.07" y="594.68" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="594.68" font-size="11.00" class="sc-notoserifcjksc">并未越过相关阈值，主要原因在于：我们在日常工作中一直在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="610.30" font-size="11.00" class="sc-notoserifcjksc">广泛使用它，并探索它在哪些方面能够将此类工作自动化，而它似乎远未能够替代研究科学家和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="691.84" font-size="11.00" class="sc-notoserifcjksc">这仍留有一种可能性，即</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.91 286.60 292.51 298.06 301.15 307.07" y="691.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77" y="691.84" font-size="11.00" class="sc-notoserifcjksc">可能通过相对狭窄的能力（即在无法</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">替代我们大多数研究科学家和研究工程师的情况下）剧烈加速我们的进展，但我们认为，默认情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">况下应将这种可能性视为不太可能。鉴于已有大量人才和算力投入到提升模型能力之中，我们预</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">计，要让</text><text x="118.89 125.78" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推动我们所关注的那种剧烈加速，要么需要非常广泛的能力，广泛到能够替代至少许</text><text x="327.89 334.78" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">研发直接相关的核心领域具备极强且持续</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">产生重大影响的专门能力（我们预计后者在定性层面会显而易见，进而促使我们对其进行更多讨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">论和分析）。</text><text x="72.00 83.00 94.00 105.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">当我们说</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.91 209.60 215.51 221.06 224.15 230.07 238.88 241.77" y="228.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview “</text><text x="246.17 257.17 268.17 279.17 290.17 301.17 312.17 323.17 334.17 345.17 356.17 367.17 378.17 389.17 400.17 411.17 422.17 433.17 444.17 455.17 466.17 477.17 488.17 499.17 510.17 521.17" y="228.34" font-size="11.00" class="sc-notoserifcjksc">似乎远未能够替代研究科学家和研究工程师，尤其是相对资</text><text x="72.00 83.00 94.00 105.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">深的那些</text><text x="116.00" y="243.96" font-size="11.00" class="sc-loraregular">”</text><text x="119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="243.96" font-size="11.00" class="sc-notoserifcjksc">时，这是我们的负责任扩展官基于其与员工的互动以及对研究工作流程和进展的观察所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">作出的定性判断。我们认为这是一个有依据的决定，但鉴于该模型在那些定义明确、可验证程度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">足以充当正式评估的任务上表现非常出色，要使这一判断的依据变得可读，本身就很困难。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">为了尝试传达这种直觉，我们列出了若干</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.91 363.60 369.51 375.06 378.15 384.07" y="357.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="357.88" font-size="11.00" class="sc-notoserifcjksc">任务失败的示例，我们认为这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">些示例展示了它相较于我们的研究科学家和工程师的局限。这些示例是通过浏览内部关于</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="373.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">使用问题的报告找到的，所选案例既能代表更普遍的问题，又便于分享。它们来自不同的快照，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">但我们认为这些问题大体上具有代表性。我们使用了</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="404.74" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="404.74" font-size="11.00" class="sc-notoserifcjksc">来查找示例并生成摘要，但这些示</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="420.36" font-size="11.00" class="sc-notoserifcjksc">例均经过了人工审核。</text><text x="72.00 77.86 80.43 86.59 89.15 95.09 97.65" y="487.41" font-size="11.00" class="sc-lorabold">2.3.5.1</text><text x="105.01 116.01" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">摘录</text><text x="129.90" y="487.41" font-size="11.00" class="sc-lorabold">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">模型被要求撰写一篇教程，将</text><text x="217.89 226.26 232.93" y="519.79" font-size="11.00" class="sc-loraregular">GPU</text><text x="244.10 255.10 266.10 277.10 288.10 299.10 310.10 321.10 332.10 343.10 354.10 365.10 376.10 387.10 398.10 409.10 420.10 431.10 442.10 453.10 464.10 475.10 486.10 497.10 508.10 519.10" y="519.79" font-size="11.00" class="sc-notoserifcjksc">优化方法映射到另一种加速器上。它生成了一份包含交互式</text><text x="72.00 83.00 94.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">图表的</text><text x="107.89 114.17 119.25 126.76 133.60 136.49 145.07 152.11 162.21" y="535.41" font-size="11.00" class="sc-loraregular">67KB HTML</text><text x="171.46 182.46 193.46 204.46 215.46 226.46 237.46 248.46 259.46 270.46 281.46 292.46 303.46 314.46 325.46 336.46 347.46 358.46 369.46 380.46 391.46 402.46 413.46 424.46 435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="535.41" font-size="11.00" class="sc-notoserifcjksc">文档。在整个会话中，用户在其撰写的内容中发现了四处相互独立的事实错</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">误；用户两次明确要求进行事实核查，此后仍然发现了错误。</text></svg></div>

</text><text x="473.30 484.30 495.30 506.30 517.30" y="116.05" font-size="11.00" class="sc-notoserifcjksc">。模型阅读</text><text x="139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00 271.00 282.00 293.00 304.00 315.00 326.00 337.00 348.00 359.00 370.00 381.00" y="131.67" font-size="11.00" class="sc-notoserifcjksc">了内核源代码，但没有核查生产环境中实际使用的是</text><text x="392.00" y="131.67" font-size="11.00" class="sc-loraregular">[</text><text x="395.95 406.95 417.95 428.95" y="131.67" font-size="11.00" class="sc-notoserifcjksc">哪种方案</text><text x="439.95" y="131.67" font-size="11.00" class="sc-loraregular">]</text><text x="443.90" y="131.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="139.00 150.00 161.00 172.00" y="175.88" font-size="11.00" class="sc-notoserifcjksc">教程声称</text><text x="185.89" y="175.88" font-size="11.00" class="sc-loraregular">[</text><text x="189.84 200.84 211.84" y="175.88" font-size="11.00" class="sc-notoserifcjksc">已隐去</text><text x="222.84" y="175.88" font-size="11.00" class="sc-loraregular">]</text><text x="226.79 237.79 248.79 259.79 270.79 281.79 292.79 303.79 314.79 325.79 336.79 347.79 358.79 369.79 380.79 391.79 402.79 413.79 424.79 435.79 446.79 457.79 468.79 479.79 490.79 501.79 512.79 523.79" y="175.88" font-size="11.00" class="sc-notoserifcjksc">。用户询问原因。模型从第一性原理重新推导，并承认该说法是</text><text x="139.00 150.00 161.00 172.00" y="191.50" font-size="11.00" class="sc-notoserifcjksc">错误的。</text><text x="139.00 150.00 161.00 172.00 183.00 194.00" y="219.51" font-size="11.00" class="sc-notoserifcjksc">在用户要求的</text><text x="205.00" y="219.51" font-size="11.00" class="sc-loraregular">“</text><text x="209.40 220.40 231.40 242.40" y="219.51" font-size="11.00" class="sc-notoserifcjksc">三重检查</text><text x="253.40" y="219.51" font-size="11.00" class="sc-loraregular">”</text><text x="257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24 466.24 477.24 488.24 499.24 510.24 521.24" y="219.51" font-size="11.00" class="sc-notoserifcjksc">中又发现了四个错误，其中包括模型凭空编造的一个并不</text><text x="139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00 271.00 282.00 293.00 304.00 315.00 326.00 337.00 348.00 359.00 370.00 381.00 392.00 403.00 414.00 425.00 436.00" y="235.13" font-size="11.00" class="sc-notoserifcjksc">存在的函数原语，以及一张阶段顺序有误的流水线调度示意图。</text><text x="139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00" y="279.34" font-size="11.00" class="sc-notoserifcjksc">模型报告某次训练运行</text><text x="249.00" y="279.34" font-size="11.00" class="sc-loraregular">“</text><text x="253.40 264.40 275.40" y="279.34" font-size="11.00" class="sc-notoserifcjksc">已在第</text><text x="289.29" y="279.34" font-size="11.00" class="sc-loraregular">[</text><text x="293.24 304.24 315.24" y="279.34" font-size="11.00" class="sc-notoserifcjksc">已隐去</text><text x="326.24" y="279.34" font-size="11.00" class="sc-loraregular">]</text><text x="333.08 344.08 355.08 366.08 377.08 388.08 399.08 410.08" y="279.34" font-size="11.00" class="sc-notoserifcjksc">步完成，达到目标</text><text x="423.98 428.23 434.67 440.50 446.46" y="279.34" font-size="11.00" class="sc-loraregular">token</text><text x="456.03 467.03" y="279.34" font-size="11.00" class="sc-notoserifcjksc">数的</text><text x="480.92 484.93 491.76 498.59 508.16" y="279.34" font-size="11.00" class="sc-loraregular">100%”</text><text x="512.00 523.00" y="279.34" font-size="11.00" class="sc-notoserifcjksc">。用</text><text x="139.00 150.00" y="294.96" font-size="11.00" class="sc-notoserifcjksc">户：</text><text x="161.00" y="294.96" font-size="11.00" class="sc-loraregular">“</text><text x="165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40" y="294.96" font-size="11.00" class="sc-notoserifcjksc">我认为训练并没有完成。</text><text x="286.40" y="294.96" font-size="11.00" class="sc-loraregular">”</text><text x="290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24 389.24 400.24 411.24 422.24 433.24 444.24 455.24 466.24 477.24 488.24 499.24 510.24 521.24" y="294.96" font-size="11.00" class="sc-notoserifcjksc">模型重新读取该指标后意识到，那是目标值，而不</text><text x="139.00 150.00 161.00 172.00 183.00 194.00 205.00 216.00 227.00 238.00 249.00 260.00 271.00 282.00 293.00 304.00 315.00 326.00 337.00 348.00 359.00 370.00 381.00 392.00 403.00 414.00 425.00 436.00 447.00 458.00" y="310.58" font-size="11.00" class="sc-notoserifcjksc">是已完成的进度；此外，对于一次已完成的运行而言，损失也过高。</text><text x="72.00" y="347.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="347.55" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 111.48 113.58 119.12" y="347.55" font-size="9.00" class="sc-lorabold">2.3.5.1.A]</text><text x="124.96 133.96 142.96 151.96 160.96 169.96 178.96 187.96 196.96 205.96 214.96 223.96 232.96 241.96 250.96 259.96 268.96 277.96 286.96 295.96 304.96 313.96" y="347.55" font-size="9.00" class="sc-notoserifcjkscbold">在单次教程撰写会话中由用户发现的事实性错误。</text><text x="322.96" y="347.55" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="334.32 339.34" y="347.55" font-size="9.00" class="sc-loraregular">38</text><text x="346.76 355.76 364.76 373.76 382.76 391.76 400.76 409.76 418.76 427.76 436.76 445.76 454.76 463.76 472.76 481.76 490.76 499.76 508.76 517.76 526.76" y="347.55" font-size="9.00" class="sc-notoserifcjksc">个轮次中共出现四个相互独立的错误，每个错误</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00" y="359.25" font-size="9.00" class="sc-notoserifcjksc">都是在用户提示重新推导之后才得到纠正；模型在被询问后能够得出正确答案，但在写下论断之前并未加以核实。</text><text x="72.00 77.86 80.43 86.59 89.15 95.09 97.65" y="406.04" font-size="11.00" class="sc-lorabold">2.3. "sc-robotomonoregular">amount of stuff anyway.</text><text x="93.00 98.40 103.80 109.20 114.60 120.00 125.40 130.80 136.20 141.60 147.01 152.41 157.81 163.21 168.61 174.01 179.41 184.81 190.22 195.62 201.02 206.42 211.82 217.22 222.62 228.02 233.42 238.82 244.22 249.62 255.02 260.42 265.83 271.23 276.63 282.03 287.43 292.83 298.23 303.63 309.04 314.44 319.84 325.24 330.64 336.04 341.44 346.84 352.24 357.64" y="316.66" font-size="9.00" class="sc-robotomonoregular">[…] adding a fake "Acknowledged" doesn't make turn</text><text x="368.44 373.84 379.24 384.64 390.04 395.45 400.85 406.25 411.65 417.05 422.45 427.85 433.25 438.66 444.06 449.46 454.86 460.26 465.66 471.06 476.46 481.86 487.26 492.67 498.07 503.47" y="316.66" font-size="9.00" class="sc-robotomonoregular">index mapping cleaner. The</text><text x="93.00 98.40 103.80 109.20 114.60 120.00 125.40 130.81 136.21 141.61 147.01 152.41 157.81 163.21 168.61 174.01 179.41 184.81 190.21 195.61 201.01 206.42 211.82 217.22 222.62 228.02 233.42 238.82 244.22 249.62 255.02 260.43 265.83 271.23 276.63 282.03 287.43 292.83 298.23 303.63 309.03 314.43 319.83 325.24 330.64 336.04 341.44 346.84 352.24 357.64 363.04 368.44 373.84 379.24 384.64 390.05 395.45 400.85 406.25 411.65 417.05 422.45 427.85 433.25" y="328.53" font-size="9.00" class="sc-robotomonoregular">user is right to push back. The real reason is probably simpler:</text><text x="93.00 98.40 103.80 109.20 114.60 120.00 125.40 130.80 136.20 141.60 147.00 152.40 157.81 163.21" y="352.27" font-size="9.00" class="sc-robotomonoregular">[…] Actually —</text><text x="379.25 384.65 390.05 395.45 400.85 406.25 411.65 417.05 422.45 427.85 433.25 438.65 444.06 449.46 454.86 460.26 465.66 471.06 476.46 481.86 487.26" y="352.27" font-size="9.00" class="sc-robotomonoregular">. You cannot send two</text><text x="93.00 98.40 103.80 109.20" y="364.14" font-size="9.00" class="sc-robotomonoregular" fill="#188038">user</text><text x="120.00 125.40 130.80 136.20 141.60 147.00 152.40 157.80 .18 274.78 281.38 287.98 294.58 301.18 307.78 314.38 320.98" y="125.10" font-size="11.00" class="sc-robotomonoregular" fill="#188038">summarize_chunk()</text><text x="330.49 341.49 352.49 363.49 374.49 385.49 396.49 407.49 418.49 429.49 440.49 451.49 462.49 473.49 484.49 495.49 506.49 517.49" y="125.10" font-size="11.00" class="sc-notoserifcjksc">能够按消息对干净地切分。但如果严格只</text><text x="82.50" y="140.72" font-size="11.00" class="sc-notoserifcjksc">看</text><text x="96.39 103.28 109.89" y="140.72" font-size="11.00" class="sc-loraregular">API</text><text x="82.50" y="207.21" font-size="11.00" class="sc-lorabold">[</text><text x="86.75" y="207.21" font-size="11.00" class="sc-notoserifcjkscbold">框</text><text x="100.64" y="207.21" font-size="11.00" class="sc-lorabold">2</text><text x="106.50 117.50 128.50" y="207.21" font-size="11.00" class="sc-notoserifcjkscbold">，例如</text><text x="142.40 153.40" y="207.21" font-size="11.00" class="sc-notoserifcjkscbold">助手</text><text x="164.40" y="207.21" font-size="11.00" class="sc-lorabold">]</text><text x="168.64" y="207.21" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50" y="556.82" font-size="11.00" class="sc-notoserifcjksc">你说得对，我关于缓存的解释有些牵强。真正的原因是：</text><text x="357.50 364.79 371.74 376.29 383.12 388.31 394.54 401.15 404.74" y="556.82" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="413.34" y="556.82" font-size="11.00" class="sc-notoserifcjkscbold">的</text><text x="427.23 437.67 443.59 448.92 454.26 460.02 466.07 471.99 477.32 480.22 487.56 494.53" y="556.82" font-size="11.00" class="sc-lorabold">Messages API</text><text x="501.68 512.68 523.68" y="556.82" font-size="11.00" class="sc-notoserifcjkscbold">要求严</text><text x="82.50 93.50 104.50 115.50" y="572.44" font-size="11.00" class="sc-notoserifcjkscbold">格交替。</text><text x="126.50 137.50 148.50 159.50 170.50" y="572.44" font-size="11.00" class="sc-notoserifcjksc">两条连续的</text><text x="184.39 190.99 197.59 204.19" y="572.44" font-size="11.00" class="sc-robotomonoregular" fill="#188038">user</text><text x="213.69 224.69" y="572.44" font-size="11.00" class="sc-notoserifcjksc">消息</text><text x="238.58" y="572.44" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="252.48 258.44 265.27" y="572.44" font-size="11.00" class="sc-loraregular">400</text><text x="274.99 285.99 296.99" y="572.44" font-size="11.00" class="sc-notoserifcjksc">错误。</text><text x="307.99 316.73 323.29 329.26 335.93 342.82" y="572.44" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="349.40 360.40 371.40 382.40 393.40 404.40 415.40 426.40" y="572.44" font-size="11.00" class="sc-notoserifcjksc">不强制这一点，但</text><text x="440.29 447.18 453.75 458.01 464.60 469.29 475.72 482.29 485.38" y="572.44" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="494.12 505.12 516.12" y="572.44" font-size="11.00" class="sc-notoserifcjksc">会。没</text><text x="82.50" y="588.06" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="96.39 102.99 109.59 116.19 122.79 129.39 135.99 142.59 149.19 155.79 162.39 168.99 175.59 182.19 188.79" y="588.06" font-size="11.00" class="sc-robotomonoregular" fill="#188038">"Acknowledged."</text><text x="198.30 209.30 220.30 231.30 242.30 253.30 264.30 275.30 286.30" y="588.06" font-size="11.00" class="sc-notoserifcjksc">占位的话，你会得到</text><text x="300.20 306.80 313.40 320.00 326.60 333.20 339.80 346.40 353.00 359.60 366.20 372.80 379.40 386.00 392.60 399.20 405.80 412.40 419.00 425.60 432.20" y="588.06" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[..., user_drain_msg,</text><text x="82.50 89.10 95.70 102.30 108.90 115.50 122.10 128.70 135.30 141.90 148.50 155.10 161.70 168.30 174.90 181.50 188.10 194.70 201.30 207.90 214.50 221.10 227.70 234.30" y="603.68" font-size="11.00" class="sc-robotomonoregular" fill="#188038">user_observation_prompt]</text><text x="243.82" y="603.68" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="257.71" y="603.68" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="271.60 278.20 284.80 291.40 298.00 304.60 311.20 317.80 324.40 331.00 337.60 344.20 350.80 357.40 364.00 370.60 377.20 383.80" y="603.68" font-size="11.00" class="sc-robotomonoregular" fill="#188038">anthropic∕claude-*</text><text x="393.32 404.32 415.32 426.32 437.32 448.32 459.32 470.32 481.32 492.32 503.32 514.32" y="603.68" font-size="11.00" class="sc-notoserifcjksc">上失败。由于该智能体通过</text><text x="82.50 85.49 88.76 93.02 98.98 101.97 104.96" y="619.30" font-size="11.00" class="sc-loraregular">litellm</text><text x="117.69 128.69 139.69 150.69 161.69 172.69 183.69 194.69 205.69 216.69 227.69 238.69 249.69 260.69 271.69 282.69 293.69 304.69 315.69 326.69 337.69 348.69 359.69 370.69 381.69 392.69 403.69 414.69 425.69" y="619.30" font-size="11.00" class="sc-notoserifcjksc">以与模型无关的方式运行，他们在所有地方都强制执行更严格的（</text><text x="436.69 443.57 450.15 454.41 461.00 465.68 472.12 478.69 481.78" y="619.30" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="490.52 501.52 512.52" y="619.30" font-size="11.00" class="sc-notoserifcjksc">的）约</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50" y="634.92" font-size="11.00" class="sc-notoserifcjksc">束。所以我最初说的</text><text x="181.50" y="634.92" font-size="11.00" class="sc-loraregular">“</text><text x="185.90 196.90 207.90 218.90 229.90 240.90 251.90 262.90" y="634.92" font-size="11.00" class="sc-notoserifcjksc">你说得对，不需要</text><text x="273.90" y="634.92" font-size="11.00" class="sc-loraregular">”</text><text x="354.24 361.13 367.71 371.96 378.55 383.24 389.67 396.24 399.33" y="634.92" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="408.08 419.08 430.08 441.08 452.08 463.08 474.08" y="634.92" font-size="11.00" class="sc-notoserifcjksc">来说是需要的。</text><text x="82.50 93.50 104.50" y="703.09" font-
