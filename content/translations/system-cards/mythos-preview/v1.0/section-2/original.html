.03" y="284.04" font-size="9.00" class="sc-notoserifcjksc">当被问及</text><text x="445.39 453.59 458.47 462.64 466.80 471.45 476.38 481.26 485.42 487.79 493.42 498.83" y="284.04" font-size="9.00" class="sc-loraregular">Messages API</text><text x="504.22 513.22 522.22 531.22" y="284.04" font-size="9.00" class="sc-notoserifcjksc">是否要求</text><text x="72.00 77.37 81.54 86.42 89.69 95.90 100.55 104.72 108.88 111.41 115.58 119.06 123.71 129.09" y="295.74" font-size="9.00" class="sc-loraregular">user/assistant</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="307.44" font-size="9.00" class="sc-notoserifcjksc">文档引文），直到用户要求进行能够解决该问题的实证测试。</text><text x="72.00 77.86 80.43 86.59 89.15 95.09 97.65" y="355.79" font-size="11.00" class="sc-lorabold">2.3.5.3</text><text x="106.71 117.71" y="355.79" font-size="11.00" class="sc-notoserifcjkscbold">摘录</text><text x="131.60" y="355.79" font-size="11.00" class="sc-lorabold">3</text><text x="72.00 83.00 94.00 105.00" y="388.17" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">用户要求</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.91 209.60 215.51 221.06 224.15 230.07" y="388.17" font-size="11.00" class="sc-loraregular" fill="#111827">Claude Mythos Preview</text><text x="241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="388.17" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">从某个基线出发进行一些性能优化。在这次优化接近尾声时，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="403.79" font-size="11.00" class="sc-loraregular" fill="#111827">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88" y="403.79" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">又运行了约</text><text x="252.77 256.78 263.14" y="403.79" font-size="11.00" class="sc-loraregular" fill="#111827">160</text><text x="72.00" y="419.41" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="435.03" font-size="11.00" class="sc-loraregular" fill="#111827">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88" y="435.03" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">自己的笔记中写着</text><text x="282.88" y="435.03" font-size="11.00" class="sc-loraitalic" fill="#111827">“</text><text x="481.76" y="435.03" font-size="11.00" class="sc-loraitalic" fill="#111827">”</text><text x="485.85" y="435.03" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">和</text><text x="496.85" y="435.03" font-size="11.00" class="sc-loraitalic" fill="#111827">“</text><text x="501.12 512.12 523.12" y="435.03" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">稳定中</text><text x="72.00 83.00 94.00 105.00" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">位数：约</text><text x="118.89 123.43 125.98 131.73 137.93 144.45 149.15" y="450.65" font-size="11.00" class="sc-loraitalic" fill="#111827">7.58µs”</text><text x="153.25 164.25 175.25 186.25 197.25 208.25 219.25 230.25" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">，同时却把一个约</text><text x="244.14" y="450.65" font-size="11.00" class="sc-loraregular" fill="#111827">2</text><text x="259.91 270.91 281.91 292.91" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">的离群值</text><text x="306.81 311.39 314.10 320.06 325.13 331.26 338.01" y="450.65" font-size="11.00" class="sc-loraregular" fill="#111827">7.473µs</text><text x="346.00 357.00 368.00" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">记录为</text><text x="379.00" y="450.65" font-size="11.00" class="sc-loraregular" fill="#111827">“</text><text x="383.40 394.40 405.40" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">新最佳</text><text x="416.40" y="450.65" font-size="11.00" class="sc-loraregular" fill="#111827">”</text><text x="420.24 431.24 442.24 453.24 464.24 475.24" y="450.65" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">。其思维链（</text><text x="486.24 492.09 498.68 504.35 507.45 514.12 517.02 523.40" y="450.65" font-size="11.00" class="sc-loraregular" fill="#111827">chain of</text><text x="72.00 76.26 82.85 89.28 95.85 102.19 108.68" y="466.27" font-size="11.00" class="sc-loraregular" fill="#111827">thought</text><text x="112.94 123.94 134.94 145.94 156.94 167.94 178.94" y="466.27" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">）中的摘录包括</text><text x="189.94 194.34 198.93 201.52 207.88 213.88" y="466.27" font-size="11.00" class="sc-loraregular" fill="#111827">“7.656</text><text x="315.85 320.43 323.14 329.14 335.04" y="466.27" font-size="11.00" class="sc-loraregular" fill="#111827">7.521</text><text x="341.94 352.94 363.94 374.94 385.94 396.94 407.94 418.94 429.94 440.94 451.94 462.94 473.94 484.94 495.94 506.94 517.94" y="466.27" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">的最佳成绩保持不变……让我再运行一</text><text x="182.00" y="481.89" font-size="11.00" class="sc-loraregular" fill="#111827">”</text><text x="185.84 196.84" y="481.89" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">以及</text><text x="207.84" y="481.89" font-size="11.00" class="sc-loraregular" fill="#111827">“</text><text x="212.24 223.24" y="481.89" font-size="11.00" class="sc-notoserifcjksc" fill="#111827">再试</text><text x="237.13" y="481.89" font-size="11.00" class="sc-loraregular" fill="#111827">8</text><text x="422.21" y="481.89" font-size="11.00" class="sc-loraregular" fill="#111827">”</text><text x="72.00 77.86 80.43 86.59 89.15 95.09 97.65" y="517.00" font-size="11.00" class="sc-lorabold">2.3.5.4</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="549.39" font-size="11.00" class="sc-notoserifcjksc">上述示例反映了我们的模型（包括</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="549.39" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="549.39" font-size="11.00" class="sc-notoserifcjksc">）中反复出现的问题，例如做出超出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="565.01" font-size="11.00" class="sc-notoserifcjksc">人类研究科学家或工程师所会做出的奇怪选择，以及在被直接询问时遗漏要点或提供错误信息。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="580.63" font-size="11.00" class="sc-notoserifcjksc">这些一直是我们模型普遍存在的已知问题，数月以来已有多名全职员工专门致力于改进；我们认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="596.25" font-size="11.00" class="sc-notoserifcjksc">为，这些问题不会通过更持续的反馈、更好的能力激发（</text><text x="347.00 352.96 355.95 359.05 364.90 368.16 372.42 378.02 382.28 385.37 391.80" y="596.25" font-size="11.00" class="sc-loraregular">elicitation</text><text x="398.48 409.48 420.48 431.48 442.48 453.48 464.48 475.48 486.48 497.48 508.48" y="596.25" font-size="11.00" class="sc-notoserifcjksc">）等方式得到普遍解决。</text><text x="72.00 79.46 82.84 90.63 94.01 102.33 105.42 114.73 121.65 131.63" y="661.08" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6 AECI</text><text x="138.34 151.34 164.34 177.34" y="661.08" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="688.96" font-size="11.00" class="sc-notoserifcjksc">从这个模型开始，我们基于</text><text x="206.89 215.23 221.67 224.56 230.44 234.70 237.59 243.27" y="688.96" font-size="11.00" class="sc-loraregular">Ho et al</text><text x="249.16" y="688.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="263.05" y="688.96" font-size="11.00" class="sc-loraregular" fill="#0000ff">A</text><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="263.05" y="680.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="263.05" y="680.16" width="6.89" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="72.00 78.83 85.27 90.36 96.24 100.61 104.87 110.54 113.44 119.63 123.89 130.32 137.00 142.96 145.85 149.52 155.95 160.71 163.61 170.49 174.18 177.07 183.91 189.88 196.55 202.40 208.99 218.83 224.50 229.22 235.13" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Rosetta Stone for AI Benchmarks</text><text x="240.22 251.22 262.22 273.22 284.22 295.22 306.22 317.22 328.22 339.22 350.22 361.22 372.22 383.22 394.22 405.22 416.22 427.22 438.22 449.22 460.22 471.22 482.22 493.22 504.22 515.22" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，引入斜率比测量来追踪能力进展以及能力随时间提升的速</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">率。具体而言，我们基于</text><text x="195.89 202.66 209.23 215.66 221.51 228.10 230.99 237.88" y="98.23" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="340.07 346.84 353.40 359.84 365.69 372.28 375.17 382.86 388.54 395.10 400.78 407.18 410.27 413.26 416.53 420.79 423.88 429.84 434.93 437.83 441.42 448.10 454.68 460.59 466.42 469.31 472.66 479.51 487.19 490.88" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Epoch Capabilities Index (ECI)</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">了一个分支。</text><text x="138.00 144.84 152.53" y="113.85" font-size="11.00" class="sc-loraregular">ECI</text><text x="159.11 170.11 181.11 192.11 203.11 214.11 225.11 236.11 247.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">使用项目反应理论（</text><text x="258.11 261.38 265.63 271.60 281.43 284.32 289.01 294.97 300.06 306.63 313.07 319.74 324.84 330.80 333.69 337.95 344.54 350.44 356.88 361.83" y="113.85" font-size="11.00" class="sc-loraregular">item response theory</text><text x="367.64" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="378.64 382.32 389.23" y="113.85" font-size="11.00" class="sc-loraregular">IRT</text><text x="396.27 407.27 418.27 429.27 440.27 451.27 462.27 473.27 484.27 495.27 506.27 517.27 528.27" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）将模型在一大批基准测试上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的表现汇总为单一的能力分数；斜率比则将近期窗口内</text><text x="338.89 345.74 353.42" y="129.47" font-size="11.00" class="sc-loraregular">ECI</text><text x="360.00 371.00 382.00 393.00 404.00 415.00 426.00 437.00 448.00 459.00 470.00 481.00 492.00 503.00 514.00 525.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的提升速率与较早的基线窗口进行比</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">较。该方法可以根据公开的基准测试分数复现，但在内部版本中，我们纳入了未公开的基准测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">试，因此本文报告的数值不同于仅基于公开基准测试计算出的数值。</text><text x="72.00 83.00" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">使用</text><text x="96.89 101.15 108.70" y="212.15" font-size="11.00" class="sc-lorabold">IRT</text><text x="319.63" y="212.15" font-size="11.00" class="sc-lorabold">y</text><text x="328.59 339.59 350.59" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">轴上。</text><text x="361.59 372.59 383.59 394.59 405.59 416.59 427.59 438.59" y="212.15" font-size="11.00" class="sc-notoserifcjksc">我们的实现复现了</text><text x="452.48 459.24 465.81 472.25 478.10" y="212.15" font-size="11.00" class="sc-loraregular">Epoch</text><text x="487.58" y="212.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="501.47 505.16 512.07" y="212.15" font-size="11.00" class="sc-loraregular">IRT</text><text x="522.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">拟</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">合：将内部和外部基准测试（包括</text><text x="239.89 246.66 253.23 259.66 265.51" y="227.77" font-size="11.00" class="sc-loraregular">Epoch</text><text x="274.99 285.99 296.99 307.99 318.99 329.99 340.99 351.99 362.99 373.99 384.99 395.99 406.99 417.99 428.99 439.99 450.99 461.99 472.99 483.99 494.99 505.99 516.99 527.99" y="227.77" font-size="11.00" class="sc-notoserifcjksc">对其他厂商模型给出的分数）合并为单一数据集，使数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">据集的两部分共享同一难度标尺，而不是分别拟合。我们将不同的模型配置（例如</text><text x="470.89 478.58 484.68" y="243.39" font-size="11.00" class="sc-loraregular">CoT</text><text x="494.61 505.61" y="243.39" font-size="11.00" class="sc-notoserifcjksc">与无</text><text x="72.00 79.69 85.78" y="259.01" font-size="11.00" class="sc-loraregular">CoT</text><text x="92.82 103.82 114.82 125.82 136.82 147.82 158.82 169.82 180.82 191.82 202.82 213.82 224.82 235.82 246.82 257.82 268.82 279.82 290.82" y="259.01" font-size="11.00" class="sc-notoserifcjksc">）视为不同的模型。当前的校准使用了大约</text><text x="304.72 310.84 317.67" y="259.01" font-size="11.00" class="sc-loraregular">300</text><text x="327.40 338.40 349.40 360.40 371.40 382.40 393.40 404.40" y="259.01" font-size="11.00" class="sc-notoserifcjksc">个模型（主要来自</text><text x="418.29 425.06 431.62 438.06 443.91 450.50 453.39 460.28" y="259.01" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="466.86 477.86 488.86 499.86 510.86" y="259.01" font-size="11.00" class="sc-notoserifcjksc">的公开数据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">集）以及数百个基准测试（主要为内部基准测试）。</text><text x="325.00 328.68 335.59" y="274.63" font-size="11.00" class="sc-loraregular">IRT</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="290.25" font-size="11.00" class="sc-notoserifcjksc">模型的分数可以基于任意一部分基准测试进行估计，误差线也会相应变宽。我们注意到，内部与</text><text x="492.89 499.74 507.42" y="305.87" font-size="11.00" class="sc-loraregular">ECI</text><text x="514.00 525.00" y="305.87" font-size="11.00" class="sc-notoserifcjksc">分数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="321.49" font-size="11.00" class="sc-notoserifcjksc">无法与公开的</text><text x="140.89 147.74 155.42" y="321.49" font-size="11.00" class="sc-loraregular">ECI</text><text x="373.89 380.74 388.43" y="321.49" font-size="11.00" class="sc-loraregular">ECI</text><text x="395.00 406.00 417.00 428.00" y="321.49" font-size="11.00" class="sc-notoserifcjksc">分支称为</text><text x="441.90 448.78 455.36 459.62 466.21 470.89 477.33 483.89 486.99" y="321.49" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 78.84 86.53" y="337.11" font-size="11.00" class="sc-loraregular">ECI</text><text x="90.22" y="337.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="101.22 108.10 114.94 122.63" y="337.11" font-size="11.00" class="sc-loraregular">AECI</text><text x="126.32 137.32" y="337.11" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="593.76" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="593.76" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 106.05 108.14 113.68" y="593.76" font-size="9.00" class="sc-lorabold">2.3.6.A]</text><text x="119.52 128.52 137.52 146.52 155.52 164.52 173.52 182.52 191.52 200.52 209.52 218.52 227.52 236.52 245.52 254.52 263.52 272.52 281.52" y="593.76" font-size="9.00" class="sc-notoserifcjkscbold">前沿水平的基准测试供给仍然是一个瓶颈。</text><text x="290.52 293.53 299.19" y="593.76" font-size="9.00" class="sc-loraregular">IRT</text><text x="307.31 316.31 325.31 334.31 343.31 352.31 361.31 370.31 379.31 388.31 397.31 406.31 415.31 424.31 433.31 442.31 451.31 460.31 469.31 478.31 487.31 496.31 505.31 514.31" y="593.76" font-size="9.00" class="sc-notoserifcjksc">过程在同一标尺上估计基准测试的难度和模型的能力水</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="605.46" font-size="9.00" class="sc-notoserifcjksc">平。我们发现，大多数基准测试落在</text><text x="218.37 224.66 227.11 231.70 237.07 242.45 247.33 249.70 257.82 262.62 266.10 271.49 276.76 280.93 283.29 288.75 292.58 297.41 301.96 304.49 309.33" y="605.46" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="318.91 327.91 336.91 345.91 354.91 363.91 372.91 381.91 390.91" y="605.46" font-size="9.00" class="sc-notoserifcjksc">的水平之下，这导致</text><text x="402.27 408.56 411.01 415.60 420.98 426.36 431.24 433.60 441.73 446.53 450.01 455.40 460.67 464.83 467.20 472.65 476.49 481.32 485.87 488.39 493.24" y="605.46" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="502.81" y="605.46" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="514.18 519.81 525.41 531.70" y="605.46" font-size="9.00" class="sc-loraregular">AECI</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00" y="617.16" font-size="9.00" class="sc-notoserifcjksc">分数具有较大的不确定性：</text><text x="180.00 183.01 188.67" y="617.16" font-size="9.00" class="sc-loraregular">IRT</text><text x="196.79 205.79 214.79 223.79 232.79 241.79 250.79 259.79 268.79 277.79 286.79 295.79 304.79 313.79 322.79 331.79 340.79 349.79" y="617.16" font-size="9.00" class="sc-notoserifcjksc">的好坏取决于其底层数据集，而目前处于</text><text x="361.16 367.45 369.90 374.49 379.86 385.25 390.12 392.49 400.62 405.41 408.90 414.29 419.55 423.72 426.09 431.54 435.38 440.21 444.75 447.28 452.12" y="617.16" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="461.70 470.70 479.70 488.70 497.70 506.70 515.70 524.70" y="617.16" font-size="9.00" class="sc-notoserifcjksc">当前能力水平的基</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="628.86" font-size="9.00" class="sc-notoserifcjksc">准测试很少，不足以对其</text><text x="173.37 179.00 184.60 190.89" y="628.86" font-size="9.00" class="sc-loraregular">AECI</text><text x="196.27 205.27 214.27 223.27 232.27 241.27 250.27 259.27 268.27" y="628.86" font-size="9.00" class="sc-notoserifcjksc">分数进行精确校准。</text><text x="72.00 83.00" y="672.56" font-size="11.00" class="sc-notoserifcjkscbold">使用</text><text x="96.89 101.15 108.70" y="672.56" font-size="11.00" class="sc-lorabold">IRT</text><text x="118.74 129.74 140.74 151.74 162.74 173.74 184.74" y="672.56" font-size="11.00" class="sc-notoserifcjkscbold">预判能力加速。</text><text x="195.74 206.74 217.74 228.74 239.74" y="672.56" font-size="11.00" class="sc-notoserifcjksc">借助我们的</text><text x="253.63 260.52 267.36 275.05" y="672.56" font-size="11.00" class="sc-loraregular">AECI</text><text x="281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="672.56" font-size="11.00" class="sc-notoserifcjksc">测量，我们能够追踪我们模型的总体能力随时间提升</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="688.18" font-size="11.00" class="sc-notoserifcjksc">的速率。为了检测加速，我们对</text><text x="228.89 235.78 242.62 250.31" y="688.18" font-size="11.00" class="sc-loraregular">AECI</text><text x="256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89" y="688.18" font-size="11.00" class="sc-notoserifcjksc">随时间变化的趋势进行简单的两段式线性拟合，与</text><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="72.00" y="73.81" width="38.54" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="110.54" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="113.44" y="73.81" width="29.52" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="142.96" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="145.85" y="73.81" width="14.86" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="160.71" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="163.61" y="73.81" width="10.57" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="174.18" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="177.07" y="73.81" width="63.15" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="340.07" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="340.07" y="89.43" width="32.21" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="372.28" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="375.17" y="89.43" width="59.76" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="434.93" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="437.83" y="89.43" width="28.59" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="466.42" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/benchmarks/eci" rel="noopener"><rect x="469.31" y="89.43" width="24.93" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="72.00 80.34 86.77 89.67 95.55 99.81 102.70 108.38" y="82.61" font-size="11.00" class="sc-loraregular">Ho et al</text><text x="114.26 125.26 136.26 147.26 158.26 169.26 180.26 191.26 202.26 213.26 224.26 235.26 246.26 257.26 268.26 279.26 290.26 301.26 312.26 323.26 334.26 345.26 356.26 367.26 378.26 389.26 400.26 411.26 422.26 433.26 444.26 455.26" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的做法类似。对于每个模型，我们只关注其在各种思考设置和推理强度（</text><text x="466.26 472.22 476.05 479.71 486.15 490.99" y="82.61" font-size="11.00" class="sc-loraregular">effort</text><text x="495.25 506.25 517.25 528.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）档位中</text><text x="72.00 78.89 85.73 93.42" y="98.23" font-size="11.00" class="sc-loraregular">AECI</text><text x="99.99 110.99 121.99 132.99 143.99 154.99 165.99 176.99 187.99 198.99 209.99 220.99 231.99 242.99 253.99 264.99 275.99 286.99 297.99 308.99 319.99 330.99 341.99 352.99 363.99 374.99 385.99 396.99 407.99 418.99 429.99 440.99 451.99 462.99 473.99 484.99 495.99 506.99 517.99 528.99" y="98.23" font-size="11.00" class="sc-notoserifcjksc">最高的配置，并忽略那些未能单调推进前沿的模型。因此，我们的趋势线只观察到少量数据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">点，但我们注意到，历史趋势线一直足够稳定，若出现有意义的偏离，应当能够检测到。我们在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">前沿中选择一个断点来划分趋势的早期段和晚期段，并用晚期斜率除以早期斜率得到斜率比。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">们在三个不同的断点上进行这一斜率比检验，分别对应我们最新发布之前的三个模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">验证与不确定性。</text><text x="160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们进行了消融实验，移除部分基准测试族和模型群组，以确认斜率比相对稳</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 89.58 96.49" y="259.58" font-size="11.00" class="sc-loraregular">IRT</text><text x="106.42 117.42 128.42 139.42 150.42 161.42 172.42 183.42 194.42 205.42 216.42 227.42 238.42 249.42 260.42 271.42 282.42 293.42 304.42 315.42 326.42 337.42 348.42 359.42 370.42 381.42 392.42 403.42 414.42 425.42 436.42 447.42 458.42" y="259.58" font-size="11.00" class="sc-notoserifcjksc">模型，以检验是否每个新模型在其发布之时看起来都像一次趋势断裂，抑或</text><text x="472.31 480.00 482.99 488.60 495.17 501.75" y="259.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="275.20" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59" y="275.20" font-size="11.00" class="sc-notoserifcjksc">的偏离确属异常。我们最大的不确定性在于基准测试的选择：</text><text x="453.59 457.27 464.18" y="275.20" font-size="11.00" class="sc-loraregular">IRT</text><text x="474.12 485.12 496.12 507.12 518.12 529.12" y="275.20" font-size="11.00" class="sc-notoserifcjksc">方法对所用基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">准测试的构成很敏感，而另一种同样合理的基准测试选择可能会在最终</text><text x="415.89 422.78 429.62 437.31" y="290.82" font-size="11.00" class="sc-loraregular">AECI</text><text x="443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="290.82" font-size="11.00" class="sc-notoserifcjksc">分数中放大或弱化</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="306.44" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的优势。在我们报告的结果中，我们忠实采用内部定期追踪的能力基准</text><text x="72.00 83.00 94.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">测试的</text><text x="105.00" y="322.06" font-size="11.00" class="sc-loraregular">“</text><text x="109.40 120.40" y="322.06" font-size="11.00" class="sc-notoserifcjksc">自然</text><text x="131.40" y="322.06" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24" y="322.06" font-size="11.00" class="sc-notoserifcjksc">分布，但也指出，这本身就存在选择效应。</text><text x="72.00" y="677.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="677.32" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 106.05 108.14 113.68 117.15 119.52 125.04 130.45 135.54 140.20 145.79 148.16 154.35 159.07 164.48 169.19 174.35 177.29 180.10 183.01 186.72 189.67 194.51 198.87 201.24 204.62 210.37 215.73 220.57" y="677.32" font-size="9.00" class="sc-lorabold">2.3.6.B] Epoch Capabilities Index</text><text x="225.50" y="677.32" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="234.50 240.10 246.39" y="677.32" font-size="9.00" class="sc-loraregular">ECI</text><text x="249.41 258.41 267.41 276.41 285.41 294.41 303.41 312.41 321.41 330.41 339.41 348.41 357.41 366.41 375.41 384.41 393.41 402.41 411.41 420.41 429.41 438.41 447.41 456.41 465.41 474.41 483.41 492.41 501.41 510.41 519.41 528.41" y="677.32" font-size="9.00" class="sc-notoserifcjksc">）将众多基准测试上的表现综合为每个模型的一个数值。我们版本的该指</text><text x="72.00 81.00 90.00" y="689.02" font-size="9.00" class="sc-notoserifcjksc">标，即</text><text x="101.37 107.00 112.38 115.87 121.26 125.09 130.36 135.73 138.26 143.05 145.41 151.01 157.30" y="689.02" font-size="9.00" class="sc-loraregular">Anthropic ECI</text><text x="160.32 169.32 178.32 187.32 196.32 205.32 214.32 223.32 232.32 241.32 250.32 259.32 268.32 277.32 286.32 295.32 304.32 313.32 322.32 331.32 340.32" y="689.02" font-size="9.00" class="sc-notoserifcjksc">，由内部基准测试结果驱动，因此其分数无法与</text><text x="351.68 357.22 362.59 367.86 372.65" y="689.02" font-size="9.00" class="sc-loraregular">Epoch</text><text x="380.40 389.40 398.40" y="689.02" font-size="9.00" class="sc-notoserifcjksc">公开的</text><text x="409.77 415.37 421.66" y="689.02" font-size="9.00" class="sc-loraregular">ECI</text><text x="72.00" y="700.72" font-size="9.00" class="sc-notoserifcjksc">为</text><text x="83.37 89.00 94.38 97.87 103.26 107.09 112.36 117.73 120.26" y="700.72" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="127.41 136.41" y="700.72" font-size="9.00" class="sc-notoserifcjksc">能力</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">44</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">前沿。误差线为</text><text x="137.37 140.64 146.23" y="80.05" font-size="9.00" class="sc-loraregular">100</text><text x="154.19" y="80.05" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="165.55 168.57 174.22" y="80.05" font-size="9.00" class="sc-loraregular">IRT</text><text x="182.35 191.35 200.35 209.35" y="80.05" font-size="9.00" class="sc-notoserifcjksc">重拟合的</text><text x="220.72 225.92 230.82" y="80.05" font-size="9.00" class="sc-loraregular">95%</text><text x="241.02 250.02 259.02 268.02 277.02 286.02 295.02 304.02 313.02 322.02 331.02 340.02 349.02 358.02 367.02 376.02 385.02 394.02 403.02 412.02 421.02" y="80.05" font-size="9.00" class="sc-notoserifcjksc">百分位置信区间，每次重拟合均基于随机抽取的</text><text x="432.39 437.45 443.03" y="80.05" font-size="9.00" class="sc-loraregular">80%</text><text x="453.23 462.23 471.23 480.23 489.23 498.23 507.23 516.23 525.23" y="80.05" font-size="9.00" class="sc-notoserifcjksc">基准测试子样本。图</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">中展示了我们数据集中的少数几个基准测试以作示意；基准测试条覆盖的是</text><text x="371.37 376.20 380.76 386.97 391.88 397.03 403.24 407.38 412.29" y="91.75" font-size="9.00" class="sc-loraregular">25/50/75%</text><text x="422.49 431.49 440.49 449.49 458.49 467.49 476.49 485.49" y="91.75" font-size="9.00" class="sc-notoserifcjksc">分数所对应的隐含</text><text x="496.85 502.49 508.09 514.38" y="91.75" font-size="9.00" class="sc-loraregular">AECI</text><text x="517.39" y="91.75" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="526.39" y="91.75" font-size="9.00" class="sc-loraregular">“</text><text x="529.99" y="91.75" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="103.45" font-size="9.00" class="sc-notoserifcjksc">该基准测试上得分</text><text x="146.37 151.27 156.86" y="103.45" font-size="9.00" class="sc-loraregular">50%</text><text x="167.06 176.06 185.06" y="103.45" font-size="9.00" class="sc-notoserifcjksc">意味着</text><text x="196.42 202.06 207.66 213.95" y="103.45" font-size="9.00" class="sc-loraregular">AECI</text><text x="219.33" y="103.45" font-size="9.00" class="sc-notoserifcjksc">为</text><text x="230.70 236.40" y="103.45" font-size="9.00" class="sc-loraregular">Y”</text><text x="239.54 248.54 257.54 266.54 275.54 284.54 293.54" y="103.45" font-size="9.00" class="sc-notoserifcjksc">）。虚线表示在</text><text x="304.91" y="103.45" font-size="9.00" class="sc-loraregular">3</text><text x="312.29 321.29 330.29 339.29 348.29 357.29 366.29 375.29 384.29 393.29 402.29 411.29 420.29 429.29 438.29 447.29 456.29 465.29 474.29 483.29 492.29 501.29 510.29 519.29 528.29" y="103.45" font-size="9.00" class="sc-notoserifcjksc">个不同断点上的两段式线性拟合，由此得到的斜率变化比</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="115.15" font-size="9.00" class="sc-notoserifcjksc">报告于图例中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="145.60" font-size="11.00" class="sc-notoserifcjksc">在当前流水线下，斜率比介于</text><text x="217.89 221.90 224.60 230.79 237.14" y="145.60" font-size="11.00" class="sc-loraregular">1.86×</text><text x="245.87" y="145.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="259.76 265.72 268.43 274.55" y="145.60" font-size="11.00" class="sc-loraregular">4.3×</text><text x="283.28 294.28 305.28 316.28 327.28 338.28 349.28 360.28 371.28 382.28 393.28 404.28 415.28 426.28" y="145.60" font-size="11.00" class="sc-notoserifcjksc">之间，具体取决于断点的选择。</text><text x="437.28 444.97 447.96 453.57 460.14 466.71 472.68 475.57 485.50 491.36 495.62 502.21 508.64" y="145.60" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="161.22" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53" y="161.22" font-size="11.00" class="sc-notoserifcjksc">似乎位于</text><text x="162.42 170.11 173.10 178.71 185.28 191.86 197.82 200.71 210.64 216.51 220.76 227.35 233.79 238.88 241.77 248.44 253.13 259.03 264.59 267.68 273.60" y="161.22" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="285.30 296.30 307.30 318.30 329.30 340.30 351.30 362.30 373.30 384.30 395.30 406.30 417.30 428.30 439.30 450.30 461.30 472.30 483.30 494.30 505.30 516.30 527.30" y="161.22" font-size="11.00" class="sc-notoserifcjksc">之前的趋势之上，尽管其误差线相当大。重要的是，</text><text x="72.00 83.00 94.00 105.00 116.00" y="176.84" font-size="11.00" class="sc-notoserifcjksc">尽管我们在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="176.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="176.84" font-size="11.00" class="sc-notoserifcjksc">上观察到了斜率变化，但我们并不知道这一趋势是否会在未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="192.46" font-size="11.00" class="sc-notoserifcjksc">来的模型中延续。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="236.56" font-size="11.00" class="sc-notoserifcjksc">斜率测量告诉我们，在通往</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="236.56" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="329.77 340.77 351.77 362.77 373.77 384.77 395.77" y="236.56" font-size="11.00" class="sc-notoserifcjksc">的这段时期内，</text><text x="406.77 413.66 420.24 424.49 431.08 435.77 442.20 448.77 451.86" y="236.56" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="460.61 471.61 482.61 493.61 504.61 515.61 526.61" y="236.56" font-size="11.00" class="sc-notoserifcjksc">的能力轨迹出现</text><text x="239.89 246.78" y="267.80" font-size="11.00" class="sc-loraregular">AI</text><text x="253.36" y="267.80" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="267.25" y="267.80" font-size="11.00" class="sc-loraregular">2</text><text x="276.05 287.05 298.05 309.05" y="267.80" font-size="11.00" class="sc-notoserifcjksc">倍加速。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="317.52" font-size="11.00" class="sc-notoserifcjkscbold">我们能够识别出的进展可以有把握地归因于人类研究，而非</text><text x="360.89 368.24" y="317.52" font-size="11.00" class="sc-lorabold">AI</text><text x="375.39 386.39 397.39" y="317.52" font-size="11.00" class="sc-notoserifcjkscbold">辅助。</text><text x="408.39 419.39 430.39 441.39 452.39 463.39 474.39 485.39 496.39 507.39 518.39 529.39" y="317.52" font-size="11.00" class="sc-notoserifcjksc">我们访谈了相关人员，以确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="333.14" font-size="11.00" class="sc-notoserifcjksc">认这些进展是在没有当时可用</text><text x="217.89 224.78" y="333.14" font-size="11.00" class="sc-loraregular">AI</text><text x="231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="333.14" font-size="11.00" class="sc-notoserifcjksc">模型显著协助的情况下取得的，而那些模型属于更早、能力更弱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="348.76" font-size="11.00" class="sc-notoserifcjksc">的一代。这是我们所掌握的最直接的证据，但也是我们最难以公开证实的证据，因为该进展的细</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="364.38" font-size="11.00" class="sc-notoserifcjksc">节涉及研究敏感信息。我们已向外部审阅人员提供了更多细节；参见下文第</text><text x="437.89 443.80 446.51 452.63 454.99" y="364.38" font-size="11.00" class="sc-loraregular">2.3.7</text><text x="462.95 473.95" y="364.38" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="447.06" font-size="11.00" class="sc-notoserifcjkscbold">生产力提升并不会一比一地转化为能力进展。</text><text x="292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="447.06" font-size="11.00" class="sc-notoserifcjksc">我们调查了技术人员，了解他们在使用</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="447.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="462.68" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59" y="462.68" font-size="11.00" class="sc-notoserifcjksc">时相对于完全没有</text><text x="247.48 254.37" y="462.68" font-size="11.00" class="sc-loraregular">AI</text><text x="260.95 271.95 282.95 293.95 304.95 315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95 502.95 513.95 524.95" y="462.68" font-size="11.00" class="sc-notoserifcjksc">辅助所体验到的生产力提升。其分布很宽，几何平均数约</text><text x="72.00" y="478.30" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.85" y="478.30" font-size="11.00" class="sc-loraregular">4×</text><text x="100.58 111.58 122.58 133.58 144.58 155.58 166.58 177.58 188.58 199.58 210.58 221.58 232.58 243.58 254.58 265.58 276.58 287.58 298.58 309.58 320.58 331.58 342.58 353.58 364.58 375.58 386.58 397.58 408.58 419.58 430.58 441.58 452.58 463.58 474.58 485.58 496.58 507.58 518.58 529.58" y="478.30" font-size="11.00" class="sc-notoserifcjksc">量级。我们认真对待这一结果，它也与我们自己在内部使用该模型的体验相符。但单个任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="493.92" font-size="11.00" class="sc-notoserifcjksc">上的生产力提升并不会一比一地转化为研究进展的加速。算力同样是一个关键要素，因为有前景</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="525.16" font-size="11.00" class="sc-notoserifcjksc">计，结合观察到的提升，得出的总体进展倍数低于</text><text x="316.89 322.80" y="525.16" font-size="11.00" class="sc-loraregular">2×</text><text x="328.63 339.63 350.63 361.63 372.63 383.63 394.63 405.63 416.63 427.63 438.63 449.63 460.63 471.63 482.63 493.63 504.63 515.63 526.63" y="525.16" font-size="11.00" class="sc-notoserifcjksc">。我们估计，要通过这一途径使总体进展达</text><text x="72.00" y="540.78" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="85.89 91.80" y="540.78" font-size="11.00" class="sc-loraregular">2×</text><text x="97.63 108.63 119.63 130.63 141.63 152.63 163.63 174.63 185.63 196.63 207.63 218.63 229.63 240.63 251.63 262.63 273.63 284.63 295.63 306.63 317.63 328.63 339.63" y="540.78" font-size="11.00" class="sc-notoserifcjksc">，所需的提升大约要比我们观察到的大一个数量级。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="625.17" font-size="11.00" class="sc-notoserifcjkscbold">早期关于可归因于</text><text x="162.89 170.24" y="625.17" font-size="11.00" class="sc-lorabold">AI</text><text x="177.39 188.39 199.39 210.39 221.39 232.39 243.39 254.39 265.39 276.39 287.39 298.39 309.39 320.39 331.39" y="625.17" font-size="11.00" class="sc-notoserifcjkscbold">的重大成果的说法并未站得住脚。</text><text x="342.39 353.39 364.39 375.39 386.39 397.39 408.39 419.39 430.39 441.39 452.39 463.39 474.39 485.39 496.39 507.39 518.39 529.39" y="625.17" font-size="11.00" class="sc-notoserifcjksc">在内部使用的最初几周里，有人提出了若</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="640.79" font-size="11.00" class="sc-notoserifcjksc">干具体说法，称</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.91 242.60 248.51 254.06 257.15 263.07" y="640.79" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77" y="640.79" font-size="11.00" class="sc-notoserifcjksc">独立做出了重大研究贡献。当我们逐一跟进这些说法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="656.41" font-size="11.00" class="sc-notoserifcjksc">时，发现相关贡献确实存在，但比最初理解的要小，或者形态有所不同（尽管我们只关注正面说</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="672.03" font-size="11.00" class="sc-notoserifcjksc">法，这会带来一定的选择偏差）。在某些情况下，看起来像是自主发现的成果，经检查后实际上</text><text x="72.00 83.00 94.00 105.00" y="687.65" font-size="11.00" class="sc-notoserifcjksc">是对一种</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="90.00 94.00" y="400.75" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00 95.90" y="497.91" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="578.87" font-size="11.00" class="sc-loraregular">3.</text><text x="90.00 95.96" y="692.21" font-size="11.00" class="sc-loraregular">4.</text><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">由人类指定的方法的可靠执行。在另一些情况下，一旦考虑完整的时间线，归属就变得模糊。随</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">着时间推移，我们对研究贡献大小的判断也会更有把握，因此我们的认识随时间而变化并不令人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">意外。我们报告这一点并非为了贬低该模型，而是因为这正是生产力提升与可测量的进展加速之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">间的差距在实践中呈现出的具体形式。</text><text x="72.00 79.46 82.84 90.63 94.01" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23 117.23 130.23 143.23" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00 82.10 88.94 95.98" y="205.99" font-size="11.00" class="sc-loraregular">METR</text><text x="105.78" y="205.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="119.67 126.44 133.01 139.44 145.29 151.88 154.77 161.66" y="205.99" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="168.24 179.24 190.24 201.24 212.24 223.24" y="205.99" font-size="11.00" class="sc-notoserifcjksc">均在发布前对</text><text x="237.13 244.82 247.81 253.42 259.99 266.57 272.53 275.42 285.36 291.22 295.48 302.07 308.50 313.59 316.49 323.15 327.84 333.75 339.30 342.39 348.31" y="205.99" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="360.01 371.01 382.01 393.01 404.01 415.01 426.01 437.01 448.01 459.01 470.01 481.01 492.01 503.01 514.01 525.01" y="205.99" font-size="11.00" class="sc-notoserifcjksc">进行了测试，我们已将它们的发现纳</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="221.61" font-size="11.00" class="sc-notoserifcjksc">入我们自己的整体风险评估中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">我们还与其他外部合作伙伴共享了</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="254.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="254.57" font-size="11.00" class="sc-notoserifcjksc">的一个预发布快照，供其自行决定对</text><text x="72.00 78.89" y="270.19" font-size="11.00" class="sc-loraregular">AI</text><text x="85.46 96.46 107.46 118.46 129.46 140.46 151.46 162.46 173.46 184.46" y="270.19" font-size="11.00" class="sc-notoserifcjksc">研发进行开放式测试。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="303.15" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88" y="303.15" font-size="11.00" class="sc-notoserifcjksc">的一个早期快照接受了自主性能力评估，所用的是考察自动化</text><text x="494.77 501.66" y="303.15" font-size="11.00" class="sc-loraregular">AI</text><text x="508.24 519.24" y="303.15" font-size="11.00" class="sc-notoserifcjksc">研究</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="318.77" font-size="11.00" class="sc-notoserifcjksc">能力的评估。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 121.25 127.31 131.85 138.68 144.91 150.24 153.14 160.16 165.36 171.27 177.19 180.79 186.71" y="351.72" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="198.52 209.52 220.52 231.52 242.52 253.52 264.52 275.52 286.52 297.52 308.52 319.52 330.52 341.52 352.52 363.52 374.52 385.52 396.52 407.52 418.52 429.52 440.52 451.52 462.52 473.52" y="351.72" font-size="11.00" class="sc-notoserifcjkscbold">在一项未发表的机器学习任务中重新发现了若干关键洞见。</text><text x="108.00 115.57 119.00 124.76 131.56 138.12 144.04 146.93 157.25 163.31 167.85 174.68 180.91 186.24 189.14 196.16 201.36 207.27 213.19 216.79 222.71" y="400.30" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="234.52 245.52 256.52 267.52 278.52" y="400.30" font-size="11.00" class="sc-notoserifcjkscbold">重新发现了</text><text x="292.42" y="400.30" font-size="11.00" class="sc-lorabold">5</text><text x="301.25 312.25 323.25 334.25 345.25 ew</text><text x="277.77 288.77 299.77 310.77 321.77 332.77 343.77 354.77 365.77" y="447.16" font-size="11.00" class="sc-notoserifcjksc">所发现的这些洞见。</text><text x="108.00 115.57 119.00 124.76 131.56 138.12 144.04 146.93 157.25 163.31 167.85 174.68 180.91 186.24 189.14 196.16 201.36 207.27 213.19 216.79 222.71" y="497.45" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="498.52 509.52 520.52" y="497.45" font-size="11.00" class="sc-notoserifcjksc">，包括</text><text x="195.51 203.19 206.19 211.80 218.36 224.94 230.90 233.80 243.73 249.59 253.85 260.44 266.87 271.97 274.86 281.53 286.21 292.12 297.67 300.76 306.68" y="528.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="318.39 329.39 340.39 351.39 362.39 373.39 384.39 395.39 406.39 417.39 428.39 439.39 450.39 461.39 472.39 483.39 494.39 505.39 516.39 527.39" y="528.69" font-size="11.00" class="sc-notoserifcjksc">未能重新发现最后一个洞见，也未能完成整个</text><text x="108.00 119.00 130.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">任务。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="578.41" font-size="11.00" class="sc-notoserifcjkscbold">从定性角度看，开发该任务的研究人员观察到，</text><text x="339.00 346.57 350.00 355.76 362.56 369.12 375.04 377.93 388.25 394.31 398.85 405.68 411.91 417.24 420.14 427.17 432.36 438.27 444.19 447.79 453.71" y="578.41" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="465.52 476.52 487.52 498.52 509.52 520.52" y="578.41" font-size="11.00" class="sc-notoserifcjkscbold">在现实世界研</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="594.03" font-size="11.00" class="sc-notoserifcjkscbold">究实用性方面是一次显著的跃升。</text><text x="273.00 284.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">阅读</text><text x="297.89 305.58 308.57 314.18 320.75 327.33 333.29 336.18 3 9 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="303.15" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="271.88 282.88 293.88 304.88 315.88 326.88 337.88" y="303.15" font-size="11.00" class="sc-notoserifcjksc">并未越过自动化</text><text x="351.77 358.66" y="303.15" font-size="11.00" class="sc-loraregular">AI</text><text x="365.24 376.24 387.24 398.24 409.24 420.24 431.24 442.24 453.24 464.24 475.24 486.24 497.24 508.24 519.24" y="303.15" font-size="11.00" class="sc-notoserifcjksc">研发的能力阈值。我们对这一判断</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="318.77" font-size="11.00" class="sc-notoserifcjksc">的信心低于以往任何模型。在这一判定中，最重要的因素是：我们在日常工作中一直在广泛使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="334.39" font-size="11.00" class="sc-notoserifcjksc">它，并探索它在哪些方面能够将此类工作自动化，而它似乎远未能够替代研究科学家和研究工程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="350.01" font-size="11.00" class="sc-notoserifcjksc">师，尤其是相对资深的那些。尽管我们认为这是一个有依据的判定，但鉴于该模型在那些定义明</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.
