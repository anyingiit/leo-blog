<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00 81.18 84.99 95.25 104.99" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53 134.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00 80.04 83.68 88.74 92.08 101.05 109.58" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1 RSP</text><text x="121.42 135.42 149.42 163.42 177.42 191.42" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">风险评估流程</text><text x="205.42" y="123.13" font-size="8.40" class="sc-poppinssemibold">2</text><text x="72.00 83.00 94.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="182.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="193.00 199.83 205.79 210.89 217.45 223.89 230.57 235.66 238.75 245.15 248.14 254.11 257.00 263.24 269.07 274.74 277.73 280.82 287.50 293.58 296.48 303.03 309.47 312.46 315.55 321.35" y="154.36" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="327.16" y="154.36" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="338.16 345.06 351.30" y="154.36" font-size="11.00" class="sc-loraregular">RSP</text><text x="357.97 368.97 379.97 390.97 401.97 412.97 423.97 434.97 445.97 456.97" y="154.36" font-size="11.00" class="sc-notoserifcjksc">）是我们用于管理先进</text><text x="470.86 477.75" y="154.36" font-size="11.00" class="sc-loraregular">AI</text><text x="484.32 495.32 506.32 517.32 528.32" y="154.36" font-size="11.00" class="sc-notoserifcjksc">系统所带来</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">灾难性风险的自愿性框架。</text><text x="204.00" y="166.31" font-size="6.60" class="sc-loraregular">3</text><text x="207.68 218.68 229.68 240.68 251.68 262.68 273.68 284.68 295.68 306.68 317.68 328.68 339.68 350.68 361.68 372.68 383.68 394.68 405.68" y="169.98" font-size="11.00" class="sc-notoserifcjksc">它规定了我们如何识别和评估风险、如何就</text><text x="419.57 426.46" y="169.98" font-size="11.00" class="sc-loraregular">AI</text><text x="433.03 444.03 455.03 466.03 477.03 488.03 499.03 510.03 521.03" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的开发和部署作出决</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">策，以及从整个世界的角度来看，我们如何力求确保我们模型的收益超过其成本。</text><text x="72.00 79.46 82.84 87.55 90.93" y="237.67" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.1</text><text x="98.73 111.73 124.73 137.73" y="237.67" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">背景：从</text><text x="153.82 162.15 170.07 177.98 181.07 188.53 191.91" y="237.67" font-size="13.00" class="sc-poppinssemibold" fill="#666666">RSP 2.0</text><text x="203.40" y="237.67" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">到</text><text x="219.50 227.83 235.75 243.65 246.75 254.53 257.91" y="237.67" font-size="13.00" class="sc-poppinssemibold" fill="#666666">RSP 3.0</text><text x="72.00 83.00 94.00" y="271.55" font-size="11.00" class="sc-notoserifcjksc">我们于</text><text x="107.89 113.80 120.55 126.46" y="271.55" font-size="11.00" class="sc-loraregular">2026</text><text x="135.71" y="271.55" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="149.61" y="271.55" font-size="11.00" class="sc-loraregular">2</text><text x="158.40 169.40 180.40 191.40" y="271.55" font-size="11.00" class="sc-notoserifcjksc">月采用了</text><text x="205.30 212.21 218.44 225.11 228.00 233.56 239.68 242.23" y="271.55" font-size="11.00" class="sc-loraregular">RSP v3.0</text><text x="251.95 262.95 273.95 284.95 295.95" y="271.55" font-size="11.00" class="sc-notoserifcjksc">框架（并于</text><text x="309.84" y="271.55" font-size="11.00" class="sc-loraregular">4</text><text x="318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70" y="271.55" font-size="11.00" class="sc-notoserifcjksc">月进行了一次规模小得多的更新，升级为</text><text x="72.00 77.56 83.68 86.39" y="287.17" font-size="11.00" class="sc-loraregular">v3.1</text><text x="90.39 101.39 112.39 123.39 134.39 145.39 156.39 167.39" y="287.17" font-size="11.00" class="sc-notoserifcjksc">），这是我们在新</text><text x="181.29 188.19 194.43" y="287.17" font-size="11.00" class="sc-loraregular">RSP</text><text x="203.99 214.99 225.99 236.99 247.99 258.99 269.99 280.99 291.99 302.99 313.99" y="287.17" font-size="11.00" class="sc-notoserifcjksc">下发布的第一份系统卡（</text><text x="324.99 331.17 336.98 342.07 346.33 352.29 362.13 365.02 372.71 378.38 383.07" y="287.17" font-size="11.00" class="sc-loraregular">System Card</text><text x="389.65 400.65 411.65 422.65 433.65 444.65 455.65 466.65 477.65 488.65 499.65 510.65 521.65" y="287.17" font-size="11.00" class="sc-notoserifcjksc">）。由于我们讨论评估的方式</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="302.79" font-size="11.00" class="sc-notoserifcjksc">发生了（相对细微的）变化，本节开头先为熟悉我们早期系统卡的读者提供简要说明。</text><text x="72.00 83.00 94.00 105.00" y="348.32" font-size="11.00" class="sc-notoserifcjksc">根据我们</text><text x="118.89 125.80 132.04" y="348.32" font-size="11.00" class="sc-loraregular">RSP</text><text x="141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60" y="348.32" font-size="11.00" class="sc-notoserifcjksc">的旧版本，我们需要针对给定的威胁模型，判定每个模型是否需要与特定</text><text x="493.60 498.00 504.88" y="348.32" font-size="11.00" class="sc-loraregular">“AI</text><text x="511.46 522.46" y="348.32" font-size="11.00" class="sc-notoserifcjksc">安全</text><text x="72.00 83.00" y="363.94" font-size="11.00" class="sc-notoserifcjksc">等级</text><text x="94.00" y="363.94" font-size="11.00" class="sc-loraregular">”</text><text x="97.84" y="363.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="108.84 115.73 119.41 122.30 128.54 134.22 137.88 143.76 148.04 153.85 156.74 163.10 169.01 174.51 180.47" y="363.94" font-size="11.00" class="sc-loraregular">AI Safety Level</text><text x="183.46" y="363.94" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="194.46 201.35 207.59" y="363.94" font-size="11.00" class="sc-loraregular">ASL</text><text x="213.94 224.94 235.94 246.94 257.94 268.94 279.94 290.94 301.94 312.94 323.94 334.94 345.94 356.94 367.94 378.94 389.94 400.94 411.94 422.94 433.94 444.94 455.94 466.94 477.94 488.94 499.94 510.94 521.94" y="363.94" font-size="11.00" class="sc-notoserifcjksc">）相关联的风险缓解措施。因此，我们着重强调评估与二元能力阈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="379.56" font-size="11.00" class="sc-notoserifcjksc">值之间的关系，例如某项评估能否作为针对特定阈值的</text><text x="336.00" y="379.56" font-size="11.00" class="sc-loraregular">“</text><text x="340.40 351.40 362.40" y="379.56" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="373.40" y="379.56" font-size="11.00" class="sc-loraregular">”</text><text x="377.24" y="379.56" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="388.24" y="379.56" font-size="11.00" class="sc-loraregular">“</text><text x="392.64 403.64 414.64" y="379.56" font-size="11.00" class="sc-notoserifcjksc">确认性</text><text x="425.64" y="379.56" font-size="11.00" class="sc-loraregular">”</text><text x="429.48 440.48 451.48" y="379.56" font-size="11.00" class="sc-notoserifcjksc">评估。</text><text x="72.00 83.00" y="441.28" font-size="11.00" class="sc-notoserifcjksc">根据</text><text x="96.89 103.80 110.04 116.70 119.60 125.15 131.28 133.82" y="441.28" font-size="11.00" class="sc-loraregular">RSP v3.0</text><text x="140.65 151.65 162.65" y="441.28" font-size="11.00" class="sc-notoserifcjksc">（以及</text><text x="176.54 182.10 188.23 190.93" y="441.28" font-size="11.00" class="sc-loraregular">v3.1</text><text x="194.94 205.94" y="441.28" font-size="11.00" class="sc-notoserifcjksc">）：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="469.47" font-size="11.00" class="sc-notoserifcjksc">我们仍需说明是否已跨越第</text><text x="242.89" y="469.47" font-size="11.00" class="sc-loraregular">1</text><text x="249.79 260.79 271.79 282.79 293.79 304.79 315.79 326.79" y="469.47" font-size="11.00" class="sc-notoserifcjksc">节中列出的阈值；</text><text x="108.00 119.00 130.00 141.00 152.00" y="501.86" font-size="11.00" class="sc-notoserifcjksc">我们不再用</text><text x="163.00 167.40 174.29" y="501.86" font-size="11.00" class="sc-loraregular">“AI</text><text x="180.86 191.86 202.86 213.86" y="501.86" font-size="11.00" class="sc-notoserifcjksc">安全等级</text><text x="224.86" y="501.86" font-size="11.00" class="sc-loraregular">”</text><text x="228.70 239.70 250.70 261.70 272.70 283.70 294.70 305.70 316.70 327.70 338.70 349.70 360.70 371.70 382.70 393.70 404.70 415.70 426.70 437.70 448.70 459.70 470.70 481.70 492.70 503.70 514.70 525.70" y="501.86" font-size="11.00" class="sc-notoserifcjksc">一词指代这些阈值，但仍用该词来指代若干组现行风险缓解措施</text><text x="108.00 119.00 130.00" y="517.48" font-size="11.00" class="sc-notoserifcjksc">（参见</text><text x="143.89 150.80 157.04 163.70 166.60 172.15 178.28 180.82" y="517.48" font-size="11.00" class="sc-loraregular">RSP v3.0</text><text x="190.54 201.54 212.54 223.54 234.54" y="517.48" font-size="11.00" class="sc-notoserifcjksc">政策的附录</text><text x="248.44" y="517.48" font-size="11.00" class="sc-loraregular">B</text><text x="255.28 266.28" y="517.48" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="72.00" y="598.07" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 87.85 97.85 107.85 117.85 127.85 137.85 147.85 157.85 167.85 177.85 187.85 197.85 207.85" y="601.40" font-size="10.00" class="sc-notoserifcjksc">在以往的系统卡中，本节标题为</text><text x="217.85" y="601.40" font-size="10.00" class="sc-loraregular">“</text><text x="221.85 231.85 241.85 251.85 261.85 271.85" y="601.40" font-size="10.00" class="sc-notoserifcjksc">发布决策流程</text><text x="281.85" y="601.40" font-size="10.00" class="sc-loraregular">”</text><text x="285.34 295.34 305.34 315.34 325.34 335.34 345.34 355.34 365.34 375.34 385.34 395.34 405.34 415.34 425.34 435.34 445.34 455.34 465.34 475.34 485.34 495.34 505.34 515.34 525.34" y="601.40" font-size="10.00" class="sc-notoserifcjksc">。而本次模型并未发布。我们也认为新标题更为恰当，因</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="615.60" font-size="10.00" class="sc-notoserifcjksc">为我们的风险评估并非只对单一发布决策重要（例如，它也为是否以及如何继续进行中的模型训练的决策</text><text x="72.00 82.00 92.00 102.00 112.00 122.00" y="629.80" font-size="10.00" class="sc-notoserifcjksc">提供依据）。</text><text x="72.00" y="640.67" font-size="6.00" class="sc-loraregular">3</text><text x="77.97 87.97" y="644.00" font-size="10.00" class="sc-notoserifcjksc">我们</text><text x="100.60 106.88 112.55" y="644.00" font-size="10.00" class="sc-loraregular">RSP</text><text x="121.24 131.24 141.24 151.24" y="644.00" font-size="10.00" class="sc-notoserifcjksc">中所用的</text><text x="161.24" y="644.00" font-size="10.00" class="sc-loraregular">“</text><text x="165.24 175.24 185.24 195.24 205.24" y="644.00" font-size="10.00" class="sc-notoserifcjksc">灾难性风险</text><text x="215.24" y="644.00" font-size="10.00" class="sc-loraregular">”</text><text x="218.73 228.73 238.73 248.73" y="644.00" font-size="10.00" class="sc-notoserifcjksc">泛指先进</text><text x="261.36 267.62" y="644.00" font-size="10.00" class="sc-loraregular">AI</text><text x="273.60 283.60 293.60 303.60 313.60 323.60 333.60 343.60 353.60 363.60 373.60 383.60 393.60 403.60 413.60 423.60 433.60 443.60 453.60 463.60 473.60 483.60 493.60 503.60 513.60 523.60" y="644.00" font-size="10.00" class="sc-notoserifcjksc">可能造成的最严重危害的风险，例如生存性威胁或全球系统</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00" y="658.20" font-size="10.00" class="sc-notoserifcjksc">的根本性失稳。就监管合规而言，灾难性风险或系统性风险采用我们前沿合规框架（</text><text x="442.00 447.38 451.64 457.49 463.47 467.34 470.15 475.57 479.90 482.53 489.52 495.37 504.31 510.28 513.00 515.81 520.97 527.04 532.31" y="658.20" font-size="10.00" class="sc-loraregular">Frontier Compliance</text><text x="72.00 77.38 81.64 86.80 95.74 101.12 109.01 114.86 119.15" y="672.40" font-size="10.00" class="sc-loraregular">Framework</text><text x="124.52 134.52 144.52 154.52 164.52 174.52" y="672.40" font-size="10.00" class="sc-notoserifcjksc">）中的定义：</text><text x="184.52" y="672.40" font-size="10.00" class="sc-loraregular">“</text><text x="188.52 198.52 208.52 218.52 228.52 238.52 248.52 258.52 268.52 278.52 288.52 298.52 308.52 318.52 328.52 338.52 348.52 358.52 368.52 378.52 388.52 398.52 408.52 418.52 428.52 438.52 448.52 458.52 468.52 478.52 488.52 498.52 508.52 518.52 528.52" y="672.40" font-size="10.00" class="sc-notoserifcjksc">在任一给定时间点，由最先进（即处于技术前沿的）模型造成大规模危害的可预</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00" y="686.60" font-size="10.00" class="sc-notoserifcjksc">见且重大的风险，包括但不限于单一事件导致</text><text x="274.63 279.93 285.38" y="686.60" font-size="10.00" class="sc-loraregular">&gt;50</text><text x="346.85 350.49" y="686.60" font-size="10.00" class="sc-loraregular">10</text><text x="449.33" y="686.60" font-size="10.00" class="sc-loraregular">”</text><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="105.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="105.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="116.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="116.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="127.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="127.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="138.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="138.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="149.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="149.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="160.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="160.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="171.00" y="145.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="171.00" y="145.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们提高了在给出总体风险评估方面的要求，而不是仅仅关注哪些阈值已被跨越以及相关</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的风险缓解措施是否到位。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们定期发布风险报告（</text><text x="229.00 235.91 239.00 244.09 250.00 252.89 259.72 265.69 272.25 278.69 283.53" y="131.19" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="287.78 298.78 309.78 320.78 331.78 342.78 353.78 364.78 375.78 386.78 397.78 408.78 419.78 430.78 441.78 452.78 463.78 474.78 485.78 496.78 507.78 518.78 529.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">），呈现我们对模型风险的总体评估（我们的第一份</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">风险报告可在</text><text x="174.00 185.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此处</text><text x="196.00 207.00 218.00 229.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">获取）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="175.57" font-size="11.00" class="sc-notoserifcjksc">因此，我们系统卡中的</text><text x="184.89 191.80 198.04" y="175.57" font-size="11.00" class="sc-loraregular">RSP</text><text x="207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60" y="175.57" font-size="11.00" class="sc-notoserifcjksc">内容将不再那么强调</text><text x="306.60" y="175.57" font-size="11.00" class="sc-loraregular">“</text><text x="311.00 322.00 333.00" y="175.57" font-size="11.00" class="sc-notoserifcjksc">确认性</text><text x="344.00" y="175.57" font-size="11.00" class="sc-loraregular">”</text><text x="347.84" y="175.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.84" y="175.57" font-size="11.00" class="sc-loraregular">“</text><text x="363.24 374.24 385.24" y="175.57" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="396.24" y="175.57" font-size="11.00" class="sc-loraregular">”</text><text x="400.07 411.07 422.07 433.07 444.07 455.07 466.07 477.07 488.07 499.07 510.07" y="175.57" font-size="11.00" class="sc-notoserifcjksc">之类的术语。取而代之的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="191.19" font-size="11.00" class="sc-notoserifcjksc">是，如下文所述，我们将呈现关于模型能力和倾向的证据、我们对哪些阈值已被跨越的总体判</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="206.81" font-size="11.00" class="sc-notoserifcjksc">断，并说明这些发现如何影响我们最近一份风险报告中的风险评估。</text><text x="72.00 79.46 82.84 87.55 90.93" y="275.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.2</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48 192.48 205.48 218.48 231.48 244.48" y="275.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险报告及风险评估的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="302.95" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="129.89 136.80 143.04" y="302.95" font-size="11.00" class="sc-loraregular">RSP</text><text x="149.70 160.70 171.70 182.70 193.70 204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70 523.70" y="302.95" font-size="11.00" class="sc-notoserifcjksc">，我们会定期发布全面的风险报告，阐述我们模型的安全状况。风险报告阐明了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="318.57" font-size="11.00" class="sc-notoserifcjksc">我们对模型能力、威胁模型和风险缓解措施如何相互结合的分析，从而对我们模型的总体风险水</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="334.19" font-size="11.00" class="sc-notoserifcjksc">平作出评估。风险报告涵盖发布时我们的全部模型，并对我们的风险缓解措施进行了详尽讨论。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="349.81" font-size="11.00" class="sc-notoserifcjksc">我们不一定在每次发布模型时都发布一份新的风险报告。不过，每次重大模型发布我们都会发布</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="365.43" font-size="11.00" class="sc-notoserifcjksc">一份系统卡。并且根据</text><text x="184.89 191.80 198.04" y="365.43" font-size="11.00" class="sc-loraregular">RSP</text><text x="204.70 215.70 226.70 237.70 248.70 259.70 270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70" y="365.43" font-size="11.00" class="sc-notoserifcjksc">，如果该模型比上一份风险报告中讨论的模型</text><text x="424.70" y="365.43" font-size="11.00" class="sc-loraregular">“</text><text x="429.10 440.10 451.10 462.10 473.10 484.10" y="365.43" font-size="11.00" class="sc-notoserifcjksc">能力显著更强</text><text x="495.10" y="365.43" font-size="11.00" class="sc-loraregular">”</text><text x="498.94 509.94 520.94" y="365.43" font-size="11.00" class="sc-notoserifcjksc">，我们</text><text x="72.00 83.00 94.00" y="381.05" font-size="11.00" class="sc-notoserifcjksc">就必须</text><text x="105.00" y="381.05" font-size="11.00" class="sc-loraregular">“</text><text x="109.40 120.40 131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40 516.40 527.40" y="381.05" font-size="11.00" class="sc-notoserifcjksc">（在我们的系统卡或其他地方）发布一份讨论，说明该模型的能力和倾向如何影响或改变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">风险报告中的分析</text><text x="160.00" y="396.67" font-size="11.00" class="sc-loraregular">”</text><text x="163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="396.67" font-size="11.00" class="sc-notoserifcjksc">。简而言之：风险报告讨论在我们全部模型和风险缓解措施条件下的总体风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="412.29" font-size="11.00" class="sc-notoserifcjksc">水平；系统卡则讨论某个特定的新模型，以及它如何改变（或不改变）我们的风险评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="513.45" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估流程始于能力评估，其目的是针对我们的灾难性风险威胁模型系统地评估模型的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="529.07" font-size="11.00" class="sc-notoserifcjksc">能力。一般而言，我们会评估多个模型快照，并根据生产候选发布模型的能力和训练期间观察到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="544.69" font-size="11.00" class="sc-notoserifcjksc">的趋势作出最终判定。在整个过程中，我们从多个来源收集证据，包括自动化评估、能力提升</text><text x="72.00" y="560.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.57 96.13 99.13 102.22 106.07" y="560.31" font-size="11.00" class="sc-loraregular">uplift</text><text x="110.32 121.32 132.32 143.32 154.32 165.32 176.32 187.32 198.32 209.32 220.32 231.32 242.32 253.32" y="560.31" font-size="11.00" class="sc-notoserifcjksc">）试验、第三方专家红队测试（</text><text x="264.32 269.01 274.92 281.50 284.39 288.65 294.59 300.26 310.10 313.19 319.86" y="560.31" font-size="11.00" class="sc-loraregular">red teaming</text><text x="325.95 336.95 347.95 358.95 369.95 380.95 391.95 402.95" y="560.31" font-size="11.00" class="sc-notoserifcjksc">）和第三方评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="642.99" font-size="11.00" class="sc-notoserifcjksc">对于风险报告更新，我们通常遵循与风险报告相同的内部流程。在我们的领域专家记录了关于模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="658.61" font-size="11.00" class="sc-notoserifcjksc">型能力的发现和分析之后，我们会征求内部反馈。随后，这些材料会提交给负责任扩展官</text><text x="72.00" y="674.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="222.41 233.41 244.41 255.41 266.41 277.41 288.41 299.41 310.41 321.41 332.41 343.41 354.41 365.41 376.41 387.41 398.41 409.41 420.41 431.41 442.41 453.41 464.41 475.41 486.41 497.41 508.41 519.41" y="674.23" font-size="11.00" class="sc-notoserifcjksc">），由其最终判定模型的能力和倾向对最近一份风险报告的分析</text><text x="72.00 83.00 94.00 105.00 116.00" y="689.85" font-size="11.00" class="sc-notoserifcjksc">有何影响。</text><a href="https://www-cdn.anthropic.com/e670587677525f28df69b59e5fb4c22cc5461a17.pdf" rel="noopener"><rect x="174.00" y="138.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/e670587677525f28df69b59e5fb4c22cc5461a17.pdf" rel="noopener"><rect x="174.00" y="138.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/e670587677525f28df69b59e5fb4c22cc5461a17.pdf" rel="noopener"><rect x="185.00" y="138.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/e670587677525f28df69b59e5fb4c22cc5461a17.pdf" rel="noopener"><rect x="185.00" y="138.01" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在某些情况下，我们可能会判定，尽管模型超过了我们</text><text x="338.89 345.80 352.04" y="98.80" font-size="11.00" class="sc-loraregular">RSP</text><text x="361.60" y="98.80" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="375.49" y="98.80" font-size="11.00" class="sc-loraregular">1</text><text x="382.39 393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39" y="98.80" font-size="11.00" class="sc-notoserifcjksc">节中的某项能力阈值或使用阈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">值，但我们已实施了将风险保持在低水平所需的风险缓解措施。在这种情况下，我们可能不会过</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">多详述关于是否已跨越该阈值的分析，因为这一问题在我们的总体风险评估中所起的关键支撑作</text><text x="72.00 83.00 94.00 105.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">用较小。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="191.76" font-size="11.00" class="sc-notoserifcjksc">本报告后续各节提供了所有领域的详细结果，并特别关注那些对我们总体风险评估影响最大的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="207.38" font-size="11.00" class="sc-notoserifcjksc">估。对于每个威胁模型，我们还分析了新模型如何影响我们最近一份风险报告中提出的风险评</text><text x="72.00 83.00" y="223.00" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00 79.46 82.84 87.55 90.93" y="271.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.3</text><text x="101.81 114.81 127.81 140.81 153.81 166.81 179.81 192.81 205.81" y="271.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究发现与结论摘要</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="304.96" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88" y="304.96" font-size="11.00" class="sc-notoserifcjksc">的能力显著强于</text><text x="274.77 282.46 285.45 291.07 297.63 304.21 310.17 313.07 321.80 328.37 334.93 340.03 342.92 348.88 351.48" y="304.96" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="320.58" font-size="11.00" class="sc-notoserifcjksc">论的能力最强的模型。尽管能力有所提升，我们的总体结论是，灾难性风险仍然很低。这一判定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="336.20" font-size="11.00" class="sc-notoserifcjksc">涉及主观判断。该模型展现出很高的能力水平，并使我们许多最具体、客观评分的评估达到饱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="351.82" font-size="11.00" class="sc-notoserifcjksc">和，留给我们的是涉及更根本不确定性的方法，例如考察性能趋势以判断是否出现加速（噪声很</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="367.44" font-size="11.00" class="sc-notoserifcjksc">大且是回顾性的），以及收集内部用户关于模型优势与不足的报告（本质上是主观的，且未必可</text><text x="72.00 83.00 94.00" y="383.06" font-size="11.00" class="sc-notoserifcjksc">靠）。</text><text x="72.00 77.86 80.43 84.89 87.46 93.61 96.18" y="465.87" font-size="11.00" class="sc-lorabold">2.1.3.1</text><text x="103.54 114.54 125.54 136.54 147.54 158.54 169.54" y="465.87" font-size="11.00" class="sc-notoserifcjkscbold">关于自主性风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="499.26" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="499.26" font-size="11.00" class="sc-loraitalic">1</text><text x="155.79 166.79 177.79 188.79 199.79 210.79 221.79" y="499.26" font-size="11.00" class="sc-notoserifcjksc">：早期未对齐（</text><text x="232.79 242.42 245.99 250.69 256.72 259.84 263.40 269.10 275.86 285.50 290.75 297.51" y="499.26" font-size="11.00" class="sc-loraitalic">misalignment</text><text x="301.51 312.51 323.51 334.51 345.51 356.51 367.51 378.51 389.51 400.51 411.51 422.51 433.51 444.51" y="499.26" font-size="11.00" class="sc-notoserifcjksc">）风险。该威胁模型涉及这样的</text><text x="458.41 465.29" y="499.26" font-size="11.00" class="sc-loraregular">AI</text><text x="471.87 482.87 493.87 504.87 515.87 526.87" y="499.26" font-size="11.00" class="sc-notoserifcjksc">系统：它们被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="514.88" font-size="11.00" class="sc-notoserifcjksc">高度依赖，拥有对敏感资产的广泛访问权限，并具备中等程度的自主、目标导向运作能力和隐蔽</text><text x="192.51 199.39" y="530.50" font-size="11.00" class="sc-loraregular">AI</text><text x="205.97 216.97 227.97 238.97 249.97 260.97 271.97 282.97 293.97 304.97 315.97 326.97 337.97 348.97 359.97 370.97 381.97 392.97 403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97 491.97 502.97 513.97 524.97" y="530.50" font-size="11.00" class="sc-notoserifcjksc">系统有可能（如果被引导朝向这一目标，无论是有意还是无意）采取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="546.12" font-size="11.00" class="sc-notoserifcjksc">一些行动，导致日后发生全球性灾难的几率不可逆转地大幅升高。</text><text x="391.00" y="542.45" font-size="6.60" class="sc-loraregular">4</text><text x="72.00" y="649.47" font-size="6.00" class="sc-loraregular">4</text><text x="77.88 87.88 97.88 107.88" y="652.80" font-size="10.00" class="sc-notoserifcjksc">请注意：</text><text x="108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00 188.00 198.00" y="665.60" font-size="10.00" class="sc-notoserifcjksc">该阈值对应于我们现行</text><text x="208.00 218.00 228.00 238.00 248.00 258.00 268.00" y="665.60" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="278.00 288.00" y="665.60" font-size="10.00" class="sc-notoserifcjksc">中的</text><text x="298.00" y="665.60" font-size="10.00" class="sc-loraregular">“</text><text x="302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00" y="665.60" font-size="10.00" class="sc-notoserifcjksc">高风险蓄意破坏机会</text><text x="392.00" y="665.60" font-size="10.00" class="sc-loraregular">”</text><text x="395.49 405.49 415.49 425.49 435.49" y="665.60" font-size="10.00" class="sc-notoserifcjksc">威胁模型。</text><text x="108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00" y="691.20" font-size="10.00" class="sc-notoserifcjksc">该阈值不同于我们</text><text x="190.63 196.00 198.46" y="691.20" font-size="10.00" class="sc-loraregular">2.2</text><text x="206.46" y="691.20" font-size="10.00" class="sc-notoserifcjksc">版</text><text x="216.46 226.46 236.46 246.46 256.46 266.46 276.46" y="691.20" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="286.46 296.46" y="691.20" font-size="10.00" class="sc-notoserifcjksc">中的</text><text x="306.46 310.46 316.72 320.07 322.70 328.98 335.93 343.38 348.27 353.69" y="691.20" font-size="10.00" class="sc-loraregular">“AI R&amp;D-4”</text><text x="357.18 367.18 377.18 387.18 397.18 407.18 417.18 427.18 437.18 447.18 457.18 467.18 477.18 487.18 497.18 507.18 517.18 527.18" y="691.20" font-size="10.00" class="sc-notoserifcjksc">阈值。两者在精神上相似，但该阈值经过</text><text x="108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00 188.00 198.00 208.00 218.00 228.00 238.00 248.00 258.00 268.00 278.00 288.00 298.00 308.00 318.00 328.00 338.00 348.00 358.00 368.00 378.00 388.00 398.00 408.00 418.00 428.00 438.00" y="705.40" font-size="10.00" class="sc-notoserifcjksc">修订，以更好地契合关键威胁模型，并且我们认为它会涵盖若干过去的模型。</text><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="208.00" y="657.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="208.00" y="657.60" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="218.00" y="657.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="218.00" y="657.60" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="228.00" y="657.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="228.00" y="657.60" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="238.00" y="657.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="238.00" y="657.60" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="248.00" y="657.60" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="248.00" y="657.60" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" pic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="246.46" y="683.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="256.46" y="683.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="256.46" y="683.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="266.46" y="683.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="266.46" y="683.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="276.46" y="683.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/872c653b2d0501d6ab44cf87f43e1dc4853e4d37.pdf" rel="noopener"><rect x="276.46" y="683.20" width="10.00" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="82.61" font-size="11.00" class="sc-loraregular">1</text><text x="158.79 169.79 180.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="194.68 202.37 205.36 210.97 217.54 224.12 230.08 232.97 242.91 248.77 253.03 259.62 266.05 271.14 274.04 280.70 285.39 291.30 296.85 299.94 305.86" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="314.67 325.67 336.67 347.67 358.67 369.67 380.67 391.67 402.67 413.67 424.67 435.67 446.67 457.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们此前的部分</text><text x="471.56 478.45" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="485.03 496.03 507.03 518.03 529.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型一样。</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 191.02 195.71 201.61 207.17 210.26 216.18" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88" y="98.23" font-size="11.00" class="sc-notoserifcjksc">能力的提升以及随之而来的可能不同的对齐（</text><text x="447.88 453.56 456.55 459.64 465.72 472.40 482.23 488.20 494.77" y="98.23" font-size="11.00" class="sc-loraregular">alignment</text><text x="499.03 510.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）特</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">性，意味着它有可能显著影响我们此前的风险评估。有鉴于此，我们正在针对这一威胁模型另行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">发布一份整体</text><text x="138.00 149.00 160.00 171.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险评估</text><text x="182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">，其中既涉及我们的风险缓解措施，也涉及模型能力。我们判定整体风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">非常低，但高于此前的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="212.15" font-size="11.00" class="sc-loraitalic">2</text><text x="157.67 168.67 179.67 190.67 201.67 212.67 223.67 234.67 245.67 256.67 267.67 278.67 289.67 300.67 311.67 322.67 333.67 344.67 355.67 366.67 377.67 388.67 399.67 410.67" y="212.15" font-size="11.00" class="sc-notoserifcjksc">：来自自动化研发的风险。该威胁模型关注的是这样的</text><text x="424.56 431.45" y="212.15" font-size="11.00" class="sc-loraregular">AI</text><text x="438.03 449.03 460.03 471.03 482.03 493.03 504.03 515.03 526.03" y="212.15" font-size="11.00" class="sc-notoserifcjksc">系统：它们能够完全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">自动化、或以其他方式剧烈加速大型顶尖人类研究团队的工作，且所涉领域的快速进展可能对国</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">际安全构成威胁和</text><text x="160.00" y="243.39" font-size="11.00" class="sc-loraregular">/</text><text x="475.10 481.98" y="243.39" font-size="11.00" class="sc-loraregular">AI</text><text x="488.56 499.56 510.56 521.56" y="243.39" font-size="11.00" class="sc-notoserifcjksc">本身。更</text><text x="72.00 83.00 94.00 105.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">多详情，</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">请参见我们负责任扩展政策的第</text><text x="272.89" y="259.01" font-size="11.00" class="sc-loraregular" fill="#0000ff">1</text><text x="279.79" y="259.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="290.79" y="259.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="323.84" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是，自主性威胁模型</text><text x="250.89" y="323.84" font-size="11.00" class="sc-loraregular">2</text><text x="259.69 270.69 281.69 292.69" y="323.84" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="306.59 314.28 317.27 322.88 329.44 336.02 341.98 344.88 354.81 360.67 364.93 371.52 377.95 383.05 385.94 392.61 397.29 403.20 408.75 411.84 417.76" y="323.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="426.57 437.57 448.57 459.57 470.57 481.57 492.57 503.57 514.57 525.57" y="323.84" font-size="11.00" class="sc-notoserifcjksc">。该模型（相对于此前</text><text x="72.00 83.00 94. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p020.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 20 页"><text x="90.00 94.00" y="580.59" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00 95.90" y="677.74" font-size="11.00" class="sc-loraregular">2.</text><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">20</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的分类器，并已将其应用于</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。我们还维持着漏洞赏金计划和威胁情报，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用于持续评估我们分类器防护的有效性；维持多种针对越狱的快速响应选项；并采取安全控制措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的实施将基于正式发布的模型。我们认为，这些风险缓解措施等同于或强于我们以往的</text><text x="492.89 499.78 506.02 511.93 517.05" y="129.47" font-size="11.00" class="sc-loraregular">ASL-3</text><text x="526.07" y="129.47" font-size="11.00" class="sc-notoserifcjksc">防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">护，并足以使该类别的灾难性风险非常低但并非可以忽略不计，理由见我们</text><text x="435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="523.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="72.00 83.00 94.00 105.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的讨论。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">化学与生物武器威胁模型</text><text x="195.89" y="244.53" font-size="11.00" class="sc-loraitalic">2</text><text x="201.67" y="244.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="212.67 220.21 227.02 231.96" y="244.53" font-size="11.00" class="sc-loraitalic">CB-2</text><text x="237.74 248.74 259.74 270.74 281.74 292.74" y="244.53" font-size="11.00" class="sc-notoserifcjksc">）：新型化学</text><text x="303.74" y="244.53" font-size="11.00" class="sc-loraitalic">/</text><text x="310.93 321.93 332.93 343.93 354.93 365.93 376.93 387.93 398.93 409.93 420.93 431.93 442.93 453.93 464.93 475.93 486.93 497.93 508.93 519.93" y="244.53" font-size="11.00" class="sc-notoserifcjksc">生物武器的生产能力。如果一个模型能够显著</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">帮助威胁行为者（例如资源中等、有专家支持的团队）制造</text><text x="358.00" y="260.15" font-size="11.00" class="sc-loraregular">/</text><text x="365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="260.15" font-size="11.00" class="sc-notoserifcjksc">获取并部署具有造成灾难性损害潜</text><text x="72.00 83.00 94.00 105.00 116.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">力的化学和</text><text x="127.00" y="275.77" font-size="11.00" class="sc-loraregular">/</text><text x="134.59 145.59 156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59" y="275.77" font-size="11.00" class="sc-notoserifcjksc">或生物武器，且其损害远超</text><text x="269.48 277.17 285.77 292.96 296.64 304.84 309.93 313.93" y="275.77" font-size="11.00" class="sc-loraregular">COVID-19</text><text x="323.18 334.18 345.18 356.18 367.18 378.18 389.18 400.18 411.18 422.18 433.18 444.18" y="275.77" font-size="11.00" class="sc-notoserifcjksc">等以往灾难，则该模型具备</text><text x="458.08 465.77 472.61 477.64" y="275.77" font-size="11.00" class="sc-loraregular">CB-2</text><text x="486.44 497.44 508.44" y="275.77" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="341.68" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="341.68" font-size="11.00" class="sc-notoserifcjksc">未跨越这一阈值，原因是它在开放式科学推理、战略判断和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">假设分类研判方面存在前文所述的局限。因此，我们认为，即便我们将该模型全面开放，它对不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc">具备研发此类武器能力的威胁行为者的能力提升也是有限的（对于已具备相关专业知识的威胁行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="388.54" font-size="11.00" class="sc-notoserifcjksc">为者的武器研发可能在多大程度上被加速，仍存在不确定性）。总体情况与我们最近一份风险报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="404.16" font-size="11.00" class="sc-notoserifcjksc">告中的情况相似。</text><text x="72.00 80.04 83.68 91.71 95.04 105.80" y="464.80" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13 132.13" y="464.80" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="499.18" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 93.44 96.55 102.58 109.10 115.21 120.46 123.35 133.34 138.99 142.99 149.29 155.02 159.73 162.62 169.18 174.08 179.33 185.11 188.68 193.92" y="499.18" font-size="11.00" class="sc-loraitalic">Claude Mythos Preview</text><text x="205.63 216.63 227.63" y="499.18" font-size="11.00" class="sc-notoserifcjksc">应用的</text><text x="241.52 248.40 254.62" y="499.18" font-size="11.00" class="sc-loraitalic">RSP</text><text x="264.08 275.08 286.08 297.08 308.08 319.08 330.08 341.08" y="499.18" font-size="11.00" class="sc-notoserifcjksc">安全防护措施：与</text><text x="354.98 362.52 369.33 374.36" y="499.18" font-size="11.00" class="sc-loraitalic">CB-1</text><text x="381.14 392.14 403.14 414.14 425.14 436.14 447.14 458.14 469.14 480.14 491.14 502.14 513.14" y="499.18" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的实时分类器防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="547.75" font-size="11.00" class="sc-notoserifcjksc">这些评估基于我们</text><text x="162.89 169.80 176.04" y="547.75" font-size="11.00" class="sc-loraregular">RSP</text><text x="185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60" y="547.75" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="580.14" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="231.89" y="580.14" font-size="11.00" class="sc-lorabold">1</text><text x="236.36" y="580.14" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="247.36 254.93 262.20 267.38" y="580.14" font-size="11.00" class="sc-lorabold">CB-1</text><text x="271.85 282.85 293.85 304.85 315.85 326.85 337.85 348.85 359.85 370.85 381.85 392.85 403.85 414.85 425.85 436.85 447.85" y="580.14" font-size="11.00" class="sc-notoserifcjkscbold">）：非新型化学／生物武器生产能力：</text><text x="458.85 469.85 480.85 491.85 502.85 513.84 524.84" y="580.14" font-size="11.00" class="sc-notoserifcjksc">如果模型能够显</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="595.76" font-size="11.00" class="sc-notoserifcjksc">著帮助具备基础技术背景（例如</text><text x="264.89 271.13 278.17 285.01" y="595.76" font-size="11.00" class="sc-loraregular">STEM</text><text x="298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="595.76" font-size="11.00" class="sc-notoserifcjksc">本科学位）的个人或团体制造／获取并部署具有严</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="611.38" font-size="11.00" class="sc-notoserifcjksc">重灾难性破坏潜力的化学和／或生物武器，则该模型具备</text><text x="385.89 393.58 400.42 405.52" y="611.38" font-size="11.00" class="sc-loraregular">CB-1</text><text x="412.41 423.41 434.41" y="611.38" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="677.29" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="231.89" y="677.29" font-size="11.00" class="sc-lorabold">2</text><text x="237.76" y="677.29" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="248.76 256.32 263.59 268.46" y="677.29" font-size="11.00" class="sc-lorabold">CB-2</text><text x="274.32 285.32 296.32 307.32 318.32 329.32 340.32 351.32 362.32 373.32 384.32 395.32 406.32 417.32 428.32 439.32" y="677.29" font-size="11.00" class="sc-notoserifcjkscbold">）：新型化学／生物武器生产能力：</text><text x="450.32 461.32 472.32 483.32 494.32 505.32 516.32 527.32" y="677.29" font-size="11.00" class="sc-notoserifcjksc">如果模型能够显著</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="692.91" font-size="11.00" class="sc-notoserifcjksc">帮助威胁行为者（例如资源中等、</text><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="435.00" y="136.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="435.00" y="136.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="446.00" y="136.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="446.00" y="136.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="457.00" y=
