.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">能力</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">本节报告</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.91 209.60 215.51 221.06 224.15 230.07" y="154.36" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="241.77" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在推理、编程、智能体任务、数学、长上下文和知识工作方面</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的评估。网络安全能力在第</text><text x="206.89" y="169.98" font-size="11.00" class="sc-loraregular">3</text><text x="215.91" y="169.98" font-size="11.00" class="sc-notoserifcjksc">节中介绍。</text><text x="72.00" y="219.14" font-size="11.00" class="sc-notoserifcjksc">此处评估的许多能力也与模型安全相关；部分评估也见于第</text><text x="360.89" y="219.14" font-size="11.00" class="sc-loraregular">2</text><text x="369.69" y="219.14" font-size="11.00" class="sc-notoserifcjksc">节，我们在该节中讨论与我们的负</text><text x="72.00" y="234.76" font-size="11.00" class="sc-notoserifcjksc">责任扩展政策（</text><text x="149.00 155.83 161.79 166.89 173.45 179.89 186.57 191.66 194.75 201.15 204.14 210.11 213.00 219.24 225.07 230.74 233.73 236.82 243.50 249.58 252.48 259.03 265.47 268.46 271.55 277.35" y="234.76" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="283.16" y="234.76" font-size="11.00" class="sc-notoserifcjksc">）相关的评估。</text><text x="72.00" y="283.89" font-size="11.00" class="sc-notoserifcjksc">我们首先讨论与我们所使用的若干评估基准测试相关的污染问题。随后，我们提供一张汇总表，</text><text x="72.00" y="299.51" font-size="11.00" class="sc-notoserifcjksc">在多项评估上将</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.91 242.60 248.51 254.06 257.15 263.07" y="299.51" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.77" y="299.51" font-size="11.00" class="sc-notoserifcjksc">与其他</text><text x="310.67 317.55 324.13 328.39 334.98 339.66 346.10 352.67 355.76" y="299.51" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="364.50" y="299.51" font-size="11.00" class="sc-notoserifcjksc">模型及第三方模型进行比较，之后是</text><text x="72.00" y="315.13" font-size="11.00" class="sc-notoserifcjksc">各项评估的说明和方法细节。对于同样曾在</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04 358.00 360.60" y="315.13" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="369.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc">上运行过的评估，我们沿用</text><text x="501.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其系统</text><text x="72.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc">中的说明，并注明任何变更。</text><text x="72.00" y="398.64" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97" y="398.64" font-size="14.00" class="sc-notosanscjkscbold">污染</text><text x="72.00" y="440.82" font-size="11.00" class="sc-notoserifcjksc">数。我们采取了若干步骤对评估进行去污染；完整方法见</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04 424.00 426.71" y="440.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.5</text><text x="435.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="468.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="482.49" y="440.82" font-size="11.00" class="sc-loraregular">2.2</text><text x="499.90" y="440.82" font-size="11.00" class="sc-notoserifcjksc">节。对</text><text x="72.00" y="538.55" font-size="11.00" class="sc-notoserifcjksc">下面，我们讨论污染问题尤为突出的三项评估。</text><text x="72.00" y="585.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1 SWE-bench</text><text x="183.01" y="585.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估</text><text x="72.00" y="613.36" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="211.36" y="613.36" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="222.36" y="613.36" font-size="11.00" class="sc-loraregular">Multilingual</text><text x="286.34" y="613.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.23 306.89 311.58" y="613.36" font-size="11.00" class="sc-loraregular">Pro</text><text x="72.00" y="628.98" font-size="11.00" class="sc-notoserifcjksc">现训练数据中的解答，而不是独立推导出解答。我们在所有试验上运行了多个过滤器，在一系列</text><text x="72.00" y="644.60" font-size="11.00" class="sc-notoserifcjksc">阈值下剔除被标记的问题。在这一过滤后的子集上重新评分并不会改变</text><text x="415.89 423.58 426.57 432.18 438.75 445.33 451.29 454.18 464.12 469.98 474.24 480.83 487.26 492.35 495.25 501.91 506.60 512.51 518.06 521.15 527.07" y="644.60" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的排名，而且在排除被标记的问题之后，它相对于</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04 391.00 393.60" y="660.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="402.85" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的大幅提升仍然存在。在公</text><text x="72.00" y="675.84" font-size="11.00" class="sc-notoserifcjksc">开和私有的智能体编程基准测试上，以及在这些评估的干净划分和完整划分上，提升都一致，这</text><text x="72.00" y="691.46" font-size="11.00" class="sc-notoserifcjksc">表明</text><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="534.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="72.00" y="321.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="385.29" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="388.18" y="432.02" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="415.15" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="418.04" y="432.02" width="14.66" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="432.70" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="435.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">记忆并不是</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="266.67 272.90 283.85 290.47 295.85 302.25 308.21 314.89 320.74" y="82.61" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="330.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估中取得提升的主要原因。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">每个基准测试的问题都取自开源代码仓库，因此其内容可能出现在训练语料中。我们进行了语料</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级去污染，但仍在全部三个基准测试中观察到一些记忆的迹象。例如，在某个问题中，模型生成</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的补丁复现了参考解答中完全相同的辅助函数，尽管它先是独立地推导、构建并测试了一个解</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">答，然后似乎才在最后</text><text x="182.00" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="186.40" y="178.05" font-size="11.00" class="sc-notoserifcjksc">回忆起</text><text x="219.40" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="223.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">真值补丁。</text><text x="278.24" y="178.05" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="319.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">也针对</text><text x="461.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">记录了</text><text x="494.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc">类似的担</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">忧。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">为了检测记忆，我们使用一个基于</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="260.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="260.72" font-size="11.00" class="sc-notoserifcjksc">的审计模型，将每个模型生成的补丁与标准补丁进行</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">比较，并给出一个</text><text x="162.89 166.51 173.17 175.94 178.83 182.69" y="276.34" font-size="11.00" class="sc-loraregular">[0, 1]</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">问题约束下都会写出的重合部分。另有一项基于规则的补充检查，会标记与参考解答之间大量逐</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">字重合的注释。我们对所有模型的每一次尝试都运行这两种检测器，只要有任何一次尝试被标</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">记，就将该问题标为可能被记忆。剔除所有模型和所有尝试中被标记问题的并集，对</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="338.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="354.44" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="354.44" font-size="11.00" class="sc-notoserifcjksc">而言是一种保守做法：它同时也剔除了任一基线模型（</text><text x="420.59 429.32 435.89 442.46 447.55 450.44 456.41 459.00" y="354.44" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="468.25" y="354.44" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="482.15 489.83 492.83 498.44 505.00 511.58" y="354.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.73" y="370.06" font-size="11.00" class="sc-loraregular">Sonnet 4.5</text><text x="125.72" y="370.06" font-size="11.00" class="sc-notoserifcjksc">）可能记忆过的问题。</text><text x="72.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">事后识别记忆本质上只能是近似的。因此，我们在审计模型决策阈值的整个取值范围内进行扫</text><text x="72.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">描，而不是只采用单一的截断值。在过滤严格程度的整个范围内，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 439.22 445.09 449.34 455.93 462.37 467.46 470.35 477.02 481.71 487.61 493.17 496.26 502.18" y="470.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="513.88" y="470.64" font-size="11.00" class="sc-notoserifcjksc">在每</text><text x="72.00" y="486.26" font-size="11.00" class="sc-notoserifcjksc">个基准测试上都保持着对</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.00 272.60" y="486.26" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="281.85" y="486.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.74 303.43 306.42 312.03 318.60 325.18 331.14 334.03 340.27 346.70 353.38 360.06 365.94 370.20 373.09 379.05 381.65" y="486.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="390.90" y="486.26" font-size="11.00" class="sc-notoserifcjksc">的显著领先。</text><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="461.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="72.00 80.34 83.48 90.97 94.11 101.60 104.98 115.03 123.46 132.28 137.27 145.84 149.27 156.76 160.14 168.35 176.37 185.18 192.12 200.41 208.85 212.28 220.71" y="606.17" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.2.2 CharXiv Reasoning</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="325.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="325.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 104.66 106.76 112.29 115.77 118.13 123.44 132.59 138.08 142.32 147.47 152.32 158.06 162.72" y="325.03" font-size="9.00" class="sc-lorabold">6.2.1.A] SWE-bench</text><text x="170.68" y="325.03" font-size="9.00" class="sc-notoserifcjkscbold">评估通过率与记忆过滤阈值的关系。</text><text x="314.68" y="325.03" font-size="9.00" class="sc-notoserifcjksc">上图展示了</text><text x="362.04 368.33 370.78 375.37 380.74 386.13 391.00 393.37 401.50 406.30 409.78 415.17 420.43 424.60 426.97 432.42 436.26 441.09 445.64 448.16 453.01" y="325.03" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="460.22" y="325.03" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="469.22 475.51 477.95 482.54 487.92 493.30 498.18 500.54 507.69 513.06 518.44 522.60 524.97 529.85 531.97" y="325.03" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="72.00" y="336.73" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="83.37 89.66 92.11 96.70 102.07 107.45 112.33 114.70 119.80 125.06 130.53 135.99 140.80 144.29 146.65 151.53 153.66" y="336.73" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="161.23" y="336.73" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="257.25" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="266.25" y="336.73" font-size="9.00" class="sc-loraregular">n=500</text><text x="292.56" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）、</text><text x="310.56" y="336.73" font-size="9.00" class="sc-loraregular">Multilingual</text><text x="360.54" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="369.54 375.00 379.77 384.61 389.59" y="336.73" font-size="9.00" class="sc-loraregular">n=297</text><text x="393.74" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="414.11 419.56 423.40" y="336.73" font-size="9.00" class="sc-loraregular">Pro</text><text x="428.66" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="437.66 443.12 447.58 451.73 456.74" y="336.73" font-size="9.00" class="sc-loraregular">n=731</text><text x="460.02" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）上的通过率随过</text><text x="72.00" y="348.43" font-size="9.00" class="sc-notoserifcjksc">滤严格程度的变化。每个模型都在如下问题子集上重新评分：按任一模型计，审计模型给出的记忆概率均</text><text x="488.37" y="348.43" font-size="9.00" class="sc-notoserifcjksc">≤</text><text x="499.73" y="348.43" font-size="9.00" class="sc-loraregular">x</text><text x="506.87" y="348.43" font-size="9.00" class="sc-notoserifcjksc">轴取</text><text x="72.00" y="360.13" font-size="9.00" class="sc-notoserifcjksc">值。柱形表示在每个阈值下保留的问题数量。在阈值</text><text x="281.37 284.64 286.72" y="360.13" font-size="9.00" class="sc-loraregular">1.0</text><text x="292.31" y="360.13" font-size="9.00" class="sc-notoserifcjksc">（最右侧）时，所有问题均被保留，曲线与表</text><text x="474.68" y="360.13" font-size="9.00" class="sc-loraregular">6.3.A</text><text x="497.32" y="360.13" font-size="9.00" class="sc-notoserifcjksc">中的主要</text><text x="72.00" y="371.83" font-size="9.00" class="sc-notoserifcjksc">成绩一致；向左移动会剔除被判定为越来越可能被记忆的问题。在整个阈值范围内，在全部三个基准测试上，</text><text x="504.00 510.29 512.74 517.33 522.70 528.08" y="371.83" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 111.05 114.88 119.72 124.26 126.79 131.63" y="383.53" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="141.21" y="383.53" font-size="9.00" class="sc-notoserifcjksc">都保持着对两个基线的显著领先。在我们的参考阈值</text><text x="350.58 356.02 357.95" y="383.53" font-size="9.00" class="sc-loraregular">0.7</text><text x="362.10" y="383.53" font-size="9.00" class="sc-notoserifcjksc">（一个有意设定的高召回率设置，会剔除每</text><text x="72.00" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个基准测试</text><text x="119.37" y="395.23" font-size="9.00" class="sc-loraregular">8–15%</text><text x="148.11" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的问题）下，</text><text x="202.11 208.40 210.85 215.44 220.82 226.20 231.08 233.44 241.57 246.37 249.85 255.24 260.51 264.67 267.04 272.49 276.33 281.16 285.71 288.23 293.08" y="395.23" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="302.65" y="395.23" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="332.02 339.17 344.54 349.91 354.08 356.45 361.32 363.45" y="395.23" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="371.02" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的领先幅度最多缩小</text><text x="454.38" y="395.23" font-size="9.00" class="sc-loraregular">3.5</text><text x="468.88" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个百分点。最左侧</text><text x="72.00" y="406.93" font-size="9.00" class="sc-notoserifcjksc">的不稳定是在通过过滤的问题少于约</text><text x="218.37" y="406.93" font-size="9.00" class="sc-loraregular">30</text><text x="231.34" y="406.93" font-size="9.00" class="sc-notoserifcjksc">个时出现的小样本噪声。随着记忆过滤放宽、更多被标记的问题被加回，</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93 142.38 146.21 151.05 155.59 158.12 162.96" y="418.63" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="172.54" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率大致保持稳定，而</text><text x="282.91 289.20 291.65 296.23 301.61 306.99 311.87 314.24 321.38 326.75 332.13 336.29 338.66 343.54 345.66" y="418.63" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="353.23" y="418.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="364.60 370.89 373.34 377.93 383.30 388.68 393.56 395.93 401.03 406.30 411.76 417.22 422.04 425.52 427.89 432.77 434.89" y="418.63" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="442.46" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率则有所下降。</text><text x="72.00" y="430.33" font-size="9.00" class="sc-notoserifcjksc">这与以下情况相符：</text><text x="153.00 159.29 161.74 166.33 171.70 177.08 181.96 184.33 192.46 197.25 200.74 206.13 211.39 215.56 217.93 223.38 227.21 232.05 236.59 239.12 243.96" y="430.33" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="253.54" y="430.33" font-size="9.00" class="sc-notoserifcjksc">记忆了一些较难的被标记问题，而这些问题基线模型并未独立解出。</text><text x="72.00" y="523.06" font-size="11.00" class="sc-notoserifcjksc">我们的检测器并不完美，但这一结果对阈值的选择是稳健的，并且与</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="523.06" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="523.06" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="538.68" font-size="11.00" class="sc-notoserifcjksc">任何训练语料中都不存在的内部基准测试上的提升相一致。我们的结论是，记忆并不能解释它在</text><text x="72.00 78.24 89.18 95.80 101.18 107.59 113.55 120.22 126.08" y="554.30" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="135.56" y="554.30" font-size="11.00" class="sc-notoserifcjksc">上的提升。</text><text x="72.00 79.69 86.28 91.95 96.04 103.17 106.26 111.82 114.71 121.54 127.48 133.16 138.25 144.69 151.37 154.46 161.13" y="630.25" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="170.11" y="630.25" font-size="11.00" class="sc-notoserifcjksc">是我们在第</text><text x="228.00" y="630.25" font-size="11.00" class="sc-loraregular">6.11.3</text><text x="256.80" y="630.25" font-size="11.00" class="sc-notoserifcjksc">节中为</text><text x="292.69 300.38 303.37 308.98 315.55 322.13 328.09 330.98 340.92 346.78 351.04 357.63 364.06 369.15 372.05 378.71 383.40 389.31 394.86 397.95 403.87" y="630.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="415.57" y="630.25" font-size="11.00" class="sc-notoserifcjksc">报告的一项基准测试。</text><text x="72.00 79.69 86.28 91.95 96.04 103.17 106.26" y="645.87" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="290.22 295.89 299.97 307.11 310.21" y="645.87" font-size="11.00" class="sc-loraregular">arXiv</text><text x="72.00" y="661.49" font-size="11.00" class="sc-notoserifcjksc">模的预训练语料中，本质上难以完全去污染。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用两种互补的方法来检测</text><text x="228.89 236.58 243.17 248.85 252.93 260.07 263.16 268.71 271.61 278.44 284.38 290.05 295.15 301.58 308.26 311.35 318.03" y="82.61" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的污染。我们挑选答案文本具有独特性的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">估条目，在完整的预训练数据混合中</text><text x="250.89 256.98 261.66 267.62" y="98.23" font-size="11.00" class="sc-loraregular">grep</text><text x="277.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">精确匹配，并另行搜索评估图像。尽管对评估图像进</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行了稳健的图像级过滤，我们仍确认大多数问答文本对出现在语料中。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">为了估计污染的影响，我们为基准测试的一个子集构建了留出变体：我们手动扰动每个问题或图</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">像，并比较原版与改编版的准确率。例如，我们要求模型识别某个图表标签而不是另一个，或者</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">识别第二低而不是第二高的数据系列，从而使正确答案发生变化，同时难度大致保持不变。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.80 107.90 113.44 116.91 119.28 125.47 131.06 135.77 139.61 145.90 148.78 153.62 155.99 162.04 166.88 171.59 175.96 181.05 186.80 189.74 195.48" y="556.05" font-size="9.00" class="sc-lorabold">6.2.2.A] CharXiv Reasoning</text><text x="200.49" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">（子集）分数。</text><text x="263.49" y="556.05" font-size="9.00" class="sc-notoserifcjksc">我们在原始</text><text x="310.86 317.15 322.54 327.19 330.52 336.37 338.89" y="556.05" font-size="9.00" class="sc-loraregular">CharXiv</text><text x="345.81" y="556.05" font-size="9.00" class="sc-notoserifcjksc">基准测试的一个问题子集上评估各模型，同时使</text><text x="72.00" y="567.75" font-size="9.00" class="sc-notoserifcjksc">用原始问答对和难度与歧义程度大致相当的手动改写变体。</text><text x="306.00 312.29 314.74 319.33 324.70 330.08 334.96 337.33 345.46 350.25 353.74 359.13 364.39 368.56 370.93 376.38 380.21 385.05 389.59 392.12 396.96" y="567.75" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="406.54" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在自适应思考（</text><text x="469.54 474.18 479.57 484.21 489.58 493.07 495.59 500.09" y="567.75" font-size="9.00" class="sc-loraregular">adaptive</text><text x="72.00" y="579.45" font-size="9.00" class="sc-loraregular">thinking</text><text x="106.67" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="127.04" y="579.45" font-size="9.00" class="sc-loraregular">max</text><text x="146.86" y="579.45" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="191.86 196.74 199.87 202.87 208.13 212.09" y="579.45" font-size="9.00" class="sc-loraregular">effort</text><text x="215.58" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）下进行评估。</text><text x="278.58 285.43 290.30 298.35 300.88 306.34 308.87 311.24 316.25 318.47 321.74 324.11 329.56 333.40 338.66 341.03 346.48 350.32 355.15 359.69 362.22 367.07" y="579.45" font-size="9.00" class="sc-loraregular">Gemini 3.1 Pro Preview</text><text x="376.64" y="579.45" font-size="9.00" class="sc-notoserifcjksc">在默认的动态思考档位</text><text x="466.64 470.24 475.63 478.16 483.35 488.54" y="579.45" font-size="9.00" class="sc-loraregular">“high”</text><text x="491.68" y="579.45" font-size="9.00" class="sc-notoserifcjksc">下进行评</text><text x="72.00" y="591.15" font-size="9.00" class="sc-notoserifcjksc">估。</text><text x="90.00 96.85 102.30 107.49 111.89 116.79 119.01 123.89 126.25 131.71 135.54" y="591.15" font-size="9.00" class="sc-loraregular">GPT-5.4 Pro</text><text x="143.17" y="591.15" font-size="9.00" class="sc-notoserifcjksc">在推理设置为</text><text x="197.17 200.77 206.16 208.69 213.89 219.07" y="591.15" font-size="9.00" class="sc-loraregular">“high”</text><text x="222.21" y="591.15" font-size="9.00" class="sc-notoserifcjksc">的情况下进行评估。</text><text x="72.00" y="634.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 100.17 105.85 109.93 117.07 120.16" y="634.83" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="128.61" y="634.83" font-size="11.00" class="sc-notoserifcjksc">的一个包含</text><text x="186.50" y="634.83" font-size="11.00" class="sc-loraregular">100</text><text x="207.06" y="634.83" font-size="11.00" class="sc-notoserifcjksc">个条目的改编版上，</text><text x="306.06 313.75 316.74 322.35 328.92 335.49 341.46 344.35 354.28 360.15 364.40 370.99 377.43 382.52 385.41 392.08 396.76 402.67 408.23 411.32 417.23" y="634.83" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="426.05" y="634.83" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="437.05 445.42 451.38 461.21 464.30 470.98 474.07 476.97 483.09 485.80 489.80 492.70 499.36 504.05" y="634.83" font-size="11.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="650.45" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="650.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42 137.79 144.46 150.79 156.17 162.17 164.87 170.83 173.73 180.39 185.08" y="650.45" font-size="11.00" class="sc-loraregular">GPT-5.4 Pro</text><text x="194.41" y="650.45" font-size="11.00" class="sc-notoserifcjksc">在改编版上的得分均高于在对应原始子集上的得分。这表明原始基准测</text><text x="72.00" y="666.07" font-size="11.00" class="sc-notoserifcjksc">试上可归因于记忆的表现是有限的。我们的结论是，污染不太可能对</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="666.07" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="666.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 79.69 86.28 91.95 96.04 103.17 106.26" y="681.69" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="114.71" y="681.69" font-size="11.00" class="sc-notoserifcjksc">上的表现有实质性贡献。</text></svg></div>

.61" y="643.08" font-size="11.00" class="sc-lorabold">Terminal-Bench 2.0*</text><text x="255.75" y="643.08" font-size="11.00" class="sc-lorabold">82%</text><text x="327.75 334.10 340.09 342.80 348.76" y="643.08" font-size="11.00" class="sc-loraregular">65.4%</text><text x="399.75 404.82 410.81 413.51 417.51" y="643.08" font-size="11.00" class="sc-loraregular">75.1%</text><text x="463.50 469.85 476.03 478.74 484.73" y="643.08" font-size="11.00" class="sc-loraregular">68.5%</text><text x="77.25 85.54 92.56 100.76 108.10 111.00 119.30 122.89 128.65 138.76 144.98 152.00" y="676.41" font-size="11.00" class="sc-lorabold">GPQA Diamond</text><text x="255.75 262.08 268.09 270.66 276.59" y="676.41" font-size="11.00" class="sc-lorabold">94.5%</text><text x="327.75 334.10 338.10 340.81 346.93" y="676.41" font-size="11.00" class="sc-loraregular">91.3%</text><text x="399.75 406.10 412.01 414.71 420.89" y="676.41" font-size="11.00" class="sc-loraregular">92.8%</text><text x="463.50 469.85 475.81 478.52 484.64" y="676.41" font-size="11.00" class="sc-loraregular">94.3%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="76.75" y="414.06" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="255.25" y="414.27" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude</text><text x="294.18" y="414.27" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">系列</text><text x="399.25" y="414.27" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">其他模型</text><text x="72.00 82.10 92.20 102.29 110.47 115.85 122.51 127.20" y="111.05" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="136.53" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是我们通常会在本系统卡（</text><text x="268.53 274.71 280.52 285.61 289.87 295.83 305.66 308.56 316.24 321.92 326.61" y="111.05" font-size="11.00" class="sc-loraregular">System Card</text><text x="333.18" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）中（具体而言，在下文第</text><text x="468.08" y="111.05" font-size="11.00" class="sc-loraregular">6.11</text><text x="488.04" y="111.05" font-size="11.00" class="sc-notoserifcjksc">节中）报</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">告的一项基准测试。与</text><text x="184.89 192.58 199.17 204.85 208.93 216.07 219.16 224.71 227.61 234.44 240.38 246.05 251.15 257.58 264.26 267.35 274.03" y="126.67" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="283.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="316.00 326.10 336.20 346.30 354.47 359.85 366.51 371.20" y="126.67" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="380.53" y="126.67" font-size="11.00" class="sc-notoserifcjksc">由来自广泛传播的公开材料的内</text><text x="72.00" y="191.98" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00 137.10 147.20 157.29 165.47 170.85 177.51 182.20" y="191.98" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="191.53" y="191.98" font-size="11.00" class="sc-notoserifcjksc">中有很大一部分图像出现在训练数据中，主要是通过教科书、作业辅导</text><text x="72.00" y="207.60" font-size="11.00" class="sc-notoserifcjksc">网站和文档爬取，这些来源会对底层原始内容进行重新包装和分发。</text><text x="72.00" y="256.77" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 100.17 105.85 109.93 117.07 120.16 125.71 128.61 135.44 141.38 147.05 152.15 158.58 165.26 168.35 175.03" y="256.77" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="184.00" y="256.77" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="217.00 227.10 237.20 247.30 255.47 260.85 267.51 272.20" y="256.77" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="281.53" y="256.77" font-size="11.00" class="sc-notoserifcjksc">中只有数量有限的问题能够方便地构造出难度大致相</text><text x="72.00" y="272.39" font-size="11.00" class="sc-notoserifcjksc">当的变体。</text><text x="127.00 137.10 147.20 157.29 165.47 170.85 177.51 182.20" y="272.39" font-size="11.00" class="s -opus-4-6-system-card" rel="noopener"><rect x="275.02" y="470.58" width="9.00" height="9.00" fill="transparent"/></a><a href="https://openai.com/index/introducing-swe-bench-verified/" rel="noopener"><rect x="108.00" y="621.90" width="29.18" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/introducing-swe-bench-verified/" rel="noopener"><rect x="137.18" y="621.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/introducing-swe-bench-verified/" rel="noopener"><rect x="137.18" y="621.90" width="31.48" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/introducing-swe-bench-verified/" rel="noopener"><rect x="168.67" y="621.90" width="2.89" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/introducing-swe-bench-verified/" rel="noopener"><rect x="171.56" y="621.90" width="39.91" height="11.00" fill="transparent"/></a><a href="https://scale.com/leaderboard/swe_bench_pro_public" rel="noopener"><rect x="108.00" y="654.28" width="29.18" height="11.00" fill="transparent"/></a><a href="https://scale.com/leaderboard/swe_bench_pro_public" rel="noopener"><rect x="137.18" y="654.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://scale.com/leaderboard/swe_bench_pro_public" rel="noopener"><rect x="137.18" y="654.28" width="31.48" height="11.00" fill="transparent"/></a><a href="https://scale.com/leaderboard/swe_bench_pro_public" rel="noopener"><rect x="168.67" y="654.28" width="2.89" height="11.00" fill="transparent"/></a><a href="https://scale.com/leaderboard/swe_bench_pro_public" rel="noopener"><rect x="171.56" y="654.28" width="17.79" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p190.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 190 页"><text x="72.00 80.98 84.36 93.30 96.93 104.83 113.46 118.83 133.37 137.06 146.14 155.63 159.33 167.51 176.33 184.96 194.04 202.44 211.52 215.15 223.23 226.60" y="249.82" font-size="14.00" class="sc-poppinsmedium">6.5 Terminal-Bench 2.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="108.00 114.24 125.18 131.80 137.18 143.59 149.55 156.22 162.08 168.67 171.56 181.66 188.22 191.22 195.47 198.56 201.56 204.65 211.32 217.41 223.97 229.65" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">SWE-bench Multilingual</text><text x="235.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖</text><text x="337.43" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="346.68" y="82.61" font-size="11.00" class="sc-notoserifcjksc">种编程语言的</text><text x="415.57" y="82.61" font-size="11.00" class="sc-loraregular">300</text><text x="438.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">道题。</text><text x="471.25 478.94 481.93 487.54 494.11 500.69" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="217.48 223.66 228.25 230.96 237.08" y="98.23" font-size="11.00" class="sc-loraregular">87.3%</text><text x="246.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="271.55" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="280.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="108.00 114.24 125.18 131.80 137.18 143.59 149.55 156.22 162.08 168.67 171.56 181.66 188.22 191.22 195.47 198.56 208.40 214.83 221.41 227.09" y="114.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">SWE-bench Multimodal</text><text x="232.97" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="246.86" y="114.99" font-size="11.00" class="sc-loraregular">issue</text><text x="275.56" y="114.99" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图、设计稿）。</text><text x="495.56 503.25 506.24 511.85 518.42 525.00" y="114.99" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="130.60" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59" y="130.60" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="217.48 223.48 229.66 232.20 239.03" y="130.60" font-size="11.00" class="sc-loraregular">59.0%</text><text x="248.60" y="130.60" font-size="11.00" class="sc-notoserifcjksc">（在内部运行框架上评估；参见附录</text><text x="427.49 433.68 436.27" y="130.60" font-size="11.00" class="sc-loraregular">8.6</text><text x="442.63" y="130.60" font-size="11.00" class="sc-notoserifcjksc">），为</text><text x="478.52" y="130.60" font-size="11.00" class="sc-loraregular">5</text><text x="487.41" y="130.60" font-size="11.00" class="sc-notoserifcjksc">次试验的</text><text x="108.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">平均值。我们注意到，该变体的试验间差异（</text><text x="328.00" y="146.23" font-size="11.00" class="sc-loraregular">56.4%–61.4%</text><text x="393.68" y="146.23" font-size="11.00" class="sc-notoserifcjksc">）高于其他变体。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">所有</text><text x="96.89 103.13 114.07 120.70 126.08 132.48 138.44 145.12 150.97" y="195.95" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="160.45" y="195.95" font-size="11.00" class="sc-notoserifcjksc">变体均采用标准配置（见表</text><text x="295.34" y="195.95" font-size="11.00" class="sc-loraregular">6.3.A</text><text x="320.13" y="195.95" font-size="11.00" class="sc-notoserifcjksc">），采样结果中包含思考块。关于我们的记忆</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">筛查，参见第</text><text x="140.89" y="211.57" font-size="11.00" class="sc-loraregular">6.2</text><text x="158.76" y="211.57" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="272.48" font-size="11.00" class="sc-loraregular" fill="#0000ff">Terminal-Bench 2.0</text><text x="175.86" y="272.48" font-size="11.00" class="sc-notoserifcjksc">由斯坦福大学和</text><text x="255.76 262.36 267.97 274.53 281.11 287.07 289.97 293.56 300.24 305.33 309.59 312.86 317.11 323.68 327.94" y="272.48" font-size="11.00" class="sc-loraregular">Laude Institute</text><text x="336.79" y="272.48" font-size="11.00" class="sc-notoserifcjksc">的研究人员开发，在终端和命令行环境中</text><text x="72.00" y="288.11" font-size="11.00" class="sc-notoserifcjksc">的真实世界任务上测试</text><text x="184.89" y="288.11" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="288.11" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 116.38 122.06 126.78 133.18 139.62" y="321.06" font-size="11.00" class="sc-loraregular">Harbor</text><text x="147.27" y="321.06" font-size="11.00" class="sc-notoserifcjksc">脚手架（</text><text x="191.27 196.37 202.20 207.87 211.70 215.36 221.80 224.79" y="321.06" font-size="11.00" class="sc-loraregular">scaffold</text><text x="231.37" y="321.06" font-size="11.00" class="sc-notoserifcjksc">）中使用</text><text x="278.26 284.76 290.72 295.49 305.32 308.41 315.09 321.66 326.75 331.78" y="321.06" font-size="11.00" class="sc-loraregular">Terminus-2</text><text x="340.58" y="321.06" font-size="11.00" class="sc-notoserifcjksc">运行框架和默认解析器运行</text><text x="475.47 481.97 487.93 492.70 502.53 505.62 512.30 517.97 520.97" y="321.06" font-size="11.00" class="sc-loraregular">Terminal-</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 106.82 112.72 115.26" y="336.68" font-size="11.00" class="sc-loraregular">Bench 2.0</text><text x="122.09" y="336.68" font-size="11.00" class="sc-notoserifcjksc">。每个任务在独立的</text><text x="223.99 231.39 237.96 244.36 250.32 255.08 261.76 267.65 271.90 277.87 282.96 285.85 292.42 298.85" y="336.68" font-size="11.00" class="sc-loraregular">Kubernetes pod</text><text x="308.32" y="336.68" font-size="11.00" class="sc-notoserifcjksc">中运行，保证资源为基准测试规定限额的</text><text x="72.00" y="352.30" font-size="11.00" class="sc-loraregular">1×</text><text x="172.73" y="352.30" font-size="11.00" class="sc-loraregular">3×</text><text x="184.68" y="352.30" font-size="11.00" class="sc-notoserifcjksc">），超时设为</text><text x="253.58" y="352.30" font-size="11.00" class="sc-loraregular">1×</text><text x="263.41" y="352.30" font-size="11.00" class="sc-notoserifcjksc">，以保证与基准测试的一致性。该配置的详细信息见</text><text x="516.41" y="352.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们</text><text x="72.00" y="367.92" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的工程博客</text><text x="127.00" y="367.92" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="402.03" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="402.03" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="230.77" y="402.03" font-size="11.00" class="sc-lorabold">82%</text><text x="255.77" y="402.03" font-size="11.00" class="sc-notoserifcjkscbold">的平均奖励</text><text x="310.77" y="402.03" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="335.66 341.76" y="402.03" font-size="11.00" class="sc-loraregular">89</text><text x="351.02" y="402.03" font-size="11.00" class="sc-notoserifcjksc">个不同任务各</text><text x="419.91" y="402.03" font-size="11.00" class="sc-loraregular">5</text><text x="428.80" y="402.03" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值（共计</text><text x="72.00" y="417.65" font-size="11.00" class="sc-loraregular">445</text><text x="92.81" y="417.65" font-size="11.00" class="sc-notoserifcjksc">次试验）。我们将</text><text x="183.70 191.39 194.39 200.00 206.56 213.14 219.10 222.00 231.93 237.79 242.05 248.64 255.07 260.17 263.06 269.73 274.41 280.32 285.87 288.96 294.88" y="417.65" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="306.59" y="417.65" font-size="11.00" class="sc-notoserifcjksc">配置为以最高推理强度（自适应模式）运行，每</text><text x="72.00" y="433.27" font-size="11.00" class="sc-notoserifcjksc">个任务的总</text><text x="129.89 134.15 140.58 146.41 152.38" y="433.27" font-size="11.00" class="sc-loraregular">token</text><text x="161.95" y="433.27" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="197.84" y="433.27" font-size="11.00" class="sc-loraregular">100</text><text x="218.40" y="433.27" font-size="11.00" class="sc-notoserifcjksc">万，每次请求的最大输出</text><text x="342.29 346.55 352.98 358.81 364.78" y="433.27" font-size="11.00" class="sc-loraregular">token</text><text x="374.35" y="433.27" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="388.24" y="433.27" font-size="11.00" class="sc-loraregular">32K</text><text x="407.79" y="433.27" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="418.79 425.29 431.25 436.01 445.85 448.94 455.61 461.29 464.28 469.66 476.50 482.47 489.14 494.99" y="433.27" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="504.48" y="433.27" font-size="11.00" class="sc-notoserifcjksc">对推理</text><text x="72.00" y="448.89" font-size="11.00" class="sc-notoserifcjksc">延迟较为敏感：固定的实际耗时超时意味着解码较慢的端点在每个任务中完成的回合更少。我们</text><text x="72.00" y="464.51" font-size="11.00" class="sc-notoserifcjksc">报告的得分使用了生产环境</text><text x="206.89 213.78 220.39" y="464.51" font-size="11.00" class="sc-loraregular">API</text><text x="226.97" y="464.51" font-size="11.00" class="sc-notoserifcjksc">端点，以考虑这些动态因素。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="515.38" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="175.86" y="515.38" font-size="11.00" class="sc-notoserifcjksc">的超时限制有时相当严格，对思考型模型尤其如此，这有可能使真实的能力</text><text x="72.00" y="531.00" font-size="11.00" class="sc-notoserifcjksc">跃升被采样速度等看似无关的混杂因素所掩盖。此外，部分</text><text x="360.89 367.39 373.36 378.12 387.95 391.04 397.72 403.40 406.39 411.77 418.61 424.57 431.25 437.10 443.69 446.58 452.49 455.03" y="531.00" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="464.76" y="531.00" font-size="11.00" class="sc-notoserifcjksc">任务存在歧</text><text x="456.51" y="546.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">2.1</text><text x="472.02" y="546.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更新</text><text x="494.02" y="546.62" font-size="11.00" class="sc-notoserifcjksc">中解决这</text><text x="72.00" y="562.24" font-size="11.00" class="sc-notoserifcjksc">两个问题。为了在排除混杂因素的情况下单独衡量智能体编程能力，我们还使用</text><text x="459.89 468.26 471.53 475.79 484.16 490.73" y="562.24" font-size="11.00" class="sc-loraregular">GitHub</text><text x="500.02" y="562.24" font-size="11.00" class="sc-notoserifcjksc">上提供</text><text x="72.00" y="577.86" font-size="11.00" class="sc-notoserifcjksc">的最新</text><text x="107.89" y="577.86" font-size="11.00" class="sc-loraregular">2.1</text><text x="123.40" y="577.86" font-size="11.00" class="sc-notoserifcjksc">修复运行了</text><text x="181.30 187.80 193.76 198.52 208.36 211.45 218.12 223.80 226.79 232.17 239.01 244.98 251.65 257.50" y="577.86" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="264.09" y="577.86" font-size="11.00" class="sc-notoserifcjksc">，同时将超时限制提高到</text><text x="387.99" y="577.86" font-size="11.00" class="sc-loraregular">4</text><text x="396.84" y="577.86" font-size="11.00" class="sc-notoserifcjksc">小时（大约是</text><text x="465.73 471.64 474.18" y="577.86" font-size="11.00" class="sc-loraregular">2.0</text><text x="483.91" y="577.86" font-size="11.00" class="sc-notoserifcjksc">基线的四</text><text x="72.00" y="593.48" font-size="11.00" class="sc-notoserifcjksc">倍）。这使平均奖励达到</text><text x="195.89" y="593.48" font-size="11.00" class="sc-lorabold">92.1%</text><text x="225.07" y="593.48" font-size="11.00" class="sc-notoserifcjksc">。在相同条件下，我们测得使用</text><text x="381.96 389.65 396.08 402.66 408.57 414.40 417.29 424.98 431.34" y="593.48" font-size="11.00" class="sc-loraregular">Codex CLI</text><text x="437.92" y="593.48" font-size="11.00" class="sc-notoserifcjksc">运行框架的</text><text x="495.81 504.18 510.85 517.18 522.56 528.55 531.26" y="593.48" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="72.00" y="609.10" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="96.89" y="609.10" font-size="11.00" class="sc-loraregular">75.3%</text><text x="126.36" y="609.10" font-size="11.00" class="sc-notoserifcjksc">（高于基线规格下的</text><text x="228.26" y="609.10" font-size="11.00" class="sc-loraregular">68.3%</text><text x="259.20" y="609.10" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="270.20 273.64" y="605.43" font-size="6.60" class="sc-loraregular">23</text><text x="277.32" y="609.10" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 75.13" y="687.66" font-size="6.00" class="sc-loraregular">23</text><text x="81.10" y="690.99" font-size="10.00" class="sc-notoserifcjksc">我们没有报告</text><text x="143.73 151.34 156.76 165.70 168.51 174.58 177.39 180.02 185.59 188.05 191.69 194.32 200.38 204.64" y="690.99" font-size="10.00" class="sc-loraregular">Gemini 3.1 Pro</text><text x="213.12" y="690.99" font-size="10.00" class="sc-notoserifcjksc">在此设置下的结果。我们难以复现此前的最佳结果，包括我们自己的测试</text><text x="201.55" y="705.19" font-size="10.00" class="sc-loraregular">2</t y="164.81" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="72.00" y="197.77" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.91 286.60 292.51 298.06 301.15 307.07" y="197.77" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="315.88" y="197.77" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="337.88" y="197.77" font-size="11.00" class="sc-loraregular">1</text><text x="341.89" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具），以及（</text><text x="495.89" y="197.77" font-size="11.00" class="sc-loraregular">2</text><text x="501.79" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）使用</text><text x="72.00" y="213.39" font-size="11.00" class="sc-notoserifcjksc">网络搜索、网页抓取、程序化工具调用、代码执行，并每</text><text x="349.89 355.89 362.72 368.63 371.52 375.78 382.21 388.04 394.00" y="213.39" font-size="11.00" class="sc-loraregular">50k token</text><text x="403.57" y="213.39" font-size="11.00" class="sc-notoserifcjksc">进行一次上下文压缩</text><text x="72.00" y="229.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.81 106.07 111.97 117.80 122.06 124.95 130.75 137.19 147.02 153.59 159.26 165.06 169.32 172.41 178.84" y="229.01" font-size="11.00" class="sc-loraregular">context compaction</text><text x="185.52" y="229.01" font-size="11.00" class="sc-notoserifcjksc">），最多至</text><text x="243.41" y="229.01" font-size="11.00" class="sc-loraregular">300</text><text x="266.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="279.99 284.25 290.68 296.51 302.47" y="229.01" font-size="11.00" class="sc-loraregular">token</text><text x="309.15" y="229.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="320.15 327.84 330.83 336.44 343.01 349.58 355.55 358.44 367.17 373.74 380.31 385.40 388.29 394.26 396.85" y="229.01" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="406.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="278.72" font-size="11.00" class="sc-notoserifcjksc">为防止工具变体中出现结果污染，我们为搜索器与抓取器都屏蔽了已知讨论</text><text x="437.89" y="278.72" font-size="11.00" class="sc-loraregular">HLE</text><text x="462.57" y="278.72" font-size="11.00" class="sc-notoserifcjksc">的来源（见附录</text><text x="72.00" y="294.34" font-size="11.00" class="sc-loraregular">8.5</text><text x="86.88" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="166.78 174.46 177.46 183.07 189.63 196.21 202.17 205.07 213.80 220.37 226.93 232.03 234.92 240.88 243.48" y="294.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="252.73" y="294.34" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看起来从</text><text x="453.62" y="294.34" font-size="11.00" class="sc-loraregular">HLE</text><text x="478.30" y="294.34" font-size="11.00" class="sc-notoserifcjksc">专门来源检</text><text x="72.00" y="309.96" font-size="11.00" class="sc-notoserifcjksc">索到答案的记录；经确认的案例将被重新判为错误。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="359.67" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="359.67" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分</text><text x="296.77" y="359.67" font-size="11.00" class="sc-loraregular">56.8%</text><text x="327.58" y="359.67" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="418.48 424.84 430.80 433.15 438.22" y="359.67" font-size="11.00" class="sc-loraregular">64.7%</text><text x="447.79" y="359.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="418.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">BrowseComp</text><text x="143.05" y="418.30" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们让</text><text x="442.94 450.63 453.62 459.23 465.80 472.38 478.34 481.23 491.17 497.03 501.29 507.87 514.31" y="418.30" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="433.92" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="433.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程序化工具调用和代码执行运行。在自适应思考、</text><text x="489.53" y="433.92" font-size="11.00" class="sc-loraregular">max</text><text x="513.76" y="433.92" font-size="11.00" class="sc-notoserifcjksc">推理</text><text x="72.00" y="449.54" font-size="11.00" class="sc-notoserifcjksc">强度和</text><text x="107.89" y="449.54" font-size="11.00" class="sc-loraregular">300</text><text x="130.57" y="449.54" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="144.47 148.73 155.16 160.99 166.95" y="449.54" font-size="11.00" class="sc-loraregular">token</text><text x="176.52" y="449.54" font-size="11.00" class="sc-notoserifcjksc">上限下，</text><text x="220.52 228.21 231.20 236.81 243.38 249.96 255.92 258.81 268.75 274.61 278.87 285.46 291.89 296.98 299.88 306.54 311.23 317.14 322.69 325.78 331.70" y="449.54" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="343.40" y="449.54" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="368.30" y="449.54" font-size="11.00" class="sc-loraregular">86.9%</text><text x="399.47" y="449.54" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="72.00 77.91 84.74 91.57 97.48 100.37 104.63 111.06 116.89 122.85" y="465.16" font-size="11.00" class="sc-loraregular">200k token</text><text x="132.42" y="465.16" font-size="11.00" class="sc-notoserifcjksc">时触发）来突破</text><text x="212.32" y="465.16" font-size="11.00" class="sc-loraregular">100</text><text x="232.88" y="465.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="246.77 251.03 257.46 263.29 269.25" y="465.16" font-size="11.00" class="sc-loraregular">token</text><text x="278.82" y="465.16" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><text x="72.00" y="515.45" font-size="11.00" class="sc-notoserifcjksc">在我们的搜索工具下，我们评估认为该基准测试已接近饱和，因此</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="515.45" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77" y="515.45" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="72.00" y="531.07" font-size="11.00" class="sc-notoserifcjksc">我们最佳的</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.60" y="531.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="215.85" y="531.07" font-size="11.00" class="sc-notoserifcjksc">得分仅带来了适度的准确率提升（</text><text x="380.85" y="531.07" font-size="11.00" class="sc-loraregular">86.9%</text><text x="414.91" y="531.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="428.81 434.99 441.12 443.47 448.54" y="531.07" font-size="11.00" class="sc-loraregular">83.7%</text><text x="458.11" y="531.07" font-size="11.00" class="sc-notoserifcjksc">）。不过，该模</text><text x="72.00" y="546.69" font-size="11.00" class="sc-notoserifcjksc">型以显著更小的</text><text x="151.89 156.15 162.58 168.41 174.38" y="546.69" font-size="11.00" class="sc-loraregular">token</text><text x="183.95" y="546.69" font-size="11.00" class="sc-notoserifcjksc">用量取得了这一得分：</text><text x="293.95 301.64 304.63 310.24 316.80 323.38 329.35 332.24 342.17 348.03 352.29 358.88 365.31 370.41 373.30 379.97 384.65 390.56 396.11 399.21 405.12" y="546.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="416.83" y="546.69" font-size="11.00" class="sc-notoserifcjksc">的最佳结果每个任务使用</text><text x="72.00" y="562.31" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 90.15 96.58 102.42 108.38" y="562.31" font-size="11.00" class="sc-loraregular">token</text><text x="117.95" y="562.31" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="131.84 140.57 147.14 153.71 158.80 161.69 167.66 170.25" y="562.31" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="179.50" y="562.31" font-size="11.00" class="sc-notoserifcjksc">少</text><text x="193.40" y="562.31" font-size="11.00" class="sc-loraregular">4.9×</text><text x="214.25" y="562.31" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="272.15" y="562.31" font-size="11.00" class="sc-loraregular">226k</text><text x="299.12" y="562.31" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="313.01 317.01 319.72 323.72 327.73 337.83 340.72 344.98 351.41 357.24 363.20" y="562.31" font-size="11.00" class="sc-loraregular">1.11M token</text><text x="369.88" y="562.31" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="612.61" font-size="11.00" class="sc-notoserifcjksc">需要注意的一点是预训练污染。尽管我们尽了最大努力加以防范，仍有部分答案已在网上泄露，</text><text x="72.00" y="628.23" font-size="11.00" class="sc-notoserifcjksc">且难以轻易识别，很可能已进入我们的预训练语料。为估计污染程度，我们在不开启思考、不使</text><text x="72.00" y="643.85" font-size="11.00" class="sc-notoserifcjksc">用工具的情况下评估了该模型，得分为</text><text x="261.89 267.56 273.52 276.06 282.89" y="643.85" font-size="11.00" class="sc-loraregular">24.0%</text><text x="292.46" y="643.85" font-size="11.00" class="sc-notoserifcjksc">。尽管如此，其中一些对话记录较长（</text><text x="479.46" y="643.85" font-size="11.00" class="sc-loraregular">&gt;5k</text><text x="72.00 76.26 82.69 88.52 94.48" y="659.47" font-size="11.00" class="sc-loraregular">token</text><text x="72.00" y="675.09" font-size="11.00" class="sc-notoserifcjksc">味着它记忆了答案。若仅限于较短的对话记录（≤</text><text x="314.00 319.99 325.90 328.79 333.05 339.49 345.32 351.28" y="675.09" font-size="11.00" class="sc-loraregular">5k token</text><text x="357.96" y="675.09" font-size="11.00" class="sc-notoserifcjksc">），只有</text><text x="404.85" y="675.09" font-size="11.00" class="sc-loraregular">15.1%</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="72.00" y="140.39" width="57.29" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="129.29" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="132.18" y="140.39" width="21.63" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="153.81" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="156.70" y="140.39" width="28.18" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="72.00" y="409.50" width="68.16" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的答案是正确的；这很可能是基准测试记忆程度的一个更好的上界。在解读该基准测试上的得分</text><text x="72.00" y="404.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 97.77 103.34 105.43 110.23 112.33 117.86 121.34 123.71 129.55 133.80 138.83 146.13 150.50 155.34 161.53 166.63 174.87" y="404.46" font-size="9.00" class="sc-lorabold">6.10.2.A] BrowseComp</text><text x="182.65" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">准确率</text><text x="209.65" y="404.46" font-size="9.00" class="sc-notoserifcjksc">随着我们在上下文压缩的帮助下增加模型可使用的总</text><text x="419.01 422.50 427.76 432.53 437.41" y="404.46" font-size="9.00" class="sc-loraregular">token</text><text x="445.24" y="404.46" font-size="9.00" class="sc-notoserifcjksc">数而提升。</text><text x="72.00" y="451.09" font-size="14.00" class="sc-poppinssemibold">6.11</text><text x="98.07" y="451.09" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="477.64" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="477.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="216.88" y="477.64" font-size="11.00" class="sc-notoserifcjksc">，相比此前的系统卡，我们对多模态评估方法做了三项更改。</text><text x="72.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">第一，在此前的系统卡中，我们在所有多模态能力评估中只为模型提供了一个图像裁剪工具。此</text><text x="72.00" y="541.85" font-size="11.00" class="sc-notoserifcjksc">次，我们提供了一套扩展的</text><text x="206.89 213.72 219.59 223.84 230.43 236.87" y="541.85" font-size="11.00" class="sc-loraregular">Python</text><text x="246.44" y="541.85" font-size="11.00" class="sc-notoserifcjksc">工具：一个预装了常用图像分析库（例如</text><text x="447.33 453.94 457.63" y="541.85" font-size="11.00" class="sc-loraregular">PIL</text><text x="463.99" y="541.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="474.99 483.72 490.29 496.25 502.79 510.48" y="541.85" font-size="11.00" class="sc-loraregular">OpenCV</text><text x="517.67" y="541.85" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="557.47" font-size="11.00" class="sc-notoserifcjksc">代码执行沙箱，以及原有的图像裁剪工具。</text><text x="72.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">第二，我们更新了</text><text x="162.89 170.58 177.17 182.85 186.93 194.07 197.16 202.71 205.61 212.44 218.38 224.05 229.15 235.58 242.26 245.35 252.03" y="607.19" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="261.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="274.90 281.44 288.33 295.17 300.55 307.39 313.35 320.03 325.88 332.47 335.36 341.34 344.43 350.51 359.12" y="607.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="368.90" y="607.19" font-size="11.00" class="sc-notoserifcjksc">的评分模型。在评估我们的模型</text><text x="72.00" y="622.81" font-size="11.00" class="sc-notoserifcjksc">时，我们发现</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25" y="622.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 4</text><text x="357.51 364.05 370.94 377.78 383.16 390.00 395.96 402.64 408.49 415.08 417.97 423.95 427.04 433.12 441.73" y="638.43" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="451.51" y="638.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="465.40 473.09 479.68 485.36 489.44 496.58 499.67" y="638.43" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="72.00 78.83 84.77 90.45 95.54 101.98 108.65 111.74 118.42" y="654.05" font-size="11.00" class="sc-loraregular">Reasoning</text><text x="127.40" y="654.05" font-size="11.00" class="sc-notoserifcjksc">上的得分。因此，我们改用</text><text x="262.29 269.98 272.97 278.58 285.15 291.73 297.69 300.58 306.82 313.25 319.93 326.61 332.49 336.75 339.64 345.60 348.20" y="654.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="357.45" y="654.05" font-size="11.00" class="sc-notoserifcjksc">作为本节所有评估的评分者。</text></svg></div>

<text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第三，我们更新了评分方式，保留被评估模型的思考轨迹，而此前我们会在将对话记录传给评分</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型之前将其移除。我们发现这对得分的影响可以忽略不计。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">为实现公平比较，我们使用扩展后的工具集和新的评分者重新评估了所有此前的模型。下文报告</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的所有得分均为五次运行的平均值。</text><text x="72.00 78.54 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="222.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01" y="222.19" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，测试模型能否正确解读和分析生物学研究论文中复</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">杂科学图表的信息。该基准测试是</text><text x="239.89 245.81 252.38 256.64 263.20 267.89 273.67 282.01 288.45 295.01 300.11" y="237.81" font-size="11.00" class="sc-loraregular">FutureHouse</text><text x="308.96" y="237.81" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="344.86 351.46 357.13 363.81 369.89 376.46 382.13 388.16 394.12 397.02 403.90 409.93 415.89 422.47 426.73 429.62 436.38 439.47 445.90 448.89 455.33 461.63" y="237.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Language Agent Biology</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15" y="253.43" font-size="11.00" class="sc-loraregular" fill="#0000ff">Benchmark</text><text x="130.06" y="253.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="253.43" font-size="11.00" class="sc-loraregular" fill="#0000ff">LAB-Bench</text><text x="198.63" y="253.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="209.63" y="253.43" font-size="11.00" class="sc-notoserifcjksc">的一部分，</text><text x="264.63" y="249.76" font-size="6.60" class="sc-loraregular">26</text><text x="271.99" y="253.43" font-size="11.00" class="sc-notoserifcjksc">后者评估</text><text x="318.88" y="253.43" font-size="11.00" class="sc-loraregular">AI</text><text x="332.35" y="253.43" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务中的能力。</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">在自适应思考、</text><text x="149.00" y="319.34" font-size="11.00" class="sc-loraregular">max</text><text x="173.23" y="319.34" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的情况下，</text><text x="338.23 345.92 348.91 354.52 361.09 367.67 373.63 376.52 386.46 392.32 396.58 403.17 409.60 414.69 417.59 424.25 428.94 434.85 440.40 443.49 449.41" y="319.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="461.11" y="319.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="475.01 480.98 484.07 490.15 498.77" y="319.34" font-size="11.00" class="sc-loraregular">FigQA</text><text x="508.55" y="319.34" font-size="11.00" class="sc-notoserifcjksc">上取</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">得</text><text x="85.89 90.96 97.15 99.50 104.57" y="334.96" font-size="11.00" class="sc-loraregular">79.7%</text><text x="117.03" y="334.96" font-size="11.00" class="sc-notoserifcjksc">的得分。在自适应思考、</text><text x="238.03" y="334.96" font-size="11.00" class="sc-loraregular">max</text><text x="262.27" y="334.96" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="342.16 348.99 354.85 359.11 365.70 372.13" y="334.96" font-size="11.00" class="sc-loraregular">Python</text><text x="381.71" y="334.96" font-size="11.00" class="sc-notoserifcjksc">工具的情况下，</text><text x="458.71 466.39 469.39 475.00 481.56 488.14 494.10 497.00 506.93 512.79 517.05 523.64 530.07" y="334.96" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="350.58" font-size="11.00" class="sc-loraregular" ">[</text><text x="75.47" y="652.11" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 97.77 101.42 103.52 107.17 109.27 114.80 118.28 120.64 126.20 132.21 138.16 142.40 148.35 153.19 158.93 163.59 169.18 171.55 176.59 179.53 184.50 191.21" y="652.11" font-size="9.00" class="sc-lorabold">6.11.1.A] LAB-Bench FigQA</text><text x="199.59" y="652.11" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="226.59" y="652.11" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="309.96" y="652.11" font-size="9.00" class="sc-loraregular">max</text><text x="329.79" y="652.11" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="476.15 481.74 486.54 490.02 495.41 500.68" y="652.11" font-size="9.00" class="sc-loraregular">Python</text><text x="508.51" y="652.11" font-size="9.00" class="sc-notoserifcjksc">工具。</text><text x="72.00" y="663.81" font-size="9.00" class="sc-notoserifcjksc">人类专家基线按原始</text><text x="155.37 160.72 166.36 171.95 176.36 181.95 186.83 192.29 197.08" y="663.81" font-size="9.00" class="sc-loraregular">LAB-Bench</text><text x="204.84" y="663.81" font-size="9.00" class="sc-notoserifcjksc">论文中的报告值显示。得分为五次运行的平均值。图中显示</text><text x="441.21" y="663.81" font-size="9.00" class="sc-loraregular">95%</text><text x="461.51" y="663.81" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="198.05" y="707.20" width="155.69" height="12.80" fill="transparent"/></a><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="344.86" y="229.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="344.86" y="229.01" width="49.27" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><rect x="394.12" y="229.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2407.10362" rel="noopener"><r
