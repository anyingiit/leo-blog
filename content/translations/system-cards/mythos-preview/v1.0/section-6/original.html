<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="72.00 80.34 83.48 88.02 96.35 99.49 104.04 107.41 116.58 125.01 138.51 147.32 155.76 159.19 164.02 171.59 174.73 181.67 185.05 190.82 199.63 206.57 211.41 214.79 221.60 228.08 236.89" y="125.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.10.1 Humanity’s Last Exam</text><text x="72.00 80.34 83.48 88.02 96.35 99.49 106.99 110.36 118.55 123.54 131.83 142.56 149.50 157.51 167.56 175.85 189.35" y="394.22" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.10.2 BrowseComp</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">193</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">6.10</text><text x="102.04" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="149.19" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Humanity’s Last Exam</text><text x="184.88" y="149.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="149.19" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="149.19" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="239.66" y="149.19" font-size="11.00" class="sc-loraregular">“</text><text x="244.06" y="149.19" font-size="11.00" class="sc-notoserifcjksc">一个处于人类知识前沿的多模态基准测试</text><text x="442.06" y="149.19" font-size="11.00" class="sc-loraregular">”</text><text x="445.90" y="149.19" font-size="11.00" class="sc-notoserifcjksc">，包含</text><text x="481.79 487.70 490.47 496.47 503.30" y="149.19" font-size="11.00" class="sc-loraregular">2,500</text><text x="513.03" y="149.19" font-size="11.00" class="sc-notoserifcjksc">道</text><text x="72.00" y="164.81" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="72.00" y="197.77" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="197.77" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="315.88" y="197.77" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="337.88" y="197.77" font-size="11.00" class="sc-loraregular">1</text><text x="341.89" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具），以及（</text><text x="495.89" y="197.77" font-size="11.00" class="sc-loraregular">2</text><text x="501.79" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）使用</text><text x="72.00" y="213.39" font-size="11.00" class="sc-notoserifcjksc">网络搜索、网页抓取、程序化工具调用、代码执行，并每</text><text x="349.89" y="213.39" font-size="11.00" class="sc-loraregular sc-k">50k token</text><text x="403.57" y="213.39" font-size="11.00" class="sc-notoserifcjksc">进行一次上下文压缩</text><text x="72.00" y="229.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="229.01" font-size="11.00" class="sc-loraregular sc-k">context compaction</text><text x="185.52" y="229.01" font-size="11.00" class="sc-notoserifcjksc">），最多至</text><text x="243.41" y="229.01" font-size="11.00" class="sc-loraregular">300</text><text x="266.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="279.99" y="229.01" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="309.15" y="229.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="320.15" y="229.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="406.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="278.72" font-size="11.00" class="sc-notoserifcjksc">为防止工具变体中出现结果污染，我们为搜索器与抓取器都屏蔽了已知讨论</text><text x="437.89" y="278.72" font-size="11.00" class="sc-loraregular">HLE</text><text x="462.57" y="278.72" font-size="11.00" class="sc-notoserifcjksc">的来源（见附录</text><text x="72.00" y="294.34" font-size="11.00" class="sc-loraregular">8.5</text><text x="86.88" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="166.78" y="294.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="252.73" y="294.34" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看起来从</text><text x="453.62" y="294.34" font-size="11.00" class="sc-loraregular">HLE</text><text x="478.30" y="294.34" font-size="11.00" class="sc-notoserifcjksc">专门来源检</text><text x="72.00" y="309.96" font-size="11.00" class="sc-notoserifcjksc">索到答案的记录；经确认的案例将被重新判为错误。</text><text x="72.00" y="359.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="359.67" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分</text><text x="296.77" y="359.67" font-size="11.00" class="sc-loraregular">56.8%</text><text x="327.58" y="359.67" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="418.48" y="359.67" font-size="11.00" class="sc-loraregular sc-k">64.7%</text><text x="447.79" y="359.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="418.30" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">BrowseComp</text><text x="143.05" y="418.30" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们让</text><text x="442.94" y="418.30" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="433.92" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="433.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程序化工具调用和代码执行运行。在自适应思考、</text><text x="489.53" y="433.92" font-size="11.00" class="sc-loraregular">max</text><text x="513.76" y="433.92" font-size="11.00" class="sc-notoserifcjksc">推理</text><text x="72.00" y="449.54" font-size="11.00" class="sc-notoserifcjksc">强度和</text><text x="107.89" y="449.54" font-size="11.00" class="sc-loraregular">300</text><text x="130.57" y="449.54" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="144.47" y="449.54" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="176.52" y="449.54" font-size="11.00" class="sc-notoserifcjksc">上限下，</text><text x="220.52" y="449.54" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="343.40" y="449.54" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="368.30" y="449.54" font-size="11.00" class="sc-loraregular">86.9%</text><text x="399.47" y="449.54" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="72.00" y="465.16" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="132.42" y="465.16" font-size="11.00" class="sc-notoserifcjksc">时触发）来突破</text><text x="212.32" y="465.16" font-size="11.00" class="sc-loraregular">100</text><text x="232.88" y="465.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="246.77" y="465.16" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="278.82" y="465.16" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><text x="72.00" y="515.45" font-size="11.00" class="sc-notoserifcjksc">在我们的搜索工具下，我们评估认为该基准测试已接近饱和，因此</text><text x="393.89" y="515.45" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="516.77" y="515.45" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="72.00" y="531.07" font-size="11.00" class="sc-notoserifcjksc">我们最佳的</text><text x="129.89" y="531.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="215.85" y="531.07" font-size="11.00" class="sc-notoserifcjksc">得分仅带来了适度的准确率提升（</text><text x="380.85" y="531.07" font-size="11.00" class="sc-loraregular">86.9%</text><text x="414.91" y="531.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="428.81" y="531.07" font-size="11.00" class="sc-loraregular sc-k">83.7%</text><text x="458.11" y="531.07" font-size="11.00" class="sc-notoserifcjksc">）。不过，该模</text><text x="72.00" y="546.69" font-size="11.00" class="sc-notoserifcjksc">型以显著更小的</text><text x="151.89" y="546.69" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="183.95" y="546.69" font-size="11.00" class="sc-notoserifcjksc">用量取得了这一得分：</text><text x="293.95" y="546.69" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="416.83" y="546.69" font-size="11.00" class="sc-notoserifcjksc">的最佳结果每个任务使用</text><text x="72.00" y="562.31" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="562.31" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="117.95" y="562.31" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="131.84" y="562.31" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="179.50" y="562.31" font-size="11.00" class="sc-notoserifcjksc">少</text><text x="193.40" y="562.31" font-size="11.00" class="sc-loraregular">4.9×</text><text x="214.25" y="562.31" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="272.15" y="562.31" font-size="11.00" class="sc-loraregular">226k</text><text x="299.12" y="562.31" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="313.01" y="562.31" font-size="11.00" class="sc-loraregular sc-k">1.11M token</text><text x="369.88" y="562.31" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="612.61" font-size="11.00" class="sc-notoserifcjksc">需要注意的一点是预训练污染。尽管我们尽了最大努力加以防范，仍有部分答案已在网上泄露，</text><text x="72.00" y="628.23" font-size="11.00" class="sc-notoserifcjksc">且难以轻易识别，很可能已进入我们的预训练语料。为估计污染程度，我们在不开启思考、不使</text><text x="72.00" y="643.85" font-size="11.00" class="sc-notoserifcjksc">用工具的情况下评估了该模型，得分为</text><text x="261.89" y="643.85" font-size="11.00" class="sc-loraregular sc-k">24.0%</text><text x="292.46" y="643.85" font-size="11.00" class="sc-notoserifcjksc">。尽管如此，其中一些对话记录较长（</text><text x="479.46" y="643.85" font-size="11.00" class="sc-loraregular">&gt;5k</text><text x="72.00" y="659.47" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="675.09" font-size="11.00" class="sc-notoserifcjksc">味着它记忆了答案。若仅限于较短的对话记录（≤</text><text x="314.00" y="675.09" font-size="11.00" class="sc-loraregular sc-k">5k token</text><text x="357.96" y="675.09" font-size="11.00" class="sc-notoserifcjksc">），只有</text><text x="404.85" y="675.09" font-size="11.00" class="sc-loraregular">15.1%</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="72.00" y="140.39" width="57.29" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="129.29" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="132.18" y="140.39" width="21.63" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="153.81" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="156.70" y="140.39" width="28.18" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="72.00" y="409.50" width="68.16" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的答案是正确的；这很可能是基准测试记忆程度的一个更好的上界。在解读该基准测试上的得分</text><text x="72.00" y="404.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 97.77 103.34 105.43 110.23 112.33 117.86 121.34 123.71 129.55 133.80 138.83 146.13 150.50 155.34 161.53 166.63 174.87" y="404.46" font-size="9.00" class="sc-lorabold">6.10.2.A] BrowseComp</text><text x="182.65" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">准确率</text><text x="209.65" y="404.46" font-size="9.00" class="sc-notoserifcjksc">随着我们在上下文压缩的帮助下增加模型可使用的总</text><text x="419.01" y="404.46" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="445.24" y="404.46" font-size="9.00" class="sc-notoserifcjksc">数而提升。</text><text x="72.00" y="451.09" font-size="14.00" class="sc-poppinssemibold">6.11</text><text x="98.07" y="451.09" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="477.64" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="477.64" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="216.88" y="477.64" font-size="11.00" class="sc-notoserifcjksc">，相比此前的系统卡，我们对多模态评估方法做了三项更改。</text><text x="72.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">第一，在此前的系统卡中，我们在所有多模态能力评估中只为模型提供了一个图像裁剪工具。此</text><text x="72.00" y="541.85" font-size="11.00" class="sc-notoserifcjksc">次，我们提供了一套扩展的</text><text x="206.89" y="541.85" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="246.44" y="541.85" font-size="11.00" class="sc-notoserifcjksc">工具：一个预装了常用图像分析库（例如</text><text x="447.33" y="541.85" font-size="11.00" class="sc-loraregular sc-k">PIL</text><text x="463.99" y="541.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="474.99" y="541.85" font-size="11.00" class="sc-loraregular sc-k">OpenCV</text><text x="517.67" y="541.85" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="557.47" font-size="11.00" class="sc-notoserifcjksc">代码执行沙箱，以及原有的图像裁剪工具。</text><text x="72.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">第二，我们更新了</text><text x="162.89" y="607.19" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="261.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="274.90 281.44 288.33 295.17 300.55 307.39 313.35 320.03 325.88 332.47 335.36 341.34 344.43 350.51 359.12" y="607.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="368.90" y="607.19" font-size="11.00" class="sc-notoserifcjksc">的评分模型。在评估我们的模型</text><text x="72.00" y="622.81" font-size="11.00" class="sc-notoserifcjksc">时，我们发现</text><text x="140.89" y="622.81" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4</text><text x="357.51 364.05 370.94 377.78 383.16 390.00 395.96 402.64 408.49 415.08 417.97 423.95 427.04 433.12 441.73" y="638.43" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="451.51" y="638.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="465.40" y="638.43" font-size="11.00" class="sc-loraregular sc-k">CharXiv</text><text x="72.00" y="654.05" font-size="11.00" class="sc-loraregular sc-k">Reasoning</text><text x="127.40" y="654.05" font-size="11.00" class="sc-notoserifcjksc">上的得分。因此，我们改用</text><text x="262.29" y="654.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="357.45" y="654.05" font-size="11.00" class="sc-notoserifcjksc">作为本节所有评估的评分者。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="72.00 80.34 83.48 88.02 92.57 95.70 100.25 103.63 109.40 118.46 126.65 134.25 142.44 150.46 158.89 166.69 175.12 178.50 185.20 188.63 197.44 207.67" y="198.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.11.1 LAB-Bench FigQA</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">26</text><text x="81.32 87.32 92.41 98.38 102.64 108.06 114.04 117.90 120.43 123.06 126.58 129.04 131.67 140.85 143.30 145.83 148.46 153.81 157.68 160.31 165.47 168.18 170.64 173.27 176.32 181.69 187.83 192.97 198.27 201.32 203.78 206.41 212.36 218.61 224.83 229.56 235.78 241.20 247.26 252.58 258.57 261.07 263.70 272.80 278.20 283.36 287.99 293.95 298.28 301.09 307.16 312.69 315.32 320.61 325.77 331.74 336.90 342.72 345.52 348.24 351.21 355.08 357.89 363.31 367.94 370.56 376.36 379.74 382.37 385.09 390.25 396.31 401.84 407.81 412.97 418.45 423.86 426.49 435.43 441.28 447.25 452.67 455.39 460.02 462.65 465.98 471.82 476.15 478.78 484.60 487.41 493.26 495.97 501.82 507.55" y="704.45" font-size="10.00" class="sc-loraregular">Laurent, J. M., et al. (2024). LAB-Bench: Measuring capabilities of language models for biology</text><text x="72.00 76.26 81.68 86.30 91.70 96.86 101.12 106.44 112.42 114.88 117.51 122.67 126.38 132.87 135.67 140.72 143.22 148.37 153.79 159.77 163.94 166.40 170.04 176.25 181.82 187.59 192.96" y="717.26" font-size="10.00" class="sc-loraregular">research. arXiv:2407.10362.</text><text x="198.05 203.95 207.92 211.78 217.75 222.38 224.88 228.57 235.02 240.18 244.51 249.81 252.62 257.27 259.73 265.58 269.86 275.39 281.84 287.00 292.82 297.10 304.00 309.14 314.56 320.55 324.72 327.18 330.81 337.02 342.59 348.37" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2407.10362</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第三，我们更新了评分方式，保留被评估模型的思考轨迹，而此前我们会在将对话记录传给评分</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型之前将其移除。我们发现这对得分的影响可以忽略不计。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">为实现公平比较，我们使用扩展后的工具集和新的评分者重新评估了所有此前的模型。下文报告</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的所有得分均为五次运行的平均值。</text><text x="72.00 78.54 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="222.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01" y="222.19" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，测试模型能否正确解读和分析生物学研究论文中复</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">杂科学图表的信息。该基准测试是</text><text x="239.89" y="237.81" font-size="11.00" class="sc-loraregular sc-k">FutureHouse</text><text x="308.96" y="237.81" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="344.86" y="237.81" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Language Agent Biology</text><text x="72.00" y="253.43" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Benchmark</text><text x="130.06" y="253.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="253.43" font-size="11.00" class="sc-loraregular" fill="#0000ff">LAB-Bench</text><text x="198.63" y="253.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="209.63" y="253.43" font-size="11.00" class="sc-notoserifcjksc">的一部分，</text><text x="264.63" y="249.76" font-size="6.60" class="sc-loraregular">26</text><text x="271.99" y="253.43" font-size="11.00" class="sc-notoserifcjksc">后者评估</text><text x="318.88" y="253.43" font-size="11.00" class="sc-loraregular">AI</text><text x="332.35" y="253.43" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务中的能力。</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">在自适应思考、</text><text x="149.00" y="319.34" font-size="11.00" class="sc-loraregular">max</text><text x="173.23" y="319.34" font-size="11.00" class="sc-notoserifcjksc">推理强度且不使用工具的情况下，</text><text x="338.23" y="319.34" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="461.11" y="319.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="475.01" y="319.34" font-size="11.00" class="sc-loraregular sc-k">FigQA</text><text x="508.55" y="319.34" font-size="11.00" class="sc-notoserifcjksc">上取</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">得</text><text x="85.89" y="334.96" font-size="11.00" class="sc-loraregular sc-k">79.7%</text><text x="117.03" y="334.96" font-size="11.00" class="sc-notoserifcjksc">的得分。在自适应思考、</text><text x="238.03" y="334.96" font-size="11.00" class="sc-loraregular">max</text><text x="262.27" y="334.96" font-size="11.00" class="sc-notoserifcjksc">推理强度并使用</text><text x="342.16" y="334.96" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="381.71" y="334.96" font-size="11.00" class="sc-notoserifcjksc">工具的情况下，</text><text x="458.71" y="334.96" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="350.58" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="350.58" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="140.42" y="350.58" font-size="11.00" class="sc-loraregular sc-k">89.0%</text><text x="174.54" y="350.58" font-size="11.00" class="sc-notoserifcjksc">的得分。在两种设置下，</text><text x="295.54" y="350.58" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="418.42" y="350.58" font-size="11.00" class="sc-notoserifcjksc">均优于</text><text x="454.32" y="350.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="366.20" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="86.92" y="366.20" font-size="11.00" class="sc-notoserifcjksc">，后者分别得分</text><text x="166.81" y="366.20" font-size="11.00" class="sc-loraregular">58.5%</text><text x="200.15" y="366.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="214.04" y="366.20" font-size="11.00" class="sc-loraregular">75.1%</text><text x="241.39" y="366.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="252.39" y="366.20" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="347.55" y="366.20" font-size="11.00" class="sc-notoserifcjksc">在相同设置下得分</text><text x="438.44" y="366.20" font-size="11.00" class="sc-loraregular sc-k">59.3%</text><text x="471.92" y="366.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="485.81" y="366.20" font-size="11.00" class="sc-loraregular sc-k">76.7%</text><text x="514.23" y="366.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="652.11" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="652.11" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 97.77 101.42 103.52 107.17 109.27 114.80 118.28 120.64 126.20 132.21 138.16 142.40 148.35 153.19 158.93 163.59 169.18 171.55 176.59 179.53 184.50 191.21" y="652.11" font-size="9.00" class="sc-lorabold">6.11.1.A] LAB-Bench FigQA</text><text x="199.59" y="652.11" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="226.59" y="652.11" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="309.96" y="652.11" font-size="9.00" class="sc-loraregular">max</text><text x="329.79" y="652.11" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="476.15" y="652.11" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="508.51" y="652.11" font-size="9.00" class="sc-notoserifcjksc">工具。</text><text x="72.00" y="663.81" font-size="9.00" class="sc-notoserifcjksc">人类专家基线按原始</text><text
