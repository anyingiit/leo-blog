.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">能力</text><text x="72.00" y="127.79" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">本节报告</text><text x="118.89" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="241.77" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在推理、编程、智能体任务、数学、长上下文和知识工作方面</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的评估。网络安全能力在第</text><text x="206.89" y="169.98" font-size="11.00" class="sc-loraregular">3</text><text x="215.91" y="169.98" font-size="11.00" class="sc-notoserifcjksc">节中介绍。</text><text x="72.00" y="219.14" font-size="11.00" class="sc-notoserifcjksc">此处评估的许多能力也与模型安全相关；部分评估也见于第</text><text x="360.89" y="219.14" font-size="11.00" class="sc-loraregular">2</text><text x="369.69" y="219.14" font-size="11.00" class="sc-notoserifcjksc">节，我们在该节中讨论与我们的负</text><text x="72.00" y="234.76" font-size="11.00" class="sc-notoserifcjksc">责任扩展政策（</text><text x="149.00" y="234.76" font-size="11.00" class="sc-loraregular sc-k">Responsible Scaling Policy</text><text x="283.16" y="234.76" font-size="11.00" class="sc-notoserifcjksc">）相关的评估。</text><text x="72.00" y="283.89" font-size="11.00" class="sc-notoserifcjksc">我们首先讨论与我们所使用的若干评估基准测试相关的污染问题。随后，我们提供一张汇总表，</text><text x="72.00" y="299.51" font-size="11.00" class="sc-notoserifcjksc">在多项评估上将</text><text x="151.89" y="299.51" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="274.77" y="299.51" font-size="11.00" class="sc-notoserifcjksc">与其他</text><text x="310.67" y="299.51" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="364.50" y="299.51" font-size="11.00" class="sc-notoserifcjksc">模型及第三方模型进行比较，之后是</text><text x="72.00" y="315.13" font-size="11.00" class="sc-notoserifcjksc">各项评估的说明和方法细节。对于同样曾在</text><text x="283.89" y="315.13" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="369.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc">上运行过的评估，我们沿用</text><text x="501.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其系统</text><text x="72.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc">中的说明，并注明任何变更。</text><text x="72.00" y="398.64" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97" y="398.64" font-size="14.00" class="sc-notosanscjkscbold">污染</text><text x="72.00" y="440.82" font-size="11.00" class="sc-notoserifcjksc">数。我们采取了若干步骤对评估进行去污染；完整方法见</text><text x="349.89" y="440.82" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.5</text><text x="435.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="468.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="482.49" y="440.82" font-size="11.00" class="sc-loraregular">2.2</text><text x="499.90" y="440.82" font-size="11.00" class="sc-notoserifcjksc">节。对</text><text x="72.00" y="538.55" font-size="11.00" class="sc-notoserifcjksc">下面，我们讨论污染问题尤为突出的三项评估。</text><text x="72.00" y="585.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1 SWE-bench</text><text x="183.01" y="585.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估</text><text x="72.00" y="613.36" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="211.36" y="613.36" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="222.36" y="613.36" font-size="11.00" class="sc-loraregular">Multilingual</text><text x="286.34" y="613.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.23" y="613.36" font-size="11.00" class="sc-loraregular sc-k">Pro</text><text x="72.00" y="628.98" font-size="11.00" class="sc-notoserifcjksc">现训练数据中的解答，而不是独立推导出解答。我们在所有试验上运行了多个过滤器，在一系列</text><text x="72.00" y="644.60" font-size="11.00" class="sc-notoserifcjksc">阈值下剔除被标记的问题。在这一过滤后的子集上重新评分并不会改变</text><text x="415.89" y="644.60" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的排名，而且在排除被标记的问题之后，它相对于</text><text x="316.89" y="660.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="402.85" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的大幅提升仍然存在。在公</text><text x="72.00" y="675.84" font-size="11.00" class="sc-notoserifcjksc">开和私有的智能体编程基准测试上，以及在这些评估的干净划分和完整划分上，提升都一致，这</text><text x="72.00" y="691.46" font-size="11.00" class="sc-notoserifcjksc">表明</text><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="534.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="72.00" y="321.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="385.29" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="388.18" y="432.02" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="415.15" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="418.04" y="432.02" width="14.66" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="432.70" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="435.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">记忆并不是</text><text x="129.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="252.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="266.67" y="82.61" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="330.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估中取得提升的主要原因。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">每个基准测试的问题都取自开源代码仓库，因此其内容可能出现在训练语料中。我们进行了语料</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级去污染，但仍在全部三个基准测试中观察到一些记忆的迹象。例如，在某个问题中，模型生成</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的补丁复现了参考解答中完全相同的辅助函数，尽管它先是独立地推导、构建并测试了一个解</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">答，然后似乎才在最后</text><text x="182.00" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="186.40" y="178.05" font-size="11.00" class="sc-notoserifcjksc">回忆起</text><text x="219.40" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="223.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">真值补丁。</text><text x="278.24" y="178.05" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="319.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">也针对</text><text x="461.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">记录了</text><text x="494.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc">类似的担</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">忧。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">为了检测记忆，我们使用一个基于</text><text x="239.89" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="278.18" y="260.72" font-size="11.00" class="sc-notoserifcjksc">的审计模型，将每个模型生成的补丁与标准补丁进行</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">比较，并给出一个</text><text x="162.89 166.51 173.17 175.94 178.83 182.69" y="276.34" font-size="11.00" class="sc-loraregular">[0, 1]</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">问题约束下都会写出的重合部分。另有一项基于规则的补充检查，会标记与参考解答之间大量逐</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">字重合的注释。我们对所有模型的每一次尝试都运行这两种检测器，只要有任何一次尝试被标</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">记，就将该问题标为可能被记忆。剔除所有模型和所有尝试中被标记问题的并集，对</text><text x="481.89" y="338.82" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="354.44" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="354.44" font-size="11.00" class="sc-notoserifcjksc">而言是一种保守做法：它同时也剔除了任一基线模型（</text><text x="420.59" y="354.44" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="468.25" y="354.44" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="482.15" y="354.44" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="370.06" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.5</text><text x="125.72" y="370.06" font-size="11.00" class="sc-notoserifcjksc">）可能记忆过的问题。</text><text x="72.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">事后识别记忆本质上只能是近似的。因此，我们在审计模型决策阈值的整个取值范围内进行扫</text><text x="72.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">描，而不是只采用单一的截断值。在过滤严格程度的整个范围内，</text><text x="391.00" y="470.64" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="513.88" y="470.64" font-size="11.00" class="sc-notoserifcjksc">在每</text><text x="72.00" y="486.26" font-size="11.00" class="sc-notoserifcjksc">个基准测试上都保持着对</text><text x="195.89" y="486.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="281.85" y="486.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.74" y="486.26" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="390.90" y="486.26" font-size="11.00" class="sc-notoserifcjksc">的显著领先。</text><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="461.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="72.00 80.34 83.48 90.97 94.11 101.60 104.98 115.03 123.46 132.28 137.27 145.84 149.27 156.76 160.14 168.35 176.37 185.18 192.12 200.41 208.85 212.28 220.71" y="606.17" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.2.2 CharXiv Reasoning</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="325.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="325.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 104.66 106.76 112.29 115.77 118.13 123.44 132.59 138.08 142.32 147.47 152.32 158.06 162.72" y="325.03" font-size="9.00" class="sc-lorabold">6.2.1.A] SWE-bench</text><text x="170.68" y="325.03" font-size="9.00" class="sc-notoserifcjkscbold">评估通过率与记忆过滤阈值的关系。</text><text x="314.68" y="325.03" font-size="9.00" class="sc-notoserifcjksc">上图展示了</text><text x="362.04" y="325.03" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="460.22" y="325.03" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="469.22" y="325.03" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="72.00" y="336.73" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="83.37" y="336.73" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="161.23" y="336.73" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="257.25" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="266.25" y="336.73" font-size="9.00" class="sc-loraregular">n=500</text><text x="292.56" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）、</text><text x="310.56" y="336.73" font-size="9.00" class="sc-loraregular">Multilingual</text><text x="360.54" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="369.54" y="336.73" font-size="9.00" class="sc-loraregular sc-k">n=297</text><text x="393.74" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="414.11" y="336.73" font-size="9.00" class="sc-loraregular sc-k">Pro</text><text x="428.66" y="336.73" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="437.66" y="336.73" font-size="9.00" class="sc-loraregular sc-k">n=731</text><text x="460.02" y="336.73" font-size="9.00" class="sc-notoserifcjksc">）上的通过率随过</text><text x="72.00" y="348.43" font-size="9.00" class="sc-notoserifcjksc">滤严格程度的变化。每个模型都在如下问题子集上重新评分：按任一模型计，审计模型给出的记忆概率均</text><text x="488.37" y="348.43" font-size="9.00" class="sc-notoserifcjksc">≤</text><text x="499.73" y="348.43" font-size="9.00" class="sc-loraregular">x</text><text x="506.87" y="348.43" font-size="9.00" class="sc-notoserifcjksc">轴取</text><text x="72.00" y="360.13" font-size="9.00" class="sc-notoserifcjksc">值。柱形表示在每个阈值下保留的问题数量。在阈值</text><text x="281.37" y="360.13" font-size="9.00" class="sc-loraregular sc-k">1.0</text><text x="292.31" y="360.13" font-size="9.00" class="sc-notoserifcjksc">（最右侧）时，所有问题均被保留，曲线与表</text><text x="474.68" y="360.13" font-size="9.00" class="sc-loraregular">6.3.A</text><text x="497.32" y="360.13" font-size="9.00" class="sc-notoserifcjksc">中的主要</text><text x="72.00" y="371.83" font-size="9.00" class="sc-notoserifcjksc">成绩一致；向左移动会剔除被判定为越来越可能被记忆的问题。在整个阈值范围内，在全部三个基准测试上，</text><text x="504.00" y="371.83" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="383.53" font-size="9.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="141.21" y="383.53" font-size="9.00" class="sc-notoserifcjksc">都保持着对两个基线的显著领先。在我们的参考阈值</text><text x="350.58" y="383.53" font-size="9.00" class="sc-loraregular sc-k">0.7</text><text x="362.10" y="383.53" font-size="9.00" class="sc-notoserifcjksc">（一个有意设定的高召回率设置，会剔除每</text><text x="72.00" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个基准测试</text><text x="119.37" y="395.23" font-size="9.00" class="sc-loraregular">8–15%</text><text x="148.11" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的问题）下，</text><text x="202.11" y="395.23" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="302.65" y="395.23" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="332.02" y="395.23" font-size="9.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="371.02" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的领先幅度最多缩小</text><text x="454.38" y="395.23" font-size="9.00" class="sc-loraregular">3.5</text><text x="468.88" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个百分点。最左侧</text><text x="72.00" y="406.93" font-size="9.00" class="sc-notoserifcjksc">的不稳定是在通过过滤的问题少于约</text><text x="218.37" y="406.93" font-size="9.00" class="sc-loraregular">30</text><text x="231.34" y="406.93" font-size="9.00" class="sc-notoserifcjksc">个时出现的小样本噪声。随着记忆过滤放宽、更多被标记的问题被加回，</text><text x="72.00" y="418.63" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="172.54" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率大致保持稳定，而</text><text x="282.91" y="418.63" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="353.23" y="418.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="364.60" y="418.63" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="442.46" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率则有所下降。</text><text x="72.00" y="430.33" font-size="9.00" class="sc-notoserifcjksc">这与以下情况相符：</text><text x="153.00" y="430.33" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="253.54" y="430.33" font-size="9.00" class="sc-notoserifcjksc">记忆了一些较难的被标记问题，而这些问题基线模型并未独立解出。</text><text x="72.00" y="523.06" font-size="11.00" class="sc-notoserifcjksc">我们的检测器并不完美，但这一结果对阈值的选择是稳健的，并且与</text><text x="404.89" y="523.06" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="527.77" y="523.06" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="538.68" font-size="11.00" class="sc-notoserifcjksc">任何训练语料中都不存在的内部基准测试上的提升相一致。我们的结论是，记忆并不能解释它在</text><text x="72.00" y="554.30" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="135.56" y="554.30" font-size="11.00" class="sc-notoserifcjksc">上的提升。</text><text x="72.00" y="630.25" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="170.11" y="630.25" font-size="11.00" class="sc-notoserifcjksc">是我们在第</text><text x="228.00" y="630.25" font-size="11.00" class="sc-loraregular">6.11.3</text><text x="256.80" y="630.25" font-size="11.00" class="sc-notoserifcjksc">节中为</text><text x="292.69" y="630.25" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="415.57" y="630.25" font-size="11.00" class="sc-notoserifcjksc">报告的一项基准测试。</text><text x="72.00" y="645.87" font-size="11.00" class="sc-loraregular sc-k">CharXiv</text><text x="290.22" y="645.87" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="72.00" y="661.49" font-size="11.00" class="sc-notoserifcjksc">模的预训练语料中，本质上难以完全去污染。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用两种互补的方法来检测</text><text x="228.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的污染。我们挑选答案文本具有独特性的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">估条目，在完整的预训练数据混合中</text><text x="250.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">grep</text><text x="277.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">精确匹配，并另行搜索评估图像。尽管对评估图像进</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行了稳健的图像级过滤，我们仍确认大多数问答文本对出现在语料中。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">为了估计污染的影响，我们为基准测试的一个子集构建了留出变体：我们手动扰动每个问题或图</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">像，并比较原版与改编版的准确率。例如，我们要求模型识别某个图表标签而不是另一个，或者</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">识别第二低而不是第二高的数据系列，从而使正确答案发生变化，同时难度大致保持不变。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.80 107.90 113.44 116.91 119.28 125.47 131.06 135.77 139.61 145.90 148.78 153.62 155.99 162.04 166.88 171.59 175.96 181.05 186.80 189.74 195.48" y="556.05" font-size="9.00" class="sc-lorabold">6.2.2.A] CharXiv Reasoning</text><text x="200.49" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">（子集）分数。</text><text x="263.49" y="556.05" font-size="9.00" class="sc-notoserifcjksc">我们在原始</text><text x="310.86" y="556.05" font-size="9.00" class="sc-loraregular sc-k">CharXiv</text><text x="345.81" y="556.05" font-size="9.00" class="sc-notoserifcjksc">基准测试的一个问题子集上评估各模型，同时使</text><text x="72.00" y="567.75" font-size="9.00" class="sc-notoserifcjksc">用原始问答对和难度与歧义程度大致相当的手动改写变体。</text><text x="306.00" y="567.75" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="406.54" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在自适应思考（</text><text x="469.54" y="567.75" font-size="9.00" class="sc-loraregular sc-k">adaptive</text><text x="72.00" y="579.45" font-size="9.00" class="sc-loraregular">thinking</text><text x="106.67" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="127.04" y="579.45" font-size="9.00" class="sc-loraregular">max</text><text x="146.86" y="579.45" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="191.86" y="579.45" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="215.58" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）下进行评估。</text><text x="278.58" y="579.45" font-size="9.00" class="sc-loraregular sc-k">Gemini 3.1 Pro Preview</text><text x="376.64" y="579.45" font-size="9.00" class="sc-notoserifcjksc">在默认的动态思考档位</text><text x="466.64" y="579.45" font-size="9.00" class="sc-loraregular sc-k">“high”</text><text x="491.68" y="579.45" font-size="9.00" class="sc-notoserifcjksc">下进行评</text><text x="72.00" y="591.15" font-size="9.00" class="sc-notoserifcjksc">估。</text><text x="90.00" y="591.15" font-size="9.00" class="sc-loraregular sc-k">GPT-5.4 Pro</text><text x="143.17" y="591.15" font-size="9.00" class="sc-notoserifcjksc">在推理设置为</text><text x="197.17" y="591.15" font-size="9.00" class="sc-loraregular sc-k">“high”</text><text x="222.21" y="591.15" font-size="9.00" class="sc-notoserifcjksc">的情况下进行评估。</text><text x="72.00" y="634.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="634.83" font-size="11.00" class="sc-loraregular sc-k">CharXiv</text><text x="128.61" y="634.83" font-size="11.00" class="sc-notoserifcjksc">的一个包含</text><text x="186.50" y="634.83" font-size="11.00" class="sc-loraregular">100</text><text x="207.06" y="634.83" font-size="11.00" class="sc-notoserifcjksc">个条目的改编版上，</text><text x="306.06" y="634.83" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="426.05" y="634.83" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="437.05" y="634.83" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="72.00" y="650.45" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="650.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42" y="650.45" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4 Pro</text><text x="194.41" y="650.45" font-size="11.00" class="sc-notoserifcjksc">在改编版上的得分均高于在对应原始子集上的得分。这表明原始基准测</text><text x="72.00" y="666.07" font-size="11.00" class="sc-notoserifcjksc">试上可归因于记忆的表现是有限的。我们的结论是，污染不太可能对</text><text x="404.89" y="666.07" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="527.77" y="666.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="681.69" font-size="11.00" class="sc-loraregular sc-k">CharXiv</text><text x="114.71" y="681.69" font-size="11.00" class="sc-notoserifcjksc">上的表现有实质性贡献。</text></svg></div>

oraregular">6.11</text><text x="488.04" y="111.05" font-size="11.00" class="sc-notoserifcjksc">节中）报</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">告的一项基准测试。与</text><text x="184.89" y="126.67" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="283.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="316.00 326.10 336.20 346.30 354.47 359.85 366.51 371.20" y="126.67" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="380.53" y="126.67" font-size="11.00" class="sc-notoserifcjksc">由来自广泛传播的公开材料的内</text><text x="72.00" y="191.98" font-size="11.00" class="sc-notoserifcjksc">我们发现，</text><text x="127.00 137.10 147.20 157.29 165.47 170.85 177.51 182.20" y="191.98" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="191.53" y="191.98" font-size="11.00" class="sc-notoserifcjksc">中有很大一部分图像出现在训练数据中，主要是通过教科书、作业辅导</text><text x="72.00" y="207.60" font-size="11.00" class="sc-notoserifcjksc">网站和文档爬取，这些来源会对底层原始内容进行重新包装和分发。</text><text x="72.00" y="256.77" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="256.77" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="184.00" y="256.77" font-size="11.00" class="sc-notoserifcjksc">不同，</text><text x="217.00 227.10 237.20 247.30 255.47 260.85 267.51 272.20" y="256.77" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="281.53" y="256.77" font-size="11.00" class="sc-notoserifcjksc">中只有数量有限的问题能够方便地构造出难度大致相</text><text x="72.00" y="272.39" font-size="11.00" class="sc-notoserifcjksc">当的变体。</text><text x="127.00 137.10 147.20 157.29 165.47 170.85 177.51 182.20" y="272.39" font-size="11.00" class="sc-loraregular">MMMU-Pro</text><text x="191.53" y="272.39" font-size="11.00" class="sc-notoserifcjksc">包含少量图表，但只研究这一问题子集会呈现出有偏差的图景。鉴于难</text><text x="72.00" y="288.01" font-size="11.00" class="sc-notoserifcjksc">以确定污染的影响，我们选择在本系统卡中略去</text><text x="305.89 315.99 326.09 336.19 344.36 349. 6.08" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="243.41" y="466.08" font-size="9.00" class="sc-notoserifcjksc">标出。竞品数据取自各开发方公开发布的系统卡或基准测试排行榜。早期</text><text x="72.00" y="477.77" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="103.33" y="477.77" font-size="9.00" class="sc-notoserifcjksc">模型的评估细节参见</text><text x="186.70" y="477.77" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="257.02" y="477.77" font-size="9.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="284.02" y="477.77" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="293.02" y="477.77" font-size="9.00" class="sc-loraregular">*</text><text x="297.70" y="477.77" font-size="9.00" class="sc-notoserifcjksc">对于</text><text x="318.07 323.39 328.27 332.16 340.21 342.74 348.20 352.85 355.29 359.69 365.29 370.17 375.63 380.42 385.81 388.18 393.01 395.09" y="477.77" font-size="9.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="400.68" y="477.77" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="409.68" y="477.77" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="443.56" y="477.77" font-size="9.00" class="sc-notoserifcjksc">的报告得分使用了专门</text><text x="72.00" y="489.48" font-size="9.00" class="sc-notoserifcjksc">的运行框架（</text><text x="126.00" y="489.48" font-size="9.00" class="sc-loraregular">harness</text><text x="158.61" y="489.48" font-size="9.00" class="sc-notoserifcjksc">），因此该行中各模型之间的比较并不精确。其他所有得分均使用</text><text x="421.97" y="489.48" font-size="9.00" class="sc-loraregular sc-k">Terminus-2</text><text x="472.96" y="489.48" font-size="9.00" class="sc-notoserifcjksc">运行框架。</text><text x="72.00" y="555.57" font-size="14.00" class="sc-poppinssemibold">6.4 SWE-bench Verified</text><text x="239.05" y="555.57" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="253.05" y="555.57" font-size="14.00" class="sc-poppinssemibold">Pro</text><text x="276.15" y="555.57" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="290.15" y="555.57" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="377.70" y="555.57" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="395.04" y="555.57" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00" y="582.13" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="132.67" y="582.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="143.67" y="582.13" font-size="11.00" class="sc-loraregular sc-k">Software Engineering Bench</text><text x="289.43" y="582.13" font-size="11.00" class="sc-notoserifcjksc">）在真实世界软件工程任务上测试</text><text x="457.32" y="582.13" font-size="11.00" class="sc-loraregular">AI</text><text x="470.78" y="582.13" font-size="11.00" class="sc-notoserifcjksc">模型。我们报</text><text x="72.00" y="597.75" font-size="11.00" class="sc-notoserifcjksc">告四个变体：</text><text x="211.47" y="630.70" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="222.47" y="630.70" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="260.98" y="630.70" font-size="11.00" class="sc-notoserifcjksc">）是一个包含</text><text x="329.87" y="630.70" font-size="11.00" class="sc-loraregular">500</text><text x="352.42" y="630.70" font-size="11.00" class="sc-notoserifcjksc">道题的子集，每道题均经人类工程师验</text><text x="108.00" y="646.32" font-size="11.00" class="sc-notoserifcjksc">证为可解。</text><text x="163.00" y="646.32" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="285.88" y="646.32" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="310.77" y="646.32" font-size="11.00" class="sc-loraregular">93.9%</text><text x="341.89" y="646.32" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="366.79" y="646.32" font-size="11.00" class="sc-loraregular">5</text><text x="375.67" y="646.32" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="108.00" y="663.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">SWE-bench Pro</text><text x="189.35" y="663.08" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="200.35" y="663.08" font-size="11.00" class="sc-loraregular sc-k">Scale</text><text x="227.04" y="663.08" font-size="11.00" class="sc-notoserifcjksc">）是一个更难的变体：题目取自持续维护的代码仓库，涉及更大</text><text x="108.00" y="678.70" font-size="11.00" class="sc-notoserifcjksc">的多文件</text><text x="154.89" y="678.70" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="172.11" y="678.70" font-size="11.00" class="sc-notoserifcjksc">，且不存在公开的真值泄露。</text><text x="315.11" y="678.70" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="437.99" y="678.70" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="462.88" y="678.70" font-size="11.00" class="sc-loraregular sc-k">77.8%</text><text x="491.00" y="678.70" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="515.89" y="678.70" font-size="11.00" class="sc-loraregular">5</text><text x="524.78" y="678.70" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="108.00" y="694.32" font-size="11.00" class="sc-notoserifcjksc">试验的平均值。</text><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="186.70" y="470.58" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="186.70" y="470.58" width="28.96" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="215.66" y="470.58" width="2.37" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="218.03" y="470.58" width="22.06" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="240.08" y="470.58" width="2.37" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/c <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p190.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 190 页"><text x="72.00 80.98 84.36 93.30 96.93 104.83 113.46 118.83 133.37 137.06 146.14 155.63 159.33 167.51 176.33 184.96 194.04 202.44 211.52 215.15 223.23 226.60" y="249.82" font-size="14.00" class="sc-poppinsmedium">6.5 Terminal-Bench 2.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="108.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">SWE-bench Multilingual</text><text x="235.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖</text><text x="337.43" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="346.68" y="82.61" font-size="11.00" class="sc-notoserifcjksc">种编程语言的</text><text x="415.57" y="82.61" font-size="11.00" class="sc-loraregular">300</text><text x="438.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">道题。</text><text x="471.25" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="192.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="217.48" y="98.23" font-size="11.00" class="sc-loraregular sc-k">87.3%</text><text x="246.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="271.55" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="280.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">SWE-bench Multimodal</text><text x="232.97" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="246.86" y="114.99" font-size="11.00" class="sc-loraregular">issue</text><text x="275.56" y="114.99" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图、设计稿）。</text><text x="495.56" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="130.60" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="192.59" y="130.60" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="217.48" y="130.60" font-size="11.00" class="sc-loraregular sc-k">59.0%</text><text x="248.60" y="130.60" font-size="11.00" class="sc-notoserifcjksc">（在内部运行框架上评估；参见附录</text><text x="427.49" y="130.60" font-size="11.00" class="sc-loraregular sc-k">8.6</text><text x="442.63" y="130.60" font-size="11.00" class="sc-notoserifcjksc">），为</text><text x="478.52" y="130.60" font-size="11.00" class="sc-loraregular">5</text><text x="487.41" y="130.60" font-size="11.00" class="sc-notoserifcjksc">次试验的</text><text x="108.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">平均值。我们注意到，该变体的试验间差异（</text><text x="328.00" y="146.23" font-size="11.00" class="sc-loraregular">56.4%–61.4%</text><text x="393.68" y="146.23" font-size="11.00" class="sc-notoserifcjksc">）高于其他变体。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">所有</text><text x="96.89" y="195.95" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="160.45" y="195.95" font-size="11.00" class="sc-notoserifcjksc">变体均采用标准配置（见表</text><text x="295.34" y="195.95" font-size="11.00" class="sc-loraregular">6.3.A</text><text x="320.13" y="195.95" font-size="11.00" class="sc-notoserifcjksc">），采样结果中包含思考块。关于我们的记忆</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">筛查，参见第</text><text x="140.89" y="211.57" font-size="11.00" class="sc-loraregular">6.2</text><text x="158.76" y="211.57" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="272.48" font-size="11.00" class="sc-loraregular" fill="#0000ff">Terminal-Bench 2.0</text><text x="175.86" y="272.48" font-size="11.00" class="sc-notoserifcjksc">由斯坦福大学和</text><text x="255.76" y="272.48" font-size="11.00" class="sc-loraregular sc-k">Laude Institute</text><text x="336.79" y="272.48" font-size="11.00" class="sc-notoserifcjksc">的研究人员开发，在终端和命令行环境中</text><text x="72.00" y="288.11" font-size="11.00" class="sc-notoserifcjksc">的真实世界任务上测试</text><text x="184.89" y="288.11" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="288.11" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="321.06" font-size="11.00" class="sc-loraregular sc-k">Harbor</text><text x="147.27" y="321.06" font-size="11.00" class="sc-notoserifcjksc">脚手架（</text><text x="191.27" y="321.06" font-size="11.00" class="sc-loraregular sc-k">scaffold</text><text x="231.37" y="321.06" font-size="11.00" class="sc-notoserifcjksc">）中使用</text><text x="278.26" y="321.06" font-size="11.00" class="sc-loraregular sc-k">Terminus-2</text><text x="340.58" y="321.06" font-size="11.00" class="sc-notoserifcjksc">运行框架和默认解析器运行</text><text x="475.47" y="321.06" font-size="11.00" class="sc-loraregular sc-k">Terminal-</text><text x="72.00" y="336.68" font-size="11.00" class="sc-loraregular sc-k">Bench 2.0</text><text x="122.09" y="336.68" font-size="11.00" class="sc-notoserifcjksc">。每个任务在独立的</text><text x="223.99" y="336.68" font-size="11.00" class="sc-loraregular sc-k">Kubernetes pod</text><text x="308.32" y="336.68" font-size="11.00" class="sc-notoserifcjksc">中运行，保证资源为基准测试规定限额的</text><text x="72.00" y="352.30" font-size="11.00" class="sc-loraregular">1×</text><text x="172.73" y="352.30" font-size="11.00" class="sc-loraregular">3×</text><text x="184.68" y="352.30" font-size="11.00" class="sc-notoserifcjksc">），超时设为</text><text x="253.58" y="352.30" font-size="11.00" class="sc-loraregular">1×</text><text x="263.41" y="352.30" font-size="11.00" class="sc-notoserifcjksc">，以保证与基准测试的一致性。该配置的详细信息见</text><text x="516.41" y="352.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们</text><text x="72.00" y="367.92" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的工程博客</text><text x="127.00" y="367.92" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="402.03" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="402.03" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="230.77" y="402.03" font-size="11.00" class="sc-lorabold">82%</text><text x="255.77" y="402.03" font-size="11.00" class="sc-notoserifcjkscbold">的平均奖励</text><text x="310.77" y="402.03" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="335.66" y="402.03" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="351.02" y="402.03" font-size="11.00" class="sc-notoserifcjksc">个不同任务各</text><text x="419.91" y="402.03" font-size="11.00" class="sc-loraregular">5</text><text x="428.80" y="402.03" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值（共计</text><text x="72.00" y="417.65" font-size="11.00" class="sc-loraregular">445</text><text x="92.81" y="417.65" font-size="11.00" class="sc-notoserifcjksc">次试验）。我们将</text><text x="183.70" y="417.65" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="306.59" y="417.65" font-size="11.00" class="sc-notoserifcjksc">配置为以最高推理强度（自适应模式）运行，每</text><text x="72.00" y="433.27" font-size="11.00" class="sc-notoserifcjksc">个任务的总</text><text x="129.89" y="433.27" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="161.95" y="433.27" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="197.84" y="433.27" font-size="11.00" class="sc-loraregular">100</text><text x="218.40" y="433.27" font-size="11.00" class="sc-notoserifcjksc">万，每次请求的最大输出</text><text x="342.29" y="433.27" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="374.35" y="433.27" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="388.24" y="433.27" font-size="11.00" class="sc-loraregular">32K</text><text x="407.79" y="433.27" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="418.79 425.29 431.25 436.01 445.85 448.94 455.61 461.29 464.28 469.66 476.50 482.47 489.14 494.99" y="433.27" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="504.48" y="433.27" font-size="11.00" class="sc-notoserifcjksc">对推理</text><text x="72.00" y="448.89" font-size="11.00" class="sc-notoserifcjksc">延迟较为敏感：固定的实际耗时超时意味着解码较慢的端点在每个任务中完成的回合更少。我们</text><text x="72.00" y="464.51" font-size="11.00" class="sc-notoserifcjksc">报告的得分使用了生产环境</text><text x="206.89" y="464.51" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="226.97" y="464.51" font-size="11.00" class="sc-notoserifcjksc">端点，以考虑这些动态因素。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.14" y="515.38" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="175.86" y="515.38" font-size="11.00" class="sc-notoserifcjksc">的超时限制有时相当严格，对思考型模型尤其如此，这有可能使真实的能力</text><text x="72.00" y="531.00" font-size="11.00" class="sc-notoserifcjksc">跃升被采样速度等看似无关的混杂因素所掩盖。此外，部分</text><text x="360.89 367.39 373.36 378.12 387.95 391.04 397.72 403.40 406.39 411.77 418.61 424.57 431.25 437.10 443.69 446.58 452.49 455.03" y="531.00" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.0</text><text x="464.76" y="531.00" font-size="11.00" class="sc-notoserifcjksc">任务存在歧</text><text x="456.51" y="546.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">2.1</text><text x="472.02" y="546.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更新</text><text x="494.02" y="546.62" font-size="11.00" class="sc-notoserifcjksc">中解决这</text><text x="72.00" y="562.24" font-size="11.00" class="sc-notoserifcjksc">两个问题。为了在排除混杂因素的情况下单独衡量智能体编程能力，我们还使用</text><text x="459.89" y="562.24" font-size="11.00" class="sc-loraregular sc-k">GitHub</text><text x="500.02" y="562.24" font-size="11.00" class="sc-notoserifcjksc">上提供</text><text x="72.00" y="577.86" font-size="11.00" class="sc-notoserifcjksc">的最新</text><text x="107.89" y="577.86" font-size="11.00" class="sc-loraregular">2.1</text><text x="123.40" y="577.86" font-size="11.00" class="sc-notoserifcjksc">修复运行了</text><text x="181.30 187.80 193.76 198.52 208.36 211.45 218.12 223.80 226.79 232.17 239.01 244.98 251.65 257.50" y="577.86" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="264.09" y="577.86" font-size="11.00" class="sc-notoserifcjksc">，同时将超时限制提高到</text><text x="387.99" y="577.86" font-size="11.00" class="sc-loraregular">4</text><text x="396.84" y="577.86" font-size="11.00" class="sc-notoserifcjksc">小时（大约是</text><text x="465.73" y="577.86" font-size="11.00" class="sc-loraregular sc-k">2.0</text><text x="483.91" y="577.86" font-size="11.00" class="sc-notoserifcjksc">基线的四</text><text x="72.00" y="593.48" font-size="11.00" class="sc-notoserifcjksc">倍）。这使平均奖励达到</text><text x="195.89" y="593.48" font-size="11.00" class="sc-lorabold">92.1%</text><text x="225.07" y="593.48" font-size="11.00" class="sc-notoserifcjksc">。在相同条件下，我们测得使用</text><text x="381.96" y="593.48" font-size="11.00" class="sc-loraregular sc-k">Codex CLI</text><text x="437.92" y="593.48" font-size="11.00" class="sc-notoserifcjksc">运行框架的</text><text x="495.81" y="593.48" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="72.00" y="609.10" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="96.89" y="609.10" font-size="11.00" class="sc-loraregular">75.3%</text><text x="126.36" y="609.10" font-size="11.00" class="sc-notoserifcjksc">（高于基线规格下的</text><text x="228.26" y="609.10" font-size="11.00" class="sc-loraregular">68.3%</text><text x="259.20" y="609.10" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="270.20" y="605.43" font-size="6.60" class="sc-loraregular sc-k">23</text><text x="277.32" y="609.10" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular sc-k">23</text><text x="81.10" y="690.99" font-size="10.00" class="sc-notoserifcjksc">我们没有报告</text><text x="143.73" y="690.99" font-size="10.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="213.12" y="690.99" font-size="10.00" class="sc-notoserifcjksc">在此设置下的结果。我们难以复现此前的最佳结果，包括我们自己的测试</text><text x="201.55" y="705.19" font-size="10.00" class="sc-loraregular">2</text><text x="209.55" y="705.19" font-size="10.00" class="sc-notoserifcjksc">月发布时与其报告得分相符。</text><a href="https://www.swebench.com/multilingual.html" rel="noopener"><rect x="108.00" y="73.81" width="29.18" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multilingual.html" rel="noopener"><rect x="137.18" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multilingual.html" rel="noopener"><rect x="137.18" y="73.81" width="31.48" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multilingual.html" rel="noopener"><rect x="168.67" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multilingual.html" rel="noopener"><rect x="171.56" y="73.81" width="61.08" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multimodal.html" rel="noopener"><rect x="108.00" y="106.18" width="29.18" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multimodal.html" rel="noopener"><rect x="137.18" y="106.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multimodal.html" rel="noopener"><rect x="137.18" y="106.18" width="31.48" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multimodal.html" rel="noopener"><rect x="168.67" y="106.18" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.swebench.com/multimodal.html" rel="noopener"><rect x="171.56" y="106.18" width="58.52" height="11.00" fill="transpa <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="72.00 80.98 84.36 93.34 96.98 107.79 116.12 127.13 136.88 140.52 150.44 154.13 163.62 178.16 187.09 196.17" y="88.10" font-size="14.00" class="sc-poppinsmedium">6.6 GPQA Diamond</text><text x="72.00 80.98 84.36 92.19 95.83 108.17 120.51 132.85 139.06" y="213.21" font-size="14.00" class="sc-poppinsmedium">6.7 MMMLU</text><text x="72.00 80.98 84.36 93.28 96.92 106.57 115.03 124.78 137.12 148.09 151.73 159.80 168.77 176.84" y="322.13" font-size="14.00" class="sc-poppinsmedium">6.8 USAMO 2026</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular sc-k">24</text><text x="80.97 87.18 92.60 95.41 101.47 104.00 106.63 113.84 116.30 118.83 121.45 126.80 130.67 133.30 138.46 141.18 143.64 146.26 149.31 154.68 160.82 166.04 171.42 174.47 176.93 179.56 187.17 193.23 201.05 207.31 209.81 212.44 218.70 221.33 226.85 231.11 236.27 242.25 248.21 253.30 257.17 262.59 267.48 270.20 275.56 280.56 285.98 288.70 291.33 298.93 304.78 310.63 316.40 319.12 324.53 329.42 335.39 339.65 345.50 351.29 354.67 357.30 365.26 372.71 378.96 381.59 387.41 392.83 398.90 404.21 410.20 419.14 424.30 428.58 433.95 436.41 439.04 444.20 447.91 454.39 457.20 462.25 464.75 469.97 475.53 479.17 482.81 485.27 488.91 494.28 500.41 505.78 511.15" y="704.45" font-size="10.00" class="sc-loraregular">Rein, D., et al. (2023). GPQA: A graduate-level Google-proof Q&amp;A benchmark. arXiv:2311.12022.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.16 188.73 192.37 196.01 198.47 202.11 207.47 213.61 218.98" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2311.12022</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="72.00 80.37 85.06 90.73 97.31 103.88 109.48 113.73 119.70 125.08 131.43 137.34 142.84 148.80 151.79 154.69 163.06 169.49 175.93 182.28 185.27 191.23 196.61 203.27 207.96 214.40 220.78 224.49 227.39 236.14 244.34" y="110.55" font-size="11.00" class="sc-loraregular">Graduate-Level Google-Proof Q&amp;A</text><text x="254.12" y="110.55" font-size="11.00" class="sc-notoserifcjksc">基准测试（</text><text x="309.12" y="110.55" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="339.65" y="110.55" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="350.65" y="106.88" font-size="6.60" class="sc-loraregular sc-k">24</text><text x="360.52" y="110.55" font-size="11.00" class="sc-notoserifcjksc">是一组具有挑战性的多项选择科学</text><text x="72.00" y="126.17" font-size="11.00" class="sc-notoserifcjksc">题。我们使用包含</text><text x="162.89" y="126.17" font-size="11.00" class="sc-loraregular">198</text><text x="182.33" y="126.17" font-size="11.00" class="sc-notoserifcjksc">道题的</text><text x="218.22" y="126.17" font-size="11.00" class="sc-loraregular">Diamond</text><text x="72.00" y="141.79" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="175.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="175.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="208.77" y="175.53" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GPQA Diamond</text><text x="291.58" y="175.53" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="327.48" y="175.53" font-size="11.00" class="sc-loraregular">94.55%</text><text x="364.06" y="175.53" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="388.95" y="175.53" font-size="11.00" class="sc-loraregular">5</text><text x="397.84" y="175.53" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="235.86" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">MMMLU</text><text x="116.80" y="235.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.80" y="235.86" font-size="11.00" class="sc-loraregular sc-k">Multilingual Massive Multitask Language Understanding</text><text x="414.74" y="235.86" font-size="11.00" class="sc-notoserifcjksc">）测试</text><text x="450.63" y="235.86" font-size="11.00" class="sc-loraregular">14</text><text x="463.49" y="235.86" font-size="11.00" class="sc-notoserifcjksc">种非英语语言中</text><text x="72.00" y="251.48" font-size="11.00" class="sc-loraregular">57</text><text x="85.96" y="251.48" font-size="11.00" class="sc-notoserifcjksc">个学术学科的知识与推理。在所有非英语语言组合上，</text><text x="349.96" y="251.48" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="472.84" y="251.48" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="72.00" y="267.10" font-size="11.00" class="sc-loraregular sc-k">92.67%</text><text x="107.78" y="267.10" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="132.68" y="267.10" font-size="11.00" class="sc-loraregular">5</text><text x="141.56" y="267.10" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值，每次运行均使用自适应思考、</text><text x="372.56" y="267.10" font-size="11.00" class="sc-loraregular">max</text><text x="396.80" y="267.10" font-size="11.00" class="sc-notoserifcjksc">推理强度和默认采样设置</text><text x="72.00" y="282.72" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="282.72" font-size="11.00" class="sc-loraregular sc-k">temperature</text><text x="147.34" y="282.72" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="158.34" y="282.72" font-size="11.00" class="sc-loraregular">top_p</text><text x="190.18" y="282.72" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="171.00" y="344.80" font-size="11.00" class="sc-loraregular sc-k">USA Mathematical Olympiad</text><text x="317.19" y="344.80" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="328.19" y="344.80" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="368.36" y="344.80" font-size="11.00" class="sc-notoserifcjksc">）是面向高中生的证明题竞赛，共</text><text x="457.00" y="360.42" font-size="11.00" class="sc-loraregular sc-k">American</text><text x="72.00" y="376.04" font-size="11.00" class="sc-loraregular sc-k">Invitational Mathematics Examination</text><text x="265.94" y="376.04" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="276.94" y="376.04" font-size="11.00" class="sc-loraregular">AIME</text><text x="304.45" y="376.04" font-size="11.00" class="sc-notoserifcjksc">）之后的下一级比赛；美国数学邀请赛去年曾是</text><text x="72.00" y="391.66" font-size="11.00" class="sc-notoserifcjksc">一个热门的</text><text x="129.89" y="391.66" font-size="11.00" class="sc-loraregular">AI</text><text x="143.36" y="391.66" font-size="11.00" class="sc-notoserifcjksc">基准测试，但现已饱和。</text><text x="264.36" y="391.66" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="292.18" y="391.66" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="306.07" y="391.66" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="349.13" y="391.66" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="363.03" y="391.66" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="390.85" y="391.66" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="404.74" y="391.66" font-size="11.00" class="sc-loraregular">3</text><text x="413.76" y="391.66" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="427.65 433.56 437.43 443.92 449.83" y="391.66" font-size="11.00" class="sc-loraregular">21–22</text><text x="458.63" y="391.66" font-size="11.00" class="sc-notoserifcjksc">日举行，晚于</text><text x="72.00" y="407.28" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="407.28" font-size="11.00" class="sc-notoserifcjksc">的训练数据截止日期。</text><text x="72.00" y="441.94" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="441.94" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="139.96" y="441.94" font-size="11.00" class="sc-notoserifcjksc">的解答是证明而非简短答案，评分可能具有挑战性且带有主观性。我们遵循</text><text x="72.00" y="457.56" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">MathArena</text><text x="131.32" y="457.56" font-size="11.00" class="sc-notoserifcjksc">的评分方法：每份证明先由一个中立模型（</text><text x="340.32" y="457.56" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="413.76" y="457.56" font-size="11.00" class="sc-notoserifcjksc">）改写，再由</text><text x="482.65" y="457.56" font-size="11.00" class="sc-loraregular">3</text><text x="491.67" y="457.56" font-size="11.00" class="sc-notoserifcjksc">个前沿模</text><text x="72.00" y="473.18" font-size="11.00" class="sc-notoserifcjksc">型组成的评审组（我们使用了</text><text x="217.89" y="473.18" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="291.33" y="473.18" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="302.33" y="473.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="388.28" y="473.18" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="402.18" y="473.18" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="522.16" y="473.18" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="488.80" font-size="11.00" class="sc-notoserifcjksc">依据既定的评分细则进行评判。最终得分取各评判者所给分数中的最低值。</text><text x="72.00" y="539.09" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="539.09" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="219.77" y="539.09" font-size="11.00" class="sc-loraregular sc-k">97.6%</text><text x="251.87" y="539.09" font-size="11.00" class="sc-notoserifcjksc">的得分，为每道题</text><text x="342.77" y="539.09" font-size="11.00" class="sc-loraregular">10</text><text x="356.49" y="539.09" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值，使用</text><text x="469.39" y="539.09" font-size="11.00" class="sc-loraregular">max</text><text x="493.62" y="539.09" font-size="11.00" class="sc-notoserifcjksc">推理强度</text><text x="72.00" y="554.71" font-size="11.00" class="sc-notoserifcjksc">且不使用工具。我们使用</text><text x="195.89" y="554.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="281.85" y="554.71" font-size="11.00" class="sc-notoserifcjksc">将我们的运行框架与</text><text x="383.74" y="554.71" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="443.06" y="554.71" font-size="11.00" class="sc-notoserifcjksc">公布的得分进行了</text><text x="72.00" y="570.33" font-size="11.00" class="sc-notoserifcjksc">校准。</text><text x="105.00" y="570.33" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="164.32" y="570.33" font-size="11.00" class="sc-notoserifcjksc">测得</text><text x="189.22" y="570.33" font-size="11.00" class="sc-loraregular sc-k">47.0%</text><text x="218.71" y="570.33" font-size="11.00" class="sc-notoserifcjksc">，但它将</text><text x="265.60" y="570.33" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="313.26" y="570.33" font-size="11.00" class="sc-notoserifcjksc">的思考</text><text x="349.16" y="570.33" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="381.21" y="570.33" font-size="11.00" class="sc-notoserifcjksc">限制在</text><text x="417.10" y="570.33" font-size="11.00" class="sc-loraregular">120k</text><text x="439.75" y="570.33" font-size="11.00" class="sc-notoserifcjksc">。我们在相同设置下</text><text x="72.00" y="585.95" font-size="11.00" class="sc-notoserifcjksc">的测量结果为</text><text x="140.89" y="585.95" font-size="11.00" class="sc-loraregular">51.9%</text><text x="169.53" y="585.95" font-size="11.00" class="sc-notoserifcjksc">（相差在</text><text x="216.42" y="585.95" font-size="11.00" class="sc-loraregular">5%</text><text x="234.88" y="585.95" font-size="11.00" class="sc-notoserifcjksc">以内）；在</text><text x="292.77" y="585.95" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="318.28" y="585.95" font-size="11.00" class="sc-notoserifcjksc">推理强度且不限</text><text x="398.17" y="585.95" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="427.33" y="585.95" font-size="11.00" class="sc-notoserifcjksc">（通过批处理</text><text x="496.23" y="585.95" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="513.41" y="585.95" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="601.57" font-size="11.00" class="sc-notoserifcjksc">情况下，我们测得</text><text x="162.89" y="601.57" font-size="11.00" class="sc-loraregular">66.2%</text><text x="193.79" y="601.57" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="72.00" y="707.20" width="152.35" height="12.80" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="208.77" y="166.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="208.77" y="166.73" width="30.54" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="239.31" y="166.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="242.20" y="166.73" width="46.49" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/MMMLU" rel="noopener"><rect x="72.00" y="227.06" width="44.80" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="505.85" y="433.14" width="0.00" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="72.00" y="448.76" width="56.43" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00" y="317.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="317.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.26 101.36 106.89 110.37 112.73 119.57 124.89 130.90 139.54 146.47 148.83 153.63 159.35 164.15" y="317.67" font-size="9.00" class="sc-lorabold">6.8.A] USAMO 2026</text><text x="171.69" y="317.67" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="198.69" y="317.67" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="299.23" y="317.67" font-size="9.00" class="sc-notoserifcjksc">在数学证明方面远强于</text><text x="391.60" y="317.67" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="459.56" y="317.67" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="356.74" font-size="11.00" class="sc-notoserifcjksc">我们注意到，三位评判者中有两位是</text><text x="250.89" y="356.74" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="304.73" y="356.74" font-size="11.00" class="sc-notoserifcjksc">模型，它们</text><text x="359.73" y="356.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">可能</text><text x="381.73" y="356.74" font-size="11.00" class="sc-notoserifcjksc">存在偏向</text><text x="428.62" y="356.74" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="372.36" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="372.36" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="126.53" y="372.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">偏差</text><text x="148.53" y="372.36" font-size="11.00" class="sc-notoserifcjksc">；与此相抵的是，</text><text x="236.53" y="372.36" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="312.86" y="372.36" font-size="11.00" class="sc-notoserifcjksc">认同这些得分，并且在</text><text x="425.75" y="372.36" font-size="11.00" class="sc-loraregular sc-k">58/60</text><text x="461.03" y="372.36" font-size="11.00" class="sc-notoserifcjksc">份解答中未发现</text><text x="72.00" y="387.98" font-size="11.00" class="sc-notoserifcjksc">任何问题。</text><text x="72.00" y="422.90" font-size="14.00" class="sc-poppinssemibold">6.9</text><text x="96.70" y="422.90" font-size="14.00" class="sc-notosanscjkscbold">长上下文：</text><text x="166.70" y="422.90" font-size="14.00" class="sc-poppinssemibold">GraphWalks</text><text x="72.00" y="449.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GraphWalks</text><text x="72.00" y="465.07" font-size="11.00" class="sc-notoserifcjksc">的有向图，模型必须从一个随机起始节点出发执行广度优先搜索（</text><text x="391.00" y="465.07" font-size="11.00" class="sc-loraregular sc-k">BFS</text><text x="410.01" y="465.07" font-size="11.00" class="sc-notoserifcjksc">），或找出其父节点。</text><text x="72.00" y="514.22" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="514.22" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="208.77" y="514.22" font-size="11.00" class="sc-loraregular sc-k">BFS 256K-1M</text><text x="278.04" y="514.22" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="313.93" y="514.22" font-size="11.00" class="sc-loraregular sc-k">80.0%</text><text x="345.71" y="514.22" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="370.61" y="514.22" font-size="11.00" class="sc-loraregular sc-k">parents 256k-1M</text><text x="458.32" y="514.22" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="494.21" y="514.22" font-size="11.00" class="sc-loraregular sc-k">97.7%</text><text x="521.89" y="514.22" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="529.84" font-size="11.00" class="sc-notoserifcjksc">均为</text><text x="96.89" y="529.84" font-size="11.00" class="sc-loraregular">5</text><text x="105.78" y="529.84" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值</text><text x="182.78" y="526.17" font-size="6.60" class="sc-loraregular">25</text><text x="189.92" y="529.84" font-size="11.00" class="sc-notoserifcjksc">。与此前的</text><text x="247.82" y="529.84" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="286.11" y="529.84" font-size="11.00" class="sc-notoserifcjksc">模型一样，我们的评分修正了已发布</text><text x="465.00" y="529.84" font-size="11.00" class="sc-loraregular">F1</text><text x="477.92" y="529.84" font-size="11.00" class="sc-notoserifcjksc">指标中的一</text><text x="72.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">处歧义（真值集合为空时，空预测记为</text><text x="261.89" y="545.46" font-size="11.00" class="sc-loraregular sc-k">1.0</text><text x="278.16" y="545.46" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="303.06" y="545.46" font-size="11.00" class="sc-loraregular">0</text><text x="309.89" y="545.46" font-size="11.00" class="sc-notoserifcjksc">），并对</text><text x="356.78" y="545.46" font-size="11.00" class="sc-loraregular sc-k">BFS</text><text x="378.68" y="545.46" font-size="11.00" class="sc-notoserifcjksc">提示词作了澄清，要求给出恰好</text><text x="72.00" y="561.08" font-size="11.00" class="sc-notoserifcjksc">位于深度</text><text x="118.89" y="561.08" font-size="11.00" class="sc-loraregular">N</text><text x="130.17" y="561.08" font-size="11.00" class="sc-notoserifcjksc">的节点，而非深度不超过</text><text x="254.06" y="561.08" font-size="11.00" class="sc-loraregular">N</text><text x="265.34" y="561.08" font-size="11.00" class="sc-notoserifcjksc">的节点；详情参见</text><text x="356.23" y="561.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="442.18" y="561.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="475.18" y="561.08" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="713.27" font-size="6.00" class="sc-loraregular">25</text><text x="81.12" y="716.60" font-size="10.00" class="sc-notoserifcjksc">该结果无法通过公开</text><text x="173.75" y="716.60" font-size="10.00" class="sc-loraregular sc-k">API</text><text x="192.00" y="716.60" font-size="10.00" class="sc-notoserifcjksc">复现，因为一半的题目超出了其</text><text x="334.63" y="716.60" font-size="10.00" class="sc-loraregular">100</text><text x="353.32" y="716.60" font-size="10.00" class="sc-notoserifcjksc">万</text><text x="365.95" y="716.60" font-size="10.00" class="sc-loraregular sc-k">token</text><text x="395.09" y="716.60" font-size="10.00" class="sc-notoserifcjksc">的上限。</text><a href="https://arxiv.org/abs/2410.21819" rel="noopener"><rect x="359.73" y="347.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.21819" rel="noopener"><rect x="359.73" y="347.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.21819" rel="noopener"><rect x="370.73" y="347.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.21819" rel="noopener"><rect x="370.73" y="347.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="126.53" y="363.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="126.53" y="363.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="137.53" y="363.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://matharena.ai/usamo/" rel="noopener"><rect x="137.53" y="363.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/openai/graphwalks" rel="noopener"><rect x="72.00" y="440.65" width="61.64" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0dd865075ad3132672ee0ab40b05a53f14cf5288.pdf" rel="noopener"><rec
