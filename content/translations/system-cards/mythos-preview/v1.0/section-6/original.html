处评估的许多能力也与模型安全相关；部分评估也见于第</text><text x="360.89" y="219.14" font-size="11.00" class="sc-loraregular">2</text><text x="369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="219.14" font-size="11.00" class="sc-notoserifcjksc">节，我们在该节中讨论与我们的负</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="234.76" font-size="11.00" class="sc-notoserifcjksc">责任扩展政策（</text><text x="149.00 155.83 161.79 166.89 173.45 179.89 186.57 191.66 194.75 201.15 204.14 210.11 213.00 219.24 225.07 230.74 233.73 236.82 243.50 249.58 252.48 259.03 265.47 268.46 271.55 277.35" y="234.76" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="283.16 294.16 305.16 316.16 327.16 338.16 349.16" y="234.76" font-size="11.00" class="sc-notoserifcjksc">）相关的评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="283.89" font-size="11.00" class="sc-notoserifcjksc">我们首先讨论与我们所使用的若干评估基准测试相关的污染问题。随后，我们提供一张汇总表，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="299.51" font-size="11.00" class="sc-notoserifcjksc">在多项评估上将</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.91 242.60 248.51 254.06 257.15 263.07" y="299.51" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.77 285.77 296.77" y="299.51" font-size="11.00" class="sc-notoserifcjksc">与其他</text><text x="310.67 317.55 324.13 328.39 334.98 339.66 346.10 352.67 355.76" y="299.51" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="364.50 375.50 386.50 397.50 408.50 419.50 430.50 441.50 452.50 463.50 474.50 485.50 496.50 507.50 518.50 529.50" y="299.51" font-size="11.00" class="sc-notoserifcjksc">模型及第三方模型进行比较，之后是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="315.13" font-size="11.00" class="sc-notoserifcjksc">各项评估的说明和方法细节。对于同样曾在</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04 358.00 360.60" y="315.13" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc">上运行过的评估，我们沿用</text><text x="501.85 512.85 523.85" y="315.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其系统</text><text x="72.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="330.75" font-size="11.00" class="sc-notoserifcjksc">中的说明，并注明任何变更。</text><text x="72.00 80.96 84.60" y="398.64" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97 109.97" y="398.64" font-size="14.00" class="sc-notosanscjkscbold">污染</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="440.82" font-size="11.00" class="sc-notoserifcjksc">数。我们采取了若干步骤对评估进行去污染；完整方法见</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04 424.00 426.71" y="440.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.5</text><text x="435.59 446.59 457.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="468.59" y="440.82" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="482.49 488.39 491.10" y="440.82" font-size="11.00" class="sc-loraregular">2.2</text><text x="499.90 510.90 521.90" y="440.82" font-size="11.00" class="sc-notoserifcjksc">节。对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="538.55" font-size="11.00" class="sc-notoserifcjksc">下面，我们讨论污染问题尤为突出的三项评估。</text><text x="72.00 80.32 83.70 91.16 94.54 99.25 102.34 110.26 123.57 130.49 138.07 146.88 154.90 163.49 171.32" y="585.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1 SWE-bench</text><text x="183.01 196.01" y="585.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估</text><text x="72.00 83.00 94.00" y="613.36" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="211.36" y="613.36" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="222.36 232.46 239.02 242.02 246.27 249.36 252.36 255.45 262.12 268.21 274.77 280.45" y="613.36" font-size="11.00" class="sc-loraregular">Multilingual</text><text x="286.34" y="613.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.23 306.89 311.58" y="613.36" font-size="11.00" class="sc-loraregular">Pro</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="628.98" font-size="11.00" class="sc-notoserifcjksc">现训练数据中的解答，而不是独立推导出解答。我们在所有试验上运行了多个过滤器，在一系列</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="644.60" font-size="11.00" class="sc-notoserifcjksc">阈值下剔除被标记的问题。在这一过滤后的子集上重新评分并不会改变</text><text x="415.89 423.58 426.57 432.18 438.75 445.33 451.29 454.18 464.12 469.98 474.24 480.83 487.26 492.35 495.25 501.91 506.60 512.51 518.06 521.15 527.07" y="644.60" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的排名，而且在排除被标记的问题之后，它相对于</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04 391.00 393.60" y="660.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="660.22" font-size="11.00" class="sc-notoserifcjksc">的大幅提升仍然存在。在公</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="675.84" font-size="11.00" class="sc-notoserifcjksc">开和私有的智能体编程基准测试上，以及在这些评估的干净划分和完整划分上，提升都一致，这</text><text x="72.00 83.00" y="691.46" font-size="11.00" class="sc-notoserifcjksc">表明</text><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="501.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="512.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="523.85" y="306.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="534.85" y="306.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="72.00" y="321.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="349.89" y="432.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="385.29" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="388.18" y="432.02" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="415.15" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="418.04" y="432.02" width="14.66" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="432.70" y="432.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="435.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="446.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bf10f64990cfda0ba858290be7b8cc6317685f47.pdf" rel="noopener"><rect x="457.59" y="432.02" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00 83.00 94.00 105.00 116.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">记忆并不是</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="266.67 272.90 283.85 290.47 295.85 302.25 308.21 314.89 320.74" y="82.61" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="330.23 341.23 352.23 363.23 374.23 385.23 396.23 407.23 418.23 429.23 440.23 451.23 462.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估中取得提升的主要原因。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">每个基准测试的问题都取自开源代码仓库，因此其内容可能出现在训练语料中。我们进行了语料</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级去污染，但仍在全部三个基准测试中观察到一些记忆的迹象。例如，在某个问题中，模型生成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的补丁复现了参考解答中完全相同的辅助函数，尽管它先是独立地推导、构建并测试了一个解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">答，然后似乎才在最后</text><text x="182.00" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="186.40 197.40 208.40" y="178.05" font-size="11.00" class="sc-notoserifcjksc">回忆起</text><text x="219.40" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="223.24 234.24 245.24 256.24 267.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">真值补丁。</text><text x="278.24 286.97 293.54 299.50 306.18 313.07" y="178.05" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="319.64 330.64 341.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">也针对</text><text x="461.90 472.90 483.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">记录了</text><text x="494.90 505.90 516.90 527.90" y="178.05" font-size="11.00" class="sc-notoserifcjksc">类似的担</text><text x="72.00 83.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">忧。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">为了检测记忆，我们使用一个基于</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="260.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="260.72" font-size="11.00" class="sc-notoserifcjksc">的审计模型，将每个模型生成的补丁与标准补丁进行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">比较，并给出一个</text><text x="162.89 166.51 173.17 175.94 178.83 182.69" y="276.34" font-size="11.00" class="sc-loraregular">[0, 1]</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">问题约束下都会写出的重合部分。另有一项基于规则的补充检查，会标记与参考解答之间大量逐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">字重合的注释。我们对所有模型的每一次尝试都运行这两种检测器，只要有任何一次尝试被标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">记，就将该问题标为可能被记忆。剔除所有模型和所有尝试中被标记问题的并集，对</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="338.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="354.44" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59" y="354.44" font-size="11.00" class="sc-notoserifcjksc">而言是一种保守做法：它同时也剔除了任一基线模型（</text><text x="420.59 429.32 435.89 442.46 447.55 450.44 456.41 459.00" y="354.44" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="468.25" y="354.44" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="482.15 489.83 492.83 498.44 505.00 511.58" y="354.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.73" y="370.06" font-size="11.00" class="sc-loraregular">Sonnet 4.5</text><text x="125.72 136.72 147.72 158.72 169.72 180.72 191.72 202.72 213.72 224.72" y="370.06" font-size="11.00" class="sc-notoserifcjksc">）可能记忆过的问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">事后识别记忆本质上只能是近似的。因此，我们在审计模型决策阈值的整个取值范围内进行扫</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">描，而不是只采用单一的截断值。在过滤严格程度的整个范围内，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 439.22 445.09 449.34 455.93 462.37 467.46 470.35 477.02 481.71 487.61 493.17 496.26 502.18" y="470.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="513.88 524.88" y="470.64" font-size="11.00" class="sc-notoserifcjksc">在每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="486.26" font-size="11.00" class="sc-notoserifcjksc">个基准测试上都保持着对</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.00 272.60" y="486.26" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="281.85" y="486.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.74 303.43 306.42 312.03 318.60 325.18 331.14 334.03 340.27 346.70 353.38 360.06 365.94 370.20 373.09 379.05 381.65" y="486.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="390.90 401.90 412.90 423.90 434.90 445.90" y="486.26" font-size="11.00" class="sc-notoserifcjksc">的显著领先。</text><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="461.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="472.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/" rel="noopener"><rect x="483.90" y="169.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

26.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="360.13" font-size="9.00" class="sc-notoserifcjksc">值。柱形表示在每个阈值下保留的问题数量。在阈值</text><text x="281.37 284.64 286.72" y="360.13" font-size="9.00" class="sc-loraregular">1.0</text><text x="292.31 301.31 310.31 319.31 328.31 337.31 346.31 355.31 364.31 373.31 382.31 391.31 400.31 409.31 418.31 427.31 436.31 445.31 454.31 463.31" y="360.13" font-size="9.00" class="sc-notoserifcjksc">（最右侧）时，所有问题均被保留，曲线与表</text><text x="474.68 479.88 482.09 487.11 489.32" y="360.13" font-size="9.00" class="sc-loraregular">6.3.A</text><text x="497.32 506.32 515.32 524.32" y="360.13" font-size="9.00" class="sc-notoserifcjksc">中的主要</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00" y="371.83" font-size="9.00" class="sc-notoserifcjksc">成绩一致；向左移动会剔除被判定为越来越可能被记忆的问题。在整个阈值范围内，在全部三个基准测试上，</text><text x="504.00 510.29 512.74 517.33 522.70 528.08" y="371.83" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 111.05 114.88 119.72 124.26 126.79 131.63" y="383.53" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="141.21 150.21 159.21 168.21 177.21 186.21 195.21 204.21 213.21 222.21 231.21 240.21 249.21 258.21 267.21 276.21 285.21 294.21 303.21 312.21 321.21 330.21 339.21" y="383.53" font-size="9.00" class="sc-notoserifcjksc">都保持着对两个基线的显著领先。在我们的参考阈值</text><text x="350.58 356.02 357.95" y="383.53" font-size="9.00" class="sc-loraregular">0.7</text><text x="362.10 371.10 380.10 389.10 398.10 407.10 416.10 425.10 434.10 443.10 452.10 461.10 470.10 479.10 488.10 497.10 506.10 515.10 524.10" y="383.53" font-size="9.00" class="sc-notoserifcjksc">（一个有意设定的高召回率设置，会剔除每</text><text x="72.00 81.00 90.00 99.00 108.00" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个基准测试</text><text x="119.37 124.43 129.74 133.01 137.92" y="395.23" font-size="9.00" class="sc-loraregular">8–15%</text><text x="148.11 157.11 166.11 175.11 184.11 193.11" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的问题）下，</text><text x="202.11 208.40 210.85 215.44 220.82 226.20 231.08 233.44 241.57 246.37 249.85 255.24 260.51 264.67 267.04 272.49 276.33 281.16 285.71 288.23 293.08" y="395.23" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="302.65 311.65 320.65" y="395.23" font-size="9.00" class="sc-notoserifcjksc">相对于</text><text x="332.02 339.17 344.54 349.91 354.08 356.45 361.32 363.45" y="395.23" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="371.02 380.02 389.02 398.02 407.02 416.02 425.02 434.02 443.02" y="395.23" font-size="9.00" class="sc-notoserifcjksc">的领先幅度最多缩小</text><text x="454.38 459.40 461.61" y="395.23" font-size="9.00" class="sc-loraregular">3.5</text><text x="468.88 477.88 486.88 495.88 504.88 513.88 522.88 531.88" y="395.23" font-size="9.00" class="sc-notoserifcjksc">个百分点。最左侧</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="406.93" font-size="9.00" class="sc-notoserifcjksc">的不稳定是在通过过滤的问题少于约</text><text x="218.37 223.38" y="406.93" font-size="9.00" class="sc-loraregular">30</text><text x="231.34 240.34 249.34 258.34 267.34 276.34 285.34 294.34 303.34 312.34 321.34 330.34 339.34 348.34 357.34 366.34 375.34 384.34 393.34 402.34 411.34 420.34 429.34 438.34 447.34 456.34 465.34 474.34 483.34 492.34 501.34 510.34" y="406.93" font-size="9.00" class="sc-notoserifcjksc">个时出现的小样本噪声。随着记忆过滤放宽、更多被标记的问题被加回，</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93 142.38 146.21 151.05 155.59 158.12 162.96" y="418.63" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="172.54 181.54 190.54 199.54 208.54 217.54 226.54 235.54 244.54 253.54 262.54 271.54" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率大致保持稳定，而</text><text x="282.91 289.20 291.65 296.23 301.61 306.99 311.87 314.24 321.38 326.75 332.13 336.29 338.66 343.54 345.66" y="418.63" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="353.23" y="418.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="364.60 370.89 373.34 377.93 383.30 388.68 393.56 395.93 401.03 406.30 411.76 417.22 422.04 425.52 427.89 432.77 434.89" y="418.63" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="442.46 451.46 460.46 469.46 478.46 487.46 496.46 505.46 514.46 523.46" y="418.63" font-size="9.00" class="sc-notoserifcjksc">的通过率则有所下降。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="430.33" font-size="9.00" class="sc-notoserifcjksc">这与以下情况相符：</text><text x="153.00 159.29 161.74 166.33 171.70 177.08 181.96 184.33 192.46 197.25 200.74 206.13 211.39 215.56 217.93 223.38 227.21 232.05 236.59 239.12 243.96" y="430.33" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="253.54 262.54 271.54 280.54 289.54 298.54 307.54 316.54 325.54 334.54 343.54 352.54 361.54 370.54 379.54 388.54 397.54 406.54 415.54 424.54 433.54 442.54 451.54 460.54 469.54 478.54 487.54 496.54 505.54 514.54" y="430.33" font-size="9.00" class="sc-notoserifcjksc">记忆了一些较难的被标记问题，而这些问题基线模型并未独立解出。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="523.06" font-size="11.00" class="sc-notoserifcjksc">我们的检测器并不完美，但这一结果对阈值的选择是稳健的，并且与</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="523.06" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="523.06" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="538.68" font-size="11.00" class="sc-notoserifcjksc">任何训练语料中都不存在的内部基准测试上的提升相一致。我们的结论是，记忆并不能解释它在</text><text x="72.00 78.24 89.18 95.80 101.18 107.59 113.55 120.22 126.08" y="554.30" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="135.56 146.56 157.56 168.56 179.56" y="554.30" font-size="11.00" class="sc-notoserifcjksc">上的提升。</text><text x="72.00 79.69 86.28 91.95 96.04 103.17 106.26 111.82 114.71 121.54 127.48 133.16 138.25 144.69 151.37 154.46 161.13" y="630.25" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="170.11 181.11 192.11 203.11 214.11" y="630.25" font-size="11.00" class="sc-notoserifcjksc">是我们在第</text><text x="228.00 234.36 237.07 241.07 245.07 247.78" y="630.25" font-size="11.00" class="sc-loraregular">6.11.3</text><text x="256.80 267.80 278.80" y="630.25" font-size="11.00" class="sc-notoserifcjksc">节中为</text><text x="292.69 300.38 303.37 308.98 315.55 322.13 328.09 330.98 340.92 346.78 351.04 357.63 364.06 369.15 372.05 378.71 383.40 389.31 394.86 397.95 403.87" y="630.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="415.57 426.57 437.57 448.57 459.57 470.57 481.57 492.57 503.57 514.57" y="630.25" font-size="11.00" class="sc-notoserifcjksc">报告的一项基准测试。</text><text x="72.00 79.69 86.28 91.95 96.04 103.17 106.26" y="645.87" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="290.22 295.89 299.97 307.11 310.21" y="645.87" font-size="11.00" class="sc-loraregular">arXiv</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用两种互补的方法来检测</text><text x="228.89 236.58 243.17 248.85 252.93 260.07 263.16 268.71 271.61 278.44 284.38 290.05 295.15 301.58 308.26 311.35 318.03" y="82.61" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="327.00 338.00 349.00 360.00 371.00 382.00 393.00 404.00 415.00 426.00 437.00 448.00 459.00 470.00 481.00 492.00 503.00 514.00 525.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的污染。我们挑选答案文本具有独特性的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">估条目，在完整的预训练数据混合中</text><text x="250.89 256.98 261.66 267.62" y="98.23" font-size="11.00" class="sc-loraregular">grep</text><text x="277.08 288.08 299.08 310.08 321.08 332.08 343.08 354.08 365.08 376.08 387.08 398.08 409.08 420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08 508.08 519.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">精确匹配，并另行搜索评估图像。尽管对评估图像进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行了稳健的图像级过滤，我们仍确认大多数问答文本对出现在语料中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">为了估计污染的影响，我们为基准测试的一个子集构建了留出变体：我们手动扰动每个问题或图</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">像，并比较原版与改编版的准确率。例如，我们要求模型识别某个图表标签而不是另一个，或者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">识别第二低而不是第二高的数据系列，从而使正确答案发生变化，同时难度大致保持不变。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.91 101.01 105.80 107.90 113.44 116.91 119.28 125.47 131.06 135.77 139.61 145.90 148.78 153.62 155.99 162.04 166.88 171.59 175.96 181.05 186.80 189.74 195.48" y="556.05" font-size="9.00" class="sc-lorabold">6.2.2.A] CharXiv Reasoning</text><text x="200.49 209.49 218.49 227.49 236.49 245.49 254.49" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">（子集）分数。</text><text x="263.49 272.49 281.49 290.49 299.49" y="556.05" font-size="9.00" class="sc-notoserifcjksc">我们在原始</text><text x="310.86 317.15 322.54 327.19 330.52 336.37 338.89" y="556.05" font-size="9.00" class="sc-loraregular">CharXiv</text><text x="345.81 354.81 363.81 372.81 381.81 390.81 399.81 408.81 417.81 426.81 435.81 444.81 453.81 462.81 471.81 480.81 489.81 498.81 507.81 516.81 525.81" y="556.05" font-size="9.00" class="sc-notoserifcjksc">基准测试的一个问题子集上评估各模型，同时使</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00" y="567.75" font-size="9.00" class="sc-notoserifcjksc">用原始问答对和难度与歧义程度大致相当的手动改写变体。</text><text x="306.00 312.29 314.74 319.33 324.70 330.08 334.96 337.33 345.46 350.25 353.74 359.13 364.39 368.56 370.93 376.38 380.21 385.05 389.59 392.12 396.96" y="567.75" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="406.54 415.54 424.54 433.54 442.54 451.54 460.54" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在自适应思考（</text><text x="469.54 474.18 479.57 484.21 489.58 493.07 495.59 500.09" y="567.75" font-size="9.00" class="sc-loraregular">adaptive</text><text x="72.00 75.48 80.87 83.40 88.87 93.70 96.23 101.69" y="579.45" font-size="9.00" class="sc-loraregular">thinking</text><text x="106.67 115.67" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="127.04 135.08 139.73" y="579.45" font-size="9.00" class="sc-loraregular">max</text><text x="146.86 155.86 164.86 173.86 182.86" y="579.45" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="191.86 196.74 199.87 202.87 208.13 212.09" y="579.45" font-size="9.00" class="sc-loraregular">effort</text><text x="215.58 224.58 233.58 242.58 251.58 260.58 269.58" y="579.45" font-size="9.00" class="sc-notoserifcjksc">）下进行评估。</text><text x="278.58 285.43 290.30 298.35 300.88 306.34 308.87 311.24 316.25 318.47 321.74 324.11 329.56 333.40 338.66 341.03 346.48 350.32 355.15 359.69 362.22 367.07" y="579.45" font-size="9.00" class="sc-loraregular">Gemini 3.1 Pro Preview</text><text x="376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64" y="579.45" font-size="9.00" class="sc-notoserifcjksc">在默认的动态思考档位</text><text x="466.64 470.24 475.63 478.16 483.35 488.54" y="579.45" font-size="9.00" class="sc-loraregular">“high”</text><text x= "11.00" class="sc-notoserifcjksc">，包含</text><text x="481.79 487.70 490.47 496.47 503.30" y="149.19" font-size="11.00" class="sc-loraregular">2,500</text><text x="513.03" y="149.19" font-size="11.00" class="sc-notoserifcjksc">道</text><text x="72.00 83.00" y="164.81" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="197.77" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.91 286.60 292.51 298.06 301.15 307.07" y="197.77" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="315.88 326.88" y="197.77" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="337.88" y="197.77" font-size="11.00" class="sc-loraregular">1</text><text x="341.89 352.89 363.89 374.89 385.89 396.89 407.89 418.89 429.89 440.89 451.89 462.89 473.89 484.89" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）纯推理（不用工具），以及（</text><text x="495.89" y="197.77" font-size="11.00" class="sc-loraregular">2</text><text x="501.79 512.79 523.79" y="197.77" font-size="11.00" class="sc-notoserifcjksc">）使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="213.39" font-size="11.00" class="sc-notoserifcjksc">网络搜索、网页抓取、程序化工具调用、代码执行，并每</text><text x="349.89 355.89 362.72 368.63 371.52 375.78 382.21 388.04 394.00" y="213.39" font-size="11.00" class="sc-loraregular">50k token</text><text x="403.57 414.57 425.57 436.57 447.57 458.57 469.57 480.57 491.57" y="213.39" font-size="11.00" class="sc-notoserifcjksc">进行一次上下文压缩</text><text x="72.00" y="229.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.81 106.07 111.97 117.80 122.06 124.95 130.75 137.19 147.02 153.59 159.26 165.06 169.32 172.41 178.84" y="229.01" font-size="11.00" class="sc-loraregular">context compaction</text><text x="185.52 196.52 207.52 218.52 229.52" y="229.01" font-size="11.00" class="sc-notoserifcjksc">），最多至</text><text x="243.41 249.54 256.37" y="229.01" font-size="11.00" class="sc-loraregular">300</text><text x="266.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="279.99 284.25 290.68 296.51 302.47" y="229.01" font-size="11.00" class="sc-loraregular">token</text><text x="309.15" y="229.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="320.15 327.84 330.83 336.44 343.01 349.58 355.55 358.44 367.17 373.74 380.31 385.40 388.29 394.26 396.85" y="229.01" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="406.10 417.10 428.10 439.10 450.10 461.10 472.10" y="229.01" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="278.72" font-size="11.00" class="sc-notoserifcjksc">为防止工具变体中出现结果污染，我们为搜索器与抓取器都屏蔽了已知讨论</text><text x="437.89 446.47 452.83" y="278.72" font-size="11.00" class="sc-loraregular">HLE</text><text x="462.57 473.57 484.57 495.57 506.57 517.57 528.57" y="278.72" font-size="11.00" class="sc-notoserifcjksc">的来源（见附录</text><text x="72.00 78.18 80.89" y="294.34" font-size="11.00" class="sc-loraregular">8.5</text><text x="86.88 97.88 108.88 119.88 130.88 141.88 152.88" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="166.78 174.46 177.46 183.07 189.63 196.21 202.17 205.07 213.80 220.37 226.93 232.03 234.92 240.88 243.48" y="294.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="252.73 263.73 274.73 285.73 296.73 307.73 318.73 329.73 340.73 351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73" y="294.34" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看起来从</text><text x="453.62 462.20 468.56" y="294.34" font-size="11.00" class="sc-loraregular">HLE</text><text x="478.30 489.30 500.30 511.30 522.30" y="294.34" font-size="11.00" class="sc-notoserifcjksc">专门来源检</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="309.96" font-size="11.00" class="sc-notoserifcjksc">索到答案的记录；经确认的案例将被重新判为错误。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="359.67" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88" y="359.67" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分</text><text x="296.77 302.77 309.13 311.83 318.01" y="359.67" font-size="11.00" class="sc-loraregular">56.8%</text><text x="327.58 338.58 349.58 360.58 371.58 382.58 393.58 404.58" y="359.67" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="418.48 424.84 430.80 433.15 438.22" y="359.67" font-size="11.00" class="sc-loraregular">64.7%</text><text x="447.79" y="359.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.75 83.44 89.76 98.58 103.67 109.63 117.32 123.76 133.59" y="418.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">BrowseComp</text><text x="143.05 154.05 165.05 176.05 187.05 198.05 209.05 220.05 231.05 242.05 253.05 264.05 275.05 286.05 297.05 308.05 319.05 330.05 341.05 352.05 363.05 374.05 385.05 396.05 407.05 418.05 429.05" y="418.30" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们让</text><text x="442.94 450.63 453.62 459.23 465.80 472.38 478.34 481.23 491.17 497.03 501.29 507.87 514.31" y="418.30" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="433.92" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53" y="433.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓取、程序化工具调用和代码执行运行。在自适应思考、</text><text x="489.53 499.36 505.04" y="433.92" font-size="11.00" class="sc-loraregular">max</text><text x="513.76 524.76" y="433.92" font-size="11.00" class="sc-notoserifcjksc">推理</text><text x="72.00 83.00 94.00" y="449.54" font-size="11.00" class="sc-notoserifcjksc">强度和</text><text x="107.89 114.02 120.85" y="449.54" font-size="11.00" class="sc-loraregular">300</text><text x="130.57" y="449.54" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="144.47 148.73 155.16 160.99 166.95" y="449.54" font-size="11.00" class="sc-loraregular">token</text><text x="176.52 187.52 198.52 209.52" y="449.54" font-size="11.00" class="sc-notoserifcjksc">上限下，</text><text x="220.52 228.21 231.20 236.81 243.38 249.96 255.92 258.81 268.75 274.61 278.87 285.46 291.89 296.98 299.88 306.54 311.23 317.14 322.69 325.78 331.70" y="449.54" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="343.40 354.40" y="449.54" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="368.30 374.48 380.84 383.54 389.90" y="449.54" font-size="11.00" class="sc-loraregular">86.9%</text><text x="399.47 410.47 421.47 432.47 443.47 454.47 465.47 476.47 487.47 498.47 509.47 520.47" y="449.54" font-size="11.00" class="sc-notoserifcjksc">。我们使用上下文压缩（在</text><text x="72.00 77.91 84.74 91.57 97.48 100.37 104.63 111.06 116.89 122.85" y="465.16" font-size="11.00" class="sc-loraregular">200k token</text><text x="132.42 143.42 154.42 165.42 176.42 187.42 198.42" y="465.16" font-size="11.00" class="sc-notoserifcjksc">时触发）来突破</text><text x="212.32 216.32 223.15" y="465.16" font-size="11.00" class="sc-loraregular">100</text><text x="232.88" y="465.16" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="246.77 251.03 257.46 263.29 269.25" y="465.16" font-size="11.00" class="sc-loraregular">token</text><text x="278.82 289.82 300.82 311.82 322.82 333.82 344.82" y="465.16" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="515.45" font-size="11.00" class="sc-notoserifcjksc">在我们的搜索工具下，我们评估认为该基准测试已接近饱和，因此</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="515.45" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77 527.77" y="515.45" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="72.00 83.00 94.00 105.00 116.00" y="531.07" font-size="11.00" class="sc-notoserifcjksc">我们最佳的</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.60" y="531.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85" y="531.07" font-size="11.00" class="sc-notoserifcjksc">得分仅带来了适度的准确率提升（</text><text x="380.85 387.03 393.39 396.09 402.45" y="531.07" font-size="11.00" class="sc-loraregular">86.9%</text><text x="414.91" y="531.07" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="428.81 434.99 441.12 443.47 448.54" y="531.07" font-size="11.00" class="sc-loraregular">83.7%</text><text x="458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="531.07" font-size="11.00" class="sc-notoserifcjksc">）。不过，该模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="546.69" font-size="11.00" class="sc-notoserifcjksc">型以显著更小的</text><text x="151.89 156.15 162.58 168.41 174.38" y="546.69" font-size="11.00" class="sc-loraregular">token</text><text x="183.95 194.95 205.95 216.95 227.95 238.95 249.95 260.95 271.95 282.95" y="546.69" font-size="11.00" class="sc-notoserifcjksc">用量取得了这一得分：</text><text x="293.95 301.64 304.63 310.24 316.80 323.38 329.35 332.24 342.17 348.03 352.29 358.88 365.31 370.41 373.30 379.97 384.65 390.56 396.11 399.21 405.12" y="546.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="416.83 427.83 438.83 449.83 460.83 471.83 482.83 493.83 504.83 515.83 526.83" y="546.69" font-size="11.00" class="sc-notoserifcjksc">的最佳结果每个任务使用</text><text x="72.00" y="562.31" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 90.15 96.58 102.42 108.38" y="562.31" font-size="11.00" class="sc-loraregular">token</text><text x="117.95" y="562.31" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="131.84 140.57 147.14 153.71 158.80 161.69 167.66 170.25" y="562.31" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="179.50" y="562.31" font-size="11.00" class="sc-notoserifcjksc">少</text><text x="193.40 199.36 202.06 208.42" y="562.31" font-size="11.00" class="sc-loraregular">4.9×</text><text x="214.25 225.25 236.25 247.25 258.25" y="562.31" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="272.15 278.05 283.96 290.32" y="562.31" font-size="11.00" class="sc-loraregular">226k</text><text x="299.12" y="562.31" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="313.01 317.01 319.72 323.72 327.73 337.83 340.72 344.98 351.41 357.24 363.20" y="562.31" font-size="11.00" class="sc-loraregular">1.11M token</text><text x="369.88 380.88" y="562.31" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="612.61" font-size="11.00" class="sc-notoserifcjksc">需要注意的一点是预训练污染。尽管我们尽了最大努力加以防范，仍有部分答案已在网上泄露，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="628.23" font-size="11.00" class="sc-notoserifcjksc">且难以轻易识别，很可能已进入我们的预训练语料。为估计污染程度，我们在不开启思考、不使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="643.85" font-size="11.00" class="sc-notoserifcjksc">用工具的情况下评估了该模型，得分为</text><text x="261.89 267.56 273.52 276.06 282.89" y="643.85" font-size="11.00" class="sc-loraregular">24.0%</text><text x="292.46 303.46 314.46 325.46 336.46 347.46 358.46 369.46 380.46 391.46 402.46 413.46 424.46 435.46 446.46 457.46 468.46" y="643.85" font-size="11.00" class="sc-notoserifcjksc">。尽管如此，其中一些对话记录较长（</text><text x="479.46 485.29 491.29" y="643.85" font-size="11.00" class="sc-loraregular">&gt;5k</text><text x="72.00 76.26 82.69 88.52 94.48" y="659.47" font-size="11.00" class="sc-loraregular">token</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="675.09" font-size="11.00" class="sc-notoserifcjksc">味着它记忆了答案。若仅限于较短的对话记录（≤</text><text x="314.00 319.99 325.90 328.79 333.05 339.49 345.32 351.28" y="675.09" font-size="11.00" class="sc-loraregular">5k token</text><text x="357.96 368.96 379.96 390.96" y="675.09" font-size="11.00" class="sc-notoserifcjksc">），只有</text><text x="404.85 408.85 414.85 417.55 421.56" y="675.09" font-size="11.00" class="sc-loraregular">15.1%</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="72.00" y="140.39" width="57.29" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="129.29" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="132.18" y="140.39" width="21.63" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="153.81" y="140.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="156.70" y="140.39" width="28.18" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="72.00" y="409.50" width="68.16" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的答案是正确的；这很可能是基准测试记忆程度的一个更好的上界。在解读该基准测试上的得分</text><text x="72.00" y="404.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 97.77 103.34 105.43 110.23 112.33 117.86 121.34 123.71 129.55 133.80 138.83 146.13 150.50 155.34 161.53 166.63 174.87" y="404.46" font-size="9.00" class="sc-lorabold">6.10.2.A] BrowseComp</text><text x="182.65 191.65 200.65" y="404.46" font-size="9.00" class="sc-notoserifcjkscbold">准确率</text><text x="209.65 218.65 227.65 236.65 245.65 254.65 263.65 272.65 281.65 290.65 299.65 308.65 317.65 326.65 335.65 344.65 353.65 362.65 371.65 380.65 389.65 398.65 407.65" y="404.46" font-size="9.00" class="sc-notoserifcjksc">随着我们在上下文压缩的帮助下增加模型可使用的总</text><text x="419.01 422.50 427.76 432.53 437.41" y="404.46" font-size="9.00" class="sc-loraregular">token</text><text x="445.24 454.24 463.24 472.24 481.24" y="404.46" font-size="9.00" class="sc-notoserifcjksc">数而提升。</text><text x="72.00 80.96 84.60 89.67" y="451.09" font-size="14.00" class="sc-poppinssemibold">6.11</text><text x="98.07 112.07 126.07" y="451.09" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 83.00" y="477.64" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="477.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88" y="477.64" font-size="11.00" class="sc-notoserifcjksc">，相比此前的系统卡，我们对多模态评估方法做了三项更改。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="526.23" font-size="11.00" class="sc-notoserifcjksc">第一，在此前的系统卡中，我们在所有多模态能力评估中只为模型提供了一个图像裁剪工具。此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="541.85" font-size="11.00" class="sc-notoserifcjksc">次，我们提供了一套扩展的</text><text x="206.89 213.72 219.59 223.84 230.43 236.87" y="541.85" font-size="11.00" class="sc-loraregular">Python</text><text x="246.44 257.44 268.44 279.44 290.44 301.44 312.44 323.44 334.44 345.44 356.44 367.44 378.44 389.44 400.44 411.44 422.44 433.44" y="541.85" font-size="11.00" class="sc-notoserifcjksc">工具：一个预装了常用图像分析库（例如</text><text x="447.33 453.94 457.63" y="541.85" font-size="11.00" class="sc-loraregular">PIL</text><text x="463.99" y="541.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="474.99 483.72 490.29 496.25 502.79 510.48" y="541.85" font-size="11.00" class="sc-loraregular">OpenCV</text><text x="517.67 528.67" y="541.85" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="557.47" font-size="11.00" class="sc-notoserifcjksc">代码执行沙箱，以及原有的图像裁剪工具。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">第二，我们更新了</text><text x="162.89 170.58 177.17 182.85 186.93 194.07 197.16 202.71 205.61 212.44 218.38 224.05 229.15 235.58 242.26 245.35 252.03" y="607.19" font-size="11.00" class="sc-loraregular">CharXiv Reasoning</text><text x="261.00" y="607.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="274.90 281.44 288.33 295.17 300.55 307.39 313.35 320.03 325.88 332.47 335.36 341.34 344.43 350.51 359.12" y="607.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="368.90 379.90 390.90 401.90 412.90 423.90 434.90 445.90 456.90 467.90 478.90 489.90 500.90 511.90" y="607.19" font-size="11.00" class="sc-notoserifcjksc">的评分模型。在评估我们的模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="622.81" font-size="11.00" class="sc-notoserifcjksc">时，我们发现</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 185.42 191.86 198.53 205.21 211.10 215.35 218.25" y="622.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 4</text><text x="357.51 364.05 370.94 377.78 383.16 390.00 395.96 402.64 408.49 415.08 417.97 423.95 427.04 433.12 441.73" y="638.43" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="451.51" y="638.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="465.40 473.09 479.68 485.36 489.44 496.58 499.67" y="638.43" font-size="11.00" class="sc-loraregular">CharXiv</text><text x="72.00 78.83 84.77 90.45 95.54 101.98 108.65 111.74 118.42" y="654.05" font-size="11.00" class="sc-loraregular">Reasoning</text><text x="127.40 138.40 149.40 160.40 171.40 182.40 193.40 204.40 215.40 226.40 237.40 248.40" y="654.05" font-size="11.00" class="sc-notoserifcjksc">上的得分。因此，我们改用</text><text x="262.29 269.98 272.97 278.58 285.15 291.73 297.69 300.58 306.82 313.25 319.93 326.61 332.49 336.75 339.64 345.60 348.20" y="654.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="357.45 368.45 379.45 390.45 401.45 412.45 423.45 434.45 445.45 456.45 467.45 478.45 489.45" y="654.05" font-size="11.00" class="sc-notoserifcjksc">作为本节所有评估的评分者。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="72.00 80.34 83.48 88.02 92.57 95.70 100.25 103.63 109.40 118.46 126.65 134.25 142.44 150.46 158.89 166.69 175.12 178.50 185.20 188.63 197.44 207.67" y="198.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.11.1 LAB-Bench FigQA</text><text x="72.00 75.22" y="700.23" font-size="6.00" class="sc-loraregular">26</text><text x="81.32 87.32 92.41 98.38 102.64 108.06 114.04 117.90 120.43 123.06 126.58 129.04 131.67 140.85 143.30 145.83 148.46 153.81 157.68 160.31 165.47 168.18 170.64 173.27 176.32 181.69 187.83 192.97 198.27 201.32 203.78 206.41 212.36 218.61 224.83 229.56 235.78 241.20 247.26 252.58 258.57 261.07 263.70 272.80 278.20 283.36 287.99 293.95 298.28 301.09 307.16 312.69 315.32 320.61 325.77 331.74 336.90 342.72 345.52 348.24 351.21 355.08 357.89 363.31 367.94 370.56 376.36 379.74 382.37 385.09 390.25 396.31 401.84 407.81 412.97 418.45 423.86 426.49 435.43 441.28 447.25 452.67 455.39 460.02 462.65 465.98 471.82 476.15 478.78 484.60 487.41 493.26 495.97 501.82 507.55" y="704.45" font-size="10.00" class="sc-loraregular">Laurent, J. M., et al. (2024). LAB-Bench: Measuring capabilities of language models for biology</text><text x="72.00 76.26 81.68 86.30 91.70 96.86 101.12 106.44 112.42 114.88 117.51 122.67 126.38 132.87 135.67 140.72 143.22 148.37 153.79 159.77 163.94 166.40 170.04 176.25 181.82 187.59 192.96" y="717.26" font-size="10.00" class="sc-loraregular">research. arXiv:2407.10362.</text><text x="198.05 203.95 207.92 211.78 217.75 222.38 224.88 228.57 235.02 240.18 244.51 249.81 252.62 257.27 259.73 265.58 269.86 275.39 281.84 287.00 292.82 297.10 304.00 309.14 314.56 320.55 324.72 327.18 330.81 337.02 342.59 348.37" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2407.10362</text><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第三，我们更新了评分方式，保留被评估模型的思考轨迹，而此前我们会在将对话记录传给评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型之前将其移除。我们发现这对得分的影响可以忽略不计。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">为实现公平比较，我们使用扩展后的工具集和新的评分者重新评估了所有此前的模型。下文报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的所有得分均为五次运行的平均值。</text><text x="72.00 78.54 85.43 92.27 97.65 104.49 110.46 117.13 122.99 129.57 132.47 138.44 141.53 147.61 156.23" y="222.19" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="166.01 177.01 188.01 199.01 210.01 221.01 232.01 243.01 254.01 265.01 276.01 287.01 298.01 309.01 320.01 331.01 342.01 353.01 364.01 375.01 386.01 397.01 408.01 419.01 430.01 441.01 452.01 463.01 474.01 485.01 496.01 507.01 518.01 529.01" y="222.19" font-size="11.00" class="sc-notoserifcjksc">是一个视觉推理基准测试，测试模型能否正确解读和分析生物学研究论文中复</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 1
