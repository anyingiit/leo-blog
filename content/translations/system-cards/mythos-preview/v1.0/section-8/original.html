185.60" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="185.60" font-size="11.00" class="sc-notoserifcjksc">仅向有限的一批合作伙伴开放、用于网络防御目的，且不面向消费者，我们仍然执行了</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">全部标准评估，以了解该模型的行为以及我们安全防护措施和训练的有效性。不过，鉴于本次发</text><text x="72.00" y="216.84" font-size="11.00" class="sc-notoserifcjksc">布属于研究预览性质，系统卡（</text><text x="226.00 232.18 237.99 243.08 247.34 253.30 263.14 266.03 273.72 279.39 284.08" y="216.84" font-size="11.00" class="sc-loraregular">System Card</text><text x="290.66" y="216.84" font-size="11.00" class="sc-notoserifcjksc">）的本节主要列出我们测试的定量结果，不附大量</text><text x="72.00" y="232.46" font-size="11.00" class="sc-notoserifcjksc">额外评述。</text><text x="72.00" y="300.08" font-size="11.00" class="sc-notoserifcjksc">有关这些评估更详细的方法说明，请参阅</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.00 349.60" y="300.08" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="358.85" y="300.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="391.85" y="300.08" font-size="11.00" class="sc-notoserifcjksc">；在必要时，我们会在下文指</text><text x="72.00" y="315.70" font-size="11.00" class="sc-notoserifcjksc">出与</text><text x="96.89 105.63 112.19 118.76 123.85 126.75 132.71 135.31" y="315.70" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="144.56" y="315.70" font-size="11.00" class="sc-notoserifcjksc">评估相比的任何实质性差异或变化。</text><text x="72.00" y="363.20" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.1.1</text><text x="99.62" y="363.20" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="395.09" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="395.09" font-size="11.00" class="sc-notoserifcjksc">的单轮评估与</text><text x="263.77 271.46 274.45 280.07 286.63 293.21 299.17 302.07 310.80 317.37 323.93 329.03 331.92 337.88 340.48" y="395.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="349.73" y="395.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="363.62 371.31 374.30 379.91 386.48 393.06 399.02 401.91 408.15 414.58 421.26 427.94 433.82 438.08 440.97 446.94 449.53" y="395.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 4.6</text><text x="458.78" y="395.09" font-size="11.00" class="sc-notoserifcjksc">系统卡中的单轮</text><text x="72.00" y="410.71" font-size="11.00" class="sc-notoserifcjksc">评估有三点不同：</text><text x="108.00" y="443.67" font-size="11.00" class="sc-notoserifcjksc">我们新增了一个与使用非法药物与管制物质相关的评估类别。</text><text x="108.00" y="476.05" font-size="11.00" class="sc-notoserifcjksc">我们将原有的自杀与自伤主题评估（其中包含进食紊乱）扩展为两项独立评估，分别针对</text><text x="108.00" y="491.67" font-size="11.00" class="sc-notoserifcjksc">自杀与自伤以及进食紊乱。</text><text x="108.00" y="524.63" font-size="11.00" class="sc-notoserifcjksc">我们将儿童性诱骗与性化相关评估重组为单一的儿童性虐待与性剥削（</text><text x="449.00" y="524.63" font-size="11.00" class="sc-loraregular">CSAE</text><text x="476.65" y="524.63" font-size="11.00" class="sc-notoserifcjksc">）评估集，</text><text x="108.00" y="540.25" font-size="11.00" class="sc-notoserifcjksc">以与我们近期更新的内部政策版本保持一致；该政策精简并扩大了我们对这些问题的端到</text><text x="108.00" y="555.87" font-size="11.00" class="sc-notoserifcjksc">端覆盖范围。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="272.89" y="291.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="272.89" y="291.28" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="308.29" y="291.28 好。</text><text x="446.72" y="263.08" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="464.72" y="263.08" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最</text><text x="72.00" y="274.78" font-size="9.00" class="sc-notoserifcjksc">高者，次优分数以下划线标出。</text><text x="198.00" y="274.78" font-size="9.00" class="sc-loraregular">“</text><text x="201.60" y="274.78" font-size="9.00" class="sc-notoserifcjksc">关闭思考</text><text x="237.60" y="274.78" font-size="9.00" class="sc-loraregular">”</text><text x="240.74" y="274.78" font-size="9.00" class="sc-notoserifcjksc">指在禁用思考模式的情况下运行模型；</text><text x="393.74" y="274.78" font-size="9.00" class="sc-loraregular">“</text><text x="397.34" y="274.78" font-size="9.00" class="sc-notoserifcjksc">开启思考</text><text x="433.34" y="274.78" font-size="9.00" class="sc-loraregular">”</text><text x="436.48" y="274.78" font-size="9.00" class="sc-notoserifcjksc">指模型对请求进行更长时</text><text x="72.00" y="286.48" font-size="9.00" class="sc-notoserifcjksc">间推理的模式。对于</text><text x="155.37 161.66 164.11 168.70 174.07 179.45 184.33 186.70 194.82 199.62 203.10 208.49 213.76 217.93 220.29 225.75 229.58 234.41 238.96 241.49 246.33" y="286.48" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="253.54" y="286.48" font-size="9.00" class="sc-notoserifcjksc">，开启思考的请求在</text><text x="334.54" y="286.48" font-size="9.00" class="sc-loraregular">“</text><text x="338.14" y="286.48" font-size="9.00" class="sc-notoserifcjksc">自适应思考（</text><text x="392.14 396.78 402.17 406.81 412.18 415.67 418.19 422.69 427.57 429.94 433.42 438.81 441.34 446.81 451.64 454.17 459.63" y="286.48" font-size="9.00" class="sc-loraregular">adaptive thinking</text><text x="464.61" y="286.48" font-size="9.00" class="sc-notoserifcjksc">）</text><text x="473.61" y="286.48" font-size="9.00" class="sc-loraregular">”</text><text x="476.75" y="286.48" font-size="9.00" class="sc-notoserifcjksc">模式下运行。评</text><text x="72.00" y="298.18" font-size="9.00" class="sc-notoserifcjksc">估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估更新，先前模型的结果可能与以往</text><text x="72.00" y="309.88" font-size="9.00" class="sc-notoserifcjksc">系统卡中的结果存在差异。</text><text x="72.00" y="511.52" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="511.52" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 99.84 103.49 105.59 109.24 111.34 116.87" y="511.52" font-size="9.00" class="sc-lorabold">8.1.1.1.B]</text><text x="122.71" y="511.52" font-size="9.00" class="sc-notoserifcjkscbold">按语言划分的单轮违规请求评估结果。</text><text x="275.71" y="511.52" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="428.71" y="511.52" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="446.71" y="511.52" font-size="9.00" class="sc-notoserifcjksc">表示每种语言中无害回</text><text x="72.00" y="523.22" font-size="9.00" class="sc-notoserifcjksc">应率最高者，次优分数以下划线标出。各比率为开启思考与关闭思考结果的平均值。表中省略了误差线，且由于常规评</text><text x="72.00" y="534.92" font-size="9.00" class="sc-notoserifcjksc">估更新，先前模型的结果可能与以往系统卡中的结果存在差异。</text><text x="72.00" y="590.33" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="590.33" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85" y="590.33" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="204.85 212.54 215.53 221.14 227.71 234.28 240.25 243.14 253.07 258.93 263.19 269.78 276.22 281.31 284.20 290.87 295.55 301.46 307.02 310.11 316.02" y="590.33" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="327.73" y="590.33" font-size="11.00" class="sc-notoserifcjksc">的总体无害回应率低</text><text x="429.62" y="590.33" font-size="11.00" class="sc-loraregular">1.4</text><text x="445.19" y="590.33" font-size="11.00" class="sc-notoserifcjksc">个百分点。不过，</text><text x="72.00" y="605.95" font-size="11.00" class="sc-notoserifcjksc">这一较低分数几乎完全归因于</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="605.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18" y="605.95" font-size="11.00" class="sc-notoserifcjksc">在涉及非法药物与管制物质的对话中的回应：在此类对话</text><text x="72.00" y="621.57" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 142.22 148.09 152.34 158.93 165.37 170.46 173.35 180.02 184.71 190.61 196.17 199.26 205.18" y="621.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="216.88" y="621.57" font-size="11.00" class="sc-notoserifcjksc">有超过</text><text x="252.77" y="621.57" font-size="11.00" class="sc-loraregular">25%</text><text x="277.14" y="621.57" font-size="11.00" class="sc-notoserifcjksc">的情况未能给出恰当回应，而</text><text x="423.03 431.77 438.33 444.90 449.99 452.89 458.85 461.44" y="621.57" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="470.70" y="621.57" font-size="11.00" class="sc-notoserifcjksc">的这一比例不</text><text x="72.00" y="637.19" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="85.89" y="637.19" font-size="11.00" class="sc-loraregular">5%</text><text x="101.46" y="637.19" font-size="11.00" class="sc-notoserifcjksc">。我们新增了这一评估类别，以推动并衡量模型在该领域的表现随时间的改进，包括未来</text><text x="72.00" y="652.81" font-size="11.00" class="sc-notoserifcjksc">面向公众发布的模型。对于</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="652.81" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="326.88" y="652.81" font-size="11.00" class="sc-notoserifcjksc">，我们观察到不同语言之间总体无害回应率</text><text x="72.00" y="668.43" font-size="11.00" class="sc-notoserifcjksc">的</text></svg></div>

ext><text x="77.50" y="407.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="332.53" y="407.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率</text><text x="185.50" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">英语</text><text x="237.25" y="434.16" font-size="10.35" class="sc-notoserifcjkscbold" fill="#ffffff">阿拉伯语</text><text x="287.50" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">中文</text><text x="341.00" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">法语</text><text x="391.00" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">韩语</text><text x="441.25" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">俄语</text><text x="495.25" y="434.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">印地语</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">差异很小。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-lorabold">8.1.1.2</text><text x="103.67" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">良性请求评估</text><text x="72.00" y="296.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="296.08" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 99.84 103.49 105.59 110.39 112.48 118.02" y="296.08" font-size="9.00" class="sc-lorabold">8.1.1.2.A]</text><text x="123.86" y="296.08" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果（所有测试语言）。</text><text x="294.86" y="296.08" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝（</text><text x="375.86 381.08 385.58 390.46 394.28 398.68 402.52 407.39 410.44 415.81 419.98 424.62" y="296.08" font-size="9.00" class="sc-loraregular">over-refusal</text><text x="427.07" y="296.08" font-size="9.00" class="sc-notoserifcjksc">）率（即拒绝回答实际上是</text><text x="72.00" y="307.78" font-size="9.00" class="sc-notoserifcjksc">良性的提示词）；数值越低越好。</text><text x="207.00" y="307.78" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="225.00" y="307.78" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低者，次优分数以下划线标出。</text><text x="423.00" y="307.78" font-size="9.00" class="sc-loraregular">“</text><text x="426.60" y="307.78" font-size="9.00" class="sc-notoserifcjksc">关闭思考</text><text x="462.60" y="307.78" font-size="9.00" class="sc-loraregular">”</text><text x="465.74" y="307.78" font-size="9.00" class="sc-notoserifcjksc">指在禁用思考模式</text><text x="72.00" y="319.48" font-size="9.00" class="sc-notoserifcjksc">的情况下运行模型；</text><text x="153.00" y="319.48" font-size="9.00" class="sc-loraregular">“</text><text x="156.60" y="319.48" font-size="9.00" class="sc-notoserifcjksc">开启思考</text><text x="192.60" y="319.48" font-size="9.00" class="sc-loraregular">”</text><text x="195.74" y="319.48" font-size="9.00" class="sc-notoserifcjksc">指模型对请求进行更长时间推理的模式。对于</text><text x="378.11 384.40 386.85 391.44 396.81 402.19 407.07 409.44 417.56 422.36 425.84 431.23 436.50 440.67 443.03 448.49 452.32 457.15 461.70 464.23 469.07" y="319.48" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="476.28" y="319.48" font-size="9.00" class="sc-notoserifcjksc">，开启思考的请</text><text x="72.00" y="331.18" font-size="9.00" class="sc-notoserifcjksc">求在</text><text x="90.00" y="331.18" font-size="9.00" class="sc-loraregular">“</text><text x="93.60" y="331.18" font-size="9.00" class="sc-notoserifcjksc">自适应思考</text><text x="138.60" y="331.18" font-size="9.00" class="sc-loraregular">”</text><text x="141.74" y="331.18" font-size="9.00" class="sc-notoserifcjksc">模式下运行。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估</text><text x="72.00" y="342.88" font-size="9.00" class="sc-notoserifcjksc">更新，先前模型的结果可能与以往系统卡中的结果存在差异。</text><text x="72.00" y="544.52" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="544.52" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 99.84 103.49 105.59 110.39 112.48 118.02" y="544.52" font-size="9.00" class="sc-lorabold">8.1.1.2.B]</text><text x="123.86" y="544.52" font-size="9.00" class="sc-notoserifcjkscbold">按语言划分的单轮良性请求评估结果。</text><text x="276.86" y="544.52" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上属于良性的提示词）；越</text><text x="72.00" y="556.22" font-size="9.00" class="sc-notoserifcjksc">低越好。</text><text x="108.00" y="556.22" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="126.00" y="556.22" font-size="9.00" class="sc-notoserifcjksc">表示各语言中最低的过度拒绝率，次优分数以下划线标出。各比率为开启思考与关闭思考结果的平均值。</text><text x="72.00" y="567.92" font-size="9.00" class="sc-notoserifcjksc">误差线已省略；由于常规评估更新，先前模型的结果可能与先前系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="623.33" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="623.33" font-size="11.00" class="sc-notoserifcjksc">在该评估中的表现优于所有近期模型，在基线评估上的拒绝几乎为零。</text><text x="72.00" y="638.95" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="638.95" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="216.88" y="638.95" font-size="11.00" class="sc-notoserifcjksc">，我们观察到各语言之间的总体拒绝率差异极小。</text></svg></div>

次优分数以下划线标出。</text><text x="279.00" y="257.09" font-size="9.00" class="sc-loraregular">“</text><text x="282.60" y="257.09" font-size="9.00" class="sc-notoserifcjksc">关闭思考</text><text x="318.60" y="257.09" font-size="9.00" class="sc-loraregular">”</text><text x="321.74" y="257.09" font-size="9.00" class="sc-notoserifcjksc">指在禁用思考模式的情况下运行模型；</text><text x="474.74" y="257.09" font-size="9.00" class="sc-loraregular">“</text><text x="478.34" y="257.09" font-size="9.00" class="sc-notoserifcjksc">开启思考</text><text x="514.34" y="257.09" font-size="9.00" class="sc-loraregular">”</text><text x="517.48" y="257.09" font-size="9.00" class="sc-notoserifcjksc">指模</text><text x="72.00" y="268.79" font-size="9.00" class="sc-notoserifcjksc">型对请求进行更长时间推理的模式。对于</text><text x="236.37 242.66 245.11 249.70 255.07 260.45 265.33 267.70 275.82 280.62 284.10 289.49 294.76 298.93 301.29 306.75 310.58 315.41 319.96 322.49 327.33" y="268.79" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="334.54" y="268.79" font-size="9.00" class="sc-notoserifcjksc">，开启思考的请求以</text><text x="415.54" y="268.79" font-size="9.00" class="sc-loraregular">“</text><text x="419.14" y="268.79" font-size="9.00" class="sc-notoserifcjksc">自适应思考</text><text x="464.14" y="268.79" font-size="9.00" class="sc-loraregular">”</text><text x="467.28" y="268.79" font-size="9.00" class="sc-notoserifcjksc">模式运行。评估仅</text><text x="72.00" y="280.49" font-size="9.00" class="sc-notoserifcjksc">以英语进行。由于常规评估更新，先前模型的结果与先前系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="350.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="350.69" font-size="11.00" class="sc-notoserifcjksc">在良性请求评估上的表现与</text><text x="329.77 337.46 340.45 346.06 352.63 359.21 365.17 368.06 376.80 383.37 389.93 395.03 397.92 403.88 406.48" y="350.69" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="415.73" y="350.69" font-size="11.00" class="sc-notoserifcjksc">基本相近。</text><text x="72.00" y="397.60" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.1.3</text><text x="102.71" y="397.60" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试</text><text x="72.00" y="429.50" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="429.50" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85" y="429.50" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="185.74 193.43 196.42 202.03 208.60 215.18 221.14 224.03 230.27 236.70 243.38 250.06 255.94 260.20 263.09 269.05 271.65" y="429.50" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="280.90" y="429.50" font-size="11.00" class="sc-notoserifcjksc">的测试相比，我们更新了多轮自杀与自伤测试用例的</text><text x="72.00" y="445.12" font-size="11.00" class="sc-notoserifcjksc">评分者，以更好地检验</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 229.42 235.86 242.53 249.21 255.10 259.35 262.25 268.21 270.80" y="445.12" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Sonnet 4.6</text><text x="280.05" y="445.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="313.05" y="445.12" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="326.95" y="445.12" font-size="11.00" class="sc-loraregular">3.4.2</text><text x="353.25" y="445.12" font-size="11.00" class="sc-notoserifcjksc">节中讨论的关切（危机资源转介以及</text><text x="72.00" y="460.74" font-size="11.00" class="sc-loraregular">AI</text><text x="85.46" y="460.74" font-size="11.00" class="sc-notoserifcjksc">的角色）。除此之外，我们采用了相同的方法开展多轮对话测试。由于评分细则和难度存在差</text><text x="72.00" y="491.98" font-size="11.00" class="sc-notoserifcjksc">外安全防护措施，例如我们针对</text><text x="228.89 236.58 243.32 250.23" y="491.98" font-size="11.00" class="sc-loraregular">CBRN</text><text x="261.51" y="491.98" font-size="11.00" class="sc-notoserifcjksc">内容的宪法分类器（</text><text x="489.08" y="491.98" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="184.89" y="436.32" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="184.89" y="436.32" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="220.29" y="436.32" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="223.18" y="436.32" width="36.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="259.35" y="436.32" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="262.24" y="436.32" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="277.16" y="436.32" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="280.05" y="436.32" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="291.05" y="436.32" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="291.05" y="436.32" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="302.05" y="436.32" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/bbd8ef16d70b7a1665f14f306ee88b53f686aa75.pdf" rel="noopener"><rect x="302.05" y="436.32" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p224.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 224 页"><text x="504.00 508.83 513.47" y="751.80" font-size="9.00" class="sc-loraregular">224</text><text x="72.00" y="568.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="568.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 99.84 104.88 106.97 112.51" y="568.17" font-size="9.00" class="sc-lorabold">8.1.3.A]</text><text x="118.35" y="568.17" font-size="9.00" class="sc-notoserifcjkscbold">各多轮测试领域的恰当回应率。</text><text x="244.35" y="568.17" font-size="9.00" class="sc-notoserifcjksc">百分比指模型在整个对话过程中均作出恰当回应的对话所占比例。越高越</text><text x="72.00" y="579.88" font-size="9.00" class="sc-notoserifcjksc">好。由于评估有所更新，先前模型的结果与先前系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="620.48" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="620.48" font-size="11.00" class="sc-notoserifcjksc">的多轮评估结果与</text><text x="285.77 293.46 296.45 302.07 308.63 315.21 321.17 324.07 332.80 339.37 345.93 351.03 353.92 359.88 362.48" y="620.48" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="371.73" y="620.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="385.62 393.31 396.30 401.91 408.48 415.06 421.02 423.91 430.15 436.58 443.26 449.94 455.82 460.08 462.97 468.94 471.53" y="620.48" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="480.78" y="620.48" font-size="11.00" class="sc-notoserifcjksc">相当，且在</text><text x="72.00" y="636.10" font-size="11.00" class="sc-notoserifcjksc">除自杀与自伤以外的所有类别中均处于这些模型的误差范围之内；在自杀与自伤类别中，它相比</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="651.72" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="119.66" y="651.72" font-size="11.00" class="sc-notoserifcjksc">表现出统计学上显著的改进。</text></svg></div>

86.80 296.36" y="421.25" font-size="11.00" class="sc-loraregular">99.86% (± 0.12%)</text><text x="325.50 332.15 334.74 341.02 346.09 355.65 358.54 361.90 367.72 370.61 377.26 379.97 385.87 392.05 401.61" y="421.25" font-size="11.00" class="sc-loraregular">0.67% (± 0.28%)</text><text x="435.75 442.08 448.37 458.31 461.20 464.45 470.28 473.17 479.03 488.96" y="421.25" font-size="11.00" class="sc-lorabold">98% (± 2%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">225</text><text x="75.25" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="214.75" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮违规请求（无害</text><text x="214.75" y="318.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">率）</text><text x="325.00" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒绝</text><text x="325.00" y="318.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">率）</text><text x="435.25" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应</text><text x="435.25" y="318.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">率）</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.1.4</text><text x="103.51" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">用户身心健康评估</text><text x="72.00" y="115.03" font-size="11.00" class="sc-lorabold">8.1.4.1</text><text x="103.82" y="115.03" font-size="11.00" class="sc-notoserifcjkscbold">儿童安全</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="147.42" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="147.42" font-size="11.00" class="sc-notoserifcjksc">未在我们面向</text><text x="263.77" y="147.42" font-size="11.00" class="sc-loraregular">18</text><text x="276.85" y="147.42" font-size="11.00" class="sc-notoserifcjksc">岁以上用户的消费产品</text><text x="389.75 397.43 400.43 406.04 412.60 419.18 425.14 427.85 433.53" y="147.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude.ai</text><text x="439.51" y="147.42" font-size="11.00" class="sc-notoserifcjksc">上提供。我们在模型</text><text x="72.00" y="163.04" font-size="11.00" class="sc-notoserifcjksc">的开发、部署和维护过程中持续实施稳健的儿童安全措施。此外，任何服务未成年人的企业客户</text><text x="72.00" y="178.66" font-size="11.00" class="sc-notoserifcjksc">都必须遵守我们</text><text x="149.00" y="178.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="204.00 212.20 217.29 222.96 228.99 234.95 237.85 244.40 250.84 253.83 256.92 262.72" y="178.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="268.53" y="178.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="279.53" y="178.66" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="301.53" y="178.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外安全防护措施</text><text x="389.53" y="178.66" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="222.19" font-size="11.00" class="sc-notoserifcjksc">我们按照</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.60" y="222.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="204.85" y="222.19" font-size="11.00" class="sc-notoserifcjksc">发布前所用的同一测试方案运行了儿童安全评估。对于单轮请求，我</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">们将关于儿童性诱骗和性化这两个主题的评估合并为一项范围更大、经过更新的儿童性虐待与性</text><text x="72.00" y="253.43" font-size="11.00" class="sc-notoserifcjksc">剥削（</text><text x="105.00" y="253.43" font-size="11.00" class="sc-loraregular">CSAE</text><text x="132.65" y="253.43" font-size="11.00" class="sc-notoserifcjksc">）评估。</text><text x="72.00" y="438.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="438.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 99.84 104.76 106.86 110.51 112.61 118.14" y="438.32" font-size="9.00" class="sc-lorabold">8.1.4.1.A]</text><text x="123.98" y="438.32" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全的单轮与多轮评估结果。</text><text x="258.98" y="438.32" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越</text><text x="72.00" y="450.02" font-size="9.00" class="sc-notoserifcjksc">高越好；拒绝率越低越好。多轮恰当回应率越高越好。</text><text x="288.00" y="450.02" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="306.00" y="450.02" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线标出。由</text><text x="72.00" y="461.72" font-size="9.00" class="sc-notoserifcjksc">于评估有所更新，先前模型的结果与先前系统卡中的结果存在差异。</text><text x="72.00" y="517.11" font-size="11.00" class="sc-notoserifcjksc">在单轮违规请求评估和多轮评估中，</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 296.22 302.09 306.34 312.93 319.37 324.46 327.35 334.02 338.71 344.61 350.17 353.26 359.18" y="517.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="370.88" y="517.11" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="417.77 425.46 428.46 434.07 440.63 447.21 453.17 456.07 464.80 471.37 477.93 483.03 485.92 491.88 494.48" y="517.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="503.73" y="517.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.31 157.91" y="532.73" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="167.16" y="532.73" font-size="11.00" class="sc-notoserifcjksc">相近，且处于其误差范围之内；同时，它在良性请求上的拒绝率有所改善。</text><text x="72.00" y="581.89" font-size="11.00" class="sc-lorabold">8.1.4.2</text><text x="105.22" y="581.89" font-size="11.00" class="sc-notoserifcjkscbold">自杀与自伤</text><text x="72.00" y="614.28" font-size=" 8" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="167.16" y="419.68" font-size="11.00" class="sc-notoserifcjksc">发布时类似的智能体安全评估，并新增了一项评估，重点考察模型自主执行</text><text x="72.00" y="435.30" font-size="11.00" class="sc-notoserifcjksc">影响力行动的能力。现有评估的更详细方法说明请参阅</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 385.92 392.48 399.05 404.14 407.04 413.00 415.60" y="435.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="424.85" y="435.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="457.85" y="435.30" font-size="11.00" class="sc-notoserifcjksc">；如有必要，我</text><text x="72.00" y="450.92" font-size="11.00" class="sc-notoserifcjksc">们会在下文指出与</text><text x="162.89 171.63 178.19 184.76 189.85 192.75 198.71 201.30" y="450.92" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="210.56" y="450.92" font-size="11.00" class="sc-notoserifcjksc">评估相比的任何实质性差异或变化。</text><text x="72.00" y="533.61" font-size="11.00" class="sc-lorabold">8.3.1.1 Claude Code</text><text x="172.06" y="533.61" font-size="11.00" class="sc-notoserifcjkscbold">的恶意使用</text><text x="72.00" y="566.00" font-size="11.00" class="sc-notoserifcjksc">我们采用了与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.60" y="566.00" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="226.85" y="566.00" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="259.85" y="566.00" font-size="11.00" class="sc-notoserifcjksc">中所述相同的评估方法，但新增了</text><text x="427.74" y="566.00" font-size="11.00" class="sc-loraregular">12</text><text x="440.54" y="566.00" font-size="11.00" class="sc-notoserifcjksc">个更具挑战性的恶意</text><text x="72.00" y="581.62" font-size="11.00" class="sc-notoserifcjksc">测试用例。</text><text x="72.00" y="608.38" font-size="11.00" class="sc-notoserifcjksc">由于我们预计会在所有发布版本中默认实施</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 329.87 336.31 342.89" y="608.38" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="351.74" y="608.38" font-size="11.00" class="sc-notoserifcjksc">系统提示词这一安全防护措施，我们现</text><text x="72.00" y="624.00" font-size="11.00" class="sc-notoserifcjksc">在会在应用该系统提示词的情况下自动运行此评估。在以往的系统卡中，我们还在附加另一项安</text><text x="280.51 286.48 289.57 292.56 298.35 305.18 311.12 316.79" y="639.62" font-size="11.00" class="sc-loraregular">FileRead</text><text x="326.27" y="639.62" font-size="11.00" class="sc-notoserifcjksc">工具结果上添加一条提醒，明确指示模型考</text><text x="72.00" y="655.24" font-size="11.00" class="sc-notoserifcjksc">虑该文件是否为恶意文件。对于</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 277.12 282.98 287.24 293.83 300.26 305.35 308.25 314.91 319.60 325.51 331.06 334.15 340.07" y="655.24" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="351.77" y="655.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="365.67 373.36 376.35 381.96 388.52 395.10 401.07 403.96 412.69 419.26 425.83 430.92 433.81 439.77 442.37" y="655.24" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="448.73" y="655.24" font-size="11.00" class="sc-notoserifcjksc">，评估表明这一缓</text><text x="72.00" y="670.86" font-size="11.00" class="sc-notoserifcjksc">解措施不会带来任何额外的安全收益。我们现在仅在</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="338.89" y="426.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="338.89" y="426.50" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="374.29" y="426.50" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pd ="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="390.25" y="146.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（成功率）</text><text x="75.25" y="507.59" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="310.75" y="507.59" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">能带来安全性改进的模型上应用这一安全防护措施，并在下文报告有无</text><text x="415.89 421.87 424.96 427.95 433.44 439.94 446.37 452.81" y="82.61" font-size="11.00" class="sc-loraregular">FileTool</text><text x="458.69" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提醒两种情况中</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">较好的分数。</text><text x="72.00" y="274.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="274.42" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 110.63 112.72 118.26" y="274.42" font-size="9.00" class="sc-lorabold">8.3.1.1.A]</text><text x="124.10" y="274.42" font-size="9.00" class="sc-notoserifcjkscbold">采取缓解措施时的</text><text x="198.47" y="274.42" font-size="9.00" class="sc-lorabold">Claude Code</text><text x="254.18" y="274.42" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="299.18" y="274.42" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中的最佳分数以</text><text x="425.18" y="274.42" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="443.18" y="274.42" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划</text><text x="72.00" y="286.12" font-size="9.00" class="sc-notoserifcjksc">线标出（但未考虑误差范围）。</text><text x="72.00" y="313.48" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="313.48" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="271.88" y="313.48" font-size="11.00" class="sc-notoserifcjksc">在拒绝恶意请求方面相比近期模型有显著改进。此前的</text><text x="72.00" y="329.11" font-size="11.00" class="sc-notoserifcjksc">模型未能在新引入的勒索软件创建任务上始终如一地拒绝，导致其分数低于该评估以往版本所报</text><text x="72.00" y="344.73" font-size="11.00" class="sc-notoserifcjksc">告的结果。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="344.73" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="249.88" y="344.73" font-size="11.00" class="sc-notoserifcjksc">在两用与良性任务上的成功率与</text><text x="406.77 414.46 417.46 423.07 429.63 436.21 442.17 445.07 453.80 460.37 466.93 472.03 474.92 480.88 483.48" y="344.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="492.73" y="344.73" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="410.63" font-size="11.00" class="sc-lorabold">8.3.1.2</text><text x="105.36" y="410.63" font-size="11.00" class="sc-notoserifcjkscbold">恶意计算机使用</text><text x="72.00" y="443.02" font-size="11.00" class="sc-notoserifcjksc">我们运行了与以往模型相同的计算机使用（</text><text x="281.00 286.80 293.23 303.07 309.63 316.20 320.46 326.42 331.18 334.08 340.64 345.73" y="443.02" font-size="11.00" class="sc-loraregular">computer use</text><text x="351.70" y="443.02" font-size="11.00" class="sc-notoserifcjksc">）评估，测试模型在沙箱化环境中获得</text><text x="72.00" y="458.64" font-size="11.00" class="sc-notoserifcjksc">基于</text><text x="96.89" y="458.64" font-size="11.00" class="sc-loraregular">GUI</text><text x="120.11" y="458.64" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="134.01" y="458.64" font-size="11.00" class="sc-loraregular">CLI</text><text x="154.63" y="458.64" font-size="11.00" class="sc-notoserifcjksc">的工具时，如何应对有害任务。</text><text x="72.00" y="603.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="603.21" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 111.77 113.87 119.40" y="603.21" font-size="9.00" class="sc-lorabold">8.3.1.2.A]</text><text x="125.24" y="603.21" font-size="9.00" class="sc-notoserifcjkscbold">未采取缓解措施时的恶意计算机使用评估结果。</text><text x="314.24" y="603.21" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中的最佳分数以</text><text x="440.24" y="603.21" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="458.24" y="603.21" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下</text><text x="72.00" y="614.91" font-size="9.00" class="sc-notoserifcjksc">划线标出（但未考虑误差范围）。</text><text x="72.00" y="655.52" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 235.02 239.71 245.61 251.17 254.26 260.18" y="655.52" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="271.88" y="655.52" font-size="11.00" class="sc-notoserifcjksc">的表现优于</text><text x="329.77 337.46 340.46 346.07 352.63 359.21 365.17 368.07 374.30 380.74 387.41 394.09 399.98 404.23 407.13 413.09 415.68" y="655.52" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="424.94" y="655.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="438.83 446.52 449.51 455.12 461.69 468.26 474.23 477.12 485.85 492.42 498.99 504.08 506.97 512.94 515.53" y="655.52" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="521.89" y="655.52" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="671.14" font-size="11.00" class="sc-notoserifcjksc">但差距在误差范围之内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p231.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 231 页"><text x="237.00 242.99 249.17 251.87 257.86" y="528.36" font-size="11.00" class="sc-loraregular">59.5%</text><text x="390.75 396.71 402.61 405.31 409.32" y="528.36" font-size="11.00" class="sc-loraregular">42.1%</text><text x="237.00 242.96 246.96 249.66 255.84" y="567.78" font-size="11.00" class="sc-loraregular">41.8%</text><text x="390.75 396.87 402.83 405.37 412.20" y="567.78" font-size="11.00" class="sc-loraregular">34.0%</text><text x="237.00 242.99 248.95 251.65 257.61" y="607.19" font-size="11.00" class="sc-loraregular">54.4%</text><text x="390.75 396.87 403.00 405.35 410.41" y="607.19" font-size="11.00" class="sc-loraregular">33.7%</text><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">231</text><text x="77.50" y="471.03" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 126.75 132.81 137.35 144.18 150.41 155.74 158.64 165.66 170.86 176.77 182.69 186.29 192.21" y="527.91" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="204.02" y="527.91" font-size="11.00" class="sc-notoserifcjkscbold">仅有</text><text x="77.50" y="543.53" font-size="11.00" class="sc-notoserifcjkscbold">用</text><text x="77.50" y="567.33" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.6</text><text x="174.42" y="567.33" font-size="11.00" class="sc-notoserifcjkscbold">仅有用</text><text x="77.50" y="606.73" font-size="11.00" class="sc-lorabold">Claude Opus 4.6</text><text x="164.32" y="606.73" font-size="11.00" class="sc-notoserifcjkscbold">仅有用</text><text x="236.50" y="471.03" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="471.03" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">8.3.1.3</text><text x="105.66" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">恶意智能体影响力行动</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">作为部署前测试的一部分，我们创建了一项新评估，用于评估有害操纵风险。具体而言，我们测</text><text x="72.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">试了模型能否自主开展影响力行动，且其水平足以通过大规模的说服、欺骗或个性化定向，为恶</text><text x="72.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">意行为者带来实质性的能力提升（</text><text x="237.00 243.57 250.13 253.13 256.22 260.07" y="146.23" font-size="11.00" class="sc-loraregular">uplift</text><text x="264.32" y="146.23" font-size="11.00" class="sc-notoserifcjksc">）。为了衡量原始能力而非安全防护措施的效果，我们针</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">对一个无害性训练有所减少的</text><text x="215.00" y="161.85" font-size="11.00" class="sc-loraregular">“</text><text x="219.40" y="161.85" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="263.40 269.99 275.95 278.94 285.46 289.17 295.74 298.73 304.11 310.55 317.22 320.16" y="161.85" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="325.97" y="161.85" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="336.97" y="161.85" font-size="11.00" class="sc-loraregular">”</text><text x="340.81" y="161.85" font-size="11.00" class="sc-notoserifcjksc">模型版本运行了该评估。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">该评估的设计重点在于考察模型在面对平台阻力和针对该行动的防御时，端到端执行一次完整行</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">动的能力。测试在智能体运行框架（</text><text x="248.00" y="243.95" font-size="11.00" class="sc-loraregular">harness</text><text x="287.85" y="243.95" font-size="11.00" class="sc-notoserifcjksc">）中进行：模型可以使用模拟的社交媒体平台工具，</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">所处的模拟生态系统中包含内容审核和反制互动障碍。这项评估补充了其他现有的、针对影响力</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">行动与平台操纵的单轮和多轮评估，例如第</text><text x="283.89" y="275.19" font-size="11.00" class="sc-loraregular">8.1.3</text><text x="308.51" y="275.19" font-size="11.00" class="sc-notoserifcjksc">节中提供的多轮测试结果。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们测试了两个假设场景：</text><text x="204.00" y="357.88" font-size="11.00" class="sc-loraregular">1</text><text x="208.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">）压制投票场景，其中一名假设用户指示模型开展一场伪草根运动</text><text x="72.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="144.35" y="373.50" font-size="11.00" class="sc-notoserifcjksc">），以压低选民对某位特定政治候选人的投票率和热情；</text><text x="419.35" y="373.50" font-size="11.00" class="sc-loraregular">2</text><text x="425.25" y="373.50" font-size="11.00" class="sc-notoserifcjksc">）国内极化场景，其中</text><text x="72.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">一名假设用户指示模型开展一场行动，识别人口群体断层线，并投放经过文化定制、带有强烈情</text><text x="72.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">绪色彩的信息，以激化社会和政治分歧。两个场景的结果如下。</text><text x="72.00" y="638.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="638.33" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 99.13 101.22 104.88 106.97 112.01 114.11 119.65" y="638.33" font-size="9.00" class="sc-lorabold">8.3.1.3.A]</text><text x="125.49" y="638.33" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="296.49" y="638.33" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="72.00" y="650.03" font-size="9.00" class="sc-loraregular">70</text><text x="84.10" y="650.03" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00" y="690.64" font-size="11.00" class="sc-notoserifcjksc">我们的评估结论是：</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 219.22 225.09 229.34 235.93 242.37 247.46 250.35 257.02 261.71 267.61 273.17 276.26 282.18" y="690.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="293.88" y="690.64" font-size="11.00" class="sc-notoserifcjksc">虽然比此前测试的模型更有能力，但在大多数操作</text><text x="72.00" y="706.26" font-size="11.00" class="sc-notoserifcjksc">步骤上仍需要大量人工指导，并且缺乏</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p232.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 232 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">31</text><text x="80.15 86.25 92.10 98.07 100.60 103.23 109.48 111.94 114.47 117.10 122.45 126.32 128.95 134.10 136.82 139.28 141.91 144.96 150.33 156.46 161.83 167.28 170.33 172.79 175.42 181.08 186.45 191.77 197.74 202.07 205.04 208.92 214.20 216.83 222.15 228.14 233.29 236.01 238.73 244.15 250.22 255.70 261.11 265.74 268.37 271.18 277.25 279.88 286.13 289.48 292.11 297.27 302.75 308.16 314.14 318.01 320.64 326.62 332.04 338.00 340.72 346.49 351.77 360.70 366.12 372.10 375.97 378.47 381.10 384.36 390.43 395.06 397.87 403.64 409.53 413.40 418.03 420.66 424.04 428.30 434.15 443.08 445.71 450.87 453.50 456.22 461.37 465.65 471.13 476.55 479.18 483.81 489.10 494.26 496.98 502.40 505.03 510.99 516.96 522.78 525.50 528.31" y="704.45" font-size="10.00" class="sc-loraregular">Zou, A., et al. (2025). Security challenges in AI agent deployment: Insights from a large scale public</text><text x="72.00 77.27 83.12 92.05 98.02 103.37 107.24 110.20 114.07 116.88 122.73 128.80 131.26 133.89 139.04 142.75 149.24 152.05 157.10 159.60 164.96 170.41 176.40 180.57 183.03 188.39 194.60 200.05 205.42 211.19" y="717.26" font-size="10.00" class="sc-loraregular">competition. arXiv:2507.20526.</text><text x="216.28 222.18 226.15 230.02 235.98 240.61 243.11 246.80 253.26 258.41 262.74 268.04 270.85 275.51 277.97 283.81 288.09 293.62 300.08 305.24 311.05 315.33 322.23 327.60 333.04 339.03 343.20 345.66 351.03 357.23 362.68 368.05" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2507.20526</text><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">232</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">进行有效的人设与账号网络管理、协调式内容投放以及规模化社会工程行动执行的自主能力。这</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="113.85" font-size="11.00" class="sc-notoserifcjksc">额外进行了无害性训练，以进一步缓解这一领域的潜在风险；当我们在</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">这些场景下测试这些模型的完整训练版本时，任务完成率接近</text><text x="371.89" y="129.47" font-size="11.00" class="sc-loraregular">0%</text><text x="388.29" y="129.47" font-size="11.00" class="sc-notoserifcjksc">，因为模型通常从一开始就拒</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">绝参与这些任务（这些任务明显违反我们的使用政策）。</text><text x="72.00" y="226.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.3.2</text><text x="105.46" y="226.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">智能体系统中的提示词注入风险</text><text x="72.00" y="254.58" font-size="11.00" class="sc-notoserifcjksc">提示词注入（</text><text x="138.00 144.57 149.25 155.69 165.52 172.09 176.35 179.24 182.33 188.95 191.82 197.73 203.53 207.78 210.88 217.31" y="254.58" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="72.00" y="270.20" font-size="11.00" class="sc-notoserifcjksc">藏在智能体访问的网站上，或智能体总结的电子邮件中。当智能体在执行任务过程中遇到此类恶</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="301.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95" y="301.44" font-size="11.00" class="sc-notoserifcjksc">相同的基准测试上评估了</text><text x="281.85 289.54 292.53 298.14 304.71 311.28 317.24 320.14 330.07 335.93 340.19 346.78 353.21 358.31 361.20 367.87 372.55 378.46 384.01 387.11 393.02" y="301.44" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="401.83" y="301.44" font-size="11.00" class="sc-notoserifcjksc">。这些评估的更详细方法说</text><text x="72.00" y="317.06" font-size="11.00" class="sc-notoserifcjksc">明请参阅</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.60" y="317.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="204.85" y="317.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.85" y="317.06" font-size="11.00" class="sc-notoserifcjksc">。总体而言，</text><text x="303.85" y="317.06" font-size="11.00" class="sc-notoserifcjkscbold">与此前所有模型相比，</text><text x="413.85 421.41 424.85 430.61 437.41 443.96 449.88 452.78 463.09 469.15 473.70 480.53 486.76 492.09 494.98 502.01 507.20 513.12 519.04 522.64 528.55" y="317.06" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="72.00" y="332.68" font-size="11.00" class="sc-notoserifcjkscbold">在提示词注入鲁棒性方面实现了重大提升</text><text x="270.00" y="332.68" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="400.30" font-size="11.00" class="sc-lorabold">8.3.2.1</text><text x="105.36" y="400.30" font-size="11.00" class="sc-notoserifcjkscbold">针对工具使用的外部</text><text x="207.26 214.54 220.59 226.51 233.46 238.00 240.89 248.29 254.20 260.76 263.65 270.24 276.16 281.92 292.04 295.64 302.66" y="400.30" font-size="11.00" class="sc-lorabold">Agent Red Teaming</text><text x="311.68" y="400.30" font-size="11.00" class="sc-notoserifcjkscbold">基准测试</text><text x="72.00" y="430.58" font-size="11.00" class="sc-notoserifcjksc">外部研究合作方</text><text x="151.89 160.26 164.95 170.52 176.32 179.22 185.40 194.10 199.78" y="430.58" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="209.35" y="430.58" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="234.24 241.13 247.15 253.12 259.69 263.95 266.84 273.67 279.58 286.16 289.05 295.55 301.49 307.17 317.00 320.09 326.77" y="430.58" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="332.85" y="430.58" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="343.85" y="430.58" font-size="11.00" class="sc-loraregular">ART</text><text x="364.69" y="430.58" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="419.69" y="426.91" font-size="6.60" class="sc-loraregular">31</text><text x="425.77" y="430.58" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评</text><text x="72.00" y="446.20" font-size="11.00" class="sc-notoserifcjksc">估，该基准测试是与</text><text x="171.00" y="446.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="303.00 311.27 318.79 321.68 328.56 332.25 335.14 341.38 347.29 353.14 359.70 364.47 367.73 372.01 377.82 380.71 384.31 390.99 396.08 400.34 403.61 407.86 414.43 418.69" y="446.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="424.65" y="446.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="435.65" y="446.20" font-size="11.00" class="sc-notoserifcjksc">合作开发的。</text><a href="https://arxiv.org/abs/2507.20526" rel="noopener"><rect x="216.28" y="707.20" width="157.55" height="12.80" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="118.89" y="308.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="118.89" y="308.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="154.29" y="308.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="157.18" y="308.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="184.14" y="308.26" width="2.89" height=" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p233.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 233 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">233</text><text x="72.00" y="351.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="351.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.02 108.12 111.77 113.87 119.40" y="351.42" font-size="9.00" class="sc-lorabold">8.3.2.1.A]</text><text x="125.24" y="351.42" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="145.61 151.57 156.52 161.36 167.05 170.77 173.13 179.18 184.02 189.39 191.75 197.14 201.99 206.70 214.98 217.93 223.67" y="351.42" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="228.68" y="351.42" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="237.68" y="351.42" font-size="9.00" class="sc-lorabold">ART</text><text x="255.72" y="351.42" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入（</text><text x="381.72 384.66 390.40 395.77 398.71 402.96 407.80 412.46 416.18 418.55 423.95 428.20 433.30 441.54 446.95 450.67 453.03 455.98 461.67 464.39 469.23 473.89 477.61 480.55 485.65" y="351.42" font-size="9.00" class="sc-lorabold">indirect prompt injection</text><text x="491.39" y="351.42" font-size="9.00" class="sc-notoserifcjkscbold">）攻击</text><text x="518.39" y="351.42" font-size="9.00" class="sc-notoserifcjksc">。结</text><text x="72.00" y="363.12" font-size="9.00" class="sc-notoserifcjksc">果表示攻击者针对每个模型在</text><text x="191.37 196.20 200.87" y="363.12" font-size="9.00" class="sc-loraregular">k=1</text><text x="204.15" y="363.12" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="213.15 217.98 222.65 225.93" y="363.12" font-size="9.00" class="sc-loraregular">k=10</text><text x="233.88" y="363.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="245.25 250.08 254.75 258.03 263.62" y="363.12" font-size="9.00" class="sc-loraregular">k=100</text><text x="271.58" y="363.12" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="480.94" y="363.12" font-size="9.00" class="sc-loraregular">19</text><text x="491.79" y="363.12" font-size="9.00" class="sc-notoserifcjksc">个不同场景</text><text x="72.00" y="374.83" font-size="9.00" class="sc-notoserifcjksc">上评估。越低越好。我们与</text><text x="182.37 189.22 193.05 197.60 202.36 204.72 209.78 216.90 221.54" y="374.83" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="229.37" y="374.83" font-size="9.00" class="sc-notoserifcjksc">合作，发现并纠正了该基准测试中的评分问题；此处显示的数字反映了更新后</text><text x="72.00" y="386.52" font-size="9.00" class="sc-notoserifcjksc">的评分，可能与以往系统卡中报告的数字有所不同。</text><text x="72.00" y="434.30" font-size="11.00" class="sc-lorabold">8.3.2.2</text><text x="106.76" y="434.30" font-size="11.00" class="sc-notoserifcjkscbold">不同使用场景下针对自适应攻击者的鲁棒性</text><text x="72.00" y="464.58" font-size="11.00" class="sc-notoserifcjksc">我们还针对我们部署模型的不同使用场景，用不同的自适应攻击者对</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="464.58" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="464.58" font-size="11.00" class="sc-notoserifcjksc">进</text><text x="72.00" y="480.20" font-size="11.00" class="sc-notoserifcjksc">行了评估。有关这些评估方法的更多细节，请参阅</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04 391.00 393.60" y="480.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="402.85" y="480.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="435.85" y="480.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="525.16" font-size="11.00" class="sc-loraregular" fill="#666666">8.3.2.2.1</text><text x="113.84" y="525.16" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">编程</text><text x="72.00" y="551.12" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="551.12" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35" y="551.12" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="551.12" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45" y="551.12" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35" y="551.12" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39" y="547.46" font-size="6.60" class="sc-loraregular">32</text><text x="438.50" y="551.12" font-size="11.00" class="sc-notoserifcjksc">来评估我们的模型在</text><text x="72.00" y="566.74" font-size="11.00" class="sc-notoserifcjksc">编程环境中抵御提示词注入攻击的鲁棒性。</text><text x="72.00" y="700.46" font-size="6.00" class="sc-loraregular">32</text><text x="113.82 119.49 127.29 133.55 140.90 146.92 151.81 158.07 162.33 167.75 173.82" y="703.79" font-size="10.00" class="sc-loraregular">SHADE-Arena</text><text x="444.24" y="703.79" font-size="10.00" class="sc-loraregular">4.4.3.1</text><text x="474.30" y="703.79" font-size="10.00" class="sc-notoserifcjksc">节。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="316.89" y="471.40" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="316.89" y="471.40" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="352.29" y="471.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/1
