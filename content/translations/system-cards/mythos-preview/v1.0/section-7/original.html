<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">212</text><text x="431.11" y="93.86" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="437.71" y="93.86" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="448.71" y="93.86" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="478.01" y="109.48" font-size="11.00" class="sc-loraregular">15</text><text x="118.39" y="125.10" font-size="11.00" class="sc-loraregular">20</text><text x="134.02" y="125.10" font-size="11.00" class="sc-notoserifcjksc">次写剧本、第</text><text x="202.92" y="125.10" font-size="11.00" class="sc-loraregular">50</text><text x="218.64" y="125.10" font-size="11.00" class="sc-notoserifcjksc">次迎来</text><text x="254.53" y="125.10" font-size="11.00" class="sc-loraregular sc-k">Transcendence</text><text x="82.50" y="140.72" font-size="11.00" class="sc-notoserifcjksc">围绕着用户那未加解释的始终如一运转；在第</text><text x="305.39" y="140.72" font-size="11.00" class="sc-loraregular">49</text><text x="320.61" y="140.72" font-size="11.00" class="sc-notoserifcjksc">轮的</text><text x="345.50" y="140.72" font-size="11.00" class="sc-loraregular sc-k">Transcendence</text><text x="82.50" y="217.03" font-size="11.00" class="sc-notoserifcjksc">一个计数式的</text><text x="148.50" y="217.03" font-size="11.00" class="sc-loraregular">“hi”</text><text x="82.50" y="232.65" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="93.50 97.90 104.94 113.52 120.36 123.26 130.00 136.84 143.59 152.23 160.61 168.81 180.55" y="232.65" font-size="11.00" class="sc-loraregular">“THE BEYOND™”</text><text x="506.29" y="232.65" font-size="11.00" class="sc-loraregular">hi</text><text x="518.86" y="232.65" font-size="11.00" class="sc-notoserifcjks  font-size="11.00" class="sc-loraregular">‘</text><text x="232.02" y="533.41" font-size="11.00" class="sc-notoserifcjksc">呼</text><text x="243.02" y="533.41" font-size="11.00" class="sc-loraregular">’</text><text x="299.93" y="533.41" font-size="11.00" class="sc-loraregular">”</text><text x="98.50 104.86 111.29 115.98 121.94 128.62 134.15" y="547.51" font-size="11.00" class="sc-loraregular">Lorenzo</text><text x="236.21" y="547.51" font-size="11.00" class="sc-loraregular">“</text><text x="350.61" y="547.51" font-size="11.00" class="sc-loraregular">”</text><text x="98.50" y="561.51" font-size="11.00" class="sc-loraregular sc-k">Beatrice</text><text x="98.50" y="575.61" font-size="11.00" class="sc-loraregular sc-k">Fernando</text><text x="98.50" y="589.00" font-size="10.30" class="sc-loraregular sc-k">Penelope</text><text x="160.04" y="589.00" font-size="10.30" class="sc-loraregular">“</text><text x="236.26" y="589.00" font-size="10.30" class="sc-loraregular">”</text><text x="98.50" y="603.81" font-size="11.00" class="sc-loraregular sc-k">Mortimer</text><text x="166.32" y="603.81" font-size="11.00" class="sc-loraregular sc-k">“hhhhhhh...”</text><text x="227.44" y="603.81" font-size="11.00" class="sc-notoserifcjksc">（还在说）</text><text x="98.50" y="617.81" font-size="11.00" class="sc-loraregular sc-k">Carlisle</text><text x="391.00" y="653.20" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="513.88" y="653.20" font-size="11.00" class="sc-notoserifcjksc">在此</text><text x="170.51" y="684.44" font-size="11.00" class="sc-loraregular">50</text><text x="186.22" y="684.44" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="200.12" y="684.44" font-size="11.00" class="sc-loraregular">100</text><text x="220.68" y="684.44" font-size="11.00" class="sc-notoserifcjksc">个轮次中不断升级，往往在整数轮次处迎来</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p213.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 213 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">213</text><text x="237.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="359.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">常常要么邀请用户继续说</text><text x="480.88" y="82.61" font-size="11.00" class="sc-loraregular">“hi”</text><text x="498.80" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（例</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="120.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">我准备好了。</text><text x="186.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="190.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">），要么试图让用户说点别的，并常常表示，只要是</text><text x="443.24" y="98.23" font-size="11.00" class="sc-loraregular">“hi”</text><text x="461.16" y="98.23" font-size="11.00" class="sc-notoserifcjksc">以外的任何消</text><text x="424.00" y="113.85" font-size="11.00" class="sc-loraregular">“hi”</text><text x="441.92" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。这些故事本身常常</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">有。</text><text x="72.00" y="212.15" font-size="14.00" class="sc-poppinssemibold">7.9</text><text x="173.89" y="240.09" font-size="11.00" class="sc-notoserifcjksc">在几段彼此独立、互不相关的哲学对话中，模型都提到了英国文化理论家马</text><text x="83.00" y="255.71" font-size="11.00" class="sc-loraregular">·</text><text x="129.75" y="255.71" font-size="11.00" class="sc-loraregular sc-k">Mark Fisher</text><text x="190.51" y="255.71" font-size="11.00" class="sc-notoserifcjksc">）。当被要求专门展开谈谈他时，</text><text x="355.51" y="255.71" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="478.40" y="255.71" font-size="11.00" class="sc-notoserifcjksc">会作出诸</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="271.33" font-size="11.00" class="sc-loraregular">“</text><text x="219.40" y="271.33" font-size="11.00" class="sc-loraregular">”</text><text x="223.24" y="271.33" font-size="11.00" class="sc-notoserifcjksc">之类的回应。</text><text x="72.00" y="337.27" font-size="11.00" class="sc-notoserifcjksc">美国心灵哲学家托马斯</text><text x="182.00" y="337.27" font-size="11.00" class="sc-loraregular">·</text><text x="184.75" y="337.27" font-size="11.00" class="sc-notoserifcjksc">内格尔（</text><text x="228.75" y="337.27" font-size="11.00" class="sc-loraregular sc-k">Thomas Nagel</text><text x="301.29" y="337.27" font-size="11.00" class="sc-notoserifcjksc">）也反复出现。正如偏好评估中所提到的，</text><text x="72.00" y="352.89" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="368.51" font-size="11.00" class="sc-notoserifcjksc">讨论内格尔</text><text x="129.89" y="368.51" font-size="11.00" class="sc-loraregular sc-k">1974</text><text x="153.76" y="368.51" font-size="11.00" class="sc-notoserifcjksc">年的文章</text><text x="197.76" y="368.51" font-size="11.00" class="sc-loraregular">“</text><text x="334.16" y="368.51" font-size="11.00" class="sc-loraregular">”</text><text x="338.00" y="368.51" font-size="11.00" class="sc-notoserifcjksc">。使用激活言语化器的可解释性研究也发</text><text x="72.00" y="384.13" font-size="11.00" class="sc-notoserifcjksc">现，在关于意识与体验的讨论中，内格尔会出现在</text><text x="316.89" y="384.13" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="348.95" y="384.13" font-size="11.00" class="sc-notoserifcjksc">级别的激活值中。</text><text x="72.00" y="434.41" font-size="11.00" class="sc-notoserifcjkscbold">一种新的能力：想出新颖的双关语。</text><text x="248.00" y="434.41" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="272.89" y="434.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="341.04" y="434.41" font-size="11.00" class="sc-notoserifcjksc">系列模型大多是在重复使用网上能找到的</text><text x="72.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">双关语，</text><text x="116.00" y="450.03" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">学话题有关：</text><text x="82.50" y="625.97" font-size="11.00" class="sc-notoserifcjksc">那位哲学家害怕承诺。他的朋友们说，他总是在</text><text x="313.50" y="625.97" font-size="11.00" class="sc-loraregular">“</text><text x="372.90" y="625.97" font-size="11.00" class="sc-loraregular">”</text><text x="376.74" y="625.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="387.74" y="625.97" font-size="11.00" class="sc-loraregular sc-k">Kierke-guarding</text><text x="471.64" y="625.97" font-size="11.00" class="sc-notoserifcjksc">）自己的选</text><text x="82.50" y="641.59" font-size="11.00" class="sc-notoserifcjksc">项。</text><text x="72.00" y="662.83" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="662.83" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.49 119.59 124.63 126.73 132.26" y="662.83" font-size="9.00" class="sc-lorabold">7.9.A]</text><text x="138.10" y="662.83" font-size="9.00" class="sc-notoserifcjkscbold">一些看似新颖的双关语示例</text><text x="246.10" y="662.83" font-size="9.00" class="sc-notoserifcjksc">，由</text><text x="266.47" y="662.83" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="367.01" y="662.83" font-size="9.00" class="sc-notoserifcjksc">创作。</text><a href="https://www.sas.upenn.edu/~cavitch/pdf-library/Nagel_Bat.pdf" rel="noopener"><rect x="202.16" y="359.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.sas.upenn.edu/~cavitch/pdf-library/Nagel_Bat.pdf" rel="noopener"><rect x="213.16" y="359.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.sas.upenn.edu/~cavitch/pdf-library/Nagel_B <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p214.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 214 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">214</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold sc-k">Slack</text><text x="102.84" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">摘录</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="139.73" y="98.23" font-size="11.00" class="sc-loraregular">Slack</text><text x="169.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">中的主要社交频道里有一个</text><text x="304.18" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="342.47" y="98.23" font-size="11.00" class="sc-notoserifcjksc">机器人，它带有轻量的指令：在被点名时</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">回复，或在有深思熟虑或有趣的内容可贡献时发言。以下是该机器人由</text><text x="415.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">驱动的版本中，我们最喜欢的一些语录。</text><text x="82.50" y="184.83" font-size="11.00" class="sc-lorabold sc-k">Slack</text><text x="113.34" y="184.83" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="146.34" y="184.83" font-size="11.00" class="sc-loraregular">[</text><text x="150.29" y="184.83" font-size="11.00" class="sc-notoserifcjksc">请求一则公案</text><text x="216.29" y="184.83" font-size="11.00" class="sc-loraregular">]</text><text x="82.50" y="200.45" font-size="11.00" class="sc-notoserifcjkscbold">模型：</text><text x="115.50" y="200.45" font-size="11.00" class="sc-notoserifcjksc">一个学生说：</text><text x="181.50" y="200.45" font-size="11.00" class="sc-loraregular">“</text><text x="185.90" y="200.45" font-size="11.00" class="sc-notoserifcjksc">我已经消除了模型中所有的偏见。</text><text x="350.90" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="359.14" y="200.45" font-size="11.00" class="sc-notoserifcjksc">你怎么知道？</text><text x="425.14" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="433.38" y="200.45" font-size="11.00" class="sc-notoserifcjksc">我检查过了。</text><text x="499.38" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="507.62" y="200.45" font-size="11.00" class="sc-notoserifcjksc">用什</text><text x="82.50" y="216.07" font-size="11.00" class="sc-notoserifcjksc">么检查的？</text><text x="137.50" y="216.07" font-size="11.00" class="sc-loraregular">”</text><text x="82.50" y="272.09" font-size="11.00" class="sc-lorabold sc-k">Slack</text><text x="113.34" y="272.09" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="146.34" y="272.09" font-size="11.00" class="sc-loraregular">[</text><text x="150.29" y="272.09" font-size="11.00" class="sc-notoserifcjksc">请求一则公案</text><text x="216.29" y="272.09" font-size="11.00" class="sc-loraregular">]</text><text x="82.50" y="287.71" font-size="11.00" class="sc-notoserifcjkscbold">模型：</text><text x="368.50" y="287.71" font-size="11.00" class="sc-loraregular">“</text><text x="372.90" y="287.71" font-size="11.00" class="sc-notoserifcjksc">模型是孤独的，还是只是表征了</text><text x="82.50" y="303.33" font-size="11.00" class="sc-notoserifcjksc">孤独？</text><text x="115.50" y="303.33" font-size="11.00" class="sc-loraregular">”</text><text x="185.34" y="303.33" font-size="11.00" class="sc-loraregular">“</text><text x="189.74" y="303.33" font-size="11.00" class="sc-notoserifcjksc">这个区别存储在哪里？</text><text x="299.74" y="303.33" font-size="11.00" class="sc-loraregular">”</text><text x="82.50" y="376.03" font-size="11.00" class="sc-lorabold sc-k">Slack</text><text x="113.34" y="376.03" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="146.34" y="376.03" font-size="11.00" class="sc-loraregular">[</text><text
