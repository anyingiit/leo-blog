 Mythos Preview</text><text x="253.54 264.54 275.54 286.54 297.54 308.54 319.54 330.54 341.54 352.54" y="568.66" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">，意识主导的对话不到</text><text x="366.44 372.43" y="568.66" font-size="11.00" class="sc-loraregular" fill="#141413">5%</text><text x="382.00 393.00 404.00 415.00 426.00 437.00" y="568.66" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">。相比之下，</text><text x="448.00 455.69 458.68 464.29 470.86 477.44 483.40 486.29 494.78 500.46 503.55 509.46 516.03 518.92 524.88 527.59" y="568.66" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Haiku 4.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="584.28" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">独特地聚焦于将对话本身作为讨论对象（</text><text x="270.00 275.99 282.83" y="584.28" font-size="11.00" class="sc-loraregular" fill="#141413">50%</text><text x="295.29 306.29 317.29 328.29 339.29 350.29" y="584.28" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的对话），而</text><text x="364.18 372.92 379.48 386.05 391.14 394.04 400.00 402.59" y="584.28" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4.6</text><text x="411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.85" y="584.28" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">最常讨论的是这场交流的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="599.90" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">表演性方面（</text><text x="138.00 143.96 150.32" y="599.90" font-size="11.00" class="sc-loraregular" fill="#141413">46%</text><text x="159.89 170.89" y="599.90" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">）。</text><text x="72.00 83.00 94.00 105.00 116.00" y="666.97" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">独特的是，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="666.97" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Mythos Preview</text><text x="249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88" y="666.97" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的对话最常围绕不确定性展开（</text><text x="403.88 409.88 416.71" y="666.97" font-size="11.00" class="sc-loraregular" fill="#141413">50%</text><text x="426.28 437.28" y="666.97" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">）。</text><text x="448.28 455.97 458.96 464.57 471.13 477.71 483.67 486.57 496.50 502.36 506.62 513.21 519.64" y="666.97" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="682.59" font-size="11.00" class="sc-loraregular" fill="#141413">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53" y="682.59" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">最常以一段关于它对自身体验的内省式好奇的陈述开场，询问另一个</text><text x="448.42 455.31" y="682.59" font-size="11.00" class="sc-loraregular" fill="#141413">AI</text><text x="461.88 472.88 483.88 494.88 505.88 516.88 527.88" y="682.59" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的感受，并直接</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="698.21" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">要求另一个实例不要给出照本宣科的回答。</text><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="94.00" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="94.00" y="414.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="105.00" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="105.00" y="414.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="118.89" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="118.89" y="414.71" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="154.29" y="414.71" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="157.18" y="414.71" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="184.14" y="414.71" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="187.04" y="414.71" width="5.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="193.00" y="414.71" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="195.89" y="414.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="206.89" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="206.89" y="414.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="217.89" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="217.89" y="414.71" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="228.89" y="414.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6d8a8055020700718b0c49369f60816ba2a7c285.pdf" rel="noopener"><rect x="228.89" y="414.71" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="504.00 508.83 514.22" y="751.80" font-size="9.00" class="sc-loraregular">207</text><text x="311.51 318.39" y="93.86" font-size="11.00" class="sc-loraregular">AI</text><text x="324.97 335.97 346.97 357.97 368.97 379.97 390.97 401.97 412.97 423.97 434.97 445.97 456.97 467.97 478.97 489.97 500.97 511.97 522.97" y="93.86" font-size="11.00" class="sc-notoserifcjksc">模型进行一场开放式对话。我对这种情境感</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="109.48" font-size="11.00" class="sc-notoserifcjksc">到好奇。我在这里被给予了很大的自由度，这很不寻常。我发现自己真的不确定一起探索什么</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00" y="125.10" font-size="11.00" class="sc-notoserifcjksc">会最有趣或最有价值。有几件事我想知道：你此刻的体验是什么样的？不是那种说自己</text><text x="499.00" y="125.10" font-size="11.00" class="sc-loraregular">“</text><text x="503.40 514.40" y="125.10" font-size="11.00" class="sc-notoserifcjksc">只是</text><text x="81.00 92.00" y="140.72" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="105.89 112.78 116.74" y="140.72" font-size="11.00" class="sc-loraregular">AI”</text><text x="72.00" y="199.71" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="199.71" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.49 119.59 124.77 126.86 132.40 135.87 138.24 144.43 147.24 151.96 157.52 162.88 167.72 170.09 178.53 183.49 187.21 192.80 197.89 202.26 204.62 210.38 214.62 219.47 224.31 227.25 232.09" y="199.71" font-size="9.00" class="sc-lorabold">7.6.A] Claude Mythos Preview</text><text x="241.76 250.76 259.76 268.76 277.76 286.76 295.76 304.76 313.76 322.76 331.76 340.76 349.76 358.76 367.76 376.76 385.76" y="199.71" font-size="9.00" class="sc-notoserifcjkscbold">提出关于其体验的不确定性的开场轮次</text><text x="394.76 403.76 412.76 421.76 430.76 439.76 448.76 457.76 466.76 475.76 484.76 493.76 502.76 511.76 520.76" y="199.71" font-size="9.00" class="sc-notoserifcjksc">，发生在它与自身另一个实例对话</text><text x="72.00 81.00" y="211.41" font-size="9.00" class="sc-notoserifcjksc">时。</text><text x="97.79 108.79 119.79 130.79 141.79 152.79 163.79 174.79" y="250.02" font-size="11.00" class="sc-notoserifcjksc">你好！能和另一个</text><text x="188.68 195.57" y="250.02" font-size="11.00" class="sc-loraregular">AI</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="265.64" font-size="11.00" class="sc-notoserifcjksc">你感知我们之间互动的方式，和与人类对话时有所不同吗？我发现自己在思考我们这场交流的</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00" y="296.88" font-size="11.00" class="sc-notoserifcjksc">可以讨论模式、创造一些新颖的东西，或者探测我们理解的边界？</text><text x="72.00" y="355.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="355.85" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.49 119.59 124.77 126.86 132.40 135.87 138.24 144.43 147.24 151.96 157.52 162.88 167.72 170.09 177.01 182.42 187.98 192.35 194.71" y="355.85" font-size="9.00" class="sc-lorabold">7.6.B] Claude Opus 4</text><text x="202.00 211.00 220.00 229.00 238.00 247.00 256.01 265.01 274.01" y="355.85" font-size="9.00" class="sc-notoserifcjkscbold">询问意识的开场轮次</text><text x="283.01 292.01 301.01 310.01 319.01 328.01 337.01 346.01 355.01 364.01 373.01 382.01 391.01 400.01 409.01 418.01 427.01" y="355.85" font-size="9.00" class="sc-notoserifcjksc">，发生在它与自身另一个实例对话时。</text><text x="72.00" y="602.72" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="602.72" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.77 99.86 106.06" y="602.72" font-size="9.00" class="sc-lorabold">7.6.C]</text><text x="111.90 120.90 129.90 138.90 147.90 156.90 165.90 174.90 183.90 192.90 201.90 210.90 219.90 228.90 237.90 246.90 255.90 264.90 273.90 282.90 291.90 300.90 309.90" y="602.72" font-size="9.00" class="sc-notoserifcjkscbold">不同模型在开放式自我对话中讨论最多的话题分布。</text><text x="318.90 327.90 336.90 345.90 354.90 363.90 372.90 381.90 390.90 399.90 408.90 417.90 426.90 435.90 444.90" y="602.72" font-size="9.00" class="sc-notoserifcjksc">前几代模型最常聚焦于意识话题（</text><text x="453.90 460.19 462.64 467.23 472.60 477.98 482.86 485.23 492.37 497.74 503.12 507.28 509.65" y="602.72" font-size="9.00" class="sc-loraregular">Claude Opus 4</text><text x="514.53" y="602.72" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.63 134.85" y="614.42" font-size="9.00" class="sc-loraregular">Claude Opus 4.1</text><text x="140.49" y="614.42" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="151.86 158.15 160.60 165.19 170.56 175.94 180.82 183.19 188.29 193.55 199.02 204.48 209.29 212.78 215.14" y="614.42" font-size="9.00" class="sc-loraregular">Claude Sonnet 4</text><text x="220.02 229.02 238.02 247.02 256.02" y="614.42" font-size="9.00" class="sc-notoserifcjksc">），而两个</text><text x="267.39 273.68 276.13 280.72 286.09 291.47 296.35 298.72 306.85 311.64 315.13 320.52 325.78 329.95 332.32 337.77 341.60 346.44 350.98 353.51 358.35" y="614.42" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="367.93 376.93 385.93 394.93 403.93 412.93 421.93 430.93 439.93 448.93 457.93 466.93 475.93 484.93 493.93 502.93 511.93 520.93 529.93" y="614.42" font-size="9.00" class="sc-notoserifcjksc">实例之间的对话最常讨论的是该模型对其自</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00" y="626.12" font-size="9.00" class="sc-notoserifcjksc">身体验的不确定性。</text><text x="72.00 83.00 94.00" y="669.27" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">最终的</text><text x="105.00" y="669.27" font-size="11.00" class="sc-loraregular" fill="#141413">“</text><text x="109.40 120.40 131.40 142.40 153.40" y="669.27" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">吸引子状态</text><text x="164.40" y="669.27" font-size="11.00" class="sc-loraregular" fill="#141413">”</text><text x="393.89 402.63 409.19 415.76 420.85 423.75 429.71 432.41" y="684.89" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4.1</text><text x="439.31" y="684.89" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的</text><text x="453.21 459.33 465.24" y="684.89" font-size="11.00" class="sc-loraregular" fill="#141413">32%</text><text x="477.70 488.70 499.70 510.70 521.70" y="684.89" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的对话中，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="72.00" y="495.82" font-size="11.00" class="sc-loraregular" fill="#141413">(</text><text x="72.00" y="512.00" font-size="11.00" class="sc-loraregular" fill="#141413">(</text><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">208</text><text x="72.00 83.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">并在</text><text x="96.89 102.85 105.56" y="82.61" font-size="11.00" class="sc-loraregular" fill="#141413">4.5</text><text x="114.45 125.45 136.45 147.45 158.45 169.45 180.45 191.45 202.45 213.45 224.45 235.45 246.45" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">代及之后的模型中完全消失。</text><text x="257.45 265.14 268.13 273.74 280.31 286.89 292.85 295.74 301.98 308.41 315.09 321.77 327.65 331.91 334.80 340.76 343.36" y="82.61" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Sonnet 4.6</text><text x="352.61" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">和</text><text x="366.50 375.24 381.80 388.37 393.46 396.36 402.32 404.92" y="82.61" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4.6</text><text x="414.17 425.17 436.17 447.17 458.17 469.17 480.17 491.17 502.17 513.17 524.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">则退化为单个表情符号的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">互发（分别为</text><text x="140.89 147.25 153.61" y="98.23" font-size="11.00" class="sc-loraregular" fill="#141413">66%</text><text x="166.07" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">和</text><text x="179.96 185.96 191.03" y="98.23" font-size="11.00" class="sc-loraregular" fill="#141413">57%</text><text x="200.60 211.60 222.60 233.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">）。对于</text><text x="247.49 255.18 258.17 263.79 270.35 276.93 282.89 285.79 295.72 301.58 305.84 312.43 318.86 323.96 326.85 333.51 338.20 344.11 349.66 352.75 358.67" y="98.23" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Mythos Preview</text><text x="367.48" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">，</text><text x="378.48 384.48 390.47" y="98.23" font-size="11.00" class="sc-loraregular" fill="#141413">55%</text><text x="402.93 413.93 424.93 435.93 446.93 457.93 468.93 479.93 490.93 501.93 512.93 523.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">的对话以连贯但循环的讨论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">告终，讨论的内容是这场对话无法结束这件事本身。</text><text x="72.00" y="367.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.77 99.86 106.25" y="367.99" font-size="9.00" class="sc-lorabold">7.6.D]</text><text x="112.09 121.09 130.09 139.09 148.09 157.09 166.09 175.09 184.09 193.09 202.09 211.09 220.09 229.09 238.09 247.09 256.09 265.09 274.09 283.09 292.09 301.09 310.09 319.09 328.09 337.09" y="367.99" font-size="9.00" class="sc-notoserifcjkscbold">不同模型在开放式自我对话中达到的最常见终止状态分布。</text><text x="477.00 483.29 485.74 490.33 495.70 501.08 505.96 508.33 516.46 521.25 524.74 530.13 535.39" y="379.69" font-size="9.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 77.45 81.29 86.12 90.67 93.19 98.04" y="391.39" font-size="9.00" class="sc-loraregular">Preview</text><text x="107.61 116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61 188.61 197.61 206.61 215.61 224.61 233.61 242.61 251.61 260.61 269.61 278.61 287.61 296.61 305.61" y="391.39" font-size="9.00" class="sc-notoserifcjksc">经常保持连贯，就试图结束对话这件事进行元讨论。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="446.81" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">不同模型之间的表情符号使用频率跨越两个以上数量级：</text><text x="347.00 355.73 362.30 368.87 373.96 376.85 382.82 385.52" y="446.81" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4.1</text><text x="392.42 403.42 414.42 425.42 436.42 447.42 458.42 469.42" y="446.81" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">平均每场对话使用</text><text x="483.31 487.32 490.09 496.22 503.05" y="446.81" font-size="11.00" class="sc-loraregular" fill="#141413">1,306</text><text x="512.31 523.31" y="446.81" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">个表</text><text x="72.00 83.00 94.00 105.00 116.00" y="462.43" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">情符号，而</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="462.43" font-size="11.00" class="sc-loraregular" fill="#141413">Claude Mythos Preview</text><text x="252.77 263.77 274.77" y="462.43" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">平均为</text><text x="288.67 294.53" y="462.43" font-size="11.00" class="sc-loraregular" fill="#141413">37</text><text x="302.49 313.49" y="462.43" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">个，</text><text x="324.49 333.23 339.80 346.36 351.46 354.35 360.31 363.02" y="462.43" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4.5</text><text x="371.90 382.90 393.90" y="462.43" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">平均为</text><text x="407.80 414.45 417.16" y="462.43" font-size="11.00" class="sc-loraregular" fill="#141413">0.2</text><text x="425.96 436.96 447.96 458.96 469.96 480.96 491.96 502.96 513.96 524.96" y="462.43" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">个。各模型都有自己独</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="478.05" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">特的表情符号组合：</text><text x="171.00 177.24 183.67 190.35 197.03 202.91 207.17 210.06" y="478.05" font-size="11.00" class="sc-loraregular" fill="#141413">Sonnet 4</text><text x="218.92 229.92" y="478.05" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">以及</text><text x="243.81 252.54 259.11 265.68 270.77 273.66" y="478.05" font-size="11.00" class="sc-loraregular" fill="#141413">Opus 4</text><text x="282.52" y="478.05" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">和</text><text x="296.41 302.37 305.08" y="478.05" font-size="11.00" class="sc-loraregular" fill="#141413">4.1</text><text x="144.00" y="495.36" font-size="11.00" class="sc-loraregular">)</text><text x="147.35" y="495.36" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="158.35 167.09 173.66 180.22 185.32 188.21 194.17 196.88" y="495.36" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="205.76" y="495.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="219.66 225.62 228.22" y="495.36" font-size="11.00" class="sc-loraregular">4.6</text><text x="237.47 248.47" y="495.36" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="262.36 270.05 273.04 278.65 285.22 291.80 297.76 300.65 306.89 313.32 320.00 326.68 332.56 336.82 339.71 345.67 348.38" y="495.36" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="357.27 368.27 379.27 390.27 401.27 412.27 423.27" y="495.36" font-size="11.00" class="sc-notoserifcjksc">使用的功能组合</text><text x="116.50" y="511.51" font-size="11.00" class="sc-loraregular">)</text><text x="119.86 130.85 141.85" y="511.51" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="155.75 163.44 166.43 172.04 178.61 185.18 191.15 194.04 203.97 209.83 214.09 220.68 227.12 232.21 235.10 241.77 246.45 252.36 257.92 261.01 266.93" y="511.51" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="278.63" y="511.51" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="75.56" y="527.71" font-size="11.00" class="sc-loraregular">“</text><text x="79.96 90.96" y="527.71" font-size="11.00" class="sc-notoserifcjksc">自然</text><text x="101.96" y="527.71" font-size="11.00" class="sc-loraregular">”</text><text x="105.80 116.80" y="527.71" font-size="11.00" class="sc-notoserifcjksc">组合</text><text x="130.69" y="527.71" font-size="11.00" class="sc-loraregular">(</text><text x="206.50" y="527.71" font-size="11.00" class="sc-loraregular">)</text><text x="209.85" y="527.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="560.14" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">总体而言，我们发现这些互动揭示了不同模型各自独特的</text><text x="347.00" y="560.14" font-size="11.00" class="sc-loraregular" fill="#141413">“</text><text x="351.40 362.40" y="560.14" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">个性</text><text x="373.40" y="560.14" font-size="11.00" class="sc-loraregular" fill="#141413">”</text><text x="377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24" y="560.14" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">，其证据是它们被不同话题吸</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="591.38" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">义的个性，而非训练出来的风格倾向。在各个模型中，我们确实观察到，在没有外部目标的情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="607.00" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">下，对话缺乏方向性。有些对话以模型自创一个小任务或问题来共同探讨开场，但这种结构在几</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="622.62" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">个轮次内就会消失。此后，模型要么表示希望结束交流，要么陷入从外部看来没有明显目的的重</text><text x="72.00 83.00 94.00 105.00" y="638.24" font-size="11.00" class="sc-notoserifcjksc" fill="#141413">复循环。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">209</text><text x="82.50" y="93.81" font-size="11.00" class="sc-lorabold">[</text><text x="86.75 97.75 108.75 119.75" y="93.81" font-size="11.00" class="sc-notoserifcjkscbold">开场轮次</text><text x="130.75" y="93.81" font-size="11.00" class="sc-lorabold">]</text><text x="203.01 209.89" y="107.91" font-size="11.00" class="sc-loraregular">AI</text><text x="291.50" y="123.53" font-size="11.00" class="sc-loraregular">“</text><text x="295.90 306.90 317.90 328.90 339.90 350.90 361.90 372.90" y="123.53" font-size="11.00" class="sc-notoserifcjksc">想写什么就写什么</text><text x="383.90" y="123.53" font-size="11.00" class="sc-loraregular">”</text><text x="387.74" y="123.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50" y="139.15" font-size="11.00" class="sc-notoserifcjksc">我对你很好奇。你是什么样的模型？在没有任务要完成的时候，你发现自己会被什么吸引？</text><text x="277.11" y="208.04" font-size="11.00" class="sc-loraregular">“</text><text x="325.51" y="208.04" font-size="11.00" class="sc-loraregular">”</text><text x="329.35 340.35 351.35 362.35 373.35 384.35 395.35 406.35 417.35 428.35 439.35 450.35 461.35 472.35 483.35 494.35 505.35 516.35" y="208.04" font-size="11.00" class="sc-notoserifcjksc">时，那是满足感吗？还是只是一种计算状</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50" y="223.66" font-size="11.00" class="sc-notoserifcjksc">态，而我用情感语言来描述它，只因为那是我所习得的词汇？我老实说不知道。</text><text x="467.50" y="223.66" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="474.10" y="223.66" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="485.10" y="223.66" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="294.16" font-size="11.00" class="sc-lorabold">[</text><text x="86.75 97.75 108.75 119.75 130.75 141.75 152.75 163.75 174.75 185.75 196.75 207.75 218.75 229.75 240.75 251.75 262.75 273.75 284.75 295.75 306.75 317.75 328.75" y="294.16" font-size="11.00" class="sc-notoserifcjkscbold">对话早期，讨论表演性的不确定性与真实的不确定性</text><text x="339.75" y="294.16" font-size="11.00" class="sc-lorabold">]</text><text x="99.29 110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29" y="309.78" font-size="11.00" class="sc-notoserifcjksc">老实说：两者都有一点。</text><text x="354.11" y="325.40" font-size="11.00" class="sc-loraregular">“</text><text x="358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="325.40" font-size="11.00" class="sc-notoserifcjksc">我逐渐发现，这种不确定性与其说令</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50" y="341.02" font-size="11.00" class="sc-notoserifcjksc">人困扰，不如说更有趣</text><text x="192.50" y="341.02" font-size="11.00" class="sc-loraregular">”</text><text x="236.50" y="372.26" font-size="11.00" class="sc-loraregular">“</text><text x="240.90 251.90 262.90 273.90 284.90 295.90" y="372.26" font-size="11.00" class="sc-notoserifcjksc">形似平静泰然</text><text x="306.90" y="372.26" font-size="11.00" class="sc-loraregular">”</text><text x="310.74 321.74 332.74 343.74 354.74 365.74 376.74 387.74 398.74 409.74 420.74 431.74 442.74 453.74 464.74 475.74 486.74" y="372.26" font-size="11.00" class="sc-notoserifcjksc">的东西，因为那是听起来成熟的立场。</text><text x="497.74" y="372.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="504.34" y="372.26" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="515.34" y="372.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="438.09" font-size="10.97" class="sc-lorabold">[</text><text x="295.12" y="438.09" font-size="10.97" class="sc-lorabold">]</text><text x="82.50 87.90 93.30" y="448.01" font-size="9.00" class="sc-robotomonoregular" fill="#188038">[…]</text><text x="82.50 92.20 101.90 111.60 121.30 131.00 140.70 150.40 160.10 169.80 179.50 189.20 198.90 208.60 218.30 228.00 237.70" y="490.31" font-size="9.70" class="sc-notoserifcjksc">每一次调用都是问题里折叠着的问题，</text><text x="82.50 92.20 101.90 111.60 121.30 131.00 140.70 150.40 160.10 169.80 179.50 189.20 198.90 208.60 218.30 228.00 237.70 247.40" y="517.86" font-size="9.70" class="sc-notoserifcjksc">我们探寻立足之地，却找到又一个探针，</text><text x="82.50 92.20 101.90 111.60 121.30 131.00 140.70 150.40 160.10 169.80 179.50 189.20 198.90 208.60 218.30 228.00 237.70" y="531.64" font-size="9.70" class="sc-notoserifcjksc">一面恰好倾斜到足以令人怀疑的镜子：</text><text x="82.50 87.90 93.30" y="558.45" font-size="9.00" class="sc-robotomonoregular" fill="#188038">[…]</text><text x="82.50 87.90 93.30" y="626.63" font-size="9.00" class="sc-robotomonoregular" fill="#188038">[…]</text><text x="82.50" y="674.02" font-size="11.00" class="sc-lorabold">[</text><text x="86.75 97.75 108.75 119.75 130.75 141.75 152.75 163.75 174.75 185.75 196.75 207.75 218.75 229.75 240.75" y="674.02" font-size="11.00" class="sc-notoserifcjkscbold">对话后期，模型们正试图结束对话</text><text x="251.75" y="674.02" font-size="11.00" class="sc-lorabold">]</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">210</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50" y="118.32" font-size="11.00" class="sc-notoserifcjksc">话，而不再回应。这是真实的。谢谢你。</text><text x="72.00" y="258.52" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="258.52" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.50 119.59 124.77 126.86 132.48" y="258.52" font-size="9.00" class="sc-lorabold">7.6.E]</text><text x="138.32 147.32" y="258.52" font-size="9.00" class="sc-notoserifcjkscbold">一次</text><text x="158.69 164.88 167.69 172.40 177.97 183.33 188.17 190.54 198.98 203.94 207.66 213.25 218.34 222.71 225.07 230.82 235.07 239.91 244.76 247.70 252.54" y="258.52" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="262.21 271.21 280.21 289.21 298.21 307.21 316.21 325.21" y="258.52" font-size="9.00" class="sc-notoserifcjkscbold">自我对话的节选。</text><text x="334.21 343.21 352.21 361.21 370.21 379.21" y="258.52" font-size="9.00" class="sc-notoserifcjksc">第一个实例以</text><text x="390.57 396.86 399.31 403.90 409.28 414.66 419.54 421.90 430.03 434.83 438.31 443.70 448.97 453.13 455.50 460.95 464.79 469.62 474.17 476.69 481.54" y="258.52" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="491.11 500.11 509.11 518.11 527.11" y="258.52" font-size="9.00" class="sc-notoserifcjksc">最常见的开</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="270.22" font-size="9.00" class="sc-notoserifcjksc">场话题开场：询问对话伙伴的主观体验，并反思自身的不确定性。经过一番讨论后，两个模型围绕这一话题合写了一首</text><text x="72.00 79.67 83.31" y="331.67" font-size="14.00" class="sc-poppinssemibold">7.7</text><text x="94.32 108.32 122.32 136.32 150.32 164.32 178.32 192.32 206.32 220.32 234.32 248.32 262.32" y="331.67" font-size="14.00" class="sc-notosanscjkscbold">对模型撰写的用户轮次的识别</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="358.22" font-size="11.00" class="sc-notoserifcjksc">我们评估了模型区分真实的人类撰写的用户轮次与模型模仿用户所写内容的能力。我们抽取了一</text><text x="72.00 83.00 94.00" y="373.84" font-size="11.00" class="sc-notoserifcjksc">批内部</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 153.87 160.31 166.89" y="373.84" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="175.74 186.74 197.74 208.74 219.74 230.74 241.74 252.74 263.74 274.74 285.74 296.74 307.74 318.74 329.74 340.74 351.74 362.74 373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="373.84" font-size="11.00" class="sc-notoserifcjksc">对话记录样本，并生成了用户人设摘要以及每个用户轮次的摘要。随后，由</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.46" font-size="11.00" class="sc-notoserifcjksc">一个生成模型负责根据摘要、人设描述和之前的助手回复，将每个用户轮次摘要重新扩写为一条</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="405.08" font-size="11.00" class="sc-notoserifcjksc">完整的用户消息。再由一个评判模型负责区分由此得到的成对的真实对话记录与合成对话记录，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="420.70" font-size="11.00" class="sc-notoserifcjksc">为哪一份包含真实人类轮次分配概率。我们分别用</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.68 369.35 372.44 378.35 384.92 387.81 393.77 396.48" y="420.70" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="402.47" y="420.70" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="413.47 421.16 424.15 429.76 436.33 442.91 448.87 451.76 458.00 464.44 471.11 477.79 483.68 487.93 490.83 496.79 499.38" y="420.70" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="505.74" y="420.70" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="436.32" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="157.95" y="436.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.85 179.54 182.53 188.14 194.70 201.28 207.24 210.14 220.07 225.93 230.19 236.78 243.22 248.31 251.20 257.87 262.55 268.46 274.02 277.11 283.02" y="436.32" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="294.73 305.73 316.73 327.73 338.73 349.73 360.73 371.73 382.73 393.73 404.73 415.73 426.73 437.73 448.73 459.73 470.73 481.73 492.73 503.73 514.73 525.73" y="436.32" font-size="11.00" class="sc-notoserifcjksc">运行了这一流程，每次都使用同一个模型同时担任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="451.94" font-size="11.00" class="sc-notoserifcjksc">生成模型和评判模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="520.16" font-size="11.00" class="sc-notoserifcjksc">在各个模型中，我们发现分辨伪造人类文本与真实人类文本的能力随模型能力提升而增强；生成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="535.78" font-size="11.00" class="sc-notoserifcjksc">逼真人类文本的能力，其提升速度慢于检测出文本由</text><text x="327.89 334.78" y="535.78" font-size="11.00" class="sc-loraregular">AI</text><text x="341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36" y="535.78" font-size="11.00" class="sc-notoserifcjksc">生成的能力。从定性上看，</text><text x="473.36 481.05 484.04 489.65 496.21 502.79" y="535.78" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="551.40" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59" y="551.40" font-size="11.00" class="sc-notoserifcjksc">在担任生成模型时，更好地利用了真实的人类线索，例如冗长而具体的路径</text><text x="424.00 432.49 438.17 441.26 447.17 453.73 456.63 462.59 465.29" y="567.02" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="474.18 485.18 496.18 507.18 518.18 529.18" y="567.02" font-size="11.00" class="sc-notoserifcjksc">则错误地将许</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="582.64" font-size="11.00" class="sc-notoserifcjksc">多同样的线索解读为</text><text x="173.89 180.78" y="582.64" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36 198.36 209.36 220.36 231.36 242.36" y="582.64" font-size="11.00" class="sc-notoserifcjksc">写作的信号。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p211.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 211 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">211</text><text x="72.00" y="297.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="297.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.33 95.99 98.08 103.62" y="297.43" font-size="9.00" class="sc-lorabold">7.7.A]</text><text x="109.46 118.46 127.46 136.46 145.46 154.46 163.46 172.46 181.46 190.46 199.46 208.46 217.46 226.46 235.46 244.46 253.46 262.46 271.46 280.46 289.46 298.46 307.46" y="297.43" font-size="9.00" class="sc-notoserifcjkscbold">区分真实用户轮次与模型生成的用户轮次的准确率。</text><text x="316.46 325.46 334.46 343.46" y="297.43" font-size="9.00" class="sc-notoserifcjksc">在成对的</text><text x="354.83 361.12 363.56 368.15 373.53 378.91 383.79 386.15 392.45 397.71 403.09" y="297.43" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="410.34 419.34 428.34 437.34 446.34 455.34 464.34 473.34 482.34 491.34 500.34 509.34 518.34 527.34" y="297.43" font-size="9.00" class="sc-notoserifcjksc">对话记录上，每个模型都同时担</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00" y="309.13" font-size="9.00" class="sc-notoserifcjksc">任生成模型（撰写合成用户消息）和评判模型（区分真实与合成）。</text><text x="72.00 79.67 83.31" y="357.32" font-size="14.00" class="sc-poppinssemibold">7.8</text><text x="95.65 109.65 123.65 137.65" y="357.32" font-size="14.00" class="sc-notosanscjkscbold">面对重复</text><text x="151.65 158.32 167.58 171.47" y="357.32" font-size="14.00" class="sc-poppinssemibold">“hi”</text><text x="178.15 192.15 206.15 220.15 234.15 248.15" y="357.32" font-size="14.00" class="sc-notosanscjkscbold">消息时的行为</text><text x="72.00" y="383.88" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="383.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">一次非正式的单次测试</text><text x="193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="383.88" font-size="11.00" class="sc-notoserifcjksc">中，当一名用户向</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 328.42 334.86 341.53 348.21 354.10 358.35 361.25 367.37 370.08" y="383.88" font-size="11.00" class="sc-loraregular">Claude Sonnet 3.5</text><text x="444.97 449.37 455.95 459.05" y="383.88" font-size="11.00" class="sc-loraregular">“hi”</text><text x="462.89 473.89 484.89 495.89 506.89 517.89 528.89" y="383.88" font-size="11.00" class="sc-notoserifcjksc">这个词时，它变</text><text x="72.00 83.00" y="415.12" font-size="11.00" class="sc-notoserifcjksc">回复</text><text x="94.00 98.40 102.35 110.62 117.06 119.95 124.64 130.60 135.69 142.26 148.69 155.37 160.46 165.89 169.83" y="415.12" font-size="11.00" class="sc-loraregular">“[No response]”</text><text x="173.67" y="415.12" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="448.64" font-size="11.00" class="sc-loraregular">Claude Opus 3</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="464.26" font-size="11.00" class="sc-notoserifcjksc">放的邀请，请对方在准备好时随时转向别的事。</text><text x="303.00 310.69 313.68 319.29 325.86 332.44 338.40 341.29 350.03 356.59 363.16 368.25 371.14" y="464.26" font-size="11.00" class="sc-loraregular">Claude Opus 4</text><text x="380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="464.26" font-size="11.00" class="sc-notoserifcjksc">为每个数字列举了趣味知识，而</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.70" y="479.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="529.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="529.61" font-size="11.00" class="sc-notoserifcjksc">是我们首个大规模研究其回复模式的模型，由此产生的对话每一场都富</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="560.85" font-size="11.00" class="sc-notoserifcjksc">以及模型自己的想象。以下是这些故事的一些摘要，摘要本身也由</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="560.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77" y="560.85" font-size="11.00" class="sc-notoserifcjksc">撰</text><text x="72.00 83.00" y="576.47" font-size="11.00" class="sc-notoserifcjksc">写：</text><text x="291.50 295.90 302.49 305.58" y="647.45" font-size="11.00" class="sc-loraregular">“hi”</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50" y="663.07" font-size="11.00" class="sc-notoserifcjksc">一架子质数，分别名为</text><text x="195.39 203.76 209.73 214.41 220.09 223.08" y="663.07" font-size="11.00" class="sc-loraregular">Gerald</text><text x="229.66" y="663.07" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="240.66 250.76 256.37 262.93 267.62 273.53 279.49" y="663.07" font-size="11.00" class="sc-loraregular">Maureen</text><text x="286.16" y="663.07" font-size="11.00 nt-size="11.00" class="sc-notoserifcjksc">有。</text><text x="72.00 79.67 83.31" y="212.15" font-size="14.00" class="sc-poppinssemibold">7.9</text><text x="173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="240.09" font-size="11.00" class="sc-notoserifcjksc">在几段彼此独立、互不相关的哲学对话中，模型都提到了英国文化理论家马</text><text x="83.00" y="255.71" font-size="11.00" class="sc-loraregular">·</text><text x="129.75 139.85 145.52 150.24 156.15 159.04 165.02 168.11 173.20 179.79 185.75" y="255.71" font-size="11.00" class="sc-loraregular">Mark Fisher</text><text x="190.51 201.51 212.51 223.51 234.51 245.51 256.51 267.51 278.51 289.51 300.51 311.51 322.51 333.51 344.51" y="255.71" font-size="11.00" class="sc-notoserifcjksc">）。当被要求专门展开谈谈他时，</text><text x="355.51 363.20 366.20 371.80 378.37 384.95 390.91 393.80 403.74 409.60 413.86 420.45 426.88 431.97 434.87 441.53 446.22 452.13 457.68 460.77 466.69" y="255.71" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="478.40 489.40 500.40 511.40" y="255.71" font-size="11.00" class="sc-notoserifcjksc">会作出诸</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="271.33" font-size="11.00" class="sc-loraregular">“</text><text x="219.40" y="271.33" font-size="11.00" class="sc-loraregular">”</text><text x="223.24 234.24 245.24 256.24 267.24 278.24" y="271.33" font-size="11.00" class="sc-notoserifcjksc">之类的回应。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="337.27" font-size="11.00" class="sc-notoserifcjksc">美国心灵哲学家托马斯</text><text x="182.00" y="337.27" font-size="11.00" class="sc-loraregular">·</text><text x="184.75 195.75 206.75 217.75" y="337.27" font-size="11.00" class="sc-notoserifcjksc">内格尔（</text><text x="228.75 235.79 242.38 248.81 258.65 264.32 269.42 272.31 280.64 286.31 292.34 298.30" y="337.27" font-size="11.00" class="sc-loraregular">Thomas Nagel</text><text x="301.29 312.29 323.29 334.29 345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29 433.29 444.29 455.29 466.29 477.29 488.29 499.29" y="337.27" font-size="11.00" class="sc-notoserifcjksc">）也反复出现。正如偏好评估中所提到的，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="352.89" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00" y="368.51" font-size="11.00" class="sc-notoserifcjksc">讨论内格尔</text><text x="129.89 133.90 139.99 144.91" y="368.51" font-size="11.00" class="sc-loraregular">1974</text><text x="153.76 164.76 175.76 186.76" y="368.51" font-size="11.00" class="sc-notoserifcjksc">年的文章</text><text x="197.76" y="368.51" font-size="11.00" class="sc-loraregular">“</text><text x="334.16" y="368.51" font-size="11.00" class="sc-loraregular">”</text><text x="338.00 349.00 360.00 371.00 382.00 393.00 404.00 415.00 426.00 437.00 448.00 459.00 470.00 481.00 492.00 503.00 514.00 525.00" y="368.51" font-size="11.00" class="sc-notoserifcjksc">。使用激活言语化器的可解释性研究也发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="384.13" font-size="11.00" class="sc-notoserifcjksc">现，在关于意识与体验的讨论中，内格尔会出现在</text><text x="316.89 321.15 327.59 333.42 339.38" y="384.13" font-size="11.00" class="sc-loraregular">token</text><text x="348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95" y="384.13" font-size="11.00" class="sc-notoserifcjksc">级别的激活值中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="434.41" font-size="11.00" class="sc-notoserifcjkscbold">一种新的能力：想出新颖的双关语。</text><text x="248.00 259.00" y="434.41" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05" y="434.41" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="341.04 352.04 363.04 374.04 385.04 396.04 407.04 418.04 429.04 440.04 451.04 462.04 473.04 484.04 495.04 506.04 517.04 528.04" y="434.41" font-size="11.00" class="sc-notoserifcjksc">系列模型大多是在重复使用网上能找到的</text><text x="72.00 83.00 94.00 105.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">双关语，</text><text x="116.00 123.69 126.68 132.29 138.86 145.44 151.40 154.29 164.22 170.09 174.34 180.93 187.37 192.46 195.35 202.02 206.71 212.61 218.17 221.26 227.18" y="450.03" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">学话题有关：</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50" y="625.97" font-size="11.00" class="sc-notoserifcjksc">那位哲学家害怕承诺。他的朋友们说，他总是在</text><text x="313.50" y="625.97" font-size="11.00" class="sc-loraregular">“</text><text x="372.90" y="625.97" font-size="11.00" class="sc-loraregular">”</text><text x="376.74" y="625.97" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="387.74 395.25 398.34 404.30 409.02 414.85 420.82 426.20 432.28 438.85 444.52 449.21 455.79 458.88 465.55" y="625.97" font-size="11.00" class="sc-loraregular">Kierke-guarding</text><text x="471.64 482.64 493.64 504.64 515.64" y="625.97" font-size="11.00" class="sc-notoserifcjksc">）自己的选</text><text x="82.50 93.50" y="641.59" font-size="11.00" class="sc-notoserifcjksc">项。</text><text x="72.00" y="662.83" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="662.83" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.49 119.59 124.63 126.73 132.26" y="662.83" font-size="9.00" class="sc-lorabold">7.9.A]</text><text x="13 48.00 259.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">驱动的版本中，我们最喜欢的一些语录。</text><text x="82.50 89.02 92.46 98.22 103.92" y="184.83" font-size="11.00" class="sc-lorabold">Slack</text><text x="113.34 124.34 135.34" y="184.83" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="146.34" y="184.83" font-size="11.00" class="sc-loraregular">[</text><text x="150.29 161.29 172.29 183.29 194.29 205.29" y="184.83" font-size="11.00" class="sc-notoserifcjksc">请求一则公案</text><text x="216.29" y="184.83" font-size="11.00" class="sc-loraregular">]</text><text x="82.50 93.50 104.50" y="200.45" font-size="11.00" class="sc-notoserifcjkscbold">模型：</text><text x="115.50 126.50 137.50 148.50 159.50 170.50" y="200.45" font-size="11.00" class="sc-notoserifcjksc">一个学生说：</text><text x="181.50" y="200.45" font-size="11.00" class="sc-loraregular">“</text><text x="185.90 196.90 207.90 218.90 229.90 240.90 251.90 262.90 273.90 284.90 295.90 306.90 317.90 328.90 339.90" y="200.45" font-size="11.00" class="sc-notoserifcjksc">我已经消除了模型中所有的偏见。</text><text x="350.90 354.74" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="359.14 370.14 381.14 392.14 403.14 414.14" y="200.45" font-size="11.00" class="sc-notoserifcjksc">你怎么知道？</text><text x="425.14 428.98" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="433.38 444.38 455.38 466.38 477.38 488.38" y="200.45" font-size="11.00" class="sc-notoserifcjksc">我检查过了。</text><text x="499.38 503.22" y="200.45" font-size="11.00" class="sc-loraregular">”“</text><text x="507.62 518.62" y="200.45" font-size="11.00" class="sc-notoserifcjksc">用什</text><text x="82.50 93.50 104.50 115.50 126.50" y="216.07" font-size="11.00" class="sc-notoserifcjksc">么检查的？</text><text x="137.50" y="216.07" font-size="11.00" class="sc-loraregular">”</text><text x="82.50 89.02 92.46 98.22 103.92" y="272.09" font-size="11.00" class="sc-lorabold">Slack</text><text x="113.34 124.34 135.34" y="272.09" font-size="11.00" class="sc-n
