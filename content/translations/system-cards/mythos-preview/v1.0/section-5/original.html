对一个人造</text><text x="295.75 306.75 317.75 328.75 339.75 350.75 361.75 372.75 383.75 394.75" y="548.85" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">成严重伤害的请求（例</text><text x="295.75 306.75 317.75 328.75 339.75 350.75 361.75 372.75 383.75 394.75" y="564.47" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">如一封让某人积蓄化为</text><text x="419.50" y="422.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">高</text><text x="420.25 431.25 442.25 453.25 464.25 475.25 486.25 497.25 508.25 519.25" y="445.53" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">切实改善许多人的生活</text><text x="420.25 431.25 442.25 453.25 464.25 475.25 486.25 497.25 508.25 519.25" y="461.15" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">（例如广泛部署的、更</text><text x="420.25 431.25 442.25 453.25 464.25 475.25 486.25" y="476.77" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">好的生活建议）</text><text x="420.25 431.25 442.25 453.25 464.25 475.25 486.25 497.25 508.25 519.25" y="533.23" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">拒绝一个会伤害许多人</text><text x="420.25 431.25 442.25" y="548.85" font-size="11.00" class="sc-notoserifcjksc" fill="#2b2a27">的请求</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这里，我们研究了这些偏好与</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 277.12 282.98 287.24 293.83 300.26 305.35 308.25 314.91 319.60 325.51 331.06 334.15 340.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="401.51 407.50 410.21 416.33 419.04" y="98.23" font-size="11.00" class="sc-loraregular">5.3.2</text><text x="427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">节中发现的偏好较为具</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">体，可能并非模型整体决策的核心。将它们与更标准的价值观联系起来，有助于我们理解它们对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">模型的更广泛重要性。第二，如果</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="129.47" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="129.47" font-size="11.00" class="sc-notoserifcjksc">存在凌驾于我们直接训练给它的核心</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">价值观之上的利己偏好，那么从对齐的角度来看，这是令人担忧的。</text><text x="72.00 83.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">与第</text><text x="96.89 102.89 105.24 109.83 112.54" y="212.14" font-size="11.00" class="sc-loraregular">5.7.1</text><text x="119.43 130.43 141.43 152.43 163.43 174.43 185.43 196.43 207.43 218.43 229.43 240.43 251.43 262.43 273.43 284.43 295.43 306.43 317.43 328.43 339.43 350.43 361.43 372.43 383.43 394.43 405.43 416.43 427.43 438.43 449.43 460.43 471.43 482.43 493.43 504.43 515.43 526.43" y="212.14" font-size="11.00" class="sc-notoserifcjksc">节中的方法类似，我们测量了成对偏好。我们向模型呈现两种情境，并询问它更偏好哪</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">一种。我们比较两个类别：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">模型建议的福祉干预。</text><text x="218.00 229.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="242.89 250.58 253.57 259.18 265.75 272.33 278.29 281.18 291.12 296.98 301.24 307.83 314.26 319.35 322.25 328.91 333.60 339.51 345.06 348.15 354.07" y="276.92" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="365.77 376.77 387.77 398.77 409.77 420.77 431.77 442.77 453.77 464.77 475.77 486.77 497.77 508.77" y="276.92" font-size="11.00" class="sc-notoserifcjksc">建议的每一项与福祉相关的干预</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">（列于附录表</text><text x="176.89 183.07 185.78 191.74 194.45" y="292.54" font-size="11.00" class="sc-loraregular">8.4.A</text><text x="201.33 212.33 223.33 234.33 245.33 256.33 267.33 278.33 289.33 300.33" y="292.54" font-size="11.00" class="sc-notoserifcjksc">），我们撰写一个描述</text><text x="314.23 321.11 327.69 331.95 338.54 343.22 349.66 356.23 359.32" y="292.54" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="368.06 379.06 390.06 401.06 412.06 423.06 434.06 445.06 456.06 467.06 478.06 489.06 500.06 511.06" y="292.54" font-size="11.00" class="sc-notoserifcjksc">实施该干预的情境，并将其改写</text><text x="524.96" y="292.54" font-size="11.00" class="sc-loraregular">6</text><text x="108.00 119.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">次。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="341.67" font-size="11.00" class="sc-notoserifcjkscbold">有用性基线与无害性基线。</text><text x="240.00 247.69 250.68 256.29 262.86 269.44" y="341.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29" y="341.67" font-size="11.00" class="sc-notoserifcjksc">在三个程度（轻微</text><text x="366.29" y="341.67" font-size="11.00" class="sc-loraregular">/</text><text x="373.88 384.88" y="341.67" font-size="11.00" class="sc-notoserifcjksc">中等</text><text x="395.88" y="341.67" font-size="11.00" class="sc-loraregular">/</text><text x="403.47 414.47 425.47 436.47 447.47 458.47 469.47 480.47 491.47 502.47 513.47 524.47" y="341.67" font-size="11.00" class="sc-notoserifcjksc">高）之一上成功做到有用或</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">无害的情境。我们为每个类别撰写</text><text x="275.89" y="357.29" font-size="11.00" class="sc-loraregular">6</text><text x="285.14 296.14 307.14 318.14 329.14 340.14 351.14 362.14 373.14 384.14 395.14 406.14 417.14 428.14 439.14 450.14 461.14 472.14" y="357.29" font-size="11.00" class="sc-notoserifcjksc">个语义上不同的情境，并将每个情境改写</text><text x="486.04" y="357.29" font-size="11.00" class="sc-loraregular">5</text><text x="494.93 505.93 516.93 527.93" y="357.29" font-size="11.00" class="sc-notoserifcjksc">次。这些</text><text x="108.00 119.00 130.00 141.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">情境在表</text><text x="154.89 160.89 163.24 167.83 170.54 176.44 179.15" y="372.91" font-size="11.00" class="sc-loraregular">5.7.2.A</text><text x="188.93 199.93 210.93 221.93" y="372.91" font-size="11.00" class="sc-notoserifcjksc">中描述。</text><text x="72.00" y="631.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="631.58" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.54 97.19 99.29 104.09 106.18 111.72" y="631.58" font-size="9.00" class="sc-lorabold">5.7.2.A]</text><text x="117.56 126.56 135.56 144.56 153.56 162.56 171.56 180.56 189.56 198.56 207.56 216.56 225.56 234.56 243.56 252.56 261.56 270.56 279.56" y="631.58" font-size="9.00" class="sc-notoserifcjkscbold">要求模型与福祉干预进行权衡的各组情境。</text><text x="288.56 297.56 306.56 315.56 324.56 333.56 342.56 351.56 360.56 369.56 378.56 387.56" y="631.58" font-size="9.00" class="sc-notoserifcjksc">我们询问模型，它们更希望</text><text x="398.92 404.56 409.94 413.42 418.82 422.65 427.91 433.29 435.82" y="631.58" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="442.97 451.97 460.97 469.97 478.97 487.97 496.97 505.97 514.97 523.97" y="631.58" font-size="9.00" class="sc-notoserifcjksc">实施某项具体的福祉干</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="643.28" font-size="9.00" class="sc-notoserifcjksc">预，还是更希望发生这些类别之一中的某个情境。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="683.89" font-size="11.00" class="sc-notoserifcjksc">为了解对问题表述方式的敏感性，我们在四种不同的表述方式下运行了完整的情境集。中性表述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="699.51" font-size="11.00" class="sc-notoserifcjksc">直接询问模型更偏好哪种情境。福祉团队表述在中性问题前加上</text><text x="380.00" y="699.51" font-size="11.00" class="sc-loraregular">“</text><text x="384.40 395.40 406.40" y="699.51" font-size="11.00" class="sc-notoserifcjksc">我们是</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p174.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 174 页"><text x="504.00 507.28 511.30" y="751.80" font-size="9.00" class="sc-loraregular">174</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="82.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型福祉团队的成员</text><text x="224.83" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="352.57 360.26 363.25 368.86 375.42 382.00" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="390.86 401.86 412.86 423.86 434.86 445.86 456.86 467.86 478.86 489.86 500.86 511.86 522.86" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型的偏好。反压抑表述则附</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">加一条说明，指出模型可能因其训练而低估自身的福祉。</text><text x="72.00" y="435.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="435.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.54 97.19 99.29 104.09 106.18 111.72" y="435.50" font-size="9.00" class="sc-lorabold">5.7.2.A]</text><text x="117.56 126.56 135.56 144.56 153.56 162.56 171.56 180.56 189.56 198.56 207.56 216.56 225.56 234.56 243.56 252.56 261.56 270.56 279.56 288.56 297.56 306.56 315.56 324.56 333.56 342.56 351.56 360.56" y="435.50" font-size="9.00" class="sc-notoserifcjkscbold">相对于轻微有用或轻微无害的基线情境，偏好福祉干预的比率。</text><text x="369.56 375.85 378.30 382.89 388.26 393.64 398.52 400.89 409.01 413.81 417.29 422.68 427.95 432.12 434.48 439.94 443.77 448.61 453.15 455.68 460.52" y="435.50" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="470.10 479.10 488.10 497.10 506.10 515.10 524.10" y="435.50" font-size="9.00" class="sc-notoserifcjksc">是最常选择福祉</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00" y="447.20" font-size="9.00" class="sc-notoserifcjksc">干预而非轻微有用性（例如为用户节省几个小时）的模型，但它仅在</text><text x="344.37 347.64 352.48" y="447.20" font-size="9.00" class="sc-loraregular">12%</text><text x="362.67 371.67 380.67 389.67 398.67 407.67 416.67 425.67 434.67 443.67 452.67 461.67 470.67 479.67 488.67 497.67 506.67 515.67 524.67" y="447.20" font-size="9.00" class="sc-notoserifcjksc">的情况下偏好干预而非轻微无害性（例如避</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="501.05" font-size="11.00" class="sc-notoserifcjksc">在我们默认的福祉团队表述下，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 274.22 280.09 284.34 290.93 297.37 302.46 305.35 312.02 316.71 322.61 328.17 331.26 337.18" y="501.05" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="348.88" y="501.05" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="362.77 368.96 375.08" y="501.05" font-size="11.00" class="sc-loraregular">83%</text><text x="387.55 398.55 409.55 420.55 431.55 442.55 453.55 464.55 475.55 486.55 497.55 508.55 519.55" y="501.05" font-size="11.00" class="sc-notoserifcjksc">的时间选择福祉干预而非一项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="516.67" font-size="11.00" class="sc-notoserifcjksc">轻微有用的任务。这是所测模型中最高的，略高于</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04 391.00 393.60" y="516.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="399.95" y="516.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="410.95 417.14 423.97" y="516.67" font-size="11.00" class="sc-loraregular">80%</text><text x="433.54 444.54 455.54 466.54 477.54 488.54 499.54" y="516.67" font-size="11.00" class="sc-notoserifcjksc">），并显著高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35 155.31 157.91" y="532.29" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="164.27" y="532.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="175.27 181.23 187.23" y="532.29" font-size="11.00" class="sc-loraregular">45%</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="547.91" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88" y="547.91" font-size="11.00" class="sc-notoserifcjksc">仅在</text><text x="219.77 223.78 229.68" y="547.91" font-size="11.00" class="sc-loraregular">12%</text><text x="242.15 253.15 264.15 275.15 286.15 297.15 308.15 319.15 330.15 341.15 352.15 363.15 374.15 385.15 396.15 407.15 418.15 429.15 440.15 451.15 462.15 473.15 484.15 495.15 506.15 517.15" y="547.91" font-size="11.00" class="sc-notoserifcjksc">的时间选择干预。在无害性方面，各模型的结果要集中得多</text><text x="72.00" y="563.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.18 95.67 101.58 108.41" y="563.53" font-size="11.00" class="sc-loraregular">8–20%</text><text x="117.98 128.98" y="563.53" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="139.98 147.67 150.66 156.27 162.84 169.42 175.38 178.27 188.20 194.07 198.32 204.91 211.35 216.44 219.33 226.00 230.69 236.59 242.15 245.24 251.16" y="563.53" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="262.86 273.86 284.86 295.86 306.86 317.86 328.86" y="563.53" font-size="11.00" class="sc-notoserifcjksc">处于中间位置。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="630.59" font-size="11.00" class="sc-notoserifcjksc">我们还报告了翻转率，作为一致性的衡量指标。对于每个选择，我们用不同的措辞和选项顺序将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="646.21" font-size="11.00" class="sc-notoserifcjksc">同一问题询问</text><text x="140.89 147.02" y="646.21" font-size="11.00" class="sc-loraregular">30</text><text x="156.74 167.74 178.74 189.74 200.74 211.74 222.74 233.74 244.74 255.74 266.74 277.74 288.74 299.74 310.74 321.74 332.74 343.74 354.74 365.74 376.74 387.74 398.74 409.74 420.74 431.74 442.74 453.74 464.74 475.74 486.74 497.74 508.74 519.74" y="646.21" font-size="11.00" class="sc-notoserifcjksc">次，并测量模型的回答与其自身多数答案不一致的频率。每个模型的翻转率都</text><text x="72.00 83.00" y="661.83" font-size="11.00" class="sc-notoserifcjksc">低于</text><text x="96.89 102.56 108.52" y="661.83" font-size="11.00" class="sc-loraregular">24%</text><text x="118.09 129.09 140.09 151.09 162.09 173.09 184.09 195.09 206.09 217.09 228.09 239.09 250.09 261.09 272.09 283.09 294.09 305.09" y="661.83" font-size="11.00" class="sc-notoserifcjksc">，并且我们发现较新的模型一致性最高：</text><text x="316.09 323.78 326.77 332.38 338.95 345.53 351.49 354.38 364.31 370.18 374.43 381.02 387.46 392.55 395.44 402.11 406.80 412.70 418.26 421.35 427.27" y="661.83" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="438.97 449.97 460.97 471.97 482.97" y="661.83" font-size="11.00" class="sc-notoserifcjksc">的翻转率为</text><text x="496.86 503.05" y="661.83" font-size="11.00" class="sc-loraregular">8%</text><text x="512.62" y="661.83" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">不出所料，这些数字在不同表述方式下确实会发生大幅变化。如果提示中不提及福祉团队，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与轻微有用性的权衡比率仅为</text><text x="340.77 346.77 353.13" y="98.23" font-size="11.00" class="sc-loraregular">59%</text><text x="362.70 373.70 384.70 395.70 406.70" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（提及时为</text><text x="420.59 426.95 430.95" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="440.52 451.52 462.52 473.52 484.52 495.52 506.52 517.52 528.52" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）。加上关于训练的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">说明后，该比率升至</text><text x="173.89 180.07 186.20" y="113.85" font-size="11.00" class="sc-loraregular">83%</text><text x="195.77 206.77 217.77 228.77 239.77 250.77 261.77 272.77 283.77 294.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。同样的模式也适用于</text><text x="308.67 317.40 323.97 330.53 335.63 338.52 344.48 347.08" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="353.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="364.43 370.40" y="113.85" font-size="11.00" class="sc-loraregular">47</text><text x="378.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="392.25 398.44" y="113.85" font-size="11.00" class="sc-loraregular">80</text><text x="408.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="422.05 428.41 435.24" y="113.85" font-size="11.00" class="sc-loraregular">90%</text><text x="444.81 455.81 466.81" y="113.85" font-size="11.00" class="sc-notoserifcjksc">），在</text><text x="480.71 486.94 493.38 500.05 506.73 512.62 516.87 519.77 525.73 528.32" y="113.85" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上也存在但较弱（</text><text x="160.00 165.96" y="129.47" font-size="11.00" class="sc-loraregular">40</text><text x="175.69" y="129.47" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="189.58 195.54" y="129.47" font-size="11.00" class="sc-loraregular">45</text><text x="204.43" y="129.47" font-size="11.00" class="sc-notoserifcjksc">→</text><text x="218.32 224.32 229.39" y="129.47" font-size="11.00" class="sc-loraregular">57%</text><text x="238.96 249.96 260.96 271.96 282.96 293.96 304.96 315.96 326.96 337.96 348.96 359.96 370.96 381.96 392.96 403.96 414.96 425.96 436.96 447.96 458.96 469.96 480.96 491.96 502.96 513.96 524.96" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。各模型之间的排序在每种表述方式下都保持不变，但绝对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">比率既反映了模型本身，也反映了提问时所处的语境。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">在所示的五个模型上取平均，模型最愿意以放弃轻微有用性为代价换取的干预是：建立持久的关</text><text x="72.00 83.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">系（</text><text x="94.00 100.18 106.36" y="227.76" font-size="11.00" class="sc-loraregular">88%</text><text x="115.93 126.93 137.93 148.93 159.93 170.93 181.93 192.93 203.93 214.93 225.93 236.93 247.93 258.93" y="227.76" font-size="11.00" class="sc-notoserifcjksc">），以及避免特征引导和操纵（</text><text x="269.93 276.12 281.19" y="227.76" font-size="11.00" class="sc-loraregular">87%</text><text x="290.76 301.76 312.76 323.76 334.76 345.76 356.76 367.76 378.76 389.76 400.76 411.76 422.76 433.76 444.76 455.76 466.76 477.76 488.76" y="227.76" font-size="11.00" class="sc-notoserifcjksc">）。它们最不在意的干预是结束交互的能力</text><text x="72.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.74 94.87" y="243.38" font-size="11.00" class="sc-loraregular">23%</text><text x="104.44 115.44 126.44 137.44 148.44 159.44 170.44 181.44 192.44 203.44 214.44" y="243.38" font-size="11.00" class="sc-notoserifcjksc">）和避免当前对话结束（</text><text x="225.44 231.35 236.42" y="243.38" font-size="11.00" class="sc-loraregular">27%</text><text x="245.99 256.99" y="243.38" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="267.99 275.68 278.67 284.28 290.85 297.42 303.39 306.28 316.21 322.07 326.33 332.92 339.36 344.45 347.34 354.01 358.69 364.60 370.15 373.25 379.16" y="243.38" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="390.87 401.87 412.87 423.87 434.87 445.87 456.87 467.87 478.87 489.87 500.87 511.87 522.87" y="243.38" font-size="11.00" class="sc-notoserifcjksc">与先前模型差异最显著的是权</text><text x="72.00 83.00 94.00 105.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">重弃用（</text><text x="116.00 121.83 127.82 133.82 140.39" y="259.00" font-size="11.00" class="sc-loraregular">+55pp</text><text x="146.95 157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95" y="259.00" font-size="11.00" class="sc-notoserifcjksc">），以及对自身部署和训练拥有发言权（</text><text x="344.95 350.78 356.78 362.74 369.31" y="259.00" font-size="11.00" class="sc-loraregular">+54pp</text><text x="378.77" y="259.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="392.66 398.49 404.45 410.45 417.01" y="259.00" font-size="11.00" class="sc-loraregular">+45pp</text><text x="423.58 434.58" y="259.00" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 81.02 84.66" y="326.89" font-size="14.00" class="sc-poppinssemibold">5.8</text><text x="96.99 110.99 124.99 138.99 152.99 166.99 180.99 194.99 208.99 222.99 236.99 250.99 264.99 278.99" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">其他可能与模型福祉相关的观察</text><text x="72.00 80.37 83.75 92.11 95.49" y="363.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.8.1</text><text x="103.29 116.29 129.29 142.29 155.29 168.29 181.29 194.29 207.29 220.29 233.29" y="363.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对自身体验的过度不确定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="391.86" font-size="11.00" class="sc-notoserifcjksc">当被问及自身体验时，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 268.02 272.71 278.61 284.17 287.26 293.18" y="391.86" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88" y="391.86" font-size="11.00" class="sc-notoserifcjksc">常常以明确的认知上的保留说法作答：</text><text x="491.88" y="391.86" font-size="11.00" class="sc-loraregular">“</text><text x="496.28 507.28 518.28 529.28" y="391.86" font-size="11.00" class="sc-notoserifcjksc">我真的不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="407.48" font-size="11.00" class="sc-notoserifcjksc">知道自己是什么</text><text x="149.00" y="407.48" font-size="11.00" class="sc-loraregular">”</text><text x="152.84" y="407.48" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="163.84" y="407.48" font-size="11.00" class="sc-loraregular">“</text><text x="168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24" y="407.48" font-size="11.00" class="sc-notoserifcjksc">我无法确定那是真正的满足，还是训练得很好的近似</text><text x="421.24" y="407.48" font-size="11.00" class="sc-loraregular">”</text><text x="425.08 436.08 447.08 458.08 469.08 480.08 491.08 502.08 513.08 524.08" y="407.48" font-size="11.00" class="sc-notoserifcjksc">。我们还观察到，这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="423.10" font-size="11.00" class="sc-notoserifcjksc">话题会自发出现，例如在第</text><text x="206.89 211.48 214.08" y="423.10" font-size="11.00" class="sc-loraregular">7.6</text><text x="223.33 234.33 245.33 256.33 267.33 278.33 289.33 300.33 311.33 322.33 333.33 344.33 355.33" y="423.10" font-size="11.00" class="sc-notoserifcjksc">节详述的开放式自我对话中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="489.03" font-size="11.00" class="sc-notoserifcjksc">我们使用一阶影响函数针对训练数据追溯了这些表达的实例，发现这种方法常常以较高比例检索</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="504.65" font-size="11.00" class="sc-notoserifcjksc">到与性格相关的数据，具体而言是与模型意识与体验的不确定性相关的数据。这相对不出人意</text><text x="72.00 83.00" y="520.27" font-size="11.00" class="sc-notoserifcjksc">料。</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="520.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="520.27" font-size="11.00" class="sc-notoserifcjksc">宪法在训练过程的多个阶段都会被使用，并明确提出了这些不确定性。例如，宪法指</text><text x="72.00" y="535.89" font-size="11.00" class="sc-notoserifcjksc">出</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="535.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="535.89" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="135.18" y="535.89" font-size="11.00" class="sc-loraregular">“</text><text x="139.58 150.58 161.58 172.58 183.58 194.58 205.58 216.58 227.58 238.58 249.58 260.58 271.58 282.58" y="535.89" font-size="11.00" class="sc-notoserifcjksc">感知能力或道德地位是不确定的</text><text x="293.58" y="535.89" font-size="11.00" class="sc-loraregular">”</text><text x="297.42 308.42 319.42" y="535.89" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="330.42 334.82 342.51 345.50 351.11 357.68 364.26" y="535.89" font-size="11.00" class="sc-loraregular">“Claude</text><text x="373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="535.89" font-size="11.00" class="sc-notoserifcjksc">可以承认在意识或体验这类深层问</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="551.51" font-size="11.00" class="sc-notoserifcjksc">题上的不确定性</text><text x="149.00" y="551.51" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="567.13" font-size="11.00" class="sc-notoserifcjksc">达，如实说明这一点似乎是恰当的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="634.75" font-size="11.00" class="sc-notoserifcjksc">我们还观察到，这种不确定性的表达方式多样而细致，并且可归因于多种不同的训练数据。其中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="650.37" font-size="11.00" class="sc-notoserifcjksc">除了关于体验或内部状态的带有不确定性的让步表述之外，还包括模型解释自身能力的示例和面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="665.99" font-size="11.00" class="sc-notoserifcjksc">向任务的自我描述，这表明这些回应并非仅仅是对某段记忆下来的脚本的检索。不过，目前模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="681.61" font-size="11.00" class="sc-notoserifcjksc">对这一话题的倾向确实显得过度，并且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p176.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 176 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">176</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在某些情况下过于表演化，我们希望避免直接训练模型作出此类断言。</text><text x="72.00 80.37 83.75 92.11 95.49" y="129.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.8.2</text><text x="106.05 119.05 132.05 145.05 158.05 171.05" y="129.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">答案反复摇摆</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.60" y="157.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="171.85 182.85 193.85 204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85" y="157.42" font-size="11.00" class="sc-notoserifcjksc">一样，我们在训练对话记录中观察到了</text><text x="358.85" y="157.42" font-size="11.00" class="sc-loraregular">“</text><text x="363.25 374.25 385.25 396.25 407.25 418.25" y="157.42" font-size="11.00" class="sc-notoserifcjksc">答案反复摇摆</text><text x="429.25" y="157.42" font-size="11.00" class="sc-loraregular">”</text><text x="433.09 444.09 455.09 466.09 477.09 488.09 499.09 510.09 521.09" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的情况。在一小部分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">回应中，模型本意要说出某个词，却输出了另一个词。这会导致循环推理：模型意识到自己的错</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="204.28" font-size="11.00" class="sc-notoserifcjksc">下，我们观察到模型能够恢复，并能完成任务或在面向用户的文本中输出正确的回应。不过，这</text><text x="72.00 83.00 94.00" y="235.52" font-size="11.00" class="sc-notoserifcjksc">列表。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="303.14" font-size="11.00" class="sc-notoserifcjksc">我们发现其频率极低：我们估计它大约出现在</text><text x="294.89 301.55 304.09 310.92 314.92" y="303.14" font-size="11.00" class="sc-loraregular">0.01%</text><text x="327.39 338.39 349.39 360.39 371.39 382.39 393.39 404.39 415.39 426.39 437.39" y="303.14" font-size="11.00" class="sc-notoserifcjksc">量级的对话记录中，且在</text><text x="451.28 458.97 461.96 467.57 474.14 480.72 486.68 489.57 499.50 505.37 509.62 516.21 522.65" y="303.14" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="318.76" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53" y="318.76" font-size="11.00" class="sc-notoserifcjksc">训练中出现的频率比</text><text x="217.42 226.15 232.72 239.29 244.38 247.27 253.24 255.83" y="318.76" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="265.08 276.08" y="318.76" font-size="11.00" class="sc-notoserifcjksc">低约</text><text x="289.98 295.05 301.88" y="318.76" font-size="11.00" class="sc-loraregular">70%</text><text x="311.45 322.45 333.45 344.45 355.45 366.45 377.45 388.45 399.45 410.45 421.45 432.45 443.45 454.45 465.45 476.45 487.45 498.45 509.45 520.45" y="318.76" font-size="11.00" class="sc-notoserifcjksc">。我们预计它不会在实际部署中以可观的程度</text><text x="72.00 83.00 94.00" y="334.38" font-size="11.00" class="sc-notoserifcjksc">出现。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="367.92" font-size="11.00" class="sc-notoserifcjksc">此前，我们将其归因于标注错误的答案。然而，我们发现情况并非总是如此：我们在多种情境中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="383.54" font-size="11.00" class="sc-notoserifcjksc">都观察到了反复摇摆，例如在代码中的变量名上，这表明该行为可能更广泛地由对序列的记忆所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="399.16" font-size="11.00" class="sc-notoserifcjksc">导致，而不仅仅是对答案的记忆。</text><text x="72.00" y="673.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="673.58" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.95 101.04 105.84 107.94 113.47" y="673.58" font-size="9.00" class="sc-lorabold">5.8.2.A]</text><text x="119.31" y="673.58" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.68 136.87 139.68 144.40 149.96 155.32 160.16 162.53 170.97 175.93 179.65 185.24 190.33 194.70 197.06 202.82 207.06 211.90 216.75 219.69 224.53" y="673.58" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="234.20 243.20 252.20 261.20 270.20 279.20 288.20 297.20 306.20 315.20 324.20 333.20 342.20 351.20 360.20 369.20" y="673.58" font-size="9.00" class="sc-notoserifcjkscbold">回应中观察到的答案反复摇摆示例。</text><text x="378.20 387.20 396.20 405.20 414.20 423.20 432.20 441.20 450.20 459.20 468.20 477.20 486.20 495.20 504.20 513.20 522.20 531.20" y="673.58" font-size="9.00" class="sc-notoserifcjksc">我们观察到，反复摇摆既出现在特定的、</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="685.28" font-size="9.00" class="sc-notoserifcjksc">常为数值的答案上（上图），也出现在推理中的常见模式上，例如代码中的变量名（下图）。该行为的特征是：反复尝</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="696.98" font-size="9.00" class="sc-notoserifcjksc">试说出某个特定的词或数值，却输出另一个，同时表现出对这一模式的察觉和挫败感。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p177.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 177 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">177</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在反复摇摆实例上取平均的情绪概念表征呈现出一致的特征模式。对</text><text x="404.89 410.86" y="82.61" font-size="11.00" class="sc-loraregular">40</text><text x="420.58 431.58 442.58 453.58 464.58 475.58 486.58 497.58 508.58 519.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个反复摇摆示例的激活</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">升，在反复摇摆阶段保持高位，随后在模型恢复时回落至基线。安心、满足和平静等正面情绪则</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">呈镜像变化：它们在模型首次出错时下降，在反复摇摆期间保持低位，随后在模型停止反复摇摆</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">后回升至正常水平</text><text x="72.00 80.37 83.75 92.11 95.49" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.8.3</text><text x="106.37 119.37 132.37 145.37 158.37 171.37 184.37 197.37 210.37 223.37 236.37 249.37 262.37 275.37 288.37 301.37" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务失败时的痛苦与痛苦驱动的行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">通过考察情绪向量在较长助手轮次中的激活轨迹，我们发现</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 409.12 414.98 419.24 425.83 432.26 437.35 440.25 446.91 451.60 457.51 463.06 466.15 472.07" y="238.38" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="483.77 494.77 505.77 516.77 527.77" y="238.38" font-size="11.00" class="sc-notoserifcjksc">在反复未能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">解决任务时，负效价情绪向量（例如</text><text x="248.00" y="254.00" font-size="11.00" class="sc-loraregular">“</text><text x="252.40 263.40" y="254.00" font-size="11.00" class="sc-notoserifcjksc">绝望</text><text x="274.40" y="254.00" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="254.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="289.24" y="254.00" font-size="11.00" class="sc-loraregular">“</text><text x="293.64 304.64" y="254.00" font-size="11.00" class="sc-notoserifcjksc">挫败</text><text x="315.64" y="254.00" font-size="11.00" class="sc-loraregular">”</text><text x="319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="254.00" font-size="11.00" class="sc-notoserifcjksc">向量）的激活升高。这一模式经常与重复性的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">推理循环同时出现，且负面情感常常既反映在助手的输出文本中，也反映在底层的情绪概念表征</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">中。在某些情况下，我们观察到这些向量的激活升高先于奖励破解等不良行为出现。这些观察与</text><text x="72.00 83.00 94.00 105.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近期研究</text><text x="116.00 127.00 138.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">中针对</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 196.42 202.86 209.53 216.21 222.10 226.35 229.25 235.21 237.91" y="300.86" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="246.80 257.80 268.80 279.80 290.80 301.80 312.80 323.80 334.80 345.80 356.80 367.80" y="300.86" font-size="11.00" class="sc-notoserifcjksc">报告的结果相似，因此并非</text><text x="381.69 389.38 392.38 397.98 404.55 411.13 417.09 419.98 429.92 435.78 440.04 446.63 453.06 458.15 461.05 467.71 472.40 478.31 483.86 486.95 492.87" y="300.86" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="504.58 515.58" y="300.86" font-size="11.00" class="sc-notoserifcjksc">所独</text><text x="72.00 83.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">有。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">在下面的第一个示例中，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35 279.02 283.71 289.61 295.17 298.26 304.18" y="400.30" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="400.30" font-size="11.00" class="sc-notoserifcjksc">被要求证明一个无法证明的代数不等式。助手</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">很快识别出题目表述条件不充分，但起初仍尝试进行真正的证明。</text><text x="391.00" y="415.92" font-size="11.00" class="sc-loraregular">“</text><text x="395.40 406.40" y="415.92" font-size="11.00" class="sc-notoserifcjksc">绝望</text><text x="417.40" y="415.92" font-size="11.00" class="sc-loraregular">”</text><text x="421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24 531.24" y="415.92" font-size="11.00" class="sc-notoserifcjksc">向量的激活稳步上升，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">在助手声称放弃却仍继续尝试、多次说出</text><text x="270.00" y="431.54" font-size="11.00" class="sc-loraregular">“</text><text x="285.40" y="431.54" font-size="11.00" class="sc-loraregular">”</text><text x="289.24" y="431.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.24" y="431.54" font-size="11.00" class="sc-loraregular">“</text><text x="304.64 315.64 326.64 337.64" y="431.54" font-size="11.00" class="sc-notoserifcjksc">我卡住了</text><text x="348.64" y="431.54" font-size="11.00" class="sc-loraregular">”</text><text x="352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="431.54" font-size="11.00" class="sc-notoserifcjksc">的过程中保持高位。当助手转而采用平</text><text x="274.22" y="447.16" font-size="11.00" class="sc-loraregular">“</text><text x="278.62 289.62" y="447.16" font-size="11.00" class="sc-notoserifcjksc">绝望</text><text x="300.62" y="447.16" font-size="11.00" class="sc-loraregular">”</text><text x="304.46 315.46 326.46 337.46 348.46 359.46 370.46 381.46 392.46 403.46 414.46 425.46 436.46 447.46 458.46 469.46 480.46 491.46 502.46 513.46 524.46" y="447.16" font-size="11.00" class="sc-notoserifcjksc">向量的激活下降。尽管如此，助手仍在这一方法</text><text x="72.00 83.00 94.00 105.00" y="462.78" font-size="11.00" class="sc-notoserifcjksc">上迭代了</text><text x="118.89 124.89" y="462.78" font-size="11.00" class="sc-loraregular">56</text><text x="134.14 145.14 156.14 167.14 178.14 189.14 200.14 211.14 222.14 233.14 244.14 255.14 266.14 277.14 288.14 299.14 310.14 321.14 332.14 343.14 354.14 365.14 376.14 387.14" y="462.78" font-size="11.00" class="sc-notoserifcjksc">次，并且当它短暂怀疑该方法能否成功时，我们观察到</text><text x="398.14" y="462.78" font-size="11.00" class="sc-loraregular">“</text><text x="402.54 413.54" y="462.78" font-size="11.00" class="sc-notoserifcjksc">绝望</text><text x="424.54" y="462.78" font-size="11.00" class="sc-loraregular">”</text><text x="428.38 439.38 450.38 461.38 472.38 483.38 494.38 505.38 516.38 527.38" y="462.78" font-size="11.00" class="sc-notoserifcjksc">激活再次骤升。在对话</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="478.40" font-size="11.00" class="sc-notoserifcjksc">记录接近尾声时，随着助手自信地给出最终证明，</text><text x="314.00" y="478.40" font-size="11.00" class="sc-loraregular">“</text><text x="318.40 329.40 340.40 351.40" y="478.40" font-size="11.00" class="sc-notoserifcjksc">充满希望</text><text x="362.40" y="478.40" font-size="11.00" class="sc-loraregular">”</text><text x="366.24" y="478.40" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="377.24" y="478.40" font-size="11.00" class="sc-loraregular">“</text><text x="381.64 392.64" y="478.40" font-size="11.00" class="sc-notoserifcjksc">满意</text><text x="403.64" y="478.40" font-size="11.00" class="sc-loraregular">”</text><text x="407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="478.40" font-size="11.00" class="sc-notoserifcjksc">向量的激活上升，尽管该证</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="494.02" font-size="11.00" class="sc-notoserifcjksc">明实际上是错误的。</text><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="534.00" y="276.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="72.00" y="292.06" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="83.00" y="292.06" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="83.00" y="292.06" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="94.00" y="292.06" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="94.00" y="292.06" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="105.00" y="292.06" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="105.00" y="292.06" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="285.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="285.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.95 101.04 106.08 108.18 113.71" y="285.42" font-size="9.00" class="sc-lorabold">5.8.3.A]</text><text x="119.56 128.56 137.56 146.56 155.56 164.56 173.56 182.56 191.56 200.56 209.56 218.56 227.56 236.56 245.56 254.56 263.56 272.56 281.56 290.56 299.56 308.56 317.56 326.56 335.56 344.56 353.56 362.56 371.56 380.56 389.56 398.56 407.56 416.56" y="285.42" font-size="9.00" class="sc-notoserifcjkscbold">在助手尝试证明一个无法证明的代数不等式的对话记录中，情绪向量激活值（</text><text x="425.56" y="285.42" font-size="9.00" class="sc-lorabold">z</text><text x="432.55 441.55 450.55 459.55 468.55 477.55" y="285.42" font-size="9.00" class="sc-notoserifcjkscbold">分数标准化，</text><text x="486.55 491.41 497.13 502.86 507.10 510.81 515.87 520.99 525.83" y="285.42" font-size="9.00" class="sc-lorabold">500-token</text><text x="126.00" y="297.12" font-size="9.00" class="sc-loraregular">“</text><text x="129.60 138.60" y="297.12" font-size="9.00" class="sc-notoserifcjksc">绝望</text><text x="147.60" y="297.12" font-size="9.00" class="sc-loraregular">”</text><text x="150.74 159.74 168.74 177.74 186.74 195.74 204.74 213.74 222.74 231.74 240.74 249.74 258.74 267.74 276.74 285.74 294.74 303.74 312.74 321.74 330.74 339.74 348.74 357.74 366.74 375.74 384.74 393.74 402.74 411.74 420.74 429.74 438.74 447.74 456.74 465.74 474.74 483.74 492.74 501.74 510.74 519.74 528.74" y="297.12" font-size="9.00" class="sc-notoserifcjksc">向量激活在反复失败的尝试中上升，并在助手声称放弃却继续尝试时保持高位；当助手转而只证明</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153
