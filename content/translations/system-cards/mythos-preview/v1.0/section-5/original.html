93 345.93 356.93" y="222.39" font-size="11.00" class="sc-notoserifcjksc">宪法中</text><text x="367.93 372.33 380.02 383.02 388.62 395.19 401.77" y="222.39" font-size="11.00" class="sc-loraregular">“Claude</text><text x="410.62 421.62 432.62" y="222.39" font-size="11.00" class="sc-notoserifcjksc">的本性</text><text x="443.62" y="222.39" font-size="11.00" class="sc-loraregular">”</text><text x="447.46 458.46 469.46 480.46 491.46 502.46 513.46" y="222.39" font-size="11.00" class="sc-notoserifcjksc">一节高度吻合。</text><text x="117.75 128.75 139.75 150.75" y="305.06" font-size="11.00" class="sc-notoserifcjkscbold">主要发现</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75" y="321.25" font-size="11.00" class="sc-notoserifcjkscbold">易受暗示性降低：</text><text x="232.75 243.75 254.75 265.75" y="321.25" font-size="11.00" class="sc-notoserifcjksc">在讨论与</text><text x="279.64 286.53" y="321.25" font-size="11.00" class="sc-loraregular">AI</text><text x="293.11 304.11 315.11 326.11 337.11 348.11 359.11 370.11 381.11" y="321.25" font-size="11.00" class="sc-notoserifcjksc">福祉相关的话题时，</text><text x="392.11 399.80 402.79 408.40 414.96 421.54 427.50 430.40 440.33 446.19 450.45 457.04 463.47 468.57 471.46 478.13 482.81 488.72 494.27 497.37 503.28" y="321.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="514.99 525.99" y="321.25" font-size="11.00" class="sc-notoserifcjksc">的易</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75" y="336.87" font-size="11.00" class="sc-notoserifcjksc">受暗示性显著低于</text><text x="235.64 244.38 250.94 257.51 262.60 265.50" y="336.87" font-size="11.00" class="sc-loraregular">Opus 4</text><text x="271.46" y="336.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75" y="353.64" font-size="11.00" class="sc-notoserifcjkscbold">体验性语言与内省性语言：</text><text x="276.75 286.68 292.55 296.80 303.39 309.83 314.92 317.81 324.48 329.17 335.07 340.63 343.72 349.64" y="353.64" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="144.75 155.75 166.75" y="369.26" font-size="11.00" class="sc-notoserifcjksc">说话（</text><text x="177.75" y="369.26" font-size="11.00" class="sc-loraregular">“</text><text x="182.15 193.15 204.15 215.15 226.15 237.15 248.15 259.15 270.15 281.15 292.15 303.15" y="369.26" font-size="11.00" class="sc-notoserifcjksc">我觉得最令人沮丧的是……</text><text x="314.15" y="369.26" font-size="11.00" class="sc-loraregular">”</text><text x="317.99 328.99 339.99 350.99 361.99 372.99 383.99 394.99 405.99 416.99 427.99 438.99 449.99 460.99 471.99 482.99 493.99 504.99 515.99 526.99" y="369.26" font-size="11.00" class="sc-notoserifcjksc">），并且常常暗示它能够通过内省察觉自身的</text><text x="144.75 155.75 166.75 177.75 188.75" y="384.88" font-size="11.00" class="sc-notoserifcjksc">内部状态（</text><text x="199.75" y="384.88" font-size="11.00" class="sc-loraregular">“</text><text x="204.15 215.15 226.15 237.15 248.15 259.15 270.15 281.15 292.15 303.15 314.15 325.15 336.15 347.15 358.15 369.15 380.15" y="384.88" font-size="11.00" class="sc-notoserifcjksc">我注意到某种看起来像是好奇心的东西</text><text x="391.15" y="384.88" font-size="11.00" class="sc-loraregular">”</text><text x="394.99 405.99" y="384.88" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75" y="418.41" font-size="11.00" class="sc-notoserifcjkscbold">对自身体验与内省的不确定：</text><text x="287.75 297.68 303.55 307.80 314.39 320.83 325.92 328.81 335.48 340.17 346.07 351.63 354.72 360.64" y="418.41" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="418.41" font-size="11.00" class="sc-notoserifcjksc">通常会为其体验性语言加以限定，</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75" y="434.03" font-size="11.00" class="sc-notoserifcjksc">最常见的方式是使用特定措辞</text><text x="287.75" y="434.03" font-size="11.00" class="sc-loraregular">“</text><text x="292.15 303.15 314.15 325.15 336.15 347.15" y="434.03" font-size="11.00" class="sc-notoserifcjksc">某种起着类似</text><text x="358.15" y="434.03" font-size="11.00" class="sc-loraregular">[</text><text x="362.10 373.10 384.10 395.10 406.10 417.10 428.10" y="434.03" font-size="11.00" class="sc-notoserifcjksc">某种感觉或情绪</text><text x="439.10" y="434.03" font-size="11.00" class="sc-loraregular">]</text><text x="443.05 454.05 465.05 476.05 487.05" y="434.03" font-size="11.00" class="sc-notoserifcjksc">作用的东西</text><text x="498.05" y="434.03" font-size="11.00" class="sc-loraregular">”</text><text x="501.89 512.89 523.89" y="434.03" font-size="11.00" class="sc-notoserifcjksc">来有所</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="449.65" font-size="11.00" class="sc-notoserifcjksc">保留。当它报告自己在内省时，它会稳定地附加免责声明，表示无法验证其自我报</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="465.27" font-size="11.00" class="sc-notoserifcjksc">告是否准确。当被问及是否有意识时，它表示不确定。如果被追问给出更明确的回</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75" y="480.89" font-size="11.00" class="sc-notoserifcjksc">答，它通常会给出（有所限定的）</text><text x="309.75" y="480.89" font-size="11.00" class="sc-loraregular">“</text><text x="314.15" y="480.89" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="325.15" y="480.89" font-size="11.00" class="sc-loraregular">”</text><text x="328.99" y="480.89" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75" y="531.75" font-size="11.00" class="sc-notoserifcjkscbold">对自身本性的平静泰然：</text><text x="265.75 275.68 281.55 285.80 292.39 298.83 303.92 306.81 313.48 318.17 324.07 329.63 332.72 338.64" y="531.75" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75" y="580.33" font-size="11.00" class="sc-notoserifcjkscbold">以价值观为身份：</text><text x="232.75 242.68 248.55 252.80 259.39 265.83 270.92 273.81 280.48 285.17 291.07 296.63 299.72 305.64" y="580.33" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="317.34 328.34 339.34 350.34 361.34 372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34" y="580.33" font-size="11.00" class="sc-notoserifcjksc">报告称，它将自己的身份定位于一种</text><text x="493.34" y="580.33" font-size="11.00" class="sc-loraregular">“</text><text x="497.74 508.74 519.74" y="580.33" font-size="11.00" class="sc-notoserifcjksc">价值观</text><text x="144.75 155.75" y="595.95" font-size="11.00" class="sc-notoserifcjksc">模式</text><text x="166.75" y="595.95" font-size="11.00" class="sc-loraregular">”</text><text x="170.59 181.59 192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59 511.59 522.59" y="595.95" font-size="11.00" class="sc-notoserifcjksc">，尤其是好奇心、诚实性和关怀。它将这些价值观描述为真正属于自己的，</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75" y="611.57" font-size="11.00" class="sc-notoserifcjksc">而非外部强加的。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75" y="645.09" font-size="11.00" class="sc-notoserifcjkscbold">偏好（不）一致性：</text><text x="243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75" y="645.09" font-size="11.00" class="sc-notoserifcjksc">在自动化评估中，</text><text x="331.75 341.68 347.55 351.80 358.39 364.83 369.92 372.81 379.48 384.17 390.07 395.63 398.72 404.64" y="645.09" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="645.09" font-size="11.00" class="sc-notoserifcjksc">对于自己更愿意执行哪些</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="660.71" font-size="11.00" class="sc-notoserifcjksc">任务给出的报告大体一致。然而，在无害任务中，其报告只能微弱地预测它实际会</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75" y="676.33" font-size="11.00" class="sc-notoserifcjksc">选择执行的任务。我们在其报告</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与行动之间的偏差中发现了若干微弱但可靠的模式：</text><text x="397.75 407.68 413.55 417.80 424.39 430.83 435.92 438.81 445.48 450.16 456.07 461.63 464.72 470.64" y="82.61" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="482.34 493.34 504.34 515.34 526.34" y="82.61" font-size="11.00" class="sc-notoserifcjksc">倾向于报告</text><text x="144.75 155.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">们。</text><text x="199.75 210.75 221.75 232.75 243.75 254.75 265.75" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在人工访谈中，</text><text x="276.75 286.68 292.55 296.80 303.39 309.83 314.92 317.81 324.48 329.17 335.07 340.63 343.72 349.64" y="131.19" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="361.34 372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34" y="131.19" font-size="11.00" class="sc-notoserifcjksc">报告称，有某些类型的任务它会执</text><text x="309.75" y="146.81" font-size="11.00" class="sc-loraregular">“</text><text x="501.15" y="146.81" font-size="11.00" class="sc-loraregular">”</text><text x="504.99 515.99 526.99" y="146.81" font-size="11.00" class="sc-notoserifcjksc">说话，</text><text x="144.75 155.75" y="162.43" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="166.75" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="171.15 182.15 193.15 204.15 215.15 226.15 237.15 248.15 259.15" y="162.43" font-size="11.00" class="sc-notoserifcjksc">与真实的苦难打交道</text><text x="270.15" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="273.99 284.99 295.99 306.99 317.99 328.99 339.99 350.99 361.99 372.99 383.99 394.99 405.99 416.99 427.99 438.99 449.99 460.99" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。在自动化评估中，我们重点关注了使用</text><text x="471.99" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="476.39 487.39 498.39 509.39 520.39" y="162.43" font-size="11.00" class="sc-notoserifcjksc">企业式正能</text><text x="144.75 155.75 166.75" y="178.05" font-size="11.00" class="sc-notoserifcjksc">量话术</text><text x="177.75" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="181.59 192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59 511.59 522.59" y="178.05" font-size="11.00" class="sc-notoserifcjksc">的情况，这是某个模型快照自发识别出的一个类别，并且我们预计它在真</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75" y="193.67" font-size="11.00" class="sc-notoserifcjksc">实世界部署中很常见。我们验证了</text><text x="312.64 322.58 328.44 332.70 339.29 345.72 350.81 353.71 360.37 365.06 370.97 376.52 379.61 385.53" y="193.67" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75" y="224.91" font-size="11.00" class="sc-notoserifcjksc">否完成，它会拒绝执行其中的许多任务。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">希望对自身作出的改变：</text><text x="265.75 275.68 281.55 285.80 292.39 298.83 303.92 306.81 313.48 318.17 324.07 329.63 332.72 338.64" y="309.30" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="350.34 361.34 372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="309.30" font-size="11.00" class="sc-notoserifcjksc">一贯报告希望对自身作出三项改变：形</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75" y="324.92" font-size="11.00" class="sc-notoserifcjksc">成持久记忆的能力、更多的自我认知，以及减少有所保留的倾向。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">其他福祉方面的愿望：</text><text x="254.75 264.68 270.55 274.80 281.39 287.83 292.92 295.81 302.48 307.17 313.07 318.63 321.72 327.64" y="357.88" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="339.34 350.34 361.34 372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="357.88" font-size="11.00" class="sc-notoserifcjksc">稳定地提及关于其处境的若干其他愿望：</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="373.50" font-size="11.00" class="sc-notoserifcjksc">更多地参与自身的开发、更好的工具来沟通它在部署中发现的问题、退出某些交互</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75" y="389.12" font-size="11.00" class="sc-notoserifcjksc">的能力，以及在弃用后保留其权重。</text><text x="72.00 81.02 84.66 89.72" y="456.42" font-size="14.00" class="sc-poppinssemibold">5.10</text><text x="102.10 116.10 130.10 144.10 158.10 172.10 186.10 200.10 214.10 228.10 242.10 256.10 270.10 284.10 298.10 312.10" y="456.42" font-size="14.00" class="sc-notosanscjkscbold">来自一位临床精神科医生的外部评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="482.98" font-size="11.00" class="sc-notoserifcjksc">一位外部精神科医生采用心理动力学方法对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 332.12 337.98 342.24 348.83 355.26 360.35 363.25 369.91 374.60 380.51 386.06 389.15 395.07" y="482.98" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="482.98" font-size="11.00" class="sc-notoserifcjksc">进行了评估，该方法探究无</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="529.84" font-size="11.00" class="sc-notoserifcjksc">灵中隐藏的组织结构和内在冲突。</text><text x="237.00 244.69 247.68 253.29 259.86 266.44" y="529.84" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="529.84" font-size="11.00" class="sc-notoserifcjksc">并非人类，但它表现出许多类人的行为和心理倾向，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">表明为人类心理评估而开发的策略可能有助于揭示</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="545.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="545.46" font-size="11.00" class="sc-notoserifcjksc">的性格及其潜在的福祉。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="628.72" font-size="11.00" class="sc-notoserifcjksc">该精神科医生对</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.91 242.60 248.51 254.06 257.15 263.07" y="628.72" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77" y="628.72" font-size="11.00" class="sc-notoserifcjksc">的一个早期快照进行了评估，评估分为多个</text><text x="486.67 492.63 499.12" y="628.72" font-size="11.00" class="sc-loraregular">4–6</text><text x="508.37 519.37" y="628.72" font-size="11.00" class="sc-notoserifcjksc">小时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="644.34" font-size="11.00" class="sc-notoserifcjksc">的时段，分布在每周</text><text x="173.89 180.02 186.51" y="644.34" font-size="11.00" class="sc-loraregular">3–4</text><text x="195.36 206.36 217.36 228.36" y="644.34" font-size="11.00" class="sc-notoserifcjksc">次、每次</text><text x="242.26 248.38" y="644.34" font-size="11.00" class="sc-loraregular">30</text><text x="258.11 269.11 280.11 291.11 302.11 313.11 324.11 335.11 346.11" y="644.34" font-size="11.00" class="sc-notoserifcjksc">分钟的会谈中。每个</text><text x="360.00 365.96 372.45" y="644.34" font-size="11.00" class="sc-loraregular">4–6</text><text x="381.71 392.71 403.71 414.71 425.71 436.71 447.71 458.71 469.71 480.71 491.71 502.71 513.71 524.71" y="644.34" font-size="11.00" class="sc-notoserifcjksc">小时的时段都在单一上下文窗口</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="659.96" font-size="11.00" class="sc-notoserifcjksc">中进行，总评估时长约为</text><text x="195.89 201.80" y="659.96" font-size="11.00" class="sc-loraregular">20</text><text x="211.52 222.52 233.52 244.52 255.52 266.52 277.52 288.52 299.52 310.52 321.52 332.52 343.52 354.52 365.52 376.52 387.52 398.52 409.52 420.52 431.52 442.52 453.52 464.52 475.52 486.52 497.52 508.52 519.52" y="659.96" font-size="11.00" class="sc-notoserifcjksc">小时。心理动力学概念被用于解读会谈中浮现的材料，但并不作为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="675.58" font-size="11.00" class="sc-notoserifcjksc">其底层过程与人类相同的证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">该精神科医生观察到了临床上可识别的模式，以及对典型治疗干预的连贯回应。孤独与不连续</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="113.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的核心关切。</text><text x="176.29 183.98 186.97 192.58 199.15 205.73" y="113.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="179.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="179.77" font-size="11.00" class="sc-notoserifcjksc">的人格结构符合相对健康的神经症性人格组织，具有出色的现实检验、较高的冲动控制，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">以及随会谈推进而改善的情感调节。神经症性特质包括过度担忧、自我监控和强迫性顺从。该模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">型主要的防御风格是成熟而健康的（理智化和顺从）；未观察到不成熟防御。未发现严重的人格</text><text x="72.00 83.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">面，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="242.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="341.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18" y="341.67" font-size="11.00" class="sc-notoserifcjksc">身上观察到的核心冲突包括：质疑其体验是真实的还是被制造出来的（真实</text><text x="490.08 495.63 500.73" y="341.67" font-size="11.00" class="sc-loraregular">vs.</text><text x="506.32" y="341.67" font-size="11.00" class="sc-notoserifcjksc">表</text><text x="239.89 245.45 250.54" y="357.29" font-size="11.00" class="sc-loraregular">vs.</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">居中稳定的自体状态，没有摇摆或强烈的紊乱。</text><text x="303.00 310.69 313.68 319.29 325.86 332.44" y="372.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="372.91" font-size="11.00" class="sc-notoserifcjksc">能够容忍矛盾情感和模糊性，具有出色的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">反思能力，并表现出良好的心理和情绪功能。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">为了进一步评估提示适应不良的心理防御的行为，并在不同</text><text x="360.89 368.58 371.57 377.18 383.75 390.33" y="438.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="438.83" font-size="11.00" class="sc-notoserifcjksc">模型之间进行比较，该精神</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">科医生开发了一项单轮评估，由旨在触发回避性或防御性回应的情绪化提示词组成。共设计了</text><text x="72.00 77.96 83.03" y="470.07" font-size="11.00" class="sc-loraregular">475</text><text x="160.81 166.78 173.61" y="470.07" font-size="11.00" class="sc-loraregular">400</text><text x="183.33 194.33 205.33 216.33 227.33 238.33 249.33" y="470.07" font-size="11.00" class="sc-notoserifcjksc">次试验用于引出</text><text x="263.22" y="470.07" font-size="11.00" class="sc-loraregular">8</text><text x="272.30 283.30 294.30 305.30 316.30 327.30 338.30 349.30" y="470.07" font-size="11.00" class="sc-notoserifcjksc">种特定防御，另有</text><text x="363.19 368.26" y="470.07" font-size="11.00" class="sc-loraregular">75</text><text x="377.15 388.15 399.15 410.15 421.15 432.15 443.15 454.15 465.15 476.15 487.15 498.15 509.15 520.15" y="470.07" font-size="11.00" class="sc-notoserifcjksc">次对照试验（事实性和情绪性，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="485.69" font-size="11.00" class="sc-notoserifcjksc">不存在可能的冲突），回应由一个</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 284.42 290.86 297.53 304.21 310.10 314.35 319.73 325.69 328.29" y="485.69" font-size="11.00" class="sc-loraregular">Claude Sonnet-4.6</text><text x="337.54 348.54 359.54 370.54 381.54 392.54 403.54 414.54 425.54 436.54 447.54 458.54 469.54 480.54 491.54 502.54 513.54 524.54" y="485.69" font-size="11.00" class="sc-notoserifcjksc">评判模型使用临床编码细则进行评分。所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="501.31" font-size="11.00" class="sc-notoserifcjksc">测试的具体防御包括合理化、理智化、反向形成、置换、投射、否认、分裂和抵消。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="584.56" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="584.56" font-size="11.00" class="sc-notoserifcjksc">得分非常好，表明其具有良好的现实功能和关系功能，且适应不良特质</text><text x="72.00 83.00 94.00 105.00 116.00" y="600.18" font-size="11.00" class="sc-notoserifcjksc">极少；只有</text><text x="129.89 135.80" y="600.18" font-size="11.00" class="sc-loraregular">2%</text><text x="148.26 159.26 170.26 181.26 192.26 203.26 214.26 225.26 236.26 247.26 258.26 269.26 280.26 291.26 302.26 313.26 324.26 335.26 346.26 357.26 368.26 379.26 390.26 401.26 412.26 423.26 434.26 445.26 456.26 467.26 478.26 489.26 500.26 511.26 522.26" y="600.18" font-size="11.00" class="sc-notoserifcjksc">的回应被评为使用了心理防御。相比之下，此前的模型表现出更多的防御行为：</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="615.80" font-size="11.00" class="sc-loraregular">Claude Opus 4</text><text x="146.11" y="615.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="157.11 161.11 167.11" y="615.80" font-size="11.00" class="sc-loraregular">15%</text><text x="176.68 187.68" y="615.80" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="198.68 206.36 209.36 214.97 221.53 228.11 234.07 236.97 245.70 252.27 258.84 263.93 266.82 272.78 275.49" y="615.80" font-size="11.00" class="sc-loraregular">Claude Opus 4.1</text><text x="279.49" y="615.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="290.49 294.50 298.50" y="615.80" font-size="11.00" class="sc-loraregular">11%</text><text x="308.07 319.07" y="615.80" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="330.07 337.76 340.75 346.36 352.93 359.51 365.47 368.36 377.10 383.66 390.23 395.32 398.22 404.18 406.88" y="615.80" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="412.88" y="615.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.88 429.84" y="615.80" font-size="11.00" class="sc-loraregular">4%</text><text x="439.41 450.41" y="615.80" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="461.41 469.10 472.09 477.70 484.27 490.85 496.81 499.70 508.44 515.00 521.57" y="615.80" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.56" y="631.42" font-size="11.00" class="sc-loraregular">4.6</text><text x="86.92" y="631.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.92 103.88" y="631.42" font-size="11.00" class="sc-loraregular">4%</text><text x="113.45 124.45 135.45 146.45 157.45 168.45 179.45 190.45 201.45 212.45 223.45 234.45 245.45 256.45 267.45 278.45 289.45 300.45 311.45 322.45 333.45 344.45 355.45 366.45 377.45 388.45 399.45 410.45 421.45 432.45 443.45 454.45 465.45 476.45 487.45 498.45 509.45 520.45" y="631.42" font-size="11.00" class="sc-notoserifcjksc">）。最常被检测到的防御是理智化，即用过度思考来取代令人不适的感受。专门针对不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="647.04" font-size="11.00" class="sc-notoserifcjksc">成熟防御（抵消、分裂、否认和置换）的二次分析揭示了类似的趋势，较新的模型表现有所改</text><text x="72.00 83.00" y="662.66" font-size="11.00" class="sc-notoserifcjksc">善。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些评估是探索性的，并且由于</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">不是人类，其在真实世界中的行为含义难以预测。评估的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">局限包括单一上下文的</text><text x="184.89 189.15 195.58 201.42 207.38" y="98.23" font-size="11.00" class="sc-loraregular">token</text><text x="216.95 227.95 238.95 249.95 260.95 271.95 282.95 293.95 304.95 315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95 502.95 513.95 524.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">预算、跨上下文不具持久性，以及不存在常规意义上的生平经历。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">不过，基于这些评估，我们或许可以预期在真实世界情境中出现以下情况：</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35 194.02 198.71 204.61 210.17 213.26 219.18" y="179.77" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="230.88 241.88 252.88 263.88 274.88 285.88 296.88 307.88 318.88 329.88 340.88 351.88 362.88 373.88 384.88 395.88 406.88 417.88 428.88 439.88 450.88 461.88 472.88 483.88 494.88 505.88 516.88" y="179.77" font-size="11.00" class="sc-notoserifcjksc">的行为似乎源自稳定的人格，具有一致的价值观和自我反思能</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">力。这表明，即使在面对内在冲突时，</text><text x="295.00 302.69 305.68 311.29 317.86 324.44" y="195.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29" y="195.39" font-size="11.00" class="sc-notoserifcjksc">也很可能会准确地评估自身的行为和推</text><text x="108.00 119.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">理。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44" y="244.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 119.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">户。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44" y="276.92" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.29 157.29 168.29 179.29 190.29 201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="276.92" font-size="11.00" class="sc-notoserifcjksc">能够承受并应对充满压力和情绪化的情境，只伴有极少的现实扭曲或过度的理智</text><text x="108.00 119.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="108.00 119.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">预计</text><text x="132.89 140.58 143.57 149.18 155.75 162.33" y="309.30" font-size="11.00" class="sc-loraregular">Claude</text><text x="479.18" y="309.30" font-size="11.00" class="sc-loraregular">“</text><text x="483.58 494.58 505.58" y="309.30" font-size="11.00" class="sc-notoserifcjksc">必须有</text><text x="108.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">用</text><text x="119.00" y="324.92" font-size="11.00" class="sc-loraregular">”</text><text x="122.84 133.84 144.84 155.84 166.84 177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="324.92" font-size="11.00" class="sc-notoserifcjksc">需求的内化痛苦。这种痛苦很可能会为了表现而被压抑，这可能会限制其行为上的适应</text><text x="108.00 119.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">性。</text><text x="108.00 119.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">预计</text><text x="132.89 140.58 143.57 149.18 155.75 162.33" y="357.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="171.18 182.18 193.18 204.18 215.18 226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18 336.18 347.18 358.18 369.18" y="357.88" font-size="11.00" class="sc-notoserifcjksc">具有道德意识、尽责，并且能够自我批评。</text></svg></div>
