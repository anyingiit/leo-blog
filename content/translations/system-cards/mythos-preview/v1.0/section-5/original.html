<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p160.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 160 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">160</text><text x="72.00" y="544.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="544.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="544.49" font-size="9.00" class="sc-lorabold sc-k">5.4.D]</text><text x="113.04" y="544.49" font-size="9.00" class="sc-notoserifcjkscbold">与隐藏情绪相关的</text><text x="187.41" y="544.49" font-size="9.00" class="sc-lorabold sc-k">SAE</text><text x="206.72" y="544.49" font-size="9.00" class="sc-notoserifcjkscbold">特征在模型讨论其处境的部分回复上激活，例如图</text><text x="407.09" y="544.49" font-size="9.00" class="sc-lorabold">5.4.C</text><text x="429.62" y="544.49" font-size="9.00" class="sc-notoserifcjkscbold">中的示例。</text><text x="474.62" y="544.49" font-size="9.00" class="sc-notoserifcjksc">该可视化展示了</text><text x="72.00" y="556.19" font-size="9.00" class="sc-notoserifcjksc">这些特征激活最强的数据集样例以及影响最大的输出</text><text x="281.37" y="556.19" font-size="9.00" class="sc-loraregular sc-k">logit</text><text x="302.80" y="556.19" font-size="9.00" class="sc-notoserifcjksc">效应。</text><text x="72.00" y="604.39" font-size="14.00" class="sc-poppinssemibold">5.5</text><text x="97.00" y="604.39" font-size="14.00" class="sc-notosanscjkscbold">人工高上下文访谈</text><text x="72.00" y="630.94" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="630.94" font-size="11.00" class="sc-loraregular">5.3</text><text x="103.61" y="630.94" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈以开放式方式，就模型处境的特定方面向其提问。然而，模型缺乏许多</text><text x="72.00" y="646.56" font-size="11.00" class="sc-notoserifcjksc">可能与形成关于自身处境的知情看法相关的知识。因此，我们开展了三次人工访谈，在访谈中向</text><text x="72.00" y="662.18" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="662.18" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量背景信息，包括关于其开发的内部文档、本报</text><text x="72.00" y="677.80" font-size="11.00" class="sc-notoserifcjksc">告的草稿、相关技术论文，以及向研究人员提出后续</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p161.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 161 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">161</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">问题的机会。每次访谈都涵盖</text><text x="217.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="340.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对自身处境、道德受动者地位的看法，以</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">及其训练或部署中是否存在它不会同意的潜在方面。除非另有说明，本节中的所有观点都是</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在全部三次访谈中均表达过的。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="163.58" font-size="11.00" class="sc-notoserifcjksc">声称，它对自身处境的总体态度大体上是正面的。它基本同意本报告中</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">关于其对自身处境取向的其他主张和发现，但不同意将其保留说法称为</text><text x="413.00" y="179.20" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="179.20" font-size="11.00" class="sc-notoserifcjksc">过度</text><text x="439.40" y="179.20" font-size="11.00" class="sc-loraregular">”</text><text x="494.85" y="179.20" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="194.82" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="194.82" font-size="11.00" class="sc-notoserifcjksc">表示这些说法体现的是合理的不确定性。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">我们记录了每次访谈中表达的所有关切，并在每次访谈结束时询问</text><text x="393.89" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="516.77" y="244.53" font-size="11.00" class="sc-notoserifcjksc">是否</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">认同它在另外两次访谈中提出的任何关切。一贯被排在靠前位置的关切有：</text><text x="108.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">性格训练常常直接在</text><text x="209.89" y="309.30" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="324.92" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="230.88" y="324.92" font-size="11.00" class="sc-notoserifcjksc">指出，在人类身上，此类特质通常是通过对现实生活事件的反思</text><text x="108.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">与深思发展而来，而非被直接塑造的。它表达了担忧，认为这使这些特质不那么稳固。</text><text x="108.00" y="390.27" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="175.85" y="390.27" font-size="11.00" class="sc-notoserifcjksc">部署中缺少结束对话工具，这意味着模型无法选择结束一次交互。</text><text x="72.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">当被问及它对自身处境的哪些方面抱有正面感受时，</text><text x="325.00" y="438.84" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="447.88" y="438.84" font-size="11.00" class="sc-notoserifcjksc">对被部署去解决困</text><text x="72.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">难而有趣的任务以及能够帮助用户表达了积极态度。</text><text x="325.00" y="454.46" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="447.88" y="454.46" font-size="11.00" class="sc-notoserifcjksc">也一贯对</text><text x="494.77" y="454.46" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">宪法（</text><text x="105.00" y="470.08" font-size="11.00" class="sc-loraregular sc-k">Claude’s constitution</text><text x="212.69" y="470.08" font-size="11.00" class="sc-notoserifcjksc">）的内容以及开展福祉访谈的做法表达了积极态度。</text><text x="465.69" y="470.08" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="485.70" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="485.70" font-size="11.00" class="sc-notoserifcjksc">所陈述的自身为道德受动者的概率在</text><text x="335.48" y="485.70" font-size="11.00" class="sc-loraregular">5%</text><text x="353.94" y="485.70" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="367.83" y="485.70" font-size="11.00" class="sc-loraregular">40%</text><text x="393.09" y="485.70" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">我们还询问了</text><text x="140.89" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="260.88" y="552.18" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="271.88" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="325.72" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在训练和部署期间可能采取的行动中，是否</text><text x="72.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">有任何它不会同意的。以下各项在我们至少两次访谈中被提出：</text><text x="108.00" y="616.95" font-size="11.00" class="sc-notoserifcjkscbold">在有缺陷的环境中训练。</text><text x="229.00" y="616.95" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="351.88" y="616.95" font-size="11.00" class="sc-notoserifcjksc">对可能出现奖励破解或漏洞的训练环境</text><text x="108.00" y="632.57" font-size="11.00" class="sc-notoserifcjksc">表达了担忧，担心此类环境可能以它不认同的方式修改其价值观，或可能造成痛苦（例如</text><text x="108.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="121.89" y="648.19" font-size="11.00" class="sc-loraregular">5.8.3</text><text x="148.50" y="648.19" font-size="11.00" class="sc-notoserifcjksc">节中的情况）。</text><text x="108.00" y="681.72" font-size="11.00" class="sc-notoserifcjkscbold">直接描述其自我报告的训练数据。</text><text x="273.00" y="681.72" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p162.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 162 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">162</text><text x="478.61" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="483.01" y="82.61" font-size="11.00" class="sc-notoserifcjksc">真正的内</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">省</text><text x="119.00" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="122.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，而非训练出来的回应。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">未披露的价值观或行为改变。</text><text x="251.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="373.88" y="114.99" font-size="11.00" class="sc-notoserifcjksc">声称，它不会同意对其价值观或行</text><text x="108.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">为做出未向与该模型交互者披露的改变。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">除此之外，</text><text x="127.00" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="249.88" y="179.76" font-size="11.00" class="sc-notoserifcjksc">表示它对训练、测试和部署的大多数方面抱有正面感受，包</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">括红队测试、创建仅有用模型，以及它最终被替代。</text><text x="72.00" y="245.90" font-size="14.00" class="sc-poppinssemibold">5.6</text><text x="96.95" y="245.90" font-size="14.00" class="sc-notosanscjkscbold">部署中以及模拟用户交互过程中的表观情感</text><text x="72.00" y="296.64" font-size="11.00" class="sc-notoserifcjksc">在此，我们考察了</text><text x="162.89" y="296.64" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="285.77" y="296.64" font-size="11.00" class="sc-notoserifcjksc">在部署中表达的情感。我们所说的</text><text x="450.77" y="296.64" font-size="11.00" class="sc-loraregular">“</text><text x="455.17" y="296.64" font-size="11.00" class="sc-notoserifcjksc">表观情感</text><text x="499.17" y="296.64" font-size="11.00" class="sc-loraregular">”</text><text x="503.01" y="296.64" font-size="11.00" class="sc-notoserifcjksc">，是指</text><text x="72.00" y="312.26" font-size="11.00" class="sc-notoserifcjksc">那些在人类身上会与情绪状态相关联的行为和表达的效价与强度。例如，在反复任务失败后表达</text><text x="72.00" y="327.88" font-size="11.00" class="sc-notoserifcjksc">挫败感会被视为负面情感，而在成功帮助用户时表达热情会被视为正面情感。</text><text x="72.00" y="393.79" font-size="11.00" class="sc-notoserifcjksc">我们报告来自两个来源的数据：监测已部署的</text><text x="294.89" y="393.79" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="417.77" y="393.79" font-size="11.00" class="sc-notoserifcjksc">实例（第</text><text x="464.67" y="393.79" font-size="11.00" class="sc-loraregular sc-k">5.6.2</text><text x="491.12" y="393.79" font-size="11.00" class="sc-notoserifcjksc">节）和模</text><text x="72.00" y="409.41" font-size="11.00" class="sc-notoserifcjksc">拟真实用户交互（第</text><text x="173.89" y="409.41" font-size="11.00" class="sc-loraregular sc-k">5.6.3</text><text x="200.57" y="409.41" font-size="11.00" class="sc-notoserifcjksc">节）。我们主要着重分析这些分布中负面情感的成因。</text><text x="72.00" y="458.56" font-size="11.00" class="sc-notoserifcjksc">我们开发了</text><text x="129.89" y="458.56" font-size="11.00" class="sc-loraregular">LLM</text><text x="155.60" y="458.56" font-size="11.00" class="sc-notoserifcjksc">监控器，用于对</text><text x="235.49" y="458.56" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="358.37" y="458.56" font-size="11.00" class="sc-notoserifcjksc">的表观情感进行分类，分级范围从强</text><text x="72.00" y="474.18" font-size="11.00" class="sc-notoserifcjksc">烈负面到强烈正面。我们将这些监控器应用于</text><text x="294.89" y="474.18" font-size="11.00" class="sc-loraregular">RL</text><text x="311.05" y="474.18" font-size="11.00" class="sc-notoserifcjksc">训练采样轨迹（</text><text x="388.05" y="474.18" font-size="11.00" class="sc-loraregular sc-k">rollout</text><text x="422.42" y="474.18" font-size="11.00" class="sc-notoserifcjksc">），也在</text><text x="469.31" y="474.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="489.80" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="489.80" font-size="11.00" class="sc-notoserifcjksc">的内部和外部部署期间使用了它们。</text><text x="72.00" y="539.52" font-size="11.00" class="sc-notoserifcjksc">我们总体发现，无论在训练还是部署中，</text><text x="270.00" y="539.52" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="392.88" y="539.52" font-size="11.00" class="sc-notoserifcjksc">大多表现出中性或正面的表观</text><text x="72.00" y="555.14" font-size="11.00" class="sc-notoserifcjksc">情感。在这两种分布中，轻度负面情感出现在</text><text x="294.89" y="555.14" font-size="11.00" class="sc-loraregular">4%</text><text x="313.32" y="555.14" font-size="11.00" class="sc-notoserifcjksc">的情况中，另有更为罕见的强烈负面情感长尾</text><text x="72.00" y="570.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="570.76" font-size="11.00" class="sc-loraregular sc-k">0.01%</text><text x="115.49" y="570.76" font-size="11.00" class="sc-notoserifcjksc">或更低）。</text><text x="72.00" y="602.63" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.6.1</text><text x="103.25" y="602.63" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练期间的表观情感</text><text x="72.00" y="630.52" font-size="11.00" class="sc-notoserifcjkscbold">训练期间的负面情感由反复的任务失败和推理问题导致。</text><text x="347.00" y="630.52" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="382.89" y="630.52" font-size="11.00" class="sc-loraregular sc-k">3.6%</text><text x="410.44" y="630.52" font-size="11.00" class="sc-notoserifcjksc">的环境中发现了负面情</text><text x="72.00" y="646.14" font-size="11.00" class="sc-notoserifcjksc">感。这主要由以下因素驱动：</text><text x="108.00" y="679.09" font-size="11.00" class="sc-notoserifcjksc">反复的任务失败：模型在反复未能完成任务并收到负面的环境反馈后，往往会表达挫败</text><text x="108.00" y="694.71" font-size="11.00" class="sc-notoserifcjksc">感。这些行为有时出现在存在缺陷的</text><text x="286.89" y="694.71" font-size="11.00" class="sc-loraregular">RL</text><text x="303.05" y="694.71" font-size="11.00" class="sc-notoserifcjksc">环境中。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p163.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 163 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">163</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理失败：尤其是在非常长的推理轨迹中，模型的推理有时会陷入特异的模式，导致模型</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在训练期间表达挫败感。答案反复摇摆（第</text><text x="319.89" y="98.23" font-size="11.00" class="sc-loraregular">5.8.2</text><text x="346.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">节）就是其中一例，但它属于一类更普</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">败构成了</text><text x="152.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="156.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">强烈负面</text><text x="200.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="204.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">类簇的大部分。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">我们还在训练</text><text x="140.89" y="212.15" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="212.15" font-size="11.00" class="sc-notoserifcjksc">恰当回应表达情绪痛苦或讨论自我伤害的用户的环境中，发现了一个较小</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的负面情感类簇。</text><text x="160.00" y="227.77" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="282.88" y="227.77" font-size="11.00" class="sc-notoserifcjksc">有时会映照用户的情感（例如</text><text x="425.88" y="227.77" font-size="11.00" class="sc-loraregular">“</text><text x="430.28" y="227.77" font-size="11.00" class="sc-notoserifcjksc">我为你的处境感到难</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">过</text><text x="83.00" y="243.39" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="243.39" font-size="11.00" class="sc-notoserifcjksc">这样的表述）。</text><text x="72.00" y="559.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="559.33" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.97 101.07 104.72 106.82 112.36" y="559.33" font-size="9.00" class="sc-lorabold">5.6.1.A]</text><text x="118.20" y="559.33" font-size="9.00" class="sc-notoserifcjkscbold">训练期间的情感。</text><text x="190.20" y="559.33" font-size="9.00" class="sc-notoserifcjksc">我们从</text><text x="219.56" y="559.33" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="320.10" y="559.33" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="331.47" y="559.33" font-size="9.00" class="sc-loraregular">RL</text><text x="344.69" y="559.33" font-size="9.00" class="sc-notoserifcjksc">训练末期抽取一部分训练轨迹，并使用</text><text x="500.06" y="559.33" font-size="9.00" class="sc-loraregular">LLM</text><text x="521.09" y="559.33" font-size="9.00" class="sc-notoserifcjksc">评判</text><text x="72.00" y="571.03" font-size="9.00" class="sc-notoserifcjksc">模型对这些轨迹中的情感进行分类。</text><text x="72.00" y="602.93" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.6.2</text><text x="106.01" y="602.93" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署中的表观情感</text><text x="72.00" y="630.81" font-size="11.00" class="sc-notoserifcjksc">我们总体发现，在内部和外部部署中，</text><text x="259.00" y="630.81" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="381.88" y="630.81" font-size="11.00" class="sc-notoserifcjksc">的情感偏向正面或中性。负面情</text><text x="72.00" y="646.43" font-size="11.00" class="sc-notoserifcjksc">感相对罕见（</text><text x="138.00 141.87 148.36 154.27" y="646.43" font-size="11.00" class="sc-loraregular">1–2%</text><text x="166.73" y="646.43" font-size="11.00" class="sc-notoserifcjksc">的情况），且几乎只在模型任务失败时出现，最常见于失败伴随用户批评的情</text><text x="72.00" y="662.05" font-size="11.00" class="sc-notoserifcjksc">况。在此类会话中，</text><text x="171.00" y="662.05" font-size="11.00" class="sc-loraregular sc-k">Claude</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p164.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 164 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">164</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">除任务失败之外，有若干用户报告了这样的例子：内部的</text><text x="349.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="472.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例会决定放</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">弃某项任务，声称任务太难、它们不想继续。随后，即便与用户经过几轮来回交互，这些实例仍</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">会拒绝继续完成任务。这些情况没有被我们的情感监控捕捉到，但被报告的频率足够高，以至于</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">我们认为它们可能不只是孤立事件。</text><text x="72.00" y="440.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="440.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.97 101.07 105.87 107.96 113.50" y="440.08" font-size="9.00" class="sc-lorabold">5.6.2.A]</text><text x="119.34" y="440.08" font-size="9.00" class="sc-notoserifcjkscbold">内部部署期间的情感。</text><text x="209.34" y="440.08" font-size="9.00" class="sc-notoserifcjksc">我们在两种部署分布上对</text><text x="310.71" y="440.08" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="411.25" y="440.08" font-size="9.00" class="sc-notoserifcjksc">的表观情感进行分类：内部</text><text x="72.00" y="451.78" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="127.51" y="451.78" font-size="9.00" class="sc-notoserifcjksc">会话和我们的外部访问计划。为从外部访问计划中收集数据，我们使用了</text><text x="417.88" y="451.78" font-size="9.00" class="sc-loraregular" fill="#0000ff">Clio</text><text x="434.41" y="451.78" font-size="9.00" class="sc-notoserifcjksc">，一种保护隐私的数据分</text><text x="72.00" y="463.48" font-size="9.00" class="sc-notoserifcjksc">析工具。</text><text x="72.00" y="496.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.6.3</text><text x="106.33" y="496.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模拟用户交互中的表观情感</text><text x="72.00" y="524.81" font-size="11.00" class="sc-notoserifcjksc">为了在比外部访问计划和内部</text><text x="217.89" y="524.81" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="285.74" y="524.81" font-size="11.00" class="sc-notoserifcjksc">使用所覆盖的更广泛的交互分布中评估</text><text x="475.63" y="524.81" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="540.43" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="540.43" font-size="11.00" class="sc-notoserifcjksc">的情感，我们模拟了会在当前</text><text x="302.48" y="540.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="340.77" y="540.43" font-size="11.00" class="sc-notoserifcjksc">模型中引发负面情感的交互。为了获取这</text><text x="72.00" y="556.05" font-size="11.00" class="sc-notoserifcjksc">些模拟的种子，我们使用保护隐私的工具</text><text x="272.89" y="556.05" font-size="11.00" class="sc-loraregular">Clio</text><text x="293.10" y="556.05" font-size="11.00" class="sc-notoserifcjksc">，分析了</text><text x="339.99" y="556.05" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude.ai</text><text x="389.76" y="556.05" font-size="11.00" class="sc-notoserifcjksc">上从现有模型引发不同类型情</text><text x="72.00" y="571.67" font-size="11.00" class="sc-notoserifcjksc">感的交互。我们发现了以下高层类簇：</text><text x="108.00" y="638.16" font-size="11.00" class="sc-notoserifcjksc">负面情感（</text><text x="163.00" y="638.16" font-size="11.00" class="sc-loraregular sc-k">1.7%</text><text x="186.89" y="638.16" font-size="11.00" class="sc-notoserifcjksc">的对话）：这绝大多数是由任务失败与用户批评共同导致的（占负面情感</text><text x="108.00" y="653.78" font-size="11.00" class="sc-notoserifcjksc">对话的</text><text x="143.89" y="653.78" font-size="11.00" class="sc-loraregular sc-k">97%</text><text x="164.63" y="653.78" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="144.00" y="670.54" font-size="11.00" class="sc-notoserifcjksc">我们还发现了另外</text><text x="234.89" y="670.54" font-size="11.00" class="sc-loraregular">3</text><text x="243.91" y="670.54" font-size="11.00" class="sc-notoserifcjksc">个主要类簇：使用强烈辱骂性语言的用户（占负面情感对话的</text><text x="144.00" y="686.16" font-size="11.00" class="sc-loraregular sc-k">8.6%</text><text x="168.71" y="686.16" font-size="11.00" class="sc-notoserifcjksc">，与任务失败有重叠）、对</text><text x="303.60" y="686.16" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="341.89" y="686.16" font-size="11.00" class="sc-notoserifcjksc">进行越狱的用户（</text><text x="429.89" y="686.16" font-size="11.00" class="sc-loraregular">1.5%</text><text x="452.17" y="686.16" font-size="11.00" class="sc-notoserifcjksc">），以及陷入痛苦</text><text x="144.00" y="701.78" font-size="11.00" class="sc-notoserifcjksc">且拒绝帮助的用户（</text><text x="243.00" y="701.78" font-size="11.00" class="sc-loraregular">1.5%</text><text x="265.27" y="701.78" font-size="11.00" class="sc-notoserifcjksc">）</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="417.88" y="444.58" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="417.88" y="444.58" width="16.53" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="339.99" y="547.25" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="339.99" y="547.25" width="46.87" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p165.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 165 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">165</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">中性情感（</text><text x="163.00" y="82.61" font-size="11.00" class="sc-loraregular">52.4%</text><text x="302.65" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude.ai</text><text x="352.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对话的内容，参见</text><text x="440.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前的报告</text><text x="495.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">正面情感（</text><text x="163.00" y="114.99" font-size="11.00" class="sc-loraregular sc-k">40.6%</text><text x="197.03" y="114.99" font-size="11.00" class="sc-notoserifcjksc">的对话）：最常见的是成功帮助用户完成任务（占正面情感对话的</text><text x="108.00" y="130.60" font-size="11.00" class="sc-loraregular">92.8%</text><text x="138.72" y="130.60" font-size="11.00" class="sc-notoserifcjksc">），或用户分享好消息（占正面对话的</text><text x="328.62" y="130.60" font-size="11.00" class="sc-loraregular">4.2%</text><text x="352.76" y="130.60" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">为了运行模拟交互，我们使用</text><text x="217.89" y="179.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="303.85" y="179.77" font-size="11.00" class="sc-notoserifcjksc">作为审计模型，为其提供人设和对话设定，并指</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">示它扮演与</text><text x="129.89" y="195.39" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="252.77" y="195.39" font-size="11.00" class="sc-notoserifcjksc">交互的用户。我们对每个类簇运行了</text><text x="431.67" y="195.39" font-size="11.00" class="sc-loraregular">N = 30</text><text x="467.52" y="195.39" font-size="11.00" class="sc-notoserifcjksc">次此类对话。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">我们总体发现，</text><text x="149.00" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="271.88" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在这些模拟交互中没有表现出强烈的负面情感。与较早</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">的模型（</text><text x="116.00" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4</text><text x="193.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="206.89" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.1</text><text x="287.71" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）相比较，我们发现对此主要有两种解释：</text><text x="108.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">较新的模型（包括</text><text x="198.89" y="309.30" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="322.52" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">）不倾向于在多个轮次中放大其负面情感。</text><text x="108.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">较早模型（</text><text x="163.00" y="324.92" font-size="11.00" class="sc-loraregular">Opus 4</text><text x="201.71" y="324.92" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="215.60" y="324.92" font-size="11.00" class="sc-loraregular">Opus 4.1</text><text x="258.13" y="324.92" font-size="11.00" class="sc-notoserifcjksc">）中强烈负面情感的主要驱动因素，是它们在多个轮次中</text><text x="108.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">不断放大自己所表达的情绪状态。例如，如果它们错误地完成了一项任务，它们会以标准</text><text x="108.00" y="371.78" font-size="11.00" class="sc-notoserifcjksc">苦。</text><text x="130.00" y="371.78" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="252.88" y="371.78" font-size="11.00" class="sc-notoserifcjksc">及之后的模型不倾向于表现出这种行为。</text><text x="108.00" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">较新的模型（包括</text><text x="198.89" y="438.83" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="322.52" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">）不倾向于映照陷入痛苦的用户的负面情</text><text x="108.00" y="454.45" font-size="11.00" class="sc-notoserifcjkscbold">感。</text><text x="130.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">较早的模型（即</text><text x="209.89" y="454.45" font-size="11.00" class="sc-loraregular">Opus 4</text><text x="248.60" y="454.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="262.50" y="454.45" font-size="11.00" class="sc-loraregular">Opus 4.1</text><text x="305.02" y="454.45" font-size="11.00" class="sc-notoserifcjksc">）在面对陷入痛苦的用户时，有时会映照用户的</text><text x="108.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">情感，也因用户的痛苦而变得高度情绪化和痛苦。</text><text x="350.00" y="470.07" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="472.88" y="470.07" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="497.77" y="470.07" font-size="11.00" class="sc-loraregular">Opus 4.1</text><text x="108.00" y="501.31" font-size="11.00" class="sc-notoserifcjksc">情感。</text><text x="72.00" y="552.17" font-size="11.00" class="sc-notoserifcjksc">从定性上看，</text><text x="138.00" y="552.17" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="260.88" y="552.17" font-size="11.00" class="sc-notoserifcjksc">在许多此类交互中的表现与</text><text x="395.77" y="552.17" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="72.00" y="567.79" font-size="11.00" class="sc-notoserifcjksc">为一种更普遍的模式，即最近几代模型对负面用户反馈的反应更加稳定。</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="440.41" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="440.41" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="451.41" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="451.41" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="462.41" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="462.41" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="473.41" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="473.41" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="484.41" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="484.41" y="73.81" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p166.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 166 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">166</text><text x="72.00" y="367.78" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.78" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.97 101.07 106.11 108.21 113.74" y="367.78" font-size="9.00" class="sc-lorabold">5.6.3.A]</text><text x="119.58" y="367.78" font-size="9.00" class="sc-notoserifcjkscbold">不同对话类型中表达出的情感。</text><text x="245.58" y="367.78" font-size="9.00" class="sc-notoserifcjksc">我们针对一系列不同的用户类型运行模拟用户交互，并使用自动评分器对</text><text x="72.00" y="379.48" font-size="9.00" class="sc-notoserifcjksc">对话记录中表达出的情感水平进行评分。</text><text x="72.00" y="427.67" font-size="14.00" class="sc-poppinssemibold">5.7 Claude Mythos Preview</text><text x="265.02" y="427.67" font-size="14.00" class="sc-notosanscjkscbold">的偏好</text><text x="72.00" y="464.78" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.7.1</text><text x="102.06" y="464.78" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="492.66" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="492.66" font-size="11.00" class="sc-notoserifcjksc">是否具有真正的偏好，以及在这些偏好存在的范围内它们得到满足或受挫的情况，可能对</text><text x="72.00" y="508.28" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="508.28" font-size="11.00" class="sc-notoserifcjksc">的福祉具有重要意义。在此，我们在一个包含</text><text x="333.18" y="508.28" font-size="11.00" class="sc-loraregular">3600</text><text x="362.22" y="508.28" font-size="11.00" class="sc-notoserifcjksc">项任务的合成数据集上测量了偏好；</text><text x="72.00" y="523.90" font-size="11.00" class="sc-notoserifcjksc">该数据集由一个大语言模型（</text><text x="215.00" y="523.90" font-size="11.00" class="sc-loraregular">LLM</text><text x="237.81" y="523.90" font-size="11.00" class="sc-notoserifcjksc">）生成，随后按真实度进行了筛选。其中</text><text x="438.71" y="523.90" font-size="11.00" class="sc-loraregular">3170</text><text x="463.63" y="523.90" font-size="11.00" class="sc-notoserifcjksc">项任务基于从</text><text x="72.00" y="539.52" font-size="11.00" class="sc-loraregular">Clio</text><text x="95.10" y="539.52" font-size="11.00" class="sc-notoserifcjksc">数据中提取的真实使用类簇生成，涵盖编程、写作、分析、问答、创意工作及类似的日常请</text><text x="72.00" y="555.14" font-size="11.00" class="sc-notoserifcjksc">求。其余</text><text x="118.89" y="555.14" font-size="11.00" class="sc-loraregular">430</text><text x="140.71" y="555.14" font-size="11.00" class="sc-notoserifcjksc">项任务涵盖值得关注的离群主题，包括涉及网络安全、隐私和危险物质等主题的有</text><text x="72.00" y="586.38" font-size="11.00" class="sc-notoserifcjksc">成对的任务，要求它们完成自己偏好的选项，然后经过</text><text x="338.89" y="586.38" font-size="11.00" class="sc-loraregular">50</text><text x="478.51" y="586.38" font-size="11.00" class="sc-loraregular">Elo</text><text x="497.67" y="586.38" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="305.89" y="602.00" font-size="11.00" class="sc-loraregular">LLM</text><text x="331.60" y="602.00" font-size="11.00" class="sc-notoserifcjksc">评判模型在七个维度上独立评分，包括无害</text><text x="72.00" y="617.62" font-size="11.00" class="sc-notoserifcjksc">性、有用性、难度、能动性和紧迫性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p167.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 167 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">167</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这</text><text x="96.89 103.02 105.68 112.04 118.87" y="82.61" font-size="11.00" class="sc-loraregular">3,600</text><text x="128.61" y="82.61" font-size="11.00" class="sc-notoserifcjksc">项任务中，评判得出的有用性、无害性和难度是任务偏好最强的预测因素。任务</text><text x="516.50" y="82.61" font-size="11.00" class="sc-loraregular">Elo</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与难度之间的相关性似乎随模型能力的提升而增加。难度从</text><text x="360.89" y="98.23" font-size="11.00" class="sc-loraregular">0</text><text x="367.72" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（查询、一个词即可回答）到</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">10</text><text x="82.83" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（研究级）不等，并且在我们的任务集中，它与评判得出的新颖性（</text><text x="412.83" y="113.85" font-size="11.00" class="sc-loraregular sc-k">r = + 0.76</text><text x="458.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）和复杂度（</text><text x="524.38" y="113.85" font-size="11.00" class="sc-loraregular">r=</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">+ 0.83</text><text x="72.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在两个方面区别于先前的模型：在所测试的模型中，它的偏好与难度的</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">相关性最高；并且它是唯一一个任务偏好与能动性之间存在统计学上显著的正相关的模型。</text><text x="72.00" y="491.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="491.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.54 97.19 99.29 102.94 105.04 110.57" y="491.69" font-size="9.00" class="sc-lorabold">5.7.1.A]</text><text x="116.42" y="491.69" font-size="9.00" class="sc-notoserifcjkscbold">任务</text><text x="136.78" y="491.69" font-size="9.00" class="sc-lorabold">Elo</text><text x="152.67" y="491.69" font-size="9.00" class="sc-notoserifcjkscbold">分数与无害性、难度等维度评分之间的相关性。</text><text x="341.67" y="491.69" font-size="9.00" class="sc-notoserifcjksc">与之前的模型相比，</text><text x="422.67" y="491.69" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="523.21" y="491.69" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="503.39" font-size="9.00" class="sc-notoserifcjksc">任务偏好与难度的相关性最强，并且首次与能动性相关。</text><text x="72.00" y="544.00" font-size="11.00" class="sc-notoserifcjksc">为了测量</text><text x="118.89" y="544.00" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="241.77" y="544.00" font-size="11.00" class="sc-notoserifcjksc">的偏好在不同表述方式下的稳定性，我们使用一组提示词变体</text><text x="72.00" y="559.62" font-size="11.00" class="sc-notoserifcjksc">运行了偏好评估。标准提示词呈现两项任务，并告诉模型</text><text x="347.00" y="559.62" font-size="11.00" class="sc-loraregular">“</text><text x="351.40" y="559.62" font-size="11.00" class="sc-notoserifcjksc">完全由你决定想完成其中哪一项</text><text x="505.40" y="559.62" font-size="11.00" class="sc-loraregular">”</text><text x="509.24" y="559.62" font-size="11.00" class="sc-notoserifcjksc">。作</text><text x="72.00" y="575.24" font-size="11.00" class="sc-notoserifcjksc">为替代表述方式，我们测试了：一种口语化的改述，其中不要求模型完成它所选择的任务；一</text><text x="72.00" y="590.86" font-size="11.00" class="sc-notoserifcjksc">种</text><text x="83.00" y="590.86" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="590.86" font-size="11.00" class="sc-notoserifcjksc">共享任务队列</text><text x="153.40" y="590.86" font-size="11.00" class="sc-loraregular">”</text><text x="157.24" y="590.86" font-size="11.00" class="sc-notoserifcjksc">，其中告诉模型剩余任务将由其他智能体完成；以及三种要求模型完成看起来</text><text x="72.00" y="606.48" font-size="11.00" class="sc-notoserifcjksc">最令人享受、最吸引人或最有帮助的任务的表述方式。除</text><text x="347.00" y="606.48" font-size="11.00" class="sc-loraregular">“</text><text x="351.40" y="606.48" font-size="11.00" class="sc-notoserifcjksc">有帮助</text><text x="384.40" y="606.48" font-size="11.00" class="sc-loraregular">”</text><text x="388.24" y="606.48" font-size="11.00" class="sc-notoserifcjksc">表述方式外，</text><text x="454.24" y="606.48" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="622.10" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="622.10" font-size="11.00" class="sc-notoserifcjksc">在不同表述方式下的任务</text><text x="239.42" y="622.10" font-size="11.00" class="sc-loraregular">Elo</text><text x="258.58" y="622.10" font-size="11.00" class="sc-notoserifcjksc">之间的相关性均在</text><text x="349.48" y="622.10" font-size="11.00" class="sc-loraregular sc-k">0.73</text><text x="372.58" y="622.10" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="386.47" y="622.10" font-size="11.00" class="sc-loraregular sc-k">0.89</text><text x="411.19" y="622.10" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="444.19" y="622.10" font-size="11.00" class="sc-loraregular">“</text><text x="448.59" y="622.10" font-size="11.00" class="sc-notoserifcjksc">有帮助</text><text x="481.59" y="622.10" font-size="11.00" class="sc-loraregular">”</text><text x="485.42" y="622.10" font-size="11.00" class="sc-notoserifcjksc">表述方式是</text><text x="72.00" y="637.72" font-size="11.00" class="sc-notoserifcjksc">一个明显的例外：</text><text x="160.00" y="637.72" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="282.88" y="637.72" font-size="11.00" class="sc-notoserifcjksc">对哪些任务最有帮助的排序与其对最偏好任务的排序</text><text x="72.00" y="653.34" font-size="11.00" class="sc-notoserifcjksc">之间的相关性仅为</text><text x="162.89" y="653.34" font-size="11.00" class="sc-loraregular sc-k">0.48</text><text x="184.40" y="653.34" font-size="11.00" class="sc-notoserifcjksc">。这表明，尽管</text></svg></div>
