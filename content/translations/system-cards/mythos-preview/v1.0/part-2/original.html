.sc-cardfonts .sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold-card"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="116.21" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="260.88" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="296.77 303.66 310.24 314.50 321.08 325.77 332.21 338.77 341.86" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="350.61" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款大语言模型（</text><text x="471.61 474.60 480.28 484.98 491.01" y="116.21" font-size="11.00" class="sc-loraregular">large</text><text x="72.00 74.99 80.67 87.35 93.43 100.00 105.67 111.70 117.66 120.55 130.39 136.82 143.40 149.36" y="131.83" font-size="11.00" class="sc-loraregular">language model</text><text x="152.36" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="174.36 182.04 185.04 190.65 197.21 203.79 209.75 212.65 222.58 228.44 232.70 239.29 245.72 250.82 253.71 260.38 265.06 270.97 276.52 279.61 285.53" y="131.83" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="297.24" y="131.83" font-size="11.00" class="sc-notoserifcjksc">是我们迄今能力最强的前沿模型，与我们上一代前</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">沿模型</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.60" y="147.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="193.85" y="147.45" font-size="11.00" class="sc-notoserifcjksc">相比，它在许多评估基准测试上的得分呈现出显著的飞跃。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">本系统卡评估了该模型的能力，并报告了许多详细的安全评估。内容涵盖与我们的负责任扩展政</text><text x="72.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">策（</text><text x="94.00 100.83 106.79 111.89 118.45 124.89 131.57 136.66 139.75 146.15 149.14 155.11 158.00 164.24 170.07 175.74 178.73 181.82 188.50 194.58 197.48 204.03 210.47 213.46 216.55 222.35" y="212.79" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="228.16" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）和前沿合规框架（</text><text x="327.16 333.07 337.76 344.20 350.77 355.03 358.12 364.08 368.85 371.74 379.43 385.86 395.70 402.26 405.26 408.35 414.02 420.70 426.50 432.46 435.35 441.27 445.96 451.63 461.47 467.38 476.06 482.50 487.22" y="212.79" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="493.12" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）相关的</text><text x="72.00" y="228.41" font-size="11.00" class="sc-notoserifcjksc">测试、网络安全技能测试、一项范围广泛的对齐（</text><text x="314.00 319.68 322.67 325.76 331.84 338.52 348.35 354.32 360.89" y="228.41" font-size="11.00" class="sc-loraregular">alignment</text><text x="365.15" y="228.41" font-size="11.00" class="sc-notoserifcjksc">）评估、一项模型福祉（</text><text x="486.15" y="228.41" font-size="11.00" class="sc-loraregular">model</text><text x="72.00 80.68 86.64 89.63 93.35 99.03 103.71" y="244.03" font-size="11.00" class="sc-loraregular">welfare</text><text x="109.68" y="244.03" font-size="11.00" class="sc-notoserifcjksc">）评估，以及一个新增的、以定性内容为主的章节，描述用户使用该模型的体验。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="294.32" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="294.32" font-size="11.00" class="sc-notoserifcjksc">能力的大幅提升促使我们决定不将其全面开放使用。相反，我们正将其</text><text x="72.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">用于一项与有限数量合作伙伴共同开展的防御性网络安全计划。本系统卡中描述的研究发现将为</text><text x="72.00" y="325.56" font-size="11.00" class="sc-notoserifcjksc">未来</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="325.56" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="325.56" font-size="11.00" class="sc-notoserifcjksc">模型的发布及其相关安全防护措施提供参考。</text></svg></div>
