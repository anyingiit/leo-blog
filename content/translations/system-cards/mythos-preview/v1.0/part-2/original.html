.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="260.88" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="296.77" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="350.61" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款大语言模型（</text><text x="471.61" y="116.21" font-size="11.00" class="sc-loraregular sc-k">large</text><text x="72.00" y="131.83" font-size="11.00" class="sc-loraregular sc-k">language model</text><text x="152.36" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="174.36" y="131.83" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="297.24" y="131.83" font-size="11.00" class="sc-notoserifcjksc">是我们迄今能力最强的前沿模型，与我们上一代前</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">沿模型</text><text x="107.89" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="193.85" y="147.45" font-size="11.00" class="sc-notoserifcjksc">相比，它在许多评估基准测试上的得分呈现出显著的飞跃。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">本系统卡评估了该模型的能力，并报告了许多详细的安全评估。内容涵盖与我们的负责任扩展政</text><text x="72.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">策（</text><text x="94.00" y="212.79" font-size="11.00" class="sc-loraregular sc-k">Responsible Scaling Policy</text><text x="228.16" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）和前沿合规框架（</text><text x="327.16" y="212.79" font-size="11.00" class="sc-loraregular sc-k">Frontier Compliance Framework</text><text x="493.12" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）相关的</text><text x="72.00" y="228.41" font-size="11.00" class="sc-notoserifcjksc">测试、网络安全技能测试、一项范围广泛的对齐（</text><text x="314.00" y="228.41" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="365.15" y="228.41" font-size="11.00" class="sc-notoserifcjksc">）评估、一项模型福祉（</text><text x="486.15" y="228.41" font-size="11.00" class="sc-loraregular">model</text><text x="72.00" y="244.03" font-size="11.00" class="sc-loraregular sc-k">welfare</text><text x="109.68" y="244.03" font-size="11.00" class="sc-notoserifcjksc">）评估，以及一个新增的、以定性内容为主的章节，描述用户使用该模型的体验。</text><text x="72.00" y="294.32" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="194.88" y="294.32" font-size="11.00" class="sc-notoserifcjksc">能力的大幅提升促使我们决定不将其全面开放使用。相反，我们正将其</text><text x="72.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">用于一项与有限数量合作伙伴共同开展的防御性网络安全计划。本系统卡中描述的研究发现将为</text><text x="72.00" y="325.56" font-size="11.00" class="sc-notoserifcjksc">未来</text><text x="96.89" y="325.56" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="325.56" font-size="11.00" class="sc-notoserifcjksc">模型的发布及其相关安全防护措施提供参考。</text></svg></div>
