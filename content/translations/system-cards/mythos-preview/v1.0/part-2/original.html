ize="11.00" class="sc-notoserifcjksc">是我们迄今能力最强的前沿模型，与我们上一代前</text><text x="72.00 83.00 94.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">沿模型</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.60" y="147.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="193.85 204.85 215.85 226.85 237.85 248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85" y="147.45" font-size="11.00" class="sc-notoserifcjksc">相比，它在许多评估基准测试上的得分呈现出显著的飞跃。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">本系统卡评估了该模型的能力，并报告了许多详细的安全评估。内容涵盖与我们的负责任扩展政</text><text x="72.00 83.00" y="212.79" font-size="11.00" class="sc-notoserifcjksc">策（</text><text x="94.00 100.83 106.79 111.89 118.45 124.89 131.57 136.66 139.75 146.15 149.14 155.11 158.00 164.24 170.07 175.74 178.73 181.82 188.50 194.58 197.48 204.03 210.47 213.46 216.55 222.35" y="212.79" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="228.16 239.16 250.16 261.16 272.16 283.16 294.16 305.16 316.16" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）和前沿合规框架（</text><text x="327.16 333.07 337.76 344.20 350.77 355.03 358.12 364.08 368.85 371.74 379.43 385.86 395.70 402.26 405.26 408.35 414.02 420.70 426.50 432.46 435.35 441.27 445.96 451.63 461.47 467.38 476.06 482.50 487.22" y="212.79" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="493.12 504.12 515.12 526.12" y="212.79" font-size="11.00" class="sc-notoserifcjksc">）相关的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="228.41" font-size="11.00" class="sc-notoserifcjksc">测试、网络安全技能测试、一项范围广泛的对齐（</text><text x="314.00 319.68 322.67 325.76 331.84 338.52 348.35 354.32 360.89" y="228.41" font-size="11.00" class="sc-loraregular">alignment</text><text x="365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15" y="228.41" font-size="11.00" class="sc-notoserifcjksc">）评估、一项模型福祉（</text><text x="486.15 495.98 502.42 509.00 514.96" y="228.41" font-size="11.00" class="sc-loraregular">model</text><text x="72.00 80.68 86.64 89.63 93.35 99.03 103.71" y="244.03" font-size="11.00" class="sc-loraregular">welfare</text><text x="109.68 120.68 131.68 142.68 153.68 164.68 175.68 186.68 197.68 208.68 219.68 230.68 241.68 252.68 263.67 274.67 285.67 296.67 307.67 318.67 329.67 340.67 351.67 362.67 373.67 384.67 395.67 406.67 417.67 428.67 439.67 450.67 461.67 472.67 483.67 494.67" y="244.03" font-size="11.00" class="sc-notoserifcjksc">）评估，以及一个新增的、以定性内容为主的章节，描述用户使用该模型的体验。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="294.32" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="294.32" font-size="11.00" class="sc-notoserifcjksc">能力的大幅提升促使我们决定不将其全面开放使用。相反，我们正将其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.94" font-size="11.00" class="sc-notoserifcjksc">用于一项与有限数量合作伙伴共同开展的防御性网络安全计划。本系统卡中描述的研究发现将为</text><text x="72.00 83.00" y="325.56" font-size="11.00" class="sc-notoserifcjksc">未来</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="325.56" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18" y="325.56" font-size="11.00" class="sc-notoserifcjksc">模型的发布及其相关安全防护措施提供参考。</text></svg></div>
