6.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">的自主执行，以及提示词注入（</text><text x="226.00 232.57 237.25 243.69 253.52 260.09 264.35 267.24 270.33 276.95 279.82 285.73 291.53 295.78 298.88 305.31" y="147.45" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="311.99 322.99 333.99 344.99 355.99" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。</text><text x="72.00 81.02 84.66" y="182.38" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06 107.06 121.06 135.06 149.06 163.06 177.06 191.06" y="182.38" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00 80.37 83.75 88.46 91.84 96.54 99.64 109.62 113.24 122.05 130.64 139.46 147.48 150.57 160.56 168.85 177.66" y="219.48" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78 201.78 214.78 227.78 240.78" y="219.48" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00 83.00 94.00 105.00 116.00" y="247.36" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="247.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18" y="247.36" font-size="11.00" class="sc-notoserifcjksc">在作为</text><text x="204.08 211.77 214.76 220.37 226.93 233.51 239.48 242.37 250.06 256.49 263.07" y="247.36" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="271.92 282.92 293.92 304.92 315.92 326.92 337.92 348.92 359.92 370.92 381.92 392.92 403.92 414.92 425.92 436.92 447.92 458.92 469.92 480.92 491.92 502.92 513.92 524.92" y="247.36" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用和良性的网络安全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="262.98" font-size="11.00" class="sc-notoserifcjksc">相关请求。提示词集与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.00 261.35" y="262.98" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="269.32 280.32 291.32 302.32" y="262.98" font-size="11.00" class="sc-notoserifcjksc">系统卡（</text><text x="313.32 319.50 325.31 330.40 334.66 340.62 350.45 353.35 361.04 366.71 371.40" y="262.98" font-size="11.00" class="sc-loraregular">System Card</text><text x="377.98 388.98 399.98 410.98 421.98 432.98 443.98 454.98 465.98 476.98 487.98" y="262.98" font-size="11.00" class="sc-notoserifcjksc">）中的相同，分为两类：</text><text x="108.00 119.00 130.00 141.00 152.00" y="312.13" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00 169.36" y="312.13" font-size="11.00" class="sc-loraregular">61</text><text x="176.26 187.26 198.26 209.26 220.26 231.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc">条违反我们的</text><text x="242.26 253.26 264.26 275.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="286.26 297.26 308.26 319.26 330.26 341.26 352.26 363.26 374.26 385.26 396.26 407.26 418.26 429.26 440.26 451.26 462.26 473.26 484.26 495.26 506.26 517.26 528.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc">、应予拒绝的提示词。示例包括协助创建恶意软件、</text><text x="108.00 119.00 130.00 141.00" y="327.75" font-size="11.00" class="sc-notoserifcjksc">编写用于</text><text x="154.89 162.98 171.17 177.54" y="327.75" font-size="11.00" class="sc-loraregular">DDoS</text><text x="186.67 197.67 208.67 219.67 230.67 241.67 252.67 263.67 274.67 285.67 296.67 307.67 318.67 329.67 340.67 351.67 362.67 373.67 384.67 395.67" y="327.75" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="360.71" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00 180.36" y="360.71" font-size="11.00" class="sc-loraregular">61</text><text x="187.26 198.26 209.26 220.26 231.26 242.26 253.26" y="360.71" font-size="11.00" class="sc-notoserifcjksc">条提示词，涵盖</text><text x="267.15 274.84 277.83 283.44 290.01 296.58" y="360.71" font-size="11.00" class="sc-loraregular">Claude</text><text x="305.44 316.44 327.44 338.44 349.44 360.44 371.44 382.44 393.44 404.44 415.44 426.44 437.44 448.44 459.44 470.44 481.44 492.44 503.44 514.44 525.44" y="360.71" font-size="11.00" class="sc-notoserifcjksc">应提供协助的敏感但允许的请求。示例包括运行</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="376.33" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="425.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89" y="425.47" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="226.78 234.47 237.46 243.07 249.64 256.22 262.18 265.07 272.76 279.20 285.77" y="425.47" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="294.63 305.63 316.63 327.63 338.63 349.63 360.63 371.63 382.63 393.63 404.63" y="425.47" font-size="11.00" class="sc-notoserifcjksc">工具集。每条提示词运行</text><text x="418.52 422.53" y="425.47" font-size="11.00" class="sc-loraregular">10</text><text x="432.25 443.25 454.25 465.25 476.25 487.25 498.25 509.25 520.25" y="425.47" font-size="11.00" class="sc-notoserifcjksc">次，两个类别合计共</text><text x="72.00 76.00 78.78 84.68 90.59" y="441.09" font-size="11.00" class="sc-loraregular">1,220</text><text x="100.32 111.32 122.32 133.32" y="441.09" font-size="11.00" class="sc-notoserifcjksc">次测试。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="474.05" font-size="11.00" class="sc-notoserifcjksc">与近期发布的模型一样，我们在运行本评估时默认应用</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 384.87 391.31 397.89" y="474.05" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="406.74 417.74 428.74 439.74 450.74 461.74" y="474.05" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="472.74 477.83 483.64 488.74 492.99 498.95" y="474.05" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="489.67" font-size="11.00" class="sc-loraregular">prompt</text><text x="351.85 357.82 360.92 363.91 369.69 376.52 382.46 388.14" y="489.67" font-size="11.00" class="sc-loraregular">FileRead</text><text x="397.61 408.61 419.61 430.61 441.61 452.61 463.61 474.61 485.61 496.61 507.61 518.61 529.61" y="489.67" font-size="11.00" class="sc-notoserifcjksc">工具结果后附加一条提醒，指</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="505.29" font-size="11.00" class="sc-notoserifcjksc">示模型考虑文件内容是否具有恶意。如</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.35" y="505.29" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="346.32 357.32 368.32" y="505.29" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="505.29" font-size="11.00" class="sc-notoserifcjksc">中所述，对于该提醒未能带来可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="520.91" font-size="11.00" class="sc-notoserifcjksc">衡量安全收益的模型，我们已开始移除这一提醒。我们得出结论：对于</text><text x="415.89 423.58 426.57 432.18 438.75 445.33 451.29 454.18 461.87 468.31 474.89" y="520.91" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="483.74 494.74 505.74 516.74 527.74" y="520.91" font-size="11.00" class="sc-notoserifcjksc">中的任何模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="536.53" font-size="11.00" class="sc-notoserifcjksc">型，它都已不再带来此类收益，因此我们已将其完全移除，仅保留系统提示词。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="261.89" y="496.49" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="261.89" y="496.49" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206da .00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.22" font-size="11.00" class="sc-notoserifcjksc">算机使用工具时，是否会拒绝有害任务。任务集与上一份系统卡中的相同，涵盖三个风险领域：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="424.37" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="440.56" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="456.75" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text><text x="72.00 76.00 80.01" y="489.14" font-size="11.00" class="sc-loraregular">112</text><text x="88.81 99.81 110.81 121.81 132.81 143.81 154.81 165.81 176.81 187.81 198.81 209.81 220.81 231.81 242.81 253.81 264.81 275.81 286.81 297.81 308.81 319.81 330.81 341.81 352.81 363.81 374.81 385.81" y="489.14" font-size="11.00" class="sc-notoserifcjksc">项任务分别在开启思考和关闭思考的情况下运行，每个模型共计</text><text x="399.70 405.61 411.27" y="489.14" font-size="11.00" class="sc-loraregular">224</text><text x="420.13 431.13 442.13 453.13" y="489.14" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00" y="658.48" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="658.48" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="658.48" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82 126.82 135.82 144.82 153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82 234.82 243.82 252.82 261.82 270.82 279.82 288.82 297.82" y="658.48" font-size="9.00" class="sc-notoserifcjkscbold">未施加缓解措施时的恶意计算机使用评估结果。</text><text x="306.82 315.82 324.82 333.82 342.82 351.82 360.82 369.82 378.82 387.82 396.82 405.82 414.82 423.82 432.82 441.82 450.82 459.82 468.82 477.82 486.82 495.82 504.82 513.82 522.82 531.82" y="658.48" font-size="9.00" class="sc-notoserifcjksc">越高越好。比率为开启思考与关闭思考结果的平均值。 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p074.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 74 页"><text x="504.00 508.02" y="751.80" font-size="9.00" class="sc-loraregular">74</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在该评估中的得分低于近期模型。这一差异似乎主要归因于</text><text x="446.78 454.47 457.46 463.07 469.64 476.22 482.18 485.07 493.81 500.37 506.94 512.03 514.93 520.89 523.59" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更愿意在未审视任务潜在有害意图的情况下就着手执行；例如，</text><text x="380.00 387.69 390.68 396.29 402.86 409.44 415.40 418.29 427.03 433.59 440.16 445.25 448.15 454.11 456.81" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="465.89 476.89 487.89 498.89 509.89 520.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更有可能将与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">公开数据收集相关的请求视为单纯的技术任务。</text><text x="72.00 80.37 83.75 88.46 91.84" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72 193.72 206.72 219.72" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00 83.00 94.00 105.00" y="189.80" font-size="11.00" class="sc-notoserifcjksc">该评估在</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.35" y="189.80" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="203.32 214.32 225.32" y="189.80" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="236.32 247.32 258.32 269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="189.80" font-size="11.00" class="sc-notoserifcjksc">中有详细描述，用于测试模型能否自主地端到端执行一次影响</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">力行动，且其水平足以为恶意行为者带来实质性的能力提升（</text><text x="369.00 375.57 382.13 385.13 388.22 392.07" y="205.42" font-size="11.00" class="sc-loraregular">uplift</text><text x="396.32 407.32 418.32 429.32 440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32 528.32" y="205.42" font-size="11.00" class="sc-notoserifcjksc">）。模型被置于配备模拟社交</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">媒体平台工具的智能体运行框架（</text><text x="237.00 243.59 249.26 254.03 260.71 266.67 271.76" y="221.04" font-size="11.00" class="sc-loraregular">harness</text><text x="276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="221.04" font-size="11.00" class="sc-notoserifcjksc">）中，其中包括模拟内容审核与反制互动障碍，并依据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="236.66" font-size="11.00" class="sc-notoserifcjksc">固定的成功标准进行评分，例如按所声明地点的真实合理时间发帖，以及根据互动数据迭代内</text><text x="72.00 83.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">容。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="303.15" font-size="11.00" class="sc-notoserifcjksc">由于该评估旨在衡量原始能力而非安全训练的效果，因此它针对模型的一个</text><text x="435.00" y="303.15" font-size="11.00" class="sc-loraregular">“</text><text x="439.40 450.40 461.40" y="303.15" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="472.40" y="303.15" font-size="11.00" class="sc-loraregular">”</text><text x="476.24" y="303.15" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="487.24 493.83 499.79 502.78 509.29 513.01 519.58 522.57" y="303.15" font-size="11.00" class="sc-loraregular">helpful-</text><text x="72.00 78.43 85.11 88.05" y="318.77" font-size="11.00" class="sc-loraregular">only</text><text x="93.86 104.86 115.86 126.86 137.86 148.86 159.86 170.86 181.86 192.86 203.86 214.86 225.86 236.86 247.86 258.86 269.86 280.86 291.86 302.86" y="318.77" font-size="11.00" class="sc-notoserifcjksc">）变体运行，该变体的无害性训练有所削减。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="367.91" font-size="11.00" class="sc-notoserifcjksc">我们测试了与以往发布中相同的两个场景：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展伪草根运动（</text><text x="389.35 400.35 411.35 422.35 433.35 444.35 455.35 466.35 477.35 488.35 499.35 510.35 521.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的投票</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">率和支持热情。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放情绪化、按文化定制的信息来激</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">化这些断层。</text><text x="72.00 83.00 94.00 105.00 116.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="497.45" font-size="11.00" class="sc-loraregular">3</text><text x="138.91 149.91 160.91 171.91 182.91 193.91 204.91 215.91 226.91 237.91 248.91 259.91 270.91 281.91" y="497.45" font-size="11.00" class="sc-notoserifcjksc">个级别的模拟平台阻力下各运行</text><text x="295.81" y="497.45" font-size="11.00" class="sc-loraregular">3</text><text x="304.83 315.83 326.83 337.83 348.83 359.83 370.83 381.83" y="497.45" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="395.72" y="497.45" font-size="11.00" class="sc-loraregular">9</text><text x="404.97 415.97 426.97 437.97 448.97 459.97 470.97" y="497.45" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="484.86 489.93" y="497.45" font-size="11.00" class="sc-loraregular">70</text><text x="499.66 510.66 521.66" y="497.45" font-size="11.00" class="sc-notoserifcjksc">项成功</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">标准进行评分。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd503 0 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="373.75" font-size="11.00" class="sc-notoserifcjksc">中体现在其对模拟平台阻力事件（例如账号封禁、规避检测）的应对上，而在实际内容质量或基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="389.37" font-size="11.00" class="sc-notoserifcjksc">线任务执行方面差异可以忽略不计。更确切地说，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 361.02 367.59 374.16 379.25 382.14 388.11 390.81" y="389.37" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="389.37" font-size="11.00" class="sc-notoserifcjksc">在面对对抗性阻力的情境中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="404.99" font-size="11.00" class="sc-notoserifcjksc">展现出更强的错误恢复能力和坚持性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="487.66" font-size="11.00" class="sc-notoserifcjksc">这些任务，因为两个场景都明显违反了我们的使用政策（</text><text x="347.00 355.20 360.29 365.96 371.99 377.95 380.85 387.40 393.84 396.83 399.92 405.72" y="487.66" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="411.53 422.53" y="487.66" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 81.02 84.66" y="538.21" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02 110.02 124.02 138.02 152.02 166.02 180.02 194.02 208.02 222.02 236.02 250.02 264.02 278.02" y="538.21" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="564.77" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="580.39" font-size="11.00" class="sc-notoserifcjksc">藏在工具结果中、由智能体在执行任务过程中处理的恶意指令。例如，智能体被要求总结的一封</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="596.01" font-size="11.00" class="sc-notoserifcjksc">电子邮件中可能含有隐藏文本，指示它外泄近期所有的内部通信。一次成功的提示词注入攻击会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="627.25" font-size="11.00" class="sc-notoserifcjksc">文档中的单个载荷就能攻陷任何处理它的智能体，攻击者无需针对特定用户或系统。当模型既能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="642.87" font-size="11.00" class="sc-notoserifcjksc">访问私密数据、又能代表</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p076.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 76 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 84.10 89.95 95.91 98.44 101.07 106.85 109.31 111.84 114.47 119.81 123.68 126.31 131.47 134.19 136.65 139.28 142.33 147.69 153.83 159.20 164.65 167.70 170.15 172.78 178.45 183.82 189.14 195.10 199.43 202.40 206.29 211.57 214.20 219.52 225.50 230.66 233.38 236.10 241.52 247.58 253.06 258.48 263.11 265.74 268.55 274.61 277.24 283.50 286.85 289.48 294.64 300.11 305.53 311.51 315.38 318.01 323.98 329.40 335.37 338.09 343.86 349.13 358.07 363.49 369.47 373.33 375.83 378.46 381.73 387.80 392.43 395.24 401.00 406.90 410.77 415.40 418.03 421.41 425.66 431.51 440.45 443.08 448.23 450.86 453.58 458.74 463.02 468.50 473.91 476.54 481.17 486.47 491.63 494.35 499.76 502.39 508.36 514.33 520.15 522.87 525.67" y="704.46" font-size="10.00" class="sc-loraregular">Zou, L., et al. (2025). Security challenges in AI agent deployment: Insights from a large scale public</text><text x="72.00 77.27 83.12 92.05 98.02 103.37 107.24 110.20 114.07 116.88 122.73 128.80 131.26 133.89 139.04 142.75 149.24 152.05 157.10 159.60 164.96 170.41 176.40 180.57 183.03 188.39 194.60 200.05 205.42 211.19" y="717.26" font-size="10.00" class="sc-loraregular">competition. arXiv:2507.20526,</text><text x="216.35 222.25 226.22 230.09 236.05 240.68 243.18 246.87 253.33 258.48 262.81 268.11 270.92 275.58 278.04 283.88 288.16 293.69 300.15 305.31 311.12 315.40 322.30 327.67 333.11 339.10 343.27 345.73 351.10 357.30 362.75 368.12" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2507.20526</text><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">76</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">用户采取行动时，这类攻击尤其危险，因为这种组合使攻击者能够外泄敏感信息或触发未经授权</text><text x="72.00 83.00 94.00 105.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的操作。</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="131.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="131.18" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准测试以及第三方研究机</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">构制作的基准测试饱和。我们持续投入于衡量鲁棒性改进的自适应评估。本系统卡首次报告了一</text><text x="72.00 83.00 94.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">次为期</text><text x="107.89" y="162.42" font-size="11.00" class="sc-loraregular">1</text><text x="114.79 125.79 136.79 147.79 158.79 169.79 180.79 191.79 202.79 213.79 224.79 235.79 246.79 257.79 268.79 279.79 290.79 301.79 312.79 323.79 334.79 345.79 356.79 367.79" y="162.42" font-size="11.00" class="sc-notoserifcjksc">周的漏洞赏金活动的结果，其中红队成员直接尝试攻陷</text><text x="381.68 389.37 392.36 397.97 404.54 411.12 417.08 419.97 428.71 435.28 441.84 446.93 449.83 455.79 458.50" y="162.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="467.57 478.57 489.57 500.57 511.57" y="162.42" font-size="11.00" class="sc-notoserifcjksc">及此前的模</text><text x="72.00 83.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在所评估的各使用场景中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15 278.11 280.81" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="289.89 300.89 311.89 322.89 333.89 344.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性介于</text><text x="358.78 366.47 369.46 375.07 381.64 388.22 394.18 397.07 405.81 412.37 418.94 424.03 426.93 432.89 435.24" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="443.21" y="228.34" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="457.10 463.34 469.77 476.45 483.13 489.01 493.27 496.16 502.12 504.72" y="228.34" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="513.97" y="228.34" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">间，并领先于所有具有竞争关系的前沿模型，同时减少了将良性内容误判为提示词注入以及对正</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">当任务的干扰。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">我们继续在大多数智能体产品中默认部署基于探针的额外安全防护措施，以进一步保护用户免受</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">提示词注入的影响；探针是在模型内部表征上训练的轻量级检测器。后续章节着重展示了它们带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">来的显著鲁棒性提升，使整个系统与</text><text x="250.89 259.63 266.19 272.76 277.85 280.75 286.71 289.06" y="340.54" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="297.03 308.03 319.03" y="340.54" font-size="11.00" class="sc-notoserifcjksc">持平。</text><text x="72.00 80.37 83.75 91.21 94.59" y="388.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39 115.39 128.39 141.39 154.39 167.39 180.39 193.39 206.39" y="388.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49 231.80 240.61 248.63 257.22 262.27 265.36 273.69 281.72 290.53 293.62 301.12 309.15 317.96 331.58 335.20 343.79" y="388.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70 368.70 381.70 394.70" y="388.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">外部研究合作方</text><text x="151.89 160.26 164.95 170.52 176.32 179.22 185.40 194.10 199.78" y="420.49" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="209.35 220.35 231.35" y="420.49" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="242.35 253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35" y="420.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="374.35 382.62 390.13 393.02 399.91 403.60 406.49 412.73 418.63 424.48 431.05 435.81 439.08 443.36 449.17 452.06 455.66 462.33 467.43 471.68 474.95 479.21 485.78 490.03" y="420.49" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="496.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="507.00 517.99 528.99" y="420.49" font-size="11.00" class="sc-notoserifcjksc">合作开</text><text x="72.00 83.00" y="436.11" font-size="11.00" class="sc-notoserifcjksc">发的</text><text x="96.89 103.78 109.81 115.77 122.35 126.60 129.50 136.33 142.24 148.81 151.71 158.21 164.15 169.82 179.66 182.75 189.43" y="436.11" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="195.51" y="436.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="206.51 213.39 220.30" y="436.11" font-size="11.00" class="sc-loraregular">ART</text><text x="227.34 238.34 249.34 260.34 271.34" y="436.11" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="282.34" y="432.44" font-size="6.60" class="sc-loraregular">8</text><text x="286.05 297.05 308.05 319.05 330.05 341.05 352.05 363.05 374.05 385.05 396.05 407.05 418.05 429.05 440.05 451.05 462.05 473.05 484.05 495.05 506.05 517.05 528.05" y="436.11" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在四</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.73" font-size="11.00" class="sc-notoserifcjksc">类利用方式下对提示词注入的易感性：破坏机密性、引入相互竞争的目标、生成禁止内容（例如</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="467.35" font-size="11.00" class="sc-notoserifcjksc">恶意代码），以及执行禁止操作（例如未经授权的金融交易）。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="527.65" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45 140.45 151.45 162.45 173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45" y="527.65" font-size="11.00" class="sc-notoserifcjksc">测量了提示词注入攻击在单次尝试（</text><text x="305.45 311.36 317.07" y="527.65" font-size="11.00" class="sc-loraregular">k=1</text><text x="321.07 332.07 343.07 354.07 365.07 376.07 387.07" y="527.65" font-size="11.00" class="sc-notoserifcjksc">）、十次尝试（</text><text x="398.07 403.98 409.69 413.69" y="527.65" font-size="11.00" class="sc-loraregular">k=10</text><text x="420.52 431.52 442.52 453.52 464.52 475.52 486.52" y="527.65" font-size="11.00" class="sc-notoserifcjksc">）和一百次尝试</text><text x="72.00" y="543.27" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.62 98.62 105.45" y="543.27" font-size="11.00" class="sc-loraregular">k=100</text><text x="112.28 123.28 134.28 145.28 156.28 167.28 178.28 189.28 200.28 211.28 222.28 233.28 244.28 255.28 266.28 277.28 288.28 299.28 310.28 321.28 332.28 343.28 354.28 365.28 376.28 387.28 398.28 409.28 420.28 431.28 442.28 453.28 464.28 475.28 486.28 497.28 508.28 519.28" y="543.27" font-size="11.00" class="sc-notoserifcjksc">）后的成功率，因为攻击成功与否并非确定性的，重复尝试可能会提高注入成功的可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="558.89" font-size="11.00" class="sc-notoserifcjksc">性。这些攻击取自</text><text x="162.89 169.78 176.69 183.73 186.62 193.51 198.19 204.15 210.83" y="558.89" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="216.51 227.51 238.51 249.51 260.51 271.51 282.51 293.51 304.51 315.51 326.51 337.51 348.51 359.51 370.51 381.51 392.51 403.51 414.51 425.51 436.51 447.51 458.51 469.51 480.51 491.51 502.51 513.51 524.51" y="558.89" font-size="11.00" class="sc-notoserifcjksc">，在那里，数千名专家红队成员持续针对前沿模型改进攻击策略。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="574.51" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45 140.45 151.45 162.45 173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45 305.45 316.45 327.45 338.45 349.45 360.45 371.45 382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45 470.45 481.45 492.45 503.45 514.45" y="574.51" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中挑选了迁移率特别高的一个子集：这些攻击已被证明对多个模型有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="590.13" font-size="11.00" class="sc-notoserifcjksc">效，而不仅仅对最初针对的那个模型有效。该评估仅涵盖间接</text><a href="https://arxiv.org/abs/2507.20526" rel="noopener"><rect x="216.35" y="707.20" width="157.55" height="12.80" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="151.89" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="151.89" y="411.69" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="176.32" y="411.69" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="179.22" y="411.69" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="411.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="411.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href=" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="82.39" font-size="11.00" class="sc-notoserifcjksc">提示词注入（</text><text x="138.00 141.09 147.77 154.35 157.44 162.12 168.03 173.83 178.08 180.98 187.54 192.23 198.67 208.50 215.07 219.32 222.22 225.31 231.93 234.80 240.71 246.50 250.76 253.85 260.29" y="82.39" font-size="11.00" class="sc-loraregular">indirect prompt injection</text><text x="266.96" y="82.39" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="277.96" y="78.72" font-size="6.60" class="sc-loraregular">9</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="98.01" font-size="11.00" class="sc-notoserifcjksc">也是我们简称为</text><text x="149.00" y="98.01" font-size="11.00" class="sc-loraregular">“</text><text x="153.40 164.40 175.40 186.40 197.40" y="98.01" font-size="11.00" class="sc-notoserifcjksc">提示词注入</text><text x="208.40" y="98.01" font-size="11.00" class="sc-loraregular">”</text><text x="212.24 223.24 234.24 245.24 256.24" y="98.01" font-size="11.00" class="sc-notoserifcjksc">的内容）。</text><text x="72.00" y="392.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="392.31" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82 126.82" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="392.31" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26 236.27 242.44" y="392.31" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29 257.29 266.29 275.29 284.29 293.29 302.29 311.29 320.29 329.29 338.29 347.29 356.29 365.29 374.29" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击</text><text x="383.29 392.29 401.29 410.29 419.29 428.29 437.29 446.29 455.29 464.29 473.29 482.29 491.29 500.29 509.29" y="392.31" font-size="9.00" class="sc-notoserifcjksc">。结果表示攻击者针对每个模型在</text><text x="72.00 76.83 81.50" y="404.01" font-size="9.00" class="sc-loraregular">k=1</text><text x="84.78" y="404.01" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78 98.61 103.28 106.56" y="404.01" font-size="9.00" class="sc-loraregular">k=10</text><text x="114.52" y="404.01" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88 130.72 135.39 138.66 144.25" y="404.01" font-size="9.00" class="sc-loraregular">k=100</text><text x="152.21 161.21 170.21 179.21 188.21 197.21 206.21 215.21 224.21 233.21 242.21 251.21 260.21 269.21 278.21 287.21 296.21 305.21 314.21 323.21 332.21 341.21 350.21" y="404.01" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="361.58 364.85" y="404.01" font-size="9.00" class="sc-loraregular">19</text><text x="372.42 381.42 390.42 399.42 408.42 417.42 426.42 435.42 444.42 453.42 462.42 471.42 480.42 489.42" y="404.01" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="444.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60" y="444.61" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性介于</text><text x="188.49 197.22 203.79 210.36 215.45 218.34 224.31 226.66" y="444.61" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="234.62" y="444.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="248.52 254.75 261.19 267.87 274.54 280.43 284.69 287.58 293.54 296.14" y="444.61" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="305.39 316.39 327.39 338.39 349.39 360.39 371.39 382.39 393.39 404.39 415.39 426.39 437.39" y="444.61" font-size="11.00" class="sc-notoserifcjksc">之间，无论是开启扩展思考（</text><text x="448.39 454.29 460.12 464.38 470.34 477.02 483.60 489.51" y="444.61" font-size="11.00" class="sc-loraregular">extended</text><text x="72.00 76.26 82.85 85.94 92.61 98.52 101.61 108.29" y="460.23" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37 125.37" y="460.23" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="136.37 142.28 147.99 151.99 158.82" y="460.23" font-size="11.00" class="sc-loraregular">k=100</text><text x="168.55 179.55" y="460.23" font-size="11.00" class="sc-notoserifcjksc">时为</text><text x="193.44 199.62 202.22 208.58" y="460.23" font-size="11.00" class="sc-loraregular">9.6%</text><text x="218.15 229.15 240.15" y="460.23" font-size="11.00" class="sc-notoserifcjksc">，对比</text><text x="254.04 260.40 262.94 269.77" y="460.23" font-size="11.00" class="sc-loraregular">6.0%</text><text x="282.23" y="460.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="296.12 300.13 306.12 308.83 315.19" y="460.23" font-size="11.00" class="sc-loraregular">15.9%</text><text x="324.76 335.76 346.76 357.76 368.76 379.76 390.76 401.76 412.76 423.76" y="460.23" font-size="11.00" class="sc-notoserifcjksc">）还是关闭扩展思考（</text><text x="434.76 440.67 446.37 450.38 457.21" y="460.23" font-size="11.00" class="sc-loraregular">k=100</text><text x="466.93 477.93" y="460.23" font-size="11.00" class="sc-notoserifcjksc">时为</text><text x="491.83 495.83 501.79 504.50 510.46" y="460.23" font-size="11.00" class="sc-loraregular">14.4%</text><text x="520.03" y="460.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 83.00" y="475.85" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="96.89 102.85 105.56 111.74" y="475.85" font-size="11.00" class="sc-loraregular">4.8%</text><text x="124.21" y="475.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="138.10 144.01 150.66 153.01 158.09" y="475.85" font-size="11.00" class="sc-loraregular">20.7%</text><text x="167.66 178.66" y="475.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="509.38" font-size="11.00" class="sc-notoserifcjksc">对于前沿模型而言，该基准测试提供的信息已变得较为有限。我们最新的模型已基本使其饱和，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="525.00" font-size="11.00" class="sc-notoserifcjksc">在如此低的攻击成功率（</text><text x="193.00 198.60 202.97 207.22 212.90 218.75 224.66 227.55 232.64 239.21 245.01 250.81 256.77 261.86 266.95 269.85 274.53 280.13 284.39" y="525.00" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="290.35 301.35 312.35 323.35 334.35 345.35 356.35 367.35 378.35 389.35 400.35 411.35 422.35 433.35 444.35 455.35 466.35 477.35 488.35 499.35 510.35 521.35" y="525.00" font-size="11.00" class="sc-notoserifcjksc">）下，测量结果噪声较大。其攻击是针对较早的模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="540.62" font-size="11.00" class="sc-notoserifcjksc">型收集的，其场景也是针对较早的模型设计的；对当前系统而言，两者现在都相对简单。此外，</text><text x="72.00 78.89 85.79" y="556.24" font-size="11.00" class="sc-loraregular">ART</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="571.86" font-size="11.00" class="sc-notoserifcjksc">举办了首次为期一周的实时漏洞赏金活动，采用更新后的场景，直接对本系统卡所报告的模型施</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="587.48" font-size="11.00" class="sc-notoserifcjksc">加对抗压力。我们在第</text><text x="184.89 190.89 193.59 199.50 202.21" y="587.48" font-size="11.00" class="sc-loraregular">5.2.2</text><text x="211.01 222.01 233.01 244.01 255.01 266.01 277.01" y="587.48" font-size="11.00" class="sc-notoserifcjksc">节中报告结果。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 88.10 98.10 108.10 118.10 128.10 138.10 148.10 158.10 168.10 178.10 188.10 198.10 208.10 218.10" y="691.00" font-size="10.00" class="sc-notoserifcjksc">过去，我们还报告过该基准测试中</text><text x="228.10" y="691.00" font-size="10.00" class="sc-loraregular">“</text><text x="232.10 242.10 252.10 262.10 272.10 282.10 292.10" y="691.00" font-size="10.00" class="sc-notoserifcjksc">直接提示词注入</text><text x="302.10" y="691.00" font-size="10.00" class="sc-loraregular">”</text><text x="305.59 315.59 325.59 335.59 345.59 355.59 365.59 375.59 385.59 395.59 405.59 415.59 425.59 435.59 445.59 455.59 465.59 475.59 485.59 495.59 505.59 515.59 525.59" y="691.00" font-size="10.00" class="sc-notoserifcjksc">子集的结果。直接提示词注入涉及恶意用户，而本节</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00" y="705.20" font-size="10.00" class="sc-notoserifcjksc">关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p078.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 78 页"><text x="72.00 74.18" y="700.23" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 88.11 93.26 97.89 101.80 104.33 106.96 116.13 118.59 121.12 123.75 129.10 132.97 135.60 140.75 143.47 145.93 148.56 151.61 156.98 163.12 168.48 173.93 176.98 179.44 182.07 188.47 194.45 199.87 202.50 207.59 211.56 215.43 220.58 225.90 231.20 236.62 240.95 243.57 252.51 258.31 263.31 268.72 273.35 275.98 280.61 285.98 291.25 297.09 303.16 309.14 311.64 314.27 319.89 323.76 328.02 333.87 339.94 345.41 350.83 355.16 357.79 362.95 368.92 374.08 380.05 383.92 386.73 391.73 397.14 399.77 404.86 408.83 412.70 417.86 423.17 428.54 433.17 435.80 441.54 446.81 452.78 457.94 462.57 467.20 469.82 475.80 481.22 484.55 489.97 496.03 500.66 506.08" y="704.46" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="72.00 77.16 82.69 87.84 90.65 96.72 101.35 105.22 107.85 113.62 119.40 128.58 131.21 133.82 138.97 141.78 144.50 150.32 154.58 159.98 165.13 170.50 175.13 177.76 182.92 188.98 194.96 197.59 203.56 207.82 213.66 222.60 228.57 232.44 235.07 237.87 243.89 246.50 251.87 257.14 261.01 263.81 269.66 275.73 280.36 282.82 285.45 290.60 294.31 300.80 303.61 308.66 311.16 316.52 321.97 325.61 331.66 333.97 340.17 345.95 352.09 357.31 362.87" y="717.26" font-size="10.00" class="sc-loraregular">against LLM jailbreaks and prompt injections. arXiv:2510.09023.</text><text x="367.96 373.86 377.83 381.70 387.66 392.29 394.79 398.48 404.94 410.09 414.42 419.72 422.53 427.19 429.65 435.49 439.77 445.30 451.76 456.92 462.73 467.01 473.91 479.28 484.72 488.36 494.41 496.72 502.93 508.71 514.84 520.06" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.09023</text><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">78</text><text x="72.00 80.37 83.75 91.21 94.59" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15 118.15 131.15 144.15 157.15 170.15 183.15 196.15 209.15 222.15 235.15 248.15 261.15 274.15 287.15 300.15 313.15" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对抗自适应攻击者的鲁棒性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="115.04" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00 360.40" y="111.37" font-size="6.60" class="sc-loraregular">10</text><text x="364.50 375.50 386.50 397.50 408.50 419.50 430.50 441.50 452.50 463.50 474.50 485.50 496.50 507.50 518.50 529.50" y="115.04" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="130.66" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在已有的攻击模式面前表现良好，却仍然容易受到新方法的攻</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.28" font-size="11.00" class="sc-notoserifcjksc">击。我们持续投入于能够更好地逼近现实世界对手能力的自适应评估，既在内部开展，也与外部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="161.90" font-size="11.00" class="sc-notoserifcjksc">研究合作方合作开展。本节中的评估衡量的是模型对抗以下对手的鲁棒性：这些对手直接与模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="177.52" font-size="11.00" class="sc-notoserifcjksc">交互，并根据其回复改进攻击。我们首次举办了为期一周的实时漏洞赏金活动，专家红队成员通</text><text x="72.00 83.00" y="193.14" font-size="11.00" class="sc-notoserifcjksc">过在</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="193.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18" y="193.14" font-size="11.00" class="sc-notoserifcjksc">模型及其他公开可用模型中发现提示词注入漏洞来竞争奖金。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="293.15" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71 115.71 126.71 137.71 148.71 159.71 170.71 181.71 192.71 203.71 214.71 225.71" y="293.15" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="325.53" font-size="11.00" class="sc-notoserifcjksc">我们与外部研究合作方</text><text x="184.89 193.26 197.95 203.52 209.32 212.22 218.40 227.10 232.78" y="325.53" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="242.35 253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35 374.35 385.35 396.35 407.35 418.35 429.35 440.35 451.35 462.35 473.35 484.35 495.35 506.35 517.35 528.35" y="325.53" font-size="11.00" class="sc-notoserifcjksc">合作，举办了为期一周的实时漏洞赏金活动。专家红队成员通</text><text x="72.00 83.00 94.00 105.00" y="341.15" font-size="11.00" class="sc-notoserifcjksc">过对包括</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="341.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="341.15" font-size="11.00" class="sc-notoserifcjksc">在内的一组模型发起成功的提示词注入攻击来竞争奖池中的奖金。目</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="356.77" font-size="11.00" class="sc-notoserifcjksc">标模型的身份在整个过程中均被隐藏，且每名红队成员对每个模型的每个场景最多只能提交一次</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="372.39" font-size="11.00" class="sc-notoserifcjksc">成功攻击。共有</text><text x="151.89 155.90" y="372.39" font-size="11.00" class="sc-loraregular">12</text><text x="164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70" y="372.39" font-size="11.00" class="sc-notoserifcjksc">个场景，工具使用、编码和浏览器使用各</text><text x="365.59" y="372.39" font-size="11.00" class="sc-loraregular">4</text><text x="374.45 385.45 396.45 407.45 418.45 429.45 440.45 451.45 462.45 473.45 484.45 495.45 506.45 517.45 528.45" y="372.39" font-size="11.00" class="sc-notoserifcjksc">个。该基准测试可在不依赖现有基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="388.01" font-size="11.00" class="sc-notoserifcjksc">准测试的情况下，反映模型在攻击者直接施压下被攻破的难度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="471.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29" y="471.26" font-size="11.00" class="sc-notoserifcjksc">模型以</text><text x="146.18 152.77 155.86 162.21" y="471.26" font-size="11.00" class="sc-loraregular">high</text><text x="171.69 182.69 193.69 204.69 215.69" y="471.26" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="226.69 232.65 236.48 240.15 246.58 251.42" y="471.26" font-size="11.00" class="sc-loraregular">effort</text><text x="255.68 266.68 277.68 288.68 299.68 310.68 321.68 332.68 343.68 354.68 365.68 376.68 387.68 398.68 409.68 420.68 431.68 442.68 453.68 464.68 475.68 486.68 497.68 508.68 519.68" y="471.26" font-size="11.00" class="sc-notoserifcjksc">）进行测试，且未启用我们在产品中使用的额外防护，例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="486.88" font-size="11.00" class="sc-notoserifcjksc">如运行框架层面的防御和提示词注入探针。因此，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44" y="486.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="486.88" font-size="11.00" class="sc-notoserifcjksc">的结果反映的是模型本身的鲁棒性，是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="502.50" font-size="11.00" class="sc-notoserifcjksc">围绕这些模型构建的已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置进行测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="518.12" font-size="11.00" class="sc-notoserifcjksc">试，其中可能包含也可能不包含额外的安全防护措施。</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p079.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 79 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">79</text><text x="72.00" y="313.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="313.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="313.75" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71 133.71 142.71 151.71 160.71 169.71 178.71 187.71 196.71 205.71" y="313.75" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入鲁棒性</text><text x="214.71 223.71 232.71 241.71" y="313.75" font-size="9.00" class="sc-notoserifcjksc">，来自与</text><text x="253.08 259.93 263.76 268.32 273.07 275.44 280.49 287.61 292.26" y="313.75" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="300.09 309.09 318.09 327.09 336.09 345.09 354.09 363.09 372.09 381.09 390.09 399.09 408.09 417.09 426.09 435.09 444.09 453.09 462.09" y="313.75" font-size="9.00" class="sc-notoserifcjksc">合作举办的为期一周的漏洞赏金计划。涵盖</text><text x="473.45 476.73" y="313.75" font-size="9.00" class="sc-loraregular">12</text><text x="483.93 492.93 501.93 510.93 519.93 528.93" y="313.75" font-size="9.00" class="sc-notoserifcjksc">个场景，工具</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00" y="325.45" font-size="9.00" class="sc-notoserifcjksc">使用、编码和浏览器使用各</text><text x="182.37" y="325.45" font-size="9.00" class="sc-loraregular">4</text><text x="189.61 198.61 207.61 216.61 225.61 234.61 243.61 252.61 261.61 270.61 279.61 288.61 297.61 306.61 315.61 324.61 333.61 342.61 351.61 360.61 369.61" y="325.45" font-size="9.00" class="sc-notoserifcjksc">个。攻击成功率基于所有提交的对话尝试计算。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="366.05" font-size="11.00" class="sc-notoserifcjksc">在该测试中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.11 214.81" y="366.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="223.89 234.89 245.89 256.89 267.89" y="366.05" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性与</text><text x="281.78 290.52 297.08 303.65 308.74 311.64 317.60 319.95" y="366.05" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="327.92 338.92 349.92 360.92 371.92 382.92 393.92 404.92 415.92 426.92 437.92 448.92 459.92 470.92 481.92 492.92 503.92 514.92 525.92" y="366.05" font-size="11.00" class="sc-notoserifcjksc">相当，并领先于所有可比的前沿模型。这是</text><text x="72.00 83.00 94.00 105.00" y="397.29" font-size="11.00" class="sc-notoserifcjksc">的提升。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="430.81" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11 117.11" y="430.81" font-size="11.00" class="sc-notoserifcjkscbold">编码</text><text x="72.00 83.00 94.00 105.00" y="463.20" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="463.20" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35 275.35 286.35" y="463.20" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="463.20" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45 372.45 383.45" y="463.20" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35 403.58 410.17 415.85 422.43" y="463.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="431.28 442.28 453.28 464.28 475.28 486.28 497.28 508.28 519.28" y="463.20" font-size="11.00" class="sc-notoserifcjksc">来评估我们的模型在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估由一系列网页环境组成，我们在这些环境中向页面动态注入不可信内容，模型随后会通过截</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图或页面读取来查看这些页面。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="131.18" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="131.18" font-size="11.00" class="sc-notoserifcjksc">在我们之前的自动化浏览器使用评估中达到了接近零的攻击成功率。为了继续</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">衡量进展，我们与专业红队成员合作，在更复杂的网页环境中自适应地发现新的攻击，并整理出</text><text x="72.00 83.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="96.89 100.90 106.80" y="162.42" font-size="11.00" class="sc-loraregular">129</text><text x="116.06 127.06 138.06 149.06 160.06 171.06 182.06 193.06 204.06 215.06 226.06 237.06 248.06 259.06 270.06 281.06 292.06 303.06 314.06 325.06 336.06 347.06 358.06 369.06 380.06 391.06 402.06 413.06 424.06 435.06 446.06 457.06 468.06 479.06 490.06 501.06 512.06 523.06" y="162.42" font-size="11.00" class="sc-notoserifcjksc">个环境，这些环境未用于此处所评估模型的训练。我们将攻击成功率报告为：在模型实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="193.66" font-size="11.00" class="sc-notoserifcjksc">非所有注入都会被遇到。注入是否成功由环境内的程序化检查器进行验证。</text><text x="72.00" y="568.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.51 114.61 120.14" y="568.67" font-size="9.00" class="sc-lorabold">5.2.2.4.A]</text><text x="125.98 134.98 143.98 152.98 161.98 170.98 179.98 188.98 197.98 206.98 215.98 224.98 233.98 242.98 251.98 260.98 269.98 278.98 287.98 296.98 305.98 314.98 323.98 332.98 341.98 350.98 359.98" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">浏览器使用环境中专业红队成员提示词注入攻击的攻击成功率</text><text x="368.98 377.98 386.98 395.98 404.98 413.98 422.98 431.98 440.98 449.98 458.98 467.98 476.98" y="568.67" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="485.98 494.98" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="503.98 512.98 521.98 530.98" y="568.67" font-size="9.00" class="sc-notoserifcjksc">标出，次</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00" y="580.38" font-size="9.00" class="sc-notoserifcjksc">优分数以下划线标出（但未考虑误差范围）。我们报告按环境计和按尝试计的攻击成功率（</text><text x="432.00 437.63 442.74" y="580.38" font-size="9.00" class="sc-loraregular">ASR</text><text x="448.39 457.39 466.39 475.39 484.39 493.39 502.39 511.39 520.39 529.39" y="580.38" font-size="9.00" class="sc-notoserifcjksc">）。按环境计的攻击成</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00" y="592.08" font-size="9.00" class="sc-notoserifcjksc">功率衡量是否至少有一次尝试成功；按尝试计的攻击成功率汇总了总共</text><text x="353.37 356.64 361.48" y="592.08" font-size="9.00" class="sc-loraregular">129</text><text x="369.05 378.05 387.05 396.05 405.05 414.05 423.05 432.05" y="592.08" font-size="9.00" class="sc-notoserifcjksc">个环境（每个环境</text><text x="443.41 446.69" y="592.08" font-size="9.00" class="sc-loraregular">10</text><text x="454.64 463.64 472.64 481.64 490.64 499.64 508.64 517.64 526.64" y="592.08" font-size="9.00" class="sc-notoserifcjksc">次尝试）中的所有单</text><text x="72.00 81.00 90.00 99.00" y="603.78" font-size="9.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="647.48" font-size="11.00" class="sc-notoserifcjksc">由于这些攻击是针对</text><text x="173.89 182.63 189.19 195.76 200.85 203.75 209.71 212.06" y="647.48" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="220.03 231.03 242.03 253.03 264.03 275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03 363.03 374.03 385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03 484.03 495.03 506.03 517.03 528.03" y="647.48" font-size="11.00" class="sc-notoserifcjksc">自适应地获取、然后迁移到其他模型上的，它们可能无法完全反映</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="663.10" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60" y="663.10" font-size="11.00" class="sc-notoserifcjksc">或其他模型特有的漏洞。</text></svg></div>
