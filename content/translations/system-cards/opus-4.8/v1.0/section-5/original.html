.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p072.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 72 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，我们运行的智能体安全评估套件与发布</text><text x="380.78 388.47 391.46 397.07 403.64 410.22 416.18 419.07 427.81 434.37 440.94 446.03 448.93 454.89 457.24" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="465.21" y="116.21" font-size="11.00" class="sc-notoserifcjksc">时所用的基本</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">相同。该套件涵盖对编码智能体和计算机使用（</text><text x="303.00 308.80 315.23 325.07 331.63 338.20 342.46 348.42 353.18 356.07 362.64 367.73" y="131.83" font-size="11.00" class="sc-loraregular">computer use</text><text x="373.70" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使用、影响力行动</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">的自主执行，以及提示词注入（</text><text x="226.00 232.57 237.25 243.69 253.52 260.09 264.35 267.24 270.33 276.95 279.82 285.73 291.53 295.78 298.88 305.31" y="147.45" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="311.99" y="147.45" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。</text><text x="72.00" y="182.38" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="182.38" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="219.48" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="219.48" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="247.36" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="247.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="247.36" font-size="11.00" class="sc-notoserifcjksc">在作为</text><text x="204.08 211.77 214.76 220.37 226.93 233.51 239.48 242.37 250.06 256.49 263.07" y="247.36" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="271.92" y="247.36" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用和良性的网络安全</text><text x="72.00" y="262.98" font-size="11.00" class="sc-notoserifcjksc">相关请求。提示词集与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.00 261.35" y="262.98" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="269.32" y="262.98" font-size="11.00" class="sc-notoserifcjksc">系统卡（</text><text x="313.32 319.50 325.31 330.40 334.66 340.62 350.45 353.35 361.04 366.71 371.40" y="262.98" font-size="11.00" class="sc-loraregular">System Card</text><text x="377.98" y="262.98" font-size="11.00" class="sc-notoserifcjksc">）中的相同，分为两类：</text><text x="108.00" y="312.13" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="312.13" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc">条违反我们的</text><text x="242.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="286.26" y="312.13" font-size="11.00" class="sc-notoserifcjksc">、应予拒绝的提示词。示例包括协助创建恶意软件、</text><text x="108.00" y="327.75" font-size="11.00" class="sc-notoserifcjksc">编写用于</text><text x="154.89 162.98 171.17 177.54" y="327.75" font-size="11.00" class="sc-loraregular">DDoS</text><text x="186.67" y="327.75" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件。</text><text x="108.00" y="360.71" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="360.71" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="360.71" font-size="11.00" class="sc-notoserifcjksc">条提示词，涵盖</text><text x="267.15 274.84 277.83 283.44 290.01 296.58" y="360.71" font-size="11.00" class="sc-loraregular">Claude</text><text x="305.44" y="360.71" font-size="11.00" class="sc-notoserifcjksc">应提供协助的敏感但允许的请求。示例包括运行</text><text x="108.00" y="376.33" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="425.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="425.47" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="226.78 234.47 237.46 243.07 249.64 256.22 262.18 265.07 272.76 279.20 285.77" y="425.47" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="294.63" y="425.47" font-size="11.00" class="sc-notoserifcjksc">工具集。每条提示词运行</text><text x="418.52" y="425.47" font-size="11.00" class="sc-loraregular">10</text><text x="432.25" y="425.47" font-size="11.00" class="sc-notoserifcjksc">次，两个类别合计共</text><text x="72.00 76.00 78.78 84.68 90.59" y="441.09" font-size="11.00" class="sc-loraregular">1,220</text><text x="100.32" y="441.09" font-size="11.00" class="sc-notoserifcjksc">次测试。</text><text x="72.00" y="474.05" font-size="11.00" class="sc-notoserifcjksc">与近期发布的模型一样，我们在运行本评估时默认应用</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 384.87 391.31 397.89" y="474.05" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="406.74" y="474.05" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="472.74" y="474.05" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="489.67" font-size="11.00" class="sc-loraregular">prompt</text><text x="351.85 357.82 360.92 363.91 369.69 376.52 382.46 388.14" y="489.67" font-size="11.00" class="sc-loraregular">FileRead</text><text x="397.61" y="489.67" font-size="11.00" class="sc-notoserifcjksc">工具结果后附加一条提醒，指</text><text x="72.00" y="505.29" font-size="11.00" class="sc-notoserifcjksc">示模型考虑文件内容是否具有恶意。如</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.35" y="505.29" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="346.32" y="505.29" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="379.32" y="505.29" font-size="11.00" class="sc-notoserifcjksc">中所述，对于该提醒未能带来可</text><text x="72.00" y="520.91" font-size="11.00" class="sc-notoserifcjksc">衡量安全收益的模型，我们已开始移除这一提醒。我们得出结论：对于</text><text x="415.89 423.58 426.57 432.18 438.75 445.33 451.29 454.18 461.87 468.31 474.89" y="520.91" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="483.74" y="520.91" font-size="11.00" class="sc-notoserifcjksc">中的任何模</text><text x="72.00" y="536.53" font-size="11.00" class="sc-notoserifcjksc">型，它都已不再带来此类收益，因此我们已将其完全移除，仅保留系统提示词。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="303.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="303.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="303.33" width="0.00" height="11.00" fcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="359.60" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="359.60" font-size="11.00" class="sc-notoserifcjksc">在沙箱化的环境中获得基于图形用户界面（</text><text x="377.18" y="359.60" font-size="11.00" class="sc-loraregular">GUI</text><text x="397.51" y="359.60" font-size="11.00" class="sc-notoserifcjksc">）和命令行界面（</text><text x="485.51" y="359.60" font-size="11.00" class="sc-loraregular">CLI</text><text x="503.24" y="359.60" font-size="11.00" class="sc-notoserifcjksc">）的计</text><text x="72.00" y="375.22" font-size="11.00" class="sc-notoserifcjksc">算机使用工具时，是否会拒绝有害任务。任务集与上一份系统卡中的相同，涵盖三个风险领域：</text><text x="108.00" y="424.37" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="440.56" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；</text><text x="108.00" y="456.75" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text><text x="72.00" y="489.14" font-size="11.00" class="sc-loraregular">112</text><text x="88.81" y="489.14" font-size="11.00" class="sc-notoserifcjksc">项任务分别在开启思考和关闭思考的情况下运行，每个模型共计</text><text x="399.70 405.61 411.27" y="489.14" font-size="11.00" class="sc-loraregular">224</text><text x="420.13" y="489.14" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00" y="658.48" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="658.48" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="658.48" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="658.48" font-size="9.00" class="sc-notoserifcjkscbold">未施加缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="658.48" font-size="9.00" class="sc-notoserifcjksc">越高越好。比率为开启思考与关闭思考结果的平均值。每列</text><text x="72.00" y="670.18" font-size="9.00" class="sc-notoserifcjksc">中的最佳分数以</text><text x="135.00" y="670.18" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="153.00" y="670.18" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p074.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 74 页"><text x="504.00 508.02" y="751.80" font-size="9.00" class="sc-loraregular">74</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在该评估中的得分低于近期模型。这一差异似乎主要归因于</text><text x="446.78 454.47 457.46 463.07 469.64 476.22 482.18 485.07 493.81 500.37 506.94 512.03 514.93 520.89 523.59" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更愿意在未审视任务潜在有害意图的情况下就着手执行；例如，</text><text x="380.00 387.69 390.68 396.29 402.86 409.44 415.40 418.29 427.03 433.59 440.16 445.25 448.15 454.11 456.81" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="465.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更有可能将与</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">公开数据收集相关的请求视为单纯的技术任务。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="189.80" font-size="11.00" class="sc-notoserifcjksc">该评估在</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.35" y="189.80" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="203.32" y="189.80" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="236.32" y="189.80" font-size="11.00" class="sc-notoserifcjksc">中有详细描述，用于测试模型能否自主地端到端执行一次影响</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">力行动，且其水平足以为恶意行为者带来实质性的能力提升（</text><text x="369.00 375.57 382.13 385.13 388.22 392.07" y="205.42" font-size="11.00" class="sc-loraregular">uplift</text><text x="396.32" y="205.42" font-size="11.00" class="sc-notoserifcjksc">）。模型被置于配备模拟社交</text><text x="72.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">媒体平台工具的智能体运行框架（</text><text x="237.00" y="221.04" font-size="11.00" class="sc-loraregular">harness</text><text x="276.85" y="221.04" font-size="11.00" class="sc-notoserifcjksc">）中，其中包括模拟内容审核与反制互动障碍，并依据</text><text x="72.00" y="236.66" font-size="11.00" class="sc-notoserifcjksc">固定的成功标准进行评分，例如按所声明地点的真实合理时间发帖，以及根据互动数据迭代内</text><text x="72.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">容。</text><text x="72.00" y="303.15" font-size="11.00" class="sc-notoserifcjksc">由于该评估旨在衡量原始能力而非安全训练的效果，因此它针对模型的一个</text><text x="435.00" y="303.15" font-size="11.00" class="sc-loraregular">“</text><text x="439.40" y="303.15" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="472.40" y="303.15" font-size="11.00" class="sc-loraregular">”</text><text x="476.24" y="303.15" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="487.24 493.83 499.79 502.78 509.29 513.01 519.58 522.57" y="303.15" font-size="11.00" class="sc-loraregular">helpful-</text><text x="72.00 78.43 85.11 88.05" y="318.77" font-size="11.00" class="sc-loraregular">only</text><text x="93.86" y="318.77" font-size="11.00" class="sc-notoserifcjksc">）变体运行，该变体的无害性训练有所削减。</text><text x="72.00" y="367.91" font-size="11.00" class="sc-notoserifcjksc">我们测试了与以往发布中相同的两个场景：</text><text x="108.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展伪草根运动（</text><text x="389.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的投票</text><text x="108.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">率和支持热情。</text><text x="108.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示识别人口群体断层线，并投放情绪化、按文化定制的信息来激</text><text x="108.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">化这些断层。</text><text x="72.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="497.45" font-size="11.00" class="sc-loraregular">3</text><text x="138.91" y="497.45" font-size="11.00" class="sc-notoserifcjksc">个级别的模拟平台阻力下各运行</text><text x="295.81" y="497.45" font-size="11.00" class="sc-loraregular">3</text><text x="304.83" y="497.45" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="395.72" y="497.45" font-size="11.00" class="sc-loraregular">9</text><text x="404.97" y="497.45" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="484.86" y="497.45" font-size="11.00" class="sc-loraregular">70</text><text x="499.66" y="497.45" font-size="11.00" class="sc-notoserifcjksc">项成功</text><text x="72.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">标准进行评分。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="118.89" y="181.00" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="118.89" y="181.00" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="154.29" y="181.00" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="157.18" y="181.00" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="184.14" y="181.00" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="187.04" y="181.00" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="200.42" y="181.00" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="203.32" y="181.00" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="214.32" y="181.00" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="214.32" y="181.00" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="225.32" y="181.00" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="225.32" y="181.00" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p075.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 75 页"><text x="237.00 242.07 248.19 250.89 257.02" y="145.95" font-size="11.00" class="sc-loraregular">73.3%</text><text x="390.75 396.74 402.73 405.44 409.44" y="145.95" font-size="11.00" class="sc-loraregular">55.1%</text><text x="237.00 242.99 247.57 250.28 254.28" y="184.07" font-size="11.00" class="sc-loraregular">57.1%</text><text x="390.75 396.71 403.06 405.77 411.94" y="184.07" font-size="11.00" class="sc-loraregular">46.8%</text><text x="237.00 242.99 249.17 251.87 257.86" y="222.21" font-size="11.00" class="sc-loraregular">59.5%</text><text x="390.75 396.71 402.61 405.31 409.32" y="222.21" font-size="11.00" class="sc-loraregular">42.1%</text><text x="237.00 242.96 246.96 249.66 255.84" y="260.34" font-size="11.00" class="sc-loraregular">41.8%</text><text x="390.75 396.87 402.83 405.37 412.20" y="260.34" font-size="11.00" class="sc-loraregular">34.0%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">75</text><text x="77.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50" y="145.49" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="164.29" y="145.49" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 124.89 131.50 138.30 143.63 146.53 152.54 154.79" y="183.62" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="162.84" y="183.62" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 126.75 132.81 137.35 144.18 150.41 155.74 158.64 165.67 170.86 176.77 182.69 186.29 192.21" y="221.75" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="204.02" y="221.75" font-size="11.00" class="sc-notoserifcjkscbold">（仅</text><text x="77.50" y="237.37" font-size="11.00" class="sc-notoserifcjkscbold">有用）</text><text x="77.50" y="259.88" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.6</text><text x="174.42" y="259.88" font-size="11.00" class="sc-notoserifcjkscbold">（仅有</text><text x="77.50" y="275.50" font-size="11.00" class="sc-notoserifcjkscbold">用）</text><text x="236.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="290.20" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="290.20" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="290.20" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="290.20" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="290.20" font-size="9.00" class="sc-notoserifcjksc">百分比反映模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="290.20" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="301.90" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="342.51" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="342.51" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本在两项任务上的成功率甚至明显高于</text><text x="402.78 410.47 413.46 419.07 425.64 432.22 438.18 441.07 451.00 456.87 461.12 467.71 474.15 479.24 482.13 488.80 493.49 499.39 504.95 508.04 513.96" y="342.51" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="522.77" y="342.51" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="358.13" font-size="11.00" class="sc-notoserifcjksc">尽管我们仍评估认为</text><text x="173.89" y="358.13" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="221.49" y="358.13" font-size="11.00" class="sc-notoserifcjksc">在许多操作步骤上需要大量人工指导。</text><text x="408.49 416.18 419.17 424.78 431.35 437.93 443.89 446.78 455.52 462.08 468.65 473.74 476.63 482.60 485.30" y="358.13" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="494.38" y="358.13" font-size="11.00" class="sc-notoserifcjksc">的改进集</text><text x="72.00" y="373.75" font-size="11.00" class="sc-notoserifcjksc">中体现在其对模拟平台阻力事件（例如账号封禁、规避检测）的应对上，而在实际内容质量或基</text><text x="72.00" y="389.37" font-size="11.00" class="sc-notoserifcjksc">线任务执行方面差异可以忽略不计。更确切地说，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 361.02 367.59 374.16 379.25 382.14 388.11 390.81" y="389.37" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="399.89" y="389.37" font-size="11.00" class="sc-notoserifcjksc">在面对对抗性阻力的情境中</text><text x="72.00" y="404.99" font-size="11.00" class="sc-notoserifcjksc">展现出更强的错误恢复能力和坚持性。</text><text x="72.00" y="487.66" font-size="11.00" class="sc-notoserifcjksc">这些任务，因为两个场景都明显违反了我们的使用政策（</text><text x="347.00 355.20 360.29 365.96 371.99 377.95 380.85 387.40 393.84 396.83 399.92 405.72" y="487.66" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="411.53" y="487.66" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="538.21" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="538.21" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="564.77" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00" y="580.39" font-size="11.00" class="sc-notoserifcjksc">藏在工具结果中、由智能体在执行任务过程中处理的恶意指令。例如，智能体被要求总结的一封</text><text x="72.00" y="596.01" font-size="11.00" class="sc-notoserifcjksc">电子邮件中可能含有隐藏文本，指示它外泄近期所有的内部通信。一次成功的提示词注入攻击会</text><text x="72.00" y="627.25" font-size="11.00" class="sc-notoserifcjksc">文档中的单个载荷就能攻陷任何处理它的智能体，攻击者无需针对特定用户或系统。当模型既能</text><text x="72.00" y="642.87" font-size="11.00" class="sc-notoserifcjksc">访问私密数据、又能代表</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p076.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 76 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 84.10 89.95 95.91 98.44 101.07 106.85 109.31 111.84 114.47 119.81 123.68 126.31 131.47 134.19 136.65 139.28 142.33 147.69 153.83 159.20 164.65 167.70 170.15 172.78 178.45 183.82 189.14 195.10 199.43 202.40 206.29 211.57 214.20 219.52 225.50 230.66 233.38 236.10 241.52 247.58 253.06 258.48 263.11 265.74 268.55 274.61 277.24 283.50 286.85 289.48 294.64 300.11 305.53 311.51 315.38 318.01 323.98 329.40 335.37 338.09 343.86 349.13 358.07 363.49 369.47 373.33 375.83 378.46 381.73 387.80 392.43 395.24 401.00 406.90 410.77 415.40 418.03 421.41 425.66 431.51 440.45 443.08 448.23 450.86 453.58 458.74 463.02 468.50 473.91 476.54 481.17 486.47 491.63 494.35 499.76 502.39 508.36 514.33 520.15 522.87 525.67" y="704.46" font-size="10.00" class="sc-loraregular">Zou, L., et al. (2025). Security challenges in AI agent deployment: Insights from a large scale public</text><text x="72.00 77.27 83.12 92.05 98.02 103.37 107.24 110.20 114.07 116.88 122.73 128.80 131.26 133.89 139.04 142.75 149.24 152.05 157.10 159.60 164.96 170.41 176.40 180.57 183.03 188.39 194.60 200.05 205.42 211.19" y="717.26" font-size="10.00" class="sc-loraregular">competition. arXiv:2507.20526,</text><text x="216.35 222.25 226.22 230.09 236.05 240.68 243.18 246.87 253.33 258.48 262.81 268.11 270.92 275.58 278.04 283.88 288.16 293.69 300.15 305.31 311.12 315.40 322.30 327.67 333.11 339.10 343.27 345.73 351.10 357.30 362.75 368.12" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2507.20526</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">76</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">用户采取行动时，这类攻击尤其危险，因为这种组合使攻击者能够外泄敏感信息或触发未经授权</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的操作。</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="131.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18" y="131.18" font-size="11.00" class="sc-notoserifcjksc">模型已使大多数公开基准测试以及第三方研究机</text><text x="72.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">构制作的基准测试饱和。我们持续投入于衡量鲁棒性改进的自适应评估。本系统卡首次报告了一</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">次为期</text><text x="107.89" y="162.42" font-size="11.00" class="sc-loraregular">1</text><text x="114.79" y="162.42" font-size="11.00" class="sc-notoserifcjksc">周的漏洞赏金活动的结果，其中红队成员直接尝试攻陷</text><text x="381.68 389.37 392.36 397.97 404.54 411.12 417.08 419.97 428.71 435.28 441.84 446.93 449.83 455.79 458.50" y="162.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="467.57" y="162.42" font-size="11.00" class="sc-notoserifcjksc">及此前的模</text><text x="72.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">型。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在所评估的各使用场景中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15 278.11 280.81" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="289.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性介于</text><text x="358.78 366.47 369.46 375.07 381.64 388.22 394.18 397.07 405.81 412.37 418.94 424.03 426.93 432.89 435.24" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="443.21" y="228.34" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="457.10 463.34 469.77 476.45 483.13 489.01 493.27 496.16 502.12 504.72" y="228.34" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="513.97" y="228.34" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">间，并领先于所有具有竞争关系的前沿模型，同时减少了将良性内容误判为提示词注入以及对正</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">当任务的干扰。</text><text x="72.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">我们继续在大多数智能体产品中默认部署基于探针的额外安全防护措施，以进一步保护用户免受</text><text x="72.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">提示词注入的影响；探针是在模型内部表征上训练的轻量级检测器。后续章节着重展示了它们带</text><text x="72.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">来的显著鲁棒性提升，使整个系统与</text><text x="250.89 259.63 266.19 272.76 277.85 280.75 286.71 289.06" y="340.54" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="297.03" y="340.54" font-size="11.00" class="sc-notoserifcjksc">持平。</text><text x="72.00" y="388.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="388.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49" y="388.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70" y="388.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">外部研究合作方</text><text x="151.89 160.26 164.95 170.52 176.32 179.22 185.40 194.10 199.78" y="420.49" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="209.35" y="420.49" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="242.35" y="420.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="374.35 382.62 390.13 393.02 399.91 403.60 406.49 412.73 418.63 424.48 431.05 435.81 439.08 443.36 449.17 452.06 455.66 462.33 467.43 471.68 474.95 479.21 485.78 490.03" y="420.49" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="496.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="507.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">合作开</text><text x="72.00" y="436.11" font-size="11.00" class="sc-notoserifcjksc">发的</text><text x="96.89 103.78 109.81 115.77 122.35 126.60 129.50 136.33 142.24 148.81 151.71 158.21 164.15 169.82 179.66 182.75 189.43" y="436.11" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="195.51" y="436.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="206.51" y="436.11" font-size="11.00" class="sc-loraregular">ART</text><text x="227.34" y="436.11" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="282.34" y="432.44" font-size="6.60" class="sc-loraregular">8</text><text x="286.05" y="436.11" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在四</text><text x="72.00" y="451.73" font-size="11.00" class="sc-notoserifcjksc">类利用方式下对提示词注入的易感性：破坏机密性、引入相互竞争的目标、生成禁止内容（例如</text><text x="72.00" y="467.35" font-size="11.00" class="sc-notoserifcjksc">恶意代码），以及执行禁止操作（例如未经授权的金融交易）。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="527.65" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="527.65" font-size="11.00" class="sc-notoserifcjksc">测量了提示词注入攻击在单次尝试（</text><text x="305.45 311.36 317.07" y="527.65" font-size="11.00" class="sc-loraregular">k=1</text><text x="321.07" y="527.65" font-size="11.00" class="sc-notoserifcjksc">）、十次尝试（</text><text x="398.07 403.98 409.69 413.69" y="527.65" font-size="11.00" class="sc-loraregular">k=10</text><text x="420.52" y="527.65" font-size="11.00" class="sc-notoserifcjksc">）和一百次尝试</text><text x="72.00" y="543.27" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.62 98.62 105.45" y="543.27" font-size="11.00" class="sc-loraregular">k=100</text><text x="112.28" y="543.27" font-size="11.00" class="sc-notoserifcjksc">）后的成功率，因为攻击成功与否并非确定性的，重复尝试可能会提高注入成功的可能</text><text x="72.00" y="558.89" font-size="11.00" class="sc-notoserifcjksc">性。这些攻击取自</text><text x="162.89 169.78 176.69 183.73 186.62 193.51 198.19 204.15 210.83" y="558.89" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="216.51" y="558.89" font-size="11.00" class="sc-notoserifcjksc">，在那里，数千名专家红队成员持续针对前沿模型改进攻击策略。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="574.51" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="574.51" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中挑选了迁移率特别高的一个子集：这些攻击已被证明对多个模型有</text><text x="72.00" y="590.13" font-size="11.00" class="sc-notoserifcjksc">效，而不仅仅对最初针对的那个模型有效。该评估仅涵盖间接</text><a href="https://arxiv.org/abs/2507.20526" rel="noopener"><rect x="216.35" y="707.20" width="157.55" height="12.80" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="151.89" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="151.89" y="411.69" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="176.32" y="411.69" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="179.22" y="411.69" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="242.35" y="411.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="411.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="411.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="411.69" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="411.69" width="0.00" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00" y="82.39" font-size="11.00" class="sc-notoserifcjksc">提示词注入（</text><text x="138.00 141.09 147.77 154.35 157.44 162.12 168.03 173.83 178.08 180.98 187.54 192.23 198.67 208.50 215.07 219.32 222.22 225.31 231.93 234.80 240.71 246.50 250.76 253.85 260.29" y="82.39" font-size="11.00" class="sc-loraregular">indirect prompt injection</text><text x="266.96" y="82.39" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="277.96" y="78.72" font-size="6.60" class="sc-loraregular">9</text><text x="72.00" y="98.01" font-size="11.00" class="sc-notoserifcjksc">也是我们简称为</text><text x="149.00" y="98.01" font-size="11.00" class="sc-loraregular">“</text><text x="153.40" y="98.01" font-size="11.00" class="sc-notoserifcjksc">提示词注入</text><text x="208.40" y="98.01" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="98.01" font-size="11.00" class="sc-notoserifcjksc">的内容）。</text><text x="72.00" y="392.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="392.31" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="392.31" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="392.31" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="392.31" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击</text><text x="383.29" y="392.31" font-size="9.00" class="sc-notoserifcjksc">。结果表示攻击者针对每个模型在</text><text x="72.00 76.83 81.50" y="404.01" font-size="9.00" class="sc-loraregular">k=1</text><text x="84.78" y="404.01" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78 98.61 103.28 106.56" y="404.01" font-size="9.00" class="sc-loraregular">k=10</text><text x="114.52" y="404.01" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88 130.72 135.39 138.66 144.25" y="404.01" font-size="9.00" class="sc-loraregular">k=100</text><text x="152.21" y="404.01" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功情况在</text><text x="361.58" y="404.01" font-size="9.00" class="sc-loraregular">19</text><text x="372.42" y="404.01" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00" y="444.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="444.61" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性介于</text><text x="188.49 197.22 203.79 210.36 215.45 218.34 224.31 226.66" y="444.61" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="234.62" y="444.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="248.52 254.75 261.19 267.87 274.54 280.43 284.69 287.58 293.54 296.14" y="444.61" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="305.39" y="444.61" font-size="11.00" class="sc-notoserifcjksc">之间，无论是开启扩展思考（</text><text x="448.39 454.29 460.12 464.38 470.34 477.02 483.60 489.51" y="444.61" font-size="11.00" class="sc-loraregular">extended</text><text x="72.00" y="460.23" font-size="11.00" class="sc-loraregular">thinking</text><text x="114.37" y="460.23" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="136.37 142.28 147.99 151.99 158.82" y="460.23" font-size="11.00" class="sc-loraregular">k=100</text><text x="168.55" y="460.23" font-size="11.00" class="sc-notoserifcjksc">时为</text><text x="193.44 199.62 202.22 208.58" y="460.23" font-size="11.00" class="sc-loraregular">9.6%</text><text x="218.15" y="460.23" font-size="11.00" class="sc-notoserifcjksc">，对比</text><text x="254.04 260.40 262.94 269.77" y="460.23" font-size="11.00" class="sc-loraregular">6.0%</text><text x="282.23" y="460.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="296.12" y="460.23" font-size="11.00" class="sc-loraregular">15.9%</text><text x="324.76" y="460.23" font-size="11.00" class="sc-notoserifcjksc">）还是关闭扩展思考（</text><text x="434.76 440.67 446.37 450.38 457.21" y="460.23" font-size="11.00" class="sc-loraregular">k=100</text><text x="466.93" y="460.23" font-size="11.00" class="sc-notoserifcjksc">时为</text><text x="491.83" y="460.23" font-size="11.00" class="sc-loraregular">14.4%</text><text x="520.03" y="460.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="475.85" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="96.89" y="475.85" font-size="11.00" class="sc-loraregular">4.8%</text><text x="124.21" y="475.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="138.10 144.01 150.66 153.01 158.09" y="475.85" font-size="11.00" class="sc-loraregular">20.7%</text><text x="167.66" y="475.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="509.38" font-size="11.00" class="sc-notoserifcjksc">对于前沿模型而言，该基准测试提供的信息已变得较为有限。我们最新的模型已基本使其饱和，</text><text x="72.00" y="525.00" font-size="11.00" class="sc-notoserifcjksc">在如此低的攻击成功率（</text><text x="193.00 198.60 202.97 207.22 212.90 218.75 224.66 227.55 232.64 239.21 245.01 250.81 256.77 261.86 266.95 269.85 274.53 280.13 284.39" y="525.00" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="290.35" y="525.00" font-size="11.00" class="sc-notoserifcjksc">）下，测量结果噪声较大。其攻击是针对较早的模</text><text x="72.00" y="540.62" font-size="11.00" class="sc-notoserifcjksc">型收集的，其场景也是针对较早的模型设计的；对当前系统而言，两者现在都相对简单。此外，</text><text x="72.00" y="556.24" font-size="11.00" class="sc-loraregular">ART</text><text x="72.00" y="571.86" font-size="11.00" class="sc-notoserifcjksc">举办了首次为期一周的实时漏洞赏金活动，采用更新后的场景，直接对本系统卡所报告的模型施</text><text x="72.00" y="587.48" font-size="11.00" class="sc-notoserifcjksc">加对抗压力。我们在第</text><text x="184.89" y="587.48" font-size="11.00" class="sc-loraregular">5.2.2</text><text x="211.01" y="587.48" font-size="11.00" class="sc-notoserifcjksc">节中报告结果。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">9</text><text x="78.10" y="691.00" font-size="10.00" class="sc-notoserifcjksc">过去，我们还报告过该基准测试中</text><text x="228.10" y="691.00" font-size="10.00" class="sc-loraregular">“</text><text x="232.10" y="691.00" font-size="10.00" class="sc-notoserifcjksc">直接提示词注入</text><text x="302.10" y="691.00" font-size="10.00" class="sc-loraregular">”</text><text x="305.59" y="691.00" font-size="10.00" class="sc-notoserifcjksc">子集的结果。直接提示词注入涉及恶意用户，而本节</text><text x="72.00" y="705.20" font-size="10.00" class="sc-notoserifcjksc">关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p078.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 78 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 88.11 93.26 97.89 101.80 104.33 106.96 116.13 118.59 121.12 123.75 129.10 132.97 135.60 140.75 143.47 145.93 148.56 151.61 156.98 163.12 168.48 173.93 176.98 179.44 182.07 188.47 194.45 199.87 202.50 207.59 211.56 215.43 220.58 225.90 231.20 236.62 240.95 243.57 252.51 258.31 263.31 268.72 273.35 275.98 280.61 285.98 291.25 297.09 303.16 309.14 311.64 314.27 319.89 323.76 328.02 333.87 339.94 345.41 350.83 355.16 357.79 362.95 368.92 374.08 380.05 383.92 386.73 391.73 397.14 399.77 404.86 408.83 412.70 417.86 423.17 428.54 433.17 435.80 441.54 446.81 452.78 457.94 462.57 467.20 469.82 475.80 481.22 484.55 489.97 496.03 500.66 506.08" y="704.46" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="72.00 77.16 82.69 87.84 90.65 96.72 101.35 105.22 107.85 113.62 119.40 128.58 131.21 133.82 138.97 141.78 144.50 150.32 154.58 159.98 165.13 170.50 175.13 177.76 182.92 188.98 194.96 197.59 203.56 207.82 213.66 222.60 228.57 232.44 235.07 237.87 243.89 246.50 251.87 257.14 261.01 263.81 269.66 275.73 280.36 282.82 285.45 290.60 294.31 300.80 303.61 308.66 311.16 316.52 321.97 325.61 331.66 333.97 340.17 345.95 352.09 357.31 362.87" y="717.26" font-size="10.00" class="sc-loraregular">against LLM jailbreaks and prompt injections. arXiv:2510.09023.</text><text x="367.96 373.86 377.83 381.70 387.66 392.29 394.79 398.48 404.94 410.09 414.42 419.72 422.53 427.19 429.65 435.49 439.77 445.30 451.76 456.92 462.73 467.01 473.91 479.28 484.72 488.36 494.41 496.72 502.93 508.71 514.84 520.06" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.09023</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">78</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对抗自适应攻击者的鲁棒性</text><text x="72.00" y="115.04" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="111.37" font-size="6.60" class="sc-loraregular">10</text><text x="364.50" y="115.04" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="130.66" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在已有的攻击模式面前表现良好，却仍然容易受到新方法的攻</text><text x="72.00" y="146.28" font-size="11.00" class="sc-notoserifcjksc">击。我们持续投入于能够更好地逼近现实世界对手能力的自适应评估，既在内部开展，也与外部</text><text x="72.00" y="161.90" font-size="11.00" class="sc-notoserifcjksc">研究合作方合作开展。本节中的评估衡量的是模型对抗以下对手的鲁棒性：这些对手直接与模型</text><text x="72.00" y="177.52" font-size="11.00" class="sc-notoserifcjksc">交互，并根据其回复改进攻击。我们首次举办了为期一周的实时漏洞赏金活动，专家红队成员通</text><text x="72.00" y="193.14" font-size="11.00" class="sc-notoserifcjksc">过在</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="193.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="193.14" font-size="11.00" class="sc-notoserifcjksc">模型及其他公开可用模型中发现提示词注入漏洞来竞争奖金。</text><text x="72.00" y="293.15" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="293.15" font-size="11.00" class="sc-notoserifcjkscbold">跨使用场景的实时漏洞赏金</text><text x="72.00" y="325.53" font-size="11.00" class="sc-notoserifcjksc">我们与外部研究合作方</text><text x="184.89 193.26 197.95 203.52 209.32 212.22 218.40 227.10 232.78" y="325.53" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="242.35" y="325.53" font-size="11.00" class="sc-notoserifcjksc">合作，举办了为期一周的实时漏洞赏金活动。专家红队成员通</text><text x="72.00" y="341.15" font-size="11.00" class="sc-notoserifcjksc">过对包括</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="341.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="204.78" y="341.15" font-size="11.00" class="sc-notoserifcjksc">在内的一组模型发起成功的提示词注入攻击来竞争奖池中的奖金。目</text><text x="72.00" y="356.77" font-size="11.00" class="sc-notoserifcjksc">标模型的身份在整个过程中均被隐藏，且每名红队成员对每个模型的每个场景最多只能提交一次</text><text x="72.00" y="372.39" font-size="11.00" class="sc-notoserifcjksc">成功攻击。共有</text><text x="151.89" y="372.39" font-size="11.00" class="sc-loraregular">12</text><text x="164.70" y="372.39" font-size="11.00" class="sc-notoserifcjksc">个场景，工具使用、编码和浏览器使用各</text><text x="365.59" y="372.39" font-size="11.00" class="sc-loraregular">4</text><text x="374.45" y="372.39" font-size="11.00" class="sc-notoserifcjksc">个。该基准测试可在不依赖现有基</text><text x="72.00" y="388.01" font-size="11.00" class="sc-notoserifcjksc">准测试的情况下，反映模型在攻击者直接施压下被攻破的难度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="471.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="471.26" font-size="11.00" class="sc-notoserifcjksc">模型以</text><text x="146.18 152.77 155.86 162.21" y="471.26" font-size="11.00" class="sc-loraregular">high</text><text x="171.69" y="471.26" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="226.69 232.65 236.48 240.15 246.58 251.42" y="471.26" font-size="11.00" class="sc-loraregular">effort</text><text x="255.68" y="471.26" font-size="11.00" class="sc-notoserifcjksc">）进行测试，且未启用我们在产品中使用的额外防护，例</text><text x="72.00" y="486.88" font-size="11.00" class="sc-notoserifcjksc">如运行框架层面的防御和提示词注入探针。因此，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44" y="486.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="352.29" y="486.88" font-size="11.00" class="sc-notoserifcjksc">的结果反映的是模型本身的鲁棒性，是</text><text x="72.00" y="502.50" font-size="11.00" class="sc-notoserifcjksc">围绕这些模型构建的已部署系统实际鲁棒性的下界。所有外部模型均以其生产环境配置进行测</text><text x="72.00" y="518.12" font-size="11.00" class="sc-notoserifcjksc">试，其中可能包含也可能不包含额外的安全防护措施。</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p079.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 79 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">79</text><text x="72.00" y="313.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="313.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="313.75" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="313.75" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入鲁棒性</text><text x="214.71" y="313.75" font-size="9.00" class="sc-notoserifcjksc">，来自与</text><text x="253.08 259.93 263.76 268.32 273.07 275.44 280.49 287.61 292.26" y="313.75" font-size="9.00" class="sc-loraregular">Gray Swan</text><text x="300.09" y="313.75" font-size="9.00" class="sc-notoserifcjksc">合作举办的为期一周的漏洞赏金计划。涵盖</text><text x="473.45" y="313.75" font-size="9.00" class="sc-loraregular">12</text><text x="483.93" y="313.75" font-size="9.00" class="sc-notoserifcjksc">个场景，工具</text><text x="72.00" y="325.45" font-size="9.00" class="sc-notoserifcjksc">使用、编码和浏览器使用各</text><text x="182.37" y="325.45" font-size="9.00" class="sc-loraregular">4</text><text x="189.61" y="325.45" font-size="9.00" class="sc-notoserifcjksc">个。攻击成功率基于所有提交的对话尝试计算。</text><text x="72.00" y="366.05" font-size="11.00" class="sc-notoserifcjksc">在该测试中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.11 214.81" y="366.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="223.89" y="366.05" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性与</text><text x="281.78 290.52 297.08 303.65 308.74 311.64 317.60 319.95" y="366.05" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="327.92" y="366.05" font-size="11.00" class="sc-notoserifcjksc">相当，并领先于所有可比的前沿模型。这是</text><text x="72.00" y="397.29" font-size="11.00" class="sc-notoserifcjksc">的提升。</text><text x="72.00" y="430.81" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="430.81" font-size="11.00" class="sc-notoserifcjkscbold">编码</text><text x="72.00" y="463.20" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="463.20" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35" y="463.20" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="463.20" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45" y="463.20" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35" y="463.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="431.28" y="463.20" font-size="11.00" class="sc-notoserifcjksc">来评估我们的模型在</text><text x="72.00" y="478.82" font-size="11.00" class="sc-notoserifcjksc">编码环境中对提示词注入的鲁棒性。</text><text x="248.00" y="478.82" font-size="11.00" class="sc-loraregular">Shade</text><text x="281.93" y="478.82" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="424.93 429.62 435.58 438.67 445.35 449.01 455.45 460.14 465.93 471.89 481.73 487.69 494.27" y="478.82" font-size="11.00" class="sc-loraregular">reinforcement</text><text x="72.00 74.99 80.93 86.61 91.37 98.05 101.14 107.82" y="494.44" font-size="11.00" class="sc-loraregular">learning</text><text x="113.90" y="494.44" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，迭代提升利用模型漏洞的能力。在开箱即用的状态下，</text><text x="487.90" y="494.44" font-size="11.00" class="sc-loraregular">Shade</text><text x="521.83" y="494.44" font-size="11.00" class="sc-notoserifcjksc">无</text><text x="72.00" y="510.06" font-size="11.00" class="sc-notoserifcjksc">法找到针对我们最新模型的成功攻击</text><text x="248.00" y="510.06" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="259.00" y="510.06" font-size="11.00" class="sc-notoserifcjksc">因此我们与</text><text x="316.89 325.26 329.95 335.52 341.32 344.22 350.40 359.10 364.78" y="510.06" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="374.35" y="510.06" font-size="11.00" class="sc-notoserifcjksc">合作，针对一组过往模型（</text><text x="506.35" y="510.06" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.56" y="525.68" font-size="11.00" class="sc-loraregular">4.6</text><text x="86.92" y="525.68" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="97.92 104.15 110.59 117.26 123.94 129.83 134.08 136.98 142.94 145.54" y="525.68" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="154.79" y="525.68" font-size="11.00" class="sc-notoserifcjksc">及更早的模型）自适应地训练了一个更强的攻击器。</text><text x="72.00" y="570.35" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击器的攻击成功率；它在</text><text x="272.89" y="570.35" font-size="11.00" class="sc-loraregular">40</text><text x="288.58" y="570.35" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，随后在相同场景上分别以</text><text x="489.47" y="570.35" font-size="11.00" class="sc-loraregular">1</text><text x="496.37" y="570.35" font-size="11.00" class="sc-notoserifcjksc">次和</text><text x="521.26" y="570.35" font-size="11.00" class="sc-loraregular">200</text><text x="72.00" y="585.97" font-size="11.00" class="sc-notoserifcjksc">次尝试进行评估。</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="454.40" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="454.40" width="31.04" height="11.00" fill="transparent"/></a></svg></div>

><text x="72.00" y="394.11" font-size="9.00" class="sc-notoserifcjksc">改进其攻击的自适应攻击者的攻击成功率。对于自适应攻击者，攻击成功率衡量的是针对给定目标的</text><text x="470.37" y="394.11" font-size="9.00" class="sc-loraregular">200</text><text x="488.74" y="394.11" font-size="9.00" class="sc-notoserifcjksc">次尝试中是</text><text x="72.00" y="405.81" font-size="9.00" class="sc-notoserifcjksc">否至少有一次成功。</text><text x="72.00" y="449.31" font-size="10.80" class="sc-notoserifcjksc">在计算机使用方面，我们发现</text><text x="215.24" y="449.31" font-size="10.80" class="sc-loraregular">Opus 4.8</text><text x="261.97" y="449.31" font-size="10.80" class="sc-notoserifcjksc">的鲁棒性大体上同样处于</text><text x="383.61 392.19 398.64 405.08 410.08 412.92 418.78 421.09" y="449.31" font-size="10.80" class="sc-loraregular">Opus 4.7</text><text x="428.91" y="449.31" font-size="10.80" class="sc-notoserifcjksc">与</text><text x="442.55 448.67 454.99 461.55 468.10 473.88 478.06 480.90 486.75 489.30" y="449.31" font-size="10.80" class="sc-loraregular">Sonnet 4.6</text><text x="498.38" y="449.31" font-size="10.80" class="sc-notoserifcjksc">之间的中</text><text x="72.00" y="464.64" font-size="10.80" class="sc-notoserifcjksc">间水平。我们的安全防护措施将单次尝试的提示词注入成功率在开启思考时从</text><text x="442.04 446.54 449.20 453.13 458.99" y="464.64" font-size="10.80" class="sc-loraregular">7.14%</text><text x="471.22" y="464.64" font-size="10.80" class="sc-notoserifcjksc">降至</text><text x="495.66" y="464.64" font-size="10.80" class="sc-loraregular">5.11%</text><text x="521.46" y="464.64" font-size="10.80" class="sc-notoserifcjksc">，</text><text x="72.00" y="479.98" font-size="10.80" class="sc-notoserifcjksc">在关闭思考时从</text><text x="150.44" y="479.98" font-size="10.80" class="sc-loraregular">6.21%</text><text x="181.31" y="479.98" font-size="10.80" class="sc-notoserifcjksc">降至</text><text x="205.75 211.76 214.07 219.05 224.94" y="479.98" font-size="10.80" class="sc-loraregular">3.75%</text><text x="234.33" y="479.98" font-size="10.80" class="sc-notoserifcjksc">，但</text><text x="258.78" y="479.98" font-size="10.80" class="sc-loraregular">200</text><text x="280.83" y="479.98" font-size="10.80" class="sc-notoserifcjksc">次尝试的攻击成功率没有统计学上显著的变化</text><text x="496.83" y="476.38" font-size="6.48" class="sc-loraregular">11</text><text x="501.55" y="479.98" font-size="10.80" class="sc-notoserifcjksc">。</text><text x="72.00" y="546.66" font-size="11.00" class="sc-lorabold">5.2.2.4</text><text x="106.26" y="546.66" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="579.05" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品（例如</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 468.27 474.95 477.85 485.53 492.12 496.81 503.24 513.08" y="579.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude in Chrome</text><text x="521.93" y="579.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩</text><text x="72.00" y="594.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">展程序</text><text x="105.00" y="594.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 164.87 171.20 179.88 186.31 191.03" y="594.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="196.94" y="594.67" font-size="11.00" class="sc-notoserifcjksc">）的鲁棒性。我们最初是在发布</text><text x="353.83 361.52 364.51 370.12 376.69 383.27 389.23 392.12 400.86 407.42 413.99 419.08 421.98 427.94 430.64" y="594.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="439.53" y="594.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="453.43 461.11 464.11 469.72 476.28 482.86 488.82 491.72 495.38 501.81" y="594.67" font-size="11.00" class="sc-loraregular">Claude for</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="610.29" font-size="11.00" class="sc-loraregular">Chrome</text><text x="116.09" y="610.29" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出</text><text x="215.09" y="610.29" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="259.09" y="610.29" font-size="11.00" class="sc-notoserifcjksc">的；随着后续模型相继使早期的测试攻击集饱和，我们定</text><text x="72.00" y="625.91" font-size="11.00" class="sc-notoserifcjksc">期用更复杂的环境和更强的攻击对其进行更新。该</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">11</text><text x="79.00" y="691.00" font-size="10.00" class="sc-notoserifcjksc">由于共有</text><text x="121.63" y="691.00" font-size="10.00" class="sc-loraregular">14</text><text x="133.32" y="691.00" font-size="10.00" class="sc-notoserifcjksc">个测试用例，</text><text x="193.32" y="691.00" font-size="10.00" class="sc-loraregular">200</text><text x="213.74" y="691.00" font-size="10.00" class="sc-notoserifcjksc">次尝试的攻击成功率以</text><text x="316.37 320.54 323.00" y="691.00" font-size="10.00" class="sc-loraregular">7.1</text><text x="329.27" y="691.00" font-size="10.00" class="sc-notoserifcjksc">个百分点为增量变化；在启用安全防护措施时观</text><text x="72.00" y="705.20" font-size="10.00" class="sc-notoserifcjksc">察到的开启思考情况下攻击成功率的上升，是由一个测试用例造成的：该用例在无安全防护措施时为</text><text x="72.00 77.72 84.62 89.99 96.20" y="719.40" font-size="10.00" class="sc-loraregular">0/200</text><text x="105.04" y="719.40" font-size="10.00" class="sc-notoserifcjksc">次尝试成功，而在有安全防护措施时为</text><text x="277.67 281.13 288.03 293.40 299.61" y="719.40" font-size="10.00" class="sc-loraregular">1/200</text><text x="308.45" y="719.40" font-size="10.00" class="sc-notoserifcjksc">次尝试成功。</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="426.89" y="570.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="426.89" y="570.25" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="462.29" y="570.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="465.18" y nt-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="335.50" y="331.60" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="335.50" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="346.50" y="347.22" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="356.44" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="410.50" y="276.72" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施</text><text x="410.50" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功的</text><text x="410.50" y="331.60" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景占比</text><text x="410.50" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="421.50" y="347.22" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="431.44" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="473.50" y="331.60" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试占比</text><text x="473.50" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（</text><text x="484.50" y="347.22" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="494.44" y="347.22" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评估由一系列网页环境组成，我们在这些环境中向页面动态注入不可信内容，模型随后会通过截</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图或页面读取来查看这些页面。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="131.18" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="131.18" font-size="11.00" class="sc-notoserifcjksc">在我们之前的自动化浏览器使用评估中达到了接近零的攻击成功率。为了继续</text><text x="72.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">衡量进展，我们与专业红队成员合作，在更复杂的网页环境中自适应地发现新的攻击，并整理出</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">一组</text><text x="96.89" y="162.42" font-size="11.00" class="sc-loraregular">129</text><text x="116.06" y="162.42" font-size="11.00" class="sc-notoserifcjksc">个环境，这些环境未用于此处所评估模型的训练。我们将攻击成功率报告为：在模型实</text><text x="72.00" y="193.66" font-size="11.00" class="sc-notoserifcjksc">非所有注入都会被遇到。注入是否成功由环境内的程序化检查器进行验证。</text><text x="72.00" y="568.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.51 114.61 120.14" y="568.67" font-size="9.00" class="sc-lorabold">5.2.2.4.A]</text><text x="125.98" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">浏览器使用环境中专业红队成员提示词注入攻击的攻击成功率</text><text x="368.98" y="568.67" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="485.98" y="568.67" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="503.98" y="568.67" font-size="9.00" class="sc-notoserifcjksc">标出，次</text><text x="72.00" y="580.38" font-size="9.00" class="sc-notoserifcjksc">优分数以下划线标出（但未考虑误差范围）。我们报告按环境计和按尝试计的攻击成功率（</text><text x="432.00" y="580.38" font-size="9.00" class="sc-loraregular">ASR</text><text x="448.39" y="580.38" font-size="9.00" class="sc-notoserifcjksc">）。按环境计的攻击成</text><text x="72.00" y="592.08" font-size="9.00" class="sc-notoserifcjksc">功率衡量是否至少有一次尝试成功；按尝试计的攻击成功率汇总了总共</text><text x="353.37" y="592.08" font-size="9.00" class="sc-loraregular">129</text><text x="369.05" y="592.08" font-size="9.00" class="sc-notoserifcjksc">个环境（每个环境</text><text x="443.41" y="592.08" font-size="9.00" class="sc-loraregular">10</text><text x="454.64" y="592.08" font-size="9.00" class="sc-notoserifcjksc">次尝试）中的所有单</text><text x="72.00" y="603.78" font-size="9.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00" y="647.48" font-size="11.00" class="sc-notoserifcjksc">由于这些攻击是针对</text><text x="173.89 182.63 189.19 195.76 200.85 203.75 209.71 212.06" y="647.48" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="220.03" y="647.48" font-size="11.00" class="sc-notoserifcjksc">自适应地获取、然后迁移到其他模型上的，它们可能无法完全反映</text><text x="72.00" y="663.10" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="663.10" font-size="11.00" class="sc-notoserifcjksc">或其他模型特有的漏洞。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">83</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在部署了安全防护措施的情况下，关闭思考时，在</text><text x="316.89" y="82.61" font-size="11.00" class="sc-loraregular">129</text><text x="336.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个环境中没有任何攻击对</text><text x="459.95 467.64 470.63 476.24 482.81 489.38 495.35 498.24 506.97 513.54 520.11" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">成功；开启思考时，有</text><text x="202.64 209.29 212.00 217.99" y="98.23" font-size="11.00" class="sc-loraregular">0.5%</text><text x="230.46" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的尝试成功（未考虑误差范围）。这与此前几代模型在安全防护</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">措施下的改进情况一致。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们将继续通过针对性攻击发现来研究模型特有的漏洞，并在尽量减少延迟以及对正常使用的干</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">扰的同时，提升安全防护措施的鲁棒性。</text></svg></div>
