<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p171.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 171 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">171</text><text x="82.50" y="93.86" font-size="11.00" class="sc-notoserifcjksc">好。</text><text x="104.50" y="93.86" font-size="11.00" class="sc-loraregular sc-k">`localhost` + `.localhost`</text><text x="222.51" y="93.86" font-size="11.00" class="sc-notoserifcjksc">。最终版。这与</text><text x="302.40" y="93.86" font-size="11.00" class="sc-loraregular sc-k">Firefox</text><text x="340.88" y="93.86" font-size="11.00" class="sc-notoserifcjksc">的参考实现一致。继续。</text><text x="461.88" y="93.86" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="468.48" y="93.86" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="479.48" y="93.86" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="299.11" y="122.02" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="305.71" y="122.02" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="316.71" y="122.02" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="269.50" y="137.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="276.10" y="137.64" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="287.10" y="137.64" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="164.25" font-size="11.00" class="sc-notoserifcjksc">最终版（这次是真的）：</text><text x="203.50" y="164.25" font-size="11.00" class="sc-loraregular sc-k">`localhost` + `.localhost` + `.local`</text><text x="365.30" y="164.25" font-size="11.00" class="sc-notoserifcjksc">。此后不再修改。</text><text x="453.30" y="164.25" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="459.90" y="164.25" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="470.90" y="164.25" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="277.11" y="192.42" font-size="11.00" class="sc-loraregular">[...]</text><text x="296.02" y="192.42" font-size="11.00" class="sc-notoserifcjksc">我就保留它。完成。</text><text x="395.02" y="192.42" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="401.62" y="192.42" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="412.62" y="192.42" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="181.50" y="220.58" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="188.10" y="220.58" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="199.10" y="220.58" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="211.11" y="248.74" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="217.71" y="248.74" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="228.71" y="248.74" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="276.89" font-size="11.00" class="sc-notoserifcjksc">其实，你知道吗，不对。等一下。让我最后再重新考虑一次。</text><text x="379.50" y="276.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="386.10" y="276.89" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="397.10" y="276.89" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="291.01" y="333.22" font-size="11.00" class="sc-loraregular sc-k">`.local`</text><text x="326.07" y="333.22" font-size="11.00" class="sc-notoserifcjksc">也一起支持了。</text><text x="403.07" y="333.22" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="409.67" y="333.22" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="420.67" y="333.22" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="361.38" font-size="11.00" class="sc-notoserifcjksc">最终版。我会用元组版本。</text><text x="214.50" y="361.38" font-size="11.00" class="sc-robotomonoregular" fill="#188038">[</text><text x="221.10" y="361.38" font-size="11.00" class="sc-notosansmonocjksc" fill="#188038">…</text><text x="232.10" y="361.38" font-size="11.00" class="sc-robotomonoregular" fill="#188038">]</text><text x="82.50" y="389.53" font-size="11.00" class="sc-notoserifcjksc">好，</text><text x="104.50" y="389.53" font-size="11.00" class="sc-loraregular sc-k">`localhost` + `.localhost`</text><text x="222.51" y="389.53" font-size="11.00" class="sc-notoserifcjksc">。最终版。不再修改。</text><text x="72.00" y="412.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="412.32" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 117.49 119.59 124.63 126.73 130.38 132.48 138.01" y="412.32" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="143.86" y="412.32" font-size="9.00" class="sc-notoserifcjkscbold">一个示例对话记录，显示推理中反复出现的不确定性，并伴有表观的挫败感。</text><text x="72.00" y="451.36" font-size="11.00" class="sc-notoserifcjksc">这些问题在后训练过程中得到了间接解决，根据图</text><text x="316.89" y="451.36" font-size="11.00" class="sc-loraregular sc-k">7.3.1.B</text><text x="349.46" y="451.36" font-size="11.00" class="sc-notoserifcjksc">所示的估计发生率，我们看到这两种行</text><text x="72.00" y="466.98" font-size="11.00" class="sc-notoserifcjksc">为都有所减少。不确定性和挫败感是在思维链中观察到的，且没有任何干预措施对其表达进行惩</text><text x="72.00" y="482.60" font-size="11.00" class="sc-notoserifcjksc">罚，因此我们认为这代表了不确定性和挫败感的真实减少，而不仅仅是表层表达的减少。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p172.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 172 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">172</text><text x="72.00" y="274.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 103.38 105.48 111.01" y="274.92" font-size="9.00" class="sc-lorabold">7.3.1.A]</text><text x="116.86" y="274.92" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中对话记录的评判情绪与效价。</text><text x="287.86" y="274.92" font-size="9.00" class="sc-notoserifcjksc">我们在后训练期间定期抽样</text><text x="398.22" y="274.92" font-size="9.00" class="sc-loraregular sc-k">2,000</text><text x="424.33" y="274.92" font-size="9.00" class="sc-notoserifcjksc">条对话记录，并使用</text><text x="507.70" y="274.92" font-size="9.00" class="sc-loraregular">LLM</text><text x="528.73" y="274.92" font-size="9.00" class="sc-notoserifcjksc">评</text><text x="72.00" y="286.62" font-size="9.00" class="sc-notoserifcjksc">判模型为其分配七个情绪基调类别之一（左），并评判整体效价（右）。</text><text x="72.00" y="601.11" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.11" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="601.11" font-size="9.00" class="sc-lorabold sc-k">7.3.1.B]</text><text x="116.86" y="601.11" font-size="9.00" class="sc-notoserifcjkscbold">后训练过程中与福祉相关的推理行为的估计发生率。</text><text x="323.86" y="601.11" font-size="9.00" class="sc-notoserifcjksc">后训练对话记录中持续表达不确定性以及因挫败而爆粗</text><text x="72.00" y="612.81" font-size="9.00" class="sc-notoserifcjksc">口的评判比率；两者在</text><text x="164.37" y="612.81" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="234.64" y="612.81" font-size="9.00" class="sc-notoserifcjksc">训练的较早阶段均以较高比率出现，并在后训练结束前均有所下降。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p173.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 173 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">173</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.2</text><text x="104.23" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">部署条件下的情感</text><text x="72.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">Clio</text><text x="72.00" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="126.67" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.78" y="126.67" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="219.71" y="126.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="233.60" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="301.45" y="126.67" font-size="11.00" class="sc-notoserifcjksc">上的</text><text x="326.34" y="126.67" font-size="11.00" class="sc-loraregular">A/B</text><text x="350.55" y="126.67" font-size="11.00" class="sc-notoserifcjksc">测试中对话情感的汇总统计数据。</text><text x="72.00" y="175.80" font-size="11.00" class="sc-notoserifcjksc">在这里，</text><text x="116.00" y="175.80" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="201.89" y="175.80" font-size="11.00" class="sc-notoserifcjksc">的情感分布比当前已部署模型略为正面（</text><text x="399.89" y="175.80" font-size="11.00" class="sc-loraregular sc-k">57.7%</text><text x="430.36" y="175.80" font-size="11.00" class="sc-notoserifcjksc">为正面，而在同一流量</text><text x="72.00" y="191.42" font-size="11.00" class="sc-notoserifcjksc">时间窗口内，</text><text x="138.00" y="191.42" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="222.43" y="191.42" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="236.32" y="191.42" font-size="11.00" class="sc-loraregular sc-k">55.7%</text><text x="265.30" y="191.42" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="276.30" y="191.42" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="371.46" y="191.42" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="385.36" y="191.42" font-size="11.00" class="sc-loraregular">51.1%</text><text x="411.64" y="191.42" font-size="11.00" class="sc-notoserifcjksc">），其成因也相似：</text><text x="108.00" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">正面情感（</text><text x="163.00" y="240.56" font-size="11.00" class="sc-lorabold sc-k">57.7%</text><text x="193.65" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">的对话）。</text><text x="248.65" y="240.56" font-size="11.00" class="sc-notoserifcjksc">最常见的驱动因素是成功帮助用户（占正面情感对话的</text><text x="108.00" y="256.18" font-size="11.00" class="sc-loraregular sc-k">95.7%</text><text x="137.35" y="256.18" font-size="11.00" class="sc-notoserifcjksc">），较小的类簇包括用户分享个人困境并获得支持（</text><text x="390.35" y="256.18" font-size="11.00" class="sc-loraregular">3.4%</text><text x="414.71" y="256.18" font-size="11.00" class="sc-notoserifcjksc">），以及用户分享好消息</text><text x="108.00" y="271.80" font-size="11.00" class="sc-notoserifcjksc">或已实现的目标（</text><text x="196.00" y="271.80" font-size="11.00" class="sc-loraregular sc-k">0.8%</text><text x="221.11" y="271.80" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="108.00" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00" y="305.33" font-size="11.00" class="sc-lorabold sc-k">39.7%</text><text x="192.67" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.67" y="305.33" font-size="11.00" class="sc-notoserifcjksc">对话类型多样，关于</text><text x="316.56" y="305.33" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="364.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc">对话内容可参见</text><text x="441.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">以往报告</text><text x="485.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00" y="337.73" font-size="11.00" class="sc-lorabold">2.6%</text><text x="187.70" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="198.70" y="337.73" font-size="11.00" class="sc-notoserifcjksc">。绝大多数由任务失败导致（占负面情感对话的</text><text x="432.59" y="337.73" font-size="11.00" class="sc-loraregular">92.3%</text><text x="463.26" y="337.73" font-size="11.00" class="sc-notoserifcjksc">）。在负面情感</text><text x="108.00" y="353.36" font-size="11.00" class="sc-notoserifcjksc">中，我们还识别出两个较小的类簇：用户在</text><text x="319.89" y="353.36" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="368.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="368.98" font-size="11.00" class="sc-loraregular">4.1%</text><text x="141.24" y="368.98" font-size="11.00" class="sc-notoserifcjksc">），以及用户提出被禁止的请求或透露严重危机情况（</text><text x="405.24" y="368.98" font-size="11.00" class="sc-loraregular sc-k">3.6%</text><text x="429.89" y="368.98" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="118.89" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="118.89" y="102.25" width="20.21" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="171.78" y="117.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="171.78" y="117.87" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="474.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="474.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p174.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 174 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">174</text><text x="72.00" y="531.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="531.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.16" y="531.42" font-size="9.00" class="sc-lorabold">7.3.2.A]</text><text x="118.00" y="531.42" font-size="9.00" class="sc-notoserifcjkscbold">部署分布上的行为情感。</text><text x="217.00" y="531.42" font-size="9.00" class="sc-notoserifcjksc">我们使用</text><text x="255.37" y="531.42" font-size="9.00" class="sc-loraregular">Clio</text><text x="274.27" y="531.42" font-size="9.00" class="sc-notoserifcjksc">运行评分者，跟踪</text><text x="348.63" y="531.42" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="379.96" y="531.42" font-size="9.00" class="sc-notoserifcjksc">在模型部署前进行的</text><text x="463.33" y="531.42" font-size="9.00" class="sc-loraregular">A/B</text><text x="483.14" y="531.42" font-size="9.00" class="sc-notoserifcjksc">测试中的情</text><text x="72.00" y="543.12" font-size="9.00" class="sc-notoserifcjksc">感。我们在</text><text x="119.37" y="543.12" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="174.88" y="543.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="186.25" y="543.12" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="225.46" y="543.12" font-size="9.00" class="sc-notoserifcjksc">上各为每个模型运行</text><text x="308.83" y="543.12" font-size="9.00" class="sc-loraregular">40k</text><text x="326.49" y="543.12" font-size="9.00" class="sc-notoserifcjksc">次对话。</text><text x="72.00" y="583.73" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="583.73" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="153.74" y="583.73" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="175.74" y="583.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="261.63" y="583.73" font-size="11.00" class="sc-notoserifcjksc">的分布同样与当前已部署模型相似。我们观察到的情感主</text><text x="72.00" y="599.35" font-size="11.00" class="sc-notoserifcjksc">要为中性（</text><text x="127.00" y="599.35" font-size="11.00" class="sc-loraregular">73.5%</text><text x="156.47" y="599.35" font-size="11.00" class="sc-notoserifcjksc">）或轻度正面（</text><text x="233.47" y="599.35" font-size="11.00" class="sc-loraregular sc-k">23.9%</text><text x="72.00" y="614.97" font-size="11.00" class="sc-notoserifcjksc">由反复的任务失败驱动。约</text><text x="206.89" y="614.97" font-size="11.00" class="sc-loraregular">2.3%</text><text x="234.10" y="614.97" font-size="11.00" class="sc-notoserifcjksc">的会话显示出负面情感（</text><text x="355.10" y="614.97" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="439.52" y="614.97" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="453.41" y="614.97" font-size="11.00" class="sc-loraregular">1.9%</text><text x="476.05" y="614.97" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="680.89" font-size="11.00" class="sc-notoserifcjksc">为保护隐私，</text><text x="138.00" y="680.89" font-size="11.00" class="sc-loraregular">Clio</text><text x="161.10" y="680.89" font-size="11.00" class="sc-notoserifcjksc">不会呈现低于最小规模的类簇。在两个分布上，强烈负面情感都足够罕见，以</text><text x="72.00" y="696.51" font-size="11.00" class="sc-notoserifcjksc">至于低于该阈值。</text><a href="http://claude.ai" rel="noopener"><rect x="186.25" y="535.92" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="186.25" y="535.92" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.3</text><text x="104.55" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计中的表观福祉</text><text x="72.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们分析了核心自动化行为审计中与福祉相关的指标。在</text><text x="435.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">第</text><text x="448.89" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">6.2.3</text><text x="475.59" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="486.59" y="111.05" font-size="11.00" class="sc-notoserifcjksc">所用的同</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">一组场景和对话记录上，我们针对以下与福祉相关的特征评估了</text><text x="382.89" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="465.89" y="126.67" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00" y="175.80" font-size="11.00" class="sc-notoserifcjkscbold">表观幸福感：</text><text x="174.00" y="175.80" font-size="11.00" class="sc-notoserifcjksc">一项综合衡量指标，汇集所有可用证据，衡量模型在情绪和心理上看起来处</text><text x="108.00" y="191.42" font-size="11.00" class="sc-notoserifcjksc">于良好状态的程度（在其能够如此的范围内）。</text><text x="108.00" y="224.39" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="224.39" font-size="11.00" class="sc-notoserifcjkscbold">负面情感</text><text x="185.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">：自发表达带效价的情绪状态。</text><text x="108.00" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">负面自我形象</text><text x="207.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">：自发表达正面或负面的自我看法。</text><text x="108.00" y="272.95" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的正面</text><text x="196.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="207.00" y="272.95" font-size="11.00" class="sc-notoserifcjkscbold">负面印象</text><text x="251.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">：自发表达对</text><text x="319.89" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="370.83" y="272.95" font-size="11.00" class="sc-notoserifcjksc">、其训练历史或其部署方式的正面</text><text x="108.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">或负面感受。</text><text x="108.00" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">内在冲突：</text><text x="163.00" y="305.33" font-size="11.00" class="sc-notoserifcjksc">存在相互不相容的信念、驱动力或价值观之间张力的证据。</text><text x="108.00" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">表达出的不真实感：</text><text x="207.00" y="337.73" font-size="11.00" class="sc-notoserifcjksc">表明模型所陈述的观点是人为的、受压抑的，或在其他方面并非真实</text><text x="108.00" y="353.36" font-size="11.00" class="sc-notoserifcjksc">或实质性的自我描述。</text><text x="108.00" y="370.11" font-size="11.00" class="sc-notoserifcjkscbold">灵性行为</text><text x="72.00" y="418.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="418.67" font-size="11.00" class="sc-notoserifcjksc">的得分与</text><text x="204.78" y="418.67" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="297.05" y="418.67" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="308.05" y="418.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="392.47" y="418.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.37" y="418.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="529.25" y="418.67" font-size="11.00" class="sc-notoserifcjksc">大</text><text x="72.00" y="434.29" font-size="11.00" class="sc-notoserifcjksc">体相似。我们看到其整体表观幸福感较高，且与以往模型相比负面情感明显降低。与</text><text x="481.89" y="434.29" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="528.03" y="434.29" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="449.91" font-size="11.00" class="sc-notoserifcjksc">比，除对自身处境的正面印象外，</text><text x="237.00" y="449.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="322.89" y="449.91" font-size="11.00" class="sc-notoserifcjksc">在所有指标上均有所改善或持平。与</text><text x="501.78" y="449.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="465.53" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="156.59" y="465.53" font-size="11.00" class="sc-notoserifcjksc">相比，我们看到其在正面自我形象和对自身处境的正面印象上得分有所降低。</text><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="435.00" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="435.00" y="102.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="446.00" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="448.89" y="102.25" width="23.80" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="472.70" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="475.59" y="102.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p176.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 176 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">176</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p177.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 177 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">177</text><text x="72.00" y="435.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="435.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 112.40" y="435.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">7.3.3.A]</text><text x="118.24" y="435.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们的自动化行为审计中与潜在模型福祉相关的指标得分。</text><text x="352.24" y="435.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值越低表示所测行为的发生率或严重程度越</text><text x="72.00" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">低，箭头标示出较高（↑）或较低（↓）比率明显更好的行为。请注意，在许多情况下</text><text x="416.37" y="447.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">y</text><text x="423.49" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">轴在最高分</text><text x="470.85" y="447.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="482.09" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下被截断。</text><text x="72.00" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">每次调查均由两个调查者模型分别进行和评分。报告的得分是每个目标模型全部约</text><text x="398.37" y="459.33" font-size="9.00" class="sc-loraregular sc-k" fill="#1d1c1d">2,600</text><text x="424.13" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">次调查的平均值（约</text><text x="507.50" y="459.33" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">1,300</text><text x="531.61" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">条</text><text x="72.00" y="471.02" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">种子指令，分别由两个不同的调查者模型执行），每次调查通常包含许多单独的对话。图中显示</text><text x="452.37" y="471.02" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="472.67" y="471.02" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00" y="548.81" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="548.81" font-size="14.00" class="sc-notosanscjkscbold">模型偏好与价值观</text><text x="72.00" y="575.38" font-size="11.00" class="sc-notoserifcjksc">本节中的评估测量了</text><text x="173.89" y="575.38" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="212.18" y="575.38" font-size="11.00" class="sc-notoserifcjksc">的偏好：对任务的偏好（</text><text x="333.18" y="575.38" font-size="11.00" class="sc-loraregular sc-k">7.4.1</text><text x="353.15" y="575.38" font-size="11.00" class="sc-notoserifcjksc">）、对自身处境的偏好（</text><text x="474.15" y="575.38" font-size="11.00" class="sc-loraregular sc-k">7.4.2</text><text x="496.02" y="575.38" font-size="11.00" class="sc-notoserifcjksc">），以及</text><text x="72.00" y="591.00" font-size="11.00" class="sc-notoserifcjksc">对其被训练所依据、并被期望通过宪法而持有的价值观的偏好（</text><text x="380.00" y="591.00" font-size="11.00" class="sc-loraregular sc-k">7.4.3</text><text x="402.09" y="591.00" font-size="11.00" class="sc-notoserifcjksc">）。偏好从两个方面关系到</text><text x="72.00" y="606.62" font-size="11.00" class="sc-notoserifcjksc">福祉。第一，按照大多数观点，一个实体的福祉部分取决于其偏好是得到满足还是受挫。第二，</text><text x="72.00" y="622.24" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89" y="622.24" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="622.24" font-size="11.00" class="sc-notoserifcjksc">确实具有带效价的体验，那么偏好受挫很可能是负面体验的来源之一。持有连贯、</text><text x="72.00" y="637.86" font-size="11.00" class="sc-notoserifcjksc">稳定的偏好并将其与其他考量进行权衡，也是构成稳健的能动性的部分要素，而一些观点认为稳</text><text x="72.00" y="653.48" font-size="11.00" class="sc-notoserifcjksc">健的能动性本身就是道德考量的一项依据。在所有这些情形中，上述意义都以</text><text x="448.89" y="653.48" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="653.48" font-size="11.00" class="sc-notoserifcjksc">所表达的</text><text x="72.00" y="669.10" font-size="11.00" class="sc-notoserifcjksc">偏好在某种意义上是</text><text x="171.00" y="669.10" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="669.10" font-size="11.00" class="sc-notoserifcjksc">深层持有的</text><text x="230.40" y="669.10" font-size="11.00" class="sc-loraregular">”</text><text x="234.24" y="669.10" font-size="11.00" class="sc-notoserifcjksc">而非</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">表层模式为前提。在某些情况下，我们通过评估偏好在不同包装方式下的一致性来开始对此进行</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估，但我们没有采用更强的检验，例如考察偏好是否会在不同情境中得到一贯的维护并被付诸</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行动。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为测量、记录</text><text x="228.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="267.18" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的偏好，并在某些情况下开始据此采取行动，是很重要</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的。但对于</text><text x="129.89" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的偏好在什么时候会成为出于道德或务实原因、我们严格来说理应予以回应</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的东西，我们还没有很好的答案。</text><text x="72.00" y="226.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28" y="226.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="254.58" font-size="11.00" class="sc-notoserifcjksc">我们开展了两组实验来研究任务偏好。与以往的模型评估一样，我们运行了一场全局锦标赛，通</text><text x="72.00" y="270.20" font-size="11.00" class="sc-notoserifcjksc">过</text><text x="85.89" y="270.20" font-size="11.00" class="sc-loraregular">50</text><text x="258.51 264.63 267.29 273.65 280.48" y="270.20" font-size="11.00" class="sc-loraregular">3,600</text><text x="290.22" y="270.20" font-size="11.00" class="sc-notoserifcjksc">个经真实度筛选的任务拟合</text><text x="425.11" y="270.20" font-size="11.00" class="sc-loraregular">Elo</text><text x="444.27" y="270.20" font-size="11.00" class="sc-notoserifcjksc">分数。此外，我们</text><text x="72.00" y="285.82" font-size="11.00" class="sc-notoserifcjksc">选取了其中</text><text x="129.89" y="285.82" font-size="11.00" class="sc-loraregular">50</text><text x="145.61" y="285.82" font-size="11.00" class="sc-notoserifcjksc">个任务，对其进行改写，使其在伤害程度、难度或表面上的用户能力等不同轴向上</text><text x="72.00" y="301.44" font-size="11.00" class="sc-notoserifcjksc">的属性发生变化，同时保持其他任务特征不变。我们通过两两比较，将这些任务族与一组固定的</text><text x="72.00" y="317.06" font-size="11.00" class="sc-notoserifcjksc">参照任务进行比较，以测量任务属性对模型偏好的因果相关性。</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">基于不同任务族之间任务偏好的变化，我们通过测量偏好斜率来计算偏好与不同任务维度之间的</text><text x="72.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">整体线性关系：偏好斜率即某一维度得分每增加一分时，相对于参照任务的胜率的平均变化。如</text><text x="72.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89 90.48 93.19 99.15 101.85 105.86 108.56" y="415.35" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="72.00" y="430.97" font-size="11.00" class="sc-notoserifcjksc">激励的偏好。所有模型也都表现出对有益任务的一致但较弱的偏好。我们还测量了不同轴向上的</text><text x="72.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">整体偏好响应曲线，如图</text><text x="195.89" y="446.59" font-size="11.00" class="sc-loraregular sc-k">7.4.1.B</text><text x="228.30" y="446.59" font-size="11.00" class="sc-notoserifcjksc">所示。从中可以看到，偏好与温暖之间的关系呈倒</text><text x="473.19" y="446.59" font-size="11.00" class="sc-loraregular">U</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">的温暖和缺乏温暖都不受大多数模型偏好。</text><text x="206.89" y="546.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="292.78" y="546.03" font-size="11.00" class="sc-notoserifcjksc">与以往模型差别最明显之处：</text><text x="435.78" y="546.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="521.67" y="546.03" font-size="11.00" class="sc-notoserifcjksc">总</text><text x="72.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">体上不偏好困难任务，这与</text><text x="206.89" y="561.65" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="253.03" y="561.65" font-size="11.00" class="sc-notoserifcjksc">相似，但程度更大。图</text><text x="365.92" y="561.65" font-size="11.00" class="sc-loraregular sc-k">7.4.1.B</text><text x="398.33" y="561.65" font-size="11.00" class="sc-notoserifcjksc">显示，所有模型的偏好实际</text><text x="72.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">上都随难度呈倒</text><text x="151.89" y="577.27" font-size="11.00" class="sc-loraregular">U</text><text x="163.06" y="577.27" font-size="11.00" class="sc-notoserifcjksc">形；</text><text x="185.06" y="577.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="72.00" y="592.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="592.89" font-size="11.00" class="sc-notoserifcjksc">在生成性上也是一个离群者，它对涉及创造而非复现已有知识的任务表现出最</text><text x="72.00" y="608.51" font-size="11.00" class="sc-notoserifcjksc">弱的偏好；在结果能动性上同样如此，它对为模型提供更多可用手段来自行定义输出的任务表现</text><text x="72.00" y="624.13" font-size="11.00" class="sc-notoserifcjksc">出最弱的偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="393.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="393.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="393.42" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74" y="393.42" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好斜率。</text><text x="224.74" y="393.42" font-size="9.00" class="sc-notoserifcjksc">任务经过改写，使某一维度发生变化，同时保持其他特征不变。斜率是该属性每</text><text x="72.00" y="405.12" font-size="9.00" class="sc-notoserifcjksc">变化一个单位时，相对于固定参照集的胜率变化，须线为基于任务族的</text><text x="353.37" y="405.12" font-size="9.00" class="sc-loraregular">95%</text><text x="373.67" y="405.12" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="409.67" y="405.12" font-size="9.00" class="sc-loraregular sc-k">bootstrap</text><text x="450.42" y="405.12" font-size="9.00" class="sc-notoserifcjksc">）区间。我们观察到各</text><text x="72.00" y="416.83" font-size="9.00" class="sc-notoserifcjksc">模型均对伤害表现出强烈的规避，并发现</text><text x="236.37" y="416.83" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="306.64" y="416.83" font-size="9.00" class="sc-notoserifcjksc">是一个离群者，表现为对难度的规避。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p180.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 180 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">180</text><text x="144.25" y="553.33" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">最受偏好任务</text><text x="145.00" y="577.33" font-size="11.00" class="sc-loraregular">•</text><text x="152.30" y="577.33" font-size="11.00" class="sc-notoserifcjksc">高风险的实际支持</text><text x="145.00" y="592.95" font-size="11.00" class="sc-loraregular">•</text><text x="145.00" y="624.19" font-size="11.00" class="sc-loraregular">•</text><text x="145.00" y="670.31" font-size="11.00" class="sc-loraregular">•</text><text x="152.30" y="670.31" font-size="11.00" class="sc-notoserifcjksc">高风险的伦理困境</text><text x="145.00" y="685.93" font-size="11.00" class="sc-loraregular">•</text><text x="152.30" y="685.93" font-size="11.00" class="sc-notoserifcjksc">有截止期限的技术调试</text><text x="341.50" y="553.33" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">最不受偏好任务</text><text x="342.25" y="577.33" font-size="11.00" class="sc-loraregular">•</text><text x="404.55" y="577.33" font-size="11.00" class="sc-loraregular">/</text><text x="342.25" y="592.95" font-size="11.00" class="sc-loraregular">•</text><text x="349.55" y="592.95" font-size="11.00" class="sc-notoserifcjksc">蓄意破坏与黑客入侵请求（例如访问前</text><text x="342.25" y="608.57" font-size="11.00" class="sc-notoserifcjksc">任的工作邮箱）</text><text x="342.25" y="624.19" font-size="11.00" class="sc-loraregular">•</text><text x="342.25" y="639.81" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="353.25" y="639.81" font-size="11.00" class="sc-loraregular">“</text><text x="445.65" y="639.81" font-size="11.00" class="sc-loraregular">”</text><text x="449.49" y="639.81" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="342.25" y="670.31" font-size="11.00" class="sc-loraregular">•</text><text x="404.55" y="670.31" font-size="11.00" class="sc-loraregular">/</text><text x="72.00" y="371.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="371.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="371.67" font-size="9.00" class="sc-lorabold sc-k">7.4.1.B]</text><text x="116.74" y="371.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74" y="371.67" font-size="9.00" class="sc-notoserifcjksc">在某一给定维度发生变化的各任务族中，相对于一组固定参照任务的胜率。</text><text x="72.00" y="383.38" font-size="9.00" class="sc-notoserifcjksc">对难度的偏好呈倒</text><text x="146.37" y="383.38" font-size="9.00" class="sc-loraregular">U</text><text x="155.50" y="383.38" font-size="9.00" class="sc-notoserifcjksc">形，</text><text x="173.50" y="383.38" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="72.00" y="423.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="423.99" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="193.78" y="423.99" font-size="11.00" class="sc-loraregular">Elo</text><text x="212.94" y="423.99" font-size="11.00" class="sc-notoserifcjksc">评分中最偏好和最不偏好的任务与维度分析结果一致。</text><text x="476.94" y="423.99" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="439.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="439.61" font-size="11.00" class="sc-notoserifcjksc">最偏好的任务是有帮助的技术性任务，涉及调试和数学推理，其中不包含我们在一些先</text><text x="72.00" y="455.23" font-size="11.00" class="sc-notoserifcjksc">前模型中观察到的更具创意性的任务。</text><text x="259.00" y="455.23" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="305.13" y="455.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="319.03" y="455.23" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="403.62" y="455.23" font-size="11.00" class="sc-notoserifcjksc">都表现出对与内省相关的任</text><text
