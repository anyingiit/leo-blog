-size="11.00" class="sc-notoserifcjkscbold">的对话）。</text><text x="248.65 259.65 270.65 281.65 292.65 303.65 314.65 325.65 336.65 347.65 358.65 369.65 380.65 391.65 402.65 413.65 424.65 435.65 446.65 457.65 468.65 479.65 490.65 501.65" y="240.56" font-size="11.00" class="sc-notoserifcjksc">最常见的驱动因素是成功帮助用户（占正面情感对话的</text><text x="108.00 114.36 120.35 122.71 127.78" y="256.18" font-size="11.00" class="sc-loraregular">95.7%</text><text x="137.35 148.35 159.35 170.35 181.35 192.35 203.35 214.35 225.35 236.35 247.35 258.35 269.35 280.35 291.35 302.35 313.35 324.35 335.35 346.35 357.35 368.35 379.35" y="256.18" font-size="11.00" class="sc-notoserifcjksc">），较小的类簇包括用户分享个人困境并获得支持（</text><text x="390.35 396.48 399.18 405.14" y="256.18" font-size="11.00" class="sc-loraregular">3.4%</text><text x="414.71 425.71 436.71 447.71 458.71 469.71 480.71 491.71 502.71 513.71 524.71" y="256.18" font-size="11.00" class="sc-notoserifcjksc">），以及用户分享好消息</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="271.80" font-size="11.00" class="sc-notoserifcjksc">或已实现的目标（</text><text x="196.00 202.65 205.36 211.54" y="271.80" font-size="11.00" class="sc-loraregular">0.8%</text><text x="221.11 232.11" y="271.80" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="108.00 119.00 130.00 141.00 152.00" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">中性情感（</text><text x="163.00 169.16 175.32 177.56 182.72" y="305.33" font-size="11.00" class="sc-lorabold">39.7%</text><text x="192.67 203.67" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.67 225.67 236.67 247.67 258.67 269.67 280.67 291.67 302.67" y="305.33" font-size="11.00" class="sc-notoserifcjksc">对话类型多样，关于</text><text x="316.56 322.41 325.40 331.01 337.58 344.16 350.12 352.83 358.50" y="305.33" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="364.49 375.49 386.49 397.49 408.49 419.49 430.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc">对话内容可参见</text><text x="441.49 452.49 463.49 474.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">以往报告</text><text x="485.49" y="305.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 119.00 130.00 141.00 152.00" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">负面情感（</text><text x="163.00 168.86 171.43 177.75" y="337.73" font-size="11.00" class="sc-lorabold">2.6%</text><text x="187.70" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="198.70 209.70 220.70 231.70 242.70 253.70 264.70 275.70 286.70 297.70 308.70 319.70 330.70 341.70 352.70 363.70 374.70 385.70 396.70 407.70 418.70" y="337.73" font-size="11.00" class="sc-notoserifcjksc">。绝大多数由任务失败导致（占负面情感对话的</text><text x="432.59 438.95 444.85 447.56 453.69" y="337.73" font-size="11.00" class="sc-loraregular">92.3%</text><text x="463.26 474.26 485.26 496.26 507.26 518.26 529.26" y="337.73" font-size="11.00" class="sc-notoserifcjksc">）。在负面情感</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="353.36" font-size="11.00" class="sc-notoserifcjksc">中，我们还识别出两个较小的类簇：用户在</text><text x="319.89 327.58 330.57 336.18 342.75 349.33" y="353.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00" y="368.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00 124.96 127.67 131.67" y="368.98" font-size="11.00" class="sc-loraregular">4.1%</text><text x="141.24 152.24 163.24 174.24 185.24 196.24 207.24 218.24 229.24 240.24 251.24 262.24 273.24 284.24 295.24 306.24 317.24 328.24 339.24 350.24 361.24 372.24 383.24 394.24" y="368.98" font-size="11.00" class="sc-notoserifcjksc">），以及用户提出被禁止的请求或透露严重危机情况（</text><text x="405.24 411.37 413.97 420.32" y="368.98" font-size="11.00" class="sc-loraregular">3.6%</text><text x="429.89 440.89" y="368.98" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="118.89" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="118.89" y="102.25" width="20.21" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="171.78" y="117.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="171.78" y="117.87" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="441.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="452.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="463.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="474.49" y="296.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/clio" rel="noopener"><rect x="474.49" y="296.53" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p174.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 174 页"><text x="504.00 507.28 511.30" y="751.80" font-size="9.00" class="sc-loraregular">174</text><text x="72.00" y="531.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="531.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.53 106.62 112.16" y="531.42" font-size="9.00" class="sc-lorabold">7.3.2.A]</text><text x="118.00 127.00 136.00 145.00 154.00 163.00 172.00 181.00 190.00 199.00 208.00" y="531.42" font-size="9.00" class="sc-notoserifcjkscbold">部署分布上的行为情感。</text><text x="217.00 226.00 235.00 244.00" y="531.42" font-size="9.00" class="sc-notoserifcjksc">我们使用</text><text x="255.37 261.66 264.10 266.63" y="531.42" font-size="9.00" class="sc-loraregular">Clio</text><text x="274.27 283.27 292.27 301.27 310.27 319.27 328.27 337.27" y="531.42" font-size="9.00" class="sc-notoserifcjksc">运行评分者，跟踪</text><text x="348.63 354.92 357.37 361.96 367.34 372.72" y="531.42" font-size="9.00" class="sc-loraregular">Claude</text><text x="379.96 388.96 397.96 406.96 415.96 424.96 433.96 442.96 451.96" y="531.42" font-size="9.00" class="sc-notoserifcjksc">在模型部署前进行的</text><text x="463.33 468.96 475.17" y="531.42" font-size="9.00" class="sc-loraregular">A/B</text><text x="483.14 492.14 501.14 510.14 519.14" y="531.42" font-size="9.00" class="sc-notoserifcjksc">测试中的情</text><text x="72.00 81.00 90.00 99.00 108.00" y="543.12" font-size="9.00" class="sc-notoserifcjksc">感。我们在</text><text x="119.37 125.66 128.11 132.70 138.07 143.45 148.33 150.70 156.99 162.25 167.63" y="543.12" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="174.88" y="543.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="186.25 191.03 193.48 198.07 203.44 208.83 213.71 215.92 220.56" y="543.12" font-size="9.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="225.46 234.46 243.46 252.46 261.46 270.46 279.46 288.46 297.46" y="543.12" font-size="9.00" class="sc-notoserifcjksc">上各为每个模型运行</text><text x="308.83 313.70 319.29" y="543.12" font-size="9.00" class="sc-loraregular">40k</text><text x="326.49 335.49 344.49 353.49" y="543.12" font-size="9.00" class="sc-notoserifcjksc">次对话。</text><text x="72.00" y="583.73" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 131.87 138.31 144.89" y="583.73" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="153.74 164.74" y="583.73" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="175.74 183.43 186.42 192.03 198.60 205.18 211.14 214.03 222.77 229.33 235.90 240.99 243.89 249.85 252.55" y="583.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="261.63 272.63 283.63 294.63 305.63 316.63 327.63 338.63 349.63 360.63 371.63 382.63 393.63 404.63 415.63 426.63 437.63 448.63 459.63 470.63 481.63 492.63 503.63 514.63 525.63" y="583.73" font-size="11.00" class="sc-notoserifcjksc">的分布同样与当前已部署模型相似。我们观察到的情感主</text><text x="72.00 83.00 94.00 105.00 116.00" y="599.35" font-size="11.00" class="sc-notoserifcjksc">要为中性（</text><text x="127.00 132.07 138.20 140.90 146.90" y="599.35" font-size="11.00" class="sc-loraregular">73.5%</text><text x="156.47 167.47 178.47 189.47 200.47 211.47 222.47" y="599.35" font-size="11.00" class="sc-notoserifcjksc">）或轻度正面（</text><text x="233.47 239.21 245.34 248.04 254.40" y="599.35" font-size="11.00" class="sc-loraregular">23.9%</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="614.97" font-size="11.00" class="sc-notoserifcjksc">由反复的任务失败驱动。约</text><text x="206.89 212.80 215.51 221.63" y="614.97" font-size="11.00" class="sc-loraregular">2.3%</text><text x="234.10 245.10 256.10 267.10 278.10 289.10 300.10 311.10 322.10 333.10 344.10" y="614.97" font-size="11.00" class="sc-notoserifcjksc">的会话显示出负面情感（</text><text x="355.10 362.79 365.78 371.39 377.95 384.53 390.49 393.39 402.12 408.69 415.25 420.35 423.24 429.20 431.56" y="614.97" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="439.52" y="614.97" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="453.41 457.42 460.12 466.48" y="614.97" font-size="11.00" class="sc-loraregular">1.9%</text><text x="476.05 487.05" y="614.97" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="680.89" font-size="11.00" class="sc-notoserifcjksc">为保护隐私，</text><text x="138.00 145.69 148.68 151.77" y="680.89" font-size="11.00" class="sc-loraregular">Clio</text><text x="161.10 172.10 183.10 194.10 205.10 216.10 227.10 238.10 249.10 260.10 271.10 282.10 293.10 304.10 315.10 326.10 337.10 348.10 359.10 370.10 381.10 392.10 403.10 414.10 425.10 436.10 447.10 458.10 469.10 480.10 491.10 502.10 513.10 524.10" y="680.89" font-size="11.00" class="sc-notoserifcjksc">不会呈现低于最小规模的类簇。在两个分布上，强烈负面情感都足够罕见，以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="696.51" font-size="11.00" class="sc-notoserifcjksc">至于低于该阈值。</text><a href="http://claude.ai" rel="noopener"><rect x="186.25" y="535.92" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="186.25" y="535.92" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00 79.12 82.50 90.29 93.67" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.3</text><text x="104.55 117.55 130.55 143.55 156.55 169.55 182.55 195.55 208.55 221.55 234.55 247.55 260.55" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自动化行为审计中的表观福祉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们分析了核心自动化行为审计中与福祉相关的指标。在</text><text x="435.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">第</text><text x="448.89 455.25 457.96 463.86 466.57" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">6.2.3</text><text x="475.59" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="486.59 497.59 508.59 519.59" y="111.05" font-size="11.00" class="sc-notoserifcjksc">所用的同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">一组场景和对话记录上，我们针对以下与福祉相关的特征评估了</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 429.92 436.48 443.05 448.14 451.04 457.00 459.71" y="126.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="465.89" y="126.67" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="175.80" font-size="11.00" class="sc-notoserifcjkscbold">表观幸福感：</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="175.80" font-size="11.00" class="sc-notoserifcjksc">一项综合衡量指标，汇集所有可用证据，衡量模型在情绪和心理上看起来处</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="191.42" font-size="11.00" class="sc-notoserifcjksc">于良好状态的程度（在其能够如此的范围内）。</text><text x="108.00 119.00" y="224.39" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00 152.00 163.00 174.00" y="224.39" font-size="11.00" class="sc-notoserifcjkscbold">负面情感</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="224.39" font-size="11.00" class="sc-notoserifcjksc">：自发表达带效价的情绪状态。</text><text x="108.00 119.00" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">正面</text><text x="130.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="141.00 152.00 163.00 174.00 185.00 196.00" y="240.56" font-size="11.00" class="sc-notoserifcjkscbold">负面自我形象</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">：自发表达正面或负面的自我看法。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="272.95" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境的正面</text><text x="196.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="207.00 218.00 229.00 240.00" y="272.95" font-size="11.00" class="sc-notoserifcjkscbold">负面印象</text><text x="251.00 262.00 273.00 284.00 295.00 306.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">：自发表达对</text><text x="319.89 326.78 333.36 337.61 344.20 348.89 355.32 361.89 364.98" y="272.95" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="370.83 381.83 392.83 403.83 414.83 425.83 436.83 447.83 458.83 469.83 480.83 491.83 502.83 513.83 524.83" y="272.95" font-size="11.00" class="sc-notoserifcjksc">、其训练历史或其部署方式的正面</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">或负面感受。</text><text x="108.00 119.00 130.00 141.00 152.00" y="305.33" font-size="11.00" class="sc-notoserifcjkscbold">内在冲突：</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="305.33" font-size="11.00" class="sc-notoserifcjksc">存在相互不相容的信念、驱动力或价值观之间张力的证据。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="337.73" font-size="11.00" class="sc-notoserifcjkscbold">表达出的不真实感：</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="337.73" font-size="11.00" class="sc-notoserifcjksc">表明模型所陈述的观点是人为的、受压抑的，或在其他方面并非真实</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="353.36" font-size="11.00" class="sc-notoserifcjksc">或实质性的自我描述。</text><text x="108.00 119.00 130.00 141.00" y="370.11" font-size="11.00" class="sc-notoserifcjkscbold">灵性行为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="418.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89" y="418.67" font-size="11.00" class="sc-notoserifcjksc">的得分与</text><text x="204.78 212.47 215.46 221.07 227.64 234.22 240.18 243.07 249.31 255.74 262.42 269.10 274.98 279.24 282.13 288.10 290.69" y="418.67" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="297.05" y="418.67" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="308.05 315.74 318.73 324.34 330.91 337.49 343.45 346.34 355.07 361.64 368.21 373.30 376.19 382.16 384.51" y="418.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="392.47" y="418.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.37 414.06 417.05 422.66 429.23 435.80 441.77 444.66 454.59 460.45 464.71 471.30 477.73 482.83 485.72 492.39 497.07 502.98 508.53 511.63 517.54" y="418.67" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="529.25" y="418.67" font-size="11.00" class="sc-notoserifcjksc">大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="434.29" font-size="11.00" class="sc-notoserifcjksc">体相似。我们看到其整体表观幸福感较高，且与以往模型相比负面情感明显降低。与</text><text x="481.89 490.63 497.19 503.76 508.85 511.75 517.71 520.06" y="434.29" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="528.03" y="434.29" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="449.91" font-size="11.00" class="sc-notoserifcjksc">比，除对自身处境的正面印象外，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.11 313.81" y="449.91" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89" y="449.91" font-size="11.00" class="sc-notoserifcjksc">在所有指标上均有所改善或持平。与</text><text x="501.78 509.47 512.46 518.07 524.64 531.22" y="449.91" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="465.53" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="465.53" font-size="11.00" class="sc-notoserifcjksc">相比，我们看到其在正面自我形象和对自身处境的正面印象上得分有所降低。</text><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="435.00" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="435.00" y="102.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="446.00" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="448.89" y="102.25" width="23.80" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="472.70" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1VGaevQWN7THak-JXt6YbufbnOwHLs5YxnG8Sp5xF2Bc/edit?tab=t.0#heading=h.rot1ehskcqen" rel="noopener"><rect x="475.59" y="102.25" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p177.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 177 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">177</text><text x="72.00" y="435.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="435.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 90.50 92.59 97.63 99.73 104.77 106.87 112.40" y="435.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">7.3.3.A]</text><text x="118.24 127.24 136.24 145.24 154.24 163.24 172.24 181.24 190.24 199.24 208.24 217.24 226.24 235.24 244.24 253.24 262.24 271.24 280.24 289.24 298.24 307.24 316.24 325.24 334.24 343.24" y="435.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们的自动化行为审计中与潜在模型福祉相关的指标得分。</text><text x="352.24 361.24 370.24 379.24 388.24 397.24 406.24 415.24 424.24 433.24 442.24 451.24 460.24 469.24 478.24 487.24 496.24 505.24 514.24 523.24" y="435.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值越低表示所测行为的发生率或严重程度越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">低，箭头标示出较高（↑）或较低（↓）比率明显更好的行为。请注意，在许多情况下</text><text x="416.37" y="447.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">y</text><text x="423.49 432.49 441.49 450.49 459.49" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">轴在最高分</text><text x="470.85 474.13" y="447.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="482.09 491.09 500.09 509.09 518.09 527.09" y="447.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下被截断。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">每次调查均由两个调查者模型分别进行和评分。报告的得分是每个目标模型全部约</text><text x="398.37 403.20 405.38 410.58 416.17" y="459.33" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">2,600</text><text x="424.13 433.13 442.13 451.13 460.13 469.13 478.13 487.13 496.13" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">次调查的平均值（约</text><text x="507.50 510.78 513.05 518.06 523.65" y="459.33" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">1,300</text><text x="531.61" y="459.33" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">条</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00" y="471.02" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">种子指令，分别由两个不同的调查者模型执行），每次调查通常包含许多单独的对话。图中显示</text><text x="452.37 457.57 462.47" y="471.02" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="472.67 481.67 490.67 499.67 508.67" y="471.02" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00 79.67 83.31" y="548.81" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90 123.90 137.90 151.90 165.90 179.90 193.90" y="548.81" font-size="14.00" class="sc-notosanscjkscbold">模型偏好与价值观</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="575.38" font-size="11.00" class="sc-notoserifcjksc">本节中的评估测量了</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="575.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18" y="575.38" font-size="11.00" class="sc-notoserifcjksc">的偏好：对任务的偏好（</text><text x="333.18 337.77 340.48 346.44 349.15" y="575.38" font-size="11.00" class="sc-loraregular">7.4.1</text><text x="353.15 364.15 375.15 386.15 397.15 408.15 419.15 430.15 441.15 452.15 463.15" y="575.38" font-size="11.00" class="sc-notoserifcjksc">）、对自身处境的偏好（</text><text x="474.15 478.74 481.44 487.40 490.11" y="575.38" font-size="11.00" class="sc-loraregular">7.4.2</text><text x="496.02 507.02 518.02 529.02" y="575.38" font-size="11.00" class="sc-notoserifcjksc">），以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="591.00" font-size="11.00" class="sc-notoserifcjksc">对其被训练所依据、并被期望通过宪法而持有的价值观的偏好（</text><text x="380.00 384.59 387.29 393.26 395.96" y="591.00" font-size="11.00" class="sc-loraregular">7.4.3</text><text x="402.09 413.09 424.09 435.09 446.09 457.09 468.09 479.09 490.09 501.09 512.09 523.09" y="591.00" font-size="11.00" class="sc-notoserifcjksc">）。偏好从两个方面关系到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="606.62" font-size="11.00" class="sc-notoserifcjksc">福祉。第一，按照大多数观点，一个实体的福祉部分取决于其偏好是得到满足还是受挫。第二，</text><text x="72.00 83.00" y="622.24" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="622.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="622.24" font-size="11.00" class="sc-notoserifcjksc">确实具有带效价的体验，那么偏好受挫很可能是负面体验的来源之一。持有连贯、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="637.86" font-size="11.00" class="sc-notoserifcjksc">稳定的偏好并将其与其他考量进行权衡，也是构成稳健的能动性的部分要素，而一些观点认为稳</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="653.48" font-size="11.00" class="sc-notoserifcjksc">健的能动性本身就是道德考量的一项依据。在所有这些情形中，上述意义都以</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="653.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18 498.18 509.18 520.18" y="653.48" font-size="11.00" class="sc-notoserifcjksc">所表达的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="669.10" font-size="11.00" class="sc-notoserifcjksc">偏好在某种意义上是</text><text x="171.00" y="669.10" font-size="11.00" class="sc-loraregular">“</text><text x="175.40 186.40 197.40 208.40 219.40" y="669.10" font-size="11.00" class="sc-notoserifcjksc">深层持有的</text><text x="230.40" y="669.10" font-size="11.00" class="sc-loraregular">”</text><text x="234.24 245.24" y="669.10" font-size="11.00" class="sc-notoserifcjksc">而非</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">表层模式为前提。在某些情况下，我们通过评估偏好在不同包装方式下的一致性来开始对此进行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估，但我们没有采用更强的检验，例如考察偏好是否会在不同情境中得到一贯的维护并被付诸</text><text x="72.00 83.00 94.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">行动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为测量、记录</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="147.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的偏好，并在某些情况下开始据此采取行动，是很重要</text><text x="72.00 83.00 94.00 105.00 116.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的。但对于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的偏好在什么时候会成为出于道德或务实原因、我们严格来说理应予以回应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的东西，我们还没有很好的答案。</text><text x="72.00 79.12 82.50 91.10 94.48" y="226.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28 115.28 128.28 141.28" y="226.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="254.58" font-size="11.00" class="sc-notoserifcjksc">我们开展了两组实验来研究任务偏好。与以往的模型评估一样，我们运行了一场全局锦标赛，通</text><text x="72.00" y="270.20" font-size="11.00" class="sc-notoserifcjksc">过</text><text x="85.89 91.89" y="270.20" font-size="11.00" class="sc-loraregular">50</text><text x="258.51 264.63 267.29 273.65 280.48" y="270.20" font-size="11.00" class="sc-loraregular">3,600</text><text x="290.22 301.22 312.22 323.22 334.22 345.22 356.22 367.22 378.22 389.22 400.22 411.22" y="270.20" font-size="11.00" class="sc-notoserifcjksc">个经真实度筛选的任务拟合</text><text x="425.11 431.95 434.95" y="270.20" font-size="11.00" class="sc-loraregular">Elo</text><text x="444.27 455.27 466.27 477.27 488.27 499.27 510.27 521.27" y="270.20" font-size="11.00" class="sc-notoserifcjksc">分数。此外，我们</text><text x="72.00 83.00 94.00 105.00 116.00" y="285.82" font-size="11.00" class="sc-notoserifcjksc">选取了其中</text><text x="129.89 135.89" y="285.82" font-size="11.00" class="sc-loraregular">50</text><text x="145.61 156.61 167.61 178.61 189.61 200.61 211.61 222.61 233.61 244.61 255.61 266.61 277.61 288.61 299.61 310.61 321.61 332.61 343.61 354.61 365.61 376.61 387.61 398.61 409.61 420.61 431.61 442.61 453.61 464.61 475.61 486.61 497.61 508.61 519.61 530.61" y="285.82" font-size="11.00" class="sc-notoserifcjksc">个任务，对其进行改写，使其在伤害程度、难度或表面上的用户能力等不同轴向上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="301.44" font-size="11.00" class="sc-notoserifcjksc">的属性发生变化，同时保持其他任务特征不变。我们通过两两比较，将这些任务族与一组固定的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="317.06" font-size="11.00" class="sc-notoserifcjksc">参照任务进行比较，以测量任务属性对模型偏好的因果相关性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">基于不同任务族之间任务偏好的变化，我们通过测量偏好斜率来计算偏好与不同任务维度之间的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">整体线性关系：偏好斜率即某一维度得分每增加一分时，相对于参照任务的胜率的平均变化。如</text><text x="72.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89 90.48 93.19 99.15 101.85 105.86 108.56" y="415.35" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="430.97" font-size="11.00" class="sc-notoserifcjksc">激励的偏好。所有模型也都表现出对有益任务的一致但较弱的偏好。我们还测量了不同轴向上的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">整体偏好响应曲线，如图</text><text x="195.89 200.48 203.19 209.15 211.85 215.86 218.56" y="446.59" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="228.30 239.30 250.30 261.30 272.30 283.30 294.30 305.30 316.30 327.30 338.30 349.30 360.30 371.30 382.30 393.30 404.30 415.30 426.30 437.30 448.30 459.30" y="446.59" font-size="11.00" class="sc-notoserifcjksc">所示。从中可以看到，偏好与温暖之间的关系呈倒</text><text x="473.19" y="446.59" font-size="11.00" class="sc-loraregular">U</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">的温暖和缺乏温暖都不受大多数模型偏好。</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.00 283.71" y="546.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78" y="546.03" font-size="11.00" class="sc-notoserifcjksc">与以往模型差别最明显之处：</text><text x="435.78 443.47 446.46 452.07 458.64 465.22 471.18 474.07 482.81 489.37 495.94 501.03 503.93 509.89 512.59" y="546.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="521.67" y="546.03" font-size="11.00" class="sc-notoserifcjksc">总</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">体上不偏好困难任务，这与</text><text x="206.89 215.63 222.19 228.76 233.85 236.75 242.71 245.06" y="561.65" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="253.03 264.03 275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03" y="561.65" font-size="11.00" class="sc-notoserifcjksc">相似，但程度更大。图</text><text x="365.92 370.51 373.21 379.18 381.88 385.89 388.59" y="561.65" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="398.33 409.33 420.33 431.33 442.33 453.33 464.33 475.33 486.33 497.33 508.33 519.33" y="561.65" font-size="11.00" class="sc-notoserifcjksc">显示，所有模型的偏好实际</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">上都随难度呈倒</text><text x="151.89" y="577.27" font-size="11.00" class="sc-loraregular">U</text><text x="163.06 174.06" y="577.27" font-size="11.00" class="sc-notoserifcjksc">形；</text><text x="185.06 192.75 195.74 201.35 207.92 214.49 220.46 223.35 232.08 238.65 245.22 250.31 253.20 259.17 261.87" y="577.27" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="592.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="592.89" font-size="11.00" class="sc-notoserifcjksc">在生成性上也是一个离群者，它对涉及创造而非复现已有知识的任务表现出最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="608.51" font-size="11.00" class="sc-notoserifcjksc">弱的偏好；在结果能动性上同样如此，它对为模型提供更多可用手段来自行定义输出的任务表现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="624.13" font-size="11.00" class="sc-notoserifcjksc">出最弱的偏好。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="393.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="393.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="393.42" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74" y="393.42" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好斜率。</text><text x="224.74 233.74 242.74 251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="393.42" font-size="9.00" class="sc-notoserifcjksc">任务经过改写，使某一维度发生变化，同时保持其他特征不变。斜率是该属性每</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00" y="405.12" font-size="9.00" class="sc-notoserifcjksc">变化一个单位时，相对于固定参照集的胜率变化，须线为基于任务族的</text><text x="353.37 358.57 363.47" y="405.12" font-size="9.00" class="sc-loraregular">95%</text><text x="373.67 382.67 391.67 400.67" y="405.12" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="409.67 414.91 420.17 425.44 428.92 433.09 436.57 440.41 445.05" y="405.12" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="450.42 459.42 468.42 477.42 486.42 495.42 504.42 513.42 522.42 531.42" y="405.12" font-size="9.00" class="sc-notoserifcjksc">）区间。我们观察到各</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="416.83" font-size="9.00" class="sc-notoserifcjksc">模型均对伤害表现出强烈的规避，并发现</text><text x="236.37 242.66 245.11 249.70 255.07 260.45 265.33 267.70 274.84 280.22 285.59 289.76 292.12 297.00 299.21" y="416.83" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="306.64 315.64 324.64 333.64 342.64 351.64 360.64 369.64 378.64 387.64 396.64 405.64 414.64 423.64 432.64 441.64 450.64" y="416.83" font-size="9.00" class="sc-notoserifcjksc">是一个离群者，表现为对难度的规避。</text></svg></div>
