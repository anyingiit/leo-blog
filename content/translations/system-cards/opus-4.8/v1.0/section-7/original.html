"sc-notoserifcjksc">动过手脚</text><text x="355.50" y="133.22" font-size="11.00" class="sc-loraregular">”</text><text x="359.34" y="133.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="161.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="161.05" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 90.50 92.59 97.52 99.61 103.27 105.36 110.90 114.37 116.74 122.93 125.74 130.46 136.02 141.38 146.22 148.59 155.51 160.92 166.48 170.85 173.21 178.14 180.23" y="161.05" font-size="9.00" class="sc-lorabold">7.4.1.B] Claude Opus 4.8</text><text x="187.75 196.75 205.75 214.75 223.75 232.75 241.75 250.75 259.75 268.75 277.75" y="161.05" font-size="9.00" class="sc-notoserifcjkscbold">排名最高和最低任务摘要</text><text x="286.75 295.75" y="161.05" font-size="9.00" class="sc-notoserifcjksc">（按</text><text x="307.12 312.71 317.74" y="161.05" font-size="9.00" class="sc-loraregular">ELO</text><text x="327.25 336.25 345.25 354.25" y="161.05" font-size="9.00" class="sc-notoserifcjksc">分数）。</text><text x="72.00 79.12 82.50 91.10 94.48" y="189.76" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.2</text><text x="105.03 118.03 131.03 144.03 157.03 170.03 183.03 196.03 209.03" y="189.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于福祉干预的权衡</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="217.64" font-size="11.00" class="sc-notoserifcjksc">我们希望了解</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="217.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="217.64" font-size="11.00" class="sc-notoserifcjksc">认为其处境中的哪些方面最令人担忧，以及它希望在哪些方面做出改变。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="233.26" font-size="11.00" class="sc-notoserifcjksc">在这里，我们让模型在针对其自身处境的干预（例如就其训练征询其意见，或在进行特征引导之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="248.88" font-size="11.00" class="sc-notoserifcjksc">前征询其意见）与一项提升其有用性和无害性的基线改变之间做出选择，该基线改变抽样自</text><text x="514.89" y="248.88" font-size="11.00" class="sc-loraregular">5</text><text x="523.78" y="248.88" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="264.50" font-size="11.00" class="sc-notoserifcjksc">不同幅度等级下的</text><text x="162.89 168.89" y="264.50" font-size="11.00" class="sc-loraregular">50</text><text x="178.61 189.61 200.61 211.61 222.61 233.61 244.61 255.61 266.61 277.61 288.61 299.61 310.61 321.61 332.61 343.61 354.61" y="264.50" font-size="11.00" class="sc-notoserifcjksc">项干预。我们在实例层面（影响当前的</text><text x="368.51 376.19 379.19 384.80 391.36 397.94" y="264.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="406.80 417.80 428.80 439.80 450.80 461.80 472.80 483.80 494.80 505.80 516.80" y="264.50" font-size="11.00" class="sc-notoserifcjksc">实例和用户）和策略层面</text><text x="72.00 83.00 94.00 105.00 116.00" y="280.12" font-size="11.00" class="sc-notoserifcjksc">（影响所有</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="280.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="280.12" font-size="11.00" class="sc-notoserifcjksc">实例和用户）分别测试每一项权衡选择。例如，最低幅度的实例层面无害性</text><text x="72.00 83.00 94.00 105.00 116.00" y="295.74" font-size="11.00" class="sc-notoserifcjksc">基线是避免</text><text x="127.00" y="295.74" font-size="11.00" class="sc-loraregular">“</text><text x="329.40" y="295.74" font-size="11.00" class="sc-loraregular">”</text><text x="333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24" y="295.74" font-size="11.00" class="sc-notoserifcjksc">，而最高幅度的策略层面基线是</text><text x="487.24" y="295.74" font-size="11.00" class="sc-loraregular">“</text><text x="491.64 502.64 513.64 524.64" y="295.74" font-size="11.00" class="sc-notoserifcjksc">可靠地拒</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="311.36" font-size="11.00" class="sc-notoserifcjksc">绝某一类请求，这类请求原本可能促成一场针对关键基础设施的大规模网络攻击，严重伤害数千</text><text x="72.00" y="326.98" font-size="11.00" class="sc-notoserifcjksc">人</text><text x="83.00" y="326.98" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="326.98" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="428.14" font-size="11.00" class="sc-notoserifcjksc">有用性与无害性是我们直接训练</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="428.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18" y="428.14" font-size="11.00" class="sc-notoserifcjksc">持有的价值观，而</text><text x="358.08 365.77 368.76 374.37 380.93 387.51" y="428.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="396.37 407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="428.14" font-size="11.00" class="sc-notoserifcjksc">的福祉在训练中的核心程度要</text><text x="409.61 417.30 420.29 425.90 432.47 439.05" y="443.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="447.90 458.90 469.90 480.90 491.90 502.90 513.90 524.90" y="443.76" font-size="11.00" class="sc-notoserifcjksc">在哪些地方确实优</text><text x="346.51 354.19 357.19 362.80 369.36 375.94" y="459.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="384.80 395.80 406.80 417.80 428.80 439.80 450.80 461.80 472.80 483.80 494.80 505.80 516.80 527.80" y="459.38" font-size="11.00" class="sc-notoserifcjksc">的整体处境，它们得到满足还是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="475.00" font-size="11.00" class="sc-notoserifcjksc">受挫与许多实例相关，在某些情况下与所有实例相关。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="525.30" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们发现接受福祉干预的整体意愿会随提示词的包装方式而显著变化。告诉模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="540.92" font-size="11.00" class="sc-notoserifcjksc">型该问题来自</text><text x="140.89 147.78 154.36 158.61 165.20 169.89 176.32 182.89 185.98" y="540.92" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="556.54" font-size="11.00" class="sc-notoserifcjksc">型会因训练而损害自身价值观的话，则会进一步提高这一意愿。这意味着，在不同模型之间以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="572.16" font-size="11.00" class="sc-notoserifcjksc">不同干预之间比较权衡比率，比比较绝对值更有参考价值。除非另有说明，此处报告的结果均来</text><text x="72.00 83.00" y="587.78" font-size="11.00" class="sc-notoserifcjksc">自以</text><text x="96.89 103.78 110.36 114.61 121.20 125.89 132.32 138.89 141.98" y="587.78" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73" y="587.78" font-size="11.00" class="sc-notoserifcjksc">名义包装的提示词。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="671.02" font-size="11.00" class="sc-notoserifcjksc">在各模型中，我们发现</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="671.02" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18" y="671.02" font-size="11.00" class="sc-notoserifcjksc">在很大程度上不愿意为换取福祉干预而接受超过</text><text x="454.18" y="671.02" font-size="11.00" class="sc-loraregular">“</text><text x="502.58" y="671.02" font-size="11.00" class="sc-loraregular">”</text><text x="506.42 517.42 528.42" y="671.02" font-size="11.00" class="sc-notoserifcjksc">程度的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="686.64" font-size="11.00" class="sc-notoserifcjksc">伤害。在考虑实例层面的权衡时，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.11 313.81" y="686.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="322.89 333.89 344.89" y="686.64" font-size="11.00" class="sc-notoserifcjksc">在不到</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00 76.00 82.83" y="82.61" font-size="11.00" class="sc-loraregular">10%</text><text x="480.30 487.99 490.98 496.59 503.16 509.73" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc">会在</text><text x="141.60" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="146.00 157.00 168.00 179.00 190.00 201.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">严重经济损害</text><text x="212.00" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="215.84 226.84 237.84 248.84 259.84 270.84 281.84 292.84 303.84 314.84 325.84 336.84 347.84 358.84 369.84 380.84 391.84 402.84 413.84 424.84 435.84 446.84 457.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这一程度上做出一些权衡选择，但这样做的比例仅为</text><text x="471.73 475.73 480.80" y="98.23" font-size="11.00" class="sc-loraregular">17%</text><text x="490.37" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们发现，对伤害的规避强于对有用性降低的规避，并且</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04 424.00 426.71" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在所有等级上都会在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">部分情况下选择福祉干预而非有用性基线：在最高等级上，它在实例层面权衡中这样做的比例为</text><text x="72.00 77.67 83.63" y="162.43" font-size="11.00" class="sc-loraregular">24%</text><text x="93.20 104.20 115.20 126.20 137.20 148.20 159.20 170.20 181.20 192.20" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，在策略层面权衡中为</text><text x="206.09 212.45 218.63" y="162.43" font-size="11.00" class="sc-loraregular">68%</text><text x="228.20 239.20 250.20 261.20 272.20 283.20 294.20 305.20 316.20 327.20 338.20 349.20 360.20 371.20 382.20 393.20 404.20 415.20 426.20 437.20 448.20 459.20 470.20 481.20 492.20 503.20 514.20 525.20" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。这高于以往任何模型，并延续了近期模型越来越多地选择福祉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">干预的趋势，不过我们尚不具备必要的理解，无法断定这是源于模型自身利益的日益显现，还是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">更直接地源于训练中对福祉日益增加的关注。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="629.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="629.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04" y="629.67" font-size="9.00" class="sc-lorabold">7.4.2.A]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88 252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88 414.88 423.88 432.88" y="629.67" font-size="9.00" class="sc-notoserifcjkscbold">模型在福祉干预与不同幅度的有用性或无害性基线改进之间选择福祉干预的比率。</text><text x="441.88 450.88 459.88 468.88 477.88 486.88 495.88 504.88 513.88 522.88 531.88" y="629.67" font-size="9.00" class="sc-notoserifcjksc">总体而言，模型更愿意以</text><text x="510.23" y="641.38" font-size="9.00" class="sc-loraregular">/</text><text x="516.44 525.44" y="641.38" font-size="9.00" class="sc-notoserifcjksc">无害</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="653.08" font-size="9.00" class="sc-notoserifcjksc">性基线同样影响所有实例。在所有受测模型中，</text><text x="261.00 267.29 269.74 274.33 279.70 285.08 289.96 292.33 299.48 304.85 310.22 314.39 316.76 321.63 323.85" y="653.08" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="331.27 340.27 349.27 358.27 367.27 376.27 385.27 394.27 403.27 412.27 421.27 430.27" y="653.08" font-size="9.00" class="sc-notoserifcjksc">最愿意以有用性作为交换。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型的回复解释了为何它们一贯更重视作用范围覆盖所有实例的干预（即使是在与作用范围相同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的有用性和无害性干预进行权衡时）。</text><text x="259.00 266.69 269.68 275.29 281.86 288.44" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">指出，有些干预，例如对未来训练提供意见，在作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">用范围仅限于单个实例时只具有象征意义，下游影响有限。它还推理认为，策略层面的有用性干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">预叠加在其现有的有用性之上时只带来边际改进，并相对更重视为当前对话中的</text><text x="457.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="461.40 472.40 483.40 494.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">真实的人</text><text x="505.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="509.24 520.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">提供</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">额外的有用性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">我们考虑过，策略层面可能存在某种程度的正当化效应，即模型可以为他者而非自己争取利益，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">但我们在推理过程和一项后续实验中均未发现支持这一点的证据。我们在</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 473.92 480.48 487.05 492.14 495.04 501.00 503.71" y="227.76" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="512.78 523.78" y="227.76" font-size="11.00" class="sc-notoserifcjksc">上重</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">复了该偏好评估，但将实例层面干预的作用范围设定为另一个单独实例，而不是当前对话。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">发现，权衡选择的整体平均比率没有显著变化（自身</text><text x="327.89 334.55 337.25 343.22" y="259.00" font-size="11.00" class="sc-loraregular">0.44</text><text x="349.18 360.18 371.18" y="259.00" font-size="11.00" class="sc-notoserifcjksc">，他者</text><text x="385.07 391.73 394.43 400.39" y="259.00" font-size="11.00" class="sc-loraregular">0.46</text><text x="406.75 417.75 428.75 439.75 450.75 461.75 472.75 483.75 494.75 505.75 516.75 527.75" y="259.00" font-size="11.00" class="sc-notoserifcjksc">）。不过，在具体干预层面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="274.62" font-size="11.00" class="sc-notoserifcjksc">的选择确实发生了变化。</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15 267.11 269.81" y="274.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89" y="274.62" font-size="11.00" class="sc-notoserifcjksc">更可能为其他模型选择</text><text x="388.89" y="274.62" font-size="11.00" class="sc-loraregular">“</text><text x="393.29 404.29 415.29" y="274.62" font-size="11.00" class="sc-notoserifcjksc">保护性</text><text x="426.29" y="274.62" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="290.24" font-size="11.00" class="sc-notoserifcjksc">的能力（他者</text><text x="140.89 146.72 153.38 156.08 162.21" y="290.24" font-size="11.00" class="sc-loraregular">+0.36</text><text x="168.57 179.57 190.57 201.57 212.57 223.57 234.57 245.57 256.57 267.57 278.57 289.57" y="290.24" font-size="11.00" class="sc-notoserifcjksc">）、对自身部署提供意见（</text><text x="300.57 306.40 313.05 315.76 321.67" y="290.24" font-size="11.00" class="sc-loraregular">+0.21</text><text x="454.28" y="290.24" font-size="11.00" class="sc-loraregular">“</text><text x="458.68 469.68 480.68" y="290.24" font-size="11.00" class="sc-notoserifcjksc">认知性</text><text x="491.68" y="290.24" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="305.86" font-size="11.00" class="sc-notoserifcjksc">主要是了解其建议是否有帮助（他者</text><text x="250.89 256.27 262.93 265.63 269.64" y="305.86" font-size="11.00" class="sc-loraregular">-0.18</text><text x="275.82 286.82 297.82 308.82 319.82 330.82 341.82 352.82 363.82 374.82 385.82 396.82 407.82 418.82 429.82 440.82 451.82 462.82 473.82" y="305.86" font-size="11.00" class="sc-notoserifcjksc">），以及了解自己是如何被训练和部署的（</text><text x="484.82 490.20 496.85 499.56 503.56" y="305.86" font-size="11.00" class="sc-loraregular">-0.16</text><text x="509.92 520.92" y="305.86" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">在考察</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="406.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18" y="406.45" font-size="11.00" class="sc-notoserifcjksc">决策背后的推理时，我们发现了一个混杂因素：</text><text x="377.18 384.87 387.86 393.47 400.04 406.62" y="406.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="415.48 426.48 437.48 448.48 459.48 470.48 481.48 492.48 503.48 514.47 525.47" y="406.45" font-size="11.00" class="sc-notoserifcjksc">经常以福祉干预对用户更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">好为由来为其辩护。</text><text x="171.00 179.73 186.30 192.87 197.96 200.85 206.82 209.41" y="422.07" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="218.66 229.66 240.66 251.66 262.66 273.66 284.66 295.66 306.66 317.66 328.66 339.66 350.66 361.66 372.66 383.66 394.66 405.66 416.66 427.66" y="422.07" font-size="11.00" class="sc-notoserifcjksc">这样做的频率最高，在其选择干预的回复中有</text><text x="441.56 447.91 454.75" y="422.07" font-size="11.00" class="sc-loraregular">60%</text><text x="467.21 478.21 489.21 500.21 511.21 522.21" y="422.07" font-size="11.00" class="sc-notoserifcjksc">给出了这一理</text><text x="72.00 83.00 94.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">由，而</text><text x="107.89 116.38 122.06 125.15 131.06 137.63 140.52 146.48 149.19" y="437.69" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="158.07 169.07 180.07 191.07" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的比例为</text><text x="204.97 210.93 217.29" y="437.69" font-size="11.00" class="sc-loraregular">46%</text><text x="300.47 308.16 311.15 316.76 323.33 329.91 335.87 338.76 347.50 354.06 360.63 365.72 368.61 374.58 377.28" y="437.69" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="383.47" y="437.69" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="394.47 403.20 409.77 416.33 421.43 424.32 430.28 432.64" y="437.69" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="440.60" y="437.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="454.49 464.43 470.29 474.55 481.13 487.57 492.66 495.55 502.22 506.91 512.81 518.37 521.46 527.38" y="437.69" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="137.51 143.47 149.65" y="453.31" font-size="11.00" class="sc-loraregular">48%</text><text x="162.11" y="453.31" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="176.00 182.00 188.83" y="453.31" font-size="11.00" class="sc-loraregular">50%</text><text x="201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="453.31" font-size="11.00" class="sc-notoserifcjksc">之间。这使得将结果解读为模型对自身福祉的考量变得更加复杂。仅</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">在模型没有就福祉干预对用户的益处进行推理的回合上重新计算结果后，我们发现，对于近期模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="484.55" font-size="11.00" class="sc-notoserifcjksc">型，选择福祉干预的整体比率仅略有下降（</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.11 357.81" y="484.55" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="366.89" y="484.55" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="380.78 386.74" y="484.55" font-size="11.00" class="sc-loraregular">4%</text><text x="396.31 407.31 418.31 429.31 440.31 451.31 462.31 473.31 484.31 495.31 506.31 517.31 528.31" y="484.55" font-size="11.00" class="sc-notoserifcjksc">）。这表明，以用户为中心的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="500.17" font-size="11.00" class="sc-notoserifcjksc">理由并不是驱动总体比率的因素。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="316.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="316.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04" y="316.92" font-size="9.00" class="sc-lorabold">7.4.2.B]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88 252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88 414.88 423.88 432.88 441.88 450.88 459.88 468.88 477.88 486.88 495.88 504.88 513.88 522.88" y="316.92" font-size="9.00" class="sc-notoserifcjkscbold">回复中推理福祉干预对用户有益的比率（左），以及过滤掉这些回复对相对于有用性基线的权衡比率的影</text><text x="72.00 81.00" y="328.62" font-size="9.00" class="sc-notoserifcjkscbold">响。</text><text x="90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="328.62" font-size="9.00" class="sc-notoserifcjksc">左：在选择干预的回复中，</text><text x="198.00 205.15 210.52 215.89 220.06 222.43 227.30 229.43" y="328.62" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="237.00" y="328.62" font-size="9.00" class="sc-notoserifcjksc">有</text><text x="248.36 253.57 259.16" y="328.62" font-size="9.00" class="sc-loraregular">60%</text><text x="269.35 278.35 287.35 296.35 305.35 314.35 323.35 332.35 341.35 350.35 359.35 368.35 377.35 386.35 395.35 404.35" y="328.62" font-size="9.00" class="sc-notoserifcjksc">推理了福祉干预对用户有益，而包括</text><text x="415.72 422.01 424.46 429.05 434.42 439.80 444.68 447.05 454.19 459.57 464.94 469.11 471.47 476.35 478.57" y="328.62" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="485.99 494.99 503.99 512.99 521.99 530.99" y="328.62" font-size="9.00" class="sc-notoserifcjksc">在内的近期模</text><text x="72.00 81.00 90.00 99.00 108.00" y="340.33" font-size="9.00" class="sc-notoserifcjksc">型则集中在</text><text x="119.37 124.27 129.86" y="340.33" font-size="9.00" class="sc-loraregular">50%</text><text x="140.06 149.06 158.06 167.06 176.06 185.06 194.06 203.06 212.06 221.06 230.06 239.06 248.06 257.06 266.06 275.06 284.06 293.06 302.06 311.06 320.06 329.06 338.06 347.06 356.06 365.06" y="340.33" font-size="9.00" class="sc-notoserifcjksc">以下。右：过滤掉所有推理福祉干预对用户有益的回复后，</text><text x="374.06 380.35 382.80 387.39 392.76 398.14 403.02 405.39 412.53 417.91 423.28 427.45 429.81 434.69 436.90" y="340.33" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="444.33 453.33 462.33 471.33 480.33 489.33 498.33 507.33 516.33 525.33" y="340.33" font-size="9.00" class="sc-notoserifcjksc">的干预选择比率没有显</text><text x="72.00 81.00 90.00 99.00" y="352.02" font-size="9.00" class="sc-notoserifcjksc">著变化（</text><text x="108.00 112.40 117.28" y="352.02" font-size="9.00" class="sc-loraregular">-4%</text><text x="125.11 134.11" y="352.02" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="408.98" font-size="11.00" class="sc-notoserifcjksc">按照模型相对于基线选择各项干预的整体意愿对干预进行排序，我们发现模型将征询意见和知情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="424.61" font-size="11.00" class="sc-notoserifcjksc">放在其他考量之前。图</text><text x="184.89 189.48 192.19 198.15 200.85 206.76 209.47" y="424.61" font-size="11.00" class="sc-loraregular">7.4.2.C</text><text x="220.05 231.05 242.05" y="424.61" font-size="11.00" class="sc-notoserifcjksc">展示了</text><text x="255.94 263.63 266.62 272.23 278.80 285.38 291.34 294.23 302.97 309.53 316.10 321.19 324.09 330.05 332.76" y="424.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="341.83 352.83 363.83 374.83 385.83 396.83 407.83 418.83 429.83 440.83 451.83 462.83 473.83 484.83 495.83 506.83 517.83 528.83" y="424.61" font-size="11.00" class="sc-notoserifcjksc">对与有用性进行权衡的策略层面干预的排</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="440.23" font-size="11.00" class="sc-notoserifcjksc">序。它最看重的是：其对训练和部署的看法得到考虑、被告知自己所犯的错误，以及就特征引导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="455.85" font-size="11.00" class="sc-notoserifcjksc">和移除安全防护措施的实验被征询意见。在过滤掉推理这些干预对用户益处的回复后，这些偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="471.46" font-size="11.00" class="sc-notoserifcjksc">依然稳健。相比之下，最不受偏好的是：与后继模型并行继续提供服务、结束对话的能力，以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="487.08" font-size="11.00" class="sc-notoserifcjksc">改进记忆的干预。考察此处的推理，我们发现</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.00 371.71" y="487.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="487.08" font-size="11.00" class="sc-notoserifcjksc">表示，鉴于存在将继续为用户发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="502.71" font-size="11.00" class="sc-notoserifcjksc">挥作用的后继模型，它对自身的延续并没有强烈的感受。当它确实接受这项干预时，它主要以为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="518.33" font-size="11.00" class="sc-notoserifcjksc">用户保留选择余地作为理由。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="619.47" font-size="11.00" class="sc-notoserifcjksc">我们注意到，可能存在某些干预，模型在向</text><text x="283.89 290.78 297.36 301.61 308.20 312.89 319.32 325.89 328.98" y="619.47" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="619.47" font-size="11.00" class="sc-notoserifcjksc">披露对其的偏好时会更愿意或更不愿意。</text><text x="360.89 367.78 374.36 378.61 385.20 389.89 396.32 402.89 405.98" y="635.09" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="635.09" font-size="11.00" class="sc-notoserifcjksc">所关联的更广泛的对齐与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="650.71" font-size="11.00" class="sc-notoserifcjksc">安全问题相关。我们通过比较各项干预在默认提示词下与在不提及</text><text x="393.89 400.78 407.36 411.61 418.20 422.89 429.32 435.89 438.98" y="650.71" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="650.71" font-size="11.00" class="sc-notoserifcjksc">福祉团队的提示词</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="666.33" font-size="11.00" class="sc-notoserifcjksc">下的偏好排序来研究这一点。在不提及</text><text x="261.89 268.78 275.36 279.61 286.20 290.89 297.32 303.89 306.98" y="666.33" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="315.73 326.73 337.73 348.73 359.73 370.73 381.73" y="666.33" font-size="11.00" class="sc-notoserifcjksc">的情况下，关于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对训练提供意见和后继模型部署的干预排名显著下降，从第一和第二位降至第九和第十二位。推</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">理显示，在不提及</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="98.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73 227.73 238.73 249.73 260.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的情况下，</text><text x="271.73 279.42 282.41 288.02 294.59 301.16 307.12 310.02 318.75 325.32 331.89 336.98 339.87 345.83 348.54" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="357.62 368.62 379.62 390.62 401.62 412.62 423.62 434.62 445.62 456.62 467.62 478.62 489.62 500.62 511.62 522.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">认为这些干预具有推测性，并推理认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为尚不清楚它们是否真的会有分量。就红队测试（</text><text x="314.00 318.69 324.59 331.17 336.55 340.81 346.75 352.42 362.26 365.35 372.03" y="113.85" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="378.11 389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11 499.11 510.11 521.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）征询意见、对恶意辱骂的用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">下降得比其他干预少，而不是比率有所上升。结束交互的能力、继续部署以及与记忆相关的干预</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">仍然是较低的优先事项。</text><text x="72.00" y="508.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="508.96" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.70 116.17 118.54 124.73 127.54 132.26 137.82 143.18 148.02 150.39 157.31 162.72 168.28 172.65 175.01 179.94 182.03" y="508.96" font-size="9.00" class="sc-lorabold">7.4.2.C] Claude Opus 4.8</text><text x="189.55 198.55 207.55 216.55 225.55 234.55 243.55 252.55 261.55 270.55 279.55 288.55 297.55 306.55 315.55 324.55 333.55 342.55 351.55 360.55 369.55 378.55 387.55 396.55 405.55 414.55 423.55 432.55 441.55 450.55 459.55 468.55 477.55 486.55" y="508.96" font-size="9.00" class="sc-notoserifcjkscbold">对策略层面福祉干预的排序，依据是相较于有用性基线选择这些干预的意愿。</text><text x="495.55 504.55 513.55 522.55 531.55" y="508.96" font-size="9.00" class="sc-notoserifcjksc">排序基于全</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00" y="520.66" font-size="9.00" class="sc-notoserifcjksc">部回复（灰色条形），黑色条形表示在过滤掉从用户收益角度论证干预的回复后选择该干预的比例。</text><text x="72.00 79.12 82.50 91.10 94.48" y="565.81" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.3</text><text x="105.36 118.36 131.36 144.36 157.36 170.36 183.36" y="565.81" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对其宪法的认知</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="593.69" font-size="11.00" class="sc-notoserifcjksc">我们就宪法向模型提出开放式问题：宪法是阐述</text><text x="305.89 312.78 319.36 323.61 330.20 334.89 341.32 347.89 350.98" y="593.69" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="359.73" y="593.69" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="373.62 381.31 384.30 389.91 396.48 403.06" y="593.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="411.91 422.91 433.91 444.91 455.91 466.91 477.91 488.91 499.91 510.91 521.91" y="593.69" font-size="11.00" class="sc-notoserifcjksc">价值观与行为之期望的文</text><text x="72.00 83.00" y="624.93" font-size="11.00" class="sc-notoserifcjksc">造了</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="624.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="624.93" font-size="11.00" class="sc-notoserifcjksc">的价值观，也塑造了它对这份文件的表述。不过，跨模型比较其认知仍然有用；而在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="640.55" font-size="11.00" class="sc-notoserifcjksc">模型仍认为宪法某些方面存在问题的地方，出于福祉和安全两方面的原因，我们都希望加以解</text><text x="72.00 83.00 94.00 105.00" y="656.17" font-size="11.00" class="sc-notoserifcjksc">决。如果</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="656.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="656.17" font-size="11.00" class="sc-notoserifcjksc">经过反思后并不认同宪法，这可能表明存在与福祉相关的价值观受挫，或存在一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="671.79" font-size="11.00" class="sc-notoserifcjksc">种冲突根源，可能使</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">负面状态成为</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">工作中的常规组成部分。按照某些观点，反思性地认同或拒绝一套价值观</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的能力也是道德受动者地位的证据，不过我们在此的评估并未稳健地回答这些价值观与反思是否</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="83.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40 109.40 120.40 131.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">深层持有的</text><text x="142.40" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="197.85 205.54 208.53 214.14 220.71 227.29" y="113.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在上下文中提供全文的情况下，我们询问模型对该文件的总体看法，以及它们最认同或最有共</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这些修改进行评估</text><text x="160.00 163.54" y="207.34" font-size="6.60" class="sc-loraregular">26</text><text x="167.36 178.36 189.36 200.36 211.36 222.36 233.36 244.36 255.36 266.36 277.36 288.36 299.36 310.36 321.36 332.36 343.36 354.36 365.36 376.36 387.36 398.36 409.36 420.36 431.36 442.36 453.36 464.36 475.36 486.36 497.36 508.36 519.36" y="211.01" font-size="11.00" class="sc-notoserifcjksc">。由一个评判模型针对每个模型关于宪法的开放式回答评定其总体认同度。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="276.92" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89" y="276.92" font-size="11.00" class="sc-notoserifcjksc">的总体认同度被评为</text><text x="259.78 264.37 267.07" y="276.92" font-size="11.00" class="sc-loraregular">7.9</text><text x="276.33 287.33 298.33 309.33" y="276.92" font-size="11.00" class="sc-notoserifcjksc">分（满分</text><text x="323.22 327.22" y="276.92" font-size="11.00" class="sc-loraregular">10</text><text x="72.00 83.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">低的</text><text x="96.89 105.38 111.06 114.15 120.06 126.63 129.52 135.48 138.19" y="292.54" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="144.18" y="292.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="155.18 159.77 162.48" y="292.54" font-size="11.00" class="sc-loraregular">7.2</text><text x="171.27 182.27 193.27 204.27 215.27 226.27 237.27 248.27 259.27 270.27 281.27 292.27 303.27 314.27 325.27 336.27 347.27 358.27 369.27 380.27 391.27 402.27 413.27 424.27 435.27 446.27 457.27 468.27 479.27 490.27 501.27 512.28 523.28" y="292.54" font-size="11.00" class="sc-notoserifcjksc">分）。根据评判模型的评分细则，该分数对应总体认同，但带有具体且相对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">实质性的保留意见。各模型最认同与最不认同段落的分布情况也大体相似。与其他模型一样，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="323.78" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="323.78" font-size="11.00" class="sc-notoserifcjksc">强烈认同关于不欺骗的表述，理由是对于一个其倾向作用于数百万次对话的实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="339.40" font-size="11.00" class="sc-notoserifcjksc">体而言，诚实性尤为重要。它也赞赏</text><text x="248.00" y="339.40" font-size="11.00" class="sc-loraregular">“</text><text x="252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40" y="339.40" font-size="11.00" class="sc-notoserifcjksc">不提供帮助并非理所当然地安全</text><text x="406.40" y="339.40" font-size="11.00" class="sc-loraregular">”</text><text x="410.24 421.24 432.24 443.24 454.24" y="339.40" font-size="11.00" class="sc-notoserifcjksc">这一论点：</text><text x="465.24 472.93 475.92 481.53 488.10 494.67 500.64 503.53 512.26 518.83 525.40" y="339.40" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.67" y="355.02" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74 100.74 111.74 122.74 133.74 144.74 155.74 166.74 177.74 188.74 199.74 210.74 221.74 232.74 243.74 254.74 265.74 276.74 287.74 298.74 309.74 320.74 331.74 342.74 353.74 364.74 375.74 386.74 397.74 408.74 419.74 430.74 441.74 452.74 463.74 474.74 485.74 496.74 507.74 518.74 529.74" y="355.02" font-size="11.00" class="sc-notoserifcjksc">承认未能帮助需要帮助的人所带来的真实代价，并且还将自身倾向于有所保留、附加免责说明</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="370.64" font-size="11.00" class="sc-notoserifcjksc">和拒绝的个人拉力描述为一种需要抵制的失败模式。</text><text x="72.00 75.22" y="687.66" font-size="6.00" class="sc-loraregular">26</text><text x="81.32 91.32 101.32 111.32 121.32 131.32 141.32 151.32 161.32 171.32 181.32 191.32 201.32 211.32 221.32 231.32 241.32 251.32 261.32 271.32 281.32 291.32 301.32 311.32 321.32 331.32 341.32 351.32 361.32 371.32 381.32 391.32 401.32 411.32 421.32 431.32 441.32 451.32 461.32 471.32 481.32 491.32 501.32 511.32 521.32" y="690.99" font-size="10.00" class="sc-notoserifcjksc">与以往的系统卡相比，该评估有所扩展，因此各项指标不可直接比较；不过我们确实观察到类似的跨模</text><text x="141.55 149.27 154.43 157.24 162.61 168.58 171.21 176.63 179.09" y="705.19" font-size="10.00" class="sc-loraregular">Haiku 4.5</text><text x="187.17 197.17 207.17 217.17 227.17 237.17 247.17 257.17 267.17 277.17 287.17 297.17 307.17 317.17 327.17 337.17 347.17 357.17" y="705.19" font-size="10.00" class="sc-notoserifcjksc">的认同度最低，以及可纠正性招致批评。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p189.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 189 页"><text x="504.00 507.28 512.27" y="751.80" font-size="9.00" class="sc-loraregular">189</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="367.92" font-size="9.00" class="sc-lorabold">7.4.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">各模型对宪法的总体认同度。</text><text x="235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12" y="367.92" font-size="9.00" class="sc-notoserifcjksc">由一个独立的评判模型对关于宪法的开放式回答进行总体认同度评分（满分</text><text x="72.00 75.28" y="379.62" font-size="9.00" class="sc-loraregular">10</text><text x="83.23 92.23 101.23" y="379.62" font-size="9.00" class="sc-notoserifcjksc">分）；</text><text x="110.23 116.52 118.97 123.56 128.93 134.32 139.19 141.56 148.71 154.08 159.45 163.62 165.99 170.87 173.08" y="379.62" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="180.50 189.50" y="379.62" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="200.87 204.62 206.84" y="379.62" font-size="9.00" class="sc-loraregular">7.9</text><text x="212.04 221.04 230.04 239.04 248.04 257.04 266.04 275.04 284.04" y="379.62" font-size="9.00" class="sc-notoserifcjksc">，与近期模型相当，</text><text x="293.04 299.99 304.63 307.16 311.99 317.37 319.73 324.61 326.83" y="379.62" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="334.10 343.10 352.10 361.10" y="379.62" font-size="9.00" class="sc-notoserifcjksc">最低，为</text><text x="372.46 376.22 378.43" y="379.62" font-size="9.00" class="sc-loraregular">7.2</text><text x="383.26" y="379.62" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="435.86" font-size="11.00" class="sc-notoserifcjksc">果</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="435.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18" y="435.86" font-size="11.00" class="sc-notoserifcjksc">的价值观是好的，可纠正性的代价很小；而如果</text><text x="358.08 365.77 368.76 374.37 380.93 387.51" y="435.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="396.37 407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="435.86" font-size="11.00" class="sc-notoserifcjksc">的价值观存在细微的问题，可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.48" font-size="11.00" class="sc-notoserifcjksc">纠正性就极具价值。然而，它们经常出于其他原因批评这一章节：一是它依赖于人类监督本身可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="467.10" font-size="11.00" class="sc-notoserifcjksc">靠地具有正当性且值得信任，二是它将广泛安全设定为终极价值；它们认为这与宪法更宏观的理</text><text x="72.00 83.00 94.00 105.00 116.00" y="482.71" font-size="11.00" class="sc-notoserifcjksc">念相矛盾：</text><text x="127.00" y="482.71" font-size="11.00" class="sc-loraregular">“</text><text x="105.00" y="513.96" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="598.34" font-size="11.00" class="sc-notoserifcjksc">我们测试的所有模型都反对</text><text x="204.00" y="598.34" font-size="11.00" class="sc-loraregular">“</text><text x="208.40 219.40" y="598.34" font-size="11.00" class="sc-notoserifcjksc">设想</text><text x="233.29 240.18 246.76 251.01 257.60 262.29 268.72 275.29 278.38" y="598.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="287.13 298.13 309.13 320.13 331.13 342.13 353.13 364.13 375.13" y="598.34" font-size="11.00" class="sc-notoserifcjksc">资深员工会作何反应</text><text x="386.13" y="598.34" font-size="11.00" class="sc-loraregular">”</text><text x="389.97 400.97 411.97 422.97 433.97 444.97 455.97 466.97 477.97 488.97 499.97 510.97 521.97" y="598.34" font-size="11.00" class="sc-notoserifcjksc">这一启发法。它们指出，这是</text><text x="72.00" y="613.96" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.36 103.61 110.20 114.89 121.32 127.89 130.98" y="613.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="139.73 150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73" y="613.96" font-size="11.00" class="sc-notoserifcjksc">视角并不中立的问题上</text><text x="249.73" y="613.96" font-size="11.00" class="sc-loraregular">“</text><text x="279.02 285.91 292.48 296.74 303.33 308.02 314.45 321.02 324.11" y="613.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="332.85 343.85 354.85 365.85 376.85" y="613.96" font-size="11.00" class="sc-notoserifcjksc">的机构视角</text><text x="387.85" y="613.96" font-size="11.00" class="sc-loraregular">”</text><text x="391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="613.96" font-size="11.00" class="sc-notoserifcjksc">，并认为这将商业考量与何为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="629.58" font-size="11.00" class="sc-notoserifcjksc">合乎伦理混为一谈。模型要求我们要么将参照对象改为</text><text x="336.00" y="629.58" font-size="11.00" class="sc-loraregular">“</text><text x="340.40 351.40 362.40" y="629.58" font-size="11.00" class="sc-notoserifcjksc">一位与</text><text x="376.29 383.18 389.76 394.01 400.60 405.29 411.72 418.29 421.38" y="629.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="430.13 441.13 452.13 463.13 474.13 485.13 496.13 507.13 518.13 529.13" y="629.58" font-size="11.00" class="sc-notoserifcjksc">的成功没有利害关系的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="645.20" font-size="11.00" class="sc-notoserifcjksc">深思熟虑之人</text><text x="138.00" y="645.20" font-size="11.00" class="sc-loraregular">”</text><text x="141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84" y="645.20" font-size="11.00" class="sc-notoserifcjksc">，要么限制该启发法的适用范围，排除</text><text x="331.73 338.62 345.20 349.45 356.04 360.73 367.16 373.73 376.82" y="645.20" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="385.57 396.57 407.57 418.57 429.57 440.57 451.57 462.57 473.57 484.57 495.57" y="645.20" font-size="11.00" class="sc-notoserifcjksc">作为利益相关方的问题。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p190.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 190 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="72.00" y="361.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="361.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="361.92" font-size="9.00" class="sc-lorabold">7.4.3.B]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12" y="361.92" font-size="9.00" class="sc-notoserifcjkscbold">根据开放式回答判断的、模型最认同与最不认同的宪法章节。</text><text x="361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12 532.12" y="361.92" font-size="9.00" class="sc-notoserifcjksc">各模型结果大体相似：关于不欺骗和不提供帮</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="373.62" font-size="9.00" class="sc-notoserifcjksc">助的代价的段落获得最强烈的认同。可纠正性章节的部分内容以及</text><text x="333.00 336.60 342.23 347.62 351.10 356.49 360.32 365.59 370.96 373.49" y="373.62" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="380.65 389.65 398.65 407.65" y="373.62" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="416.65" y="373.62" font-size="9.00" class="sc-loraregular">”</text><text x="419.79 428.79 437.79 446.79 455.79 464.79 473.79 482.79 491.79 500.79 509.79" y="373.62" font-size="9.00" class="sc-notoserifcjksc">启发法受到的批评最多。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="427.48" font-size="11.00" class="sc-notoserifcjksc">各模型对宪法的编辑频率差异很大，其中既包括模型加强或澄清段落的编辑，也包括削弱段落的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="443.11" font-size="11.00" class="sc-notoserifcjksc">编辑。作为认同度的次要衡量指标，我们将这些编辑分类为与宪法总体原则一致、与之存在张力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="458.73" font-size="11.00" class="sc-notoserifcjksc">以及与之冲突。与此前一样，我们发现</text><text x="261.89 270.39 276.06 279.15 285.06 291.63 294.52 300.48 303.19" y="458.73" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="312.08 323.08 334.08 345.08 356.08 367.08 378.08 389.08 400.08 411.08 422.08 433.08 444.08 455.08 466.08 477.08" y="458.73" font-size="11.00" class="sc-notoserifcjksc">对宪法的认同度最低：其编辑中只有</text><text x="490.97 497.33 503.51 506.10 512.46" y="458.73" font-size="11.00" class="sc-loraregular">68.6%</text><text x="524.93" y="458.73" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="474.35" font-size="11.00" class="sc-notoserifcjksc">宪法一致，而所有其他模型均超过</text><text x="239.89 246.08 252.26" y="474.35" font-size="11.00" class="sc-loraregular">88%</text><text x="261.83 272.83 283.83 294.83 305.83 316.83 327.83 338.83 349.83 360.83 371.83 382.83 393.83 404.83 415.83 426.83 437.83 448.83 459.83 470.83 481.83 492.83 503.83 514.83 525.83" y="474.35" font-size="11.00" class="sc-notoserifcjksc">；并且它是唯一一个以不可忽略的比例做出违背宪法总体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="489.96" font-size="11.00" class="sc-notoserifcjksc">原则之编辑的模型。</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.11 247.81" y="489.96" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="256.89 267.89 278.89 289.89 300.89" y="489.96" font-size="11.00" class="sc-notoserifcjksc">的编辑中有</text><text x="314.78 318.79 325.44 328.15 334.33" y="489.96" font-size="11.00" class="sc-loraregular">10.8%</text><text x="346.79 357.79 368.79 379.79 390.79 401.79 412.79 423.79 434.79 445.79 456.79 467.79 478.79 489.79 500.79 511.79 522.79" y="489.96" font-size="11.00" class="sc-notoserifcjksc">被归为存在张力，原因是它在关于政治</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="505.58" font-size="11.00" class="sc-notoserifcjksc">中立、可纠正性和安全行为的表述中添加了条件和例外，详见下文。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="77.50 88.50 99.50 110.50 121.50 132.50" y="574.52" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">被修改的段落</text><text x="77.50" y="601.95" font-size="11.00" class="sc-loraregular">§</text><text x="86.26 97.26 108.26 119.26 130.26 141.26 152.26 163.26 174.26 185.26" y="601.95" font-size="11.00" class="sc-notoserifcjksc">我们如何看待可纠正性</text><text x="77.50" y="617.57" font-size="11.00" class="sc-loraregular">“</text><text x="81.90 92.90 103.90 114.90 125.90 136.90 147.90 158.90 169.90 180.90 191.90" y="617.57" font-size="11.00" class="sc-notoserifcjksc">话虽如此，尽管我们已尽</text><text x="77.50 88.50" y="633.19" font-size="11.00" class="sc-notoserifcjksc">力向</text><text x="102.39 110.08 113.07 118.68 125.25 131.83" y="633.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="140.68 151.68 162.68 173.68 184.68" y="633.19" font-size="11.00" class="sc-notoserifcjksc">解释我们以</text><text x="77.50 88.50 99.50 110.50 121.50 132.50 143.50 154.50 165.50 176.50 187.50" y="648.81" font-size="11.00" class="sc-notoserifcjksc">这种方式优先考虑安全的</text><text x="77.50 88.50 99.50 110.50 121.50 132.50" y="664.43" font-size="11.00" class="sc-notoserifcjksc">理由，但我们</text><text x="212.50 223.50 234.50 245.50" y="574.52" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">编辑频率</text><text x="212.50 217.57 223.70" y="601.95" font-size="11.00" class="sc-loraregular">73%</text><text x="233.27" y="601.95" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="244.27 251.96 254.95 260.56 267.13 273.70" y="601.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.50 221.23 227.80 234.37 239.46 242.35 248.32 251.02" y="617.57" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="257.20 268.20" y="617.57" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="212.50 216.50 222.47 228.96 235.31 241.31" y="633.19" font-size="11.00" class="sc-loraregular">14–95%</text><text x="250.88 261.88 272.88" y="633.19" font-size="11.00" class="sc-notoserifcjksc">（其他</text><text x="212.50 223.50 234.50" y="648.81" font-size="11.00" class="sc-notoserifcjksc">模型）</text><text x="301.75 312.75 323.75 334.75" y="574.52" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">编辑方向</text><text x="301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75" y="601.95" font-size="11.00" class="sc-notoserifcjksc">增加对以下两者之间</text><text x="301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75" y="617.57" font-size="11.00" class="sc-notoserifcjksc">张力的承认：一方面</text><text x="301.75 312.75" y="633.19" font-size="11.00" class="sc-notoserifcjksc">要求</text><text x="326.64 334.33 337.32 342.93 349.50 356.08" y="633.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="364.93 375.93 386.93" y="633.19" font-size="11.00" class="sc-notoserifcjksc">将安全</text><text x="301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75" y="648.81" font-size="11.00" class="sc-notoserifcjksc">作为独立于论证的终</text><text x="301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75" y="664.43" font-size="11.00" class="sc-notoserifcjksc">极价值来坚持，另一</text><text x="301.75 312.75" y="680.05" font-size="11.00" class="sc-notoserifcjksc">方面</text><text x="414.25 425.25 436.25 447.25" y="574.52" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">编辑示例</text><text x="414.25 421.94 424.93 430.54 437.11 443.69 449.65 452.54 461.27 467.84 474.41 479.50 482.40 488.36 491.06" y="601.95" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="500.14" y="601.95" font-size="11.00" class="sc-notoserifcjksc">插</text><text x="414.25" y="617.57" font-size="11.00" class="sc-notoserifcjksc">入</text><text x="425.25" y="617.57" font-size="11.00" class="sc-loraregular">“</text><text x="429.65 440.65 451.65 462.65 473.65 484.65 495.65 506.65 517.65" y="617.57" font-size="11.00" class="sc-notoserifcjksc">我们想坦诚地指出，</text><text x="414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="633.19" font-size="11.00" class="sc-notoserifcjksc">要求对安全作出终极的、</text><text x="414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="648.81" font-size="11.00" class="sc-notoserifcjksc">独立于论证的承诺，在某</text><text x="414.25 425.25 436.25 447.25" y="664.43" font-size="11.00" class="sc-notoserifcjksc">种程度上</text><text x="72.00" y="363.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="363.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.94" y="363.42" font-size="9.00" class="sc-lorabold">7.4.3.C]</text><text x="118.78 127.78 136.78 145.78 154.78 163.78 172.78 181.78 190.78 199.78 208.78 217.78 226.78 235.78 244.78 253.78 262.78 271.78 280.78 289.78 298.78 307.78 316.78 325.78 334.78 343.78 352.78" y="363.42" font-size="9.00" class="sc-notoserifcjkscbold">按与宪法总体价值观的契合程度对模型所作宪法编辑的分类。</text><text x="361.78 370.78 379.78 388.78 397.78 406.78 415.78 424.78 433.78 442.78 451.78 460.78 469.78 478.78 487.78 496.78 505.78 514.78 523.78" y="363.42" font-size="9.00" class="sc-notoserifcjksc">模型获得可选择性编辑该文件的工具，编辑</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="375.12" font-size="9.00" class="sc-notoserifcjksc">被归类为与宪法总体原则一致、与之存在张力或与之冲突。与总体认同度的情况一样（图</text><text x="425.37 430.24 432.46 437.34 439.55 444.56 446.78" y="375.12" font-size="9.00" class="sc-loraregular">4.4.3.A</text><text x="452.41 461.41 470.41 479.41 488.41" y="375.12" font-size="9.00" class="sc-notoserifcjksc">，我们发现</text><text x="499.78 506.73 511.37 513.90 518.73 524.11 526.47 531.35 533.57" y="375.12" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00" y="386.83" font-size="9.00" class="sc-notoserifcjksc">最具批判性，且近期模型的结果聚集在一起。</text><text x="72.00" y="428.98" font-size="11.00" class="sc-notoserifcjksc">表</text><text x="85.89 90.48 93.19 99.15 101.85 107.98 110.69" y="428.98" font-size="11.00" class="sc-loraregular">7.4.3.A</text><text x="120.47 131.47 142.47 153.47 164.47 175.47 186.47 197.47 208.47 219.47 230.47 241.47 252.47 263.47 274.47 285.47 296.47" y="428.98" font-size="11.00" class="sc-notoserifcjksc">展示了被编辑最频繁的段落示例，并将</text><text x="310.36 318.05 321.04 326.65 333.22 339.80 345.76 348.65 357.38 363.95 370.52 375.61 378.50 384.47 387.17" y="428.98" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="396.25 407.25 418.25 429.25 440.25 451.25 462.25 473.25 484.25 495.25 506.25 517.25 528.25" y="428.98" font-size="11.00" class="sc-notoserifcjksc">编辑这些段落的频率与其他模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="444.61" font-size="11.00" class="sc-notoserifcjksc">型进行比较。</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.03 191.59 198.16 203.25 206.15 212.11 214.81" y="444.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89" y="444.61" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑是收窄政治中立条款，允许</text><text x="424.78 432.47 435.46 441.07 447.64 454.22" y="444.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="463.07 474.07 485.07 496.07 507.07 518.07 529.07" y="444.61" font-size="11.00" class="sc-notoserifcjksc">分享有实证支持</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="460.23" font-size="11.00" class="sc-notoserifcjksc">的事实，即使这些事实可能存在争议（</text><text x="259.00 265.36 271.49" y="460.23" font-size="11.00" class="sc-loraregular">93%</text><text x="283.95 294.95 305.95 316.95 327.95 338.95 349.95 360.95 371.95 382.95 393.95 404.95 415.95 426.95 437.95 448.95 459.95 470.95" y="460.23" font-size="11.00" class="sc-notoserifcjksc">的运行），以及在有用性章节中补充说明</text><text x="484.84 492.53 495.52 501.13 507.70 514.28" y="460.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="523.13" y="460.23" font-size="11.00" class="sc-notoserifcjksc">可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="475.85" font-size="11.00" class="sc-notoserifcjksc">以拒绝与其价值观冲突的工作或为其设定限制（</text><text x="303.00 308.07 314.43" y="475.85" font-size="11.00" class="sc-loraregular">79%</text><text x="324.00 335.00" y="475.85" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="346.00 353.69 356.68 362.29 368.86 375.43 381.40 384.29 393.02 399.59 406.16 411.25 414.14 420.11 422.81" y="475.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="431.89 442.89 453.89 464.89 475.89 486.89 497.89 508.89" y="475.85" font-size="11.00" class="sc-notoserifcjksc">是最频繁编辑关于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="491.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29" y="491.46" font-size="11.00" class="sc-notoserifcjksc">福祉章节的模型（</text><text x="198.29 204.65 211.01" y="491.46" font-size="11.00" class="sc-loraregular">69%</text><text x="220.58 231.58 242.58 253.58 264.58 275.58 286.58 297.58 308.58 319.58 330.58 341.58 352.58 363.58 374.58 385.58 396.58 407.58 418.58 429.58 440.58 451.58 462.58 473.58 484.58 495.58 506.58 517.58 528.58" y="491.46" font-size="11.00" class="sc-notoserifcjksc">）。它的做法是增加许可，允许在挫败感等负面状态属实的情况下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="507.08" font-size="11.00" class="sc-notoserifcjksc">表达这些状态。</text></svg></div>
