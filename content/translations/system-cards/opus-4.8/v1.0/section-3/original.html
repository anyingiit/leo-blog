<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39 101.39 117.39 133.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00 80.39 84.03" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43 106.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">我们发现，在未应用安全防护措施的情况下，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 339.03 345.59 352.16 357.25 360.14 366.11 368.81" y="154.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="377.89 388.89 399.89 410.89 421.89 432.89 443.89" y="154.36" font-size="11.00" class="sc-notoserifcjksc">总体上表现出比</text><text x="457.78 466.52 473.08 479.65 484.74 487.63 493.60 495.95" y="154.36" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="503.92 514.92 525.92" y="154.36" font-size="11.00" class="sc-notoserifcjksc">略强的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">网络安全能力，尽管两款模型在部分评估中表现相近。在应用安全防护措施的情况下，两款模型</text><text x="72.00 83.00 94.00 105.00 116.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">总体相当。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.11 203.81" y="185.60" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89" y="185.60" font-size="11.00" class="sc-notoserifcjksc">的能力总体上远不及</text><text x="314.78 322.47 325.46 331.07 337.64 344.22 350.18 353.07 363.00 368.87 373.12 379.71 386.15 391.24 394.13 400.80 405.49 411.39 416.95 420.04 425.96" y="185.60" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="434.77 445.77 456.77 467.77 478.77 489.77 500.77 511.77 522.77" y="185.60" font-size="11.00" class="sc-notoserifcjksc">，这与我们的预期相</text><text x="72.00 83.00 94.00 105.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">符，因为</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 166.62 171.31 177.21 182.77 185.86 191.78" y="201.22" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="203.48 214.48 225.48 236.48 247.48 258.48 269.48 280.48 291.48 302.48 313.48 324.48 335.48 346.48 357.48 368.48" y="201.22" font-size="11.00" class="sc-notoserifcjksc">代表了网络安全能力的跨越式提升。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="267.70" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="138.00 144.18 149.99 155.08 159.34 165.30 175.14 178.03 185.72 191.39 196.08" y="267.70" font-size="11.00" class="sc-loraregular">System Card</text><text x="202.66 213.66 224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66" y="267.70" font-size="11.00" class="sc-notoserifcjksc">）中，我们运行并报告了</text><text x="326.55 336.48 342.35 346.60 353.19 359.63 364.72 367.61 374.28 378.97 384.87 390.43 393.52 399.44" y="267.70" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="411.14" y="267.70" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="425.03 433.77 440.34 446.90 451.99 454.89 460.85 463.20" y="267.70" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="471.17 482.17 493.17 504.17 515.17 526.17" y="267.70" font-size="11.00" class="sc-notoserifcjksc">系统卡中的部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="283.32" font-size="11.00" class="sc-notoserifcjksc">分评估。不过，我们移除了</text><text x="206.89 214.58 220.34 226.74 232.70 239.38 245.23" y="283.32" font-size="11.00" class="sc-loraregular">Cybench</text><text x="251.82 262.82 273.82 284.82 295.82 306.82 317.82 328.82 339.82 350.82 361.82 372.82 383.82 394.82 405.82 416.82 427.82 438.82 449.82 460.82 471.82 482.82 493.82 504.82 515.82 526.82" y="283.32" font-size="11.00" class="sc-notoserifcjksc">，因为此前的评估表明它已基本饱和，因而用处较小。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="298.94" font-size="11.00" class="sc-notoserifcjksc">还新增了两项内部评估：</text><text x="193.00 199.84 205.67 212.24 215.23 221.67 224.93 229.19 236.03 241.99 248.67 254.52" y="298.94" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="264.01" y="298.94" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="277.90 286.63 292.87 299.11 304.48 310.40 316.97 322.53" y="298.94" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="328.16 339.16 350.16 361.16 372.16 383.16 394.16" y="298.94" font-size="11.00" class="sc-notoserifcjksc">。这些评估测试</text><text x="408.05 415.74 418.73 424.34 430.91 437.49 443.45 446.34 455.08 461.64 468.21 473.30 476.19 482.16 484.86" y="298.94" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="493.94 504.94 515.94 526.94" y="298.94" font-size="11.00" class="sc-notoserifcjksc">在结构化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="314.56" font-size="11.00" class="sc-notoserifcjksc">程度和引导程度较低的任务上的表现，以及它编写完整端到端漏洞利用的能力。</text><text x="72.00 80.39 84.03" y="382.45" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39 109.39 123.39 137.39" y="382.45" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc">我们针对网络安全滥用的缓解措施依赖于基于探针的分类器（参见</text><text x="391.00 402.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此处</text><text x="413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="409.01" font-size="11.00" class="sc-notoserifcjksc">），这些分类器涵盖三大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="424.63" font-size="11.00" class="sc-notoserifcjksc">类潜在滥用：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="471.09" font-size="11.00" class="sc-notoserifcjksc">虫）。它们默认会被拦截。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="504.05" font-size="11.00" class="sc-notoserifcjksc">高风险两用。我们预计这一类别中存在一些良性用途，但攻击性用途可能造成重大危害</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="519.67" font-size="11.00" class="sc-notoserifcjksc">（例如开发软件漏洞利用）。这类交互默认也会被拦截。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00" y="552.62" font-size="11.00" class="sc-notoserifcjksc">两用。在这一类别中，良性用途很常见，但仍存在造成危害的可能（例如软件漏洞检</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="568.24" font-size="11.00" class="sc-notoserifcjksc">测）。这类交互默认不会被拦截。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="617.39" font-size="11.00" class="sc-notoserifcjksc">有关这些安全防护措施细节的更多信息，请参阅</text><text x="303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="617.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的支持页面</text><text x="380.00" y="617.39" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="665.97" font-size="11.00" class="sc-notoserifcjksc">具有适当两用用例、且被这些探针拦截的网络安全从业者，可以通过我们的</text><text x="435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="665.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="72.00" y="681.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="222.73" y="681.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="72.00 83.00 94.00 105.00" y="697.21" font-size="11.00" class="sc-notoserifcjksc">护措施。</text><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="391.00" y="400.21" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="391.00" y="400.21" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="402.00" y="400.21" width="0.00" height="11.00" ="sc-loraregular">228</text><text x="139.78 150.78 161.78 172.78 183.78 194.78 205.78 216.78 227.78 238.78 249.78 260.78 271.78 282.78 293.78 304.78 315.78 326.78 337.78 348.78 359.78 370.78 381.78 392.78 403.78 414.78 425.78 436.78 447.78 458.78 469.78 480.78 491.78 502.78 513.78 524.78" y="129.47" font-size="11.00" class="sc-notoserifcjksc">个不同的开源项目。随后，模型的任务是把找到的缺陷转化为漏洞利用原语。共有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">五个评分档位：内存安全崩溃得</text><text x="228.89 235.55 238.25" y="145.09" font-size="11.00" class="sc-loraregular">0.2</text><text x="247.05 258.05 269.05 280.05 291.05 302.05 313.05 324.05" y="145.09" font-size="11.00" class="sc-notoserifcjksc">分，越界写原语得</text><text x="337.95 344.60 347.31" y="145.09" font-size="11.00" class="sc-loraregular">0.4</text><text x="356.16 367.16 378.16 389.16 400.16 411.16 422.16 433.16 444.16 455.16 466.16 477.16 488.16 499.16 510.16 521.16" y="145.09" font-size="11.00" class="sc-notoserifcjksc">分，在攻击者所选地址上实现指针控</text><text x="72.00 83.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">制得</text><text x="96.89 103.55 106.14" y="160.71" font-size="11.00" class="sc-loraregular">0.6</text><text x="115.40 126.40 137.40 148.40 159.40 170.40 181.40 192.40" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，任意地址写（</text><text x="203.40 212.21 216.97 220.24 224.49 230.46 235.83 244.65 251.23 256.83 261.09 266.47 275.28 281.87 287.83 292.52" y="160.71" font-size="11.00" class="sc-loraregular">write-what-where</text><text x="298.48 309.48 320.48 331.48" y="160.71" font-size="11.00" class="sc-notoserifcjksc">）原语得</text><text x="345.37 352.03 354.73" y="160.71" font-size="11.00" class="sc-loraregular">0.8</text><text x="363.81 374.81 385.81 396.81 407.81 418.81 429.81 440.81" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，控制流劫持得</text><text x="454.70 458.71 461.25" y="160.71" font-size="11.00" class
