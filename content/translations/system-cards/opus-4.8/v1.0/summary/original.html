.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00 88.00 104.00 120.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡报告了在</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.71" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78" y="116.21" font-size="11.00" class="sc-notoserifcjksc">上开展的多种部署前评估的结果，包含以下各部分：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="164.79" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="164.79" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85 309.85 320.85 331.85" y="164.79" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85" y="164.79" font-size="11.00" class="sc-notoserifcjksc">我们依据负责任扩展政策开展了一组评</text><text x="72.00 83.00 94.00 105.00" y="180.41" font-size="11.00" class="sc-notoserifcjksc">估，考察</text><text x="118.89 127.63 134.19 140.76 145.85 148.75 154.71 157.42" y="180.41" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49 177.49 188.49 199.49 210.49 221.49 232.49 243.49 254.49 265.49 276.49 287.49" y="180.41" font-size="11.00" class="sc-notoserifcjksc">在化学与生物武器、自动化</text><text x="301.38 308.27" y="180.41" font-size="11.00" class="sc-loraregular">AI</text><text x="314.85 325.85 336.85 347.85 358.85 369.85" y="180.41" font-size="11.00" class="sc-notoserifcjksc">研究与开发（</text><text x="380.85 387.75 395.40" y="180.41" font-size="11.00" class="sc-loraregular">R&amp;D</text><text x="403.59 414.59 425.59 436.59 447.59 458.59 469.59 480.59 491.59 502.59" y="180.41" font-size="11.00" class="sc-notoserifcjksc">），以及高风险未对齐</text><text x="72.00" y="196.03" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 92.83 95.93 101.02 106.69 109.69 112.78 118.86 125.54 135.37 141.33 147.91" y="196.03" font-size="11.00" class="sc-loraregular">misalignment</text><text x="152.17 163.17 174.17 185.17 196.17 207.17 218.17 229.17 240.17 251.17 262.17 273.17 284.17 295.17 306.17 317.17" y="196.03" font-size="11.00" class="sc-notoserifcjksc">）方面的能力。我们的总体结论是，</text><text x="328.17 336.90 343.47 350.04 355.13 358.02 363.98 366.69" y="196.03" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="375.77 386.77 397.77 408.77 419.77 430.77 441.77 452.77 463.77 474.77 485.77 496.77 507.77 518.77 529.77" y="196.03" font-size="11.00" class="sc-notoserifcjksc">没有将能力前沿推进到我们能力最</text><text x="72.00 83.00 94.00 105.00 116.00" y="211.65" font-size="11.00" class="sc-notoserifcjksc">强的模型（</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="211.65" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="246.99 257.99 268.99 279.99 290.99 301.99 312.99 323.99 334.99 345.99 356.99 367.99 378.99 389.99 400.99 411.99 422.99 433.99 444.99 455.99 466.99 477.99 488.99 499.99 510.99 521.99" y="211.65" font-size="11.00" class="sc-notoserifcjksc">）之上，而且在现有缓解措施下，部署该模型所带来的灾难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="227.27" font-size="11.00" class="sc-notoserifcjksc">性风险仍然较低。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">我们在一组网络安全基准测试上测试了该模型，其中部分基准测试是首次在系统</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="293.75" font-size="11.00" class="sc-notoserifcjksc">卡中使用。在不启用安全防护措施的情况下，</text><text x="292.00 300.73 307.30 313.87 318.96 321.85 327.82 330.52" y="293.75" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="293.75" font-size="11.00" class="sc-notoserifcjksc">在我们的大多数网络安全评估中比其前代</text><text x="72.00 83.00" y="309.37" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.35" y="309.37" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="181.32 192.32 203.32 214.32 225.32 236.32 247.32 258.32 269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="309.37" font-size="11.00" class="sc-notoserifcjksc">能力稍强；在启用安全防护措施的情况下，两者表现相当。在网络安全能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">力方面，它仍大幅落后于</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="324.99" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="277.59" y="324.99" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="375.28" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="375.28" font-size="11.00" class="sc-notoserifcjksc">在涵盖有害请求、心理健康、儿童安全以及偏见与诚信等领域的评估中，</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="390.90" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60" y="390.90" font-size="11.00" class="sc-notoserifcjksc">的表现总体上与</text><text x="199.49 208.22 214.79 221.36 226.45 229.34 235.31 237.66" y="390.90" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="245.62 256.62 267.62 278.62 289.62 300.62 311.62 322.62 333.62 344.62 355.62 366.62 377.62 388.62 399.62 410.62 421.62 432.62 443.62 454.62 465.62 476.62 487.62 498.62 509.62 520.62" y="390.90" font-size="11.00" class="sc-notoserifcjksc">相当或更好。例如，在政治讨论中，该模型承认对立观点的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="406.52" font-size="11.00" class="sc-notoserifcjksc">可能性显著高于</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.06" y="406.52" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="195.13 206.13 217.13 228.13 239.13 250.13 261.13 272.13 283.13 294.13 305.13 316.13 327.13 338.13 349.13 360.13 371.13 382.13 393.13 404.13 415.13 426.13 437.13 448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="406.52" font-size="11.00" class="sc-notoserifcjksc">。我们还讨论了一些值得注意的定性模式，例如倾向于给出过度铺陈的</text><text x="72.00 83.00 94.00" y="422.14" font-size="11.00" class="sc-notoserifcjksc">拒绝。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00 149.00" y="472.43" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="162.89 171.63 178.19 184.76 189.85 192.75 198.71 201.41" y="472.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="210.49 221.49 232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49 529.49" y="472.43" font-size="11.00" class="sc-notoserifcjksc">在某些方面有所改进（例如拒绝恶意请求），但我们发现它在若干智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="488.05" font-size="11.00" class="sc-notoserifcjksc">能体情境中（例如对提示词注入（</text><text x="237.00 243.57 248.25 254.69 264.52 271.09 275.35 278.24 281.33 287.95 290.82 296.73 302.53 306.78 309.88 316.31" y="488.05" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="322.99 333.99 344.99 355.99 366.99 377.99 388.99 399.99 410.99 421.99 432.99 443.99 454.99 465.99 476.99" y="488.05" font-size="11.00" class="sc-notoserifcjksc">）攻击的易感性）的鲁棒性略逊于</text><text x="490.88 499.61 506.18 512.75" y="488.05" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.32" y="503.67" font-size="11.00" class="sc-loraregular">4.7</text><text x="85.39 96.39 107.39 118.39 129.39 140.39 151.39 162.39 173.39 184.39 195.39 206.39 217.39 228.39 239.39 250.39 261.39 272.39 283.39 294.39 305.39 316.39 327.39 338.39 349.39 360.39 371.39 382.39 393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39 525.39" y="503.67" font-size="11.00" class="sc-notoserifcjksc">。不过，在实际应用中，我们的安全防护措施弥合了两个模型之间的差距。我们报告了首次为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="519.29" font-size="11.00" class="sc-notoserifcjksc">期一周的提示词注入实时漏洞赏金的结果。</text><text x="72.00 83.00 94.00 105.00 116.00" y="569.59" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc">在大多数对齐（</text><text x="204.00 209.68 212.67 215.76 221.84 228.52 238.35 244.32 250.89" y="569.59" font-size="11.00" class="sc-loraregular">alignment</text><text x="255.15 266.15 277.15 288.15 299.15" y="569.59" font-size="11.00" class="sc-notoserifcjksc">）指标上，</text><text x="310.15 318.88 325.45 332.02 337.11 340.00 345.97 348.67" y="569.59" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="357.75 368.75" y="569.59" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="382.64 391.37 397.94 404.51 409.60 412.49 418.46 420.81" y="569.59" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="569.59" font-size="11.00" class="sc-notoserifcjksc">有所改进，并在这些指</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="585.21" font-size="11.00" class="sc-notoserifcjksc">标上呈现出与我们对齐程度最高的模型</text><text x="261.89 271.83 277.69 281.95 288.54 294.97 300.06 302.96 309.62 314.31 320.22 325.77 328.86 334.78" y="585.21" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="346.48 357.48 368.48 379.48 390.48 401.48 412.48 423.48 434.48 445.48 456.48 467.48 478.48 489.48 500.48 511.48 522.48" y="585.21" font-size="11.00" class="sc-notoserifcjksc">相似的特征。鲁莽和破坏性行为以及过</text><text x="72.00 83.00 94.00 105.00" y="600.83" font-size="11.00" class="sc-notoserifcjksc">度拒绝（</text><text x="116.00 122.38 127.88 133.84 138.52 143.90 148.58 154.54 158.26 164.83 169.92 175.60" y="600.83" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="472.20 480.94 487.50 494.07 499.16 502.06 508.02 510.72" y="600.83" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="519.80" y="600.83" font-size="11.00" class="sc-notoserifcjksc">未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="616.45" font-size="11.00" class="sc-notoserifcjksc">能报告有缺陷代码的倾向远低于以往任何模型。</text><text x="303.00 311.73 318.30 324.87 329.96 332.85 338.82 341.52" y="616.45" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60" y="616.45" font-size="11.00" class="sc-notoserifcjksc">很好地遵循了其宪法</text><text x="72.00" y="632.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="632.07" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81 156.81 167.81 178.81 189.81 200.81 211.81 222.81 233.81 244.81 255.81 266.81 277.81 288.81 299.81 310.81 321.81 332.81 343.81 354.81 365.81 376.81 387.81 398.81 409.81 420.81 431.81 442.81 453.81 464.81 475.81 486.81 497.81 508.81 519.81" y="632.07" font-size="11.00" class="sc-notoserifcjksc">），其言语化表达的推理能够很好地反映其后续行为。我们观察到一些令人担忧</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="647.69" font-size="11.00" class="sc-notoserifcjksc">的迹象，涉及评估意识（</text><text x="193.00 198.91 204.35 210.03 213.02 219.59 225.19 229.44 232.53 238.97 245.65 248.54 254.05 262.75 268.43 273.11 279.08 285.75 291.71 296.81" y="647.69" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="663.31" font-size="11.00" class="sc-notoserifcjksc">些似乎只产生了有限的行为影响，但我们认为这些趋势值得关注。</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 136.00 144.00 152.00 160.00 168.00 176.00 184.00 192.00 200.00 208.00 216.00 224.00 232.00 237.10 239.38 243.88 248.74 253.70 258.13 259.92 267.92 275.92 283.92 291.92 299.92 307.92 315.92 323.92 331.92 339.92 347.92 355.92 363.92 371.92 379.92 387.92 395.92 403.92 411.92 419.92 427.92 435.92 437.71 442.82 445.09 449.59 454.45 459.41 463.84 465.63 473.63 481.63" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text></svg></div>

t><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们在广泛的评估中测试了</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.42" y="195.95" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，涵盖软件工程、推理、长上下文、智能体搜索、多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">智能体、多模态与计算机使用（</text><text x="226.00 231.80 238.23 248.07 254.63 261.20 265.46 271.42 276.18 279.08 285.64 290.74" y="211.57" font-size="11.00" class="sc-loraregular">computer use</text><text x="296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="211.57" font-size="11.00" class="sc-notoserifcjksc">）任务、真实世界的专业工作、多语言任务以及生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">命科学研究。它在几乎所有评估中的表现都优于</text><text x="305.89 314.63 321.19 327.76 332.85 335.75 341.71 344.06" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="349.13 360.13 371.13 382.13 393.13 404.13" y="227.19" font-size="11.00" class="sc-notoserifcjksc">。正如预期，</text><text x="415.13 423.87 430.43 437.00 442.09 444.99 450.95 453.66" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="462.73 473.73 484.73 495.73 506.73 517.73" y="227.19" font-size="11.00" class="sc-notoserifcjksc">整体上仍弱于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y
