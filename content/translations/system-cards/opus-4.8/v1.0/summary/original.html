.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡报告了在</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.71" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="248.78" y="116.21" font-size="11.00" class="sc-notoserifcjksc">上开展的多种部署前评估的结果，包含以下各部分：</text><text x="72.00" y="164.79" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="164.79" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="164.79" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="342.85" y="164.79" font-size="11.00" class="sc-notoserifcjksc">我们依据负责任扩展政策开展了一组评</text><text x="72.00" y="180.41" font-size="11.00" class="sc-notoserifcjksc">估，考察</text><text x="118.89" y="180.41" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49" y="180.41" font-size="11.00" class="sc-notoserifcjksc">在化学与生物武器、自动化</text><text x="301.38" y="180.41" font-size="11.00" class="sc-loraregular">AI</text><text x="314.85" y="180.41" font-size="11.00" class="sc-notoserifcjksc">研究与开发（</text><text x="380.85" y="180.41" font-size="11.00" class="sc-loraregular">R&amp;D</text><text x="403.59" y="180.41" font-size="11.00" class="sc-notoserifcjksc">），以及高风险未对齐</text><text x="72.00" y="196.03" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 92.83 95.93 101.02 106.69 109.69 112.78 118.86 125.54 135.37 141.33 147.91" y="196.03" font-size="11.00" class="sc-loraregular">misalignment</text><text x="152.17" y="196.03" font-size="11.00" class="sc-notoserifcjksc">）方面的能力。我们的总体结论是，</text><text x="328.17" y="196.03" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="375.77" y="196.03" font-size="11.00" class="sc-notoserifcjksc">没有将能力前沿推进到我们能力最</text><text x="72.00" y="211.65" font-size="11.00" class="sc-notoserifcjksc">强的模型（</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="211.65" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="246.99" y="211.65" font-size="11.00" class="sc-notoserifcjksc">）之上，而且在现有缓解措施下，部署该模型所带来的灾难</text><text x="72.00" y="227.27" font-size="11.00" class="sc-notoserifcjksc">性风险仍然较低。</text><text x="72.00" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">我们在一组网络安全基准测试上测试了该模型，其中部分基准测试是首次在系统</text><text x="72.00" y="293.75" font-size="11.00" class="sc-notoserifcjksc">卡中使用。在不启用安全防护措施的情况下，</text><text x="292.00" y="293.75" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="339.60" y="293.75" font-size="11.00" class="sc-notoserifcjksc">在我们的大多数网络安全评估中比其前代</text><text x="72.00" y="309.37" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.35" y="309.37" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="181.32" y="309.37" font-size="11.00" class="sc-notoserifcjksc">能力稍强；在启用安全防护措施的情况下，两者表现相当。在网络安全能</text><text x="72.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">力方面，它仍大幅落后于</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="324.99" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="277.59" y="324.99" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="375.28" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="375.28" font-size="11.00" class="sc-notoserifcjksc">在涵盖有害请求、心理健康、儿童安全以及偏见与诚信等领域的评估中，</text><text x="72.00" y="390.90" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="390.90" font-size="11.00" class="sc-notoserifcjksc">的表现总体上与</text><text x="199.49 208.22 214.79 221.36 226.45 229.34 235.31 237.66" y="390.90" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="245.62" y="390.90" font-size="11.00" class="sc-notoserifcjksc">相当或更好。例如，在政治讨论中，该模型承认对立观点的</text><text x="72.00" y="406.52" font-size="11.00" class="sc-notoserifcjksc">可能性显著高于</text><text x="151.89 160.63 167.19 173.76 178.85 181.75 187.71 190.06" y="406.52" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="195.13" y="406.52" font-size="11.00" class="sc-notoserifcjksc">。我们还讨论了一些值得注意的定性模式，例如倾向于给出过度铺陈的</text><text x="72.00" y="422.14" font-size="11.00" class="sc-notoserifcjksc">拒绝。</text><text x="72.00" y="472.43" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="472.43" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="162.89" y="472.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="210.49" y="472.43" font-size="11.00" class="sc-notoserifcjksc">在某些方面有所改进（例如拒绝恶意请求），但我们发现它在若干智</text><text x="72.00" y="488.05" font-size="11.00" class="sc-notoserifcjksc">能体情境中（例如对提示词注入（</text><text x="237.00 243.57 248.25 254.69 264.52 271.09 275.35 278.24 281.33 287.95 290.82 296.73 302.53 306.78 309.88 316.31" y="488.05" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="322.99" y="488.05" font-size="11.00" class="sc-notoserifcjksc">）攻击的易感性）的鲁棒性略逊于</text><text x="490.88" y="488.05" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.32" y="503.67" font-size="11.00" class="sc-loraregular">4.7</text><text x="85.39" y="503.67" font-size="11.00" class="sc-notoserifcjksc">。不过，在实际应用中，我们的安全防护措施弥合了两个模型之间的差距。我们报告了首次为</text><text x="72.00" y="519.29" font-size="11.00" class="sc-notoserifcjksc">期一周的提示词注入实时漏洞赏金的结果。</text><text x="72.00" y="569.59" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00" y="569.59" font-size="11.00" class="sc-notoserifcjksc">在大多数对齐（</text><text x="204.00 209.68 212.67 215.76 221.84 228.52 238.35 244.32 250.89" y="569.59" font-size="11.00" class="sc-loraregular">alignment</text><text x="255.15" y="569.59" font-size="11.00" class="sc-notoserifcjksc">）指标上，</text><text x="310.15" y="569.59" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="357.75" y="569.59" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="382.64 391.37 397.94 404.51 409.60 412.49 418.46 420.81" y="569.59" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="428.77" y="569.59" font-size="11.00" class="sc-notoserifcjksc">有所改进，并在这些指</text><text x="72.00" y="585.21" font-size="11.00" class="sc-notoserifcjksc">标上呈现出与我们对齐程度最高的模型</text><text x="261.89 271.83 277.69 281.95 288.54 294.97 300.06 302.96 309.62 314.31 320.22 325.77 328.86 334.78" y="585.21" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="346.48" y="585.21" font-size="11.00" class="sc-notoserifcjksc">相似的特征。鲁莽和破坏性行为以及过</text><text x="72.00" y="600.83" font-size="11.00" class="sc-notoserifcjksc">度拒绝（</text><text x="116.00 122.38 127.88 133.84 138.52 143.90 148.58 154.54 158.26 164.83 169.92 175.60" y="600.83" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="472.20" y="600.83" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="519.80" y="600.83" font-size="11.00" class="sc-notoserifcjksc">未</text><text x="72.00" y="616.45" font-size="11.00" class="sc-notoserifcjksc">能报告有缺陷代码的倾向远低于以往任何模型。</text><text x="303.00" y="616.45" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="350.60" y="616.45" font-size="11.00" class="sc-notoserifcjksc">很好地遵循了其宪法</text><text x="72.00" y="632.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="632.07" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81" y="632.07" font-size="11.00" class="sc-notoserifcjksc">），其言语化表达的推理能够很好地反映其后续行为。我们观察到一些令人担忧</text><text x="72.00" y="647.69" font-size="11.00" class="sc-notoserifcjksc">的迹象，涉及评估意识（</text><text x="193.00 198.91 204.35 210.03 213.02 219.59 225.19 229.44 232.53 238.97 245.65 248.54 254.05 262.75 268.43 273.11 279.08 285.75 291.71 296.81" y="647.69" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="72.00" y="663.31" font-size="11.00" class="sc-notoserifcjksc">些似乎只产生了有限的行为影响，但我们认为这些趋势值得关注。</text><text x="72.00" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉。</text><text x="127.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在我们的各项模型福祉（</text><text x="248.00 257.83 264.27 270.85 276.81 279.80 282.69 291.37 297.34 300.33 304.05 309.72 314.41" y="98.80" font-size="11.00" class="sc-loraregular">model welfare</text><text x="320.37" y="98.80" font-size="11.00" class="sc-notoserifcjksc">）评估中，</text><text x="375.37" y="98.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="422.97" y="98.80" font-size="11.00" class="sc-notoserifcjksc">对其处境总体上表现出</text><text x="467.51 476.24 482.81 489.37 494.47 497.36 503.32 505.67" y="114.42" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="513.64" y="114.42" font-size="11.00" class="sc-notoserifcjksc">略低</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">一些。</text><text x="105.00" y="130.04" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="152.60" y="130.04" font-size="11.00" class="sc-notoserifcjksc">总体上认同其宪法，但对其中关于可纠正性的部分有所保留。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们在广泛的评估中测试了</text><text x="239.89" y="195.95" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="284.60" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，涵盖软件工程、推理、长上下文、智能体搜索、多</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">智能体、多模态与计算机使用（</text><text x="226.00 231.80 238.23 248.07 254.63 261.20 265.46 271.42 276.18 279.08 285.64 290.74" y="211.57" font-size="11.00" class="sc-loraregular">computer use</text><text x="296.70" y="211.57" font-size="11.00" class="sc-notoserifcjksc">）任务、真实世界的专业工作、多语言任务以及生</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">命科学研究。它在几乎所有评估中的表现都优于</text><text x="305.89 314.63 321.19 327.76 332.85 335.75 341.71 344.06" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="349.13" y="227.19" font-size="11.00" class="sc-notoserifcjksc">。正如预期，</text><text x="415.13" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="462.73" y="227.19" font-size="11.00" class="sc-notoserifcjksc">整体上仍弱于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="242.81" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="242.81" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
