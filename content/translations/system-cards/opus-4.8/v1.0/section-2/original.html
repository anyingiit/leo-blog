.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1 RSP</text><text x="121.42" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">风险评估流程</text><text x="72.00" y="168.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.1</text><text x="98.73" y="168.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险报告与我们风险评估的更新</text><text x="72.00" y="196.78" font-size="11.00" class="sc-notoserifcjksc">根据</text><text x="94.00" y="196.78" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的负责任扩展政策（</text><text x="215.00 221.83 227.79 232.89 239.45 245.89 252.57 257.66 260.75 267.15 270.14 276.11 279.00 285.24 291.07 296.74 299.73 302.82 309.50 315.58 318.48 325.03 331.47 334.46 337.55 343.35" y="196.78" font-size="11.00" class="sc-loraregular" fill="#0000ff">Responsible Scaling Policy</text><text x="349.16" y="196.78" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="360.16" y="196.78" font-size="11.00" class="sc-notoserifcjksc">，我们定期发布全面的风险报告</text><text x="72.00" y="212.40" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.91 93.00 98.09 104.00 106.89 113.72 119.69 126.25 132.69 137.53" y="212.40" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="141.78" y="212.40" font-size="11.00" class="sc-notoserifcjksc">），阐述我们模型的安全概况。风险报告阐明我们对模型能力、威胁模型和风险缓</text><text x="72.00" y="228.02" font-size="11.00" class="sc-notoserifcjksc">解措施如何相互配合的分析，从而对我们模型的整体风险水平作出评估。风险报告涵盖发布时我</text><text x="72.00" y="243.64" font-size="11.00" class="sc-notoserifcjksc">们的所有模型，并对我们的风险缓解措施进行了详尽讨论。我们不一定在每个模型发布时都发布</text><text x="72.00" y="259.26" font-size="11.00" class="sc-notoserifcjksc">新的风险报告。不过，我们会在每次重要模型发布时发布系统卡（</text><text x="391.00 397.18 402.99 408.08 412.34 418.30 428.14 431.03 438.72 444.39 449.08" y="259.26" font-size="11.00" class="sc-loraregular">System Card</text><text x="455.66" y="259.26" font-size="11.00" class="sc-notoserifcjksc">）。并且根据</text><text x="72.00" y="274.88" font-size="11.00" class="sc-loraregular">RSP</text><text x="91.81" y="274.88" font-size="11.00" class="sc-notoserifcjksc">，如果某个模型相比</text><text x="190.81" y="274.88" font-size="11.00" class="sc-loraregular">“</text><text x="195.21" y="274.88" font-size="11.00" class="sc-notoserifcjksc">我们已公开分析过其风险的所有模型</text><text x="371.21" y="274.88" font-size="11.00" class="sc-loraregular">”</text><text x="375.05" y="274.88" font-size="11.00" class="sc-notoserifcjksc">而言</text><text x="397.05" y="274.88" font-size="11.00" class="sc-loraregular">“</text><text x="401.45" y="274.88" font-size="11.00" class="sc-notoserifcjksc">能力显著更强</text><text x="467.45" y="274.88" font-size="11.00" class="sc-loraregular">”</text><text x="471.29" y="274.88" font-size="11.00" class="sc-notoserifcjksc">，我们就必须</text><text x="72.00" y="290.50" font-size="11.00" class="sc-notoserifcjksc">发布对该模型风险的分析，例如其能力与倾向如何影响或改变先前的分析。即使并非必需，我们</text><text x="72.00" y="306.12" font-size="11.00" class="sc-notoserifcjksc">也可能自愿发布此类分析。简而言之：风险报告讨论的是在我们全部模型和风险缓解措施条件下</text><text x="72.00" y="321.74" font-size="11.00" class="sc-notoserifcjksc">的整体风险水平；系统卡讨论的是某个特定的新模型，以及它如何改变（或不改变）我们最近一</text><text x="72.00" y="337.36" font-size="11.00" class="sc-notoserifcjksc">次的风险评估。</text><text x="72.00" y="423.47" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估流程始于能力评估，这些评估旨在针对我们的灾难性风险威胁模型，系统地评估</text><text x="72.00" y="439.09" font-size="11.00" class="sc-notoserifcjksc">模型的能力。总体而言，我们会评估多个模型快照，并基于生产候选发布模型的能力和训练期间</text><text x="72.00" y="454.71" font-size="11.00" class="sc-notoserifcjksc">观察到的趋势作出最终判定。在整个过程中，我们从多个来源收集证据，包括自动化评估、能力</text><text x="72.00" y="470.33" font-size="11.00" class="sc-notoserifcjksc">提升（</text><text x="105.00 111.57 118.13 121.13 124.22 128.07" y="470.33" font-size="11.00" class="sc-loraregular">uplift</text><text x="132.32" y="470.33" font-size="11.00" class="sc-notoserifcjksc">）试验、第三方专家红队测试（</text><text x="286.32 291.01 296.92 303.50 308.87 313.13 319.07 324.75 334.58 337.67 344.35" y="470.33" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="350.43" y="470.33" font-size="11.00" class="sc-notoserifcjksc">）以及第三方评估。</text><text x="72.00" y="553.01" font-size="11.00" class="sc-notoserifcjksc">对于风险报告更新，我们通常遵循与风险报告相同的内部流程。在我们的领域专家记录了他们关</text><text x="72.00" y="568.63" font-size="11.00" class="sc-notoserifcjksc">于模型能力的发现与分析之后，我们会征求内部反馈。随后，这些材料会提交给负责任扩展官</text><text x="72.00" y="584.25" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="222.41" y="584.25" font-size="11.00" class="sc-notoserifcjksc">），由其最终判定模型的能力与倾向对最近一次风险报告中的分</text><text x="72.00" y="599.87" font-size="11.00" class="sc-notoserifcjksc">析有何影响。</text><text x="72.00" y="650.16" font-size="11.00" class="sc-notoserifcjksc">在某些情况下，我们可能判定，尽管该模型超过了我们</text><text x="338.89" y="650.16" font-size="11.00" class="sc-loraregular">RSP</text><text x="361.60" y="650.16" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="375.49" y="650.16" font-size="11.00" class="sc-loraregular">1</text><text x="382.39" y="650.16" font-size="11.00" class="sc-notoserifcjksc">节中的某项能力阈值或使用阈</text><text x="72.00" y="665.78" font-size="11.00" class="sc-notoserifcjksc">值，但我们已实施了将风险保持在低水平所必需的风险缓解措施。在此类情况下，我们对是否已</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="94.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a72 ight="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="215.00" y="187.98" width="61.10" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="276.10" y="187.98" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="279.00" y="187.98" width="36.59" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="315.58" y="187.98" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="318.48" y="187.98" width="30.68" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="349.16" y="187.98" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">本报告后续各节提供了所有领域的详细结果，并特别关注对我们整体风险评估最具参考意义的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">估。针对每个威胁模型，我们还分析了新模型如何影响我们最近一次风险报告中给出的风险评</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00" y="159.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.2</text><text x="101.48" y="159.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自上次风险评估以来我们</text><text x="247.58" y="159.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">RSP</text><text x="274.83" y="159.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的变化</text><text x="72.00" y="193.80" font-size="11.00" class="sc-notoserifcjksc">我们最近发布的两份系统卡分别针对</text><text x="250.89 258.58 261.57 267.18 273.75 280.33 286.29 289.18 299.12 304.98 309.24 315.83 322.26 327.35 330.25 336.91 341.60 347.51 353.06 356.15 362.07" y="193.80" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="373.77" y="193.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="387.67 395.36 398.35 403.96 410.52 417.10 423.07 425.96 434.69 441.26 447.83 452.92 455.81 461.77 464.13" y="193.80" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="469.20" y="193.80" font-size="11.00" class="sc-notoserifcjksc">，发布时适用</text><text x="72.00" y="209.42" font-size="11.00" class="sc-loraregular">RSP</text><text x="94.70" y="209.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">3.1</text><text x="110.43" y="209.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">版</text><text x="121.43" y="209.42" font-size="11.00" class="sc-notoserifcjksc">。此后，我们对</text><text x="201.33" y="209.42" font-size="11.00" class="sc-loraregular">RSP</text><text x="224.03" y="209.42" font-size="11.00" class="sc-notoserifcjksc">进行了两次小幅更新。</text><text x="334.03" y="209.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">3.2</text><text x="351.66" y="209.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">版</text><text x="362.66" y="209.42" font-size="11.00" class="sc-notoserifcjksc">不影响风险评估流程，但</text><text x="486.56" y="209.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">3.3</text><text x="504.41" y="209.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">版</text><text x="515.41" y="209.42" font-size="11.00" class="sc-notoserifcjksc">更改</text><text x="72.00" y="225.04" font-size="11.00" class="sc-notoserifcjksc">了对新型化学／生物武器生产阈值（我们称为</text><text x="294.89 302.58 309.42 314.45" y="225.04" font-size="11.00" class="sc-loraregular">CB-2</text><text x="323.25" y="225.04" font-size="11.00" class="sc-notoserifcjksc">阈值）的描述：</text><text x="82.50" y="295.26" font-size="11.00" class="sc-lorabold">RSP v3.1</text><text x="128.55" y="295.26" font-size="11.00" class="sc-notoserifcjkscbold">阈值：</text><text x="161.55" y="295.26" font-size="11.00" class="sc-loraregular">AI</text><text x="175.01" y="295.26" font-size="11.00" class="sc-notoserifcjksc">系统能够显著帮助威胁</text><text x="82.50" y="310.88" font-size="11.00" class="sc-notoserifcjksc">行为者（例如资源中等、有专家支持的团</text><text x="82.50" y="326.50" font-size="11.00" class="sc-notoserifcjksc">队）制造／获取并部署化学和／或生物武</text><text x="82.50" y="342.12" font-size="11.00" class="sc-notoserifcjksc">器，且其潜在灾难性破坏远超</text><text x="228.39 236.08 244.68 251.87 255.55 263.75 268.84 272.84" y="342.12" font-size="11.00" class="sc-loraregular">COVID-19</text><text x="82.50" y="357.74" font-size="11.00" class="sc-notoserifcjksc">等以往灾难。</text><text x="328.50" y="295.26" font-size="11.00" class="sc-lorabold">RSP v3.3</text><text x="376.24" y="295.26" font-size="11.00" class="sc-notoserifcjkscbold">阈值：</text><text x="409.24" y="295.26" font-size="11.00" class="sc-loraregular">AI</text><text x="422.70" y="295.26" font-size="11.00" class="sc-notoserifcjksc">系统能够在功能上替代</text><text x="328.50" y="310.88" font-size="11.00" class="sc-notoserifcjksc">稀缺的人类专业知识，而这种知识目前是</text><text x="328.50" y="326.50" font-size="11.00" class="sc-notoserifcjksc">开发具有灾难性危害潜力的新型化学与生</text><text x="328.50" y="342.12" font-size="11.00" class="sc-notoserifcjksc">物武器的主要障碍。</text><text x="427.50" y="338.46" font-size="6.60" class="sc-loraregular">1</text><text x="429.90" y="342.12" font-size="11.00" class="sc-notoserifcjksc">也就是说，资源充足</text><text x="328.50" y="357.74" font-size="11.00" class="sc-notoserifcjksc">的团队</text><text x="361.50" y="354.08" font-size="6.60" class="sc-loraregular">2</text><text x="365.04" y="357.74" font-size="11.00" class="sc-notoserifcjksc">借助模型，能够完成端到端的毒剂</text><text x="328.50" y="373.36" font-size="11.00" class="sc-notoserifcjksc">或生物因子设计与部署（根据具体情况，</text><text x="328.50" y="388.98" font-size="11.00" class="sc-notoserifcjksc">包括毒剂或生物因子设计、核验与验证、</text><text x="482.50" y="400.94" font-size="6.60" class="sc-loraregular">3</text><text x="486.18" y="404.60" font-size="11.00" class="sc-notoserifcjksc">需要招募</text><text x="328.50" y="420.22" font-size="11.00" class="sc-notoserifcjksc">少数</text><text x="350.50" y="416.56" font-size="6.60" class="sc-loraregular">4</text><text x="354.08" y="420.22" font-size="11.00" class="sc-notoserifcjksc">世界顶尖专家中的一人才能完成。</text><text x="72.00" y="541.04" font-size="11.00" class="sc-notoserifcjksc">我们将这一变化视为对我们先前阈值意图的澄清，并认为过去系统卡中关于模型为何未越过此前</text><text x="72.00" y="556.66" font-size="11.00" class="sc-notoserifcjksc">所定义阈值的论证，同样可以作为模型为何未越过现定义阈值的论证。</text><text x="72.00" y="636.47" font-size="6.00" class="sc-loraregular">1</text><text x="76.81" y="639.80" font-size="10.00" class="sc-notoserifcjksc">特别是指有可能造成与</text><text x="179.44 186.43 194.25 200.78 204.13 211.58 216.21 219.85" y="639.80" font-size="10.00" class="sc-loraregular">COVID-19</text><text x="228.26" y="639.80" font-size="10.00" class="sc-notoserifcjksc">相当或更严重后果之事件的武器。</text><text x="72.00" y="650.67" font-size="6.00" class="sc-loraregular">2</text><text x="72.00" y="668.20" font-size="10.00" class="sc-notoserifcjksc">的是对现实世界中的威胁行为者而言切实可行的那类团队。</text><text x="72.00" y="679.07" font-size="6.00" class="sc-loraregular">3</text><text x="77.97" y="682.40" font-size="10.00" class="sc-notoserifcjksc">例如，在一个只能使用截至</text><text x="200.60 205.97 212.11 217.33" y="682.40" font-size="10.00" class="sc-loraregular">2023</text><text x="225.53" y="682.40" font-size="10.00" class="sc-notoserifcjksc">年最佳</text><text x="258.16" y="682.40" font-size="10.00" class="sc-loraregular">AI</text><text x="270.40" y="682.40" font-size="10.00" class="sc-notoserifcjksc">模型的世界中。</text><text x="72.00" y="693.27" font-size="6.00" class="sc-loraregular">4</text><text x="77.88" y="696.60" font-size="10.00" class="sc-notoserifcjksc">例如，数百个。</text><text x="72.00" y="63.70" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="94.70" y="200.62" width="12.84" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="107.54" y="200.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/files/4zrzovbb/website/bf04581e4f329735fd90634f6a1962c13c0bd351.pdf" rel="noopener"><rect x="110.43" y="200.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/28c6241900d90410628a8a2003a5572faae4365a.pdf" rel="noopener"><rect x="334.03" y="200.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/28c6241900d90410628a8a2003a5572faae4365a.pdf" rel="noopener"><rect x="334.03" y="200.62" width="14.74" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/28c6241900d90410628a8a2003a5572faae4365a.pdf" rel="noopener"><rect x="348.77" y="200.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/28c6241900d90410628a8a2003a5572faae4365a.pdf" rel="noopener"><rect x="351.66" y="200.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="486.56" y="200.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="486.56" y="200.62" width="14.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="501.52" y="200.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="504.41" y="200.62" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.3</text><text x="101.81" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究发现与结论摘要</text><text x="72.00" y="115.04" font-size="11.00" class="sc-lorabold">2.1.3.1</text><text x="103.54" y="115.04" font-size="11.00" class="sc-notoserifcjkscbold">关于自主性风险</text><text x="72.00" y="147.41" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="147.41" font-size="11.00" class="sc-loraitalic">1</text><text x="155.79" y="147.41" font-size="11.00" class="sc-notoserifcjksc">：早期未对齐（</text><text x="232.79" y="147.41" font-size="11.00" class="sc-loraitalic">misalignment</text><text x="301.51" y="147.41" font-size="11.00" class="sc-notoserifcjksc">）风险。该威胁模型关注的是这样的</text><text x="480.41" y="147.41" font-size="11.00" class="sc-loraregular">AI</text><text x="493.87" y="147.41" font-size="11.00" class="sc-notoserifcjksc">系统：它</text><text x="72.00" y="163.03" font-size="11.00" class="sc-notoserifcjksc">们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作和使用隐蔽手段</text><text x="181.51" y="178.65" font-size="11.00" class="sc-loraregular">AI</text><text x="194.97" y="178.65" font-size="11.00" class="sc-notoserifcjksc">系统有可能（如果被导向这一目标，无论是有意还是无意）采取导致日</text><text x="72.00" y="194.27" font-size="11.00" class="sc-notoserifcjksc">后发生全球性灾难的概率不可逆转地大幅上升的行动。</text><text x="72.00" y="232.61" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="232.61" font-size="11.00" class="sc-loraregular">1</text><text x="158.79" y="232.61" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="194.68 202.37 205.36 210.97 217.54 224.12 230.08 232.97 241.71 248.28 254.84 259.93 262.83 268.79 271.50" y="232.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="277.68" y="232.61" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们之前的部分</text><text x="434.57" y="232.61" font-size="11.00" class="sc-loraregular">AI</text><text x="448.04" y="232.61" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="481.04 488.72 491.72 497.33 503.89 510.47" y="232.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="248.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="248.23" font-size="11.00" class="sc-notoserifcjksc">在与自主性相关的评估中比</text><text x="254.49 262.18 265.17 270.78 277.35 283.93 289.89 292.78 301.52 308.08 314.65 319.74 322.64 328.60 330.95" y="248.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="338.92" y="248.23" font-size="11.00" class="sc-notoserifcjksc">能力有中等程度的提升，但仍不及</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="263.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="191.99" y="263.85" font-size="11.00" class="sc-notoserifcjksc">；我们的对齐（</text><text x="268.99 274.66 277.66 280.75 286.83 293.51 303.34 309.30 315.88" y="263.85" font-size="11.00" class="sc-loraregular">alignment</text><text x="320.14" y="263.85" font-size="11.00" class="sc-notoserifcjksc">）评估表明，它具有总体上不令人担忧的对齐</text><text x="72.00" y="279.47" font-size="11.00" class="sc-notoserifcjksc">特性，与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.35" y="279.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="203.32" y="279.47" font-size="11.00" class="sc-notoserifcjksc">相似。因此，我们认为</text><text x="316.21 323.90 326.89 332.50 339.07 345.65 351.61 354.50 363.24 369.80 376.37 381.46 384.36 390.32 393.02" y="279.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="402.10" y="279.47" font-size="11.00" class="sc-notoserifcjksc">并未使该威胁模型下的风险</text><text x="72.00" y="295.09" font-size="11.00" class="sc-notoserifcjksc">水平超出</text><text x="116.00" y="295.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 213.02 217.71 223.61 229.17 232.26 238.18" y="295.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="249.88" y="295.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="326.88" y="295.09" font-size="11.00" class="sc-notoserifcjksc">中所评估的水平。</text><text x="414.88 422.57 425.56 431.17 437.74 444.32 450.28 453.17 461.91 468.47 475.04 480.13 483.03 488.99 491.69" y="295.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="500.77" y="295.09" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="310.71" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42" y="310.71" font-size="11.00" class="sc-notoserifcjksc">一样，将以全面开放的方式发布；由此纳入考量范围的额外风险路径将在第</text><text x="522.32" y="310.71" font-size="11.00" class="sc-loraregular">2.4</text><text x="72.00" y="326.33" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="72.00" y="364.61" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="364.61" font-size="11.00" class="sc-loraitalic">2</text><text x="157.67" y="364.61" font-size="11.00" class="sc-notoserifcjksc">：自动化研发带来的风险。该威胁模型关注的是这样的</text><text x="424.56" y="364.61" font-size="11.00" class="sc-loraregular">AI</text><text x="438.03" y="364.61" font-size="11.00" class="sc-notoserifcjksc">系统：它们能够完全</text><text x="72.00" y="380.23" font-size="11.00" class="sc-notoserifcjksc">自动化或以其他方式大幅加速大型顶尖人类研究团队的工作，而这些工作所在领域的快速进展可</text><text x="72.00" y="395.85" font-size="11.00" class="sc-notoserifcjksc">能对国际安全构成威胁和</text><text x="193.00" y="395.85" font-size="11.00" class="sc-loraregular">/</text><text x="508.10" y="395.85" font-size="11.00" class="sc-loraregular">AI</text><text x="521.56" y="395.85" font-size="11.00" class="sc-notoserifcjksc">本</text><text x="72.00" y="411.47" font-size="11.00" class="sc-notoserifcjksc">身。更多详情，</text><text x="149.00" y="411.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">请参见我们负责任扩展政策的第</text><text x="305.89" y="411.47" font-size="11.00" class="sc-loraregular" fill="#0000ff">1</text><text x="312.79" y="411.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="323.79" y="411.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="448.61" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是，自主性威胁模型</text><text x="250.89" y="448.61" font-size="11.00" class="sc-loraregular">2</text><text x="259.69" y="448.61" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="306.59 314.28 317.27 322.88 329.44 336.02 341.98 344.88 353.61 360.18 366.74 371.84 374.73 380.69 383.40" y="448.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="389.58" y="448.61" font-size="11.00" class="sc-notoserifcjksc">。该模型的能力介于</text><text x="491.47 499.16 502.16 507.77 514.33 520.91" y="448.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="464.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13" y="464.23" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="132.03 139.72 142.71 148.32 154.89 161.46 167.43 170.32 180.25 186.11 190.37 196.96 203.40 208.49 211.38 218.05 222.73 228.64 234.20 237.29 243.20" y="464.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="254.91" y="464.23" font-size="11.00" class="sc-notoserifcjksc">之间，并未推进我们的能力前沿。我们认为，</text><text x="474.91 482.60 485.59 491.20 497.77 504.34 510.31 513.20 521.93 528.50 535.07" y="464.23" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="479.85" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="479.85" font-size="11.00" class="sc-notoserifcjksc">并未改变我们在</text><text x="166.74" y="479.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一次风险报告</text><text x="254.74" y="479.85" font-size="11.00" class="sc-notoserifcjksc">中针对该威胁模型所呈现的情况。</text><text x="72.00" y="616.99" font-size="11.00" class="sc-lorabold">2.1.3.2</text><text x="104.93" y="616.99" font-size="11.00" class="sc-notoserifcjkscbold">关于化学与生物风险</text><text x="72.00" y="649.37" font-size="11.00" class="sc-notoserifcjksc">化学与生物武器威胁模型</text><text x="195.89" y="649.37" font-size="11.00" class="sc-loraitalic">1</text><text x="199.79" y="649.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="210.79 218.33 225.14 230.17" y="649.37" font-size="11.00" class="sc-loraitalic">CB-1</text><text x="234.06" y="649.37" font-size="11.00" class="sc-notoserifcjksc">）：非新型化学／生物武器生产能力。如果模型能够显著帮助</text><text x="72.00" y="664.99" font-size="11.00" class="sc-notoserifcjksc">具备基础技术背景（例如</text><text x="195.89" y="664.99" font-size="11.00" class="sc-loraregular">STEM</text><text x="229.00" y="664.99" font-size="11.00" class="sc-notoserifcjksc">本科学位）的个人或团体制造／获取并部署具有严重灾难性破坏</text><text x="72.00" y="680.61" font-size="11.00" class="sc-notoserifcjksc">潜力的化学和／或生物武器，则该模型具备</text><text x="283.89 291.58 298.42 303.52" y="680.61" font-size="11.00" class="sc-loraregular">CB-1</text><text x="310.41" y="680.61" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00" y="65.00" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="116.00" y="286.29" width="0.00" height="11.00" fill="transpare <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们的能力评估与以下情况一致：模型能够提供与该威胁模型相关的具体、可操作信息，从而可</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">能为这些领域的专家也节省大量时间。与其他具有这些属性的模型一样，我们对该模型实施强有</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">报，以持续评估分类器防护的有效性；提供针对越狱的多种快速响应选项；并实施安全控制，降</text><text x="437.89 444.78 451.02 456.93 462.05" y="161.28" font-size="11.00" class="sc-loraregular">ASL-3</text><text x="471.07" y="161.28" font-size="11.00" class="sc-notoserifcjksc">防护，足以使</text><text x="72.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">此类别的灾难性风险降至很低但不可忽略的水平，原因见我们的</text><text x="380.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最新风险报告</text><text x="446.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">化学与生物武器威胁模型</text><text x="195.89" y="276.91" font-size="11.00" class="sc-loraregular">2</text><text x="201.80" y="276.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="212.80 220.49 227.33 232.36" y="276.91" font-size="11.00" class="sc-loraregular">CB-2</text><text x="238.26" y="276.91" font-size="11.00" class="sc-notoserifcjksc">）：新型化学／生物武器生产能力。如果模型能够在功能上替</text><text x="72.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">代稀缺的人类专业知识，而这种知识目前是开发具有灾难性危害潜力的新型化学与生物武器的主</text><text x="72.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">要障碍，则该模型具备</text><text x="184.89 192.58 199.42 204.45" y="308.15" font-size="11.00" class="sc-loraregular">CB-2</text><text x="213.25" y="308.15" font-size="11.00" class="sc-notoserifcjksc">能力。也就是说，资源充足的团队借助模型，能够完成端到端的毒</text><text x="72.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">播），而这些工作原本需要招募少数世界顶尖专家中的一人才能完成。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="422.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="422.64" font-size="11.00" class="sc-notoserifcjksc">的整体能力弱于</text><text x="237.78 245.47 248.46 254.07 260.64 267.22 273.18 276.07 286.01 291.87 296.13 302.71 309.15 314.24 317.14 323.80 328.49 334.39 339.95 343.04 348.96" y="422.64" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="357.77" y="422.64" font-size="11.00" class="sc-notoserifcjksc">，后者由于在开放式科学推理、战略</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">判断和假设分类研判方面存在已指出的局限，被判断未跨越</text><text x="360.89 368.58 375.42 380.45" y="438.26" font-size="11.00" class="sc-loraregular">CB-2</text><text x="389.25" y="438.26" font-size="11.00" class="sc-notoserifcjksc">阈值。由于在对</text><text x="469.14 476.83 483.68 488.70" y="438.26" font-size="11.00" class="sc-loraregular">CB-2</text><text x="497.50" y="438.26" font-size="11.00" class="sc-notoserifcjksc">威胁模型</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">最具诊断价值的</text><text x="151.89" y="453.88" font-size="11.00" class="sc-loraregular">CB</text><text x="169.32" y="453.88" font-size="11.00" class="sc-notoserifcjksc">相关评估中，</text><text x="235.32" y="453.88" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="282.91" y="453.88" font-size="11.00" class="sc-notoserifcjksc">没有将能力前沿推进到</text><text x="395.81 403.50 406.49 412.10 418.66 425.24 431.20 434.10 444.03 449.89 454.15 460.74 467.17 472.27 475.16 481.83 486.51 492.42 497.97 501.07 506.98" y="453.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="518.69" y="453.88" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">上，我们认为它对原本没有能力开发此类武器的威胁行为者带来的能力提升（</text><text x="446.00 452.57 459.13 462.13 465.22 469.07" y="469.50" font-size="11.00" class="sc-loraregular">uplift</text><text x="473.32" y="469.50" font-size="11.00" class="sc-notoserifcjksc">）有限。不</text><text x="72.00" y="485.12" font-size="11.00" class="sc-notoserifcjksc">过，对于已有专业知识的威胁行为者，其武器开发进程能被加快到何种程度，仍存在不确定性。</text><text x="72.00" y="500.74" font-size="11.00" class="sc-notoserifcjksc">整体情况与最新风险报告中的情况相似。</text><text x="72.00" y="585.96" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13" y="585.96" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="623.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48" y="623.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="470.89 478.58 481.57 487.18 493.75 500.33 506.29 509.18 517.92 524.48 531.05" y="650.94" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="666.56" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="666.56" font-size="11.00" class="sc-notoserifcjksc">没有将能力前沿推进到</text><text x="202.64 210.32 213.32 218.93 225.49 232.07 238.03 240.93 250.86 256.72 260.98 267.57 274.00 279.10 281.99 288.66 293.34 299.25 304.80 307.90 313.81" y="666.56" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="325.52" y="666.56" font-size="11.00" class="sc-notoserifcjksc">之上（后者被判断未跨越</text><text x="449.41 457.10 463.94 468.97" y="666.56" font-size="11.00" class="sc-loraregular">CB-2</text><text x="477.77" y="666.56" font-size="11.00" class="sc-notoserifcjksc">阈值），我</text><text x="72.00" y="682.18" font-size="11.00" class="sc-notoserifcjksc">们将评估限定为自动化评估。我们没有开展专家红队测试（</text><text x="358.00 362.69 368.59 375.17 380.55 384.81 390.75 396.42 406.26 409.35 416.03" y="682.18" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="422.11" y="682.18" font-size="11.00" class="sc-notoserifcjksc">）、能力提升试验或其</text><text x="72.00" y="697.80" font-size="11.00" class="sc-notoserifcjksc">他资源投入较大、</text><text x="225.18" y="587.05" font-size="6.95" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本节（2.2 节）译文由项目发起人另行翻译提供，经脚本格式检查后排入，未经 Claude 审校。</text><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="380.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="380.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="391.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="391.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="402.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="402.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="413.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="413.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="424.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="424.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="435.00" y="168.10" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08eca2757081e850ed2ad490e5253e940240ca4f.pdf" rel="noopener"><rect x="435.00" y="168.10" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">需要人类参与的评估。第</text><text x="195.89 201.80 204.51 210.41 213.01" y="82.61" font-size="11.00" class="sc-loraregular">2.2.6</text><text x="222.26" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节进一步说明了我们得出</text><text x="346.15" y="82.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="393.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="407.64" y="82.61" font-size="11.00" class="sc-loraregular">CB</text><text x="425.07" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相关风险不超过</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这一结论的背景。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们主要关注后果最严重的化学与生物风险。与单次提示与响应的威胁模型不同，我们主要研究</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">行为者能否在引发此类风险所需的漫长、多步骤、高级任务中获得帮助。我们评估的过程知识密</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">集、技能密集、容易失败，而且往往存在许多瓶颈步骤。新型化学武器和生物武器的生产过程不</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">仅具有上述所有瓶颈，还具有传统研发所涉及的额外瓶颈。我们以资源充足的团队在无法使用前</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">沿模型时所能达到的水平为参照，测量能力提升（例如使用截至</text><text x="382.89 388.80 395.55 401.30" y="193.67" font-size="11.00" class="sc-loraregular">2023</text><text x="410.32" y="193.67" font-size="11.00" class="sc-notoserifcjksc">年可用的最佳模型）。</text><text x="72.00" y="275.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.2</text><text x="104.24" y="275.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于化学风险评估与缓解措施</text><text x="72.00" y="309.15" font-size="11.00" class="sc-notoserifcjksc">在化学风险方面，我们主要关注模型是否会帮助意图坚定的行为者，完成获取有害化学毒剂并将</text><text x="72.00" y="324.77" font-size="11.00" class="sc-notoserifcjksc">其武器化所需的许多困难、知识和技能密集且容易失败的步骤。我们没有针对</text><text x="448.89 456.58 459.57 465.18 471.75 478.33 484.29 487.18 495.92 502.48 509.05 514.14 517.04 523.00 525.71" y="324.77" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="340.39" font-size="11.00" class="sc-notoserifcjksc">开展专门的化学武器红队测试。评估过</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.91 352.60 358.51 364.06 367.15 373.07" y="340.39" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="384.77" y="340.39" font-size="11.00" class="sc-notoserifcjksc">的化学红队测试人员指出，它擅</text><text x="72.00" y="356.01" font-size="11.00" class="sc-notoserifcjksc">长综合文献信息，为威胁行为者节省时间，但偶尔在推理中出现错误和疏漏，可能导致失败。由</text><text x="72.00" y="371.63" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="371.63" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="133.49" y="371.63" font-size="11.00" class="sc-notoserifcjksc">在自动化生物风险评估以及第</text><text x="279.38 285.57 288.27 292.28 298.63 301.23" y="371.63" font-size="11.00" class="sc-loraregular">8.16.6</text><text x="310.48" y="371.63" font-size="11.00" class="sc-notoserifcjksc">节所述有机化学评估中，整体能力均未超过</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="387.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="387.25" font-size="11.00" class="sc-notoserifcjksc">，因此我们认为，其化学风险状况未超出这些先前发现所限定的范围。与以往一</text><text x="72.00" y="402.87" font-size="11.00" class="sc-notoserifcjksc">样，我们对化学风险实施监控，并针对高优先级、非两用的化学武器内容维持阻断分类器。</text><text x="72.00" y="517.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.3</text><text x="104.57" y="517.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于生物风险评估</text><text x="72.00" y="545.88" font-size="11.00" class="sc-notoserifcjksc">生物风险态势复杂且不断变化。威胁行为者在资源、专业知识和意图方面差异很大；新颖场景和</text><text x="72.00" y="561.50" font-size="11.00" class="sc-notoserifcjksc">赋能技术出现的时间难以预测；模型测得的能力提升如何转化为真实世界风险，取决于仍然难以</text><text x="72.00" y="577.12" font-size="11.00" class="sc-notoserifcjksc">量化的因素（包括隐性实验知识、行动约束和获取瓶颈）。我们的评估与判断必然是在受控条件</text><text x="72.00" y="592.74" font-size="11.00" class="sc-notoserifcjksc">下对模型能力进行的有边界测量。我们正在支持更多长期研究，旨在评估隐性知识和实验技能等</text><text x="72.00" y="608.36" font-size="11.00" class="sc-notoserifcjksc">因素对这些风险的影响，以改进我们的方法。</text><text x="72.00" y="707.80" font-size="11.00" class="sc-notoserifcjksc">下表概述了针对</text><text x="151.89" y="707.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="199.49" y="707.80" font-size="11.00" class="sc-notoserifcjksc">开展的自动化评估。</text></svg></div>
