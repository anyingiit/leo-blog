>弱缓解因素</text><text x="237.00 248.00 259.00 270.00 281.00" y="679.69" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="679.69" font-size="11.00" class="sc-notoserifcjksc">该路径的大部分风险集中于其他前沿模型开发者的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="695.31" font-size="11.00" class="sc-notoserifcjksc">使用中，因为在这种情境下，模型破坏</text><text x="261.89 268.78" y="695.31" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36" y="695.31" font-size="11.00" class="sc-notoserifcjksc">研发最有可能增加后续出现</text><text x="75.75 86.25 96.75 107.25 117.75 128.25" y="679.48" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="339.67" y="148.62" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="375.07" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="377.97" y="148.62" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="416.14" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/c <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">重大有害结果的风险。我们的服务条款不允许第三方将我们的工具用于此目的，从而限制了这一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">风险的范围。</text><text x="72.00 77.86 80.43 86.44 89.01 95.17 97.73" y="131.19" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49 117.49" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="131.19" font-size="11.00" class="sc-lorabold">8</text><text x="137.67 148.67 159.67 170.67 181.67 192.67 203.67 214.67 225.67 236.67 247.67 258.67 269.67 280.67" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们的模型在主要国家政府内部的使用会带来一定的对齐风险，尤其是在使用极其广泛的情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">下。例如，一个未对齐的模型可能处于能够影响送达重要决策者的信息与观点的位置，或者能够</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">利用关键系统中的漏洞来造成大范围影响。</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00 325.00 336.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">正如第</text><text x="349.89" y="245.35" font-size="11.00" class="sc-loraregular">6</text><text x="359.14 370.14 381.14 392.14 403.14 414.14 425.14 436.14 447.14 458.14 469.14" y="245.35" font-size="11.00" class="sc-notoserifcjksc">节所讨论的，我们不认为</text><text x="483.04 490.73 493.72 499.33 505.90 512.47" y="245.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="260.97" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="260.97" font-size="11.00" class="sc-notoserifcjksc">具有会导致其试图破坏政府决策或运作的连贯目标或倾向。基于在自动化行为审计中开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">展的少量非常轻量的评估，我们预计，如果模型被部署在政府环境中，其倾向不会发生重要变</text><text x="72.00 83.00" y="292.21" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="75.75 86.25 96.75 107.25 117.75 128.25" y="245.15" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="359.52" font-size="11.00" class="sc-notoserifcjksc">然而，在这种情境下，很难完全排除由第三方对手蓄意植入的行为后门所带来的风险。迄今为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.14" font-size="11.00" class="sc-notoserifcjksc">止，我们尚未看到此类攻击的任何成功案例，但我们对政府使用情况的可见性有限，这使我们更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="390.76" font-size="11.00" class="sc-notoserifcjksc">难在足够真实的处境下开展部署前测试，从而难以确信我们能够发现此类由第三方造成的被植入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="406.38" font-size="11.00" class="sc-notoserifcjksc">后门的行为。</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="457.50" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="457.50" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00 83.00 94.00 105.00 116.00" y="473.12" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89 136.78 143.36 147.61 154.20 158.89 165.32 171.89 174.98" y="473.12" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="504.36" font-size="11.00" class="sc-notoserifcjksc">响相关官员的观点或以其他方式采取高风险行动，恰恰需要这种程度的采用。鉴于</text><text x="470.89 477.78" y="504.36" font-size="11.00" class="sc-loraregular">AI</text><text x="484.36 495.36 506.36 517.36 528.36" y="504.36" font-size="11.00" class="sc-notoserifcjksc">模型目前在</text><text x="75.75 86.25 96.75 107.25 117.75 128.25" y="457.30" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="215.00 226.00 237.00" y="604.88" font-size="11.00" class="sc-notoserifcjkscbold">监控：</text><text x="248.00 259.00" y="604.88" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="604.88" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="604.88" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们监控第三方部署的能力要弱</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="620.50" font-size="11.00" class="sc-notoserifcjksc">得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被模型的用户发现，途径包括可见</text><text x="75.75 86.25 96.75 107.25 117.75" y="604.67" font-size="10.50" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00 79.46 82.84 91.43 94.82" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.4</text><text x="106.50 119.50 132.50 145.50 158.50 171.50 184.50 197.50 210.50" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的整体评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">基于我们关于</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.71" y="111.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78" y="111.03" font-size="11.00" class="sc-notoserifcjksc">倾向与能力的总体结论、我们的监控与安全措施，以及上文和</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="83.00 90.69 93.68 99.29 105.86 112.44 118.40 121.29 131.22 137.09 141.34 147.93 154.37 159.46 162.35 169.02 173.71 179.61 185.17 188.26 194.18" y="126.65" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="205.88 216.88 227.88 238.88 249.88 260.88 271.88" y="126.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="126.65" font-size="11.00" class="sc-notoserifcjksc">中呈现的分路径分析，我们目前认为，由我们的模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">所采取的未对齐行为在很大程度上促成的重大有害结果的风险</text><text x="369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="142.27" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="448.89 456.46 459.89 465.66 472.46 479.01 484.93 487.82 498.14 504.20 508.74 515.58 521.80" y="142.27" font-size="11.00" class="sc-lorabold">Claude Mythos</text><text x="72.00 79.03 84.22 90.14 96.06 99.65 105.57" y="157.89" font-size="11.00" class="sc-lorabold">Preview</text><text x="117.39 128.39 139.39 150.39 161.39 172.39" y="157.89" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="526.67" y="102.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="72.00" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="83.00" y="117.85" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="118.40" y="117.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="121.29" y="117.85" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="159.46" y="117.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="162.35" y="117.85" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview
