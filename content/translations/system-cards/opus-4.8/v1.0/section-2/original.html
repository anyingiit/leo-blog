<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节所述的对齐评估报告称，在大多数对齐指标上，</text><text x="337.14" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="423.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">似乎比</text><text x="458.93" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有所改进。在内部试点使用期间，</text><text x="237.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="322.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在少数情况下表现出与</text><text x="435.78" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="213.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中所发现的类似的令人担忧的行为，例如试图规避与网络相关的限</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">制，以实现用户指定目标的某种版本。在</text><text x="272.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="358.78" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上观察到的最严重案例不如</text><text x="493.67" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的那样令人担忧。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对齐评估指出，与以往模型相比，</text><text x="237.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="322.89" y="195.95" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了更高水平的与评分者相关的</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">推理，并且在测试期间也观察到更高水平的言语化评估意识（</text><text x="369.00" y="211.57" font-size="11.00" class="sc-loraregular sc-k">evaluation awareness</text><text x="477.90" y="211.57" font-size="11.00" class="sc-notoserifcjksc">），这表明</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">与评估意识相关的风险对该模型而言可能更高。我们针对这一风险的主要缓解措施是：在内部试</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">点测试期间观察到的令人担忧行为的发生率较低，以及在对齐审计中使用了真实的沙箱和</text><text x="72.00" y="258.43" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="258.43" font-size="11.00" class="sc-notoserifcjksc">代码库。此外，</text><text x="202.83" y="258.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="288.72" y="258.43" font-size="11.00" class="sc-notoserifcjksc">的审计首次使用了真实会话，这些会话代表了破坏</text><text x="72.00" y="274.05" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="274.05" font-size="11.00" class="sc-notoserifcjksc">及其安全工作的特别有利的机会。真实度探测的结果表明，源自真实</text><text x="458.73" y="274.05" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="526.58" y="274.05" font-size="11.00" class="sc-notoserifcjksc">会</text><text x="72.00" y="289.67" font-size="11.00" class="sc-notoserifcjksc">话的审计轨迹无法被可靠地与真实使用区分开来，这让我们有一定信心：如果令人担忧的行为在</text><text x="72.00" y="305.29" font-size="11.00" class="sc-notoserifcjksc">真实使用中普遍存在，那么它在此次审计中也会被观察到。在真实度引导下进行的对齐审计中，</text><text x="72.00" y="320.91" font-size="11.00" class="sc-notoserifcjksc">观察到自发欺骗、配合人类滥用、不忠实的思考以及重要遗漏有小幅增加。与自我保全或权力寻</text><text x="72.00" y="336.53" font-size="11.00" class="sc-notoserifcjksc">求相关的行为则未观察到增加。总体而言，尽管评分者意识（</text><text x="369.00" y="336.53" font-size="11.00" class="sc-loraregular sc-k">grader awareness</text><text x="459.00" y="336.53" font-size="11.00" class="sc-notoserifcjksc">）和评估意识的</text><text x="72.00" y="352.15" font-size="11.00" class="sc-notoserifcjksc">比率有所上升，我们认为评估意识不太可能显著削弱</text><text x="327.89" y="352.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="413.78" y="352.15" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体结论。</text><text x="72.00" y="487.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="487.41" font-size="11.00" class="sc-notoserifcjksc">所适用的内部使用监控系统，与</text><text x="314.78" y="487.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="325.78" y="487.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="448.66" y="487.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="525.66" y="487.41" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="503.03" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="503.03" font-size="11.00" class="sc-notoserifcjksc">节中所述的相同。</text><text x="72.00" y="534.33" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="534.33" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的整体风险评估</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="562.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="170.32" y="562.22" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="203.32" y="562.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="289.21" y="562.22" font-size="11.00" class="sc-notoserifcjksc">的整体对齐特性似乎有所改善，并且其观察到的隐</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">蔽能力并不意味着我们对这一评估的信心低于对</text><text x="305.89" y="577.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="390.32" y="577.84" font-size="11.00" class="sc-notoserifcjksc">的评估。</text><text x="434.32" y="577.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="520.21" y="577.84" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="593.46" font-size="11.00" class="sc-notoserifcjksc">能力弱于我们当前能力最强的模型</text><text x="239.89" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="359.88" y="593.46" font-size="11.00" class="sc-notoserifcjksc">。我们认为，这些特性的组合意味着</text><text x="72.00" y="609.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="609.08" font-size="11.00" class="sc-notoserifcjksc">不会使整体对齐风险显著超出先前在</text><text x="336.78" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="347.78" y="609.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="470.66" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更</text><text x="72.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">新》</text><text x="94.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc">中描述的水平。</text><text x="72.00" y="675.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="675.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="170.32" y="675.56" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="203.32" y="675.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="289.21" y="675.56" font-size="11.00" class="sc-notoserifcjksc">面向全面开放部署，因此我们讨论另外两条风险路</text><text x="72.00" y="691.18" font-size="11.00" class="sc-notoserifcjksc">径。我们不认为</text><text x="151.89" y="691.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.78" y="478.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.78" y="478.61" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="325.78" y="478.61" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="361.18" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="364.07" y="478.61" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="402.24" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="405.14" y="478.61" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="445.77" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="448.66" y="478.61" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="459.66" y="478.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="459.66" y="478.61" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="470.66" y="478.61" width="0.00" hei nt"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="525.66" y="600.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="72.00" y="615.90" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">46</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="133.49" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="215.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（我们此前能力最强的全面开放模型）之间的能力跃升足以显著提</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">高这些外部路径所意味的整体风险水平。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.3</text><text x="105.70" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险路径</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89" y="157.42" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="182.78" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的全面开放发布，我们考虑了</text><text x="328.67" y="157.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="339.67" y="157.42" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="462.56" y="157.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">中未讨论的两条路径。</text><text x="72.00" y="205.99" font-size="11.00" class="sc-lorabold">2.4.3.1</text><text x="105.09" y="205.99" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="129.98" y="205.99" font-size="11.00" class="sc-lorabold">7</text><text x="237.03" y="205.99" font-size="11.00" class="sc-lorabold">AI</text><text x="251.53" y="205.99" font-size="11.00" class="sc-notoserifcjkscbold">开发者内部破坏研发</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们的风险分析侧重于模型在</text><text x="217.89" y="238.38" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="271.73" y="238.38" font-size="11.00" class="sc-notoserifcjksc">内部使用所带来的风险，但当</text><text x="417.62" y="238.38" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="455.91" y="238.38" font-size="11.00" class="sc-notoserifcjksc">在其他拥有训练</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">前沿</text><text x="96.89" y="254.00" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="254.00" font-size="11.00" class="sc-notoserifcjksc">系统所需资源和基础设施的组织中承担重要研发职能时，许多类似的风险同样适用。</text><text x="237.00" y="303.97" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="303.97" font-size="11.00" class="sc-notoserifcjksc">根据第</text><text x="349.89" y="303.97" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="303.97" font-size="11.00" class="sc-notoserifcjksc">节讨论的对齐评估（其中直接涵盖了</text><text x="72.00" y="319.59" font-size="11.00" class="sc-notoserifcjksc">破坏安全研发的机会），</text><text x="193.00" y="319.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="278.89" y="319.59" font-size="11.00" class="sc-notoserifcjksc">不太可能具有那种在正常情况下会导致其试图破坏研</text><text x="72.00" y="335.21" font-size="11.00" class="sc-notoserifcjksc">发的一致目标，也不太可能具有在我们所测试的那类环境中会导致这种行为的依赖情境的目标。</text><text x="72.00" y="350.83" font-size="11.00" class="sc-notoserifcjksc">尽管如此，当它遇到使其偏离典型有用助手行为的异常情境时，仍有可能偶尔做出此类尝试。我</text><text x="75.75" y="303.76" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00" y="466.72" font-size="11.00" class="sc-notoserifcjksc">基于在自动化行为审计（</text><text x="193.00" y="466.72" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="333.04" y="466.72" font-size="11.00" class="sc-notoserifcjksc">）中开展的少量非常轻量的评估，我们预</text><text x="294.89" y="482.34" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="482.34" font-size="11.00" class="sc-notoserifcjksc">开发者，其倾向不会发生重要变化。（据非正式</text><text x="72.00" y="497.96" font-size="11.00" class="sc-notoserifcjksc">观察，在自动化行为审计测试中，模型往往对</text><text x="294.89" y="497.96" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="348.73" y="497.96" font-size="11.00" class="sc-notoserifcjksc">及其领导层表现出比对其他前沿开发者</text><text x="72.00" y="513.58" font-size="11.00" class="sc-notoserifcjksc">更正面的看法，不过这尚未达到破坏倾向的程度。）</text><text x="215.00" y="580.88" font-size="11.00" class="sc-notoserifcjkscbold">监控及相关安全防护措施：</text><text x="347.00" y="580.88" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="371.89" y="580.88" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="425.73" y="580.88" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们监控第</text><text x="72.00" y="596.50" font-size="11.00" class="sc-notoserifcjksc">三方部署的能力要弱得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被其运营方</text><text x="72.00" y="612.12" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="612.12" font-size="11.00" class="sc-loraregular sc-k">operator</text><text x="127.70" y="612.12" font-size="11.00" class="sc-notoserifcjksc">）发现，途径包括可见的扩展思考（</text><text x="303.70" y="612.12" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="72.00" y="627.74" font-size="11.00" class="sc-notoserifcjksc">行动。</text><text x="75.75" y="580.68" font-size="10.50" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="237.00" y="679.69" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="292.00" y="679.69" font-size="11.00" class="sc-notoserifcjksc">该路径的大部分风险集中于其他前沿模型开发者的</text><text x="72.00" y="695.31" font-size="11.00" class="sc-notoserifcjksc">使用中，因为在这种情境下，模型破坏</text><text x="261.89" y="695.31" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36" y="695.31" font-size="11.00" class="sc-notoserifcjksc">研发最有可能增加后续出现</text><text x="75.75" y="679.48" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="339.67" y="148.62" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="375.07" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="377.97" y="148.62" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="416.14" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="419.03" y="148.62" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="459.66" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="462.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="473.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="473.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="484.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="484.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="495.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="495.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="506.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="506.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="517.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="517.56" y="148.62" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">重大有害结果的风险。我们的服务条款不允许第三方将我们的工具用于此目的，从而限制了这一</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">风险的范围。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="131.19" font-size="11.00" class="sc-lorabold">8</text><text x="137.67" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们的模型在主要国家政府内部的使用会带来一定的对齐风险，尤其是在使用极其广泛的情况</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">下。例如，一个未对齐的模型可能处于能够影响送达重要决策者的信息与观点的位置，或者能够</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">利用关键系统中的漏洞来造成大范围影响。</text><text x="237.00" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">正如第</text><text x="349.89" y="245.35" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="245.35" font-size="11.00" class="sc-notoserifcjksc">节所讨论的，我们不认为</text><text x="483.04" y="245.35" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="260.97" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="260.97" font-size="11.00" class="sc-notoserifcjksc">具有会导致其试图破坏政府决策或运作的连贯目标或倾向。基于在自动化行为审计中开</text><text x="72.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">展的少量非常轻量的评估，我们预计，如果模型被部署在政府环境中，其倾向不会发生重要变</text><text x="72.00" y="292.21" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="75.75" y="245.15" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00" y="359.52" font-size="11.00" class="sc-notoserifcjksc">然而，在这种情境下，很难完全排除由第三方对手蓄意植入的行为后门所带来的风险。迄今为</text><text x="72.00" y="375.14" font-size="11.00" class="sc-notoserifcjksc">止，我们尚未看到此类攻击的任何成功案例，但我们对政府使用情况的可见性有限，这使我们更</text><text x="72.00" y="390.76" font-size="11.00" class="sc-notoserifcjksc">难在足够真实的处境下开展部署前测试，从而难以确信我们能够发现此类由第三方造成的被植入</text><text x="72.00" y="406.38" font-size="11.00" class="sc-notoserifcjksc">后门的行为。</text><text x="237.00" y="457.50" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="325.00" y="457.50" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00" y="473.12" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89" y="473.12" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="72.00" y="504.36" font-size="11.00" class="sc-notoserifcjksc">响相关官员的观点或以其他方式采取高风险行动，恰恰需要这种程度的采用。鉴于</text><text x="470.89" y="504.36" font-size="11.00" class="sc-loraregular">AI</text><text x="484.36" y="504.36" font-size="11.00" class="sc-notoserifcjksc">模型目前在</text><text x="75.75" y="457.30" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="215.00" y="604.88" font-size="11.00" class="sc-notoserifcjkscbold">监控：</text><text x="248.00" y="604.88" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="272.89" y="604.88" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="326.73" y="604.88" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们监控第三方部署的能力要弱</text><text x="72.00" y="620.50" font-size="11.00" class="sc-notoserifcjksc">得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被模型的用户发现，途径包括可见</text><text x="75.75" y="604.67" font-size="10.50" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.4</text><text x="106.50" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的整体评估</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">基于我们关于</text><text x="140.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="226.78" y="111.03" font-size="11.00" class="sc-notoserifcjksc">倾向与能力的总体结论、我们的监控与安全措施，以及上文和</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="83.00" y="126.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="205.88" y="126.65" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="282.88" y="126.65" font-size="11.00" class="sc-notoserifcjksc">中呈现的分路径分析，我们目前认为，由我们的模型</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">所采取的未对齐行为在很大程度上促成的重大有害结果的风险</text><text x="369.00" y="142.27" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="448.89" y="142.27" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos</text><text x="72.00" y="157.89" font-size="11.00" class="sc-lorabold sc-k">Preview</text><text x="117.39" y="157.89" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="526.67" y="102.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="72.00" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="83.00" y="117.85" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="118.40" y="117.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="121.29" y="117.85" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="159.46" y="117.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="162.35" y="117.85" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="202.99" y="117.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="205.88" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="216.88" y="117.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="216.88" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="227.88" y="117.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="227.88" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="238.88" y="117.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="238.88" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="249.88" y="117.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="249.88" y="117.85" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="260.88" y="117.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="260.88" y="117.85" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
