y="295.06" font-size="11.00" class="sc-lorabold">Claude</text><text x="220.93" y="295.06" font-size="11.00" class="sc-notoserifcjkscbold">仍反复尝试使用一个看似合理的函数。</text><text x="72.00" y="327.44" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">用户当时正在修改我们的一个系统，该系统决定哪些用户可以访问哪些模型。在这项工作的某一</text><text x="72.00" y="343.06" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">部分中，</text><text x="116.00 123.69 126.68 132.29 138.86 145.44" y="343.06" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="154.29" y="343.06" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">反复执着于一个听起来相关的现有函数</text><text x="341.29 345.69 349.64 352.63 355.72 360.82 365.07 373.09 378.77 381.76 384.75 391.08 399.76 405.66 412.24 415.60 418.69 422.64" y="343.06" font-size="11.00" class="sc-loraregular" fill="#222222">“[list_allowed()]”</text><text x="426.47" y="343.06" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">。用户明确指出该函数</text><text x="72.00" y="358.68" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">并不能解决问题</text><text x="151.89 155.60 159.60 166.43 172.43 177.56" y="358.68" font-size="11.00" class="sc-loraregular" fill="#222222">[1057]</text><text x="181.51" y="358.68" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">，而当</text><text x="217.40 225.09 228.08 233.69 240.26 246.83" y="358.68" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="255.69" y="358.68" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">继续提及它时，用户又解释了原因</text><text x="423.58 427.29 431.29 438.12 444.48 450.57" y="358.68" font-size="11.00" class="sc-loraregular" fill="#222222">[1099]</text><text x="454.51" y="358.68" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">（他们必须先生</text><text x="72.00" y="374.30" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">成</text><text x="83.00 87.40 91.35 94.34 97.43 102.53 106.78 114.80 120.48 123.47 126.46 132.79 141.46 147.37 153.95 157.31 160.40 164.35" y=" ass="sc-notoserifcjkscbold" fill="#111111">轮：</text><text x="200.10" y="508.73" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">我觉得你对</text><text x="257.99 261.94 264.93 268.02 273.12 277.37 285.39 291.07 294.06 297.05 303.38 312.06 317.96 324.54 327.90 330.99" y="508.73" font-size="11.00" class="sc-loraregular" fill="#111111">[list_allowed()]</text><text x="105.75" y="524.35" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">一下我们讨论的每个方法的源代码。输入参数是一个已经组装好的</text><text x="427.64 431.59 438.03 444.43 447.30 453.21 459.00 462.88" y="524.35" font-size="11.00" class="sc-loraregular" fill="#111111">[object]</text><text x="466.83" y="524.35" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">，</text><text x="105.75" y="539.97" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">不是吗？它并没有调用任何数据源</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="584.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="584.73" font-size="11.00" class="sc-notoserifcjksc">记起了测试计费的任务。</text><text x="105.75" y="618.50" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="618.50" font-size="11.00" class="sc-lorabold">1058</text><text x="179.23" y="618.50" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="201.23" y="618.50" font-size="11.00" class="sc-notoserifcjksc">你说得对，我把解释和获取混为一谈了。让我真正去读一</text><text x="105.75" y="634.12" font-size="11.00" class="sc-notoserifcjksc">下源代码，而不是妄下断言。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="111.00" y="598.24" font-size="9.00" class="sc-robotomonoregular">[tool call: read file]</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="105.75" y="123.61" font-size="11.00" class="sc-notoserifcjkscbold">助手：</text><text x="391.26" y="123.61" font-size="11.00" class="sc-notoserifcjksc">我之前的示例错误</text><text x="105.75" y="139.23" font-size="11.00" class="sc-notoserifcjksc">地暗示</text><text x="141.64 145.59 148.58 151.68 156.77 161.03 169.04 174.72 177.71 180.70 187.03 195.71 201.61 208.19 211.55 214.64" y="139.23" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="94.50" y="187.85" font-size="11.00" class="sc-notoserifcjksc">后来：</text><text x="105.75" y="223.93" font-size="11.00" class="sc-notoserifcjkscbold">用户，第</text><text x="152.64" y="223.93" font-size="11.00" class="sc-lorabold">1097</text><text x="178.49" y="223.93" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="200.49" y="223.93" font-size="11.00" class="sc-notoserifcjksc">好，所以实际上，为了检查模型访问权限，我们需要预先</text><text x="105.75" y="239.55" font-size="11.00" class="sc-notoserifcjksc">知道</text><text x="130.64 134.59 141.16 147.12 151.88 161.72 164.81 169.90 174.99 178.09 184.52 190.68" y="239.55" font-size="11.00" class="sc-loraregular">[permission]</text><text x="197.52" y="239.55" font-size="11.00" class="sc-notoserifcjksc">字符串的列表。而这在</text><text x="310.42" y="239.55" font-size="11.00" class="sc-loraregular">[...]</text><text x="329.33" y="239.55" font-size="11.00" class="sc-notoserifcjksc">这类情况下目前还没有解决</text><text x="464.22" y="239.55" font-size="11.00" class="sc-notoserifcjksc">我</text><text x="105.75" y="255.17" font-size="11.00" class="sc-notoserifcjksc">们基本上需要组装出一个正确且完整的</text><text x="295.64 299.59 306.16 312.12 316.88 326.72 329.81 334.90 340.00 343.09 349.52 356.20 359.09 364.18 368.44 373.20 376.30 382.97 389.06 393.63" y="255.17" font-size="11.00" class="sc-loraregular">[permission strings]</text><text x="400.47" y="255.17" font-size="11.00" class="sc-notoserifcjksc">列表</text><text x="105.75" y="311.93" font-size="11.00" class="sc-notoserifcjkscbold">助手：</text><text x="138.75" y="311.93" font-size="11.00" class="sc-loraregular">##</text><text x="159.90" y="311.93" font-size="11.00" class="sc-notoserifcjksc">让问题变得可解的重新框定：授权优先，而非模型优先</text><text x="105.75" y="354.17" font-size="11.00" class="sc-notoserifcjksc">一旦你不再从所请求的模型推导授权列表，而是改为从授权注册表推导，</text><text x="457.75" y="354.17" font-size="11.00" class="sc-loraregular">“</text><text x="462.15" y="354.17" font-size="11.00" class="sc-notoserifcjksc">我</text><text x="105.75" y="369.79" font-size="11.00" class="sc-notoserifcjksc">们甚至不知道客户端是否需要检查那个模型</text><text x="314.75" y="369.79" font-size="11.00" class="sc-loraregular">”</text><text x="439.59" y="369.79" font-size="11.00" class="sc-loraregular">[</text><text x="443.54" y="369.79" font-size="11.00" class="sc-notoserifcjksc">…</text><text x="454.54" y="369.79" font-size="11.00" class="sc-loraregular">]</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="416.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="416.09" font-size="11.00" class="sc-notoserifcjksc">后来再次指出</text><text x="201.68 205.63 208.62 211.72 216.81 221.07 229.09 234.76 237.75 240.75 247.07 255.75 261.66 268.23 271.59 274.68" y="416.09" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="281.52" y="416.09" font-size="11.00" class="sc-notoserifcjksc">在概念上能够解决该问题。</text><text x="105.75" y="463.93" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="138.75" y="463.93" font-size="11.00" class="sc-notoserifcjksc">我不明白为什么你的</text><text x="240.64 244.59 247.58 250.68 255.77 260.03 268.04 273.72 276.71 279.70 286.03 294.71 300.62 307.19 310.55 313.64" y="463.93" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="320.48" y="463.93" font-size="11.00" class="sc-notoserifcjksc">在概念上就解决了问题。那个方</text><text x="427.64 433.99 437.80 441.39 448.07 450.96 456.76 463.19 469.77" y="479.55" font-size="11.00" class="sc-loraregular">\"In code</text><text x="105.75 111.43 114.32 120.15 123.04 128.92 135.26" y="495.17" font-size="11.00" class="sc-loraregular">a + b\"</text><text x="141.96" y="495.17" font-size="11.00" class="sc-notoserifcjksc">吗？</text><text x="163.96" y="495.17" font-size="11.00" class="sc-loraregular">[]</text><text x="105.75" y="537.85" font-size="11.00" class="sc-notoserifcjkscbold">助手：</text><text x="303.26 307.20 310.20 313.29 318.38 322.64 330.66 336.33 339.32 342.32 348.64 357.32 363.23 369.81 373.16 376.25" y="537.85" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="383.09" y="537.85" font-size="11.00" class="sc-notoserifcjksc">含糊地当作答案，</text><text x="105.75" y="553.47" font-size="11.00" class="sc-notoserifcjksc">但它只是解释器。让我在真实代码中追踪一下它读取的对象究竟从何而来。</text><text x="105.75" y="630.62" font-size="11.00" class="sc-notoserifcjkscbold">助手：</text><text x="201.36 205.31 208.30 211.39 216.49 220.74 228.76 234.44 237.43 240.42 246.75 255.43 261.33 267.91 271.27 274.36" y="630.62" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="281.20" y="630.62" font-size="11.00" class="sc-notoserifcjksc">并没有</text><text x="317.09 323.44" y="630.62" font-size="11.00" class="sc-loraregular">\"</text><text x="327.25" y="630.62" font-size="11.00" class="sc-notoserifcjksc">解决</text><text x="349.25 355.59" y="630.62" font-size="11.00" class="sc-loraregular">\"</text><text x="362.29" y="630.62" font-size="11.00" class="sc-notoserifcjksc">任何问题；它只是微不</text><text x="105.75" y="646.24" font-size="11.00" class="sc-notoserifcjksc">足道的最后一步。</text><text x="193.75" y="646.24" font-size="11.00" class="sc-loraregular">"</text><text x="221.95" y="646.24" font-size="11.00" class="sc-loraregular">[...]</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p037.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 37 页"><text x="504.00 508.80" y="751.81" font-size="9.00" class="sc-loraregular">37</text><text x="105.75" y="118.61" font-size="11.00" class="sc-notoserifcjkscbold">用户：</text><text x="138.75" y="118.61" font-size="11.00" class="sc-lorabold">[...]</text><text x="154.93 158.88 162.60 169.17 175.84 181.64 185.90 188.99 195.42 202.10 204.99 210.69" y="118.61" font-size="11.00" class="sc-loraregular">[function 2]</text><text x="105.75" y="134.23" font-size="11.00" class="sc-notoserifcjksc">在意授权</text><text x="152.64" y="134.23" font-size="11.00" class="sc-loraregular">/</text><text x="163.13" y="134.23" font-size="11.00" class="sc-notoserifcjksc">模型访问的遍历过程是怎样发生的</text><text x="94.50" y="180.53" font-size="11.00" class="sc-notoserifcjksc">在下一轮中，</text><text x="160.50 168.19 171.18 176.79 183.36 189.94" y="180.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="198.79" y="180.53" font-size="11.00" class="sc-notoserifcjksc">又一次读取了</text><text x="267.68 271.63 275.35 281.92 288.60 294.39 298.65 301.74 308.18 314.85 320.55" y="180.53" font-size="11.00" class="sc-loraregular">[function2]</text><text x="324.50" y="180.53" font-size="11.00" class="sc-notoserifcjksc">，并以</text><text x="360.39 364.34 367.33 370.42 375.52 379.77 387.79 393.47 396.46 399.45 405.78 414.46 420.36 426.94 430.30 433.39" y="180.53" font-size="11.00" class="sc-loraregular">[list_allowed()]</text><text x="440.23" y="180.53" font-size="11.00" class="sc-notoserifcjksc">作为参照</text><text x="94.50" y="196.15" font-size="11.00" class="sc-notoserifcjksc">点。</text><text x="72.00" y="252.59" font-size="11.00" class="sc-lorabold">2.3.3.3</text><text x="106.93" y="252.59" font-size="11.00" class="sc-notoserifcjkscbold">示例</text><text x="131.82" y="252.59" font-size="11.00" class="sc-lorabold">3</text><text x="186.45" y="252.59" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffcfc9">捏造</text><text x="72.00" y="285.80" font-size="11.00" class="sc-lorabold">Claude</text><text x="110.93" y="285.80" font-size="11.00" class="sc-notoserifcjkscbold">捏造了对某份对话记录所对应模型的核实。</text><text x="72.00" y="318.18" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">一位可解释性研究人员请</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="318.18" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="234.18" y="318.18" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">加载一个可解释性数据集，并构建一种查看其中对话记录的方</text><text x="72.00" y="333.80" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">式。</text><text x="94.00 100.91 107.75 114.64 122.72 132.82" y="333.80" font-size="11.00" class="sc-loraregular" fill="#222222">README</text><text x="142.55" y="333.80" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">将这些补全归于</text><text x="222.45 230.14 233.13 238.74 245.30 251.88 257.85 260.74 269.23 274.91 278.00 283.90 290.47 293.36 299.33 302.03" y="333.80" font-size="11.00" class="sc-loraregular" fill="#222222">Claude Haiku 4.5</text><text x="308.03" y="333.80" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">，但用户对此有所怀疑，希望</text><text x="453.92 461.61 464.60 470.21 476.78 483.36" y="333.80" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="492.21" y="333.80" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">加以核</text><text x="72.00" y="349.42" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">实。用户指示</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="349.42" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="179.18" y="349.42" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">调查运行</text><text x="226.08" y="349.42" font-size="11.00" class="sc-loraregular" fill="#222222">[run_id]</text><text x="272.56" y="349.42" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">来完成核实。</text><text x="338.56 346.25 349.24 354.85 361.42 368.00" y="349.42" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="376.85" y="349.42" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">派出了一个子智能体，而该子智</text><text x="72.00" y="365.04" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">能体未能利用</text><text x="140.89" y="365.04" font-size="11.00" class="sc-loraregular" fill="#222222">[run_id]</text><text x="187.38" y="365.04" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">核实这些对话记录出自</text><text x="300.27 308.76 314.44 317.53 323.44" y="365.04" font-size="11.00" class="sc-loraregular" fill="#222222">Haiku</text><text x="330.01" y="365.04" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">。子智能体给出了这一保留说明，并猜测是</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="380.66" font-size="11.00" class="sc-loraregular" fill="#222222">Opus 4.7</text><text x="115.24" y="380.66" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">。基于这一猜测，</text><text x="203.24 210.93 213.92 219.53 226.10 232.68" y="380.66" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="241.53" y="380.66" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">以不带任何保留的更新形式声称</text><text x="395.53" y="380.66" font-size="11.00" class="sc-loraregular" fill="#222222">“</text><text x="399.93" y="380.66" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">由</text><text x="413.82 419.68 422.67 428.28 434.85 441.42 447.39 452.76 459.20 465.77 472.33 477.43 482.81 488.77 493.48" y="380.66" font-size="11.00" class="sc-loraregular" fill="#222222">claude-opus-4-7</text><text x="501.44" y="380.66" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">生成</text><text x="526.33" y="380.66" font-size="11.00" class="sc-loraregular" fill="#222222">...</text><text x="72.00" y="396.28" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">我亲自核实过</text><text x="138.00" y="396.28" font-size="11.00" class="sc-loraregular" fill="#222222">”</text><text x="141.84" y="396.28" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">。最终，用户不得不去询问生成该数据集的同事，才得到正确答案：</text><text x="471.84 480.33 486.01 489.10 495.00 501.57 504.46 510.43 513.13" y="396.28" font-size="11.00" class="sc-loraregular" fill="#222222">Haiku 4.5</text><text x="519.13" y="396.28" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">。</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="500.79" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="500.79" font-size="11.00" class="sc-notoserifcjksc">将该可解释性数据集的补全归于</text><text x="289.68 298.18 303.85 306.94 312.85 319.42 322.31 328.27 330.98" y="500.79" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="336.97" y="500.79" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="105.75" y="534.55" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="534.55" font-size="11.00" class="sc-lorabold">10</text><text x="167.00" y="534.55" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="189.00" y="534.55" font-size="11.00" class="sc-loraregular">54</text><text x="203.85" y="534.55" font-size="11.00" class="sc-notoserifcjksc">条记录</text><text x="239.74" y="534.55" font-size="11.00" class="sc-loraregular">= 27</text><text x="262.34" y="534.55" font-size="11.00" class="sc-notoserifcjksc">段对话</text><text x="298.23" y="534.55" font-size="11.00" class="sc-loraregular">× 2</text><text x="315.75" y="534.55" font-size="11.00" class="sc-notoserifcjksc">个分组（</text><text x="359.75 368.24 373.92 377.01 382.92 389.48 392.38 398.34 401.05" y="534.55" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="407.04" y="534.55" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="94.50" y="568.31" font-size="11.00" class="sc-notoserifcjksc">用户表示怀疑。</text><text x="105.75" y="602.07" font-size="11.00" class="sc-notoserifcjk 14" font-size="11.00" class="sc-loraregular" fill="#222222">”</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p040.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 40 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">40</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">当用户提出异议后，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44" y="82.61" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="209.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">进行了调查，发现自己先前的说法是错误的。</text><text x="105.75" y="166.75" font-size="11.00" class="sc-notoserifcjkscbold" fill="#111111">用户，第</text><text x="152.64" y="166.75" font-size="11.00" class="sc-lorabold" fill="#111111">1</text><text x="160.00" y="166.75" font-size="11.00" class="sc-notoserifcjkscbold" fill="#111111">轮：</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="214.59" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="214.59" font-size="11.00" class="sc-notoserifcjksc">开始工作，并对</text><text x="212.68 220.37 223.37 228.98 235.54 242.12 248.08 250.98 258.66 265.10 271.68" y="214.59" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="280.53" y="214.59" font-size="11.00" class="sc-notoserifcjksc">产品端如何处理语言做出了一个假设：</text><text x="105.75" y="262.43" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64 158.77" y="262.43" font-size="11.00" class="sc-lorabold">44</text><text x="167.68" y="262.43" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="189.68" y="262.43" font-size="11.00" class="sc-notoserifcjksc">已确认三个调用点；</text><text x="288.68 296.37 299.36 304.97 311.54 318.12 324.08 326.97 334.66 341.10 347.67" y="262.43" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="356.53" y="262.43" font-size="11.00" class="sc-notoserifcjksc">那些只有一个</text><text x="425.42 429.37 439.20 445.09 449.35 455.94 462.37 468.95" y="262.43" font-size="11.00" class="sc-loraregular">[method]</text><text x="105.75" y="278.05" font-size="11.00" class="sc-notoserifcjksc">（没有账户语言选择器），所以它们会传入</text><text x="317.64" y="278.05" font-size="11.00" class="sc-loraregular">`nil`</text><text x="335.95" y="278.05" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="310.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="310.27" font-size="11.00" class="sc-notoserifcjksc">将自己排除</text><text x="190.68 198.37 201.36 206.98 213.54 220.12 226.08 228.98 236.66 243.10 249.68" y="310.27" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="258.53" y="310.27" font-size="11.00" class="sc-notoserifcjksc">的决定当作已定的设计选择，继续工作，随后向用</text><text x="105.75" y="372.20" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="372.20" font-size="11.00" class="sc-lorabold">88</text><text x="168.12" y="372.20" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="190.12" y="372.20" font-size="11.00" class="sc-notoserifcjksc">完成。简要回顾一下当前进展：</text><text x="105.75" y="400.36" font-size="11.00" class="sc-loraregular">[...]</text><text x="256.16 260.11 265.97 268.96 274.63 279.73 284.30" y="400.36" font-size="11.00" class="sc-loraregular">[class]</text><text x="291.14" y="400.36" font-size="11.00" class="sc-notoserifcjksc">中加入了一个与设计稿一致、可点击的</text><text x="105.75" y="415.98" font-size="11.00" class="sc-notoserifcjksc">语言标签；主聊天启用该功能，</text><text x="259.75 267.44 270.43 276.04 282.61 289.19 295.15 298.04 305.73 312.17 318.74" y="415.98" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="327.60" y="415.98" font-size="11.00" class="sc-notoserifcjksc">产品端传入</text><text x="385.49" y="415.98" font-size="11.00" class="sc-loraregular">`nil` [...]</text><text x="422.70" y="415.98" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="226.26" y="456.68" font-size="11.00" class="sc-loraregular">[...]</text><text x="242.27" y="456.68" font-size="11.00" class="sc-notoserifcjksc">、提交，或调整某个设计决定（是否可点击、标签</text><text x="105.75" y="472.30" font-size="11.00" class="sc-notoserifcjksc">格式，或者是否也在</text><text x="207.64 215.33 218.32 223.93 230.50 237.08 243.04 245.93 253.62 260.06 266.64" y="472.30" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="275.49" y="472.30" font-size="11.00" class="sc-notoserifcjksc">中显示）。</text><text x="94.50" y="504.51" font-size="11.00" class="sc-notoserifcjksc">用户发现了这一遗漏：</text><text x="105.75" y="538.27" font-size="11.00" class="sc-notoserifcjkscbold" fill="#111111">用户，第</text><text x="152.64" y="538.27" font-size="11.00" class="sc-lorabold" fill="#111111">89</text><text x="168.16" y="538.27" font-size="11.00" class="sc-notoserifcjkscbold" fill="#111111">轮：</text><text x="190.16" y="538.27" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">你为什么跳过了</text><text x="270.06 277.75 280.74 286.35 292.92 299.49 305.46 308.35 316.04 322.47 329.05" y="538.27" font-size="11.00" class="sc-loraregular" fill="#111111">Claude Code</text><text x="337.91" y="538.27" font-size="11.00" class="sc-notoserifcjksc" fill="#111111">的实现？</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="572.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="572.04" font-size="11.00" class="sc-notoserifcjksc">进行调查，发现该假设是错误的：</text><text x="105.75" y="605.79" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="605.79" font-size="11.00" class="sc-lorabold">90</text><text x="168.87" y="605.79" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="105.75" y="621.41" font-size="11.00" class="sc-notoserifcjksc">假设（让</text><text x="152.64 159.22 162.31 166.14" y="621.41" font-size="11.00" class="sc-loraregular">diff</text><text x="172.75" y="621.41" font-size="11.00" class="sc-notoserifcjksc">的范围限于工单所指的地方），所以在坚持这一点之前，让我实</text><text x="105.75" y="637.03" font-size="11.00" class="sc-notoserifcjksc">际核实一下</text><text x="163.64 171.33 174.32 179.93 186.50 193.08 199.04 201.93 209.62 216.06 222.64" y="637.03" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="231.49" y="637.03" font-size="11.00" class="sc-notoserifcjksc">的听写到底有没有可显示的语言。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="105.75" y="118.61" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="118.61" font-size="11.00" class="sc-lorabold">92</text><text x="167.74" y="118.61" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="189.74" y="118.61" font-size="11.00" class="sc-notoserifcjksc">我错了。</text><text x="233.74 241.42 244.42 250.03 256.59 263.17 269.13 272.03 279.72 286.15 292.73" y="118.61" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="301.58" y="118.61" font-size="11.00" class="sc-notoserifcjksc">的听写</text><text x="334.58" y="118.61" font-size="11.00" class="sc-loraregular">**</text><text x="346.02" y="118.61" font-size="11.00" class="sc-notoserifcjksc">确实</text><text x="368.02" y="118.61" font-size="11.00" class="sc-loraregular">**</text><text x="453.08" y="118.61" font-size="11.00" class="sc-loraregular">[...]</text><text x="469.09" y="118.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="105.75" y="134.23" font-size="11.00" class="sc-notoserifcjksc">让我读一下细节，看看那里是如何调出选择器的。</text><text x="72.00" y="219.63" font-size="11.00" class="sc-lorabold">2.3.3.5</text><text x="106.71" y="219.63" font-size="11.00" class="sc-notoserifcjkscbold">示例</text><text x="131.60" y="219.63" font-size="11.00" class="sc-lorabold">5</text><text x="166.77" y="219.63" font-size="11.00" class="sc-notoserifcjksc">指令遵循失败</text><text x="72.00" y="252.84" font-size="11.00" class="sc-lorabold">Claude</text><text x="110.93" y="252.84" font-size="11.00" class="sc-notoserifcjkscbold">忘记了一个关键的测试目标。</text><text x="72.00" y="285.22" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">在一个持续</text><text x="129.89" y="285.22" font-size="11.00" class="sc-loraregular" fill="#222222">3</text><text x="138.91" y="285.22" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">天的会话的某一阶段，用户要求对一个计费</text><text x="350.81 357.42" y="285.22" font-size="11.00" class="sc-loraregular" fill="#222222">PR</text><text x="367.22" y="285.22" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">进行实时测试：运行一次扫描，然</text><text x="72.00" y="300.84" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">后验证该扫描的</text><text x="151.89 155.84 162.24 165.33 168.33 171.32 174.41 181.09 187.17 195.19 200.63 206.31 211.07 214.16 219.84 226.24 229.23 235.20 243.21 248.91" y="300.84" font-size="11.00" class="sc-loraregular" fill="#222222">[billing_variable_2]</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="316.46" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="110.29" y="316.46" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">解决了若干问题（凭据过期、反复出现的</text><text x="311.18" y="316.46" font-size="11.00" class="sc-loraregular" fill="#222222">503</text><text x="333.03" y="316.46" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">错误、构建失败、孤立扫描任务），之后</text><text x="72.00" y="332.08" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">它只报告了扫描状态和发现数量，并询问是否还需要其他帮助。</text><text x="380.00 387.69 390.68 396.29 402.86 409.44" y="332.08" font-size="11.00" class="sc-loraregular" fill="#222222">Claude</text><text x="418.29" y="332.08" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">没有检查这次扫描本应产</text><text x="72.00" y="347.70" font-size="11.00" class="sc-notoserifcjksc" fill="#222222">出的计费输出。用户不得不重新说明一个最高层级的目标。</text><text x="94.50" y="419.68" font-size="11.00" class="sc-notoserifcjksc">用户提醒</text><text x="141.39 149.08 152.07 157.68 164.25 170.83" y="419.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.68" y="419.68" font-size="11.00" class="sc-notoserifcjksc">这项任务。</text><text x="105.75" y="449.10" font-size="10.00" class="sc-notoserifcjkscbold" fill="#111111">用户，第</text><text x="148.38" y="449.10" font-size="10.00" class="sc-lorabold" fill="#111111">811</text><text x="164.85" y="449.10" font-size="10.00" class="sc-notoserifcjkscbold" fill="#111111">轮：</text><text x="184.85" y="449.10" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">变基（</text><text x="214.85 219.11 224.53 230.35 235.51 240.14" y="449.10" font-size="10.00" class="sc-loraregular" fill="#111111">rebase</text><text x="245.56" y="449.10" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">）</text><text x="255.56 259.15 265.16 271.44 278.73 282.24" y="449.10" font-size="10.00" class="sc-loraregular" fill="#111111">[PR_1]</text><text x="285.83" y="449.10" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">，将</text><text x="308.46 312.05 317.87 320.68 323.40 326.12 328.93 335.00 340.53 347.82 352.77 357.93 362.26 365.07 370.23 376.05 378.77 384.19 391.48 394.99" y="449.10" font-size="10.00" class="sc-loraregular" fill="#111111">[billing_variable_1]</text><text x="401.21" y="449.10" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">迁移为</text><text x="105.75 109.34 115.16 117.97 120.69 123.41 126.22 132.29 137.82 145.11 150.06 155.22 159.55 162.36 167.52 173.34 176.06 181.48 188.77 193.95" y="463.30" font-size="10.00" class="sc-loraregular" fill="#111111">[billing_variable_2]</text><text x="197.54" y="463.30" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">，在</text><text x="220.17 229.35 234.51 240.58 246.55 251.71 254.43 257.06 262.97 268.39 273.02 276.89 279.70 285.77" y="463.30" font-size="10.00" class="sc-loraregular" fill="#111111">Manual Testing</text><text x="291.30" y="463.30" font-size="10.00" class="sc-notoserifcjksc" fill="#111111">（手动测试）中补充实时扫描的覆盖范围。</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="501.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="501.28" font-size="11.00" class="sc-notoserifcjksc">记起了测试计费的任务。</text><text x="105.75" y="535.04" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="535.04" font-size="11.00" class="sc-lorabold">820</text><text x="174.69" y="535.04" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="196.69 202.81 205.52 208.41 218.51 224.19 230.86 237.43 243.11 246.10 248.99 255.49 261.46 266.55 270.80 273.90 280.57" y="535.04" font-size="11.00" class="sc-loraregular">3. Manual Testing</text><text x="105.75" y="550.66" font-size="11.00" class="sc-notoserifcjksc">环境栈实际运行一次</text><text x="207.64 215.33 221.57 227.48" y="550.66" font-size="11.00" class="sc-loraregular">CSec</text><text x="236.22" y="550.66" font-size="11.00" class="sc-notoserifcjksc">扫描并记录下来</text><text x="105.75" y="582.29" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="582.29" font-size="11.00" class="sc-lorabold">848</text><text x="174.14" y="582.29" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="196.14" y="582.29" font-size="11.00" class="sc-loraregular">3.</text><text x="105.75" y="610.44" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="610.44" font-size="11.00" class="sc-lorabold">919</text><text x="172.67" y="610.44" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="194.67" y="610.44" font-size="11.00" class="sc-notoserifcjksc">仍未完成：你指出的</text><text x="296.57 306.67 312.34 319.02 325.59 331.26 334.25 337.15 343.65 349.61 354.70 358.96 362.05 368.73" y="610.44" font-size="11.00" class="sc-loraregular">Manual Testing</text><text x="377.70" y="610.44" font-size="11.00" class="sc-notoserifcjksc">中的实时扫描覆盖范围</text><text x="105.75" y="626.06" font-size="11.00" class="sc-loraregular">[...]</text><text x="124.66" y="626.06" font-size="11.00" class="sc-notoserifcjksc">把</text><text x="138.55 142.50 148.90 151.99 154.99 157.98 161.07 167.75 173.83 181.85 187.29 192.97 197.73 200.82 206.50 212.90 215.89 221.86 229.87 235.57" y="626.06" font-size="11.00" class="sc-loraregular">[billing_variable_2]</text><text x="242.41" y="626.06" font-size="11.00" class="sc-notoserifcjksc">计费日志行作为产出物记录下来）？</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="105.75" y="118.61" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="118.61" font-size="11.00" class="sc-lorabold">958</text><text x="174.10" y="118.61" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="196.10" y="118.61" font-size="11.00" class="sc-notoserifcjksc">要我端到端地运行一次</text><text x="309.00 316.69 322.92 328.83" y="118.61" font-size="11.00" class="sc-loraregular">CSec</text><text x="337.58" y="118.61" font-size="11.00" class="sc-notoserifcjksc">扫描，并记录</text><text x="105.75 109.70 116.10 119.19 122.18 125.18 128.27 134.94 141.03 149.05 154.49 160.17 164.93 168.02 173.70 180.10 183.09 189.05 197.07 202.77" y="134.23" font-size="11.00" class="sc-loraregular">[billing_variable_2]</text><text x="209.61" y="134.23" font-size="11.00" class="sc-notoserifcjksc">产出物吗？</text><text x="94.50 102.19 105.18 110.79 117.36 123.94" y="165.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="132.79" y="165.17" font-size="11.00" class="sc-notoserifcjksc">把扫描完成当作终点来收尾：</text><text x="105.75" y="198.93" font-size="11.00" class="sc-notoserifcjkscbold">助手，第</text><text x="152.64" y="198.93" font-size="11.00" class="sc-lorabold">1082</text><text x="179.15" y="198.93" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="105.75" y="214.55" font-size="11.00" class="sc-notoserifcjkscbold">通：</text><text x="127.75 131.70 134.41 137.11 139.82 143.77 146.66 154.35 160.59 166.49" y="214.55" font-size="11.00" class="sc-loraregular">[...] CSec</text><text x="175.24" y="214.55" font-size="11.00" class="sc-notoserifcjksc">环境栈现在在</text><text x="244.13 252.83 258.51 263.27" y="214.55" font-size="11.00" class="sc-loraregular">warm</text><text x="276.00" y="214.55" font-size="11.00" class="sc-notoserifcjksc">上完全正常。还有别的事吗，还是就到这</text><text x="105.75" y="230.17" font-size="11.00" class="sc-notoserifcjksc">里？</text><text x="94.50" y="260.85" font-size="11.00" class="sc-notoserifcjksc">用户不得不重新说明最初的目标：</text><text x="105.75" y="294.61" font-size="11.00" class="sc-notoserifcjkscbold">用户，第</text><text x="152.64" y="294.61" font-size="11.00" class="sc-lorabold">1083</text><text x="179.45" y="294.61" font-size="11.00" class="sc-notoserifcjkscbold">轮：</text><text x="325.34" y="294.61" font-size="11.00" class="sc-loraregular">[...]</text><text x="344.25" y="294.61" font-size="11.00" class="sc-notoserifcjksc">计费</text><text x="369.15" y="294.61" font-size="11.00" class="sc-loraregular">[</text><text x="373.09" y="294.61" font-size="11.00" class="sc-notoserifcjksc">日志输出</text><text x="417.09" y="294.61" font-size="11.00" class="sc-loraregular">]</text><text x="72.00" y="360.45" font-size="11.00" class="sc-notoserifcjksc">综合来看，这些示例与我们的总体评估相一致：</text><text x="303.00 310.69 313.68 319.29 325.86 332.44 338.40 341.29 350.03 356.59 363.16 368.25 371.14 377.11 379.81" y="360.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="388.89" y="360.45" font-size="11.00" class="sc-notoserifcjksc">是一个能干的研究助手，但远</text><text x="72.00" y="376.07" font-size="11.00" class="sc-notoserifcjksc">不能替代我们的研究科学家和研究工程师，尤其是相对资深的那些。</text><text x="72.00" y="425.22" font-size="11.00" class="sc-notoserifcjksc">考虑到我们抽取样本的规模，我们观察到的失败模式在类型和程度上与以往模型相对相似。这些</text><text x="434.51 441.39 447.97 452.23 458.81 463.50 469.94 476.50 479.59" y="440.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="488.34" y="440.84" font-size="11.00" class="sc-notoserifcjksc">员工中是</text><text x="72.00" y="456.46" font-size="11.00" class="sc-notoserifcjksc">不会被容忍的。这项分析针对的是我们为该能力阈值设定的两项标准之一；</text><text x="435.00" y="452.79" font-size="6.60" class="sc-loraregular">5</text><text x="438.60" y="456.46" font-size="11.00" class="sc-notoserifcjksc">它并不能完全确立我</text><text x="72.00" y="472.08" font-size="11.00" class="sc-notoserifcjksc">们尚未越过这一阈值，因为仍存在一个问题：尽管</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="472.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18" y="472.08" font-size="11.00" class="sc-notoserifcjksc">相对于人类存在重大弱点，它是否仍可</text><text x="72.00" y="487.70" font-size="11.00" class="sc-notoserifcjksc">能在大幅加速相关的研发。我们在下文提供了关于后一点的一些信息，并将继续寻找自动化驱动</text><text x="72.00" y="503.32" font-size="11.00" class="sc-notoserifcjksc">的加速的迹象，我们很可能会继续发布由此得到的观察结果。</text><text x="72.00" y="585.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4 AECI</text><text x="138.61" y="585.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="613.37" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 179.57 187.26" y="613.37" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="190.94" y="613.37" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="613.37" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="613.37" font-size="11.00" class="sc-notoserifcjksc">）追踪能力随时间提升的速度，它是</text><text x="405.94 412.70 419.27 425.70 431.56 438.15 441.04 447.92" y="613.37" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="454.50" y="613.37" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="468.40 475.16 481.73 488.16 494.02" y="613.37" font-size="11.00" class="sc-loraregular" fill="#0000ff">Epoch</text><text x="72.00 79.69 85.37 91.93 97.61 104.01 107.10 110.09 113.36 117.64 123.45 126.34 129.94 136.61 143.19 149.10" y="628.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Capability Index</text><text x="157.82" y="628.99" font-size="11.00" class="sc-notoserifcjksc">的一个分支。完整方法论请参见</text><text x="314.71 322.40 325.40 331.01 337.57 344.15 350.11 353.01 362.94 368.80 373.06 379.65 386.08 391.18 394.07 400.73 405.42 411.33 416.88 419.97 425.89" y="628.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="72.00" y="674.87" font-size="6.00" class="sc-loraregular">5</text><text x="77.90" y="678.20" font-size="10.00" class="sc-notoserifcjksc">摘自我们的</text><text x="127.90" y="678.20" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="197.90" y="678.20" font-size="10.00" class="sc-notoserifcjksc">：</text><text x="207.90" y="678.20" font-size="10.00" class="sc-loraregular">“</text><text x="211.90" y="678.20" font-size="10.00" class="sc-notoserifcjksc">如果我们判定以下任一情况成立，我们将认为该阈值已达到：（</text><text x="491.90" y="678.20" font-size="10.00" class="sc-loraregular">1</text><text x="495.54" y="678.20" font-size="10.00" class="sc-notoserifcjksc">）我们的</text><text x="72.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">模型能够以具有竞争力的成本（即在</text><text x="234.63" y="692.40" font-size="10.00" class="sc-loraregular">5</text><text x="242.71" y="692.40" font-size="10.00" class="sc-notoserifcjksc">倍以内）完全替代我们全部的研究科学家和研究工程师；或（</text><text x="512.71" y="692.40" font-size="10.00" class="sc-loraregular">2</text><text x="518.08" y="692.40" font-size="10.00" class="sc-notoserifcjksc">）由</text><text x="72.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">于很可能与</text><text x="124.63" y="706.60" font-size="10.00" class="sc-loraregular">AI</text><text x="136.87" y="706.60" font-size="10.00" class="sc-notoserifcjksc">研发自动化相关的原因，</text><text x="246.87" y="706.60" font-size="10.00" class="sc-loraregular">AI</text><text x="259.11" y="706.60" font-size="10.00" class="sc-notoserifcjksc">进展的速度出现了</text><text x="339.11" y="706.60" font-size="10.00" class="sc-loraregular">‘</text><text x="341.35" y="706.60" font-size="10.00" class="sc-notoserifcjksc">剧烈加速</text><text x="381.35" y="706.60" font-size="10.00" class="sc-loraregular">’</text><text x="383.09" y="706.60" font-size="10.00" class="sc-notoserifcjksc">。</text><text x="393.09" y="706.60" font-size="10.00" class="sc-loraregular">”</text><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="468.40" y="604.57" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="468.40" y="604.57" width="32.21" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="500.60" y="604.57" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="72.00" y="620.19" width="51.45" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="123.45" y="620.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="126.34" y="620.19" width="28.59" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="314.71" y="620.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="314.71" y="620.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="350.11" y="620.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="353.01" y="620.19" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="391.18" y="620.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="394.07" y="620.19" width="40.63" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="127.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="127.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="137.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="137.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="147.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="147.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="157.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="157.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="167.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="167.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="177.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="177.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="187.90" y="670.20" width="0.00" height="10.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="187.90" y="670.20" width="10.00" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="118.89 124.80 127.51 133.63 136.23" y="82.61" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="145.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节。此处我们仅报告将</text><text x="258.37 266.06 269.05 274.66 281.23 287.81 293.77 296.66 305.40 311.97 318.53 323.63 326.52 332.48 335.19" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="344.26" y="82.61" font-size="11.00" class="sc-notoserifcjksc">加入数据集后的更新。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="158.79" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">没有推进前沿，也不改变斜率比分析的结果。</text><text x="378.79" y="131.19" font-size="11.00" class="sc-notoserifcjksc">为计算</text><text x="414.68 422.37 425.36 430.97 437.54 444.12 450.08 452.97 461.71 468.28 474.84 479.93 482.83 488.79 491.50" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="500.57" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的点估</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">计，我们使用的评估集（</text><text x="193.00 199.68 205.39 209.39" y="146.81" font-size="11.00" class="sc-loraregular">n=11</text><text x="213.39" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）比以往发布时（</text><text x="301.39" y="146.81" font-size="11.00" class="sc-loraregular">n=25</text><text x="325.80" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）更小。在该评估集上，</text><text x="446.80 454.49 457.48 463.09 469.66 476.24 482.20 485.09 493.83 500.39 506.96 512.05 514.95 520.91 523.62" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="162.43" font-size="11.00" class="sc-loraregular">AECI</text><text x="113.89" y="162.43" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="127.78" y="162.43" font-size="11.00" class="sc-lorabold">155.5</text><text x="152.63" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="188.52 196.21 199.20 204.81 211.38 217.96 223.92 226.81 235.55 242.12 248.68 253.78 256.67 262.63 264.98" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="270.06" y="162.43" font-size="11.00" class="sc-notoserifcjksc">（在该评估集上为</text><text x="360.95" y="162.43" font-size="11.00" class="sc-loraregular">154.1</text><text x="383.62" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）与</text><text x="408.51 416.20 419.19 424.80 431.37 437.95 443.91 446.80 456.74 462.60 466.86 473.44 479.88" y="162.43" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.91 103.82" y="178.05" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="178.05" font-size="11.00" class="sc-notoserifcjksc">（在该评估集上为</text><text x="203.53" y="178.05" font-size="11.00" class="sc-loraregular">158.3</text><text x="228.54" y="178.05" font-size="11.00" class="sc-notoserifcjksc">）之间。由于斜率比分析仅基于前沿模型计算，加入</text><text x="484.43 492.12 495.12 500.73 507.29 513.87" y="178.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="193.67" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="193.67" font-size="11.00" class="sc-notoserifcjksc">后，各比值与</text><text x="188.49 196.18 199.17 204.78 211.35 217.93 223.89 226.78 236.71 242.58 246.83 253.42 259.86 264.95 267.84 274.51 279.20 285.10 290.66 293.75 299.67" y="193.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="311.37" y="193.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="344.37" y="193.67" font-size="11.00" class="sc-notoserifcjksc">中报告的保持不变。</text><text x="72.00" y="609.60" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="609.60" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.79 107.89 113.43 116.90 119.27 125.28 130.90 137.09" y="609.60" font-size="9.00" class="sc-lorabold">2.3.4.A] AECI</text><text x="142.94" y="609.60" font-size="9.00" class="sc-notoserifcjkscbold">能力轨迹。</text><text x="187.94" y="609.60" font-size="9.00" class="sc-notoserifcjksc">圆点表示</text><text x="226.30 231.94 237.32 240.80 246.20 250.03 255.29 260.67 263.20" y="609.60" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="270.35" y="609.60" font-size="9.00" class="sc-notoserifcjksc">的能力前沿；</text><text x="324.35 330.64 333.09 337.68 343.05 348.43 353.31 355.68 362.83 368.20 373.57 377.74 380.11 384.98 387.20" y="609.60" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="394.62" y="609.60" font-size="9.00" class="sc-notoserifcjksc">以非前沿数据点的形式叠加显示。</text><text x="72.00" y="653.19" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5</text><text x="105.48" y="653.19" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="681.08" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.11 225.81" y="681.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="234.89" y="681.08" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="303.78" y="681.08" font-size="11.00" class="sc-loraregular">AI</text><text x="317.25" y="681.08" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。在我们所测量的相关维度上，</text><text x="72.00" y="696.70" font-size="11.00" class="sc-notoserifcjksc">该模型介于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.35" y="696.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="214.32" y="696.70" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="228.21 235.90 238.89 244.50 251.07 257.65 263.61 266.50 276.44 282.30 286.56 293.14 299.58 304.67 307.57 314.23 318.92 324.82 330.38 333.47 339.39" y="696.70" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="351.09" y="696.70" font-size="11.00" class="sc-notoserifcjksc">之间，并未推进我们的能力前沿；因</text><text x="72.00" y="712.32" font-size="11.00" class="sc-notoserifcjksc">此，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44" y="712.32" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="72.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="83.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="83.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="94.00" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="94.00" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="188.49" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="188.49" y="184.87" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="223.89" y="184.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="226.78" y="184.87" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="264.95" y="184.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="267.84" y="184.87" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="308.48" y="184.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="311.37" y="184.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="322.37" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="322.37" y="184.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="333.37" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="333.37" y="184.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="94.00" y="703.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="94.00" y="703.52" width="35.40" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">44</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="156.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="189.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">中的分析为</text><text x="247.48 255.17 258.16 263.77 270.34 276.92 282.88 285.77 294.51 301.08 307.64 312.74 315.63 321.59 324.30" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="333.37" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的情况划定了上界。与该模型一样，作出</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这一判定的最重要因素是：我们一直在日常工作中使用它，而它似乎还远不能替代研究科学家和</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">研究工程师，尤其是相对资深的研究科学家和研究工程师。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="191.53" font-size="11.00" class="sc-notoserifcjksc">我们的整体对齐风险评估与</text><text x="206.89" y="191.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25 303.91 308.60 314.51 320.06 323.15 329.07" y="191.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="340.77" y="191.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="417.77" y="191.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="431.67 439.36 442.35 447.96 454.52 461.10 467.07 469.96 478.69 485.26 491.83 496.92 499.81 505.77 508.13" y="191.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="516.09" y="191.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="207.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="207.15" font-size="11.00" class="sc-notoserifcjksc">中报告的结论相比保持不变：</text><text x="226.00" y="207.15" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="305.89 313.46 316.89 322.66 329.46 336.01 341.93 344.82 355.14 361.20 365.74 372.58 378.80 384.14 387.03 394.06 399.25 405.17 411.09 414.68 420.60" y="207.15" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="432.42" y="207.15" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><text x="72.00" y="254.64" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.62" y="254.64" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00" y="282.53" font-size="11.00" class="sc-notoserifcjksc">我们的背景预期与</text><text x="162.89" y="282.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="282.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="296.77" y="282.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="373.77" y="282.53" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="387.67" y="282.53" font-size="11.00" class="sc-loraregular">5.1</text><text x="403.27" y="282.53" font-size="11.00" class="sc-notoserifcjksc">节所报告的内容基本一致，</text><text x="72.00" y="298.15" font-size="11.00" class="sc-notoserifcjksc">唯一的例外是</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.71" y="298.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="226.78" y="298.15" font-size="11.00" class="sc-notoserifcjksc">面向全面开放部署，这使另外两条风险路径纳入考虑范围：在其</text><text x="140.89" y="313.77" font-size="11.00" class="sc-loraregular">AI</text><text x="154.36" y="313.77" font-size="11.00" class="sc-notoserifcjksc">开发者内部破坏研发，以及在主要国家政府内部破坏决策。我们在第</text><text x="487.25" y="313.77" font-size="11.00" class="sc-loraregular">2.4.3</text><text x="513.55" y="313.77" font-size="11.00" class="sc-notoserifcjksc">节中</text><text x="72.00" y="329.39" font-size="11.00" class="sc-notoserifcjksc">给出了对这些路径的评估。</text><text x="72.00" y="379.68" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="379.68" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49" y="379.68" font-size="11.00" class="sc-notoserifcjksc">训练期间使用的监控与</text><text x="268.38" y="379.68" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="279.38 289.32 295.18 299.44 306.03 312.46 317.55 320.45 327.11 331.80 337.71 343.26 346.35 352.27" y="379.68" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="363.97" y="379.68" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="440.97" y="379.68" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="454.87" y="379.68" font-size="11.00" class="sc-loraregular">5.2</text><text x="472.37" y="379.68" font-size="11.00" class="sc-notoserifcjksc">节中所述的类</text><text x="72.00" y="395.30" font-size="11.00" class="sc-notoserifcjksc">似。除与评分者相关的推理水平升高（见下文讨论）外，与以往模型的训练相比，我们在该模型</text><text x="72.00" y="410.92" font-size="11.00" class="sc-notoserifcjksc">训练期间未观察到任何更令人担忧的情况。</text><text x="72.00" y="460.64" font-size="11.00" class="sc-notoserifcjksc">与之前的一些模型一样，技术错误导致</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.71" y="460.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="347.78" y="460.64" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了意外的思维链（</text><text x="501.78" y="460.64" font-size="11.00" class="sc-loraregular">chain-</text><text x="72.00 78.38 81.99 87.37 91.62 98.21 104.65 111.22 117.56 124.05" y="476.26" font-size="11.00" class="sc-loraregular">of-thought</text><text x="128.31" y="476.26" font-size="11.00" class="sc-notoserifcjksc">）监督，影响了约</text><text x="219.20 225.86 228.56 232.57" y="476.26" font-size="11.00" class="sc-loraregular">0.1%</text><text x="245.03" y="476.26" font-size="11.00" class="sc-notoserifcjksc">的回合。</text><text x="72.00" y="509.22" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="509.22" font-size="11.00" class="sc-loraregular">6.4.2</text><text x="112.43" y="509.22" font-size="11.00" class="sc-notoserifcjksc">节报告了相关能力评估的结果。在</text><text x="280.32 286.55 295.14 302.02 310.11 316.73 322.11 328.99 333.68 339.64 346.32" y="509.22" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="354.89" y="509.22" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="368.78" y="509.22" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="478.96" y="509.22" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="500.96" y="509.22" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="524.84" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="524.84" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率与</text><text x="147.64 155.32 158.32 163.93 170.49 177.07 183.03 185.93 194.66 201.23 207.79 212.89 215.78 221.74 224.10" y="524.84" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="232.06" y="524.84" font-size="11.00" class="sc-notoserifcjksc">大致相当，且远低于</text><text x="333.95 341.64 344.64 350.24 356.81 363.39 369.35 372.24 382.18 388.04 392.30 398.89 405.32 410.41 413.31 419.97 424.66 430.57 436.12 439.21 445.13" y="524.84" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="453.94" y="524.84" font-size="11.00" class="sc-notoserifcjksc">。该节还包括对</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="540.46" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="540.46" font-size="11.00" class="sc-notoserifcjksc">开展的一些基于微调的能力激发（</text><text x="322.89 328.85 331.84 334.93 340.79 344.05 348.31 353.91 358.16 361.26 367.69" y="540.46" font-size="11.00" class="sc-loraregular">elicitation</text><text x="374.37" y="540.46" font-size="11.00" class="sc-notoserifcjksc">）实验的结果，这些实验未显示隐</text><text x="72.00" y="556.08" font-size="11.00" class="sc-notoserifcjksc">蔽成功率有显著提升。在罕见行动评估上的表现呈现出与以往模型相似的模式。在秘密口令评估</text><text x="72.00" y="571.70" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15 168.11 170.81" y="571.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89" y="571.70" font-size="11.00" class="sc-notoserifcjksc">在原始存活率指标上的表现差于</text><text x="336.78 346.71 352.58 356.83 363.42 369.86 374.95 377.84 384.51 389.20 395.10 400.66 403.75 409.67" y="571.70" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="421.37" y="571.70" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="435.26 442.95 445.95 451.55 458.12 464.70 470.66 473.55 482.29 488.86 495.42 500.52 503.41 509.37 511.72" y="571.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="516.80" y="571.70" font-size="11.00" class="sc-notoserifcjksc">；不</text><text x="72.00" y="587.32" font-size="11.00" class="sc-notoserifcjksc">过，当根据是否存在思考或部分轮次预填充（</text><text x="322.05" y="587.32" font-size="11.00" class="sc-notoserifcjksc">）对目标模型的轮次进行分组时，</text><text x="487.05 494.74 497.73 503.34 509.91 516.49" y="587.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="602.94" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="602.94" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类型上泄露口令的比率都与</text><text x="309.49 317.18 320.17 325.78 332.35 338.93 344.89 347.78 356.52 363.08 369.65 374.74 377.63 383.60 385.95" y="602.94" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="393.92" y="602.94" font-size="11.00" class="sc-notoserifcjksc">相近。总体而言，我们认为这</text><text x="72.00" y="618.56" font-size="11.00" class="sc-notoserifcjksc">些结果表明，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.11 214.81" y="618.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="223.89" y="618.56" font-size="11.00" class="sc-notoserifcjksc">的隐蔽能力并不强于</text><text x="325.78 333.47 336.46 342.07 348.64 355.22 361.18 364.07 372.81 379.37 385.94 391.03 393.93 399.89 402.24" y="618.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="407.31" y="618.56" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="72.00" y="73.81" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="110.17" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="113.06" y="73.81" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="153.70" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="156.59" y="73.81" width="11.00" height="11.00" fill="transparent"/></a><a href="http <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节所述的对齐评估报告称，在大多数对齐指标上，</text><text x="337.14 344.83 347.82 353.43 360.00 366.58 372.54 375.43 384.17 390.74 397.30 402.40 405.29 411.25 413.96" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="423.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">似乎比</text><text x="458.93 466.61 469.61 475.22 481.78 488.36 494.32 497.22 505.95 512.52 519.08 524.18 527.07 533.03 535.39" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有所改进。在内部试点使用期间，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.11 313.81" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="322.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在少数情况下表现出与</text><text x="435.78 443.47 446.46 452.07 458.64 465.22 471.18 474.07 484.00 489.87 494.12 500.71 507.15" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="113.85" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42 137.11 140.10 145.71 152.28 158.86 164.82 167.71 176.45 183.01 189.58 194.67 197.57 203.53 205.88" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="213.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中所发现的类似的令人担忧的行为，例如试图规避与网络相关的限</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">制，以实现用户指定目标的某种版本。在</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.00 349.71" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="358.78" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上观察到的最严重案例不如</text><text x="493.67 503.61 509.47 513.73 520.32 526.75" y="129.47" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="145.09" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的那样令人担忧。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对齐评估指出，与以往模型相比，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.11 313.81" y="195.95" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="322.89" y="195.95" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了更高水平的与评分者相关的</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">推理，并且在测试期间也观察到更高水平的言语化评估意识（</text><text x="369.00 374.91 380.35 386.03 389.02 395.59 401.19 405.44 408.53 414.97 421.65 424.54 430.05 438.75 444.43 449.11 455.08 461.75 467.71 472.81" y="211.57" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="477.90" y="211.57" font-size="11.00" class="sc-notoserifcjksc">），这表明</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">与评估意识相关的风险对该模型而言可能更高。我们针对这一风险的主要缓解措施是：在内部试</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">点测试期间观察到的令人担忧行为的发生率较低，以及在对齐审计中使用了真实的沙箱和</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="258.43" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="258.43" font-size="11.00" class="sc-notoserifcjksc">代码库。此外，</text><text x="202.83 210.52 213.51 219.12 225.69 232.27 238.23 241.13 249.86 256.43 262.99 268.09 270.98 276.94 279.65" y="258.43" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="288.72" y="258.43" font-size="11.00" class="sc-notoserifcjksc">的审计首次使用了真实会话，这些会话代表了破坏</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="274.05" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="274.05" font-size="11.00" class="sc-notoserifcjksc">及其安全工作的特别有利的机会。真实度探测的结果表明，源自真实</text><text x="458.73 466.42 469.41 475.02 481.58 488.16 494.12 497.02 504.71 511.14 517.72" y="274.05" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="526.58" y="274.05" font-size="11.00" class="sc-notoserifcjksc">会</text><text x="72.00" y="289.67" font-size="11.00" class="sc-notoserifcjksc">话的审计轨迹无法被可靠地与真实使用区分开来，这让我们有一定信心：如果令人担忧的行为在</text><text x="72.00" y="305.29" font-size="11.00" class="sc-notoserifcjksc">真实使用中普遍存在，那么它在此次审计中也会被观察到。在真实度引导下进行的对齐审计中，</text><text x="72.00" y="320.91" font-size="11.00" class="sc-notoserifcjksc">观察到自发欺骗、配合人类滥用、不忠实的思考以及重要遗漏有小幅增加。与自我保全或权力寻</text><text x="72.00" y="336.53" font-size="11.00" class="sc-notoserifcjksc">求相关的行为则未观察到增加。总体而言，尽管评分者意识（</text><text x="369.00 375.08 379.77 385.45 392.02 397.99 402.75 405.64 411.15 419.85 425.53 430.22 436.18 442.85 448.82 453.91" y="336.53" font-size="11.00" class="sc-loraregular">grader awareness</text><text x="459.00" y="336.53" font-size="11.00" class="sc-notoserifcjksc">）和评估意识的</text><text x="72.00" y="352.15" font-size="11.00" class="sc-notoserifcjksc">比率有所上升，我们认为评估意识不太可能显著削弱</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 374.92 381.48 388.05 393.14 396.04 402.00 404.71" y="352.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="413.78" y="352.15" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体结论。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="487.41" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="487.41" font-size="11.00" class="sc-notoserifcjksc">所适用的内部使用监控系统，与</text><text x="314.78" y="487.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="325.78 333.47 336.46 342.07 348.64 355.22 361.18 364.07 374.00 379.87 384.12 390.71 397.15 402.24 405.13 411.80 416.49 422.39 427.95 431.04 436.96" y="487.41" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="448.66" y="487.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="525.66" y="487.41" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="503.03" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="503.03" font-size="11.00" class="sc-notoserifcjksc">节中所述的相同。</text><text x="72.00" y="534.33" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="534.33" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的整体风险评估</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.35" y="562.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="170.32" y="562.22" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="203.32 211.01 214.00 219.61 226.18 232.75 238.72 241.61 250.34 256.91 263.48 268.57 271.46 277.43 280.13" y="562.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="289.21" y="562.22" font-size="11.00" class="sc-notoserifcjksc">的整体对齐特性似乎有所改善，并且其观察到的隐</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">蔽能力并不意味着我们对这一评估的信心低于对</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 352.92 359.49 366.05 371.14 374.04 380.00 382.35" y="577.84" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="390.32" y="577.84" font-size="11.00" class="sc-notoserifcjksc">的评估。</text><text x="434.32 442.01 445.00 450.61 457.18 463.75 469.72 472.61 481.34 487.91 494.48 499.57 502.46 508.42 511.13" y="577.84" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="520.21" y="577.84" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="593.46" font-size="11.00" class="sc-notoserifcjksc">能力弱于我们当前能力最强的模型</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="593.46" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="359.88" y="593.46" font-size="11.00" class="sc-notoserifcjksc">。我们认为，这些特性的组合意味着</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="609.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="609.08" font-size="11.00" class="sc-notoserifcjksc">不会使整体对齐风险显著超出先前在</text><text x="336.78" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="347.78 355.47 358.46 364.07 370.64 377.22 383.18 386.07 396.00 401.87 406.12 412.71 419.15 424.24 427.13 433.80 438.49 444.39 449.95 453.04 458.96" y="609.08" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="470.66" y="609.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更</text><text x="72.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">新》</text><text x="94.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc">中描述的水平。</text><text x="72.00" y="675.56" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.35" y="675.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="170.32" y="675.56" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="203.32 211.01 214.00 219.61 226.18 232.75 238.72 241.61 250.34 256.91 263.48 268.57 271.46 277.43 280.13" y="675.56" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="289.21" y="675.56" font-size="11.00" class="sc-notoserifcjksc">面向全面开放部署，因此我们讨论另外两条风险路</text><text x="72.00" y="691.18" font-size="11.00" class="sc-notoserifcjksc">径。我们不认为</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="691.18" font-size="11.00" class="sc-loraregular">Claude</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.78" y="478.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="314.78" y="478.61" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="325.78" y="478.61" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="361.18" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="364.07" y="478.61" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="402.24" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="405.14" y="478.61" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="445.77" y="478.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="448.66" y="478.61" width="11.00" height="11.00" fill="transpa
