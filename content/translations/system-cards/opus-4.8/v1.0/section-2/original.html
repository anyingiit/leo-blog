<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">46</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="133.49 141.18 144.17 149.78 156.35 162.93 168.89 171.78 180.52 187.08 193.65 198.74 201.64 207.60 209.95" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="215.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（我们此前能力最强的全面开放模型）之间的能力跃升足以显著提</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">高这些外部路径所意味的整体风险水平。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.3</text><text x="105.70" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险路径</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="157.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="182.78" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的全面开放发布，我们考虑了</text><text x="328.67" y="157.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="339.67 347.36 350.36 355.96 362.53 369.11 375.07 377.96 387.90 393.76 398.02 404.61 411.04 416.13 419.03 425.69 430.38 436.29 441.84 444.93 450.85" y="157.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="462.56" y="157.42" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">中未讨论的两条路径。</text><text x="72.00" y="205.99" font-size="11.00" class="sc-lorabold">2.4.3.1</text><text x="105.09" y="205.99" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="129.98" y="205.99" font-size="11.00" class="sc-lorabold">7</text><text x="237.03" y="205.99" font-size="11.00" class="sc-lorabold">AI</text><text x="251.53" y="205.99" font-size="11.00" class="sc-notoserifcjkscbold">开发者内部破坏研发</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们的风险分析侧重于模型在</text><text x="217.89 224.78 231.36 235.61 242.20 246.89 253.32 259.89 262.98" y="238.38" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="271.73" y="238.38" font-size="11.00" class="sc-notoserifcjksc">内部使用所带来的风险，但当</text><text x="417.62 425.31 428.30 433.91 440.48 447.06" y="238.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="455.91" y="238.38" font-size="11.00" class="sc-notoserifcjksc">在其他拥有训练</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">前沿</text><text x="96.89" y="254.00" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="254.00" font-size="11.00" class="sc-notoserifcjksc">系统所需资源和基础设施的组织中承担重要研发职能时，许多类似的风险同样适用。</text><text x="237.00" y="303.97" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="303.97" font-size="11.00" class="sc-notoserifcjksc">根据第</text><text x="349.89" y="303.97" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="303.97" font-size="11.00" class="sc-notoserifcjksc">节讨论的对齐评估（其中直接涵盖了</text><text x="72.00" y="319.59" font-size="11.00" class="sc-notoserifcjksc">破坏安全研发的机会），</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15 267.11 269.81" y="319.59" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="278.89" y="319.59" font-size="11.00" class="sc-notoserifcjksc">不太可能具有那种在正常情况下会导致其试图破坏研</text><text x="72.00" y="335.21" font-size="11.00" class="sc-notoserifcjksc">发的一致目标，也不太可能具有在我们所测试的那类环境中会导致这种行为的依赖情境的目标。</text><text x="72.00" y="350.83" font-size="11.00" class="sc-notoserifcjksc">尽管如此，当它遇到使其偏离典型有用助手行为的异常情境时，仍有可能偶尔做出此类尝试。我</text><text x="75.75" y="303.76" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00" y="466.72" font-size="11.00" class="sc-notoserifcjksc">基于在自动化行为审计（</text><text x="193.00 198.61 205.18 209.43 215.87 225.70 231.30 235.56 241.47 248.04 250.94 257.34 263.30 269.89 275.43 280.99 284.08 290.52 295.20 300.88 303.87 306.76 312.37 318.94 325.52 328.78" y="466.72" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="333.04" y="466.72" font-size="11.00" class="sc-notoserifcjksc">）中开展的少量非常轻量的评估，我们预</text><text x="294.89" y="482.34" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="482.34" font-size="11.00" class="sc-notoserifcjksc">开发者，其倾向不会发生重要变化。（据非正式</text><text x="72.00" y="497.96" font-size="11.00" class="sc-notoserifcjksc">观察，在自动化行为审计测试中，模型往往对</text><text x="294.89 301.78 308.36 312.61 319.20 323.89 330.32 336.89 339.98" y="497.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="348.73" y="497.96" font-size="11.00" class="sc-notoserifcjksc">及其领导层表现出比对其他前沿开发者</text><text x="72.00" y="513.58" font-size="11.00" class="sc-notoserifcjksc">更正面的看法，不过这尚未达到破坏倾向的程度。）</text><text x="215.00" y="580.88" font-size="11.00" class="sc-notoserifcjkscbold">监控及相关安全防护措施：</text><text x="347.00" y="580.88" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="580.88" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73" y="580.88" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们监控第</text><text x="72.00" y="596.50" font-size="11.00" class="sc-notoserifcjksc">三方部署的能力要弱得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被其运营方</text><text x="72.00" y="612.12" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.43 96.00 101.96 106.65 112.25 116.51 122.94" y="612.12" font-size="11.00" class="sc-loraregular">operator</text><text x="127.70" y="612.12" font-size="11.00" class="sc-notoserifcjksc">）发现，途径包括可见的扩展思考（</text><text x="303.70 309.61 315.44 319.70 325.66 332.34 338.92 344.82 351.40 354.29 358.55 365.14 368.23 374.91 380.81 383.91 390.58" y="612.12" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="72.00" y="627.74" font-size="11.00" class="sc-notoserifcjksc">行动。</text><text x="75.75" y="580.68" font-size="10.50" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="237.00" y="679.69" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="292.00" y="679.69" font-size="11.00" class="sc-notoserifcjksc">该路径的大部分风险集中于其他前沿模型开发者的</text><text x="72.00" y="695.31" font-size="11.00" class="sc-notoserifcjksc">使用中，因为在这种情境下，模型破坏</text><text x="261.89" y="695.31" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36" y="695.31" font-size="11.00" class="sc-notoserifcjksc">研发最有可能增加后续出现</text><text x="75.75" y="679.48" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="328.67" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="339.67" y="148.62" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="375.07" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="377.97" y="148.62" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="416.14" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="419.03" y="148.62" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="459.66" y="148.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="462.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="473.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="473.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="484.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="484.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="495.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="495.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="506.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="506.56" y="148.62" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="517.56" y="148.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="517.56" y="148.62" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">重大有害结果的风险。我们的服务条款不允许第三方将我们的工具用于此目的，从而限制了这一</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">风险的范围。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="131.19" font-size="11.00" class="sc-lorabold">8</text><text x="137.67" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们的模型在主要国家政府内部的使用会带来一定的对齐风险，尤其是在使用极其广泛的情况</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">下。例如，一个未对齐的模型可能处于能够影响送达重要决策者的信息与观点的位置，或者能够</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">利用关键系统中的漏洞来造成大范围影响。</text><text x="237.00" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">正如第</text><text x="349.89" y="245.35" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="245.35" font-size="11.00" class="sc-notoserifcjksc">节所讨论的，我们不认为</text><text x="483.04 490.73 493.72 499.33 505.90 512.47" y="245.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="260.97" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="260.97" font-size="11.00" class="sc-notoserifcjksc">具有会导致其试图破坏政府决策或运作的连贯目标或倾向。基于在自动化行为审计中开</text><text x="72.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">展的少量非常轻量的评估，我们预计，如果模型被部署在政府环境中，其倾向不会发生重要变</text><text x="72.00" y="292.21" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="75.75" y="245.15" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="72.00" y="359.52" font-size="11.00" class="sc-notoserifcjksc">然而，在这种情境下，很难完全排除由第三方对手蓄意植入的行为后门所带来的风险。迄今为</text><text x="72.00" y="375.14" font-size="11.00" class="sc-notoserifcjksc">止，我们尚未看到此类攻击的任何成功案例，但我们对政府使用情况的可见性有限，这使我们更</text><text x="72.00" y="390.76" font-size="11.00" class="sc-notoserifcjksc">难在足够真实的处境下开展部署前测试，从而难以确信我们能够发现此类由第三方造成的被植入</text><text x="72.00" y="406.38" font-size="11.00" class="sc-notoserifcjksc">后门的行为。</text><text x="237.00" y="457.50" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="325.00" y="457.50" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00" y="473.12" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89 136.78 143.36 147.61 154.20 158.89 165.32 171.89 174.98" y="473.12" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00" y="504.36" font-size="11.00" class="sc-notoserifcjksc">响相关官员的观点或以其他方式采取高风险行动，恰恰需要这种程度的采用。鉴于</text><text x="470.89" y="504.36" font-size="11.00" class="sc-loraregular">AI</text><text x="484.36" y="504.36" font-size="11.00" class="sc-notoserifcjksc">模型目前在</text><text x="75.75" y="457.30" font-size="10.50" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="215.00" y="604.88" font-size="11.00" class="sc-notoserifcjkscbold">监控：</text><text x="248.00" y="604.88" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="604.88" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="326.73" y="604.88" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们监控第三方部署的能力要弱</text><text x="72.00" y="620.50" font-size="11.00" class="sc-notoserifcjksc">得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被模型的用户发现，途径包括可见</text><text x="75.75" y="604.67" font-size="10.50" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text></svg></div>
