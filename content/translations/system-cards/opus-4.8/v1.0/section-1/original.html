.sc-notoserifcjksc { font-family: "sc-notoserifcjksc"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60 97.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="171.78 178.67 185.24 189.50 196.09 200.78 207.21 213.78 216.87" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="225.61 236.61 247.61 258.61 269.61 280.61 291.61 302.61 313.61 324.61 335.61 346.61 357.61" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="368.61 371.61 377.28 381.99 388.02 393.98 396.87 399.87 405.54 412.22 418.30 424.87 430.55 436.57 442.54 445.43 455.26 461.70 468.28 474.24" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="477.23 488.23 499.23 510.23 521.23" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）。它是对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">其前代模型（</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.11 214.46" y="131.83" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="219.53 230.53 241.53 252.53 263.53 274.53 285.53 296.53 307.53 318.53 329.53 340.53 351.53 362.53 373.53 384.53 395.53 406.53 417.53 428.53 439.53 450.53 461.53 472.53 483.53 494.53 505.53 516.53 527.53" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的升级，在软件工程、智能体工具使用和知识工作任务方面的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">力有所提升。这使其成为</text><text x="195.89 202.78 209.36 213.61 220.20 224.89 231.32 237.89 240.98" y="147.45" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73" y="147.45" font-size="11.00" class="sc-notoserifcjksc">迄今为止能力最强的全面开放的模型。本系统卡（</text><text x="491.73 497.91 503.72 508.81 513.07 519.03" y="147.45" font-size="11.00" class="sc-loraregular">System</text><text x="72.00 79.69 85.37 90.05" y="163.07" font-size="11.00" class="sc-loraregular">Card</text><text x="96.63 107.63 118.63 129.63 140.63 151.63" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）报告了针对</text><text x="165.52 174.26 180.82 187.39 192.48 195.38 201.34 204.04" y="163.07" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="213.12 224.12 235.12 246.12 257.12 268.12 279.12 290.12 301.12 312.12 323.12 334.12 345.12 356.12 367.12 378.12 389.12 400.12 411.12 422.12 433.12" y="163.07" font-size="11.00" class="sc-notoserifcjksc">的能力及其安全相关特性与行为的一系列评估。</text><text x="72.00 77.07 80.71" y="214.76" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11" y="214.76" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="241.32" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="241.32" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="256.94" font-size="11.00" class="sc-notoserifcjksc">公开数据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="272.56" font-size="11.00" class="sc-notoserifcjksc">过滤方法，包括去重和分类。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="322.28" font-size="11.00" class="sc-notoserifcjksc">我们使用一个名为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.11 204.96 211.39" y="322.28" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="218.54 229.54 240.54 251.54 262.54 273.54 284.54 295.54 306.54 317.54 328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="322.28" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫在网站运营者设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="337.90" font-size="11.00" class="sc-notoserifcjksc">置的、用于表明是否允许爬取其网站内容的</text><text x="281.00 285.40 290.09 296.52 302.92 309.36 313.61 318.71 321.28 325.67 331.50 335.76" y="337.90" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="337.90" font-size="11.00" class="sc-notoserifcjksc">指令方面，遵循业界标准做法。我们不会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="353.52" font-size="11.00" class="sc-notoserifcjksc">访问受密码保护的页面，也不会访问需要登录或</text><text x="305.89 313.47 320.36 327.02 334.06 341.75 350.33" y="353.52" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="360.11 371.11 382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="353.52" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="369.14" font-size="11.00" class="sc-notoserifcjksc">数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时爬取了其网页，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="384.76" font-size="11.00" class="sc-notoserifcjksc">向我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="451.82" font-size="11.00" class="sc-notoserifcjksc">在预训练之后，</text><text x="149.00 157.73 164.30 170.87 175.96 178.85 184.82 187.52" y="451.82" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60" y="451.82" font-size="11.00" class="sc-notoserifcjksc">经历了大量的后训练和微调，目标是使其成为一个行为符合</text><text x="485.49 493.18 496.17 501.78 508.35 514.93" y="451.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="523.78" y="451.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪</text><text x="72.00" y="467.44" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">法</text><text x="83.00" y="467.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.29 131.58 136.67 139.56 145.36 151.79 158.47 163.56 167.82 171.09 175.35 181.91 186.17 189.26 195.70" y="467.44" font-size="11.00" class="sc-loraregular">Claude's constitution</text><text x="202.37 213.37 224.37 235.37 246.37 257.37 268.37 279.37 290.37 301.37 312.37" y="467.44" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="516.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="516.58" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回复。输出质量因语言而异。该模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="532.20" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00 77.07 80.71" y="566.56" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08 106.08 120.08 134.08 148.08" y="566.56" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="599.12" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="599.12" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00 83.00 94.00 105.00 116.00" y="614.74" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="614.74" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="614.74" font-size="11.00" class="sc-notoserifcjksc">只与符合以下条件的平台合作：认同我们为工作者提供公平且合乎道德的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="630.36" font-size="11.00" class="sc-notoserifcjksc">报酬的理念，并且无论身处何地都致力于践行安全的工作场所规范，遵循我们在采购合同中详细</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="645.98" font-size="11.00" class="sc-notoserifcjksc">规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="485.49" y="443.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="485.49" y="443.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="520.89" y="443.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="523.78" y="443.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="534.78" y="443.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="458.64" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
