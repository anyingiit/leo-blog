.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="171.78 178.67 185.24 189.50 196.09 200.78 207.21 213.78 216.87" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="225.61" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="368.61 371.61 377.28 381.99 388.02 393.98 396.87 399.87 405.54 412.22 418.30 424.87 430.55 436.57 442.54 445.43 455.26 461.70 468.28 474.24" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="477.23" y="116.21" font-size="11.00" class="sc-notoserifcjksc">）。它是对</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">其前代模型（</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.11 214.46" y="131.83" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="219.53" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的升级，在软件工程、智能体工具使用和知识工作任务方面的能</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">力有所提升。这使其成为</text><text x="195.89 202.78 209.36 213.61 220.20 224.89 231.32 237.89 240.98" y="147.45" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="249.73" y="147.45" font-size="11.00" class="sc-notoserifcjksc">迄今为止能力最强的全面开放的模型。本系统卡（</text><text x="491.73 497.91 503.72 508.81 513.07 519.03" y="147.45" font-size="11.00" class="sc-loraregular">System</text><text x="72.00 79.69 85.37 90.05" y="163.07" font-size="11.00" class="sc-loraregular">Card</text><text x="96.63" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）报告了针对</text><text x="165.52" y="163.07" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="213.12" y="163.07" font-size="11.00" class="sc-notoserifcjksc">的能力及其安全相关特性与行为的一系列评估。</text><text x="72.00" y="214.76" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="214.76" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="241.32" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="241.32" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有的混合数据集，包括来自互联网的公开信息、公开和非</text><text x="72.00" y="256.94" font-size="11.00" class="sc-notoserifcjksc">公开数据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗和</text><text x="72.00" y="272.56" font-size="11.00" class="sc-notoserifcjksc">过滤方法，包括去重和分类。</text><text x="72.00" y="322.28" font-size="11.00" class="sc-notoserifcjksc">我们使用一个名为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.11 204.96 211.39" y="322.28" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="218.54" y="322.28" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫在网站运营者设</text><text x="72.00" y="337.90" font-size="11.00" class="sc-notoserifcjksc">置的、用于表明是否允许爬取其网站内容的</text><text x="281.00 285.40 290.09 296.52 302.92 309.36 313.61 318.71 321.28 325.67 331.50 335.76" y="337.90" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="339.60" y="337.90" font-size="11.00" class="sc-notoserifcjksc">指令方面，遵循业界标准做法。我们不会</text><text x="72.00" y="353.52" font-size="11.00" class="sc-notoserifcjksc">访问受密码保护的页面，也不会访问需要登录或</text><text x="305.89 313.47 320.36 327.02 334.06 341.75 350.33" y="353.52" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="360.11" y="353.52" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练</text><text x="72.00" y="369.14" font-size="11.00" class="sc-notoserifcjksc">数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时爬取了其网页，并</text><text x="72.00" y="384.76" font-size="11.00" class="sc-notoserifcjksc">向我们表明其偏好。</text><text x="72.00" y="451.82" font-size="11.00" class="sc-notoserifcjksc">在预训练之后，</text><text x="149.00" y="451.82" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="196.60" y="451.82" font-size="11.00" class="sc-notoserifcjksc">经历了大量的后训练和微调，目标是使其成为一个行为符合</text><text x="485.49 493.18 496.17 501.78 508.35 514.93" y="451.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="523.78" y="451.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪</text><text x="72.00" y="467.44" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">法</text><text x="83.00" y="467.44" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.29 131.58 136.67 139.56 145.36 151.79 158.47 163.56 167.82 171.09 175.35 181.91 186.17 189.26 195.70" y="467.44" font-size="11.00" class="sc-loraregular">Claude's constitution</text><text x="202.37" y="467.44" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="516.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="516.58" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回复。输出质量因语言而异。该模</text><text x="72.00" y="532.20" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00" y="566.56" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="566.56" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="599.12" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="599.12" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00" y="614.74" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="614.74" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83" y="614.74" font-size="11.00" class="sc-notoserifcjksc">只与符合以下条件的平台合作：认同我们为工作者提供公平且合乎道德的</text><text x="72.00" y="630.36" font-size="11.00" class="sc-notoserifcjksc">报酬的理念，并且无论身处何地都致力于践行安全的工作场所规范，遵循我们在采购合同中详细</text><text x="72.00" y="645.98" font-size="11.00" class="sc-notoserifcjksc">规定的众包工作者福祉标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="485.49" y="443.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="485.49" y="443.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="520.89" y="443.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="523.78" y="443.02" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="534.78" y="443.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="72.00" y="458.64" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="116.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="116.76" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36" y="116.76" font-size="11.00" class="sc-notoserifcjksc">）详细规定了我们模型的禁止用途，以及我们对高风险和</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">其他特定场景中使用的要求。</text><text x="72.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="165.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83" y="165.34" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="165.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持</text><text x="268.83" y="165.34" font-size="11.00" class="sc-notoserifcjksc">页面。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="197.72" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="197.72" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="197.72" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59" y="197.72" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48" y="197.72" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95" y="197.72" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95 421.69 428.26 432.94 439.38 445.95 451.89 457.56 464.24 467.13 473.97 479.77 486.21 492.88 499.32 509.15 512.24" y="197.72" font-size="11.00" class="sc-loraregular">European Economic</text><text x="72.00 78.89 83.57 89.51" y="213.34" font-size="11.00" class="sc-loraregular">Area</text><text x="95.19" y="213.34" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="247.69" font-size="14.00" class="sc-poppinssemibold">1.4</text><text x="93.29" y="247.69" font-size="14.00" class="sc-notosanscjkscbold">迭代式模型评估</text><text x="72.00" y="274.25" font-size="11.00" class="sc-notoserifcjksc">在训练过程中的不同时间点会获取模型的不同</text><text x="292.00" y="274.25" font-size="11.00" class="sc-loraregular">“</text><text x="296.40" y="274.25" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="318.40" y="274.25" font-size="11.00" class="sc-loraregular">”</text><text x="322.24" y="274.25" font-size="11.00" class="sc-notoserifcjksc">。训练期间还存在模型的不同版本，包括不</text><text x="72.00" y="289.87" font-size="11.00" class="sc-notoserifcjksc">含任何安全防护措施的</text><text x="182.00" y="289.87" font-size="11.00" class="sc-loraregular">“</text><text x="186.40" y="289.87" font-size="11.00" class="sc-notoserifcjksc">仅有用（</text><text x="230.40 236.99 242.95 245.94 252.46 256.17 262.74 265.73 268.63 275.06 281.74 284.67" y="289.87" font-size="11.00" class="sc-loraregular">helpful only</text><text x="290.48" y="289.87" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="301.48" y="289.87" font-size="11.00" class="sc-loraregular">”</text><text x="305.32" y="289.87" font-size="11.00" class="sc-notoserifcjksc">版本。除非另有说明，本系统卡中讨论的所有评</text><text x="72.00" y="305.49" font-size="11.00" class="sc-notoserifcjksc">估均针对模型的最终快照，并且包含安全防护措施。</text><text x="72.00" y="372.80" font-size="14.00" class="sc-poppinssemibold">1.5</text><text x="93.06" y="372.80" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="399.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="399.36" font-size="11.00" class="sc-notoserifcjksc">的大部分评估是在</text><text x="248.78 255.67 262.24 266.50 273.09 277.78 284.21 290.78 293.87" y="399.36" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="302.62" y="399.36" font-size="11.00" class="sc-notoserifcjksc">内部进行的。不过，我们感谢多位外部测试方对</text><text x="72.00" y="414.98" font-size="11.00" class="sc-notoserifcjksc">该模型进行评估并与我们分享结果。他们的具体贡献将在下文中介绍。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="246.83" y="156.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="246.83" y="156.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="257.83" y="156.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="257.83" y="156.54" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
