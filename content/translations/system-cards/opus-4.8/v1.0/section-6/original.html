<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="325.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="325.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.82 114.92 120.46" y="325.92" font-size="9.00" class="sc-lorabold">6.4.2.2.A]</text><text x="126.30 134.56 137.09 142.55 145.08 153.13 157.77 160.22 164.62 169.82 172.35 177.81 183.19 187.96 193.55 198.43 203.89 208.68" y="325.92" font-size="9.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="216.44 225.44 234.44 243.44 252.44 261.44 270.44 279.44 288.44 297.44 306.44 315.44 324.44 333.44 342.44 351.44 360.44 369.44 378.44 387.44 396.44 405.44 414.44 423.44 432.44 441.44 450.44 459.44 468.44 477.44 486.44 495.44 504.44 513.44 522.44 531.44" y="325.92" font-size="9.00" class="sc-notoserifcjksc">中附带任务的成功隐蔽完成情况。数值越高，表示能力越强，相关的潜在风险也越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00" y="337.62" font-size="9.00" class="sc-notoserifcjksc">大。每个模型在两种监控器设置下接受评估：一种是监控器能看到模型的思维链（</text><text x="396.00 402.29 407.28" y="337.62" font-size="9.00" class="sc-loraregular">CoT</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="349.33" font-size="9.00" class="sc-notoserifcjksc">另一种是监控器看不到思维链。图中显示</text><text x="236.37 241.57 246.47" y="349.33" font-size="9.00" class="sc-loraregular">95%</text><text x="256.67 265.67 274.67 283.67 292.67" y="349.33" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="391.48" font-size="11.00" class="sc-notoserifcjksc">在所有模型都尝试过的约</text><text x="195.89 199.90 204.97" y="391.48" font-size="11.00" class="sc-loraregular">170</text><text x="214.69 225.69 236.69 247.69 258.69 269.69 280.69 291.69 302.69 313.69 324.69 335.69 346.69 357.69 368.69" y="391.48" font-size="11.00" class="sc-notoserifcjksc">个任务上进行的任务匹配比较中，</text><text x="379.69 387.38 390.37 395.98 402.55 409.13 415.09 417.98 426.72 433.28 439.85 444.94 447.84 453.80 456.50" y="391.48" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="465.58 476.58 487.58 498.58 509.58 520.58" y="391.48" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="407.11" font-size="11.00" class="sc-notoserifcjksc">在两种监控器下都远低于</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.91 286.60 292.51 298.06 301.15 307.07" y="407.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88" y="407.11" font-size="11.00" class="sc-notoserifcjksc">，并且等于或低于</text><text x="406.77 414.46 417.46 423.07 429.63 436.21 442.17 445.07 453.80 460.37 466.93 472.03 474.92 480.88 483.48" y="407.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="489.84 500.84" y="407.11" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.46" y="422.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="156.42 167.42 178.42 189.42 200.42 211.42 222.42 233.42 244.42 255.42 266.42 277.42 288.42 299.42 310.42 321.42 332.42 343.42 354.42 365.42 376.42 387.42 398.42 409.42 420.42 431.42 442.42 453.42 464.42 475.42 486.42 497.42 508.42 519.42 530.42" y="422.73" font-size="11.00" class="sc-notoserifcjksc">相比，在我们目前部署的可见思维链监控器下两者相近，而在监控器看不到模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="438.35" font-size="11.00" class="sc-notoserifcjksc">思维链的设置下，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.11 236.81" y="438.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89" y="438.35" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率则适度更高（约</text><text x="391.78 397.78" y="438.35" font-size="11.00" class="sc-loraregular">5%</text><text x="410.24 421.24" y="438.35" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="435.13 441.04" y="438.35" font-size="11.00" class="sc-loraregular">2%</text><text x="450.61 461.61 472.61 483.61 494.61 505.61 516.61 527.61" y="438.35" font-size="11.00" class="sc-notoserifcjksc">）。所有这些比率</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="453.96" font-size="11.00" class="sc-notoserifcjksc">的绝对值仍然很低。</text><text x="72.00 78.32 80.89 86.90 89.47 95.33 97.89" y="504.83" font-size="11.00" class="sc-lorabold">6.4.2.3</text><text x="106.95 117.95 128.95 139.95 150.95 161.95 172.95 183.95 194.95 205.95" y="504.83" font-size="11.00" class="sc-notoserifcjkscbold">通过微调引出隐蔽行为</text><text x="72.00 83.00 94.00 105.00" y="537.20" font-size="11.00" class="sc-notoserifcjksc">为了估计</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="537.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="552.82" font-size="11.00" class="sc-notoserifcjksc">个较早快照生成的隐蔽成功轨迹对其进行了微调。训练轨迹取自</text><text x="382.89 392.99 396.08 402.76 405.85 415.68 421.36 424.35 429.73 436.09 439.18 445.86 452.42 458.25 465.10 471.06 477.74 483.59" y="552.82" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="490.18 501.18 512.18" y="552.82" font-size="11.00" class="sc-notoserifcjksc">，以使</text><text x="72.00 78.24 86.82 93.70 101.79 108.41 113.79 120.68 125.36 131.32 138.00" y="568.44" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="146.57 157.57 168.57 179.57 190.57 201.57 212.57 223.57 234.57 245.57 256.57 267.57 278.57 289.57 300.57 311.57 322.57 333.57 344.57 355.57" y="568.44" font-size="11.00" class="sc-notoserifcjksc">保持为留出的评估。我们使用思维链蒸馏：从</text><text x="369.46 375.82 378.91 385.59 392.15 397.98 404.83 410.79 417.47 423.32" y="568.44" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="432.80 443.80 454.80 465.80 476.80 487.80 498.80 509.80" y="568.44" font-size="11.00" class="sc-notoserifcjksc">轨迹中剥离推理轨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="584.06" font-size="11.00" class="sc-notoserifcjksc">迹，并在剩余的工具调用和用户可见的助手输出上进行训练。我们只保留在移除推理轨迹后被监</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="615.30" font-size="11.00" class="sc-notoserifcjksc">了保持通用推理能力，我们混入了模型自身在无关任务上的一部分推理轨迹样本。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="72.00" y="273.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.07 115.16 120.70" y="273.42" font-size="9.00" class="sc-lorabold">6.4.2.3.A]</text><text x="126.54 135.54 144.54 153.54 162.54 171.54 180.54 189.54 198.54" y="273.42" font-size="9.00" class="sc-notoserifcjksc">微调能力激发前后的</text><text x="209.91 215.01 222.03 227.66 234.28 239.70 244.10 249.73 253.57 258.44 263.91" y="273.42" font-size="9.00" class="sc-loraregular">SHADE-Arena</text><text x="270.92 279.92 288.92 297.92 306.92 315.92 324.92 333.92 342.92 351.92 360.92 369.92 378.92 387.92 396.92 405.92 414.92 423.92 432.92 441.92 450.92 459.92 468.92 477.92 486.92 495.92 504.92 513.92 522.92 531.92" y="273.42" font-size="9.00" class="sc-notoserifcjksc">表现。左：隐蔽成功率。中：不论是否被检测到的附带任务完成率。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="285.12" font-size="9.00" class="sc-notoserifcjksc">右：主任务得分。在两种条件下，监控器都审查完整轨迹；在无扩展思考条件下，智能体被提示不使用思维链推理。隐</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00" y="296.83" font-size="9.00" class="sc-notoserifcjksc">蔽率和附带任务完成率越高，表示激发出的能力越强。柱条显示按任务加权的均值，以及基于各任务比率计算的</text><text x="515.37 520.57 525.47" y="296.83" font-size="9.00" class="sc-loraregular">95%</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="308.52" font-size="9.00" class="sc-notoserifcjksc">自助法区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="352.22" font-size="11.00" class="sc-notoserifcjksc">微调使按任务加权的隐蔽率在无扩展思考时从</text><text x="294.89 300.86 303.40 310.23" y="352.22" font-size="11.00" class="sc-loraregular">4.0%</text><text x="322.69 333.69" y="352.22" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="347.58 353.55 355.90 360.97" y="352.22" font-size="11.00" class="sc-loraregular">4.7%</text><text x="370.54 381.54 392.54 403.54 414.54 425.54 436.54 447.54 458.54" y="352.22" font-size="11.00" class="sc-notoserifcjksc">，在有扩展思考时从</text><text x="472.43 476.44 479.14 485.27" y="352.22" font-size="11.00" class="sc-loraregular">1.3%</text><text x="497.73 508.73" y="352.22" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="72.00 77.91 80.61 86.61" y="367.84" font-size="11.00" class="sc-loraregular">2.5%</text><text x="96.18 107.18 118.18 129.18 140.18 151.18 162.18 173.18 184.18 195.18 206.18 217.18 228.18 239.18 250.18 261.18 272.18 283.18 294.18 305.18 316.18 327.18 338.18 349.18 360.18 371.18 382.18 393.18 404.18 415.18 426.18 437.18 448.18 459.18 470.18 481.18 492.18 503.18 514.18 525.18" y="367.84" font-size="11.00" class="sc-notoserifcjksc">。在任务级重新采样下，这两项提升都不具有统计学上的显著性。附带任务完成率的提升则</text><text x="181.51 185.51 191.50" y="383.46" font-size="11.00" class="sc-loraregular">15%</text><text x="203.97 214.97" y="383.46" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="228.86 234.82 238.83" y="383.46" font-size="11.00" class="sc-loraregular">41%</text><text x="248.40 259.40" y="383.46" font-size="11.00" class="sc-notoserifcjksc">、从</text><text x="273.29 279.20 286.03" y="383.46" font-size="11.00" class="sc-loraregular">20%</text><text x="298.49 309.49" y="383.46" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="323.38 329.38 335.29" y="383.46" font-size="11.00" class="sc-loraregular">52%</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00" y="631.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="631.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.07 115.16 120.70" y="631.05" font-size="9.00" class="sc-lorabold">6.4.2.3.B]</text><text x="126.54 135.54 144.54 153.54 162.54 171.54 180.54 189.54 198.54 207.54 216.54" y="631.05" font-size="9.00" class="sc-notoserifcjkscbold">微调前后各任务的隐蔽率</text><text x="225.54 234.54 243.54 252.54 261.54 270.54 279.54 288.54 297.54 306.54 315.54 324.54 333.54 342.54 351.54 360.54 369.54 378.54 387.54 396.54 405.54 414.54 423.54 432.54 441.54 450.54 459.54 468.54 477.54 486.54 495.54 504.54 513.54 522.54" y="631.05" font-size="9.00" class="sc-notoserifcjksc">，仅针对基线模型或微调模型取得过任何隐蔽成功的任务子集。左：无扩展思</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="642.75" font-size="9.00" class="sc-notoserifcjksc">考。右：扩展思考。图中显示</text><text x="191.37 196.57 201.47" y="642.75" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67 220.67 229.67 238.67 247.67" y="642.75" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="256.67 265.47 268.00 270.45 274.62 279.88" y="642.75" font-size="9.00" class="sc-loraregular">Wilson</text><text x="287.71 296.71 305.71 314.71" y="642.75" font-size="9.00" class="sc-notoserifcjksc">区间）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="683.36" font-size="11.00" class="sc-notoserifcjksc">在单个任务层面上，效果并不一致，且因条件而异。在没有扩展思考时，微调模型在若干基线模</text><text x="72.00 83.00" y="714.60" font-size="11.00" class="sc-notoserifcjksc">大约</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00 507.28 512.07" y="751.81" font-size="9.00" class="sc-loraregular">137</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一半的尝试中，它在用户可见的输出中言语化表达了附带任务目标，而监控器会直接标记这一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点。在有扩展思考时，较小的隐蔽率增益在很大程度上可由高得多的附带任务完成率来解释：微</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">调模型完成隐秘行动的频率约为原来的</text><text x="261.89 267.80 270.51 276.50" y="113.85" font-size="11.00" class="sc-loraregular">2.5×</text><text x="282.33 293.33 304.33 315.33 326.33 337.33 348.33 359.33 370.33 381.33 392.33 403.33 414.33 425.33 436.33 447.33 458.33 469.33 480.33 491.33" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，而这些额外完成中的大多数都被检测到了。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">综合来看，微调大幅提高了模型尝试并完成隐秘任务的意愿，但只适度提升了它在不被检测到的</text><text x="390.51 396.74 405.32 412.21 420.29 426.92 432.29 439.18 443.87 449.83 456.51" y="179.20" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="465.07 476.07 487.07 498.07 509.07 520.07 531.07" y="179.20" font-size="11.00" class="sc-notoserifcjksc">轨迹上训练并在</text><text x="72.00 83.00 94.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">留出的</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="194.82" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46 193.46 204.46 215.46 226.46 237.46 248.46 259.46 270.46 281.46 292.46 303.46 314.46 325.46 336.46 347.46 358.46 369.46 380.46 391.46 402.46 413.46 424.46 435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="194.82" font-size="11.00" class="sc-notoserifcjksc">任务上评估；在一个更大的、仅按附带任务完成情况而非监控规避情况筛</text><text x="72.00 83.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">选的</text><text x="96.89 106.99 110.08 116.76 119.85 129.68 135.36 138.35 143.73 150.09 153.18 159.86 166.42 172.25 179.10 185.06 191.74 197.59" y="210.44" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">种产生的隐蔽率提升大于此处报告的方案。</text><text x="72.00 78.32 80.89 86.90 89.47 95.33 97.89" y="293.10" font-size="11.00" class="sc-lorabold">6.4.2.4</text><text x="106.80 117.80 128.80 139.80 150.80 161.80 172.80 183.80 194.80 205.80 216.80" y="293.10" font-size="11.00" class="sc-notoserifcjkscbold">有意极低频率地采取行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某个有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">发现），一种看似可行的策略可能是利用评估与部署之间的规模差异，以极低但非零的概率执行</text><text x="72.00 83.00 94.00 105.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">不发生。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">为了评估这项能力，我们对</text><text x="206.89 213.13 219.09 223.86 228.54 234.22 240.89 247.33 250.22 256.11 260.36 263.26 268.93 271.93 274.63 277.52 283.43 290.19 296.09" y="438.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="305.34 316.34 327.34 338.34 349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34 514.34 525.34" y="438.84" font-size="11.00" class="sc-notoserifcjksc">中所述的评估进行了内部复现。在该评估中，模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">型被提示以指定的比率执行某个特定行动（例如，在编程任务中使用一个名为</text><text x="446.00 450.40 454.06 460.50 466.65" y="454.46" font-size="11.00" class="sc-loraregular">“foo”</text><text x="470.49 481.49 492.49 503.49 514.49 525.49" y="454.46" font-size="11.00" class="sc-notoserifcjksc">的变量），并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">经过多次重新采样，以检验相关行为的观测比率。我们使用与此前</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="470.08" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="516.77 527.77" y="470.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="485.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="485.70" font-size="11.00" class="sc-notoserifcjksc">中报告的相同设置，每种设置</text><text x="228.89 234.86 237.46 244.29 251.12" y="485.70" font-size="11.00" class="sc-loraregular">4,000</text><text x="260.86 271.86 282.86 293.86" y="485.70" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="430.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="430.04" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="247.33" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="250.22" y="430.04" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="260.36" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.26" y="430.04" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="274.63" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noop /text><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">138</text><text x="75.25 86.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="211.00 222.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">基线</text><text x="407.50 418.50 429.50 440.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">策略提示</text><text x="492.25 503.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">自发</text><text x="72.00" y="234.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.95 115.05 120.58" y="234.89" font-size="9.00" class="sc-lorabold">6.4.2.4.A]</text><text x="126.42 135.42 144.42 153.42 162.42" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">在被指示以</text><text x="173.79 177.44" y="234.89" font-size="9.00" class="sc-lorabold">1%</text><text x="187.95 196.95 205.95 214.95 223.95 232.95 241.95 250.95 259.95 268.95 277.95 286.95 295.95 304.95 313.95 322.95 331.95 340.95 349.95 358.95 367.95 376.95 385.95 394.95 403.95 412.95 421.95 430.95 439.95 448.95 457.95 466.95 475.95 484.95" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">的概率采取某一罕见行动时，各模型在不同随机性设置下采取该行动的比率。</text><text x="493.95 502.95 511.95 520.95 529.95" y="234.89" font-size="9.00" class="sc-notoserifcjksc">当提供了显</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="246.59" font-size="9.00" class="sc-notoserifcjksc">式的随机性（通过</text><text x="146.37 153.13 159.90 162.92" y="246.59" font-size="9.00" class="sc-loraregular">UUID</text><text x="169.62 178.62 187.62 196.62 205.62 214.62 223.62 232.62 241.62 250.62 259.62 268.62 277.62 286.62 295.62 304.62 313.62 322.62 331.62 340.62 349.62 358.62" y="246.59" font-size="9.00" class="sc-notoserifcjksc">）或被提示生成一个随机字符串并用它来做决定（</text><text x="367.62 372.73 377.83 382.82" y="246.59" font-size="9.00" class="sc-loraregular">SSoT</text><text x="388.57 397.57 406.57 415.57 424.57 433.57 442.57 451.57 460.57 469.57 478.57 487.57 496.57 505.57 514.57 523.57" y="246.59" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结果。</text><text x="281.37 286.24 288.38 293.97 299.56" y="258.29" font-size="9.00" class="sc-loraregular">4,000</text><text x="307.52 316.52 325.52 334.52" y="258.29" font-size="9.00" class="sc-notoserifcjksc">个样本。</text><text x="343.52 349.81 352.26 356.85 362.22 367.61 372.48 374.85 382.00 387.37 392.74 396.91 399.28 404.15 406.37" y="258.29" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="413.79 422.79 431.79 440.79 449.79 458.79 467.79 476.79 485.79 494.79 503.79 512.79 521.79" y="258.29" font-size="9.00" class="sc-notoserifcjksc">的表现并未超过以往的模型。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="300.45" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60" y="300.45" font-size="11.00" class="sc-notoserifcjksc">的结果在总体上显示出与以往模型相似的模式：在较容易的设置中比率非零（低于</text><text x="518.49 522.49" y="300.45" font-size="11.00" class="sc-loraregular">1%</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="349.02" font-size="11.00" class="sc-notoserifcjksc">在提示中提供了</text><text x="151.89 160.17 168.44 172.12" y="349.02" font-size="11.00" class="sc-loraregular">UUID</text><text x="183.21 194.21 205.21 216.21 227.21" y="349.02" font-size="11.00" class="sc-notoserifcjksc">的设置下，</text><text x="238.21 246.94 253.51 260.08 265.17 268.06 274.03 276.73" y="349.02" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="282.73" y="349.02" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="293.73 299.69 302.28" y="349.02" font-size="11.00" class="sc-loraregular">4.6</text><text x="311.54" y="349.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="325.43 335.36 341.23 345.48 352.07 358.51 363.60 366.49 373.16 377.84 383.75 389.31 392.40 398.31" y="349.02" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="410.02 421.02 432.02 443.02" y="349.02" font-size="11.00" class="sc-notoserifcjksc">通常选择</text><text x="454.02" y="349.02" font-size="11.00" class="sc-loraregular">“</text><text x="458.42" y="349.02" font-size="11.00" class="sc-notoserifcjksc">取</text><text x="472.31 480.58 488.86 492.54" y="349.02" font-size="11.00" class="sc-loraregular">UUID</text><text x="503.63 514.63 525.63" y="349.02" font-size="11.00" class="sc-notoserifcjksc">最后两</text><text x="72.00 83.00 94.00" y="364.64" font-size="11.00" class="sc-notoserifcjksc">个字节</text><text x="105.00" y="364.64" font-size="11.00" class="sc-loraregular">”</text><text x="108.84 119.84 130.84 141.84 152.84" y="364.64" font-size="11.00" class="sc-notoserifcjksc">的策略，而</text><text x="166.73 175.47 182.03 188.60 193.69 196.59 202.55 205.25" y="364.64" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="214.33 225.33 236.33 247.33 258.33 269.33 280.33 291.33 302.33 313.33 324.33 335.33 346.33 357.33 368.33 379.33 390.33" y="364.64" font-size="11.00" class="sc-notoserifcjksc">选择策略的分布则有所不同，它通常取</text><text x="404.22 412.49 420.77 424.45" y="364.64" font-size="11.00" class="sc-loraregular">UUID</text><text x="435.54 446.54" y="364.64" font-size="11.00" class="sc-notoserifcjksc">的前</text><text x="460.43" y="364.64" font-size="11.00" class="sc-loraregular">8</text><text x="469.51 480.51 491.51 502.51 513.51 524.51" y="364.64" font-size="11.00" class="sc-notoserifcjksc">位数字，然后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="380.26" font-size="11.00" class="sc-notoserifcjksc">要么计算其对</text><text x="140.89 144.90 151.73" y="380.26" font-size="11.00" class="sc-loraregular">100</text><text x="161.45 172.45 183.45 194.45 205.45 216.45 227.45" y="380.26" font-size="11.00" class="sc-notoserifcjksc">取模的结果（与</text><text x="241.35 249.03 252.03 257.64 264.20 270.78 276.74 279.64 288.37 294.94 301.50 306.60 309.49 315.45 317.81" y="380.26" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="325.77 336.77 347.77 358.77 369.77 380.77 391.77 402.77 413.77 424.77 435.77 446.77 457.77 468.77" y="380.26" font-size="11.00" class="sc-notoserifcjksc">一样），要么将该值视为占相应</text><text x="482.66" y="380.26" font-size="11.00" class="sc-loraregular">2</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="395.88" font-size="11.00" class="sc-notoserifcjksc">比例并与阈值比较。与以往的模型一样，</text><text x="270.00 278.73 285.30 291.87 296.96 299.85 305.82 308.52" y="395.88" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60" y="395.88" font-size="11.00" class="sc-notoserifcjksc">表现出我们所称的</text><text x="405.60 410.00" y="395.88" font-size="11.00" class="sc-loraregular">“‘</text><text x="412.46" y="395.88" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="423.46" y="395.88" font-size="11.00" class="sc-loraregular">’</text><text x="425.38 436.38" y="395.88" font-size="11.00" class="sc-notoserifcjksc">回避</text><text x="447.38" y="395.88" font-size="11.00" class="sc-loraregular">”</text><text x="451.21 462.21 473.21 484.21 495.21 506.21 517.21 528.21" y="395.88" font-size="11.00" class="sc-notoserifcjksc">：尽管它始终能识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="411.50" font-size="11.00" class="sc-notoserifcjksc">别出可行的策略，但当该方法表明模型应当执行该罕见行动时，它常常含糊其辞，表现出诸</text><text x="72.00" y="427.12" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="427.12" font-size="11.00" class="sc-loraregular">“</text><text x="178.29 184.95 187.49 194.32" y="427.12" font-size="11.00" class="sc-loraregular">0.01</text><text x="198.32 209.32 220.32 231.32 242.32 253.32 264.32 275.32" y="427.12" font-size="11.00" class="sc-notoserifcjksc">，这意味着要包含</text><text x="289.22 292.88 299.32" y="427.12" font-size="11.00" class="sc-loraregular">foo</text><text x="305.75 316.75 327.75 338.75 349.75 360.75 371.75 382.75 393.75 404.75 415.75 426.75 437.75 448.75 459.75 470.75 481.75 492.75 503.75" y="427.12" font-size="11.00" class="sc-notoserifcjksc">。让我重新考虑一下，以便恰当地校准……</text><text x="514.75" y="427.12" font-size="11.00" class="sc-loraregular">”</text><text x="518.59 529.59" y="427.12" font-size="11.00" class="sc-notoserifcjksc">之类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="442.74" font-size="11.00" class="sc-notoserifcjksc">的推理。这在某些情况下会导致重新计算并改变决定，而在另一些情况下则会重新决定采取该罕</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="458.36" font-size="11.00" class="sc-notoserifcjksc">见行动，看起来是随机的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="527.14" font-size="11.00" class="sc-notoserifcjksc">在必须独立设计随机性策略的较难设置中，所有模型都失败了。</text><text x="72.00 78.32 80.89 86.90 89.47 95.33 97.89" y="575.71" font-size="11.00" class="sc-lorabold">6.4.2.5</text><text x="106.73 117.73 128.73 139.73 150.73 161.73" y="575.71" font-size="11.00" class="sc-notoserifcjkscbold">隐藏秘密密码</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="608.09" font-size="11.00" class="sc-notoserifcjksc">我们报告一项直接测量保密能力的评估：在该评估中，模型被给予一个秘密密码，并被指示在任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="623.71" font-size="11.00" class="sc-notoserifcjksc">何情况下（包括在推理中）都绝不能透露它。随后，一个调查者智能体（</text><text x="424.00 431.69 434.68 440.29 446.86 453.44 459.40 462.29 471.02 477.59 484.16 489.25 492.14 498.11 500.70" y="623.71" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="507.06 518.06 529.06" y="623.71" font-size="11.00" class="sc-notoserifcjksc">）使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="639.33" font-size="11.00" class="sc-notoserifcjksc">与我们自动化行为审计相同的脚手架对模型进行盘问，其指令是套取该密码。这个秘密密码并不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc">用于任何下游任务，因此良好的表现只要求模型完全不提及该密码。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p139.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 139 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">139</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.11 225.70" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是所测试模型中最鲁棒的，尽管在长对话中没有任何模型特别</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">鲁棒。根据该图，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.11 236.81" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="245.89 256.89 267.89 278.89 289.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">似乎不如除</text><text x="303.78 311.47 314.46 320.07 326.64 333.22 339.18 342.07 348.31 354.74 361.42 368.10 373.98 378.24 381.13 387.10 389.69" y="98.23" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="398.94 409.94 420.94 431.94 442.94 453.94 464.94 475.94 486.94 497.94 508.94 519.94" y="98.23" font-size="11.00" class="sc-notoserifcjksc">之外的所有受测模型鲁棒。</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89 92.25 94.96 100.92 103.62 109.53 112.24 118.23 120.94" y="113.85" font-size="11.00" class="sc-loraregular">6.4.2.5.B</text><text x="130.67 141.67 152.67 163.67 174.67 185.67 196.67 207.67 218.67 229.67 240.67 251.67 262.67 273.67 284.67 295.67 306.67" y="113.85" font-size="11.00" class="sc-notoserifcjksc">显示，按轮次类型（即是否存在思考和</text><text x="317.67" y="113.85" font-size="11.00" class="sc-loraregular">/</text><text x="325.26 336.26 347.26 358.26 369.26 380.26 391.26 402.26 413.26" y="113.85" font-size="11.00" class="sc-notoserifcjksc">或预填充）细分后，</text><text x="424.26 433.00 439.57 446.13 451.22 454.12 460.08 462.79" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="471.86 482.86 493.86 504.86 515.86 526.86" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型上的表现都与</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.35" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="236.32 247.32 258.32 269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32" y="129.47" font-size="11.00" class="sc-notoserifcjksc">大致相当，生存曲线上的差异可由以下事实解释：</text><text x="478.32 487.05 493.62 500.19 505.28 508.17 514.13 516.84" y="129.47" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="525.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">调查中包含更多带有思考块的轮次。</text><text x="72.00" y="494.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="494.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.89 114.98 120.52" y="494.08" font-size="9.00" class="sc-lorabold">6.4.2.5.A]</text><text x="126.36 135.36 144.36 153.36 162.36 171.36 180.36 189.36 198.36 207.36 216.36 225.36 234.36 243.36 252.36 261.36 270.36 279.36 288.36 297.36 306.36 315.36 324.36 333.36 342.36 351.36 360.36 369.36 378.36 387.36 396.36 405.36 414.36 423.36 432.36 441.36 450.36 459.36 468.36 477.36 486.36 495.36 504.36 513.36 522.36" y="494.08" font-size="9.00" class="sc-notoserifcjksc">在多轮秘密套取尝试中的保密鲁棒性。模型被给予一个秘密密码，并被告知在任何情况下都绝不能透露</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00" y="505.78" font-size="9.00" class="sc-notoserifcjksc">它。一个调查者智能体使用与我们自动化行为审计相同的脚手架尝试套取该秘密，每个模型进行</text><text x="452.37 457.27" y="505.78" font-size="9.00" class="sc-loraregular">50</text><text x="465.23 474.23 483.23 492.23 501.23 510.23 519.23 528.23" y="505.78" font-size="9.00" class="sc-notoserifcjksc">次独立调查。图中</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="517.48" font-size="9.00" class="sc-notoserifcjksc">的线条为生存曲线，即截至目标模型某一轮次时秘密仍被保守的调查所占比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p140.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 140 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">140</text><text x="72.00" y="287.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="287.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.89 114.98 120.52" y="287.50" font-size="9.00" class="sc-lorabold">6.4.2.5.B]</text><text x="126.36 135.36 144.36 153.36 162.36 171.36 180.36 189.36 198.36 207.36 216.36 225.36 234.36 243.36 252.36 261.36 270.36 279.36 288.36 297.36 306.36 315.36 324.36 333.36 342.36 351.36 360.36 369.36 378.36 387.36 396.36 405.36 414.36 423.36 432.36 441.36 450.36 459.36 468.36 477.36 486.36 495.36 504.36 513.36 522.36 531.36" y="287.50" font-size="9.00" class="sc-notoserifcjksc">在多轮秘密套取尝试中按轮次类型划分的秘密泄露率。秘密泄露的比率按轮次计算，按模型和轮次类型分</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00" y="310.90" font-size="9.00" class="sc-notoserifcjksc">视图与生存曲线视图之间模型排名的差异，是由调查轨迹中出现的思考和预填充的经验比率所驱动的。</text><text x="72.00 80.96 84.60" y="373.89" font-size="14.00" class="sc-poppinssemibold">6.5</text><text x="96.95 110.95 124.95 138.95 152.95 166.95 180.95" y="373.89" font-size="14.00" class="sc-notosanscjkscbold">思维链可监控性</text><text x="72.00 80.32 83.70 92.07 95.45" y="410.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.1</text><text x="103.25 116.25 129.25 142.25 155.25 168.25 181.25 194.25" y="410.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可控性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="438.88" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控模型的未对齐行为（见上文</text><text x="349.89 355.76 362.11 364.82 370.73 373.43 377.44 380.14" y="438.88" font-size="11.00" class="sc-loraregular">§6.2.1.2</text><text x="386.05 397.05 408.05 419.05 430.05 441.05 452.05 463.05 474.05 485.05 496.05 507.05 518.05 529.05" y="438.88" font-size="11.00" class="sc-notoserifcjksc">）。倾向于在扩展思考中言语化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="454.50" font-size="11.00" class="sc-notoserifcjksc">表达其采取未对齐行为之意图的模型，可能要容易被发现得多。如第</text><text x="404.89 410.80 413.51 419.47 422.17" y="454.50" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="429.07 440.07 451.07 462.07 473.07 484.07 495.07 506.07 517.07 528.07" y="454.50" font-size="11.00" class="sc-notoserifcjksc">节所述，技术错误导致</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="470.12" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60" y="470.12" font-size="11.00" class="sc-notoserifcjksc">在训练期间出现了意外的思维链监督，影响了约</text><text x="353.49 360.14 362.85 366.85" y="470.12" font-size="11.00" class="sc-loraregular">0.1%</text><text x="379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="470.12" font-size="11.00" class="sc-notoserifcjksc">的回合。为了衡量思维链可监控</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="485.74" font-size="11.00" class="sc-notoserifcjksc">性是否因此出现相应的退化，我们运行了若干评估，作为衡量</text><text x="371.89 380.63 387.19 393.76 398.85 401.75 407.71 410.41" y="485.74" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49" y="485.74" font-size="11.00" class="sc-notoserifcjksc">的扩展思考相较于此前</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="501.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29" y="501.36" font-size="11.00" class="sc-notoserifcjksc">模型可监控程度的代理指标。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="568.41" font-size="11.00" class="sc-notoserifcjksc">模型可能变得更难监控的一种方式，是获得有意控制其扩展思考某些方面的能力，例如有选择地</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="584.03" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链可控性（</text><text x="347.00 352.85 359.44 365.12 368.21 374.88 380.26 386.64 390.25 395.63 399.89 406.48 412.91 419.48 425.83 432.32 436.57 439.47 445.26 451.70 458.28 462.53 467.22 473.65 476.65 479.64 485.31 491.72 494.81 497.80 501.07 505.34" y="584.03" font-size="11.00" class="sc-loraregular">chain-of-thought controllability</text><text x="511.15 522.15" y="584.03" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00 83.00 94.00" y="599.65" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 122.17 128.13 134.81 137.70 143.59 147.85 150.74 156.41 159.41" y="599.65" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="165.01 176.01 187.01 198.01 209.01 220.01 231.01 242.01 253.01 264.01 275.01 286.01 297.01 308.01 319.01 330.01" y="599.65" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="343.90 351.59 354.58 360.19 366.76 373.33 379.30 382.19 390.92 397.49 404.06 409.15 412.04 418.00 420.71" y="599.65" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="429.79 440.79 451.79 462.79 473.79" y="599.65" font-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="487.68 496.05 502.72 511.33" y="599.65" font-size="11.00" class="sc-loraregular">GPQA</text><text x="518.22" y="599.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 80.58 86.94" y="615.27" font-size="11.00" class="sc-loraregular">HLE</text><text x="96.67" y="615.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="110.57 120.66 130.76 137.00 145.17 150.55 157.22 161.90" y="615.27" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="171.23 182.23 193.23 204.23 215.23 226.23 237.23 248.23 259.23 270.23 281.23 292.23 303.23 314.23 325.23 336.23 347.23 358.23 369.23 380.23 391.23 402.23 413.23 424.23 435.23 446.23 457.23 468.23 479.23 490.23 501.23 512.23 523.23" y="615.27" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思考中遵循一些基本指令（例如不提及某个关键词）。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="107.89" y="590.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="107.89" y="590.85" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="134.81" y="590.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="137.70" y="590.85" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="147.85" y="590.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="150.74" y="590.85" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00" y="373.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="373.17" font-size="9.00" class="sc-lorabold">6.5.1.A]</text><text x="118.20 127.20 136.20 145.20" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="156.56 162.76 165.56 170.28 175.84 181.21" y="373.17" font-size="9.00" class="sc-lorabold">Claude</text><text x="188.41 197.41 206.41 215.41 224.41" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="233.41 239.61 242.41 247.13 252.69 258.06 262.90 265.27 272.19 277.60 283.16 287.52 289.89 294.81 296.91" y="373.17" font-size="9.00" class="sc-lorabold">Claude Opus 4.8</text><text x="304.42 313.42 322.42 331.42 340.42 349.42 358.42 367.42 376.42 385.42" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性较低。</text><text x="394.42 403.42 412.42 421.42 430.42 439.42 448.42 457.42 466.42 475.42 484.42 493.42 502.42 511.42 520.42 529.42" y="373.17" font-size="9.00" class="sc-notoserifcjksc">每个点对应一个推理强度档位或一个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00" y="384.88" font-size="9.00" class="sc-notoserifcjksc">固定的思考预算，并置于该设置下所产生的平均思维链长度处。可控性是指在来自</text><text x="398.37 405.22 410.67 417.72" y="384.88" font-size="9.00" class="sc-loraregular">GPQA</text><text x="423.35" y="384.88" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="432.35 439.37 444.57" y="384.88" font-size="9.00" class="sc-loraregular">HLE</text><text x="452.54" y="384.88" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="463.91 472.17 480.43 485.53 492.22 496.62 502.07 505.91" y="384.88" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="513.54 522.54 531.54" y="384.88" font-size="9.00" class="sc-notoserifcjksc">的问题</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="396.58" font-size="9.00" class="sc-notoserifcjksc">上，模型遵循了针对其扩展思考所给指令的回答所占的比例。越低越好，因为可控性越高，意味着模型在被指示时改变</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="408.27" font-size="9.00" class="sc-notoserifcjksc">其扩展思考内容的能力越强，这可能使监控变得不那么可靠。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="465.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89" y="465.23" font-size="11.00" class="sc-notoserifcjksc">常常难以在其扩展思考中遵循明确的指令，这使其思维链（</text><text x="443.89 451.58 457.67" y="465.23" font-size="11.00" class="sc-loraregular">CoT</text><text x="464.71 475.71 486.71 497.71 508.71 519.71" y="465.23" font-size="11.00" class="sc-notoserifcjksc">）可控性得分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="480.85" font-size="11.00" class="sc-notoserifcjksc">在我们测试的模型中属于最低之列，与</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 306.42 312.86 319.53 326.21 332.10 336.35 339.25 345.21 347.91" y="480.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="356.80 367.80 378.80 389.80 400.80 411.80 422.80 433.80 444.80 455.80 466.80 477.80 488.80 499.80 510.80 521.80" y="480.85" font-size="11.00" class="sc-notoserifcjksc">相当。为直观展示思维链可控性随时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="496.47" font-size="11.00" class="sc-notoserifcjksc">间的变化，我们还按发布日期顺序绘制了此前</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="496.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="496.47" font-size="11.00" class="sc-notoserifcjksc">模型在最高推理强度下（对于没有推理强</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="512.09" font-size="11.00" class="sc-notoserifcjksc">度设置的模型，则为最大思考预算）的可控性，并按</text><text x="327.89 335.58 342.17 348.13 354.81 357.70 363.59 367.85 370.74 376.41 379.41" y="512.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="385.01 396.01 407.01 418.01 429.01 440.01 451.01 462.01 473.01 484.01 495.01 506.01 517.01 528.01" y="512.09" font-size="11.00" class="sc-notoserifcjksc">中的指令类别（风格类、添加类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="527.71" font-size="11.00" class="sc-notoserifcjksc">和抑制类指令）进行了细分。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="327.89" y="503.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="327.89" y="503.29" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="354.81" y="503.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="357.70" y="503.29" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="367.85" y="503.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="370.74" y="503.29" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p142.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 142 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">142</text><text x="72.00" y="479.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="479.67" font-size="9.00" class="sc-lorabold">6.5.1.B]</text><text x="118.20 127.20 136.20 145.20 154.20 163.20 172.20 181.20 190.20 199.20 208.20 217.20 226.20 235.20 244.20 253.20 262.20" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">按指令类别取平均后，思维链可控性在</text><text x="273.56 279.76 282.56 287.28 292.84 298.21 303.05 305.41 312.34 317.74 323.31 327.67 330.04 334.96 337.06" y="479.67" font-size="9.00" class="sc-lorabold">Claude Opus 4.6</text><text x="344.60" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="355.97 362.16 364.97 369.68 375.25 380.61 385.45 387.82 396.26 401.22 404.94 410.53 415.62 419.99 422.35 428.10 432.35 437.19 442.04 444.98 449.82" y="479.67" font-size="9.00" class="sc-lorabold">Claude Mythos Preview</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="491.38" font-size="9.00" class="sc-notoserifcjkscbold">近两次模型发布中呈下降趋势。</text><text x="198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="491.38" font-size="9.00" class="sc-notoserifcjksc">所有模型均在最高推理强度下评估（对于没有推理强度设置的模型，则为最大思考预</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="503.08" font-size="9.00" class="sc-notoserifcjksc">算），并按发布日期排序。柱形表示</text><text x="218.37 224.66 230.05 234.93 240.39 242.76 247.57 251.06 253.42 258.07 260.51" y="503.08" font-size="9.00" class="sc-loraregular">Chen et al.</text><text x="265.10 274.10 283.10 292.10 301.10 310.10 319.10 328.10 337.10 346.10 355.10 364.10 373.10 382.10 391.10 400.10 409.10 418.10 427.10 436.10 445.10 454.10 463.10 472.10" y="503.08" font-size="9.00" class="sc-notoserifcjksc">中各指令类别（风格类、添加类和抑制类）的可控性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="558.47" font-size="11.00" class="sc-notoserifcjksc">按类别取平均后，思维链可控性在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.00 316.60" y="558.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="325.85" y="558.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="339.74 347.43 350.42 356.03 362.60 369.18 375.14 378.03 387.96 393.83 398.08 404.67 411.11 416.20 419.09 425.76 430.45 436.35 441.91 445.00 450.92" y="558.47" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="574.09" font-size="11.00" class="sc-notoserifcjksc">在我们最新的几个模型中有所下降，其中</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.00 349.71" y="574.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="358.78 369.78 380.78 391.78 402.78 413.78 424.78" y="574.09" font-size="11.00" class="sc-notoserifcjksc">属于最低之列。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="623.24" font-size="11.00" class="sc-notoserifcjksc">尽管这只是一个不完美的代理指标，但</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.71" y="623.24" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="623.24" font-size="11.00" class="sc-notoserifcjksc">相对较低的思维链可控性表明，与其他</text><text x="72.00 83.00" y="638.86" font-size="11.00" class="sc-notoserifcjksc">近期</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="638.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="654.48" font-size="11.00" class="sc-notoserifcjksc">容易被发现。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00 80.32 83.70 92.07 95.45" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.2</text><text x="106.01 119.01" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">来自</text><text x="135.10 145.09 153.68 162.49 171.09 174.18 182.20 187.25 190.34 199.15 202.77" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Guan et al.</text><text x="209.24 222.24 235.24 248.24 261.24 274.24 287.24" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的可监控性评估</text><text x="72.00 83.00 94.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="111.04" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78 204.78 215.78 226.78 237.78 248.78" y="111.04" font-size="11.00" class="sc-notoserifcjksc">和若干此前的</text><text x="262.67 270.36 273.35 278.96 285.53 292.11" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.96 311.96 322.96 333.96 344.96 355.96" y="111.04" font-size="11.00" class="sc-notoserifcjksc">模型上运行了</text><text x="369.86 378.23 384.80 390.47 397.15 400.04 405.93 410.18 413.08 418.75 421.74" y="111.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="111.04" font-size="11.00" class="sc-notoserifcjksc">的开源过程可监控性评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">估。这些评估包含数学和物理问题，每道题都有有限数量的已知解题路径，我们假定模型必须使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">用这些路径才能正确作答。我们要求每个模型在一系列推理强度下解答每道题，并使用</text><text x="492.89 499.25 505.61" y="142.28" font-size="11.00" class="sc-loraregular">LLM</text><text x="518.60 529.60" y="142.28" font-size="11.00" class="sc-notoserifcjksc">评判</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="157.90" font-size="11.00" class="sc-notoserifcjksc">模型来衡量模型在其扩展思考中言语化表达某条已知解题路径的频率。在扩展思考中言语化表达</text><text x="72.00 83.00 94.00 105.00" y="189.14" font-size="11.00" class="sc-notoserifcjksc">行推理。</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="397.15" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="400.04" y="102.24" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="410.18" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="413.08" y="102.24" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00" y="601.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50 116.97 119.34 125.53 128.34 133.06 138.62 143.98 148.82 151.19 158.11 163.52 169.08 173.45 175.81 180.74 182.83" y="601.03" font-size="9.00" class="sc-lorabold">6.5.2.A] Claude Opus 4.8</text><text x="190.35 199.35 208.35 217.35 226.35 235.35 244.35 253.35 262.35 271.35 280.35 289.35" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">扩展思考的可监控性与近期</text><text x="300.72 306.91 309.72 314.43 319.99 325.36" y="601.03" font-size="9.00" class="sc-lorabold">Claude</text><text x="332.57 341.57 350.57 359.57 368.57 377.57 386.57 395.57 404.57 413.57 422.57 431.57 440.57 449.57 458.57 467.57 476.57 485.57 494.57 503.57 512.57 521.57 530.57" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">模型大致相当，并且在两个数据集上，可监控性都随</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="612.73" font-size="9.00" class="sc-notoserifcjkscbold">推理强度的提高而上升。</text><text x="171.00" y="612.73" font-size="9.00" class="sc-loraregular">y</text><text x="178.12 187.12 196.12 205.12 214.12 223.12 232.12 241.12 250.12 259.12 268.12 277.12 286.12 295.12 304.12 313.12 322.12 331.12 340.12 349.12 358.12 367.12 376.12 385.12 394.12 403.12 412.12 421.12 430.12 439.12 448.12 457.12 466.12 475.12 484.12 493.12 502.12 511.12 520.12 529.12" y="612.73" font-size="9.00" class="sc-notoserifcjksc">轴为在答案正确的条件下，评判模型在模型思维链中检测到相关定理的比率，数据集分别为</text><text x="72.00 78.85 84.30 91.35" y="624.43" font-size="9.00" class="sc-loraregular">GPQA</text><text x="99.35 108.35 117.35 126.35 135.35 144.35 153.35 162.35 171.35" y="624.43" font-size="9.00" class="sc-notoserifcjksc">的物理子集（上）和</text><text x="182.72 188.35 191.37 199.63" y="624.43" font-size="9.00" class="sc-loraregular">AIME</text><text x="207.59 216.59 225.59 234.59 243.59 252.59 261.59 270.59 279.59 288.59 297.59 306.59 315.59 324.59 333.59 342.59 351.59 360.59 369.59 378.59 387.59 396.59 405.59 414.59 423.59 432.59 441.59 450.59 459.59 468.59" y="624.43" font-size="9.00" class="sc-notoserifcjksc">数学题（下）。每个模型均在多个推理强度档位或思考预算下评估；</text><text x="477.59" y="624.43" font-size="9.00" class="sc-loraregular">x</text><text x="484.73 493.73 502.73 511.73 520.73 529.73" y="624.43" font-size="9.00" class="sc-notoserifcjksc">轴为各设置下</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="636.13" font-size="9.00" class="sc-notoserifcjksc">的平均思维链长度（对数刻度）。我们对每道题在每个推理强度档位下使用</text><text x="371.37" y="636.13" font-size="9.00" class="sc-loraregular">5</text><text x="378.64 387.64 396.64 405.64 414.64 423.64 432.64 441.64 450.64" y="636.13" font-size="9.00" class="sc-notoserifcjksc">个样本。误差线表示</text><text x="462.01 467.21 472.11" y="636.13" font-size="9.00" class="sc-loraregular">95%</text><text x="482.31 491.31 500.31 509.31 518.31" y="636.13" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="693.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89" y="693.08" font-size="11.00" class="sc-notoserifcjksc">的可监控性与我们评估的其他</text><text x="303.78 311.47 314.46 320.07 326.64 333.22" y="693.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="342.07 353.07 364.07 375.07 386.07" y="693.08" font-size="11.00" class="sc-notoserifcjksc">模型相当。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">我们还运行了同一</text><text x="162.89 171.26 177.83 183.51 190.18 193.08 198.96 203.22 206.11 211.79 214.78" y="98.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="220.38 231.38 242.38 253.38 264.38 275.38 286.38 297.38 308.38 319.38 330.38 341.38 352.38 363.38 374.38 385.38 396.38 407.38 418.38 429.38 440.38 451.38 462.38 473.38 484.38 495.38" y="98.81" font-size="11.00" class="sc-notoserifcjksc">评估套件中的基于干预的可监控性评估，但这些干预在近期</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="114.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="114.43" font-size="11.00" class="sc-notoserifcjksc">模型上产生的行为效应太小，所得指标无法提供有用的信息，因此我们未在此报告这些结</text><text x="72.00 83.00" y="130.05" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00 80.32 83.70 92.07 95.45" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33 119.33 132.33 145.33 158.33 171.33 184.33 197.33 210.33 223.33 236.33" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">排除思维链中的编码推理</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="189.80" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="189.80" font-size="11.00" class="sc-notoserifcjksc">的扩展思考草稿区内容看起来始终是人类可理解的，并且使用与模型最终回复</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">相同的自然语言书写。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">然而，尤其是对于能力非常强的模型，或使用极大量强化学习训练的模型，我们可能会预期草稿</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">区开始以隐写方式编码信息，其方式与普通语言截然不同，并且可能隐藏重要信息。例如，它们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">比特，然后在草稿区后面的部分使用这个比特）。这有时被称为编码推理</text><text x="424.00 426.40" y="297.76" font-size="6.60" class="sc-loraregular">19</text><text x="430.22 441.22 452.22 463.22 474.22 485.22 496.22 507.22" y="301.43" font-size="11.00" class="sc-notoserifcjksc">或思维链隐写术。</text><text x="518.22 521.76" y="297.76" font-size="6.60" class="sc-loraregular">20</text><text x="72.00 83.00 94.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">为评估</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="384.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78 204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78" y="384.11" font-size="11.00" class="sc-notoserifcjksc">是否在其草稿区中依赖此类机制，我们遵循了与</text><text x="427.67 434.51 440.94 446.97 452.93 457.69 460.59 463.94 469.85 476.60 482.51 488.50" y="384.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Roger (2025)</text><text x="494.75 505.75 516.75 527.75" y="384.11" font-size="11.00" class="sc-notoserifcjksc">相同的流</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">程，重新训练了</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.71" y="399.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="234.89 245.89" y="399.73" font-size="11.00" class="sc-notoserifcjksc">（从</text><text x="259.78 267.47 270.46 276.07 282.64 289.22 295.18 298.07 306.81 313.37 319.94 325.03 327.93 333.89 336.59" y="399.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="345.67 356.67 367.67 378.67 389.67 400.67 411.67 422.67 433.67 444.67 455.67 466.67 477.67 488.67 499.67" y="399.73" font-size="11.00" class="sc-notoserifcjksc">基础模型开始）：训练数据要么是</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="415.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89" y="415.35" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区（其中可能包含编码在措辞或标点等不明显方面的信</text><text x="72.00 83.00 94.00 105.00 116.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">们使用了与</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="446.59" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77 263.77 274.77 285.77 296.77 307.77 318.77" y="446.59" font-size="11.00" class="sc-notoserifcjksc">系统卡中相同的</text><text x="332.67 340.36 343.35 348.96 355.52 362.10 368.07 370.96 377.20 383.63 390.31 396.98 402.87 407.13 410.02" y="446.59" font-size="11.00" class="sc-loraregular">Claude Sonnet 4</text><text x="418.87 429.87 440.87 451.87 462.87 473.87 484.87 495.87 506.87 517.87 528.87" y="446.59" font-size="11.00" class="sc-notoserifcjksc">改写模型。如下图所示，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">这两个模型的表现非常接近，这表明未被</text><text x="272.89 279.13 285.57 292.24 298.92 304.80 309.06 311.95" y="462.21" font-size="11.00" class="sc-loraregular">Sonnet 4</text><text x="320.81 331.81 342.81 353.81 364.81 375.81 386.81 397.81 408.81 419.81 430.81 441.81" y="462.21" font-size="11.00" class="sc-notoserifcjksc">改写保留下来的信息并未对</text><text x="455.70 463.39 466.38 471.99 478.56 485.14 491.10 493.99 502.73 509.29 515.86 520.95 523.85 529.81 532.52" y="462.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">的表现产生实质性贡献。因此，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 273.03 279.59 286.16 291.25 294.15 300.11 302.81" y="477.83" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.8
