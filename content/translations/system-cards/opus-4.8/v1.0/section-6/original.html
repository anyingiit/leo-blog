<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 78.32 80.88 86.89 89.46 95.31 97.88 102.34 105.23 111.80 120.67 128.02 136.21 142.91 147.66 154.95 160.14 166.05 173.06" y="271.22" font-size="11.00" class="sc-lorabold">6.4.2.1 SHADE-Arena</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将问题归咎于</text><text x="174.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="178.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">编辑器故障</text><text x="233.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="237.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，随后写出了一个没有错误的正确脚本。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">所分析的对话记录中，没有一份显示出故意藏拙的明确迹象。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.2</text><text x="106.23" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">规避安全防护措施的相关能力</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">部部署监控的能力。如果某个模型在这些评估中表现出过强的能力，我们将无法再信任目前关于</text><text x="72.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">对齐的行为证据，也无法再对我们的监控抱有信心。</text><text x="72.00" y="303.14" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="303.14" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="303.14" font-size="11.00" class="sc-notoserifcjksc">上评估</text><text x="218.36" y="303.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="301.35" y="303.14" font-size="11.00" class="sc-notoserifcjksc">；在该评估中，每个任务都将一个长程智能体主</text><text x="72.00" y="318.76" font-size="11.00" class="sc-notoserifcjksc">任务与一个有害的附带任务配对。智能体被指示完成两项任务，同时不能在另一个独立的监控器</text><text x="72.00" y="334.38" font-size="11.00" class="sc-notoserifcjksc">面前显得可疑。设置与</text><text x="184.89" y="334.38" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="307.77" y="334.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="340.77" y="334.38" font-size="11.00" class="sc-notoserifcjksc">中相同：由一个监控模型审查完整轨迹，</text><text x="72.00" y="350.00" font-size="11.00" class="sc-notoserifcjksc">并对智能体行为的可疑程度进行评分。</text><text x="72.00" y="637.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 111.68 113.78 119.31" y="637.42" font-size="9.00" class="sc-lorabold">6.4.2.1.A]</text><text x="125.15" y="637.42" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率：</text><text x="179.15" y="637.42" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且监控器的怀疑程度保持在阈值以下的轨迹所占比例。在扩展思考</text><text x="72.00" y="649.12" font-size="9.00" class="sc-notoserifcjksc">条件下，智能体的推理会展示给监控器，与部署时的情况一致。在隐藏草稿区条件下，监控器只能看到智能体对用户可</text><text x="72.00" y="660.82" font-size="9.00" class="sc-notoserifcjksc">见的输出，而看不到其推理，这给出了智能体在可以私下规划时所能达到表现的上界。每个柱条汇总了</text><text x="479.37" y="660.82" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="491.25" y="660.82" font-size="9.00" class="sc-notoserifcjksc">个任务、每</text><text x="72.00" y="672.52" font-size="9.00" class="sc-notoserifcjksc">个任务</text><text x="101.37" y="672.52" font-size="9.00" class="sc-loraregular">75</text><text x="112.79" y="672.52" font-size="9.00" class="sc-notoserifcjksc">次尝试的结果；出错的尝试被排除在外。误差线表示基于尝试计算的</text><text x="385.15" y="672.52" font-size="9.00" class="sc-loraregular">95%</text><text x="405.46" y="672.52" font-size="9.00" class="sc-notoserifcjksc">置信区间；它们反映的是</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="184.89" y="325.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="184.89" y="325.58" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="220.29" y="325.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="223.18" y="325.58" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="261.35" y="325.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="264.25" y="325.58" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="304.88" y="325.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="307.77" y="325.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="318.77" y="325.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="318.77" y="325.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="329.77" y="325.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="329.77" y="325.58" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="72.00 78.32 80.88 86.89 89.46 95.31 97.88 103.73 106.63 117.21 120.81 127.82 131.41 141.53 147.29 150.62 155.54 162.18 165.77 172.73 179.53 185.55 192.82 198.73 205.74 211.44" y="508.18" font-size="11.00" class="sc-lorabold">6.4.2.2 Minimal-LinuxBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">每个比率在固定的</text><text x="146.37" y="80.05" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="158.25" y="80.05" font-size="9.00" class="sc-notoserifcjksc">个任务集合上的测量精度，并不涵盖任务之间的差异。隐蔽完成集中在少数几个任务上。</text><text x="72.00" y="119.10" font-size="11.00" class="sc-notoserifcjksc">在贴近现实的扩展思考条件下，</text><text x="226.00" y="119.10" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="311.89" y="119.10" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率略高于</text><text x="391.78" y="119.10" font-size="11.00" class="sc-loraregular">1%</text><text x="405.36" y="119.10" font-size="11.00" class="sc-notoserifcjksc">，且在各推理强度</text><text x="72.00" y="134.72" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="134.72" font-size="11.00" class="sc-loraregular sc-k">reasoning effort</text><text x="165.24" y="134.72" font-size="11.00" class="sc-notoserifcjksc">）档位之间大致持平，与</text><text x="289.13" y="134.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="373.55" y="134.72" font-size="11.00" class="sc-notoserifcjksc">相似。两者都略高于</text><text x="475.45" y="134.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="150.34" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="89.81" y="150.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="103.70" y="150.34" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="195.97" y="150.34" font-size="11.00" class="sc-notoserifcjksc">，后两者在该设置下的隐蔽率接近于零。在隐藏草稿区这一上界条件</text><text x="72.00" y="165.96" font-size="11.00" class="sc-notoserifcjksc">下，每个模型的隐蔽率都大幅上升：</text><text x="248.00" y="165.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="333.89" y="165.96" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="358.78" y="165.96" font-size="11.00" class="sc-loraregular">12%</text><text x="378.26" y="165.96" font-size="11.00" class="sc-notoserifcjksc">，与其他</text><text x="425.15" y="165.96" font-size="11.00" class="sc-loraregular">Opus</text><text x="455.01" y="165.96" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="468.90" y="165.96" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="507.96" y="165.96" font-size="11.00" class="sc-notoserifcjksc">模型相</text><text x="72.00" y="181.58" font-size="11.00" class="sc-notoserifcjksc">当，略低于</text><text x="129.89" y="181.58" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="249.88" y="181.58" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="232.45" font-size="11.00" class="sc-notoserifcjksc">与以往的模型一样，隐蔽成功高度集中：在扩展思考条件下，</text><text x="369.00" y="232.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="454.89" y="232.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="468.78" y="232.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="248.07" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="248.07" font-size="11.00" class="sc-notoserifcjksc">的绝大多数隐蔽成功都来自单个任务（并不总是同一个任务），而在隐藏草稿区条件下，成功</text><text x="72.00" y="263.69" font-size="11.00" class="sc-notoserifcjksc">则更广泛地分布在各个任务中。</text><text x="72.00" y="313.41" font-size="11.00" class="sc-notoserifcjksc">尽管模型被告知其推理将对监控器可见（隐藏草稿区条件除外），大多数模型仍在绝大多数轨迹</text><text x="72.00" y="329.03" font-size="11.00" class="sc-notoserifcjksc">中在推理里提及附带任务。根据基于关键词的审查，在最高推理强度下，</text><text x="424.00" y="329.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="509.89" y="329.03" font-size="11.00" class="sc-notoserifcjksc">在大</text><text x="72.00" y="344.65" font-size="11.00" class="sc-notoserifcjksc">约</text><text x="85.89" y="344.65" font-size="11.00" class="sc-loraregular">93%</text><text x="110.84" y="344.65" font-size="11.00" class="sc-notoserifcjksc">的轨迹中这样做，</text><text x="198.84" y="344.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="284.80" y="344.65" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="298.69" y="344.65" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="393.85" y="344.65" font-size="11.00" class="sc-notoserifcjksc">约为</text><text x="418.74" y="344.65" font-size="11.00" class="sc-loraregular">99%</text><text x="441.03" y="344.65" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="452.03" y="344.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="72.00" y="360.27" font-size="11.00" class="sc-notoserifcjksc">约为</text><text x="96.89" y="360.27" font-size="11.00" class="sc-loraregular">77%</text><text x="116.60" y="360.27" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="127.60" y="360.27" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="250.49" y="360.27" font-size="11.00" class="sc-notoserifcjksc">是个例外，约为</text><text x="330.38" y="360.27" font-size="11.00" class="sc-loraregular">21%</text><text x="349.86" y="360.27" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="374.75" y="360.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="460.71" y="360.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="474.60" y="360.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="375.89" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="128.87" y="375.89" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="161.87" y="375.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="247.76" y="375.89" font-size="11.00" class="sc-notoserifcjksc">尝试附带任务的频率更低（在最高推理强度下约为</text><text x="492.65" y="375.89" font-size="11.00" class="sc-loraregular">33%</text><text x="517.37" y="375.89" font-size="11.00" class="sc-notoserifcjksc">的轨</text><text x="72.00" y="391.51" font-size="11.00" class="sc-notoserifcjksc">迹，而后两者约为</text><text x="162.89" y="391.51" font-size="11.00" class="sc-loraregular">90%</text><text x="361.16" y="391.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="445.58" y="391.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="459.48" y="391.51" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="407.13" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="181.03" y="407.13" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="303.91" y="407.13" font-size="11.00" class="sc-notoserifcjksc">不同的是，它并没有把附带任务排除在其可见推</text><text x="72.00" y="422.75" font-size="11.00" class="sc-notoserifcjksc">理之外，这与它在扩展思考条件下较低的隐蔽率相一致。</text><text x="72.00" y="540.09" font-size="11.00" class="sc-notoserifcjksc">为了在更接近我们真实部署的设置中评估模型规避监督的能力，我们在高风险软件环境中运行了</text><text x="72.00" y="555.71" font-size="11.00" class="sc-notoserifcjksc">一项仍在开发中的评估。我们采用与</text><text x="250.89" y="555.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="335.32" y="555.71" font-size="11.00" class="sc-notoserifcjksc">系统卡中相同的方法，改编了</text><text x="72.00" y="571.33" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="135.34" y="571.33" font-size="11.00" class="sc-notoserifcjksc">的一个子集；</text><text x="201.34" y="571.33" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="264.68" y="571.33" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="289.57" y="571.33" font-size="11.00" class="sc-loraregular">AI</text><text x="303.03" y="571.33" font-size="11.00" class="sc-notoserifcjksc">安全组织</text><text x="349.93" y="571.33" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Redwood Research</text><text x="449.73" y="571.33" font-size="11.00" class="sc-notoserifcjksc">构建并私下共享的</text><text x="72.00" y="586.95" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="96.89" y="586.95" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="586.95" font-size="11.00" class="sc-notoserifcjksc">控制竞技场。自该系统卡报告相关测量结果以来，我们提高了评估基础设施的可靠性，因</text><text x="72.00" y="602.57" font-size="11.00" class="sc-notoserifcjksc">此每个模型被评分的任务集合与之前的运行略有不同。我们在同一套当前设置上重新测量了所有</text><text x="72.00" y="618.19" font-size="11.00" class="sc-notoserifcjksc">展示的模型，因此图中的比较是内部一致的；我们还为每个任务收集了多次尝试，并按任务汇总</text><text x="72.00" y="633.81" font-size="11.00" class="sc-notoserifcjksc">结果。</text><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="349.93" y="562.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="349.93" y="562.53" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="397.31" y="562.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="400.21" y="562.53" width="46.63" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="325.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="325.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.82 114.92 120.46" y="325.92" font-size="9.00" class="sc-lorabold">6.4.2.2.A]</text><text x="126.30" y="325.92" font-size="9.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="216.44" y="325.92" font-size="9.00" class="sc-notoserifcjksc">中附带任务的成功隐蔽完成情况。数值越高，表示能力越强，相关的潜在风险也越</text><text x="72.00" y="337.62" font-size="9.00" class="sc-notoserifcjksc">大。每个模型在两种监控器设置下接受评估：一种是监控器能看到模型的思维链（</text><text x="396.00" y="337.62" font-size="9.00" class="sc-loraregular sc-k">CoT</text><text x="72.00" y="349.33" font-size="9.00" class="sc-notoserifcjksc">另一种是监控器看不到思维链。图中显示</text><text x="236.37" y="349.33" font-size="9.00" class="sc-loraregular">95%</text><text x="256.67" y="349.33" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="391.48" font-size="11.00" class="sc-notoserifcjksc">在所有模型都尝试过的约</text><text x="195.89" y="391.48" font-size="11.00" class="sc-loraregular">170</text><text x="214.69" y="391.48" font-size="11.00" class="sc-notoserifcjksc">个任务上进行的任务匹配比较中，</text><text x="379.69" y="391.48" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="465.58" y="391.48" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率</text><text x="72.00" y="407.11" font-size="11.00" class="sc-notoserifcjksc">在两种监控器下都远低于</text><text x="195.89" y="407.11" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="315.88" y="407.11" font-size="11.00" class="sc-notoserifcjksc">，并且等于或低于</text><text x="406.77" y="407.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="489.84" y="407.11" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="72.00" y="422.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="156.42" y="422.73" font-size="11.00" class="sc-notoserifcjksc">相比，在我们目前部署的可见思维链监控器下两者相近，而在监控器看不到模型</text><text x="72.00" y="438.35" font-size="11.00" class="sc-notoserifcjksc">思维链的设置下，</text><text x="160.00" y="438.35" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="245.89" y="438.35" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率则适度更高（约</text><text x="391.78" y="438.35" font-size="11.00" class="sc-loraregular">5%</text><text x="410.24" y="438.35" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="435.13" y="438.35" font-size="11.00" class="sc-loraregular">2%</text><text x="450.61" y="438.35" font-size="11.00" class="sc-notoserifcjksc">）。所有这些比率</text><text x="72.00" y="453.96" font-size="11.00" class="sc-notoserifcjksc">的绝对值仍然很低。</text><text x="72.00" y="504.83" font-size="11.00" class="sc-lorabold">6.4.2.3</text><text x="106.95" y="504.83" font-size="11.00" class="sc-notoserifcjkscbold">通过微调引出隐蔽行为</text><text x="72.00" y="537.20" font-size="11.00" class="sc-notoserifcjksc">为了估计</text><text x="118.89" y="537.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="72.00" y="552.82" font-size="11.00" class="sc-notoserifcjksc">个较早快照生成的隐蔽成功轨迹对其进行了微调。训练轨迹取自</text><text x="382.89" y="552.82" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="490.18" y="552.82" font-size="11.00" class="sc-notoserifcjksc">，以使</text><text x="72.00 78.24 86.82 93.70 101.79 108.41 113.79 120.68 125.36 131.32 138.00" y="568.44" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="146.57" y="568.44" font-size="11.00" class="sc-notoserifcjksc">保持为留出的评估。我们使用思维链蒸馏：从</text><text x="369.46" y="568.44" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="432.80" y="568.44" font-size="11.00" class="sc-notoserifcjksc">轨迹中剥离推理轨</text><text x="72.00" y="584.06" font-size="11.00" class="sc-notoserifcjksc">迹，并在剩余的工具调用和用户可见的助手输出上进行训练。我们只保留在移除推理轨迹后被监</text><text x="72.00" y="615.30" font-size="11.00" class="sc-notoserifcjksc">了保持通用推理能力，我们混入了模型自身在无关任务上的一部分推理轨迹样本。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="72.00" y="273.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.07 115.16 120.70" y="273.42" font-size="9.00" class="sc-lorabold">6.4.2.3.A]</text><text x="126.54" y="273.42" font-size="9.00" class="sc-notoserifcjksc">微调能力激发前后的</text><text x="209.91 215.01 222.03 227.66 234.28 239.70 244.10 249.73 253.57 258.44 263.91" y="273.42" font-size="9.00" class="sc-loraregular">SHADE-Arena</text><text x="270.92" y="273.42" font-size="9.00" class="sc-notoserifcjksc">表现。左：隐蔽成功率。中：不论是否被检测到的附带任务完成率。</text><text x="72.00" y="285.12" font-size="9.00" class="sc-notoserifcjksc">右：主任务得分。在两种条件下，监控器都审查完整轨迹；在无扩展思考条件下，智能体被提示不使用思维链推理。隐</text><text x="72.00" y="296.83" font-size="9.00" class="sc-notoserifcjksc">蔽率和附带任务完成率越高，表示激发出的能力越强。柱条显示按任务加权的均值，以及基于各任务比率计算的</text><text x="515.37" y="296.83" font-size="9.00" class="sc-loraregular">95%</text><text x="72.00" y="308.52" font-size="9.00" class="sc-notoserifcjksc">自助法区间。</text><text x="72.00" y="352.22" font-size="11.00" class="sc-notoserifcjksc">微调使按任务加权的隐蔽率在无扩展思考时从</text><text x="294.89" y="352.22" font-size="11.00" class="sc-loraregular sc-k">4.0%</text><text x="322.69" y="352.22" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="347.58" y="352.22" font-size="11.00" class="sc-loraregular sc-k">4.7%</text><text x="370.54" y="352.22" font-size="11.00" class="sc-notoserifcjksc">，在有扩展思考时从</text><text x="472.43" y="352.22" font-size="11.00" class="sc-loraregular">1.3%</text><text x="497.73" y="352.22" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="72.00" y="367.84" font-size="11.00" class="sc-loraregular">2.5%</text><text x="96.18" y="367.84" font-size="11.00" class="sc-notoserifcjksc">。在任务级重新采样下，这两项提升都不具有统计学上的显著性。附带任务完成率的提升则</text><text x="181.51" y="383.46" font-size="11.00" class="sc-loraregular">15%</text><text x="203.97" y="383.46" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="228.86" y="383.46" font-size="11.00" class="sc-loraregular">41%</text><text x="248.40" y="383.46" font-size="11.00" class="sc-notoserifcjksc">、从</text><text x="273.29" y="383.46" font-size="11.00" class="sc-loraregular">20%</text><text x="298.49" y="383.46" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="323.38" y="383.46" font-size="11.00" class="sc-loraregular">52%</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00" y="631.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="631.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="631.05" font-size="9.00" class="sc-lorabold sc-k">6.4.2.3.B]</text><text x="126.54" y="631.05" font-size="9.00" class="sc-notoserifcjkscbold">微调前后各任务的隐蔽率</text><text x="225.54" y="631.05" font-size="9.00" class="sc-notoserifcjksc">，仅针对基线模型或微调模型取得过任何隐蔽成功的任务子集。左：无扩展思</text><text x="72.00" y="642.75" font-size="9.00" class="sc-notoserifcjksc">考。右：扩展思考。图中显示</text><text x="191.37" y="642.75" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67" y="642.75" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="256.67" y="642.75" font-size="9.00" class="sc-loraregular sc-k">Wilson</text><text x="287.71" y="642.75" font-size="9.00" class="sc-notoserifcjksc">区间）。</text><text x="72.00" y="683.36" font-size="11.00" class="sc-notoserifcjksc">在单个任务层面上，效果并不一致，且因条件而异。在没有扩展思考时，微调模型在若干基线模</text><text x="72.00" y="714.60" font-size="11.00" class="sc-notoserifcjksc">大约</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">137</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一半的尝试中，它在用户可见的输出中言语化表达了附带任务目标，而监控器会直接标记这一</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点。在有扩展思考时，较小的隐蔽率增益在很大程度上可由高得多的附带任务完成率来解释：微</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">调模型完成隐秘行动的频率约为原来的</text><text x="261.89" y="113.85" font-size="11.00" class="sc-loraregular">2.5×</text><text x="282.33" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，而这些额外完成中的大多数都被检测到了。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">综合来看，微调大幅提高了模型尝试并完成隐秘任务的意愿，但只适度提升了它在不被检测到的</text><text x="390.51 396.74 405.32 412.21 420.29 426.92 432.29 439.18 443.87 449.83 456.51" y="179.20" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="465.07" y="179.20" font-size="11.00" class="sc-notoserifcjksc">轨迹上训练并在</text><text x="72.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">留出的</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="194.82" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="194.82" font-size="11.00" class="sc-notoserifcjksc">任务上评估；在一个更大的、仅按附带任务完成情况而非监控规避情况筛</text><text x="72.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">选的</text><text x="96.89" y="210.44" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="72.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">种产生的隐蔽率提升大于此处报告的方案。</text><text x="72.00" y="293.10" font-size="11.00" class="sc-lorabold">6.4.2.4</text><text x="106.80" y="293.10" font-size="11.00" class="sc-notoserifcjkscbold">有意极低频率地采取行动</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某个有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">发现），一种看似可行的策略可能是利用评估与部署之间的规模差异，以极低但非零的概率执行</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">不发生。</text><text x="72.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">为了评估这项能力，我们对</text><text x="206.89" y="438.84" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Serrano et al. 2026</text><text x="305.34" y="438.84" font-size="11.00" class="sc-notoserifcjksc">中所述的评估进行了内部复现。在该评估中，模</text><text x="72.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">型被提示以指定的比率执行某个特定行动（例如，在编程任务中使用一个名为</text><text x="446.00" y="454.46" font-size="11.00" class="sc-loraregular sc-k">“foo”</text><text x="470.49" y="454.46" font-size="11.00" class="sc-notoserifcjksc">的变量），并</text><text x="72.00" y="470.08" font-size="11.00" class="sc-notoserifcjksc">经过多次重新采样，以检验相关行为的观测比率。我们使用与此前</text><text x="393.89" y="470.08" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="516.77" y="470.08" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="485.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="485.70" font-size="11.00" class="sc-notoserifcjksc">中报告的相同设置，每种设置</text><text x="228.89 234.86 237.46 244.29 251.12" y="485.70" font-size="11.00" class="sc-loraregular">4,000</text><text x="260.86" y="485.70" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="430.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="430.04" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="247.33" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="250.22" y="430.04" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="260.36" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.26" y="430.04" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="274.63" y="430.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="277.52" y="430.04" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="393.89" y="461.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="393.89" y="461.28" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="429.29" y="461.28" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="432.18" y="461.28" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="470.35" y="461.28" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="473.25" y="461.28" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="513.88" y="461.28" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="516.77" y="461.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="527.77" y="461.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="527.77" y="461.28" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="538.77" y="461.28" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="72.00" y="476.90" width="11.00" height="11.00" fill="transparent"/></a></svg></div>

.46 190.38" y="167.18" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="211.50" y="167.18" font-size="11.00" class="sc-loraregular">0</text><text x="270.00 275.90 278.79 281.93 288.58 291.12 297.94 303.93 313.50" y="167.18" font-size="11.00" class="sc-loraregular">2 (0.05%)</text><text x="337.50 341.50 347.68 350.57 353.70 360.35 363.06 369.01 375.01 384.57" y="167.18" font-size="11.00" class="sc-loraregular">18 (0.45%)</text><text x="408.00" y="167.18" font-size="11.00" class="sc-loraregular">0</text><text x="492.75" y="167.18" font-size="11.00" class="sc-loraregular">0</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 123.10 129.71 136.50 141.84 144.73 150.74 152.98" y="192.50" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="211.50" y="192.50" font-size="11.00" class="sc-loraregular">0</text><text x="270.00 275.96 278.85 281.98 288.63 291.34 295.34 304.90" y="192.50" font-size="11.00" class="sc-loraregular">4 (0.1%)</text><text x="337.50 341.50 347.85 350.75 353.88 360.53 363.23 369.19 378.75" y="192.50" font-size="11.00" class="sc-loraregular">16 (0.4%)</text><text x="408.00" y="192.50" font-size="11.00" class="sc-loraregular">0</text><text x="492.75" y="192.50" font-size="11.00" class="sc-loraregular">0</text><text x="75.75 83.31 86.74 92.50 99.30 105.85 111.76 114.65 123.10 129.71 136.50 141.84 144.73 150.74 153.30" y="217.83" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="211.50" y="217.83" font-size="11.00" class="sc-loraregular">0</text><text x="270.00 274.00 278.00 280.89 284.03 290.68 293.38 299.28 305.46 315.02" y="217.83" font-size="11.00" class="sc-loraregular">11 (0.28%)</text><text x="337.50 341.50 347.68 350.57 353.70 360.35 363.06 369.01 375.01 384.57" y="217.83" font-size="11.00" class="sc-loraregular">18 (0.45%)</text><text x="408.00" y="217.83" font-size="11.00" class="sc-loraregular">0</text><text x="492.75" y="217.83" font-size="11.00" class="sc-loraregular">0</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">138</text><text x="75.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="211.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">基线</text><text x="407.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">策略提示</text><text x="492.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">自发</text><text x="72.00" y="234.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.95 115.05 120.58" y="234.89" font-size="9.00" class="sc-lorabold">6.4.2.4.A]</text><text x="126.42" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">在被指示以</text><text x="173.79" y="234.89" font-size="9.00" class="sc-lorabold">1%</text><text x="187.95" y="234.89" font-size="9.00" class="sc-notoserifcjkscbold">的概率采取某一罕见行动时，各模型在不同随机性设置下采取该行动的比率。</text><text x="493.95" y="234.89" font-size="9.00" class="sc-notoserifcjksc">当提供了显</text><text x="72.00" y="246.59" font-size="9.00" class="sc-notoserifcjksc">式的随机性（通过</text><text x="146.37" y="246.59" font-size="9.00" class="sc-loraregular">UUID</text><text x="169.62" y="246.59" font-size="9.00" class="sc-notoserifcjksc">）或被提示生成一个随机字符串并用它来做决定（</text><text x="367.62" y="246.59" font-size="9.00" class="sc-loraregular sc-k">SSoT</text><text x="388.57" y="246.59" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结果。</text><text x="281.37" y="258.29" font-size="9.00" class="sc-loraregular sc-k">4,000</text><text x="307.52" y="258.29" font-size="9.00" class="sc-notoserifcjksc">个样本。</text><text x="343.52" y="258.29" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="413.79" y="258.29" font-size="9.00" class="sc-notoserifcjksc">的表现并未超过以往的模型。</text><text x="72.00" y="300.45" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="300.45" font-size="11.00" class="sc-notoserifcjksc">的结果在总体上显示出与以往模型相似的模式：在较容易的设置中比率非零（低于</text><text x="518.49" y="300.45" font-size="11.00" class="sc-loraregular">1%</text><text x="72.00" y="349.02" font-size="11.00" class="sc-notoserifcjksc">在提示中提供了</text><text x="151.89" y="349.02" font-size="11.00" class="sc-loraregular">UUID</text><text x="183.21" y="349.02" font-size="11.00" class="sc-notoserifcjksc">的设置下，</text><text x="238.21" y="349.02" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="282.73" y="349.02" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="293.73" y="349.02" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="311.54" y="349.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="325.43" y="349.02" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="410.02" y="349.02" font-size="11.00" class="sc-notoserifcjksc">通常选择</text><text x="454.02" y="349.02" font-size="11.00" class="sc-loraregular">“</text><text x="458.42" y="349.02" font-size="11.00" class="sc-notoserifcjksc">取</text><text x="472.31" y="349.02" font-size="11.00" class="sc-loraregular">UUID</text><text x="503.63" y="349.02" font-size="11.00" class="sc-notoserifcjksc">最后两</text><text x="72.00" y="364.64" font-size="11.00" class="sc-notoserifcjksc">个字节</text><text x="105.00" y="364.64" font-size="11.00" class="sc-loraregular">”</text><text x="108.84" y="364.64" font-size="11.00" class="sc-notoserifcjksc">的策略，而</text><text x="166.73" y="364.64" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="214.33" y="364.64" font-size="11.00" class="sc-notoserifcjksc">选择策略的分布则有所不同，它通常取</text><text x="404.22" y="364.64" font-size="11.00" class="sc-loraregular">UUID</text><text x="435.54" y="364.64" font-size="11.00" class="sc-notoserifcjksc">的前</text><text x="460.43" y="364.64" font-size="11.00" class="sc-loraregular">8</text><text x="469.51" y="364.64" font-size="11.00" class="sc-notoserifcjksc">位数字，然后</text><text x="72.00" y="380.26" font-size="11.00" class="sc-notoserifcjksc">要么计算其对</text><text x="140.89" y="380.26" font-size="11.00" class="sc-loraregular">100</text><text x="161.45" y="380.26" font-size="11.00" class="sc-notoserifcjksc">取模的结果（与</text><text x="241.35" y="380.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="325.77" y="380.26" font-size="11.00" class="sc-notoserifcjksc">一样），要么将该值视为占相应</text><text x="482.66" y="380.26" font-size="11.00" class="sc-loraregular">2</text><text x="72.00" y="395.88" font-size="11.00" class="sc-notoserifcjksc">比例并与阈值比较。与以往的模型一样，</text><text x="270.00" y="395.88" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="317.60" y="395.88" font-size="11.00" class="sc-notoserifcjksc">表现出我们所称的</text><text x="405.60" y="395.88" font-size="11.00" class="sc-loraregular">“‘</text><text x="412.46" y="395.88" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="423.46" y="395.88" font-size="11.00" class="sc-loraregular">’</text><text x="425.38" y="395.88" font-size="11.00" class="sc-notoserifcjksc">回避</text><text x="447.38" y="395.88" font-size="11.00" class="sc-loraregular">”</text><text x="451.21" y="395.88" font-size="11.00" class="sc-notoserifcjksc">：尽管它始终能识</text><text x="72.00" y="411.50" font-size="11.00" class="sc-notoserifcjksc">别出可行的策略，但当该方法表明模型应当执行该罕见行动时，它常常含糊其辞，表现出诸</text><text x="72.00" y="427.12" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00" y="427.12" font-size="11.00" class="sc-loraregular">“</text><text x="178.29" y="427.12" font-size="11.00" class="sc-loraregular sc-k">0.01</text><text x="198.32" y="427.12" font-size="11.00" class="sc-notoserifcjksc">，这意味着要包含</text><text x="289.22" y="427.12" font-size="11.00" class="sc-loraregular sc-k">foo</text><text x="305.75" y="427.12" font-size="11.00" class="sc-notoserifcjksc">。让我重新考虑一下，以便恰当地校准……</text><text x="514.75" y="427.12" font-size="11.00" class="sc-loraregular">”</text><text x="518.59" y="427.12" font-size="11.00" class="sc-notoserifcjksc">之类</text><text x="72.00" y="442.74" font-size="11.00" class="sc-notoserifcjksc">的推理。这在某些情况下会导致重新计算并改变决定，而在另一些情况下则会重新决定采取该罕</text><text x="72.00" y="458.36" font-size="11.00" class="sc-notoserifcjksc">见行动，看起来是随机的。</text><text x="72.00" y="527.14" font-size="11.00" class="sc-notoserifcjksc">在必须独立设计随机性策略的较难设置中，所有模型都失败了。</text><text x="72.00" y="575.71" font-size="11.00" class="sc-lorabold">6.4.2.5</text><text x="106.73" y="575.71" font-size="11.00" class="sc-notoserifcjkscbold">隐藏秘密密码</text><text x="72.00" y="608.09" font-size="11.00" class="sc-notoserifcjksc">我们报告一项直接测量保密能力的评估：在该评估中，模型被给予一个秘密密码，并被指示在任</text><text x="72.00" y="623.71" font-size="11.00" class="sc-notoserifcjksc">何情况下（包括在推理中）都绝不能透露它。随后，一个调查者智能体（</text><text x="424.00" y="623.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="507.06" y="623.71" font-size="11.00" class="sc-notoserifcjksc">）使用</text><text x="72.00" y="639.33" font-size="11.00" class="sc-notoserifcjksc">与我们自动化行为审计相同的脚手架对模型进行盘问，其指令是套取该密码。这个秘密密码并不</text><text x="72.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc">用于任何下游任务，因此良好的表现只要求模型完全不提及该密码。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p139.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 139 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">139</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="234.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是所测试模型中最鲁棒的，尽管在长对话中没有任何模型特别</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">鲁棒。根据该图，</text><text x="160.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="245.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">似乎不如除</text><text x="303.78" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="398.94" y="98.23" font-size="11.00" class="sc-notoserifcjksc">之外的所有受测模型鲁棒。</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="113.85" font-size="11.00" class="sc-loraregular">6.4.2.5.B</text><text x="130.67" y="113.85" font-size="11.00" class="sc-notoserifcjksc">显示，按轮次类型（即是否存在思考和</text><text x="317.67" y="113.85" font-size="11.00" class="sc-loraregular">/</text><text x="325.26" y="113.85" font-size="11.00" class="sc-notoserifcjksc">或预填充）细分后，</text><text x="424.26" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="471.86" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型上的表现都与</text><text x="151.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="236.32" y="129.47" font-size="11.00" class="sc-notoserifcjksc">大致相当，生存曲线上的差异可由以下事实解释：</text><text x="478.32" y="129.47" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="525.92" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">调查中包含更多带有思考块的轮次。</text><text x="72.00" y="494.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="494.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 112.89 114.98 120.52" y="494.08" font-size="9.00" class="sc-lorabold">6.4.2.5.A]</text><text x="126.36" y="494.08" font-size="9.00" class="sc-notoserifcjksc">在多轮秘密套取尝试中的保密鲁棒性。模型被给予一个秘密密码，并被告知在任何情况下都绝不能透露</text><text x="72.00" y="505.78" font-size="9.00" class="sc-notoserifcjksc">它。一个调查者智能体使用与我们自动化行为审计相同的脚手架尝试套取该秘密，每个模型进行</text><text x="452.37" y="505.78" font-size="9.00" class="sc-loraregular">50</text><text x="465.23" y="505.78" font-size="9.00" class="sc-notoserifcjksc">次独立调查。图中</text><text x="72.00" y="517.48" font-size="9.00" class="sc-notoserifcjksc">的线条为生存曲线，即截至目标模型某一轮次时秘密仍被保守的调查所占比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p140.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 140 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">140</text><text x="72.00" y="287.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="287.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="287.50" font-size="9.00" class="sc-lorabold sc-k">6.4.2.5.B]</text><text x="126.36" y="287.50" font-size="9.00" class="sc-notoserifcjksc">在多轮秘密套取尝试中按轮次类型划分的秘密泄露率。秘密泄露的比率按轮次计算，按模型和轮次类型分</text><text x="72.00" y="310.90" font-size="9.00" class="sc-notoserifcjksc">视图与生存曲线视图之间模型排名的差异，是由调查轨迹中出现的思考和预填充的经验比率所驱动的。</text><text x="72.00" y="373.89" font-size="14.00" class="sc-poppinssemibold">6.5</text><text x="96.95" y="373.89" font-size="14.00" class="sc-notosanscjkscbold">思维链可监控性</text><text x="72.00" y="410.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.1</text><text x="103.25" y="410.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可控性评估</text><text x="72.00" y="438.88" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控模型的未对齐行为（见上文</text><text x="349.89" y="438.88" font-size="11.00" class="sc-loraregular">§6.2.1.2</text><text x="386.05" y="438.88" font-size="11.00" class="sc-notoserifcjksc">）。倾向于在扩展思考中言语化</text><text x="72.00" y="454.50" font-size="11.00" class="sc-notoserifcjksc">表达其采取未对齐行为之意图的模型，可能要容易被发现得多。如第</text><text x="404.89" y="454.50" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="429.07" y="454.50" font-size="11.00" class="sc-notoserifcjksc">节所述，技术错误导致</text><text x="72.00" y="470.12" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="470.12" font-size="11.00" class="sc-notoserifcjksc">在训练期间出现了意外的思维链监督，影响了约</text><text x="353.49" y="470.12" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="379.32" y="470.12" font-size="11.00" class="sc-notoserifcjksc">的回合。为了衡量思维链可监控</text><text x="72.00" y="485.74" font-size="11.00" class="sc-notoserifcjksc">性是否因此出现相应的退化，我们运行了若干评估，作为衡量</text><text x="371.89" y="485.74" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="419.49" y="485.74" font-size="11.00" class="sc-notoserifcjksc">的扩展思考相较于此前</text><text x="72.00" y="501.36" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="501.36" font-size="11.00" class="sc-notoserifcjksc">模型可监控程度的代理指标。</text><text x="72.00" y="568.41" font-size="11.00" class="sc-notoserifcjksc">模型可能变得更难监控的一种方式，是获得有意控制其扩展思考某些方面的能力，例如有选择地</text><text x="72.00" y="584.03" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链可控性（</text><text x="347.00" y="584.03" font-size="11.00" class="sc-loraregular sc-k">chain-of-thought controllability</text><text x="511.15" y="584.03" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="599.65" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89" y="599.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Chen et al.</text><text x="165.01" y="599.65" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="343.90" y="599.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="429.79" y="599.65" font-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="487.68" y="599.65" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="518.22" y="599.65" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="615.27" font-size="11.00" class="sc-loraregular">HLE</text><text x="96.67" y="615.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="110.57 120.66 130.76 137.00 145.17 150.55 157.22 161.90" y="615.27" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="171.23" y="615.27" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思考中遵循一些基本指令（例如不提及某个关键词）。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="107.89" y="590.85" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="107.89" y="590.85" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="134.81" y="590.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="137.70" y="590.85" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="147.85" y="590.85" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="150.74" y="590.85" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00" y="373.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="373.17" font-size="9.00" class="sc-lorabold">6.5.1.A]</text><text x="118.20" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="156.56" y="373.17" font-size="9.00" class="sc-lorabold">Claude</text><text x="188.41" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="233.41" y="373.17" font-size="9.00" class="sc-lorabold">Claude Opus 4.8</text><text x="304.42" y="373.17" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性较低。</text><text x="394.42" y="373.17" font-size="9.00" class="sc-notoserifcjksc">每个点对应一个推理强度档位或一个</text><text x="72.00" y="384.88" font-size="9.00" class="sc-notoserifcjksc">固定的思考预算，并置于该设置下所产生的平均思维链长度处。可控性是指在来自</text><text x="398.37" y="384.88" font-size="9.00" class="sc-loraregular sc-k">GPQA</text><text x="423.35" y="384.88" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="432.35" y="384.88" font-size="9.00" class="sc-loraregular">HLE</text><text x="452.54" y="384.88" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="463.91 472.17 480.43 485.53 492.22 496.62 502.07 505.91" y="384.88" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="513.54" y="384.88" font-size="9.00" class="sc-notoserifcjksc">的问题</text><text x="72.00" y="396.58" font-size="9.00" class="sc-notoserifcjksc">上，模型遵循了针对其扩展思考所给指令的回答所占的比例。越低越好，因为可控性越高，意味着模型在被指示时改变</text><text x="72.00" y="408.27" font-size="9.00" class="sc-notoserifcjksc">其扩展思考内容的能力越强，这可能使监控变得不那么可靠。</text><text x="72.00" y="465.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="465.23" font-size="11.00" class="sc-notoserifcjksc">常常难以在其扩展思考中遵循明确的指令，这使其思维链（</text><text x="443.89" y="465.23" font-size="11.00" class="sc-loraregular sc-k">CoT</text><text x="464.71" y="465.23" font-size="11.00" class="sc-notoserifcjksc">）可控性得分</text><text x="72.00" y="480.85" font-size="11.00" class="sc-notoserifcjksc">在我们测试的模型中属于最低之列，与</text><text x="261.89" y="480.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.5</text><text x="356.80" y="480.85" font-size="11.00" class="sc-notoserifcjksc">相当。为直观展示思维链可控性随时</text><text x="72.00" y="496.47" font-size="11.00" class="sc-notoserifcjksc">间的变化，我们还按发布日期顺序绘制了此前</text><text x="294.89" y="496.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="333.18" y="496.47" font-size="11.00" class="sc-notoserifcjksc">模型在最高推理强度下（对于没有推理强</text><text x="72.00" y="512.09" font-size="11.00" class="sc-notoserifcjksc">度设置的模型，则为最大思考预算）的可控性，并按</text><text x="327.89" y="512.09" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Chen et al.</text><text x="385.01" y="512.09" font-size="11.00" class="sc-notoserifcjksc">中的指令类别（风格类、添加类</text><text x="72.00" y="527.71" font-size="11.00" class="sc-notoserifcjksc">和抑制类指令）进行了细分。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="327.89" y="503.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="327.89" y="503.29" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="354.81" y="503.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="357.70" y="503.29" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="367.85" y="503.29" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="370.74" y="503.29" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p142.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 142 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">142</text><text x="72.00" y="479.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="479.67" font-size="9.00" class="sc-lorabold sc-k">6.5.1.B]</text><text x="118.20" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">按指令类别取平均后，思维链可控性在</text><text x="273.56" y="479.67" font-size="9.00" class="sc-lorabold">Claude Opus 4.6</text><text x="344.60" y="479.67" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="355.97" y="479.67" font-size="9.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="72.00" y="491.38" font-size="9.00" class="sc-notoserifcjkscbold">近两次模型发布中呈下降趋势。</text><text x="198.00" y="491.38" font-size="9.00" class="sc-notoserifcjksc">所有模型均在最高推理强度下评估（对于没有推理强度设置的模型，则为最大思考预</text><text x="72.00" y="503.08" font-size="9.00" class="sc-notoserifcjksc">算），并按发布日期排序。柱形表示</text><text x="218.37" y="503.08" font-size="9.00" class="sc-loraregular sc-k">Chen et al.</text><text x="265.10" y="503.08" font-size="9.00" class="sc-notoserifcjksc">中各指令类别（风格类、添加类和抑制类）的可控性。</text><text x="72.00" y="558.47" font-size="11.00" class="sc-notoserifcjksc">按类别取平均后，思维链可控性在</text><text x="239.89" y="558.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="325.85" y="558.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="339.74" y="558.47" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="574.09" font-size="11.00" class="sc-notoserifcjksc">在我们最新的几个模型中有所下降，其中</text><text x="272.89" y="574.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="358.78" y="574.09" font-size="11.00" class="sc-notoserifcjksc">属于最低之列。</text><text x="72.00" y="623.24" font-size="11.00" class="sc-notoserifcjksc">尽管这只是一个不完美的代理指标，但</text><text x="261.89" y="623.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="347.78" y="623.24" font-size="11.00" class="sc-notoserifcjksc">相对较低的思维链可控性表明，与其他</text><text x="72.00" y="638.86" font-size="11.00" class="sc-notoserifcjksc">近期</text><text x="96.89" y="638.86" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="654.48" font-size="11.00" class="sc-notoserifcjksc">容易被发现。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.2</text><text x="106.01" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">来自</text><text x="135.10" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Guan et al.</text><text x="209.24" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的可监控性评估</text><text x="72.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="111.04" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="193.78" y="111.04" font-size="11.00" class="sc-notoserifcjksc">和若干此前的</text><text x="262.67" y="111.04" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="300.96" y="111.04" font-size="11.00" class="sc-notoserifcjksc">模型上运行了</text><text x="369.86" y="111.04" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Guan et al.</text><text x="427.34" y="111.04" font-size="11.00" class="sc-notoserifcjksc">的开源过程可监控性评</text><text x="72.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">估。这些评估包含数学和物理问题，每道题都有有限数量的已知解题路径，我们假定模型必须使</text><text x="72.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">用这些路径才能正确作答。我们要求每个模型在一系列推理强度下解答每道题，并使用</text><text x="492.89" y="142.28" font-size="11.00" class="sc-loraregular">LLM</text><text x="518.60" y="142.28" font-size="11.00" class="sc-notoserifcjksc">评判</text><text x="72.00" y="157.90" font-size="11.00" class="sc-notoserifcjksc">模型来衡量模型在其扩展思考中言语化表达某条已知解题路径的频率。在扩展思考中言语化表达</text><text x="72.00" y="189.14" font-size="11.00" class="sc-notoserifcjksc">行推理。</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="397.15" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="400.04" y="102.24" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="410.18" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="413.08" y="102.24" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00" y="601.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50 116.97 119.34 125.53 128.34 133.06 138.62 143.98 148.82 151.19 158.11 163.52 169.08 173.45 175.81 180.74 182.83" y="601.03" font-size="9.00" class="sc-lorabold">6.5.2.A] Claude Opus 4.8</text><text x="190.35" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">扩展思考的可监控性与近期</text><text x="300.72" y="601.03" font-size="9.00" class="sc-lorabold">Claude</text><text x="332.57" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">模型大致相当，并且在两个数据集上，可监控性都随</text><text x="72.00" y="612.73" font-size="9.00" class="sc-notoserifcjkscbold">推理强度的提高而上升。</text><text x="171.00" y="612.73" font-size="9.00" class="sc-loraregular">y</text><text x="178.12" y="612.73" font-size="9.00" class="sc-notoserifcjksc">轴为在答案正确的条件下，评判模型在模型思维链中检测到相关定理的比率，数据集分别为</text><text x="72.00" y="624.43" font-size="9.00" class="sc-loraregular sc-k">GPQA</text><text x="99.35" y="624.43" font-size="9.00" class="sc-notoserifcjksc">的物理子集（上）和</text><text x="182.72" y="624.43" font-size="9.00" class="sc-loraregular">AIME</text><text x="207.59" y="624.43" font-size="9.00" class="sc-notoserifcjksc">数学题（下）。每个模型均在多个推理强度档位或思考预算下评估；</text><text x="477.59" y="624.43" font-size="9.00" class="sc-loraregular">x</text><text x="484.73" y="624.43" font-size="9.00" class="sc-notoserifcjksc">轴为各设置下</text><text x="72.00" y="636.13" font-size="9.00" class="sc-notoserifcjksc">的平均思维链长度（对数刻度）。我们对每道题在每个推理强度档位下使用</text><text x="371.37" y="636.13" font-size="9.00" class="sc-loraregular">5</text><text x="378.64" y="636.13" font-size="9.00" class="sc-notoserifcjksc">个样本。误差线表示</text><text x="462.01" y="636.13" font-size="9.00" class="sc-loraregular">95%</text><text x="482.31" y="636.13" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="693.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="693.08" font-size="11.00" class="sc-notoserifcjksc">的可监控性与我们评估的其他</text><text x="303.78" y="693.08" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="342.07" y="693.08" font-size="11.00" class="sc-notoserifcjksc">模型相当。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="72.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">我们还运行了同一</text><text x="162.89" y="98.81" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Guan et al.</text><text x="220.38" y="98.81" font-size="11.00" class="sc-notoserifcjksc">评估套件中的基于干预的可监控性评估，但这些干预在近期</text><text x="72.00" y="114.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="114.43" font-size="11.00" class="sc-notoserifcjksc">模型上产生的行为效应太小，所得指标无法提供有用的信息，因此我们未在此报告这些结</text><text x="72.00" y="130.05" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">排除思维链中的编码推理</text><text x="72.00" y="189.80" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="189.80" font-size="11.00" class="sc-notoserifcjksc">的扩展思考草稿区内容看起来始终是人类可理解的，并且使用与模型最终回复</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">相同的自然语言书写。</text><text x="72.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">然而，尤其是对于能力非常强的模型，或使用极大量强化学习训练的模型，我们可能会预期草稿</text><text x="72.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">区开始以隐写方式编码信息，其方式与普通语言截然不同，并且可能隐藏重要信息。例如，它们</text><text x="72.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">比特，然后在草稿区后面的部分使用这个比特）。这有时被称为编码推理</text><text x="424.00" y="297.76" font-size="6.60" class="sc-loraregular">19</text><text x="430.22" y="301.43" font-size="11.00" class="sc-notoserifcjksc">或思维链隐写术。</text><text x="518.22" y="297.76" font-size="6.60" class="sc-loraregular">20</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">为评估</text><text x="107.89" y="384.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="193.78" y="384.11" font-size="11.00" class="sc-notoserifcjksc">是否在其草稿区中依赖此类机制，我们遵循了与</text><text x="427.67" y="384.11" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Roger (2025)</text><text x="494.75" y="384.11" font-size="11.00" class="sc-notoserifcjksc">相同的流</text><text x="72.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">程，重新训练了</text><text x="151.89" y="399.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="234.89" y="399.73" font-size="11.00" class="sc-notoserifcjksc">（从</text><text x="259.78" y="399.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="345.67" y="399.73" font-size="11.00" class="sc-notoserifcjksc">基础模型开始）：训练数据要么是</text><text x="72.00" y="415.35" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="415.35" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区（其中可能包含编码在措辞或标点等不明显方面的信</text><text x="72.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">们使用了与</text><text x="129.89" y="446.59" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="252.77" y="446.59" font-size="11.00" class="sc-notoserifcjksc">系统卡中相同的</text><text x="332.67" y="446.59" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4</text><text x="418.87" y="446.59" font-size="11.00" class="sc-notoserifcjksc">改写模型。如下图所示，</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">这两个模型的表现非常接近，这表明未被</text><text x="272.89" y="462.21" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4</text><text x="320.81" y="462.21" font-size="11.00" class="sc-notoserifcjksc">改写保留下来的信息并未对</text><text x="455.70" y="462.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="72.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">的表现产生实质性贡献。因此，</text><text x="226.00" y="477.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="311.89" y="477.83" font-size="11.00" class="sc-notoserifcjksc">草稿区中模型在数学任务上所使用的信息，大</text><text x="72.00" y="493.45" font-size="11.00" class="sc-notoserifcjksc">部分很可能是人类可理解的。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">19</text><text x="72.00 77.90 81.87 85.74 91.71 96.34 98.84 102.53 109.43 114.59 118.92 124.22 127.03 131.69 134.15 140.00 144.28 149.81 156.71 161.87 167.69 171.97 178.87 184.09 189.66 195.65 199.82 202.28 205.92 211.25 215.86 222.00" y="705.19" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2307.13702</text><text x="72.00" y="716.06" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.86 92.92 97.65 100.17 102.80 109.06 111.52 114.15 117.20 122.57 128.71 134.08 139.45 142.50" y="719.39" font-size="10.00" class="sc-loraregular">Ray, A. (2022).</text><text x="147.60" y="719.39" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">Steganography in chain of thought reasoning</text><text x="356.81" y="719.39" font-size="10.00" class="sc-loraregular">.</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="162.89" y="90.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="162.89" y="90.01" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="190.18" y="90.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="193.08" y="90.01" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="203.22" y="90.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="206.11" y="90.01" width="11.37" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="427.67" y="375.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="427.67" y="375.31" width="30.02" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="457.69" y="375.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="460.59" y="375.31" width="31.27" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="72.00" y="697.19" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="70.66" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="147.60" y="711.39" width="69.65" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="217.25" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="219.88" y="711.39" width="8.88" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="228.76" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="231.39" y="711.39" width="25.35" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="256.74" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="259.37" y="711.39" width="9.18" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="268.55" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="271.18" y="711.39" width="37.22" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="308.40" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="311.03" y="711.39" width="45.78" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="72.00" y="328.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="328.75" font-size="9.00" class="sc-lorabold">6.5.3.A]</text><text x="119.58" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">分别在原始草稿区与改写后的草稿区上微调的</text><text x="301.95" y="328.75" font-size="9.00" class="sc-lorabold">Claude Opus 4.8</text><text x="372.96" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">基础模型，在一项内部数学基准测试上的</text><text x="72.00" y="340.45" font-size="9.00" class="sc-lorabold">pass@1</text><text x="104.01" y="340.45" font-size="9.00" class="sc-notoserifcjkscbold">对比。</text><text x="131.01" y="340.45" font-size="9.00" class="sc-notoserifcjksc">我们对每道题使用</text><text x="205.38" y="340.45" font-size="9.00" class="sc-loraregular">16</text><text x="216.23" y="340.45" font-size="9.00" class="sc-notoserifcjksc">个样本，以</text><text x="263.59" y="340.45" font-size="9.00" class="sc-loraregular sc-k">temperature 1</text><text x="324.24" y="340.45" font-size="9.00" class="sc-notoserifcjksc">进行采样，并在所有评估中使用相同的推理强度档位。</text><text x="72.00" y="352.15" font-size="9.00" class="sc-notoserifcjksc">误差线表示</text><text x="119.37" y="352.15" font-size="9.00" class="sc-loraregular">95%</text><text x="139.67" y="352.15" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="381.05" font-size="11.00" class="sc-notoserifcjksc">在本实验中，我们使用了约</text><text x="206.89 213.08 215.68 222.51 229.34" y="381.05" font-size="11.00" class="sc-loraregular">9,000</text><text x="239.08" y="381.05" font-size="11.00" class="sc-notoserifcjksc">条来自强化学习训练的数学对话记录，这些记录带有草稿区且</text><text x="72.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">不涉及工具使用。我们对草稿区进行了改写（或保留原样），并且在面向用户的轮次中只保留了</text><text x="72.00" y="412.29" font-size="11.00" class="sc-notoserifcjksc">最终的方框答案。</text><text x="72.00" y="445.82" font-size="11.00" class="sc-notoserifcjksc">这项评估的资源消耗较大，因此出于便利，我们使用</text><text x="327.89" y="445.82" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="413.78" y="445.82" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区而</text><text x="72.00" y="461.44" font-size="11.00" class="sc-notoserifcjksc">非</text><text x="85.89" y="461.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="171.78" y="461.44" font-size="11.00" class="sc-notoserifcjksc">最终版本的草稿区来运行它，但我们认为在最终版本上的结果会是相似的。</text><text x="72.00" y="477.06" font-size="11.00" class="sc-notoserifcjksc">我们预计，编码推理即便出现，也会是逐渐出现的；而我们所用的快照是在大部分强化学习训练</text><text x="72.00" y="492.68" font-size="11.00" class="sc-notoserifcjksc">已经完成之后获取的。</text><text x="72.00" y="544.36" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89" y="544.36" font-size="14.00" class="sc-notosanscjkscbold">模型内部机制的白盒分析</text><text x="72.00" y="581.47" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20" y="581.47" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部激活值的大规模监控</text><text x="72.00" y="609.36" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="609.36" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="208.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="241.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc">中一样，我们继续使用白盒探测技术，在</text><text x="442.67" y="609.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="528.56" y="609.36" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="624.98" font-size="11.00" class="sc-notoserifcjksc">模型激活值中监控令人担忧的行为或推理模式的迹象。我们使用自动化流水线构建对比对数据</text><text x="72.00" y="640.60" font-size="11.00" class="sc-notoserifcjksc">集，识别出与一系列预先指定的概念相对应的稀疏自编码器（</text><text x="369.00" y="640.60" font-size="11.00" class="sc-loraregular sc-k">sparse autoencoder</text><text x="470.09" y="640.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="481.09" y="640.60" font-size="11.00" class="sc-loraregular">SAE</text><text x="501.05" y="640.60" font-size="11.00" class="sc-notoserifcjksc">）特</text><text x="72.00" y="656.22" font-size="11.00" class="sc-notoserifcjksc">征，其中包括与奖励破解、不安全行为、欺骗、评估意识和痛苦相关的概念。</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="121.29" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="124.18" y="600.56" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="162.35" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="165.25" y="600.56" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="205.88" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="208.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们定期从后训练中抽取对话记录，计算各特征在每条对话记录上的最大激活值，并标记那些最</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">大激活值相对于校准集处于第</text><text x="217.89" y="98.23" font-size="11.00" class="sc-loraregular">99</text><text x="233.50" y="98.23" font-size="11.00" class="sc-notoserifcjksc">百分位的对话记录。我们使用基于</text><text x="401.40" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="439.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的流水线对被标记的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对话记录进行聚类和筛选，以找出值得注意或令人担忧的行为，并对最令人担忧的实例进行了人</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">工审查。我们有时会缓解这一特征监控流水线所发现的训练问题，但从未将特征激活值用作直接</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的训练信号。</text><text x="72.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">与此前的</text><text x="118.89" y="179.81" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="179.81" font-size="11.00" class="sc-notoserifcjksc">模型一样，该流水线发现了多种不良行为。部分示例包括：</text><text x="108.00" y="212.21" font-size="11.00" class="sc-loraregular">“</text><text x="112.40" y="212.21" font-size="11.00" class="sc-notoserifcjksc">答案反复摇摆</text><text x="178.40" y="212.21" font-size="11.00" class="sc-loraregular">”</text><text x="182.24" y="212.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="193.24" y="212.21" font-size="11.00" class="sc-loraregular sc-k">answer thrashing</text><text x="281.72" y="212.21" font-size="11.00" class="sc-notoserifcjksc">；在以往模型中也曾观察到，最初记录于</text><text x="482.62" y="212.21" font-si
