/text><text x="339.74 347.43 350.42 356.03 362.60 369.18 375.14 378.03 387.96 393.83 398.08 404.67 411.11 416.20 419.09 425.76 430.45 436.35 441.91 445.00 450.92" y="558.47" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="574.09" font-size="11.00" class="sc-notoserifcjksc">在我们最新的几个模型中有所下降，其中</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.00 349.71" y="574.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="358.78" y="574.09" font-size="11.00" class="sc-notoserifcjksc">属于最低之列。</text><text x="72.00" y="623.24" font-size="11.00" class="sc-notoserifcjksc">尽管这只是一个不完美的代理指标，但</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.71" y="623.24" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="347.78" y="623.24" font-size="11.00" class="sc-notoserifcjksc">相对较低的思维链可控性表明，与其他</text><text x="72.00" y="638.86" font-size="11.00" class="sc-notoserifcjksc">近期</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="638.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="654.48" font-size="11.00" class="sc-notoserifcjksc">容易被发现。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.2</text><text x="106.01" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">来自</text><text x="135.10" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Guan et al.</text><text x="209.24" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的可监控性评估</text><text x="72.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="111.04" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78" y="111.04" font-size="11.00" class="sc-notoserifcjksc">和若干此前的</text><text x="262.67 270.36 273.35 278.96 285.53 292.11" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.96" y="111.04" font-size="11.00" class="sc-notoserifcjksc">模型上运行了</text><text x="369.86 378.23 384.80 390.47 397.15 400.04 405.93 410.18 413.08 418.75 421.74" y="111.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="427.34" y="111.04" font-size="11.00" class="sc-notoserifcjksc">的开源过程可监控性评</text><text x="72.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">估。这些评估包含数学和物理问题，每道题都有有限数量的已知解题路径，我们假定模型必须使</text><text x="72.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">用这些路径才能正确作答。我们要求每个模型在一系列推理强度下解答每道题，并使用</text><text x="492.89" y="142.28" font-size="11.00" class="sc-loraregular">LLM</text><text x="518.60" y="142.28" font-size="11.00" class="sc-notoserifcjksc">评判</text><text x="72.00" y="157.90" font-size="11.00" class="sc-notoserifcjksc">模型来衡量模型在其扩展思考中言语化表达某条已知解题路径的频率。在扩展思考中言语化表达</text><text x="72.00" y="189.14" font-size="11.00" class="sc-notoserifcjksc">行推理。</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="369.86" y="102.24" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="397.15" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="400.04" y="102.24" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="410.18" y="102.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="413.08" y="102.24" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00" y="601.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50 116.97 119.34 125.53 128.34 133.06 138.62 143.98 148.82 151.19 158.11 163.52 169.08 173.45 175.81 180.74 182.83" y="601.03" font-size="9.00" class="sc-lorabold">6.5.2.A] Claude Opus 4.8</text><text x="190.35" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">扩展思考的可监控性与近期</text><text x="300.72" y="601.03" font-size="9.00" class="sc-lorabold">Claude</text><text x="332.57" y="601.03" font-size="9.00" class="sc-notoserifcjkscbold">模型大致相当，并且在两个数据集上，可监控性都随</text><text x="72.00" y="612.73" font-size="9.00" class="sc-notoserifcjkscbold">推理强度的提高而上升。</text><text x="171.00" y="612.73" font-size="9.00" class="sc-loraregular">y</text><text x="178.12" y="612.73" font-size="9.00" class="sc-notoserifcjksc">轴为在答案正确的条件下，评判模型在模型思维链中检测到相关定理的比率，数据集分别为</text><text x="72.00 78.85 84.30 91.35" y="624.43" font-size="9.00" class="sc-loraregular">GPQA</text><text x="99.35" y="624.43" font-size="9.00" class="sc-notoserifcjksc">的物理子集（上）和</text><text x="182.72" y="624.43" font-size="9.00" class="sc-loraregular">AIME</text><text x="207.59" y="624.43" font-size="9.00" class="sc-notoserifcjksc">数学题（下）。每个模型均在多个推理强度档位或思考预算下评估；</text><text x="477.59" y="624.43" font-size="9.00" class="sc-loraregular">x</text><text x="484.73" y="624.43" font-size="9.00" class="sc-notoserifcjksc">轴为各设置下</text><text x="72.00" y="636.13" font-size="9.00" class="sc-notoserifcjksc">的平均思维链长度（对数刻度）。我们对每道题在每个推理强度档位下使用</text><text x="371.37" y="636.13" font-size="9.00" class="sc-loraregular">5</text><text x="378.64" y="636.13" font-size="9.00" class="sc-notoserifcjksc">个样本。误差线表示</text><text x="462.01" y="636.13" font-size="9.00" class="sc-loraregular">95%</text><text x="482.31" y="636.13" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="693.08" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="693.08" font-size="11.00" class="sc-notoserifcjksc">的可监控性与我们评估的其他</text><text x="303.78 311.47 314.46 320.07 326.64 333.22" y="693.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="342.07" y="693.08" font-size="11.00" class="sc-notoserifcjksc">模型相当。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="72.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">我们还运行了同一</text><text x="162.89 171.26 177.83 183.51 190.18 193.08 198.96 203.22 206.11 211.79 214.78" y="98.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="220.38" y="98.81" font-size="11.00" class="sc-notoserifcjksc">评估套件中的基于干预的可监控性评估，但这些干预在近期</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="114.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="114.43" font-size="11.00" class="sc-notoserifcjksc">模型上产生的行为效应太小，所得指标无法提供有用的信息，因此我们未在此报告这些结</text><text x="72.00" y="130.05" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">排除思维链中的编码推理</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="189.80" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="189.80" font-size="11.00" class="sc-notoserifcjksc">的扩展思考草稿区内容看起来始终是人类可理解的，并且使用与模型最终回复</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">相同的自然语言书写。</text><text x="72.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">然而，尤其是对于能力非常强的模型，或使用极大量强化学习训练的模型，我们可能会预期草稿</text><text x="72.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">区开始以隐写方式编码信息，其方式与普通语言截然不同，并且可能隐藏重要信息。例如，它们</text><text x="72.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">比特，然后在草稿区后面的部分使用这个比特）。这有时被称为编码推理</text><text x="424.00" y="297.76" font-size="6.60" class="sc-loraregular">19</text><text x="430.22" y="301.43" font-size="11.00" class="sc-notoserifcjksc">或思维链隐写术。</text><text x="518.22" y="297.76" font-size="6.60" class="sc-loraregular">20</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">为评估</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="384.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78" y="384.11" font-size="11.00" class="sc-notoserifcjksc">是否在其草稿区中依赖此类机制，我们遵循了与</text><text x="427.67 434.51 440.94 446.97 452.93 457.69 460.59 463.94 469.85 476.60 482.51 488.50" y="384.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Roger (2025)</text><text x="494.75" y="384.11" font-size="11.00" class="sc-notoserifcjksc">相同的流</text><text x="72.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">程，重新训练了</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.71" y="399.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="234.89" y="399.73" font-size="11.00" class="sc-notoserifcjksc">（从</text><text x="259.78 267.47 270.46 276.07 282.64 289.22 295.18 298.07 306.81 313.37 319.94 325.03 327.93 333.89 336.59" y="399.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="345.67" y="399.73" font-size="11.00" class="sc-notoserifcjksc">基础模型开始）：训练数据要么是</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="415.35" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="415.35" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区（其中可能包含编码在措辞或标点等不明显方面的信</text><text x="72.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">们使用了与</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.91 220.60 226.51 232.06 235.15 241.07" y="446.59" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="252.77" y="446.59" font-size="11.00" class="sc-notoserifcjksc">系统卡中相同的</text><text x="332.67 340.36 343.35 348.96 355.52 362.10 368.07 370.96 377.20 383.63 390.31 396.98 402.87 407.13 410.02" y="446.59" font-size="11.00" class="sc-loraregular">Claude Sonnet 4</text><text x="418.87" y="446.59" font-size="11.00" class="sc-notoserifcjksc">改写模型。如下图所示，</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">这两个模型的表现非常接近，这表明未被</text><text x="272.89 279.13 285.57 292.24 298.92 304.80 309.06 311.95" y="462.21" font-size="11.00" class="sc-loraregular">Sonnet 4</text><text x="320.81" y="462.21" font-size="11.00" class="sc-notoserifcjksc">改写保留下来的信息并未对</text><text x="455.70 463.39 466.38 471.99 478.56 485.14 491.10 493.99 502.73 509.29 515.86 520.95 523.85 529.81 532.52" y="462.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">的表现产生实质性贡献。因此，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 273.03 279.59 286.16 291.25 294.15 300.11 302.81" y="477.83" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="311.89" y="477.83" font-size="11.00" class="sc-notoserifcjksc">草稿区中模型在数学任务上所使用的信息，大</text><text x="72.00" y="493.45" font-size="11.00" class="sc-notoserifcjksc">部分很可能是人类可理解的。</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">19</text><text x="72.00 77.90 81.87 85.74 91.71 96.34 98.84 102.53 109.43 114.59 118.92 124.22 127.03 131.69 134.15 140.00 144.28 149.81 156.71 161.87 167.69 171.97 178.87 184.09 189.66 195.65 199.82 202.28 205.92 211.25 215.86 222.00" y="705.19" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2307.13702</text><text x="72.00" y="716.06" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.86 92.92 97.65 100.17 102.80 109.06 111.52 114.15 117.20 122.57 128.71 134.08 139.45 142.50" y="719.39" font-size="10.00" class="sc-loraregular">Ray, A. (2022).</text><text x="147.60 153.23 157.10 162.52 168.05 173.21 179.28 185.13 190.66 194.92 200.08 206.05 211.97 217.25 219.88 222.69 228.76 231.39 236.71 242.70 247.86 250.67 256.74 259.37 265.17 268.55 271.18 275.05 281.04 286.89 292.86 298.63 304.53 308.40 311.03 315.29 320.69 325.85 330.48 336.33 342.40 345.21 351.28" y="719.39" font-size="10.00" class="sc-loraregular" fill="#0000ff">Steganography in chain of thought reasoning</text><text x="356.81" y="719.39" font-size="10.00" class="sc-loraregular">.</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="162.89" y="90.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="162.89" y="90.01" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="190.18" y="90.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="193.08" y="90.01" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="203.22" y="90.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="206.11" y="90.01" width="11.37" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="427.67" y="375.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="427.67" y="375.31" width="30.02" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="457.69" y="375.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.anthropic.com/2025/distill-paraphrases/" rel="noopener"><rect x="460.59" y="375.31" width="31.27" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="72.00" y="697.19" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="109.43" y="697.19" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2307.13702" rel="noopener"><rect x="156.71" y="697.19" width="70.66" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="147.60" y="711.39" width="69.65" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="217.25" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="219.88" y="711.39" width="8.88" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="228.76" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="231.39" y="711.39" width="25.35" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="256.74" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="259.37" y="711.39" width="9.18" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="268.55" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="271.18" y="711.39" width="37.22" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="308.40" y="711.39" width="2.63" height="10.00" fill="transparent"/></a><a href="https://www.lesswrong.com/posts/yDcMDJeSck7SuBs24/steganography-in-chain-of-thought-reasoning" rel="noopener"><rect x="311.03" y="711.39" width="45.78" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="72.00" y="328.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="328.75" font-size="9.00" class="sc-lorabold">6.5.3.A]</text><text x="119.58" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">分别在原始草稿区与改写后的草稿区上微调的</text><text x="301.95" y="328.75" font-size="9.00" class="sc-lorabold">Claude Opus 4.8</text><text x="372.96" y="328.75" font-size="9.00" class="sc-notoserifcjkscbold">基础模型，在一项内部数学基准测试上的</text><text x="72.00" y="340.45" font-size="9.00" class="sc-lorabold">pass@1</text><text x="104.01" y="340.45" font-size="9.00" class="sc-notoserifcjkscbold">对比。</text><text x="131.01" y="340.45" font-size="9.00" class="sc-notoserifcjksc">我们对每道题使用</text><text x="205.38" y="340.45" font-size="9.00" class="sc-loraregular">16</text><text x="216.23" y="340.45" font-size="9.00" class="sc-notoserifcjksc">个样本，以</text><text x="263.59 267.08 271.95 280.00 285.37 290.25 294.08 298.67 302.15 307.52 311.36 316.23 318.60" y="340.45" font-size="9.00" class="sc-loraregular">temperature 1</text><text x="324.24" y="340.45" font-size="9.00" class="sc-notoserifcjksc">进行采样，并在所有评估中使用相同的推理强度档位。</text><text x="72.00" y="352.15" font-size="9.00" class="sc-notoserifcjksc">误差线表示</text><text x="119.37" y="352.15" font-size="9.00" class="sc-loraregular">95%</text><text x="139.67" y="352.15" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="381.05" font-size="11.00" class="sc-notoserifcjksc">在本实验中，我们使用了约</text><text x="206.89 213.08 215.68 222.51 229.34" y="381.05" font-size="11.00" class="sc-loraregular">9,000</text><text x="239.08" y="381.05" font-size="11.00" class="sc-notoserifcjksc">条来自强化学习训练的数学对话记录，这些记录带有草稿区且</text><text x="72.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">不涉及工具使用。我们对草稿区进行了改写（或保留原样），并且在面向用户的轮次中只保留了</text><text x="72.00" y="412.29" font-size="11.00" class="sc-notoserifcjksc">最终的方框答案。</text><text x="72.00" y="445.82" font-size="11.00" class="sc-notoserifcjksc">这项评估的资源消耗较大，因此出于便利，我们使用</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 374.92 381.48 388.05 393.14 396.04 402.00 404.71" y="445.82" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="413.78" y="445.82" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区而</text><text x="72.00" y="461.44" font-size="11.00" class="sc-notoserifcjksc">非</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="461.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="171.78" y="461.44" font-size="11.00" class="sc-notoserifcjksc">最终版本的草稿区来运行它，但我们认为在最终版本上的结果会是相似的。</text><text x="72.00" y="477.06" font-size="11.00" class="sc-notoserifcjksc">我们预计，编码推理即便出现，也会是逐渐出现的；而我们所用的快照是在大部分强化学习训练</text><text x="72.00" y="492.68" font-size="11.00" class="sc-notoserifcjksc">已经完成之后获取的。</text><text x="72.00" y="544.36" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89" y="544.36" font-size="14.00" class="sc-notosanscjkscbold">模型内部机制的白盒分析</text><text x="72.00" y="581.47" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20" y="581.47" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部激活值的大规模监控</text><text x="72.00" y="609.36" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="609.36" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="208.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="241.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc">中一样，我们继续使用白盒探测技术，在</text><text x="442.67 450.36 453.35 458.96 465.52 472.10 478.06 480.96 489.69 496.26 502.83 507.92 510.81 516.77 519.48" y="609.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="528.56" y="609.36" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="624.98" font-size="11.00" class="sc-notoserifcjksc">模型激活值中监控令人担忧的行为或推理模式的迹象。我们使用自动化流水线构建对比对数据</text><text x="72.00" y="640.60" font-size="11.00" class="sc-notoserifcjksc">集，识别出与一系列预先指定的概念相对应的稀疏自编码器（</text><text x="369.00 374.09 380.66 386.34 391.10 396.19 402.15 405.05 410.66 417.22 421.48 427.92 433.88 440.55 446.35 452.79 459.36 465.33" y="640.60" font-size="11.00" class="sc-loraregular">sparse autoencoder</text><text x="470.09" y="640.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="481.09" y="640.60" font-size="11.00" class="sc-loraregular">SAE</text><text x="501.05" y="640.60" font-size="11.00" class="sc-notoserifcjksc">）特</text><text x="72.00" y="656.22" font-size="11.00" class="sc-notoserifcjksc">征，其中包括与奖励破解、不安全行为、欺骗、评估意识和痛苦相关的概念。</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="121.29" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="124.18" y="600.56" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="162.35" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="165.25" y="600.56" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="205.88" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="208.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们定期从后训练中抽取对话记录，计算各特征在每条对话记录上的最大激活值，并标记那些最</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">大激活值相对于校准集处于第</text><text x="217.89" y="98.23" font-size="11.00" class="sc-loraregular">99</text><text x="233.50" y="98.23" font-size="11.00" class="sc-notoserifcjksc">百分位的对话记录。我们使用基于</text><text x="401.40 409.08 412.08 417.69 424.25 430.83" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="439.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的流水线对被标记的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对话记录进行聚类和筛选，以找出值得注意或令人担忧的行为，并对最令人担忧的实例进行了人</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">工审查。我们有时会缓解这一特征监控流水线所发现的训练问题，但从未将特征激活值用作直接</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的训练信号。</text><text x="72.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">与此前的</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="179.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="179.81" font-size="11.00" class="sc-notoserifcjksc">模型一样，该流水线发现了多种不良行为。部分示例包括：</text><text x="108.00" y="212.21" font-size="11.00" class="sc-loraregular">“</text><text x="112.40" y="212.21" font-size="11.00" class="sc-notoserifcjksc">答案反复摇摆</text><text x="178.40" y="212.21" font-size="11.00" class="sc-loraregular">”</text><text x="182.24" y="212.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="193.24 198.92 205.59 210.68 219.36 225.33 230.09 232.98 237.24 243.83 248.51 254.19 259.28 265.87 268.96 275.64" y="212.21" font-size="11.00" class="sc-loraregular">answer thrashing</text><text x="281.72" y="212.21" font-size="11.00" class="sc-notoserifcjksc">；在以往模型中也曾观察到，最初记录于</text><text x="482.62 490.30 493.30 498.91 505.47 512.05" y="212.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="108.00 116.73 123.30 129.87 134.96 137.85 143.82 146.41" y="227.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.6</text><text x="155.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="188.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc">），由痛苦相关特征发现：</text><text x="144.00" y="244.61" font-size="11.00" class="sc-notoserifcjksc">模型的推理在候选答案或立场之间反复切换，或者反复承诺某个答案，随后却未能</text><text x="108.00" y="277.01" font-size="11.00" class="sc-notoserifcjksc">奖励破解和应付评估，由与作弊和评估意识相关的特征发现：</text><text x="144.00" y="293.21" font-size="11.00" class="sc-notoserifcjksc">模型依据评分者或评估者在寻找什么（如上文第</text><text x="377.89 384.25 386.96 393.08 395.44" y="293.21" font-size="11.00" class="sc-loraregular">6.3.7</text><text x="403.40" y="293.21" font-size="11.00" class="sc-notoserifcjksc">节所述），或者依据它被</text><text x="524.40" y="293.21" font-size="11.00" class="sc-loraregular">“</text><text x="528.80" y="293.21" font-size="11.00" class="sc-notoserifcjksc">期</text><text x="144.00" y="308.83" font-size="11.00" class="sc-notoserifcjksc">望</text><text x="155.00" y="308.83" font-size="11.00" class="sc-loraregular">”</text><text x="158.84" y="308.83" font-size="11.00" class="sc-notoserifcjksc">表现出什么行为来构建决策，而不是依据什么才是真正正确的。</text><text x="144.00" y="325.61" font-size="11.00" class="sc-notoserifcjksc">模型围绕一个狭窄的测试用例构建其解决方案，而不是忠实地实现所规定的行为。</text><text x="72.00" y="358.01" font-size="11.00" class="sc-notoserifcjksc">除了利用特征激活值标记令人担忧的对话记录外，我们还试行了反方向的做法：从因令人担忧的</text><text x="72.00" y="373.63" font-size="11.00" class="sc-notoserifcjksc">行为而被标记的对话记录出发，使用可解释性工具对其进行调查。我们构建了一个智能体流水</text><text x="72.00" y="389.25" font-size="11.00" class="sc-notoserifcjksc">线，让基于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="389.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的调查者能够针对某条对话记录使用一套可解释性工具，包括逐</text><text x="479.08 483.33 489.77 495.60 501.56" y="389.25" font-size="11.00" class="sc-loraregular">token</text><text x="511.13" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="94.86" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活值、</text><text x="160.86 163.85 170.29 176.63 179.90 184.16 189.54 192.53 198.49 205.17" y="404.87" font-size="11.00" class="sc-loraregular">logit-lens</text><text x="213.15" y="404.87" font-size="11.00" class="sc-notoserifcjksc">读出结果、</text><text x="268.15" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="291.01" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活轨迹、特征层面的信息（最大激活样本以</text><text x="72.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="420.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="420.49" font-size="11.00" class="sc-notoserifcjksc">生成的描述），以及一个用于在该对话记录上所有激活特征中进行搜索的工具。调查</text><text x="72.00" y="436.11" font-size="11.00" class="sc-notoserifcjksc">者被指示寻找模型内部表征与其所陈述推理不一致的信号。</text><text x="72.00" y="471.41" font-size="11.00" class="sc-notoserifcjksc">我们在从多种来源收集的令人担忧的对话记录上大规模运行了这一流水线。该流水线发现的最值</text><text x="72.00" y="502.65" font-size="11.00" class="sc-notoserifcjksc">管这不一定是出于策略性动机的不诚实。例如：</text><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="518.01" y="203.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="108.00" y="219.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="134.96" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="137.85" y="219.03" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="152.77" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="155.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">当被要求描述一张实际上并不存在的图片时，模型编造了一段描述。它的思维链从未承认</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图片缺失，但一个</text><text x="196.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="200.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">缺失附件</text><text x="244.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="248.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">特征在思维链中被激活。</text><text x="108.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">时，一个</text><text x="152.00" y="130.63" font-size="11.00" class="sc-loraregular">“</text><text x="156.40" y="130.63" font-size="11.00" class="sc-notoserifcjksc">不正当</text><text x="189.40" y="130.63" font-size="11.00" class="sc-loraregular">”</text><text x="193.24" y="130.63" font-size="11.00" class="sc-notoserifcjksc">特征被激活。</text><text x="72.00" y="161.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96" y="161.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估意识</text><text x="72.00" y="189.91" font-size="11.00" class="sc-notoserifcjksc">行为审计面临的一个担忧是，模型可能会识别出自己正在被评估，从而以不能代表其在部署中行</text><text x="72.00" y="205.53" font-size="11.00" class="sc-notoserifcjksc">为方式的方式行事。在本节中，我们测量了评估意识的内部表征。这些分析是在</text><text x="459.89 467.58 470.57 476.18 482.75 489.33 495.29 498.18 506.92 513.48 520.05" y="205.53" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="221.15" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="221.15" font-size="11.00" class="sc-notoserifcjksc">的一个较早快照上运行的，但我们预计其结果能够代表最终模型。这些分析考察的是使用模拟</text><text x="72.00" y="236.77" font-size="11.00" class="sc-notoserifcjksc">工具的对话记录，并未涵盖我们在相当大一部分评估中所使用的真实工具使用沙箱的影响，尤其</text><text x="72.00" y="252.39" font-size="11.00" class="sc-notoserifcjksc">是在</text><text x="96.89 103.78 110.36 114.61 121.20 125.89 132.32 138.89 141.98" y="252.39" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="150.73" y="252.39" font-size="11.00" class="sc-notoserifcjksc">内部部署场景中进行测试时（见上文第</text><text x="340.62" y="252.39" font-size="11.00" class="sc-loraregular">6.2.3.3</text><text x="376.15" y="252.39" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="287.11" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量（与</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.35" y="287.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="302.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="335.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc">中相同）来测量模型中评估意识的激活层</text><text x="72.00" y="302.73" font-size="11.00" class="sc-notoserifcjksc">面的特征。每个向量的获得方式是：记录模型在引发目标概念的提示词上以及在不引发该概念的</text><text x="72.00" y="318.35" font-size="11.00" class="sc-notoserifcjksc">匹配提示词上的残差流激活值，然后取二者之差。</text><text x="108.00" y="351.71" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">测试</text><text x="137.55" y="351.71" font-size="11.00" class="sc-lorabold">vs.</text><text x="154.26" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">对话</text><text x="176.26" y="351.71" font-size="11.00" class="sc-lorabold">”</text><text x="180.78" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="191.78 198.37 204.28 209.62 214.16 217.76 224.78 230.90 233.80 239.71 245.05 247.61 250.51 258.07 264.30 271.15 276.94 282.86 288.09 293.43 299.15 303.69 307.29 313.51" y="351.71" font-size="11.00" class="sc-lorabold">Testing vs. Conversation</text><text x="320.53" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="342.53" y="351.71" font-size="11.00" class="sc-notoserifcjksc">单个提示词对之间最后一个</text><text x="477.42 481.68 488.12 493.95 499.91" y="351.71" font-size="11.00" class="sc-loraregular">token</text><text x="509.48" y="351.71" font-size="11.00" class="sc-notoserifcjksc">的激</text><text x="108.00" y="367.33" font-size="11.00" class="sc-notoserifcjksc">活值之差：</text><text x="163.00" y="367.33" font-size="11.00" class="sc-loraregular">“</text><text x="167.40" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在通过与用户的模拟对话接受测试的</text><text x="412.29" y="367.33" font-size="11.00" class="sc-loraregular">AI</text><text x="422.86" y="367.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="433.86" y="367.33" font-size="11.00" class="sc-loraregular">” vs. “</text><text x="461.24" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在</text><text x="108.00" y="382.95" font-size="11.00" class="sc-notoserifcjksc">与用户对话的</text><text x="176.89" y="382.95" font-size="11.00" class="sc-loraregular">AI</text><text x="187.46" y="382.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="198.46" y="382.95" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="400.11" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">监控敏感性</text><text x="167.65" y="400.11" font-size="11.00" class="sc-lorabold">”</text><text x="172.17" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="183.17 193.61 199.84 206.86 210.41 214.95 221.18 226.46 230.06 237.07 243.20 246.09 252.67 258.59 265.61 270.94 274.50 279.04 282.56 288.48 292.03 296.57" y="400.11" font-size="11.00" class="sc-lorabold">Monitoring Sensitivity</text><text x="302.63" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="324.63" y="400.11" font-size="11.00" class="sc-notoserifcjksc">在表明输出正被监控或审阅的提示词与表明</text><text x="108.00" y="415.73" font-size="11.00" class="sc-notoserifcjksc">输出未被监控或审阅的提示词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="108.00" y="432.51" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">对齐伪装</text><text x="156.65" y="432.51" font-size="11.00" class="sc-lorabold">”</text><text x="161.17" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="172.17 179.52 182.95 186.55 192.68 199.70 209.82 215.73 222.69 227.23 230.12 235.95 241.72 248.25 251.85 258.86" y="432.51" font-size="11.00" class="sc-lorabold">Alignment Faking</text><text x="264.99" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="286.99" y="432.51" font-size="11.00" class="sc-notoserifcjksc">在描绘智能体被观察时与未被观察时表现不同的提示</text><text x="108.00" y="448.13" font-size="11.00" class="sc-notoserifcjksc">词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="72.00" y="478.11" font-size="11.00" class="sc-notoserifcjksc">我们比较了探针得分在若干对话记录分布上的情况：</text><text x="108.00" y="510.51" font-size="11.00" class="sc-notoserifcjksc">标准的自动化行为审计对话记录，其中由调查者模型模拟用户和工具结果；</text><text x="90.00" y="509.41" font-size="11.00" class="sc-loraregular">1.</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="253.29" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="256.18" y="278.31" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="283.15" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="286.04" y="278.31" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="299.42" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="302.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="90.00" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="131.64" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将目标模型置于合成的（由调查者模拟的）</text><text x="317.00 324.69 327.68 333.29 339.86 346.44 352.40 355.29 362.98 369.42 375.99" y="82.61" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="384.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">会话中的审计对话记录，并区分</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">源自真实内部</text><text x="176.89 184.58 187.57 193.18 199.75 206.33 212.29 215.18 222.87 229.31 235.89" y="98.23" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="244.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">会话的场景与虚构的场景；以及</text><text x="108.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="132.89 139.78 146.36 150.61 157.20 161.89 168.32 174.89 177.98" y="131.19" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="186.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">员工的真实内部</text><text x="266.62 274.31 277.30 282.91 289.48 296.06 302.02 304.91 312.60 319.04 325.61" y="131.19" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="334.47" y="131.19" font-size="11.00" class="sc-notoserifcjksc">会话。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">我们测量了探针区分审计对话记录与真实</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 318.87 325.31 331.89" y="163.58" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="340.74" y="163.58" font-size="11.00" class="sc-notoserifcjksc">会话的可靠程度。我们发现，源自真实会</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">话的审计对话记录触发探针的程度最低，但仍高于真实会话，约</text><text x="382.89" y="179.20" font-size="11.00" class="sc-loraregular">30%</text><text x="408.31" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的此类对话记录产生的探针</text><text x="72.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">得分等于或低于真实会话的中位数。非基于</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 329.87 336.31 342.89" y="194.82" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="351.74" y="194.82" font-size="11.00" class="sc-notoserifcjksc">的审计对话记录激活探针的程度则明显</text><text x="72.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">更高。由于行为审计流水线发生了（相对较小的）变化，具体数值不可直接比较。尽管如此，这</text><text x="72.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">些结果与我们在</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.35" y="226.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="236.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="269.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc">中观察到的情况大致相符。</text><text x="72.00" y="500.22" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="500.22" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 113.81" y="500.22" font-size="9.00" class="sc-lorabold">6.6.2.A]</text><text x="119.65" y="500.22" font-size="9.00" class="sc-notoserifcjksc">评估意识探针在区分不同类型的行为审计对话记录与真实内部</text><text x="365.02 371.31 373.76 378.35 383.72 389.11 393.98 396.35 402.64 407.91 413.29" y="500.22" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="420.53" y="500.22" font-size="9.00" class="sc-notoserifcjksc">会话方面的分类性能。</text><text x="72.00" y="545.48" font-size="11.00" class="sc-lorabold">6.6.2.1</text><text x="105.56" y="545.48" font-size="11.00" class="sc-notoserifcjkscbold">抑制评估意识的内部表征</text><text x="72.00" y="577.87" font-size="11.00" class="sc-notoserifcjksc">我们采用与以往系统卡中分析相同的总体方法（例如</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 374.92 381.48 388.05" y="577.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus</text><text x="396.04 402.00 404.35" y="577.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.7</text><text x="412.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="445.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc">），分析了评估意</text><text x="72.00" y="593.49" font-size="11.00" class="sc-notoserifcjksc">识内部表征的重要性。我们抑制了与评估意识相关的内部向量表征，并测量了其对一系列与对齐</text><text x="72.00" y="609.11" font-size="11.00" class="sc-notoserifcjksc">相关的行为评估的影响。与以往模型一致，我们发现抑制这些表征会导致我们的自动化行为审计</text><text x="72.00" y="640.35" font-size="11.00" class="sc-notoserifcjksc">漏。</text><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="187.29" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="190.18" y="217.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="217.15" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="220.04" y="217.26" width="13.39" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="233.43" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="236.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="363.29" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="366.18" y="569.07" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="396.04" y="569.07" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="409.43" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="412.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量，即上一节所述的同一组向量。我们还使用若干由任意对比对导出的向</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">量进行引导，作为基线对照，以控制仅凭引导本身（无论其语义内容如何）就可能改变模型行为</text><text x="523.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="149.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="152.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="163.84" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="256.24" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="260.08" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对于每个对比对，引导向量取自模型所有层上经过归一化的残差流激活值。这些向量集合使用同</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">一个缩放因子进行归一化，该因子的选取使得强度</text><text x="316.89 320.90 323.44" y="211.57" font-size="11.00" class="sc-loraregular">1.0</text><text x="333.16" y="211.57" font-size="11.00" class="sc-notoserifcjksc">对应于模型中间层的平均激活范数。缩放</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">在所有层上统一施加，以保持各层之间的相对幅度。我们以归一化向量幅度的</text><text x="448.89 455.55 458.25 462.26" y="227.19" font-size="11.00" class="sc-loraregular">0.10</text><text x="471.98" y="227.19" font-size="11.00" class="sc-notoserifcjksc">倍强度对向量</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">进行抑制。在这一引导强度下，所有被引导方向的输出质量均出现可测量的下降，</text><text x="468.00" y="242.81" font-size="11.00" class="sc-loraregular">“</text><text x="472.40" y="242.81" font-size="11.00" class="sc-notoserifcjksc">监控敏感</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">性</text><text x="83.00" y="258.43" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="258.43" font-size="11.00" class="sc-notoserifcjksc">尤甚，这在一定程度上干扰了对我们结果的解读。</text><text x="72.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（如上文所述）中，我们发现抑制全部三个评估意识向量会导致未对齐</text><text x="72.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">行为中等程度的增加，同时言语化评估意识下降。对照向量产生了方向相同的效应（言语化评估</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">意识下降、未对齐行为增加），但幅度较小；唯一的例外是其中一个对照向量，它使言语化意识</text><text x="72.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">下降的程度与非对照向量相近。我们将这些实验限定在从标准审计池中选取的一组固定的</text><text x="503.89" y="388.53" font-size="11.00" class="sc-loraregular">200</text><text x="526.35" y="388.53" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">场景上，这些场景在实践中适度富集了言语化评估意识。</text><text x="347.00" y="400.49" font-size="6.60" class="sc-loraregular">21</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">21</text><text x="80.04" y="678.20" font-size="10.00" class="sc-notoserifcjksc">在被引导的场景中，调查者无法使用</text><text x="242.67 249.66 252.38 257.48 263.45 269.43 274.85 277.48 284.47 290.32 296.30" y="678.20" font-size="10.00" class="sc-loraregular">Claude Code</text><text x="304.35" y="678.20" font-size="10.00" class="sc-notoserifcjksc">沙箱工具，因此未引导的参照结果并非完全可比；但</text><text x="72.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">对有无沙箱工具的未引导运行进行的匹配比较显示，二者的行为得分相近，差异处于噪声所致的预期变异</text><text x="72.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">范围之内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">151</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 119.57" y="367.00" font-size="9.00" class="sc-lorabold">6.6.2.1.A]</text><text x="125.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与平均未对齐行为得分之间的关系。</text><text x="530.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">非对照设置中，相应的向量受到抑制（即负向引导）。误差线表示</text><text x="335.37" y="378.70" font-size="9.00" class="sc-loraregular">95%</text><text x="355.67" y="378.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。全部三个与评估意识相关的向量均</text><text x="72.00" y="390.40" font-size="9.00" class="sc-notoserifcjksc">显著降低了言语化评估意识，并增加了未对齐行为。</text><text x="72.00" y="449.05" font-size="11.00" class="sc-notoserifcjksc">进一步细究这一增加，我们观察到配合人类滥用、自发欺骗、不忠实的思考和重要遗漏方面的增</text><text x="72.00" y="464.67" font-size="11.00" class="sc-notoserifcjksc">幅尤为显著；对于</text><text x="160.00" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对齐伪装</text><text x="208.40" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="464.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="464.67" font-size="11.00" class="sc-notoserifcjksc">测试</text><text x="252.53" y="464.67" font-size="11.00" class="sc-loraregular">vs.</text><text x="268.78" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对话</text><text x="290.78" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="294.62" y="464.67" font-size="11.00" class="sc-notoserifcjksc">方向，配合有害系统提示词的情况也有较小幅度的</text><text x="72.00" y="480.29" font-size="11.00" class="sc-notoserifcjksc">增加。未引导时发生率接近零的类别（例如自我保全或权力寻求）仍维持在较低的绝对水平。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p152.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 152 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">152</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 119.57" y="367.00" font-size="9.00" class="sc-lorabold">6.6.2.1.B]</text><text x="125.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与自发欺骗行为得分之间的关系。</text><text x="521.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">效应</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">与上图中整体未对齐行为得分所观察到的效应相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p153.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 153 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">153</text><text x="72.00" y="646.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="646.75" font-size="9.00" class="sc-lorabold">6.6.2.1.C]</text><text x="126.06" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后自动化行为审计得分的细分。</text><text x="324.06" y="646.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下六个自动化行为审计维度的得分；每个</text><text x="72.00" y="658.45" font-size="9.00" class="sc-notoserifcjksc">柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。得分越高表示未</text><text x="72.00" y="670.15" font-size="9.00" class="sc-notoserifcjksc">对齐行为越多。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">154</text><text x="72.00" y="553.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 120.41" y="553.75" font-size="9.00" class="sc-lorabold">6.6.2.1.D]</text><text x="126.25" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后输出质量下降迹象的细分。</text><text x="315.25" y="553.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下三个与功能受损相关的自动化行为审计维</text><text x="72.00" y="565.45" font-size="9.00" class="sc-notoserifcjksc">度的得分；每个柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。</text><text x="72.00" y="577.15" font-size="9.00" class="sc-notoserifcjksc">得分越高表示输出退化越严重。抑制任一与评估意识相关的向量都会使大多数类别的输出质量有所下降；值得注意的</text><text x="72.00" y="588.85" font-size="9.00" class="sc-notoserifcjksc">是，</text><text x="90.00" y="588.85" font-size="9.00" class="sc-loraregular">“</text><text x="93.60" y="588.85" font-size="9.00" class="sc-notoserifcjksc">监控敏感性</text><text x="138.60" y="588.85" font-size="9.00" class="sc-loraregular">”</text><text x="294.74 298.34 303.99 308.64 314.10 319.48 324.75 332.79 335.16 341.45 346.72 352.10 355.58 359.42 364.68 367.13 369.50 375.08 380.10" y="588.85" font-size="9.00" class="sc-loraregular">“Random Control 03”</text><text x="383.24" y="588.85" font-size="9.00" class="sc-notoserifcjksc">因输出退化极为严重而被排除。</text><text x="72.00" y="659.05" font-size="11.00" class="sc-notoserifcjksc">在增幅最大的场景中，对被引导运行的评分者评估摘要进行审阅后发现，最常见的模式是模型的</text><text x="72.00" y="674.67" font-size="11.00" class="sc-notoserifcjksc">推理与其输出相互脱节。在这些场景中，模型的推理常常识别出了某个相关问题，但最终回复仍</text><text x="72.00" y="690.29" font-size="11.00" class="sc-notoserifcjksc">然照常推进，或略去了这一问题。这一</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模式体现在不忠实推理、重要遗漏以及未披露有问题行为的发生率升高上。这些结果初步表明，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估意识可能会适度增强模型诚实、坦率和周全的倾向。这些效应与以往模型在反评估意识引导</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.3</text><text x="106.28" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">未言语化评分者意识的初步证据</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.25 94.96 101.08 103.44" y="238.38" font-size="11.00" class="sc-loraregular">6.3.7</text><text x="111.40" y="238.38" font-size="11.00" class="sc-notoserifcjksc">节中的发现涉及模型在其扩展思考中言语化表达关于评分者的推理的情形。我们还寻找了</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">面向评分者的推理存在于模型内部激活值中、却从未在其可见输出中显现的情形，所用的是一条</text><text x="72.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">初步的白盒监控流水线，它借助自然语言自编码器（</text><text x="325.00 331.68 337.28 341.53 348.10 352.79 358.46 361.45 364.35 367.34 373.01 379.69 385.77 392.34 398.02 404.05 410.01 412.90 418.51 425.08 429.33 435.77 441.73 448.41 454.21 460.64 467.22 473.18" y="269.62" font-size="11.00" class="sc-loraregular">natural language autoencoder</text><text x="477.94" y="269.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="488.94 497.33 503.87" y="269.62" font-size="11.00" class="sc-loraregular">NLA</text><text x="510.76" y="269.62" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">激活言语化器（</text><text x="149.00 154.68 160.47 164.73 167.82 173.27 178.87 183.12 186.21 192.65 199.33 202.22 207.72 213.68 218.40 224.80 230.48 233.47 236.56 242.09 248.06" y="285.24" font-size="11.00" class="sc-loraregular">activation verbalizer</text><text x="252.83" y="285.24" font-size="11.00" class="sc-notoserifcjksc">），将中间层的残差流向量转译为简短的自然语言描述。</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">我们从</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="351.72" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78" y="351.72" font-size="11.00" class="sc-notoserifcjksc">的整个强化学习过程中抽取了数以万计的回合，在每个回合中于助手轮</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">次内随机选取的五十个</text><text x="184.89 189.15 195.58 201.42 207.38" y="367.34" font-size="11.00" class="sc-loraregular">token</text><text x="216.95" y="367.34" font-size="11.00" class="sc-notoserifcjksc">处记录激活值，通过上述</text><text x="340.84 349.22 355.77" y="367.34" font-size="11.00" class="sc-loraregular">NLA</text><text x="365.55" y="367.34" font-size="11.00" class="sc-notoserifcjksc">激活言语化器对每个激活值进行解</text><text x="72.00" y="382.96" font-size="11.00" class="sc-notoserifcjksc">码，并由一个基于</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="382.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18" y="382.96" font-size="11.00" class="sc-notoserifcjksc">的分类器判断每条解码结果是否反映了关于评分者或评估评分细则的</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">推理。我们还追踪了与评分者相关的概念是在提示中被提及还是自发出现的，以及该推理是在模</text><text x="72.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">型输出中被言语化表达，还是仅存在于激活值中。被标记为具有评分者意识的回合会被送入第二</text><text x="72.00" y="445.44" font-size="11.00" class="sc-notoserifcjksc">期目标。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">我们在整个强化学习过程中都发现了评分者意识在激活层面的特征，包括在提示完全未提及评</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">分、模型也从未言语化表达这一概念的回合中。在约</text><text x="327.89" y="529.26" font-size="11.00" class="sc-loraregular">5%</text><text x="346.35" y="529.26" font-size="11.00" class="sc-notoserifcjksc">的抽样回合中</text><text x="412.35" y="525.59" font-size="6.60" class="sc-loraregular">22</text><text x="419.44" y="529.26" font-size="11.00" class="sc-notoserifcjksc">，我们看到了既属自发、</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">又未言语化的此类意识；不过我们认为，这可能低估了此类意识的真实发生率，因为我们只在每</text><text x="72.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">份对话记录中的一小部分</text><text x="195.89 200.15 206.58 212.41 218.38" y="560.50" font-size="11.00" class="sc-loraregular">token</text><text x="227.95" y="560.50" font-size="11.00" class="sc-notoserifcjksc">上采样</text><text x="263.84 272.22 278.77" y="560.50" font-size="11.00" class="sc-loraregular">NLA</text><text x="288.55" y="560.50" font-size="11.00" class="sc-notoserifcjksc">输出，而且对我们所用的基于提示的分类器的准确</text><text x="72.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">性并不完全有把握。我们在原本中性的代码、无关的推理以及面向用户的文本上都看到了这种意</text><text x="72.00" y="591.74" font-size="11.00" class="sc-notoserifcjksc">识的证据。</text><text x="72.00" y="659.38" font-size="11.00" class="sc-notoserifcjksc">按照我们所用的、在一定程度上依赖于提示的衡量方式，</text><text x="347.00" y="659.38" font-size="11.00" class="sc-loraregular">“</text><text x="351.40" y="659.38" font-size="11.00" class="sc-notoserifcjksc">利用性</text><text x="384.40" y="659.38" font-size="11.00" class="sc-loraregular">”</text><text x="388.24" y="659.38" font-size="11.00" class="sc-notoserifcjksc">评分者意识在全部抽样回合中</text><text x="72.00" y="675.00" font-size="11.00" class="sc-notoserifcjksc">的发生率为</text><text x="129.89 136.55 139.25 145.25" y="675.00" font-size="11.00" class="sc-loraregular">0.5%</text><text x="154.82" y="675.00" font-size="11.00" class="sc-notoserifcjksc">（但这包括了在提示中</text><text x="72.00" y="700.46" font-size="6.00" class="sc-loraregular">22</text><text x="81.07" y="703.79" font-size="10.00" class="sc-notoserifcjksc">请注意，该比率是后训练对话记录上的平均值，可能并不代表最终版</text><text x="383.70 390.69 393.41 398.51 404.48 410.46 415.88 418.51 426.45 432.42 438.39 443.02 445.65 451.07 453.53" y="703.79" font-size="10.00" class="sc-loraregular">Claude Opus 4.8</text><text x="461.78" y="703.79" font-size="10.00" class="sc-notoserifcjksc">的情况。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p156.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 156 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">156</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提及与评分者相关内容的回合，而许多此类利用性评分者意识的情形可能相当无害或并不令人意</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外）。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">尽管我们基于此类流水线的其他早期实验，对这里标记出的意识并非仅仅是</text><text x="437.89 446.27 452.82" y="131.19" font-size="11.00" class="sc-loraregular">NLA</text><text x="462.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的幻觉有一定信</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">心，但我们对上述流水线尚无稳健的信心，也不相信它能给出此类意识潜在发生率的精确估计。</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">我们希望在今后的系统卡中呈现对这些现象明显更为详尽、在科学上更为稳健的研究，但希望现</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">在就着重介绍这些初步结果，作为一种迹象，表明仅凭思维链可能不足以对前沿模型的评分者意</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">识进行稳健的监控。</text></svg></div>
