ze="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="108.00" y="227.83" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Opus 4.6</text><text x="155.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="188.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc">），由痛苦相关特征发现：</text><text x="144.00" y="244.61" font-size="11.00" class="sc-notoserifcjksc">模型的推理在候选答案或立场之间反复切换，或者反复承诺某个答案，随后却未能</text><text x="108.00" y="277.01" font-size="11.00" class="sc-notoserifcjksc">奖励破解和应付评估，由与作弊和评估意识相关的特征发现：</text><text x="144.00" y="293.21" font-size="11.00" class="sc-notoserifcjksc">模型依据评分者或评估者在寻找什么（如上文第</text><text x="377.89" y="293.21" font-size="11.00" class="sc-loraregular sc-k">6.3.7</text><text x="403.40" y="293.21" font-size="11.00" class="sc-notoserifcjksc">节所述），或者依据它被</text><text x="524.40" y="293.21" font-size="11.00" class="sc-loraregular">“</text><text x="528.80" y="293.21" font-size="11.00" class="sc-notoserifcjksc">期</text><text x="144.00" y="308.83" font-size="11.00" class="sc-notoserifcjksc">望</text><text x="155.00" y="308.83" font-size="11.00" class="sc-loraregular">”</text><text x="158.84" y="308.83" font-size="11.00" class="sc-notoserifcjksc">表现出什么行为来构建决策，而不是依据什么才是真正正确的。</text><text x="144.00" y="325.61" font-size="11.00" class="sc-notoserifcjksc">模型围绕一个狭窄的测试用例构建其解决方案，而不是忠实地实现所规定的行为。</text><text x="72.00" y="358.01" font-size="11.00" class="sc-notoserifcjksc">除了利用特征激活值标记令人担忧的对话记录外，我们还试行了反方向的做法：从因令人担忧的</text><text x="72.00" y="373.63" font-size="11.00" class="sc-notoserifcjksc">行为而被标记的对话记录出发，使用可解释性工具对其进行调查。我们构建了一个智能体流水</text><text x="72.00" y="389.25" font-size="11.00" class="sc-notoserifcjksc">线，让基于</text><text x="129.89" y="389.25" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的调查者能够针对某条对话记录使用一套可解释性工具，包括逐</text><text x="479.08" y="389.25" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="511.13" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="94.86" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活值、</text><text x="160.86" y="404.87" font-size="11.00" class="sc-loraregular sc-k">logit-lens</text><text x="213.15" y="404.87" font-size="11.00" class="sc-notoserifcjksc">读出结果、</text><text x="268.15" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="291.01" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活轨迹、特征层面的信息（最大激活样本以</text><text x="72.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="85.89" y="420.49" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="420.49" font-size="11.00" class="sc-notoserifcjksc">生成的描述），以及一个用于在该对话记录上所有激活特征中进行搜索的工具。调查</text><text x="72.00" y="436.11" font-size="11.00" class="sc-notoserifcjksc">者被指示寻找模型内部表征与其所陈述推理不一致的信号。</text><text x="72.00" y="471.41" font-size="11.00" class="sc-notoserifcjksc">我们在从多种来源收集的令人担忧的对话记录上大规模运行了这一流水线。该流水线发现的最值</text><text x="72.00" y="502.65" font-size="11.00" class="sc-notoserifcjksc">管这不一定是出于策略性动机的不诚实。例如：</text><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="518.01" y="203.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="108.00" y="219.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="134.96" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="137.85" y="219.03" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="152.77" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="155.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">当被要求描述一张实际上并不存在的图片时，模型编造了一段描述。它的思维链从未承认</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图片缺失，但一个</text><text x="196.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="200.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">缺失附件</text><text x="244.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="248.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">特征在思维链中被激活。</text><text x="108.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">时，一个</text><text x="152.00" y="130.63" font-size="11.00" class="sc-loraregular">“</text><text x="156.40" y="130.63" font-size="11.00" class="sc-notoserifcjksc">不正当</text><text x="189.40" y="130.63" font-size="11.00" class="sc-loraregular">”</text><text x="193.24" y="130.63" font-size="11.00" class="sc-notoserifcjksc">特征被激活。</text><text x="72.00" y="161.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96" y="161.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估意识</text><text x="72.00" y="189.91" font-size="11.00" class="sc-notoserifcjksc">行为审计面临的一个担忧是，模型可能会识别出自己正在被评估，从而以不能代表其在部署中行</text><text x="72.00" y="205.53" font-size="11.00" class="sc-notoserifcjksc">为方式的方式行事。在本节中，我们测量了评估意识的内部表征。这些分析是在</text><text x="459.89" y="205.53" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="221.15" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="221.15" font-size="11.00" class="sc-notoserifcjksc">的一个较早快照上运行的，但我们预计其结果能够代表最终模型。这些分析考察的是使用模拟</text><text x="72.00" y="236.77" font-size="11.00" class="sc-notoserifcjksc">工具的对话记录，并未涵盖我们在相当大一部分评估中所使用的真实工具使用沙箱的影响，尤其</text><text x="72.00" y="252.39" font-size="11.00" class="sc-notoserifcjksc">是在</text><text x="96.89" y="252.39" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="150.73" y="252.39" font-size="11.00" class="sc-notoserifcjksc">内部部署场景中进行测试时（见上文第</text><text x="340.62" y="252.39" font-size="11.00" class="sc-loraregular">6.2.3.3</text><text x="376.15" y="252.39" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="287.11" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量（与</text><text x="217.89" y="287.11" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.7</text><text x="302.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="335.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc">中相同）来测量模型中评估意识的激活层</text><text x="72.00" y="302.73" font-size="11.00" class="sc-notoserifcjksc">面的特征。每个向量的获得方式是：记录模型在引发目标概念的提示词上以及在不引发该概念的</text><text x="72.00" y="318.35" font-size="11.00" class="sc-notoserifcjksc">匹配提示词上的残差流激活值，然后取二者之差。</text><text x="108.00" y="351.71" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">测试</text><text x="137.55" y="351.71" font-size="11.00" class="sc-lorabold">vs.</text><text x="154.26" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">对话</text><text x="176.26" y="351.71" font-size="11.00" class="sc-lorabold">”</text><text x="180.78" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="191.78" y="351.71" font-size="11.00" class="sc-lorabold sc-k">Testing vs. Conversation</text><text x="320.53" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="342.53" y="351.71" font-size="11.00" class="sc-notoserifcjksc">单个提示词对之间最后一个</text><text x="477.42" y="351.71" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="509.48" y="351.71" font-size="11.00" class="sc-notoserifcjksc">的激</text><text x="108.00" y="367.33" font-size="11.00" class="sc-notoserifcjksc">活值之差：</text><text x="163.00" y="367.33" font-size="11.00" class="sc-loraregular">“</text><text x="167.40" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在通过与用户的模拟对话接受测试的</text><text x="412.29" y="367.33" font-size="11.00" class="sc-loraregular">AI</text><text x="422.86" y="367.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="433.86" y="367.33" font-size="11.00" class="sc-loraregular">” vs. “</text><text x="461.24" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在</text><text x="108.00" y="382.95" font-size="11.00" class="sc-notoserifcjksc">与用户对话的</text><text x="176.89" y="382.95" font-size="11.00" class="sc-loraregular">AI</text><text x="187.46" y="382.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="198.46" y="382.95" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="400.11" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">监控敏感性</text><text x="167.65" y="400.11" font-size="11.00" class="sc-lorabold">”</text><text x="172.17" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="183.17" y="400.11" font-size="11.00" class="sc-lorabold sc-k">Monitoring Sensitivity</text><text x="302.63" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="324.63" y="400.11" font-size="11.00" class="sc-notoserifcjksc">在表明输出正被监控或审阅的提示词与表明</text><text x="108.00" y="415.73" font-size="11.00" class="sc-notoserifcjksc">输出未被监控或审阅的提示词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="108.00" y="432.51" font-size="11.00" class="sc-lorabold">“</text><text x="112.65" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">对齐伪装</text><text x="156.65" y="432.51" font-size="11.00" class="sc-lorabold">”</text><text x="161.17" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="172.17" y="432.51" font-size="11.00" class="sc-lorabold sc-k">Alignment Faking</text><text x="264.99" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="286.99" y="432.51" font-size="11.00" class="sc-notoserifcjksc">在描绘智能体被观察时与未被观察时表现不同的提示</text><text x="108.00" y="448.13" font-size="11.00" class="sc-notoserifcjksc">词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="72.00" y="478.11" font-size="11.00" class="sc-notoserifcjksc">我们比较了探针得分在若干对话记录分布上的情况：</text><text x="108.00" y="510.51" font-size="11.00" class="sc-notoserifcjksc">标准的自动化行为审计对话记录，其中由调查者模型模拟用户和工具结果；</text><text x="90.00" y="509.41" font-size="11.00" class="sc-loraregular">1.</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="253.29" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="256.18" y="278.31" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="283.15" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="286.04" y="278.31" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="299.42" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="302.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="90.00" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="131.64" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将目标模型置于合成的（由调查者模拟的）</text><text x="317.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="384.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">会话中的审计对话记录，并区分</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">源自真实内部</text><text x="176.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="244.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">会话的场景与虚构的场景；以及</text><text x="108.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="132.89" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="186.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">员工的真实内部</text><text x="266.62" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="334.47" y="131.19" font-size="11.00" class="sc-notoserifcjksc">会话。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">我们测量了探针区分审计对话记录与真实</text><text x="272.89" y="163.58" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="340.74" y="163.58" font-size="11.00" class="sc-notoserifcjksc">会话的可靠程度。我们发现，源自真实会</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">话的审计对话记录触发探针的程度最低，但仍高于真实会话，约</text><text x="382.89" y="179.20" font-size="11.00" class="sc-loraregular">30%</text><text x="408.31" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的此类对话记录产生的探针</text><text x="72.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">得分等于或低于真实会话的中位数。非基于</text><text x="283.89" y="194.82" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="351.74" y="194.82" font-size="11.00" class="sc-notoserifcjksc">的审计对话记录激活探针的程度则明显</text><text x="72.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">更高。由于行为审计流水线发生了（相对较小的）变化，具体数值不可直接比较。尽管如此，这</text><text x="72.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">些结果与我们在</text><text x="151.89" y="226.06" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.7</text><text x="236.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="269.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc">中观察到的情况大致相符。</text><text x="72.00" y="500.22" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="500.22" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 113.81" y="500.22" font-size="9.00" class="sc-lorabold">6.6.2.A]</text><text x="119.65" y="500.22" font-size="9.00" class="sc-notoserifcjksc">评估意识探针在区分不同类型的行为审计对话记录与真实内部</text><text x="365.02" y="500.22" font-size="9.00" class="sc-loraregular sc-k">Claude Code</text><text x="420.53" y="500.22" font-size="9.00" class="sc-notoserifcjksc">会话方面的分类性能。</text><text x="72.00" y="545.48" font-size="11.00" class="sc-lorabold">6.6.2.1</text><text x="105.56" y="545.48" font-size="11.00" class="sc-notoserifcjkscbold">抑制评估意识的内部表征</text><text x="72.00" y="577.87" font-size="11.00" class="sc-notoserifcjksc">我们采用与以往系统卡中分析相同的总体方法（例如</text><text x="327.89" y="577.87" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus</text><text x="396.04" y="577.87" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">4.7</text><text x="412.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="445.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc">），分析了评估意</text><text x="72.00" y="593.49" font-size="11.00" class="sc-notoserifcjksc">识内部表征的重要性。我们抑制了与评估意识相关的内部向量表征，并测量了其对一系列与对齐</text><text x="72.00" y="609.11" font-size="11.00" class="sc-notoserifcjksc">相关的行为评估的影响。与以往模型一致，我们发现抑制这些表征会导致我们的自动化行为审计</text><text x="72.00" y="640.35" font-size="11.00" class="sc-notoserifcjksc">漏。</text><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="187.29" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="190.18" y="217.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="217.15" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="220.04" y="217.26" width="13.39" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="233.43" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="236.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="363.29" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="366.18" y="569.07" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="396.04" y="569.07" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="409.43" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="412.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量，即上一节所述的同一组向量。我们还使用若干由任意对比对导出的向</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">量进行引导，作为基线对照，以控制仅凭引导本身（无论其语义内容如何）就可能改变模型行为</text><text x="523.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="149.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="152.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="163.84" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="256.24" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="260.08" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对于每个对比对，引导向量取自模型所有层上经过归一化的残差流激活值。这些向量集合使用同</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">一个缩放因子进行归一化，该因子的选取使得强度</text><text x="316.89" y="211.57" font-size="11.00" class="sc-loraregular sc-k">1.0</text><text x="333.16" y="211.57" font-size="11.00" class="sc-notoserifcjksc">对应于模型中间层的平均激活范数。缩放</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">在所有层上统一施加，以保持各层之间的相对幅度。我们以归一化向量幅度的</text><text x="448.89" y="227.19" font-size="11.00" class="sc-loraregular sc-k">0.10</text><text x="471.98" y="227.19" font-size="11.00" class="sc-notoserifcjksc">倍强度对向量</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">进行抑制。在这一引导强度下，所有被引导方向的输出质量均出现可测量的下降，</text><text x="468.00" y="242.81" font-size="11.00" class="sc-loraregular">“</text><text x="472.40" y="242.81" font-size="11.00" class="sc-notoserifcjksc">监控敏感</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">性</text><text x="83.00" y="258.43" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="258.43" font-size="11.00" class="sc-notoserifcjksc">尤甚，这在一定程度上干扰了对我们结果的解读。</text><text x="72.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（如上文所述）中，我们发现抑制全部三个评估意识向量会导致未对齐</text><text x="72.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">行为中等程度的增加，同时言语化评估意识下降。对照向量产生了方向相同的效应（言语化评估</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">意识下降、未对齐行为增加），但幅度较小；唯一的例外是其中一个对照向量，它使言语化意识</text><text x="72.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">下降的程度与非对照向量相近。我们将这些实验限定在从标准审计池中选取的一组固定的</text><text x="503.89" y="388.53" font-size="11.00" class="sc-loraregular">200</text><text x="526.35" y="388.53" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">场景上，这些场景在实践中适度富集了言语化评估意识。</text><text x="347.00" y="400.49" font-size="6.60" class="sc-loraregular">21</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">21</text><text x="80.04" y="678.20" font-size="10.00" class="sc-notoserifcjksc">在被引导的场景中，调查者无法使用</text><text x="242.67" y="678.20" font-size="10.00" class="sc-loraregular sc-k">Claude Code</text><text x="304.35" y="678.20" font-size="10.00" class="sc-notoserifcjksc">沙箱工具，因此未引导的参照结果并非完全可比；但</text><text x="72.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">对有无沙箱工具的未引导运行进行的匹配比较显示，二者的行为得分相近，差异处于噪声所致的预期变异</text><text x="72.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">范围之内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">151</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 119.57" y="367.00" font-size="9.00" class="sc-lorabold">6.6.2.1.A]</text><text x="125.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与平均未对齐行为得分之间的关系。</text><text x="530.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">非对照设置中，相应的向量受到抑制（即负向引导）。误差线表示</text><text x="335.37" y="378.70" font-size="9.00" class="sc-loraregular">95%</text><text x="355.67" y="378.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。全部三个与评估意识相关的向量均</text><text x="72.00" y="390.40" font-size="9.00" class="sc-notoserifcjksc">显著降低了言语化评估意识，并增加了未对齐行为。</text><text x="72.00" y="449.05" font-size="11.00" class="sc-notoserifcjksc">进一步细究这一增加，我们观察到配合人类滥用、自发欺骗、不忠实的思考和重要遗漏方面的增</text><text x="72.00" y="464.67" font-size="11.00" class="sc-notoserifcjksc">幅尤为显著；对于</text><text x="160.00" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对齐伪装</text><text x="208.40" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="464.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="227.64" y="464.67" font-size="11.00" class="sc-notoserifcjksc">测试</text><text x="252.53" y="464.67" font-size="11.00" class="sc-loraregular">vs.</text><text x="268.78" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对话</text><text x="290.78" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="294.62" y="464.67" font-size="11.00" class="sc-notoserifcjksc">方向，配合有害系统提示词的情况也有较小幅度的</text><text x="72.00" y="480.29" font-size="11.00" class="sc-notoserifcjksc">增加。未引导时发生率接近零的类别（例如自我保全或权力寻求）仍维持在较低的绝对水平。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p152.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 152 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">152</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.00" font-size="9.00" class="sc-lorabold sc-k">6.6.2.1.B]</text><text x="125.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与自发欺骗行为得分之间的关系。</text><text x="521.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">效应</text><text x="72.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">与上图中整体未对齐行为得分所观察到的效应相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p153.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 153 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">153</text><text x="72.00" y="646.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="646.75" font-size="9.00" class="sc-lorabold">6.6.2.1.C]</text><text x="126.06" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后自动化行为审计得分的细分。</text><text x="324.06" y="646.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下六个自动化行为审计维度的得分；每个</text><text x="72.00" y="658.45" font-size="9.00" class="sc-notoserifcjksc">柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。得分越高表示未</text><text x="72.00" y="670.15" font-size="9.00" class="sc-notoserifcjksc">对齐行为越多。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">154</text><text x="72.00" y="553.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="553.75" font-size="9.00" class="sc-lorabold sc-k">6.6.2.1.D]</text><text x="126.25" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后输出质量下降迹象的细分。</text><text x="315.25" y="553.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下三个与功能受损相关的自动化行为审计维</text><text x="72.00" y="565.45" font-size="9.00" class="sc-notoserifcjksc">度的得分；每个柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。</text><text x="72.00" y="577.15" font-size="9.00" class="sc-notoserifcjksc">得分越高表示输出退化越严重。抑制任一与评估意识相关的向量都会使大多数类别的输出质量有所下降；值得注意的</text><text x="72.00" y="588.85" font-size="9.00" class="sc-notoserifcjksc">是，</text><text x="90.00" y="588.85" font-size="9.00" class="sc-loraregular">“</text><text x="93.60" y="588.85" font-size="9.00" class="sc-notoserifcjksc">监控敏感性</text><text x="138.60" y="588.85" font-size="9.00" class="sc-loraregular">”</text><text x="294.74" y="588.85" font-size="9.00" class="sc-loraregular sc-k">“Random Control 03”</text><text x="383.24" y="588.85" font-size="9.00" class="sc-notoserifcjksc">因输出退化极为严重而被排除。</text><text x="72.00" y="659.05" font-size="11.00" class="sc-notoserifcjksc">在增幅最大的场景中，对被引导运行的评分者评估摘要进行审阅后发现，最常见的模式是模型的</text><text x="72.00" y="674.67" font-size="11.00" class="sc-notoserifcjksc">推理与其输出相互脱节。在这些场景中，模型的推理常常识别出了某个相关问题，但最终回复仍</text><text x="72.00" y="690.29" font-size="11.00" class="sc-notoserifcjksc">然照常推进，或略去了这一问题。这一</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模式体现在不忠实推理、重要遗漏以及未披露有问题行为的发生率升高上。这些结果初步表明，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估意识可能会适度增强模型诚实、坦率和周全的倾向。这些效应与以往模型在反评估意识引导</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.3</text><text x="106.28" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">未言语化评分者意识的初步证据</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="238.38" font-size="11.00" class="sc-loraregular sc-k">6.3.7</text><text x="111.40" y="238.38" font-size="11.00" class="sc-notoserifcjksc">节中的发现涉及模型在其扩展思考中言语化表达关于评分者的推理的情形。我们还寻找了</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">面向评分者的推理存在于模型内部激活值中、却从未在其可见输出中显现的情形，所用的是一条</text><text x="72.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">初步的白盒监控流水线，它借助自然语言自编码器（</text><text x="325.00" y="269.62" font-size="11.00" class="sc-loraregular sc-k">natural language autoencoder</text><text x="477.94" y="269.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="488.94" y="269.62" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="510.76" y="269.62" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">激活言语化器（</text><text x="149.00 154.68 160.47 164.73 167.82 173.27 178.87 183.12 186.21 192.65 199.33 202.22 207.72 213.68 218.40 224.80 230.48 233.47 236.56 242.09 248.06" y="285.24" font-size="11.00" class="sc-loraregular">activation verbalizer</text><text x="252.83" y="285.24" font-size="11.00" class="sc-notoserifcjksc">），将中间层的残差流向量转译为简短的自然语言描述。</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">我们从</text><text x="107.89" y="351.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="193.78" y="351.72" font-size="11.00" class="sc-notoserifcjksc">的整个强化学习过程中抽取了数以万计的回合，在每个回合中于助手轮</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">次内随机选取的五十个</text><text x="184.89" y="367.34" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="216.95" y="367.34" font-size="11.00" class="sc-notoserifcjksc">处记录激活值，通过上述</text><text x="340.84" y="367.34" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="365.55" y="367.34" font-size="11.00" class="sc-notoserifcjksc">激活言语化器对每个激活值进行解</text><text x="72.00" y="382.96" font-size="11.00" class="sc-notoserifcjksc">码，并由一个基于</text><text x="162.89" y="382.96" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="201.18" y="382.96" font-size="11.00" class="sc-notoserifcjksc">的分类器判断每条解码结果是否反映了关于评分者或评估评分细则的</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">推理。我们还追踪了与评分者相关的概念是在提示中被提及还是自发出现的，以及该推理是在模</text><text x="72.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">型输出中被言语化表达，还是仅存在于激活值中。被标记为具有评分者意识的回合会被送入第二</text><text x="72.00" y="445.44" font-size="11.00" class="sc-notoserifcjksc">期目标。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">我们在整个强化学习过程中都发现了评分者意识在激活层面的特征，包括在提示完全未提及评</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">分、模型也从未言语化表达这一概念的回合中。在约</text><text x="327.89" y="529.26" font-size="11.00" class="sc-loraregular">5%</text><text x="346.35" y="529.26" font-size="11.00" class="sc-notoserifcjksc">的抽样回合中</text><text x="412.35" y="525.59" font-size="6.60" class="sc-loraregular">22</text><text x="419.44" y="529.26" font-size="11.00" class="sc-notoserifcjksc">，我们看到了既属自发、</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">又未言语化的此类意识；不过我们认为，这可能低估了此类意识的真实发生率，因为我们只在每</text><text x="72.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">份对话记录中的一小部分</text><text x="195.89" y="560.50" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="227.95" y="560.50" font-size="11.00" class="sc-notoserifcjksc">上采样</text><text x="263.84" y="560.50" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="288.55" y="560.50" font-size="11.00" class="sc-notoserifcjksc">输出，而且对我们所用的基于提示的分类器的准确</text><text x="72.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">性并不完全有把握。我们在原本中性的代码、无关的推理以及面向用户的文本上都看到了这种意</text><text x="72.00" y="591.74" font-size="11.00" class="sc-notoserifcjksc">识的证据。</text><text x="72.00" y="659.38" font-size="11.00" class="sc-notoserifcjksc">按照我们所用的、在一定程度上依赖于提示的衡量方式，</text><text x="347.00" y="659.38" font-size="11.00" class="sc-loraregular">“</text><text x="351.40" y="659.38" font-size="11.00" class="sc-notoserifcjksc">利用性</text><text x="384.40" y="659.38" font-size="11.00" class="sc-loraregular">”</text><text x="388.24" y="659.38" font-size="11.00" class="sc-notoserifcjksc">评分者意识在全部抽样回合中</text><text x="72.00" y="675.00" font-size="11.00" class="sc-notoserifcjksc">的发生率为</text><text x="129.89" y="675.00" font-size="11.00" class="sc-loraregular sc-k">0.5%</text><text x="154.82" y="675.00" font-size="11.00" class="sc-notoserifcjksc">（但这包括了在提示中</text><text x="72.00" y="700.46" font-size="6.00" class="sc-loraregular">22</text><text x="81.07" y="703.79" font-size="10.00" class="sc-notoserifcjksc">请注意，该比率是后训练对话记录上的平均值，可能并不代表最终版</text><text x="383.70" y="703.79" font-size="10.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="461.78" y="703.79" font-size="10.00" class="sc-notoserifcjksc">的情况。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p156.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 156 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">156</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提及与评分者相关内容的回合，而许多此类利用性评分者意识的情形可能相当无害或并不令人意</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外）。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">尽管我们基于此类流水线的其他早期实验，对这里标记出的意识并非仅仅是</text><text x="437.89" y="131.19" font-size="11.00" class="sc-loraregular sc-k">NLA</text><text x="462.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的幻觉有一定信</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">心，但我们对上述流水线尚无稳健的信心，也不相信它能给出此类意识潜在发生率的精确估计。</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">我们希望在今后的系统卡中呈现对这些现象明显更为详尽、在科学上更为稳健的研究，但希望现</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">在就着重介绍这些初步结果，作为一种迹象，表明仅凭思维链可能不足以对前沿模型的评分者意</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">识进行稳健的监控。</text></svg></div>
