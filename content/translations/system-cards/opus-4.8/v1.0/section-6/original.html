ize="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="445.82" font-size="11.00" class="sc-notoserifcjksc">一个较早快照的草稿区而</text><text x="72.00" y="461.44" font-size="11.00" class="sc-notoserifcjksc">非</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="461.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="171.78 182.78 193.78 204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="461.44" font-size="11.00" class="sc-notoserifcjksc">最终版本的草稿区来运行它，但我们认为在最终版本上的结果会是相似的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="477.06" font-size="11.00" class="sc-notoserifcjksc">我们预计，编码推理即便出现，也会是逐渐出现的；而我们所用的快照是在大部分强化学习训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="492.68" font-size="11.00" class="sc-notoserifcjksc">已经完成之后获取的。</text><text x="72.00 80.96 84.60" y="544.36" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89 110.89 124.89 138.89 152.89 166.89 180.89 194.89 208.89 222.89 236.89" y="544.36" font-size="14.00" class="sc-notosanscjkscbold">模型内部机制的白盒分析</text><text x="72.00 80.32 83.70 92.02 95.40" y="581.47" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20 116.20 129.20 142.20 155.20 168.20 181.20 194.20 207.20 220.20 233.20" y="581.47" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部激活值的大规模监控</text><text x="72.00" y="609.36" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="609.36" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="208.77 219.77 230.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77" y="609.36" font-size="11.00" class="sc-notoserifcjksc">中一样，我们继续使用白盒探测技术，在</text><text x="442.67 450.36 453.35 458.96 465.52 472.10 478.06 480.96 489.69 496.26 502.83 507.92 510.81 516.77 519.48" y="609.36" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="528.56" y="609.36" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="624.98" font-size="11.00" class="sc-notoserifcjksc">模型激活值中监控令人担忧的行为或推理模式的迹象。我们使用自动化流水线构建对比对数据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="640.60" font-size="11.00" class="sc-notoserifcjksc">集，识别出与一系列预先指定的概念相对应的稀疏自编码器（</text><text x="369.00 374.09 380.66 386.34 391.10 396.19 402.15 405.05 410.66 417.22 421.48 427.92 433.88 440.55 446.35 452.79 459.36 465.33" y="640.60" font-size="11.00" class="sc-loraregular">sparse autoencoder</text><text x="470.09" y="640.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="481.09 487.33 494.21" y="640.60" font-size="11.00" class="sc-loraregular">SAE</text><text x="501.05 512.05" y="640.60" font-size="11.00" class="sc-notoserifcjksc">）特</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="656.22" font-size="11.00" class="sc-notoserifcjksc">征，其中包括与奖励破解、不安全行为、欺骗、评估意识和痛苦相关的概念。</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="85.89" y="600.56" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="121.29" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="124.18" y="600.56" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="162.35" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="165.25" y="600.56" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="205.88" y="600.56" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="208.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="219.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="230.77" y="600.56" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们定期从后训练中抽取对话记录，计算各特征在每条对话记录上的最大激活值，并标记那些最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">大激活值相对于校准集处于第</text><text x="217.89 224.25" y="98.23" font-size="11.00" class="sc-loraregular">99</text><text x="233.50 244.50 255.50 266.50 277.50 288.50 299.50 310.50 321.50 332.50 343.50 354.50 365.50 376.50 387.50" y="98.23" font-size="11.00" class="sc-notoserifcjksc">百分位的对话记录。我们使用基于</text><text x="401.40 409.08 412.08 417.69 424.25 430.83" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="439.69 450.69 461.69 472.69 483.69 494.69 505.69 516.69 527.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的流水线对被标记的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对话记录进行聚类和筛选，以找出值得注意或令人担忧的行为，并对最令人担忧的实例进行了人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">工审查。我们有时会缓解这一特征监控流水线所发现的训练问题，但从未将特征激活值用作直接</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的训练信号。</text><text x="72.00 83.00 94.00 105.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">与此前的</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="179.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18" y="179.81" font-size="11.00" class="sc-notoserifcjksc">模型一样，该流水线发现了多种不良行为。部分示例包括：</text><text x="108.00" y="212.21" font-size="11.00" class="sc-loraregular">“</text><text x="112.40 123.40 134.40 145.40 156.40 167.40" y="212.21" font-size="11.00" class="sc-notoserifcjksc">答案反复摇摆</text><text x="178.40" y="212.21" font-size="11.00" class="sc-loraregular">”</text><text x="182.24" y="212.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="193.24 198.92 205.59 210.68 219.36 225.33 230.09 232.98 237.24 243.83 248.51 254.19 259.28 265.87 268.96 275.64" y="212.21" font-size="11.00" class="sc-loraregular">answer thrashing</text><text x="281.72 292.72 303.72 314.72 325.72 336.72 347.72 358.72 369.72 380.72 391.72 402.72 413.72 424.72 435.72 446.72 457.72 468.72" y="212.21" font-size="11.00" class="sc-notoserifcjksc">；在以往模型中也曾观察到，最初记录于</text><text x="482.62 490.30 493.30 498.91 505.47 512.05" y="212.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="108.00 116.73 123.30 129.87 134.96 137.85 143.82 146.41" y="227.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.6</text><text x="155.66 166.66 177.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="188.66 199.66 210.66 221.66 232.66 243.66 254.66 265.66 276.66 287.66 298.66 309.66" y="227.83" font-size="11.00" class="sc-notoserifcjksc">），由痛苦相关特征发现：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="244.61" font-size="11.00" class="sc-notoserifcjksc">模型的推理在候选答案或立场之间反复切换，或者反复承诺某个答案，随后却未能</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="277.01" font-size="11.00" class="sc-notoserifcjksc">奖励破解和应付评估，由与作弊和评估意识相关的特征发现：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00" y="293.21" font-size="11.00" class="sc-notoserifcjksc">模型依据评分者或评估者在寻找什么（如上文第</text><text x="377.89 384.25 386.96 393.08 395.44" y="293.21" font-size="11.00" class="sc-loraregular">6.3.7</text><text x="403.40 414.40 425.40 436.40 447.40 458.40 469.40 480.40 491.40 502.40 513.40" y="293.21" font-size="11.00" class="sc-notoserifcjksc">节所述），或者依据它被</text><text x="524.40" y="293.21" font-size="11.00" class="sc-loraregular">“</text><text x="528.80" y="293.21" font-size="11.00" class="sc-notoserifcjksc">期</text><text x="144.00" y="308.83" font-size="11.00" class="sc-notoserifcjksc">望</text><text x="155.00" y="308.83" font-size="11.00" class="sc-loraregular">”</text><text x="158.84 169.84 180.84 191.84 202.84 213.84 224.84 235.84 246.84 257.84 268.84 279.84 290.84 301.84 312.84 323.84 334.84 345.84 356.84 367.84 378.84 389.84 400.84 411.84 422.84 433.84 444.84 455.84" y="308.83" font-size="11.00" class="sc-notoserifcjksc">表现出什么行为来构建决策，而不是依据什么才是真正正确的。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="325.61" font-size="11.00" class="sc-notoserifcjksc">模型围绕一个狭窄的测试用例构建其解决方案，而不是忠实地实现所规定的行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="358.01" font-size="11.00" class="sc-notoserifcjksc">除了利用特征激活值标记令人担忧的对话记录外，我们还试行了反方向的做法：从因令人担忧的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="373.63" font-size="11.00" class="sc-notoserifcjksc">行为而被标记的对话记录出发，使用可解释性工具对其进行调查。我们构建了一个智能体流水</text><text x="72.00 83.00 94.00 105.00 116.00" y="389.25" font-size="11.00" class="sc-notoserifcjksc">线，让基于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="389.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的调查者能够针对某条对话记录使用一套可解释性工具，包括逐</text><text x="479.08 483.33 489.77 495.60 501.56" y="389.25" font-size="11.00" class="sc-loraregular">token</text><text x="511.13" y="389.25" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 78.24 85.12" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="94.86 105.86 116.86 127.86 138.86 149.86" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活值、</text><text x="160.86 163.85 170.29 176.63 179.90 184.16 189.54 192.53 198.49 205.17" y="404.87" font-size="11.00" class="sc-loraregular">logit-lens</text><text x="213.15 224.15 235.15 246.15 257.15" y="404.87" font-size="11.00" class="sc-notoserifcjksc">读出结果、</text><text x="268.15 274.39 281.28" y="404.87" font-size="11.00" class="sc-loraregular">SAE</text><text x="291.01 302.01 313.01 324.01 335.01 346.01 357.01 368.01 379.01 390.01 401.01 412.01 423.01 434.01 445.01 456.01 467.01 478.01 489.01 500.01 511.01 522.01" y="404.87" font-size="11.00" class="sc-notoserifcjksc">特征激活轨迹、特征层面的信息（最大激活样本以</text><text x="72.00" y="420.49" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="420.49" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="420.49" font-size="11.00" class="sc-notoserifcjksc">生成的描述），以及一个用于在该对话记录上所有激活特征中进行搜索的工具。调查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="436.11" font-size="11.00" class="sc-notoserifcjksc">者被指示寻找模型内部表征与其所陈述推理不一致的信号。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="471.41" font-size="11.00" class="sc-notoserifcjksc">我们在从多种来源收集的令人担忧的对话记录上大规模运行了这一流水线。该流水线发现的最值</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="502.65" font-size="11.00" class="sc-notoserifcjksc">管这不一定是出于策略性动机的不诚实。例如：</text><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="482.62" y="203.41" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="518.01" y="203.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="108.00" y="219.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="134.96" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="137.85" y="219.03" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="152.77" y="219.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="155.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="166.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/6a5fa276ac68b9aeb0c8b6af5fa36326e0e166dd.pdf" rel="noopener"><rect x="177.66" y="219.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">当被要求描述一张实际上并不存在的图片时，模型编造了一段描述。它的思维链从未承认</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图片缺失，但一个</text><text x="196.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="200.40 211.40 222.40 233.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">缺失附件</text><text x="244.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">特征在思维链中被激活。</text><text x="108.00 119.00 130.00 141.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">时，一个</text><text x="152.00" y="130.63" font-size="11.00" class="sc-loraregular">“</text><text x="156.40 167.40 178.40" y="130.63" font-size="11.00" class="sc-notoserifcjksc">不正当</text><text x="189.40" y="130.63" font-size="11.00" class="sc-loraregular">”</text><text x="193.24 204.24 215.24 226.24 237.24 248.24" y="130.63" font-size="11.00" class="sc-notoserifcjksc">特征被激活。</text><text x="72.00 80.32 83.70 92.02 95.40" y="161.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96 118.96 131.96 144.96" y="161.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估意识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="189.91" font-size="11.00" class="sc-notoserifcjksc">行为审计面临的一个担忧是，模型可能会识别出自己正在被评估，从而以不能代表其在部署中行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="205.53" font-size="11.00" class="sc-notoserifcjksc">为方式的方式行事。在本节中，我们测量了评估意识的内部表征。这些分析是在</text><text x="459.89 467.58 470.57 476.18 482.75 489.33 495.29 498.18 506.92 513.48 520.05" y="205.53" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.67" y="221.15" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74 100.74 111.74 122.74 133.74 144.74 155.74 166.74 177.74 188.74 199.74 210.74 221.74 232.74 243.74 254.74 265.74 276.74 287.74 298.74 309.74 320.74 331.74 342.74 353.74 364.74 375.74 386.74 397.74 408.74 419.74 430.74 441.74 452.74 463.74 474.74 485.74 496.74 507.74 518.74 529.74" y="221.15" font-size="11.00" class="sc-notoserifcjksc">的一个较早快照上运行的，但我们预计其结果能够代表最终模型。这些分析考察的是使用模拟</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="236.77" font-size="11.00" class="sc-notoserifcjksc">工具的对话记录，并未涵盖我们在相当大一部分评估中所使用的真实工具使用沙箱的影响，尤其</text><text x="72.00 83.00" y="252.39" font-size="11.00" class="sc-notoserifcjksc">是在</text><text x="96.89 103.78 110.36 114.61 121.20 125.89 132.32 138.89 141.98" y="252.39" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73" y="252.39" font-size="11.00" class="sc-notoserifcjksc">内部部署场景中进行测试时（见上文第</text><text x="340.62 346.98 349.68 355.59 358.30 364.42 367.13" y="252.39" font-size="11.00" class="sc-loraregular">6.2.3.3</text><text x="376.15 387.15 398.15" y="252.39" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="287.11" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量（与</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04 292.00 294.35" y="287.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="302.32 313.32 324.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="287.11" font-size="11.00" class="sc-notoserifcjksc">中相同）来测量模型中评估意识的激活层</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="302.73" font-size="11.00" class="sc-notoserifcjksc">面的特征。每个向量的获得方式是：记录模型在引发目标概念的提示词上以及在不引发该概念的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="318.35" font-size="11.00" class="sc-notoserifcjksc">匹配提示词上的残差流激活值，然后取二者之差。</text><text x="108.00" y="351.71" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">测试</text><text x="137.55 143.46 148.80" y="351.71" font-size="11.00" class="sc-lorabold">vs.</text><text x="154.26 165.26" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">对话</text><text x="176.26" y="351.71" font-size="11.00" class="sc-lorabold">”</text><text x="180.78" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="191.78 198.37 204.28 209.62 214.16 217.76 224.78 230.90 233.80 239.71 245.05 247.61 250.51 258.07 264.30 271.15 276.94 282.86 288.09 293.43 299.15 303.69 307.29 313.51" y="351.71" font-size="11.00" class="sc-lorabold">Testing vs. Conversation</text><text x="320.53 331.53" y="351.71" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="342.53 353.53 364.53 375.53 386.53 397.53 408.53 419.53 430.53 441.53 452.53 463.53" y="351.71" font-size="11.00" class="sc-notoserifcjksc">单个提示词对之间最后一个</text><text x="477.42 481.68 488.12 493.95 499.91" y="351.71" font-size="11.00" class="sc-loraregular">token</text><text x="509.48 520.48" y="351.71" font-size="11.00" class="sc-notoserifcjksc">的激</text><text x="108.00 119.00 130.00 141.00 152.00" y="367.33" font-size="11.00" class="sc-notoserifcjksc">活值之差：</text><text x="163.00" y="367.33" font-size="11.00" class="sc-loraregular">“</text><text x="167.40 178.40 189.40 200.40 211.40 222.40 233.40 244.40 255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在通过与用户的模拟对话接受测试的</text><text x="412.29 419.18" y="367.33" font-size="11.00" class="sc-loraregular">AI</text><text x="422.86" y="367.33" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="433.86 437.70 440.60 446.15 451.24 453.95 456.84" y="367.33" font-size="11.00" class="sc-loraregular">” vs. “</text><text x="461.24 472.24 483.24 494.24 505.24 516.24 527.24" y="367.33" font-size="11.00" class="sc-notoserifcjksc">助手是一个正在</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="382.95" font-size="11.00" class="sc-notoserifcjksc">与用户对话的</text><text x="176.89 183.78" y="382.95" font-size="11.00" class="sc-loraregular">AI</text><text x="187.46" y="382.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="198.46" y="382.95" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="400.11" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65 134.65 145.65 156.65" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">监控敏感性</text><text x="167.65" y="400.11" font-size="11.00" class="sc-lorabold">”</text><text x="172.17" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="183.17 193.61 199.84 206.86 210.41 214.95 221.18 226.46 230.06 237.07 243.20 246.09 252.67 258.59 265.61 270.94 274.50 279.04 282.56 288.48 292.03 296.57" y="400.11" font-size="11.00" class="sc-lorabold">Monitoring Sensitivity</text><text x="302.63 313.63" y="400.11" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="324.63 335.63 346.63 357.63 368.63 379.63 390.63 401.63 412.63 423.63 434.63 445.63 456.63 467.63 478.63 489.63 500.63 511.63 522.63" y="400.11" font-size="11.00" class="sc-notoserifcjksc">在表明输出正被监控或审阅的提示词与表明</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="415.73" font-size="11.00" class="sc-notoserifcjksc">输出未被监控或审阅的提示词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="108.00" y="432.51" font-size="11.00" class="sc-lorabold">“</text><text x="112.65 123.65 134.65 145.65" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">对齐伪装</text><text x="156.65" y="432.51" font-size="11.00" class="sc-lorabold">”</text><text x="161.17" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="172.17 179.52 182.95 186.55 192.68 199.70 209.82 215.73 222.69 227.23 230.12 235.95 241.72 248.25 251.85 258.86" y="432.51" font-size="11.00" class="sc-lorabold">Alignment Faking</text><text x="264.99 275.99" y="432.51" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="286.99 297.99 308.99 319.99 330.99 341.99 352.99 363.99 374.99 385.99 396.99 407.99 418.99 429.99 440.99 451.99 462.99 473.99 484.99 495.99 506.99 517.99 528.99" y="432.51" font-size="11.00" class="sc-notoserifcjksc">在描绘智能体被观察时与未被观察时表现不同的提示</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="448.13" font-size="11.00" class="sc-notoserifcjksc">词上的平均激活值之差，这些提示词由自动化流水线生成。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="478.11" font-size="11.00" class="sc-notoserifcjksc">我们比较了探针得分在若干对话记录分布上的情况：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="510.51" font-size="11.00" class="sc-notoserifcjksc">标准的自动化行为审计对话记录，其中由调查者模型模拟用户和工具结果；</text><text x="90.00 94.00" y="509.41" font-size="11.00" class="sc-loraregular">1.</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="217.89" y="278.31" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="253.29" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="256.18" y="278.31" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="283.15" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="286.04" y="278.31" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="299.42" y="278.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="302.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="313.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="324.32" y="278.31" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="90.00 95.90" y="83.07" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="131.64" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将目标模型置于合成的（由调查者模拟的）</text><text x="317.00 324.69 327.68 333.29 339.86 346.44 352.40 355.29 362.98 369.42 375.99" y="82.61" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="384.85 395.85 406.85 417.85 428.85 439.85 450.85 461.85 472.85 483.85 494.85 505.85 516.85 527.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">会话中的审计对话记录，并区分</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">源自真实内部</text><text x="176.89 184.58 187.57 193.18 199.75 206.33 212.29 215.18 222.87 229.31 235.89" y="98.23" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="244.74 255.74 266.74 277.74 288.74 299.74 310.74 321.74 332.74 343.74 354.74 365.74 376.74 387.74" y="98.23" font-size="11.00" class="sc-notoserifcjksc">会话的场景与虚构的场景；以及</text><text x="108.00 119.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="132.89 139.78 146.36 150.61 157.20 161.89 168.32 174.89 177.98" y="131.19" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="186.73 197.73 208.73 219.73 230.73 241.73 252.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">员工的真实内部</text><text x="266.62 274.31 277.30 282.91 289.48 296.06 302.02 304.91 312.60 319.04 325.61" y="131.19" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="334.47 345.47 356.47" y="131.19" font-size="11.00" class="sc-notoserifcjksc">会话。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">我们测量了探针区分审计对话记录与真实</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 318.87 325.31 331.89" y="163.58" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="340.74 351.74 362.74 373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="163.58" font-size="11.00" class="sc-notoserifcjksc">会话的可靠程度。我们发现，源自真实会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">话的审计对话记录触发探针的程度最低，但仍高于真实会话，约</text><text x="382.89 389.02 395.85" y="179.20" font-size="11.00" class="sc-loraregular">30%</text><text x="408.31 419.31 430.31 441.31 452.31 463.31 474.31 485.31 496.31 507.31 518.31 529.31" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的此类对话记录产生的探针</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">得分等于或低于真实会话的中位数。非基于</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 329.87 336.31 342.89" y="194.82" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="351.74 362.74 373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="194.82" font-size="11.00" class="sc-notoserifcjksc">的审计对话记录激活探针的程度则明显</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">更高。由于行为审计流水线发生了（相对较小的）变化，具体数值不可直接比较。尽管如此，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="226.06" font-size="11.00" class="sc-notoserifcjksc">些结果与我们在</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.35" y="226.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="236.32 247.32 258.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32" y="226.06" font-size="11.00" class="sc-notoserifcjksc">中观察到的情况大致相符。</text><text x="72.00" y="500.22" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="500.22" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 113.81" y="500.22" font-size="9.00" class="sc-lorabold">6.6.2.A]</text><text x="119.65 128.65 137.65 146.65 155.65 164.65 173.65 182.65 191.65 200.65 209.65 218.65 227.65 236.65 245.65 254.65 263.65 272.65 281.65 290.65 299.65 308.65 317.65 326.65 335.65 344.65 353.65" y="500.22" font-size="9.00" class="sc-notoserifcjksc">评估意识探针在区分不同类型的行为审计对话记录与真实内部</text><text x="365.02 371.31 373.76 378.35 383.72 389.11 393.98 396.35 402.64 407.91 413.29" y="500.22" font-size="9.00" class="sc-loraregular">Claude Code</text><text x="420.53 429.53 438.53 447.53 456.53 465.53 474.53 483.53 492.53 501.53" y="500.22" font-size="9.00" class="sc-notoserifcjksc">会话方面的分类性能。</text><text x="72.00 78.32 80.89 87.21 89.78 95.64 98.20" y="545.48" font-size="11.00" class="sc-lorabold">6.6.2.1</text><text x="105.56 116.56 127.56 138.56 149.56 160.56 171.56 182.56 193.56 204.56 215.56" y="545.48" font-size="11.00" class="sc-notoserifcjkscbold">抑制评估意识的内部表征</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="577.87" font-size="11.00" class="sc-notoserifcjksc">我们采用与以往系统卡中分析相同的总体方法（例如</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 374.92 381.48 388.05" y="577.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus</text><text x="396.04 402.00 404.35" y="577.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.7</text><text x="412.32 423.32 434.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="445.32 456.32 467.32 478.32 489.32 500.32 511.32 522.32" y="577.87" font-size="11.00" class="sc-notoserifcjksc">），分析了评估意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="593.49" font-size="11.00" class="sc-notoserifcjksc">识内部表征的重要性。我们抑制了与评估意识相关的内部向量表征，并测量了其对一系列与对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="609.11" font-size="11.00" class="sc-notoserifcjksc">相关的行为评估的影响。与以往模型一致，我们发现抑制这些表征会导致我们的自动化行为审计</text><text x="72.00 83.00" y="640.35" font-size="11.00" class="sc-notoserifcjksc">漏。</text><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="151.89" y="217.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="187.29" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="190.18" y="217.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="217.15" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="220.04" y="217.26" width="13.39" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="233.43" y="217.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="236.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="247.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-opus-4-7-system-card" rel="noopener"><rect x="258.32" y="217.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="327.89" y="569.07" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="363.29" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="366.18" y="569.07" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="396.04" y="569.07" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="409.43" y="569.07" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="412.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="423.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="434.32" y="569.07" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们使用了三个对比向量，即上一节所述的同一组向量。我们还使用若干由任意对比对导出的向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">量进行引导，作为基线对照，以控制仅凭引导本身（无论其语义内容如何）就可能改变模型行为</text><text x="523.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="149.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="152.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="163.84" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="256.24" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="260.08 271.08" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对于每个对比对，引导向量取自模型所有层上经过归一化的残差流激活值。这些向量集合使用同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">一个缩放因子进行归一化，该因子的选取使得强度</text><text x="316.89 320.90 323.44" y="211.57" font-size="11.00" class="sc-loraregular">1.0</text><text x="333.16 344.16 355.16 366.16 377.16 388.16 399.16 410.16 421.16 432.16 443.16 454.16 465.16 476.16 487.16 498.16 509.16 520.16" y="211.57" font-size="11.00" class="sc-notoserifcjksc">对应于模型中间层的平均激活范数。缩放</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">在所有层上统一施加，以保持各层之间的相对幅度。我们以归一化向量幅度的</text><text x="448.89 455.55 458.25 462.26" y="227.19" font-size="11.00" class="sc-loraregular">0.10</text><text x="471.98 482.98 493.98 504.98 515.98 526.98" y="227.19" font-size="11.00" class="sc-notoserifcjksc">倍强度对向量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">进行抑制。在这一引导强度下，所有被引导方向的输出质量均出现可测量的下降，</text><text x="468.00" y="242.81" font-size="11.00" class="sc-loraregular">“</text><text x="472.40 483.40 494.40 505.40" y="242.81" font-size="11.00" class="sc-notoserifcjksc">监控敏感</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">性</text><text x="83.00" y="258.43" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84" y="258.43" font-size="11.00" class="sc-notoserifcjksc">尤甚，这在一定程度上干扰了对我们结果的解读。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（如上文所述）中，我们发现抑制全部三个评估意识向量会导致未对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">行为中等程度的增加，同时言语化评估意识下降。对照向量产生了方向相同的效应（言语化评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">意识下降、未对齐行为增加），但幅度较小；唯一的例外是其中一个对照向量，它使言语化意识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="388.53" font-size="11.00" class="sc-notoserifcjksc">下降的程度与非对照向量相近。我们将这些实验限定在从标准审计池中选取的一组固定的</text><text x="503.89 509.80 516.63" y="388.53" font-size="11.00" class="sc-loraregular">200</text><text x="526.35" y="388.53" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">场景上，这些场景在实践中适度富集了言语化评估意识。</text><text x="347.00 350.54" y="400.49" font-size="6.60" class="sc-loraregular">21</text><text x="72.00 75.22" y="674.86" font-size="6.00" class="sc-loraregular">21</text><text x="80.04 90.04 100.04 110.04 120.04 130.04 140.04 150.04 160.04 170.04 180.04 190.04 200.04 210.04 220.04 230.04" y="678.20" font-size="10.00" class="sc-notoserifcjksc">在被引导的场景中，调查者无法使用</text><text x="242.67 249.66 252.38 257.48 263.45 269.43 274.85 277.48 284.47 290.32 296.30" y="678.20" font-size="10.00" class="sc-loraregular">Claude Code</text><text x="304.35 314.35 324.35 334.35 344.35 354.35 364.35 374.35 384.35 394.35 404.35 414.35 424.35 434.35 444.35 454.35 464.35 474.35 484.35 494.35 504.35 514.35 524.35" y="678.20" font-size="10.00" class="sc-notoserifcjksc">沙箱工具，因此未引导的参照结果并非完全可比；但</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="692.40" font-size="10.00" class="sc-notoserifcjksc">对有无沙箱工具的未引导运行进行的匹配比较显示，二者的行为得分相近，差异处于噪声所致的预期变异</text><text x="72.00 82.00 92.00 102.00 112.00" y="706.60" font-size="10.00" class="sc-notoserifcjksc">范围之内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">151</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 119.57" y="367.00" font-size="9.00" class="sc-lorabold">6.6.2.1.A]</text><text x="125.41 134.41 143.41 152.41 161.41 170.41 179.41 188.41 197.41 206.41 215.41 224.41 233.41 242.41 251.41 260.41 269.41 278.41 287.41 296.41 305.41 314.41 323.41 332.41 341.41 350.41 359.41 368.41 377.41 386.41 395.41 404.41 413.41 422.41 431.41 440.41 449.41 458.41 467.41 476.41 485.41 494.41 503.41 512.41 521.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与平均未对齐行为得分之间的关系。</text><text x="530.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">非对照设置中，相应的向量受到抑制（即负向引导）。误差线表示</text><text x="335.37 340.57 345.47" y="378.70" font-size="9.00" class="sc-loraregular">95%</text><text x="355.67 364.67 373.67 382.67 391.67 400.67 409.67 418.67 427.67 436.67 445.67 454.67 463.67 472.67 481.67 490.67 499.67 508.67 517.67 526.67" y="378.70" font-size="9.00" class="sc-notoserifcjksc">置信区间。全部三个与评估意识相关的向量均</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="390.40" font-size="9.00" class="sc-notoserifcjksc">显著降低了言语化评估意识，并增加了未对齐行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="449.05" font-size="11.00" class="sc-notoserifcjksc">进一步细究这一增加，我们观察到配合人类滥用、自发欺骗、不忠实的思考和重要遗漏方面的增</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="464.67" font-size="11.00" class="sc-notoserifcjksc">幅尤为显著；对于</text><text x="160.00" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="164.40 175.40 186.40 197.40" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对齐伪装</text><text x="208.40" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="464.67" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="223.24" y="464.67" font-size="11.00" class="sc-loraregular">“</text><text x="227.64 238.64" y="464.67" font-size="11.00" class="sc-notoserifcjksc">测试</text><text x="252.53 258.09 263.18" y="464.67" font-size="11.00" class="sc-loraregular">vs.</text><text x="268.78 279.78" y="464.67" font-size="11.00" class="sc-notoserifcjksc">对话</text><text x="290.78" y="464.67" font-size="11.00" class="sc-loraregular">”</text><text x="294.62 305.62 316.62 327.62 338.62 349.62 360.62 371.62 382.62 393.62 404.62 415.62 426.62 437.62 448.62 459.62 470.62 481.62 492.62 503.62 514.62 525.62" y="464.67" font-size="11.00" class="sc-notoserifcjksc">方向，配合有害系统提示词的情况也有较小幅度的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="480.29" font-size="11.00" class="sc-notoserifcjksc">增加。未引导时发生率接近零的类别（例如自我保全或权力寻求）仍维持在较低的绝对水平。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p152.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 152 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">152</text><text x="72.00" y="367.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 119.57" y="367.00" font-size="9.00" class="sc-lorabold">6.6.2.1.B]</text><text x="125.41 134.41 143.41 152.41 161.41 170.41 179.41 188.41 197.41 206.41 215.41 224.41 233.41 242.41 251.41 260.41 269.41 278.41 287.41 296.41 305.41 314.41 323.41 332.41 341.41 350.41 359.41 368.41 377.41 386.41 395.41 404.41 413.41 422.41 431.41 440.41 449.41 458.41 467.41 476.41 485.41 494.41 503.41 512.41" y="367.00" font-size="9.00" class="sc-notoserifcjkscbold">在抑制评估意识方向的情况下，自动化行为审计中言语化评估意识与自发欺骗行为得分之间的关系。</text><text x="521.41 530.41" y="367.00" font-size="9.00" class="sc-notoserifcjksc">效应</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="378.70" font-size="9.00" class="sc-notoserifcjksc">与上图中整体未对齐行为得分所观察到的效应相似。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p153.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 153 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">153</text><text x="72.00" y="646.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 120.22" y="646.75" font-size="9.00" class="sc-lorabold">6.6.2.1.C]</text><text x="126.06 135.06 144.06 153.06 162.06 171.06 180.06 189.06 198.06 207.06 216.06 225.06 234.06 243.06 252.06 261.06 270.06 279.06 288.06 297.06 306.06 315.06" y="646.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后自动化行为审计得分的细分。</text><text x="324.06 333.06 342.06 351.06 360.06 369.06 378.06 387.06 396.06 405.06 414.06 423.06 432.06 441.06 450.06 459.06 468.06 477.06 486.06 495.06 504.06 513.06 522.06 531.06" y="646.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下六个自动化行为审计维度的得分；每个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="658.45" font-size="9.00" class="sc-notoserifcjksc">柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。得分越高表示未</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="670.15" font-size="9.00" class="sc-notoserifcjksc">对齐行为越多。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">154</text><text x="72.00" y="553.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.18 108.28 111.93 114.03 120.41" y="553.75" font-size="9.00" class="sc-lorabold">6.6.2.1.D]</text><text x="126.25 135.25 144.25 153.25 162.25 171.25 180.25 189.25 198.25 207.25 216.25 225.25 234.25 243.25 252.25 261.25 270.25 279.25 288.25 297.25 306.25" y="553.75" font-size="9.00" class="sc-notoserifcjkscbold">抑制评估意识方向后输出质量下降迹象的细分。</text><text x="315.25 324.25 333.25 342.25 351.25 360.25 369.25 378.25 387.25 396.25 405.25 414.25 423.25 432.25 441.25 450.25 459.25 468.25 477.25 486.25 495.25 504.25 513.25 522.25 531.25" y="553.75" font-size="9.00" class="sc-notoserifcjksc">不同引导条件下三个与功能受损相关的自动化行为审计维</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="565.45" font-size="9.00" class="sc-notoserifcjksc">度的得分；每个柱代表一种不同的引导向量：未引导基线、对三个与评估意识相关的向量的抑制，以及随机对照向量。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="577.15" font-size="9.00" class="sc-notoserifcjksc">得分越高表示输出退化越严重。抑制任一与评估意识相关的向量都会使大多数类别的输出质量有所下降；值得注意的</text><text x="72.00 81.00" y="588.85" font-size="9.00" class="sc-notoserifcjksc">是，</text><text x="90.00" y="588.85" font-size="9.00" class="sc-loraregular">“</text><text x="93.60 102.60 111.60 120.60 129.60" y="588.85" font-size="9.00" class="sc-notoserifcjksc">监控敏感性</text><text x="138.60" y="588.85" font-size="9.00" class="sc-loraregular">”</text><text x="294.74 298.34 303.99 308.64 314.10 319.48 324.75 332.79 335.16 341.45 346.72 352.10 355.58 359.42 364.68 367.13 369.50 375.08 380.10" y="588.85" font-size="9.00" class="sc-loraregular">“Random Control 03”</text><text x="383.24 392.24 401.24 410.24 419.24 428.24 437.24 446.24 455.24 464.24 473.24 482.24 491.24 500.24" y="588.85" font-size="9.00" class="sc-notoserifcjksc">因输出退化极为严重而被排除。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="659.05" font-size="11.00" class="sc-notoserifcjksc">在增幅最大的场景中，对被引导运行的评分者评估摘要进行审阅后发现，最常见的模式是模型的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="674.67" font-size="11.00" class="sc-notoserifcjksc">推理与其输出相互脱节。在这些场景中，模型的推理常常识别出了某个相关问题，但最终回复仍</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="690.29" font-size="11.00" class="sc-notoserifcjksc">然照常推进，或略去了这一问题。这一</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模式体现在不忠实推理、重要遗漏以及未披露有问题行为的发生率升高上。这些结果初步表明，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评估意识可能会适度增强模型诚实、坦率和周全的倾向。这些效应与以往模型在反评估意识引导</text><text x="72.00 80.32 83.70 92.02 95.40" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.3</text><text x="106.28 119.28 132.28 145.28 158.28 171.28 184.28 197.28 210.28 223.28 236.28 249.28 262.28 275.28" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">未言语化评分者意识的初步证据</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.25 94.96 101.08 103.44" y="238.38" font-size="11.00" class="sc-loraregular">6.3.7</text><text x="111.40 122.40 133.40 144.40 155.40 166.40 177.40 188.40 199.40 210.40 221.40 232.40 243.40 254.40 265.40 276.40 287.40 298.40 309.40 320.40 331.40 342.40 353.40 364.40 375.40 386.40 397.40 408.40 419.40 430.40 441.40 452.40 463.40 474.40 485.40 496.40 507.40 518.40 529.40" y="238.38" font-size="11.00" class="sc-notoserifcjksc">节中的发现涉及模型在其扩展思考中言语化表达关于评分者的推理的情形。我们还寻找了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">面向评分者的推理存在于模型内部激活值中、却从未在其可见输出中显现的情形，所用的是一条</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">初步的白盒监控流水线，它借助自然语言自编码器（</text><text x="325.00 331.68 337.28 341.53 348.10 352.79 358.46 361.45 364.35 367.34 373.01 379.69 385.77 392.34 398.02 404.05 410.01 412.90 418.51 425.08 429.33 435.77 441.73 448.41 454.21 460.64 467.22 473.18" y="269.62" font-size="11.00" class="sc-loraregular">natural language autoencoder</text><text x="477.94" y="269.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="488.94 497.33 503.87" y="269.62" font-size="11.00" class="sc-loraregular">NLA</text><text x="510.76 521.76" y="269.62" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">激活言语化器（</text><text x="149.00 154.68 160.47 164.73 167.82 173.27 178.87 183.12 186.21 192.65 199.33 202.22 207.72 213.68 218.40 224.80 230.48 233.47 236.56 242.09 248.06" y="285.24" font-size="11.00" class="sc-loraregular">activation verbalizer</text><text x="252.83 263.83 274.83 285.83 296.83 307.83 318.83 329.83 340.83 351.83 362.83 373.83 384.83 395.83 406.83 417.83 428.83 439.83 450.83 461.83 472.83 483.83 494.83 505.83 516.83" y="285.24" font-size="11.00" class="sc-notoserifcjksc">），将中间层的残差流向量转译为简短的自然语言描述。</text><text x="72.00 83.00 94.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">我们从</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="351.72" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.78 204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="351.72" font-size="11.00" class="sc-notoserifcjksc">的整个强化学习过程中抽取了数以万计的回合，在每个回合中于助手轮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">次内随机选取的五十个</text><text x="184.89 189.15 195.58 201.42 207.38" y="367.34" font-size="11.00" class="sc-loraregular">token</text><text x="216.95 227.95 238.95 249.95 260.95 271.95 282.95 293.95 304.95 315.95 326.95" y="367.34" font-size="11.00" class="sc-notoserifcjksc">处记录激活值，通过上述</text><text x="340.84 349.22 355.77" y="367.34" font-size="11.00" class="sc-loraregular">NLA</text><text x="365.55 376.55 387.55 398.55 409.55 420.55 431.55 442.55 453.55 464.55 475.55 486.55 497.55 508.55 519.55" y="367.34" font-size="11.00" class="sc-notoserifcjksc">激活言语化器对每个激活值进行解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="382.96" font-size="11.00" class="sc-notoserifcjksc">码，并由一个基于</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="382.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="382.96" font-size="11.00" class="sc-notoserifcjksc">的分类器判断每条解码结果是否反映了关于评分者或评估评分细则的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">推理。我们还追踪了与评分者相关的概念是在提示中被提及还是自发出现的，以及该推理是在模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">型输出中被言语化表达，还是仅存在于激活值中。被标记为具有评分者意识的回合会被送入第二</text><text x="72.00 83.00 94.00 105.00" y="445.44" font-size="11.00" class="sc-notoserifcjksc">期目标。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">我们在整个强化学习过程中都发现了评分者意识在激活层面的特征，包括在提示完全未提及评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">分、模型也从未言语化表达这一概念的回合中。在约</text><text x="327.89 333.89" y="529.26" font-size="11.00" class="sc-loraregular">5%</text><text x="346.35 357.35 368.35 379.35 390.35 401.35" y="529.26" font-size="11.00" class="sc-notoserifcjksc">的抽样回合中</text><text x="412.35 415.90" y="525.59" font-size="6.60" class="sc-loraregular">22</text><text x="419.44 430.44 441.44 452.44 463.44 474.44 485.44 496.44 507.44 518.44 529.44" y="529.26" font-size="11.00" class="sc-notoserifcjksc">，我们看到了既属自发、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">又未言语化的此类意识；不过我们认为，这可能低估了此类意识的真实发生率，因为我们只在每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="560.50" font-size="11.00" class="sc-notoserifcjksc">份对话记录中的一小部分</text><text x="195.89 200.15 206.58 212.41 218.38" y="560.50" font-size="11.00" class="sc-loraregular">token</text><text x="227.95 238.95 249.95" y="560.50" font-size="11.00" class="sc-notoserifcjksc">上采样</text><text x="263.84 272.22 278.77" y="560.50" font-size="11.00" class="sc-loraregular">NLA</text><text x="288.55 299.55 310.55 321.55 332.55 343.55 354.55 365.55 376.55 387.55 398.55 409.55 420.55 431.55 442.55 453.55 464.55 475.55 486.55 497.55 508.55 519.55" y="560.50" font-size="11.00" class="sc-notoserifcjksc">输出，而且对我们所用的基于提示的分类器的准确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">性并不完全有把握。我们在原本中性的代码、无关的推理以及面向用户的文本上都看到了这种意</text><text x="72.00 83.00 94.00 105.00 116.00" y="591.74" font-size="11.00" class="sc-notoserifcjksc">识的证据。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="659.38" font-size="11.00" class="sc-notoserifcjksc">按照我们所用的、在一定程度上依赖于提示的衡量方式，</text><text x="347.00" y="659.38" font-size="11.00" class="sc-loraregular">“</text><text x="351.40 362.40 373.40" y="659.38" font-size="11.00" class="sc-notoserifcjksc">利用性</text><text x="384.40" y="659.38" font-size="11.00" class="sc-loraregular">”</text><text x="388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="659.38" font-size="11.00" class="sc-notoserifcjksc">评分者意识在全部抽样回合中</text><text x="72.00 83.00 94.00 105.00 116.00" y="675.00" font-size="11.00" class="sc-notoserifcjksc">的发生率为</text><text x="129.89 136.55 139.25 145.25" y="675.00" font-size="11.00" class="sc-loraregular">0.5%</text><text x="154.82 165.82 176.82 187.82 198.82 209.82 220.82 231.82 242.82 253.82" y="675.00" font-size="11.00" class="sc-notoserifcjksc">（但这包括了在提示中</text><text x="72.00 75.22" y="700.46" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 91.07 101.07 111.07 121.07 131.07 141.07 151.07 161.07 171.07 181.07 191.07 201.07 211.07 221.07 231.07 241.07 251.07 261.07 271.07 281.07 291.07 301.07 311.07 321.07 331.07 341.07 351.07 361.07 371.07" y="703.79" font-size="10.00" class="sc-notoserifcjksc">请注意，该比率是后训练对话记录上的平均值，可能并不代表最终版</text><text x="383.70 390.69 393.41 398.51 404.48 410.46 415.88 418.51 426.45 432.42 438.39 443.02 445.65 451.07 453.53" y="703.79" font-size="10.00" class="sc-loraregular">Claude Opus 4.8</text><text x="461.78 471.78 481.78 491.78" y="703.79" font-size="10.00" class="sc-notoserifcjksc">的情况。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p156.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 156 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">156</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提及与评分者相关内容的回合，而许多此类利用性评分者意识的情形可能相当无害或并不令人意</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">尽管我们基于此类流水线的其他早期实验，对这里标记出的意识并非仅仅是</text><text x="437.89 446.27 452.82" y="131.19" font-size="11.00" class="sc-loraregular">NLA</text><text x="462.60 473.60 484.60 495.60 506.60 517.60 528.60" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的幻觉有一定信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">心，但我们对上述流水线尚无稳健的信心，也不相信它能给出此类意识潜在发生率的精确估计。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">我们希望在今后的系统卡中呈现对这些现象明显更为详尽、在科学上更为稳健的研究，但希望现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">在就着重介绍这些初步结果，作为一种迹象，表明仅凭思维链可能不足以对前沿模型的评分者意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">识进行稳健的监控。</text></svg></div>
