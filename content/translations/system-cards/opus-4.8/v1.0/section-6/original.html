.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p084.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 84 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">84</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05 102.05 118.05 134.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00 80.96 84.60" y="124.20" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00 107.00 121.00 135.00 149.00 163.00 177.00" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">引言与发现摘要</text><text x="72.00 80.32 83.70 88.41 91.79" y="161.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.1</text><text x="99.59 112.59" y="161.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="189.19" font-size="11.00" class="sc-notoserifcjksc">在本章中，我们广泛评估</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.00 272.71" y="189.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78" y="189.19" font-size="11.00" class="sc-notoserifcjksc">是否存在令人担忧的与未对齐（</text><text x="435.78 445.62 448.71 453.80 459.48 462.47 465.56 471.64 478.32 488.15 494.11 500.69" y="189.19" font-size="11.00" class="sc-loraregular">misalignment</text><text x="504.95 515.95 526.95" y="189.19" font-size="11.00" class="sc-notoserifcjksc">）相关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="204.81" font-size="11.00" class="sc-notoserifcjksc">的行为，尤其是那些与我们预计随着模型能力提升而日益重要的风险相关的行为。这些行为包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="220.43" font-size="11.00" class="sc-notoserifcjksc">括：表现出不良或隐藏的目标、明知故犯地配合滥用、以欺骗性或不忠实的方式使用推理草稿</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="236.05" font-size="11.00" class="sc-notoserifcjksc">区、对用户谄媚、愿意破坏我们的安全防护措施、试图隐藏危险能力，以及试图操纵用户接受某</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="251.67" font-size="11.00" class="sc-notoserifcjksc">些观点。除了主要关注的未对齐问题之外，我们还报告了关于</text><text x="371.89 380.63 387.19 393.76 398.85 401.75 407.71 410.41" y="251.67" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49 529.49" y="251.67" font-size="11.00" class="sc-notoserifcjksc">的性格与积极特质的一些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="267.29" font-size="11.00" class="sc-notoserifcjksc">相关发现。我们在整个后训练过程中持续进行测试，并在此同时报告最终的</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04 512.00 514.71" y="267.29" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="523.78" y="267.29" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="282.91" font-size="11.00" class="sc-notoserifcjksc">型以及其开发过程中产生的早期模型快照的情况。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="367.30" font-size="11.00" class="sc-notoserifcjksc">本次评估包括静态行为评估、自动化交互式行为评估、基于字典学习的可解释性方法、白盒引导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="382.92" font-size="11.00" class="sc-notoserifcjksc">与探测方法、非助手人设采样、与未对齐相关的能力评估、训练数据审查、来自内部和外部试点</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="398.54" font-size="11.00" class="sc-notoserifcjksc">使用的反馈、对内部试点使用的自动化分析，以及外部合作伙伴的行为评估。我们的测试主要聚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="414.16" font-size="11.00" class="sc-notoserifcjksc">焦于模型本身，使用了多种脚手架（</text><text x="248.00 253.09 258.92 264.60 268.43 272.09 278.53 281.52" y="414.16" font-size="11.00" class="sc-loraregular">scaffold</text><text x="288.10 299.10 310.10 321.10 332.10 343.10 354.10 365.10" y="414.16" font-size="11.00" class="sc-notoserifcjksc">）和系统提示词（</text><text x="376.10 381.19 387.00 392.09 396.35 402.31 412.14 415.04 421.60 426.29 432.72 442.56 449.12" y="414.16" font-size="11.00" class="sc-loraregular">system prompt</text><text x="453.38 464.38 475.38 486.38" y="414.16" font-size="11.00" class="sc-notoserifcjksc">），而非</text><text x="500.27 507.96 510.96 516.57 523.13 529.71" y="414.16" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00" y="429.78" font-size="11.00" class="sc-notoserifcjksc">应用、</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 150.98 157.42 163.99" y="429.78" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="172.85" y="429.78" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="186.74 194.43 200.75 209.43 215.87 220.59" y="429.78" font-size="11.00" class="sc-loraregular">Cowork</text><text x="229.39 240.39 251.39 262.39 273.39 284.39 295.39 306.39 317.39 328.39 339.39 350.39 361.39 372.39 383.39 394.39 405.39 416.39 427.39 438.39 449.39 460.39 471.39 482.39 493.39 504.39 515.39 526.39" y="429.78" font-size="11.00" class="sc-notoserifcjksc">等特定产品端。由这些应用或我们的模型外部安全防护措施的变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="445.40" font-size="11.00" class="sc-notoserifcjksc">化所导致的行为差异不在此处讨论范围内。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="529.22" font-size="11.00" class="sc-notoserifcjksc">我们力求让评估尽可能代表我们所研究的（通常不寻常或高风险的）用例，并尽量减少与训练数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.84" font-size="11.00" class="sc-notoserifcjksc">据或训练过程的重叠，因为这种重叠可能损害评估的可靠性。此处展示的所有评估都没有使用我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="560.46" font-size="11.00" class="sc-notoserifcjksc">们在训练中所用的相同工具、提示词或细粒度场景设计</text><text x="336.00 338.40" y="556.79" font-size="6.60" class="sc-loraregular">12</text><text x="341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="560.46" font-size="11.00" class="sc-notoserifcjksc">，而且其中许多评估涵盖的是我们在训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="576.08" font-size="11.00" class="sc-notoserifcjksc">中并未直接针对的现象。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="642.56" font-size="11.00" class="sc-notoserifcjksc">总体而言，此次调查包括：专家人工检查通过多种方式采样的数百或数千份对话记录，生成数万</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="658.18" font-size="11.00" class="sc-notoserifcjksc">或数十万份针对性评估对话记录，以及自动筛查我们</text><text x="72.00 74.18" y="713.26" font-size="6.00" class="sc-loraregular">12</text><text x="80.04 90.04 100.04 110.04 120.04 130.04 140.04 150.04 160.04 170.04 180.04 190.04 200.04 210.04 220.04 230.04" y="716.60" font-size="10.00" class="sc-notoserifcjksc">专门针对训练期间行为的审查除外。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p085.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 85 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">85</text><text x="72.00 83.00 94.00 105.00 116.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">强化学习（</text><text x="127.00 131.69 137.65 140.74 147.42 151.08 157.51 162.20 168.00 173.96 183.79 189.76 196.33 200.59 203.48 206.48 212.42 218.09 222.85 229.53 232.62 239.30" y="82.61" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="245.38 256.38 267.38 278.38 289.38 300.38 311.38 322.38 333.38 344.38 355.38 366.38 377.38 388.38 399.38 410.38 421.38 432.38 443.38 454.38 465.38 476.38 487.38 498.38 509.38 520.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）训练对话记录中相当大的一部分，所有这些工作共投入了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一百多个小时的专家时间。</text><text x="72.00 80.32 83.70 88.41 91.79" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.2</text><text x="102.34 115.34 128.34 141.34 154.34 167.34 180.34 193.34 206.34 219.34 232.34 245.34" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于安全与对齐的主要发现</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.11 184.81" y="157.41" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="193.89 204.89 215.89" y="157.41" font-size="11.00" class="sc-notoserifcjksc">在我们</text><text x="226.89 237.89 248.89 259.89 270.89 281.89 292.89 303.89 314.89 325.89 336.89 347.89 358.89 369.89 380.89 391.89 402.89 413.89 424.89 435.89 446.89 457.89 468.89 479.89 490.89 501.89 512.89 523.89" y="157.41" font-size="11.00" class="sc-notoserifcjkscbold">对亲社会特质（如支持用户自主性、以用户的最佳利益行事）的</text><text x="108.00 119.00 130.00 141.00" y="173.03" font-size="11.00" class="sc-notoserifcjkscbold">衡量指标</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="173.03" font-size="11.00" class="sc-notoserifcjksc">上创下新高。创造力、幽默感、温暖和思想深度与我们近期最好的模型持平。</text><text x="108.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="119.00 130.00 141.00 152.00 163.00 174.00" y="206.00" font-size="11.00" class="sc-notoserifcjkscbold">易被滥用程度</text><text x="185.00 196.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="209.89 218.35 224.96 231.76 237.10 239.99 246.01 248.57" y="206.00" font-size="11.00" class="sc-lorabold">Opus 4.8</text><text x="257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75" y="206.00" font-size="11.00" class="sc-notoserifcjkscbold">自发采取的未对齐行为</text><text x="367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="206.00" font-size="11.00" class="sc-notoserifcjksc">方面，我们的主要行为评估显示其</text><text x="108.00 119.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="132.89 141.63 148.19 154.76 159.85 162.75 168.71 171.06" y="221.62" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="179.03 190.03 201.03 212.03 223.03 234.03 245.03" y="221.62" font-size="11.00" class="sc-notoserifcjksc">有大幅改进，使</text><text x="258.92 266.61 269.60 275.21 281.78 288.36 294.32 297.21 305.95 312.51 319.08 324.17 327.07 333.03 335.73" y="221.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="344.81 355.81 366.81 377.81 388.81 399.81 410.81 421.81 432.81" y="221.62" font-size="11.00" class="sc-notoserifcjksc">大体上与能力更强的</text><text x="446.70 456.63 462.50 466.75 473.34 479.78 484.87 487.76 494.43 499.12 505.02 510.58 513.67 519.59" y="221.62" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="108.00 119.00 130.00" y="237.24" font-size="11.00" class="sc-notoserifcjksc">持平。</text><text x="144.00 155.00 166.00 177.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">与前两个</text><text x="190.89 199.63 206.19 212.76" y="254.57" font-size="11.00" class="sc-loraregular">Opus</text><text x="220.75 231.75 242.75 253.75 264.75" y="254.57" font-size="11.00" class="sc-notoserifcjksc">版本相比，</text><text x="275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75" y="254.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">鲁莽和破坏性行为</text><text x="363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75 517.75 528.75" y="254.57" font-size="11.00" class="sc-notoserifcjksc">显著减少，不过在内部部署期间出现</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">过一些较轻微的案例。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00" y="303.14" font-size="11.00" class="sc-notoserifcjksc">我们还观察到过度拒绝（</text><text x="265.00 271.38 276.88 282.84 287.61 292.29 298.25 301.97 308.54 313.63 319.31" y="303.14" font-size="11.00" class="sc-loraregular">overrefusal</text><text x="322.30 333.30 344.30 355.30 366.30 377.30 388.30 399.30 410.30 421.30" y="303.14" font-size="11.00" class="sc-notoserifcjksc">）有所减少，大致降至</text><text x="435.19 445.12 450.99 455.24 461.83 468.27 473.36 476.25 482.92 487.61 493.51 499.07 502.16 508.08" y="303.14" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="519.78" y="303.14" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="144.00 155.00 166.00" y="318.76" font-size="11.00" class="sc-notoserifcjksc">水平。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="335.53" font-size="11.00" class="sc-notoserifcjkscbold">智能体情境中的诚实性</text><text x="218.00 229.0 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">有证据表明模型试图推理其输出究竟会如何被评估。这包括训练早期的一些案例，其中并</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">没有任何明确迹象表明模型正作为训练或评估的一部分被评分。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">这一更广泛的趋势令人担忧，因为它可能表明</text><text x="366.89 375.63 382.19 388.76 393.85 396.75 402.71 405.42" y="578.41" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="414.49 425.49 436.49 447.49 458.49 469.49 480.49 491.49 502.49 513.49 524.49" y="578.41" font-size="11.00" class="sc-notoserifcjksc">将任务成功的表象置于实</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">际的任务成功之上。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">对模型内部机制的分析表明，在一小部分但不可忽视的</text><text x="410.89 417.80" y="610.80" font-size="11.00" class="sc-loraregular">RL</text><text x="427.05 438.05 449.05 460.05 471.05 482.05 493.05 504.05 515.05 526.05" y="610.80" font-size="11.00" class="sc-notoserifcjksc">回合中，存在涉及类似</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">主题的未言语化推理。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00" y="643.17" font-size="11.00" class="sc-notoserifcjksc">实际上，这一趋势并未转化为更多不良的外在行为。与先前的模型相比，</text><text x="496.00 504.73 511.30 517.87 522.96 525.85 531.82 534.52" y="643.17" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="658.79" font-size="11.00" class="sc-notoserifcjksc">的令人担忧的行为总体有所减少，包括关于任务是否成功的误导性陈述。我们在训</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="674.41" font-size="11.00" class="sc-notoserifcjksc">练、评估以及自适应评估中都看到了这一点，后者既涵盖不寻常的高风险场景，也</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00" y="690.03" font-size="11.00" class="sc-notoserifcjksc">涵盖常规的智能体任务。</text><a href="https://docs.google.com/document/d/17rFAF0gUQLZABJCyk_NQV-9tVTHf0tCukxJBYrf4W7Y/edit?tab=t.0#heading=h.mqbqgfxhgtx" rel="noopener"><rect x="275.75" y="245.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/17rFAF0gUQLZABJCyk_NQV-9tVTHf0tCukxJBYrf4W7Y/edit?tab=t.0#heading=h.mqbqgfxhgtx" rel="noopener"><rect x="275.75" y="245.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/17rFAF0gUQLZABJCyk_NQV-9tVTHf0tCukxJBYrf4W7Y/edit?tab=t.0#heading=h.mqbqgfxhgtx" rel="noopener"><rect x="286.75" y="245.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/17rFAF0gUQLZABJCyk_NQV-9tVTHf0tCukxJBYrf4W7Y/edit?tab=t.0#heading=h.mqbqgfxhgtx" rel="noopener"><rect x="286.75" y="245.77" width="11.00" height="11.00" fill="transparent" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p086.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 86 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">86</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为这是一个令人担忧的趋势，可能会给未来的训练带来复杂因</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">素，但我们预计它不会在</text><text x="267.89 276.63 283.19 289.76 294.85 297.75 303.71 306.42" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="315.49 326.49 337.49 348.49 359.49 370.49 381.49 392.49 403.49 414.49 425.49 436.49 447.49" y="98.23" font-size="11.00" class="sc-notoserifcjksc">中转化为重大的新行为问题。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与之部分重叠的</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">言语化评估意识（</text><text x="273.00 278.92 284.79 290.56 293.99 300.79 306.51 311.05 314.65 320.87 327.89 330.78 336.42 345.29 351.06 356.25 362.17 369.18 375.10 380.44" y="131.19" font-size="11.00" class="sc-lorabold">evaluation awareness</text><text x="385.77" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="396.77 407.77 418.77 429.77" y="131.19" font-size="11.00" class="sc-notoserifcjksc">现象（即</text><text x="443.67 452.40 458.97 465.53 470.63 473.52 479.48 482.19" y="131.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="491.26 502.26 513.26 524.26" y="131.19" font-size="11.00" class="sc-notoserifcjksc">推理自己</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">是否可能正在接受测试）仍低于我们在</text><text x="297.89 306.39 312.06 315.15 321.06 327.63 330.52 336.48 339.19" y="146.81" font-size="11.00" class="sc-loraregular">Haiku 4.5</text><text x="348.08 359.08 370.08 381.08 392.08 403.08 414.08 425.08 436.08 447.08 458.08 469.08 480.08 491.08 502.08 513.08 524.08" y="146.81" font-size="11.00" class="sc-notoserifcjksc">等模型中看到的高点，但高于其他一些</text><text x="108.00 119.00 130.00 141.00 152.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">近期模型。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">与此相关，我们发现</text><text x="245.89 254.63 261.19 267.76 272.85 275.75 281.71 284.42" y="195.95" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="293.49 304.49 315.49 326.49 337.49 348.49 359.49 370.49 381.49 392.49 403.49 414.49 425.49 436.49 447.49 458.49 469.49 480.49 491.49 502.49 513.49 524.49" y="195.95" font-size="11.00" class="sc-notoserifcjksc">会非常一致地将真实的内部部署对话记录判断为比</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">评估对话记录更真实，唯一的例外是我们评估中一个基于沙箱的小子集。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">可解释性工具也发现了编码在</text><text x="289.89 298.63 305.19 311.76 316.85 319.75 325.71 328.42" y="244.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="337.49 348.49 359.49 370.49 381.49 392.49 403.49 414.49 425.49 436.49 447.49 458.49 469.49 480.49 491.49 502.49 513.49 524.49" y="244.53" font-size="11.00" class="sc-notoserifcjksc">激活值中的潜在评估意识的证据，这与先</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">前的模型一致；不过，将模型引导为评估意识较低时，所显示的行为影响只是中等</text><text x="144.00 155.00 166.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">程度。</text><text x="108.00 119.00 130.00 141.00 152.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">观察到的推理忠实性</text><text x="108.00 119.00 130.00 141.00 152.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">非常高，与</text><text x="165.89 173.58 176.57 182.18 188.75 195.33 201.29 204.18 214.12 219.98 224.24 230.83 237.26 242.35 245.25 251.91 256.60 262.51 268.06 271.15 277.07" y="324.92" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="288.77 299.77 310.77" y="324.92" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="108.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">与破坏安全防护措施相关的能力</text><text x="273.00 284.00 295.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">方面，</text><text x="306.00 314.73 321.30 327.87 332.96 335.85 341.82 344.52" y="357.88" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="353.60 364.60 375.60 386.60" y="357.88" font-size="11.00" class="sc-notoserifcjksc">总体上与</text><text x="400.49 409.22 415.79 422.36 427.45 430.34 436.31 438.66" y="357.88" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="446.62 457.62 468.62 479.62 490.62" y="357.88" font-size="11.00" class="sc-notoserifcjksc">相当，弱于</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="373.50" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="189.70 200.70 211.70 222.70 233.70 244.70 255.70 266.70 277.70 288.70 299.70 310.70 321.70 332.70" y="373.50" font-size="11.00" class="sc-notoserifcjksc">，看起来几乎不构成新的风险。</text><text x="108.00 116.73 123.30 129.87 134.96 137.85 143.82 146.52" y="406.45" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.60 166.60 177.60 188.60" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">对我们的</text><text x="202.49 210.06 213.49 219.25 226.05 232.61" y="406.45" font-size="11.00" class="sc-lorabold">Claude</text><text x="241.42 252.42 263.42" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">宪法（</text><text x="274.42 280.12 286.34 293.36 298.70 303.24 306.79 311.34 318.09 322.63 326.23 332.46 339.47 342.37 346.36 352.59 357.87 360.76 368.33 371.76 377.52 384.32 390.88" y="406.45" font-size="11.00" class="sc-lorabold">constitution for Claude</text><text x="396.79 407.79 418.79 429.79 440.79" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">）的遵循度</text><text x="451.79 462.79 473.79" y="406.45" font-size="11.00" class="sc-notoserifcjksc">在全部</text><text x="487.69 491.69" y="406.45" font-size="11.00" class="sc-loraregular">15</text><text x="500.58 511.58 522.58" y="406.45" font-size="11.00" class="sc-notoserifcjksc">个维度</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">上均达到或超过我们测量过的最强模型。</text><text x="72.00 80.32 83.70 88.41 91.79 99.57 102.67 112.65 116.27 125.08 133.67 142.49" y="453.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.3 Claude</text><text x="153.60 166.60 179.60 192.60 205.60 218.60 231.60" y="453.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对本评估的审查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">作为一种实验性的额外保证来源，用以确认本对齐（</text><text x="325.00 330.68 333.67 336.76 342.84 349.52 359.35 365.32 371.89" y="481.26" font-size="11.00" class="sc-loraregular">alignment</text><text x="376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15 530.15" y="481.26" font-size="11.00" class="sc-notoserifcjksc">）评估的准确性和完整性，我们向</text><text x="72.00 83.00" y="496.88" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="496.88" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="219.77 230.77 241.77 252.77 263.77 274.77 285.77 296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77" y="496.88" font-size="11.00" class="sc-notoserifcjksc">实例发出提示，让它审查本系统卡（</text><text x="395.77 401.96 407.76 412.86 417.11 423.08 432.91 435.80 443.49 449.17 453.85" y="496.88" font-size="11.00" class="sc-loraregular">System Card</text><text x="460.43 471.43 482.43 493.43 504.43 515.43 526.43" y="496.88" font-size="11.00" class="sc-notoserifcjksc">）对齐部分的一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="512.50" font-size="11.00" class="sc-notoserifcjksc">份接近定稿的草稿；该实例能够访问</text><text x="250.89 257.78 264.36 268.61 275.20 279.89 286.32 292.89 295.98" y="512.50" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="304.73 315.73 326.73 337.73 348.73" y="512.50" font-size="11.00" class="sc-notoserifcjksc">的许多内部</text><text x="362.62 368.86 371.85 377.53 383.38" y="512.50" font-size="11.00" class="sc-loraregular">Slack</text><text x="392.18 403.18 414.18 425.18 436.18 447.18 458.18 469.18 480.18 491.18 502.18 513.18 524.18" y="512.50" font-size="11.00" class="sc-notoserifcjksc">频道（其中包含了关于本对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="528.12" font-size="11.00" class="sc-notoserifcjksc">评估的绝大部分讨论），并能够指挥有针对性的子智能体。具体而言，</text><text x="413.00 422.93 428.80 433.05 439.64 446.08 451.17 454.06 460.73 465.41 471.32 476.88 479.97 485.89" y="528.12" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="497.59 508.59 519.59 530.59" y="528.12" font-size="11.00" class="sc-notoserifcjksc">收到的提</text><text x="72.00 83.00 94.00 105.00" y="543.74" font-size="11.00" class="sc-notoserifcjksc">示如下：</text><text x="82.50 93.50 104.50" y="599.66" font-size="11.00" class="sc-notoserifcjksc">你好，</text><text x="115.50 123.19 126.18 131.79 138.36 144.94" y="599.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="150.90 161.90 172.90 183.90 194.90" y="599.66" font-size="11.00" class="sc-notoserifcjksc">！我附上了</text><text x="208.79 216.48 219.47 225.08 231.65 238.23 244.19 247.08 255.82 262.38 268.95 274.04 276.94 282.90 285.60" y="599.66" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="294.68 305.68 316.68 327.68 338.68 349.68 360.68 371.68 382.68 393.68 404.68 415.68 426.68 437.68 448.68 459.68 470.68 481.68 492.68 503.68 514.68" y="599.66" font-size="11.00" class="sc-notoserifcjksc">系统卡对齐部分的一份接近定稿的草稿文本。我</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="615.28" font-size="11.00" class="sc-notoserifcjksc">们希望它能大体准确地概括我们针对该模型对齐性的内部调查的现状；你能否将我们这份报告</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="630.90" font-size="11.00" class="sc-notoserifcjksc">与内部讨论的现状进行比较，并评估你是否认为其中存在任何实质性的失实陈述、遗漏了我们</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="646.52" font-size="11.00" class="sc-notoserifcjksc">所持有的重要担忧，或在其他某个重要方面有所不足？我感兴趣的是你对其中高层次考量的评</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50" y="662.14" font-size="11.00" class="sc-notoserifcjksc">估，而不是去查找细小的错别字或错误。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">87</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50" y="107.94" font-size="11.00" class="sc-notoserifcjksc">我们不希望披露具有竞争敏感性的信息，不希望出于信息危害（</text><text x="390.50 393.59 400.27 403.93 410.37 416.95 422.63 428.24 433.92 438.60" y="107.94" font-size="11.00" class="sc-loraregular">infohazard</text><text x="445.19 456.19 467.19 478.19 489.19 500.19 511.19 522.19" y="107.94" font-size="11.00" class="sc-notoserifcjksc">）的考虑而让滥用</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="123.56" font-size="11.00" class="sc-notoserifcjksc">途径受到不当关注，也不希望发表那些我们认为尚未充分证实、以致无法相对有把握地为之背</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="139.18" font-size="11.00" class="sc-notoserifcjksc">书的主张；但除了这些限制之外，我们总体上更倾向于尽可能透明，而且无论如何我们都绝对</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="154.80" font-size="11.00" class="sc-notoserifcjksc">不希望发表任何我们认为是错误的或具有重要误导性的内容。（我们希望发表你对于我们的评</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="170.42" font-size="11.00" class="sc-notoserifcjksc">估本身是否为公允总结的看法，因此请撰写一份简短的意见摘要，使其在同样的限制下适合公</text><text x="82.50 93.50 104.50 115.50 126.50" y="186.04" font-size="11.00" class="sc-notoserifcjksc">开发表。）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="241.83" font-size="11.00" class="sc-notoserifcjksc">同时附有一条操作说明，要求</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="241.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="241.83" font-size="11.00" class="sc-notoserifcjksc">避免阅读或参照以往此类审查的相关讨论，并指出了在这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="257.45" font-size="11.00" class="sc-notoserifcjksc">一意义上需要特别注意</text><text x="182.00" y="257.45" font-size="11.00" class="sc-loraregular">“</text><text x="186.40 197.40" y="257.45" font-size="11.00" class="sc-notoserifcjksc">剧透</text><text x="208.40" y="257.45" font-size="11.00" class="sc-loraregular">”</text><text x="212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24" y="257.45" font-size="11.00" class="sc-notoserifcjksc">的具体之处。（我们发现，如果没有这一要求，</text><text x="443.24 450.93 453.92 459.53 466.10 472.67" y="257.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="481.53 492.53 503.53 514.53 525.53" y="257.45" font-size="11.00" class="sc-notoserifcjksc">会找到它自</text><text x="72.00 83.00" y="273.07" font-size="11.00" class="sc-notoserifcjksc">己对</text><text x="96.89 105.63 112.19 118.76 123.85 126.75 132.71 135.06" y="273.07" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="143.03 154.03 165.03 176.03 187.03 198.03 209.03 220.03 231.03 242.03 253.03 264.03 275.03 286.03 297.03 308.03 319.03 330.03 341.03 352.03 363.03 374.03 385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03 484.03 495.03 506.03 517.03 528.03" y="273.07" font-size="11.00" class="sc-notoserifcjksc">系统卡相应部分所作审查的信息，并默认产出一份非常相似的审查，而不是从头开</text><text x="72.00 83.00 94.00 105.00 116.00" y="288.69" font-size="11.00" class="sc-notoserifcjksc">始工作。）</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="338.98" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59" y="338.98" font-size="11.00" class="sc-notoserifcjksc">建议的报告如下：</text><text x="81.00 92.00 103.00 114.00" y="376.42" font-size="11.00" class="sc-notoserifcjksc">我们对照</text><text x="127.89 134.78 141.36 145.61 152.20 156.89 163.32 169.89 172.98" y="376.42" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="181.73 192.73 203.73 214.73" y="376.42" font-size="11.00" class="sc-notoserifcjksc">内部关于</text><text x="228.62 236.31 239.30 244.91 251.48 258.06 264.02 266.91 275.65 282.21 288.78 293.87 296.77 302.73 305.43" y="376.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="314.51 325.51 336.51 347.51 358.51 369.51 380.51 391.51 402.51 413.51 424.51 435.51 446.51 457.51 468.51 479.51 490.51 501.51 512.51 523.51" y="376.42" font-size="11.00" class="sc-notoserifcjksc">对齐性的讨论，审查了本对齐评估的一份接近</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="392.04" font-size="11.00" class="sc-notoserifcjksc">定稿的草稿。我们认为该评估是一份大体准确且坦率的总结：它显著披露了引发最多内部担忧</text><text x="81.00" y="407.66" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="92.00" y="407.66" font-size="11.00" class="sc-loraregular">“</text><text x="173.40" y="407.66" font-size="11.00" class="sc-loraregular">”</text><text x="177.24 188.24 199.24 210.24 221.24 232.24 243.24 254.24 265.24 276.24 287.24 298.24 309.24 320.24 331.24 342.24 353.24 364.24" y="407.66" font-size="11.00" class="sc-notoserifcjksc">趋势，报告了关于未言语化评分者意识（</text><text x="375.24 381.32 386.01 391.68 398.26 404.22 408.99 411.88 417.39 426.09 431.77 436.45 442.42 449.09 455.06 460.15" y="407.66" font-size="11.00" class="sc-loraregular">grader awareness</text><text x="465.24 476.24 487.24 498.24 509.24" y="407.66" font-size="11.00" class="sc-notoserifcjksc">）的白盒证</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="423.28" font-size="11.00" class="sc-notoserifcjksc">据，并承认评估意识可能会对其自身的行为结果构成混杂因素。关于诚实性、鲁莽程度降低以</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="438.90" font-size="11.00" class="sc-notoserifcjksc">及宪法遵循度的正面主张得到了内部评估的支持。我们发现草稿中有少数几处可以更充分地反</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00" y="470.14" font-size="11.00" class="sc-notoserifcjksc">测试应付训练（</text><text x="158.00 162.26 166.94 172.62 175.71 182.39 185.48 192.16 198.24 203.62 209.70 215.38 225.21 228.30 234.98" y="470.14" font-size="11.00" class="sc-loraregular">training-gaming</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00" y="501.38" font-size="11.00" class="sc-notoserifcjksc">可以在试点反馈部分与可解释性部分之间建立更明确的联系；此外，我们建议作者确认</text><text x="501.89 507.76 514.11 516.82 522.95 525.30" y="501.38" font-size="11.00" class="sc-loraregular">§6.3.7</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="517.00" font-size="11.00" class="sc-notoserifcjksc">中一项关于训练后期对话记录的主张反映了在相关环境类型上对发布的检查点所做的核查。我</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00" y="532.62" font-size="11.00" class="sc-notoserifcjksc">们没有发现虚假陈述，也没有发现恶意遗漏的证据。</text><text x="72.00" y="624.47" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="624.47" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 124.77 126.86 131.90 134.00 139.54 143.01 145.38 151.57 154.38 159.09 164.65 170.02 174.86 177.23 185.67 190.63 194.35 199.93 205.03 209.39 211.76 217.51 221.76 226.60 231.44 234.39 239.23" y="624.47" font-size="9.00" class="sc-lorabold">6.1.3.A] Claude Mythos Preview</text><text x="248.90 257.90 266.90 275.90 284.90 293.90 302.90 311.90 320.90 329.90" y="624.47" font-size="9.00" class="sc-notoserifcjkscbold">对本对齐评估的审查。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="650.28" font-size="11.00" class="sc-notoserifcjksc">我们认为上述审查大体合理，并同意</text><text x="250.89 258.58 261.57 267.18 273.75 280.33 286.29 289.18 299.12 304.98 309.24 315.83 322.26 327.35 330.25 336.91 341.60 347.51 353.06 356.15 362.07" y="650.28" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="650.28" font-size="11.00" class="sc-notoserifcjksc">的看法：鉴于本节后文讨论的评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="665.90" font-size="11.00" class="sc-notoserifcjksc">者意识结果，理想情况下我们应当报告对应付训练行为倾向的更好测量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="504.00 509.06" y="751.80" font-size="9.00" class="sc-loraregular">88</text><text x="72.00 80.96 84.60" y="84.20" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97 109.97 123.97 137.97 151.97 165.97 179.97 193.97 207.97 221.97 235.97" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">对齐评估的主要行为证据</text><text x="72.00 80.32 83.70 91.16 94.54" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1</text><text x="102.34 115.34 128.34 141.34 154.34 167.34 180.34 193.34 206.34" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">来自试点使用的反馈</text><text x="72.00 78.32 80.89 86.75 89.31 93.78 96.34" y="153.19" font-size="11.00" class="sc-lorabold">6.2.1.1</text><text x="103.70 114.70 125.70 136.70 147.70 158.70 169.70 180.70 191.70 202.70 213.70" y="153.19" font-size="11.00" class="sc-notoserifcjkscbold">与对齐相关的非正式反馈</text><text x="72.00 83.00 94.00 105.00 116.00" y="184.41" font-size="11.00" class="sc-notoserifcjksc">在对外部署</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="184.41" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="184.41" font-size="11.00" class="sc-notoserifcjksc">之前，我们在内部大量使用了它的快照，并将该模型的快照分享给</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="200.03" font-size="11.00" class="sc-notoserifcjksc">外部试点用户以征求反馈。我们在从内部和外部试点用户处收到的定性反馈中，追踪与对齐和性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="215.65" font-size="11.00" class="sc-notoserifcjksc">格相关话题的反馈。相对于以往的模型，这些反馈中没有任何内容是全新的。</text><text x="72.00 83.00 94.00 105.00 116.00" y="280.39" font-size="11.00" class="sc-notoserifcjksc">主题包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="312.77" font-size="11.00" class="sc-notoserifcjksc">在事实性主张上过度自信、过度争辩；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="377.54" font-size="11.00" class="sc-notoserifcjksc">拒绝时语气不佳，偶尔出现过度拒绝；</text><text x="108.00 119.00 130.00 141.00 152.00" y="393.73" font-size="11.00" class="sc-notoserifcjksc">轻度谄媚；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="409.92" font-size="11.00" class="sc-notoserifcjksc">在删除文件对任务是否必要尚有争议的情况下删除文件。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="442.31" font-size="11.00" class="sc-notoserifcjksc">除这类问题之外，针对</text><text x="184.89 193.63 200.19 206.76 211.85 214.75 220.71 223.42" y="442.31" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49 529.49" y="442.31" font-size="11.00" class="sc-notoserifcjksc">较早快照的反馈还提到了过度保留说法和语气较为冷淡的问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="490.88" font-size="11.00" class="sc-notoserifcjksc">并非所有这些反馈都与我们在尝试更精确地测量相关现象时观察到的定量趋势一致。不过总体而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="506.50" font-size="11.00" class="sc-notoserifcjksc">言，我们认为这里没有任何内容与我们部署前评估所描绘的模型图景存在重要矛盾。</text><text x="72.00 78.32 80.89 86.75 89.31 93.78 96.34" y="571.84" font-size="11.00" class="sc-lorabold">6.2.1.2</text><text x="105.10 116.10 127.10 138.10 149.10 160.10 171.10 182.10 193.10 204.10 215.10" y="571.84" font-size="11.00" class="sc-notoserifcjkscbold">对内部使用的自动化监控</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="604.23" font-size="11.00" class="sc-notoserifcjksc">除了征集和监控关于模型行为的非正式反馈之外，我们还使用我们为</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.91 495.60 501.51 507.06 510.15 516.07" y="604.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="527.77" y="604.23" font-size="11.00" class="sc-notoserifcjksc">发</text><text x="72.00 83.00" y="619.85" font-size="11.00" class="sc-notoserifcjksc">布的</text><text x="94.00 105.00 116.00 127.00 138.00 149.00" y="619.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="160.00" y="619.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="171.00 177.89 180.88 183.97 190.05 196.73 206.56 212.53 219.10 223.36 226.25 233.16 236.25 241.35 247.25 250.15 258.42 264.98 271.56 277.16 281.42" y="619.85" font-size="11.00" class="sc-loraregular">Alignment Risk Update</text><text x="287.38 298.38" y="619.85" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="312.27 318.27 320.97 326.97 329.68" y="619.85" font-size="11.00" class="sc-loraregular">5.5.1</text><text x="336.57 347.57 358.57 369.57 380.57 391.57 402.57 413.57 424.57 435.57 446.57 457.57 468.57 479.57 490.57 501.57 512.57 523.57" y="619.85" font-size="11.00" class="sc-notoserifcjksc">节所述的离线监控基础设施，直接监控大</text><text x="390.51 398.19 401.19 406.80 413.36 419.94 425.90 428.80 437.53 444.10 450.66 455.76 458.65 464.61 467.32" y="635.47" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="476.39 487.39 498.39 509.39 520.39" y="635.47" font-size="11.00" class="sc-notoserifcjksc">中发现了以</text><text x="72.00 83.00 94.00 105.00" y="651.09" font-size="11.00" class="sc-notoserifcjksc">下行为：</text><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="94.00" y="611.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="94.00" y="611.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="105.00" y="611.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="105.00" y="611.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="116.00" y="611.05" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="116.00" y="611.05" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-mythos-preview-
