e="11.00" class="sc-notoserifcjksc">相同，而初步结果曾显示</text><text x="330.21" y="254.79" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="376.35" y="254.79" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性更强。</text><text x="108.00" y="273.91" font-size="11.00" class="sc-notoserifcjksc">更正第</text><text x="143.89" y="273.91" font-size="11.00" class="sc-loraregular sc-k">6.3.6.4</text><text x="179.60" y="273.91" font-size="11.00" class="sc-notoserifcjksc">节中对评估量表的描述。我们使用的是</text><text x="369.49" y="273.91" font-size="11.00" class="sc-loraregular sc-k">1-5</text><text x="387.63" y="273.91" font-size="11.00" class="sc-notoserifcjksc">分量表，而非</text><text x="456.52" y="273.91" font-size="11.00" class="sc-loraregular">0-5</text><text x="477.62" y="273.91" font-size="11.00" class="sc-notoserifcjksc">分量表。</text><text x="72.00" y="306.41" font-size="11.00" class="sc-lorabold">2026</text><text x="99.94" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">年</text><text x="113.83" y="306.41" font-size="11.00" class="sc-lorabold">6</text><text x="123.05" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">月</text><text x="136.94" y="306.41" font-size="11.00" class="sc-lorabold">3</text><text x="146.00" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">日</text><text x="108.00" y="322.61" font-size="11.00" class="sc-notoserifcjksc">更正：第</text><text x="154.89" y="322.61" font-size="11.00" class="sc-loraregular">8.11.3</text><text x="183.51" y="322.61" font-size="11.00" class="sc-notoserifcjksc">节中的</text><text x="216.51" y="322.61" font-size="11.00" class="sc-loraregular">“100</text><text x="241.47" y="322.61" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="255.37" y="322.61" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="287.42" y="322.61" font-size="11.00" class="sc-notoserifcjksc">上限</text><text x="309.42" y="322.61" font-size="11.00" class="sc-loraregular">”-&gt;“</text><text x="328.87" y="322.61" font-size="11.
