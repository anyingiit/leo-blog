.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">更新日志</text><text x="72.00" y="110.21" font-size="11.00" class="sc-lorabold">2026</text><text x="99.94" y="110.21" font-size="11.00" class="sc-notoserifcjkscbold">年</text><text x="113.83" y="110.21" font-size="11.00" class="sc-lorabold">6</text><text x="123.05" y="110.21" font-size="11.00" class="sc-notoserifcjkscbold">月</text><text x="136.94" y="110.21" font-size="11.00" class="sc-lorabold">17</text><text x="149.46" y="110.21" font-size="11.00" class="sc-notoserifcjkscbold">日</text><text x="108.00" y="126.40" font-size="11.00" class="sc-notoserifcjksc">更正图</text><text x="143.89" y="126.40" font-size="11.00" class="sc-loraregular">2.2.4.A</text><text x="179.57" y="126.40" font-size="11.00" class="sc-notoserifcjksc">和表</text><text x="204.46" y="126.40" font-size="11.00" class="sc-loraregular">2.2.3.B</text><text x="240.25" y="126.40" font-size="11.00" class="sc-notoserifcjksc">中报告的</text><text x="287.15" y="126.40" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="334.74" y="126.40" font-size="11.00" class="sc-notoserifcjksc">在长篇病毒学任务</text><text x="425.64" y="126.40" font-size="11.00" class="sc-loraregular">2</text><text x="434.44" y="126.40" font-size="11.00" class="sc-notoserifcjksc">上的表现，以及第</text><text x="108.00" y="142.02" font-size="11.00" class="sc-loraregular">2.2.4</text><text x="134.08" y="142.02" font-size="11.00" class="sc-notoserifcjksc">节中的对应分析。图表最初报告的是受到工具使用错误影响的病毒学初步结果。修正</text><text x="108.00" y="157.64" font-size="11.00" class="sc-notoserifcjksc">后，</text><text x="130.00" y="157.64" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="177.60" y="157.64" font-size="11.00" class="sc-notoserifcjksc">的分数从</text><text x="224.49 231.14 233.85 239.96" y="157.64" font-size="11.00" class="sc-loraregular">0.89</text><text x="249.21" y="157.64" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="285.10 291.76 294.46 300.82" y="157.64" font-size="11.00" class="sc-loraregular">0.90</text><text x="307.65" y="157.64" font-size="11.00" class="sc-notoserifcjksc">；这一变化不影响我们对其</text><text x="442.54 450.23 457.07 462.17" y="157.64" font-size="11.00" class="sc-loraregular">CB-1</text><text x="469.06" y="157.64" font-size="11.00" class="sc-notoserifcjksc">风险的分析。</text><text x="108.00" y="207.36" font-size="11.00" class="sc-notoserifcjksc">更正图</text><text x="143.89" y="207.36" font-size="11.00" class="sc-loraregular">2.2.5.1.A</text><text x="186.31" y="207.36" font-size="11.00" class="sc-notoserifcjksc">的图注，使其与已发布的格式一致。</text><text x="108.00" y="223.55" font-size="11.00" class="sc-notoserifcjksc">更正图</text><text x="143.89" y="223.55" font-size="11.00" class="sc-loraregular">5.2.2.1.A</text><text x="186.31" y="223.55" font-size="11.00" class="sc-notoserifcjksc">及其在第</text><text x="233.20" y="223.55" font-size="11.00" class="sc-loraregular">5.2.2.1</text><text x="266.03" y="223.55" font-size="11.00" class="sc-notoserifcjksc">节中的相应分析：该图最初报告的是竞赛结束前的初步</text><text x="108.00" y="239.17" font-size="11.00" class="sc-notoserifcjksc">漏洞赏金结果。最终结果显示，</text><text x="262.00 269.69 272.68 278.29 284.86 291.44 297.40 300.29 309.03 315.59 322.16 327.25 330.15 336.11 338.81" y="239.17" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="347.89" y="239.17" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率（</text><text x="424.89 430.49 434.85 439.11 444.79 450.64 456.55 459.44 464.53 471.10 476.90 482.69 488.65 493.75 498.84 501.73 506.42 512.02 516.28" y="239.17" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="522.24" y="239.17" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="108.00" y="254.79" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="121.89 129.58 132.57 138.18 144.75 151.33 157.29 160.18 168.92 175.49 182.05 187.15 190.04 196.00 198.35" y="254.79" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="206.32" y="254.79" font-size="11.00" class="sc-notoserifcjksc">相同，而初步结果曾显示</text><text x="330.21 338.95 345.51 352.08 357.17 360.07 366.03 368.38" y="254.79" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="376.35" y="254.79" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性更强。</text><text x="108.00" y="273.91" font-size="11.00" class="sc-notoserifcjksc">更正第</text><text x="143.89 150.25 152.96 159.08 161.68 168.04 170.74" y="273.91" font-size="11.00" class="sc-loraregular">6.3.6.4</text><text x="179.60" y="273.91" font-size="11.00" class="sc-notoserifcjksc">节中对评估量表的描述。我们使用的是</text><text x="369.49 373.36 378.74" y="273.91" font-size="11.00" class="sc-loraregular">1-5</text><text x="387.63" y="273.91" font-size="11.00" class="sc-notoserifcjksc">分量表，而非</text><text x="456.52" y="273.91" font-size="11.00" class="sc-loraregular">0-5</text><text x="477.62" y="273.91" font-size="11.00" class="sc-notoserifcjksc">分量表。</text><text x="72.00" y="306.41" font-size="11.00" class="sc-lorabold">2026</text><text x="99.94" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">年</text><text x="113.83" y="306.41" font-size="11.00" class="sc-lorabold">6</text><text x="123.05" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">月</text><text x="136.94" y="306.41" font-size="11.00" class="sc-lorabold">3</text><text x="146.00" y="306.41" font-size="11.00" class="sc-notoserifcjkscbold">日</text><text x="108.00" y="322.61" font-size="11.00" class="sc-notoserifcjksc">更正：第</text><text x="154.89" y="322.61" font-size="11.00" class="sc-loraregular">8.11.3</text><text x="183.51" y="322.61" font-size="11.00" class="sc-notoserifcjksc">节中的</text><text x
