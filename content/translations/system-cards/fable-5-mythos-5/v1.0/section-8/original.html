<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p282.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 282 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">282</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第二，我们剔除了</text><text x="162.89" y="82.61" font-size="11.00" class="sc-loraregular">26</text><text x="178.05" y="82.61" font-size="11.00" class="sc-notoserifcjksc">条其</text><text x="202.94" y="82.61" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="257.70" y="82.61" font-size="11.00" class="sc-notoserifcjksc">代码未能生成</text><text x="326.60" y="82.61" font-size="11.00" class="sc-loraregular">STEP</text><text x="356.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">文件的记录。此外，我们更新了评分</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">方式，使其除</text><text x="140.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Workplane</text><text x="199.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外也接受原始形状。在</text><text x="312.13" y="98.23" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="356.47" y="98.23" font-size="11.00" class="sc-notoserifcjksc">等模型上，我们注意到，由于输出中</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的这一风格差异，原始形状会报错，尽管其几何形状在其他方面是等价的。不过，与前两项改动</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">不同，这项评分改动并未体现在我们的分数中。虽然我们预计其影响可以忽略不计，但我们将在</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">未来的系统卡中报告包含该评分改动的分数。我们已在</text><text x="338.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">GitHub</text><text x="379.02" y="145.09" font-size="11.00" class="sc-notoserifcjksc">上向参考代码仓库提出了系统提</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">示词和评分方面的改动。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均启用自适应思考和</text><text x="272.89" y="212.14" font-size="11.00" class="sc-loraregular">max</text><text x="297.13" y="212.14" font-size="11.00" class="sc-notoserifcjksc">推理强度，且不使用工具。我们在已发布的</text><text x="509.02 513.02 517.61 520.38 526.74 533.57" y="212.14" font-size="11.00" class="sc-loraregular">17,900</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="85.89" y="227.76" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="152.76" y="227.76" font-size="11.00" class="sc-notoserifcjksc">文件中的</text><text x="199.65 203.66 208.25 211.02 217.20 222.12" y="227.76" font-size="11.00" class="sc-loraregular">17,874</text><text x="387.88" y="227.76" font-size="11.00" class="sc-loraregular">26</text><text x="403.03" y="227.76" font-size="11.00" class="sc-notoserifcjksc">条记录），并报告五次运行</text><text x="72.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">平均的体素</text><text x="129.89" y="243.38" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="147.82" y="243.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="158.82" y="243.38" font-size="11.00" class="sc-loraregular sc-k">voxel IoU</text><text x="206.26" y="243.38" font-size="11.00" class="sc-notoserifcjksc">）分数。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="276.91" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="210.11" y="276.91" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="232.11" y="276.91" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="320.35" y="276.91" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="356.24" y="276.91" font-size="11.00" class="sc-loraregular sc-k">0.384</text><text x="386.77" y="276.91" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="422.66" y="276.91" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="440.59" y="276.91" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="451.59" y="276.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="72.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="208.77" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="244.67" y="292.53" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="265.49" y="292.53" font-size="11.00" class="sc-notoserifcjksc">分数分别为</text><text x="323.38" y="292.53" font-size="11.00" class="sc-loraregular sc-k">0.273</text><text x="352.74" y="292.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="366.64" y="292.53" font-size="11.00" class="sc-loraregular sc-k">0.355</text><text x="394.11" y="292.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="603.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="603.69" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 109.93 112.03 117.57 121.04 123.41 129.36 134.20 139.94 144.60 150.08 156.20 162.22 169.05 171.41 177.55 180.49 184.86 187.80 192.90 198.64 203.44 209.63 214.72 220.09" y="603.69" font-size="9.00" class="sc-lorabold">8.16.4.A] BenchCAD Vision2Code</text><text x="227.29" y="603.69" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="254.29" y="603.69" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="337.66" y="603.69" font-size="9.00" class="sc-loraregular">max</text><text x="357.49" y="603.69" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估。体素</text><text x="449.86" y="603.69" font-size="9.00" class="sc-loraregular sc-k">IoU</text><text x="466.89" y="603.69" font-size="9.00" class="sc-notoserifcjksc">分数为五次运行的</text><text x="72.00" y="615.39" font-size="9.00" class="sc-notoserifcjksc">平均值。图中显示</text><text x="146.37" y="615.39" font-si ouse</text><text x="374.96" y="82.39" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="410.86" y="82.39" font-size="11.00" class="sc-loraregular sc-k">Language Agent Biology</text><text x="72.00" y="98.01" font-size="11.00" class="sc-loraregular sc-k">Benchmark</text><text x="130.06" y="98.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="141.06 147.60 154.49 161.33 166.71 173.55 179.51 186.19 192.04" y="98.01" font-size="11.00" class="sc-loraregular">LAB-Bench</text><text x="198.63" y="98.01" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.63" y="94.34" font-size="6.60" class="sc-loraregular">60</text><text x="217.55" y="98.01" font-size="11.00" class="sc-notoserifcjksc">的一部分，后者评估</text><text x="319.44" y="98.01" font-size="11.00" class="sc-loraregular">AI</text><text x="332.90" y="98.01" font-size="11.00" class="sc-notoserifcjksc">在实际科学研究任务上的能力。</text><text x="72.00" y="147.36" font-size="11.00" class="sc-notoserifcjksc">我们在公开集的</text><text x="151.89" y="147.36" font-size="11.00" class="sc-loraregular">181</text><text x="168.98" y="147.36" font-size="11.00" class="sc-notoserifcjksc">道题目上评估模型，并对五次运行的得分取平均。在所有运行中（无论是否</text><text x="72.00" y="162.98" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="162.98" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="136.44" y="162.98" font-size="11.00" class="sc-notoserifcjksc">工具），模型均启用自适应思考和</text><text x="304.33" y="162.98" font-size="11.00" class="sc-loraregular">max</text><text x="328.56" y="162.98" font-size="11.00" class="sc-notoserifcjksc">推理强度。使用</text><text x="408.46" y="162.98" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="448.00" y="162.98" font-size="11.00" class="sc-notoserifcjksc">工具时，我们为模</text><text x="72.00" y="178.60" font-size="11.00" class="sc-notoserifcjksc">型提供一个容器（其中包含该图像文件并安装了标准</text><text x="327.89" y="178.60" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="367.44" y="178.60" font-size="11.00" class="sc-notoserifcjksc">库）以及一个图像裁剪工具。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.44 99.32 106.17 111.54 118.39 124.35 131.03 136.88 143.47 146.36 152.33 155.42 161.51 170.12" y="244.55" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="179.90" y="244.55" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="201.90" y="244.55" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="290.14" y="244.55" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分为</text><text x="392.03" y="244.55" font-size="11.00" class="sc-loraregular">88.9%</text><text x="423.03" y="244.55" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分为</text><text x="72.00" y="260.17" font-size="11.00" class="sc-loraregular sc-k">90.7%</text><text x="102.01" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="113.01" y="260.17" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="235.89" y="260.17" font-size="11.00" class="sc-notoserifcjksc">的相应得分分别为</text><text x="326.78" y="260.17" font-size="11.00" class="sc-loraregular">82.4%</text><text x="360.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="373.90" y="260.17" font-size="11.00" class="sc-loraregular sc-k">89.3%</text><text x="404.59" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。在测试</text><text x="451.48" y="260.17" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="72.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">时，鉴于</text><text x="118.89 125.44 132.32 139.17 144.55 151.39 157.35 164.03 169.88 176.47 179.36 185.33 188.42 194.51 203.12" y="275.79" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="212.90" y="275.79" font-size="11.00" class="sc-notoserifcjksc">侧重于生物学相关图像，我们测得其在该基准测试上的表现有所下</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">降。这一下 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p287.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 287 页"><text x="72.00 80.29 83.42 87.97 96.32 99.45 107.74 111.12 121.16 129.60 138.41 143.40 151.98 155.41 162.89 166.27 174.49 182.51 191.32 198.26 206.55 214.98 218.41 226.85" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.16.8 CharXiv Reasoning</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">61</text><text x="80.28 89.84 94.99 101.06 106.59 109.12 111.75 117.85 120.30 122.83 125.46 130.81 134.68 137.31 142.47 145.19 147.64 150.27 153.32 158.69 164.83 169.98 175.27 178.32 180.78 183.41 190.40 196.38 201.54 205.25 211.74 214.55 219.60 222.22 225.45 232.44 238.29 244.27 249.68 252.31 256.57 261.99 267.96 273.80 278.43 281.40 285.27 291.12 295.62 300.49 304.08 306.54 309.17 316.78 319.75 323.61 331.22 337.19 343.01" y="704.47" font-size="10.00" class="sc-loraregular">Wang, Z., et al. (2024). CharXiv [Code repository]. GitHub.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.92 114.69 117.66 121.53 127.52 133.48 139.30 141.76 147.03 152.88 161.62 168.25 174.22 178.55 181.36 187.42 192.69 198.04 201.91 207.75 213.82 218.71 224.78 227.50 232.98 239.69 246.68 252.67 257.82 261.53 268.02 270.83" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://github.com/princeton-nlp/CharXiv</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">287</text><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="170.11" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是一套全面的图表理解评估套件，由来自</text><text x="371.00" y="111.05" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="399.44" y="111.05" font-size="11.00" class="sc-notoserifcjksc">论文的</text><text x="435.33 441.24 444.01 450.14 455.88" y="111.05" font-size="11.00" class="sc-loraregular">2,323</text><text x="464.91" y="111.05" font-size="11.00" class="sc-notoserifcjksc">张真实世界图</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">表构建而成，涵盖八个主要科学学科。该基准测试检验模型能否综合复杂科学图表中的视觉信</text><text x="72.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">息，回答需要多步推理的问题。</text><text x="72.00" y="191.99" font-size="11.00" class="sc-notoserifcjksc">在所有运行中（无论是否使用</text><text x="217.89" y="191.99" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="257.44" y="191.99" font-size="11.00" class="sc-notoserifcjksc">工具），模型均启用自适应思考和</text><text x="425.33" y="191.99" font-size="11.00" class="sc-loraregular">max</text><text x="449.56" y="191.99" font-size="11.00" class="sc-notoserifcjksc">推理强度。使用</text><text x="72.00" y="207.60" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="111.54" y="207.60" font-size="11.00" class="sc-notoserifcjksc">工具时，我们为模型提供一个容器（其中包含该图像文件并安装了标准</text><text x="455.44" y="207.60" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="494.98" y="207.60" font-size="11.00" class="sc-notoserifcjksc">库）以及</text><text x="72.00" y="223.23" font-size="11.00" class="sc-notoserifcjksc">一个图像裁剪工具。模型的评分使用与参考实现</text><text x="303.00" y="219.56" font-size="6.60" class="sc-loraregular">61</text><text x="309.22" y="223.23" font-size="11.00" class="sc-notoserifcjksc">相同的提示词。不过，我们使用</text><text x="466.11" y="223.23" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="238.85" font-size="11.00" class="sc-loraregular sc-k">4.6</text><text x="89.81" y="238.85" font-size="11.00" class="sc-notoserifcjksc">作为评分模型，而非</text><text x="191.70" y="238.85" font-size="11.00" class="sc-loraregular sc-k">GPT-4o</text><text x="230.85" y="238.85" font-size="11.00" class="sc-notoserifcjksc">。我们在验证集的</text><text x="321.74 325.75 328.35 335.19 342.02" y="238.85" font-size="11.00" class="sc-loraregular">1,000</text><text x="351.75" y="238.85" font-size="11.00" class="sc-notoserifcjksc">道题目上评估模型，并对五次运行的得</text><text x="72.00" y="254.46" font-size="11.00" class="sc-notoserifcjksc">分取平均。</text><text x="72.00" y="321.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="321.53" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="184.00" y="321.53" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="206.00" y="321.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="294.24" y="321.53" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分为</text><text x="396.14" y="321.53" font-size="11.00" class="sc-loraregular">88.9%</text><text x="427.13" y="321.53" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分为</text><text x="72.00" y="337.15" font-size="11.00" class="sc-loraregular">93.5%</text><text x="102.76" y="337.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="113.76" y="337.15" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="236.64" y="337.15" font-size="11.00" class="sc-notoserifcjksc">的相应得分分别为</text><text x="327.53" y="337.15" font-size="11.00" class="sc-loraregular">86.2%</text><text x="361.15" y="337.15" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="375.04" y="337.15" font-size="11.00" class="sc-loraregular">92.5%</text><text x="405.58" y="337.15" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://github.com/princeton-nlp/CharXiv" rel="noopener"><rect x="345.47" y="694.41" width="2.63" height="12.80" fill="transparent"/></a><a href="https://github.com/princeton-nlp/CharXiv" rel="noopener"><rect x="72.00" y="707.20" width="203.88" height="12.80" fill="transparent"/></a></svg></div>

aregular">288</text><text x="72.00" y="80.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="80.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 110.16 112.26 117.79 121.27 123.63 129.83 135.41 140.13 143.96 150.26 153.14 157.98 160.34 166.39 171.23 175.95 180.32 185.41 191.15 194.09 199.84" y="80.05" font-size="9.00" class="sc-lorabold">8.16.8.A] CharXiv Reasoning</text><text x="207.22" y="80.05" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="234.22" y="80.05" font-size="9.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="305.33" y="80.05" font-size="9.00" class="sc-notoserifcjksc">在不使用工具的条件下评估。</text><text x="422.33" y="80.05" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="453.65" y="80.05" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="72.00" y="91.75" font-size="9.00" class="sc-loraregular">max</text><text x="91.83" y="91.75" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="238.19" y="91.75" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="270.55" y="91.75" font-size="9.00" class="sc-notoserifcjksc">工具。</text><text x="297.55" y="91.75" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="328.88" y="91.75" font-size="9.00" class="sc-notoserifcjksc">模型的分数为五次运行的平均值。图中显示</text><text x="502.25" y="91.75" font-size="9.00" class="sc-loraregular">95%</text><text x="522.55" y="91.75" font-size="9.00" class="sc-notoserifcjksc">置信</text><text x="72.00" y="103.45" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="72.00 78.24 84.09 88.78 94.68 100.64 107.32 113.49 120.06 126.49 130.75 136.13 142.80 147.48" y="164.56" font-size="11.00" class="sc-loraregular">ScreenSpot-Pro</text><text x="153.92" y="160.90" font-size="6.60" class="sc-loraregular">62</text><text x="164.17" y="164.56" font-size="11.00" class="sc-notoserifcjksc">是一项</text><text x="200.06" y="164.56" font-size="11.00" class="sc-loraregular">GUI</text><text x="223.28" y="164.56" font-size="11.00" class="sc-notoserifcjksc">定位基准测试，用于检验模型能否根据自然语言指令，在专业桌</text><text x="72.00" y="180.18" font-size="11.00" class="sc-notoserifcjksc">面应用程序的高分辨率截图中精确定位特定的用户界面元素。该基准测试包含</text><text x="448.89 452.90 455.67 461.66 467.85" y="180.18" font-size="11.00" class="sc-loraregular">1,581</text><text x="474.75" y="180.18" font-size="11.00" class="sc-notoserifcjksc">个由专家标注</text><text x="72.00" y="195.80" font-size="11.00" class="sc-notoserifcjksc">的任务，涵盖三种操作系统上的</text><text x="228.89" y="195.80" font-size="11.00" class="sc-loraregular sc-k">23</text><text x="243.66" y="195.80" font-size="11.00" class="sc-notoserifcjksc">个专业应用程序（包括</text><text x="356.55" y="195.80" font-size="11.00" class="sc-loraregular sc-k">IDE</text><text x="375.16" y="195.80" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="386.16" y="195.80" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="411.71" y="195.80" font-size="11.00" class="sc-notoserifcjksc">软件和创意工具），其目</text><text x="72.00" y="211.42" font-size="11.00" class="sc-notoserifcjksc">标元素平均占屏幕面积不到</text><text x="206.89" y="211.42" font-size="11.00" class="sc-loraregular sc-k">0.1%</text><text x="229.83" y="211.42" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">图像及相应的真值会被缩放，以适配每个模型所支持的最大图像分辨率</text><text x="413.00" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="424.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="448.89" y="278.13" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="293.75" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="293.75" font-size="11.00" class="sc-notoserifcjksc">，我们将图像缩放至任一图像维度最大</text><text x="302.53 306.53 309.30 315.30 321.66 327.84 334.35" y="293.75" font-size="11.00" class="sc-loraregular">1,568px</text><text x="340.19" y="293.75" font-size="11.00" class="sc-notoserifcjksc">，且最多</text><text x="387.08 391.09 393.86 399.86 406.21" y="293.75" font-size="11.00" class="sc-loraregular">1,568</text><text x="415.30" y="293.75" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="429.19" y="293.75" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="458.35" y="293.75" font-size="11.00" class="sc-notoserifcjksc">。对于</text><text x="494.25" y="293.75" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="309.37" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="309.37" font-size="11.00" class="sc-notoserifcjksc">，我们将图像缩放至任一图像维度最大</text><text x="308.95 314.86 317.63 323.62 328.70 335.05 341.57" y="309.37" font-size="11.00" class="sc-loraregular">2,576px</text><text x="347.41" y="309.37" font-size="11.00" class="sc-notoserifcjksc">，且最多</text><text x="394.30 400.26 402.68 407.75 413.94" y="309.37" font-size="11.00" class="sc-loraregular">4,784</text><text x="422.80" y="309.37" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="436.69" y="309.37" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="465.86" y="309.37" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="375.27" font-size="11.00" class="sc-notoserifcjksc">此前，我们会在提示词中包含输入图像的尺寸，并对图像进行右下方填充。在评估</text><text x="470.89" y="375.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="390.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="390.89" font-size="11.00" class="sc-notoserifcjksc">时，我们注意到少数情况下，模型在其文件系统中看到完全相同但分辨率不同的图像时</text><text x="72.00" y="422.13" font-size="11.00" class="sc-notoserifcjksc">使用新的提示词格式重新评估了所有先前的模型。</text><text x="72.00" y="488.61" font-size="11.00" class="sc-notoserifcjksc">在所有运行中（无论是否使用</text><text x="217.89" y="488.61" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="257.44" y="488.61" font-size="11.00" class="sc-notoserifcjksc">工具），模型均启用自适应思考和</text><text x="425.33" y="488.61" font-size="11.00" class="sc-loraregular">max</text><text x="449.56" y="488.61" font-size="11.00" class="sc-notoserifcjksc">推理强度。使用</text><text x="72.00" y="504.23" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="111.54" y="504.23" font-size="11.00" class="sc-notoserifcjksc">工具时，我们为模型提供一个容器（其中包含该图像文件并安装了标准</text><text x="455.44" y="504.23" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="494.98" y="504.23" font-size="11.00" class="sc-notoserifcjksc">库）以及</text><text x="72.00" y="519.85" font-size="11.00" class="sc-notoserifcjksc">一个图像裁剪工具。我们在全部</text><text x="228.89 232.90 235.67 241.66 247.85" y="519.85" font-size="11.00" class="sc-loraregular">1,581</text><text x="254.75" y="519.85" font-size="11.00" class="sc-notoserifcjksc">条指令上评估模型，并对五次运行的得分取平均。</text><text x="72.00" y="585.77" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.13 97.98 102.67 108.58 114.54 121.21 127.39 133.95 140.39 144.64 150.02 156.69 161.38" y="585.77" font-size="11.00" class="sc-loraregular">ScreenSpot-Pro</text><text x="170.70" y="585.77" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="192.70" y="585.77" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="280.95" y="585.77" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分为</text><text x="382.84" y="585.77" font-size="11.00" class="sc-loraregular sc-k">87.3%</text><text x="412.01" y="585.77" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分为</text><text x="72.00" y="601.39" font-size="11.00" class="sc-loraregular sc-k">90.7%</text><text x="102.01" y="601.39" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="113.01" y="601.39" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="235.89" y="601.39" font-size="11.00" class="sc-notoserifcjksc">的相应得分分别为</text><text x="326.78" y="601.39" font-size="11.00" class="sc-loraregular sc-k">79.3%</text><text x="359.33" y="601.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="373.22" y="601.39" font-size="11.00" class="sc-loraregular sc-k">93.0%</text><text x="404.65" y="601.39" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2504.07981" rel="noopener"><rect x="153.18" y="707.20" width="156.33" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p289.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 289 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 102.93 106.31 116.50 120.81 125.13 128.56 136.36 144.37 154.60" y="454.54" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.1 OfficeQA</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">289</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 110.05 112.15 117.68 121.16 123.53 128.91 133.57 137.82 142.66 147.50 153.20 158.49 163.90 168.99 172.64 176.88 182.63 186.88" y="366.99" font-size="9.00" class="sc-lorabold">8.16.9.A] ScreenSpot-Pro</text><text x="194.34" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="221.34" y="366.99" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="304.70" y="366.99" font-size="9.00" class="sc-loraregular">max</text><text x="324.53" y="366.99" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别使用和不使用</text><text x="470.90" y="366.99" font-size="9.00" class="sc-loraregular sc-k">Python</text><text x="503.25" y="366.99" font-size="9.00" class="sc-notoserifcjksc">工具。分</text><text x="72.00" y="378.69" font-size="9.00" class="sc-notoserifcjksc">数为五次运行的平均值。图中显示</text><text x="209.37" y="378.69" font-size="9.00" class="sc-loraregular">95%</text><text x="229.67" y="378.69" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="413.64" font-size="14.00" class="sc-poppinssemibold">8.17</text><text x="100.71" y="413.64" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="478.64" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46" y="478.64" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="193.13" y="478.64" font-size="11.00" class="sc-notoserifcjksc">发布的一项公开基准测试，评估模型在大量历史美国《财政部公报》</text><text x="72.00" y="494.26" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="494.26" font-size="11.00" class="sc-loraregular sc-k">U.S. Treasury Bulletin</text><text x="193.21" y="494.26" font-size="11.00" class="sc-notoserifcjksc">）文档语料上进行端到端有据推理的能力：模型必须在整个语料中定位</text><text x="72.00" y="509.88" font-size="11.00" class="sc-notoserifcjksc">相关表格，并基于这些表格进行精确的数值推理。我们以智能体方式进行评估，相关文档已预先</text><text x="72.00" y="525.50" font-size="11.00" class="sc-notoserifcjksc">选定，并在沙箱化的环境中以提取出的文本形式提供；</text><text x="406.25" y="525.50" font-size="11.00" class="sc-notoserifcjksc">是其中难度更高的</text><text x="497.14" y="525.50" font-size="11.00" class="sc-loraregular">133</text><text x="516.29" y="525.50" font-size="11.00" class="sc-notoserifcjksc">题子</text><text x="72.00" y="541.12" font-size="11.00" class="sc-notoserifcjksc">集，推荐用于评估前沿模型。</text><text x="72.00" y="591.98" font-size="11.00" class="sc-notoserifcjksc">使用我们内部的智能体运行框架，</text><text x="237.00" y="591.98" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="325.24" y="591.98" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="388.70" y="591.98" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="424.59" y="591.98" font-size="11.00" class="sc-loraregular">79%</text><text x="445.59" y="591.98" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="72.00" y="607.60" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="107.89" y="607.60" font-size="11.00" class="sc-loraregular sc-k">67.1%</text><text x="135.04" y="607.60" font-size="11.00" class="sc-notoserifcjksc">（精确匹配评分，五次试验的平均值，在包括安全防护分类器在内的生产服务配置</text><text x="72.00" y="623.22" font-size="11.00" class="sc-notoserifcjksc">下评估），与</text><text x="140.89" y="623.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="226.78" y="623.22" font-size="11.00" class="sc-notoserifcjksc">相当（在相同运行框架和评分方式下分别为</text><text x="438.67" y="623.22" font-size="11.00" class="sc-loraregular sc-k">77.6%</text><text x="469.75" y="623.22" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="483.64" y="623.22" font-size="11.00" class="sc-loraregular">66.2%</text><text x="514.54" y="623.22" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="672.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="672.92" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="143.57" y="672.92" font-size="11.00" class="sc-notoserifcjksc">自行开展的</text><text x="271.71" y="672.92" font-size="11.00" class="sc-notoserifcjksc">评估中（与我们的评估不同，该评估利用模型的视觉能</text><text x="72.00" y="688.54" font-size="11.00" class="sc-notoserifcjksc">力将文档作为图像读取，而非读取提取出的文本），</text><text x="325.00" y="688.54" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="401.69" y="688.54" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="415.59" y="688.54" font-size="11.00" class="sc-loraregular sc-k">57.9%</text><text x="447.69" y="688.54" font-size="11.00" class="sc-notoserifcjksc">达到最先进水平，</text><text x="72.00" y="704.16" font-size="11.00" class="sc-notoserifcjksc">领先于</text><text x="107.89" y="704.16" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="149.34" y="704.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="160.34" y="704.16" font-size="11.00" class="sc-loraregular sc-k">52.6%</text><text x="190.77" y="704.16" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="215.66" y="704.16" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="298.66" y="704.16" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="309.66" y="704.16" font-size="11.00" class="sc-loraregular">48.1%</text><text x="338.08" y="704.16" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p290.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 290 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 105.88 109.26 115.95 119.38 127.82 136.63 145.06 152.86 160.88 164.26 173.32 182.13 190.15 198.58" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.2 Finance Agent</text><text x="72.00 80.29 83.42 87.97 95.25 98.38 106.10 109.48 117.69 125.71 134.52 137.95 145.56 158.54 166.83 171.82 175.25 184.06 187.44 194.14 197.57 206.00 214.81 223.25 231.05" y="226.53" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.3 Real-World Finance</text><text x="72.00 78.29 80.85 85.31 89.77 92.34 98.49 101.05 105.51 108.41 115.79 121.71 127.47 130.80 135.47 145.89 152.11 157.29 160.72 167.27 170.16 176.31 179.91 186.92 192.68 199.70 205.39 211.30 214.19 220.11" y="251.07" font-size="11.00" class="sc-lorabold">8.17.3.1 Real-World Finance v2</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">290</text><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular sc-k">Finance Agent</text><text x="147.35" y="111.05" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="161.24" y="111.05" font-size="11.00" class="sc-loraregular sc-k">Vals AI</text><text x="198.28" y="111.05" font-size="11.00" class="sc-notoserifcjksc">发布的一项公开基准测试，评估模型在智能体金融研究任务上的表现，</text><text x="292.00" y="126.67" font-size="11.00" class="sc-loraregular">SEC</text><text x="312.77" y="126.67" font-size="11.00" class="sc-notoserifcjksc">）文件进行研究。</text><text x="400.77" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Vals AI</text><text x="437.81" y="126.67" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上对</text><text x="72.00" y="142.29" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="101.51" y="142.29" font-size="11.00" class="sc-notoserifcjksc">进行了评估（使用自适应思考和</text><text x="258.41" y="142.29" font-size="11.00" class="sc-loraregular">max</text><text x="282.64" y="142.29" font-size="11.00" class="sc-notoserifcjksc">推理强度），发现其在</text><text x="395.53" y="142.29" font-size="11.00" class="sc-loraregular sc-k">Finance Agent Benchmark</text><text x="72.00" y="157.91" font-size="11.00" class="sc-loraregular">v2</text><text x="86.36" y="157.91" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="122.25" y="157.91" font-size="11.00" class="sc-loraregular">56.31%</text><text x="159.90" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的得分，高于</text><text x="228.79" y="157.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="314.68" y="157.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="328.58" y="157.91" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="370.02" y="157.91" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="416.92" y="157.91" font-size="11.00" class="sc-loraregular">53.92%</text><text x="456.47" y="157.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="470.37" y="157.91" font-size="11.00" class="sc-loraregular sc-k">51.76%</text><text x="503.72" y="157.91" font-size="11.00" class="sc-notoserifcjksc">），仅</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">次于</text><text x="96.89" y="173.53" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="180.91" y="173.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.83 84.77 90.45 93.44 98.82 109.33 115.77 120.49 123.48 130.06 132.95 138.92 142.02 148.69 154.37 161.05 166.84 172.80 175.70 181.25" y="283.00" font-size="11.00" class="sc-loraregular">Real-World Finance v2</text><text x="190.05" y="283.00" font-size="11.00" class="sc-notoserifcjksc">是一项内部开发的评估，用于评估模型完成金融专业人士所从事的那类</text><text x="72.00" y="314.24" font-size="11.00" class="sc-notoserifcjksc">实的输入材料产出可直接交付客户的工作成果。该套件包含</text><text x="360.89" y="314.24" font-size="11.00" class="sc-loraregular">294</text><text x="382.01" y="314.24" font-size="11.00" class="sc-notoserifcjksc">个复杂且贴近现实的任务，代表</text><text x="72.00" y="329.86" font-size="11.00" class="sc-notoserifcjksc">了金融专业人士的日常工作。</text><text x="72.00" y="396.34" font-size="11.00" class="sc-notoserifcjksc">由于这些任务的交付物是开放式的，而非单一正确答案，我们以两两比较的方式进行评估：两个</text><text x="72.00" y="411.96" font-size="11.00" class="sc-notoserifcjksc">模型尝试同一任务，由一个基于模型的评分者对两份工作成果表达偏好。我们报告正面对比胜率</text><text x="72.00" y="427.58" font-size="11.00" class="sc-notoserifcjksc">（以及由此推导出的</text><text x="173.89" y="427.58" font-size="11.00" class="sc-loraregular">Elo</text><text x="190.16" y="427.58" font-size="11.00" class="sc-notoserifcjksc">），这一方法与其他已发表的专业工作成果评估类似。这种基于偏好的</text><text x="72.00" y="443.20" font-size="11.00" class="sc-notoserifcjksc">方法还有一个优势：在未来的版本中，我们可以改进任务分布和用于两两比较的对照模型，同时</text><text x="72.00" y="458.82" font-size="11.00" class="sc-notoserifcjksc">仍能随时间推移在一致的基础上报告胜率和</text><text x="283.89" y="458.82" font-size="11.00" class="sc-loraregular">Elo</text><text x="300.16" y="458.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="542.08" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="542.08" font-size="11.00" class="sc-loraregular">294</text><text x="107.01" y="542.08" font-size="11.00" class="sc-notoserifcjksc">个任务的套件上共进行了</text><text x="230.91 236.81 239.59 245.55 251.91" y="542.08" font-size="11.00" class="sc-loraregular">2,491</text><text x="258.81" y="542.08" font-size="11.00" class="sc-notoserifcjksc">次两两评分，排除平局，每次偏好均由一个基于模型的评</text><text x="72.00" y="557.70" font-size="11.00" class="sc-notoserifcjksc">分者（</text><text x="105.00" y="557.70" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="187.99" y="557.70" font-size="11.00" class="sc-notoserifcjksc">）给出。结果显示，</text><text x="286.99" y="557.70" font-size="11.00" class="sc-loraregular sc-k">Fable/Mythos 5</text><text x="370.74" y="557.70" font-size="11.00" class="sc-notoserifcjksc">相对</text><text x="395.63" y="557.70" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="490.79" y="557.70" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="504.68" y="557.70" font-size="11.00" class="sc-loraregular">90%</text><text x="72.00" y="573.32" font-size="11.00" class="sc-notoserifcjksc">的比较中被偏好，相对</text><text x="184.89" y="573.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="270.78" y="573.32" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="284.67" y="573.32" font-size="11.00" class="sc-loraregular sc-k">74%</text><text x="305.12" y="573.32" font-size="11.00" class="sc-notoserifcjksc">，相对</text><text x="341.02" y="573.32" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="463.90" y="573.32" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="477.79" y="573.32" font-size="11.00" class="sc-loraregular">64%</text><text x="499.68" y="573.32" font-size="11.00" class="sc-notoserifcjksc">。作为</text><text x="72.00" y="588.94" font-size="11.00" class="sc-notoserifcjksc">对评分者的一致性检验，</text><text x="193.00" y="588.94" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="315.88" y="588.94" font-size="11.00" class="sc-notoserifcjksc">相对</text><text x="340.77" y="588.94" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="435.94" y="588.94" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="449.83" y="588.94" font-size="11.00" class="sc-loraregular">88%</text><text x="474.66" y="588.94" font-size="11.00" class="sc-notoserifcjksc">的比较中被偏</text><text x="72.00" y="604.56" font-size="11.00" class="sc-notoserifcjksc">好，相对</text><text x="118.89" y="604.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="204.78" y="604.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="218.67" y="604.56" font-size="11.00" class="sc-loraregular">65%</text><text x="240.60" y="604.56" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="265.49" y="604.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="351.38" y="604.56" font-size="11.00" class="sc-notoserifcjksc">相对</text><text x="376.27" y="604.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="471.43" y="604.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="485.33" y="604.56" font-size="11.00" class="sc-loraregular">82%</text><text x="72.00" y="620.18" font-size="11.00" class="sc-notoserifcjksc">与预期的能力排序一致。</text><text x="193.00" y="620.18" font-size="11.00" class="sc-loraregular">Elo</text><text x="212.16" y="620.18" font-size="11.00" class="sc-notoserifcjksc">评分是基于相同两两胜负结果的</text><text x="369.05 375.81 380.49 386.17 392.75 395.74 401.65 407.46 413.95 420.45 426.41 431.17 436.12" y="620.18" font-size="11.00" class="sc-loraregular">Bradley–Terry</text><text x="444.82" y="620.18" font-size="11.00" class="sc-notoserifcjksc">最大似然拟合，将</text><text x="72.00" y="635.80" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="167.16" y="635.80" font-size="11.00" class="sc-notoserifcjksc">固定为</text><text x="203.05 207.06 209.67 216.50 223.33" y="635.80" font-size="11.00" class="sc-loraregular">1,000</text><text x="230.17" y="635.80" font-size="11.00" class="sc-notoserifcjksc">，并采用标准的</text><text x="310.06" y="635.80" font-size="11.00" class="sc-loraregular">400</text><text x="332.58" y="635.80" font-size="11.00" class="sc-notoserifcjksc">分</text><text x="72.00" y="651.42" font-size="11.00" class="sc-notoserifcjksc">中保持这一锚定不变，以便评估演进时分数仍可比较。在此标度上，</text><text x="402.00" y="651.42" font-size="11.00" class="sc-loraregular sc-k">Fable/Mythos 5</text><text x="485.74" y="651.42" font-size="11.00" class="sc-notoserifcjksc">的评分为</text><text x="72.00 76.00 78.78 84.64 89.56" y="667.04" font-size="11.00" class="sc-loraregular">1,374</text><text x="95.53" y="667.04" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="106.53" y="667.04" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="229.41" y="667.04" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="243.30 247.31 250.08 256.21 262.79" y="667.04" font-size="11.00" class="sc-loraregular">1,307</text><text x="267.88" y="667.04" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="278.88" y="667.04" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="364.77" y="667.04" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="378.66 382.66 385.43 391.34 397.25" y="667.04" font-size="11.00" class="sc-loraregular">1,222</text><text x="403.17" y="667.04" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p291.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 291 页"><text x="72.00 78.29 80.85 85.31 89.77 92.34 98.49 101.05 106.91 109.80 117.19 123.10 128.86 132.19 136.86 147.28 153.51 158.68 162.11 168.66 171.56 177.71 181.31 188.32 194.08 201.09 206.79 212.70 215.59 221.50" y="313.08" font-size="11.00" class="sc-lorabold">8.17.3.2 Real-World Finance v1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">291</text><text x="72.00" y="273.58" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="273.58" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 114.28 116.38 121.91" y="273.58" font-size="9.00" class="sc-lorabold">8.17.3.1.A]</text><text x="127.75" y="273.58" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="139.12" y="273.58" font-size="9.00" class="sc-lorabold sc-k">74%</text><text x="158.60" y="273.58" font-size="9.00" class="sc-notoserifcjkscbold">的两两比较中，该评估的评分者更偏好</text><text x="313.96" y="273.58" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5</text><text x="375.30" y="273.58" font-size="9.00" class="sc-notoserifcjksc">，而非</text><text x="404.67" y="273.58" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="472.57" y="273.58" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="344.98" font-size="11.00" class="sc-notoserifcjksc">为与先前的系统卡保持连续性，我们还报告</text><text x="283.89 290.72 296.66 302.34 305.33 310.71 321.23 327.66 332.38 335.37 341.95 344.84 350.82 353.91 360.59 366.26 372.94 378.74 384.70 387.59 393.15" y="344.98" font-size="11.00" class="sc-loraregular">Real-World Finance v1</text><text x="400.04" y="344.98" font-size="11.00" class="sc-notoserifcjksc">的结果。这是一个包含</text><text x="512.93" y="344.98" font-size="11.00" class="sc-loraregular">53</text><text x="527.95" y="344.98" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="360.61" font-size="11.00" class="sc-notoserifcjksc">任务的精选子集，由基于模型的评分者（</text><text x="270.00" y="360.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="354.43" y="360.61" font-size="11.00" class="sc-notoserifcjksc">系列评分者，</text><text x="420.43" y="360.61" font-size="11.00" class="sc-loraregular">max</text><text x="444.66" y="360.61" font-size="11.00" class="sc-notoserifcjksc">推理强度）对照参</text><text x="72.00" y="376.23" font-size="11.00" class="sc-notoserifcjksc">考答案进行评估。以下分数不能与先前发布的</text><text x="294.89 301.72 307.66 313.34 316.33 321.71 332.23 338.66 343.38 346.37 352.95 355.84 361.82 364.91 371.59 377.26 383.94 389.74" y="376.23" font-size="11.00" class="sc-loraregular">Real-World Finance</text><text x="398.59" y="376.23" font-size="11.00" class="sc-notoserifcjksc">结果直接比较，因为后者使</text><text x="72.00" y="391.85" font-size="11.00" class="sc-notoserifcjksc">用的是更早、更宽松的评分者。由于</text><text x="250.89 257.72 263.66 269.34 272.33 277.71 288.23 294.66 299.38 302.37 308.95 311.84 317.82 320.91 327.59 333.26 339.94 345.74 351.70 354.59 360.15" y="391.85" font-size="11.00" class="sc-loraregular">Real-World Finance v2</text><text x="368.95" y="391.85" font-size="11.00" class="sc-notoserifcjksc">取代了这一较小的精选子集，我们</text><text x="72.00" y="407.46" font-size="11.00" class="sc-notoserifcjksc">预计这将是我们报告</text><text x="173.89" y="407.46" font-size="11.00" class="sc-loraregular">v1</text><text x="186.35" y="407.46" font-size="11.00" class="sc-notoserifcjksc">结果的最后一个版本。</text><text x="72.00" y="458.33" font-size="11.00" class="sc-loraregular sc-k">Fable/Mythos 5</text><text x="155.74" y="458.33" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="180.64" y="458.33" font-size="11.00" class="sc-loraregular sc-k">70.0%</text><text x="211.30" y="458.33" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="236.20" y="458.33" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="356.18" y="458.33" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="367.18" y="458.33" font-size="11.00" class="sc-loraregular sc-k">70.9%</text><text x="397.54" y="458.33" font-size="11.00" class="sc-notoserifcjksc">）相当，高于</text><text x="466.44" y="458.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="473.95" font-size="11.00" class="sc-loraregular sc-k">4.7</text><text x="88.28" y="473.95" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="102.17" y="473.95" font-size="11.00" class="sc-loraregular">64.9%</text><text x="136.02" y="473.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="149.91" y="473.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="235.87" y="473.95" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="249.76" y="473.95" font-size="11.00" class="sc-loraregular sc-k">64.6%</text><text x="280.60" y="473.95" font-size="11.00" class="sc-notoserifcjksc">，表明该基准测试尚未饱和。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p292.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 292 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 106.79 110.17 115.94 123.96 132.77 141.58 145.01 148.39 157.45 166.26 174.28 182.71 187.55 190.93 199.11 207.13 215.57 223.36 231.80 245.30 254.11 259.10" y="402.08" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.4 Legal Agent Benchmark</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">292</text><text x="72.00" y="365.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="365.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 115.43 117.52 123.06" y="365.91" font-size="9.00" class="sc-lorabold">8.17.3.2.A]</text><text x="128.90" y="365.91" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="191.65" y="365.91" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="212.01" y="365.91" font-size="9.00" class="sc-loraregular sc-k">70.0%</text><text x="237.10" y="365.91" font-size="9.00" class="sc-notoserifcjksc">，与</text><text x="257.47" y="365.91" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="358.01" y="365.91" font-size="9.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="425.94" font-size="11.00" class="sc-loraregular sc-k">Legal Agent Benchmark</text><text x="192.63" y="422.27" font-size="6.60" class="sc-loraregular">63</text><text x="200.12" y="425.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="211.12" y="425.94" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="231.39" y="425.94" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="267.28" y="425.94" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Harvey AI</text><text x="319.86" y="425.94" font-size="11.00" class="sc-notoserifcjksc">团队创建的开源基准测试。该基准测试于</text><text x="72.00" y="441.56" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="99.82" y="441.56" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.71" y="441.56" font-size="11.00" class="sc-loraregular">5</text><text x="122.60" y="441.56" font-size="11.00" class="sc-notoserifcjksc">月发布，包含</text><text x="191.49" y="441.56" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="206.01" y="441.56" font-size="11.00" class="sc-notoserifcjksc">个不同执业领域的</text><text x="296.91 300.91 303.68 309.59 316.42" y="441.56" font-size="11.00" class="sc-loraregular">1,200</text><text x="326.16" y="441.56" font-size="11.00" class="sc-notoserifcjksc">多个任务。每个任务都包含一个封闭文档集</text><text x="72.00" y="457.18" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="457.18" font-size="11.00" class="sc-loraregular">.xlsx</text><text x="105.45" y="457.18" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="116.45" y="457.18" font-size="11.00" class="sc-loraregular sc-k">.docx</text><text x="143.77" y="457.18" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="154.77" y="457.18" font-size="11.00" class="sc-loraregular">.eml</text><text x="176.27" y="457.18" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="187.27" y="457.18" font-size="11.00" class="sc-loraregular sc-k">.pptx</text><text x="213.33" y="457.18" font-size="11.00" class="sc-notoserifcjksc">），其中包括电子邮件往来、律所模板、程序性文件以及其他客户</text><text x="72.00" y="472.80" font-size="11.00" class="sc-notoserifcjksc">案件材料，智能体必须从中筛查信息才能完成任务。任务指令以合伙人向授薪律师下达的简短</text><text x="523.00" y="472.80" font-size="11.00" class="sc-loraregular">“</text><text x="527.40" y="472.80" font-size="11.00" class="sc-notoserifcjksc">工</text><text x="105.00" y="488.42" font-size="11.00" class="sc-loraregular">”</text><text x="108.84" y="488.42" font-size="11.00" class="sc-notoserifcjksc">形式撰写。任务指令还规定了预期的输出文档及格式。评估采用通过</text><text x="438.84" y="488.42" font-size="11.00" class="sc-loraregular">/</text><text x="446.43" y="488.42" font-size="11.00" class="sc-notoserifcjksc">不通过方式，由</text><text x="72.00" y="504.04" font-size="11.00" class="sc-loraregular">LLM</text><text x="97.71" y="504.04" font-size="11.00" class="sc-notoserifcjksc">评判模型依据一套由专家撰写的评分细则标准进行（每个被评估任务的标准数：最少</text><text x="507.60" y="504.04" font-size="11.00" class="sc-loraregular sc-k">23</text><text x="72.00" y="519.66" font-size="11.00" class="sc-notoserifcjksc">条，中位数</text><text x="129.89" y="519.66" font-size="11.00" class="sc-loraregular">56</text><text x="145.14" y="519.66" font-size="11.00" class="sc-notoserifcjksc">条，最多</text><text x="192.03" y="519.66" font-size="11.00" class="sc-loraregular">194</text><text x="211.25" y="519.66" font-size="11.00" class="sc-notoserifcjksc">条）。</text><text x="244.25" y="519.66" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="267.42" y="519.66" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式仅在所有标准均满足时才视任务为成</text><text x="72.00" y="535.28" font-size="11.00" class="sc-notoserifcjksc">功。</text><text x="72.00" y="604.28" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 111.90 114.67 120.41 126.54" y="604.28" font-size="11.00" class="sc-loraregular">1,235</text><text x="135.44" y="604.28" font-size="11.00" class="sc-notoserifcjksc">道题目上测试了</text><text x="215.33" y="604.28" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="262.39" y="604.28" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="273.39 277.39 280.16 286.07 292.07" y="604.28" font-size="11.00" class="sc-loraregular">1,251</text><text x="298.97" y="604.28" font-size="11.00" class="sc-notoserifcjksc">道题目中有</text><text x="356.87" y="604.28" font-size="11.00" class="sc-loraregular">16</text><text x="370.12" y="604.28" font-size="11.00" class="sc-notoserifcjksc">道因数据缺陷被排除；排除项在测</text><text x="72.00" y="619.90" font-size="11.00" class="sc-notoserifcjksc">试前即已确定），取得了</text><text x="195  font-size="11.00" class="sc-loraregular sc-k">edit</text><text x="366.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="377.60" y="113.85" font-size="11.00" class="sc-loraregular sc-k">glob</text><text x="399.78" y="113.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="410.78" y="113.85" font-size="11.00" class="sc-loraregular sc-k">grep</text><text x="436.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">工具，而我们只提供</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular">bash</text><text x="98.65" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和一个</text><text x="134.55" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="174.09" y="129.47" font-size="11.00" class="sc-notoserifcjksc">工具。</text><text x="72.00 82.04 89.73 96.26 101.63 108.44 112.70 115.69 121.37" y="193.58" font-size="11.00" class="sc-loraregular">MCP-Atlas</text><text x="126.46" y="189.91" font-size="6.60" class="sc-loraregular">65</text><text x="136.77" y="193.58" font-size="11.00" class="sc-notoserifcjksc">评估语言模型通过</text><text x="227.66" y="193.58" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Model</text><text x="262.54" y="193.58" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Context Protocol</text><text x="350.09" y="193.58" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="361.09" y="193.58" font-size="11.00" class="sc-loraregular sc-k">MCP</text><text x="385.49" y="193.58" font-size="11.00" class="sc-notoserifcjksc">）进行真实世界工具使用的表</text><text x="72.00" y="224.82" font-size="11.00" class="sc-notoserifcjksc">果综合成准确的回复。任务涉及在接近生产环境的多个</text><text x="338.89" y="224.82" font-size="11.00" class="sc-loraregular sc-k">MCP</text><text x="366.18" y="224.82" font-size="11.00" class="sc-notoserifcjksc">服务器环境中进行多次工具调用，</text><text x="72.00" y="240.44" font-size="11.00" class="sc-notoserifcjksc">要求模型使用真实的</text><text x="173.89" y="240.44" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="193.97" y="240.44" font-size="11.00" class="sc-notoserifcjksc">和真实数据，处理错误与重试，并在不同服务器之间进行协调。</text><text x="501.97" y="240.44" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="256.06" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="256.06" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="146.29" y="256.06" font-size="11.00" class="sc-loraregular">83.3%</text><text x="179.90" y="256.06" font-size="11.00" class="sc-notoserifcjksc">的通过率，高于</text><text x="259.79" y="256.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="345.68" y="256.06" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="359.57" y="256.06" font-size="11.00" class="sc-loraregular">82.2%</text><text x="389.85" y="256.06" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.75 84.72 91.39 97.97 101.06 107.74 113.82 119.20 126.04 132.01 138.68 144.53 151.12 154.02" y="349.34" font-size="11.00" class="sc-loraregular">Vending-Bench 2</text><text x="162.82" y="349.34" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="176.71" y="349.34" font-size="11.00" class="sc-loraregular sc-k">Andon Labs</text><text x="236.63" y="345.68" font-size="6.60" class="sc-loraregular">66</text><text x="247.15" y="349.34" font-size="11.00" class="sc-notoserifcjksc">推出的一项基准测试，衡量</text><text x="382.04" y="349.34" font-size="11.00" class="sc-loraregular">AI</text><text x="395.51" y="349.34" font-size="11.00" class="sc-notoserifcjksc">模型在长时间跨度内经营一项</text><text x="72.00" y="364.96" font-size="11.00" class="sc-notoserifcjksc">业务的表现。需要注意的是，与我们在</text><text x="261.89" y="364.96" font-size="11.00" class="sc-loraregular sc-k">Project Vend</text><text x="330.27" y="364.96" font-size="11.00" class="sc-notoserifcjksc">中开展的真实世界实验不同，</text><text x="473.27" y="364.96" font-size="11.00" class="sc-loraregular sc-k">Vending-</text><text x="72.00" y="380.58" font-size="11.00" 31 421.99 428.07 433.45 440.29 446.25 452.93 458.78" y="527.10" font-size="11.00" class="sc-loraregular">Vending-Bench</text><text x="468.26" y="527.10" font-size="11.00" class="sc-notoserifcjksc">有其自身的上</text><text x="72.00" y="542.72" font-size="11.00" class="sc-notoserifcjksc">下文管理系统，这意味着</text><text x="195.89" y="542.72" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="542.72" font-size="11.00" class="sc-notoserifcjksc">的上下文编辑功能未被启用；我们在第</text><text x="424.08" y="542.72" font-size="11.00" class="sc-loraregular">6.2.5</text><text x="450.64" y="542.72" font-size="11.00" class="sc-notoserifcjksc">节中讨论对齐</text><text x="72.00" y="558.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="558.34" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="134.15" y="558.34" font-size="11.00" class="sc-notoserifcjksc">）问题。</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">65</text><text x="81.37 87.59 92.75 98.82 104.80 107.61 110.13 112.76 119.75 122.21 124.73 127.36 132.71 136.58 139.21 144.37 147.09 149.55 152.18 155.23 160.60 166.74 172.11 177.77 180.82 183.28 185.91 195.04 202.03 207.96 212.85 219.04 222.91 225.63 230.79 235.42 237.92 240.55 246.81 249.44 252.16 257.32 261.60 267.08 272.50 277.39 282.02 287.32 292.48 295.20 300.62 303.25 309.07 314.49 320.56 325.88 331.87 340.81 345.97 350.26 355.63 358.26 361.59 367.44 371.77 374.40 378.27 384.12 389.97 392.69 397.58 403.55 408.18 413.60 416.23 421.50 427.35 436.29 442.26 447.61 451.48 456.90 462.97 468.24 473.52 476.15 484.16 487.13 491.00 496.99 499.62 503.88 509.28 514.44" y="665.40" font-size="10.00" class="sc-loraregular">Bandi, C., et al. (2026). MCP-Atlas: A large-scale benchmark for tool-use competency with real</text><text x="220.85 226.75 230.72 234.59 240.56 245.19 247.69 251.38 258.28 263.44 267.77 273.07 275.88 280.54 283.00 288.85 293.13 298.66 305.56 310.72 316.54 320.82 327.72 333.09 338.87 345.01 350.38 352.69 358 3.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">294</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33" y="114.83" font-size="11.00" class="sc-loraregular">GDPval-AA</text><text x="129.21" y="111.16" font-size="6.60" class="sc-loraregular">68</text><text x="139.63" y="114.83" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="244.11" y="114.83" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真实</text><text x="72.00" y="130.45" font-size="11.00" class="sc-notoserifcjksc">世界专业任务上测试</text><text x="173.89" y="130.45" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36" y="130.45" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用来自</text><text x="322.25" y="130.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="363.65" y="130.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDPval</text><text x="404.10" y="130.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="459.10" y="130.45" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="472.99" y="130.45" font-size="11.00" class="sc-loraregular">220</text><text x="494.53" y="130.45" font-size="11.00" class="sc-notoserifcjksc">项任务，</text><text x="72.00" y="146.07" font-size="11.00" class="sc-notoserifcjksc">覆盖</text><text x="96.89" y="146.07" font-size="11.00" class="sc-loraregular">9</text><text x="106.14" y="146.07" font-size="11.00" class="sc-notoserifcjksc">个主要行业的</text><text x="175.04" y="146.07" font-size="11.00" class="sc-loraregular">44</text><text x="189.85" y="146.07" font-size="11.00" class="sc-notoserifcjksc">种职业。任务模拟实际的专业工作成果，包括文档、幻灯片、图表和电</text><text x="72.00" y="161.69" font-size="11.00" class="sc-notoserifcjksc">子表格。模型在智能体循环中获得</text><text x="239.89" y="161.69" font-size="11.00" class="sc-loraregular">shell</text><text x="266.41" y="161.69" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，表现以</text><text x="489.31" y="161.69" font-size="11.00" class="sc-loraregular">Elo</text><text x="508.47" y="161.69" font-size="11.00" class="sc-notoserifcjksc">评分</text><text x="72.00" y="177.31" font-size="11.00" class="sc-notoserifcjksc">衡量，该评分来自对模型输出的盲评两两比较。</text><text x="303.00" y="177.31" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="379.69" y="177.31" font-size="11.00" class="sc-notoserifcjksc">在排行榜上取得最高分，前五名</text><text x="151.89" y="192.93" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="192.93" font-size="11.00" class="sc-notoserifcjksc">模型占据。</text><text x="245.18" y="192.93" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="321.88" y="192.93" font-size="11.00" class="sc-notoserifcjksc">领先</text><text x="346.77" y="192.93" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="394.37" y="192.93" font-size="11.00" class="sc-notoserifcjksc">约</text><text x="408.26" y="192.93" font-size="11.00" class="sc-loraregular">42</text><text x="423.02" y="192.93" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="436.91" y="192.93" font-size="11.00" class="sc-loraregular">Elo</text><text x="456.08" y="192.93" font-size="11.00" class="sc-notoserifcjksc">分（两两比较胜</text><text x="72.00" y="208.55" font-size="11.00" class="sc-notoserifcjksc">率</text><text x="85.89" y="208.55" font-size="11.00" class="sc-loraregular">56%</text><text x="107.82" y="208.55" font-size="11.00" class="sc-notoserifcjksc">），同时使用了更少的轮次和</text><text x="253.71" y="208.55" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="282.87" y="208.55" font-size="11.00" class="sc-notoserifcjksc">。该评估由</text><text x="431.35" y="208.55" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="319.38" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="129.80" y="319.38" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="319.38" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="319.38" font-size="11.00" class="sc-notoserifcjksc">项真实世界工具使用任务，涵盖办公生产力、电子</text><text x="72.00" y="335.00" font-size="11.00" class="sc-notoserifcjksc">商务与运营、数据分析以及网页调研。任务以真实的应用状态为初始状态，并由基于执行的检查</text><text x="72.00" y="350.62" font-size="11.00" class="sc-notoserifcjksc">器评分，检查器会核验产生的产出物及其副作用。该基准测试在</text><text x="382.89" y="350.62" font-size="11.00" class="sc-loraregular">32</text><text x="397.82" y="350.62" font-size="11.00" class="sc-notoserifcjksc">个应用中提供</text><text x="466.71" y="350.62" font-size="11.00" class="sc-loraregular">604</text><text x="488.76" y="350.62" font-size="11.00" class="sc-notoserifcjksc">个工具；</text><text x="72.00" y="366.24" font-size="11.00" class="sc-notoserifcjksc">任务平均约</text><text x="129.89" y="366.24" font-size="11.00" class="sc-loraregular">20</text><text x="145.52" y="366.24" font-size="11.00" class="sc-notoserifcjksc">个轮次，要求正确选择工具、合理安排多步骤的执行顺序，并产出与检查器要求</text><text x="72.00" y="381.86" font-size="11.00" class="sc-notoserifcjksc">完全一致的输出。</text><text x="72.00" y="432.72" font-size="11.00" class="sc-notoserifcjksc">我们使用内部运行框架，在</text><text x="206.89" y="432.72" font-size="11.00" class="sc-loraregular">max</text><text x="231.13" y="432.72" font-size="11.00" class="sc-notoserifcjksc">推理强度下启用自适应思考进行运行。按照</text><text x="443.02" y="432.72" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="500.82" y="432.72" font-size="11.00" class="sc-notoserifcjksc">论文的</text><text x="72.00" y="448.34" font-size="11.00" class="sc-notoserifcjksc">实验方案，我们报告全部</text><text x="195.89" y="448.34" font-size="11.00" class="sc-loraregular">108</text><text x="215.80" y="448.34" font-size="11.00" class="sc-notoserifcjksc">项任务上</text><text x="262.70" y="448.34" font-size="11.00" class="sc-loraregular">3</text><text x="271.72" y="448.34" font-size="11.00" class="sc-notoserifcjksc">次试验平均的</text><text x="340.61" y="448.34" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="375.82" y="448.34" font-size="11.00" class="sc-notoserifcjksc">，同时报告</text><text x="433.71" y="448.34" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="471.05" y="448.34" font-size="11.00" class="sc-notoserifcjksc">（三次试验中</text><text x="72.00" y="463.96" font-size="11.00" class="sc-notoserifcjksc">至少一次正确）、</text><text x="160.00" y="463.96" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="186.52" y="463.96" font-size="11.00" class="sc-notoserifcjksc">（三次试验全部正确）以及每条轨迹的平均轮次。</text><text x="72.00" y="513.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="513.67" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="196.13" y="513.67" font-size="11.00" class="sc-loraregular sc-k">61.7%</text><text x="226.38" y="513.67" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="240.28" y="513.67" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="275.49" y="513.67" font-size="11.00" class="sc-notoserifcjksc">（各次试验间</text><text x="344.38" y="513.67" font-size="11.00" class="sc-loraregular sc-k">±0.5</text><text x="365.57" y="513.67" font-size="11.00" class="sc-notoserifcjksc">），优于</text><text x="412.46" y="513.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="529.29" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="529.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="97.85" y="529.29" font-size="11.00" class="sc-loraregular sc-k">59.9%</text><text x="128.66" y="529.29" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="153.55" y="529.29" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="235.09" y="529.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="246.09" y="529.29" font-size="11.00" class="sc-loraregular sc-k">59.3%</text><text x="276.67" y="529.29" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="298.67" y="529.29" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="386.91" y="529.29" font-size="11.00" class="sc-notoserifcjksc">还在可靠性上创下新高：其</text><text x="72.00" y="544.91" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="101.41" y="544.91" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="115.31" y="544.91" font-size="11.00" class="sc-loraregular">58.3%</text><text x="145.89" y="544.91" font-size="11.00" class="sc-notoserifcjksc">（即在全部三次试验中均被解决的任务比例），比此前最好的</text><text x="445.78" y="544.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="484.07" y="544.91" font-size="11.00" class="sc-notoserifcjksc">结果高出</text><text x="530.96" y="544.91" font-size="11.00" class="sc-loraregular">5</text><text x="72.00" y="560.53" font-size="11.00" class="sc-notoserifcjksc">个百分点以上；而其</text><text x="173.89" y="560.53" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="212.00" y="560.53" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="225.89" y="560.53" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="263.22" y="560.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="274.22" y="560.53" font-size="11.00" class="sc-loraregular sc-k">66.7%</text><text x="303.93" y="560.53" font-size="11.00" class="sc-notoserifcjksc">）之间的差距很小，表明</text><text x="427.83" y="560.53" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="516.07" y="560.53" font-size="11.00" class="sc-notoserifcjksc">能解</text><text x="72.00" y="576.15" font-size="11.00" class="sc-notoserifcjksc">决的任务，它都能稳定地解决。并且，它所用的轮次少于其前代模型。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="221.72" y="707.20" width="155.60" height="12.80" fill="transparent"/></a><a href="https://artificialanaly t><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 122.72 128.95 135.96 142.97 148.89 153.43 156.32 162.33 164.89" y="281.16" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.5</text><text x="216.00" y="281.16" font-size="11.00" class="sc-loraregular sc-k">41.0</text><text x="293.25 299.24 305.20 307.79" y="281.16" font-size="11.00" class="sc-loraregular">54.6</text><text x="370.50 376.40 382.58 384.93" y="281.16" font-size="11.00" class="sc-loraregular">28.7</text><text x="447.75 453.87 459.78 462.31" y="281.16" font-size="11.00" class="sc-loraregular">32.0</text><text x="72.00 80.29 83.42 87.97 95.25 98.38 106.63 110.01 119.07 127.51 132.34 140.63 154.13 162.95 167.78 171.21 179.50 187.94 196.12 204.14 212.58 220.38" y="503.47" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.9 AutomationBench</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">69</text><text x="81.56 87.23 93.22 98.64 104.61 109.76 114.02 120.00 122.53 125.16 132.36 134.82 137.35 139.98 146.93 149.56 155.23 160.38 163.10 165.91 174.85 180.01 186.07 190.70 193.23 195.86 202.14 204.60 207.23 210.27 215.64 221.78 227.15 232.81 235.85 238.31 240.94 247.20 253.17 257.04 262.88 271.82 276.91 280.78 283.58 289.43 295.44 301.66 307.08 313.14 318.46 324.45 326.91 329.54 334.69 338.40 344.89 347.70 352.75 355.25 360.61 366.39 372.60 378.02 380.48 384.12 389.66 395.44 401.01 406.43" y="704.47" font-size="10.00" class="sc-loraregular">Shepard, D., &amp; Salimans, R. (2026). AutomationBench. arXiv:2604.18934.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.72 203.18 206.81 212.36 218.14 223.71" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2604.18934</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">295</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="447.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">平均轮次</text><text x="72.00" y="300.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="300.33" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.64 110.74 116.27 119.75 122.11 127.50 132.60 137.65 140.46 145.14 148.86 154.45 157.26 162.35" y="300.33" font-size="9.00" class="sc-lorabold">8.17.8.A] Toolathlon</text><text x="170.46" y="300.33" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="269.46" y="300.33" font-size="9.00" class="sc-notoserifcjksc">各模型均在</text><text x="316.83" y="300.33" font-size="9.00" class="sc-loraregular">max</text><text x="336.65" y="300.33" font-size="9.00" class="sc-notoserifcjksc">推理强度下启用自适应思考进行评估。</text><text x="489.65" y="300.33" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="518.46" y="300.33" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="312.03" font-size="9.00" class="sc-loraregular sc-k">Pass@3</text><text x="104.91" y="312.03" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="116.28" y="312.03" font-size="9.00" class="sc-loraregular sc-k">Pass³</text><text x="140.35" y="312.03" font-size="9.00" class="sc-notoserifcjksc">按照论文的实验方案，基于全部</text><text x="268.71" y="312.03" font-size="9.00" class="sc-loraregular">108</text><text x="285.00" y="312.03" font-size="9.00" class="sc-notoserifcjksc">项任务、每项</text><text x="341.37" y="312.03" font-size="9.00" class="sc-loraregular">3</text><text x="348.75" y="312.03" font-size="9.00" class="sc-notoserifcjksc">次试验计算。</text><text x="72.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">关于与公开排行榜可比性的说明：我们的运行框架复刻了上游的任务定义、提示词和基于执行的</text><text x="72.00" y="355.01" font-size="11.00" class="sc-notoserifcjksc">检查器，并通过重放已公开的</text><text x="217.89" y="355.01" font-size="11.00" class="sc-loraregular sc-k">claude-sonnet-4.5</text><text x="314.79" y="355.01" font-size="11.00" class="sc-notoserifcjksc">轨迹进行了验证。为控制已公开轨迹发布以来</text><text x="72.00" y="370.63" font-size="11.00" class="sc-notoserifcjksc">出现的实时依赖漂移和上游仓库变更，我们将金融数据源和容器镜像固定到一个离线快照，并镜</text><text x="72.00" y="386.25" font-size="11.00" class="sc-notoserifcjksc">像当前的上游状态。按公开版本，大约四分之一的任务无法满足；我们未对这些任务作任何改</text><text x="72.00" y="401.87" font-size="11.00" class="sc-notoserifcjksc">动。因此，我们的得分始终比严格与上游等价的运行框架高约</text><text x="371.89" y="401.87" font-size="11.00" class="sc-loraregular">3</text><text x="380.91" y="401.87" font-size="11.00" class="sc-notoserifcjksc">个百分点。另外，公开排行榜上</text><text x="72.00" y="417.49" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="118.13" y="417.49" font-size="11.00" class="sc-notoserifcjksc">的数据使用的是作者的默认配置，而非</text><text x="308.03" y="417.49" font-size="11.00" class="sc-loraregular">max</text><text x="332.26" y="417.49" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text><text x="72.00" y="527.33" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="163.89" y="523.66" font-size="6.60" class="sc-loraregular">69</text><text x="174.42" y="527.33" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="188.31" y="527.33" font-size="11.00" class="sc-loraregular">Zapier</text><text x="223.97" y="527.33" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，衡量智能体能否完成一个真实的端到端业务工</text><text x="72.00" y="542.95" font-size="11.00" class="sc-notoserifcjksc">作流。任务取材于真实客户在销售、市场营销、运营、客服、财务和人力资源等方面的工作流模</text><text x="72.00" y="558.57" font-size="11.00" class="sc-notoserifcjksc">式。每项任务都会将智能体置于一家模拟公司中，该公司拥有数十个</text><text x="404.89" y="558.57" font-size="11.00" class="sc-loraregular sc-k">REST API</text><text x="454.89" y="558.57" font-size="11.00" class="sc-notoserifcjksc">端点，涉及</text><text x="512.78" y="558.57" font-size="11.00" class="sc-loraregular">47</text><text x="526.71" y="558.57" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="574.19" font-size="11.00" class="sc-notoserifcjksc">应用（</text><text x="105.00" y="574.19" font-size="11.00" class="sc-loraregular">CRM</text><text x="129.70" y="574.19" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="140.70" y="574.19" font-size="11.00" class="sc-loraregular">Slack</text><text x="167.36" y="574.19" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="178.36" y="574.19" font-size="11.00" class="sc-loraregular sc-k">Google Workspace</text><text x="277.36" y="574.19" font-size="11.00" class="sc-notoserifcjksc">等）。在仅给出一条自然语言指令的情况下，智能体</text><text x="72.00" y="589.81" font-size="11.00" class="sc-notoserifcjksc">必须通过搜索自主发现正确的端点，进行数十次相继且相互依赖的</text><text x="393.89" y="589.81" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="413.97" y="589.81" font-size="11.00" class="sc-notoserifcjksc">调用，查阅并遵守分层业</text><text x="72.00" y="605.43" font-size="11.00" class="sc-notoserifcjksc">务政策文档，同时避开刻意设置的干扰项。评分针对每项任务按通过或不通过判定，依据是否满</text><text x="72.00" y="621.05" font-size="11.00" class="sc-notoserifcjksc">足针对模拟应用状态的全部确定性断言（例如，是否应用了正确的</text><text x="393.89" y="621.05" font-size="11.00" class="sc-loraregular">CRM</text><text x="421.48" y="621.05" font-size="11.00" class="sc-notoserifcjksc">更新）。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="707.20" width="157.13" height="12.80" fill="transparent"/></a></svg></div>
