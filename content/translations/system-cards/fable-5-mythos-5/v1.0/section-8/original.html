7.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2601.11868</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">254</text><text x="72.00" y="377.02" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="377.02" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 98.88 100.98 106.51 109.99 112.36 117.67 126.81 132.30 136.54 141.70 146.54 152.28 156.94 162.53 164.90 170.65 174.90" y="377.02" font-size="9.00" class="sc-lorabold">8.2.A] SWE-bench Pro</text><text x="182.36" y="377.02" font-size="9.00" class="sc-notoserifcjksc">分数与各推理强度档位下平均每任务成本的关系。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.60 166.30" y="436.77" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.1</text><text x="170.31" y="433.10" font-size="6.60" class="sc-loraregular">32</text><text x="180.42" y="436.77" font-size="11.00" class="sc-notoserifcjksc">在终端和命令行环境中的真实编程任务上测试</text><text x="403.31" y="436.77" font-size="11.00" class="sc-loraregular">AI</text><text x="416.78" y="436.77" font-size="11.00" class="sc-notoserifcjksc">模型。我们决定改用新的</text><text x="72.00" y="452.39" font-size="11.00" class="sc-notoserifcjksc">运行框架</text><text x="118.89 128.73 131.82 138.49 141.59 146.96 153.20 164.15 170.77 176.15 181.82 187.85 193.81 200.39" y="452.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">mini-SWE-agent</text><text x="204.65" y="452.39" font-size="11.00" class="sc-notoserifcjksc">，与我们此前报告所用的</text><text x="328.54" y="452.39" font-size="11.00" class="sc-loraregular sc-k">Terminus-2</text><text x="390.86" y="452.39" font-size="11.00" class="sc-notoserifcjksc">运行框架相比，它对超时更为</text><text x="72.00" y="468.01" font-size="11.00" class="sc-notoserifcjksc">稳健。例如，在</text><text x="151.89" y="468.01" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="183.23" y="468.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="249.23" y="468.01" font-size="11.00" class="sc-loraregular sc-k">Terminus-2</text><text x="311.55" y="468.01" font-size="11.00" class="sc-notoserifcjksc">遇到的超时次数是</text><text x="402.44 412.27 415.37 422.04 425.13 430.51 436.75 447.69 454.32 459.70 465.37 471.40 477.36 483.94" y="468.01" font-size="11.00" class="sc-loraregular">mini-SWE-agent</text><text x="491.09" y="468.01" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="504.98" y="468.01" font-size="11.00" class="sc-loraregular sc-k">2.7×</text><text x="524.14" y="468.01" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="483.62" font-size="11.00" class="sc-notoserifcjksc">原因在于它通过</text><text x="151.89" y="483.62" font-size="11.00" class="sc-loraregular">tmux</text><text x="181.27" y="483.62" font-size="11.00" class="sc-notoserifcjksc">会话等待命令执行的方式；这使最终分数噪声更大、可读性更差。</text><text x="72.00" y="550.33" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="550.33" font-size="11.00" class="sc-loraregular">mini-SWE</text><text x="151.88" y="550.33" font-size="11.00" class="sc-notoserifcjksc">运行框架，配合</text><text x="231.77" y="550.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">GKE</text><text x="257.39" y="550.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">集群</text><text x="279.39" y="550.33" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="290.39" y="550.33" font-size="11.00" class="sc-loraregular">1×</text><text x="303.12" y="550.33" font-size="11.00" class="sc-notoserifcjksc">超时倍率以及</text><text x="372.01" y="550.33" font-size="11.00" class="sc-loraregular sc-k">Pod</text><text x="430.37" y="550.33" font-size="11.00" class="sc-loraregular">3×</text><text x="445.22" y="550.33" font-size="11.00" class="sc-notoserifcjksc">的内存上限：</text><text x="108.00" y="598.92" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="193.35" y="598.92" font-size="11.00" class="sc-notoserifcjksc">：在</text><text x="218.24" y="598.92" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="243.75" y="598.92" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得</text><text x="323.64" y="598.92" font-size="11.00" class="sc-loraregular">88%</text><text x="348.47" y="598.92" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，为</text><text x="428.36" y="598.92" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="443.72" y="598.92" font-size="11.00" class="sc-notoserifcjksc">个不同任务各</text><text x="512.61" y="598.92" font-size="11.00" class="sc-loraregular">5</text><text x="521.50" y="598.92" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="108.00" y="614.54" font-size="11.00" class="sc-notoserifcjksc">尝试的平均值（共</text><text x="198.89" y="614.54" font-size="11.00" class="sc-loraregular">445</text><text x="219.70" y="614.54" font-size="11.00" class="sc-notoserifcjksc">次试验）。</text><text x="108.00" y="631.28" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="181.80" y="631.28" font-size="11.00" class="sc-notoserifcjksc">：在</text><text x="206.69" y="631.28" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="232.20" y="631.28" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得</text><text x="312.09" y="631.28" font-size="11.00" class="sc-loraregular">84.3%</text><text x="444.04" y="631.28" font-size="11.00" class="sc-loraregular sc-k">20.9%</text><text x="478.13" y="631.28" font-size="11.00" class="sc-notoserifcjksc">的试验触发</text><text x="108.00" y="646.90" font-size="11.00" class="sc-notoserifcjksc">了安全拒绝，并在轨迹的剩余部分回退到</text><text x="308.89" y="646.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="391.89" y="646.90" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2601.11868" rel="noopener"><rect x="270.34" y="707.20" width="153.69" height="12.80" fill="transparent"/></a><a href="https://swe-agent.com/latest/" rel="noopener"><rect x="118.89" y="443.59" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p255.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 255 页"><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="249.83" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="72.00" y="700.92" font-size="5.40" class="sc-loraregular">33</text><text x="80.37" y="704.73" font-size="9.00" class="sc-loraregular sc-k">Lu, E., et al. (2026). Introducing FrontierCode. Cognition.</text><text x="319.03" y="704.73" font-size="9.00" class="sc-loraregular sc-k" fill="#1155cc">https://cognition.ai/blog/frontier-code</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">255</text><text x="108.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="149.45" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="160.45 166.95 172.91 177.67 187.51 190.60 197.28 202.95 205.94 211.32 218.17 224.13 230.80 236.66 243.25 246.14 252.05 254.75" y="82.61" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.1</text><text x="261.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">排行榜的官方维护方</text><text x="363.54" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Harbor</text><text x="402.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">已在外部使用</text><text x="471.81 481.65 484.74 491.42 494.51 499.89 506.12 517.07 523.69" y="82.61" font-size="11.00" class="sc-loraregular">mini-SWE-</text><text x="108.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">agent</text><text x="139.39" y="98.23" font-size="11.00" class="sc-notoserifcjksc">运行框架复现了</text><text x="219.29" y="98.23" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="263.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的结果，在</text><text x="321.52" y="98.23" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="352.86" y="98.23" font-size="11.00" class="sc-notoserifcjksc">推理强度下得到</text><text x="432.75" y="98.23" font-size="11.00" class="sc-loraregular">81%</text><text x="455.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的平均奖励。我</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">们在内部于相同的</text><text x="198.89" y="113.85" font-size="11.00" class="sc-loraregular">GKE</text><text x="224.51" y="113.85" font-size="11.00" class="sc-notoserifcjksc">设置上运行了相同配置（</text><text x="345.51" y="113.85" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="389.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">搭配</text><text x="414.75 424.58 427.67 434.35 437.44 442.82 449.06 460.00 466.62 472.00 477.68 483.71 489.67 496.25" y="113.85" font-size="11.00" class="sc-loraregular">mini-SWE-agent</text><text x="500.50" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="511.50" y="113.85" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">推理强度），得到</text><text x="198.89" y="129.47" font-size="11.00" class="sc-loraregular">83%</text><text x="223.66" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的平均奖励。</text><text x="289.66" y="129.47" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="334.01" y="129.47" font-size="11.00" class="sc-notoserifcjksc">搭配</text><text x="358.90" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Codex</text><text x="394.23" y="129.47" font-size="11.00" class="sc-notoserifcjksc">运行框架的平均奖励为</text><text x="108.00" y="145.09" font-size="11.00" class="sc-loraregular">83.4%</text><text x="138.55" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="163.56" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="181.44" y="163.56" font-size="11.00" class="sc-notoserifcjksc">：我们没有其使用</text><text x="272.33" y="163.56" font-size="11.00" class="sc-loraregular sc-k">mini-swe</text><text x="323.03" y="163.56" font-size="11.00" class="sc-notoserifcjksc">运行框架的分数，但我们纳入了</text><text x="479.92" y="163.56" font-size="11.00" class="sc-loraregular">Gemini</text><text x="519.84" y="163.56" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="108.00 114.50 120.46 125.23 135.06 138.15 144.83 150.50 153.50 158.88 165.72 171.68 178.36 184.21 190.80 193.69 199.60 202.30" y="179.18" font-size="11.00" class="sc-loraregular">Terminal-Bench 2.1</text><text x="209.20" y="179.18" font-size="11.00" class="sc-notoserifcjksc">排行榜上的最高分。</text><text x="108.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="190.99" y="195.95" font-size="11.00" class="sc-notoserifcjksc">：在</text><text x="215.89" y="195.95" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="241.40" y="195.95" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得</text><text x="321.29" y="195.95" font-size="11.00" class="sc-loraregular sc-k">82.7%</text><text x="353.27" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的平均奖励，为</text><text x="433.16" y="195.95" font-size="11.00" class="sc-loraregular sc-k">89</text><text x="448.52" y="195.95" font-size="11.00" class="sc-notoserifcjksc">个不同任务各</text><text x="517.41" y="195.95" font-size="11.00" class="sc-loraregular">5</text><text x="526.30" y="195.95" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="108.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">尝试的平均值（共</text><text x="198.89" y="211.57" font-size="11.00" class="sc-loraregular">445</text><text x="219.70" y="211.57" font-size="11.00" class="sc-notoserifcjksc">次试验）。</text><text x="72.00" y="272.27" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="140.35" y="268.60" font-size="6.60" class="sc-loraregular">33</text><text x="150.60" y="272.27" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="175.49" y="272.27" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="229.00" y="272.27" font-size="11.00" class="sc-notoserifcjksc">构建的智能体编程基准测试，包含</text><text x="396.89" y="272.27" font-size="11.00" class="sc-loraregular">150</text><text x="416.61" y="272.27" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务取</text><text x="72.00" y="287.89" font-size="11.00" class="sc-notoserifcjksc">自开源代码仓库中的真实拉取请求（</text><text x="248.00" y="287.89" font-size="11.00" class="sc-loraregular sc-k">pull request</text><text x="308.82" y="287.89" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="377.71" y="287.89" font-size="11.00" class="sc-loraregular sc-k">aiohttp</text><text x="417.49" y="287.89" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="442.38" y="287.89" font-size="11.00" class="sc-loraregular sc-k">websocket</text><text x="499.67" y="287.89" font-size="11.00" class="sc-notoserifcjksc">缺陷、</text><text x="72.00" y="303.51" font-size="11.00" class="sc-notoserifcjksc">加固</text><text x="96.89" y="303.51" font-size="11.00" class="sc-loraregular">Prisma</text><text x="134.91" y="303.51" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包文件，或扩展</text><text x="269.80" y="303.51" font-size="11.00" class="sc-loraregular sc-k">JSON schema</text><text x="341.95" y="303.51" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="355.84" y="303.51" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="375.66" y="303.51" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务为智能体提供一个</text><text x="72.00" y="319.12" font-size="11.00" class="sc-notoserifcjksc">已检出的代码仓库和一条</text><text x="195.89" y="319.12" font-size="11.00" class="sc-loraregular">issue</text><text x="224.59" y="319.12" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自主工作，产出最终补丁，期</text><text x="72.00" y="334.74" font-size="11.00" class="sc-notoserifcjksc">间没有人工干预，也不提供超时信息。补丁依据阻断性功能标准（主要是留出的单元测试）以及</text><text x="72.00" y="350.36" font-size="11.00" class="sc-notoserifcjksc">加权评分细则标准进行评分，其中包括针对所需测试覆盖率和禁止的实现模式的由模型评分的检</text><text x="72.00" y="365.98" font-size="11.00" class="sc-notoserifcjksc">查项。任务由相关底层代码仓库的维护者编写，并经</text><text x="327.89" y="365.98" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="381.40" y="365.98" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，其中随机抽</text><text x="72.00" y="381.61" font-size="11.00" class="sc-notoserifcjksc">取的一部分由人工求解，以验证公平性。我们以</text><text x="305.89" y="381.61" font-size="11.00" class="sc-loraregular sc-k">mean@5</text><text x="351.66" y="381.61" font-size="11.00" class="sc-notoserifcjksc">报告补丁正确率，即补丁满足全部阻断</text><text x="72.00" y="397.23" font-size="11.00" class="sc-notoserifcjksc">性标准的任务所占比例。</text><text x="72.00" y="476.80" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="476.80" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="124.29" y="476.80" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="192.65" y="476.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.65" y="476.80" font-size="11.00" class="sc-loraregular">Diamond</text><text x="253.03" y="476.80" font-size="11.00" class="sc-notoserifcjksc">子集）上排名第</text><text x="332.92" y="476.80" font-size="11.00" class="sc-loraregular">1</text><text x="336.92" y="476.80" font-size="11.00" class="sc-notoserifcjksc">，分数为</text><text x="383.82" y="476.80" font-size="11.00" class="sc-loraregular sc-k">29.3%</text><text x="414.31" y="476.80" font-size="11.00" class="sc-notoserifcjksc">，通过率为</text><text x="472.20" y="476.80" font-size="11.00" class="sc-loraregular sc-k">30.2%</text><text x="503.17" y="476.80" font-size="11.00" class="sc-notoserifcjksc">（所有</text><text x="72.00" y="492.42" font-size="11.00" class="sc-notoserifcjksc">模型均为</text><text x="118.89" y="492.42" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="150.23" y="492.42" font-size="11.00" class="sc-notoserifcjksc">推理强度；分数</text><text <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p257.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 257 页"><text x="72.00 80.93 84.30 93.24 96.88 104.08 109.46 118.38 127.47 132.67 136.36 145.00 150.37 158.82 172.80" y="88.10" font-size="14.00" class="sc-poppinsmedium">8.5 FrontierSWE</text><text x="72.00 80.93 84.30 93.28 96.92 105.25 110.62 119.55 129.03 134.41 143.89 158.43 167.24 175.88 184.96 193.35" y="277.98" font-size="14.00" class="sc-poppinsmedium">8.6 ProgramBench</text><text x="72.00 80.93 84.30 92.13 95.77 106.59 115.67 121.04 128.51 137.44 142.81 151.63 160.26 169.34 177.74" y="578.26" font-size="14.00" class="sc-poppinsmedium">8.7 CursorBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">257</text><text x="72.00" y="110.55" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE</text><text x="137.71" y="106.88" font-size="6.60" class="sc-loraregular">34</text><text x="147.86" y="110.55" font-size="11.00" class="sc-notoserifcjksc">是一个开放式基准测试，包含</text><text x="293.75" y="110.55" font-size="11.00" class="sc-loraregular">17</text><text x="305.72" y="110.55" font-size="11.00" class="sc-notoserifcjksc">个超长程工程问题，涵盖性能工程、大规模实现</text><text x="478.51" y="126.17" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="516.14" y="126.17" font-size="11.00" class="sc-notoserifcjksc">为后</text><text x="118.89" y="141.79" font-size="11.00" class="sc-loraregular sc-k">PostgreSQL</text><text x="182.06" y="141.79" font-size="11.00" class="sc-notoserifcjksc">的服务器。</text><text x="72.00" y="191.70" font-size="11.00" class="sc-notoserifcjksc">每个任务给予智能体</text><text x="173.89" y="191.70" font-size="11.00" class="sc-loraregular">20</text><text x="189.52" y="191.70" font-size="11.00" class="sc-notoserifcjksc">小时；由于任务规模过大，无法进行二元评分，每个任务都按加速比或</text><text x="72.00" y="207.32" font-size="11.00" class="sc-notoserifcjksc">功能覆盖范围等指标进行连续评分，并依据五次试验的</text><text x="338.89" y="207.32" font-size="11.00" class="sc-loraregular sc-k">mean@5</text><text x="384.66" y="207.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="398.56" y="207.32" font-size="11.00" class="sc-loraregular">best@5</text><text x="437.92" y="207.32" font-size="11.00" class="sc-notoserifcjksc">对模型进行排名。</text><text x="72.00" y="222.94" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="222.94" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="124.29" y="222.94" font-size="11.00" class="sc-loraregular">2.12</text><text x="145.71" y="222.94" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="159.60" y="222.94" font-size="11.00" class="sc-loraregular sc-k">mean@5</text><text x="205.38" y="222.94" font-size="11.00" class="sc-notoserifcjksc">排名第</text><text x="241.27" y="222.94" font-size="11.00" class="sc-loraregular">1</text><text x="245.27" y="222.94" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="256.27" y="222.94" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="303.87" y="222.94" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="317.76" y="222.94" font-size="11.00" class="sc-loraregular">3.26</text><text x="341.75" y="222.94" font-size="11.00" class="sc-notoserifcjksc">排名第</text><text x="377.65" y="222.94" font-size="11.00" class="sc-loraregular">2</text><text x="383.55" y="222.94" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="394.55" y="222.94" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="438.89" y="222.94" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="452.79" y="222.94" font-size="11.00" class="sc-loraregular">3.94</text><text x="476.83" y="222.94" font-size="11.00" class="sc-notoserifcjksc">排名第</text><text x="512.73" y="222.94" font-size="11.00" class="sc-loraregular">3</text><text x="518.85" y="222.94" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="300.42" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="296.75" font-size="6.60" class="sc-loraregular">35</text><text x="158.09" y="300.42" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="303.98" y="300.42" font-size="11.00" class="sc-loraregular">200</text><text x="326.44" y="300.42" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得一个由开源</text><text x="72.00" y="316.04" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在无法访问互联网、也无法使用反编译工具</text><text x="72.00" y="331.66" font-size="11.00" class="sc-notoserifcjksc">的情况下，重建一个能复现原程序行为的代码库。任务范围从小型终端工具（</text><text x="446.00" y="331.66" font-size="11.00" class="sc-loraregular">jq</text><text x="455.21" y="331.66" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="466.21" y="331.66" font-size="11.00" class="sc-loraregular sc-k">ripgrep</text><text x="503.93" y="331.66" font-size="11.00" class="sc-notoserifcjksc">）到大</text><text x="72.00" y="347.28" font-size="11.00" class="sc-notoserifcjksc">型系统（</text><text x="116.00" y="347.28" font-size="11.00" class="sc-loraregular sc-k">FFmpeg</text><text x="156.39" y="347.28" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="167.39" y="347.28" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="202.13" y="347.28" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="213.13" y="347.28" font-size="11.00" class="sc-loraregular sc-k">PHP</text><text x="72.00" y="362.90" font-size="11.00" class="sc-notoserifcjksc">个基准测试中共有</text><text x="162.89 168.56 174.52 180.70 183.31 190.14 196.97" y="362.90" font-size="11.00" class="sc-loraregular">248,000</text><text x="206.71" y="362.90" font-size="11.00" class="sc-notoserifcjksc">多个此类测试，均通过智能体驱动的模糊测试生成。</text><text x="72.00" y="430.17" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="430.17" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="430.17" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试集上得分低于</text><text x="378.77" y="430.17" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="397.38" y="430.17" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳定</text><text x="72.00" y="445.79" font-size="11.00" class="sc-notoserifcjksc">性），剩余</text><text x="129.89" y="445.79" font-size="11.00" class="sc-loraregular">166</text><text x="149.51" y="445.79" font-size="11.00" class="sc-notoserifcjksc">个任务。我们报告</text><text x="240.40" y="445.79" font-size="11.00" class="sc-loraregular sc-k">1–5</text><text x="259.65" y="445.79" font-size="11.00" class="sc-notoserifcjksc">个回合下的隐藏测试通过率，每个回合的上下文预算最多</text><text x="72.00" y="461.41" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="461.41" font-size="11.00" class="sc-loraregular">100</text><text x="106.45" y="461.41" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="120.35" y="461.41" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="149.51" y="461.41" font-size="11.00" class="sc-notoserifcjksc">。在该任务集上，</text><text x="237.51" y="461.41" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="316.86" y="461.41" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="352.75" y="461.41" font-size="11.00" class="sc-loraregular">84–93%</text><text x="393.44" y="461.41" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="418.33" y="461.41" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="504.22" y="461.41" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="518.12" y="461.41" font-size="11.00" class="sc-loraregular">79–</text><text x="72.00" y="477.03" font-size="11.00" class="sc-loraregular">88%</text><text x="93.93" y="473.37" font-size="6.60" class="sc-loraregular">36</text><text x="101.43" y="477.03" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="508.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">我们未单独报告</text><text x="151.89" y="508.19" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Fable 5</text><text x="228.59" y="508.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的</text><text x="242.48" y="508.19" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">ProgramBench</text><text x="321.29" y="508.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">结果，因为</text><text x="379.19" y="508.19" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">ProgramBench</text><text x="467.51" y="523.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">3.1.2</text><text x="491.85" y="523.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">节）。</text><text x="72.00" y="600.69" font-size="11.00" class="sc-loraregular sc-k">CursorBench</text><text x="139.00" y="597.02" font-size="6.60" class="sc-loraregular sc-k">37</text><text x="148.45" y="600.69" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="162.35" y="600.69" font-size="11.00" class="sc-loraregular">Cursor</text><text x="200.55" y="600.69" font-size="11.00" class="sc-notoserifcjksc">推出的智能体编程基准测试，由真实编程任务（取自内部使用和外部</text><text x="72.00" y="616.31" font-size="11.00" class="sc-notoserifcjksc">流量）组成，并在</text><text x="162.89" y="616.31" font-size="11.00" class="sc-loraregular">Cursor</text><text x="201.10" y="616.31" font-size="11.00" class="sc-notoserifcjksc">的生产环境智能体</text><text x="72.00" y="649.25" font-size="6.00" class="sc-loraregular">34</text><text x="81.22 88.21 94.20 100.17 102.69 105.32 111.54 114.00 116.52 119.15 125.41 130.94 136.10 140.50 148.41 153.57 156.29 158.81 161.44 167.72 170.18 172.70 175.33 180.68 184.55 187.18 192.34 195.06 197.52 200.15 203.20 208.57 214.71 220.08 225.74 228.79 231.25 233.88 239.26 243.52 249.37 255.35 259.22 262.03 267.45 271.78 277.45 287.40 293.62 296.08 298.71 304.77 309.03 314.83 320.13 322.94 331.88 337.04 339.76" y="652.59" font-size="10.00" class="sc-loraregular">Chu, E., Agarwal, R., et al. (2026). FrontierSWE. Proximal.</text><text x="344.89" y="652.59" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">https://frontierswe.com/blog</text><text x="72.00" y="663.45" font-size="6.00" class="sc-loraregular">35</text><text x="81.24 87.09 92.25 98.32 103.85 106.37 109.00 112.52 114.98 117.50 120.13 125.48 129.35 131.98 137.14 139.86 142.32 144.95 148.00 153.37 159.51 164.88 170.54 173.59 176.05 178.68 184.74 189.00 194.85 200.38 204.64 209.80 218.68 224.90 230.32 236.39 241.71 247.70 250.20 252.83 259.82 264.98 271.05 273.68 276.40 281.56 287.63 293.16 299.13 304.29 309.77 315.19 317.82 326.76 332.61 338.59 344.01 346.73 351.36 353.99 358.25 363.67 369.49 375.46 378.27 380.99 386.97 389.60 395.57 399.83 405.68 411.21 415.47 420.63 429.57 434.20 436.83 440.21 444.47 450.32 459.26 461.89 466.52 471.84 476.10 481.19 485.06 490.38 496.18" y="666.79" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="156.36 162.26 166.23 170.10 176.07 180.70 183.20 186.89 193.79 198.95 203.28 208.58 211.39 216.05 218.51 224.36 228.64 234.17 241.07 246.23 252.05 256.33 263.23 268.60 274.38 280.59 286.04 288.35 294.56 300.13 305.58 311.00" y="680.99" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2605.03546</text><text x="72.00" y="691.85" font-size="6.00" class="sc-loraregular">36</text><text x="81.44" y="695.19" font-size="10.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="159.52" y="695.19" font-size="10.00" class="sc-notoserifcjksc">的结果引自</text><text x="212.15" y="695.19" font-size="10.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="290.23" y="695.19" font-size="10.00" class="sc-notoserifcjksc">系统卡，是在该模型接近最终版的快照上测得的。</text><text x="72.00" y="706.05" font-size="6.00" class="sc-loraregular sc-k">37</text><text x="80.59" y="709.39" font-size="10.00" class="sc-loraregular sc-k">Cursor. (2026). CursorBench.</text><text x=" ="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="497.79" y="82.61" font-size="11.00" class="sc-notoserifcjksc">超越了</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">此前在</text><text x="107.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">CursorBench</text><text x="177.79" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的最佳结果，在最高推理强度下得分</text><text x="367.68" y="98.23" font-size="11.00" class="sc-loraregular">72.9%</text><text x="397.29" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，比</text><text x="422.18" y="98.23" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="466.53" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在其已公布的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">最高推理强度下的结果（</text><text x="193.00" y="113.85" font-size="11.00" class="sc-loraregular">64.3%</text><text x="223.72" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）高出</text><text x="259.62" y="113.85" font-size="11.00" class="sc-loraregular sc-k">8.6</text><text x="277.65" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分。从</text><text x="313.54" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Medium</text><text x="358.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">起的每个推理强度档位上，</text><text x="490.43" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="528.83" y="113.85" font-size="11.00" class="sc-notoserifcjksc">均</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">处于领先。</text><text x="72.00" y="481.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="481.39" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 93.82 97.48 99.58 105.11" y="481.39" font-size="9.00" class="sc-lorabold">8.7.A]</text><text x="110.95" y="481.39" font-size="9.00" class="sc-notoserifcjkscbold">按推理强度设置划分的</text><text x="203.32" y="481.39" font-size="9.00" class="sc-lorabold sc-k">CursorBench</text><text x="261.95" y="481.39" font-size="9.00" class="sc-notoserifcjkscbold">分数与平均每任务成本，</text><text x="360.95" y="481.39" font-size="9.00" class="sc-notoserifcjksc">由</text><text x="372.32" y="481.39" font-size="9.00" class="sc-loraregular">Cursor</text><text x="403.58" y="481.39" font-size="9.00" class="sc-notoserifcjksc">在其生产环境智能体运行框架中测</text><text x="72.00" y="493.09" font-size="9.00" class="sc-notoserifcjksc">量并报告。每任务成本由</text><text x="173.37" y="493.09" font-size="9.00" class="sc-loraregular">Cursor</text><text x="204.62" y="493.09" font-size="9.00" class="sc-notoserifcjksc">根据其生产环境运行框架中记录的</text><text x="341.99" y="493.09" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="358.42" y="493.09" font-size="9.00" class="sc-notoserifcjksc">用量测量并报告，与假设</text><text x="459.78" y="493.09" font-size="9.00" class="sc-loraregular">1</text><text x="465.43" y="493.09" font-size="9.00" class="sc-notoserifcjksc">小时缓存写入时的</text><text x="72.00" y="504.79" font-size="9.00" class="sc-notoserifcjksc">公开每</text><text x="101.37" y="504.79" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="127.59" y="504.79" font-size="9.00" class="sc-notoserifcjksc">单价一致。</text><text x="72.00 80.37 85.06 90.73 97.31 103.88 109.48 113.73 119.70 125.08 131.43 137.34 142.84 148.80 151.79 154.69 163.06 169.49 175.93 182.27 185.27 191.23 196.61 203.27 207.96 214.39 220.77 224.49 227.39 236.14 244.34" y="580.86" font-size="11.00" class="sc-loraregular">Graduate-Level Google-Proof Q&amp;A</text><text x="254.12" y="580.86" font-size="11.00" class="sc-notoserifcjksc">基准测试（</text><text x="309.12" y="580.86" font-size="11.00" class="sc-loraregular sc-k">GPQA</text><text x="339.65" y="580.86" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="350.65" y="577.19" font-size="6.60" class="sc-loraregular">38</text><text x="360.93" y="580.86" font-size="11.00" class="sc-notoserifcjksc">是一组具有挑战性的科学类多项选择</text><text x="72.00" y="596.48" font-size="11.00" class="sc-notoserifcjksc">题。我们使用包含</text><text x="162.89" y="596.48" font-size="11.00" class="sc-loraregular">198</text><text x="182.33" y="596.48" font-size="11.00" class="sc-notoserifcjksc">道题的</text><text x="218.22" y="596.48" font-size="11.00" class="sc-loraregular">Diamond</text><text x="72.00" y="612.10" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="94.00" y="612.10" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="143.95" y="612.10" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="157.84" y="612.10" font-size="11.00" class="sc-loraregular sc-k">GPQA Diamond</text><text x="240.65" y="612.10" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="276.54" y="612.10" font-size="11.00" class="sc-loraregular">94.1%</text><text x="305.15" y="612.10" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="330.04" y="612.10" font-size="11.00" class="sc-loraregular">5</text><text x="338.93" y="612.10" font-size="11.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="662.05" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89" y="662.05" font-size="11.00" class="sc-loraregular sc-k">GPQA Diamond</text><text x="201.70" y="662.05" font-size="11.00" class="sc-notoserifcjksc">是一项已饱和的评估，并计划不再报告未来模型在该评估上的表现。</text><a href="https://arxiv.org/abs/2311.12022" rel="noopener"><rect x="72.00" y="707.20" width="152.35" height="12.80" fill="transparent"/></a></svg></div>

y="118.55" font-size="11.00" class="sc-loraregular sc-k">RiemannBench</text><text x="148.68" y="114.88" font-size="6.60" class="sc-loraregular">39</text><text x="159.07" y="118.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="183.96" y="118.55" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="229.75" y="118.55" font-size="11.00" class="sc-notoserifcjksc">开发的私有基准测试，包含</text><text x="364.64" y="118.55" font-size="11.00" class="sc-loraregular">25</text><text x="379.44" y="118.55" font-size="11.00" class="sc-notoserifcjksc">道题，涵盖数学中的研究级主</text><text x="72.00" y="134.17" font-size="11.00" class="sc-notoserifcjksc">题。题目由数学教授、研究生以及拥有博士学位的</text><text x="316.89" y="134.17" font-size="11.00" class="sc-loraregular sc-k">IMO</text><text x="72.00" y="149.79" font-size="11.00" class="sc-notoserifcjksc">超出竞赛数学范围的、持续的多步理论推理。每道题都有唯一的闭式答案，并通过自动方式核</text><text x="72.00" y="165.41" font-size="11.00" class="sc-notoserifcjksc">验。</text><text x="72.00" y="227.92" font-size="11.00" class="sc-notoserifcjksc">在最高推理强度下、且不使用工具或网络搜索的情况下，</text><text x="347.00" y="227.92" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="435.24" y="227.92" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="471.14" y="227.92" font-size="11.00" class="sc-loraregular sc-k">55.0%</text><text x="502.07" y="227.92" font-size="11.00" class="sc-notoserifcjksc">，领先</text><text x="72.00" y="243.54" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="191.99" y="243.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="202.99" y="243.54" font-size="11.00" class="sc-loraregular sc-k">43.0%</text><text x="234.02" y="243.54" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="258.91" y="243.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="341.91" y="243.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="352.91" y="243.54" font-size="11.00" class="sc-loraregular sc-k">34.0%</text><text x="383.94" y="243.54" font-size="11.00" class="sc-notoserifcjksc">），为每道题</text><text x="452.83" y="243.54" font-size="11.00" class="sc-loraregular">4</text><text x="461.69" y="243.54" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均</text><text x="72.00" y="259.16" font-size="11.00" class="sc-notoserifcjksc">值。</text><text x="72.00" y="572.86" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="572.86" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 118.77 121.72 126.56 134.84 139.55 145.30 150.98 156.93 161.77 167.52 172.18" y="572.86" font-size="9.00" class="sc-lorabold">8.9.A] RiemannBench</text><text x="180.13" y="572.86" font-size="9.00" class="sc-notoserifcjkscbold">准确率分数。</text><text x="234.13" y="572.86" font-size="9.00" class="sc-notoserifcjksc">模型在最高推理强度下、且不使用工具或网络搜索的条件下进行评估。</text><text x="171.00" y="646.08" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="211.17" y="646.08" font-size="11.00" class="sc-notoserifcjksc">）是一项面向高中生的证明题竞赛，共六道题，为期两天。它是美</text><text x="72.00" y="661.70" font-size="11.00" class="sc-notoserifcjksc">国数学奥赛路径中继</text><text x="173.89" y="661.70" font-size="11.00" class="sc-loraregular">AIME</text><text x="204.30" y="661.70" font-size="11.00" class="sc-notoserifcjksc">之后的下一阶段；</text><text x="292.30" y="661.70" font-size="11.00" class="sc-loraregular">AIME</text><text x="322.70" y="661.70" font-size="11.00" class="sc-notoserifcjksc">去年还是一项热门的</text><text x="424.59" y="661.70" font-size="11.00" class="sc-loraregular">AI</text><text x="438.06" y="661.70" font-size="11.00" class="sc-notoserifcjksc">基准测试，但如今已</text><text x="72.00" y="677.32" font-size="11.00" class="sc-notoserifcjksc">饱和。</text><a href="https://arxiv.org/abs/2604.06802" rel="noopener"><rect x="154.36" y="707.20" width="162.76" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p260.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 260 页"><text x="72.00 80.93 84.30 89.20 94.09 97.73 107.48 112.86 119.84 123.53 131.59 143.93 153.42 158.63" y="346.98" font-size="14.00" class="sc-poppinsmedium">8.11 ArxivMath</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">260</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="99.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.71" y="82.61" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="156.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="170.67" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="198.49" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="212.38" y="82.61" font-size="11.00" class="sc-loraregular">3</text><text x="221.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="235.30 241.20 245.07 251.56 257.47" y="82.61" font-size="11.00" class="sc-loraregular">21–22</text><text x="266.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">日举行，此时</text><text x="335.16" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="376.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的训练数据几乎已全部收集完</text><text x="72.00" y="131.20" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="131.20" font-size="11.00" class="sc-loraregular sc-k">USAMO</text><text x="139.96" y="131.20" font-size="11.00" class="sc-notoserifcjksc">的解答是证明而非简短答案，评分可能具有挑战性且带有主观性。我们遵循</text><text x="72.00" y="146.82" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="128.43" y="143.16" font-size="6.60" class="sc-loraregular">40</text><text x="139.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">的评分方法：每份证明先由一个中立模型（</text><text x="348.00" y="146.82" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="421.43" y="146.82" font-size="11.00" class="sc-notoserifcjksc">）改写，再由</text><text x="490.33" y="146.82" font-size="11.00" class="sc-loraregular">3</text><text x="499.35" y="146.82" font-size="11.00" class="sc-notoserifcjksc">个前沿</text><text x="72.00" y="162.44" font-size="11.00" class="sc-notoserifcjksc">模型组成的评审组（我们使用的是</text><text x="239.89" y="162.44" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro</text><text x="313.33" y="162.44" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="324.33" y="162.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="410.28" y="162.44" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="424.18" y="162.44" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="178.06" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="178.06" font-size="11.00" class="sc-notoserifcjksc">）依据既定的评分细则进行评判。最终分数取所有评判者给出的最低分。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="135.84" y="228.34" font-size="11.00" class="sc-loraregular sc-k">medium</text><text x="177.65" y="228.34" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="188.65" y="228.34" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="214.16" y="228.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="228.06" y="228.34" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="259.40" y="228.34" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="339.29" y="228.34" font-size="11.00" class="sc-loraregular sc-k">99.8%</text><text x="370.29" y="228.34" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="395.18" y="228.34" font-size="11.00" class="sc-loraregular sc-k">low</text><text x="416.20" y="228.34" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="496.09" y="228.34" font-size="11.00" class="sc-loraregular">98.3%</text><text x="527.04" y="228.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">为每道题</text><text x="118.89" y="243.96" font-size="11.00" class="sc-loraregular">10</text><text x="132.62" y="243.96" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均值。在全部</text><text x="256.51" y="243.96" font-size="11.00" class="sc-loraregular sc-k">240</text><text x="277.87" y="243.96" font-size="11.00" class="sc-notoserifcjksc">次尝试中，唯一一份被不止一位评判者打出非满分的</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">证明，是对第</text><text x="140.89" y="259.58" font-size="11.00" class="sc-loraregular">6</text><text x="150.14" y="259.58" font-size="11.00" class="sc-notoserifcjksc">题的一次</text><text x="197.04" y="259.58" font-size="11.00" class="sc-loraregular sc-k">low</text><text x="218.06" y="259.58" font-size="11.00" class="sc-notoserifcjksc">推理强度尝试：在这次尝试中，模型自己没有声称给出完整解答，</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">而是转而证明了一个受限的子情形。每次尝试的平均</text><text x="327.89" y="275.20" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="359.95" y="275.20" font-size="11.00" class="sc-notoserifcjksc">用量从</text><text x="395.84" y="275.20" font-size="11.00" class="sc-loraregular sc-k">low</text><text x="416.86" y="275.20" font-size="11.00" class="sc-notoserifcjksc">推理强度下的约</text><text x="496.75" y="275.20" font-size="11.00" class="sc-loraregular">42K</text><text x="519.03" y="275.20" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="72.00" y="290.82" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="103.34" y="290.82" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="128.23" y="290.82" font-size="11.00" class="sc-loraregular">100K</text><text x="156.30" y="290.82" font-size="11.00" class="sc-notoserifcjksc">不等。在类似设置下，</text><text x="266.30" y="290.82" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="313.90" y="290.82" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="338.79" y="290.82" font-size="11.00" class="sc-loraregular sc-k">96.7%</text><text x="368.51" y="290.82" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="379.51" y="290.82" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="425.64" y="290.82" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="450.53" y="290.82" font-size="11.00" class="sc-loraregular sc-k">69.3%</text><text x="481.48" y="290.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="369.64" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="127.98" y="369.64" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87" y="369.64" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="212.20" y="369.64" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准。题目每月从近期</text><text x="468.09" y="369.64" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="496.52" y="369.64" font-size="11.00" class="sc-notoserifcjksc">论文摘要</text><text x="72.00" y="385.26" font-size="11.00" class="sc-notoserifcjksc">中提取，随后经过自动和人工检查筛选，以确保其自成一体、非平凡且可验证。由于题目取自活</text><text x="72.00" y="400.88" font-size="11.00" class="sc-notoserifcjksc">跃的研究，该基准比竞赛</text><text x="195.89" y="400.88" font-size="11.00" class="sc-loraregular">/</text><text x="206.38" y="400.88" font-size="11.00" class="sc-notoserifcjksc">奥赛类基准更贴近现实，与数学研究的联系也更紧密。</text><text x="72.00" y="482.77" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="482.77" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="146.71" y="482.77" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="160.60" y="482.77" font-size="11.00" class="sc-loraregular">3</text><text x="169.62" y="482.77" font-size="11.00" class="sc-notoserifcjksc">月和</text><text x="194.52" y="482.77" font-size="11.00" class="sc-loraregular">4</text><text x="203.37" y="482.77" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="214.37" y="479.10" font-size="6.60" class="sc-loraregular">41</text><text x="223.25" y="482.77" font-size="11.00" class="sc-notoserifcjksc">发布的题目（共</text><text x="303.14" y="482.77" font-size="11.00" class="sc-loraregular">71</text><text x="315.11" y="482.77" font-size="11.00" class="sc-notoserifcjksc">道）进行评估，选择这两期是为了避免与</text><text x="72.00" y="498.39" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="101.51" y="498.39" font-size="11.00" class="sc-notoserifcjksc">的训练数据发生污染。启用扩展思考的</text><text x="291.41" y="498.39" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="341.36" y="498.39" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="377.25" y="498.39" font-size="11.00" class="sc-loraregular">78.52%</text><text x="412.68" y="498.39" font-size="11.00" class="sc-notoserifcjksc">，为每道题四次运行的平</text><text x="72.00" y="514.01" font-size="11.00" class="sc-notoserifcjksc">均值，领先</text><text x="129.89" y="514.01" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="171.34" y="514.01" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="182.34" y="514.01" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="210.79" y="514.01" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="235.68" y="514.01" font-size="11.00" class="sc-loraregular">71.48%</text><text x="272.07" y="514.01" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="285.96" y="514.01" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro Preview</text><text x="405.82" y="514.01" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="419.71" y="514.01" font-size="11.00" class="sc-loraregular sc-k">64.79%</text><text x="455.38" y="510.34" font-size="6.60" class="sc-lo notoserifcjksc">，以</text><text x="291.89" y="373.98" font-size="9.00" class="sc-loraregular sc-k">GraphWalks Parents</text><text x="378.84" y="373.98" font-size="9.00" class="sc-notoserifcjksc">分数衡量。</text><text x="72.00" y="409.39" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="409.39" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="474.14" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="474.14" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="474.14" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="474.14" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="470.47" font-size="6.60" class="sc-loraregular">45</text><text x="238.73" y="474.14" font-size="11.00" class="sc-notoserifcjksc">是一个处于人类知识前沿的多模态基准测试，包含</text><text x="483.62 489.53 492.30 498.30 505.13" y="474.14" font-size="11.00" class="sc-loraregular">2,500</text><text x="514.86" y="474.14" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="489.76" font-size="11.00" class="sc-notoserifcjksc">目。</text><text x="72.00" y="522.95" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="522.95" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="242.95" y="522.95" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="264.95" y="522.95" font-size="11.00" class="sc-loraregular">1</text><text x="268.95" y="522.95" font-size="11.00" class="sc-notoserifcjksc">）不使用工具的纯推理；（</text><text x="400.95" y="522.95" font-size="11.00" class="sc-loraregular">2</text><text x="406.86" y="522.95" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜索、网页抓</text><text x="72.00" y="538.57" font-size="11.00" class="sc-notoserifcjksc">取、程序化工具调用和代码执行。在所有运行中，思考均设置为</text><text x="382.89" y="538.57" font-size="11.00" class="sc-loraregular sc-k">auto</text><text x="405.76" y="538.57" font-size="11.00" class=
