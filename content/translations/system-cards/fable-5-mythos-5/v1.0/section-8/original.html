85</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">268</text><text x="72.00" y="365.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="365.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="365.91" font-size="9.00" class="sc-lorabold sc-k">8.14.3.B] DeepSearchQA</text><text x="189.54" y="365.91" font-size="9.00" class="sc-notoserifcjksc">分数与各推理强度档位下平均每任务成本的关系。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="425.94" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="425.94" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10" y="425.94" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="408.89" y="422.27" font-size="6.60" class="sc-loraregular">48</text><text x="416.17" y="425.94" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="441.07" y="425.94" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="495.89" y="425.94" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="441.56" font-size="11.00" class="sc-notoserifcjksc">度研究基准，旨在评估模型在各类复杂研究问题上的表现。</text><text x="358.00" y="441.56" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="399.68" y="441.56" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="413.57" y="441.56" font-size="11.00" class="sc-loraregular">100</text><text x="434.13" y="441.56" font-size="11.00" class="sc-notoserifcjksc">个精选任务组成，这</text><text x="72.00" y="457.18" font-size="11.00" class="sc-notoserifcjksc">些任务源自从金融到医学等多个领域的用户查询。题目使用专家撰写的评分细则进行评分，涵盖</text><text x="72.00" y="472.80" font-size="11.00" class="sc-notoserifcjksc">四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="539.50" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取和代码执行工具并配合程序化工具调用的条件下评估了</text><text x="492.89" y="539.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="555.12" font-size="11.00" class="sc-notoserifcjksc">模型。所有</text><text x="129.89" y="555.12" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="555.12" font-size="11.00" class="sc-notoserifcjksc">模型均在</text><text x="215.08" y="555.12" font-size="11.00" class="sc-loraregular">max</text><text x="239.31" y="555.12" font-size="11.00" class="sc-notoserifcjksc">推理强度下使用自适应思考进行评估，</text><text x="426.31" y="555.12" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="458.36" y="555.12" font-size="11.00" class="sc-notoserifcjksc">上限为</text><text x="494.26" y="555.12" font-size="11.00" class="sc-loraregular">100</text><text x="514.82" y="555.12" font-size="11.00" class="sc-notoserifcjksc">万。</text><text x="72.00" y="570.74" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89" y="570.74" font-size="11.00" class="sc-loraregular">98</text><text x="145.33" y="570.74" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="159.22" y="570.74" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="191.27" y="570.74" font-size="11.00" class="sc-notoserifcjksc">的任务预算，且未使用上下文压缩，因为它对该任务并无显著帮助。</text><text x="72.00" y="586.36" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="586.36" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="174.13" y="586.36" font-size="11.00" class="sc-loraregular">max</text><text x="198.37" y="586.36" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得了</text><text x="289.26" y="586.36" font-size="11.00" class="sc-loraregular">86.4%</text><text x="322.93" y="586.36" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="72.00" y="636.64" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89" y="636.64" font-size="11.00" class="sc-notoserifcjksc">原始</text><text x="143.79" y="636.64" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="185.46" y="636.64" font-size="11.00" class="sc-notoserifcjksc">论文使用</text><text x="232.36 240.73 246.69 256.53 259.62 266.29 269.38 274.50 280.63 286.01 292.67 297.36" y="636.64" font-size="11.00" class="sc-loraregular">Gemini-3-Pro</text><text x="306.68" y="636.64" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型已不再可用。在我</text><text x="72.00" y="652.26" font-size="11.00" class="sc-notoserifcjksc">们的评估中，我们使用</text><text x="184.89" y="652.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="270.85" y="652.26" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="295.74" y="652.26" font-size="11.00" class="sc-loraregular">LLM</text><text x="321.45" y="652.26" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="376.45" y="652.26" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="430.16" y="652.26" font-size="11.00" class="sc-notoserifcjksc">），依据各任务的评分</text><text x="72.00" y="667.88" font-size="11.00" class="sc-notoserifcjksc">细则对</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="294.62" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p269.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 269 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">269</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">回答进行评分，采用相同的二元</text><text x="228.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">MET/UNMET</text><text x="303.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="405.10" y="82.61" font-size="11.00" class="sc-loraregular">4.2</text><text x="422.57" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节的公式汇总为归一化</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的方案，对每个回答进行</text><text x="294.89" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="303.78" y="98.23" font-size="11.00" class="sc-notoserifcjksc">次独立的评分运行，并报告平均值。我们的评判</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">提示词取自论文附录</text><text x="173.89" y="113.85" font-size="11.00" class="sc-loraregular">C.2</text><text x="190.20" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="248.09" y="113.85" font-size="11.00" class="sc-loraregular">A</text><text x="257.87" y="113.85" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数变化</text><text x="469.76" y="113.85" font-size="11.00" class="sc-loraregular">10–25</text><text x="501.88" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">系统排序保持不变，因此我们的分数无法与论文的主要公布数字直接比较。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">除更换评判模型之外，我们与原论文的唯一其他差异是：我们指示模型将最终报告放在</text><text x="72.00" y="211.57" font-size="11.00" class="sc-robotomonoregular" fill="#188038">&lt;result&gt;</text><text x="127.70" y="211.57" font-size="11.00" class="sc-notoserifcjksc">标签内，并且只对该部分进行评分，而不是对完整的智能体对话记录评分；这样可以</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">将交付物与中间的工具输出隔离开来。</text><text x="72.00" y="554.54" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="554.54" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.68 111.78 117.32 120.79 123.16 129.86 136.04 141.87 148.06" y="554.54" font-size="9.00" class="sc-lorabold">8.14.4.A] DRACO</text><text x="157.35" y="554.54" font-size="9.00" class="sc-notoserifcjksc">分数与各推理强度档位下平均每任务成本的关系。</text><text x="72.00" y="589.98" font-size="14.00" class="sc-poppinssemibold">8.15</text><text x="102.06" y="589.98" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="616.52" font-size="11.00" class="sc-notoserifcjksc">我们在多种多智能体配置下评估了</text><text x="239.89" y="616.52" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="325.24" y="616.52" font-size="11.00" class="sc-notoserifcjksc">。在这些设置中，模型的多个实例在同一任</text><text x="72.00" y="632.14" font-size="11.00" class="sc-notoserifcjksc">务上协作。下面，我们重点介绍在两个基准测试（</text><text x="314.00" y="632.14" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="385.05" y="632.14" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="398.94" y="632.14" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="474.86" y="632.14" font-size="11.00" class="sc-notoserifcjksc">）上的结果，</text><text x="72.00" y="647.76" font-size="11.00" class="sc-notoserifcjksc">并描述我们测试的运行框架和测量方法。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p270.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 270 页"><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">49</text><text x="81.35 90.90 96.32 99.13 101.66 104.29 107.81 110.27 112.80 115.43 120.77 124.64 127.27 132.43 135.15 137.61 140.24 143.28 148.65 154.79 160.16 165.61 168.65 171.11 173.74 179.88 184.14 189.89 197.89 202.52 207.94 214.93 220.77 229.71 235.68 238.18 240.81 247.06 249.69 254.32 257.13 266.07 272.03 274.75 280.17 282.80 287.98 293.32 297.19 299.82 305.14 311.13 316.29 319.00 321.72 327.14 333.21 338.98 341.79 347.85 353.38 356.01 361.83 367.25 373.31 378.63 384.62 393.56 398.71 403.00 408.37 411.00 414.33 420.17 424.50 427.13 432.95 437.21 442.96 450.96 455.59 458.40 464.47 470.00 472.62 477.78 483.26 488.68 494.66 498.52 503.15" y="704.47" font-size="10.00" class="sc-loraregular">Wei, J., et al. (2025). BrowseComp: A simple yet challenging benchmark for browsing agents.</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.53 114.73 120.15 122.61 126.25 131.62 137.06 140.70 146.48" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2504.12516.</text><text x="151.57 157.47 161.43 165.30 171.27 175.90 178.40 182.09 188.54 193.70 198.03 203.33 206.14 210.79 213.25 219.10 223.38 228.91 235.36 240.52 246.34 250.62 257.51 262.88 268.33 274.54 279.96 282.41 286.05 291.42 296.87 300.51" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2504.12516</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">270</text><text x="72.00" y="119.59" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.15.1</text><text x="108.00" y="119.59" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="163.09" y="119.59" font-size="13.00" class="sc-poppinssemibold" fill="#666666">BrowseComp</text><text x="72.00" y="147.45" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="140.16" y="143.79" font-size="6.60" class="sc-loraregular">49</text><text x="150.44" y="147.45" font-size="11.00" class="sc-notoserifcjksc">测试智能体在开放网络上查找难以定位的信息的能力。我们使用第</text><text x="472.33" y="147.45" font-size="11.00" class="sc-loraregular">8.15.3</text><text x="502.95" y="147.45" font-size="11.00" class="sc-notoserifcjksc">节所述</text><text x="72.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">的三种运行框架类型运行了多智能体</text><text x="250.89" y="163.07" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="319.05" y="163.07" font-size="11.00" class="sc-notoserifcjksc">，并采用第</text><text x="376.94" y="163.07" font-size="11.00" class="sc-loraregular">8.15.4</text><text x="407.39" y="163.07" font-size="11.00" class="sc-notoserifcjksc">节所述的方法分析了结果。</text><text x="72.00" y="178.69" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="178.69" font-size="11.00" class="sc-loraregular">8.15.1.A</text><text x="123.98" y="178.69" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="148.87" y="178.69" font-size="11.00" class="sc-loraregular">8.15.1.B</text><text x="186.91" y="178.69" font-size="11.00" class="sc-notoserifcjksc">将多智能体</text><text x="244.80" y="178.69" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="315.85" y="178.69" font-size="11.00" class="sc-notoserifcjksc">结果与单智能体结果并列呈现。以下是一些关</text><text x="72.00" y="194.31" font-size="11.00" class="sc-notoserifcjksc">键发现：</text><text x="72.00" y="570.24" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="570.24" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.60 104.70 108.35 110.45 115.98 119.46 121.82 127.67 131.92 136.95 144.25 148.62 153.46 159.65 164.75 172.99" y="570.24" font-size="9.00" class="sc-lorabold">8.15.1.A] BrowseComp</text><text x="180.76" y="570.24" font-size="9.00" class="sc-notoserifcjkscbold">的准确率与延迟</text><text x="243.76" y="570.24" font-size="9.00" class="sc-notoserifcjksc">，涵盖单智能体和多智能体配置。</text><text x="72.00" y="609.30" font-size="11.00" class="sc-notoserifcjkscbold">多智能体运行框架取得了最高分数，并在得分</text><text x="292.00" y="609.30" font-size="11.00" class="sc-lorabold">–</text><text x="298.19" y="609.30" font-size="11.00" class="sc-notoserifcjkscbold">延迟前沿上帕累托占优</text><text x="408.19" y="609.30" font-size="11.00" class="sc-notoserifcjksc">。每个多智能体变体的得分</text><text x="72.00" y="624.92" font-size="11.00" class="sc-notoserifcjksc">都高于最佳单智能体变体，其中异步子智能体达到了我们的最高分</text><text x="393.89" y="624.92" font-size="11.00" class="sc-loraregular">93.3%</text><text x="424.78" y="624.92" font-size="11.00" class="sc-notoserifcjksc">。随着智能体数量增</text><text x="72.00" y="640.54" font-size="11.00" class="sc-notoserifcjksc">加，延迟与准确率同步改善：相对于单智能体</text><text x="294.89" y="640.54" font-size="11.00" class="sc-loraregular">1000</text><text x="322.28" y="640.54" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="336.18" y="640.54" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="368.23" y="640.54" font-size="11.00" class="sc-notoserifcjksc">基线，</text><a href="https://arxiv.org/abs/2504.12516" rel="noopener"><rect x="151.57" y="707.20" width="154.72" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p271.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 271 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">271</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">固定智能体团队在三个、五个和十个智能体时分别实现了</text><text x="349.89" y="82.61" font-size="11.00" class="sc-loraregular">2.2×</text><text x="370.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="381.24" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2.7×</text><text x="403.30" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="417.19" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2.7×</text><text x="439.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的加速，其中十智能</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">体团队的得分也比该基线高出</text><text x="217.89" y="98.23" font-size="11.00" class="sc-loraregular">4.2</text><text x="235.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个百分点。</text><text x="72.00" y="131.20" font-size="11.00" class="sc-notoserifcjksc">这些收益是以</text><text x="140.89" y="131.20" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="172.95" y="131.20" font-size="11.00" class="sc-notoserifcjksc">为代价的。图</text><text x="241.84" y="131.20" font-size="11.00" class="sc-loraregular">8.15.1.B</text><text x="279.88" y="131.20" font-size="11.00" class="sc-notoserifcjksc">显示，</text><text x="312.88" y="131.20" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="344.93" y="131.20" font-size="11.00" class="sc-notoserifcjksc">用量随智能体数量与得分一同上升，表</text><text x="72.00" y="146.82" font-size="11.00" class="sc-notoserifcjksc">明多智能体配置可以通过将工作分配给多个智能体，有效地吸收额外的</text><text x="415.89" y="146.82" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="447.95" y="146.82" font-size="11.00" class="sc-notoserifcjksc">预算。</text><text x="480.95" y="146.82" font-size="11.00" class="sc-notoserifcjkscbold">综合来看，</text><text x="72.00" y="162.44" font-size="11.00" class="sc-notoserifcjkscbold">多智能体运行框架提供了一种延迟与成本的权衡</text><text x="303.00" y="162.44" font-size="11.00" class="sc-notoserifcjksc">：当延迟很重要时，固定智能体团队或异步子智</text><text x="72.00" y="178.06" font-size="11.00" class="sc-notoserifcjksc">能体能够更快地达到给定分数，代价是更高的</text><text x="294.89" y="178.06" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="326.95" y="178.06" font-size="11.00" class="sc-notoserifcjksc">消耗。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjkscbold">在多智能体运行框架中，非阻塞运行框架（固定智能体团队和异步子智能体）合起来在延迟和</text><text x="72.00" y="260.17" font-size="11.00" class="sc-lorabold sc-k">token</text><text x="104.81" y="260.17" font-size="11.00" class="sc-notoserifcjkscbold">用量两方面都优于阻塞运行框架</text><text x="258.81" y="260.17" font-size="11.00" class="sc-notoserifcjksc">。在每一个目标准确率上，二者中至少有一个能以更短的</text><text x="72.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">时间和更少的</text><text x="140.89" y="275.79" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="172.95" y="275.79" font-size="11.00" class="sc-notoserifcjksc">达到该准确率。延迟优势来自去除了同步屏障：在阻塞运行框架中，编排器</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">必须等待每个已派发的子智能体返回后才能继续，因此每一轮都受制于其中最慢的子智能体；而</text><text x="72.00" y="307.03" font-size="11.00" class="sc-notoserifcjksc">另外两种运行框架则让智能体各自独立推进。</text><text x="292.00" y="307.03" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="324.05" y="307.03" font-size="11.00" class="sc-notoserifcjksc">优势可能来自上下文的持久性：它们的智能</text><text x="72.00" y="322.65" font-size="11.00" class="sc-notoserifcjksc">体是长期存活的，并在整个问题过程中保留上下文；而阻塞运行框架会为每个子任务派生一个新</text><text x="72.00" y="338.27" font-size="11.00" class="sc-notoserifcjksc">的子智能体，每次都要花费</text><text x="206.89" y="338.27" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="238.95" y="338.27" font-size="11.00" class="sc-notoserifcjksc">重新建立上下文。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p272.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 272 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">272</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="414.42" font-size="9.00" class="sc-lorabold sc-k">8.15.1.B] BrowseComp</text><text x="180.76" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">的准确率与</text><text x="228.13" y="414.42" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="254.98" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">总用量</text><text x="281.98" y="414.42" font-size="9.00" class="sc-notoserifcjksc">，涵盖单智能体和多智能体配置。</text><text x="416.98" y="414.42" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="443.21" y="414.42" font-size="9.00" class="sc-notoserifcjksc">总用量包括输入</text><text x="508.57" y="414.42" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">和输出</text><text x="101.37" y="426.12" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="125.23" y="426.12" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="453.48" font-size="11.00" class="sc-notoserifcjksc">为了理解延迟收益从何而来，图</text><text x="228.89" y="453.48" font-size="11.00" class="sc-loraregular">8.15.1.C</text><text x="267.78" y="453.48" font-size="11.00" class="sc-notoserifcjksc">将总体改进分解为逐题加速比，并按题目难度绘制。我</text><text x="72.00" y="469.11" font-size="11.00" class="sc-notoserifcjksc">们使用此前</text><text x="129.89" y="469.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="469.11" font-size="11.00" class="sc-notoserifcjksc">模型运行的平均通过率（涵盖</text><text x="314.08" y="469.11" font-size="11.00" class="sc-loraregular">3</text><text x="323.10" y="469.11" font-size="11.00" class="sc-notoserifcjksc">个模型系列的</text><text x="391.99" y="469.11" font-size="11.00" class="sc-loraregular">10</text><text x="405.72" y="469.11" font-size="11.00" class="sc-notoserifcjksc">个变体，不包括</text><text x="485.61" y="469.11" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="484.73" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="484.73" font-size="11.00" class="sc-notoserifcjksc">）作为难度的代理指标，发现无论是逐题意义还是加总意义上，加速比都随题目难度增</text><text x="72.00" y="500.35" font-size="11.00" class="sc-notoserifcjksc">加而上升。在较容易的题目上（通过率</text><text x="261.89" y="500.35" font-size="11.00" class="sc-loraregular">&gt;= 50%</text><text x="298.84" y="500.35" font-size="11.00" class="sc-notoserifcjksc">），逐题加速比的中位数为</text><text x="433.74" y="500.35" font-size="11.00" class="sc-loraregular sc-k">0.8×</text><text x="455.11" y="500.35" font-size="11.00" class="sc-notoserifcjksc">，因为在本身已</text><text x="72.00" y="515.96" font-size="11.00" class="sc-notoserifcjksc">经很快的题目上，协调开销大致抵消了并行带来的收益；但该区间的加总延迟仍下降了</text><text x="492.89" y="515.96" font-size="11.00" class="sc-loraregular sc-k">2.0×</text><text x="514.00" y="515.96" font-size="11.00" class="sc-notoserifcjksc">，因</text><text x="72.00" y="531.59" font-size="11.00" class="sc-notoserifcjksc">为总和主要由该区间中最慢的题目决定，而这些题目确实从中受益。在较难的题目上（通过率</text><text x="525.89" y="531.59" font-size="11.00" class="sc-loraregular">&lt;</text><text x="72.00" y="547.21" font-size="11.00" class="sc-loraregular">50%</text><text x="94.40" y="547.21" font-size="11.00" class="sc-notoserifcjksc">），逐题加速比的中位数升至</text><text x="240.29" y="547.21" font-size="11.00" class="sc-loraregular sc-k">1.6×</text><text x="259.08" y="547.21" font-size="11.00" class="sc-notoserifcjksc">，加总延迟下降了</text><text x="349.97" y="547.21" font-size="11.00" class="sc-loraregular">4.4×</text><text x="370.43" y="547.21" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="381.43" y="547.21" font-size="11.00" class="sc-notoserifcjkscbold">因此，总体延迟改进是由困难长</text><text x="72.00" y="562.83" font-size="11.00" class="sc-notoserifcjkscbold">尾驱动的</text><text x="116.00" y="562.83" font-size="11.00" class="sc-notoserifcjksc">。延迟最高的题目主导了平均值，而这些恰恰是多智能体策略帮助最大的题目。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p273.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 273 页"><text x="72.00" y="702.22" font-size="5.40" class="sc-loraregular">50</text><text x="80.65" y="706.02" font-size="9.00" class="sc-loraregular sc-k">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch? arXiv:2605.03546.</text><text x="72.00" y="717.52" font-size="9.00" class="sc-loraregular sc-k" fill="#1155cc">https://arxiv.org/abs/2605.03546</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">273</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="390.43" font-size="9.00" class="sc-lorabold">8.15.1.C]</text><text x="122.48" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">十智能体团队相对于</text><text x="205.85" y="390.43" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="232.70" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">上限为</text><text x="262.06" y="390.43" font-size="9.00" class="sc-lorabold">1000</text><text x="285.26" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">万的单智能体的逐题加速比，按全部</text><text x="431.62" y="390.43" font-size="9.00" class="sc-lorabold">1266</text><text x="452.79" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">道</text><text x="464.16" y="390.43" font-size="9.00" class="sc-lorabold sc-k">BrowseComp</text><text x="523.10" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">题目</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjkscbold">的逐题经验通过率绘制。</text><text x="171.00" y="402.13" font-size="9.00" class="sc-loraregular">x</text><text x="178.14" y="402.13" font-size="9.00" class="sc-notoserifcjksc">轴为此前</text><text x="216.50" y="402.13" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="247.83" y="402.13" font-size="9.00" class="sc-notoserifcjksc">模型运行（涵盖</text><text x="313.20" y="402.13" font-size="9.00" class="sc-loraregular">3</text><text x="320.58" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个模型系列的</text><text x="376.95" y="402.13" font-size="9.00" class="sc-loraregular">10</text><text x="388.18" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个变体，不包括</text><text x="453.55" y="402.13" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="523.38" y="402.13" font-size="9.00" class="sc-notoserifcjksc">）得</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">出的逐题通过率，用作任务难度的代理指标。</text><text x="252.00" y="413.83" font-size="9.00" class="sc-loraregular">y</text><text x="259.12" y="413.83" font-size="9.00" class="sc-notoserifcjksc">轴为</text><text x="279.49" y="413.83" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="351.68" y="413.83" font-size="9.00" class="sc-notoserifcjksc">的多智能体加速比（单智能体延迟除以十智能体</text><text x="72.00" y="425.53" font-size="9.00" class="sc-notoserifcjksc">团队延迟），每道题对应一个点，并按单智能体和十智能体团队回答正确或错误着色。实线为十智能体团队答对该任务</text><text x="72.00" y="513.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.15.2</text><text x="110.75" y="513.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="165.85" y="513.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">ProgramBench</text><text x="72.00" y="541.17" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="537.50" font-size="6.60" class="sc-loraregular">50</text><text x="158.51" y="541.17" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="304.40" y="541.17" font-size="11.00" class="sc-loraregular">200</text><text x="326.87" y="541.17" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获得一个由开源</text><text x="72.00" y="556.79" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在无法访问互联网、也无法使用反编译工具</text><text x="72.00" y="572.41" font-size="11.00" class="sc-notoserifcjksc">的情况下，重建一个能复现原程序行为的代码库。单智能体结果已在第</text><text x="415.89" y="572.41" font-size="11.00" class="sc-loraregular sc-k">8.6</text><text x="433.92" y="572.41" font-size="11.00" class="sc-notoserifcjksc">节中给出，本节介绍</text><text x="72.00" y="588.03" font-size="11.00" class="sc-notoserifcjksc">多智能体</text><text x="118.89" y="588.03" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="197.71" y="588.03" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="72.00" y="638.55" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="638.55" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="186.71" y="638.55" font-size="11.00" class="sc-notoserifcjksc">上评估了固定智能体团队和异步子智能体运行框架，并与单智能体基线进</text><text x="72.00" y="654.17" font-size="11.00" class="sc-notoserifcjksc">行比较，每个智能体的</text><text x="184.89" y="654.17" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="216.95" y="654.17" font-size="11.00" class="sc-notoserifcjksc">上限同为</text><text x="263.84" y="654.17" font-size="11.00" class="sc-loraregular">100</text><text x="284.40" y="654.17" font-size="11.00" class="sc-notoserifcjksc">万。如第</text><text x="331.29" y="654.17" font-size="11.00" class="sc-loraregular sc-k">8.6</text><text x="349.32" y="654.17" font-size="11.00" class="sc-notoserifcjksc">节所述，我们排除了参考二进制文件在</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="72.00" y="708.47" width="143.59" height="11.52" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p274.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 274 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">274</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">隐藏测试集上得分低于</text><text x="184.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="203.51" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="217.40" y="82.61" font-size="11.00" class="sc-loraregular">34</text><text x="232.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个任务，剩下</text><text x="301.27" y="82.61" font-size="11.00" class="sc-loraregular">166</text><text x="320.89" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="331.89" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="336.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="358.29" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="362.13" y="82.61" font-size="11.00" class="sc-notoserifcjksc">任务。我们在一系列中间检查点进行</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评分，并利用由此得到的每个任务在得分、延迟和</text><text x="316.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="348.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的轨迹，构建图</text><text x="439.84" y="98.23" font-size="11.00" class="sc-loraregular">8.15.2.A</text><text x="479.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">8.15.2.B</text><text x="111.94" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。</text><text x="72.00" y="472.07" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="472.07" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.60 104.70 109.49 111.59 117.13" y="472.07" font-size="9.00" class="sc-lorabold">8.15.2.A]</text><text x="122.97" y="472.07" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="143.33" y="472.07" font-size="9.00" class="sc-lorabold">166</text><text x="159.70" y="472.07" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="168.70" y="472.07" font-size="9.00" class="sc-lorabold">“</text><text x="172.51" y="472.07" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="190.51" y="472.07" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="260.68" y="472.07" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟。</text><text x="350.68" y="472.07" font-size="9.00" class="sc-notoserifcjksc">阴影区域表示</text><text x="407.05" y="472.07" font-size="9.00" class="sc-loraregular">95%</text><text x="427.36" y="472.07" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="72.00" y="483.77" font-size="9.00" class="sc-loraregular sc-k">interval</text><text x="103.78" y="483.77" font-size="9.00" class="sc-notoserifcjksc">），由各任务之间的得分差异计算得出。</text><text x="72.00" y="511.11" font-size="11.00" class="sc-notoserifcjkscbold">两种多智能体运行框架都以更多的</text><text x="239.89" y="511.11" font-size="11.00" class="sc-lorabold sc-k">token</text><text x="272.71" y="511.11" font-size="11.00" class="sc-notoserifcjkscbold">用量为代价，取得了更高的分数和显著的加速</text><text x="492.71" y="511.11" font-size="11.00" class="sc-notoserifcjksc">。从图</text><text x="72.00" y="526.73" font-size="11.00" class="sc-loraregular">8.15.2.A</text><text x="111.99" y="526.73" font-size="11.00" class="sc-notoserifcjksc">可以看出，在完整黄金集上，五智能体团队的最终得分比单智能体高出</text><text x="455.88" y="526.73" font-size="11.00" class="sc-loraregular sc-k">7.9</text><text x="472.42" y="526.73" font-size="11.00" class="sc-notoserifcjksc">个百分点。值</text><text x="72.00" y="542.35" font-size="11.00" class="sc-notoserifcjksc">得注意的是，与此同时，它达到</text><text x="228.89" y="542.35" font-size="11.00" class="sc-loraregular">60%</text><text x="254.55" y="542.35" font-size="11.00" class="sc-notoserifcjksc">隐藏测试通过率的速度还提升了</text><text x="411.44" y="542.35" font-size="11.00" class="sc-loraregular">3.2×</text><text x="432.01" y="542.35" font-size="11.00" class="sc-notoserifcjksc">。图</text><text x="456.90" y="542.35" font-size="11.00" class="sc-loraregular">8.15.2.B</text><text x="496.84" y="542.35" font-size="11.00" class="sc-notoserifcjksc">显示了第</text><text x="72.00" y="557.97" font-size="11.00" class="sc-loraregular">8.15.1</text><text x="100.49" y="557.97" font-size="11.00" class="sc-notoserifcjksc">节所述的同样的延迟与成本的权衡：得分提升和延迟收益来自于花费更多</text><text x="455.38" y="557.97" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="487.44" y="557.97" font-size="11.00" class="sc-notoserifcjksc">以及对问</text><text x="72.00" y="573.59" font-size="11.00" class="sc-notoserifcjksc">题进行并发处理。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p275.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 275 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">275</text><text x="72.00" y="414.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="414.43" font-size="9.00" class="sc-lorabold sc-k">8.15.2.B]</text><text x="122.97" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="143.33" y="414.43" font-size="9.00" class="sc-lorabold">166</text><text x="159.70" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="168.70" y="414.43" font-size="9.00" class="sc-lorabold">“</text><text x="172.51" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="190.51" y="414.43" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="260.68" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与</text><text x="326.05" y="414.43" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="352.90" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">用量。</text><text x="379.90" y="414.43" font-size="9.00" class="sc-notoserifcjksc">阴影区域表示</text><text x="436.27" y="414.43" font-size="9.00" class="sc-loraregular">95%</text><text x="456.57" y="414.43" font-size="9.00" class="sc-notoserifcjksc">置信区间，由各任务</text><text x="72.00" y="426.13" font-size="9.00" class="sc-notoserifcjksc">之间的得分差异计算得出。</text><text x="72.00" y="458.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.15.3</text><text x="111.08" y="458.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="485.89" font-size="11.00" class="sc-notoserifcjksc">我们评估了三种多智能体运行框架。所有运行框架都以</text><text x="338.89" y="485.89" font-size="11.00" class="sc-loraregular">max</text><text x="363.13" y="485.89" font-size="11.00" class="sc-notoserifcjksc">推理强度运行每个智能体，并共享一</text><text x="72.00" y="501.51" font-size="11.00" class="sc-notoserifcjksc">组通用工具：搜索类任务使用网络搜索、网页抓取和程序化工具调用（代码执行和</text><text x="470.89" y="501.51" font-size="11.00" class="sc-loraregular">bash</text><text x="494.65" y="501.51" font-size="11.00" class="sc-notoserifcjksc">）；编程</text><text x="72.00" y="517.13" font-size="11.00" class="sc-notoserifcjksc">类任务使用</text><text x="129.89" y="517.13" font-size="11.00" class="sc-loraregular">bash</text><text x="156.55" y="517.13" font-size="11.00" class="sc-notoserifcjksc">工具。</text><text x="72.00" y="550.67" font-size="11.00" class="sc-notoserifcjkscbold">带阻塞式子智能体的编排器。</text><text x="215.00" y="550.67" font-size="11.00" class="sc-notoserifcjksc">由单个编排器协调任务：它派生子智能体，并阻塞等待直到所有子</text><text x="72.00" y="566.29" font-size="11.00" class="sc-notoserifcjksc">智能体返回。编排器本身没有任何任务工具，其唯一的能力就是派生子智能体。每个子智能体都</text><text x="72.00" y="581.91" font-size="11.00" class="sc-notoserifcjksc">获得该基准测试的全套任务工具。子智能体拥有</text><text x="305.89" y="581.91" font-size="11.00" class="sc-loraregular sc-k">200k token</text><text x="366.32" y="581.91" font-size="11.00" class="sc-notoserifcjksc">的上下文窗口，不启用上下文压</text><text x="72.00" y="597.53" font-size="11.00" class="sc-notoserifcjksc">缩；而编排器使用在</text><text x="173.89" y="597.53" font-size="11.00" class="sc-loraregular sc-k">100k token</text><text x="232.41" y="597.53" font-size="11.00" class="sc-notoserifcjksc">时触发的上下文压缩，且没有总体</text><text x="400.31" y="597.53" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="432.36" y="597.53" font-size="11.00" class="sc-notoserifcjksc">上限。</text><text x="72.00" y="664.02" font-size="11.00" class="sc-notoserifcjkscbold">固定智能体团队。</text><text x="160.00" y="664.02" font-size="11.00" class="sc-notoserifcjksc">由三个、五个或十个对等智能体组成的团队同时处理任务。其中一个智能体被</text><text x="72.00" y="679.64" font-size="11.00" class="sc-notoserifcjksc">指定为主智能体，负责协调工作，并在需要时提交最终答案；但所有智能体拥有相同的工具，且</text><text x="72.00" y="695.26" font-size="11.00" class="sc-notoserifcjksc">都能看到完整的任务描述。除任务工具外，每个智能体还有两个消息工具：</text><text x="435.00" y="695.26" font-size="11.00" class="sc-loraregular">Send</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p276.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 276 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">276</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Message</text><text x="115.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，用于向一个或多个队友发送消息（消息会插入在接收方的下一个工具结果之后）；以</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="85.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="174.09" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，它会阻塞采样，直到收到新消息。每个智能体的</text><text x="418.98" y="98.23" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="451.04" y="98.23" font-size="11.00" class="sc-notoserifcjksc">总上限相同，均为</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="92.56" y="113.85" font-size="11.00" class="sc-notoserifcjksc">万。在</text><text x="128.45" y="113.85" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="207.27" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上，每个智能体在各自的任务代码仓库检出副本中工作，并可通过</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Git</text><text x="90.79" y="129.47" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">该运行框架旨在模拟多个智能体协作完成共享任务的真实场景，并通过让对等智能体并行工作来</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">降低延迟。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体。</text><text x="149.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">该框架与阻塞式子智能体运行框架类似，但在这一变体中，主智能体可以派生异</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">步、长期存在的子智能体，同时保留对任务工具的直接访问。与阻塞式设计不同，派生操作会立</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">令，看不到原始任务描述；子智能体可以向任何其他智能体以及主智能体发送消息。子智能体的</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">最终回复会以消息形式发送给主智能体，此后该子智能体进入空闲状态，直到主智能体用新指令</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">将其唤醒。主智能体和子智能体都在</text><text x="250.89" y="306.44" font-size="11.00" class="sc-loraregular">100</text><text x="271.45" y="306.44" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="285.35" y="306.44" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="317.40" y="306.44" font-size="11.00" class="sc-notoserifcjksc">上限下运行，不启用上下文压缩。</text><text x="72.00" y="374.05" font-size="11.00" class="sc-notoserifcjksc">子智能体拥有任务工具，以及与固定智能体团队中相同的通信工具（即</text><text x="415.89" y="374.05" font-size="11.00" class="sc-loraregular sc-k">Send Message</text><text x="490.97" y="374.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="504.86" y="374.05" font-size="11.00" class="sc-loraregular sc-k">Wait</text><text x="72.00" y="389.67" font-size="11.00" class="sc-loraregular sc-k">for Message</text><text x="72.00" y="405.29" font-size="11.00" class="sc-notoserifcjksc">子智能体状态（工作中、空闲或已终止）的工具。对于搜索类任务，只对主智能体的最终提交进</text><text x="72.00" y="420.91" font-size="11.00" class="sc-notoserifcjksc">行评分。在</text><text x="129.89" y="420.91" font-size="11.00" class="sc-loraregular sc-k">BrowseComp</text><text x="200.94" y="420.91" font-size="11.00" class="sc-notoserifcjksc">上，可使用的子智能体数量没有上限；在</text><text x="401.84" y="420.91" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="480.65" y="420.91" font-size="11.00" class="sc-notoserifcjksc">上，受资源</text><text x="72.00" y="436.53" font-size="11.00" class="sc-notoserifcjksc">限制，该运行框架最多同时运行</text><text x="228.89" y="436.53" font-size="11.00" class="sc-loraregular">4</text><text x="237.75" y="436.53" font-size="11.00" class="sc-notoserifcjksc">个子智能体，总数最多</text><text x="350.64" y="436.53" font-size="11.00" class="sc-loraregular">20</text><text x="366.27" y="436.53" font-size="11.00" class="sc-notoserifcjksc">个。</text><text x="72.00" y="501.93" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.15.4</text><text x="111.88" y="501.93" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="529.84" font-size="11.00" class="sc-notoserifcjksc">我们展示的结果侧重于比较单智能体与多智能体运行框架之间的差值，包括分数、延迟和</text><text x="503.89" y="529.84" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">用量。具体而言，</text><text x="160.00" y="545.46" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="192.05" y="545.46" font-size="11.00" class="sc-notoserifcjksc">用量按一个任务上所有智能体消耗的输入与输出</text><text x="425.95" y="545.46" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="458.00" y="545.46" font-size="11.00" class="sc-notoserifcjksc">总数计算。延迟</text><text x="72.00" y="561.08" font-size="11.00" class="sc-notoserifcjksc">以推导的单任务延迟而非原始实际耗时报告：我们将每个智能体的输入和输出</text><text x="448.89" y="561.08" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="480.95" y="561.08" font-size="11.00" class="sc-notoserifcjksc">数分别除以</text><text x="72.00" y="576.70" font-size="11.00" class="sc-notoserifcjksc">固定的参考预填充（</text><text x="201.05" y="576.70" font-size="11.00" class="sc-notoserifcjksc">）与解码速率，再加上实测的工具执行时间，并取并发智能体之间的关</text><text x="72.00" y="592.32" font-size="11.00" class="sc-notoserifcjksc">键路径延迟。这样可以将运行框架的结构性延迟（例如它需要多少串行的模型工作和工具时间）</text><text x="72.00" y="607.94" font-size="11.00" class="sc-notoserifcjksc">与服务端波动（例如批处理、排队、硬件）区分开来，从而在同等条件下比较各运行框架。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p277.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 277 页"><text x="72.00 80.29 83.42 87.97 96.32 99.45 104.00 107.38 117.42 126.64 134.37 137.50 146.31 155.12" y="371.98" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.16.1 GDP.pdf</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">51</text><text x="80.08 85.69 91.66 95.94 101.41 106.83 109.46 115.72 119.07 121.53 124.16 127.20 132.57 138.71 144.08 149.74 152.78 155.24 157.87 165.48 172.83 178.04 180.50 186.47 192.45 195.83 198.33 200.95 207.94 213.10 219.17 221.80 227.08 230.72 236.93 243.14 249.36 251.98 258.24 261.59 264.22 273.16 279.00 284.98 290.40 293.12 297.75 300.38 309.31 314.47 319.10 322.97 328.38 332.71 335.34 339.21 345.20 350.62 353.24 359.22 365.07 370.39 376.36 385.29 390.71 396.69 400.56 405.18 407.81 411.68 417.67 422.76 426.63 429.25 433.58 439.55 445.62 448.25 452.12 458.10 463.52 466.15 474.04 479.88 484.17 486.89 492.87" y="704.47" font-size="10.00" class="sc-loraregular">Surge AI. (2026). GDP.pdf: Can $100B AI models master the documents that run the world?</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 109.01 113.64 119.61 123.89 129.37 134.78 140.77 146.53 148.99 154.15 156.75 163.64 169.46 172.18 178.03 183.55 189.96 195.44 201.42 207.38 212.27 218.24 224.22 227.50 232.38 237.68 242.84 248.91 253.54 257.17 263.38 269.59 275.41 280.30 285.45 288.26 293.15 302.09 307.93 313.91 319.33 322.05 326.68 331.57 340.50 345.66 350.29 354.16 359.57 363.82 368.71 372.58 378.57 383.98 388.87 394.85 400.70 406.02 411.98 420.92 426.34 432.32 436.18 440.81 445.70 449.57 455.56 460.64 464.51 469.40 473.73 479.70 485.76 490.65 494.52 500.51 505.93 510.73 518.62 524.47 528.76 531.48" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">277</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.16</text><text x="102.00" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="110.77" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="110.77" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="182.24" y="110.77" font-size="11.00" class="sc-notoserifcjksc">，我们首次报告了三项新评估的分数：</text><text x="369.24" y="110.77" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="411.01" y="110.77" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="422.01 428.75 431.74 438.31 444.27 450.84 455.60 458.69 465.27 469.53 474.91 481.75 487.71 494.39 500.24 506.83 509.72" y="110.77" font-size="11.00" class="sc-loraregular">Blueprint-Bench 2</text><text x="518.52" y="110.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="126.39" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="126.45" y="126.39" font-size="11.00" class="sc-notoserifcjksc">。与我们以往报告的多模态能力评估（如</text><text x="327.34" y="126.39" font-size="11.00" class="sc-loraregular sc-k">CharXiv Reasoning</text><text x="422.56" y="126.39" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="433.56 440.10 446.99 453.83 459.21 466.05 472.02 478.69 484.54 491.13 494.03 500.00 503.09 509.17 517.79" y="126.39" font-size="11.00" class="sc-loraregular">LAB-Bench FigQA</text><text x="527.57" y="126.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.24 84.09 88.78 94.68 100.64 107.32 113.49 120.06 126.49 130.75 136.13 142.80 147.48" y="142.01" font-size="11.00" class="sc-loraregular">ScreenSpot-Pro</text><text x="153.92" y="142.01" font-size="11.00" class="sc-notoserifcjksc">）不同，这些评估衡量的是真实世界智能体任务中的多模态能力，能更好地反映</text><text x="72.00" y="157.63" font-size="11.00" class="sc-notoserifcjksc">模型在专业场景中的部署方式。</text><text x="72.00" y="207.91" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="116.66" y="207.91" font-size="11.00" class="sc-notoserifcjksc">测试模型能否从常见企业工作流程中的信息密集型文档里提取答案。</text><text x="446.66 453.40 456.40 462.96 468.92 475.49 480.25 483.35 489.92 494.18 499.56 506.40 512.36 519.04 524.89 531.48 534.37" y="207.91" font-size="11.00" class="sc-loraregular">Blueprint-Bench 2</text><text x="72.00" y="223.53" font-size="11.00" class="sc-notoserifcjksc">测试空间推理能力，要求模型根据照片重建</text><text x="283.89" y="223.53" font-size="11.00" class="sc-loraregular">2D</text><text x="300.89" y="223.53" font-size="11.00" class="sc-notoserifcjksc">平面图。</text><text x="344.89" y="223.53" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="469.10" y="223.53" font-size="11.00" class="sc-notoserifcjksc">要求模型根据</text><text x="72.00" y="239.15" font-size="11.00" class="sc-loraregular">3D</text><text x="89.21" y="239.15" font-size="11.00" class="sc-notoserifcjksc">物体的多视图渲染图生成精确的</text><text x="246.11" y="239.15" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="271.66" y="239.15" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="305.05" font-size="11.00" class="sc-notoserifcjksc">这三项评估都仍有相当大的提升空间。尽管如此，在新旧多模态评估上，</text><text x="424.00" y="305.05" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="512.24" y="305.05" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="72.00" y="320.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="320.67" font-size="11.00" class="sc-notoserifcjksc">都有大幅提升。</text><text x="72.00" y="395.84" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="113.77" y="392.18" font-size="6.60" class="sc-loraregular">51</text><text x="122.66" y="395.84" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="136.55" y="395.84" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="182.35" y="395.84" font-size="11.00" class="sc-notoserifcjksc">推出的专家级多模态推理基准测试，包含</text><text x="383.24" y="395.84" font-size="11.00" class="sc-loraregular">100</text><text x="403.80" y="395.84" font-size="11.00" class="sc-notoserifcjksc">个真实世界的提示词和</text><text x="72.00" y="411.46" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="92.72" y="411.46" font-size="11.00" class="sc-notoserifcjksc">，直接取自金融、医疗健康、法律、工程和保险等十个领域的专业工作流程。该基准测试考</text><text x="72.00" y="509.41" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="104.33" y="509.41" font-size="11.00" class="sc-notoserifcjksc">使用其标准运行框架在</text><text x="217.22" y="509.41" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="261.88" y="509.41" font-size="11.00" class="sc-notoserifcjksc">上运行了</text><text x="308.78" y="509.41" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="382.57" y="509.41" font-size="11.00" class="sc-notoserifcjksc">。回复由</text><text x="429.47" y="509.41" font-size="11.00" class="sc-loraregular">Gemini 3 Flash</text><text x="507.68" y="509.41" font-size="11.00" class="sc-notoserifcjksc">依据专</text><text x="72.00" y="525.03" font-size="11.00" class="sc-notoserifcjksc">家编写的评分细则进行评分，评分细则奖励正确的信息提取，并惩罚幻觉出的细节。在所有运行</text><text x="72.00" y="540.65" font-size="11.00" class="sc-notoserifcjksc">中，模型均启用自适应思考和</text><text x="217.89" y="540.65" font-size="11.00" class="sc-loraregular">max</text><text x="242.13" y="540.65" font-size="11.00" class="sc-notoserifcjksc">推理强度，且不使用工具。</text><text x="374.13" y="540.65" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="406.46" y="540.65" font-size="11.00" class="sc-notoserifcjksc">的严格通过率要求模型满足</text><text x="72.00" y="556.27" font-size="11.00" class="sc-notoserifcjksc">某道题的全部评分细则条件才算任务成功，且分数仅在已完成的运行上取平均。</text><text x="457.00" y="556.27" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="489.33" y="556.27" font-size="11.00" class="sc-notoserifcjksc">在全部</text><text x="72.00" y="571.89" font-size="11.00" class="sc-loraregular">100</text><text x="92.56" y="571.89" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估了该模型。</text><text x="72.00" y="622.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="622.75" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="130.55" y="622.75" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55" y="622.75" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="229.24" y="622.75" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="265.14" y="622.75" font-size="11.00" class="sc-loraregular sc-k">29.8%</text><text x="298.58" y="622.75" font-size="11.00" class="sc-notoserifcjksc">的严格通过率，优于</text><text x="400.47" y="622.75" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="486.36" y="622.75" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="638.37" font-size="11.00" class="sc-loraregular">22.5%</text><text x="102.08" y="638.37" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="113.08" y="638.37" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="189.78" y="638.37" font-size="11.00" class="sc-notoserifcjksc">达到了最先进水平（</text><text x="288.78" y="638.37" font-size="11.00" class="sc-loraregular sc-k">state of the art</text><text x="364.30" y="638.37" font-size="11.00" class="sc-notoserifcjksc">），超过了</text><text x="422.20" y="638.37" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="466.54" y="638.37" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="480.43" y="638.37" font-size="11.00" class="sc-loraregular">Gemini 3.1</text><text x="72.00" y="653.99" font-size="11.00" class="sc-loraregular sc-k">Pro</text><text x="89.79" y="653.99" font-size="11.00" class="sc-notoserifcjksc">，后两者的得分分别为</text><text x="202.68" y="653.99" font-size="11.00" class="sc-loraregular sc-k">24.9%</text><text x="235.83" y="653.99" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="249.73" y="653.99" font-size="11.00" class="sc-loraregular sc-k">16.7%</text><text x="277.08" y="653.99" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="497.61" y="694.41" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="72.00" y="707.20" width="465.45" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p278.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 278 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">278</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 108.67 110.76 116.30 119.77 122.14 128.93 135.63 140.56 142.59 148.00 153.36" y="367.92" font-size="9.00" class="sc-lorabold">8.16.1.A] GDP.pdf</text><text x="159.05" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="186.05" y="367.92" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="269.42" y="367.92" font-size="9.00" class="sc-loraregular">max</text><text x="289.24" y="367.92" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，不使用编程工具。严格通过率分数按</text><text x="507.61" y="367.92" font-size="9.00" class="sc-loraregular sc-k">Surge</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">报告的结果发布。</text><text x="72.00" y="406.98" font-size="11.00" class="sc-notoserifcjksc">我们在内部运行框架上对</text><text x="195.89" y="406.98" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="240.55" y="406.98" font-size="11.00" class="sc-notoserifcjksc">进行了评估，分别在使用工具和不使用工具的条件下进行。不</text><text x="72.00" y="422.61" font-size="11.00" class="sc-notoserifcjksc">使用工具时，为与</text><text x="162.89" y="422.61" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="195.22" y="422.61" font-size="11.00" class="sc-notoserifcjksc">的输入提示词保持一致，我们向模型提供</text><text x="396.11" y="422.61" font-size="11.00" class="sc-loraregular">base64</text><text x="434.46" y="422.61" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="470.35" y="422.61" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="491.08" y="422.61" font-size="11.00" class="sc-notoserifcjksc">。不过，</text><text x="72.00" y="438.23" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="438.23" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="118.22" y="438.23" font-size="11.00" class="sc-notoserifcjksc">不同的是，对于超出我们</text><text x="242.12" y="438.23" font-size="11.00" class="sc-loraregular sc-k">API 32MB</text><text x="294.06" y="438.23" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="373.95" y="438.23" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="394.67" y="438.23" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而不是丢</text><text x="72.00" y="453.85" font-size="11.00" class="sc-notoserifcjksc">弃）。使用工具时，我们为模型提供一个容器（其中包含该</text><text x="360.89" y="453.85" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="384.51" y="453.85" font-size="11.00" class="sc-notoserifcjksc">文件并安装了标准</text><text x="475.40" y="453.85" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="514.95" y="453.85" font-size="11.00" class="sc-notoserifcjksc">库）</text><text x="72.00" y="469.46" font-size="11.00" class="sc-notoserifcjksc">以及一个图像裁剪工具。我们报告的是平均评分项通过率，即满足的评分细则条件所占比例，而</text><text x="72.00" y="485.08" font-size="11.00" class="sc-notoserifcjksc">非严格通过率。我们在全部</text><text x="206.89" y="485.08" font-size="11.00" class="sc-loraregular">100</text><text x="227.45" y="485.08" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并对五次运行的分数取平均。</text><text x="72.00" y="552.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="552.72" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="130.55" y="552.72" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55" y="552.72" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="240.79" y="552.72" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时取得了</text><text x="353.69" y="552.72" font-size="11.00" class="sc-loraregular sc-k">72.7%</text><text x="384.55" y="552.72" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通过率，在使用工</text><text x="72.00" y="568.34" font-size="11.00" class="sc-notoserifcjksc">具时得分为</text><text x="129.89" y="568.34" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="159.19" y="568.34" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="170.19" y="568.34" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="293.07" y="568.34" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="361.96" y="568.34" font-size="11.00" class="sc-loraregular sc-k">70.3%</text><text x="394.98" y="568.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="408.88" y="568.34" font-size="11.00" class="sc-loraregular">85.4%</text><text x="439.29" y="568.34" font-size="11.00" class="sc-notoserifcjksc">。需要指出的是，我</text><text x="72.00" y="583.96" font-size="11.00" class="sc-notoserifcjksc">们未能复现</text><text x="129.89" y="583.96" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="162.22" y="583.96" font-size="11.00" class="sc-notoserifcjksc">报告的数字，且我们得到的平均评分项通过率和严格通过率都低于</text><text x="484.11" y="583.96" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="516.44" y="583.96" font-size="11.00" class="sc-notoserifcjksc">运行</text><text x="72.00" y="599.58" font-size="11.00" class="sc-notoserifcjksc">中的结果。尽管如此，我们认为这些分数在方向上具有代表性，能够反映各</text><text x="437.89" y="599.58" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="476.18" y="599.58" font-size="11.00" class="sc-notoserifcjksc">模型之间的</text><text x="72.00" y="615.20" font-size="11.00" class="sc-notoserifcjksc">性能差异。</text></svg></div>

1.00" class="sc-loraregular sc-k">38.6%</text><text x="339.72" y="633.72" font-size="11.00" class="sc-notoserifcjksc">的分数。</text><text x="383.72" y="633.72" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="460.41" y="633.72" font-size="11.00" class="sc-notoserifcjksc">达到了最先进水</text><text x="72.00" y="649.34" font-size="11.00" class="sc-notoserifcjksc">平，超过了</text><text x="129.89" y="649.34" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="174.23" y="649.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="188.13" y="649.34" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="272.15" y="649.34" font-size="11.00" class="sc-notoserifcjksc">，后两者的得分分别为</text><text x="385.04" y="649.34" font-size="11.00" class="sc-loraregular">36.2%</text><text x="418.60" y="649.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="432.49" y="649.34" font-size="11.00" class="sc-loraregular sc-k">33.6%</text><text x="463.27" y="649.34" font-size="11.00" class="sc-notoserifcjksc">。所有模型的得</text><text x="72.00" y="664.96" font-size="11.00" class="sc-notoserifcjksc">分都远低于</text><text x="129.89" y="664.96" font-size="11.00" class="sc-loraregular sc-k">58.6%</text><text x="163.49" y="664.96" font-size="11.00" class="sc-notoserifcjksc">的人类基线分数。</text><a href="https://arxiv.org/abs/2509.25229" rel="noopener"><rect x="221.48" y="707.20" width="161.00" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p280.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 280 页"><text x="72.00 80.29 83.42 87.97 96.32 99.45 107.17 110.55 120.74 128.58 141.57 149.86 154.85 158.28 167.09 174.69 183.71 191.73 196.72 200.15 204.47 207.90 215.92" y="414.39" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.16.3 OSWorld-Verified</text><text x="72.00" y="700.24" font-size="6.00" class="sc-loraregular">53</text><text x="81.24 87.73 90.54 95.96 98.48 101.11 107.02 109.48 112.01 114.64 119.99 123.85 126.48 131.64 134.36 136.82 139.45 142.50 147.86 154.00 159.15 164.45 167.50 169.96 172.58 180.52 186.19 195.75 201.59 205.88 208.60 214.58 217.08 219.71 225.92 231.34 237.41 242.73 248.71 257.65 262.81 267.10 272.46 275.27 281.34 286.87 289.50 298.43 304.40 307.12 310.99 313.80 322.74 328.58 334.56 339.72 342.44 345.07 350.22 355.70 361.12 367.10 370.97 375.59 378.22 381.55 387.40 391.73 394.36 400.20 406.17 411.59 417.66 422.55 427.96 434.03 440.01 445.38 451.35 453.98 457.85 463.01 467.64 473.01 477.63 480.26 483.07 489.14 491.77 496.03 501.42 506.58" y="704.47" font-size="10.00" class="sc-loraregular">Xie, T., et al. (2024). OSWorld: Benchmarking multimodal agents for open-ended tasks in real</text><text x="72.00 77.27 83.12 92.05 98.02 103.99 107.86 113.27 117.60 120.23 125.65 131.57 136.61 139.42 143.68 149.53 155.60 164.53 169.95 175.93 179.80 184.43 186.88 189.51 194.67 198.38 204.87 207.68 212.72 215.22 220.37 225.79 232.00 237.41 239.72 245.71 250.32 255.86 260.46 265.83" y="717.26" font-size="10.00" class="sc-loraregular">computer environments. arXiv:2404.07972.</text><text x="270.92 276.82 280.79 284.66 290.62 295.25 297.75 301.44 307.89 313.05 317.38 322.68 325.49 330.15 332.60 338.45 342.73 348.26 354.72 359.87 365.69 369.97 376.87 382.01 387.43 393.64 399.06 401.37 407.35 411.96 417.50 422.11" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2404.07972</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">280</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 109.81 111.91 117.44 120.92 123.28 129.14 131.95 137.51 142.35 147.76 152.08 155.02 160.71 164.36 168.60 174.55 179.39 185.13 189.79 195.38 197.75" y="366.99" font-size="9.00" class="sc-lorabold">8.16.2.A] Blueprint-Bench 2</text><text x="204.91" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="231.91" y="366.99" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="315.28" y="366.99" font-size="9.00" class="sc-loraregular">max</text><text x="335.11" y="366.99" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，使用编程工具。分数按</text><text x="499.47" y="366.99" font-size="9.00" class="sc-loraregular">Andon</text><text x="72.00" y="378.69" font-size="9.00" class="sc-loraregular sc-k">Labs</text><text x="93.82" y="378.69" font-size="9.00" class="sc-notoserifcjksc">报告的结果发布。</text><text x="72.00" y="438.27" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="118.21" y="434.60" font-size="6.60" class="sc-loraregular">53</text><text x="128.38" y="438.27" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，评估智能体通过鼠标和键盘操作与一台实时运行的</text><text x="494.27" y="438.27" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="72.00" y="453.89" font-size="11.00" class="sc-notoserifcjksc">虚拟机交互、完成真实世界计算机任务（如编辑文档、浏览网页和管理文件）的能力。我们沿用</text><text x="72.00" y="469.51" font-size="11.00" class="sc-notoserifcjksc">默认设置，分辨率为</text><text x="173.89" y="469.51" font-size="11.00" class="sc-loraregular">1080p</text><text x="204.31" y="469.51" font-size="11.00" class="sc-notoserifcjksc">，每个任务最多</text><text x="284.20" y="469.51" font-size="11.00" class="sc-loraregular">100</text><text x="304.76" y="469.51" font-size="11.00" class="sc-notoserifcjksc">个操作步数。</text><text x="72.00" y="535.64" font-size="11.00" class="sc-notoserifcjksc">我们调整了</text><text x="224.28" y="535.64" font-size="11.00" class="sc-notoserifcjksc">评估的运行方式，以更好地反映真实世界中的表现。如</text><text x="491.18" y="535.64" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="72.00" y="551.26" font-size="11.00" class="sc-loraregular" fill="#0000ff">Opus 4.8</text><text x="119.60" y="551.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="152.60" y="551.26" font-size="11.00" class="sc-notoserifcjksc">中所述，这些调整包括修复一个影响批量动作的缩放工具</text><text x="430.49" y="551.26" font-size="11.00" class="sc-loraregular">bug</text><text x="449.54" y="551.26" font-size="11.00" class="sc-notoserifcjksc">，以及将每轮</text><text x="72.00" y="566.88" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="566.88" font-size="11.00" class="sc-notoserifcjksc">上限从</text><text x="139.95" y="566.88" font-size="11.00" class="sc-loraregular">16K</text><text x="160.71" y="566.88" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="196.61" y="566.88" font-size="11.00" class="sc-loraregular">128K</text><text x="220.21" y="566.88" font-size="11.00" class="sc-notoserifcjksc">。随后，我们在这些调整下重新评估了</text><text x="410.11" y="566.88" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="582.50" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="112.63" y="582.50" font-size="11.00" class="sc-notoserifcjksc">，发现我们此前一直低报了它在</text><text x="269.53" y="582.50" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="318.63" y="582.50" font-size="11.00" class="sc-notoserifcjksc">上的表现。具体表现见下文。</text><text x="72.00" y="632.78" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="632.78" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="196.13" y="632.78" font-size="11.00" class="sc-loraregular sc-k">85.0%</text><text x="230.15" y="632.78" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="244.04" y="632.78" font-size="11.00" class="sc-loraregular sc-k">OSWorld</text><text x="293.14" y="632.78" font-size="11.00" class="sc-notoserifcjksc">分数（首次尝试成功率，五次运行的平均值）。</text><a href="https://arxiv.org/abs/2404.07972" rel="noopener"><rect x="270.92" y="707.20" width="156.56" height="12.80" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="526.84" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="491.18" y="526.84" width="35.40" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="526.58" y="526.84" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="72.00" y="542.46" width="26.96" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="98.96" y="542.46" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="101.85" y="542.46" width="14.85" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="116.70" y="542.46" width="2.89" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="119.60" y="542.46" width="11.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="542.46" width="0.00" height="11.00" fill="transparent"/></a><a href="http://anthropic.com/claude-opus-4-8-system-card" rel="noopener"><rect x="130.60" y="542.46" width="11.00" height="11.00" fill="tra <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p281.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 281 页"><text x="72.00 80.29 83.42 87.97 96.32 99.45 107.86 111.23 119.42 127.44 135.88 143.67 152.11 162.15 171.21" y="475.08" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.16.4 BenchCAD</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">281</text><text x="72.00" y="414.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 110.05 112.15 117.68" y="414.43" font-size="9.00" class="sc-lorabold">8.16.3.A]</text><text x="121.16" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">：各模型在</text><text x="168.52" y="414.43" font-size="9.00" class="sc-lorabold">max</text><text x="188.82" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">推理强度下的外部</text><text x="341.96" y="414.43" font-size="9.00" class="sc-notoserifcjkscbold">分数。</text><text x="368.96" y="414.43" font-size="9.00" class="sc-notoserifcjksc">模型在</text><text x="473.18" y="414.43" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="482.18" y="414.43" font-size="9.00" class="sc-loraregular">361</text><text x="498.04" y="414.43" font-size="9.00" class="sc-notoserifcjksc">个任务，</text><text x="72.00" y="426.13" font-size="9.00" class="sc-loraregular">100</text><text x="88.82" y="426.13" font-size="9.00" class="sc-notoserifcjksc">步）上以自动思考和</text><text x="172.19" y="426.13" font-size="9.00" class="sc-loraregular">max</text><text x="192.01" y="426.13" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估。分数为五次运行平均的</text><text x="365.38" y="426.13" font-size="9.00" class="sc-loraregular">pass@1</text><text x="394.17" y="426.13" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="498.95" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="126.45" y="495.29" font-size="6.60" class="sc-loraregular">54</text><text x="136.52" y="498.95" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="205.41" y="498.95" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="230.96" y="498.95" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="321.86 325.86 330.45 333.22 339.58 346.41" y="498.95" font-size="11.00" class="sc-loraregular">17,900</text><text x="356.14" y="498.95" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="436.04" y="498.95" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="490.79" y="498.95" font-size="11.00" class="sc-notoserifcjksc">程序构</text><text x="72.00" y="514.57" font-size="11.00" class="sc-notoserifcjksc">成，涵盖</text><text x="118.89" y="514.57" font-size="11.00" class="sc-loraregular">106</text><text x="138.98" y="514.57" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中约一半以真实的</text><text x="317.87" y="514.57" font-size="11.00" class="sc-loraregular">ISO</text><text x="336.53" y="514.57" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="347.53" y="514.57" font-size="11.00" class="sc-loraregular sc-k">DIN</text><text x="367.68" y="514.57" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="378.68" y="514.57" font-size="11.00" class="sc-loraregular">EN</text><text x="393.90" y="514.57" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="404.90" y="514.57" font-size="11.00" class="sc-loraregular">ASME</text><text x="437.86" y="514.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="451.75" y="514.57" font-size="11.00" class="sc-loraregular">IEC</text><text x="472.86" y="514.57" font-size="11.00" class="sc-notoserifcjksc">规格表为依</text><text x="72.00" y="530.19" font-size="11.00" class="sc-notoserifcjksc">据。该基准测试将</text><text x="162.89" y="530.19" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="188.45" y="530.19" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务；我们报告的是</text><text x="422.34" y="530.19" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="489.21" y="530.19" font-size="11.00" class="sc-notoserifcjksc">任务的结</text><text x="72.00" y="545.81" font-size="11.00" class="sc-notoserifcjksc">果，该任务要求模型根据多视图渲染图生成</text><text x="283.89" y="545.81" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="338.65" y="545.81" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="612.30" font-size="11.00" class="sc-notoserifcjksc">我们内部实现的</text><text x="151.89" y="612.30" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="209.24" y="612.30" font-size="11.00" class="sc-notoserifcjksc">与参考实现</text><text x="264.24" y="608.63" font-size="6.60" class="sc-loraregular">55</text><text x="271.43" y="612.30" font-size="11.00" class="sc-notoserifcjksc">一致，仅有两处小的修改。第一，我们修正了参考系统</text><text x="72.00" y="627.92" font-size="11.00" class="sc-notoserifcjksc">提示词（</text><text x="116.00" y="627.92" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="193.29" y="627.92" font-size="11.00" class="sc-notoserifcjksc">）中的一处笔误，该笔误把提供给模型的渲染视图中全部四个相机位置</text><text x="72.00" y="643.54" font-size="11.00" class="sc-notoserifcjksc">都调换了。</text><text x="72.00" y="674.85" font-size="6.00" class="sc-loraregular">54</text><text x="81.15 87.25 93.24 98.40 104.47 110.00 112.52 115.15 122.95 125.41 127.93 130.56 135.91 139.78 142.41 147.57 150.29 152.75 155.38 158.43 163.80 169.94 175.31 180.97 184.02 186.48 189.11 195.33 200.75 206.82 212.14 218.01 224.90 231.16 238.61 241.11 243.74 250.00 252.63 257.90 263.75 272.69 278.66 282.92 288.34 294.33 299.75 305.82 310.45 313.26 318.26 323.68 326.20 328.83 331.64 337.71 343.69 349.66 354.29 358.16 362.66 367.94 372.83 377.46 381.33 386.49 392.56 398.54 403.70 407.96 413.94 416.57 422.39 427.81 433.88 439.20 445.19 454.13 459.29 463.58 468.95 471.58 474.91 480.76" y="678.18"
