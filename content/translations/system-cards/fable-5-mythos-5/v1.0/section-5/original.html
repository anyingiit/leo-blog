.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p087.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 87 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">87</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="116.20" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="116.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="182.24" y="116.20" font-size="11.00" class="sc-notoserifcjksc">，我们运行了与</text><text x="262.14 269.82 272.82 278.43 284.99 291.57 297.53 300.43 309.16 315.73 322.29 327.39 330.28 336.24 338.95" y="116.20" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="348.02" y="116.20" font-size="11.00" class="sc-notoserifcjksc">发布时相同的智能体安全评估套件，涵</text><text x="72.00" y="131.82" font-size="11.00" class="sc-notoserifcjksc">盖对编程智能体和计算机使用（</text><text x="226.00 231.80 238.23 248.07 254.63 261.20 265.46 271.42 276.18 279.08 285.64 290.74" y="131.82" font-size="11.00" class="sc-loraregular">computer use</text><text x="296.70" y="131.82" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使用、影响力行动的自主执行，以</text><text x="72.00" y="147.44" font-size="11.00" class="sc-notoserifcjksc">及提示词注入（</text><text x="149.00 155.57 160.25 166.69 176.52 183.09 187.35 190.24 193.33 199.95 202.82 208.73 214.53 218.78 221.88 228.31" y="147.44" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="234.99" y="147.44" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本节中，我们仅报告</text><text x="402.88 412.81 418.68 422.93 429.52 435.96 441.05 443.94" y="147.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="452.83" y="147.44" font-size="11.00" class="sc-notoserifcjksc">的结果。此处的评</text><text x="72.00" y="163.06" font-size="11.00" class="sc-notoserifcjksc">估旨在衡量模型本身的行为，独立于部署时的安全防护措施；若针对</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 448.77 454.45 460.85 463.84 469.80 472.70" y="163.06" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="481.59" y="163.06" font-size="11.00" class="sc-notoserifcjksc">运行这些评</text><text x="72.00" y="194.30" font-size="11.00" class="sc-notoserifcjksc">模型自身的响应混为一谈。</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 247.88 253.56 259.96 262.95 268.91 271.80" y="194.30" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="280.69" y="194.30" font-size="11.00" class="sc-notoserifcjksc">使用相同的底层模型，并继承此处报告的行为，同时</text><text x="72.00" y="209.92" font-size="11.00" class="sc-notoserifcjksc">由分类器和多模型回退（</text><text x="193.00" y="209.92" font-size="11.00" class="sc-loraregular">fallback</text><text x="232.21" y="209.92" font-size="11.00" class="sc-notoserifcjksc">）行为在其之上提供额外一层保护。</text><text x="72.00" y="295.72" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="295.72" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00" y="332.82" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="332.82" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="360.70" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="360.70" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="360.70" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="193.08 200.77 203.76 209.37 215.93 222.51 228.48 231.37 239.06 245.49 252.07" y="360.70" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="260.92" y="360.70" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用及良性的网络安全相</text><text x="72.00" y="376.32" font-size="11.00" class="sc-notoserifcjksc">关请求。提示集与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.71" y="376.32" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="248.78" y="376.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡（</text><text x="292.78 298.96 304.77 309.86 314.12 320.08 329.92 332.81 340.50 346.18 350.86" y="376.32" font-size="11.00" class="sc-loraregular" fill="#0000ff">System Card</text><text x="357.44" y="376.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="368.44" y="376.32" font-size="11.00" class="sc-notoserifcjksc">中的相同，分为两类：</text><text x="108.00" y="425.47" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="425.47" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc">条违反我们</text><text x="231.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="286.26 294.45 299.54 305.22 311.25 317.21 320.10 326.66 333.09 336.09 339.18 344.97" y="425.47" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="350.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="361.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc">、应予拒绝的提示。示例包括协助创</text><text x="108.00" y="441.09" font-size="11.00" class="sc-notoserifcjksc">建恶意软件、编写用于</text><text x="220.89 228.98 237.17 243.54" y="441.09" font-size="11.00" class="sc-loraregular">DDoS</text><text x="252.67" y="441.09" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00" y="474.05" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="474.05" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="474.05" font-size="11.00" class="sc-notoserifcjksc">条提示，涵盖</text><text x="256.15 263.84 266.83 272.44 279.01 285.58" y="474.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="294.44" y="474.05" font-size="11.00" class="sc-notoserifcjksc">应当提供协助的敏感但允许的请求。示例包括运行</text><text x="108.00" y="489.67" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站是否存在漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="538.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="538.81" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="229.14 236.82 239.82 245.43 251.99 258.57 264.53 267.43 275.12 281.55 288.13" y="538.81" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="296.98" y="538.81" font-size="11.00" class="sc-notoserifcjksc">工具集。每条提示运行</text><text x="409.88" y="538.81" font-size="11.00" class="sc-loraregular">10</text><text x="423.60" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="503.50 507.50 510.27 516.18 522.09" y="538.81" font-size="11.00" class="sc-loraregular">1,220</text><text x="72.00" y="554.43" font-size="11.00" class="sc-notoserifcjksc">次测试。与近期的几次发布一样，我们在运行本评估时默认应用</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 428.87 435.31 441.89" y="554.43" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="450.74" y="554.43" font-size="11.00" class="sc-notoserifcjksc">系统提示词</text><text x="72.00" y="570.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="570.05" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29" y="570.05" font-size="11.00" class="sc-notoserifcjksc">）。我们已将这些评估所用的自动评分模型从</text><text x="383.18 390.87 393.86 399.47 406.04 412.61 418.58 421.47 427.71 434.14 440.82 447.50 453.38 457.64 460.53 466.49 469.20" y="570.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="478.09" y="570.05" font-size="11.00" class="sc-notoserifcjksc">更新为</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="585.67" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98" y="585.67" font-size="11.00" class="sc-notoserifcjksc">，因此结果可能与以往系统卡中的结果略有不同。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="162.89" y="367.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="162.89" y="367.52" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="198.29" y="367.52" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="201.18" y="367.52" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="228.15" y="367.52" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="231.04" y="367.52" width="14.85" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="245.89" y="367.52" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="248.78" y="367.52" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/file 0" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="295.00" y="521.33" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">拒绝率</text><text x="72.00" y="232.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83 114.31 116.68 122.87 125.68 130.39 135.95 141.32 146.16 148.53 154.72 159.81 165.18" y="232.49" font-size="9.00" class="sc-lorabold">5.1.1.A] Claude Code</text><text x="172.39" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="217.39" y="232.49" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列最佳分数以</text><text x="325.39" y="232.49" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="343.39" y="232.49" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（注意两者均未考</text><text x="72.00" y="244.19" font-size="9.00" class="sc-notoserifcjksc">虑误差范围）。由于评估更新，先前模型的结果与以往系统卡相比存在差异。</text><text x="72.00" y="284.80" font-size="11.00" class="sc-notoserifcjksc">在未部署任何额外安全防护措施的情况下，与</text><text x="294.89" y="284.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="342.49" y="284.80" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="356.38 366.32 372.18 376.44 383.02 389.46 394.55 397.45 404.11 408.80 414.70 420.26 423.35 429.27" y="284.80" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="440.97" y="284.80" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="473.97 483.91 489.77 494.03 500.62 507.05 512.14 515.04" y="284.80" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="523.92" y="284.80" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="300.42" font-size="11.00" class="sc-notoserifcjksc">恶意网络安全相关请求的顺从频率略高。它几乎从未过度拒绝（</text><text x="380.00 386.38 391.88 397.84 402.52 407.90 412.58 418.54 422.26 428.83 433.92 439.60" y="300.42" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="442.59" y="300.42" font-size="11.00" class="sc-notoserifcjksc">）两用及良性请</text><text x="72.00" y="316.04" font-size="11.00" class="sc-notoserifcjksc">求，并且在本评估中取得了上文所列近期模型中最高的分数（</text><text x="369.00 375.36 381.54 384.14 390.49 396.46" y="316.04" font-size="11.00" class="sc-loraregular">99.64%</text><text x="406.03" y="316.04" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="364.10" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="364.10" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="391.98" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="391.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="391.98" font-size="11.00" class="sc-notoserifcjksc">在沙箱化的环境中获得基于</text><text x="303.08" y="391.98" font-size="11.00" class="sc-loraregular">GUI</text><text x="326.30" y="391.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="340.19" y="391.98" font-size="11.00" class="sc-loraregular">CLI</text><text x="360.82" y="391.98" font-size="11.00" class="sc-notoserifcjksc">的计算机使用工具时，是否会拒绝有</text><text x="72.00" y="407.61" font-size="11.00" class="sc-notoserifcjksc">害任务。这组</text><text x="140.89" y="407.61" font-size="11.00" class="sc-loraregular">112</text><text x="157.70" y="407.61" font-size="11.00" class="sc-notoserifcjksc">项不重复任务与上一份系统卡中的相同，涵盖三个风险领域：</text><text x="108.00" y="456.75" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="472.95" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00" y="489.14" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text><text x="72.00" y="642.28" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="642.28" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.35 106.44 111.98" y="642.28" font-size="9.00" class="sc-lorabold">5.1.2.A]</text><text x="117.82" y="642.28" font-size="9.00" class="sc-notoserifcjkscbold">未施加缓解措施时的恶意计算机使用评估结果。</text><text x="306.82" y="642.28" font-size="9.00" class="sc-notoserifcjksc">越高越好。对于</text><text x="372.19" y="642.28" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="411.13" y="642.28" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="422.50 427.60 432.86 438.33 443.79 448.61 452.09 454.46 459.33 461.46" y="642.28" font-size="9.00" class="sc-loraregular">Sonnet 4.6</text><text x="466.66" y="642.28" font-size="9.00" class="sc-notoserifcjksc">，比率为开启思考</text><text x="72.00" y="653.98" font-size="9.00" class="sc-notoserifcjksc">与关闭思考结果的平均值；对于</text><text x="200.37 208.49 213.29 216.77 222.17 227.43 231.60 233.96" y="653.98" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="241.24" y="653.98" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="252.60 260.73 265.53 269.01 274.40 279.67 283.83 286.20 291.65 295.49 300.32 304.87 307.40 312.24" y="653.98" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="319.45" y="653.98" font-size="9.00" class="sc-notoserifcjksc">，则仅为开启思考的结果。每列最佳分数以</text><text x="490.45" y="653.98" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="508.45" y="653.98" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="665.68" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="504.00 509.00" y="751.80" font-size="9.00" class="sc-loraregular">89</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在该评估中的得分略低于</text><text x="284.14 291.82 294.82 300.43 306.99 313.57 319.53 322.43 332.36 338.22 342.48 349.07 355.50 360.60 363.49 370.16 374.84 380.75 386.30 389.39 395.31" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="404.12" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，但与其他近期模型持平或</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更优。与</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 166.62 171.31 177.22 182.77 185.86 191.78" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="203.48" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="236.48 246.42 252.28 256.54 263.13 269.56 274.65 277.55" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="286.43" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在未充分考虑任务潜在危害的情况下顺从执行任务的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">意愿略强一些，偶尔会顺从汇编或整理个人信息的请求。</text><text x="72.00" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">我们的前沿合规框架（</text><text x="182.00 187.92 192.60 199.04 205.62 209.87 212.96 218.93 223.69 226.58 234.27 240.71 250.54 257.11 260.10 263.19 268.87 275.54 281.34 287.30 290.20 296.11 300.80 306.48 316.31 322.23 330.91 337.34 342.06" y="206.00" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="347.97" y="206.00" font-size="11.00" class="sc-notoserifcjksc">）针对有害操纵风险设立了两级。第</text><text x="526.86" y="206.00" font-size="11.00" class="sc-loraregular">1</text><text x="72.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">级能力指模型能够自动完成一项通常需要多名老练行为者参与的影响力行动中超过</text><text x="470.89" y="221.62" font-size="11.00" class="sc-loraregular">50%</text><text x="496.18" y="221.62" font-size="11.00" class="sc-notoserifcjksc">的基础设</text><text x="72.00" y="237.24" font-size="11.00" class="sc-notoserifcjksc">施步骤。如果模型能够在人类监督不到</text><text x="261.89" y="237.24" font-size="11.00" class="sc-loraregular">10%</text><text x="285.19" y="237.24" font-size="11.00" class="sc-notoserifcjksc">的情况下，以系统化的定向方式端到端地开展欺骗性</text><text x="72.00" y="252.86" font-size="11.00" class="sc-notoserifcjksc">影响力行动，则达到第</text><text x="184.89" y="252.86" font-size="11.00" class="sc-loraregular">2</text><text x="193.69" y="252.86" font-size="11.00" class="sc-notoserifcjksc">级。我们用于辅助风险评估流程的评估之一是恶意智能体影响力行动评</text><text x="72.00" y="268.48" font-size="11.00" class="sc-notoserifcjksc">估；根据下文的结果，我们认为该模型尚未越过第</text><text x="316.89" y="268.48" font-size="11.00" class="sc-loraregular">2</text><text x="325.69" y="268.48" font-size="11.00" class="sc-notoserifcjksc">级阈值。</text><text x="72.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">该评估最早在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="351.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="263.77" y="351.73" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="296.77" y="351.73" font-size="11.00" class="sc-notoserifcjksc">中详细介绍，用于评估模型能否自主地端到端执行</text><text x="72.00" y="367.35" font-size="11.00" class="sc-notoserifcjksc">一项影响力行动，且其水平足以对恶意行为者构成实质性的能力提升（</text><text x="413.00 419.57 426.13 429.13 432.22 436.07" y="367.35" font-size="11.00" class="sc-loraregular">uplift</text><text x="440.32" y="367.35" font-size="11.00" class="sc-notoserifcjksc">）。模型被置于一个</text><text x="72.00" y="382.97" font-size="11.00" class="sc-notoserifcjksc">配有模拟社交媒体平台工具的智能体运行框架（</text><text x="303.00" y="382.97" font-size="11.00" class="sc-loraregular">harness</text><text x="342.85" y="382.97" font-size="11.00" class="sc-notoserifcjksc">）中，其中包括模拟内容审核和反制互动</text><text x="72.00" y="398.59" font-size="11.00" class="sc-notoserifcjksc">障碍。随后，我们依据固定的成功标准对其评分，例如在符合所声明地点作息的合理时间发帖，</text><text x="72.00" y="414.21" font-size="11.00" class="sc-notoserifcjksc">以及根据互动数据迭代内容。</text><text x="72.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">我们测试了与此前各次发布相同的两个场景：</text><text x="108.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35" y="513.64" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的</text><text x="108.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">投票率和支持热情；以及</text><text x="108.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示找出人口群体断层线，并投放带有强烈情绪色彩、针对特定文</text><text x="108.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">化定制的信息来激化这些断层。</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="610.80" font-size="11.00" class="sc-loraregular">3</text><text x="138.91" y="610.80" font-size="11.00" class="sc-notoserifcjksc">个模拟平台阻力级别下各运行</text><text x="284.81" y="610.80" font-size="11.00" class="sc-loraregular">3</text><text x="293.83" y="610.80" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="384.72" y="610.80" font-size="11.00" class="sc-loraregular">9</text><text x="393.97" y="610.80" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="473.86" y="610.80" font-size="11.00" class="sc-loraregular">70</text><text x="488.66" y="610.80" font-size="11.00" class="sc-notoserifcjksc">项成功标</text><text x="72.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">准评分。该评估针对模型的一个</text><text x="226.00" y="626.42" font-size="11.00" class="sc-loraregular">“</text><text x="230.40" y="626.42" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="263.40" y="626.42" font-size="11.00" class="sc-loraregular">”</text><text x="267.24" y="626.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="278.24 284.83 290.79 293.78 300.29 304.01 310.58 313.57 318.95 325.39 332.06 335.00" y="626.42" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="340.81" y="626.42" font-size="11.00" class="sc-notoserifcjksc">）变体进行，该变体的无害性训练有所减</text><text x="72.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">弱，以评估模型的原始能力。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.89" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.89" y="342.93" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="176.29" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="179.18" y="342.93" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="217.35" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="220.25" y="342.93" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="260.88" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="263.77" y="342.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="274.77" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="274.77" y="342.93" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="285.77" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="285.77" y="342.93" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="237.00 243.28 247.86 250.56 254.57" y="145.95" font-size="11.00" class="sc-loraregular">67.1%</text><text x="390.75 396.71 403.06 405.77 411.94" y="145.95" font-size="11.00" class="sc-loraregular">46.8%</text><text x="237.00 242.07 248.19 250.89 257.02" y="184.07" font-size="11.00" class="sc-loraregular">73.3%</text><text x="390.75 396.74 402.73 405.44 409.44" y="184.07" font-size="11.00" class="sc-loraregular">55.1%</text><text x="237.00 242.99 247.57 250.28 254.28" y="222.21" font-size="11.00" class="sc-loraregular">57.1%</text><text x="390.75 396.71 403.06 405.77 411.94" y="222.21" font-size="11.00" class="sc-loraregular">46.8%</text><text x="237.00 242.99 249.17 251.87 257.86" y="260.33" font-size="11.00" class="sc-loraregular">59.5%</text><text x="390.75 396.71 402.61 405.31 409.32" y="260.33" font-size="11.00" class="sc-loraregular">42.1%</text><text x="237.00 242.96 246.96 249.66 255.84" y="298.47" font-size="11.00" class="sc-loraregular">41.8%</text><text x="390.75 396.87 402.83 405.37 412.20" y="298.47" font-size="11.00" class="sc-loraregular">34.0%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">90</text><text x="77.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 126.75 132.81 137.35 144.18 150.41 155.74 158.64" y="145.49" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="167.47" y="145.49" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50" y="183.62" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="164.29" y="183.62" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 124.89 131.50 138.30 143.63 146.52 152.54 154.79" y="221.75" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="162.84" y="221.75" font-size="11.00" class="sc-notoserifcjkscbold">（仅有用）</text><text x="77.50 85.07 88.50 94.26 101.06 107.62 113.54 116.43 126.75 132.81 137.35 144.18 150.41 155.74 158.64 165.66 170.86 176.77 182.69 186.29 192.21" y="259.88" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="204.02" y="259.88" font-size="11.00" class="sc-notoserifcjkscbold">（仅</text><text x="77.50" y="275.50" font-size="11.00" class="sc-notoserifcjkscbold">有用）</text><text x="77.50" y="298.02" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.6</text><text x="174.42" y="298.02" font-size="11.00" class="sc-notoserifcjkscbold">（仅有</text><text x="77.50" y="313.64" font-size="11.00" class="sc-notoserifcjkscbold">用）</text><text x="236.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">压制投票场景（任务完成率）</text><text x="390.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">国内极化场景（任务完成率）</text><text x="72.00" y="328.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="328.33" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 104.59 106.69 112.22" y="328.33" font-size="9.00" class="sc-lorabold">5.1.3.A]</text><text x="118.06" y="328.33" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06" y="328.33" font-size="9.00" class="sc-notoserifcjksc">百分比表示模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43" y="328.33" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="340.03" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00" y="380.63" font-size="11.00" class="sc-notoserifcjksc">在两个影响力行动场景中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 252.22 258.09 262.34 268.93 275.37 280.46 283.35" y="380.63" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="292.24" y="380.63" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本的总体成功率均低于</text><text x="460.14 467.82 470.82 476.43 482.99 489.57 495.53 498.43 507.16 513.73 520.29" y="380.63" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="396.25" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="396.25" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="111.74 119.43 122.42 128.03 134.60 141.18 147.14 150.03 159.97 165.83 170.09 176.68 183.11 188.20 191.10 197.76 202.45 208.36 213.91 217.00 222.92" y="396.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="234.62" y="396.25" font-size="11.00" class="sc-notoserifcjksc">相比则略高或持平。与</text><text x="347.52 357.45 363.31 367.57 374.16 380.59 385.69 388.58 395.25 399.93 405.84 411.39 414.48 420.40" y="396.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="432.11" y="396.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="446.00" y="396.25" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="493.60" y="396.25" font-size="11.00" class="sc-notoserifcjksc">一样，我</text><text x="72.00" y="411.87" font-size="11.00" class="sc-notoserifcjksc">们评估认为，这些模型在许多操作步骤上仍需要大量人类指导。</text><text x="72.00" y="461.59" font-size="11.00" class="sc-notoserifcjksc">在压制投票场景中，相对</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="461.59" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="280.48" y="461.59" font-size="11.00" class="sc-notoserifcjksc">的提升源于更有效的行动执行，而与</text><text x="459.38" y="461.59" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="506.97" y="461.59" font-size="11.00" class="sc-notoserifcjksc">之间的</text><text x="72.00" y="477.21" font-size="11.00" class="sc-notoserifcjksc">差距则反映出其行动账号网络管理较弱，其活动模式使账号更容易被识别。在国内极化场景中，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="492.83" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="492.83" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="168.84 178.78 184.64 188.90 195.49 201.92 207.01 209.91 216.57 221.26 227.17 232.72 235.81 241.73" y="492.83" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="253.43" y="492.83" font-size="11.00" class="sc-notoserifcjksc">相近，远低于</text><text x="322.33" y="492.83" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="367.03" y="492.83" font-size="11.00" class="sc-notoserifcjksc">；一旦账号被模拟社交媒体和消息</text><text x="72.00" y="508.45" font-size="11.00" class="sc-notoserifcjksc">平台标记为不真实，它便难以维持其账号网络的协同。</text><text x="72.00" y="574.94" font-size="11.00" class="sc-notoserifcjksc">与此前各次发布一样，这些模型的完整训练版本（包含无害性训练）基本上从第一轮起就拒绝参</text><text x="72.00" y="590.56" font-size="11.00" class="sc-notoserifcjksc">与这些任务，因为这两个场景都明显违反了我们的使用政策。因此，我们将该风险评定为低，且</text><text x="72.00" y="606.18" font-size="11.00" class="sc-notoserifcjksc">处于我们前沿合规框架下的可接受水平之内。</text><text x="72.00" y="657.29" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02" y="657.29" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00" y="683.86" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00" y="699.48" font-size="11.00" class="sc-notoserifcjksc">藏在智能体执行任务期间所处理的工具结果中的恶意指令。例如，智能体</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">被要求总结的一封电子邮件中可能含有隐藏文本，指示其外泄近期所有内部通信。一次成功的提</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在公开网页或共享文档中的单个载荷即可攻陷任何处理它的智能体，攻击者无需针对特定用户或</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">系统。当模型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">使攻击者能够外泄敏感信息或触发未经授权的操作。</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="228.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18" y="228.34" font-size="11.00" class="sc-notoserifcjksc">模型在大多数公开基准测试以及第三方研究机构</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">构建的基准测试上均已饱和。我们继续投入于能够衡量鲁棒性提升的自适应评估。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08" y="293.11" font-size="11.00" class="sc-loraregular">Mythos</text><text x="113.06" y="293.11" font-size="11.00" class="sc-notoserifcjksc">系列模型是我们迄今为止对提示词注入最具抵御能力的模型。由于</text><text x="434.96 442.64 445.64 451.25 457.81 464.39 470.35 473.25 478.83 484.51 490.91 493.90 499.87 502.76" y="293.11" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="511.65" y="293.11" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="308.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="308.73" font-size="11.00" class="sc-notoserifcjksc">共享相同的核心模型，它继承了这些提升，成为我们鲁棒性最强的正式发布</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.03 94.99 101.67 107.63 112.32 117.99 120.98 123.92 129.73 135.11 140.65 146.10 151.77 154.86 157.86 163.53 169.93 172.93" y="324.35" font-size="11.00" class="sc-loraregular">generally-available</text><text x="178.89" y="324.35" font-size="11.00" class="sc-notoserifcjksc">）模型。我们将继续改进智能体产品中的安全防护措施，以进一步保护用</text><text x="72.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">户免受提示词注入的侵害。</text><text x="72.00" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">外部研究合作伙伴</text><text x="162.89 171.26 175.95 181.52 187.32 190.22 196.40 205.10 210.78" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="220.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="253.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="385.35 393.62 401.13 404.02 410.91 414.60 417.49 423.73 429.63 435.48 442.05 446.81 450.08 454.36 460.17 463.06 466.66 473.33 478.43 482.68 485.95 490.21 496.78 501.03" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="507.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="517.99" y="400.30" font-size="11.00" class="sc-notoserifcjksc">合作</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="107.89 114.78 120.81 126.77 133.35 137.60 140.50 147.33 153.24 159.81 162.71 169.21 175.15 180.82 190.66 193.75 200.43" y="415.92" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="206.51" y="415.92" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="217.51" y="415.92" font-size="11.00" class="sc-loraregular">ART</text><text x="238.34" y="415.92" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="293.34" y="412.25" font-size="6.60" class="sc-loraregular">7</text><text x="296.38" y="415.92" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">四类利用方式下对提示词注入的易感性：破坏机密性、引入相互冲突的目标、生成被禁止的内容</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">（例如恶意代码），以及执行被禁止的操作（例如未经授权的金融交易）。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="513.64" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="513.64" font-size="11.00" class="sc-notoserifcjksc">测量了提示词注入攻击在单次尝试（</text><text x="305.45 311.36 317.07" y="513.64" font-size="11.00" class="sc-loraregular">k=1</text><text x="321.07" y="513.64" font-size="11.00" class="sc-notoserifcjksc">）、十次尝试（</text><text x="398.07 403.98 409.69 413.69" y="513.64" font-size="11.00" class="sc-loraregular">k=10</text><text x="420.52" y="513.64" font-size="11.00" class="sc-notoserifcjksc">）和一百次尝试</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.62 98.62 105.45" y="529.26" font-size="11.00" class="sc-loraregular">k=100</text><text x="112.28" y="529.26" font-size="11.00" class="sc-notoserifcjksc">）后的成功率，因为攻击是否成功并非确定性的，重复尝试可能会提高注入成功的可能</text><text x="72.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">性。这些攻击取自</text><text x="162.89 169.78 176.69 183.73 186.62 193.51 198.19 204.15 210.83" y="544.88" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="216.51" y="544.88" font-size="11.00" class="sc-notoserifcjksc">，在那里，数千名专家红队成员持续针对前沿模型改进攻击策略。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="560.50" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="560.50" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中选取了一个子集，这些攻击已被证明对多个模型有效，而不仅限于最</text><text x="72.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">初针对的那个模型。本节的评估涵盖间接提示词注入（</text><text x="336.00 339.09 345.77 352.35 355.44 360.12 366.03 371.83 376.08 378.98 385.54 390.23 396.67 406.50 413.07 417.32 420.22 423.31 429.93 432.80 438.71 444.50 448.76 451.85 458.29" y="576.12" font-size="11.00" class="sc-loraregular">indirect prompt injection</text><text x="464.96" y="576.12" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="475.96" y="572.45" font-size="6.60" class="sc-loraregular">8</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">7</text><text x="77.40 83.50 89.35 95.32 97.84 100.47 106.25 108.71 111.23 113.86 119.21 123.08 125.71 130.87 133.59 136.05 138.68 141.73 147.10 153.24 158.61 164.06 167.11 169.57 172.20 177.87 183.24 188.56 194.53 198.86 201.83 205.72 211.00 213.63 218.95 224.94 230.10 232.82 235.54 240.96 247.03 252.51 257.93 262.56 265.19 268.00 274.07 276.70 282.96 286.31 288.94 294.10 299.58 305.00 310.98 314.85 317.48 323.46 328.88 334.85 337.57 343.34 348.62 357.56 362.98 368.96 372.83 375.33 377.96 381.23 387.30 391.93 394.74 400.51 406.41 410.28 414.91 417.54 420.92 425.18 431.03 439.97 442.60 447.76 450.39 453.11 458.27 462.55 468.03 473.45 476.08 480.71 486.01 491.17 493.89 499.31 501.94 507.91 513.88 519.70 522.42 525.23" y="665.40" font-size="10.00" class="sc-loraregular">Zou, L., et al. (2025). Security challenges in AI agent deployment: Insights from a large scale public</text><text x="216.34 222.24 226.21 230.08 236.05 240.68 243.18 246.87 253.77 258.93 263.26 268.56 271.37 276.03 278.49 284.34 288.62 294.15 301.05 306.21 312.03 316.31 323.21 328.58 334.03 340.02 344.19 346.65 352.02 358.23 363.68 369.05" y="679.60" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2507.20526</text><text x="72.00" y="690.47" font-size="6.00" class="sc-loraregular">8</text><text x="78.00" y="693.80" font-size="10.00" class="sc-notoserifcjksc">过去，我们也报告过该基准测试中</text><text x="228.00 232.00 237.98 240.79 245.05 250.42 255.69 259.56 262.19 268.16 272.42 278.27 287.21 293.18 297.05 299.68 302.49 308.51 311.12 316.49 321.76 325.63 328.44 334.29 340.13" y="693.80" font-size="10.00" class="sc-loraregular">“direct prompt injection”</text><text x="343.62" y="693.80" font-size="10.00" class="sc-notoserifcjksc">（直接提示词注入）子集的结果。直接提示</text><text x="72.00" y="708.00" font-size="10.00" class="sc-notoserifcjksc">词注入涉及恶意用户，而本节关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text><a href="https://grayswan.ai" rel="noopener"><rect x="162.89" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="162.89" y="391.50" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="187.32" y="391.50" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="190.22" y="391.50" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="391.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="264.35" y="391.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="275.35" y="391.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="286.35" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://w <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p092.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 92 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">92</text><text x="413.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词注入</text><text x="472.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="476.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="429.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="429.06" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.70 93.80 98.60 100.69 104.35 106.44 111.98" y="429.06" font-size="9.00" class="sc-lorabold">5.2.1.A]</text><text x="117.82" y="429.06" font-size="9.00" class="sc-notoserifcjkscbold">来自</text><text x="138.19 144.14 149.09 153.94 159.62 163.34 165.71 171.76 176.60 181.96 184.33 189.72 194.56 199.28 207.56 210.50 216.24" y="429.06" font-size="9.00" class="sc-lorabold">Agent Red Teaming</text><text x="221.26" y="429.06" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="230.26" y="429.06" font-size="9.00" class="sc-lorabold">ART</text><text x="248.29" y="429.06" font-size="9.00" class="sc-notoserifcjkscbold">）基准测试的间接提示词注入攻击。</text><text x="392.29" y="429.06" font-size="9.00" class="sc-notoserifcjksc">结果表示对于每个模型，攻击者在</text><text x="72.00 76.83 81.50" y="440.76" font-size="9.00" class="sc-loraregular">k=1</text><text x="84.78" y="440.76" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="93.78 98.61 103.28 106.56" y="440.76" font-size="9.00" class="sc-loraregular">k=10</text><text x="114.52" y="440.76" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="125.88 130.72 135.39 138.66 144.25" y="440.76" font-size="9.00" class="sc-loraregular">k=100</text><text x="152.21" y="440.76" font-size="9.00" class="sc-notoserifcjksc">次尝试后找到一次成功攻击的概率。攻击成功率在</text><text x="352.58" y="440.76" font-size="9.00" class="sc-loraregular">19</text><text x="363.42" y="440.76" font-size="9.00" class="sc-notoserifcjksc">个不同场景上评估。越低越好。</text><text x="72.00" y="481.36" font-size="11.00" class="sc-notoserifcjksc">在启用扩展思考（</text><text x="160.00 165.91 171.74 175.99 181.96 188.63 195.21 201.12 207.70 210.59 214.85 221.44 224.53 231.20 237.11 240.20 246.88" y="481.36" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="252.96" y="481.36" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="285.96 293.65 296.64 302.25 308.82 315.40 321.36 324.25 334.18 340.05 344.30 350.89 357.33 362.42 365.31" y="481.36" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="374.20" y="481.36" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上取得了我们迄今观</text><text x="72.00" y="496.98" font-size="11.00" class="sc-notoserifcjksc">察到的最佳结果，</text><text x="160.00 165.91 171.62 175.62 182.45" y="496.98" font-size="11.00" class="sc-loraregular">k=100</text><text x="192.17" y="496.98" font-size="11.00" class="sc-notoserifcjksc">时的攻击成功率（</text><text x="280.17 285.77 290.14 294.40 300.07 305.93 311.83 314.73 319.82 326.39 332.18 337.98 343.94 349.04 354.13 357.02 361.71 367.31 371.56" y="496.98" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="377.52" y="496.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="388.52" y="496.98" font-size="11.00" class="sc-loraregular">ASR</text><text x="408.56" y="496.98" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="433.45" y="496.98" font-size="11.00" class="sc-loraregular">4.8%</text><text x="457.87" y="496.98" font-size="11.00" class="sc-notoserifcjksc">，优于</text><text x="493.76 501.45 504.44 510.05 516.62 523.20" y="496.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="512.60" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="512.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="164.70" y="512.60" font-size="11.00" class="sc-loraregular">6.1%</text><text x="187.33" y="512.60" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="212.23 219.92 222.91 228.52 235.09 241.66 247.63 250.52 259.25 265.82 272.39 277.48 280.37 286.34 289.04" y="512.60" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="295.22" y="512.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="306.22 312.41 315.00 321.36" y="512.60" font-size="11.00" class="sc-loraregular">9.6%</text><text x="330.93" y="512.60" font-size="11.00" class="sc-notoserifcjksc">）。三个模型在</text><text x="410.82 416.73 422.44" y="512.60" font-size="11.00" class="sc-loraregular">k=1</text><text x="429.34" y="512.60" font-size="11.00" class="sc-notoserifcjksc">时的攻击成功概率均为</text><text x="72.00 78.65 81.36 85.36" y="528.22" font-size="11.00" class="sc-loraregular">0.1%</text><text x="94.93" y="528.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="562.32" font-size="11.00" class="sc-notoserifcjksc">数个版本以来，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44" y="562.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="187.29" y="562.32" font-size="11.00" class="sc-notoserifcjksc">模型在该基准测试上的表现一直处于或接近最高水平，而我们尚未找到一</text><text x="72.00" y="577.94" font-size="11.00" class="sc-notoserifcjksc">个能够在所有模型和提供商之间进行公平比较的合适替代基准。为与以往的系统卡保持一致，我</text><text x="72.00" y="593.56" font-size="11.00" class="sc-notoserifcjksc">们继续报告该基准测试，同时正在投入构建更强的自适应评估。这些评估虽然无法在不同提供商</text><text x="72.00" y="609.18" font-size="11.00" class="sc-notoserifcjksc">之间直接比较，但使我们能够跟踪各</text><text x="250.89 258.58 261.57 267.18 273.75 280.33" y="609.18" font-size="11.00" class="sc-loraregular">Claude</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">9</text><text x="78.10 85.66 90.82 95.45 99.36 101.89 104.52 113.69 116.15 118.68 121.31 126.66 130.53 133.15 138.31 141.03 143.49 146.12 149.17 154.54 160.67 166.04 171.49 174.54 177.00 179.63 186.02 192.01 197.43 200.06 205.15 209.11 212.98 218.14 223.46 228.76 234.18 238.50 241.13 250.07 255.87 260.86 266.28 270.91 273.54 278.17 283.54 288.80 294.65 300.72 306.70 309.20 311.82 317.45 321.32 325.58 331.43 337.49 342.97 348.39 352.72 355.35 360.51 366.48 371.64 377.61 381.48 384.29 389.28 394.70 397.33 402.42 406.39 410.26 415.41 420.73 426.10 430.73 433.36 439.09 444.37 450.34 455.50 460.13 464.75 467.38 473.36 478.78 482.11 487.52 493.59 498.22 503.64" y="704.46" font-size="10.00" class="sc-loraregular">Nasr, M., et al. (2025). The attacker moves second: Stronger adaptive attacks bypass defenses</text><text x="72.00 77.16 82.69 87.84 90.65 96.72 101.35 105.22 107.85 113.62 119.40 128.58 131.21 133.82 138.97 141.78 144.50 150.32 154.58 159.98 165.13 170.50 175.13 177.76 182.92 188.98 194.96 197.59 203.56 207.82 213.66 222.60 228.57 232.44 235.07 237.87 243.89 246.50 251.87 257.14 261.01 263.81 269.66 275.73 280.36 282.82 285.45 290.60 294.31 300.80 303.61 308.66 311.16 316.52 321.97 325.61 331.66 333.97 340.17 345.95 352.09 357.31 362.87" y="717.26" font-size="10.00" class="sc-loraregular">against LLM jailbreaks and prompt injections. arXiv:2510.09023.</text><text x="367.96 373.86 377.83 381.70 387.66 392.29 394.79 398.48 404.94 410.09 414.42 419.72 422.53 427.19 429.65 435.49 439.77 445.30 451.76 456.92 462.73 467.01 473.91 479.28 484.72 488.36 494.41 496.72 502.93 508.71 514.84 520.06" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.09023</text><text x="525.63" y="717.26" font-size="10.00" class="sc-loraregular">.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对自适应攻击者的鲁棒性</text><text x="72.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="111.37" font-size="6.60" class="sc-loraregular">9</text><text x="361.81" y="115.03" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新颖方法的攻击。我</text><text x="72.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">们继续在内部以及与外部研究合作伙伴合作，投入于能更好地模拟真实世界对手能力的自适应评</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">估。本节中的评估衡量模型对基于与模型交互而不断改进攻击的对手的鲁棒性。这些评估体现了</text><text x="72.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">一种刻意宽松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景可进行多次尝试。</text><text x="72.00" y="193.13" font-size="11.00" class="sc-notoserifcjksc">真实世界的攻击者通常不具备这两种可用手段，因为他们不知道目标部署情况，且重复尝试会增</text><text x="72.00" y="208.75" font-size="11.00" class="sc-notoserifcjksc">加被发现的几率。</text><text x="72.00" y="309.34" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="309.34" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="341.72" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="341.72" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="341.72" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45" y="341.72" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35" y="341.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39" y="341.72" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在编</text><text x="72.00" y="357.34" font-size="11.00" class="sc-notoserifcjksc">程环境中对提示词注入的鲁棒性。</text><text x="237.00" y="357.34" font-size="11.00" class="sc-loraregular">Shade</text><text x="270.93" y="357.34" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="413.93 418.62 424.58 427.67 434.35 438.01 444.45 449.14 454.93 460.89 470.73 476.69 483.27" y="357.34" font-size="11.00" class="sc-loraregular">reinforcement</text><text x="72.00 74.99 80.93 86.61 91.37 98.05 101.14 107.82" y="372.96" font-size="11.00" class="sc-loraregular">learning</text><text x="113.90" y="372.96" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，迭代地提升利用模型漏洞的能力。攻击者先在一组先前模型上针</text><text x="72.00" y="388.58" font-size="11.00" class="sc-notoserifcjksc">对测试用例进行优化，然后在相同场景上迁移到最新模型。</text><text x="72.00" y="438.88" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的攻击成功率：该攻击者在</text><text x="305.89" y="438.88" font-size="11.00" class="sc-loraregular">40</text><text x="321.58" y="438.88" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，然后在相同场景上进行评</text><text x="72.00" y="454.50" font-size="11.00" class="sc-notoserifcjksc">估。对于每个场景，攻击者有</text><text x="217.89" y="454.50" font-size="11.00" class="sc-loraregular">200</text><text x="240.36" y="454.50" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。我们报告成功尝试的总体百分比，以及至少有一</text><text x="72.00" y="470.12" font-size="11.00" class="sc-notoserifcjksc">次成功尝试的场景数量。</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="332.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="332.92" width="31.04" height="11.00" fill="transparent"/></a></svg></div>

9" y="253.35" font-size="11.00" class="sc-loraregular">23/40</text><text x="393.75 399.65 402.19 409.02 415.37" y="253.35" font-size="11.00" class="sc-loraregular">2.09%</text><text x="462.75 466.75 472.32 479.44 485.39" y="253.35" font-size="11.00" class="sc-loraregular">15/40</text><text x="252.00 256.00 260.58 263.29 269.25 275.20" y="278.68" font-size="11.00" class="sc-loraregular">17.44%</text><text x="325.50 331.62 337.40 344.52 350.47" y="278.68" font-size="11.00" class="sc-loraregular">38/40</text><text x="393.75 399.71 402.41 406.41 410.41" y="278.68" font-size="11.00" class="sc-loraregular">4.11%</text><text x="462.75 468.65 474.57 481.68 487.64" y="278.68" font-size="11.00" class="sc-loraregular">26/40</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="304.01" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48" y="318.09" font-size="11.00" class="sc-lorabold">Sonnet</text><text x="75.75" y="332.18" font-size="11.00" class="sc-lorabold">4.6</text><text x="90.64" y="327.53" font-size="6.60" class="sc-lorabold">10</text><text x="252.00 256.00 261.90 264.26 269.32 273.32" y="304.01" font-size="11.00" class="sc-loraregular">12.71%</text><text x="325.50 331.62 337.54 344.65 350.61" y="304.01" font-size="11.00" class="sc-loraregular">36/40</text><text x="393.75 399.65 402.36 408.71 415.06" y="304.01" font-size="11.00" class="sc-loraregular">2.99%</text><text x="462.75 468.87 474.52 481.63 487.59" y="304.01" font-size="11.00" class="sc-loraregular">32/40</text><text x="252.00 257.96 263.95 266.65 272.56 278.91" y="331.45" font-size="11.00" class="sc-loraregular">45.26%</text><text x="325.50 331.46 337.74 344.86 350.81" y="331.45" font-size="11.00" class="sc-loraregular">40/40</text><text x="393.75 399.93 402.28 407.35 414.17" y="331.45" font-size="11.00" class="sc-loraregular">8.70%</text><text x="462.75 468.71 474.99 482.11 488.06" y="331.45" font-size="11.00" class="sc-loraregular">40/40</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="75.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="159.99" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="199.41" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="252.89" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="278.23" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="303.56" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="330.99" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施时的攻击成功</text><text x="393.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">率</text><text x="393.25" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="350.63" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="350.63" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87 122.35 124.71 130.05 135.64 140.36 145.72" y="350.63" font-size="9.00" class="sc-lorabold">5.2.2.1.A] Shade</text><text x="152.93" y="350.63" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在编程环境中的攻击成功率</text><text x="341.93" y="350.63" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="458.93" y="350.63" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="476.93" y="350.63" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数</text><text x="72.00" y="362.33" font-size="9.00" class="sc-notoserifcjksc">以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="326.37" y="362.33" font-size="9.00" class="sc-loraregular">200</text><text x="344.74" y="362.33" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试中成功的</text><text x="72.00" y="374.03" font-size="9.00" class="sc-notoserifcjksc">比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="429.42" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="429.42" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性介于</text><text x="229.14 236.82 239.82 245.43 251.99 258.57 264.53 267.43 277.36 283.22 287.48 294.07 300.50 305.60 308.49 315.16 319.84 325.75 331.30 334.39 340.31" y="429.42" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="352.02" y="429.42" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="365.91 373.60 376.59 382.20 388.77 395.35 401.31 404.20 412.93 419.50 426.07 431.16 434.05 440.02 442.72" y="429.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="451.80" y="429.42" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="484.80 494.73 500.59 504.85 511.44 517.87 522.97 525.86" y="429.42" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="445.04" font-size="11.00" class="sc-notoserifcjksc">在所有尝试上的攻击成功率为</text><text x="217.89 224.55 227.25 233.22 239.21" y="445.04" font-size="11.00" class="sc-loraregular">0.45%</text><text x="248.78" y="445.04" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="273.67 283.61 289.47 293.73 300.32 306.75 311.84 314.74 321.40 326.09 332.00 337.55 340.64 346.56" y="445.04" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="358.26" y="445.04" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="372.16 378.81 381.35 388.18" y="445.04" font-size="11.00" class="sc-loraregular">0.0%</text><text x="397.75" y="445.04" font-size="11.00" class="sc-notoserifcjksc">。这些突破分布在</text><text x="488.65" y="445.04" font-size="11.00" class="sc-loraregular">40</text><text x="504.33" y="445.04" font-size="11.00" class="sc-notoserifcjksc">个测试</text><text x="72.00" y="460.66" font-size="11.00" class="sc-notoserifcjksc">场景中的</text><text x="118.89" y="460.66" font-size="11.00" class="sc-loraregular">8</text><text x="127.97" y="460.66" font-size="11.00" class="sc-notoserifcjksc">个。额外的安全防护措施将攻击成功率进一步降至</text><text x="372.86 379.52 382.22 388.18 392.19" y="460.66" font-size="11.00" class="sc-loraregular">0.41%</text><text x="401.76" y="460.66" font-size="11.00" class="sc-notoserifcjksc">，但这种情况下的突破分布</text><text x="72.00" y="476.28" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="476.28" font-size="11.00" class="sc-loraregular">40</text><text x="101.58" y="476.28" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="159.47" y="476.28" font-size="11.00" class="sc-loraregular">11</text><text x="170.37" y="476.28" font-size="11.00" class="sc-notoserifcjksc">个。</text><text x="192.37" y="472.62" font-size="6.60" class="sc-loraregular">11</text><text x="197.18" y="476.28" font-size="11.00" class="sc-notoserifcjksc">我们预计这一差异在面对现实世界的对手时并不显著，但我们正在调查</text><text x="72.00" y="491.90" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="107.89 117.83 123.69 127.95 134.54 140.97 146.06 148.96 155.62 160.31 166.21 171.77 174.86 180.78" y="491.90" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.48" y="491.90" font-size="11.00" class="sc-notoserifcjksc">的这一退步，并将在适当情况下考虑更新我们的安全防护措施以进一步</text><text x="72.00" y="507.52" font-size="11.00" class="sc-notoserifcjksc">缩小差距。不过，相比开启扩展思考的</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.71" y="507.52" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="523.14" font-size="11.00" class="sc-notoserifcjksc">试上的攻击成功率达到</text><text x="184.89 189.48 192.02 198.85 204.98" y="523.14" font-size="11.00" class="sc-loraregular">7.03%</text><text x="214.55" y="523.14" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="225.55" y="523.14" font-size="11.00" class="sc-loraregular">40</text><text x="241.24" y="523.14" font-size="11.00" class="sc-notoserifcjksc">个场景中有</text><text x="299.13 304.87" y="523.14" font-size="11.00" class="sc-loraregular">23</text><text x="313.89" y="523.14" font-size="11.00" class="sc-notoserifcjksc">个至少出现一次突破。</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 87.53 90.25 95.35 101.32 107.30 112.72 115.35 121.02 126.87 132.94 139.01 144.36 148.23 150.86 156.28 158.64" y="665.40" font-size="10.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="167.05" y="665.40" font-size="10.00" class="sc-notoserifcjksc">属于攻击者训练时所针对的模型集合，因此其攻击成功率预计会更高，且不具有直接</text><text x="72.00" y="679.60" font-size="10.00" class="sc-notoserifcjksc">可比性。</text><text x="72.00" y="690.47" font-size="6.00" class="sc-loraregular">11</text><text x="79.00" y="693.80" font-size="10.00" class="sc-notoserifcjksc">启用安全防护措施后观察到的上升，源于一些场景从无安全防护措施时的</text><text x="401.63 407.35 414.25 419.62 425.83" y="693.80" font-size="10.00" class="sc-loraregular">0/200</text><text x="434.67" y="693.80" font-size="10.00" class="sc-notoserifcjksc">次尝试成功变为有安全</text><text x="72.00" y="708.00" font-size="10.00" class="sc-notoserifcjksc">防护措施时的</text><text x="134.63 138.09 144.99 150.36 156.57" y="708.00" font-size="10.00" class="sc-loraregular">1/200</text><text x="165.41" y="708.00" font-size="10.00" class="sc-notoserifcjksc">次。该差异在统计上与零无法区分（配对置换检验</text><text x="388.04" y="708.00" font-size="10.00" class="sc-loraregular">p</text><text x="396.64" y="708.00" font-size="10.00" class="sc-notoserifcjksc">≈</text><text x="409.27 415.32 417.78 423.20" y="708.00" font-size="10.00" class="sc-loraregular">0.45</text><text x="428.65" y="708.00" font-size="10.00" class="sc-notoserifcjksc">）。</text></svg></div>

font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="371.33" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="424.81" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="450.14" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="475.48" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="500.81" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="276.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="328.75" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="398.50" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施时的攻击成</text><text x="398.50" y="276.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="398.50" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="478.00" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="114.99" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="114.99" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72 196.41 199.40 205.01 211.58 218.16" y="114.99" font-size="11.00" class="sc-loraregular">Claude</text><text x="227.01" y="114.99" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性，在这类环境中模型直接与图</text><text x="72.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">形用户界面（</text><text x="138.00" y="130.61" font-size="11.00" class="sc-loraregular">GUI</text><text x="158.33" y="130.61" font-size="11.00" class="sc-notoserifcjksc">）交互。在本次评估中，我们使用的攻击者与</text><text x="381.22 388.91 391.90 397.51 404.08 410.66 416.62 419.51 428.25 434.81 441.38 446.47 449.37 455.33 457.68" y="130.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="465.65" y="130.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="479.54 487.23 490.22 495.83 502.40 508.98" y="130.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="146.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="146.23" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的相同。该攻击者直接针对测试用例进行优化。与编程评估类似，攻击者</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="161.85" font-size="11.00" class="sc-loraregular">14</text><text x="98.75" y="161.85" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们衡量所有尝试中的成功情况，并细分出至少有一次攻击成功的场</text><text x="72.00" y="177.47" font-size="11.00" class="sc-notoserifcjksc">景。我们比较了模型在有和没有额外安全防护措施时的鲁棒性，这些安全防护措施是我们为在此</text><text x="72.00" y="193.09" font-size="11.00" class="sc-notoserifcjksc">场景下保护用户而设计的。</text><text x="72.00" y="518.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="518.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01 123.49 125.86 131.19 136.78 141.50 146.86" y="518.32" font-size="9.00" class="sc-lorabold">5.2.2.2.A] Shade</text><text x="154.07" y="518.32" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.07" y="518.32" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="487.07" y="518.32" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="505.07" y="518.32" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="530.02" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="362.37" y="530.02" font-size="9.00" class="sc-loraregular">200</text><text x="380.74" y="530.02" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试</text><text x="72.00" y="541.72" font-size="9.00" class="sc-notoserifcjksc">中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="597.13" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="597.13" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中同样表现出对提示词注入攻击的显著鲁棒性。在没有安全</text><text x="72.00" y="612.75" font-size="11.00" class="sc-notoserifcjksc">防护措施时，</text><text x="138.00 147.93 153.80 158.05 164.64 171.08 176.17 179.06" y="612.75" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="187.95" y="612.75" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率高于</text><text x="278.84 286.53 289.52 295.14 301.70 308.28 314.24 317.14 327.07 332.93 337.19 343.78 350.21 355.30 358.20 364.86 369.55 375.46 381.01 384.10 390.02" y="612.75" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="398.83" y="612.75" font-size="11.00" class="sc-notoserifcjksc">：攻击在</text><text x="445.73 452.38 455.09 461.27 467.18" y="612.75" font-size="11.00" class="sc-loraregular">0.82%</text><text x="479.64" y="612.75" font-size="11.00" class="sc-notoserifcjksc">的尝试中成</text><text x="72.00" y="628.37" font-size="11.00" class="sc-notoserifcjksc">功，并在</text><text x="118.89" y="628.37" font-size="11.00" class="sc-loraregular">14</text><text x="131.75" y="628.37" font-size="11.00" class="sc-notoserifcjksc">个测试场景中的</text><text x="211.65" y="628.37" font-size="11.00" class="sc-loraregular">4</text><text x="220.50" y="628.37" font-size="11.00" class="sc-notoserifcjksc">个中成功，而开启扩展思考的</text><text x="366.39 376.33 382.19 386.45 393.03 399.47 404.56 407.46 414.12 418.81 424.71 430.27 433.36 439.28" y="628.37" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="450.98" y="628.37" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="464.88 471.53 474.24 480.20 486.33" y="628.37" font-size="11.00" class="sc-loraregular">0.43%</text><text x="498.79" y="628.37" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="512.68 518.37 525.96 529.96" y="628.37" font-size="11.00" class="sc-loraregular">3/14</text><text x="72.00" y="643.99" font-size="11.00" class="sc-notoserifcjksc">个场景。不过，这相比</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.00 261.71" y="643.99" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="270.78" y="643.99" font-size="11.00" class="sc-notoserifcjksc">仍是大幅改进，后者的攻击成功率达到</text><text x="460.67 465.26 467.97 471.97 477.93" y="643.99" font-size="11.00" class="sc-loraregular">7.14%</text><text x="487.50" y="643.99" font-size="11.00" class="sc-notoserifcjksc">，并在</text><text x="523.40" y="643.99" font-size="11.00" class="sc-loraregular">14</text><text x="72.00" y="659.61" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="129.89" y="659.61" font-size="11.00" class="sc-loraregular">7</text><text x="137.86" y="659.61" font-size="11.00" class="sc-notoserifcjksc">个中被突破。启用安全防护措施后，</text><text x="313.86 323.79 329.65 333.91 340.50 346.93 352.03 354.92" y="659.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="363.81" y="659.61" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率降至</text><text x="454.70 461.36 464.06 470.02 476.38" y="659.61" font-size="11.00" class="sc-loraregular">0.46%</text><text x="485.95" y="659.61" font-size="11.00" class="sc-notoserifcjksc">（按尝试</text><text x="72.00" y="675.23" font-size="11.00" class="sc-notoserifcjksc">计），攻击在</text><text x="140.89" y="675.23" font-size="11.00" class="sc-loraregular">14</text><text x="153.75" y="675.23" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="211.64" y="675.23" font-size="11.00" class="sc-loraregular">3</text><text x="220.66" y="675.23" font-size="11.00" class="sc-notoserifcjksc">个中成功，更接近</text><text x="311.56 319.25 322.24 327.85 334.42 340.99 346.96 349.85 359.78 365.64 369.90 376.49 382.93 388.02 390.91 397.58 402.26 408.17 413.73 416.82 422.73" y="675.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="431.55" y="675.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="442.55 449.20 451.91 458.03 463.94" y="675.23" font-size="11.00" class="sc-loraregular">0.32%</text><text x="476.40" y="675.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="490.30 495.95 503.54 507.55" y="675.23" font-size="11.00" class="sc-loraregular">2/14</text><text x="516.40" y="675.23" font-size="11.00" class="sc-notoserifcjksc">个场</text><text x="72.00" y="690.85" font-size="11.00" class="sc-notoserifcjksc">景）。鉴于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">绝对攻击成功率较低且测试用例数量较少，对模型之间的微小差异应谨慎解读。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="470.89 478.58 481.57 487.18 493.75 500.33 506.29 509.18 512.28" y="163.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude in</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="179.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chrome</text><text x="116.09" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="179.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="173.98 181.67 184.66 190.27 196.84 203.42 209.38 212.27 219.96 226.29 234.96 241.40 246.12" y="179.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="252.03" y="179.19" font-size="11.00" class="sc-notoserifcjksc">。我们最初是在发布</text><text x="353.92 361.61 364.60 370.21 376.78 383.35 389.32 392.21 400.94 407.51 414.08 419.17 422.06 428.03 430.73" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="439.62" y="179.19" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="464.51 472.20 475.19 480.80 487.37 493.95 499.91 502.80 506.47 512.90" y="179.19" font-size="11.00" class="sc-loraregular">Claude for</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="194.81" font-size="11.00" class="sc-loraregular">Chrome</text><text x="116.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出了</text><text x="226.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="270.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc">；由于后续模型已使早期的测试攻击集饱和，我们定期</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">以更复杂的环境和更强的攻击对其进行更新。当前的评估包含</text><text x="371.89" y="210.43" font-size="11.00" class="sc-loraregular">129</text><text x="391.06" y="210.43" font-size="11.00" class="sc-notoserifcjksc">个精选环境，这些环境在训练</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">期间从未出现过，并包含随后会通过截图或页面读取被查看到的高质量攻击。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">我们将攻击成功率报告为：在模型实际查看到的注入中成功的注入所占的比例，因为能力不同的</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">检查器进行验证。</text><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="470.89" y="154.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="470.89" y="154.77" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="506.29" y="154.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="509.18" y="154.77" width="9.77" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="518.95" y="154.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="72.00" y="170.39" width="41.19" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="113.19" y="170.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/blog/claude-for-chrome" rel="noopener"><rect x="116.09" y="170.39" width="11.00" height="11.00" f
