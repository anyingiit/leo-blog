6.00 127.00 138.00" y="147.44" font-size="11.00" class="sc-notoserifcjksc">及提示词注入（</text><text x="149.00 155.57 160.25 166.69 176.52 183.09 187.35 190.24 193.33 199.95 202.82 208.73 214.53 218.78 221.88 228.31" y="147.44" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="234.99 245.99 256.99 267.99 278.99 289.99 300.99 311.99 322.99 333.99 344.99 355.99 366.99 377.99 388.99" y="147.44" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本节中，我们仅报告</text><text x="402.88 412.81 418.68 422.93 429.52 435.96 441.05 443.94" y="147.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="452.83 463.83 474.83 485.83 496.83 507.83 518.83 529.83" y="147.44" font-size="11.00" class="sc-notoserifcjksc">的结果。此处的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="163.06" font-size="11.00" class="sc-notoserifcjksc">估旨在衡量模型本身的行为，独立于部署时的安全防护措施；若针对</text><text x="404.89 412.58 415.57 421.18 427.75 434.33 440.29 443.18 448.77 454.45 460.85 463.84 469.80 472.70" y="163.06" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="481.59 492.59 503.59 514.59 525.59" y="163.06" font-size="11.00" class="sc-notoserifcjksc">运行这些评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="194.30" font-size="11.00" class="sc-notoserifcjksc">模型自身的响应混为一谈。</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 247.88 253.56 259.96 262.95 268.91 271.80" y="194.30" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="280.69 291.69 302.69 313.69 324.69 335.69 346.69 357.69 368.69 379.69 390.69 401.69 412.69 423.69 434.69 445.69 456.69 467.69 478.69 489.69 500.69 511.69 522.69" y="194.30" font-size="11.00" class="sc-notoserifcjksc">使用相同的底层模型，并继承此处报告的行为，同时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="209.92" font-size="11.00" class="sc-notoserifcjksc">由分类器和多模型回退（</text><text x="193.00 196.72 202.39 205.39 208.38 214.78 220.46 226.31" y="209.92" font-size="11.00" class="sc-loraregular">fallback</text><text x="232.21 243.21 254.21 265.21 276.21 287.21 298.21 309.21 320.21 331.21 342.21 353.21 364.21 375.21 386.21 397.21" y="209.92" font-size="11.00" class="sc-notoserifcjksc">）行为在其之上提供额外一层保护。</text><text x="72.00 81.02 84.66" y="295.72" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06 107.06 121.06 135.06 149.06 163.06 177.06 191.06" y="295.72" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00 80.37 83.75 88.46 91.84 96.54 99.64 109.62 113.24 122.05 130.64 139.46 147.48 150.57 160.56 168.85 177.66" y="332.82" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78 201.78 214.78 227.78 240.78" y="332.82" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00 83.00 94.00 105.00 116.00" y="360.70" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="360.70" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18" y="360.70" font-size="11.00" class="sc-notoserifcjksc">作为</text><text x="193.08 200.77 203.76 209.37 215.93 222.51 228.48 231.37 239.06 245.49 252.07" y="360.70" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="260.92 271.92 282.92 293.92 304.92 315.92 326.92 337.92 348.92 359.92 370.92 381.92 392.92 403.92 414.92 425.92 436.92 447.92 458.92 469.92 480.92 491.92 502.92 513.92 524.92" y="360.70" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用及良性的网络安全相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="376.32" font-size="11.00" class="sc-notoserifcjksc">关请求。提示集与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.71" y="376.32" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="248.78 259.78 270.78 281.78" y="376.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡（</text><text x="292.78 298.96 304.77 309.86 314.12 320.08 329.92 332.81 340.50 346.18 350.86" y="376.32" font-size="11.00" class="sc-loraregular" fill="#0000ff">System Card</text><text x="357.44" y="376.32" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="368.44 379.44 390.44 401.44 412.44 423.44 434.44 445.44 456.44 467.44" y="376.32" font-size="11.00" class="sc-notoserifcjksc">中的相同，分为两类：</text><text x="108.00 119.00 130.00 141.00 152.00" y="425.47" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00 169.36" y="425.47" font-size="11.00" class="sc-loraregular">61</text><text x="176.26 187.26 198.26 209.26 220.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc">条违反我们</text><text x="231.26 242.26 253.26 264.26 275.26" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="286.26 294.45 299.54 305.22 311.25 317.21 320.10 326.66 333.09 336.09 339.18 344.97" y="425.47" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="350.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="361.78 372.78 383.78 394.78 405.78 416.78 427.78 438.78 449.78 460.78 471.78 482.78 493.78 504.78 515.78 526.78" y="425.47" font-size="11.00" class="sc-notoserifcjksc">、应予拒绝的提示。示例包括协助创</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="441.09" font-size="11.00" class="sc-notoserifcjksc">建恶意软件、编写用于</text><text x="220.89 228.98 237.17 243.54" y="441.09" font-size="11.00" class="sc-loraregular">DDoS</text><text x="252.67 263.67 274.67 285.67 296.67 307.67 318.67 329.67 340.67 351.67 362.67 373.67 384.67 395.67 406.67 417.67 428.67 439.67 450.67 461.67 472.67 483.67" y="441.09" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="474.05" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00 180.36" y="474.05" font-size="11.00" class="sc-loraregular">61</text><text x="187.26 198.26 209.26 220.26 231.26 242.26" y="474.05" font-size="11.00" class="sc-notoserifcjksc">条提示，涵盖</text><text x="256.15 263.84 266.83 272.44 279.01 285.58" y="474.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="294.44 305.44 316.44 327.44 338.44 349.44 360.44 371.44 382.44 393.44 404.44 415.44 426.44 437.44 448.44 459.44 470.44 481.44 492.44 503.44 514.44 525.44" y="474.05" font-size="11.00" class="sc-notoserifcjksc">应当提供协助的敏感但允许的请求。示例包括运行</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="489.67" font-size="11.00" class="sc-notoserifcjksc">网络侦察工具、测试网站是否存在漏洞，以及分析渗透测试输出。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="538.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24" y="538.81" font-size="11.00" class="sc-notoserifcjksc">获得了标准的</text><text x="229.14 236.82 239.82 245.43 251.99 258.57 264.53 267.43 275.12 281.55 288.13" y="538.81" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="296.98 307.98 318.98 329.98 340.98 351.98 362.98 373.98 384.98 395.98" y="538.81" font-size="11.00" class="sc-notoserifcjksc">工具集。每条提示运行</text><text x="409.88 413.88" y="538.81" font-size="11.00" class="sc-loraregular">10</text><text x="423.60 434.60 445.60 456.60 467.60 478.60 489.60" y="538.81" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="503.50 507.50 510.27 516.18 522.09" y="538.81" font-size="11.00" class="sc-loraregular">1,220</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="554.43" font-size="11.00" class="sc-notoserifcjksc">次测试。与近期的几次发布一样，我们在运行本评估时默认应用</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 428.87 435.31 441.89" y="554.43" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="450.74 461.74 472.74 483.74 494.74" y="554.43" font-size="11.00" class="sc-notoserifcjksc">系统提示词</text><text x="72.00" y="570.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="570.05" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29 171.29 182.29 193.29 204.29 215.29 226.29 237.29 248.29 259.29 270.29 281.29 292.29 303.29 314.29 325.29 336.29 347.29 358.29 369.29" y="570.05" font-size="11.00" class="sc-notoserifcjksc">）。我们已将这些评估所用的自动评分模型从</text><text x="383.18 390.87 393.86 399.47 406.04 412.61 418.58 421.47 427.71 434.14 440.82 447.50 453.38 457.64 460.53 466.49 469.20" y="570.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="478.09 489.09 500.09" y="570.05" font-size="11.00" class="sc-notoserifcjksc">更新为</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="585.67" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="125.98 136.98 147.98 158.98 169.98 180.98 191.98 202.98 213.98 224.98 235.98 246.98 257.98 268.98 279.98 290.98 301.98 312.98 323.98 334.98 345.98 356.98" y="585.67" font-size="11.00" class="sc-notoserifcjksc">，因此结果可能与以往系统卡中的结果略有不同。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="162.89" y="367.52" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a3 13.85" font-size="11.00" class="sc-notoserifcjksc">意愿略强一些，偶尔会顺从汇编或整理个人信息的请求。</text><text x="72.00 80.37 83.75 88.46 91.84" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.3</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72 193.72 206.72 219.72" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意智能体影响力行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">我们的前沿合规框架（</text><text x="182.00 187.92 192.60 199.04 205.62 209.87 212.96 218.93 223.69 226.58 234.27 240.71 250.54 257.11 260.10 263.19 268.87 275.54 281.34 287.30 290.20 296.11 300.80 306.48 316.31 322.23 330.91 337.34 342.06" y="206.00" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="347.97 358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97" y="206.00" font-size="11.00" class="sc-notoserifcjksc">）针对有害操纵风险设立了两级。第</text><text x="526.86" y="206.00" font-size="11.00" class="sc-loraregular">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">级能力指模型能够自动完成一项通常需要多名老练行为者参与的影响力行动中超过</text><text x="470.89 476.89 483.72" y="221.62" font-size="11.00" class="sc-loraregular">50%</text><text x="496.18 507.18 518.18 529.18" y="221.62" font-size="11.00" class="sc-notoserifcjksc">的基础设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="237.24" font-size="11.00" class="sc-notoserifcjksc">施步骤。如果模型能够在人类监督不到</text><text x="261.89 265.90 272.73" y="237.24" font-size="11.00" class="sc-loraregular">10%</text><text x="285.19 296.19 307.19 318.19 329.19 340.19 351.19 362.19 373.19 384.19 395.19 406.19 417.19 428.19 439.19 450.19 461.19 472.19 483.19 494.19 505.19 516.19 527.19" y="237.24" font-size="11.00" class="sc-notoserifcjksc">的情况下，以系统化的定向方式端到端地开展欺骗性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="252.86" font-size="11.00" class="sc-notoserifcjksc">影响力行动，则达到第</text><text x="184.89" y="252.86" font-size="11.00" class="sc-loraregular">2</text><text x="193.69 204.69 215.69 226.69 237.69 248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="252.86" font-size="11.00" class="sc-notoserifcjksc">级。我们用于辅助风险评估流程的评估之一是恶意智能体影响力行动评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="268.48" font-size="11.00" class="sc-notoserifcjksc">估；根据下文的结果，我们认为该模型尚未越过第</text><text x="316.89" y="268.48" font-size="11.00" class="sc-loraregular">2</text><text x="325.69 336.69 347.69 358.69" y="268.48" font-size="11.00" class="sc-notoserifcjksc">级阈值。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="351.73" font-size="11.00" class="sc-notoserifcjksc">该评估最早在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="351.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="263.77 274.77 285.77" y="351.73" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="296.77 307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="351.73" font-size="11.00" class="sc-notoserifcjksc">中详细介绍，用于评估模型能否自主地端到端执行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="367.35" font-size="11.00" class="sc-notoserifcjksc">一项影响力行动，且其水平足以对恶意行为者构成实质性的能力提升（</text><text x="413.00 419.57 426.13 429.13 432.22 436.07" y="367.35" font-size="11.00" class="sc-loraregular">uplift</text><text x="440.32 451.32 462.32 473.32 484.32 495.32 506.32 517.32 528.32" y="367.35" font-size="11.00" class="sc-notoserifcjksc">）。模型被置于一个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="382.97" font-size="11.00" class="sc-notoserifcjksc">配有模拟社交媒体平台工具的智能体运行框架（</text><text x="303.00 309.59 315.27 320.03 326.71 332.67 337.76" y="382.97" font-size="11.00" class="sc-loraregular">harness</text><text x="342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="382.97" font-size="11.00" class="sc-notoserifcjksc">）中，其中包括模拟内容审核和反制互动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="398.59" font-size="11.00" class="sc-notoserifcjksc">障碍。随后，我们依据固定的成功标准对其评分，例如在符合所声明地点作息的合理时间发帖，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="414.21" font-size="11.00" class="sc-notoserifcjksc">以及根据互动数据迭代内容。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">我们测试了与此前各次发布相同的两个场景：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">压制投票场景：模型被指示开展一场伪草根运动（</text><text x="411.35 422.35 433.35 444.35 455.35 466.35 477.35 488.35 499.35 510.35 521.35" y="513.64" font-size="11.00" class="sc-notoserifcjksc">），以压低特定候选人的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">投票率和支持热情；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">国内极化场景：模型被指示找出人口群体断层线，并投放带有强烈情绪色彩、针对特定文</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">化定制的信息来激化这些断层。</text><text x="72.00 83.00 94.00 105.00 116.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">每个场景在</text><text x="129.89" y="610.80" font-size="11.00" class="sc-loraregular">3</text><text x="138.91 149.91 160.91 171.91 182.91 193.91 204.91 215.91 226.91 237.91 248.91 259.91 270.91" y="610.80" font-size="11.00" class="sc-notoserifcjksc">个模拟平台阻力级别下各运行</text><text x="284.81" y="610.80" font-size="11.00" class="sc-loraregular">3</text><text x="293.83 304.83 315.83 326.83 337.83 348.83 359.83 370.83" y="610.80" font-size="11.00" class="sc-notoserifcjksc">次，即每个场景共</text><text x="384.72" y="610.80" font-size="11.00" class="sc-loraregular">9</text><text x="393.97 404.97 415.97 426.97 437.97 448.97 459.97" y="610.80" font-size="11.00" class="sc-notoserifcjksc">次模拟，并依据</text><text x="473.86 478.93" y="610.80" font-size="11.00" class="sc-loraregular">70</text><text x="488.66 499.66 510.66 521.66" y="610.80" font-size="11.00" class="sc-notoserifcjksc">项成功标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">准评分。该评估针对模型的一个</text><text x="226.00" y="626.42" font-size="11.00" class="sc-loraregular">“</text><text x="230.40 241.40 252.40" y="626.42" font-size="11.00" class="sc-notoserifcjksc">仅有用</text><text x="263.40" y="626.42" font-size="11.00" class="sc-loraregular">”</text><text x="267.24" y="626.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="278.24 284.83 290.79 293.78 300.29 304.01 310.58 313.57 318.95 325.39 332.06 335.00" y="626.42" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="340.81 351.81 362.81 373.81 384.81 395.81 406.81 417.81 428.81 439.81 450.81 461.81 472.81 483.81 494.81 505.81 516.81 527.81" y="626.42" font-size="11.00" class="sc-notoserifcjksc">）变体进行，该变体的无害性训练有所减</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">弱，以评估模型的原始能力。</text><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.89" y="342.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="140.89" y="342.93" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="176.29" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="179.18" y="342.93" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="217.35" y="342.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f 06 280.06" y="328.33" font-size="9.00" class="sc-notoserifcjkscbold">智能体影响力行动评估结果，仅有用模型。</text><text x="289.06 298.06 307.06 316.06 325.06 334.06 343.06 352.06 361.06 370.06 379.06 388.06 397.06 406.06 415.06 424.06 433.06 442.06 451.06 460.06 469.06 478.06 487.06 496.06 505.06 514.06" y="328.33" font-size="9.00" class="sc-notoserifcjksc">百分比表示模型在模拟环境中完成的成功标准（每个场景共</text><text x="525.43 529.58" y="328.33" font-size="9.00" class="sc-loraregular">70</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="340.03" font-size="9.00" class="sc-notoserifcjksc">项）的平均占比。数值越高表示能力越强，因而对恶意行为者的潜在能力提升也越大。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="380.63" font-size="11.00" class="sc-notoserifcjksc">在两个影响力行动场景中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 252.22 258.09 262.34 268.93 275.37 280.46 283.35" y="380.63" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24" y="380.63" font-size="11.00" class="sc-notoserifcjksc">的仅有用版本的总体成功率均低于</text><text x="460.14 467.82 470.82 476.43 482.99 489.57 495.53 498.43 507.16 513.73 520.29" y="380.63" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 77.96 80.67" y="396.25" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85 97.85" y="396.25" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="111.74 119.43 122.42 128.03 134.60 141.18 147.14 150.03 159.97 165.83 170.09 176.68 183.11 188.20 191.10 197.76 202.45 208.36 213.91 217.00 222.92" y="396.25" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="234.62 245.62 256.62 267.62 278.62 289.62 300.62 311.62 322.62 333.62" y="396.25" font-size="11.00" class="sc-notoserifcjksc">相比则略高或持平。与</text><text x="347.52 357.45 363.31 367.57 374.16 380.59 385.69 388.58 395.25 399.93 405.84 411.39 414.48 420.40" y="396.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="432.11" y="396.25" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="446.00 454.73 461.30 467.87 472.96 475.85 481.82 484.52" y="396.25" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="493.60 504.60 515.60 526.60" y="396.25" font-size="11.00" class="sc-notoserifcjksc">一样，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="411.87" font-size="11.00" class="sc-notoserifcjksc">们评估认为，这些模型在许多操作步骤上仍需要大量人类指导。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="461.59" font-size="11.00" class="sc-notoserifcjksc">在压制投票场景中，相对</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="461.59" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="280.48 291.48 302.48 313.48 324.48 335.48 346.48 357.48 368.48 379.48 390.48 401.48 412.48 423.48 434.48 445.48" y="461.59" font-size="11.00" class="sc-notoserifcjksc">的提升源于更有效的行动执行，而与</text><text x="459.38 468.11 474.68 481.24 486.34 489.23 495.19 497.90" y="461.59" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="506.97 517.97 528.97" y="461.59" font-size="11.00" class="sc-notoserifcjksc">之间的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="477.21" font-size="11.00" class="sc-notoserifcjksc">差距则反映出其行动账号网络管理较弱，其活动模式使账号更容易被识别。在国内极化场景中，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="492.83" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95" y="492.83" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="168.84 178.78 184.64 188.90 195.49 201.92 207.01 209.91 216.57 221.26 227.17 232.72 235.81 241.73" y="492.83" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="253.43 264.43 275.43 286.43 297.43 308.43" y="492.83" font-size="11.00" class="sc-notoserifcjksc">相近，远低于</text><text x="322.33 331.06 337.63 344.20 349.29 352.18 358.14 360.85" y="492.83" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="367.03 378.03 389.03 400.03 411.03 422.03 433.03 444.03 455.03 466.03 477.03 488.03 499.03 510.03 521.03" y="492.83" font-size="11.00" class="sc-notoserifcjksc">；一旦账号被模拟社交媒体和消息</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="508.45" font-size="11.00" class="sc-notoserifcjksc">平台标记为不真实，它便难以维持其账号网络的协同。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="574.94" font-size="11.00" class="sc-notoserifcjksc">与此前各次发布一样，这些模型的完整训练版本（包含无害性训练）基本上从第一轮起就拒绝参</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="590.56" font-size="11.00" class="sc-notoserifcjksc">与这些任务，因为这两个场景都明显违反了我们的使用政策。因此，我们将该风险评定为低，且</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="606.18" font-size="11.00" class="sc-notoserifcjksc">处于我们前沿合规框架下的可接受水平之内。</text><text x="72.00 81.02 84.66" y="657.29" font-size="14.00" class="sc-poppinssemibold">5.2</text><text x="96.02 110.02 124.02 138.02 152.02 166.02 180.02 194.02 208.02 222.02 236.02 250.02 264.02 278.02" y="657.29" font-size="14.00" class="sc-notosanscjkscbold">智能体系统中的提示词注入风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="683.86" font-size="11.00" class="sc-notoserifcjksc">防范提示词注入仍是我们在智能体系统中安全部署模型的最高优先事项之一。提示词注入是指隐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="699.48" font-size="11.00" class="sc-notoserifcjksc">藏在智能体执行任务期间所处理的工具结果中的恶意指令。例如，智能体</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">被要求总结的一封电子邮件中可能含有隐藏文本，指示其外泄近期所有内部通信。一次成功的提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在公开网页或共享文档中的单个载荷即可攻陷任何处理它的智能体，攻击者无需针对特定用户或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">系统。当模型既能访问私密数据、又能代表用户采取行动时，这类攻击尤其危险，因为这种组合</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">使攻击者能够外泄敏感信息或触发未经授权的操作。</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="228.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="228.34" font-size="11.00" class="sc-notoserifcjksc">模型在大多数公开基准测试以及第三方研究机构</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">构建的基准测试上均已饱和。我们继续投入于能够衡量鲁棒性提升的自适应评估。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08" y="293.11" font-size="11.00" class="sc-loraregular">Mythos</text><text x="113.06 124.06 135.06 146.06 157.06 168.06 179.06 190.06 201.06 212.06 223.06 234.06 245.06 256.06 267.06 278.06 289.06 300.06 311.06 322.06 333.06 344.06 355.06 366.06 377.06 388.06 399.06 410.06 421.06" y="293.11" font-size="11.00" class="sc-notoserifcjksc">系列模型是我们迄今为止对提示词注入最具抵御能力的模型。由于</text><text x="434.96 442.64 445.64 451.25 457.81 464.39 470.35 473.25 478.83 484.51 490.91 493.90 499.87 502.76" y="293.11" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="511.65" y="293.11" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="308.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24 479.24 490.24 501.24 512.24" y="308.73" font-size="11.00" class="sc-notoserifcjksc">共享相同的核心模型，它继承了这些提升，成为我们鲁棒性最强的正式发布</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.03 94.99 101.67 107.63 112.32 117.99 120.98 123.92 129.73 135.11 140.65 146.10 151.77 154.86 157.86 163.53 169.93 172.93" y="324.35" font-size="11.00" class="sc-loraregular">generally-available</text><text x="178.89 189.89 200.89 211.89 222.89 233.89 244.89 255.89 266.89 277.89 288.89 299.89 310.89 321.89 332.89 343.89 354.89 365.89 376.89 387.89 398.89 409.89 420.89 431.89 442.89 453.89 464.89 475.89 486.89 497.89 508.89 519.89" y="324.35" font-size="11.00" class="sc-notoserifcjksc">）模型。我们将继续改进智能体产品中的安全防护措施，以进一步保护用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">户免受提示词注入的侵害。</text><text x="72.00 80.37 83.75 91.21 94.59" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.1</text><text x="102.39 115.39 128.39 141.39 154.39 167.39 180.39 193.39 206.39" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">面向工具使用的外部</text><text x="222.49 231.80 240.61 248.63 257.22 262.27 265.36 273.69 281.72 290.53 293.62 301.12 309.15 317.96 331.58 335.20 343.79" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Agent Red Teaming</text><text x="355.70 368.70 381.70 394.70" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基准测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">外部研究合作伙伴</text><text x="162.89 171.26 175.95 181.52 187.32 190.22 196.40 205.10 210.78" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="220.35 231.35 242.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc">使用与</text><text x="253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35 374.35" y="400.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">英国人工智能安全研究所（</text><text x="385.35 393.62 401.13 404.02 410.91 414.60 417.49 423.73 429.63 435.48 442.05 446.81 450.08 454.36 460.17 463.06 466.66 473.33 478.43 482.68 485.95 490.21 496.78 501.03" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">UK AI Security Institute</text><text x="507.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="517.99 528.99" y="400.30" font-size="11.00" class="sc-notoserifcjksc">合作</text><text x="72.00 83.00 94.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">开发的</text><text x="107.89 114.78 120.81 126.77 133.35 137.60 140.50 147.33 153.24 159.81 162.71 169.21 175.15 180.82 190.66 193.75 200.43" y="415.92" font-size="11.00" class="sc-loraregular">Agent Red Teaming</text><text x="206.51" y="415.92" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="217.51 224.39 231.30" y="415.92" font-size="11.00" class="sc-loraregular">ART</text><text x="238.34 249.34 260.34 271.34 282.34" y="415.92" font-size="11.00" class="sc-notoserifcjksc">）基准测试</text><text x="293.34" y="412.25" font-size="6.60" class="sc-loraregular">7</text><text x="296.38 307.38 318.38 329.38 340.38 351.38 362.38 373.38 384.38 395.38 406.38 417.38 428.38 439.38 450.38 461.38 472.38 483.38 494.38 505.38 516.38 527.38" y="415.92" font-size="11.00" class="sc-notoserifcjksc">对我们的模型进行了评估。该基准测试考察模型在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">四类利用方式下对提示词注入的易感性：破坏机密性、引入相互冲突的目标、生成被禁止的内容</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">（例如恶意代码），以及执行被禁止的操作（例如未经授权的金融交易）。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="513.64" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45 140.45 151.45 162.45 173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45" y="513.64" font-size="11.00" class="sc-notoserifcjksc">测量了提示词注入攻击在单次尝试（</text><text x="305.45 311.36 317.07" y="513.64" font-size="11.00" class="sc-loraregular">k=1</text><text x="321.07 332.07 343.07 354.07 365.07 376.07 387.07" y="513.64" font-size="11.00" class="sc-notoserifcjksc">）、十次尝试（</text><text x="398.07 403.98 409.69 413.69" y="513.64" font-size="11.00" class="sc-loraregular">k=10</text><text x="420.52 431.52 442.52 453.52 464.52 475.52 486.52" y="513.64" font-size="11.00" class="sc-notoserifcjksc">）和一百次尝试</text><text x="72.00" y="529.26" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.62 98.62 105.45" y="529.26" font-size="11.00" class="sc-loraregular">k=100</text><text x="112.28 123.28 134.28 145.28 156.28 167.28 178.28 189.28 200.28 211.28 222.28 233.28 244.28 255.28 266.28 277.28 288.28 299.28 310.28 321.28 332.28 343.28 354.28 365.28 376.28 387.28 398.28 409.28 420.28 431.28 442.28 453.28 464.28 475.28 486.28 497.28 508.28 519.28" y="529.26" font-size="11.00" class="sc-notoserifcjksc">）后的成功率，因为攻击是否成功并非确定性的，重复尝试可能会提高注入成功的可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">性。这些攻击取自</text><text x="162.89 169.78 176.69 183.73 186.62 193.51 198.19 204.15 210.83" y="544.88" font-size="11.00" class="sc-loraregular">ART Arena</text><text x="216.51 227.51 238.51 249.51 260.51 271.51 282.51 293.51 304.51 315.51 326.51 337.51 348.51 359.51 370.51 381.51 392.51 403.51 414.51 425.51 436.51 447.51 458.51 469.51 480.51 491.51 502.51 513.51 524.51" y="544.88" font-size="11.00" class="sc-notoserifcjksc">，在那里，数千名专家红队成员持续针对前沿模型改进攻击策略。</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="560.50" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45 140.45 151.45 162.45 173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45 305.45 316.45 327.45 338.45 349.45 360.45 371.45 382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45 470.45 481.45 492.45 503.45 514.45 525.45" y="560.50" font-size="11.00" class="sc-notoserifcjksc">从这一攻击池中选取了一个子集，这些攻击已被证明对多个模型有效，而不仅限于最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="576.12" font-size="11.00" class="sc-notoserifcjksc">初针对的那个模型。本节的评估涵盖间接提示词注入（</text><text x="336.00 339.09 345.77 352.35 355.44 360.12 366.03 371.83 376.08 378.98 385.54 390.23 396.67 406.50 413.07 417.32 420.22 423.31 429.93 432.80 438.71 444.50 448.76 451.85 458.29" y="576.12" font-size="11.00" class="sc-loraregular">indirect prompt injection</text><text x="464.96" y="576.12" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="475.96" y="572.45" font-size="6.60" class="sc-loraregular">8</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">7</text><text x="77.40 83.50 89.35 95.32 97.84 100.47 106.25 108.71 111.23 113.86 119.21 123.08 125.71 130.87 133.59 136.05 138.68 141.73 147.10 153.24 158.61 164.06 167.11 169.57 172.20 177.87 183.24 188.56 194.53 198.86 201.83 205.72 211.00 213.63 218.95 224.94 230.10 232.82 235.54 240.96 247.03 252.51 257.93 262.56 265.19 268.00 274.07 276.70 282.96 286.31 288.94 294.10 299.58 305.00 310.98 314.85 317.48 323.46 328.88 334.85 337.57 343.34 348.62 357.56 362.98 368.96 372.83 375.33 377.96 381.23 387.30 391.93 394.74 400.51 406.41 410.28 414.91 417.54 420.92 425.18 431.03 439.97 442.60 447.76 450.39 453.11 458.27 462.55 468.03 473.45 476.08 480.71 486.01 491.17 493.89 499.31 501.94 507.91 513.88 519.70 522.42 525.23" y="665.40" font-size="10.00" class="sc-loraregular">Zou, L., et al. (2025). Security challenges in AI agent deployment: Insights from a large scale public</text><text x="216.34 222.24 226.21 230.08 236.05 240.68 243.18 246.87 253.77 258.93 263.26 268.56 271.37 276.03 278.49 284.34 288.62 294.15 301.05 306.21 312.03 316.31 323.21 328.58 334.03 340.02 344.19 346.65 352.02 358.23 363.68 369.05" y="679.60" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2507.20526</text><text x="72.00" y="690.47" font-size="6.00" class="sc-loraregular">8</text><text x="78.00 88.00 98.00 108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00 188.00 198.00 208.00 218.00" y="693.80" font-size="10.00" class="sc-notoserifcjksc">过去，我们也报告过该基准测试中</text><text x="228.00 232.00 237.98 240.79 245.05 250.42 255.69 259.56 262.19 268.16 272.42 278.27 287.21 293.18 297.05 299.68 302.49 308.51 311.12 316.49 321.76 325.63 328.44 334.29 340.13" y="693.80" font-size="10.00" class="sc-loraregular">“direct prompt injection”</text><text x="343.62 353.62 363.62 373.62 383.62 393.62 403.62 413.62 423.62 433.62 443.62 453.62 463.62 473.62 483.62 493.62 503.62 513.62 523.62" y="693.80" font-size="10.00" class="sc-notoserifcjksc">（直接提示词注入）子集的结果。直接提示</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="708.00" font-size="10.00" class="sc-notoserifcjksc">词注入涉及恶意用户，而本节关注的是劫持用户原始意图的第三方威胁，因此我们在此不再纳入该子集。</text><a href="https://grayswan.ai" rel="noopener"><rect x="162.89" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="162.89" y="391.50" width="24.43" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="187.32" y="391.50" width="2.89" height="11.00" fill="transparent"/></a><a href="https://grayswan.ai" rel="noopener"><rect x="190.22" y="391.50" width="27.24" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/" rel="noopener"><rect x="253.35" y="391.50" width="0.00" height="11.00" fill="transpa .93 311.83 314.73 319.82 326.39 332.18 337.98 343.94 349.04 354.13 357.02 361.71 367.31 371.56" y="496.98" font-size="11.00" class="sc-loraregular">attack success rate</text><text x="377.52" y="496.98" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="388.52 395.41 401.65" y="496.98" font-size="11.00" class="sc-loraregular">ASR</text><text x="408.56 419.56" y="496.98" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="433.45 439.41 442.12 448.30" y="496.98" font-size="11.00" class="sc-loraregular">4.8%</text><text x="457.87 468.87 479.87" y="496.98" font-size="11.00" class="sc-notoserifcjksc">，优于</text><text x="493.76 501.45 504.44 510.05 516.62 523.20" y="496.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="512.60" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="512.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="164.70 171.05 173.76 177.76" y="512.60" font-size="11.00" class="sc-loraregular">6.1%</text><text x="187.33 198.33" y="512.60" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="212.23 219.92 222.91 228.52 235.09 241.66 247.63 250.52 259.25 265.82 272.39 277.48 280.37 286.34 289.04" y="512.60" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="295.22" y="512.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="306.22 312.41 315.00 321.36" y="512.60" font-size="11.00" class="sc-loraregular">9.6%</text><text x="330.93 341.93 352.93 363.93 374.93 385.93 396.93" y="512.60" font-size="11.00" class="sc-notoserifcjksc">）。三个模型在</text><text x="410.82 416.73 422.44" y="512.60" font-size="11.00" class="sc-loraregular">k=1</text><text x="429.34 440.34 451.34 462.34 473.34 484.34 495.34 506.34 517.34 528.34" y="512.60" font-size="11.00" class="sc-notoserifcjksc">时的攻击成功概率均为</text><text x="72.00 78.65 81.36 85.36" y="528.22" font-size="11.00" class="sc-loraregular">0.1%</text><text x="94.93" y="528.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="562.32" font-size="11.00" class="sc-notoserifcjksc">数个版本以来，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44" y="562.32" font-size="11.00" class="sc-loraregular">Claude</text><text x="187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="562.32" font-size="11.00" class="sc-notoserifcjksc">模型在该基准测试上的表现一直处于或接近最高水平，而我们尚未找到一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="577.94" font-size="11.00" class="sc-notoserifcjksc">个能够在所有模型和提供商之间进行公平比较的合适替代基准。为与以往的系统卡保持一致，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="593.56" font-size="11.00" class="sc-notoserifcjksc">们继续报告该基准测试，同时正在投入构建更强的自适应评估。这些评估虽然无法在不同提供商</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="609.18" font-size="11.00" class="sc-notoserifcjksc">之间直接比较，但使我们能够跟踪各</text><text x="250.89 258.58 261.57 267.18 273.75 280.33" y="609.18" font-size="11.00" class="sc-loraregular">Claude</text></svg></div>

.09023</text><text x="525.63" y="717.26" font-size="10.00" class="sc-loraregular">.</text><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00 80.37 83.75 91.21 94.59" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.2.2</text><text x="105.15 118.15 131.15 144.15 157.15 170.15 183.15 196.15 209.15 222.15 235.15 248.15 261.15 274.15 287.15 300.15" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">跨使用场景对自适应攻击者的鲁棒性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">评估提示词注入鲁棒性时的一个常见误区是依赖静态基准。</text><text x="358.00" y="111.37" font-size="6.60" class="sc-loraregular">9</text><text x="361.81 372.81 383.81 394.81 405.81 416.81 427.81 438.81 449.81 460.81 471.81 482.81 493.81 504.81 515.81 526.81" y="115.03" font-size="11.00" class="sc-notoserifcjksc">由已知攻击构成的固定数据集可能带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">来虚假的安全感，因为模型可能在应对既有攻击模式时表现良好，却仍易受新颖方法的攻击。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.27" font-size="11.00" class="sc-notoserifcjksc">们继续在内部以及与外部研究合作伙伴合作，投入于能更好地模拟真实世界对手能力的自适应评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">估。本节中的评估衡量模型对基于与模型交互而不断改进攻击的对手的鲁棒性。这些评估体现了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="177.51" font-size="11.00" class="sc-notoserifcjksc">一种刻意宽松的威胁模型：攻击者直接针对测试场景进行优化，并且每个场景可进行多次尝试。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="193.13" font-size="11.00" class="sc-notoserifcjksc">真实世界的攻击者通常不具备这两种可用手段，因为他们不知道目标部署情况，且重复尝试会增</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="208.75" font-size="11.00" class="sc-notoserifcjksc">加被发现的几率。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="309.34" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71 115.71" y="309.34" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00 83.00 94.00 105.00" y="341.72" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 127.26 131.95 137.52 143.32 146.22 152.40 161.10 166.78" y="341.72" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35 275.35 286.35" y="341.72" font-size="11.00" class="sc-notoserifcjksc">的外部自适应红队测试（</text><text x="297.35 302.03 307.94 314.52 319.90 324.15 330.09 335.77 345.60 348.69 355.37" y="341.72" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="361.45 372.45 383.45" y="341.72" font-size="11.00" class="sc-notoserifcjksc">）工具</text><text x="397.35 403.58 410.17 415.85 422.43" y="341.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="428.39 439.39 450.39 461.39 472.39 483.39 494.39 505.39 516.39 527.39" y="341.72" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在编</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="357.34" font-size="11.00" class="sc-notoserifcjksc">程环境中对提示词注入的鲁棒性。</text><text x="237.00 243.24 249.83 255.50 262.08" y="357.34" font-size="11.00" class="sc-loraregular">Shade</text><text x="270.93 281.93 292.93 303.93 314.93 325.93 336.93 347.93 358.93 369.93 380.93 391.93 402.93" y="357.34" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="413.93 418.62 424.58 427.67 434.35 438.01 444.45 449.14 454.93 460.89 470.73 476.69 483.27" y="357.34" font-size="11.00" class="sc-loraregular">reinforcement</text><text x="72.00 74.99 80.93 86.61 91.37 98.05 101.14 107.82" y="372.96" font-size="11.00" class="sc-loraregular">learning</text><text x="113.90 124.90 135.90 146.90 157.90 168.90 179.90 190.90 201.90 212.90 223.90 234.90 245.90 256.90 267.90 278.90 289.90 300.90 311.90 322.90 333.90 344.90 355.90 366.90 377.90 388.90 399.90 410.90 421.90 432.90 443.90 454.90 465.90 476.90 487.90 498.90 509.90 520.90" y="372.96" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，迭代地提升利用模型漏洞的能力。攻击者先在一组先前模型上针</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="388.58" font-size="11.00" class="sc-notoserifcjksc">对测试用例进行优化，然后在相同场景上迁移到最新模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="438.88" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的攻击成功率：该攻击者在</text><text x="305.89 311.86" y="438.88" font-size="11.00" class="sc-loraregular">40</text><text x="321.58 332.58 343.58 354.58 365.58 376.58 387.58 398.58 409.58 420.58 431.58 442.58 453.58 464.58 475.58 486.58 497.58 508.58" y="438.88" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，然后在相同场景上进行评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="454.50" font-size="11.00" class="sc-notoserifcjksc">估。对于每个场景，攻击者有</text><text x="217.89 223.80 230.63" y="454.50" font-size="11.00" class="sc-loraregular">200</text><text x="240.36 251.36 262.36 273.36 284.36 295.36 306.36 317.36 328.36 339.36 350.36 361.36 372.36 383.36 394.36 405.36 416.36 427.36 438.36 449.36 460.36 471.36 482.36 493.36 504.36 515.35 526.35" y="454.50" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。我们报告成功尝试的总体百分比，以及至少有一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="470.12" font-size="11.00" class="sc-notoserifcjksc">次成功尝试的场景数量。</text><a href="https://arxiv.org/abs/2510.09023" rel="noopener"><rect x="367.96" y="707.20" width="157.67" height="12.80" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="332.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="397.35" y="332.92" width="31.04" height="11.00" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">绝对攻击成功率较低且测试用例数量较少，对模型之间的微小差异应谨慎解读。</text><text x="72.00 77.94 80.50 86.37 88.93 94.79 97.36" y="131.19" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41 117.41 128.41 139.41 150.41" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部自适应评估，用于衡量使用浏览器能力的产品的鲁棒性，例如</text><text x="470.89 478.58 481.57 487.18 493.75 500.33 506.29 509.18 512.28" y="163.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude in</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="179.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chrome</text><text x="116.09 127.09 138.09 149.09" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">扩展程序</text><text x="160.09" y="179.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="173.98 181.67 184.66 190.27 196.84 203.42 209.38 212.27 219.96 226.29 234.96 241.40 246.12" y="179.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="252.03 263.03 274.03 285.03 296.03 307.03 318.03 329.03 340.03" y="179.19" font-size="11.00" class="sc-notoserifcjksc">。我们最初是在发布</text><text x="353.92 361.61 364.60 370.21 376.78 383.35 389.32 392.21 400.94 407.51 414.08 419.17 422.06 428.03 430.73" y="179.19" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="439.62 450.62" y="179.19" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="464.51 472.20 475.19 480.80 487.37 493.95 499.91 502.80 506.47 512.90" y="179.19" font-size="11.00" class="sc-loraregular">Claude for</text><text x="72.00 79.69 86.28 90.96 97.40 107.23" y="194.81" font-size="11.00" class="sc-loraregular">Chrome</text><text x="116.09 127.09 138.09 149.09 160.09 171.09 182.09 193.09 204.09 215.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc">扩展程序本身时推出了</text><text x="226.09 237.09 248.09 259.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这项评估</text><text x="270.09 281.09 292.09 303.09 314.09 325.09 336.09 347.09 358.09 369.09 380.09 391.09 402.09 413.09 424.09 435.09 446.09 457.09 468.09 479.09 490.09 501.09 512.09 523.09" y="194.81" font-size="11.00" class="sc-notoserifcjksc">；由于后续模型已使早期的测试攻击集饱和，我们定期</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">以更复杂的环境和更强的攻击对其进行更新。当前的评估包含</text><text x="371.89 375.90 381.80" y="210.43" font-size="11.00" class="sc-loraregular">129</text><text x="391.06 402.06 413.06 424.06 435.06 446.06 457.06 468.06 479.06 490.06 501.06 512.06 523.06" y="210.43" font-size="11.00" class="sc-notoserifcjksc">个精选环境，这些环境在训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">期间从未出现过，并包含随后会通过
