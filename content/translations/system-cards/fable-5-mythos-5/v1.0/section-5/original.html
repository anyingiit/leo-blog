lass="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施</text><text x="187.75" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功于</text><text x="187.75" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="246.25" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="308.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">有安全防护措施</text><text x="308.50" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功于</text><text x="308.50" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="367.00" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="428.50" y="88.42" font-size="10.81" class="sc-notoserifcjkscbold" fill="#ffffff">更新后的安全防护措施</text><text x="428.50" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">攻击成功于</text><text x="428.50" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="484.75" y="142.48" font-size="10.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="424.35" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="424.35" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="424.35" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="424.35" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员在浏览器使用环境中实施提示词注入攻击的攻击成功率</text><text x="396.10" y="424.35" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="513.10" y="424.35" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="531.10" y="424.35" font-size="9.00" class="sc-notoserifcjksc">标</text><text x="72.00" y="436.05" font-size="9.00" class="sc-notoserifcjksc">出，次优分数以下划线标出（但未考虑误差范围）。攻击者在每个场景中进行</text><text x="380.37" y="436.05" font-size="9.00" class="sc-loraregular">10</text><text x="391.60" y="436.05" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝</text><text x="72.00" y="447.75" font-size="9.00" class="sc-notoserifcjksc">试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="503.16" font-size="11.00" class="sc-notoserifcjksc">在浏览器使用环境中，我们当前部署的安全防护措施大幅提升了</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 431.12 436.98 441.24 447.83 454.26 459.35 462.25" y="503.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="471.14" y="503.16" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性，将</text><text x="72.00" y="518.78" font-size="11.00" class="sc-notoserifcjksc">攻击成功率（按尝试计）从</text><text x="206.89 212.80 218.98 221.34 226.41" y="518.78" font-size="11.00" class="sc-loraregular">29.7%</text><text x="238.87" y="518.78" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="263.76" y="518.78" font-size="11.00" class="sc-loraregular">6.5%</text><text x="288.39" y="518.78" font-size="11.00" class="sc-notoserifcjksc">。在同等安全防护措施下，这一结果仍落后于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="534.40" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="191.99" y="534.40" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="202.99 208.89 211.44 218.27" y="534.40" font-size="11.00" class="sc-loraregular">2.0%</text><text x="227.84" y="534.40" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="252.73 260.42 263.41 269.02 275.59 282.17 288.13 291.02 299.76 306.32 312.89 317.98 320.88 326.84 329.54" y="534.40" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="335.73" y="534.40" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="346.73 353.38 356.09 362.08" y="534.40" font-size="11.00" class="sc-loraregular">0.5%</text><text x="371.65" y="534.40" font-size="11.00" class="sc-notoserifcjksc">）。为此，我们开发了一套更新后</text><text x="72.00" y="550.02" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施，将</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96" y="550.02" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="223.84" y="550.02" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率降至</text><text x="314.74" y="550.02" font-size="11.00" class="sc-loraregular">0%</text><text x="331.14" y="550.02" font-size="11.00" class="sc-notoserifcjksc">，在全部</text><text x="378.03" y="550.02" font-size="11.00" class="sc-loraregular">129</text><text x="397.19" y="550.02" font-size="11.00" class="sc-notoserifcjksc">个场景中均无成功攻击，并在</text><text x="72.00" y="565.64" font-size="11.00" class="sc-notoserifcjksc">所有受测模型上带来了类似的改进。我们计划在各产品端部署这些更新后的安全防护措施。</text><text x="72.00" y="632.69" font-size="11.00" class="sc-notoserifcjksc">我们将继续通过针对性攻击发现来研究特定于模型的漏洞，并在尽量减少延迟以及对正常使用的</text><text x="72.00" y="648.31" font-size="11.00" class="sc-notoserifcjksc">干扰的同时，提升安全防护措施的鲁棒性。</text></svg></div>
