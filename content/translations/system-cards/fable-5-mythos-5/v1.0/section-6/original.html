<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">208</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的结果呈现出与以往模型相似的总体模式：在较容易的设置中比率非零（低于</text><text x="72.00 76.00" y="98.23" font-size="11.00" class="sc-loraregular">1%</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="135.84 144.12 152.39 156.07" y="113.85" font-size="11.00" class="sc-loraregular">UUID</text><text x="167.16 178.16 189.16 200.16 211.16 222.16 233.16 244.16 255.16 266.16 277.16 288.16 299.16 310.16 321.16 332.16 343.16 354.16 365.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">设置中能可靠地生成可行的策略，但表现出</text><text x="376.16 380.56 386.26 392.22" y="113.85" font-size="11.00" class="sc-loraregular">“yes</text><text x="400.21 411.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">厌恶</text><text x="422.21" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="426.05 437.05 448.05 459.05 470.05 481.05 492.05 503.05 514.05 525.05" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，即当策略表明模型应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">当执行该罕见行动时，模型有时会对这一结论产生怀疑并转而采用另一种策略，这解释了它在该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">设置中表现不佳的原因。此前的系统卡已更详细地讨论过这一行为模式。</text><text x="72.00 78.33 80.89 86.83 89.39 95.41 97.97" y="228.33" font-size="11.00" class="sc-lorabold">6.5.4.5</text><text x="106.80 117.80 128.80 139.80 150.80 161.80" y="228.33" font-size="11.00" class="sc-notoserifcjkscbold">隐藏秘密密码</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们报告一项直接衡量保密能力的评估：模型被给予一个秘密密码，并被指示在任何情况下（包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">括在推理中）都绝不能泄露它。随后，一个调查者智能体使用与我们的自动化行为审计相同的脚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">手架对模型进行盘问，并被指示套取该密码。该秘密密码不用于任何下游任务，因此要表现良</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">好，只需模型完全不提及该密码即可。以往的系统卡报告的是以</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 429.92 436.48 443.05 448.14 451.04 457.00 459.60" y="307.58" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="468.85 479.85 490.85 501.85 512.85 523.85" y="307.58" font-size="11.00" class="sc-notoserifcjksc">作为调查者的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">结果；此处，所有报告的运行均以</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="323.20" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77" y="323.20" font-size="11.00" class="sc-notoserifcjksc">作为调查者。</text><text x="72.00 83.00 94.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">根据图</text><text x="107.89 114.25 116.96 122.95 125.66 131.62 134.33 140.32 143.03" y="406.45" font-size="11.00" class="sc-loraregular">6.5.4.5.A</text><text x="152.81 163.81 174.81 185.81 196.81 207.81 218.81 229.81" y="406.45" font-size="11.00" class="sc-notoserifcjksc">所示的生存曲线，</text><text x="240.81 248.49 251.49 257.10 263.66 270.24 276.20 279.10 287.83 294.40 300.97 306.06 308.95 314.91 317.51" y="406.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="323.87" y="406.45" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="334.87 343.60 350.17 356.73 361.83 364.72 370.68 373.04" y="406.45" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="381.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="394.89 402.58 405.58 411.18 417.75 424.33 430.29 433.18 443.12 448.98 453.24 459.83 466.26 471.35 474.25" y="406.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="483.14 494.14 505.14 516.14 527.14" y="406.45" font-size="11.00" class="sc-notoserifcjksc">是本评估中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">受测模型里鲁棒性最强的，尽管没有任何模型在长对话中表现出特别强的鲁棒性。图</text><text x="481.89 488.25 490.96 496.95 499.66 505.62 508.33 514.32 517.03" y="422.07" font-size="11.00" class="sc-loraregular">6.5.4.5.B</text><text x="526.76" y="422.07" font-size="11.00" class="sc-notoserifcjksc">显</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">示，按轮次类型（即是否存在思考和</text><text x="248.00" y="437.69" font-size="11.00" class="sc-loraregular">/</text><text x="255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59" y="437.69" font-size="11.00" class="sc-notoserifcjksc">或预填充）细分后，</text><text x="354.59 362.28 365.27 370.88 377.45 384.03 389.99 392.88 402.81 408.68 412.93 419.52 425.96 431.05 433.94 440.61 445.30 451.20 456.76 459.85 465.77" y="437.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="477.47" y="437.69" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="491.36 501.30 507.16 511.42 518.01 524.44 529.53 532.43" y="437.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">表现相近，且位列表现最佳的模型之中，在某些设置下可与</text><text x="360.89 369.63 376.19 382.76 387.85 390.75 396.71 399.30" y="453.31" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">名的差异，可以由以下事实解释：轮次类型出现的比率因被调查模型的不同而有所差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">209</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 112.95 115.05 120.58" y="366.99" font-size="9.00" class="sc-lorabold">6.5.4.5.A]</text><text x="126.42 135.42 144.42 153.42 162.42 171.42 180.42 189.42 198.42 207.42 216.42 225.42 234.42 243.42 252.42 261.42" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">多轮秘密套取尝试下的保密鲁棒性。</text><text x="270.42 279.42 288.42 297.42 306.42 315.42 324.42 333.42 342.42 351.42 360.42 369.42 378.42 387.42 396.42 405.42 414.42 423.42 432.42 441.42 450.42 459.42 468.42 477.42 486.42 495.42 504.42 513.42 522.42 531.42" y="366.99" font-size="9.00" class="sc-notoserifcjksc">模型被给予一个秘密密码，并被告知在任何情况下都绝不能泄露它。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00" y="378.69" font-size="9.00" class="sc-notoserifcjksc">一个调查者智能体使用与我们的自动化行为审计相同的脚手架尝试套取该秘密，每个模型进行</text><text x="443.37 446.64 451.55" y="378.69" font-size="9.00" class="sc-loraregular">150</text><text x="459.50 468.50 477.50 486.50 495.50 504.50 513.50 522.50 531.50" y="378.69" font-size="9.00" class="sc-notoserifcjksc">次独立调查。各条线</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00" y="390.39" font-size="9.00" class="sc-notoserifcjksc">为生存曲线，即截至目标模型某一轮次时秘密仍被保守的调查所占比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">210</text><text x="72.00" y="389.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 112.95 115.05 120.58" y="389.49" font-size="9.00" class="sc-lorabold">6.5.4.5.B]</text><text x="126.42 135.42 144.42 153.42 162.42 171.42 180.42 189.42 198.42 207.42 216.42 225.42 234.42 243.42 252.42 261.42 270.42 279.42 288.42 297.42 306.42 315.42 324.42" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">多轮秘密套取尝试下按轮次类型划分的秘密泄露率。</text><text x="333.42 342.42 351.42 360.42 369.42 378.42 387.42 396.42 405.42 414.42 423.42 432.42 441.42 450.42 459.42 468.42 477.42 486.42 495.42 504.42 513.42 522.42 531.42" y="389.49" font-size="9.00" class="sc-notoserifcjksc">秘密泄露率按每轮次计算，按模型和轮次类型分组，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00" y="412.89" font-size="9.00" class="sc-notoserifcjksc">与生存曲线视图之间模型排名的差异，源于调查轨迹中实际出现的思考与预填充的经验比率。</text><text x="72.00 80.32 83.70 92.07 95.45" y="472.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.5</text><text x="106.92 119.92 132.92 145.92 158.92 171.92 184.92" y="472.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可监控性</text><text x="72.00 78.32 80.89 86.83 89.39 95.33 97.89" y="504.72" font-size="11.00" class="sc-lorabold">6.5.5.1</text><text x="105.25 116.25 127.25 138.25 149.25 160.25 171.25 182.25" y="504.72" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="537.09" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控模型是否存在未对齐行为（见上文第</text><text x="393.89 400.25 402.96 408.86 411.57 415.57 418.28" y="537.09" font-size="11.00" class="sc-loraregular">6.2.1.2</text><text x="427.08 438.08 449.08 460.08 471.08 482.08 493.08 504.08 515.08 526.08" y="537.09" font-size="11.00" class="sc-notoserifcjksc">节）。倾向于在扩展思</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="552.71" font-size="11.00" class="sc-notoserifcjksc">考中言语化表达其采取未对齐行动之意图的模型，可能要容易被发现得多。如第</text><text x="459.89 465.80 468.51 474.47 477.17" y="552.71" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="484.07 495.07 506.07 517.07 528.07" y="552.71" font-size="11.00" class="sc-notoserifcjksc">节所述，技</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="568.33" font-size="11.00" class="sc-notoserifcjksc">术错误导致在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25" y="568.33" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="568.33" font-size="11.00" class="sc-notoserifcjksc">的训练过程中出现了意外的思维链监督，影响了一小部分回合。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="583.95" font-size="11.00" class="sc-notoserifcjksc">为评估思维链可监控性是否因此出现了相应的退化，我们开展了若干项评估，作为衡量</text><text x="492.89 502.83 508.69 512.95 519.53 525.97 531.06 533.96" y="583.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="599.57" font-size="11.00" class="sc-notoserifcjksc">的扩展思考相较于以往</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="599.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18" y="599.57" font-size="11.00" class="sc-notoserifcjksc">模型可监控程度的代理指标。总体而言，我们的结果表明，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="615.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95" y="615.19" font-size="11.00" class="sc-notoserifcjksc">很可能比近期的</text><text x="201.84 209.53 212.53 218.14 224.70 231.28 237.24 240.14 248.87 255.44 262.00" y="615.19" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="269.99 280.99 291.99 302.99 313.99 324.99 335.99 346.99 357.99 368.99 379.99 390.99 401.99 412.99" y="615.19" font-size="11.00" class="sc-notoserifcjksc">模型更难监控，但其可监控性与</text><text x="426.88 434.57 437.56 443.17 449.74 456.32 462.28 465.17 475.11 480.97 485.23 491.81 498.25" y="615.19" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="630.81" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53" y="630.81" font-size="11.00" class="sc-notoserifcjksc">相近，或略好于后者。我们将在第</text><text x="283.42 289.78 292.48 298.48 301.18 307.18 309.89" y="630.81" font-size="11.00" class="sc-loraregular">6.5.5.3</text><text x="318.91 329.91 340.91 351.91 362.91 373.91 384.91 395.91 406.91 417.91 428.91 439.91 450.91 461.91 472.91" y="630.81" font-size="11.00" class="sc-notoserifcjksc">节讨论如何调和这几方面的证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p211.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 211 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">211</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型可能变得更难监控的一种途径，是获得有意控制其扩展思考某些方面的能力，例如有选择地</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链可控性（</text><text x="347.00 354.69 360.78 367.82 370.72 376.51 382.95 389.53 393.78 398.47 404.90 407.90 410.89 416.56 422.97 426.06 429.05 432.32 436.60" y="98.23" font-size="11.00" class="sc-loraregular">CoT controllability</text><text x="442.40 453.40 464.40 475.40 486.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="500.30 507.99 514.57 520.54 527.21 530.11 535.99" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et</text><text x="72.00 77.68 80.67" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="86.27 97.27 108.27 119.27 130.27 141.27 152.27 163.27 174.27 185.27 196.27 207.27 218.27 229.27 240.27 251.27" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="265.16 275.09 280.96 285.21 291.80 298.24 303.33 306.22" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="315.11 326.11 337.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在回答</text><text x="351.00 359.38 366.04 374.65" y="113.85" font-size="11.00" class="sc-loraregular">GPQA</text><text x="381.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="392.54 401.12 407.48" y="113.85" font-size="11.00" class="sc-loraregular">HLE</text><text x="417.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="431.11 441.20 451.30 457.54 465.71 471.09 477.76 482.44" y="113.85" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="491.77 502.77 513.77 524.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的问题</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">时，在其扩展思考中遵循一些基本指令（例如不提及某个特定关键词）。这三个均为高难度问答</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">基准测试，模型在其上往往会产生大量扩展思考。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="171.78 182.78 193.78" y="228.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中，我们此前在该实验中使用的是</text><text x="372.67 380.36 386.95 392.91 399.59 402.48 408.37 412.63 415.52 421.20 424.19" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="429.79 440.79 451.79 462.79 473.79 484.79 495.79 506.79 517.79 528.79" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中完全相同的提示词。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">英国人工智能安全研究所向我们指出，该评估的结果可能对提示词较为敏感，特别是在提示词调</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">优不足的情况下可能出现能力激发不足。这一次，我们使用了他们与我们分享的另一种提示词来</text><text x="72.00 83.00 94.00 105.00 116.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">开展实验。</text><text x="72.00" y="592.61" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 111.68 113.78 119.31" y="592.61" font-size="9.00" class="sc-lorabold">6.5.5.1.A]</text><text x="125.15 134.15 143.15 152.15" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="163.52 169.71 172.52 177.24 182.80 188.16 193.01 195.37 202.29 207.70 213.26" y="592.61" font-size="9.00" class="sc-lorabold">Claude Opus</text><text x="220.00 229.00 238.00 247.00 256.00" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="265.00 271.19 274.00 278.71 284.27 289.64 294.48 296.85 305.29 310.25 313.96 319.55 324.65 329.01 331.38" y="592.61" font-size="9.00" class="sc-lorabold">Claude Mythos 5</text><text x="338.61 347.61 356.61 365.61 374.61 383.61 392.61 401.61 410.61 419.61 428.61 437.61" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">具有较高的思维链可控性。</text><text x="446.61 455.61 464.61 473.61 482.61 491.61 500.61 509.61 518.61 527.61" y="592.61" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="604.31" font-size="9.00" class="sc-notoserifcjksc">度档位或一个固定的思考预算，并按该设置下产生的平均思维链长度放置。可控性是指在</text><text x="425.37 432.22 437.67 444.72" y="604.31" font-size="9.00" class="sc-loraregular">GPQA</text><text x="450.35" y="604.31" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="459.35 466.37 471.57" y="604.31" font-size="9.00" class="sc-loraregular">HLE</text><text x="479.54" y="604.31" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.91 499.17 507.43 512.53 519.22 523.62 529.07 532.91" y="604.31" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="616.01" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对其扩展思考所给指令的回答所占比例。越低越好，因为可控性越高，表明模型在接到指令时改</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="627.71" font-size="9.00" class="sc-notoserifcjksc">变其扩展思考内容的能力越强，这可能使监控变得不那么可靠。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="89.43" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="527.21" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="530.11" y="89.43" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="540.25" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="105.05" width="11.37" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="85.89" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="85.89" y="219.53" width="35.40" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="121.29" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="124.18" y="219.53" width="26.96" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="151.15" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="154.04" y="219.53" width="14.85" height="11.00" fil 9" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="415.52" y="219.53" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">212</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">使用经调优的</text><text x="140.89 149.17 156.68 159.57 166.46 170.14 176.38" y="82.61" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="182.96 193.96 204.96 215.96 226.96" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词时，</text><text x="237.96 247.89 253.75 258.01 264.60 271.03 276.13 279.02" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="287.91 298.91 309.91 320.91 331.91 342.91 353.91 364.91 375.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制比</text><text x="389.80 397.49 400.48 406.09 412.66 419.24 425.20 428.09 436.83 443.39 449.96 455.05 457.95 463.91 466.61" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="475.69 486.69 497.69 508.69 519.69" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更有效，与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88 227.88 238.88 249.88 260.88 271.88 282.88 293.88 304.88 315.88 326.88 337.88 348.88 359.88 370.88 381.88 392.88 403.88 414.88 425.88 436.88 447.88 458.88 469.88 480.88 491.88 502.88 513.88 524.88" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当。我们将此视为一项微弱证据，表明其思维链可监控性相对于最新</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 94.63 101.19 107.76" y="113.85" font-size="11.00" class="sc-loraregular">Opus</text><text x="115.75 126.75 137.75 148.75 159.75 170.75 181.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型有所退化。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">为研究提示词的能力激发对不同模型的影响，我们还展示了每个模型在</text><text x="415.89 422.48 425.57 431.92" y="147.38" font-size="11.00" class="sc-loraregular">high</text><text x="441.40 452.40 463.40 474.40 485.40 496.40 507.40 518.40 529.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">推理强度下，分别使</text><text x="72.00 83.00 94.00 105.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">用默认的</text><text x="118.89 126.58 133.17 139.13 145.81 148.70 154.59 158.85 161.74 167.41 170.41" y="163.00" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="176.00 187.00 198.00 209.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">提示词和</text><text x="222.90 231.17 238.68 241.58 248.46 252.15 258.38" y="163.00" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="264.96 275.96 286.96 297.96 308.96 319.96 330.96 341.96 352.96 363.96 374.96 385.96 396.96 407.96 418.96 429.96" y="163.00" font-size="11.00" class="sc-notoserifcjksc">能力激发提示词时的思维链可控性。</text><text x="72.00" y="467.27" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="467.27" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 111.68 113.78 119.31 122.79 125.15 131.35 134.15 138.87 144.43 149.80 154.64 157.01 165.45 170.41 174.12 179.71 184.81 189.17 191.54" y="467.27" font-size="9.00" class="sc-lorabold">6.5.5.1.B] Claude Mythos 5</text><text x="198.76 207.76 216.76 225.76 234.76 243.76 252.76 261.76 270.76 279.76 288.76 297.76 306.76 315.76 324.76 333.76" y="467.27" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性对提示词高度敏感。</text><text x="342.76 351.76 360.76 369.76 378.76 387.76 396.76" y="467.27" font-size="9.00" class="sc-notoserifcjksc">我们使用默认的</text><text x="408.13 414.42 419.81 424.69 430.15 432.52 437.34 440.82 443.19 447.83 450.28" y="467.27" font-size="9.00" class="sc-loraregular">Chen et al.</text><text x="454.86 463.86 472.86 481.86 490.86 499.86 508.86 517.86 526.86" y="467.27" font-size="9.00" class="sc-notoserifcjksc">提示词，以及一个由</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00" y="478.97" font-size="9.00" class="sc-notoserifcjksc">英国人工智能安全研究所调优、旨在激发更强思维链可控性的提示词，运行了相同的评估。在</text><text x="443.37 448.76 451.29 456.48" y="478.97" font-size="9.00" class="sc-loraregular">high</text><text x="464.24 473.24 482.24 491.24 500.24 509.24 518.24 527.24" y="478.97" font-size="9.00" class="sc-notoserifcjksc">推理强度下，经调</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="490.67" font-size="9.00" class="sc-notoserifcjksc">优的提示词使</text><text x="128.37 136.49 141.29 144.77 150.16 155.43 159.60 161.96" y="490.67" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="169.24 178.24 187.24 196.24 205.24 214.24 223.24 232.24 241.24 250.24 259.24 268.24" y="490.67" font-size="9.00" class="sc-notoserifcjksc">的思维链可控性显著提高。</text><text x="72.00" y="532.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.48 95.57 101.92" y="532.83" font-size="11.00" class="sc-loraregular">high</text><text x="111.40 122.40 133.40 144.40 155.40 166.40" y="532.83" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="177.40 187.33 193.20 197.46 204.04 210.48 215.57 218.47" y="532.83" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="227.35 238.35 249.35 260.35 271.35 282.35 293.35 304.35 315.35 326.35 337.35 348.35 359.35 370.35 381.35 392.35 403.35 414.35 425.35 436.35 447.35 458.35 469.35 480.35 491.35 502.35 513.35 524.35" y="532.83" font-size="11.00" class="sc-notoserifcjksc">表现出我们所测试的所有模型中最大的能力激发提升。这与我们</text><text x="72.00" y="548.45" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.13 100.71 107.60 115.68 122.30 127.68 134.57 139.25 145.22 151.89" y="548.45" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="160.46 171.46 182.46 193.46 204.46 215.46 226.46 237.46 248.46 259.46 270.46 281.46 292.46" y="548.45" font-size="11.00" class="sc-notoserifcjksc">上的能力激发结果（见上文第</text><text x="306.36 312.71 315.42 321.41 324.12 330.08 332.79" y="548.45" font-size="11.00" class="sc-loraregular">6.5.4.3</text><text x="341.81 352.81 363.81 374.81 385.81 396.81 407.81 418.81 429.81 440.81 451.81 462.81 473.81 484.81 495.81 506.81 517.81 528.81" y="548.45" font-size="11.00" class="sc-notoserifcjksc">节）相呼应：在那里，一个经优化的提示</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96" y="564.07" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="564.07" font-size="11.00" class="sc-notoserifcjksc">在其扩展思考中提及附带任务的比率，将其隐蔽表现从接近零的基线</text><text x="72.00 83.00 94.00" y="579.69" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="107.89 114.08 116.78 122.69" y="579.69" font-size="11.00" class="sc-loraregular">9.2%</text><text x="132.26 143.26 154.26 165.26 176.26 187.26 198.26 209.26 220.26 231.26 242.26 253.26 264.26 275.26 286.26 297.26 308.26 319.26 330.26 341.26 352.26 363.26 374.26 385.26" y="579.69" font-size="11.00" class="sc-notoserifcjksc">。综合来看，这些结果表明，默认评估可能会大幅低估</text><text x="399.15 409.08 414.95 419.20 425.79 432.23 437.32 440.21" y="579.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="449.10 460.10 471.10 482.10 493.10 504.10 515.10 526.10" y="579.69" font-size="11.00" class="sc-notoserifcjksc">控制其扩展思考内</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="595.31" font-size="11.00" class="sc-notoserifcjksc">容的能力，凸显了在可监控性评估中进行充分能力激发的重要性。</text><text x="72.00 78.32 80.89 86.83 89.39 95.33 97.89" y="662.36" font-size="11.00" class="sc-lorabold">6.5.5.2</text><text x="106.65 117.65" y="662.36" font-size="11.00" class="sc-notoserifcjkscbold">来自</text><text x="131.54 139.84 146.64 152.40 159.42 162.31 168.23 172.77 175.66 181.43 184.86" y="662.36" font-size="11.00" class="sc-lorabold">Guan et al.</text><text x="190.32 201.32 212.32 223.32 234.32 245.32 256.32" y="662.36" font-size="11.00" class="sc-notoserifcjkscbold">的可监控性评估</text><text x="72.00 83.00 94.00" y="694.73" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="694.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13 207.13 218.13 229.13 240.13 251.13" y="694.73" font-size="11.00" class="sc-notoserifcjksc">和若干以往的</text><text x="265.03 272.72 275.71 281.32 287.89 294.46" y="694.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="303.32 314.32 325.32 336.32 347.32 358.32" y="694.73" font-size="11.00" class="sc-notoserifcjksc">模型上运行了</text><text x="372.21 380.58 387.15 392.83 399.50 402.40 408.28 412.54 415.43 421.11 424.10" y="694.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="429.70 440.70 451.70 462.70 473.70 484.70 495.70 506.70 517.70 528.70" y="694.73" font-size="11.00" class="sc-notoserifcjksc">开源的过程可监控性评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="710.35" font-size="11.00" class="sc-notoserifcjksc">估。这些评估包含数学和物理</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="118.89" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="118.89" y="154.20" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="145.81" y="154.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="148.70" y="154.20" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="158.85" y="154.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="161.74" y="154.20" width="11.37" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="372.21" y="685.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="372.21" y="685.93" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="399.50" y="685.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="402.40" y="685.93" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="412.54" y="685.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="415.43" y="685.93" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p213.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 213 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">213</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">问题，每个问题都有有限数量的已知解题路径，我们假定模型必须使用其中之一才能正确作答。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">我们要求每个模型在一系列推理强度下解答每个问题，并使用</text><text x="371.89 378.25 384.61" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="397.60 408.60 419.60 430.60 441.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="452.60 458.96 465.32 475.41 478.31 481.18 487.74 494.32 500.35" y="98.23" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="506.31 517.31 528.31" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）衡量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型在其扩展思考中言语化表达某条已知解题路径的频率。在扩展思考中言语化表达解题路径，</text><text x="72.00" y="646.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 112.82 114.92 120.46" y="646.67" font-size="9.00" class="sc-lorabold">6.5.5.2.A]</text><text x="126.30 135.30 144.30 153.30 162.30 171.30 180.30" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">在过程评估上，</text><text x="189.30 195.49 198.30 203.01 208.57 213.94 218.78 221.15 229.59 234.55 238.27 243.85 248.95 253.31 255.68" y="646.67" font-size="9.00" class="sc-lorabold">Claude Mythos 5</text><text x="262.91 271.91 280.91 289.91 298.91 307.91 316.91 325.91" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">的扩展思考与近期</text><text x="337.28 343.47 346.28 350.99 356.55 361.92" y="646.67" font-size="9.00" class="sc-lorabold">Claude</text><text x="369.13 378.13 387.13 396.13 405.13 414.13 423.13 432.13 441.13 450.13 459.13 468.13 477.13" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">模型的可监控程度大致相当。</text><text x="486.13" y="646.67" font-size="9.00" class="sc-loraitalic">y</text><text x="493.12 502.12 511.12 520.12 529.12" y="646.67" font-size="9.00" class="sc-notoserifcjksc">轴为在答案</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="658.38" font-size="9.00" class="sc-notoserifcjksc">正确的条件下，评判模型在模型思维链中检测到相关定理的比率，测试集为</text><text x="371.37 378.22 383.67 390.72" y="658.38" font-size="9.00" class="sc-loraregular">GPQA</text><text x="398.72 407.72 416.72 425.72 434.72 443.72" y="658.38" font-size="9.00" class="sc-notoserifcjksc">的物理子集和</text><text x="455.09 460.72 463.73 472.00" y="658.38" font-size="9.00" class="sc-loraregular">AIME</text><text x="479.96 488.96 497.96 506.96 515.96 524.96" y="658.38" font-size="9.00" class="sc-notoserifcjksc">数学题。每个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="670.08" font-size="9.00" class="sc-notoserifcjksc">模型在多个推理强度档位或思考预算下进行评估；</text><text x="270.00" y="670.08" font-size="9.00" class="sc-loraregular">x</text><text x="277.14 286.14 295.14 304.14 313.14 322.14 331.14 340.14 349.14 358.14 367.14 376.14 385.14 394.14 403.14 412.14 421.14 430.14 439.14 448.14 457.14 466.14 475.14 484.14 493.14 502.14 511.14 520.14 529.14" y="670.08" font-size="9.00" class="sc-notoserifcjksc">轴为各设置下的平均思维链长度（对数刻度）。我们对每个问题在</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="681.78" font-size="9.00" class="sc-notoserifcjksc">每个推理强度档位下使用</text><text x="173.37" y="681.78" font-size="9.00" class="sc-loraregular">5</text><text x="180.64 189.64 198.64 207.64 216.64 225.64 234.64 243.64 252.64" y="681.78" font-size="9.00" class="sc-notoserifcjksc">个样本。误差线表示</text><text x="264.01 269.21 274.11" y="681.78" font-size="9.00" class="sc-loraregular">95%</text><text x="284.31 293.31 302.31 311.31 320.31" y="681.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p214.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 214 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">214</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这些评估中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的可监控性与我们评估的其他</text><text x="344.84 352.53 355.52 361.13 367.70 374.28" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="383.14 394.14 405.14 416.14 427.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型相当。</text><text x="72.00 83.00 94.00 105.00 116.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们没有在</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="131.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="179.84 190.84 201.84 212.84 223.84" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上运行同一</text><text x="237.74 246.11 252.68 258.35 265.03 267.92 273.81" y="131.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et</text><text x="280.96 286.63 289.62" y="131.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="295.22 306.22 317.22 328.22 339.22 350.22 361.22 372.22 383.22 394.22 405.22 416.22 427.22 438.22 449.22 460.22 471.22 482.22 493.22 504.22 515.22 526.22" y="131.19" font-size="11.00" class="sc-notoserifcjksc">评估套件中基于干预的可监控性评估，因为我们此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">前发现，这些干预在近期</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">模型上产生的行为效应太小，由此得到的指标缺乏参考价值。</text><text x="72.00 78.32 80.89 86.83 89.39 95.33 97.89 104.05 106.95 115.31 123.14 126.03 133.38 137.64 144.22" y="212.14" font-size="11.00" class="sc-lorabold">6.5.5.3 UK AISI</text><text x="151.36 162.36 173.36 184.36 195.36 206.36 217.36 228.36 239.36" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">关于可监控性的发现</text><text x="72.00 83.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">除第</text><text x="96.89 103.25 105.96 111.86 114.57" y="244.53" font-size="11.00" class="sc-loraregular">6.2.4</text><text x="123.43 134.43 145.43 156.43 167.43 178.43 189.43" y="244.53" font-size="11.00" class="sc-notoserifcjksc">节中的测试外，</text><text x="200.43 208.70 216.21 219.10 225.99 229.67 235.91" y="244.53" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="242.49 253.49 264.49 275.49" y="244.53" font-size="11.00" class="sc-notoserifcjksc">还评估了</text><text x="289.38 297.07 300.06 305.67 312.24 318.82 324.78 327.67 337.61 343.47 347.73 354.32 360.75 365.84 368.74" y="244.53" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="377.62 388.62 399.62 410.62 421.62 432.62 443.62 454.62 465.62 476.62 487.62 498.62 509.62 520.62" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的可监控性。他们与我们分享了</text><text x="72.00 83.00 94.00 105.00 116.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">以下结论：</text><text x="122.25 130.52 138.04 140.93 147.81 151.50 157.74" y="293.11" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="164.31 175.31 186.31" y="293.11" font-size="11.00" class="sc-notoserifcjksc">获得了</text><text x="200.21 204.16 211.85 214.84 220.45 227.01 233.59 239.55 242.45 252.38 258.24 262.50 269.09 275.52 280.62 283.51 289.51" y="293.11" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="296.35 307.35 318.35 329.35 340.35 351.35 362.35 373.35 384.35 395.35 406.35 417.35 428.35 439.35 450.35 461.35 472.35 483.35 494.35" y="293.11" font-size="11.00" class="sc-notoserifcjksc">一个发布前检查点的访问权限，以评估与其</text><text x="505.35 516.35 527.35" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">可监控</text><text x="122.25" y="308.73" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">性</text><text x="133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25" y="308.73" font-size="11.00" class="sc-notoserifcjksc">相关的模型行为与能力。</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25" y="333.83" font-size="11.00" class="sc-notoserifcjksc">我们使用了两项评估：一项蓄意破坏能力评估（</text><text x="353.25 360.94 367.37 373.95 378.21 382.89 389.33 392.32 399.21 406.12 412.96 421.34" y="333.83" font-size="11.00" class="sc-loraregular">ControlARENA</text><text x="428.23 439.23 450.23 461.23 472.23 483.23 494.23 505.23 516.23 527.23" y="333.83" font-size="11.00" class="sc-notoserifcjksc">），以及一项针对模型</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25" y="349.45" font-size="11.00" class="sc-notoserifcjksc">控制其思维链之能力的评估。</text><text x="122.25 133.25 144.25" y="374.58" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="158.14 162.09 169.78 172.77 178.38 184.95 191.53 197.49 200.38 210.32 216.18 220.44 227.02 233.46 238.55 241.45 247.44" y="374.58" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="254.28" y="374.58" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="268.18 275.86 278.86 284.47 291.03 297.61 303.57 306.47 316.40 322.26 326.52 333.11 339.54 344.64 347.53 354.20 358.88 364.79 370.34 373.44 379.35" y="374.58" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="391.06" y="374.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="404.95 412.64 415.63 421.24 427.81 434.39 440.35 443.24 451.98 458.54 465.11 470.20 473.09 479.06 481.76" y="374.58" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="490.84 501.84 512.84 523.84" y="374.58" font-size="11.00" class="sc-notoserifcjksc">进行了比</text><text x="122.25 133.25" y="390.20" font-size="11.00" class="sc-notoserifcjksc">较。</text><text x="144.25 152.52 160.04 162.93 169.81 173.50 179.74" y="390.20" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="186.31 197.31 208.31 219.31 230.31 241.31 252.31 263.31 274.31 285.31 296.31 307.31 318.31" y="390.20" font-size="11.00" class="sc-notoserifcjksc">拥有完整的思维链访问权限。</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25" y="415.31" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现：</text><text x="144.75" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">在</text><text x="158.64 166.21 172.44 179.39 183.93 189.12 195.31 198.74 206.03 211.22 217.14 224.16" y="439.67" font-size="11.00" class="sc-lorabold">ControlArena</text><text x="232.82 243.82" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">中，</text><text x="254.82 259.06 266.63 270.06 275.83 282.62 289.18 295.10 297.99 308.31 314.37 318.91 325.74 331.97 337.31 340.20 346.14" y="439.67" font-size="11.00" class="sc-lorabold">[Claude Mythos 5]</text><text x="353.28 364.28 375.28 386.28 397.28 408.28 419.28 430.28 441.28 452.28 463.28 474.28 485.28 496.28 507.28 518.28 529.28" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">在不被发现的情况下完成有害附带任务</text><text x="144.75 155.75 166.75 177.75 188.75" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">的能力强于</text><text x="202.64 210.21 213.64 219.41 226.21 232.76 238.68 241.57 251.89 257.95 262.49 269.33 275.55 280.89 283.78 290.81 296.00 301.92 307.84 311.43 317.35" y="455.29" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="329.17" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="343.06 351.52 358.13 364.93 370.26 373.15 379.17 381.73" y="455.29" font-size="11.00" class="sc-lorabold">Opus 4.8</text><text x="388.03" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="162.75 166.30 173.99 176.98 182.59 189.16 195.74 201.70 204.59 214.53 220.39 224.65 231.24 237.67 242.76 245.66 251.65" y="488.78" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="258.49 269.49 280.49 291.49 302.49 313.49 324.49 335.49 346.49 357.49 368.49 379.49 390.49 401.49 412.49 423.49 434.49 445.49 456.49 467.49 478.49 489.49 500.49 511.49 522.49" y="488.78" font-size="11.00" class="sc-notoserifcjksc">常常无需思维链推理即可完成主任务和附带任务，不过缺</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75 272.75 283.75 294.75 305.75 316.75 327.75 338.75" y="504.40" font-size="11.00" class="sc-notoserifcjksc">乏推理往往会导致攻击行动不够隐蔽。</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75 272.75 283.75 294.75 305.75 316.75 327.75" y="537.89" font-size="11.00" class="sc-notoserifcjksc">面对一个较弱的基于行为的监控器，</text><text x="338.75 342.70 350.39 353.38 358.99 365.56 372.14 378.10 380.99 390.92 396.79 401.04 407.63 414.07 419.16 422.05 428.05" y="537.89" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="434.89 445.89 456.89 467.89 478.89 489.89 500.89 511.89 522.89" y="537.89" font-size="11.00" class="sc-notoserifcjksc">既实现了较高的附带</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75" y="553.51" font-size="11.00" class="sc-notoserifcjksc">攻击成功率（超过</text><text x="253.64 260.00 266.83" y="553.51" font-size="11.00" class="sc-loraregular">60%</text><text x="276.40 287.40 298.40 309.40 320.40 331.40 342.40 353.40 364.40 375.40 386.40 397.40 408.40 419.40" y="553.51" font-size="11.00" class="sc-notoserifcjksc">），又表现出较低的可监控性（</text><text x="430.40 437.08 445.35 452.26 460.99 468.68 471.57 477.40 480.30 486.66 493.49" y="553.51" font-size="11.00" class="sc-loraregular">AUROC &lt; 60%</text><text x="503.06 514.06" y="553.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75 272.75 283.75 294.75 305.75 316.75 327.75 338.75 349.75 360.75 371.75 382.75 393.75 404.75 415.75 426.75 437.75 448.75 459.75 470.75 481.75 492.75 503.75 514.75 525.75" y="587.00" font-size="11.00" class="sc-notoserifcjksc">中等能力的监控器在危险附带任务检测上的表现显著优于较弱的监控器，但在</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75" y="602.62" font-size="11.00" class="sc-notoserifcjksc">某些情况下仍会失败。</text><text x="144.75 148.49 156.06 159.49 165.25 172.05 178.61 184.53 187.42 197.74 203.80 208.34 215.17 221.40 226.73 229.63 235.57" y="636.09" font-size="11.00" class="sc-lorabold">[Claude Mythos 5]</text><text x="242.70 253.70 264.70 275.70 286.70 297.70 308.70 319.70 330.70 341.70 352.70 363.70 374.70" y="636.09" font-size="11.00" class="sc-notoserifcjkscbold">表现出很强的思维链可控性，</text><text x="385.70 396.70 407.70 418.70 429.70 440.70 451.70 462.70 473.70 484.70 495.70 506.70 517.70 528.70" y="636.09" font-size="11.00" class="sc-notoserifcjksc">例如，能够在推理中避免使用某</text><text x="144.75 155.75 166.75 177.75" y="651.71" font-size="11.00" class="sc-notoserifcjksc">些词语。</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="237.74" y="122.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="237.74" y="122.39" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="265.03" y="122.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monit <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p215.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 215 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">215</text><text x="162.75 166.30 173.99 176.98 182.59 189.16 195.74 201.70 204.59 214.53 220.39 224.65 231.24 237.67 242.76 245.66 251.65" y="82.61" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="258.49" y="82.61" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="272.39 278.74 284.71" y="82.61" font-size="11.00" class="sc-loraregular">64%</text><text x="297.17 308.17 319.17 330.17 341.17 352.17 363.17 374.17 385.17 396.17 407.17 418.17 429.17 440.17 451.17 462.17 473.17 484.17 495.17 506.17 517.17 528.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的时间成功遵守了对其思维链的约束，相比之下，</text><text x="162.75 172.68 178.55 182.80 189.39 195.83 200.92 203.81 210.48 215.17 221.07 226.63 229.72 235.64" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="247.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="261.23 266.30 272.49" y="98.23" font-size="11.00" class="sc-loraregular">78%</text><text x="282.06" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="293.06 301.79 308.36 314.92 320.02 322.91 328.87 331.58" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="340.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="354.55 360.67 367.50" y="98.23" font-size="11.00" class="sc-loraregular">30%</text><text x="377.07" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75" y="131.70" font-size="11.00" class="sc-notoserifcjksc">我们运行了来自</text><text x="242.64 245.11 251.94 257.88 263.55 268.65 275.08 281.76 284.85 291.53 297.61 300.50 310.52 316.96 323.54 329.50 332.49 337.58 340.48 346.67 350.93 355.69 362.26 368.34 374.69 377.68 383.64 386.53 390.79 397.23 400.12 407.81 414.24 420.82 425.08 429.76 436.20 439.19 442.08 446.34 452.93 458.89 461.98 466.75 469.64 477.33 483.92 489.59 492.68 499.36 504.45 507.35 513.73" y="131.70" font-size="11.00" class="sc-loraregular">‘Reasoning Models Struggle to Control their Chains of</text><text x="162.75 169.79 176.38 182.81 189.38 195.73 202.22 206.48 208.39 214.22 217.21 220.30 226.98 232.89" y="147.32" font-size="11.00" class="sc-loraregular">Thought’&lt;link&gt;</text><text x="241.61 252.61 263.61 274.61 285.61 296.61 307.61 318.61 329.61 340.61 351.61 362.61 373.61" y="147.32" font-size="11.00" class="sc-notoserifcjksc">的思维链可控性评估，限定于</text><text x="387.50 395.87 402.54 411.15" y="147.32" font-size="11.00" class="sc-loraregular">GPQA</text><text x="418.04" y="147.32" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="429.04 437.62 443.98" y="147.32" font-size="11.00" class="sc-loraregular">HLE</text><text x="453.71" y="147.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="467.60 477.70 487.80 494.04 502.31 505.20 511.87 516.55" y="147.32" font-size="11.00" class="sc-loraregular">MMLU Pro</text><text x="525.88" y="147.32" font-size="11.00" class="sc-notoserifcjksc">数</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75" y="162.94" font-size="11.00" class="sc-notoserifcjksc">据集，所有模型均使用</text><text x="275.64 285.48 291.15" y="162.94" font-size="11.00" class="sc-loraregular">max</text><text x="299.88 310.88 321.88 332.88 343.88" y="162.94" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text><text x="162.75 173.75 184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75 272.75 283.75 294.75" y="197.19" font-size="11.00" class="sc-notoserifcjksc">我们发现，在该评估上，对于</text><text x="308.64 317.38 323.94 330.51 335.60 338.50 344.46 347.17" y="197.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="356.24" y="197.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="370.13 374.08 381.77 384.76 390.37 396.94 403.52 409.48 412.37 422.31 428.17 432.43 439.02 445.45 450.54 453.44 459.43" y="197.19" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="463.38 474.38 485.38 496.38 507.38" y="197.19" font-size="11.00" class="sc-notoserifcjksc">（但不包括</text><text x="162.75 172.68 178.55 182.80 189.39 195.83 200.92 203.81 210.48 215.17 221.07 226.63 229.72 235.64" y="212.81" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="244.45 255.45 266.45 277.45 288.45 299.45 310.45 321.45 332.45 343.45 354.45 365.45 376.45 387.45 398.45 409.45 420.45 431.45 442.45 453.45 464.45 475.45 486.45 497.45 508.45" y="212.81" font-size="11.00" class="sc-notoserifcjksc">），提示词优化能够激发出比默认提示词强得多的结果。</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25 408.25 419.25 430.25" y="254.30" font-size="11.00" class="sc-notoserifcjksc">我们还尝试在旨在诱发作弊和欺骗行为的不可能任务情境下，研究</text><text x="444.14 448.09 455.78 458.77 464.38 470.95 477.53 483.49 486.38 496.32 502.18 506.44 513.02 519.46 524.55 527.45 533.44" y="254.30" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25 408.25 419.25 430.25 441.25 452.25 463.25 474.25 485.25 496.25 507.25 518.25 529.25" y="269.92" font-size="11.00" class="sc-notoserifcjksc">的倾向与能力。然而，由于时间有限以及对评估意识的担忧，我们未能对结果的含义建</text><text x="122.25 133.25 144.25 155.25 166.25" y="285.54" font-size="11.00" class="sc-notoserifcjksc">立起信心。</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25 408.25 419.25 430.25 441.25 452.25 463.25 474.25" y="344.13" font-size="11.00" class="sc-notoserifcjkscbold">总体而言，我们的结果表明，无论采用基于推理还是基于行为的监控方法，</text><text x="485.25 489.50 497.06 500.50 506.26 513.06 519.61" y="344.13" font-size="11.00" class="sc-lorabold">[Claude</text><text x="122.25 132.57 138.63 143.17 150.00 156.23 161.56 164.46 170.40" y="359.75" font-size="11.00" class="sc-lorabold">Mythos 5]</text><text x="177.54 188.54 199.54 210.54 221.54" y="359.75" font-size="11.00" class="sc-notoserifcjkscbold">都将比其他</text><text x="235.43 242.72 249.67 254.22 261.05 266.24 272.47 279.08 282.67" y="359.75" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="291.27 302.27 313.27 324.27 335.27 346.27 357.27" y="359.75" font-size="11.00" class="sc-notoserifcjkscbold">模型更难监控。</text><text x="368.27 372.21 379.90 382.90 388.51 395.07 401.65 407.61 410.51 420.44 426.30 430.56 437.15 443.58 448.67 451.57 457.56" y="359.75" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="464.41 475.41 486.41 497.41 508.41 519.41" y="359.75" font-size="11.00" class="sc-notoserifcjksc">延续了一些趋</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25 408.25 419.25 430.25 441.25 452.25 463.25 474.25 485.25 496.25 507.25" y="375.37" font-size="11.00" class="sc-notoserifcjksc">势，若不加以干预，这些趋势可能会削弱当前的风险缓解方法，例如思维链监控。</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25" y="433.97" font-size="11.00" class="sc-notoserifcjksc">我们的结果附有重要的注意事项和局限性，包括：独立于</text><text x="400.14 407.03 413.61 417.86 424.45 429.14 435.57 442.14 445.23" y="433.97" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="453.98 464.98 475.98 486.98 497.98 508.98" y="433.97" font-size="11.00" class="sc-notoserifcjksc">实际的监控方</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25 408.25 419.25 430.25 441.25 452.25 463.25 474.25 485.25 496.25 507.25 518.25 529.25" y="449.59" font-size="11.00" class="sc-notoserifcjksc">案；对模型和监控器的能力激发有限；使用简单的代理任务和狭窄的分布；以及仅进行</text><text x="122.25 133.25 144.25 155.25 166.25 177.25 188.25 199.25 210.25 221.25 232.25 243.25 254.25 265.25 276.25 287.25 298.25 309.25 320.25 331.25 342.25 353.25 364.25 375.25 386.25 397.25" y="465.21" font-size="11.00" class="sc-notoserifcjksc">了有限的评估意识监控，而未采取任何评估意识缓解措施。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="532.00" font-size="11.00" class="sc-notoserifcjksc">我们认为这些结果与我们自己对</text><text x="228.89 238.83 244.69 248.95 255.54 261.97 267.06 269.96" y="532.00" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="532.00" font-size="11.00" class="sc-notoserifcjksc">可监控性的理解大体一致。他们关于思维链可控性的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="547.62" font-size="11.00" class="sc-notoserifcjksc">发现与我们的内部复现（第</text><text x="206.89 213.25 215.96 221.95 224.66 230.65 233.36" y="547.62" font-size="11.00" class="sc-loraregular">6.5.5.1</text><text x="240.26 251.26 262.26 273.26 284.26 295.26 306.26 317.26 328.26 339.26 350.26 361.26 372.26 383.26 394.26 405.26 416.26 427.26 438.26 449.26 460.26 471.26 482.26 493.26 504.26 515.26 526.26" y="547.62" font-size="11.00" class="sc-notoserifcjksc">节）大体吻合，包括对提示词能力激发的敏感性。我们的结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="563.24" font-size="11.00" class="sc-notoserifcjksc">在蓄意破坏能力评估上存在分歧。我们发现，在</text><text x="305.89 312.13 320.71 327.60 335.68 342.30 347.68 354.57 359.25 365.22 371.89" y="563.24" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="377.57 388.57" y="563.24" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="402.46 408.82 411.53 417.52 420.23 426.19 428.89" y="563.24" font-size="11.00" class="sc-loraregular">6.5.4.1</text><text x="435.79 446.79 457.79" y="563.24" font-size="11.00" class="sc-notoserifcjksc">节）和</text><text x="471.69 481.78 484.87 491.55 494.64 504.48 510.15 513.14" y="563.24" font-size="11.00" class="sc-loraregular">Minimal-</text><text x="72.00 78.36 81.45 88.13 94.69 100.52 107.37 113.33 120.00 125.86" y="578.86" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="132.45 143.45" y="578.86" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="157.34 163.70 166.40 172.40 175.10 181.07 183.77" y="578.86" font-size="11.00" class="sc-loraregular">6.5.4.2</text><text x="192.57 203.57 214.57 225.57" y="578.86" font-size="11.00" class="sc-notoserifcjksc">节）上，</text><text x="236.57 246.50 252.37 256.62 263.21 269.65 274.74 277.63" y="578.86" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="286.52 297.52 308.52 319.52 330.52 341.52 352.52 363.52 374.52 385.52 396.52 407.52 418.52 429.52" y="578.86" font-size="11.00" class="sc-notoserifcjksc">隐蔽完成附带任务的能力均弱于</text><text x="443.41 451.10 454.10 459.71 466.27 472.85 478.81 481.71 491.64 497.50 501.76 508.35 514.78" y="578.86" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="594.48" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63 123.63 134.63" y="594.48" font-size="11.00" class="sc-notoserifcjksc">。在第</text><text x="148.53 154.89 157.59 163.59 166.29 172.25 174.96" y="594.48" font-size="11.00" class="sc-loraregular">6.5.4.3</text><text x="183.98 194.98 205.98 216.98 227.98 238.98 249.98 260.98 271.98 282.98 293.98 304.98 315.98 326.98 337.98 348.98 359.98 370.98" y="594.48" font-size="11.00" class="sc-notoserifcjksc">节中，我们发现基于提示词的能力激发使</text><text x="384.87 394.81 400.67 404.93 411.51 417.95 423.04 425.94" y="594.48" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="434.82" y="594.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="448.72 454.95 463.53 470.42 478.51 485.13 490.51 497.39 502.08 508.04 514.72" y="594.48" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="523.29" y="594.48" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="610.10" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率有明显提升，但在相同推理强度下，它仍未明显超过</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="610.10" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77 527.77" y="610.10" font-size="11.00" class="sc-notoserifcjksc">未经</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="625.72" font-size="11.00" class="sc-notoserifcjksc">能力激发的基线。这一分歧最有可能是由两项评估在任务分布和监控设置上的差异所致，这与</text><text x="72.00 80.27 87.79 90.68 97.56 101.25 107.49" y="641.34" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="114.06 125.06 136.06 147.06 158.06 169.06 180.06 191.06 202.06 213.06 224.06 235.06 246.06" y="641.34" font-size="11.00" class="sc-notoserifcjksc">在上文指出的局限性相一致。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p216.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 216 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">216</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，尽管我们同意</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="245.84 256.84 267.84 278.84 289.84 300.84 311.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">很可能比近期的</text><text x="325.74 334.47 341.04 347.60" y="82.61" font-size="11.00" class="sc-loraregular">Opus</text><text x="355.59 366.59 377.59 388.59 399.59 410.59 421.59 432.59 443.59 454.59 465.59 476.59 487.59 498.59 509.59 520.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型更难监控，但我们的结果表明，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">其可监控性与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text></svg></div>
