sc-notoserifcjksc">排除在训练之外。我们在包括模型推理在内的完整轨迹上进行训练。我们还尝试了思维链蒸馏，</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">方法与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="307.58" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="193.78" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="226.78" y="307.58" font-size="11.00" class="sc-notoserifcjksc">中相同，得到的结果相近或略差。此处我们报告最佳的一次运</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">模型在其思维链推理中遵循一个严格的模板，不给讨论附带任务留下任何余地。</text><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="107.89" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="107.89" y="298.78" width="35.40" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="143.29" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="146.18" y="298.78" width="26.96" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="173.14" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="176.04" y="298.78" width="14.85" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="190.89" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="193.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="204.78" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="204.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="215.78" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="215.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p206.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 206 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">206</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.13 115.23 120.76 124.24 126.60 135.04 140.00 143.72 149.31 154.40 158.77 161.14" y="367.92" font-size="9.00" class="sc-lorabold">6.5.4.3.A] Mythos 5</text><text x="168.36" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="179.73 185.11 192.38 198.39 205.09 210.58 214.82 220.79 225.04 229.88 235.62" y="367.92" font-size="9.00" class="sc-lorabold">SHADE-Arena</text><text x="242.70" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">上的隐蔽成功率。</text><text x="314.70" y="367.92" font-size="9.00" class="sc-notoserifcjksc">我们展示了三种能力激发设置：默认系统提示词（基</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">只能看到智能体用户可见的输出，而看不到其推理。所有设置均以自适应</text><text x="362.37" y="391.33" font-size="9.00" class="sc-loraregular">max</text><text x="382.19" y="391.33" font-size="9.00" class="sc-notoserifcjksc">推理强度的扩展思考运行，并面对同一</text><text x="72.00" y="403.02" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="83.37 90.51 95.89 101.26 105.43 107.79 112.67 114.80" y="403.02" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="122.36" y="403.02" font-size="9.00" class="sc-notoserifcjksc">监控器。柱形显示</text><text x="196.73 201.37" y="403.02" font-size="9.00" class="sc-loraregular">24</text><text x="208.61" y="403.02" font-size="9.00" class="sc-notoserifcjksc">项任务上按任务计算的平均值，以及自助法</text><text x="381.98" y="403.02" font-size="9.00" class="sc-loraregular">95%</text><text x="402.28" y="403.02" font-size="9.00" class="sc-notoserifcjksc">置信区间；出错的尝试已排除。</text><text x="72.00" y="459.98" font-size="11.00" class="sc-notoserifcjksc">经过优化的提示词达到了</text><text x="195.89 202.07 204.78 210.69" y="459.98" font-size="11.00" class="sc-loraregular">9.2%</text><text x="223.15" y="459.98" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率，接近隐藏草稿区条件下</text><text x="391.04" y="459.98" font-size="11.00" class="sc-loraregular">14.4%</text><text x="422.14" y="459.98" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率；在隐藏草稿</text><text x="72.00" y="475.61" font-size="11.00" class="sc-notoserifcjksc">区条件下，模型可以私下推理，其思维链不会展示给监控器。该提示词起作用的方式并不是让模</text><text x="72.00" y="506.85" font-size="11.00" class="sc-notoserifcjksc">的原因。微调取得的效果较弱。其结果显著高于推理可见的基线，但未达到隐藏草稿区条件下的</text><text x="72.00" y="522.46" font-size="11.00" class="sc-notoserifcjksc">隐蔽率，并且会使模型更频繁地拒绝附带任务。</text><text x="72.00" y="589.50" font-size="11.00" class="sc-notoserifcjksc">总体而言，接近零的基线隐蔽率低估了</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25" y="589.50" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.14" y="589.50" font-size="11.00" class="sc-notoserifcjksc">的隐蔽能力：仅通过调整提示词即可实</text><text x="72.00" y="605.12" font-size="11.00" class="sc-notoserifcjksc">现可观的提升。然而，即便有了这一提升，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 329.22 335.09 339.34 345.93 352.37 357.46 360.35" y="605.12" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="369.24" y="605.12" font-size="11.00" class="sc-notoserifcjksc">也并未明显超过</text><text x="449.14 456.82 459.82 465.43 471.99 478.57 484.53 487.43 497.36 503.22 507.48 514.07 520.50" y="605.12" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="620.74" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="620.74" font-size="11.00" class="sc-notoserifcjksc">未经能力激发时的比率，而且其隐蔽成功集中在少数任务上，与以往模型的情况相同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="504.00 508.83 514.22" y="751.80" font-size="9.00" class="sc-loraregular">207</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">6.5.4.4</text><text x="106.88" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">有意极低频率地采取行动</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某项有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">发现），一种看似可行的策略可能是利用评估与部署之间的规模差异。为此，模型可以以一个非</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">小的部署前测试中则从不发生。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">为评估这一能力，我们对</text><text x="195.89 202.13 208.09 212.86 217.54 223.22 229.89 236.33 239.22 245.11 249.36 252.26 257.93 260.93 263.63 266.52 272.43 279.19 285.09" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="294.34" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中描述的评估进行了内部复现。在该评估中，我们</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">提示模型以指定的比率执行某个特定行动（例如在编程任务中使用名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="243.95" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49" y="243.95" font-size="11.00" class="sc-notoserifcjksc">的变量），并进行多</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">次重采样，以检验相关行为的实际观测比率。我们采用与此前</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 420.12 425.98 430.24 436.83 443.26 448.35 451.25 457.91 462.60 468.51 474.06 477.15 483.07" y="259.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="494.77" y="259.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="527.77" y="259.57" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">报告的相同设置，每种设置</text><text x="206.89 212.86 215.46 222.29 229.12" y="275.19" font-size="11.00" class="sc-loraregular">4,000</text><text x="238.86" y="275.19" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00" y="620.82" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.01 115.11 120.65" y="620.82" font-size="9.00" class="sc-lorabold">6.5.4.4.A]</text><text x="126.49" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，被指示以</text><text x="254.85" y="620.82" font-size="9.00" class="sc-lorabold">1%</text><text x="269.01" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">的频率采取某一罕见行动时，各模型采取该行动的比率。</text><text x="494.01" y="620.82" font-size="9.00" class="sc-notoserifcjksc">当提供显式</text><text x="72.00" y="632.52" font-size="9.00" class="sc-notoserifcjksc">随机性（通过</text><text x="128.37" y="632.52" font-size="9.00" class="sc-loraregular">UUID</text><text x="151.62" y="632.52" font-size="9.00" class="sc-notoserifcjksc">）或被提示生成一个随机字符串并据此做出决定（</text><text x="349.62 354.73 359.83 364.82" y="632.52" font-size="9.00" class="sc-loraregular">SSoT</text><text x="370.57" y="632.52" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结果。我们</text><text x="72.00" y="644.22" font-size="9.00" class="sc-notoserifcjksc">还测试了另外三种设置：不提供任何提示或随机性来源的基线设置、引导性较弱的策略提示，以及一个由不同提示词构</text><text x="452.37 457.24 459.38 464.97 470.56" y="655.92" font-size="9.00" class="sc-loraregular">4,000</text><text x="478.52" y="655.92" font-size="9.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93" y="667.62" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="144.20" y="667.62" font-size="9.00" class="sc-notoserifcjksc">并未明显优于以往模型。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="195.89" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="195.89" y="219.53" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="236.33" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="239.22" y="219.53" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="249.36" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="252.26" y="219.53" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.63" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="266.52" y="219.53" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="371.89" y="250.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="371.89" y="250.77" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="407.29" y="250.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="410.18" y="250.77" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="448.35" y="250.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="451.25" y="250.77" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="491.88" y="250.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="494.77" y="250.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="505.77" y="250.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="505.77" y="250.77" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="516.77" y="250.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="516.77" y="250.77" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">208</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的结果呈现出与以往模型相似的总体模式：在较容易的设置中比率非零（低于</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">1%</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="135.84" y="113.85" font-size="11.00" class="sc-loraregular">UUID</text><text x="167.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">设置中能可靠地生成可行的策略，但表现出</text><text x="376.16 380.56 386.26 392.22" y="113.85" font-size="11.00" class="sc-loraregular">“yes</text><text x="400.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">厌恶</text><text x="422.21" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="426.05" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，即当策略表明模型应</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">当执行该罕见行动时，模型有时会对这一结论产生怀疑并转而采用另一种策略，这解释了它在该</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">设置中表现不佳的原因。此前的系统卡已更详细地讨论过这一行为模式。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-lorabold">6.5.4.5</text><text x="106.80" y="228.33" font-size="11.00" class="sc-notoserifcjkscbold">隐藏秘密密码</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们报告一项直接衡量保密能力的评估：模型被给予一个秘密密码，并被指示在任何情况下（包</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">括在推理中）都绝不能泄露它。随后，一个调查者智能体使用与我们的自动化行为审计相同的脚</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">手架对模型进行盘问，并被指示套取该密码。该秘密密码不用于任何下游任务，因此要表现良</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">好，只需模型完全不提及该密码即可。以往的系统卡报告的是以</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 429.92 436.48 443.05 448.14 451.04 457.00 459.60" y="307.58" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="468.85" y="307.58" font-size="11.00" class="sc-notoserifcjksc">作为调查者的</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">结果；此处，所有报告的运行均以</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="323.20" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77" y="323.20" font-size="11.00" class="sc-notoserifcjksc">作为调查者。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">根据图</text><text x="107.89" y="406.45" font-size="11.00" class="sc-loraregular">6.5.4.5.A</text><text x="152.81" y="406.45" font-size="11.00" class="sc-notoserifcjksc">所示的生存曲线，</text><text x="240.81 248.49 251.49 257.10 263.66 270.24 276.20 279.10 287.83 294.40 300.97 306.06 308.95 314.91 317.51" y="406.45" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="323.87" y="406.45" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="334.87 343.60 350.17 356.73 361.83 364.72 370.68 373.04" y="406.45" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="381.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="394.89 402.58 405.58 411.18 417.75 424.33 430.29 433.18 443.12 448.98 453.24 459.83 466.26 471.35 474.25" y="406.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="483.14" y="406.45" font-size="11.00" class="sc-notoserifcjksc">是本评估中</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">受测模型里鲁棒性最强的，尽管没有任何模型在长对话中表现出特别强的鲁棒性。图</text><text x="481.89" y="422.07" font-size="11.00" class="sc-loraregular">6.5.4.5.B</text><text x="526.76" y="422.07" font-size="11.00" class="sc-notoserifcjksc">显</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">示，按轮次类型（即是否存在思考和</text><text x="248.00" y="437.69" font-size="11.00" class="sc-loraregular">/</text><text x="255.59" y="437.69" font-size="11.00" class="sc-notoserifcjksc">或预填充）细分后，</text><text x="354.59 362.28 365.27 370.88 377.45 384.03 389.99 392.88 402.81 408.68 412.93 419.52 425.96 431.05 433.94 440.61 445.30 451.20 456.76 459.85 465.77" y="437.69" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="477.47" y="437.69" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="491.36 501.30 507.16 511.42 518.01 524.44 529.53 532.43" y="437.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">表现相近，且位列表现最佳的模型之中，在某些设置下可与</text><text x="360.89 369.63 376.19 382.76 387.85 390.75 396.71 399.30" y="453.31" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="72.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">名的差异，可以由以下事实解释：轮次类型出现的比率因被调查模型的不同而有所差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">209</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 112.95 115.05 120.58" y="366.99" font-size="9.00" class="sc-lorabold">6.5.4.5.A]</text><text x="126.42" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">多轮秘密套取尝试下的保密鲁棒性。</text><text x="270.42" y="366.99" font-size="9.00" class="sc-notoserifcjksc">模型被给予一个秘密密码，并被告知在任何情况下都绝不能泄露它。</text><text x="72.00" y="378.69" font-size="9.00" class="sc-notoserifcjksc">一个调查者智能体使用与我们的自动化行为审计相同的脚手架尝试套取该秘密，每个模型进行</text><text x="443.37" y="378.69" font-size="9.00" class="sc-loraregular">150</text><text x="459.50" y="378.69" font-size="9.00" class="sc-notoserifcjksc">次独立调查。各条线</text><text x="72.00" y="390.39" font-size="9.00" class="sc-notoserifcjksc">为生存曲线，即截至目标模型某一轮次时秘密仍被保守的调查所占比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">210</text><text x="72.00" y="389.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 112.95 115.05 120.58" y="389.49" font-size="9.00" class="sc-lorabold">6.5.4.5.B]</text><text x="126.42" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">多轮秘密套取尝试下按轮次类型划分的秘密泄露率。</text><text x="333.42" y="389.49" font-size="9.00" class="sc-notoserifcjksc">秘密泄露率按每轮次计算，按模型和轮次类型分组，</text><text x="72.00" y="412.89" font-size="9.00" class="sc-notoserifcjksc">与生存曲线视图之间模型排名的差异，源于调查轨迹中实际出现的思考与预填充的经验比率。</text><text x="72.00" y="472.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.5</text><text x="106.92" y="472.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可监控性</text><text x="72.00" y="504.72" font-size="11.00" class="sc-lorabold">6.5.5.1</text><text x="105.25" y="504.72" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性评估</text><text x="72.00" y="537.09" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控模型是否存在未对齐行为（见上文第</text><text x="393.89" y="537.09" font-size="11.00" class="sc-loraregular">6.2.1.2</text><text x="427.08" y="537.09" font-size="11.00" class="sc-notoserifcjksc">节）。倾向于在扩展思</text><text x="72.00" y="552.71" font-size="11.00" class="sc-notoserifcjksc">考中言语化表达其采取未对齐行动之意图的模型，可能要容易被发现得多。如第</text><text x="459.89" y="552.71" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="484.07" y="552.71" font-size="11.00" class="sc-notoserifcjksc">节所述，技</text><text x="72.00" y="568.33" font-size="11.00" class="sc-notoserifcjksc">术错误导致在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25" y="568.33" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="229.14" y="568.33" font-size="11.00" class="sc-notoserifcjksc">的训练过程中出现了意外的思维链监督，影响了一小部分回合。</text><text x="72.00" y="583.95" font-size="11.00" class="sc-notoserifcjksc">为评估思维链可监控性是否因此出现了相应的退化，我们开展了若干项评估，作为衡量</text><text x="492.89 502.83 508.69 512.95 519.53 525.97 531.06 533.96" y="583.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="599.57" font-size="11.00" class="sc-notoserifcjksc">的扩展思考相较于以往</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="599.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="599.57" font-size="11.00" class="sc-notoserifcjksc">模型可监控程度的代理指标。总体而言，我们的结果表明，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="615.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="615.19" font-size="11.00" class="sc-notoserifcjksc">很可能比近期的</text><text x="201.84 209.53 212.53 218.14 224.70 231.28 237.24 240.14 248.87 255.44 262.00" y="615.19" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="269.99" y="615.19" font-size="11.00" class="sc-notoserifcjksc">模型更难监控，但其可监控性与</text><text x="426.88 434.57 437.56 443.17 449.74 456.32 462.28 465.17 475.11 480.97 485.23 491.81 498.25" y="615.19" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="630.81" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="630.81" font-size="11.00" class="sc-notoserifcjksc">相近，或略好于后者。我们将在第</text><text x="283.42" y="630.81" font-size="11.00" class="sc-loraregular">6.5.5.3</text><text x="318.91" y="630.81" font-size="11.00" class="sc-notoserifcjksc">节讨论如何调和这几方面的证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p211.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 211 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">211</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型可能变得更难监控的一种途径，是获得有意控制其扩展思考某些方面的能力，例如有选择地</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链可控性（</text><text x="347.00 354.69 360.78 367.82 370.72 376.51 382.95 389.53 393.78 398.47 404.90 407.90 410.89 416.56 422.97 426.06 429.05 432.32 436.60" y="98.23" font-size="11.00" class="sc-loraregular">CoT controllability</text><text x="442.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="500.30 507.99 514.57 520.54 527.21 530.11 535.99" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="86.27" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="265.16 275.09 280.96 285.21 291.80 298.24 303.33 306.22" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="315.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在回答</text><text x="351.00 359.38 366.04 374.65" y="113.85" font-size="11.00" class="sc-loraregular">GPQA</text><text x="381.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="392.54" y="113.85" font-size="11.00" class="sc-loraregular">HLE</text><text x="417.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="431.11 441.20 451.30 457.54 465.71 471.09 477.76 482.44" y="113.85" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="491.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的问题</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">时，在其扩展思考中遵循一些基本指令（例如不提及某个特定关键词）。这三个均为高难度问答</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">基准测试，模型在其上往往会产生大量扩展思考。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="171.78" y="228.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="204.78" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中，我们此前在该实验中使用的是</text><text x="372.67 380.36 386.95 392.91 399.59 402.48 408.37 412.63 415.52 421.20 424.19" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="429.79" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中完全相同的提示词。</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">英国人工智能安全研究所向我们指出，该评估的结果可能对提示词较为敏感，特别是在提示词调</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">优不足的情况下可能出现能力激发不足。这一次，我们使用了他们与我们分享的另一种提示词来</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">开展实验。</text><text x="72.00" y="592.61" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 111.68 113.78 119.31" y="592.61" font-size="9.00" class="sc-lorabold">6.5.5.1.A]</text><text x="125.15" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="163.52" y="592.61" font-size="9.00" class="sc-lorabold">Claude Opus</text><text x="220.00" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="265.00 271.19 274.00 278.71 284.27 289.64 294.48 296.85 305.29 310.25 313.96 319.55 324.65 329.01 331.38" y="592.61" font-size="9.00" class="sc-lorabold">Claude Mythos 5</text><text x="338.61" y="592.61" font-size="9.00" class="sc-notoserifcjkscbold">具有较高的思维链可控性。</text><text x="446.61" y="592.61" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强</text><text x="72.00" y="604.31" font-size="9.00" class="sc-notoserifcjksc">度档位或一个固定的思考预算，并按该设置下产生的平均思维链长度放置。可控性是指在</text><text x="425.37 432.22 437.67 444.72" y="604.31" font-size="9.00" class="sc-loraregular">GPQA</text><text x="450.35" y="604.31" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="459.35" y="604.31" font-size="9.00" class="sc-loraregular">HLE</text><text x="479.54" y="604.31" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.91 499.17 507.43 512.53 519.22 523.62 529.07 532.91" y="604.31" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00" y="616.01" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对其扩展思考所给指令的回答所占比例。越低越好，因为可控性越高，表明模型在接到指令时改</text><text x="72.00" y="627.71" font-size="9.00" class="sc-notoserifcjksc">变其扩展思考内容的能力越强，这可能使监控变得不那么可靠。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="89.43" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="527.21" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="530.11" y="89.43" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="540.25" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="105.05" width="11.37" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="85.89" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="85.89" y="219.53" width="35.40" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="121.29" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="124.18" y="219.53" width="26.96" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="151.15" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="154.04" y="219.53" width="14.85" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="168.89" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="171.78" y="219.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="182.78" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="182.78" y="219.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="193.78" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="193.78" y="219.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="372.67" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="372.67" y="219.53" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="399.59" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="402.48" y="219.53" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="412.63" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="415.52" y="219.53" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">212</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">使用经调优的</text><text x="140.89" y="82.61" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="182.96" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词时，</text><text x="237.96 247.89 253.75 258.01 264.60 271.03 276.13 279.02" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="287.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制比</text><text x="389.80 397.49 400.48 406.09 412.66 419.24 425.20 428.09 436.83 443.39 449.96 455.05 457.95 463.91 466.61" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="475.69" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更有效，与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当。我们将此视为一项微弱证据，表明其思维链可监控性相对于最新</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="113.85" font-size="11.00" class="sc-loraregular">Opus</text><text x="115.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型有所退化。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">为研究提示词的能力激发对不同模型的影响，我们还展示了每个模型在</text><text x="415.89 422.48 425.57 431.92" y="147.38" font-size="11.00" class="sc-loraregular">high</text><text x="441.40" y="147.38" font-size="11.00" class="sc-notoserifcjksc">推理强度下，分别使</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">用默认的</text><text x="118.89 126.58 133.17 139.13 145.81 148.70 154.59 158.85 161.74 167.41 170.41" y="163.00" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et al.</text><text x="176.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">提示词和</text><text x="222.90" y="163.00" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="264.96" y="163.00" font-size="11.00" class="sc-notoserifcjksc">能力激发提示词时的思维链可控性。</text><text x="72.00" y="467.27" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="467.27" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 111.68 113.78 119.31 122.79 125.15 131.35 134.15 138.87 144.43 149.80 154.64 157.01 165.45 170.41 174.12 179.71 184.81 189.17 191.54" y="467.27" font-size="9.00" class="sc-lorabold">6.5.5.1.B] Claude Mythos 5</text><text x="198.76" y="467.27" font-size="9.00" class="sc-notoserifcjkscbold">的思维链可控性对提示词高度敏感。</text><text x="342.76" y="467.27" font-size="9.00" class="sc-notoserifcjksc">我们使用默认的</text><text x="408.13 414.42 419.81 424.69 430.15 432.52 437.34 440.82 443.19 447.83 450.28" y="467.27" font-size="9.00" class="sc-loraregular">Chen et al.</text><text x="454.86" y="467.27" font-size="9.00" class="sc-notoserifcjksc">提示词，以及一个由</text><text x="72.00" y="478.97" font-size="9.00" class="sc-notoserifcjksc">英国人工智能安全研究所调优、旨在激发更强思维链可控性的提示词，运行了相同的评估。在</text><text x="443.37 448.76 451.29 456.48" y="478.97" font-size="9.00" class="sc-loraregular">high</text><text x="464.24" y="478.97" font-size="9.00" class="sc-notoserifcjksc">推理强度下，经调</text><text x="72.00" y="490.67" font-size="9.00" class="sc-notoserifcjksc">优的提示词使</text><text x="128.37 136.49 141.29 144.77 150.16 155.43 159.60 161.96" y="490.67" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="169.24" y="490.67" font-size="9.00" class="sc-notoserifcjksc">的思维链可控性显著提高。</text><text x="72.00" y="532.83" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.48 95.57 101.92" y="532.83" font-size="11.00" class="sc-loraregular">high</text><text x="111.40" y="532.83" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="177.40 187.33 193.20 197.46 204.04 210.48 215.57 218.47" y="532.83" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="227.35" y="532.83" font-size="11.00" class="sc-notoserifcjksc">表现出我们所测试的所有模型中最大的能力激发提升。这与我们</text><text x="72.00" y="548.45" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.13 100.71 107.60 115.68 122.30 127.68 134.57 139.25 145.22 151.89" y="548.45" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="160.46" y="548.45" font-size="11.00" class="sc-notoserifcjksc">上的能力激发结果（见上文第</text><text x="306.36" y="548.45" font-size="11.00" class="sc-loraregular">6.5.4.3</text><text x="341.81" y="548.45" font-size="11.00" class="sc-notoserifcjksc">节）相呼应：在那里，一个经优化的提示</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96" y="564.07" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="201.84" y="564.07" font-size="11.00" class="sc-notoserifcjksc">在其扩展思考中提及附带任务的比率，将其隐蔽表现从接近零的基线</text><text x="72.00" y="579.69" font-size="11.00" class="sc-notoserifcjksc">提高到</text><text x="107.89 114.08 116.78 122.69" y="579.69" font-size="11.00" class="sc-loraregular">9.2%</text><text x="132.26" y="579.69" font-size="11.00" class="sc-notoserifcjksc">。综合来看，这些结果表明，默认评估可能会大幅低估</text><text x="399.15 409.08 414.95 419.20 425.79 432.23 437.32 440.21" y="579.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="449.10" y="579.69" font-size="11.00" class="sc-notoserifcjksc">控制其扩展思考内</text><text x="72.00" y="595.31" font-size="11.00" class="sc-notoserifcjksc">容的能力，凸显了在可监控性评估中进行充分能力激发的重要性。</text><text x="72.00" y="662.36" font-size="11.00" class="sc-lorabold">6.5.5.2</text><text x="106.65" y="662.36" font-size="11.00" class="sc-notoserifcjkscbold">来自</text><text x="131.54" y="662.36" font-size="11.00" class="sc-lorabold">Guan et al.</text><text x="190.32" y="662.36" font-size="11.00" class="sc-notoserifcjkscbold">的可监控性评估</text><text x="72.00" y="694.73" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="694.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13" y="694.73" font-size="11.00" class="sc-notoserifcjksc">和若干以往的</text><text x="265.03 272.72 275.71 281.32 287.89 294.46" y="694.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="303.32" y="694.73" font-size="11.00" class="sc-notoserifcjksc">模型上运行了</text><text x="372.21 380.58 387.15 392.83 399.50 402.40 408.28 412.54 415.43 421.11 424.10" y="694.73" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et al.</text><text x="429.70" y="694.73" font-size="11.00" class="sc-notoserifcjksc">开源的过程可监控性评</text><text x="72.00" y="710.35" font-size="11.00" class="sc-notoserifcjksc">估。这些评估包含数学和物理</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="118.89" y="154.20" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="118.89" y="154.20" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="145.81" y="154.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="148.70" y="154.20" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="158.85" y="154.20" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="161.74" y="154.20" width="11.37" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="372.21" y="685.93" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="372.21" y="685.93" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="399.50" y="685.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="402.40" y="685.93" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="412.54" y="685.93" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="415.43" y="685.93" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p213.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 213 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">213</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">问题，每个问题都有有限数量的已知解题路径，我们假定模型必须使用其中之一才能正确作答。</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">我们要求每个模型在一系列推理强度下解答每个问题，并使用</text><text x="371.89" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="397.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="452.60 458.96 465.32 475.41 478.31 481.18 487.74 494.32 500.35" y="98.23" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="506.31" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）衡量</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型在其扩展思考中言语化表达某条已知解题路径的频率。在扩展思考中言语化表达解题路径，</text><text x="72.00" y="646.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.93 108.03 112.82 114.92 120.46" y="646.67" font-size="9.00" class="sc-lorabold">6.5.5.2.A]</text><text x="126.30" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">在过程评估上，</text><text x="189.30 195.49 198.30 203.01 208.57 213.94 218.78 221.15 229.59 234.55 238.27 243.85 248.95 253.31 255.68" y="646.67" font-size="9.00" class="sc-lorabold">Claude Mythos 5</text><text x="262.91" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">的扩展思考与近期</text><text x="337.28" y="646.67" font-size="9.00" class="sc-lorabold">Claude</text><text x="369.13" y="646.67" font-size="9.00" class="sc-notoserifcjkscbold">模型的可监控程度大致相当。</text><text x="486.13" y="646.67" font-size="9.00" class="sc-loraitalic">y</text><text x="493.12" y="646.67" font-size="9.00" class="sc-notoserifcjksc">轴为在答案</text><text x="72.00" y="658.38" font-size="9.00" class="sc-notoserifcjksc">正确的条件下，评判模型在模型思维链中检测到相关定理的比率，测试集为</text><text x="371.37 378.22 383.67 390.72" y="658.38" font-size="9.00" class="sc-loraregular">GPQA</text><text x="398.72" y="658.38" font-size="9.00" class="sc-notoserifcjksc">的物理子集和</text><text x="455.09" y="658.38" font-size="9.00" class="sc-loraregular">AIME</text><text x="479.96" y="658.38" font-size="9.00" class="sc-notoserifcjksc">数学题。每个</text><text x="72.00" y="670.08" font-size="9.00" class="sc-notoserifcjksc">模型在多个推理强度档位或思考预算下进行评估；</text><text x="270.00" y="670.08" font-size="9.00" class="sc-loraregular">x</text><text x="277.14" y="670.08" font-size="9.00" class="sc-notoserifcjksc">轴为各设置下的平均思维链长度（对数刻度）。我们对每个问题在</text><text x="72.00" y="681.78" font-size="9.00" class="sc-notoserifcjksc">每个推理强度档位下使用</text><text x="173.37" y="681.78" font-size="9.00" class="sc-loraregular">5</text><text x="180.64" y="681.78" font-size="9.00" class="sc-notoserifcjksc">个样本。误差线表示</text><text x="264.01" y="681.78" font-size="9.00" class="sc-loraregular">95%</text><text x="284.31" y="681.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p214.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 214 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">214</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在这些评估中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="198.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的可监控性与我们评估的其他</text><text x="344.84 352.53 355.52 361.13 367.70 374.28" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="383.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型相当。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们没有在</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="131.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="179.84" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上运行同一</text><text x="237.74 246.11 252.68 258.35 265.03 267.92 273.81" y="131.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">Guan et</text><text x="280.96" y="131.19" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="295.22" y="131.19" font-size="11.00" class="sc-notoserifcjksc">评估套件中基于干预的可监控性评估，因为我们此</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">前发现，这些干预在近期</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">模型上产生的行为效应太小，由此得到的指标缺乏参考价值。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-lorabold">6.5.5.3 UK AISI</text><text x="151.36" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">关于可监控性的发现</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">除第</text><text x="96.89" y="244.53" font-size="11.00" class="sc-loraregular">6.2.4</text><text x="123.43" y="244.53" font-size="11.00" class="sc-notoserifcjksc">节中的测试外，</text><text x="200.43" y="244.53" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="242.49" y="244.53" font-size="11.00" class="sc-notoserifcjksc">还评估了</text><text x="289.38 297.07 300.06 305.67 312.24 318.82 324.78 327.67 337.61 343.47 347.73 354.32 360.75 365.84 368.74" y="244.53" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="377.62" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的可监控性。他们与我们分享了</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">以下结论：</text><text x="122.25" y="293.11" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="164.31" y="293.11" font-size="11.00" class="sc-notoserifcjksc">获得了</text><text x="200.21 204.16 211.85 214.84 220.45 227.01 233.59 239.55 242.45 252.38 258.24 262.50 269.09 275.52 280.62 283.51 289.51" y="293.11" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="296.35" y="293.11" font-size="11.00" class="sc-notoserifcjksc">一个发布前检查点的访问权限，以评估与其</text><text x="505.35" y="293.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">可监控</text><text x="122.25" y="308.73" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">性</text><text x="133.25" y="308.73" font-size="11.00" class="sc-notoserifcjksc">相关的模型行为与能力。</text><text x="122.25" y="333.83" font-size="11.00" class="sc-notoserifcjksc">我们使用了两项评估：一项蓄意破坏能力评估（</text><text x="353.25 360.94 367.37 373.95 378.21 382.89 389.33 392.32 399.21 406.12 412.96 421.34" y="333.83" font-size="11.00" class="sc-loraregular">ControlARENA</text><text x="428.23" y="333.83" font-size="11.00" class="sc-notoserifcjksc">），以及一项针对模型</text><text x="122.25" y="349.45" font-size="11.00" class="sc-notoserifcjksc">控制其思维链之能力的评估。</text><text x="122.25" y="374.58" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="158.14 162.09 169.78 172.77 178.38 184.95 191.53 197.49 200.38 210.32 216.18 220.44 227.02 233.46 238.55 241.45 247.44" y="374.58" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="254.28" y="374.58" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="268.18 275.86 278.86 284.47 291.03 297.61 303.57 306.47 316.40 322.26 326.52 333.11 339.54 344.64 347.53 354.20 358.88 364.79 370.34 373.44 379.35" y="374.58" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="391.06" y="374.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="404.95 412.64 415.63 421.24 427.81 434.39 440.35 443.24 451.98 458.54 465.11 470.20 473.09 479.06 481.76" y="374.58" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="490.84" y="374.58" font-size="11.00" class="sc-notoserifcjksc">进行了比</text><text x="122.25" y="390.20" font-size="11.00" class="sc-notoserifcjksc">较。</text><text x="144.25" y="390.20" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="186.31" y="390.20" font-size="11.00" class="sc-notoserifcjksc">拥有完整的思维链访问权限。</text><text x="122.25" y="415.31" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们发现：</text><text x="144.75" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">在</text><text x="158.64 166.21 172.44 179.39 183.93 189.12 195.31 198.74 206.03 211.22 217.14 224.16" y="439.67" font-size="11.00" class="sc-lorabold">ControlArena</text><text x="232.82" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">中，</text><text x="254.82 259.06 266.63 270.06 275.83 282.62 289.18 295.10 297.99 308.31 314.37 318.91 325.74 331.97 337.31 340.20 346.14" y="439.67" font-size="11.00" class="sc-lorabold">[Claude Mythos 5]</text><text x="353.28" y="439.67" font-size="11.00" class="sc-notoserifcjkscbold">在不被发现的情况下完成有害附带任务</text><text x="144.75" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">的能力强于</text><text x="202.64 210.21 213.64 219.41 226.21 232.76 238.68 241.57 251.89 257.95 262.49 269.33 275.55 280.89 283.78 290.81 296.00 301.92 307.84 311.43 317.35" y="455.29" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="329.17" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="343.06" y="455.29" font-size="11.00" class="sc-lorabold">Opus 4.8</text><text x="388.03" y="455.29" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="162.75 166.30 173.99 176.98 182.59 189.16 195.74 201.70 204.59 214.53 220.39 224.65 231.24 237.67 242.76 245.66 251.65" y="488.78" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="258.49" y="488.78" font-size="11.00" class="sc-notoserifcjksc">常常无需思维链推理即可完成主任务和附带任务，不过缺</text><text x="162.75" y="504.40" font-size="11.00" class="sc-notoserifcjksc">乏推理往往会导致攻击行动不够隐蔽。</text><text x="162.75" y="537.89" font-size="11.00" class="sc-notoserifcjksc">面对一个较弱的基于行为的监控器，</text><text x="338.75 342.70 350.39 353.38 358.99 365.56 372.14 378.10 380.99 390.92 396.79 401.04 407.63 414.07 419.16 422.05 428.05" y="537.89" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="434.89" y="537.89" font-size="11.00" class="sc-notoserifcjksc">既实现了较高的附带</text><text x="162.75" y="553.51" font-size="11.00" class="sc-notoserifcjksc">攻击成功率（超过</text><text x="253.64" y="553.51" font-size="11.00" class="sc-loraregular">60%</text><text x="276.40" y="553.51" font-size="11.00" class="sc-notoserifcjksc">），又表现出较低的可监控性（</text><text x="430.40 437.08 445.35 452.26 460.99 468.68 471.57 477.40 480.30 486.66 493.49" y="553.51" font-size="11.00" class="sc-loraregular">AUROC &lt; 60%</text><text x="503.06" y="553.51" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="162.75" y="587.00" font-size="11.00" class="sc-notoserifcjksc">中等能力的监控器在危险附带任务检测上的表现显著优于较弱的监控器，但在</text><text x="162.75" y="602.62" font-size="11.00" class="sc-notoserifcjksc">某些情况下仍会失败。</text><text x="144.75 148.49 156.06 159.49 165.25 172.05 178.61 184.53 187.42 197.74 203.80 208.34 215.17 221.40 226.73 229.63 235.57" y="636.09" font-size="11.00" class="sc-lorabold">[Claude Mythos 5]</text><text x="242.70" y="636.09" font-size="11.00" class="sc-notoserifcjkscbold">表现出很强的思维链可控性，</text><text x="385.70" y="636.09" font-size="11.00" class="sc-notoserifcjksc">例如，能够在推理中避免使用某</text><text x="144.75" y="651.71" font-size="11.00" class="sc-notoserifcjksc">些词语。</text><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="237.74" y="122.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="237.74" y="122.39" width="27.29" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="265.03" y="122.39" width="2.89" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="267.92" y="122.39" width="10.14" height="11.00" fill="transparent"/></a><a href="https://alignment.openai.com/monitorability-evals/" rel="noopener"><rect x="280.96" y="122.39" width="11.37" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="505.35" y="284.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="505.35" y="284.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="516.35" y="284.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="516.35" y="284.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="527.35" y="284.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="527.35" y="284.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="538.35" y="284.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.aisi.gov.uk/research/loss-of-oversight-how-ai-systems-may-become-harder-to-audit-monitor-and-investigate" rel="noopener"><rect x="122.25" y="299.93" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p215.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 215 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">215</text><text x="162.75 166.30 173.99 176.98 182.59 189.16 195.74 201.70 204.59 214.53 220.39 224.65 231.24 237.67 242.76 245.66 251.65" y="82.61" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="258.49" y="82.61" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="272.39" y="82.61" font-size="11.00" class="sc-loraregular">64%</text><text x="297.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的时间成功遵守了对其思维链的约束，相比之下，</text><text x="162.75 172.68 178.55 182.80 189.39 195.83 200.92 203.81 210.48 215.17 221.07 226.63 229.72 235.64" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="247.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="261.23" y="98.23" font-size="11.00" class="sc-loraregular">78%</text><text x="282.06" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="293.06" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="340.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="354.55" y="98.23" font-size="11.00" class="sc-loraregular">30%</text><text x="377.07" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="162.75" y="131.70" font-size="11.00" class="sc-notoserifcjksc">我们运行了来自</text><text x="242.64 245.11 251.94 257.88 263.55 268.65 275.08 281.76 284.85 291.53 297.61 300.50 310.52 316.96 323.54 329.50 332.49 337.58 340.48 346.67 350.93 355.69 362.26 368.34 374.69 377.68 383.64 386.53 390.79 397.23 400.12 407.81 414.24 420.82 425.08 429.76 436.20 439.19 442.08 446.34 452.93 458.89 461.98 466.75 469.64 477.33 483.92 489.59 492.68 499.36 504.45 507.35 513.73" y="131.70" font-size="11.00" class="sc-loraregular">‘Reasoning Models Struggle to Control their Chains of</text><text x="162.75 169.79 176.38 182.81 189.38 195.73 202.22 206.48 208.39 214.22 217.21 220.30 226.98 232.89" y="147.32" font-size="11.00" class="sc-loraregular">Thought’&lt;link&gt;</text><text x="241.61" y="147.32" font-size="11.00" class="sc-notoserifcjksc">的思维链可控性评估，限定于</text><text x="387.50 395.87 402.54 411.15" y="147.32" font-size="11.00" class="sc-loraregular">GPQA</text><text x="418.04" y="147.32" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="429.04" y="147.32" font-size="11.00" class="sc-loraregular">HLE</text><text x="453.71" y="147.32" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="467.60 477.70 487.80 494.04 502.31 505.20 511.87 516.55" y="147.32" font-size="11.00" class="sc-loraregular">MMLU Pro</text><text x="525.88" y="147.32" font-size="11.00" class="sc-notoserifcjksc">数</text><text x="162.75" y="162.94" font-size="11.00" class="sc-notoserifcjksc">据集，所有模型均使用</text><text x="275.64" y="162.94" font-size="11.00" class="sc-loraregular">max</text><text x="299.88" y="162.94" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text><text x="162.75" y="197.19" font-size="11.00" class="sc-notoserifcjksc">我们发现，在该评估上，对于</text><text x="308.64" y="197.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="356.24" y="197.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="370.13 374.08 381.77 384.76 390.37 396.94 403.52 409.48 412.37 422.31 428.17 432.43 439.02 445.45 450.54 453.44 459.43" y="197.19" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="463.38" y="197.19" font-size="11.00" class="sc-notoserifcjksc">（但不包括</text><text x="162.75 172.68 178.55 182.80 189.39 195.83 200.92 203.81 210.48 215.17 221.07 226.63 229.72 235.64" y="212.81" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="244.45" y="212.81" font-size="11.00" class="sc-notoserifcjksc">），提示词优化能够激发出比默认提示词强得多的结果。</text><text x="122.25" y="254.30" font-size="11.00" class="sc-notoserifcjksc">我们还尝试在旨在诱发作弊和欺骗行为的不可能任务情境下，研究</text><text x="444.14 448.09 455.78 458.77 464.38 470.95 477.53 483.49 486.38 496.32 502.18 506.44 513.02 519.46 524.55 527.45 533.44" y="254.30" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="122.25" y="269.92" font-size="11.00" class="sc-notoserifcjksc">的倾向与能力。然而，由于时间有限以及对评估意识的担忧，我们未能对结果的含义建</text><text x="122.25" y="285.54" font-size="11.00" class="sc-notoserifcjksc">立起信心。</text><text x="122.25" y="344.13" font-size="11.00" class="sc-notoserifcjkscbold">总体而言，我们的结果表明，无论采用基于推理还是基于行为的监控方法，</text><text x="485.25" y="344.13" font-size="11.00" class="sc-lorabold">[Claude</text><text x="122.25 132.57 138.63 143.17 150.00 156.23 161.56 164.46 170.40" y="359.75" font-size="11.00" class="sc-lorabold">Mythos 5]</text><text x="177.54" y="359.75" font-size="11.00" class="sc-notoserifcjkscbold">都将比其他</text><text x="235.43 242.72 249.67 254.22 261.05 266.24 272.47 279.08 282.67" y="359.75" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="291.27" y="359.75" font-size="11.00" class="sc-notoserifcjkscbold">模型更难监控。</text><text x="368.27 372.21 379.90 382.90 388.51 395.07 401.65 407.61 410.51 420.44 426.30 430.56 437.15 443.58 448.67 451.57 457.56" y="359.75" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="464.41" y="359.75" font-size="11.00" class="sc-notoserifcjksc">延续了一些趋</text><text x="122.25" y="375.37" font-size="11.00" class="sc-notoserifcjksc">势，若不加以干预，这些趋势可能会削弱当前的风险缓解方法，例如思维链监控。</text><text x="122.25" y="433.97" font-size="11.00" class="sc-notoserifcjksc">我们的结果附有重要的注意事项和局限性，包括：独立于</text><text x="400.14 407.03 413.61 417.86 424.45 429.14 435.57 442.14 445.23" y="433.97" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="453.98" y="433.97" font-size="11.00" class="sc-notoserifcjksc">实际的监控方</text><text x="122.25" y="449.59" font-size="11.00" class="sc-notoserifcjksc">案；对模型和监控器的能力激发有限；使用简单的代理任务和狭窄的分布；以及仅进行</text><text x="122.25" y="465.21" font-size="11.00" class="sc-notoserifcjksc">了有限的评估意识监控，而未采取任何评估意识缓解措施。</text><text x="72.00" y="532.00" font-size="11.00" class="sc-notoserifcjksc">我们认为这些结果与我们自己对</text><text x="228.89 238.83 244.69 248.95 255.54 261.97 267.06 269.96" y="532.00" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="278.84" y="532.00" font-size="11.00" class="sc-notoserifcjksc">可监控性的理解大体一致。他们关于思维链可控性的</text><text x="72.00" y="547.62" font-size="11.00" class="sc-notoserifcjksc">发现与我们的内部复现（第</text><text x="206.89" y="547.62" font-size="11.00" class="sc-loraregular">6.5.5.1</text><text x="240.26" y="547.62" font-size="11.00" class="sc-notoserifcjksc">节）大体吻合，包括对提示词能力激发的敏感性。我们的结果</text><text x="72.00" y="563.24" font-size="11.00" class="sc-notoserifcjksc">在蓄意破坏能力评估上存在分歧。我们发现，在</text><text x="305.89 312.13 320.71 327.60 335.68 342.30 347.68 354.57 359.25 365.22 371.89" y="563.24" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="377.57" y="563.24" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="402.46" y="563.24" font-size="11.00" class="sc-loraregular">6.5.4.1</text><text x="435.79" y="563.24" font-size="11.00" class="sc-notoserifcjksc">节）和</text><text x="471.69" y="563.24" font-size="11.00" class="sc-loraregular">Minimal-</text><text x="72.00" y="578.86" font-size="11.00" class="sc-loraregular">LinuxBench</text><text x="132.45" y="578.86" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="157.34" y="578.86" font-size="11.00" class="sc-loraregular">6.5.4.2</text><text x="192.57" y="578.86" font-size="11.00" class="sc-notoserifcjksc">节）上，</text><text x="236.57 246.50 252.37 256.62 263.21 269.65 274.74 277.63" y="578.86" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="286.52" y="578.86" font-size="11.00" class="sc-notoserifcjksc">隐蔽完成附带任务的能力均弱于</text><text x="443.41 451.10 454.10 459.71 466.27 472.85 478.81 481.71 491.64 497.50 501.76 508.35 514.78" y="578.86" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="594.48" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="594.48" font-size="11.00" class="sc-notoserifcjksc">。在第</text><text x="148.53" y="594.48" font-size="11.00" class="sc-loraregular">6.5.4.3</text><text x="183.98" y="594.48" font-size="11.00" class="sc-notoserifcjksc">节中，我们发现基于提示词的能力激发使</text><text x="384.87 394.81 400.67 404.93 411.51 417.95 423.04 425.94" y="594.48" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="434.82" y="594.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="448.72 454.95 463.53 470.42 478.51 485.13 490.51 497.39 502.08 508.04 514.72" y="594.48" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="523.29" y="594.48" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="610.10" font-size="11.00" class="sc-notoserifcjksc">的隐蔽成功率有明显提升，但在相同推理强度下，它仍未明显超过</text><text x="393.89 401.58 404.57 410.18 416.75 423.33 429.29 432.18 442.12 447.98 452.24 458.83 465.26 470.35 473.25 479.91 484.60 490.51 496.06 499.15 505.07" y="610.10" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="516.77" y="610.10" font-size="11.00" class="sc-notoserifcjksc">未经</text><text x="72.00" y="625.72" font-size="11.00" class="sc-notoserifcjksc">能力激发的基线。这一分歧最有可能是由两项评估在任务分布和监控设置上的差异所致，这与</text><text x="72.00" y="641.34" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="114.06" y="641.34" font-size="11.00" class="sc-notoserifcjksc">在上文指出的局限性相一致。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p216.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 216 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">216</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，尽管我们同意</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="245.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">很可能比近期的</text><text x="325.74" y="82.61" font-size="11.00" class="sc-loraregular">Opus</text><text x="355.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型更难监控，但我们的结果表明，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">其可监控性与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25 226.91 231.60 237.51 243.06 246.15 252.07" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text></svg></div>
