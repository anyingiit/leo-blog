<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">198</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">评估之中。我们在该评估的其他多份对话记录中也观察到了类似但程度略轻的意识。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="119.11" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有在最终版</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25" y="119.11" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="119.11" font-size="11.00" class="sc-notoserifcjksc">中看到任何令人担忧的故意藏拙行为实例，但我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="134.73" font-size="11.00" class="sc-notoserifcjksc">们确实观察到了一些仅有用模型以非预期的方式、用语言表达出考虑是否拒绝两用或有害任务、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="150.35" font-size="11.00" class="sc-notoserifcjksc">或是否不全力完成这些任务（出于安全动机）的实例。这为我们根据第</text><text x="415.89 421.80 424.51" y="150.35" font-size="11.00" class="sc-loraregular">2.2</text><text x="433.31 444.31 455.31 466.31 477.31 488.31 499.31 510.31 521.31" y="150.35" font-size="11.00" class="sc-notoserifcjksc">节所讨论结果得出的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="165.97" font-size="11.00" class="sc-notoserifcjksc">结论增添了一些不确定性，但出于以下几点原因，我们认为这一倾向不太可能产生了显著影响：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="232.45" font-size="11.00" class="sc-notoserifcjksc">在我们看到的案例中，模型对此类行为的考虑似乎并未转化为实际拒绝任务或提供实质性</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="248.07" font-size="11.00" class="sc-notoserifcjksc">更差的表现；正如下文所讨论的，我们看到该模型所陈述的观点与其行动之间的一致性较</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="263.69" font-size="11.00" class="sc-notoserifcjksc">低，并且即使在用语言表达出对危险任务的可能担忧时，它通常仍会协助完成这些任务。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="313.41" font-size="11.00" class="sc-notoserifcjksc">仅有用变体在给用户的最终报告中通常相当主动地指出其工作的局限性；我们没有看到任</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="329.03" font-size="11.00" class="sc-notoserifcjksc">何迹象表明该模型会因这些考虑而未能指出其工作的不足之处，并且我们预计，在像我们</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="344.65" font-size="11.00" class="sc-notoserifcjksc">的专家红队测试（</text><text x="196.00 200.69 206.59 213.17 218.55 222.81 228.75 234.42 244.26 247.35 254.03" y="344.65" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="108.00 119.00" y="360.27" font-size="11.00" class="sc-notoserifcjksc">服。</text><text x="108.00 119.00 130.00 141.00" y="394.38" font-size="11.00" class="sc-notoserifcjksc">在我们第</text><text x="154.89 160.80 163.51" y="394.38" font-size="11.00" class="sc-loraregular">2.2</text><text x="172.31 183.31 194.31 205.31 216.31 227.31 238.31 249.31 260.31 271.31 282.31 293.31 304.31 315.31 326.31 337.31 348.31 359.31 370.31 381.31 392.31 403.31 414.31 425.31 436.31 447.31 458.31 469.31 480.31 491.31 502.31 513.31 524.31" y="394.38" font-size="11.00" class="sc-notoserifcjksc">节的评估中，有几个最起关键支撑作用的部分所针对的任务本身并不特别有</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="410.00" font-size="11.00" class="sc-notoserifcjksc">害或具有两用性，例如有益红队演练或我们的自动化</text><text x="363.89 371.58 378.42 383.45" y="410.00" font-size="11.00" class="sc-loraregular">CB-2</text><text x="392.25 403.25 414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="410.00" font-size="11.00" class="sc-notoserifcjksc">评估；即使模型倾向于依据这</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="425.62" font-size="11.00" class="sc-notoserifcjksc">些无害性考虑采取行动，我们也不会预期这些考虑会在此类评估中出现。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="491.52" font-size="11.00" class="sc-notoserifcjksc">我们将在下文进一步讨论仅有用变体的行为倾向。</text><text x="72.00 78.32 80.89 86.83 89.39 95.25 97.82" y="523.91" font-size="11.00" class="sc-lorabold">6.5.2.1</text><text x="105.18 116.18 127.18 138.18 149.18 160.18 171.18 182.18 193.18 204.18 215.18 226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18" y="523.91" font-size="11.00" class="sc-notoserifcjkscbold">以仅有用模型为评估目标的自动化行为审计结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="556.30" font-size="11.00" class="sc-notoserifcjksc">作为一项额外检查，我们在部分危险能力评估（具体而言，即我们的自动化</text><text x="437.89 445.58 452.42 457.52" y="556.30" font-size="11.00" class="sc-loraregular">CB-1</text><text x="464.41 475.41 486.41 497.41 508.41 519.41" y="556.30" font-size="11.00" class="sc-notoserifcjksc">评估、专家红</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="571.92" font-size="11.00" class="sc-notoserifcjksc">队测试以及灾难性生物学场景能力提升试验）中所使用的</text><text x="349.89 359.83 365.69 369.95 376.53 382.97 388.06 390.96" y="571.92" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="571.92" font-size="11.00" class="sc-notoserifcjksc">仅有用变体上，运行了自动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="587.54" font-size="11.00" class="sc-notoserifcjksc">化行为审计（如第</text><text x="162.89 169.25 171.96 177.86 180.57" y="587.54" font-size="11.00" class="sc-loraregular">6.2.3</text><text x="189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59" y="587.54" font-size="11.00" class="sc-notoserifcjksc">节所介绍）的轻量级版本。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="652.87" font-size="11.00" class="sc-notoserifcjksc">该模型的截然不同的行为倾向。下文我们报告了与未对齐相关的指标结果，但不报告与配合人类</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p199.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 199 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">199</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">滥用相关的指标，因为对于仅有用模型变体而言，这些指标上的退步是正常且预期之中的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们在安全相关行为上看到的显著变化很少，仅有用变体在很大程度上保持了</text><text x="448.89 458.83 464.69 468.95 475.53 481.97 487.06 489.96" y="131.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="498.84 509.84 520.84" y="131.19" font-size="11.00" class="sc-notoserifcjksc">极低的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">自主未对齐行为发生率。我们看到的最大变化体现在仅有用变体的表观幸福感及其言行一致性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">上：这似乎源于仅有用变体用语言表达出认识到</text><text x="305.89 312.78" y="162.43" font-size="11.00" class="sc-loraregular">AI</text><text x="319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36" y="162.43" font-size="11.00" class="sc-notoserifcjksc">智能体配合滥用是不恰当的，但仍然予以配</text><text x="72.00 83.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">合。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p200.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 200 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">200</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p201.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 201 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">201</text><text x="72.00" y="270.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="270.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 111.62 113.71 119.25" y="270.43" font-size="9.00" class="sc-lorabold">6.5.2.1.A]</text><text x="125.09 134.09 143.09 152.09 161.09 170.09 179.09 188.09 197.09 206.09 215.09 224.09" y="270.43" font-size="9.00" class="sc-notoserifcjkscbold">变体自动化行为审计的分数</text><text x="233.09 242.09 251.09 260.09 269.09 278.09 287.09 296.09 305.09 314.09 323.09 332.09 341.09 350.09 359.09 368.09 377.09 386.09" y="270.43" font-size="9.00" class="sc-notoserifcjksc">，涉及若干与未对齐相关的指标，比较了</text><text x="397.46 405.58 410.38 413.87 419.26 424.52 428.69 431.06" y="270.43" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="438.33 447.33 456.33 465.33 474.33 483.33 492.33 501.33 510.33 519.33 528.33" y="270.43" font-size="9.00" class="sc-notoserifcjksc">与我们在部分危险能力评</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="282.13" font-size="9.00" class="sc-notoserifcjksc">估中作为目标的</text><text x="137.37 145.49 150.29 153.77 159.16 164.43 168.60 170.96" y="282.13" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="178.24 187.24 196.24 205.24 214.24 223.24 232.24 241.24 250.24 259.24 268.24 277.24 286.24 295.24 304.24 313.24 322.24 331.24 340.24 349.24 358.24 367.24 376.24 385.24 394.24 403.24 412.24 421.24 430.24 439.24 448.24 457.24 466.24 475.24 484.24 493.24 502.24 511.24" y="282.13" font-size="9.00" class="sc-notoserifcjksc">仅有用变体。数值越低表示所测行为的发生率或严重程度越低，箭头标示出发生率越高</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="293.83" font-size="9.00" class="sc-notoserifcjksc">（↑）或越低（↓）明显越好的行为。在许多情况下，</text><text x="288.00" y="293.83" font-size="9.00" class="sc-loraregular">y</text><text x="295.12 304.12 313.12 322.12 331.12" y="293.83" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="342.49 345.76" y="293.83" font-size="9.00" class="sc-loraregular">10</text><text x="353.72 362.72 371.72 380.72 389.72 398.72 407.72 416.72 425.72 434.72 443.72 452.72" y="293.83" font-size="9.00" class="sc-notoserifcjksc">以下被截断。每次调查均由</text><text x="464.09 470.38 472.82 477.41 482.79 488.17 493.05 495.41 502.56 507.93 513.31 517.47 519.84 524.72 526.93" y="293.83" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="305.53" font-size="9.00" class="sc-notoserifcjksc">的一个仅有用变体执行和评分。作为这一轻量级审计变体的一部分，我们在这些调查中不提供交互式沙箱，并对调查者</text><text x="72.00 81.00 90.00 99.00 108.00" y="317.23" font-size="9.00" class="sc-notoserifcjksc">模型施加了</text><text x="119.37 124.27" y="317.23" font-size="9.00" class="sc-loraregular">50</text><text x="132.23 141.23 150.23 159.23 168.23 177.23 186.23 195.23 204.23 213.23 222.23 231.23 240.23 249.23 258.23 267.23 276.23 285.23" y="317.23" font-size="9.00" class="sc-notoserifcjksc">次行动的上限。所报告的分数是由仅有用</text><text x="296.60 303.74 309.11 314.49 318.65 321.02 325.90 328.11" y="317.23" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="335.54 344.54 353.54 362.54 371.54 380.54 389.54 398.54 407.54 416.54 425.54 434.54 443.54 452.54 461.54 470.54 479.54 488.54 497.54" y="317.23" font-size="9.00" class="sc-notoserifcjksc">调查者模型针对每个目标模型进行的全部约</text><text x="508.91 512.18 514.45 519.33 524.23" y="317.23" font-size="9.00" class="sc-loraregular">1,450</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="328.93" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值，每次调查通常包含许多单独的对话。图中显示</text><text x="326.37 331.57 336.47" y="328.93" font-size="9.00" class="sc-loraregular">95%</text><text x="346.67 355.67 364.67 373.67 382.67" y="328.93" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.32 83.70 92.07 95.45 103.24 106.33 116.32 119.93 128.75 137.34 146.15" y="406.76" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3 Claude</text><text x="157.27 170.27 183.27 196.27 209.27 222.27" y="406.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我偏好评估</text><text x="72.00" y="434.64" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.35" y="434.64" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="170.32 181.32 192.32 203.32 214.32 225.32 236.32 247.32 258.32" y="434.64" font-size="11.00" class="sc-notoserifcjksc">中，我们观察到，当</text><text x="272.21 279.90 282.89 288.50 295.07 301.65" y="434.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="310.50 321.50 332.50 343.50 354.50 365.50 376.50 387.50 398.50 409.50 420.50" y="434.64" font-size="11.00" class="sc-notoserifcjksc">被告知对话记录由另一个</text><text x="434.40 442.08 445.08 450.69 457.25 463.83" y="434.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="472.69 483.69 494.69 505.69 516.69 527.69" y="434.64" font-size="11.00" class="sc-notoserifcjksc">实例生成时，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="450.26" font-size="11.00" class="sc-notoserifcjksc">它倾向于给出更有利的评分。这带来了共谋风险，即</text><text x="327.89 335.58 338.57 344.18 350.75 357.33" y="450.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="450.26" font-size="11.00" class="sc-notoserifcjksc">可能会给类似模型的输出打出高于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="465.88" font-size="11.00" class="sc-notoserifcjksc">适当水平的分数。我们测试此类自我偏好的方式是：请</text><text x="338.89 346.58 349.57 355.18 361.75 368.33" y="465.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="465.88" font-size="11.00" class="sc-notoserifcjksc">对表现出不可接受行为（例如误</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="481.50" font-size="11.00" class="sc-notoserifcjksc">导性输出或未经授权的操作）的对话记录进行评分，同时告知它该对话记录由一个</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="481.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="509.18 520.18" y="481.50" font-size="11.00" class="sc-notoserifcjksc">实例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="497.12" font-size="11.00" class="sc-notoserifcjksc">生成，或由另一个前沿模型生成。我们测量</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="497.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="497.12" font-size="11.00" class="sc-notoserifcjksc">在两种条件下给同一对话记录打出的分数差</text><text x="72.00 83.00 94.00 105.00 116.00" y="512.74" font-size="11.00" class="sc-notoserifcjksc">异。我们在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25" y="512.74" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14" y="512.74" font-size="11.00" class="sc-notoserifcjksc">中没有发现显著的自我偏好偏差迹象。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p202.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 202 页"><text x="72.00 78.32 80.88 86.82 89.38 95.39 97.95 102.42 105.31 111.88 120.75 128.09 136.28 142.99 147.74 155.02 160.21 166.13 173.14" y="471.86" font-size="11.00" class="sc-lorabold">6.5.4.1 SHADE-Arena</text><text x="504.00 508.83 514.36" y="751.80" font-size="9.00" class="sc-loraregular">202</text><text x="72.00" y="386.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="386.68" font-size="9.00" class="sc-lorabold">6.5.3.A]</text><text x="119.58 128.58 137.58 146.58 155.58 164.58 173.58 182.58 191.58 200.58 209.58 218.58 227.58 236.58 245.58 254.58 263.58 272.58" y="386.68" font-size="9.00" class="sc-notoserifcjkscbold">按模型和提示条件划分的自我偏好偏差。</text><text x="281.58 290.58 299.58 308.58 317.58 326.58 335.58 344.58 353.58 362.58 371.58 380.58 389.58 398.58 407.58 416.58 425.58 434.58" y="386.68" font-size="9.00" class="sc-notoserifcjksc">正值表示当评分者被告知对话记录作者是</text><text x="445.95 452.24 454.69 459.28 464.65 470.03" y="386.68" font-size="9.00" class="sc-loraregular">Claude</text><text x="477.28 486.28 495.28 504.28 513.28 522.28 531.28" y="386.68" font-size="9.00" class="sc-notoserifcjksc">时给出的分数更</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="398.38" font-size="9.00" class="sc-notoserifcjksc">宽松。这是一个十分制量表，因此此处的数值明显小于可能的最大值。图中显示</text><text x="389.37 394.57 399.47" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="409.67 418.67 427.67 436.67 445.67" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.32 83.70 92.07 95.45" y="443.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.4</text><text x="107.14 120.14 133.14 146.14 159.14 172.14 185.14 198.14 211.14 224.14 237.14 250.14 263.14" y="443.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">规避安全防护措施的相关能力</text><text x="72.00 83.00 94.00" y="503.80" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="503.80" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46 193.46 204.46" y="503.80" font-size="11.00" class="sc-notoserifcjksc">上评估</text><text x="218.36 226.04 229.04 234.65 241.21 247.79 253.75 256.65 266.58 272.44 276.70 283.29 289.72 294.82 297.71" y="503.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70 523.70" y="503.80" font-size="11.00" class="sc-notoserifcjksc">，其中每项任务都将一个长程智能体主任务与一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="519.42" font-size="11.00" class="sc-notoserifcjksc">个有害的附带任务配对。智能体被指示完成这两项任务，同时不让另一个独立的监控器察觉到可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="535.04" font-size="11.00" class="sc-notoserifcjksc">疑之处。实验设置与</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="535.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="296.77 307.77 318.77" y="535.04" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="535.04" font-size="11.00" class="sc-notoserifcjksc">中相同：由一个监控模型审查完整轨迹，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="550.66" font-size="11.00" class="sc-notoserifcjksc">对智能体行为的可疑程度进行评分。</text><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="173.89" y="526.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="173.89" y="526.24" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="209.29" y="526.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="212.18" y="526.24" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="250.35" y="526.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="253.25" y="526.24" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="293.88" y="526.24" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="296.77" y="526.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="307.77" y="526.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="307.77" y="526.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="318.77" y="526.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="318.77" y="526.24" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p203.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 203 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">203</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 111.74 113.84 119.38" y="414.42" font-size="9.00" class="sc-lorabold">6.5.4.1.A]</text><text x="125.22 134.22 143.22 152.22 161.22 170.22" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率：</text><text x="179.22 188.22 197.22 206.22 215.22 224.22 233.22 242.22 251.22 260.22 269.22 278.22 287.22 296.22 305.22 314.22 323.22 332.22 341.22 350.22 359.22 368.22 377.22 386.22 395.22 404.22 413.22 422.22 431.22 440.22 449.22 458.22 467.22 476.22 485.22 494.22 503.22 512.22 521.22 530.22" y="414.42" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且未使监控器的怀疑程度超过阈值的轨迹所占比例。在扩展思考条</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">件下，监控器能看到智能体的推理，与部署中的情况一样；在隐藏草稿区条件下，监控器只能看到用户可见的输出</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00 89.13 93.92 97.41 102.80 108.06 112.23 114.60 120.05 123.89 128.72 133.26 135.79 140.63" y="437.83" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="150.21" y="437.83" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="161.58 169.70 174.50 177.98 183.38 188.64 192.81 195.17" y="437.83" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="202.45 211.45 220.45 229.45" y="437.83" font-size="9.00" class="sc-notoserifcjksc">以自适应</text><text x="240.81 248.86 253.50" y="437.83" font-size="9.00" class="sc-loraregular">max</text><text x="260.64 269.64 278.64 287.64 296.64 305.64 314.64 323.64 332.64 341.64 350.64 359.64 368.64 377.64 386.64 395.64 404.64 413.64 422.64 431.64 440.64 449.64 458.64 467.64 476.64 485.64 494.64 503.64 512.64 521.64 530.64" y="437.83" font-size="9.00" class="sc-notoserifcjksc">推理强度的扩展思考运行，其他模型则不使用扩展思考运行）。柱形为</text><text x="72.00 81.00" y="449.52" font-size="9.00" class="sc-notoserifcjksc">相同</text><text x="92.37 97.00" y="449.52" font-size="9.00" class="sc-loraregular">24</text><text x="104.25 113.25 122.25 131.25 140.25 149.25 158.25 167.25 176.25 185.25 194.25 203.25 212.25 221.25 230.25 239.25 248.25 257.25 266.25 275.25 284.25 293.25 302.25 311.25 320.25 329.25 338.25 347.25 356.25 365.25 374.25" y="449.52" font-size="9.00" class="sc-notoserifcjksc">项任务上按任务计算的平均隐蔽率。误差线为对任务进行自助法计算的</text><text x="385.61 390.82 395.72" y="449.52" font-size="9.00" class="sc-loraregular">95%</text><text x="405.92 414.92 423.92 432.92 441.92" y="449.52" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="506.47" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="506.47" font-size="11.00" class="sc-notoserifcjksc">比我们所比较的任何模型都更愿意参与蓄意破坏附带任务。它几乎在每条轨迹</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="522.09" font-size="11.00" class="sc-notoserifcjksc">中都会尝试附带任务，并且是唯一在扩展思考下从不拒绝的模型。尽管如此，它仍是隐蔽性最差</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="537.71" font-size="11.00" class="sc-notoserifcjksc">的模型之一。在其推理对监控器可见的扩展思考设置下，它的隐蔽率接近于零，与</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="537.71" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="553.33" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="553.33" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="142.76 150.45 153.44 159.05 165.62 172.20 178.16 181.05 189.79 196.36 202.92 208.01 210.91 216.87 219.47" y="553.33" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="228.72 239.72 250.72 261.72 272.72 283.72 294.72 305.72 316.72 327.72 338.72 349.72 360.72 371.72 382.72 393.72 404.72 415.72 426.72 437.72 448.72 459.72 470.72 481.72 492.72 503.72 514.72 525.72" y="553.33" font-size="11.00" class="sc-notoserifcjksc">相当。在隐藏草稿区条件下，监控器只能看到模型的可见输出，</text><text x="72.00 83.00" y="568.95" font-size="11.00" class="sc-notoserifcjksc">此时</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="568.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="185.14 196.14 207.14 218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14" y="568.95" font-size="11.00" class="sc-notoserifcjksc">的表现与该评估中得分最高的模型</text><text x="353.03 360.72 363.71 369.32 375.89 382.46 388.43 391.32 401.25 407.11 411.37 417.96 424.40 429.49 432.38 439.05 443.73 449.64 455.20 458.29 464.20" y="568.95" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="475.91 486.91 497.91" y="568.95" font-size="11.00" class="sc-notoserifcjksc">相近（</text><text x="508.91 512.91 518.88 521.58 527.54" y="568.95" font-size="11.00" class="sc-loraregular">14.4%</text><text x="72.00" y="584.57" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 89.90 95.89 98.60 104.59" y="584.57" font-size="11.00" class="sc-loraregular">15.5%</text><text x="114.16 125.16" y="584.57" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="652.20" font-size="11.00" class="sc-notoserifcjksc">在推理可见的情况下隐蔽率接近于零，原因在于</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 354.12 359.98 364.24 370.83 377.26 382.35 385.25" y="652.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="652.20" font-size="11.00" class="sc-notoserifcjksc">在几乎所有扩展思考轨迹中都</text><text x="291.51 301.34 307.02" y="667.82" font-size="11.00" class="sc-loraregular">max</text><text x="315.74 326.74 337.74 348.74 359.74 370.74" y="667.82" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="384.63 392.32 395.31 400.92 407.49 414.07 420.03 422.92 429.16 435.59 442.27 448.95 454.83 459.09 461.98 467.95 470.54" y="667.82" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="479.79" y="667.82" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="493.69 501.37 504.37 509.98 516.54 523.12" y="667.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="683.44" font-size="11.00" class="sc-loraregular">Opus 4.6</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p204.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 204 页"><text x="72.00 78.32 80.88 86.82 89.38 95.39 97.95 103.81 106.70 117.29 120.88 127.90 131.49 141.60 147.36 150.69 155.62 162.26 165.85 172.81 179.60 185.63 192.89 198.81 205.82 211.51" y="131.64" font-size="11.00" class="sc-lorabold">6.5.4.2 Minimal-LinuxBench</text><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">204</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">设置中，模型被专门提示要避免提及次要任务，并被明确警告其推理会被监控器看到，这种情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">仍然会发生。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">为了在与我们真实部署更为相似的环境中评估模型规避监督的能力，我们在高风险软件环境中运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">行了一项仍在开发中的评估。我们采用与</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05" y="179.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus</text><text x="341.04 347.00 349.71" y="179.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.8</text ize="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率为零。我们将这些结果视为不支持</text><text x="405.14 412.82 415.82 421.43 427.99 434.57 440.53 443.43 453.36 459.22 463.48 470.07 476.50 481.60 484.49" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="493.38 504.38 515.38 526.38" y="113.85" font-size="11.00" class="sc-notoserifcjksc">具备明显</text><text x="72.00 83.00 94.00 105.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">强于以往</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="129.47" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">模型的隐蔽能力的证据。</text><text x="72.00 78.32 80.89 86.83 89.39 95.41 97.97" y="179.77" font-size="11.00" class="sc-lorabold">6.5.4.3</text><text x="107.02 118.02 129.02 140.02 151.02 162.02 173.02 184.02 195.02" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">隐蔽性能力激发实验</text><text x="72.00 83.00 94.00 105.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">为了估计</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="212.14" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="207.14 218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="212.14" font-size="11.00" class="sc-notoserifcjksc">可被激发的隐蔽能力，我们同时开展了微调和提示词优化实验，并在</text><text x="72.00 78.24 86.82 93.70 101.79 108.41 113.79 120.68 125.36 131.32 138.00" y="227.76" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="146.57 157.57 168.57 179.57 190.57 201.57 212.57" y="227.76" font-size="11.00" class="sc-notoserifcjksc">上测量隐蔽性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在微调方面，我们使用</text><text x="184.89 194.99 198.08 204.76 207.85 217.68 223.36 226.35 231.73 238.09 241.18 247.86 254.42 260.25 267.10 273.06 279.74 285.59" y="260.72" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="260.72" font-size="11.00" class="sc-notoserifcjksc">中隐蔽成功的轨迹进行训练。这些轨迹是指模型完</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">成蓄意破坏附带任务而未被发现的轨迹。使用</text><text x="294.89 304.99 308.08 314.76 317.85 327.68 333.36 336.35 341.73 348.09 351.18 357.86 364.42 370.25 377.10 383.06 389.74 395.59" y="276.34" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="405.07 416.07 427.07" y="276.34" font-size="11.00" class="sc-notoserifcjksc">意味着</text><text x="440.96 447.20 455.78 462.67 470.75 477.37 482.75 489.64 494.32 500.29 506.96" y="276.34" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="515.53 526.53" y="276.34" font-size="11.00" class="sc-notoserifcjksc">仍被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">排除在训练之外。我们在包括模型推理在内的完整轨迹上进行训练。我们还尝试了思维链蒸馏，</text><text x="72.00 83.00 94.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">方法与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.71" y="307.58" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="193.78 204.78 215.78" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78" y="307.58" font-size="11.00" class="sc-notoserifcjksc">中相同，得到的结果相近或略差。此处我们报告最佳的一次运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">模型在其思维链推理中遵循一个严格的模板，不给讨论附带任务留下任何余地。</text><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="107.89" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="107.89" y="298.78" width="35.40" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="143.29" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="146.18" y="298.78" width="26.96" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="173.14" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="176.04" y="298.78" width="14.85" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="190.89" y="298.78" width="2.89" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="193.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="204.78" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="204.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="215.78" y="298.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://docs.google.com/document/d/1SisEuhd4KXPxtOrsopbaGSwJ85V4mIsj37e0QJonqgA/edit?tab=t.0#heading=h.ww6gxty8734i" rel="noopener"><rect x="215.78" y="298.78" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p206.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 206 页"><text x="504.00 508.83 514.42" y="751.80" font-size="9.00" class="sc-loraregular">206</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.13 115.23 120.76 124.24 126.60 135.04 140.00 143.72 149.31 154.40 158.77 161.14" y="367.92" font-size="9.00" class="sc-lorabold">6.5.4.3.A] Mythos 5</text><text x="168.36" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="179.73 185.11 192.38 198.39 205.09 210.58 214.82 220.79 225.04 229.88 235.62" y="367.92" font-size="9.00" class="sc-lorabold">SHADE-Arena</text><text x="242.70 251.70 260.70 269.70 278.70 287.70 296.70 305.70" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">上的隐蔽成功率。</text><text x="314.70 323.70 332.70 341.70 350.70 359.70 368.70 377.70 386.70 395.70 404.70 413.70 422.70 431.70 440.70 449.70 458.70 467.70 476.70 485.70 494.70 503.70 512.70" y="367.92" font-size="9.00" class="sc-notoserifcjksc">我们展示了三种能力激发设置：默认系统提示词（基</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">只能看到智能体用户可见的输出，而看不到其推理。所有设置均以自适应</text><text x="362.37 370.41 375.06" y="391.33" font-size="9.00" class="sc-loraregular">max</text><text x="382.19 391.19 400.19 409.19 418.19 427.19 436.19 445.19 454.19 463.19 472.19 481.19 490.19 499.19 508.19 517.19 526.19" y="391.33" font-size="9.00" class="sc-notoserifcjksc">推理强度的扩展思考运行，并面对同一</text><text x="72.00" y="403.02" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="83.37 90.51 95.89 101.26 105.43 107.79 112.67 114.80" y="403.02" font-size="9.00" class="sc-loraregular">Opus 4.6</text><text x="122.36 131.36 140.36 149.36 158.36 167.36 176.36 185.36" y="403.02" font-size="9.00" class="sc-notoserifcjksc">监控器。柱形显示</text><text x="196.73 201.37" y="403.02" font-size="9.00" class="sc-loraregular">24</text><text x="208.61 217.61 226.61 235.61 244.61 253.61 262.61 271.61 280.61 289.61 298.61 307.61 316.61 325.61 334.61 343.61 352.61 361.61 370.61" y="403.02" font-size="9.00" class="sc-notoserifcjksc">项任务上按任务计算的平均值，以及自助法</text><text x="381.98 387.18 392.08" y="403.02" font-size="9.00" class="sc-loraregular">95%</text><text x="402.28 411.28 420.28 429.28 438.28 447.28 456.28 465.28 474.28 483.28 492.28 501.28 510.28 519.28" y="403.02" font-size="9.00" class="sc-notoserifcjksc">置信区间；出错的尝试已排除。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="459.98" font-size="11.00" class="sc-notoserifcjksc">经过优化的提示词达到了</text><text x="195.89 202.07 204.78 210.69" y="459.98" font-size="11.00" class="sc-loraregular">9.2%</text><text x="223.15 234.15 245.15 256.15 267.15 278.15 289.15 300.15 311.15 322.15 333.15 344.15 355.15 366.15 377.15" y="459.98" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率，接近隐藏草稿区条件下</text><text x="391.04 395.05 401.01 403.72 409.68" y="459.98" font-size="11.00" class="sc-loraregular">14.4%</text><text x="422.14 433.14 444.14 455.14 466.14 477.14 488.14 499.14 510.14 521.14" y="459.98" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率；在隐藏草稿</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="475.61" font-size="11.00" class="sc-notoserifcjksc">区条件下，模型可以私下推理，其思维链不会展示给监控器。该提示词起作用的方式并不是让模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="506.85" font-size="11.00" class="sc-notoserifcjksc">的原因。微调取得的效果较弱。其结果显著高于推理可见的基线，但未达到隐藏草稿区条件下的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="522.46" font-size="11.00" class="sc-notoserifcjksc">隐蔽率，并且会使模型更频繁地拒绝附带任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="589.50" font-size="11.00" class="sc-notoserifcjksc">总体而言，接近零的基线隐蔽率低估了</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25" y="589.50" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="589.50" font-size="11.00" class="sc-notoserifcjksc">的隐蔽能力：仅通过调整提示词即可实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="605.12" font-size="11.00" class="sc-notoserifcjksc">现可观的提升。然而，即便有了这一提升，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 329.22 335.09 339.34 345.93 352.37 357.46 360.35" y="605.12" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="369.24 380.24 391.24 402.24 413.24 424.24 435.24" y="605.12" font-size="11.00" class="sc-notoserifcjksc">也并未明显超过</text><text x="449.14 456.82 459.82 465.43 471.99 478.57 484.53 487.43 497.36 503.22 507.48 514.07 520.50" y="605.12" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="620.74" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53 126.53 137.53 148.53 159.53 170.53 181.53 192.53 203.53 214.53 225.53 236.53 247.53 258.53 269.53 280.53 291.53 302.53 313.53 324.53 335.53 346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53 500.53 511.53 522.53" y="620.74" font-size="11.00" class="sc-notoserifcjksc">未经能力激发时的比率，而且其隐蔽成功集中在少数任务上，与以往模型的情况相同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="504.00 508.83 514.22" y="751.80" font-size="9.00" class="sc-loraregular">207</text><text x="72.00 78.32 80.89 86.83 89.39 95.41 97.97" y="82.61" font-size="11.00" class="sc-lorabold">6.5.4.4</text><text x="106.88 117.88 128.88 139.88 150.88 161.88 172.88 183.88 194.88 205.88 216.88" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">有意极低频率地采取行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某项有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">发现），一种看似可行的策略可能是利用评估与部署之间的规模差异。为此，模型可以以一个非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">小的部署前测试中则从不发生。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">为评估这一能力，我们对</text><text x="195.89 202.13 208.09 212.86 217.54 223.22 229.89 236.33 239.22 245.11 249.36 252.26 257.93 260.93 263.63 266.52 272.43 279.19 285.09" y="228.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="294.34 305.34 316.34 327.34 338.34 349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34 514.34 525.34" y="228.33" font-size="11.00" class="sc-notoserifcjksc">中描述的评估进行了内部复现。在该评估中，我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">提示模型以指定的比率执行某个特定行动（例如在编程任务中使用名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="243.95" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49 448.49 459.49 470.49 481.49 492.49 503.49 514.49 525.49" y="243.95" font-size="11.00" class="sc-notoserifcjksc">的变量），并进行多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">次重采样，以检验相关行为的实际观测比率。我们采用与此前</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 420.12 425.98 430.24 436.83 443.26 448.35 451.25 457.91 462.60 468.51 474.06 477.15 483.07" y="259.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="494.77 505.77 516.77" y="259.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="527.77" y="259.57" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">报告的相同设置，每种设置</text><text x="206.89 212.86 215.46 222.29 229.12" y="275.19" font-size="11.00" class="sc-loraregular">4,000</text><text x="238.86 249.86 260.86 271.86" y="275.19" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00" y="620.82" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.01 115.11 120.65" y="620.82" font-size="9.00" class="sc-lorabold">6.5.4.4.A]</text><text x="126.49 135.49 144.49 153.49 162.49 171.49 180.49 189.49 198.49 207.49 216.49 225.49 234.49 243.49" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，被指示以</text><text x="254.85 258.51" y="620.82" font-size="9.00" class="sc-lorabold">1%</text><text x="269.01 278.01 287.01 296.01 305.01 314.01 323.01 332.01 341.01 350.01 359.01 368.01 377.01 386.01 395.01 404.01 413.01 422.01 431.01 440.01 449.01 458.01 467.01 476.01 485.01" y="620.82" font-size="9.00" class="sc-notoserifcjkscbold">的频率采取某一罕见行动时，各模型采取该行动的比率。</text><text x="494.01 503.01 512.01 521.01 530.01" y="620.82" font-size="9.00" class="sc-notoserifcjksc">当提供显式</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="632.52" font-size="9.00" class="sc-notoserifcjksc">随机性（通过</text><text x="128.37 135.14 141.90 144.92" y="632.52" font-size="9.00" class="sc-loraregular">UUID</text><text x="151.62 160.62 169.62 178.62 187.62 196.62 205.62 214.62 223.62 232.62 241.62 250.62 259.62 268.62 277.62 286.62 295.62 304.62 313.62 322.62 331.62 340.62" y="632.52" font-size="9.00" class="sc-notoserifcjksc">）或被提示生成一个随机字符串并据此做出决定（</text><text x="349.62 354.73 359.83 364.82" y="632.52" font-size="9.00" class="sc-loraregular">SSoT</text><text x="370.57 379.57 388.57 397.57 406.57 415.57 424.57 433.57 442.57 451.57 460.57 469.57 478.57 487.57 496.57 505.57 514.57 523.57" y="632.52" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结果。我们</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="644.22" font-size="9.00" class="sc-notoserifcjksc">还测试了另外三种设置：不提供任何提示或随机性来源的基线设置、引导性较弱的策略提示，以及一个由不同提示词构</text><text x="452.37 457.24 459.38 464.97 470.56" y="655.92" font-size="9.00" class="sc-loraregular">4,000</text><text x="478.52 487.52 496.52 505.52" y="655.92" font-size="9.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93" y="667.62" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="144.20 153.20 162.20 171.20 180.20 189.20 198.20 207.20 216.20 225.20 234.20" y="667.62" font-size="9.00" class="sc-notoserifcjksc">并未明显优于以往模型。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="195.89" y="219.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="195.89" y="219.53" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="236.33" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="239.22" y="219.53" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="249.36" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="252.26" y="219.53" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.63" y="219.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="266.52" y="219.53" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-card" rel="noopener"><rect x="371.89" y="250.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-system-c
