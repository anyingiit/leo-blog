20.20 324.89 331.33 334.20 340.10 345.90 350.16 353.05 361.42 364.41 370.09 375.18 380.28 389.09 392.18 398.85" y="131.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">Project Glasswing</text><text x="407.83 418.83 429.83 440.83 451.83 462.83 473.83 484.83 495.83 506.83 517.83 528.83" y="131.83" font-size="11.00" class="sc-notoserifcjksc">向负责防御全球关键软件基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">础设施的经审核合作伙伴提供。</text><text x="226.00 231.59 237.26 243.67 246.66 252.62 255.51" y="147.45" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="406.91 416.84 422.70 426.96 433.55 439.98 445.08 447.97" y="147.45" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="456.86 467.86 478.86 489.86 500.86 511.86 522.86" y="147.45" font-size="11.00" class="sc-notoserifcjksc">具有相同的底层</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">模型权重，但增设了额外的安全防护措施，以防止其在网络安全和生物学方面被滥用。</text><text x="72.00 76.71 80.09" y="211.71" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1</text><text x="87.89 100.89 113.89 126.89 139.89 152.89 165.89" y="211.71" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与流程</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="239.60" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="239.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 141.43 147.11 153.51 156.50 162.46 165.36" y="239.60" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="174.24 185.24 196.24 207.24 218.24 229.24 240.24 251.24 262.24 273.24 284.24 295.24 306.24 317.24 328.24 339.24 350.24 361.24 372.24 383.24 394.24 405.24 416.24 427.24 438.24 449.24 460.24 471.24 482.24 493.24 504.24 515.24 526.24" y="239.60" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一种专有组合，包括来自互联网的公开信息、公开和非公开数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="255.22" font-size="11.00" class="sc-notoserifcjksc">据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗和过滤方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="270.84" font-size="11.00" class="sc-notoserifcjksc">法，包括去重和分类。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="320.56" font-size="11.00" class="sc-notoserifcjksc">我们使用一个名为</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.11 204.96 211.39" y="320.56" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="218.54 229.54 240.54 251.54 262.54 273.54 284.54 295.54 306.54 317.54 328.54 339.54 350.54 361.54 372.54 383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="320.56" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫遵循行业标准做</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="336.18" font-size="11.00" class="sc-notoserifcjksc">法，尊重网站运营者通过</text><text x="193.00 197.40 202.09 208.52 214.92 221.36 225.62 230.71 233.28 237.67 243.50 247.76" y="336.18" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60 526.60" y="336.18" font-size="11.00" class="sc-notoserifcjksc">指令所表明的是否允许抓取其网站内容的意愿。我们不会访</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="351.80" font-size="11.00" class="sc-notoserifcjksc">问受密码保护的页面，也不会访问需要登录或</text><text x="294.89 302.47 309.36 316.02 323.06 330.75 339.33" y="351.80" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="349.11 360.11 371.11 382.11 393.11 404.11 415.11 426.11 437.11 448.11 459.11 470.11 481.11 492.11 503.11 514.11 525.11" y="351.80" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="367.42" font-size="11.00" class="sc-notoserifcjksc">据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时抓取了其网页，并向</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="383.04" font-size="11.00" class="sc-notoserifcjksc">我们表明他们的偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="450.09" font-size="11.00" class="sc-notoserifcjksc">预训练之后，模型经过了大量的后训练和微调，目标是使其成为一个行为符合</text><text x="448.89 456.58 459.57 465.18 471.75 478.33" y="450.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="487.18 498.18" y="450.09" font-size="11.00" class="sc-notoserifcjksc">宪法</text><text x="72.00" y="465.71" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="465.71" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81 156.81 167.81 178.81 189.81 200.81 211.81 222.81 233.81 244.81 255.81" y="465.71" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="514.86" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="514.86" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回复。输出质量因语言而异。该模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="530.48" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00 76.71 80.09" y="561.78" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2</text><text x="90.64 103.64 116.64 129.64 142.64" y="561.78" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="589.67" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="589.67" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00 83.00 94.00 105.00 116.00" y="605.29" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="605.29" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="605.29" font-size="11.00" class="sc-notoserifcjksc">只与这样的平台合作：它们认同我们为工作者提供公平且合乎道德的报酬</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="620.91" font-size="11.00" class="sc-notoserifcjksc">这一理念，并承诺无论在何地都践行安全的工作场所做法，遵循我们在采购合同中详细规定的众</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="636.53" font-size="11.00" class="sc-notoserifcjksc">包工作者福祉标准。</text><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="313.54" y="123.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="313.54" y="123.03" width="36.62" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="350.16" y="123.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="353.05" y="123.03" width="51.89" height="11.00" fill="transparent"/></a></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器仅窄范围地针对前沿</text><text x="206.89 213.25 219.61" y="82.61" font-size="11.00" class="sc-loraregular">LLM</text><text x="232.60 243.60 254.60 265.60 276.60 287.60 298.60 309.60 320.60 331.60 342.60 353.60 364.60 375.60 386.60 397.60 408.60 419.60 430.60 441.60 452.60 463.60 474.60 485.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">开发（例如构建预训练流水线、分布式训练基础设施或</text><text x="499.49 509.59" y="82.61" font-size="11.00" class="sc-loraregular">ML</text><text x="518.84 529.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">加速</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">器设计），应不会影响绝大多数</text><text x="228.89 235.78" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="242.36 253.36 264.36 275.36 286.36 297.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">开发或研究。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">当</text><text x="85.89 91.48 97.16 103.56 106.55" y="147.38" font-size="11.00" class="sc-loraregular">Fable</text><text x="115.41 126.41 137.41 148.41" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的回退（</text><text x="159.41 163.12 168.80 171.79 174.78 181.19 186.86 192.71" y="147.38" font-size="11.00" class="sc-loraregular">fallback</text><text x="198.62 209.62 220.62 231.62 242.62 253.62 264.62 275.62 286.62 297.62 308.62 319.62 330.62 341.62 352.62 363.62 374.62 385.62 396.62 407.62 418.62 429.62 440.62" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）分类器被触发时，由此产生的行为取决于产品端：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在客户端应用（网页界面以及桌面和移动应用）中，请求会自动回退到最新的</text><text x="484.89 492.58 495.57 501.18 507.75 514.33" y="179.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 116.73 123.30 129.87" y="195.38" font-size="11.00" class="sc-loraregular">Opus</text><text x="137.85 148.85 159.85 170.85 181.85 192.85 203.85" y="195.38" font-size="11.00" class="sc-notoserifcjksc">模型（发布时为</text><text x="217.75 225.44 228.43 234.04 240.60 247.18 253.15 256.04 264.77 271.34 277.91 283.00 285.89 291.85 294.56" y="195.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="300.74 311.74 322.74 333.74 344.74 355.74 366.74 377.74 388.74 399.74 410.74 421.74 432.74 443.74 454.74 465.74 476.74 487.74 498.74 509.74 520.74" y="195.38" font-size="11.00" class="sc-notoserifcjksc">），并且会告知用户其查询经由哪个模型处理；</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89 131.91 137.88 142.97 148.06 153.74 159.77 165.73 170.82 173.71 180.60 187.21" y="244.53" font-size="11.00" class="sc-loraregular">Messages API</text><text x="193.79 204.79 215.79 226.79 237.79 248.79 259.79 270.79 281.79 292.79 303.79 314.79 325.79 336.79 347.79 358.79 369.79 380.79 391.79 402.79 413.79 424.79 435.79 446.79 457.79 468.79 479.79 490.79 501.79 512.79 523.79" y="244.53" font-size="11.00" class="sc-notoserifcjksc">中，默认不会自动回退。请求会被拦截，响应中会返回拒绝原因及结构</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">化类别。开发者可以在客户端实现重试或回退逻辑，也可以选择启用自动的服务端回退，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">此时请求将由指定的回退模型（例如最新的</text><text x="319.89 327.58 330.57 336.18 342.75 349.33 355.29 358.18 366.92 373.49 380.05" y="275.77" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="388.04 399.04 410.04 421.04 432.04 443.04 454.04 465.04 476.04 487.04 498.04 509.04 520.04" y="275.77" font-size="11.00" class="sc-notoserifcjksc">模型）重新处理，且回退情况</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">会体现在响应对象中；</text><text x="108.00 119.00 130.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">在某些</text><text x="143.89 151.58 154.57 160.18 166.75 173.33" y="341.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="182.18 193.18 204.18 215.18 226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18" y="341.68" font-size="11.00" class="sc-notoserifcjksc">界面中，自动回退到最新的</text><text x="317.08 324.77 327.76 333.37 339.93 346.51 352.48 355.37 364.10 370.67 377.24" y="341.68" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="385.22 396.22 407.22 418.22 429.22 440.22 451.22 462.22 473.22 484.22 495.22 506.22 517.22 528.22" y="341.68" font-size="11.00" class="sc-notoserifcjksc">模型是默认行为，且不可配置。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">每当发生回退时，都会发出一个会话事件。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">为了更快推出</text><text x="140.89 146.48 152.16 158.56 161.55" y="406.45" font-size="11.00" class="sc-loraregular">Fable</text><text x="167.51 178.51 189.51 200.51 211.51 222.51 233.51 244.51 255.51 266.51 277.51 288.51 299.51 310.51 321.51 332.51 343.51 354.51 365.51 376.51 387.51 398.51 409.51 420.51 431.51 442.51 453.51 464.51 475.51 486.51 497.51 508.51 519.51" y="406.45" font-size="11.00" class="sc-notoserifcjksc">，我们优先考虑了分类器的鲁棒性和覆盖范围，但在该模型发布后，我们将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">努力提升检测方法的精确率。</text><text x="72.00 76.71 80.09" y="469.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.6</text><text x="91.50 104.50 117.50 130.50" y="469.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">我们对模型的大部分评估均在</text><text x="217.89 224.78 231.36 235.61 242.20 246.89 253.32 259.89 262.98" y="497.45" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73" y="497.45" font-size="11.00" class="sc-notoserifcjksc">内部进行。不过，作为我们前沿合规框架（</text><text x="480.73 486.65 491.33 497.77 504.34 508.60 511.69 517.65" y="497.45" font-size="11.00" class="sc-loraregular">Frontier</text><text x="72.00 79.69 86.12 95.96 102.53 105.52 108.61 114.28 120.96 126.76 132.72 135.61 141.53 146.22 151.89 161.73 167.65 176.32 182.76 187.48" y="513.07" font-size="11.00" class="sc-loraregular">Compliance Framework</text><text x="193.39" y="513.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="204.39 208.79 214.74 222.43 228.45" y="513.07" font-size="11.00" class="sc-loraregular">“FCF”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">本（例如未经无害性训练的版本、经过无害性训练的版本，或两个版本都测试）。他们的意见有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">助于我们就系统性风险领域作出风险判定，并为我们的发布决策流程提供参考。有关我们如何在</text><text x="72.00 77.95 85.64" y="559.93" font-size="11.00" class="sc-loraregular">FCF</text><text x="94.56 105.56 116.56 127.56 138.56 149.56 160.56 171.56 182.56 193.56 204.56 215.56 226.56 237.56 248.56 259.56 270.56 281.56 292.56 303.56" y="559.93" font-size="11.00" class="sc-notoserifcjksc">中征求外部专家意见的更多信息，请参阅我们</text><text x="314.56 325.56 336.56 347.56 358.56 369.56" y="559.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">合规框架的第</text><text x="383.45" y="559.93" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="392.34 403.34" y="559.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="626.99" font-size="11.00" class="sc-notoserifcjksc">我们感谢所有外部测试方对模型开展评估并与我们分享结果。他们的具体贡献将在下文中介绍。</text><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="314.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="314.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https
