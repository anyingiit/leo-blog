.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="116.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="174.14" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="250.83" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="264.72" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="318.55" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新大语言模型（</text><text x="450.55" y="116.21" font-size="11.00" class="sc-loraregular sc-k">large language</text><text x="72.00" y="131.83" font-size="11.00" class="sc-loraregular">model</text><text x="103.80" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的两种配置。前者</text><text x="205.69" y="131.83" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="255.65" y="131.83" font-size="11.00" class="sc-notoserifcjksc">目前仅通过</text><text x="313.54" y="131.83" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Project Glasswing</text><text x="407.83" y="131.83" font-size="11.00" class="sc-notoserifcjksc">向负责防御全球关键软件基</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">础设施的经审核合作伙伴提供。</text><text x="226.00" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="406.91" y="147.45" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="456.86" y="147.45" font-size="11.00" class="sc-notoserifcjksc">具有相同的底层</text><text x="72.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">模型权重，但增设了额外的安全防护措施，以防止其在网络安全和生物学方面被滥用。</text><text x="72.00" y="211.71" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.1</text><text x="87.89" y="211.71" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">训练数据与流程</text><text x="72.00" y="239.60" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="239.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84" y="239.60" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="174.24" y="239.60" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一种专有组合，包括来自互联网的公开信息、公开和非公开数</text><text x="72.00" y="255.22" font-size="11.00" class="sc-notoserifcjksc">据集，以及由其他模型生成的合成数据。在整个训练过程中，我们使用了多种数据清洗和过滤方</text><text x="72.00" y="270.84" font-size="11.00" class="sc-notoserifcjksc">法，包括去重和分类。</text><text x="72.00" y="320.56" font-size="11.00" class="sc-notoserifcjksc">我们使用一个名为</text><text x="162.89" y="320.56" font-size="11.00" class="sc-loraregular sc-k">ClaudeBot</text><text x="218.54" y="320.56" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取训练数据。该爬虫遵循行业标准做</text><text x="72.00" y="336.18" font-size="11.00" class="sc-notoserifcjksc">法，尊重网站运营者通过</text><text x="193.00 197.40 202.09 208.52 214.92 221.36 225.62 230.71 233.28 237.67 243.50 247.76" y="336.18" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="251.60" y="336.18" font-size="11.00" class="sc-notoserifcjksc">指令所表明的是否允许抓取其网站内容的意愿。我们不会访</text><text x="72.00" y="351.80" font-size="11.00" class="sc-notoserifcjksc">问受密码保护的页面，也不会访问需要登录或</text><text x="294.89" y="351.80" font-size="11.00" class="sc-loraregular sc-k">CAPTCHA</text><text x="349.11" y="351.80" font-size="11.00" class="sc-notoserifcjksc">验证的页面。我们会对所使用的训练数</text><text x="72.00" y="367.42" font-size="11.00" class="sc-notoserifcjksc">据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它何时抓取了其网页，并向</text><text x="72.00" y="383.04" font-size="11.00" class="sc-notoserifcjksc">我们表明他们的偏好。</text><text x="72.00" y="450.09" font-size="11.00" class="sc-notoserifcjksc">预训练之后，模型经过了大量的后训练和微调，目标是使其成为一个行为符合</text><text x="448.89" y="450.09" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="487.18" y="450.09" font-size="11.00" class="sc-notoserifcjksc">宪法</text><text x="72.00" y="465.71" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="465.71" font-size="11.00" class="sc-loraregular sc-k">constitution</text><text x="145.81" y="465.71" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="72.00" y="514.86" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="514.86" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常会使用与用户输入相同的语言进行回复。输出质量因语言而异。该模</text><text x="72.00" y="530.48" font-size="11.00" class="sc-notoserifcjksc">型仅输出文本。</text><text x="72.00" y="561.78" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.2</text><text x="90.64" y="561.78" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">众包工作者</text><text x="72.00" y="589.67" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="589.67" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试帮助改进我</text><text x="72.00" y="605.29" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00" y="605.29" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="180.83" y="605.29" font-size="11.00" class="sc-notoserifcjksc">只与这样的平台合作：它们认同我们为工作者提供公平且合乎道德的报酬</text><text x="72.00" y="620.91" font-size="11.00" class="sc-notoserifcjksc">这一理念，并承诺无论在何地都践行安全的工作场所做法，遵循我们在采购合同中详细规定的众</text><text x="72.00" y="636.53" font-size="11.00" class="sc-notoserifcjksc">包工作者福祉标准。</text><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="313.54" y="123.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="313.54" y="123.03" width="36.62" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="350.16" y="123.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="353.05" y="123.03" width="51.89" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.3</text><text x="90.97" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">使用政策与支持</text><text x="72.00" y="111.04" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="111.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="111.04" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="111.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83" y="111.04" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="256.36" y="111.04" font-size="11.00" class="sc-notoserifcjksc">）详细列明了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景中的使用所提出的要求。</text><text x="72.00" y="159.61" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89" y="159.61" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="169.83" y="159.61" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="159.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持</text><text x="268.83" y="159.61" font-size="11.00" class="sc-notoserifcjksc">页面。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="191.99" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="191.99" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76" y="191.99" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="277.59" y="191.99" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48" y="191.99" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95" y="191.99" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95" y="191.99" font-size="11.00" class="sc-loraregular sc-k">European Economic</text><text x="72.00" y="207.61" font-size="11.00" class="sc-loraregular sc-k">Area</text><text x="95.19" y="207.61" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="238.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.4</text><text x="91.77" y="238.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型评估</text><text x="72.00" y="266.80" font-size="11.00" class="sc-notoserifcjksc">在训练过程的不同时间点，我们会获取模型的不同</text><text x="314.00" y="266.80" font-size="11.00" class="sc-loraregular">“</text><text x="318.40" y="266.80" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="340.40" y="266.80" font-size="11.00" class="sc-loraregular">”</text><text x="344.24" y="266.80" font-size="11.00" class="sc-notoserifcjksc">。除非另有说明，本系统卡（</text><text x="487.24" y="266.80" font-size="11.00" class="sc-loraregular sc-k">System</text><text x="72.00" y="282.42" font-size="11.00" class="sc-loraregular sc-k">Card</text><text x="96.63" y="282.42" font-size="11.00" class="sc-notoserifcjksc">）中讨论的所有评估均基于</text><text x="231.52" y="282.42" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="319.76" y="282.42" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="333.66" y="282.42" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="410.35" y="282.42" font-size="11.00" class="sc-notoserifcjksc">的最终快照。其他开发者</text><text x="72.00" y="298.04" font-size="11.00" class="sc-notoserifcjksc">模型的数据通常取自各开发者公布的结果或公开排行榜，但在某些情况下，我们自行运行了评</text><text x="72.00" y="313.66" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00" y="363.96" font-size="11.00" class="sc-notoserifcjksc">在本系统卡中，我们根据具体情境决定评估</text><text x="283.89" y="363.96" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="330.95" y="363.96" font-size="11.00" class="sc-notoserifcjksc">（不带安全防护措施，反映模型的底层能</text><text x="72.00" y="379.58" font-size="11.00" class="sc-notoserifcjksc">力）还是</text><text x="118.89" y="379.58" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="154.40" y="379.58" font-size="11.00" class="sc-notoserifcjksc">（带安全防护措施，与全面开放后的用户体验一致）。全文都会清楚注明我们选</text><text x="72.00" y="395.20" font-size="11.00" class="sc-notoserifcjksc">择评估的是两者中的哪一个。</text><text x="72.00" y="443.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.5</text><text x="91.55" y="443.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">新型安全防护措施</text><text x="321.61" y="471.15" font-size="11.00" class="sc-loraregular">/</text><text x="329.20" y="471.15" font-size="11.00" class="sc-notoserifcjksc">生物用途的</text><text x="387.10" y="471.15" font-size="11.00" class="sc-loraregular sc-k">ASL-3</text><text x="420.27" y="471.15" font-size="11.00" class="sc-notoserifcjksc">拦截分类器，这类分类器</text><text x="244.61" y="486.77" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="321.30" y="486.77" font-size="11.00" class="sc-notoserifcjksc">在部署时还配备了多项新型安全防护措施，使</text><text x="72.00" y="502.39" font-size="11.00" class="sc-notoserifcjksc">我们能够安全地将其面向通用用途发布。这些新的安全防护措施是一些分类器，会在检测到与网</text><text x="72.00" y="518.01" font-size="11.00" class="sc-notoserifcjksc">络安全、生物学和化学、蒸馏尝试或加速前沿</text><text x="294.89" y="518.01" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="518.01" font-size="11.00" class="sc-notoserifcjksc">开发相关的话题时触发。网络安全、生物学和化</text><text x="72.00" y="533.63" font-size="11.00" class="sc-notoserifcjksc">学分类器背后的具体考量已在我们的</text><text x="248.00" y="533.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">发布博客文章</text><text x="314.00" y="533.63" font-size="11.00" class="sc-notoserifcjksc">中说明。</text><text x="72.00" y="600.69" font-size="11.00" class="sc-notoserifcjksc">我们与前沿</text><text x="129.89" y="600.69" font-size="11.00" class="sc-loraregular">LLM</text><text x="155.60" y="600.69" font-size="11.00" class="sc-notoserifcjksc">开发相关的新安全防护措施，源于我们</text><text x="342.60" y="600.69" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="370.42" y="600.69" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="384.31" y="600.69" font-size="11.00" class="sc-loraregular" fill="#0000ff">2</text><text x="393.11" y="600.69" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="448.11" y="600.69" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="459.11" y="600.69" font-size="11.00" class="sc-loraregular sc-k">Risk Report</text><text x="517.90" y="600.69" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="72.00" y="616.31" font-size="11.00" class="sc-loraregular">6.1</text><text x="87.96" y="616.31" font-size="11.00" class="sc-notoserifcjksc">节中讨论的风险。我们担忧加快</text><text x="244.85" y="616.31" font-size="11.00" class="sc-loraregular">AI</text><text x="258.32" y="616.31" font-size="11.00" class="sc-notoserifcjksc">整体发展步伐所带来的风险，尽管我们对这些风险的严重</text><text x="72.00" y="631.93" font-size="11.00" class="sc-notoserifcjksc">程度仍不确定。具体而言，正如我们当时所写，我们担忧的是</text><text x="369.00" y="631.93" font-size="11.00" class="sc-loraregular">“</text><text x="373.40" y="631.93" font-size="11.00" class="sc-notoserifcjksc">加速其他</text><text x="420.29" y="631.93" font-size="11.00" class="sc-loraregular">AI</text><text x="433.76" y="631.93" font-size="11.00" class="sc-notoserifcjksc">开发者构建与我们的</text><text x="72.00" y="647.55" font-size="11.00" class="sc-notoserifcjksc">系统构成类似风险的强大</text><text x="195.89" y="647.55" font-size="11.00" class="sc-loraregular">AI</text><text x="458.97" y="647.55" font-size="11.00" class="sc-loraregular">”</text><text x="462.81" y="647.55" font-size="11.00" class="sc-notoserifcjksc">。使用</text><text x="498.70" y="647.55" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="663.17" font-size="11.00" class="sc-notoserifcjksc">开发竞争模型本已违反我们的</text><text x="215.00" y="663.17" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">服务条款</text><text x="259.00" y="663.17" font-size="11.00" class="sc-notoserifcjksc">，而通过分类器执行这一限制，可以避免加速那些最愿意</text><text x="72.00" y="678.79" font-size="11.00" class="sc-notoserifcjksc">违反这些条款的行为者。我们的</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="102.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="102.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="158.83" y="102.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="102.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="169.83" y="102.24" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="246.83" y="150.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="246.83" y="150.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/" rel="noopener"><rect x="257.83" y="150 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器仅窄范围地针对前沿</text><text x="206.89" y="82.61" font-size="11.00" class="sc-loraregular">LLM</text><text x="232.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">开发（例如构建预训练流水线、分布式训练基础设施或</text><text x="499.49" y="82.61" font-size="11.00" class="sc-loraregular">ML</text><text x="518.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">加速</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">器设计），应不会影响绝大多数</text><text x="228.89" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="242.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">开发或研究。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">当</text><text x="85.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="115.41" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的回退（</text><text x="159.41" y="147.38" font-size="11.00" class="sc-loraregular">fallback</text><text x="198.62" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）分类器被触发时，由此产生的行为取决于产品端：</text><text x="108.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在客户端应用（网页界面以及桌面和移动应用）中，请求会自动回退到最新的</text><text x="484.89" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="195.38" font-size="11.00" class="sc-loraregular">Opus</text><text x="137.85" y="195.38" font-size="11.00" class="sc-notoserifcjksc">模型（发布时为</text><text x="217.75" y="195.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="300.74" y="195.38" font-size="11.00" class="sc-notoserifcjksc">），并且会告知用户其查询经由哪个模型处理；</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Messages API</text><text x="193.79" y="244.53" font-size="11.00" class="sc-notoserifcjksc">中，默认不会自动回退。请求会被拦截，响应中会返回拒绝原因及结构</text><text x="108.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">化类别。开发者可以在客户端实现重试或回退逻辑，也可以选择启用自动的服务端回退，</text><text x="108.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">此时请求将由指定的回退模型（例如最新的</text><text x="319.89" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="388.04" y="275.77" font-size="11.00" class="sc-notoserifcjksc">模型）重新处理，且回退情况</text><text x="108.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">会体现在响应对象中；</text><text x="108.00" y="341.68" font-size="11.00" class="sc-notoserifcjksc">在某些</text><text x="143.89" y="341.68" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="182.18" y="341.68" font-size="11.00" class="sc-notoserifcjksc">界面中，自动回退到最新的</text><text x="317.08" y="341.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="385.22" y="341.68" font-size="11.00" class="sc-notoserifcjksc">模型是默认行为，且不可配置。</text><text x="108.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">每当发生回退时，都会发出一个会话事件。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">为了更快推出</text><text x="140.89" y="406.45" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="167.51" y="406.45" font-size="11.00" class="sc-notoserifcjksc">，我们优先考虑了分类器的鲁棒性和覆盖范围，但在该模型发布后，我们将</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">努力提升检测方法的精确率。</text><text x="72.00" y="469.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">1.6</text><text x="91.50" y="469.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">我们对模型的大部分评估均在</text><text x="217.89" y="497.45" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="271.73" y="497.45" font-size="11.00" class="sc-notoserifcjksc">内部进行。不过，作为我们前沿合规框架（</text><text x="480.73" y="497.45" font-size="11.00" class="sc-loraregular sc-k">Frontier</text><text x="72.00" y="513.07" font-size="11.00" class="sc-loraregular sc-k">Compliance Framework</text><text x="193.39" y="513.07" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="204.39" y="513.07" font-size="11.00" class="sc-loraregular sc-k">“FCF”</text><text x="72.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">本（例如未经无害性训练的版本、经过无害性训练的版本，或两个版本都测试）。他们的意见有</text><text x="72.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">助于我们就系统性风险领域作出风险判定，并为我们的发布决策流程提供参考。有关我们如何在</text><text x="72.00" y="559.93" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="94.56" y="559.93" font-size="11.00" class="sc-notoserifcjksc">中征求外部专家意见的更多信息，请参阅我们</text><text x="314.56" y="559.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">合规框架的第</text><text x="383.45" y="559.93" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="392.34" y="559.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节。</text><text x="72.00" y="626.99" font-size="11.00" class="sc-notoserifcjksc">我们感谢所有外部测试方对模型开展评估并与我们分享结果。他们的具体贡献将在下文中介绍。</text><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="314.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="314.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="325.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="325.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="336.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="336.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="347.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="347.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="358.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="358.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="369.56" y="551.13" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="369.56" y="551.13" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="380.56" y="551.13" width="2.89" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="383.45" y="551.13" width="5.99" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="389.45" y="551.13" width="2.89" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?" rel="noopener"><rect x="392.34" y="551.13" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
