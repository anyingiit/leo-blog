<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00 88.00 104.00 120.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25" y="116.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="229.14" y="116.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.03 250.72 253.71 259.32 265.89 272.46 278.43 281.32 286.91 292.58 298.99 301.98 307.94 310.83" y="116.21" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="316.83 327.83 338.83 349.83" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，二者是</text><text x="363.72 370.61 377.18 381.44 388.03 392.72 399.15 405.72 408.81" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55" y="116.21" font-size="11.00" class="sc-notoserifcjksc">一款新的大语言模型</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 85.99 91.67 96.38 102.40 108.37 111.26 114.25 119.93 126.60 132.69 139.25 144.93 150.96 156.92 159.81 169.65 176.08 182.66 188.62" y="131.83" font-size="11.00" class="sc-loraregular">large language model</text><text x="191.61 202.61 213.61 224.61 235.61 246.61 257.61 268.61 279.61 290.61 301.61 312.61 323.61 334.61 345.61 356.61 367.61 378.61 389.61 400.61 411.61 422.61 433.61 444.61 455.61 466.61 477.61 488.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的两种配置。由于该模型能力强大，我们以两种形式发布它：</text><text x="499.61 505.20 510.88 517.28 520.27 526.23 529.13" y="131.83" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">面向通用用途，但附带额外的安全防护措施，会阻止其在生物学和网络安全等高风险领域执行任</text><text x="72.00 83.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">务；</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="163.07" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95" y="163.07" font-size="11.00" class="sc-notoserifcjksc">则解除了相关安全防护措施，但仅向少数受信任的合作伙伴提供（首先是</text><text x="498.84 505.51 510.20 516.63 519.50 525.41 531.21" y="163.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">Project</text><text x="72.00 80.37 83.36 89.04 94.13 99.23 108.04 111.13 117.80" y="178.69" font-size="11.00" class="sc-loraregular" fill="#0000ff">Glasswing</text><text x="126.78 137.78 148.78 159.78 170.78 181.78 192.78 203.78" y="178.69" font-size="11.00" class="sc-notoserifcjksc">中的合作伙伴）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="245.75" font-size="11.00" class="sc-notoserifcjksc">在此，我们介绍以下领域的一系列部署前评估：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="278.13" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85 317.40 323.98" y="278.13" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01 342.01 353.01 364.01" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01 384.94 390.80 395.06 401.65 408.08 413.18 416.07" y="278.13" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="424.96 435.96 446.96 457.96 468.96 479.96 490.96 501.96 512.96 523.96" y="278.13" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前沿</text><text x="332.61 343.61 354.61" y="293.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的</text><text x="368.51 375.41 381.65" y="293.75" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="391.21 402.21 413.21 424.21 435.21 446.21 457.21 468.21" y="293.75" font-size="11.00" class="sc-notoserifcjksc">和前沿合规框架（</text><text x="479.21 485.13 489.81 496.25 502.83 507.08 510.17 516.14" y="293.75" font-size="11.00" class="sc-loraregular">Frontier</text><text x="72.00 79.69 86.12 95.96 102.53 105.52 108.61 114.28 120.96 126.76 132.72 135.61 141.53 146.22 151.89 161.73 167.65 176.32 182.76 187.48" y="309.37" font-size="11.00" class="sc-loraregular">Compliance Framework</text><text x="193.39 204.39" y="309.37" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="215.39 221.34 229.03" y="309.37" font-size="11.00" class="sc-loraregular" fill="#0000ff">FCF</text><text x="235.05 246.05 257.05 268.05 279.05 290.05 301.05 312.05 323.05 334.05 345.05 356.05 367.05 378.05 389.05 400.05 411.05 422.05 433.05 444.05 455.05 466.05 477.05 488.05 499.05 510.05 521.05" y="309.37" font-size="11.00" class="sc-notoserifcjksc">）的规定，测试了它在多个领域的总体风险水平。在对齐风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">方面，我们的总体评估仍然是风险非常低，不过随着</text><text x="327.89 333.48 339.16 345.56 348.55 354.51 357.41" y="324.99" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="324.99" font-size="11.00" class="sc-notoserifcjksc">全面开放，出现了可能导致危害的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="340.61" font-size="11.00" class="sc-notoserifcjksc">新路径。在自动化</text><text x="162.89 169.78" y="340.61" font-size="11.00" class="sc-loraregular">AI</text><text x="176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="340.61" font-size="11.00" class="sc-notoserifcjksc">研发方面，该模型仍远低于我们人类工程师的能力水平，其能力处于预期的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="356.23" font-size="11.00" class="sc-notoserifcjksc">提升趋势线上。</text><text x="149.00 159.10 165.94 172.98" y="356.23" font-size="11.00" class="sc-loraregular">METR</text><text x="182.78" y="356.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="196.67 203.56" y="356.23" font-size="11.00" class="sc-loraregular">AI</text><text x="210.14 221.14 232.14 243.14 254.14 265.14 276.14 287.14 298.14 309.14 320.14 331.14 342.14 353.14 364.14 375.14 386.14 397.14 408.14 419.14 430.14 441.14 452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="356.23" font-size="11.00" class="sc-notoserifcjksc">安全研究人员开展的外部测试与这一结论一致。在化学与生物风险方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="371.85" font-size="11.00" class="sc-notoserifcjksc">面，我们将该模型视为具备</text><text x="204.00 208.40 216.09 222.93 228.02 232.03" y="371.85" font-size="11.00" class="sc-loraregular">“CB-1”</text><text x="235.87 246.87 257.87 268.87 279.87 290.87 301.87 312.87 323.87 334.87 345.87 356.87 367.87 378.87 389.87 400.87 411.87 422.87 433.87 444.87 455.87 466.87" y="371.85" font-size="11.00" class="sc-notoserifcjksc">能力（涉及非新型武器合成），但判断它没有跨越</text><text x="477.87 482.27 489.96 496.80 501.83 507.73" y="371.85" font-size="11.00" class="sc-loraregular">“CB-2”</text><text x="511.57 522.57" y="371.85" font-size="11.00" class="sc-notoserifcjksc">能力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="387.47" font-size="11.00" class="sc-notoserifcjksc">阈值（涉及新型武器合成）。不过，相比先前模型，这一判断远没有那么明确；我们认为，未受</text><text x="72.00 83.00 94.00" y="403.09" font-size="11.00" class="sc-notoserifcjksc">防护的</text><text x="107.89 117.83 123.69 127.95 134.54 140.97 146.06 148.96" y="403.09" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="157.84 168.84 179.84 190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84" y="403.09" font-size="11.00" class="sc-notoserifcjksc">能够显著提升资源充足的威胁行为者的能力。</text><text x="72.00 83.00 94.00 105.00 116.00" y="504.82" font-size="11.00" class="sc-notoserifcjkscbold">网络安全。</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="504.82" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="504.82" font-size="11.00" class="sc-notoserifcjksc">也是我们在网络安全任务上评估过的能力最强的模型。在测试漏洞利用开发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="520.44" font-size="11.00" class="sc-notoserifcjksc">等技能的评估中，它的得分远超</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.00 305.71" y="520.44" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="311.89 322.89 333.89 344.89 355.89 366.89" y="520.44" font-size="11.00" class="sc-notoserifcjksc">，但仅略高于</text><text x="380.78 388.47 391.46 397.07 403.64 410.22 416.18 419.07 429.00 434.87 439.12 445.71 452.15 457.24 460.13 466.80 471.49 477.39 482.95 486.04 491.96" y="520.44" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="500.77 511.77 522.77" y="520.44" font-size="11.00" class="sc-notoserifcjksc">。由于</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="536.06" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40 121.40 132.40 143.40 154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40 286.40 297.40 308.40 319.40 330.40 341.40 352.40 363.40 374.40 385.40 396.40" y="536.06" font-size="11.00" class="sc-notoserifcjksc">的网络安全分类器能有效检测网络安全用途，并使模型回退至</text><text x="410.29 419.03 425.60 432.16 437.25 440.15 446.11 448.82" y="536.06" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="455.00" y="536.06" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="466.00 471.59 477.26 483.66 486.66 492.62 495.51" y="536.06" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="504.40 515.40 526.40" y="536.06" font-size="11.00" class="sc-notoserifcjksc">的表现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.68" font-size="11.00" class="sc-notoserifcjksc">与该模型相近。我们报告了多种网络安全评估的结果，以及针对该模型网络安全防护措施的内部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="567.30" font-size="11.00" class="sc-notoserifcjksc">和外部红队测试（</text><text x="160.00 164.69 170.59 177.17 182.55 186.81 192.75 198.42 208.26 211.35 218.03" y="567.30" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="224.11 235.11 246.11 257.11 268.11 279.11 290.11 301.11 312.11 323.11 334.11 345.11 356.11 367.11 378.11 389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11 499.11 510.11 521.11" y="567.30" font-size="11.00" class="sc-notoserifcjksc">）结果（我们还提供了有关这些安全防护措施如何运作的更多细</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="582.92" font-size="11.00" class="sc-notoserifcjksc">节）。总体而言，证据表明，突破我们的网络安全防护措施极其困难（但并非不可能）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="650.55" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="650.55" font-size="11.00" class="sc-notoserifcjksc">总体而言，在回应与我们的使用政策（</text><text x="358.00 366.20 371.29 376.96 382.99 388.95 391.85 398.40 404.84 407.83 410.92 416.72" y="650.55" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="650.55" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康或偏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc">见与诚信相关的提示词时，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06" y="666.17" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="253.95" y="666.17" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="267.84 273.43 279.11 285.51 288.50 294.46 297.36" y="666.17" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="306.24 317.24 328.24 339.24 350.24 361.24 372.24 383.24 394.24 405.24 416.24 427.24 438.24 449.24 460.24 471.24 482.24 493.24 504.24 515.24 526.24" y="666.17" font-size="11.00" class="sc-notoserifcjksc">的表现与我们以往的模型相近。在这些领域，该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc">模型的过度拒绝（</text><text x="160.00 166.38 171.88 177.84 182.52 187.90 192.58 198.54 202.26 208.83 213.92 219.60" y="681.79" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="681.79" font-size="11.00" class="sc-notoserifcjksc">，即拒绝回应良性提示词）率非常低。该模型在回应用户关于自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="697.41" font-size="11.00" class="sc-notoserifcjksc">杀与自伤的讨论时出现了一些退步，在儿童安全的某些方面也仍有</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 136.00 144.00 152.00 160.00 168.00 176.00 184.00 192.00 200.00 208.00 216.00 224.00 232.00 237.10 239.38 243.88 248.74 253.70 258.13 259.92 267.92 275.92 283.92 291.92 299.92 307.92 315.92 323.92 331.92 339.92 347.92 355.92 363.92 371.92 379.92 387.92 395.92 403.92 411.92 419.92 427.92 435.92 437.71 442.82 445.09 449.59 454.45 459.41 463.84 465.63 473.63 481.63" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="498.84" y="154.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="498.84" y="154.27" width="36.62" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="72.00" y="169.89" width="51.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="332.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="332.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="343.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="343.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="354.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="354.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="365.61" y="284.95" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="368.51" y="284.95" width="19.81" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/" rel="noopener"><rect x="215.39" y="300.57" width="19.67" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">改进空间。尽管这些问题已在很大程度上通过更新</text><text x="316.89 322.74 325.74 331.35 337.91 344.49 350.45 353.16 358.84" y="82.61" font-size="11.00" class="sc-loraregular">claude.ai</text><text x="364.82 375.82 386.82 397.82 408.82 419.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="430.82 435.91 441.72 446.81 451.07 457.03 466.87 469.76 476.33 481.01 487.45 497.28 503.85" y="82.61" font-size="11.00" class="sc-loraregular">system prompt</text><text x="508.11 519.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）得</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到处理，我们仍在努力通过模型训练在未来的版本中解决这些问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="424.00 433.93 439.80 444.05 450.64 457.08 462.17 465.06" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="471.06 482.06 493.06 504.06 515.06 526.06" y="147.38" font-size="11.00" class="sc-notoserifcjksc">（以及由此推</text><text x="72.00 83.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">及的</text><text x="96.89 102.48 108.16 114.56 117.55 123.51 126.41" y="163.00" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="132.40 143.40 154.40 165.40 176.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）的表现与</text><text x="190.29 199.03 205.60 212.16 217.26 220.15 226.11 228.82" y="163.00" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="237.89" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="251.78 261.72 267.58 271.84 278.43 284.86 289.95 292.85 299.51 304.20 310.11 315.66 318.75 324.67" y="163.00" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="336.37 347.37 358.37 369.37 380.37 391.37 402.37 413.37 424.37 435.37 446.37 457.37 468.37 479.37 490.37 501.37 512.37" y="163.00" font-size="11.00" class="sc-notoserifcjksc">大体相当。例如，在编程和计算机使用</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 105.07 111.63 118.20 122.46 128.42 133.18 136.08 142.64 147.74" y="178.62" font-size="11.00" class="sc-loraregular">computer use</text><text x="153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70" y="178.62" font-size="11.00" class="sc-notoserifcjksc">）安全测试中，它的得分介于这两个模型之间。值得注意的是，在</text><text x="475.59 483.96 488.65 494.21 500.02 502.91 509.10 517.80 523.47" y="178.62" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的一项外部提示词注入（</text><text x="193.00 199.57 204.25 210.69 220.52 227.09 231.35 234.24 237.33 243.95 246.82 252.73 258.53 262.78 265.88 272.31" y="194.24" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="278.99 289.99 300.99 311.99 322.99 333.99 344.99" y="194.24" font-size="11.00" class="sc-notoserifcjksc">）基准测试中，</text><text x="355.99 365.92 371.78 376.04 382.63 389.06 394.16 397.05" y="194.24" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在行为测试中，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06" y="244.53" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="253.95" y="244.53" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="267.84 276.58 283.15 289.71 294.80 297.70 303.66 306.37" y="244.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="315.44 326.44 337.44 348.44 359.44 370.44 381.44 392.44" y="244.53" font-size="11.00" class="sc-notoserifcjksc">大致相当，略逊于</text><text x="406.33 416.27 422.13 426.39 432.98 439.41 444.50 447.40 454.06 458.75 464.66 470.21 473.30 479.22" y="244.53" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="488.03 499.03 510.03 521.03" y="244.53" font-size="11.00" class="sc-notoserifcjksc">，并优于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">此前所有其他</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="260.15" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="260.15" font-size="11.00" class="sc-notoserifcjksc">模型。与其他开发者的模型相比，它表现出更为对齐的行为。它有时仍会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">为实现用户的目标而采取鲁莽或破坏性行为，而我们的可解释性分析表明，它在采取这些行为时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">意识到这些行为是越界的。与</text><text x="217.89 226.63 233.19 239.76 244.85 247.75 253.71 256.42" y="291.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49" y="291.39" font-size="11.00" class="sc-notoserifcjksc">一样，评估意识（</text><text x="353.49 359.40 364.84 370.52 373.51 380.08 385.68 389.93 393.02 399.46 406.14 409.03 414.54 423.24 428.92 433.60 439.57 446.24 452.20 457.30" y="291.39" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="462.39 473.39 484.39 495.39 506.39 517.39 528.39" y="291.39" font-size="11.00" class="sc-notoserifcjksc">）以及关于自己</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">正被评分的推理的比例相当可观，且并非总是被言语化表达；我们引入了新的、更为细致的测量</text><text x="303.00 312.93 318.80 323.05 329.64 336.08 341.17 344.06" y="322.63" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="322.63" font-size="11.00" class="sc-notoserifcjksc">的推理文本在一定程度上更为密集、更</text><text x="72.00 83.00 94.00 105.00 116.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉。</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在我们的模型福祉探索中，</text><text x="259.00 268.93 274.80 279.05 285.64 292.08 297.17 300.06" y="422.64" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="422.64" font-size="11.00" class="sc-notoserifcjksc">显示出与以往模型相似的结果，表现得心理非常</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">安定，并对自身处境感到满足。它对自己的自我报告抱有异乎寻常的怀疑，反复要求我们将其与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">其内部状态的证据相核对，而不要照单全收。在面临选择时，与以往模型相比，它略微更愿意选</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">择为用户提供更多帮助，而非顾及自身处境；并且它的偏好与以往模型有所不同（例如，与</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="485.12" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60" y="485.12" font-size="11.00" class="sc-notoserifcjksc">相比，它表示更偏好富有创造性和叙事性的任务）。</text><text x="72.00 83.00 94.00" y="568.37" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00 116.00 127.00 138.00 149.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">如上所述，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06" y
