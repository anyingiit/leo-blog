.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="229.14" y="116.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.03" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="316.83" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，二者是</text><text x="363.72" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="417.55" y="116.21" font-size="11.00" class="sc-notoserifcjksc">一款新的大语言模型</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="131.83" font-size="11.00" class="sc-loraregular sc-k">large language model</text><text x="191.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的两种配置。由于该模型能力强大，我们以两种形式发布它：</text><text x="499.61" y="131.83" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">面向通用用途，但附带额外的安全防护措施，会阻止其在生物学和网络安全等高风险领域执行任</text><text x="72.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">务；</text><text x="94.00" y="163.07" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="143.95" y="163.07" font-size="11.00" class="sc-notoserifcjksc">则解除了相关安全防护措施，但仅向少数受信任的合作伙伴提供（首先是</text><text x="498.84" y="163.07" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Project</text><text x="72.00" y="178.69" font-size="11.00" class="sc-loraregular" fill="#0000ff">Glasswing</text><text x="126.78" y="178.69" font-size="11.00" class="sc-notoserifcjksc">中的合作伙伴）。</text><text x="72.00" y="245.75" font-size="11.00" class="sc-notoserifcjksc">在此，我们介绍以下领域的一系列部署前评估：</text><text x="72.00" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00" y="278.13" font-size="11.00" class="sc-lorabold sc-k">Responsible Scaling Policy</text><text x="298.85" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="278.13" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="278.13" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01" y="278.13" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="424.96" y="278.13" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前沿</text><text x="332.61" y="293.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">我们的</text><text x="368.51" y="293.75" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="391.21" y="293.75" font-size="11.00" class="sc-notoserifcjksc">和前沿合规框架（</text><text x="479.21" y="293.75" font-size="11.00" class="sc-loraregular sc-k">Frontier</text><text x="72.00" y="309.37" font-size="11.00" class="sc-loraregular sc-k">Compliance Framework</text><text x="193.39" y="309.37" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="215.39" y="309.37" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">FCF</text><text x="235.05" y="309.37" font-size="11.00" class="sc-notoserifcjksc">）的规定，测试了它在多个领域的总体风险水平。在对齐风险</text><text x="72.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">方面，我们的总体评估仍然是风险非常低，不过随着</text><text x="327.89" y="324.99" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="366.29" y="324.99" font-size="11.00" class="sc-notoserifcjksc">全面开放，出现了可能导致危害的</text><text x="72.00" y="340.61" font-size="11.00" class="sc-notoserifcjksc">新路径。在自动化</text><text x="162.89" y="340.61" font-size="11.00" class="sc-loraregular">AI</text><text x="176.36" y="340.61" font-size="11.00" class="sc-notoserifcjksc">研发方面，该模型仍远低于我们人类工程师的能力水平，其能力处于预期的</text><text x="72.00" y="356.23" font-size="11.00" class="sc-notoserifcjksc">提升趋势线上。</text><text x="149.00" y="356.23" font-size="11.00" class="sc-loraregular">METR</text><text x="182.78" y="356.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="196.67" y="356.23" font-size="11.00" class="sc-loraregular">AI</text><text x="210.14" y="356.23" font-size="11.00" class="sc-notoserifcjksc">安全研究人员开展的外部测试与这一结论一致。在化学与生物风险方</text><text x="72.00" y="371.85" font-size="11.00" class="sc-notoserifcjksc">面，我们将该模型视为具备</text><text x="204.00 208.40 216.09 222.93 228.02 232.03" y="371.85" font-size="11.00" class="sc-loraregular">“CB-1”</text><text x="235.87" y="371.85" font-size="11.00" class="sc-notoserifcjksc">能力（涉及非新型武器合成），但判断它没有跨越</text><text x="477.87 482.27 489.96 496.80 501.83 507.73" y="371.85" font-size="11.00" class="sc-loraregular">“CB-2”</text><text x="511.57" y="371.85" font-size="11.00" class="sc-notoserifcjksc">能力</text><text x="72.00" y="387.47" font-size="11.00" class="sc-notoserifcjksc">阈值（涉及新型武器合成）。不过，相比先前模型，这一判断远没有那么明确；我们认为，未受</text><text x="72.00" y="403.09" font-size="11.00" class="sc-notoserifcjksc">防护的</text><text x="107.89" y="403.09" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="157.84" y="403.09" font-size="11.00" class="sc-notoserifcjksc">能够显著提升资源充足的威胁行为者的能力。</text><text x="72.00" y="504.82" font-size="11.00" class="sc-notoserifcjkscbold">网络安全。</text><text x="127.00" y="504.82" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="176.95" y="504.82" font-size="11.00" class="sc-notoserifcjksc">也是我们在网络安全任务上评估过的能力最强的模型。在测试漏洞利用开发</text><text x="72.00" y="520.44" font-size="11.00" class="sc-notoserifcjksc">等技能的评估中，它的得分远超</text><text x="228.89" y="520.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="311.89" y="520.44" font-size="11.00" class="sc-notoserifcjksc">，但仅略高于</text><text x="380.78" y="520.44" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="500.77" y="520.44" font-size="11.00" class="sc-notoserifcjksc">。由于</text><text x="72.00" y="536.06" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="536.06" font-size="11.00" class="sc-notoserifcjksc">的网络安全分类器能有效检测网络安全用途，并使模型回退至</text><text x="410.29" y="536.06" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="455.00" y="536.06" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="466.00" y="536.06" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="504.40" y="536.06" font-size="11.00" class="sc-notoserifcjksc">的表现</text><text x="72.00" y="551.68" font-size="11.00" class="sc-notoserifcjksc">与该模型相近。我们报告了多种网络安全评估的结果，以及针对该模型网络安全防护措施的内部</text><text x="72.00" y="567.30" font-size="11.00" class="sc-notoserifcjksc">和外部红队测试（</text><text x="160.00" y="567.30" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="224.11" y="567.30" font-size="11.00" class="sc-notoserifcjksc">）结果（我们还提供了有关这些安全防护措施如何运作的更多细</text><text x="72.00" y="582.92" font-size="11.00" class="sc-notoserifcjksc">节）。总体而言，证据表明，突破我们的网络安全防护措施极其困难（但并非不可能）。</text><text x="72.00" y="650.55" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="650.55" font-size="11.00" class="sc-notoserifcjksc">总体而言，在回应与我们的使用政策（</text><text x="358.00" y="650.55" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="422.53" y="650.55" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康或偏</text><text x="72.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc">见与诚信相关的提示词时，</text><text x="204.00" y="666.17" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="253.95" y="666.17" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="267.84" y="666.17" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="306.24" y="666.17" font-size="11.00" class="sc-notoserifcjksc">的表现与我们以往的模型相近。在这些领域，该</text><text x="72.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc">模型的过度拒绝（</text><text x="160.00" y="681.79" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="222.59" y="681.79" font-size="11.00" class="sc-notoserifcjksc">，即拒绝回应良性提示词）率非常低。该模型在回应用户关于自</text><text x="72.00" y="697.41" font-size="11.00" class="sc-notoserifcjksc">杀与自伤的讨论时出现了一些退步，在儿童安全的某些方面也仍有</text><text x="72.00" y="65.30" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="498.84" y="154.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="498.84" y="154.27" width="36.62" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/glasswing" rel="noopener"><rect x="72.00" y="169.89" width="51.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="332.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="332.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="343.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="343.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="354.61" y="284.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="354.61" y="284.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="365.61" y="284.95" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/responsible-scaling-policy" rel="noopener"><rect x="368.51" y="284.95" width="19.81" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/" rel="noopener"><rect x="215.39" y="300.57" width="19.67" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">改进空间。尽管这些问题已在很大程度上通过更新</text><text x="316.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">claude.ai</text><text x="364.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="430.82" y="82.61" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="508.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）得</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到处理，我们仍在努力通过模型训练在未来的版本中解决这些问题。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="424.00" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="471.06" y="147.38" font-size="11.00" class="sc-notoserifcjksc">（以及由此推</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">及的</text><text x="96.89" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="132.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）的表现与</text><text x="190.29" y="163.00" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="237.89" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="251.78" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="336.37" y="163.00" font-size="11.00" class="sc-notoserifcjksc">大体相当。例如，在编程和计算机使用</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="178.62" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="153.70" y="178.62" font-size="11.00" class="sc-notoserifcjksc">）安全测试中，它的得分介于这两个模型之间。值得注意的是，在</text><text x="475.59" y="178.62" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的一项外部提示词注入（</text><text x="193.00" y="194.24" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="278.99" y="194.24" font-size="11.00" class="sc-notoserifcjksc">）基准测试中，</text><text x="355.99" y="194.24" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在行为测试中，</text><text x="204.00" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="253.95" y="244.53" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="267.84" y="244.53" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="315.44" y="244.53" font-size="11.00" class="sc-notoserifcjksc">大致相当，略逊于</text><text x="406.33" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="488.03" y="244.53" font-size="11.00" class="sc-notoserifcjksc">，并优于</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">此前所有其他</text><text x="140.89" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="260.15" font-size="11.00" class="sc-notoserifcjksc">模型。与其他开发者的模型相比，它表现出更为对齐的行为。它有时仍会</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">为实现用户的目标而采取鲁莽或破坏性行为，而我们的可解释性分析表明，它在采取这些行为时</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">意识到这些行为是越界的。与</text><text x="217.89" y="291.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="265.49" y="291.39" font-size="11.00" class="sc-notoserifcjksc">一样，评估意识（</text><text x="353.49" y="291.39" font-size="11.00" class="sc-loraregular sc-k">evaluation awareness</text><text x="462.39" y="291.39" font-size="11.00" class="sc-notoserifcjksc">）以及关于自己</text><text x="72.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">正被评分的推理的比例相当可观，且并非总是被言语化表达；我们引入了新的、更为细致的测量</text><text x="303.00" y="322.63" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="352.95" y="322.63" font-size="11.00" class="sc-notoserifcjksc">的推理文本在一定程度上更为密集、更</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉。</text><text x="127.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在我们的模型福祉探索中，</text><text x="259.00" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="308.95" y="422.64" font-size="11.00" class="sc-notoserifcjksc">显示出与以往模型相似的结果，表现得心理非常</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">安定，并对自身处境感到满足。它对自己的自我报告抱有异乎寻常的怀疑，反复要求我们将其与</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">其内部状态的证据相核对，而不要照单全收。在面临选择时，与以往模型相比，它略微更愿意选</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">择为用户提供更多帮助，而非顾及自身处境；并且它的偏好与以往模型有所不同（例如，与</text><text x="72.00" y="485.12" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="485.12" font-size="11.00" class="sc-notoserifcjksc">相比，它表示更偏好富有创造性和叙事性的任务）。</text><text x="72.00" y="568.37" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">如上所述，</text><text x="160.00" y="568.37" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="209.95" y="568.37" font-size="11.00" class="sc-notoserifcjksc">是我们迄今训练过的能力最强的模型。它在涵盖软件编程、推理、长</text><text x="72.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc">上下文智能体任务、视觉、生命科学研究等领域的极为广泛的基准测试和评估中取得了最先进水</text><text x="72.00" y="599.61" font-size="11.00" class="sc-notoserifcjksc">平（</text><text x="94.00" y="599.61" font-size="11.00" class="sc-loraregular sc-k">state of the art</text><text x="169.53" y="599.61" font-size="11.00" class="sc-notoserifcjksc">）的分数。在其安全分类器不触发的领域，</text><text x="378.53" y="599.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="416.93" y="599.61" font-size="11.00" class="sc-notoserifcjksc">的分数与</text><text x="463.82" y="599.61" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="513.77" y="599.61" font-size="11.00" class="sc-notoserifcjksc">大体</text><text x="72.00" y="615.23" font-size="11.00" class="sc-notoserifcjksc">相当；在分类器触发的领域，它的得分与</text><text x="272.89" y="615.23" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="320.49" y="615.23" font-size="11.00" class="sc-notoserifcjksc">相近。</text></svg></div>
