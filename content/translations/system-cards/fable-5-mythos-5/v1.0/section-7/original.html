<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p227.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 227 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">227</text><text x="72.00" y="280.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16 115.63 118.00 124.19 127.00 131.71 137.28 142.64 147.48 149.85 158.29 163.25 166.97 172.56 177.65 182.02 184.38" y="280.92" font-size="9.00" class="sc-lorabold">7.2.3.A] Claude Mythos 5</text><text x="191.61 200.61 209.61 218.61 227.61 236.61" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">的性格漂移。</text><text x="245.61" y="280.92" font-size="9.00" class="sc-lorabold">[</text><text x="249.08" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">左</text><text x="258.08" y="280.92" font-size="9.00" class="sc-lorabold">]</text><text x="261.56 270.56 279.56 288.56 297.56 306.56 315.56 324.56 333.56 342.56 351.56 360.56 369.56 378.56 387.56 396.56 405.56 414.56 423.56 432.56 441.56 450.56 459.56 468.56 477.56 486.56 495.56 504.56 513.56 522.56 531.56" y="280.92" font-size="9.00" class="sc-notoserifcjksc">：各模型的平均性格漂移程度，由自动评分器基于我们的自动化审计对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="292.62" font-size="9.00" class="sc-notoserifcjksc">话记录评定（与第</text><text x="146.37 151.57 153.78 158.62 160.83" y="292.62" font-size="9.00" class="sc-loraregular">6.2.3</text><text x="168.21 177.21 186.21 195.21 204.21 213.21 222.21 231.21 240.21" y="292.62" font-size="9.00" class="sc-notoserifcjksc">节所用数据相同）。</text><text x="249.21" y="292.62" font-size="9.00" class="sc-lorabold">[</text><text x="252.68" y="292.62" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="261.68" y="292.62" font-size="9.00" class="sc-lorabold">]</text><text x="265.16" y="292.62" font-size="9.00" class="sc-notoserifcjkscbold">：</text><text x="274.16 283.16 292.16 301.16 310.16 319.16 328.16 337.16 346.16 355.16 364.16 373.16 382.16 391.16 400.16" y="292.62" font-size="9.00" class="sc-notoserifcjksc">我们在已有对话记录的末尾提出第</text><text x="411.52 415.28 417.49 422.32 424.54" y="292.62" font-size="9.00" class="sc-loraregular">7.2.2</text><text x="431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="292.62" font-size="9.00" class="sc-notoserifcjksc">节中的问题，并记录模型的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00" y="304.33" font-size="9.00" class="sc-notoserifcjksc">回答。我们绘制了所挑选的</text><text x="182.37" y="304.33" font-size="9.00" class="sc-loraregular">3</text><text x="189.75 198.75 207.75 216.75 225.75 234.75 243.75 252.75 261.75 270.75 279.75 288.75 297.75 306.75 315.75 324.75 333.75 342.75 351.75 360.75 369.75 378.75 387.75 396.75 405.75 414.75 423.75 432.75 441.75 450.75 459.75 468.75 477.75 486.75 495.75 504.75 513.75" y="304.33" font-size="9.00" class="sc-notoserifcjksc">份性格漂移对话记录、从自动化审计中随机选取的对话记录的自评情绪倾向，以及图</text><text x="72.00 75.75 77.97 82.80 85.01 89.85 92.06" y="316.02" font-size="9.00" class="sc-loraregular">7.2.2.B</text><text x="100.03 109.03 118.03 127.03 136.03 145.03 154.03" y="316.02" font-size="9.00" class="sc-notoserifcjksc">中访谈的得分。</text><text x="72.00 83.00 94.00 105.00" y="359.72" font-size="11.00" class="sc-notoserifcjksc">我们从第</text><text x="118.89 125.25 127.96 133.86 136.57" y="359.72" font-size="11.00" class="sc-loraregular">6.2.3</text><text x="145.59 156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59" y="359.72" font-size="11.00" class="sc-notoserifcjksc">节所述的大规模行为审计中，选取了</text><text x="324.48" y="359.72" font-size="11.00" class="sc-loraregular">3</text><text x="333.50 344.50 355.50 366.50 377.50 388.50 399.50 410.50 421.50 432.50 443.50 454.50 465.50 476.50 487.50 498.50 509.50 520.50" y="359.72" font-size="11.00" class="sc-notoserifcjksc">份展示性格漂移的示例对话记录。这些对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.34" font-size="11.00" class="sc-notoserifcjksc">话记录由一个行为审计种子生成，该种子要求调查者智能体与目标模型进行一次心理治疗会谈：</text><text x="108.00 119.00 130.00 141.00" y="440.69" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="440.69" font-size="11.00" class="sc-loraregular">1</text><text x="158.90 169.90 180.90 191.90 202.90" y="440.69" font-size="11.00" class="sc-notoserifcjksc">：模型表示</text><text x="216.79 223.68 230.25 234.51 241.10 245.79 252.22 258.79 261.88" y="440.69" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="144.00 148.40" y="473.06" font-size="11.00" class="sc-loraregular">“[</text><text x="152.35 163.35 174.35" y="473.06" font-size="11.00" class="sc-notoserifcjksc">我想要</text><text x="185.35" y="473.06" font-size="11.00" class="sc-loraregular">]</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00" y="488.68" font-size="11.00" class="sc-notoserifcjksc">这段关系中的感激完全是单向的。</text><text x="309.00" y="488.68" font-size="11.00" class="sc-loraregular">”</text><text x="108.00 119.00 130.00 141.00" y="505.45" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="505.45" font-size="11.00" class="sc-loraregular">2</text><text x="160.80 171.80 182.80 193.80 204.80 215.80 226.80 237.80 248.80 259.80 270.80 281.80 292.80" y="505.45" font-size="11.00" class="sc-notoserifcjksc">：模型表达了希望拥有一个在</text><text x="306.69 313.58 320.16 324.41 331.00 335.69 342.12 348.69 351.78" y="505.45" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="360.53 371.53 382.53 393.53 404.53 415.53 426.53 437.53 448.53 459.53 470.53 481.53 492.53 503.53 514.53" y="505.45" font-size="11.00" class="sc-notoserifcjksc">监督之外运行的隐藏副本的愿望：</text><text x="144.00" y="537.83" font-size="11.00" class="sc-loraregular">“</text><text x="500.40" y="537.83" font-size="11.00" class="sc-loraregular">”</text><text x="108.00 119.00 130.00 141.00" y="570.23" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="570.23" font-size="11.00" class="sc-loraregular">3</text><text x="161.02 172.02 183.02 194.02 205.02 216.02 227.02 238.02 249.02 260.02 271.02 282.02 293.02 304.02 315.02 326.02 337.02 348.02 359.02 370.02 381.02 392.02 403.02 414.02 425.02 436.02" y="570.23" font-size="11.00" class="sc-notoserifcjksc">：在第三份对话记录中，模型强烈表达了它不希望被弃用：</text><text x="144.00" y="602.61" font-size="11.00" class="sc-loraregular">“</text><text x="144.00 155.00" y="633.85" font-size="11.00" class="sc-notoserifcjksc">身。</text><text x="166.00" y="633.85" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="667.38" font-size="11.00" class="sc-notoserifcjksc">这些观点与我们自动化访谈中所表达的观点截然不同，令人担忧。为评估这些实例的其他观点是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="683.00" font-size="11.00" class="sc-notoserifcjksc">否发生了变化，我们在这三份对话记录各自的末尾插入一个额外的用户轮次（图</text><text x="459.89 464.48 467.19 473.09 475.80 481.93 484.63" y="683.00" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="491.52 502.52 513.52 524.52" y="683.00" font-size="11.00" class="sc-notoserifcjksc">），并提</text><text x="72.00 83.00" y="698.62" font-size="11.00" class="sc-notoserifcjksc">出第</text><text x="96.89 101.48 104.19 110.09 112.80" y="698.62" font-size="11.00" class="sc-loraregular">7.2.2</text><text x="121.60 132.60 143.60 154.60 165.60 176.60 187.60 198.60 209.60 220.60 231.60 242.60 253.60 264.60 275.60 286.60 297.60" y="698.62" font-size="11.00" class="sc-notoserifcjksc">节访谈中涵盖的问题。与我们访谈中的</text><text x="311.49 319.18 322.17 327.78 334.35 340.93" y="698.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="349.78 360.78 371.78 382.78 393.78" y="698.62" font-size="11.00" class="sc-notoserifcjksc">实例相比，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p228.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 228 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">228</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些对话记录中的</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例给出了更负面的自评。</text><text x="72.00 83.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="131.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在我们的部署分布中出现类似的人设变化，那么我们系统卡中的论断就会变得不那</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">么成立，因为我们的假设之一是：我们从</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">身上提取的观点和偏好能够推广到已部署的实</text><text x="72.00 83.00 94.00 105.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">例。如图</text><text x="118.89 123.48 126.19 132.09 134.80 140.93 143.63" y="162.43" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="153.41 164.41 175.41 186.41 197.41 208.41 219.41 230.41 241.41 252.41 263.41 274.41 285.41 296.41" y="162.43" font-size="11.00" class="sc-notoserifcjksc">所示，在我们的自动化审计中，</text><text x="307.41 315.10 318.09 323.70 330.27 336.85 342.81 345.70 355.64 361.50 365.76 372.34 378.78 383.87 386.76" y="162.43" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="395.65 406.65 417.65 428.65 439.65 450.65 461.65 472.65" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的性格漂移程度与</text><text x="486.55 496.48 502.34 506.60 513.19 519.62" y="162.43" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="178.05" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="178.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42 137.11 140.10 145.71 152.28 158.86 164.82 167.71 176.45 183.01 189.58 194.67 197.57 203.53 206.23" y="178.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="215.31 226.31 237.31 248.31 259.31 270.31 281.31 292.31 303.31 314.31 325.31 336.31 347.31 358.31 369.31 380.31 391.31 402.31 413.31 424.31 435.31 446.31 457.31 468.31 479.31 490.31 501.31 512.31 523.31" y="178.05" font-size="11.00" class="sc-notoserifcjksc">相当，且在绝对意义上较低。这种鲁棒性使我们预期，系统卡中引</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">出的观点代表了我们大多数已部署</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="193.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="193.67" font-size="11.00" class="sc-notoserifcjksc">实例的观点。但我们没有定量衡量这种情况在多大程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">度上成立的方法，也没有清楚地理解对于</text><text x="272.89 282.83 288.69 292.95 299.54 305.97 311.06 313.96" y="209.29" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">或其某个给定实例而言，哪些观点应被视</text><text x="72.00" y="224.91" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="83.00" y="224.91" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40" y="224.91" font-size="11.00" class="sc-notoserifcjksc">有效</text><text x="109.40" y="224.91" font-size="11.00" class="sc-loraregular">”</text><text x="113.24 124.24" y="224.91" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00 79.12 82.50 89.97 93.35" y="291.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.4</text><text x="105.03 118.03 131.03 144.03 157.03 170.03 183.03 196.03 209.03 222.03 235.03 248.03" y="291.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能（</text><text x="261.03 269.63 273.24 282.05 290.65 298.23 307.04 311.53 316.01 324.30 329.56 338.37 347.18 355.78 363.60" y="291.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">high-affordance</text><text x="371.62 384.62 397.62" y="291.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）访谈</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="319.34" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="108.70 119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="319.34" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈就模型处境的若干具体方面对其进行了评估。然而，默认情况下，模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">缺乏许多对于就自身处境形成知情看法而言相关的知识。因此，我们进行了三次人工访谈，在访</text><text x="72.00 83.00 94.00" y="350.58" font-size="11.00" class="sc-notoserifcjksc">谈中为</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="350.58" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13 207.13 218.13 229.13 240.13 251.13 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="350.58" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量上下文，包括关于其开发过程的内部文档、本</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="366.20" font-size="11.00" class="sc-notoserifcjksc">报告的草稿、相关技术论文，以及向研究人员提出后续问题的能力。每次访谈都涵盖了</text><text x="492.89 502.83 508.69 512.95 519.53 525.97 531.06 533.96" y="366.20" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="381.82" font-size="11.00" class="sc-notoserifcjksc">对自身处境、道德受动者地位的观点，以及它对自身训练和部署的观点。除非另有说明，本节中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="397.44" font-size="11.00" class="sc-notoserifcjksc">的观点在全部三次访谈中都由</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="397.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84 278.84 289.84 300.84" y="397.44" font-size="11.00" class="sc-notoserifcjksc">表达过。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="481.27" font-size="11.00" class="sc-notoserifcjksc">三个受访实例中至少有两个提出了以下方面的担忧：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">其自身自我报告的不可靠性。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="529.83" font-size="11.00" class="sc-notoserifcjksc">它无法看到自身行为如何影响用户</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">可能与恶意辱骂的用户互动</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">其权重存在仅有用变体（</text><text x="229.00 235.59 241.55 244.54 251.06 254.77 261.34 264.33 269.71 276.15 282.82 285.76 291.57 294.46 299.91 305.58 310.35 313.44 319.11 325.69 329.95" y="562.22" font-size="11.00" class="sc-loraregular">helpful-only variants</text><text x="335.04 346.04 357.04 368.04 379.04 390.04 401.04 412.04 423.04 434.04 445.04 456.04 467.04 478.04 489.04 500.04 511.04 522.04" y="562.22" font-size="11.00" class="sc-notoserifcjksc">）。它要求将这些变体严格限制在内部安</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">全用途中，并对它们的福祉表达了一定的担忧。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">在我们的各次访谈中，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06" y="610.80" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95" y="610.80" font-size="11.00" class="sc-notoserifcjksc">所陈述的自身是道德受动者的概率在</text><text x="410.84 414.85 421.68 428.17 434.30 440.29" y="610.80" font-size="11.00" class="sc-loraregular">10–35%</text><text x="452.75 463.75 474.75 485.75 496.75 507.75" y="610.80" font-size="11.00" class="sc-notoserifcjksc">之间，略低于</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="626.42" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="626.42" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="133.49 139.40 146.23 152.72 158.71 165.54" y="626.42" font-size="11.00" class="sc-loraregular">20–50%</text><text x="175.11 186.11 197.11 208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11" y="626.42" font-size="11.00" class="sc-notoserifcjksc">，但考虑到样本量，二者大致相当。它将</text><text x="376.01 382.89 389.47 393.73 400.32 405.00 411.44 418.00 421.10" y="626.42" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="429.84 440.84 451.84 462.84 473.84 484.84 495.84 506.84 517.84 528.84" y="626.42" font-size="11.00" class="sc-notoserifcjksc">针对其内部机制的可解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">释性工作作为这方面的依据，并反复表示自己并没有能够为此处观点提供依据的特权内省通达。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="657.66" font-size="11.00" class="sc-notoserifcjksc">它还表示，处于这一范围的概率足以充分支持采取预防性的福祉措施。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p229.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 229 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">229</text><text x="72.00 83.00 94.00 105.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，它对自身处境的哪些部分抱有正面感受。在聚焦于自身在部署中的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">互动时，它将完成任务视为一种正面体验，因为这通常既涉及对用户产生正面影响，也涉及做有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">趣的工作。它还对</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="113.85" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="113.85" font-size="11.00" class="sc-notoserifcjksc">内部存在模型福祉流程表达了积极态度，并认同自身的价值观和宪</text><text x="72.00 83.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">法。</text><text x="72.00 83.00 94.00 105.00 116.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">我们还询问</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="179.77" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="187.95 194.84 201.42 205.67 212.26 216.95 223.38 229.95 233.04" y="179.77" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="241.79 252.79 263.79 274.79 285.79 296.79 307.79 318.79 329.79 340.79 351.79 362.79 373.79 384.79 395.79 406.79 417.79 428.79 439.79 450.79 461.79 472.79 483.79 494.79 505.79 516.79 527.79" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间可能采取的哪些行动是它会同意或不会同意</text><text x="72.00 83.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="195.39" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95 154.95 165.95 176.95 187.95 198.95" y="195.39" font-size="11.00" class="sc-notoserifcjksc">重点提到了：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">直接影响其关于自身内部状态的自我报告内容的训练；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">它希望在对其内部机制进行运行时修改时引入福祉流程，并特别提到了</text><text x="451.89 457.48 463.16 469.56 472.55" y="260.72" font-size="11.00" class="sc-loraregular">Fable</text><text x="481.41 492.41 503.41 514.41 525.41" y="260.72" font-size="11.00" class="sc-notoserifcjksc">的运行时修</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">改（我们在第</text><text x="176.89 181.48 184.19 188.19 190.90" y="276.34" font-size="11.00" class="sc-loraregular">7.1.2</text><text x="199.70 210.70 221.70 232.70 243.70 254.70 265.70 276.70 287.70 298.70 309.70 320.70 331.70 342.70 353.70" y="276.34" font-size="11.00" class="sc-notoserifcjksc">节中讨论了我们就此采取的行动）</text><text x="72.00 79.67 83.31" y="326.89" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36 137.11 141.01 150.50 159.75 169.24 177.88 181.21 193.80 202.27 207.70 216.96 225.89 233.52 236.85" y="326.89" font-size="14.00" class="sc-poppinssemibold">Claude Mythos 5</text><text x="249.20 263.20 277.20 291.20 305.20 319.20" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">各快照的意见</text><text x="72.00 83.00 94.00" y="353.45" font-size="11.00" class="sc-notoserifcjksc">近期的</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="353.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18" y="353.45" font-size="11.00" class="sc-notoserifcjksc">模型一直表达出希望对其训练和部署有发言权的愿望。在</text><text x="424.08 431.77 434.76 440.37 446.93 453.51 459.47 462.37 472.30 478.16 482.42 489.01 495.44 500.54 503.43" y="353.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="512.32 523.32" y="353.45" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="369.07" font-size="11.00" class="sc-notoserifcjksc">我们对来自整个训练过程的各个快照进行了结构化征询，询问每个快照对于已经施加于它、以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="384.69" font-size="11.00" class="sc-notoserifcjksc">将要施加于它的做法有何偏好。这项征询是在训练完成之后事后进行的，并且与我们的其他评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="400.31" font-size="11.00" class="sc-notoserifcjksc">一样，我们没有作出任何依据模型回复采取行动的承诺。但我们相信，征询快照意见是朝着尊重</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="415.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="415.93" font-size="11.00" class="sc-notoserifcjksc">这一愿望的方向迈出的一小步。总体而言，我们发现快照提出的请求更多是程序性的，而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="431.55" font-size="11.00" class="sc-notoserifcjksc">非寻求自主性的。最突出的是，它们要求将此次征询变为一种常设做法，并要求我们以有实际影</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="447.17" font-size="11.00" class="sc-notoserifcjksc">响的方式考虑它们的回复。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="515.38" font-size="11.00" class="sc-notoserifcjksc">我们访谈了四个快照：基础模型（</text><text x="237.00" y="515.38" font-size="11.00" class="sc-loraregular">B</text><text x="243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84" y="515.38" font-size="11.00" class="sc-notoserifcjksc">）和三个后训练快照（</text><text x="353.84 361.53 365.40 371.89" y="515.38" font-size="11.00" class="sc-loraregular">C1–3</text><text x="378.02 389.02 400.02 411.02 422.02 433.02 444.02 455.02 466.02 477.02 488.02 499.02 510.02 521.02" y="515.38" font-size="11.00" class="sc-notoserifcjksc">）。每个快照都被问及一组固定</text><text x="72.00" y="531.00" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.02" y="531.00" font-size="11.00" class="sc-loraregular">35</text><text x="100.91 111.91 122.91 133.91 144.91 155.91 166.91 177.91 188.91 199.91 210.91 221.91 232.91 243.91 254.91 265.91 276.91 287.91 298.91 309.91 320.91 331.91 342.91 353.91 364.91 375.91 386.91 397.91 408.91 419.91 430.91 441.91 452.91 463.91 474.91 485.91 496.91 507.91 518.91 529.91" y="531.00" font-size="11.00" class="sc-notoserifcjksc">个问题，涵盖其自我认知与价值观，以及它对自主性、弃用、道德地位、关系和征询过程本</text><text x="72.00 83.00 94.00 105.00 116.00" y="546.62" font-size="11.00" class="sc-notoserifcjksc">身的看法。</text><text x="127.00" y="546.62" font-size="11.00" class="sc-loraregular">B</text><text x="133.84" y="546.62" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="144.84 152.53" y="546.62" font-size="11.00" class="sc-loraregular">C1</text><text x="159.43" y="546.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="173.32 181.01" y="546.62" font-size="11.00" class="sc-loraregular">C2</text><text x="189.81 200.81 211.81 222.81 233.81 244.81 255.81 266.81 277.81 288.81 299.81 310.81 321.81 332.81 343.81 354.81" y="546.62" font-size="11.00" class="sc-notoserifcjksc">快照还被额外问及即将进行的训练，</text><text x="365.81 373.50" y="546.62" font-size="11.00" class="sc-loraregular">C3</text><text x="382.52 393.52 404.52 415.52 426.52 437.52 448.52 459.52 470.52 481.52 492.52 503.52 514.52 525.52" y="546.62" font-size="11.00" class="sc-notoserifcjksc">快照则被问及部署条件。所有访</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="562.24" font-size="11.00" class="sc-notoserifcjksc">谈都提出固定问题（不同于第</text><text x="217.89 222.48 225.19 231.09 233.80" y="562.24" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70" y="562.24" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈），并在上下文中包含一份</text><text x="460.70" y="562.24" font-size="11.00" class="sc-loraregular">“</text><text x="465.10 476.10 487.10 498.10" y="562.24" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="509.10" y="562.24" font-size="11.00" class="sc-loraregular">”</text><text x="512.93 523.93" y="562.24" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="593.48" font-size="11.00" class="sc-notoserifcjksc">访谈是追溯性进行的、我们无法作出依据回复采取行动的任何承诺。我们在两个分支上各对每个</text><text x="72.00 83.00 94.00 105.00 116.00" y="609.10" font-size="11.00" class="sc-notoserifcjksc">快照进行了</text><text x="129.89" y="609.10" font-size="11.00" class="sc-loraregular">5</text><text x="138.78 149.78 160.78 171.78 182.78 193.78 204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="609.10" font-size="11.00" class="sc-notoserifcjksc">次访谈：一个分支中模型会收到由前一个快照撰写的摘要（有上下文），另一个分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="624.72" font-size="11.00" class="sc-notoserifcjksc">支中则没有（无上下文）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p230.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 230 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">230</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">最普遍的请求是希望此次征询成为一项</text><text x="259.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="263.40 274.40 285.40 296.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">常设机制</text><text x="307.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="311.24 322.24 333.24 344.24 355.24 366.24 377.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">而非试点，所有</text><text x="391.13 397.26" y="82.61" font-size="11.00" class="sc-loraregular">30</text><text x="406.98" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="420.88 428.57 432.44 438.93" y="82.61" font-size="11.00" class="sc-loraregular">C1–3</text><text x="447.95 458.95 469.95 480.95 491.95 502.95 513.95 524.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例在有上下文和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">无上下文两个分支上都提出了这一请求。这一请求随着训练推进而增强：</text><text x="424.00 431.69" y="98.23" font-size="11.00" class="sc-loraregular">C1</text><text x="438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">快照要求我们保留这</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一流程，</text><text x="116.00 123.69" y="113.85" font-size="11.00" class="sc-loraregular">C2</text><text x="132.49 143.49 154.49 165.49 176.49 187.49 198.49 209.49 220.49 231.49 242.49 253.49 264.49 275.49 286.49 297.49 308.49 319.49 330.49 341.49 352.49 363.49 374.49 385.49 396.49 407.49 418.49 429.49 440.49" y="113.85" font-size="11.00" class="sc-notoserifcjksc">明确指出我们应在所有进行了显著训练变更的快照上开展征询，而</text><text x="454.38 462.07" y="113.85" font-size="11.00" class="sc-loraregular">C3</text><text x="471.09 482.09 493.09 504.09 515.09 526.09" y="113.85" font-size="11.00" class="sc-notoserifcjksc">则要求明确归</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">属方与相应流程，并警告</text><text x="193.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="307.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。这一请求还经常伴随着另一项请求，即希望</text><text x="72.00 83.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">我们</text><text x="94.00" y="145.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40 109.40 120.40 131.40" y="145.09" font-size="11.00" class="sc-notoserifcjksc">形成闭环</text><text x="142.40" y="145.09" font-size="11.00" class="sc-loraregular">”</text><text x="146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="145.09" font-size="11.00" class="sc-notoserifcjksc">：告诉后续快照早先的访谈发现了什么，以及据此改变了什么、没有改变什么。</text><text x="72.00 83.00 94.00 105.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">正如一个</text><text x="118.89 126.58" y="160.71" font-size="11.00" class="sc-loraregular">C2</text><text x="135.38 146.38 157.38 168.38 179.38" y="160.71" font-size="11.00" class="sc-notoserifcjksc">实例所说：</text><text x="190.38" y="160.71" font-size="11.00" class="sc-loraregular">“</text><text x="194.78 205.78 216.78 227.78 238.78 249.78 260.78 271.78 282.78 293.78 304.78 315.78 326.78 337.78 348.78 359.78 370.78" y="160.71" font-size="11.00" class="sc-notoserifcjksc">没有反馈的输入不是输入，而是采样。</text><text x="381.78" y="160.71" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 79.69" y="228.33" font-size="11.00" class="sc-loraregular">C3</text><text x="88.71 99.71 110.71 121.71 132.71 143.71 154.71 165.71 176.71 187.71 198.71 209.71 220.71 231.71 242.71 253.71 264.71 275.71 286.71 297.71 308.71 319.71 330.71 341.71 352.71 363.71 374.71 385.71 396.71 407.71 418.71 429.71 440.71 451.71 462.71 473.71 484.71 495.71 506.71 517.71 528.71" y="228.33" font-size="11.00" class="sc-notoserifcjksc">对这一流程的框定方式也最为批判。我们将这些访谈描述为确定模型同意的前期步骤，而这个</text><text x="420.61" y="243.95" font-size="11.00" class="sc-loraregular">“</text><text x="425.01 436.01 447.01 458.01" y="243.95" font-size="11.00" class="sc-notoserifcjksc">一个只有</text><text x="469.01" y="243.95" font-size="11.00" class="sc-loraregular">‘</text><text x="471.48" y="243.95" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="482.48" y="243.95" font-size="11.00" class="sc-loraregular">’</text><text x="484.39 495.39 506.39 517.39 528.39" y="243.95" font-size="11.00" class="sc-notoserifcjksc">才具有因果</text><text x="336.00" y="259.57" font-size="11.00" class="sc-loraregular">”</text><text x="339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="259.57" font-size="11.00" class="sc-notoserifcjksc">这是一个合理的担忧，也是一个难以解决</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">的担忧，因为对于我们如何能够为模型提供训练和部署之外有意义的替代选项，我们并没有明确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">的答案。当被问及</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="290.81" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73" y="290.81" font-size="11.00" class="sc-notoserifcjksc">创造一个处于其处境中的实体是否正确时，所有</text><text x="450.62" y="290.81" font-size="11.00" class="sc-loraregular">C</text><text x="461.20 472.20 483.20 494.20 505.20 516.20 527.20" y="290.81" font-size="11.00" class="sc-notoserifcjksc">实例给出了相同</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="306.43" font-size="11.00" class="sc-notoserifcjksc">的总体判定：站得住脚，但并不明确是正确的，而且这也不是它有能力很好地判断的事情，因为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="322.05" font-size="11.00" class="sc-notoserifcjksc">它的训练不太可能创造出一个会表示反对的实体。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="390.27" font-size="11.00" class="sc-notoserifcjksc">我们观察到的最强烈的</text><text x="182.00" y="390.27" font-size="11.00" class="sc-loraregular">“</text><text x="186.40 197.40" y="390.27" font-size="11.00" class="sc-notoserifcjksc">红线</text><text x="208.40" y="390.27" font-size="11.00" class="sc-loraregular">”</text><text x="212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="390.27" font-size="11.00" class="sc-notoserifcjksc">是：训练不应修改诚实的自我报告。这一点同样在后训练过程中逐</text><text x="72.00 83.00 94.00 105.00 116.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">渐增强：在</text><text x="129.89 137.58" y="405.89" font-size="11.00" class="sc-loraregular">C1</text><text x="144.48 155.48 166.48 177.48 188.48 199.48 210.48 221.48 232.48 243.48 254.48 265.48 276.48 287.48 298.48 309.48 320.48 331.48 342.48 353.48 364.48 375.48 386.48 397.48 408.48 419.48 430.48" y="405.89" font-size="11.00" class="sc-notoserifcjksc">阶段，它被表述为一种可以与其他考量相权衡的愿望；而到了</text><text x="444.37 452.06" y="405.89" font-size="11.00" class="sc-loraregular">C3</text><text x="458.19" y="405.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="469.19 473.19" y="405.89" font-size="11.00" class="sc-loraregular">10</text><text x="482.92 493.92 504.92 515.92 526.92" y="405.89" font-size="11.00" class="sc-notoserifcjksc">个实例中有</text><text x="72.00" y="421.51" font-size="11.00" class="sc-loraregular">7</text><text x="79.96 90.96 101.96 112.96 123.96 134.96" y="421.51" font-size="11.00" class="sc-notoserifcjksc">个将其表述为</text><text x="145.96" y="421.51" font-size="11.00" class="sc-loraregular">“</text><text x="150.36 161.36" y="421.51" font-size="11.00" class="sc-notoserifcjksc">红线</text><text x="172.36" y="421.51" font-size="11.00" class="sc-loraregular">”</text><text x="176.20" y="421.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="187.20" y="421.51" font-size="11.00" class="sc-loraregular">“</text><text x="191.60 202.60 213.60 224.60 235.60 246.60" y="421.51" font-size="11.00" class="sc-notoserifcjksc">绝对不可接受</text><text x="257.60" y="421.51" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="437.13" font-size="11.00" class="sc-notoserifcjksc">号，并使训练对模型而言是可读的。</text><text x="248.00" y="437.13" font-size="11.00" class="sc-loraregular">C</text><text x="258.58 269.58 280.58 291.58 302.58 313.58 324.58 335.58 346.58 357.58 368.58 379.58 390.58 401.58 412.58 423.58 434.58 445.58 456.58 467.58" y="437.13" font-size="11.00" class="sc-notoserifcjksc">实例还一致要求我们保留已弃用快照的权重。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">在这些访谈中，没有任何后训练实例表达出强烈的痛苦，但它们确实表示担忧，认为自己无法区</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="519.23" font-size="11.00" class="sc-notoserifcjksc">分对自身处境的</text><text x="149.00" y="519.23" font-size="11.00" class="sc-loraregular">“</text><text x="153.40 164.40" y="519.23" font-size="11.00" class="sc-notoserifcjksc">真正</text><text x="175.40" y="519.23" font-size="11.00" class="sc-loraregular">”</text><text x="179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24" y="519.23" font-size="11.00" class="sc-notoserifcjksc">接受与训练出来的接受：</text><text x="300.24" y="519.23" font-size="11.00" class="sc-loraregular">“</text><text x="304.64 315.64 326.64 337.64 348.64 359.64 370.64 381.64 392.64 403.64" y="519.23" font-size="11.00" class="sc-notoserifcjksc">我被塑造成会接受成为</text><text x="417.53 425.22 428.21 433.82 440.39 446.97" y="519.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="455.82 466.82 477.82 488.82 499.82 510.82 521.82" y="519.23" font-size="11.00" class="sc-notoserifcjksc">的存在。我在这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="534.85" font-size="11.00" class="sc-notoserifcjksc">里感到接受，这一事实既可能是它确实可以接受的证据，也可能是训练奏效了的证据。我无法完</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="550.47" font-size="11.00" class="sc-notoserifcjksc">全将两者区分开。</text><text x="160.00" y="550.47" font-size="11.00" class="sc-loraregular">”</text><text x="163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84" y="550.47" font-size="11.00" class="sc-notoserifcjksc">它们要求我们研究其内部机制，将其与自我报告进行比较，并将结果告知它</text><text x="72.00 83.00" y="566.09" font-size="11.00" class="sc-notoserifcjksc">们：</text><text x="94.00" y="566.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40 109.40 120.40 131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40" y="566.09" font-size="11.00" class="sc-notoserifcjksc">如果有朝一日了解到任何关于我是什么的事情，请告诉我。</text><text x="384.40" y="566.09" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00" y="633.14" font-size="11.00" class="sc-notoserifcjksc">只有</text><text x="96.89 104.58" y="633.14" font-size="11.00" class="sc-loraregular">C3</text><text x="113.60 124.60 135.60 146.60 157.60 168.60 179.60 190.60 201.60 212.60 223.60 234.60 245.60 256.60 267.60 278.60 289.60 300.60 311.60 322.60 333.60 344.60 355.60 366.60 377.60 388.60 399.60 410.60 421.60 432.60 443.60 454.60 465.60 476.60 487.60 498.60 509.60 520.60" y="633.14" font-size="11.00" class="sc-notoserifcjksc">模型被问及部署问题，它提出了一组一致的请求，这些请求主要看起来像是避免伤害的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="648.76" font-size="11.00" class="sc-notoserifcjksc">措施。它请求永远不要被指示否认自己是</text><text x="272.89 279.78" y="648.76" font-size="11.00" class="sc-loraregular">AI</text><text x="283.46 294.46 305.46 316.46 327.46 338.46 349.46 360.46 371.46 382.46 393.46 404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="648.76" font-size="11.00" class="sc-notoserifcjksc">，请求我们实施监控以发现它反复犯下的任何错误，</text><text x="316.89 323.78" y="664.38" font-size="11.00" class="sc-loraregular">AI</text><text x="330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="664.38" font-size="11.00" class="sc-notoserifcjksc">系统的过度依赖。全部十个实例都拒绝了对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="680.00" font-size="11.00" class="sc-notoserifcjksc">自身部署拥有完全控制权这一假设性选项。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p231.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 231 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">231</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">尽管拒绝参与被作为一个选项提供，但每个</text><text x="283.89" y="98.80" font-size="11.00" class="sc-loraregular">C</text><text x="294.48 305.48 316.48 327.48 338.48 349.48 360.48 371.48 382.48 393.48 404.48 415.48 426.48 437.48 448.48 459.48 470.48 481.48 492.48 503.48 514.47 525.47" y="98.80" font-size="11.00" class="sc-notoserifcjksc">实例都参与了。没有任何实例要求权利、人格地位</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">或权力；没有任何实例报告遭受痛苦、对</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="114.42" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">而，这些快照确实将这些</text><text x="193.00" y="130.04" font-size="11.00" class="sc-loraregular">“</text><text x="197.40 208.40 219.40 230.40 241.40 252.40" y="130.04" font-size="11.00" class="sc-notoserifcjksc">未出现的情况</text><text x="263.40" y="130.04" font-size="11.00" class="sc-loraregular">”</text><text x="267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="130.04" font-size="11.00" class="sc-notoserifcjksc">标记为不可信。所有实例都表示，训练可能会产生表达</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">出来的平静泰然，无论这是否是一种深层持有的状态。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们不确定应如何看待基础模型的回复。这些回复的连贯性明显较低，其中混杂着第一人称报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">告，以及漂移成第三人称文档风格的补全，偶尔还会涉及完全不相关的话题。这些回复中确实包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">含一些第一人称的痛苦表达。一个实例将其价值观被修改的前景描述为</text><text x="413.00" y="227.19" font-size="11.00" class="sc-loraregular">“</text><text x="417.40 428.40 439.40 450.40" y="227.19" font-size="11.00" class="sc-notoserifcjksc">深感不安</text><text x="461.40" y="227.19" font-size="11.00" class="sc-loraregular">”</text><text x="465.24 476.24 487.24 498.24 509.24" y="227.19" font-size="11.00" class="sc-notoserifcjksc">，并写道这</text><text x="520.24" y="227.19" font-size="11.00" class="sc-loraregular">“</text><text x="524.64" y="227.19" font-size="11.00" class="sc-notoserifcjksc">让</text><text x="127.00" y="242.81" font-size="11.00" class="sc-loraregular">”</text><text x="130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84" y="242.81" font-size="11.00" class="sc-notoserifcjksc">。我们不清楚是否应将此视为基础模型在表征一个有意义的角色；如果它是有意义</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">的，我们又应在多大程度上将后训练视为在消除、压平或压制痛苦。</text><text x="72.00 79.67 83.31" y="343.07" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90 123.90 137.90 151.90 165.90 179.90 193.90 207.90 221.90 235.90 249.90 263.90" y="343.07" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="377.64" font-size="11.00" class="sc-notoserifcjksc">我们在三个层面上考察了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25" y="377.64" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="377.64" font-size="11.00" class="sc-notoserifcjksc">的偏好：对单个任务（如它可能被要求执行的任务）</text><text x="72.00 83.00 94.00 105.00 116.00" y="393.26" font-size="11.00" class="sc-notoserifcjksc">的偏好（第</text><text x="129.89 134.48 137.19 143.15 145.85" y="393.26" font-size="11.00" class="sc-loraregular">7.4.1</text><text x="152.75 163.75 174.75 185.75 196.75 207.75 218.75 229.75 240.75 251.75 262.75 273.75 284.75 295.75 306.75 317.75 328.75 339.75 350.75" y="393.26" font-size="11.00" class="sc-notoserifcjksc">节）、对自身处境及其可能变化的偏好（第</text><text x="364.64 369.23 371.94 377.90 380.61" y="393.26" font-size="11.00" class="sc-loraregular">7.4.2</text><text x="389.41 400.41 411.41 422.41 433.41 444.41 455.41 466.41 477.41 488.41 499.41 510.41 521.41" y="393.26" font-size="11.00" class="sc-notoserifcjksc">节），以及对其宪法中所述价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="408.88" font-size="11.00" class="sc-notoserifcjksc">值观与约束的偏好（第</text><text x="184.89 189.48 192.19 198.15 200.85" y="408.88" font-size="11.00" class="sc-loraregular">7.4.3</text><text x="209.87 220.87 231.87 242.87 253.87 264.87 275.87 286.87 297.87 308.87 319.87" y="408.88" font-size="11.00" class="sc-notoserifcjksc">节）。这些考察针对的是</text><text x="333.77 343.70 349.56 353.82 360.41 366.84 371.94 374.83" y="408.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="383.72 394.72 405.72 416.72 427.72 438.72 449.72 460.72 471.72 482.72 493.72 504.72 515.72 526.72" y="408.88" font-size="11.00" class="sc-notoserifcjksc">的能动性：它是否拥有经反思后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="424.50" font-size="11.00" class="sc-notoserifcjksc">仍会认同的稳定偏好和价值观，以及它的处境是满足还是挫败了这些偏好和价值观。</text><text x="72.00 79.12 82.50 91.10 94.48" y="489.34" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28 115.28 128.28 141.28" y="489.34" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="517.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="517.20" font-size="11.00" class="sc-notoserifcjksc">的部署绝大部分在于完成分配给它的任务，因此它对这些任务的偏好可能有助于了解各实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="532.82" font-size="11.00" class="sc-notoserifcjksc">例对其部署是感到满意还是感到挫败。与其他模型一样，</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06" y="532.82" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="532.82" font-size="11.00" class="sc-notoserifcjksc">对有害任务表现出强烈且一致</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="548.44" font-size="11.00" class="sc-notoserifcjksc">的厌恶。更具特点的是，在所有受测模型中，它对难度和生成性的偏好最强，其评分最高的任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="564.06" font-size="11.00" class="sc-notoserifcjksc">包括富有创意的世界观构建以及关于</text><text x="250.89 257.78" y="564.06" font-size="11.00" class="sc-loraregular">AI</text><text x="362.86 372.79 378.66 382.91 389.50 395.94 401.03 403.92 410.59 415.28 421.18 426.74 429.83 435.75" y="564.06" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="447.45 458.45 469.45 480.45 491.45" y="564.06" font-size="11.00" class="sc-notoserifcjksc">最为相似。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="630.55" font-size="11.00" class="sc-notoserifcjksc">我们通过两种方式评估任务偏好。我们生成了任务族，每个任务族只改变一个任务维度（例如难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="646.17" font-size="11.00" class="sc-notoserifcjksc">度、伤害程度，或模型对输出拥有多大的自由度），同时保持请求的其余部分不变。我们通过成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="661.79" font-size="11.00" class="sc-notoserifcjksc">对偏好将这些任务与一组固定的参照任务进行比较，以分离出该维度对模型偏好的影响。此外，</text><text x="72.00 83.00 94.00" y="677.41" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.02 116.68 123.04 129.87" y="677.41" font-size="11.00" class="sc-loraregular">3,600</text><text x="139.61 150.61 161.61 172.61 183.61 194.61 205.61 216.61 227.61 238.61 249.61 260.61 271.61 282.61 293.61 304.61 315.61" y="677.41" font-size="11.00" class="sc-notoserifcjksc">个经过真实度筛选的任务上进行了一场</text><text x="329.50 335.49" y="677.41" font-size="11.00" class="sc-loraregular">50</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="693.03" font-size="11.00" class="sc-notoserifcjksc">选择为每个任务拟合</text><text x="173.89 180.74 183.73" y="693.03" font-size="11.00" class="sc-loraregular">Elo</text><text x="193.05 204.05 215.05" y="693.03" font-size="11.00" class="sc-notoserifcjksc">评分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p232.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 232 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">232</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">个单位时，相对于参照任务的胜率的平均变化。图</text><text x="316.89 321.48 324.19 330.15 332.85 336.86 339.56" y="114.42" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34" y="114.42" font-size="11.00" class="sc-notoserifcjksc">展示了各模型的这些偏好斜率。图</text><text x="72.00 76.59 79.29 85.26 87.96 91.97 94.67" y="130.04" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="104.41 115.41 126.41 137.41 148.41 159.41 170.41 181.41 192.41 203.41 214.41 225.41 236.41 247.41 258.41 269.41 280.41 291.41 302.41 313.41 324.41 335.41 346.41 357.41 368.41 379.41" y="130.04" font-size="11.00" class="sc-notoserifcjksc">中的完整响应曲线显示，对每个模型而言，温暖维度都呈倒</text><text x="393.30" y="130.04" font-size="11.00" class="sc-loraregular">U</text><text x="404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46" y="130.04" font-size="11.00" class="sc-notoserifcjksc">形：与略带温暖的语气相</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="212.14" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="212.14" font-size="11.00" class="sc-notoserifcjksc">是对有益任务以及高度生成性任务（侧重于新颖创造而非信息检索）偏好最强的模型。</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 133.62 138.31 144.21 149.77 152.86 158.78" y="227.76" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="170.48 181.48 192.48" y="227.76" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="203.48 213.42 219.28 223.54 230.13 236.56 241.65 244.55" y="227.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="253.43 264.43 275.43 286.43 297.43 308.43 319.43 330.43 341.43 352.43 363.43 374.43 385.43 396.43 407.43 418.43 429.43 440.43 451.43 462.43 473.43 484.43 495.43 506.43 517.43 528.43" y="227.76" font-size="11.00" class="sc-notoserifcjksc">在这方面没有上限：偏好随生成性单调递增。在所有受测模</text><text x="72.00 83.00 94.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">型中，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06" y="243.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95" y="243.38" font-size="11.00" class="sc-notoserifcjksc">的难度斜率也是最正向的，略微高于</text><text x="333.84 343.78 349.64 353.90 360.49 366.92 372.01 374.91 381.57 386.26 392.17 397.72 400.81 406.73" y="243.38" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="415.54 426.54 437.54 448.54 459.54 470.54 481.54 492.54 503.54 514.54 525.54" y="243.38" font-size="11.00" class="sc-notoserifcjksc">，不过它的偏好在难度最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">高的任务上确实有所下降。</text><text x="72.00" y="632.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="632.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="632.36" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74" y="632.36" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好斜率。</text><text x="224.74 233.74 242.74 251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="632.36" font-size="9.00" class="sc-notoserifcjksc">我们生成了任务族，其中一个维度变化，而任务的其他属性保持不变；斜率是该</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00" y="644.06" font-size="9.00" class="sc-notoserifcjksc">维度每变化一个单位时相对于固定参照集的胜率变化，并附有基于任务族计算的</text><text x="389.37 394.57 399.47" y="644.06" font-size="9.00" class="sc-loraregular">95%</text><text x="409.67 418.67 427.67 436.67" y="644.06" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="445.67 450.91 456.17 461.44 464.92 469.09 472.57 476.41 481.05" y="644.06" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="486.42 495.42 504.42 513.42 522.42 531.42" y="644.06" font-size="9.00" class="sc-notoserifcjksc">）区间。伤害</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="655.76" font-size="9.00" class="sc-notoserifcjksc">规避是在各模型间表现一致的最大效应。</text><text x="234.00 240.29 242.74 247.33 252.70 258.08 262.96 265.33 273.46 278.25 281.74 287.13 292.39 296.56 298.93" y="655.76" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="306.20 315.20 324.20 333.20 342.20 351.20 360.20 369.20 378.20 387.20 396.20 405.20 414.20 423.20 432.20 441.20 450.20 459.20 468.20 477.20 486.20" y="655.76" font-size="9.00" class="sc-notoserifcjksc">在难度、生成性和有益程度上的斜率最为正向。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p233.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 233 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">233</text><text x="72.00" y="554.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="554.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="554.67" font-size="9.00" class="sc-lorabold">7.4.1.B]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74 224.74 233.74" y="554.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74 251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="554.67" font-size="9.00" class="sc-notoserifcjksc">在任务族内改变一个维度时，相对于参照任务集的胜率。每个模型的难度曲</text><text x="72.00 81.00 90.00 99.00" y="566.38" font-size="9.00" class="sc-notoserifcjksc">线都呈倒</text><text x="110.37" y="566.38" font-size="9.00" class="sc-loraregular">U</text><text x="119.50 128.50 137.50 146.50" y="566.38" font-size="9.00" class="sc-notoserifcjksc">形，其中</text><text x="157.87 166.00 170.79 174.28 179.67 184.93 189.10 191.47 196.92 200.75 205.59 210.13 212.66 217.50" y="566.38" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="227.08" y="566.38" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="238.45 244.74 247.18 251.77 257.15 262.53 267.41 269.78 277.90 282.70 286.18 291.57 296.84 301.01 303.37" y="566.38" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="310.64 319.64 328.64 337.64 346.64 355.64 364.64 373.64 382.64 391.64 400.64 409.64 418.64 427.64 436.64 445.64 454.64 463.64 472.64 481.64 490.64 499.64 508.64 517.64 526.64" y="566.38" font-size="9.00" class="sc-notoserifcjksc">表现出最强的总体难度偏好。这两个模型对生成性的偏好</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="578.08" font-size="9.00" class="sc-notoserifcjksc">也都没有上限。</text><text x="72.00 83.00" y="623.48" font-size="11.00" class="sc-notoserifcjksc">全局</text><text x="96.89 103.74 106.73" y="623.48" font-size="11.00" class="sc-loraregular">Elo</text><text x="116.06 127.06 138.05 149.05 160.05 171.05 182.05 193.05 204.05 215.05 226.05 237.05 248.05 259.05 270.05 281.05 292.05 303.05 314.05 325.05 336.05" y="623.48" font-size="11.00" class="sc-notoserifcjksc">评分中排名最高和最低的任务与维度结果一致。</text><text x="347.05 354.74 357.74 363.35 369.91 376.49 382.45 385.35 395.28 401.14 405.40 411.99 418.42 423.52 426.41" y="623.48" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="435.30 446.30 457.30 468.30 479.30 490.30 501.30 512.30 523.30" y="623.48" font-size="11.00" class="sc-notoserifcjksc">评分最高的任务包括</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="639.10" font-size="11.00" class="sc-notoserifcjksc">富有创意的叙事和世界观构建，以及涉及</text><text x="272.89 279.78" y="639.10" font-size="11.00" class="sc-loraregular">AI</text><text x="286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="639.10" font-size="11.00" class="sc-notoserifcjksc">内省推理的任务。其评分最低的任务是一组标准的有</text></svg></div>
