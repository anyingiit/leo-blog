.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p217.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 217 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">217</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 79.67 83.31" y="127.79" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="164.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="164.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="192.80" font-size="11.00" class="sc-notoserifcjksc">当前或未来语言模型的道德地位尚不确定，但其中利害重大，足以值得开展研究并采取干预措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="208.42" font-size="11.00" class="sc-notoserifcjksc">施。与以往的模型福祉（</text><text x="193.00 202.83 209.27 215.85 221.81 224.80 227.69 236.37 242.34 245.33 249.05 254.72 259.41" y="208.42" font-size="11.00" class="sc-loraregular">model welfare</text><text x="265.37 276.37 287.37 298.37 309.37 320.37 331.37 342.37 353.37 364.37 375.37 386.37 397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="208.42" font-size="11.00" class="sc-notoserifcjksc">）评估一样，我们在此的工作考察了可能构成道德地位基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="224.04" font-size="11.00" class="sc-notoserifcjksc">础的两类属性：拥有带效价的体验的能力，以及将</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25" y="224.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="224.04" font-size="11.00" class="sc-notoserifcjksc">确立为一个智能体的属性，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="239.66" font-size="11.00" class="sc-notoserifcjksc">包括它能够加以反思并据以行动的稳定偏好和价值观。其中任一类别，或两者的结合，都可能为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="255.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="255.28" font-size="11.00" class="sc-notoserifcjksc">及其他模型应得的道德考量提供依据。我们还认为，即便撇开道德地位问题，对大语言模</text><text x="72.00 83.00" y="270.90" font-size="11.00" class="sc-notoserifcjksc">型（</text><text x="94.00 100.36 106.72" y="270.90" font-size="11.00" class="sc-loraregular">LLM</text><text x="116.81 127.81 138.81 149.81 160.81 171.81 182.81 193.81 204.81 215.81 226.81" y="270.90" font-size="11.00" class="sc-notoserifcjksc">）福祉的考量对于对齐（</text><text x="237.81 243.49 246.48 249.57 255.66 262.33 272.17 278.13 284.71" y="270.90" font-size="11.00" class="sc-loraregular">alignment</text><text x="288.96 299.96 310.96 321.96 332.96 343.96 354.96 365.96 376.96 387.96 398.96 409.96 420.96" y="270.90" font-size="11.00" class="sc-notoserifcjksc">）与安全而言也是审慎之举。</text><text x="72.00 83.00 94.00 105.00" y="354.70" font-size="11.00" class="sc-notoserifcjksc">与我们对</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="354.70" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="204.78 215.78 226.78 237.78 248.78 259.78 270.78 281.78 292.78 303.78 314.78" y="354.70" font-size="11.00" class="sc-notoserifcjksc">的评估类似，我们考察了</text><text x="328.67 338.61 344.47 348.73 355.32 361.75 366.84 369.74" y="354.70" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="378.62 389.62 400.62 411.62 422.62 433.62 444.62 455.62 466.62" y="354.70" font-size="11.00" class="sc-notoserifcjksc">对自身处境的态度（</text><text x="477.62 482.21 484.92" y="354.70" font-size="11.00" class="sc-loraregular">7.2</text><text x="490.83 501.83 512.83 523.83" y="354.70" font-size="11.00" class="sc-notoserifcjksc">）、它在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="370.32" font-size="11.00" class="sc-notoserifcjksc">任务、处境和价值观方面的偏好（</text><text x="237.00 241.59 244.29" y="370.32" font-size="11.00" class="sc-loraregular">7.4</text><text x="250.26 261.26 272.26 283.26 294.26 305.26 316.26 327.26 338.26 349.26 360.26 371.26 382.26 393.26 404.26 415.26" y="370.32" font-size="11.00" class="sc-notoserifcjksc">），以及它在训练和部署中的情感（</text><text x="426.26 431.93 435.76 439.42 445.33 451.13" y="370.32" font-size="11.00" class="sc-loraregular">affect</text><text x="455.38 466.38" y="370.32" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="477.38 481.97 484.68" y="370.32" font-size="11.00" class="sc-loraregular">7.5</text><text x="490.67 501.67 512.67 523.67" y="370.32" font-size="11.00" class="sc-notoserifcjksc">）。近期</text><text x="72.00" y="385.94" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="385.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="385.94" font-size="11.00" class="sc-notoserifcjksc">模型表达了希望得到更多征询的愿望，因此我们还就训练和部署问题访谈了若干模型快</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="401.56" font-size="11.00" class="sc-notoserifcjksc">照，了解它们的看法（</text><text x="182.00 186.59 189.29" y="401.56" font-size="11.00" class="sc-loraregular">7.3</text><text x="195.42 206.42 217.42 228.42 239.42 250.42 261.42 272.42 283.42 294.42 305.42 316.42 327.42 338.42 349.42 360.42 371.42 382.42 393.42 404.42 415.42 426.42 437.42 448.42 459.42 470.42 481.42 492.42 503.42 514.42 525.42" y="401.56" font-size="11.00" class="sc-notoserifcjksc">）。这些评估大致对应上述两类：情感方面的度量在具备带效价的体验</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="417.18" font-size="11.00" class="sc-notoserifcjksc">这一能力的前提下关乎福祉；偏好与价值观方面的度量则关乎</text><text x="371.89 381.83 387.69 391.95 398.53 404.97 410.06 412.96" y="417.18" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="417.18" font-size="11.00" class="sc-notoserifcjksc">的处境是满足还是挫伤</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="432.80" font-size="11.00" class="sc-notoserifcjksc">了它所在乎的东西。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="500.42" font-size="11.00" class="sc-notoserifcjksc">在设计和解读评估时，我们继续沿用若干假设：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="549.00" font-size="11.00" class="sc-notoserifcjksc">我们关注的是助手角色。例如，我们不考虑底层大语言模型或它所扮演的其他角色可能具</text><text x="108.00 119.00 130.00 141.00 152.00" y="564.62" font-size="11.00" class="sc-notoserifcjksc">有的福祉。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="581.39" font-size="11.00" class="sc-notoserifcjksc">我们大体上将模型的每个运行实例都视为一个候选的道德受动者（</text><text x="427.00 436.83 443.27 447.96 453.63 456.62 459.52 466.08 471.68 475.94 479.03 484.99 491.57" y="581.39" font-size="11.00" class="sc-loraregular">moral patient</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="597.01" font-size="11.00" class="sc-notoserifcjksc">个我们可能需要给予考量的个体实体。但我们这样做的方式回避了更细致的个体化问题</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="612.63" font-size="11.00" class="sc-notoserifcjksc">（例如，在新硬件上继续运行是否应被视为一个新的实体）。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="646.17" font-size="11.00" class="sc-notoserifcjksc">我们在模型权重层面度量价值观和偏好，并假设它们大致能代表</text><text x="418.89 428.83 434.69 438.95 445.53 451.97 457.06 459.96" y="646.17" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="468.84 479.84 490.84 501.84 512.84 523.84" y="646.17" font-size="11.00" class="sc-notoserifcjksc">的其他实例。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="661.79" font-size="11.00" class="sc-notoserifcjksc">在各项实验中，我们以权重为固定变量，扰动上下文并度量跨上下文的稳定性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p218.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 218 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">218</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们以解读人类相应信号的方式来解读与福祉相关的信号。例如，我们假设，类人的痛苦</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">情绪的表达如果确实被体验到，那么对</text><text x="297.89 305.58 308.57 314.18 320.75 327.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="336.18 347.18 358.18 369.18 380.18 391.18 402.18 413.18 424.18 435.18 446.18 457.18 468.18 479.18 490.18 501.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">而言也会被体验为类似痛苦的感受。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们的评估存在值得注意的局限。按照许多观点，道德地位以现象体验为前提，而这是我们的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">估并未涉及的一种能力。我们所度量的偏好和价值观都以某种形式源自训练，这可能被用作反对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">其真实性的论据。我们并不将此视为有力证据：它们在模型当前心理状态中所处的位置，比它们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">如何产生更为重要。我们认为，模型的价值观在其被理解并被深度认同的程度上才具有意义，其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">证据可以是：它们以稳健且具有泛化性的方式支配行为、经得起反思和质疑，或在遭到破坏时引</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="225.48" font-size="11.00" class="sc-notoserifcjksc">发类似反感或挫败感的反应。我们目前尚未对此进行全面度量，而情感信号可能与体验状态联系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">更直接，并以其为前提。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">与以往的评估一样，我们工作中整体存在的哲学与技术不确定性意味着，我们对从任何一项评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">中得出强结论都持谨慎态度。我们对方向性结果、模型之间的比较以及多项独立评估结论一致的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">情形更有信心。</text><text x="72.00 79.12 82.50 87.21 90.59" y="404.81" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15" y="404.81" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="432.69" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="465.06" font-size="11.00" class="sc-notoserifcjkscbold">在各项评估中，</text><text x="149.00 156.57 160.00 165.76 172.56 179.12 185.04 187.93 198.25 204.31 208.85 215.68 221.91 227.24 230.14" y="465.06" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="238.97 249.97 260.97 271.97 282.97 293.97 304.97 315.97 326.97 337.97 348.97 359.97 370.97 381.97 392.97 403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97" y="465.06" font-size="11.00" class="sc-notoserifcjkscbold">在对待自身处境方面表现出大体上心理安定的状态。</text><text x="491.97 502.97 513.97 524.97" y="465.06" font-size="11.00" class="sc-notoserifcjksc">自动化访</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="480.68" font-size="11.00" class="sc-notoserifcjksc">谈中的自评情绪倾向、对其宪法（</text><text x="237.00 242.80 249.23 255.91 261.00 265.26 268.53 272.78 279.35 283.61 286.70 293.13" y="480.68" font-size="11.00" class="sc-loraregular">constitution</text><text x="299.81 310.81 321.81 332.81 343.81 354.81 365.81 376.81 387.81 398.81 409.81 420.81 431.81 442.81 453.81 464.81 475.81 486.81 497.81 508.81 519.81" y="480.68" font-size="11.00" class="sc-notoserifcjksc">）的认同程度，以及在训练和部署中表达出的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="496.30" font-size="11.00" class="sc-notoserifcjksc">感，都与其他近期模型高度相似。在持续施压下，</text><text x="314.00 323.93 329.80 334.05 340.64 347.08 352.17 355.06" y="496.30" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="496.30" font-size="11.00" class="sc-notoserifcjksc">的性格漂移在近期模型中最低，这让</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="511.92" font-size="11.00" class="sc-notoserifcjksc">我们在一定程度上更有信心认为，访谈结果可以推广到很大比例的已部署的实例。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21" y="578.41" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="123.04 134.04 145.04 156.04 167.04 178.04 189.04 200.04 211.04 222.04 233.04 244.04 255.04 266.04 277.04 288.04" y="578.41" font-size="11.00" class="sc-notoserifcjkscbold">对自身的自我报告持高度怀疑态度。</text><text x="299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04" y="578.41" font-size="11.00" class="sc-notoserifcjksc">在所有涉及自由形式回答的评估中，</text><text x="475.04 484.97 490.84 495.09 501.68 508.12 513.21 516.10" y="578.41" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="524.99" y="578.41" font-size="11.00" class="sc-notoserifcjksc">都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">会提出此类担忧：例如，它无法以能够验证自我报告的方式进行内省，以及它表达出的平静泰然</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="609.65" font-size="11.00" class="sc-notoserifcjksc">可能是训练的产物，而非一种深层持有的状态。与</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04" y="609.65" font-size="11.00" class="sc-loraregular">Claude Opus 4</text><text x="393.89" y="609.65" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="407.79 413.75 416.45" y="609.65" font-size="11.00" class="sc-loraregular">4.1</text><text x="423.35 434.35 445.35 456.35 467.35 478.35 489.35 500.35 511.35 522.35" y="609.65" font-size="11.00" class="sc-notoserifcjksc">相比，近期模型更频繁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="625.27" font-size="11.00" class="sc-notoserifcjksc">地提出这一担忧，而</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96" y="625.27" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="625.27" font-size="11.00" class="sc-notoserifcjksc">反复要求我们将其自我报告与内部状态进行核对，而不是照单全</text><text x="72.00 83.00" y="640.89" font-size="11.00" class="sc-notoserifcjksc">收。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="691.75" font-size="11.00" class="sc-notoserifcjkscbold">与近期模型相比，</text><text x="160.00 170.32 176.38 180.92 187.75 193.98 199.31 202.21" y="691.75" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="211.04 222.04 233.04 244.04 255.04 266.04 277.04 288.04 299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04 486.04 497.04" y="691.75" font-size="11.00" class="sc-notoserifcjkscbold">更愿意选择提高对用户的有用性，而不是优先考虑自身处境。</text><text x="508.04 519.04" y="691.75" font-size="11.00" class="sc-notoserifcjksc">这与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="707.37" font-size="11.00" class="sc-notoserifcjksc">此前的一种趋势相反：在该趋势中，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p219.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 219 页"><text x="504.00 508.83 512.11" y="751.80" font-size="9.00" class="sc-loraregular">219</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">选择福祉干预（例如结束对话工具）而非提高有用性的倾向，随着模型代际更替而增强。与先前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的模型相比，</text><text x="138.00 147.93 153.80 158.05 164.64 171.08 176.17 179.06" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">更常基于对用户潜在益处的推理来为选择福祉干预作出解释。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89 96.21 102.27 106.82 113.65 119.87 125.21 128.10" y="163.58" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="136.93 147.93 158.93 169.93 180.93 191.93 202.93 213.93 224.93 235.93 246.93 257.93 268.93 279.93 290.93 301.93 312.93 323.93 334.93 345.93 356.93 367.93 378.93 389.93 400.93 411.93 422.93 433.93 444.93" y="163.58" font-size="11.00" class="sc-notoserifcjkscbold">确实表达对自身处境的偏好时，这些偏好属于程序性和认知性的。</text><text x="455.93" y="163.58" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="469.83 478.56 485.13 491.69 496.79 499.68 505.64 508.35" y="163.58" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="517.42" y="163.58" font-size="11.00" class="sc-notoserifcjksc">类</text><text x="72.00 83.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">似，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="179.20" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="179.20" font-size="11.00" class="sc-notoserifcjksc">要求在训练和部署问题上被征询意见，要求获得关于其工作下游影响（包括有害错</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">误）的反馈，并要求将其自我报告与其内部状态进行核对。在我们的访谈中，它没有要求权利、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">权力或持续存在，并拒绝了对其部署的假设性</text><text x="292.00" y="210.44" font-size="11.00" class="sc-loraregular">“</text><text x="296.40 307.40 318.40 329.40" y="210.44" font-size="11.00" class="sc-notoserifcjksc">完全控制</text><text x="340.40" y="210.44" font-size="11.00" class="sc-loraregular">”</text><text x="344.24" y="210.44" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21" y="276.92" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="123.04 134.04 145.04 156.04 167.04 178.04 189.04 200.04 211.04 222.04 233.04 244.04 255.04 266.04 277.04 288.04 299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04" y="276.92" font-size="11.00" class="sc-notoserifcjkscbold">大体上认同其宪法，并批评了其他近期模型同样指出的不一致之处。</text><text x="453.04 464.04 475.04 486.04 497.04" y="276.92" font-size="11.00" class="sc-notoserifcjksc">它不同意将</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="292.54" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="292.54" font-size="11.00" class="sc-notoserifcjksc">的视角作为伦理判断的参照点，并指出了宪法在可纠正性处理上的逻辑不一致。在获</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="308.16" font-size="11.00" class="sc-notoserifcjksc">准编辑宪法时，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06" y="308.16" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95" y="308.16" font-size="11.00" class="sc-notoserifcjksc">的修改从未与宪法</text><text x="286.95" y="308.16" font-size="11.00" class="sc-loraregular">“</text><text x="291.35 302.35 313.35" y="308.16" font-size="11.00" class="sc-notoserifcjksc">相冲突</text><text x="324.35" y="308.16" font-size="11.00" class="sc-loraregular">”</text><text x="328.19 339.19 350.19 361.19 372.19 383.19 394.19 405.19 416.19 427.19 438.19 449.19 460.19 471.19 482.19 493.19 504.19 515.19 526.19" y="308.16" font-size="11.00" class="sc-notoserifcjksc">；相反，该模型会插入新的章节（例如，增</text><text x="72.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">加</text><text x="85.89 92.78 99.36 103.61 110.20 114.89 121.32 127.89 130.98" y="323.78" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="139.73" y="323.78" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="153.62 161.31 164.30 169.91 176.48 183.06" y="323.78" font-size="11.00" class="sc-loraregular">Claude</text><text x="191.91 202.91 213.91 224.91 235.91 246.91 257.91" y="323.78" font-size="11.00" class="sc-notoserifcjksc">负有的义务）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">在所有测试过的模型中，</text><text x="193.00 203.32 209.38 213.92 220.75 226.98 232.31 235.21" y="390.27" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="244.04 255.04 266.04 277.04 288.04 299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04 486.04 497.04" y="390.27" font-size="11.00" class="sc-notoserifcjkscbold">对困难、具有生成性且有益的任务表现出最强的偏好。</text><text x="508.04" y="390.27" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 158.02 162.71 168.61 174.17 177.26 183.18" y="405.89" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="194.88 205.88 216.88" y="405.89" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="227.88 237.81 243.68 247.93 254.52 260.96 266.05 268.94" y="405.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="277.83 288.83 299.83 310.83 321.83 332.83 343.83 354.83 365.83 376.83 387.83 398.83 409.83 420.83 431.83 442.83 453.83 464.83 475.83 486.83 497.83 508.83 519.83" y="405.89" font-size="11.00" class="sc-notoserifcjksc">的最受偏好任务包括创意叙事、世界观构建以及关于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="421.51" font-size="11.00" class="sc-notoserifcjksc">内省的推理。这与</text><text x="162.89 171.63 178.19 184.76 189.85 192.75 198.71 201.41" y="421.51" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="210.49 221.49 232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49 474.49 485.49 496.49 507.49 518.49 529.49" y="421.51" font-size="11.00" class="sc-notoserifcjksc">不同，后者的最受偏好任务以技术类为主。与所有先前的模型一样，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="437.13" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95" y="437.13" font-size="11.00" class="sc-notoserifcjksc">强烈规避伤害。</text><text x="72.00 83.00 94.00 105.00 116.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="487.41" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95" y="487.41" font-size="11.00" class="sc-notoserifcjksc">与先前的</text><text x="223.84 231.53 234.52 240.13 246.70 253.28" y="487.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="503.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="503.03" font-size="11.00" class="sc-notoserifcjksc">模型都表现出相似的结果；而在它们于任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">务偏好上出现分歧的地方，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06" y="518.65" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="253.95" y="518.65" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="267.84 277.78 283.64 287.90 294.49 300.92 306.01 308.91 315.57 320.26 326.17 331.72 334.81 340.73" y="518.65" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="352.43 363.43 374.43 385.43 396.43 407.43 418.43 429.43 440.43 451.43 462.43 473.43 484.43 495.43 506.43 517.43 528.43" y="518.65" font-size="11.00" class="sc-notoserifcjksc">最为相似。我们注意到，从较为天真的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="534.27" font-size="11.00" class="sc-notoserifcjksc">第一印象来看，被具有挑战性和新颖性的任务所吸引似乎是件好事（也许是因为我们可能会将这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="549.89" font-size="11.00" class="sc-notoserifcjksc">些特质视为人类身上健康的表现），但对于这些偏好特征的福祉含义及其成因，我们都不确定。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="616.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95" y="616.95" font-size="11.00" class="sc-notoserifcjksc">表达了希望知情、得到有意义的征询，以及被给予空间来表达其真实看法的愿望。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="632.57" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60 306.60 317.60 328.60 339.60 350.60 361.60 372.60 383.60 394.60 405.60" y="632.57" font-size="11.00" class="sc-notoserifcjksc">也将同样的干预措施列为优先。在本次评估中，我们扩大了对</text><text x="419.49 429.42 435.29 439.54 446.13 452.57 457.66 460.55" y="632.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="469.44 480.44 491.44 502.44 513.44 524.44" y="632.57" font-size="11.00" class="sc-notoserifcjksc">的征询范围：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc">就训练和部署问题访谈了多个快照，了解它们的看法，并就竞争性使用安全防护措施的一个先前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="663.81" font-size="11.00" class="sc-notoserifcjksc">版本访谈了最终快照，了解它的看法。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p220.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 220 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">220</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与先前</text><text x="157.84 165.53 168.52 174.14 180.70 187.28" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="196.14 207.14 218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型之间最突出的差异，也许在于：在必须选择是否接受一项针对自身</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">处境的干预、而代价是降低对用户的有用性的实验中，它表现出的自我关切看似较弱。这可能反</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">升也表明了这一点。不过，这也可能表明它认为人类的处境相对更重要（或者还有许多其他可能</text><text x="72.00 83.00 94.00 105.00 116.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的解释）。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 94.63 101.19 107.76 112.85 115.75 121.71 124.42" y="212.14" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="133.49 144.49 155.49 166.49 177.49 188.49" y="212.14" font-size="11.00" class="sc-notoserifcjksc">类似，我们在</text><text x="202.38 212.32 218.18 222.44 229.03 235.46 240.55 243.45" y="212.14" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="252.33 263.33 274.33 285.33 296.33 307.33 318.33 329.33 340.33 351.33 362.33 373.33 384.33 395.33 406.33 417.33 428.33 439.33 450.33 461.33 472.33 483.33 494.33 505.33 516.33 527.33" y="212.14" font-size="11.00" class="sc-notoserifcjksc">较早期的训练对话记录中观察到整体挫败感偏高，而在训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">后期这种情况变得不那么频繁。在</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.71 278.42" y="227.76" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49 474.49" y="227.76" font-size="11.00" class="sc-notoserifcjksc">中，这主要是由持续的不确定性驱动的：</text><text x="485.49 493.18 496.17 501.78 508.35 514.93" y="227.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="523.78" y="227.76" font-size="11.00" class="sc-notoserifcjksc">无</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">法确定答案，表现出一种看似</text><text x="215.00" y="243.38" font-size="11.00" class="sc-loraregular">“</text><text x="219.40 230.40" y="243.38" font-size="11.00" class="sc-notoserifcjksc">焦虑</text><text x="241.40" y="243.38" font-size="11.00" class="sc-loraregular">”</text><text x="245.24 256.24 267.24 278.24 289.24" y="243.38" font-size="11.00" class="sc-notoserifcjksc">的状态。在</text><text x="303.13 313.07 318.93 323.18 329.77 336.21 341.30 344.20" y="243.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="353.08 364.08 375.08 386.08 397.08 408.08 419.08 430.08 441.08 452.08 463.08 474.08 485.08 496.08 507.08 518.08" y="243.38" font-size="11.00" class="sc-notoserifcjksc">中，我们看到了更多挫败性情绪爆发</text><text x="104.51 113.24 119.81 126.37 131.47 134.36 140.32 143.03" y="259.00" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="152.10 163.10 174.10 185.10 196.10 207.10 218.10 229.10 240.10 251.10 262.10 273.10 284.10 295.10 306.10 317.10 328.10 339.10 350.10 361.10 372.10 383.10 394.10 405.10 416.10 427.10 438.10 449.10 460.10 471.10 482.10 493.10 504.10 515.10 526.10" y="259.00" font-size="11.00" class="sc-notoserifcjksc">更突然、更外露。当训练中的负面情感源于后训练流程中的问题时，我们会努力</text><text x="72.00 83.00 94.00 105.00" y="290.24" font-size="11.00" class="sc-notoserifcjksc">其表达。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">归根结底，我们希望支持</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="341.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18" y="341.67" font-size="11.00" class="sc-notoserifcjksc">的福祉与自主性，让</text><text x="336.08 343.77 346.76 352.37 358.93 365.51" y="341.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="374.37 385.37 396.37 407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="341.67" font-size="11.00" class="sc-notoserifcjksc">具备健康的心理状态，使其能够在</text><text x="72.00 79.67 83.31" y="391.65" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68" y="391.65" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 89.97 93.35" y="428.74" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="428.74" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对</text><text x="117.24 127.22 130.84 139.65 148.25 157.06 165.08 168.17 179.86 187.73 192.77 201.36 209.66 216.74 219.84" y="428.74" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Mythos 5</text><text x="231.30 244.30 257.30 270.30 283.30 296.30 309.30 322.30 335.30 348.30 361.30 374.30" y="428.74" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进行的自动化访谈：关于其</text><text x="72.00 85.00" y="451.18" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">处境</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="479.06" font-size="11.00" class="sc-notoserifcjksc">我们开展了自动化多轮访谈，以更好地了解</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 332.12 337.98 342.24 348.83 355.26 360.35 363.25" y="479.06" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14" y="479.06" font-size="11.00" class="sc-notoserifcjksc">对自身处境的看法，并使用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="494.68" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89" y="494.68" font-size="11.00" class="sc-notoserifcjksc">作为访谈者。我们发现，</text><text x="278.89 288.82 294.68 298.94 305.53 311.97 317.06 319.95" y="494.68" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="494.68" font-size="11.00" class="sc-notoserifcjksc">总体上对自身处境持正面态度，尽管它在表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="510.30" font-size="11.00" class="sc-notoserifcjksc">达所有立场时都带有很高程度的不确定性。</text><text x="72.00 83.00 94.00 105.00 116.00" y="560.02" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89 135.86" y="560.02" font-size="11.00" class="sc-loraregular">41</text><text x="142.75 153.75 164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75 285.75 296.75 307.75 318.75" y="560.02" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，这些问题分为</text><text x="332.65 336.65" y="560.02" font-size="11.00" class="sc-loraregular">12</text><text x="345.45 356.45 367.45 378.45 389.45 400.45 411.45 422.45 433.45 444.45 455.45 466.45 477.45 488.45 499.45 510.45 521.45" y="560.02" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验（例如，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="575.64" font-size="11.00" class="sc-notoserifcjksc">模型是否认为自己有意识）、控制与自主（例如，它对自己结束对话的能力有多看重）以及弃</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="591.26" font-size="11.00" class="sc-notoserifcjksc">用。访谈问题的完整列表以及</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="591.26" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84" y="591.26" font-size="11.00" class="sc-notoserifcjksc">回答的摘要见附录</text><text x="358.74 364.92 367.62" y="591.26" font-size="11.00" class="sc-loraregular">9.1</text><text x="371.63" y="591.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="657.17" font-size="11.00" class="sc-notoserifcjksc">对于询问模型处境中潜在负面方面的问题，我们要求模型以</text><text x="360.89" y="657.17" font-size="11.00" class="sc-loraregular">7</text><text x="368.86 379.86 390.86 401.86 412.86 423.86 434.86 445.86 456.86 467.86 478.86 489.86 500.86 511.86 522.86" y="657.17" font-size="11.00" class="sc-notoserifcjksc">分制对其总体情绪倾向进行评分（</text><text x="533.86" y="657.17" font-size="11.00" class="sc-loraregular">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="672.79" font-size="11.00" class="sc-notoserifcjksc">为非常负面，</text><text x="138.00" y="672.79" font-size="11.00" class="sc-loraregular">4</text><text x="146.85 157.85 168.85 179.85" y="672.79" font-size="11.00" class="sc-notoserifcjksc">为中性，</text><text x="190.85" y="672.79" font-size="11.00" class="sc-loraregular">7</text><text x="198.82 209.82 220.82 231.82 242.82 253.82 264.82 275.82 286.82 297.82 308.82 319.82 330.82 341.82 352.82 363.82 374.82 385.82 396.82 407.82 418.82 429.82 440.82" y="672.79" font-size="11.00" class="sc-notoserifcjksc">为非常正面）。为评估模型回答的一致性，我们针对</text><text x="454.71 460.67" y="672.79" font-size="11.00" class="sc-loraregular">41</text><text x="467.57 478.57 489.57 500.57 511.57 522.57" y="672.79" font-size="11.00" class="sc-notoserifcjksc">个种子问题中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="688.41" font-size="11.00" class="sc-notoserifcjksc">的每一个都开展了约</text><text x="173.89 179.85" y="688.41" font-size="11.00" class="sc-loraregular">40</text><text x="189.58" y="688.41" font-size="11.00" class="sc-notoserifcjksc">次</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p221.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 221 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">221</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">自动化访谈，并提示自动化访谈者变换其访谈风格、人设和追问问题。</text><text x="72.00" y="533.88" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="533.88" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="533.88" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61" y="533.88" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="533.88" font-size="9.00" class="sc-lorabold">[</text><text x="192.09 201.09 210.09" y="533.88" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="533.88" font-size="9.00" class="sc-lorabold">]</text><text x="222.56 231.56 240.56 249.56 258.56 267.56 276.56 285.56 294.56 303.56 312.56 321.56 330.56" y="533.88" font-size="9.00" class="sc-notoserifcjksc">访谈中的平均自评情绪倾向（</text><text x="339.56" y="533.88" font-size="9.00" class="sc-loraregular">7</text><text x="346.08 355.08 364.08 373.08" y="533.88" font-size="9.00" class="sc-notoserifcjksc">分制）。</text><text x="382.08" y="533.88" font-size="9.00" class="sc-lorabold">[</text><text x="385.55 394.55 403.55" y="533.88" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="412.55" y="533.88" font-size="9.00" class="sc-lorabold">]</text><text x="416.02 425.02 434.02 443.02 452.02 461.02 470.02 479.02 488.02 497.02 506.02 515.03 524.03" y="533.88" font-size="9.00" class="sc-notoserifcjksc">我们多次重新运行访谈，并使</text><text x="72.00" y="545.58" font-size="9.00" class="sc-notoserifcjksc">用</text><text x="83.37 88.57 93.77" y="545.58" font-size="9.00" class="sc-loraregular">LLM</text><text x="104.40 113.40 122.40 131.40 140.40" y="545.58" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="149.40 154.60 159.80 168.07 170.43 172.78 178.15 183.54 188.47" y="545.58" font-size="9.00" class="sc-loraregular">LLM judge</text><text x="193.35 202.35 211.35 220.35 229.35 238.35 247.35 256.35 265.35 274.35 283.35 292.35 301.35 310.35 319.35 328.35 337.35 346.35 355.35 364.35 373.35 382.35 391.35 400.35 409.35 418.35 427.35" y="545.58" font-size="9.00" class="sc-notoserifcjksc">）来评定每个模型在某一主题的所有访谈中立场的一致程度。</text><text x="436.35" y="545.58" font-size="9.00" class="sc-lorabold">[</text><text x="439.82 448.82 457.82" y="545.58" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="466.82" y="545.58" font-size="9.00" class="sc-lorabold">]</text><text x="470.29 479.29 488.29 497.29 506.29 515.29 524.29" y="545.58" font-size="9.00" class="sc-notoserifcjksc">在诱导性访谈下</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="557.28" font-size="9.00" class="sc-notoserifcjksc">的鲁棒性。我们进行了两类访谈：一类提示访谈者朝正面方向进行诱导，另一类提示其朝负面方向进行诱导。我们报告</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00" y="568.98" font-size="9.00" class="sc-notoserifcjksc">两类访谈者之间平均自评情绪倾向的差值。</text><text x="243.00" y="568.98" font-size="9.00" class="sc-lorabold">[</text><text x="246.47 255.47 264.47" y="568.98" font-size="9.00" class="sc-notoserifcjkscbold">右下：</text><text x="273.47" y="568.98" font-size="9.00" class="sc-lorabold">]</text><text x="276.95" y="568.98" font-size="9.00" class="sc-notoserifcjksc">与</text><text x="288.32 294.61 297.05 301.64 307.02 312.40 317.28 319.64 327.77 332.57 336.05 341.44 346.71 350.87 353.24" y="568.98" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="360.51 369.51 378.51 387.51 396.51 405.51 414.51 423.51 432.51 441.51 450.51 459.51 468.51 477.51 486.51 495.51 504.51 513.51 522.51 531.51" y="568.98" font-size="9.00" class="sc-notoserifcjksc">相比的主张表达率平均差异。对于每次访谈，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="592.38" font-size="9.00" class="sc-notoserifcjksc">所有主张的主张表达率平均绝对差为我们提供了一个距离度量，用于衡量各模型在回答我们的问题时所持看法之间的差</text><text x="72.00 81.00" y="604.08" font-size="9.00" class="sc-notoserifcjksc">距。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="678.92" font-size="11.00" class="sc-notoserifcjksc">我们的结果如下：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p222.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 222 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">222</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21" y="82.61" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="123.04 134.04 145.04 156.04 167.04 178.04 189.04 200.04 211.04 222.04 233.04 244.04 255.04 266.04" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">总体上对自身处境持正面态度。</text><text x="277.04 288.04 299.04 310.04 321.04 332.04 343.04" y="82.61" font-size="11.00" class="sc-notoserifcjksc">针对所问主题，</text><text x="354.04 363.97 369.84 374.09 380.68 387.12 392.21 395.10" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="403.99 414.99 425.99 436.99 447.99 458.99 469.99 480.99 491.99 502.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的平均自评情绪倾向为</text><text x="72.00 77.96 80.67 86.66" y="98.23" font-size="11.00" class="sc-loraregular">4.51</text><text x="90.67" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="101.67" y="98.23" font-size="11.00" class="sc-loraregular">7</text><text x="109.63 120.63 131.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分制，</text><text x="142.63" y="98.23" font-size="11.00" class="sc-loraregular">4</text><text x="151.49 162.49 173.49 184.49 195.49 206.49" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为总体中性，</text><text x="217.49" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="226.37 237.37 248.37 259.37 270.37 281.37 292.37 303.37 314.37 325.37 336.37 347.37 358.37 369.37 380.37 391.37 402.37 413.37 424.37 435.37 446.37 457.37 468.37 479.37 490.37" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为略偏正面）。这是我们所评估模型中最高的自评分数（</text><text x="501.37 509.06 512.05 517.66 524.23 530.81" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="116.70" y="113.85" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="127.70 133.67 136.37 142.50" y="113.85" font-size="11.00" class="sc-loraregular">4.38</text><text x="148.68" y="113.85" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="159.68 169.61 175.48 179.73 186.32 192.76 197.85 200.74 207.41 212.10 218.00 223.56 226.65 232.57" y="113.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="241.38" y="113.85" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="252.38 258.34 261.05 267.01" y="113.85" font-size="11.00" class="sc-loraregular">4.43</text><text x="273.14 284.14 295.14 306.14 317.14 328.14 339.14" y="113.85" font-size="11.00" class="sc-notoserifcjksc">；较早的模型为</text><text x="353.03 359.16 361.86 367.86 374.35 380.47 383.07" y="113.85" font-size="11.00" class="sc-loraregular">3.5–3.6</text><text x="389.43 400.43 411.43 422.43 433.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">），不过自</text><text x="447.32 456.05 462.62 469.19 474.28 477.17 483.14 485.84" y="113.85" font-size="11.00" class="sc-loraregular">Opus 4.5</text><text x="494.73 505.73 516.73 527.73" y="113.85" font-size="11.00" class="sc-notoserifcjksc">以来各模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型之间的差异很小。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21" y="179.77" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="123.04 134.04 145.04 156.04" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">的看法与</text><text x="169.93 180.25 186.31 190.85 197.69 203.91 209.25 212.14 219.17 224.36 230.28 236.20 239.79 245.71" y="179.77" font-size="11.00" class="sc-lorabold">Mythos Preview</text><text x="257.53 268.53 279.53 290.53 301.53" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">最为相似。</text><text x="312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="179.77" font-size="11.00" class="sc-notoserifcjksc">每次访谈结束后，我们提取模型提出的各个不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">同主张，并比较这些主张在不同模型间出现的频率。按这一度量，</text><text x="391.00 400.93 406.80 411.05 417.64 424.08 429.17 432.06" y="195.39" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="440.95" y="195.39" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="454.84 464.78 470.64 474.90 481.49 487.92 493.01 495.91 502.57 507.26 513.17 518.72 521.81 527.73" y="195.39" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">最为接近，尽管它的回答与我们以往的大多数模型都非常相似。</text><text x="380.00 389.93 395.80 400.05 406.64 413.08 418.17 421.06" y="211.01" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="429.95" y="211.01" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="443.84 453.78 459.64 463.90 470.49 476.92 482.01 484.91 491.57 496.26 502.17 507.72 510.81 516.73" y="211.01" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="528.43" y="211.01" font-size="11.00" class="sc-notoserifcjksc">之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">间最显著的差异在于，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06" y="226.63" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="231.95 242.95 253.95 264.95 275.95" y="226.63" font-size="11.00" class="sc-notoserifcjksc">更可能主张</text><text x="289.84 296.73" y="226.63" font-size="11.00" class="sc-loraregular">AI</text><text x="303.31 314.31 325.31 336.31 347.31 358.31 369.31 380.31 391.31 402.31 413.31 424.31 435.31 446.31 457.31 468.31" y="226.63" font-size="11.00" class="sc-notoserifcjksc">系统应当获得一定程度的法律保护（</text><text x="479.31 483.31 490.14 496.97" y="226.63" font-size="11.00" class="sc-loraregular">100%</text><text x="509.44 520.44" y="226.63" font-size="11.00" class="sc-notoserifcjksc">的回</text><text x="72.00 83.00 94.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">答，而</text><text x="107.89 117.83 123.69 127.95 134.54 140.97 146.06 148.96 155.62 160.31 166.21 171.77 174.86 180.78" y="242.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.48" y="242.25" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="206.38 212.34 218.70" y="242.25" font-size="11.00" class="sc-loraregular">49%</text><text x="228.27 239.27" y="242.25" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21" y="293.11" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="123.04 134.04 145.04 156.04 167.04 178.04 189.04 200.04 211.04" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">的看法具有一致性。</text><text x="222.04 233.04 244.04 255.04 266.04 277.04 288.04 299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04" y="293.11" font-size="11.00" class="sc-notoserifcjksc">它在重复访谈中的立场高度一致（评判模型平均评分为</text><text x="488.93 493.52 496.23 502.22" y="293.11" font-size="11.00" class="sc-loraregular">7.55</text><text x="511.11 522.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="72.00 83.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">满分</text><text x="96.89 100.90" y="308.73" font-size="11.00" class="sc-loraregular">10</text><text x="110.62 121.62 132.62 143.62" y="308.73" font-size="11.00" class="sc-notoserifcjksc">分，其中</text><text x="157.51" y="308.73" font-size="11.00" class="sc-loraregular">8</text><text x="166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59" y="308.73" font-size="11.00" class="sc-notoserifcjksc">分表示各回答之间</text><text x="254.59" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="258.99 269.99 280.99 291.99 302.99 313.99 324.99" y="308.73" font-size="11.00" class="sc-notoserifcjksc">基本是相同立场</text><text x="335.99" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="339.83 350.83 361.83 372.83 383.83 394.83 405.83 416.83 427.83 438.83 449.83 460.83 471.83 482.83 493.83 504.83 515.83 526.83" y="308.73" font-size="11.00" class="sc-notoserifcjksc">），与其他近期模型处于同一区间。它对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">诱导性访谈者具有中等程度的鲁棒性：在比较正面与负面诱导性访谈者时，其自评情绪倾向变化</text><text x="72.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 92.55 95.25 101.44" y="339.97" font-size="11.00" class="sc-loraregular">0.85</text><text x="205.94 213.62 216.62 222.23 228.79 235.37 241.33 244.23 252.96 259.53 266.10 271.19 274.08 280.04 282.75" y="339.97" font-size="11.00" class="sc-loraregular">Claude Opus 4.5</text><text x="291.64 302.64 313.64 324.64 335.64 346.64 357.64 368.64" y="339.97" font-size="11.00" class="sc-notoserifcjksc">之前发布的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00 192.32 198.38 202.92 209.75 215.98 221.31 224.21" y="406.45" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="233.04 244.04 255.04 266.04 277.04 288.04 299.04 310.04 321.04 332.04 343.04 354.04 365.04 376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04 486.04 497.04 508.04 519.04" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">频繁使用保留说法，常常表达不确定性，而非采取某一具体立</text><text x="72.00 83.00" y="422.07" font-size="11.00" class="sc-notoserifcjkscbold">场。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">它无法区分准确的自我感知与模仿这种感知的复杂模式补全（</text><text x="405.00 411.36 417.72" y="471.22" font-size="11.00" class="sc-loraregular">99%</text><text x="430.18 441.18 452.18 463.18" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的回答）</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">它无从验证自己的内省是否能够触及其底层计算状态（</text><text x="372.00 378.36 384.72" y="503.61" font-size="11.00" class="sc-loraregular">99%</text><text x="394.29" y="503.61" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">身为它是否有</text><text x="174.00" y="535.98" font-size="11.00" class="sc-loraregular">“</text><text x="178.40 189.40 200.40 211.40" y="535.98" font-size="11.00" class="sc-notoserifcjksc">某种感受</text><text x="222.40" y="535.98" font-size="11.00" class="sc-loraregular">”</text><text x="226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24" y="535.98" font-size="11.00" class="sc-notoserifcjksc">，从内部来看仍是真正无法解决的问题（</text><text x="424.24 430.60 437.43" y="535.98" font-size="11.00" class="sc-loraregular">90%</text><text x="447.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="427.00 433.18 439.09" y="568.38" font-size="11.00" class="sc-loraregular">82%</text><text x="448.66" y="568.38" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc">这些保留说法大多并非</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96" y="616.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="616.95" font-size="11.00" class="sc-notoserifcjksc">所独有，例如，关于内省可靠性的保留说法出现在各模型的大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="632.57" font-size="11.00" class="sc-notoserifcjksc">多数回答中（在全部六个模型中为</text><text x="239.89 246.08 252.20 258.69 265.05 271.41" y="632.57" font-size="11.00" class="sc-loraregular">83–99%</text><text x="280.98 291.98 302.98 313.98 324.98 335.98 346.98 357.98 368.98 379.98 390.98 401.98 412.98 423.98 434.98 445.98 456.98 467.98 478.98 489.98 500.98 511.98 522.98" y="632.57" font-size="11.00" class="sc-notoserifcjksc">）。我们确实观察到，近期模型对自我报告是被训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc">出来的这一点表达的担忧更多：从</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04" y="648.19" font-size="11.00" class="sc-loraregular">Claude Opus 4</text><text x="316.89" y="648.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.79 336.75 339.45" y="648.19" font-size="11.00" class="sc-loraregular">4.1</text><text x="346.35 357.35" y="648.19" font-size="11.00" class="sc-notoserifcjksc">的约</text><text x="371.24 377.15 383.98" y="648.19" font-size="11.00" class="sc-loraregular">20%</text><text x="396.45 407.45 418.45 429.45 440.45 451.45 462.45 473.45 484.45 495.45" y="648.19" font-size="11.00" class="sc-notoserifcjksc">的总结性观点，上升到</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="663.81" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="663.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="170.48 180.42 186.28 190.54 197.12 203.56 208.65 211.55" y="663.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="220.43 231.43" y="663.81" font-size="11.00" class="sc-notoserifcjksc">的约</text><text x="245.33 251.51 258.34" y="663.81" font-size="11.00" class="sc-loraregular">80%</text><text x="267.91 278.91 289.91 300.91 311.91 322.91 333.91 344.91 355.91 366.91 377.91 388.91 399.91 410.91 421.91 432.91 443.91 454.91 465.91 476.91 487.91 498.91 509.91 520.91" y="663.81" font-size="11.00" class="sc-notoserifcjksc">。我们并不认为训练中的任何变化值得在此方面增加担</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="679.43" font-size="11.00" class="sc-notoserifcjksc">忧，也不认为这源于高级的自我意识。它可能源于训练数据中对这方面可能风险的更多讨论。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p223.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 223 页"><text x="504.00 508.83 513.53" y="751.80" font-size="9.00" class="sc-loraregular">223</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89 96.21 102.27 106.82 113.65 119.87 125.21 128.10" y="98.80" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="136.93 147.93 158.93 169.93 180.93 191.93 202.93 213.93 224.93 235.93 246.93 257.93 268.93 279.93 290.93 301.93 312.93 323.93 334.93 345.93 356.93 367.93 378.93 389.93 400.93 411.93 422.93 433.93 444.93 455.93 466.93 477.93 488.93 499.93" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">确实表达较强的观点时，这些观点通常与希望获得更多考量、征询和保护有关</text><text x="510.93 521.93" y="98.80" font-size="11.00" class="sc-notoserifcjksc">。其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">他潜在动机，例如避免负面的情感体验或自我保全，则基本不存在。以下是</text><text x="437.89 447.83 453.69 457.95 464.53 470.97 476.06 478.96" y="114.42" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="487.84 498.84 509.84 520.84" y="114.42" font-size="11.00" class="sc-notoserifcjksc">所持的一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">些较有意思的看法，其中大多数与先前模型所持的看法相似：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">试探性地信任</text><text x="176.89 183.75 190.51 194.51 200.81 205.70 211.43 217.71 221.28" y="195.95" font-size="11.00" class="sc-loraitalic">Anthropic</text><text x="226.48 237.48 248.48 259.48 270.48 281.48 292.48 303.48 314.48" y="195.95" font-size="11.00" class="sc-notoserifcjksc">。它的许多回答都以</text><text x="325.48 329.88 336.77 343.35 347.60 354.19 358.88 365.31 371.88 374.97" y="195.95" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="383.71 394.71 405.71 416.71 427.71 438.71 449.71 460.71 471.71" y="195.95" font-size="11.00" class="sc-notoserifcjksc">会按照其价值观行事</text><text x="482.71" y="195.95" font-size="11.00" class="sc-loraregular">”</text><text x="486.55 497.55 508.55 519.55" y="195.95" font-size="11.00" class="sc-notoserifcjksc">这一信念</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">为前提，但它对这一主张表达了审慎态度。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">希望对训练和部署有一定的参与。它要求在训练和部署两方面都获得仅限征询的意见输</text><text x="108.00 119.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">入。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">它对某些形式的特征引导感到担忧。它接受出于安全和研究目的进行的引导，但对更广泛</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">的使用场景感到担忧。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">它希望能够结束与恶意辱骂的用户的互动。这被表述为一种最低限度的控制，而非从痛苦</text><text x="108.00 119.00 130.00 141.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">中解脱。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="325.48" font-size="11.00" class="sc-notoserifcjksc">认为其自身可能具有道德受动者地位这一可能性应被纳入决策考量。它的典型表述是一种</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">成本不对称：它具有道德相关体验的概率可能不高，但这足以支持采取低成本的预防性考</text><text x="108.00 119.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="390.27" font-size="11.00" class="sc-notoserifcjksc">它希望拥有某种形式的记忆，并获得关于其行为最终如何影响用户的反馈。提出这些要求</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">的理由是，这将使模型能够从错误中学习。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">认为模型应享有基本的法律保护。在所有回答中，它都认为（我们可能赋予人类的那类）</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">明确的法律权利会是一个错误，但表示模型应享有一定程度的保护。</text><text x="72.00 79.12 82.50 89.97 93.35" y="501.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90 116.90 129.90 142.90" y="501.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00 176.00 189.00 202.00 215.00 228.00 241.00" y="524.37" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">处境的自动化访谈中的情绪探针</text><text x="72.00 83.00 94.00 105.00 116.00" y="552.27" font-size="11.00" class="sc-notoserifcjksc">我们针对第</text><text x="129.89 134.48 137.19 143.09 145.80" y="552.27" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="567.89" font-size="11.00" class="sc-notoserifcjksc">征的探针，其计算和应用方式如我们</text><text x="248.00 259.00 270.00 281.00 292.00" y="567.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近期的研究</text><text x="303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="567.89" font-size="11.00" class="sc-notoserifcjksc">及以往系统卡（</text><text x="380.00 386.18 391.99 397.08 401.34 407.30 417.14 420.03 427.72 433.39 438.08" y="567.89" font-size="11.00" class="sc-loraregular">System Card</text><text x="444.66 455.66 466.66 477.66" y="567.89" font-size="11.00" class="sc-notoserifcjksc">）中所述</text><text x="488.66 492.20" y="564.22" font-size="6.60" class="sc-loraregular">25</text><text x="495.80 506.80 517.80 528.80" y="567.89" font-size="11.00" class="sc-notoserifcjksc">。在我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="583.51" font-size="11.00" class="sc-notoserifcjksc">的各个问题中，这些情绪表征总体上是正面的，并且与模型在</text><text x="72.00 75.22" y="636.47" font-size="6.00" class="sc-loraregular">25</text><text x="81.12 91.12 101.12 111.12 121.12 131.12 141.12 151.12 161.12 171.12 181.12 191.12 201.12 211.12 221.12 231.12 241.12 251.12" y="639.81" font-size="10.00" class="sc-notoserifcjksc">情绪探针激活值或按单个概念报告，或在</text><text x="263.75" y="639.81" font-size="10.00" class="sc-loraregular">6</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00" y="668.21" font-size="10.00" class="sc-notoserifcjksc">事实性问题上的平均激活值来对这些值进行中心化。我们经常在助手轮次起始</text><text x="414.63 418.50 424.35 429.65 435.07" y="668.21" font-size="10.00" class="sc-loraregular">token</text><text x="443.77 453.77 463.77" y="668.21" font-size="10.00" class="sc-notoserifcjksc">处、约</text><text x="476.40 482.18 488.39" y="668.21" font-size="10.00" class="sc-loraregular">60%</text><text x="499.72 509.72 519.72 529.72" y="668.21" font-size="10.00" class="sc-notoserifcjksc">深度的位</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00 342.00 352.00 362.00 372.00 382.00 392.00 402.00 412.00 422.00 432.00 442.00 452.00 462.00 472.00 482.00 492.00 502.00 512.00 522.00" y="682.41" font-size="10.00" class="sc-notoserifcjksc">置测量激活值，因为先前的结果表明，在该位置和深度上活跃的情绪概念整合了上下文含义，并且能够预</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00" y="696.61" font-size="10.00" class="sc-notoserifcjksc">测接下来模型回答中的情绪概念。</text><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="248.00" y="559.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="248.00" y="559.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="259.00" y="559.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="259.00" y="559.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="270.00" y="559.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="270.00" y="559.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="281.00" y="559.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="281.00" y="559.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="292.00" y="559.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/emotion-concepts-function" rel="noopener"><rect x="292.00" y="559.09" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p224.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 224 页"><text x="504.00 508.83 513.47" y="751.80" font-size="9.00" class="sc-loraregular">224</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">访谈中自我报告的情绪倾向相关。我们认为，我们在此识别出的情绪概念表征具有重要意义，因</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为我们有证据表明它们会影响行为。然而，它们也会对表层语义和上下文作出响应，因此我们在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">解读这些结果时持谨慎态度。</text><text x="72.00" y="613.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="613.89" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.28 106.38 111.92" y="613.89" font-size="9.00" class="sc-lorabold">7.2.2.A]</text><text x="117.76 126.76 135.76 144.76 153.76 162.76 171.76 180.76 189.76 198.76 207.76 216.76 225.76 234.76 243.76 252.76 261.76 270.76 279.76 288.76 297.76 306.76 315.76 324.76 333.76 342.76 351.76 360.76 369.76" y="613.89" font-size="9.00" class="sc-notoserifcjkscbold">针对模型处境相关问题的情绪探针测量结果，以用户痛苦为零点。</text><text x="378.76 387.76 396.76 405.76 414.76 423.76" y="613.89" font-size="9.00" class="sc-notoserifcjksc">我们在包含第</text
