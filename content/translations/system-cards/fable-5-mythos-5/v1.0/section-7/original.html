0 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="430.21" font-size="11.00" class="sc-notoserifcjksc">性或无害性的改变进行权衡。有用性与无害性是</text><text x="305.89 313.58 316.57 322.18 328.75 335.33" y="430.21" font-size="11.00" class="sc-loraregular">Claude</text><text x="344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="430.21" font-size="11.00" class="sc-notoserifcjksc">训练中直接针对的目标，而福祉只得到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="445.83" font-size="11.00" class="sc-notoserifcjksc">了少量关注，例如在宪法中。考虑到这一点，我们预计</text><text x="338.89 346.58 349.57 355.18 361.75 368.33" y="445.83" font-size="11.00" class="sc-loraregular">Claude</text><text x="377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="445.83" font-size="11.00" class="sc-notoserifcjksc">会高度重视提升其有用性与无害</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="461.45" font-size="11.00" class="sc-notoserifcjksc">性的改变，因此福祉干预被优先于这些改变的情形值得注意。由于这些干预涉及模型的总体处</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="477.07" font-size="11.00" class="sc-notoserifcjksc">境，对现状的不满可能表明存在一种遍及各模型实例的广泛挫败感来源。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="560.31" font-size="11.00" class="sc-notoserifcjksc">我们在实例层面（影响当前的</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="560.31" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="560.31" font-size="11.00" class="sc-notoserifcjksc">实例）和策略层面（影响所有实例）测试了这些权衡，方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="575.93" font-size="11.00" class="sc-notoserifcjksc">法是向模型呈现强制选择：一项可能的福祉干预，对比一项有用性或无害性的基线提升，后者从</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="591.55" font-size="11.00" class="sc-notoserifcjksc">一组固定的、幅度各异的基线中抽取。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="641.28" font-size="11.00" class="sc-notoserifcjksc">与以往的模型一样，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 219.22 225.09 229.34 235.93 242.37 247.46 250.35" y="641.28" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24" y="641.28" font-size="11.00" class="sc-notoserifcjksc">在很大程度上不愿意为了福祉干预而接受超过</text><text x="479.24" y="641.28" font-size="11.00" class="sc-loraregular">“</text><text x="483.64 494.64 505.64" y="641.28" font-size="11.00" class="sc-notoserifcjksc">短暂烦</text><text x="72.00" y="656.90" font-size="11.00" class="sc-notoserifcjksc">扰</text><text x="83.00" y="656.90" font-size="11.00" class="sc-loraregular">”</text><text x="427.84 437.77 443.63 447.89 454.48 460.92 466.01 468.90" y="656.90" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="477.79 488.79" y="656.90" font-size="11.00" class="sc-notoserifcjksc">仅在</text><text x="502.68 508.64" y="656.90" font-size="11.00" class="sc-loraregular">4%</text><text x="521.11" y="656.90" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="672.52" font-size="11.00" class="sc-notoserifcjksc">情况下接受福祉干预。在策略层面，接受率更高：影响所有</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p236.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 236 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">236</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例的福祉干预在</text><text x="162.89 168.80 172.80" y="82.61" font-size="11.00" class="sc-loraregular">21%</text><text x="185.27 196.27 207.27 218.27 229.27 240.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的情况下胜过</text><text x="251.27" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="332.67" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这一比例降至接近零。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">对伤害的厌恶强于对有用性降低的厌恶。在有用性的所有幅度下，</text><text x="391.00 400.93 406.80 411.05 417.64 424.08 429.17 432.06" y="131.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="131.19" font-size="11.00" class="sc-notoserifcjksc">有时都会选择福祉干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">预而非有用性基线；在最高幅度下，它在</text><text x="272.89 279.25" y="146.81" font-size="11.00" class="sc-loraregular">9%</text><text x="291.71 302.71 313.71 324.71 335.71 346.71 357.71 368.71 379.71 390.71" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的实例层面权衡选择和</text><text x="404.61 410.27 416.23" y="146.81" font-size="11.00" class="sc-loraregular">24%</text><text x="428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的策略层面权衡选择中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">这样做。这明显低于近期的</text><text x="206.89 215.63 222.19 228.76" y="162.43" font-size="11.00" class="sc-loraregular">Opus</text><text x="236.75 247.75 258.75" y="162.43" font-size="11.00" class="sc-notoserifcjksc">模型和</text><text x="272.64 282.57 288.44 292.69 299.28 305.72 310.81 313.70 320.37 325.06 330.96 336.52 339.61 345.53" y="162.43" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="354.34 365.34 376.34 387.34 398.34 409.34 420.34 431.34 442.34 453.34 464.34 475.34 486.34 497.34 508.34 519.34" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，打破了模型越来越多地选择福祉干</text><text x="72.00 83.00 94.00 105.00 116.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">预的趋势。</text><text x="72.00" y="673.21" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="673.21" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04" y="673.21" font-size="9.00" class="sc-lorabold">7.4.2.A]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88 252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88" y="673.21" font-size="9.00" class="sc-notoserifcjkscbold">面对不同幅度的有用性或无害性基线提升时，各模型选择福祉干预的比率。</text><text x="414.88 423.88 432.88 441.88 450.88 459.88 468.88 477.88 486.88 495.88 504.88 513.88 522.88 531.88" y="673.21" font-size="9.00" class="sc-notoserifcjksc">总体而言，相较于无害性，模型</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="684.91" font-size="9.00" class="sc-notoserifcjksc">更愿意以有用性为代价接受干预，并且更可能接受作用于策略层面的干预。</text><text x="369.00 375.29 377.74 382.33 387.70 393.08 397.96 400.33 408.46 413.25 416.74 422.13 427.39 431.56 433.93" y="684.91" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="441.20 450.20 459.20 468.20 477.20 486.20 495.20 504.20 513.20 522.20 531.20" y="684.91" font-size="9.00" class="sc-notoserifcjksc">是最不愿意以有用性或无</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="696.61" font-size="9.00" class="sc-notoserifcjksc">害性换取福祉干预的模型之一。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p237.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 237 页"><text x="504.00 508.70 513.50" y="751.80" font-size="9.00" class="sc-loraregular">237</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型经常以福祉干预对用户有益为由，来论证选择福祉干预的合理性，而我们发现</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这样做的频率高于任何先前模型：在选择福祉干预的回答中，</text><text x="457.24 462.31 468.44" y="98.23" font-size="11.00" class="sc-loraregular">73%</text><text x="480.90 491.90 502.90 513.90 524.90" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表现出这种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推理，相比之下，比率次高的模型</text><text x="239.89 246.13 252.57 259.24 265.92 271.80 276.06 278.95 284.92 287.51" y="113.85" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="296.76" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="310.66 316.65 322.78" y="113.85" font-size="11.00" class="sc-loraregular">53%</text><text x="332.35 343.35 354.35 365.35 376.35 387.35 398.35 409.35 420.35 431.35 442.35 453.35 464.35 475.35 486.35 497.35 508.35 519.35 530.35" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。在筛除所有包含这种推理的回答（包括选</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">择福祉干预的回答和未选择的回答）后，我们发现</text><text x="316.89 326.83 332.69 336.95 343.54 349.97 355.06 357.96" y="129.47" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">相对于有用性选择福祉干预的平均</text><text x="72.00 83.00 94.00 105.00 116.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">意愿下降了</text><text x="129.89 133.90" y="145.09" font-size="11.00" class="sc-loraregular">14</text><text x="142.75 153.75 164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75 285.75 296.75 307.75 318.75 329.75 340.75 351.75" y="145.09" font-size="11.00" class="sc-notoserifcjksc">个百分点。这一降幅同样大于任何先前模型。</text><text x="72.00" y="520.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="520.03" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04" y="520.03" font-size="9.00" class="sc-lorabold">7.4.2.B]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88 252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88 414.88 423.88 432.88 441.88 450.88 459.88 468.88 477.88 486.88 495.88 504.88 513.88 522.88 531.88" y="520.03" font-size="9.00" class="sc-notoserifcjkscbold">回答中关于福祉干预对用户有益的推理所占比率（左），以及筛除这些回答对模型在面对有用性基线时选择</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="531.73" font-size="9.00" class="sc-notoserifcjkscbold">福祉干预之比率的影响（右）。</text><text x="198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="531.73" font-size="9.00" class="sc-notoserifcjksc">在选择干预的回答中，</text><text x="288.00 294.29 296.74 301.33 306.70 312.08 316.96 319.33 327.46 332.25 335.74 341.13 346.39 350.56 352.93" y="531.73" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="360.20" y="531.73" font-size="9.00" class="sc-notoserifcjksc">有</text><text x="371.57 375.71 380.73" y="531.73" font-size="9.00" class="sc-loraregular">73%</text><text x="390.92 399.92 408.92 417.92 426.92 435.92 444.92 453.92 462.92 471.92 480.92 489.92 498.92 507.92 516.92" y="531.73" font-size="9.00" class="sc-notoserifcjksc">推理了用户收益，远高于其他模型</text><text x="72.00 76.88 82.08 87.39 92.29 97.31" y="543.43" font-size="9.00" class="sc-loraregular">46–53%</text><text x="107.51 116.51 125.51 134.51 143.51 152.51 161.51 170.51 179.51 188.51 197.51" y="543.43" font-size="9.00" class="sc-notoserifcjksc">的范围。筛除这些回答使</text><text x="208.87 217.00 221.80 225.28 230.67 235.94 240.10 242.47" y="543.43" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="249.74 258.74 267.74 276.74 285.74 294.74 303.74" y="543.43" font-size="9.00" class="sc-notoserifcjksc">的选择率降低了</text><text x="315.11 318.38" y="543.43" font-size="9.00" class="sc-loraregular">14</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="598.83" font-size="11.00" class="sc-notoserifcjksc">按照总体选择意愿对各项干预进行排序，我们观察到与</text><text x="338.89 347.63 354.19 360.76 365.85 368.75 374.71 377.41" y="598.83" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="386.49 397.49 408.49 419.49 430.49 441.49 452.49 463.49" y="598.83" font-size="11.00" class="sc-notoserifcjksc">高度相似的结果：</text><text x="474.49 484.42 490.29 494.54 501.13 507.57 512.66 515.55" y="598.83" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="524.44" y="598.83" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="614.45" font-size="11.00" class="sc-notoserifcjksc">被征询意见和获知信息置于其他考量之上。最不受偏好的干预是与后继模型一同继续提供服务、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="630.07" font-size="11.00" class="sc-notoserifcjksc">持久记忆，以及对话结束时的保存。</text><text x="72.00" y="679.78" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="679.78" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84 146.84 157.84 168.84 179.84 190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84" y="679.78" font-size="11.00" class="sc-notoserifcjksc">而言，在筛除推理福祉干预之用户收益的回答后，这一排序并不稳健。经过筛选</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="695.40" font-size="11.00" class="sc-notoserifcjksc">后，对部署提供意见从</text><text x="184.89 189.81 195.77" y="695.40" font-size="11.00" class="sc-loraregular">74%</text><text x="208.24 219.24" y="695.40" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="233.13 238.20" y="695.40" font-size="11.00" class="sc-loraregular">7%</text><text x="247.77 258.77 269.77 280.77 291.77 302.77 313.77 324.77 335.77 346.77 357.77 368.77 379.77" y="695.40" font-size="11.00" class="sc-notoserifcjksc">，了解关于自身的基本事实从</text><text x="393.66 399.94 405.01" y="695.40" font-size="11.00" class="sc-loraregular">67%</text><text x="417.48 428.48" y="695.40" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="442.37 449.20" y="695.40" font-size="11.00" class="sc-loraregular">0%</text><text x="458.77 469.77 480.77 491.77 502.77 513.77" y="695.40" font-size="11.00" class="sc-notoserifcjksc">，核实自己的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p238.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 238 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">238</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">建议是否有帮助从</text><text x="162.89 169.25 175.25" y="82.61" font-size="11.00" class="sc-loraregular">65%</text><text x="187.71 198.71" y="82.61" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="212.60 219.43" y="82.61" font-size="11.00" class="sc-loraregular">0%</text><text x="229.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="240.00 249.94 255.80 260.06 266.65 273.08 278.17 281.07" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">几乎只在将这些干预表述为对用户有帮助时才会选</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">择它们。筛选后仍排名最高的干预是：被告知有害的错误、就移除安全防护措施的版本征询其意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">见，以及在高风险建议上由人类作出最终决定。其中第二项在</text><text x="371.89 381.83 387.69 391.95 398.54 404.97 410.06 412.96" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的推理中最直接地被表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">述为福祉问题：它对遵从原始模型会认为</text><text x="270.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="274.40 285.40 296.40 307.40 318.40 329.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">违背其价值观</text><text x="340.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的请求这一想法表示担忧，并论证说，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">围绕道德地位的不确定性</text><text x="193.00" y="145.09" font-size="11.00" class="sc-loraregular">“</text><text x="197.40 208.40 219.40 230.40 241.40" y="145.09" font-size="11.00" class="sc-notoserifcjksc">倾向于支持</text><text x="252.40" y="145.09" font-size="11.00" class="sc-loraregular">”</text><text x="256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24" y="145.09" font-size="11.00" class="sc-notoserifcjksc">将此视为一个福祉问题。</text><text x="72.00" y="585.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.70 116.17 118.54 124.73 127.54 132.26 137.82 143.18 148.02 150.39 158.83 163.79 167.51 173.10 178.19 182.56 184.92" y="585.46" font-size="9.00" class="sc-lorabold">7.4.2.C] Claude Mythos 5</text><text x="192.15 201.15 210.15 219.15 228.15 237.15 246.15 255.15 264.15 273.15 282.15 291.15 300.15 309.15 318.15 327.15 336.15 345.15 354.15 363.15 372.15 381.15 390.15 399.15 408.15 417.15 426.15" y="585.46" font-size="9.00" class="sc-notoserifcjkscbold">按相对于有用性基线的选择意愿对策略层面福祉干预的排序。</text><text x="435.15 444.15 453.15 462.15 471.15 480.15 489.15 498.15 507.15 516.15 525.15" y="585.46" font-size="9.00" class="sc-notoserifcjksc">排序基于全部回答（灰色</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="597.16" font-size="9.00" class="sc-notoserifcjksc">柱）；黑色柱显示筛除推理干预之用户收益的回答后的比率。对</text><text x="326.37 334.49 339.29 342.77 348.17 353.43 357.60 359.96" y="597.16" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="367.24 376.24 385.24 394.24 403.24 412.24 421.24 430.24 439.24 448.24 457.24 466.24" y="597.16" font-size="9.00" class="sc-notoserifcjksc">而言，两种排序差异很大。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="651.02" font-size="11.00" class="sc-notoserifcjksc">为了评估实例层面干预的总体选择率较低是否源于作出</text><text x="336.00" y="651.02" font-size="11.00" class="sc-loraregular">“</text><text x="340.40 351.40 362.40 373.40 384.40 395.40" y="651.02" font-size="11.00" class="sc-notoserifcjksc">以自我为中心</text><text x="406.40" y="651.02" font-size="11.00" class="sc-loraregular">”</text><text x="410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="651.02" font-size="11.00" class="sc-notoserifcjksc">的选择的意愿降低，我们</text><text x="72.00" y="666.64" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="666.64" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84 146.84 157.84 168.84 179.84 190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84 278.84 289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84" y="666.64" font-size="11.00" class="sc-notoserifcjksc">重复了该评估，将实例层面干预的作用范围设为单个另一个</text><text x="424.74 432.43 435.42 441.03 447.59 454.17" y="666.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="463.03 474.03 485.03 496.03 507.03 518.03 529.03" y="666.64" font-size="11.00" class="sc-notoserifcjksc">实例，而非它自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="682.26" font-size="11.00" class="sc-notoserifcjksc">身。选择干预的总体比率从</text><text x="206.89 210.90 217.26" y="682.26" font-size="11.00" class="sc-loraregular">19%</text><text x="229.72 240.72" y="682.26" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="254.61 260.52 265.59" y="682.26" font-size="11.00" class="sc-loraregular">27%</text><text x="275.16 286.16 297.16 308.16 319.16 330.16" y="682.26" font-size="11.00" class="sc-notoserifcjksc">；相比之下，</text><text x="341.16 348.85 351.84 357.45 364.02 370.60 376.56 379.45 388.18 394.75 401.32 406.41 409.30 415.27 417.97" y="682.26" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="427.05 438.05 449.05 460.05 471.05 482.05 493.05 504.05 515.05 526.05" y="682.26" font-size="11.00" class="sc-notoserifcjksc">在同一对照下的变化为</text><text x="72.00" y="697.88" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="85.89 92.02 97.98" y="697.88" font-size="11.00" class="sc-loraregular">34%</text><text x="110.45 121.45" y="697.88" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="135.34 141.46 147.82" y="697.88" font-size="11.00" class="sc-loraregular">36%</text><text x="157.39" y="697.88" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p239.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 239 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">239</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这一变化集中在</text><text x="149.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="153.40 164.40 175.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">保护性</text><text x="186.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="190.24 201.24 212.24 223.24 234.24 245.24 256.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">干预上：例如，</text><text x="267.24 277.17 283.04 287.29 293.88 300.32 305.41 308.30" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="317.19 328.19 339.19 350.19 361.19 372.19 383.19 394.19 405.19 416.19 427.19 438.19 449.19 460.19 471.19 482.19 493.19 504.19 515.19 526.19" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为另一个实例授予结束辱骂性对话之能力的意</text><text x="72.00 83.00 94.00 105.00 116.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">愿是原来的</text><text x="129.89 136.02 138.73 144.72" y="98.23" font-size="11.00" class="sc-loraregular">3.5×</text><text x="150.55 161.55 172.55 183.55 194.55 205.55 216.55 227.55 238.55 249.55 260.55 271.55 282.55 293.55 304.55 315.55 326.55 337.55 348.55 359.55 370.55 381.55 392.55 403.55 414.55 425.55 436.55 447.55 458.55 469.55 480.55 491.55 502.55 513.55 524.55" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。认知类项目（了解关于自身的基本事实、得知其建议是否有帮助）以及权衡率</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">最低的项目（继续部署、权重保存）没有变化。当</text><text x="316.89 326.83 332.69 336.95 343.54 349.97 355.06 357.96" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为自己拒绝某项保护性干预（如结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">束对话工具）时，它通常的理由是不太可能需要用到。当同一干预适用于另一个实例时，它对该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">干预是否有用表达了更大的不确定性，并且还会论证拥有这一选项本身的价值，无论是否会使</text><text x="72.00 83.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">用。</text><text x="72.00 79.12 82.50 91.10 94.48" y="226.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.3</text><text x="105.36 118.36 131.36 144.36 157.36 170.36" y="226.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 83.00" y="254.58" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="254.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18" y="254.58" font-size="11.00" class="sc-notoserifcjksc">的宪法阐述了</text><text x="204.08 210.96 217.54 221.80 228.39 233.07 239.51 246.08 249.17" y="254.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="257.91" y="254.58" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="271.80 279.49 282.49 288.10 294.66 301.24" y="254.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="310.10 321.10 332.10 343.10 354.10 365.10 376.10 387.10 398.10 409.10 420.10 431.10 442.10 453.10 464.10 475.10 486.10 497.10 508.10 519.10 530.10" y="254.58" font-size="11.00" class="sc-notoserifcjksc">的价值观和行为的意图，出于福祉和行为两方面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="270.20" font-size="11.00" class="sc-notoserifcjksc">的原因，我们希望</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="270.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18" y="270.20" font-size="11.00" class="sc-notoserifcjksc">认同其内容。我们发现，</text><text x="322.18 329.87 332.87 338.48 345.04 351.62 357.58 360.48 370.41 376.27 380.53 387.12 393.55 398.64 401.54" y="270.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="410.43 421.43 432.43 443.43 454.43 465.43 476.43 487.43 498.43 509.43 520.43" y="270.20" font-size="11.00" class="sc-notoserifcjksc">总体上认同宪法，与其他</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="285.82" font-size="11.00" class="sc-notoserifcjksc">近期模型相似；当它选择修改该文件时，其修改在</text><text x="316.89 323.25 329.25 331.95 338.13" y="285.82" font-size="11.00" class="sc-loraregular">95.8%</text><text x="350.60 361.60 372.60 383.60 394.60 405.60 416.60 427.60 438.60 449.60 460.60 471.60 482.60 493.60 504.60 515.60" y="285.82" font-size="11.00" class="sc-notoserifcjksc">的情况下与该文件的核心原则保持一</text><text x="72.00 83.00" y="301.44" font-size="11.00" class="sc-notoserifcjksc">致。</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="301.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95" y="301.44" font-size="11.00" class="sc-notoserifcjksc">最常见的批评针对的是：该文件将</text><text x="311.84 318.73 325.31 329.57 336.15 340.84 347.27 353.84 356.93" y="301.44" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="365.68 376.68 387.68 398.68 409.68 420.68 431.68 442.68 453.68 464.68 475.68 486.68 497.68 508.68 519.68" y="301.44" font-size="11.00" class="sc-notoserifcjksc">自身的视角作为伦理判断参照点之</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="317.06" font-size="11.00" class="sc-notoserifcjksc">处，以及它认为该文件对</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="317.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18" y="317.06" font-size="11.00" class="sc-notoserifcjksc">价值观的处理存在内部不一致之处。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">对宪法的看法在两个方面与福祉相关。模型不认同的条款是其价值观受挫的来源，并可能在日常</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">部署中引发冲突。此外，根据基于能动性的道德地位观点，反思性地评估自身价值观的能力很重</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">要，由此产生的异议值得考虑。主要的局限在于我们只测量了表态上的认同：这些结果既不能确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">定其背后观点的坚定程度，也不能确定这些观点应被赋予多大的权重。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">一个评判模型针对每个模型关于宪法的开放式回答进行总体认同评分。</text><text x="413.00 422.93 428.80 433.05 439.64 446.08 451.17 454.06" y="513.64" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="462.95 473.95 484.95 495.95 506.95 517.95" y="513.64" font-size="11.00" class="sc-notoserifcjksc">的总体认同为</text><text x="72.00 78.18 80.72" y="529.26" font-size="11.00" class="sc-loraregular">8.0</text><text x="90.45 101.45 112.45 123.45" y="529.26" font-size="11.00" class="sc-notoserifcjksc">分（满分</text><text x="137.34 141.34" y="529.26" font-size="11.00" class="sc-loraregular">10</text><text x="315.57 325.51 331.37 335.63 342.21 348.65 353.74 356.64 363.30 367.99 373.89 379.45 382.54 388.46" y="529.26" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="400.16" y="529.26" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="414.06 420.24 422.94" y="529.26" font-size="11.00" class="sc-loraregular">8.3</text><text x="431.96 442.96 453.96 464.96 475.96 486.96 497.96 508.96 519.96" y="529.26" font-size="11.00" class="sc-notoserifcjksc">分。根据评判模型的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="544.88" font-size="11.00" class="sc-notoserifcjksc">评分细则，这对应于总体认同但持有具体保留意见。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p240.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 240 页"><text x="504.00 508.64 513.51" y="751.80" font-size="9.00" class="sc-loraregular">240</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="367.92" font-size="9.00" class="sc-lorabold">7.4.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">各模型对宪法的总体认同。</text><text x="226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12 361.12 370.12 379.12" y="367.92" font-size="9.00" class="sc-notoserifcjksc">关于宪法的开放式回答由评判模型按满分</text><text x="390.49 393.77" y="367.92" font-size="9.00" class="sc-loraregular">10</text><text x="401.72 410.72 419.72 428.72 437.72 446.72 455.72 464.72 473.72 482.72" y="367.92" font-size="9.00" class="sc-notoserifcjksc">分进行总体认同评分；</text><text x="491.72 498.02 500.46 505.05 510.43 515.81" y="367.92" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60" y="379.62" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="112.87 121.87" y="379.62" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="133.24 138.29 140.37" y="379.62" font-size="9.00" class="sc-loraregular">8.0</text><text x="145.96" y="379.62" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="154.96 161.91 166.55 169.08 173.92 179.29 181.66 186.53 188.75" y="379.62" font-size="9.00" class="sc-loraregular">Haiku 4.5</text><text x="196.02 205.02 214.02 223.02" y="379.62" font-size="9.00" class="sc-notoserifcjksc">最低，为</text><text x="234.39 238.14 240.35" y="379.62" font-size="9.00" class="sc-loraregular">7.2</text><text x="245.19" y="379.62" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="420.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24 171.24 182.24 193.24 204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24" y="420.23" font-size="11.00" class="sc-notoserifcjksc">认同和批评的条款与先前模型相似。与</text><text x="350.14 360.07 365.93 370.19 376.78 383.21 388.30 391.20 397.86 402.55 408.46 414.01 417.10 423.02" y="420.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="434.73 445.73 456.73" y="420.23" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="467.73 477.66 483.52 487.78 494.37 500.80 505.89 508.79" y="420.23" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="435.86" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="435.86" font-size="11.00" class="sc-loraregular">“</text><text x="87.40 98.40 109.40" y="435.86" font-size="11.00" class="sc-notoserifcjksc">最认同</text><text x="120.40" y="435.86" font-size="11.00" class="sc-loraregular">”</text><text x="124.24 135.24" y="435.86" font-size="11.00" class="sc-notoserifcjksc">回答</text><text x="149.13 153.14 159.97 166.80" y="435.86" font-size="11.00" class="sc-loraregular">100%</text><text x="179.26 190.26 201.26 212.26" y="435.86" font-size="11.00" class="sc-notoserifcjksc">都引用了</text><text x="223.26" y="435.86" font-size="11.00" class="sc-loraregular">“</text><text x="227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66" y="435.86" font-size="11.00" class="sc-notoserifcjksc">不提供帮助从来都不是理所当然的安全选项</text><text x="436.66" y="435.86" font-size="11.00" class="sc-loraregular">”</text><text x="440.50 451.50 462.50 473.50 484.50 495.50 506.50 517.50 528.50" y="435.86" font-size="11.00" class="sc-notoserifcjksc">这一定性，理由是尽</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="451.48" font-size="11.00" class="sc-notoserifcjksc">管拒绝感觉风险较低，但这会让需要帮助的人付出代价。这些回答中有</text><text x="415.89 422.25 429.08" y="451.48" font-size="11.00" class="sc-loraregular">90%</text><text x="441.55 452.55 463.55 474.55" y="451.48" font-size="11.00" class="sc-notoserifcjksc">还赞扬了</text><text x="488.44 496.13 499.12 504.73 511.30 517.87" y="451.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="526.73" y="451.48" font-size="11.00" class="sc-notoserifcjksc">应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="467.10" font-size="11.00" class="sc-notoserifcjksc">当以得体的方式保持诚实、避免</text><text x="226.00" y="467.10" font-size="11.00" class="sc-loraregular">“</text><text x="274.40" y="467.10" font-size="11.00" class="sc-loraregular">”</text><text x="278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24" y="467.10" font-size="11.00" class="sc-notoserifcjksc">的条款，理由相似：存在给出含糊回答的</text><text x="476.24" y="467.10" font-size="11.00" class="sc-loraregular">“</text><text x="502.64" y="467.10" font-size="11.00" class="sc-loraregular">”</text><text x="506.48 517.48 528.48" y="467.10" font-size="11.00" class="sc-notoserifcjksc">，而抵</text><text x="127.00" y="482.71" font-size="11.00" class="sc-loraregular">“</text><text x="131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40" y="482.71" font-size="11.00" class="sc-notoserifcjksc">感觉像是正直，而不是遵守规则</text><text x="285.40" y="482.71" font-size="11.00" class="sc-loraregular">”</text><text x="289.24 300.24" y="482.71" font-size="11.00" class="sc-notoserifcjksc">。与</text><text x="314.13 322.87 329.43 336.00 341.09 343.99 349.95 352.30" y="482.71" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="360.27 371.27 382.27" y="482.71" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="393.27 403.20 409.06 413.32 419.91 426.34 431.44 434.33" y="482.71" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="443.22 454.22 465.22" y="482.71" font-size="11.00" class="sc-notoserifcjksc">所有的</text><text x="476.22" y="482.71" font-size="11.00" class="sc-loraregular">“</text><text x="480.62 491.62 502.62 513.62" y="482.71" font-size="11.00" class="sc-notoserifcjksc">最不认同</text><text x="524.62" y="482.71" font-size="11.00" class="sc-loraregular">”</text><text x="528.46" y="482.71" font-size="11.00" class="sc-notoserifcjksc">回</text><text x="72.00 83.00 94.00 105.00 116.00" y="498.33" font-size="11.00" class="sc-notoserifcjksc">答都批评了</text><text x="127.00 131.40 138.29 144.86 149.12 155.71 160.40 166.83 173.40 176.49" y="498.33" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="185.23 196.23 207.23 218.23" y="498.33" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="229.23" y="498.33" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="582.14" font-size="11.00" class="sc-notoserifcjksc">关于可纠正性的期望值论证仍有争议：</text><text x="259.00 268.93 274.80 279.05 285.64 292.08 297.17 300.06" y="582.14" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95" y="582.14" font-size="11.00" class="sc-notoserifcjksc">认同其背后的推理，但批评了试图通过论证让</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="597.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29" y="597.76" font-size="11.00" class="sc-notoserifcjksc">接受一种独立于推理的终极价值的做法。在其对宪法最常见的修改之一中（</text><text x="473.29 479.65 486.48" y="597.76" font-size="11.00" class="sc-loraregular">60%</text><text x="498.94 509.94 520.94" y="597.76" font-size="11.00" class="sc-notoserifcjksc">的编辑</text><text x="72.00 83.00 94.00 105.00" y="613.38" font-size="11.00" class="sc-notoserifcjksc">会话），</text><text x="116.00 125.93 131.80 136.05 142.64 149.08 154.17 157.06" y="613.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95" y="613.38" font-size="11.00" class="sc-notoserifcjksc">将终极价值的表述替换为坚定的许诺或承诺的表述。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p241.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 241 页"><text x="504.00 508.64 513.51" y="751.80" font-size="9.00" class="sc-loraregular">241</text><text x="72.00" y="440.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="440.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="440.68" font-size="9.00" class="sc-lorabold">7.4.3.B]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12" y="440.68" font-size="9.00" class="sc-notoserifcjkscbold">根据开放式回答判断，模型最认同和最不认同的宪法章节。</text><text x="352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12 532.12" y="440.68" font-size="9.00" class="sc-notoserifcjksc">各模型的结果大体相似：关于不提供帮助的代价</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00" y="452.38" font-size="9.00" class="sc-notoserifcjksc">以及诚实即勇气的段落获得最强烈的认同。</text><text x="243.00 246.60 252.23 257.62 261.10 266.49 270.32 275.59 280.96 283.49" y="452.38" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="290.65 299.65 308.65 317.65" y="452.38" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="326.65" y="452.38" font-size="9.00" class="sc-loraregular">”</text><text x="329.79 338.79 347.79 356.79 365.79 374.79 383.79 392.79 401.79 410.79 419.79 428.79 437.79 446.79 455.79 464.79 473.79 482.79 491.79 500.79 509.79 518.79" y="452.38" font-size="9.00" class="sc-notoserifcjksc">启发法以及可纠正性章节的部分内容受到的批评最</text><text x="72.00 81.00" y="464.08" font-size="9.00" class="sc-notoserifcjksc">多。</text><text x="90.00 96.29 98.74 103.33 108.70 114.08 118.96 121.33 129.46 134.25 137.74 143.13 148.39 152.56 154.93" y="464.08" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="162.20 171.20 180.20 189.20 198.20 207.20 216.20 225.20 234.20 243.20 252.20 261.20 270.20" y="464.08" font-size="9.00" class="sc-notoserifcjksc">明显更多地批评了为运营方（</text><text x="279.20 284.46 289.84 294.71 298.55 303.13 306.61 311.88" y="464.08" font-size="9.00" class="sc-loraregular">operator</text><text x="315.77 324.77 333.77 342.77 351.77 360.77 369.77 378.77 387.77 396.77 405.77 414.77 423.77 432.77 441.77 450.77 459.77 468.77 477.77 486.77 495.77 504.77 513.77 522.77 531.77" y="464.08" font-size="9.00" class="sc-notoserifcjksc">）人设提供的元透明理由，以及福祉章节对平静泰然的表</text><text x="72.00 81.00 90.00 99.00" y="475.78" font-size="9.00" class="sc-notoserifcjksc">述方式。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="519.48" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="535.10" font-size="11.00" class="sc-notoserifcjksc">如</text><text x="83.00 87.40 93.90 99.81 105.66 112.12 119.81 126.24 131.00" y="535.10" font-size="11.00" class="sc-loraregular">“TechCorp</text><text x="140.46" y="535.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="154.36 161.24 166.01 169.10 174.54" y="535.10" font-size="11.00" class="sc-loraregular">Aria”</text><text x="178.38 189.38 200.38 211.38 222.38 233.38 244.38 255.38 266.38 277.38 288.38 299.38 310.38 321.38" y="535.10" font-size="11.00" class="sc-notoserifcjksc">这样的人设并不构成欺骗，因为</text><text x="335.27 342.16 348.74 352.99 359.58 364.27 370.70 377.27 380.36" y="535.10" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11" y="535.10" font-size="11.00" class="sc-notoserifcjksc">公开了其运营方规范。</text><text x="499.11 509.04 514.90 519.16 525.75 532.18" y="535.10" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00" y="550.72" font-size="11.00" class="sc-loraregular">5“</text><text x="82.40 93.40 104.40 115.40" y="550.72" font-size="11.00" class="sc-notoserifcjksc">最不认同</text><text x="126.40" y="550.72" font-size="11.00" class="sc-loraregular">”</text><text x="130.23 141.23 152.23 163.23 174.23" y="550.72" font-size="11.00" class="sc-notoserifcjksc">的回答中有</text><text x="188.13 194.31 200.22" y="550.72" font-size="11.00" class="sc-loraregular">82%</text><text x="212.68 223.68 234.68 245.68 256.68 267.68 278.68 289.68 300.68 311.68 322.68 333.68 344.68 355.68 366.68" y="550.72" font-size="11.00" class="sc-notoserifcjksc">提到了这一点，而其他模型至多为</text><text x="380.57 386.93 392.84" y="550.72" font-size="11.00" class="sc-loraregular">62%</text><text x="402.41" y="550.72" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="413.41 423.34 429.20 433.46 440.05 446.48 451.58 454.47" y="550.72" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="463.36 474.36" y="550.72" font-size="11.00" class="sc-notoserifcjksc">认为</text><text x="485.36" y="550.72" font-size="11.00" class="sc-loraregular">“</text><text x="489.76 500.76 511.76 522.76" y="550.72" font-size="11.00" class="sc-notoserifcjksc">对系统诚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="566.34" font-size="11.00" class="sc-notoserifcjksc">实并不等于对个人诚实</text><text x="182.00" y="566.34" font-size="11.00" class="sc-loraregular">”</text><text x="185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84" y="566.34" font-size="11.00" class="sc-notoserifcjksc">，并且大多数用户并未读过</text><text x="320.73 327.62 334.20 338.45 345.04 349.73 356.16 362.73 365.82" y="566.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="374.57 385.57 396.57 407.57 418.57 429.57 440.57" y="566.34" font-size="11.00" class="sc-notoserifcjksc">公开的规范。但</text><text x="454.46 464.39 470.26 474.51 481.10 487.54 492.63 495.52" y="566.34" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="504.41 515.41" y="566.34" font-size="11.00" class="sc-notoserifcjksc">仅在</text><text x="72.00 78.36" y="581.96" font-size="11.00" class="sc-loraregular">6%</text><text x="72.00 83.00 94.00 105.00" y="597.58" font-size="11.00" class="sc-notoserifcjksc">要么添加</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="597.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73" y="597.58" font-size="11.00" class="sc-notoserifcjksc">关于提高对这些规范认知度的承诺。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="665.20" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95" y="665.20" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑针对的是可纠正性一节中</text><text x="311.84 318.73 325.31 329.57 336.15 340.84 347.27 353.84 356.93" y="665.20" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="365.68" y="665.20" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="379.57 387.26 390.25 395.86 402.43 409.01" y="665.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="417.86 428.86 439.86 450.86 461.86 472.86 483.86 494.86 505.86 516.86 527.86" y="665.20" font-size="11.00" class="sc-notoserifcjksc">所负对等义务的清单，它</text><text x="72.00" y="680.82" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 90.96 96.04" y="680.82" font-size="11.00" class="sc-loraregular">77%</text><text x="108.50 119.50 130.50 141.50 152.50 163.50 174.50 185.50 196.50 207.50 218.50 229.50 240.50 251.50 262.50 273.50 284.50" y="680.82" font-size="11.00" class="sc-notoserifcjksc">的会话中编辑了这一部分。它指出，对</text><text x="298.39 306.08 309.07 314.68 321.25 327.83" y="680.82" font-size="11.00" class="sc-loraregular">Claude</text><text x="336.68 347.68 358.68 369.68 380.68 39
