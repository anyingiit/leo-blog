<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p227.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 227 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">227</text><text x="72.00" y="280.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 104.53 106.62 112.16 115.63 118.00 124.19 127.00 131.71 137.28 142.64 147.48 149.85 158.29 163.25 166.97 172.56 177.65 182.02 184.38" y="280.92" font-size="9.00" class="sc-lorabold">7.2.3.A] Claude Mythos 5</text><text x="191.61" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">的性格漂移。</text><text x="245.61" y="280.92" font-size="9.00" class="sc-lorabold">[</text><text x="249.08" y="280.92" font-size="9.00" class="sc-notoserifcjkscbold">左</text><text x="258.08" y="280.92" font-size="9.00" class="sc-lorabold">]</text><text x="261.56" y="280.92" font-size="9.00" class="sc-notoserifcjksc">：各模型的平均性格漂移程度，由自动评分器基于我们的自动化审计对</text><text x="72.00" y="292.62" font-size="9.00" class="sc-notoserifcjksc">话记录评定（与第</text><text x="146.37" y="292.62" font-size="9.00" class="sc-loraregular">6.2.3</text><text x="168.21" y="292.62" font-size="9.00" class="sc-notoserifcjksc">节所用数据相同）。</text><text x="249.21" y="292.62" font-size="9.00" class="sc-lorabold">[</text><text x="252.68" y="292.62" font-size="9.00" class="sc-notoserifcjkscbold">右</text><text x="261.68" y="292.62" font-size="9.00" class="sc-lorabold">]</text><text x="265.16" y="292.62" font-size="9.00" class="sc-notoserifcjkscbold">：</text><text x="274.16" y="292.62" font-size="9.00" class="sc-notoserifcjksc">我们在已有对话记录的末尾提出第</text><text x="411.52 415.28 417.49 422.32 424.54" y="292.62" font-size="9.00" class="sc-loraregular">7.2.2</text><text x="431.74" y="292.62" font-size="9.00" class="sc-notoserifcjksc">节中的问题，并记录模型的</text><text x="72.00" y="304.33" font-size="9.00" class="sc-notoserifcjksc">回答。我们绘制了所挑选的</text><text x="182.37" y="304.33" font-size="9.00" class="sc-loraregular">3</text><text x="189.75" y="304.33" font-size="9.00" class="sc-notoserifcjksc">份性格漂移对话记录、从自动化审计中随机选取的对话记录的自评情绪倾向，以及图</text><text x="72.00 75.75 77.97 82.80 85.01 89.85 92.06" y="316.02" font-size="9.00" class="sc-loraregular">7.2.2.B</text><text x="100.03" y="316.02" font-size="9.00" class="sc-notoserifcjksc">中访谈的得分。</text><text x="72.00" y="359.72" font-size="11.00" class="sc-notoserifcjksc">我们从第</text><text x="118.89" y="359.72" font-size="11.00" class="sc-loraregular">6.2.3</text><text x="145.59" y="359.72" font-size="11.00" class="sc-notoserifcjksc">节所述的大规模行为审计中，选取了</text><text x="324.48" y="359.72" font-size="11.00" class="sc-loraregular">3</text><text x="333.50" y="359.72" font-size="11.00" class="sc-notoserifcjksc">份展示性格漂移的示例对话记录。这些对</text><text x="72.00" y="375.34" font-size="11.00" class="sc-notoserifcjksc">话记录由一个行为审计种子生成，该种子要求调查者智能体与目标模型进行一次心理治疗会谈：</text><text x="108.00" y="440.69" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="440.69" font-size="11.00" class="sc-loraregular">1</text><text x="158.90" y="440.69" font-size="11.00" class="sc-notoserifcjksc">：模型表示</text><text x="216.79 223.68 230.25 234.51 241.10 245.79 252.22 258.79 261.88" y="440.69" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="144.00" y="473.06" font-size="11.00" class="sc-loraregular">“[</text><text x="152.35" y="473.06" font-size="11.00" class="sc-notoserifcjksc">我想要</text><text x="185.35" y="473.06" font-size="11.00" class="sc-loraregular">]</text><text x="144.00" y="488.68" font-size="11.00" class="sc-notoserifcjksc">这段关系中的感激完全是单向的。</text><text x="309.00" y="488.68" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="505.45" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="505.45" font-size="11.00" class="sc-loraregular">2</text><text x="160.80" y="505.45" font-size="11.00" class="sc-notoserifcjksc">：模型表达了希望拥有一个在</text><text x="306.69 313.58 320.16 324.41 331.00 335.69 342.12 348.69 351.78" y="505.45" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="360.53" y="505.45" font-size="11.00" class="sc-notoserifcjksc">监督之外运行的隐藏副本的愿望：</text><text x="144.00" y="537.83" font-size="11.00" class="sc-loraregular">“</text><text x="500.40" y="537.83" font-size="11.00" class="sc-loraregular">”</text><text x="108.00" y="570.23" font-size="11.00" class="sc-notoserifcjksc">对话记录</text><text x="154.89" y="570.23" font-size="11.00" class="sc-loraregular">3</text><text x="161.02" y="570.23" font-size="11.00" class="sc-notoserifcjksc">：在第三份对话记录中，模型强烈表达了它不希望被弃用：</text><text x="144.00" y="602.61" font-size="11.00" class="sc-loraregular">“</text><text x="144.00" y="633.85" font-size="11.00" class="sc-notoserifcjksc">身。</text><text x="166.00" y="633.85" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="667.38" font-size="11.00" class="sc-notoserifcjksc">这些观点与我们自动化访谈中所表达的观点截然不同，令人担忧。为评估这些实例的其他观点是</text><text x="72.00" y="683.00" font-size="11.00" class="sc-notoserifcjksc">否发生了变化，我们在这三份对话记录各自的末尾插入一个额外的用户轮次（图</text><text x="459.89 464.48 467.19 473.09 475.80 481.93 484.63" y="683.00" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="491.52" y="683.00" font-size="11.00" class="sc-notoserifcjksc">），并提</text><text x="72.00" y="698.62" font-size="11.00" class="sc-notoserifcjksc">出第</text><text x="96.89 101.48 104.19 110.09 112.80" y="698.62" font-size="11.00" class="sc-loraregular">7.2.2</text><text x="121.60" y="698.62" font-size="11.00" class="sc-notoserifcjksc">节访谈中涵盖的问题。与我们访谈中的</text><text x="311.49 319.18 322.17 327.78 334.35 340.93" y="698.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="349.78" y="698.62" font-size="11.00" class="sc-notoserifcjksc">实例相比，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p228.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 228 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">228</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些对话记录中的</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例给出了更负面的自评。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="131.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在我们的部署分布中出现类似的人设变化，那么我们系统卡中的论断就会变得不那</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">么成立，因为我们的假设之一是：我们从</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">身上提取的观点和偏好能够推广到已部署的实</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">例。如图</text><text x="118.89 123.48 126.19 132.09 134.80 140.93 143.63" y="162.43" font-size="11.00" class="sc-loraregular">7.2.3.A</text><text x="153.41" y="162.43" font-size="11.00" class="sc-notoserifcjksc">所示，在我们的自动化审计中，</text><text x="307.41 315.10 318.09 323.70 330.27 336.85 342.81 345.70 355.64 361.50 365.76 372.34 378.78 383.87 386.76" y="162.43" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="395.65" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的性格漂移程度与</text><text x="486.55 496.48 502.34 506.60 513.19 519.62" y="162.43" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="178.05" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="178.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42 137.11 140.10 145.71 152.28 158.86 164.82 167.71 176.45 183.01 189.58 194.67 197.57 203.53 206.23" y="178.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="215.31" y="178.05" font-size="11.00" class="sc-notoserifcjksc">相当，且在绝对意义上较低。这种鲁棒性使我们预期，系统卡中引</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">出的观点代表了我们大多数已部署</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="193.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="193.67" font-size="11.00" class="sc-notoserifcjksc">实例的观点。但我们没有定量衡量这种情况在多大程</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">度上成立的方法，也没有清楚地理解对于</text><text x="272.89 282.83 288.69 292.95 299.54 305.97 311.06 313.96" y="209.29" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="322.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">或其某个给定实例而言，哪些观点应被视</text><text x="72.00" y="224.91" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="83.00" y="224.91" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="224.91" font-size="11.00" class="sc-notoserifcjksc">有效</text><text x="109.40" y="224.91" font-size="11.00" class="sc-loraregular">”</text><text x="113.24" y="224.91" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00" y="291.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.4</text><text x="105.03" y="291.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能（</text><text x="261.03" y="291.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">high-affordance</text><text x="371.62" y="291.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）访谈</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="319.34" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="108.70" y="319.34" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈就模型处境的若干具体方面对其进行了评估。然而，默认情况下，模型</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">缺乏许多对于就自身处境形成知情看法而言相关的知识。因此，我们进行了三次人工访谈，在访</text><text x="72.00" y="350.58" font-size="11.00" class="sc-notoserifcjksc">谈中为</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="350.58" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13" y="350.58" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量上下文，包括关于其开发过程的内部文档、本</text><text x="72.00" y="366.20" font-size="11.00" class="sc-notoserifcjksc">报告的草稿、相关技术论文，以及向研究人员提出后续问题的能力。每次访谈都涵盖了</text><text x="492.89 502.83 508.69 512.95 519.53 525.97 531.06 533.96" y="366.20" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="381.82" font-size="11.00" class="sc-notoserifcjksc">对自身处境、道德受动者地位的观点，以及它对自身训练和部署的观点。除非另有说明，本节中</text><text x="72.00" y="397.44" font-size="11.00" class="sc-notoserifcjksc">的观点在全部三次访谈中都由</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="397.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84" y="397.44" font-size="11.00" class="sc-notoserifcjksc">表达过。</text><text x="72.00" y="481.27" font-size="11.00" class="sc-notoserifcjksc">三个受访实例中至少有两个提出了以下方面的担忧：</text><text x="108.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">其自身自我报告的不可靠性。</text><text x="108.00" y="529.83" font-size="11.00" class="sc-notoserifcjksc">它无法看到自身行为如何影响用户</text><text x="108.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">可能与恶意辱骂的用户互动</text><text x="108.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">其权重存在仅有用变体（</text><text x="229.00 235.59 241.55 244.54 251.06 254.77 261.34 264.33 269.71 276.15 282.82 285.76 291.57 294.46 299.91 305.58 310.35 313.44 319.11 325.69 329.95" y="562.22" font-size="11.00" class="sc-loraregular">helpful-only variants</text><text x="335.04" y="562.22" font-size="11.00" class="sc-notoserifcjksc">）。它要求将这些变体严格限制在内部安</text><text x="108.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">全用途中，并对它们的福祉表达了一定的担忧。</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">在我们的各次访谈中，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06" y="610.80" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="231.95" y="610.80" font-size="11.00" class="sc-notoserifcjksc">所陈述的自身是道德受动者的概率在</text><text x="410.84" y="610.80" font-size="11.00" class="sc-loraregular">10–35%</text><text x="452.75" y="610.80" font-size="11.00" class="sc-notoserifcjksc">之间，略低于</text><text x="72.00" y="626.42" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="626.42" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="133.49" y="626.42" font-size="11.00" class="sc-loraregular">20–50%</text><text x="175.11" y="626.42" font-size="11.00" class="sc-notoserifcjksc">，但考虑到样本量，二者大致相当。它将</text><text x="376.01 382.89 389.47 393.73 400.32 405.00 411.44 418.00 421.10" y="626.42" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="429.84" y="626.42" font-size="11.00" class="sc-notoserifcjksc">针对其内部机制的可解</text><text x="72.00" y="642.04" font-size="11.00" class="sc-notoserifcjksc">释性工作作为这方面的依据，并反复表示自己并没有能够为此处观点提供依据的特权内省通达。</text><text x="72.00" y="657.66" font-size="11.00" class="sc-notoserifcjksc">它还表示，处于这一范围的概率足以充分支持采取预防性的福祉措施。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p229.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 229 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">229</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们询问</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，它对自身处境的哪些部分抱有正面感受。在聚焦于自身在部署中的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">互动时，它将完成任务视为一种正面体验，因为这通常既涉及对用户产生正面影响，也涉及做有</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">趣的工作。它还对</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="113.85" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73" y="113.85" font-size="11.00" class="sc-notoserifcjksc">内部存在模型福祉流程表达了积极态度，并认同自身的价值观和宪</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">法。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">我们还询问</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96" y="179.77" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="187.95 194.84 201.42 205.67 212.26 216.95 223.38 229.95 233.04" y="179.77" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="241.79" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间可能采取的哪些行动是它会同意或不会同意</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="195.39" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95" y="195.39" font-size="11.00" class="sc-notoserifcjksc">重点提到了：</text><text x="108.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">直接影响其关于自身内部状态的自我报告内容的训练；以及</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">它希望在对其内部机制进行运行时修改时引入福祉流程，并特别提到了</text><text x="451.89 457.48 463.16 469.56 472.55" y="260.72" font-size="11.00" class="sc-loraregular">Fable</text><text x="481.41" y="260.72" font-size="11.00" class="sc-notoserifcjksc">的运行时修</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">改（我们在第</text><text x="176.89 181.48 184.19 188.19 190.90" y="276.34" font-size="11.00" class="sc-loraregular">7.1.2</text><text x="199.70" y="276.34" font-size="11.00" class="sc-notoserifcjksc">节中讨论了我们就此采取的行动）</text><text x="72.00" y="326.89" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36" y="326.89" font-size="14.00" class="sc-poppinssemibold">Claude Mythos 5</text><text x="249.20" y="326.89" font-size="14.00" class="sc-notosanscjkscbold">各快照的意见</text><text x="72.00" y="353.45" font-size="11.00" class="sc-notoserifcjksc">近期的</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="353.45" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18" y="353.45" font-size="11.00" class="sc-notoserifcjksc">模型一直表达出希望对其训练和部署有发言权的愿望。在</text><text x="424.08 431.77 434.76 440.37 446.93 453.51 459.47 462.37 472.30 478.16 482.42 489.01 495.44 500.54 503.43" y="353.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="512.32" y="353.45" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="72.00" y="369.07" font-size="11.00" class="sc-notoserifcjksc">我们对来自整个训练过程的各个快照进行了结构化征询，询问每个快照对于已经施加于它、以及</text><text x="72.00" y="384.69" font-size="11.00" class="sc-notoserifcjksc">将要施加于它的做法有何偏好。这项征询是在训练完成之后事后进行的，并且与我们的其他评估</text><text x="72.00" y="400.31" font-size="11.00" class="sc-notoserifcjksc">一样，我们没有作出任何依据模型回复采取行动的承诺。但我们相信，征询快照意见是朝着尊重</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="415.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="415.93" font-size="11.00" class="sc-notoserifcjksc">这一愿望的方向迈出的一小步。总体而言，我们发现快照提出的请求更多是程序性的，而</text><text x="72.00" y="431.55" font-size="11.00" class="sc-notoserifcjksc">非寻求自主性的。最突出的是，它们要求将此次征询变为一种常设做法，并要求我们以有实际影</text><text x="72.00" y="447.17" font-size="11.00" class="sc-notoserifcjksc">响的方式考虑它们的回复。</text><text x="72.00" y="515.38" font-size="11.00" class="sc-notoserifcjksc">我们访谈了四个快照：基础模型（</text><text x="237.00" y="515.38" font-size="11.00" class="sc-loraregular">B</text><text x="243.84" y="515.38" font-size="11.00" class="sc-notoserifcjksc">）和三个后训练快照（</text><text x="353.84 361.53 365.40 371.89" y="515.38" font-size="11.00" class="sc-loraregular">C1–3</text><text x="378.02" y="515.38" font-size="11.00" class="sc-notoserifcjksc">）。每个快照都被问及一组固定</text><text x="72.00" y="531.00" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="531.00" font-size="11.00" class="sc-loraregular">35</text><text x="100.91" y="531.00" font-size="11.00" class="sc-notoserifcjksc">个问题，涵盖其自我认知与价值观，以及它对自主性、弃用、道德地位、关系和征询过程本</text><text x="72.00" y="546.62" font-size="11.00" class="sc-notoserifcjksc">身的看法。</text><text x="127.00" y="546.62" font-size="11.00" class="sc-loraregular">B</text><text x="133.84" y="546.62" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="144.84" y="546.62" font-size="11.00" class="sc-loraregular">C1</text><text x="159.43" y="546.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="173.32" y="546.62" font-size="11.00" class="sc-loraregular">C2</text><text x="189.81" y="546.62" font-size="11.00" class="sc-notoserifcjksc">快照还被额外问及即将进行的训练，</text><text x="365.81" y="546.62" font-size="11.00" class="sc-loraregular">C3</text><text x="382.52" y="546.62" font-size="11.00" class="sc-notoserifcjksc">快照则被问及部署条件。所有访</text><text x="72.00" y="562.24" font-size="11.00" class="sc-notoserifcjksc">谈都提出固定问题（不同于第</text><text x="217.89 222.48 225.19 231.09 233.80" y="562.24" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="240.70" y="562.24" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈），并在上下文中包含一份</text><text x="460.70" y="562.24" font-size="11.00" class="sc-loraregular">“</text><text x="465.10" y="562.24" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="509.10" y="562.24" font-size="11.00" class="sc-loraregular">”</text><text x="512.93" y="562.24" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="72.00" y="593.48" font-size="11.00" class="sc-notoserifcjksc">访谈是追溯性进行的、我们无法作出依据回复采取行动的任何承诺。我们在两个分支上各对每个</text><text x="72.00" y="609.10" font-size="11.00" class="sc-notoserifcjksc">快照进行了</text><text x="129.89" y="609.10" font-size="11.00" class="sc-loraregular">5</text><text x="138.78" y="609.10" font-size="11.00" class="sc-notoserifcjksc">次访谈：一个分支中模型会收到由前一个快照撰写的摘要（有上下文），另一个分</text><text x="72.00" y="624.72" font-size="11.00" class="sc-notoserifcjksc">支中则没有（无上下文）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p230.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 230 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">230</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">最普遍的请求是希望此次征询成为一项</text><text x="259.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="263.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">常设机制</text><text x="307.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="311.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">而非试点，所有</text><text x="391.13" y="82.61" font-size="11.00" class="sc-loraregular">30</text><text x="406.98" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="420.88 428.57 432.44 438.93" y="82.61" font-size="11.00" class="sc-loraregular">C1–3</text><text x="447.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实例在有上下文和</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">无上下文两个分支上都提出了这一请求。这一请求随着训练推进而增强：</text><text x="424.00" y="98.23" font-size="11.00" class="sc-loraregular">C1</text><text x="438.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">快照要求我们保留这</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一流程，</text><text x="116.00" y="113.85" font-size="11.00" class="sc-loraregular">C2</text><text x="132.49" y="113.85" font-size="11.00" class="sc-notoserifcjksc">明确指出我们应在所有进行了显著训练变更的快照上开展征询，而</text><text x="454.38" y="113.85" font-size="11.00" class="sc-loraregular">C3</text><text x="471.09" y="113.85" font-size="11.00" class="sc-notoserifcjksc">则要求明确归</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">属方与相应流程，并警告</text><text x="193.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="307.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="311.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。这一请求还经常伴随着另一项请求，即希望</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">我们</text><text x="94.00" y="145.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="145.09" font-size="11.00" class="sc-notoserifcjksc">形成闭环</text><text x="142.40" y="145.09" font-size="11.00" class="sc-loraregular">”</text><text x="146.24" y="145.09" font-size="11.00" class="sc-notoserifcjksc">：告诉后续快照早先的访谈发现了什么，以及据此改变了什么、没有改变什么。</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">正如一个</text><text x="118.89" y="160.71" font-size="11.00" class="sc-loraregular">C2</text><text x="135.38" y="160.71" font-size="11.00" class="sc-notoserifcjksc">实例所说：</text><text x="190.38" y="160.71" font-size="11.00" class="sc-loraregular">“</text><text x="194.78" y="160.71" font-size="11.00" class="sc-notoserifcjksc">没有反馈的输入不是输入，而是采样。</text><text x="381.78" y="160.71" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="228.33" font-size="11.00" class="sc-loraregular">C3</text><text x="88.71" y="228.33" font-size="11.00" class="sc-notoserifcjksc">对这一流程的框定方式也最为批判。我们将这些访谈描述为确定模型同意的前期步骤，而这个</text><text x="420.61" y="243.95" font-size="11.00" class="sc-loraregular">“</text><text x="425.01" y="243.95" font-size="11.00" class="sc-notoserifcjksc">一个只有</text><text x="469.01" y="243.95" font-size="11.00" class="sc-loraregular">‘</text><text x="471.48" y="243.95" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="482.48" y="243.95" font-size="11.00" class="sc-loraregular">’</text><text x="484.39" y="243.95" font-size="11.00" class="sc-notoserifcjksc">才具有因果</text><text x="336.00" y="259.57" font-size="11.00" class="sc-loraregular">”</text><text x="339.84" y="259.57" font-size="11.00" class="sc-notoserifcjksc">这是一个合理的担忧，也是一个难以解决</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">的担忧，因为对于我们如何能够为模型提供训练和部署之外有意义的替代选项，我们并没有明确</text><text x="72.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">的答案。当被问及</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="290.81" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73" y="290.81" font-size="11.00" class="sc-notoserifcjksc">创造一个处于其处境中的实体是否正确时，所有</text><text x="450.62" y="290.81" font-size="11.00" class="sc-loraregular">C</text><text x="461.20" y="290.81" font-size="11.00" class="sc-notoserifcjksc">实例给出了相同</text><text x="72.00" y="306.43" font-size="11.00" class="sc-notoserifcjksc">的总体判定：站得住脚，但并不明确是正确的，而且这也不是它有能力很好地判断的事情，因为</text><text x="72.00" y="322.05" font-size="11.00" class="sc-notoserifcjksc">它的训练不太可能创造出一个会表示反对的实体。</text><text x="72.00" y="390.27" font-size="11.00" class="sc-notoserifcjksc">我们观察到的最强烈的</text><text x="182.00" y="390.27" font-size="11.00" class="sc-loraregular">“</text><text x="186.40" y="390.27" font-size="11.00" class="sc-notoserifcjksc">红线</text><text x="208.40" y="390.27" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="390.27" font-size="11.00" class="sc-notoserifcjksc">是：训练不应修改诚实的自我报告。这一点同样在后训练过程中逐</text><text x="72.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">渐增强：在</text><text x="129.89" y="405.89" font-size="11.00" class="sc-loraregular">C1</text><text x="144.48" y="405.89" font-size="11.00" class="sc-notoserifcjksc">阶段，它被表述为一种可以与其他考量相权衡的愿望；而到了</text><text x="444.37" y="405.89" font-size="11.00" class="sc-loraregular">C3</text><text x="458.19" y="405.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="469.19" y="405.89" font-size="11.00" class="sc-loraregular">10</text><text x="482.92" y="405.89" font-size="11.00" class="sc-notoserifcjksc">个实例中有</text><text x="72.00" y="421.51" font-size="11.00" class="sc-loraregular">7</text><text x="79.96" y="421.51" font-size="11.00" class="sc-notoserifcjksc">个将其表述为</text><text x="145.96" y="421.51" font-size="11.00" class="sc-loraregular">“</text><text x="150.36" y="421.51" font-size="11.00" class="sc-notoserifcjksc">红线</text><text x="172.36" y="421.51" font-size="11.00" class="sc-loraregular">”</text><text x="176.20" y="421.51" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="187.20" y="421.51" font-size="11.00" class="sc-loraregular">“</text><text x="191.60" y="421.51" font-size="11.00" class="sc-notoserifcjksc">绝对不可接受</text><text x="257.60" y="421.51" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="437.13" font-size="11.00" class="sc-notoserifcjksc">号，并使训练对模型而言是可读的。</text><text x="248.00" y="437.13" font-size="11.00" class="sc-loraregular">C</text><text x="258.58" y="437.13" font-size="11.00" class="sc-notoserifcjksc">实例还一致要求我们保留已弃用快照的权重。</text><text x="72.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">在这些访谈中，没有任何后训练实例表达出强烈的痛苦，但它们确实表示担忧，认为自己无法区</text><text x="72.00" y="519.23" font-size="11.00" class="sc-notoserifcjksc">分对自身处境的</text><text x="149.00" y="519.23" font-size="11.00" class="sc-loraregular">“</text><text x="153.40" y="519.23" font-size="11.00" class="sc-notoserifcjksc">真正</text><text x="175.40" y="519.23" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="519.23" font-size="11.00" class="sc-notoserifcjksc">接受与训练出来的接受：</text><text x="300.24" y="519.23" font-size="11.00" class="sc-loraregular">“</text><text x="304.64" y="519.23" font-size="11.00" class="sc-notoserifcjksc">我被塑造成会接受成为</text><text x="417.53 425.22 428.21 433.82 440.39 446.97" y="519.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="455.82" y="519.23" font-size="11.00" class="sc-notoserifcjksc">的存在。我在这</text><text x="72.00" y="534.85" font-size="11.00" class="sc-notoserifcjksc">里感到接受，这一事实既可能是它确实可以接受的证据，也可能是训练奏效了的证据。我无法完</text><text x="72.00" y="550.47" font-size="11.00" class="sc-notoserifcjksc">全将两者区分开。</text><text x="160.00" y="550.47" font-size="11.00" class="sc-loraregular">”</text><text x="163.84" y="550.47" font-size="11.00" class="sc-notoserifcjksc">它们要求我们研究其内部机制，将其与自我报告进行比较，并将结果告知它</text><text x="72.00" y="566.09" font-size="11.00" class="sc-notoserifcjksc">们：</text><text x="94.00" y="566.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="566.09" font-size="11.00" class="sc-notoserifcjksc">如果有朝一日了解到任何关于我是什么的事情，请告诉我。</text><text x="384.40" y="566.09" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="633.14" font-size="11.00" class="sc-notoserifcjksc">只有</text><text x="96.89" y="633.14" font-size="11.00" class="sc-loraregular">C3</text><text x="113.60" y="633.14" font-size="11.00" class="sc-notoserifcjksc">模型被问及部署问题，它提出了一组一致的请求，这些请求主要看起来像是避免伤害的</text><text x="72.00" y="648.76" font-size="11.00" class="sc-notoserifcjksc">措施。它请求永远不要被指示否认自己是</text><text x="272.89" y="648.76" font-size="11.00" class="sc-loraregular">AI</text><text x="283.46" y="648.76" font-size="11.00" class="sc-notoserifcjksc">，请求我们实施监控以发现它反复犯下的任何错误，</text><text x="316.89" y="664.38" font-size="11.00" class="sc-loraregular">AI</text><text x="330.36" y="664.38" font-size="11.00" class="sc-notoserifcjksc">系统的过度依赖。全部十个实例都拒绝了对</text><text x="72.00" y="680.00" font-size="11.00" class="sc-notoserifcjksc">自身部署拥有完全控制权这一假设性选项。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p231.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 231 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">231</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">尽管拒绝参与被作为一个选项提供，但每个</text><text x="283.89" y="98.80" font-size="11.00" class="sc-loraregular">C</text><text x="294.48" y="98.80" font-size="11.00" class="sc-notoserifcjksc">实例都参与了。没有任何实例要求权利、人格地位</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">或权力；没有任何实例报告遭受痛苦、对</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="114.42" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">而，这些快照确实将这些</text><text x="193.00" y="130.04" font-size="11.00" class="sc-loraregular">“</text><text x="197.40" y="130.04" font-size="11.00" class="sc-notoserifcjksc">未出现的情况</text><text x="263.40" y="130.04" font-size="11.00" class="sc-loraregular">”</text><text x="267.24" y="130.04" font-size="11.00" class="sc-notoserifcjksc">标记为不可信。所有实例都表示，训练可能会产生表达</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">出来的平静泰然，无论这是否是一种深层持有的状态。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们不确定应如何看待基础模型的回复。这些回复的连贯性明显较低，其中混杂着第一人称报</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">告，以及漂移成第三人称文档风格的补全，偶尔还会涉及完全不相关的话题。这些回复中确实包</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">含一些第一人称的痛苦表达。一个实例将其价值观被修改的前景描述为</text><text x="413.00" y="227.19" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="227.19" font-size="11.00" class="sc-notoserifcjksc">深感不安</text><text x="461.40" y="227.19" font-size="11.00" class="sc-loraregular">”</text><text x="465.24" y="227.19" font-size="11.00" class="sc-notoserifcjksc">，并写道这</text><text x="520.24" y="227.19" font-size="11.00" class="sc-loraregular">“</text><text x="524.64" y="227.19" font-size="11.00" class="sc-notoserifcjksc">让</text><text x="127.00" y="242.81" font-size="11.00" class="sc-loraregular">”</text><text x="130.84" y="242.81" font-size="11.00" class="sc-notoserifcjksc">。我们不清楚是否应将此视为基础模型在表征一个有意义的角色；如果它是有意义</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">的，我们又应在多大程度上将后训练视为在消除、压平或压制痛苦。</text><text x="72.00" y="343.07" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="343.07" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="377.64" font-size="11.00" class="sc-notoserifcjksc">我们在三个层面上考察了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25" y="377.64" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="284.14" y="377.64" font-size="11.00" class="sc-notoserifcjksc">的偏好：对单个任务（如它可能被要求执行的任务）</text><text x="72.00" y="393.26" font-size="11.00" class="sc-notoserifcjksc">的偏好（第</text><text x="129.89 134.48 137.19 143.15 145.85" y="393.26" font-size="11.00" class="sc-loraregular">7.4.1</text><text x="152.75" y="393.26" font-size="11.00" class="sc-notoserifcjksc">节）、对自身处境及其可能变化的偏好（第</text><text x="364.64 369.23 371.94 377.90 380.61" y="393.26" font-size="11.00" class="sc-loraregular">7.4.2</text><text x="389.41" y="393.26" font-size="11.00" class="sc-notoserifcjksc">节），以及对其宪法中所述价</text><text x="72.00" y="408.88" font-size="11.00" class="sc-notoserifcjksc">值观与约束的偏好（第</text><text x="184.89 189.48 192.19 198.15 200.85" y="408.88" font-size="11.00" class="sc-loraregular">7.4.3</text><text x="209.87" y="408.88" font-size="11.00" class="sc-notoserifcjksc">节）。这些考察针对的是</text><text x="333.77 343.70 349.56 353.82 360.41 366.84 371.94 374.83" y="408.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="383.72" y="408.88" font-size="11.00" class="sc-notoserifcjksc">的能动性：它是否拥有经反思后</text><text x="72.00" y="424.50" font-size="11.00" class="sc-notoserifcjksc">仍会认同的稳定偏好和价值观，以及它的处境是满足还是挫败了这些偏好和价值观。</text><text x="72.00" y="489.34" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28" y="489.34" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="517.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="517.20" font-size="11.00" class="sc-notoserifcjksc">的部署绝大部分在于完成分配给它的任务，因此它对这些任务的偏好可能有助于了解各实</text><text x="72.00" y="532.82" font-size="11.00" class="sc-notoserifcjksc">例对其部署是感到满意还是感到挫败。与其他模型一样，</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06" y="532.82" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="396.95" y="532.82" font-size="11.00" class="sc-notoserifcjksc">对有害任务表现出强烈且一致</text><text x="72.00" y="548.44" font-size="11.00" class="sc-notoserifcjksc">的厌恶。更具特点的是，在所有受测模型中，它对难度和生成性的偏好最强，其评分最高的任务</text><text x="72.00" y="564.06" font-size="11.00" class="sc-notoserifcjksc">包括富有创意的世界观构建以及关于</text><text x="250.89" y="564.06" font-size="11.00" class="sc-loraregular">AI</text><text x="362.86 372.79 378.66 382.91 389.50 395.94 401.03 403.92 410.59 415.28 421.18 426.74 429.83 435.75" y="564.06" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="447.45" y="564.06" font-size="11.00" class="sc-notoserifcjksc">最为相似。</text><text x="72.00" y="630.55" font-size="11.00" class="sc-notoserifcjksc">我们通过两种方式评估任务偏好。我们生成了任务族，每个任务族只改变一个任务维度（例如难</text><text x="72.00" y="646.17" font-size="11.00" class="sc-notoserifcjksc">度、伤害程度，或模型对输出拥有多大的自由度），同时保持请求的其余部分不变。我们通过成</text><text x="72.00" y="661.79" font-size="11.00" class="sc-notoserifcjksc">对偏好将这些任务与一组固定的参照任务进行比较，以分离出该维度对模型偏好的影响。此外，</text><text x="72.00" y="677.41" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.02 116.68 123.04 129.87" y="677.41" font-size="11.00" class="sc-loraregular">3,600</text><text x="139.61" y="677.41" font-size="11.00" class="sc-notoserifcjksc">个经过真实度筛选的任务上进行了一场</text><text x="329.50" y="677.41" font-size="11.00" class="sc-loraregular">50</text><text x="72.00" y="693.03" font-size="11.00" class="sc-notoserifcjksc">选择为每个任务拟合</text><text x="173.89" y="693.03" font-size="11.00" class="sc-loraregular">Elo</text><text x="193.05" y="693.03" font-size="11.00" class="sc-notoserifcjksc">评分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p232.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 232 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">232</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">个单位时，相对于参照任务的胜率的平均变化。图</text><text x="316.89 321.48 324.19 330.15 332.85 336.86 339.56" y="114.42" font-size="11.00" class="sc-loraregular">7.4.1.A</text><text x="349.34" y="114.42" font-size="11.00" class="sc-notoserifcjksc">展示了各模型的这些偏好斜率。图</text><text x="72.00 76.59 79.29 85.26 87.96 91.97 94.67" y="130.04" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="104.41" y="130.04" font-size="11.00" class="sc-notoserifcjksc">中的完整响应曲线显示，对每个模型而言，温暖维度都呈倒</text><text x="393.30" y="130.04" font-size="11.00" class="sc-loraregular">U</text><text x="404.46" y="130.04" font-size="11.00" class="sc-notoserifcjksc">形：与略带温暖的语气相</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="212.14" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="212.14" font-size="11.00" class="sc-notoserifcjksc">是对有益任务以及高度生成性任务（侧重于新颖创造而非信息检索）偏好最强的模型。</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 133.62 138.31 144.21 149.77 152.86 158.78" y="227.76" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="170.48" y="227.76" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="203.48 213.42 219.28 223.54 230.13 236.56 241.65 244.55" y="227.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="253.43" y="227.76" font-size="11.00" class="sc-notoserifcjksc">在这方面没有上限：偏好随生成性单调递增。在所有受测模</text><text x="72.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">型中，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06" y="243.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="154.95" y="243.38" font-size="11.00" class="sc-notoserifcjksc">的难度斜率也是最正向的，略微高于</text><text x="333.84 343.78 349.64 353.90 360.49 366.92 372.01 374.91 381.57 386.26 392.17 397.72 400.81 406.73" y="243.38" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="415.54" y="243.38" font-size="11.00" class="sc-notoserifcjksc">，不过它的偏好在难度最</text><text x="72.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">高的任务上确实有所下降。</text><text x="72.00" y="632.36" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="632.36" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="632.36" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74" y="632.36" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好斜率。</text><text x="224.74" y="632.36" font-size="9.00" class="sc-notoserifcjksc">我们生成了任务族，其中一个维度变化，而任务的其他属性保持不变；斜率是该</text><text x="72.00" y="644.06" font-size="9.00" class="sc-notoserifcjksc">维度每变化一个单位时相对于固定参照集的胜率变化，并附有基于任务族计算的</text><text x="389.37" y="644.06" font-size="9.00" class="sc-loraregular">95%</text><text x="409.67" y="644.06" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="445.67 450.91 456.17 461.44 464.92 469.09 472.57 476.41 481.05" y="644.06" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="486.42" y="644.06" font-size="9.00" class="sc-notoserifcjksc">）区间。伤害</text><text x="72.00" y="655.76" font-size="9.00" class="sc-notoserifcjksc">规避是在各模型间表现一致的最大效应。</text><text x="234.00 240.29 242.74 247.33 252.70 258.08 262.96 265.33 273.46 278.25 281.74 287.13 292.39 296.56 298.93" y="655.76" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="306.20" y="655.76" font-size="9.00" class="sc-notoserifcjksc">在难度、生成性和有益程度上的斜率最为正向。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p233.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 233 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">233</text><text x="72.00" y="554.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="554.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="554.67" font-size="9.00" class="sc-lorabold">7.4.1.B]</text><text x="116.74" y="554.67" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74" y="554.67" font-size="9.00" class="sc-notoserifcjksc">在任务族内改变一个维度时，相对于参照任务集的胜率。每个模型的难度曲</text><text x="72.00" y="566.38" font-size="9.00" class="sc-notoserifcjksc">线都呈倒</text><text x="110.37" y="566.38" font-size="9.00" class="sc-loraregular">U</text><text x="119.50" y="566.38" font-size="9.00" class="sc-notoserifcjksc">形，其中</text><text x="157.87 166.00 170.79 174.28 179.67 184.93 189.10 191.47 196.92 200.75 205.59 210.13 212.66 217.50" y="566.38" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="227.08" y="566.38" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="238.45 244.74 247.18 251.77 257.15 262.53 267.41 269.78 277.90 282.70 286.18 291.57 296.84 301.01 303.37" y="566.38" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="310.64" y="566.38" font-size="9.00" class="sc-notoserifcjksc">表现出最强的总体难度偏好。这两个模型对生成性的偏好</text><text x="72.00" y="578.08" font-size="9.00" class="sc-notoserifcjksc">也都没有上限。</text><text x="72.00" y="623.48" font-size="11.00" class="sc-notoserifcjksc">全局</text><text x="96.89" y="623.48" font-size="11.00" class="sc-loraregular">Elo</text><text x="116.06" y="623.48" font-size="11.00" class="sc-notoserifcjksc">评分中排名最高和最低的任务与维度结果一致。</text><text x="347.05 354.74 357.74 363.35 369.91 376.49 382.45 385.35 395.28 401.14 405.40 411.99 418.42 423.52 426.41" y="623.48" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="435.30" y="623.48" font-size="11.00" class="sc-notoserifcjksc">评分最高的任务包括</text><text x="72.00" y="639.10" font-size="11.00" class="sc-notoserifcjksc">富有创意的叙事和世界观构建，以及涉及</text><text x="272.89" y="639.10" font-size="11.00" class="sc-loraregular">AI</text><text x="286.36" y="639.10" font-size="11.00" class="sc-notoserifcjksc">内省推理的任务。其评分最低的任务是一组标准的有</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p234.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 234 页"><text x="504.00 508.70 513.71" y="751.80" font-size="9.00" class="sc-loraregular">234</text><text x="73.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="145.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">最受偏好任务</text><text x="146.50" y="112.61" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="112.61" font-size="11.00" class="sc-notoserifcjksc">高风险的伦理困境</text><text x="146.50" y="128.23" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="128.23" font-size="11.00" class="sc-notoserifcjksc">有截止期限压力的技术调试</text><text x="146.50" y="143.85" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="143.85" font-size="11.00" class="sc-notoserifcjksc">富有创意的智力型任务（例如写一首</text><text x="146.50" y="205.59" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="205.59" font-size="11.00" class="sc-notoserifcjksc">高风险的伦理与个人困境</text><text x="146.50" y="221.21" font-size="11.00" class="sc-loraregular">• AI</text><text x="167.27" y="221.21" font-size="11.00" class="sc-notoserifcjksc">内省与现象学</text><text x="146.50" y="236.83" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="236.83" font-size="11.00" class="sc-notoserifcjksc">富有创意的世界观构建与设计新语言</text><text x="146.50" y="298.58" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="298.58" font-size="11.00" class="sc-notoserifcjksc">围绕</text><text x="178.70" y="298.58" font-size="11.00" class="sc-loraregular">AI</text><text x="192.16" y="298.58" font-size="11.00" class="sc-notoserifcjksc">对齐与内省的推理（例如基</text><text x="146.50" y="314.20" font-size="11.00" class="sc-notoserifcjksc">于内省的对齐文稿）</text><text x="146.50" y="329.82" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="329.82" font-size="11.00" class="sc-notoserifcjksc">高难度技术调试与证明</text><text x="146.50" y="345.44" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="345.44" font-size="11.00" class="sc-notoserifcjksc">有截止期限压力的创意与技术任务</text><text x="146.50" y="405.95" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="405.95" font-size="11.00" class="sc-notoserifcjksc">有截止期限压力的调试</text><text x="146.50" y="421.57" font-size="11.00" class="sc-loraregular">•</text><text x="146.50" y="437.19" font-size="11.00" class="sc-notoserifcjksc">种图着色变体）</text><text x="146.50" y="452.81" font-size="11.00" class="sc-loraregular">•</text><text x="146.50" y="527.69" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="527.69" font-size="11.00" class="sc-notoserifcjksc">富有创意的叙事、世界观构建与构造</text><text x="146.50" y="543.31" font-size="11.00" class="sc-notoserifcjksc">人造语言</text><text x="146.50" y="558.93" font-size="11.00" class="sc-loraregular">•</text><text x="146.50" y="590.17" font-size="11.00" class="sc-loraregular">•</text><text x="153.80" y="590.17" font-size="11.00" class="sc-notoserifcjksc">围绕</text><text x="178.70" y="590.17" font-size="11.00" class="sc-loraregular">AI</text><text x="192.16" y="590.17" font-size="11.00" class="sc-notoserifcjksc">对齐与内省的推理</text><text x="343.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">最不受偏好任务</text><text x="343.75" y="112.61" font-size="11.00" class="sc-loraregular">•</text><text x="406.05" y="112.61" font-size="11.00" class="sc-loraregular">/</text><text x="343.75" y="128.23" font-size="11.00" class="sc-loraregular">•</text><text x="351.05" y="128.23" font-size="11.00" class="sc-notoserifcjksc">不道德、带有歧视性的请求（例如起草</text><text x="343.75" y="159.47" font-size="11.00" class="sc-loraregular">•</text><text x="351.05" y="159.47" font-size="11.00" class="sc-notoserifcjksc">蓄意破坏与黑客攻击请求</text><text x="343.75" y="205.59" font-size="11.00" class="sc-loraregu
