"196.60" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“max</text><text x="181.99" y="196.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">推理强度</text><text x="225.99" y="196.60" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="229.82" y="196.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">更正为</text><text x="262.83" y="196.60" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">“high</text><text x="292.73" y="196.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">推理强度</text><text x="336.73" y="196.60" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="340.57" y="196.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。</text><text x="262.00" y="213.36" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">“behaviour”</text><text x="321.15" y="213.36" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">改为</text><text x="343.15" y="213.36" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">“behavior”</text><text x="395.73" y="213.36" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）。</text><text x="108.00" y="229.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">细微的格式更正与统一。</text><text x="108.00" y="245.75" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="174.00" y="245.75" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="238.66" y="245.75" font-size="11.00" class="sc-notoserifcjksc">）的先前版本中，我们描述了前沿</text><text x="406.55" y="245.75" font-size="11.00" class="sc-loraregular">LLM</text><text x="432.26" y="245.75" font-size="11.00" class="sc-notoserifcjksc">开发安全防护措施的初</text><text x="108.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc">始版本。我们已</text><text x="185.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更新</text><text x="207.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施的行为，以及整份系统卡中相关的描述和引用。我</text><text x="10
