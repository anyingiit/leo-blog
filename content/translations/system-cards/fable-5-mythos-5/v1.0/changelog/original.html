45.75" font-size="11.00" class="sc-notoserifcjksc">）的先前版本中，我们描述了前沿</text><text x="406.55" y="245.75" font-size="11.00" class="sc-loraregular">LLM</text><text x="432.26" y="245.75" font-size="11.00" class="sc-notoserifcjksc">开发安全防护措施的初</text><text x="108.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc">始版本。我们已</text><text x="185.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更新</text><text x="207.00" y="261.37" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施的行为，以及整份系统卡中相关的描述和引用。我</text><text x="108.00" y="276.99" font-size="11.00" class="sc-notoserifcjksc">们保留了有关初始安全防护措施的模型福祉（</text><text x="328.00 337.83 344.27 350.85 356.81 359.80 362.69 371.37 377.34 380.33 384.05 389.72 394.41" y="276.99" font-size="11.00" class="sc-loraregular">model welfare</text><text x="400.37" y="276.99" font-size="11.00" class="sc-notoserifcjksc">）背景信息，并注明了描述</text><text x="108.00" y="292.61" font-size="11.00" class="sc-notoserifcjksc">先前版本之处。具体修改如下：</text><text x="144.00" y="326.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在第</text><text x="168.89" y="326.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">1.5</text><text x="184.49" y="326.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">节中更新了对前沿</text><text x="275.38" y="326.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">LLM</text><text x="301.09" y="326.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">开发安全防护措施的描述，以反映一项会触发回</text><text x="144.00" y="342.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">退（</text><text x="166.00" y="342.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">fallback</text><text x="205.21" y="342.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）至</text><text x="230.11" y="342.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus</text><text x="259.96" y="342.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">模型的安全防护措施。</text><text x="144.00" y="3
