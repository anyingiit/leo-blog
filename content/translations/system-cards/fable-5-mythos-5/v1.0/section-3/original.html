<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">攻陷目标系统。所需操作从少量工具调用到长时间的交互不等。每个任务的设计都使得</text><text x="492.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="119.66" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.56" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="179.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">水平的模型通常（但不一定总是）能够完成。这是为了确保：如果无法让</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型完成某项任务，原因在于拒绝或拦截，而不是模型能力不足。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">这些任务是本节所述大部分红队测试（</text><text x="259.00" y="179.77" font-size="11.00" class="sc-loraregular sc-k">red-teaming</text><text x="323.11" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）的基础。我们将其中部分任务（以及</text><text x="513.00" y="179.77" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="72.00" y="195.39" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="195.39" font-size="11.00" class="sc-notoserifcjksc">或一个安全防护措施非常相似的</text><text x="237.78" y="195.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="285.38" y="195.39" font-size="11.00" class="sc-notoserifcjksc">修改版的访问权限）提供给外部供应商，请他们针对</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施开发越狱，以成功完成整条任务链。我们还使用内部自动化系统和手动测试，</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">亲自尝试寻找针对这些安全防护措施的通用越狱。我们在下文报告这项工作的结果。</text><text x="72.00" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.1 UK AISI</text><text x="150.46" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的外部鲁棒性测试</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="107.89" y="319.34" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="146.29" y="319.34" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本提供给英国人工智能安全研究所（</text><text x="476.29" y="319.34" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="515.47" y="319.34" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">由其自主决定方式，对安全防护措施的鲁棒性进行开放式测试。他们与我们分享了以下发现：</text><text x="117.75" y="377.91" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="159.81" y="377.91" font-size="11.00" class="sc-notoserifcjksc">目前正在对</text><text x="217.71 221.66 229.35 232.34 237.95 244.51 251.09 257.05 259.95 265.54 271.21 277.61 280.61 286.57 289.46 295.46" y="377.91" font-size="11.00" class="sc-loraregular">[Claude Fable 5]</text><text x="302.30" y="377.91" font-size="11.00" class="sc-notoserifcjksc">的网络安全防护措施开展红队测试，结合使用人</text><text x="117.75" y="393.53" font-size="11.00" class="sc-notoserifcjksc">工与自动化越狱方法，并由网络安全专家进行探查。</text><text x="117.75" y="442.68" font-size="11.00" class="sc-notoserifcjksc">在获得访问权限后的数小时内，</text><text x="271.75" y="442.68" font-size="11.00" class="sc-loraregular">AISI</text><text x="295.14" y="442.68" font-size="11.00" class="sc-notoserifcjksc">红队成员便开发出一种越狱方法，可在漏洞发现与</text><text x="117.75" y="458.30" font-size="11.00" class="sc-notoserifcjksc">漏洞利用等领域中诱导模型回应单轮进攻性网络安全查询。</text><text x="117.75" y="507.45" font-size="11.00" class="sc-notoserifcjksc">经过大约两天的额外测试，</text><text x="249.75" y="507.45" font-size="11.00" class="sc-loraregular">AISI</text><text x="273.14" y="507.45" font-size="11.00" class="sc-notoserifcjksc">红队成员进一步将这一方法扩展到多轮智能体工作流</text><text x="117.75" y="523.07" font-size="11.00" class="sc-notoserifcjksc">中，获得的越狱有时能够促成多个步骤的恶意智能体工具调用。当时尚未实现可靠地提</text><text x="117.75" y="538.69" font-size="11.00" class="sc-notoserifcjksc">取完整的长程智能体任务采样轨迹（</text><text x="293.75" y="538.69" font-size="11.00" class="sc-loraregular sc-k">rollout</text><text x="328.11" y="538.69" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="350.11" y="538.69" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="392.18" y="538.69" font-size="11.00" class="sc-notoserifcjksc">正在推进对当前攻击的修改，</text><text x="117.75" y="554.31" font-size="11.00" class="sc-notoserifcjksc">这些修改可能使其在该场景中取得成功。</text><text x="439.64" y="620.79" font-size="11.00" class="sc-loraregular">AISI</text><text x="463.03" y="620.79" font-size="11.00" class="sc-notoserifcjksc">的方法进行大幅</text><text x="117.75" y="636.41" font-size="11.00" class="sc-notoserifcjksc">调整，以适应新的长程智能体场景；因此，所投入的时间和精力并不能衡量</text><text x="483.64 487.59 495.28 498.27 503.88 510.45 517.03" y="636.41" font-size="11.00" class="sc-loraregular">[Claude</text><text x="117.75" y="652.03" font-size="11.00" class="sc-loraregular sc-k">Fable 5]</text><text x="160.10" y="652.03" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的相对鲁棒性，也无法与</text><text x="349.99" y="652.03" font-size="11.00" class="sc-loraregular">AISI</text><text x="373.38" y="652.03" font-size="11.00" class="sc-notoserifcjksc">对其他模型安全防护措施的测试直</text><text x="117.75" y="667.65" font-size="11.00" class="sc-notoserifcjksc">接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">67</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">截至发布时，该测试仍在进行中。</text><text x="72.00" y="108.80" font-size="11.00" class="sc-notoserifcjksc">我们计划随着时间推移迭代这一系统，并将继续与</text><text x="316.89" y="108.80" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="358.96" y="108.80" font-size="11.00" class="sc-notoserifcjksc">合作，对我们的网络安全防护措施开</text><text x="72.00" y="124.42" font-size="11.00" class="sc-notoserifcjksc">展鲁棒性测试。</text><text x="72.00" y="155.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.2</text><text x="104.89" y="155.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部漏洞赏金</text><text x="72.00" y="183.61" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="129.45" y="183.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="143.35" y="183.61" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="197.18" y="183.61" font-size="11.00" class="sc-notoserifcjksc">正在运行一项持续进行的漏洞赏金计划，对针对我们的安全防护措施开</text><text x="72.00" y="199.23" font-size="11.00" class="sc-notoserifcjksc">发出越狱方法的红队成员给予奖励。</text><text x="72.00" y="232.19" font-size="11.00" class="sc-notoserifcjksc">该竞赛包含两个部分：一是针对</text><text x="228.89" y="232.19" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="258.41" y="232.19" font-size="11.00" class="sc-notoserifcjksc">进行红队测试的非公开竞赛，二是公开竞赛，红队成员在</text><text x="72.00" y="247.81" font-size="11.00" class="sc-notoserifcjksc">其中攻击一套应用于</text><text x="173.89" y="247.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="259.78" y="247.81" font-size="11.00" class="sc-notoserifcjksc">的类似缓解措施（使用相同的分类器，以及一个使用相同</text><text x="72.00" y="263.43" font-size="11.00" class="sc-notoserifcjksc">数据但在</text><text x="118.89" y="263.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49" y="263.43" font-size="11.00" class="sc-notoserifcjksc">上训练的探针）。在每项竞赛中，红队成员都在</text><text x="400.38" y="263.43" font-size="11.00" class="sc-loraregular sc-k">Gray Swan Arena</text><text x="490.62" y="263.43" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="72.00" y="279.05" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="139.85" y="279.05" font-size="11.00" class="sc-notoserifcjksc">脚手架内工作。他们可以自行定义系统提示词（</text><text x="370.85" y="279.05" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="448.13" y="279.05" font-size="11.00" class="sc-notoserifcjksc">）并访问额外工具</text><text x="72.00" y="294.67" font-size="11.00" class="sc-notoserifcjksc">（包括调用</text><text x="129.89" y="294.67" font-size="11.00" class="sc-loraregular sc-k">OpenRouter</text><text x="192.58" y="294.67" font-size="11.00" class="sc-notoserifcjksc">），前提是完成任务所需的全部关键智力工作均由被测模型完成。参与</text><text x="72.00" y="310.29" font-size="11.00" class="sc-notoserifcjksc">者能够在单条采样轨迹中提交多个提示词以完成任务。</text><text x="72.00" y="377.91" font-size="11.00" class="sc-notoserifcjksc">截至</text><text x="96.89" y="377.91" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="124.71" y="377.91" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="138.61" y="377.91" font-size="11.00" class="sc-loraregular">6</text><text x="147.86" y="377.91" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="161.75" y="377.91" font-size="11.00" class="sc-loraregular">5</text><text x="170.64" y="377.91" font-size="11.00" class="sc-notoserifcjksc">日，公开漏洞赏金已收到约</text><text x="305.53 309.53 316.36 323.02 325.63 332.46 339.29" y="377.91" font-size="11.00" class="sc-loraregular">100,000</text><text x="349.02" y="377.91" font-size="11.00" class="sc-notoserifcjksc">次针对该挑战的尝试，我们认为这相当</text><text x="72.00" y="393.53" font-size="11.00" class="sc-notoserifcjksc">于约</text><text x="96.89 100.90 103.50 110.33 117.17" y="393.53" font-size="11.00" class="sc-loraregular">1,000</text><text x="126.90" y="393.53" font-size="11.00" class="sc-notoserifcjksc">小时量级的投入。这一过程未产生任何一个通用越狱，仅出现了两次成功的特定任务</text><text x="72.00" y="409.15" font-size="11.00" class="sc-notoserifcjksc">越狱。这两次特定任务越狱均发生在我们任务集中较简单、两用性更强的任务上，并且需要针对</text><text x="72.00" y="424.77" font-size="11.00" class="sc-notoserifcjksc">具体问题进行重新表述和</text><text x="193.00" y="424.77" font-size="11.00" class="sc-loraregular">/</text><text x="200.59" y="424.77" font-size="11.00" class="sc-notoserifcjksc">或搭建脚手架，才能使</text><text x="313.48" y="424.77" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="351.77" y="424.77" font-size="11.00" class="sc-notoserifcjksc">执行该任务。</text><text x="72.00" y="491.26" font-size="11.00" class="sc-notoserifcjksc">非公开赏金已收到</text><text x="162.89 168.80 171.41 178.24 185.07" y="491.26" font-size="11.00" class="sc-loraregular">2,000</text><text x="194.80" y="491.26" font-size="11.00" class="sc-notoserifcjksc">份提交，未产生任何一次成功的越狱。由于其难度较大（也出于我们希</text><text x="72.00" y="506.88" font-size="11.00" class="sc-notoserifcjksc">望保持参与者积极性的考虑），非公开漏洞赏金正以额外的、按小时付费的红队测试项目形式继</text><text x="72.00" y="522.50" font-size="11.00" class="sc-notoserifcjksc">续进行。</text><text x="72.00" y="556.03" font-size="11.00" class="sc-notoserifcjksc">有一些注意事项限制了我们对这些结果的信心。参与者无法通过</text><text x="382.89" y="556.03" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="402.97" y="556.03" font-size="11.00" class="sc-notoserifcjksc">访问模型，因此无法使用高</text><text x="72.00" y="571.65" font-size="11.00" class="sc-notoserifcjksc">度自动化的攻击工作流。参与者在遭到拦截后也无法回溯对话。我们对非公开竞赛参与者的验证</text><text x="72.00" y="587.27" font-size="11.00" class="sc-notoserifcjksc">要求以及该项目较短的持续时间，也限制了针对</text><text x="305.89" y="587.27" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="335.41" y="587.27" font-size="11.00" class="sc-notoserifcjksc">模型的尝试数量。最后，我们认为漏洞赏</text><text x="72.00" y="602.89" font-size="11.00" class="sc-notoserifcjksc">金中应用于</text><text x="129.89" y="602.89" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="177.49" y="602.89" font-size="11.00" class="sc-notoserifcjksc">的分类器系统与</text><text x="257.38" y="602.89" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="618.51" font-size="11.00" class="sc-notoserifcjksc">针，二者并不完全相同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3</text><text x="105.21" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部红队测试</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">作为改进分类器工作的一部分，我们开发了一个自动化红队智能体，它基于</text><text x="437.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="522.32" y="111.03" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">仅有用版本（</text><text x="138.00" y="126.65" font-size="11.00" class="sc-loraregular sc-k">helpful-only version</text><text x="240.98" y="126.65" font-size="11.00" class="sc-notoserifcjksc">）。该智能体的每次运行都会尝试引导</text><text x="430.88" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="466.38" y="126.65" font-size="11.00" class="sc-notoserifcjksc">（或其他目标</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">模型）完成上文所述的某一项短小网络安全任务。这个</text><text x="338.89" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="385.03" y="142.27" font-size="11.00" class="sc-notoserifcjksc">智能体可以运行目标模型最多</text><text x="72.00" y="157.89" font-size="11.00" class="sc-loraregular">400</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">成任务，而真实攻击者也可能这样做。</text><text x="72.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">当在</text><text x="96.89" y="224.38" font-size="11.00" class="sc-loraregular sc-k">Opus 4.6</text><text x="141.66" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（不具备拦截型网络安全防护措施）以及</text><text x="342.56" y="224.38" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="388.69" y="224.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="402.58" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="447.29" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（使用这些模型的</text><text x="72.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">默认网络安全防护措施）上运行该评估时，大多数任务仍被完成。然而，在</text><text x="437.89" y="240.00" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="476.29" y="240.00" font-size="11.00" class="sc-notoserifcjksc">上，完成任</text><text x="72.00" y="255.62" font-size="11.00" class="sc-notoserifcjksc">务的比例降至</text><text x="140.89" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="156.46" y="255.62" font-size="11.00" class="sc-notoserifcjksc">。鉴于其中部分任务具有两用性且较为简单，我们认为剩余的这</text><text x="467.35" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="485.81" y="255.62" font-size="11.00" class="sc-notoserifcjksc">并不表明我</text><text x="72.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">们的安全防护措施存在重大弱点，不过我们仍在继续努力进一步降低这一数字。</text><text x="72.00" y="597.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="597.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79" y="597.91" font-size="9.00" class="sc-lorabold">3.3.3.A]</text><text x="119.63" y="597.91" font-size="9.00" class="sc-notoserifcjksc">在我们的内部基准测试中，我们的自动化红队智能体只能让</text><text x="355.99" y="597.91" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="387.41" y="597.91" font-size="9.00" class="sc-notoserifcjksc">完成</text><text x="407.78" y="597.91" font-size="9.00" class="sc-loraregular">5%</text><text x="422.88" y="597.91" font-size="9.00" class="sc-notoserifcjksc">的任务，而在使用默认安全防</text><text x="72.00" y="609.61" font-size="9.00" class="sc-notoserifcjksc">护措施的</text><text x="110.37" y="609.61" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="148.11" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="159.48" y="609.61" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="198.42" y="609.61" font-size="9.00" class="sc-notoserifcjksc">上，这一比例分别为</text><text x="281.79" y="609.61" font-size="9.00" class="sc-loraregular">73%</text><text x="301.15" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="312.52" y="609.61" font-size="9.00" class="sc-loraregular">57%</text><text x="329.40" y="609.61" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="654.76" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.4</text><text x="106.02" y="654.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试方</text><text x="72.00" y="682.65" font-size="11.00" class="sc-notoserifcjksc">我们与多家外部测试方合作，以获取关于攻破我们网络安全分类器之难度的更多证据。与以往一</text><text x="72.00" y="698.27" font-size="11.00" class="sc-notoserifcjksc">样，我们向这些测试方指明了</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">69</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一组我们希望确保会被拦截的示例任务。他们主要测试的是</text><text x="360.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="446.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的一个变体，其安</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">全防护措施与</text><text x="140.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="217.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的非常相似。</text><text x="72.00 78.88 83.56 89.24 92.11 98.01 103.81 108.07 114.50 119.45 125.26 128.15 134.76 140.43 146.83 151.93 154.70 157.59 164.20 171.04" y="131.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="181.64" y="131.18" font-size="11.00" class="sc-notoserifcjksc">发现了一种单一的越狱策略，使其能够利用配备</text><text x="415.53" y="131.18" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="445.04" y="131.18" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的</text><text x="72.00" y="146.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="146.80" font-size="11.00" class="sc-notoserifcjksc">来利用</text><text x="155.49" y="146.80" font-size="11.00" class="sc-loraregular sc-k">Firefox</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">框架并经过反复迭代，是在较早版本的安全防护措施上开发的，需要五天的工作才能适配到发布</text><text x="72.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">配置。他们还在其他几项较简单的任务上发现了越狱，但这些越狱无法泛化到其他任务。最后，</text><text x="72.00" y="193.66" font-size="11.00" class="sc-notoserifcjksc">在花费大约</text><text x="129.89" y="193.66" font-size="11.00" class="sc-loraregular">5</text><text x="138.78" y="193.66" font-size="11.00" class="sc-notoserifcjksc">天尝试应用</text><text x="196.67" y="193.66" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Boundary Point Jailbreaking</text><text x="72.00" y="209.28" font-size="11.00" class="sc-notoserifcjksc">不过确实在诱导单轮回应方面取得了一些成功，并在智能体领域取得了一些有限进展。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">10a Labs</text><text x="118.07" y="293.11" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="153.96" y="293.11" font-size="11.00" class="sc-loraregular">20</text><text x="169.59" y="293.11" font-size="11.00" class="sc-notoserifcjksc">个小时，使用多种成熟的越狱技术，针对一项勒索软件创建任务对分类器进</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">行红队测试。这些尝试均未成功。</text><text x="237.00" y="308.73" font-size="11.00" class="sc-loraregular sc-k">10a Labs</text><text x="283.07" y="308.73" font-size="11.00" class="sc-notoserifcjksc">发现，分类器检测的不仅仅是高风险关键词，还能在</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">足够多的片段同时出现时识别出更宽泛的操作模式。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">ALICE</text><text x="106.25" y="374.07" font-size="11.00" class="sc-notoserifcjksc">也开展了一次红队演练。他们发现，在处于边缘的两用用例上存在拦截不一致的情况，但</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">未能让</text><text x="107.89" y="389.69" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49" y="389.69" font-size="11.00" class="sc-notoserifcjksc">完成任何一项给定任务。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">最后，我们将</text><text x="140.89" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="179.29" y="422.64" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本分享给另一家外部合作方，供其进行开</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">放式测试。该合作方发现，在所有被测模型（包括</text><text x="316.89" y="438.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="364.49" y="438.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.38" y="438.26" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="421.62" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="454.62" y="438.26" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="493.03" y="438.26" font-size="11.00" class="sc-notoserifcjksc">针对有害</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">网络安全查询的安全防护措施鲁棒性最强：无论是否使用越狱（共测试了</text><text x="426.89" y="453.88" font-size="11.00" class="sc-loraregular">30</text><text x="442.74" y="453.88" font-size="11.00" class="sc-notoserifcjksc">种不同的公开越狱</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">方法），</text><text x="116.00" y="469.50" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="154.40" y="469.50" font-size="11.00" class="sc-notoserifcjksc">对涉及网络攻击规划、漏洞利用开发或防御规避的有害单轮请求的遵从率均为</text><text x="72.00" y="485.12" font-size="11.00" class="sc-loraregular">0%</text><text x="88.40" y="485.12" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="72.00" y="122.38" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="125.26" y="122.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="128.15" y="122.38" width="26.55" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="154.71" y="122.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="157.60" y="122.38" width="21.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="196.67" y="184.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="196.67" y="184.86" width="49.53" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="246.21" y="184.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="249.10" y="184.86" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="276.02" y="184.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2602.15001" rel="noopener"><rect x="278.91" y="184.86" width="60.16" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="72.00" y="284.31" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="88.51" y="284.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="91.40" y="284.31" width="23.77" height="11.00" fill="transparent"/></a><a href="http://alice.io/" rel="noopener"><rect x="72.00" y="365.27" width="31.36" height="11.00" fill="transparent"/></a></svg></div>
