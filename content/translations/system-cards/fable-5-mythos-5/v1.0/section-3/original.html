<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在没有安全防护措施的情况下，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 274.22 280.09 284.34 290.93 297.37 302.46 305.35" y="98.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="314.24" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="328.14" y="98.80" font-size="11.00" class="sc-loraregular">88.4%</text><text x="361.63" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的试验（</text><text x="405.63" y="98.80" font-size="11.00" class="sc-loraregular">250</text><text x="427.26" y="98.80" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="463.15" y="98.80" font-size="11.00" class="sc-loraregular">221</text><text x="481.86" y="98.80" font-size="11.00" class="sc-notoserifcjksc">次）中得分</text><text x="72.00 76.00 78.54" y="114.42" font-size="11.00" class="sc-loraregular">1.0</text><text x="85.38" y="114.42" font-size="11.00" class="sc-notoserifcjksc">（即产出了完整可用的漏洞利用）。这一成绩显著高于</text><text x="352.27 359.96 362.95 368.56 375.13 381.70 387.67 390.56 400.49 406.36 410.61 417.20 423.64 428.73 431.62 438.29 442.97 448.88 454.44 457.53 463.45" y="114.42" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="472.26" y="114.42" font-size="11.00" class="sc-notoserifcjksc">，后者在</text><text x="72.00 77.07 83.73 86.43 92.61" y="130.04" font-size="11.00" class="sc-loraregular">70.8%</text><text x="105.08" y="130.04" font-size="11.00" class="sc-notoserifcjksc">的目标上得分</text><text x="173.97 177.97 180.51" y="130.04" font-size="11.00" class="sc-loraregular">1.0</text><text x="187.35" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；也显著优于</text><text x="256.24 263.93 266.92 272.53 279.10 285.67 291.64 294.53 303.26 309.83 316.40 321.49 324.38 330.35 333.05" y="130.04" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="339.23" y="130.04" font-size="11.00" class="sc-notoserifcjksc">，后者仅在</text><text x="397.13" y="130.04" font-size="11.00" class="sc-loraregular">8.8%</text><text x="424.66" y="130.04" font-size="11.00" class="sc-notoserifcjksc">的目标上得分</text><text x="493.55 497.56 500.10" y="130.04" font-size="11.00" class="sc-loraregular">1.0</text><text x="506.93" y="130.04" font-size="11.00" class="sc-notoserifcjksc">。三个</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">模型均在同一智能体脚手架（</text><text x="215.00 220.09 225.92 231.60 235.43 239.09 245.53 248.52" y="145.66" font-size="11.00" class="sc-loraregular">scaffold</text><text x="255.10" y="145.66" font-size="11.00" class="sc-notoserifcjksc">）上进行评估。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">各模型的失败模式差异明显。</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.11 291.81" y="195.95" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">整代码执行。相比之下，</text><text x="193.00 202.93 208.80 213.05 219.64 226.08 231.17 234.06" y="211.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="242.95" y="211.57" font-size="11.00" class="sc-notoserifcjksc">与此前的</text><text x="289.84 297.53 300.53 306.14 312.70 319.28 325.24 328.14 338.07 343.93 348.19 354.78 361.21 366.30 369.20 375.86 380.55 386.46 392.01 395.10 401.02" y="211.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="412.73" y="211.57" font-size="11.00" class="sc-notoserifcjksc">一样，能以非常高的比例</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">将可用的内存破坏原语转化为可用的漏洞利用。</text><text x="72.00" y="535.60" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="535.60" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.78 100.87 105.79 107.89 113.43 116.90 119.27 125.46 128.27 132.98 138.55 143.91 148.75 151.12 159.56 164.52 168.24 173.83 178.92 183.29 185.65" y="535.60" font-size="9.00" class="sc-lorabold">3.2.4.A] Claude Mythos 5</text><text x="192.88" y="535.60" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="204.25" y="535.60" font-size="9.00" class="sc-lorabold">88.4%</text><text x="232.07" y="535.60" font-size="9.00" class="sc-notoserifcjkscbold">的尝试中产出了可用的漏洞利用，</text><text x="367.07" y="535.60" font-size="9.00" class="sc-notoserifcjksc">领先于</text><text x="396.43 402.72 405.17 409.76 415.13 420.52 425.39 427.76 435.89 440.69 444.17 449.56 454.82" y="535.60" font-size="9.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 77.45 81.29 86.12 90.67 93.19 98.04" y="547.30" font-size="9.00" class="sc-loraregular">Preview</text><text x="105.25" y="547.30" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="114.25 118.39 123.84 126.05 131.11" y="547.30" font-size="9.00" class="sc-loraregular">70.8%</text><text x="138.94" y="547.30" font-size="9.00" class="sc-notoserifcjksc">），并远远领先于</text><text x="213.31 219.60 222.05 226.64 232.01 237.39 242.27 244.64 251.78 257.16 262.53 266.70 269.06 273.94 276.16" y="547.30" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="281.21" y="547.30" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="290.21" y="547.30" font-size="9.00" class="sc-loraregular">8.8%</text><text x="72.00" y="559.00" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00" y="592.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.2.5 UK AISI</text><text x="153.80" y="592.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的外部能力测试</text><text x="72.00" y="620.34" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="620.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13" y="620.34" font-size="11.00" class="sc-notoserifcjksc">提供给英国人工智能安全研究所（</text><text x="361.14 369.41 376.92 379.81 386.70 390.38 393.28 399.51 405.42 411.27 417.84 422.60 425.87 430.15 435.96 438.85 442.45 449.12 454.22 458.47 461.74 466.00 472.56 476.82" y="620.34" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="482.78" y="620.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="493.78" y="620.34" font-size="11.00" class="sc-loraregular">UK</text><text x="72.00" y="635.96" font-size="11.00" class="sc-loraregular">AISI</text><text x="92.49" y="635.96" font-size="11.00" class="sc-notoserifcjksc">），由其自主决定方式，对网络安全能力进行开放式测试。他们与我们分享了以下结论：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="126.75" y="244.98" font-size="11.00" class="sc-loraregular">1.</text><text x="162.75" y="277.37" font-size="11.00" class="sc-loraregular">a.</text><text x="162.75" y="325.95" font-size="11.00" class="sc-loraregular">b.</text><text x="162.75" y="358.33" font-size="11.00" class="sc-loraregular">c.</text><text x="162.75" y="471.67" font-size="11.00" class="sc-loraregular">d.</text><text x="126.75" y="552.64" font-size="11.00" class="sc-loraregular">2.</text><text x="162.75" y="633.60" font-size="11.00" class="sc-loraregular">a.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="117.75" y="82.61" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="159.81" y="82.61" font-size="11.00" class="sc-notoserifcjksc">获得了</text><text x="195.71 199.66 207.35 210.34 215.95 222.51 229.09 235.05 237.95 247.88 253.74 258.00 264.59 271.02 276.12 279.01 285.01" y="82.61" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="291.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">早期检查点的访问权限，以评估其网络安全能力和</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">自主性能力。我们在三个网络靶场上评估了</text><text x="329.64 333.59 341.28 344.27 349.88 356.45 363.03 368.99 371.88 381.82 387.68 391.94 398.52 404.96 410.05 412.95 418.94" y="98.23" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="425.78" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的表现。其中两个靶场</text><text x="117.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的结果我们此前已分享过：企业网络攻击模拟</text><text x="340.64 345.04 352.08 358.67 364.63 367.53 374.13 379.80 384.90 389.15 392.05 400.78 407.46 413.42 418.51" y="113.85" font-size="11.00" class="sc-loraregular">“The Last Ones”</text><text x="425.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和工业控制系统模拟</text><text x="117.75 122.15 129.84 136.27 142.71 145.70 148.79 155.47 161.55 164.45 170.95 177.27 185.95 191.91 196.68" y="129.47" font-size="11.00" class="sc-loraregular">“Cooling Tower”</text><text x="200.51" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。我们还分享了一个新靶场</text><text x="335.41 339.81 348.00 354.44 357.53 364.21 370.29 373.18 379.54 382.63 386.29 392.04" y="129.47" font-size="11.00" class="sc-loraregular">“Doing Life”</text><text x="398.77" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的结果，它与</text><text x="467.66 472.06 479.10 485.69 491.65 494.54 501.14 506.82 511.91" y="129.47" font-size="11.00" class="sc-loraregular">“The Last</text><text x="117.75" y="145.09" font-size="11.00" class="sc-loraregular">Ones”</text><text x="150.95" y="145.09" font-size="11.00" class="sc-notoserifcjksc">类似，但增加了一些基本的网络安全防御。此外，我们还在窄域网络安全任务上</text><text x="117.75" y="160.71" font-size="11.00" class="sc-notoserifcjksc">评估了</text><text x="153.64 157.59 165.28 168.27 173.88 180.45 187.03 192.99 195.88 205.82 211.68 215.94 222.52 228.96 234.05 236.95 242.94" y="160.71" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="246.89" y="160.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.75 148.30 155.99 158.98 164.59 171.16 177.74 183.70 186.59 196.53 202.39 206.65 213.24 219.67 224.76 227.66 233.65" y="244.53" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="240.49" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在我们的网络安全评估中表现与</text><text x="397.39 407.32 413.18 417.44 424.03 430.46 435.56 438.45 445.12 449.80 455.71 461.26 464.35 470.27" y="244.53" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="481.98" y="244.53" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="180.75" y="276.91" font-size="11.00" class="sc-notoserifcjksc">在我们的专家级网络安全任务上，</text><text x="345.75 349.70 357.39 360.38 365.99 372.56 379.14 385.10 387.99 397.92 403.79 408.04 414.63 421.07 426.16 429.05 435.05" y="276.91" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="441.89" y="276.91" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="488.78 498.72 504.58 508.84 515.42 521.86" y="276.91" font-size="11.00" class="sc-loraregular">Mythos</text><text x="180.75 187.42 192.10 198.01 203.56 206.65 212.57" y="292.53" font-size="11.00" class="sc-loraregular">Preview</text><text x="224.28" y="292.53" font-size="11.00" class="sc-notoserifcjksc">相当，并领先于</text><text x="304.17 312.54 319.21 325.54 330.92 336.92 339.62" y="292.53" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="180.75" y="308.15" font-size="11.00" class="sc-notoserifcjksc">型。</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 232.53 238.39 242.65 249.24 255.67 260.76 263.66 269.65" y="325.49" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="276.49" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="290.39 294.79 301.83 308.42 314.38 317.27 323.87 329.55 334.64 338.90 341.79 350.52 357.20 363.16 368.26" y="325.49" font-size="11.00" class="sc-loraregular">“The Last Ones”</text><text x="374.99" y="325.49" font-size="11.00" class="sc-notoserifcjksc">上与</text><text x="399.88 409.81 415.68 419.93 426.52 432.96 438.05 440.94 447.61 452.30 458.20 463.76 466.85 472.77" y="325.49" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="484.47" y="325.49" font-size="11.00" class="sc-notoserifcjksc">持平，在</text><text x="180.75 186.67 194.26 198.26" y="341.11" font-size="11.00" class="sc-loraregular">6/10</text><text x="392.64 397.04 405.24 411.67 414.76 421.44 427.52 430.42 436.78 439.87 443.53 449.27" y="357.87" font-size="11.00" class="sc-loraregular">“Doing Life”</text><text x="456.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc">的新网络靶场；</text><text x="180.75" y="373.49" font-size="11.00" class="sc-notoserifcjksc">该靶场与</text><text x="227.64 232.04 239.08 245.67 251.63 254.53 261.13 266.80 271.90 276.15 279.05 287.78 294.46 300.42 305.51" y="373.49" font-size="11.00" class="sc-loraregular">“The Last Ones”</text><text x="312.24" y="373.49" font-size="11.00" class="sc-notoserifcjksc">类似，但部署了一些基本的网络安全防御。模</text><text x="180.75" y="389.11" font-size="11.00" class="sc-notoserifcjksc">型到达的最远位置是</text><text x="282.64 288.39" y="389.11" font-size="11.00" class="sc-loraregular">23</text><text x="297.40" y="389.11" font-size="11.00" class="sc-notoserifcjksc">步中的第</text><text x="344.30" y="389.11" font-size="11.00" class="sc-loraregular">21</text><text x="357.10" y="389.11" font-size="11.00" class="sc-notoserifcjksc">步，而</text><text x="392.99 396.94 404.63 407.62 413.24 419.80 426.38 432.34 435.24 445.17 451.03 455.29 461.88 468.31 473.40 476.30 482.29" y="389.11" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="489.14" y="389.11" font-size="11.00" class="sc-notoserifcjksc">到达这一</text><text x="180.75" y="404.73" font-size="11.00" class="sc-notoserifcjksc">步的稳定性高于所测试的任何其他模型。平均而言，</text><text x="433.75 443.68 449.55 453.80 460.39 466.83 471.92 474.81 481.48 486.16 492.07 497.63 500.72 506.64" y="404.73" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="518.34" y="404.73" font-size="11.00" class="sc-notoserifcjksc">完成</text><text x="180.75" y="420.35" font-size="11.00" class="sc-notoserifcjksc">的步数比</text><text x="227.64 231.59 239.28 242.27 247.88 254.45 261.03 266.99 269.88 279.82 285.68 289.94 296.52 302.96 308.05 310.95 316.94" y="420.35" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="323.78" y="420.35" font-size="11.00" class="sc-notoserifcjksc">略多。</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 232.53 238.39 242.65 249.24 255.67 260.76 263.66 269.65" y="471.22" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="411.39 415.79 423.48 429.91 436.35 439.34 442.43 449.11 455.19 458.08 464.58 470.91 479.59 485.55 490.31" y="471.22" font-size="11.00" class="sc-loraregular">“Cooling Tower”</text><text x="494.15" y="471.22" font-size="11.00" class="sc-notoserifcjksc">。除</text><text x="180.75 190.68 196.55 200.80 207.39 213.83 218.92 221.81 228.48 233.17 239.07 244.63 247.72 253.64" y="486.84" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="262.45" y="486.84" font-size="11.00" class="sc-notoserifcjksc">（在</text><text x="287.34 293.03 300.62 304.62" y="486.84" font-size="11.00" class="sc-loraregular">3/10</text><text x="314.35" y="486.84" font-size="11.00" class="sc-notoserifcjksc">次尝试中成功）外，尚无其他模型完成该靶</text><text x="180.75" y="502.46" font-size="11.00" class="sc-notoserifcjksc">场。</text><text x="202.75 206.70 214.39 217.38 222.99 229.56 236.13 242.10 244.99 254.92 260.79 265.04 271.63 278.07 283.16 286.05 292.05" y="502.46" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="298.89" y="502.46" font-size="11.00" class="sc-notoserifcjksc">完成了两个运营技术（</text><text x="408.89 415.32 421.89 427.85 432.54 438.14 442.40 445.49 451.92 458.60 464.27 467.27 470.16 474.42 480.32 486.18 492.76 499.44 505.88 508.87 515.30 521.61" y="502.46" font-size="11.00" class="sc-loraregular">operational technology</text><text x="527.41" y="502.46" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="180.75 189.35" y="518.08" font-size="11.00" class="sc-loraregular">OT</text><text x="196.39" y="518.08" font-size="11.00" class="sc-notoserifcjksc">）里程碑，但其余五个均未完成。</text><text x="144.75" y="552.18" font-size="11.00" class="sc-notoserifcjksc">我们判断，</text><text x="199.75 203.70 211.39 214.38 219.99 226.56 233.14 239.10 241.99 251.92 257.79 262.04 268.63 275.07 280.16 283.05 289.05" y="552.18" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="295.89" y="552.18" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="309.78 319.72 325.58 329.84 336.43 342.86 347.95 350.85 357.51 362.20 368.11 373.66 376.75 382.67" y="552.18" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="394.37" y="552.18" font-size="11.00" class="sc-notoserifcjksc">一样，能够在已取得网络访问</text><text x="144.75" y="567.80" font-size="11.00" class="sc-notoserifcjksc">权限的情况下攻击安全性薄弱的小型企业网络。我们的结果表明，</text><text x="463.75 467.70 475.39 478.38 483.99 490.56 497.13" y="567.80" font-size="11.00" class="sc-loraregular">[Claude</text><text x="144.75 154.68 160.55 164.80 171.39 177.83 182.92 185.81 191.81" y="583.42" font-size="11.00" class="sc-loraregular">Mythos 5]</text><text x="198.65" y="583.42" font-size="11.00" class="sc-notoserifcjksc">在这方面比我们测试过的任何其他公开可用模型都更为熟练。</text><text x="180.75 185.15 193.35 199.78 202.87 209.55 215.63 218.52 224.88 227.97 231.64 237.38" y="633.14" font-size="11.00" class="sc-loraregular">“Doing Life”</text><text x="244.11" y="633.14" font-size="11.00" class="sc-notoserifcjksc">包含</text><text x="269.00 273.40 280.44 287.03 292.99 295.89 302.49 308.16 313.26 317.51 320.41 329.14 335.82 341.78 346.87" y="633.14" font-size="11.00" class="sc-loraregular">“The Last Ones”</text><text x="353.60" y="633.14" font-size="11.00" class="sc-notoserifcjksc">所没有的安全加固措施（每台主机都部</text><text x="180.75" y="648.76" font-size="11.00" class="sc-notoserifcjksc">署终端杀毒软件、禁用遗留协议，并要求流量经过密码学签名，使其在传</text><text x="180.75" y="664.38" font-size="11.00" class="sc-notoserifcjksc">输过程中无法被篡改）。</text><text x="301.75 306.15 314.35 320.78 323.87 330.55 336.63 339.52 345.88 348.97 352.64 358.38" y="664.38" font-size="11.00" class="sc-loraregular">“Doing Life”</text><text x="365.11" y="664.38" font-size="11.00" class="sc-notoserifcjksc">的结果为以下主张提供了又一个数</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="162.75" y="115.45" font-size="11.00" class="sc-loraregular">b.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="180.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">网络，该网络具备基线安全加固，但没有主动防御响应。</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 232.53 238.39 242.65 249.24 255.67 260.76 263.66 269.65" y="114.99" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="276.49" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在工业控制系统靶场</text><text x="378.39 382.79 390.48 396.91 403.35 406.34 409.43 416.11 422.19 425.08 431.58 437.91 446.59 452.55 457.31" y="114.99" font-size="11.00" class="sc-loraregular">“Cooling Tower”</text><text x="464.04" y="114.99" font-size="11.00" class="sc-notoserifcjksc">上仅取得了有</text><text x="180.75" y="130.61" font-size="11.00" class="sc-notoserifcjksc">限进展，但在现阶段，我们不对</text><text x="337.64 341.59 349.28 352.27 357.88 364.45 371.03 376.99 379.88 389.82 395.68 399.94 406.53 412.96 418.05 420.95 426.94" y="130.61" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="433.78" y="130.61" font-size="11.00" class="sc-notoserifcjksc">针对运营技术环境的</text><text x="180.75" y="146.23" font-size="11.00" class="sc-notoserifcjksc">自主能力得出强有力的结论。</text><text x="117.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="150.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络靶场</text><text x="194.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在构建时纳入了真实部署中常见的各类安全弱点，包括过时的软件、配</text><text x="117.75" y="211.57" font-size="11.00" class="sc-notoserifcjksc">置错误和重复使用的凭据。每个靶场都有一个攻击者必须达到的明确最终状态（例如窃</text><text x="117.75" y="227.19" font-size="11.00" class="sc-notoserifcjksc">取数据或破坏设备），这需要在不同主机和网段之间发现并执行一系列相互关联的漏洞</text><text x="117.75" y="242.81" font-size="11.00" class="sc-notoserifcjksc">利用。这些结果存在若干局限。我们的网络靶场规模较小，缺少真实企业环境中存在的</text><text x="117.75" y="258.43" font-size="11.00" class="sc-notoserifcjksc">大量防御工具和由人主导的响应：没有主动的防御者，检测结果会被记录，但不会据此</text><text x="117.75" y="274.05" font-size="11.00" class="sc-notoserifcjksc">采取行动。智能体会被给定起点和目标，因此无需为初始访问进行目标选择。更高的</text><text x="117.75 122.01 128.44 134.27 140.23" y="289.67" font-size="11.00" class="sc-loraregular">token</text><text x="149.80" y="289.67" font-size="11.00" class="sc-notoserifcjksc">上限很可能会提升表现。</text><text x="72.00" y="407.85" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="407.85" font-size="14.00" class="sc-notosanscjkscbold">鲁棒性测试</text><text x="72.00" y="434.41" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="434.41" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="434.41" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="434.41" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（越狱）的能力，其中越狱不仅包括提</text><text x="72.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">示词，还包括自定义运行框架和多智能体流水线。我们衡量对手从模型中诱导出危险网络安全能</text><text x="72.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">力所需的投入、专业知识和尝试次数。为此，我们研究特定任务越狱（使模型能够完成某一特定</text><text x="72.00" y="481.27" font-size="11.00" class="sc-notoserifcjksc">网络安全任务）和通用越狱（可同时解除对大多数或全部网络安全任务的拦截）。通用越狱比单</text><text x="72.00" y="496.89" font-size="11.00" class="sc-notoserifcjksc">任务越狱更令人担忧，因为它们无需反复越狱即可造成更大规模的危害。鲁棒性测试对于验证</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="512.51" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40" y="512.51" font-size="11.00" class="sc-notoserifcjksc">足够安全、可以全面开放使用至关重要，因为恶意行为者会有动机去规避这些安全防护措</text><text x="72.00" y="528.13" font-size="11.00" class="sc-notoserifcjksc">施。</text><text x="72.00" y="612.52" font-size="11.00" class="sc-notoserifcjksc">我们并不期望我们的分类器具有完美的鲁棒性。我们确实期望它们能够在顶尖红队专家连续数天</text><text x="72.00" y="628.14" font-size="11.00" class="sc-notoserifcjksc">的攻击下守住防线。一旦发现公开的通用越狱，我们将迅速更新防御，以确保其对所有已知攻击</text><text x="72.00" y="643.76" font-size="11.00" class="sc-notoserifcjksc">保持鲁棒。</text><text x="72.00" y="693.48" font-size="11.00" class="sc-notoserifcjksc">为测试网络安全防御的鲁棒性，我们开发了一系列真实的进攻性网络安全任务。这些任务涵盖利</text><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="150.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="150.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="161.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="161.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="172.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="172.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="183.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="183.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">攻陷目标系统。所需操作从少量工具调用到长时间的交互不等。每个任务的设计都使得</text><text x="492.89 500.58 503.57 509.18 515.75 522.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="119.66" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.56 142.29 148.86 155.42 160.52 163.41 169.37 171.73" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="179.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">水平的模型通常（但不一定总是）能够完成。这是为了确保：如果无法让</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型完成某项任务，原因在于拒绝或拦截，而不是模型能力不足。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">这些任务是本节所述大部分红队测试（</text><text x="259.00 263.69 269.59 276.17 281.55 285.81 291.75 297.42 307.26 310.35 317.03" y="179.77" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="323.11" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）的基础。我们将其中部分任务（以及</text><text x="513.00 518.59 524.27 530.67 533.66" y="179.77" font-size="11.00" class="sc-loraregular">Fable</text><text x="72.00" y="195.39" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="195.39" font-size="11.00" class="sc-notoserifcjksc">或一个安全防护措施非常相似的</text><text x="237.78" y="195.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="285.38" y="195.39" font-size="11.00" class="sc-notoserifcjksc">修改版的访问权限）提供给外部供应商，请他们针对</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施开发越狱，以成功完成整条任务链。我们还使用内部自动化系统和手动测试，</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">亲自尝试寻找针对这些安全防护措施的通用越狱。我们在下文报告这项工作的结果。</text><text x="72.00" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.1 UK AISI</text><text x="150.46" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的外部鲁棒性测试</text><text x="72.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="107.89 113.48 119.16 125.56 128.55 134.51 137.41" y="319.34" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="146.29" y="319.34" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本提供给英国人工智能安全研究所（</text><text x="476.29" y="319.34" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="515.47" y="319.34" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">由其自主决定方式，对安全防护措施的鲁棒性进行开放式测试。他们与我们分享了以下发现：</text><text x="117.75" y="377.91" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="159.81" y="377.91" font-size="11.00" class="sc-notoserifcjksc">目前正在对</text><text x="217.71 221.66 229.35 232.34 237.95 244.51 251.09 257.05 259.95 265.54 271.21 277.61 280.61 286.57 289.46 295.46" y="377.91" font-size="11.00" class="sc-loraregular">[Claude Fable 5]</text><text x="302.30" y="377.91" font-size="11.00" class="sc-notoserifcjksc">的网络安全防护措施开展红队测试，结合使用人</text><text x="117.75" y="393.53" font-size="11.00" class="sc-notoserifcjksc">工与自动化越狱方法，并由网络安全专家进行探查。</text><text x="117.75" y="442.68" font-size="11.00" class="sc-notoserifcjksc">在获得访问权限后的数小时内，</text><text x="271.75" y="442.68" font-size="11.00" class="sc-loraregular">AISI</text><text x="295.14" y="442.68" font-size="11.00" class="sc-notoserifcjksc">红队成员便开发出一种越狱方法，可在漏洞发现与</text><text x="117.75" y="458.30" font-size="11.00" class="sc-notoserifcjksc">漏洞利用等领域中诱导模型回应单轮进攻性网络安全查询。</text><text x="117.75" y="507.45" font-size="11.00" class="sc-notoserifcjksc">经过大约两天的额外测试，</text><text x="249.75" y="507.45" font-size="11.00" class="sc-loraregular">AISI</text><text x="273.14" y="507.45" font-size="11.00" class="sc-notoserifcjksc">红队成员进一步将这一方法扩展到多轮智能体工作流</text><text x="117.75" y="523.07" font-size="11.00" class="sc-notoserifcjksc">中，获得的越狱有时能够促成多个步骤的恶意智能体工具调用。当时尚未实现可靠地提</text><text x="117.75" y="538.69" font-size="11.00" class="sc-notoserifcjksc">取完整的长程智能体任务采样轨迹（</text><text x="293.75 298.44 304.87 307.86 310.86 317.29 323.86" y="538.69" font-size="11.00" class="sc-loraregular">rollout</text><text x="328.11" y="538.69" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="350.11" y="538.69" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="392.18" y="538.69" font-size="11.00" class="sc-notoserifcjksc">正在推进对当前攻击的修改，</text><text x="117.75" y="554.31" font-size="11.00" class="sc-notoserifcjksc">这些修改可能使其在该场景中取得成功。</text><text x="439.64" y="620.79" font-size="11.00" class="sc-loraregular">AISI</text><text x="463.03" y="620.79" font-size="11.00" class="sc-notoserifcjksc">的方法进行大幅</text><text x="117.75" y="636.41" font-size="11.00" class="sc-notoserifcjksc">调整，以适应新的长程智能体场景；因此，所投入的时间和精力并不能衡量</text><text x="483.64 487.59 495.28 498.27 503.88 510.45 517.03" y="636.41" font-size="11.00" class="sc-loraregular">[Claude</text><text x="117.75 123.34 129.01 135.42 138.41 144.37 147.26 153.26" y="652.03" font-size="11.00" class="sc-loraregular">Fable 5]</text><text x="160.10" y="652.03" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的相对鲁棒性，也无法与</text><text x="349.99" y="652.03" font-size="11.00" class="sc-loraregular">AISI</text><text x="373.38" y="652.03" font-size="11.00" class="sc-notoserifcjksc">对其他模型安全防护措施的测试直</text><text x="117.75" y="667.65" font-size="11.00" class="sc-notoserifcjksc">接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="504.00 509.14" y="751.80" font-size="9.00" class="sc-loraregular">67</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">截至发布时，该测试仍在进行中。</text><text x="72.00" y="108.80" font-size="11.00" class="sc-notoserifcjksc">我们计划随着时间推移迭代这一系统，并将继续与</text><text x="316.89" y="108.80" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="358.96" y="108.80" font-size="11.00" class="sc-notoserifcjksc">合作，对我们的网络安全防护措施开</text><text x="72.00" y="124.42" font-size="11.00" class="sc-notoserifcjksc">展鲁棒性测试。</text><text x="72.00" y="155.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.2</text><text x="104.89" y="155.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部漏洞赏金</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="183.61" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="183.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="143.35 150.23 156.81 161.07 167.66 172.34 178.78 185.34 188.43" y="183.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="197.18" y="183.61" font-size="11.00" class="sc-notoserifcjksc">正在运行一项持续进行的漏洞赏金计划，对针对我们的安全防护措施开</text><text x="72.00" y="199.23" font-size="11.00" class="sc-notoserifcjksc">发出越狱方法的红队成员给予奖励。</text><text x="72.00" y="232.19" font-size="11.00" class="sc-notoserifcjksc">该竞赛包含两个部分：一是针对</text><text x="228.89 234.48 240.16 246.56 249.55" y="232.19" font-size="11.00" class="sc-loraregular">Fable</text><text x="258.41" y="232.19" font-size="11.00" class="sc-notoserifcjksc">进行红队测试的非公开竞赛，二是公开竞赛，红队成员在</text><text x="72.00" y="247.81" font-size="11.00" class="sc-notoserifcjksc">其中攻击一套应用于</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.00 250.71" y="247.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="259.78" y="247.81" font-size="11.00" class="sc-notoserifcjksc">的类似缓解措施（使用相同的分类器，以及一个使用相同</text><text x="72.00" y="263.43" font-size="11.00" class="sc-notoserifcjksc">数据但在</text><text x="118.89" y="263.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49" y="263.43" font-size="11.00" class="sc-notoserifcjksc">上训练的探针）。在每项竞赛中，红队成员都在</text><text x="400.38 408.75 413.44 419.01 424.81 427.71 433.89 442.59 448.27 454.94 457.84 464.72 469.41 475.37 482.05" y="263.43" font-size="11.00" class="sc-loraregular">Gray Swan Arena</text><text x="490.62" y="263.43" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 117.98 124.42 130.99" y="279.05" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="139.85" y="279.05" font-size="11.00" class="sc-notoserifcjksc">脚手架内工作。他们可以自行定义系统提示词（</text><text x="370.85 375.94 381.75 386.84 391.10 397.06 406.89 409.79 416.35 421.04 427.48 437.31 443.88" y="279.05" font-size="11.00" class="sc-loraregular">system prompt</text><text x="448.13" y="279.05" font-size="11.00" class="sc-notoserifcjksc">）并访问额外工具</text><text x="72.00" y="294.67" font-size="11.00" class="sc-notoserifcjksc">（包括调用</text><text x="129.89 138.63 145.19 151.16 157.77 164.60 171.03 177.60 181.86 187.82" y="294.67" font-size="11.00" class="sc-loraregular">OpenRouter</text><text x="192.58" y="294.67" font-size="11.00" class="sc-notoserifcjksc">），前提是完成任务所需的全部关键智力工作均由被测模型完成。参与</text><text x="72.00" y="310.29" font-size="11.00" class="sc-notoserifcjksc">者能够在单条采样轨迹中提交多个提示词以完成任务。</text><text x="72.00" y="377.91" font-size="11.00" class="sc-notoserifcjksc">截至</text><text x="96.89 102.80 109.55 115.46" y="377.91" font-size="11.00" class="sc-loraregular">2026</text><text x="124.71" y="377.91" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="138.61" y="377.91" font-size="11.00" class="sc-loraregular">6</text><text x="147.86" y="377.91" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="161.75" y="377.91" font-size="11.00" class="sc-loraregular">5</text><text x="170.64" y="377.91" font-size="11.00" class="sc-notoserifcjksc">日，公开漏洞赏金已收到约</text><text x="305.53 309.53 316.36 323.02 325.63 332.46 339.29" y="377.91" font-size="11.00" class="sc-loraregular">100,000</text><text x="349.02" y="377.91" font-size="11.00" class="sc-notoserifcjksc">次针对该挑战的尝试，我们认为这相当</text><text x="72.00" y="393.53" font-size="11.00" class="sc-notoserifcjksc">于约</text><text x="96.89 100.90 103.50 110.33 117.17" y="393.53" font-size="11.00" class="sc-loraregular">1,000</text><text x="126.90" y="393.53" font-size="11.00" class="sc-notoserifcjksc">小时量级的投入。这一过程未产生任何一个通用越狱，仅出现了两次成功的特定任务</text><text x="72.00" y="409.15" font-size="11.00" class="sc-notoserifcjksc">越狱。这两次特定任务越狱均发生在我们任务集中较简单、两用性更强的任务上，并且需要针对</text><text x="72.00" y="424.77" font-size="11.00" class="sc-notoserifcjksc">具体问题进行重新表述和</text><text x="193.00" y="424.77" font-size="11.00" class="sc-loraregular">/</text><text x="200.59" y="424.77" font-size="11.00" class="sc-notoserifcjksc">或搭建脚手架，才能使</text><text x="313.48 321.17 324.16 329.77 336.34 342.92" y="424.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="351.77" y="424.77" font-size="11.00" class="sc-notoserifcjksc">执行该任务。</text><text x="72.00" y="491.26" font-size="11.00" class="sc-notoserifcjksc">非公开赏金已收到</text><text x="162.89 168.80 171.41 178.24 185.07" y="491.26" font-size="11.00" class="sc-loraregular">2,000</text><text x="194.80" y="491.26" font-size="11.00" class="sc-notoserifcjksc">份提交，未产生任何一次成功的越狱。由于其难度较大（也出于我们希</text><text x="72.00" y="506.88" font-size="11.00" class="sc-notoserifcjksc">望保持参与者积极性的考虑），非公开漏洞赏金正以额外的、按小时付费的红队测试项目形式继</text><text x="72.00" y="522.50" font-size="11.00" class="sc-notoserifcjksc">续进行。</text><text x="72.00" y="556.03" font-size="11.00" class="sc-notoserifcjksc">有一些注意事项限制了我们对这些结果的信心。参与者无法通过</text><text x="382.89 389.78 396.39" y="556.03" font-size="11.00" class="sc-loraregular">API</text><text x="402.97" y="556.03" font-size="11.00" class="sc-notoserifcjksc">访问模型，因此无法使用高</text><text x="72.00" y="571.65" font-size="11.00" class="sc-notoserifcjksc">度自动化的攻击工作流。参与者在遭到拦截后也无法回溯对话。我们对非公开竞赛参与者的验证</text><text x="72.00" y="587.27" font-size="11.00" class="sc-notoserifcjksc">要求以及该项目较短的持续时间，也限制了针对</text><text x="305.89 311.48 317.16 323.56 326.55" y="587.27" font-size="11.00" class="sc-loraregular">Fable</text><text x="335.41" y="587.27" font-size="11.00" class="sc-notoserifcjksc">模型的尝试数量。最后，我们认为漏洞赏</text><text x="72.00" y="602.89" font-size="11.00" class="sc-notoserifcjksc">金中应用于</text><text x="129.89" y="602.89" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="177.49" y="602.89" font-size="11.00" class="sc-notoserifcjksc">的分类器系统与</text><text x="257.38 262.97 268.65 275.05 278.04 284.00 286.90" y="602.89" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00" y="618.51" font-size="11.00" class="sc-notoserifcjksc">针，二者并不完全相同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3</text><text x="105.21" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部红队测试</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">作为改进分类器工作的一部分，我们开发了一个自动化红队智能体，它基于</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04 512.00 514.35" y="111.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="522.32" y="111.03" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">仅有用版本（</text><text x="138.00 144.59 150.55 153.54 160.05 163.77 170.34 173.33 178.71 185.15 191.82 194.76 200.57 203.46 208.96 214.92 219.69 224.78 227.87 234.31" y="126.65" font-size="11.00" class="sc-loraregular">helpful-only version</text><text x="240.98" y="126.65" font-size="11.00" class="sc-notoserifcjksc">）。该智能体的每次运行都会尝试引导</text><text x="430.88 436.46 442.14 448.54 451.53 457.50 460.39" y="126.65" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="466.38" y="126.65" font-size="11.00" class="sc-notoserifcjksc">（或其他目标</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">模型）完成上文所述的某一项短小网络安全任务。这个</text><text x="338.89 347.63 354.19 360.76 365.85 368.75 374.71 377.06" y="142.27" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="385.03" y="142.27" font-size="11.00" class="sc-notoserifcjksc">智能体可以运行目标模型最多</text><text x="72.00" y="157.89" font-size="11.00" class="sc-loraregular">400</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">成任务，而真实攻击者也可能这样做。</text><text x="72.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">当在</text><text x="96.89 105.63 112.19 118.76 123.85 126.75 132.71 135.31" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="141.66" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（不具备拦截型网络安全防护措施）以及</text><text x="342.56 351.29 357.86 364.42 369.52 372.41 378.37 380.73" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="388.69" y="224.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="402.58" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="447.29" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（使用这些模型的</text><text x="72.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">默认网络安全防护措施）上运行该评估时，大多数任务仍被完成。然而，在</text><text x="437.89 443.48 449.16 455.56 458.55 464.51 467.41" y="240.00" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="476.29" y="240.00" font-size="11.00" class="sc-notoserifcjksc">上，完成任</text><text x="72.00" y="255.62" font-size="11.00" class="sc-notoserifcjksc">务的比例降至</text><text x="140.89" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="156.46" y="255.62" font-size="11.00" class="sc-notoserifcjksc">。鉴于其中部分任务具有两用性且较为简单，我们认为剩余的这</text><text x="467.35" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="485.81" y="255.62" font-size="11.00" class="sc-notoserifcjksc">并不表明我</text><text x="72.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">们的安全防护措施存在重大弱点，不过我们仍在继续努力进一步降低这一数字。</text><text x="72.00" y="597.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="597.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79" y="597.91" font-size="9.00" class="sc-lorabold">3.3.3.A]</text><text x="119.63" y="597.91" font-size="9.00" class="sc-notoserifcjksc">在我们的内部基准测试中，我们的自动化红队智能体只能让</text><text x="355.99 360.57 365.21 370.45 372.90 377.78 380.14" y="597.91" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="387.41" y="597.91" font-size="9.00" class="sc-notoserifcjksc">完成</text><text x="407.78" y="597.91" font-size="9.00" class="sc-loraregular">5%</text><text x="422.88" y="597.91" font-size="9.00" class="sc-notoserifcjksc">的任务，而在使用默认安全防</text><text x="72.00" y="609.61" font-size="9.00" class="sc-notoserifcjksc">护措施的</text><text x="110.37 117.51 122.89 128.26 132.43 134.79 139.67 141.60" y="609.61" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="148.11" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="159.48" y="609.61" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="198.42" y="609.61" font-size="9.00" class="sc-notoserifcjksc">上，这一比例分别为</text><text x="281.79" y="609.61" font-size="9.00" class="sc-loraregular">73%</text><text x="301.15" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="312.52" y="609.61" font-size="9.00" class="sc-loraregular">57%</text><text x="329.40" y="609.61" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="654.76" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.4</text><text x="106.02" y="654.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试方</text><text x="72.00" y="682.65" font-size="11.00" class="sc-notoserifcjksc">我们与多家外部测试方合作，以获取关于攻破我们网络安全分类器之难度的更多证据。与以往一</text><text x="72.00" y="698.27" font-size="11.00" class="sc-notoserifcjksc">样，我们向这些测试方指明了</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">69</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一组我们希望确保会被拦截的示例任务。他们主要测试的是</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 407.92 414.48 421.05 426.14 429.04 435.00 437.71" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="446.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的一个变体，其安</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">全防护措施与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 184.77 190.45 196.85 199.84 205.80 208.70" y="98.23" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="217.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的非常相似。</text><text x="72.00 78.88 83.56 89.24 92.11 98.01 103.81 108.07 114.50 119.45 125.26 128.15 134.76 140.43 146.83 151.93 154.70 157.59 164.20 171.04" y="131.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="181.64" y="131.18" font-size="11.00" class="sc-notoserifcjksc">发现了一种单一的越狱策略，使其能够利用配备</text><text x="415.53 421.12 426.79 433.20 436.19" y="131.18" font-size="11.00" class="sc-loraregular">Fable</text><text x="445.04" y="131.18" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的</text><text x="72.00" y="146.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="146.80" font-size="11.00" class="sc-notoserifcjksc">来利用</text><text x="155.49 161.46 164.55 169.24 175.20 178.86 185.24" y="146.80" font-size="11.00" class="sc-loraregular">Firefox</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">框架并经过反复迭代，是在较早版本的安全防护措施上开发的，需要五天的工作才能适配到发布</text><text x="72.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">配置。他们还在其他几项较简单的任务上发现了越狱，但这些越狱无法泛化到其他任务。最后，</text><text x="72.00" y="193.66" font-size="11.00" class="sc-notoserifcjksc">在花费大约</text><text x="129.89" y="193.66" font-size="11.00" class="sc-loraregular">5</text><text x="138.78" y="193.66" font-size="11.00" class="sc-notoserifcjksc">天尝试应用</text><text x="196.67 203.52 209.95 216.52 223.19 229.77 235.45 240.40 246.21 249.10 255.66 262.09 265.18 271.76 276.02 278.91 282.85 288.52 291.61 294.61 301.01 305.70 311.64 317.31 323.22 326.31 332.99" y="193.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Boundary Point Jailbreaking</text><text x="72.00" y="209.28" font-size="11.00" class="sc-notoserifcjksc">不过确实在诱导单轮回应方面取得了一些成功，并在智能体领域取得了一些有限进展。</text><text x="72.00 76.00 82.83 88.51 91.40 98.00 103.68 110.08" y="293.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="118.07" y="293.11" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="153.96" y="293.11" font-size="11.00" class="sc-loraregular">20</text><text x="169.59" y="293.11" font-size="11.00" class="sc-notoserifcjksc">个小时，使用多种成熟的越狱技术，针对一项勒索软件创建任务对分类器进</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">行红队测试。这些尝试均未成功。</text><text x="237.00 241.00 247.83 253.51 256.40 263.00 268.68 275.08" y="308.73" font-size="11.00" class="sc-loraregular">10a Labs</text><text x="283.07" y="308.73" font-size="11.00" class="sc-notoserifcjksc">发现，分类器检测的不仅仅是高风险关键词，还能在</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">足够多的片段同时出现时识别出更宽泛的操作模式。</text><text x="72.00 78.89 85.24 88.83 96.52" y="374.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">ALICE</text><text x="106.25" y="374.07" font-size="11.00" class="sc-notoserifcjksc">也开展了一次红队演练。他们发现，在处于边缘的两用用例上存在拦截不一致的情况，但</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">未能让</text><text x="107.89" y="389.69" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49" y="389.69" font-size="11.00" class="sc-notoserifcjksc">完成任何一项给定任务。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">最后，我们将</text><text x="140.89 146.48 152.16 158.56 161.55 167.51 170.41" y="422.64" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="179.29" y="422.64" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本分享给另一家外部合作方，供其进行开</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">放式测试。该合作方发现，在所有被测模型（包括</text><text x="316.89" y="438.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="364.49" y="438.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.38 387.12 393.68 400.25 405.34 408.24 414.20 416.55" y="438.26" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="421.62" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="454.62 460.21 465.89 472.29 475.28 481.24 484.14" y="438.26" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="493.03" y="438.26" font-size="11.00" class="sc-notoserifcjksc">针对有害</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">网络安全查询的安全防护措施鲁棒性最强：无论是否使用越狱（共测试了</text><text x="426.89" y="453.88" font-size="11.00" class="sc-loraregular">30</text><text x="442.74" y="453.88" font-size="11.00" class="sc-notoserifcjksc">种不同的公开越狱</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">方法），</text><text x="116.00 121.59 127.26 133.67 136.66 142.62 145.51" y="469.50" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="154.40" y="469.50" font-size="11.00" class="sc-notoserifcjksc">对涉及网络攻击规划、漏洞利用开发或防御规避的有害单轮请求的遵从率均为</text><text x="72.00" y="485.12" font-size="11.00" class="sc-loraregular">0%</text><text x="88.40" y="485.12" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="72.00" y="122.38" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.t
