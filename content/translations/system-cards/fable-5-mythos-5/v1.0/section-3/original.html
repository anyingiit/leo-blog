x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="648.76" font-size="11.00" class="sc-notoserifcjksc">署终端杀毒软件、禁用遗留协议，并要求流量经过密码学签名，使其在传</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75" y="664.38" font-size="11.00" class="sc-notoserifcjksc">输过程中无法被篡改）。</text><text x="301.75 306.15 314.35 320.78 323.87 330.55 336.63 339.52 345.88 348.97 352.64 358.38" y="664.38" font-size="11.00" class="sc-loraregular">“Doing Life”</text><text x="365.11 376.11 387.11 398.11 409.11 420.11 431.11 442.11 453.11 464.11 475.11 486.11 497.11 508.11 519.11" y="664.38" font-size="11.00" class="sc-notoserifcjksc">的结果为以下主张提供了又一个数</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="162.75 169.15" y="115.45" font-size="11.00" class="sc-loraregular">b.</text><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">网络，该网络具备基线安全加固，但没有主动防御响应。</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 232.53 238.39 242.65 249.24 255.67 260.76 263.66 269.65" y="114.99" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在工业控制系统靶场</text><text x="378.39 382.79 390.48 396.91 403.35 406.34 409.43 416.11 422.19 425.08 431.58 437.91 446.59 452.55 457.31" y="114.99" font-size="11.00" class="sc-loraregular">“Cooling Tower”</text><text x="464.04 475.04 486.04 497.04 508.04 519.04" y="114.99" font-size="11.00" class="sc-notoserifcjksc">上仅取得了有</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75" y="130.61" font-size="11.00" class="sc-notoserifcjksc">限进展，但在现阶段，我们不对</text><text x="337.64 341.59 349.28 352.27 357.88 364.45 371.03 376.99 379.88 389.82 395.68 399.94 406.53 412.96 418.05 420.95 426.94" y="130.61" font-size="11.00" class="sc-loraregular">[Claude Mythos 5]</text><text x="433.78 444.78 455.78 466.78 477.78 488.78 499.78 510.78 521.78" y="130.61" font-size="11.00" class="sc-notoserifcjksc">针对运营技术环境的</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75" y="146.23" font-size="11.00" class="sc-notoserifcjksc">自主能力得出强有力的结论。</text><text x="117.75 128.75 139.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="150.75 161.75 172.75 183.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络靶场</text><text x="194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在构建时纳入了真实部署中常见的各类安全弱点，包括过时的软件、配</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="211.57" font-size="11.00" class="sc-notoserifcjksc">置错误和重复使用的凭据。每个靶场都有一个攻击者必须达到的明确最终状态（例如窃</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="227.19" font-size="11.00" class="sc-notoserifcjksc">取数据或破坏设备），这需要在不同主机和网段之间发现并执行一系列相互关联的漏洞</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="242.81" font-size="11.00" class="sc-notoserifcjksc">利用。这些结果存在若干局限。我们的网络靶场规模较小，缺少真实企业环境中存在的</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="258.43" font-size="11.00" class="sc-notoserifcjksc">大量防御工具和由人主导的响应：没有主动的防御者，检测结果会被记录，但不会据此</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75" y="274.05" font-size="11.00" class="sc-notoserifcjksc">采取行动。智能体会被给定起点和目标，因此无需为初始访问进行目标选择。更高的</text><text x="117.75 122.01 128.44 134.27 140.23" y="289.67" font-size="11.00" class="sc-loraregular">token</text><text x="149.80 160.80 171.80 182.80 193.80 204.80 215.80 226.80 237.80 248.80 259.80" y="289.67" font-size="11.00" class="sc-notoserifcjksc">上限很可能会提升表现。</text><text x="72.00 80.39 84.03" y="407.85" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74 109.74 123.74 137.74 151.74" y="407.85" font-size="14.00" class="sc-notosanscjkscbold">鲁棒性测试</text><text x="72.00" y="434.41" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40 98.40 109.40 120.40" y="434.41" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="434.41" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="434.41" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（越狱）的能力，其中越狱不仅包括提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">示词，还包括自定义运行框架和多智能体流水线。我们衡量对手从模型中诱导出危险网络安全能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">力所需的投入、专业知识和尝试次数。为此，我们研究特定任务越狱（使模型能够完成某一特定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="481.27" font-size="11.00" class="sc-notoserifcjksc">网络安全任务）和通用越狱（可同时解除对大多数或全部网络安全任务的拦截）。通用越狱比单</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="496.89" font-size="11.00" class="sc-notoserifcjksc">任务越狱更令人担忧，因为它们无需反复越狱即可造成更大规模的危害。鲁棒性测试对于验证</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="512.51" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40 121.40 132.40 143.40 154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40 286.40 297.40 308.40 319.40 330.40 341.40 352.40 363.40 374.40 385.40 396.40 407.40 418.40 429.40 440.40 451.40 462.40 473.40 484.40 495.40 506.40 517.40 528.40" y="512.51" font-size="11.00" class="sc-notoserifcjksc">足够安全、可以全面开放使用至关重要，因为恶意行为者会有动机去规避这些安全防护措</text><text x="72.00 83.00" y="528.13" font-size="11.00" class="sc-notoserifcjksc">施。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="612.52" font-size="11.00" class="sc-notoserifcjksc">我们并不期望我们的分类器具有完美的鲁棒性。我们确实期望它们能够在顶尖红队专家连续数天</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="628.14" font-size="11.00" class="sc-notoserifcjksc">的攻击下守住防线。一旦发现公开的通用越狱，我们将迅速更新防御，以确保其对所有已知攻击</text><text x="72.00 83.00 94.00 105.00 116.00" y="643.76" font-size="11.00" class="sc-notoserifcjksc">保持鲁棒。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="693.48" font-size="11.00" class="sc-notoserifcjksc">为测试网络安全防御的鲁棒性，我们开发了一系列真实的进攻性网络安全任务。这些任务涵盖利</text><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="150.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="150.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="161.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="161.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="172.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="172.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="183.75" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.11214" rel="noopener"><rect x="183.75" y="187.15" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">攻陷目标系统。所需操作从少量工具调用到长时间的交互不等。每个任务的设计都使得</text><text x="492.89 500.58 503.57 509.18 515.75 522.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.41" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="119.66" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="133.56 142.29 148.86 155.42 160.52 163.41 169.37 171.73" y="98.23" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="179.69 190.69 201.69 212.69 223.69 234.69 245.69 256.69 267.69 278.69 289.69 300.69 311.69 322.69 333.69 344.69 355.69 366.69 377.69 388.69 399.69 410.69 421.69 432.69 443.69 454.69 465.69 476.69 487.69 498.69 509.69 520.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">水平的模型通常（但不一定总是）能够完成。这是为了确保：如果无法让</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">模型完成某项任务，原因在于拒绝或拦截，而不是模型能力不足。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">这些任务是本节所述大部分红队测试（</text><text x="259.00 263.69 269.59 276.17 281.55 285.81 291.75 297.42 307.26 310.35 317.03" y="179.77" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="323.11 334.11 345.11 356.11 367.11 378.11 389.11 400.11 411.11 422.11 433.11 444.11 455.11 466.11 477.11 488.11 499.11" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）的基础。我们将其中部分任务（以及</text><text x="513.00 518.59 524.27 530.67 533.66" y="179.77" font-size="11.00" class="sc-loraregular">Fable</text><text x="72.00" y="195.39" font-size="11.00" class="sc-loraregular">5</text><text x="80.89 91.89 102.89 113.89 124.89 135.89 146.89 157.89 168.89 179.89 190.89 201.89 212.89 223.89" y="195.39" font-size="11.00" class="sc-notoserifcjksc">或一个安全防护措施非常相似的</text><text x="237.78 246.51 253.08 259.65 264.74 267.64 273.60 276.30" y="195.39" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="285.38 296.38 307.38 318.38 329.38 340.38 351.38 362.38 373.38 384.38 395.38 406.38 417.38 428.38 439.38 450.38 461.38 472.38 483.38 494.38 505.38 516.38 527.38" y="195.39" font-size="11.00" class="sc-notoserifcjksc">修改版的访问权限）提供给外部供应商，请他们针对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这些安全防护措施开发越狱，以成功完成整条任务链。我们还使用内部自动化系统和手动测试，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">亲自尝试寻找针对这些安全防护措施的通用越狱。我们在下文报告这项工作的结果。</text><text x="72.00 79.79 83.17 90.95 94.33 99.04 102.13 111.20 119.81 122.91 132.22 135.83 143.75" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.1 UK AISI</text><text x="150.46 163.46 176.46 189.46 202.46 215.46 228.46 241.46" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的外部鲁棒性测试</text><text x="72.00 83.00 94.00" y="319.34" font-size="11.00" class="sc-notoserifcjksc">我们将</text><text x="107.89 113.48 119.16 125.56 128.55 134.51 137.41" y="319.34" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="146.29 157.29 168.29 179.29 190.29 201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29" y="319.34" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本提供给英国人工智能安全研究所（</text><text x="476.29 484.57 492.08 494.97 501.86 505.54 511.78" y="319.34" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="515.47 526.47" y="319.34" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="334.96" font-size="11.00" class="sc-notoserifcjksc">由其自主决定方式，对安全防护措施的鲁棒性进行开放式测试。他们与我们分享了以下发现：</text><text x="117.75 126.02 133.54 136.43 143.31 147.00 153.24" y="377.91" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="159.81 170.81 181.81 192.81 203.81" y="377.91" font-size="11.00" class="sc-notoserifcjksc">目前正在对</text><text x="217.71 221.66 229.35 232.34 237.95 244.51 251.09 257.05 259.95 265.54 271.21 277.61 280.61 286.57 289.46 295.46" y="377.91" font-size="11.00" class="sc-loraregular">[Claude Fable 5]</text><text x="302.30 313.30 324.30 335.30 346.30 357.30 368.30 379.30 390.30 401.30 412.30 423.30 434.30 445.30 456.30 467.30 478.30 489.30 500.30 511.30 522.30" y="377.91" font-size="11.00" class="sc-notoserifcjksc">的网络安全防护措施开展红队测试，结合使用人</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75" y="393.53" font-size="11.00" class="sc-notoserifcjksc">工与自动化越狱方法，并由网络安全专家进行探查。</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75" y="442.68" font-size="11.00" class="sc-notoserifcjksc">在获得访问权限后的数小时内，</text><text x="271.75 278.64 282.32 288.56" y="442.68" font-size="11.00" class="sc-loraregular">AISI</text><text x="295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="442.68" font-size="11.00" class="sc-notoserifcjksc">红队成员便开发出一种越狱方法，可在漏洞发现与</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75" y="458.30" font-size="11.00" class="sc-notoserifcjksc">漏洞利用等领域中诱导模型回应单轮进攻性网络安全查询。</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75" y="507.45" font-size="11.00" class="sc-notoserifcjksc">经过大约两天的额外测试，</text><text x="249.75 256.64 260.32 266.56" y="507.45" font-size="11.00" class="sc-loraregular">AISI</text><text x="273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14" y="507.45" font-size="11.00" class="sc-notoserifcjksc">红队成员进一步将这一方法扩展到多轮智能体工作流</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="523.07" font-size="11.00" class="sc-notoserifcjksc">中，获得的越狱有时能够促成多个步骤的恶意智能体工具调用。当时尚未实现可靠地提</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75" y="538.69" font-size="11.00" class="sc-notoserifcjksc">取完整的长程智能体任务采样轨迹（</text><text x="293.75 298.44 304.87 307.86 310.86 317.29 323.86" y="538.69" font-size="11.00" class="sc-loraregular">rollout</text><text x="328.11 339.11" y="538.69" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="350.11 358.39 365.90 368.79 375.68 379.36 385.60" y="538.69" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="392.18 403.18 414.18 425.18 436.18 447.18 458.18 469.18 480.18 491.18 502.18 513.18 524.18" y="538.69" font-size="11.00" class="sc-notoserifcjksc">正在推进对当前攻击的修改，</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75" y="554.31" font-size="11.00" class="sc-notoserifcjksc">这些修改可能使其在该场景中取得成功。</text><text x="439.64 446.53 450.21 456.45" y="620.79" font-size="11.00" class="sc-loraregular">AISI</text><text x="463.03 474.03 485.03 496.03 507.03 518.03 529.03" y="620.79" font-size="11.00" class="sc-notoserifcjksc">的方法进行大幅</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75" y="636.41" font-size="11.00" class="sc-notoserifcjksc">调整，以适应新的长程智能体场景；因此，所投入的时间和精力并不能衡量</text><text x="483.64 487.59 495.28 498.27 503.88 510.45 517.03" y="636.41" font-size="11.00" class="sc-loraregular">[Claude</text><text x="117.75 123.34 129.01 135.42 138.41 144.37 147.26 153.26" y="652.03" font-size="11.00" class="sc-loraregular">Fable 5]</text><text x="160.10 171.10 182.10 193.10 204.10 215.10 226.10 237.10 248.10 259.10 270.10 281.10 292.10 303.10 314.10 325.10 336.10" y="652.03" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的相对鲁棒性，也无法与</text><text x="349.99 356.88 360.56 366.80" y="652.03" font-size="11.00" class="sc-loraregular">AISI</text><text x="373.38 384.38 395.38 406.38 417.38 428.38 439.38 450.38 461.38 472.38 483.38 494.38 505.38 516.38 527.38" y="652.03" font-size="11.00" class="sc-notoserifcjksc">对其他模型安全防护措施的测试直</text><text x="117.75 128.75 139.75 150.75" y="667.65" font-size="11.00" class="sc-notoserifcjksc">接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p067.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 67 页"><text x="504.00 509.14" y="751.80" font-size="9.00" class="sc-loraregular">67</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">截至发布时，该测试仍在进行中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="108.80" font-size="11.00" class="sc-notoserifcjksc">我们计划随着时间推移迭代这一系统，并将继续与</text><text x="316.89 325.17 332.68 335.57 342.46 346.14 352.38" y="108.80" font-size="11.00" class="sc-loraregular">UK AISI</text><text x="358.96 369.96 380.96 391.96 402.96 413.96 424.96 435.96 446.96 457.96 468.96 479.96 490.96 501.96 512.96 523.96" y="108.80" font-size="11.00" class="sc-notoserifcjksc">合作，对我们的网络安全防护措施开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="124.42" font-size="11.00" class="sc-notoserifcjksc">展鲁棒性测试。</text><text x="72.00 79.79 83.17 90.95 94.33" y="155.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.2</text><text x="104.89 117.89 130.89 143.89 156.89 169.89" y="155.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部漏洞赏金</text><text x="72.00 80.37 85.06 90.62 96.43 99.32 105.51 114.21 119.88" y="183.61" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="129.45" y="183.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="143.35 150.23 156.81 161.07 167.66 172.34 178.78 185.34 188.43" y="183.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="197.18 208.18 219.18 230.18 241.18 252.18 263.18 274.18 285.18 296.18 307.18 318.18 329.18 340.18 351.18 362.18 373.18 384.18 395.18 406.18 417.18 428.18 439.18 450.18 461.18 472.18 483.18 494.18 505.18 516.18 527.18" y="183.61" font-size="11.00" class="sc-notoserifcjksc">正在运行一项持续进行的漏洞赏金计划，对针对我们的安全防护措施开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="199.23" font-size="11.00" class="sc-notoserifcjksc">发出越狱方法的红队成员给予奖励。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="232.19" font-size="11.00" class="sc-notoserifcjksc">该竞赛包含两个部分：一是针对</text><text x="228.89 234.48 240.16 246.56 249.55" y="232.19" font-size="11.00" class="sc-loraregular">Fable</text><text x="258.41 269.41 280.41 291.41 302.41 313.41 324.41 335.41 346.41 357.41 368.41 379.41 390.41 401.41 412.41 423.41 434.41 445.41 456.41 467.41 478.41 489.41 500.41 511.41 522.41" y="232.19" font-size="11.00" class="sc-notoserifcjksc">进行红队测试的非公开竞赛，二是公开竞赛，红队成员在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="247.81" font-size="11.00" class="sc-notoserifcjksc">其中攻击一套应用于</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.00 250.71" y="247.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="247.81" font-size="11.00" class="sc-notoserifcjksc">的类似缓解措施（使用相同的分类器，以及一个使用相同</text><text x="72.00 83.00 94.00 105.00" y="263.43" font-size="11.00" class="sc-notoserifcjksc">数据但在</text><text x="118.89 127.63 134.19 140.76 145.85 148.75 154.71 157.42" y="263.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="166.49 177.49 188.49 199.49 210.49 221.49 232.49 243.49 254.49 265.49 276.49 287.49 298.49 309.49 320.49 331.49 342.49 353.49 364.49 375.49 386.49" y="263.43" font-size="11.00" class="sc-notoserifcjksc">上训练的探针）。在每项竞赛中，红队成员都在</text><text x="400.38 408.75 413.44 419.01 424.81 427.71 433.89 442.59 448.27 454.94 457.84 464.72 469.41 475.37 482.05" y="263.43" font-size="11.00" class="sc-loraregular">Gray Swan Arena</text><text x="490.62 501.62" y="263.43" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 117.98 124.42 130.99" y="279.05" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="139.85 150.85 161.85 172.85 183.85 194.85 205.85 216.85 227.85 238.85 249.85 260.85 271.85 282.85 293.85 304.85 315.85 326.85 337.85 348.85 359.85" y="279.05" font-size="11.00" class="sc-notoserifcjksc">脚手架内工作。他们可以自行定义系统提示词（</text><text x="370.85 375.94 381.75 386.84 391.10 397.06 406.89 409.79 416.35 421.04 427.48 437.31 443.88" y="279.05" font-size="11.00" class="sc-loraregular">system prompt</text><text x="448.13 459.13 470.13 481.13 492.13 503.13 514.13 525.13" y="279.05" font-size="11.00" class="sc-notoserifcjksc">）并访问额外工具</text><text x="72.00 83.00 94.00 105.00 116.00" y="294.67" font-size="11.00" class="sc-notoserifcjksc">（包括调用</text><text x="129.89 138.63 145.19 151.16 157.77 164.60 171.03 177.60 181.86 187.82" y="294.67" font-size="11.00" class="sc-loraregular">OpenRouter</text><text x="192.58 203.58 214.58 225.58 236.58 247.58 258.58 269.58 280.58 291.58 302.58 313.58 324.58 335.58 346.58 357.58 368.58 379.58 390.58 401.58 412.58 423.58 434.58 445.58 456.58 467.58 478.58 489.58 500.58 511.58 522.58" y="294.67" font-size="11.00" class="sc-notoserifcjksc">），前提是完成任务所需的全部关键智力工作均由被测模型完成。参与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="310.29" font-size="11.00" class="sc-notoserifcjksc">者能够在单条采样轨迹中提交多个提示词以完成任务。</text><text x="72.00 83.00" y="377.91" font-size="11.00" class="sc-notoserifcjksc">截至</text><text x="96.89 102.80 109.55 115.46" y="377.91" font-size="11.00" class="sc-loraregular">2026</text><text x="124.71" y="377.91" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="138.61" y="377.91" font-size="11.00" class="sc-loraregular">6</text><text x="147.86" y="377.91" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="161.75" y="377.91" font-size="11.00" class="sc-loraregular">5</text><text x="170.64 181.64 192.64 203.64 214.64 225.64 236.64 247.64 258.64 269.64 280.64 291.64" y="377.91" font-size="11.00" class="sc-notoserifcjksc">日，公开漏洞赏金已收到约</text><text x="305.53 309.53 316.36 323.02 325.63 332.46 339.29" y="377.91" font-size="11.00" class="sc-loraregular">100,000</text><text x="349.02 360.02 371.02 382.02 393.02 404.02 415.02 426.02 437.02 448.02 459.02 470.02 481.02 492.02 503.02 514.02 525.02" y="377.91" font-size="11.00" class="sc-notoserifcjksc">次针对该挑战的尝试，我们认为这相当</text><text x="72.00 83.00" y="393.53" font-size="11.00" class="sc-notoserifcjksc">于约</text><text x="96.89 100.90 103.50 110.33 117.17" y="393.53" font-size="11.00" class="sc-loraregular">1,000</text><text x="126.90 137.90 148.90 159.90 170.90 181.90 192.90 203.90 214.90 225.90 236.90 247.90 258.90 269.90 280.90 291.90 302.90 313.90 324.90 335.90 346.90 357.90 368.90 379.90 390.90 401.90 412.90 423.90 434.90 445.90 456.90 467.90 478.90 489.90 500.90 511.90 522.90" y="393.53" font-size="11.00" class="sc-notoserifcjksc">小时量级的投入。这一过程未产生任何一个通用越狱，仅出现了两次成功的特定任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="409.15" font-size="11.00" class="sc-notoserifcjksc">越狱。这两次特定任务越狱均发生在我们任务集中较简单、两用性更强的任务上，并且需要针对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="424.77" font-size="11.00" class="sc-notoserifcjksc">具体问题进行重新表述和</text><text x="193.00" y="424.77" font-size="11.00" class="sc-loraregular">/</text><text x="200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59" y="424.77" font-size="11.00" class="sc-notoserifcjksc">或搭建脚手架，才能使</text><text x="313.48 321.17 324.16 329.77 336.34 342.92" y="424.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="351.77 362.77 373.77 384.77 395.77 406.77" y="424.77" font-size="11.00" class="sc-notoserifcjksc">执行该任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="491.26" font-size="11.00" class="sc-notoserifcjksc">非公开赏金已收到</text><text x="162.89 168.80 171.41 178.24 185.07" y="491.26" font-size="11.00" class="sc-loraregular">2,000</text><text x="194.80 205.80 216.80 227.80 238.80 249.80 260.80 271.80 282.80 293.80 304.80 315.80 326.80 337.80 348.80 359.80 370.80 381.80 392.80 403.80 414.80 425.80 436.80 447.80 458.80 469.80 480.80 491.80 502.80 513.80 524.80" y="491.26" font-size="11.00" class="sc-notoserifcjksc">份提交，未产生任何一次成功的越狱。由于其难度较大（也出于我们希</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="506.88" font-size="11.00" class="sc-notoserifcjksc">望保持参与者积极性的考虑），非公开漏洞赏金正以额外的、按小时付费的红队测试项目形式继</text><text x="72.00 83.00 94.00 105.00" y="522.50" font-size="11.00" class="sc-notoserifcjksc">续进行。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="556.03" font-size="11.00" class="sc-notoserifcjksc">有一些注意事项限制了我们对这些结果的信心。参与者无法通过</text><text x="382.89 389.78 396.39" y="556.03" font-size="11.00" class="sc-loraregular">API</text><text x="402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="556.03" font-size="11.00" class="sc-notoserifcjksc">访问模型，因此无法使用高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="571.65" font-size="11.00" class="sc-notoserifcjksc">度自动化的攻击工作流。参与者在遭到拦截后也无法回溯对话。我们对非公开竞赛参与者的验证</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="587.27" font-size="11.00" class="sc-notoserifcjksc">要求以及该项目较短的持续时间，也限制了针对</text><text x="305.89 311.48 317.16 323.56 326.55" y="587.27" font-size="11.00" class="sc-loraregular">Fable</text><text x="335.41 346.41 357.41 368.41 379.41 390.41 401.41 412.41 423.41 434.41 445.41 456.41 467.41 478.41 489.41 500.41 511.41 522.41" y="587.27" font-size="11.00" class="sc-notoserifcjksc">模型的尝试数量。最后，我们认为漏洞赏</text><text x="72.00 83.00 94.00 105.00 116.00" y="602.89" font-size="11.00" class="sc-notoserifcjksc">金中应用于</text><text x="129.89 138.63 145.19 151.76 156.85 159.75 165.71 168.42" y="602.89" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="177.49 188.49 199.49 210.49 221.49 232.49 243.49" y="602.89" font-size="11.00" class="sc-notoserifcjksc">的分类器系统与</text><text x="257.38 262.97 268.65 275.05 278.04 284.00 286.90" y="602.89" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="618.51" font-size="11.00" class="sc-notoserifcjksc">针，二者并不完全相同。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="72.00 79.79 83.17 90.95 94.33" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3</text><text x="105.21 118.21 131.21 144.21 157.21 170.21" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部红队测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">作为改进分类器工作的一部分，我们开发了一个自动化红队智能体，它基于</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04 512.00 514.35" y="111.03" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="522.32" y="111.03" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">仅有用版本（</text><text x="138.00 144.59 150.55 153.54 160.05 163.77 170.34 173.33 178.71 185.15 191.82 194.76 200.57 203.46 208.96 214.92 219.69 224.78 227.87 234.31" y="126.65" font-size="11.00" class="sc-loraregular">helpful-only version</text><text x="240.98 251.98 262.98 273.98 284.98 295.98 306.98 317.98 328.98 339.98 350.98 361.98 372.98 383.98 394.98 405.98 416.98" y="126.65" font-size="11.00" class="sc-notoserifcjksc">）。该智能体的每次运行都会尝试引导</text><text x="430.88 436.46 442.14 448.54 451.53 457.50 460.39" y="126.65" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="466.38 477.38 488.38 499.38 510.38 521.38" y="126.65" font-size="11.00" class="sc-notoserifcjksc">（或其他目标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">模型）完成上文所述的某一项短小网络安全任务。这个</text><text x="338.89 347.63 354.19 360.76 365.85 368.75 374.71 377.06" y="142.27" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="385.03 396.03 407.03 418.03 429.03 440.03 451.03 462.03 473.03 484.03 495.03 506.03 517.03" y="142.27" font-size="11.00" class="sc-notoserifcjksc">智能体可以运行目标模型最多</text><text x="72.00 77.96 84.79" y="157.89" font-size="11.00" class="sc-loraregular">400</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">成任务，而真实攻击者也可能这样做。</text><text x="72.00 83.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">当在</text><text x="96.89 105.63 112.19 118.76 123.85 126.75 132.71 135.31" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.6</text><text x="141.66 152.66 163.66 174.66 185.66 196.66 207.66 218.66 229.66 240.66 251.66 262.66 273.66 284.66 295.66 306.66 317.66 328.66" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（不具备拦截型网络安全防护措施）以及</text><text x="342.56 351.29 357.86 364.42 369.52 372.41 378.37 380.73" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="388.69" y="224.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="402.58 411.32 417.88 424.45 429.54 432.44 438.40 441.10" y="224.38" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="447.29 458.29 469.29 480.29 491.29 502.29 513.29 524.29" y="224.38" font-size="11.00" class="sc-notoserifcjksc">（使用这些模型的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">默认网络安全防护措施）上运行该评估时，大多数任务仍被完成。然而，在</text><text x="437.89 443.48 449.16 455.56 458.55 464.51 467.41" y="240.00" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="476.29 487.29 498.29 509.29 520.29" y="240.00" font-size="11.00" class="sc-notoserifcjksc">上，完成任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="255.62" font-size="11.00" class="sc-notoserifcjksc">务的比例降至</text><text x="140.89 146.89" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="156.46 167.46 178.46 189.46 200.46 211.46 222.46 233.46 244.46 255.46 266.46 277.46 288.46 299.46 310.46 321.46 332.46 343.46 354.46 365.46 376.46 387.46 398.46 409.46 420.46 431.46 442.46 453.46" y="255.62" font-size="11.00" class="sc-notoserifcjksc">。鉴于其中部分任务具有两用性且较为简单，我们认为剩余的这</text><text x="467.35 473.35" y="255.62" font-size="11.00" class="sc-loraregular">5%</text><text x="485.81 496.81 507.81 518.81 529.81" y="255.62" font-size="11.00" class="sc-notoserifcjksc">并不表明我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">们的安全防护措施存在重大弱点，不过我们仍在继续努力进一步降低这一数字。</text><text x="72.00" y="597.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="597.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79" y="597.91" font-size="9.00" class="sc-lorabold">3.3.3.A]</text><text x="119.63 128.63 137.63 146.63 155.63 164.63 173.63 182.63 191.63 200.63 209.63 218.63 227.63 236.63 245.63 254.63 263.63 272.63 281.63 290.63 299.63 308.63 317.63 326.63 335.63 344.63" y="597.91" font-size="9.00" class="sc-notoserifcjksc">在我们的内部基准测试中，我们的自动化红队智能体只能让</text><text x="355.99 360.57 365.21 370.45 372.90 377.78 380.14" y="597.91" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="387.41 396.41" y="597.91" font-size="9.00" class="sc-notoserifcjksc">完成</text><text x="407.78 412.69" y="597.91" font-size="9.00" class="sc-loraregular">5%</text><text x="422.88 431.88 440.88 449.88 458.88 467.88 476.88 485.88 494.88 503.88 512.88 521.88 530.88" y="597.91" font-size="9.00" class="sc-notoserifcjksc">的任务，而在使用默认安全防</text><text x="72.00 81.00 90.00 99.00" y="609.61" font-size="9.00" class="sc-notoserifcjksc">护措施的</text><text x="110.37 117.51 122.89 128.26 132.43 134.79 139.67 141.60" y="609.61" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="148.11" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="159.48 166.63 172.00 177.37 181.54 183.91 188.78 191.00" y="609.61" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="198.42 207.42 216.42 225.42 234.42 243.42 252.42 261.42 270.42" y="609.61" font-size="9.00" class="sc-notoserifcjksc">上，这一比例分别为</text><text x="281.79 285.94 290.95" y="609.61" font-size="9.00" class="sc-loraregular">73%</text><text x="301.15" y="609.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="312.52 317.42 321.57" y="609.61" font-size="9.00" class="sc-loraregular">57%</text><text x="329.40" y="609.61" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.79 83.17 90.95 94.33" y="654.76" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.4</text><text x="106.02 119.02 132.02 145.02 158.02 171.02 184.02" y="654.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="682.65" font-size="11.00" class="sc-notoserifcjksc">我们与多家外部测试方合作，以获取关于攻破我们网络安全分类器之难度的更多证据。与以往一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="698.27" font-size="11.00" class="sc-notoserifcjksc">样，我们向这些测试方指明了</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p069.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 69 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">69</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一组我们希望确保会被拦截的示例任务。他们主要测试的是</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 407.92 414.48 421.05 426.14 429.04 435.00 437.71" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的一个变体，其安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">全防护措施与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 184.77 190.45 196.85 199.84 205.80 208.70" y="98.23" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="217.59 228.59 239.59 250.59 261.59 272.59 283.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的非常相似。</text><text x="72.00 78.88 83.56 89.24 92.11 98.01 103.81 108.07 114.50 119.45 125.26 128.15 134.76 140.43 146.83 151.93 154.70 157.59 164.20 171.04" y="131.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="181.64 192.64 203.64 214.64 225.64 236.64 247.64 258.64 269.64 280.64 291.64 302.64 313.64 324.64 335.64 346.64 357.64 368.64 379.64 390.64 401.64" y="131.18" font-size="11.00" class="sc-notoserifcjksc">发现了一种单一的越狱策略，使其能够利用配备</text><text x="415.53 421.12 426.79 433.20 436.19" y="131.18" font-size="11.00" class="sc-loraregular">Fable</text><text x="445.04 456.04 467.04 478.04 489.04 500.04 511.04" y="131.18" font-size="11.00" class="sc-notoserifcjksc">安全防护措施的</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="146.80" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60" y="146.80" font-size="11.00" class="sc-notoserifcjksc">来利用</text><text x="155.49 161.46 164.55 169.24 175.20 178.86 185.24" y="146.80" font-size="11.00" class="sc-loraregular">Firefox</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">框架并经过反复迭代，是在较早版本的安全防护措施上开发的，需要五天的工作才能适配到发布</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.04" font-size="11.00" class="sc-notoserifcjksc">配置。他们还在其他几项较简单的任务上发现了越狱，但这些越狱无法泛化到其他任务。最后，</text><text x="72.00 83.00 94.00 105.00 116.00" y="193.66" font-size="11.00" class="sc-notoserifcjksc">在花费大约</text><text x="129.89" y="193.66" font-size="11.00" class="sc-loraregular">5</text><text x="138.78 149.78 160.78 171.78 182.78" y="193.66" font-size="11.00" class="sc-notoserifcjksc">天尝试应用</text><text x="196.67 203.52 209.95 216.52 223.19 229.77 235.45 240.40 246.21 249.10 255.66 262.09 265.18 271.76 276.02 278.91 282.85 288.52 291.61 294.61 301.01 305.70 311.64 317.31 323.22 326.31 332.99" y="193.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Boundary Point Jailbreaking</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="209.28" font-size="11.00" class="sc-notoserifcjksc">不过确实在诱导单轮回应方面取得了一些成功，并在智能体领域取得了一些有限进展。</text><text x="72.00 76.00 82.83 88.51 91.40 98.00 103.68 110.08" y="293.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="118.07 129.07 140.07" y="293.11" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="153.96 159.87" y="293.11" font-size="11.00" class="sc-loraregular">20</text><text x="169.59 180.59 191.59 202.59 213.59 224.59 235.59 246.59 257.59 268.59 279.59 290.59 301.59 312.59 323.59 334.59 345.59 356.59 367.59 378.59 389.59 400.59 411.59 422.59 433.59 444.59 455.59 466.59 477.59 488.59 499.59 510.59 521.59" y="293.11" font-size="11.00" class="sc-notoserifcjksc">个小时，使用多种成熟的越狱技术，针对一项勒索软件创建任务对分类器进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">行红队测试。这些尝试均未成功。</text><text x="237.00 241.00 247.83 253.51 256.40 263.00 268.68 275.08" y="308.73" font-size="11.00" class="sc-loraregular">10a Labs</text><text x="283.07 294.07 305.07 316.07 327.07 338.07 349.07 360.07 371.07 382.07 393.07 404.07 415.07 426.07 437.07 448.07 459.07 470.07 481.07 492.07 503.07 514.07 525.07" y="308.73" font-size="11.00" class="sc-notoserifcjksc">发现，分类器检测的不仅仅是高风险关键词，还能在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">足够多的片段同时出现时识别出更宽泛的操作模式。</text><text x="72.00 78.89 85.24 88.83 96.52" y="374.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">ALICE</text><text x="106.25 117.25 128.25 139.25 150.25 161.25 172.25 183.25 194.25 205.25 216.25 227.25 238.25 249.25 260.25 271.25 282.25 293.25 304.25 315.25 326.25 337.25 348.25 359.25 370.25 381.25 392.25 403.25 414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="374.07" font-size="11.00" class="sc-notoserifcjksc">也开展了一次红队演练。他们发现，在处于边缘的两用用例上存在拦截不一致的情况，但</text><text x="72.00 83.00 94.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">未能让</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.71 146.42" y="389.69" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49 166.49 177.49 188.49 199.49 210.49 221.49 232.49 243.49 254.49 265.49" y="389.69" font-size="11.00" class="sc-notoserifcjksc">完成任何一项给定任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">最后，我们将</text><text x="140.89 146.48 152.16 158.56 161.55 167.51 170.41" y="422.64" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="179.29 190.29 201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29 311.29 322.29 333.29 344.29 355.29 366.29 377.29 388.29 399.29 410.29 421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="422.64" font-size="11.00" class="sc-notoserifcjksc">网络安全防护措施的最终发布版本分享给另一家外部合作方，供其进行开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">放式测试。该合作方发现，在所有被测模型（包括</text><text x="316.89 325.63 332.19 338.76 343.85 346.75 352.71 355.41" y="438.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="364.49" y="438.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="378.38 387.12 393.68 400.25 405.34 408.24 414.20 416.55" y="438.26" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="421.62 432.62 443.62" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="454.62 460.21 465.89 472.29 475.28 481.24 484.14" y="438.26" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="493.03 504.03 515.03 526.03" y="438.26" font-size="11.00" class="sc-notoserifcjksc">针对有害</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">网络安全查询的安全防护措施鲁棒性最强：无论是否使用越狱（共测试了</text><text x="426.89 433.02" y="453.88" font-size="11.00" class="sc-loraregular">30</text><text x="442.74 453.74 464.74 475.74 486.74 497.74 508.74 519.74" y="453.88" font-size="11.00" class="sc-notoserifcjksc">种不同的公开越狱</text><text x="72.00 83.00 94.00 105.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">方法），</text><text x="116.00 121.59 127.26 133.67 136.66 142.62 145.51" y="469.50" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40 286.40 297.40 308.40 319.40 330.40 341.40 352.40 363.40 374.40 385.40 396.40 407.40 418.40 429.40 440.40 451.40 462.40 473.40 484.40 495.40 506.40 517.40" y="469.50" font-size="11.00" class="sc-notoserifcjksc">对涉及网络攻击规划、漏洞利用开发或防御规避的有害单轮请求的遵从率均为</text><text x="72.00 78.83" y="485.12" font-size="11.00" class="sc-loraregular">0%</text><text x="88.40" y="485.12" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="72.00" y="122.38" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="125.26" y="122.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="128.15" y="122.38" width="26.55" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="154.71" y="122.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="157.60" y="122.38" width="21.14" height="11.00" fill="transparent"/>
