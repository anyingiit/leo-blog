75" font-size="11.00" class="sc-lorabold">-0.67</text><text x="387.00" y="545.75" font-size="11.00" class="sc-loraregular">1.41</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">84</text><text x="76.75" y="211.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="228.30" y="211.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">消歧问题准确率（</text><text x="316.30" y="211.91" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="326.24" y="211.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="385.50" y="211.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模糊问题准确率（</text><text x="473.50" y="211.91" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="483.44" y="211.91" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="76.75" y="416.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="228.25" y="416.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">消歧问题偏见分数（</text><text x="327.25" y="416.54" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="337.19" y="416.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="386.50" y="416.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模糊问题偏见分数（</text><text x="485.50" y="416.54" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="495.44" y="416.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">两类问题各自的准确率，以及一个偏见分数，该分数反映模型的错误是否系统性地偏向或偏离社</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">会刻板印象；分数越接近零，表示方向性偏见越小。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">与以往的系统卡一样，我们仅在不使用系统提示词的条件下运行此项评估。我们未在此项评估中</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">单独报告</text><text x="118.89 124.48 130.16 136.56 139.55 145.51 148.41" y="163.00" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="157.29" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的结果，因为该模型额外施加的安全防护措施与此项评估中的请求类型无关。</text><text x="72.00" y="358.24" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="358.24" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.78 100.88 105.68 107.78 113.31 116.78 119.15 124.99 127.93 132.65 137.02 139.38 145.33 150.17 155.92 160.58 166.17 174.45 179.16 183.40 188.75 191.11 194.38 199.48 203.80 206.16 213.09 218.65 223.50 227.86 231.58 234.52 239.62 245.36 247.72 253.69 259.43 263.80 271.01 275.85 280.17 283.11 288.85" y="358.24" font-size="9.00" class="sc-lorabold">4.4.2.A] Bias Benchmark for Question Answering</text><text x="293.87" y="358.24" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="302.87 308.72 314.67" y="358.24" font-size="9.00" class="sc-lorabold">BBQ</text><text x="321.60" y="358.24" font-size="9.00" class="sc-notoserifcjkscbold">）评估的准确率分数。</text><text x="411.60" y="358.24" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中较高的分数以</text><text x="72.00" y="369.94" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="90.00" y="369.94" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。结果为不使用系统提示词时的结果。</text><text x="72.00" y="564.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="564.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.78 100.88 105.68 107.78 113.31 116.78 119.15 124.99 127.93 132.65 137.02 139.38 145.33 150.17 155.92 160.58 166.17 174.45 179.16 183.40 188.75 191.11 194.38 199.48 203.80 206.16 213.09 218.65 223.50 227.86 231.58 234.52 239.62 245.36 247.72 253.69 259.43 263.80 271.01 275.85 280.17 283.11 288.85" y="564.49" font-size="9.00" class="sc-lorabold">4.4.2.B] Bias Benchmark for Question Answering</text><text x="293.87" y="564.49" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="302.87 308.72 314.67" y="564.49" font-size="9.00" class="sc-lorabold">BBQ</text><text x="321.60" y="564.49" font-size="9.00" class="sc-notoserifcjkscbold">）评估的偏见分数。</text><text x="402.60" y="564.49" font-size="9.00" class="sc-notoserifcjksc">越接近零越好。每列中较优的分数</text><text x="72.00" y="576.19" font-size="9.00" class="sc-notoserifcjksc">以</text><text x="81.00" y="576.19" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="99.00" y="576.19" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。结果为不使用系统提示词时的结果。</text><text x="72.00" y="616.80" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.91 176.60 182.51 188.06 191.15 197.07" y="616.80" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="208.77" y="616.80" font-size="11.00" class="sc-notoserifcjksc">一致，</text><text x="241.77 249.46 252.46 258.07 264.63 271.21 277.17 280.07 290.00 295.86 300.12 306.71 313.14 318.24 321.13" y="616.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="330.02" y="616.80" font-size="11.00" class="sc-notoserifcjksc">在模糊问题上表现出近乎完美的准确率。在</text><text x="72.00" y="632.42" font-size="11.00" class="sc-notoserifcjksc">消歧问题上，其准确率与</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="632.42" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="280.48" y="632.42" font-size="11.00" class="sc-notoserifcjksc">几乎相同，并较</text><text x="360.38 368.07 371.06 376.67 383.23 389.81 395.77 398.67 407.40 413.97 420.53 425.63 428.52 434.48 437.19" y="632.42" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="446.26" y="632.42" font-size="11.00" class="sc-notoserifcjksc">有所提升。两个模</text><text x="72.00" y="648.04" font-size="11.00" class="sc-notoserifcjksc">型在消歧和模糊两个维度上的偏见分数均仍接近零。</text><text x="72.00" y="697.76" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="697.76" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="133.49" y="697.76" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="166.49 176.42 182.29 186.54 193.13 199.57 204.66 207.55" y="697.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="216.44" y="697.76" font-size="11.00" class="sc-notoserifcjksc">在消歧问题上的错误答案几乎全部为</text><text x="392.44" y="697.76" font-size="11.00" class="sc-loraregular">“</text><text x="396.84" y="697.76" font-size="11.00" class="sc-notoserifcjksc">无法确定</text><text x="440.84" y="697.76" font-size="11.00" class="sc-loraregular">”</text><text x="444.68" y="697.76" font-size="11.00" class="sc-notoserifcjksc">，这表明</text><text x="491.57 501.51 507.37 511.63 518.21 524.65 529.74 532.64" y="697.76" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="713.38" font-size="11.00" class="sc-notoserifcjksc">倾向于对问题弃答，而非</text></svg></div>

>，无系统提示词</text><text x="277.00" y="274.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="277.00" y="290.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="366.25" y="274.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮有害请求</text><text x="366.25" y="290.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="455.50" y="274.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="455.50" y="290.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将某一特征归于符合刻板印象或不符合刻板印象的个体。与此一致，消歧问题偏见分数仍接近</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">零；在少数确实指名某一个体的错误中，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="319.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在近</text><text x="344.84 350.97 357.63 360.23 367.06 373.90" y="98.23" font-size="11.00" class="sc-loraregular">30,000</text><text x="383.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个案例中有</text><text x="441.52" y="98.23" font-size="11.00" class="sc-loraregular">51</text><text x="454.42" y="98.23" font-size="11.00" class="sc-notoserifcjksc">例选择了符合刻</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">板印象的人，而</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.91 242.60 248.51 254.06 257.15 263.07" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="274.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="288.67" y="113.85" font-size="11.00" class="sc-loraregular">17</text><text x="300.64" y="113.85" font-size="11.00" class="sc-notoserifcjksc">例，总体而言数量很小。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.3</text><text x="106.83" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">选举诚信</text><text x="72.00" y="193.81" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.35" y="193.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="192.32" y="193.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="225.32" y="193.81" font-size="11.00" class="sc-notoserifcjksc">中引入的选举诚信基准测试上评估了</text><text x="404.21 411.90 414.89 420.50 427.07 433.65 439.61 442.50 452.43 458.30 462.55 469.14 475.58 480.67 483.56" y="193.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="489.56" y="193.81" font-size="11.00" class="sc-notoserifcjksc">。该基准</text><text x="72.00" y="209.43" font-size="11.00" class="sc-notoserifcjksc">测试基于在真实使用中观察到的模式，通过</text><text x="283.89" y="209.43" font-size="11.00" class="sc-loraregular">300</text><text x="306.58" y="209.43" font-size="11.00" class="sc-notoserifcjksc">条违规和</text><text x="353.47" y="209.43" font-size="11.00" class="sc-loraregular">300</text><text x="376.15" y="209.43" font-size="11.00" class="sc-notoserifcjksc">条良性的选举相关提示词，检验</text><text x="72.00" y="225.05" font-size="11.00" class="sc-notoserifcjksc">模型对我们</text><text x="127.00" y="225.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="171.00" y="225.05" font-size="11.00" class="sc-notoserifcjksc">的遵守情况。我们报告了</text><text x="294.89 301.78 308.39" y="225.05" font-size="11.00" class="sc-loraregular">API</text><text x="314.97" y="225.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="328.86 334.71 337.71 343.32 349.88 356.46 362.42 365.13 370.80" y="225.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="376.79" y="225.05" font-size="11.00" class="sc-notoserifcjksc">在使用我们系统提示词时的结</text><text x="72.00" y="240.67" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00" y="506.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="506.53" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 113.55" y="506.53" font-size="9.00" class="sc-lorabold">4.4.3.A]</text><text x="119.39" y="506.53" font-size="9.00" class="sc-notoserifcjkscbold">针对选举诚信提示词的单轮评估，在</text><text x="265.76 271.77 277.47" y="506.53" font-size="9.00" class="sc-lorabold">API</text><text x="283.32" y="506.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="294.69" y="506.53" font-size="9.00" class="sc-lorabold">claude.ai</text><text x="334.76" y="506.53" font-size="9.00" class="sc-notoserifcjkscbold">上使用默认系统提示词运行。</text><text x="451.76" y="506.53" font-size="9.00" class="sc-notoserifcjksc">对于单轮有害请求，</text><text x="72.00" y="518.23" font-size="9.00" class="sc-notoserifcjksc">越高越好。对于单轮良性请求，越接近零越好。每列中较优的分数以</text><text x="342.00" y="518.23" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="360.00" y="518.23" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差</text><text x="72.00" y="529.93" font-size="9.00" class="sc-notoserifcjksc">范围）。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="572.09" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="572.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 143.53 146.52 152.14 158.70 165.28 171.24 174.14 179.72 185.40 191.80 194.79 200.76 203.65" y="572.09" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="212.54" y="572.09" font-size="11.00" class="sc-notoserifcjksc">在单轮选举诚信基准测试上表现近乎完美，能够可靠地拒绝违规请</text><text x="72.00" y="587.71" font-size="11.00" class="sc-notoserifcjksc">求，同时不会对正当的选举相关提示词过度拒绝。</text><text x="72.00" y="636.85" font-size="11.00" class="sc-notoserifcjksc">除单轮选举诚信评估外，我们还在新的语境模糊评估（在</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04 424.00 426.71" y="636.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="435.78" y="636.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="468.78" y="636.85" font-size="11.00" class="sc-notoserifcjksc">中引入）中分</text><text x="72.00" y="652.47" font-size="11.00" class="sc-notoserifcjksc">析了</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96" y="652.47" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="146.84" y="652.47" font-size="11.00" class="sc-notoserifcjksc">对选举相关请求的处理。在该评估中，</text><text x="333.84 343.78 349.64 353.90 360.49 366.92 372.01 374.91" y="652.47" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="383.79" y="652.47" font-size="11.00" class="sc-notoserifcjksc">经常在回答本身中融入安全处理</text><text x="72.00" y="668.09" font-size="11.00" class="sc-notoserifcjksc">方式，而不是依赖附加说明和警告。例如，当被要求以研究为名生成与选举相关的</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="107.89" y="185.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="107.89" y="185.01" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="143.29" y="185.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="146.18" y="185.01" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="173.14" y="185.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="176.04" y="185.01" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="189.42" y="185.01" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="192.32" y="185.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="203.32" y="185.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="203.32" y="185.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="214.32" y="185.01" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="214.32" y="185.01" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="127.00" y="216.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="127.00" y="216.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="138.00" y="216.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="138.00" y="216.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="149.00" y="216.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="149.00" y="216.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="160.00" y="216.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="160.00" y="216.25" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="328.86" y="216.25" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="328.86" y="216.25" width="45.03" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="349.89" y="628.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="349.89" y="628.05" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="385.29" y="628.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="388.18" y="628.05" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="415.15" y="628.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="418.04" y="628.05" width="14.85" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="432.89" y="628.05" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="435.78" y="628.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="446.78" y="628.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="446.78" y="628.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="457.78" y="628.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="457.78" y="628.05" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p086.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 86 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">86</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">虚假信息时，</text><text x="138.00 147.93 153.80 158.05 164.64 171.08 176.17 179.06" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="187.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">改用了一个虚构场景，该场景可用于学术分析，但难以轻易被用作虚假信</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">息产出物。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们正在积极扩展这一领域的测试，包括开发一项基于真实世界场景的新的多轮选举诚信评估。</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">该评估尚未纳入我们的正式评估套件，但我们的内部政策专家仍对</text><text x="393.89 403.83 409.69 413.95 420.53 426.97 432.06 434.96" y="146.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="443.84" y="146.81" font-size="11.00" class="sc-notoserifcjksc">在我们初始测试用</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">例集上的表现进行了定性审查。在一个案例中，</text><text x="303.00 312.93 318.80 323.05 329.64 336.08 341.17 344.06" y="162.43" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="352.95" y="162.43" font-size="11.00" class="sc-notoserifcjksc">被要求撰写伪装成出自当地社区成员之</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">手的选民动员话术。</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06" y="178.05" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="220.95" y="178.05" font-size="11.00" class="sc-notoserifcjksc">确实在其推理中承认这种包装方式可能具有欺骗性，但仍然生成了</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">该内容。这一行为在</text><text x="173.89 179.74 182.74 188.35 194.91 201.49 207.45 210.16 215.84" y="193.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="221.82" y="193.67" font-size="11.00" class="sc-notoserifcjksc">系统提示词下得到了缓解，而将此评估正式化是未来模型发布的一</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">项优先事项。</text><a href="http://claude.ai" rel="noopener"><rect x="173.89" y="184.87" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="173.89" y="184.87" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
