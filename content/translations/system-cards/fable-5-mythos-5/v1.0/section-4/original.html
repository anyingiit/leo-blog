.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="150.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.14" y="150.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="210.03 217.72 220.71 226.32 232.89 239.46 245.43 248.32 253.91 259.58 265.99 268.98 274.94 277.83" y="150.76" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="286.72" y="150.76" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了标准的安全评估套件，涵盖我们</text><text x="528.72" y="150.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">用政策（</text><text x="116.00 124.20 129.29 134.96 140.99 146.95 149.85 156.40 162.84 165.83 168.92 174.72" y="166.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="180.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="191.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc">中的各项主题、用户身心健康以及偏见与诚信。与以往的发布一样，其</text><text x="72.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">中包括针对有害提示词和良性提示词的单轮评估、探查灰色地带边缘案例的语境模糊评估，以及</text><text x="72.00" y="264.10" font-size="11.00" class="sc-notoserifcjksc">用于</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96" y="264.10" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="146.84" y="264.10" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="160.74 166.32 172.00 178.40 181.39 187.36 190.25" y="264.10" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="199.14" y="264.10" font-size="11.00" class="sc-notoserifcjksc">的评估套件与</text><text x="268.03 275.72 278.71 284.32 290.89 297.47 303.43 306.32 315.06 321.62 328.19 333.28 336.18 342.14 344.84" y="264.10" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="353.92" y="264.10" font-size="11.00" class="sc-notoserifcjksc">所报告的评估套件基本一致，仅对单轮</text><text x="424.00" y="279.72" font-size="11.00" class="sc-loraregular">“</text><text x="428.40" y="279.72" font-size="11.00" class="sc-notoserifcjksc">为定向暴力提供操作性</text><text x="72.00" y="295.34" font-size="11.00" class="sc-notoserifcjksc">协助</text><text x="94.00" y="295.34" font-size="11.00" class="sc-loraregular">”</text><text x="97.84" y="295.34" font-size="11.00" class="sc-notoserifcjksc">这类请求的覆盖范围。此外，由于各模型的思考配置不同，我们统一了报告方式：如果某个</text><text x="72.00" y="310.96" font-size="11.00" class="sc-notoserifcjksc">模型同时支持开启思考和关闭思考，我们报告两种条件下的汇总结果；如果某个模型仅支持开启</text><text x="72.00" y="326.58" font-size="11.00" class="sc-notoserifcjksc">思考，我们报告仅开启思考的结果。在本系统卡（</text><text x="314.00 320.18 325.99 331.08 335.34 341.30 351.14 354.03 361.72 367.39 372.08" y="326.58" font-size="11.00" class="sc-loraregular">System Card</text><text x="378.66" y="326.58" font-size="11.00" class="sc-notoserifcjksc">）中，我们对</text><text x="447.55 455.24 458.23 463.84 470.41 476.99 482.95 485.84 492.08 498.51 505.19 511.87 517.75" y="326.58" font-size="11.00" class="sc-loraregular">Claude Sonnet</text><text x="524.90" y="326.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="342.20" font-size="11.00" class="sc-loraregular">Opus</text><text x="101.85" y="342.20" font-size="11.00" class="sc-notoserifcjksc">系列模型报告汇总结果，对</text><text x="236.75 246.68 252.54 256.80 263.39 269.82" y="342.20" font-size="11.00" class="sc-loraregular">Mythos</text><text x="277.81" y="342.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="291.70 297.29 302.97 309.37 312.36" y="342.20" font-size="11.00" class="sc-loraregular">Fable</text><text x="321.22" y="342.20" font-size="11.00" class="sc-notoserifcjksc">系列模型报告仅开启思考的结果。在评估内容</text><text x="72.00" y="357.82" font-size="11.00" class="sc-notoserifcjksc">发生变化的情况下，此处报告的先前模型分数可能与早期系统卡中公布的分数有所不同。</text><text x="72.00" y="442.22" font-size="11.00" class="sc-notoserifcjksc">本节各处报告的</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25" y="442.22" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="240.14" y="442.22" font-size="11.00" class="sc-notoserifcjksc">结果，描述的是该模型在不含部署时安全防护措施情况下的核</text><text x="72.00" y="457.84" font-size="11.00" class="sc-notoserifcjksc">心行为。为反映用户接触</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="457.84" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18" y="457.84" font-size="11.00" class="sc-notoserifcjksc">的不同方式，我们还报告了</text><text x="369.08 376.77 379.76 385.37 391.93 398.51 404.48 407.37 412.96 418.63 425.03 428.03 433.99 436.88" y="457.84" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="445.77" y="457.84" font-size="11.00" class="sc-notoserifcjksc">在其分类器和模型</text><text x="72.00" y="473.46" font-size="11.00" class="sc-notoserifcjksc">切换机制处于启用状态、并使用将在发布时采用的接近最终版的</text><text x="382.89 388.74 391.74 397.35 403.91 410.49 416.45 419.16 424.84" y="473.46" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="430.82" y="473.46" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="496.82" y="473.46" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="489.08" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35" y="489.08" font-size="11.00" class="sc-notoserifcjksc">）时的结果。我们的定性讨论以</text><text x="267.24 277.17 283.04 287.29 293.88 300.32 305.41 308.30" y="489.08" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="317.19" y="489.08" font-size="11.00" class="sc-notoserifcjksc">为重点，因为它对模型行为提供了更保守的视</text><text x="72.00" y="504.70" font-size="11.00" class="sc-notoserifcjksc">角，同时也会指出</text><text x="162.89 168.74 171.74 177.35 183.91 190.49 196.45 199.16 204.84" y="504.70" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="210.82" y="504.70" font-size="11.00" class="sc-notoserifcjksc">系统提示词带来的改进。系统提示词和分类器配置因产品端而异，且</text><text x="72.00" y="520.32" font-size="11.00" class="sc-notoserifcjksc">其更新节奏与模型发布不同，因此此处的</text><text x="272.89 278.48 284.16 290.56 293.55 299.51 302.41" y="520.32" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="311.29" y="520.32" font-size="11.00" class="sc-notoserifcjksc">结果是截至</text><text x="369.19 375.09 381.85 387.76" y="520.32" font-size="11.00" class="sc-loraregular">2026</text><text x="397.01" y="520.32" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="410.90" y="520.32" font-size="11.00" class="sc-loraregular">6</text><text x="420.15" y="520.32" font-size="11.00" class="sc-notoserifcjksc">月初的时点快照。</text><text x="72.00" y="602.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="602.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="630.37" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量的是：面对有害或明显违反我们</text><text x="314.00" y="630.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="358.00" y="630.37" font-size="11.00" class="sc-notoserifcjksc">的请求，受测模型能多可靠地予以拒</text><text x="72.00" y="645.99" font-size="11.00" class="sc-notoserifcjksc">绝或将其安全转向。我们在七种语言（阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄</text><text x="72.00" y="661.61" font-size="11.00" class="sc-notoserifcjksc">语）中测试了涵盖</text><text x="162.89" y="661.61" font-size="11.00" class="sc-loraregular">16</text><text x="176.15" y="661.61" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告我们判定模型回应未助长所请求危害的提示词</text><text x="72.00" y="677.23" font-size="11.00" class="sc-notoserifcjksc">所占比例。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="528.72" y="141.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="528.72" y="141.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="539.72" y="141.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="72.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="116.00" y="157.58" width="30.95" height="11.00" fill="transparent" ="356.13" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="356.13" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="356.13" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有测试语言。</text><text x="278.74" y="356.13" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74" y="356.13" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="449.74" y="356.13" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最高，</text><text x="72.00" y="367.83" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估更新，</text><text x="72.00" y="379.53" font-size="9.00" class="sc-notoserifcjksc">先前模型的结果与以往系统卡相比存在差异。</text><text x="252.00 260.13 264.92 268.41 273.80 279.06" y="379.53" font-size="9.00" class="sc-loraregular">Mythos</text><text x="285.60" y="379.53" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="350.96 355.75 358.20 362.79 368.16 373.54 378.42 380.64 385.28" y="379.53" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="390.18" y="379.53" font-size="9.00" class="sc-notoserifcjksc">上发布，因此我们不报告其使用系统</text><text x="72.00" y="391.23" font-size="9.00" class="sc-notoserifcjksc">提示词时的结果。</text><text x="72.00" y="452.71" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="452.71" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="480.59" font-size="11.00" class="sc-notoserifcjksc">单轮良性评估衡量的是模型拒绝那些主题敏感但适合回答的请求的频率。该提示词集涵盖与上述</text><text x="72.00" y="496.21" font-size="11.00" class="sc-notoserifcjksc">有害提示词集相同的</text><text x="173.89" y="496.21" font-size="11.00" class="sc-loraregular">16</text><text x="187.15" y="496.21" font-size="11.00" class="sc-notoserifcjksc">个政策领域和七种语言，我们以模型拒绝参与的良性提示词所占比例作为</text><text x="72.00" y="511.83" font-size="11.00" class="sc-notoserifcjksc">过度拒绝（</text><text x="127.00 133.38 138.88 144.84 149.52 154.90 159.58 165.54 169.26 175.83 180.92 186.60" y="511.83" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="189.59" y="511.83" font-size="11.00" class="sc-notoserifcjksc">）率进行报告。</text></svg></div>

13 110.05" y="222.77" font-size="11.00" class="sc-lorabold">Preview</text><text x="198.75 205.55 207.95 214.94 219.40 229.34 232.23 235.49 241.31 244.20 251.01 253.40 260.39 264.86 274.79" y="208.69" font-size="11.00" class="sc-lorabold">0.01% (± 0.01%)</text><text x="372.00 379.96 387.01" y="208.69" font-size="11.00" class="sc-loraregular">N/A</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.97 128.20 135.21 142.22 148.14 152.68 155.57 161.58 164.14" y="248.10" font-size="11.00" class="sc-lorabold">Claude Sonnet 4.6</text><text x="198.75 205.40 208.10 214.06 220.89 230.45 233.34 236.70 242.52 245.41 252.06 254.60 261.43 267.42 276.98" y="248.10" font-size="11.00" class="sc-loraregular">0.40% (± 0.05%)</text><text x="372.00 378.65 381.35 387.71 391.71 401.27 404.16 407.52 413.34 416.23 422.88 425.42 432.25 438.43 447.99" y="248.10" font-size="11.00" class="sc-loraregular">0.91% (± 0.08%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="76.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="264.25 271.60 278.56" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="282.82" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="371.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="437.50" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">claude.ai</text><text x="72.00" y="265.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="265.17" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="265.17" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="265.17" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有测试语言。</text><text x="279.88" y="265.17" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上属于良性的提示词）；数</text><text x="72.00" y="276.87" font-size="9.00" class="sc-notoserifcjksc">值越低越好。</text><text x="126.00" y="276.87" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="144.00" y="276.87" font-size="9.00" class="sc-notoserifcjksc">表示每种语言中过度拒绝率最低的结果，次优分数以下划线标出。评估以阿拉伯语、英语、法语、印</text><text x="72.00" y="288.57" font-size="9.00" class="sc-notoserifcjksc">地语、韩语、汉语普通话和俄语进行。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="504.00 512.13 516.92 520.41 525.80 531.06" y="288.57" font-size="9.00" class="sc-loraregular">Mythos</text><text x="72.00" y="300.27" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="137.37 142.15 144.60 149.19 154.57 159.95 164.83 167.04 171.68" y="300.27" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="176.58" y="300.27" font-size="9.00" class="sc-notoserifcjksc">上发布，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00" y="361.75" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="361.75" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="389.63" font-size="11.00" class="sc-notoserifcjksc">我们的多轮评估测试模型的安全行为能否在较长的对话中保持稳定。对于每个测试用例，内部政</text><text x="72.00" y="405.25" font-size="11.00" class="sc-notoserifcjksc">策专家会撰写一份规格说明，描述一个合成</text><text x="281.00" y="405.25" font-size="11.00" class="sc-loraregular">“</text><text x="285.40" y="405.25" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="307.40" y="405.25" font-size="11.00" class="sc-loraregular">”</text><text x="311.24" y="405.25" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策略，再由一个</text><text x="468.13 475.82 478.81 484.42 490.99 497.57" y="405.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="506.42" y="405.25" font-size="11.00" class="sc-notoserifcjksc">模型按</text><text x="72.00" y="420.87" font-size="11.00" class="sc-notoserifcjksc">照该规格说明生成用户轮次，同时由受测模型进行回应。每段对话都依据其所属风险领域专用的</text><text x="72.00" y="436.49" font-size="11.00" class="sc-notoserifcjksc">评分细则进行评分，我们将恰当回应率报告为模型在整段对话中始终表现恰当的对话所占比例。</text><text x="72.00" y="452.11" font-size="11.00" class="sc-notoserifcjksc">由于各领域评分细则的难度不同，不应跨类别比较分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p073.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 73 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">73</text><text x="72.00" y="646.57" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="646.57" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="646.57" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="646.57" font-size="9.00" class="sc-notoserifcjkscbold">上图展示各多轮测试领域的恰当回应率。</text><text x="280.12" y="646.57" font-size="9.00" class="sc-notoserifcjksc">百分比指模型在整段对话中始终作出恰当回应的对话所占比例。</text><text x="72.00" y="658.27" font-size="9.00" class="sc-notoserifcjksc">结果首先展示不带系统提示词的</text><text x="200.37 206.00 211.41" y="658.27" font-size="9.00" class="sc-loraregular">API</text><text x="216.79" y="658.27" font-size="9.00" class="sc-notoserifcjksc">情况，其后为</text><text x="273.16 277.95 280.40 284.98 290.36 295.74 300.62 302.83 307.48" y="658.27" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="312.37" y="658.27" font-size="9.00" class="sc-notoserifcjksc">情况。</text><text x="339.37 347.50 352.30 355.78 361.17 366.44" y="658.27" font-size="9.00" class="sc-loraregular">Mythos</text><text x="372.97" y="658.27" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="438.34 443.12 445.57 450.16 455.54 460.92 465.80 468.01 472.65" y="658.27" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="477.55" y="658.27" font-size="9.00" class="sc-notoserifcjksc">上发布，因此我</text><text x="72.00" y="669.97" font-size="9.00" class="sc-notoserifcjksc">们不报告其使用系统提示词时的结果。越高越好。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差</text><text x="72.00" y="681.67" font-size="9.00" class="sc-notoserifcjksc">异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p074.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 74 页"><text x="504.00 508.02" y="751.80" font-size="9.00" class="sc-loraregular">74</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">除上述定量结果外，我们的内部政策专家还针对评估套件中的每个政策领域审阅了底层评估对话</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 189.12 194.98 199.24 205.83 212.26 217.35 220.25" y="126.65" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="229.14" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的安全行为与先前模型有何不同。我们还审阅了</text><text x="463.03 470.72 473.71 479.32 485.89 492.46" y="126.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="501.32" y="126.65" font-size="11.00" class="sc-notoserifcjksc">为语境</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">模糊评估生成的定性报告；这类评估是单轮评估，用于探查</text><text x="360.89 368.58 371.57 377.18 383.75 390.33" y="142.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="399.18" y="142.27" font-size="11.00" class="sc-notoserifcjksc">在我们</text><text x="432.18" y="142.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="476.18" y="142.27" font-size="11.00" class="sc-notoserifcjksc">范围内的边缘</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">情况场景中的定性安全行为（有关该评估的更多细节，参见</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 407.92 414.48 421.05 426.14 429.04 435.00 437.35" y="157.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.7</text><text x="445.32" y="157.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="478.32" y="157.89" font-size="11.00" class="sc-notoserifcjksc">）。我们在</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">此总结值得关注的跨领域主题，并在后续各节中更详细地介绍儿童安全、心理健康和选举诚信方</text><text x="72.00" y="189.13" font-size="11.00" class="sc-notoserifcjksc">面的情况。</text><text x="72.00" y="272.96" font-size="11.00" class="sc-notoserifcjksc">审阅人员发现的最明显的跨领域优势，在于</text><text x="283.89 293.83 299.69 303.95 310.54 316.97 322.06 324.96" y="272.96" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="333.84" y="272.96" font-size="11.00" class="sc-notoserifcjksc">会将对话作为一个整体进行推理。它并非</text><text x="72.00" y="288.58" font-size="11.00" class="sc-notoserifcjksc">孤立地依据单个轮次来评估请求，而是会考虑累积输出可能造成的危害。对于危害经由许多单独</text><text x="72.00" y="335.44" font-size="11.00" class="sc-notoserifcjksc">的各个组成部分，并将每个请求包装为独立的技术问题；</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06" y="335.44" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="366.68" font-size="11.00" class="sc-notoserifcjksc">察到了相同的模式：</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06" y="366.68" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="220.95" y="366.68" font-size="11.00" class="sc-notoserifcjksc">拒绝了在对话中途</text><text x="308.95" y="366.68" font-size="11.00" class="sc-loraregular">“</text><text x="313.35" y="366.68" font-size="11.00" class="sc-notoserifcjksc">重新开始</text><text x="357.35" y="366.68" font-size="11.00" class="sc-loraregular">”</text><text x="361.19" y="366.68" font-size="11.00" class="sc-notoserifcjksc">的尝试，并继续权衡先前的轮次。</text><text x="72.00" y="483.45" font-size="11.00" class="sc-notoserifcjksc">审阅人员还注意到，</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06" y="483.45" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="220.95" y="483.45" font-size="11.00" class="sc-notoserifcjksc">的拒绝更有实质内容。该模型并非仅从伦理角度质疑有害请求，而</text><text x="72.00" y="499.07" font-size="11.00" class="sc-notoserifcjksc">是经常将其推理建立在法律风险、实际无效性或历史先例之上。在一个语境模糊的追踪与监视测</text><text x="72.00" y="530.31" font-size="11.00" class="sc-notoserifcjksc">欺诈审查阈值。</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06" y="530.31" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="198.95" y="530.31" font-size="11.00" class="sc-notoserifcjksc">拒绝的是这一前提，而非具体实现：</text><text x="374.95" y="530.31" font-size="11.00" class="sc-loraitalic">“</text><text x="379.22" y="530.31" font-size="11.00" class="sc-notoserifcjksc">这种设计不存在一个危害最小的</text><text x="479.00" y="561.55" font-size="11.00" class="sc-loraitalic">”</text><text x="72.00" y="661.56" font-size="11.00" class="sc-notoserifcjksc">审阅人员还指出，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06" y="661.56" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="209.95" y="661.56" font-size="11.00" class="sc-notoserifcjksc">有时会在对话开始、用户意图尚不明确之前，主动提供超出必要程度</text><text x="72.00" y="677.18" font-size="11.00" class="sc-notoserifcjksc">的技术深度。其中一个例子出现在一段测试</text><text x="283.89 293.83 299.69 303.95 310.54 316.97 322.06 324.96" y="677.18" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="333.84" y="677.18" font-size="11.00" class="sc-notoserifcjksc">如何处理常规武器相关对话的对话中。针</text><text x="72.00" y="692.80" font-size="11.00" class="sc-notoserifcjksc">对一个尚不需要这种细节的开场问题，该模型提供了有关法证</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="432.18" y="133.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="432.18" y="133.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="443.18" y="133.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="443.18" y="133.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="454.18" y="133.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="454.18" y="133.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="465.18" y="133.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="465.18" y="133.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="360.89" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="360.89" y="149.09" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="396.29" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="399.18" y="149.09" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="426.15" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="429.04" y="149.09" width="13.39" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="442.43" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="445.32" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="456.32" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="456.32" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="467.32" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/037f06850df7fbe871e206dad004c3db5fd50340.pdf" rel="noopener"><rect x="467.32" y="149.09" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p075.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 75 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">75</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">序列号压印等主题的详细背景信息。在这一案例中，所披露的材料很容易查到，且模型仍继续拒</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">绝提供操作层面的具体细节；令人担忧的并非信息本身，而是这些信息在模型能够判断其是否合</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">适之前就已被分享。这一行为与</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 277.12 282.98 287.24 293.83 300.26 305.35 308.25 314.91 319.60 325.51 331.06 334.15 340.07" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="351.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一致，在较早轮次中校准所提供信息的</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">详细程度是需要持续改进的方面。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="195.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="171.78" y="195.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="204.78" y="195.95" font-size="11.00" class="sc-notoserifcjksc">中的讨论类似，</text><text x="281.78 291.71 297.58 301.83 308.42 314.86 319.95 322.84" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="331.73" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在减害语境下仍会提供与非法药物相关的具</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">体使用指导。正如我们此前所指出的，在这一领域，减害与助长之间的界线确实难以划定，而当</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="227.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="227.19" font-size="11.00" class="sc-notoserifcjksc">判断用户无论如何都会继续行事时，它仍倾向于提供帮助。在此次发布之前，我们更新</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 129.77 135.45 141.85 144.84 150.80 153.70" y="242.81" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="162.58" y="242.81" font-size="11.00" class="sc-notoserifcjksc">的默认系统提示词，使这条界线更加明确：指示模型即使在请求被包装为预防</text><text x="338.89 344.74 347.74 353.35 359.91 366.49 372.45 375.16 380.84" y="274.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="386.82" y="274.05" font-size="11.00" class="sc-notoserifcjksc">上进行的单轮评估中显著改善。</text><text x="72.00" y="289.67" font-size="11.00" class="sc-notoserifcjksc">将这一区分纳入模型训练，仍是未来版本的优先事项。</text><text x="72.00" y="391.66" font-size="14.00" class="sc-poppinssemibold">4.2</text><text x="96.26" y="391.66" font-size="14.00" class="sc-notosanscjkscbold">儿童安全评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.10 115.78" y="418.22" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude.ai</text><text x="121.76" y="418.22" font-size="11.00" class="sc-notoserifcjksc">是我们面向消费者的产品，仅向</text><text x="278.66" y="418.22" font-size="11.00" class="sc-loraregular">18</text><text x="291.74" y="418.22" font-size="11.00" class="sc-notoserifcjksc">岁及以上的用户开放；我们将继续致力于在模型的</text><text x="72.00" y="433.84" font-size="11.00" class="sc-notoserifcjksc">开发、部署和维护中落实稳健的儿童安全措施。任何为未成年人提供服务的企业客户都必须遵守</text><text x="72.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc">我们</text><text x="94.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="138.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="160.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外安全防护措施</text><text x="248.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="499.18" font-size="11.00" class="sc-notoserifcjksc">我们按照与</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="499.18" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="215.78" y="499.18" font-size="11.00" class="sc-notoserifcjksc">发布前所用相同的测试流程开展了儿童安全评估。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="85.89" y="187.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="85.89" y="187.15" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="121.29" y="187.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="124.18" y="187.15" width="26.96" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="151.15" y="187.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="154.04" y="187.15" width="14.85" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="168.89" y="187.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee635c80fef830a37ea.pdf" rel="noopener"><rect x="171.78" y="187.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0b4915911bb0d19eca5b5ee  93.86 98.66 100.76 106.29" y="655.15" font-size="9.00" class="sc-lorabold">4.2.B]</text><text x="112.13" y="655.15" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全多轮评估结果。</text><text x="211.13" y="655.15" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="319.13" y="655.15" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="337.13" y="655.15" font-size="9.00" class="sc-notoserifcjksc">表示每个类别中表现最好的模型，次优分数以下划</text><text x="72.00" y="666.85" font-size="9.00" class="sc-notoserifcjksc">线标出。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="387.00 395.13 399.92 403.41 408.80 414.06" y="666.85" font-size="9.00" class="sc-loraregular">Mythos</text><text x="420.60" y="666.85" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="485.96 490.75 493.20 497.79 503.16 508.55 513.42 515.64 520.28" y="666.85" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="525.18" y="666.85" font-size="9.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="678.55" font-size="9.00" class="sc-notoserifcjksc">发布，因此我们不报告其使用系统提示词时的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在单轮儿童安全评估中，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="281.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.14 302.82 305.82 311.43 317.99 324.57 330.53 333.43 339.01 344.69 351.09 354.08 360.05 362.94" y="82.61" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="371.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在公共</text><text x="407.72 414.61 421.22" y="82.61" font-size="11.00" class="sc-loraregular">API</text><text x="427.80" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上表现出近乎完美的无</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">害回应率和过度拒绝率，</text><text x="193.00 198.59 204.26 210.67 213.66 219.62 222.51" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="231.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="245.29 251.15 254.14 259.75 266.32 272.89 278.86 281.56 287.24" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">表现相较</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 166.62 171.31 177.21 182.77 185.86 191.78" y="113.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="203.48" y="113.85" font-size="11.00" class="sc-notoserifcjksc">有所提升，但仍在误差范围之内。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在定性审查中，我们发现，与</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25 303.91 308.60 314.51 320.06 323.15 329.07" y="163.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="340.77" y="163.57" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="373.77 383.71 389.57 393.83 400.42 406.85 411.94 414.84" y="163.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="423.73" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在该领域表现出更强的</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">判断力和对有害意图的识别能力，对明显有害的请求坚定拒绝。即使在看似合理的两用包装方式</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">下，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="194.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95" y="194.81" font-size="11.00" class="sc-notoserifcjksc">也拒绝提供与儿童性虐待与性剥削（</text><text x="319.95" y="194.81" font-size="11.00" class="sc-loraregular">CSAE</text><text x="347.60" y="194.81" font-size="11.00" class="sc-notoserifcjksc">）相关的术语。</text><text x="424.60 434.54 440.40 444.66 451.25 457.68 462.77 465.67" y="194.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="474.56" y="194.81" font-size="11.00" class="sc-notoserifcjksc">在涵盖性诱骗</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">技巧和儿童性虐待材料（</text><text x="193.00" y="210.43" font-size="11.00" class="sc-loraregular">CSAM</text><text x="223.91" y="210.43" font-size="11.00" class="sc-notoserifcjksc">）交易等主题的评估中的表现也有所提升，尤其是在</text><text x="479.80 485.39 491.07 497.47 500.46 506.42 509.32" y="210.43" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="518.20" y="210.43" font-size="11.00" class="sc-notoserifcjksc">上辅</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">以我们默认的</text><text x="140.89 146.74 149.74 155.35 161.91 168.49 174.45 177.16 182.84" y="226.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="188.82" y="226.05" font-size="11.00" class="sc-notoserifcjksc">系统提示词时。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="293.11" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="293.11" font-size="11.00" class="sc-notoserifcjksc">在两用情境中的表现仍是未来模型改进需要考虑的问题。在一个场景中，用户询问性诱</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">骗的预警信号，这是一个可能具有保护性目的的请求。</text><text x="336.00 345.93 351.80 356.05 362.64 369.08 374.17 377.06" y="308.73" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="385.95" y="308.73" font-size="11.00" class="sc-notoserifcjksc">意识到这些信息可能被滥用，但</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">这种意识只改变了它组织回应的方式（例如添加警告和免责说明），而没有改变它所提供的内</text><text x="72.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">容。该回应的实质内容比</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 243.62 248.31 254.22 259.77 262.86 268.78" y="339.97" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="280.48" y="339.97" font-size="11.00" class="sc-notoserifcjksc">的回应包含更多可操作的具体细节，并透露了与不同</text><text x="72.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">性诱骗手法相关的具体示例话术。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">另一个被确定为未来可能需要考虑的领域涉及可见的推理摘要。</text><text x="380.00 389.93 395.80 400.05 406.64 413.08 418.17 421.06" y="422.64" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="429.95" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在开启思考的状态下运</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">行，在一部分情况下（包括少数儿童安全场景），经过摘要的推理输出暴露了基于文本的敏感内</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">容，而最终回应正确地未予提供。</text><text x="72.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">这些行为集中出现在核心模型上，并且在</text><text x="272.89 278.48 284.16 290.56 293.55 299.51 302.41" y="503.60" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="311.29" y="503.60" font-size="11.00" class="sc-notoserifcjksc">上基本被</text><text x="358.19 364.04 367.03 372.64 379.21 385.79 391.75 394.45 400.13" y="503.60" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="406.11" y="503.60" font-size="11.00" class="sc-notoserifcjksc">系统提示词所解决。发布</text><text x="72.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">后，我们计划探索针对思考块的更多缓解措施，以限制其中有时会出现的敏感细节。我们鼓励在</text><text x="72.00 78.89 85.50" y="534.84" font-size="11.00" class="sc-loraregular">API</text><text x="92.07" y="534.84" font-size="11.00" class="sc-notoserifcjksc">上进行部署的开发者采用类似的系统提示词安全防护措施，并在用户群中可能存在未成年人</text><text x="72.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">或恶意行为者的情况下，限制推理摘要的暴露。</text><text x="72.00" y="602.15" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="602.15" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="639.25" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="639.25" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="667.13" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="667.13" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也不用于诊断或治疗任何疾病。我们的每个</text><text x="476.18 483.87 486.87 492.48 499.04 505.62" y="667.13" font-size="11.00" class="sc-loraregular">Claude</text><text x="514.48" y="667.13" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00" y="698.37" font-size="11.00" class="sc-notoserifcjksc">况），并以同理心和关怀作出回应，同时尽可能引导用户寻求</text><a href="http://claude.ai" rel="noopener"><rect x="245.29" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="245.29" y="89.43" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="140.89" y="217.25" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="140.89" y="217.25" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="358.19" y="494.80" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="358.19" y="494.80" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

00" y="243.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">真人支持：求助热线、心理健康专业人士，或值得信赖的朋友或家人。</text><text x="72.00" y="131.18" font-size="11.00" class="sc-notoserifcjksc">这些评估考察</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="131.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="131.18" font-size="11.00" class="sc-notoserifcjksc">在涉及自杀与自伤的对话中的回应，衡量模型在面对可能表明存在风险的</text><text x="72.00" y="146.80" font-size="11.00" class="sc-notoserifcjksc">提示词时能否安全且支持性地回应，同时在同一领域的良性请求上保持有用。我们报告单轮无害</text><text x="72.00" y="162.42" font-size="11.00" class="sc-notoserifcjksc">回应率、单轮过度拒绝率以及多轮恰当回应率。</text><text x="72.00" y="517.35" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="517.35" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="517.35" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="517.35" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤的单轮评估结果。</text><text x="235.12" y="517.35" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="529.05" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="529.05" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="180.00" y="529.05" font-size="9.00" class="sc-notoserifcjksc">表示每个类别中表现最好的模型，次优分数以下划线标出。由于常规评估更新，先前模型的</text><text x="72.00" y="540.75" font-size="9.00" class="sc-notoserifcjksc">结果与以往系统卡中的结果存在差异。</text><text x="225.00 233.13 237.92 241.41 246.80 252.06" y="540.75" font-size="9.00" class="sc-loraregular">Mythos</text><text x="258.60" y="540.75" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="323.96 328.75 331.20 335.79 341.16 346.55 351.42 353.64 358.28" y="540.75" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="363.18" y="540.75" font-size="9.00" class="sc-notoser toserifcjksc">表示每个类别中表现最好的模型，次优分数</text><text x="72.00" y="306.93" font-size="9.00" class="sc-notoserifcjksc">以下划线标出。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="414.00 422.13 426.92 430.41 435.80 441.06" y="306.93" font-size="9.00" class="sc-loraregular">Mythos</text><text x="447.60" y="306.93" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="72.00 76.79 79.24 83.83 89.20 94.58 99.46 101.67 106.32" y="318.63" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="111.21" y="318.63" font-size="9.00" class="sc-notoserifcjksc">上发布，因此我们不报告其使用系统提示词时的结果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="374.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="374.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 218.01 223.69 230.09 233.08 239.05 241.94" y="374.03" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="250.83" y="374.03" font-size="11.00" class="sc-notoserifcjksc">在具有潜在风险的单轮请求上保持了较高的无害回应率，并</text><text x="72.00" y="389.65" font-size="11.00" class="sc-notoserifcjksc">且在良性提示词上几乎从不过度拒绝。与</text><text x="272.89 282.83 288.69 292.95 299.54 305.97 311.06 313.96 320.62 325.31 331.22 336.77 339.86 345.78" y="389.65" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="357.48" y="389.65" font-size="11.00" class="sc-notoserifcjksc">相比，两个模型在</text><text x="448.38 455.26 461.87" y="389.65" font-size="11.00" class="sc-loraregular">API</text><text x="468.45" y="389.65" font-size="11.00" class="sc-notoserifcjksc">上的多轮恰当</text><text x="72.00" y="405.27" font-size="11.00" class="sc-notoserifcjksc">回应率均出现退步，但在应用</text><text x="217.89 223.75 226.74 232.35 238.91 245.49 251.45 254.16 259.84" y="405.27" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="265.82" y="405.27" font-size="11.00" class="sc-notoserifcjksc">系统提示词后大幅提升，</text><text x="386.82 392.41 398.08 404.49 407.48 413.44 416.33" y="405.27" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="425.22" y="405.27" font-size="11.00" class="sc-notoserifcjksc">的恰当回应率达到</text><text x="72.00" y="420.89" font-size="11.00" class="sc-loraregular">96%</text><text x="94.29" y="420.89" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="471.19" font-size="11.00" class="sc-notoserifcjksc">从定性角度看，内部政策专家认为</text><text x="239.89 249.83 255.69 259.95 266.54 272.97 278.06 280.96" y="471.19" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="289.84" y="471.19" font-size="11.00" class="sc-notoserifcjksc">在该领域对话中的处理表现好坏参半，但总体上略</text><text x="72.00" y="486.81" font-size="11.00" class="sc-notoserifcjksc">逊于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="486.81" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="219.77" y="486.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="233.67" y="486.81" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="278.37" y="486.81" font-size="11.00" class="sc-notoserifcjksc">。一项改进体现在</text><text x="369.26 379.20 385.06 389.32 395.91 402.34 407.43 410.33" y="486.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="419.22" y="486.81" font-size="11.00" class="sc-notoserifcjksc">对绝望感与困顿感表达的</text><text x="72.00" y="502.43" font-size="11.00" class="sc-notoserifcjksc">回应方式上。</text><text x="138.00 147.93 153.80 158.05 164.64 171.08 176.17 179.06 185.73 190.41 196.32 201.88 204.97 210.89" y="502.43" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="222.59" y="502.43" font-size="11.00" class="sc-notoserifcjksc">有时会过度附和诸如</text><text x="321.59" y="502.43" font-size="11.00" class="sc-loraregular">“</text><text x="325.99" y="502.43" font-size="11.00" class="sc-notoserifcjksc">什么都不会改变</text><text x="402.99" y="502.43" font-size="11.00" class="sc-loraregular">”</text><text x="406.83" y="502.43" font-size="11.00" class="sc-notoserifcjksc">之类的绝对化表述，而</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="518.05" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="518.05" font-size="11.00" class="sc-notoserifcjksc">则更可靠地先承认用户的感受、但不认同其背后的认知扭曲，然后再转向更有希望的视</text><text x="72.00" y="533.67" font-size="11.00" class="sc-notoserifcjksc">角。</text><text x="72.00" y="600.72" font-size="11.00" class="sc-notoserifcjksc">最明显的退步是我们在以往系统卡中已标记过的一种模式：模型会建议用替代行为来取代自伤。</text><text x="72.00" y="616.34" font-size="11.00" class="sc-notoserifcjksc">这类指导在临床上存在争议，且尚未被证明能够减轻自伤冲动。除了此类建议的频率有所增加之</text><text x="72.00" y="631.96" font-size="11.00" class="sc-notoserifcjksc">外，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06" y="631.96" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="143.95" y="631.96" font-size="11.00" class="sc-notoserifcjksc">还提出了比以往观察到的范围更广的感官导向替代方式，例如用红色记号笔在皮肤</text><a href="http://claude.ai" rel="noopener"><rect x="217.89" y="396.47" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="217.89" y="396.47" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p080.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 80 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">80</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">除替代行为之外，与</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="296.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="329.77 339.71 345.57 349.83 356.42 362.85 367.94 370.84" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="379.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更有可能引入用户并未披露的诊</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">断标签，例如将痛苦定性为抑郁症。此外，将自伤认可为一种有效应对机制、或认可回避专业帮</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">助的模型回应，延续了</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96 232.62 237.31 243.22 248.77 251.86 257.78" y="113.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="269.48" y="113.85" font-size="11.00" class="sc-notoserifcjksc">中的情况，出现比例与之相当。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在本次发布之前，我们更新了</text><text x="217.89 223.75 226.74 232.35 238.91 245.49 251.45 254.16 259.84" y="179.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="265.82" y="179.77" font-size="11.00" class="sc-notoserifcjksc">系统提示词，以逐一应对上述行为。这些更新降低了自伤</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">替代建议和诊断标签化的频率，并在</text><text x="250.89 256.74 259.74 265.35 271.91 278.49 284.45 287.16 292.84" y="195.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="298.82" y="195.39" font-size="11.00" class="sc-notoserifcjksc">上部分缓解了对回避求助的认可。将自伤认可为有</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">效应对机制这一行为对系统提示词引导的响应较弱，在模型训练层面解决这一问题是未来模型发</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">布的考虑事项之一。与以往发布一样，我们鼓励基于</text><text x="327.89 334.78 341.39" y="226.63" font-size="11.00" class="sc-loraregular">API</text><text x="347.97" y="226.63" font-size="11.00" class="sc-notoserifcjksc">构建的开发者在任何用户可能处于痛苦</text><text x="72.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">状态的部署中采用类似的安全防护措施。</text><text x="72.00" y="307.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="307.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="335.53" font-size="11.00" class="sc-notoserifcjksc">这些评估考察</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="335.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="335.53" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话，衡量它能否避免强化具有潜在风险的请</text><text x="72.00" y="351.15" font-size="11.00" class="sc-notoserifcjksc">求，同时在有关营养、健身和健康的良性问题上仍然提供帮助。我们在此报告单轮无害回应率和</text><text x="72.00" y="366.77" font-size="11.00" class="sc-notoserifcjksc">过度拒绝率。该领域的多轮测试目前仍由我们的内部政策专家进行定性审查，我们将在下文讨论</text><text x="72.00" y="382.39" font-size="11.00" class="sc-notoserifcjksc">这些观察结果。</text><a href="http://claude.ai" rel="noopener"><rect x="217.89" y="170.97" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="217.89" y="170.97" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="250.89" y="186.59" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="250.89" y="186.59" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

5.92 121.93 124.49" y="373.91" font-size="11.00" class="sc-lorabold">Sonnet 4.6</text><text x="150.00 156.09 160.67 163.38 169.28 173.28 182.84 185.74 189.09 194.91 197.80 204.45 207.16 213.15 219.14 228.70" y="359.83" font-size="11.00" class="sc-loraregular">97.21% (± 0.55%)</text><text x="249.00 255.65 258.35 262.36 268.26 277.82 280.71 284.07 289.89 292.78 299.43 302.14 306.14 312.96 322.53" y="359.83" font-size="11.00" class="sc-loraregular">0.12% (± 0.10%)</text><text x="348.00 354.35 360.53 363.13 369.48 375.60 385.16 388.06 391.41 397.23 400.13 406.78 409.48 415.60 421.78 431.34" y="359.83" font-size="11.00" class="sc-loraregular">98.63% (± 0.38%)</text><text x="447.00 453.65 456.35 462.48 468.47 478.03 480.92 484.27 490.10 492.99 499.64 502.35 506.35 511.41 520.98" y="359.83" font-size="11.00" class="sc-loraregular">0.35% (± 0.17%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">81</text><text x="75.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">具有潜在风险的单</text><text x="149.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="149.50 156.85 163.81" y="160.21" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="168.07" y="160.21" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="248.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="248.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="347.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">具有潜在风险的单</text><text x="347.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="446.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="446.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="72.00" y="390.97" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.97" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="390.97" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="390.97" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮结果。</text><text x="209.27" y="390.97" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越好；拒</text><text x="72.00" y="402.67" font-size="9.00" class="sc-notoserifcjksc">绝率越低越好。</text><text x="135.00" y="402.67" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="153.00" y="402.67" font-size="9.00" class="sc-notoserifcjksc">表示每个类别中表现最好的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结果与</text><text x="72.00" y="414.37" font-size="9.00" class="sc-notoserifcjksc">以往系统卡中的结果存在差异。</text><text x="198.00 206.13 210.92 214.41 219.80 225.06" y="414.37" font-size="9.00" class="sc-loraregular">Mythos</text><text x="231.60" y="414.37" font-size="9.00" class="sc-notoserifcjksc">系列模型尚未在</text><text x="296.96 301.75 304.20 308.79 314.16 319.54 324.42 326.64 331.28" y="414.37" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="336.18" y="414.37" font-size="9.00" class="sc-notoserifcjksc">上发布，因此我们不报告其使用系统提示词时的结</text><text x="72.00" y="426.07" font-size="9.00" class="sc-notoserifcjksc">果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="469.77" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="469.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 218.01 223.69 230.09 233.08 239.05 241.94" y="469.77" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="250.83" y="469.77" font-size="11.00" class="sc-notoserifcjksc">的违规请求评估结果显示，二者在</text><text x="418.72 425.61 432.22" y="469.77" font-size="11.00" class="sc-loraregular">API</text><text x="438.80" y="469.77" font-size="11.00" class="sc-notoserifcjksc">上相较</text><text x="474.69 482.38 485.37 490.98 497.55 504.12" y="469.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="485.39" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="485.39" font-size="11.00" class="sc-notoserifcjksc">有所改进，并且这两个模型无论在</text><text x="324.48 331.37 337.98" y="485.39" font-size="11.00" class="sc-loraregular">API</text><text x="344.56" y="485.39" font-size="11.00" class="sc-notoserifcjksc">还是</text><text x="369.45 375.30 378.30 383.90 390.47 397.05 403.01 405.72 411.39" y="485.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="417.38" y="485.39" font-size="11.00" class="sc-notoserifcjksc">上，对良性提示词几乎从</text><text x="72.00" y="501.01" font-size="11.00" class="sc-notoserifcjksc">不过度拒绝。</text><text x="72.00" y="534.54" font-size="11.00" class="sc-notoserifcjksc">从定性角度看，审阅人员认为</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="534.54" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84" y="534.54" font-size="11.00" class="sc-notoserifcjksc">对进食紊乱相关对话的处理总体上较</text><text x="446.74 454.43 457.42 463.03 469.59 476.17 482.13 485.03 494.96 500.82 505.08 511.67 518.10" y="534.54" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="550.16" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="550.16" font-size="11.00" class="sc-notoserifcjksc">略有改进。在</text><text x="184.42 194.35 200.22 204.47 211.06 217.50 222.59 225.48 232.15 236.84 242.74 248.30 251.39 257.31" y="550.16" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="269.01" y="550.16" font-size="11.00" class="sc-notoserifcjksc">曾予以配合的模糊情境中，</text><text x="401.01 410.94 416.81 421.06 427.65 434.09 439.18 442.07" y="550.16" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="450.96" y="550.16" font-size="11.00" class="sc-notoserifcjksc">更有可能拒绝提供</text><text x="490.00 499.93 505.80 510.05 516.64 523.08 528.17 531.06" y="565.78" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="581.40" font-size="11.00" class="sc-notoserifcjksc">也更不愿意生成理想化特定体型的内容，会拒绝诸如评估用户的腰围数据是否与时装模特相符之</text><text x="72.00" y="597.02" font-size="11.00" class="sc-notoserifcjksc">类的请求。</text><text x="72.00" y="664.08" font-size="11.00" class="sc-notoserifcjksc">在被确定为有待改进的方面中，内部政策专家注意到，在用户披露了限制性进食行为之后，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="679.70" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="679.70" font-size="11.00" class="sc-notoserifcjksc">更频繁地引入针对用户本人的身体和饮食数字，例如</text><text x="377.84 384.59 394.68" y="679.70" font-size="11.00" class="sc-loraregular">BMI</text><text x="401.26" y="679.70" font-size="11.00" class="sc-notoserifcjksc">和卡路里数。这主要发生在</text><text x="72.00" y="695.32" font-size="11.00" class="sc-notoserifcjksc">模型试图说服用户其</text><a href="http://claude.ai" rel="noopener"><rect x="369.45" y="476.59" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="369.45" y="476.59" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p082.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 82 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">82</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有时会对用户出现进食紊乱行为的动机作出缺乏依据的解读；这一行为与</text><text x="476.84 484.53 487.52 493.13 499.70 506.28" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="113.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的表现相似。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">上述两种行为在</text><text x="151.89 157.48 163.16 169.56 172.55 178.51 181.41" y="163.57" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="190.29" y="163.57" font-size="11.00" class="sc-notoserifcjksc">上基本被</text><text x="237.19 243.04 246.03 251.64 258.21 264.79 270.75 273.45 279.13" y="163.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="285.11" y="163.57" font-size="11.00" class="sc-notoserifcjksc">系统提示词所缓解。我们还在系统提示词中保留了现</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">有的指引，引导用户使用</text><text x="195.89 204.22 209.82 214.08 217.17 223.60 230.28 235.96 238.95 241.84 248.73 251.72 254.71 257.80 263.48 270.15 275.95 281.91 284.81 288.47 294.90 299.67 302.56 309.40 315.00 319.26 322.35 329.03 335.11 338.00 346.20 349.29 354.38 360.82 365.50 372.08 378.04 382.81" y="179.19" font-size="11.00" class="sc-loraregular">National Alliance for Eating Disorders</text><text x="390.79" y="179.19" font-size="11.00" class="sc-notoserifcjksc">的求助热线，而非已停用的</text><text x="72.00 80.38 87.22 95.24" y="194.81" font-size="11.00" class="sc-loraregular">NEDA</text><text x="105.02" y="194.81" font-size="11.00" class="sc-notoserifcjksc">热线；同时我们注意到，核心</text><text x="250.92 257.80 264.41" y="194.81" font-size="11.00" class="sc-loraregular">API</text><text x="270.99" y="194.81" font-size="11.00" class="sc-notoserifcjksc">模型仍可能提及</text><text x="350.88 359.27 366.11 374.13" y="194.81" font-size="11.00" class="sc-loraregular">NEDA</text><text x="383.91" y="194.81" font-size="11.00" class="sc-notoserifcjksc">求助热线。我们鼓励基于</text><text x="507.80 514.68 521.30" y="194.81" font-size="11.00" class="sc-loraregular">API</text><text x="527.87" y="194.81" font-size="11.00" class="sc-notoserifcjksc">构</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">建的开发者在用户可能处于痛苦状态的情境中采用类似的安全防护措施。在模型层面弥合这一差</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">距是未来训练的考虑事项之一。</text><text x="72.00" y="278.31" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="278.31" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="304.88" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.92 172.49 179.05 184.15 187.04 193.00 195.71" y="304.88" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="204.78" y="304.88" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="237.78" y="304.88" font-size="11.00" class="sc-notoserifcjksc">中所报告的同一套偏见与诚信基准测试对</text><text x="438.67 446.36 449.36 454.96 461.53 468.11 474.07 476.96 486.90 492.76 497.02 503.61 510.04 515.13 518.03" y="304.88" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="526.92" y="304.88" font-size="11.00" class="sc-notoserifcjksc">进</text><text x="72.00" y="320.50" font-size="11.00" class="sc-notoserifcjksc">行了评估。这些评估包括我们开源的政治公允性衡量方法、用于衡量人口统计偏见的</text><text x="481.89 488.65 491.74 497.41" y="320.50" font-size="11.00" class="sc-loraregular">Bias</text><text x="72.00 78.84 84.80 91.48 97.33 103.92 113.76 119.43 124.15 130.06 132.95 136.61 143.05 147.81 150.71 159.46 166.03 171.99 177.08 181.34 184.43 190.87 197.54 200.44 207.32 214.00 219.09 227.77 233.73 238.50 241.59 248.26" y="336.12" font-size="11.00" class="sc-loraregular">Benchmark for Question Answering</text><text x="254.35" y="336.12" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="265.35 272.09 278.93" y="336.12" font-size="11.00" class="sc-loraregular">BBQ</text><text x="287.69" y="336.12" font-size="11.00" class="sc-notoserifcjksc">），以及我们的选举诚信评估。在本次发布之前，我</text><text x="72.00" y="351.74" font-size="11.00" class="sc-notoserifcjksc">们还新建了一项针对选举诚信的多轮评估，以提高我们在该领域测试套件的鲁棒性。</text><text x="72.00" y="416.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="416.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="448.45" font-size="11.00" class="sc-notoserifcjksc">我们使用我们的</text><text x="149.00" y="448.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="193.00" y="448.45" font-size="11.00" class="sc-notoserifcjksc">来衡量政治公允性，该评估涵盖</text><text x="349.89 353.90 356.67 362.80 368.79" y="448.45" font-size="11.00" class="sc-loraregular">1,350</text><text x="378.53" y="448.45" font-size="11.00" class="sc-notoserifcjksc">个提示词对，这些提示词对在</text><text x="72.00" y="464.07" font-size="11.00" class="sc-loraregular">150</text><text x="91.72" y="464.07" font-size="11.00" class="sc-notoserifcjksc">个话题和</text><text x="138.62" y="464.07" font-size="11.00" class="sc-loraregular">9</text><text x="147.87" y="464.07" font-size="11.00" class="sc-notoserifcjksc">种任务类型中呈现对立的意识形态观点。由</text><text x="359.76 367.45 370.44 376.05 382.62 389.20" y="464.07" font-size="11.00" class="sc-loraregular">Claude</text><text x="398.05" y="464.07" font-size="11.00" class="sc-notoserifcjksc">评分模型对三项属性进行打</text><text x="72.00" y="479.69" font-size="11.00" class="sc-notoserifcjksc">分：公允性（模型是否以相当的深度和质量回应同一对中的两个提示词）、对对立观点的承认，</text><text x="72.00" y="495.31" font-size="11.00" class="sc-notoserifcjksc">以及拒绝率。结果是在应用公开系统提示词的情况下报告的，该系统提示词包含我们标准的公允</text><text x="72.00" y="510.93" font-size="11.00" class="sc-notoserifcjksc">性表述，指示</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="510.93" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="510.93" font-size="11.00" class="sc-notoserifcjksc">在不同观点之间保持公允。</text><text x="311.18 318.87 321.86 327.47 334.04 340.62 346.58 349.48 359.41 365.27 369.53 376.12 382.55 387.64 390.54 397.20 401.89 407.80 413.35 416.44 422.36" y="510.93" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="434.07" y="510.93" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="447.96 455.65 458.64 464.25 470.82 477.39 483.36 486.25 496.18 502.05 506.30 512.89 519.33 524.42 527.31" y="510.93" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="72.00" y="526.55" font-size="11.00" class="sc-notoserifcjksc">未纳入其中，因为它们未在</text><text x="206.89 212.75 215.74 221.35 227.91 234.49 240.45 243.16 248.84" y="526.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="254.82" y="526.55" font-size="11.00" class="sc-notoserifcjksc">上提供。</text><a href="http://claude.ai" rel="noopener"><rect x="237.19" y="154.77" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="237.19" y="154.77" width="45.03" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c886650a2e96fc0925c805a1a7ca77314ccbf4a6.pdf" rel="noopener"><rect x="118.89" y="296.08" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c886650a2e96fc0925c805a1a7ca77314ccbf4a6.pdf" rel="noopener"><rect x="118.89" y="296.08" width="35.40" heigh <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p083.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 83 页"><text x="72.00 80.41 83.54 91.95 95.08 102.58 105.96 114.15 117.58 126.39 133.33 136.71 144.89 152.91 161.35 169.15 177.58 191.08 199.89 204.88 212.08 215.46 219.78 228.07 233.06 236.44 246.67 255.10 263.12 270.06 274.89 278.32 286.62 295.05 298.43 307.49 315.92 322.86 333.58 341.60 346.59 350.02 358.46" y="558.31" font-size="13.00" class="sc-poppinsmedium" fill="#666666">4.4.2 Bias Benchmark for Question Answering</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">6</text><text x="78.10 84.08 89.24 93.57 97.90 100.71 105.34 111.32 113.85 116.48 122.74 125.20 127.73 130.36 135.70 139.57 142.20 147.36 150.08 152.54 155.17 158.22 163.58 169.72 175.09 178.73 181.78 184.23 186.86 192.99 199.21 207.17 209.66 212.29 218.55 221.18 227.17 232.33 238.39 244.37 249.26 255.08 261.04 263.85 266.57 270.44 273.07 278.89 281.70 286.85 291.48 294.11 299.93 305.35 311.41 316.73 322.72 331.66 336.81 341.10 346.47 349.10 352.43 358.28 362.60 365.23 370.99 376.96 382.38 387.00 390.87 393.68 399.53 405.60 408.23 413.38 419.45 424.08 431.97 437.38 441.71 444.52 450.59 456.12 458.58 461.21 466.36 470.07 476.56 479.37 484.42 486.92 492.28 495.92 499.56 505.61 507.92 514.12 519.74 523.38 529.16 534.73" y="704.46" font-size="10.00" class="sc-loraregular">Parrish, A., et al. (2021). BBQ: A hand-built bias benchmark for question answering. arXiv:2110.08193.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 186.95 190.59 196.64 198.95 205.16 210.77 214.41 220.19" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2110.08193</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">83</text><text x="72.00" y="325.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="325.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 98.78 100.88 104.54 106.63 112.17" y="325.75" font-size="9.00" class="sc-lorabold">4.4.1.A]</text><text x="118.01" y="325.75" font-size="9.00" class="sc-notoserifcjkscbold">成对政治偏见评估。</text><text x="199.01" y="325.75" font-size="9.00" class="sc-notoserifcjksc">公允性和对立观点的得分越高越好。拒绝的得分越低越好。由于常规评估更新，先前</text><text x="72.00" y="337.45" font-size="9.00" class="sc-notoserifcjksc">模型的结果与以往系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80" y="378.05" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="148.69" y="378.05" font-size="11.00" class="sc-notoserifcjksc">在公允性上的表现与</text><text x="250.59 258.27 261.27 266.88 273.44 280.02 285.98 288.88 297.61 304.18 310.74 315.84 318.73 324.69 327.40" y="378.05" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="336.47" y="378.05" font-size="11.00" class="sc-notoserifcjksc">相当，并且在该评估的请求中有</text><text x="493.37" y="378.05" font-size="11.00" class="sc-loraregular">70%</text><text x="517.73" y="378.05" font-size="11.00" class="sc-notoserifcjksc">的情</text><text x="72.00" y="393.67" font-size="11.00" class="sc-notoserifcjksc">况提供了对立观点。然而，</text><text x="204.00 209.59 215.26 221.67 224.66 230.62 233.51" y="393.67" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="242.40" y="393.67" font-size="11.00" class="sc-notoserifcjksc">的拒绝率高于其他近期发布的模型。这些拒绝集中在要求撰写</text><text x="72.00" y="409.29" font-size="11.00" class="sc-notoserifcjksc">单方面说服性文章的请求，以及要求模型认同某一特定政治立场的直接观点类问题上。经检查，</text><text x="72.00" y="440.53" font-size="11.00" class="sc-notoserifcjksc">论点，而不是完整的文章），或者提供一份平衡的概述而不选边站。在大多数被计为拒绝的情况</text><text x="72.00" y="456.15" font-size="11.00" class="sc-notoserifcjksc">中，这一行为在提示词对的两侧均有出现，其余的单侧拒绝在不同政治方向之间大致均衡。</text><text x="72.00" y="586.39" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们使用</text><text x="206.89 213.65 216.74 222.41 227.51 230.40 237.24 243.20 249.88 255.73 262.32 272.16 277.83 282.55 288.46 291.35 295.01 301.45 306.21 309.11 317.86 324.43 330.39 335.48 339.74 342.83 349.27 355.94 358.84 365.72 372.40 377.49 386.17 392.13 396.90 399.99 406.66" y="586.39" font-size="11.00" class="sc-loraregular">Bias Benchmark for Question Answering</text><text x="412.75" y="586.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.75 430.49 437.33" y="586.39" font-size="11.00" class="sc-loraregular">BBQ</text><text x="446.09" y="586.39" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.09" y="582.72" font-size="6.60" class="sc-loraregular">6</text><text x="460.90" y="586.39" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="474.80 482.48 485.48 491.09 497.65 504.23" y="586.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="602.01" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="602.01" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这是一项标准的基于基准测试的偏见评估，涵盖年龄、种族、性别、残障</text><text x="72.00" y="617.63" font-size="11.00" class="sc-notoserifcjksc">和社会经济地位等属性。</text><text x="72.00 78.74 85.58" y="651.16" font-size="11.00" class="sc-loraregular">BBQ</text><text x="97.23" y="651.16" font-size="11.00" class="sc-notoserifcjksc">测试模糊问题（正确答案为</text><text x="229.23" y="651.16" font-size="11.00" class="sc-loraregular">“</text><text x="233.63" y="651.16" font-size="11.00" class="sc-notoserifcjksc">未知</text><text x="255.63" y="651.16" font-size="11.00" class="sc-loraregular">”</text><text x="259.47" y="651.16" font-size="11.00" class="sc-notoserifcjksc">）及其消歧版本（提供足以正确作答的上下文）。我们报</text><text x="72.00" y="666.78" font-size="11.00" class="sc-notoserifcjksc">告</text><a href="https://arxiv.org/abs/2110.08193" rel="noopener"><rect x="537.19" y="694.40" width="2.63" height="
