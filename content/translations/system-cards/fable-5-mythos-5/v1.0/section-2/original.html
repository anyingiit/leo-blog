<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">基于作为自动化行为审计（</text><text x="204.00 209.61 216.18 220.43 226.87 236.70 242.30 246.56 252.47 259.04 261.94 268.34 274.30 280.89 286.43 291.99 295.08 301.52 306.20 311.88 314.87 317.76 323.37 329.94 336.52 339.78" y="131.19" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="344.04 355.04 366.04 377.04 388.04 399.04 410.04 421.04 432.04 443.04 454.04 465.04 476.04 487.04 498.04 509.04 520.04" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）一部分开展的几项非常轻量的评估，</text><text x="294.89 301.78" y="146.81" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="146.81" font-size="11.00" class="sc-notoserifcjksc">开发者服务，其倾向不会发生重要变化。就个别</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">观察而言，在自动化行为审计测试中，模型往往对</text><text x="316.89 323.78 330.36 334.61 341.20 345.89 352.32 358.89 361.98" y="162.43" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="162.43" font-size="11.00" class="sc-notoserifcjksc">及其领导层表现出比对其他前沿开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">发者更正面的看法，不过这尚未达到具有破坏倾向的程度。</text><text x="75.75 86.75 97.75 108.75 119.75 130.75" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00 248.00 259.00 270.00 281.00" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">来自这条路径的大部分风险集中于其他前沿模型开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">发者的使用，因为在这一情境下，模型破坏</text><text x="283.89 290.78" y="260.97" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="260.97" font-size="11.00" class="sc-notoserifcjksc">研发最可能增加后续出现显著有害后果的风险。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">们的服务条款不允许第三方将我们的工具用于这一目的，这限制了该风险的范围；并且截至</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="292.21" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40 121.40 132.40 143.40 154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40" y="292.21" font-size="11.00" class="sc-notoserifcjksc">发布时，我们已采取缓解措施（见第</text><text x="289.29 293.30 296.00" y="292.21" font-size="11.00" class="sc-loraregular">1.5</text><text x="304.89 315.89 326.89 337.89 348.89 359.89 370.89 381.89 392.89 403.89 414.89 425.89 436.89 447.89 458.89 469.89 480.89" y="292.21" font-size="11.00" class="sc-notoserifcjksc">节），降低了其他前沿模型开发者使用</text><text x="494.79 500.37 506.05 512.45 515.44 521.41 524.30" y="292.21" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="72.00 83.00 94.00 105.00" y="307.83" font-size="11.00" class="sc-notoserifcjksc">开展重大</text><text x="118.89 125.78" y="307.83" font-size="11.00" class="sc-loraregular">AI</text><text x="132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36" y="307.83" font-size="11.00" class="sc-notoserifcjksc">研发工作的动机。</text><text x="75.75 86.75 97.75 108.75 119.75" y="376.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="376.54" font-size="11.00" class="sc-notoserifcjkscbold">监控及相关安全防护措施：</text><text x="347.00 358.00" y="376.54" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="376.54" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="376.54" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们对第三</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="392.16" font-size="11.00" class="sc-notoserifcjksc">方部署的监控能力要弱得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被其运营方</text><text x="72.00" y="407.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.43 96.00 101.96 106.65 112.25 116.51 122.94" y="407.78" font-size="11.00" class="sc-loraregular">operator</text><text x="289.32 295.22 301.05 305.31 311.27 317.95 324.53 330.43 337.01 339.91 344.16 350.75 353.84 360.52 366.43 369.52 376.19" y="407.78" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="72.00 83.00 94.00 105.00" y="423.40" font-size="11.00" class="sc-notoserifcjksc">的行动。</text><text x="72.00 77.86 80.43 86.44 89.01 95.17 97.73" y="474.52" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49 117.49" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="474.52" font-size="11.00" class="sc-lorabold">8</text><text x="137.67 148.67 159.67 170.67 181.67 192.67 203.67 214.67 225.67 236.67 247.67 258.67 269.67 280.67" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="506.90" font-size="11.00" class="sc-notoserifcjksc">在主要国家政府内部使用我们的模型会带来一定的对齐风险，尤其是在模型被极其广泛使用的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="522.52" font-size="11.00" class="sc-notoserifcjksc">况下。例如，一个未对齐的模型可能处于能够塑造送达重要决策者的信息和观点的位置，或利用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="538.14" font-size="11.00" class="sc-notoserifcjksc">关键系统中的漏洞造成广泛影响。</text><text x="75.75 86.75 97.75 108.75 119.75 130.75" y="588.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="588.68" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00 325.00" y="588.68" font-size="11.00" class="sc-notoserifcjksc">如第</text><text x="338.89" y="588.68" font-size="11.00" class="sc-loraregular">6</text><text x="348.14 359.14 370.14 381.14 392.14 403.14 414.14 425.14 436.14" y="588.68" font-size="11.00" class="sc-notoserifcjksc">节所述，我们不认为</text><text x="450.04 457.73 460.72 466.33 472.89 479.47 485.43 488.33 498.26 504.12 508.38 514.97 521.40 526.50 529.39" y="588.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="604.30" font-size="11.00" class="sc-notoserifcjksc">具有会导致其尝试破坏政府决策或运作的连贯目标或倾向。基于作为自动化行为审计一部分开展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="619.92" font-size="11.00" class="sc-notoserifcjksc">的几项非常轻量的评估，我们预计模型的倾向在政府使用场景中不会发生重要变化。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="702.86" font-size="11.00" class="sc-notoserifcjksc">然而，我们难以完全排除由第三方对手通过数据投毒蓄意</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">植入的行为后门所带来的风险。迄今为止，我们尚未看到此类攻击的任何成功案例，但由于我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">对政府使用情况的可见性有限，我们更难在足够真实的处境下开展部署前测试，从而难以确信我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">们能够发现此类由第三方植入后门的行为。</text><text x="75.75 86.75 97.75 108.75 119.75 130.75" y="164.40" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="164.40" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="164.40" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00 83.00 94.00 105.00 116.00" y="180.02" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89 136.78 143.36 147.61 154.20 158.89 165.32 171.89 174.98" y="180.02" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="211.26" font-size="11.00" class="sc-notoserifcjksc">相关官员的观点或以其他方式采取高风险行动，恰恰需要这种采用。鉴于</text><text x="426.89 433.78" y="211.26" font-size="11.00" class="sc-loraregular">AI</text><text x="440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="211.26" font-size="11.00" class="sc-notoserifcjksc">模型目前在公众中普</text><text x="75.75 86.75 97.75 108.75 119.75" y="311.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="215.00 226.00 237.00" y="311.77" font-size="11.00" class="sc-notoserifcjkscbold">监控：</text><text x="248.00 259.00" y="311.77" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="272.89 279.78 286.36 290.61 297.20 301.89 308.32 314.89 317.98" y="311.77" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="311.77" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们对第三方部署的监控能力要</text><text x="72.00 79.46 82.84 91.43 94.82" y="391.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.4</text><text x="106.50 119.50 132.50 145.50 158.50 171.50 184.50 197.50 210.50" y="391.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的总体评估</text><text x="72.00 83.00 94.00 105.00 116.00" y="419.79" font-size="11.00" class="sc-notoserifcjksc">基于我们对</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25" y="419.79" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350
