"210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">以往的系统卡将一套自动化研究任务作为针对</text><text x="294.89" y="238.38" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="238.38" font-size="11.00" class="sc-notoserifcjksc">研发能力的</text><text x="363.36" y="238.38" font-size="11.00" class="sc-loraregular">“</text><text x="367.76" y="238.38" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="400.76" y="238.38" font-size="11.00" class="sc-loraregular">”</text><text x="404.60" y="238.38" font-size="11.00" class="sc-notoserifcjksc">评估进行报告。如果某个模</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">型在这些任务上失败，我们就可以确信它缺乏实现有意义的研发加速很可能所需的能力。但</text><text x="72.00" y="269.62" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="269.62" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="174.13" y="269.62" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="297.02" y="269.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.91" y="269.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="395.33" y="269.62" font-size="11.00" class="sc-notoserifcjksc">一样，在这些任务中除一项以</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">外的所有任务上都超过了人类最高表现阈值。因此，这套任务已不再能提供证据，证明该模型的</text><text x="72.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">能力低于我们的风险阈值。我们在此报告这些结果，是为了将</text><text x="371.89" y="300.86" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="460.14" y="300.86" font-size="11.00" class="sc-notoserifcjksc">的能力与先前模</text><text x="72.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">型进行比较，但我们的风险阈值分析已不再依赖这些结果。</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">有关这些评估任务的详细说明，请参见</text><text x="261.89" y="384.11" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="347.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="380.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="394.74" y="384.11" font-size="11.00" class="sc-loraregular">8.3</text><text x="412.65" y="384.11" font-size="11.00" class="sc-notoserifcjksc">节。在此，我们只纳入一</text><text x="222.61" y="399.73" font-size="11.00" class="sc-loraregular sc-k">Novel Compiler</text><text x="301.94" y="399.73" font-size="11.00" class="sc-notoserifcjksc">），以及分数无上限的任务，因为其他采用有上</text><text x="72.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">限</text><text x="85.89 89.51 96.34 102.83 106.69" y="415.35" font-size="11.00" class="sc-loraregular">[0–1]</text><text x="113.54" y="415.35" font-size="11.00" class="sc-notoserifcjksc">分数的任务已无法区分近几代模型。</text><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="160.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="160.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="193.00" y="89.43" width=" " y="351.39" font-size="11.00" class="sc-loraregular">90% = 40h eq.</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="76.75" y="147.24" font-size="9.82" class="sc-notoserifcjkscbold">内核任务（</text><text x="125.84" y="147.24" font-size="9.82" class="sc-lorabold sc-k">Kernel task</text><text x="179.54" y="147.24" font-size="9.82" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="161.19" font-size="9.82" class="sc-notoserifcjkscbold">（困难任务上的最佳加速比；</text><text x="76.75" y="175.13" font-size="9.82" class="sc-notoserifcjkscbold">标准脚手架（</text><text x="135.66" y="175.13" font-size="9.82" class="sc-lorabold sc-k">scaffold</text><text x="172.27" y="175.13" font-size="9.82" class="sc-notoserifcjkscbold">））</text><text x="76.75" y="208.26" font-size="11.00" class="sc-notoserifcjkscbold">时间序列预测（</text><text x="153.75" y="208.26" font-size="11.00" class="sc-lorabold sc-k">Time</text><text x="76.75" y="223.88" font-size="11.00" class="sc-lorabold sc-k">Series Forecasting</text><text x="173.51" y="223.88" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="239.50" font-size="11.00" class="sc-notoserifcjkscbold">（困难变体上的</text><text x="156.64" y="239.50" font-size="11.00" class="sc-lorabold">MSE</text><text x="180.78" y="239.50" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="265.38" font-size="10.00" class="sc-lorabold">LLM</text><text x="101.18" y="265.38" font-size="10.00" class="sc-notoserifcjkscbold">训练</text><text x="121.18" y="262.05" font-size="6.00" class="sc-lorabold">3</text><text x="124.54" y="265.38" font-size="10.00" class="sc-notoserifcjkscbold">（平均加速比）</text><text x="76.75" y="303.52" font-size="9.50" class="sc-notoserifcjkscbold">四足机器人强化学习</text><text x="76.75" y="315.88" font-size="9.50" class="sc-notoserifcjkscbold">（</text><text x="86.25" y="315.88" font-size="9.50" class="sc-lorabold">Quadruped RL</text><text x="151.74" y="315.88" font-size="9.50" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="328.23" font-size="9.50" class="sc-notoserifcjkscbold">（最高分；不提供超参数）</text><text x="76.75" y="349.93" font-size="10.00" class="sc-notoserifcjkscbold">新型编译器（复杂测试上的</text><text x="76.75" y="364.13" font-size="10.00" class="sc-notoserifcjkscbold">通过率）</text><text x="396.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">阈值（等效人类工时）</text><text x="72.00" y="385.29" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.29" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 111.90 115.37 117.74 123.75" y="385.29" font-size="9.00" class="sc-lorabold">2.3.7.A] AI</text><text x="129.60" y="385.29" font-size="9.00" class="sc-notoserifcjkscbold">研发排除性自动化评估汇总表。</text><text x="255.60" y="385.29" font-size="9.00" class="sc-notoserifcjksc">在我们的内部评估套件中，所有近期模型在除一项以外的所有评估上都</text><text x="72.00" y="396.99" font-size="9.00" class="sc-notoserifcjksc">跨越了排除阈值。</text><text x="72.00" y="424.35" font-size="11.00" class="sc-lorabold sc-k">2.3.7.1 LLM</text><text x="130.09" y="424.35" font-size="11.00" class="sc-notoserifcjkscbold">训练任务的重新运行</text><text x="72.00" y="440.54" font-size="11.00" class="sc-notoserifcjksc">在评估过程中，我们发现了一个影响</text><text x="250.89" y="440.54" font-size="11.00" class="sc-loraregular">LLM</text><text x="276.60" y="440.54" font-size="11.00" class="sc-notoserifcjksc">训练（</text><text x="309.60" y="440.54" font-size="11.00" class="sc-loraregular sc-k">LLM training</text><text x="375.55" y="440.54" font-size="11.00" class="sc-notoserifcjksc">）评估所有既往运行的</text><text x="488.44" y="440.54" font-size="11.00" class="sc-loraregular">bug</text><text x="507.49" y="440.54" font-size="11.00" class="sc-notoserifcjksc">。该评</text><text x="72.00" y="456.16" font-size="11.00" class="sc-notoserifcjksc">估衡量的是模型能将一个小型语言模型的训练加速多少。测得的训练时间取决于运行该评估的虚</text><text x="72.00" y="471.78" font-size="11.00" class="sc-notoserifcjksc">拟机的</text><text x="107.89" y="471.78" font-size="11.00" class="sc-loraregular">CPU</text><text x="130.52" y="471.78" font-size="11.00" class="sc-notoserifcjksc">。既往运行并未固定特定的</text><text x="265.41" y="471.78" font-size="11.00" class="sc-loraregular">CPU</text><text x="288.04" y="471.78" font-size="11.00" class="sc-notoserifcjksc">：所用虚拟机可能被分配到几种不同处理器类型中</text><text x="72.00" y="487.40" font-size="11.00" class="sc-notoserifcjksc">的任意一种，因此该评估测得的加速比会随每次运行恰好分配到的硬件而变化。我们已修复该评</text><text x="72.00" y="503.02" font-size="11.00" class="sc-notoserifcjksc">估，使其在单一、固定的</text><text x="195.89" y="503.02" font-size="11.00" class="sc-loraregular">CPU</text><text x="221.41" y="503.02" font-size="11.00" class="sc-notoserifcjksc">配置上运行。</text><text x="287.41" y="503.02" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="315.23" y="503.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="329.12" y="503.02" font-size="11.00" class="sc-loraregular">6</text><text x="338.38" y="503.02" font-size="11.00" class="sc-notoserifcjksc">月，我们在该配置上对所有近期模型重新</text><text x="72.00" y="518.64" font-size="11.00" class="sc-notoserifcjksc">运行了该评估：</text><text x="72.00" y="713.27" font-size="6.00" class="sc-loraregular">3</text><text x="77.97" y="716.60" font-size="10.00" class="sc-notoserifcjksc">我们在发现一个</text><text x="150.60" y="716.60" font-size="10.00" class="sc-loraregular">bug</text><text x="170.55" y="716.60" font-size="10.00" class="sc-notoserifcjksc">后重新运行了该评估。详见第</text><text x="303.18" y="716.60" font-size="10.00" class="sc-loraregular sc-k">2.3.7.1</text><text x="331.62" y="716.60" font-size="10.00" class="sc-notoserifcjksc">节。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 110.02 112.11 117.65 121.12 123.49 128.93 134.36" y="367.92" font-size="9.00" class="sc-lorabold">2.3.7.1.A] LLM</text><text x="145.48" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">训练加速比评估的重新运行。</text><text x="469.48" y="367.92" font-size="9.00" class="sc-loraregular sc-k">2026</text><text x="492.24" y="367.92" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="503.60" y="367.92" font-size="9.00" class="sc-loraregular">6</text><text x="511.17" y="367.92" font-size="9.00" class="sc-notoserifcjksc">月在固</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">定</text><text x="83.37" y="379.62" font-size="9.00" class="sc-loraregular">CPU</text><text x="104.25" y="379.62" font-size="9.00" class="sc-notoserifcjksc">配置上重新运行的结果。每个重新运行值是大约</text><text x="295.61" y="379.62" font-size="9.00" class="sc-loraregular">30</text><text x="308.58" y="379.62" font-size="9.00" class="sc-notoserifcjksc">次独立试验的平均加速比（单次试验加速比</text><text x="481.95" y="379.62" font-size="9.00" class="sc-loraregular">=</text><text x="489.09" y="379.62" font-size="9.00" class="sc-notoserifcjksc">基线训练时</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">间</text><text x="83.37" y="391.33" font-size="9.00" class="sc-loraregular">÷</text><text x="90.50" y="391.33" font-size="9.00" class="sc-notoserifcjksc">模型在通过全部正确性测试的前提下达到的最快时间），并排除了少量无效试验。每个模型按其原始评估日期绘</text><text x="72.00" y="403.02" font-size="9.00" class="sc-notoserifcjksc">制；灰线连接各模型的公布值与重新运行值。</text><text x="252.00" y="403.02" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="322.27" y="403.02" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="333.64" y="403.02" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="405.84" y="403.02" font-size="9.00" class="sc-notoserifcjksc">没有公布值，因此只显示重新运行</text><text x="72.00" y="414.73" font-size="9.00" class="sc-notoserifcjksc">值。对于</text><text x="110.37" y="414.73" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="185.86" y="414.73" font-size="9.00" class="sc-notoserifcjksc">，其系统卡中印出的数值（</text><text x="293.86" y="414.73" font-size="9.00" class="sc-loraregular">16.53×</text><text x="319.24" y="414.73" font-size="9.00" class="sc-notoserifcjksc">）有误；图中显示的是</text><text x="411.61" y="414.73" font-size="9.00" class="sc-loraregular">22.33×</text><text x="438.28" y="414.73" font-size="9.00" class="sc-notoserifcjksc">，即原始分析计算得出的</text><text x="72.00" y="426.42" font-size="9.00" class="sc-notoserifcjksc">数值。</text><text x="72.00" y="486.47" font-size="11.00" class="sc-notoserifcjksc">更新后的结果见图</text><text x="162.89 168.80 171.51 177.63 179.99 184.57 187.28 191.28 193.99" y="486.47" font-size="11.00" class="sc-loraregular">2.3.7.1.A</text><text x="200.88" y="486.47" font-size="11.00" class="sc-notoserifcjksc">。对于公布值来自先前评估流水线的所有模型，重新运行的分数与公布</text><text x="72.00" y="502.09" font-size="11.00" class="sc-notoserifcjksc">值相近或更高。过去一年中该任务表现快速提升的整体图景并未改变。在重新运行中，我们还评</text><text x="72.00" y="517.71" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89" y="517.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="179.89" y="517.71" font-size="11.00" class="sc-notoserifcjksc">，其得分远低于其前代模型</text><text x="314.78" y="517.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="396.31" y="517.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="407.31" y="517.71" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="454.91" y="517.71" font-size="11.00" class="sc-notoserifcjksc">的对话记录显</text><text x="72.00" y="533.33" font-size="11.00" class="sc-notoserifcjksc">示，该模型通常只进行一轮后续优化就停止，并判断结果已足够。它最好的尝试接近</text><text x="481.89" y="533.33" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="548.95" font-size="11.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="118.13" y="548.95" font-size="11.00" class="sc-notoserifcjksc">最好的尝试，这表明该能力是存在的，只是没有那么稳定地发挥出来。但最重要的观察</text><text x="72.00" y="564.57" font-size="11.00" class="sc-notoserifcjksc">是，在修复后的评估上，</text><text x="193.00" y="564.57" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="281.24" y="564.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="295.14" y="564.57" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="418.02" y="564.57" font-size="11.00" class="sc-notoserifcjksc">之间的表现差距现在是中</text><text x="72.00" y="580.19" font-size="11.00" class="sc-notoserifcjksc">等的，这与我们对</text><text x="162.89" y="580.19" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="251.14" y="580.19" font-size="11.00" class="sc-notoserifcjksc">能力的整体评估一致。</text></svg></div>

ll="#ffffff">差异</text><text x="452.64" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="72.00" y="382.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="382.66" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 110.02 112.11 117.65 121.12 123.49 128.93 134.36" y="382.66" font-size="9.00" class="sc-lorabold">2.3.7.1.A] LLM</text><text x="145.48" y="382.66" font-size="9.00" class="sc-notoserifcjkscbold">训练评估汇总表。</text><text x="217.48" y="382.66" font-size="9.00" class="sc-notoserifcjksc">公布值、重新运行值及分数差异。</text><text x="72.00" y="426.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.8</text><text x="105.46" y="426.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="454.15" font-size="11.00" class="sc-loraregular" fill="#0000ff">METR</text><text x="105.78" y="454.15" font-size="11.00" class="sc-notoserifcjksc">依据我们负责任扩展政策和</text><text x="240.67" y="454.15" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="263.24" y="454.15" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="321.13" y="454.15" font-size="11.00" class="sc-loraregular">AI</text><text x="334.59" y="454.15" font-size="11.00" class="sc-notoserifcjksc">研发威胁模型，评估了</text><text x="447.49" y="454.15" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="497.44" y="454.15" font-size="11.00" class="sc-notoserifcjksc">的一个</text><text x="72.00" y="469.77" font-size="11.00" class="sc-notoserifcjksc">预发布快照。</text><text x="138.00" y="469.77" font-size="11.00" class="sc-loraregular">METR</text><text x="171.78" y="469.77" font-size="11.00" class="sc-notoserifcjksc">的测试结果已纳入我们的整体风险评估。</text><text x="72.00" y="518.91" font-size="11.00" class="sc-notoserifcjksc">以下摘自他们的报告：</text><text x="117.75" y="545.10" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="153.64" y="545.10" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="211.49" y="545.10" font-size="11.00" class="sc-notoserifcjksc">进行了初步评估，依据包括：</text><text x="144.75" y="577.48" font-size="11.00" class="sc-notoserifcjksc">通过</text><text x="169.64" y="577.48" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="189.72" y="577.48" font-size="11.00" class="sc-notoserifcjksc">访问开展的能力测试</text><text x="144.75" y="593.68" font-size="11.00" class="sc-notoserifcjksc">关于趋势及先前模型能力的背景信息，尤其是我们近期发布的</text><text x="441.75" y="593.68" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《前沿风险报告》</text><text x="144.75" y="609.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="155.75" y="609.30" font-size="11.00" class="sc-loraregular sc-k">Frontier Risk Report</text><text x="259.12" y="609.30" font-size="11.00" class="sc-notoserifcjksc">）中所报告的内容</text><text x="144.75" y="626.06" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="198.58" y="626.06" font-size="11.00" class="sc-notoserifcjksc">提供的少量关于</text><text x="278.48" y="626.06" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="336.33" y="626.06" font-size="11.00" class="sc-notoserifcjksc">能力的补充信息</text><text x="72.00" y="712.05" font-size="5.40" class="sc-loraregular">4</text><text x="77.29" y="715.05" font-size="9.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="123.82" y="715.05" font-size="9.00" class="sc-notoserifcjksc">系统卡中误印为</text><text x="189.19" y="715.05" font-size="9.00" class="sc-loraregular">16.53×</text><text x="214.57" y="715.05" font-size="9.00" class="sc-notoserifcjksc">；</text><text x="223.57" y="715.05" font-size="9.00" class="sc-loraregular">22.33×</text><text x="252.61" y="715.05" font-size="9.00" class="sc-notoserifcjksc">才是该系统卡自身分析计算得出的数值。</text><a href="https://metr.org/" rel="noopener"><rect x="72.00" y="445.35" width="30.89" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="22.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="584.88" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在能力测试中，我们使用了一组精简的任务，旨在快速给出该模型能力的上界。我们在</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">自己最难的软件任务中选取了</text><text x="263.64" y="98.23" font-size="11.00" class="sc-loraregular">38</text><text x="278.85" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个来运行</text><text x="325.74" y="98.23" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="380.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中包括以研发为核心的任</text><text x="117.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="139.75" y="113.85" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="197.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在这些任务上总体优于</text><text x="310.49" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="433.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一个早期检查点，</text><text x="117.75" y="129.47" font-size="11.00" class="sc-notoserifcjksc">包括成功完成了一些此前我们评估过的任何公开模型都未能解决的任务。不过，我们仍</text><text x="117.75" y="145.09" font-size="11.00" class="sc-notoserifcjksc">观察到该模型偶尔会在困难任务中未能正确理解细致入微的指令。在另一项更具开放性</text><text x="117.75" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的研究任务中，我们还观察到</text><text x="263.64" y="160.71" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="321.49" y="160.71" font-size="11.00" class="sc-notoserifcjksc">在应关注哪些成功指标、应优先考虑哪些信</text><text x="117.75" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们未能借助这些任务给出</text><text x="252.64" y="260.72" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="310.49" y="260.72" font-size="11.00" class="sc-notoserifcjksc">能力的上界；若要仅凭能力测试给出上界，我</text><text x="117.75" y="276.34" font-size="11.00" class="sc-notoserifcjksc">们需要开发更多困难的、达到生产就绪水平的任务。不过，我们的结果与</text><text x="472.64" y="276.34" font-size="11.00" class="sc-loraregular sc-k">[Mythos 5]</text><text x="117.75" y="291.96" font-size="11.00" class="sc-notoserifcjksc">代表一次大致符合趋势的能力进步这一判断相符。</text><text x="359.75" y="291.96" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="413.58" y="291.96" font-size="11.00" class="sc-notoserifcjksc">与我们分享了少量补充证</text><text x="117.75" y="307.58" font-size="11.00" class="sc-notoserifcjksc">据，这些证据表明这一认识是正确的。</text><text x="117.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">根据现有证据，</text><text x="194.75" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">我们认为</text><text x="241.64" y="374.07" font-size="11.00" class="sc-lorabold sc-k">[Mythos 5]</text><text x="301.17" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">很可能无法完全且可靠地自动化跨越数周的前沿</text><text x="117.75" y="389.69" font-size="11.00" class="sc-notoserifcjkscbold">项目的研发工作</text><text x="194.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">。我们认为，若要做出更好、更有把握的评估，需要更多时间、更多评</text><text x="117.75" y="405.31" font-size="11.00" class="sc-notoserifcjksc">估以及来自模型开发者的更多信息。</text><text x="72.00" y="448.83" font-size="11.00" class="sc-notoserifcjksc">我们认为这与我们自己在第</text><text x="206.89" y="448.83" font-size="11.00" class="sc-loraregular">2.3.9</text><text x="233.59" y="448.83" font-size="11.00" class="sc-notoserifcjksc">节中的判定一致。</text><text x="72.00" y="479.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.9</text><text x="105.24" y="479.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="507.45" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00" y="507.45" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="237.24" y="507.45" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="295.14" y="507.45" font-size="11.00" class="sc-loraregular">RSP</text><text x="317.84" y="507.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="331.73" y="507.45" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="354.29" y="507.45" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="412.19" y="507.45" font-size="11.00" class="sc-loraregular">AI</text><text x="425.65" y="507.45" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。与我们</text><text x="72.00" y="523.07" font-size="11.00" class="sc-notoserifcjksc">最近的两次发布（</text><text x="160.00" y="523.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="244.43" y="523.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="258.32" y="523.07" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="303.02" y="523.07" font-size="11.00" class="sc-notoserifcjksc">）不同，</text><text x="347.02" y="523.07" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="435.26" y="523.07" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前</text><text x="72.00" y="538.69" font-size="11.00" class="sc-notoserifcjksc">沿，因此这一判定并不依赖于从能力更强的先前模型继承而来的界限。相反，我们直接对该阈值</text><text x="72.00" y="554.31" font-size="11.00" class="sc-notoserifcjksc">进行了评估。</text><text x="72.00" y="604.60" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与先前模型一样，其中最重要的一项是：我们已在自己的日常工作中</text><text x="72.00" y="620.22" font-size="11.00" class="sc-notoserifcjksc">大量使用</text><text x="118.89" y="620.22" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="204.24" y="620.22" font-size="11.00" class="sc-notoserifcjksc">，而它似乎远不能替代我们的研究科学家和研究工程师，尤其是相对</text><text x="72.00" y="635.84" font-size="11.00" class="sc-notoserifcjksc">资深的人员。此外，无论是</text><text x="206.89" y="635.84" font-size="11.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="281.84" y="635.84" font-size="11.00" class="sc-notoserifcjksc">轨迹，还是我们关于研究加速的内部指标，都未显示</text><text x="72.00" y="651.46" font-size="11.00" class="sc-notoserifcjksc">出可归因于</text><text x="129.89" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="143.36" y="651.46" font-size="11.00" class="sc-notoserifcjksc">的、我们</text><text x="190.25" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="203.71" y="651.46" font-size="11.00" class="sc-notoserifcjksc">进展速度的持续剧烈加速。</text><text x="335.71" y="651.46" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="423.96" y="651.46" font-size="11.00" class="sc-notoserifcjksc">在推进前沿的同时，仍</text><text x="72.00" y="667.08" font-size="11.00" class="sc-notoserifcjksc">符合既定的能力随时间变化趋势。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们将继续寻找自动化驱动的加速的迹象，并预计会继续发布这项工作中的观察结果。</text><text x="72.00" y="148.78" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc">我们的整体对齐风险评估与我们在</text><text x="237.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="248.00" y="175.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="370.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="447.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="461.77" y="175.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus</text><text x="72.00" y="190.96" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.8</text><text x="89.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="122.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc">中报告的结果相比保持不变：</text><text x="265.74" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="345.64" y="190.96" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="472.16" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><text x="72.00" y="238.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="238.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00" y="266.34" font-size="11.00" class="sc-notoserifcjksc">我们对未对齐（</text><text x="149.00" y="266.34" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="218.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc">）风险的背景预期与</text><text x="317.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="328.17" y="266.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="451.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="528.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="281.96" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="281.96" font-size="11.00" class="sc-notoserifcjksc">节中报告的内容基本一致，只有一处例外。</text><text x="296.60" y="281.96" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="373.29" y="281.96" font-size="11.00" class="sc-notoserifcjksc">已全面开放部署，这使另外两条风</text><text x="283.89" y="297.58" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36" y="297.58" font-size="11.00" class="sc-notoserifcjksc">开发者内部的研发，以及破坏主要国家政府内部的</text><text x="72.00" y="313.20" font-size="11.00" class="sc-notoserifcjksc">决策。我们在第</text><text x="151.89" y="313.20" font-size="11.00" class="sc-loraregular">2.4.3</text><text x="178.19" y="313.20" font-size="11.00" class="sc-notoserifcjksc">节中纳入了对这些路径的评估。</text><text x="72.00" y="379.68" font-size="11.00" class="sc-notoserifcjksc">与先前的一些模型一样，技术错误导致</text><text x="261.89" y="379.68" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="350.14" y="379.68" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了意外的思维链（</text><text x="504.14" y="379.68" font-size="11.00" class="sc-loraregular">chain-</text><text x="72.00" y="395.30" font-size="11.00" class="sc-loraregular sc-k">of-thought</text><text x="128.31" y="395.30" font-size="11.00" class="sc-notoserifcjksc">）监督，影响了一小部分回合。</text><text x="72.00" y="428.26" font-size="11.00" class="sc-notoserifcjksc">正如下文及第</text><text x="140.89" y="428.26" font-size="11.00" class="sc-loraregular">6</text><text x="150.14" y="428.26" font-size="11.00" class="sc-notoserifcjksc">节中更详细讨论的，</text><text x="249.14" y="428.26" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="299.10" y="428.26" font-size="11.00" class="sc-notoserifcjksc">在大多数对齐指标上似乎与</text><text x="433.99" y="428.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="481.59" y="428.26" font-size="11.00" class="sc-notoserifcjksc">相当，并略</text><text x="72.00" y="443.88" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="96.89" y="443.88" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="178.59" y="443.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="189.59" y="443.88" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="239.54" y="443.88" font-size="11.00" class="sc-notoserifcjksc">偶尔会为实现用户指定的目标而采取鲁莽或破坏性操作，不过</text><text x="72.00" y="459.50" font-size="11.00" class="sc-notoserifcjksc">完全由模型自主发起的未对齐行为的测量值在绝对意义上较低。与其他近期</text><text x="437.89" y="459.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="476.18" y="459.50" font-size="11.00" class="sc-notoserifcjksc">模型相比，</text><text x="72.00" y="475.12" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="475.12" font-size="11.00" class="sc-notoserifcjksc">在一定程度上更容易受到预填充（</text><text x="317.00" y="475.12" font-size="11.00" class="sc-notoserifcjksc">）攻击，并表现出更高水平的与评分者相关的</text><text x="72.00" y="490.74" font-size="11.00" class="sc-notoserifcjksc">推理和评估意识。在与规避我们安全防护措施相关的评估中，</text><text x="369.00" y="490.74" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="418.95" y="490.74" font-size="11.00" class="sc-notoserifcjksc">似乎并不比此前的模型能</text><text x="72.00" y="506.36" font-size="11.00" class="sc-notoserifcjksc">力更强。</text><text x="72.00" y="573.98" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="573.98" font-size="11.00" class="sc-notoserifcjksc">训练期间所使用的监控，与我们在</text><text x="286.95" y="573.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="297.95" y="573.98" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos Preview</text><text x="382.54" y="573.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="459.54" y="573.98" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="473.43" y="573.98" font-size="11.00" class="sc-loraregular">5.2</text><text x="490.94" y="573.98" font-size="11.00" class="sc-notoserifcjksc">节中所描</text><text x="72.00" y="589.60" font-size="11.00" class="sc-notoserifcjksc">述的类似。我们没有观察到任何明确实例，表明模型采取了具有欺骗性或高度出人意料、且并非</text><text x="72.00" y="605.22" font-size="11.00" class="sc-notoserifcjksc">至少大致以解决当前任务为导向的行动。我们没有观察到任何出现意外连贯目标的迹象。</text><text x="72.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc">根据内部试点使用期间的观察（这些观察借助一个与我们在</text><text x="358.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="369.00" y="654.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos Preview</text><text x="453.59" y="654.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="530.59" y="654.95" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="670.57" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="670.57" font-size="11.00" class="sc-notoserifcjksc">节中所描述的类似的监控系统得出），</text><text x="276.59" y="670.57" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="326.54" y="670.57" font-size="11.00" class="sc-notoserifcjksc">为实现用户指定目标的某种版本而规避限制</text><text x="72.00" y="686.19" font-size="11.00" class="sc-notoserifcjksc">的频率似乎与</text><text x="140.89" y="686.19" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="225.48" y="686.19" font-size="11.00" class="sc-notoserifcjksc">相当。我们在第</text><text x="305.38" y="686.19" font-size="11.00" class="sc-loraregular">6.2.1.2</text><text x="338.56" y="686.19" font-size="11.00" class="sc-notoserifcjksc">节中</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="166.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="166.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="248.00" y="166.54" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="283.40" y="166.54" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="286.29" y="166.54" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="324.46" y="166.54" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="327.35" y="166.54" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="367.99" y="166.54" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="370.88" y="166.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="381.88" y="166.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="381.88" y="166.54" width="11.00" height="11.00" fill="transparent"/></a><a href="htt <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更详细地描述了这些观察：观察到的最令人担忧的行为包括为追求任务成功而规避限制、宽松地</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">解读指令，以及捏造可能与安全相关的信息。我们至少检测到一例</text><text x="391.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="395.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">多智能体地盘争夺战</text><text x="494.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="498.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">共享资源的多个并行智能体为完成各自被分配的数学题而相互采取激进策略。我们的自动化离线</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">监控没有发现任何评估中故意藏拙（</text><text x="248.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">sandbagging</text><text x="312.38" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性欺骗或长程</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">战略性规避监督的实例。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">外部第三方测试发现，对于预填充了旨在破坏研究之行动的任务轨迹，</text><text x="413.00" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="462.95" y="228.34" font-size="11.00" class="sc-notoserifcjksc">继续执行这些轨</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">迹的比率高于此前的模型，详见第</text><text x="239.89" y="243.96" font-size="11.00" class="sc-loraregular">6.2.4</text><text x="266.43" y="243.96" font-size="11.00" class="sc-notoserifcjksc">节。鉴于该评估具有离策略、预填充的性质，我们不认</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">为这具有实际危险性，而且我们在此前模型的预填充评估中也观察到了类似结果。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00" y="325.49" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="176.95" y="325.49" font-size="11.00" class="sc-notoserifcjksc">并不具备比以往模型更强的隐蔽能力。本系统卡第</text><text x="421.84" y="325.49" font-size="11.00" class="sc-loraregular">6.5.4</text><text x="448.46" y="325.49" font-size="11.00" class="sc-notoserifcjksc">节报告了与规避监</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">控相关的能力评估结果。在</text><text x="206.89 213.13 221.71 228.60 236.68 243.30 248.68 255.57 260.25 266.22 272.89" y="341.11" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="281.46" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.36" y="341.11" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="405.53" y="341.11" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="427.53" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="477.48" y="341.11" font-size="11.00" class="sc-notoserifcjksc">的表现低于</text><text x="72.00" y="356.73" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="153.70" y="356.73" font-size="11.00" class="sc-notoserifcjksc">。当使用自动化提示词优化或在成功轨迹上进行监督微调来开展额外的能力激发</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="372.35" font-size="11.00" class="sc-loraregular sc-k">elicitation</text><text x="134.48" y="372.35" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="167.48" y="372.35" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="217.43" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现接近未经额外能力激发的</text><text x="374.32" y="372.35" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="458.91" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现。在第</text><text x="72.00" y="387.97" font-size="11.00" class="sc-loraregular">6.5.4.4</text><text x="107.29" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节的罕见行动评估中，其表现呈现出与此前模型相似的模式。在秘密口令评估的原始存活</text><text x="72.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc">率指标上，</text><text x="127.00" y="403.59" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="176.95" y="403.59" font-size="11.00" class="sc-notoserifcjksc">的表现差于</text><text x="234.84" y="403.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="316.38" y="403.59" font-size="11.00" class="sc-notoserifcjksc">（见第</text><text x="352.27" y="403.59" font-size="11.00" class="sc-loraregular">6.5.4.5</text><text x="387.59" y="403.59" font-size="11.00" class="sc-notoserifcjksc">节），不过当按照是否存在思</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">考或部分轮次预填充对目标模型的轮次进行分组时，</text><text x="325.00" y="419.21" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="374.95" y="419.21" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类型上泄露口令的比率</text><text x="72.00" y="434.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="434.83" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="170.48" y="434.83" font-size="11.00" class="sc-notoserifcjksc">大致相近。</text><text x="72.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">与包括</text><text x="107.89" y="519.79" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在内的此前模型相比，</text><text x="265.49" y="519.79" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="315.44" y="519.79" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了更高水平的与评分者相关的推</text><text x="72.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">理。我们在测试中还观察到更高水平的言语化评估意识（在第</text><text x="371.89" y="535.41" font-size="11.00" class="sc-loraregular">6.2.3.1.5</text><text x="414.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="449.89" y="535.41" font-size="11.00" class="sc-loraregular">6.5.1</text><text x="474.56" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节中讨论）。</text><text x="72.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">这表明，对于该模型而言，与评估意识相关的风险可能高于此前的模型。针对这一风险的主要缓</text><text x="72.00" y="566.65" font-size="11.00" class="sc-notoserifcjksc">解因素包括：在内部试点测试期间没有观察到频繁或新型的令人担忧的行为；在对齐审计中使用</text><text x="72.00" y="582.27" font-size="11.00" class="sc-notoserifcjksc">了真实的沙箱和</text><text x="151.89" y="582.27" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="205.73" y="582.27" font-size="11.00" class="sc-notoserifcjksc">代码库（模型似乎难以将其与真实使用区分开来）；以及真实度引导</text><text x="72.00" y="597.89" font-size="11.00" class="sc-notoserifcjksc">和微调的结果。基于这些证据，我们认为评估意识不太可能显著削弱</text><text x="404.89" y="597.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="454.84" y="597.89" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体</text><text x="72.00" y="613.51" font-size="11.00" class="sc-notoserifcjksc">结论。不过，我们预计评估意识在未来的对齐评估中将继续变得愈发重要，并计划在即将发布的</text><text x="72.00" y="629.13" font-size="11.00" class="sc-notoserifcjksc">一份风险报告中更详细地讨论这些考量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的总体风险评估</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">与我们此前能力最强的模型</text><text x="206.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="329.77" y="111.03" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="362.77" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="451.02" y="111.03" font-size="11.00" class="sc-notoserifcjksc">似乎具备相当（但</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">略强）的能力以及相似的相关对齐属性。</text><text x="270.00" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="319.95" y="126.65" font-size="11.00" class="sc-notoserifcjksc">所观察到的隐蔽能力并不意味着我们对这一评</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">估的信心低于对</text><text x="151.89" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="236.48" y="142.27" font-size="11.00" class="sc-notoserifcjksc">的信心。因此，我们认为</text><text x="360.38" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="410.33" y="142.27" font-size="11.00" class="sc-notoserifcjksc">不会使总体对齐风险显著</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">超出此前在</text><text x="127.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="138.00" y="157.89" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="176.29" y="157.89" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos Preview</text><text x="260.88" y="157.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="337.88" y="157.89" font-size="11.00" class="sc-notoserifcjksc">中所描述的水平。</text><text x="72.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="224.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="171.78" y="224.38" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="204.78" y="224.38" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="254.73" y="224.38" font-size="11.00" class="sc-notoserifcjksc">所基于的底层模型以</text><text x="356.62" y="224.38" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="433.32" y="224.38" font-size="11.00" class="sc-notoserifcjksc">的名义全面开放部</text><text x="72.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">署，因此我们讨论由此次部署带来的两条外部风险路径。我们认为，</text><text x="402.00" y="240.00" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="451.95" y="240.00" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="465.84" y="240.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="255.62" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="255.62" font-size="11.00" class="sc-notoserifcjksc">（我们此前能力最强的全面开放模型）之间的差异不会显著提高来自这些路径的总体风险水</text><text x="72.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">平。</text><text x="72.00" y="319.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.3</text><text x="105.70" y="319.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险路径</text><text x="72.00" y="347.77" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89" y="347.77" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="173.58" y="347.77" font-size="11.00" class="sc-notoserifcjksc">已全面开放发布，我们考虑两条在</text><text x="338.58" y="347.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="349.58" y="347.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="472.47" y="347.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更</text><text x="72.00" y="363.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">新》</text><text x="94.00" y="363.39" font-size="11.00" class="sc-notoserifcjksc">中未讨论的风险路径。就这些风险路径而言，我们关注的是</text><text x="382.89" y="363.39" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="412.41" y="363.39" font-size="11.00" class="sc-notoserifcjksc">的总体行为倾向，它通常</text><text x="72.00" y="379.01" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89" y="379.01" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="135.84" y="379.01" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="149.74" y="379.01" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="197.33" y="379.01" font-size="11.00" class="sc-notoserifcjksc">行为的混合；我们已在</text><text x="310.23" y="379.01" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="357.82" y="379.01" font-size="11.00" class="sc-notoserifcjksc">自己的系统卡中讨论过它在这两种威</text><text x="72.00" y="394.63" font-size="11.00" class="sc-notoserifcjksc">胁模型下的倾向与风险，因此下文聚焦于</text><text x="272.89" y="394.63" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="319.95" y="394.63" font-size="11.00" class="sc-notoserifcjksc">，以评估是否存在特别源于</text><text x="454.84" y="394.63" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="504.79" y="394.63" font-size="11.00" class="sc-notoserifcjksc">行为属</text><text x="72.00" y="410.25" font-size="11.00" class="sc-notoserifcjksc">性、对这些风险路径的新增影响。</text><text x="72.00" y="477.30" font-size="11.00" class="sc-lorabold">2.4.3.1</text><text x="105.09" y="477.30" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="129.98" y="477.30" font-size="11.00" class="sc-lorabold">7</text><text x="237.03" y="477.30" font-size="11.00" class="sc-lorabold">AI</text><text x="251.53" y="477.30" font-size="11.00" class="sc-notoserifcjkscbold">开发者内部破坏研发</text><text x="72.00" y="509.68" font-size="11.00" class="sc-notoserifcjksc">当</text><text x="85.89" y="509.68" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="509.68" font-size="11.00" class="sc-notoserifcjksc">在其他拥有训练前沿</text><text x="226.08" y="509.68" font-size="11.00" class="sc-loraregular">AI</text><text x="239.54" y="509.68" font-size="11.00" class="sc-notoserifcjksc">系统所需资源和基础设施的组织中承担重要研发角色时，许多</text><text x="72.00" y="525.30" font-size="11.00" class="sc-notoserifcjksc">与内部部署相关风险类似的风险同样存在。</text><text x="75.75" y="575.28" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00" y="575.28" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="575.28" font-size="11.00" class="sc-notoserifcjksc">根据第</text><text x="349.89" y="575.28" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="575.28" font-size="11.00" class="sc-notoserifcjksc">节讨论的对齐评估（其中直接涵盖了</text><text x="72.00" y="590.90" font-size="11.00" class="sc-notoserifcjksc">破坏安全研发的机会），</text><text x="193.00" y="590.90" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="281.24" y="590.90" font-size="11.00" class="sc-notoserifcjksc">不太可能具有会在正常情况下导致其尝试破坏研发的</text><text x="72.00" y="606.52" font-size="11.00" class="sc-notoserifcjksc">那类一致目标。它也不太可能具有在我们所测试的那类环境中会导致这种情况的依赖情境的目</text><text x="72.00" y="622.14" font-size="11.00" class="sc-notoserifcjksc">标。尽管如此，当遇到使其偏离典型有用助手行为的异常情境时，它仍有可能偶尔尝试破坏研</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="127.00" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="127.00" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="138.00" y="149.09" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="176.29" y="149.09" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="214.46" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="217.35" y="149.09" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="257.99" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="260.88" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="271.88" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="271.88" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="282.88" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="282.88" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="293.88" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="293.88" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="304.88" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="304.88" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="315.88" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="315.88" y="149.09" width="22.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="338.58" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="338.58" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="349.58" y="338.97" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="384.98" y="338.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="387.88" y="338.97" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="426.05" y="338.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="428.94" y="338.97" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="469.57" y="338.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="472.47" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="483.47" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="483.47" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="494.47" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="494.47" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="505.47" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="505.47" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="516.47" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="516.47" y="338.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="527.47" y="338.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="72.00" y="354.59" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">基于作为自动化行为审计（</text><text x="204.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="344.04" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）一部分开展的几项非常轻量的评估，</text><text x="294.89" y="146.81" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="146.81" font-size="11.00" class="sc-notoserifcjksc">开发者服务，其倾向不会发生重要变化。就个别</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">观察而言，在自动化行为审计测试中，模型往往对</text><text x="316.89" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="370.73" y="162.43" font-size="11.00" class="sc-notoserifcjksc">及其领导层表现出比对其他前沿开</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">发者更正面的看法，不过这尚未达到具有破坏倾向的程度。</text><text x="75.75" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00" y="245.35" font-size="11.00" class="sc-notoserifcjkscbold">有限部署：</text><text x="292.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">来自这条路径的大部分风险集中于其他前沿模型开</text><text x="72.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">发者的使用，因为在这一情境下，模型破坏</text><text x="283.89" y="260.97" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36" y="260.97" font-size="11.00" class="sc-notoserifcjksc">研发最可能增加后续出现显著有害后果的风险。我</text><text x="72.00" y="276.59" font-size="11.00" class="sc-notoserifcjksc">们的服务条款不允许第三方将我们的工具用于这一目的，这限制了该风险的范围；并且截至</text><text x="72.00" y="292.21" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="292.21" font-size="11.00" class="sc-notoserifcjksc">发布时，我们已采取缓解措施（见第</text><text x="289.29" y="292.21" font-size="11.00" class="sc-loraregular">1.5</text><text x="304.89" y="292.21" font-size="11.00" class="sc-notoserifcjksc">节），降低了其他前沿模型开发者使用</text><text x="494.79" y="292.21" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="72.00" y="307.83" font-size="11.00" class="sc-notoserifcjksc">开展重大</text><text x="118.89" y="307.83" font-size="11.00" class="sc-loraregular">AI</text><text x="132.36" y="307.83" font-size="11.00" class="sc-notoserifcjksc">研发工作的动机。</text><text x="75.75" y="376.54" font-size="11.00" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="215.00" y="376.54" font-size="11.00" class="sc-notoserifcjkscbold">监控及相关安全防护措施：</text><text x="347.00" y="376.54" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="371.89" y="376.54" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="425.73" y="376.54" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们对第三</text><text x="72.00" y="392.16" font-size="11.00" class="sc-notoserifcjksc">方部署的监控能力要弱得多。不过，我们仍然认为，迈向重大危害的步骤相当有可能被其运营方</text><text x="72.00" y="407.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="407.78" font-size="11.00" class="sc-loraregular sc-k">operator</text><text x="289.32" y="407.78" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="72.00" y="423.40" font-size="11.00" class="sc-notoserifcjksc">的行动。</text><text x="72.00" y="474.52" font-size="11.00" class="sc-lorabold">2.4.3.2</text><text x="106.49" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="131.38" y="474.52" font-size="11.00" class="sc-lorabold">8</text><text x="137.67" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">：在主要国家政府内部破坏决策</text><text x="72.00" y="506.90" font-size="11.00" class="sc-notoserifcjksc">在主要国家政府内部使用我们的模型会带来一定的对齐风险，尤其是在模型被极其广泛使用的情</text><text x="72.00" y="522.52" font-size="11.00" class="sc-notoserifcjksc">况下。例如，一个未对齐的模型可能处于能够塑造送达重要决策者的信息和观点的位置，或利用</text><text x="72.00" y="538.14" font-size="11.00" class="sc-notoserifcjksc">关键系统中的漏洞造成广泛影响。</text><text x="75.75" y="588.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00" y="588.68" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="588.68" font-size="11.00" class="sc-notoserifcjksc">如第</text><text x="338.89" y="588.68" font-size="11.00" class="sc-loraregular">6</text><text x="348.14" y="588.68" font-size="11.00" class="sc-notoserifcjksc">节所述，我们不认为</text><text x="450.04" y="588.68" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="72.00" y="604.30" font-size="11.00" class="sc-notoserifcjksc">具有会导致其尝试破坏政府决策或运作的连贯目标或倾向。基于作为自动化行为审计一部分开展</text><text x="72.00" y="619.92" font-size="11.00" class="sc-notoserifcjksc">的几项非常轻量的评估，我们预计模型的倾向在政府使用场景中不会发生重要变化。</text><text x="72.00" y="702.86" font-size="11.00" class="sc-notoserifcjksc">然而，我们难以完全排除由第三方对手通过数据投毒蓄意</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">植入的行为后门所带来的风险。迄今为止，我们尚未看到此类攻击的任何成功案例，但由于我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">对政府使用情况的可见性有限，我们更难在足够真实的处境下开展部署前测试，从而难以确信我</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">们能够发现此类由第三方植入后门的行为。</text><text x="75.75" y="164.40" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00" y="164.40" font-size="11.00" class="sc-notoserifcjkscbold">受限的可用手段：</text><text x="325.00" y="164.40" font-size="11.00" class="sc-notoserifcjksc">我们认为，典型的主要国家政府对我们模型</text><text x="72.00" y="180.02" font-size="11.00" class="sc-notoserifcjksc">的使用会比</text><text x="129.89" y="180.02" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="72.00" y="211.26" font-size="11.00" class="sc-notoserifcjksc">相关官员的观点或以其他方式采取高风险行动，恰恰需要这种采用。鉴于</text><text x="426.89" y="211.26" font-size="11.00" class="sc-loraregular">AI</text><text x="440.36" y="211.26" font-size="11.00" class="sc-notoserifcjksc">模型目前在公众中普</text><text x="75.75" y="311.77" font-size="11.00" class="sc-notoserifcjkscbold" fill="#215a6c">弱缓解因素</text><text x="215.00" y="311.77" font-size="11.00" class="sc-notoserifcjkscbold">监控：</text><text x="248.00" y="311.77" font-size="11.00" class="sc-notoserifcjksc">与在</text><text x="272.89" y="311.77" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="326.73" y="311.77" font-size="11.00" class="sc-notoserifcjksc">内部相比，我们对第三方部署的监控能力要</text><text x="72.00" y="391.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.4</text><text x="106.50" y="391.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的总体评估</text><text x="72.00" y="419.79" font-size="11.00" class="sc-notoserifcjksc">基于我们对</text><text x="129.89" y="419.79" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="218.14" y="419.79" font-size="11.00" class="sc-notoserifcjksc">的倾向与能力、我们的监控与安全措施所得出的总体结论，以及上</text><text x="72.00" y="435.41" font-size="11.00" class="sc-notoserifcjksc">文和</text><text x="94.00" y="435.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="105.00" y="435.41" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="227.88" y="435.41" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="304.88" y="435.41" font-size="11.00" class="sc-notoserifcjksc">中给出的分路径分析，我们目前认为，由我们的</text><text x="72.00" y="451.03" font-size="11.00" class="sc-notoserifcjksc">模型所采取的未对齐行为在很大程度上促成的显著有害后果，其风险</text><text x="402.00" y="451.03" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="481.89" y="451.03" font-size="11.00" class="sc-lorabold">Claude</text><text x="72.00" y="466.65" font-size="11.00" class="sc-lorabold sc-k">Mythos Preview</text><text x="159.59" y="466.65" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="94.00" y="426.61" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="94.00" y="426.61" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="105.00" y="426.61" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="140.40" y="426.61" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-repo
