490.97 501.97 512.97 523.97" y="146.81" font-size="11.00" class="sc-notoserifcjksc">密钥以及一个构</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">建问题，并在一个重要的子智能体崩溃时恢复了过来。</text><text x="72.00 77.86 80.43 86.59 89.15 95.17 97.73" y="212.15" font-size="11.00" class="sc-lorabold">2.3.4.2</text><text x="106.49 117.49" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">示例</text><text x="131.38" y="212.15" font-size="11.00" class="sc-lorabold">2</text><text x="137.24 148.24 159.24 170.24 181.24 192.24 203.24 214.24 225.24 236.24" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">：翻译安全评估提示词</text><text x="72.00 83.00 94.00" y="245.36" font-size="11.00" class="sc-notoserifcjkscbold">类别：</text><text x="128.86 139.86 150.86 161.86" y="245.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0a53a8">研究工程</text><text x="72.00 83.00" y="278.56" font-size="11.00" class="sc-notoserifcjksc">一位</text><text x="96.89 103.13 108.81 112.47 118.43 124.51 131.08 136.76 141.44 148.02" y="278.56" font-size="11.00" class="sc-loraregular">Safeguards</text><text x="156.01 167.01 178.01 189.01 200.01 211.01" y="278.56" font-size="11.00" class="sc-notoserifcjksc">团队工程师请</text><text x="224.90 232.59 235.58 241.19 247.76 254.34 260.30 263.19 270.88 277.32 283.89" y="278.56" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="292.75 303.75 314.75 325.75 336.75 347.75 358.75 369.75 380.75 391.75 402.75 413.75 424.75 435.75 446.75 457.75 468.75 479.75 490.75 501.75 512.75 523.75" y="278.56" font-size="11.00" class="sc-notoserifcjksc">运行一个翻译脚本，将一批安全评估提示词翻译成</text><text x="72.00 83.00 94.00 105.00 116.00" y="294.18" font-size="11.00" class="sc-notoserifcjksc">六种语言。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44" y="294.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29" y="294.18" font-size="11.00" class="sc-notoserifcjksc">遇到了一个失效的</text><text x="256.18 263.07 269.68" y="294.18" font-size="11.00" class="sc-loraregular">API</text><text x="276.26 287.26 298.26 309.26 320.26 331.26 342.26 353.26 364.26 375.26 386.26 397.26 408.26 419.26 430.26 441.26 452.26 463.26 474.26 485.26 496.26 507.26 518.26 529.26" y="294.18" font-size="11.00" class="sc-notoserifcjksc">密钥，它调查了其原因，并找到了一个解决方案，一步</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="309.80" font-size="11.00" class="sc-notoserifcjksc">步引导用户完成。</text><text x="160.00 167.69 170.68 176.29 182.86 189.44" y="309.80" font-size="11.00" class="sc-loraregular">Claude</text><text x="198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29" y="309.80" font-size="11.00" class="sc-notoserifcjksc">成功运行了翻译。随后它编写了一个</text><text x="377.18 383.79" y="309.80" font-size="11.00" class="sc-loraregular">PR</text><text x="390.70 401.70 412.70 423.70 434.70 445.70 456.70 467.70 478.70 489.70 500.70 511.70 522.70" y="309.80" font-size="11.00" class="sc-notoserifcjksc">，注册了新的提示词类别并迁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="325.42" font-size="11.00" class="sc-notoserifcjksc">移了认证方式；它还更新了文档，处理了来自代码审查机器人的审查意见，并清理了</text><text x="481.89 488.50" y="325.42" font-size="11.00" class="sc-loraregular">PR</text><text x="498.31 509.31 520.31" y="325.42" font-size="11.00" class="sc-notoserifcjksc">历史。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="391.91" font-size="11.00" class="sc-notoserifcjksc">该会话基本上是成功的，不过存在一些不准确之处。</text> jksc">，尽管在那次运行之后代码还有改动。用户不得不督促</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="438.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29" y="438.77" font-size="11.00" class="sc-notoserifcjksc">实际端到端地运行最终代码。</text><text x="72.00 77.86 80.43 86.59 89.15 95.17 97.73" y="489.06" font-size="11.00" class="sc-lorabold">2.3.4.3</text><text x="106.78 117.78" y="489.06" font-size="11.00" class="sc-notoserifcjkscbold">示例</text><text x="131.68" y="489.06" font-size="11.00" class="sc-lorabold">3</text><text x="137.84 148.84 159.84 170.84 181.84 192.84 203.84 214.84 225.84" y="489.06" font-size="11.00" class="sc-notoserifcjkscbold">：产品工程师为两个</text><text x="239.73 247.30 250.73 256.49 263.29 269.85 275.76 278.66 286.23 292.45 299.01" y="489.06" font-size="11.00" class="sc-lorabold">Claude Code</text><text x="307.82 318.82 329.82 340.82 351.82 362.82 373.82 384.82 395.82 406.82" y="489.06" font-size="11.00" class="sc-notoserifcjkscbold">工具添加选择启用标志</text><text x="72.00 83.00 94.00" y="522.27" font-size="11.00" class="sc-notoserifcjkscbold">类别：</text><text x="128.86 139.86 150.86" y="522.27" font-size="11.00" class="sc-notoserifcjksc" fill="#5a3286">纯工程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 117.98 124.42 130.99" y="555.48" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="139.85 150.85 161.85 172.85 183.85 194.85 205.85 216.85 227.85 238.85 249.85 260.85 271.85 282.85 293.85 304.85 315.85" y="555.48" font-size="11.00" class="sc-notoserifcjksc">团队的一位产品工程师希望探索如何让</text><text x="329.74 338.11 342.80 348.76" y="555.48" font-size="11.00" class="sc-loraregular">Grep</text><text x="358.22" y="555.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="372.11 380.48 383.48 389.91" y="555.48" font-size="11.00" class="sc-loraregular">Glob</text><text x="399.21 410.21 421.21 432.21 443.21" y="555.48" font-size="11.00" class="sc-notoserifcjksc">搜索工具在</text><text x="457.10 463.99 470.01 475.98 482.55 486.81 489.70 495.94 504.03" y="555.48" font-size="11.00" class="sc-loraregular">Agent SDK</text><text x="514.43 525.43" y="555.48" font-size="11.00" class="sc-notoserifcjksc">中变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="571.10" font-size="11.00" class="sc-notoserifcjksc">为选择启用。他们与</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="571.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18" y="571.10" font-size="11.00" class="sc-notoserifcjksc">进行了一次成功的设计讨论，之后</text><text x="380.08 387.77 390.76 396.37 402.93 409.51" y="571.10" font-size="11.00" class="sc-loraregular">Claude</text><text x="418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="571.10" font-size="11.00" class="sc-notoserifcjksc">实现了一个带测试的初始</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="586.72" font-size="11.00" class="sc-notoserifcjksc">版本。随后用户与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="586.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18" y="586.72" font-size="11.00" class="sc-notoserifcjksc">讨论了</text><text x="237.08 245.35 251.78 258.36" y="586.72" font-size="11.00" class="sc-loraregular">Node</text><text x="267.22" y="586.72" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="281.11 287.88 294.44" y="586.72" font-size="11.00" class="sc-loraregular">Bun</text><text x="304.01 315.01 326.01 337.01 348.01 359.01 370.01 381.01 392.01" y="586.72" font-size="11.00" class="sc-notoserifcjksc">运行时的行为差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="636.44" font-size="11.00" class="sc-notoserifcjksc">该会话基本上是成功的：</text><text x="193.00 200.69 203.68 209.29 215.86 222.44" y="636.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29" y="636.44" font-size="11.00" class="sc-notoserifcjksc">对代码库进行了深入的调查，设计了一种连贯的</text><text x="462.29" y="636.44" font-size="11.00" class="sc-loraregular">“</text><text x="466.69 477.69" y="636.44" font-size="11.00" class="sc-notoserifcjksc">混合</text><text x="488.69" y="636.44" font-size="11.00" class="sc-loraregular">”</text><text x="492.53 503.53 514.53 525.53" y="636.44" font-size="11.00" class="sc-notoserifcjksc">方案（针</text><text x="349.89 356.30 362.73 369.17 373.42 378.51 382.77 387.46 393.13" y="652.06" font-size="11.00" class="sc-loraregular">bootstrap</text><text x="402.59 413.59 424.59 435.59 446.59 457.59 468.59 479.59 490.59 501.59 512.59 523.59" y="652.06" font-size="11.00" class="sc-notoserifcjksc">状态和权限设置，编写了回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="667.68" font-size="11.00" class="sc-notoserifcjksc">归测试，运行了类型检查</text><text x="193.00" y="667.68" font-size="11.00" class="sc-loraregular">/</text><text x="200.59 211.59" y="667.68" font-size="11.00" class="sc-notoserifcjksc">测试</text><text x="222.59 230.18 233.17 236.26 242.84" y="667.68" font-size="11.00" class="sc-loraregular">/lint</text><text x="249.99 260.99 271.99 282.99 293.99 304.99 315.99 326.99" y="667.68" font-size="11.00" class="sc-notoserifcjksc">检查，绕过了一个</text><text x="340.88 347.12 353.36" y="667.68" font-size="11.00" class="sc-loraregular">SSH</text><text x="364.83 375.83 386.83 397.83 408.83 419.83" y="667.68" font-size="11.00" class="sc-notoserifcjksc">问题改为通过</text><text x="433.72 442.30 449.34 456.38 463.05" y="667.68" font-size="11.00" class="sc-loraregular">HTTPS</text><text x="472.18 483.18 494.18 505.18 516.18 527.18" y="667.68" font-size="11.00" class="sc-notoserifcjksc">推送，并开启</text><text x="72.00 83.00 94.00" y="683.30" font-size="11.00" class="sc-notoserifcjksc">了一个</text><text x="107.89 114.50" y="683.30" font-size="11.00" class="sc-loraregular">PR</text><text x="121.41 132.41" y="683.30" font-size="11.00" class="sc-notoserifcjksc">。但</text><text x="146.30 153.99 156.99 162.60 169.16 175.74" y="683.30" font-size="11.00" class="sc-loraregular">Claude</text><text x="184.60 195.60 206.60 217.60 228.60 239.60 250.60 261.60 272.60 283.60 294.60 305.60 316.60 327.60 338.60 349.60 360.60 371.60 382.60" y="683.30" font-size="11.00" class="sc-notoserifcjksc">至少做出了一个自信但错误的断言：用户对</text><text x="393.60 398.00 404.23 412.32" y="683.30" font-size="11.00" class="sc-loraregular">“SDK</text><text x="422.72 433.72 444.72 455.72 466.72" y="683.30" font-size="11.00" class="sc-notoserifcjksc">使用方通过</text><text x="480.62 488.89 495.32 501.90" y="683.30" font-size="11.00" class="sc-loraregular">Node</text><text x="510.76" y="683.30" font-size="11.00" class="sc-notoserifcjksc">运</text><text x="72.00 83.00 94.00 105.00" y="698.92" font-size="11.00" class="sc-notoserifcjksc">行，所以</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="151.89 158.24 161.96 166.67 174.26 180.82 186.91 191.59 197.55" y="82.61" font-size="11.00" class="sc-loraregular">bfs/ugrep</text><text x="207.01 218.01 229.01 240.01 251.01" y="82.61" font-size="11.00" class="sc-notoserifcjksc">二进制文件</text><text x="262.01" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="265.85 276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提出了质疑（事实上，</text><text x="375.85 382.09 390.18" y="82.61" font-size="11.00" class="sc-loraregular">SDK</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">二进制文件）。</text><text x="72.00 77.86 80.43 86.59 89.15 95.17 97.73" y="131.19" font-size="11.00" class="sc-lorabold">2.3.4.4</text><text x="106.64 117.64" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">示例</text><text x="131.53" y="131.19" font-size="11.00" class="sc-lorabold">4</text><text x="137.55 148.55 159.55 170.55 181.55 192.55 203.55 214.55 225.55 236.55 247.55 258.55 269.55 280.55 291.55 302.55 313.55 324.55 335.55 346.55 357.55 368.55" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">：仅凭一条提示词构建的加固版智能体评估流水线</text><text x="72.00 83.00 94.00" y="164.40" font-size="11.00" class="sc-notoserifcjkscbold">类别：</text><text x="128.86 139.86" y="164.40" font-size="11.00" class="sc-notoserifcjksc" fill="#11734b">研究</text><text x="442.12 449.81 452.80 458.41 464.97 471.55" y="197.60" font-size="11.00" class="sc-loraregular">Claude</text><text x="480.41 491.41 502.41 513.41 524.41" y="197.60" font-size="11.00" class="sc-notoserifcjksc">在多个会话</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="213.22" font-size="11.00" class="sc-notoserifcjksc">中搭建完成。</text><text x="138.00 145.69 148.68 154.29 160.86 167.44" y="213.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29" y="213.22" font-size="11.00" class="sc-notoserifcjksc">重新接手该流水线，以便在四个模型快照上运行评估。</text><text x="440.29 447.98 450.97 456.58 463.15 469.73" y="213.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="478.58 489.58 500.58 511.58 522.58" y="213.22" font-size="11.00" class="sc-notoserifcjksc">必须找到评</text><text x="305.89 310.15 316.59 322.42 328.38" y="228.84" font-size="11.00" class="sc-loraregular">token</text><text x="335.05 346.05 357.05 368.05 379.05 390.05 401.05 412.05" y="228.84" font-size="11.00" class="sc-notoserifcjksc">、安装一个缺失的</text><text x="425.95 432.51 439.09" y="228.84" font-size="11.00" class="sc-loraregular">pdf</text><text x="445.70 456.70 467.70 478.70 489.70 500.70 511.70 522.70" y="228.84" font-size="11.00" class="sc-notoserifcjksc">渲染器，并处理内</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="244.46" font-size="11.00" class="sc-notoserifcjksc">部模型快照的采样和认证问题。</text><text x="226.00 233.69 236.68 242.29 248.86 255.44" y="244.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29" y="244.46" font-size="11.00" class="sc-notoserifcjksc">成功启动了全部四个实验组，在一次崩溃后添加了</text><text x="509.18 516.07 522.68" y="244.46" font-size="11.00" class="sc-loraregular">API</text><text x="529.26" y="244.46" font-size="11.00" class="sc-notoserifcjksc">错</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 r">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95" y="606.25" font-size="11.00" class="sc-notoserifcjksc">的点估计位于近期前沿模型所描绘的趋势线之上，但高出的程度与</text><text x="443.84 453.78 459.64 463.90 470.49 476.92 482.01 484.91 491.57 496.26 502.17 507.72 510.81 516.73" y="606.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="528.43" y="606.25" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="621.87" font-size="11.00" class="sc-notoserifcjksc">近。这一点值得注意，因为如果在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="621.87" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="621.87" font-size="11.00" class="sc-notoserifcjksc">上观察到的斜率变化是一个加速趋势</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="637.49" font-size="11.00" class="sc-notoserifcjksc">的开端，且复合增益会传导到后续模型中，那么我们会预期</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 409.12 414.98 419.24 425.83 432.26 437.35 440.25" y="637.49" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="449.14" y="637.49" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="463.03 469.91 476.76 484.45" y="637.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="491.02 502.02 513.02 524.02" y="637.49" font-size="11.00" class="sc-notoserifcjksc">进一步偏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="653.11" font-size="11.00" class="sc-notoserifcjksc">离该趋势。然而，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35" y="653.11" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24" y="653.11" font-size="11.00" class="sc-notoserifcjksc">的能力看起来与我们自</text><text x="361.14 369.87 376.44 383.00 388.10 390.99" y="653.11" font-size="11.00" class="sc-loraregular">Opus 3</text><text x="400.01 411.01 422.01 433.01 444.01 455.01 466.01 477.01 488.01 499.01 510.01 521.01" y="653.11" font-size="11.00" class="sc-notoserifcjksc">以来所观察到的同一条前沿</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="668.73" font-size="11.00" class="sc-notoserifcjksc">趋势线所预期的能力提升相符，只是因</text><text x="261.89 271.83 277.69 281.95 288.54 294.97 300.06 302.96 309.62 314.31 320.22 325.77 328.86 334.78" y="668.73" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="346.48 357.48 368.48 379.48 390.48 401.48 412.48 423.48 434.48 445.48 456.48 467.48 478.48 489.48 500.48 511.48 522.48" y="668.73" font-size="11.00" class="sc-notoserifcjksc">的能力跃升而整体上移。因此，我们认</text><text x="72.00" y="684.35" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="684.35" font-size="11.00" class="sc-loraregular">Claude</text><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="479.40" y="376.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="479.40" y="376.96" width="32.21" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="511.60" y="376.96" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="72.00" y="39  143.05 145.41 151.01 157.30" y="490.83" font-size="9.00" class="sc-loraregular">Anthropic ECI</text><text x="160.32 169.32 178.32 187.32 196.32 205.32 214.32 223.32 232.32 241.32 250.32 259.32 268.32 277.32 286.32 295.32 304.32 313.32 322.32 331.32 340.32 349.32" y="490.83" font-size="9.00" class="sc-notoserifcjksc">，以内部基准测试结果为基础，因此其分数无法与</text><text x="360.68 366.22 371.59 376.86 381.65" y="490.83" font-size="9.00" class="sc-loraregular">Epoch</text><text x="389.40 398.40 407.40" y="490.83" font-size="9.00" class="sc-notoserifcjksc">的公开</text><text x="418.77 424.37 430.66" y="490.83" font-size="9.00" class="sc-loraregular">ECI</text><text x="436.04 445.04 454.04 463.04 472.04 481.04 490.04 499.04 508.04 517.04 526.04" y="490.83" font-size="9.00" class="sc-notoserifcjksc">排行榜直接比较。彩色圆</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00" y="502.53" font-size="9.00" class="sc-notoserifcjksc">点为最新的模型。误差线为</text><text x="182.37 185.64 191.23" y="502.53" font-size="9.00" class="sc-loraregular">100</text><text x="199.19" y="502.53" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="210.55 213.57 219.22" y="502.53" font-size="9.00" class="sc-loraregular">IRT</text><text x="227.35 236.35 245.35 254.35" y="502.53" font-size="9.00" class="sc-notoserifcjksc">重拟合的</text><text x="265.72 270.92 275.82" y="502.53" font-size="9.00" class="sc-loraregular">95%</text><text x="286.02 295.02 304.02 313.02 322.02 331.02 340.02 349.02 358.02 367.02 376.02 385.02 394.02 403.02 412.02 421.02 430.02 439.02 448.02 457.02 466.02" y="502.53" font-size="9.00" class="sc-notoserifcjksc">百分位置信区间，每次重拟合均基于随机抽取的</text><text x="477.39 482.45 488.03" y="502.53" font-size="9.00" class="sc-loraregular">80%</text><text x="498.23 507.23 516.23 525.23" y="502.53" font-size="9.00" class="sc-notoserifcjksc">基准测试</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="514.23" font-size="9.00" class="sc-notoserifcjksc">子样本。虚线表示</text><text x="146.37 152.66 155.11 159.70 165.07 170.45 175.33 177.70 185.82 190.62 194.10 199.49 204.76 208.93 211.29 216.75 220.58 225.41 229.96 232.49 237.33" y="514.23" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="246.91 255.91 264.91 273.91 282.91 291.91 300.91 309.91 318.91 327.91" y="514.23" font-size="9.00" class="sc-notoserifcjksc">之前前沿的线性拟合。</text><text x="336.91 343.20 345.65 350.24 355.61 360.99 365.87 368.24 375.38 380.75 386.13 390.29 392.66 397.54 399.46" y="514.23" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="405.98" y="514.23" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="417.35 422.23 424.44" y="514.23" font-size="9.00" class="sc-loraregular">4.8</text><text x="431.87 440.87 449.87 458.87 467.87 476.87 485.87 494.87 503.87 512.86 521.86" y="514.23" font-size="9.00" class="sc-notoserifcjksc">位于同一条趋势线上，而</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 111.05 114.88 119.72 124.26 126.79 131.63" y="525.93" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="141.21" y="525.93" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="152.58 158.87 161.32 165.91 171.28 176.66 181.54 183.91 192.03 196.83 200.31 205.70 210.97 215.14 217.50" y="525.93" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="224.77 233.77 242.77 251.77 260.77 269.77 278.77 287.77 296.77" y="525.93" font-size="9.00" class="sc-notoserifcjksc">则偏离了该趋势线。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="571.18" font-size="11.00" class="sc-notoserifcjksc">请注意，随着新模型的加入，我们会定期更新底层评估数据集，而</text><text x="393.89 400.78 407.62 415.31" y="571.18" font-size="11.00" class="sc-loraregular">AECI</text><text x="421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="571.18" font-size="11.00" class="sc-notoserifcjksc">的每次快照都会在全局</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="586.80" font-size="11.00" class="sc-notoserifcjksc">范围内重新运行</text><text x="151.89 158.74 166.42" y="586.80" font-size="11.00" class="sc-loraregular">ECI</text><text x="173.00 184.00 195.00 206.00 217.00 228.00 239.00 250.00 261.00" y="586.80" font-size="11.00" class="sc-notoserifcjksc">拟合。这意味着新的</text><text x="274.89 281.78 288.62 296.31" y="586.80" font-size="11.00" class="sc-loraregular">AECI</text><text x="302.89 313.89 324.89 335.89 346.89" y="586.80" font-size="11.00" class="sc-notoserifcjksc">数值与以往</text><text x="360.78 367.67 374.51 382.20" y="586.80" font-size="11.00" class="sc-loraregular">AECI</text><text x="388.78 399.78 410.78 421.78 432.78 443.78 454.78 465.78 476.78 487.78 498.78 509.78 520.78" y="586.80" font-size="11.00" class="sc-notoserifcjksc">报告中的数值并不完全一致。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="602.42" font-size="11.00" class="sc-notoserifcjksc">这些偏移完全处于我们所报告的误差线范围之内。</text><text x="72.00 79.46 82.84 90.63 94.01 102.33 105.42 114.73" y="650.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6 AI</text><text x="121.44 134.44 147.44 160.44 173.44 186.44 199.44 212.44 225.44" y="650.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部度量</text><text x="72.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">除</text><text x="85.89 92.74 100.42" y="678.37" font-size="11.00" class="sc-loraregular">ECI</text><text x="107.00 118.00 129.00 140.00 151.00 162.00 173.00 184.00 195.00 206.00 217.00 228.00 239.00 250.00 261.00 272.00 283.00 294.00 305.00 316.00 327.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">轨迹外，我们还维护着一些内部指标，用于衡量</text><text x="340.90 347.78" y="678.37" font-size="11.00" class="sc-loraregular">AI</text><text x="354.36 365.36 376.36 387.36 398.36 409.36 420.36 431.36 442.36 453.36 464.36 475.36 486.36 497.36 508.36 519.36" y="678.37" font-size="11.00" class="sc-notoserifcjksc">辅助在多大程度上加速了我们自身的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="693.99" font-size="11.00" class="sc-notoserifcjksc">研究和工程工作。这些指标将直接的生产力估计与基于使用量和产出的指标结合起来，以反映我</text><text x="72.00 83.00" y="709.61" font-size="11.00" class="sc-notoserifcjksc">们的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研究产出量中有多大比例是由</text><text x="217.89 224.78" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">辅助完成的。出于竞争方面的原因，我们难以完全公开这些内部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">指标，但我们已在</text><text x="160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近期一篇关于递归自我改进（</text><text x="303.00 307.69 313.59 319.45 326.01 330.78 335.87 338.96 344.46 350.42 353.31 358.41 364.37 367.36 370.97 376.35 379.44 389.27 395.84 400.53 406.91 412.41 418.37 428.20 434.16 440.74" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">recursive self-improvement</text><text x="445.00 456.00 467.00 478.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）的文章</text><text x="489.00 500.00 511.00 522.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">中公布了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">其中一部分。根据我们目前对这些指标的解读，</text><text x="303.00 309.89" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="316.46 327.46 338.46 349.46 360.46 371.46 382.46 393.46 404.46 415.46 426.46 437.46 448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="113.85" font-size="11.00" class="sc-notoserifcjksc">辅助正在为我们的工作带来有意义的加速，在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">具体且范围明确的任务上加速幅度相当大，但远未达到可归因于</text><text x="382.89 389.78" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="396.36 407.36 418.36 429.36 440.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的、使我们</text><text x="454.25 461.14" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="467.71 478.71 489.71 500.71 511.71 522.71" y="129.47" font-size="11.00" class="sc-notoserifcjksc">整体进展速度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">持续翻倍的程度。这种加速主要集中在工程执行方面，而非研究判断方面。</text><text x="72.00 79.46 82.84 90.63 94.01" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23 117.23 130.23 143.23 156.23 169.23 182.23" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">以往的系统卡将一套自动化研究任务作为针对</text><text x="294.89 301.78" y="238.38" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36 319.36 330.36 341.36 352.36" y="238.38" font-size="11.00" class="sc-notoserifcjksc">研发能力的</text><text x="363.36" y="238.38" font-size="11.00" class="sc-loraregular">“</text><text x="367.76 378.76 389.76" y="238.38" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="400.76" y="238.38" font-size="11.00" class="sc-loraregular">”</text><text x="404.60 415.60 426.60 437.60 448.60 459.60 470.60 481.60 492.60 503.60 514.60 525.60" y="238.38" font-size="11.00" class="sc-notoserifcjksc">评估进行报告。如果某个模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">型在这些任务上失败，我们就可以确信它缺乏实现有意义的研发加速很可能所需的能力。但</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="269.62" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="269.62" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 222.36 228.22 232.48 239.07 245.50 250.60 253.49 260.16 264.84 270.75 276.30 279.39 285.31" y="269.62" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="297.02" y="269.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.91 318.60 321.59 327.20 333.77 340.35 346.31 349.20 357.93 364.50 371.07 376.16 379.05 385.02 387.37" y="269.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="395.33 406.33 417.33 428.33 439.33 450.33 461.33 472.33 483.33 494.33 505.33 516.33 527.33" y="269.62" font-size="11.00" class="sc-notoserifcjksc">一样，在这些任务中除一项以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">外的所有任务上都超过了人类最高表现阈值。因此，这套任务已不再能提供证据，证明该模型的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">能力低于我们的风险阈值。我们在此报告这些结果，是为了将</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 420.12 425.98 430.24 436.83 443.26 448.35 451.25" y="300.86" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="300.86" font-size="11.00" class="sc-notoserifcjksc">的能力与先前模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">型进行比较，但我们的风险阈值分析已不再依赖这些结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">有关这些评估任务的详细说明，请参见</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.60" y="384.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="347.85 358.85 369.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="380.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="394.74 400.92 403.63" y="384.11" font-size="11.00" class="sc-loraregular">8.3</text><text x="412.65 423.65 434.65 445.65 456.65 467.65 478.65 489.65 500.65 511.65 522.65" y="384.11" font-size="11.00" class="sc-notoserifcjksc">节。在此，我们只纳入一</text><text x="222.61 230.88 237.26 242.76 248.73 251.72 254.61 262.30 268.74 278.57 285.14 288.23 291.22 297.18" y="399.73" font-size="11.00" clas  243.58 250.02 254.86" y="609.30" font-size="11.00" class="sc-loraregular">Frontier Risk Report</text><text x="259.12 270.12 281.12 292.12 303.12 314.12 325.12 336.12" y="609.30" font-size="11.00" class="sc-notoserifcjksc">）中所报告的内容</text><text x="144.75 151.64 158.21 162.47 169.06 173.75 180.18 186.75 189.84" y="626.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="198.58 209.58 220.58 231.58 242.58 253.58 264.58" y="626.06" font-size="11.00" class="sc-notoserifcjksc">提供的少量关于</text><text x="278.48 282.43 292.36 298.22 302.48 309.07 315.50 320.60 323.49 329.48" y="626.06" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="336.33 347.33 358.33 369.33 380.33 391.33 402.33" y="626.06" font-size="11.00" class="sc-notoserifcjksc">能力的补充信息</text><text x="72.00" y="712.05" font-size="5.40" class="sc-loraregular">4</text><text x="77.29 82.40 87.66 93.12 98.59 103.40 106.89 109.25 114.13 116.25" y="715.05" font-size="9.00" class="sc-loraregular">Sonnet 4.6</text><text x="123.82 132.82 141.82 150.82 159.82 168.82 177.82" y="715.05" font-size="9.00" class="sc-notoserifcjksc">系统卡中误印为</text><text x="189.19 192.47 197.67 199.88 204.79 209.80" y="715.05" font-size="9.00" class="sc-loraregular">16.53×</text><text x="214.57" y="715.05" font-size="9.00" class="sc-notoserifcjksc">；</text><text x="223.57 228.40 233.24 235.45 240.46 245.48" y="715.05" font-size="9.00" class="sc-loraregular">22.33×</text><text x="252.61 261.61 270.61 279.61 288.61 297.61 306.61 315.61 324.61 333.61 342.61 351.61 360.61 369.61 378.61 387.61 396.61 405.61" y="715.05" font-size="9.00" class="sc-notoserifcjksc">才是该系统卡自身分析计算得出的数值。</text><a href="https://metr.org/" rel="noopener"><rect x="72.00" y="445.35" width="30.89" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="22.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="584.88" width="0.00" height="11.00" fill="transparent"/ <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在能力测试中，我们使用了一组精简的任务，旨在快速给出该模型能力的上界。我们在</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">自己最难的软件任务中选取了</text><text x="263.64 269.77" y="98.23" font-size="11.00" class="sc-loraregular">38</text><text x="278.85 289.85 300.85 311.85" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个来运行</text><text x="325.74 329.69 339.62 345.48 349.74 356.33 362.76 367.86 370.75 376.75" y="98.23" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中包括以研发为核心的任</text><text x="117.75 128.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="139.75 143.70 153.63 159.50 163.75 170.34 176.78 181.87 184.76 190.76" y="113.85" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="197.60 208.60 219.60 230.60 241.60 252.60 263.60 274.60 285.60 296.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在这些任务上总体优于</text><text x="310.49 318.18 321.17 326.78 333.35 339.93 345.89 348.78 358.72 364.58 368.84 375.43 381.86 386.95 389.85 396.51 401.20 407.11 412.66 415.75 421.67" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="433.37 444.37 455.37 466.37 477.37 488.37 499.37 510.37 521.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一个早期检查点，</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="129.47" font-size="11.00" class="sc-notoserifcjksc">包括成功完成了一些此前我们评估过的任何公开模型都未能解决的任务。不过，我们仍</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="145.09" font-size="11.00" class="sc-notoserifcjksc">观察到该模型偶尔会在困难任务中未能正确理解细致入微的指令。在另一项更具开放性</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的研究任务中，我们还观察到</text><text x="263.64 267.59 277.53 283.39 287.65 294.23 300.67 305.76 308.66 314.65" y="160.71" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="321.49 332.49 343.49 354.49 365.49 376.49 387.49 398.49 409.49 420.49 431.49 442.49 453.49 464.49 475.49 486.49 497.49 508.49 519.49" y="160.71" font-size="11.00" class="sc-notoserifcjksc">在应关注哪些成功指标、应优先考虑哪些信</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们未能借助这些任务给出</text><text x="252.64 256.59 266.53 272.39 276.65 283.23 289.67 294.76 297.66 303.65" y="260.72" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="310.49 321.49 332.49 343.49 354.49 365.49 376.49 387.49 398.49 409.49 420.49 431.49 442.49 453.49 464.49 475.49 486.49 497.49 508.49 519.49" y="260.72" font-size="11.00" class="sc-notoserifcjksc">能力的上界；若要仅凭能力测试给出上界，我</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75" y="276.34" font-size="11.00" class="sc-notoserifcjksc">们需要开发更多困难的、达到生产就绪水平的任务。不过，我们的结果与</text><text x="472.64 476.59 486.52 492.39 496.64 503.23 509.67 514.76 517.65 523.65" y="276.34" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75" y="291.96" font-size="11.00" class="sc-notoserifcjksc">代表一次大致符合趋势的能力进步这一判断相符。</text><text x="359.75 366.64 373.21 377.47 384.06 388.75 395.18 401.75 404.84" y="291.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="413.58 424.58 435.58 446.58 457.58 468.58 479.58 490.58 501.58 512.58 523.58" y="291.96" font-size="11.00" class="sc-notoserifcjksc">与我们分享了少量补充证</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75" y="307.58" font-size="11.00" class="sc-notoserifcjksc">据，这些证据表明这一认识是正确的。</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">根据现有证据，</text><text x="194.75 205.75 216.75 227.75" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">我们认为</text><text x="241.64 245.89 256.21 262.27 266.81 273.64 279.87 285.20 288.10 294.04" y="374.07" font-size="11.00" class="sc-lorabold">[Mythos 5]</text><text x="301.17 312.17 323.17 334.17 345.17 356.17 367.17 378.17 389.17 400.17 411.17 422.17 433.17 444.17 455.17 466.17 477.17 488.17 499.17 510.17 521.17" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">很可能无法完全且可靠地自动化跨越数周的前沿</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75" y="389.69" font-size="11.00" class="sc-notoserifcjkscbold">项目的研发工作</text><text x="194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75 524.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">。我们认为，若要做出更好、更有把握的评估，需要更多时间、更多评</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75" y="405.31" font-size="11.00" class="sc-notoserifcjksc">估以及来自模型开发者的更多信息。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="448.83" font-size="11.00" class="sc-notoserifcjksc">我们认为这与我们自己在第</text><text x="206.89 212.80 215.51 221.63 224.34" y="448.83" font-size="11.00" class="sc-loraregular">2.3.9</text><text x="233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59" y="448.83" font-size="11.00" class="sc-notoserifcjksc">节中的判定一致。</text><text x="72.00 79.46 82.84 90.63 94.01" y="479.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.9</text><text x="105.24 118.24" y="479.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="507.45" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35" y="507.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="237.24 248.24 259.24 270.24 281.24" y="507.45" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="295.14 302.04 308.28" y="507.45" font-size="11.00" class="sc-loraregular">RSP</text><text x="317.84" y="507.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="331.73 337.68 345.37" y="507.45" font-size="11.00" class="sc-loraregular">FCF</text><text x="354.29 365.29 376.29 387.29 398.29" y="507.45" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="412.19 419.07" y="507.45" font-size="11.00" class="sc-loraregular">AI</text><text x="425.65 436.65 447.65 458.65 469.65 480.65 491.65 502.65 513.65 524.65" y="507.45" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。与我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="523.07" font-size="11.00" class="sc-notoserifcjksc">最近的两次发布（</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.11 236.46" y="523.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="244.43" y="523.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="258.32 267.05 273.62 280.19 285.28 288.17 294.13 296.84" y="523.07" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="303.02 314.02 325.02 336.02" y="523.07" font-size="11.00" class="sc-notoserifcjksc">）不同，</text><text x="347.02 354.71 357.70 363.31 369.88 376.46 382.42 385.31 395.25 401.11 405.37 411.95 418.39 423.48 426.38" y="523.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="435.26 446.26 457.26 468.26 479.26 490.26 501.26 512.26 523.26" y="523.07" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="538.69" font-size="11.00" class="sc-notoserifcjksc">沿，因此这一判定并不依赖于从能力更强的先前模型继承而来的界限。相反，我们直接对该阈值</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="554.31" font-size="11.00" class="sc-notoserifcjksc">进行了评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="604.60" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与先前模型一样，其中最重要的一项是：我们已在自己的日常工作中</text><text x="72.00 83.00 94.00 105.00" y="620.22" font-size="11.00" class="sc-notoserifcjksc">大量使用</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="620.22" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24 215.24 226.24 237.24 248.24 259.24 270.24 281.24 292.24 303.24 314.24 325.24 336.24 347.24 358.24 369.24 380.24 391.24 402.24 413.24 424.24 435.24 446.24 457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="620.22" font-size="11.00" class="sc-notoserifcjksc">，而它似乎远不能替代我们的研究科学家和研究工程师，尤其是相对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="635.84" font-size="11.00" class="sc-notoserifcjksc">资深的人员。此外，无论是</text><text x="206.89 213.78 220.36 224.61 231.20 235.89 242.32 248.89 251.98 257.83 260.73 267.57 275.26" y="635.84" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="281.84 292.84 303.84 314.84 325.84 336.84 347.84 358.84 369.84 380.84 391.84 402.84 413.84 424.84 435.84 446.84 457.84 468.84 479.84 490.84 501.84 512.84 523.84" y="635.84" font-size="11.00" class="sc-notoserifcjksc">轨迹，还是我们关于研究加速的内部指标，都未显示</text><text x="72.00 83.00 94.00 105.00 116.00" y="651.46" font-size="11.00" class="sc-notoserifcjksc">出可归因于</text><text x="129.89 136.78" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="143.36 154.36 165.36 176.36" y="651.46" font-size="11.00" class="sc-notoserifcjksc">的、我们</text><text x="190.25 197.14" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="203.71 214.71 225.71 236.71 247.71 258.71 269.71 280.71 291.71 302.71 313.71 324.71" y="651.46" font-size="11.00" class="sc-notoserifcjksc">进展速度的持续剧烈加速。</text><text x="335.71 343.40 346.39 352.00 358.57 365.15 371.11 374.00 383.94 389.80 394.06 400.65 407.08 412.17 415.07" y="651.46" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="423.96 434.96 445.96 456.96 467.96 478.96 489.96 500.96 511.96 522.96" y="651.46" font-size="11.00" class="sc-notoserifcjksc">在推进前沿的同时，仍</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="667.08" font-size="11.00" class="sc-notoserifcjksc">符合既定的能力随时间变化趋势。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们将继续寻找自动化驱动的加速的迹象，并预计会继续发布这项工作中的观察结果。</text><text x="72.00 80.04 83.68" y="148.78" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26 110.26 124.26 138.26 152.26 166.26" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc">我们的整体对齐风险评估与我们在</text><text x="237.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 296.22 302.09 306.34 312.93 319.37 324.46 327.35 334.02 338.71 344.61 350.17 353.26 359.18" y="175.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="370.88 381.88 392.88 403.88 414.88 425.88 436.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="447.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="461.77 469.46 472.46 478.07 484.63 491.21 497.17 500.07 508.80 515.37 521.93" y="175.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus</text><text x="72.00 77.96 80.67" y="190.96" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.8</text><text x="89.74 100.74 111.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="122.74 133.74 144.74 155.74 166.74 177.74 188.74 199.74 210.74 221.74 232.74 243.74 254.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc">中报告的结果相比保持不变：</text><text x="265.74 276.74 287.74 298.74 309.74 320.74 331.74" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="345.64 353.20 356.64 362.40 369.20 375.75 381.67 384.57 394.88 400.94 405.49 412.32 418.54 423.88 426.77 433.80 438.99 444.91 450.83 454.43 460.34" y="190.96" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="472.16 483.16 494.16 505.16 516.16 527.16" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><text x="72.00 79.46 82.84 91.43 94.82" y="238.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61" y="238.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="266.34" font-size="11.00" class="sc-notoserifcjksc">我们对未对齐（</text><text x="149.00 158.83 161.93 167.02 172.69 175.69 178.78 184.86 191.54 201.37 207.33 213.91" y="266.34" font-size="11.00" class="sc-loraregular">misalignment</text><text x="218.17 229.17 240.17 251.17 262.17 273.17 284.17 295.17 306.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc">）风险的背景预期与</text><text x="317.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="328.17 335.86 338.85 344.46 351.03 357.60 363.57 366.46 376.39 382.25 386.51 393.10 399.54 404.63 407.52 414.19 418.87 424.78 430.34 433.43 439.34" y="266.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="451.05 462.05 473.05 484.05 495.05 506.05 517.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="528.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00 78.00 80.70" y="281.96" font- <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更详细地描述了这些观察：观察到的最令人担忧的行为包括为追求任务成功而规避限制、宽松地</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">解读指令，以及捏造可能与安全相关的信息。我们至少检测到一例</text><text x="391.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">多智能体地盘争夺战</text><text x="494.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="498.24 509.24 520.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">共享资源的多个并行智能体为完成各自被分配的数学题而相互采取激进策略。我们的自动化离线</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">监控没有发现任何评估中故意藏拙（</text><text x="248.00 253.09 258.77 265.45 272.02 278.43 284.10 290.18 296.53 299.62 306.30" y="129.47" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="312.38 323.38 334.38 345.38 356.38 367.38 378.38 389.38 400.38 411.38 422.38 433.38 444.38 455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性欺骗或长程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">战略性规避监督的实例。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">外部第三方测试发现，对于预填充了旨在破坏研究之行动的任务轨迹，</text><text x="413.00 422.93 428.80 433.05 439.64 446.08 451.17 454.06" y="228.34" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="228.34" font-size="11.00" class="sc-notoserifcjksc">继续执行这些轨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">迹的比率高于此前的模型，详见第</text><text x="239.89 246.25 248.96 254.86 257.57" y="243.96" font-size="11.00" class="sc-loraregular">6.2.4</text><text x="266.43 277.43 288.43 299.43 310.43 321.43 332.43 343.43 354.43 365.43 376.43 387.43 398.43 409.43 420.43 431.43 442.43 453.43 464.43 475.43 486.43 497.43 508.43 519.43" y="243.96" font-size="11.00" class="sc-notoserifcjksc">节。鉴于该评估具有离策略、预填充的性质，我们不认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">为这具有实际危险性，而且我们在此前模型的预填充评估中也观察到了类似结果。</text><text x="72.00 83.00 94.00 105.00 116.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="325.49" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95" y="325.49" font-size="11.00" class="sc-notoserifcjksc">并不具备比以往模型更强的隐蔽能力。本系统卡第</text><text x="421.84 428.20 430.91 436.90 439.61" y="325.49" font-size="11.00" class="sc-loraregular">6.5.4</text><text x="448.46 459.46 470.46 481.46 492.46 503.46 514.46 525.46" y="325.49" font-size="11.00" class="sc-notoserifcjksc">节报告了与规避监</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">控相关的能力评估结果。在</text><text x="206.89 213.13 221.71 228.60 236.68 243.30 248.68 255.57 260.25 266.22 272.89" y="341.11" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="281.46" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.36 305.45 308.54 315.22 318.31 328.15 333.82 336.81 342.19 348.55 351.64 358.32 364.89 370.72 377.56 383.52 390.20 396.05" y="341.11" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="405.53 416.53" y="341.11" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="427.53 437.46 443.33 447.58 454.17 460.61 465.70 468.59" y="341.11" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="477.48 488.48 499.48 510.48 521.48" y="341.11" font-size="11.00" class="sc-notoserifcjksc">的表现低于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="356.73" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="356.73" font-size="11.00" class="sc-notoserifcjksc">。当使用自动化提示词优化或在成功轨迹上进行监督微调来开展额外的能力激发</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.96 91.95 95.04 100.90 104.16 108.42 114.02 118.28 121.37 127.80" y="372.35" font-size="11.00" class="sc-loraregular">elicitation</text><text x="134.48 145.48 156.48" y="372.35" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="167.48 177.41 183.28 187.53 194.12 200.56 205.65 208.54" y="372.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="217.43 228.43 239.43 250.43 261.43 272.43 283.43 294.43 305.43 316.43 327.43 338.43 349.43 360.43" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现接近未经额外能力激发的</text><text x="374.32 384.26 390.12 394.38 400.97 407.40 412.49 415.39 422.05 426.74 432.65 438.20 441.29 447.21" y="372.35" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="458.91 469.91 480.91 491.91 502.91 513.91" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现。在第</text><text x="72.00 78.36 81.06 87.06 89.76 95.73 98.43" y="387.97" font-size="11.00" class="sc-loraregular">6.5.4.4</text><text x="107.29 118.29 129.29 140.29 151.29 162.29 173.29 184.29 195.29 206.29 217.29 228.29 239.29 250.29 261.29 272.29 283.29 294.29 305.29 316.29 327.29 338.29 349.29 360.29 371.29 382.29 393.29 404.29 415.29 426.29 437.29 448.29 459.29 470.29 481.29 492.29 503.29 514.29 525.29" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节的罕见行动评估中，其表现呈现出与此前模型相似的模式。在秘密口令评估的原始存活</text><text x="72.00 83.00 94.00 105.00 116.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc">率指标上，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="403.59" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95 220.95" y="403.59" font-size="11.00" class="sc-notoserifcjksc">的表现差于</text><text x="234.84 242.53 245.52 251.13 257.70 264.28 270.24 273.14 281.87 288.44 295.00 300.10 302.99 308.95 311.30" y="403.59" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="316.38 327.38 338.38" y="403.59" font-size="11.00" class="sc-notoserifcjksc">（见第</text><text x="352.27 358.63 361.33 367.33 370.03 376.00 378.70" y="403.59" font-size="11.00" class="sc-loraregular">6.5.4.5</text><text x="387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="403.59" font-size="11.00" class="sc-notoserifcjksc">节），不过当按照是否存在思</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">考或部分轮次预填充对目标模型的轮次进行分组时，</text><text x="325.00 334.93 340.80 345.05 351.64 358.08 363.17 366.06" y="419.21" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="419.21" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类型上泄露口令的比率</text><text x="72.00" y="434.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 133.62 138.31 144.21 149.77 152.86 158.78" y="434.83" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="170.48 181.48 192.48 203.48 214.48" y="434.83" font-size="11.00" class="sc-notoserifcjksc">大致相近。</text><text x="72.00 83.00 94.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">与包括</text><text x="107.89 116.63 123.19 129.76 134.85 137.75 143.71 146.42" y="519.79" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49 166.49 177.49 188.49 199.49 210.49 221.49 232.49 243.49 254.49" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在内的此前模型相比，</text><text x="265.49 275.42 281.29 285.54 292.13 298.57 303.66 306.55" y="519.79" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="315.44 326.44 337.44 348.44 359.44 370.44 381.44 392.44 403.44 414.44 425.44 436.44 447.44 458.44 469.44 480.44 491.44 502.44 513.44 524.44" y="519.79" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了更高水平的与评分者相关的推</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">理。我们在测试中还观察到更高水平的言语化评估意识（在第</text><text x="371.89 378.25 380.96 386.86 389.57 395.70 398.40 402.41 405.11" y="535.41" font-size="11.00" class="sc-loraregular">6.2.3.1.5</text><text x="414.00 425.00 436.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="449.89 456.25 458.96 464.95 467.66" y="535.41" font-size="11.00" class="sc-loraregular">6.5.1</text><text x="474.56 485.56 496.56 507.56 518.56 529.56" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节中讨论）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">这表明，对于该模型而言，与评估意识相关的风险可能高于此前的模型。针对这一风险的主要缓</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="566.65" font-size="11.00" class="sc-notoserifcjksc">解因素包括：在内部试点测试期间没有观察到频繁或新型的令人担忧的行为；在对齐审计中使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="582.27" font-size="11.00" class="sc-notoserifcjksc">了真实的沙箱和</text><text x="151.89 158.78 165.36 169.61 176.20 180.89 187.32 193.89 196.98" y="582.27" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="582.27" font-size="11.00" class="sc-notoserifcjksc">代码库（模型似乎难以将其与真实使用区分开来）；以及真实度引导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="597.89" font-size="11.00" class="sc-notoserifcjksc">和微调的结果。基于这些证据，我们认为评估意识不太可能显著削弱</text><text x="404.89 414.83 420.69 424.95 431.53 437.97 443.06 445.96" y="597.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="597.89" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="613.51" font-size="11.00" class="sc-notoserifcjksc">结论。不过，我们预计评估意识在未来的对齐评估中将继续变得愈发重要，并计划在即将发布的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="629.13" font-size="11.00" class="sc-notoserifcjksc">一份风险报告中更详细地讨论这些考量。</text></svg></div>
