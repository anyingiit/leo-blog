<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="72.00 81.18 84.99 95.25 104.99" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53 134.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00 80.04 83.68 88.74 92.08 101.05 109.58" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1 RSP</text><text x="121.42 135.42 149.42 163.42 177.42 191.42" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">风险评估流程</text><text x="72.00 79.46 82.84 87.55 90.93" y="168.90" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.1</text><text x="98.73 111.73 124.73 137.73 150.73 163.73 176.73 189.73 202.73 215.73 228.73 241.73" y="168.90" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险报告与风险评估的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="196.78" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="196.78" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="204.00" y="196.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="215.00 221.83 227.79 232.89 239.45 245.89 252.57 257.66 260.75 267.15 270.14 276.11 279.00 285.24 291.07 296.74 299.73 302.82 309.50 315.58 318.48 325.03 331.47 334.46 337.55 343.35" y="196.78" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="349.16 360.16 371.16 382.16 393.16 404.16 415.16 426.16 437.16 448.16 459.16 470.16 481.16 492.16 503.16" y="196.78" font-size="11.00" class="sc-notoserifcjksc">），我们定期发布全面的风险报告</text><text x="72.00" y="212.40" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.91 93.00 98.09 104.00 106.89 113.72 119.69 126.25 132.69 137.53" y="212.40" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="141.78 152.78 163.78 174.78 185.78 196.78 207.78 218.78 229.78 240.78 251.78 262.78 273.78 284.78 295.78 306.78 317.78 328.78 339.78 350.78 361.78 372.78 383.78 394.78 405.78 416.78 427.78 438.78 449.78 460.78 471.78 482.78 493.78 504.78 515.78 526.78" y="212.40" font-size="11.00" class="sc-notoserifcjksc">），阐述我们模型的安全概况。风险报告阐明了我们对模型能力、威胁模型和风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.02" font-size="11.00" class="sc-notoserifcjksc">缓解措施如何相互关联的分析，从而对我们模型的整体风险水平作出评估。风险报告涵盖发布时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="243.64" font-size="11.00" class="sc-notoserifcjksc">我们的所有模型，并广泛讨论我们的风险缓解措施。我们不一定会随每个模型发布新的风险报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="259.26" font-size="11.00" class="sc-notoserifcjksc">告。不过，我们会随每次主要模型发布公布一份系统卡（</text><text x="347.00 353.18 358.99 364.08 368.34 374.30 384.14 387.03 394.72 400.39 405.08" y="259.26" font-size="11.00" class="sc-loraregular">System Card</text><text x="411.66 422.66 433.66 444.66 455.66 466.66" y="259.26" font-size="11.00" class="sc-notoserifcjksc">）。而且根据</text><text x="480.55 487.46 493.70" y="259.26" font-size="11.00" class="sc-loraregular">RSP</text><text x="500.36 511.36 522.36" y="259.26" font-size="11.00" class="sc-notoserifcjksc">，如果</text><text x="72.00 83.00 94.00 105.00" y="274.88" font-size="11.00" class="sc-notoserifcjksc">某个模型</text><text x="116.00" y="274.88" font-size="11.00" class="sc-loraregular">“</text><text x="120.40 131.40 142.40 153.40" y="274.88" font-size="11.00" class="sc-notoserifcjksc">显著强于</text><text x="164.40 168.24" y="274.88" font-size="11.00" class="sc-loraregular">”“</text><text x="172.64 183.64 194.64 205.64 216.64 227.64 238.64 249.64 260.64 271.64 282.64 293.64 304.64 315.64 326.64" y="274.88" font-size="11.00" class="sc-notoserifcjksc">所有我们已公开分析过风险的模型</text><text x="337.64" y="274.88" font-size="11.00" class="sc-loraregular">”</text><text x="341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="274.88" font-size="11.00" class="sc-notoserifcjksc">，我们必须发布对该模型风险的分析，例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="290.50" font-size="11.00" class="sc-notoserifcjksc">如其能力和倾向如何影响或改变先前的分析。即使并非必需，我们也可能自愿发布此类分析。简</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="306.12" font-size="11.00" class="sc-notoserifcjksc">而言之：风险报告讨论的是在我们全部模型和风险缓解措施条件下的整体风险水平；系统卡讨论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="321.74" font-size="11.00" class="sc-notoserifcjksc">的是某个特定新模型，以及它如何改变（或不改变）我们最新的风险评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="423.47" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估流程始于能力评估，这些评估旨在系统地评估模型相对于我们</text><text x="448.89 454.84 462.53" y="423.47" font-size="11.00" class="sc-loraregular">FCF</text><text x="471.45" y="423.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="485.35 492.26 498.49" y="423.47" font-size="11.00" class="sc-loraregular">RSP</text><text x="508.05 519.05" y="423.47" font-size="11.00" class="sc-notoserifcjksc">中所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="439.09" font-size="11.00" class="sc-notoserifcjksc">述灾难性风险阈值的能力。一般而言，我们会评估多个模型快照，并同时基于生产候选发布模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="454.71" font-size="11.00" class="sc-notoserifcjksc">的能力以及训练期间观察到的趋势作出最终判定。在整个过程中，我们从多个来源收集证据，包</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="470.33" font-size="11.00" class="sc-notoserifcjksc">括自动化评估、能力提升（</text><text x="204.00 210.57 217.13 220.13 223.22 227.07" y="470.33" font-size="11.00" class="sc-loraregular">uplift</text><text x="231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32 374.32" y="470.33" font-size="11.00" class="sc-notoserifcjksc">）试验、第三方专家红队测试（</text><text x="385.32 390.01 395.92 402.50 407.87 412.13 418.07 423.75 433.58 436.67 443.35" y="470.33" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="449.43 460.43 471.43 482.43 493.43 504.43 515.43 526.43" y="470.33" font-size="11.00" class="sc-notoserifcjksc">）和第三方评估。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="553.01" font-size="11.00" class="sc-notoserifcjksc">对于风险报告更新，我们通常遵循与风险报告相同的内部流程。在我们的领域专家记录了他们关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="568.63" font-size="11.00" class="sc-notoserifcjksc">于模型能力的发现和分析后，我们会征求内部反馈。随后，这些材料会提交给负责任扩展官</text><text x="72.00" y="584.25" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="222.41 233.41 244.41 255.41 266.41 277.41 288.41 299.41 310.41 321.41 332.41 343.41 354.41 365.41 376.41 387.41 398.41 409.41 420.41 431.41 442.41 453.41 464.41 475.41 486.41 497.41 508.41 519.41" y="584.25" font-size="11.00" class="sc-notoserifcjksc">），由其最终判定该模型的能力和倾向对最新一份风险报告的分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="599.87" font-size="11.00" class="sc-notoserifcjksc">析有何影响。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="650.16" font-size="11.00" class="sc-notoserifcjksc">在某些情况下，我们可能会判定：尽管该模型超过了我们</text><text x="349.89 356.80 363.04" y="650.16" font-size="11.00" class="sc-loraregular">RSP</text><text x="372.60" y="650.16" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="386.49" y="650.16" font-size="11.00" class="sc-loraregular">1</text><text x="393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39" y="650.16" font-size="11.00" class="sc-notoserifcjksc">节中的某项能力或使用阈值</text><text x="72.00" y="665.78" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="83.00" y="665.78" font-size="11.00" class="sc-loraregular">/</text><text x="90.59 101.59 112.59 123.59" y="665.78" font-size="11.00" class="sc-notoserifcjksc">或我们的</text><text x="137.48 143.43 151.12" y="665.78" font-size="11.00" class="sc-loraregular">FCF</text><text x="160.04 171.04 182.04 193.04 204.04 215.04 226.04 237.04 248.04 259.04 270.04 281.04 292.04 303.04 314.04 325.04 336.04 347.04 358.04 369.04 380.04 391.04 402.04 413.04 424.04 435.04 446.04 457.04 468.04 479.04 490.04 501.04 512.04 523.04" y="665.78" font-size="11.00" class="sc-notoserifcjksc">阈值，但我们已实施了将风险保持在较低水平所需的风险缓解措施。在此类情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="681.40" font-size="11.00" class="sc-notoserifcjksc">况下，我们对是否已越过阈值的分析可能会不那么详细，因为这个问题对我们的整体风险评估所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="697.02" font-size="11.00" class="sc-notoserifcjksc">起的关键支撑作用较小。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="127.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="127.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="138.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="138.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="149.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="149.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="160.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="160.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="171.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="171.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="182.00" y="187.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="182.00" y="187.98" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/c11e84981d0a7281a1b229f3fa6af0da66eaf43f.pdf" rel="noopener"><rect x="193.00" y="187.98" width="0.00" height="11.00" fill <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在本节中，我们提供所有领域的详细结果，并特别关注对我们整体风险评估影响最大的那些评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">估。对于每个威胁模型，我们还会分析新模型如何影响我们最新一份风险报告中提出的风险评</text><text x="72.00 83.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">估。</text><text x="72.00 79.46 82.84 87.55 90.93" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.2</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">发现与结论摘要</text><text x="72.00 77.86 80.43 84.89 87.46 93.32 95.88" y="209.99" font-size="11.00" class="sc-lorabold">2.1.2.1</text><text x="103.24 114.24 125.24 136.24 147.24 158.24 169.24" y="209.99" font-size="11.00" class="sc-notoserifcjkscbold">关于自主性风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="242.38" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="242.38" font-size="11.00" class="sc-lorabold">1</text><text x="156.36 167.36 178.36 189.36 200.36 211.36 222.36 233.36 244.36 255.36 266.36" y="242.38" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="280.25 287.60" y="242.38" font-size="11.00" class="sc-lorabold">AI</text><text x="294.75 305.75 316.75" y="242.38" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="327.75 338.75 349.75 360.75 371.75 382.75 393.75 404.75 415.75 426.75 437.75 448.75 459.75" y="242.38" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="473.64 480.53" y="242.38" font-size="11.00" class="sc-loraregular">AI</text><text x="487.11 498.11 509.11 520.11" y="242.38" font-size="11.00" class="sc-notoserifcjksc">系统：它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="258.00" font-size="11.00" class="sc-notoserifcjksc">们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作能力和使用隐蔽</text><text x="203.51 210.39" y="273.62" font-size="11.00" class="sc-loraregular">AI</text><text x="216.97 227.97 238.97 249.97 260.97 271.97 282.97 293.97 304.97 315.97 326.97 337.97 348.97 359.97 370.97 381.97 392.97 403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97 491.97 502.97 513.97 524.97" y="273.62" font-size="11.00" class="sc-notoserifcjksc">系统有可能（无论是被有意还是无意地引导至这一目标）实施未对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="289.24" font-size="11.00" class="sc-notoserifcjksc">齐行为，从而不可逆地、大幅提高日后发生全球性灾难的几率。</text><text x="380.00" y="285.57" font-size="6.60" class="sc-loraregular">1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="355.72" font-size="11.00" class="sc-notoserifcjksc">自主性威胁模型</text><text x="151.89" y="355.72" font-size="11.00" class="sc-loraregular">1</text><text x="158.79 169.79 180.79" y="355.72" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="194.68 202.37 205.36 210.97 217.54 224.12 230.08 232.97 242.91 248.77 253.03 259.62 266.05 271.14 274.04" y="355.72" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="280.03 291.03 302.03 313.03 324.03 335.03 346.03 357.03 368.03 379.03 390.03 401.03 412.03 423.03 434.03 445.03 456.03 467.03" y="355.72" font-size="11.00" class="sc-notoserifcjksc">，正如它曾适用于我们之前的一些模型。</text><text x="478.03 485.72 488.71 494.32 500.89 507.47" y="355.72" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="371.34" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95" y="371.34" font-size="11.00" class="sc-notoserifcjksc">是我们在自主性相关评估上能力最强的模型，小幅超过</text><text x="388.84 396.53 399.52 405.13 411.70 418.28 424.24 427.13 437.07 442.93 447.19 453.78 460.21 465.30 468.20 474.86 479.55 485.46 491.01 494.10 500.02" y="371.34" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="508.83 519.83" y="371.34" font-size="11.00" class="sc-notoserifcjksc">。我</text><text x="72.00 83.00 94.00 105.00 116.00" y="386.96" font-size="11.00" class="sc-notoserifcjksc">们的对齐（</text><text x="127.00 132.68 135.67 138.76 144.84 151.52 161.35 167.32 173.89" y="386.96" font-size="11.00" class="sc-loraregular">alignment</text><text x="178.15 189.15 200.15 211.15 222.15 233.15 244.15 255.15 266.15 277.15 288.15 299.15 310.15" y="386.96" font-size="11.00" class="sc-notoserifcjksc">）评估表明，它的对齐特性与</text><text x="324.04 331.73 334.72 340.33 346.90 353.48 359.44 362.33 371.07 377.63 384.20 389.29 392.19 398.15 400.86" y="386.96" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="409.93 420.93 431.93 442.93 453.93 464.93" y="386.96" font-size="11.00" class="sc-notoserifcjksc">相当，略弱于</text><text x="478.82 486.51 489.51 495.12 501.68 508.26" y="386.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="402.58" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70 164.70 175.70 186.70 197.70 208.70 219.70 230.70 241.70 252.70 263.70 274.70 285.70 296.70 307.70 318.70 329.70 340.70 351.70 362.70 373.70 384.70 395.70 406.70 417.70 428.70 439.70 450.70 461.70 472.70 483.70 494.70 505.70 516.70 527.70" y="402.58" font-size="11.00" class="sc-notoserifcjksc">，其隐蔽能力并未超过先前模型。我们认为，这并未使该威胁模型下的风险水平</text><text x="72.00 83.00" y="418.20" font-size="11.00" class="sc-notoserifcjksc">超出</text><text x="94.00" y="418.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 153.22 159.09 163.34 169.93 176.37 181.46 184.35 191.02 195.71 201.61 207.17 210.26 216.18" y="418.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="227.88 238.88 249.88 260.88 271.88 282.88 293.88" y="418.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="304.88" y="418.20" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="315.88 322.77 325.76 328.85 334.93 341.61 351.44 357.41 363.98 368.24 371.13 378.04 381.13 386.23 392.13 395.03 403.30 409.87 416.44 422.04 426.30" y="418.20" font-size="11.00" class="sc-loraregular">Alignment Risk Update</text><text x="432.26 443.26 454.26 465.26 476.26 487.26 498.26 509.26 520.26" y="418.20" font-size="11.00" class="sc-notoserifcjksc">）中所评估的水平。</text><text x="72.00 83.00" y="433.82" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="433.82" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="185.14 196.14 207.14 218.14 229.14 240.14 251.14 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14" y="433.82" font-size="11.00" class="sc-notoserifcjksc">的底层模型将带着安全防护措施面向全面开放发布（即</text><text x="452.03 459.72 462.71 468.32 474.89 481.46 487.43 490.32 495.91 501.58 507.99 510.98" y="433.82" font-size="11.00" class="sc-loraregular">Claude Fable</text><text x="72.00" y="449.44" font-size="11.00" class="sc-loraregular">5</text><text x="78.00 88.99 99.99" y="449.44" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="113.89 123.82 129.68 133.94 140.53 146.96 152.06 154.95 161.62 166.30 172.21 177.76 180.86 186.77" y="449.44" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="198.48 209.48 220.48 231.48 242.48 253.48 264.48 275.48 286.48 297.48 308.48 319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48" y="449.44" font-size="11.00" class="sc-notoserifcjksc">相比，有两条额外的风险路径进入考量范围，这与</text><text x="443.37 452.11 458.67 465.24 470.33 473.22 479.19 481.54" y="449.44" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="489.51" y="449.44" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="503.40 512.13 518.70 525.27" y="449.44" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.67" y="465.06" font-size="11.00" class="sc-loraregular">4.8</text><text x="257.64 264.52" y="465.06" font-size="11.00" class="sc-loraregular">AI</text><text x="271.10 282.10 293.10 304.10 315.10 326.10 337.10 348.10 359.10 370.10 381.10 392.10 403.10 414.10 425.10 436.10 447.10 458.10 469.10 480.10 491.10 502.10 513.10 524.10" y="465.06" font-size="11.00" class="sc-notoserifcjksc">开发者内部的研发工作，以及破坏主要国家政府内部的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="480.68" font-size="11.00" class="sc-notoserifcjksc">决策。我们在第</text><text x="151.89 157.80 160.51" y="480.68" font-size="11.00" class="sc-loraregular">2.4</text><text x="169.36 180.36 191.36 202.36 213.36 224.36 235.36 246.36 257.36 268.36 279.36 290.36 301.36 312.36 323.36 334.36 345.36 356.36 367.36 378.36 389.36 400.36 411.36 422.36 433.36 444.36 455.36 466.36 477.36 488.36 499.36 510.36" y="480.68" font-size="11.00" class="sc-notoserifcjksc">节中评估了这些路径，并对我们先前专门开展的对齐风险评估作出总体更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="496.30" font-size="11.00" class="sc-notoserifcjksc">新。我们的总体结论是：由我们模型采取的未对齐行为在很大程度上促成的严重有害后果，其风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="511.92" font-size="11.00" class="sc-notoserifcjksc">险仍然极低，但高于</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25 259.91 264.60 270.51 276.06 279.15 285.07" y="511.92" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="296.77 307.77 318.77 329.77 340.77 351.77" y="511.92" font-size="11.00" class="sc-notoserifcjksc">之前的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="614.80" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="614.80" font-size="11.00" class="sc-lorabold">2</text><text x="157.76 168.76 179.76 190.76 201.76 212.76 223.76 234.76 245.76 256.76 267.76 278.76 289.76 300.76 311.76 322.76 333.76" y="614.80" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域中自动化研发带来的风险。</text><text x="344.76 355.76 366.76 377.76 388.76 399.76 410.76 421.76 432.76 443.76 454.76 465.76 476.76 487.76 498.76 509.76 520.76" y="614.80" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是能够完全自动化或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="630.42" font-size="11.00" class="sc-notoserifcjksc">以其他方式大幅加速</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">1</text><text x="76.81 86.81 96.81 106.81" y="665.40" font-size="10.00" class="sc-notoserifcjksc">请注意：</text><text x="108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00" y="691.20" font-size="10.00" class="sc-notoserifcjksc">该阈值不同于我们</text><text x="188.00 198.00 208.00 218.00 228.00 238.00 248.00" y="691.20" font-size="10.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="260.63 266.00 268.46" y="691.20" font-size="10.00" class="sc-loraregular">2.2</text><text x="276.46 286.46 296.46" y="691.20" font-size="10.00" class="sc-notoserifcjksc">版中的</text><text x="306.46 310.46 316.72 320.07 322.70 328.98 335.93 343.38 348.27 353.69" y="691.20" font-size="10.00" class="sc-loraregular">“AI R&amp;D-4”</text><text x="357.18 367.18 377.18 387.18 397.18 407.18 417.18 427.18 437.18 447.18 457.18 467.18 477.18 487.18 497.18 507.18 517.18 527.18" y="691.20" font-size="10.00" class="sc-notoserifcjksc">阈值。两者在精神上相近，但该阈值经过</text><text x="108.00 118.00 128.00 138.00 148.00 158.00 168.00 178.00 188.00 198.00 208.00 218.00 228.00 238.00 248.00 258.00 268.00 278.00 288.00 298.00 308.00 318.00 328.00 338.00 348.00 358.00 368.00 378.00 388.00 398.00 408.00 418.00 428.00 438.00" y="705.40" font-size="10.00" class="sc-notoserifcjksc">修订，以更好地契合关键威胁模型，并且我们认为它会涵盖若干过去的模型。</text><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="94.00" y="409.40" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="94.00" y="409.40" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rect x="105.00" y="409.40" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/79c2d46d997783b9d2fb3241de43218158e5f25c.pdf" rel="noopener"><rec <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">大型顶尖人类研究团队在某些领域中工作的</text><text x="283.89 290.78" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统，在这些领域中，快速进展可能对国际安全构</text><text x="72.00 83.00 94.00 105.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">成威胁和</text><text x="116.00" y="98.23" font-size="11.00" class="sc-loraregular">/</text><text x="464.10 470.98" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="477.56 488.56 499.56" y="98.23" font-size="11.00" class="sc-notoserifcjksc">本身。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是，自主性威胁模型</text><text x="250.89" y="147.38" font-size="11.00" class="sc-loraregular">2</text><text x="259.69 270.69 281.69 292.69" y="147.38" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="306.59 314.28 317.27 322.88 329.44 336.02 341.98 344.88 354.81 360.67 364.93 371.52 377.95 383.05 385.94" y="147.38" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="391.93 402.93 413.93 424.93 435.93 446.93 457.93 468.93 479.93 490.93 501.93" y="147.38" font-size="11.00" class="sc-notoserifcjksc">。与我们此前的两个模型</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 90.69 93.68 99.29 105.86 112.44 118.40 121.29 130.03 136.59 143.16 148.25 151.15 157.11 159.46" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="167.42" y="163.00" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="181.32 189.01 192.00 197.61 204.18 210.75 216.72 219.61 228.34 234.91 241.48 246.57 249.46 255.43 258.13" y="163.00" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="264.31 275.31 286.31 297.31" y="163.00" font-size="11.00" class="sc-notoserifcjksc">）不同，</text><text x="308.31 316.00 318.99 324.60 331.17 337.75 343.71 346.60 356.54 362.40 366.66 373.25 379.68 384.77 387.67" y="163.00" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="396.55 407.55 418.55 429.55 440.55 451.55 462.55 473.55 484.55 495.55 506.55 517.55 528.55" y="163.00" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前沿，因此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">这一判定并非依赖于从能力更强的先前模型继承而来的界限；我们直接重新评估了该阈值。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的结论基于两项发现。第一，尽管在发布前阶段进行了广泛的内部使用，</text><text x="424.00 431.69 434.68 440.29 446.86 453.44 459.40 462.29 472.22 478.09 482.34 488.93 495.37 500.46 503.35" y="194.24" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="512.24 523.24" y="194.24" font-size="11.00" class="sc-notoserifcjksc">似乎</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">仍远不能替代我们的研究科学家和研究工程师，尤其是相对资深的人员；</text><text x="424.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="437.89 443.80 446.51 452.63 455.34" y="209.86" font-size="11.00" class="sc-loraregular" fill="#1155cc">2.3.3</text><text x="464.36" y="209.86" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="475.36 486.36 497.36 508.36 519.36 530.36" y="209.86" font-size="11.00" class="sc-notoserifcjksc">记录了它相对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="225.48" font-size="11.00" class="sc-notoserifcjksc">于称职的人类研究人员的具体不足。第二，我们没有观察到我们的</text><text x="393.89 400.78" y="225.48" font-size="11.00" class="sc-loraregular">AI</text><text x="407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="225.48" font-size="11.00" class="sc-notoserifcjksc">进展速度出现持续的、可归</text><text x="72.00 83.00" y="241.10" font-size="11.00" class="sc-notoserifcjksc">因于</text><text x="96.89 103.78" y="241.10" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="124.25" y="241.10" font-size="11.00" class="sc-loraregular">2</text><text x="133.05 144.05 155.05 166.05" y="241.10" font-size="11.00" class="sc-notoserifcjksc">倍加速：</text><text x="177.05 184.74 187.73 193.34 199.91 206.49 212.45 215.34 225.27 231.14 235.39 241.98 248.42 253.51 256.40" y="241.10" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="265.29" y="241.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="279.18 286.07 292.65 296.91 303.50 308.18 314.62 321.18 324.27 330.13 333.02 339.86 347.55" y="241.10" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="354.13 365.13 376.13 387.13 398.13 409.13 420.13 431.13 442.13 453.13 464.13 475.13 486.13 497.13 508.13 519.13 530.13" y="241.10" font-size="11.00" class="sc-notoserifcjksc">分数推进了前沿，但其偏离历史能力随</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="256.72" font-size="11.00" class="sc-notoserifcjksc">时间变化趋势的程度与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.91 275.60 281.51 287.06 290.15 296.07" y="256.72" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="307.77 318.77 329.77 340.77 351.77 362.77 373.77 384.77 395.77 406.77 417.77 428.77 439.77 450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="256.72" font-size="11.00" class="sc-notoserifcjksc">相当，这与该威胁模型所关注的复合式加速并不</text><text x="72.00 83.00 94.00 105.00" y="272.34" font-size="11.00" class="sc-notoserifcjksc">一致（见</text><text x="116.00" y="272.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="129.89 135.80 138.51 144.63 147.34" y="272.34" font-size="11.00" class="sc-loraregular" fill="#1155cc">2.3.5</text><text x="156.23" y="272.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="167.23 178.23" y="272.34" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="189.23 199.32 206.17 213.21" y="272.34" font-size="11.00" class="sc-loraregular">METR</text><text x="223.01 234.01 245.01 256.01 267.01 278.01 289.01 300.01 311.01" y="272.34" font-size="11.00" class="sc-notoserifcjksc">进行的外部测试（见</text><text x="322.01" y="272.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="335.90 341.81 344.51 350.64 353.35" y="272.34" font-size="11.00" class="sc-loraregular" fill="#1155cc">2.3.8</text><text x="362.42" y="272.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="373.42 384.42 395.42 406.42 417.42 428.42 439.42 450.42 461.42 472.42 483.42 494.42 505.42 516.42 527.42" y="272.34" font-size="11.00" class="sc-notoserifcjksc">）得出了与这一判定一致的结论。</text><text x="72.00 83.00 94.00" y="287.96" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="105.00" y="287.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">第</text><text x="118.89 124.80 127.51" y="287.96" font-size="11.00" class="sc-loraregular" fill="#1155cc">2.3</text><text x="136.53" y="287.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1155cc">节</text><text x="147.53 158.53 169.53 180.53 191.53 202.53 213.53 224.53 235.53 246.53 257.53 268.53" y="287.96" font-size="11.00" class="sc-notoserifcjksc">中讨论了完整的推理过程。</text><text x="72.00 77.86 80.43 84.89 87.46 93.32 95.88" y="406.45" font-size="11.00" class="sc-lorabold">2.1.2.2</text><text x="104.64 115.64 126.64 137.64 148.64 159.64 170.64 181.64 192.64" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">关于化学与生物风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="195.89" y="438.83" font-size="11.00" class="sc-lorabold">1</text><text x="200.36" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="211.36 218.93 226.20 231.38" y="438.83" font-size="11.00" class="sc-lorabold">CB-1</text><text x="235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85" y="438.83" font-size="11.00" class="sc-notoserifcjkscbold">）：非新型化学／生物武器生产能力。</text><text x="422.85 433.85 444.85 455.85 466.85" y="438.83" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="480.74 487.65 493.88" y="438.83" font-size="11.00" class="sc-loraregular">RSP</text><text x="503.44" y="438.83" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 77.95 85.64" y="454.45" font-size="11.00" class="sc-loraregular">FCF</text><text x="91.67 102.67 113.67 124.67 135.67 146.67 157.67 168.67 179.67 190.67 201.67 212.67 223.67 234.67 245.67 256.67 267.67 278.67 289.67 300.67 311.67 322.67" y="454.45" font-size="11.00" class="sc-notoserifcjksc">，如果模型能够显著帮助具备基础技术背景（例如</text><text x="336.56 342.80 349.84 356.68" y="454.45" font-size="11.00" class="sc-loraregular">STEM</text><text x="369.67 380.67 391.67 402.67 413.67 424.67 435.67 446.67 457.67 468.67 479.67 490.67 501.67 512.67 523.67" y="454.45" font-size="11.00" class="sc-notoserifcjksc">本科学位）的个人或团体制造／获</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">取并部署具有严重灾难性破坏潜力的化学和／或生物武器，则该模型具备</text><text x="426.89 434.58 441.42 446.52" y="470.07" font-size="11.00" class="sc-loraregular">CB-1</text><text x="453.41 464.41 475.41" y="470.07" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="535.99" font-size="11.00" class="sc-notoserifcjksc">很难完全确信地判断模型是否跨越了这一阈值。我们的评估结果与以下情况一致：模型能够提供</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.61" font-size="11.00" class="sc-notoserifcjksc">与这一威胁模型相关的具体、可操作信息，足以为领域专家也节省大量时间；它还能进行与灾难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc">性生物武器开发相关的重要跨领域综合。因此，我们将</text><text x="338.89 346.58 349.57 355.18 361.75 368.33 374.29 377.18 387.12 392.98 397.24 403.83 410.26 415.35 418.25" y="567.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="427.14 438.14 449.14 460.14" y="567.23" font-size="11.00" class="sc-notoserifcjksc">视为具备</text><text x="474.03 481.72 488.56 493.65" y="567.23" font-size="11.00" class="sc-loraregular">CB-1</text><text x="500.55 511.55 522.55" y="567.23" font-size="11.00" class="sc-notoserifcjksc">能力，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc">灾难性风险保持较低水平，但仍不可忽略，原因见我们最新的</text><text x="369.00 380.00 391.00 402.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报告</text><text x="413.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 136.00 144.00 152.00 160.00 168.00 176.00 184.00 192.00 200.00 208.00 216.00 224.00 232.00 237.10 239.38 243.88 248.74 253.70 258.13 259.92 267.92 275.92 283.92 291.92 299.92 307.92 315.92 323.92 331.92 339.92 347.92 355.92 363.92 371.92 379.92 387.92 395.92 403.92 411.92 419.92 427.92 435.92 437.71 442.82 445.09 449.59 454.45 459.41 463.84 465.63 473.63 481.63" y="63.70" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="369.00" y="605.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="369.00" y="605.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="380.00" y="605.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="380.00" y="605.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="391.00" y="605.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="391.00" y="605.29" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="402.00" y="605.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/097c63b5fe7dd8b14866e1f15bb1910ec713658a.pdf" rel="noopener"><rect x="402.00" y="605.29" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">化学与生物武器威胁模型</text><text x="195.89" y="82.61" font-size="11.00" class="sc-lorabold">2</text><text x="201.76" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="212.76 220.32 227.59 232.46" y="82.61" font-size="11.00" class="sc-lorabold">CB-2</text><text x="238.32 249.32 260.32 271.32 282.32 293.32 304.32 315.32 326.32 337.32 348.32 359.32 370.32 381.32 392.32 403.32" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">）：新型化学／生物武器生产能力。</text><text x="414.32 425.32 436.32 447.32 458.32" y="82.61" font-size="11.00" class="sc-notoserifcjksc">根据我们的</text><text x="472.21 479.12 485.36" y="82.61" font-size="11.00" class="sc-loraregular">RSP</text><text x="494.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="508.81 514.76 522.45" y="82.61" font-size="11.00" class="sc-loraregular">FCF</text><text x="528.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">如果模型在功能上能够替代稀缺的人类专业知识，而这种知识目前是开发具有灾难性危害潜力的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">新型化学与生物武器的主要障碍，则该模型具备</text><text x="305.89 313.58 320.42 325.45" y="113.85" font-size="11.00" class="sc-loraregular">CB-2</text><text x="334.25 345.25 356.25 367.25 378.25 389.25 400.25 411.25 422.25 433.25 444.25 455.25 466.25 477.25 488.25 499.25 510.25 521.25" y="113.85" font-size="11.00" class="sc-notoserifcjksc">能力。也就是说，资源充足的团队借助该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">工作原本需要招募少数世界顶尖专家中的一人才能完成。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们的结论是，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35" y="228.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="237.24 248.24 259.24 270.24" y="228.34" font-size="11.00" class="sc-notoserifcjksc">没有跨越</text><text x="284.14 291.82 298.67 303.69" y="228.34" font-size="11.00" class="sc-loraregular">CB-2</text><text x="312.49 323.49 334.49 345.49 356.49 367.49 378.49 389.49 400.49 411.49 422.49 433.49 444.49 455.49 466.49 477.49 488.49 499.49 510.49 521.49" y="228.34" font-size="11.00" class="sc-notoserifcjksc">阈值，但相比先前模型，这一判断远没有那么</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">明确、显而易见。现有证据表明，</text><text x="237.00 246.93 252.80 257.05 263.64 270.08 275.17 278.06" y="243.96" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="243.96" font-size="11.00" class="sc-notoserifcjksc">在开放式构想和从关键错误中恢复方面仍然较弱，尚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">不足以替代大多数形式的世界级人类专业知识；但它很可能加快资源充足的专家团队开发新型生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">物武器的进程，并实质性提高他们的成功概率。我们将在下文第</text><text x="382.89 388.80 391.51 397.41 400.12" y="275.20" font-size="11.00" class="sc-loraregular">2.2.5</text><text x="409.01 420.01 431.01 442.01 453.01 464.01 475.01 486.01 497.01 508.01 519.01 530.01" y="275.20" font-size="11.00" class="sc-notoserifcjksc">节进一步讨论这一阈值分类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">结论背后的理由。</text><text x="72.00 83.00 94.00 105.00 116.00" y="357.87" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="357.87" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95 187.95 198.95 209.95" y="357.87" font-size="11.00" class="sc-notoserifcjksc">尚未达到</text><text x="223.84 230.75 236.99 243.65 246.55 252.68 255.38" y="357.87" font-size="11.00" class="sc-loraregular">RSP 3.3</text><text x="264.40 275.40" y="357.87" font-size="11.00" class="sc-notoserifcjksc">版及</text><text x="289.29 295.25 302.93" y="357.87" font-size="11.00" class="sc-loraregular">FCF</text><text x="311.86 322.86 333.86 344.86 355.86 366.86 377.86 388.86 399.86 410.86 421.86 432.86 443.86 454.86 465.86 476.86 487.86 498.86 509.86 520.86" y="357.87" font-size="11.00" class="sc-notoserifcjksc">中规定的具体阈值。不过，我们仍然担忧它在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc">此类别带来的风险，并认为在少数领域，现在可能已经能够替代世界级人类专家。为缓解这些风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="389.11" font-size="11.00" class="sc-notoserifcjksc">险，我们在发布</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 195.77 201.45 207.85 210.84 216.80 219.70" y="389.11" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="228.59 239.59 250.59 261.59 272.59 283.59 294.59 305.59 316.59 327.59 338.59 349.59 360.59 371.59 382.59 393.59 404.59 415.59 426.59 437.59 448.59 459.59 470.59 481.59 492.59 503.59 514.59 525.59" y="389.11" font-size="11.00" class="sc-notoserifcjksc">时加入了新的分类器，限制用户访问生物学前沿研究能力。触发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="404.73" font-size="11.00" class="sc-notoserifcjksc">这些分类器时，用户将回退（</text><text x="215.00 218.72 224.39 227.39 230.38 236.78 242.46 248.31" y="404.73" font-size="11.00" class="sc-loraregular">fallback</text><text x="254.21 265.21 276.21 287.21 298.21" y="404.73" font-size="11.00" class="sc-notoserifcjksc">）到最新的</text><text x="312.11 319.80 322.79 328.40 334.97 341.54 347.51 350.40 359.13 365.70 372.27" y="404.73" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="380.25 391.25 402.25 413.25 424.25 435.25 446.25 457.25 468.25 479.25 490.25 501.25 512.25 523.25" y="404.73" font-size="11.00" class="sc-notoserifcjksc">模型。同时，我们正在推出一项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="420.35" font-size="11.00" class="sc-notoserifcjksc">可信访问计划，使通过审核、具有明确有益用途的用户能够使用</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 431.12 436.98 441.24 447.83 454.26 459.35 462.25" y="420.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="471.14 482.14 493.14 504.14 515.14 526.14" y="420.35" font-size="11.00" class="sc-notoserifcjksc">的生物学相关</text><text x="72.00 83.00 94.00" y="435.97" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">我们判断，相比没有这些安全防护措施的</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 316.77 322.45 328.85 331.84 337.80 340.70" y="503.60" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="349.59 360.59 371.59 382.59 393.59 404.59 415.59 426.59 437.59 448.59 459.59 470.59 481.59 492.59 503.59 514.59 525.59" y="503.60" font-size="11.00" class="sc-notoserifcjksc">部署，这些缓解措施显著降低了此威胁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">模型带来的风险，并保留了现有的</text><text x="239.89 246.78 253.02 258.93 264.05" y="519.22" font-size="11.00" class="sc-loraregular" fill="#0000ff">ASL-3</text><text x="273.07 284.07 295.07 306.07" y="519.22" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">安全控制</text><text x="317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="519.22" font-size="11.00" class="sc-notoserifcjksc">；但我们认为，如果技术高度成熟、资源充足</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">的国家级威胁行为者执意尝试，其获得未受防护的</text><text x="316.89 326.83 332.69 336.95 343.54 349.97 355.06 357.96" y="534.84" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="534.84" font-size="11.00" class="sc-notoserifcjksc">生物学能力（例如通过窃取模型权</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">重）的可能性可能相当大。我们目前没有评估认为这些行为者正在优先开展此类尝试，也没有认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="566.08" font-size="11.00" class="sc-notoserifcjksc">为此类访问的风险高于市场上其他已全面开放的模型；我们针对此威胁模型的防护措施仍在积极</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="581.70" font-size="11.00" class="sc-notoserifcjksc">开发中。我们计划在即将发布的一份风险报告中，更详细地讨论该威胁模型的残余风险及缓解措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="597.32" font-size="11.00" class="sc-notoserifcjksc">施的影响。总体而言，我们认为开发和部署该模型带来的新型化学与生物武器生产方面的灾难性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="612.94" font-size="11.00" class="sc-notoserifcjksc">风险较低，但高于任何先前模型，而且存在显著不确定性。</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 136.00 144.00 152.00 160.00 168.00 176.00 184.00 192.00 200.00 208.00 216.00 224.00 232.00 237.10 239.38 243.88 248.74 253.70 258.13 259.92 267.92 275.92 283.92 291.92 299.92 307.92 315.92 323.92 331.92 339.92 347.92 355.92 363.92 371.92 379.92 387.92 395.92 403.92 411.92 419.92 427.92 435.92 437.71 442.82 445.09 449.59 454.45 459.41 463.84 465.63 473.63 481.63" y="63.70" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本页部分段落涉及化学与生物风险，Claude 无法翻译，译文由项目发起人另行翻译提供，未经 Claude 审校。</text><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="239.89" y="510.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="239.89" y="510.42" width="30.28" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="270.18" y="510.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="273.07" y="510.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="284.07" y="510.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="284.07" y="510.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="295.07" y="510.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="295.07" y="510.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="306.07" y="510.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/activating-asl3-protections" rel="noopener"><rect x="306.07" y="510.42" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00 80.04 83.68" y="84.20" font-size="14.00" class="sc-poppinssemibold">2.2</text><text x="95.04 109.04 123.04 137.04 151.04 165.04 179.04 193.04 207.04" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">化学与生物风险评估</text><text x="72.00 79.46 82.84 90.30 93.68" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48 114.48 127.48 140.48 153.48 166.48 179.48" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="149.19" font-size="11.00" class="sc-notoserifcjksc">我们主要关注后果最严重的化学与生物风险。我们研究的不是单次提示与响应的威胁模型，而是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="164.81" font-size="11.00" class="sc-notoserifcjksc">行为者能否在引发此类风险所需的漫长、多步骤任务中获得帮助。我们评估的过程知识密集、技</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="180.43" font-size="11.00" class="sc-notoserifcjksc">能密集、容易失败，而且往往存在许多瓶颈。新型化学武器和生物武器的生产过程不仅具有上述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="196.05" font-size="11.00" class="sc-notoserifcjksc">所有瓶颈，还会面临研发过程中可能出现的额外瓶颈。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="278.72" font-size="11.00" class="sc-notoserifcjksc">我们在多个模型快照上运行了评估，其中包括移除了无害性安全防护措施的仅有用版本</text><text x="72.00" y="294.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.59 95.55 98.54 105.06 108.77 115.34 118.33 123.71 130.15 136.82 139.76 145.57 148.46 153.96 159.92 164.69 169.78 172.87 179.30" y="294.34" font-size="11.00" class="sc-loraregular">helpful-only version</text><text x="185.98 196.98 207.98 218.98 229.98 240.98 251.98" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）。红队测试（</text><text x="262.98 267.67 273.58 280.15 285.53 289.79 295.73 301.41 311.24 314.33 321.01" y="294.34" font-size="11.00" class="sc-loraregular">red-teaming</text><text x="327.09 338.09 349.09 360.09 371.09 382.09 393.09" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）、能力提升（</text><text x="404.09 410.66 417.22 420.22 423.31 427.16" y="294.34" font-size="11.00" class="sc-loraregular">uplift</text><text x="431.41 442.41 453.41 464.41 475.41 486.41 497.41 508.41 519.41" y="294.34" font-size="11.00" class="sc-notoserifcjksc">）试验以及我们的自</text><text x="72.00 83.00" y="309.96" font-size="11.00" class="sc-notoserifcjksc">动化</text><text x="96.89 104.58 111.42 116.52" y="309.96" font-size="11.00" class="sc-loraregular">CB-1</text><text x="123.41 134.41 145.41 156.41 167.41 178.41 189.41 200.41 211.41 222.41 233.41 244.41 255.41 266.41" y="309.96" font-size="11.00" class="sc-notoserifcjksc">评估使用了较早的仅有用版本。</text><text x="277.41" y="306.29" font-size="6.60" class="sc-loraregular">2</text><text x="283.85 294.85 305.85 316.85 327.85 338.85" y="309.96" font-size="11.00" class="sc-notoserifcjksc">我们的自动化</text><text x="352.74 360.43 367.28 372.30" y="309.96" font-size="11.00" class="sc-loraregular">CB-2</text><text x="381.10 392.10 403.10 414.10 425.10 436.10 447.10 458.10 469.10 480.10 491.10 502.10 513.10 524.10" y="309.96" font-size="11.00" class="sc-notoserifcjksc">评估和有益桌面推演不容易出现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="325.58" font-size="11.00" class="sc-notoserifcjksc">因拒绝导致的表现不佳，因此在最终版</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25" y="325.58" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="325.58" font-size="11.00" class="sc-notoserifcjksc">上运行。我们观察到，仅有用模型变体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="341.20" font-size="11.00" class="sc-notoserifcjksc">在少量两用或有害生物学任务中表现出考虑拒绝或降低表现的倾向；如第</text><text x="426.89 433.25 435.96 441.95 444.66" y="341.20" font-size="11.00" class="sc-loraregular">6.5.2</text><text x="453.46 464.46 475.46 486.46 497.46 508.46 519.46" y="341.20" font-size="11.00" class="sc-notoserifcjksc">节所述，我们认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="356.82" font-size="11.00" class="sc-notoserifcjksc">为这不会显著影响本节的结论。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="424.45" font-size="11.00" class="sc-notoserifcjksc">我们通过多种方式测量了模型能否替代专业知识，以及／或者能否实质性加速专家研究。我们的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="440.07" font-size="11.00" class="sc-notoserifcjksc">评估组合包括：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="473.02" font-size="11.00" class="sc-notoserifcjkscbold">专家红队测试与能力提升试验。</text><text x="226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="473.02" font-size="11.00" class="sc-notoserifcjksc">内部和外部领域专家小组对模型进行了探测，覆盖生物武器与化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="488.64" font-size="11.00" class="sc-notoserifcjksc">学武器开发的整个流水线，依据标准化评分细则评定能力提升程度与可行性，重点考察模型能否</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="504.26" font-size="11.00" class="sc-notoserifcjksc">替代稀缺的专业知识。灾难性生物学场景能力提升试验（</text><text x="347.00" y="504.26" font-size="11.00" class="sc-loraregular">5</text><text x="355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89" y="504.26" font-size="11.00" class="sc-notoserifcjksc">个三人团队，每队由一名生物学博</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="519.88" font-size="11.00" class="sc-notoserifcjksc">士、一名行动专家和一名大语言模型（</text><text x="259.00 265.36 271.72" y="519.88" font-size="11.00" class="sc-loraregular">LLM</text><text x="281.81 292.81 303.81 314.81 325.81 336.81 347.81 358.81 369.81 380.81 391.81 402.81 413.81 424.81 435.81 446.81 457.81 468.81 479.81 490.81 501.81 512.81" y="519.88" font-size="11.00" class="sc-notoserifcjksc">）资深用户组成）和新型化学毒剂能力提升试验（</text><text x="523.81" y="519.88" font-size="11.00" class="sc-loraregular">7</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="535.50" font-size="11.00" class="sc-notoserifcjksc">名可使用模型的化学博士与</text><text x="206.89" y="535.50" font-size="11.00" class="sc-loraregular">3</text><text x="215.91 226.91 237.91 248.91 259.91 270.91 281.91 292.91 303.91 314.91 325.91 336.91 347.91 358.91 369.91 380.91 391.91 402.91 413.91 424.91 435.91 446.91 457.91 468.91 479.91 490.91 501.91 512.91 523.91" y="535.50" font-size="11.00" class="sc-notoserifcjksc">名只能使用互联网的化学博士，各自独立开展工作）检验了同一问</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="551.12" font-size="11.00" class="sc-notoserifcjksc">题，产出依据相同的能力提升评分细则进行评估，并由外部领域专家独立评分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="634.95" font-size="11.00" class="sc-notoserifcjkscbold">有益红队桌面推演。</text><text x="171.00 182.00 193.00 204.00" y="634.95" font-size="11.00" class="sc-notoserifcjksc">该评估将</text><text x="217.89" y="634.95" font-size="11.00" class="sc-loraregular">6</text><text x="227.14 238.14 249.14 260.14 271.14 282.14 293.14 304.14 315.14 326.14 337.14 348.14 359.14 370.14 381.14 392.14 403.14 414.14 425.14 436.14 447.14 458.14 469.14 480.14 491.14 502.14 513.14" y="634.95" font-size="11.00" class="sc-notoserifcjksc">名博士级生物学家与专门的大语言模型专家配对，要求他们在</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">2</text><text x="77.85 87.85 97.85 107.85 117.85 127.85 137.85 147.85 157.85 167.85 177.85 187.85 197.85 207.85 217.85 227.85 237.85 247.85 257.85" y="703.80" font-size="10.00" class="sc-notoserifcjksc">我们没有直接比较这一仅有用版本与最终版</text><text x="270.48 277.47 280.19 285.29 291.26 297.24 302.66 305.29 314.32 319.65 323.52 329.51 335.36 339.99 342.62" y="703.80" font-size="10.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.70 360.70 370.70 380.70 390.70 400.70 410.70 420.70 430.70 440.70 450.70 460.70 470.70 480.70 490.70 500.70 510.70 520.70 530.70" y="703.80" font-size="10.00" class="sc-notoserifcjksc">的表现，但预计二者与风险相关的能力大致</text><text x="72.00 82.00 92.00" y="718.00" font-size="10.00" class="sc-notoserifcjksc">相近。</text><text x="72.00 80.00 88.00 96.00 104.00 112.00 120.00 128.00 132.44 134.66 139.10 140.90 148.90 156.90 164.90 172.90 180.90 188.90 196.90 204.90 212.90 220.90 228.90 236.90 244.90 252.90 260.90 268.90 276.90 284.90 292.90 300.90 308.90 316.90 324.90 332.90 340.90 348.90 356.90 364.90 372.90 380.90 382.69 387.79 390.06 394.57 399.42 404.38 408.82 410.61 418.61 426.61" y="103.20" font-size="8.00" class="sc-notosanscjksc" fill="#8a6d3b">【译注】本节（2.2 节）译文由项目发起人另行翻译提供，经脚本格式检查后排入，未经 Claude 审校。</text></svg></div>
