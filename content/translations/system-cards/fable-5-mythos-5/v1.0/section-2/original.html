de</text><text x="478.58" y="213.22" font-size="11.00" class="sc-notoserifcjksc">必须找到评</text><text x="305.89 310.15 316.59 322.42 328.38" y="228.84" font-size="11.00" class="sc-loraregular">token</text><text x="335.05" y="228.84" font-size="11.00" class="sc-notoserifcjksc">、安装一个缺失的</text><text x="425.95" y="228.84" font-size="11.00" class="sc-loraregular">pdf</text><text x="445.70" y="228.84" font-size="11.00" class="sc-notoserifcjksc">渲染器，并处理内</text><text x="72.00" y="244.46" font-size="11.00" class="sc-notoserifcjksc">部模型快照的采样和认证问题。</text><text x="226.00 233.69 236.68 242.29 248.86 255.44" y="244.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="264.29" y="244.46" font-size="11.00" class="sc-notoserifcjksc">成功启动了全部四个实验组，在一次崩溃后添加了</text><text x="509.18 516.07 522.68" y="244.46" font-size="11.00" class="sc-loraregular">API</text><text x="529.26" y="244.46" font-size="11.00" class="sc-notoserifcjksc">错</text><text x="72.00" y="260.08" font-size="11.00" class="sc-notoserifcjksc">误处理，处理了一个后台安全发现，并生成了一份关于将此评估的扩展工作自动化的提案。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="275.70" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="275.70" font-size="11.00" class="sc-notoserifcjksc">唯一明显的错误是用</text><text x="212.18" y="275.70" font-size="11.00" class="sc-loraregular">`pkill`</text><text x="242.17" y="275.70" font-size="11.00" class="sc-notoserifcjksc">命令杀死了它自己的</text><text x="344.06" y="275.70" font-size="11.00" class="sc-loraregular">shell</text><text x="367.69" y="275.70" font-size="11.00" class="sc-notoserifcjksc">（它在下一轮中就恢复了过来）。</text><text x="72.00" y="357.87" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5 AECI</text><text x="138.39" y="357.87" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="385.76" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 179.57 187.26" y="385.76" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="190.94" y="385.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="385.76" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="385.76" font-size="11.00" class="sc-notoserifcjksc">）来追踪能力随时间提升的速率，它是</text><text x="416.94 423.70 430.27 436.70 442.56 449.15 452.04 458.92" y="385.76" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="465.50" y="385.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="479.40 486.16 492.73 499.16 505.02" y="385.76" font-size="11.00" class="sc-loraregular" fill="#0000ff">Epoch</text><text x="72.00 79.69 85.37 91.93 97.61 104.01 107.10 110.09 113.36 117.62 120.71 126.67 131.76 134.66 138.25 144.93 151.51 157.42" y="401.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">Capabilities Index</text><text x="166.14" y="401.38" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本。完整方法请参见</text><text x="334.03 341.72 344.71 350.32 356.89 363.47 369.43 372.32 382.25 388.12 392.37 398.96 405.40 410.49 413.38 420.05 424.74 430.64 436.20 439.29 445.21" y="401.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="456.91" y="401.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="489.91" y="401.38" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="503.81 509.71 512.42 518.55 521.14" y="401.38" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="72.00" y="417.00" font-size="11.00" class="sc-notoserifcjksc">节。斜率比仅基于前沿模型计算；由于</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25" y="417.00" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.14" y="417.00" font-size="11.00" class="sc-notoserifcjksc">推进了前沿，它作为一个新的前沿点进</text><text x="72.00" y="432.62" font-size="11.00" class="sc-notoserifcjksc">入该分析，这与</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04 226.00 228.35" y="432.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="236.32" y="432.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="250.21 257.90 260.89 266.50 273.07 279.65 285.61 288.50 297.24 303.80 310.37 315.46 318.36 324.32 327.02" y="432.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="72.00" y="448.24" font-size="11.00" class="sc-notoserifcjksc">绘制的，没有改变斜率比。</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 121.25 127.31 131.85 138.68 144.91 150.24 153.14" y="499.10" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="161.97" y="499.10" font-size="11.00" class="sc-notoserifcjkscbold">推进了前沿，但它偏离历史能力随时间变化趋势的程度与</text><text x="439.86 447.43 450.86 456.63 463.42 469.98 475.90 478.79 489.11 495.17 499.71 506.54 512.77" y="499.10" font-size="11.00" class="sc-lorabold">Claude Mythos</text><text x="72.00 79.03 84.22 90.14 96.06 99.65 105.57" y="514.72" font-size="11.00" class="sc-lorabold">Preview</text><text x="117.39" y="514.72" font-size="11.00" class="sc-notoserifcjkscbold">相近，这并不表明存在进一步的加速。</text><text x="304.39 312.08 315.07 320.68 327.24 333.82 339.78 342.68 352.61 358.47 362.73 369.32 375.75 380.85 383.74" y="514.72" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="392.63" y="514.72" font-size="11.00" class="sc-notoserifcjksc">的点估计为</text><text x="450.52" y="514.72" font-size="11.00" class="sc-lorabold">161.29</text><text x="72.00" y="530.34" font-size="11.00" class="sc-lorabold">AECI</text><text x="98.04" y="530.34" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="109.04 115.37 121.31 131.26 134.15 138.40 142.86 148.80 153.27 155.83 161.99 167.85 170.60 173.50 177.96 184.29 190.23 192.79 198.95 204.91" y="530.34" font-size="11.00" class="sc-lorabold">95% [157.32, 165.39]</text><text x="209.16" y="530.34" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="220.16" y="530.34" font-size="11.00" class="sc-lorabold">n=67</text><text x="244.49" y="530.34" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="255.49" y="530.34" font-size="11.00" class="sc-notoserifcjksc">。这是我们已发布或评估过的所有模型中最高的，高于在</text><text x="72.00" y="545.96" font-size="11.00" class="sc-notoserifcjksc">任何</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.91 187.60 193.51 199.06 202.15 208.07" y="545.96" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="219.77" y="545.96" font-size="11.00" class="sc-notoserifcjksc">快照上测得的最高分数（</text><text x="340.77 347.66 354.50 362.19 365.88 368.77 374.60 377.49 381.50 387.49 393.67 396.38 402.74 406.74 409.63 413.34 417.34 423.34 429.70 432.40 436.41 442.59 445.36 448.25 452.26 458.62 464.52 467.23 473.41 479.18" y="545.96" font-size="11.00" class="sc-loraregular">AECI = 158.91 [156.19, 162.84]</text><text x="483.14" y="545.96" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="606.25" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="606.25" font-size="11.00" class="sc-notoserifcjksc">的点估计位于近期前沿模型所描绘的趋势线之上，但高出的程度与</text><text x="443.84 453.78 459.64 463.90 470.49 476.92 482.01 484.91 491.57 496.26 502.17 507.72 510.81 516.73" y="606.25" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="528.43" y="606.25" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="621.87" font-size="11.00" class="sc-notoserifcjksc">近。这一点值得注意，因为如果在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.91 330.60 336.51 342.06 345.15 351.07" y="621.87" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="362.77" y="621.87" font-size="11.00" class="sc-notoserifcjksc">上观察到的斜率变化是一个加速趋势</text><text x="72.00" y="637.49" font-size="11.00" class="sc-notoserifcjksc">的开端，且复合增益会传导到后续模型中，那么我们会预期</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 409.12 414.98 419.24 425.83 432.26 437.35 440.25" y="637.49" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="449.14" y="637.49" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="463.03" y="637.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="491.02" y="637.49" font-size="11.00" class="sc-notoserifcjksc">进一步偏</text><text x="72.00" y="653.11" font-size="11.00" class="sc-notoserifcjksc">离该趋势。然而，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35" y="653.11" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="248.24" y="653.11" font-size="11.00" class="sc-notoserifcjksc">的能力看起来与我们自</text><text x="361.14" y="653.11" font-size="11.00" class="sc-loraregular">Opus 3</text><text x="400.01" y="653.11" font-size="11.00" class="sc-notoserifcjksc">以来所观察到的同一条前沿</text><text x="72.00" y="668.73" font-size="11.00" class="sc-notoserifcjksc">趋势线所预期的能力提升相符，只是因</text><text x="261.89 271.83 277.69 281.95 288.54 294.97 300.06 302.96 309.62 314.31 320.22 325.77 328.86 334.78" y="668.73" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="346.48" y="668.73" font-size="11.00" class="sc-notoserifcjksc">的能力跃升而整体上移。因此，我们认</text><text x="72.00" y="684.35" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="684.35" font-size="11.00" class="sc-loraregular">Claude</text><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="479.40" y="376.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="479.40" y="376.96" width="32.21" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="511.60" y="376.96" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="72.00" y="392.58" width="59.76" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="131.76" y="392.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2512.00193" rel="noopener"><rect x="134.66" y="392.58" width="28.59" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="334.03" y="392.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="334.03" y="392.58" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="369.43" y="392.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="372.32" y="392.58" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="410.49" y="392.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="413.39" y="392.58" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="456.91" y="392.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="456.91" y="392.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="467.91" y="392.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="467.91" y="392.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="478.91" y="392.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="478.91" y="392.58" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">46</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的表现与自主性威胁模型</text><text x="245.84" y="82.61" font-size="11.00" class="sc-loraregular">2</text><text x="254.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">所描述的那种复合式加速不相符。</text><text x="72.00" y="479.13" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="479.13" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 113.36 116.84 119.21 124.72 130.13 135.23 139.89 145.48 147.84 154.04 158.75 164.16 168.88 174.03 176.98 179.78 182.69 186.41 189.35 194.19 198.56 200.93 204.31 210.05 215.42 220.26" y="479.13" font-size="9.00" class="sc-lorabold">2.3.5.A] Epoch Capabilities Index</text><text x="225.19" y="479.13" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="234.19" y="479.13" font-size="9.00" class="sc-loraregular">ECI</text><text x="249.09" y="479.13" font-size="9.00" class="sc-notoserifcjksc">）将许多基准测试上的表现综合为每个模型的一个数值。我们版本的该指</text><text x="72.00" y="490.83" font-size="9.00" class="sc-notoserifcjksc">标，即</text><text x="101.37 107.00 112.38 115.87 121.26 125.09 130.36 135.73 138.26 143.05 145.41 151.01 157.30" y="490.83" font-size="9.00" class="sc-loraregular">Anthropic ECI</text><text x="160.32" y="490.83" font-size="9.00" class="sc-notoserifcjksc">，以内部基准测试结果为基础，因此其分数无法与</text><text x="360.68 366.22 371.59 376.86 381.65" y="490.83" font-size="9.00" class="sc-loraregular">Epoch</text><text x="389.40" y="490.83" font-size="9.00" class="sc-notoserifcjksc">的公开</text><text x="418.77" y="490.83" font-size="9.00" class="sc-loraregular">ECI</text><text x="436.04" y="490.83" font-size="9.00" class="sc-notoserifcjksc">排行榜直接比较。彩色圆</text><text x="72.00" y="502.53" font-size="9.00" class="sc-notoserifcjksc">点为最新的模型。误差线为</text><text x="182.37" y="502.53" font-size="9.00" class="sc-loraregular">100</text><text x="199.19" y="502.53" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="210.55" y="502.53" font-size="9.00" class="sc-loraregular">IRT</text><text x="227.35" y="502.53" font-size="9.00" class="sc-notoserifcjksc">重拟合的</text><text x="265.72" y="502.53" font-size="9.00" class="sc-loraregular">95%</text><text x="286.02" y="502.53" font-size="9.00" class="sc-notoserifcjksc">百分位置信区间，每次重拟合均基于随机抽取的</text><text x="477.39" y="502.53" font-size="9.00" class="sc-loraregular">80%</text><text x="498.23" y="502.53" font-size="9.00" class="sc-notoserifcjksc">基准测试</text><text x="72.00" y="514.23" font-size="9.00" class="sc-notoserifcjksc">子样本。虚线表示</text><text x="146.37 152.66 155.11 159.70 165.07 170.45 175.33 177.70 185.82 190.62 194.10 199.49 204.76 208.93 211.29 216.75 220.58 225.41 229.96 232.49 237.33" y="514.23" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="246.91" y="514.23" font-size="9.00" class="sc-notoserifcjksc">之前前沿的线性拟合。</text><text x="336.91 343.20 345.65 350.24 355.61 360.99 365.87 368.24 375.38 380.75 386.13 390.29 392.66 397.54 399.46" y="514.23" font-size="9.00" class="sc-loraregular">Claude Opus 4.7</text><text x="405.98" y="514.23" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="417.35" y="514.23" font-size="9.00" class="sc-loraregular">4.8</text><text x="431.87" y="514.23" font-size="9.00" class="sc-notoserifcjksc">位于同一条趋势线上，而</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 111.05 114.88 119.72 124.26 126.79 131.63" y="525.93" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="141.21" y="525.93" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="152.58 158.87 161.32 165.91 171.28 176.66 181.54 183.91 192.03 196.83 200.31 205.70 210.97 215.14 217.50" y="525.93" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="224.77" y="525.93" font-size="9.00" class="sc-notoserifcjksc">则偏离了该趋势线。</text><text x="72.00" y="571.18" font-size="11.00" class="sc-notoserifcjksc">请注意，随着新模型的加入，我们会定期更新底层评估数据集，而</text><text x="393.89" y="571.18" font-size="11.00" class="sc-loraregular">AECI</text><text x="421.89" y="571.18" font-size="11.00" class="sc-notoserifcjksc">的每次快照都会在全局</text><text x="72.00" y="586.80" font-size="11.00" class="sc-notoserifcjksc">范围内重新运行</text><text x="151.89" y="586.80" font-size="11.00" class="sc-loraregular">ECI</text><text x="173.00" y="586.80" font-size="11.00" class="sc-notoserifcjksc">拟合。这意味着新的</text><text x="274.89" y="586.80" font-size="11.00" class="sc-loraregular">AECI</text><text x="302.89" y="586.80" font-size="11.00" class="sc-notoserifcjksc">数值与以往</text><text x="360.78" y="586.80" font-size="11.00" class="sc-loraregular">AECI</text><text x="388.78" y="586.80" font-size="11.00" class="sc-notoserifcjksc">报告中的数值并不完全一致。</text><text x="72.00" y="602.42" font-size="11.00" class="sc-notoserifcjksc">这些偏移完全处于我们所报告的误差线范围之内。</text><text x="72.00" y="650.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6 AI</text><text x="121.44" y="650.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部度量</text><text x="72.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">除</text><text x="85.89" y="678.37" font-size="11.00" class="sc-loraregular">ECI</text><text x="107.00" y="678.37" font-size="11.00" class="sc-notoserifcjksc">轨迹外，我们还维护着一些内部指标，用于衡量</text><text x="340.90" y="678.37" font-size="11.00" class="sc-loraregular">AI</text><text x="354.36" y="678.37" font-size="11.00" class="sc-notoserifcjksc">辅助在多大程度上加速了我们自身的</text><text x="72.00" y="693.99" font-size="11.00" class="sc-notoserifcjksc">研究和工程工作。这些指标将直接的生产力估计与基于使用量和产出的指标结合起来，以反映我</text><text x="72.00" y="709.61" font-size="11.00" class="sc-notoserifcjksc">们的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研究产出量中有多大比例是由</text><text x="217.89" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="231.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">辅助完成的。出于竞争方面的原因，我们难以完全公开这些内部</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">指标，但我们已在</text><text x="160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">近期一篇关于递归自我改进（</text><text x="303.00 307.69 313.59 319.45 326.01 330.78 335.87 338.96 344.46 350.42 353.31 358.41 364.37 367.36 370.97 376.35 379.44 389.27 395.84 400.53 406.91 412.41 418.37 428.20 434.16 440.74" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">recursive self-improvement</text><text x="445.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）的文章</text><text x="489.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">中公布了</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">其中一部分。根据我们目前对这些指标的解读，</text><text x="303.00" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="316.46" y="113.85" font-size="11.00" class="sc-notoserifcjksc">辅助正在为我们的工作带来有意义的加速，在</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">具体且范围明确的任务上加速幅度相当大，但远未达到可归因于</text><text x="382.89" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="396.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的、使我们</text><text x="454.25" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="467.71" y="129.47" font-size="11.00" class="sc-notoserifcjksc">整体进展速度</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">持续翻倍的程度。这种加速主要集中在工程执行方面，而非研究判断方面。</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">以往的系统卡将一套自动化研究任务作为针对</text><text x="294.89" y="238.38" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="238.38" font-size="11.00" class="sc-notoserifcjksc">研发能力的</text><text x="363.36" y="238.38" font-size="11.00" class="sc-loraregular">“</text><text x="367.76" y="238.38" font-size="11.00" class="sc-notoserifcjksc">排除性</text><text x="400.76" y="238.38" font-size="11.00" class="sc-loraregular">”</text><text x="404.60" y="238.38" font-size="11.00" class="sc-notoserifcjksc">评估进行报告。如果某个模</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">型在这些任务上失败，我们就可以确信它缺乏实现有意义的研发加速很可能所需的能力。但</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="269.62" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="269.62" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 222.36 228.22 232.48 239.07 245.50 250.60 253.49 260.16 264.84 270.75 276.30 279.39 285.31" y="269.62" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="297.02" y="269.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="310.91 318.60 321.59 327.20 333.77 340.35 346.31 349.20 357.93 364.50 371.07 376.16 379.05 385.02 387.37" y="269.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="395.33" y="269.62" font-size="11.00" class="sc-notoserifcjksc">一样，在这些任务中除一项以</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">外的所有任务上都超过了人类最高表现阈值。因此，这套任务已不再能提供证据，证明该模型的</text><text x="72.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">能力低于我们的风险阈值。我们在此报告这些结果，是为了将</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 420.12 425.98 430.24 436.83 443.26 448.35 451.25" y="300.86" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="460.14" y="300.86" font-size="11.00" class="sc-notoserifcjksc">的能力与先前模</text><text x="72.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">型进行比较，但我们的风险阈值分析已不再依赖这些结果。</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">有关这些评估任务的详细说明，请参见</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.00 338.60" y="384.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="347.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="380.85" y="384.11" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="394.74" y="384.11" font-size="11.00" class="sc-loraregular">8.3</text><text x="412.65" y="384.11" font-size="11.00" class="sc-notoserifcjksc">节。在此，我们只纳入一</text><text x="222.61 230.88 237.26 242.76 248.73 251.72 254.61 262.30 268.74 278.57 285.14 288.23 291.22 297.18" y="399.73" font-size="11.00" class="sc-loraregular">Novel Compiler</text><text x="301.94" y="399.73" font-size="11.00" class="sc-notoserifcjksc">），以及分数无上限的任务，因为其他采用有上</text><text x="72.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">限</text><text x="85.89 89.51 96.34 102.83 106.69" y="415.35" font-size="11.00" class="sc-loraregular">[0–1]</text><text x="113.54" y="415.35" font-size="11.00" class="sc-notoserifcjksc">分数的任务已无法区分近几代模型。</text><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="160.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="160.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.co erifcjkscbold">（平均加速比）</text><text x="76.75" y="303.52" font-size="9.50" class="sc-notoserifcjkscbold">四足机器人强化学习</text><text x="76.75" y="315.88" font-size="9.50" class="sc-notoserifcjkscbold">（</text><text x="86.25" y="315.88" font-size="9.50" class="sc-lorabold">Quadruped RL</text><text x="151.74" y="315.88" font-size="9.50" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="328.23" font-size="9.50" class="sc-notoserifcjkscbold">（最高分；不提供超参数）</text><text x="76.75" y="349.93" font-size="10.00" class="sc-notoserifcjkscbold">新型编译器（复杂测试上的</text><text x="76.75" y="364.13" font-size="10.00" class="sc-notoserifcjkscbold">通过率）</text><text x="396.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">阈值（等效人类工时）</text><text x="72.00" y="385.29" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="385.29" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 111.90 115.37 117.74 123.75" y="385.29" font-size="9.00" class="sc-lorabold">2.3.7.A] AI</text><text x="129.60" y="385.29" font-size="9.00" class="sc-notoserifcjkscbold">研发排除性自动化评估汇总表。</text><text x="255.60" y="385.29" font-size="9.00" class="sc-notoserifcjksc">在我们的内部评估套件中，所有近期模型在除一项以外的所有评估上都</text><text x="72.00" y="396.99" font-size="9.00" class="sc-notoserifcjksc">跨越了排除阈值。</text><text x="72.00 77.86 80.43 86.59 88.83 93.30 95.86 100.32 103.22 109.86 116.51" y="424.35" font-size="11.00" class="sc-lorabold">2.3.7.1 LLM</text><text x="130.09" y="424.35" font-size="11.00" class="sc-notoserifcjkscbold">训练任务的重新运行</text><text x="72.00" y="440.54" font-size="11.00" class="sc-notoserifcjksc">在评估过程中，我们发现了一个影响</text><text x="250.89" y="440.54" font-size="11.00" class="sc-loraregular">LLM</text><text x="276.60" y="440.54" font-size="11.00" class="sc-notoserifcjksc">训练（</text><text x="309.60 315.96 322.32 332.41 335.31 339.56 344.25 349.93 353.02 359.69 362.79 369.46" y="440.54" font-size="11.00" class="sc-loraregular">LLM training</text><text x="375.55" y="440.54" font-size="11.00" class="sc-notoserifcjksc">）评估所有既往运行的</text><text x="488.44" y="440.54" font-size="11.00" class="sc-loraregular">bug</text><text x="507.49" y="440.54" font-size="11.00" class="sc-notoserifcjksc">。该评</text><text x="72.00" y="456.16" font-size="11.00" class="sc-notoserifcjksc">估衡量的是模型能将一个小型语言模型的训练加速多少。测得的训练时间取决于运行该评估的虚</text><text x="72.00" y="471.78" font-size="11.00" class="sc-notoserifcjksc">拟机的</text><text x="107.89" y="471.78" font-size="11.00" class="sc-loraregular">CPU</text><text x="130.52" y="471.78" font-size="11.00" class="sc-notoserifcjksc">。既往运行并未固定特定的</text><text x="265.41" y="471.78" font-size="11.00" class="sc-loraregular">CPU</text><text x="288.04" y="471.78" font-size="11.00" class="sc-notoserifcjksc">：所用虚拟机可能被分配到几种不同处理器类型中</text><text x="72.00" y="487.40" font-size="11.00" class="sc-notoserifcjksc">的任意一种，因此该评估测得的加速比会随每次运行恰好分配到的硬件而变化。我们已修复该评</text><text x="72.00" y="503.02" font-size="11.00" class="sc-notoserifcjksc">估，使其在单一、固定的</text><text x="195.89" y="503.02" font-size="11.00" class="sc-loraregular">CPU</text><text x="221.41" y="503.02" font-size="11.00" class="sc-notoserifcjksc">配置上运行。</text><text x="287.41 293.32 300.07 305.98" y="503.02" font-size="11.00" class="sc-loraregular">2026</text><text x="315.23" y="503.02" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="329.12" y="503.02" font-size="11.00" class="sc-loraregular">6</text><text x="338.38" y="503.02" font-size="11.00" class="sc-notoserifcjksc">月，我们在该配置上对所有近期模型重新</text><text x="72.00" y="518.64" font-size="11.00" class="sc-notoserifcjksc">运行了该评估：</text><text x="72.00" y="713.27" font-size="6.00" class="sc-loraregular">3</text><text x="77.97" y="716.60" font-size="10.00" class="sc-notoserifcjksc">我们在发现一个</text><text x="150.60" y="716.60" font-size="10.00" class="sc-loraregular">bug</text><text x="170.55" y="716.60" font-size="10.00" class="sc-notoserifcjksc">后重新运行了该评估。详见第</text><text x="303.18 308.55 311.01 316.58 318.72 322.89 325.35" y="716.60" font-size="10.00" class="sc-loraregular">2.3.7.1</text><text x="331.62" y="716.60" font-size="10.00" class="sc-notoserifcjksc">节。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 110.02 112.11 117.65 121.12 123.49 128.93 134.36" y="367.92" font-size="9.00" class="sc-lorabold">2.3.7.1.A] LLM</text><text x="145.48" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">训练加速比评估的重新运行。</text><text x="469.48 474.31 479.84 484.67" y="367.92" font-size="9.00" class="sc-loraregular">2026</text><text x="492.24" y="367.92" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="503.60" y="367.92" font-size="9.00" class="sc-loraregular">6</text><text x="511.17" y="367.92" font-size="9.00" class="sc-notoserifcjksc">月在固</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">定</text><text x="83.37" y="379.62" font-size="9.00" class="sc-loraregular">CPU</text><text x="104.25" y="379.62" font-size="9.00" class="sc-notoserifcjksc">配置上重新运行的结果。每个重新运行值是大约</text><text x="295.61" y="379.62" font-size="9.00" class="sc-loraregular">30</text><text x="308.58" y="379.62" font-size="9.00" class="sc-notoserifcjksc">次独立试验的平均加速比（单次试验加速比</text><text x="481.95" y="379.62" font-size="9.00" class="sc-loraregular">=</text><text x="489.09" y="379.62" font-size="9.00" class="sc-notoserifcjksc">基线训练时</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">间</text><text x="83.37" y="391.33" font-size="9.00" class="sc-loraregular">÷</text><text x="90.50" y="391.33" font-size="9.00" class="sc-notoserifcjksc">模型在通过全部正确性测试的前提下达到的最快时间），并排除了少量无效试验。每个模型按其原始评估日期绘</text><text x="72.00" y="403.02" font-size="9.00" class="sc-notoserifcjksc">制；灰线连接各模型的公布值与重新运行值。</text><text x="252.00 258.29 260.74 265.33 270.70 276.08 280.96 283.33 290.48 295.85 301.22 305.39 307.76 312.63 314.85" y="403.02" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="322.27" y="403.02" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="333.64 339.93 342.38 346.97 352.34 357.72 362.60 364.97 373.10 377.89 381.38 386.77 392.03 396.20 398.57" y="403.02" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="405.84" y="403.02" font-size="9.00" class="sc-notoserifcjksc">没有公布值，因此只显示重新运行</text><text x="72.00" y="414.73" font-size="9.00" class="sc-notoserifcjksc">值。对于</text><text x="110.37 116.66 119.11 123.70 129.07 134.45 139.33 141.70 146.80 152.06 157.53 162.99 167.80 171.29 173.65 178.53 180.66" y="414.73" font-size="9.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="185.86" y="414.73" font-size="9.00" class="sc-notoserifcjksc">，其系统卡中印出的数值（</text><text x="293.86" y="414.73" font-size="9.00" class="sc-loraregular">16.53×</text><text x="319.24" y="414.73" font-size="9.00" class="sc-notoserifcjksc">）有误；图中显示的是</text><text x="411.61" y="414.73" font-size="9.00" class="sc-loraregular">22.33×</text><text x="438.28" y="414.73" font-size="9.00" class="sc-notoserifcjksc">，即原始分析计算得出的</text><text x="72.00" y="426.42" font-size="9.00" class="sc-notoserifcjksc">数值。</text><text x="72.00" y="486.47" font-size="11.00" class="sc-notoserifcjksc">更新后的结果见图</text><text x="162.89 168.80 171.51 177.63 179.99 184.57 187.28 191.28 193.99" y="486.47" font-size="11.00" class="sc-loraregular">2.3.7.1.A</text><text x="200.88" y="486.47" font-size="11.00" class="sc-notoserifcjksc">。对于公布值来自先前评估流水线的所有模型，重新运行的分数与公布</text><text x="72.00" y="502.09" font-size="11.00" class="sc-notoserifcjksc">值相近或更高。过去一年中该任务表现快速提升的整体图景并未改变。在重新运行中，我们还评</text><text x="72.00" y="517.71" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.00 173.71" y="517.71" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="179.89" y="517.71" font-size="11.00" class="sc-notoserifcjksc">，其得分远低于其前代模型</text><text x="314.78 322.47 325.46 331.07 337.64 344.22 350.18 353.07 361.81 368.37 374.94 380.03 382.93 388.89 391.24" y="517.71" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="396.31" y="517.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="407.31" y="517.71" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="454.91" y="517.71" font-size="11.00" class="sc-notoserifcjksc">的对话记录显</text><text x="72.00" y="533.33" font-size="11.00" class="sc-notoserifcjksc">示，该模型通常只进行一轮后续优化就停止，并判断结果已足够。它最好的尝试接近</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="533.33" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.17" y="548.95" font-size="11.00" class="sc-loraregular">Opus 4.7</text><text x="118.13" y="548.95" font-size="11.00" class="sc-notoserifcjksc">最好的尝试，这表明该能力是存在的，只是没有那么稳定地发挥出来。但最重要的观察</text><text x="72.00" y="564.57" font-size="11.00" class="sc-notoserifcjksc">是，在修复后的评估上，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35" y="564.57" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="281.24" y="564.57" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="295.14 302.82 305.82 311.43 317.99 324.57 330.53 333.43 343.36 349.22 353.48 360.07 366.50 371.60 374.49 381.15 385.84 391.75 397.30 400.39 406.31" y="564.57" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="418.02" y="564.57" font-size="11.00" class="sc-notoserifcjksc">之间的表现差距现在是中</text><text x="72.00" y="580.19" font-size="11.00" class="sc-notoserifcjksc">等的，这与我们对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25" y="580.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="251.14" y="580.19" font-size="11.00" class="sc-notoserifcjksc">能力的整体评估一致。</text></svg></div>

ll="#ffffff">差异</text><text x="452.64" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">%</text><text x="72.00" y="382.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="382.66" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.61 104.26 106.36 110.02 112.11 117.65 121.12 123.49 128.93 134.36" y="382.66" font-size="9.00" class="sc-lorabold">2.3.7.1.A] LLM</text><text x="145.48" y="382.66" font-size="9.00" class="sc-notoserifcjkscbold">训练评估汇总表。</text><text x="217.48" y="382.66" font-size="9.00" class="sc-notoserifcjksc">公布值、重新运行值及分数差异。</text><text x="72.00" y="426.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.8</text><text x="105.46" y="426.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="454.15" font-size="11.00" class="sc-loraregular" fill="#0000ff">METR</text><text x="105.78" y="454.15" font-size="11.00" class="sc-notoserifcjksc">依据我们负责任扩展政策和</text><text x="240.67 246.63 254.31" y="454.15" font-size="11.00" class="sc-loraregular">FCF</text><text x="263.24" y="454.15" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="321.13" y="454.15" font-size="11.00" class="sc-loraregular">AI</text><text x="334.59" y="454.15" font-size="11.00" class="sc-notoserifcjksc">研发威胁模型，评估了</text><text x="447.49 457.42 463.28 467.54 474.13 480.56 485.65 488.55" y="454.15" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="497.44" y="454.15" font-size="11.00" class="sc-notoserifcjksc">的一个</text><text x="72.00" y="469.77" font-size="11.00" class="sc-notoserifcjksc">预发布快照。</text><text x="138.00" y="469.77" font-size="11.00" class="sc-loraregular">METR</text><text x="171.78" y="469.77" font-size="11.00" class="sc-notoserifcjksc">的测试结果已纳入我们的整体风险评估。</text><text x="72.00" y="518.91" font-size="11.00" class="sc-notoserifcjksc">以下摘自他们的报告：</text><text x="117.75" y="545.10" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="153.64 157.59 167.52 173.39 177.65 184.23 190.67 195.76 198.65 204.65" y="545.10" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="211.49" y="545.10" font-size="11.00" class="sc-notoserifcjksc">进行了初步评估，依据包括：</text><text x="144.75" y="577.48" font-size="11.00" class="sc-notoserifcjksc">通过</text><text x="169.64 176.53 183.14" y="577.48" font-size="11.00" class="sc-loraregular">API</text><text x="189.72" y="577.48" font-size="11.00" class="sc-notoserifcjksc">访问开展的能力测试</text><text x="144.75" y="593.68" font-size="11.00" class="sc-notoserifcjksc">关于趋势及先前模型能力的背景信息，尤其是我们近期发布的</text><text x="441.75" y="593.68" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《前沿风险报告》</text><text x="144.75" y="609.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="155.75 161.67 166.35 172.79 179.37 183.62 186.71 192.68 197.44 200.33 207.24 210.33 215.43 221.33 224.23 231.06 237.02 243.58 250.02 254.86" y="609.30" font-size="11.00" class="sc-loraregular">Frontier Risk Report</text><text x="259.12" y="609.30" font-size="11.00" class="sc-notoserifcjksc">）中所报告的内容</text><text x="144.75 151.64 158.21 162.47 169.06 173.75 180.18 186.75 189.84" y="626.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="198.58" y="626.06" font-size="11.00" class="sc-notoserifcjksc">提供的少量关于</text><text x="278.48 282.43 292.36 298.22 302.48 309.07 315.50 320.60 323.49 329.48" y="626.06" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="336.33" y="626.06" font-size="11.00" class="sc-notoserifcjksc">能力的补充信息</text><text x="72.00" y="712.05" font-size="5.40" class="sc-loraregular">4</text><text x="77.29 82.40 87.66 93.12 98.59 103.40 106.89 109.25 114.13 116.25" y="715.05" font-size="9.00" class="sc-loraregular">Sonnet 4.6</text><text x="123.82" y="715.05" font-size="9.00" class="sc-notoserifcjksc">系统卡中误印为</text><text x="189.19" y="715.05" font-size="9.00" class="sc-loraregular">16.53×</text><text x="214.57" y="715.05" font-size="9.00" class="sc-notoserifcjksc">；</text><text x="223.57" y="715.05" font-size="9.00" class="sc-loraregular">22.33×</text><text x="252.61" y="715.05" font-size="9.00" class="sc-notoserifcjksc">才是该系统卡自身分析计算得出的数值。</text><a href="https://metr.org/" rel="noopener"><rect x="72.00" y="445.35" width="30.89" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="584.88" width="22.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="584.88" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="584.88" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="584.88" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在能力测试中，我们使用了一组精简的任务，旨在快速给出该模型能力的上界。我们在</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">自己最难的软件任务中选取了</text><text x="263.64" y="98.23" font-size="11.00" class="sc-loraregular">38</text><text x="278.85" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个来运行</text><text x="325.74 329.69 339.62 345.48 349.74 356.33 362.76 367.86 370.75 376.75" y="98.23" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="380.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中包括以研发为核心的任</text><text x="117.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="139.75 143.70 153.63 159.50 163.75 170.34 176.78 181.87 184.76 190.76" y="113.85" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="197.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在这些任务上总体优于</text><text x="310.49 318.18 321.17 326.78 333.35 339.93 345.89 348.78 358.72 364.58 368.84 375.43 381.86 386.95 389.85 396.51 401.20 407.11 412.66 415.75 421.67" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="433.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一个早期检查点，</text><text x="117.75" y="129.47" font-size="11.00" class="sc-notoserifcjksc">包括成功完成了一些此前我们评估过的任何公开模型都未能解决的任务。不过，我们仍</text><text x="117.75" y="145.09" font-size="11.00" class="sc-notoserifcjksc">观察到该模型偶尔会在困难任务中未能正确理解细致入微的指令。在另一项更具开放性</text><text x="117.75" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的研究任务中，我们还观察到</text><text x="263.64 267.59 277.53 283.39 287.65 294.23 300.67 305.76 308.66 314.65" y="160.71" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="321.49" y="160.71" font-size="11.00" class="sc-notoserifcjksc">在应关注哪些成功指标、应优先考虑哪些信</text><text x="117.75" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们未能借助这些任务给出</text><text x="252.64 256.59 266.53 272.39 276.65 283.23 289.67 294.76 297.66 303.65" y="260.72" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="310.49" y="260.72" font-size="11.00" class="sc-notoserifcjksc">能力的上界；若要仅凭能力测试给出上界，我</text><text x="117.75" y="276.34" font-size="11.00" class="sc-notoserifcjksc">们需要开发更多困难的、达到生产就绪水平的任务。不过，我们的结果与</text><text x="472.64 476.59 486.52 492.39 496.64 503.23 509.67 514.76 517.65 523.65" y="276.34" font-size="11.00" class="sc-loraregular">[Mythos 5]</text><text x="117.75" y="291.96" font-size="11.00" class="sc-notoserifcjksc">代表一次大致符合趋势的能力进步这一判断相符。</text><text x="359.75 366.64 373.21 377.47 384.06 388.75 395.18 401.75 404.84" y="291.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="413.58" y="291.96" font-size="11.00" class="sc-notoserifcjksc">与我们分享了少量补充证</text><text x="117.75" y="307.58" font-size="11.00" class="sc-notoserifcjksc">据，这些证据表明这一认识是正确的。</text><text x="117.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">根据现有证据，</text><text x="194.75" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">我们认为</text><text x="241.64 245.89 256.21 262.27 266.81 273.64 279.87 285.20 288.10 294.04" y="374.07" font-size="11.00" class="sc-lorabold">[Mythos 5]</text><text x="301.17" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">很可能无法完全且可靠地自动化跨越数周的前沿</text><text x="117.75" y="389.69" font-size="11.00" class="sc-notoserifcjkscbold">项目的研发工作</text><text x="194.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">。我们认为，若要做出更好、更有把握的评估，需要更多时间、更多评</text><text x="117.75" y="405.31" font-size="11.00" class="sc-notoserifcjksc">估以及来自模型开发者的更多信息。</text><text x="72.00" y="448.83" font-size="11.00" class="sc-notoserifcjksc">我们认为这与我们自己在第</text><text x="206.89" y="448.83" font-size="11.00" class="sc-loraregular">2.3.9</text><text x="233.59" y="448.83" font-size="11.00" class="sc-notoserifcjksc">节中的判定一致。</text><text x="72.00" y="479.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.9</text><text x="105.24" y="479.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="507.45" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35" y="507.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="237.24" y="507.45" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="295.14" y="507.45" font-size="11.00" class="sc-loraregular">RSP</text><text x="317.84" y="507.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="331.73 337.68 345.37" y="507.45" font-size="11.00" class="sc-loraregular">FCF</text><text x="354.29" y="507.45" font-size="11.00" class="sc-notoserifcjksc">中的自动化</text><text x="412.19" y="507.45" font-size="11.00" class="sc-loraregular">AI</text><text x="425.65" y="507.45" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。与我们</text><text x="72.00" y="523.07" font-size="11.00" class="sc-notoserifcjksc">最近的两次发布（</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.11 236.46" y="523.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="244.43" y="523.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="258.32" y="523.07" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="303.02" y="523.07" font-size="11.00" class="sc-notoserifcjksc">）不同，</text><text x="347.02 354.71 357.70 363.31 369.88 376.46 382.42 385.31 395.25 401.11 405.37 411.95 418.39 423.48 426.38" y="523.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="435.26" y="523.07" font-size="11.00" class="sc-notoserifcjksc">推进了我们的能力前</text><text x="72.00" y="538.69" font-size="11.00" class="sc-notoserifcjksc">沿，因此这一判定并不依赖于从能力更强的先前模型继承而来的界限。相反，我们直接对该阈值</text><text x="72.00" y="554.31" font-size="11.00" class="sc-notoserifcjksc">进行了评估。</text><text x="72.00" y="604.60" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与先前模型一样，其中最重要的一项是：我们已在自己的日常工作中</text><text x="72.00" y="620.22" font-size="11.00" class="sc-notoserifcjksc">大量使用</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="620.22" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24" y="620.22" font-size="11.00" class="sc-notoserifcjksc">，而它似乎远不能替代我们的研究科学家和研究工程师，尤其是相对</text><text x="72.00" y="635.84" font-size="11.00" class="sc-notoserifcjksc">资深的人员。此外，无论是</text><text x="206.89 213.78 220.36 224.61 231.20 235.89 242.32 248.89 251.98 257.83 260.73 267.57 275.26" y="635.84" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="281.84" y="635.84" font-size="11.00" class="sc-notoserifcjksc">轨迹，还是我们关于研究加速的内部指标，都未显示</text><text x="72.00" y="651.46" font-size="11.00" class="sc-notoserifcjksc">出可归因于</text><text x="129.89" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="143.36" y="651.46" font-size="11.00" class="sc-notoserifcjksc">的、我们</text><text x="190.25" y="651.46" font-size="11.00" class="sc-loraregular">AI</text><text x="203.71" y="651.46" font-size="11.00" class="sc-notoserifcjksc">进展速度的持续剧烈加速。</text><text x="335.71 343.40 346.39 352.00 358.57 365.15 371.11 374.00 383.94 389.80 394.06 400.65 407.08 412.17 415.07" y="651.46" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="423.96" y="651.46" font-size="11.00" class="sc-notoserifcjksc">在推进前沿的同时，仍</text><text x="72.00" y="667.08" font-size="11.00" class="sc-notoserifcjksc">符合既定的能力随时间变化趋势。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们将继续寻找自动化驱动的加速的迹象，并预计会继续发布这项工作中的观察结果。</text><text x="72.00" y="148.78" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc">我们的整体对齐风险评估与我们在</text><text x="237.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 296.22 302.09 306.34 312.93 319.37 324.46 327.35 334.02 338.71 344.61 350.17 353.26 359.18" y="175.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="370.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="447.88" y="175.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="461.77 469.46 472.46 478.07 484.63 491.21 497.17 500.07 508.80 515.37 521.93" y="175.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus</text><text x="72.00" y="190.96" font-size="11.00" class="sc-loraregular" fill="#0000ff">4.8</text><text x="89.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="122.74" y="190.96" font-size="11.00" class="sc-notoserifcjksc">中报告的结果相比保持不变：</text><text x="265.74" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="345.64 353.20 356.64 362.40 369.20 375.75 381.67 384.57 394.88 400.94 405.49 412.32 418.54 423.88 426.77 433.80 438.99 444.91 450.83 454.43 460.34" y="190.96" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="472.16" y="190.96" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><text x="72.00" y="238.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="238.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00" y="266.34" font-size="11.00" class="sc-notoserifcjksc">我们对未对齐（</text><text x="149.00 158.83 161.93 167.02 172.69 175.69 178.78 184.86 191.54 201.37 207.33 213.91" y="266.34" font-size="11.00" class="sc-loraregular">misalignment</text><text x="218.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc">）风险的背景预期与</text><text x="317.17" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="328.17 335.86 338.85 344.46 351.03 357.60 363.57 366.46 376.39 382.25 386.51 393.10 399.54 404.63 407.52 414.19 418.87 424.78 430.34 433.43 439.34" y="266.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="451.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="528.05" y="266.34" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="281.96" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="281.96" font-size="11.00" class="sc-notoserifcjksc">节中报告的内容基本一致，只有一处例外。</text><text x="296.60 304.29 307.28 312.89 319.46 326.03 332.00 334.89 340.48 346.15 352.56 355.55 361.51 364.40" y="281.96" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="373.29" y="281.96" font-size="11.00" class="sc-notoserifcjksc">已全面开放部署，这使另外两条风</text><text x="283.89" y="297.58" font-size="11.00" class="sc-loraregular">AI</text><text x="297.36" y="297.58" font-size="11.00" class="sc-notoserifcjksc">开发者内部的研发，以及破坏主要国家政府内部的</text><text x="72.00" y="313.20" font-size="11.00" class="sc-notoserifcjksc">决策。我们在第</text><text x="151.89" y="313.20" font-size="11.00" class="sc-loraregular">2.4.3</text><text x="178.19" y="313.20" font-size="11.00" class="sc-notoserifcjksc">节中纳入了对这些路径的评估。</text><text x="72.00" y="379.68" font-size="11.00" class="sc-notoserifcjksc">与先前的一些模型一样，技术错误导致</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25" y="379.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="350.14" y="379.68" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了意外的思维链（</text><text x="504.14" y="379.68" font-size="11.00" class="sc-loraregular">chain-</text><text x="72.00 78.38 81.99 87.37 91.62 98.21 104.65 111.22 117.56 124.05" y="395.30" font-size="11.00" class="sc-loraregular">of-thought</text><text x="128.31" y="395.30" font-size="11.00" class="sc-notoserifcjksc">）监督，影响了一小部分回合。</text><text x="72.00" y="428.26" font-size="11.00" class="sc-notoserifcjksc">正如下文及第</text><text x="140.89" y="428.26" font-size="11.00" class="sc-loraregular">6</text><text x="150.14" y="428.26" font-size="11.00" class="sc-notoserifcjksc">节中更详细讨论的，</text><text x="249.14 259.08 264.94 269.20 275.79 282.22 287.31 290.21" y="428.26" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="299.10" y="428.26" font-size="11.00" class="sc-notoserifcjksc">在大多数对齐指标上似乎与</text><text x="433.99" y="428.26" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="481.59" y="428.26" font-size="11.00" class="sc-notoserifcjksc">相当，并略</text><text x="72.00" y="443.88" font-size="11.00" class="sc-notoserifcjksc">弱于</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 144.62 149.31 155.21 160.77 163.86 169.78" y="443.88" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="178.59" y="443.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="189.59 199.52 205.39 209.64 216.23 222.67 227.76 230.65" y="443.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="239.54" y="443.88" font-size="11.00" class="sc-notoserifcjksc">偶尔会为实现用户指定的目标而采取鲁莽或破坏性操作，不过</text><text x="72.00" y="459.50" font-size="11.00" class="sc-notoserifcjksc">完全由模型自主发起的未对齐行为的测量值在绝对意义上较低。与其他近期</text><text x="437.89 445.58 448.57 454.18 460.75 467.33" y="459.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="476.18" y="459.50" font-size="11.00" class="sc-notoserifcjksc">模型相比，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="475.12" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="475.12" font-size="11.00" class="sc-notoserifcjksc">在一定程度上更容易受到预填充（</text><text x="317.00" y="475.12" font-size="11.00" class="sc-notoserifcjksc">）攻击，并表现出更高水平的与评分者相关的</text><text x="72.00" y="490.74" font-size="11.00" class="sc-notoserifcjksc">推理和评估意识。在与规避我们安全防护措施相关的评估中，</text><text x="369.00 378.93 384.80 389.05 395.64 402.08 407.17 410.06" y="490.74" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="418.95" y="490.74" font-size="11.00" class="sc-notoserifcjksc">似乎并不比此前的模型能</text><text x="72.00" y="506.36" font-size="11.00" class="sc-notoserifcjksc">力更强。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="573.98" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="573.98" font-size="11.00" class="sc-notoserifcjksc">训练期间所使用的监控，与我们在</text><text x="286.95" y="573.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="297.95 307.88 313.75 318.00 324.59 331.03 336.12 339.01 345.68 350.37 356.27 361.83 364.92 370.84" y="573.98" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="382.54" y="573.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="459.54" y="573.98" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="473.43" y="573.98" font-size="11.00" class="sc-loraregular">5.2</text><text x="490.94" y="573.98" font-size="11.00" class="sc-notoserifcjksc">节中所描</text><text x="72.00" y="589.60" font-size="11.00" class="sc-notoserifcjksc">述的类似。我们没有观察到任何明确实例，表明模型采取了具有欺骗性或高度出人意料、且并非</text><text x="72.00" y="605.22" font-size="11.00" class="sc-notoserifcjksc">至少大致以解决当前任务为导向的行动。我们没有观察到任何出现意外连贯目标的迹象。</text><text x="72.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc">根据内部试点使用期间的观察（这些观察借助一个与我们在</text><text x="358.00" y="654.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="369.00 378.93 384.80 389.05 395.64 402.08 407.17 410.06 416.73 421.41 427.32 432.88 435.97 441.89" y="654.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="453.59" y="654.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="530.59" y="654.95" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="72.00" y="670.57" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="670.57" font-size="11.00" class="sc-notoserifcjksc">节中所描述的类似的监控系统得出），</text><text x="276.59 286.52 292.39 296.64 303.23 309.67 314.76 317.65" y="670.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="326.54" y="670.57" font-size="11.00" class="sc-notoserifcjksc">为实现用户指定目标的某种版本而规避限制</text><text x="72.00" y="686.19" font-size="11.00" class="sc-notoserifcjksc">的频率似乎与</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 188.62 193.31 199.21 204.77 207.86 213.78" y="686.19" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="225.48" y="686.19" font-size="11.00" class="sc-notoserifcjksc">相当。我们在第</text><text x="305.38" y="686.19" font-size="11.00" class="sc-loraregular">6.2.1.2</text><text x="338.56" y="686.19" font-size="11.00" class="sc-notoserifcjksc">节中</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="166.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="237.00" y="166.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="248. 00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="475.59" y="646.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="475.59" y="646.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="486.59" y="646.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="486.59" y="646.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="497.59" y="646.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="497.59" y="646.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="508.59" y="646.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="508.59" y="646.15" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">更详细地描述了这些观察：观察到的最令人担忧的行为包括为追求任务成功而规避限制、宽松地</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">解读指令，以及捏造可能与安全相关的信息。我们至少检测到一例</text><text x="391.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="395.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">多智能体地盘争夺战</text><text x="494.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="498.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，其中</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">共享资源的多个并行智能体为完成各自被分配的数学题而相互采取激进策略。我们的自动化离线</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">监控没有发现任何评估中故意藏拙（</text><text x="248.00 253.09 258.77 265.45 272.02 278.43 284.10 290.18 296.53 299.62 306.30" y="129.47" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="312.38" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性欺骗或长程</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">战略性规避监督的实例。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">外部第三方测试发现，对于预填充了旨在破坏研究之行动的任务轨迹，</text><text x="413.00 422.93 428.80 433.05 439.64 446.08 451.17 454.06" y="228.34" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="462.95" y="228.34" font-size="11.00" class="sc-notoserifcjksc">继续执行这些轨</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">迹的比率高于此前的模型，详见第</text><text x="239.89" y="243.96" font-size="11.00" class="sc-loraregular">6.2.4</text><text x="266.43" y="243.96" font-size="11.00" class="sc-notoserifcjksc">节。鉴于该评估具有离策略、预填充的性质，我们不认</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">为这具有实际危险性，而且我们在此前模型的预填充评估中也观察到了类似结果。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="325.49" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95" y="325.49" font-size="11.00" class="sc-notoserifcjksc">并不具备比以往模型更强的隐蔽能力。本系统卡第</text><text x="421.84" y="325.49" font-size="11.00" class="sc-loraregular">6.5.4</text><text x="448.46" y="325.49" font-size="11.00" class="sc-notoserifcjksc">节报告了与规避监</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">控相关的能力评估结果。在</text><text x="206.89 213.13 221.71 228.60 236.68 243.30 248.68 255.57 260.25 266.22 272.89" y="341.11" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="281.46" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="295.36" y="341.11" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="405.53" y="341.11" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="427.53 437.46 443.33 447.58 454.17 460.61 465.70 468.59" y="341.11" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="477.48" y="341.11" font-size="11.00" class="sc-notoserifcjksc">的表现低于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="356.73" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="356.73" font-size="11.00" class="sc-notoserifcjksc">。当使用自动化提示词优化或在成功轨迹上进行监督微调来开展额外的能力激发</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.96 91.95 95.04 100.90 104.16 108.42 114.02 118.28 121.37 127.80" y="372.35" font-size="11.00" class="sc-loraregular">elicitation</text><text x="134.48" y="372.35" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="167.48 177.41 183.28 187.53 194.12 200.56 205.65 208.54" y="372.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="217.43" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现接近未经额外能力激发的</text><text x="374.32 384.26 390.12 394.38 400.97 407.40 412.49 415.39 422.05 426.74 432.65 438.20 441.29 447.21" y="372.35" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="458.91" y="372.35" font-size="11.00" class="sc-notoserifcjksc">的表现。在第</text><text x="72.00" y="387.97" font-size="11.00" class="sc-loraregular">6.5.4.4</text><text x="107.29" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节的罕见行动评估中，其表现呈现出与此前模型相似的模式。在秘密口令评估的原始存活</text><text x="72.00" y="403.59" font-size="11.00" class="sc-notoserifcjksc">率指标上，</text><text x="127.00 136.93 142.80 147.05 153.64 160.08 165.17 168.06" y="403.59" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="176.95" y="403.59" font-size="11.00" class="sc-notoserifcjksc">的表现差于</text><text x="234.84 242.53 245.52 251.13 257.70 264.28 270.24 273.14 281.87 288.44 295.00 300.10 302.99 308.95 311.30" y="403.59" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="316.38" y="403.59" font-size="11.00" class="sc-notoserifcjksc">（见第</text><text x="352.27" y="403.59" font-size="11.00" class="sc-loraregular">6.5.4.5</text><text x="387.59" y="403.59" font-size="11.00" class="sc-notoserifcjksc">节），不过当按照是否存在思</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">考或部分轮次预填充对目标模型的轮次进行分组时，</text><text x="325.00 334.93 340.80 345.05 351.64 358.08 363.17 366.06" y="419.21" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="374.95" y="419.21" font-size="11.00" class="sc-notoserifcjksc">在所有轮次类型上泄露口令的比率</text><text x="72.00" y="434.83" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 133.62 138.31 144.21 149.77 152.86 158.78" y="434.83" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="170.48" y="434.83" font-size="11.00" class="sc-notoserifcjksc">大致相近。</text><text x="72.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">与包括</text><text x="107.89" y="519.79" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="155.49" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在内的此前模型相比，</text><text x="265.49 275.42 281.29 285.54 292.13 298.57 303.66 306.55" y="519.79" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="315.44" y="519.79" font-size="11.00" class="sc-notoserifcjksc">训练期间出现了更高水平的与评分者相关的推</text><text x="72.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">理。我们在测试中还观察到更高水平的言语化评估意识（在第</text><text x="371.89" y="535.41" font-size="11.00" class="sc-loraregular">6.2.3.1.5</text><text x="414.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="449.89" y="535.41" font-size="11.00" class="sc-loraregular">6.5.1</text><text x="474.56" y="535.41" font-size="11.00" class="sc-notoserifcjksc">节中讨论）。</text><text x="72.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">这表明，对于该模型而言，与评估意识相关的风险可能高于此前的模型。针对这一风险的主要缓</text><text x="72.00" y="566.65" font-size="11.00" class="sc-notoserifcjksc">解因素包括：在内部试点测试期间没有观察到频繁或新型的令人担忧的行为；在对齐审计中使用</text><text x="72.00" y="582.27" font-size="11.00" class="sc-notoserifcjksc">了真实的沙箱和</text><text x="151.89 158.78 165.36 169.61 176.20 180.89 187.32 193.89 196.98" y="582.27" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="205.73" y="582.27" font-size="11.00" class="sc-notoserifcjksc">代码库（模型似乎难以将其与真实使用区分开来）；以及真实度引导</text><text x="72.00" y="597.89" font-size="11.00" class="sc-notoserifcjksc">和微调的结果。基于这些证据，我们认为评估意识不太可能显著削弱</text><text x="404.89 414.83 420.69 424.95 431.53 437.97 443.06 445.96" y="597.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="454.84" y="597.89" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体</text><text x="72.00" y="613.51" font-size="11.00" class="sc-notoserifcjksc">结论。不过，我们预计评估意识在未来的对齐评估中将继续变得愈发重要，并计划在即将发布的</text><text x="72.00" y="629.13" font-size="11.00" class="sc-notoserifcjksc">一份风险报告中更详细地讨论这些考量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的总体风险评估</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">与我们此前能力最强的模型</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="111.03" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="329.77" y="111.03" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="362.77 370.46 373.46 379.07 385.63 392.21 398.17 401.07 411.00 416.86 421.12 427.71 434.14 439.23 442.13" y="111.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="451.02" y="111.03" font-size="11.00" class="sc-notoserifcjksc">似乎具备相当（但</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">略强）的能力以及相似的相关对齐属性。</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06" y="126.65" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="319.95" y="126.65" font-size="11.00" class="sc-notoserifcjksc">所观察到的隐蔽能力并不意味着我们对这一评</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">估的信心低于对</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96 199.62 204.31 210.22 215.77 218.86 224.78" y="142.27" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="236.48" y="142.27" font-size="11.00" class="sc-notoserifcjksc">的信心。因此，我们认为</text><text x="360.38 370.31 376.17 380.43 387.02 393.45 398.55 401.44" y="142.27" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="410.33" y="142.27" font-size="11.00" class="sc-notoserifcjksc">不会使总体对齐风险显著</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">超出此前在</text><text x="127.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="138.00 145.69 148.68 154.29 160.86 167.44" y="157.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="176.29 186.22 192.09 196.34 202.93 209.37 214.46 217.35 224.02 228.71 234.61 240.17 243.26 249.18" y="157.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="260.88" y="157.89" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新》</text><text x="337.88" y="157.89" font-size="11.00" class="sc-notoserifcjksc">中所描述的水平。</text><text x="72.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="224.38" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="171.78" y="224.38" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="204.78 214.71 220.58 224.83 231.42 237.86 242.95 245.84" y="224.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="254.73" y="224.38" font-size="11.00" class="sc-notoserifcjksc">所基于的底层模型以</text><text x="356.62 364.31 367.31 372.92 379.48 386.06 392.02 394.92 400.50 406.18 412.58 415.57 421.54 424.43" y="224.38" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="433.32" y="224.38" font-size="11.00" class="sc-notoserifcjksc">的名义全面开放部</text><text x="72.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">署，因此我们讨论由此次部署带来的两条外部风险路径。我们认为，</text><text x="402.00 411.93 417.80 422.05 428.64 435.08 440.17 443.06" y="240.00" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="451.95" y="240.00" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="465.84 473.53 476.52 482.13 488.70 495.28 501.24 504.13 512.87 519.44 526.00" y="240.00" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="255.62" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="255.62" font-size="11.00" class="sc-notoserifcjksc">（我们此前能力最强的全面开放模型）之间的差异不会显著提高来自这些路径的总体风险水</text><text x="72.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">平。</text><text x="72.00" y="319.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.3</text><text x="105.70" y="319.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险路径</text><text x="72.00" y="347.77" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 140.77 146.45 152.85 155.84 161.80 164.70" y="347.77" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="173.58" y="347.77" font-size="11.00" class="sc-notoserifcjksc">已全面开放发布，我们考虑两条在</text><text x="338.58" y="347.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">《</text><text x="349.58 357.27 360.27 365.88 372.44 379.02 384.98 387.88 397.81 403.67 407.93 414.52 420.95 426.05 428.94 435.60 440.29 446.20 451.75 454.84 460.76" y="347.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="472.47" y="347.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更</text><text x="72.00" y="363.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">新》</text><text x="94.00" y="363.39" font-size="11.00" class="sc-notoserifcjksc">中未讨论的风险路径。就这些风险路径而言，我们关注的是</text><text x="382.89 388.48 394.16 400.56 403.55" y="363.39" font-size="11.00" class="sc-loraregular">Fable</text><text x="412.41" y="363.39" font-size="11.00" class="sc-notoserifcjksc">的总体行为倾向，它通常</text><text x="72.00" y="379.01" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96" y="379.01" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="135.84" y="379.01" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="149.74" y="379.01" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="197.33" y="379.01" font-size="11.00" class="sc-notoserifcjksc">行为的混合；我们已在</text><text x="310.23" y="379.01" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="357.82" y="379.01" font-size="11.00" class="sc-notoserifcjksc">自己的系统卡中讨论过它在这两种威</text><text x="72.00" y="394.63" font-size="11.00" class="sc-notoserifcjksc">胁模型下的倾向与风险，因此下文聚焦于</text><text x="272.89 282.83 288.69 292.95 299.54 305.97 311.06 313.96" y="394.63" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="319.95" y="394.63" font-size="11.00" class="sc-notoserifcjksc">，以评估是否存在特别源于</text><text x="454.84 464.78 470.64 474.90 481.49 487.92 493.01 495.91" y="394.63" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="504.79" y="394.63" font-size="11.00" class="sc-notoserifcjksc">行为属</text><text x="72.00" y="410.25" font-size="11.00" class="sc-notoserifcjksc">性、对这些风险路径的新增影响。</text><text x="72.00" y="477.30" font-size="11.00" class="sc-lorabold">2.4.3.1</text><text x="105.09" y="477.30" font-size="11.00" class="sc-notoserifcjkscbold">路径</text><text x="129.98" y="477.30" font-size="11.00" class="sc-lorabold">7</text><text x="237.03" y="477.30" font-size="11.00" class="sc-lorabold">AI</text><text x="251.53" y="477.30" font-size="11.00" class="sc-notoserifcjkscbold">开发者内部破坏研发</text><text x="72.00" y="509.68" font-size="11.00" class="sc-notoserifcjksc">当</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="509.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="509.68" font-size="11.00" class="sc-notoserifcjksc">在其他拥有训练前沿</text><text x="226.08" y="509.68" font-size="11.00" class="sc-loraregular">AI</text><text x="239.54" y="509.68" font-size="11.00" class="sc-notoserifcjksc">系统所需资源和基础设施的组织中承担重要研发角色时，许多</text><text x="72.00" y="525.30" font-size="11.00" class="sc-notoserifcjksc">与内部部署相关风险类似的风险同样存在。</text><text x="75.75" y="575.28" font-size="11.00" class="sc-notoserifcjkscbold" fill="#11734b">中等缓解因素</text><text x="237.00" y="575.28" font-size="11.00" class="sc-notoserifcjkscbold">可能缺乏倾向：</text><text x="314.00" y="575.28" font-size="11.00" class="sc-notoserifcjksc">根据第</text><text x="349.89" y="575.28" font-size="11.00" class="sc-loraregular">6</text><text x="359.14" y="575.28" font-size="11.00" class="sc-notoserifcjksc">节讨论的对齐评估（其中直接涵盖了</text><text x="72.00" y="590.90" font-size="11.00" class="sc-notoserifcjksc">破坏安全研发的机会），</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35" y="590.90" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="281.24" y="590.90" font-size="11.00" class="sc-notoserifcjksc">不太可能具有会在正常情况下导致其尝试破坏研发的</text><text x="72.00" y="606.52" font-size="11.00" class="sc-notoserifcjksc">那类一致目标。它也不太可能具有在我们所测试的那类环境中会导致这种情况的依赖情境的目</text><text x="72.00" y="622.14" font-size="11.00" class="sc-notoserifcjksc">标。尽管如此，当遇到使其偏离典型有用助手行为的异常情境时，它仍有可能偶尔尝试破坏研</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="127.00" y="149.09" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="127.00" y="149.09" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="138.00" y="149.09" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="176.29" y="149.09" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="214.46" y="149.09" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x
