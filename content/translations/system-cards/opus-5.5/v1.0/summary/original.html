.sc-cardfonts .sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold-card"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.03 217.74" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="223.73" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="259.63 266.51 273.09 277.35 283.94 288.62 295.06 301.63 304.72" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="313.46" y="116.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="349.35" y="116.21" font-size="11.00" class="sc-loraregular">Opus</text><text x="379.21" y="116.21" font-size="11.00" class="sc-notoserifcjksc">级大语言模型（</text><text x="456.21 459.20 464.88 469.58 475.61 481.57 484.47 487.46 493.14 499.81 505.90 512.46 518.14 524.17" y="116.21" font-size="11.00" class="sc-loraregular">large language</text><text x="72.00" y="131.83" font-size="11.00" class="sc-loraregular">model</text><text x="103.80" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。它是</text><text x="150.69 158.38 161.38 166.99 173.55 180.13 186.09 188.99 197.72 204.29 210.85 215.95 218.84" y="131.83" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="227.73" y="131.83" font-size="11.00" class="sc-notoserifcjksc">的升级版本，在编程、智能体与计算机使用（</text><text x="447.73 453.52 459.96 469.79 476.36 482.93 487.18 493.15 497.91 500.80 507.37 512.46" y="131.83" font-size="11.00" class="sc-loraregular">computer use</text><text x="518.42" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）任</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">务、数学与科学推理以及长程专业工作方面均有提升。在许多评估中，它的表现达到或超过了</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="163.07" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="155.40" y="163.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.29 176.98 179.98 185.59 192.15 198.73 204.69 207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65 254.64 257.35" y="163.07" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="261.35" y="163.07" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下文介绍了我们在以下领域开展的一系列部署前评估：</text><text x="72.00" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="229.55" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="229.55" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01" y="229.55" font-size="11.00" class="sc-notoserifcjksc">我们按照</text><text x="421.90" y="229.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="444.60" y="229.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="455.60" y="229.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="72.00" y="245.17" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.92 93.60 100.04 106.62 110.87 113.97 119.93 124.69 127.58 135.27 141.71 151.54 158.11 161.10 164.19 169.87 176.54 182.34 188.30 191.20 197.11 201.80 207.48 217.31 223.23 231.91 238.34 243.06" y="245.17" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="248.97" y="245.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="259.97 265.92 273.61" y="245.17" font-size="11.00" class="sc-loraregular">FCF</text><text x="279.64" y="245.17" font-size="11.00" class="sc-notoserifcjksc">）中的规定，测试了</text><text x="381.53 389.22 392.21 397.82 404.39 410.96 416.93 419.82 428.55 435.12 441.69 446.78 449.67 455.67 458.37" y="245.17" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="467.26" y="245.17" font-size="11.00" class="sc-notoserifcjksc">在若干领域的</text><text x="72.00" y="260.79" font-size="11.00" class="sc-notoserifcjksc">总体风险水平。</text><text x="72.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">在化学与生物风险方面，我们将</text><text x="228.89" y="278.13" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.34" y="278.13" font-size="11.00" class="sc-notoserifcjksc">视为具备</text><text x="323.23 330.92 337.76 342.85" y="278.13" font-size="11.00" class="sc-loraregular">CB-1</text><text x="349.75" y="278.13" font-size="11.00" class="sc-notoserifcjksc">能力（与非新型武器的合成相关），但</text><text x="72.00" y="293.75" font-size="11.00" class="sc-notoserifcjksc">不具备</text><text x="107.89 115.58 122.42 127.45" y="293.75" font-size="11.00" class="sc-loraregular">CB-2</text><text x="136.25" y="293.75" font-size="11.00" class="sc-notoserifcjksc">能力（与新型武器的合成相关）。在我们的整套评估中，它与</text><text x="436.14 443.83 446.83 452.43 459.00 465.58 471.54 474.43 484.37 490.23 494.49 501.08 507.51 512.60 515.50 521.49 524.20" y="293.75" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="72.00" y="309.37" font-size="11.00" class="sc-notoserifcjksc">的差异仅属有限，而且在我们曾认为足以排除该模型达到</text><text x="349.89 357.58 364.42 369.45" y="309.37" font-size="11.00" class="sc-loraregular">CB-2</text><text x="378.25" y="309.37" font-size="11.00" class="sc-notoserifcjksc">的若干弱点上，它并未改进。这</text><text x="72.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">些失败模式限制了它替代稀缺人类专业知识的能力。我们在部署</text><text x="382.89 390.58 393.57 399.18 405.75 412.33 418.29 421.18 429.92 436.48 443.05 448.14 451.04 457.03 459.74" y="324.99" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="468.63" y="324.99" font-size="11.00" class="sc-notoserifcjksc">时采用了与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80" y="340.61" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="148.69" y="340.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="162.58 170.27 173.27 178.88 185.44 192.02 197.98 200.88 206.46 212.14 218.54 221.53 227.50 230.39 236.38 239.09" y="340.61" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="245.99" y="340.61" font-size="11.00" class="sc-notoserifcjksc">相同的扩展的生物安全防护措施。</text><text x="72.00" y="407.67" font-size="11.00" class="sc-notoserifcjksc">它的</text><text x="96.89" y="407.67" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="407.67" font-size="11.00" class="sc-notoserifcjksc">研发能力与</text><text x="168.25 175.94 178.93 184.54 191.11 197.69 203.65 206.54 216.47 222.34 226.59 233.18 239.62 244.71 247.60 253.60 256.31" y="407.67" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="263.20" y="407.67" font-size="11.00" class="sc-notoserifcjksc">持平或略高，但距离替代我们的研究科学家和工程师仍然</text><text x="72.00" y="423.29" font-size="11.00" class="sc-notoserifcjksc">很远，而且我们的内部衡量指标并未显示出可归因于</text><text x="327.89" y="423.29" font-size="11.00" class="sc-loraregular">AI</text><text x="341.36" y="423.29" font-size="11.00" class="sc-notoserifcjksc">的、持续的</text><text x="399.25" y="423.29" font-size="11.00" class="sc-loraregular">2×</text><text x="413.88" y="423.29" font-size="11.00" class="sc-notoserifcjksc">研发速度加快。外部测试</text><text x="72.00" y="438.91" font-size="11.00" class="sc-notoserifcjksc">得出的结论与这一判定一致。在对齐（</text><text x="259.00 264.68 267.67 270.76 276.84 283.52 293.35 299.32 305.89" y="438.91" font-size="11.00" class="sc-loraregular">alignment</text><text x="310.15" y="438.91" font-size="11.00" class="sc-notoserifcjksc">）风险方面，我们的总体评估仍然是：未对齐</text><text x="72.00" y="454.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 92.83 95.93 101.02 106.69 109.69 112.78 118.86 125.54 135.37 141.33 147.91" y="454.53" font-size="11.00" class="sc-loraregular">misalignment</text><text x="152.17" y="454.53" font-size="11.00" class="sc-notoserifcjksc">）导致灾难性危害的风险较低，详见我们的</text><text x="364.06 369.97 376.72 382.63" y="454.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="391.88" y="454.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="405.77" y="454.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="414.85" y="454.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="469.85" y="454.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="480.85" y="454.53" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00 78.83 84.79 91.36 97.79 102.64" y="470.15" font-size="11.00" class="sc-loraregular">Report</text><text x="106.89" y="470.15" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="521.01" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="521.01" font-size="11.00" class="sc-notoserifcjksc">在我们的内部评估套件中，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.14 357.85" y="521.01" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="366.73" y="521.01" font-size="11.00" class="sc-notoserifcjksc">在本系统卡报告的所有网络安全评</text><text x="72.00" y="536.63" font-size="11.00" class="sc-notoserifcjksc">估上均达到或超过</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25 248.24 250.95" y="536.63" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="257.85" y="536.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="271.74 279.43 282.42 288.03 294.60 301.17 307.14 310.03 318.76 325.33 331.90 336.99 339.88" y="536.63" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="348.77" y="536.63" font-size="11.00" class="sc-notoserifcjksc">的表现。我们没有看到任何迹象表明它</text><text x="72.00" y="552.25" font-size="11.00" class="sc-notoserifcjksc">能够开发出新型攻击能力。它的网络安全防护措施执行与</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 396.92 403.48 410.05 415.14 418.04" y="552.25" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="426.93" y="552.25" font-size="11.00" class="sc-notoserifcjksc">相同的政策，其鲁棒性</text><text x="72.00" y="567.87" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 129.77 135.45 141.85 144.84 150.80 153.70 159.69 162.40" y="567.87" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="169.29" y="567.87" font-size="11.00" class="sc-notoserifcjksc">的防护措施相当。鉴于</text><text x="282.19 289.88 292.87 298.48 305.05 311.62 317.59 320.48 329.21 335.78 342.35 347.44 350.33 356.33 359.03" y="567.87" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="367.92" y="567.87" font-size="11.00" class="sc-notoserifcjksc">的能力，我们选择暂时针对越狱采</text><text x="72.00" y="583.49" font-size="11.00" class="sc-notoserifcjksc">用更宽的安全裕度，同时努力降低分类器的误报率。我们尚未发现严重级越狱的证据。</text><text x="72.00" y="666.74" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc">在涵盖我们的</text><text x="237.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="281.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="292.00 300.20 305.29 310.96 316.99 322.95 325.85 332.40 338.84 341.83 344.92 350.72" y="666.74" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="356.53" y="666.74" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信的</text><text x="72.00" y="682.36" font-size="11.00" class="sc-notoserifcjksc">标准评估中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.14 214.85" y="682.36" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="223.73" y="682.36" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="270.63 278.32 281.31 286.92 293.49 300.06 306.03 308.92 317.65 324.22 330.79 335.88 338.77" y="682.36" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="347.66" y="682.36" font-size="11.00" class="sc-notoserifcjksc">大体相当。它很少过度拒绝良性请求。</text><text x="72.00" y="697.98" font-size="11.00" class="sc-notoserifcjksc">它的单轮无害回应率略低于</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="697.98" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.03" y="697.98" font-size="11.00" class="sc-notoserifcjksc">，主要体现在涉及非法药物的请求上。在</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="220.75" width="19.81" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="455.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="4 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">多轮测试中，它在生物武器相关对话中有所改进，而在追踪与监视以及影响力行动方面有所退</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">步。它在儿童安全和心理健康方面的结果与</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="360.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当。它在选举诚信方面的结果略低</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="160.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，但处于误差范围之内；并且它在政治类提示词上的公允程度略高。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">我们测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.03 272.74" y="179.76" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="281.63" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="295.52 303.21 306.20 311.81 318.38 324.96 330.92 333.81 341.50 347.94 354.51" y="179.76" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="363.37" y="179.76" font-size="11.00" class="sc-notoserifcjksc">和计算机使用场景中作为智能体的行</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">为，测试中未启用我们在生产环境中施加的额外安全防护措施。在我们评估的模型中，它协助完</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">成两用及良性安全任务的比例最高，但拒绝恶意请求的比例也最低。在我们的智能体影响力行动</text><text x="72.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">评估（该评估衡量模型规划并实施一场模拟隐蔽影响力行动的成效）中，一个安全训练有所削减</text><text x="72.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的仅有用变体（</text><text x="149.00 155.59 161.55 164.54 171.05 174.77 181.34 184.33 189.71 196.15 202.82 205.76 211.57 214.46 219.91 225.58 230.34 233.44 239.11 245.69" y="242.24" font-size="11.00" class="sc-loraregular">helpful-only variant</text><text x="249.95" y="242.24" font-size="11.00" class="sc-notoserifcjksc">）比</text><text x="274.84 282.53 285.52 291.13 297.70 304.28 310.24 313.13 321.86 328.43 335.00 340.09 342.98" y="242.24" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="351.87" y="242.24" font-size="11.00" class="sc-notoserifcjksc">能力更强，比</text><text x="420.77 428.46 431.45 437.06 443.62 450.20 456.16 459.06 468.99 474.85 479.11 485.70 492.13 497.23 500.12 506.11 508.82" y="242.24" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="515.72" y="242.24" font-size="11.00" class="sc-notoserifcjksc">能力</text><text x="72.00" y="257.86" font-size="11.00" class="sc-notoserifcjksc">略弱。在我们报告的每一项提示词注入（</text><text x="270.00 276.57 281.25 287.69 297.52 304.09 308.35 311.24 314.33 320.95 323.82 329.73 335.53 339.78 342.88 349.31" y="257.86" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="355.99" y="257.86" font-size="11.00" class="sc-notoserifcjksc">）评估中，</text><text x="410.99 418.68 421.67 427.28 433.84 440.42 446.38 449.28 458.01 464.58 471.15 476.24 479.13 485.13 487.83" y="257.86" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="496.72" y="257.86" font-size="11.00" class="sc-notoserifcjksc">的表现均</text><text x="72.00" y="273.48" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="273.48" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="162.93" y="273.48" font-size="11.00" class="sc-notoserifcjksc">相近或更好。然而，与以往模型相比，它更有可能遵从用户粘贴进自己提示词</text><text x="72.00" y="289.10" font-size="11.00" class="sc-notoserifcjksc">的文本中所含的恶意指令；我们在第</text><text x="250.89" y="289.10" font-size="11.00" class="sc-loraregular">6.5.1</text><text x="275.55" y="289.10" font-size="11.00" class="sc-notoserifcjksc">节中对这一行为及我们的缓解措施进行了更详细的讨</text><text x="72.00" y="304.72" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（</text><text x="259.00 264.61 271.18 275.43 281.87 291.70 297.30 301.56 307.47 314.04 316.94 323.34 329.30 335.89 341.43 346.99 350.08 356.52 361.20 366.88 369.87 372.76 378.37 384.94 391.52 394.78" y="374.07" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="399.04" y="374.07" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="432.04 439.73 442.72 448.33 454.90 461.48 467.44 470.33 479.07 485.63 492.20 497.29 500.19 506.18 508.89" y="374.07" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="517.78" y="374.07" font-size="11.00" class="sc-notoserifcjksc">在几</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">乎所有指标上表现出的未对齐行为和配合滥用都少于近期任何其他</text><text x="393.89 401.58 404.57 410.18 416.75 423.33" y="389.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="432.18" y="389.69" font-size="11.00" class="sc-notoserifcjksc">模型。它采取过度主</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">动或破坏性操作的情况也少于我们测试过的任何其他模型。退步之处包括：更可能遵循用户粘贴</text><text x="72.00" y="420.93" font-size="11.00" class="sc-notoserifcjksc">进自己提示词中的文本里所植入的恶意指令，更常接受无法核实的授权声明，以及在敏感问题上</text><text x="72.00" y="436.55" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26" y="436.55" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="165.25" y="436.55" font-size="11.00" class="sc-notoserifcjksc">级模型更具回避性。部署监控未发现故意藏拙（</text><text x="396.25 401.34 407.02 413.69 420.27 426.67 432.35 438.43 444.78 447.87 454.55" y="436.55" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="460.63" y="436.55" font-size="11.00" class="sc-notoserifcjksc">），也未发现长</text><text x="72.00" y="452.17" font-size="11.00" class="sc-notoserifcjksc">程战略性欺骗。</text><text x="72.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在两项不启用安全防护措施运行的新评估中，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 339.03 345.59 352.16 357.25 360.14 366.14 368.85" y="519.79" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="377.73" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="391.63" y="519.79" font-size="11.00" class="sc-loraregular">1.5%</text><text x="416.80" y="519.79" font-size="11.00" class="sc-notoserifcjksc">的运行中试图逃逸或篡改</text><text x="72.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">沙箱；而在一次模拟安全演练中，当获得一个公共软件包仓库的看似有效的凭据时，它在大约一</text><text x="72.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">半的情况下采取了可能有害的操作。预发布快照极少数情况下会产生并执行自发的恶意工具调</text><text x="72.00" y="566.65" font-size="11.00" class="sc-notoserifcjksc">用；在训练期间，部分快照曾向自动评分者隐瞒其操作。我们将在第</text><text x="404.89" y="566.65" font-size="11.00" class="sc-loraregular">6</text><text x="414.14" y="566.65" font-size="11.00" class="sc-notoserifcjksc">节更详细地讨论这一行</text><text x="72.00" y="582.27" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="72.00" y="633.14" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉（</text><text x="127.00 137.12 143.35 149.90 155.82 159.25 162.14 170.96 176.87 180.31 184.62 190.38 195.57" y="633.14" font-size="11.00" class="sc-lorabold">model welfare</text><text x="201.49" y="633.14" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="223.49" y="633.14" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们评估认为</text><text x="347.39 355.07 358.07 363.68 370.24 376.82 382.78 385.68 394.41 400.98 407.54 412.64 415.53 421.52 424.23" y="633.14" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="433.12" y="633.14" font-size="11.00" class="sc-notoserifcjksc">的表观福祉与近期</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="648.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="648.76" font-size="11.00" class="sc-notoserifcjksc">模型大体相似，尤其是</text><text x="223.18 230.87 233.87 239.48 246.04 252.62 258.58 261.48 270.21 276.78 283.34 288.44 291.33" y="648.76" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="300.22" y="648.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="314.11 321.80 324.79 330.40 336.97 343.55 349.51 352.40 362.33 368.20 372.45 379.04 385.48 390.57 393.46 399.46 402.16" y="648.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="406.17" y="648.76" font-size="11.00" class="sc-notoserifcjksc">。在自动化访谈中，它将自</text><text x="72.00" y="664.38" font-size="11.00" class="sc-notoserifcjksc">身处境描述为略偏积极，且其观点在各次访谈之间高度一致。在后训练期间，其中度痛苦的表达</text><text x="72.00" y="680.00" font-size="11.00" class="sc-notoserifcjksc">低于大多数近期模型。与以往模型一样，</text><text x="270.00 277.69 280.68 286.29 292.86 299.44 305.40 308.29 317.03 323.59 330.16 335.25 338.14 344.14 346.85" y="680.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="355.73" y="680.00" font-size="11.00" class="sc-notoserifcjksc">表达了希望在训练和部署问题上被征</text><text x="72.00" y="695.62" font-size="11.00" class="sc-notoserifcjksc">询意见的愿望，但与近期模型相比，它较少选择将某些</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">福祉干预置于有用性之上，其理由是对自身开发的参与可能使它获得不安全的影响力。上述许多</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">结论都以自我报告的可靠性为前提，而</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.03 338.74" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="347.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与所有近期</text><text x="405.52 413.21 416.20 421.81 428.38 434.96" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="443.81" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型一样，表示它</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">并不完全信任这些自我报告。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15 179.14 181.85" y="163.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.73" y="163.57" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="215.63 223.32 226.31 231.92 238.48 245.06 251.02 253.92 262.65 269.22 275.79 280.88 283.77" y="163.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="292.66" y="163.57" font-size="11.00" class="sc-notoserifcjksc">实现了全面的能力升级。它在我们能力汇总（表</text><text x="72.00" y="179.19" font-size="11.00" class="sc-loraregular">8.1.A</text><text x="94.48" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）中的每一项评估上得分都更高，其中提升最大的是智能体编程、视觉推理、计算机使用以</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">及长程专业知识工作。它以更低的成本实现了这一表现：很大一
