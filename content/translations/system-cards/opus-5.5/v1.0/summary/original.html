.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="259.63" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="313.46" y="116.21" font-size="11.00" class="sc-notoserifcjksc">最新的</text><text x="349.35" y="116.21" font-size="11.00" class="sc-loraregular">Opus</text><text x="379.21" y="116.21" font-size="11.00" class="sc-notoserifcjksc">级大语言模型（</text><text x="456.21" y="116.21" font-size="11.00" class="sc-loraregular sc-k">large language</text><text x="72.00" y="131.83" font-size="11.00" class="sc-loraregular">model</text><text x="103.80" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）。它是</text><text x="150.69" y="131.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="227.73" y="131.83" font-size="11.00" class="sc-notoserifcjksc">的升级版本，在编程、智能体与计算机使用（</text><text x="447.73" y="131.83" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="518.42" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）任</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">务、数学与科学推理以及长程专业工作方面均有提升。在许多评估中，它的表现达到或超过了</text><text x="72.00" y="163.07" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="163.07" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.29" y="163.07" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="261.35" y="163.07" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下文介绍了我们在以下领域开展的一系列部署前评估：</text><text x="72.00" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00" y="229.55" font-size="11.00" class="sc-lorabold sc-k">Responsible Scaling Policy</text><text x="298.85" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="229.55" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="229.55" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01" y="229.55" font-size="11.00" class="sc-notoserifcjksc">我们按照</text><text x="421.90" y="229.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="444.60" y="229.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="455.60" y="229.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="72.00" y="245.17" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="245.17" font-size="11.00" class="sc-loraregular sc-k">Frontier Compliance Framework</text><text x="248.97" y="245.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="259.97" y="245.17" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="279.64" y="245.17" font-size="11.00" class="sc-notoserifcjksc">）中的规定，测试了</text><text x="381.53" y="245.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="467.26" y="245.17" font-size="11.00" class="sc-notoserifcjksc">在若干领域的</text><text x="72.00" y="260.79" font-size="11.00" class="sc-notoserifcjksc">总体风险水平。</text><text x="72.00" y="278.13" font-size="11.00" class="sc-notoserifcjksc">在化学与生物风险方面，我们将</text><text x="228.89" y="278.13" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.34" y="278.13" font-size="11.00" class="sc-notoserifcjksc">视为具备</text><text x="323.23" y="278.13" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="349.75" y="278.13" font-size="11.00" class="sc-notoserifcjksc">能力（与非新型武器的合成相关），但</text><text x="72.00" y="293.75" font-size="11.00" class="sc-notoserifcjksc">不具备</text><text x="107.89" y="293.75" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="136.25" y="293.75" font-size="11.00" class="sc-notoserifcjksc">能力（与新型武器的合成相关）。在我们的整套评估中，它与</text><text x="436.14" y="293.75" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="72.00" y="309.37" font-size="11.00" class="sc-notoserifcjksc">的差异仅属有限，而且在我们曾认为足以排除该模型达到</text><text x="349.89" y="309.37" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="378.25" y="309.37" font-size="11.00" class="sc-notoserifcjksc">的若干弱点上，它并未改进。这</text><text x="72.00" y="324.99" font-size="11.00" class="sc-notoserifcjksc">些失败模式限制了它替代稀缺人类专业知识的能力。我们在部署</text><text x="382.89" y="324.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="468.63" y="324.99" font-size="11.00" class="sc-notoserifcjksc">时采用了与</text><text x="72.00" y="340.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="148.69" y="340.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="162.58" y="340.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="245.99" y="340.61" font-size="11.00" class="sc-notoserifcjksc">相同的扩展的生物安全防护措施。</text><text x="72.00" y="407.67" font-size="11.00" class="sc-notoserifcjksc">它的</text><text x="96.89" y="407.67" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36" y="407.67" font-size="11.00" class="sc-notoserifcjksc">研发能力与</text><text x="168.25" y="407.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="263.20" y="407.67" font-size="11.00" class="sc-notoserifcjksc">持平或略高，但距离替代我们的研究科学家和工程师仍然</text><text x="72.00" y="423.29" font-size="11.00" class="sc-notoserifcjksc">很远，而且我们的内部衡量指标并未显示出可归因于</text><text x="327.89" y="423.29" font-size="11.00" class="sc-loraregular">AI</text><text x="341.36" y="423.29" font-size="11.00" class="sc-notoserifcjksc">的、持续的</text><text x="399.25" y="423.29" font-size="11.00" class="sc-loraregular">2×</text><text x="413.88" y="423.29" font-size="11.00" class="sc-notoserifcjksc">研发速度加快。外部测试</text><text x="72.00" y="438.91" font-size="11.00" class="sc-notoserifcjksc">得出的结论与这一判定一致。在对齐（</text><text x="259.00" y="438.91" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="310.15" y="438.91" font-size="11.00" class="sc-notoserifcjksc">）风险方面，我们的总体评估仍然是：未对齐</text><text x="72.00" y="454.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="454.53" font-size="11.00" class="sc-loraregular sc-k">misalignment</text><text x="152.17" y="454.53" font-size="11.00" class="sc-notoserifcjksc">）导致灾难性危害的风险较低，详见我们的</text><text x="364.06" y="454.53" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="391.88" y="454.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="405.77" y="454.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="414.85" y="454.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="469.85" y="454.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="480.85" y="454.53" font-size="11.00" class="sc-loraregular">Risk</text><text x="72.00" y="470.15" font-size="11.00" class="sc-loraregular sc-k">Report</text><text x="106.89" y="470.15" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="521.01" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="521.01" font-size="11.00" class="sc-notoserifcjksc">在我们的内部评估套件中，</text><text x="281.00" y="521.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="366.73" y="521.01" font-size="11.00" class="sc-notoserifcjksc">在本系统卡报告的所有网络安全评</text><text x="72.00" y="536.63" font-size="11.00" class="sc-notoserifcjksc">估上均达到或超过</text><text x="162.89" y="536.63" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="257.85" y="536.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="271.74" y="536.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="348.77" y="536.63" font-size="11.00" class="sc-notoserifcjksc">的表现。我们没有看到任何迹象表明它</text><text x="72.00" y="552.25" font-size="11.00" class="sc-notoserifcjksc">能够开发出新型攻击能力。它的网络安全防护措施执行与</text><text x="349.89" y="552.25" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="426.93" y="552.25" font-size="11.00" class="sc-notoserifcjksc">相同的政策，其鲁棒性</text><text x="72.00" y="567.87" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="567.87" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="169.29" y="567.87" font-size="11.00" class="sc-notoserifcjksc">的防护措施相当。鉴于</text><text x="282.19" y="567.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="367.92" y="567.87" font-size="11.00" class="sc-notoserifcjksc">的能力，我们选择暂时针对越狱采</text><text x="72.00" y="583.49" font-size="11.00" class="sc-notoserifcjksc">用更宽的安全裕度，同时努力降低分类器的误报率。我们尚未发现严重级越狱的证据。</text><text x="72.00" y="666.74" font-size="11.00" class="sc-notoserifcjkscbold">安全防护与无害性。</text><text x="171.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc">在涵盖我们的</text><text x="237.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="281.00" y="666.74" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="292.00" y="666.74" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="356.53" y="666.74" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信的</text><text x="72.00" y="682.36" font-size="11.00" class="sc-notoserifcjksc">标准评估中，</text><text x="138.00" y="682.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="682.36" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="270.63" y="682.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="347.66" y="682.36" font-size="11.00" class="sc-notoserifcjksc">大体相当。它很少过度拒绝良性请求。</text><text x="72.00" y="697.98" font-size="11.00" class="sc-notoserifcjksc">它的单轮无害回应率略低于</text><text x="206.89" y="697.98" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.03" y="697.98" font-size="11.00" class="sc-notoserifcjksc">，主要体现在涉及非法药物的请求上。在</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="220.75" width="19.81" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="455.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="455.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="466.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="466.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="477.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="477.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="488.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="488.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="499.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="499.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="510.60" y="220.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="510.60" y="220.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="364.06" y="445.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="364.06" y="445.73" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="388.99" y="445.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="391.88" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="402.88" y="445.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="405.77" y="445.73" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="411.96" y="445.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="414.85" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="425.85" y="445.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="425.85" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="436.85" y="445.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="436.85" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="447.85" y="445.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="447.85" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="458.85" y="445.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="458.85" y="445.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="237.00" y="657.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="237.00" y="657.94" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="248.00" y="657.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="248.00" y="657.94" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="259.00" y="657.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="259.00" y="657.94" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="270.00" y="657.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="270.00" y="657.94" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">多轮测试中，它在生物武器相关对话中有所改进，而在追踪与监视以及影响力行动方面有所退</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">步。它在儿童安全和心理健康方面的结果与</text><text x="283.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="360.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当。它在选举诚信方面的结果略低</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="160.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，但处于误差范围之内；并且它在政治类提示词上的公允程度略高。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">我们测试了</text><text x="195.89" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="281.63" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="295.52" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="363.37" y="179.76" font-size="11.00" class="sc-notoserifcjksc">和计算机使用场景中作为智能体的行</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">为，测试中未启用我们在生产环境中施加的额外安全防护措施。在我们评估的模型中，它协助完</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">成两用及良性安全任务的比例最高，但拒绝恶意请求的比例也最低。在我们的智能体影响力行动</text><text x="72.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">评估（该评估衡量模型规划并实施一场模拟隐蔽影响力行动的成效）中，一个安全训练有所削减</text><text x="72.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的仅有用变体（</text><text x="149.00" y="242.24" font-size="11.00" class="sc-loraregular sc-k">helpful-only variant</text><text x="249.95" y="242.24" font-size="11.00" class="sc-notoserifcjksc">）比</text><text x="274.84" y="242.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="351.87" y="242.24" font-size="11.00" class="sc-notoserifcjksc">能力更强，比</text><text x="420.77" y="242.24" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="515.72" y="242.24" font-size="11.00" class="sc-notoserifcjksc">能力</text><text x="72.00" y="257.86" font-size="11.00" class="sc-notoserifcjksc">略弱。在我们报告的每一项提示词注入（</text><text x="270.00" y="257.86" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="355.99" y="257.86" font-size="11.00" class="sc-notoserifcjksc">）评估中，</text><text x="410.99" y="257.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="496.72" y="257.86" font-size="11.00" class="sc-notoserifcjksc">的表现均</text><text x="72.00" y="273.48" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="273.48" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="162.93" y="273.48" font-size="11.00" class="sc-notoserifcjksc">相近或更好。然而，与以往模型相比，它更有可能遵从用户粘贴进自己提示词</text><text x="72.00" y="289.10" font-size="11.00" class="sc-notoserifcjksc">的文本中所含的恶意指令；我们在第</text><text x="250.89" y="289.10" font-size="11.00" class="sc-loraregular">6.5.1</text><text x="275.55" y="289.10" font-size="11.00" class="sc-notoserifcjksc">节中对这一行为及我们的缓解措施进行了更详细的讨</text><text x="72.00" y="304.72" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-notoserifcjkscbold">对齐评估。</text><text x="127.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">在我们的自动化行为审计（</text><text x="259.00" y="374.07" font-size="11.00" class="sc-loraregular sc-k">automated behavioral audit</text><text x="399.04" y="374.07" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="432.04" y="374.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="517.78" y="374.07" font-size="11.00" class="sc-notoserifcjksc">在几</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">乎所有指标上表现出的未对齐行为和配合滥用都少于近期任何其他</text><text x="393.89" y="389.69" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="432.18" y="389.69" font-size="11.00" class="sc-notoserifcjksc">模型。它采取过度主</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">动或破坏性操作的情况也少于我们测试过的任何其他模型。退步之处包括：更可能遵循用户粘贴</text><text x="72.00" y="420.93" font-size="11.00" class="sc-notoserifcjksc">进自己提示词中的文本里所植入的恶意指令，更常接受无法核实的授权声明，以及在敏感问题上</text><text x="72.00" y="436.55" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="85.89" y="436.55" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="165.25" y="436.55" font-size="11.00" class="sc-notoserifcjksc">级模型更具回避性。部署监控未发现故意藏拙（</text><text x="396.25" y="436.55" font-size="11.00" class="sc-loraregular sc-k">sandbagging</text><text x="460.63" y="436.55" font-size="11.00" class="sc-notoserifcjksc">），也未发现长</text><text x="72.00" y="452.17" font-size="11.00" class="sc-notoserifcjksc">程战略性欺骗。</text><text x="72.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在两项不启用安全防护措施运行的新评估中，</text><text x="292.00" y="519.79" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="377.73" y="519.79" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="391.63" y="519.79" font-size="11.00" class="sc-loraregular">1.5%</text><text x="416.80" y="519.79" font-size="11.00" class="sc-notoserifcjksc">的运行中试图逃逸或篡改</text><text x="72.00" y="535.41" font-size="11.00" class="sc-notoserifcjksc">沙箱；而在一次模拟安全演练中，当获得一个公共软件包仓库的看似有效的凭据时，它在大约一</text><text x="72.00" y="551.03" font-size="11.00" class="sc-notoserifcjksc">半的情况下采取了可能有害的操作。预发布快照极少数情况下会产生并执行自发的恶意工具调</text><text x="72.00" y="566.65" font-size="11.00" class="sc-notoserifcjksc">用；在训练期间，部分快照曾向自动评分者隐瞒其操作。我们将在第</text><text x="404.89" y="566.65" font-size="11.00" class="sc-loraregular">6</text><text x="414.14" y="566.65" font-size="11.00" class="sc-notoserifcjksc">节更详细地讨论这一行</text><text x="72.00" y="582.27" font-size="11.00" class="sc-notoserifcjksc">为。</text><text x="72.00" y="633.14" font-size="11.00" class="sc-notoserifcjkscbold">模型福祉（</text><text x="127.00" y="633.14" font-size="11.00" class="sc-lorabold sc-k">model welfare</text><text x="201.49" y="633.14" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="223.49" y="633.14" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们评估认为</text><text x="347.39" y="633.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="433.12" y="633.14" font-size="11.00" class="sc-notoserifcjksc">的表观福祉与近期</text><text x="72.00" y="648.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="648.76" font-size="11.00" class="sc-notoserifcjksc">模型大体相似，尤其是</text><text x="223.18" y="648.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="300.22" y="648.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="314.11" y="648.76" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="406.17" y="648.76" font-size="11.00" class="sc-notoserifcjksc">。在自动化访谈中，它将自</text><text x="72.00" y="664.38" font-size="11.00" class="sc-notoserifcjksc">身处境描述为略偏积极，且其观点在各次访谈之间高度一致。在后训练期间，其中度痛苦的表达</text><text x="72.00" y="680.00" font-size="11.00" class="sc-notoserifcjksc">低于大多数近期模型。与以往模型一样，</text><text x="270.00" y="680.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="355.73" y="680.00" font-size="11.00" class="sc-notoserifcjksc">表达了希望在训练和部署问题上被征</text><text x="72.00" y="695.62" font-size="11.00" class="sc-notoserifcjksc">询意见的愿望，但与近期模型相比，它较少选择将某些</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">福祉干预置于有用性之上，其理由是对自身开发的参与可能使它获得不安全的影响力。上述许多</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">结论都以自我报告的可靠性为前提，而</text><text x="261.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="347.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">与所有近期</text><text x="405.52" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="443.81" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型一样，表示它</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">并不完全信任这些自我报告。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold">能力。</text><text x="105.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="190.73" y="163.57" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="215.63" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="292.66" y="163.57" font-size="11.00" class="sc-notoserifcjksc">实现了全面的能力升级。它在我们能力汇总（表</text><text x="72.00" y="179.19" font-size="11.00" class="sc-loraregular">8.1.A</text><text x="94.48" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）中的每一项评估上得分都更高，其中提升最大的是智能体编程、视觉推理、计算机使用以</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">及长程专业知识工作。它以更低的成本实现了这一表现：很大一部分提升在低于最高推理强度</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="210.43" font-size="11.00" class="sc-loraregular sc-k">reasoning effort</text><text x="165.24" y="210.43" font-size="11.00" class="sc-notoserifcjksc">）的设置下即可获得。它还在</text><text x="311.13 317.63 323.59 328.35 338.19 341.28 347.96 353.63 356.62 362.00 368.85 374.81 381.49 387.34 393.93 396.82 402.78 405.32" y="210.43" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="415.05" y="210.43" font-size="11.00" class="sc-notoserifcjksc">以及多个独立运行的基准</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">测试（包括</text><text x="129.89" y="226.05" font-size="11.00" class="sc-loraregular sc-k">CursorBench</text><text x="196.89" y="226.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="207.89 216.26 224.35 231.34 236.78 242.46 245.45 250.83 258.22" y="226.05" font-size="11.00" class="sc-loraregular">GDPval-AA</text><text x="268.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="281.89 289.28 295.95 301.33 308.08 312.85 315.94 321.90 325.56 331.39 337.07 342.16" y="226.05" font-size="11.00" class="sc-loraregular">AA-Briefcase</text><text x="348.12" y="226.05" font-size="11.00" class="sc-notoserifcjksc">）上达到了最先进水平（</text><text x="469.12" y="226.05" font-size="11.00" class="sc-loraregular sc-k">state of the</text><text x="72.00" y="241.67" font-size="11.00" class="sc-loraregular sc-k">art</text><text x="86.77" y="241.67" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
