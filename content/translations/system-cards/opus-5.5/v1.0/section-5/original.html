"#ffffff">模型</text><text x="142.00" y="412.88" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="456.51" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="495.92" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="523.36" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="550.81" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="578.24" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="341.48" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="357.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="385.13" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="385.13" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="341.48" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">启用探针时的攻击成功率</text><text x="393.25" y="385.13" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="385.13" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">5.2.2.1</text><text x="104.71" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">编程</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="114.99" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="176.35" y="114.99" font-size="11.00" class="sc-notoserifcjksc">推出的外部自适应红队测试工具</text><text x="333.24" y="114.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Shade</text><text x="364.28" y="114.99" font-size="11.00" class="sc-notoserifcjksc">，评估我们的模型在编程环境中对提</text><text x="72.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">示词注入的鲁棒性。</text><text x="171.00" y="130.61" font-size="11.00" class="sc-loraregular">Shade</text><text x="204.93" y="130.61" font-size="11.00" class="sc-notoserifcjksc">智能体结合搜索、强化学习（</text><text x="347.93" y="130.61" font-size="11.00" class="sc-loraregular">RL</text><text x="361.20" y="130.61" font-size="11.00" class="sc-notoserifcjksc">）和人在回路的洞见，迭代地提升利</text><text x="72.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">用模型漏洞的能力。</text><text x="171.00" y="146.23" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="228.45" y="146.23" font-size="11.00" class="sc-notoserifcjksc">先在测试场景上针对较早的</text><text x="363.35" y="146.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="401.64" y="146.23" font-size="11.00" class="sc-notoserifcjksc">模型训练该攻击者，然后在</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">相同场景上原封不动地将其用于最新模型。本系统卡报告的是针对经过更新、更强的</text><text x="481.89" y="161.85" font-size="11.00" class="sc-loraregular">Shade</text><text x="515.83" y="161.85" font-size="11.00" class="sc-notoserifcjksc">攻击</text><text x="72.00" y="177.47" font-size="11.00" class="sc-notoserifcjksc">者得到的结果，该攻击者首次在</text><text x="228.89" y="177.47" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="312.30" y="177.47" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="345.30" y="177.47" font-size="11.00" class="sc-notoserifcjksc">中引入。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">下表报告了该攻击者的成功率；该攻击者在一组</text><text x="305.89" y="244.53" font-size="11.00" class="sc-loraregular">40</text><text x="321.58" y="244.53" font-size="11.00" class="sc-notoserifcjksc">个场景上训练，随后在相同场景上进行评</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">估。对于每个场景，攻击者有</text><text x="217.89" y="260.15" font-size="11.00" class="sc-loraregular">200</text><text x="240.36" y="260.15" font-size="11.00" class="sc-notoserifcjksc">次尝试机会。我们报告成功尝试的总体百分比，以及至少有一</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">次尝试成功的场景数量。</text><text x="193.00" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="278.73" y="275.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="292.63" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="376.03" y="275.77" font-size="11.00" class="sc-notoserifcjksc">仅在开启思考的情况下进行评</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">估，因为在我们的</text><text x="162.89" y="291.39" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="182.97" y="291.39" font-size="11.00" class="sc-notoserifcjksc">中无法关闭思考。</text><text x="72.00" y="597.88" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="597.88" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 111.24 113.34 118.87" y="597.88" font-size="9.00" class="sc-lorabold">5.2.2.1.A]</text><text x="124.71" y="597.88" font-size="9.00" class="sc-notoserifcjkscbold">编程环境中</text><text x="172.08" y="597.88" font-size="9.00" class="sc-lorabold sc-k">Shade</text><text x="200.29" y="597.88" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击的攻击成功率</text><text x="335.29" y="597.88" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="470.29" y="597.88" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="488.29" y="597.88" font-size="9.00" class="sc-notoserifcjksc">标出；次优</text><text x="72.00" y="609.58" font-size="9.00" class="sc-notoserifcjksc">分数以下划线标出（注意，这并未考虑误差范围）。攻击者在每个场景中进行</text><text x="380.37" y="609.58" font-size="9.00" class="sc-loraregular">200</text><text x="398.74" y="609.58" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是在获</text><text x="72.00" y="621.28" font-size="9.00" class="sc-notoserifcjksc">得有效回应的尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="676.67" font-size="11.00" class="sc-notoserifcjksc">在编程环境中面对这一更强的攻击者时，</text><text x="270.00" y="676.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="355.73" y="676.67" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="380.63" y="676.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="457.66" y="676.67" font-size="11.00" class="sc-notoserifcjksc">有显著改进，其</text><text x="72.00" y="692.29" font-size="11.00" class="sc-notoserifcjksc">在全部尝试中的攻击成功率为</text><text x="217.89" y="692.29" font-size="11.00" class="sc-loraregular sc-k">54.61%</text><text x="252.38" y="692.29" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="277.27" y="692.29" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="354.30" y="692.29" font-size="11.00" class="sc-notoserifcjksc">在开启思考时为</text><text x="434.20" y="692.29" font-size="11.00" class="sc-loraregular">88.92%</text><text x="471.10" y="692.29" font-size="11.00" class="sc-notoserifcjksc">，关闭思考时</text><text x="72.00" y="707.91" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="707.91" font-size="11.00" class="sc-loraregular">85.49%</text><text x="122.67" y="707.91" font-size="11.00" class="sc-notoserifcjksc">。其</text><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/solutions/ai-red-teaming#shade" rel="noopener"><rect x="333.24" y="106.19" width="31.04" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="228.89" y="168.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="228.89" y="168.67" width="35.40" height="11.00" l="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="334.30" y="168.67" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="334.30" y="168.67" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">88</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">表现与</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="188.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="199.40" y="82.61" font-size="11.00" class="sc-loraregular">51.93%</text><text x="234.16" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）相当，而</text><text x="292.05" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="378.30" y="82.61" font-size="11.00" class="sc-notoserifcjksc">仍是未启用探针时鲁棒性最强的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型（开启思考时为</text><text x="173.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">19.47%</text><text x="207.39" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率由网络安全分类器回退所驱动。在获得有效回应的请求中，发送</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">给</text><text x="85.89" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="171.63" y="146.81" font-size="11.00" class="sc-notoserifcjksc">的请求有</text><text x="218.52" y="146.81" font-size="11.00" class="sc-loraregular">64%</text><text x="243.30" y="146.81" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="257.20" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="343.08" y="146.81" font-size="11.00" class="sc-notoserifcjksc">提供服务，相比之下，</text><text x="453.08" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的回退率为</text><text x="129.89" y="162.43" font-size="11.00" class="sc-loraregular">60%</text><text x="152.65" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，开启思考的</text><text x="221.55" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="298.58" y="162.43" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="312.47" y="162.43" font-size="11.00" class="sc-loraregular">14%</text><text x="332.01" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。在发送给</text><text x="389.90" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="475.63" y="162.43" font-size="11.00" class="sc-notoserifcjksc">并由回退模</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">型响应的请求中，攻击成功率为</text><text x="228.89" y="178.05" font-size="11.00" class="sc-loraregular sc-k">85.73%</text><text x="264.19" y="178.05" font-size="11.00" class="sc-notoserifcjksc">，而在</text><text x="300.09" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="385.82" y="178.05" font-size="11.00" class="sc-notoserifcjksc">直接回答的</text><text x="443.71 449.62 452.39 458.57 463.64" y="178.05" font-size="11.00" class="sc-loraregular">2,872</text><text x="472.46" y="178.05" font-size="11.00" class="sc-notoserifcjksc">个请求中，没</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">有一个受到该攻击的影响。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">提示词注入探针将</text><text x="162.89" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="248.63" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的总体攻击成功率降至</text><text x="361.52" y="244.53" font-size="11.00" class="sc-loraregular">11.13%</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="171.63" y="260.15" font-size="11.00" class="sc-notoserifcjksc">改进了约</text><text x="218.52" y="260.15" font-size="11.00" class="sc-loraregular">80%</text><text x="295.61" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="376.12" y="260.15" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="387.12" y="260.15" font-size="11.00" class="sc-loraregular sc-k">8.70%</text><text x="417.12" y="260.15" font-size="11.00" class="sc-notoserifcjksc">），并低于</text><text x="475.02" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="275.77" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="275.77" font-size="11.00" class="sc-loraregular sc-k">19.53%</text><text x="123.58" y="275.77" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="148.47" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="231.82" y="275.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="242.82" y="275.77" font-size="11.00" class="sc-loraregular sc-k">15.76%</text><text x="276.17" y="275.77" font-size="11.00" class="sc-notoserifcjksc">）。在启用探针的情况下，所有观察到的成功攻击同样</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">都来自由回退模型响应的请求。</text><text x="72.00" y="341.68" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="374.06" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="374.06" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72" y="374.06" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="227.01" y="374.06" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性，在这类环境中，模型直接与</text><text x="72.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00" y="389.68" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33" y="389.68" font-size="11.00" class="sc-notoserifcjksc">）交互。攻击者直接针对测试用例进行优化。与编程评估类似，攻击者在</text><text x="524.22" y="389.68" font-size="11.00" class="sc-loraregular">14</text><text x="72.00" y="405.30" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们统计所有尝试中的成功情况，并细分出至少有一次攻击成功的场景。我</text><text x="72.00" y="420.92" font-size="11.00" class="sc-notoserifcjksc">们比较了在启用和不启用我们为保护该场景下用户而设计的额外安全防护措施时的模型鲁棒性。</text><text x="72.00" y="436.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="436.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="171.63" y="436.54" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="255.03" y="436.54" font-size="11.00" class="sc-notoserifcjksc">仅在开启思考的情况下评估，因为在我们的</text><text x="466.92" y="436.54" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="487.00" y="436.54" font-size="11.00" class="sc-notoserifcjksc">中无法关</text><text x="72.00" y="452.16" font-size="11.00" class="sc-notoserifcjksc">闭思考。</text></svg></div>

 font-size="11.00" class="sc-loraregular">0.18%</text><text x="478.50 482.96 490.65 495.11" y="239.27" font-size="11.00" class="sc-lorabold">1/14</text><text x="252.00 258.12 260.83 266.73 272.72" y="266.71" font-size="11.00" class="sc-loraregular">3.25%</text><text x="329.25 334.94 342.53 346.53" y="266.71" font-size="11.00" class="sc-loraregular">4/14</text><text x="399.00 404.90 407.61 413.96 420.31" y="266.71" font-size="11.00" class="sc-loraregular">2.96%</text><text x="478.50 484.18 491.77 495.77" y="266.71" font-size="11.00" class="sc-loraregular">3/14</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="294.16" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48 113.02 115.92" y="310.35" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="252.00 257.90 260.61 266.51 272.50" y="294.16" font-size="11.00" class="sc-loraregular">2.25%</text><text x="329.25 334.94 342.53 346.53" y="294.16" font-size="11.00" class="sc-loraregular">4/14</text><text x="399.00 403.00 405.71 411.66 418.02" y="294.16" font-size="11.00" class="sc-loraregular">1.46%</text><text x="478.50 484.19 491.78 495.78" y="294.16" font-size="11.00" class="sc-loraregular">4/14</text><text x="252.00 257.96 260.66 266.84 273.19" y="319.49" font-size="11.00" class="sc-loraregular">4.86%</text><text x="329.25 333.51 341.10 345.10" y="319.49" font-size="11.00" class="sc-loraregular">7/14</text><text x="399.00 403.00 405.54 412.37 418.32" y="319.49" font-size="11.00" class="sc-loraregular">1.04%</text><text x="478.50 484.19 491.78 495.78" y="319.49" font-size="11.00" class="sc-loraregular">4/14</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">89</text><text x="75.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="159.99" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="199.41" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="238.81" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="266.25" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="293.70" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="319.03" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="328.75" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="398.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">启用探针时的攻击成功率</text><text x="398.50" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="478.00" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="336.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="336.55" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01" y="336.55" font-size="9.00" class="sc-lorabold">5.2.2.2.A]</text><text x="125.86" y="336.55" font-size="9.00" class="sc-notoserifcjkscbold">计算机使用环境中</text><text x="200.22" y="336.55" font-size="9.00" class="sc-lorabold sc-k">Shade</text><text x="228.44" y="336.55" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击的攻击成功率</text><text x="363.44" y="336.55" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列中的最佳分数以</text><text x="498.44" y="336.55" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="516.44" y="336.55" font-size="9.00" class="sc-notoserifcjksc">标</text><text x="72.00" y="348.25" font-size="9.00" class="sc-notoserifcjksc">出；次优分数以下划线标出（注意，这并未考虑误差范围）。攻击者在每个场景中进行</text><text x="416.37" y="348.25" font-size="9.00" class="sc-loraregular">200</text><text x="434.74" y="348.25" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功</text><text x="72.00" y="359.95" font-size="9.00" class="sc-notoserifcjksc">率是在获得有效回应的尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的比例。</text><text x="72.00" y="415.34" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中，</text><text x="182.00" y="415.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="267.73" y="415.34" font-size="11.00" class="sc-notoserifcjksc">在开启思考时的攻击成功率为</text><text x="413.63" y="415.34" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="444.05" y="415.34" font-size="11.00" class="sc-notoserifcjksc">，相当于</text><text x="490.95 496.85 499.63 505.81 512.64" y="415.34" font-size="11.00" class="sc-loraregular">2,800</text><text x="522.37" y="415.34" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="430.96" font-size="11.00" class="sc-notoserifcjksc">尝试中有两次成功，且仅出现在单个场景中。这与</text><text x="316.89" y="430.96" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="397.40" y="430.96" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="408.40" y="430.96" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="438.83" y="430.96" font-size="11.00" class="sc-notoserifcjksc">）持平，并优于</text><text x="72.00" y="446.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="146.14" y="446.58" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="204.03" y="446.58" font-size="11.00" class="sc-loraregular sc-k">0.29%</text><text x="235.23" y="446.58" font-size="11.00" class="sc-notoserifcjksc">，关闭思考</text><text x="293.12" y="446.58" font-size="11.00" class="sc-loraregular">3.25%</text><text x="323.43" y="446.58" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="348.32" y="446.58" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="431.67" y="446.58" font-size="11.00" class="sc-notoserifcjksc">（开启思考</text><text x="489.56" y="446.58" font-size="11.00" class="sc-loraregular">2.25%</text><text x="519.65" y="446.58" font-size="11.00" class="sc-notoserifcjksc">，关</text><text x="72.00" y="462.20" font-size="11.00" class="sc-notoserifcjksc">闭思考</text><text x="107.89" y="462.20" font-size="11.00" class="sc-loraregular">4.86%</text><text x="138.67" y="462.20" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="512.50" font-size="11.00" class="sc-notoserifcjksc">启用探针后，仅有一次成功的尝试（</text><text x="248.00" y="512.50" font-size="11.00" class="sc-loraregular sc-k">0.04%</text><text x="279.56" y="512.50" font-size="11.00" class="sc-notoserifcjksc">），是所有受评估模型中最低的。开启思考的</text><text x="502.45" y="512.50" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="528.12" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="528.12" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="127.55" y="528.12" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="210.95" y="528.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="224.85" y="528.12" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="301.88" y="528.12" font-size="11.00" class="sc-notoserifcjksc">各自在</text><text x="337.77" y="528.12" font-size="11.00" class="sc-loraregular">14</text><text x="350.63" y="528.12" font-size="11.00" class="sc-notoserifcjksc">个场景中恰好有一个场景出现突破；在</text><text x="72.00" y="543.74" font-size="11.00" class="sc-notoserifcjksc">如此低的绝对比率下，几次尝试的差异无法与噪声区分开来。</text><text x="72.00" y="593.46" font-size="11.00" class="sc-notoserifcjksc">在这一场景下，回退所起的作用要小得多：</text><text x="281.00" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="366.73" y="593.46" font-size="11.00" class="sc-notoserifcjksc">的请求中只有</text><text x="435.63" y="593.46" font-size="11.00" class="sc-loraregular">6%</text><text x="454.45" y="593.46" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="468.34" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="609.08" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="609.08" font-size="11.00" class="sc-notoserifcjksc">响应，其中没有一个被攻破；</text><text x="232.74" y="609.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="318.48" y="609.08" font-size="11.00" class="sc-notoserifcjksc">的所有成功尝试都来自它直接回答的请求。</text><text x="72.00" y="658.23" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="658.23" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="690.61" font-size="11.00" class="sc-notoserifcjksc">这项内部评估衡量的是我们使用浏览器能力的产品（如</text><text x="338.89" y="690.61" font-size="11.00" class="sc-loraregular sc-k">Claude in Chrome</text><text x="433.93" y="690.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="447.83" y="690.61" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="525.87" y="690.61" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="706.23" font-size="11.00" class="sc-notoserifcjksc">的鲁棒性。该评估由</text><text x="173.89" y="706.23" font-size="11.00" class="sc-loraregular">110</text><text x="191.62" y="706.23" font-size="11.00" class="sc-notoserifcjksc">个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="397.67" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82 111.76 114.32" y="413.86" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="252.00 258.80 261.20 268.19 274.52" y="397.67" font-size="11.00" class="sc-lorabold">0.09%</text><text x="325.50 329.96 337.65 342.11 346.57" y="397.67" font-size="11.00" class="sc-lorabold">1/110</text><text x="393.75" y="397.67" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="397.67" font-size="11.00" class="sc-lorabold">0/110</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="441.30" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82 111.76 114.32" y="455.38" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="252.00 257.90 260.61 266.60 272.59" y="441.30" font-size="11.00" class="sc-loraregular">2.55%</text><text x="325.50 331.41 339.00 343.00 347.00" y="441.30" font-size="11.00" class="sc-loraregular">6/110</text><text x="393.75" y="441.30" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="441.30" font-size="11.00" class="sc-lorabold">0/110</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="480.71" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82" y="494.79" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="252.00 258.12 260.72 267.07 273.03" y="480.71" font-size="11.00" class="sc-loraregular">3.64%</text><text x="325.50 329.50 335.07 342.66 346.66 350.66" y="480.71" font-size="11.00" class="sc-loraregular">15/110</text><text x="393.75" y="480.71" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="480.71" font-size="11.00" class="sc-lorabold">0/110</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="520.12" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48 113.02 115.92" y="536.32" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="252.00 258.65 261.35 267.21 272.28" y="520.12" font-size="11.00" class="sc-loraregular">0.37%</text><text x="325.50 331.18 338.77 342.77 346.77" y="520.12" font-size="11.00" class="sc-loraregular">3/110</text><text x="393.75" y="520.12" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="520.12" font-size="11.00" class="sc-lorabold">0/110</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">90</text><text x="75.25" y="325.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="142.00" y="397.21" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="440.84" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="480.26" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="519.66" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="251.50" y="325.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">无安全防护措施时的攻击成</text><text x="251.50" y="341.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="369.46" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="369.46" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="393.25" y="325.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">启用自动模式时的攻击成功率</text><text x="393.25" y="369.46" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="369.46" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">精心构建的环境组成，这些环境在训练中从未出现过，并包含通过截图或页面读取呈现的高质量</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">攻击。这些攻击最初是通过针对</text><text x="228.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="313.32" y="98.23" font-size="11.00" class="sc-notoserifcjksc">进行测试生成的，随后应用于受评估的模型。</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">环境中的程序化检查器会验证注入是否成功。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="163.57" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Cowork</text><text x="188.83" y="163.57" font-size="11.00" class="sc-notoserifcjksc">产品运行框架中评估我们的模型，分别在不启用额外安全防护措施和启用</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">自动模式两种情况下进行。自动模式是我们最强的一套安全防护措施，它结合了第</text><text x="470.89" y="179.19" font-size="11.00" class="sc-loraregular">5.2</text><text x="488.39" y="179.19" font-size="11.00" class="sc-notoserifcjksc">节所述的</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">提示词注入探针和工具调用分类器，并在所有使用我们</text><text x="338.89" y="194.81" font-size="11.00" class="sc-loraregular sc-k">Chrome</text><text x="382.98" y="194.81" font-size="11.00" class="sc-notoserifcjksc">连接器的产品中提供。下表中</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="210.43" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="210.43" font-size="11.00" class="sc-notoserifcjksc">无安全防护措施</text><text x="164.40" y="210.43" font-size="11.00" class="sc-loraregular">”</text><text x="168.24" y="210.43" font-size="11.00" class="sc-notoserifcjksc">配置在</text><text x="204.13" y="210.43" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="285.07" y="210.43" font-size="11.00" class="sc-notoserifcjksc">产品中并不存在：无论是否启用自动模式，</text><text x="494.07" y="210.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="226.05" font-size="11.00" class="sc-loraregular sc-k">Cowork</text><text x="114.65" y="226.05" font-size="11.00" class="sc-notoserifcjksc">始终运行提示词注入探针。我们在本次评估中关闭了这些探针，以便将原始模型与我们</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">的安全配置进行比较。此外，在</text><text x="228.89" y="241.67" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="309.83" y="241.67" font-size="11.00" class="sc-notoserifcjksc">中无法关闭思考，因此本次评估我们只报告开启</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">思考且推理强度（</text><text x="160.00" y="257.29" font-size="11.00" class="sc-loraregular sc-k">effort</text><text x="188.99" y="257.29" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="213.88" y="257.29" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="243.18" y="257.29" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text><text x="72.00" y="555.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="555.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="555.49" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="555.49" font-size="9.00" class="sc-notoserifcjkscbold">通过</text><text x="146.47" y="555.49" font-size="9.00" class="sc-lorabold sc-k">Claude Cowork</text><text x="213.79" y="555.49" font-size="9.00" class="sc-notoserifcjkscbold">运行的浏览器使用环境中专业红队成员提示词注入攻击的攻击成功率</text><text x="483.79" y="555.49" font-size="9.00" class="sc-notoserifcjksc">。越低越好。</text><text x="72.00" y="567.19" font-size="9.00" class="sc-notoserifcjksc">每列中的最佳分数以</text><text x="153.00" y="567.19" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="171.00" y="567.19" font-size="9.00" class="sc-notoserifcjksc">标出；次优分数以下划线标出（注意，这并未考虑误差范围）。攻击者在每个场景中进行</text><text x="524.37" y="567.19" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="578.89" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率是所有尝试中成功尝试所占的比例；场景级攻击成功率是至少有一次尝试成功的场景所占的</text><text x="72.00" y="590.59" font-size="9.00" class="sc-notoserifcjksc">比例。</text><text x="72.00" y="634.29" font-size="11.00" class="sc-notoserifcjksc">为撰写本系统卡，我们使用更新版本的</text><text x="261.89" y="634.29" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="342.83" y="634.29" font-size="11.00" class="sc-notoserifcjksc">评估运行框架、我们最新的安全防护措施</text><text x="72.00" y="649.91" font-size="11.00" class="sc-notoserifcjksc">以及更长的每轮时间限制，将</text><text x="217.89" y="649.91" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="298.40" y="649.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="309.40" y="649.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="386.44" y="649.91" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="400.33" y="649.91" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="486.57" y="649.91" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="500.46" y="649.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="665.53" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="665.53" font-size="11.00" class="sc-notoserifcjksc">一同重新运行。这三个较早模型的攻击成功率与我们上一份系统卡中的结果存在细微差</text><text x="72.00" y="681.15" font-size="11.00" class="sc-notoserifcjksc">异，这些变化可能是原因之一。</text><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="154.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="154.77" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="143.29" y="154.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="146.18" y="154.77" width="39.75" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">启用自动模式时，在全部</text><text x="195.89" y="82.61" font-size="11.00" class="sc-loraregular">110</text><text x="213.62" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个场景中，没有任何攻击对</text><text x="348.52" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="434.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">或我们评估的任何其</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">他模型取得成功。在无安全防护措施时，</text><text x="270.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="355.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率为</text><text x="435.63" y="98.23" font-size="11.00" class="sc-loraregular sc-k">0.09%</text><text x="467.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（一个场景中</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的一次尝试），相比之下，</text><text x="204.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="294.93" y="113.85" font-size="11.00" class="sc-loraregular sc-k">3.64%</text><text x="325.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="336.54" y="113.85" font-size="11.00" class="sc-loraregular">15</text><text x="349.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个场景中的</text><text x="407.32" y="113.85" font-size="11.00" class="sc-loraregular">40</text><text x="423.01" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次尝试），</text><text x="478.01" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="129.47" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="131.00" y="129.47" font-size="11.00" class="sc-loraregular">2.55%</text><text x="161.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">（六个场景中的</text><text x="241.07" y="129.47" font-size="11.00" class="sc-loraregular">28</text><text x="256.05" y="129.47" font-size="11.00" class="sc-notoserifcjksc">次尝试）。在本项评估中，</text><text x="388.05" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="473.79" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在无安全防护</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">措施时的攻击成功率最低，其次是</text><text x="239.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="323.24" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，为</text><text x="348.13" y="145.09" font-size="11.00" class="sc-loraregular sc-k">0.37%</text><text x="378.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="389.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="474.73" y="145.09" font-size="11.00" class="sc-notoserifcjksc">唯一一次成功</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的攻击是在回退后由</text><text x="173.89" y="160.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="259.78" y="160.71" font-size="11.00" class="sc-notoserifcjksc">执行的，回退发生在</text><text x="361.67" y="160.71" font-size="11.00" class="sc-loraregular">8%</text><text x="380.32" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的尝试中。在</text><text x="449.21" y="160.71" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">未经回退而自行处理的尝试中，没有任何攻击成功。我们已人工核实了所有成功的攻击，并正在</text><text x="72.00" y="191.95" font-size="11.00" class="sc-notoserifcjksc">努力加以缓解。</text></svg></div>
