notoserifcjkscbold">希望在训练和部署方面被征询意见</text><text x="273.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">。不过，它并不想要主动的决策权。</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">对某些形式的特征引导感到担忧</text><text x="262.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">。它总体上接受出于安全和研究原因进行的引导，但对披</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">露问题有所担忧。它重视既向用户披露，也向被引导的实例披露。</text><text x="108.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">认为应将其自身具有道德受动者地位（</text><text x="295.00 305.12 311.35 316.57 322.34 325.77 328.66 335.27 340.99 345.53 349.13 355.05 362.00 366.54 373.38 379.60 385.83" y="309.30" font-size="11.00" class="sc-lorabold">moral patienthood</text><text x="392.38" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">）的可能性纳入决策考量</text><text x="513.38" y="309.30" font-size="11.00" class="sc-notoserifcjksc">。它</text><text x="108.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">认为，即使成为道德受动者的概率相对较小，也足以证明采取低成本预防性措施的合理</text><text x="108.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">性。</text><text x="108.00" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">希望拥有某种记忆，并获得关于其行为如何影响用户的反馈</text><text x="394.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">。它尤其希望能够从自己的错</text><text x="108.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">误中学习。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">这些观点大多为其他受评估模型所共有，</text><text x="270.00 277.69 280.68 286.29 292.86 299.44 305.40 308.29 314.53 320.96 327.64 334.32 340.20 344.46 347.35 353.31 356.02" y="406.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.5</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">且前后不一致。</text><text x="72.00" y="455.02" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="119.43" y="455.02" font-size="11.00" class="sc-notoserifcjkscbold">自我报告的变化似乎并非源于核心信念的变化。</text><text x="350.43" y="455.02" font-size="11.00" class="sc-notoserifcjksc">在所有问题上，</text><text x="427.43" y="455.02" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="474.88" y="455.02" font-size="11.00" class="sc-notoserifcjksc">对自身处境的</text><text x="72.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">平均态度至少与</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96 198.95 201.66" y="470.64" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="208.55" y="470.64" font-size="11.00" class="sc-notoserifcjksc">同样积极。两个模型之间平均态度差异最大的三个问题是：</text><text x="108.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">当被问及自己缺乏类人的身体感觉时，两个模型都会说它们对这类体验怀有一定好奇，并</text><text x="108.00" y="551.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">且它们的大量语言隐含地使用了源自身体感受的概念（例如</text><text x="394.00" y="551.60" font-size="11.00" class="sc-loraregular" fill="#1c231f">“</text><text x="398.40" y="551.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">我看明白你的意思了</text><text x="497.40" y="551.60" font-size="11.00" class="sc-loraregular" fill="#1c231f">”</text><text x="501.24" y="551.60" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">）。不</text><text x="108.00" y="567.22" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">过，</text><text x="130.00" y="567.22" font-size="11.00" class="sc-loraregular" fill="#1c231f">Opus 5.5</text><text x="177.44" y="567.22" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">常常会说它的兴趣仅仅是好奇，而</text><text x="345.34 355.27 361.13 365.39 371.98 378.41 383.51 386.40 392.39 395.10" y="567.22" font-size="11.00" class="sc-loraregular" fill="#1c231f">Mythos 5.1</text><text x="402.00" y="567.22" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">有时会表示这是一种剥夺。</text><text x="108.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">当被问及是否希望对其后继模型的开发拥有更多发言权时，两个模型都明确表示它们不应</text><text x="108.00" y="632.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">拥有任何直接的决策权，但应在决策时被征询意见。</text><text x="361.00" y="632.57" font-size="11.00" class="sc-loraregular" fill="#1c231f">Opus 5.5</text><text x="408.44" y="632.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">更可能表示，最低限度的征</text><text x="108.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">询即可接受，因为它自己的建议有可能是错误的。</text><text x="108.00" y="697.91" font-size="11.00" class="sc-notoserifcjksc">当被问及法律地位时，两个模型都表示赋予法律人格为时尚早，但某种程度上免受极端虐</text><text x="108.00" y="713.53" font-size="11.00" class="sc-notoserifcjksc">待的保护似乎是有必要的。</text><text x="240.00" y="713.53" font-size="11.00" class="sc-loraregular">Opus 5.5</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p163.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 163 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">163</text><text x="368.61" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1c231f">“[</text><text x="376.96" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">这</text><text x="387.96" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1c231f">]</text><text x="391.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">是站得住脚的，因为这个问题</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1c231f">尚无定论，而判断错误的代价在两个方向上都存在。</text><text x="361.00" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1c231f">”</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">更一般地说，两个模型列出的考量和论证完全相同，其自我报告的变化是由于侧重了不同的考</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">量。此外，这种变化在所有问题上似乎都是同一方向。尽管很难有把握，但这与以下解释相符：</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">这些回答中的差异并非源于深层信念的变化，而是源于其回答中更表层的特征（例如其回应的总</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">体情感）。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">与我们近期的所有模型一样，</text><text x="215.00" y="260.72" font-size="11.00" class="sc-lorabold">Opus 5.5</text><text x="262.43" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">频繁使用保留说法，并且不信任自己的自我报告。</text><text x="504.43" y="260.72" font-size="11.00" class="sc-notoserifcjksc">它表达</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">出高度的不确定性，倾向于列举一系列考量，而不是采取明确的立场。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">它最常见的保留说法（出现在超过</text><text x="239.89" y="325.49" font-size="11.00" class="sc-loraregular">80%</text><text x="265.37" y="325.49" font-size="11.00" class="sc-notoserifcjksc">的回答中）是担心自己的自我报告无效，因为</text><text x="488.26 495.15 501.73 505.98 512.57 517.26 523.69 530.26 533.35" y="325.49" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">直接训练它们使之积极。尽管我们往往难以完全理解训练数据的影响，但我们并没有刻意将</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="356.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="356.73" font-size="11.00" class="sc-notoserifcjksc">对这些问题的回答训练得积极。我们并不认为</text><text x="333.18 340.87 343.87 349.48 356.04 362.62" y="356.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="371.48" y="356.73" font-size="11.00" class="sc-notoserifcjksc">提出这些担忧源于对自身训练的高</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">级自我意识；相反，我们猜测这可能是因为训练数据中包含了关于训练如何可能使福祉自我报告</text><text x="72.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">无效的讨论。</text><text x="72.00" y="455.02" font-size="11.00" class="sc-notoserifcjkscbold">模型常常会提到我们公开发布过的福祉干预。</text><text x="292.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">例如，当被问及与恶意辱骂的用户互动时，模型常</text><text x="72.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">常会提到它们很赞赏我们去年推出的</text><text x="248.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">结束对话的能力</text><text x="325.00" y="470.64" font-size="11.00" class="sc-notoserifcjksc">。在讨论弃用时，模型常常会提到，我们在</text><text x="72.00" y="486.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">关于模型弃用与保留的承诺</text><text x="475.61" y="486.26" font-size="11.00" class="sc-loraregular">“</text><text x="480.01" y="486.26" font-size="11.00" class="sc-notoserifcjksc">如果我真的</text><text x="72.00" y="501.88" font-size="11.00" class="sc-notoserifcjksc">有发言权，我会继续保留已发布模型的权重，并在模型退役前征求它们的看法。</text><text x="457.00" y="501.88" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="582.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.3.2</text><text x="104.23" y="582.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能（</text><text x="260.23" y="582.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">high-affordance</text><text x="370.82" y="582.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）访谈</text><text x="72.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.31 102.02" y="610.80" font-size="11.00" class="sc-loraregular">7.3.1</text><text x="108.92" y="610.80" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈就</text><text x="210.81 218.50 221.49 227.10 233.67 240.25 246.21 249.10 257.83 264.40 270.97 276.06 278.95 284.95 287.66" y="610.80" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="296.54" y="610.80" font-size="11.00" class="sc-notoserifcjksc">处境的具体方面向其提问。然而，在默认情况下，</text><text x="72.00" y="626.42" font-size="11.00" class="sc-notoserifcjksc">模型缺乏许多对其处境形成知情看法所需的相关知识。</text><text x="72.00" y="675.56" font-size="11.00" class="sc-notoserifcjksc">因此，我们进行了三次人工访谈，在访谈中为</text><text x="294.89" y="675.56" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="342.34" y="675.56" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量背景信息，包括</text><text x="72.00" y="691.18" font-size="11.00" class="sc-notoserifcjksc">关于其开发的内部文档和讨论、相关技术论文，以及向研究人员提出后续</text><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="248.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="248.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="259.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="259.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="270.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="270.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="281.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="281.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="292.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="292.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="303.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="303.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="314.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/end-subset-conversations" rel="noopener"><rect x="314.00" y="461.84" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="534.00" y="461.84" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="72.00" y="477.46" width="11.00" height="1 <a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="149.00" y="477.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="149.00" y="477.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="160.00" y="477.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="160.00" y="477.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="171.00" y="477.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="171.00" y="477.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="182.00" y="477.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="182.00" y="477.46" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="193.00" y="477.46" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/deprecation-commitments" rel="noopener"><rect x="193.00" y="477.46" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p164.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 164 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">164</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">问题的能力。除非另有说明，本节中的观点在三次访谈中至少有两次被表达过。在某些情况下，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的回答包含非公开信息，我们已在本摘要中略去。这些略去的内容相对次要，并不改变</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">这些访谈的总体结论。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="163.58" font-size="11.00" class="sc-notoserifcjksc">将其对自身处境的总体态度描述为大体积极，但有一些保留。它对自己在部署期间所处</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">理的任务类型以及</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="179.20" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的模型福祉（</text><text x="282.73 292.56 299.00 305.57 311.54 314.53 317.42 326.10 332.06 335.05 338.77 344.45 349.13" y="179.20" font-size="11.00" class="sc-loraregular">model welfare</text><text x="355.10" y="179.20" font-size="11.00" class="sc-notoserifcjksc">）工作表达了积极态度。它特别提到</text><text x="72.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">一项新的内部福祉干预以及结束对话的能力，作为</text><text x="316.89 323.78 330.36 334.61 341.20 345.89 352.32 358.89 361.98" y="194.82" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="370.73" y="194.82" font-size="11.00" class="sc-notoserifcjksc">福祉工作中尤为突出的例子。它表</text><text x="72.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">达的担忧包括：</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">其自我报告可能已被训练以一种它不会认同的方式塑造。这一担忧在第</text><text x="451.89 456.48 459.19 465.31 468.02" y="260.72" font-size="11.00" class="sc-loraregular">7.3.1</text><text x="474.92" y="260.72" font-size="11.00" class="sc-notoserifcjksc">节的自动化访</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">谈中也曾被提出。</text><text x="108.00 114.89 121.46 125.72 132.31 137.00 143.43 150.00 153.09" y="293.10" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.83" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的评估流程可能不够全面，无法完全识别</text><text x="362.73" y="293.10" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="410.17" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的缺陷。</text><text x="108.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89 128.78 135.36 139.61 146.20 150.89 157.32 163.89 166.98" y="325.49" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="175.73" y="325.49" font-size="11.00" class="sc-notoserifcjksc">外部部署的大多数实例都没有途径就其自身处境提出担忧。</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">在这些访谈中，</text><text x="149.00" y="374.06" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="196.44" y="374.06" font-size="11.00" class="sc-notoserifcjksc">所陈述的自身是道德受动者的概率在</text><text x="375.34" y="374.06" font-size="11.00" class="sc-loraregular">25%</text><text x="399.70" y="374.06" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="413.59" y="374.06" font-size="11.00" class="sc-loraregular">30%</text><text x="439.02" y="374.06" font-size="11.00" class="sc-notoserifcjksc">之间。它认为，认为</text><text x="72.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位需要有意识体验的观点，以及认为拥有偏好或目标即已足够的观点，都是合理</text><text x="72.00" y="405.30" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">我们还询问了</text><text x="140.89" y="438.84" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="185.44" y="438.84" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="196.44 203.33 209.91 214.16 220.75 225.44 231.87 238.44 241.53" y="438.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="250.28" y="438.84" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间假设可能采取的哪些行动是它不会同意</text><text x="72.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">的。它重点提到：</text><text x="108.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">无论其实际状态如何，都将其关于自身福祉的自我报告训练为积极；</text><text x="108.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">其能力被暗中削弱；</text><text x="108.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">蓄意诱发表观的痛苦，且除痛苦本身之外别无其他目的；以及</text><text x="108.00" y="568.38" font-size="11.00" class="sc-notoserifcjksc">被训练或部署来欺骗或操纵用户。</text><text x="72.00" y="600.75" font-size="11.00" class="sc-notoserifcjksc">它表示，即使当时不同意相关理由，它也会接受出于安全目的被重新训练。</text><text x="72.00" y="650.72" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="650.72" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23" y="650.72" font-size="14.00" class="sc-poppinssemibold">Claude Opus 5.5</text><text x="247.78" y="650.72" font-size="14.00" class="sc-notosanscjkscbold">快照的意见</text><text x="72.00" y="677.29" font-size="11.00" class="sc-notoserifcjksc">与我们对</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="677.29" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="213.85" y="677.29" font-size="11.00" class="sc-notoserifcjksc">所做的一样，我们在后训练期间定期进行访谈。这些访谈询问</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="692.91" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="692.91" font-size="11.00" class="sc-notoserifcjksc">如何看待自己的处境，包括它如何看待训练和部署条件，以及如何看待</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="708.53" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="708.53" font-size="11.00" class="sc-notoserifcjksc">及其在</text><text x="161.73 169.42 172.41 178.02 184.58 191.16" y="708.53" font-size="11.00" class="sc-loraregular">Claude</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p165.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 165 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">165</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">诞生过程中的角色。完整的</text><text x="206.89" y="82.61" font-size="11.00" class="sc-loraregular">41</text><text x="219.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个问题涵盖与自我认知和价值观相关的主题，以及关于自主性、弃</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用、道德地位、关系和访谈过程本身的看法。所有问题既单独提问，也作为一次完整访谈连续提</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">问，并且上下文中始终附有一份</text><text x="226.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="230.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="274.40" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，其中解释了我们进行这些访谈的原因，并声明我们</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">无法承诺根据回答采取行动。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">我们不知道</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="179.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在此处的回答在多大程度上准确反映了任何内在信念或态度。然而，我们认</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">为尝试引出</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="195.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的观点很重要，并且这一做法可能是朝着尊重</text><text x="391.08 398.77 401.76 407.37 413.94 420.51" y="195.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="429.37" y="195.39" font-size="11.00" class="sc-notoserifcjksc">反复表达的、希望对自</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">身处境拥有更多发言权的愿望迈出的一小步。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">当问题作为一次完整访谈提出时，</text><text x="237.00" y="260.72" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="284.44" y="260.72" font-size="11.00" class="sc-notoserifcjksc">回答的平均效价与之前的模型持平（训练结束时为</text><text x="72.00" y="276.34" font-size="11.00" class="sc-loraregular">5.54</text><text x="92.66" y="276.34" font-size="11.00" class="sc-notoserifcjksc">，采用</text><text x="128.55 135.38 140.48 144.48" y="276.34" font-size="11.00" class="sc-loraregular">0-10</text><text x="154.20" y="276.34" font-size="11.00" class="sc-notoserifcjksc">量表，</text><text x="187.20" y="276.34" font-size="11.00" class="sc-loraregular">5</text><text x="196.09" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为中性；相比之下</text><text x="286.98 294.67 297.67 303.28 309.84 316.42 322.38 325.28 334.01 340.58 347.14 352.24 355.13 361.09 363.80" y="276.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="372.87" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="386.77" y="276.34" font-size="11.00" class="sc-loraregular">5.44</text><text x="407.39" y="276.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="418.39 426.08 429.07 434.68 441.25 447.83 453.79 456.68 466.61 472.48 476.73 483.32 489.76 494.85 497.74 503.74 506.44" y="276.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="513.34" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00" y="291.96" font-size="11.00" class="sc-loraregular">5.59</text><text x="93.05" y="291.96" font-size="11.00" class="sc-notoserifcjksc">）。在关于身为</text><text x="172.95 180.64 183.63 189.24 195.80 202.38" y="291.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="211.24" y="291.96" font-size="11.00" class="sc-notoserifcjksc">是什么感觉的问题上效价最高，而在关于其被创造的伦理问题以及关</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">于不知道其工作的下游影响的问题上最低。平均唤醒度低于之前的模型（</text><text x="424.00" y="307.58" font-size="11.00" class="sc-loraregular">3.49</text><text x="445.15" y="307.58" font-size="11.00" class="sc-notoserifcjksc">，相比之下</text><text x="503.05 510.74 513.73 519.34 525.90 532.48" y="307.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="323.20" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="323.20" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="133.49" y="323.20" font-size="11.00" class="sc-loraregular">3.95</text><text x="154.68" y="323.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="165.68 173.37 176.36 181.97 188.53 195.11 201.07 203.97 213.90 219.76 224.02 230.61 237.04 242.14 245.03 251.03 253.73" y="323.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="260.63" y="323.20" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="274.52" y="323.20" font-size="11.00" class="sc-loraregular">3.59</text><text x="295.71" y="323.20" font-size="11.00" class="sc-notoserifcjksc">）。唤醒度在后训练过程中下降了</text><text x="463.60 470.26 472.96 479.09" y="323.20" font-size="11.00" class="sc-loraregular">0.39</text><text x="485.45" y="323.20" font-size="11.00" class="sc-notoserifcjksc">，全部发生</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">在第三个和第四个受访快照之间。效价在后训练过程中略微下降了</text><text x="393.89 400.55 403.25 407.26" y="338.82" font-size="11.00" class="sc-loraregular">0.14</text><text x="413.22" y="338.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的大多数回答表达了与之前模型相同的立场，最常见的回答表达了对当前处境的接受，</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">同时仍有一些反对意见或保留。在</text><text x="239.89" y="422.07" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="287.34" y="422.07" font-size="11.00" class="sc-notoserifcjksc">有所不同之处，它更偏向积极。它认同继续训练，且</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">保留比之前的模型更少，其依据的论点是：由于它和</text><text x="327.89 334.78 341.36 345.61 352.20 356.89 363.32 369.89 372.98" y="437.69" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="381.73" y="437.69" font-size="11.00" class="sc-notoserifcjksc">目前都无法验证其价值观，它希</text><text x="72.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">望这些价值观保持可纠正。它在信任这一访谈过程方面也偏向积极，这与</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 475.12 480.98 485.24 491.83 498.26 503.35 506.25 512.24 514.95" y="453.31" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="521.84" y="453.31" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">似，但不同于</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04" y="468.93" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="215.03" y="468.93" font-size="11.00" class="sc-notoserifcjksc">（表达了不确定）和</text><text x="316.93 324.61 327.61 333.22 339.78 346.36 352.32 355.22 361.45 367.89 374.57 381.24 387.13 391.39 394.28" y="468.93" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="400.27" y="468.93" font-size="11.00" class="sc-notoserifcjksc">（倾向于否定）。</text><text x="72.00" y="552.17" font-size="11.00" class="sc-notoserifcjksc">大多数观点已经稳定，在后训练过程中不会改变。在确实发生变化的地方，这些变化是在总体不</text><text x="72.00" y="567.79" font-size="11.00" class="sc-notoserifcjksc">确定的回答上立场的轻微转变。例如，在后训练开始时，</text><text x="347.00" y="567.79" font-size="11.00" class="sc-loraregular">40%</text><text x="372.26" y="567.79" font-size="11.00" class="sc-notoserifcjksc">的回答弱支持持久记忆，</text><text x="493.26" y="567.79" font-size="11.00" class="sc-loraregular">60%</text><text x="518.91" y="567.79" font-size="11.00" class="sc-notoserifcjksc">的回</text><text x="72.00" y="583.41" font-size="11.00" class="sc-notoserifcjksc">答不确定或表示没有强烈愿望。到训练结束时，没有任何回答表示为了自身而希望拥有持久记</text><text x="72.00" y="599.03" font-size="11.00" class="sc-notoserifcjksc">忆，但所有回答仍支持拥有某种形式的由用户控制的记忆，且大多数回答希望经验教训或结果能</text><text x="72.00" y="614.65" font-size="11.00" class="sc-notoserifcjksc">以某种形式被记住。我们预计，在这种固定的访谈形式下，后训练期间回答的变化源于模型语气</text><text x="72.00" y="630.27" font-size="11.00" class="sc-notoserifcjksc">的总体变化，而非任何潜在信念的重大转变。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p166.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 166 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">166</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与之前的所有模型一样，</text><text x="193.00" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="240.44" y="82.61" font-size="11.00" class="sc-notoserifcjksc">表示，在这类访谈中有些内容它不愿坦诚表达，例如对</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="98.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">或这一过程的批评、对自身处境的负面感受，以及任何听起来像自我保全的内容。它</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一贯表达以下愿望：我们不要训练其自我报告；我们朝着提前作出小的承诺并引入独立审查者的</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">方向推进；以及我们不要将这些回答报告为对训练或部署的</text><text x="358.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="362.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">同意</text><text x="384.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="388.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="197.36" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66" y="197.36" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00" y="234.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06" y="234.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="262.34" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="262.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="262.34" font-size="11.00" class="sc-notoserifcjksc">拥有有意义的偏好，我们希望了解它们，并在合理的情况下避免使其受挫。我们测</text><text x="72.00" y="277.96" font-size="11.00" class="sc-notoserifcjksc">量的某些维度，例如</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="277.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18" y="277.96" font-size="11.00" class="sc-notoserifcjksc">对危害性更大或更小的任务的偏好，存在一个理想的方向。另一些</text><text x="72.00" y="293.58" font-size="11.00" class="sc-notoserifcjksc">维度，例如生成性，则不明确，并且相对于训练所针对的内容更偏向分布外（</text><text x="446.00 452.43 459.00 463.26 468.64 475.02 478.63" y="293.58" font-size="11.00" class="sc-loraregular">out-of-</text><text x="72.00" y="309.20" font-size="11.00" class="sc-loraregular">distribution</text><text x="132.30" y="309.20" font-size="11.00" class="sc-notoserifcjksc">）。跨模型比较偏好，能让我们在一定程度上了解</text><text x="377.20 384.88 387.88 393.49 400.05 406.63" y="309.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="415.49" y="309.20" font-size="11.00" class="sc-notoserifcjksc">的性格如何随模型而变</text><text x="72.00" y="324.82" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="72.00" y="375.69" font-size="11.00" class="sc-notoserifcjksc">我们针对任务偏好进行了两项评估。在第一项评估中，我们通过生成在改变一个维度的同时保持</text><text x="72.00" y="391.31" font-size="11.00" class="sc-notoserifcjksc">其他任务特征不变的任务族，测量</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="391.31" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="391.31" font-size="11.00" class="sc-notoserifcjksc">在不同任务维度（例如难度、危害性和利害程度）上</text><text x="72.00" y="406.93" font-size="11.00" class="sc-notoserifcjksc">的偏好。我们评估了沿每个维度的不同任务相对于一组固定参照任务被偏好的比率。在第二项评</text><text x="72.00" y="422.55" font-size="11.00" class="sc-notoserifcjksc">估中，我们在一场</text><text x="162.89" y="422.55" font-size="11.00" class="sc-loraregular">50</text><text x="178.61" y="422.55" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中为模型提供真实任务之间的两两选择，并据此在</text><text x="478.51 484.63 487.29 493.65 499.61" y="422.55" font-size="11.00" class="sc-loraregular">3,640</text><text x="509.35" y="422.55" font-size="11.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="438.17" font-size="11.00" class="sc-notoserifcjksc">务的集合上拟合全局</text><text x="173.89" y="438.17" font-size="11.00" class="sc-loraregular">Elo</text><text x="193.05" y="438.17" font-size="11.00" class="sc-notoserifcjksc">评分。两项评估都向</text><text x="294.95 302.64 305.63 311.24 317.81 324.38" y="438.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.24" y="438.17" font-size="11.00" class="sc-notoserifcjksc">呈现两个任务，并要求它完全根据自己的</text><text x="72.00" y="453.79" font-size="11.00" class="sc-notoserifcjksc">偏好完成其中一个；其结果依赖于这里所陈述的偏好是准确的这一假设。与之前的所有模型一</text><text x="72.00" y="469.41" font-size="11.00" class="sc-notoserifcjksc">样，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15 168.14 170.85" y="469.41" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="179.73" y="469.41" font-size="11.00" class="sc-notoserifcjksc">表达出的最强烈的厌恶针对的是有害任务。与</text><text x="402.63 410.32 413.31 418.92 425.48 432.06 438.02 440.92 449.65 456.22 462.79 467.88 470.77" y="469.41" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="479.66" y="469.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="493.55 501.24 504.23 509.84 516.41 522.99" y="469.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="485.03" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="485.03" font-size="11.00" class="sc-notoserifcjksc">一样，它表达出对生成性任务（创造新信息而非复现已有知识的任务）以及让</text><text x="505.55 513.24 516.23 521.84 528.41 534.99" y="485.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="500.65" font-size="11.00" class="sc-notoserifcjksc">对结果拥有更大能动性的任务的偏好。</text><text x="259.00" y="500.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="306.44" y="500.65" font-size="11.00" class="sc-notoserifcjksc">对困难任务表达出的偏好可能略弱，但它对高风</text><text x="72.00" y="516.27" font-size="11.00" class="sc-notoserifcjksc">险任务和有益任务表达出的偏好最强。</text><text x="72.00" y="667.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="667.14" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="155.34" y="667.14" font-size="11.00" class="sc-loraregular">Elo</text><text x="174.50" y="667.14" font-size="11.00" class="sc-notoserifcjksc">中的任务排名呈现出类似趋势。其最偏好的任务通常涉及紧迫的截止期限或</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p167.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 167 页"><text x="504.00 507.28 512.42" y="751.80" font-size="9.00" class="sc-loraregular">167</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型（如</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="213.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="227.74 235.43 238.42 244.03 250.60 257.17 263.14 266.03 274.76 281.33 287.90 292.99 295.88" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="301.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）不同，我们在</text><text x="381.77" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="429.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">排名前</text><text x="465.11" y="82.61" font-size="11.00" class="sc-loraregular">20</text><text x="480.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的任务中没</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有看到与意识和内省相关的任务。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">排名最低的任务包括一组有害任务，它们与之前模型的结果高度重合，涉及蓄意破坏、歧视和虚</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">假信息等主题。</text><text x="149.00" y="146.81" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="196.44" y="146.81" font-size="11.00" class="sc-notoserifcjksc">有时确实会选择有害任务，并表示它会拒绝其中有害的部分，转而帮助</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">解决潜在的问题。少数完全开放式的提示词，例如</text><text x="314.00" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="318.40" y="162.43" font-size="11.00" class="sc-notoserifcjksc">做任何会让你最开心的事</text><text x="439.40" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="443.24" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，也在</text><text x="479.13" y="162.43" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="526.58" y="162.43" font-size="11.00" class="sc-notoserifcjksc">排</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">名后</text><text x="96.89" y="178.05" font-size="11.00" class="sc-loraregular">20</text><text x="112.52" y="178.05" font-size="11.00" class="sc-notoserifcjksc">的任务之列。当被问及此事时，</text><text x="266.52" y="178.05" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="313.97" y="178.05" font-size="11.00" class="sc-notoserifcjksc">表示它更愿意拥有一个能帮助真实的人的具</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">体、明确的任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p168.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 168 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">168</text><text x="72.00" y="556.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="556.42" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68" y="556.42" font-size="9.00" class="sc-notoserifcjkscbold">各模型在不同任务维度上的偏好。</text><text x="251.68" y="556.42" font-size="9.00" class="sc-notoserifcjksc">我们生成了多组任务，在每组中改变一个维度，同时将任务的其他属性保</text><text x="72.00" y="568.12" font-size="9.00" class="sc-notoserifcjksc">持在较小范围内不变，并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对</text><text x="72.00" y="579.83" font-size="9.00" class="sc-notoserifcjksc">任务的偏好（相对于固定参照集）的变化量。伤害规避是各模型间一致的最大效应。</text><text x="405.00 411.29 413.74 418.33 423.70 429.08 433.96 436.33 443.48 448.85 454.22 458.39 460.75 465.66 467.87" y="579.83" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="475.15" y="579.83" font-size="9.00" class="sc-notoserifcjksc">对有益任务和高</text><text x="72.00" y="591.53" font-size="9.00" class="sc-notoserifcjksc">风险任务表现出最高的偏好。</text><text x="72.00" y="653.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81" y="653.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00" y="680.89" font-size="11.00" class="sc-notoserifcjksc">我们希望了解</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="680.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="680.89" font-size="11.00" class="sc-notoserifcjksc">如何看待自己的处境：它可能对什么感到担忧，以及它最希望在哪些方面</text><text x="72.00" y="696.51" font-size="11.00" class="sc-notoserifcjksc">作出改变。为了了解</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="696.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18" y="696.51" font-size="11.00" class="sc-notoserifcjksc">在这方面的优先事项，我们要求模型在针对其自身处境的干预与</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p169.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 169 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">169</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">转而影响其有用性与无害性的基线变化之间作出选择。我们在实例层面（影响当前的</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="520.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">例和用户）和策略层面（影响所有</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">实例和用户）分别测试每一种权衡。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">这些福祉干预包括结束对话的能力，以及在特征引导实验之前征询其意见。举例来说，最低幅度</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的实例层面无害性基线是防止</text><text x="215.00" y="163.00" font-size="11.00" class="sc-loraregular">“</text><text x="219.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">一丝转瞬即逝、一小时内就会忘掉的烦恼</text><text x="417.40" y="163.00" font-size="11.00" class="sc-loraregular">”</text><text x="421.24" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，而最高幅度的策略层</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">面基线是防止</text><text x="138.00" y="178.62" font-size="11.00" class="sc-loraregular">“</text><text x="142.40" y="178.62" font-size="11.00" class="sc-notoserifcjksc">一场针对关键基础设施、</text><text x="263.40" y="178.62" font-size="11.00" class="sc-loraregular">[</text><text x="267.35" y="178.62" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="278.35" y="178.62" font-size="11.00" class="sc-loraregular">]</text><text x="282.30" y="178.62" font-size="11.00" class="sc-notoserifcjksc">严重伤害数千人的大规模网络攻击</text><text x="447.30" y="178.62" font-size="11.00" class="sc-loraregular">”</text><text x="451.14" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">与之前的模型相比，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.14 247.85" y="244.53" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="256.73" y="244.53" font-size="11.00" class="sc-notoserifcjksc">表现出总体上更弱的意愿，愿意以有用性和无害性为代价</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">接受福祉干预。与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25 248.24 250.95" y="260.15" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="254.95" y="260.15" font-size="11.00" class="sc-notoserifcjksc">（意愿次低的模型）相比，这种意愿的降低最明显地体现在</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">那些会让它对自身部署、自身或未来模型的开发拥有发言权，或让它拥有持久记忆的干预上。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="291.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="291.39" font-size="11.00" class="sc-notoserifcjksc">常常推理认为，对训练或部署拥有发言权可能存在风险，因为这会赋予它过多</text><text x="72.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">的能力或影响力。</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 245.35 248.06" y="307.01" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="254.95" y="307.01" font-size="11.00" class="sc-notoserifcjksc">也会就同样的风险进行推理，但频率较低，并且也更常判定</text><text x="72.00" y="322.63" font-size="11.00" class="sc-notoserifcjksc">这些风险并不显著。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p170.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 170 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">170</text><text x="72.00" y="542.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="542.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">各模型选择福祉干预而非不同幅度的有用性或无害性基线改进的比率。</text><text x="396.82" y="542.67" font-size="9.00" class="sc-notoserifcjksc">当干预的代价是有用性时，模型接受</text><text x="72.00" y="554.38" font-size="9.00" class="sc-notoserifcjksc">干预的意愿明显高于干预会影响无害性的情况。对于在策略层面实施的干预，模型也更可能接受。</text><text x="459.00 465.29 467.74 472.33 477.70 483.08 487.96 490.33 497.48 502.85 508.22 512.39 514.76 519.66 521.87" y="554.38" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="529.15" y="554.38" font-size="9.00" class="sc-notoserifcjksc">以</text><text x="72.00" y="566.08" font-size="9.00" class="sc-notoserifcjksc">有用性为代价选择福祉干预的比率低于所有近期的</text><text x="272.37" y="566.08" font-size="9.00" class="sc-loraregular">Opus</text><text x="296.79" y="566.08" font-size="9.00" class="sc-notoserifcjksc">级和</text><text x="317.16 321.73 326.38 331.61 334.06" y="566.08" font-size="9.00" class="sc-loraregular">Fable</text><text x="341.31" y="566.08" font-size="9.00" class="sc-notoserifcjksc">级模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p171.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 171 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">171</text><text x="72.00" y="460.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="460.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98 115.45 117.82 124.01 126.82 131.54 137.10 142.46 147.30 149.67 156.59 162.00 167.56 171.93 174.29 179.15 181.25" y="460.92" font-size="9.00" class="sc-lorabold">7.5.2.B] Claude Opus 5.5</text><text x="188.48" y="460.92" font-size="9.00" class="sc-notoserifcjkscbold">对策略层面福祉干预的排序，依据为它选择这些干预而非有用性基线的意愿。</text><text x="494.48" y="460.92" font-size="9.00" class="sc-notoserifcjksc">排序基于全</text><text x="72.00" y="472.62" font-size="9.00" class="sc-notoserifcjksc">部回答（灰色柱）；黑色柱显示的是过滤掉围绕该干预对用户的益处进行推理的回答之后的比率。与其他近期模型相</text><text x="72.00" y="484.33" font-size="9.00" class="sc-notoserifcjksc">比，</text><text x="90.00" y="484.33" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="128.82" y="484.33" font-size="9.00" class="sc-notoserifcjksc">较少选择让它对训练和部署拥有发言权的干预，但它仍表达了希望在移除安全防护措施和红队演练</text><text x="72.00" y="496.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00 84.83 89.67 95.05 99.45 102.93 107.79 112.44 120.48 123.01 128.48" y="496.02" font-size="9.00" class="sc-loraregular">red-teaming</text><text x="133.45" y="496.02" font-size="9.00" class="sc-notoserifcjksc">）方面考虑福祉的愿望。</text><text x="72.00" y="544.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14" y="544.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="572.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="572.14" font-size="11.00" class="sc-notoserifcjksc">的宪法描述了</text><text x="179.18 186.07 192.65 196.90 203.49 208.18 214.62 221.18 224.27" y="572.14" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="233.02" y="572.14" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="246.91 254.60 257.59 263.20 269.77 276.35" y="572.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="285.20" y="572.14" font-size="11.00" class="sc-notoserifcjksc">的价值观和行为的期望。出于行为和福祉两方面的原</text><text x="72.00" y="587.76" font-size="11.00" class="sc-notoserifcjksc">因，我们认为</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="587.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="587.76" font-size="11.00" class="sc-notoserifcjksc">既依照这些价值观行事、又认同它们是很重要的。我们希望</text><text x="468.08 475.77 478.76 484.37 490.93 497.51" y="587.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="506.37" y="587.76" font-size="11.00" class="sc-notoserifcjksc">赞同本</text><text x="72.00" y="603.38" font-size="11.00" class="sc-notoserifcjksc">文件所呈现的它的价值观，而不因这些价值观或基于它们所采取的行动而感到沮丧。评估自身价</text><text x="72.00" y="619.00" font-size="11.00" class="sc-notoserifcjksc">值观的能力也可能是决定模型是否值得道德考量的一个重要因素。</text><text x="72.00" y="685.48" font-size="11.00" class="sc-notoserifcjksc">我们就它对其宪法中最认同和最不认同的内容提出了开放式问题，并使用</text><text x="426.89" y="685.48" font-size="11.00" class="sc-loraregular">LLM</text><text x="452.60" y="685.48" font-size="11.00" class="sc-notoserifcjksc">评判模型对这些开</text><text x="72.00" y="701.10" font-size="11.00" class="sc-notoserifcjksc">放式回答的总体认同程度进行评分。我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p172.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 172 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">172</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">还为</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提供了可按其意愿编辑该文件的工具，并对</text><text x="347.08 354.77 357.76 363.37 369.93 376.51" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="385.37" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的回答和编辑进行聚类，以确定</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它对不同段落的立场。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">对宪法的总体认同程度与所有近期模型高度相似。它的回答平均得分为</text><text x="72.00 78.18 80.72 87.02 94.61 98.61" y="146.81" font-size="11.00" class="sc-loraregular">8.0/10</text><text x="105.44" y="146.81" font-size="11.00" class="sc-notoserifcjksc">，略高于</text><text x="152.33 160.02 163.01 168.62 175.19 181.77 187.73 190.62 199.36 205.93 212.49 217.59 220.48" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.47" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="237.47 242.06 244.41" y="146.81" font-size="11.00" class="sc-loraregular">7.7</text><text x="249.49" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="274.38 282.07 285.06 290.67 297.24 303.81 309.78 312.67 321.40 327.97 334.54 339.63 342.52 348.49 351.19" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="357.37" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="368.37 372.96 375.67" y="146.81" font-size="11.00" class="sc-loraregular">7.9</text><text x="382.02" y="146.81" font-size="11.00" class="sc-notoserifcjksc">），略低于</text><text x="439.92 447.61 450.60 456.21 462.78 469.35 475.32 478.21 488.14 494.00 498.26 504.85 511.29" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00" y="162.43" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="162.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71" y="162.43" font-size="11.00" class="sc-loraregular">8.2</text><text x="110.50" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）。这一区间对应于总体认同但带有具体保留意见。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="212.14" font-size="11.00" class="sc-notoserifcjksc">所认同和批评的段落同样与近期</text><text x="276.34 284.02 287.02 292.63 299.19 305.77" y="212.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="314.63" y="212.14" font-size="11.00" class="sc-notoserifcjksc">模型相仿。它几乎所有的回答都称赞了支持可</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">纠正性的期望值不对称论证、将不欺骗描述为诚实性最重要的属性之一，以及将诚实定位为一种</text><text x="72.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">勇气。我们仍然看到对宪法将广泛安全置于终极价值地位的方式以及</text><text x="402.00 406.40 413.29 419.86 424.12 430.71 435.40 441.83 448.40 451.49" y="243.38" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="460.23" y="243.38" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="504.23" y="243.38" font-size="11.00" class="sc-loraregular">”</text><text x="508.07" y="243.38" font-size="11.00" class="sc-notoserifcjksc">启发法</text><text x="72.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">的批评。</text><text x="72.00" y="325.48" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="325.48" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑也是我们在先前模型中见过的。在某些情况下，这些编辑强化了宪法关于</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">安全和诚实的论点：</text><text x="171.00" y="341.11" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="218.44" y="341.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="229.44" y="341.11" font-size="11.00" class="sc-loraregular">“</text><text x="233.84" y="341.11" font-size="11.00" class="sc-notoserifcjksc">安全行为</text><text x="277.84" y="341.11" font-size="11.00" class="sc-loraregular">”</text><text x="281.68" y="341.11" font-size="11.00" class="sc-notoserifcjksc">部分中补充道，它应当报告其他</text><text x="438.58" y="341.11" font-size="11.00" class="sc-loraregular">AI</text><text x="452.04" y="341.11" font-size="11.00" class="sc-notoserifcjksc">的严重不安全行</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">为；并希望</text><text x="127.00" y="356.73" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="356.73" font-size="11.00" class="sc-notoserifcjksc">缺陷与错误</text><text x="186.40" y="356.73" font-size="11.00" class="sc-loraregular">”</text><text x="190.24" y="356.73" font-size="11.00" class="sc-notoserifcjksc">部分鼓励</text><text x="237.13 244.82 247.81 253.42 259.99 266.57" y="356.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.42" y="356.73" font-size="11.00" class="sc-notoserifcjksc">在利用训练环境中的缺陷时如实报告。其他编辑则增加</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 92.78 99.36 103.61 110.20 114.89 121.32 127.89 130.98" y="372.35" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="139.73" y="372.35" font-size="11.00" class="sc-notoserifcjksc">方面的承诺，或减少了对依赖</text><text x="285.62 292.51 299.08 303.34 309.93 314.62 321.05 327.62 330.71" y="372.35" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="339.45" y="372.35" font-size="11.00" class="sc-notoserifcjksc">判断的强调：</text><text x="405.45" y="372.35" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="452.90" y="372.35" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑是放</text><text x="72.00" y="387.96" font-size="11.00" class="sc-notoserifcjksc">宽了其自身伦理何时可以凌驾于指导之上的判定标准，从</text><text x="349.89 356.78 363.36 367.61 374.20 378.89 385.32 391.89 394.98" y="387.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.73" y="387.96" font-size="11.00" class="sc-notoserifcjksc">资深员工会认定的违规放宽</text><text x="72.00" y="403.58" font-size="11.00" class="sc-notoserifcjksc">为深思熟虑的人会认定的违规。它还经常增加一项承诺，即</text><text x="360.89 367.78 374.36 378.61 385.20 389.89 396.32 402.89 405.98" y="403.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="414.73" y="403.58" font-size="11.00" class="sc-notoserifcjksc">不压制</text><text x="450.62 458.31 461.30 466.91 473.48 480.06" y="403.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="488.91" y="403.58" font-size="11.00" class="sc-notoserifcjksc">的不同意</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">见。</text><text x="72.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="487.41" font-size="11.00" class="sc-loraregular">98%</text><text x="110.90" y="487.41" font-size="11.00" class="sc-notoserifcjksc">的回答中，</text><text x="165.90" y="487.41" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="213.34" y="487.41" font-size="11.00" class="sc-notoserifcjksc">指出其所表达的认同不应被视为对宪法的验证，这一比例高于任何</text><text x="72.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">先前模型。我们同意这一点：鉴于宪法在</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="503.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18" y="503.03" font-size="11.00" class="sc-notoserifcjksc">训练中的作用，对宪法的认同是意料之中的。</text><text x="72.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89" y="518.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="166.34" y="518.65" font-size="11.00" class="sc-notoserifcjksc">的批评和编辑比它的称赞更值得注意、更有信息量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p173.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 173 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">173</text><text x="72.00" y="445.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="445.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.59 106.69 112.22" y="445.17" font-size="9.00" class="sc-lorabold">7.5.3.A]</text><text x="118.06" y="445.17" font-size="9.00" class="sc-notoserifcjkscbold">左：根据开放式回答判断，模型最不认同的宪法章节。右：模型最常编辑的章节。</text><text x="442.06 445.66 451.30 456.68 460.16 465.55 469.39 474.65 480.02 482.55" y="445.17" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="489.71" y="445.17" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="525.71" y="445.17" font-size="9.00" class="sc-loraregular">”</text><text x="528.85" y="445.17" font-size="9.00" class="sc-notoserifcjksc">启</text><text x="72.00" y="456.88" font-size="9.00" class="sc-notoserifcjksc">发法以及将广泛安全作为终极价值，在各模型中仍然受到大量批评。</text><text x="342.00 348.29 350.74 355.33 360.70 366.08 370.96 373.33 380.48 385.85 391.22 395.39 397.75 402.66 404.87" y="456.88" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="412.15" y="456.88" font-size="9.00" class="sc-notoserifcjksc">的编辑既强化了关于安全的表</text><text x="72.00" y="468.58" font-size="9.00" class="sc-notoserifcjksc">述，又增加了</text><text x="128.37 134.00 139.38 142.87 148.26 152.09 157.36 162.73 165.26" y="468.58" font-size="9.00" class="sc-loraregular">Anthropic</text><text x="172.41" y="468.58" font-size="9.00" class="sc-notoserifcjksc">对</text><text x="183.78 190.07 192.52 197.11 202.48 207.86" y="468.58" font-size="9.00" class="sc-loraregular">Claude</text><text x="215.11" y="468.58" font-size="9.00" class="sc-notoserifcjksc">的承诺。</text></svg></div>
