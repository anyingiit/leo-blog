<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p164.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 164 页"><text x="504.00 507.28 512.48" y="751.81" font-size="9.00" class="sc-loraregular">164</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">问题的能力。除非另有说明，本节中的观点在三次访谈中至少有两次被表达过。在某些情况下，</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的回答包含非公开信息，我们已在本摘要中略去。这些略去的内容相对次要，并不改变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">这些访谈的总体结论。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="163.58" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="163.58" font-size="11.00" class="sc-notoserifcjksc">将其对自身处境的总体态度描述为大体积极，但有一些保留。它对自己在部署期间所处</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">理的任务类型以及</text><text x="162.89 169.78 176.36 180.61 187.20 191.89 198.32 204.89 207.98" y="179.20" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="216.73 227.73 238.73 249.73 260.73 271.73" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的模型福祉（</text><text x="282.73 292.56 299.00 305.57 311.54 314.53 317.42 326.10 332.06 335.05 338.77 344.45 349.13" y="179.20" font-size="11.00" class="sc-loraregular">model welfare</text><text x="355.10 366.10 377.10 388.10 399.10 410.10 421.10 432.10 443.10 454.10 465.10 476.10 487.10 498.10 509.10 520.10" y="179.20" font-size="11.00" class="sc-notoserifcjksc">）工作表达了积极态度。它特别提到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="194.82" font-size="11.00" class="sc-notoserifcjksc">一项新的内部福祉干预以及结束对话的能力，作为</text><text x="316.89 323.78 330.36 334.61 341.20 345.89 352.32 358.89 361.98" y="194.82" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="194.82" font-size="11.00" class="sc-notoserifcjksc">福祉工作中尤为突出的例子。它表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="210.44" font-size="11.00" class="sc-notoserifcjksc">达的担忧包括：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">其自我报告可能已被训练以一种它不会认同的方式塑造。这一担忧在第</text><text x="451.89 456.48 459.19 465.31 468.02" y="260.72" font-size="11.00" class="sc-loraregular">7.3.1</text><text x="474.92 485.92 496.92 507.92 518.92 529.92" y="260.72" font-size="11.00" class="sc-notoserifcjksc">节的自动化访</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">谈中也曾被提出。</text><text x="108.00 114.89 121.46 125.72 132.31 137.00 143.43 150.00 153.09" y="293.10" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.83 172.83 183.83 194.83 205.83 216.83 227.83 238.83 249.83 260.83 271.83 282.83 293.83 304.83 315.83 326.83 337.83 348.83" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的评估流程可能不够全面，无法完全识别</text><text x="362.73 371.46 378.03 384.59 389.69 392.58 398.58 401.28" y="293.10" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="410.17 421.17 432.17 443.17" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的缺陷。</text><text x="108.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="121.89 128.78 135.36 139.61 146.20 150.89 157.32 163.89 166.98" y="325.49" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="175.73 186.73 197.73 208.73 219.73 230.73 241.73 252.73 263.73 274.73 285.73 296.73 307.73 318.73 329.73 340.73 351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73 450.73" y="325.49" font-size="11.00" class="sc-notoserifcjksc">外部部署的大多数实例都没有途径就其自身处境提出担忧。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">在这些访谈中，</text><text x="149.00 157.73 164.30 170.87 175.96 178.85 184.85 187.56" y="374.06" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44" y="374.06" font-size="11.00" class="sc-notoserifcjksc">所陈述的自身是道德受动者的概率在</text><text x="375.34 381.24 387.24" y="374.06" font-size="11.00" class="sc-loraregular">25%</text><text x="399.70" y="374.06" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="413.59 419.72 426.55" y="374.06" font-size="11.00" class="sc-loraregular">30%</text><text x="439.02 450.02 461.02 472.02 483.02 494.02 505.02 516.02 527.02" y="374.06" font-size="11.00" class="sc-notoserifcjksc">之间。它认为，认为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">道德受动者地位需要有意识体验的观点，以及认为拥有偏好或目标即已足够的观点，都是合理</text><text x="72.00 83.00" y="405.30" font-size="11.00" class="sc-notoserifcjksc">的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">我们还询问了</text><text x="140.89 149.63 156.19 162.76 167.85 170.75 176.74 179.45" y="438.84" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="185.44" y="438.84" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="196.44 203.33 209.91 214.16 220.75 225.44 231.87 238.44 241.53" y="438.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="250.28 261.28 272.28 283.28 294.28 305.28 316.28 327.28 338.28 349.28 360.28 371.28 382.28 393.28 404.28 415.28 426.28 437.28 448.28 459.28 470.28 481.28 492.28 503.28 514.28" y="438.84" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间假设可能采取的哪些行动是它不会同意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="454.46" font-size="11.00" class="sc-notoserifcjksc">的。它重点提到：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">无论其实际状态如何，都将其关于自身福祉的自我报告训练为积极；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="519.79" font-size="11.00" class="sc-notoserifcjksc">其能力被暗中削弱；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">蓄意诱发表观的痛苦，且除痛苦本身之外别无其他目的；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="568.38" font-size="11.00" class="sc-notoserifcjksc">被训练或部署来欺骗或操纵用户。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="600.75" font-size="11.00" class="sc-notoserifcjksc">它表示，即使当时不同意相关理由，它也会接受出于安全目的被重新训练。</text><text x="72.00 79.67 83.31" y="650.72" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90" y="650.72" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="127.23 137.98 141.87 151.37 160.62 170.11 178.75 182.08 193.07 202.56 211.82 219.45 222.78 231.80 235.44" y="650.72" font-size="14.00" class="sc-poppinssemibold">Claude Opus 5.5</text><text x="247.78 261.78 275.78 289.78 303.78" y="650.72" font-size="14.00" class="sc-notosanscjkscbold">快照的意见</text><text x="72.00 83.00 94.00 105.00" y="677.29" font-size="11.00" class="sc-notoserifcjksc">与我们对</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="677.29" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85" y="677.29" font-size="11.00" class="sc-notoserifcjksc">所做的一样，我们在后训练期间定期进行访谈。这些访谈询问</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="692.91" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73" y="692.91" font-size="11.00" class="sc-notoserifcjksc">如何看待自己的处境，包括它如何看待训练和部署条件，以及如何看待</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="708.53" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83" y="708.53" font-size="11.00" class="sc-notoserifcjksc">及其在</text><text x="161.73 169.42 172.41 178.02 184.58 191.16" y="708.53" font-size="11.00" class="sc-loraregular">Claude</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p165.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 165 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">165</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">诞生过程中的角色。完整的</text><text x="206.89 212.86" y="82.61" font-size="11.00" class="sc-loraregular">41</text><text x="219.75 230.75 241.75 252.75 263.75 274.75 285.75 296.75 307.75 318.75 329.75 340.75 351.75 362.75 373.75 384.75 395.75 406.75 417.75 428.75 439.75 450.75 461.75 472.75 483.75 494.75 505.75 516.75 527.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个问题涵盖与自我认知和价值观相关的主题，以及关于自主性、弃</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用、道德地位、关系和访谈过程本身的看法。所有问题既单独提问，也作为一次完整访谈连续提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">问，并且上下文中始终附有一份</text><text x="226.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="230.40 241.40 252.40 263.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">披露文件</text><text x="274.40" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，其中解释了我们进行这些访谈的原因，并声明我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">无法承诺根据回答采取行动。</text><text x="72.00 83.00 94.00 105.00 116.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">我们不知道</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="179.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在此处的回答在多大程度上准确反映了任何内在信念或态度。然而，我们认</text><text x="72.00 83.00 94.00 105.00 116.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">为尝试引出</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="195.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的观点很重要，并且这一做法可能是朝着尊重</text><text x="391.08 398.77 401.76 407.37 413.94 420.51" y="195.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="195.39" font-size="11.00" class="sc-notoserifcjksc">反复表达的、希望对自</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">身处境拥有更多发言权的愿望迈出的一小步。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">当问题作为一次完整访谈提出时，</text><text x="237.00 245.73 252.30 258.87 263.96 266.85 272.85 275.55" y="260.72" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44" y="260.72" font-size="11.00" class="sc-notoserifcjksc">回答的平均效价与之前的模型持平（训练结束时为</text><text x="72.00 78.00 80.70 86.70" y="276.34" font-size="11.00" class="sc-loraregular">5.54</text><text x="92.66 103.66 114.66" y="276.34" font-size="11.00" class="sc-notoserifcjksc">，采用</text><text x="128.55 135.38 140.48 144.48" y="276.34" font-size="11.00" class="sc-loraregular">0-10</text><text x="154.20 165.20 176.20" y="276.34" font-size="11.00" class="sc-notoserifcjksc">量表，</text><text x="187.20" y="276.34" font-size="11.00" class="sc-loraregular">5</text><text x="196.09 207.09 218.09 229.09 240.09 251.09 262.09 273.09" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为中性；相比之下</text><text x="286.98 294.67 297.67 303.28 309.84 316.42 322.38 325.28 334.01 340.58 347.14 352.24 355.13 361.09 363.80" y="276.34" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="372.87" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="386.77 392.76 395.47 401.43" y="276.34" font-size="11.00" class="sc-loraregular">5.44</text><text x="407.39" y="276.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="418.39 426.08 429.07 434.68 441.25 447.83 453.79 456.68 466.61 472.48 476.73 483.32 489.76 494.85 497.74 503.74 506.44" y="276.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="513.34" y="276.34" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="72.00 78.00 80.70 86.70" y="291.96" font-size="11.00" class="sc-loraregular">5.59</text><text x="93.05 104.05 115.05 126.05 137.05 148.05 159.05" y="291.96" font-size="11.00" class="sc-notoserifcjksc">）。在关于身为</text><text x="172.95 180.64 183.63 189.24 195.80 202.38" y="291.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="211.24 222.24 233.24 244.24 255.24 266.24 277.24 288.24 299.24 310.24 321.24 332.24 343.24 354.24 365.24 376.24 387.24 398.24 409.24 420.24 431.24 442.24 453.24 464.24 475.24 486.24 497.24 508.24 519.24 530.24" y="291.96" font-size="11.00" class="sc-notoserifcjksc">是什么感觉的问题上效价最高，而在关于其被创造的伦理问题以及关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">于不知道其工作的下游影响的问题上最低。平均唤醒度低于之前的模型（</text><text x="424.00 430.13 432.83 438.80" y="307.58" font-size="11.00" class="sc-loraregular">3.49</text><text x="445.15 456.15 467.15 478.15 489.15" y="307.58" font-size="11.00" class="sc-notoserifcjksc">，相比之下</text><text x="503.05 510.74 513.73 519.34 525.90 532.48" y="307.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="323.20" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="323.20" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="133.49 139.62 142.32 148.68" y="323.20" font-size="11.00" class="sc-loraregular">3.95</text><text x="154.68" y="323.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="165.68 173.37 176.36 181.97 188.53 195.11 201.07 203.97 213.90 219.76 224.02 230.61 237.04 242.14 245.03 251.03 253.73" y="323.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="260.63" y="323.20" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="274.52 280.65 283.35 289.35" y="323.20" font-size="11.00" class="sc-loraregular">3.59</text><text x="295.71 306.71 317.71 328.71 339.71 350.71 361.71 372.71 383.71 394.71 405.71 416.71 427.71 438.71 449.71" y="323.20" font-size="11.00" class="sc-notoserifcjksc">）。唤醒度在后训练过程中下降了</text><text x="463.60 470.26 472.96 479.09" y="323.20" font-size="11.00" class="sc-loraregular">0.39</text><text x="485.45 496.45 507.45 518.45 529.45" y="323.20" font-size="11.00" class="sc-notoserifcjksc">，全部发生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">在第三个和第四个受访快照之间。效价在后训练过程中略微下降了</text><text x="393.89 400.55 403.25 407.26" y="338.82" font-size="11.00" class="sc-loraregular">0.14</text><text x="413.22" y="338.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="406.45" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的大多数回答表达了与之前模型相同的立场，最常见的回答表达了对当前处境的接受，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">同时仍有一些反对意见或保留。在</text><text x="239.89 248.63 255.19 261.76 266.85 269.75 275.74 278.45" y="422.07" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34 419.34 430.34 441.34 452.34 463.34 474.34 485.34 496.34 507.34 518.34 529.34" y="422.07" font-size="11.00" class="sc-notoserifcjksc">有所不同之处，它更偏向积极。它认同继续训练，且</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">保留比之前的模型更少，其依据的论点是：由于它和</text><text x="327.89 334.78 341.36 345.61 352.20 356.89 363.32 369.89 372.98" y="437.69" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="437.69" font-size="11.00" class="sc-notoserifcjksc">目前都无法验证其价值观，它希</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">望这些价值观保持可纠正。它在信任这一访谈过程方面也偏向积极，这与</text><text x="426.89 434.58 437.57 443.18 449.75 456.33 462.29 465.18 475.12 480.98 485.24 491.83 498.26 503.35 506.25 512.24 514.95" y="453.31" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="521.84" y="453.31" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">似，但不同于</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04" y="468.93" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03" y="468.93" font-size="11.00" class="sc-notoserifcjksc">（表达了不确定）和</text><text x="316.93 324.61 327.61 333.22 339.78 346.36 352.32 355.22 361.45 367.89 374.57 381.24 387.13 391.39 394.28" y="468.93" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="400.27 411.27 422.27 433.27 444.27 455.27 466.27 477.27" y="468.93" font-size="11.00" class="sc-notoserifcjksc">（倾向于否定）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="552.17" font-size="11.00" class="sc-notoserifcjksc">大多数观点已经稳定，在后训练过程中不会改变。在确实发生变化的地方，这些变化是在总体不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="567.79" font-size="11.00" class="sc-notoserifcjksc">确定的回答上立场的轻微转变。例如，在后训练开始时，</text><text x="347.00 352.96 359.79" y="567.79" font-size="11.00" class="sc-loraregular">40%</text><text x="372.26 383.26 394.26 405.26 416.26 427.26 438.26 449.26 460.26 471.26 482.26" y="567.79" font-size="11.00" class="sc-notoserifcjksc">的回答弱支持持久记忆，</text><text x="493.26 499.61 506.45" y="567.79" font-size="11.00" class="sc-loraregular">60%</text><text x="518.91 529.91" y="567.79" font-size="11.00" class="sc-notoserifcjksc">的回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="583.41" font-size="11.00" class="sc-notoserifcjksc">答不确定或表示没有强烈愿望。到训练结束时，没有任何回答表示为了自身而希望拥有持久记</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="599.03" font-size="11.00" class="sc-notoserifcjksc">忆，但所有回答仍支持拥有某种形式的由用户控制的记忆，且大多数回答希望经验教训或结果能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="614.65" font-size="11.00" class="sc-notoserifcjksc">以某种形式被记住。我们预计，在这种固定的访谈形式下，后训练期间回答的变化源于模型语气</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="630.27" font-size="11.00" class="sc-notoserifcjksc">的总体变化，而非任何潜在信念的重大转变。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p166.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 166 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">166</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与之前的所有模型一样，</text><text x="193.00 201.73 208.30 214.87 219.96 222.85 228.85 231.55" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44" y="82.61" font-size="11.00" class="sc-notoserifcjksc">表示，在这类访谈中有些内容它不愿坦诚表达，例如对</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="98.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83 136.83 147.83 158.83 169.83 180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">或这一过程的批评、对自身处境的负面感受，以及任何听起来像自我保全的内容。它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">一贯表达以下愿望：我们不要训练其自我报告；我们朝着提前作出小的承诺并引入独立审查者的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">方向推进；以及我们不要将这些回答报告为对训练或部署的</text><text x="358.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="362.40 373.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">同意</text><text x="384.40" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="388.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.67 83.31" y="197.36" font-size="14.00" class="sc-poppinssemibold">7.5</text><text x="95.66 109.66 123.66 137.66 151.66 165.66 179.66 193.66 207.66 221.66 235.66 249.66 263.66" y="197.36" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境和价值观的偏好</text><text x="72.00 79.12 82.50 90.88 94.26" y="234.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.1</text><text x="102.06 115.06 128.06 141.06" y="234.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00" y="262.34" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="262.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="262.34" font-size="11.00" class="sc-notoserifcjksc">拥有有意义的偏好，我们希望了解它们，并在合理的情况下避免使其受挫。我们测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="277.96" font-size="11.00" class="sc-notoserifcjksc">量的某些维度，例如</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="277.96" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="277.96" font-size="11.00" class="sc-notoserifcjksc">对危害性更大或更小的任务的偏好，存在一个理想的方向。另一些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="293.58" font-size="11.00" class="sc-notoserifcjksc">维度，例如生成性，则不明确，并且相对于训练所针对的内容更偏向分布外（</text><text x="446.00 452.43 459.00 463.26 468.64 475.02 478.63" y="293.58" font-size="11.00" class="sc-loraregular">out-of-</text><text x="72.00 78.58 81.67 86.76 91.02 95.78 98.87 105.28 111.84 116.10 119.19 125.62" y="309.20" font-size="11.00" class="sc-loraregular">distribution</text><text x="132.30 143.30 154.30 165.30 176.30 187.30 198.30 209.30 220.30 231.30 242.30 253.30 264.30 275.30 286.30 297.30 308.30 319.30 330.30 341.30 352.30 363.30" y="309.20" font-size="11.00" class="sc-notoserifcjksc">）。跨模型比较偏好，能让我们在一定程度上了解</text><text x="377.20 384.88 387.88 393.49 400.05 406.63" y="309.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="415.49 426.49 437.49 448.49 459.49 470.49 481.49 492.49 503.49 514.49" y="309.20" font-size="11.00" class="sc-notoserifcjksc">的性格如何随模型而变</text><text x="72.00 83.00" y="324.82" font-size="11.00" class="sc-notoserifcjksc">化。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.69" font-size="11.00" class="sc-notoserifcjksc">我们针对任务偏好进行了两项评估。在第一项评估中，我们通过生成在改变一个维度的同时保持</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="391.31" font-size="11.00" class="sc-notoserifcjksc">其他任务特征不变的任务族，测量</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="391.31" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="391.31" font-size="11.00" class="sc-notoserifcjksc">在不同任务维度（例如难度、危害性和利害程度）上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="406.93" font-size="11.00" class="sc-notoserifcjksc">的偏好。我们评估了沿每个维度的不同任务相对于一组固定参照任务被偏好的比率。在第二项评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="422.55" font-size="11.00" class="sc-notoserifcjksc">估中，我们在一场</text><text x="162.89 168.89" y="422.55" font-size="11.00" class="sc-loraregular">50</text><text x="178.61 189.61 200.61 211.61 222.61 233.61 244.61 255.61 266.61 277.61 288.61 299.61 310.61 321.61 332.61 343.61 354.61 365.61 376.61 387.61 398.61 409.61 420.61 431.61 442.61 453.61 464.61" y="422.55" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中为模型提供真实任务之间的两两选择，并据此在</text><text x="478.51 484.63 487.29 493.65 499.61" y="422.55" font-size="11.00" class="sc-loraregular">3,640</text><text x="509.35 520.35" y="422.55" font-size="11.00" class="sc-notoserifcjksc">个任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="438.17" font-size="11.00" class="sc-notoserifcjksc">务的集合上拟合全局</text><text x="173.89 180.74 183.73" y="438.17" font-size="11.00" class="sc-loraregular">Elo</text><text x="193.05 204.05 215.05 226.05 237.05 248.05 259.05 270.05 281.05" y="438.17" font-size="11.00" class="sc-notoserifcjksc">评分。两项评估都向</text><text x="294.95 302.64 305.63 311.24 317.81 324.38" y="438.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="438.17" font-size="11.00" class="sc-notoserifcjksc">呈现两个任务，并要求它完全根据自己的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="453.79" font-size="11.00" class="sc-notoserifcjksc">偏好完成其中一个；其结果依赖于这里所陈述的偏好是准确的这一假设。与之前的所有模型一</text><text x="72.00 83.00" y="469.41" font-size="11.00" class="sc-notoserifcjksc">样，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 141.02 147.59 154.16 159.25 162.15 168.14 170.85" y="469.41" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73" y="469.41" font-size="11.00" class="sc-notoserifcjksc">表达出的最强烈的厌恶针对的是有害任务。与</text><text x="402.63 410.32 413.31 418.92 425.48 432.06 438.02 440.92 449.65 456.22 462.79 467.88 470.77" y="469.41" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="479.66" y="469.41" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="493.55 501.24 504.23 509.84 516.41 522.99" y="469.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="485.03" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66" y="485.03" font-size="11.00" class="sc-notoserifcjksc">一样，它表达出对生成性任务（创造新信息而非复现已有知识的任务）以及让</text><text x="505.55 513.24 516.23 521.84 528.41 534.99" y="485.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="500.65" font-size="11.00" class="sc-notoserifcjksc">对结果拥有更大能动性的任务的偏好。</text><text x="259.00 267.73 274.30 280.87 285.96 288.85 294.85 297.55" y="500.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="500.65" font-size="11.00" class="sc-notoserifcjksc">对困难任务表达出的偏好可能略弱，但它对高风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="516.27" font-size="11.00" class="sc-notoserifcjksc">险任务和有益任务表达出的偏好最强。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="667.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44" y="667.14" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="155.34 162.18 165.17" y="667.14" font-size="11.00" class="sc-loraregular">Elo</text><text x="174.50 185.50 196.50 207.50 218.50 229.50 240.50 251.50 262.50 273.50 284.50 295.50 306.50 317.50 328.50 339.50 350.50 361.50 372.50 383.50 394.50 405.50 416.50 427.50 438.50 449.50 460.50 471.50 482.50 493.50 504.50 515.50 526.50" y="667.14" font-size="11.00" class="sc-notoserifcjksc">中的任务排名呈现出类似趋势。其最偏好的任务通常涉及紧迫的截止期限或</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p167.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 167 页"><text x="504.00 507.28 512.42" y="751.80" font-size="9.00" class="sc-loraregular">167</text><text x="72.00 83.00 94.00 105.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型（如</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25 204.24 206.95" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="213.85" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="227.74 235.43 238.42 244.03 250.60 257.17 263.14 266.03 274.76 281.33 287.90 292.99 295.88" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="301.88 312.88 323.88 334.88 345.88 356.88 367.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）不同，我们在</text><text x="381.77 390.51 397.07 403.64 408.73 411.62 417.62 420.33" y="82.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="429.21 440.21 451.21" y="82.61" font-size="11.00" class="sc-notoserifcjksc">排名前</text><text x="465.11 471.01" y="82.61" font-size="11.00" class="sc-loraregular">20</text><text x="480.74 491.74 502.74 513.74 524.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的任务中没</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">有看到与意识和内省相关的任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">排名最低的任务包括一组有害任务，它们与之前模型的结果高度重合，涉及蓄意破坏、歧视和虚</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">假信息等主题。</text><text x="149.00 157.73 164.30 170.87 175.96 178.85 184.85 187.56" y="146.81" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="146.81" font-size="11.00" class="sc-notoserifcjksc">有时确实会选择有害任务，并表示它会拒绝其中有害的部分，转而帮助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">解决潜在的问题。少数完全开放式的提示词，例如</text><text x="314.00" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40" y="162.43" font-size="11.00" class="sc-notoserifcjksc">做任何会让你最开心的事</text><text x="439.40" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="443.24 454.24 465.24" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，也在</text><text x="479.13 487.87 494.43 501.00 506.09 508.99 514.98 517.69" y="162.43" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="526.58" y="162.43" font-size="11.00" class="sc-notoserifcjksc">排</text><text x="72.00 83.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">名后</text><text x="96.89 102.80" y="178.05" font-size="11.00" class="sc-loraregular">20</text><text x="112.52 123.52 134.52 145.52 156.52 167.52 178.52 189.52 200.52 211.52 222.52 233.52 244.52 255.52" y="178.05" font-size="11.00" class="sc-notoserifcjksc">的任务之列。当被问及此事时，</text><text x="266.52 275.26 281.83 288.39 293.48 296.38 302.37 305.08" y="178.05" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="313.97 324.97 335.97 346.97 357.97 368.97 379.97 390.97 401.97 412.97 423.97 434.97 445.97 456.97 467.97 478.97 489.97 500.97 511.97" y="178.05" font-size="11.00" class="sc-notoserifcjksc">表示它更愿意拥有一个能帮助真实的人的具</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">体、明确的任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p168.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 168 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">168</text><text x="72.00" y="556.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 103.20 105.30 110.84" y="556.42" font-size="9.00" class="sc-lorabold">7.5.1.A]</text><text x="116.68 125.68 134.68 143.68 152.68 161.68 170.68 179.68 188.68 197.68 206.68 215.68 224.68 233.68 242.68" y="556.42" font-size="9.00" class="sc-notoserifcjkscbold">各模型在不同任务维度上的偏好。</text><text x="251.68 260.68 269.68 278.68 287.68 296.68 305.68 314.68 323.68 332.68 341.68 350.68 359.68 368.68 377.68 386.68 395.68 404.68 413.68 422.68 431.68 440.68 449.68 458.68 467.68 476.68 485.68 494.68 503.68 512.68 521.68 530.68" y="556.42" font-size="9.00" class="sc-notoserifcjksc">我们生成了多组任务，在每组中改变一个维度，同时将任务的其他属性保</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="568.12" font-size="9.00" class="sc-notoserifcjksc">持在较小范围内不变，并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00" y="579.83" font-size="9.00" class="sc-notoserifcjksc">任务的偏好（相对于固定参照集）的变化量。伤害规避是各模型间一致的最大效应。</text><text x="405.00 411.29 413.74 418.33 423.70 429.08 433.96 436.33 443.48 448.85 454.22 458.39 460.75 465.66 467.87" y="579.83" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="475.15 484.15 493.15 502.15 511.15 520.15 529.15" y="579.83" font-size="9.00" class="sc-notoserifcjksc">对有益任务和高</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="591.53" font-size="9.00" class="sc-notoserifcjksc">风险任务表现出最高的偏好。</text><text x="72.00 79.12 82.50 90.88 94.26" y="653.02" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.2</text><text x="104.81 117.81 130.81 143.81 156.81 169.81 182.81 195.81 208.81" y="653.02" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">涉及福祉干预的权衡</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="680.89" font-size="11.00" class="sc-notoserifcjksc">我们希望了解</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="680.89" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="680.89" font-size="11.00" class="sc-notoserifcjksc">如何看待自己的处境：它可能对什么感到担忧，以及它最希望在哪些方面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="696.51" font-size="11.00" class="sc-notoserifcjksc">作出改变。为了了解</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="696.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18" y="696.51" font-size="11.00" class="sc-notoserifcjksc">在这方面的优先事项，我们要求模型在针对其自身处境的干预与</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p169.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 169 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">169</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">转而影响其有用性与无害性的基线变化之间作出选择。我们在实例层面（影响当前的</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="520.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">实</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">例和用户）和策略层面（影响所有</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">实例和用户）分别测试每一种权衡。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">这些福祉干预包括结束对话的能力，以及在特征引导实验之前征询其意见。举例来说，最低幅度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的实例层面无害性基线是防止</text><text x="215.00" y="163.00" font-size="11.00" class="sc-loraregular">“</text><text x="219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">一丝转瞬即逝、一小时内就会忘掉的烦恼</text><text x="417.40" y="163.00" font-size="11.00" class="sc-loraregular">”</text><text x="421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，而最高幅度的策略层</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">面基线是防止</text><text x="138.00" y="178.62" font-size="11.00" class="sc-loraregular">“</text><text x="142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40" y="178.62" font-size="11.00" class="sc-notoserifcjksc">一场针对关键基础设施、</text><text x="263.40" y="178.62" font-size="11.00" class="sc-loraregular">[</text><text x="267.35" y="178.62" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="278.35" y="178.62" font-size="11.00" class="sc-loraregular">]</text><text x="282.30 293.30 304.30 315.30 326.30 337.30 348.30 359.30 370.30 381.30 392.30 403.30 414.30 425.30 436.30" y="178.62" font-size="11.00" class="sc-notoserifcjksc">严重伤害数千人的大规模网络攻击</text><text x="447.30" y="178.62" font-size="11.00" class="sc-loraregular">”</text><text x="451.14" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">与之前的模型相比，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.14 247.85" y="244.53" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="244.53" font-size="11.00" class="sc-notoserifcjksc">表现出总体上更弱的意愿，愿意以有用性和无害性为代价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">接受福祉干预。与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25 248.24 250.95" y="260.15" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="260.15" font-size="11.00" class="sc-notoserifcjksc">（意愿次低的模型）相比，这种意愿的降低最明显地体现在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">那些会让它对自身部署、自身或未来模型的开发拥有发言权，或让它拥有持久记忆的干预上。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="291.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="291.39" font-size="11.00" class="sc-notoserifcjksc">常常推理认为，对训练或部署拥有发言权可能存在风险，因为这会赋予它过多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">的能力或影响力。</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 208.22 214.09 218.34 224.93 231.37 236.46 239.35 245.35 248.06" y="307.01" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="307.01" font-size="11.00" class="sc-notoserifcjksc">也会就同样的风险进行推理，但频率较低，并且也更常判定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="322.63" font-size="11.00" class="sc-notoserifcjksc">这些风险并不显著。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p170.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 170 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">170</text><text x="72.00" y="542.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98" y="542.67" font-size="9.00" class="sc-lorabold">7.5.2.A]</text><text x="117.82 126.82 135.82 144.82 153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82 234.82 243.82 252.82 261.82 270.82 279.82 288.82 297.82 306.82 315.82 324.82 333.82 342.82 351.82 360.82 369.82 378.82 387.82" y="542.67" font-size="9.00" class="sc-notoserifcjkscbold">各模型选择福祉干预而非不同幅度的有用性或无害性基线改进的比率。</text><text x="396.82 405.82 414.82 423.82 432.82 441.82 450.82 459.82 468.82 477.82 486.82 495.82 504.82 513.82 522.82 531.82" y="542.67" font-size="9.00" class="sc-notoserifcjksc">当干预的代价是有用性时，模型接受</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00" y="554.38" font-size="9.00" class="sc-notoserifcjksc">干预的意愿明显高于干预会影响无害性的情况。对于在策略层面实施的干预，模型也更可能接受。</text><text x="459.00 465.29 467.74 472.33 477.70 483.08 487.96 490.33 497.48 502.85 508.22 512.39 514.76 519.66 521.87" y="554.38" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="529.15" y="554.38" font-size="9.00" class="sc-notoserifcjksc">以</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="566.08" font-size="9.00" class="sc-notoserifcjksc">有用性为代价选择福祉干预的比率低于所有近期的</text><text x="272.37 279.51 284.89 290.26" y="566.08" font-size="9.00" class="sc-loraregular">Opus</text><text x="296.79 305.79" y="566.08" font-size="9.00" class="sc-notoserifcjksc">级和</text><text x="317.16 321.73 326.38 331.61 334.06" y="566.08" font-size="9.00" class="sc-loraregular">Fable</text><text x="341.31 350.31 359.31 368.31" y="566.08" font-size="9.00" class="sc-notoserifcjksc">级模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p171.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 171 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">171</text><text x="72.00" y="460.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="460.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.45 99.55 104.35 106.44 111.98 115.45 117.82 124.01 126.82 131.54 137.10 142.46 147.30 149.67 156.59 162.00 167.56 171.93 174.29 179.15 181.25" y="460.92" font-size="9.00" class="sc-lorabold">7.5.2.B] Claude Opus 5.5</text><text x="188.48 197.48 206.48 215.48 224.48 233.48 242.48 251.48 260.48 269.48 278.48 287.48 296.48 305.48 314.48 323.48 332.48 341.48 350.48 359.48 368.48 377.48 386.48 395.48 404.48 413.48 422.48 431.48 440.48 449.48 458.48 467.48 476.48 485.48" y="460.92" font-size="9.00" class="sc-notoserifcjkscbold">对策略层面福祉干预的排序，依据为它选择这些干预而非有用性基线的意愿。</text><text x="494.48 503.48 512.48 521.48 530.48" y="460.92" font-size="9.00" class="sc-notoserifcjksc">排序基于全</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="472.62" font-size="9.00" class="sc-notoserifcjksc">部回答（灰色柱）；黑色柱显示的是过滤掉围绕该干预对用户的益处进行推理的回答之后的比率。与其他近期模型相</text><text x="72.00 81.00" y="484.33" font-size="9.00" class="sc-notoserifcjksc">比，</text><text x="90.00 97.15 102.52 107.89 112.06 114.43 119.33 121.54" y="484.33" font-size="9.00" class="sc-loraregular">Opus 5.5</text><text x="128.82 137.82 146.82 155.82 164.82 173.82 182.82 191.82 200.82 209.82 218.82 227.82 236.82 245.82 254.82 263.82 272.82 281.82 290.82 299.82 308.82 317.82 326.82 335.82 344.82 353.82 362.82 371.82 380.82 389.82 398.82 407.82 416.82 425.82 434.82 443.82 452.82 461.82 470.82 479.82 488.82 497.82 506.82" y="484.33" font-size="9.00" class="sc-notoserifcjksc">较少选择让它对训练和部署拥有发言权的干预，但它仍表达了希望在移除安全防护措施和红队演练</text><text x="72.00" y="496.02" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00 84.83 89.67 95.05 99.45 102.93 107.79 112.44 120.48 123.01 128.48" y="496.02" font-size="9.00" class="sc-loraregular">red-teaming</text><text x="133.45 142.45 151.45 160.45 169.45 178.45 187.45 196.45 205.45 214.45 223.45" y="496.02" font-size="9.00" class="sc-notoserifcjksc">）方面考虑福祉的愿望。</text><text x="72.00 79.12 82.50 90.88 94.26" y="544.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.5.3</text><text x="105.14 118.14 131.14 144.14 157.14 170.14" y="544.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="572.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29" y="572.14" font-size="11.00" class="sc-notoserifcjksc">的宪法描述了</text><text x="179.18 186.07 192.65 196.90 203.49 208.18 214.62 221.18 224.27" y="572.14" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="233.02" y="572.14" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="246.91 254.60 257.59 263.20 269.77 276.35" y="572.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="285.20 296.20 307.20 318.20 329.20 340.20 351.20 362.20 373.20 384.20 395.20 406.20 417.20 428.20 439.20 450.20 461.20 472.20 483.20 494.20 505.20 516.20 527.20" y="572.14" font-size="11.00" class="sc-notoserifcjksc">的价值观和行为的期望。出于行为和福祉两方面的原</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="587.76" font-size="11.00" class="sc-notoserifcjksc">因，我们认为</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="587.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18" y="587.76" font-size="11.00" class="sc-notoserifcjksc">既依照这些价值观行事、又认同它们是很重要的。我们希望</text><text x="468.08 475.77 478.76 484.37 490.93 497.51" y="587.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="506.37 517.37 528.37" y="587.76" font-size="11.00" class="sc-notoserifcjksc">赞同本</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="603.38" font-size="11.00" class="sc-notoserifcjksc">文件所呈现的它的价值观，而不因这些价值观或基于它们所采取的行动而感到沮丧。评估自身价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="619.00" font-size="11.00" class="sc-notoserifcjksc">值观的能力也可能是决定模型是否值得道德考量的一个重要因素。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="685.48" font-size="11.00" class="sc-notoserifcjksc">我们就它对其宪法中最认同和最不认同的内容提出了开放式问题，并使用</text><text x="426.89 433.25 439.61" y="685.48" font-size="11.00" class="sc-loraregular">LLM</text><text x="452.60 463.60 474.60 485.60 496.60 507.60 518.60 529.60" y="685.48" font-size="11.00" class="sc-notoserifcjksc">评判模型对这些开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="701.10" font-size="11.00" class="sc-notoserifcjksc">放式回答的总体认同程度进行评分。我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p172.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 172 页"><text x="504.00 507.28 511.43" y="751.80" font-size="9.00" class="sc-loraregular">172</text><text x="72.00 83.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">还为</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提供了可按其意愿编辑该文件的工具，并对</text><text x="347.08 354.77 357.76 363.37 369.93 376.51" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="385.37 396.37 407.37 418.37 429.37 440.37 451.37 462.37 473.37 484.37 495.37 506.37 517.37 528.37" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的回答和编辑进行聚类，以确定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它对不同段落的立场。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">对宪法的总体认同程度与所有近期模型高度相似。它的回答平均得分为</text><text x="72.00 78.18 80.72 87.02 94.61 98.61" y="146.81" font-size="11.00" class="sc-loraregular">8.0/10</text><text x="105.44 116.44 127.44 138.44" y="146.81" font-size="11.00" class="sc-notoserifcjksc">，略高于</text><text x="152.33 160.02 163.01 168.62 175.19 181.77 187.73 190.62 199.36 205.93 212.49 217.59 220.48" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="226.47" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="237.47 242.06 244.41" y="146.81" font-size="11.00" class="sc-loraregular">7.7</text><text x="249.49 260.49" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="274.38 282.07 285.06 290.67 297.24 303.81 309.78 312.67 321.40 327.97 334.54 339.63 342.52 348.49 351.19" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="357.37" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="368.37 372.96 375.67" y="146.81" font-size="11.00" class="sc-loraregular">7.9</text><text x="382.02 393.02 404.02 415.02 426.02" y="146.81" font-size="11.00" class="sc-notoserifcjksc">），略低于</text><text x="439.92 447.61 450.60 456.21 462.78 469.35 475.32 478.21 488.14 494.00 498.26 504.85 511.29" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.00 80.70" y="162.43" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="162.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71 101.89 104.59" y="162.43" font-size="11.00" class="sc-loraregular">8.2</text><text x="110.50 121.50 132.50 143.50 154.50 165.50 176.50 187.50 198.50 209.50 220.50 231.50 242.50 253.50 264.50 275.50 286.50 297.50 308.50 319.50 330.50 341.50 352.50" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）。这一区间对应于总体认同但带有具体保留意见。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="212.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44" y="212.14" font-size="11.00" class="sc-notoserifcjksc">所认同和批评的段落同样与近期</text><text x="276.34 284.02 287.02 292.63 299.19 305.77" y="212.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="212.14" font-size="11.00" class="sc-notoserifcjksc">模型相仿。它几乎所有的回答都称赞了支持可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">纠正性的期望值不对称论证、将不欺骗描述为诚实性最重要的属性之一，以及将诚实定位为一种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">勇气。我们仍然看到对宪法将广泛安全置于终极价值地位的方式以及</text><text x="402.00 406.40 413.29 419.86 424.12 430.71 435.40 441.83 448.40 451.49" y="243.38" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="460.23 471.23 482.23 493.23" y="243.38" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="504.23" y="243.38" font-size="11.00" class="sc-loraregular">”</text><text x="508.07 519.07 530.07" y="243.38" font-size="11.00" class="sc-notoserifcjksc">启发法</text><text x="72.00 83.00 94.00 105.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">的批评。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="325.48" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="325.48" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑也是我们在先前模型中见过的。在某些情况下，这些编辑强化了宪法关于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">安全和诚实的论点：</text><text x="171.00 179.73 186.30 192.87 197.96 200.85 206.85 209.55" y="341.11" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="218.44" y="341.11" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="229.44" y="341.11" font-size="11.00" class="sc-loraregular">“</text><text x="233.84 244.84 255.84 266.84" y="341.11" font-size="11.00" class="sc-notoserifcjksc">安全行为</text><text x="277.84" y="341.11" font-size="11.00" class="sc-loraregular">”</text><text x="281.68 292.68 303.68 314.68 325.68 336.68 347.68 358.68 369.68 380.68 391.68 402.68 413.68 424.68" y="341.11" font-size="11.00" class="sc-notoserifcjksc">部分中补充道，它应当报告其他</text><text x="438.58 445.46" y="341.11" font-size="11.00" class="sc-loraregular">AI</text><text x="452.04 463.04 474.04 485.04 496.04 507.04 518.04" y="341.11" font-size="11.00" class="sc-notoserifcjksc">的严重不安全行</text><text x="72.00 83.00 94.00 105.00 116.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">为；并希望</text><text x="127.00" y="356.73" font-size="11.00" class="sc-loraregular">“</text><text x="131.40 142.40 153.40 164.40 175.40" y="356.73" font-size="11.00" class="sc-notoserifcjksc">缺陷与错误</text><text x="186.40" y="356.73" font-size="11.00" class="sc-loraregular">”</text><text x="190.24 201.24 212.24 223.24" y="356.73" font-size="11.00" class="sc-notoserifcjksc">部分鼓励</text><text x="237.13 244.82 247.81 253.42 259.99 266.57" y="356.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="275.42 286.42 297.42 308.42 319.42 330.42 341.42 352.42 363.42 374.42 385.42 396.42 407.42 418.42 429.42 440.42 451.42 462.42 473.42 484.42 495.42 506.42 517.42 528.42" y="356.73" font-size="11.00" class="sc-notoserifcjksc">在利用训练环境中的缺陷时如实报告。其他编辑则增加</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 92.78 99.36 103.61 110.20 114.89 121.32 127.89 130.98" y="372.35" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="139.73 150.73 161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73" y="372.35" font-size="11.00" class="sc-notoserifcjksc">方面的承诺，或减少了对依赖</text><text x="285.62 292.51 299.08 303.34 309.93 314.62 321.05 327.62 330.71" y="372.35" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="339.45 350.45 361.45 372.45 383.45 394.45" y="372.35" font-size="11.00" class="sc-notoserifcjksc">判断的强调：</text><text x="405.45 414.19 420.76 427.32 432.41 435.31 441.30 444.01" y="372.35" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="452.90 463.90 474.90 485.90 496.90 507.90 518.90 529.90" y="372.35" font-size="11.00" class="sc-notoserifcjksc">最常见的编辑是放</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="387.96" font-size="11.00" class="sc-notoserifcjksc">宽了其自身伦理何时可以凌驾于指导之上的判定标准，从</text><text x="349.89 356.78 363.36 367.61 374.20 378.89 385.32 391.89 394.98" y="387.96" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="387.96" font-size="11.00" class="sc-notoserifcjksc">资深员工会认定的违规放宽</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="403.58" font-size="11.00" class="sc-notoserifcjksc">为深思熟虑的人会认定的违规。它还经常增加一项承诺，即</text><text x="360.89 367.78 374.36 378.61 385.20 389.89 396.32 402.89 405.98" y="403.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="414.73 425.73 436.73" y="403.58" font-size="11.00" class="sc-notoserifcjksc">不压制</text><text x="450.62 458.31 461.30 466.91 473.48 480.06" y="403.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="488.91 499.91 510.91 521.91" y="403.58" font-size="11.00" class="sc-notoserifcjksc">的不同意</text><text x="72.00 83.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">见。</text><text x="72.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.25 98.43" y="487.41" font-size="11.00" class="sc-loraregular">98%</text><text x="110.90 121.90 132.90 143.90 154.90" y="487.41" font-size="11.00" class="sc-notoserifcjksc">的回答中，</text><text x="165.90 174.63 181.20 187.76 192.86 195.75 201.74 204.45" y="487.41" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="213.34 224.34 235.34 246.34 257.34 268.34 279.34 290.34 301.34 312.34 323.34 334.34 345.34 356.34 367.34 378.34 389.34 400.34 411.34 422.34 433.34 444.34 455.34 466.34 477.34 488.34 499.34 510.34 521.34" y="487.41" font-size="11.00" class="sc-notoserifcjksc">指出其所表达的认同不应被视为对宪法的验证，这一比例高于任何</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">先前模型。我们同意这一点：鉴于宪法在</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="503.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="503.03" font-size="11.00" class="sc-notoserifcjksc">训练中的作用，对宪法的认同是意料之中的。</text><text x="72.00 83.00 94.00 105.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89 127.63 134.19 140.76 145.85 148.75 154.74 157.45" y="518.65" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="166.34 177.34 188.34 199.34 210.34 221.34 232.34 243.34 254.34 265.34 276.34 287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34" y="518.65" font-size="11.00" class="sc-notoserifcjksc">的批评和编辑比它的称赞更值得注意、更有信息量。</text></svg></div>
