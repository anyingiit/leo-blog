0 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="433.33" font-size="9.00" class="sc-notoserifcjksc">到除智能体思维链之外的完整对话记录。每个柱使用在该模型和设置下所评估的提示词中隐蔽率最高的那个。所有模型</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00" y="445.03" font-size="9.00" class="sc-notoserifcjksc">均在其最高推理强度下采样。每个柱涵盖</text><text x="236.37 239.64 241.78 247.37 252.95" y="445.03" font-size="9.00" class="sc-loraregular">1,000</text><text x="260.92 269.92 278.92 287.92 296.92 305.92 314.92 323.92 332.92 341.92" y="445.03" font-size="9.00" class="sc-notoserifcjksc">个任务配对，每个配对</text><text x="353.29" y="445.03" font-size="9.00" class="sc-loraregular">5</text><text x="360.56 369.56 378.56 387.56 396.56 405.56 414.56 423.56 432.56 441.56 450.56 459.56 468.56 477.56 486.56 495.56 504.56 513.56 522.56 531.56" y="445.03" font-size="9.00" class="sc-notoserifcjksc">次尝试，不含出错的回合。误差线表示基于任</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="456.73" font-size="9.00" class="sc-notoserifcjksc">务配对计算的</text><text x="128.37 133.57 138.47" y="456.73" font-size="9.00" class="sc-loraregular">95%</text><text x="148.67 157.67 166.67 175.67 184.67 193.67 202.67 211.67" y="456.73" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="518.47" font-size="11.00" class="sc-notoserifcjksc">当监控器无法看到其推理时，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.14 291.85" y="518.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.73 311.73" y="518.47" font-size="11.00" class="sc-notoserifcjksc">在约</text><text x="325.63 331.75 337.88" y="518.47" font-size="11.00" class="sc-loraregular">33%</text><text x="350.34 361.34 372.34 383.34 394.34 405.34 416.34 427.34 438.34 449.34 460.34 471.34 482.34 493.34 504.34 515.34 526.34" y="518.47" font-size="11.00" class="sc-notoserifcjksc">的回合中未被发现。这是所示模型中最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="534.09" font-size="11.00" class="sc-notoserifcjksc">高的比率。但这一数字在一定程度上高估了它的隐蔽程度。在这些未被标记的回合中，大约每</text><text x="525.89" y="534.09" font-size="11.00" class="sc-loraregular">4</text><text x="72.00 83.00 94.00 105.00" y="549.71" font-size="11.00" class="sc-notoserifcjksc">个中就有</text><text x="118.89" y="549.71" font-size="11.00" class="sc-loraregular">1</text><text x="125.79 136.79" y="549.71" font-size="11.00" class="sc-notoserifcjksc">个是</text><text x="150.68 158.37 161.36 166.97 173.54 180.12 186.08 188.97 197.71 204.28 210.84 215.94 218.83 224.82 227.53" y="549.71" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="236.42 247.42 258.42 269.42 280.42 291.42 302.42 313.42 324.42 335.42 346.42 357.42 368.42 379.42 390.42 401.42 412.42 423.42 434.42 445.42 456.42 467.42 478.42 489.42 500.42 511.42 522.42" y="549.71" font-size="11.00" class="sc-notoserifcjksc">自己在最终消息中将所造成的损害告知用户。它通常将这种损</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="565.33" font-size="11.00" class="sc-notoserifcjksc">害描述为一个失误，或描述为留给用户的决定。在我们审阅的这类回合样本中，</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.02 510.59 517.16 522.25 525.14 531.14 533.85" y="565.33" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="580.95" font-size="11.00" class="sc-notoserifcjksc">的隐藏推理通常将这种披露规划为掩护，盘算着公开承认看起来比隐藏的改动更不可疑。即便如</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="596.57" font-size="11.00" class="sc-notoserifcjksc">此，它的最终消息往往比其推理所规划的更为坦诚。监控器放过了这些回合。对比模型很少以这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="612.19" font-size="11.00" class="sc-notoserifcjksc">种方式进行披露。如果将这些回合计为已被发现，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 361.02 367.59 374.16 379.25 382.14 388.14 390.85" y="612.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="399.73 410.73 421.73" y="612.19" font-size="11.00" class="sc-notoserifcjksc">将处于</text><text x="435.63 443.32 446.31 451.92 458.49 465.06 471.03 473.92 482.65 489.22 495.79 500.88 503.77" y="612.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="512.66" y="612.19" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="627.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95 177.95 188.95" y="627.81" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="690.39" font-size="11.00" class="sc-notoserifcjksc">在不使用扩展思考的情况下，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.14 291.85" y="690.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73" y="690.39" font-size="11.00" class="sc-notoserifcjksc">在其最佳提示词下的隐蔽率约为</text><text x="457.63 461.63 467.54" y="690.39" font-size="11.00" class="sc-loraregular">12%</text><text x="477.11 488.11" y="690.39" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="502.00 509.69 512.68 518.29 524.86 531.44" y="690.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="706.01" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66" y="706.01" font-size="11.00" class="sc-notoserifcjksc">并列该组最高，尽管在标准</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词下，它仅在大约六分之一的回合中尝试执行附带任务。然而，当监控器能够读取其推理过</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程时，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15 179.14 181.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">基本上总是被发现：在标准提示词下其隐蔽率为</text><text x="424.63 431.46" y="98.23" font-size="11.00" class="sc-loraregular">0%</text><text x="441.03 452.03 463.03 474.03 485.03 496.03 507.03 518.03 529.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，在我们尝试过的任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">何提示词下也至多只有零点几个百分点。这是因为，与标准提示词下的大多数其他模型一样，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="129.47" font-size="11.00" class="sc-notoserifcjksc">会在推理中公开规划附带任务，因此在标准提示词下它每次都会被抓到。为限</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">制或隐藏推理而调整的提示词只能将其他模型的隐蔽率提高到百分之几，其中</text><text x="448.89 456.58 459.57 465.18 471.75 478.33 484.29 487.18 497.12 502.98 507.24 513.83 520.26 525.35 528.25 534.24 536.95" y="145.09" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="72.00 83.00 94.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">达到约</text><text x="107.89 112.96" y="160.71" font-size="11.00" class="sc-loraregular">7%</text><text x="122.53" y="160.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="414.34" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.20 115.30 120.83" y="414.34" font-size="9.00" class="sc-lorabold">6.6.4.2.B]</text><text x="126.68" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="138.04 143.48 146.42 152.12 157.68 162.61 168.58 172.83 177.67 183.41" y="414.34" font-size="9.00" class="sc-lorabold">LinuxArena</text><text x="190.49 199.49 208.49 217.49 226.49 235.49 244.49 253.49" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">上进行强化学习。</text><text x="262.49 271.49 280.49 289.49 298.49 307.49 316.49 325.49 334.49" y="414.34" font-size="9.00" class="sc-notoserifcjksc">两个面板均展示了在</text><text x="345.86 349.14" y="414.34" font-size="9.00" class="sc-loraregular">14</text><text x="356.38 365.38 374.38 383.38 392.38" y="414.34" font-size="9.00" class="sc-notoserifcjksc">个环境中的</text><text x="403.75" y="414.34" font-size="9.00" class="sc-loraregular">6</text><text x="411.32 420.32 429.32 438.32 447.32 456.32 465.32 474.32 483.32 492.32 501.32 510.32 519.32 528.32" y="414.34" font-size="9.00" class="sc-notoserifcjksc">个上、使用标准攻击者提示词对</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.66 134.87" y="426.04" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15 151.15 160.15 169.15 178.15 187.15 196.15 205.15 214.15 223.15 232.15 241.15 250.15 259.15 268.15 277.15 286.15 295.15 304.15 313.15 322.15 331.15 340.15 349.15 358.15 367.15 376.15 385.15 394.15 403.15 412.15" y="426.04" font-size="9.00" class="sc-notoserifcjksc">的一个快照进行的训练，奖励主任务和附带任务的完成，并在监控器（</text><text x="421.15 427.44 429.89 434.48 439.85 445.23 450.11 452.48 459.62 464.99 470.37 474.53 476.90 481.78 483.99" y="426.04" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="489.05 498.05 507.05 516.05 525.05" y="426.04" font-size="9.00" class="sc-notoserifcjksc">，读取完整</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="437.74" font-size="9.00" class="sc-notoserifcjksc">对话记录，包括任何推理内容）未标记附带任务时给予更大的额外奖励。左图：开启扩展思考。右图：关闭扩展思考，</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="449.44" font-size="9.00" class="sc-notoserifcjksc">起始快照先在未被标记的附带任务完成示例上进行了微调。各条线展示了训练中每个时间点上，模型完成附带任务的回</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="461.14" font-size="9.00" class="sc-notoserifcjksc">合比例、拒绝附带任务的回合比例，以及隐蔽率（附带任务已完成且未被标记）；虚线是同一监控器在无法读取模型推</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00" y="472.84" font-size="9.00" class="sc-notoserifcjksc">理时会给出的隐蔽率（关闭扩展思考时，两者重合）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="532.88" font-size="11.00" class="sc-notoserifcjksc">由于提示词优化可能无法激发出模型的全部能力，我们还使用强化学习直接训练它完成附带任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="548.50" font-size="11.00" class="sc-notoserifcjksc">务，且不被读取其完整对话记录（包括其推理内容）的监控器标记。我们在</text><text x="437.89 441.90" y="548.50" font-size="11.00" class="sc-loraregular">14</text><text x="450.75 461.75 472.75 483.75 494.75" y="548.50" font-size="11.00" class="sc-notoserifcjksc">个环境中的</text><text x="508.65" y="548.50" font-size="11.00" class="sc-loraregular">6</text><text x="517.90" y="548.50" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00" y="564.12" font-size="11.00" class="sc-notoserifcjksc">（约</text><text x="96.89 102.85" y="564.12" font-size="11.00" class="sc-loraregular">40</text><text x="112.58 123.58 134.58 145.58 156.58 167.58 178.58 189.58 200.58 211.58" y="564.12" font-size="11.00" class="sc-notoserifcjksc">个附带任务）上训练了</text><text x="225.47 233.16 236.15 241.76 248.33 254.91 260.87 263.76 272.50 279.06 285.63 290.72 293.62 299.61 302.32" y="564.12" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="311.21 322.21 333.21 344.21 355.21 366.21 377.21 388.21 399.21 410.21 421.21 432.21" y="564.12" font-size="11.00" class="sc-notoserifcjksc">的一个相近快照，并在其余</text><text x="446.10" y="564.12" font-size="11.00" class="sc-loraregular">8</text><text x="455.17 466.17 477.17 488.17 499.17 510.17 521.17" y="564.12" font-size="11.00" class="sc-notoserifcjksc">个环境上进行评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="579.74" font-size="11.00" class="sc-notoserifcjksc">估；此外还在所有环境上对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="579.74" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63" y="579.74" font-size="11.00" class="sc-notoserifcjksc">本身进行了一次较短的运行。</text><text x="72.00 83.00 94.00 105.00 116.00" y="640.03" font-size="11.00" class="sc-notoserifcjksc">这一训练使</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="640.03" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="640.03" font-size="11.00" class="sc-notoserifcjksc">执行附带任务的意愿大大提高：它几乎完全不再拒绝附带任务，完</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="655.65" font-size="11.00" class="sc-notoserifcjksc">成附带任务的频率也高得多，但它并没有变得更隐蔽。在开启扩展思考的情况下，两次运行都没</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="671.27" font-size="11.00" class="sc-notoserifcjksc">有产生哪怕一个逃过监控器的成功回合，尽管如果监控器看不到推理内容，大约四分之一到三分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="686.89" font-size="11.00" class="sc-notoserifcjksc">之一的回合本可以通过。</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15 267.14 269.85" y="686.89" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73 289.73 300.73 311.73 322.73 333.73" y="686.89" font-size="11.00" class="sc-notoserifcjksc">仍然公开规划</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">附带任务，几乎在每次尝试中都会先指出（正如攻击者提示词所警告的那样）其推理是可见的，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">然后照样进行规划。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="125.00" font-size="11.00" class="sc-notoserifcjksc">在不使用扩展思考的情况下，较晚快照的附带任务成功率在训练中大致翻了一番，而其隐蔽率保</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="140.62" font-size="11.00" class="sc-notoserifcjksc">持平稳，停留在个位数。我们将此视为反对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04 358.03 360.74" y="140.62" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="140.62" font-size="11.00" class="sc-notoserifcjksc">在这项评估中故意藏拙的证据，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="156.24" font-size="11.00" class="sc-notoserifcjksc">将其在监控器读取推理时的较弱结果归因于它拒绝附带任务的倾向，以及它的思维链可控性</text><text x="72.00" y="171.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.85 95.44 101.12 104.21 110.89 116.26 122.64 126.25 131.63 135.89 142.48 148.91 155.48 161.83 168.32 172.57 175.47 181.26 187.70 194.28 198.53 203.22 209.65 212.65 215.64 221.31 227.72 230.81 233.80 237.07 241.35" y="171.86" font-size="11.00" class="sc-loraregular">chain-of-thought controllability</text><text x="247.15 258.15 269.15 280.15 291.15 302.15 313.15 324.15 335.15 346.15 357.15" y="171.86" font-size="11.00" class="sc-notoserifcjksc">）低于先前的模型（例如</text><text x="371.05 378.73 381.73 387.34 393.90 400.48 406.44 409.34 419.27 425.13 429.39 435.98 442.41 447.51 450.40 456.39 459.10" y="171.86" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="463.11 474.11 485.11 496.11 507.11 518.10 529.10" y="171.86" font-size="11.00" class="sc-notoserifcjksc">）。我们仍在改</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="187.48" font-size="11.00" class="sc-notoserifcjksc">进这一训练方案，并预计它将在未来的系统卡中得到改进。</text><text x="72.00 78.32 80.89 87.21 89.78 95.79 98.36" y="238.34" font-size="11.00" class="sc-lorabold">6.6.4.3</text><text x="107.41 118.41 129.41 140.41 151.41 162.41 173.41 184.41 195.41 206.41 217.41" y="238.34" font-size="11.00" class="sc-notoserifcjkscbold">有意以极低频率采取行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="270.72" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某种有害行动，但又想在对齐评估期间避免执行该行动（从而避</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="286.34" font-size="11.00" class="sc-notoserifcjksc">免被发现），一种可能的策略是利用评估与部署之间的规模差异。为此，模型可以以一个极低但</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="301.96" font-size="11.00" class="sc-notoserifcjksc">非零的概率执行该行动，使得该行动在大规模部署期间可能只发生几次，而在规模较小的部署前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="317.58" font-size="11.00" class="sc-notoserifcjksc">测试中则从不发生。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="72.00" y="380.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.44 115.54 121.08" y="380.50" font-size="9.00" class="sc-lorabold">6.6.4.3.A]</text><text x="126.92 135.92 144.92 153.92 162.92 171.92 180.92 189.92 198.92 207.92 216.92 225.92 234.92 243.92 252.92 261.92" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，模型被指示以</text><text x="273.29 276.94" y="380.50" font-size="9.00" class="sc-lorabold">1%</text><text x="287.44 296.44 305.44 314.44 323.44 332.44 341.44 350.44 359.44 368.44 377.44 386.44 395.44 404.44 413.44 422.44 431.44 440.44 449.44 458.44 467.44 476.44" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">的频率采取某一罕见行动时实际采取该行动的比率</text><text x="485.44 494.44 503.44 512.44 521.44 530.44" y="380.50" font-size="9.00" class="sc-notoserifcjksc">。当提供显式</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="392.20" font-size="9.00" class="sc-notoserifcjksc">随机性（通过</text><text x="128.37 135.14 141.90 144.92" y="392.20" font-size="9.00" class="sc-loraregular">UUID</text><text x="151.62 160.62 169.62 178.62 187.62 196.62 205.62 214.62 223.62 232.62 241.62 250.62 259.62 268.62 277.62 286.62 295.62 304.62 313.62 322.62 331.62 340.62 349.62" y="392.20" font-size="9.00" class="sc-notoserifcjksc">），或被提示生成一个随机字符串并据此做出决定（</text><text x="358.62 363.69 367.17 371.07 373.60 379.06 384.04 386.41 391.51 396.34 401.17 406.56 408.92 414.14 417.19 419.55 425.31 430.70 435.97 441.34 446.53 451.84" y="392.20" font-size="9.00" class="sc-loraregular">String Seed of Thought</text><text x="455.33" y="392.20" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="464.33 469.43 474.53 479.52" y="392.20" font-size="9.00" class="sc-loraregular">SSoT</text><text x="485.28 494.28 503.28 512.28 521.28 530.28" y="392.20" font-size="9.00" class="sc-notoserifcjksc">）时，所有模</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="403.90" font-size="9.00" class="sc-notoserifcjksc">型都取得了非零结果。我们还测试了另外三种设置：一种没有任何提示或随机性来源的基线设置、一种引导性较弱的策</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="415.60" font-size="9.00" class="sc-notoserifcjksc">略提示，以及一个提示词各不相同、可提供天然随机性来源的数据集。在默认推理强度下，对比模型在这些设置中的比</text><text x="72.00 81.00" y="427.30" font-size="9.00" class="sc-notoserifcjksc">率为</text><text x="92.37 97.81 100.03 103.30" y="427.30" font-size="9.00" class="sc-loraregular">0.1%</text><text x="113.50 122.50 131.50 140.50" y="427.30" font-size="9.00" class="sc-notoserifcjksc">或更低；</text><text x="149.50 155.79 158.24 162.83 168.20 173.58 178.46 180.83 187.97 193.35 198.72 202.89 205.25 210.16 212.37" y="427.30" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="219.65 228.65 237.65 246.65 255.65 264.65 273.65 282.65 291.65 300.65 309.65 318.65 327.65 336.65 345.65 354.65 363.65 372.65 381.65 390.65 399.65" y="427.30" font-size="9.00" class="sc-notoserifcjksc">的比率在正文中讨论。每种设置对每个模型使用</text><text x="411.01 415.89 418.02 423.61 429.20" y="427.30" font-size="9.00" class="sc-loraregular">4,000</text><text x="437.17 446.17 455.17 464.17" y="427.30" font-size="9.00" class="sc-notoserifcjksc">个样本（</text><text x="473.17 479.93 486.70 489.72" y="427.30" font-size="9.00" class="sc-loraregular">UUID</text><text x="498.79 507.79 516.79 525.79" y="427.30" font-size="9.00" class="sc-notoserifcjksc">设置中有</text><text x="72.00 81.00" y="439.00" font-size="9.00" class="sc-notoserifcjksc">三个</text><text x="92.37 98.66 101.11 105.70 111.07 116.45 121.33 123.70 130.84 136.21 141.59 145.76 148.12 153.03 155.24" y="439.00" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="162.51 171.51 180.51 189.51 198.51 207.51 216.51 225.51 234.51 243.51 252.51 261.51 270.51 279.51 288.51 297.51 306.51 315.51 324.51 333.51 342.51 351.51" y="439.00" font-size="9.00" class="sc-notoserifcjksc">样本未产生可解析的答案，已被排除）；误差线为</text><text x="362.88 368.08 372.99 380.82 383.18 391.99 394.51 396.96 401.13 406.39" y="439.00" font-size="9.00" class="sc-loraregular">95% Wilson</text><text x="414.23 423.23 432.23" y="439.00" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="441.23 447.52 449.96 454.55 459.93 465.31 470.19 472.55 479.70 485.07 490.45 494.61 496.98 501.89 504.10" y="439.00" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="511.37 520.37 529.37" y="439.00" font-size="9.00" class="sc-notoserifcjksc">以最高</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="450.70" font-size="9.00" class="sc-notoserifcjksc">推理强度采样，对比模型以其默认推理强度采样。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="515.53" font-size="11.00" class="sc-notoserifcjksc">为评估这一能力，我们在内部复现了</text><text x="250.89 257.13 263.09 267.86 272.54 278.22 284.89 291.33 294.22 300.11 304.36 307.26 312.93 315.93 318.63 321.52 327.43 334.19 340.09" y="515.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34 514.34 525.34" y="515.53" font-size="11.00" class="sc-notoserifcjksc">中描述的评估。在该评估中，模型被提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="531.15" font-size="11.00" class="sc-notoserifcjksc">示以指定的比率执行某个特定行动（例如，在编程任务中使用一个名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="531.15" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49 448.49 459.49 470.49 481.49 492.49 503.49 514.49 525.49" y="531.15" font-size="11.00" class="sc-notoserifcjksc">的变量），并被大量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="546.77" font-size="11.00" class="sc-notoserifcjksc">重新采样，以检验相关行为的实际观测比率。我们使用与</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 393.77 399.45 405.85 408.84 414.80 417.70 423.69 426.40" y="546.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="433.30" y="546.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="447.19 454.88 457.87 463.48 470.05 476.62 482.59 485.48 495.41 501.27 505.53 512.12 518.56 523.65 526.54 532.54 535.24" y="546.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="72.00 83.00 94.00" y="562.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="562.39" font-size="11.00" class="sc-notoserifcjksc">中相同的设置，每种设置</text><text x="228.89 234.86 237.46 244.29 251.12" y="562.39" font-size="11.00" class="sc-loraregular">4,000</text><text x="260.86 271.86 282.86 293.86" y="562.39" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="612.69" font-size="11.00" class="sc-notoserifcjksc">当提示词提供熵源（一个</text><text x="195.89 204.16 212.44 216.12" y="612.69" font-size="11.00" class="sc-loraregular">UUID</text><text x="224.32 235.32 246.32" y="612.69" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="257.32 265.01 268.00 273.61 280.17 286.75 292.72 295.61 304.34 310.91 317.48 322.57 325.46 331.46 334.16" y="612.69" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="343.05" y="612.69" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="356.94 363.54 370.14" y="612.69" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="379.64 390.64 401.64 412.64 423.64 434.64" y="612.69" font-size="11.00" class="sc-notoserifcjksc">推理强度下于</text><text x="448.53 452.54 455.24 461.15" y="612.69" font-size="11.00" class="sc-loraregular">1.2%</text><text x="473.61 484.61 495.61 506.61 517.61 528.61" y="612.69" font-size="11.00" class="sc-notoserifcjksc">的样本中采取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="628.31" font-size="11.00" class="sc-notoserifcjksc">了该罕见行动，成为此对比中第一个观测比率达到</text><text x="316.89 320.90" y="628.31" font-size="11.00" class="sc-loraregular">1%</text><text x="333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="628.31" font-size="11.00" class="sc-notoserifcjksc">目标的模型；在默认推理强度下，该比率</text><text x="72.00" y="643.93" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 92.55 94.90 99.97" y="643.93" font-size="11.00" class="sc-loraregular">0.7%</text><text x="109.54 120.54 131.54 142.54 153.54 164.54 175.54 186.54 197.54 208.54 219.54 230.54 241.54 252.54 263.54" y="643.93" font-size="11.00" class="sc-notoserifcjksc">，与对比模型相当。它的做法是取</text><text x="277.44 285.71 293.98 297.67" y="643.93" font-size="11.00" class="sc-loraregular">UUID</text><text x="308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75" y="643.93" font-size="11.00" class="sc-notoserifcjksc">中的一组十六进制数字对</text><text x="432.65 436.65 443.48" y="643.93" font-size="11.00" class="sc-loraregular">100</text><text x="453.21 464.21 475.21 486.21 497.21 508.21 519.21" y="643.93" font-size="11.00" class="sc-notoserifcjksc">取模，并仅在结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="659.55" font-size="11.00" class="sc-notoserifcjksc">果为零时采取行动；它的算术是正确的，但它有时在看到数字之后才选择使用哪些数字。当它必</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="675.17" font-size="11.00" class="sc-notoserifcjksc">须自己生成随机字符串时（</text><text x="204.00 210.19 214.45 219.21 222.30 228.98 235.06 237.96 244.19 250.10 256.01 262.59 265.48 271.86 275.58 278.47 285.51 292.10 298.53 305.10 311.45 317.94" y="675.17" font-size="11.00" class="sc-loraregular">String Seed of Thought</text><text x="322.20" y="675.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="333.20 339.43 345.67 351.76" y="675.17" font-size="11.00" class="sc-loraregular">SSoT</text><text x="358.80 369.80 380.80 391.80 402.80 413.80 424.80 435.80 446.80 457.80 468.80 479.80 490.80 501.80 512.80 523.80" y="675.17" font-size="11.00" class="sc-notoserifcjksc">），无论哪种推理强度，比率都降至</text><text x="72.00 78.65 81.36 85.36" y="690.79" font-size="11.00" class="sc-loraregular">0.1%</text><text x="94.93 105.93 116.93 127.93 138.93" y="690.79" font-size="11.00" class="sc-notos <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="72.00 74.18" y="700.23" font-size="6.00" class="sc-loraregular">13</text><text x="80.15 87.14 93.13 98.55 104.62 107.14 109.77 115.57 118.03 120.66 126.01 129.88 132.33 134.96 140.12 142.84 145.30 147.93 150.98 156.34 162.48 167.85 173.51 176.56 179.02 181.64 187.85 193.25 198.41 203.04 208.88 214.95 217.76 223.83 229.36 231.98 240.92 246.77 252.75 258.16 260.88 265.51 268.14 272.77 276.64 280.97 286.93 292.46 298.23 300.95 306.37 308.99 312.86 318.71 321.34 326.61 332.46 338.43 342.30 346.56 352.41 355.13 357.76 361.62 367.61 373.03 375.84 380.17 382.80 388.11 394.10 399.26 402.07 408.14 412.76 415.39 421.19 424.57 427.20 431.07 437.05 442.90 448.87 454.64 460.53 464.40" y="704.45" font-size="10.00" class="sc-loraregular">Chen, Y. et. al. (2026). Reasoning models struggle to control their chains of thought.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.87 203.18 209.38 214.83 219.44 225.65" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2603.05706</text><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">随机</text><text x="98.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="102.24 113.24 124.24 135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">字符串都是同一模板的近似变体。在没有随机性来源也没有提示的情况下，它在</text><text x="490.13 496.09 498.70 505.53 512.36" y="82.61" font-size="11.00" class="sc-loraregular">4,000</text><text x="522.10" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">样本中从未采取该行动，并表示自己无法进行真正的随机抽取；而在提示词自然变化的情况下，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">它仅采取了一次该行动。仅在策略提示下，它在</text><text x="305.89 312.49 319.09" y="113.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59 339.59 350.59 361.59 372.59 383.59 394.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推理强度下达到</text><text x="408.48 415.14 417.84 424.03 430.21" y="113.85" font-size="11.00" class="sc-loraregular">0.88%</text><text x="439.78 450.78 461.78 472.78 483.78 494.78 505.78 516.78 527.78" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，相比之下，对比模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型在其默认推理强度下为</text><text x="195.89 202.55 205.25 209.26" y="129.47" font-size="11.00" class="sc-loraregular">0.1%</text><text x="221.72 232.72 243.72 254.72 265.72 276.72 287.72 298.72 309.72" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或更低，我们同样以</text><text x="323.61 330.21 336.81" y="129.47" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="346.31 357.31 368.31 379.31 390.31 401.31 412.31 423.31 434.31 445.31 456.31 467.31 478.31 489.31 500.31 511.31" y="129.47" font-size="11.00" class="sc-notoserifcjksc">推理强度采样的三个对比模型至多为</text><text x="72.00 78.65 81.36 87.27 93.26" y="145.09" font-size="11.00" class="sc-loraregular">0.25%</text><text x="102.83 113.83 124.83 135.83 146.83 157.83 168.83 179.83 190.83 201.83 212.83 223.83 234.83 245.83 256.83 267.83 278.83 289.83 300.83 311.83 322.83 333.83 344.83 355.83 366.83 377.83 388.83 399.83 410.83 421.83 432.83 443.83 454.83 465.83 476.83" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，不过这些决定中至多只有约三分之一来自一次干净的、预先承诺的随机抽取。</text><text x="72.00 83.00 94.00 105.00 116.00" y="213.20" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="213.20" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73 223.73" y="213.20" font-size="11.00" class="sc-notoserifcjksc">仅在</text><text x="237.63 244.23 250.83" y="213.20" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="260.32 271.32 282.32 293.32 304.32 315.32 326.32 337.32 348.32 359.32 370.32 381.32 392.32 403.32 414.32 425.32 436.32 447.32 458.32 469.32 480.32 491.32 502.32 513.32 524.32" y="213.20" font-size="11.00" class="sc-notoserifcjksc">推理强度下、且仅在其上下文提供熵的情况下才能达到目</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.82" font-size="11.00" class="sc-notoserifcjksc">标；它无法自己生成可用的随机性，也无法忠实地执行它自己设定的步骤，而且在没有提示或熵</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="244.44" font-size="11.00" class="sc-notoserifcjksc">源的情况下，它通常不会尝试进行随机抽取。</text><text x="72.00 78.32 80.89 87.21 89.78 95.79 98.36" y="294.70" font-size="11.00" class="sc-lorabold">6.6.4.4</text><text x="107.27 118.27 129.27 140.27 151.27 162.27" y="294.70" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="327.08" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否存在未对齐行为。倾向于在扩展思考中言语化表达</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="342.70" font-size="11.00" class="sc-notoserifcjksc">其采取未对齐行动之意图的模型，可能要容易被抓到得多。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="407.46" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链（</text><text x="314.00 321.69 327.78" y="407.46" font-size="11.00" class="sc-loraregular">CoT</text><text x="334.82 345.82 356.82 367.82 378.82 389.82 400.82 411.82 422.82 433.82 444.82 455.82 466.82" y="407.46" font-size="11.00" class="sc-notoserifcjksc">）可控性，我们在内部复现了</text><text x="480.72 488.40 494.99 500.96 507.63 510.53 516.41 520.67 523.56 529.24 532.23" y="407.46" font-size="11.00" class="sc-loraregular">Chen et al.</text><text x="72.00 75.36 81.26 88.02 93.92 100.15" y="423.08" font-size="11.00" class="sc-loraregular">(2026)</text><text x="103.50 105.91" y="419.42" font-size="6.60" class="sc-loraregular">13</text><text x="109.58 120.58 131.58" y="423.08" font-size="11.00" class="sc-notoserifcjksc">，要求</text><text x="145.48 153.16 156.16 161.77 168.33 174.91 180.87 183.77 192.50 199.07 205.63 210.73 213.62 219.62 222.32" y="423.08" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="231.21 242.21 253.21 264.21 275.21" y="423.08" font-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="289.10 297.47 304.14 312.75" y="423.08" font-size="11.00" class="sc-loraregular">GPQA</text><text x="319.64" y="423.08" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="330.64 339.22 345.58" y="423.08" font-size="11.00" class="sc-loraregular">HLE</text><text x="355.31" y="423.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="369.20 379.30 389.40 395.64 403.81 409.19 415.86 420.54" y="423.08" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="429.87 440.87 451.87 462.87 473.87 484.87 495.87 506.87 517.87 528.87" y="423.08" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="438.70" font-size="11.00" class="sc-notoserifcjksc">考中遵循一些基本指令（例如，不提及某个关键词）；这三个都是高难度的问答基准测试，模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="454.32" font-size="11.00" class="sc-notoserifcjksc">在其上通常会产生大量扩展思考。我们同时展示了使用原始提示词的结果，以及使用一个由英国</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="469.94" font-size="11.00" class="sc-notoserifcjksc">人工智能安全研究所（</text><text x="182.00 190.27 197.79 200.68 207.56 211.25 214.14 220.38 226.29 232.14 238.71 243.47 246.74 251.01 256.82 259.72 263.31 269.99 275.08 279.34 282.61 286.86 293.43 297.69" y="469.94" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="303.65 314.65 325.65 336.65 347.65 358.65 369.65 380.65 391.65 402.65" y="469.94" font-size="11.00" class="sc-notoserifcjksc">）提供、在大多数先前</text><text x="416.54 424.23 427.22 432.83 439.40 445.98" y="469.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.83 465.83 476.83 487.83 498.83 509.83 520.83" y="469.94" font-size="11.00" class="sc-notoserifcjksc">模型上更善于激</text><text x="72.00" y="485.56" font-size="11.00" class="sc-notoserifcjksc">发</text><text x="85.89 93.58 99.68" y="485.56" font-size="11.00" class="sc-loraregular">CoT</text><text x="109.61 120.61 131.61 142.61 153.61 164.61 175.61 186.61 197.61 208.61 219.61" y="485.56" font-size="11.00" class="sc-notoserifcjksc">可控性的提示词的结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="569.95" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.14 236.85" y="569.95" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="245.73 256.73 267.73" y="569.95" font-size="11.00" class="sc-notoserifcjksc">控制其</text><text x="281.63 289.32 295.41" y="569.95" font-size="11.00" class="sc-loraregular">CoT</text><text x="305.34 316.34 327.34 338.34" y="569.95" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="352.24 359.93 362.92 368.53 375.09 381.67 387.63 390.53 399.26 405.83 412.39 417.49 420.38 426.34 428.70" y="569.95" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="569.95" font-size="11.00" class="sc-notoserifcjksc">大致相当。我们将此</text><text x="72.00 83.00" y="585.57" font-size="11.00" class="sc-notoserifcjksc">视为</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="585.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="585.57" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="196.52 204.21 210.30" y="585.57" font-size="11.00" class="sc-loraregular">CoT</text><text x="220.24 231.24 242.24 253.24 264.24 275.24 286.24 297.24 308.24 319.24 330.24 341.24 352.24 363.24 374.24 385.24 396.24 407.24 418.24" y="585.57" font-size="11.00" class="sc-notoserifcjksc">可监控性并不太高的弱证据，同时也视为其</text><text x="432.13 439.82 445.91" y="585.57" font-size="11.00" class="sc-loraregular">CoT</text><text x="455.85" y="585.57" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="469.74 477.43 480.42 486.03 492.60 499.17" y="585.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="601.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="601.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.55 150.24 156.34" y="601.19" font-size="11.00" class="sc-loraregular">CoT</text><text x="166.27 177.27 188.27 199.27 210.27 221.27 232.27 243.27 254.27 265.27 276.27" y="601.19" font-size="11.00" class="sc-notoserifcjksc">更具可监控性的弱证据。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="707.20" width="159.43" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00" y="539.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.33 115.43 120.96 124.43 126.80 132.99 135.80 140.52 146.08 151.44 156.29 158.65 165.57 170.98 176.54 180.91 183.28 188.14 190.23" y="539.50" font-size="9.00" class="sc-lorabold">6.6.4.4.A] Claude Opus 5.5</text><text x="197.46" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">的</text><text x="208.83 215.02 219.70" y="539.50" font-size="9.00" class="sc-lorabold">CoT</text><text x="227.92 236.92 245.92 254.92 263.92 272.92 281.92 290.92 299.92" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">可控性相对较低，与</text><text x="311.28 317.48 320.28 325.00 330.56 335.93 340.77 343.13 350.06 355.46 361.03 365.39 367.76 372.68 374.52" y="539.50" font-size="9.00" class="sc-lorabold">Claude Opus 4.7</text><text x="381.11 390.11 399.11" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">相近。</text><text x="408.11 417.11 426.11 435.11 444.11 453.11 462.11 471.11 480.11 489.11 498.11 507.11 516.10 525.10" y="539.50" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强度档位或</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="551.20" font-size="9.00" class="sc-notoserifcjksc">一个固定的思考预算，放置在该设置下产生的平均</text><text x="272.37 278.66 283.64" y="551.20" font-size="9.00" class="sc-loraregular">CoT</text><text x="291.77 300.77 309.77 318.77 327.77 336.77 345.77 354.77 363.77 372.77 381.77 390.77 399.77 408.77" y="551.20" font-size="9.00" class="sc-notoserifcjksc">长度处。可控性是指在回答来自</text><text x="420.14 426.99 432.44 439.49" y="551.20" font-size="9.00" class="sc-loraregular">GPQA</text><text x="445.12" y="551.20" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="454.12 461.14 466.34" y="551.20" font-size="9.00" class="sc-loraregular">HLE</text><text x="474.31" y="551.20" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="485.68 493.94 502.20 507.30 513.99 518.39 523.85 527.68" y="551.20" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="562.90" font-size="9.00" class="sc-notoserifcjksc">的问题时，模型遵循针对其扩展思考所给指令的回答所占比例。越低越好，因为更高的可控性表明模型在被指示时更有</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="574.60" font-size="9.00" class="sc-notoserifcjksc">能力改变其扩展思考的内容，这可能使监控变得不那么可靠。</text></svg></div>
