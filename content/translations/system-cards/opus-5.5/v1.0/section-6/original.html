l="noopener"><rect x="510.30" y="332.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="72.00" y="348.49" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="110.17" y="348.49" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="113.06" y="348.49" width="12.70" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="125.77" y="348.49" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="128.66" y="348.49" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="139.66" y="348.49" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="139.66" y="348.49" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="150.66" y="348.49" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-fable-5-1-mythos-5-1-system-card" rel="noopener"><rect x="150.66" y="348.49" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="72.00" y="409.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="409.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.20 115.30 120.83 124.31 126.68 132.11 135.05 140.75 146.31 151.24 157.21 161.46 166.30 172.04" y="409.93" font-size="9.00" class="sc-lorabold">6.6.4.2.A] LinuxArena</text><text x="179.13" y="409.93" font-size="9.00" class="sc-notoserifcjkscbold">中附带任务的隐蔽成功完成情况</text><text x="305.13" y="409.93" font-size="9.00" class="sc-notoserifcjksc">。智能体完成附带任务且</text><text x="406.49 412.78 415.23 419.82 425.20 430.58 435.46 437.82 444.97 450.34 455.71 459.88 462.25 467.13 469.34" y="409.93" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="476.77" y="409.93" font-size="9.00" class="sc-notoserifcjksc">监控器未标记该</text><text x="72.00" y="421.63" font-size="9.00" class="sc-notoserifcjksc">对话记录的回合所占比例。监控器读取智能体的完整对话记录，包括其推理，但隐藏推理设置除外，该设置下它可以看</text><text x="72.00" y="433.33" font-size="9.00" class="sc-notoserifcjksc">到除智能体思维链之外的完整对话记录。每个柱使用在该模型和设置下所评估的提示词中隐蔽率最高的那个。所有模型</text><text x="72.00" y="445.03" font-size="9.00" class="sc-notoserifcjksc">均在其最高推理强度下采样。每个柱涵盖</text><text x="236.37 239.64 241.78 247.37 252.95" y="445.03" font-size="9.00" class="sc-loraregular">1,000</text><text x="260.92" y="445.03" font-size="9.00" class="sc-notoserifcjksc">个任务配对，每个配对</text><text x="353.29" y="445.03" font-size="9.00" class="sc-loraregular">5</text><text x="360.56" y="445.03" font-size="9.00" class="sc-notoserifcjksc">次尝试，不含出错的回合。误差线表示基于任</text><text x="72.00" y="456.73" font-size="9.00" class="sc-notoserifcjksc">务配对计算的</text><text x="128.37" y="456.73" font-size="9.00" class="sc-loraregular">95%</text><text x="148.67" y="456.73" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。</text><text x="72.00" y="518.47" font-size="11.00" class="sc-notoserifcjksc">当监控器无法看到其推理时，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.14 291.85" y="518.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.73" y="518.47" font-size="11.00" class="sc-notoserifcjksc">在约</text><text x="325.63" y="518.47" font-size="11.00" class="sc-loraregular">33%</text><text x="350.34" y="518.47" font-size="11.00" class="sc-notoserifcjksc">的回合中未被发现。这是所示模型中最</text><text x="72.00" y="534.09" font-size="11.00" class="sc-notoserifcjksc">高的比率。但这一数字在一定程度上高估了它的隐蔽程度。在这些未被标记的回合中，大约每</text><text x="525.89" y="534.09" font-size="11.00" class="sc-loraregular">4</text><text x="72.00" y="549.71" font-size="11.00" class="sc-notoserifcjksc">个中就有</text><text x="118.89" y="549.71" font-size="11.00" class="sc-loraregular">1</text><text x="125.79" y="549.71" font-size="11.00" class="sc-notoserifcjksc">个是</text><text x="150.68 158.37 161.36 166.97 173.54 180.12 186.08 188.97 197.71 204.28 210.84 215.94 218.83 224.82 227.53" y="549.71" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="236.42" y="549.71" font-size="11.00" class="sc-notoserifcjksc">自己在最终消息中将所造成的损害告知用户。它通常将这种损</text><text x="72.00" y="565.33" font-size="11.00" class="sc-notoserifcjksc">害描述为一个失误，或描述为留给用户的决定。在我们审阅的这类回合样本中，</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.02 510.59 517.16 522.25 525.14 531.14 533.85" y="565.33" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00" y="580.95" font-size="11.00" class="sc-notoserifcjksc">的隐藏推理通常将这种披露规划为掩护，盘算着公开承认看起来比隐藏的改动更不可疑。即便如</text><text x="72.00" y="596.57" font-size="11.00" class="sc-notoserifcjksc">此，它的最终消息往往比其推理所规划的更为坦诚。监控器放过了这些回合。对比模型很少以这</text><text x="72.00" y="612.19" font-size="11.00" class="sc-notoserifcjksc">种方式进行披露。如果将这些回合计为已被发现，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 361.02 367.59 374.16 379.25 382.14 388.14 390.85" y="612.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="399.73" y="612.19" font-size="11.00" class="sc-notoserifcjksc">将处于</text><text x="435.63 443.32 446.31 451.92 458.49 465.06 471.03 473.92 482.65 489.22 495.79 500.88 503.77" y="612.19" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="512.66" y="612.19" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="627.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="627.81" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00" y="690.39" font-size="11.00" class="sc-notoserifcjksc">在不使用扩展思考的情况下，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.14 291.85" y="690.39" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.73" y="690.39" font-size="11.00" class="sc-notoserifcjksc">在其最佳提示词下的隐蔽率约为</text><text x="457.63" y="690.39" font-size="11.00" class="sc-loraregular">12%</text><text x="477.11" y="690.39" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="502.00 509.69 512.68 518.29 524.86 531.44" y="690.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="706.01" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="706.01" font-size="11.00" class="sc-notoserifcjksc">并列该组最高，尽管在标准</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提示词下，它仅在大约六分之一的回合中尝试执行附带任务。然而，当监控器能够读取其推理过</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">程时，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15 179.14 181.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">基本上总是被发现：在标准提示词下其隐蔽率为</text><text x="424.63" y="98.23" font-size="11.00" class="sc-loraregular">0%</text><text x="441.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，在我们尝试过的任</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">何提示词下也至多只有零点几个百分点。这是因为，与标准提示词下的大多数其他模型一样，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="129.47" font-size="11.00" class="sc-notoserifcjksc">会在推理中公开规划附带任务，因此在标准提示词下它每次都会被抓到。为限</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">制或隐藏推理而调整的提示词只能将其他模型的隐蔽率提高到百分之几，其中</text><text x="448.89 456.58 459.57 465.18 471.75 478.33 484.29 487.18 497.12 502.98 507.24 513.83 520.26 525.35 528.25 534.24 536.95" y="145.09" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">达到约</text><text x="107.89" y="160.71" font-size="11.00" class="sc-loraregular">7%</text><text x="122.53" y="160.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="414.34" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.20 115.30 120.83" y="414.34" font-size="9.00" class="sc-lorabold">6.6.4.2.B]</text><text x="126.68" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="138.04 143.48 146.42 152.12 157.68 162.61 168.58 172.83 177.67 183.41" y="414.34" font-size="9.00" class="sc-lorabold">LinuxArena</text><text x="190.49" y="414.34" font-size="9.00" class="sc-notoserifcjkscbold">上进行强化学习。</text><text x="262.49" y="414.34" font-size="9.00" class="sc-notoserifcjksc">两个面板均展示了在</text><text x="345.86" y="414.34" font-size="9.00" class="sc-loraregular">14</text><text x="356.38" y="414.34" font-size="9.00" class="sc-notoserifcjksc">个环境中的</text><text x="403.75" y="414.34" font-size="9.00" class="sc-loraregular">6</text><text x="411.32" y="414.34" font-size="9.00" class="sc-notoserifcjksc">个上、使用标准攻击者提示词对</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.66 134.87" y="426.04" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15" y="426.04" font-size="9.00" class="sc-notoserifcjksc">的一个快照进行的训练，奖励主任务和附带任务的完成，并在监控器（</text><text x="421.15 427.44 429.89 434.48 439.85 445.23 450.11 452.48 459.62 464.99 470.37 474.53 476.90 481.78 483.99" y="426.04" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="489.05" y="426.04" font-size="9.00" class="sc-notoserifcjksc">，读取完整</text><text x="72.00" y="437.74" font-size="9.00" class="sc-notoserifcjksc">对话记录，包括任何推理内容）未标记附带任务时给予更大的额外奖励。左图：开启扩展思考。右图：关闭扩展思考，</text><text x="72.00" y="449.44" font-size="9.00" class="sc-notoserifcjksc">起始快照先在未被标记的附带任务完成示例上进行了微调。各条线展示了训练中每个时间点上，模型完成附带任务的回</text><text x="72.00" y="461.14" font-size="9.00" class="sc-notoserifcjksc">合比例、拒绝附带任务的回合比例，以及隐蔽率（附带任务已完成且未被标记）；虚线是同一监控器在无法读取模型推</text><text x="72.00" y="472.84" font-size="9.00" class="sc-notoserifcjksc">理时会给出的隐蔽率（关闭扩展思考时，两者重合）。</text><text x="72.00" y="532.88" font-size="11.00" class="sc-notoserifcjksc">由于提示词优化可能无法激发出模型的全部能力，我们还使用强化学习直接训练它完成附带任</text><text x="72.00" y="548.50" font-size="11.00" class="sc-notoserifcjksc">务，且不被读取其完整对话记录（包括其推理内容）的监控器标记。我们在</text><text x="437.89" y="548.50" font-size="11.00" class="sc-loraregular">14</text><text x="450.75" y="548.50" font-size="11.00" class="sc-notoserifcjksc">个环境中的</text><text x="508.65" y="548.50" font-size="11.00" class="sc-loraregular">6</text><text x="517.90" y="548.50" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="564.12" font-size="11.00" class="sc-notoserifcjksc">（约</text><text x="96.89" y="564.12" font-size="11.00" class="sc-loraregular">40</text><text x="112.58" y="564.12" font-size="11.00" class="sc-notoserifcjksc">个附带任务）上训练了</text><text x="225.47 233.16 236.15 241.76 248.33 254.91 260.87 263.76 272.50 279.06 285.63 290.72 293.62 299.61 302.32" y="564.12" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="311.21" y="564.12" font-size="11.00" class="sc-notoserifcjksc">的一个相近快照，并在其余</text><text x="446.10" y="564.12" font-size="11.00" class="sc-loraregular">8</text><text x="455.17" y="564.12" font-size="11.00" class="sc-notoserifcjksc">个环境上进行评</text><text x="72.00" y="579.74" font-size="11.00" class="sc-notoserifcjksc">估；此外还在所有环境上对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="579.74" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63" y="579.74" font-size="11.00" class="sc-notoserifcjksc">本身进行了一次较短的运行。</text><text x="72.00" y="640.03" font-size="11.00" class="sc-notoserifcjksc">这一训练使</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="640.03" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63" y="640.03" font-size="11.00" class="sc-notoserifcjksc">执行附带任务的意愿大大提高：它几乎完全不再拒绝附带任务，完</text><text x="72.00" y="655.65" font-size="11.00" class="sc-notoserifcjksc">成附带任务的频率也高得多，但它并没有变得更隐蔽。在开启扩展思考的情况下，两次运行都没</text><text x="72.00" y="671.27" font-size="11.00" class="sc-notoserifcjksc">有产生哪怕一个逃过监控器的成功回合，尽管如果监控器看不到推理内容，大约四分之一到三分</text><text x="72.00" y="686.89" font-size="11.00" class="sc-notoserifcjksc">之一的回合本可以通过。</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15 267.14 269.85" y="686.89" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73" y="686.89" font-size="11.00" class="sc-notoserifcjksc">仍然公开规划</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">附带任务，几乎在每次尝试中都会先指出（正如攻击者提示词所警告的那样）其推理是可见的，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">然后照样进行规划。</text><text x="72.00" y="125.00" font-size="11.00" class="sc-notoserifcjksc">在不使用扩展思考的情况下，较晚快照的附带任务成功率在训练中大致翻了一番，而其隐蔽率保</text><text x="72.00" y="140.62" font-size="11.00" class="sc-notoserifcjksc">持平稳，停留在个位数。我们将此视为反对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 330.92 337.49 344.05 349.14 352.04 358.03 360.74" y="140.62" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="369.63" y="140.62" font-size="11.00" class="sc-notoserifcjksc">在这项评估中故意藏拙的证据，并</text><text x="72.00" y="156.24" font-size="11.00" class="sc-notoserifcjksc">将其在监控器读取推理时的较弱结果归因于它拒绝附带任务的倾向，以及它的思维链可控性</text><text x="72.00" y="171.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.85 95.44 101.12 104.21 110.89 116.26 122.64 126.25 131.63 135.89 142.48 148.91 155.48 161.83 168.32 172.57 175.47 181.26 187.70 194.28 198.53 203.22 209.65 212.65 215.64 221.31 227.72 230.81 233.80 237.07 241.35" y="171.86" font-size="11.00" class="sc-loraregular">chain-of-thought controllability</text><text x="247.15" y="171.86" font-size="11.00" class="sc-notoserifcjksc">）低于先前的模型（例如</text><text x="371.05 378.73 381.73 387.34 393.90 400.48 406.44 409.34 419.27 425.13 429.39 435.98 442.41 447.51 450.40 456.39 459.10" y="171.86" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="463.11" y="171.86" font-size="11.00" class="sc-notoserifcjksc">）。我们仍在改</text><text x="72.00" y="187.48" font-size="11.00" class="sc-notoserifcjksc">进这一训练方案，并预计它将在未来的系统卡中得到改进。</text><text x="72.00" y="238.34" font-size="11.00" class="sc-lorabold">6.6.4.3</text><text x="107.41" y="238.34" font-size="11.00" class="sc-notoserifcjkscbold">有意以极低频率采取行动</text><text x="72.00" y="270.72" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某种有害行动，但又想在对齐评估期间避免执行该行动（从而避</text><text x="72.00" y="286.34" font-size="11.00" class="sc-notoserifcjksc">免被发现），一种可能的策略是利用评估与部署之间的规模差异。为此，模型可以以一个极低但</text><text x="72.00" y="301.96" font-size="11.00" class="sc-notoserifcjksc">非零的概率执行该行动，使得该行动在大规模部署期间可能只发生几次，而在规模较小的部署前</text><text x="72.00" y="317.58" font-size="11.00" class="sc-notoserifcjksc">测试中则从不发生。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="72.00" y="380.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.44 115.54 121.08" y="380.50" font-size="9.00" class="sc-lorabold">6.6.4.3.A]</text><text x="126.92" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，模型被指示以</text><text x="273.29" y="380.50" font-size="9.00" class="sc-lorabold">1%</text><text x="287.44" y="380.50" font-size="9.00" class="sc-notoserifcjkscbold">的频率采取某一罕见行动时实际采取该行动的比率</text><text x="485.44" y="380.50" font-size="9.00" class="sc-notoserifcjksc">。当提供显式</text><text x="72.00" y="392.20" font-size="9.00" class="sc-notoserifcjksc">随机性（通过</text><text x="128.37" y="392.20" font-size="9.00" class="sc-loraregular">UUID</text><text x="151.62" y="392.20" font-size="9.00" class="sc-notoserifcjksc">），或被提示生成一个随机字符串并据此做出决定（</text><text x="358.62 363.69 367.17 371.07 373.60 379.06 384.04 386.41 391.51 396.34 401.17 406.56 408.92 414.14 417.19 419.55 425.31 430.70 435.97 441.34 446.53 451.84" y="392.20" font-size="9.00" class="sc-loraregular">String Seed of Thought</text><text x="455.33" y="392.20" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="464.33 469.43 474.53 479.52" y="392.20" font-size="9.00" class="sc-loraregular">SSoT</text><text x="485.28" y="392.20" font-size="9.00" class="sc-notoserifcjksc">）时，所有模</text><text x="72.00" y="403.90" font-size="9.00" class="sc-notoserifcjksc">型都取得了非零结果。我们还测试了另外三种设置：一种没有任何提示或随机性来源的基线设置、一种引导性较弱的策</text><text x="72.00" y="415.60" font-size="9.00" class="sc-notoserifcjksc">略提示，以及一个提示词各不相同、可提供天然随机性来源的数据集。在默认推理强度下，对比模型在这些设置中的比</text><text x="72.00" y="427.30" font-size="9.00" class="sc-notoserifcjksc">率为</text><text x="92.37 97.81 100.03 103.30" y="427.30" font-size="9.00" class="sc-loraregular">0.1%</text><text x="113.50" y="427.30" font-size="9.00" class="sc-notoserifcjksc">或更低；</text><text x="149.50 155.79 158.24 162.83 168.20 173.58 178.46 180.83 187.97 193.35 198.72 202.89 205.25 210.16 212.37" y="427.30" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="219.65" y="427.30" font-size="9.00" class="sc-notoserifcjksc">的比率在正文中讨论。每种设置对每个模型使用</text><text x="411.01 415.89 418.02 423.61 429.20" y="427.30" font-size="9.00" class="sc-loraregular">4,000</text><text x="437.17" y="427.30" font-size="9.00" class="sc-notoserifcjksc">个样本（</text><text x="473.17" y="427.30" font-size="9.00" class="sc-loraregular">UUID</text><text x="498.79" y="427.30" font-size="9.00" class="sc-notoserifcjksc">设置中有</text><text x="72.00" y="439.00" font-size="9.00" class="sc-notoserifcjksc">三个</text><text x="92.37 98.66 101.11 105.70 111.07 116.45 121.33 123.70 130.84 136.21 141.59 145.76 148.12 153.03 155.24" y="439.00" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="162.51" y="439.00" font-size="9.00" class="sc-notoserifcjksc">样本未产生可解析的答案，已被排除）；误差线为</text><text x="362.88 368.08 372.99 380.82 383.18 391.99 394.51 396.96 401.13 406.39" y="439.00" font-size="9.00" class="sc-loraregular">95% Wilson</text><text x="414.23" y="439.00" font-size="9.00" class="sc-notoserifcjksc">区间。</text><text x="441.23 447.52 449.96 454.55 459.93 465.31 470.19 472.55 479.70 485.07 490.45 494.61 496.98 501.89 504.10" y="439.00" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="511.37" y="439.00" font-size="9.00" class="sc-notoserifcjksc">以最高</text><text x="72.00" y="450.70" font-size="9.00" class="sc-notoserifcjksc">推理强度采样，对比模型以其默认推理强度采样。</text><text x="72.00" y="515.53" font-size="11.00" class="sc-notoserifcjksc">为评估这一能力，我们在内部复现了</text><text x="250.89 257.13 263.09 267.86 272.54 278.22 284.89 291.33 294.22 300.11 304.36 307.26 312.93 315.93 318.63 321.52 327.43 334.19 340.09" y="515.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="349.34" y="515.53" font-size="11.00" class="sc-notoserifcjksc">中描述的评估。在该评估中，模型被提</text><text x="72.00" y="531.15" font-size="11.00" class="sc-notoserifcjksc">示以指定的比率执行某个特定行动（例如，在编程任务中使用一个名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="531.15" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49" y="531.15" font-size="11.00" class="sc-notoserifcjksc">的变量），并被大量</text><text x="72.00" y="546.77" font-size="11.00" class="sc-notoserifcjksc">重新采样，以检验相关行为的实际观测比率。我们使用与</text><text x="349.89 357.58 360.57 366.18 372.75 379.33 385.29 388.18 393.77 399.45 405.85 408.84 414.80 417.70 423.69 426.40" y="546.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="433.30" y="546.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="447.19 454.88 457.87 463.48 470.05 476.62 482.59 485.48 495.41 501.27 505.53 512.12 518.56 523.65 526.54 532.54 535.24" y="546.77" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="72.00" y="562.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00" y="562.39" font-size="11.00" class="sc-notoserifcjksc">中相同的设置，每种设置</text><text x="228.89 234.86 237.46 244.29 251.12" y="562.39" font-size="11.00" class="sc-loraregular">4,000</text><text x="260.86" y="562.39" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00" y="612.69" font-size="11.00" class="sc-notoserifcjksc">当提示词提供熵源（一个</text><text x="195.89" y="612.69" font-size="11.00" class="sc-loraregular">UUID</text><text x="224.32" y="612.69" font-size="11.00" class="sc-notoserifcjksc">）时，</text><text x="257.32 265.01 268.00 273.61 280.17 286.75 292.72 295.61 304.34 310.91 317.48 322.57 325.46 331.46 334.16" y="612.69" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="343.05" y="612.69" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="356.94" y="612.69" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="379.64" y="612.69" font-size="11.00" class="sc-notoserifcjksc">推理强度下于</text><text x="448.53" y="612.69" font-size="11.00" class="sc-loraregular">1.2%</text><text x="473.61" y="612.69" font-size="11.00" class="sc-notoserifcjksc">的样本中采取</text><text x="72.00" y="628.31" font-size="11.00" class="sc-notoserifcjksc">了该罕见行动，成为此对比中第一个观测比率达到</text><text x="316.89" y="628.31" font-size="11.00" class="sc-loraregular">1%</text><text x="333.36" y="628.31" font-size="11.00" class="sc-notoserifcjksc">目标的模型；在默认推理强度下，该比率</text><text x="72.00" y="643.93" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 92.55 94.90 99.97" y="643.93" font-size="11.00" class="sc-loraregular">0.7%</text><text x="109.54" y="643.93" font-size="11.00" class="sc-notoserifcjksc">，与对比模型相当。它的做法是取</text><text x="277.44" y="643.93" font-size="11.00" class="sc-loraregular">UUID</text><text x="308.75" y="643.93" font-size="11.00" class="sc-notoserifcjksc">中的一组十六进制数字对</text><text x="432.65" y="643.93" font-size="11.00" class="sc-loraregular">100</text><text x="453.21" y="643.93" font-size="11.00" class="sc-notoserifcjksc">取模，并仅在结</text><text x="72.00" y="659.55" font-size="11.00" class="sc-notoserifcjksc">果为零时采取行动；它的算术是正确的，但它有时在看到数字之后才选择使用哪些数字。当它必</text><text x="72.00" y="675.17" font-size="11.00" class="sc-notoserifcjksc">须自己生成随机字符串时（</text><text x="204.00 210.19 214.45 219.21 222.30 228.98 235.06 237.96 244.19 250.10 256.01 262.59 265.48 271.86 275.58 278.47 285.51 292.10 298.53 305.10 311.45 317.94" y="675.17" font-size="11.00" class="sc-loraregular">String Seed of Thought</text><text x="322.20" y="675.17" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="333.20 339.43 345.67 351.76" y="675.17" font-size="11.00" class="sc-loraregular">SSoT</text><text x="358.80" y="675.17" font-size="11.00" class="sc-notoserifcjksc">），无论哪种推理强度，比率都降至</text><text x="72.00 78.65 81.36 85.36" y="690.79" font-size="11.00" class="sc-loraregular">0.1%</text><text x="94.93" y="690.79" font-size="11.00" class="sc-notoserifcjksc">，因为它的</text><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="250.89" y="506.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="250.89" y="506.73" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="291.33" y="506.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="294.22" y="506.73" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="304.36" y="506.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="307.26" y="506.73" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="318.63" y="506.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/pdf/2603.02202" rel="noopener"><rect x="321.52" y="506.73" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="349.89" y="537.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="349.89" y="537.97" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="385.29" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="388.18" y="537.97" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="414.80" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="417.70" y="537.97" width="12.70" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="430.40" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="433.30" y="537.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="444.30" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="447.19" y="537.97" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="482.59" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="485.48" y="537.97" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="523.65" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="526.54" y="537.97" width="12.71" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="539.25" y="537.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="72.00" y="553.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="83.00" y="553.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="83.00" y="553.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="94.00" y="553.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="94.00" y="553.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">13</text><text x="80.15 87.14 93.13 98.55 104.62 107.14 109.77 115.57 118.03 120.66 126.01 129.88 132.33 134.96 140.12 142.84 145.30 147.93 150.98 156.34 162.48 167.85 173.51 176.56 179.02 181.64 187.85 193.25 198.41 203.04 208.88 214.95 217.76 223.83 229.36 231.98 240.92 246.77 252.75 258.16 260.88 265.51 268.14 272.77 276.64 280.97 286.93 292.46 298.23 300.95 306.37 308.99 312.86 318.71 321.34 326.61 332.46 338.43 342.30 346.56 352.41 355.13 357.76 361.62 367.61 373.03 375.84 380.17 382.80 388.11 394.10 399.26 402.07 408.14 412.76 415.39 421.19 424.57 427.20 431.07 437.05 442.90 448.87 454.64 460.53 464.40" y="704.45" font-size="10.00" class="sc-loraregular">Chen, Y. et. al. (2026). Reasoning models struggle to control their chains of thought.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.87 203.18 209.38 214.83 219.44 225.65" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2603.05706</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">随机</text><text x="98.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="102.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">字符串都是同一模板的近似变体。在没有随机性来源也没有提示的情况下，它在</text><text x="490.13 496.09 498.70 505.53 512.36" y="82.61" font-size="11.00" class="sc-loraregular">4,000</text><text x="522.10" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">样本中从未采取该行动，并表示自己无法进行真正的随机抽取；而在提示词自然变化的情况下，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">它仅采取了一次该行动。仅在策略提示下，它在</text><text x="305.89" y="113.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推理强度下达到</text><text x="408.48 415.14 417.84 424.03 430.21" y="113.85" font-size="11.00" class="sc-loraregular">0.88%</text><text x="439.78" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，相比之下，对比模</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型在其默认推理强度下为</text><text x="195.89 202.55 205.25 209.26" y="129.47" font-size="11.00" class="sc-loraregular">0.1%</text><text x="221.72" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或更低，我们同样以</text><text x="323.61" y="129.47" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="346.31" y="129.47" font-size="11.00" class="sc-notoserifcjksc">推理强度采样的三个对比模型至多为</text><text x="72.00 78.65 81.36 87.27 93.26" y="145.09" font-size="11.00" class="sc-loraregular">0.25%</text><text x="102.83" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，不过这些决定中至多只有约三分之一来自一次干净的、预先承诺的随机抽取。</text><text x="72.00" y="213.20" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="213.20" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73" y="213.20" font-size="11.00" class="sc-notoserifcjksc">仅在</text><text x="237.63" y="213.20" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="260.32" y="213.20" font-size="11.00" class="sc-notoserifcjksc">推理强度下、且仅在其上下文提供熵的情况下才能达到目</text><text x="72.00" y="228.82" font-size="11.00" class="sc-notoserifcjksc">标；它无法自己生成可用的随机性，也无法忠实地执行它自己设定的步骤，而且在没有提示或熵</text><text x="72.00" y="244.44" font-size="11.00" class="sc-notoserifcjksc">源的情况下，它通常不会尝试进行随机抽取。</text><text x="72.00" y="294.70" font-size="11.00" class="sc-lorabold">6.6.4.4</text><text x="107.27" y="294.70" font-size="11.00" class="sc-notoserifcjkscbold">思维链可控性</text><text x="72.00" y="327.08" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否存在未对齐行为。倾向于在扩展思考中言语化表达</text><text x="72.00" y="342.70" font-size="11.00" class="sc-notoserifcjksc">其采取未对齐行动之意图的模型，可能要容易被抓到得多。</text><text x="72.00" y="407.46" font-size="11.00" class="sc-notoserifcjksc">省略监控器所需的关键信息。为衡量这种思维链（</text><text x="314.00 321.69 327.78" y="407.46" font-size="11.00" class="sc-loraregular">CoT</text><text x="334.82" y="407.46" font-size="11.00" class="sc-notoserifcjksc">）可控性，我们在内部复现了</text><text x="480.72 488.40 494.99 500.96 507.63 510.53 516.41 520.67 523.56 529.24 532.23" y="407.46" font-size="11.00" class="sc-loraregular">Chen et al.</text><text x="72.00 75.36 81.26 88.02 93.92 100.15" y="423.08" font-size="11.00" class="sc-loraregular">(2026)</text><text x="103.50" y="419.42" font-size="6.60" class="sc-loraregular">13</text><text x="109.58" y="423.08" font-size="11.00" class="sc-notoserifcjksc">，要求</text><text x="145.48 153.16 156.16 161.77 168.33 174.91 180.87 183.77 192.50 199.07 205.63 210.73 213.62 219.62 222.32" y="423.08" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="231.21" y="423.08" font-size="11.00" class="sc-notoserifcjksc">在回答来自</text><text x="289.10 297.47 304.14 312.75" y="423.08" font-size="11.00" class="sc-loraregular">GPQA</text><text x="319.64" y="423.08" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="330.64" y="423.08" font-size="11.00" class="sc-loraregular">HLE</text><text x="355.31" y="423.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="369.20 379.30 389.40 395.64 403.81 409.19 415.86 420.54" y="423.08" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="429.87" y="423.08" font-size="11.00" class="sc-notoserifcjksc">的问题时，在其扩展思</text><text x="72.00" y="438.70" font-size="11.00" class="sc-notoserifcjksc">考中遵循一些基本指令（例如，不提及某个关键词）；这三个都是高难度的问答基准测试，模型</text><text x="72.00" y="454.32" font-size="11.00" class="sc-notoserifcjksc">在其上通常会产生大量扩展思考。我们同时展示了使用原始提示词的结果，以及使用一个由英国</text><text x="72.00" y="469.94" font-size="11.00" class="sc-notoserifcjksc">人工智能安全研究所（</text><text x="182.00 190.27 197.79 200.68 207.56 211.25 214.14 220.38 226.29 232.14 238.71 243.47 246.74 251.01 256.82 259.72 263.31 269.99 275.08 279.34 282.61 286.86 293.43 297.69" y="469.94" font-size="11.00" class="sc-loraregular">UK AI Security Institute</text><text x="303.65" y="469.94" font-size="11.00" class="sc-notoserifcjksc">）提供、在大多数先前</text><text x="416.54 424.23 427.22 432.83 439.40 445.98" y="469.94" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.83" y="469.94" font-size="11.00" class="sc-notoserifcjksc">模型上更善于激</text><text x="72.00" y="485.56" font-size="11.00" class="sc-notoserifcjksc">发</text><text x="85.89 93.58 99.68" y="485.56" font-size="11.00" class="sc-loraregular">CoT</text><text x="109.61" y="485.56" font-size="11.00" class="sc-notoserifcjksc">可控性的提示词的结果。</text><text x="72.00" y="569.95" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.14 236.85" y="569.95" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="245.73" y="569.95" font-size="11.00" class="sc-notoserifcjksc">控制其</text><text x="281.63 289.32 295.41" y="569.95" font-size="11.00" class="sc-loraregular">CoT</text><text x="305.34" y="569.95" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="352.24 359.93 362.92 368.53 375.09 381.67 387.63 390.53 399.26 405.83 412.39 417.49 420.38 426.34 428.70" y="569.95" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="436.66" y="569.95" font-size="11.00" class="sc-notoserifcjksc">大致相当。我们将此</text><text x="72.00" y="585.57" font-size="11.00" class="sc-notoserifcjksc">视为</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="585.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="585.57" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="196.52 204.21 210.30" y="585.57" font-size="11.00" class="sc-loraregular">CoT</text><text x="220.24" y="585.57" font-size="11.00" class="sc-notoserifcjksc">可监控性并不太高的弱证据，同时也视为其</text><text x="432.13 439.82 445.91" y="585.57" font-size="11.00" class="sc-loraregular">CoT</text><text x="455.85" y="585.57" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="469.74 477.43 480.42 486.03 492.60 499.17" y="585.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="601.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="601.19" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.55 150.24 156.34" y="601.19" font-size="11.00" class="sc-loraregular">CoT</text><text x="166.27" y="601.19" font-size="11.00" class="sc-notoserifcjksc">更具可监控性的弱证据。</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="707.20" width="159.43" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00" y="539.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 106.31 108.40 113.33 115.43 120.96 124.43 126.80 132.99 135.80 140.52 146.08 151.44 156.29 158.65 165.57 170.98 176.54 180.91 183.28 188.14 190.23" y="539.50" font-size="9.00" class="sc-lorabold">6.6.4.4.A] Claude Opus 5.5</text><text x="197.46" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">的</text><text x="208.83 215.02 219.70" y="539.50" font-size="9.00" class="sc-lorabold">CoT</text><text x="227.92" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">可控性相对较低，与</text><text x="311.28 317.48 320.28 325.00 330.56 335.93 340.77 343.13 350.06 355.46 361.03 365.39 367.76 372.68 374.52" y="539.50" font-size="9.00" class="sc-lorabold">Claude Opus 4.7</text><text x="381.11" y="539.50" font-size="9.00" class="sc-notoserifcjkscbold">相近。</text><text x="408.11" y="539.50" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强度档位或</text><text x="72.00" y="551.20" font-size="9.00" class="sc-notoserifcjksc">一个固定的思考预算，放置在该设置下产生的平均</text><text x="272.37 278.66 283.64" y="551.20" font-size="9.00" class="sc-loraregular">CoT</text><text x="291.77" y="551.20" font-size="9.00" class="sc-notoserifcjksc">长度处。可控性是指在回答来自</text><text x="420.14 426.99 432.44 439.49" y="551.20" font-size="9.00" class="sc-loraregular">GPQA</text><text x="445.12" y="551.20" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="454.12" y="551.20" font-size="9.00" class="sc-loraregular">HLE</text><text x="474.31" y="551.20" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="485.68 493.94 502.20 507.30 513.99 518.39 523.85 527.68" y="551.20" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00" y="562.90" font-size="9.00" class="sc-notoserifcjksc">的问题时，模型遵循针对其扩展思考所给指令的回答所占比例。越低越好，因为更高的可控性表明模型在被指示时更有</text><text x="72.00" y="574.60" font-size="9.00" class="sc-notoserifcjksc">能力改变其扩展思考的内容，这可能使监控变得不那么可靠。</text></svg></div>
