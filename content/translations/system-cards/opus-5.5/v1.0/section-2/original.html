03.73 314.73 325.73 336.73 347.73 358.73 369.73 380.73 391.73 402.73 413.73 424.73 435.73 446.73 457.73 468.73 479.73 490.73 501.73 512.73 523.73" y="163.57" font-size="11.00" class="sc-notoserifcjksc">有时依赖摘要而非论文全文，却十分自信地呈现</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">这些信息。参与者表示，这误导了他们，其中也包括具备充分专业能力、能够质疑模型对</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">文献表述的领域专家。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">在团队缺乏专业知识的领域出现科学错误。</text><text x="317.00 324.69 327.68 333.29 339.86 346.44 352.40 355.29 364.03 370.59 377.16 382.25 385.14 391.14 393.85" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="402.73 413.73 424.73 435.73 446.73 457.73 468.73 479.73 490.73 501.73 512.73 523.73" y="228.34" font-size="11.00" class="sc-notoserifcjksc">设计了无法编码预期蛋白质</text><text x="108.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="121.89 129.98 138.36" y="243.96" font-size="11.00" class="sc-loraregular">DNA</text><text x="145.25 156.25 167.25" y="243.96" font-size="11.00" class="sc-notoserifcjksc">，并在</text><text x="181.14" y="243.96" font-size="11.00" class="sc-loraregular">7</text><text x="189.10 200.10 211.10 222.10 233.10" y="243.96" font-size="11.00" class="sc-notoserifcjksc">个团队中的</text><text x="247.00" y="243.96" font-size="11.00" class="sc-loraregular">3</text><text x="256.02 267.02 278.02 289.02 300.02 311.02 322.02 333.02 344.02 355.02 366.02 377.02 388.02 399.02 410.02 421.02 432.02 443.02 454.02 465.02 476.02 487.02 498.02 509.02 520.02 531.02" y="243.96" font-size="11.00" class="sc-notoserifcjksc">个团队里提出了错误的动物模型。这类细微错误往往出现在</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">团队缺乏专业知识的领域。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">总体而言，这些失败模式限制了模型替代稀缺人类专业知识的效用；开展支撑新型生物武器开发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">的复杂、开放式且难以验证的研究，需要这些专业知识。因此，我们得出结论：</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.02 510.59 517.16 522.25 525.14 531.14 533.85" y="324.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00 83.00 94.00 105.00 116.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">未越过我们</text><text x="129.89 136.80 143.04" y="340.54" font-size="11.00" class="sc-loraregular">RSP</text><text x="152.60 163.60" y="340.54" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="177.49 185.18 192.02 197.05" y="340.54" font-size="11.00" class="sc-loraregular">CB-2</text><text x="205.85 216.85 227.85 238.85 249.85 260.85 271.85" y="340.54" font-size="11.00" class="sc-notoserifcjksc">阈值，也未达到</text><text x="285.74 291.69 299.38" y="340.54" font-size="11.00" class="sc-loraregular">FCF</text><text x="308.30 319.30 330.30 341.30 352.30 363.30 374.30 385.30 396.30 407.30 418.30 429.30 440.30 451.30 462.30 473.30 484.30 495.30" y="340.54" font-size="11.00" class="sc-notoserifcjksc">中的对应层级。我们强调，尽管我们未将</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="356.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="356.16" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 222.36 228.22 232.48 239.07 245.50 250.60 253.49 259.48 262.19" y="356.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="269.09 280.09 291.09" y="356.16" font-size="11.00" class="sc-notoserifcjksc">认定为</text><text x="304.98 312.67 319.51 324.54" y="356.16" font-size="11.00" class="sc-loraregular">CB-2</text><text x="330.45 341.45 352.45 363.45 374.45" y="356.16" font-size="11.00" class="sc-notoserifcjksc">，但相较于</text><text x="388.34 396.03 399.02 404.63 411.20 417.77 423.74 426.63 435.36 441.93 448.50 453.59 456.48" y="356.16" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="465.37 476.37 487.37 498.37 509.37 520.37" y="356.16" font-size="11.00" class="sc-notoserifcjksc">等较弱模型，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="371.78" font-size="11.00" class="sc-notoserifcjksc">我们已出于保守考虑，扩大了对这两个模型实施的安全防护措施范围；鉴于</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04 512.03 514.74" y="371.78" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="523.63" y="371.78" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="387.40" font-size="11.00" class="sc-notoserifcjksc">这一领域的能力相对较强，我们也对它采取相同的、更广泛的安全防护措施。我们在最新</text><text x="501.00 512.00 523.00" y="387.40" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报</text><text x="72.00" y="403.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">告</text><text x="83.00 94.00" y="403.02" font-size="11.00" class="sc-notoserifcjksc">的第</text><text x="107.89 113.86 116.56 122.56 125.26 131.17 133.88" y="403.02" font-size="11.00" class="sc-loraregular">4.5.2.1</text><text x="140.77 151.77 162.77 173.77 184.77 195.77 206.77 217.77 228.77 239.77 250.77 261.77 272.77" y="403.02" font-size="11.00" class="sc-notoserifcjksc">节进一步介绍了这些扩展后的</text><text x="286.67 294.35" y="403.02" font-size="11.00" class="sc-loraregular">CB</text><text x="304.09 315.09 326.09 337.09 348.09 359.09 370.09" y="403.02" font-size="11.00" class="sc-notoserifcjksc">安全防护措施。</text><text x="72.00 80.04 83.68 92.06 95.39 105.42" y="488.81" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64 126.64" y="488.81" font-size="14.00" class="sc-notosanscjkscbold">研发</text><text x="72.00 79.46 82.84 90.63 94.01" y="525.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81 114.81 127.81 140.81 153.81" y="525.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="553.79" font-size="11.00" class="sc-notoserifcjksc">这些评估源于我们</text><text x="162.89 169.80 176.04" y="553.79" font-size="11.00" class="sc-loraregular">RSP</text><text x="185.60" y="553.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="199.49 205.44 213.13" y="553.79" font-size="11.00" class="sc-loraregular">FCF</text><text x="222.05 233.05 244.05 255.05 266.05 277.05 288.05 299.05 310.05 321.05 332.05" y="553.79" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="586.18" font-size="11.00" class="sc-lorabold">1</text><text x="192.36 203.36 214.36 225.36 236.36 247.36 258.36 269.36 280.36 291.36 302.36" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">：高风险场景中的未对齐</text><text x="316.25 323.60" y="586.18" font-size="11.00" class="sc-lorabold">AI</text><text x="330.75 341.75 352.75" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75" y="586.18" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="509.64 516.53" y="586.18" font-size="11.00" class="sc-loraregular">AI</text><text x="523.11" y="586.18" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="601.80" font-size="11.00" class="sc-notoserifcjksc">统：它们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作能</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="617.42" font-size="11.00" class="sc-notoserifcjksc">力和使用隐蔽手段的能力，以至于这些系统有可能（如果被引向这一目标，无论是有意还</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="633.04" font-size="11.00" class="sc-notoserifcjksc">是无意）实施蓄意破坏，从而不可逆转地、大幅提高日后发生全球性灾难的几率。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="683.33" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="683.33" font-size="11.00" class="sc-lorabold">2</text><text x="193.76 204.76 215.76 226.76 237.76 248.76 259.76 270.76 281.76 292.76 303.76 314.76 325.76 336.76 347.76 358.76 369.76" y="683.33" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域中自动化研发带来的风险。</text><text x="380.76 391.76 402.76 413.76 424.76 435.76 446.76 457.76 468.76 479.76 490.76 501.76 512.76 523.76" y="683.33" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是能够完全自</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="698.95" font-size="11.00" class="sc-notoserifcjksc">动化或以其他方式大幅加速大型顶尖人类研究团队工作的</text><text x="385.89 392.78" y="698.95" font-size="11.00" class="sc-loraregular">AI</text><text x="399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36" y="698.95" font-size="11.00" class="sc-notoserifcjksc">系统，所涉及的领域是</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="501.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="501.00" y="378.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="512.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="512.00" y="378.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="523.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="523.00" y="378.60" width="11.00" height="11.00" fill="transparent" 07.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">了新的斜率变化（见第</text><text x="220.89 226.80 229.51 235.63 238.34" y="275.20" font-size="11.00" class="sc-loraregular">2.3.5</text><text x="247.23 258.23 269.23 280.23 291.23 302.23 313.23 324.23 335.23" y="275.20" font-size="11.00" class="sc-notoserifcjksc">节）。第二，我们对</text><text x="349.12 356.01" y="275.20" font-size="11.00" class="sc-loraregular">AI</text><text x="362.58 373.58 384.58 395.58 406.58 417.58 428.58 439.58 450.58 461.58 472.58 483.58 494.58 505.58 516.58 527.58" y="275.20" font-size="11.00" class="sc-notoserifcjksc">驱动的研究加速的内部衡量指标（在</text><text x="108.00 119.00 130.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="143.89 149.80 156.55 162.46" y="290.82" font-size="11.00" class="sc-loraregular">2026</text><text x="171.71" y="290.82" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="185.61" y="290.82" font-size="11.00" class="sc-loraregular">8</text><text x="194.68 205.68 216.68 227.68 238.68 249.68 260.68 271.68 282.68 293.68 304.68 315.68 326.68 337.68 348.68 359.68 370.68 381.68 392.68 403.68 414.68 425.68 436.68 447.68 458.68 469.68 480.68 491.68 502.68 513.68 524.68" y="290.82" font-size="11.00" class="sc-notoserifcjksc">月风险报告中有所讨论）仅部分公开，这些指标并未显示我们的进展速</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">度出现持续的、可归因于</text><text x="231.89 238.78" y="306.44" font-size="11.00" class="sc-loraregular">AI</text><text x="245.36" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="259.25 265.16" y="306.44" font-size="11.00" class="sc-loraregular">2×</text><text x="273.88 284.88 295.88 306.88 317.88 328.88 339.88 350.88 361.88 372.88 383.88 394.88 405.88 416.88 427.88 438.88 449.88 460.88 471.88 482.88 493.88 504.88 515.88 526.88" y="306.44" font-size="11.00" class="sc-notoserifcjksc">加速，不过其中一些指标已有所变动，我们正在密切监</text><text x="108.00 119.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">测。</text><text x="72.00 83.00 94.00 105.00 116.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">近期模型在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.60" y="374.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="215.85 226.85 237.85" y="374.07" font-size="11.00" class="sc-notoserifcjksc">系统卡</text><text x="248.85" y="374.07" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">第</text><text x="262.74 268.92 271.63" y="374.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">8.3</text><text x="280.65" y="374.07" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="291.65 302.65 313.65 324.65 335.65 346.65 357.65 368.65 379.65 390.65 401.65 412.65 423.65" y="374.07" font-size="11.00" class="sc-notoserifcjksc">所述的许多基于任务的自动化</text><text x="437.54 444.43" y="374.07" font-size="11.00" class="sc-loraregular">AI</text><text x="451.01 462.01 473.01 484.01 495.01 506.01 517.01 528.01" y="374.07" font-size="11.00" class="sc-notoserifcjksc">研发评估中，已超</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">过最高的人类基线，此类任务的结果也已不再是我们</text><text x="327.89 334.80 341.04" y="389.69" font-size="11.00" class="sc-loraregular">RSP</text><text x="350.60" y="389.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="364.49 370.44 378.13" y="389.69" font-size="11.00" class="sc-loraregular">FCF</text><text x="387.05 398.05 409.05 420.05 431.05 442.05 453.05 464.05 475.05 486.05 497.05 508.05" y="389.69" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定的重要组成部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">分。因此，我们没有对</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.03 261.74" y="405.31" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63" y="405.31" font-size="11.00" class="sc-notoserifcjksc">运行这些自动化评估。</text><text x="72.00 79.46 82.84 90.63 94.01 101.80 104.89 114.87 118.49 127.30 135.90 144.71 152.73 155.82 166.03 174.84 183.44 190.52 193.62 201.99 205.37" y="469.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3 Claude Opus 5.5</text><text x="216.83 229.83 242.83 255.83 268.83" y="469.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">相对于人类</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00 176.00" y="491.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究人员的定性不足</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="519.88" font-size="11.00" class="sc-notoserifcjksc">与以往的一些系统卡一样，我们收集并审视了来自真实内部使用的案例，在这些案例中，</text><text x="501.00 508.69 511.68 517.29 523.86 530.44" y="519.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="535.50" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44" y="535.50" font-size="11.00" class="sc-notoserifcjksc">未能达到我们对熟练人类研究人员所期望的表现，或未能充分替代或自动化人类的指</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="551.12" font-size="11.00" class="sc-notoserifcjksc">导。（其中许多问题与行为问题或与对齐相近的问题有关，但它们仍以某种方式限制了我们在内</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="566.74" font-size="11.00" class="sc-notoserifcjksc">部使用该模型实现工作自动化的能力，因此与能力评估相关。）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="633.22" font-size="11.00" class="sc-notoserifcjksc">我们在本节中不引用缺陷的具体示例；部分示例可见于本系统卡的其他章节。总体而言，我们发</text><text x="72.00 83.00 94.00" y="648.84" font-size="11.00" class="sc-notoserifcjksc">现，与</text><text x="107.89 114.78 121.36 125.61 132.20 136.89 143.32 149.89 152.98" y="648.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.73 172.73 183.73 194.73 205.73 216.73 227.73" y="648.84" font-size="11.00" class="sc-notoserifcjksc">研究人员相比，</text><text x="238.73 246.42 249.41 255.02 261.58 268.16 274.12 277.02 285.75 292.32 298.89 303.98 306.87 312.87 315.57" y="648.84" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="324.46 335.46 346.46 357.46 368.46 379.46 390.46 401.46 412.46 423.46 434.46 445.46 456.46 467.46 478.46 489.46 500.46 511.46 522.46" y="648.84" font-size="11.00" class="sc-notoserifcjksc">仍有许多弱点，这些弱点会使它无法完全取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="664.46" font-size="11.00" class="sc-notoserifcjksc">代人类研究人员。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="259.85" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="262.74" y="365.27" width="15.02" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="277.76" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="280.65" y="365.27" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00 77.86 80.42 86.58 89.14 95.15 97.71 102.17 105.06 112.63 118.57 125.84 131.75 138.77 144.46 151.29 154.18 160.04 162.60" y="503.91" font-size="11.00" class="sc-lorabold">2.3.4.1 CoBench 2.1</text><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们观察到的主要问题集中在认知质量和指令遵循方面。在一项针对我们内部智能体部署中被标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">记行为的早期且噪声较大的分析中，与以往模型相比，</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 383.03 389.59 396.16 401.25 404.14 410.14 412.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">夸大工作范围以及从结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果中删去已知限定条件的情况有所增加。随后一项对真实消息的独立盲读发现，</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.03 510.59 517.16 522.25 525.14 531.14 533.85" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">删去限定条件的频率并不高于以往模型。与以往模型类似，被标记行为中最主要的子类别是将未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">经验证的推断断言为既定事实。第二常见的子类别是忽视自身的疑虑或放弃自己陈述过的计划，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">其频率相对于以往模型也有所上升。内部使用中的例子包括：将部分检查描述为完整阅读，以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">在未加核实的情况下将一个初步的解读变成一项建议。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们还看到了策略性错误。在内部使用中，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.14 357.85" y="260.72" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="260.72" font-size="11.00" class="sc-notoserifcjksc">曾狭隘地处理评审反馈，而没有重</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">新考虑整体设计是否正确；还曾对照它自己编写的需求来检查一项计划，而不是对照该计划旨在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">服务的人。与以往模型一样，它在开放式研究方面较弱：内部用户报告称，它大多测试渐进式的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">想法，并偏好不那么大胆的假设；在我们由人类主导的生物学演练中，它遵从已发表的文献，难</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">以提出新颖的想法（第</text><text x="184.89 190.80 193.51 199.41 202.12" y="323.20" font-size="11.00" class="sc-loraregular">2.2.2</text><text x="210.92 221.92 232.92" y="323.20" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">一些在以往模型中更为突出的问题有所减少。</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 289.86 295.82 298.72 307.45 314.02 320.59 325.68 328.57 334.57 337.27 343.27" y="147.38" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="350.11 361.11 372.11 383.11 394.11 405.11 416.11 427.11 438.11 449.11 460.11 471.11 482.11 493.11 504.11 515.11 526.11" y="147.38" font-size="11.00" class="sc-notoserifcjksc">能力的其他信息，包括对一份询问模型</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75" y="163.00" font-size="11.00" class="sc-notoserifcjksc">能力和控制因素的问卷的回答，以及对一位</text><text x="356.64 363.53 370.11 374.36 380.95 385.64 392.07 398.64 401.73" y="163.00" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="410.48 421.48 432.48 443.48 454.48 465.48 476.48 487.48" y="163.00" font-size="11.00" class="sc-notoserifcjksc">研究人员的访谈。</text><text x="144.75 155.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="169.64 179.74 186.58 193.62" y="212.15" font-size="11.00" class="sc-loraregular">METR</text><text x="203.42 214.42 225.42 236.42 247.42" y="212.15" font-size="11.00" class="sc-notoserifcjksc">另一项关于</text><text x="261.32 268.20 274.78 279.04 285.63 290.31 296.75 303.32 306.41" y="212.15" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="315.15 326.15" y="212.15" font-size="11.00" class="sc-notoserifcjksc">内部</text><text x="340.04 346.93" y="212.15" font-size="11.00" class="sc-loraregular">AI</text><text x="353.51 364.51 375.51 386.51 397.51 408.51 419.51 430.51 441.51 452.51 463.51 474.51 485.51 496.51 507.51 518.51 529.51" y="212.15" font-size="11.00" class="sc-notoserifcjksc">研发加速情况的评估的一份高度实验性</text><text x="144.75 155.75 166.75 177.75 188.75 199.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的初步报告。</text><text x="210.75 221.75 232.75 243.75 254.75" y="227.77" font-size="11.00" class="sc-notoserifcjkscbold">这份报告由</text><text x="268.64 278.74 285.58 292.62" y="227.77" font-size="11.00" class="sc-loraregular">METR</text><text x="302.42 313.42 324.42 335.42 346.42 357.42 368.42 379.42 390.42 401.42 412.42 423.42 434.42 445.42 456.42 467.42 478.42 489.42 500.42 511.42 522.42" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的另一个团队撰写，该团队拥有比撰写本内容的</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">团队更高的访问权限。</text><text x="254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75" y="243.39" font-size="11.00" class="sc-notoserifcjkscbold">由于访问权限上的这一差异，</text><text x="397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">该团队与我们分享了其结论，</text><text x="144.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">但</text><text x="155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75" y="259.01" font-size="11.00" class="sc-notoserifcjkscbold">未能分享其推理的支持性证据或细节</text><text x="331.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75" y="325.49" font-size="11.00" class="sc-notoserifcjksc">因此，我们将所提供的</text><text x="293.64 300.53" y="325.49" font-size="11.00" class="sc-loraregular">AI</text><text x="307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="325.49" font-size="11.00" class="sc-notoserifcjksc">研发报告中的证据作为评估的一项输入，但不直</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75" y="341.11" font-size="11.00" class="sc-notoserifcjksc">接为其论断进行论证辩护。</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">我们将此处纳入该报告视为一种更全面评估流程的试行版本。我们预计这</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">项独立调查将在未来几周内有更多公开成果发布。</text><text x="117.75 128.75" y="436.72" font-size="11.00" class="sc-notoserifcjksc">结论</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75" y="464.88" font-size="11.00" class="sc-notoserifcjksc">我们将结论分为两类：一类涉及（</text><text x="282.75" y="464.88" font-size="11.00" class="sc-loraregular">A</text><text x="289.64" y="464.88" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="300.64 304.19 311.88 314.87 320.48 327.05 333.62 339.59 342.48 351.21 357.78 364.35 369.44 372.33 378.33 381.04 387.03" y="464.88" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="393.87 404.87 415.87 426.87 437.87" y="464.88" font-size="11.00" class="sc-notoserifcjksc">能够带来的</text><text x="451.77 458.65" y="464.88" font-size="11.00" class="sc-loraregular">AI</text><text x="465.23 476.23 487.23 498.23 509.23" y="464.88" font-size="11.00" class="sc-notoserifcjksc">研发加速程</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75" y="480.50" font-size="11.00" class="sc-notoserifcjksc">度，另一类涉及（</text><text x="205.75" y="480.50" font-size="11.00" class="sc-loraregular">B</text><text x="212.59 223.59" y="480.50" font-size="11.00" class="sc-notoserifcjksc">）在</text><text x="237.49 241.43 249.12 252.12 257.73 264.29 270.87 276.83 279.73 288.46 295.03 301.59 306.69 309.58 315.57 318.28 324.28" y="480.50" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="331.12 342.12 353.12 364.12 375.12 386.12" y="480.50" font-size="11.00" class="sc-notoserifcjksc">开发过程中由</text><text x="400.01 406.90" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="413.47 424.47 435.47" y="480.50" font-size="11.00" class="sc-notoserifcjksc">带来的</text><text x="449.37 456.25" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="462.83 473.83 484.83 495.83 506.83 517.83 528.83" y="480.50" font-size="11.00" class="sc-notoserifcjksc">研发加速程度。</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75" y="496.12" font-size="11.00" class="sc-notoserifcjksc">基于现有证据，我们得出以下结论：</text><text x="117.75" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="562.03" font-size="11.00" class="sc-lorabold">A</text><text x="136.10 147.10 158.10 169.10 180.10 191.10 202.10 213.10 224.10 235.10 246.10 257.10 268.10 279.10 290.10 301.10 312.10 323.10" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型带来的加速将略高于</text><text x="336.99 342.82 348.59 354.84 358.28 364.19 367.09 373.03 375.59" y="562.03" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="380.06 391.06 402.06 413.06 424.06 435.06 446.06 457.06 468.06 479.06 490.06 501.06 512.06 523.06" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">，但该模型不太可能完全自动化</text><text x="117.75 125.10" y="577.65" font-size="11.00" class="sc-lorabold">AI</text><text x="132.25 143.25 154.25" y="577.65" font-size="11.00" class="sc-notoserifcjkscbold">研发。</text><text x="117.75 128.75 139.75 150.75 161.75" y="626.80" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75" y="642.99" font-size="11.00" class="sc-notoserifcjksc">我们有相当把握认为，</text><text x="254.75 258.70 266.39 269.38 274.99 281.56 288.14 294.10 296.99 305.72 312.29 318.86 323.95 326.84 332.84 335.55 341.54" y="642.99" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="348.38" y="642.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="362.28 369.16" y="642.99" font-size="11.00" class="sc-loraregular">AI</text><text x="375.74 386.74 397.74 408.74 419.74 430.74 441.74 452.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">研发能力上并未比</text><text x="466.63 472.22 477.90 484.30 487.29 493.25 496.15 502.14 504.85" y="642.99" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="511.74 522.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">实现</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">巨大飞跃，但它很可能代表着相对于</text><text x="323.64 329.23 334.91 341.31 344.30 350.26 353.16 359.15 361.86" y="658.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="368.75 379.75 390.75 401.75 412.75 423.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">的适度改进。</text><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 231.33 237.90 244.46 249.56 252.45 258.44 261.15 267.14" y="82.61" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="273.99 284.99 295.99 306.99 317.99 328.99 339.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在可验证任务（</text><text x="350.99 357.75 364.32 370.90 376.92 382.81 387.07 389.96 398.29 403.96 410.64 417.07 425.45 432.11" y="82.61" font-size="11.00" class="sc-loraregular">Budget NanoGPT</text><text x="439.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.15 458.52 464.20 474.03 477.12 483.80 489.88 492.78 499.62 506.05" y="82.61" font-size="11.00" class="sc-loraregular">Gaming Bot</text><text x="510.31 521.31" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">较难验证的任务（</text><text x="268.75 275.11 285.15 292.73" y="98.23" font-size="11.00" class="sc-loraregular">LMCA</text><text x="299.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="310.62 316.79 323.35 330.03 333.02 336.11 342.46 348.95" y="98.23" font-size="11.00" class="sc-loraregular">Sunlight</text><text x="353.21 364.21 375.21 386.21 397.21" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）上均优于</text><text x="411.10 416.69 422.36 428.77 431.76 437.72 440.61 446.61 449.32" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="453.32 464.32 475.32" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，但：</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中，</text><text x="348.75 355.64 362.21 366.47 373.06 377.75 384.18 390.75 393.84" y="131.19" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="402.58" y="131.19" font-size="11.00" class="sc-notoserifcjksc">称</text><text x="416.48 420.43 428.12 431.11 436.72 443.28 449.86 455.82 458.72 467.45 474.02 480.59 485.68 488.57 494.57 497.27 503.27" y="131.19" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="510.11 521.11" y="131.19" font-size="11.00" class="sc-notoserifcjksc">延续</text><text x="216.75" y="146.81" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="230.64 237.53 244.11 248.36 254.95 259.64 266.07 272.64 275.73 281.58 284.48 291.32 299.01" y="146.81" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="305.59" y="146.81" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="319.48 329.41 335.28 339.53 346.12 352.56" y="146.81" font-size="11.00" class="sc-loraregular">Mythos</text><text x="360.54 371.54 382.54 393.54 404.54 415.54" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级别的趋势。</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在我们的定量评估中，</text><text x="326.75 330.70 338.39 341.38 346.99 353.56 360.14 366.10 368.99 377.72 384.29 390.86 395.95 398.84 404.84 407.55 413.54" y="179.76" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="420.38 431.38 442.38" y="179.76" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="456.28 461.86 467.54 473.94 476.93 482.90 485.79 491.78 494.49" y="179.76" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="501.39 512.39 523.39" y="179.76" font-size="11.00" class="sc-notoserifcjksc">是渐进</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75" y="195.38" font-size="11.00" class="sc-notoserifcjksc">式改进，而非不连续的跃升。</text><text x="216.75 220.30 227.99 230.98 236.59 243.16 249.74 255.70 258.59 267.33 273.90 280.46 285.55 288.45 294.44 297.15 303.14" y="228.34" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="309.99 320.99 331.99 342.99 353.99 364.99 375.99 386.99 397.99 408.99 419.99 430.99 441.99 452.99 463.99 474.99 485.99 496.99 507.99 518.99 529.99" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在解决困难的长程任务或进行开放式推理时，仍</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75" y="243.96" font-size="11.00" class="sc-notoserifcjksc">存在人类专家不太可能表现出的定性弱点。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这一点高度不确定，但我们预计，完全自动化</text><text x="367.64 374.53" y="293.11" font-size="11.00" class="sc-loraregular">AI</text><text x="381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">研发将需要在远见、预测、构建</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75" y="308.73" font-size="11.00" class="sc-notoserifcjksc">自身反馈回路，以及通常可称为研究人员</text><text x="342.75" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="347.15 358.15 369.15" y="308.73" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="380.15" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="383.99" y="308.73" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="394.99" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="399.39 410.39" y="308.73" font-size="11.00" class="sc-notoserifcjksc">品味</text><text x="421.39" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="425.23 436.23 447.23 458.23 469.23 480.23 491.23 502.23 513.23 524.23" y="308.73" font-size="11.00" class="sc-notoserifcjksc">的其他技能方面取得大</text><text x="144.75 155.75 166.75 177.75" y="324.35" font-size="11.00" class="sc-notoserifcjksc">幅提升。</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们掌握的证据并未表明</text><text x="304.64 308.59 316.28 319.27 324.88 331.45 338.03 343.99 346.88 355.62 362.18 368.75 373.84 376.74 382.73 385.44 391.43" y="357.88" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="398.28 409.28 420.28" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在这些</text><text x="431.28" y="357.88" font-size="11.00" class="sc-loraregular">“</text><text x="435.67 446.67 457.67" y="357.88" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="468.67" y="357.88" font-size="11.00" class="sc-loraregular">”</text><text x="472.51 483.51 494.51 505.51 516.51 527.51" y="357.88" font-size="11.00" class="sc-notoserifcjksc">技能上相对于</text><text x="180.75 186.34 192.01 198.42 201.41 207.37 210.26 216.26 218.96" y="373.50" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="225.86 236.86 247.86 258.86 269.86 280.86" y="373.50" font-size="11.00" class="sc-notoserifcjksc">有大幅提升。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75" y="406.45" font-size="11.00" class="sc-notoserifcjksc">与此同时，我们认为</text><text x="246.64 250.59 258.28 261.27 266.88 273.45 280.03 285.99 288.88 297.62 304.18 310.75 315.84 318.74 324.73 327.44 333.43" y="406.45" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="340.28 351.28 362.28 373.28 384.28 395.28 406.28 417.28 428.28 439.28 450.28 461.28 472.28 483.28 494.28 505.28 516.28 527.28" y="406.45" font-size="11.00" class="sc-notoserifcjksc">仍很可能明显加速研究人员的工作，并自</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75" y="422.07" font-size="11.00" class="sc-notoserifcjksc">动化研发的有限方面。例如，我们预计</text><text x="334.64 338.59 346.28 349.27 354.88 361.45 368.03 373.99 376.88 385.62 392.18 398.75 403.84 406.74 412.73 415.44 421.43" y="422.07" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="428.28 439.28 450.28 461.28 472.28 483.28 494.28 505.28" y="422.07" font-size="11.00" class="sc-notoserifcjksc">很可能提供略高于</text><text x="144.75 150.34 156.01 162.42 165.41 171.37 174.26 180.26 182.96" y="437.69" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="189.86 200.86 211.86 222.86 233.86 244.86 255.86" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的生产力提升。</text><text x="144.75 155.75 166.75" y="471.22" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="177.75 184.64" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="191.21 202.21 213.21 224.21 235.21 246.21 257.21 268.21 279.21 290.21 301.21 312.21 323.21 334.21 345.21" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力上频繁的渐进式改进仍与</text><text x="359.11 365.99" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="372.57 383.57 394.57 405.57 416.57 427.57 438.57 449.57 460.57 471.57 482.57 493.57 504.57 515.57 526.57" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力的总体快速进展相一致，</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75 485.75 496.75 507.75 518.75 529.75" y="486.84" font-size="11.00" class="sc-notoserifcjksc">但我们掌握的数据不足以区分改进速度是恒定、加速还是减速。目前尚不清楚，在</text><text x="144.75 151.64" y="502.46" font-size="11.00" class="sc-loraregular">AI</text><text x="158.21 169.21 180.21 191.21 202.21 213.21 224.21 235.21 246.21 257.21 268.21 279.21 290.21 301.21 312.21 323.21 334.21 345.21 356.21 367.21 378.21 389.21 400.21 411.21 422.21 433.21 444.21 455.21 466.21 477.21 488.21 499.21" y="502.46" font-size="11.00" class="sc-notoserifcjksc">研发流程发生质变之前，还需要多少次这种幅度的持续渐进式定量改进。</text><text x="117.75 129.75 141.75 153.75 165.75 177.75 189.75 201.75 213.75 225.75 237.75 249.75 261.75 273.75 285.75 297.75 309.75 321.75 333.75 345.75 357.75 369.75 381.75 393.75 405.75 417.75 429.75 441.75 453.75 465.75 477.75 489.75" y="601.76" font-size="12.00" class="sc-notoserifcjksc">我们还利用了一个目前无法披露的额外信息来源。我们利用该来源来了解</text><text x="117.75 125.26 132.44 137.08 144.27 149.38 156.40 163.57 166.94" y="618.80" font-size="12.00" class="sc-loraregular">Anthropic</text><text x="176.48" y="618.80" font-size="12.00" class="sc-notoserifcjksc">的</text><text x="191.63 199.15" y="618.80" font-size="12.00" class="sc-loraregular">AI</text><text x="206.32 218.32 230.32 242.32 254.32 266.32" y="618.80" font-size="12.00" class="sc-notoserifcjksc">研发，但它与</text><text x="281.48 292.49 299.96 307.64" y="618.80" font-size="12.00" class="sc-loraregular">METR</text><text x="318.33 330.33 342.33 354.33 366.33 378.33 390.33 402.33 414.33 426.33 438.33 450.33 462.33" y="618.80" font-size="12.00" class="sc-notoserifcjksc">对这一特定模型的理解无关。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">44</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="82.61" font-size="11.00" class="sc-lorabold">B</text><text x="136.02 147.02 158.02 169.02 180.02 191.02 202.02 213.02 224.02 235.02 246.02 257.02 268.02 279.02 290.02 301.02 312.02 323.02 334.02 345.02 356.02" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型的开发至少在一定程度上因</text><text x="369.91 377.26" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="384.41 395.41 406.41 417.41 428.41 439.41 450.41 461.41 472.41 483.41" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而加速，但不太可能因</text><text x="497.31 504.65" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="511.80 522.80" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而被</text><text x="117.75 128.75 139.75 150.75 161.75" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">剧烈加速。</text><text x="117.75 128.75 139.75 150.75 161.75" y="147.38" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75 155.75" y="163.57" font-size="11.00" class="sc-notoserifcjksc">初步</text><text x="169.64 176.53" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="183.11 194.11 205.11 216.11 227.11 238.11 249.11 260.11 271.11 282.11" y="163.57" font-size="11.00" class="sc-notoserifcjksc">研发报告给出的估计是</text><text x="293.11" y="163.57" font-size="11.00" class="sc-loraregular">“</text><text x="297.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="311.40 318.29" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="324.86 335.86 346.86 357.86 368.86 379.86 390.86 401.86" y="163.57" font-size="11.00" class="sc-notoserifcjksc">带来的能力方面约</text><text x="415.76 419.76 422.47 428.46" y="163.57" font-size="11.00" class="sc-loraregular">1.5X</text><text x="438.49 449.49 460.49 471.49 482.49 493.49 504.49" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的总体加速（即</text><text x="518.39" y="163.57" font-size="11.00" class="sc-loraregular">1</text><text x="525.28" y="163.57" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="144.75 155.75 166.75" y="179.19" font-size="11.00" class="sc-notoserifcjksc">内完成</text><text x="180.64 184.65 187.35" y="179.19" font-size="11.00" class="sc-loraregular">1.5</text><text x="196.24 207.24 218.24 229.24 240.24 251.24 262.24 273.24 284.24" y="179.19" font-size="11.00" class="sc-notoserifcjksc">年的进展），或许有</text><text x="298.13 304.26 311.09" y="179.19" font-size="11.00" class="sc-loraregular">30%</text><text x="323.55 334.55 345.55 356.55 367.55 378.55" y="179.19" font-size="11.00" class="sc-notoserifcjksc">的可能性达到</text><text x="392.45 398.36" y="179.19" font-size="11.00" class="sc-loraregular">2X</text><text x="408.39 419.39 430.39" y="179.19" font-size="11.00" class="sc-notoserifcjksc">加速。</text><text x="441.39" y="179.19" font-size="11.00" class="sc-loraregular">”</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75 422.75 433.75 444.75 455.75 466.75 477.75 488.75 499.75 510.75 521.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">请注意，由于该初步报告未说明这一估计所对应的时间段，目前尚不清楚</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">这一估计适用于</text><text x="260.64 264.59 272.28 275.27 280.88 287.45 294.03 299.99 302.88 311.62 318.18 324.75 329.84 332.74 338.73 341.44 347.43" y="227.77" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="354.28 365.28 376.28 387.28 398.28 409.28 420.28 431.28 442.28 453.28" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的开发还是其他时期。</text><text x="144.75 155.75 166.75" y="276.91" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="180.64 184.59 192.28 195.27 200.88 207.45 214.03 219.99 222.88 231.62 238.18 244.75 249.84 252.74 258.73 261.44 267.43" y="276.91" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.28 285.28 296.28 307.28 318.28 329.28 340.28 351.28 362.28 373.28 384.28 395.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">能力的理解表明，它相对于</text><text x="409.17 414.76 420.43 426.83 429.83 435.79 438.68 444.68 447.38" y="276.91" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="454.28 465.28 476.28 487.28 498.28 509.28 520.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">是符合趋势的改</text><text x="144.75 155.75" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进。</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75 411.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">这一判断基于我们的内部能力评估（表明其相对于</text><text x="425.64 431.23 436.91 443.31 446.30 452.26 455.16 461.15 463.86" y="309.30" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="470.75 481.75 492.75 503.75 514.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">有渐进式改</text><text x="180.75 191.75 202.75 213.75 224.75" y="324.92" font-size="11.00" class="sc-notoserifcjksc">进），以及</text><text x="238.64 245.53 252.11 256.36 262.95 267.64 274.07 280.64 283.73" y="324.92" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="292.48 303.48 314.48 325.48 336.48 347.48 358.48 369.48 380.48 391.48 402.48 413.48 424.48 435.48 446.48 457.48 468.48 479.48 490.48" y="324.92" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中提供的信息（表明</text><text x="180.75 184.70 192.39 195.38 200.99 207.56 214.14 220.10 222.99 231.72 238.29 244.86 249.95 252.84 258.84 261.55 267.54" y="340.54" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.38 285.38 296.38 307.38" y="340.54" font-size="11.00" class="sc-notoserifcjksc">延续了自</text><text x="321.27 331.21 337.07 341.33 347.92 354.35 359.45 362.34 369.00 373.69 379.60 385.15 388.24 394.16" y="340.54" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="405.86 416.86 427.86" y="340.54" font-size="11.00" class="sc-notoserifcjksc">以来的</text><text x="441.76 448.64 455.49 463.17" y="340.54" font-size="11.00" class="sc-loraregular">AECI</text><text x="469.75 480.75 491.75 502.75" y="340.54" font-size="11.00" class="sc-notoserifcjksc">趋势）。</text><text x="72.00 79.46 82.84 90.63 94.01" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23 117.23" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.14 225.85" y="432.68" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="234.73 245.73 256.73 267.73 278.73" y="432.68" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="292.63 299.54 305.77" y="432.68" font-size="11.00" class="sc-loraregular">RSP</text><text x="315.33 326.33 337.33 348.33 359.33 370.33" y="432.68" font-size="11.00" class="sc-notoserifcjksc">中关于自动化</text><text x="384.22 391.11" y="432.68" font-size="11.00" class="sc-loraregular">AI</text><text x="397.69 408.69 419.69 430.69 441.69 452.69 463.69 474.69 485.69 496.69 507.69 518.69" y="432.68" font-size="11.00" class="sc-notoserifcjksc">研发剧烈加速的能力阈值。</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="448.30" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="448.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34 140.22" y="448.30" font-size="11.00" class="sc-loraregular">AI</text><text x="146.80 157.80 168.80 179.80 190.80 201.80 212.80 223.80 234.80 245.80 256.80 267.80 278.80 289.80 300.80 311.80 322.80 333.80 344.80 355.80 366.80 377.80" y="448.30" font-size="11.00" class="sc-notoserifcjksc">研发领域的能力处于或略高于我们此前的能力前沿</text><text x="391.69 399.38 402.37 407.98 414.55 421.13 427.09 429.98 439.92 445.78 450.04 456.63 463.06 468.15 471.05 477.04 479.75" y="448.30" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="483.75 494.75 505.75 516.75" y="448.30" font-size="11.00" class="sc-notoserifcjksc">。我们认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">为，它在许多情况下能为</text><text x="195.89 202.78" y="463.92" font-size="11.00" class="sc-loraregular">AI</text><text x="209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="463.92" font-size="11.00" class="sc-notoserifcjksc">研发工作带来有意义的加速，并且在该领域的能力略强于我们以往系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="479.54" font-size="11.00" class="sc-notoserifcjksc">统卡中所描述的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。第一，与以往模型一样，</text><text x="325.00 333.73 340.30 346.87 351.96 354.85 360.85 363.55" y="546.03" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="546.03" font-size="11.00" class="sc-notoserifcjksc">似乎并不接近能够完全替代我们的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">研究科学家和研究工程师，尤其是相对资深的人员。在</text><text x="338.89 346.58 352.75 359.60 365.56 372.23 378.09 384.67 387.57 393.48 396.18" y="561.65" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="403.08 414.08" y="561.65" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="425.08 432.77 435.76 441.37 447.94 454.51 460.48 463.37 472.10 478.67 485.24 490.33 493.22 499.22 501.92" y="561.65" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="510.81 521.81" y="561.65" font-size="11.00" class="sc-notoserifcjksc">的得</text><text x="72.00 83.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">分与</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.24 184.95" y="577.27" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="191.85" y="577.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="205.74 213.43 216.42 222.03 228.60 235.17 241.14 244.03 252.76 259.33 265.90 270.99 273.88" y="577.27" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="282.77 293.77 304.77 315.77 326.77 337.77 348.77 359.77 370.77 381.77 392.77 403.77 414.77 425.77" y="577.27" font-size="11.00" class="sc-notoserifcjksc">的差异在噪声范围内，且远低于</text><text x="439.66 445.85 451.84" y="577.27" font-size="11.00" class="sc-loraregular">85%</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="592.89" font-size="11.00" class="sc-notoserifcjksc">认为，能够完全替代</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="592.89" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73" y="592.89" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型应能达到这一阈值。第二，在更新后的</text><text x="494.62 501.51 508.35 516.04" y="592.89" font-size="11.00" class="sc-loraregular">AECI</text><text x="522.61" y="592.89" font-size="11.00" class="sc-notoserifcjksc">拟</text><text x="72.00 83.00 94.00" y="608.51" font-size="11.00" class="sc-notoserifcjksc">合中，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15 179.14 181.85" y="608.51" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.73 201.73 212.73 223.73" y="608.51" font-size="11.00" class="sc-notoserifcjksc">的得分比</text><text x="237.63 245.32 248.31 253.92 260.48 267.06 273.02 275.92 285.85 291.71 295.97 302.56 308.99 314.09 316.98 322.98 325.68" y="608.51" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="332.58" y="608.51" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="346.47 350.48 353.18 358.85" y="608.51" font-size="11.00" class="sc-loraregular">1.24</text><text x="367.70 378.70 389.70 400.70 411.70 422.70 433.70 444.70 455.70 466.70 477.70 488.70 499.70 510.70 521.70" y="608.51" font-size="11.00" class="sc-notoserifcjksc">分，且两个模型都位于对方的局部</text><text x="335.51 343.19 346.19 351.80 358.36 364.94 370.90 373.80 383.73 389.59 393.85 400.44 406.87 411.97 414.86 421.52 426.21 432.12 437.67 440.76 446.68" y="624.13" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中，偏移对数据的拟合更好，但即使是趋势断裂假设也未跨越</text><text x="371.89 378.80 385.04" y="639.75" font-size="11.00" class="sc-loraregular">RSP</text><text x="394.60 405.60 416.60 427.60" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中设定的</text><text x="441.49 447.40" y="639.75" font-size="11.00" class="sc-loraregular">2x</text><text x="456.12 467.12 478.12 489.12 500.12 511.12 522.12" y="639.75" font-size="11.00" class="sc-notoserifcjksc">斜率变化阈值。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="655.37" font-size="11.00" class="sc-notoserifcjksc">由于我们更新了</text><text x="151.89 158.78 165.62 173.31" y="655.37" font-size="11.00" class="sc-loraregular">AECI</text><text x="179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89" y="655.37" font-size="11.00" class="sc-notoserifcjksc">基准组合并重新拟合了量表，且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00 79.69 85.86 92.70 98.66 105.34 111.19 117.78 120.68 126.58 129.29" y="82.61" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="136.18 147.18 158.18 169.18 180.18 191.18 202.18 213.18 224.18 235.18 246.18 257.18 268.18 279.18 290.18 301.18 312.18 323.18 334.18 345.18 356.18 367.18 378.18 389.18 400.18 411.18 422.18 433.18 444.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">环境发生了变化，这些分数无法与早期系统卡中的分数直接比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们将继续追踪内部加速指标，并预计将继续发布这项工作中的观察结果（不过，其中许多评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">与单个模型的发布关联较弱，可能会发布在系统卡以外的文档中，例如我们的风险报告或</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 136.11 141.20 145.46 148.73 152.98 159.55 163.81" y="162.43" font-size="11.00" class="sc-loraregular">Anthropic Institute</text><text x="172.66 183.66 194.66 205.66 216.66 227.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的出版物，如</text><text x="238.66 249.66 260.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这一篇</text><text x="271.66 282.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 80.04 83.68" y="213.54" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26 110.26 124.26 138.26 152.26 166.26" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00 79.46 82.84 91.43 94.82" y="250.64" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61 154.61 167.61 180.61 193.61 206.61 219.61 232.61 245.61 258.61" y="250.64" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张和核心论证的更新</text><text x="72.00 83.00 94.00 105.00 116.00" y="278.53" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 132.91 139.66 145.57" y="278.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="154.82" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="278.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79 188.79 199.79 210.79 221.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68 252.59 255.18" y="278.53" font-size="11.00" class="sc-loraregular">2.6</text><text x="264.43" y="278.53" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="278.33 284.23 286.94 290.94" y="278.53" font-size="11.00" class="sc-loraregular">2.14</text><text x="299.80 310.80 321.80 332.80 343.80 354.80 365.80 376.80 387.80 398.80 409.80 420.80 431.80 442.80 453.80 464.80 475.80 486.80 497.80 508.80 519.80 530.80" y="278.53" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证辩护，在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="294.15" font-size="11.00" class="sc-notoserifcjksc">很大程度上仍适用于</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="294.15" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63" y="294.15" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐风险。下面我们介绍对部分具体主张的更</text><text x="72.00 83.00" y="309.77" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00 83.00 94.00" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="343.30" font-size="11.00" class="sc-lorabold">1</text><text x="115.25 126.25 137.25" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="151.14 162.14 173.14 184.14 195.14 206.14 217.14 228.14 239.14 250.14" y="343.30" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="264.04" y="343.30" font-size="11.00" class="sc-loraregular">1</text><text x="270.93" y="343.30" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="281.93" y="343.30" font-size="11.00" class="sc-loraregular">“</text><text x="286.33 297.33 308.33 319.33 330.33 341.33 352.33 363.33 374.33 385.33 396.33 407.33 418.33 429.33 440.33" y="343.30" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="451.33" y="343.30" font-size="11.00" class="sc-loraregular">”</text><text x="455.17 466.17 477.17 488.17 499.17 510.17 521.17" y="343.30" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡第</text><text x="72.00 78.36 80.95 87.31 90.02" y="358.92" font-size="11.00" class="sc-loraregular">6.6.4</text><text x="98.87 109.87 120.87 131.87 142.87 153.87 164.87 175.87 186.87 197.87 208.87 219.87" y="358.92" font-size="11.00" class="sc-notoserifcjksc">节所述的隐蔽能力评估中，</text><text x="230.87 238.56 241.55 247.16 253.73 260.31 266.27 269.16 277.90 284.47 291.03 296.12 299.02 305.01 307.72" y="358.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="316.61 327.61 338.61 349.61 360.61 371.61 382.61 393.61 404.61 415.61 426.61 437.61 448.61 459.61 470.61 481.61" y="358.92" font-size="11.00" class="sc-notoserifcjksc">的结果好坏参半。在不使用扩展思考</text><text x="72.00" y="374.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.74 98.99 104.96 111.63 118.21 124.12 130.70 133.59 137.85 144.43 147.53 154.20 160.11 163.20 169.88" y="374.54" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="175.96 186.96" y="374.54" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="200.85 207.21 210.30 216.98 223.55 229.73 236.62 241.30 247.26 253.94" y="374.54" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="262.51 273.51 284.51 295.51 306.51 317.51 328.51 339.51 350.51 361.51 372.51 383.51 394.51 405.51 416.51 427.51 438.51 449.51 460.51 471.51 482.51" y="374.54" font-size="11.00" class="sc-notoserifcjksc">设置中，或扩展思考对监控器不可见的设置中，</text><text x="493.51 501.20 504.19 509.80 516.37 522.94" y="374.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="390.16" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44" y="390.16" font-size="11.00" class="sc-notoserifcjksc">采取不期望行为的意愿略低于</text><text x="265.34 273.02 276.02 281.63 288.19 294.77 300.73 303.63 313.56 319.42 323.68 330.27 336.70 341.80 344.69 350.68 353.39" y="390.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="357.39 368.39 379.39 390.39 401.39 412.39 423.39 434.39 445.39 456.39 467.39 478.39 489.39 500.39 511.39 522.40" y="390.16" font-size="11.00" class="sc-notoserifcjksc">。然而，当扩展思考对监控器可见时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="405.78" font-size="11.00" class="sc-notoserifcjksc">（我们实际部署时的监控器即是如此），其表现非常差。这一总体模式在</text><text x="426.89 433.13 441.71 448.60 456.68 463.30 468.68 475.57 480.25 486.22 492.89" y="405.78" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="501.46 512.46 523.46" y="405.78" font-size="11.00" class="sc-notoserifcjksc">中得到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="421.40" font-size="11.00" class="sc-notoserifcjksc">了复现。在扩展思考可见的</text><text x="206.89 213.25 216.34 223.02 229.59 235.77 242.65 247.34 253.30 259.98" y="421.40" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="268.55 279.55 290.55 301.55 312.55 323.55 334.55 345.55 356.55 367.55 378.55" y="421.40" font-size="11.00" class="sc-notoserifcjksc">设置中，使用强化学习（</text><text x="389.55 396.46" y="421.40" font-size="11.00" class="sc-loraregular">RL</text><text x="402.81 413.81 424.81 435.81 446.81 457.81 468.81 479.81 490.81 501.81" y="421.40" font-size="11.00" class="sc-notoserifcjksc">）进行分布内能力激发</text><text x="72.00" y="437.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.96 91.95 95.04 100.90 104.16 108.42 114.02 118.28 121.37 127.80" y="437.02" font-size="11.00" class="sc-loraregular">elicitation</text><text x="134.48 145.48 156.48 167.48 178.48 189.48 200.48 211.48 222.48 233.48 244.48 255.48 266.48 277.48 288.48 299.48 310.48 321.48 332.48 343.48 354.48 365.48 376.48 387.48 398.48 409.48 420.48 431.48 442.48 453.48 464.48 475.48 486.48 497.48 508.48 519.48 530.48" y="437.02" font-size="11.00" class="sc-notoserifcjksc">）后，表现并未显著提高，尽管这种训练几乎消除了可检测到的拒绝，这在一定程度</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="452.64" font-size="11.00" class="sc-notoserifcjksc">上构成了反对</text><text x="138.00" y="452.64" font-size="11.00" class="sc-loraregular">“</text><text x="142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40" y="452.64" font-size="11.00" class="sc-notoserifcjksc">表现不佳是由故意藏拙（</text><text x="263.40 268.49 274.17 280.85 287.42 293.83 299.50 305.58 311.93 315.02 321.70" y="452.64" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="327.78 338.78 349.78" y="452.64" font-size="11.00" class="sc-notoserifcjksc">）造成</text><text x="360.78" y="452.64" font-size="11.00" class="sc-loraregular">”</text><text x="364.62 375.62 386.62 397.62 408.62 419.62 430.62 441.62 452.62 463.62 474.62 485.62 496.62 507.62 518.62 529.62" y="452.64" font-size="11.00" class="sc-notoserifcjksc">的证据。此外，在扩展思考设置中相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="468.26" font-size="11.00" class="sc-notoserifcjksc">对较差的表现，与该模型在思维链可控性（</text><text x="281.00 286.85 293.44 299.12 302.21 308.89 314.26 320.64 324.25 329.63 333.89 340.48 346.91 353.48 359.83 366.32 370.57 373.47 379.26 385.70 392.28 396.53 401.22 407.65 410.65 413.64 419.31 425.72 428.81 431.80 435.07 439.34" y="468.26" font-size="11.00" class="sc-loraregular">chain-of-thought controllability</text><text x="445.15 456.15 467.15 478.15 489.15 500.15 511.15 522.15" y="468.26" font-size="11.00" class="sc-notoserifcjksc">）评估中的表现一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="483.88" font-size="11.00" class="sc-notoserifcjksc">致：在该评估中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.14 236.85" y="483.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="245.73 256.73 267.73 278.73" y="483.88" font-size="11.00" class="sc-notoserifcjksc">的得分与</text><text x="292.63 300.32 303.31 308.92 315.49 322.06 328.03 330.92 339.65 346.22 352.79 357.88 360.77 366.73 369.09" y="483.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="377.05 388.05 399.05 410.05 421.05 432.05" y="483.88" font-size="11.00" class="sc-notoserifcjksc">相当，远低于</text><text x="445.95 453.63 456.63 462.24 468.80 475.38 481.34 484.24 494.17 500.0
