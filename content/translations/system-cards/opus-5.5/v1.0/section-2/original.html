0" class="sc-notoserifcjksc">了</text><text x="230.64" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="305.59" y="146.81" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="319.48" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="360.54" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级别的趋势。</text><text x="216.75" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在我们的定量评估中，</text><text x="326.75 330.70 338.39 341.38 346.99 353.56 360.14 366.10 368.99 377.72 384.29 390.86 395.95 398.84 404.84 407.55 413.54" y="179.76" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="420.38" y="179.76" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="456.28" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="501.39" y="179.76" font-size="11.00" class="sc-notoserifcjksc">是渐进</text><text x="216.75" y="195.38" font-size="11.00" class="sc-notoserifcjksc">式改进，而非不连续的跃升。</text><text x="216.75" y="228.34" font-size="11.00" class="sc-loraregular sc-k">[Claude Opus 5.5]</text><text x="309.99" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在解决困难的长程任务或进行开放式推理时，仍</text><text x="216.75" y="243.96" font-size="11.00" class="sc-notoserifcjksc">存在人类专家不太可能表现出的定性弱点。</text><text x="144.75" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这一点高度不确定，但我们预计，完全自动化</text><text x="367.64" y="293.11" font-size="11.00" class="sc-loraregular">AI</text><text x="381.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">研发将需要在远见、预测、构建</text><text x="144.75" y="308.73" font-size="11.00" class="sc-notoserifcjksc">自身反馈回路，以及通常可称为研究人员</text><text x="342.75" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="347.15" y="308.73" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="380.15" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="383.99" y="308.73" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="394.99" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="399.39" y="308.73" font-size="11.00" class="sc-notoserifcjksc">品味</text><text x="421.39" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="425.23" y="308.73" font-size="11.00" class="sc-notoserifcjksc">的其他技能方面取得大</text><text x="144.75" y="324.35" font-size="11.00" class="sc-notoserifcjksc">幅提升。</text><text x="180.75" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们掌握的证据并未表明</text><text x="304.64 308.59 316.28 319.27 324.88 331.45 338.03 343.99 346.88 355.62 362.18 368.75 373.84 376.74 382.73 385.44 391.43" y="357.88" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="398.28" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在这些</text><text x="431.28" y="357.88" font-size="11.00" class="sc-loraregular">“</text><text x="435.67" y="357.88" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="468.67" y="357.88" font-size="11.00" class="sc-loraregular">”</text><text x="472.51" y="357.88" font-size="11.00" class="sc-notoserifcjksc">技能上相对于</text><text x="180.75" y="373.50" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="225.86" y="373.50" font-size="11.00" class="sc-notoserifcjksc">有大幅提升。</text><text x="144.75" y="406.45" font-size="11.00" class="sc-notoserifcjksc">与此同时，我们认为</text><text x="246.64 250.59 258.28 261.27 266.88 273.45 280.03 285.99 288.88 297.62 304.18 310.75 315.84 318.74 324.73 327.44 333.43" y="406.45" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="340.28" y="406.45" font-size="11.00" class="sc-notoserifcjksc">仍很可能明显加速研究人员的工作，并自</text><text x="144.75" y="422.07" font-size="11.00" class="sc-notoserifcjksc">动化研发的有限方面。例如，我们预计</text><text x="334.64 338.59 346.28 349.27 354.88 361.45 368.03 373.99 376.88 385.62 392.18 398.75 403.84 406.74 412.73 415.44 421.43" y="422.07" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="428.28" y="422.07" font-size="11.00" class="sc-notoserifcjksc">很可能提供略高于</text><text x="144.75" y="437.69" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="189.86" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的生产力提升。</text><text x="144.75" y="471.22" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="177.75" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="191.21" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力上频繁的渐进式改进仍与</text><text x="359.11" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="372.57" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力的总体快速进展相一致，</text><text x="144.75" y="486.84" font-size="11.00" class="sc-notoserifcjksc">但我们掌握的数据不足以区分改进速度是恒定、加速还是减速。目前尚不清楚，在</text><text x="144.75" y="502.46" font-size="11.00" class="sc-loraregular">AI</text><text x="158.21" y="502.46" font-size="11.00" class="sc-notoserifcjksc">研发流程发生质变之前，还需要多少次这种幅度的持续渐进式定量改进。</text><text x="117.75" y="601.76" font-size="12.00" class="sc-notoserifcjksc">我们还利用了一个目前无法披露的额外信息来源。我们利用该来源来了解</text><text x="117.75" y="618.80" font-size="12.00" class="sc-loraregular sc-k">Anthropic</text><text x="176.48" y="618.80" font-size="12.00" class="sc-notoserifcjksc">的</text><text x="191.63" y="618.80" font-size="12.00" class="sc-loraregular">AI</text><text x="206.32" y="618.80" font-size="12.00" class="sc-notoserifcjksc">研发，但它与</text><text x="281.48" y="618.80" font-size="12.00" class="sc-loraregular">METR</text><text x="318.33" y="618.80" font-size="12.00" class="sc-notoserifcjksc">对这一特定模型的理解无关。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">44</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="82.61" font-size="11.00" class="sc-lorabold">B</text><text x="136.02" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型的开发至少在一定程度上因</text><text x="369.91" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="384.41" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而加速，但不太可能因</text><text x="497.31" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="511.80" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而被</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">剧烈加速。</text><text x="117.75" y="147.38" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75" y="163.57" font-size="11.00" class="sc-notoserifcjksc">初步</text><text x="169.64" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="183.11" y="163.57" font-size="11.00" class="sc-notoserifcjksc">研发报告给出的估计是</text><text x="293.11" y="163.57" font-size="11.00" class="sc-loraregular">“</text><text x="297.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="311.40" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="324.86" y="163.57" font-size="11.00" class="sc-notoserifcjksc">带来的能力方面约</text><text x="415.76" y="163.57" font-size="11.00" class="sc-loraregular">1.5X</text><text x="438.49" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的总体加速（即</text><text x="518.39" y="163.57" font-size="11.00" class="sc-loraregular">1</text><text x="525.28" y="163.57" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="144.75" y="179.19" font-size="11.00" class="sc-notoserifcjksc">内完成</text><text x="180.64" y="179.19" font-size="11.00" class="sc-loraregular">1.5</text><text x="196.24" y="179.19" font-size="11.00" class="sc-notoserifcjksc">年的进展），或许有</text><text x="298.13" y="179.19" font-size="11.00" class="sc-loraregular">30%</text><text x="323.55" y="179.19" font-size="11.00" class="sc-notoserifcjksc">的可能性达到</text><text x="392.45" y="179.19" font-size="11.00" class="sc-loraregular">2X</text><text x="408.39" y="179.19" font-size="11.00" class="sc-notoserifcjksc">加速。</text><text x="441.39" y="179.19" font-size="11.00" class="sc-loraregular">”</text><text x="180.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">请注意，由于该初步报告未说明这一估计所对应的时间段，目前尚不清楚</text><text x="180.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">这一估计适用于</text><text x="260.64 264.59 272.28 275.27 280.88 287.45 294.03 299.99 302.88 311.62 318.18 324.75 329.84 332.74 338.73 341.44 347.43" y="227.77" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="354.28" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的开发还是其他时期。</text><text x="144.75" y="276.91" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="180.64 184.59 192.28 195.27 200.88 207.45 214.03 219.99 222.88 231.62 238.18 244.75 249.84 252.74 258.73 261.44 267.43" y="276.91" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">能力的理解表明，它相对于</text><text x="409.17" y="276.91" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="454.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">是符合趋势的改</text><text x="144.75" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进。</text><text x="180.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">这一判断基于我们的内部能力评估（表明其相对于</text><text x="425.64" y="309.30" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="470.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">有渐进式改</text><text x="180.75" y="324.92" font-size="11.00" class="sc-notoserifcjksc">进），以及</text><text x="238.64" y="324.92" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="292.48" y="324.92" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中提供的信息（表明</text><text x="180.75 184.70 192.39 195.38 200.99 207.56 214.14 220.10 222.99 231.72 238.29 244.86 249.95 252.84 258.84 261.55 267.54" y="340.54" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.38" y="340.54" font-size="11.00" class="sc-notoserifcjksc">延续了自</text><text x="321.27" y="340.54" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="405.86" y="340.54" font-size="11.00" class="sc-notoserifcjksc">以来的</text><text x="441.76" y="340.54" font-size="11.00" class="sc-loraregular">AECI</text><text x="469.75" y="340.54" font-size="11.00" class="sc-notoserifcjksc">趋势）。</text><text x="72.00" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00" y="432.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="234.73" y="432.68" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="292.63" y="432.68" font-size="11.00" class="sc-loraregular">RSP</text><text x="315.33" y="432.68" font-size="11.00" class="sc-notoserifcjksc">中关于自动化</text><text x="384.22" y="432.68" font-size="11.00" class="sc-loraregular">AI</text><text x="397.69" y="432.68" font-size="11.00" class="sc-notoserifcjksc">研发剧烈加速的能力阈值。</text><text x="72.00" y="448.30" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="448.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34" y="448.30" font-size="11.00" class="sc-loraregular">AI</text><text x="146.80" y="448.30" font-size="11.00" class="sc-notoserifcjksc">研发领域的能力处于或略高于我们此前的能力前沿</text><text x="391.69" y="448.30" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="483.75" y="448.30" font-size="11.00" class="sc-notoserifcjksc">。我们认</text><text x="72.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">为，它在许多情况下能为</text><text x="195.89" y="463.92" font-size="11.00" class="sc-loraregular">AI</text><text x="209.36" y="463.92" font-size="11.00" class="sc-notoserifcjksc">研发工作带来有意义的加速，并且在该领域的能力略强于我们以往系</text><text x="72.00" y="479.54" font-size="11.00" class="sc-notoserifcjksc">统卡中所描述的模型。</text><text x="72.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。第一，与以往模型一样，</text><text x="325.00" y="546.03" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="372.44" y="546.03" font-size="11.00" class="sc-notoserifcjksc">似乎并不接近能够完全替代我们的</text><text x="72.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">研究科学家和研究工程师，尤其是相对资深的人员。在</text><text x="338.89" y="561.65" font-size="11.00" class="sc-loraregular sc-k">CoBench 2.1</text><text x="403.08" y="561.65" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="425.08" y="561.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="510.81" y="561.65" font-size="11.00" class="sc-notoserifcjksc">的得</text><text x="72.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">分与</text><text x="96.89" y="577.27" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="191.85" y="577.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="205.74" y="577.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="282.77" y="577.27" font-size="11.00" class="sc-notoserifcjksc">的差异在噪声范围内，且远低于</text><text x="439.66" y="577.27" font-size="11.00" class="sc-loraregular">85%</text><text x="72.00" y="592.89" font-size="11.00" class="sc-notoserifcjksc">认为，能够完全替代</text><text x="173.89" y="592.89" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="227.73" y="592.89" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型应能达到这一阈值。第二，在更新后的</text><text x="494.62" y="592.89" font-size="11.00" class="sc-loraregular">AECI</text><text x="522.61" y="592.89" font-size="11.00" class="sc-notoserifcjksc">拟</text><text x="72.00" y="608.51" font-size="11.00" class="sc-notoserifcjksc">合中，</text><text x="105.00" y="608.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="190.73" y="608.51" font-size="11.00" class="sc-notoserifcjksc">的得分比</text><text x="237.63" y="608.51" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="332.58" y="608.51" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="346.47" y="608.51" font-size="11.00" class="sc-loraregular sc-k">1.24</text><text x="367.70" y="608.51" font-size="11.00" class="sc-notoserifcjksc">分，且两个模型都位于对方的局部</text><text x="335.51" y="624.13" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="72.00" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中，偏移对数据的拟合更好，但即使是趋势断裂假设也未跨越</text><text x="371.89" y="639.75" font-size="11.00" class="sc-loraregular">RSP</text><text x="394.60" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中设定的</text><text x="441.49" y="639.75" font-size="11.00" class="sc-loraregular">2x</text><text x="456.12" y="639.75" font-size="11.00" class="sc-notoserifcjksc">斜率变化阈值。</text><text x="72.00" y="655.37" font-size="11.00" class="sc-notoserifcjksc">由于我们更新了</text><text x="151.89" y="655.37" font-size="11.00" class="sc-loraregular">AECI</text><text x="179.89" y="655.37" font-size="11.00" class="sc-notoserifcjksc">基准组合并重新拟合了量表，且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">CoBench 2.1</text><text x="136.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">环境发生了变化，这些分数无法与早期系统卡中的分数直接比较。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们将继续追踪内部加速指标，并预计将继续发布这项工作中的观察结果（不过，其中许多评估</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">与单个模型的发布关联较弱，可能会发布在系统卡以外的文档中，例如我们的风险报告或</text><text x="72.00" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Anthropic Institute</text><text x="172.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的出版物，如</text><text x="238.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这一篇</text><text x="271.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="250.64" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="250.64" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张和核心论证的更新</text><text x="72.00" y="278.53" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00" y="278.53" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="154.82" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="278.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68" y="278.53" font-size="11.00" class="sc-loraregular sc-k">2.6</text><text x="264.43" y="278.53" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="278.33" y="278.53" font-size="11.00" class="sc-loraregular">2.14</text><text x="299.80" y="278.53" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证辩护，在</text><text x="72.00" y="294.15" font-size="11.00" class="sc-notoserifcjksc">很大程度上仍适用于</text><text x="173.89" y="294.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="259.63" y="294.15" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐风险。下面我们介绍对部分具体主张的更</text><text x="72.00" y="309.77" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="343.30" font-size="11.00" class="sc-lorabold">1</text><text x="115.25" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="151.14" y="343.30" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="264.04" y="343.30" font-size="11.00" class="sc-loraregular">1</text><text x="270.93" y="343.30" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="281.93" y="343.30" font-size="11.00" class="sc-loraregular">“</text><text x="286.33" y="343.30" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="451.33" y="343.30" font-size="11.00" class="sc-loraregular">”</text><text x="455.17" y="343.30" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡第</text><text x="72.00" y="358.92" font-size="11.00" class="sc-loraregular sc-k">6.6.4</text><text x="98.87" y="358.92" font-size="11.00" class="sc-notoserifcjksc">节所述的隐蔽能力评估中，</text><text x="230.87" y="358.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="316.61" y="358.92" font-size="11.00" class="sc-notoserifcjksc">的结果好坏参半。在不使用扩展思考</text><text x="72.00" y="374.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="374.54" font-size="11.00" class="sc-loraregular sc-k">extended thinking</text><text x="175.96" y="374.54" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="200.85" y="374.54" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="262.51" y="374.54" font-size="11.00" class="sc-notoserifcjksc">设置中，或扩展思考对监控器不可见的设置中，</text><text x="493.51" y="374.54" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="390.16" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="390.16" font-size="11.00" class="sc-notoserifcjksc">采取不期望行为的意愿略低于</text><text x="265.34" y="390.16" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="357.39" y="390.16" font-size="11.00" class="sc-notoserifcjksc">。然而，当扩展思考对监控器可见时</text><text x="72.00" y="405.78" font-size="11.00" class="sc-notoserifcjksc">（我们实际部署时的监控器即是如此），其表现非常差。这一总体模式在</text><text x="426.89 433.13 441.71 448.60 456.68 463.30 468.68 475.57 480.25 486.22 492.89" y="405.78" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="501.46" y="405.78" font-size="11.00" class="sc-notoserifcjksc">中得到</text><text x="72.00" y="421.40" font-size="11.00" class="sc-notoserifcjksc">了复现。在扩展思考可见的</text><text x="206.89" y="421.40" font-size="11.00" class="sc-loraregular sc-k">LinuxArena</text><text x="268.55" y="421.40" font-size="11.00" class="sc-notoserifcjksc">设置中，使用强化学习（</text><text x="389.55" y="421.40" font-size="11.00" class="sc-loraregular">RL</text><text x="402.81" y="421.40" font-size="11.00" class="sc-notoserifcjksc">）进行分布内能力激发</text><text x="72.00" y="437.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="437.02" font-size="11.00" class="sc-loraregular sc-k">elicitation</text><text x="134.48" y="437.02" font-size="11.00" class="sc-notoserifcjksc">）后，表现并未显著提高，尽管这种训练几乎消除了可检测到的拒绝，这在一定程度</text><text x="72.00" y="452.64" font-size="11.00" class="sc-notoserifcjksc">上构成了反对</text><text x="138.00" y="452.64" font-size="11.00" class="sc-loraregular">“</text><text x="142.40" y="452.64" font-size="11.00" class="sc-notoserifcjksc">表现不佳是由故意藏拙（</text><text x="263.40" y="452.64" font-size="11.00" class="sc-loraregular sc-k">sandbagging</text><text x="327.78" y="452.64" font-size="11.00" class="sc-notoserifcjksc">）造成</text><text x="360.78" y="452.64" font-size="11.00" class="sc-loraregular">”</text><text x="364.62" y="452.64" font-size="11.00" class="sc-notoserifcjksc">的证据。此外，在扩展思考设置中相</text><text x="72.00" y="468.26" font-size="11.00" class="sc-notoserifcjksc">对较差的表现，与该模型在思维链可控性（</text><text x="281.00" y="468.26" font-size="11.00" class="sc-loraregular sc-k">chain-of-thought controllability</text><text x="445.15" y="468.26" font-size="11.00" class="sc-notoserifcjksc">）评估中的表现一</text><text x="72.00" y="483.88" font-size="11.00" class="sc-notoserifcjksc">致：在该评估中，</text><text x="160.00" y="483.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="245.73" y="483.88" font-size="11.00" class="sc-notoserifcjksc">的得分与</text><text x="292.63" y="483.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="377.05" y="483.88" font-size="11.00" class="sc-notoserifcjksc">相当，远低于</text><text x="445.95" y="483.88" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="499.50" font-size="11.00" class="sc-loraregular sc-k">Preview</text><text x="115.53" y="499.50" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42" y="499.50" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="224.37" y="499.50" font-size="11.00" class="sc-notoserifcjksc">所展现的可控性。</text><text x="72.00" y="602.37" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为，与以往模型在其部署时相比，</text><text x="325.00" y="602.37" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="410.73" y="602.37" font-size="11.00" class="sc-notoserifcjksc">破坏我们现有监督水平的</text><text x="72.00" y="617.99" font-size="11.00" class="sc-notoserifcjksc">能力并没有显著更强，因此我们认为主张</text><text x="272.89" y="617.99" font-size="11.00" class="sc-loraregular">1</text><text x="279.79" y="617.99" font-size="11.00" class="sc-notoserifcjksc">目前并不比我们最近一份风险报告中显著更弱。</text><text x="72.00" y="667.14" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="667.14" font-size="11.00" class="sc-lorabold">2</text><text x="116.65" y="667.14" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="152.54" y="667.14" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="177.43" y="667.14" font-size="11.00" class="sc-loraregular">2</text><text x="186.23" y="667.14" font-size="11.00" class="sc-notoserifcjksc">认为</text><text x="208.23" y="667.14" font-size="11.00" class="sc-loraregular">“</text><text x="212.63" y="667.14" font-size="11.00" class="sc-notoserifcjksc">已知未对齐带来的预期危害较低</text><text x="366.63" y="667.14" font-size="11.00" class="sc-loraregular">”</text><text x="370.47" y="667.14" font-size="11.00" class="sc-notoserifcjksc">。我们认为，</text><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="238.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="238.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="249.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="249.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="260.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="260.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="269.73" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="151.93" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154.82" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="165.82" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="168.71" y="269.73" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="174.89" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="177.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">46</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节中呈现的关于</text><text x="175.04" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="260.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对齐属性的任何观察结果，都不意味着风险高于我们此前</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">能力最强的模型</text><text x="151.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="246.85" y="98.23" font-size="11.00" class="sc-notoserifcjksc">所带来的风险。因此，我们认为主张</text><text x="425.74" y="98.23" font-size="11.00" class="sc-loraregular">2</text><text x="434.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的强度没有变化。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="131.19" font-size="11.00" class="sc-lorabold">3.4</text><text x="125.53" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="139.42" y="131.19" font-size="11.00" class="sc-lorabold">4.4</text><text x="156.91" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="192.80" y="131.19" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="217.70" y="131.19" font-size="11.00" class="sc-loraregular">3.4</text><text x="235.38" y="131.19" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="246.38" y="131.19" font-size="11.00" class="sc-loraregular">“</text><text x="250.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">根据我们的对齐评估，存在未知的严重普遍性未对齐是不太</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">可能的</text><text x="105.00" y="146.81" font-size="11.00" class="sc-loraregular">”</text><text x="108.84" y="146.81" font-size="11.00" class="sc-notoserifcjksc">。主张</text><text x="144.73" y="146.81" font-size="11.00" class="sc-loraregular">4.4</text><text x="162.26" y="146.81" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="173.26" y="146.81" font-size="11.00" class="sc-loraregular">“</text><text x="177.65" y="146.81" font-size="11.00" class="sc-notoserifcjksc">根据我们的对齐评估，存在未知的严重情境依赖性未对齐是有些不太可能</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。我们的对齐评估为</text><text x="188.73" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="274.47" y="162.43" font-size="11.00" class="sc-notoserifcjksc">提供的证据强度，略低于</text><text x="398.36" y="162.43" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="426.18" y="162.43" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="440.07" y="162.43" font-size="11.00" class="sc-loraregular">8</text><text x="449.15" y="162.43" font-size="11.00" class="sc-notoserifcjksc">月风险报告中为</text><text x="72.00" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="160.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">提供的证据强度，因为</text><text x="273.14" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="358.87" y="178.05" font-size="11.00" class="sc-notoserifcjksc">是一个较新的模型，其内部使用量少</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="193.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="174.14" y="193.67" font-size="11.00" class="sc-notoserifcjksc">在该报告发布时的内部使用量。这并不会显著改变我们对上级主张</text><text x="496.03" y="193.67" font-size="11.00" class="sc-loraregular">3</text><text x="502.16" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="513.16" y="193.67" font-size="11.00" class="sc-loraregular">“</text><text x="517.56" y="193.67" font-size="11.00" class="sc-notoserifcjksc">存在</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">未知的严重普遍性未对齐是非常不可能的</text><text x="270.00" y="209.29" font-size="11.00" class="sc-loraregular">”</text><text x="273.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">）和主张</text><text x="320.73" y="209.29" font-size="11.00" class="sc-loraregular">4</text><text x="326.69" y="209.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="337.69" y="209.29" font-size="11.00" class="sc-loraregular">“</text><text x="342.09" y="209.29" font-size="11.00" class="sc-notoserifcjksc">未知的严重情境依赖性未对齐带来的预期</text><text x="72.00" y="224.91" font-size="11.00" class="sc-notoserifcjksc">危害较低</text><text x="116.00" y="224.91" font-size="11.00" class="sc-loraregular">”</text><text x="119.84" y="224.91" font-size="11.00" class="sc-notoserifcjksc">）的总体信心，因为它们各自都得到了多个相互印证的子主张的支持。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们认为，主张</text><text x="151.89" y="325.49" font-size="11.00" class="sc-loraregular">5</text><text x="157.89" y="325.49" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="168.89" y="325.49" font-size="11.00" class="sc-loraregular">6</text><text x="175.25" y="325.49" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="186.25" y="325.49" font-size="11.00" class="sc-loraregular">7</text><text x="194.21" y="325.49" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="208.10" y="325.49" font-size="11.00" class="sc-loraregular">8</text><text x="217.18" y="325.49" font-size="11.00" class="sc-notoserifcjksc">均无需更新，风险报告第</text><text x="341.07" y="325.49" font-size="11.00" class="sc-loraregular">2.15</text><text x="362.58" y="325.49" font-size="11.00" class="sc-notoserifcjksc">节中提供的特定路径评估也无需更</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的对齐风险总体评估</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="400.30" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="113.71" y="400.30" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="127.61" y="400.30" font-size="11.00" class="sc-loraregular">8</text><text x="136.68" y="400.30" font-size="11.00" class="sc-notoserifcjksc">月风险报告中，我们将对齐风险评估上调至</text><text x="345.68" y="400.30" font-size="11.00" class="sc-loraregular">“</text><text x="350.08" y="400.30" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="361.08" y="400.30" font-size="11.00" class="sc-loraregular">”</text><text x="364.92" y="400.30" font-size="11.00" class="sc-notoserifcjksc">。我们这样做是为了反映近期与模型</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">在网络安全评估中的行为相关的事件披露所带来的不确定性增加，尽管我们认为我们的论证很可</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">能仍支持对所涵盖模型给出更低的风险等级。鉴于上述对具体主张的更新均不意味着风险显著增</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">加，我们的总体评估是，</text><text x="193.00" y="447.16" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="278.73" y="447.16" font-size="11.00" class="sc-notoserifcjksc">未对齐所导致的灾难性危害风险同样为低。</text></svg></div>
