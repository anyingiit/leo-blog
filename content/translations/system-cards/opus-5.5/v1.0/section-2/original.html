nt-size="11.00" class="sc-loraregular">169.36</text><text x="453.48" y="307.58" font-size="11.00" class="sc-notoserifcjksc">，比</text><text x="478.37 486.06 489.05 494.66 501.23 507.81" y="307.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.06 157.76" y="323.20" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="164.66" y="323.20" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="178.55 182.56 185.26 190.93" y="323.20" font-size="11.00" class="sc-loraregular">1.24</text><text x="199.78" y="323.20" font-size="11.00" class="sc-notoserifcjksc">分，且两个模型都落在对方的局部误差线之内。我们得出结论：风险阈</text><text x="108.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">值未被越过，依据与我们对此前前沿模型所作判定的两点理由相同：（</text><text x="449.00" y="338.82" font-size="11.00" class="sc-loraregular">1</text><text x="453.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">）我们没有观察到</text><text x="108.00" y="354.44" font-size="11.00" class="sc-notoserifcjksc">我们整体</text><text x="154.89" y="354.44" font-size="11.00" class="sc-loraregular">AI</text><text x="168.36" y="354.44" font-size="11.00" class="sc-notoserifcjksc">进展速度出现持续的、可归因于</text><text x="325.25" y="354.44" font-size="11.00" class="sc-loraregular">AI</text><text x="338.71" y="354.44" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="352.61" y="354.44" font-size="11.00" class="sc-loraregular">2×</text><text x="367.24" y="354.44" font-size="11.00" class="sc-notoserifcjksc">加速；（</text><text x="411.24" y="354.44" font-size="11.00" class="sc-loraregular">2</text><text x="417.14" y="354.44" font-size="11.00" class="sc-notoserifcjksc">）该模型并未接近能够替</text><text x="108.00" y="370.06" font-size="11.00" class="sc-notoserifcjksc">代我们的研究科学家和研究工程师的程度，尤其是相对资深的研究人员。我们的</text><text x="495.89 501.80 508.55 514.46" y="370.06" font-size="11.00" class="sc-loraregular">2026</text><text x="523.71" y="370.06" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="108.00" y="385.68" font-size="11.00" class="sc-loraregular">8</text><text x="117.07" y="385.68" font-size="11.00" class="sc-notoserifcjksc">月风险报告将该威胁模型下的风险评估为低，同时指出其置信度低于以往报告，原因有</text><text x="108.00" y="401.30" font-size="11.00" class="sc-notoserifcjksc">二：一是我们最具体的基于任务的评估已饱和，二是我们观察到一项或多项高度相关的内</text><text x="108.00" y="416.92" font-size="11.00" class="sc-notoserifcjksc">部指标出现了加速；我们预计将在未来的风险报告中进一步讨论这一点。</text><text x="72.00" y="518.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2</text><text x="104.57" y="518.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于我们判定背后理由的概要说明</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="546.03" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="546.03" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.63" y="546.03" font-size="11.00" class="sc-loraregular">AI</text><text x="185.09" y="546.03" font-size="11.00" class="sc-notoserifcjksc">研发领域的能力与我们此前的能力前沿</text><text x="374.98 382.67 385.67 391.27 397.84 404.42 410.38 413.27 423.21 429.07 433.33 439.92 446.35 451.44 454.34 460.33 463.04" y="546.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="469.94" y="546.03" font-size="11.00" class="sc-notoserifcjksc">持平或略高。</text><text x="72.00" y="594.60" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="594.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63" y="594.60" font-size="11.00" class="sc-notoserifcjksc">在自主性威胁模型</text><text x="284.52" y="594.60" font-size="11.00" class="sc-loraregular">2</text><text x="293.32" y="594.60" font-size="11.00" class="sc-notoserifcjksc">上的风险阈值进行评估的方式，沿用了近期系统卡</text><text x="72.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">中确立的相同方法。</text><text x="72.00" y="643.18" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="107.89" y="643.18" font-size="11.00" class="sc-loraregular">RSP</text><text x="130.60" y="643.18" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.49 150.44 158.13" y="643.18" font-size="11.00" class="sc-loraregular">FCF</text><text x="167.05" y="643.18" font-size="11.00" class="sc-notoserifcjksc">规定，若我们判定满足以下任一条件，即达到自动化</text><text x="422.94" y="643.18" font-size="11.00" class="sc-loraregular">AI</text><text x="436.41" y="643.18" font-size="11.00" class="sc-notoserifcjksc">研发阈值：（</text><text x="502.41" y="643.18" font-size="11.00" class="sc-loraregular">1</text><text x="506.41" y="643.18" font-size="11.00" class="sc-notoserifcjksc">）我们</text><text x="72.00" y="658.80" font-size="11.00" class="sc-notoserifcjksc">的模型能够以具有竞争力的成本（五倍以内）完全替代我们全部的研究科学家和研究工程师；或</text><text x="72.00" y="674.42" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="674.42" font-size="11.00" class="sc-loraregular">2</text><text x="88.91" y="674.42" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="99.91" y="674.42" font-size="11.00" class="sc-loraregular">AI</text><text x="113.37" y="674.42" font-size="11.00" class="sc-notoserifcjksc">进展速度出现</text><text x="179.37" y="674.42" font-size="11.00" class="sc-loraregular">“</text><text x="183.77" y="674.42" font-size="11.00" class="sc-notoserifcjksc">剧烈加速</text><text x="227.77" y="674.42" font-size="11.00" class="sc-loraregular">”</text><text x="231.61" y="674.42" font-size="11.00" class="sc-notoserifcjksc">，且原因很可能与</text><text x="322.50" y="674.42" font-size="11.00" class="sc-loraregular">AI</text><text x="335.97" y="674.42" font-size="11.00" class="sc-notoserifcjksc">研发的自动化有关。我们的评估涵盖了这</text><text x="72.00" y="690.04" font-size="11.00" class="sc-notoserifcjksc">两条路径：</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.25" y="218.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="494.25" y="218.97" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="519.18" y="218.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="522.07" y="218.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="533.07" y="218.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="108.00" y="234.59" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="114.18" y="234.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="117.07" y="234.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="128.07" y="234.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="128.07" y="234.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="139.07" y="234.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="139.07" y="234.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="150.07" y="234.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="150.07" y="234.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="161.07" y="234.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="161.07" y="234.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p035.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 35 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">35</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">关于替代（路径</text><text x="187.89" y="82.61" font-size="11.00" class="sc-lorabold">1</text><text x="192.36" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们判定中最重要的因素是：在预发布期间，我</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">们在自己的日常研究和工程工作中广泛使用了</text><text x="330.89 338.58 341.57 347.18 353.75 360.33 366.29 369.18 377.92 384.49 391.05 396.14 399.04 405.03 407.74" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="413.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，而它看起来并不接近能</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">够替代我们的研究科学家和研究工程师，尤其是相对资深的人员。第</text><text x="440.89" y="113.85" font-size="11.00" class="sc-loraregular">2.3.3</text><text x="467.36" y="113.85" font-size="11.00" class="sc-notoserifcjksc">节讨论了</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.14 184.85" y="129.47" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.73" y="129.47" font-size="11.00" class="sc-notoserifcjksc">未能达到我们对一名称职的人类研究人员所期望水平的行为模式。在</text><text x="108.00 115.69 121.86 128.70 134.66 141.34 147.19 153.78 156.68 162.58 165.29" y="145.09" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="172.18" y="145.09" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="194.18" y="145.09" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="241.63" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的得分与我们此前的前沿模型相比在噪声范围内，远低于我们</text><text x="108.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">认为一个能够完全替代我们研究人员的模型会达到的分数（如第</text><text x="418.89" y="160.71" font-size="11.00" class="sc-loraregular">2.3.4</text><text x="445.19" y="160.71" font-size="11.00" class="sc-notoserifcjksc">节所述）。</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">关于剧烈加速（路径</text><text x="209.89" y="228.34" font-size="11.00" class="sc-lorabold">2</text><text x="215.76" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="237.76" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们通过两种方式评估我们</text><text x="372.65" y="228.34" font-size="11.00" class="sc-loraregular">AI</text><text x="386.11" y="228.34" font-size="11.00" class="sc-notoserifcjksc">进展的速度。第一，在重新拟合</text><text x="108.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">后的</text><text x="132.89" y="243.96" font-size="11.00" class="sc-loraregular">AECI</text><text x="160.89" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="182.89 190.58 193.57 199.18 205.75 212.32 218.29 221.18 229.91 236.48 243.05 248.14 251.03 257.03 259.73" y="243.96" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="268.62" y="243.96" font-size="11.00" class="sc-notoserifcjksc">高于历史趋势线，并与</text><text x="381.52 389.20 392.20 397.81 404.37 410.95 416.91 419.81 429.74 435.60 439.86 446.45 452.88" y="243.96" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="460.87" y="243.96" font-size="11.00" class="sc-notoserifcjksc">系列模型的趋势</text><text x="108.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">一致；我们不认为这意味着在</text><text x="253.89 261.58 264.57 270.18 276.75 283.33 289.29 292.18 302.12 307.98 312.24 318.83 325.26" y="259.58" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="333.25" y="259.58" font-size="11.00" class="sc-notoserifcjksc">系列模型已观察到的斜率变化之外又出现</text><text x="108.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">了新的斜率变化（见第</text><text x="220.89" y="275.20" font-size="11.00" class="sc-loraregular">2.3.5</text><text x="247.23" y="275.20" font-size="11.00" class="sc-notoserifcjksc">节）。第二，我们对</text><text x="349.12" y="275.20" font-size="11.00" class="sc-loraregular">AI</text><text x="362.58" y="275.20" font-size="11.00" class="sc-notoserifcjksc">驱动的研究加速的内部衡量指标（在</text><text x="108.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="143.89 149.80 156.55 162.46" y="290.82" font-size="11.00" class="sc-loraregular">2026</text><text x="171.71" y="290.82" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="185.61" y="290.82" font-size="11.00" class="sc-loraregular">8</text><text x="194.68" y="290.82" font-size="11.00" class="sc-notoserifcjksc">月风险报告中有所讨论）仅部分公开，这些指标并未显示我们的进展速</text><text x="108.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">度出现持续的、可归因于</text><text x="231.89" y="306.44" font-size="11.00" class="sc-loraregular">AI</text><text x="245.36" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="259.25" y="306.44" font-size="11.00" class="sc-loraregular">2×</text><text x="273.88" y="306.44" font-size="11.00" class="sc-notoserifcjksc">加速，不过其中一些指标已有所变动，我们正在密切监</text><text x="108.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">测。</text><text x="72.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">近期模型在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.60" y="374.07" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="215.85" y="374.07" font-size="11.00" class="sc-notoserifcjksc">系统卡</text><text x="248.85" y="374.07" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">第</text><text x="262.74" y="374.07" font-size="11.00" class="sc-loraregular" fill="#0000ff">8.3</text><text x="280.65" y="374.07" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">节</text><text x="291.65" y="374.07" font-size="11.00" class="sc-notoserifcjksc">所述的许多基于任务的自动化</text><text x="437.54" y="374.07" font-size="11.00" class="sc-loraregular">AI</text><text x="451.01" y="374.07" font-size="11.00" class="sc-notoserifcjksc">研发评估中，已超</text><text x="72.00" y="389.69" font-size="11.00" class="sc-notoserifcjksc">过最高的人类基线，此类任务的结果也已不再是我们</text><text x="327.89" y="389.69" font-size="11.00" class="sc-loraregular">RSP</text><text x="350.60" y="389.69" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="364.49 370.44 378.13" y="389.69" font-size="11.00" class="sc-loraregular">FCF</text><text x="387.05" y="389.69" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定的重要组成部</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">分。因此，我们没有对</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.03 261.74" y="405.31" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="270.63" y="405.31" font-size="11.00" class="sc-notoserifcjksc">运行这些自动化评估。</text><text x="72.00" y="469.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3 Claude Opus 5.5</text><text x="216.83" y="469.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">相对于人类</text><text x="72.00" y="491.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究人员的定性不足</text><text x="72.00" y="519.88" font-size="11.00" class="sc-notoserifcjksc">与以往的一些系统卡一样，我们收集并审视了来自真实内部使用的案例，在这些案例中，</text><text x="501.00 508.69 511.68 517.29 523.86 530.44" y="519.88" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="535.50" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="535.50" font-size="11.00" class="sc-notoserifcjksc">未能达到我们对熟练人类研究人员所期望的表现，或未能充分替代或自动化人类的指</text><text x="72.00" y="551.12" font-size="11.00" class="sc-notoserifcjksc">导。（其中许多问题与行为问题或与对齐相近的问题有关，但它们仍以某种方式限制了我们在内</text><text x="72.00" y="566.74" font-size="11.00" class="sc-notoserifcjksc">部使用该模型实现工作自动化的能力，因此与能力评估相关。）</text><text x="72.00" y="633.22" font-size="11.00" class="sc-notoserifcjksc">我们在本节中不引用缺陷的具体示例；部分示例可见于本系统卡的其他章节。总体而言，我们发</text><text x="72.00" y="648.84" font-size="11.00" class="sc-notoserifcjksc">现，与</text><text x="107.89 114.78 121.36 125.61 132.20 136.89 143.32 149.89 152.98" y="648.84" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.73" y="648.84" font-size="11.00" class="sc-notoserifcjksc">研究人员相比，</text><text x="238.73 246.42 249.41 255.02 261.58 268.16 274.12 277.02 285.75 292.32 298.89 303.98 306.87 312.87 315.57" y="648.84" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="324.46" y="648.84" font-size="11.00" class="sc-notoserifcjksc">仍有许多弱点，这些弱点会使它无法完全取</text><text x="72.00" y="664.46" font-size="11.00" class="sc-notoserifcjksc">代人类研究人员。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="259.85" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="262.74" y="365.27" width="15.02" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="277.76" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="280.65" y="365.27" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00 77.86 80.42 86.58 89.14 95.15 97.71 102.17 105.06 112.63 118.57 125.84 131.75 138.77 144.46 151.29 154.18 160.04 162.60" y="503.91" font-size="11.00" class="sc-lorabold">2.3.4.1 CoBench 2.1</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们观察到的主要问题集中在认知质量和指令遵循方面。在一项针对我们内部智能体部署中被标</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">记行为的早期且噪声较大的分析中，与以往模型相比，</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 383.03 389.59 396.16 401.25 404.14 410.14 412.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="421.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">夸大工作范围以及从结</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果中删去已知限定条件的情况有所增加。随后一项对真实消息的独立盲读发现，</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.03 510.59 517.16 522.25 525.14 531.14 533.85" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">删去限定条件的频率并不高于以往模型。与以往模型类似，被标记行为中最主要的子类别是将未</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">经验证的推断断言为既定事实。第二常见的子类别是忽视自身的疑虑或放弃自己陈述过的计划，</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">其频率相对于以往模型也有所上升。内部使用中的例子包括：将部分检查描述为完整阅读，以及</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">在未加核实的情况下将一个初步的解读变成一项建议。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们还看到了策略性错误。在内部使用中，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.14 357.85" y="260.72" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="366.73" y="260.72" font-size="11.00" class="sc-notoserifcjksc">曾狭隘地处理评审反馈，而没有重</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">新考虑整体设计是否正确；还曾对照它自己编写的需求来检查一项计划，而不是对照该计划旨在</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">服务的人。与以往模型一样，它在开放式研究方面较弱：内部用户报告称，它大多测试渐进式的</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">想法，并偏好不那么大胆的假设；在我们由人类主导的生物学演练中，它遵从已发表的文献，难</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">以提出新颖的想法（第</text><text x="184.89" y="323.20" font-size="11.00" class="sc-loraregular">2.2.2</text><text x="210.92" y="323.20" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">一些在以往模型中更为突出的问题有所减少。</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 339.03 345.59 352.16 357.25 360.14 366.14 368.85" y="390.26" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="377.73" y="390.26" font-size="11.00" class="sc-notoserifcjksc">的破坏性低于此前发布的任何模</text><text x="72.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">型；与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="405.88" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85" y="405.88" font-size="11.00" class="sc-notoserifcjksc">相比，这一下降很大程度上源于</text><text x="359.74 367.43 370.42 376.03 382.60 389.17 395.14 398.03 406.76 413.33 419.90 424.99 427.88 433.88 436.58" y="405.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="445.47" y="405.88" font-size="11.00" class="sc-notoserifcjksc">更有可能在采取潜</text><text x="72.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">在破坏性操作之前先询问用户。</text><text x="72.00" y="471.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4 AI</text><text x="121.71" y="471.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部衡量指标</text><text x="72.00" y="535.84" font-size="11.00" class="sc-notoserifcjksc">正如我们的</text><text x="129.89 135.80 142.55 148.46" y="535.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="157.71" y="535.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="171.60" y="535.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="180.68" y="535.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="235.68" y="535.84" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="249.57" y="535.84" font-size="11.00" class="sc-loraregular">3.4</text><text x="267.26" y="535.84" font-size="11.00" class="sc-notoserifcjksc">节所述，我们开发了一项内部评估</text><text x="435.15 442.84 449.01 455.86 461.82 468.49 474.35" y="535.84" font-size="11.00" class="sc-loraregular">CoBench</text><text x="480.94" y="535.84" font-size="11.00" class="sc-notoserifcjksc">，旨在衡量</text><text x="72.00" y="551.46" font-size="11.00" class="sc-notoserifcjksc">模型在真实内部研发任务上的进展。该评估衡量的是：当模型被置于</text><text x="404.89 411.78 418.36 422.61 429.20 433.89 440.32 446.89 449.98" y="551.46" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="458.73" y="551.46" font-size="11.00" class="sc-notoserifcjksc">基础设施的某个</text><text x="72.00" y="567.08" font-size="11.00" class="sc-notoserifcjksc">历史时间点（即获得我们的代码库、日志、内部消息和文档在过去某一时间戳的快照）时，它能</text><text x="72.00" y="582.70" font-size="11.00" class="sc-notoserifcjksc">在多大程度上诊断出</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="582.70" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73" y="582.70" font-size="11.00" class="sc-notoserifcjksc">工程师实际解决过的问题的根本原因。各问题由模型评分，所用</text><text x="72.00" y="598.32" font-size="11.00" class="sc-notoserifcjksc">评分细则将解决方案与我们在实践中确定的根本原因进行比较，而该根本原因在被评估模型可获</text><text x="72.00" y="613.94" font-size="11.00" class="sc-notoserifcjksc">得的历史快照中是不可见的。关于这项评估的更多细节见我们的风险报告。</text><text x="72.00" y="681.56" font-size="11.00" class="sc-notoserifcjksc">本系统卡中使用的评估版本称为</text><text x="228.89 236.58 242.75 249.59 255.56 262.23 268.09 274.67 277.57 283.48 286.18" y="681.56" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="290.18" y="681.56" font-size="11.00" class="sc-notoserifcjksc">，它在</text><text x="326.08" y="681.56" font-size="11.00" class="sc-loraregular">500</text><text x="348.63" y="681.56" font-size="11.00" class="sc-notoserifcjksc">个问题上对每个模型各运行一次。自</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="697.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="155.40" y="697.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="169.29 176.98 179.98 185.59 192.15 198.73 204.69 207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65 254.64 257.35" y="697.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="264.25" y="697.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="297.25" y="697.18" font-size="11.00" class="sc-notoserifcjksc">以来，评估环境已发生重大变化；在权重未作任何</text><text x="72.00" y="712.80" font-size="11.00" class="sc-notoserifcjksc">改变的情况下，同样的模型在</text><text x="217.89 225.58 231.75 238.59 244.56 251.23 257.09 263.67 266.57 272.48 275.18" y="712.80" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="282.08" y="712.80" font-size="11.00" class="sc-notoserifcjksc">上的得分</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="129.89" y="527.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="129.89" y="527.04" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5 AECI</text><text x="138.39" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="109.04" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 179.57 187.26" y="109.04" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="190.94" y="109.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="109.04" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="109.04" font-size="11.00" class="sc-notoserifcjksc">）追踪我们模型的能力随时间提升的速度，它是</text><text x="460.94 467.70 474.27 480.70 486.56 493.15 496.04 502.92" y="109.04" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="509.50" y="109.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 78.76 85.33 91.77 97.62 104.21 107.10 114.79 120.47 127.03 132.71 139.11 142.20 145.19 148.46 152.72 155.81 161.77 166.86 169.76 173.35 180.03 186.61 192.52" y="124.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Epoch Capabilities Index</text><text x="201.24" y="124.66" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本。有关我们方法的详细信息，请参阅</text><text x="457.13 464.82 467.81 473.42 479.99 486.57" y="124.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="495.42 505.36 511.22 515.48 522.07 528.50" y="124.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="140.28" font-size="11.00" class="sc-loraregular" fill="#0000ff">Preview</text><text x="115.53" y="140.28" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="148.53" y="140.28" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="162.42 168.33 171.03 177.16 179.76" y="140.28" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="189.01" y="140.28" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00" y="173.80" font-size="11.00" class="sc-lorabold">2.3.5.1 AECI</text><text x="133.94" y="173.80" font-size="11.00" class="sc-notoserifcjkscbold">基准组合更新</text><text x="72.00" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在对</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="206.19" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="182.63" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的评估中，我们更新了构成</text><text x="317.52" y="206.19" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AECI</text><text x="345.52" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的基准组合，并基于更新后的数据重新</text><text x="72.00" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">拟合了该指数。</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 192.88 198.55 204.96 207.95 213.91 216.80 222.80 225.51" y="221.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="232.40" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="246.30 253.98 256.98 262.59 269.15 275.73 281.69 284.59 294.52 300.38 304.64 311.23 317.66 322.76 325.65 331.64 334.35" y="221.81" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="341.25" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="374.25" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">中使用的拟合涵盖了</text><text x="476.14" y="221.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">525</text><text x="496.93" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个模型</text><text x="72.00" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（内部和外部）上的</text><text x="173.89" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">338</text><text x="195.22" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试和</text><text x="264.11 270.11 272.88 279.06 285.06" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">5,853</text><text x="294.09" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个观测值。本系统卡中使用的拟合涵盖</text><text x="483.98" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">732</text><text x="503.98" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个模型</text><text x="72.00" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的</text><text x="96.89 102.76 107.67" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">374</text><text x="116.53" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试和</text><text x="185.42 190.01 192.78 199.14 205.32" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7,985</text><text x="214.22" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个观测值。此次更新包括：重新导入截至</text><text x="415.11 421.02 427.77 433.68" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">2026</text><text x="442.93" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">年</text><text x="456.82" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">9</text><text x="466.08" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">月</text><text x="479.97" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">16</text><text x="493.22" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">日的</text><text x="72.00 78.76 85.33 91.77 97.62 104.21 107.10 113.99" y="268.67" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Epoch AI</text><text x="120.57" y="268.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">公开基准测试数据；若干新的高难度内部评估；在已发布模型上新运行的中等难度基准</text><text x="72.00" y="284.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">测试，以及在两个较早模型上新运行的以高难度为主的评估；以及对若干错误的基准测试、运行</text><text x="72.00" y="299.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和结果的修正。我们做出这些更改是为了改善量表顶部和中部的覆盖范围，并纠正输入中的已知</text><text x="72.00" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">错误。在这一更新后的新基准组合上，</text><text x="259.00" y="315.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 5.5</text><text x="306.44" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="320.34" y="315.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">43</text><text x="335.32" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试上获得评分。</text><text x="72.00" y="400.49" font-size="11.00" class="sc-notoserifcjksc">由于每次重新拟合都会重新估计整个量表，此次拟合得到的</text><text x="360.89" y="400.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="388.89" y="400.49" font-size="11.00" class="sc-notoserifcjksc">值与早期系统卡中的</text><text x="490.78" y="400.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="518.78" y="400.49" font-size="11.00" class="sc-notoserifcjksc">值不</text><text x="72.00" y="416.11" font-size="11.00" class="sc-notoserifcjksc">可比。相对于先前的拟合，我们近期前沿模型（从</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25 402.91 407.60 413.51 419.06 422.15 428.07" y="416.11" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="439.77" y="416.11" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="453.67 463.60 469.46 473.72 480.31 486.74 491.84 494.73 500.72 503.43" y="416.11" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="507.44" y="416.11" font-size="11.00" class="sc-notoserifcjksc">）的值</text><text x="72.00" y="431.73" font-size="11.00" class="sc-notoserifcjksc">上升了</text><text x="107.89" y="431.73" font-size="11.00" class="sc-loraregular">4.1</text><text x="123.46" y="431.73" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="137.35" y="431.73" font-size="11.00" class="sc-loraregular">6.1</text><text x="153.31" y="431.73" font-size="11.00" class="sc-notoserifcjksc">分；较早的</text><text x="211.21 218.89 221.89 227.50 234.06 240.64" y="431.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="249.50" y="431.73" font-size="11.00" class="sc-notoserifcjksc">模型变动较小，而最弱的较早模型则有所下降。例如，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="447.35" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="447.35" font-size="11.00" class="sc-notoserifcjksc">在其系统卡中得分</text><text x="219.55 223.56 229.92 235.82 238.36" y="447.35" font-size="11.00" class="sc-loraregular">162.0</text><text x="245.20" y="447.35" font-size="11.00" class="sc-notoserifcjksc">，在更新后的拟合中得分</text><text x="369.09" y="447.35" font-size="11.00" class="sc-loraregular">168.12</text><text x="398.25" y="447.35" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="409.25 416.94 419.93 425.54 432.11 438.68 444.65 447.54 456.27 462.84 469.41 474.50 477.39" y="447.35" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="486.28" y="447.35" font-size="11.00" class="sc-notoserifcjksc">则从</text><text x="511.18 515.18 521.54 528.19 530.55" y="447.35" font-size="11.00" class="sc-loraregular">160.7</text><text x="72.00" y="462.97" font-size="11.00" class="sc-notoserifcjksc">变为</text><text x="96.89" y="462.97" font-size="11.00" class="sc-loraregular">165.18</text><text x="126.14" y="462.97" font-size="11.00" class="sc-notoserifcjksc">。因此，模型之间的比较应在同一拟合内进行（如图</text><text x="382.04" y="462.97" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="426.79" y="462.97" font-size="11.00" class="sc-notoserifcjksc">所示），而不应跨不同</text><text x="72.00" y="478.59" font-size="11.00" class="sc-notoserifcjksc">的系统卡进行。</text><text x="72.00" y="546.22" font-size="11.00" class="sc-lorabold">2.3.5.2</text><text x="106.41" y="546.22" font-size="11.00" class="sc-notoserifcjkscbold">关于</text><text x="131.30" y="546.22" font-size="11.00" class="sc-lorabold">AECI</text><text x="160.23" y="546.22" font-size="11.00" class="sc-notoserifcjkscbold">误差线的讨论</text><text x="72.00" y="578.60" font-size="11.00" class="sc-notoserifcjksc">在本系统卡中，我们还更新了报告</text><text x="239.89" y="578.60" font-size="11.00" class="sc-loraregular">AECI</text><text x="267.89" y="578.60" font-size="11.00" class="sc-notoserifcjksc">点误差线的方法。与以往的系统卡类似，我们通过自助</text><text x="72.00" y="594.22" font-size="11.00" class="sc-notoserifcjksc">法重拟合（</text><text x="201.63" y="594.22" font-size="11.00" class="sc-notoserifcjksc">）来估计误差。每次重拟合随机剔除</text><text x="380.53" y="594.22" font-size="11.00" class="sc-loraregular">20%</text><text x="405.73" y="594.22" font-size="11.00" class="sc-notoserifcjksc">的基准测试，重新拟合整个</text><text x="72.00" y="609.84" font-size="11.00" class="sc-notoserifcjksc">指数，并重新固定量表的两个锚点。每根误差线表示这些重拟合结果的</text><text x="415.89" y="609.84" font-size="11.00" class="sc-loraregular">95%</text><text x="440.71" y="609.84" font-size="11.00" class="sc-notoserifcjksc">范围。然而，我们注</text><text x="72.00" y="625.46" font-size="11.00" class="sc-notoserifcjksc">意到，在</text><text x="118.89" y="625.46" font-size="11.00" class="sc-loraregular">AECI</text><text x="146.89" y="625.46" font-size="11.00" class="sc-notoserifcjksc">量表上彼此接近的模型在自助法重采样中会一同移动，因而它们在各次重采样之</text><text x="72.00" y="641.08" font-size="11.00" class="sc-notoserifcjksc">间的偏移是相关的。此外，由于基准测试的覆盖范围沿</text><text x="338.89" y="641.08" font-size="11.00" class="sc-loraregular">AECI</text><text x="366.89" y="641.08" font-size="11.00" class="sc-notoserifcjksc">量表并不均匀，且</text><text x="457.78" y="641.08" font-size="11.00" class="sc-loraregular">AECI</text><text x="485.78" y="641.08" font-size="11.00" class="sc-notoserifcjksc">量表由两个</text><text x="134.61 142.30 145.29 150.90 157.47 164.05 170.01 172.90 179.14 185.57 192.25 198.93 204.81 209.07 211.96 218.09 220.80" y="656.70" font-size="11.00" class="sc-loraregular">Claude Sonnet 3.5</text><text x="229.68" y="656.70" font-size="11.00" class="sc-notoserifcjksc">位于</text><text x="254.58" y="656.70" font-size="11.00" class="sc-loraregular">130</text><text x="271.54" y="656.70" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="282.54 290.91 297.58 303.91 309.29" y="656.70" font-size="11.00" class="sc-loraregular">GPT-5</text><text x="318.18" y="656.70" font-size="11.00" class="sc-notoserifcjksc">位于</text><text x="343.07" y="656.70" font-size="11.00" class="sc-loraregular">150</text><text x="72.00" y="672.32" font-size="11.00" class="sc-notoserifcjksc">重拟合之间比远离锚点的得分（例如位于</text><text x="272.89" y="672.32" font-size="11.00" class="sc-loraregular">AECI</text><text x="300.89" y="672.32" font-size="11.00" class="sc-notoserifcjksc">量表前沿一端的得分）更稳定。在</text><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="523.40" y="100.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="72.00" y="115.86" width="32.21" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="104.21" y="115.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="107.10" y="115.86" width="59.76" height  428.57 434.92" y="571.69" font-size="11.00" class="sc-loraregular">167.99</text><text x="476.25 480.25 485.32 489.32 492.02 497.68" y="571.69" font-size="11.00" class="sc-loraregular">171.24</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">39</text><text x="76.75" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="277.00" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间下</text><text x="277.00" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（全局）</text><text x="348.25" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间上</text><text x="348.25" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（全局）</text><text x="413.50" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间下</text><text x="413.50" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（局部）</text><text x="478.75" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间上</text><text x="478.75" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（局部）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">本系统卡中，我们报告两种置信区间（</text><text x="357.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）：一种是</text><text x="412.47" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">全局误差线</text><text x="467.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，反映我们对</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">AECI</text><text x="99.99" y="98.23" font-size="11.00" class="sc-notoserifcjksc">量表上绝对位置的不确定性（与以往系统卡相同）；另一种是</text><text x="396.99" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">局部误差线</text><text x="451.99" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，反映我们对相对</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">于邻近模型的相对位置的不确定性。两者均基于</text><text x="305.89" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="326.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次自助法重拟合计算得出。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">近期前沿模型的全局误差线约为</text><text x="228.89" y="163.57" font-size="11.00" class="sc-loraregular">8</text><text x="237.97" y="163.57" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="251.86" y="163.57" font-size="11.00" class="sc-loraregular">12</text><text x="264.67" y="163.57" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="278.56" y="163.57" font-size="11.00" class="sc-loraregular">AECI</text><text x="306.55" y="163.57" font-size="11.00" class="sc-notoserifcjksc">点，并且随着与最接近前沿的锚点（</text><text x="482.55 490.92 497.59 503.93 509.31" y="163.57" font-size="11.00" class="sc-loraregular">GPT-5</text><text x="515.30" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，位</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="179.19" font-size="11.00" class="sc-loraregular">150 AECI</text><text x="130.72" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）距离的增加而变宽。当基准测试池发生变化时，前沿模型会一同移动（它们的自助</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">法抽样结果相关性为</text><text x="173.89 178.66 181.55 187.38 190.27 196.93 199.63 205.73" y="194.81" font-size="11.00" class="sc-loraregular">r = 0.97</text><text x="213.69" y="194.81" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="227.58 231.59 234.13 240.96" y="194.81" font-size="11.00" class="sc-loraregular">1.00</text><text x="247.79" y="194.81" font-size="11.00" class="sc-notoserifcjksc">），而它们的移动在很大程度上取决于在一次重拟合中剔除</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">了哪些难度在</text><text x="140.89" y="210.43" font-size="11.00" class="sc-loraregular">140</text><text x="160.58" y="210.43" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="174.48" y="210.43" font-size="11.00" class="sc-loraregular">160</text><text x="194.56" y="210.43" font-size="11.00" class="sc-notoserifcjksc">之间的广泛基准测试。这一误差的宽度几乎全部为其他前沿模型所共</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">有，并随着高于上锚点的距离增加而增长；它在很大程度上并非源于对某个特定模型的评估覆盖</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">范围。对于</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="241.67" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73" y="241.67" font-size="11.00" class="sc-notoserifcjksc">，全局误差线为</text><text x="292.63 296.33 300.34 306.70 312.69 315.40 321.14 327.27 330.04 332.93 336.93 342.01 346.59 349.13 355.96 361.96" y="241.67" font-size="11.00" class="sc-loraregular">[165.23, 177.05]</text><text x="365.92" y="241.67" font-size="11.00" class="sc-notoserifcjksc">。在比较量表上相距较远的模型，</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">以及评估</text><text x="118.89" y="257.29" font-size="11.00" class="sc-loraregular">AECI</text><text x="146.89" y="257.29" font-size="11.00" class="sc-notoserifcjksc">趋势的斜率变化时，我们使用全局误差线。</text><text x="72.00" y="325.27" font-size="11.00" class="sc-notoserifcjksc">局部误差线是该发布版本与在其之前最近的三个</text><text x="303.00" y="321.60" font-size="6.60" class="sc-loraregular">1</text><text x="305.40" y="325.27" font-size="11.00" class="sc-notoserifcjksc">公开</text><text x="330.30 337.98 340.98 346.59 353.15 359.73" y="325.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="368.59" y="325.27" font-size="11.00" class="sc-notoserifcjksc">发布版本平均值之差的</text><text x="481.48" y="325.27" font-size="11.00" class="sc-loraregular">95%</text><text x="506.30" y="325.27" font-size="11.00" class="sc-notoserifcjksc">范围。</text><text x="72.00" y="340.89" font-size="11.00" class="sc-notoserifcjksc">它们有助于了解一个模型相对于其同类的表现。由于前沿模型在各次重拟合中会一同移动，这些</text><text x="72.00" y="356.51" font-size="11.00" class="sc-notoserifcjksc">差距要小得多，约为</text><text x="173.89" y="356.51" font-size="11.00" class="sc-loraregular">2</text><text x="182.69" y="356.51" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="196.59" y="356.51" font-size="11.00" class="sc-loraregular">5</text><text x="205.47" y="356.51" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="219.37" y="356.51" font-size="11.00" class="sc-loraregular">AECI</text><text x="247.36" y="356.51" font-size="11.00" class="sc-notoserifcjksc">点。表</text><text x="283.26" y="356.51" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="328.01" y="356.51" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="352.91" y="356.51" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="397.67" y="356.51" font-size="11.00" class="sc-notoserifcjksc">报告了每个模型的两种置信区</text><text x="72.00" y="372.13" font-size="11.00" class="sc-notoserifcjksc">间。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-lorabold">2.3.5.3 AECI</text><text x="135.64" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">数值与趋势</text><text x="72.00" y="587.87" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="587.87" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 112.87 114.97 120.50 123.98 126.34 131.86 137.27 142.36 147.02 152.61 154.98 161.17 165.89 171.30 176.01 181.17 184.11 186.92 189.83 193.55 196.49 201.33 205.70 208.06 211.45 217.19 222.55 227.39" y="587.87" font-size="9.00" class="sc-lorabold">2.3.5.3.A] Epoch Capabilities Index</text><text x="234.69" y="587.87" font-size="9.00" class="sc-notoserifcjkscbold">数值，更新后的拟合。</text><text x="324.69" y="587.87" font-size="9.00" class="sc-notoserifcjksc">近期</text><text x="345.06 351.35 353.80 358.39 363.76 369.14" y="587.87" font-size="9.00" class="sc-loraregular">Claude</text><text x="376.39" y="587.87" font-size="9.00" class="sc-notoserifcjksc">模型的</text><text x="405.76 411.39 416.77 420.26 425.65 429.48 434.75 440.12 442.65 447.44 449.80 455.40 461.69" y="587.87" font-size="9.00" class="sc-loraregular">Anthropic ECI</text><text x="464.71" y="587.87" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="473.71" y="587.87" font-size="9.00" class="sc-loraregular">AECI</text><text x="494.24" y="587.87" font-size="9.00" class="sc-notoserifcjksc">）得分及</text><text x="72.00" y="599.57" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="599.57" font-size="9.00" class="sc-notoserifcjksc">不确定性范围。得分来自能力指数拟合的</text><text x="256.67" y="599.57" font-size="9.00" class="sc-loraregular">9</text><text x="264.24" y="599.57" font-size="9.00" class="sc-notoserifcjksc">月</text><text x="275.61" y="599.57" font-size="9.00" class="sc-loraregular">18</text><text x="286.31" y="599.57" font-size="9.00" class="sc-notoserifcjksc">日更新。</text><text x="322.31 328.60 331.05 335.64 341.01 346.39 351.27 353.64 360.78 366.16 371.53 375.70 378.06" y="599.57" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="382.97" y="599.57" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="391.97 398.26 400.71 405.30 410.67 416.05 420.93 423.30 431.42 436.22 439.70 445.10 450.36 454.53 456.89 461.80 464.01" y="599.57" font-size="9.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="469.66" y="599.57" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="481.02 487.31 489.76 494.35 499.73 505.11 509.99 512.35 519.50 524.87 530.24" y="599.57" font-size="9.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="611.27" font-size="9.00" class="sc-loraregular">5.5</text><text x="86.39" y="611.27" font-size="9.00" class="sc-notoserifcjksc">是在自适应思考（</text><text x="158.39 163.04 168.42 173.06 178.43 181.92 184.45 188.95 193.82 196.19 199.67 205.07 207.59 213.06 217.89 220.42 225.88" y="611.27" font-size="9.00" class="sc-loraregular">adaptive thinking</text><text x="230.86" y="611.27" font-size="9.00" class="sc-notoserifcjksc">）及</text><text x="251.23" y="611.27" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="269.80" y="611.27" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="314.80 319.67 322.81 325.80 331.07 335.03" y="611.27" font-size="9.00" class="sc-loraregular">effort</text><text x="338.51" y="611.27" font-size="9.00" class="sc-notoserifcjksc">）下测量的；更早的模型则在其表现最佳的配置下</text><text x="72.00" y="622.97" font-size="9.00" class="sc-notoserifcjksc">测量。全局置信区间是该拟合对得分给出的</text><text x="245.37" y="622.97" font-size="9.00" class="sc-loraregular">95%</text><text x="265.67" y="622.97" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。在每次自助法抽样中，剔除</text><text x="448.04" y="622.97" font-size="9.00" class="sc-loraregular">20%</text><text x="468.66" y="622.97" font-size="9.00" class="sc-notoserifcjksc">的基准测试，重新</text><text x="72.00" y="634.67" font-size="9.00" class="sc-notoserifcjksc">拟合指数，并重新固定量表的两个校准锚点。局部置信区间是在相同的自助法抽样上，模型与在其之前的三个公开</text><text x="72.00 78.29 80.74 85.33 90.70 96.08" y="646.37" font-size="9.00" class="sc-loraregular">Claude</text><text x="103.33" y="646.37" font-size="9.00" class="sc-notoserifcjksc">发布版本平均得分之差的</text><text x="204.70" y="646.37" font-size="9.00" class="sc-loraregular">95%</text><text x="225.00" y="646.37" font-size="9.00" class="sc-notoserifcjksc">范围，并以该模型的得分为中心重新定位；它显示了该拟合将该模型与其直接前</text><text x="72.00" y="658.07" font-size="9.00" class="sc-notoserifcjksc">代区分开来的精确程度。</text><text x="72.00" y="713.27" font-size="6.00" class="sc-loraregular">1</text><text x="76.81" y="716.60" font-size="10.00" class="sc-notoserifcjksc">选择之前的三个模型是一种惯例，并非由统计因素决定。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p040.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 40 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">40</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 112.87 114.97 120.50 123.98 126.34 131.86 137.27 142.36 147.02 152.61 154.98 161.17 165.89 171.30 176.01 181.17 184.11 186.92 189.83 193.55 196.49 201.33 205.70 208.06 211.45 217.19 222.55 227.39" y="390.43" font-size="9.00" class="sc-lorabold">2.3.5.3.B] Epoch Capabilities Index</text><text x="232.33" y="390.43" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="241.33" y="390.43" font-size="9.00" class="sc-loraregular">ECI</text><text x="256.23" y="390.43" font-size="9.00" class="sc-notoserifcjksc">）将多项基准测试上的表现综合为每个模型的一个数值。我们自己的这</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">一指标版本，即</text><text x="137.37 143.00 148.38 151.87 157.26 161.09 166.36 171.73 174.26 179.05 181.41 187.01 193.30" y="402.13" font-size="9.00" class="sc-loraregular">Anthropic ECI</text><text x="196.32" y="402.13" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="205.32" y="402.13" font-size="9.00" class="sc-loraregular">AECI</text><text x="225.85" y="402.13" font-size="9.00" class="sc-notoserifcjksc">），由内部基准测试结果驱动，因此其得分与</text><text x="408.22 413.76 419.13 424.39 429.18" y="402.13" font-size="9.00" class="sc-loraregular">Epoch</text><text x="436.94" y="402.13" font-size="9.00" class="sc-notoserifcjksc">的公开</text><text x="466.31" y="402.13" font-size="9.00" class="sc-loraregular">ECI</text><text x="483.58" y="402.13" font-size="9.00" class="sc-notoserifcjksc">排行榜不可直</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">接比较。灰色圆点为以往的前沿</text><text x="200.37 206.66 209.11 213.70 219.07 224.45" y="413.83" font-size="9.00" class="sc-loraregular">Claude</text><text x="231.70" y="413.83" font-size="9.00" class="sc-notoserifcjksc">模型；彩色圆点为最新的模型。细黑色误差线为</text><text x="423.06" y="413.83" font-size="9.00" class="sc-loraregular">100</text><text x="439.88" y="413.83" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="451.25" y="413.83" font-size="9.00" class="sc-loraregular">IRT</text><text x="468.05" y="413.83" font-size="9.00" class="sc-notoserifcjksc">重拟合的</text><text x="506.41" y="413.83" font-size="9.00" class="sc-loraregular">95%</text><text x="526.72" y="413.83" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="425.53" font-size="9.00" class="sc-notoserifcjksc">信区间，每次重拟合均基于随机抽取的</text><text x="227.37" y="425.53" font-size="9.00" class="sc-loraregular">80%</text><text x="248.21" y="425.53" font-size="9.00" class="sc-notoserifcjksc">基准测试子样本（全局误差）。粗紫色误差线来自相同的重采样拟合，但</text><text x="72.00" y="437.23" font-size="9.00" class="sc-notoserifcjksc">衡量的是每个得分相对于各模型之前三个发布版本的变动（局部误差）。两条线比较了关于前沿趋势的不同假设：实线</text><text x="72.00" y="448.93" font-size="9.00" class="sc-notoserifcjksc">沿用拟合至</text><text x="119.37 125.66 128.11 132.70 138.07 143.45 148.33 150.70 157.84 163.21 168.59 172.76 175.12 180.00 182.12" y="448.93" font-size="9.00" class="sc-loraregular">Claude Opus 4.6</text><text x="189.69" y="448.93" font-size="9.00" class="sc-notoserifcjksc">的趋势（</text><text x="225.69 228.97 233.85 235.77 239.92 242.29 247.92 253.52 259.81 262.61" y="448.93" font-size="9.00" class="sc-loraregular">14.7 AECI/</text><text x="268.82" y="448.93" font-size="9.00" class="sc-notoserifcjksc">年），并在</text><text x="316.19 322.48 324.93 329.52 334.89 340.27 345.15 347.52 355.64 360.44 363.92 369.32 374.58 378.75 381.11 386.57 390.40 395.24 399.78 402.31 407.15" y="448.93" font-size="9.00" class="sc-loraregular">Claude Mythos Preview</text><text x="416.73" y="448.93" font-size="9.00" class="sc-notoserifcjksc">处出现</text><text x="446.09" y="448.93" font-size="9.00" class="sc-loraregular">+5.9</text><text x="465.55" y="448.93" font-size="9.00" class="sc-notoserifcjksc">的一次性跃升；虚</text><text x="72.00" y="460.63" font-size="9.00" class="sc-notoserifcjksc">线则在拟合得到的断点（</text><text x="171.00 175.83 181.36 186.19" y="460.63" font-size="9.00" class="sc-loraregular">2025</text><text x="193.46" y="460.63" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="204.83" y="460.63" font-size="9.00" class="sc-loraregular">9</text><text x="212.40" y="460.63" font-size="9.00" class="sc-notoserifcjksc">月）处发生斜率变化（</text><text x="302.40" y="460.63" font-size="9.00" class="sc-loraregular">14.4</text><text x="320.01" y="460.63" font-size="9.00" class="sc-notoserifcjksc">→</text><text x="331.38 336.21 341.05 343.26 348.09 350.46 356.09 361.69 367.98 370.78" y="460.63" font-size="9.00" class="sc-loraregular">22.2 AECI/</text><text x="376.99" y="460.63" font-size="9.00" class="sc-notoserifcjksc">年）。在</text><text x="415.36" y="460.63" font-size="9.00" class="sc-loraregular">100</text><text x="432.18" y="460.63" font-size="9.00" class="sc-notoserifcjksc">次重采样拟合中，有</text><text x="515.55" y="460.63" font-size="9.00" class="sc-loraregular">99</text><text x="528.32" y="460.63" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="472.33" font-size="9.00" class="sc-notoserifcjksc">一次性跃升模型对数据的拟合更好。</text><text x="216.00 222.29 224.74 229.33 234.70 240.08 244.96 247.33 254.48 259.85 265.22 269.39 271.76 276.66 278.87" y="472.33" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="286.15" y="472.33" font-size="9.00" class="sc-notoserifcjksc">在新的重拟合上获得</text><text x="369.51 372.79 377.99 383.05 385.26 390.28 395.48 397.85 403.48 409.08 415.37" y="472.33" font-size="9.00" class="sc-loraregular">169.36 AECI</text><text x="420.75" y="472.33" font-size="9.00" class="sc-notoserifcjksc">的得分。</text><text x="456.75 463.04 465.49 470.08 475.45 480.83 485.71 488.08 493.18 498.45 503.91 509.37 514.19" y="472.33" font-size="9.00" class="sc-loraregular">Claude Sonnet</text><text x="72.00" y="484.03" font-size="9.00" class="sc-loraregular">3.5</text><text x="84.13" y="484.03" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="93.13 97.96 103.49 108.13" y="484.03" font-size="9.00" class="sc-loraregular">2024</text><text x="115.37" y="484.03" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="126.74" y="484.03" font-size="9.00" class="sc-loraregular">6</text><text x="134.31" y="484.03" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="163.67" y="484.03" font-size="9.00" class="sc-loraregular">ECI</text><text x="180.94" y="484.03" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="228.31" y="484.03" font-size="9.00" class="sc-loraregular">130</text><text x="242.19" y="484.03" font-size="9.00" class="sc-notoserifcjksc">，因此它没有全局置信区间（其局部误差线反映的是其之前模型的不确定</text><text x="72.00" y="495.73" font-size="9.00" class="sc-notoserifcjksc">性）。报告近期模型在新量表上的得分，以便直接比较。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="575.21" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="575.21" font-size="11.00" class="sc-notoserifcjksc">的得分比历史趋势线高约</text><text x="281.63" y="575.21" font-size="11.00" class="sc-loraregular">6.5</text><text x="299.58" y="575.21" font-size="11.00" class="sc-notoserifcjksc">分，并且与始于</text><text x="379.47 387.16 390.15 395.76 402.33 408.91 414.87 417.76 427.70 433.56 437.82 444.40 450.84 455.93 458.83 465.49 470.18 476.08 481.64 484.73 490.65" y="575.21" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="502.35" y="575.21" font-size="11.00" class="sc-notoserifcjksc">的平移</text><text x="72.00" y="590.83" font-size="11.00" class="sc-notoserifcjksc">趋势线相差在一分以内。</text><text x="193.00" y="590.83" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="240.44" y="590.83" fon
