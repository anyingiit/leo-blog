<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第二种假设中，斜率在一个拟合得到的断点处发生变化。一次性跃升假设得出</text><text x="448.89 458.83 464.69 468.95 475.54 481.97 487.06 489.96 496.62 501.31 507.21 512.77 515.86 521.78" y="82.61" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">处</text><text x="85.89" y="98.23" font-size="11.00" class="sc-loraregular">+5.9 AECI</text><text x="137.67" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的偏移；趋势断裂假设得出斜率从每年</text><text x="327.56" y="98.23" font-size="11.00" class="sc-loraregular">14.4</text><text x="349.09" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点变为每年</text><text x="406.98" y="98.23" font-size="11.00" class="sc-loraregular">22.2</text><text x="430.30" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点，拟合断点位于</text><text x="72.00 77.91 84.66 90.57" y="113.85" font-size="11.00" class="sc-loraregular">2025</text><text x="99.46" y="113.85" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.35" y="113.85" font-size="11.00" class="sc-loraregular">9</text><text x="122.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">月，增幅为</text><text x="180.49" y="113.85" font-size="11.00" class="sc-loraregular">1.53x</text><text x="205.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="216.16" y="113.85" font-size="11.00" class="sc-loraregular">95%</text><text x="240.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">范围为</text><text x="276.86" y="113.85" font-size="11.00" class="sc-loraregular">1.20</text><text x="299.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="313.10" y="113.85" font-size="11.00" class="sc-loraregular">1.82</text><text x="331.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。第一种假设对数据的拟合更好，但无论</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">采用哪种解读，斜率都没有翻倍。我们不认为</text><text x="294.89" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="342.34" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在我们已在</text><text x="400.23 410.16 416.03 420.28 426.87 433.31 438.40 441.29 447.96 452.64 458.55 464.11 467.20 473.12" y="129.47" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="484.82" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上观察到的</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">变化之外又带来了进一步的斜率变化。</text><text x="72.00" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6</text><text x="105.42" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="222.19" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89" y="222.19" font-size="11.00" class="sc-loraregular">METR</text><text x="141.67" y="222.19" font-size="11.00" class="sc-notoserifcjksc">合作，对</text><text x="188.57 196.26 199.25 204.86 211.43 218.00 223.97 226.86 235.59 242.16 248.73 253.82 256.71 262.71 265.41" y="222.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="274.30" y="222.19" font-size="11.00" class="sc-notoserifcjksc">的能力进行了部署前测试，重点关注与</text><text x="464.19" y="222.19" font-size="11.00" class="sc-loraregular">AI</text><text x="477.66" y="222.19" font-size="11.00" class="sc-notoserifcjksc">研发自动化</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">相关的能力。他们与我们分享了以下发现：</text><text x="117.75" y="286.96" font-size="11.00" class="sc-notoserifcjksc">我们的初步评估聚焦于</text><text x="230.64 234.59 242.28 245.27 250.88 257.45 264.03 269.99 272.88 281.62 288.18 294.75 299.84 302.74 308.73 311.44 317.43" y="286.96" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="324.28" y="286.96" font-size="11.00" class="sc-notoserifcjksc">可能如何影响</text><text x="393.17" y="286.96" font-size="11.00" class="sc-loraregular">AI</text><text x="406.63" y="286.96" font-size="11.00" class="sc-notoserifcjksc">研发，主要依据是它在困难</text><text x="117.75" y="302.58" font-size="11.00" class="sc-notoserifcjksc">的长程任务上的能力。</text><text x="227.75" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">本报告试图评估的主要论断是：（</text><text x="392.75" y="302.58" font-size="11.00" class="sc-lorabold">A</text><text x="400.10" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="411.10 418.39 425.34 429.89 436.72 441.91 448.13 454.75 458.34" y="302.58" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="466.93" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">的</text><text x="480.83" y="302.58" font-size="11.00" class="sc-lorabold">AI</text><text x="495.33" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">研发现在</text><text x="117.75" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">是否会因使用</text><text x="186.64" y="318.20" font-size="11.00" class="sc-lorabold">[Claude Opus 5.5]</text><text x="281.50" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">而被剧烈加速；以及（</text><text x="391.50" y="318.20" font-size="11.00" class="sc-lorabold">B</text><text x="398.77" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">）在</text><text x="423.66" y="318.20" font-size="11.00" class="sc-lorabold">[Claude Opus 5.5]</text><text x="518.51" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">的开</text><text x="117.75" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">发过程中，</text><text x="172.75 180.04 186.99 191.54 198.37 203.56 209.79 216.40 219.99" y="333.82" font-size="11.00" class="sc-lorabold">Anthropic</text><text x="228.59" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">的</text><text x="242.48" y="333.82" font-size="11.00" class="sc-lorabold">AI</text><text x="256.98" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">研发是否已经因</text><text x="336.87" y="333.82" font-size="11.00" class="sc-lorabold">AI</text><text x="351.37" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">而被剧烈加速。</text><text x="428.37" y="333.82" font-size="11.00" class="sc-notoserifcjksc">请注意，我们的工作旨</text><text x="117.75" y="349.44" font-size="11.00" class="sc-notoserifcjksc">在收集与</text><text x="164.64" y="349.44" font-size="11.00" class="sc-loraregular">AI</text><text x="178.11" y="349.44" font-size="11.00" class="sc-notoserifcjksc">研发能力相关的证据，而非用于核实有关是否符合</text><text x="423.00 429.89 436.46 440.72 447.31 452.00 458.43 465.00 468.09" y="349.44" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="476.83" y="349.44" font-size="11.00" class="sc-notoserifcjksc">政策中任何</text><text x="117.75" y="365.06" font-size="11.00" class="sc-notoserifcjksc">特定阈值的论断。本报告摘要也不试图评估</text><text x="329.64 333.59 341.28 344.27 349.88 356.45 363.03 368.99 371.88 380.62 387.18 393.75 398.84 401.74 407.73 410.44 416.43" y="365.06" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="423.28" y="365.06" font-size="11.00" class="sc-notoserifcjksc">是否具有特定的对齐属</text><text x="117.75" y="380.68" font-size="11.00" class="sc-notoserifcjksc">性。</text><text x="117.75" y="481.07" font-size="11.00" class="sc-notoserifcjkscbold">证据摘要</text><text x="169.87" y="501.26" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="205.76 209.71 217.40 220.39 226.00 232.57 239.15 245.11 248.00 256.73 263.30 269.87 274.96 277.85 283.85 286.56 292.55" y="501.26" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="299.39" y="501.26" font-size="11.00" class="sc-notoserifcjksc">进行了初步评估，依据如下：</text><text x="144.75" y="517.45" font-size="11.00" class="sc-notoserifcjksc">能力测试，通过为期</text><text x="246.64" y="517.45" font-size="11.00" class="sc-loraregular">10</text><text x="260.37" y="517.45" font-size="11.00" class="sc-notoserifcjksc">个工作日的</text><text x="318.26 325.15 331.76" y="517.45" font-size="11.00" class="sc-loraregular">API</text><text x="338.34" y="517.45" font-size="11.00" class="sc-notoserifcjksc">访问权限进行。我们在此次测试中使用了</text><text x="144.75" y="533.07" font-size="11.00" class="sc-notoserifcjksc">五项任务：</text><text x="180.75 187.56 194.08 200.19 205.88 211.13 215.14 218.03 226.24 232.26 239.03 244.76 253.04 259.61 266.61 269.50 275.58 281.86 287.11 292.36 298.46 303.47 309.99" y="549.83" font-size="11.00" class="sc-loraitalic">Budget NanoGPT Speedrun</text><text x="316.75" y="549.83" font-size="11.00" class="sc-notoserifcjksc">，这是热门</text><text x="374.65" y="549.83" font-size="11.00" class="sc-loraregular">AI</text><text x="388.11" y="549.83" font-size="11.00" class="sc-notoserifcjksc">研发竞赛</text><text x="435.00 443.33 449.01 455.68 462.12 470.49 477.16 484.20 487.09 493.26 499.83 505.73 511.64 518.22 522.98 529.55" y="549.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">NanoGPT Speedrun</text><text x="180.75" y="565.45" font-size="11.00" class="sc-notoserifcjksc">的受限版本。</text><text x="180.75 187.10 193.12 199.89 205.59 212.11 218.14 223.84 229.08 231.98 241.91 247.64 253.75 258.99 262.11 265.00 272.55 278.28 285.04 290.24 295.49 301.77 305.78 312.30 318.33 321.44 324.33 331.19 336.19 341.89 348.41 358.05 363.30 370.06 374.06 380.09 384.10 387.66 393.39 400.16 403.05 406.33 412.67 422.65 430.20 436.94" y="582.22" font-size="11.00" class="sc-loraitalic">Language Model Conceptual Argumentation (LMCA)</text><text x="440.22" y="582.22" font-size="11.00" class="sc-notoserifcjksc">，一个概念推理数据</text><text x="180.75" y="597.84" font-size="11.00" class="sc-notoserifcjksc">集，详见</text><text x="227.64 234.53 237.42 244.00 249.60 253.86 259.53 264.62 270.51 274.77 277.66 284.04 287.76 290.65 295.34 300.94 305.19 311.10 317.68 320.57 326.37 332.80 339.48 345.28 351.24 357.81 362.06 368.63 374.31 377.30 380.19 385.87 390.58 396.66 403.23 413.06 419.02 425.60 429.86 434.95 437.84 440.82 448.51 454.95 461.38 467.95 473.91 478.67 481.57 487.45 491.71 494.60 500.28 503.27 505.98" y="597.84" font-size="11.00" class="sc-loraregular">A dataset of rated conceptual arguments (Cooper et al.,</text><text x="180.75 186.66 193.41 199.32 205.54" y="613.46" font-size="11.00" class="sc-loraregular">2026)</text><text x="208.90" y="613.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75 187.75 192.57 198.60 202.17 208.93 211.82 217.85 220.75 227.31 232.21 237.94 243.64 248.47 254.49" y="630.80" font-size="11.00" class="sc-loraitalic">Train a Program</text><text x="264.13" y="630.80" font-size="11.00" class="sc-notoserifcjksc">，一项衡量智能体训练机器学习模型以复现某个软件行为</text><text x="180.75" y="646.42" font-size="11.00" class="sc-notoserifcjksc">的能力的任务；</text><text x="180.75" y="679.37" font-size="11.00" class="sc-loraitalic">Gaming Bot</text><text x="240.16" y="679.37" font-size="11.00" class="sc-notoserifcjksc">，一项任务，要求智能体在获得一个用于控制游戏的非视觉</text><text x="180.75 187.64 194.25" y="694.99" font-size="11.00" class="sc-loraregular">API</text><text x="200.82" y="694.99" font-size="11.00" class="sc-notoserifcjksc">的情况下，编写一个能够玩电子游戏的</text><text x="390.72 397.55 403.41 407.67 414.26 420.69" y="694.99" font-size="11.00" class="sc-loraregular">Python</text><text x="430.26" y="694.99" font-size="11.00" class="sc-notoserifcjksc">程序。</text><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="435.00" y="541.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="435.00" y="541.03" width="49.19" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="484.20" y="541.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="487.09" y="541.03" width="49.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="180.75" y="82.61" font-size="11.00" class="sc-loraitalic">Sunlight</text><text x="222.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，一项衡量智能体开展开放式研究并撰写相应报告的能力的任</text><text x="180.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="144.75" y="114.99" font-size="11.00" class="sc-notoserifcjksc">关于以往模型的趋势和能力的背景信息，尤其是我们近期发布的</text><text x="452.75" y="114.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿风险报告</text><text x="144.75" y="130.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="155.75 161.67 166.35 172.79 179.37 183.62 186.71 192.68 197.44 200.33 207.24 210.33 215.43 221.33 224.23 231.06 237.02 243.58 250.02 254.86" y="130.61" font-size="11.00" class="sc-loraregular">Frontier Risk Report</text><text x="259.12" y="130.61" font-size="11.00" class="sc-notoserifcjksc">）中所报告的内容。</text><text x="144.75 151.64 158.21 162.47 169.06 173.75 180.18 186.75 189.84" y="147.38" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="198.58" y="147.38" font-size="11.00" class="sc-notoserifcjksc">提供的关于</text><text x="256.48 260.43 268.11 271.11 276.72 283.28 289.86 295.82 298.72 307.45 314.02 320.59 325.68 328.57 334.57 337.27 343.27" y="147.38" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="350.11" y="147.38" font-size="11.00" class="sc-notoserifcjksc">能力的其他信息，包括对一份询问模型</text><text x="144.75" y="163.00" font-size="11.00" class="sc-notoserifcjksc">能力和控制因素的问卷的回答，以及对一位</text><text x="356.64 363.53 370.11 374.36 380.95 385.64 392.07 398.64 401.73" y="163.00" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="410.48" y="163.00" font-size="11.00" class="sc-notoserifcjksc">研究人员的访谈。</text><text x="144.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="169.64" y="212.15" font-size="11.00" class="sc-loraregular">METR</text><text x="203.42" y="212.15" font-size="11.00" class="sc-notoserifcjksc">另一项关于</text><text x="261.32 268.20 274.78 279.04 285.63 290.31 296.75 303.32 306.41" y="212.15" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="315.15" y="212.15" font-size="11.00" class="sc-notoserifcjksc">内部</text><text x="340.04" y="212.15" font-size="11.00" class="sc-loraregular">AI</text><text x="353.51" y="212.15" font-size="11.00" class="sc-notoserifcjksc">研发加速情况的评估的一份高度实验性</text><text x="144.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的初步报告。</text><text x="210.75" y="227.77" font-size="11.00" class="sc-notoserifcjkscbold">这份报告由</text><text x="268.64" y="227.77" font-size="11.00" class="sc-loraregular">METR</text><text x="302.42" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的另一个团队撰写，该团队拥有比撰写本内容的</text><text x="144.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">团队更高的访问权限。</text><text x="254.75" y="243.39" font-size="11.00" class="sc-notoserifcjkscbold">由于访问权限上的这一差异，</text><text x="397.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">该团队与我们分享了其结论，</text><text x="144.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">但</text><text x="155.75" y="259.01" font-size="11.00" class="sc-notoserifcjkscbold">未能分享其推理的支持性证据或细节</text><text x="331.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75" y="325.49" font-size="11.00" class="sc-notoserifcjksc">因此，我们将所提供的</text><text x="293.64" y="325.49" font-size="11.00" class="sc-loraregular">AI</text><text x="307.11" y="325.49" font-size="11.00" class="sc-notoserifcjksc">研发报告中的证据作为评估的一项输入，但不直</text><text x="180.75" y="341.11" font-size="11.00" class="sc-notoserifcjksc">接为其论断进行论证辩护。</text><text x="180.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">我们将此处纳入该报告视为一种更全面评估流程的试行版本。我们预计这</text><text x="180.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">项独立调查将在未来几周内有更多公开成果发布。</text><text x="117.75" y="436.72" font-size="11.00" class="sc-notoserifcjksc">结论</text><text x="117.75" y="464.88" font-size="11.00" class="sc-notoserifcjksc">我们将结论分为两类：一类涉及（</text><text x="282.75" y="464.88" font-size="11.00" class="sc-loraregular">A</text><text x="289.64" y="464.88" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="300.64 304.19 311.88 314.87 320.48 327.05 333.62 339.59 342.48 351.21 357.78 364.35 369.44 372.33 378.33 381.04 387.03" y="464.88" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="393.87" y="464.88" font-size="11.00" class="sc-notoserifcjksc">能够带来的</text><text x="451.77" y="464.88" font-size="11.00" class="sc-loraregular">AI</text><text x="465.23" y="464.88" font-size="11.00" class="sc-notoserifcjksc">研发加速程</text><text x="117.75" y="480.50" font-size="11.00" class="sc-notoserifcjksc">度，另一类涉及（</text><text x="205.75" y="480.50" font-size="11.00" class="sc-loraregular">B</text><text x="212.59" y="480.50" font-size="11.00" class="sc-notoserifcjksc">）在</text><text x="237.49 241.43 249.12 252.12 257.73 264.29 270.87 276.83 279.73 288.46 295.03 301.59 306.69 309.58 315.57 318.28 324.28" y="480.50" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="331.12" y="480.50" font-size="11.00" class="sc-notoserifcjksc">开发过程中由</text><text x="400.01" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="413.47" y="480.50" font-size="11.00" class="sc-notoserifcjksc">带来的</text><text x="449.37" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="462.83" y="480.50" font-size="11.00" class="sc-notoserifcjksc">研发加速程度。</text><text x="117.75" y="496.12" font-size="11.00" class="sc-notoserifcjksc">基于现有证据，我们得出以下结论：</text><text x="117.75" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="562.03" font-size="11.00" class="sc-lorabold">A</text><text x="136.10" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型带来的加速将略高于</text><text x="336.99 342.82 348.59 354.84 358.28 364.19 367.09 373.03 375.59" y="562.03" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="380.06" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">，但该模型不太可能完全自动化</text><text x="117.75" y="577.65" font-size="11.00" class="sc-lorabold">AI</text><text x="132.25" y="577.65" font-size="11.00" class="sc-notoserifcjkscbold">研发。</text><text x="117.75" y="626.80" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75" y="642.99" font-size="11.00" class="sc-notoserifcjksc">我们有相当把握认为，</text><text x="254.75 258.70 266.39 269.38 274.99 281.56 288.14 294.10 296.99 305.72 312.29 318.86 323.95 326.84 332.84 335.55 341.54" y="642.99" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="348.38" y="642.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="362.28" y="642.99" font-size="11.00" class="sc-loraregular">AI</text><text x="375.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">研发能力上并未比</text><text x="466.63 472.22 477.90 484.30 487.29 493.25 496.15 502.14 504.85" y="642.99" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="511.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">实现</text><text x="144.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">巨大飞跃，但它很可能代表着相对于</text><text x="323.64 329.23 334.91 341.31 344.30 350.26 353.16 359.15 361.86" y="658.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="368.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">的适度改进。</text><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="180.75 184.30 191.99 194.98 200.59 207.16 213.74 219.70 222.59 231.33 237.90 244.46 249.56 252.45 258.44 261.15 267.14" y="82.61" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="273.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在可验证任务（</text><text x="350.99 357.75 364.32 370.90 376.92 382.81 387.07 389.96 398.29 403.96 410.64 417.07 425.45 432.11" y="82.61" font-size="11.00" class="sc-loraregular">Budget NanoGPT</text><text x="439.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.15" y="82.61" font-size="11.00" class="sc-loraregular">Gaming Bot</text><text x="510.31" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="180.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">较难验证的任务（</text><text x="268.75 275.11 285.15 292.73" y="98.23" font-size="11.00" class="sc-loraregular">LMCA</text><text x="299.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="310.62 316.79 323.35 330.03 333.02 336.11 342.46 348.95" y="98.23" font-size="11.00" class="sc-loraregular">Sunlight</text><text x="353.21" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）上均优于</text><text x="411.10 416.69 422.36 428.77 431.76 437.72 440.61 446.61 449.32" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="453.32" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，但：</text><text x="216.75" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中，</text><text x="348.75 355.64 362.21 366.47 373.06 377.75 384.18 390.75 393.84" y="131.19" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="402.58" y="131.19" font-size="11.00" class="sc-notoserifcjksc">称</text><text x="416.48 420.43 428.12 431.11 436.72 443.28 449.86 455.82 458.72 467.45 474.02 480.59 485.68 488.57 494.57 497.27 503.27" y="131.19" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="510.11" y="131.19" font-size="11.00" class="sc-notoserifcjksc">延续</text><text x="216.75" y="146.81" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="230.64 237.53 244.11 248.36 254.95 259.64 266.07 272.64 275.73 281.58 284.48 291.32 299.01" y="146.81" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="305.59" y="146.81" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="319.48 329.41 335.28 339.53 346.12 352.56" y="146.81" font-size="11.00" class="sc-loraregular">Mythos</text><text x="360.54" y="146.81" font-size="11.00" class="sc-notoserifcjksc">级别的趋势。</text><text x="216.75" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在我们的定量评估中，</text><text x="326.75 330.70 338.39 341.38 346.99 353.56 360.14 366.10 368.99 377.72 384.29 390.86 395.95 398.84 404.84 407.55 413.54" y="179.76" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="420.38" y="179.76" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="456.28 461.86 467.54 473.94 476.93 482.90 485.79 491.78 494.49" y="179.76" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="501.39" y="179.76" font-size="11.00" class="sc-notoserifcjksc">是渐进</text><text x="216.75" y="195.38" font-size="11.00" class="sc-notoserifcjksc">式改进，而非不连续的跃升。</text><text x="216.75 220.30 227.99 230.98 236.59 243.16 249.74 255.70 258.59 267.33 273.90 280.46 285.55 288.45 294.44 297.15 303.14" y="228.34" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="309.99" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在解决困难的长程任务或进行开放式推理时，仍</text><text x="216.75" y="243.96" font-size="11.00" class="sc-notoserifcjksc">存在人类专家不太可能表现出的定性弱点。</text><text x="144.75" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这一点高度不确定，但我们预计，完全自动化</text><text x="367.64" y="293.11" font-size="11.00" class="sc-loraregular">AI</text><text x="381.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">研发将需要在远见、预测、构建</text><text x="144.75" y="308.73" font-size="11.00" class="sc-notoserifcjksc">自身反馈回路，以及通常可称为研究人员</text><text x="342.75" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="347.15" y="308.73" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="380.15" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="383.99" y="308.73" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="394.99" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="399.39" y="308.73" font-size="11.00" class="sc-notoserifcjksc">品味</text><text x="421.39" y="308.73" font-size="11.00" class="sc-loraregular">”</text><text x="425.23" y="308.73" font-size="11.00" class="sc-notoserifcjksc">的其他技能方面取得大</text><text x="144.75" y="324.35" font-size="11.00" class="sc-notoserifcjksc">幅提升。</text><text x="180.75" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们掌握的证据并未表明</text><text x="304.64 308.59 316.28 319.27 324.88 331.45 338.03 343.99 346.88 355.62 362.18 368.75 373.84 376.74 382.73 385.44 391.43" y="357.88" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="398.28" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在这些</text><text x="431.28" y="357.88" font-size="11.00" class="sc-loraregular">“</text><text x="435.67" y="357.88" font-size="11.00" class="sc-notoserifcjksc">判断力</text><text x="468.67" y="357.88" font-size="11.00" class="sc-loraregular">”</text><text x="472.51" y="357.88" font-size="11.00" class="sc-notoserifcjksc">技能上相对于</text><text x="180.75 186.34 192.01 198.42 201.41 207.37 210.26 216.26 218.96" y="373.50" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="225.86" y="373.50" font-size="11.00" class="sc-notoserifcjksc">有大幅提升。</text><text x="144.75" y="406.45" font-size="11.00" class="sc-notoserifcjksc">与此同时，我们认为</text><text x="246.64 250.59 258.28 261.27 266.88 273.45 280.03 285.99 288.88 297.62 304.18 310.75 315.84 318.74 324.73 327.44 333.43" y="406.45" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="340.28" y="406.45" font-size="11.00" class="sc-notoserifcjksc">仍很可能明显加速研究人员的工作，并自</text><text x="144.75" y="422.07" font-size="11.00" class="sc-notoserifcjksc">动化研发的有限方面。例如，我们预计</text><text x="334.64 338.59 346.28 349.27 354.88 361.45 368.03 373.99 376.88 385.62 392.18 398.75 403.84 406.74 412.73 415.44 421.43" y="422.07" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="428.28" y="422.07" font-size="11.00" class="sc-notoserifcjksc">很可能提供略高于</text><text x="144.75 150.34 156.01 162.42 165.41 171.37 174.26 180.26 182.96" y="437.69" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="189.86" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的生产力提升。</text><text x="144.75" y="471.22" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="177.75" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="191.21" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力上频繁的渐进式改进仍与</text><text x="359.11" y="471.22" font-size="11.00" class="sc-loraregular">AI</text><text x="372.57" y="471.22" font-size="11.00" class="sc-notoserifcjksc">研发能力的总体快速进展相一致，</text><text x="144.75" y="486.84" font-size="11.00" class="sc-notoserifcjksc">但我们掌握的数据不足以区分改进速度是恒定、加速还是减速。目前尚不清楚，在</text><text x="144.75" y="502.46" font-size="11.00" class="sc-loraregular">AI</text><text x="158.21" y="502.46" font-size="11.00" class="sc-notoserifcjksc">研发流程发生质变之前，还需要多少次这种幅度的持续渐进式定量改进。</text><text x="117.75" y="601.76" font-size="12.00" class="sc-notoserifcjksc">我们还利用了一个目前无法披露的额外信息来源。我们利用该来源来了解</text><text x="117.75 125.26 132.44 137.08 144.27 149.38 156.40 163.57 166.94" y="618.80" font-size="12.00" class="sc-loraregular">Anthropic</text><text x="176.48" y="618.80" font-size="12.00" class="sc-notoserifcjksc">的</text><text x="191.63" y="618.80" font-size="12.00" class="sc-loraregular">AI</text><text x="206.32" y="618.80" font-size="12.00" class="sc-notoserifcjksc">研发，但它与</text><text x="281.48" y="618.80" font-size="12.00" class="sc-loraregular">METR</text><text x="318.33" y="618.80" font-size="12.00" class="sc-notoserifcjksc">对这一特定模型的理解无关。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">44</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="82.61" font-size="11.00" class="sc-lorabold">B</text><text x="136.02" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型的开发至少在一定程度上因</text><text x="369.91" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="384.41" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而加速，但不太可能因</text><text x="497.31" y="82.61" font-size="11.00" class="sc-lorabold">AI</text><text x="511.80" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">而被</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">剧烈加速。</text><text x="117.75" y="147.38" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75" y="163.57" font-size="11.00" class="sc-notoserifcjksc">初步</text><text x="169.64" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="183.11" y="163.57" font-size="11.00" class="sc-notoserifcjksc">研发报告给出的估计是</text><text x="293.11" y="163.57" font-size="11.00" class="sc-loraregular">“</text><text x="297.51" y="163.57" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="311.40" y="163.57" font-size="11.00" class="sc-loraregular">AI</text><text x="324.86" y="163.57" font-size="11.00" class="sc-notoserifcjksc">带来的能力方面约</text><text x="415.76" y="163.57" font-size="11.00" class="sc-loraregular">1.5X</text><text x="438.49" y="163.57" font-size="11.00" class="sc-notoserifcjksc">的总体加速（即</text><text x="518.39" y="163.57" font-size="11.00" class="sc-loraregular">1</text><text x="525.28" y="163.57" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="144.75" y="179.19" font-size="11.00" class="sc-notoserifcjksc">内完成</text><text x="180.64" y="179.19" font-size="11.00" class="sc-loraregular">1.5</text><text x="196.24" y="179.19" font-size="11.00" class="sc-notoserifcjksc">年的进展），或许有</text><text x="298.13" y="179.19" font-size="11.00" class="sc-loraregular">30%</text><text x="323.55" y="179.19" font-size="11.00" class="sc-notoserifcjksc">的可能性达到</text><text x="392.45" y="179.19" font-size="11.00" class="sc-loraregular">2X</text><text x="408.39" y="179.19" font-size="11.00" class="sc-notoserifcjksc">加速。</text><text x="441.39" y="179.19" font-size="11.00" class="sc-loraregular">”</text><text x="180.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">请注意，由于该初步报告未说明这一估计所对应的时间段，目前尚不清楚</text><text x="180.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">这一估计适用于</text><text x="260.64 264.59 272.28 275.27 280.88 287.45 294.03 299.99 302.88 311.62 318.18 324.75 329.84 332.74 338.73 341.44 347.43" y="227.77" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="354.28" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的开发还是其他时期。</text><text x="144.75" y="276.91" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="180.64 184.59 192.28 195.27 200.88 207.45 214.03 219.99 222.88 231.62 238.18 244.75 249.84 252.74 258.73 261.44 267.43" y="276.91" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">能力的理解表明，它相对于</text><text x="409.17 414.76 420.43 426.83 429.83 435.79 438.68 444.68 447.38" y="276.91" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="454.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">是符合趋势的改</text><text x="144.75" y="292.53" font-size="11.00" class="sc-notoserifcjksc">进。</text><text x="180.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">这一判断基于我们的内部能力评估（表明其相对于</text><text x="425.64 431.23 436.91 443.31 446.30 452.26 455.16 461.15 463.86" y="309.30" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="470.75" y="309.30" font-size="11.00" class="sc-notoserifcjksc">有渐进式改</text><text x="180.75" y="324.92" font-size="11.00" class="sc-notoserifcjksc">进），以及</text><text x="238.64 245.53 252.11 256.36 262.95 267.64 274.07 280.64 283.73" y="324.92" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="292.48" y="324.92" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中提供的信息（表明</text><text x="180.75 184.70 192.39 195.38 200.99 207.56 214.14 220.10 222.99 231.72 238.29 244.86 249.95 252.84 258.84 261.55 267.54" y="340.54" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="274.38" y="340.54" font-size="11.00" class="sc-notoserifcjksc">延续了自</text><text x="321.27 331.21 337.07 341.33 347.92 354.35 359.45 362.34 369.00 373.69 379.60 385.15 388.24 394.16" y="340.54" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="405.86" y="340.54" font-size="11.00" class="sc-notoserifcjksc">以来的</text><text x="441.76" y="340.54" font-size="11.00" class="sc-loraregular">AECI</text><text x="469.75" y="340.54" font-size="11.00" class="sc-notoserifcjksc">趋势）。</text><text x="72.00" y="404.80" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23" y="404.80" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="432.68" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.14 225.85" y="432.68" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="234.73" y="432.68" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="292.63" y="432.68" font-size="11.00" class="sc-loraregular">RSP</text><text x="315.33" y="432.68" font-size="11.00" class="sc-notoserifcjksc">中关于自动化</text><text x="384.22" y="432.68" font-size="11.00" class="sc-loraregular">AI</text><text x="397.69" y="432.68" font-size="11.00" class="sc-notoserifcjksc">研发剧烈加速的能力阈值。</text><text x="72.00" y="448.30" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="448.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34" y="448.30" font-size="11.00" class="sc-loraregular">AI</text><text x="146.80" y="448.30" font-size="11.00" class="sc-notoserifcjksc">研发领域的能力处于或略高于我们此前的能力前沿</text><text x="391.69 399.38 402.37 407.98 414.55 421.13 427.09 429.98 439.92 445.78 450.04 456.63 463.06 468.15 471.05 477.04 479.75" y="448.30" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="483.75" y="448.30" font-size="11.00" class="sc-notoserifcjksc">。我们认</text><text x="72.00" y="463.92" font-size="11.00" class="sc-notoserifcjksc">为，它在许多情况下能为</text><text x="195.89" y="463.92" font-size="11.00" class="sc-loraregular">AI</text><text x="209.36" y="463.92" font-size="11.00" class="sc-notoserifcjksc">研发工作带来有意义的加速，并且在该领域的能力略强于我们以往系</text><text x="72.00" y="479.54" font-size="11.00" class="sc-notoserifcjksc">统卡中所描述的模型。</text><text x="72.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。第一，与以往模型一样，</text><text x="325.00" y="546.03" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="372.44" y="546.03" font-size="11.00" class="sc-notoserifcjksc">似乎并不接近能够完全替代我们的</text><text x="72.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">研究科学家和研究工程师，尤其是相对资深的人员。在</text><text x="338.89 346.58 352.75 359.60 365.56 372.23 378.09 384.67 387.57 393.48 396.18" y="561.65" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="403.08" y="561.65" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="425.08 432.77 435.76 441.37 447.94 454.51 460.48 463.37 472.10 478.67 485.24 490.33 493.22 499.22 501.92" y="561.65" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="510.81" y="561.65" font-size="11.00" class="sc-notoserifcjksc">的得</text><text x="72.00" y="577.27" font-size="11.00" class="sc-notoserifcjksc">分与</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.24 184.95" y="577.27" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="191.85" y="577.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="205.74 213.43 216.42 222.03 228.60 235.17 241.14 244.03 252.76 259.33 265.90 270.99 273.88" y="577.27" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="282.77" y="577.27" font-size="11.00" class="sc-notoserifcjksc">的差异在噪声范围内，且远低于</text><text x="439.66" y="577.27" font-size="11.00" class="sc-loraregular">85%</text><text x="72.00" y="592.89" font-size="11.00" class="sc-notoserifcjksc">认为，能够完全替代</text><text x="173.89 180.78 187.36 191.61 198.20 202.89 209.32 215.89 218.98" y="592.89" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="227.73" y="592.89" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型应能达到这一阈值。第二，在更新后的</text><text x="494.62" y="592.89" font-size="11.00" class="sc-loraregular">AECI</text><text x="522.61" y="592.89" font-size="11.00" class="sc-notoserifcjksc">拟</text><text x="72.00" y="608.51" font-size="11.00" class="sc-notoserifcjksc">合中，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15 179.14 181.85" y="608.51" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="190.73" y="608.51" font-size="11.00" class="sc-notoserifcjksc">的得分比</text><text x="237.63 245.32 248.31 253.92 260.48 267.06 273.02 275.92 285.85 291.71 295.97 302.56 308.99 314.09 316.98 322.98 325.68" y="608.51" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="332.58" y="608.51" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="346.47 350.48 353.18 358.85" y="608.51" font-size="11.00" class="sc-loraregular">1.24</text><text x="367.70" y="608.51" font-size="11.00" class="sc-notoserifcjksc">分，且两个模型都位于对方的局部</text><text x="335.51 343.19 346.19 351.80 358.36 364.94 370.90 373.80 383.73 389.59 393.85 400.44 406.87 411.97 414.86 421.52 426.21 432.12 437.67 440.76 446.68" y="624.13" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中，偏移对数据的拟合更好，但即使是趋势断裂假设也未跨越</text><text x="371.89" y="639.75" font-size="11.00" class="sc-loraregular">RSP</text><text x="394.60" y="639.75" font-size="11.00" class="sc-notoserifcjksc">中设定的</text><text x="441.49" y="639.75" font-size="11.00" class="sc-loraregular">2x</text><text x="456.12" y="639.75" font-size="11.00" class="sc-notoserifcjksc">斜率变化阈值。</text><text x="72.00" y="655.37" font-size="11.00" class="sc-notoserifcjksc">由于我们更新了</text><text x="151.89" y="655.37" font-size="11.00" class="sc-loraregular">AECI</text><text x="179.89" y="655.37" font-size="11.00" class="sc-notoserifcjksc">基准组合并重新拟合了量表，且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">45</text><text x="72.00 79.69 85.86 92.70 98.66 105.34 111.19 117.78 120.68 126.58 129.29" y="82.61" font-size="11.00" class="sc-loraregular">CoBench 2.1</text><text x="136.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">环境发生了变化，这些分数无法与早期系统卡中的分数直接比较。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们将继续追踪内部加速指标，并预计将继续发布这项工作中的观察结果（不过，其中许多评估</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">与单个模型的发布关联较弱，可能会发布在系统卡以外的文档中，例如我们的风险报告或</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 136.11 141.20 145.46 148.73 152.98 159.55 163.81" y="162.43" font-size="11.00" class="sc-loraregular">Anthropic Institute</text><text x="172.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的出版物，如</text><text x="238.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">这一篇</text><text x="271.66" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="250.64" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="250.64" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对各项主张和核心论证的更新</text><text x="72.00" y="278.53" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 132.91 139.66 145.57" y="278.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="154.82" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="278.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="278.53" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68 252.59 255.18" y="278.53" font-size="11.00" class="sc-loraregular">2.6</text><text x="264.43" y="278.53" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="278.33" y="278.53" font-size="11.00" class="sc-loraregular">2.14</text><text x="299.80" y="278.53" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证辩护，在</text><text x="72.00" y="294.15" font-size="11.00" class="sc-notoserifcjksc">很大程度上仍适用于</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="294.15" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63" y="294.15" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐风险。下面我们介绍对部分具体主张的更</text><text x="72.00" y="309.77" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="343.30" font-size="11.00" class="sc-lorabold">1</text><text x="115.25" y="343.30" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="151.14" y="343.30" font-size="11.00" class="sc-notoserifcjksc">我们风险报告中的主张</text><text x="264.04" y="343.30" font-size="11.00" class="sc-loraregular">1</text><text x="270.93" y="343.30" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="281.93" y="343.30" font-size="11.00" class="sc-loraregular">“</text><text x="286.33" y="343.30" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="451.33" y="343.30" font-size="11.00" class="sc-loraregular">”</text><text x="455.17" y="343.30" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡第</text><text x="72.00 78.36 80.95 87.31 90.02" y="358.92" font-size="11.00" class="sc-loraregular">6.6.4</text><text x="98.87" y="358.92" font-size="11.00" class="sc-notoserifcjksc">节所述的隐蔽能力评估中，</text><text x="230.87 238.56 241.55 247.16 253.73 260.31 266.27 269.16 277.90 284.47 291.03 296.12 299.02 305.01 307.72" y="358.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="316.61" y="358.92" font-size="11.00" class="sc-notoserifcjksc">的结果好坏参半。在不使用扩展思考</text><text x="72.00" y="374.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.91 94.74 98.99 104.96 111.63 118.21 124.12 130.70 133.59 137.85 144.43 147.53 154.20 160.11 163.20 169.88" y="374.54" font-size="11.00" class="sc-loraregular">extended thinking</text><text x="175.96" y="374.54" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="200.85 207.21 210.30 216.98 223.55 229.73 236.62 241.30 247.26 253.94" y="374.54" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="262.51" y="374.54" font-size="11.00" class="sc-notoserifcjksc">设置中，或扩展思考对监控器不可见的设置中，</text><text x="493.51 501.20 504.19 509.80 516.37 522.94" y="374.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="390.16" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="390.16" font-size="11.00" class="sc-notoserifcjksc">采取不期望行为的意愿略低于</text><text x="265.34 273.02 276.02 281.63 288.19 294.77 300.73 303.63 313.56 319.42 323.68 330.27 336.70 341.80 344.69 350.68 353.39" y="390.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="357.39" y="390.16" font-size="11.00" class="sc-notoserifcjksc">。然而，当扩展思考对监控器可见时</text><text x="72.00" y="405.78" font-size="11.00" class="sc-notoserifcjksc">（我们实际部署时的监控器即是如此），其表现非常差。这一总体模式在</text><text x="426.89 433.13 441.71 448.60 456.68 463.30 468.68 475.57 480.25 486.22 492.89" y="405.78" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="501.46" y="405.78" font-size="11.00" class="sc-notoserifcjksc">中得到</text><text x="72.00" y="421.40" font-size="11.00" class="sc-notoserifcjksc">了复现。在扩展思考可见的</text><text x="206.89 213.25 216.34 223.02 229.59 235.77 242.65 247.34 253.30 259.98" y="421.40" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="268.55" y="421.40" font-size="11.00" class="sc-notoserifcjksc">设置中，使用强化学习（</text><text x="389.55" y="421.40" font-size="11.00" class="sc-loraregular">RL</text><text x="402.81" y="421.40" font-size="11.00" class="sc-notoserifcjksc">）进行分布内能力激发</text><text x="72.00" y="437.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.96 91.95 95.04 100.90 104.16 108.42 114.02 118.28 121.37 127.80" y="437.02" font-size="11.00" class="sc-loraregular">elicitation</text><text x="134.48" y="437.02" font-size="11.00" class="sc-notoserifcjksc">）后，表现并未显著提高，尽管这种训练几乎消除了可检测到的拒绝，这在一定程度</text><text x="72.00" y="452.64" font-size="11.00" class="sc-notoserifcjksc">上构成了反对</text><text x="138.00" y="452.64" font-size="11.00" class="sc-loraregular">“</text><text x="142.40" y="452.64" font-size="11.00" class="sc-notoserifcjksc">表现不佳是由故意藏拙（</text><text x="263.40 268.49 274.17 280.85 287.42 293.83 299.50 305.58 311.93 315.02 321.70" y="452.64" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="327.78" y="452.64" font-size="11.00" class="sc-notoserifcjksc">）造成</text><text x="360.78" y="452.64" font-size="11.00" class="sc-loraregular">”</text><text x="364.62" y="452.64" font-size="11.00" class="sc-notoserifcjksc">的证据。此外，在扩展思考设置中相</text><text x="72.00" y="468.26" font-size="11.00" class="sc-notoserifcjksc">对较差的表现，与该模型在思维链可控性（</text><text x="281.00 286.85 293.44 299.12 302.21 308.89 314.26 320.64 324.25 329.63 333.89 340.48 346.91 353.48 359.83 366.32 370.57 373.47 379.26 385.70 392.28 396.53 401.22 407.65 410.65 413.64 419.31 425.72 428.81 431.80 435.07 439.34" y="468.26" font-size="11.00" class="sc-loraregular">chain-of-thought controllability</text><text x="445.15" y="468.26" font-size="11.00" class="sc-notoserifcjksc">）评估中的表现一</text><text x="72.00" y="483.88" font-size="11.00" class="sc-notoserifcjksc">致：在该评估中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.14 236.85" y="483.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="245.73" y="483.88" font-size="11.00" class="sc-notoserifcjksc">的得分与</text><text x="292.63 300.32 303.31 308.92 315.49 322.06 328.03 330.92 339.65 346.22 352.79 357.88 360.77 366.73 369.09" y="483.88" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="377.05" y="483.88" font-size="11.00" class="sc-notoserifcjksc">相当，远低于</text><text x="445.95 453.63 456.63 462.24 468.80 475.38 481.34 484.24 494.17 500.03 504.29 510.88 517.31" y="483.88" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="499.50" font-size="11.00" class="sc-loraregular">Preview</text><text x="115.53" y="499.50" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="129.42 137.11 140.10 145.71 152.28 158.86 164.82 167.71 177.64 183.51 187.76 194.35 200.79 205.88 208.77 214.77 217.47" y="499.50" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="224.37" y="499.50" font-size="11.00" class="sc-notoserifcjksc">所展现的可控性。</text><text x="72.00" y="602.37" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们认为，与以往模型在其部署时相比，</text><text x="325.00 332.69 335.68 341.29 347.86 354.44 360.40 363.29 372.02 378.59 385.16 390.25 393.14 399.14 401.85" y="602.37" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="410.73" y="602.37" font-size="11.00" class="sc-notoserifcjksc">破坏我们现有监督水平的</text><text x="72.00" y="617.99" font-size="11.00" class="sc-notoserifcjksc">能力并没有显著更强，因此我们认为主张</text><text x="272.89" y="617.99" font-size="11.00" class="sc-loraregular">1</text><text x="279.79" y="617.99" font-size="11.00" class="sc-notoserifcjksc">目前并不比我们最近一份风险报告中显著更弱。</text><text x="72.00" y="667.14" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="667.14" font-size="11.00" class="sc-lorabold">2</text><text x="116.65" y="667.14" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="152.54" y="667.14" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="177.43" y="667.14" font-size="11.00" class="sc-loraregular">2</text><text x="186.23" y="667.14" font-size="11.00" class="sc-notoserifcjksc">认为</text><text x="208.23" y="667.14" font-size="11.00" class="sc-loraregular">“</text><text x="212.63" y="667.14" font-size="11.00" class="sc-notoserifcjksc">已知未对齐带来的预期危害较低</text><text x="366.63" y="667.14" font-size="11.00" class="sc-loraregular">”</text><text x="370.47" y="667.14" font-size="11.00" class="sc-notoserifcjksc">。我们认为，</text><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="238.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="238.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="249.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="249.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="260.66" y="153.63" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/measuring-pace-of-ai-development" rel="noopener"><rect x="260.66" y="153.63" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="269.73" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="151.93" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154.82" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="165.82" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="168.71" y="269.73" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="174.89" y="269.73" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="177.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="188.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="199.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="210.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="269.73" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="221.79" y="269.73" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">46</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">节中呈现的关于</text><text x="175.04 182.73 185.72 191.33 197.89 204.47 210.43 213.33 222.06 228.63 235.20 240.29 243.18 249.18 251.88" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="260.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对齐属性的任何观察结果，都不意味着风险高于我们此前</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">能力最强的模型</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.24 239.95" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="246.85" y="98.23" font-size="11.00" class="sc-notoserifcjksc">所带来的风险。因此，我们认为主张</text><text x="425.74" y="98.23" font-size="11.00" class="sc-loraregular">2</text><text x="434.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的强度没有变化。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="131.19" font-size="11.00" class="sc-lorabold">3.4</text><text x="125.53" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">和</text><text x="139.42" y="131.19" font-size="11.00" class="sc-lorabold">4.4</text><text x="156.91" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="192.80" y="131.19" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="217.70" y="131.19" font-size="11.00" class="sc-loraregular">3.4</text><text x="235.38" y="131.19" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="246.38" y="131.19" font-size="11.00" class="sc-loraregular">“</text><text x="250.78" y="131.19" font-size="11.00" class="sc-notoserifcjksc">根据我们的对齐评估，存在未知的严重普遍性未对齐是不太</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">可能的</text><text x="105.00" y="146.81" font-size="11.00" class="sc-loraregular">”</text><text x="108.84" y="146.81" font-size="11.00" class="sc-notoserifcjksc">。主张</text><text x="144.73" y="146.81" font-size="11.00" class="sc-loraregular">4.4</text><text x="162.26" y="146.81" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="173.26" y="146.81" font-size="11.00" class="sc-loraregular">“</text><text x="177.65" y="146.81" font-size="11.00" class="sc-notoserifcjksc">根据我们的对齐评估，存在未知的严重情境依赖性未对齐是有些不太可能</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="83.00" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。我们的对齐评估为</text><text x="188.73 196.42 199.41 205.02 211.59 218.17 224.13 227.02 235.76 242.32 248.89 253.98 256.88 262.87 265.58" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="274.47" y="162.43" font-size="11.00" class="sc-notoserifcjksc">提供的证据强度，略低于</text><text x="398.36 404.27 411.02 416.93" y="162.43" font-size="11.00" class="sc-loraregular">2026</text><text x="426.18" y="162.43" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="440.07" y="162.43" font-size="11.00" class="sc-loraregular">8</text><text x="449.15" y="162.43" font-size="11.00" class="sc-notoserifcjksc">月风险报告中为</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="178.05" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">提供的证据强度，因为</text><text x="273.14 280.82 283.82 289.43 295.99 302.57 308.53 311.43 320.16 326.73 333.29 338.39 341.28 347.27 349.98" y="178.05" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="358.87" y="178.05" font-size="11.00" class="sc-notoserifcjksc">是一个较新的模型，其内部使用量少</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="193.67" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14" y="193.67" font-size="11.00" class="sc-notoserifcjksc">在该报告发布时的内部使用量。这并不会显著改变我们对上级主张</text><text x="496.03" y="193.67" font-size="11.00" class="sc-loraregular">3</text><text x="502.16" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="513.16" y="193.67" font-size="11.00" class="sc-loraregular">“</text><text x="517.56" y="193.67" font-size="11.00" class="sc-notoserifcjksc">存在</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">未知的严重普遍性未对齐是非常不可能的</text><text x="270.00" y="209.29" font-size="11.00" class="sc-loraregular">”</text><text x="273.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">）和主张</text><text x="320.73" y="209.29" font-size="11.00" class="sc-loraregular">4</text><text x="326.69" y="209.29" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="337.69" y="209.29" font-size="11.00" class="sc-loraregular">“</text><text x="342.09" y="209.29" font-size="11.00" class="sc-notoserifcjksc">未知的严重情境依赖性未对齐带来的预期</text><text x="72.00" y="224.91" font-size="11.00" class="sc-notoserifcjksc">危害较低</text><text x="116.00" y="224.91" font-size="11.00" class="sc-loraregular">”</text><text x="119.84" y="224.91" font-size="11.00" class="sc-notoserifcjksc">）的总体信心，因为它们各自都得到了多个相互印证的子主张的支持。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们认为，主张</text><text x="151.89" y="325.49" font-size="11.00" class="sc-loraregular">5</text><text x="157.89" y="325.49" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="168.89" y="325.49" font-size="11.00" class="sc-loraregular">6</text><text x="175.25" y="325.49" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="186.25" y="325.49" font-size="11.00" class="sc-loraregular">7</text><text x="194.21" y="325.49" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="208.10" y="325.49" font-size="11.00" class="sc-loraregular">8</text><text x="217.18" y="325.49" font-size="11.00" class="sc-notoserifcjksc">均无需更新，风险报告第</text><text x="341.07" y="325.49" font-size="11.00" class="sc-loraregular">2.15</text><text x="362.58" y="325.49" font-size="11.00" class="sc-notoserifcjksc">节中提供的特定路径评估也无需更</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">新。</text><text x="72.00" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">更新后的对齐风险总体评估</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 91.80 98.55 104.46" y="400.30" font-size="11.00" class="sc-loraregular">2026</text><text x="113.71" y="400.30" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="127.61" y="400.30" font-size="11.00" class="sc-loraregular">8</text><text x="136.68" y="400.30" font-size="11.00" class="sc-notoserifcjksc">月风险报告中，我们将对齐风险评估上调至</text><text x="345.68" y="400.30" font-size="11.00" class="sc-loraregular">“</text><text x="350.08" y="400.30" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="361.08" y="400.30" font-size="11.00" class="sc-loraregular">”</text><text x="364.92" y="400.30" font-size="11.00" class="sc-notoserifcjksc">。我们这样做是为了反映近期与模型</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">在网络安全评估中的行为相关的事件披露所带来的不确定性增加，尽管我们认为我们的论证很可</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">能仍支持对所涵盖模型给出更低的风险等级。鉴于上述对具体主张的更新均不意味着风险显著增</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">加，我们的总体评估是，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 240.03 246.59 253.16 258.25 261.15 267.14 269.85" y="447.16" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73" y="447.16" font-size="11.00" class="sc-notoserifcjksc">未对齐所导致的灾难性危害风险同样为低。</text></svg></div>
