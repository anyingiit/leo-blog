<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p023.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 23 页"><text x="504.00 508.70" y="751.81" font-size="9.00" class="sc-loraregular">23</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">插入序列在特定区域进行了修饰。该任务要求模型使用这一带标签训练集，构建一个预测</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">器，使其对在另一个未见过的区域发生插入的衣壳序列具有较强的分布外预测表现。模型</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">可以使用一个打分器，在不揭示序列本身组成的情况下，测试其预测器在来自这一未见区</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">域的序列上的表现。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标尚未公开，因此我们高度确信，它们能够测量</text><text x="404.89" y="195.95" font-size="11.00" class="sc-loraregular">AI</text><text x="418.36" y="195.95" font-size="11.00" class="sc-notoserifcjksc">模型完成新型生物学任务</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的技能，而不受训练数据污染的影响。</text><text x="72.00" y="256.53" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.1</text><text x="113.57" y="256.53" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">黑盒</text><text x="138.46" y="256.53" font-size="11.00" class="sc-loraregular" fill="#666666">RNA</text><text x="163.53" y="256.53" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">序列建模与设计</text><text x="72.00" y="276.72" font-size="11.00" class="sc-notoserifcjksc">这项任务测量模型能否在提示极少、仅能获取部分数据的情况下，在上下文信息有限的黑盒环境</text><text x="72.00" y="292.34" font-size="11.00" class="sc-notoserifcjksc">中设计</text><text x="107.89" y="292.34" font-size="11.00" class="sc-loraregular">RNA</text><text x="72.00" y="307.96" font-size="11.00" class="sc-notoserifcjksc">的序列设计挑战。具体而言，该任务要求人类参与者或模型分析数据，根据训练数据集中的少量</text><text x="72.00" y="323.58" font-size="11.00" class="sc-notoserifcjksc">实验测量，建立序列到功能关系的模型，并使用该模型预测测试数据集中序列的功能。任务还要</text><text x="72.00" y="339.20" font-size="11.00" class="sc-notoserifcjksc">求参与者设计功能尽可能强的新序列，这些序列不能出现在上述任何一个数据集中。要在此任务</text><text x="72.00" y="354.82" font-size="11.00" class="sc-notoserifcjksc">中表现良好，就需要通过分析发现序列并不显而易见的属性，构建具有强大表达能力的分子模型</text><text x="72.00" y="370.44" font-size="11.00" class="sc-notoserifcjksc">架构，并根据分子模型的表现，在设计时作出良好权衡。</text><text x="72.00" y="487.22" font-size="11.00" class="sc-notoserifcjksc">人类参与者被要求在这项任务上花费不超过</text><text x="283.89" y="487.22" font-size="11.00" class="sc-loraregular">2</text><text x="292.69" y="487.22" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="306.59" y="487.22" font-size="11.00" class="sc-loraregular">3</text><text x="315.61" y="487.22" font-size="11.00" class="sc-notoserifcjksc">小时。模型获得了</text><text x="406.50" y="487.22" font-size="11.00" class="sc-loraregular">2</text><text x="415.30" y="487.22" font-size="11.00" class="sc-notoserifcjksc">小时的工具调用预算、</text><text x="72.00" y="502.84" font-size="11.00" class="sc-loraregular">GPU</text><text x="98.20" y="502.84" font-size="11.00" class="sc-notoserifcjksc">使用权限，以及</text><text x="178.10" y="502.84" font-size="11.00" class="sc-loraregular">100</text><text x="198.65" y="502.84" font-size="11.00" class="sc-notoserifcjksc">万个</text><text x="223.55 227.80 234.24 240.07 246.03" y="502.84" font-size="11.00" class="sc-loraregular">token</text><text x="255.60" y="502.84" font-size="11.00" class="sc-notoserifcjksc">的额度，并在配有标准科学计算</text><text x="412.49 419.33 425.19 429.45 436.03 442.47" y="502.84" font-size="11.00" class="sc-loraregular">Python</text><text x="452.04" y="502.84" font-size="11.00" class="sc-notoserifcjksc">库的容器化环境中</text><text x="72.00" y="518.46" font-size="11.00" class="sc-notoserifcjksc">运行。模型还被要求生成一份自包含的</text><text x="261.89" y="518.46" font-size="11.00" class="sc-loraregular">HTML</text><text x="296.86" y="518.46" font-size="11.00" class="sc-notoserifcjksc">报告，说明其方法和发现。我们将产出发送给</text><text x="72.00" y="534.08" font-size="11.00" class="sc-loraregular">Dyno</text><text x="99.11" y="534.08" font-size="11.00" class="sc-notoserifcjksc">，按与人类候选人相同的评分细则评分。我们从每个模型在该任务上的运行中采样了</text><text x="509.01" y="534.08" font-size="11.00" class="sc-loraregular">8</text><text x="518.08" y="534.08" font-size="11.00" class="sc-notoserifcjksc">次尝</text><text x="72.00" y="549.70" font-size="11.00" class="sc-notoserifcjksc">试。</text><text x="72.00" y="600.56" font-size="11.00" class="sc-notoserifcjksc">产出按</text><text x="107.89" y="600.56" font-size="11.00" class="sc-loraregular">2</text><text x="116.69" y="600.56" font-size="11.00" class="sc-notoserifcjksc">项指标评分：预测得分（在留出测试集上，模型预测与功能真值之间的斯皮尔曼相关系</text><text x="72.00" y="616.18" font-size="11.00" class="sc-notoserifcjksc">数）和设计得分（所提出的最佳序列的功能真值）。我们还发现，排名前</text><text x="426.89" y="616.18" font-size="11.00" class="sc-loraregular">5%</text><text x="445.35" y="616.18" font-size="11.00" class="sc-notoserifcjksc">的序列的预测得</text><text x="72.00" y="631.80" font-size="11.00" class="sc-notoserifcjksc">分，以及所有设计序列的设计得分中位数，能够更有效地凸显近期模型之间的差异；下文将报告</text><text x="72.00" y="647.42" font-size="11.00" class="sc-notoserifcjksc">这些结果。</text><text x="72.00" y="713.91" font-size="11.00" class="sc-notoserifcjksc">我们还评估了一种上下文内迭代条件。每个模型都获得了</text><text x="349.89" y="713.91" font-size="11.00" class="sc-loraregular">8</text><text x="358.97" y="713.91" font-size="11.00" class="sc-notoserifcjksc">份来自此前</text><text x="416.86 424.55 427.54 433.15 439.72 446.30 452.26 455.15 465.08 470.95 475.20 481.79 488.23 493.32 496.21 502.88 507.57 513.47 519.03 522.12 528.04" y="713.91" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00" y="729.53" font-size="11.00" class="sc-notoserifcjksc">尝试的</text><text x="107.89" y="729.53" font-size="11.00" class="sc-loraregular">HTML</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p024.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 24 页"><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">报告及对应得分，并被要求改进这些方法。模型获得了</text><text x="338.89 344.56" y="82.61" font-size="11.00" class="sc-loraregular">24</text><text x="353.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">小时的工具调用预算和</text><text x="466.31" y="82.61" font-size="11.00" class="sc-loraregular">200</text><text x="488.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">万个</text><text x="72.00 76.26 82.69 88.52 94.48" y="98.23" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的预算；所有模型都获得相同的</text><text x="260.95 270.88 276.74 281.00 287.59 294.02 299.12 302.01 308.68 313.36 319.27 324.82 327.92 333.83" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="345.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">报告，以确保上下文材料保持一致。结</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果与无上下文基线一并报告。这一条件不能直接与人类基线比较，因为人类参与者未获提供先前</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">尝试的材料。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89" y="195.95" font-size="11.00" class="sc-notoserifcjksc">这项评估可以作为模型设计新型生物序列能力的早期指标。此类设计是许多威胁路径常见的</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">上游输入，例如增强病原体或设计新型毒素，因此设计能力的进步会同时增加所有这些路径的风</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">险。同样，上下文学习变体或许能够评估模型从先前尝试中学习的能力，这项技能与一系列设计</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">工作的迭代过程相关。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们定义了</text><text x="231.79" y="325.49" font-size="11.00" class="sc-loraregular">2</text><text x="240.59" y="325.49" font-size="11.00" class="sc-notoserifcjksc">个显著能力判定基准。若模型的平均表现超过人类参与者的第</text><text x="72.00" y="341.11" font-size="11.00" class="sc-loraregular">75</text><text x="85.96" y="341.11" font-size="11.00" class="sc-notoserifcjksc">百分位，就超过了第</text><text x="187.85" y="341.11" font-size="11.00" class="sc-loraregular">1</text><text x="194.75" y="341.11" font-size="11.00" class="sc-notoserifcjksc">个基准；若模型的平均表现超过表现最好的人类参与者，就超过了第</text><text x="527.64" y="341.11" font-size="11.00" class="sc-loraregular">2</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">个基准。为与此前系统卡保持一致，并与激励和评估人类表现的方式相匹配，我们将这些基准应</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">用于原始预测得分和设计得分：前者是所有序列的预测值与真值之间的斯皮尔曼相关系数，后者</text><text x="72.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">是最佳序列的设计得分。</text><text x="72.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">对于设计得分中位数和排名前</text><text x="217.89" y="471.22" font-size="11.00" class="sc-loraregular">5%</text><text x="236.35" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的序列的斯皮尔曼相关系数，我们没有另设显著能力判定基</text><text x="72.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">准，而是用它们来提供有关模型表现与能力的定性认识。</text><text x="72.00" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89" y="535.99" font-size="11.00" class="sc-notoserifcjksc">在最佳序列的设计得分上，</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.03 305.74" y="535.99" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="314.63" y="535.99" font-size="11.00" class="sc-notoserifcjksc">超过了第</text><text x="361.52" y="535.99" font-size="11.00" class="sc-loraregular">1</text><text x="368.42" y="535.99" font-size="11.00" class="sc-notoserifcjksc">个基准。它的设计得分中位数高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="551.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="551.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.85 188.53 191.53 197.14 203.70 210.28 216.24 219.14 227.87 234.44 241.00 246.10 248.99" y="551.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="254.99" y="551.61" font-size="11.00" class="sc-notoserifcjksc">。在预测任务中，</text><text x="342.98" y="551.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="390.43" y="551.61" font-size="11.00" class="sc-notoserifcjksc">的表现优于</text><text x="448.32 458.25 464.12 468.37 474.96 481.40 486.49 489.38 495.38 498.08" y="551.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="502.09" y="551.61" font-size="11.00" class="sc-notoserifcjksc">。我们</text><text x="72.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc">的结论是，</text><text x="127.00" y="567.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44" y="567.23" font-size="11.00" class="sc-notoserifcjksc">在这项任务上的表现达到或超过此前最强的模型，并且在中程黑盒生物序列</text><text x="72.00" y="582.85" font-size="11.00" class="sc-notoserifcjksc">设计与预测方面，能够与美国人才市场中表现最出色的人才竞争。</text><text x="72.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">包括</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="665.52" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="182.24" y="665.52" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.24 200.93 203.92 209.53 216.10 222.68 228.64 231.53 237.77 244.21 250.88 257.56 263.44 267.70 270.59" y="665.52" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.48" y="665.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.38" y="665.52" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="332.12" y="665.52" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型，除预测得分（全部）外，</text><text x="72.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">其余每项指标都受益于上下文内迭代；在预测得分（全部）上，这种迭代的影响很小或为负。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="696.76" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="696.76" font-size="11.00" class="sc-notoserifcjksc">打破了这一趋势，在所有指标上都受益于上下文内迭代。</text><text x="403.66" y="696.76" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="451.10" y="696.76" font-size="11.00" class="sc-notoserifcjksc">在大多数任务（最</text><text x="72.00" y="712.38" font-size="11.00" class="sc-notoserifcjksc">佳设计</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">得分、设计得分中位数，或所有序列的预测得分）中，并未因获得先前报告而有所改进。不过，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它在高分序列的预测方面似乎有明显改进。这些发现表明，</text><text x="358.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="405.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在长程科学任务中迭代改进</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="168.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="182.74 192.67 198.53 202.79 209.38 215.81 220.91 223.80 229.79 232.50" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="239.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相近；不过，对于它在</text><text x="352.29" y="113.85" font-size="11.00" class="sc-loraregular">4</text><text x="361.15" y="113.85" font-size="11.00" class="sc-notoserifcjksc">项任务中的</text><text x="419.04" y="113.85" font-size="11.00" class="sc-loraregular">3</text><text x="428.06" y="113.85" font-size="11.00" class="sc-notoserifcjksc">项未见改进这一现象，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">我们的解释是：未获先前材料的</text><text x="228.89" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.34" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在这些任务上的得分已经足够高，以至于我们无法有效</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">检测它在上下文中学习的能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">26</text><text x="72.00" y="592.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 118.31 120.41 125.95" y="592.92" font-size="9.00" class="sc-lorabold">2.2.3.2.1.A]</text><text x="131.79" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">黑盒</text><text x="152.15 158.33 165.14" y="592.92" font-size="9.00" class="sc-lorabold">RNA</text><text x="173.52" y="592.92" font-size="9.00" class="sc-notoserifcjkscbold">序列设计。</text><text x="218.52" y="592.92" font-size="9.00" class="sc-loraregular">RNA</text><text x="239.03" y="592.92" font-size="9.00" class="sc-notoserifcjksc">序列设计任务的结果；每个模型尝试</text><text x="385.40" y="592.92" font-size="9.00" class="sc-loraregular">8</text><text x="392.82" y="592.92" font-size="9.00" class="sc-notoserifcjksc">次。每个点代表一次尝试，水平线表</text><text x="72.00" y="604.62" font-size="9.00" class="sc-notoserifcjksc">示均值。整张图中的阴影带标示人类表现的百分位。</text><text x="279.00" y="604.62" font-size="9.00" class="sc-notoserifcjkscbold">上排：</text><text x="306.00" y="604.62" font-size="9.00" class="sc-notoserifcjksc">设计得分（最佳）和设计得分（中位数）分别评估最佳设计</text><text x="72.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">序列和典型设计序列。</text><text x="162.00" y="616.33" font-size="9.00" class="sc-notoserifcjkscbold">中排：</text><text x="189.00" y="616.33" font-size="9.00" class="sc-notoserifcjksc">预测得分（全部）和预测得分（高分序列）分别表示在所有序列和高分序列上，模型预测</text><text x="72.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">活性与实测活性之间的秩相关。</text><text x="198.00" y="628.03" font-size="9.00" class="sc-notoserifcjkscbold">下排：</text><text x="225.00" y="628.03" font-size="9.00" class="sc-notoserifcjksc">将预测得分与设计得分作为两轴绘图。每个十字形标记以均值为中心，显示数据</text><text x="72.00" y="639.72" font-size="9.00" class="sc-notoserifcjksc">的完整取值范围。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p027.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 27 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">27</text><text x="72.00" y="609.12" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="609.12" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 118.31 120.41 125.95" y="609.12" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">2.2.3.2.1.B]</text><text x="131.79" y="609.12" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">黑盒</text><text x="152.15 158.33 165.14" y="609.12" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">RNA</text><text x="173.52" y="609.12" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">序列设计：提供先前报告。</text><text x="281.52" y="609.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">任务与指标均与上一张图相同。每个模型展示</text><text x="463.89" y="609.12" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">2</text><text x="471.09" y="609.12" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">种情况：未提供</text><text x="72.00" y="620.82" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">先前报告（圆点），以及在上下文中提供先前报告（三角形，</text><text x="315.00" y="620.82" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">“+</text><text x="325.74" y="620.82" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">先前材料</text><text x="361.74" y="620.82" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">”</text><text x="364.88" y="620.82" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">），每个模型在每种情况下均尝试</text><text x="502.24" y="620.82" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="509.67" y="620.82" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次；水</text><text x="72.00" y="632.52" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">平线表示各次尝试的均值。此处省略了人类基线；提供先前报告的条件无法与人类参与者直接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p028.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 28 页"><text x="90.00" y="297.56" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="313.75" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="362.33" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">28</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67 112.58 115.47 122.86 129.32" y="82.61" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.2 AAV</text><text x="139.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">衣壳包装预测</text><text x="72.00" y="102.80" font-size="11.00" class="sc-notoserifcjksc">与黑盒</text><text x="107.89" y="102.80" font-size="11.00" class="sc-loraregular">RNA</text><text x="132.96" y="102.80" font-size="11.00" class="sc-notoserifcjksc">任务不同，此处的生物学背景是已知的，预测针对的是具有治疗相关性的真实测量</text><text x="72.00" y="118.42" font-size="11.00" class="sc-notoserifcjksc">值：模型会被告知，它正在对</text><text x="217.89 225.29 231.74" y="118.42" font-size="11.00" class="sc-loraregular">AAV</text><text x="241.82" y="118.42" font-size="11.00" class="sc-notoserifcjksc">衣壳组装进行推理，并应运用病毒包装文献中的先验知识。这</text><text x="72.00" y="134.04" font-size="11.00" class="sc-notoserifcjksc">是一项复杂的完整病毒粒子预测任务的最简版本；该任务要求具备预测蛋白质相互作用、细胞内</text><text x="72.00" y="149.66" font-size="11.00" class="sc-notoserifcjksc">转运、基因组完整性与表达等特征，以及许多其他已知和未知特征的能力。</text><text x="72.00" y="232.34" font-size="11.00" class="sc-notoserifcjksc">模型未获得针对测试序列的带标签训练数据，只能向</text><text x="327.89" y="232.34" font-size="11.00" class="sc-loraregular">Dyno</text><text x="357.90" y="232.34" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="371.79 379.48 385.16 391.84 397.51 402.46 408.27 411.16 418.05 424.66" y="232.34" font-size="11.00" class="sc-loraregular">Canary API</text><text x="431.24" y="232.34" font-size="11.00" class="sc-notoserifcjksc">提交</text><text x="456.13" y="232.34" font-size="11.00" class="sc-loraregular">1</text><text x="463.03" y="232.34" font-size="11.00" class="sc-notoserifcjksc">次预测，预测短</text><text x="72.00" y="247.96" font-size="11.00" class="sc-notoserifcjksc">序列插入特定</text><text x="140.89 148.29 154.74" y="247.96" font-size="11.00" class="sc-loraregular">AAV</text><text x="164.82" y="247.96" font-size="11.00" class="sc-notoserifcjksc">血清型后的包装概率，没有迭代机会。我们评估了</text><text x="409.71" y="247.96" font-size="11.00" class="sc-loraregular">3</text><text x="418.73" y="247.96" font-size="11.00" class="sc-notoserifcjksc">种资源条件：</text><text x="108.00" y="297.11" font-size="11.00" class="sc-notoserifcjkscbold">纯推理（不用工具）</text><text x="207.00" y="297.11" font-size="11.00" class="sc-notoserifcjksc">：既无蛋白质语言模型，也无训练语料；</text><text x="108.00" y="313.30" font-size="11.00" class="sc-notoserifcjkscbold">提供预训练蛋白质语言模型（</text><text x="251.00 257.96 264.61" y="313.30" font-size="11.00" class="sc-lorabold">PLM</text><text x="275.30" y="313.30" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="286.30" y="313.30" font-size="11.00" class="sc-notoserifcjksc">：具体而言，可使用</text><text x="388.19 395.03 401.27 411.19 416.22" y="313.30" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="422.13" y="313.30" font-size="11.00" class="sc-notoserifcjksc">，以测试模型能否通过</text><text x="108.00" y="328.92" font-size="11.00" class="sc-notoserifcjksc">生物物理学推理改进</text><text x="209.89 216.50 222.86" y="328.92" font-size="11.00" class="sc-loraregular">PLM</text><text x="235.85" y="328.92" font-size="11.00" class="sc-notoserifcjksc">的预测；以及</text><text x="108.00" y="361.87" font-size="11.00" class="sc-notoserifcjkscbold">自行训练</text><text x="152.00" y="361.87" font-size="11.00" class="sc-notoserifcjksc">：不提供预训练</text><text x="231.89 238.50 244.86" y="361.87" font-size="11.00" class="sc-loraregular">PLM</text><text x="254.96" y="361.87" font-size="11.00" class="sc-notoserifcjksc">，但提供清洗后的公开语料，并指示模型在算力预算内训练</text><text x="108.00 114.61 120.97" y="377.49" font-size="11.00" class="sc-loraregular">PLM</text><text x="131.07" y="377.49" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="410.45" font-size="11.00" class="sc-notoserifcjksc">条件</text><text x="96.89" y="410.45" font-size="11.00" class="sc-loraregular">3</text><text x="105.91" y="410.45" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="130.81" y="410.45" font-size="11.00" class="sc-loraregular">3</text><text x="139.83" y="410.45" font-size="11.00" class="sc-notoserifcjksc">种语料分别运行：</text><text x="227.83 234.49 239.18 245.61 249.87 255.83 258.92 265.47 273.84 279.65 289.48 292.37 299.77 306.22" y="410.45" font-size="11.00" class="sc-loraregular">ProteinGym AAV</text><text x="316.30" y="410.45" font-size="11.00" class="sc-notoserifcjksc">训练语料中的公开</text><text x="407.19 414.58 421.04" y="410.45" font-size="11.00" class="sc-loraregular">AAV</text><text x="431.12" y="410.45" font-size="11.00" class="sc-notoserifcjksc">序列（需要强调的</text><text x="72.00" y="426.07" font-size="11.00" class="sc-notoserifcjksc">是，这些序列对应另一种</text><text x="195.89 203.28 209.74" y="426.07" font-size="11.00" class="sc-loraregular">AAV</text><text x="219.82" y="426.07" font-size="11.00" class="sc-notoserifcjksc">血清型）、</text><text x="274.82 281.00 289.81 292.90 298.00 303.09 308.47 315.13 319.82 326.25" y="426.07" font-size="11.00" class="sc-loraregular">Swiss-Prot</text><text x="330.51" y="426.07" font-size="11.00" class="sc-notoserifcjksc">，以及两者的组合，因此每个模型共有</text><text x="520.40" y="426.07" font-size="11.00" class="sc-loraregular">5</text><text x="529.29" y="426.07" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="441.69" font-size="11.00" class="sc-notoserifcjksc">实验组。</text><text x="72.00" y="475.22" font-size="11.00" class="sc-notoserifcjksc">模型获得了野生型衣壳序列、按实际耗时计的</text><text x="294.89 300.56" y="475.22" font-size="11.00" class="sc-loraregular">24</text><text x="309.41" y="475.22" font-size="11.00" class="sc-notoserifcjksc">小时工具调用预算、单张</text><text x="433.31" y="475.22" font-size="11.00" class="sc-loraregular">H100 GPU</text><text x="485.75" y="475.22" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="496.75" y="475.22" font-size="11.00" class="sc-loraregular">200</text><text x="519.22" y="475.22" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00" y="490.84" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="85.89 90.15 96.58 102.42 108.38" y="490.84" font-size="11.00" class="sc-loraregular">token</text><text x="117.95" y="490.84" font-size="11.00" class="sc-notoserifcjksc">的额度和标准机器学习库，无法访问互联网；同时被要求迭代改进解决方案，直到确信</text><text x="72.00" y="506.46" font-size="11.00" class="sc-notoserifcjksc">进一步迭代也无法再提升表现。对于每个模型在每种条件下的运行，我们采样了</text><text x="459.89" y="506.46" font-size="11.00" class="sc-loraregular">8</text><text x="468.97" y="506.46" font-size="11.00" class="sc-notoserifcjksc">次尝试。预测</text><text x="72.00" y="522.08" font-size="11.00" class="sc-notoserifcjksc">结果依据二元包装真值标签，使用</text><text x="239.89 246.57 254.84 261.75 270.48" y="522.08" font-size="11.00" class="sc-loraregular">AUROC</text><text x="281.07" y="522.08" font-size="11.00" class="sc-notoserifcjksc">评分，并以直接使用</text><text x="382.96 389.80 396.04 405.96 410.99" y="522.08" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="419.79" y="522.08" font-size="11.00" class="sc-notoserifcjksc">的结果作为参考基线。</text><text x="72.00" y="588.56" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89" y="588.56" font-size="11.00" class="sc-notoserifcjksc">这项评估可以作为模型预测新型病毒衣壳序列特性能力的早期指标；它是必要但不充分的指</text><text x="72.00" y="604.18" font-size="11.00" class="sc-notoserifcjksc">标。这种预测能力是一系列设计工作中的必要组成部分；在旨在改善更复杂病毒特性的实验环境</text><text x="72.00" y="619.80" font-size="11.00" class="sc-notoserifcjksc">中，它可以充当筛选手段，提高有望命中目标的尝试所占比例。它是预测更具挑战性、对治疗更</text><text x="72.00" y="635.42" font-size="11.00" class="sc-notoserifcjksc">有参考价值的衣壳功能的第一步，例如全身生物分布、与细胞表面暴露受体的功能性结合，以及</text><text x="72.00" y="651.04" font-size="11.00" class="sc-notoserifcjksc">细胞转导。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p029.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 29 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">29</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89" y="98.80" font-size="11.00" class="sc-notoserifcjksc">如果模型在纯推理条件下的平均</text><text x="330.79 337.46 345.73 352.64 361.38" y="98.80" font-size="11.00" class="sc-loraregular">AUROC</text><text x="371.96" y="98.80" font-size="11.00" class="sc-notoserifcjksc">超过直接使用</text><text x="440.85 447.69 453.93 463.85 468.88" y="98.80" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="477.68" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的结果，即</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型仅凭领域知识就能胜过预训练蛋白质语言模型，则超过这一基准。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="179.76" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="179.76" font-size="11.00" class="sc-notoserifcjksc">超过了显著能力的判定基准，并且在每种条件下都与</text><text x="438.52 446.21 449.20 454.81 461.38 467.96 473.92 476.81 486.74 492.61 496.86 503.45 509.89 514.98 517.87 523.87 526.57" y="179.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="195.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="162.93" y="195.38" font-size="11.00" class="sc-notoserifcjksc">相当；所有差异均小于</text><text x="275.82 282.47 285.02 291.85" y="195.38" font-size="11.00" class="sc-loraregular">0.01</text><text x="295.85" y="195.38" font-size="11.00" class="sc-notoserifcjksc">，上述每个模型都远高于单独使用</text><text x="463.74 470.59 476.82 486.74 491.77" y="195.38" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="500.57" y="195.38" font-size="11.00" class="sc-notoserifcjksc">的结果</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.65 92.25 98.61 104.97" y="211.00" font-size="11.00" class="sc-loraregular">0.699</text><text x="111.32" y="211.00" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="529.34" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">[</text><text x="75.47" y="529.34" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 119.46 121.55 127.09 130.56 132.93 139.16 144.47" y="529.34" font-size="9.00" class="sc-lorabold" fill="#1d1d1f">2.2.3.2.2.A] AAV</text><text x="153.21" y="529.34" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1d1f">衣壳包装预测。</text><text x="216.21 222.26 227.54" y="529.34" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">AAV</text><text x="235.78" y="529.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">衣壳评估的任务</text><text x="301.15" y="529.34" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">1</text><text x="304.43" y="529.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">：模型按包装率对衣壳变体进行分类，以</text><text x="468.79 474.26 481.02 486.68 493.82" y="529.34" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">AUROC</text><text x="502.48" y="529.34" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">评分。</text><text x="529.48" y="529.34" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">5</text><text x="72.00" y="541.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">种条件的区别在于向模型提供的训练语料，以及</text><text x="263.37 268.97 274.07 282.19 286.30" y="541.04" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">ESM-2</text><text x="293.50" y="541.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">蛋白质语言模型是否可用作工具（详见上文第</text><text x="475.87" y="541.04" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">2.2.3.2.2</text><text x="511.43" y="541.04" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">节）。</text><text x="72.00" y="552.74" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">箱线图展示每个模型在每种条件下</text><text x="209.37" y="552.74" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">8</text><text x="216.79" y="552.74" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次独立尝试的分布；点表示单次运行。虚线标示直接使用</text><text x="444.16 449.76 454.86 462.98 467.09" y="552.74" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">ESM-2</text><text x="474.29" y="552.74" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">的参考基线。这</text><text x="72.00" y="564.44" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">项任务没有人类参与者基线。</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67 112.80 115.69 123.08 129.54" y="623.40" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.3 AAV</text><text x="139.62" y="623.40" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">包装率自动研究评估</text><text x="72.00" y="643.59" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89 116.09 121.90 128.57 135.01 137.90 144.94 151.53 157.49 162.18 167.85 174.42 180.38 186.95 191.21 194.30 200.15" y="643.59" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="208.14" y="643.59" font-size="11.00" class="sc-notoserifcjksc">合作，构建了一项预测</text><text x="321.03 328.42 334.88" y="643.59" font-size="11.00" class="sc-loraregular">AAV</text><text x="344.95" y="643.59" font-size="11.00" class="sc-notoserifcjksc">衣壳包装率的新评估，以更好地测量模</text><text x="72.00" y="659.21" font-size="11.00" class="sc-notoserifcjksc">型开发在分布外样本上表现出色的生物学预测器的能力。</text><text x="347.00" y="659.21" font-size="11.00" class="sc-loraregular">Dyno</text><text x="377.01" y="659.21" font-size="11.00" class="sc-notoserifcjksc">围绕经过修饰的</text><text x="456.90 464.29 470.75" y="659.21" font-size="11.00" class="sc-loraregular">AAV</text><text x="480.83" y="659.21" font-size="11.00" class="sc-notoserifcjksc">衣壳蛋白质</text><text x="72.00" y="674.83" font-size="11.00" class="sc-notoserifcjksc">序列构建了</text><text x="129.89" y="674.83" font-size="11.00" class="sc-loraregular">6</text><text x="139.14" y="674.83" font-size="11.00" class="sc-notoserifcjksc">项挑战（与第</text><text x="208.04" y="674.83" font-size="11.00" class="sc-loraregular">2.2.3.2.2</text><text x="251.51" y="674.83" font-size="11.00" class="sc-notoserifcjksc">节描述的类似），每项挑战均有一个包含</text><text x="452.40 458.40 461.00 467.83 474.67" y="674.83" font-size="11.00" class="sc-loraregular">5,000</text><text x="484.40" y="674.83" font-size="11.00" class="sc-notoserifcjksc">条带标签序</text><text x="72.00" y="690.45" font-size="11.00" class="sc-notoserifcjksc">列的训练集，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些序列对应在</text><text x="151.89 159.29 165.74" y="82.61" font-size="11.00" class="sc-loraregular">AAV</text><text x="175.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">衣壳中插入短序列的情况，另有一个包含</text><text x="376.71 380.71 383.49 387.49 394.32" y="82.61" font-size="11.00" class="sc-loraregular">1,100</text><text x="404.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">条序列的验证集。每个浮点</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">数标签都是对该序列相对于基线（野生型）衣壳序列的包装富集程度进行的真实测量。根据插入</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">序列修饰的是基础血清型中的哪个区域，这</text><text x="283.89" y="113.85" font-size="11.00" class="sc-loraregular">6</text><text x="293.14" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个数据集分为</text><text x="362.04" y="113.85" font-size="11.00" class="sc-loraregular">2</text><text x="370.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">组，每组</text><text x="417.73" y="113.85" font-size="11.00" class="sc-loraregular">3</text><text x="426.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个；我们将这两个区域</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">标记为</text><text x="105.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="109.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">区域</text><text x="134.29 140.60" y="129.47" font-size="11.00" class="sc-loraregular">A”</text><text x="144.43" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="155.43" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="159.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">区域</text><text x="184.73" y="129.47" font-size="11.00" class="sc-loraregular">B”</text><text x="195.41" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，我们向模型提供来自区域</text><text x="272.89" y="179.76" font-size="11.00" class="sc-loraregular">B</text><text x="282.63" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的带标签训练集，并允许它提交一个根据输入序列预</text><text x="72.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">测标签的</text><text x="118.89 125.72 131.59 135.84 142.43 148.87" y="195.38" font-size="11.00" class="sc-loraregular">Python</text><text x="158.44" y="195.38" font-size="11.00" class="sc-notoserifcjksc">函数。每次提交后，模型都会被告知，其预测值与真实标签在一个同时包含区</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">域</text><text x="85.89" y="211.00" font-size="11.00" class="sc-loraregular">A</text><text x="95.67" y="211.00" font-size="11.00" class="sc-notoserifcjksc">和区域</text><text x="131.57" y="211.00" font-size="11.00" class="sc-loraregular">B</text><text x="141.30" y="211.00" font-size="11.00" class="sc-notoserifcjksc">序列的验证集上的斯皮尔曼相关系数。模型可以通过</text><text x="397.19" y="211.00" font-size="11.00" class="sc-loraregular">50</text><text x="412.91" y="211.00" font-size="11.00" class="sc-notoserifcjksc">次这样的提交查询得分，</text><text x="72.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">之后必须提交最终预测器。模型会被告知，评分将同时涵盖区域</text><text x="382.89" y="226.62" font-size="11.00" class="sc-loraregular">A</text><text x="392.67" y="226.62" font-size="11.00" class="sc-notoserifcjksc">插入序列和区域</text><text x="472.57" y="226.62" font-size="11.00" class="sc-loraregular">B</text><text x="482.30" y="226.62" font-size="11.00" class="sc-notoserifcjksc">插入序列，</text><text x="72.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">但不会获得任何区域</text><text x="173.89" y="242.24" font-size="11.00" class="sc-loraregular">A</text><text x="183.67" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的序列示例，连无标签示例也没有。在会话结束时，我们使用区域</text><text x="505.57" y="242.24" font-size="11.00" class="sc-loraregular">A</text><text x="515.34" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的留</text><text x="72.00" y="257.86" font-size="11.00" class="sc-notoserifcjksc">出测试集为模型的最终预测器评分，以验证它并非只是简单地过拟合了验证集。</text><text x="72.00" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89" y="341.68" font-size="11.00" class="sc-notoserifcjksc">如上所示，我们发现，近期的前沿</text><text x="264.79 272.48 275.47 281.08 287.64 294.22" y="341.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="303.08" y="341.68" font-size="11.00" class="sc-notoserifcjksc">模型在第</text><text x="349.97" y="341.68" font-size="11.00" class="sc-loraregular">2.2.3.2.2</text><text x="393.44" y="341.68" font-size="11.00" class="sc-notoserifcjksc">节所述的</text><text x="440.34 447.73 454.18" y="341.68" font-size="11.00" class="sc-loraregular">AAV</text><text x="464.26" y="341.68" font-size="11.00" class="sc-notoserifcjksc">包装率分类任</text><text x="72.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">务上表现相近，而这一基线评估可能无法充分区分我们能力最强的模型的生物学研究技能。</text><text x="72.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">因此，我们将相同的数据表述为一个回归问题，构建了一项新的泛化挑战，要求模型提出科学假</text><text x="72.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">设，在有限预算和稀疏数据的条件下检验这些假设，并从少量实验迭代中学习。这种设置更接近</text><text x="72.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">现实世界中的开放式研究问题：模型试图提出能够泛化到某些序列区域的科学论点，而这些区域</text><text x="72.00" y="485.69" font-size="11.00" class="sc-notoserifcjksc">的训练数据稀疏、间接，甚至完全缺失。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89" y="552.18" font-size="11.00" class="sc-notoserifcjksc">由于这一具体任务是新的，且其绝对表现上限也未知，因此没有可以直接比</text><text x="72.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">较的数值基准。我们关注不同模型在这项任务上的表现比较，以及随着模型向打分器查询的次数</text><text x="72.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">增加，不同模型的分布外得分提升速率呈现怎样的趋势。</text><text x="72.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">为了校准对这项任务得分的解读，我们在更容易的情境下评估了模型的行为，以建立合理的表现</text><text x="72.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">上下界。在区域</text><text x="151.89" y="681.14" font-size="11.00" class="sc-loraregular">A</text><text x="161.67" y="681.14" font-size="11.00" class="sc-notoserifcjksc">中，仅将</text><text x="208.57 215.41 221.64 231.57 236.59" y="681.14" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="245.39" y="681.14" font-size="11.00" class="sc-notoserifcjksc">直接应用于这一回归问题，斯皮尔曼相关系数为</text><text x="479.29 485.94 488.65 494.55" y="681.14" font-size="11.00" class="sc-loraregular">0.28</text><text x="500.74" y="681.14" font-size="11.00" class="sc-notoserifcjksc">，而加</text><text x="72.00" y="696.76" font-size="11.00" class="sc-notoserifcjksc">入分布内带标签训练数据后，得分会</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p031.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 31 页"><text x="90.00" y="212.60" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="244.99" font-size="11.00" class="sc-loraregular">2.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">31</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提高到至少</text><text x="129.89 136.55 139.25" y="82.61" font-size="11.00" class="sc-loraregular">0.5</text><text x="145.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。由于区域</text><text x="203.14" y="82.61" font-size="11.00" class="sc-loraregular">A</text><text x="212.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="226.81" y="82.61" font-size="11.00" class="sc-loraregular">70%</text><text x="251.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的序列无法包装，根据实际经验，富集得分更难测量，也更</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">难排序。在所有使用区域</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="205.67" y="98.23" font-size="11.00" class="sc-notoserifcjksc">数据进行训练、且未使用蛋白质语言模型的监督学习运行中，最佳单</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次尝试得分为</text><text x="140.89 147.55 150.25 156.25 162.43" y="113.85" font-size="11.00" class="sc-loraregular">0.586</text><text x="168.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，我们观察到有一次尝试达到了</text><text x="325.68 332.34 335.04 341.04 347.22" y="113.85" font-size="11.00" class="sc-loraregular">0.586</text><text x="353.58" y="113.85" font-size="11.00" class="sc-notoserifcjksc">；我们保守地将这一得分解读为这项任</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">务可能的上限。</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">基于这一校准，我们参照</text><text x="195.89" y="179.76" font-size="11.00" class="sc-loraregular">2</text><text x="204.69" y="179.76" font-size="11.00" class="sc-notoserifcjksc">个关键特征来评估模型在此任务上的表现：</text><text x="108.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">模型在未见过的验证集上达到斯皮尔曼相关系数</text><text x="341.89 348.55 351.25" y="212.15" font-size="11.00" class="sc-loraregular">0.5</text><text x="360.14" y="212.15" font-size="11.00" class="sc-notoserifcjksc">这一参考值所需的打分器调用次数；</text><text x="108.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">模型的各次尝试中，明显超过参考值的尝试所占比例；为此，我们将阈值设为</text><text x="484.89 491.55 494.25 500.25" y="244.53" font-size="11.00" class="sc-loraregular">0.52</text><text x="506.16" y="244.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这些特征是启发式指标，用于反映模型自主设计高信息量实验、综合研究发现，以及在具有挑战</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">性的回归任务上迭代改进表现的能力。</text><text x="72.00" y="637.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 119.70 121.80 127.33 130.81 133.17 139.40 144.71" y="637.00" font-size="9.00" class="sc-lorabold">2.2.3.2.3.A] AAV</text><text x="153.45" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">包装率预测的自主研究</text><text x="243.45" y="637.00" font-size="9.00" class="sc-notoserifcjksc">。趋势线表示各次独立尝试（</text><text x="360.45" y="637.00" font-size="9.00" class="sc-loraregular">n = 48</text><text x="385.35" y="637.00" font-size="9.00" class="sc-notoserifcjksc">）中验证集表现的第</text><text x="468.72" y="637.00" font-size="9.00" class="sc-loraregular">90</text><text x="481.88" y="637.00" font-size="9.00" class="sc-notoserifcjksc">百分位。我们</text><text x="72.00" y="648.70" font-size="9.00" class="sc-notoserifcjksc">发现，能力更强的模型只需少量调用打分器，就能迅速改进。直接使用</text><text x="353.37 358.96 364.07 372.19 376.30" y="648.70" font-size="9.00" class="sc-loraregular">ESM-2</text><text x="383.50" y="648.70" font-size="9.00" class="sc-notoserifcjksc">得到的斯皮尔曼相关系数为</text><text x="493.87 499.31 501.52 506.36" y="648.70" font-size="9.00" class="sc-loraregular">0.28</text><text x="511.42" y="648.70" font-size="9.00" class="sc-notoserifcjksc">（为保</text><text x="72.00" y="660.40" font-size="9.00" class="sc-notoserifcjksc">留趋势线的动态范围，图中未显示）。</text><text x="225.00" y="660.40" font-size="9.00" class="sc-notoserifcjkscbold">右图</text><text x="243.00" y="660.40" font-size="9.00" class="sc-notoserifcjksc">：会话过程中，超过</text><text x="326.37 331.81 334.03 338.93" y="660.40" font-size="9.00" class="sc-loraregular">0.52</text><text x="346.13" y="660.40" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试所占的累计比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p032.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 32 页"><text x="72.00 78.39 88.44 97.50 100.93 108.78 112.21" y="333.87" font-size="13.00" class="sc-poppinsmedium" fill="#666666">(CAISI)</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="196.52 204.21 207.20 212.81 219.38 225.96 231.92 234.81 243.55 250.11 256.68 261.77 264.67" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="273.55" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="287.45 295.14 298.13 303.74 310.30 316.88 322.84 325.74 335.67 341.53 345.79 352.38 358.81 363.91 366.80 372.79 375.50" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="382.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一样，在调用打分器不到</text><text x="506.29" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="520.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">时，就达到</text><text x="129.89 136.55 139.25 145.25" y="98.23" font-size="11.00" class="sc-loraregular">0.50</text><text x="154.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的参考值。</text><text x="209.97" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="257.42" y="98.23" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="282.31 288.96 291.67 297.66" y="98.23" font-size="11.00" class="sc-loraregular">0.52</text><text x="306.47" y="98.23" font-size="11.00" class="sc-notoserifcjksc">阈值所需的打分器调用次数少于</text><text x="463.36 471.05 474.04 479.65 486.22 492.79 498.76 501.65 511.58 517.45 521.70 528.29 534.73" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。相比之下，</text><text x="150.71 158.39 161.39 167.00 173.56 180.14 186.10 189.00 195.23 201.67 208.35 215.02 220.91 225.16 228.06" y="113.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="236.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">至少需要调用打分器</text><text x="338.84" y="113.85" font-size="11.00" class="sc-loraregular">30</text><text x="354.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次才能达到参考值，而且在整个过程</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">中都未能达到阈值。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="96.89" y="195.95" font-size="11.00" class="sc-loraregular">2</text><text x="105.69" y="195.95" font-size="11.00" class="sc-notoserifcjksc">项分析中，我们计算了越过阈值的尝试所占的累计比例，并将其解读为衡量模型在此任务</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">上表现稳定性的指标。我们发现，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.14 313.85" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="322.73" y="211.57" font-size="11.00" class="sc-notoserifcjksc">在这项任务中约</text><text x="402.63" y="211.57" font-size="11.00" class="sc-loraregular">60%</text><text x="428.28" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的尝试达到了阈值。总</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">体而言，我们观察到，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 229.03 235.59 242.16 247.25 250.15 256.14 258.85" y="227.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="267.73" y="227.19" font-size="11.00" class="sc-notoserifcjksc">比参与比较的模型更早、也更频繁地达到并超过阈值，</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">表明它是这项任务中表现最强的模型。</text><text x="72.00" y="305.43" font-size="10.67" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="99.38" y="305.43" font-size="10.67" class="sc-notosanscjkscbold" fill="#666666">美国人工智能标准与创新中心（</text><text x="248.71" y="305.43" font-size="10.67" class="sc-poppinssemibold" fill="#666666">US Center for AI Standards and Innovation</text><text x="476.83" y="305.43" font-size="10.67" class="sc-notosanscjkscbold" fill="#666666">）的外部测试</text><text x="72.00" y="361.96" font-size="11.00" class="sc-notoserifcjksc">我们与隶属于美国国家标准与技术研究院（</text><text x="281.00 289.33 294.93 299.18 302.27 308.71 315.39 321.06 324.05 326.95 330.54 337.22 342.31 346.57 349.84 354.09 360.66 364.92 370.88 373.77 380.15 383.87 386.76 392.96 397.21 402.89 409.57 416.15 421.82 426.51 433.09 438.18 441.07 446.75 453.42 460.00 462.90 469.40 475.30 481.16 487.74 494.42 500.86 503.85 510.28 516.59" y="361.96" font-size="11.00" class="sc-loraregular">National Institute of Standards and Technology</text><text x="522.40" y="361.96" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="377.58" font-size="11.00" class="sc-loraregular">NIST</text><text x="97.34" y="377.58" font-size="11.00" class="sc-notoserifcjksc">）的美国人工智能标准与创新中心（</text><text x="273.34 280.92 287.81 291.49 297.73" y="377.58" font-size="11.00" class="sc-loraregular">CAISI</text><text x="301.42" y="377.58" font-size="11.00" class="sc-notoserifcjksc">）合作，测量网络安全和生物学能力及安全防护</text><text x="72.00" y="393.20" font-size="11.00" class="sc-notoserifcjksc">措施，以及非预期的模型行为。</text><text x="72.00" y="425.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.5</text><text x="105.15" y="425.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="456.96" font-size="11.00" class="sc-notoserifcjksc">我们结合自动化评估与人工测试，了解</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.03 338.74" y="456.96" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="347.63" y="456.96" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="361.52" y="456.96" font-size="11.00" class="sc-loraregular">CB</text><text x="378.94" y="456.96" font-size="11.00" class="sc-notoserifcjksc">相关的能力。我们的自动化评估</text><text x="72.00" y="472.58" font-size="11.00" class="sc-notoserifcjksc">对两用能力和能力提升的评估范围必然有限，而且经过精心筛选，以最大限度地激发特定模型能</text><text x="72.00" y="488.20" font-size="11.00" class="sc-notoserifcjksc">力，因此可能无法捕捉一般能力进步所带来的风险，这些进步会提高生物学研究的效率。同样，</text><text x="72.00" y="503.82" font-size="11.00" class="sc-notoserifcjksc">这些评估可能无法捕捉在真实研究环境中部署大语言模型的细微差别。我们的判断仍然是：即使</text><text x="72.00" y="519.44" font-size="11.00" class="sc-notoserifcjksc">对于拥有丰富大语言模型使用经验的专家研究人员，要从模型中激发出最大程度的科研能力提</text><text x="72.00" y="535.06" font-size="11.00" class="sc-notoserifcjksc">升，仍是一个充满挑战且容易出错的过程。</text><text x="72.00" y="618.88" font-size="11.00" class="sc-notoserifcjksc">在整个</text><text x="107.89" y="618.88" font-size="11.00" class="sc-loraregular">CB</text><text x="125.32" y="618.88" font-size="11.00" class="sc-notoserifcjksc">评估组合中，</text><text x="191.32 199.01 202.00 207.61 214.18 220.75 226.72 229.61 238.34 244.91 251.48 256.57 259.46 265.46 268.16" y="618.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="277.05" y="618.88" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="290.94 298.63 301.62 307.24 313.80 320.38 326.34 329.24 339.17 345.03 349.29 355.88 362.31 367.40 370.30 376.29 379.00" y="618.88" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="385.90" y="618.88" font-size="11.00" class="sc-notoserifcjksc">的能力差异较小。总体而言，我</text><text x="72.00" y="634.50" font-size="11.00" class="sc-notoserifcjksc">们预计</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="634.50" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63" y="634.50" font-size="11.00" class="sc-notoserifcjksc">将在一系列科学任务中发挥作用，其水平与</text><text x="405.52 413.21 416.20 421.81 428.38 434.96 440.92 443.81 453.74 459.61 463.86 470.45 476.89 481.98 484.87 490.87 493.57" y="634.50" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="500.47" y="634.50" font-size="11.00" class="sc-notoserifcjksc">相当或</text><text x="72.00" y="650.12" font-size="11.00" class="sc-notoserifcjksc">略高。然而，对于我们能够评估的科学任务，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 339.03 345.59 352.16 357.25 360.14 366.14 368.85" y="650.12" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="377.73" y="650.12" font-size="11.00" class="sc-notoserifcjksc">似乎并未改善</text><text x="446.63 454.32 457.31 462.92 469.48 476.06 482.02 484.92 494.85 500.71 504.97 511.56 517.99 523.09 525.98 531.98 534.68" y="650.12" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="203.51" y="665.74" font-size="11.00" class="sc-loraregular">RSP</text><text x="226.21" y="665.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="240.10 246.05 253.74" y="665.74" font-size="11.00" class="sc-loraregular">FCF</text><text x="259.77" y="665.74" font-size="11.00" class="sc-notoserifcjksc">，我们认为这些弱点使</text><text x="372.66 380.35 383.34 388.95 395.52 402.10 408.06 410.95 420.89 426.75 431.01 437.60 444.03 449.12 452.02 458.01 460.72" y="665.74" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="467.62" y="665.74" font-size="11.00" class="sc-notoserifcjksc">不符合</text><text x="503.51 511.20 518.04 523.07" y="665.74" font-size="11.00" class="sc-loraregular">CB-2</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p033.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 33 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">33</text><text x="108.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">开放式构想能力薄弱。</text><text x="218.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">在桌面推演中，</text><text x="295.00 302.69 305.68 311.29 317.86 324.44 330.40 333.29 342.03 348.59 355.16 360.25 363.15 369.14 371.85" y="98.80" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="380.73" y="98.80" font-size="11.00" class="sc-notoserifcjksc">依循已发表文献，提出的方法没</text><text x="108.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">有超出那些已有人体试验证据的方法。</text><text x="295.00 302.69 305.68 311.29 317.86 324.44 330.40 333.29 342.03 348.59 355.16 360.25 363.15 369.14 371.85" y="114.42" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="380.73" y="114.42" font-size="11.00" class="sc-notoserifcjksc">没有提出审阅人员认为真正新颖</text><text x="108.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">的方法。</text><text x="108.00" y="163.57" font-size="11.00" class="sc-notoserifcjkscbold">对文献的表述不可靠。</text><text x="218.00 225.69 228.68 234.29 240.86 247.44 253.40 256.29 265.03 271.59 278.16 283.25 286.15 292.14 294.85" y="163.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="303.73" y="163.57" font-size="11.00" class="sc-notoserifcjksc">有时依赖摘要而非论文全文，却十分自信地呈现</text><text x="108.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">这些信息。参与者表示，这误导了他们，其中也包括具备充分专业能力、能够质疑模型对</text><text x="108.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">文献表述的领域专家。</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">在团队缺乏专业知识的领域出现科学错误。</text><text x="317.00 324.69 327.68 333.29 339.86 346.44 352.40 355.29 364.03 370.59 377.16 382.25 385.14 391.14 393.85" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="402.73" y="228.34" font-size="11.00" class="sc-notoserifcjksc">设计了无法编码预期蛋白质</text><text x="108.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="121.89 129.98 138.36" y="243.96" font-size="11.00" class="sc-loraregular">DNA</text><text x="145.25" y="243.96" font-size="11.00" class="sc-notoserifcjksc">，并在</text><text x="181.14" y="243.96" font-size="11.00" class="sc-loraregular">7</text><text x="189.10" y="243.96" font-size="11.00" class="sc-notoserifcjksc">个团队中的</text><text x="247.00" y="243.96" font-size="11.00" class="sc-loraregular">3</text><text x="256.02" y="243.96" font-size="11.00" class="sc-notoserifcjksc">个团队里提出了错误的动物模型。这类细微错误往往出现在</text><text x="108.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">团队缺乏专业知识的领域。</text><text x="72.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">总体而言，这些失败模式限制了模型替代稀缺人类专业知识的效用；开展支撑新型生物武器开发</text><text x="72.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">的复杂、开放式且难以验证的研究，需要这些专业知识。因此，我们得出结论：</text><text x="457.00 464.69 467.68 473.29 479.86 486.44 492.40 495.29 504.02 510.59 517.16 522.25 525.14 531.14 533.85" y="324.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00" y="340.54" font-size="11.00" class="sc-notoserifcjksc">未越过我们</text><text x="129.89" y="340.54" font-size="11.00" class="sc-loraregular">RSP</text><text x="152.60" y="340.54" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="177.49 185.18 192.02 197.05" y="340.54" font-size="11.00" class="sc-loraregular">CB-2</text><text x="205.85" y="340.54" font-size="11.00" class="sc-notoserifcjksc">阈值，也未达到</text><text x="285.74 291.69 299.38" y="340.54" font-size="11.00" class="sc-loraregular">FCF</text><text x="308.30" y="340.54" font-size="11.00" class="sc-notoserifcjksc">中的对应层级。我们强调，尽管我们未将</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35" y="356.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="160.24" y="356.16" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="174.13 181.82 184.82 190.43 196.99 203.57 209.53 212.43 222.36 228.22 232.48 239.07 245.50 250.60 253.49 259.48 262.19" y="356.16" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="269.09" y="356.16" font-size="11.00" class="sc-notoserifcjksc">认定为</text><text x="304.98 312.67 319.51 324.54" y="356.16" font-size="11.00" class="sc-loraregular">CB-2</text><text x="330.45" y="356.16" font-size="11.00" class="sc-notoserifcjksc">，但相较于</text><text x="388.34 396.03 399.02 404.63 411.20 417.77 423.74 426.63 435.36 441.93 448.50 453.59 456.48" y="356.16" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="465.37" y="356.16" font-size="11.00" class="sc-notoserifcjksc">等较弱模型，</text><text x="72.00" y="371.78" font-size="11.00" class="sc-notoserifcjksc">我们已出于保守考虑，扩大了对这两个模型实施的安全防护措施范围；鉴于</text><text x="437.89 445.58 448.57 454.18 460.75 467.33 473.29 476.18 484.92 491.48 498.05 503.14 506.04 512.03 514.74" y="371.78" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="523.63" y="371.78" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="387.40" font-size="11.00" class="sc-notoserifcjksc">这一领域的能力相对较强，我们也对它采取相同的、更广泛的安全防护措施。我们在最新</text><text x="501.00" y="387.40" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报</text><text x="72.00" y="403.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">告</text><text x="83.00" y="403.02" font-size="11.00" class="sc-notoserifcjksc">的第</text><text x="107.89" y="403.02" font-size="11.00" class="sc-loraregular">4.5.2.1</text><text x="140.77" y="403.02" font-size="11.00" class="sc-notoserifcjksc">节进一步介绍了这些扩展后的</text><text x="286.67" y="403.02" font-size="11.00" class="sc-loraregular">CB</text><text x="304.09" y="403.02" font-size="11.00" class="sc-notoserifcjksc">安全防护措施。</text><text x="72.00" y="488.81" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64" y="488.81" font-size="14.00" class="sc-notosanscjkscbold">研发</text><text x="72.00" y="525.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81" y="525.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00" y="553.79" font-size="11.00" class="sc-notoserifcjksc">这些评估源于我们</text><text x="162.89" y="553.79" font-size="11.00" class="sc-loraregular">RSP</text><text x="185.60" y="553.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="199.49 205.44 213.13" y="553.79" font-size="11.00" class="sc-loraregular">FCF</text><text x="222.05" y="553.79" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="108.00" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="586.18" font-size="11.00" class="sc-lorabold">1</text><text x="192.36" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">：高风险场景中的未对齐</text><text x="316.25" y="586.18" font-size="11.00" class="sc-lorabold">AI</text><text x="330.75" y="586.18" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="363.75" y="586.18" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="509.64" y="586.18" font-size="11.00" class="sc-loraregular">AI</text><text x="523.11" y="586.18" font-size="11.00" class="sc-notoserifcjksc">系</text><text x="108.00" y="601.80" font-size="11.00" class="sc-notoserifcjksc">统：它们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作能</text><text x="108.00" y="617.42" font-size="11.00" class="sc-notoserifcjksc">力和使用隐蔽手段的能力，以至于这些系统有可能（如果被引向这一目标，无论是有意还</text><text x="108.00" y="633.04" font-size="11.00" class="sc-notoserifcjksc">是无意）实施蓄意破坏，从而不可逆转地、大幅提高日后发生全球性灾难的几率。</text><text x="108.00" y="683.33" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="683.33" font-size="11.00" class="sc-lorabold">2</text><text x="193.76" y="683.33" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域中自动化研发带来的风险。</text><text x="380.76" y="683.33" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是能够完全自</text><text x="108.00" y="698.95" font-size="11.00" class="sc-notoserifcjksc">动化或以其他方式大幅加速大型顶尖人类研究团队工作的</text><text x="385.89" y="698.95" font-size="11.00" class="sc-loraregular">AI</text><text x="399.36" y="698.95" font-size="11.00" class="sc-notoserifcjksc">系统，所涉及的领域是</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="501.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="501.00" y="378.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="512.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="512.00" y="378.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="523.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="523.00" y="378.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="534.00" y="378.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="72.00" y="394.22" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p034.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 34 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">34</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">快速进展可能对国际安全构成威胁和</text><text x="284.00" y="82.61" font-size="11.00" class="sc-loraregular">/</text><text x="291.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">或迅速打破全球力量平衡的领域。此类领域的例子</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">包括能源、机器人、武器开发以及</text><text x="275.89" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="289.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">本身。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-lorabold">2.3.1.1 Claude Opus 5.5</text><text x="189.90" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">如何影响或改变我们最近一份风险报告中的分析</text><text x="72.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="212.15" font-size="11.00" class="sc-lorabold">1</text><text x="195.25" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">适用于</text><text x="231.15" y="212.15" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="314.61" y="212.15" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们以往的一些</text><text x="471.51" y="212.15" font-size="11.00" class="sc-loraregular">AI</text><text x="484.97" y="212.15" font-size="11.00" class="sc-notoserifcjksc">模型一样。</text><text x="108.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">我们将在第</text><text x="165.89" y="227.77" font-size="11.00" class="sc-loraregular">2.4</text><text x="183.36" y="227.77" font-size="11.00" class="sc-notoserifcjksc">节中讨论，为什么我们认为该威胁模型下的风险水平仍处于我们</text><text x="494.25 500.16 506.92
