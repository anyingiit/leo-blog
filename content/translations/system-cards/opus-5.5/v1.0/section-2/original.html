y="561.35" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78" y="561.35" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78 220.78 231.78 242.78 253.78 264.78" y="561.35" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78 281.46 288.04 294.00 300.68 307.11 312.49 318.17 323.26 328.35 334.79 340.64 343.73 349.33 353.59 359.49 366.07 368.96 374.52 377.61 382.37 388.94" y="561.35" font-size="11.00" class="sc-loraregular">adeno-associated virus</text><text x="394.03" y="561.35" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03 412.42 418.88" y="561.35" font-size="11.00" class="sc-loraregular">AAV</text><text x="426.07 437.07 448.07 459.07 470.07 481.07 492.07 503.07 514.07" y="561.35" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病性病</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="576.97" font-size="11.00" class="sc-notoserifcjksc">毒，常被用作基因疗法的递送工具，将</text><text x="297.89 305.98 314.36" y="576.97" font-size="11.00" class="sc-loraregular">DNA</text><text x="324.14 335.14 346.14 357.14 368.14 379.14 390.14 401.14 412.14 423.14 434.14 445.14 456.14 467.14 478.14 489.14 500.14 511.14 522.14" y="576.97" font-size="11.00" class="sc-notoserifcjksc">载荷包裹在病毒衣壳（病毒外层的蛋白质外</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="592.59" font-size="11.00" class="sc-notoserifcjksc">壳）内进行递送。在这项任务中，模型获得了</text><text x="330.89 334.90 337.50 344.34 351.17" y="592.59" font-size="11.00" class="sc-loraregular">1,000</text><text x="360.90 371.90 382.90 393.90 404.90 415.90" y="592.59" font-size="11.00" class="sc-notoserifcjksc">条尚未公开的</text><text x="429.79 437.19 443.64" y="592.59" font-size="11.00" class="sc-loraregular">AAV</text><text x="453.72 464.72 475.72 486.72 497.72 508.72 519.72 530.72" y="592.59" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，这些序</text><text x="108.00 119.00 130.00 141.00" y="608.21" font-size="11.00" class="sc-notoserifcjksc">列均通过</text><text x="154.89 163.09 168.90 175.57" y="608.21" font-size="11.00" class="sc-loraregular">Dyno</text><text x="184.90 195.90 206.90 217.90 228.90 239.90 250.90 261.90 272.90 283.90 294.90 305.90 316.90 327.90 338.90 349.90 360.90 371.90 382.90 393.90 404.90 415.90 426.90 437.90 448.90 459.90 470.90 481.90 492.90 503.90 514.90 525.90" y="608.21" font-size="11.00" class="sc-notoserifcjksc">精选的短插入序列进行了修饰。随后，模型需要利用自身的生物物理学知</text><text x="108.00 119.00" y="623.83" font-size="11.00" class="sc-notoserifcjksc">识、</text><text x="130.00 137.39 143.85" y="623.83" font-size="11.00" class="sc-loraregular">AAV</text><text x="153.93 164.93 175.93 186.93 197.93 208.93 219.93 230.93 241.93 252.93 263.92 274.92 285.92 296.92 307.92 318.92 329.92 340.92 351.92 362.92 373.92 384.92 395.92 406.92 417.92 428.92 439.92 450.92 461.92 472.92 483.92 494.92 505.92 516.92 527.92" y="623.83" font-size="11.00" class="sc-notoserifcjksc">衣壳生物学知识和机器学习技能，给出每条修饰后的序列能够正确组装成功能性</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="639.45" font-size="11.00" class="sc-notoserifcjksc">衣壳的概率。</text><text x="108.00 115.61 122.10" y="690.89" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78 209.78 220.78" y="690.89" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自动研究：</text><text x="231.78 242.78 253.78 264.78 275.78 286.78 297.78 308.78 319.78 330.78 341.78 352.78 363.78 374.78 385.78 396.78 407.78 418.78 429.78 440.78 451.78 462.78 473.78 484.78 495.78" y="690.89" font-size="11.00" class="sc-notoserifcjksc">与前一项任务一样，模型会获得一批带标签、尚未公开的</text><text x="509.68 517.07 523.53" y="690.89" font-size="11.00" class="sc-loraregular">AAV</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="706.51" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，这些序列均通过短</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p023.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 23 页"><text x="504.00 508.70" y="751.81" font-size="9.00" class="sc-loraregular">23</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">插入序列在特定区域进行了修饰。该任务要求模型使用这一带标签训练集，构建一个预测</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">器，使其对在另一个未见过的区域发生插入的衣壳序列具有较强的分布外预测表现。模型</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">可以使用一个打分器，在不揭示序列本身组成的情况下，测试其预测器在来自这一未见区</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">域的序列上的表现。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标尚未公开，因此我们高度确信，它们能够测量</text><text x="404.89 411.78" y="195.95" font-size="11.00" class="sc-loraregular">AI</text><text x="418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="195.95" font-size="11.00" class="sc-notoserifcjksc">模型完成新型生物学任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的技能，而不受训练数据污染的影响。</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67" y="256.53" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.1</text><text x="113.57 124.57" y="256.53" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">黑盒</text><text x="138.46 145.37 153.75" y="256.53" font-size="11.00" class="sc-loraregular" fill="#666666">RNA</text><text x="163.53 174.53 185.53 196.53 207.53 218.53 229.53" y="256.53" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">序列建模与设计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="276.72" font-size="11.00" class="sc-notoserifcjksc">这项任务测量模型能否在提示极少、仅能获取部分数据的情况下，在上下文信息有限的黑盒环境</text><text x="72.00 83.00 94.00" y="292.34" font-size="11.00" class="sc-notoserifcjksc">中设计</text><text x="107.89 114.80 123.18" y="292.34" font-size="11.00" class="sc-loraregular">RNA</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="307.96" font-size="11.00" class="sc-notoserifcjksc">的序列设计挑战。具体而言，该任务要求人类参与者或模型分析数据，根据训练数据集中的少量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="323.58" font-size="11.00" class="sc-notoserifcjksc">实验测量，建立序列到功能关系的模型，并使用该模型预测测试数据集中序列的功能。任务还要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="339.20" font-size="11.00" class="sc-notoserifcjksc">求参与者设计功能尽可能强的新序列，这些序列不能出现在上述任何一个数据集中。要在此任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="354.82" font-size="11.00" class="sc-notoserifcjksc">中表现良好，就需要通过分析发现序列并不显而易见的属性，构建具有强大表达能力的分子模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="370.44" font-size="11.00" class="sc-notoserifcjksc">架构，并根据分子模型的表现，在设计时作出良好权衡。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="487.22" font-size="11.00" class="sc-notoserifcjksc">人类参与者被要求在这项任务上花费不超过</text><text x="283.89" y="487.22" font-size="11.00" class="sc-loraregular">2</text><text x="292.69" y="487.22" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="306.59" y="487.22" font-size="11.00" class="sc-loraregular">3</text><text x="315.61 326.61 337.61 348.61 359.61 370.61 381.61 392.61" y="487.22" font-size="11.00" class="sc-notoserifcjksc">小时。模型获得了</text><text x="406.50" y="487.22" font-size="11.00" class="sc-loraregular">2</text><text x="415.30 426.30 437.30 448.30 459.30 470.30 481.30 492.30 503.30 514.30" y="487.22" font-size="11.00" class="sc-notoserifcjksc">小时的工具调用预算、</text><text x="72.00 80.37 87.04" y="502.84" font-size="11.00" class="sc-loraregular">GPU</text><text x="98.20 109.20 120.20 131.20 142.20 153.20 164.20" y="502.84" font-size="11.00" class="sc-notoserifcjksc">使用权限，以及</text><text x="178.10 182.10 188.93" y="502.84" font-size="11.00" class="sc-loraregular">100</text><text x="198.65 209.65" y="502.84" font-size="11.00" class="sc-notoserifcjksc">万个</text><text x="223.55 227.80 234.24 240.07 246.03" y="502.84" font-size="11.00" class="sc-loraregular">token</text><text x="255.60 266.60 277.60 288.60 299.60 310.60 321.60 332.60 343.60 354.60 365.60 376.60 387.60 398.60" y="502.84" font-size="11.00" class="sc-notoserifcjksc">的额度，并在配有标准科学计算</text><text x="412.49 419.33 425.19 429.45 436.03 442.47" y="502.84" font-size="11.00" class="sc-loraregular">Python</text><text x="452.04 463.04 474.04 485.04 496.04 507.04 518.04 529.04" y="502.84" font-size="11.00" class="sc-notoserifcjksc">库的容器化环境中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="518.46" font-size="11.00" class="sc-notoserifcjksc">运行。模型还被要求生成一份自包含的</text><text x="261.89 270.47 277.51 287.61" y="518.46" font-size="11.00" class="sc-loraregular">HTML</text><text x="296.86 307.86 318.86 329.86 340.86 351.86 362.86 373.86 384.86 395.86 406.86 417.86 428.86 439.86 450.86 461.86 472.86 483.86 494.86 505.86" y="518.46" font-size="11.00" class="sc-notoserifcjksc">报告，说明其方法和发现。我们将产出发送给</text><text x="72.00 80.19 86.00 92.68" y="534.08" font-size="11.00" class="sc-loraregular">Dyno</text><text x="99.11 110.11 121.11 132.11 143.11 154.11 165.11 176.11 187.11 198.11 209.11 220.11 231.11 242.11 253.11 264.11 275.11 286.11 297.11 308.11 319.11 330.11 341.11 352.11 363.11 374.11 385.11 396.11 407.11 418.11 429.11 440.11 451.11 462.11 473.11 484.11 495.11" y="534.08" font-size="11.00" class="sc-notoserifcjksc">，按与人类候选人相同的评分细则评分。我们从每个模型在该任务上的运行中采样了</text><text x="509.01" y="534.08" font-size="11.00" class="sc-loraregular">8</text><text x="518.08 529.08" y="534.08" font-size="11.00" class="sc-notoserifcjksc">次尝</text><text x="72.00 83.00" y="549.70" font-size="11.00" class="sc-notoserifcjksc">试。</text><text x="72.00 83.00 94.00" y="600.56" font-size="11.00" class="sc-notoserifcjksc">产出按</text><text x="107.89" y="600.56" font-size="11.00" class="sc-loraregular">2</text><text x="116.69 127.69 138.69 149.69 160.69 171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="600.56" font-size="11.00" class="sc-notoserifcjksc">项指标评分：预测得分（在留出测试集上，模型预测与功能真值之间的斯皮尔曼相关系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="616.18" font-size="11.00" class="sc-notoserifcjksc">数）和设计得分（所提出的最佳序列的功能真值）。我们还发现，排名前</text><text x="426.89 432.89" y="616.18" font-size="11.00" class="sc-loraregular">5%</text><text x="445.35 456.35 467.35 478.35 489.35 500.35 511.35" y="616.18" font-size="11.00" class="sc-notoserifcjksc">的序列的预测得</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="631.80" font-size="11.00" class="sc-notoserifcjksc">分，以及所有设计序列的设计得分中位数，能够更有效地凸显近期模型之间的差异；下文将报告</text><text x="72.00 83.00 94.00 105.00 116.00" y="647.42" font-size="11.00" class="sc-notoserifcjksc">这些结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="713.91" font-size="11.00" class="sc-notoserifcjksc">我们还评估了一种上下文内迭代条件。每个模型都获得了</text><text x="349.89" y="713.91" font-size="11.00" class="sc-loraregular">8</text><text x="358.97 369.97 380.97 391.97 402.97" y="713.91" font-size="11.00" class="sc-notoserifcjksc">份来自此前</text><text x="416.86 424.55 427.54 433.15 439.72 446.30 452.26 455.15 465.08 470.95 475.20 481.79 488.23 493.32 496.21 502.88 507.57 513.47 519.03 522.12 528.04" y="713.91" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="72.00 83.00 94.00" y="729.53" font-size="11.00" class="sc-notoserifcjksc">尝试的</text><text x="107.89 116.47 123.51 133.61" y="729.53" font-size="11.00" class="sc-loraregular">HTML</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p024.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 24 页"><text x="504.00 508.64" y="751.81" font-size="9.00" class="sc-loraregular">24</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">报告及对应得分，并被要求改进这些方法。模型获得了</text><text x="338.89 344.56" y="82.61" font-size="11.00" class="sc-loraregular">24</text><text x="353.41 364.41 375.41 386.41 397.41 408.41 419.41 430.41 441.41 452.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">小时的工具调用预算和</text><text x="466.31 472.21 479.04" y="82.61" font-size="11.00" class="sc-loraregular">200</text><text x="488.77 499.77" y="82.61" font-size="11.00" class="sc-notoserifcjksc">万个</text><text x="72.00 76.26 82.69 88.52 94.48" y="98.23" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05 148.05 159.05 170.05 181.05 192.05 203.05 214.05 225.05 236.05 247.05" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的预算；所有模型都获得相同的</text><text x="260.95 270.88 276.74 281.00 287.59 294.02 299.12 302.01 308.68 313.36 319.27 324.82 327.92 333.83" y="98.23" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="345.54 356.54 367.54 378.54 389.54 400.54 411.54 422.54 433.54 444.54 455.54 466.54 477.54 488.54 499.54 510.54 521.54" y="98.23" font-size="11.00" class="sc-notoserifcjksc">报告，以确保上下文材料保持一致。结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果与无上下文基线一并报告。这一条件不能直接与人类基线比较，因为人类参与者未获提供先前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">尝试的材料。</text><text x="72.00 83.00" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="195.95" font-size="11.00" class="sc-notoserifcjksc">这项评估可以作为模型设计新型生物序列能力的早期指标。此类设计是许多威胁路径常见的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">上游输入，例如增强病原体或设计新型毒素，因此设计能力的进步会同时增加所有这些路径的风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">险。同样，上下文学习变体或许能够评估模型从先前尝试中学习的能力，这项技能与一系列设计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">工作的迭代过程相关。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89 184.89 195.89 206.89 217.89" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们定义了</text><text x="231.79" y="325.49" font-size="11.00" class="sc-loraregular">2</text><text x="240.59 251.59 262.59 273.59 284.59 295.59 306.59 317.59 328.59 339.59 350.59 361.59 372.59 383.59 394.59 405.59 416.59 427.59 438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="325.49" font-size="11.00" class="sc-notoserifcjksc">个显著能力判定基准。若模型的平均表现超过人类参与者的第</text><text x="72.00 77.07" y="341.11" font-size="11.00" class="sc-loraregular">75</text><text x="85.96 96.96 107.96 118.96 129.96 140.96 151.96 162.96 173.96" y="341.11" font-size="11.00" class="sc-notoserifcjksc">百分位，就超过了第</text><text x="187.85" y="341.11" font-size="11.00" class="sc-loraregular">1</text><text x="194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75 458.75 469.75 480.75 491.75 502.75 513.75" y="341.11" font-size="11.00" class="sc-notoserifcjksc">个基准；若模型的平均表现超过表现最好的人类参与者，就超过了第</text><text x="527.64" y="341.11" font-size="11.00" class="sc-loraregular">2</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">个基准。为与此前系统卡保持一致，并与激励和评估人类表现的方式相匹配，我们将这些基准应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">用于原始预测得分和设计得分：前者是所有序列的预测值与真值之间的斯皮尔曼相关系数，后者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">是最佳序列的设计得分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">对于设计得分中位数和排名前</text><text x="217.89 223.89" y="471.22" font-size="11.00" class="sc-loraregular">5%</text><text x="236.35 247.35 258.35 269.35 280.35 291.35 302.35 313.35 324.35 335.35 346.35 357.35 368.35 379.35 390.35 401.35 412.35 423.35 434.35 445.35 456.35 467.35 478.35 489.35 500.35 511.35" y="471.22" font-size="11.00" class="sc-notoserifcjksc">的序列的斯皮尔曼相关系数，我们没有另设显著能力判定基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">准，而是用它们来提供有关模型表现与能力的定性认识。</text><text x="72.00 83.00" y="535.99" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89" y="535.99" font-size="11.00" class="sc-notoserifcjksc">在最佳序列的设计得分上，</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04 303.03 305.74" y="535.99" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="314.63 325.63 336.63 347.63" y="535.99" font-size="11.00" class="sc-notoserifcjksc">超过了第</text><text x="361.52" y="535.99" font-size="11.00" class="sc-loraregular">1</text><text x="368.42 379.42 390.42 401.42 412.42 423.42 434.42 445.42 456.42 467.42 478.42 489.42 500.42 511.42 522.42" y="535.99" font-size="11.00" class="sc-notoserifcjksc">个基准。它的设计得分中位数高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="551.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="551.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="180.85 188.53 191.53 197.14 203.70 210.28 216.24 219.14 227.87 234.44 241.00 246.10 248.99" y="551.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="254.99 265.98 276.98 287.98 298.98 309.98 320.98 331.98" y="551.61" font-size="11.00" class="sc-notoserifcjksc">。在预测任务中，</text><text x="342.98 351.72 358.29 364.85 369.95 372.84 378.83 381.54" y="551.61" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="390.43 401.43 412.43 423.43 434.43" y="551.61" font-size="11.00" class="sc-notoserifcjksc">的表现优于</text><text x="448.32 458.25 464.12 468.37 474.96 481.40 486.49 489.38 495.38 498.08" y="551.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="502.09 513.09 524.09" y="551.61" font-size="11.00" class="sc-notoserifcjksc">。我们</text><text x="72.00 83.00 94.00 105.00 116.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc">的结论是，</text><text x="127.00 135.73 142.30 148.87 153.96 156.85 162.85 165.56" y="567.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="567.23" font-size="11.00" class="sc-notoserifcjksc">在这项任务上的表现达到或超过此前最强的模型，并且在中程黑盒生物序列</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="582.85" font-size="11.00" class="sc-notoserifcjksc">设计与预测方面，能够与美国人才市场中表现最出色的人才竞争。</text><text x="72.00 83.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">包括</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="665.52" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="182.24" y="665.52" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.24 200.93 203.92 209.53 216.10 222.68 228.64 231.53 237.77 244.21 250.88 257.56 263.44 267.70 270.59" y="665.52" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.48" y="665.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.38 302.11 308.68 315.24 320.34 323.23" y="665.52" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="332.12 343.12 354.12 365.12 376.12 387.12 398.12 409.12 420.12 431.12 442.12 453.12 464.12 475.12 486.12 497.12 508.12 519.12 530.12" y="665.52" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型，除预测得分（全部）外，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">其余每项指标都受益于上下文内迭代；在预测得分（全部）上，这种迭代的影响很小或为负。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="696.76" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66" y="696.76" font-size="11.00" class="sc-notoserifcjksc">打破了这一趋势，在所有指标上都受益于上下文内迭代。</text><text x="403.66 412.40 418.96 425.53 430.62 433.51 439.51 442.22" y="696.76" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="451.10 462.10 473.10 484.10 495.10 506.10 517.10 528.10" y="696.76" font-size="11.00" class="sc-notoserifcjksc">在大多数任务（最</text><text x="72.00 83.00 94.00" y="712.38" font-size="11.00" class="sc-notoserifcjksc">佳设计</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">得分、设计得分中位数，或所有序列的预测得分）中，并未因获得先前报告而有所改进。不过，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">它在高分序列的预测方面似乎有明显改进。这些发现表明，</text><text x="358.00 366.73 373.30 379.87 384.96 387.85 393.85 396.55" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在长程科学任务中迭代改进</text><text x="72.00 83.00 94.00 105.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="168.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="182.74 192.67 198.53 202.79 209.38 215.81 220.91 223.80 229.79 232.50" y="113.85" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="239.40 250.40 261.40 272.40 283.40 294.40 305.40 316.40 327.40 338.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相近；不过，对于它在</text><text x="352.29" y="113.85" font-size="11.00" class="sc-loraregular">4</text><text x="361.15 372.15 383.15 394.15 405.15" y="113.85" font-size="11.00" class="sc-notoserifcjksc">项任务中的</text><text x="419.04" y="113.85" font-size="11.00" class="sc-loraregular">3</text><text x="428.06 439.06 450.06 461.06 472.06 483.06 494.06 505.06 516.06 527.06" y="113.85" font-size="11.00" class="sc-notoserifcjksc">项未见改进这一现象，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">我们的解释是：未获先前材料的</text><text x="228.89 237.63 244.19 250.76 255.85 258.75 264.74 267.45" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.34 287.34 298.34 309.34 320.34 331.34 342.34 353.34 364.34 375.34 386.34 397.34 408.34 419.34 430.34 441.34 452.34 463.34 474.34 485.34 496.34 507.34 518.34 529.34" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在这些任务上的得分已经足够高，以至于我们无法有效</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">检测它在上下文中学习的能力。</text></svg></div>

<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p028.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 28 页"><text x="90.00 94.00" y="297.56" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00 95.90" y="313.75" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00 96.12" y="362.33" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">28</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67 112.58 115.47 122.86 129.32" y="82.61" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.2 AAV</text><text x="139.40 150.40 161.40 172.40 183.40 194.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">衣壳包装预测</text><text x="72.00 83.00 94.00" y="102.80" font-size="11.00" class="sc-notoserifcjksc">与黑盒</text><text x="107.89 114.80 123.18" y="102.80" font-size="11.00" class="sc-loraregular">RNA</text><text x="132.96 143.96 154.96 165.96 176.96 187.96 198.96 209.96 220.96 231.96 242.96 253.96 264.96 275.96 286.96 297.96 308.96 319.96 330.96 341.96 352.96 363.96 374.96 385.96 396.96 407.96 418.96 429.96 440.96 451.96 462.96 473.96 484.96 495.96 506.96 517.96" y="102.80" font-size="11.00" class="sc-notoserifcjksc">任务不同，此处的生物学背景是已知的，预测针对的是具有治疗相关性的真实测量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="118.42" font-size="11.00" class="sc-notoserifcjksc">值：模型会被告知，它正在对</text><text x="217.89 225.29 231.74" y="118.42" font-size="11.00" class="sc-loraregular">AAV</text><text x="241.82 252.82 263.82 274.82 285.82 296.82 307.82 318.82 329.82 340.82 351.82 362.82 373.82 384.82 395.82 406.82 417.82 428.82 439.82 450.82 461.82 472.82 483.82 494.82 505.82 516.82 527.82" y="118.42" font-size="11.00" class="sc-notoserifcjksc">衣壳组装进行推理，并应运用病毒包装文献中的先验知识。这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="134.04" font-size="11.00" class="sc-notoserifcjksc">是一项复杂的完整病毒粒子预测任务的最简版本；该任务要求具备预测蛋白质相互作用、细胞内</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="149.66" font-size="11.00" class="sc-notoserifcjksc">转运、基因组完整性与表达等特征，以及许多其他已知和未知特征的能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="232.34" font-size="11.00" class="sc-notoserifcjksc">模型未获得针对测试序列的带标签训练数据，只能向</text><text x="327.89 336.09 341.90 348.57" y="232.34" font-size="11.00" class="sc-loraregular">Dyno</text><text x="357.90" y="232.34" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="371.79 379.48 385.16 391.84 397.51 402.46 408.27 411.16 418.05 424.66" y="232.34" font-size="11.00" class="sc-loraregular">Canary API</text><text x="431.24 442.24" y="232.34" font-size="11.00" class="sc-notoserifcjksc">提交</text><text x="456.13" y="232.34" font-size="11.00" class="sc-loraregular">1</text><text x="463.03 474.03 485.03 496.03 507.03 518.03 529.03" y="232.34" font-size="11.00" class="sc-notoserifcjksc">次预测，预测短</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="247.96" font-size="11.00" class="sc-notoserifcjksc">序列插入特定</text><text x="140.89 148.29 154.74" y="247.96" font-size="11.00" class="sc-loraregular">AAV</text><text x="164.82 175.82 186.82 197.82 208.82 219.82 230.82 241.82 252.82 263.82 274.82 285.82 296.82 307.82 318.82 329.82 340.82 351.82 362.82 373.82 384.82 395.82" y="247.96" font-size="11.00" class="sc-notoserifcjksc">血清型后的包装概率，没有迭代机会。我们评估了</text><text x="409.71" y="247.96" font-size="11.00" class="sc-loraregular">3</text><text x="418.73 429.73 440.73 451.73 462.73 473.73" y="247.96" font-size="11.00" class="sc-notoserifcjksc">种资源条件：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="297.11" font-size="11.00" class="sc-notoserifcjkscbold">纯推理（不用工具）</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="297.11" font-size="11.00" class="sc-notoserifcjksc">：既无蛋白质语言模型，也无训练语料；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="313.30" font-size="11.00" class="sc-notoserifcjkscbold">提供预训练蛋白质语言模型（</text><text x="251.00 257.96 264.61" y="313.30" font-size="11.00" class="sc-lorabold">PLM</text><text x="275.30" y="313.30" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="286.30 297.30 308.30 319.30 330.30 341.30 352.30 363.30 374.30" y="313.30" font-size="11.00" class="sc-notoserifcjksc">：具体而言，可使用</text><text x="388.19 395.03 401.27 411.19 416.22" y="313.30" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="422.13 433.13 444.13 455.13 466.13 477.13 488.13 499.13 510.13 521.13" y="313.30" font-size="11.00" class="sc-notoserifcjksc">，以测试模型能否通过</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="328.92" font-size="11.00" class="sc-notoserifcjksc">生物物理学推理改进</text><text x="209.89 216.50 222.86" y="328.92" font-size="11.00" class="sc-loraregular">PLM</text><text x="235.85 246.85 257.85 268.85 279.85 290.85" y="328.92" font-size="11.00" class="sc-notoserifcjksc">的预测；以及</text><text x="108.00 119.00 130.00 141.00" y="361.87" font-size="11.00" class="sc-notoserifcjkscbold">自行训练</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="361.87" font-size="11.00" class="sc-notoserifcjksc">：不提供预训练</text><text x="231.89 238.50 244.86" y="361.87" font-size="11.00" class="sc-loraregular">PLM</text><text x="254.96 265.96 276.96 287.96 298.96 309.96 320.96 331.96 342.96 353.96 364.96 375.96 386.96 397.96 408.96 419.96 430.96 441.96 452.96 463.96 474.96 485.96 496.96 507.96 518.96 529.96" y="361.87" font-size="11.00" class="sc-notoserifcjksc">，但提供清洗后的公开语料，并指示模型在算力预算内训练</text><text x="108.00 114.61 120.97" y="377.49" font-size="11.00" class="sc-loraregular">PLM</text><text x="131.07" y="377.49" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00" y="410.45" font-size="11.00" class="sc-notoserifcjksc">条件</text><text x="96.89" y="410.45" font-size="11.00" class="sc-loraregular">3</text><text x="105.91 116.91" y="410.45" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="130.81" y="410.45" font-size="11.00" class="sc-loraregular">3</text><text x="139.83 150.83 161.83 172.83 183.83 194.83 205.83 216.83" y="410.45" font-size="11.00" class="sc-notoserifcjksc">种语料分别运行：</text><text x="227.83 234.49 239.18 245.61 249.87 255.83 258.92 265.47 273.84 279.65 289.48 292.37 299.77 306.22" y="410.45" font-size="11.00" class="sc-loraregular">ProteinGym AAV</text><text x="316.30 327.30 338.30 349.30 360.30 371.30 382.30 393.30" y="410.45" font-size="11.00" class="sc-notoserifcjksc">训练语料中的公开</text><text x="407.19 414.58 421.04" y="410.45" font-size="11.00" class="sc-loraregular">AAV</text><text x="431.12 442.12 453.12 464.12 475.12 486.12 497.12 508.12" y="410.45" font-size="11.00" class="sc-notoserifcjksc">序列（需要强调的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="426.07" font-size="11.00" class="sc-notoserifcjksc">是，这些序列对应另一种</text><text x="195.89 203.28 209.74" y="426.07" font-size="11.00" class="sc-loraregular">AAV</text><text x="219.82 230.82 241.82 252.82 263.82" y="426.07" font-size="11.00" class="sc-notoserifcjksc">血清型）、</text><text x="274.82 281.00 289.81 292.90 298.00 303.09 308.47 315.13 319.82 326.25" y="426.07" font-size="11.00" class="sc-loraregular">Swiss-Prot</text><text x="330.51 341.51 352.51 363.51 374.51 385.51 396.51 407.51 418.51 429.51 440.51 451.51 462.51 473.51 484.51 495.51 506.51" y="426.07" font-size="11.00" class="sc-notoserifcjksc">，以及两者的组合，因此每个模型共有</text><text x="520.40" y="426.07" font-size="11.00" class="sc-loraregular">5</text><text x="529.29" y="426.07" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00 105.00" y="441.69" font-size="11.00" class="sc-notoserifcjksc">实验组。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="475.22" font-size="11.00" class="sc-notoserifcjksc">模型获得了野生型衣壳序列、按实际耗时计的</text><text x="294.89 300.56" y="475.22" font-size="11.00" class="sc-loraregular">24</text><text x="309.41 320.41 331.41 342.41 353.41 364.41 375.41 386.41 397.41 408.41 419.41" y="475.22" font-size="11.00" class="sc-notoserifcjksc">小时工具调用预算、单张</text><text x="433.31 441.89 445.89 452.72 459.55 462.45 470.82 477.48" y="475.22" font-size="11.00" class="sc-loraregular">H100 GPU</text><text x="485.75" y="475.22" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="496.75 502.66 509.49" y="475.22" font-size="11.00" class="sc-loraregular">200</text><text x="519.22" y="475.22" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00" y="490.84" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="85.89 90.15 96.58 102.42 108.38" y="490.84" font-size="11.00" class="sc-loraregular">token</text><text x="117.95 128.95 139.95 150.95 161.95 172.95 183.95 194.95 205.95 216.95 227.95 238.95 249.95 260.95 271.95 282.95 293.95 304.95 315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95 502.95 513.95 524.95" y="490.84" font-size="11.00" class="sc-notoserifcjksc">的额度和标准机器学习库，无法访问互联网；同时被要求迭代改进解决方案，直到确信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="506.46" font-size="11.00" class="sc-notoserifcjksc">进一步迭代也无法再提升表现。对于每个模型在每种条件下的运行，我们采样了</text><text x="459.89" y="506.46" font-size="11.00" class="sc-loraregular">8</text><text x="468.97 479.97 490.97 501.97 512.97 523.97" y="506.46" font-size="11.00" class="sc-notoserifcjksc">次尝试。预测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="522.08" font-size="11.00" class="sc-notoserifcjksc">结果依据二元包装真值标签，使用</text><text x="239.89 246.57 254.84 261.75 270.48" y="522.08" font-size="11.00" class="sc-loraregular">AUROC</text><text x="281.07 292.07 303.07 314.07 325.07 336.07 347.07 358.07 369.07" y="522.08" font-size="11.00" class="sc-notoserifcjksc">评分，并以直接使用</text><text x="382.96 389.80 396.04 405.96 410.99" y="522.08" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="419.79 430.79 441.79 452.79 463.79 474.79 485.79 496.79 507.79 518.79" y="522.08" font-size="11.00" class="sc-notoserifcjksc">的结果作为参考基线。</text><text x="72.00 83.00" y="588.56" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="588.56" font-size="11.00" class="sc-notoserifcjksc">这项评估可以作为模型预测新型病毒衣壳序列特性能力的早期指标；它是必要但不充分的指</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="604.18" font-size="11.00" class="sc-notoserifcjksc">标。这种预测能力是一系列设计工作中的必要组成部分；在旨在改善更复杂病毒特性的实验环境</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="619.80" font-size="11.00" class="sc-notoserifcjksc">中，它可以充当筛选手段，提高有望命中目标的尝试所占比例。它是预测更具挑战性、对治疗更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="635.42" font-size="11.00" class="sc-notoserifcjksc">有参考价值的衣壳功能的第一步，例如全身生物分布、与细胞表面暴露受体的功能性结合，以及</text><text x="72.00 83.00 94.00 105.00 116.00" y="651.04" font-size="11.00" class="sc-notoserifcjksc">细胞转导。</text></svg></div>

5.79 324.79 333.79 342.79 351.79 360.79 369.79 378.79 387.79 396.79 405.79 414.79 423.79 432.79" y="552.74" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">次独立尝试的分布；点表示单次运行。虚线标示直接使用</text><text x="444.16 449.76 454.86 462.98 467.09" y="552.74" font-size="9.00" class="sc-loraregular" fill="#1d1d1f">ESM-2</text><text x="474.29 483.29 492.29 501.29 510.29 519.29 528.29" y="552.74" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">的参考基线。这</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="564.44" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1d1f">项任务没有人类参与者基线。</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67 112.80 115.69 123.08 129.54" y="623.40" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.3 AAV</text><text x="139.62 150.62 161.62 172.62 183.62 194.62 205.62 216.62 227.62" y="623.40" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">包装率自动研究评估</text><text x="72.00 83.00 94.00" y="643.59" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89 116.09 121.90 128.57 135.01 137.90 144.94 151.53 157.49 162.18 167.85 174.42 180.38 186.95 191.21 194.30 200.15" y="643.59" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="208.14 219.14 230.14 241.14 252.14 263.14 274.14 285.14 296.14 307.14" y="643.59" font-size="11.00" class="sc-notoserifcjksc">合作，构建了一项预测</text><text x="321.03 328.42 334.88" y="643.59" font-size="11.00" class="sc-loraregular">AAV</text><text x="344.95 355.95 366.95 377.95 388.95 399.95 410.95 421.95 432.95 443.95 454.95 465.95 476.95 487.95 498.95 509.95 520.95" y="643.59" font-size="11.00" class="sc-notoserifcjksc">衣壳包装率的新评估，以更好地测量模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="659.21" font-size="11.00" class="sc-notoserifcjksc">型开发在分布外样本上表现出色的生物学预测器的能力。</text><text x="347.00 355.20 361.00 367.68" y="659.21" font-size="11.00" class="sc-loraregular">Dyno</text><text x="377.01 388.01 399.01 410.01 421.01 432.01 443.01" y="659.21" font-size="11.00" class="sc-notoserifcjksc">围绕经过修饰的</text><text x="456.90 464.29 470.75" y="659.21" font-size="11.00" class="sc-loraregular">AAV</text><text x="480.83 491.83 502.83 513.83 524.83" y="659.21" font-size="11.00" class="sc-notoserifcjksc">衣壳蛋白质</text><text x="72.00 83.00 94.00 105.00 116.00" y="674.83" font-size="11.00" class="sc-notoserifcjksc">序列构建了</text><text x="129.89" y="674.83" font-size="11.00" class="sc-loraregular">6</text><text x="139.14 150.14 161.14 172.14 183.14 194.14" y="674.83" font-size="11.00" class="sc-notoserifcjksc">项挑战（与第</text><text x="208.04 213.94 216.65 222.56 225.26 231.39 234.10 240.00 242.71" y="674.83" font-size="11.00" class="sc-loraregular">2.2.3.2.2</text><text x="251.51 262.51 273.51 284.51 295.51 306.51 317.51 328.51 339.51 350.51 361.51 372.51 383.51 394.51 405.51 416.51 427.51 438.51" y="674.83" font-size="11.00" class="sc-notoserifcjksc">节描述的类似），每项挑战均有一个包含</text><text x="452.40 458.40 461.00 467.83 474.67" y="674.83" font-size="11.00" class="sc-loraregular">5,000</text><text x="484.40 495.40 506.40 517.40 528.40" y="674.83" font-size="11.00" class="sc-notoserifcjksc">条带标签序</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="690.45" font-size="11.00" class="sc-notoserifcjksc">列的训练集，</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p030.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 30 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">30</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些序列对应在</text><text x="151.89 159.29 165.74" y="82.61" font-size="11.00" class="sc-loraregular">AAV</text><text x="175.82 186.82 197.82 208.82 219.82 230.82 241.82 252.82 263.82 274.82 285.82 296.82 307.82 318.82 329.82 340.82 351.82 362.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">衣壳中插入短序列的情况，另有一个包含</text><text x="376.71 380.71 383.49 387.49 394.32" y="82.61" font-size="11.00" class="sc-loraregular">1,100</text><text x="404.06 415.06 426.06 437.06 448.06 459.06 470.06 481.06 492.06 503.06 514.06 525.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">条序列的验证集。每个浮点</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">数标签都是对该序列相对于基线（野生型）衣壳序列的包装富集程度进行的真实测量。根据插入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">序列修饰的是基础血清型中的哪个区域，这</text><text x="283.89" y="113.85" font-size="11.00" class="sc-loraregular">6</text><text x="293.14 304.14 315.14 326.14 337.14 348.14" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个数据集分为</text><text x="362.04" y="113.85" font-size="11.00" class="sc-loraregular">2</text><text x="370.84 381.84 392.84 403.84" y="113.85" font-size="11.00" class="sc-notoserifcjksc">组，每组</text><text x="417.73" y="113.85" font-size="11.00" class="sc-loraregular">3</text><text x="426.75 437.75 448.75 459.75 470.75 481.75 492.75 503.75 514.75 525.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个；我们将这两个区域</text><text x="72.00 83.00 94.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">标记为</text><text x="105.00" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="109.40 120.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">区域</text><text x="134.29 140.60" y="129.47" font-size="11.00" class="sc-loraregular">A”</text><text x="144.43" y="129.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="155.43" y="129.47" font-size="11.00" class="sc-loraregular">“</text><text x="159.84 170.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">区域</text><text x="184.73 191.57" y="129.47" font-size="11.00" class="sc-loraregular">B”</text><text x="195.41" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，我们向模型提供来自区域</text><text x="272.89" y="179.76" font-size="11.00" class="sc-loraregular">B</text><text x="282.63 293.63 304.63 315.63 326.63 337.63 348.63 359.63 370.63 381.63 392.63 403.63 414.63 425.63 436.63 447.63 458.63 469.63 480.63 491.63 502.63 513.63 524.63" y="179.76" font-size="11.00" class="sc-notoserifcjksc">的带标签训练集，并允许它提交一个根据输入序列预</text><text x="72.00 83.00 94.00 105.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">测标签的</text><text x="118.89 125.72 131.59 135.84 142.43 148.87" y="195.38" font-size="11.00" class="sc-loraregular">Python</text><text x="158.44 169.44 180.44 191.44 202.44 213.44 224.44 235.44 246.44 257.44 268.44 279.44 290.44 301.44 312.44 323.44 334.44 345.44 356.44 367.44 378.44 389.44 400.44 411.44 422.44 433.44 444.44 455.44 466.44 477.44 488.44 499.44 510.44 521.44" y="195.38" font-size="11.00" class="sc-notoserifcjksc">函数。每次提交后，模型都会被告知，其预测值与真实标签在一个同时包含区</text><text x="72.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">域</text><text x="85.89" y="211.00" font-size="11.00" class="sc-loraregular">A</text><text x="95.67 106.67 117.67" y="211.00" font-size="11.00" class="sc-notoserifcjksc">和区域</text><text x="131.57" y="211.00" font-size="11.00" class="sc-loraregular">B</text><text x="141.30 152.30 163.30 174.30 185.30 196.30 207.30 218.30 229.30 240.30 251.30 262.30 273.30 284.30 295.30 306.30 317.30 328.30 339.30 350.30 361.30 372.30 383.30" y="211.00" font-size="11.00" class="sc-notoserifcjksc">序列的验证集上的斯皮尔曼相关系数。模型可以通过</text><text x="397.19 403.19" y="211.00" font-size="11.00" class="sc-loraregular">50</text><text x="412.91 423.91 434.91 445.91 456.91 467.91 478.91 489.91 500.91 511.91 522.91" y="211.00" font-size="11.00" class="sc-notoserifcjksc">次这样的提交查询得分，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">之后必须提交最终预测器。模型会被告知，评分将同时涵盖区域</text><text x="382.89" y="226.62" font-size="11.00" class="sc-loraregular">A</text><text x="392.67 403.67 414.67 425.67 436.67 447.67 458.67" y="226.62" font-size="11.00" class="sc-notoserifcjksc">插入序列和区域</text><text x="472.57" y="226.62" font-size="11.00" class="sc-loraregular">B</text><text x="482.30 493.30 504.30 515.30 526.30" y="226.62" font-size="11.00" class="sc-notoserifcjksc">插入序列，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">但不会获得任何区域</text><text x="173.89" y="242.24" font-size="11.00" class="sc-loraregular">A</text><text x="183.67 194.67 205.67 216.67 227.67 238.67 249.67 260.67 271.67 282.67 293.67 304.67 315.67 326.67 337.67 348.67 359.67 370.67 381.67 392.67 403.67 414.67 425.67 436.67 447.67 458.67 469.67 480.67 491.67" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的序列示例，连无标签示例也没有。在会话结束时，我们使用区域</text><text x="505.57" y="242.24" font-size="11.00" class="sc-loraregular">A</text><text x="515.34 526.34" y="242.24" font-size="11.00" class="sc-notoserifcjksc">的留</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="257.86" font-size="11.00" class="sc-notoserifcjksc">出测试集为模型的最终预测器评分，以验证它并非只是简单地过拟合了验证集。</text><text x="72.00 83.00" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">理由</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89" y="341.68" font-size="11.00" class="sc-notoserifcjksc">如上所示，我们发现，近期的前沿</text><text x="264.79 272.48 275.47 281.08 287.64 294.22" y="341.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="303.08 314.08 325.08 336.08" y="341.68" font-size="11.00" class="sc-notoserifcjksc">模型在第</text><text x="349.97 355.88 358.58 364.49 367.20 373.32 376.03 381.94 384.64" y="341.68" font-size="11.00" class="sc-loraregular">2.2.3.2.2</text><text x="393.44 404.44 415.44 426.44" y="341.68" font-size="11.00" class="sc-notoserifcjksc">节所述的</text><text x="440.34 447.73 454.18" y="341.68" font-size="11.00" class="sc-loraregular">AAV</text><text x="464.26 475.26 486.26 497.26 508.26 519.26" y="341.68" font-size="11.00" class="sc-notoserifcjksc">包装率分类任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">务上表现相近，而这一基线评估可能无法充分区分我们能力最强的模型的生物学研究技能。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">因此，我们将相同的数据表述为一个回归问题，构建了一项新的泛化挑战，要求模型提出科学假</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">设，在有限预算和稀疏数据的条件下检验这些假设，并从少量实验迭代中学习。这种设置更接近</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">现实世界中的开放式研究问题：模型试图提出能够泛化到某些序列区域的科学论点，而这些区域</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="485.69" font-size="11.00" class="sc-notoserifcjksc">的训练数据稀疏、间接，甚至完全缺失。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="552.18" font-size="11.00" class="sc-notoserifcjksc">由于这一具体任务是新的，且其绝对表现上限也未知，因此没有可以直接比</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">较的数值基准。我们关注不同模型在这项任务上的表现比较，以及随着模型向打分器查询的次数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">增加，不同模型的分布外得分提升速率呈现怎样的趋势。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">为了校准对这项任务得分的解读，我们在更容易的情境下评估了模型的行为，以建立合理的表现</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="681.14" font-size="11.00" class="sc-notoserifcjksc">上下界。在区域</text><text x="151.89" y="681.14" font-size="11.00" class="sc-loraregular">A</text><text x="161.67 172.67 183.67 194.67" y="681.14" font-size="11.00" class="sc-notoserifcjksc">中，仅将</text><text x="208.57 215.41 221.64 231.57 236.59" y="681.14" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="245.39 256.39 267.39 278.39 289.39 300.39 311.39 322.39 333.39 344.39 355.39 366.39 377.39 388.39 399.39 410.39 421.39 432.39 443.39 454.39 465.39" y="681.14" font-size="11.00" class="sc-notoserifcjksc">直接应用于这一回归问题，斯皮尔曼相关系数为</text><text x="479.29 485.94 488.65 494.55" y="681.14" font-size="11.00" class="sc-loraregular">0.28</text><text x="500.74 511.74 522.74" y="681.14" font-size="11.00" class="sc-notoserifcjksc">，而加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="696.76" font-size="11.00" class="sc-notoserifcjksc">入分布内带标签训练数据后，得分会</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p031.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 31 页"><text x="90.00 94.00" y="212.60" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00 95.90" y="244.99" font-size="11.00" class="sc-loraregular">2.</text><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">31</text><text x="72.00 83.00 94.00 105.00 116.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提高到至少</text><text x="129.89 136.55 139.25" y="82.61" font-size="11.00" class="sc-loraregular">0.5</text><text x="145.25 156.25 167.25 178.25 189.25" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。由于区域</text><text x="203.14" y="82.61" font-size="11.00" class="sc-loraregular">A</text><text x="212.92" y="82.61" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="226.81 231.89 238.72" y="82.61" font-size="11.00" class="sc-loraregular">70%</text><text x="251.18 262.18 273.18 284.18 295.18 306.18 317.18 328.18 339.18 350.18 361.18 372.18 383.18 394.18 405.18 416.18 427.18 438.18 449.18 460.18 471.18 482.18 493.18 504.18 515.18 526.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的序列无法包装，根据实际经验，富集得分更难测量，也更</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">难排序。在所有使用区域</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="205.67 216.67 227.67 238.67 249.67 260.67 271.67 282.67 293.67 304.67 315.67 326.67 337.67 348.67 359.67 370.67 381.67 392.67 403.67 414.67 425.67 436.67 447.67 458.67 469.67 480.67 491.67 502.67 513.67 524.67" y="98.23" font-size="11.00" class="sc-notoserifcjksc">数据进行训练、且未使用蛋白质语言模型的监督学习运行中，最佳单</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次尝试得分为</text><text x="140.89 147.55 150.25 156.25 162.43" y="113.85" font-size="11.00" class="sc-loraregular">0.586</text><text x="168.79 179.79 190.79 201.79 212.79 223.79 234.79 245.79 256.79 267.79 278.79 289.79 300.79 311.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，我们观察到有一次尝试达到了</text><text x="325.68 332.34 335.04 341.04 347.22" y="113.85" font-size="11.00" class="sc-loraregular">0.586</text><text x="353.58 364.58 375.58 386.58 397.58 408.58 419.58 430.58 441.58 452.58 463.58 474.58 485.58 496.58 507.58 518.58 529.58" y="113.85" font-size="11.00" class="sc-notoserifcjksc">；我们保守地将这一得分解读为这项任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">务可能的上限。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">基于这一校准，我们参照</text><text x="195.89" y="179.76" font-size="11.00" class="sc-loraregular">2</text><text x="204.69 215.69 226.69 237.69 248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69" y="179.76" font-size="11.00" class="sc-notoserifcjksc">个关键特征来评估模型在此任务上的表现：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">模型在未见过的验证集上达到斯皮尔曼相关系数</text><text x="341.89 348.55 351.25" y="212.15" font-size="11.00" class="sc-loraregular">0.5</text><text x="360.14 371.14 382.14 393.14 404.14 415.14 426.14 437.14 448.14 459.14 470.14 481.14 492.14 503.14 514.14 525.14" y="212.15" font-size="11.00" class="sc-notoserifcjksc">这一参考值所需的打分器调用次数；</text><text x="108.00 119.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">模型的各次尝试中，明显超过参考值的尝试所占比例；为此，我们将阈值设为</text><text x="484.89 491.55 494.25 500.25" y="244.53" font-size="11.00" class="sc-loraregular">0.52</text><text x="506.16" y="244.53" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这些特征是启发式指标，用于反映模型自主设计高信息量实验、综合研究发现，以及在具有挑战</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">性的回归任务上迭代改进表现的能力。</text><text x="72.00" y="637.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 119.70 121.80 127.33 130.81 133.17 139.40 144.71" y="637.00" font-size="9.00" class="sc-lorabold">2.2.3.2.3.A] AAV</text><text x="153.45 162.45 171.45 180.45 189.45 198.45 207.45 216.45 225.45 234.45" y="637.00" font-size="9.00" class="sc-notoserifcjkscbold">包装率预测的自主研究</text><text x="243.45 252.45 261.45 270.45 279.45 288.45 297.45 306.45 315.45 324.45 333.45 342.45 351.45" y="637.00" font-size="9.00" class="sc-notoserifcjksc">。趋势线表示各次独立尝试（</text><text x="360.45 365.91 368.28 373.05 375.42 380.30" y="637.00" font-size="9.00" class="sc-loraregular">n = 48</text><text x="385.35 394.35 403.35 412.35 421.35 430.35 439.35 448.35 457.35" y="637.00" font-size="9.00" class="sc-notoserifcjksc">）中验证集表现的第</text><text x="468.72 473.92" y="637.00" font-size="9.00" class="sc-loraregular">90</text><text x="481.88 490.88 499.88 508.88 517.88 526.88" y="637.00" font-size="9.00" class="sc-notoserifcjksc">百分位。我们</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00" y="648.70" font-size="9.00" class="sc-notoserifcjksc">发现，能力更强的模型只需少量调用打分器，就能迅速改进。直接使用</text><text x="353.37 358.96 364.07 372.19 376.30" y="648.70" font-size="9.00" class="sc-loraregular">ESM-2</text><text x="383.50 392.50 401.50 410.50 419.50 428.50 437.50 446.50 455.50 464.50 473.50 482.50" y="648.70" font-size="9.00" class="sc-notoserifcjksc">得到的斯皮尔曼相关系数为</text><text x="493.87 499.31 501.52 506.36" y="648.70" font-size="9.00" class="sc-loraregular">0.28</text><text x="511.42 520.42 529.42" y="648.70" font-size="9.00" class="sc-notoserifcjksc">（为保</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="660.40" font-size="9.00" class="sc-notoserifcjksc">留趋势线的动态范围，图中未显示）。</text><text x="225.00 234.00" y="660.40" font-size="9.00" class="sc-notoserifcjkscbold">右图</text><text x="243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="660.40" font-size="9.00" class="sc-notoserifcjksc">：会话过程中，超过</text><text x="326.37 331.81 334.03 338.93" y="660.40" font-size="9.00" class="sc-loraregular">0.52</text><text x="346.13 355.13 364.13 373.13 382.13 391.13 400.13 409.13 418.13 427.13 436.13 445.13 454.13" y="660.40" font-size="9.00" class="sc-notoserifcjksc">阈值的尝试所占的累计比例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p032.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 32 页"><text x="72.00 78.39 88.44 97.50 100.93 108.78 112.21" y="333.87" font-size="13.00" class="sc-poppinsmedium" fill="#666666">(CAISI)</text><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="72.00 83.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="196.52 204.21 207.20 212.81 219.38 225.96 231.92 234.81 243.55 250.11 256.68 261.77 264.67" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="273.55" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="287.45 295.14 298.13 303.74 310.30 316.88 322.84 325.74 335.67 341.53 345.79 352.38 358.81 363.91 366.80 372.79 375.50" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="382.40 393.40 404.40 415.40 426.40 437.40 448.40 459.40 470.40 481.40 492.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一样，在调用打分器不到</text><text x="506.29 510.30" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="520.02" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00 83.00 94.00 105.00 116.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">时，就达到</text><text x="129.89 136.55 139.25 145.25" y="98.23" font-size="11.00" class="sc-loraregular">0.50</text><text x="154.97 165.97 176.97 187.97 198.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的参考值。</text><text x="209.97 218.71 225.27 231.84 236.93 239.83 245.82 248.53" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="257.42 268.42" y="98.23" font-size="11.00" class="sc-notoserifcjksc">达到</text><text x="282.31 288.96 291.67 297.66" y="98.23" font-size="11.00" class="sc-loraregular">0.52</text><text x="306.47 317.47 328.47 339.47 350.47 361.47 372.47 383.47 394.47 405.47 416.47 427.47 438.47 449.47" y="98.23" font-size="11.00" class="sc-notoserifcjksc">阈值所需的打分器调用次数少于</text><text x="463.36 471.05 474.04 479.65 486.22 492.79 498.76 501.65 511.58 517.45 521.70 528.29 534.73" y="98.23" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.00 80.70" y="113.85" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71 95.71 106.71 117.71 128.71 139.71" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。相比之下，</text><text x="150.71 158.39 161.39 167.00 173.56 180.14 186.10 189.00 195.23 201.67 208.35 215.02 220.91 225.16 228.06" y="113.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="236.95 247.95 258.95 269.95 280.95 291.95 302.95 313.95 324.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">至少需要调用打分器</text><text x="338.84 344.97" y="113.85" font-size="11.00" class="sc-loraregular">30</text><text x="354.69 365.69 376.69 387.69 398.69 409.69 420.69 431.69 442.69 453.69 464.69 475.69 486.69 497.69 508.69 519.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次才能达到参考值，而且在整个过程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">中都未能达到阈值。</text><text x="72.00 83.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="96.89" y="195.95" font-size="11.00" class="sc-loraregular">2</text><text x="105.69 116.69 127.69 138.69 149.69 160.69 171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="195.95" font-size="11.00" class="sc-notoserifcjksc">项分析中，我们计算了越过阈值的尝试所占的累计比例，并将其解读为衡量模型在此任务</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">上表现稳定性的指标。我们发现，</text><text x="237.00 244.69 247.68 253.29 259.86 266.44 272.40 275.29 284.03 290.59 297.16 302.25 305.15 311.14 313.85" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="322.73 333.73 344.73 355.73 366.73 377.73 388.73" y="211.57" font-size="11.00" class="sc-notoserifcjksc">在这项任务中约</text><text x="402.63 408.99 415.82" y="211.57" font-size="11.00" class="sc-loraregular">60%</text><text x="428.28 439.28 450.28 461.28 472.28 483.28 494.28 505.28 516.28 527.28" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的尝试达到了阈值。总</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">体而言，我们观察到，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 229.03 235.59 242.16 247.25 250.15 256.14 258.85" y="227.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="227.19" font-size="11.00" class="sc-notoserifcjksc">比参与比较的模型更早、也更频繁地达到并超过阈值，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">表明它是这项任务中表现最强的模型。</text><text x="72.00 78.12 80.90 87.02 89.79" y="305.43" font-size="10.67" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="99.38 110.05 120.71 131.38 142.05 152.71 163.38 174.05 184.71 195.38 206.05 216.71 227.38 238.05" y="305.43" font-size="10.67" class="sc-notosanscjkscbold" fill="#666666">美国人工智能标准与创新中心（</text><text x="248.71 256.15 262.64 265.18 273.38 279.96 287.01 291.15 297.73 302.04 304.58 308.26 315.06 319.37 321.91 329.55 332.51 335.05 341.55 345.68 352.92 359.97 367.20 374.43 378.74 385.97 391.79 394.32 401.56 408.61 415.84 418.38 421.34 428.39 435.44 442.25 448.64 455.87 460.01 462.97 469.78" y="305.43" font-size="10.67" class="sc-poppinssemibold" fill="#666666">US Center for AI Standards and Innovation</text><text x="476.83 487.50 498.16 508.83 519.50 530.16" y="305.43" font-size="10.67" class="sc-notosanscjkscbold" fill="#666666">）的外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="361.96" font-size="11.00" class="sc-notoserifcjksc">我们与隶属于美国国家标准与技术研究院（</text><text x="281.00 289.33 294.93 299.18 302.27 308.71 315.39 321.06 324.05 326.95 330.54 337.22 342.31 346.57 349.84 354.09 360.66 364.92 370.88 373.77 380.15 383.87 386.76 392.96 397.21 402.89 409.57 416.15 421.82 426.51 433.09 438.18 441.07 446.75 453.42 460.00 462.90 469.40 475.30 481.16 487.74 494.42 500.86 503.85 510.28 516.59" y="361.96" font-size="11.00" class="sc-loraregular">National Institute of Standards and Technology</text><text x="522.40" y="361.96" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 80.38 84.07 90.30" y="377.58" font-size="11.00" class="sc-loraregular">NIST</text><text x="97.34 108.34 119.34 130.34 141.34 152.34 163.34 174.34 185.34 196.34 207.34 218.34 229.34 240.34 251.34 262.34" y="377.58" font-size="11.00" class="sc-notoserifcjksc">）的美国人工智能标准与创新中心（</text><text x="273.34 280.92 287.81 291.49 297.73" y="377.58" font-size="11.00" class="sc-loraregular">CAISI</text><text x="301.42 312.42 323.42 334.42 345.42 356.42 367.42 378.42 389.42 400.42 411.42 422.42 433.42 444.42 455.42 466.42 477.42 488.42 499.42 510.42 521.42" y="377.58" font-size="11.00" class="sc-notoserifcjksc">）合作，测量网络安全和生物学能力及安全防护</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="393.20" font-size="11.00" class="sc-notoserifcjksc">措施，以及非预期的模型行为。</text><text x="72.00 79.46 82.84 90.30 93.68" y="425.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.5</text><text x="105.15 118.15" y="425.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="456.96" font-size="11.00" class="sc-notoserifcjksc">我们结合自动化评估与人工测试，了解</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.03 338.74" y="456.96" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="347.63" y="456.96" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="361.52 369.21" y="456.96" font-size="11.00" class="sc-loraregular">CB</text><text x="378.94 389.94 400.94 411.94 422.94 433.94 444.94 455.94 466.94 477.94 488.94 499.94 510.94 521.94" y="456.96" font-size="11.00" class="sc-notoserifcjksc">相关的能力。我们的自动化评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="472.58" font-size="11.00" class="sc-notoserifcjksc">对两用能力和能力提升的评估范围必然有限，而且经过精心筛选，以最大限度地激发特定模型能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="488.20" font-size="11.00" class="sc-notoserifcjksc">力，因此可能无法捕捉一般能力进步所带来的风险，这些进步会提高生物学研究的效率。同样，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.82" font-size="11.00" class="sc-notoserifcjksc">这些评估可能无法捕捉在真实研究环境中部署大语言模型的细微差别。我们的判断仍然是：即使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="519.44" font-size="11.00" class="sc-notoserifcjksc">对于拥有丰富大语言模型使用经验的专家研究人员，要从模型中激发出最大程度的科研能力提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="535.06" font-size="11.00" class="sc-notoserifcjksc">升，仍是一个充满挑战且容易出错的过程。</text><text x="72.00 83.00 94.00" y="618.88" font-size="11.00" class="sc-notoserifcjksc">在整个</text><text x="107.89 115.58" y="618.88" font-size="11.00" class="sc-loraregular">CB</text><text x="125.32 136.32 147.32 158.32 169.32 180.32" y="618.88" font-size="11.00" class="sc-notoserifcjksc">评估组合中，</text><text x="191.32 199.01 202.00 207.61 214.18 220.75 226.72 229.61 238.34 244.91 251.48 256.57 259.46 265.46 268.16" y="618.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="277.05" y="618.88" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="290.94 298.63 301.62 307.24 313.80 320.38 326.34 329.24 339.17 345.03 349.29 355.88 362.31 367.40 370.30 376.29 379.00" y="618.88" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="385.90 396.90 407.90 418.90 429.90 440.90 451.90 462.90 473.90 484.90 495.90 506.90 517.90 528.90" y="618.88" font-size="11.00" class="sc-notoserifcjksc">的能力差异较小。总体而言，我</text><text x="72.00 83.00 94.00" y="634.50" font-size="11.00" class="sc-notoserifcjksc">们预计</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="634.50" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63" y="634.50" font-size="11.00" class="sc-notoserifcjksc">将在一系列科学任务中发挥作用，其水平与</text><text x="405.52 413.21 416.20 421.81 428.38 434.96 440.92 443.81 453.74 459.61 463.86 470.45 476.89 481.98 484.87 490.87 493.57" y="634.50" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="500.47 511.47 522.47" y="634.50" font-size="11.00" class="sc-notoserifcjksc">相当或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="650.12" font-size="11.00" class="sc-notoserifcjksc">略高。然而，对于我们能够评估的科学任务，</text><text x="292.00 299.69 302.68 308.29 314.86 321.44 327.40 330.29 339.03 345.59 352.16 357.25 360.14 366.14 368.85" y="650.12" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="377.73 388.73 399.73 410.73 421.73 432.73" y="650.12" font-size="11.00" class="sc-notoserifcjksc">似乎并未改善</text><text x="446.63 454.32 457.31 462.92 469.48 476.06 482.02 484.92 494.85 500.71 504.97 511.56 517.99 523.09 525.98 531.98 534.68" y="650.12" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="203.51 210.41 216.65" y="665.74" font-size="11.00" class="sc-loraregular">RSP</text><text x="226.21" y="665.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="240.10 246.05 253.74" y="665.74" font-size="11.00" class="sc-loraregular">FCF</text><text x="259.77 270.77 281.77 292.77 303.77 314.77 325.77 336.77 347.77 358.77" y="665.74" font-size="11.00" class="sc-notoserifcjksc">，我们认为这些弱点使</text><text x="372.66 380.35 383.34 388.95 395.52 402.10 408.06 410.95 420.89 426.75 431.01 437.60 444.03 449.12 452.02 458.01 460.72" y="665.74" font-size="11.00" class="sc-loraregular">Claude
