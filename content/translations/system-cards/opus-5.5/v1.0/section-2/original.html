font-size="11.00" class="sc-notoserifcjksc">能力阈值判定的重要组成部</text><text x="72.00" y="405.31" font-size="11.00" class="sc-notoserifcjksc">分。因此，我们没有对</text><text x="184.89" y="405.31" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="270.63" y="405.31" font-size="11.00" class="sc-notoserifcjksc">运行这些自动化评估。</text><text x="72.00" y="469.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3 Claude Opus 5.5</text><text x="216.83" y="469.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">相对于人类</text><text x="72.00" y="491.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究人员的定性不足</text><text x="72.00" y="519.88" font-size="11.00" class="sc-notoserifcjksc">与以往的一些系统卡一样，我们收集并审视了来自真实内部使用的案例，在这些案例中，</text><text x="501.00" y="519.88" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="535.50" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="535.50" font-size="11.00" class="sc-notoserifcjksc">未能达到我们对熟练人类研究人员所期望的表现，或未能充分替代或自动化人类的指</text><text x="72.00" y="551.12" font-size="11.00" class="sc-notoserifcjksc">导。（其中许多问题与行为问题或与对齐相近的问题有关，但它们仍以某种方式限制了我们在内</text><text x="72.00" y="566.74" font-size="11.00" class="sc-notoserifcjksc">部使用该模型实现工作自动化的能力，因此与能力评估相关。）</text><text x="72.00" y="633.22" font-size="11.00" class="sc-notoserifcjksc">我们在本节中不引用缺陷的具体示例；部分示例可见于本系统卡的其他章节。总体而言，我们发</text><text x="72.00" y="648.84" font-size="11.00" class="sc-notoserifcjksc">现，与</text><text x="107.89" y="648.84" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="161.73" y="648.84" font-size="11.00" class="sc-notoserifcjksc">研究人员相比，</text><text x="238.73" y="648.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="324.46" y="648.84" font-size="11.00" class="sc-notoserifcjksc">仍有许多弱点，这些弱点会使它无法完全取</text><text x="72.00" y="664.46" font-size="11.00" class="sc-notoserifcjksc">代人类研究人员。</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="248.85" y="365.27" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="259.85" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="262.74" y="365.27" width="15.02" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="277.76" y="365.27" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="280.65" y="365.27" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00 77.86 80.42 86.58 89.14 95.15 97.71 102.17 105.06 112.63 118.57 125.84 131.75 138.77 144.46 151.29 154.18 160.04 162.60" y="503.91" font-size="11.00" class="sc-lorabold">2.3.4.1 CoBench 2.1</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们观察到的主要问题集中在认知质量和指令遵循方面。在一项针对我们内部智能体部署中被标</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">记行为的早期且噪声较大的分析中，与以往模型相比，</text><text x="336.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="421.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">夸大工作范围以及从结</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果中删去已知限定条件的情况有所增加。随后一项对真实消息的独立盲读发现，</text><text x="457.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">删去限定条件的频率并不高于以往模型。与以往模型类似，被标记行为中最主要的子类别是将未</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">经验证的推断断言为既定事实。第二常见的子类别是忽视自身的疑虑或放弃自己陈述过的计划，</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">其频率相对于以往模型也有所上升。内部使用中的例子包括：将部分检查描述为完整阅读，以及</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">在未加核实的情况下将一个初步的解读变成一项建议。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们还看到了策略性错误。在内部使用中，</text><text x="281.00" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="366.73" y="260.72" font-size="11.00" class="sc-notoserifcjksc">曾狭隘地处理评审反馈，而没有重</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">新考虑整体设计是否正确；还曾对照它自己编写的需求来检查一项计划，而不是对照该计划旨在</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">服务的人。与以往模型一样，它在开放式研究方面较弱：内部用户报告称，它大多测试渐进式的</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">想法，并偏好不那么大胆的假设；在我们由人类主导的生物学演练中，它遵从已发表的文献，难</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc">以提出新颖的想法（第</text><text x="184.89" y="323.20" font-size="11.00" class="sc-loraregular">2.2.2</text><text x="210.92" y="323.20" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">一些在以往模型中更为突出的问题有所减少。</text><text x="292.00" y="390.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="377.73" y="390.26" font-size="11.00" class="sc-notoserifcjksc">的破坏性低于此前发布的任何模</text><text x="72.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">型；与</text><text x="107.89" y="405.88" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="202.85" y="405.88" font-size="11.00" class="sc-notoserifcjksc">相比，这一下降很大程度上源于</text><text x="359.74" y="405.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="445.47" y="405.88" font-size="11.00" class="sc-notoserifcjksc">更有可能在采取潜</text><text x="72.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">在破坏性操作之前先询问用户。</text><text x="72.00" y="471.57" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4 AI</text><text x="121.71" y="471.57" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部衡量指标</text><text x="72.00" y="535.84" font-size="11.00" class="sc-notoserifcjksc">正如我们的</text><text x="129.89" y="535.84" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="157.71" y="535.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="171.60" y="535.84" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="180.68" y="535.84" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="235.68" y="535.84" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="249.57" y="535.84" font-size="11.00" class="sc-loraregular">3.4</text><text x="267.26" y="535.84" font-size="11.00" class="sc-notoserifcjksc">节所述，我们开发了一项内部评估</text><text x="435.15" y="535.84" font-size="11.00" class="sc-loraregular sc-k">CoBench</text><text x="480.94" y="535.84" font-size="11.00" class="sc-notoserifcjksc">，旨在衡量</text><text x="72.00" y="551.46" font-size="11.00" class="sc-notoserifcjksc">模型在真实内部研发任务上的进展。该评估衡量的是：当模型被置于</text><text x="404.89" y="551.46" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="458.73" y="551.46" font-size="11.00" class="sc-notoserifcjksc">基础设施的某个</text><text x="72.00" y="567.08" font-size="11.00" class="sc-notoserifcjksc">历史时间点（即获得我们的代码库、日志、内部消息和文档在过去某一时间戳的快照）时，它能</text><text x="72.00" y="582.70" font-size="11.00" class="sc-notoserifcjksc">在多大程度上诊断出</text><text x="173.89" y="582.70" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="227.73" y="582.70" font-size="11.00" class="sc-notoserifcjksc">工程师实际解决过的问题的根本原因。各问题由模型评分，所用</text><text x="72.00" y="598.32" font-size="11.00" class="sc-notoserifcjksc">评分细则将解决方案与我们在实践中确定的根本原因进行比较，而该根本原因在被评估模型可获</text><text x="72.00" y="613.94" font-size="11.00" class="sc-notoserifcjksc">得的历史快照中是不可见的。关于这项评估的更多细节见我们的风险报告。</text><text x="72.00" y="681.56" font-size="11.00" class="sc-notoserifcjksc">本系统卡中使用的评估版本称为</text><text x="228.89" y="681.56" font-size="11.00" class="sc-loraregular sc-k">CoBench 2.1</text><text x="290.18" y="681.56" font-size="11.00" class="sc-notoserifcjksc">，它在</text><text x="326.08" y="681.56" font-size="11.00" class="sc-loraregular">500</text><text x="348.63" y="681.56" font-size="11.00" class="sc-notoserifcjksc">个问题上对每个模型各运行一次。自</text><text x="72.00" y="697.18" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="155.40" y="697.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="169.29" y="697.18" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="264.25" y="697.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="297.25" y="697.18" font-size="11.00" class="sc-notoserifcjksc">以来，评估环境已发生重大变化；在权重未作任何</text><text x="72.00" y="712.80" font-size="11.00" class="sc-notoserifcjksc">改变的情况下，同样的模型在</text><text x="217.89" y="712.80" font-size="11.00" class="sc-loraregular sc-k">CoBench 2.1</text><text x="282.08" y="712.80" font-size="11.00" class="sc-notoserifcjksc">上的得分</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="129.89" y="527.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="129.89" y="527.04" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="154.82" y="527.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="157.71" y="527.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="168.71" y="527.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="171.60" y="527.04" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="177.79" y="527.04" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="180.68" y="527.04" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="191.68" y="527.04" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="191.68" y="527.04" width= <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p037.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 37 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular sc-k">37</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">低于在该系统卡所报告版本上的得分。</text><text x="259.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="336.03" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在此版本评估中得分</text><text x="437.93" y="82.61" font-size="11.00" class="sc-loraregular">53.2%</text><text x="468.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，而在先前版</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">本中为</text><text x="107.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">59.6%</text><text x="138.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="149.59" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="244.55" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在此版本中得分</text><text x="324.44" y="98.23" font-size="11.00" class="sc-loraregular">53.4%</text><text x="354.80" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，而在先前版本中为</text><text x="456.69" y="98.23" font-size="11.00" class="sc-loraregular sc-k">57.6%</text><text x="485.80" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。因此，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">CoBench 2.1</text><text x="136.18" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的得分与早期系统卡或我们</text><text x="271.08" y="113.85" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="298.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="312.79" y="113.85" font-size="11.00" class="sc-loraregular">8</text><text x="321.87" y="113.85" font-size="11.00" class="sc-notoserifcjksc">月风险报告中的</text><text x="401.76" y="113.85" font-size="11.00" class="sc-loraregular sc-k">CoBench</text><text x="450.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">得分不可比。</text><text x="72.00" y="475.08" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="475.08" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.79 107.89 111.55 113.64 119.18 122.65 125.02 131.21 134.02 138.74 144.30 149.66 154.50 156.87 163.79 169.20 174.76 179.13 181.49 186.35 188.45" y="475.08" font-size="9.00" class="sc-lorabold">2.3.4.1.A] Claude Opus 5.5</text><text x="193.31" y="475.08" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="202.31" y="475.08" font-size="9.00" class="sc-lorabold sc-k">Claude Mythos 5.1</text><text x="281.67" y="475.08" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="293.04" y="475.08" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="356.74" y="475.08" font-size="9.00" class="sc-notoserifcjkscbold">的得分彼此处于噪声范围内</text><text x="464.74" y="475.08" font-size="9.00" class="sc-notoserifcjksc">（基于</text><text x="494.11" y="475.08" font-size="9.00" class="sc-loraregular sc-k">CoBench</text><text x="72.00" y="486.78" font-size="9.00" class="sc-loraregular">2.1</text><text x="82.32" y="486.78" font-size="9.00" class="sc-notoserifcjksc">）。每根柱表示模型在一次尝试中解决的问题占</text><text x="273.69" y="486.78" font-size="9.00" class="sc-loraregular">500</text><text x="292.14" y="486.78" font-size="9.00" class="sc-notoserifcjksc">个问题的百分比。</text><text x="364.14" y="486.78" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="427.17" y="486.78" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="447.53" y="486.78" font-size="9.00" class="sc-loraregular">53.2%</text><text x="472.33" y="486.78" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="481.33" y="486.78" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="498.48" font-size="9.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="118.36" y="498.48" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="138.73" y="498.48" font-size="9.00" class="sc-loraregular">53.4%</text><text x="163.57" y="498.48" font-size="9.00" class="sc-notoserifcjksc">，</text><text x="172.57" y="498.48" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="242.71" y="498.48" font-size="9.00" class="sc-notoserifcjksc">得分</text><text x="263.08" y="498.48" font-size="9.00" class="sc-loraregular">55.8%</text><text x="287.99" y="498.48" font-size="9.00" class="sc-notoserifcjksc">。三个模型均通过</text><text x="362.36" y="498.48" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="378.78" y="498.48" font-size="9.00" class="sc-notoserifcjksc">采样，</text><text x="405.78" y="498.48" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="422.21" y="498.48" font-size="9.00" class="sc-notoserifcjksc">安全过滤器处于关闭状态，使</text><text x="72.00" y="510.18" font-size="9.00" class="sc-notoserifcjksc">用相同版本的评估代码和相同的</text><text x="200.37" y="510.18" font-size="9.00" class="sc-loraregular">500</text><text x="218.82" y="510.18" font-size="9.00" class="sc-notoserifcjksc">个问题。</text><text x="254.82" y="510.18" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="324.96" y="510.18" font-size="9.00" class="sc-notoserifcjksc">的运行比另外两个模型晚</text><text x="426.33" y="510.18" font-size="9.00" class="sc-loraregular">13</text><text x="436.99" y="510.18" font-size="9.00" class="sc-notoserifcjksc">天。在此期间，环境的一</text><text x="72.00" y="521.88" font-size="9.00" class="sc-notoserifcjksc">项变化估计会带来</text><text x="146.37" y="521.88" font-size="9.00" class="sc-loraregular">0</text><text x="154.32" y="521.88" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="165.69" y="521.88" font-size="9.00" class="sc-loraregular">1</text><text x="171.33" y="521.88" font-size="9.00" class="sc-notoserifcjksc">分的影响，另外两项变化尚未测量。这三个得分在统计上无法区分（对相同</text><text x="470.70" y="521.88" font-size="9.00" class="sc-loraregular">500</text><text x="489.15" y="521.88" font-size="9.00" class="sc-notoserifcjksc">个问题进行</text><text x="72.00" y="533.58" font-size="9.00" class="sc-notoserifcjksc">的配对检验给出</text><text x="137.37" y="533.58" font-size="9.00" class="sc-loraregular">p</text><text x="145.11" y="533.58" font-size="9.00" class="sc-notoserifcjksc">≈</text><text x="156.47" y="533.58" font-size="9.00" class="sc-loraregular sc-k">0.2</text><text x="168.97" y="533.58" font-size="9.00" class="sc-notoserifcjksc">）。这些得分与早期系统卡中的</text><text x="297.33" y="533.58" font-size="9.00" class="sc-loraregular sc-k">CoBench</text><text x="337.16" y="533.58" font-size="9.00" class="sc-notoserifcjksc">得分不可比。</text><text x="72.00" y="593.62" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00" y="593.62" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="243.95" y="593.62" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="257.85" y="593.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="334.88" y="593.62" font-size="11.00" class="sc-notoserifcjksc">的得分相差在</text><text x="403.77" y="593.62" font-size="11.00" class="sc-loraregular sc-k">0.2</text><text x="421.93" y="593.62" font-size="11.00" class="sc-notoserifcjksc">分以内，</text><text x="465.93" y="593.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="609.24" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="609.24" font-size="11.00" class="sc-notoserifcjksc">的得分比</text><text x="136.48" y="609.24" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="231.43" y="609.24" font-size="11.00" class="sc-notoserifcjksc">高</text><text x="245.33" y="609.24" font-size="11.00" class="sc-loraregular">2.4</text><text x="262.80" y="609.24" font-size="11.00" class="sc-notoserifcjksc">分。</text><text x="72.00" y="642.20" font-size="11.00" class="sc-notoserifcjksc">正如我们在风险报告中所讨论的，我们认为，一个能够完全替代</text><text x="382.89" y="642.20" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="436.73" y="642.20" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型在这</text><text x="72.00" y="657.82" font-size="11.00" class="sc-notoserifcjksc">项评估的先前版本上将能够获得至少</text><text x="250.89" y="657.82" font-size="11.00" class="sc-loraregular">85%</text><text x="275.53" y="657.82" font-size="11.00" class="sc-notoserifcjksc">的得分，并且我们预计这一阈值同样适用于</text><text x="487.43" y="657.82" font-size="11.00" class="sc-loraregular sc-k">CoBench</text><text x="72.00" y="673.44" font-size="11.00" class="sc-loraregular">2.1</text><text x="84.62" y="673.44" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="95.62" y="673.44" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="181.35" y="673.44" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="206.24" y="673.44" font-size="11.00" class="sc-loraregular">55.8%</text><text x="236.69" y="673.44" font-size="11.00" class="sc-notoserifcjksc">，这是</text><text x="272.59" y="673.44" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="320.03" y="673.44" font-size="11.00" class="sc-notoserifcjksc">未满足这一标准的又一证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5 AECI</text><text x="138.39" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="109.04" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89" y="109.04" font-size="11.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="190.94" y="109.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="109.04" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="109.04" font-size="11.00" class="sc-notoserifcjksc">）追踪我们模型的能力随时间提升的速度，它是</text><text x="460.94" y="109.04" font-size="11.00" class="sc-loraregular sc-k">Epoch AI</text><text x="509.50" y="109.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="124.66" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Epoch Capabilities Index</text><text x="201.24" y="124.66" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本。有关我们方法的详细信息，请参阅</text><text x="457.13" y="124.66" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="495.42" y="124.66" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos</text><text x="72.00" y="140.28" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Preview</text><text x="115.53" y="140.28" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="148.53" y="140.28" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="162.42" y="140.28" font-size="11.00" class="sc-loraregular sc-k">2.3.6</text><text x="189.01" y="140.28" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00" y="173.80" font-size="11.00" class="sc-lorabold">2.3.5.1 AECI</text><text x="133.94" y="173.80" font-size="11.00" class="sc-notoserifcjkscbold">基准组合更新</text><text x="72.00" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在对</text><text x="96.89" y="206.19" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5.5</text><text x="182.63" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的评估中，我们更新了构成</text><text x="317.52" y="206.19" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AECI</text><text x="345.52" y="206.19" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的基准组合，并基于更新后的数据重新</text><text x="72.00" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">拟合了该指数。</text><text x="149.00" y="221.81" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="232.40" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="246.30" y="221.81" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="341.25" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="374.25" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">中使用的拟合涵盖了</text><text x="476.14" y="221.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">525</text><text x="496.93" y="221.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个模型</text><text x="72.00" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（内部和外部）上的</text><text x="173.89" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">338</text><text x="195.22" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试和</text><text x="264.11 270.11 272.88 279.06 285.06" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">5,853</text><text x="294.09" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个观测值。本系统卡中使用的拟合涵盖</text><text x="483.98" y="237.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">732</text><text x="503.98" y="237.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个模型</text><text x="72.00" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的</text><text x="96.89" y="253.05" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">374</text><text x="116.53" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试和</text><text x="185.42 190.01 192.78 199.14 205.32" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7,985</text><text x="214.22" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个观测值。此次更新包括：重新导入截至</text><text x="415.11" y="253.05" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">2026</text><text x="442.93" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">年</text><text x="456.82" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">9</text><text x="466.08" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">月</text><text x="479.97" y="253.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">16</text><text x="493.22" y="253.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">日的</text><text x="72.00" y="268.67" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Epoch AI</text><text x="120.57" y="268.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">公开基准测试数据；若干新的高难度内部评估；在已发布模型上新运行的中等难度基准</text><text x="72.00" y="284.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">测试，以及在两个较早模型上新运行的以高难度为主的评估；以及对若干错误的基准测试、运行</text><text x="72.00" y="299.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和结果的修正。我们做出这些更改是为了改善量表顶部和中部的覆盖范围，并纠正输入中的已知</text><text x="72.00" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">错误。在这一更新后的新基准组合上，</text><text x="259.00" y="315.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 5.5</text><text x="306.44" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="320.34" y="315.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">43</text><text x="335.32" y="315.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">项基准测试上获得评分。</text><text x="72.00" y="400.49" font-size="11.00" class="sc-notoserifcjksc">由于每次重新拟合都会重新估计整个量表，此次拟合得到的</text><text x="360.89" y="400.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="388.89" y="400.49" font-size="11.00" class="sc-notoserifcjksc">值与早期系统卡中的</text><text x="490.78" y="400.49" font-size="11.00" class="sc-loraregular">AECI</text><text x="518.78" y="400.49" font-size="11.00" class="sc-notoserifcjksc">值不</text><text x="72.00" y="416.11" font-size="11.00" class="sc-notoserifcjksc">可比。相对于先前的拟合，我们近期前沿模型（从</text><text x="316.89" y="416.11" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="439.77" y="416.11" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="453.67" y="416.11" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="507.44" y="416.11" font-size="11.00" class="sc-notoserifcjksc">）的值</text><text x="72.00" y="431.73" font-size="11.00" class="sc-notoserifcjksc">上升了</text><text x="107.89" y="431.73" font-size="11.00" class="sc-loraregular">4.1</text><text x="123.46" y="431.73" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="137.35" y="431.73" font-size="11.00" class="sc-loraregular">6.1</text><text x="153.31" y="431.73" font-size="11.00" class="sc-notoserifcjksc">分；较早的</text><text x="211.21" y="431.73" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="249.50" y="431.73" font-size="11.00" class="sc-notoserifcjksc">模型变动较小，而最弱的较早模型则有所下降。例如，</text><text x="72.00" y="447.35" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="128.66" y="447.35" font-size="11.00" class="sc-notoserifcjksc">在其系统卡中得分</text><text x="219.55" y="447.35" font-size="11.00" class="sc-loraregular sc-k">162.0</text><text x="245.20" y="447.35" font-size="11.00" class="sc-notoserifcjksc">，在更新后的拟合中得分</text><text x="369.09" y="447.35" font-size="11.00" class="sc-loraregular">168.12</text><text x="398.25" y="447.35" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="409.25" y="447.35" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="486.28" y="447.35" font-size="11.00" class="sc-notoserifcjksc">则从</text><text x="511.18" y="447.35" font-size="11.00" class="sc-loraregular sc-k">160.7</text><text x="72.00" y="462.97" font-size="11.00" class="sc-notoserifcjksc">变为</text><text x="96.89" y="462.97" font-size="11.00" class="sc-loraregular">165.18</text><text x="126.14" y="462.97" font-size="11.00" class="sc-notoserifcjksc">。因此，模型之间的比较应在同一拟合内进行（如图</text><text x="382.04" y="462.97" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="426.79" y="462.97" font-size="11.00" class="sc-notoserifcjksc">所示），而不应跨不同</text><text x="72.00" y="478.59" font-size="11.00" class="sc-notoserifcjksc">的系统卡进行。</text><text x="72.00" y="546.22" font-size="11.00" class="sc-lorabold">2.3.5.2</text><text x="106.41" y="546.22" font-size="11.00" class="sc-notoserifcjkscbold">关于</text><text x="131.30" y="546.22" font-size="11.00" class="sc-lorabold">AECI</text><text x="160.23" y="546.22" font-size="11.00" class="sc-notoserifcjkscbold">误差线的讨论</text><text x="72.00" y="578.60" font-size="11.00" class="sc-notoserifcjksc">在本系统卡中，我们还更新了报告</text><text x="239.89" y="578.60" font-size="11.00" class="sc-loraregular">AECI</text><text x="267.89" y="578.60" font-size="11.00" class="sc-notoserifcjksc">点误差线的方法。与以往的系统卡类似，我们通过自助</text><text x="72.00" y="594.22" font-size="11.00" class="sc-notoserifcjksc">法重拟合（</text><text x="201.63" y="594.22" font-size="11.00" class="sc-notoserifcjksc">）来估计误差。每次重拟合随机剔除</text><text x="380.53" y="594.22" font-size="11.00" class="sc-loraregular">20%</text><text x="405.73" y="594.22" font-size="11.00" class="sc-notoserifcjksc">的基准测试，重新拟合整个</text><text x="72.00" y="609.84" font-size="11.00" class="sc-notoserifcjksc">指数，并重新固定量表的两个锚点。每根误差线表示这些重拟合结果的</text><text x="415.89" y="609.84" font-size="11.00" class="sc-loraregular">95%</text><text x="440.71" y="609.84" font-size="11.00" class="sc-notoserifcjksc">范围。然而，我们注</text><text x="72.00" y="625.46" font-size="11.00" class="sc-notoserifcjksc">意到，在</text><text x="118.89" y="625.46" font-size="11.00" class="sc-loraregular">AECI</text><text x="146.89" y="625.46" font-size="11.00" class="sc-notoserifcjksc">量表上彼此接近的模型在自助法重采样中会一同移动，因而它们在各次重采样之</text><text x="72.00" y="641.08" font-size="11.00" class="sc-notoserifcjksc">间的偏移是相关的。此外，由于基准测试的覆盖范围沿</text><text x="338.89" y="641.08" font-size="11.00" class="sc-loraregular">AECI</text><text x="366.89" y="641.08" font-size="11.00" class="sc-notoserifcjksc">量表并不均匀，且</text><text x="457.78" y="641.08" font-size="11.00" class="sc-loraregular">AECI</text><text x="485.78" y="641.08" font-size="11.00" class="sc-notoserifcjksc">量表由两个</text><text x="134.61" y="656.70" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 3.5</text><text x="229.68" y="656.70" font-size="11.00" class="sc-notoserifcjksc">位于</text><text x="254.58" y="656.70" font-size="11.00" class="sc-loraregular">130</text><text x="271.54" y="656.70" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="282.54" y="656.70" font-size="11.00" class="sc-loraregular sc-k">GPT-5</text><text x="318.18" y="656.70" font-size="11.00" class="sc-notoserifcjksc">位于</text><text x="343.07" y="656.70" font-size="11.00" class="sc-loraregular">150</text><text x="72.00" y="672.32" font-size="11.00" class="sc-notoserifcjksc">重拟合之间比远离锚点的得分（例如位于</text><text x="272.89" y="672.32" font-size="11.00" class="sc-loraregular">AECI</text><text x="300.89" y="672.32" font-size="11.00" class="sc-notoserifcjksc">量表前沿一端的得分）更稳定。在</text><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="523.40" y="100.24" width="0.00" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="72.00" y="115.86" width="32.21" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="104.21" y="115.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="107.10" y="115.86" width="59.76" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="166.86" y="115.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://epoch.ai/eci?view=graph&amp;tab=release-date&amp;subset-view=graph&amp;subset-tab=Software+engineering" rel="noopener"><rect x="169.76" y="115.86" width="28.59" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="457.13" y="115.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="457.13" y="115.86" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="495.42" y="115.86" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener"><rect x="533.59" y="115.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/08ab9158070959f88f296514c21b7facce6f52bc.pdf" rel="noopener" 28.81" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="210.75 214.75 221.10 227.10 229.80 233.80" y="528.81" font-size="11.00" class="sc-loraregular">165.18</text><text x="274.50 278.50 284.85 288.86 291.56 295.56" y="528.81" font-size="11.00" class="sc-loraregular">161.16</text><text x="345.75 349.75 354.82 358.82 361.52 365.53" y="528.81" font-size="11.00" class="sc-loraregular">171.11</text><text x="411.00 415.00 421.35 427.31 430.02 435.75" y="528.81" font-size="11.00" class="sc-loraregular">164.23</text><text x="476.25 480.25 486.60 492.96 495.66 501.65" y="528.81" font-size="11.00" class="sc-loraregular">166.51</text><text x="74.25 81.81 85.24 91.00 97.80 104.35 110.26 113.15 123.46 129.52 134.06 140.88 147.11 152.44 155.33 161.26 163.83" y="550.25" font-size="11.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="210.75 214.75 221.10 227.28 229.99 233.99" y="550.25" font-size="11.00" class="sc-loraregular">168.12</text><text x="274.50 278.50 284.85 290.98 293.68 300.03" y="550.25" font-size="11.00" class="sc-loraregular">163.92</text><text x="345.75 349.75 354.66 360.62 363.33 369.68" y="550.25" font-size="11.00" class="sc-loraregular">174.99</text><text x="411.00 415.00 421.28 425.86 428.40 435.23" y="550.25" font-size="11.00" class="sc-loraregular">167.01</text><text x="476.25 480.25 486.60 492.78 495.49 501.48" y="550.25" font-size="11.00" class="sc-loraregular">169.59</text><text x="74.25 81.81 85.24 91.00 97.80 104.35 110.26 113.15 121.60 128.21 135.00 140.34 143.23 149.16 151.72" y="571.69" font-size="11.00" class="sc-lorabold">Claude Opus 5.5</text><text x="210.75 214.75 221.10 227.28 229.99 236.11" y="571.69" font-size="11.00" class="sc-loraregular">169.36</text><text x="274.50 278.50 284.85 290.85 293.55 299.29" y="571.69" font-size="11.00" class="sc-loraregular">165.23</text><text x="345.75 349.75 354.82 359.40 361.94 368.77" y="571.69" font-size="11.00" class="sc-loraregular">177.05</text><text x="411.00 415.00 421.28 425.86 428.57 434.92" y="571.69" font-size="11.00" class="sc-loraregular">167.99</text><text x="476.25 480.25 485.32 489.32 492.02 497.68" y="571.69" font-size="11.00" class="sc-loraregular">171.24</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">39</text><text x="76.75" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="277.00" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间下</text><text x="277.00" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（全局）</text><text x="348.25" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间上</text><text x="348.25" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（全局）</text><text x="413.50" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间下</text><text x="413.50" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（局部）</text><text x="478.75" y="444.83" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">置信区间上</text><text x="478.75" y="460.45" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">限（局部）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">本系统卡中，我们报告两种置信区间（</text><text x="357.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）：一种是</text><text x="412.47" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">全局误差线</text><text x="467.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，反映我们对</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">AECI</text><text x="99.99" y="98.23" font-size="11.00" class="sc-notoserifcjksc">量表上绝对位置的不确定性（与以往系统卡相同）；另一种是</text><text x="396.99" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">局部误差线</text><text x="451.99" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，反映我们对相对</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">于邻近模型的相对位置的不确定性。两者均基于</text><text x="305.89" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="326.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">次自助法重拟合计算得出。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">近期前沿模型的全局误差线约为</text><text x="228.89" y="163.57" font-size="11.00" class="sc-loraregular">8</text><text x="237.97" y="163.57" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="251.86" y="163.57" font-size="11.00" class="sc-loraregular">12</text><text x="264.67" y="163.57" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="278.56" y="163.57" font-size="11.00" class="sc-loraregular">AECI</text><text x="306.55" y="163.57" font-size="11.00" class="sc-notoserifcjksc">点，并且随着与最接近前沿的锚点（</text><text x="482.55" y="163.57" font-size="11.00" class="sc-loraregular sc-k">GPT-5</text><text x="515.30" y="163.57" font-size="11.00" class="sc-notoserifcjksc">，位</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="179.19" font-size="11.00" class="sc-loraregular">150 AECI</text><text x="130.72" y="179.19" font-size="11.00" class="sc-notoserifcjksc">）距离的增加而变宽。当基准测试池发生变化时，前沿模型会一同移动（它们的自助</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">法抽样结果相关性为</text><text x="173.89" y="194.81" font-size="11.00" class="sc-loraregular sc-k">r = 0.97</text><text x="213.69" y="194.81" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="227.58" y="194.81" font-size="11.00" class="sc-loraregular sc-k">1.00</text><text x="247.79" y="194.81" font-size="11.00" class="sc-notoserifcjksc">），而它们的移动在很大程度上取决于在一次重拟合中剔除</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">了哪些难度在</text><text x="140.89" y="210.43" font-size="11.00" class="sc-loraregular">140</text><text x="160.58" y="210.43" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="174.48" y="210.43" font-size="11.00" class="sc-loraregular">160</text><text x="194.56" y="210.43" font-size="11.00" class="sc-notoserifcjksc">之间的广泛基准测试。这一误差的宽度几乎全部为其他前沿模型所共</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">有，并随着高于上锚点的距离增加而增长；它在很大程度上并非源于对某个特定模型的评估覆盖</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc">范围。对于</text><text x="129.89" y="241.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="212.73" y="241.67" font-size="11.00" class="sc-notoserifcjksc">，全局误差线为</text><text x="292.63 296.33 300.34 306.70 312.69 315.40 321.14 327.27 330.04 332.93 336.93 342.01 346.59 349.13 355.96 361.96" y="241.67" font-size="11.00" class="sc-loraregular">[165.23, 177.05]</text><text x="365.92" y="241.67" font-size="11.00" class="sc-notoserifcjksc">。在比较量表上相距较远的模型，</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc">以及评估</text><text x="118.89" y="257.29" font-size="11.00" class="sc-loraregular">AECI</text><text x="146.89" y="257.29" font-size="11.00" class="sc-notoserifcjksc">趋势的斜率变化时，我们使用全局误差线。</text><text x="72.00" y="325.27" font-size="11.00" class="sc-notoserifcjksc">局部误差线是该发布版本与在其之前最近的三个</text><text x="303.00" y="321.60" font-size="6.60" class="sc-loraregular">1</text><text x="305.40" y="325.27" font-size="11.00" class="sc-notoserifcjksc">公开</text><text x="330.30" y="325.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="368.59" y="325.27" font-size="11.00" class="sc-notoserifcjksc">发布版本平均值之差的</text><text x="481.48" y="325.27" font-size="11.00" class="sc-loraregular">95%</text><text x="506.30" y="325.27" font-size="11.00" class="sc-notoserifcjksc">范围。</text><text x="72.00" y="340.89" font-size="11.00" class="sc-notoserifcjksc">它们有助于了解一个模型相对于其同类的表现。由于前沿模型在各次重拟合中会一同移动，这些</text><text x="72.00" y="356.51" font-size="11.00" class="sc-notoserifcjksc">差距要小得多，约为</text><text x="173.89" y="356.51" font-size="11.00" class="sc-loraregular">2</text><text x="182.69" y="356.51" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="196.59" y="356.51" font-size="11.00" class="sc-loraregular">5</text><text x="205.47" y="356.51" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="219.37" y="356.51" font-size="11.00" class="sc-loraregular">AECI</text><text x="247.36" y="356.51" font-size="11.00" class="sc-notoserifcjksc">点。表</text><text x="283.26" y="356.51" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="328.01" y="356.51" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="352.91" y="356.51" font-size="11.00" class="sc-loraregular">2.3.5.3.A</text><text x="397.67" y="356.51" font-size="11.00" class="sc-notoserifcjksc">报告了每个模型的两种置信区</text><text x="72.00" y="372.13" font-size="11.00" class="sc-notoserifcjksc">间。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-lorabold">2.3.5.3 AECI</text><text x="135.64" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">数值与趋势</text><text x="72.00" y="587.87" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="587.87" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 112.87 114.97 120.50 123.98 126.34 131.86 137.27 142.36 147.02 152.61 154.98 161.17 165.89 171.30 176.01 181.17 184.11 186.92 189.83 193.55 196.49 201.33 205.70 208.06 211.45 217.19 222.55 227.39" y="587.87" font-size="9.00" class="sc-lorabold">2.3.5.3.A] Epoch Capabilities Index</text><text x="234.69" y="587.87" font-size="9.00" class="sc-notoserifcjkscbold">数值，更新后的拟合。</text><text x="324.69" y="587.87" font-size="9.00" class="sc-notoserifcjksc">近期</text><text x="345.06" y="587.87" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="376.39" y="587.87" font-size="9.00" class="sc-notoserifcjksc">模型的</text><text x="405.76" y="587.87" font-size="9.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="464.71" y="587.87" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="473.71" y="587.87" font-size="9.00" class="sc-loraregular">AECI</text><text x="494.24" y="587.87" font-size="9.00" class="sc-notoserifcjksc">）得分及</text><text x="72.00" y="599.57" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="599.57" font-size="9.00" class="sc-notoserifcjksc">不确定性范围。得分来自能力指数拟合的</text><text x="256.67" y="599.57" font-size="9.00" class="sc-loraregular">9</text><text x="264.24" y="599.57" font-size="9.00" class="sc-notoserifcjksc">月</text><text x="275.61" y="599.57" font-size="9.00" class="sc-loraregular">18</text><text x="286.31" y="599.57" font-size="9.00" class="sc-notoserifcjksc">日更新。</text><text x="322.31" y="599.57" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="382.97" y="599.57" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="391.97" y="599.57" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="469.66" y="599.57" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="481.02" y="599.57" font-size="9.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="611.27" font-size="9.00" class="sc-loraregular">5.5</text><text x="86.39" y="611.27" font-size="9.00" class="sc-notoserifcjksc">是在自适应思考（</text><text x="158.39" y="611.27" font-size="9.00" class="sc-loraregular sc-k">adaptive thinking</text><text x="230.86" y="611.27" font-size="9.00" class="sc-notoserifcjksc">）及</text><text x="251.23" y="611.27" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="269.80" y="611.27" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="314.80" y="611.27" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="338.51" y="611.27" font-size="9.00" class="sc-notoserifcjksc">）下测量的；更早的模型则在其表现最佳的配置下</text><text x="72.00" y="622.97" font-size="9.00" class="sc-notoserifcjksc">测量。全局置信区间是该拟合对得分给出的</text><text x="245.37" y="622.97" font-size="9.00" class="sc-loraregular">95%</text><text x="265.67" y="622.97" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间。在每次自助法抽样中，剔除</text><text x="448.04" y="622.97" font-size="9.00" class="sc-loraregular">20%</text><text x="468.66" y="622.97" font-size="9.00" class="sc-notoserifcjksc">的基准测试，重新</text><text x="72.00" y="634.67" font-size="9.00" class="sc-notoserifcjksc">拟合指数，并重新固定量表的两个校准锚点。局部置信区间是在相同的自助法抽样上，模型与在其之前的三个公开</text><text x="72.00" y="646.37" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="103.33" y="646.37" font-size="9.00" class="sc-notoserifcjksc">发布版本平均得分之差的</text><text x="204.70" y="646.37" font-size="9.00" class="sc-loraregular">95%</text><text x="225.00" y="646.37" font-size="9.00" class="sc-notoserifcjksc">范围，并以该模型的得分为中心重新定位；它显示了该拟合将该模型与其直接前</text><text x="72.00" y="658.07" font-size="9.00" class="sc-notoserifcjksc">代区分开来的精确程度。</text><text x="72.00" y="713.27" font-size="6.00" class="sc-loraregular">1</text><text x="76.81" y="716.60" font-size="10.00" class="sc-notoserifcjksc">选择之前的三个模型是一种惯例，并非由统计因素决定。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p040.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 40 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">40</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="390.43" font-size="9.00" class="sc-lorabold sc-k">2.3.5.3.B] Epoch Capabilities Index</text><text x="232.33" y="390.43" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="241.33" y="390.43" font-size="9.00" class="sc-loraregular">ECI</text><text x="256.23" y="390.43" font-size="9.00" class="sc-notoserifcjksc">）将多项基准测试上的表现综合为每个模型的一个数值。我们自己的这</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">一指标版本，即</text><text x="137.37" y="402.13" font-size="9.00" class="sc-loraregular sc-k">Anthropic ECI</text><text x="196.32" y="402.13" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="205.32" y="402.13" font-size="9.00" class="sc-loraregular">AECI</text><text x="225.85" y="402.13" font-size="9.00" class="sc-notoserifcjksc">），由内部基准测试结果驱动，因此其得分与</text><text x="408.22" y="402.13" font-size="9.00" class="sc-loraregular sc-k">Epoch</text><text x="436.94" y="402.13" font-size="9.00" class="sc-notoserifcjksc">的公开</text><text x="466.31" y="402.13" font-size="9.00" class="sc-loraregular">ECI</text><text x="483.58" y="402.13" font-size="9.00" class="sc-notoserifcjksc">排行榜不可直</text><text x="72.00" y="413.83" font-size="9.00" class="sc-notoserifcjksc">接比较。灰色圆点为以往的前沿</text><text x="200.37" y="413.83" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="231.70" y="413.83" font-size="9.00" class="sc-notoserifcjksc">模型；彩色圆点为最新的模型。细黑色误差线为</text><text x="423.06" y="413.83" font-size="9.00" class="sc-loraregular">100</text><text x="439.88" y="413.83" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="451.25" y="413.83" font-size="9.00" class="sc-loraregular">IRT</text><text x="468.05" y="413.83" font-size="9.00" class="sc-notoserifcjksc">重拟合的</text><text x="506.41" y="413.83" font-size="9.00" class="sc-loraregular">95%</text><text x="526.72" y="413.83" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="425.53" font-size="9.00" class="sc-notoserifcjksc">信区间，每次重拟合均基于随机抽取的</text><text x="227.37" y="425.53" font-size="9.00" class="sc-loraregular">80%</text><text x="248.21" y="425.53" font-size="9.00" class="sc-notoserifcjksc">基准测试子样本（全局误差）。粗紫色误差线来自相同的重采样拟合，但</text><text x="72.00" y="437.23" font-size="9.00" class="sc-notoserifcjksc">衡量的是每个得分相对于各模型之前三个发布版本的变动（局部误差）。两条线比较了关于前沿趋势的不同假设：实线</text><text x="72.00" y="448.93" font-size="9.00" class="sc-notoserifcjksc">沿用拟合至</text><text x="119.37" y="448.93" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="189.69" y="448.93" font-size="9.00" class="sc-notoserifcjksc">的趋势（</text><text x="225.69" y="448.93" font-size="9.00" class="sc-loraregular sc-k">14.7 AECI/</text><text x="268.82" y="448.93" font-size="9.00" class="sc-notoserifcjksc">年），并在</text><text x="316.19" y="448.93" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="416.73" y="448.93" font-size="9.00" class="sc-notoserifcjksc">处出现</text><text x="446.09" y="448.93" font-size="9.00" class="sc-loraregular">+5.9</text><text x="465.55" y="448.93" font-size="9.00" class="sc-notoserifcjksc">的一次性跃升；虚</text><text x="72.00" y="460.63" font-size="9.00" class="sc-notoserifcjksc">线则在拟合得到的断点（</text><text x="171.00" y="460.63" font-size="9.00" class="sc-loraregular sc-k">2025</text><text x="193.46" y="460.63" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="204.83" y="460.63" font-size="9.00" class="sc-loraregular">9</text><text x="212.40" y="460.63" font-size="9.00" class="sc-notoserifcjksc">月）处发生斜率变化（</text><text x="302.40" y="460.63" font-size="9.00" class="sc-loraregular">14.4</text><text x="320.01" y="460.63" font-size="9.00" class="sc-notoserifcjksc">→</text><text x="331.38" y="460.63" font-size="9.00" class="sc-loraregular sc-k">22.2 AECI/</text><text x="376.99" y="460.63" font-size="9.00" class="sc-notoserifcjksc">年）。在</text><text x="415.36" y="460.63" font-size="9.00" class="sc-loraregular">100</text><text x="432.18" y="460.63" font-size="9.00" class="sc-notoserifcjksc">次重采样拟合中，有</text><text x="515.55" y="460.63" font-size="9.00" class="sc-loraregular">99</text><text x="528.32" y="460.63" font-size="9.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="472.33" font-size="9.00" class="sc-notoserifcjksc">一次性跃升模型对数据的拟合更好。</text><text x="216.00" y="472.33" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="286.15" y="472.33" font-size="9.00" class="sc-notoserifcjksc">在新的重拟合上获得</text><text x="369.51" y="472.33" font-size="9.00" class="sc-loraregular sc-k">169.36 AECI</text><text x="420.75" y="472.33" font-size="9.00" class="sc-notoserifcjksc">的得分。</text><text x="456.75" y="472.33" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet</text><text x="72.00" y="484.03" font-size="9.00" class="sc-loraregular">3.5</text><text x="84.13" y="484.03" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="93.13" y="484.03" font-size="9.00" class="sc-loraregular sc-k">2024</text><text x="115.37" y="484.03" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="126.74" y="484.03" font-size="9.00" class="sc-loraregular">6</text><text x="134.31" y="484.03" font-size="9.00" class="sc-notoserifcjksc">月）将</text><text x="163.67" y="484.03" font-size="9.00" class="sc-loraregular">ECI</text><text x="180.94" y="484.03" font-size="9.00" class="sc-notoserifcjksc">量表锚定在</text><text x="228.31" y="484.03" font-size="9.00" class="sc-loraregular">130</text><text x="242.19" y="484.03" font-size="9.00" class="sc-notoserifcjksc">，因此它没有全局置信区间（其局部误差线反映的是其之前模型的不确定</text><text x="72.00" y="495.73" font-size="9.00" class="sc-notoserifcjksc">性）。报告近期模型在新量表上的得分，以便直接比较。</text><text x="72.00" y="575.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="575.21" font-size="11.00" class="sc-notoserifcjksc">的得分比历史趋势线高约</text><text x="281.63" y="575.21" font-size="11.00" class="sc-loraregular">6.5</text><text x="299.58" y="575.21" font-size="11.00" class="sc-notoserifcjksc">分，并且与始于</text><text x="379.47" y="575.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos Preview</text><text x="502.35" y="575.21" font-size="11.00" class="sc-notoserifcjksc">的平移</text><text x="72.00" y="590.83" font-size="11.00" class="sc-notoserifcjksc">趋势线相差在一分以内。</text><text x="193.00" y="590.83" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="240.44" y="590.83" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="254.34" y="590.83" font-size="11.00" class="sc-loraregular">AECI</text><text x="282.33" y="590.83" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="296.22" y="590.83" font-size="11.00" class="sc-loraregular sc-k">169.36</text><text x="327.96" y="590.83" font-size="11.00" class="sc-notoserifcjksc">（全局</text><text x="363.85" y="590.83" font-size="11.00" class="sc-loraregular">95%</text><text x="388.67" y="590.83" font-size="11.00" class="sc-notoserifcjksc">置信区间</text><text x="435.56 439.27 443.27 449.63 455.63 458.33 464.07 470.20 472.97 475.87 479.87 484.94 489.53 492.07 498.90 504.89" y="590.83" font-size="11.00" class="sc-loraregular">[165.23, 177.05]</text><text x="508.85" y="590.83" font-size="11.00" class="sc-notoserifcjksc">，局</text><text x="72.00" y="606.45" font-size="11.00" class="sc-notoserifcjksc">部</text><text x="85.89" y="606.45" font-size="11.00" class="sc-loraregular">95%</text><text x="110.71" y="606.45" font-size="11.00" class="sc-notoserifcjksc">置信区间</text><text x="157.60 161.31 165.31 171.59 176.18 178.89 185.24 191.43 194.20 197.09 201.10 206.17 210.17 212.88 218.54 224.31" y="606.45" font-size="11.00" class="sc-loraregular">[167.99, 171.24]</text><text x="228.27" y="606.45" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="239.27" y="606.45" font-size="11.00" class="sc-loraregular">n=43</text><text x="266.76" y="606.45" font-size="11.00" class="sc-notoserifcjksc">项基准测试），高于我们此前的前沿</text><text x="445.65" y="606.45" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="622.07" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="622.07" font-size="11.00" class="sc-notoserifcjksc">。历史趋势线基于从</text><text x="186.60" y="622.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 3</text><text x="263.76" y="622.07" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="277.66" y="622.07" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="363.61" y="622.07" font-size="11.00" class="sc-notoserifcjksc">的八个发布版本拟合，在新的</text><text x="509.50" y="622.07" font-size="11.00" class="sc-loraregular">IRT</text><text x="72.00" y="637.69" font-size="11.00" class="sc-notoserifcjksc">拟合上每年上升</text><text x="151.89" y="637.69" font-size="11.00" class="sc-loraregular sc-k">14.75</text><text x="178.17" y="637.69" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="192.07" y="637.69" font-size="11.00" class="sc-loraregular">AECI</text><text x="220.06" y="637.69" font-size="11.00" class="sc-notoserifcjksc">点（</text><text x="242.06" y="637.69" font-size="11.00" class="sc-loraregular">95%</text><text x="266.88" y="637.69" font-size="11.00" class="sc-notoserifcjksc">范围为</text><text x="302.77" y="637.69" font-size="11.00" class="sc-loraregular">13.2</text><text x="324.41" y="637.69" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="338.30" y="637.69" font-size="11.00" class="sc-loraregular sc-k">17.1</text><text x="353.60" y="637.69" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="688.56" font-size="11.00" class="sc-notoserifcjksc">我们比较了两种假设。在第一种假设中，历史趋势在</text><text x="327.89" y="688.56" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="412.48" y="688.56" font-size="11.00" class="sc-notoserifcjksc">处出现一次性跃升后继续</text><text x="72.00" y="704.18" font-size="11.00" class="sc-notoserifcjksc">延续；斜率不变，跃升幅度通过拟合得到。在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第二种假设中，斜率在一个拟合得到的断点处发生变化。一次性跃升假设得出</text><text x="448.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">处</text><text x="85.89" y="98.23" font-size="11.00" class="sc-loraregular">+5.9 AECI</text><text x="137.67" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的偏移；趋势断裂假设得出斜率从每年</text><text x="327.56" y="98.23" font-size="11.00" class="sc-loraregular">14.4</text><text x="349.09" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点变为每年</text><text x="406.98" y="98.23" font-size="11.00" class="sc-loraregular">22.2</text><text x="430.30" y="98.23" font-size="11.00" class="sc-notoserifcjksc">点，拟合断点位于</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">2025</text><text x="99.46" y="113.85" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.35" y="113.85" font-size="11.00" class="sc-loraregular">9</text><text x="122.60" y="113.85" font-size="11.00" class="sc-notoserifcjksc">月，增幅为</text><text x="180.49" y="113.85" font-size="11.00" class="sc-loraregular">1.53x</text><text x="205.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="216.16" y="113.85" font-size="11.00" class="sc-loraregular">95%</text><text x="240.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">范围为</text><text x="276.86" y="113.85" font-size="11.00" class="sc-loraregular">1.20</text><text x="299.21" y="113.85" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="313.10" y="113.85" font-size="11.00" class="sc-loraregular">1.82</text><text x="331.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。第一种假设对数据的拟合更好，但无论</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">采用哪种解读，斜率都没有翻倍。我们不认为</text><text x="294.89" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="342.34" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在我们已在</text><text x="400.23" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Mythos Preview</text><text x="484.82" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上观察到的</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">变化之外又带来了进一步的斜率变化。</text><text x="72.00" y="194.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.6</text><text x="105.42" y="194.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试</text><text x="72.00" y="222.19" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89" y="222.19" font-size="11.00" class="sc-loraregular">METR</text><text x="141.67" y="222.19" font-size="11.00" class="sc-notoserifcjksc">合作，对</text><text x="188.57" y="222.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="274.30" y="222.19" font-size="11.00" class="sc-notoserifcjksc">的能力进行了部署前测试，重点关注与</text><text x="464.19" y="222.19" font-size="11.00" class="sc-loraregular">AI</text><text x="477.66" y="222.19" font-size="11.00" class="sc-notoserifcjksc">研发自动化</text><text x="72.00" y="237.81" font-size="11.00" class="sc-notoserifcjksc">相关的能力。他们与我们分享了以下发现：</text><text x="117.75" y="286.96" font-size="11.00" class="sc-notoserifcjksc">我们的初步评估聚焦于</text><text x="230.64 234.59 242.28 245.27 250.88 257.45 264.03 269.99 272.88 281.62 288.18 294.75 299.84 302.74 308.73 311.44 317.43" y="286.96" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="324.28" y="286.96" font-size="11.00" class="sc-notoserifcjksc">可能如何影响</text><text x="393.17" y="286.96" font-size="11.00" class="sc-loraregular">AI</text><text x="406.63" y="286.96" font-size="11.00" class="sc-notoserifcjksc">研发，主要依据是它在困难</text><text x="117.75" y="302.58" font-size="11.00" class="sc-notoserifcjksc">的长程任务上的能力。</text><text x="227.75" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">本报告试图评估的主要论断是：（</text><text x="392.75" y="302.58" font-size="11.00" class="sc-lorabold">A</text><text x="400.10" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="411.10" y="302.58" font-size="11.00" class="sc-lorabold sc-k">Anthropic</text><text x="466.93" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">的</text><text x="480.83" y="302.58" font-size="11.00" class="sc-lorabold">AI</text><text x="495.33" y="302.58" font-size="11.00" class="sc-notoserifcjkscbold">研发现在</text><text x="117.75" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">是否会因使用</text><text x="186.64" y="318.20" font-size="11.00" class="sc-lorabold">[Claude Opus 5.5]</text><text x="281.50" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">而被剧烈加速；以及（</text><text x="391.50" y="318.20" font-size="11.00" class="sc-lorabold">B</text><text x="398.77" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">）在</text><text x="423.66" y="318.20" font-size="11.00" class="sc-lorabold">[Claude Opus 5.5]</text><text x="518.51" y="318.20" font-size="11.00" class="sc-notoserifcjkscbold">的开</text><text x="117.75" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">发过程中，</text><text x="172.75" y="333.82" font-size="11.00" class="sc-lorabold sc-k">Anthropic</text><text x="228.59" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">的</text><text x="242.48" y="333.82" font-size="11.00" class="sc-lorabold">AI</text><text x="256.98" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">研发是否已经因</text><text x="336.87" y="333.82" font-size="11.00" class="sc-lorabold">AI</text><text x="351.37" y="333.82" font-size="11.00" class="sc-notoserifcjkscbold">而被剧烈加速。</text><text x="428.37" y="333.82" font-size="11.00" class="sc-notoserifcjksc">请注意，我们的工作旨</text><text x="117.75" y="349.44" font-size="11.00" class="sc-notoserifcjksc">在收集与</text><text x="164.64" y="349.44" font-size="11.00" class="sc-loraregular">AI</text><text x="178.11" y="349.44" font-size="11.00" class="sc-notoserifcjksc">研发能力相关的证据，而非用于核实有关是否符合</text><text x="423.00" y="349.44" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="476.83" y="349.44" font-size="11.00" class="sc-notoserifcjksc">政策中任何</text><text x="117.75" y="365.06" font-size="11.00" class="sc-notoserifcjksc">特定阈值的论断。本报告摘要也不试图评估</text><text x="329.64 333.59 341.28 344.27 349.88 356.45 363.03 368.99 371.88 380.62 387.18 393.75 398.84 401.74 407.73 410.44 416.43" y="365.06" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="423.28" y="365.06" font-size="11.00" class="sc-notoserifcjksc">是否具有特定的对齐属</text><text x="117.75" y="380.68" font-size="11.00" class="sc-notoserifcjksc">性。</text><text x="117.75" y="481.07" font-size="11.00" class="sc-notoserifcjkscbold">证据摘要</text><text x="169.87" y="501.26" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="205.76 209.71 217.40 220.39 226.00 232.57 239.15 245.11 248.00 256.73 263.30 269.87 274.96 277.85 283.85 286.56 292.55" y="501.26" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="299.39" y="501.26" font-size="11.00" class="sc-notoserifcjksc">进行了初步评估，依据如下：</text><text x="144.75" y="517.45" font-size="11.00" class="sc-notoserifcjksc">能力测试，通过为期</text><text x="246.64" y="517.45" font-size="11.00" class="sc-loraregular">10</text><text x="260.37" y="517.45" font-size="11.00" class="sc-notoserifcjksc">个工作日的</text><text x="318.26" y="517.45" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="338.34" y="517.45" font-size="11.00" class="sc-notoserifcjksc">访问权限进行。我们在此次测试中使用了</text><text x="144.75" y="533.07" font-size="11.00" class="sc-notoserifcjksc">五项任务：</text><text x="180.75" y="549.83" font-size="11.00" class="sc-loraitalic sc-k">Budget NanoGPT Speedrun</text><text x="316.75" y="549.83" font-size="11.00" class="sc-notoserifcjksc">，这是热门</text><text x="374.65" y="549.83" font-size="11.00" class="sc-loraregular">AI</text><text x="388.11" y="549.83" font-size="11.00" class="sc-notoserifcjksc">研发竞赛</text><text x="435.00" y="549.83" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">NanoGPT Speedrun</text><text x="180.75" y="565.45" font-size="11.00" class="sc-notoserifcjksc">的受限版本。</text><text x="180.75" y="582.22" font-size="11.00" class="sc-loraitalic sc-k">Language Model Conceptual Argumentation (LMCA)</text><text x="440.22" y="582.22" font-size="11.00" class="sc-notoserifcjksc">，一个概念推理数据</text><text x="180.75" y="597.84" font-size="11.00" class="sc-notoserifcjksc">集，详见</text><text x="227.64" y="597.84" font-size="11.00" class="sc-loraregular sc-k">A dataset of rated conceptual arguments (Cooper et al.,</text><text x="180.75" y="613.46" font-size="11.00" class="sc-loraregular sc-k">2026)</text><text x="208.90" y="613.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75" y="630.80" font-size="11.00" class="sc-loraitalic sc-k">Train a Program</text><text x="264.13" y="630.80" font-size="11.00" class="sc-notoserifcjksc">，一项衡量智能体训练机器学习模型以复现某个软件行为</text><text x="180.75" y="646.42" font-size="11.00" class="sc-notoserifcjksc">的能力的任务；</text><text x="180.75" y="679.37" font-size="11.00" class="sc-loraitalic">Gaming Bot</text><text x="240.16" y="679.37" font-size="11.00" class="sc-notoserifcjksc">，一项任务，要求智能体在获得一个用于控制游戏的非视觉</text><text x="180.75" y="694.99" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="200.82" y="694.99" font-size="11.00" class="sc-notoserifcjksc">的情况下，编写一个能够玩电子游戏的</text><text x="390.72" y="694.99" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="430.26" y="694.99" font-size="11.00" class="sc-notoserifcjksc">程序。</text><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="435.00" y="541.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="435.00" y="541.03" width="49.19" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="484.20" y="541.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="487.09" y="541.03" width="49.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="180.75" y="82.61" font-size="11.00" class="sc-loraitalic">Sunlight</text><text x="222.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，一项衡量智能体开展开放式研究并撰写相应报告的能力的任</text><text x="180.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="144.75" y="114.99" font-size="11.00" class="sc-notoserifcjksc">关于以往模型的趋势和能力的背景信息，尤其是我们近期发布的</text><text x="452.75" y="114.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿风险报告</text><text x="144.75" y="130.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="155.75" y="130.61" font-size="11.00" class="sc-loraregular sc-k">Frontier Risk Report</text><text x="259.12" y="130.61" font-size="11.00" class="sc-notoserifcjksc">）中所报告的内容。</text><text x="144.75" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="198.58" y="147.38" font-size="11.00" class="sc-notoserifcjksc">提供的关于</text><text x="256.48 260.43 268.11 271.11 276.72 283.28 289.86 295.82 298.72 307.45 314.02 320.59 325.68 328.57 334.57 337.27 343.27" y="147.38" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="350.11" y="147.38" font-size="11.00" class="sc-notoserifcjksc">能力的其他信息，包括对一份询问模型</text><text x="144.75" y="163.00" font-size="11.00" class="sc-notoserifcjksc">能力和控制因素的问卷的回答，以及对一位</text><text x="356.64" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="410.48" y="163.00" font-size="11.00" class="sc-notoserifcjksc">研究人员的访谈。</text><text x="144.75" y="212.15" font-size="11.00" class="sc-notoserifcjksc">来自</text><text x="169.64" y="212.15" font-size="11.00" class="sc-loraregular">METR</text><text x="203.42" y="212.15" font-size="11.00" class="sc-notoserifcjksc">另一项关于</text><text x="261.32" y="212.15" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="315.15" y="212.15" font-size="11.00" class="sc-notoserifcjksc">内部</text><text x="340.04" y="212.15" font-size="11.00" class="sc-loraregular">AI</text><text x="353.51" y="212.15" font-size="11.00" class="sc-notoserifcjksc">研发加速情况的评估的一份高度实验性</text><text x="144.75" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的初步报告。</text><text x="210.75" y="227.77" font-size="11.00" class="sc-notoserifcjkscbold">这份报告由</text><text x="268.64" y="227.77" font-size="11.00" class="sc-loraregular">METR</text><text x="302.42" y="227.77" font-size="11.00" class="sc-notoserifcjksc">的另一个团队撰写，该团队拥有比撰写本内容的</text><text x="144.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">团队更高的访问权限。</text><text x="254.75" y="243.39" font-size="11.00" class="sc-notoserifcjkscbold">由于访问权限上的这一差异，</text><text x="397.75" y="243.39" font-size="11.00" class="sc-notoserifcjksc">该团队与我们分享了其结论，</text><text x="144.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">但</text><text x="155.75" y="259.01" font-size="11.00" class="sc-notoserifcjkscbold">未能分享其推理的支持性证据或细节</text><text x="331.75" y="259.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="180.75" y="325.49" font-size="11.00" class="sc-notoserifcjksc">因此，我们将所提供的</text><text x="293.64" y="325.49" font-size="11.00" class="sc-loraregular">AI</text><text x="307.11" y="325.49" font-size="11.00" class="sc-notoserifcjksc">研发报告中的证据作为评估的一项输入，但不直</text><text x="180.75" y="341.11" font-size="11.00" class="sc-notoserifcjksc">接为其论断进行论证辩护。</text><text x="180.75" y="374.07" font-size="11.00" class="sc-notoserifcjksc">我们将此处纳入该报告视为一种更全面评估流程的试行版本。我们预计这</text><text x="180.75" y="389.69" font-size="11.00" class="sc-notoserifcjksc">项独立调查将在未来几周内有更多公开成果发布。</text><text x="117.75" y="436.72" font-size="11.00" class="sc-notoserifcjksc">结论</text><text x="117.75" y="464.88" font-size="11.00" class="sc-notoserifcjksc">我们将结论分为两类：一类涉及（</text><text x="282.75" y="464.88" font-size="11.00" class="sc-loraregular">A</text><text x="289.64" y="464.88" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="300.64" y="464.88" font-size="11.00" class="sc-loraregular sc-k">[Claude Opus 5.5]</text><text x="393.87" y="464.88" font-size="11.00" class="sc-notoserifcjksc">能够带来的</text><text x="451.77" y="464.88" font-size="11.00" class="sc-loraregular">AI</text><text x="465.23" y="464.88" font-size="11.00" class="sc-notoserifcjksc">研发加速程</text><text x="117.75" y="480.50" font-size="11.00" class="sc-notoserifcjksc">度，另一类涉及（</text><text x="205.75" y="480.50" font-size="11.00" class="sc-loraregular">B</text><text x="212.59" y="480.50" font-size="11.00" class="sc-notoserifcjksc">）在</text><text x="237.49 241.43 249.12 252.12 257.73 264.29 270.87 276.83 279.73 288.46 295.03 301.59 306.69 309.58 315.57 318.28 324.28" y="480.50" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="331.12" y="480.50" font-size="11.00" class="sc-notoserifcjksc">开发过程中由</text><text x="400.01" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="413.47" y="480.50" font-size="11.00" class="sc-notoserifcjksc">带来的</text><text x="449.37" y="480.50" font-size="11.00" class="sc-loraregular">AI</text><text x="462.83" y="480.50" font-size="11.00" class="sc-notoserifcjksc">研发加速程度。</text><text x="117.75" y="496.12" font-size="11.00" class="sc-notoserifcjksc">基于现有证据，我们得出以下结论：</text><text x="117.75" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="128.75" y="562.03" font-size="11.00" class="sc-lorabold">A</text><text x="136.10" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">）我们认为，该模型带来的加速将略高于</text><text x="336.99" y="562.03" font-size="11.00" class="sc-lorabold sc-k">Fable 5.1</text><text x="380.06" y="562.03" font-size="11.00" class="sc-notoserifcjkscbold">，但该模型不太可能完全自动化</text><text x="117.75" y="577.65" font-size="11.00" class="sc-lorabold">AI</text><text x="132.25" y="577.65" font-size="11.00" class="sc-notoserifcjkscbold">研发。</text><text x="117.75" y="626.80" font-size="11.00" class="sc-notoserifcjksc">原因如下：</text><text x="144.75" y="642.99" font-size="11.00" class="sc-notoserifcjksc">我们有相当把握认为，</text><text x="254.75 258.70 266.39 269.38 274.99 281.56 288.14 294.10 296.99 305.72 312.29 318.86 323.95 326.84 332.84 335.55 341.54" y="642.99" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="348.38" y="642.99" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="362.28" y="642.99" font-size="11.00" class="sc-loraregular">AI</text><text x="375.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">研发能力上并未比</text><text x="466.63" y="642.99" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="511.74" y="642.99" font-size="11.00" class="sc-notoserifcjksc">实现</text><text x="144.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">巨大飞跃，但它很可能代表着相对于</text><text x="323.64" y="658.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="368.75" y="658.61" font-size="11.00" class="sc-notoserifcjksc">的适度改进。</text><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="507.75" y="106.19" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">43</text><text x="180.75" y="82.61" font-size="11.00" class="sc-loraregular sc-k">[Claude Opus 5.5]</text><text x="273.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在可验证任务（</text><text x="350.99" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Budget NanoGPT</text><text x="439.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.15" y="82.61" font-size="11.00" class="sc-loraregular">Gaming Bot</text><text x="510.31" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="180.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc">较难验证的任务（</text><text x="268.75" y="98.23" font-size="11.00" class="sc-loraregular sc-k">LMCA</text><text x="299.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="310.62" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Sunlight</text><text x="353.21" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）上均优于</text><text x="411.10" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="453.32" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，但：</text><text x="216.75" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在问卷和研究人员访谈中，</text><text x="348.75" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="402.58" y="131.19" font-size="11.00" class="sc-notoserifcjksc">称</text><text x="416.48 420.43 428.12 431.11 436.72 443.28 449.86 455.82 458.72 467.45 474.02 480.59 485.68 488.57 494.57 497.27 503.27" y="131.19" font-size="11.00" class="sc-loraregular">[Claude Opus 5.5]</text><text x="510.11" y="131.19" font-size="11.00" class="sc-notoserifcjksc">延续</text><text x="216.75" y="146.81" font-size="11.0
