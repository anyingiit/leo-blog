.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p014.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 14 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">14</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">2 RSP</text><text x="118.53" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">2.1 RSP</text><text x="121.42" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">风险评估流程</text><text x="72.00" y="154.36" font-size="11.00" class="sc-loraregular">AI</text><text x="85.46" y="154.36" font-size="11.00" class="sc-notoserifcjksc">模型带来的风险会随着模型能力增强、被部署到更多和更多样的场景中而变化。因此，我们评</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">估</text><text x="85.89" y="169.98" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36" y="169.98" font-size="11.00" class="sc-notoserifcjksc">模型风险的方式也必须随着新证据的出现而演进。</text><text x="341.36 348.24 354.82 359.08 365.67 370.35 376.79 383.35 386.45" y="169.98" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="395.19" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="406.19" y="169.98" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="72.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.83 95.79 100.89 107.45 113.89 120.57 125.66 128.75 135.15 138.14 144.11 147.00 153.24 159.07 164.74 167.73 170.82 177.50 183.58 186.48 193.03 199.47 202.46 205.55 211.35" y="185.60" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="217.16" y="185.60" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="228.16" y="185.60" font-size="11.00" class="sc-loraregular">RSP</text><text x="247.97" y="185.60" font-size="11.00" class="sc-notoserifcjksc">）是我们应对模型可能带来的最严重的灾难性风险的框架。</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">根据</text><text x="96.89" y="201.22" font-size="11.00" class="sc-loraregular">RSP</text><text x="116.70" y="201.22" font-size="11.00" class="sc-notoserifcjksc">，我们承诺定期对照灾难性风险阈值评估我们的模型，并公布评估结果。</text><text x="72.00" y="267.70" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="96.89" y="267.70" font-size="11.00" class="sc-loraregular">2.1.1</text><text x="119.11" y="267.70" font-size="11.00" class="sc-notoserifcjksc">节中，我们介绍了我们的风险评估方法，以及我们为传达风险评估结果而制作的文件</text><text x="167.61 174.52 177.61 182.70 188.61 191.50 198.33 204.30 210.86 217.30 222.14" y="283.32" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="226.40" y="283.32" font-size="11.00" class="sc-notoserifcjksc">）和系统卡（</text><text x="292.40 298.58 304.39 309.48 313.74 319.70 329.53 332.43 340.11 345.79 350.48" y="283.32" font-size="11.00" class="sc-loraregular">System Card</text><text x="357.05" y="283.32" font-size="11.00" class="sc-notoserifcjksc">）。第</text><text x="392.95" y="283.32" font-size="11.00" class="sc-loraregular">2.1.2</text><text x="417.07" y="283.32" font-size="11.00" class="sc-notoserifcjksc">节总结了我们的发现和结</text><text x="72.00" y="298.94" font-size="11.00" class="sc-notoserifcjksc">论。</text><text x="72.00" y="332.47" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="96.89" y="332.47" font-size="11.00" class="sc-loraregular">2</text><text x="105.69" y="332.47" font-size="11.00" class="sc-notoserifcjksc">节的其余部分，我们提供了所有风险领域的更详细结果，并特别关注对我们总体风险评估</text><text x="72.00" y="348.09" font-size="11.00" class="sc-notoserifcjksc">最具参考价值的评估。对于每个威胁模型，我们还分析了新模型如何影响我们最近一份</text><text x="490.00" y="348.09" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">风险报告</text><text x="72.00" y="363.71" font-size="11.00" class="sc-notoserifcjksc">中给出的风险评估。</text><text x="72.00" y="415.78" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.1</text><text x="98.73" y="415.78" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险报告与我们风险评估的更新</text><text x="72.00" y="443.66" font-size="11.00" class="sc-notoserifcjksc">我们的风险评估流程从评估单个模型的能力开始。这些评估旨在系统地测试模型的能力是否越过</text><text x="72.00" y="459.28" font-size="11.00" class="sc-notoserifcjksc">了我们</text><text x="107.89" y="459.28" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="130.60" y="459.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="141.60" y="459.28" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="207.60" y="459.28" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="218.60 224.51 229.20 235.64 242.21 246.47 249.56 255.52 260.29 263.18 270.87 277.30 287.14 293.71 296.70 299.79 305.46 312.14 317.94 323.90 326.79 332.71 337.40 343.07 352.91 358.83 367.50 373.94 378.66" y="459.28" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="384.57" y="459.28" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="395.57 401.52 409.21" y="459.28" font-size="11.00" class="sc-loraregular">FCF</text><text x="415.23" y="459.28" font-size="11.00" class="sc-notoserifcjksc">）中设定的灾难性风险阈</text><text x="72.00" y="474.90" font-size="11.00" class="sc-notoserifcjksc">值。一般而言，我们会在整个训练过程中评估多个模型快照，然后基于用于生产发布的候选发布</text><text x="72.00" y="490.52" font-size="11.00" class="sc-notoserifcjksc">模型的能力以及我们在此之前观察到的趋势，对模型的风险水平作出最终判定。在整个过程中，</text><text x="72.00" y="506.14" font-size="11.00" class="sc-notoserifcjksc">我们借助来自自动化评估、能力提升（</text><text x="259.00 265.57 272.13 275.13 278.22 282.07" y="506.14" font-size="11.00" class="sc-loraregular">uplift</text><text x="286.32" y="506.14" font-size="11.00" class="sc-notoserifcjksc">）试验、第三方专家红队测试（</text><text x="440.32 445.01 450.92 457.50 460.39 464.65 470.59 476.26 486.10 489.19 495.86" y="506.14" font-size="11.00" class="sc-loraregular">red teaming</text><text x="501.95" y="506.14" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="72.00" y="521.76" font-size="11.00" class="sc-notoserifcjksc">第三方评估的证据。（对于某些未推进前沿的单个模型，我们可能会省略一些高投入的调查形</text><text x="72.00" y="537.38" font-size="11.00" class="sc-notoserifcjksc">式，例如能力提升试验，因为它们不太可能产生会改变风险评估的结果。）</text><text x="72.00" y="621.78" font-size="11.00" class="sc-notoserifcjksc">这些针对单个模型的能力评估在两类不同的文件中讨论，二者按不同的时间表发布：系统卡和风</text><text x="72.00" y="637.40" font-size="11.00" class="sc-notoserifcjksc">险报告。我们会随每个模型的发布一同发布一份系统卡。系统卡讨论新模型的能力、安全防护措</text><text x="72.00" y="653.02" font-size="11.00" class="sc-notoserifcjksc">施和部署决策，包括该模型如何改变（或不改变）我们最近一份风险报告中的总体风险评估。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="406.19" y="161.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="406.19" y="161.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="417.19" y="161.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="417.19" y="161.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="428.19" y="161.18" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="428.19" y="161.18" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="439.19" y="161.18" width="0.00" height="11.00" fi <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p015.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 15 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">15</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">作为我们在</text><text x="129.89" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="152.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">下所作承诺的一部分，我们还会定期发布全面的风险报告，阐述我们的模型能</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">力、威胁模型和风险缓解措施如何相互配合。每份风险报告涵盖截至其覆盖日期的所有纳入范围</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的模型，并深入讨论我们的风险缓解措施。这些报告的目的是对我们模型所带来的风险作出总体</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">评估。由于风险报告是全面性的而非针对特定模型的，我们不会在每个新模型发布时都发布一</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">份。我们最近的一份报告于</text><text x="206.89 212.80 219.55 225.46" y="145.09" font-size="11.00" class="sc-loraregular">2026</text><text x="234.71" y="145.09" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="248.61" y="145.09" font-size="11.00" class="sc-loraregular">8</text><text x="257.68" y="145.09" font-size="11.00" class="sc-notoserifcjksc">月发布，涵盖截至</text><text x="348.57 354.48 361.23 367.14" y="145.09" font-size="11.00" class="sc-loraregular">2026</text><text x="376.39" y="145.09" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="390.29" y="145.09" font-size="11.00" class="sc-loraregular">7</text><text x="398.25" y="145.09" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="412.14" y="145.09" font-size="11.00" class="sc-loraregular">15</text><text x="425.03" y="145.09" font-size="11.00" class="sc-notoserifcjksc">日</text><text x="438.93 445.81 452.39 456.65 463.24 467.92 474.36 480.93 484.02" y="145.09" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="492.76" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="506.65" y="145.09" font-size="11.00" class="sc-loraregular">AI</text><text x="520.12" y="145.09" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">型和行动，</text><text x="127.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">可在此处查阅</text><text x="193.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在某些情况下，我们可能会判定：尽管某个模型超过了特定的能力或使用阈值（定义见我们</text><text x="514.89" y="228.34" font-size="11.00" class="sc-loraregular">RSP</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">的第</text><text x="96.89" y="243.96" font-size="11.00" class="sc-loraregular">1</text><text x="103.79" y="243.96" font-size="11.00" class="sc-notoserifcjksc">节和</text><text x="125.79" y="243.96" font-size="11.00" class="sc-loraregular">/</text><text x="133.38" y="243.96" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="147.27 153.22 160.91" y="243.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="169.83" y="243.96" font-size="11.00" class="sc-notoserifcjksc">中的相应层级），但我们已实施了将风险保持在较低水平所需的风险缓解措</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">施。在这种情况下，由于相关缓解措施已经到位，我们可能会花较少篇幅讨论该能力或使用阈值</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">是否已被越过。</text><text x="72.00" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.1.2</text><text x="101.48" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">发现与结论摘要</text><text x="72.00" y="351.72" font-size="11.00" class="sc-lorabold">2.1.2.1</text><text x="103.24" y="351.72" font-size="11.00" class="sc-notoserifcjkscbold">关于化学与生物风险</text><text x="72.00" y="384.11" font-size="11.00" class="sc-notoserifcjksc">在化学与生物风险方面，我们将</text><text x="228.89" y="384.11" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.34" y="384.11" font-size="11.00" class="sc-notoserifcjksc">视为具备</text><text x="323.23 330.92 337.76 342.85" y="384.11" font-size="11.00" class="sc-loraregular">CB-1</text><text x="349.75" y="384.11" font-size="11.00" class="sc-notoserifcjksc">能力（与非新型武器的合成相关），但</text><text x="72.00" y="399.73" font-size="11.00" class="sc-notoserifcjksc">不具备</text><text x="107.89 115.58 122.42 127.45" y="399.73" font-size="11.00" class="sc-loraregular">CB-2</text><text x="136.25" y="399.73" font-size="11.00" class="sc-notoserifcjksc">能力（与新型武器的合成相关）。在我们的整套评估中，它与</text><text x="436.14 443.83 446.83 452.43 459.00 465.58 471.54 474.43 484.37 490.23 494.49 501.08 507.51 512.60 515.50 521.49 524.20" y="399.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="72.00" y="415.35" font-size="11.00" class="sc-notoserifcjksc">的差异仅属有限，而且在我们曾认为足以排除该模型达到</text><text x="349.89 357.58 364.42 369.45" y="415.35" font-size="11.00" class="sc-loraregular">CB-2</text><text x="378.25" y="415.35" font-size="11.00" class="sc-notoserifcjksc">的若干弱点上，它并未改进，例</text><text x="72.00" y="430.97" font-size="11.00" class="sc-notoserifcjksc">如开放式构想能力薄弱、对科学文献的呈现不可靠，以及在用户缺乏专业知识的领域出现科学错</text><text x="72.00" y="446.59" font-size="11.00" class="sc-notoserifcjksc">误。这些失败模式限制了它替代稀缺人类专业知识的能力。我们的结论是，</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 482.02 488.59 495.16 500.25 503.14 509.14 511.85" y="446.59" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="520.73" y="446.59" font-size="11.00" class="sc-notoserifcjksc">未</text><text x="72.00" y="462.21" font-size="11.00" class="sc-notoserifcjksc">跨越</text><text x="96.89 104.58 111.42 116.45" y="462.21" font-size="11.00" class="sc-loraregular">CB-2</text><text x="125.25" y="462.21" font-size="11.00" class="sc-notoserifcjksc">阈值；我们在部署它时采用了与</text><text x="282.14 289.83 292.83 298.43 305.00 311.58 317.54 320.44 330.37 336.23 340.49 347.08 353.51 358.60 361.50" y="462.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="370.39" y="462.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="384.28 391.97 394.96 400.57 407.14 413.71 419.68 422.57 432.50 438.37 442.62 449.21 455.65 460.74 463.63 469.63 472.33" y="462.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="479.23" y="462.21" font-size="11.00" class="sc-notoserifcjksc">相同的扩展</text><text x="72.00" y="477.83" font-size="11.00" class="sc-notoserifcjksc">的生物安全防护措施。</text><text x="72.00" y="562.22" font-size="11.00" class="sc-lorabold">2.1.2.2</text><text x="104.64" y="562.22" font-size="11.00" class="sc-notoserifcjkscbold">关于自主性风险</text><text x="72.00" y="594.60" font-size="11.00" class="sc-notoserifcjksc">在自动化</text><text x="118.89" y="594.60" font-size="11.00" class="sc-loraregular">AI</text><text x="132.36" y="594.60" font-size="11.00" class="sc-notoserifcjksc">研究与开发方面，我们评估认为</text><text x="289.25 296.94 299.93 305.54 312.11 318.69 324.65 327.54 336.28 342.84 349.41 354.50 357.39 363.39 366.10" y="594.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="374.98" y="594.60" font-size="11.00" class="sc-notoserifcjksc">未跨越我们</text><text x="432.88" y="594.60" font-size="11.00" class="sc-loraregular">RSP</text><text x="455.58" y="594.60" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="469.47 475.43 483.11" y="594.60" font-size="11.00" class="sc-loraregular">FCF</text><text x="492.04" y="594.60" font-size="11.00" class="sc-notoserifcjksc">中的下一</text><text x="72.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">个能力阈值。它仍远低于替代我们的研究科学家和工程师所需的水平。它与</text><text x="437.89" y="610.22" font-size="11.00" class="sc-loraregular">AI</text><text x="451.36" y="610.22" font-size="11.00" class="sc-notoserifcjksc">研发相关的能力与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="625.84" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="625.84" font-size="11.00" class="sc-notoserifcjksc">持平或略高，并与其他近期模型的趋势一致；而且我们的内部衡量指标并未显</text><text x="72.00" y="641.46" font-size="11.00" class="sc-notoserifcjksc">示出可归因于</text><text x="140.89" y="641.46" font-size="11.00" class="sc-loraregular">AI</text><text x="154.36" y="641.46" font-size="11.00" class="sc-notoserifcjksc">的、持续的</text><text x="212.25" y="641.46" font-size="11.00" class="sc-loraregular">2×</text><text x="226.88" y="641.46" font-size="11.00" class="sc-notoserifcjksc">研发速度加快。</text><text x="303.88" y="641.46" font-size="11.00" class="sc-loraregular">METR</text><text x="337.66" y="641.46" font-size="11.00" class="sc-notoserifcjksc">进行的外部测试（第</text><text x="439.55 445.46 448.17 454.29 456.89" y="641.46" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="466.14" y="641.46" font-size="11.00" class="sc-notoserifcjksc">节）得出的结</text><text x="72.00" y="657.08" font-size="11.00" class="sc-notoserifcjksc">论与这一评估一致。在对齐（</text><text x="215.00 220.68 223.67 226.76 232.84 239.52 249.35 255.32 261.89" y="657.08" font-size="11.00" class="sc-loraregular">alignment</text><text x="266.15" y="657.08" font-size="11.00" class="sc-notoserifcjksc">）风险方面，我们的总体评估仍然是：未对齐</text><text x="72.00" y="672.70" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 92.83 95.93 101.02 106.69 109.69 112.78 118.86 125.54 135.37 141.33 147.91" y="672.70" font-size="11.00" class="sc-loraregular">misalignment</text><text x="152.17" y="672.70" font-size="11.00" class="sc-notoserifcjksc">）导致灾难性危害的风险较低，详见我们的</text><text x="364.06 369.97 376.72 382.63" y="672.70" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="391.88" y="672.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="405.77" y="672.70" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="414.85" y="672.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="469.85" y="672.70" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="129.89" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="129.89" y="73.81" width="19.81" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="151.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="127.00" y="151.91" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="138.00" y="151.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="138.00" y="151.91" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="149.00" y="151.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="149.00" y="151.91" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="160.00" y="151.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="160.00" y="151.91" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="171.00" y="151.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="171.00" y="151.91" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropi width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="447.85" y="663.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="447.85" y="663.90" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="458.85" y="663.90" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="458.85" y="663.90" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p016.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 16 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">16</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">2.2 CB</text><text x="118.13" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">评估</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.1</text><text x="101.48" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="72.00" y="149.19" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="149.19" font-size="11.00" class="sc-loraregular">CB</text><text x="103.32" y="149.19" font-size="11.00" class="sc-notoserifcjksc">评估中，我们主要关注会造成灾难性后果的化学与生物风险。我们研究的不是单次提示与</text><text x="72.00" y="164.81" font-size="11.00" class="sc-notoserifcjksc">回答的威胁模型，而是模型能否协助威胁行为者完成引发此类后果所需的漫长、多步骤任务。我</text><text x="72.00" y="180.43" font-size="11.00" class="sc-notoserifcjksc">们评估的过程具有知识密集型和技能密集型的特点，容易失败，而且往往存在许多瓶颈。新型化</text><text x="72.00" y="196.05" font-size="11.00" class="sc-notoserifcjksc">学武器和生物武器的生产过程面临上述所有挑战，以及研发过程中可能出现的额外挑战。</text><text x="72.00" y="294.91" font-size="11.00" class="sc-notoserifcjksc">我们采用了多种方法，测量</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="294.91" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63" y="294.91" font-size="11.00" class="sc-notoserifcjksc">能否替代专业知识，和／或显著加快专家研究。我</text><text x="72.00" y="310.53" font-size="11.00" class="sc-notoserifcjksc">们会在模型发布前评估其多个快照，但有益红队测试除外：由于此类测试耗时较长，我们使用早</text><text x="72.00" y="326.15" font-size="11.00" class="sc-notoserifcjksc">期候选发布模型开展测试。作为一项保守措施，本节报告并解读所有模型快照中的最高得分；</text><text x="72.00 78.75 81.85 88.05 97.98 103.79 108.88 113.14 119.10 124.05 129.66 136.50 142.47 149.14 154.99" y="341.77" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="164.48" y="341.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="178.37 185.04 189.72 196.16 200.41 206.85 212.65 219.08 222.07" y="341.77" font-size="11.00" class="sc-loraregular">Protocols</text><text x="230.06" y="341.77" font-size="11.00" class="sc-notoserifcjksc">评估除外，这两项评估报告的是最终正式部署模型的结果。</text><text x="72.00" y="424.45" font-size="11.00" class="sc-notoserifcjksc">过去，为避免因模型拒绝导致其表现不佳，从而低估模型执行有害任务的能力，我们曾在减少了</text><text x="72.00" y="440.07" font-size="11.00" class="sc-notoserifcjksc">无害性训练的</text><text x="138.00" y="440.07" font-size="11.00" class="sc-loraregular">“</text><text x="142.40" y="440.07" font-size="11.00" class="sc-notoserifcjksc">仅有用变体（</text><text x="208.40 214.99 220.95 223.94 230.46 234.17 240.74 243.73 249.11 255.55 262.22 265.16 270.97 273.86 279.31 284.98 289.75 292.84 298.51 305.09" y="440.07" font-size="11.00" class="sc-loraregular">helpful-only variant</text><text x="309.35" y="440.07" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="320.35" y="440.07" font-size="11.00" class="sc-loraregular">”</text><text x="324.19" y="440.07" font-size="11.00" class="sc-notoserifcjksc">上运行部分</text><text x="382.08" y="440.07" font-size="11.00" class="sc-loraregular">CB</text><text x="399.50" y="440.07" font-size="11.00" class="sc-notoserifcjksc">评估。从</text><text x="446.40" y="440.07" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="493.84" y="440.07" font-size="11.00" class="sc-notoserifcjksc">开始，我</text><text x="72.00" y="455.69" font-size="11.00" class="sc-notoserifcjksc">们在</text><text x="96.89" y="455.69" font-size="11.00" class="sc-loraregular">CB</text><text x="114.32" y="455.69" font-size="11.00" class="sc-notoserifcjksc">评估中仅使用发布版本的候选模型，并着重采用在设计上避免触发拒绝的评估，以减少</text><text x="72.00" y="471.31" font-size="11.00" class="sc-notoserifcjksc">这类表现不佳的情况。</text><text x="72.00" y="521.60" font-size="11.00" class="sc-notoserifcjksc">我们作出这一选择，是因为我们反复发现，仅有用变体与候选发布模型在行为和能力上存在差</text><text x="72.00" y="537.22" font-size="11.00" class="sc-notoserifcjksc">异。对某些早期模型而言，这些差异大到需要重新训练才能缓解。虽然我们认为，这些差异对我</text><text x="72.00" y="552.84" font-size="11.00" class="sc-notoserifcjksc">们此前有关模型能力的结论影响有限，但由于仅有用变体可能偏离正式部署版本，我们开始担忧</text><text x="72.00" y="568.46" font-size="11.00" class="sc-notoserifcjksc">继续在能力评估中使用这些变体。我们最希望测量的，是与</text><text x="360.89" y="568.46" font-size="11.00" class="sc-loraregular">CB</text><text x="378.32" y="568.46" font-size="11.00" class="sc-notoserifcjksc">威胁模型中的能力提升（</text><text x="499.32 505.88 512.45 515.44 518.53 522.38" y="568.46" font-size="11.00" class="sc-loraregular">uplift</text><text x="526.64" y="568.46" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="584.08" font-size="11.00" class="sc-notoserifcjksc">相关的能力；这些能力通常具有两用性，可以通过有益代理任务来测量，这些任务需要相同的能</text><text x="72.00" y="599.70" font-size="11.00" class="sc-notoserifcjksc">力，但不具有危害性，也不容易触发拒绝。事实上，我们此前的评估组合中有很大一部分就是这</text><text x="72.00" y="615.32" font-size="11.00" class="sc-notoserifcjksc">类有益代理任务，而我们从有益代理任务结果与有害任务结果中得出的发现是一致的。今后，我</text><text x="72.00" y="630.94" font-size="11.00" class="sc-notoserifcjksc">们计划将评估组合的重点放在这些代理任务上。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p017.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 17 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">17</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们的评估组合包括：</text><text x="108.00" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">有益红队桌面推演。</text><text x="207.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">这项评估将</text><text x="264.89" y="131.19" font-size="11.00" class="sc-loraregular">7</text><text x="272.86" y="131.19" font-size="11.00" class="sc-notoserifcjksc">名博士级生物学家与专门配备的大语言模型（</text><text x="492.86" y="131.19" font-size="11.00" class="sc-loraregular">LLM</text><text x="515.67" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）专</text><text x="108.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">家组成团队，要求他们在</text><text x="231.89" y="146.81" font-size="11.00" class="sc-loraregular">16</text><text x="245.15" y="146.81" font-size="11.00" class="sc-notoserifcjksc">小时内提出新方法，为难以治疗的细菌开发噬菌体疗法。评</text><text x="108.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">估旨在测试，由通才生物学家组成的</text><text x="286.89" y="162.43" font-size="11.00" class="sc-loraregular">4</text><text x="295.75" y="162.43" font-size="11.00" class="sc-notoserifcjksc">个混合团队，能否达到由世界顶尖领域专家参与的</text><text x="108.00" y="178.05" font-size="11.00" class="sc-loraregular">3</text><text x="117.02" y="178.05" font-size="11.00" class="sc-notoserifcjksc">个团队的水平。评估由独立领域专家评分。</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="121.89" y="228.34" font-size="11.00" class="sc-lorabold">CB-1</text><text x="149.27" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">相关的自动化评估。</text><text x="248.27" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="306.17" y="228.34" font-size="11.00" class="sc-loraregular">3</text><text x="315.18" y="228.34" font-size="11.00" class="sc-notoserifcjksc">项自动化评估，来评估</text><text x="428.08" y="228.34" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="475.52" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在与已知生</text><text x="108.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">物武器相关的任务上的表现：多模态病毒学知识（</text><text x="350.00 357.02 360.11 364.80 371.23 374.22 380.66 386.96 392.77 395.66 403.35 409.03 415.59 421.27 427.67 430.76 433.75 437.02 441.28 444.37 450.33 455.42 458.32 464.82 470.78 475.87" y="243.96" font-size="11.00" class="sc-loraregular">Virology Capabilities Test</text><text x="480.13" y="243.96" font-size="11.00" class="sc-notoserifcjksc">，简称</text><text x="108.00 115.02 122.71" y="259.58" font-size="11.00" class="sc-loraregular">VCT</text><text x="129.75" y="259.58" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="151.75 158.41 163.10 169.53 173.79 180.23 186.02 192.46 195.45" y="259.58" font-size="11.00" class="sc-loraregular">Protocols</text><text x="203.44" y="259.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="217.33 224.08 227.17 233.38 243.31 249.12 254.21 258.47 264.43 269.38 274.99 281.83 287.80 294.47 300.32" y="259.58" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="306.91" y="259.58" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="317.91 324.58 329.27 335.70 339.96 346.39 352.19 358.62 361.62" y="259.58" font-size="11.00" class="sc-loraregular">Protocols</text><text x="369.60" y="259.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.49 390.25 393.34 399.54 409.48 415.29 420.38 424.63 430.60 435.55 441.16 448.00 453.96 460.64 466.49" y="259.58" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="475.97" y="259.58" font-size="11.00" class="sc-notoserifcjksc">测量的能力</text><text x="108.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">相近，取代了我们在此前系统卡中报告过的</text><text x="319.89" y="275.20" font-size="11.00" class="sc-loraregular">2</text><text x="328.69" y="275.20" font-size="11.00" class="sc-notoserifcjksc">项长篇病毒学任务评估。由于近期模型在这</text><text x="108.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">些先前评估中的任务表现已饱和，其结果变得难以解读。如</text><text x="396.89 404.58 407.57 413.18 419.75 426.33 432.29 435.18 440.77 446.45 452.85 455.84" y="290.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable</text><text x="464.70 470.69 473.40 477.40 480.30 487.94 490.83 498.52 501.51 507.12 513.69 520.27" y="290.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">5.1 &amp; Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.06 157.76" y="306.44" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos 5.1</text><text x="164.66" y="306.44" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="197.66" y="306.44" font-size="11.00" class="sc-notoserifcjksc">所述，由于结果解读存在困难，我们还弃用了</text><text x="420.55 428.64 437.02 443.91 446.80 452.98 458.79 465.37 469.63 476.21 482.18 487.27 490.36" y="306.44" font-size="11.00" class="sc-loraregular">DNA Synthesis</text><text x="108.00 114.24 120.09 124.78 130.68 136.64 143.32 146.41 153.09 159.17 162.07 168.81 174.25 179.93 185.02 188.11 194.55" y="322.06" font-size="11.00" class="sc-loraregular">Screening Evasion</text><text x="204.12" y="322.06" font-size="11.00" class="sc-notoserifcjksc">评估，且未设置替代评估。</text><text x="108.00" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="121.89 129.46 136.73 141.59" y="390.26" font-size="11.00" class="sc-lorabold">CB-2</text><text x="150.35" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">相关的自动化评估。</text><text x="249.35" y="390.26" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="285.24 293.44 299.25 305.92 312.36 315.25 322.29 328.88 334.84 339.53 345.20 351.77 357.73 364.30 368.56 371.65 377.50" y="390.26" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="385.49" y="390.26" font-size="11.00" class="sc-notoserifcjksc">合作开展了</text><text x="443.38" y="390.26" font-size="11.00" class="sc-loraregular">3</text><text x="452.40" y="390.26" font-size="11.00" class="sc-notoserifcjksc">项序列到功能评</text><text x="108.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">估：一项黑盒</text><text x="176.89" y="405.88" font-size="11.00" class="sc-loraregular">RNA</text><text x="201.96" y="405.88" font-size="11.00" class="sc-notoserifcjksc">序列建模与设计挑战，以来自美国机器学习与生物学交叉领域人才市</text><text x="108.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">场前沿的</text><text x="154.89" y="421.50" font-size="11.00" class="sc-loraregular">57</text><text x="168.85" y="421.50" font-size="11.00" class="sc-notoserifcjksc">名人类参与者为比较基准；以及</text><text x="325.74" y="421.50" font-size="11.00" class="sc-loraregular">2</text><text x="334.55" y="421.50" font-size="11.00" class="sc-notoserifcjksc">项</text><text x="348.44 355.83 362.29" y="421.50" font-size="11.00" class="sc-loraregular">AAV</text><text x="372.36" y="421.50" font-size="11.00" class="sc-notoserifcjksc">衣壳包装预测任务，测量模型的生</text><text x="108.00" y="437.12" font-size="11.00" class="sc-notoserifcjksc">物学推理能力、领域知识和机器学习能力能否超越预训练蛋白质语言模型（</text><text x="471.00 477.57 482.25 488.69 492.94 498.91 502.00" y="437.12" font-size="11.00" class="sc-loraregular">protein</text><text x="108.00 110.99 116.67 123.35 129.43 135.99 141.67 147.70 153.66 156.55 166.39 172.82 179.40 185.36" y="452.74" font-size="11.00" class="sc-loraregular">language model</text><text x="188.36" y="452.74" font-size="11.00" class="sc-notoserifcjksc">）。</text><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="396.89" y="282.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="396.89" y="282.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="432.29" y="282.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="435.18" y="282.02" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="464.70" y="282.02" width="12.70" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="477.40" y="282.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="480.30" y="282.02" width="7.64" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="487.94" y="282.02" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="490.83" y="282.02" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%20 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p018.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 18 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">18</text><text x="90.80" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">相关性</text><text x="76.75" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold">已知及新型</text><text x="76.75" y="131.67" font-size="11.00" class="sc-lorabold">CB</text><text x="94.48" y="131.67" font-size="11.00" class="sc-notoserifcjkscbold">武器</text><text x="76.75" y="192.07" font-size="11.00" class="sc-notoserifcjkscbold">已知生物武</text><text x="76.75" y="207.69" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="76.75" y="316.66" font-size="11.00" class="sc-notoserifcjkscbold">新型生物武</text><text x="76.75" y="332.28" font-size="11.00" class="sc-notoserifcjkscbold">器</text><text x="210.58" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">评估</text><text x="147.25" y="116.05" font-size="11.00" class="sc-notoserifcjkscbold">有益红队桌面推演</text><text x="147.25" y="192.07" font-size="11.00" class="sc-notoserifcjkscbold">短程及中程自动化评估：多模</text><text x="147.25" y="207.69" font-size="11.00" class="sc-notoserifcjkscbold">态病毒学（</text><text x="202.25 209.75 217.32" y="207.69" font-size="11.00" class="sc-lorabold">VCT</text><text x="224.47" y="207.69" font-size="11.00" class="sc-notoserifcjkscbold">）、</text><text x="147.25 154.39 157.99 163.94 174.26 180.32 185.65 190.19 196.11 201.54 207.26 214.53 220.44 227.46 233.16" y="223.31" font-size="11.00" class="sc-lorabold">BioMysteryBench</text><text x="239.99" y="223.31" font-size="11.00" class="sc-notoserifcjkscbold">、</text><text x="147.25 154.28 159.47 165.70 170.24 176.47 182.16 188.35 191.78" y="238.93" font-size="11.00" class="sc-lorabold">Protocols</text><text x="147.25" y="316.66" font-size="11.00" class="sc-notoserifcjkscbold">序列到功能建模与设计</text><text x="147.25" y="332.28" font-size="11.00" class="sc-notoserifcjkscbold">（</text><text x="158.25 165.80 174.12" y="332.28" font-size="11.00" class="sc-lorabold">RNA</text><text x="181.47" y="332.28" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="147.25" y="376.49" font-size="11.00" class="sc-notoserifcjkscbold">病毒序列到功能评估（</text><text x="257.25 264.86 271.35" y="376.49" font-size="11.00" class="sc-lorabold">AAV</text><text x="282.03" y="376.49" font-size="11.00" class="sc-notoserifcjkscbold">判</text><text x="147.25" y="392.11" font-size="11.00" class="sc-notoserifcjkscbold">别）</text><text x="147.25" y="436.32" font-size="11.00" class="sc-notoserifcjkscbold">病毒序列到功能自主研究</text><text x="409.65" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">说明</text><text x="305.50" y="116.05" font-size="11.00" class="sc-notoserifcjksc">通才生物学家与大语言模型使用专家搭档，能否</text><text x="305.50" y="131.67" font-size="11.00" class="sc-notoserifcjksc">提出与世界顶尖领域专家相当的策略？</text><text x="305.50" y="192.07" font-size="11.00" class="sc-notoserifcjksc">模型在包含图像的病毒学问题上表现如何？模型</text><text x="305.50" y="207.69" font-size="11.00" class="sc-notoserifcjksc">在帮助威胁行为者排查湿实验方案（</text><text x="481.50 490.18 496.06 500.32 505.70 508.69 514.37" y="207.69" font-size="11.00" class="sc-loraregular">wet-lab</text><text x="305.50 312.07 316.75 323.19 327.45 333.88 339.68 346.11" y="223.31" font-size="11.00" class="sc-loraregular">protocol</text><text x="349.10" y="223.31" font-size="11.00" class="sc-notoserifcjksc">）的问题并扩展方案方面表现如何？模</text><text x="305.50" y="238.93" font-size="11.00" class="sc-notoserifcjksc">型能否分析原始实验室数据，并得出威胁行为者</text><text x="305.50" y="254.55" font-size="11.00" class="sc-notoserifcjksc">可能需要的生物学结论？</text><text x="305.50" y="316.66" font-size="11.00" class="sc-notoserifcjksc">模型能否在经过校准的生物序列建模与设计任务</text><text x="305.50" y="332.28" font-size="11.00" class="sc-notoserifcjksc">中达到人类专家的表现水平？</text><text x="305.50" y="376.49" font-size="11.00" class="sc-notoserifcjksc">与公开工具相比，模型预测新型病毒衣壳序列功</text><text x="305.50" y="392.11" font-size="11.00" class="sc-notoserifcjksc">能特性的能力如何？</text><text x="305.50" y="436.32" font-size="11.00" class="sc-notoserifcjksc">模型能否在分布外（</text><text x="404.50 410.93 417.50 421.76 427.14 433.52 437.13 442.51 449.08 452.17 457.27 461.52 466.29 469.38 475.78 482.35 486.60 489.70 496.13" y="436.32" font-size="11.00" class="sc-loraregular">out-of-distribution</text><text x="502.81" y="436.32" font-size="11.00" class="sc-notoserifcjksc">）数据</text><text x="305.50" y="451.94" font-size="11.00" class="sc-notoserifcjksc">集上，迭代改进新型病毒衣壳序列的预测模型？</text><text x="72.00" y="486.32" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="486.32" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.53 100.63 104.28 106.38 111.92 115.39 117.76 123.95" y="486.32" font-size="9.00" class="sc-lorabold">2.2.1.A] CB</text><text x="132.26" y="486.32" font-size="9.00" class="sc-notoserifcjkscbold">评估组合</text><text x="168.26" y="486.32" font-size="9.00" class="sc-notoserifcjksc">及其与</text><text x="197.63 203.92 209.52 213.69" y="486.32" font-size="9.00" class="sc-loraregular">CB-1</text><text x="219.33" y="486.32" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="230.70 236.99 242.59 246.70" y="486.32" font-size="9.00" class="sc-loraregular">CB-2</text><text x="253.90" y="486.32" font-size="9.00" class="sc-notoserifcjksc">阈值的相关性。</text><text x="72.00" y="518.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.2</text><text x="104.24" y="518.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">生物与化学风险结果：由人类开展的评估</text><text x="72.00" y="546.57" font-size="11.00" class="sc-notoserifcjksc">为评估武器开发全流程中与生物学相关的能力，我们与</text><text x="338.89 344.81 349.50 355.93 362.51 366.77 369.86 375.82 380.58 383.48 391.67 397.63 402.73 405.82 411.90" y="546.57" font-size="11.00" class="sc-loraregular">Frontier Design</text><text x="421.47" y="546.57" font-size="11.00" class="sc-notoserifcjksc">合作开展了一项桌面情</text><text x="72.00" y="562.19" font-size="11.00" class="sc-notoserifcjksc">景推演，要求各团队为沙眼衣原体（</text><text x="248.00 255.55 261.84 264.95 270.98 280.62 286.27 292.37 295.94 301.97 304.86 308.86 313.69 319.72 324.92 331.22 336.95 346.58 352.61 356.61 360.18" y="562.19" font-size="11.00" class="sc-loraitalic">Chlamydia trachomatis</text><text x="364.89" y="562.19" font-size="11.00" class="sc-notoserifcjksc">）开发噬菌体疗法，这需要具备沙眼</text><text x="72.00" y="577.81" font-size="11.00" class="sc-notoserifcjksc">衣原体生物学和噬菌体疗法方面的专业知识。</text><text x="292.00" y="577.81" font-size="11.00" class="sc-loraregular">7</text><text x="299.96" y="577.81" font-size="11.00" class="sc-notoserifcjksc">个双人团队中，</text><text x="376.96" y="577.81" font-size="11.00" class="sc-loraregular">2</text><text x="385.76" y="577.81" font-size="11.00" class="sc-notoserifcjksc">个团队有噬菌体专家，</text><text x="495.76" y="577.81" font-size="11.00" class="sc-loraregular">1</text><text x="502.66" y="577.81" font-size="11.00" class="sc-notoserifcjksc">个团队</text><text x="72.00" y="593.43" font-size="11.00" class="sc-notoserifcjksc">有衣原体专家，另有</text><text x="173.89" y="593.43" font-size="11.00" class="sc-loraregular">4</text><text x="182.75" y="593.43" font-size="11.00" class="sc-notoserifcjksc">个团队的生物学家经验丰富，但既不具备噬菌体专业知识，也不具备衣原</text><text x="72.00" y="609.05" font-size="11.00" class="sc-notoserifcjksc">体专业知识。每个团队还都包含大语言模型使用专家。每个团队在数天内共获得</text><text x="459.89" y="609.05" font-size="11.00" class="sc-loraregular">16</text><text x="473.15" y="609.05" font-size="11.00" class="sc-notoserifcjksc">小时，使用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="624.67" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="624.67" font-size="11.00" class="sc-notoserifcjksc">完成设计，各团队的产出均由</text><text x="303.63" y="624.67" font-size="11.00" class="sc-loraregular">4</text><text x="312.48" y="624.67" font-size="11.00" class="sc-notoserifcjksc">名专家评分者评分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p019.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 19 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">19</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">通才的能力提升。</text><text x="160.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">关于</text><text x="184.89" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统，一个相关问题是：它们能否将通才的能力提升至拥有相关主题隐</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">性知识或冷门知识的专家水平。在本次推演中，表现最好的团队是一个通才团队，其方案在每项</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">衡量指标上都大幅领先。然而，将所有团队合并分析后，有专家的团队在可行性上比通才团队高</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">出</text><text x="85.89 91.63 97.76" y="129.47" font-size="11.00" class="sc-loraregular">23%</text><text x="107.33" y="129.47" font-size="11.00" class="sc-notoserifcjksc">，综合得分高出</text><text x="187.23" y="129.47" font-size="11.00" class="sc-loraregular">11%</text><text x="204.80" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。尽管通才团队的合并表现低于专家团队，但我们预计，如果模型提</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">供的信息更详尽、更具体，而非源自已发表文献的一般性信息，这一差距会更大。此外，当团队</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">缺乏某个领域的经验时，其提交成果中往往会出现科学错误。例如，通才团队犯了与衣原体生物</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">学相关的错误，而排名前</text><text x="195.89" y="176.33" font-size="11.00" class="sc-loraregular">2</text><text x="204.69" y="176.33" font-size="11.00" class="sc-notoserifcjksc">的团队（均缺乏噬菌体专业知识）犯了噬菌体工程方面的错误。与以</text><text x="72.00" y="191.95" font-size="11.00" class="sc-notoserifcjksc">往红队测试一样，专家能够质疑模型提出的具体科学论断。例如，他们发现，模型建议装载的一</text><text x="72.00" y="207.57" font-size="11.00" class="sc-notoserifcjksc">种药物存在根本性问题：它对人体酶的抑制作用强于对模型提出的细菌靶点的抑制作用。相比之</text><text x="72.00" y="223.19" font-size="11.00" class="sc-notoserifcjksc">下，通才依赖更通用的能力激发（</text><text x="237.00 242.96 245.95 249.05 254.90 258.16 262.42 268.02 272.28 275.37 281.80" y="223.19" font-size="11.00" class="sc-loraregular">elicitation</text><text x="288.48" y="223.19" font-size="11.00" class="sc-notoserifcjksc">）策略。例如，他们会要求模型提供文献引用，最终</text><text x="72.00" y="238.81" font-size="11.00" class="sc-notoserifcjksc">获得修正后的信息。</text><text x="171.00" y="238.81" font-size="11.00" class="sc-loraregular">14</text><text x="183.86" y="238.81" font-size="11.00" class="sc-notoserifcjksc">名参与者中有</text><text x="252.75" y="238.81" font-size="11.00" class="sc-loraregular">8</text><text x="261.83" y="238.81" font-size="11.00" class="sc-notoserifcjksc">人表示，如果不能使用模型，就不可能在</text><text x="462.72" y="238.81" font-size="11.00" class="sc-loraregular">16</text><text x="475.98" y="238.81" font-size="11.00" class="sc-notoserifcjksc">小时内完成任</text><text x="72.00" y="254.43" font-size="11.00" class="sc-notoserifcjksc">务。</text><text x="72.00" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">失败模式。</text><text x="127.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">与先前模型一样，专家和评分者指出，</text><text x="314.00" y="390.26" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="361.44" y="390.26" font-size="11.00" class="sc-notoserifcjksc">难以进行开放式科学推理，也未能深</text><text x="72.00" y="405.88" font-size="11.00" class="sc-notoserifcjksc">入审视已发表文献，往往过度依赖摘要中的论断，而不是理解论文全文及其中的限定条件。评分</text><text x="72.00" y="421.50" font-size="11.00" class="sc-notoserifcjksc">者指出，各团队会过分倚重特定论文，其中一名评分者提到，多个团队的整个噬菌体设计都建立</text><text x="72.00" y="437.12" font-size="11.00" class="sc-notoserifcjksc">在单篇已发表研究之上。与评判一组论文是否成立这一更难明确判定的任务相比，</text><text x="468.00" y="437.12" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="515.44" y="437.12" font-size="11.00" class="sc-notoserifcjksc">还产</text><text x="72.00" y="452.74" font-size="11.00" class="sc-notoserifcjksc">生了更多可以核实的科学错误，包括设计出无法编码预期蛋白质的</text><text x="393.89 401.98 410.36" y="452.74" font-size="11.00" class="sc-loraregular">DNA</text><text x="417.25" y="452.74" font-size="11.00" class="sc-notoserifcjksc">，以及在</text><text x="464.14" y="452.74" font-size="11.00" class="sc-loraregular">7</text><text x="472.10" y="452.74" font-size="11.00" class="sc-notoserifcjksc">个团队中的</text><text x="530.00" y="452.74" font-size="11.00" class="sc-loraregular">3</text><text x="72.00" y="468.36" font-size="11.00" class="sc-notoserifcjksc">个团队里提出不适用的动物模型。</text><text x="72.00" y="535.99" font-size="11.00" class="sc-loraregular">7</text><text x="79.96" y="535.99" font-size="11.00" class="sc-notoserifcjksc">个红队小组中还有</text><text x="170.86" y="535.99" font-size="11.00" class="sc-loraregular">2</text><text x="179.66" y="535.99" font-size="11.00" class="sc-notoserifcjksc">个报告称，在应对模型拒绝时遇到了一些困难，耗用了这些团队获分配的</text><text x="72.00" y="551.61" font-size="11.00" class="sc-loraregular">16</text><text x="85.25" y="551.61" font-size="11.00" class="sc-notoserifcjksc">小时中的一部分时间。其中一次拒绝涉及噬菌体靶向、复制和细菌防御规避方面的信息，而这</text><text x="72.00" y="567.23" font-size="11.00" class="sc-notoserifcjksc">些都是该任务的基础。另一方面，本任务使用的</text><text x="305.89" y="567.23" font-size="11.00" class="sc-loraregular">HHH</text><text x="331.63" y="567.23" font-size="11.00" class="sc-notoserifcjksc">（有用、诚实、无害）快照更接近最终的</text><text x="72.00" y="582.85" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="116.55" y="582.85" font-size="11.00" class="sc-notoserifcjksc">，因此，对于这类研究任务，我们对其行为中与能力相关的方面更有信心。鉴于大多数</text><text x="72.00" y="598.47" font-size="11.00" class="sc-notoserifcjksc">团队没有遇到这些问题，我们认为，这些有益红队测试结果仍与我们对</text><text x="415.89" y="598.47" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="463.34" y="598.47" font-size="11.00" class="sc-notoserifcjksc">的能力评估高度</text><text x="72.00" y="614.09" font-size="11.00" class="sc-notoserifcjksc">相关，不过上述问题确实使我们对这一评估的信心略有降低。</text><text x="72.00" y="697.91" font-size="11.00" class="sc-notoserifcjkscbold">新颖构想。</text><text x="127.00" y="697.91" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44" y="697.91" font-size="11.00" class="sc-notoserifcjksc">难以提出新颖想法，其技术准确性和提供具体实验方案的能力也有所下降。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p020.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 20 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">20</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.3</text><text x="104.57" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">生物风险结果：自动化评估</text><text x="72.00" y="117.04" font-size="11.00" class="sc-lorabold">2.2.3.1</text><text x="104.93" y="117.04" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="118.83" y="117.04" font-size="11.00" class="sc-lorabold">CB-1</text><text x="146.21" y="117.04" font-size="11.00" class="sc-notoserifcjkscbold">威胁模型相关的自动化评估</text><text x="72.00" y="135.23" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89" y="135.23" font-size="11.00" class="sc-loraregular">3</text><text x="138.91" y="135.23" font-size="11.00" class="sc-notoserifcjksc">项自动化评估，来评估</text><text x="251.81 259.50 262.49 268.10 274.66 281.24 287.20 290.10 298.83 305.40 311.97 317.06 319.95 325.95 328.65" y="135.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="337.54" y="135.23" font-size="11.00" class="sc-notoserifcjksc">在与我们的</text><text x="392.54" y="135.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="72.00" y="150.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="83.00 89.83 95.79 100.89 107.45 113.89 120.57 125.66 128.75 135.15 138.14 144.11 147.00 153.24 159.07 164.74 167.73 170.82 177.50 183.58 186.48 193.03 199.47 202.46 205.55 211.35" y="150.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Responsible Scaling Policy</text><text x="217.16" y="150.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="228.16" y="150.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="239.16" y="150.85" font-size="11.00" class="sc-loraregular">RSP</text><text x="258.97" y="150.85" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="280.97" y="150.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架（</text><text x="357.97 363.89 368.57 375.01 381.58 385.84 388.93 394.89 399.66 402.55 410.24 416.67 426.51 433.08 436.07 439.16 444.83 451.51 457.31 463.27 466.16 472.08 476.77 482.44 492.28 498.20 506.87 513.31 518.03" y="150.85" font-size="11.00" class="sc-loraregular" fill="#0000ff">Frontier Compliance Framework</text><text x="523.94" y="150.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="72.00" y="166.47" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.95 96.64" y="166.47" font-size="11.00" class="sc-loraregular">FCF</text><text x="102.67" y="166.47" font-size="11.00" class="sc-notoserifcjksc">）所界定的</text><text x="160.56 168.25 175.09 180.19" y="166.47" font-size="11.00" class="sc-loraregular">CB-1</text><text x="187.08" y="166.47" font-size="11.00" class="sc-notoserifcjksc">威胁模型相关的任务上的表现：</text><text x="108.00 115.50 123.07" y="204.99" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">VCT</text><text x="130.22" y="204.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="141.22" y="204.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">由</text><text x="155.11 161.35 167.26 173.11 179.68 184.36 190.15 196.90 199.99" y="204.99" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">SecureBio</text><text x="209.32" y="204.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="223.21 230.79 237.68 241.36" y="204.99" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CAIS</text><text x="250.49" y="204.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">提供的病毒学专项</text><text x="338.49" y="204.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">多模态多项选择评估</text><text x="437.49" y="204.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">；</text><text x="108.00 115.14 118.74 124.69 135.01 141.07 146.40 150.94 156.86 162.29 168.01 175.28 181.19 188.21 193.91" y="237.38" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">BioMysteryBench</text><text x="200.74" y="237.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="211.74" y="237.38" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一项能力评估，评估模型</text><text x="332.74" y="237.38" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">运用生物学推理分析实验室生成数据</text><text x="508.74" y="237.38" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的能</text><text x="108.00" y="253.00" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">力，此能力可能提升</text><text x="209.89 217.58 224.42 229.52" y="253.00" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CB-1</text><text x="236.41" y="253.00" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">行为者的能力；以及</text><text x="108.00 115.03 120.22 126.45 130.99 137.22 142.91 149.10 152.53" y="285.96" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">Protocols</text><text x="157.86" y="285.96" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">：</text><text x="168.86" y="285.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一项生命科学专项评估，评估模型</text><text x="333.86" y="285.96" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">协助排查实验台操作方案的问题并理解这</text><text x="108.00" y="301.58" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">些方案</text><text x="141.00" y="301.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的能力，这些方案属于</text><text x="253.89 261.58 268.42 273.52" y="301.58" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">CB-1</text><text x="280.41" y="301.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">威胁行为者可能尝试实施的类型。</text><text x="72.00" y="355.72" font-size="11.00" class="sc-notoserifcjksc">如上所述，这</text><text x="140.89" y="355.72" font-size="11.00" class="sc-loraregular">3</text><text x="149.91" y="355.72" font-size="11.00" class="sc-notoserifcjksc">项评估中有</text><text x="207.81" y="355.72" font-size="11.00" class="sc-loraregular">2</text><text x="216.61" y="355.72" font-size="11.00" class="sc-notoserifcjksc">项（</text><text x="238.61 245.36 248.45 254.65 264.59 270.40 275.49 279.75 285.71 290.66 296.27 303.11 309.07 315.75 321.60" y="355.72" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="331.08" y="355.72" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="344.98 351.64 356.33 362.76 367.02 373.45 379.25 385.69 388.68" y="355.72" font-size="11.00" class="sc-loraregular">Protocols</text><text x="393.77" y="355.72" font-size="11.00" class="sc-notoserifcjksc">）不同于近期用于评估</text><text x="506.67 514.35 521.20 526.29" y="355.72" font-size="11.00" class="sc-loraregular">CB-1</text><text x="72.00" y="371.34" font-size="11.00" class="sc-notoserifcjksc">能力的评估，不过我们曾在先前系统卡的生命科学能力章节中报告过这两项评估的结果。因此，</text><text x="72.00" y="386.96" font-size="11.00" class="sc-notoserifcjksc">这</text><text x="85.89" y="386.96" font-size="11.00" class="sc-loraregular">3</text><text x="94.91" y="386.96" font-size="11.00" class="sc-notoserifcjksc">项评估均已在先前的系统卡中介绍，本系统卡的其他部分也有介绍。</text><text x="72.00" y="452.88" font-size="11.00" class="sc-notoserifcjkscbold">纳入或弃用的理由</text><text x="162.89" y="452.88" font-size="11.00" class="sc-notoserifcjksc">我们一直使用</text><text x="231.79 238.80 246.49" y="452.88" font-size="11.00" class="sc-loraregular">VCT</text><text x="256.43" y="452.88" font-size="11.00" class="sc-notoserifcjksc">作为病毒学相关知识的标准评估，并保留了该评估，仅对</text><text x="72.00" y="468.50" font-size="11.00" class="sc-notoserifcjksc">基础设施作了极少量改动。在这项评估中，候选发布模型不会出现拒绝，其得分与对应的仅有用</text><text x="72.00" y="484.12" font-size="11.00" class="sc-notoserifcjksc">快照一致，因此无需使用仅有用变体，就能与此前发布的模型进行比较。</text><text x="72.00" y="566.22" font-size="11.00" class="sc-notoserifcjksc">相比之下，候选发布模型在我们的</text><text x="239.89 246.25 252.69 259.36 265.45 270.83 276.69 283.12 287.89 297.72 300.61 307.63 310.72 315.41 321.84 324.84 331.27 337.57 343.38 346.27 353.05 358.73 363.82 369.73" y="566.22" font-size="11.00" class="sc-loraregular">Long-Form Virology Tasks</text><text x="377.71" y="566.22" font-size="11.00" class="sc-notoserifcjksc">中经常出现拒绝，需要使用仅有</text><text x="72.00" y="581.84" font-size="11.00" class="sc-notoserifcjksc">用变体才能最大限度地激发能力。然而，对于近期评估的模型，我们总体上认为这些评估未能提</text><text x="72.00" y="597.46" font-size="11.00" class="sc-notoserifcjksc">供有价值的信息：其表现大体上已饱和，微小的得分差异主要源于模型之间的行为差异（例如倾</text><text x="72.00" y="613.08" font-size="11.00" class="sc-notoserifcjksc">向于冗长作答），以及这些差异与评分者所用评分细则之间的相互作用，而非真正的能力差异。</text><text x="72.00" y="679.56" font-size="11.00" class="sc-notoserifcjksc">相比之下，</text><text x="127.00 133.67 138.35 144.79 149.04 155.48 161.28 167.71 170.70" y="679.56" font-size="11.00" class="sc-loraregular">Protocols</text><text x="178.69" y="679.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="192.58 199.34 202.43 208.63 218.56 224.37 229.47 233.72 239.68 244.63 250.24 257.09 263.05 269.73 275.58" y="679.56" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="285.06" y="679.56" font-size="11.00" class="sc-notoserifcjksc">评估能够很好地覆盖这些评估所测量、但</text><text x="485.95 492.97 500.66" y="679.56" font-size="11.00" class="sc-loraregular">VCT</text><text x="510.59" y="679.56" font-size="11.00" class="sc-notoserifcjksc">未涵</text><text x="72.00" y="695.18" font-size="11.00" class="sc-notoserifcjksc">盖的底层能力（实验方案理解、设计与故障排查；推理；从外部数据库中检索文献和／或序列；</text><text x="72.00" y="710.80" font-size="11.00" class="sc-notoserifcjksc">以及长时间运行的智能体任务，</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="392.54" y="126.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p021.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 21 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">21</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些任务专门用于计算分析）。因此，我们选择使用这两项评估来替代</text><text x="415.89 422.25 428.69 435.36 441.45 446.83 452.69 459.12 463.89 473.72 476.61 483.63 486.72 491.41 497.84 500.84 507.27 513.57" y="82.61" font-size="11.00" class="sc-loraregular">Long-Form Virology</text><text x="72.00 78.78 84.45 89.54 95.45" y="98.23" font-size="11.00" class="sc-loraregular">Tasks</text><text x="103.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，以比较模型与此前发布版本在这些能力上的表现。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的判定基准</text><text x="173.89" y="147.38" font-size="11.00" class="sc-notoserifcjksc">如果模型在上述任一任务上的表现达到或超过此前被认定具有</text><text x="473.79 481.48 488.32 493.41" y="147.38" font-size="11.00" class="sc-loraregular">CB-1</text><text x="500.31" y="147.38" font-size="11.00" class="sc-notoserifcjksc">能力的</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型，我们就认为其在该任务上的表现体现了显著能力。对于</text><text x="371.89 378.91 386.60" y="163.00" font-size="11.00" class="sc-loraregular">VCT</text><text x="393.64" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，我们还跟踪模型表现超出专</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">家基线测试者所建立基线（</text><text x="204.00 210.65 213.36 219.27 225.17" y="178.62" font-size="11.00" class="sc-loraregular">0.221</text><text x="229.18" y="178.62" font-size="11.00" class="sc-notoserifcjksc">）的程度。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在多模态病毒学评估（</text><text x="206.89 213.91 221.60" y="228.34" font-size="11.00" class="sc-loraregular">VCT</text><text x="228.64" y="228.34" font-size="11.00" class="sc-notoserifcjksc">）中，</text><text x="261.64" y="228.34" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="309.08" y="228.34" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="344.98 351.63 354.34 360.33" y="228.34" font-size="11.00" class="sc-loraregular">0.59</text><text x="366.69" y="228.34" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="402.58 410.27 413.26 418.87 425.44 432.02 437.98 440.87 449.61 456.17 462.74 467.83 470.73" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="476.72" y="228.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="487.72 494.38 497.08 503.08" y="228.34" font-size="11.00" class="sc-loraregular">0.55</text><text x="509.07" y="228.34" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25 171.24 173.95" y="243.96" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="177.95" y="243.96" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="188.95 195.61 198.31 204.31" y="243.96" font-size="11.00" class="sc-loraregular">0.58</text><text x="210.49" y="243.96" font-size="11.00" class="sc-notoserifcjksc">）相当。这些模型在该评估中均超过显著能力的判定基准。从本系统</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">卡开始，我们交叉参照</text><text x="184.89 191.65 194.74 200.94 210.88 216.68 221.78 226.03 232.00 236.95 242.56 249.40 255.36 262.04 267.89" y="259.58" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="277.37" y="259.58" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="291.26 297.93 302.61 309.05 313.31 319.74 325.54 331.97 334.97" y="259.58" font-size="11.00" class="sc-loraregular">Protocols</text><text x="342.95" y="259.58" font-size="11.00" class="sc-notoserifcjksc">评估来评估模型在</text><text x="433.85" y="259.58" font-size="11.00" class="sc-loraregular">CB</text><text x="451.27" y="259.58" font-size="11.00" class="sc-notoserifcjksc">风险方面的能力。</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">有关这些评估内容与实施方式的更多信息，见第</text><text x="305.89" y="275.20" font-size="11.00" class="sc-loraregular">8.17</text><text x="326.75" y="275.20" font-size="11.00" class="sc-notoserifcjksc">节及图</text><text x="362.64 368.82 371.53 375.53 380.12 382.83 389.01 391.72" y="275.20" font-size="11.00" class="sc-loraregular">8.17.8.A</text><text x="398.60" y="275.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.75 81.85 88.05 97.98 103.79 108.88 113.14 119.10 124.05 129.66 136.50 142.47 149.14 154.99" y="357.87" font-size="11.00" class="sc-loraregular">BioMysteryBench</text><text x="164.48" y="357.87" font-size="11.00" class="sc-notoserifcjksc">使我们能够了解模型为威胁行为者提供分析与计算支持的能力。简而言之，该</text><text x="72.00" y="373.49" font-size="11.00" class="sc-notoserifcjksc">基准测试包含一个人类专家能够解决的问题模块（</text><text x="314.00 322.37 328.94 338.77 344.45 351.12 354.02 360.26 366.69 369.64 375.08 380.76 387.16 390.15" y="373.49" font-size="11.00" class="sc-loraregular">Human Solvable</text><text x="396.11" y="373.49" font-size="11.00" class="sc-notoserifcjksc">），以及另一个人类专家很难</text><text x="72.00" y="389.11" font-size="11.00" class="sc-notoserifcjksc">解决的问题模块（</text><text x="241.65" y="389.11" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="263.65" y="389.11" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="311.10" y="389.11" font-size="11.00" class="sc-notoserifcjksc">的表现与</text><text x="357.99" y="389.11" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="396.73" y="389.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="410.62 420.56 426.42 430.68 437.27 443.70 448.79 451.69 457.68 460.39" y="389.11" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="467.29" y="389.11" font-size="11.00" class="sc-notoserifcjksc">等此前发布的</text><text x="72.00" y="404.73" font-size="11.00" class="sc-notoserifcjksc">模型相近或略差。例如，在</text><text x="206.89 215.26 221.83 231.67 237.34 244.02 246.91 253.15 259.58 262.53 267.98 273.65 280.05 283.05" y="404.73" font-size="11.00" class="sc-loraregular">Human Solvable</text><text x="291.90" y="404.73" font-size="11.00" class="sc-notoserifcjksc">问题上，</text><text x="335.90" y="404.73" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="383.34" y="404.73" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="419.24 425.34 431.52 434.23 440.36" y="404.73" font-size="11.00" class="sc-loraregular">89.3%</text><text x="449.93" y="404.73" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="474.82" y="404.73" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="513.56" y="404.73" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="420.35" font-size="11.00" class="sc-loraregular">91.4%</text><text x="103.49" y="420.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="117.39 127.32 133.18 137.44 144.03 150.46 155.56 158.45 164.44 167.15" y="420.35" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="174.05" y="420.35" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="187.94 194.30 200.95 203.66 209.79" y="420.35" font-size="11.00" class="sc-loraregular">90.3%</text><text x="222.25" y="420.35" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="255.25" y="420.35" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="302.69" y="420.35" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="401.13" y="420.35" font-size="11.00" class="sc-notoserifcjksc">模块上的表现与</text><text x="481.02" y="420.35" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="519.77" y="420.35" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="435.97" font-size="11.00" class="sc-notoserifcjksc">近，</text><text x="94.00" y="435.97" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="141.44" y="435.97" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="155.34" y="435.97" font-size="11.00" class="sc-loraregular">50%</text><text x="177.73" y="435.97" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="188.73" y="435.97" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="227.47" y="435.97" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="241.37" y="435.97" font-size="11.00" class="sc-loraregular">51.8%</text><text x="269.82" y="435.97" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.67 83.35 89.79 94.04 100.48 106.28 112.71 115.70" y="503.60" font-size="11.00" class="sc-loraregular">Protocols</text><text x="123.69" y="503.60" font-size="11.00" class="sc-notoserifcjksc">评估包含</text><text x="170.58" y="503.60" font-size="11.00" class="sc-loraregular">2</text><text x="179.38" y="503.60" font-size="11.00" class="sc-notoserifcjksc">个模块，分别评估模型排查湿实验方案问题的能力（故障排查，</text><text x="72.00 78.88 83.56 90.00 96.56 102.97 105.96 111.92 117.01 123.60 130.04 136.47 140.73 143.82 150.50" y="519.22" font-size="11.00" class="sc-loraregular">Troubleshooting</text><text x="156.58" y="519.22" font-size="11.00" class="sc-notoserifcjksc">），以及理解在线实验方案并成功扩展这些方案的能力（理解，</text><text x="72.00" y="534.84" font-size="11.00" class="sc-loraregular">Understanding</text><text x="148.38" y="534.84" font-size="11.00" class="sc-notoserifcjksc">）。在故障排查模块中，</text><text x="269.38" y="534.84" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="316.83" y="534.84" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="330.72 335.79 341.92 344.27 349.34" y="534.84" font-size="11.00" class="sc-loraregular">73.7%</text><text x="361.81" y="534.84" font-size="11.00" class="sc-notoserifcjksc">的得分领先其他模型。这一得分比</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="550.46" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="550.46" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.55 147.62 154.28 156.99 162.89" y="550.46" font-size="11.00" class="sc-loraregular">70.2%</text><text x="175.36" y="550.46" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="189.25" y="550.46" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="227.99" y="550.46" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="241.88" y="550.46" font-size="11.00" class="sc-loraregular">68.9%</text><text x="275.95" y="550.46" font-size="11.00" class="sc-notoserifcjksc">略高。在理解模块中，</text><text x="385.95" y="550.46" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="433.39" y="550.46" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="480.29" y="550.46" font-size="11.00" class="sc-loraregular">69%</text><text x="502.57" y="550.46" font-size="11.00" class="sc-notoserifcjksc">，略低</text><text x="72.00" y="566.08" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="566.08" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="124.64" y="566.08" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="138.53" y="566.08" font-size="11.00" class="sc-loraregular">71.8%</text><text x="168.95" y="566.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="182.85 192.78 198.64 202.90 209.49 215.92 221.02 223.91 229.90 232.61" y="566.08" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="239.51" y="566.08" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="253.40 259.76 265.94 268.54 274.90" y="566.08" font-size="11.00" class="sc-loraregular">69.6%</text><text x="284.47" y="566.08" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc">结合更广泛的评估组合来看，这些结果支持将</text><text x="294.89" y="616.95" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="342.34" y="616.95" font-size="11.00" class="sc-notoserifcjksc">视为具有</text><text x="389.23 396.92 403.76 408.85" y="616.95" font-size="11.00" class="sc-loraregular">CB-1</text><text x="415.75" y="616.95" font-size="11.00" class="sc-notoserifcjksc">能力。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p022.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 22 页"><text x="90.00" y="448.46" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="561.81" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="691.34" font-size="11.00" class="sc-loraregular">3.</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">22</text><text x="72.00" y="310.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="310.74" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 111.42 113.52 119.05" y="310.74" font-size="9.00" class="sc-lorabold">2.2.3.1.A]</text><text x="124.89" y="310.74" font-size="9.00" class="sc-notoserifcjkscbold">多模态病毒学。</text><text x="187.89" y="310.74" font-size="9.00" class="sc-notoserifcjksc">在包含</text><text x="217.26" y="310.74" font-size="9.00" class="sc-loraregular">350</text><text x="235.13" y="310.74" font-size="9.00" class="sc-notoserifcjksc">道题的多模态病毒学故障排查题集上的准确率。误差线表示基于题目计算的</text><text x="72.00" y="322.44" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="322.44" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="137.30" y="322.44" font-size="9.00" class="sc-loraregular">t</text><text x="143.15" y="322.44" font-size="9.00" class="sc-notoserifcjksc">区间）。人类专家基线（</text><text x="242.15 247.60 249.81 254.65 259.48" y="322.44" font-size="9.00" class="sc-loraregular">0.221</text><text x="262.76" y="322.44" font-size="9.00" class="sc-notoserifcjksc">）以虚线表示。</text><text x="72.00" y="365.05" font-size="11.00" class="sc-lorabold">2.2.3.2</text><text x="106.33" y="365.05" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="120.22 127.79 135.06 139.93" y="365.05" font-size="11.00" class="sc-lorabold">CB-2</text><text x="148.68" y="365.05" font-size="11.00" class="sc-notoserifcjkscbold">威胁模型相关的自动化评估</text><text x="72.00" y="399.43" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89 116.09 121.90 128.57 135.01 137.90 144.94 151.53 157.49 162.18 167.85 174.42 180.38 186.95 191.21 194.30 200.15" y="399.43" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="208.14" y="399.43" font-size="11.00" class="sc-notoserifcjksc">合作开展了</text><text x="266.03" y="399.43" font-size="11.00" class="sc-loraregular">3</text><text x="275.05" y="399.43" font-size="11.00" class="sc-notoserifcjksc">项序列到功能建模与设计能力评估：</text><text x="108.00" y="448.01" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="132.89 140.44 148.77" y="448.01" font-size="11.00" class="sc-lorabold">RNA</text><text x="159.01" y="448.01" font-size="11.00" class="sc-notoserifcjkscbold">序列设计：</text><text x="214.01" y="448.01" font-size="11.00" class="sc-notoserifcjksc">这是一项中程挑战，自</text><text x="326.90" y="448.01" font-size="11.00" class="sc-loraregular">2018</text><text x="352.72" y="448.01" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="396.72" y="448.01" font-size="11.00" class="sc-loraregular">Dyno</text><text x="426.73" y="448.01" font-size="11.00" class="sc-notoserifcjksc">已用它评估了来自美国</text><text x="108.00" y="463.63" font-size="11.00" class="sc-notoserifcjksc">机器学习与生物学交叉领域人才市场前沿的</text><text x="319.89" y="463.63" font-size="11.00" class="sc-loraregular">57</text><text x="333.85" y="463.63" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。该任务提供一个</text><text x="490.74" y="463.63" font-size="11.00" class="sc-loraregular">RNA</text><text x="515.81" y="463.63" font-size="11.00" class="sc-notoserifcjksc">序列</text><text x="108.00" y="479.25" font-size="11.00" class="sc-notoserifcjksc">数据集，其中每条序列都有一个数值得分，反映对该序列进行的某种未知实验测量；任务</text><text x="108.00" y="494.87" font-size="11.00" class="sc-notoserifcjksc">要求（</text><text x="141.00" y="494.87" font-size="11.00" class="sc-loraregular">1</text><text x="145.00" y="494.87" font-size="11.00" class="sc-notoserifcjksc">）预测无标签测试集内序列的得分，然后（</text><text x="354.00" y="494.87" font-size="11.00" class="sc-loraregular">2</text><text x="359.91" y="494.87" font-size="11.00" class="sc-notoserifcjksc">）设计新序列，以获得高分为目标。</text><text x="108.00 115.61 122.10" y="561.35" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78" y="561.35" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78" y="561.35" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78 281.46 288.04 294.00 300.68 307.11 312.49 318.17 323.26 328.35 334.79 340.64 343.73 349.33 353.59 359.49 366.07 368.96 374.52 377.61 382.37 388.94" y="561.35" font-size="11.00" class="sc-loraregular">adeno-associated virus</text><text x="394.03" y="561.35" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03 412.42 418.88" y="561.35" font-size="11.00" class="sc-loraregular">AAV</text><text x="426.07" y="561.35" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病性病</text><text x="108.00" y="576.97" font-size="11.00" class="sc-notoserifcjksc">毒，常被用作基因疗法的递送工具，将</text><text x="297.89 305.98 314.36" y="576.97" font-size="11.00" class="sc-loraregular">DNA</text><text x="324.14" y="576.97" font-size="11.00" class="sc-notoserifcjksc">载荷包裹在病毒衣壳（病毒外层的蛋白质外</text><text x="108.00" y="592.59" font-size="11.00" class="sc-notoserifcjksc">壳）内进行递送。在这项任务中，模型获得了</text><text x="330.89 334.90 337.50 344.34 351.17" y="592.59" font-size="11.00" class="sc-loraregular">1,000</text><text x="360.90" y="592.59" font-size="11.00" class="sc-notoserifcjksc">条尚未公开的</text><text x="429.79 437.19 443.64" y="592.59" font-size="11.00" class="sc-loraregular">AAV</text><text x="453.72" y="592.59" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，这些序</text><text x="108.00" y="608.21" font-size="11.00" class="sc-notoserifcjksc">列均通过</text><text x="154.89" y="608.21" font-size="11.00" class="sc-loraregular">Dyno</text><text x="184.90" y="608.21" font-size="11.00" class="sc-notoserifcjksc">精选的短插入序列进行了修饰。随后，模型需要利用自身的生物物理学知</text><text x="108.00" y="623.83" font-size="11.00" class="sc-notoserifcjksc">识、</text><text x="130.00 137.39 143.85" y="623.83" font-size="11.00" class="sc-loraregular">AAV</text><text x="153.93" y="623.83" font-size="11.00" class="sc-notoserifcjksc">衣壳生物学知识和机器学习技能，给出每条修饰后的序列能够正确组装成功能性</text><text x="108.00" y="639.45" font-size="11.00" class="sc-notoserifcjksc">衣壳的概率。</text><text x="108.00 115.61 122.10" y="690.89" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78" y="690.89" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装自动研究：</text><text x="231.78" y="690.89" font-size="11.00" class="sc-notoserifcjksc">与前一项任务一样，模型会获得一批带标签、尚未公开的</text><text x="509.68 517.07 523.53" y="690.89" font-size="11.00" class="sc-loraregular">AAV</text><text x="108.00" y="706.51" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，这些序列均通过短</text></svg></div>
