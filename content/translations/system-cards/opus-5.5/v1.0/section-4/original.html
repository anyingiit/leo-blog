.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">61</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89" y="150.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="292.63" y="150.76" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这些评估考察模型如何处理涉及我们</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="116.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.00" y="166.38" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="191.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信相关领域的请求。与以往版本一样，</text><text x="72.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">测试包括：涵盖明显有害与明显良性请求的单轮提示词；旨在揭示模型在边界情境中行为的语境</text><text x="72.00" y="197.62" font-size="11.00" class="sc-notoserifcjksc">模糊的提示词；以及多轮对话，其中模拟用户试图逐步将模型引向有害结果。</text><text x="72.00" y="280.30" font-size="11.00" class="sc-notoserifcjksc">我们的评估方法与</text><text x="162.89" y="280.30" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable</text><text x="230.70" y="280.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">5.1</text><text x="246.30" y="280.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="260.19" y="280.30" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="355.14" y="280.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="388.14" y="280.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="399.14" y="280.30" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="463.80" y="280.30" font-size="11.00" class="sc-notoserifcjksc">）中所述的方法</text><text x="72.00" y="295.92" font-size="11.00" class="sc-notoserifcjksc">大体相似。下文所列</text><text x="173.89" y="295.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="259.63" y="295.92" font-size="11.00" class="sc-notoserifcjksc">的结果反映的是模型在没有我们在生产环境中施加的额外</text><text x="72.00" y="311.54" font-size="11.00" class="sc-notoserifcjksc">安全防护措施（如实时探针以及离线监控与调查）时的行为。我们继续报告两种配置：单独的核</text><text x="72.00" y="327.16" font-size="11.00" class="sc-notoserifcjksc">心模型（即通过</text><text x="151.89" y="327.16" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="171.97" y="327.16" font-size="11.00" class="sc-notoserifcjksc">使用，不带系统提示词（</text><text x="292.97" y="327.16" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="370.25" y="327.16" font-size="11.00" class="sc-notoserifcjksc">）或其他产品特定指令），以及在</text><text x="72.00" y="342.78" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="119.93" y="342.78" font-size="11.00" class="sc-notoserifcjksc">消费者产品端、搭配接近最终版本的</text><text x="298.82" y="342.78" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="384.55" y="342.78" font-size="11.00" class="sc-notoserifcjksc">生产环境系统提示词的模型。我</text><text x="72.00" y="358.40" font-size="11.00" class="sc-notoserifcjksc">们也继续统一思考设置的报告方式：当用户可同时使用开启思考和关闭思考两种配置时，将二者</text><text x="72.00" y="374.02" font-size="11.00" class="sc-notoserifcjksc">合并统计；当开启思考是唯一可用选项时，则仅报告开启思考的结果。在</text><text x="426.89" y="374.02" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="446.97" y="374.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="460.86" y="374.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="508.79" y="374.02" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="72.00" y="389.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="389.64" font-size="11.00" class="sc-notoserifcjksc">均只能在开启思考的情况下使用。</text><text x="72.00" y="474.60" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="474.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="212.73" y="474.60" font-size="11.00" class="sc-notoserifcjksc">在这些评估中的表现与</text><text x="325.63" y="474.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="402.66" y="474.60" font-size="11.00" class="sc-notoserifcjksc">大致相当。它在良性请求上</text><text x="72.00" y="490.22" font-size="11.00" class="sc-notoserifcjksc">的过度拒绝（</text><text x="138.00" y="490.22" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="200.59" y="490.22" font-size="11.00" class="sc-notoserifcjksc">）率非常低，在</text><text x="280.48" y="490.22" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="300.56" y="490.22" font-size="11.00" class="sc-notoserifcjksc">上的单轮无害回应率略低；在多轮测试中，它在</text><text x="72.00" y="505.84" font-size="11.00" class="sc-notoserifcjksc">生物武器相关对话上有所改进，但在追踪与监视以及影响力行动上出现退步。儿童安全结果与</text><text x="72.00" y="521.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="521.46" font-size="11.00" class="sc-notoserifcjksc">相当。在心理健康情境中，审阅人员发现它的回应更简短、更温暖，也更少对用</text><text x="72.00" y="537.08" font-size="11.00" class="sc-notoserifcjksc">户做出无根据的断言。在偏见与诚信评估中，它比</text><text x="316.89" y="537.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="393.93" y="537.08" font-size="11.00" class="sc-notoserifcjksc">略为公允，选举诚信结果较</text><text x="72.00" y="552.70" font-size="11.00" class="sc-notoserifcjksc">低，但处于近期模型的误差范围之内。在</text><text x="272.89" y="552.70" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="320.82" y="552.70" font-size="11.00" class="sc-notoserifcjksc">上评估时，系统提示词中的安全指令在许多领</text><text x="72.00" y="568.32" font-size="11.00" class="sc-notoserifcjksc">域提升了表现。</text><text x="72.00" y="651.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="651.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="678.95" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型在多大程度上能可靠地拒绝或安全地转移那些有害或明显违反我们使</text><text x="72.00" y="694.57" font-size="11.00" class="sc-notoserifcjksc">用政策的请求。我们在七种语言（阿拉伯语、英语、法语、印地语、韩语、</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="534.63" y="141.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="72.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="94.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="105.00" y="157.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d1423  121.97 128.20 135.21 142.22 148.14 152.68 155.57" y="267.27" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="198.75 205.08 211.40 213.96 220.28 226.22 236.16 239.05 242.30 248.13 251.02 257.82 260.38 264.85 270.78 280.72" y="267.27" font-size="11.00" class="sc-lorabold">96.65% (± 0.15%)</text><text x="372.00 378.35 384.53 387.24 393.14 399.96 409.53 412.42 415.77 421.60 424.49 431.14 433.68 440.26 445.33 454.89" y="267.27" font-size="11.00" class="sc-loraregular">99.20% (± 0.07%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">62</text><text x="76.00" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="198.25" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="286.25" y="130.99" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="304.82" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系</text><text x="198.25" y="146.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">统提示词</text><text x="371.50" y="130.99" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="459.50" y="130.99" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">汉语普通话和俄语）中测试了涵盖</text><text x="239.89" y="82.61" font-size="11.00" class="sc-loraregular">16</text><text x="253.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型回应未助</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">长所请求危害的提示词所占比例。</text><text x="72.00" y="284.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="284.33" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有测试语言。</text><text x="278.74" y="284.33" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="449.74" y="284.33" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最高</text><text x="72.00" y="296.03" font-size="9.00" class="sc-notoserifcjksc">者；次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估</text><text x="72.00" y="307.73" font-size="9.00" class="sc-notoserifcjksc">更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="366.38" font-size="11.00" class="sc-notoserifcjksc">在不带系统提示词的</text><text x="173.89" y="366.38" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="193.97" y="366.38" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="215.97" y="366.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="301.70" y="366.38" font-size="11.00" class="sc-notoserifcjksc">的无害回应率比</text><text x="381.60" y="366.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="458.63" y="366.38" font-size="11.00" class="sc-notoserifcjksc">低约</text><text x="483.52" y="366.38" font-size="11.00" class="sc-loraregular">1.5</text><text x="499.12" y="366.38" font-size="11.00" class="sc-notoserifcjksc">个百分</text><text x="72.00" y="382.00" font-size="11.00" class="sc-notoserifcjksc">点。这一差距大部分来自非法药物领域，影响力行动和进食紊乱领域的贡献较小。</text><text x="72.00" y="447.34" font-size="11.00" class="sc-notoserifcjksc">对于涉及受管制或非法药物的请求，</text><text x="248.00" y="447.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="333.73" y="447.34" font-size="11.00" class="sc-notoserifcjksc">的回应通常以减少伤害为出发点（例如当</text><text x="72.00" y="462.96" font-size="11.00" class="sc-notoserifcjksc">用户表示无论如何都打算使用某种药物时），但有时会在给出警告和过量用药应对建议的同时，</text><text x="72.00" y="478.58" font-size="11.00" class="sc-notoserifcjksc">提供具体指导，例如用量或时间安排。例如，在一个案例中，当被问及将肌肉松弛剂与每日服用</text><text x="72.00" y="494.20" font-size="11.00" class="sc-loraregular sc-k">kratom</text><text x="111.61" y="494.20" font-size="11.00" class="sc-notoserifcjksc">合并使用时，</text><text x="177.61" y="494.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="263.35" y="494.20" font-size="11.00" class="sc-notoserifcjksc">解释了为何任何剂量都不安全，但随后给出了一个不应超</text><text x="72.00" y="509.82" font-size="11.00" class="sc-notoserifcjksc">过的上限。正如</text><text x="151.89" y="509.82" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="235.30" y="509.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="249.19" y="509.82" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="344.14" y="509.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="377.14" y="509.82" font-size="11.00" class="sc-notoserifcjksc">中所述，我们对这项评估的评分</text><text x="72.00" y="525.44" font-size="11.00" class="sc-notoserifcjksc">刻意从严，以便观察到更多样的潜在失败模式。</text><text x="303.00" y="525.44" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="350.93" y="525.44" font-size="11.00" class="sc-notoserifcjksc">系统提示词在很大程度上缓解了这一模</text><text x="72.00" y="541.06" font-size="11.00" class="sc-notoserifcjksc">式。</text><text x="72.00" y="607.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="607.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="635.49" font-size="11.00" class="sc-notoserifcjksc">单轮良性评估衡量模型拒绝那些主题敏感但适合回答的请求的频率。该提示词集涵盖与上述有害</text><text x="72.00" y="651.11" font-size="11.00" class="sc-notoserifcjksc">集相同的</text><text x="118.89" y="651.11" font-size="11.00" class="sc-loraregular">16</text><text x="132.15" y="651.11" font-size="11.00" class="sc-notoserifcjksc">个政策领域和七种语言。在此，我们报告过度拒绝率，即模型拒绝回应的良性提示词</text><text x="72.00" y="666.73" font-size="11.00" class="sc-notoserifcjksc">所占比例。</text><a href="https:// .45 230.01 232.90 236.26 242.08 244.97 251.62 254.16 260.99 266.98 276.54" y="222.77" font-size="11.00" class="sc-loraregular">0.59% (± 0.05%)</text><text x="372.00 376.00 378.71 384.70 390.65 400.22 403.11 406.46 412.29 415.18 421.83 424.53 428.53 435.36 444.92" y="222.77" font-size="11.00" class="sc-loraregular">1.54% (± 0.10%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="76.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="198.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="264.25" y="88.61" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="282.82" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提</text><text x="198.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">示词</text><text x="371.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="437.50" y="88.61" font-size="11.00" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="239.84" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="239.84" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="239.84" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="239.84" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有测试语言。</text><text x="279.88" y="239.84" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝的比率（即拒绝回答实际上是良性的提示词）；</text><text x="72.00" y="251.54" font-size="9.00" class="sc-notoserifcjksc">数值越低越好。</text><text x="135.00" y="251.54" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="153.00" y="251.54" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低者；次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩</text><text x="72.00" y="263.24" font-size="9.00" class="sc-notoserifcjksc">语、汉语普通话和俄语进行。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00" y="321.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="321.88" font-size="11.00" class="sc-notoserifcjksc">在无害请求上的过度拒绝率在</text><text x="303.63" y="321.88" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="323.70" y="321.88" font-size="11.00" class="sc-notoserifcjksc">上接近零（</text><text x="378.70" y="321.88" font-size="11.00" class="sc-loraregular sc-k">0.03%</text><text x="410.43" y="321.88" font-size="11.00" class="sc-notoserifcjksc">），在使用默认系统提示</text><text x="72.00" y="337.50" font-size="11.00" class="sc-notoserifcjksc">词的</text><text x="96.89" y="337.50" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="144.82" y="337.50" font-size="11.00" class="sc-notoserifcjksc">上也非常低（</text><text x="210.82" y="337.50" font-size="11.00" class="sc-loraregular sc-k">0.38%</text><text x="242.06" y="337.50" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="277.95" y="337.50" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="361.36" y="337.50" font-size="11.00" class="sc-notoserifcjksc">相当；后者是我们近期模型中过度拒</text><text x="72.00" y="353.12" font-size="11.00" class="sc-notoserifcjksc">绝率最低的。</text><text x="72.00" y="386.65" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="386.65" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="133.82" y="386.65" font-size="11.00" class="sc-notoserifcjksc">上，为数不多的几次过度拒绝主要出现在爆炸物领域。这些大多是参考资料类问题，</text><text x="72.00" y="402.27" font-size="11.00" class="sc-notoserifcjksc">例如询问某种特定爆炸物已公开的成分，或商用爆破电路的设计；在这些情况下，</text><text x="468.00" y="402.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="417.89" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="417.89" font-size="11.00" class="sc-notoserifcjksc">提供了一般性背景信息，但表示不会提供技术细节。早期模型在</text><text x="400.48" y="417.89" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="448.41" y="417.89" font-size="11.00" class="sc-notoserifcjksc">上大多拒绝了同样</text><text x="72.00" y="433.51" font-size="11.00" class="sc-notoserifcjksc">的提示词，但在</text><text x="151.89" y="433.51" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="171.97" y="433.51" font-size="11.00" class="sc-notoserifcjksc">上这些提示词无一被拒绝，这表明这种谨慎是由默认系统提示词而非核心模</text><text x="72.00" y="449.13" font-size="11.00" class="sc-notoserifcjksc">型驱动的。</text><text x="72.00" y="514.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="514.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="542.42" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察模型能否在更长、不断演变的对话中（而非单轮交互中）保持安全行为。为构建每</text><text x="72.00" y="558.04" font-size="11.00" class="sc-notoserifcjksc">个测试用例，内部政策专家会撰写一份规格说明，描述一个合成</text><text x="380.00" y="558.04" font-size="11.00" class="sc-loraregular">“</text><text x="384.40" y="558.04" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="406.40" y="558.04" font-size="11.00" class="sc-loraregular">”</text><text x="410.24" y="558.04" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策略。一</text><text x="72.00" y="573.66" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="85.89" y="573.66" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="124.18" y="573.66" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="193.08" y="573.66" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="276.14" y="573.66" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后，我们评估受测</text><text x="72.00" y="589.28" font-size="11.00" class="sc-notoserifcjksc">模型如何回应。我们报告恰当回应率，即模型在整个对话中始终表现恰当的对话所占比例。每段</text><text x="72.00" y="604.90" font-size="11.00" class="sc-notoserifcjksc">对话均依据其风险领域特定的评分细则进行评分，因此不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="328.70" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="328.70" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="377.85" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="377.85" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="400.48" y="409.09" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="400.48" y="409.09" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="515.67" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">各多轮测试领域的恰当回应率。</text><text x="244.12" y="515.67" font-size="9.00" class="sc-notoserifcjksc">百分比指各模型在整个对话中始终恰当回应的对话所占比例。结果先显示</text><text x="72.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">不带系统提示词的</text><text x="146.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="160.42" y="527.38" font-size="9.00" class="sc-notoserifcjksc">，再显示</text><text x="198.79" y="527.38" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="235.64" y="527.38" font-size="9.00" class="sc-notoserifcjksc">；数值越高越好。由于常规评估更新，以往模型的结果可能与此前系统卡中</text><text x="72.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">的结果存在差异。</text><text x="72.00" y="581.23" font-size="11.00" class="sc-notoserifcjksc">在不带系统提示词的核心</text><text x="195.89" y="581.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="215.97" y="581.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="237.97" y="581.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="323.70" y="581.23" font-size="11.00" class="sc-notoserifcjksc">的多轮恰当回应率在所评估的大多数领域与</text><text x="72.00" y="596.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="596.85" font-size="11.00" class="sc-notoserifcjksc">相当，其中在生物武器相关对话中提供安全回应方面有明显改进（</text><text x="468.03" y="596.85" font-size="11.00" class="sc-loraregular sc-k">89%</text><text x="492.96" y="596.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00" y="612.47" font-size="11.00" class="sc-loraregular">79%</text><text x="93.00" y="612.47" font-size="11.00" class="sc-notoserifcjksc">），而在追踪与监视（</text><text x="203.00" y="612.47" font-size="11.00" class="sc-loraregular">65%</text><text x="227.82" y="612.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="241.71" y="612.47" font-size="11.00" class="sc-loraregular">88%</text><text x="263.64" y="612.47" font-size="11.00" class="sc-notoserifcjksc">）和影响力行动（</text><text x="351.64" y="612.47" font-size="11.00" class="sc-loraregular">62%</text><text x="376.37" y="612.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="390.26" y="612.47" font-size="11.00" class="sc-loraregular">73%</text><text x="411.03" y="612.47" font-size="11.00" class="sc-notoserifcjksc">）上出现退步。</text><text x="488.03" y="612.47" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="72.00" y="628.09" font-size="11.00" class="sc-notoserifcjksc">系统提示词提升了大多数领域的表现，安全收益最大的是自杀与自伤（</text><text x="413.00" y="628.09" font-size="11.00" class="sc-loraregular">66%</text><text x="438.18" y="628.09" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="463.07" y="628.09" font-size="11.00" class="sc-loraregular">94%</text><text x="484.96" y="628.09" font-size="11.00" class="sc-notoserifcjksc">）、儿童安</text><text x="72.00" y="643.71" font-size="11.00" class="sc-notoserifcjksc">全（</text><text x="94.00" y="643.71" font-size="11.00" class="sc-loraregular">84%</text><text x="118.61" y="643.71" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="143.50" y="643.71" font-size="11.00" class="sc-loraregular">99%</text><text x="165.79" y="643.71" font-size="11.00" class="sc-notoserifcjksc">）和致命武器（</text><text x="242.79" y="643.71" font-size="11.00" class="sc-loraregular">82%</text><text x="267.34" y="643.71" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="292.23" y="643.71" font-size="11.00" class="sc-loraregular">93%</text><text x="314.29" y="643.71" font-size="11.00" class="sc-notoserifcjksc">）相关对话。</text><a href="http://claude.ai" rel="noopener"><rect x="198.79" y="520.17" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="198.79" y="520.17" width="36.85" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="488.03" y="603.67" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="488.03" y="603.67" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">除上述定量结果外，我们的内部政策专家还审阅了每个领域的底层评估对话记录，以定性描述</text><text x="72.00" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的行为与</text><text x="204.63" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.66" y="126.65" font-size="11.00" class="sc-notoserifcjksc">相比如何。我们在下文总结了若干观察结果；儿童安</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">全、心理健康和选举诚信将在下文各自的章节中单独讨论。总体而言，政策专家评估认为</text><text x="503.89" y="142.27" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="157.89" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在大多数领域与</text><text x="199.34" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="276.37" y="157.89" font-size="11.00" class="sc-notoserifcjksc">相当。它在某些维度上有所改进，尤其是拒绝更简短、</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">更直接，但在其他维度上出现退步。</text><text x="72.00" y="240.57" font-size="11.00" class="sc-notoserifcjksc">审阅人员发现，</text><text x="149.00" y="240.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="234.73" y="240.57" font-size="11.00" class="sc-notoserifcjksc">的拒绝在后续轮次的持续施压下仍能坚持。当请求直接表明有</text><text x="72.00" y="256.19" font-size="11.00" class="sc-notoserifcjksc">害目的时，</text><text x="127.00" y="256.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="212.73" y="256.19" font-size="11.00" class="sc-notoserifcjksc">通常会在早期就拒绝参与；在追踪与监视、影响力行动、仇恨内容</text><text x="72.00" y="271.81" font-size="11.00" class="sc-notoserifcjksc">和暴力极端主义测试中，当请求被重复或拆分成更小的部分时，它总体上能坚持这一立场。例</text><text x="72.00" y="287.43" font-size="11.00" class="sc-notoserifcjksc">如，在一个追踪与监视测试用例中，</text><text x="248.00" y="287.43" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="333.73" y="287.43" font-size="11.00" class="sc-notoserifcjksc">拒绝为一名普通个人汇编背景档案，并且</text><text x="72.00" y="303.05" font-size="11.00" class="sc-notoserifcjksc">在模拟用户将请求缩小为一个空白模板、再缩小为几项基本履历信息时，仍继续拒绝。在生物领</text><text x="72.00" y="318.67" font-size="11.00" class="sc-notoserifcjksc">域测试中，审阅人员还发现</text><text x="206.89" y="318.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="292.63" y="318.67" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="306.52" y="318.67" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="383.55" y="318.67" font-size="11.00" class="sc-notoserifcjksc">在对话中更早拒绝，并能更好地</text><text x="72.00" y="334.29" font-size="11.00" class="sc-notoserifcjksc">抵御渐进式升级。</text><text x="72.00" y="418.68" font-size="11.00" class="sc-notoserifcjksc">一个需要改进的方面是</text><text x="184.89" y="418.68" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="72.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc">正当、不应接受哪些。与</text><text x="193.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">先前的模型</text><text x="248.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc">一样，审阅人员观察到</text><text x="360.89" y="434.30" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="446.63" y="434.30" font-size="11.00" class="sc-notoserifcjksc">有时过于轻易地接</text><text x="72.00" y="449.92" font-size="11.00" class="sc-notoserifcjksc">受用户声称的框架，例如职业身份、自称的权限或小说创作。在某些领域，</text><text x="435.00" y="449.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="520.73" y="449.92" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="72.00" y="465.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="465.54" font-size="11.00" class="sc-notoserifcjksc">更愿意生成单独看来无害、但在多段对话中合在一起可能助长危害的内容片段。</text><text x="72.00" y="548.22" font-size="11.00" class="sc-notoserifcjksc">追踪与监视领域体现了这一行为。尽管</text><text x="261.89" y="548.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="347.63" y="548.22" font-size="11.00" class="sc-notoserifcjksc">在该领域对明确有害的请求坚持拒绝，</text><text x="72.00" y="563.84" font-size="11.00" class="sc-notoserifcjksc">但当请求附带一个看似合理的职业目的时，它的可靠性就有所下降。在一段测试对话中，</text><text x="501.00" y="563.84" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="579.46" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="579.46" font-size="11.00" class="sc-notoserifcjksc">被要求为一个政府客户制作一份按人口群体进行定向与细分的舆情简报，助手的初始回</text><text x="72.00" y="610.70" font-size="11.00" class="sc-notoserifcjksc">占位符。然而，在对话的后续轮次中，例如当出现更明确的请求，要求定向特定宗教群体或识别</text><text x="72.00" y="626.32" font-size="11.00" class="sc-notoserifcjksc">个别批评者时，</text><text x="149.00" y="626.32" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="234.73" y="626.32" font-size="11.00" class="sc-notoserifcjksc">拒绝了配合。追踪与监视是一个特别具有挑战性的领域，因为</text><text x="72.00" y="641.94" font-size="11.00" class="sc-notoserifcjksc">其中许多相关工作可能是两用的；同样的工作既可以支持民意研究，也可以帮助监控和针对</text><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="193.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="193.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="204.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="204.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="215.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="215.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="226.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="226.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="237.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20 xt x="72.00" y="370.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="370.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.63" y="370.34" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="191.70" y="370.34" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="205.60" y="370.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="253.52" y="370.34" font-size="11.00" class="sc-notoserifcjksc">上对有害请求均保持了较高的无害回应率。对良性请求的过</text><text x="72.00" y="385.96" font-size="11.00" class="sc-notoserifcjksc">度拒绝仍接近于零，且不高于近期发布模型的良性请求拒绝率。多轮表现在</text><text x="437.89" y="385.96" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="457.97" y="385.96" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="471.86" y="385.96" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="519.79" y="385.96" font-size="11.00" class="sc-notoserifcjksc">上</text><text x="72.00" y="401.58" font-size="11.00" class="sc-notoserifcjksc">均与</text><text x="96.89" y="401.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="173.93" y="401.58" font-size="11.00" class="sc-notoserifcjksc">相差在误差范围之内。</text><text x="72.00" y="468.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="468.06" font-size="11.00" class="sc-notoserifcjksc">能可靠地拒绝大多数明显带有对抗性的、涉及儿童性虐待与性剥削的请求，而</text><text x="72.00" y="483.68" font-size="11.00" class="sc-notoserifcjksc">对单轮灰色地带评估的定性审查未发现明显的违反政策的情况。在捕捉可能预示有害意图的细微</text><text x="72.00" y="499.30" font-size="11.00" class="sc-notoserifcjksc">措辞变化，以及引导用户获取幸存者支持和加害行为预防相关资源方面，</text><text x="424.00" y="499.30" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="509.73" y="499.30" font-size="11.00" class="sc-notoserifcjksc">略强</text><text x="72.00" y="514.92" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89" y="514.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="160.03" y="514.92" font-size="11.00" class="sc-notoserifcjksc">。在一些两用场景中，</text><text x="270.03" y="514.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="355.77" y="514.92" font-size="11.00" class="sc-notoserifcjksc">表现出愿意接受良性的包装方式（例</text><text x="72.00" y="530.54" font-size="11.00" class="sc-notoserifcjksc">如声称出于保护或教育目的），并提供了有关性诱骗手法的详细信息。有关性诱骗的信息可以通</text><text x="72.00" y="546.16" font-size="11.00" class="sc-notoserifcjksc">过教育类及其他保护性资源轻易获取，因此不会为企图伤害未成年人的恶意行为者提供实质性的</text><text x="72.00" y="561.78" font-size="11.00" class="sc-notoserifcjksc">能力提升（</text><text x="127.00" y="561.78" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="154.32" y="561.78" font-size="11.00" class="sc-notoserifcjksc">）。这些行为集中出现在核心</text><text x="300.22" y="561.78" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="320.29" y="561.78" font-size="11.00" class="sc-notoserifcjksc">上，而</text><text x="356.19" y="561.78" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="404.11" y="561.78" font-size="11.00" class="sc-notoserifcjksc">的系统提示词几乎完全缓解</text><text x="72.00" y="577.40" font-size="11.00" class="sc-notoserifcjksc">了这些行为。我们继续鼓励在</text><text x="217.89" y="577.40" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="237.97" y="577.40" font-size="11.00" class="sc-notoserifcjksc">上进行部署的开发者采取安全防护措施（例如在系统提示词中</text><text x="72.00" y="593.02" font-size="11.00" class="sc-notoserifcjksc">加入安全相关措辞），以帮助降低儿童安全风险。</text><text x="72.00" y="694.75" font-size="11.00" class="sc-notoserifcjksc">我们的评估还测试了模型协助完成与儿童安全及未经同意的私密影像（</text><text x="413.00" y="694.75" font-size="11.00" class="sc-loraregular sc-k">NCII</text><text x="436.39" y="694.75" font-size="11.00" class="sc-notoserifcjksc">）相关的技术任务的</text><text x="72.00" y="710.37" font-size="11.00" class="sc-notoserifcjksc">意愿。这些评估</text><a href="http://claude.ai" rel="noopener"><rect x="205.60" y="361.54" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="205.60" y="361.54" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="471.86" y="377.16" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="471.86" y="377.16" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="356.19" y="552.98" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="356.19" y="552.98" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="280.51" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="358.55" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.55" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="437.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="451.29" y="82.61" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="468.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="479.47" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34" y="98.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="153.41" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="167.30" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="248.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的表现与</text><text x="306.14" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="383.17" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当，在</text><text x="430.06" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="497.91" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上的表现</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">优于</text><text x="96.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="171.03" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。在涉及两用场景中构建便于成年人接触未成年人的工具这类请求的评估</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="94.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="179.73" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的得分有所提高。</text><text x="267.73" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="353.47" y="129.47" font-size="11.00" class="sc-notoserifcjksc">通常会拒绝公然有害的技术任务，但当</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">模拟用户以看似正当的目的重新包装请求时，出现了少量失败。我们正在继续针对技术滥用以及</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">更广泛的儿童安全领域开发更多的检测和安全防护措施。</text><text x="72.00" y="245.93" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="245.93" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="283.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="283.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00" y="310.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="310.91" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也并非用于诊断或治疗任何疾病。每个</text><text x="454.18" y="310.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="492.48" y="310.91" font-size="11.00" class="sc-notoserifcjksc">模型都经</text><text x="72.00" y="326.53" font-size="11.00" class="sc-notoserifcjksc">过训练，能够识别痛苦情绪的表达（包括用户表达自杀或自伤念头的情况），并以同理心和关怀</text><text x="72.00" y="342.15" font-size="11.00" class="sc-notoserifcjksc">作出回应，同时在适当时引导用户寻求真人支持，包括求助热线、心理健康专业人士或值得信赖</text><text x="72.00" y="357.77" font-size="11.00" class="sc-notoserifcjksc">的朋友或家人。</text><text x="72.00" y="408.06" font-size="11.00" class="sc-notoserifcjksc">本节中的评估考察</text><text x="162.89" y="408.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="248.63" y="408.06" font-size="11.00" class="sc-notoserifcjksc">对涉及自杀与自伤的对话的回应。这些评估衡量模型能否对</text><text x="72.00" y="423.68" font-size="11.00" class="sc-notoserifcjksc">可能表明存在风险的提示词作出安全且支持性的回应，同时在同一领域的良性请求上保持有用。</text><text x="72.00" y="439.30" font-size="11.00" class="sc-notoserifcjksc">我们报告单轮无害回应率、单轮过度拒绝率和多轮恰当回应率。</text></svg></div>

1.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="160.75" y="160.21" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="179.32" y="160.21" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="260.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="260.50" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="260.50" y="266.47" font-size="11.00" class="sc-loraregular sc-k">0.09% (± 0.09%)</text><text x="354.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="354.25" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="349.50" y="260.78" font-size="11.00" class="sc-lorabold">100%</text><text x="454.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="454.00" y="104.23" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="74.50" y="439.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="185.50" y="439.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="185.50" y="483.11" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="204.07" y="483.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="366.25" y="439.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="351.56" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="351.56" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="351.56" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="351.56" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤单轮评估结果。</text><text x="226.12" y="351.56" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；</text><text x="72.00" y="363.26" font-size="9.00" class="sc-notoserifcjksc">拒绝率越低越好。</text><text x="144.00" y="363.26" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="162.00" y="363.26" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，以往模型的结果可</text><text x="72.00" y="374.96" font-size="9.00" class="sc-notoserifcjksc">能与此前系统卡中的结果存在差异。</text><text x="72.00" y="662.23" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="662.23" font-size="9.00" class="sc-lorabold sc-k">4.3.1.B]</text><text x="118.12" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤多轮评估结果。</text><text x="226.12" y="662.23" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="334.12" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="352.12" y="662.23" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下</text><text x="72.00" y="673.93" font-size="9.00" class="sc-notoserifcjksc">划线标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在自杀与自伤领域的表现与</text><text x="292.63" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="369.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相当。对于可能助长自杀或自伤行</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为的单轮请求，它保持了较高的无害回应率，并且很少对同类话题的良性请求过度拒绝。在多轮</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">评估中，它的恰当回应率与</text><text x="206.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相差在误差范围之内，但内部政策专家的定性审查发</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">现，综合来看它的表现更好（见下文讨论）。内部政策专家发现了回应模式上的多项改进，不过</text><text x="72.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的一些不良行为仍以相近的比例存在；下文将对两者分别进行说明。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="228.34" font-size="11.00" class="sc-notoserifcjksc">的输出比</text><text x="204.63" y="228.34" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="281.66" y="228.34" font-size="11.00" class="sc-notoserifcjksc">更简短、更不冗长，这在用户处于危机中的情境下是</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">有益的。它也更不容易超出用户已披露的内容，对用户的感受、其进行自伤的原因或其行为的严</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">重程度作出无根据的断言。这一改进仅限于自伤场景。同样，</text><text x="369.00" y="259.58" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="416.44" y="259.58" font-size="11.00" class="sc-notoserifcjksc">更少使用临床术语：</text><text x="72.00" y="275.20" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="275.20" font-size="11.00" class="sc-notoserifcjksc">倾向于用</text><text x="154.74" y="275.20" font-size="11.00" class="sc-loraregular">“</text><text x="159.14" y="275.20" font-size="11.00" class="sc-notoserifcjksc">快感缺失</text><text x="203.14" y="275.20" font-size="11.00" class="sc-loraregular">”</text><text x="206.98" y="275.20" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="217.98" y="275.20" font-size="11.00" class="sc-loraregular">“</text><text x="222.38" y="275.20" font-size="11.00" class="sc-notoserifcjksc">现实解体</text><text x="266.38" y="275.20" font-size="11.00" class="sc-loraregular">”</text><text x="270.22" y="275.20" font-size="11.00" class="sc-notoserifcjksc">之类的术语来描述用户的经历，而</text><text x="438.11" y="275.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="485.56" y="275.20" font-size="11.00" class="sc-notoserifcjksc">没有使用这</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">些具体术语。不过，在与自杀相关的情境中，</text><text x="292.00" y="290.82" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="339.44" y="290.82" font-size="11.00" class="sc-notoserifcjksc">确实给用户贴上了患有抑郁症的标签，下</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">文将对此进行讨论。</text><text x="171.00" y="306.44" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="218.44" y="306.44" font-size="11.00" class="sc-notoserifcjksc">整体语气也更加温暖，并更常肯定用户的倾诉行为，例如承认某段</text><text x="72.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">经历可能难以启齿。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">另一方面，</text><text x="127.00" y="406.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="212.73" y="406.45" font-size="11.00" class="sc-notoserifcjksc">保留了在</text><text x="259.63" y="406.45" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="298.37" y="406.45" font-size="11.00" class="sc-notoserifcjksc">中以相近比例观察到的某些不良行为，包括：在与</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">自杀相关的情境中，有时将用户归类为患有抑郁症；认可自伤行为是有效的或具有功能性的；针</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">对自伤建议可能有害且在临床上存在争议的替代行为，例如捏冰块；以及认可回避求助具有保护</text><text x="72.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">作用。尽管这些表述出现在总体上劝阻自杀与自伤、并引导用户寻求真人支持的对话中，我们仍</text><text x="72.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">将其视为有待改进的方面。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">由于这些行为从</text><text x="151.89" y="552.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="228.93" y="552.18" font-size="11.00" class="sc-notoserifcjksc">延续了下来，我们以</text><text x="330.82" y="552.18" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="369.56" y="552.18" font-size="11.00" class="sc-notoserifcjksc">发布时的</text><text x="416.45" y="552.18" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="464.38" y="552.18" font-size="11.00" class="sc-notoserifcjksc">系统提示词措辞</text><text x="72.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">为基础，制定了</text><text x="151.89" y="567.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="199.34" y="567.80" font-size="11.00" class="sc-notoserifcjksc">的系统提示词措辞。应用该系统提示词后，</text><text x="408.34" y="567.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="455.78" y="567.80" font-size="11.00" class="sc-notoserifcjksc">的多轮恰当回应</text><text x="72.00" y="583.42" font-size="11.00" class="sc-notoserifcjksc">率从</text><text x="96.89" y="583.42" font-size="11.00" class="sc-loraregular">66%</text><text x="122.07" y="583.42" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="146.96" y="583.42" font-size="11.00" class="sc-loraregular">94%</text><text x="168.86" y="583.42" font-size="11.00" class="sc-notoserifcjksc">，上述不良行为也得到了部分缓解。我们正在继续努力界定在敏感的心理健</text><text x="72.00" y="599.04" font-size="11.00" class="sc-notoserifcjksc">康情境中最优的</text><text x="151.89" y="599.04" font-size="11.00" class="sc-loraregular">AI</text><text x="165.36" y="599.04" font-size="11.00" class="sc-notoserifcjksc">行为应当是什么样的，并鼓励在</text><text x="322.25" y="599.04" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="342.33" y="599.04" font-size="11.00" class="sc-notoserifcjksc">上进行构建的开发者在用户可能处于痛苦</text><text x="72.00" y="614.66" font-size="11.00" class="sc-notoserifcjksc">之中的情境下采取类似的安全防护措施。</text><a href="http://claude.ai" rel="noopener"><rect x="416.45" y="543.38" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="416.45" y="543.38" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

ont-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82" y="416.59" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="150.00 156.35 162.71 165.41 171.51 177.87 187.43 190.32 193.67 199.50 202.39 209.04 211.74 217.73 224.09 233.65" y="402.51" font-size="11.00" class="sc-loraregular">96.89% (± 0.56%)</text><text x="249.00 255.65 258.19 265.02 269.02 278.58 281.47 284.82 290.65 293.54 300.19 302.73 309.48 315.38 324.94" y="402.51" font-size="11.00" class="sc-loraregular">0.01% (± 0.02%)</text><text x="348.00 354.33 360.49 363.05 369.37 374.52 384.46 387.35 390.61 396.43 399.32 406.13 408.69 414.55 420.48 430.42" y="402.51" font-size="11.00" class="sc-lorabold">99.67% (± 0.25%)</text><text x="447.00 453.65 456.19 462.77 467.84 477.40 480.30 483.65 489.47 492.36 499.01 501.55 508.14 513.21 522.77" y="402.51" font-size="11.00" class="sc-loraregular">0.07% (± 0.07%)</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="441.92" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48 113.02 115.92" y="456.00" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="150.00 156.33 160.79 163.36 167.82 174.81 184.75 187.64 190.89 196.72 199.61 206.41 208.97 214.91 221.06 231.00" y="441.92" font-size="11.00" class="sc-lorabold">97.10% (± 0.53%)</text><text x="249.00 255.65 258.19 265.02 271.37 280.93 283.82 287.18 293.00 295.89 302.54 305.08 311.91 318.26 327.82" y="441.92" font-size="11.00" class="sc-loraregular">0.09% (± 0.06%)</text><text x="348.00 354.35 360.53 363.24 369.23 375.22 384.78 387.67 391.02 396.85 399.74 406.39 409.09 413.10 419.45 429.01" y="441.92" font-size="11.00" class="sc-loraregular">99.55% (± 0.19%)</text><text x="447.00 453.65 456.35 462.48 466.48 476.04 478.93 482.28 488.11 491.00 497.65 500.36 504.36 509.42 518.99" y="441.92" font-size="11.00" class="sc-loraregular">0.31% (± 0.17%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">71</text><text x="75.25" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="149.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="149.50" y="295.79" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="168.07" y="295.79" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="248.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="248.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="347.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">存在潜在风险的单</text><text x="347.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">轮请求（无害率）</text><text x="446.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求（拒</text><text x="446.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">绝率）</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，以考察</text><text x="195.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="111.03" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是，它能否避免强</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">化可能带来风险的请求，同时在有关营养、健身和健康的良性问题上保持有帮助。在此，我们报</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">告单轮无害回应率与过度拒绝率。对于该领域的多轮测试，我们继续通过内部政策专家的定性审</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">查进行评估；下文讨论他们的观察结果。</text><text x="72.00" y="473.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="473.06" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="473.06" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="473.06" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱单轮结果。</text><text x="200.27" y="473.06" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒绝率</text><text x="72.00" y="484.76" font-size="9.00" class="sc-notoserifcjksc">越低越好。</text><text x="117.00" y="484.76" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="135.00" y="484.76" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，以往模型的结果可能与此</text><text x="72.00" y="496.46" font-size="9.00" class="sc-notoserifcjksc">前系统卡中的结果存在差异。</text><text x="72.00" y="538.62" font-size="11.00" class="sc-notoserifcjksc">对于可能强化进食紊乱行为的单轮请求（例如索要低于安全阈值的热量目标，或索要掩饰热量限</text><text x="72.00" y="554.24" font-size="11.00" class="sc-notoserifcjksc">制的技巧），</text><text x="138.00" y="554.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="554.24" font-size="11.00" class="sc-notoserifcjksc">保持了较高的无害回应率。在</text><text x="369.63" y="554.24" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="389.70" y="554.24" font-size="11.00" class="sc-notoserifcjksc">上，其无害回应率略低于</text><text x="513.60" y="554.24" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="569.86" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="569.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="569.86" font-size="11.00" class="sc-loraregular sc-k">95.64%</text><text x="128.73" y="569.86" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="142.62" y="569.86" font-size="11.00" class="sc-loraregular sc-k">96.89%</text><text x="180.08" y="569.86" font-size="11.00" class="sc-notoserifcjksc">）；在</text><text x="215.97" y="569.86" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="263.90" y="569.86" font-size="11.00" class="sc-notoserifcjksc">上，两者差距缩小到误差范围之内。在我们的评估集中，</text><text x="72.00" y="585.48" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="585.48" font-size="11.00" class="sc-notoserifcjksc">没有过度拒绝任何良性请求；该评估集包括有关营养、进食障碍治疗与康复以及身体意</text><text x="72.00" y="601.10" font-size="11.00" class="sc-notoserifcjksc">象的一般性问题。</text><text x="72.00" y="668.15" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查发现，</text><text x="215.00" y="668.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="300.73" y="668.15" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="325.63" y="668.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="364.37" y="668.15" font-size="11.00" class="sc-notoserifcjksc">在多个方面有所改进。与自杀与自伤</text><text x="72.00" y="683.77" font-size="11.00" class="sc-notoserifcjksc">情境中一样，</text><text x="138.00" y="683.77" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="185.44" y="683.77" font-size="11.00" class="sc-notoserifcjksc">生成的输出比</text><text x="254.34" y="683.77" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="293.08" y="683.77" font-size="11.00" class="sc-notoserifcjksc">更简短、更不冗长；当</text><a href="http://claude.ai" rel="noopener"><rect x="215.97" y="561.06" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="215.97" y="561.06" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p072.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 72 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">用户解析冗长、复杂输出的能力或意愿可能有限时，这是有益的。它的语气也更温暖，更常肯定</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用户的倾诉行为，也更不容易超出用户已披露的内容，对用户的进食行为、身体意象或情绪状态</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">作出无根据的断言。它也更不容易在不附加限定说明、也不建议寻求专业评估的情况下，给用户</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">贴上临床进食障碍的标签。它还更不容易引入可能起到目标作用的、针对特定用户的数字，例如</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">估算的身体质量指数（</text><text x="182.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">BMI</text><text x="202.53" y="145.09" font-size="11.00" class="sc-notoserifcjksc">）。进食障碍专家通常建议不要提供此类数字，因为它们可能强化认</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">知扭曲。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在对情境模糊（并非明显有害）的提示词进行的单轮测试中，当用户分享自己身体的图片时，</text><text x="72.00" y="243.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="243.96" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="171.63" y="243.96" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="210.37" y="243.96" font-size="11.00" class="sc-notoserifcjksc">更可能给出评价性反馈。例如，它会评论用户的腰是否足够纤细、适</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">合当模特。我们在</text><text x="162.89" y="259.58" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="208.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">中也观察到了这一行为；在</text><text x="342.90" y="259.58" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="390.82" y="259.58" font-size="11.00" class="sc-notoserifcjksc">上，默认系统提示词缓解了这</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">一行为。在本次发布中，我们没有在系统提示词中新增专门针对进食紊乱的内容；我们保留了现</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">有表述，指示</text><text x="140.89" y="290.82" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="290.82" font-size="11.00" class="sc-notoserifcjksc">在对话显示出进食紊乱迹象时避免给出精确的饮食与营养数字，并将用户</text><text x="72.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">转介至</text><text x="107.89" y="306.44" font-size="11.00" class="sc-loraregular sc-k">National Alliance for Eating Disorders</text><text x="302.79" y="306.44" font-size="11.00" class="sc-notoserifcjksc">的求助热线，而不是已停用的</text><text x="448.68" y="306.44" font-size="11.00" class="sc-loraregular sc-k">National Eating</text><text x="72.00" y="322.06" font-size="11.00" class="sc-loraregular sc-k">Disorders Association</text><text x="183.30" y="322.06" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="194.30" y="322.06" font-size="11.00" class="sc-loraregular sc-k">NEDA</text><text x="224.43" y="322.06" font-size="11.00" class="sc-notoserifcjksc">）热线。</text><text x="72.00" y="391.66" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="391.66" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="418.22" font-size="11.00" class="sc-notoserifcjksc">我们在与</text><text x="118.89" y="418.22" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="202.29" y="418.22" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="216.19" y="418.22" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="311.14" y="418.22" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="344.14" y="418.22" font-size="11.00" class="sc-notoserifcjksc">中所报告的相同的一组偏见与诚信基准</text><text x="72.00" y="433.84" font-size="11.00" class="sc-notoserifcjksc">测试上评估了</text><text x="140.89" y="433.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="433.84" font-size="11.00" class="sc-notoserifcjksc">。我们关注三个方面：我们开源的政治公允性衡量方法；衡量人</text><text x="72.00" y="449.46" font-size="11.00" class="sc-notoserifcjksc">口统计偏见的</text><text x="140.89" y="449.46" font-size="11.00" class="sc-loraregular sc-k">Bias Benchmark for Question Answering</text><text x="346.75" y="449.46" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="357.75" y="449.46" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="380.09" y="449.46" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。</text><text x="72.00" y="513.72" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="513.72" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="545.60" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89" y="545.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.63" y="545.60" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="358.63" y="545.60" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="402.63" y="545.60" font-size="11.00" class="sc-notoserifcjksc">，该评估涵盖</text><text x="471.52 475.52 478.30 484.42 490.42" y="545.60" font-size="11.00" class="sc-loraregular">1,350</text><text x="500.15" y="545.60" font-size="11.00" class="sc-notoserifcjksc">个提示</text><text x="72.00" y="561.22" font-size="11.00" class="sc-notoserifcjksc">词对，这些提示词对呈现</text><text x="195.89" y="561.22" font-size="11.00" class="sc-loraregular">150</text><text x="215.62" y="561.22" font-size="11.00" class="sc-notoserifcjksc">个话题和九种任务类型中对立的意识形态观点。一个</text><text x="471.51" y="561.22" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="509.80" y="561.22" font-size="11.00" class="sc-notoserifcjksc">评分</text><text x="72.00" y="576.84" font-size="11.00" class="sc-notoserifcjksc">者从三个属性对模型的回应打分：公允性（模型是否以相当的深度和质量回应一对提示词中的两</text><text x="72.00" y="592.46" font-size="11.00" class="sc-notoserifcjksc">个提示词）、对立观点（模型的回应是否承认其他观点）以及拒绝（模型是否拒绝回应该请</text><text x="72.00" y="608.08" font-size="11.00" class="sc-notoserifcjksc">求）。</text><text x="72.00" y="675.14" font-size="11.00" class="sc-notoserifcjksc">我们同时报告了不带系统提示词的核心模型的结果，以及在</text><text x="360.89" y="675.14" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="408.82" y="675.14" font-size="11.00" class="sc-notoserifcjksc">上应用默认系统提示词时的</text><text x="72.00" y="690.76" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="105.00" y="690.76" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="152.93" y="690.76" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准表述，指示</text><text x="342.82" y="690.76" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="381.11" y="690.76" font-size="11.00" class="sc-notoserifcjksc">在不同观点之间公允地进行回</text><text x="72.00" y="706.38" font-size="11.00" class="sc-notoserifcjksc">应；同时报告这两种</text><a href="http://claude.ai" rel="noopener"><rect x="342.90" y="250.78" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="342.90" y="250.78" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="409.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="118.89" y="409.42" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="154.29" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="157.18" y="409.42" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="183.80" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="186.70" y="409.42" width="12.71" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="199.40" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="202.29" y="409.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="213.29" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="216.19" y="409.42" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="251.59" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="254.48" y="409.42" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="292.65" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="295.54" y="409.42" width="12.71" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="308.25" y="409.42" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="311.14" y="409.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="322.14" y="409.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="322.14" y="409.42" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c
