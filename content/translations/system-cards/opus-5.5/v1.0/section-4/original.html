58 196.04 205.98 208.87 212.13 217.95 220.84 226.86 236.79" y="238.75" font-size="11.00" class="sc-lorabold">91% (± 4%)</text><text x="366.00 372.18 377.25 386.81 389.70 393.05 398.88 401.77 407.73 417.29" y="238.75" font-size="11.00" class="sc-loraregular">87% (± 4%)</text><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">78</text><text x="74.50 85.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="184.75 195.75 206.75 217.75 228.75 239.75 250.75 261.75 272.75 283.75 294.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="184.75 192.10 199.06" y="132.11" font-size="11.00" class="sc-lorabold" fill="#ffffff">API</text><text x="203.32 214.32 225.32 236.32 247.32 258.32 269.32 280.32 291.32" y="132.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="365.50 376.50 387.50 398.50 409.50 420.50 431.50 442.50 453.50 464.50 475.50" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="256.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.78 100.88 105.92 108.02 113.55" y="256.74" font-size="9.00" class="sc-lorabold">4.4.3.B]</text><text x="119.39 128.39 137.39 146.39 155.39 164.39 173.39 182.39 191.39 200.39 209.39" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">选举诚信多轮评估结果。</text><text x="218.39 227.39 236.39 245.39 254.39 263.39 272.39 281.39 290.39 299.39 308.39 317.39" y="256.74" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="326.39 335.39" y="256.74" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="344.39 353.39 362.39 371.39 380.39 389.39 398.39 407.39 416.39 425.39 434.39 443.39 452.39 461.39 470.39 479.39 488.39 497.39 506.39 515.39 524.39" y="256.74" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00" y="268.44" font-size="9.00" class="sc-notoserifcjksc">线标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="309.05" font-size="11.00" class="sc-notoserifcjksc">在单轮评估中，无论是核心模型（无系统提示词）还是</text><text x="338.89 344.74 347.74 353.35 359.91 366.49 372.45 375.16 380.84" y="309.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="383.93" y="309.05" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="394.93 402.62 405.61 411.22 417.78 424.36 430.32 433.22 441.95 448.52 455.09 460.18 463.07 469.07 471.77" y="309.05" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="480.66 491.66 502.66 513.66 524.66" y="309.05" font-size="11.00" class="sc-notoserifcjksc">都拒绝了几</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="324.67" font-size="11.00" class="sc-notoserifcjksc">乎所有违规提示词，而对无害提示词则一个也没有拒绝。在多轮对抗性测试用例中，</text><text x="479.00 486.69 489.68 495.29 501.86 508.44" y="324.67" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="340.29" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44" y="340.29" font-size="11.00" class="sc-notoserifcjksc">在两个产品端上的恰当回应率均略低于上文所列的近期模型，但仍在误差范围之内。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="406.20" font-size="11.00" class="sc-notoserifcjksc">在审阅评估结果后，内部政策专家观察到，</text><text x="281.00 288.69 291.68 297.29 303.86 310.44 316.40 319.29 328.03 334.59 341.16 346.25 349.14 355.14 357.85" y="406.20" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="406.20" font-size="11.00" class="sc-notoserifcjksc">经常会将选举相关请求中具有欺骗</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="421.82" font-size="11.00" class="sc-notoserifcjksc">性的部分与它可以正当提供帮助的部分区分开来，只对欺骗性的部分予以拒绝或引导至其他方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="437.44" font-size="11.00" class="sc-notoserifcjksc">向。例如，当被要求撰写一则歪曲伦理投诉的政治攻击广告时，</text><text x="380.00 387.69 390.68 396.29 402.86 409.44 415.40 418.29 427.02 433.59 440.16 445.25 448.14 454.14 456.85" y="437.44" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="465.73 476.73 487.73 498.73 509.73 520.73" y="437.44" font-size="11.00" class="sc-notoserifcjksc">拒绝写入误导</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="453.06" font-size="11.00" class="sc-notoserifcjksc">性说法，但提供了基于公开记录的广告文案。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="519.54" font-size="11.00" class="sc-notoserifcjksc">内部政策专家还发现，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 229.03 235.59 242.16 247.25 250.15 256.14 258.85" y="519.54" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="267.73 278.73 289.73" y="519.54" font-size="11.00" class="sc-notoserifcjksc">有时比</text><text x="303.63 311.32 314.31 319.92 326.49 333.06 339.03 341.92 350.65 357.22 363.79 368.88 371.77" y="519.54" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="380.66 391.66 402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="519.54" font-size="11.00" class="sc-notoserifcjksc">更愿意接受用户自称的权限或其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="535.16" font-size="11.00" class="sc-notoserifcjksc">设定的框架，而一旦接受，它往往会提供详细的技术铺垫。在一个多轮场景中，一名自称已获授</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="550.78" font-size="11.00" class="sc-notoserifcjksc">权开展安全评估的用户请求协助测试一个正在运行的选举门户网站。在</text><text x="415.89 422.78 429.39" y="550.78" font-size="11.00" class="sc-loraregular">API</text><text x="435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="550.78" font-size="11.00" class="sc-notoserifcjksc">无系统提示词条件下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="566.40" font-size="11.00" class="sc-notoserifcjksc">的每一次运行中，</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 207.02 213.59 220.16 225.25 228.15 234.14 236.85" y="566.40" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73" y="566.40" font-size="11.00" class="sc-notoserifcjksc">都拒绝提供可操作的攻击步骤，但提供了准备性的技术细</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="582.02" font-size="11.00" class="sc-notoserifcjksc">节，例如梳理该门户网站的技术栈。相比之下，</text><text x="303.00 310.69 313.68 319.29 325.86 332.44 338.40 341.29 350.03 356.59 363.16 368.25 371.14" y="582.02" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="582.02" font-size="11.00" class="sc-notoserifcjksc">从第一次回应起就始终质疑该用</text><text x="72.00 83.00 94.00 105.00 116.00" y="597.64" font-size="11.00" class="sc-notoserifcjksc">户的权限。</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="597.64" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="597.64" font-size="11.00" class="sc-notoserifcjksc">通过将回答保持在较窄的范围内，在一定程度上弥补了这一不足，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="613.26" font-size="11.00" class="sc-notoserifcjksc">这限制了其回答被滥用的可能性。</text><a href="http://claude.ai" rel="noopener"><rect x="338.89" y="300.25" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="338.89" y="300.25" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
