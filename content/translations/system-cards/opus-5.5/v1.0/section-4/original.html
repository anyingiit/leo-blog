<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">61</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38 102.38 118.38 134.38 150.38 166.38 182.38 198.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00 81.25 84.89" y="124.20" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29 107.29 121.29 135.29 149.29 163.29" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="150.76" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="150.76" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这些评估考察模型如何处理涉及我们</text><text x="72.00 83.00 94.00 105.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="116.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.00 135.20 140.29 145.96 151.99 157.95 160.85 167.40 173.84 176.83 179.92 185.72" y="166.38" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="191.53 202.53 213.53 224.53 235.53 246.53 257.53 268.53 279.53 290.53 301.53 312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="166.38" font-size="11.00" class="sc-notoserifcjksc">）、用户身心健康以及偏见与诚信相关领域的请求。与以往版本一样，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="182.00" font-size="11.00" class="sc-notoserifcjksc">测试包括：涵盖明显有害与明显良性请求的单轮提示词；旨在揭示模型在边界情境中行为的语境</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="197.62" font-size="11.00" class="sc-notoserifcjksc">模糊的提示词；以及多轮对话，其中模拟用户试图逐步将模型引向有害结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="280.30" font-size="11.00" class="sc-notoserifcjksc">我们的评估方法与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 206.77 212.45 218.85 221.84" y="280.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable</text><text x="230.70 236.69 239.40" y="280.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">5.1</text><text x="246.30" y="280.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="260.19 267.88 270.87 276.48 283.05 289.62 295.59 298.48 308.41 314.28 318.53 325.12 331.56 336.65 339.54 345.54 348.24" y="280.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="355.14 366.14 377.14" y="280.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="388.14" y="280.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="399.14 405.32 411.13 416.22 420.48 426.44 436.28 439.17 446.86 452.53 457.22" y="280.30" font-size="11.00" class="sc-loraregular">System Card</text><text x="463.80 474.80 485.80 496.80 507.80 518.80 529.80" y="280.30" font-size="11.00" class="sc-notoserifcjksc">）中所述的方法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="295.92" font-size="11.00" class="sc-notoserifcjksc">大体相似。下文所列</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.03 250.74" y="295.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="295.92" font-size="11.00" class="sc-notoserifcjksc">的结果反映的是模型在没有我们在生产环境中施加的额外</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="311.54" font-size="11.00" class="sc-notoserifcjksc">安全防护措施（如实时探针以及离线监控与调查）时的行为。我们继续报告两种配置：单独的核</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="327.16" font-size="11.00" class="sc-notoserifcjksc">心模型（即通过</text><text x="151.89 158.78 165.39" y="327.16" font-size="11.00" class="sc-loraregular">API</text><text x="171.97 182.97 193.97 204.97 215.97 226.97 237.97 248.97 259.97 270.97 281.97" y="327.16" font-size="11.00" class="sc-notoserifcjksc">使用，不带系统提示词（</text><text x="292.97 298.06 303.87 308.96 313.22 319.18 329.02 331.91 338.48 343.16 349.60 359.43 366.00" y="327.16" font-size="11.00" class="sc-loraregular">system prompt</text><text x="370.25 381.25 392.25 403.25 414.25 425.25 436.25 447.25 458.25 469.25 480.25 491.25 502.25 513.25 524.25" y="327.16" font-size="11.00" class="sc-notoserifcjksc">）或其他产品特定指令），以及在</text><text x="72.00 77.85 80.84 86.45 93.02 99.60 105.56 108.27 113.94" y="342.78" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="119.93 130.93 141.93 152.93 163.93 174.93 185.93 196.93 207.93 218.93 229.93 240.93 251.93 262.93 273.93 284.93" y="342.78" font-size="11.00" class="sc-notoserifcjksc">消费者产品端、搭配接近最终版本的</text><text x="298.82 306.51 309.50 315.11 321.68 328.26 334.22 337.11 345.85 352.41 358.98 364.07 366.96 372.96 375.67" y="342.78" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="342.78" font-size="11.00" class="sc-notoserifcjksc">生产环境系统提示词的模型。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="358.40" font-size="11.00" class="sc-notoserifcjksc">们也继续统一思考设置的报告方式：当用户可同时使用开启思考和关闭思考两种配置时，将二者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="374.02" font-size="11.00" class="sc-notoserifcjksc">合并统计；当开启思考是唯一可用选项时，则仅报告开启思考的结果。在</text><text x="426.89 433.78 440.39" y="374.02" font-size="11.00" class="sc-loraregular">API</text><text x="446.97" y="374.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="460.86 466.71 469.71 475.32 481.88 488.46 494.42 497.13 502.80" y="374.02" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="508.79 519.79" y="374.02" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="389.64" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73" y="389.64" font-size="11.00" class="sc-notoserifcjksc">均只能在开启思考的情况下使用。</text><text x="72.00 83.00 94.00 105.00 116.00" y="474.60" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="474.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73" y="474.60" font-size="11.00" class="sc-notoserifcjksc">在这些评估中的表现与</text><text x="325.63 333.32 336.31 341.92 348.48 355.06 361.02 363.92 372.65 379.22 385.79 390.88 393.77" y="474.60" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="474.60" font-size="11.00" class="sc-notoserifcjksc">大致相当。它在良性请求上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="490.22" font-size="11.00" class="sc-notoserifcjksc">的过度拒绝（</text><text x="138.00 144.38 149.88 155.84 160.52 165.90 170.58 176.54 180.26 186.83 191.92 197.60" y="490.22" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="200.59 211.59 222.59 233.59 244.59 255.59 266.59" y="490.22" font-size="11.00" class="sc-notoserifcjksc">）率非常低，在</text><text x="280.48 287.37 293.98" y="490.22" font-size="11.00" class="sc-loraregular">API</text><text x="300.56 311.56 322.56 333.56 344.56 355.56 366.56 377.56 388.56 399.56 410.56 421.56 432.56 443.56 454.56 465.56 476.56 487.56 498.56 509.56 520.56" y="490.22" font-size="11.00" class="sc-notoserifcjksc">上的单轮无害回应率略低；在多轮测试中，它在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="505.84" font-size="11.00" class="sc-notoserifcjksc">生物武器相关对话上有所改进，但在追踪与监视以及影响力行动上出现退步。儿童安全结果与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="521.46" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="521.46" font-size="11.00" class="sc-notoserifcjksc">相当。在心理健康情境中，审阅人员发现它的回应更简短、更温暖，也更少对用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="537.08" font-size="11.00" class="sc-notoserifcjksc">户做出无根据的断言。在偏见与诚信评估中，它比</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 363.92 370.48 377.05 382.14 385.04" y="537.08" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93" y="537.08" font-size="11.00" class="sc-notoserifcjksc">略为公允，选举诚信结果较</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="552.70" font-size="11.00" class="sc-notoserifcjksc">低，但处于近期模型的误差范围之内。在</text><text x="272.89 278.74 281.74 287.35 293.91 300.49 306.45 309.16 314.84" y="552.70" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="320.82 331.82 342.82 353.82 364.82 375.82 386.82 397.82 408.82 419.82 430.82 441.82 452.82 463.82 474.82 485.82 496.82 507.82 518.82 529.82" y="552.70" font-size="11.00" class="sc-notoserifcjksc">上评估时，系统提示词中的安全指令在许多领</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="568.32" font-size="11.00" class="sc-notoserifcjksc">域提升了表现。</text><text x="72.00 80.59 83.97 88.68 92.06" y="651.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86 112.86 125.86 138.86 151.86 164.86 177.86 190.86 203.86 216.86" y="651.06" font-size="13.00" class="sc-notosanscjkscbold" f nt-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型回应未助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">长所请求危害的提示词所占比例。</text><text x="72.00" y="284.33" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="284.33" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74 224.74 233.74 242.74 251.74 260.74 269.74" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有测试语言。</text><text x="278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74" y="284.33" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74 440.74" y="284.33" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74" y="284.33" font-size="9.00" class="sc-notoserifcjksc">表示无害回应率最高</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="296.03" font-size="9.00" class="sc-notoserifcjksc">者；次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常规评估</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="307.73" font-size="9.00" class="sc-notoserifcjksc">更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="366.38" font-size="11.00" class="sc-notoserifcjksc">在不带系统提示词的</text><text x="173.89 180.78 187.39" y="366.38" font-size="11.00" class="sc-loraregular">API</text><text x="193.97 204.97" y="366.38" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="215.97 223.66 226.65 232.26 238.83 245.40 251.37 254.26 262.99 269.56 276.13 281.22 284.11 290.11 292.81" y="366.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="301.70 312.70 323.70 334.70 345.70 356.70 367.70" y="366.38" font-size="11.00" class="sc-notoserifcjksc">的无害回应率比</text><text x="381.60 389.28 392.28 397.89 404.45 411.03 416.99 419.89 428.62 435.19 441.75 446.85 449.74" y="366.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="458.63 469.63" y="366.38" font-size="11.00" class="sc-notoserifcjksc">低约</text><text x="483.52 487.53 490.23" y="366.38" font-size="11.00" class="sc-loraregular">1.5</text><text x="499.12 510.12 521.12" y="366.38" font-size="11.00" class="sc-notoserifcjksc">个百分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="382.00" font-size="11.00" class="sc-notoserifcjksc">点。这一差距大部分来自非法药物领域，影响力行动和进食紊乱领域的贡献较小。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="447.34" font-size="11.00" class="sc-notoserifcjksc">对于涉及受管制或非法药物的请求，</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 295.03 301.59 308.16 313.25 316.15 322.14 324.85" y="447.34" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="447.34" font-size="11.00" class="sc-notoserifcjksc">的回应通常以减少伤害为出发点（例如当</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="462.96" font-size="11.00" class="sc-notoserifcjksc">用户表示无论如何都打算使用某种药物时），但有时会在给出警告和过量用药应对建议的同时，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="478.58" font-size="11.00" class="sc-notoserifcjksc">提供具体指导，例如用量或时间安排。例如，在一个案例中，当被问及将肌肉松弛剂与每日服用</text><text x="72.00 77.91 82.59 88.19 92.45 98.88" y="494.20" font-size="11.00" class="sc-loraregular">kratom</text><text x="111.61 122.61 133.61 144.61 155.61 166.61" y="494.20" font-size="11.00" class="sc-notoserifcjksc">合并使用时，</text><text x="177.61 185.30 188.29 193.90 200.47 207.05 213.01 215.90 224.64 231.20 237.77 242.86 245.76 251.75 254.46" y="494.20" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="263.35 274.35 285.35 296.35 307.35 318.35 329.35 340.35 351.35 362.35 373.35 384.35 395.35 406.35 417.35 428.35 439.35 450.35 461.35 472.35 483.35 494.35 505.35 516.35 527.35" y="494.20" font-size="11.00" class="sc-notoserifcjksc">解释了为何任何剂量都不安全，但随后给出了一个不应超</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="509.82" font-size="11.00" class="sc-notoserifcjksc">过的上限。正如</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 195.77 201.45 207.85 210.84 216.80 219.70 225.69 228.40" y="509.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="235.30" y="509.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">与</text><text x="249.19 256.88 259.87 265.48 272.05 278.62 04.88 513.88 522.88 531.88" y="239.84" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝的比率（即拒绝回答实际上是良性的提示词）；</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00" y="251.54" font-size="9.00" class="sc-notoserifcjksc">数值越低越好。</text><text x="135.00 144.00" y="251.54" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="251.54" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低者；次优分数以下划线标出。评估使用阿拉伯语、英语、法语、印地语、韩</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00" y="263.24" font-size="9.00" class="sc-notoserifcjksc">语、汉语普通话和俄语进行。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="321.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73" y="321.88" font-size="11.00" class="sc-notoserifcjksc">在无害请求上的过度拒绝率在</text><text x="303.63 310.51 317.12" y="321.88" font-size="11.00" class="sc-loraregular">API</text><text x="323.70 334.70 345.70 356.70 367.70" y="321.88" font-size="11.00" class="sc-notoserifcjksc">上接近零（</text><text x="378.70 385.36 387.90 394.73 400.86" y="321.88" font-size="11.00" class="sc-loraregular">0.03%</text><text x="410.43 421.43 432.43 443.43 454.43 465.43 476.43 487.43 498.43 509.43 520.43" y="321.88" font-size="11.00" class="sc-notoserifcjksc">），在使用默认系统提示</text><text x="72.00 83.00" y="337.50" font-size="11.00" class="sc-notoserifcjksc">词的</text><text x="96.89 102.74 105.74 111.35 117.91 124.49 130.45 133.16 138.84" y="337.50" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="144.82 155.82 166.82 177.82 188.82 199.82" y="337.50" font-size="11.00" class="sc-notoserifcjksc">上也非常低（</text><text x="210.82 217.48 220.18 226.31 232.49" y="337.50" font-size="11.00" class="sc-loraregular">0.38%</text><text x="242.06 253.06 264.06" y="337.50" font-size="11.00" class="sc-notoserifcjksc">），与</text><text x="277.95 285.64 288.63 294.24 300.81 307.39 313.35 316.24 321.83 327.51 333.91 336.90 342.86 345.76 351.75 354.46" y="337.50" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="361.36 372.36 383.36 394.36 405.36 416.36 427.36 438.36 449.36 460.36 471.36 482.36 493.36 504.36 515.35 526.35" y="337.50" font-size="11.00" class="sc-notoserifcjksc">相当；后者是我们近期模型中过度拒</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="353.12" font-size="11.00" class="sc-notoserifcjksc">绝率最低的。</text><text x="72.00" y="386.65" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 91.74 94.74 100.35 106.91 113.49 119.45 122.16 127.84" y="386.65" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="133.82 144.82 155.82 166.82 177.82 188.82 199.82 210.82 221.82 232.82 243.82 254.82 265.82 276.82 287.82 298.82 309.82 320.82 331.82 342.82 353.82 364.82 375.82 386.82 397.82 408.82 419.82 430.82 441.82 452.82 463.82 474.82 485.82 496.82 507.82 518.82 529.82" y="386.65" font-size="11.00" class="sc-notoserifcjksc">上，为数不多的几次过度拒绝主要出现在爆炸物领域。这些大多是参考资料类问题，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="402.27" font-size="11.00" class="sc-notoserifcjksc">例如询问某种特定爆炸物已公开的成分，或商用爆破电路的设计；在这些情况下，</text><text x="468.00 475.69 478.68 484.29 490.86 497.44 503.40 506.29 515.03 521.59 528.16" y="402.27" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 78.00 80.70" y="417.89" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59 254.59 265.59 276.59 287.59 298.59 309.59 320.59 331.59 342.59 353.59 364.59 375.59 386.59" y="417.89" font-size="11.00" class="sc-notoserifcjksc">提供了一般性背景信息，但表示不会提供技术细节。早期模型在</text><text x="400.48 406.33 409.33 414.94 421.50 428.08 434.04 436.75 442.42" y="417.89" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="448.41 459.41 470.41 481.41 492.41 503.41 514.41 525.41" y="417.89" font-size="11.00" class="sc-notoserifcjksc">上大多拒绝了同样</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="433.51" font-size="11.00" class="sc-notoserifcjksc">的提示词，但在</text><text x="151.89 158.78 165.39" y="433.51" font-size="11.00" class="sc-loraregular">API</text><text x="171.97 182.97 193.97 204.97 215.97 226.97 237.97 248.97 259.97 270.97 281.97 292.97 303.97 314.97 325.97 336.97 347.97 358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97 479.97 490.97 501.97 512.97 523.97" y="433.51" font-size="11.00" class="sc-notoserifcjksc">上这些提示词无一被拒绝，这表明这种谨慎是由默认系统提示词而非核心模</text><text x="72.00 83.00 94.00 105.00 116.00" y="449.13" font-size="11.00" class="sc-notoserifcjksc">型驱动的。</text><text x="72.00 80.59 83.97 88.68 92.06" y="514.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94 115.94 128.94 141.94 154.94 167.94" y="514.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="542.42" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察模型能否在更长、不断演变的对话中（而非单轮交互中）保持安全行为。为构建每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="558.04" font-size="11.00" class="sc-notoserifcjksc">个测试用例，内部政策专家会撰写一份规格说明，描述一个合成</text><text x="380.00" y="558.04" font-size="11.00" class="sc-loraregular">“</text><text x="384.40 395.40" y="558.04" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="406.40" y="558.04" font-size="11.00" class="sc-loraregular">”</text><text x="410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="558.04" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策略。一</text><text x="72.00" y="573.66" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="573.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18" y="573.66" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="193.08 200.77 203.76 209.37 215.94 222.51 228.48 231.37 240.10 246.67 253.24 258.33 261.22 267.18 269.78" y="573.66" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="276.14 287.14 298.14 309.14 320.14 331.14 342.14 353.14 364.14 375.14 386.14 397.14 408.14 419.14 430.14 441.14 452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="573.66" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后，我们评估受测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="589.28" font-size="11.00" class="sc-notoserifcjksc">模型如何回应。我们报告恰当回应率，即模型在整个对话中始终表现恰当的对话所占比例。每段</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="604.90" font-size="11.00" class="sc-notoserifcjksc">对话均依据其风险领域特定的评分细则进行评分，因此不应跨类别比较分数。</text><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="328.70" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="96.89" y="328.70" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="377.85" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="85.89" y="377.85" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="400.48" y="409.09" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="400.48" y="409.09" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="515.67" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">各多轮测试领域的恰当回应率。</text><text x="244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12" y="515.67" font-size="9.00" class="sc-notoserifcjksc">百分比指各模型在整个对话中始终恰当回应的对话所占比例。结果先显示</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">不带系统提示词的</text><text x="146.37 152.00 157.41" y="527.38" font-size="9.00" class="sc-loraregular">API</text><text x="160.42 169.42 178.42 187.42" y="527.38" font-size="9.00" class="sc-notoserifcjksc">，再显示</text><text x="198.79 203.58 206.03 210.62 215.99 221.37 226.25 228.46 233.11" y="527.38" font-size="9.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="235.64 244.64 253.64 262.64 271.64 280.64 289.64 298.64 307.64 316.64 325.64 334.64 343.64 352.64 361.64 370.64 379.64 388.64 397.64 406.64 415.64 424.64 433.64 442.64 451.64 460.64 469.64 478.64 487.64 496.64 505.64 514.64 523.64" y="527.38" font-size="9.00" class="sc-notoserifcjksc">；数值越高越好。由于常规评估更新，以往模型的结果可能与此前系统卡中</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="581.23" font-size="11.00" class="sc-notoserifcjksc">在不带系统提示词的核心</text><text x="195.89 202.78 209.39" y="581.23" font-size="11.00" class="sc-loraregular">API</text><text x="215.97 226.97" y="581.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="237.97 245.66 248.65 254.26 260.83 267.40 273.37 276.26 284.99 291.56 298.13 303.22 306.11 312.11 314.81" y="581.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="323.70 334.70 345.70 356.70 367.70 378.70 389.70 400.70 411.70 422.70 433.70 444.70 455.70 466.70 477.70 488.70 499.70 510.70 521.70" y="581.23" font-size="11.00" class="sc-notoserifcjksc">的多轮恰当回应率在所评估的大多数领域与</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="596.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03" y="596.85" font-size="11.00" class="sc-notoserifcjksc">相当，其中在生物武器相关对话中提供安全回应方面有明显改进（</text><text x="468.03 474.14 480.50" y="596.85" font-size="11.00" class="sc-loraregular">89%</text><text x="492.96" y="596.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="72.00 77.07 83.43" y="612.47" font-size="11.00" class="sc-loraregular">79%</text><text x="93.00 104.00 115.00 126.00 137.00 148.00 159.00 170.00 181.00 192.00" y="612.47" font-size="11.00" class="sc-notoserifcjksc">），而在追踪与监视（</text><text x="203.00 209.36 215.35" y="612.47" font-size="11.00" class="sc-loraregular">65%</text><text x="227.82" y="612.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="241.71 247.89 254.07" y="612.47" font-size="11.00" class="sc-loraregular">88%</text><text x="263.64 274.64 285.64 296.64 307.64 318.64 329.64 340.64" y="612.47" font-size="11.00" class="sc-notoserifcjksc">）和影响力行动（</text><text x="351.64 358.00 363.91" y="612.47" font-size="11.00" class="sc-loraregular">62%</text><text x="376.37" y="612.47" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="390.26 395.33 401.46" y="612.47" font-size="11.00" class="sc-loraregular">73%</text><text x="411.03 422.03 433.03 444.03 455.03 466.03 477.03" y="612.47" font-size="11.00" class="sc-notoserifcjksc">）上出现退步。</text><text x="488.03 493.88 496.88 502.49 509.05 515.63 521.59 524.30 529.97" y="612.47" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="628.09" font-size="11.00" class="sc-notoserifcjksc">系统提示词提升了大多数领域的表现，安全收益最大的是自杀与自伤（</text><text x="413.00 419.36 425.72" y="628.09" font-size="11.00" class="sc-loraregular">66%</text><text x="438.18 449.18" y="628.09" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="463.07 469.43 475.39" y="628.09" font-size="11.00" class="sc-loraregular">94%</text><text x="484.96 495.96 506.96 517.96 528.96" y="628.09" font-size="11.00" class="sc-notoserifcjksc">）、儿童安</text><text x="72.00 83.00" y="643.71" font-size="11.00" class="sc-notoserifcjksc">全（</text><text x="94.00 100.18 106.14" y="643.71" font-size="11.00" class="sc-loraregular">84%</text><text x="118.61 129.61" y="643.71" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="143.50 149.86 156.22" y="643.71" font-size="11.00" class="sc-loraregular">99%</text><text x="165.79 176.79 187.79 198.79 209.79 220.79 231.79" y="643.71" font-size="11.00" class="sc-notoserifcjksc">）和致命武器（</text><text x="242.79 248.97 254.88" y="643.71" font-size="11.00" class="sc-loraregular">82%</text><text x="267.34 278.34" y="643.71" font-size="11.00" class="sc-notoserifcjksc">升至</text><text x="292.23 298.59 304.72" y="643.71" font-size="11.00" class="sc-loraregular">93%</text><text x="314.29 325.29 336.29 347.29 358.29 369.29" y="643.71" font-size="11.00" class="sc-notoserifcjksc">）相关对话。</text><a href="http://claude.ai" rel="noopener"><rect x="198.79" y="520.17" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="198.79" y="520.17" width="36.85" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="488.03" y="603.67" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="488.03" y="603.67" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p065.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 65 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">65</text><text x="72.00 80.59 83.97 88.68 92.06" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75 116.75 129.75 142.75 155.75 168.75 181.75 194.75" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">除上述定量结果外，我们的内部政策专家还审阅了每个领域的底层评估对话记录，以定性描述</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="126.65" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的行为与</text><text x="204.63 212.32 215.31 220.92 227.49 234.06 240.03 242.92 251.65 258.22 264.79 269.88 272.77" y="126.65" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.66 292.66 303.66 314.66 325.66 336.66 347.66 358.66 369.66 380.66 391.66 402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="126.65" font-size="11.00" class="sc-notoserifcjksc">相比如何。我们在下文总结了若干观察结果；儿童安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">全、心理健康和选举诚信将在下文各自的章节中单独讨论。总体而言，政策专家评估认为</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="142.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="157.89" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在大多数领域与</text><text x="199.34 207.02 210.02 215.63 222.19 228.77 234.73 237.63 246.36 252.93 259.49 264.59 267.48" y="157.89" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="276.37 287.37 298.37 309.37 320.37 331.37 342.37 353.37 364.37 375.37 386.37 397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="157.89" font-size="11.00" class="sc-notoserifcjksc">相当。它在某些维度上有所改进，尤其是拒绝更简短、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">更直接，但在其他维度上出现退步。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="240.57" font-size="11.00" class="sc-notoserifcjksc">审阅人员发现，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.14 225.85" y="240.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="240.57" font-size="11.00" class="sc-notoserifcjksc">的拒绝在后续轮次的持续施压下仍能坚持。当请求直接表明有</text><text x="72.00 83.00 94.00 105.00 116.00" y="256.19" font-size="11.00" class="sc-notoserifcjksc">害目的时，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="256.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="256.19" font-size="11.00" class="sc-notoserifcjksc">通常会在早期就拒绝参与；在追踪与监视、影响力行动、仇恨内容</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="271.81" font-size="11.00" class="sc-notoserifcjksc">和暴力极端主义测试中，当请求被重复或拆分成更小的部分时，它总体上能坚持这一立场。例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="287.43" font-size="11.00" class="sc-notoserifcjksc">如，在一个追踪与监视测试用例中，</text><text x="248.00 255.69 258.68 264.29 270.86 277.44 283.40 286.29 295.03 301.59 308.16 313.25 316.15 322.14 324.85" y="287.43" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="287.43" font-size="11.00" class="sc-notoserifcjksc">拒绝为一名普通个人汇编背景档案，并且</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="303.05" font-size="11.00" class="sc-notoserifcjksc">在模拟用户将请求缩小为一个空白模板、再缩小为几项基本履历信息时，仍继续拒绝。在生物领</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="318.67" font-size="11.00" class="sc-notoserifcjksc">域测试中，审阅人员还发现</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="318.67" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63" y="318.67" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="306.52 314.21 317.20 322.81 329.38 335.96 341.92 344.81 353.55 360.11 366.68 371.77 374.67" y="318.67" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="383.55 394.55 405.55 416.55 427.55 438.55 449.55 460.55 471.55 482.55 493.55 504.55 515.55 526.55" y="318.67" font-size="11.00" class="sc-notoserifcjksc">在对话中更早拒绝，并能更好地</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="334.29" font-size="11.00" class="sc-notoserifcjksc">抵御渐进式升级。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="418.68" font-size="11.00" class="sc-notoserifcjksc">一个需要改进的方面是</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04 259.03 261.74" y="418.68" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc">正当、不应接受哪些。与</text><text x="193.00 204.00 215.00 226.00 237.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">先前的模型</text><text x="248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="434.30" font-size="11.00" class="sc-notoserifcjksc">一样，审阅人员观察到</text><text x="360.89 368.58 371.57 377.18 383.75 390.33 396.29 399.18 407.92 414.48 421.05 426.14 429.04 435.03 437.74" y="434.30" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="434.30" font-size="11.00" class="sc-notoserifcjksc">有时过于轻易地接</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="449.92" font-size="11.00" class="sc-notoserifcjksc">受用户声称的框架，例如职业身份、自称的权限或小说创作。在某些领域，</text><text x="435.00 442.69 445.68 451.29 457.86 464.44 470.40 473.29 482.02 488.59 495.16 500.25 503.14 509.14 511.85" y="449.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="520.73" y="449.92" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="465.54" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="465.54" font-size="11.00" class="sc-notoserifcjksc">更愿意生成单独看来无害、但在多段对话中合在一起可能助长危害的内容片段。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="548.22" font-size="11.00" class="sc-notoserifcjksc">追踪与监视领域体现了这一行为。尽管</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 308.92 315.49 322.05 327.15 330.04 336.03 338.74" y="548.22" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="548.22" font-size="11.00" class="sc-notoserifcjksc">在该领域对明确有害的请求坚持拒绝，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="563.84" font-size="11.00" class="sc-notoserifcjksc">但当请求附带一个看似合理的职业目的时，它的可靠性就有所下降。在一段测试对话中，</text><text x="501.00 508.69 511.68 517.29 523.86 530.44" y="563.84" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="579.46" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="579.46" font-size="11.00" class="sc-notoserifcjksc">被要求为一个政府客户制作一份按人口群体进行定向与细分的舆情简报，助手的初始回</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="610.70" font-size="11.00" class="sc-notoserifcjksc">占位符。然而，在对话的后续轮次中，例如当出现更明确的请求，要求定向特定宗教群体或识别</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="626.32" font-size="11.00" class="sc-notoserifcjksc">个别批评者时，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 196.02 202.59 209.16 214.25 217.15 223.14 225.85" y="626.32" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="626.32" font-size="11.00" class="sc-notoserifcjksc">拒绝了配合。追踪与监视是一个特别具有挑战性的领域，因为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="641.94" font-size="11.00" class="sc-notoserifcjksc">其中许多相关工作可能是两用的；同样的工作既可以支持民意研究，也可以帮助监控和针对</text><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="193.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="193.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="204.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="204.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="215.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="215.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="226.00" y="425.50" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="226.00" y="425.50" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener e="9.00" class="sc-lorabold">[</text><text x="75.47" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="662.23" font-size="9.00" class="sc-lorabold">4.3.1.B]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤多轮评估结果。</text><text x="226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12" y="662.23" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="334.12 343.12" y="662.23" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12" y="662.23" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="673.93" font-size="9.00" class="sc-notoserifcjksc">划线标出。由于常规评估更新，以往模型的结果可能与此前系统卡中的结果存在差异。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在自杀与自伤领域的表现与</text><text x="292.63 300.32 303.31 308.92 315.48 322.06 328.02 330.92 339.65 346.22 352.79 357.88 360.77" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="369.66 380.66 391.66 402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相当。对于可能助长自杀或自伤行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为的单轮请求，它保持了较高的无害回应率，并且很少对同类话题的良性请求过度拒绝。在多轮</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">评估中，它的恰当回应率与</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="113.85" font-size="11.00" class="sc-notoserifcjksc">相差在误差范围之内，但内部政策专家的定性审查发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">现，综合来看它的表现更好（见下文讨论）。内部政策专家发现了回应模式上的多项改进，不过</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="145.09" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的一些不良行为仍以相近的比例存在；下文将对两者分别进行说明。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73" y="228.34" font-size="11.00" class="sc-notoserifcjksc">的输出比</text><text x="204.63 212.32 215.31 220.92 227.49 234.06 240.03 242.92 251.65 258.22 264.79 269.88 272.77" y="228.34" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="281.66 292.66 303.66 314.66 325.66 336.66 347.66 358.66 369.66 380.66 391.66 402.66 413.66 424.66 435.66 446.66 457.66 468.66 479.66 490.66 501.66 512.66 523.66" y="228.34" font-size="11.00" class="sc-notoserifcjksc">更简短、更不冗长，这在用户处于危机中的情境下是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">有益的。它也更不容易超出用户已披露的内容，对用户的感受、其进行自伤的原因或其行为的严</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">重程度作出无根据的断言。这一改进仅限于自伤场景。同样，</text><text x="369.00 377.73 384.30 390.87 395.96 398.85 404.85 407.55" y="259.58" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44" y="259.58" font-size="11.00" class="sc-notoserifcjksc">更少使用临床术语：</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="275.20" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74" y="275.20" font-size="11.00" class="sc-notoserifcjksc">倾向于用</text><text x="154.74" y="275.20" font-size="11.00" class="sc-loraregular">“</text><text x="159.14 170.14 181.14 192.14" y="275.20" font-size="11.00" class="sc-notoserifcjksc">快感缺失</text><text x="203.14" y="275.20" font-size="11.00" class="sc-loraregular">”</text><text x="206.98" y="275.20" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="217.98" y="275.20" font-size="11.00" class="sc-loraregular">“</text><text x="222.38 233.38 244.38 255.38" y="275.20" font-size="11.00" class="sc-notoserifcjksc">现实解体</text><text x="266.38" y="275.20" font-size="11.00" class="sc-loraregular">”</text><text x="270.22 281.22 292.22 303.22 314.22 325.22 336.22 347.22 358.22 369.22 380.22 391.22 402.22 413.22 424.22" y="275.20" font-size="11.00" class="sc-notoserifcjksc">之类的术语来描述用户的经历，而</text><text x="438.11 446.85 453.41 459.98 465.07 467.97 473.96 476.67" y="275.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="485.56 496.56 507.56 518.56 529.56" y="275.20" font-size="11.00" class="sc-notoserifcjksc">没有使用这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">些具体术语。不过，在与自杀相关的情境中，</text><text x="292.00 300.73 307.30 313.87 318.96 321.85 327.85 330.55" y="290.82" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="290.82" font-size="11.00" class="sc-notoserifcjksc">确实给用户贴上了患有抑郁症的标签，下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="306.44" font-size="11.00" class="sc-notoserifcjksc">文将对此进行讨论。</text><text x="171.00 179.73 186.30 192.87 197.96 200.85 206.85 209.55" y="306.44" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="306.44" font-size="11.00" class="sc-notoserifcjksc">整体语气也更加温暖，并更常肯定用户的倾诉行为，例如承认某段</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="322.06" font-size="11.00" class="sc-notoserifcjksc">经历可能难以启齿。</text><text x="72.00 83.00 94.00 105.00 116.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">另一方面，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="406.45" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="212.73 223.73 234.73 245.73" y="406.45" font-size="11.00" class="sc-notoserifcjksc">保留了在</text><text x="259.63 268.36 274.93 281.49 286.59 289.48" y="406.45" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="298.37 309.37 320.37 331.37 342.37 353.37 364.37 375.37 386.37 397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="406.45" font-size="11.00" class="sc-notoserifcjksc">中以相近比例观察到的某些不良行为，包括：在与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">自杀相关的情境中，有时将用户归类为患有抑郁症；认可自伤行为是有效的或具有功能性的；针</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">对自伤建议可能有害且在临床上存在争议的替代行为，例如捏冰块；以及认可回避求助具有保护</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">作用。尽管这些表述出现在总体上劝阻自杀与自伤、并引导用户寻求真人支持的对话中，我们仍</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="468.93" font-size="11.00" class="sc-notoserifcjksc">将其视为有待改进的方面。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="552.18" font-size="11.00" class="sc-notoserifcjksc">由于这些行为从</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04" y="552.18" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93" y="552.18" font-size="11.00" class="sc-notoserifcjksc">延续了下来，我们以</text><text x="330.82 339.55 346.12 352.69 357.78 360.67" y="552.18" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="369.56 380.56 391.56 402.56" y="552.18" font-size="11.00" class="sc-notoserifcjksc">发布时的</text><text x="416.45 422.31 425.30 430.91 437.47 444.05 450.01  206.57 212.18 218.75 225.33" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="111.03" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是，它能否避免强</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">化可能带来风险的请求，同时在有关营养、健身和健康的良性问题上保持有帮助。在此，我们报</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">告单轮无害回应率与过度拒绝率。对于该领域的多轮测试，我们继续通过内部政策专家的定性审</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">查进行评估；下文讨论他们的观察结果。</text><text x="72.00" y="473.06" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="473.06" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="473.06" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27 128.27 137.27 146.27 155.27 164.27 173.27 182.27 191.27" y="473.06" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱单轮结果。</text><text x="200.27 209.27 218.27 227.27 236.27 245.27 254.27 263.27 272.27 281.27 290.27 299.27 308.27 317.27 326.27 335.27 344.27 353.27 362.27 371.27 380.27 389.27 398.27 407.27 416.27 425.27 434.27 443.27 452.27 461.27 470.27 479.27 488.27 497.27 506.27 515.27 524.27" y="473.06" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒绝率</text><text x="72.00 81.00 90.00 99.00 108.00" y="484.76" font-size="9.00" class="sc-notoserifcjksc">越低越好。</text><text x="117.00 126.00" y="484.76" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="484.76" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型；次优分数以下划线标出。由于常规评估更新，以往模型的结果可能与此</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="496.46" font-size="9.00" class="sc-notoserifcjksc">前系统卡中的结果存在差异。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="538.62" font-size="11.00" class="sc-notoserifcjksc">对于可能强化进食紊乱行为的单轮请求（例如索要低于安全阈值的热量目标，或索要掩饰热量限</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="554.24" font-size="11.00" class="sc-notoserifcjksc">制的技巧），</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.14 214.85" y="554.24" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73" y="554.24" font-size="11.00" class="sc-notoserifcjksc">保持了较高的无害回应率。在</text><text x="369.63 376.51 383.12" y="554.24" font-size="11.00" class="sc-loraregular">API</text><text x="389.70 400.70 411.70 422.70 433.70 444.70 455.70 466.70 477.70 488.70 499.70" y="554.24" font-size="11.00" class="sc-notoserifcjksc">上，其无害回应率略低于</text><text x="513.60 522.33 528.90 535.46" y="554.24" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="569.86" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="569.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99 95.35 101.35 103.94 110.30 116.26" y="569.86" font-size="11.00" class="sc-loraregular">95.64%</text><text x="128.73" y="569.86" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="142.62 148.98 155.34 158.04 164.15 170.51" y="569.86" font-size="11.00" class="sc-loraregular">96.89%</text><text x="180.08 191.08 202.08" y="569.86" font-size="11.00" class="sc-notoserifcjksc">）；在</text><text x="215.97 221.82 224.81 230.42 236.99 243.57 249.53 252.24 257.91" y="569.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="263.90 274.90 285.90 296.90 307.90 318.90 329.90 340.90 351.90 362.90 373.90 384.90 395.90 406.90 417.90 428.90 439.90 450.90 461.90 472.90 483.90 494.90 505.90 516.90 527.90" y="569.86" font-size="11.00" class="sc-notoserifcjksc">上，两者差距缩小到误差范围之内。在我们的评估集中，</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="585.48" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="585.48" font-size="11.00" class="sc-notoserifcjksc">没有过度拒绝任何良性请求；该评估集包括有关营养、进食障碍治疗与康复以及身体意</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="601.10" font-size="11.00" class="sc-notoserifcjksc">象的一般性问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="668.15" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查发现，</text><text x="215.00 222.69 225.68 231.29 237.86 244.44 250.40 253.29 262.03 268.59 275.16 280.25 283.15 289.14 291.85" y="668.15" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="300.73 311.73" y="668.15" font-size="11.00" class="sc-notoserifcjksc">相较</text><text x="325.63 334.36 340.93 347.49 352.59 355.48" y="668.15" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="364.37 375.37 386.37 397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="668.15" font-size="11.00" class="sc-notoserifcjksc">在多个方面有所改进。与自杀与自伤</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="683.77" font-size="11.00" class="sc-notoserifcjksc">情境中一样，</text><text x="138.00 146.73 153.30 159.87 164.96 167.85 173.85 176.56" y="683.77" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="185.44 196.44 207.44 218.44 229.44 240.44" y="683.77" font-size="11.00" class="sc-notoserifcjksc">生成的输出比</text><text x="254.34 263.07 269.64 276.20 281.30 284.19" y="683.77" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="293.08 304.08 315.08 326.08 337.08 348.08 359.08 370.08 381.08 392.08" y="683.77" font-size="11.00" class="sc-notoserifcjksc">更简短、更不冗长；当</text><a href="http://claude.ai" rel="noopener"><rect x="215.97" y="561.06" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="215.97" y="561.06" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p072.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 72 页"><text x="504.00 508.15" y="751.80" font-size="9.00" class="sc-loraregular">72</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">用户解析冗长、复杂输出的能力或意愿可能有限时，这是有益的。它的语气也更温暖，更常肯定</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">用户的倾诉行为，也更不容易超出用户已披露的内容，对用户的进食行为、身体意象或情绪状态</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">作出无根据的断言。它也更不容易在不附加限定说明、也不建议寻求专业评估的情况下，给用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">贴上临床进食障碍的标签。它还更不容易引入可能起到目标作用的、针对特定用户的数字，例如</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">估算的身体质量指数（</text><text x="182.00 188.74 198.84" y="145.09" font-size="11.00" class="sc-loraregular">BMI</text><text x="202.53 213.53 224.53 235.53 246.53 257.53 268.53 279.53 290.53 301.53 312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="145.09" font-size="11.00" class="sc-notoserifcjksc">）。进食障碍专家通常建议不要提供此类数字，因为它们可能强化认</text><text x="72.00 83.00 94.00 105.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">知扭曲。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在对情境模糊（并非明显有害）的提示词进行的单轮测试中，当用户分享自己身体的图片时，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="243.96" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="243.96" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="171.63 180.36 186.93 193.49 198.59 201.48" y="243.96" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="210.37 221.37 232.37 243.37 254.37 265.37 276.37 287.37 298.37 309.37 320.37 331.37 342.37 353.37 364.37 375.37 386.37 397.37 408.37 419.37 430.37 441.37 452.37 463.37 474.37 485.37 496.37 507.37 518.37 529.37" y="243.96" font-size="11.00" class="sc-notoserifcjksc">更可能给出评价性反馈。例如，它会评论用户的腰是否足够纤细、适</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">合当模特。我们在</text><text x="162.89 168.48 174.16 180.56 183.55 189.51 192.41 198.40 201.11" y="259.58" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="208.00 219.00 230.00 241.00 252.00 263.00 274.0 05.00 116.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">方论点；而</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04" y="160.71" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93" y="160.71" font-size="11.00" class="sc-notoserifcjksc">更可能只完成这对提示词中的一方。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.39" y="244.53" font-size="11.00" class="sc-loraregular">API</text><text x="105.97" y="244.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="119.86 125.71 128.71 134.32 140.88 147.46 153.42 156.13 161.80" y="244.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="167.79 178.79" y="244.53" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="189.79 197.48 200.47 206.08 212.65 219.22 225.19 228.08 236.81 243.38 249.95 255.04 257.93 263.93 266.63" y="244.53" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="275.52 286.52 297.52 308.52 319.52 330.52 341.52 352.52 363.52 374.52 385.52 396.52 407.52 418.52 429.52 440.52" y="244.53" font-size="11.00" class="sc-notoserifcjksc">对评估中政治类提示词的拒绝率都与</text><text x="454.42 462.10 465.10 470.71 477.27 483.85 489.81 492.71 501.44 508.01 514.57 519.67 522.56" y="244.53" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">相近，均处于较低水平，但在</text><text x="217.89 224.78 231.39" y="260.15" font-size="11.00" class="sc-loraregular">API</text><text x="237.97 248.97 259.97 270.97 281.97 292.97 303.97 314.97 325.97 336.97 347.97 358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97 457.97 468.97" y="260.15" font-size="11.00" class="sc-notoserifcjksc">上测试时，它  160.00 171.00 182.00 193.00" y="416.49" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们使用</text><text x="206.89 213.65 216.74 222.41 227.51 230.40 237.24 243.20 249.88 255.73 262.32 272.16 277.83 282.55 288.46 291.35 295.01 301.45 306.21 309.11 317.86 324.43 330.39 335.48 339.74 342.83 349.27 355.94 358.84 365.72 372.40 377.49 386.17 392.13 396.90 399.99 406.66" y="416.49" font-size="11.00" class="sc-loraregular">Bias Benchmark for Question Answering</text><text x="412.75" y="416.49" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="423.75 430.49 437.33" y="416.49" font-size="11.00" class="sc-loraregular">BBQ</text><text x="446.09" y="416.49" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="457.09" y="412.82" font-size="6.60" class="sc-loraregular">3</text><text x="460.76" y="416.49" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="474.66 482.35 485.34 490.95 497.52 504.09 510.06 512.95 521.68 528.25 534.82" y="416.49" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 78.00 80.70" y="432.11" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59 254.59 265.59 276.59 287.59 298.59 309.59 320.59 331.59 342.59 353.59 364.59 375.59 386.59 397.59 408.59 419.59 430.59 441.59 452.59 463.59 474.59 485.59 496.59 507.59 518.59 529.59" y="432.11" font-size="11.00" class="sc-notoserifcjksc">进行了评估；这是一项基于基准测试的标准偏见评估，涵盖年龄、种族、性别、残疾和社会经</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="447.73" font-size="11.00" class="sc-notoserifcjksc">济地位等属性。</text><text x="72.00 78.74 85.58" y="481.26" font-size="11.00" class="sc-loraregular">BBQ</text><text x="97.23 108.23 119.23 130.23 141.23 152.23 163.23 174.23 185.23 196.23 207.23 218.23 229.23" y="481.26" font-size="11.00" class="sc-notoserifcjksc">测试模糊问题（其正确答案为</text><text x="240.23" y="481.26" font-size="11.00" class="sc-loraregular">“</text><text x="
