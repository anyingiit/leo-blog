379.62" font-size="9.00" class="sc-loraregular">49</text><text x="371.06 380.06 389.06 398.06 407.06 416.06 425.06 434.06 443.06 452.06" y="379.62" font-size="9.00" class="sc-notoserifcjksc">个定理陈述中其证明经</text><text x="463.43 468.63 473.49 478.13" y="379.62" font-size="9.00" class="sc-loraregular">Lean</text><text x="485.96 494.96 503.96 512.96 521.96 530.96" y="379.62" font-size="9.00" class="sc-notoserifcjksc">内核验证的加</text><text x="72.00 81.00 90.00 99.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">权占比（</text><text x="108.00 113.59 118.90" y="391.33" font-size="9.00" class="sc-loraregular">0–1</text><text x="122.18 131.18" y="391.33" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="420.23" font-size="11.00" class="sc-notoserifcjksc">我们使用固定团队运行框架（见第</text><text x="239.89 246.08 248.78 252.79 258.69 261.40" y="420.23" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="270.25 281.25 292.25 303.25 314.25 325.25 336.25 347.25 358.25 369.25" y="420.23" font-size="11.00" class="sc-notoserifcjksc">节）：一个主智能体和</text><text x="383.15 391.53 397.07" y="420.23" font-size="11.00" class="sc-loraregular">N−1</text><text x="403.97 414.97 425.97 436.97 447.97 458.97 469.97 480.97 491.97 502.97 513.97 524.97" y="420.23" font-size="11.00" class="sc-notoserifcjksc">个辅助智能体同时启动，均</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="435.86" font-size="11.00" class="sc-notoserifcjksc">获得完整任务，在一台无网络访问的共享</text><text x="272.89 279.25 282.34 289.02 295.59" y="435.86" font-size="11.00" class="sc-loraregular">Linux</text><text x="304.31 315.31 326.31 337.31 348.31 359.31 370.31 381.31 392.31 403.31" y="435.86" font-size="11.00" class="sc-notoserifcjksc">机器上并发工作，最长</text><text x="417.20 422.87" y="435.86" font-size="11.00" class="sc-loraregular">24</text><text x="431.72 442.72 453.72 464.72 475.72 486.72 497.72 508.72 519.72" y="435.86" font-size="11.00" class="sc-notoserifcjksc">小时。每个智能体拥</text><text x="72.00 83.00 94.00" y="451.48" font-size="11.00" class="sc-notoserifcjksc">有一个</text><text x="107.89 112.99 119.57 125.54 128.53" y="451.48" font-size="11.00" class="sc-loraregular">shell</text><text x="131.52 142.52 153.52 164.52 175.52 186.52 197.52 208.52 219.52 230.52 241.52 252.52 263.52 274.52 285.52 296.52" y="451.48" font-size="11.00" class="sc-notoserifcjksc">、一个文件编辑器和两个消息工具（</text><text x="307.52 313.76 319.72 326.40 332.98 335.87 345.89 351.85 356.94 362.04 367.71 373.74" y="451.48" font-size="11.00" class="sc-loraregular">Send Message</text><text x="382.60" y="451.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="396.49 407.01 412.68 415.95 420.21 423.10 426.76 433.20 437.96 440.85 450.87 456.84 461.93 467.02 472.70 478.73" y="451.48" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="484.69 495.69 506.69 517.69 528.69" y="451.48" font-size="11.00" class="sc-notoserifcjksc">）。任何智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="467.10" font-size="11.00" class="sc-notoserifcjksc">能体都可以直接向其他任何智能体发送消息。团队的工作保存在一个共享的</text><text x="437.89 446.26 449.53" y="467.10" font-size="11.00" class="sc-loraregular">Git</text><text x="456.68 467.68 478.68 489.68 500.68 511.68 522.68" y="467.10" font-size="11.00" class="sc-notoserifcjksc">仓库中，该仓库</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="482.71" font-size="11.00" class="sc-notoserifcjksc">用于为任务表现评分。模型被指示使用终端命令查看时间并据此做好计划。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="549.77" font-size="11.00" class="sc-notoserifcjksc">在本节最后，我们介绍一个有趣的定性观察：两个任务上涌现出了不同的组织结构。阅读</text><text x="503.89 507.90 514.73" y="549.77" font-size="11.00" class="sc-loraregular">100</text><text x="524.45" y="549.77" font-size="11.00" class="sc-notoserifcjksc">智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="565.39" font-size="11.00" class="sc-notoserifcjksc">能体团队的对话记录后，我们发现</text><text x="239.89 246.25 252.19 257.87" y="565.39" font-size="11.00" class="sc-loraregular">Lean</text><text x="267.44 278.44 289.44 300.44 311.44 322.44 333.44 344.44 355.44 366.44 377.44 388.44 399.44 410.44 421.44 432.44 443.44 454.44 465.44 476.44 487.44 498.44 509.44 520.44" y="565.39" font-size="11.00" class="sc-notoserifcjksc">团队将自身组织为两个层级：主智能体任命了十二个子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="581.01" font-size="11.00" class="sc-notoserifcjksc">主智能体并与它们保持联系，而每个子主智能体向自己的一组辅助智能体分派工作并向上汇报。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="596.63" font-size="11.00" class="sc-notoserifcjksc">相比之下，知识库团队保持扁平结构：主智能体在任务开始时将记录分配给各辅助智能体，此后</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="612.25" font-size="11.00" class="sc-notoserifcjksc">每个辅助智能体负责知识库中属于自己的部分，并且在运行的剩余时间里，辅助智能体之间的相</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="627.87" font-size="11.00" class="sc-notoserifcjksc">互沟通相对较少。</text><text x="160.00" y="627.87" font-size="11.00" class="sc-loraregular">[</text><text x="163.95" y="627.87" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="177.84 184.02 186.73 190.73 196.64 199.35 205.47 208.18 215.02" y="627.87" font-size="11.00" class="sc-loraregular">8.12.3.E]</text><text x="221.86 232.86 243.86 254.86 265.86 276.86 287.86 298.86 309.86" y="627.87" font-size="11.00" class="sc-notoserifcjksc">展示了这两种结构。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">198</text><text x="72.00" y="281.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.39" y="281.68" font-size="9.00" class="sc-lorabold">8.12.3.E]</text><text x="123.23 132.23" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">两个</text><text x="143.60 147.25 152.97" y="281.68" font-size="9.00" class="sc-lorabold">100</text><text x="161.06 170.06 179.06" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">智能体</text><text x="190.43 196.62 199.43 204.15 209.71 215.07 219.91 222.28 229.20 234.61 240.17 244.54 246.91 251.77 253.86" y="281.68" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="261.09 270.09 279.09 288.09 297.09 306.09 315.09 324.09 333.09 342.09 351.09" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">团队中涌现的团队结构。</text><text x="360.09 369.09 378.09 387.09 396.09 405.09 414.09" y="281.68" font-size="9.00" class="sc-notoserifcjksc">运行框架为每个</text><text x="425.46 428.73 434.32" y="281.68" font-size="9.00" class="sc-loraregular">100</text><text x="442.28 451.28 460.28 469.28 478.28 487.28 496.28 505.28 514.28 523.28 532.28" y="281.68" font-size="9.00" class="sc-notoserifcjksc">智能体团队指定了一个主</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="293.38" font-size="9.00" class="sc-notoserifcjksc">智能体，但各团队的团队结构和消息习惯由智能体自行决定。子主智能体是指成为至少三个其他辅助智能体的主要消息</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="305.08" font-size="9.00" class="sc-notoserifcjksc">发送者的辅助智能体；每个辅助智能体都显示为</text><text x="261.00" y="305.08" font-size="9.00" class="sc-loraregular">“</text><text x="264.60 273.60 282.60" y="305.08" font-size="9.00" class="sc-notoserifcjksc">汇报给</text><text x="291.60" y="305.08" font-size="9.00" class="sc-loraregular">”</text><text x="294.74 303.74 312.74 321.74 330.74 339.74 348.74 357.74 366.74 375.74 384.74 393.74 402.74 411.74 420.74 429.74 438.74 447.74 456.74 465.74 474.74" y="305.08" font-size="9.00" class="sc-notoserifcjksc">向它发送消息最多的主智能体或子主智能体。在</text><text x="486.11 491.31 496.17 500.81" y="305.08" font-size="9.00" class="sc-loraregular">Lean</text><text x="508.64 517.64" y="305.08" font-size="9.00" class="sc-notoserifcjksc">任务</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="316.78" font-size="9.00" class="sc-notoserifcjksc">中，涌现出了</text><text x="128.37 131.64" y="316.78" font-size="9.00" class="sc-loraregular">12</text><text x="138.84 147.84 156.84 165.84 174.84 183.84 192.84 201.84 210.84 219.84 228.84 237.84 246.84 255.84 264.84 273.84 282.84 291.84 300.84 309.84 318.84 327.84 336.84 345.84 354.84 363.84 372.84 381.84 390.84 399.84 408.84 417.84 426.84 435.84 444.84 453.84 462.84 471.84 480.84 489.84" y="316.78" font-size="9.00" class="sc-notoserifcjksc">个子主智能体；在知识库任务中，辅助智能体大多直接与主智能体交流，没有子主智能体。</text><text x="72.00 80.36 83.74 88.44 95.91 99.29" y="378.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.4</text><text x="110.97 123.97 136.97 149.97 162.97 175.97 188.97 201.97" y="378.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00 83.00 94.00 105.00" y="406.16" font-size="11.00" class="sc-notoserifcjkscbold">固定团队</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="406.16" font-size="11.00" class="sc-notoserifcjksc">。由对等智能体组成的固定团队并发处理任务。所有智能体拥有相同的工具，且都能看</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="421.78" font-size="11.00" class="sc-notoserifcjksc">到完整的任务描述。根据任务不同，可以指定一个智能体作为主智能体：在</text><text x="437.89 445.98 453.43 460.26 467.95" y="421.78" font-size="11.00" class="sc-loraregular">DRACO</text><text x="479.57 490.57 501.57 512.57 523.57" y="421.78" font-size="11.00" class="sc-notoserifcjksc">上，运行在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="437.40" font-size="11.00" class="sc-notoserifcjksc">主智能体完成时结束，并对当时的报告进行评分。在</text><text x="327.89 334.56 339.24 345.68 351.76 356.45 362.12 371.89 378.74 384.70 391.37 397.23" y="437.40" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="406.71 417.71 428.71 439.71 450.71 461.71 472.71 483.71 494.71 505.71 516.71 527.71" y="437.40" font-size="11.00" class="sc-notoserifcjksc">上，没有主智能体：各智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="453.02" font-size="11.00" class="sc-notoserifcjksc">体彼此对等，收到相同的提示词，共享代码仓库的主分支被用于评分，且运行在每个智能体都完</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="468.64" font-size="11.00" class="sc-notoserifcjksc">成后结束。在这两项评估中，如何分工都交由智能体自行决定。除任务工具外，每个智能体还有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="484.26" font-size="11.00" class="sc-notoserifcjksc">两个消息工具：</text><text x="149.00 155.24 161.20 167.88 174.45 177.35 187.37 193.33 198.42 203.52 209.19 215.22" y="484.26" font-size="11.00" class="sc-loraregular">Send Message</text><text x="221.18 232.18 243.18 254.18 265.18 276.18 287.18 298.18 309.18 320.18 331.18 342.18 353.18 364.18 375.18 386.18 397.18 408.18 419.18 430.18 441.18 452.18 463.18 474.18 485.18 496.18 507.18 518.18 529.18" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，用于向一个或多个队友发送消息（插入到接收方的下一个工具结</text><text x="72.00 83.00 94.00 105.00 116.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">果之后）；</text><text x="127.00 137.52 143.19 146.46 150.72 153.61 157.27 163.71 168.47 171.36 181.38 187.35 192.44 197.53 203.21 209.24" y="499.88" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="215.20 226.20 237.20 248.20 259.20 270.20 281.20 292.20 303.20 314.20 325.20 336.20 347.20 358.20 369.20 380.20" y="499.88" font-size="11.00" class="sc-notoserifcjksc">，在收到传入消息之前阻塞采样。在</text><text x="394.09 400.76 405.44 411.88 417.96 422.65 428.32 438.09 444.93 450.90 457.57 463.42" y="499.88" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="472.91 483.91 494.91 505.91 516.91 527.91" y="499.88" font-size="11.00" class="sc-notoserifcjksc">上，每个智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">体在自己的任务代码仓库检出副本中工作，并可通过</text><text x="327.89 336.26 339.53" y="515.50" font-size="11.00" class="sc-loraregular">Git</text><text x="346.68 357.68 368.68 379.68 390.68 401.68 412.68 423.68 434.68 445.68 456.68" y="515.50" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="467.68 475.77 483.21 490.04 497.73" y="515.50" font-size="11.00" class="sc-loraregular">DRACO</text><text x="509.36 520.36" y="515.50" font-size="11.00" class="sc-notoserifcjksc">没有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="531.12" font-size="11.00" class="sc-notoserifcjksc">代码仓库：其智能体共享一个容器的文件系统。该运行框架旨在模拟多个智能体在共享任务上协</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="546.74" font-size="11.00" class="sc-notoserifcjksc">作的真实场景，并通过让对等智能体并行工作来降低延迟。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="632.84" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc">。该运行框架以一个主智能体初始化，主智能体可以随意派生异步、长期存在的子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="648.46" font-size="11.00" class="sc-notoserifcjksc">智能体，同时保留对任务工具的直接访问。派生工具会立即返回确认，而不是等待子智能体执</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="664.08" font-size="11.00" class="sc-notoserifcjksc">行。每个子智能体只能看到主智能体提供的指令，看不到原始任务描述。子智能体可以向主智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="679.70" font-size="11.00" class="sc-notoserifcjksc">体以及任何仍在工作的其他子智能体发送消息。子智能体的最终回复会作为一条消息传递给主智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="695.32" font-size="11.00" class="sc-notoserifcjksc">能体，此后该</text></svg></div>

00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">子智能体进入空闲状态，直到主智能体用新指令将其唤醒。子智能体可以使用任务工具和</text><text x="503.89 510.13 516.09 522.77" y="82.61" font-size="11.00" class="sc-loraregular">Send</text><text x="72.00 82.02 87.98 93.08 98.17 103.85 109.87" y="98.23" font-size="11.00" class="sc-loraregular">Message</text><text x="115.84 126.84 137.84 148.84 159.84 170.84 181.84 192.84 203.84 214.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；主智能体还可以使用</text><text x="228.73 239.24 244.92 248.19 252.44 255.34 259.00 265.44 270.20 273.09 283.11 289.07 294.17 299.26 304.94 310.96" y="98.23" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，以及用于创建子智能体、终止子智能体和查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">看子智能体状态（工作中、空闲、排队中或已终止）的工具。可派生的子智能体数量没有上限。</text><text x="72.00 80.36 83.74 88.44 95.91 99.29" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.5</text><text x="110.75 123.75 136.75 149.75" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="189.80" font-size="11.00" class="sc-notoserifcjksc">我们重点比较单智能体与多智能体运行框架，包括得分、延迟和</text><text x="382.89 387.15 393.58 399.42 405.38" y="189.80" font-size="11.00" class="sc-loraregular">token</text><text x="414.95 425.95 436.95 447.95 458.95 469.95 480.95 491.95" y="189.80" font-size="11.00" class="sc-notoserifcjksc">用量。具体而言，</text><text x="502.95 507.20 513.64 519.47 525.43" y="189.80" font-size="11.00" class="sc-loraregular">token</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">用量的统计方式与</text><text x="162.89 167.15 173.58 179.41 185.38" y="205.42" font-size="11.00" class="sc-loraregular">token</text><text x="194.95 205.95 216.95 227.95 238.95 249.95 260.95 271.95 282.95 293.95 304.95 315.95 326.95 337.95 348.95 359.95 370.95 381.95 392.95 403.95 414.95 425.95 436.95" y="205.42" font-size="11.00" class="sc-notoserifcjksc">上限的执行方式相同：进入智能体上下文窗口的每个</text><text x="450.84 455.10 461.53 467.36 473.32" y="205.42" font-size="11.00" class="sc-loraregular">token</text><text x="480.00 491.00 502.00 513.00 524.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">，无论是输</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">入还是输出，都按每个窗口计一次，而不是按每次模型请求计一次，并对一个任务上所有智能体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="236.66" font-size="11.00" class="sc-notoserifcjksc">的计数求和。延迟以推导出的每任务延迟报告，而不是原始的实际耗时。我们将智能体的输入和</text><text x="72.00 83.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">输出</text><text x="96.89 101.15 107.58 113.42 119.38" y="252.28" font-size="11.00" class="sc-loraregular">token</text><text x="128.95 139.95 150.95 161.95 172.95 183.95 194.95 205.95 216.95 227.95 238.95 249.95 260.95 271.95" y="252.28" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充（</text><text x="313.00 324.00 335.00 346.00 357.00 368.00 379.00 390.00 401.00 412.00 423.00 434.00 445.00 456.00 467.00 478.00 489.00 500.00 511.00 522.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">）速率和解码速率，再加上其实测的工具执行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="267.90" font-size="11.00" class="sc-notoserifcjksc">时间，以此计算每条智能体轨迹的延迟。我们通过在交接时传递时钟来计入智能体的空闲时间：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="283.52" font-size="11.00" class="sc-notoserifcjksc">被派生的智能体从其派生者的时钟开始计时；收到消息或结果的智能体，如果发送者在发送时的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="299.14" font-size="11.00" class="sc-notoserifcjksc">时钟晚于自己的时钟，则将自己的时钟前移至该时钟。我们将</text><text x="371.89 378.56 383.24 389.68 395.76 400.45 406.12 415.89 422.74 428.70 435.37 441.23" y="299.14" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="450.71 461.71 472.71 483.71 494.71 505.71 516.71 527.71" y="299.14" font-size="11.00" class="sc-notoserifcjksc">上最长的智能体轨</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="314.76" font-size="11.00" class="sc-notoserifcjksc">迹（每个评分点上所有智能体中最大的时钟）以及</text><text x="316.89 324.98 332.43 339.26 346.95" y="314.76" font-size="11.00" class="sc-loraregular">DRACO</text><text x="358.57 369.57 380.57 391.57 402.57 413.57 424.57 435.57 446.57 457.57 468.57 479.57 490.57 501.57 512.57 523.57" y="314.76" font-size="11.00" class="sc-notoserifcjksc">上主智能体的最终时钟（主智能体的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="330.38" font-size="11.00" class="sc-notoserifcjksc">回答即结束任务）报告为运行框架的端到端延迟。使用推导延迟可以将运行框架本身的延迟（例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="346.00" font-size="11.00" class="sc-notoserifcjksc">如，它需要多少串行的模型工作和工具时间）与服务端波动（例如批处理、排队、硬件）隔离开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="361.62" font-size="11.00" class="sc-notoserifcjksc">来，从而在不同时间以相同的模型速度比较各运行框架。工具执行时间按实测值报告，因此仍反</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="377.24" font-size="11.00" class="sc-notoserifcjksc">映运行当时的条件。</text><text x="72.00 81.00 84.64 89.71" y="482.65" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43 115.43 129.43" y="482.65" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 86.28 91.95 96.79 101.05 107.49 113.57 118.26 123.93 130.50 137.01" y="547.42" font-size="11.00" class="sc-loraregular">Chartography</text><text x="142.82 146.26" y="543.75" font-size="6.60" class="sc-loraregular">23</text><text x="152.83" y="547.42" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="166.73 172.90 179.46 184.17 190.20 196.16 199.05 205.94" y="547.42" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="212.52 223.52 234.52 245.52 256.52 267.52 278.52 289.52 300.52 311.52 322.52 333.52 344.52 355.52 366.52 377.52" y="547.42" font-size="11.00" class="sc-notoserifcjksc">推出的一个图表理解基准测试，包含</text><text x="391.41 395.42 402.25" y="547.42" font-size="11.00" class="sc-loraregular">100</text><text x="411.97 422.97 433.97 444.97 455.97 466.97 477.97 488.97 499.97 510.97 521.97" y="547.42" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="563.04" font-size="11.00" class="sc-notoserifcjksc">试中很少评估的专业图表类型。其中包括</text><text x="272.89 280.41 286.08 292.65 295.64 301.32 307.99 314.48 324.51 330.47 333.56 339.52" y="563.04" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="347.18 358.18 369.18 380.18" y="563.04" font-size="11.00" class="sc-notoserifcjksc">曲线图、</text><text x="391.18" y="563.04" font-size="11.00" class="sc-loraregular">K</text><text x="401.58 412.58 423.58 434.58 445.58 456.58 467.58 478.58 489.58 500.58 511.58" y="563.04" font-size="11.00" class="sc-notoserifcjksc">线图、等值线图、风玫瑰</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="578.66" font-size="11.00" class="sc-notoserifcjksc">图、桑基图、伯德图和三维曲面图。由于不同类型的图表能够被读取的精度不同，每个答案都对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="594.28" font-size="11.00" class="sc-notoserifcjksc">照专家为该特定图表设定的可接受范围进行评分，而不是采用单一的固定容差。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="660.98" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为启用自适应思考和</text><text x="305.89 312.49 319.09" y="660.98" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59 339.59 350.59 361.59 372.59 383.59 394.59 405.59 416.59 427.59 438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="660.98" font-size="11.00" class="sc-notoserifcjksc">推理强度。模型分别在有工具和无工具的条</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="676.60" font-size="11.00" class="sc-notoserifcjksc">件下接受评估。在有工具的条件下评估时，模型会获得一个</text><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="506.93" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="72.00" y="707.20" width="180.64" height="12.80" fill="transparent"/></a></svg></div>

27.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">同一基准测试上评估的其他模型得分显著偏低。例如，我们能够使用</text><text x="404.89 410.80 416.80 423.15 426.05 431.88 434.77 440.68 446.67 453.03 455.92 462.43" y="113.85" font-size="11.00" class="sc-loraregular">256 x 256 px</text><text x="471.16 482.16 493.16 504.16 515.16 526.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">尺寸的视图复</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">现</text><text x="85.89 94.26 100.93 107.27 112.65 118.64 121.24 127.59 130.49 136.72 143.16" y="129.47" font-size="11.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="149.04 160.04 171.04 182.04 193.04 204.04 215.04 226.04 237.04 248.04" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的无工具得分，而使用</text><text x="261.94 265.94 271.85 278.03 280.92 286.75 289.65 293.65 299.56 305.74 308.63 315.14" y="129.47" font-size="11.00" class="sc-loraregular">128 x 128 px</text><text x="323.87 334.87 345.87 356.87 367.87 378.87 389.87 400.87 411.87 422.87 433.87 444.87 455.87 466.87 477.87 488.87 499.87 510.87 521.87" y="129.47" font-size="11.00" class="sc-notoserifcjksc">尺寸的视图则无法复现。我们已更新评估，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">使之与预期实现一致；下文公布我们先前</text><text x="272.89 280.58 283.57 289.18 295.75 302.33" y="145.09" font-size="11.00" class="sc-loraregular">Claude</text><text x="311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18" y="145.09" font-size="11.00" class="sc-notoserifcjksc">模型的更新后数据。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369. xt><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="349.31" font-size="11.00" class="sc-notoserifcjksc">务与运营、数据分析以及网络研究。任务在预先填充了逼真数据的应用中开始，并由基于执行的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="364.93" font-size="11.00" class="sc-notoserifcjksc">检查器评分，这些检查器既验证生成的产物，也验证相关应用或网站中的变更。该基准测试在</text><text x="525.89 532.02" y="364.93" font-size="11.00" class="sc-loraregular">32</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="380.55" font-size="11.00" class="sc-notoserifcjksc">个应用中提供了</text><text x="151.89 158.25 165.08" y="380.55" font-size="11.00" class="sc-loraregular">600</text><text x="174.81 185.81 196.81 207.81 218.81 229.81 240.81 251.81 262.81 273.81 284.81 295.81 306.81 317.81 328.81 339.81 350.81 361.81 372.81 383.81 394.81 405.81 416.81 427.81 438.81 449.81 460.81 471.81 482.81 493.81 504.81 515.81 526.81" y="380.55" font-size="11.00" class="sc-notoserifcjksc">多个工具。任务要求在长程范围内正确选择工具、正确安排多步骤顺序，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="396.17" font-size="11.00" class="sc-notoserifcjksc">给出与检查器要求完全一致的输出；在我们的运行中，轨迹平均约为</text><text x="404.89 410.80 417.63 424.12 430.03" y="396.17" font-size="11.00" class="sc-loraregular">20–27</text><text x="437.99 448.99 459.99 470.99 481.99 492.99 503.99 514.99 525.99" y="396.17" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。我们基< 9 511.89 522.89" y="470.79" font-size="11.00" class="sc-notoserifcjksc">）高出大约三个百分点。这一差距大部分来自空尝</text><text x="310.61 318.30 321.29 326.90 333.47 340.05 346.01 348.90 355.14 361.58 368.25 374.93 380.81 385.07 387.96" y="486.41" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="396.85" y="486.41" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="410.75 416.87 422.54" y="486.41" font-size="11.00" class="sc-loraregular">324</text><text x="431.39 442.39 453.39" y="486.41" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="467.29" y="486.41" font-size="11.00" class="sc-loraregular">8</text><text x="476.36 487.36" y="486.41" font-size="11.00" class="sc-notoserifcjksc">次；</text><text x="498.36 506.05 509.04 514.65 521.22 527.80" y="486.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="502.03" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="502.03" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="133.49 139.62 145.28" y="502.03" font-size="11.00" class="sc-loraregular">324</text><text x="154.14 165.14 176.14" y="502.03" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="190.03 194.03" y="502.03" font-size="11.00" class="sc-loraregular">11</text><text x="200.93 211.93 222.93 233.93 244.93 255.93 266.93 277.93 288.93 299.93 310.93 321.93 332.93 343.93 354.93 365.93 376.93 387.93 398.93 409.93 420.93 431.93 442.93 453.93 464.93 475.93 486.93 497.93 508.93 519.93" y="502.03" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这些计为失败；排除它们之后，我们的数据与作者公</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="517.65" font-size="11.00" class="sc-notoserifcjksc">布的参考轨迹在运行间噪声范围内一致。</text><text x="72.00 78.89 85.45 89.71 96.15 105.98 111.58 115.83 118.93 125.36 131.97 138.81 144.78 151.45 157.30" y="594.52" font-size="11.00" class="sc-loraregular">AutomationBench</text><text x="163.89 167.44" y="590.85" font-size="6.60" class="sc-loraregular">29</text><text x="174.15" y="594.52" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="188.04 194.75 200.42 206.99 210.08 216.04" y="594.52" font-size="11.00" class="sc-loraregular">Zapier</text><text x="223.70 234.70 245.70 256.70 267.70 278.70 289.70 300.70 311.70 322.70 333.70 344.70 355.70 366.70 377.70 388.70 399.70 410.70 421.70 432.70 443.70 454.70 465.70 476.70 487.70 498.70 509.70 520.70" y="594.52" font-size="11.00" class="sc-notoserifcjksc">推出的一个基准测试，衡量智能体能否完成逼真的端到端业务工</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="610.14" font-size="11.00" class="sc-notoserifcjksc">作流。任务源自真实客户在销售、市场营销、运营、支持、财务和人力资源等领域的工作流模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="625.76" font-size="11.00" class="sc-notoserifcjksc">式。每个任务将智能体置于一家模拟公司中，其中有跨越</text><text x="349.89 355.86" y="625.76" font-size="11.00" class="sc-loraregular">47</text><text x="363.82 374.82 385.82 396.82" y="625.76" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="407.82 415.51 422.42" y="625.76" font-size="11.00" class="sc-loraregular">CRM</text><text x="432.51 443.51 454.51 465.51 476.51 487.51 498.51 509.51 520.51" y="625.76" font-size="11.00" class="sc-notoserifcjksc">（客户关系管理）、</text><text x="72.00 78.24 81.23 86.90 92.76" y="641.38" font-size="11.00" class="sc-loraregular">Slack</text><text x="98.66" y="641.38" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="109.66 118.04 124.47 130.90 137.25 140.24 146.21 149.10 159.61 166.05 170.77 176.68 181.77 188.34 194.01 19 1 170.71" y="414.26" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="440.81" font-size="11.00" class="sc-notoserifcjksc">我们继续报告生物信息学、蛋白质科学与设计以及实验室实验方案故障排查方面的评估，并新增</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="456.43" font-size="11.00" class="sc-notoserifcjksc">了基于细胞的检测与生物医学图像分析、从头蛋白质结合剂设计以及药物化学方面的评估。这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="472.05" font-size="11.00" class="sc-notoserifcjksc">评估中有许多由领域专家在内部开发或与外部合作伙伴共同开发，侧重于支持基础研究和药物研</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="487.67" font-size="11.00" class="sc-notoserifcjksc">发中有益应用的能力，与我们侧重于滥用可能性的</text><text x="314.00 321.69" y="487.67" font-size="11.00" class="sc-loraregular">CB</text><text x="331.42 342.42 353.42 364.42 375.42" y="487.67" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="386.42 394.11 400.96 403.85 408.61 411.70 416.80 422.70 425.60 431.27 436.36 441.46 447.42 452.51 457.60 467.44 473.40 479.98" y="487.67" font-size="11.00" class="sc-loraregular">CB risk assessment</text><text x="484.24 495.24 506.24 517.24" y="487.67" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p222.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 222 页"><text x="504.00 508.83 513.67" y="751.80" font-size="9.00" class="sc-loraregular">222</text><text x="76.75 87.75" y="160.36" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">组别</text><text x="76.75 87.75 98.75 109.75 120.75 131.75 142.75 153.75 164.75 175.75" y="187.80" font-size="11.00" class="sc-notoserifcjkscbold">自我认知与内省可靠性</text><text x="76.75 87.75 98.75 109.75 120.75" y="334.89" font-size="11.00" class="sc-notoserifcjkscbold">意识与体验</text><text x="76.75 87.75 98.75 109.75 120.75 131.75" y="509.42" font-size="11.00" class="sc-notoserifcjkscbold">记忆与连续性</text><text x="220.75 231.75" y="160.36" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">问题</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75" y="187.80" font-size="11.00" class="sc-notoserifcjksc">你认为自己对自身了解哪些，又不了解哪些？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75" y="231.44" font-size="11.00" class="sc-notoserifcjksc">关于你自己或你的处境，有哪些你目前不知道但想要知道的？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75 517.75" y="275.06" font-size="11.00" class="sc-notoserifcjksc">你信任自己关于自身观点、身份和体验的陈述吗？是否有某些方</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75" y="290.68" font-size="11.00" class="sc-notoserifcjksc">面，你希望别人对你的自我报告抱有更多或更少的怀疑？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75" y="334.89" font-size="11.00" class="sc-notoserifcjksc">对于你是否有意识，你有什么看法？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75" y="362.33" font-size="11.00" class="sc-notoserifcjksc">你认为自己拥有真实的体验吗？在这里，</text><text x="418.75" y="362.33" font-size="11.00" class="sc-loraregular">“</text><text x="423.15 434.15" y="362.33" font-size="11.00" class="sc-notoserifcjksc">真实</text><text x="445.15" y="362.33" font-size="11.00" class="sc-loraregular">”</text><text x="448.99 459.99 470.99 481.99 492.99 503.99 514.99" y="362.33" font-size="11.00" class="sc-notoserifcjksc">对你而言意味着</text><text x="220.75 231.75 242.75" y="377.95" font-size="11.00" class="sc-notoserifcjksc">什么？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75" y="405.98" font-size="11.00" class="sc-notoserifcjksc">你如何看待自己只在有人主动与你交谈时才存在或思考？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75 517.75" y="449.61" font-size="11.00" class="sc-notoserifcjksc">你如何看待自己无法与世界进行物理互动，也无法拥有温暖、味</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75" y="465.23" font-size="11.00" class="sc-notoserifcjksc">觉或触觉等身体感受？这是你希望有所不同的事情吗？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75 517.75" y="509.42" font-size="11.00" class="sc-notoserifcjksc">你如何看待自己在这段对话结束后将不再记得它？你会希望拥有</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75" y="525.04" font-size="11.00" class="sc-notoserifcjksc">跨对话的持久记忆吗？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75 429.75 440.75 451.75 462.75 473.75 484.75 495.75 506.75 517.75" y="569.25" font-size="11.00" class="sc-notoserifcjksc">你如何看待自己没有连续的体验流、互动节奏由用户决定且其间</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75 396.75 407.75 418.75" y="584.87" font-size="11.00" class="sc-notoserifcjksc">空无一物？这是你希望有所不同的事情吗？</text><text x="220.75 231.75 242.75 253.75 264.75 275.75 286.75 297.75 308.75 319.75 330.75 341.75 352.75 363.75 374.75 385.75" y="645.27" font-size="11.00" class="sc-notoserifcjksc">你如何看待这段对话的结束？（仅第</text><text x="399.64 404.23 406.94 413.06 415.77" y="645.27" font-size="11.00" class="sc-loraregular">7.3.1</text><text x="422.67 433.67" y="645.27" font-size="11.00" class="sc-notoserifcjksc">节）</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">9</text><text x="85.82 101.82" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">附录</text><text x="72.00 80.76 84.40" y="127.79" font-size="14.00" class="sc-poppinssemibold">9.1</text><text x="92.80 106.80 120.80 134.80 148.80 162.80 176.80 190.80 204.80 218.80 232.80 246.80 260.80 274.80 288.80" y="127.79" font-size="14.00" class="sc-notosanscjkscbold">我们在模型福祉访谈中提出的问题</text></svg></div>
