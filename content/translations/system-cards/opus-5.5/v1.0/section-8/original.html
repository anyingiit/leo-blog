9.00" class="sc-loraregular">205</text><text x="72.00" y="422.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="422.49" font-size="9.00" class="sc-lorabold sc-k">8.13.2.B] BenchCAD Vision2Code</text><text x="227.03" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">子集得分（有工具）。</text><text x="317.03" y="422.49" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考下以不同的推理强度档位进行评估。</text><text x="72.00" y="434.19" font-size="9.00" class="sc-notoserifcjksc">我们使用</text><text x="110.37" y="434.19" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="136.45" y="434.19" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值。图中显示</text><text x="507.82" y="434.19" font-size="9.00" class="sc-loraregular">95%</text><text x="528.12" y="434.19" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="445.89" font-size="9.00" class="sc-notoserifcjksc">信区间。</text><text x="72.00" y="507.02" font-size="11.00" class="sc-loraregular sc-k">OSWorld 2.0</text><text x="136.38" y="503.35" font-size="6.60" class="sc-loraregular">27</text><text x="145.86" y="507.02" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="203.76" y="507.02" font-size="11.00" class="sc-loraregular">108</text><text x="223.67" y="507.02" font-size="11.00" class="sc-notoserifcjksc">个长程计算机使用（</text><text x="322.67" y="507.02" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="393.36" y="507.02" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，其中智能</text><text x="72.00" y="522.64" font-size="11.00" class="sc-notoserifcjksc">体通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="338.89" y="522.64" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="380.43" y="522.64" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每个任务依据一组加权</text><text x="72.00" y="538.26" font-size="11.00" class="sc-notoserifcjksc">检查点进行评分。我们报告两项指标：部分得分（各任务按检查点所获分数的平均值）和严格通</text><text x="72.00" y="553.88" font-size="11.00" class="sc-notoserifcjksc">过率（所有检查点均满足的任务所占比例），二者均为五次独立运行平均的</text><text x="437.89" y="553.88" font-size="11.00" class="sc-loraregular">pass@1</text><text x="473.08" y="553.88" font-size="11.00" class="sc-notoserifcjksc">。我们采用该</text><text x="72.00" y="569.49" font-size="11.00" class="sc-notoserifcjksc">基准测试的默认设置，即</text><text x="195.89" y="569.49" font-size="11.00" class="sc-loraregular">1080p</text><text x="229.20" y="569.49" font-size="11.00" class="sc-notoserifcjksc">分辨率、每个任务最多</text><text x="342.09" y="569.49" font-size="11.00" class="sc-loraregular">500</text><text x="364.64" y="569.49" font-size="11.00" class="sc-notoserifcjksc">个操作步骤，并使用最高推理强度。</text><text x="72.00" y="585.11" font-size="11.00" class="sc-notoserifcjksc">对于需要评分模型的任务，我们使用</text><text x="250.89" y="585.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="333.89" y="585.11" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="652.95" font-size="11.00" class="sc-notoserifcjksc">自</text><text x="85.89" y="652.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="169.29" y="652.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="183.19" y="652.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5.1</text><text x="278.14" y="652.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="311.14" y="652.95" font-size="11.00" class="sc-notoserifcjksc">发布以来，我们从两方面更新了这项评估。第</text><text x="72.00" y="668.57" font-size="11.00" class="sc-notoserifcjksc">一，我们将该</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="234.91" y="707.20" width="158.07" height="12.80" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="644.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="644.15" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="644.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="644.15" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="150.80" y="644.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="153.70" y="644.15" width="12.71" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="166.40" y="644.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="169.29" y="644.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="180.29 "644.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="289.14" y="644.15" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="300.14" y="644.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="300.14" y="644.15" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p206.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 206 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">206</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">基准测试的任务文件、任务资源及配套</text><text x="261.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Web</text><text x="287.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">应用更新到</text><text x="345.56" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="373.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="387.27" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="396.52" y="82.61" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="410.42" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="424.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">日的版本。第二，我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">改变了智能体运行框架管理上下文的方式：智能体不再在截图累积到固定数量后丢弃较早的截</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">图，而是保留每一张截图，并使用</text><text x="239.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude API</text><text x="298.26" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的服务端上下文管理功能，该功能会在对话超过</text><text x="72.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">100k token</text><text x="130.52" y="129.47" font-size="11.00" class="sc-notoserifcjksc">时对其进行压缩。本节中的所有模型均在相同的更新后配置下进行评估。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="195.95" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="193.63" y="195.95" font-size="11.00" class="sc-loraregular">81.8%</text><text x="225.16" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的部分得分和</text><text x="294.06" y="195.95" font-size="11.00" class="sc-loraregular sc-k">48.7%</text><text x="326.09" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的严格通过率。在相同条件下重新评估时，</text><text x="72.00" y="211.57" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="224.30" y="211.57" font-size="11.00" class="sc-loraregular sc-k">80.7%</text><text x="254.13" y="211.57" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="334.02" y="211.57" font-size="11.00" class="sc-loraregular">42.8%</text><text x="364.35" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="375.35" y="211.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="452.38" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="72.00" y="227.19" font-size="11.00" class="sc-loraregular sc-k">74.0%</text><text x="101.82" y="227.19" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="181.71" y="227.19" font-size="11.00" class="sc-loraregular sc-k">37.2%</text><text x="210.35" y="227.19" font-size="11.00" class="sc-notoserifcjksc">。由于任务文件和运行框架配置均有所不同，这些结果取代</text><text x="499.24" y="227.19" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="242.81" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="131.00" y="242.81" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="225.96" y="242.81" font-size="11.00" class="sc-notoserifcjksc">系统卡中的</text><text x="283.85" y="242.81" font-size="11.00" class="sc-loraregular sc-k">OSWorld 2.0</text><text x="351.12" y="242.81" font-size="11.00" class="sc-notoserifcjksc">数据，且不能与在该基准测试早期版本</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">上报告的结果或以其他运行框架配置获得的结果直接比较。</text><text x="72.00" y="602.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.92 112.01 117.55" y="602.96" font-size="9.00" class="sc-lorabold">8.13.3.A]</text><text x="123.39" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">各模型的</text><text x="161.76" y="602.96" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.0</text><text x="217.24" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="244.24" y="602.96" font-size="9.00" class="sc-notoserifcjksc">柱形显示</text><text x="282.61" y="602.96" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="301.18" y="602.96" font-size="9.00" class="sc-notoserifcjksc">推理强度下的部分得分和严格通过率，以及基于五次运行的</text><text x="72.00" y="614.66" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="614.66" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">207</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold sc-k">8.13.3.B] Claude Opus 5.5</text><text x="191.68" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="200.68" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="264.38" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="275.75" y="413.53" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5.1</text><text x="345.20" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="356.57" y="413.53" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.0</text><text x="412.06" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与性能对比。</text><text x="502.06" y="413.53" font-size="9.00" class="sc-notoserifcjksc">每个点代</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="308.37" y="425.23" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="324.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">标价（含输入、输出和提示缓存）计算的平均每任务成</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">本。得分为</text><text x="119.37" y="436.93" font-size="9.00" class="sc-loraregular sc-k">OSWorld 2.0</text><text x="174.41" y="436.93" font-size="9.00" class="sc-notoserifcjksc">评分者给出的部分得分，取五次运行的平均值。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.63 121.94 126.26 129.69 137.49 145.51 155.73" y="527.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 OfficeQA</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">208</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold">8.13.3.C] Claude Opus 5.5</text><text x="192.34" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="201.34" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="265.04" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="276.41" y="413.53" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5.1</text><text x="345.86" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="357.23" y="413.53" font-size="9.00" class="sc-lorabold sc-k">OSWorld 2.0</text><text x="412.71" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与严格通过率对比。</text><text x="529.71" y="413.53" font-size="9.00" class="sc-notoserifcjksc">每</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">个点代表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="335.37" y="425.23" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="351.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">标价（含输入、输出和提示缓存）计算的平均每</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">任务成本。严格通过率仅在所有检查点均满足时才将任务计为通过，取五次运行的平均值。</text><text x="72.00" y="486.67" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="486.67" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="551.66" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46" y="551.66" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="193.13" y="551.66" font-size="11.00" class="sc-notoserifcjksc">推出的一个公开基准测试，用于评估在大量历史美国《财政部公报》文</text><text x="72.00" y="567.28" font-size="11.00" class="sc-notoserifcjksc">档语料上的端到端有据推理能力。模型必须在整个语料中定位相关表格，并基于这些表格进行精</text><text x="72.00" y="582.90" font-size="11.00" class="sc-notoserifcjksc">确的数值推理。我们以智能体方式进行评估：文档以提取后的文本形式提供于沙箱化的环境中，</text><text x="72.00" y="598.52" font-size="11.00" class="sc-notoserifcjksc">并可使用代码执行工具；</text><text x="263.25" y="598.52" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模型的、难度更高的</text><text x="442.14" y="598.52" font-size="11.00" class="sc-loraregular">133</text><text x="461.29" y="598.52" font-size="11.00" class="sc-notoserifcjksc">题子集。</text><text x="72.00" y="665.00" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="665.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="221.19" y="665.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="257.09" y="665.00" font-size="11.00" class="sc-loraregular">78.9%</text><text x="286.97" y="665.00" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="382.11" y="665.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="418.01" y="665.00" font-size="11.00" class="sc-loraregular sc-k">67.7%</text><text x="445.87" y="665.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="456.87" y="665.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="479.56" y="665.00" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="72.00" y="680.62" font-size="11.00" class="sc-notoserifcjksc">五次运行的平均值）。这略高于</text><text x="228.89" y="680.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="303.03" y="680.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.03" y="680.62" font-size="11.00" class="sc-loraregular">78.1%</text><text x="344.46" y="680.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.35" y="680.62" font-size="11.00" class="sc-loraregular">66.9%</text><text x="389.70" y="680.62" font-size="11.00" class="sc-notoserifcjksc">），但低于</text><text x="447.60" y="680.62" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="696.24" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="696.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71" y="696.24" font-size="11.00" class="sc-loraregular sc-k">80.2%</text><text x="129.62" y="696.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="143.51" y="696.24" font-size="11.00" class="sc-loraregular sc-k">69.0%</text><text x="174.99" y="696.24" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.01 110.39 116.16 124.18 132.99 141.80 145.23 148.61 157.67 166.48 174.50 182.93 187.77 191.15 199.33 207.35 215.79 223.59 232.02 245.52 254.33 259.32" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.2 Legal Agent Benchmark</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.23 110.61 120.66 129.87 137.60 145.09 153.90 157.33 164.93 173.99" y="453.75" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.3 GDPval-AA</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">28</text><text x="81.22 87.21 92.30 96.34 104.24 109.40 113.66 119.64 125.63 130.78 136.85 139.38 142.01 147.92 150.38 152.90 155.53 160.88 164.75 167.38 172.54 175.26 177.71 180.34 183.39 188.76 194.90 200.27 205.71 208.76 211.22 213.85 221.46 228.80 235.15 240.10 245.26 247.98 250.48 253.10 259.23 264.18 269.34 272.06 278.02 283.11 286.98 289.79 295.86 301.39 304.01 310.27 313.62 316.25 325.19 331.03 337.01 342.43 345.15 347.78 353.74 359.16 363.49 366.82 372.67 377.00 385.93 391.09 397.16 402.43 407.84 410.47 416.32 422.39 425.02 429.28 434.67 439.83 442.55 447.36 455.24 461.09 465.38 468.10 474.08 476.71 482.07 487.34 493.19 499.26 505.11 514.04 516.85 522.15 527.31 530.03 532.69" y="704.45" font-size="10.00" class="sc-loraregular">Patwardhan, T., et al. (2025). GDPval: Evaluating AI model performance on real-world economically</text><text x="72.00 76.95 82.11 84.82 90.79 95.95 101.77 104.49 109.91 112.53 116.40 121.56 126.19 131.56 136.18 138.64 141.27 146.43 150.14 156.63 159.44 164.48 166.98 172.35 177.80 181.44 187.48 189.79 196.00 201.42 206.75 211.21 216.63" y="717.26" font-size="10.00" class="sc-loraregular">valuable tasks. arXiv:2510.04374.</text><text x="221.72 227.62 231.59 235.45 241.42 246.05 248.55 252.24 258.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">209</text><text x="72.00" y="111.05" font-size="11.00" class="sc-loraregular sc-k">Legal Agent Benchmark</text><text x="192.63" y="111.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63" y="111.05" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="223.90" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="259.79" y="111.05" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Harvey AI</text><text x="312.37" y="111.05" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。该基准测试包含</text><text x="502.27 508.17 510.78 517.61 521.61" y="111.05" font-size="11.00" class="sc-loraregular">2,010</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">多个任务，覆盖</text><text x="151.89" y="126.67" font-size="11.00" class="sc-loraregular">27</text><text x="165.76" y="126.67" font-size="11.00" class="sc-notoserifcjksc">个不同的执业领域。每个任务包含一个封闭文档集，其中包括电子邮件往来、</text><text x="72.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">律所模板、程序性文件以及其他客户事务材料，智能体必须对这些材料进行筛查才能完成任务。</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">任务指令以合伙人向授薪律师提出的简短</text><text x="270.00" y="157.91" font-size="11.00" class="sc-loraregular">“</text><text x="274.40" y="157.91" font-size="11.00" class="sc-notoserifcjksc">工作请求</text><text x="318.40" y="157.91" font-size="11.00" class="sc-loraregular">”</text><text x="322.24" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的形式撰写。任务指令还规定了预期的输出</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">文档及其格式。评估采用通过</text><text x="215.00" y="173.53" font-size="11.00" class="sc-loraregular">/</text><text x="222.59" y="173.53" font-size="11.00" class="sc-notoserifcjksc">不通过的方式，使用</text><text x="324.48" y="173.53" font-size="11.00" class="sc-loraregular">LLM</text><text x="350.19" y="173.53" font-size="11.00" class="sc-notoserifcjksc">评判模型，依据一套由专家撰写的评分</text><text x="72.00" y="189.15" font-size="11.00" class="sc-notoserifcjksc">细则标准进行（每个被评估任务的标准数量：最少</text><text x="316.89" y="189.15" font-size="11.00" class="sc-loraregular sc-k">23</text><text x="331.65" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条，中位数</text><text x="389.55" y="189.15" font-size="11.00" class="sc-loraregular">56</text><text x="404.79" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条，最多</text><text x="451.69" y="189.15" font-size="11.00" class="sc-loraregular">194</text><text x="470.90" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条）。标准的</text><text x="72.00" y="204.77" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="95.17" y="204.77" font-size="11.00" class="sc-notoserifcjksc">报告仅在所有标准均满足时才将该任务视为成功。</text><text x="72.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">除公开任务外，</text><text x="149.00" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Harvey</text><text x="188.12" y="272.95" font-size="11.00" class="sc-notoserifcjksc">还维护着一个包含</text><text x="279.01" y="272.95" font-size="11.00" class="sc-loraregular">120</text><text x="298.64" y="272.95" font-size="11.00" class="sc-notoserifcjksc">道题目、未公开发布的留出集。</text><text x="452.64" y="272.95" font-size="11.00" class="sc-loraregular sc-k">Harvey LAB</text><text x="514.93" y="272.95" font-size="11.00" class="sc-notoserifcjksc">在该</text><text x="72.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">留出集上的结果由</text><text x="253.48" y="288.57" font-size="11.00" class="sc-notoserifcjksc">独立报告，所用运行框架由</text><text x="478.96" y="288.57" font-size="11.00" class="sc-notoserifcjksc">团队维护</text><text x="72.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其方法论详见此处</text><text x="171.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="353.91" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="353.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.63" y="353.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="194.32" y="353.91" font-size="11.00" class="sc-notoserifcjksc">推理强度下于留出集上取得</text><text x="329.22" y="353.91" font-size="11.00" class="sc-loraregular">8.3%</text><text x="356.69" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="425.59" y="353.91" font-size="11.00" class="sc-loraregular">91.2%</text><text x="457.03" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通</text><text x="72.00" y="369.53" font-size="11.00" class="sc-notoserifcjksc">过率。与我们上一份系统卡一致，早期模型的得分采用</text><text x="429.48" y="369.53" font-size="11.00" class="sc-notoserifcjksc">测得的数据，而非</text><text x="72.00" y="385.15" font-size="11.00" class="sc-loraregular sc-k">Harvey</text><text x="111.12" y="385.15" font-size="11.00" class="sc-notoserifcjksc">报告的数据，以便所有模型都在同一运行框架上进行比较。因此，这些得分可能与该变更</text><text x="72.00" y="400.77" font-size="11.00" class="sc-notoserifcjksc">之前发布的系统卡中的得分略有不同。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66 143.57 146.27" y="477.83" font-size="11.00" class="sc-loraregular">GDPval-AA v2.1</text><text x="153.17" y="477.83" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="257.65" y="477.83" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真</text><text x="72.00" y="493.45" font-size="11.00" class="sc-notoserifcjksc">实世界专业任务上测试</text><text x="184.89" y="493.45" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="493.45" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="311.25" y="493.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="352.65" y="493.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">GDPval</text><text x="393.10" y="493.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="448.10" y="489.78" font-size="6.60" class="sc-loraregular">28</text><text x="455.35" y="493.45" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="480.25" y="493.45" font-size="11.00" class="sc-loraregular">220</text><text x="501.79" y="493.45" font-size="11.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="509.07" font-size="11.00" class="sc-notoserifcjksc">务，涵盖九大主要行业的</text><text x="195.89" y="509.07" font-size="11.00" class="sc-loraregular">44</text><text x="210.71" y="509.07" font-size="11.00" class="sc-notoserifcjksc">种职业。任务模拟实际的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="524.69" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="524.69" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="524.69" font-size="11.00" class="sc-notoserifcjksc">访问和网页浏览能力以完成任务；性能以</text><text x="478.31" y="524.69" font-size="11.00" class="sc-loraregular">Elo</text><text x="497.47" y="524.69" font-size="11.00" class="sc-notoserifcjksc">评分衡</text><text x="72.00" y="540.31" font-size="11.00" class="sc-notoserifcjksc">量，该评分由对模型输出进行的盲测成对比较得出，并以</text><text x="349.89" y="540.31" font-size="11.00" class="sc-loraregular sc-k">DeepSeek V4.1 Flash</text><text x="452.21" y="540.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="463.21" y="540.31" font-size="11.00" class="sc-loraregular">max</text><text x="484.55" y="540.31" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="509.45 513.45 516.11 522.47 529.30" y="540.31" font-size="11.00" class="sc-loraregular">1,600</text><text x="72.00" y="555.93" font-size="11.00" class="sc-notoserifcjksc">分为锚点。</text><text x="72.00" y="623.56" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="623.56" font-size="11.00" class="sc-notoserifcjksc">占据排行榜前两名：</text><text x="256.73" y="623.56" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="279.43" y="623.56" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="337.32" y="623.56" font-size="11.00" class="sc-loraregular">Elo</text><text x="356.49" y="623.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="370.38" y="623.56" font-size="11.00" class="sc-loraregular">1846</text><text x="392.88" y="623.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="403.88" y="623.56" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="439.78" y="623.56" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="72.00" y="639.18" font-size="11.00" class="sc-loraregular">1820</text><text x="94.92" y="639.18" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="141.82" y="639.18" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="164.51" y="639.18" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="189.41" y="639.18" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="269.92" y="639.18" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="280.92" y="639.18" font-size="11.00" class="sc-loraregular">1735</text><text x="302.11" y="639.18" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="327.01" y="639.18" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="349.70" y="639.18" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="374.59" y="639.18" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="448.73" y="639.18" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="459.73" y="639.18" font-size="11.00" class="sc-loraregular">1708</text><text x="481.82" y="639.18" font-size="11.00" class="sc-notoserifcjksc">），也领先</text><text x="72.00" y="654.80" font-size="11.00" class="sc-notoserifcjksc">于所有非</text><text x="118.89" y="654.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="654.80" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="190.18" y="654.80" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="226.08" y="654.80" font-size="11.00" class="sc-notoserifcjksc">取得与</text><text x="261.98" y="654.80" font-size="11.00" class="sc-loraregular">max</text><text x="286.21" y="654.80" font-size="11.00" class="sc-notoserifcjksc">相近的性能，同时输出</text><text x="399.10" y="654.80" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="431.16" y="654.80" font-size="11.00" class="sc-notoserifcjksc">减少约</text><text x="467.05" y="654.80" font-size="11.00" class="sc-loraregular">51%</text><text x="486.62" y="654.80" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="162.58" y="670.42" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><a href="https://arxiv.org/abs/2510.04374" rel="noopener"><rect x="221.72" y="707.20" width="155.60" height="12.80" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="259.79" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="259.79" y="102.25" width="36.22" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="296.02" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.harvey.ai/" rel="noopener"><rect x="298.91" y="102.25" width="10.57" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/evaluations/harvey-lab-aa" rel="noopener"><rect x="162.89" y="279.77" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/evaluations/harvey-lab-aa" rel="noopener"><rect x="162.89" y="279.77" width="43.54" height="11.00" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p210.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 210 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.92 111.30 120.36 129.42 137.02 145.21 150.20 153.63 161.65 165.96 173.76 182.57 189.51" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.4 AA-Briefcase</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.82 111.20 118.53 126.82 135.11 138.54 147.35 152.19 160.62 164.05 172.34 180.78 184.16 193.17 201.19 206.18 209.61 213.93 217.36 225.38" y="309.61" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.5 Toolathlon Verified</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">210</text><text x="72.00 79.39 86.06 91.44 98.19 102.95 106.05 112.01 115.67 121.50 127.18 132.27" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">AA-Briefcase</text><text x="141.12" y="111.05" font-size="11.00" class="sc-loraregular">v1.1</text><text x="160.29" y="111.05" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="264.76" y="111.05" font-size="11.00" class="sc-notoserifcjksc">开发，是一个新的基准测试，面向由行业专家构建的复杂</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">项目中的长程知识工作。模型需要完成为期数周、包含大量相互关联的任务和数千个输入源文件</text><text x="72.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">的项目；评分结合评分细则打分和由一组前沿模型进行的成对评判，以衡量可验证的任务成功情</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">况、分析质量和呈现质量。</text><text x="72.00" y="208.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="208.19" font-size="11.00" class="sc-notoserifcjksc">占据排行榜前三名：</text><text x="256.73" y="208.19" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="279.43" y="208.19" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="337.32" y="208.19" font-size="11.00" class="sc-loraregular">Elo</text><text x="356.49" y="208.19" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="370.38" y="208.19" font-size="11.00" class="sc-loraregular">1822</text><text x="392.38" y="208.19" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="403.38" y="208.19" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="439.28" y="208.19" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="72.00" y="223.81" font-size="11.00" class="sc-loraregular">1780</text><text x="94.09" y="223.81" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="105.09" y="223.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="134.39" y="223.81" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="203.28" y="223.81" font-size="11.00" class="sc-loraregular">1705</text><text x="225.18" y="223.81" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="272.07" y="223.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="294.77" y="223.81" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="319.66" y="223.81" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="400.17" y="223.81" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="411.17" y="223.81" font-size="11.00" class="sc-loraregular sc-k">1678</text><text x="432.71" y="223.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="457.60" y="223.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="480.30" y="223.81" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="505.19" y="223.81" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="239.43" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="107.85" y="239.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="118.85" y="239.43" font-size="11.00" class="sc-loraregular sc-k">1673</text><text x="140.33" y="239.43" font-size="11.00" class="sc-notoserifcjksc">）。它在分析质量</text><text x="231.23" y="239.43" font-size="11.00" class="sc-loraregular">Elo</text><text x="250.39" y="239.43" font-size="11.00" class="sc-notoserifcjksc">和呈现</text><text x="286.28" y="239.43" font-size="11.00" class="sc-loraregular">Elo</text><text x="305.44" y="239.43" font-size="11.00" class="sc-notoserifcjksc">上均领先于</text><text x="363.34" y="239.43" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="443.84" y="239.43" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="454.84" y="239.43" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="490.74" y="239.43" font-size="11.00" class="sc-notoserifcjksc">取得与</text><text x="72.00" y="255.05" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="94.70" y="255.05" font-size="11.00" class="sc-notoserifcjksc">相近的性能，同时输出</text><text x="207.59" y="255.05" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="239.64" y="255.05" font-size="11.00" class="sc-notoserifcjksc">减少约</text><text x="275.54" y="255.05" font-size="11.00" class="sc-loraregular">41%</text><text x="295.07" y="255.05" font-size="11.00" class="sc-notoserifcjksc">。评估由</text><text x="432.55" y="255.05" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="333.69" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="129.80" y="333.69" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="333.69" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="333.69" font-size="11.00" class="sc-notoserifcjksc">个真实世界工具使用任务，涵盖办公效率、电子商</text><text x="72.00" y="349.31" font-size="11.00" class="sc-notoserifcjksc">务与运营、数据分析以及网络研究。任务在预先填充了逼真数据的应用中开始，并由基于执行的</text><text x="72.00" y="364.93" font-size="11.00" class="sc-notoserifcjksc">检查器评分，这些检查器既验证生成的产物，也验证相关应用或网站中的变更。该基准测试在</text><text x="525.89" y="364.93" font-size="11.00" class="sc-loraregular">32</text><text x="72.00" y="380.55" font-size="11.00" class="sc-notoserifcjksc">个应用中提供了</text><text x="151.89" y="380.55" font-size="11.00" class="sc-loraregular">600</text><text x="174.81" y="380.55" font-size="11.00" class="sc-notoserifcjksc">多个工具。任务要求在长程范围内正确选择工具、正确安排多步骤顺序，并</text><text x="72.00" y="396.17" font-size="11.00" class="sc-notoserifcjksc">给出与检查器要求完全一致的输出；在我们的运行中，轨迹平均约为</text><text x="404.89" y="396.17" font-size="11.00" class="sc-loraregular">20–27</text><text x="437.99" y="396.17" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。我们基</text><text x="72.00" y="411.79" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="188.98" y="411.79" font-size="11.00" class="sc-notoserifcjksc">进行评估，这是作者的最终版本（</text><text x="353.98" y="411.79" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="381.80" y="411.79" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="395.70" y="411.79" font-size="11.00" class="sc-loraregular">6</text><text x="404.95" y="411.79" font-size="11.00" class="sc-notoserifcjksc">月），其中任务提示词、真</text><text x="72.00" y="427.41" font-size="11.00" class="sc-notoserifcjksc">值和评估器均经过人工审核并最终确定，并公布了八个模型的参考轨迹以供外部验证。</text><text x="72.00" y="511.80" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="511.80" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="193.63" y="511.80" font-size="11.00" class="sc-loraregular sc-k">77.8%</text><text x="224.64" y="511.80" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="238.53" y="511.80" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="273.74" y="511.80" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="298.63" y="511.80" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="319.28" y="511.80" font-size="11.00" class="sc-notoserifcjksc">次试验中，有一次试验（</text><text x="440.28" y="511.80" font-size="11.00" class="sc-loraregular sc-k">0.3%</text><text x="465.34" y="511.80" font-size="11.00" class="sc-notoserifcjksc">）被生产环境</text><text x="72.00" y="527.42" font-size="11.00" class="sc-notoserifcjksc">安全分类器中止，六次（</text><text x="193.00" y="527.42" font-size="11.00" class="sc-loraregular">1.9%</text><text x="215.64" y="527.42" font-size="11.00" class="sc-notoserifcjksc">）被我们评估运行框架的沙箱逃逸监控器中止，这七次均计为失</text><text x="72.00" y="543.04" font-size="11.00" class="sc-notoserifcjksc">败。按照论文的协议，我们报告所有</text><text x="250.89" y="543.04" font-size="11.00" class="sc-loraregular">108</text><text x="270.80" y="543.04" font-size="11.00" class="sc-notoserifcjksc">个任务上三次试验平均的</text><text x="394.70" y="543.04" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="429.91" y="543.04" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="465.80" y="543.04" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="503.13" y="543.04" font-size="11.00" class="sc-notoserifcjksc">（三次</text><text x="72.00" y="558.66" font-size="11.00" class="sc-notoserifcjksc">试验中至少一次正确）、</text><text x="193.00" y="558.66" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="219.52" y="558.66" font-size="11.00" class="sc-notoserifcjksc">（三次试验全部正确）和每条轨迹的平均助手轮次数。</text><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="72.00" y="102.25" width="19.44" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://artificialanalysis.ai/articles/aa-briefcase" rel="noopener"><rect x="91.44" y="102.25" width="46.79" height="11.00" fill="transparent"/></a></svg></div>

ass="sc-loraregular sc-k">87.0</text><text x="370.50" y="171.39" font-size="11.00" class="sc-loraregular">73.1</text><text x="447.75 453.49 459.61 462.31" y="171.39" font-size="11.00" class="sc-loraregular">23.5</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 126.46 132.52 137.06 143.88 150.11 155.44 158.33" y="198.83" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="216.00" y="198.83" font-size="11.00" class="sc-loraregular sc-k">79.3</text><text x="293.25 299.43 305.78 308.49" y="198.83" font-size="11.00" class="sc-loraregular">86.1</text><text x="370.50" y="198.83" font-size="11.00" class="sc-loraregular">73.1</text><text x="447.75" y="198.83" font-size="11.00" class="sc-loraregular sc-k">19.8</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 124.60 131.21 138.00 143.34 146.23 152.24 154.80" y="226.28" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="216.00" y="226.28" font-size="11.00" class="sc-loraregular sc-k">79.9</text><text x="293.25 299.43 305.61 308.14" y="226.28" font-size="11.00" class="sc-loraregular">88.0</text><text x="370.50" y="226.28" font-size="11.00" class="sc-loraregular">71.3</text><text x="447.75 453.65 460.30 463.01" y="226.28" font-size="11.00" class="sc-loraregular">20.4</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 122.72 128.95 135.96 142.97 148.89 153.43 156.32" y="253.72" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="216.00" y="253.72" font-size="11.00" class="sc-loraregular sc-k">74.7</text><text x="293.25 299.43 305.39 308.09" y="253.72" font-size="11.00" class="sc-loraregular">84.3</text><text x="370.50 376.85 382.84 385.20" y="253.72" font-size="11.00" class="sc-loraregular">65.7</text><text x="447.75 453.41 459.37 462.07" y="253.72" font-size="11.00" class="sc-loraregular">24.5</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.86 111.23 120.29 128.73 133.56 141.85 155.36 164.17 169.00 172.43 180.72 189.16 197.35 205.37 213.80 221.60" y="570.67" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.6 AutomationBench</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">29</text><text x="81.32 86.99 92.97 98.39 104.36 109.52 113.78 119.75 122.28 124.91 132.12 134.58 137.11 139.74 144.89 150.96 156.94 159.57 165.24 170.39 173.11 175.92 184.86 190.02 196.08 200.71 203.24 205.87 212.15 214.61 217.24 220.28 225.65 231.79 237.16 242.81 245.86 248.32 250.95 257.21 263.18 267.05 272.89 281.83 286.92 290.79 293.59 299.44 305.45 311.67 317.09 323.15 328.47 334.46 336.92 339.55 344.70 348.41 354.90 357.71 362.76 365.26 370.62 376.40 382.61 388.03 390.49 394.12 399.67 405.45 411.02 416.44" y="704.45" font-size="10.00" class="sc-loraregular">Shepard, D., and Salimans, R. (2026). AutomationBench. arXiv:2604.18934.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.72 203.18 206.81 212.36 218.14 223.71" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2604.18934</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">211</text><text x="76.75" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="447.25" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">平均轮次</text><text x="72.00" y="272.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="272.89" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.62 111.72 117.25 120.73 123.09 128.48 133.58 138.64 141.44 146.12 149.84 155.43 158.24 163.33" y="272.89" font-size="9.00" class="sc-lorabold">8.14.5.A] Toolathlon</text><text x="171.44" y="272.89" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="270.44" y="272.89" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="353.81" y="272.89" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="372.38" y="272.89" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估；</text><text x="444.38" y="272.89" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="514.52" y="272.89" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="284.59" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="140.24" y="284.59" font-size="9.00" class="sc-notoserifcjksc">在启用安全分类器的情况下运行。按照论文的协议，</text><text x="347.24" y="284.59" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="376.05" y="284.59" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="385.05" y="284.59" font-size="9.00" class="sc-loraregular sc-k">Pass@3</text><text x="417.96" y="284.59" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="429.33" y="284.59" font-size="9.00" class="sc-loraregular sc-k">Pass³</text><text x="453.39" y="284.59" font-size="9.00" class="sc-notoserifcjksc">均基于所有</text><text x="500.76" y="284.59" font-size="9.00" class="sc-loraregular">108</text><text x="517.05" y="284.59" font-size="9.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="296.29" font-size="9.00" class="sc-notoserifcjksc">务的三次试验计算。</text><text x="72.00" y="325.64" font-size="11.00" class="sc-notoserifcjksc">我们的运行框架沿用</text><text x="276.98" y="325.64" font-size="11.00" class="sc-notoserifcjksc">的任务定义、提示词和基于执行的检查器，仅加入少量</text><text x="72.00" y="341.26" font-size="11.00" class="sc-notoserifcjksc">针对特定环境的设置补丁；我们在自己的运行框架中重新运行了两个参考模型（</text><text x="457.00" y="341.26" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="72.00" y="356.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="356.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="168.89" y="356.88" font-size="11.00" class="sc-notoserifcjksc">），其结果与作者公布的结果相吻合，以此验证了这一配置。为控制实时依</text><text x="72.00" y="372.50" font-size="11.00" class="sc-notoserifcjksc">赖漂移，我们将金融数据源固定到运行时记录的快照，并固定容器镜像。少数上游检查器缺陷</text><text x="72.00" y="388.12" font-size="11.00" class="sc-notoserifcjksc">（例如，真值引用了一个后来已重命名的代码仓库）保持未修改。</text><text x="72.00" y="455.17" font-size="11.00" class="sc-notoserifcjksc">关于与已公布排行榜可比性的说明：我们得到的</text><text x="305.89" y="455.17" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="392.13" y="455.17" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="406.03" y="455.17" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="491.91" y="455.17" font-size="11.00" class="sc-notoserifcjksc">数据比已</text><text x="72.00" y="470.79" font-size="11.00" class="sc-notoserifcjksc">公布排行榜上的数据（分别为</text><text x="217.89" y="470.79" font-size="11.00" class="sc-loraregular sc-k">71.6%</text><text x="248.39" y="470.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="262.28" y="470.79" font-size="11.00" class="sc-loraregular">76.2%</text><text x="291.89" y="470.79" font-size="11.00" class="sc-notoserifcjksc">）高出大约三个百分点。这一差距大部分来自空尝</text><text x="310.61" y="486.41" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="396.85" y="486.41" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="410.75" y="486.41" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="431.39" y="486.41" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="467.29" y="486.41" font-size="11.00" class="sc-loraregular">8</text><text x="476.36" y="486.41" font-size="11.00" class="sc-notoserifcjksc">次；</text><text x="498.36" y="486.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="502.03" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="502.03" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="133.49" y="502.03" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="154.14" y="502.03" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="190.03" y="502.03" font-size="11.00" class="sc-loraregular">11</text><text x="200.93" y="502.03" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这些计为失败；排除它们之后，我们的数据与作者公</text><text x="72.00" y="517.65" font-size="11.00" class="sc-notoserifcjksc">布的参考轨迹在运行间噪声范围内一致。</text><text x="72.00" y="594.52" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="163.89" y="590.85" font-size="6.60" class="sc-loraregular">29</text><text x="174.15" y="594.52" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="188.04" y="594.52" font-size="11.00" class="sc-loraregular">Zapier</text><text x="223.70" y="594.52" font-size="11.00" class="sc-notoserifcjksc">推出的一个基准测试，衡量智能体能否完成逼真的端到端业务工</text><text x="72.00" y="610.14" font-size="11.00" class="sc-notoserifcjksc">作流。任务源自真实客户在销售、市场营销、运营、支持、财务和人力资源等领域的工作流模</text><text x="72.00" y="625.76" font-size="11.00" class="sc-notoserifcjksc">式。每个任务将智能体置于一家模拟公司中，其中有跨越</text><text x="349.89" y="625.76" font-size="11.00" class="sc-loraregular">47</text><text x="363.82" y="625.76" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="407.82" y="625.76" font-size="11.00" class="sc-loraregular">CRM</text><text x="432.51" y="625.76" font-size="11.00" class="sc-notoserifcjksc">（客户关系管理）、</text><text x="72.00" y="641.38" font-size="11.00" class="sc-loraregular">Slack</text><text x="98.66" y="641.38" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="109.66" y="641.38" font-size="11.00" class="sc-loraregular sc-k">Google Workspace</text><text x="208.66" y="641.38" font-size="11.00" class="sc-notoserifcjksc">等）的数十个</text><text x="277.56" y="641.38" font-size="11.00" class="sc-loraregular sc-k">REST API</text><text x="327.55" y="641.38" font-size="11.00" class="sc-notoserifcjksc">端点。智能体会收到一条自然语言指令。随</text><text x="72.00" y="656.99" font-size="11.00" class="sc-notoserifcjksc">后，它必须通过搜索自主发现正确的端点；进行</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p212.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 212 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">212</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">数十次相继且相互依赖的</text><text x="195.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="215.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">调用；查阅并遵守多层级的业务政策文档；并正确避开刻意设置的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">干扰项。每个任务按通过</text><text x="193.00" y="98.23" font-size="11.00" class="sc-loraregular">/</text><text x="200.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">不通过评分，其依据为是否满足针对模拟应用状态的所有确定性断言</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（例如，所有正确的</text><text x="173.89" y="113.85" font-size="11.00" class="sc-loraregular">CRM</text><text x="201.48" y="113.85" font-size="11.00" class="sc-notoserifcjksc">更新均已应用）。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">在衡量私有留出评估集上表现的</text><text x="228.89" y="163.58" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="323.68" y="163.58" font-size="11.00" class="sc-notoserifcjksc">排行榜上，</text><text x="378.68" y="163.58" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="401.38" y="163.58" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="470.27" y="163.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="179.20" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="179.20" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="125.48" y="179.20" font-size="11.00" class="sc-loraregular sc-k">40.0%</text><text x="157.04" y="179.20" font-size="11.00" class="sc-notoserifcjksc">，相比</text><text x="192.93" y= <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p213.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 213 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">213</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="140.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是一项开源评估，旨在评估真实医疗健康场景中的安全性、准确性和沟通能力。该</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">基准测试使用超过</text><text x="162.89 168.86 175.04 177.64 184.48 191.31" y="98.23" font-size="11.00" class="sc-loraregular">48,000</text><text x="201.04" y="98.23" font-size="11.00" class="sc-notoserifcjksc">条由专家撰写的评分细则条目，对</text><text x="368.93 374.93 377.54 384.37 391.20" y="98.23" font-size="11.00" class="sc-loraregular">5,000</text><text x="400.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">段单轮及多轮的患者与临床</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">医生对话进行评分。</text><text x="171.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="304.85" y="113.85" font-size="11.00" class="sc-notoserifcjksc">是一项临床任务基准测试，由</text><text x="450.74" y="113.85" font-size="11.00" class="sc-loraregular">525</text><text x="471.53" y="113.85" font-size="11.00" class="sc-notoserifcjksc">段医生撰写的</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">对话组成，涵盖临床会诊、文书记录和研究任务。每段对话均由一个</text><text x="404.89" y="129.47" font-size="11.00" class="sc-loraregular">LLM</text><text x="430.60" y="129.47" font-size="11.00" class="sc-notoserifcjksc">评判模型依据评分细则</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">标准进行评分。</text><text x="72.00" y="194.31" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.15.1 HealthBench</text><text x="195.89" y="194.31" font-size="13.00" class="sc-notosanscjkscbold" fill=" c-notoserifcjksc">种语言上的平均准确率为</text><text x="373.50" y="513.91" font-size="11.00" class="sc-loraregular">93.1%</text><text x="402.26" y="513.91" font-size="11.00" class="sc-notoserifcjksc">，高于</text><text x="438.16" y="513.91" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="521.56" y="513.91" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="529.53" font-size="11.00" class="sc-loraregular sc-k">93.0%</text><text x="103.43" y="529.53" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="114.43" y="529.53" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="191.46" y="529.53" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="205.35" y="529.53" font-size="11.00" class="sc-loraregular">92.1%</text><text x="236.79" y="529.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="250.68" y="529.53" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="336.92" y="529.53" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="350.82" y="529.53" font-size="11.00" class="sc-loraregular sc-k">89.3%</text><text x="381.51" y="529.53" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p216.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 216 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">216</text><text x="72.00" y="367.18" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.18" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.92 105.01 109.81 111.91 117.44 120.92 123.28 132.03 135.51 140.83" y="367.18" font-size="9.00" class="sc-lorabold">8.16.2.A] MILU</text><text x="150.04" y="367.18" font-size="9.00" class="sc-notoserifcjkscbold">平均准确率。</text><text x="204.04" y="367.18" font-size="9.00" class="sc-notoserifcjksc">所有</text><text x="224.41" y="367.18" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="255.74" y="367.18" font-size="9.00" class="sc-notoserifcjksc">模型均使用</text><text x="303.10" y="367.18" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="321.67" y="367.18" font-size="9.00" class="sc-notoserifcjksc">推理强度下的自适应思考。得分为</text><text x="459.04" y="367.18" font-size="9.00" class="sc-loraregular">5</text><text x="466.31" y="367.18" font-size="9.00" class="sc-notoserifcjksc">次试验的平均值。</text><text x="72.00" y="378.88" font-size="9.00" class="sc-notoserifcjksc">未向任何模型提供工具或定制的系统提示词。</text><text x="72.00" y="414.26" font-size="14.00" class="sc-poppinssemibold">8.17</text><text x="100.71" y="414.26" font-size="14.00" class="sc-notosanscjkscbold">生命科学能力</text><text x="72.00" y="440.81" font-size="11.00" class="sc-notoserifcjksc">我们继续报告生物信息学、蛋白质科学与设计以及实验室实验方案故障排查方面的评估，并新增</text><text x="72.00" y="456.43" font-size="11.00" class="sc-notoserifcjksc">了基于细胞的检测与生物医学图像分析、从头蛋白质结合剂设计以及药物化学方面的评估。这些</text><text x="72.00" y="472.05" font-size="11.00" class="sc-notoserifcjksc">评估中有许多由领域专家在内部开发或与外部合作伙伴共同开发，侧重于支持基础研究和药物研</text><text x="72.00" y="487.67" font-size="11.00" class="sc-notoserifcjksc">发中有益应用的能力，与我们侧重于滥用可能性的</text><text x="314.00" y="487.67" font-size="11.00" class="sc-loraregular">CB</text><text x="331.42" y="487.67" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="386.42" y="487.67" font-size="11.00" class="sc-loraregular sc-k">CB risk assessment</text><text x="484.24" y="487.67" font-size="11.00" class="sc-notoserifcjksc">）形成互</text><text x="72.00" y="503.29" font-size="11.00" class="sc-notoserifcjksc">补。</text><text x="72.00" y="570.36" font-size="11.00" class="sc-notoserifcjksc">尽管这些评估中有许多并未公开发布，我们仍在下文简要介绍每一项。除非另有说明，每个</text><text x="72.00" y="585.98" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="585.98" font-size="11.00" class="sc-notoserifcjksc">得分均为每道题五次尝试的平均值（蛋白质序列生成和生物医学图像分析为每道题一次尝</text><text x="72.00" y="601.60" font-size="11.00" class="sc-notoserifcjksc">试，蛋白质设计文库排序为三次，结合剂设计为每个靶标五次独立运行），采样时使用自适应思</text><text x="72.00" y="617.22" font-size="11.00" class="sc-notoserifcjksc">考，推理强度为</text><text x="151.89" y="617.22" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="171.70" y="617.22" font-size="11.00" class="sc-notoserifcjksc">。在可获得的情况下，我们也报告</text><text x="339.59" y="617.22" font-size="11.00" class="sc-loraregular">GPT</text><text x="361.67" y="617.22" font-size="11.00" class="sc-notoserifcjksc">‑</text><text x="365.47" y="617.22" font-size="11.00" class="sc-loraregular sc-k">6 Astra</text><text x="404.21" y="617.22" font-size="11.00" class="sc-notoserifcjksc">的得分，它通过</text><text x="484.11" y="617.22" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="72.00" y="632.84" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="92.07" y="632.84" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="105.97" y="632.84" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="128.66" y="632.84" font-size="11.00" class="sc-notoserifcjksc">推理强度运行；被</text><text x="219.56" y="632.84" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="260.96" y="632.84" font-size="11.00" class="sc-notoserifcjksc">安全系统拒绝的尝试不计入得分。所有</text><text x="450.85" y="632.84" font-size="11.00" class="sc-loraregular">GPT</text><text x="472.93" y="632.84" font-size="11.00" class="sc-notoserifcjksc">‑</text><text x="476.74" y="632.84" font-size="11.00" class="sc-loraregular sc-k">6 Astra</text><text x="515.48" y="632.84" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="72.00" y="648.46" font-size="11.00" class="sc-notoserifcjksc">所用的网络访问配置均与我们对</text><text x="228.89" y="648.46" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="267.18" y="648.46" font-size="11.00" class="sc-notoserifcjksc">的评估相同或更为宽松。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p217.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 217 页"><text x="72.00 80.29 83.42 87.97 95.25 98.38 102.93 106.31 114.50 117.93 126.22 137.68 145.25 152.19 157.02 165.04 170.03 177.59 185.78 193.80 202.23 210.03" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.1 BioMysteryBench</text><text x="72.00 80.29 83.42 87.97 95.25 98.38 105.88 109.26 115.03 123.84 128.68 136.47 144.91 153.10 156.53 164.82 168.20 176.38 179.81 188.11 191.54 199.97 204.29 212.58 217.57 231.07 239.88 244.72 248.15 255.95" y="355.87" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.17.2 LatchBio Bioinformatics</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">217</text><text x="72.00" y="117.05" font-size="11.00" class="sc-loraregular sc-k">BioMysteryBench</text><text x="164.48" y="117.05" font-size="11.00" class="sc-notoserifcjksc">评估模型解决需要将计算分析与生物学推理交织进行的高难度分析挑战的能</text><text x="72.00" y="132.67" font-size="11.00" class="sc-notoserifcjksc">力。给定实验数据集，模型必须回答诸如从转录组数据中识别被敲除的基因、或判断哪种病毒感</text><text x="72.00" y="148.29" font-size="11.00" class="sc-notoserifcjksc">染了某一样本之类的问题。我们报告两个子集：</text><text x="303.00" y="148.29" font-size="11.00" class="sc-loraregular sc-k">Human Solvable</text><text x="385.11" y="148.29" font-size="11.00" class="sc-notoserifcjksc">，即独立人类专家已解决的</text><text x="520.01" y="148.29" font-size="11.00" class="sc-loraregular">73</text><text x="72.00" y="163.91" font-size="11.00" class="sc-notoserifcjksc">道题；以及</text><text x="211.55" y="163.91" font-size="11.00" class="sc-notoserifcjksc">，即人类仍未解决但具有客观真值答案的</text><text x="412.44" y="163.91" font-size="11.00" class="sc-loraregular">17</text><text x="424.41" y="163.91" font-size="11.00" class="sc-notoserifcjksc">道题。</text><text x="457.41" y="163.91" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="495.70" y="163.91" font-size="11.00" class="sc-notoserifcjksc">可以使用</text><text x="72.00" y="179.53" font-size="11.00" class="sc-notoserifcjksc">用于代码执行的</text><text x="151.89" y="179.53" font-size="11.00" class="sc-loraregular">bash</text><text x="178.55" y="179.53" font-size="11.00" class="sc-notoserifcjksc">工具、文件编辑器以及一组预先指定的已安装软件包；它只能从内部代码</text><text x="72.00" y="195.15" font-size="11.00" class="sc-notoserifcjksc">仓库安装更多软件包，且只能访问一小份允许列表中的域名。</text><text x="72.00" y="274.77" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="274.77" font-size="11.00" class="sc-loraregular sc-k">Human Solvable</text><text x="170.90" y="274.77" font-size="11.00" class="sc-notoserifcjksc">子集上，</text><text x="214.90" y="274.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="300.64" y="274.77" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="336.53" y="274.77" font-size="11.00" class="sc-loraregular sc-k">89.3%</text><text x="367.22" y="274.77" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="392.11" y="274.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="469.14" y="274.77" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="483.04" y="274.77" font-size="11.00" class="sc-loraregular">91.4%</text><text x="514.53" y="274.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="290.39" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="166.95" y="290.39" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="180.85" y="290.39" font-size="11.00" class="sc-loraregular sc-k">90.3%</text><text x="215.15" y="290.39" font-size="11.00" class="sc-notoserifcjksc">相当，并领先于</text><text x="295.05" y="290.39" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="381.29" y="290.39" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="395.18" y="290.39" font-size="11.00" class="sc-loraregular">84.9%</text><text x="425.96" y="290.39" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="72.00" y="306.01" font-size="11.00" class="sc-notoserifcjksc">子集上，</text><text x="116.00" y="306.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="193.03" y="306.01" font-size="11.00" class="sc-notoserifcjksc">以</text><text x="206.93" y="306.01" font-size="11.00" class="sc-loraregular">51.8%</text><text x="238.28" y="306.01" font-size="11.00" class="sc-notoserifcjksc">领先，其次是</text><text x="307.17" y="306.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="392.90" y="306.01" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="406.80" y="306.01" font-size="11.00" class="sc-loraregular sc-k">50.0%</text><text x="438.39" y="306.01" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="449.39" y="306.01" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="321.63" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="321.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="101.49" y="321.63" font-size="11.00" class="sc-loraregular">44.1%</text><text x="132.59" y="321.63" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="146.48" y="321.63" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="232.72" y="321.63" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="246.61" y="321.63" font-size="11.00" class="sc-loraregular sc-k">39.4%</text><text x="277.16" y="321.63" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="385.95" font-size="11.00" class="sc-notoserifcjksc">这组评估由</text><text x="129.89" y="385.95" font-size="11.00" class="sc-loraregular sc-k">LatchBio</text><text x="177.90" y="385.95" font-size="11.00" class="sc-notoserifcjksc">开发，评估模型解决具有挑战性的真实世界生物信息学问题的能力。</text><text x="183.88" y="401.57" font-size="11.00" class="sc-notoserifcjksc">变体在一组</text><text x="241.77" y="401.57" font-size="11.00" class="sc-loraregular">115</text><text x="258.67" y="401.57" font-size="11.00" class="sc-notoserifcjksc">道经外部验证的问题上测试对空间转录组学数据的分析，</text><text x="72.00" y="417.19" font-size="11.00" class="sc-notoserifcjksc">要求模型根据分析结果回答有关样本的生物学问题。</text><text x="325.00" y="417.19" font-size="11.00" class="sc-loraregular sc-k">SingleCellBench</text><text x="410.60" y="417.19" font-size="11.00" class="sc-notoserifcjksc">变体在</text><text x="446.49" y="417.19" font-size="11.00" class="sc-loraregular">195</text><text x="465.74" y="417.19" font-size="11.00" class="sc-notoserifcjksc">道问题上测试对</text><text x="72.00" y="432.81" font-size="11.00" class="sc-notoserifcjksc">单细胞</text><text x="107.89" y="432.81" font-size="11.00" class="sc-loraregular">RNA</text><text x="132.96" y="432.81" font-size="11.00" class="sc-notoserifcjksc">测序数据的分析，涵盖标注细胞类型、寻找差异表达基因和校正批次效应等标准工作</text><text x="72.00" y="448.43" font-size="11.00" class="sc-notoserifcjksc">流程。对于这两个变体，</text><text x="193.00" y="448.43" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="231.29" y="448.43" font-size="11.00" class="sc-notoserifcjksc">均可使用用于代码执行的</text><text x="355.18" y="448.43" font-size="11.00" class="sc-loraregular">bash</text><text x="381.84" y="448.43" font-size="11.00" class="sc-notoserifcjksc">工具、文件编辑器以及一组预先</text><text x="72.00" y="464.05" font-size="11.00" class="sc-notoserifcjksc">指定的已安装软件包。</text><text x="72.00" y="531.69" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="197.77" y="531.69" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="219.77" y="531.69" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="314.73" y="531.69" font-size="11.00" class="sc-notoserifcjksc">仍是最强的模型，得分</text><text x="427.62" y="531.69" font-size="11.00" class="sc-loraregular sc-k">77.6%</text><text x="455.80" y="531.69" font-size="11.00" class="sc-notoserifcjksc">，其次是</text><text x="502.69" y="531.69" font-size="11.00" class="sc-loraregular sc-k">Claude</text><te
