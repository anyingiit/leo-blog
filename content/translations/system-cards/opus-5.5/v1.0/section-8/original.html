ont-size="11.00" class="sc-loraregular">113</text><text x="200.40 211.40 222.40 233.40 244.40 255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40 497.40 508.40 519.40" y="300.64" font-size="11.00" class="sc-notoserifcjksc">个长程软件工程任务的集合，旨在衡量前沿编程智能体的能力。这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="316.26" font-size="11.00" class="sc-notoserifcjksc">任务多样、反映真实世界的复杂性，并且为避免基准污染而从零编写。</text><text x="413.00 420.69 423.68 429.29 435.86 442.44 448.40 451.29 460.02 466.59 473.16 478.25 481.14 487.14 489.85" y="316.26" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="498.73 509.73 520.73" y="316.26" font-size="11.00" class="sc-notoserifcjksc">在五次</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="331.88" font-size="11.00" class="sc-notoserifcjksc">试验中的平均得分为</text><text x="173.89 178.81 184.77 187.48 193.38" y="331.88" font-size="11.00" class="sc-loraregular">74.2%</text><text x="202.96" y="331.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="409.55" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="143.25 154.25" y="409.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14 175.83 182.26 188.35 195.02 198.29 202.55 205.64 212.07" y="409.55" font-size="11.00" class="sc-loraregular">Cognition</text><text x="221.64 232.64 243.64 254.64 265.64 276.64 287.64 298.64 309.64 320.64 331.64 342.64 353.64 364.64 375.64" y="409.55" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54 393.54 399.54" y="409.55" font-size="11.00" class="sc-loraregular">150</text><text x="409.26 420.26 431.26 442 71 329.71 340.71 351.71 362.71 373.71" y="98.80" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="384.71 393.44 400.01 406.58 411.67 414.56 420.56 423.26" y="98.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="432.15 443.15 454.15 465.15 476.15 487.15 498.15 509.15 520.15" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了直至</text><text x="72.00 83.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">完整</text><text x="96.89 100.90 110.99 113.89 118.15 124.58 130.41 136.37" y="114.42" font-size="11.00" class="sc-loraregular">1M token</text><text x="145.94 156.94 167.94 178.94 189.94 200.94 211.94 222.94 233.94 244.94 255.94 266.94 277.94 288.94 299.94 310.94 321.94 332.94 343.94 354.94 365.94 376.94 387.94 398.94 409.94 420.94 431.94 442.94 453.94 464.94 475.94 486.94 497.94 508.94 519.94" y="114.42" font-size="11.00" class="sc-notoserifcjksc">窗口的一系列上下文长度，而且这些任务所考察的长上下文能力与实际下游用例</text><text x="72.00 83.00 94.00 105.00 116.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">高度契合。</text><text x="72.00 81.00 84.64 89.71" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11 112.11 126.11 140.11 154.11" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.13 112.39 116.67 122.48 124.20 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="229.73" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="229.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88 204.46 210.82" y="229.73" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="229.73" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66 232.21" y="226.07" font-size="6.60" class="sc-loraregular">20</text><text x="239.20 250.20 261.20 272.20 283.20 294.20 305.20 316.20 327.20 338.20 349.20 360.20 371.20 382.20 393.20 404.20 415.20 426.20 437.20 448.20 459.20" y="229.73" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含横跨数十个学科的</text><text x="473.09 479.00 481.77 487.76 494.60" y="229.73" font-size="11.00" class="sc-loraregular">2,500</text><text x="504.33 515.33" y="229.73" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">目。这些题目由领域专家编写和审核，仅保留前沿大语言模型无法回答的题目，并且经过专门设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">计，无法通过互联网搜索快速得到答案。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="310.92" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.03 272.74" y="310.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73" y="310.92" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="289.73 293.09 297.09" y="310.92" font-size="11.00" class="sc-loraregular">(1)</text><text x="303.34 314.34 325.34 336.34 347.34 358.34 369.34 380.34 391.34 402.34" y="310.92" font-size="11.00" class="sc-notoserifcjksc">纯推理，不使用工具；</text><text x="413.34 416.70 422.60" y="310.92" font-size="11.00" class="sc-loraregular">(2)</text><text x="428.85 439.85 450.85 461.85 472.85 483.85 494.85 505.85 516.85 527.85" y="310.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="326.54" font-size="11.00" class="sc-notoserifcjksc">取、程序化工具调用和代码执行。在所有运行中，思考设为</text><text x="360.89 366.50 373.07 377.33" y="326.54" font-size="11.00" class="sc-loraregular">auto</text><text x="383.76 394.76 405.76 416.76 427.76 438.76 449.76 460.76 471.76 482.76 493.76 504.76 515.76" y="326.54" font-size="11.00" class="sc-notoserifcjksc">（自动），且跨上下文使用的</text><text x="72.00 76.26 82.69 88.52 94.48" y="342.16" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05 148.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">总数上限为</text><text x="161.95 165.95" y="342.16" font-size="11.00" class="sc-loraregular">1M</text><text x="176.05 187.05 198.05 209.05 220.05 231.05 242.05 253.05 264.05 275.05 286.05 297.05 308.05 319.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。</text><text x="330.05 337.74 340.73 346.34 352.91 359.48 365.45 368.34 377.07 383.64 390.21 395.30 398.19 404.16 406.75" y="342.16" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="342.16" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="408.06" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们为搜索器和抓取器屏蔽了已知会讨论</text><text x="470.89 479.47 485.83" y="408.06" font-size="11.00" class="sc-loraregular">HLE</text><text x="495.57 506.57 517.57" y="408.06" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00 83.00 94.00 105.00 116.00" y="423.68" font-size="11.00" class="sc-notoserifcjksc">（参见附录</text><text x="129.89 136.07 138.78" y="423.68" font-size="11.00" class="sc-loraregular">9.2</text><text x="144.69 155.69 166.69 177.69 188.69 199.69 210.69 221.69 232.69 243.69 254.69 265.69 276.69 287.69 298.69 309.69 320.69 331.69 342.69 353.69 364.69 375.69 386.69 397.69 408.69 419.69 430.69 441.69 452.69" y="423.68" font-size="11.00" class="sc-notoserifcjksc">）。我们还用文本规则筛查每一份回答正确的对话记录，查找使用</text><text x="466.58 475.16 481.52" y="423.68" font-size="11.00" class="sc-loraregular">HLE</text><text x="491.25 502.25 513.25 524.25" y="423.68" font-size="11.00" class="sc-notoserifcjksc">特定来源</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="439.30" font-size="11.00" class="sc-notoserifcjksc">的迹象，并使用</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04" y="439.30" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93 459.93 470.93 481.93 492.93 503.93 514.93 525.93" y="439.30" font-size="11.00" class="sc-notoserifcjksc">审查每一份被标记的对话记录。经确认的作弊案例被重新评为错</text><text x="72.00 83.00" y="454.92" font-size="11.00" class="sc-notoserifcjksc">误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.48" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>

365.08 376.08 387.08 398.08 409.08 420.08 431.08 442.08 453.08 464.08 475.08 486.08 497.08 508.08 519.08 530.08" y="615.00" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="630.62" font-size="11.00" class="sc-notoserifcjksc">评估中，我们使用</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.60" y="630.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85" y="630.62" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用相同的二元</text><text x="72.00 82.10 88.94 95.20 102.79 111.06 119.44 129.54 136.38" y="646.24" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="146.32 157.32 168.32 179.32 190.32 201.32 212.32 223.32 234.32" y="646.24" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21 254.17 256.88" y="646.24" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68 276.68 287.68 298.68 309.68 320.68 331.68 342.68 353.68 364.68 375.68" y="646.24" font-size="11.00" class="sc-notoserifcjksc">节中的公式汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="617.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的规程，对每个回答进行五次独立的评分运行并报告平均值。我们的评判提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">示词取自论文的</text><text x="149.00 160.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="173.89 181.58 184.29" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="190.28 201.28 212.28 223.28 234.28 245.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文的附录</text><text x="259.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="268.96 279.96 290.96 301.96 312.96 323.96 334.96 345.96 356.96 367.96 378.96 389.96 400.96 411.96 422.96 433.96 444.96 455.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判者的选择可能使绝对分数变动</text><text x="469.85 473.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="483.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="497.47 503.38" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="512.26 523.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">但系统间的排序保持不变，因此我们的分数与论文中的主要数字不可直接比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89 401.58 404.29" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14 424.14 435.14 446.14 457.14 468.14 479.14 490.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14 506.24 512.04 517.14 521.39 527.36" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="195.39" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35 121.35 132.35 143.35 154.35 165.35 176.35 187.35 198.35 209.35 220.35 231.35 242.35 253.35 264.35 275.35 286.35 297.35 308.35 319.35 330.35 341.35 352.35 363.35 374.35 385.35 396.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，</text><text x="407.35 411.60 418.04 423.87 429.83" y="195.39" font-size="11.00" class="sc-loraregular">token</text><text x="439.40 450.40 461.40" y="195.39" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="475.29 481.65 487.83 494.66" y="195.39" font-size="11.00" class="sc-loraregular">980k</text><text x="500.57 511.57 522.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件，且只对该文件的内容评分，而非对完整的智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">能体对话记录评分；这样可以将交付物与中间工具输出隔离开来。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="556.05" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95 164.95" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="173.95 182.95 191.95 200.95 209.95 218.95 227.95 236.95 245.95 254.95 263.95 272.95 281.95 290.95 299.95 308.95 317.95 326.95 335.95 344.95 353.95" y="556.05" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32 370.52 375.58 381.17" y="556.05" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37 397.37 406.37 415.37 424.37 433.37 442.37 451.37 460.37 469.37 478.37" y="556.05" font-size="9.00" class="sc-notoserifcjksc">任务预算下，推理强度从</text><text x="489.74 495.14 500.54" y="556.05" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="508.30 517.30 526.30" y="556.05" font-size="9.00" class="sc-notoserifcjksc">提升到</text><text x="72.00 77.40 82.80" y="567.75" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="90.57" y="567.75" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="101.94 108.55 114.64 120.23 126.52" y="567.75" font-size="9.00" class="sc-loraregular">DRACO</text><text x="136.04 145.04 154.04 163.04 172.04 181.04 190.04 199.04 208.04 217.04 226.04 235.04 244.04 253.04 262.04 271.04 280.04 289.04 298.04 307.04 316.04 325.04 334.04 343.04 352.04 361.04 370.04 379.04 388.04 397.04 406.04 415.04 424.04 433.04 442.04 451.04 460.04 469.04 478.04 487.04 496.04 505.04 514.04 523.04" y="567.75" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费</text><text x="72.00 81.00" y="579.45" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00 82.46 89.35 97.73 105.81" y="641.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="641.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="641.20" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50 344.50 355.50 366.50 377.50 388.50 399.50 410.50 421.50 432.50 443.50" y="641.20" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，旨在为</text><text x="457.40 465.48 472.93 479.76 487.45" y="641.20" font-size="11.00" class="sc-loraregular">DRACO</text><text x="499.08 510.08 521.08" y="641.20" font-size="11.00" class="sc-notoserifcjksc">深度研</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="656.82" font-size="11.00" class="sc-notoserifcjksc">究基准提供一个广度搜索方面的对应基准。它包含</text><text x="316.89 322.89 329.72" y="656.82" font-size="11.00" class="sc-loraregular">500</text><text x="339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="656.82" font-size="11.00" class="sc-notoserifcjksc">个任务，在这些任务中，模型必须搜索数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="672.44" font-size="11.00" class="sc-notoserifcjksc">十到数百个实体，查找每个实体的相关事实，并将这些事实连同引用列入结构化记录。我们运行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="688.06" font-size="11.00" class="sc-notoserifcjksc">的是该评估的修改版本；方法上的差异将在下文说明。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="173.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="632.40" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="632.40" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="632.40" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="632.40" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="632.40" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="632.40" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="632.40" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="504.00 507.28 512.33" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="98.80" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12 465.12 476.12 487.12 498.12 509.12 520.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00 83.00 94.00 105.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="114.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可以使用与被测模型相同的网页</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">抓取工具。评分者会重新抓取所引用的</text><text x="261.89 270.17 277.07" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="283.43 294.43 305.43 316.43 327.43 338.43 349.43 360.43 371.43 382.43 393.43 404.43 415.43 426.43 437.43 448.43 459.43 470.43 481.43 492.43 503.43 514.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后评判模型判断这些参考来源是否支持解答。</text><text x="72.00 83.00 94.00 105.00 116.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29 151.32" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32 171.42 177.80 181.65 185.90 188.80 194.83" y="179.77" font-size="11.00" class="sc-loraregular">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67 224.67 235.67 246.67 257.67 268.67 279.67 290.67 301.67 312.67 323.67 334.67 345.67 356.67 367.67 378.67 389.67 400.67 411.67 422.67 433.67 444.67 455.67 466.67 477.67 488.67 499.67 510.67 521.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型完成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">了所要求事实集合中的多少）之间取得平衡。当所需事实只有部分能够得到验证时，给予部分得</text><text x="72.00 83.00 94.00 105.00 116.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">分。结果为</text><text x="129.89 135.89 142.72" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不是使整个任务判</text><text x="72.00 83.00 94.00 105.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">为失败。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线的网络搜索和网页抓取工具，只能访问一个冻结索引；</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="292.54" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82 137.82 148.82 159.82 170.82 181.82 192.82 203.82 214.82 225.82 236.82 247.82" y="292.54" font-size="11.00" class="sc-notoserifcjksc">的版本使用的是实时网络。</text><text x="258.82 266.51 269.51 275.11 281.68 288.26" y="292.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="297.11 308.11 319.11" y="292.54" font-size="11.00" class="sc-notoserifcjksc">模型由</text><text x="333.01 340.70 343.69 349.30 355.87 362.44 368.41 371.30 380.03 386.60 393.17 398.26 401.15 407.11 409.71" y="292.54" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="418.96 429.96 440.96 451.96 462.96 473.96 484.96" y="292.54" font-size="11.00" class="sc-notoserifcjksc">进行评判，这与</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="308.16" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82 137.82 148.82" y="308.16" font-size="11.00" class="sc-notoserifcjksc">所用的</text><text x="162.72 171.09 177.75 184.09 189.47 195.46 198.17" y="308.16" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="207.03 218.03 229.03 240.03 251.03 262.03 273.03 284.03 295.03 306.03 317.03 328.03 339.03 350.03 361.03 372.03 383.03 394.03 405.03 416.03 427.03 438.03 449.03 460.03 471.03" y="308.16" font-size="11.00" class="sc-notoserifcjksc">不同。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="484.92 491.47 497.44 502.20 508.77 511.76 517.67 523.49 526.76 531.04" y="308.16" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，我们的结果与竞争对手模型的已报告数字不可直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10 175.24" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26 190.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26 208.26 217.26 226.26 235.26 244.26 253.26 262.26 271.26 280.26 289.26 298.26 307.26 316.26 325.26 334.26 343.26 352.26 361.26 370.26 379.26 388.26 397.26 406.26 415.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63 431.83 436.89 442.48 447.31 449.68 453.16 458.42 463.19 468.07" y="653.19" font-size="9.00" class="sc-loraregular">980k token</text><text x="473.54 482.54 491.54 500.54 509.54 518.54 527.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，且不含网络搜索费用。</text></svg></div>

10.77" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="110.77" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="110.77" font-size="11.00" class="sc-notoserifcjksc">在多智能体配置下的性能。下文中，我们重点介绍小型团队相对于</text><text x="72.00 83.00 94.00 105.00 116.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">单智能体在</text><text x="129.89 136.56 141.25 147.68 153.76 158.45 164.13 173.89 180.74 186.70 193.37 199.23" y="126.39" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="205.82 216.82" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="230.71 236.89 239.60 243.60 249.51 252.21" y="126.39" font-size="11.00" class="sc-loraregular">8.12.1</text><text x="259.11 270.11 281.11" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）和</text><text x="295.00 303.09 310.54 317.37 325.06" y="126.39" font-size="11.00" class="sc-loraregular">DRACO</text><text x="333.79 344.79" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="358.68 364.86 367.57 371.57 377.48 380.19" y="126.39" font-size="11.00" class="sc-loraregular">8.12.2</text><text x="388.99 399.99 410.99 421.99 432.99 443.99 454.99 465.99 476.99 487.99 498.99 509.99 520.99" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）上的优势，并讨论大型团</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="142.01" font-size="11.00" class="sc-notoserifcjksc">队协作解决更宏大问题的初显潜力（第</text><text x="261.89 268.08 270.78 274.79 280.69 283.40" y="142.01" font-size="11.00" class="sc-loraregular">8.12.3</text><text x="292.42 303.42 314.42 325.42 336.42 347.42 358.42 369.42 380.42 391.42 402.42 413.42 424.42 435.42 446.42 457.42 468.42 479.42 490.42 501.42 512.42 523.42" y="142.01" font-size="11.00" class="sc-notoserifcjksc">节）。我们还介绍了获得这些结果所用的多智能体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="157.63" font-size="11.00" class="sc-notoserifcjksc">运行框架（第</text><text x="140.89 147.08 149.78 153.79 159.69 162.40" y="157.63" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="171.25 182.25 193.25 204.25 215.25 226.25 237.25 248.25 259.25 270.25" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）以及测量方法（第</text><text x="284.15 290.33 293.03 297.04 302.95 305.65" y="157.63" font-size="11.00" class="sc-loraregular">8.12.5</text><text x="314.54 325.54 336.54" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 80.36 83.74 88.44 95.91 99.29" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1</text><text x="107.09 120.09 133.09 146.09" y="222.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="162.18 170.09 175.34 183.63 192.45 197.70 206.51 220.14 228.49 236.51 245.11 252.93" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">ProgramBench</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="250.12" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92 151.47" y="246.46" font-size="6.60" class="sc-loraregular">22</text><text x="157.90 168.90 179.90 190.90 201.90" y="250.12" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="215.80 221.70 228.53" y="250.12" font-size="11.00" class="sc-loraregular">200</text><text x="238.26 249.26 260.26 271.26 282.26 293.26 304.26 315.26 326.26 337.26 348.26 359.26 370.26 381.26 392.26 403.26 414.26 425.26 436.26 447.26 458.26 469.26 480.26 491.26 502.26 513.26 524.26" y="250.12" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体只获得一个由开源</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="265.74" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不访问互联网、不使用反编译工具的情况</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="281.36" font-size="11.00" class="sc-notoserifcjksc">下重建一个能复现原程序行为的代码库。我们使用</text><text x="316.89 320.90 327.26" y="281.36" font-size="11.00" class="sc-loraregular">166</text><text x="336.51" y="281.36" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="347.51" y="281.36" font-size="11.00" class="sc-loraregular">“</text><text x="351.91 362.91" y="281.36" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="373.91" y="281.36" font-size="11.00" class="sc-loraregular">”</text><text x="377.75 388.75 399.75 410.75 421.75 432.75 443.75 454.75 465.75 476.75 487.75 498.75 509.75 520.75" y="281.36" font-size="11.00" class="sc-notoserifcjksc">任务，每个任务的参考二进制文</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="296.98" font-size="11.00" class="sc-notoserifcjksc">件在隐藏测试套件上的得分至少为</text><text x="239.89 246.55 249.25" y="296.98" font-size="11.00" class="sc-loraregular">0.9</text><text x="255.61 266.61 277.61 288.61" y="296.98" font-size="11.00" class="sc-notoserifcjksc">。这与第</text><text x="302.51 308.69 311.39 315.40 322.05 324.76" y="296.98" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="331.66 342.66 353.66 364.66 375.66 386.66 397.66 408.66 419.66 430.66 441.66 452.66 463.66 474.66 485.66 496.66 507.66 518.66 529.66" y="296.98" font-size="11.00" class="sc-notoserifcjksc">节所述的标准相同，但本节的任务列表与该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="312.60" font-size="11.00" class="sc-notoserifcjksc">节的列表有四个任务不同，因为两份列表是根据参考二进制文件的不同运行汇编而成的，在这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="328.22" font-size="11.00" class="sc-notoserifcjksc">运行之间，有少数任务越过了</text><text x="217.89 224.55 227.25" y="328.22" font-size="11.00" class="sc-loraregular">0.9</text><text x="236.51 247.51 258.51 269.51 280.51 291.51 302.51 313.51 324.51 335.51 346.51 357.51 368.51 379.51 390.51 401.51 412.51 423.51 434.51 445.51 456.51 467.51 478.51 489.51" y="328.22" font-size="11.00" class="sc-notoserifcjksc">的界线或未能完成评分。在本节中，我们展示多智能体</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="343.84" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82 161.82 172.82 183.82 194.82 205.82 216.82 227.82 238.82 249.82 260.82 271.82 282.82 293.82 304.82 315.82 326.82 337.82 348.82" y="343.84" font-size="11.00" class="sc-notoserifcjksc">的结果，并将其与单智能体配置进行比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="412.27" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一个固定的五智能体团</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="427.89" font-size="11.00" class="sc-notoserifcjksc">队，以及动态生成的异步子智能体（详见第</text><text x="283.89 290.08 292.78 296.79 302.69 305.40" y="427.89" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="314.25 325.25 336.25 347.25 358.25 369.25 380.25 391.25 402.25 413.25 424.25 435.25 446.25 457.25 468.25 479.25 490.25 501.25 512.25 523.25" y="427.89" font-size="11.00" class="sc-notoserifcjksc">节）。本节中的单智能体基线使用与多智能体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="443.51" font-size="11.00" class="sc-notoserifcjksc">配置相同的任务工具和评分方式，而非第</text><text x="272.89 279.08 281.78 285.79 292.44 295.15" y="443.51" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="302.04 313.04 324.04 335.04 346.04 357.04 368.04 379.04 390.04 401.04 412.04 423.04 434.04 445.04 456.04 467.04 478.04 489.04 500.04 511.04 522.04" y="443.51" font-size="11.00" class="sc-notoserifcjksc">节的运行框架，因此其分数与该节报告的分数不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="459.13" font-size="11.00" class="sc-notoserifcjksc">可直接比较。此外，第</text><text x="184.89 191.07 193.78 197.79 204.44 207.15" y="459.13" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="214.04 225.04 236.04 247.04 258.04 269.04 280.04 291.04 302.04 313.04 324.04 335.04 346.04 357.04 368.04" y="459.13" font-size="11.00" class="sc-notoserifcjksc">节中展示的单智能体配置使用的是</text><text x="381.94 385.94 396.04 398.93 403.19 409.62 415.45 421.42" y="459.13" font-size="11.00" class="sc-loraregular">1M token</text><text x="430.99 441.99 452.99 463.99 474.99 485.99 496.99 507.99 518.98 529.98" y="459.13" font-size="11.00" class="sc-notoserifcjksc">预算，而这里我们使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="474.75" font-size="11.00" class="sc-notoserifcjksc">上下文压缩和</text><text x="140.89 146.80 153.63 163.73 166.62 170.88 177.31 183.14 189.11" y="474.75" font-size="11.00" class="sc-loraregular">20M token</text><text x="198.68 209.68 220.68 231.68 242.68 253.68 264.68 275.68 286.68 297.68 308.68 319.68 330.68 341.68 352.68" y="474.75" font-size="11.00" class="sc-notoserifcjksc">预算，以确保多智能体团队更大的</text><text x="366.57 370.83 377.26 383.09 389.05" y="474.75" font-size="11.00" class="sc-loraregular">token</text><text x="398.62 409.62 420.62 431.62 442.62 453.62 464.62 475.62 486.62 497.62 508.62" y="474.75" font-size="11.00" class="sc-notoserifcjksc">消耗不会成为混杂因素。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="557.98" font-size="11.00" class="sc-notoserifcjksc">我们在一系列中间快照处进行评分，并利用由此得到的每个任务在分数、延迟和</text><text x="459.89 464.15 470.58 476.42 482.38" y="557.98" font-size="11.00" class="sc-loraregular">token</text><text x="491.95 502.95 513.95" y="557.98" font-size="11.00" class="sc-notoserifcjksc">上的轨</text><text x="72.00 83.00 94.00 105.00 116.00" y="573.60" font-size="11.00" class="sc-notoserifcjksc">迹，构建图</text><text x="129.89 136.08 138.78 142.79 148.69 151.40 155.40 158.11" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="167.89 178.89" y="573.60" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="192.78 198.96 201.67 205.67 211.58 214.28 218.29 220.99" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73 241.73 252.73 263.73 274.73 285.73 296.73 307.73 318.73 329.73 340.73 351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73 450.73 461.73 472.73 483.73 494.73 505.73" y="573.60" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。请注意，由于后勤方面的困难，本评估是在</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.85 110.56" y="589.22" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44 130.44 141.44 152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44" y="589.22" font-size="11.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fi 472.24 481.24 490.24 499.24 508.24 517.24 526.24" y="398.38" font-size="9.00" class="sc-notoserifcjksc">），根据各任务间的得分方差计</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">算得出。随着各题目完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点上仍在贡献数据的题目就越少。本评估是在</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.66 134.87" y="421.77" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15 151.15 160.15 169.15 178.15 187.15 196.15 205.15 214.15 223.15 232.15 241.15 250.15 259.15 268.15 277.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00 83.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">如图</text><text x="96.89 103.07 105.78 109.79 115.69 118.40 122.40 125.11" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="134.89 145.89 156.89 167.89 178.89 189.89 200.89 211.89 222.89 233.89 244.89 255.89 266.89 277.89 288.89 299.89 310.89 321.89 332.89 343.89 354.89 365.89 376.89 387.89 398.89 409.89 420.89 431.89 442.89 453.89 464.89 475.89 486.89 497.89 508.89 519.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">所示，在这些任务上，与单智能体相比，五智能体团队和异步子智能体在相同分数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">下都表现出延迟上的改善。具体而言，在达到相同的</text><text x="327.89 334.55 337.14" y="494.36" font-size="11.00" class="sc-loraregular">0.6</text><text x="346.40 357.40 368.40 379.40 390.40 401.40 412.40 423.40 434.40 445.40 456.40 467.40 478.40 489.40 500.40 511.40 522.40" y="494.36" font-size="11.00" class="sc-notoserifcjksc">分时，五智能体团队相比单智能体实现</text><text x="72.00" y="509.98" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 91.80 94.15 99.22" y="509.98" font-size="11.00" class="sc-loraregular">2.7x</text><text x="107.95 118.95 129.95 140.95 151.95 162.95 173.95 184.95 195.95 206.95 217.95 228.95 239.95 250.95 261.95 272.95 283.95 294.95 305.95 316.95 327.95 338.95 349.95 360.95 371.95 382.95 393.95 404.95 415.95 426.95 437.95 448.95 459.95 470.95 481.95 492.95 503.95 514.95 525.95" y="509.98" font-size="11.00" class="sc-notoserifcjksc">的延迟改善。异步子智能体的曲线大体位于两者之间，相比单智能体有所改善，但改善幅</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="525.59" font-size="11.00" class="sc-notoserifcjksc">度小于五智能体团队。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="72.00" y="386.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="386.67" font-size="9.00" class="sc-lorabold">8.12.1.B] 166</text><text x="138.13" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="386.67" font-size="9.00" class="sc-lorabold">“</text><text x="150.94 159.94" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 175.00 180.76 185.00 190.10 195.11 199.39 204.10 212.33 218.28 223.12 228.86 233.52" y="386.67" font-size="9.00" class="sc-lorabold">” ProgramBench</text><text x="241.48 250.48 259.48 268.48 277.48 286.48" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与</text><text x="297.85 301.56 306.62 311.74 316.58" y="386.67" font-size="9.00" class="sc-lorabold">token</text><text x="324.69 333.69 342.69 351.69" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">用量关系</text><text x="360.69 369.69 378.69 387.69 396.69 405.69 414.69 423.69 432.69 441.69 450.69 459.69 468.69 477.69 486.69 495.69 504.69 513.69 522.69" y="386.67" font-size="9.00" class="sc-notoserifcjksc">。曲线上的每个点表示：若每个问题都在该</text><text x="72.00 75.48 80.75 85.52 90.40" y="398.38" font-size="9.00" class="sc-loraregular">token</text><text x="98.23 107.23 116.23 125.23 134.23 143.23 152.23 161.23 170.23 179.23 188.23 197.23 206.23 215.23 224.23 233.23 242.23 251.23 260.23 269.23 278.23 287.23 296.23 305.23 314.23" y="398.38" font-size="9.00" class="sc-notoserifcjksc">用量处停止，隐藏测试平均能够通过的比例。阴影区域为</text><text x="325.59 330.80 335.70" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="345.90 354.90 363.90 372.90 381.90 390.90 399.90 408.90 417.90 426.90 435.90 444.90 453.90 462.90 471.90 480.90 489.90 498.90 507.90 516.90 525.90" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分方差计算。随着</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">问题陆续完成运行，阴影带逐渐变淡：阴影带越淡，说明在曲线该点上仍在贡献数据的问题越少。此项评估是在</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.66 134.87" y="421.77" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15 151.15 160.15 169.15 178.15 187.15 196.15 205.15 214.15 223.15 232.15 241.15 250.15 259.15 268.15 277.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00 83.00 94.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">结合图</text><text x="107.89 114.07 116.78 120.79 126.69 129.40 133.40 136.11" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="145.89 156.89 167.89 178.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">来看，图</text><text x="192.78 198.96 201.67 205.67 211.58 214.28 218.29 220.99" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73 241.73 252.73 263.73 274.73 285.73 296.73 307.73 318.73 329.73 340.73 351.73 362.73 373.73 384.73 395.73 406.73 417.73 428.73 439.73 450.73 461.73 472.73 483.73 494.73 505.73 516.73 527.73" y="478.73" font-size="11.00" class="sc-notoserifcjksc">进一步展示了多智能体运行框架中延迟与成本的权衡：当延迟很</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">重要时，五智能体团队和异步子智能体能够通过在智能体之间分配工作，有效地消化额外的</text><text x="72.00 76.26 82.69 88.52 94.48" y="509.98" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05 148.05 159.05 170.05 181.05 192.05 203.05 214.05 225.05 236.05 247.05 258.05 269.05 280.05 291.05 302.05 313.05 324.05" y="509.98" font-size="11.00" class="sc-notoserifcjksc">预算，从而以更高的成本更快地达到给定得分。</text><text x="72.00 80.36 83.74 88.44 95.91 99.29" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.2</text><text x="109.84 122.84 135.84 148.84" y="558.04" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="164.94 174.26 182.59 191.90 201.88" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">DRACO</text><text x="72.00 83.00 94.00 105.00" y="585.92" font-size="11.00" class="sc-notoserifcjksc">我们还在</text><text x="118.89 126.98 134.43 141.26 148.95" y="585.92" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57 171.57 182.57 193.57 204.57 215.57 226.57 237.57 248.57 259.57 270.57 281.57 292.57" y="585.92" font-size="11.00" class="sc-notoserifcjksc">上评估了小型多智能体团队。</text><text x="303.57 311.66 319.10 325.93 333.62" y="585.92" font-size="11.00" class="sc-loraregular">DRACO</text><text x="345.25 356.25 367.25 378.25 389.25 400.25 411.25 422.25 433.25 444.25 455.25 466.25 477.25" y="585.92" font-size="11.00" class="sc-notoserifcjksc">是一个深度研究基准测试，由</text><text x="491.14 495.15 501.98" y="585.92" font-size="11.00" class="sc-loraregular">100</text><text x="511.70 522.70" y="585.92" font-size="11.00" class="sc-notoserifcjksc">个精</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="601.54" font-size="11.00" class="sc-notoserifcjksc">选任务组成，这些任务源自多个领域的用户查询（更多细节见第</text><text x="382.89 389.08 391.78 395.79 399.79 402.49" y="601.54" font-size="11.00" class="sc-loraregular">8.11.2</text><text x="411.30 422.30 433.30 444.30 455.30 466.30 477.30 488.30 499.30 510.30 521.30" y="601.54" font-size="11.00" class="sc-notoserifcjksc">节）。这些问题包括前期</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="617.16" font-size="11.00" class="sc-notoserifcjksc">的网络研究和随后的报告生成，持续时间比</text><text x="283.89 290.56 295.24 301.68 307.76 312.45 318.12 327.89 334.74 340.70 347.37 353.23" y="617.16" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="362.71 373.71 384.71 395.71 406.71 417.71 428.71 439.71 450.71 461.71 472.71 483.71" y="617.16" font-size="11.00" class="sc-notoserifcjksc">短得多。单个任务的延迟在</text><text x="497.60 501.61" y="617.16" font-size="11.00" class="sc-loraregular">13</text><text x="510.63" y="617.16" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="524.52 529.59" y="617.16" font-size="11.00" class="sc-loraregular">71</text><text x="72.00 83.00 94.00 105.00 116.00" y="632.78" font-size="11.00" class="sc-notoserifcjksc">分钟之间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="681.42" font-size="11.00" class="sc-notoserifcjksc">我们发现，在此类较短的问题上，多智能体团队由于存在协调开销，完成任务所需的时间可能比</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="697.04" font-size="11.00" class="sc-notoserifcjksc">对应的单智能体更长。然而，多智能体团队的价值之一在于，当延迟</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是重要考量时，它们能加快工作的交付。因此，我们选择用这个数据集来考察多智能体团队如何</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">响应延迟激励。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们测试了两种不同的延迟激励。第一种是一般性的延迟压力：我们向</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="131.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">提供一条关于时</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">间效率重要性的指令，并在每一步之后显示累计已用时间。第二种是延迟预算：给</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="509.18 520.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">固定的时间窗口来完成工作。这种方式不提供指令，而是将预算与已用时间一并显示。我们取每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">个任务的单智能体延迟，并将其分别按</text><text x="261.89 265.90 268.44 275.27" y="178.05" font-size="11.00" class="sc-loraregular">1.0x</text><text x="281.10" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="292.10 298.75 301.11 306.18 312.17" y="178.05" font-size="11.00" class="sc-loraregular">0.75x</text><text x="318.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="329.00 335.66 338.37 344.36" y="178.05" font-size="11.00" class="sc-loraregular">0.5x</text><text x="353.08" y="178.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="366.98 373.63 376.34 382.24 388.24" y="178.05" font-size="11.00" class="sc-loraregular">0.25x</text><text x="396.96 407.96 418.96 429.96 440.96 451.96 462.96 473.96 484.96 495.96 506.96 517.96 528.96" y="178.05" font-size="11.00" class="sc-notoserifcjksc">缩放，得到时间预算。这样，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">每个任务都会得到一组按其自身完成时间缩放的预算。图</text><text x="349.89 356.08 358.78 362.79 368.69 371.40 377.31 380.01" y="193.67" font-size="11.00" class="sc-loraregular">8.12.2.A</text><text x="389.79 400.79 411.79 422.79 433.79 444.79 455.79 466.79 477.79 488.79" y="193.67" font-size="11.00" class="sc-notoserifcjksc">展示了该实验的结果。</text><text x="72.00" y="573.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 129.61 135.78 141.62 147.81" y="573.89" font-size="9.00" class="sc-lorabold">8.12.2.A] DRACO</text><text x="157.10 166.10 175.10 184.10 193.10 202.10 211.10 220.10 229.10 238.10 247.10" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与延迟关系。</text><text x="256.10 265.10 274.10 283.10 292.10 301.10 310.10 319.10 328.10 337.10 346.10" y="573.89" font-size="9.00" class="sc-notoserifcjksc">多智能体团队主导了得分</text><text x="355.10" y="573.89" font-size="9.00" class="sc-loraregular">–</text><text x="360.40 369.40 378.40 387.40 396.40 405.40 414.40 423.40 432.40 441.40 450.40 459.40 468.40 477.40 486.40 495.40 504.40 513.41 522.41 531.41" y="573.89" font-size="9.00" class="sc-notoserifcjksc">延迟帕累托前沿。每个点为两次运行的均值；</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="585.59" font-size="9.00" class="sc-notoserifcjksc">延迟为每个任务的平均推导延迟（见第</text><text x="227.37 232.43 234.64 237.92 242.75 244.96" y="585.59" font-size="9.00" class="sc-loraregular">8.12.5</text><text x="252.23 261.23 270.23" y="585.59" font-size="9.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="612.94" font-size="11.00" class="sc-notoserifcjksc">尽管在没有时间压力时多智能体团队速度较慢，但随着时间预算越来越紧，它们主导了得分</text><text x="512.00" y="612.94" font-size="11.00" class="sc-loraregular">–</text><text x="518.49 529.49" y="612.94" font-size="11.00" class="sc-notoserifcjksc">延迟</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="628.56" font-size="11.00" class="sc-notoserifcjksc">帕累托前沿。在</text><text x="151.89 158.55 161.25 167.25" y="628.56" font-size="11.00" class="sc-loraregular">0.5x</text><text x="175.97 186.97 197.97 208.97 219.97 230.97 241.97 252.97 263.97 274.97 285.97 296.97 307.97 318.97 329.97 340.97 351.97 362.97 373.97 384.97 395.97 406.97 417.97 428.97 439.97 450.97 461.97 472.97 483.97 494.97 505.97" y="628.56" font-size="11.00" class="sc-notoserifcjksc">的延迟预算下，五智能体团队能够超过单智能体的表现，且加速比约为</text><text x="72.00 77.91 80.61 86.79" y="644.18" font-size="11.00" class="sc-loraregular">2.8x</text><text x="92.62 103.62 114.62 125.62 136.62 147.62 158.62 169.62 180.62 191.62 202.62 213.62 224.62 235.62 246.62 257.62 268.62 279.62 290.62 301.62 312.62 323.62 334.62 345.62 356.62 367.62 378.62 389.62 400.62 411.62 422.62 433.62 444.62 455.62 466.62 477.62 488.62 499.62 510.62 521.62" y="644.18" font-size="11.00" class="sc-notoserifcjksc">。当无法预先估计合理的预算时，延迟压力也会促使两种多智能体团队都比未加提示的单智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="659.80" font-size="11.00" class="sc-notoserifcjksc">能体更早完成任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt;contain-intrinsic-size:612pt 792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="504.00 507.28 512.48" y="751.80" font-size="9.00" class="sc-loraregular">193</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">所有这些运行均采用</text><text x="173.89 180.49 187.09" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="196.59 207.59 218.59 229.59 240.59 251.59 262.59 273.59 284.59 295.59 306.59 317.59 328.59 339.59 350.59 361.59 372.59 383.59 394.59 405.59 416.59 427.59 438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度。需要注意的是，虽然降低推理强度和收紧延迟预算都能降低</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">任务延迟，但这两个调节手段对多智能体行为的影响有本质不同。前者导致总体工作量减少，而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">后者通过维持更高的有效并行度，在给定延迟下保留了更多工作。即使在固定团队中也是如此，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">固定团队表现出的空闲更少。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="180.28" font-size="11.00" class="sc-notoserifcjksc">对于异步子智能体而言，这种更高的有效并行度存在上限。在更紧的延迟预算下，派生新子智能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="195.90" font-size="11.00" class="sc-notoserifcjksc">体带来的协调与延迟开销变得足够大，以至于主智能体派生子智能体的频率大幅降低，并倾向于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.52" font-size="11.00" class="sc-notoserifcjksc">以单智能体方式行事。在发生这种崩塌的同一延迟水平上，预先派生的五智能体团队仍能保持高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="227.14" font-size="11.00" class="sc-notoserifcjksc">效的并行水平，这凸显了在该延迟尺度下预先派生的智能体团队的优势。</text><text x="72.00 80.36 83.74 88.45 95.91 99.29" y="291.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.3</text><text x="110.17 123.17 136.17 149.17 162.17 175.17 188.17" y="291.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">大型智能体团队</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="319.86" font-size="11.00" class="sc-notoserifcjksc">许多高价值任务，例如开展科学研究、进行大规模软件工程项目以及经营企业，可能超出单个智</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="335.48" font-size="11.00" class="sc-notoserifcjksc">能体的能力范围，而需要由大型智能体团队（从数十个到数千个）来分解工作、协调与沟通。为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="351.10" font-size="11.00" class="sc-notoserifcjksc">了衡量模型在此类团队中的运作情况，我们围绕大型、复杂且贴近现实的任务构建了一套新的评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="366.72" font-size="11.00" class="sc-notoserifcjksc">估。每个任务支持</text><text x="162.89 166.90 173.73" y="366.72" font-size="11.00" class="sc-loraregular">100</text><text x="183.45 194.45 205.45 216.45 227.45 238.45 249.45 260.45 271.45 282.45 293.45 304.45 315.45 326.45 337.45 348.45 359.45 370.45 381.45 392.45 403.45 414.45 425.45 436.45 447.45 458.45 469.45 480.45 491.45 502.45 513.45 524.45" y="366.72" font-size="11.00" class="sc-notoserifcjksc">多个智能体并发工作。我们利用这些评估来衡量并提升在大型团队中运作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="382.34" font-size="11.00" class="sc-notoserifcjksc">的智能体的能力与对齐（</text><text x="193.00 198.68 201.67 204.76 210.84 217.52 227.35 233.32 239.89" y="382.34" font-size="11.00" class="sc-loraregular">alignment</text><text x="244.15 255.15" y="382.34" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="465.61" font-size="11.00" class="sc-notoserifcjksc">在此，我们展示其中两个任务的结果，并报告当团队规模从</text><text x="360.89" y="465.61" font-size="11.00" class="sc-loraregular">1</text><text x="367.79 378.79 389.79 400.79 411.79 422.79 433.79" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体增长到</text><text x="447.68 451.69 458.52" y="465.61" font-size="11.00" class="sc-loraregular">100</text><text x="468.24 479.24 490.24 501.24 512.24 523.24" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体、且</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="481.23" font-size="11.00" class="sc-notoserifcjksc">每个团队工作</text><text x="140.89 146.56" y="481.23" font-size="11.00" class="sc-loraregular">24</text><text x="155.41 166.41 177.41 188.41" y="481.23" font-size="11.00" class="sc-notoserifcjksc">小时时，</text><text x="199.41 207.10 210.09 215.70 222.27 228.85 234.81 237.70 246.44 253.01 259.57 264.67 267.56 273.55 276.26" y="481.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="285.15 296.15 307.15 318.15 329.15 340.15 351.15 362.15 373.15 384.15 395.15 406.15 417.15 428.15 439.15 450.15 461.15 472.15 483.15 494.15 505.15 516.15 527.15" y="481.23" font-size="11.00" class="sc-notoserifcjksc">的表现如何变化。（定量结果来自与发布版本略有不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="496.85" font-size="11.00" class="sc-notoserifcjksc">同的模型版本；表现相当。）第一个是知识库任务：智能体阅读一家公司的文档，并据此撰写一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="512.47" font-size="11.00" class="sc-notoserifcjksc">个带索引的笔记知识库；我们根据仅能查阅这些笔记的读者回答有关该公司问题的准确程度来为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="528.09" font-size="11.00" class="sc-notoserifcjksc">结果评分。第二个是数学形式化任务：智能体必须基于固定的陈述在</text><text x="404.89 411.25 417.19 422.87" y="528.09" font-size="11.00" class="sc-loraregular">Lean</text><text x="432.44 443.44 454.44 465.44 476.44 487.44 498.44 509.44 520.44" y="528.09" font-size="11.00" class="sc-notoserifcjksc">中证明一个具有挑战</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="543.71" font-size="11.00" class="sc-notoserifcjksc">性的定理，中间定理的形式化作为加权里程碑。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在这两个任务上，</text><text x="160.00 168.73 175.30 181.87 186.96 189.85 195.85 198.56" y="627.52" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在各个团队规模下均优于</text><text x="331.34 339.02 342.02 347.63 354.19 360.77 366.73 369.63 378.36 384.93 391.49 396.59 399.48" y="627.52" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="408.37" y="627.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="422.26 429.95 432.94 438.55 445.12 451.70 457.66 460.55 466.14 471.82 478.22 481.21 487.17 490.07 496.06 498.77" y="627.52" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="502.77 513.77 524.77" y="627.52" font-size="11.00" class="sc-notoserifcjksc">。在两</text><text x="72.00 83.00 94.00 105.00 116.00" y="643.14" font-size="11.00" class="sc-notoserifcjksc">个任务中，</text><text x="127.00 135.73 142.30 148.87 153.96 156.85 162.85 165.56" y="643.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44 185.44 196.44 207.44 218.44 229.44 240.44 251.44 262.44 273.44 284.44 295.44 306.44 317.44 328.44 339.44 350.44 361.44 372.44 383.44 394.44 405.44 416.44 427.44 438.44 449.44 460.44 471.44 482.44 493.44 504.44 515.44 526.44" y="643.14" font-size="11.00" class="sc-notoserifcjksc">在每一种团队规模下都优于这两个模型。对于所有模型，得分总体上随团队</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="658.76" font-size="11.00" class="sc-notoserifcjksc">规模增大而上升，但收益递减。</text></svg></div>

c">围）。</text></svg></div>
