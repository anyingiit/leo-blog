<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p189.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 189 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 86.92 92.08 98.15 103.67 106.20 108.83 112.35 114.81 117.34 119.97 125.32 129.18 131.81 136.97 139.69 142.15 144.78 147.83 153.19 159.33 164.70 170.36 173.41 175.87 178.49 184.55 188.81 194.66 200.19 204.44 209.60 218.48 224.70 230.11 236.18 241.50 247.49 249.99 252.61 259.60 264.76 270.83 273.46 276.18 281.33 287.40 292.93 298.90 304.05 309.53 314.95 317.58 326.52 332.36 338.34 343.76 346.48 351.11 353.73 357.99 363.41 369.23 375.20 378.01 380.72 386.70 389.33 395.30 399.56 405.40 410.93 415.19 420.35 429.28 433.91 436.54 439.92 444.18 450.03 458.96 461.59 466.22 471.54 475.80 480.88 484.75 490.07 495.87" y="704.45" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.51 122.82 129.03 134.60 140.04 145.46 151.24" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2605.03546.</text><text x="156.33 162.22 166.19 170.06 176.03 180.66 183.16 186.84 193.30 198.46 202.79 208.08 210.89 215.55 218.01 223.86 228.14 233.66 240.12 245.28 251.10 255.38 262.27 267.64 273.42 279.63 285.07 287.38 293.59 299.16 304.61 310.02" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.03546</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">189</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="110.77" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89" y="110.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="215.63" y="110.77" font-size="11.00" class="sc-notoserifcjksc">在多智能体配置下的性能。下文中，我们重点介绍小型团队相对于</text><text x="72.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">单智能体在</text><text x="129.89" y="126.39" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="205.82" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="230.71" y="126.39" font-size="11.00" class="sc-loraregular">8.12.1</text><text x="259.11" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）和</text><text x="295.00" y="126.39" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="333.79" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="358.68" y="126.39" font-size="11.00" class="sc-loraregular">8.12.2</text><text x="388.99" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）上的优势，并讨论大型团</text><text x="72.00" y="142.01" font-size="11.00" class="sc-notoserifcjksc">队协作解决更宏大问题的初显潜力（第</text><text x="261.89" y="142.01" font-size="11.00" class="sc-loraregular">8.12.3</text><text x="292.42" y="142.01" font-size="11.00" class="sc-notoserifcjksc">节）。我们还介绍了获得这些结果所用的多智能体</text><text x="72.00" y="157.63" font-size="11.00" class="sc-notoserifcjksc">运行框架（第</text><text x="140.89" y="157.63" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="171.25" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）以及测量方法（第</text><text x="284.15" y="157.63" font-size="11.00" class="sc-loraregular">8.12.5</text><text x="314.54" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1</text><text x="107.09" y="222.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="162.18" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">ProgramBench</text><text x="72.00" y="250.12" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="246.46" font-size="6.60" class="sc-loraregular">22</text><text x="157.90" y="250.12" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="215.80" y="250.12" font-size="11.00" class="sc-loraregular">200</text><text x="238.26" y="250.12" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体只获得一个由开源</text><text x="72.00" y="265.74" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不访问互联网、不使用反编译工具的情况</text><text x="72.00" y="281.36" font-size="11.00" class="sc-notoserifcjksc">下重建一个能复现原程序行为的代码库。我们使用</text><text x="316.89" y="281.36" font-size="11.00" class="sc-loraregular">166</text><text x="336.51" y="281.36" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="347.51" y="281.36" font-size="11.00" class="sc-loraregular">“</text><text x="351.91" y="281.36" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="373.91" y="281.36" font-size="11.00" class="sc-loraregular">”</text><text x="377.75" y="281.36" font-size="11.00" class="sc-notoserifcjksc">任务，每个任务的参考二进制文</text><text x="72.00" y="296.98" font-size="11.00" class="sc-notoserifcjksc">件在隐藏测试套件上的得分至少为</text><text x="239.89" y="296.98" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="255.61" y="296.98" font-size="11.00" class="sc-notoserifcjksc">。这与第</text><text x="302.51" y="296.98" font-size="11.00" class="sc-loraregular sc-k">8.10.1</text><text x="331.66" y="296.98" font-size="11.00" class="sc-notoserifcjksc">节所述的标准相同，但本节的任务列表与该</text><text x="72.00" y="312.60" font-size="11.00" class="sc-notoserifcjksc">节的列表有四个任务不同，因为两份列表是根据参考二进制文件的不同运行汇编而成的，在这些</text><text x="72.00" y="328.22" font-size="11.00" class="sc-notoserifcjksc">运行之间，有少数任务越过了</text><text x="217.89" y="328.22" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="236.51" y="328.22" font-size="11.00" class="sc-notoserifcjksc">的界线或未能完成评分。在本节中，我们展示多智能体</text><text x="72.00" y="343.84" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="150.82" y="343.84" font-size="11.00" class="sc-notoserifcjksc">的结果，并将其与单智能体配置进行比较。</text><text x="72.00" y="412.27" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一个固定的五智能体团</text><text x="72.00" y="427.89" font-size="11.00" class="sc-notoserifcjksc">队，以及动态生成的异步子智能体（详见第</text><text x="283.89" y="427.89" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="314.25" y="427.89" font-size="11.00" class="sc-notoserifcjksc">节）。本节中的单智能体基线使用与多智能体</text><text x="72.00" y="443.51" font-size="11.00" class="sc-notoserifcjksc">配置相同的任务工具和评分方式，而非第</text><text x="272.89" y="443.51" font-size="11.00" class="sc-loraregular sc-k">8.10.1</text><text x="302.04" y="443.51" font-size="11.00" class="sc-notoserifcjksc">节的运行框架，因此其分数与该节报告的分数不</text><text x="72.00" y="459.13" font-size="11.00" class="sc-notoserifcjksc">可直接比较。此外，第</text><text x="184.89" y="459.13" font-size="11.00" class="sc-loraregular sc-k">8.10.1</text><text x="214.04" y="459.13" font-size="11.00" class="sc-notoserifcjksc">节中展示的单智能体配置使用的是</text><text x="381.94" y="459.13" font-size="11.00" class="sc-loraregular sc-k">1M token</text><text x="430.99" y="459.13" font-size="11.00" class="sc-notoserifcjksc">预算，而这里我们使用</text><text x="72.00" y="474.75" font-size="11.00" class="sc-notoserifcjksc">上下文压缩和</text><text x="140.89" y="474.75" font-size="11.00" class="sc-loraregular sc-k">20M token</text><text x="198.68" y="474.75" font-size="11.00" class="sc-notoserifcjksc">预算，以确保多智能体团队更大的</text><text x="366.57" y="474.75" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="398.62" y="474.75" font-size="11.00" class="sc-notoserifcjksc">消耗不会成为混杂因素。</text><text x="72.00" y="557.98" font-size="11.00" class="sc-notoserifcjksc">我们在一系列中间快照处进行评分，并利用由此得到的每个任务在分数、延迟和</text><text x="459.89" y="557.98" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="491.95" y="557.98" font-size="11.00" class="sc-notoserifcjksc">上的轨</text><text x="72.00" y="573.60" font-size="11.00" class="sc-notoserifcjksc">迹，构建图</text><text x="129.89" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="167.89" y="573.60" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="192.78" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73" y="573.60" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。请注意，由于后勤方面的困难，本评估是在</text><text x="72.00" y="589.22" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="589.22" font-size="11.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p190.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 190 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="72.00" y="386.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="386.67" font-size="9.00" class="sc-lorabold">8.12.1.A] 166</text><text x="138.13" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="386.67" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94" y="386.67" font-size="9.00" class="sc-lorabold sc-k">” ProgramBench</text><text x="241.48" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟关系。</text><text x="349.48" y="386.67" font-size="9.00" class="sc-notoserifcjksc">曲线上的单个点表示：如果每道题都在该秒数处</text><text x="72.00" y="398.38" font-size="9.00" class="sc-notoserifcjksc">停止，隐藏测试的平均通过比例。阴影区域表示</text><text x="263.37" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="283.67" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="409.24" y="398.38" font-size="9.00" class="sc-notoserifcjksc">），根据各任务间的得分方差计</text><text x="72.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">算得出。随着各题目完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点上仍在贡献数据的题目就越少。本评估是在</text><text x="72.00" y="421.77" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="142.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">如图</text><text x="96.89" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="134.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">所示，在这些任务上，与单智能体相比，五智能体团队和异步子智能体在相同分数</text><text x="72.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">下都表现出延迟上的改善。具体而言，在达到相同的</text><text x="327.89" y="494.36" font-size="11.00" class="sc-loraregular sc-k">0.6</text><text x="346.40" y="494.36" font-size="11.00" class="sc-notoserifcjksc">分时，五智能体团队相比单智能体实现</text><text x="72.00" y="509.98" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89" y="509.98" font-size="11.00" class="sc-loraregular sc-k">2.7x</text><text x="107.95" y="509.98" font-size="11.00" class="sc-notoserifcjksc">的延迟改善。异步子智能体的曲线大体位于两者之间，相比单智能体有所改善，但改善幅</text><text x="72.00" y="525.59" font-size="11.00" class="sc-notoserifcjksc">度小于五智能体团队。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="72.00" y="386.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="386.67" font-size="9.00" class="sc-lorabold sc-k">8.12.1.B] 166</text><text x="138.13" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="386.67" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94" y="386.67" font-size="9.00" class="sc-lorabold sc-k">” ProgramBench</text><text x="241.48" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与</text><text x="297.85" y="386.67" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="324.69" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">用量关系</text><text x="360.69" y="386.67" font-size="9.00" class="sc-notoserifcjksc">。曲线上的每个点表示：若每个问题都在该</text><text x="72.00" y="398.38" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="98.23" y="398.38" font-size="9.00" class="sc-notoserifcjksc">用量处停止，隐藏测试平均能够通过的比例。阴影区域为</text><text x="325.59" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="345.90" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分方差计算。随着</text><text x="72.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">问题陆续完成运行，阴影带逐渐变淡：阴影带越淡，说明在曲线该点上仍在贡献数据的问题越少。此项评估是在</text><text x="72.00" y="421.77" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="142.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">结合图</text><text x="107.89" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="145.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">来看，图</text><text x="192.78" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73" y="478.73" font-size="11.00" class="sc-notoserifcjksc">进一步展示了多智能体运行框架中延迟与成本的权衡：当延迟很</text><text x="72.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">重要时，五智能体团队和异步子智能体能够通过在智能体之间分配工作，有效地消化额外的</text><text x="72.00" y="509.98" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="509.98" font-size="11.00" class="sc-notoserifcjksc">预算，从而以更高的成本更快地达到给定得分。</text><text x="72.00" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.2</text><text x="109.84" y="558.04" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="164.94" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">DRACO</text><text x="72.00" y="585.92" font-size="11.00" class="sc-notoserifcjksc">我们还在</text><text x="118.89" y="585.92" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="160.57" y="585.92" font-size="11.00" class="sc-notoserifcjksc">上评估了小型多智能体团队。</text><text x="303.57" y="585.92" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="345.25" y="585.92" font-size="11.00" class="sc-notoserifcjksc">是一个深度研究基准测试，由</text><text x="491.14" y="585.92" font-size="11.00" class="sc-loraregular">100</text><text x="511.70" y="585.92" font-size="11.00" class="sc-notoserifcjksc">个精</text><text x="72.00" y="601.54" font-size="11.00" class="sc-notoserifcjksc">选任务组成，这些任务源自多个领域的用户查询（更多细节见第</text><text x="382.89" y="601.54" font-size="11.00" class="sc-loraregular">8.11.2</text><text x="411.30" y="601.54" font-size="11.00" class="sc-notoserifcjksc">节）。这些问题包括前期</text><text x="72.00" y="617.16" font-size="11.00" class="sc-notoserifcjksc">的网络研究和随后的报告生成，持续时间比</text><text x="283.89" y="617.16" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="362.71" y="617.16" font-size="11.00" class="sc-notoserifcjksc">短得多。单个任务的延迟在</text><text x="497.60" y="617.16" font-size="11.00" class="sc-loraregular">13</text><text x="510.63" y="617.16" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="524.52" y="617.16" font-size="11.00" class="sc-loraregular">71</text><text x="72.00" y="632.78" font-size="11.00" class="sc-notoserifcjksc">分钟之间。</text><text x="72.00" y="681.42" font-size="11.00" class="sc-notoserifcjksc">我们发现，在此类较短的问题上，多智能体团队由于存在协调开销，完成任务所需的时间可能比</text><text x="72.00" y="697.04" font-size="11.00" class="sc-notoserifcjksc">对应的单智能体更长。然而，多智能体团队的价值之一在于，当延迟</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是重要考量时，它们能加快工作的交付。因此，我们选择用这个数据集来考察多智能体团队如何</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">响应延迟激励。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们测试了两种不同的延迟激励。第一种是一般性的延迟压力：我们向</text><text x="415.89" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="454.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">提供一条关于时</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">间效率重要性的指令，并在每一步之后显示累计已用时间。第二种是延迟预算：给</text><text x="470.89" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="509.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">固定的时间窗口来完成工作。这种方式不提供指令，而是将预算与已用时间一并显示。我们取每</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">个任务的单智能体延迟，并将其分别按</text><text x="261.89" y="178.05" font-size="11.00" class="sc-loraregular sc-k">1.0x</text><text x="281.10" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="292.10" y="178.05" font-size="11.00" class="sc-loraregular sc-k">0.75x</text><text x="318.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="329.00" y="178.05" font-size="11.00" class="sc-loraregular sc-k">0.5x</text><text x="353.08" y="178.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="366.98" y="178.05" font-size="11.00" class="sc-loraregular sc-k">0.25x</text><text x="396.96" y="178.05" font-size="11.00" class="sc-notoserifcjksc">缩放，得到时间预算。这样，</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">每个任务都会得到一组按其自身完成时间缩放的预算。图</text><text x="349.89" y="193.67" font-size="11.00" class="sc-loraregular">8.12.2.A</text><text x="389.79" y="193.67" font-size="11.00" class="sc-notoserifcjksc">展示了该实验的结果。</text><text x="72.00" y="573.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 129.61 135.78 141.62 147.81" y="573.89" font-size="9.00" class="sc-lorabold">8.12.2.A] DRACO</text><text x="157.10" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与延迟关系。</text><text x="256.10" y="573.89" font-size="9.00" class="sc-notoserifcjksc">多智能体团队主导了得分</text><text x="355.10" y="573.89" font-size="9.00" class="sc-loraregular">–</text><text x="360.40" y="573.89" font-size="9.00" class="sc-notoserifcjksc">延迟帕累托前沿。每个点为两次运行的均值；</text><text x="72.00" y="585.59" font-size="9.00" class="sc-notoserifcjksc">延迟为每个任务的平均推导延迟（见第</text><text x="227.37" y="585.59" font-size="9.00" class="sc-loraregular">8.12.5</text><text x="252.23" y="585.59" font-size="9.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="612.94" font-size="11.00" class="sc-notoserifcjksc">尽管在没有时间压力时多智能体团队速度较慢，但随着时间预算越来越紧，它们主导了得分</text><text x="512.00" y="612.94" font-size="11.00" class="sc-loraregular">–</text><text x="518.49" y="612.94" font-size="11.00" class="sc-notoserifcjksc">延迟</text><text x="72.00" y="628.56" font-size="11.00" class="sc-notoserifcjksc">帕累托前沿。在</text><text x="151.89" y="628.56" font-size="11.00" class="sc-loraregular sc-k">0.5x</text><text x="175.97" y="628.56" font-size="11.00" class="sc-notoserifcjksc">的延迟预算下，五智能体团队能够超过单智能体的表现，且加速比约为</text><text x="72.00" y="644.18" font-size="11.00" class="sc-loraregular">2.8x</text><text x="92.62" y="644.18" font-size="11.00" class="sc-notoserifcjksc">。当无法预先估计合理的预算时，延迟压力也会促使两种多智能体团队都比未加提示的单智</text><text x="72.00" y="659.80" font-size="11.00" class="sc-notoserifcjksc">能体更早完成任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">193</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">所有这些运行均采用</text><text x="173.89" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="196.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度。需要注意的是，虽然降低推理强度和收紧延迟预算都能降低</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">任务延迟，但这两个调节手段对多智能体行为的影响有本质不同。前者导致总体工作量减少，而</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">后者通过维持更高的有效并行度，在给定延迟下保留了更多工作。即使在固定团队中也是如此，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">固定团队表现出的空闲更少。</text><text x="72.00" y="180.28" font-size="11.00" class="sc-notoserifcjksc">对于异步子智能体而言，这种更高的有效并行度存在上限。在更紧的延迟预算下，派生新子智能</text><text x="72.00" y="195.90" font-size="11.00" class="sc-notoserifcjksc">体带来的协调与延迟开销变得足够大，以至于主智能体派生子智能体的频率大幅降低，并倾向于</text><text x="72.00" y="211.52" font-size="11.00" class="sc-notoserifcjksc">以单智能体方式行事。在发生这种崩塌的同一延迟水平上，预先派生的五智能体团队仍能保持高</text><text x="72.00" y="227.14" font-size="11.00" class="sc-notoserifcjksc">效的并行水平，这凸显了在该延迟尺度下预先派生的智能体团队的优势。</text><text x="72.00" y="291.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.3</text><text x="110.17" y="291.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">大型智能体团队</text><text x="72.00" y="319.86" font-size="11.00" class="sc-notoserifcjksc">许多高价值任务，例如开展科学研究、进行大规模软件工程项目以及经营企业，可能超出单个智</text><text x="72.00" y="335.48" font-size="11.00" class="sc-notoserifcjksc">能体的能力范围，而需要由大型智能体团队（从数十个到数千个）来分解工作、协调与沟通。为</text><text x="72.00" y="351.10" font-size="11.00" class="sc-notoserifcjksc">了衡量模型在此类团队中的运作情况，我们围绕大型、复杂且贴近现实的任务构建了一套新的评</text><text x="72.00" y="366.72" font-size="11.00" class="sc-notoserifcjksc">估。每个任务支持</text><text x="162.89" y="366.72" font-size="11.00" class="sc-loraregular">100</text><text x="183.45" y="366.72" font-size="11.00" class="sc-notoserifcjksc">多个智能体并发工作。我们利用这些评估来衡量并提升在大型团队中运作</text><text x="72.00" y="382.34" font-size="11.00" class="sc-notoserifcjksc">的智能体的能力与对齐（</text><text x="193.00" y="382.34" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="244.15" y="382.34" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="465.61" font-size="11.00" class="sc-notoserifcjksc">在此，我们展示其中两个任务的结果，并报告当团队规模从</text><text x="360.89" y="465.61" font-size="11.00" class="sc-loraregular">1</text><text x="367.79" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体增长到</text><text x="447.68" y="465.61" font-size="11.00" class="sc-loraregular">100</text><text x="468.24" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体、且</text><text x="72.00" y="481.23" font-size="11.00" class="sc-notoserifcjksc">每个团队工作</text><text x="140.89" y="481.23" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="155.41" y="481.23" font-size="11.00" class="sc-notoserifcjksc">小时时，</text><text x="199.41" y="481.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="285.15" y="481.23" font-size="11.00" class="sc-notoserifcjksc">的表现如何变化。（定量结果来自与发布版本略有不</text><text x="72.00" y="496.85" font-size="11.00" class="sc-notoserifcjksc">同的模型版本；表现相当。）第一个是知识库任务：智能体阅读一家公司的文档，并据此撰写一</text><text x="72.00" y="512.47" font-size="11.00" class="sc-notoserifcjksc">个带索引的笔记知识库；我们根据仅能查阅这些笔记的读者回答有关该公司问题的准确程度来为</text><text x="72.00" y="528.09" font-size="11.00" class="sc-notoserifcjksc">结果评分。第二个是数学形式化任务：智能体必须基于固定的陈述在</text><text x="404.89" y="528.09" font-size="11.00" class="sc-loraregular sc-k">Lean</text><text x="432.44" y="528.09" font-size="11.00" class="sc-notoserifcjksc">中证明一个具有挑战</text><text x="72.00" y="543.71" font-size="11.00" class="sc-notoserifcjksc">性的定理，中间定理的形式化作为加权里程碑。</text><text x="72.00" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在这两个任务上，</text><text x="160.00" y="627.52" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="207.44" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在各个团队规模下均优于</text><text x="331.34" y="627.52" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="408.37" y="627.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="422.26" y="627.52" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="502.77" y="627.52" font-size="11.00" class="sc-notoserifcjksc">。在两</text><text x="72.00" y="643.14" font-size="11.00" class="sc-notoserifcjksc">个任务中，</text><text x="127.00" y="643.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44" y="643.14" font-size="11.00" class="sc-notoserifcjksc">在每一种团队规模下都优于这两个模型。对于所有模型，得分总体上随团队</text><text x="72.00" y="658.76" font-size="11.00" class="sc-notoserifcjksc">规模增大而上升，但收益递减。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.31" y="367.92" font-size="9.00" class="sc-lorabold">8.12.3.A]</text><text x="123.15" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">知识库构建任务准确率随智能体团队规模的变化。</text><text x="321.15" y="367.92" font-size="9.00" class="sc-notoserifcjksc">数据点表示指定规模的智能体团队在</text><text x="467.51" y="367.92" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="479.39" y="367.92" font-size="9.00" class="sc-notoserifcjksc">小时窗口内取</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">得的结果，为三次独立尝试的平均值。表现反映的是仅依赖团队生成文档的读者正确回答的留出问题所占比例（</text><text x="513.00" y="379.62" font-size="9.00" class="sc-loraregular">0–1</text><text x="529.54" y="379.62" font-size="9.00" class="sc-notoserifcjksc">范</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">围）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="367.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.17" font-size="9.00" class="sc-lorabold sc-k">8.12.3.B] Lean</text><text x="146.25" y="367.17" font-size="9.00" class="sc-notoserifcjkscbold">形式化任务准确率随智能体团队规模的变化。</text><text x="326.25" y="367.17" font-size="9.00" class="sc-notoserifcjksc">数据点表示指定规模的智能体团队在</text><text x="472.62" y="367.17" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="484.50" y="367.17" font-size="9.00" class="sc-notoserifcjksc">小时窗口内取</text><text x="72.00" y="378.88" font-size="9.00" class="sc-notoserifcjksc">得的结果，为三次独立尝试的平均值。表现反映的是</text><text x="281.37" y="378.88" font-size="9.00" class="sc-loraregular">49</text><text x="293.81" y="378.88" font-size="9.00" class="sc-notoserifcjksc">个形式化定理证明中被</text><text x="386.18" y="378.88" font-size="9.00" class="sc-loraregular sc-k">Lean</text><text x="408.72" y="378.88" font-size="9.00" class="sc-notoserifcjksc">环境成功验证的加权比例（</text><text x="516.72" y="378.88" font-size="9.00" class="sc-loraregular">0–1</text><text x="72.00" y="390.58" font-size="9.00" class="sc-notoserifcjksc">范围）。</text><text x="72.00" y="432.73" font-size="11.00" class="sc-notoserifcjksc">当我们观察</text><text x="129.89" y="432.73" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="144.41" y="432.73" font-size="11.00" class="sc-notoserifcjksc">小时窗口内部的情况时，</text><text x="265.41" y="432.73" font-size="11.00" class="sc-loraregular">10</text><text x="279.14" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个、</text><text x="301.14" y="432.73" font-size="11.00" class="sc-loraregular">30</text><text x="316.99" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个和</text><text x="341.89" y="432.73" font-size="11.00" class="sc-loraregular">100</text><text x="362.44" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个智能体之间的差异变得更加明显。</text><text x="72.00" y="448.36" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="448.36" font-size="11.00" class="sc-loraregular">8.12.3.C</text><text x="126.81" y="448.36" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="151.71" y="448.36" font-size="11.00" class="sc-loraregular">8.12.3.D</text><text x="193.13" y="448.36" font-size="11.00" class="sc-notoserifcjksc">展示了</text><text x="229.02" y="448.36" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.47" y="448.36" font-size="11.00" class="sc-notoserifcjksc">在不同团队规模下、于两小时、六小时和</text><text x="477.36" y="448.36" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="491.88" y="448.36" font-size="11.00" class="sc-notoserifcjksc">小时时间</text><text x="72.00" y="463.98" font-size="11.00" class="sc-notoserifcjksc">点在这两个任务上的表现。更大的团队会早得多地达到给定的表现水平，因此即使</text><text x="470.89" y="463.98" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="485.41" y="463.98" font-size="11.00" class="sc-notoserifcjksc">小时得分相</text><text x="72.00" y="479.60" font-size="11.00" class="sc-notoserifcjksc">近，扩大团队规模也能大幅缩短完成任务所需的时间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p196.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 196 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">196</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="366.99" font-size="9.00" class="sc-lorabold">8.12.3.C]</text><text x="123.80" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">知识库：两小时、六小时和</text><text x="234.17" y="366.99" font-size="9.00" class="sc-lorabold">24</text><text x="246.26" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">小时内的得分。</text><text x="309.26" y="366.99" font-size="9.00" class="sc-notoserifcjksc">每个点表示该规模的</text><text x="392.62" y="366.99" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="462.77" y="366.99" font-size="9.00" class="sc-notoserifcjksc">团队截至该时间点</text><text x="72.00" y="378.69" font-size="9.00" class="sc-notoserifcjksc">所达到的最佳得分，为三次独立的</text><text x="209.37" y="378.69" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="221.25" y="378.69" font-size="9.00" class="sc-notoserifcjksc">小时运行的平均值。得分为读者仅使用团队笔记正确回答的留出问题比例。注意</text><text x="72.00" y="390.39" font-size="9.00" class="sc-loraregular">y</text><text x="79.12" y="390.39" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="99.49" y="390.39" font-size="9.00" class="sc-loraregular sc-k">0.3</text><text x="114.53" y="390.39" font-size="9.00" class="sc-notoserifcjksc">开始，因此差异在视觉上被放大。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p197.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 197 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">197</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.92" font-size="9.00" class="sc-lorabold sc-k">8.12.3.D] Lean</text><text x="147.10" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">定理证明：两小时、六小时和</text><text x="266.46" y="367.92" font-size="9.00" class="sc-lorabold">24</text><text x="278.55" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">小时内的得分。</text><text x="341.55" y="367.92" font-size="9.00" class="sc-notoserifcjksc">每个点表示该规模的</text><text x="424.92" y="367.92" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="495.06" y="367.92" font-size="9.00" class="sc-notoserifcjksc">团队截至该</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">时间点所达到的最佳得分，为三次独立的</text><text x="236.37" y="379.62" font-size="9.00" class="sc-loraregular sc-k">24</text><text x="248.25" y="379.62" font-size="9.00" class="sc-notoserifcjksc">小时运行的平均值。得分为</text><text x="358.61" y="379.62" font-size="9.00" class="sc-loraregular">49</text><text x="371.06" y="379.62" font-size="9.00" class="sc-notoserifcjksc">个定理陈述中其证明经</text><text x="463.43" y="379.62" font-size="9.00" class="sc-loraregular sc-k">Lean</text><text x="485.96" y="379.62" font-size="9.00" class="sc-notoserifcjksc">内核验证的加</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">权占比（</text><text x="108.00" y="391.33" font-size="9.00" class="sc-loraregular">0–1</text><text x="122.18" y="391.33" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="420.23" font-size="11.00" class="sc-notoserifcjksc">我们使用固定团队运行框架（见第</text><text x="239.89" y="420.23" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="270.25" y="420.23" font-size="11.00" class="sc-notoserifcjksc">节）：一个主智能体和</text><text x="383.15" y="420.23" font-size="11.00" class="sc-loraregular sc-k">N−1</text><text x="403.97" y="420.23" font-size="11.00" class="sc-notoserifcjksc">个辅助智能体同时启动，均</text><text x="72.00" y="435.86" font-size="11.00" class="sc-notoserifcjksc">获得完整任务，在一台无网络访问的共享</text><text x="272.89" y="435.86" font-size="11.00" class="sc-loraregular">Linux</text><text x="304.31" y="435.86" font-size="11.00" class="sc-notoserifcjksc">机器上并发工作，最长</text><text x="417.20" y="435.86" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="431.72" y="435.86" font-size="11.00" class="sc-notoserifcjksc">小时。每个智能体拥</text><text x="72.00" y="451.48" font-size="11.00" class="sc-notoserifcjksc">有一个</text><text x="107.89" y="451.48" font-size="11.00" class="sc-loraregular">shell</text><text x="131.52" y="451.48" font-size="11.00" class="sc-notoserifcjksc">、一个文件编辑器和两个消息工具（</text><text x="307.52" y="451.48" font-size="11.00" class="sc-loraregular sc-k">Send Message</text><text x="382.60" y="451.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="396.49" y="451.48" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="484.69" y="451.48" font-size="11.00" class="sc-notoserifcjksc">）。任何智</text><text x="72.00" y="467.10" font-size="11.00" class="sc-notoserifcjksc">能体都可以直接向其他任何智能体发送消息。团队的工作保存在一个共享的</text><text x="437.89" y="467.10" font-size="11.00" class="sc-loraregular sc-k">Git</text><text x="456.68" y="467.10" font-size="11.00" class="sc-notoserifcjksc">仓库中，该仓库</text><text x="72.00" y="482.71" font-size="11.00" class="sc-notoserifcjksc">用于为任务表现评分。模型被指示使用终端命令查看时间并据此做好计划。</text><text x="72.00" y="549.77" font-size="11.00" class="sc-notoserifcjksc">在本节最后，我们介绍一个有趣的定性观察：两个任务上涌现出了不同的组织结构。阅读</text><text x="503.89" y="549.77" font-size="11.00" class="sc-loraregular">100</text><text x="524.45" y="549.77" font-size="11.00" class="sc-notoserifcjksc">智</text><text x="72.00" y="565.39" font-size="11.00" class="sc-notoserifcjksc">能体团队的对话记录后，我们发现</text><text x="239.89" y="565.39" font-size="11.00" class="sc-loraregular sc-k">Lean</text><text x="267.44" y="565.39" font-size="11.00" class="sc-notoserifcjksc">团队将自身组织为两个层级：主智能体任命了十二个子</text><text x="72.00" y="581.01" font-size="11.00" class="sc-notoserifcjksc">主智能体并与它们保持联系，而每个子主智能体向自己的一组辅助智能体分派工作并向上汇报。</text><text x="72.00" y="596.63" font-size="11.00" class="sc-notoserifcjksc">相比之下，知识库团队保持扁平结构：主智能体在任务开始时将记录分配给各辅助智能体，此后</text><text x="72.00" y="612.25" font-size="11.00" class="sc-notoserifcjksc">每个辅助智能体负责知识库中属于自己的部分，并且在运行的剩余时间里，辅助智能体之间的相</text><text x="72.00" y="627.87" font-size="11.00" class="sc-notoserifcjksc">互沟通相对较少。</text><text x="160.00" y="627.87" font-size="11.00" class="sc-loraregular">[</text><text x="163.95" y="627.87" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="177.84" y="627.87" font-size="11.00" class="sc-loraregular">8.12.3.E]</text><text x="221.86" y="627.87" font-size="11.00" class="sc-notoserifcjksc">展示了这两种结构。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">198</text><text x="72.00" y="281.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="281.68" font-size="9.00" class="sc-lorabold">8.12.3.E]</text><text x="123.23" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">两个</text><text x="143.60" y="281.68" font-size="9.00" class="sc-lorabold">100</text><text x="161.06" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">智能体</text><text x="190.43" y="281.68" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="261.09" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">团队中涌现的团队结构。</text><text x="360.09" y="281.68" font-size="9.00" class="sc-notoserifcjksc">运行框架为每个</text><text x="425.46" y="281.68" font-size="9.00" class="sc-loraregular">100</text><text x="442.28" y="281.68" font-size="9.00" class="sc-notoserifcjksc">智能体团队指定了一个主</text><text x="72.00" y="293.38" font-size="9.00" class="sc-notoserifcjksc">智能体，但各团队的团队结构和消息习惯由智能体自行决定。子主智能体是指成为至少三个其他辅助智能体的主要消息</text><text x="72.00" y="305.08" font-size="9.00" class="sc-notoserifcjksc">发送者的辅助智能体；每个辅助智能体都显示为</text><text x="261.00" y="305.08" font-size="9.00" class="sc-loraregular">“</text><text x="264.60" y="305.08" font-size="9.00" class="sc-notoserifcjksc">汇报给</text><text x="291.60" y="305.08" font-size="9.00" class="sc-loraregular">”</text><text x="294.74" y="305.08" font-size="9.00" class="sc-notoserifcjksc">向它发送消息最多的主智能体或子主智能体。在</text><text x="486.11" y="305.08" font-size="9.00" class="sc-loraregular sc-k">Lean</text><text x="508.64" y="305.08" font-size="9.00" class="sc-notoserifcjksc">任务</text><text x="72.00" y="316.78" font-size="9.00" class="sc-notoserifcjksc">中，涌现出了</text><text x="128.37" y="316.78" font-size="9.00" class="sc-loraregular">12</text><text x="138.84" y="316.78" font-size="9.00" class="sc-notoserifcjksc">个子主智能体；在知识库任务中，辅助智能体大多直接与主智能体交流，没有子主智能体。</text><text x="72.00" y="378.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.4</text><text x="110.97" y="378.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="406.16" font-size="11.00" class="sc-notoserifcjkscbold">固定团队</text><text x="116.00" y="406.16" font-size="11.00" class="sc-notoserifcjksc">。由对等智能体组成的固定团队并发处理任务。所有智能体拥有相同的工具，且都能看</text><text x="72.00" y="421.78" font-size="11.00" class="sc-notoserifcjksc">到完整的任务描述。根据任务不同，可以指定一个智能体作为主智能体：在</text><text x="437.89" y="421.78" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="479.57" y="421.78" font-size="11.00" class="sc-notoserifcjksc">上，运行在</text><text x="72.00" y="437.40" font-size="11.00" class="sc-notoserifcjksc">主智能体完成时结束，并对当时的报告进行评分。在</text><text x="327.89" y="437.40" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="406.71" y="437.40" font-size="11.00" class="sc-notoserifcjksc">上，没有主智能体：各智能</text><text x="72.00" y="453.02" font-size="11.00" class="sc-notoserifcjksc">体彼此对等，收到相同的提示词，共享代码仓库的主分支被用于评分，且运行在每个智能体都完</text><text x="72.00" y="468.64" font-size="11.00" class="sc-notoserifcjksc">成后结束。在这两项评估中，如何分工都交由智能体自行决定。除任务工具外，每个智能体还有</text><text x="72.00" y="484.26" font-size="11.00" class="sc-notoserifcjksc">两个消息工具：</text><text x="149.00" y="484.26" font-size="11.00" class="sc-loraregular sc-k">Send Message</text><text x="221.18" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，用于向一个或多个队友发送消息（插入到接收方的下一个工具结</text><text x="72.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">果之后）；</text><text x="127.00" y="499.88" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="215.20" y="499.88" font-size="11.00" class="sc-notoserifcjksc">，在收到传入消息之前阻塞采样。在</text><text x="394.09" y="499.88" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="472.91" y="499.88" font-size="11.00" class="sc-notoserifcjksc">上，每个智能</text><text x="72.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">体在自己的任务代码仓库检出副本中工作，并可通过</text><text x="327.89" y="515.50" font-size="11.00" class="sc-loraregular sc-k">Git</text><text x="346.68" y="515.50" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="467.68" y="515.50" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="509.36" y="515.50" font-size="11.00" class="sc-notoserifcjksc">没有</text><text x="72.00" y="531.12" font-size="11.00" class="sc-notoserifcjksc">代码仓库：其智能体共享一个容器的文件系统。该运行框架旨在模拟多个智能体在共享任务上协</text><text x="72.00" y="546.74" font-size="11.00" class="sc-notoserifcjksc">作的真实场景，并通过让对等智能体并行工作来降低延迟。</text><text x="72.00" y="632.84" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc">。该运行框架以一个主智能体初始化，主智能体可以随意派生异步、长期存在的子</text><text x="72.00" y="648.46" font-size="11.00" class="sc-notoserifcjksc">智能体，同时保留对任务工具的直接访问。派生工具会立即返回确认，而不是等待子智能体执</text><text x="72.00" y="664.08" font-size="11.00" class="sc-notoserifcjksc">行。每个子智能体只能看到主智能体提供的指令，看不到原始任务描述。子智能体可以向主智能</text><text x="72.00" y="679.70" font-size="11.00" class="sc-notoserifcjksc">体以及任何仍在工作的其他子智能体发送消息。子智能体的最终回复会作为一条消息传递给主智</text><text x="72.00" y="695.32" font-size="11.00" class="sc-notoserifcjksc">能体，此后该</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p199.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 199 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 116.80 125.23 134.04 139.03 143.87 152.16 160.97 165.96 174.77 183.58 192.02" y="523.56" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 Chartography</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular sc-k">23</text><text x="81.10 86.71 92.68 96.96 102.43 107.85 110.48 116.74 120.09 122.72 125.77 131.13 137.27 142.64 148.30 151.35 153.80 156.43 163.42 169.41 174.57 178.96 182.83 188.68 194.21 198.47 203.62 209.59 215.51 220.79 223.29 225.92 232.17 234.80 240.62 246.04 252.11 257.42 263.41 272.35 277.51 281.79 287.16 289.79 293.12 298.97 303.30 305.92 311.89 316.15 321.95 325.28 330.69 335.32 339.95 342.76 348.61 354.67 359.83 362.55 365.18 370.50 376.49 381.64 386.04 389.91 392.54 398.51 404.58 410.55 415.97 420.30 424.93 428.80 433.95 440.02 446.00 448.81 454.88 460.40 462.86 465.49 471.10 477.07 481.34 486.82 492.24 494.87 501.13 504.48" y="704.45" font-size="10.00" class="sc-loraregular">Surge AI (2026). Chartography: A benchmark for professional chart understanding. Surge AI.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 109.01 113.64 119.61 123.89 129.37 134.78 140.77 146.53 148.99 154.15 156.75 163.64 169.46 172.18 178.03 183.55 189.95 195.27 201.26 206.42 210.81 214.68 220.53 226.06 230.32 235.47 241.44 247.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://surgehq.ai/blog/chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">199</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">子智能体进入空闲状态，直到主智能体用新指令将其唤醒。子智能体可以使用任务工具和</text><text x="503.89" y="82.61" font-size="11.00" class="sc-loraregular">Send</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Message</text><text x="115.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；主智能体还可以使用</text><text x="228.73" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="316.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，以及用于创建子智能体、终止子智能体和查</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">看子智能体状态（工作中、空闲、排队中或已终止）的工具。可派生的子智能体数量没有上限。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.5</text><text x="110.75" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="189.80" font-size="11.00" class="sc-notoserifcjksc">我们重点比较单智能体与多智能体运行框架，包括得分、延迟和</text><text x="382.89" y="189.80" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="414.95" y="189.80" font-size="11.00" class="sc-notoserifcjksc">用量。具体而言，</text><text x="502.95" y="189.80" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">用量的统计方式与</text><text x="162.89" y="205.42" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="194.95" y="205.42" font-size="11.00" class="sc-notoserifcjksc">上限的执行方式相同：进入智能体上下文窗口的每个</text><text x="450.84" y="205.42" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="480.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">，无论是输</text><text x="72.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">入还是输出，都按每个窗口计一次，而不是按每次模型请求计一次，并对一个任务上所有智能体</text><text x="72.00" y="236.66" font-size="11.00" class="sc-notoserifcjksc">的计数求和。延迟以推导出的每任务延迟报告，而不是原始的实际耗时。我们将智能体的输入和</text><text x="72.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">输出</text><text x="96.89" y="252.28" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="128.95" y="252.28" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充（</text><text x="313.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">）速率和解码速率，再加上其实测的工具执行</text><text x="72.00" y="267.90" font-size="11.00" class="sc-notoserifcjksc">时间，以此计算每条智能体轨迹的延迟。我们通过在交接时传递时钟来计入智能体的空闲时间：</text><text x="72.00" y="283.52" font-size="11.00" class="sc-notoserifcjksc">被派生的智能体从其派生者的时钟开始计时；收到消息或结果的智能体，如果发送者在发送时的</text><text x="72.00" y="299.14" font-size="11.00" class="sc-notoserifcjksc">时钟晚于自己的时钟，则将自己的时钟前移至该时钟。我们将</text><text x="371.89" y="299.14" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="450.71" y="299.14" font-size="11.00" class="sc-notoserifcjksc">上最长的智能体轨</text><text x="72.00" y="314.76" font-size="11.00" class="sc-notoserifcjksc">迹（每个评分点上所有智能体中最大的时钟）以及</text><text x="316.89" y="314.76" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="358.57" y="314.76" font-size="11.00" class="sc-notoserifcjksc">上主智能体的最终时钟（主智能体的</text><text x="72.00" y="330.38" font-size="11.00" class="sc-notoserifcjksc">回答即结束任务）报告为运行框架的端到端延迟。使用推导延迟可以将运行框架本身的延迟（例</text><text x="72.00" y="346.00" font-size="11.00" class="sc-notoserifcjksc">如，它需要多少串行的模型工作和工具时间）与服务端波动（例如批处理、排队、硬件）隔离开</text><text x="72.00" y="361.62" font-size="11.00" class="sc-notoserifcjksc">来，从而在不同时间以相同的模型速度比较各运行框架。工具执行时间按实测值报告，因此仍反</text><text x="72.00" y="377.24" font-size="11.00" class="sc-notoserifcjksc">映运行当时的条件。</text><text x="72.00" y="482.65" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="482.65" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="547.42" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="142.82" y="543.75" font-size="6.60" class="sc-loraregular sc-k">23</text><text x="152.83" y="547.42" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="166.73" y="547.42" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="212.52" y="547.42" font-size="11.00" class="sc-notoserifcjksc">推出的一个图表理解基准测试，包含</text><text x="391.41" y="547.42" font-size="11.00" class="sc-loraregular">100</text><text x="411.97" y="547.42" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测</text><text x="72.00" y="563.04" font-size="11.00" class="sc-notoserifcjksc">试中很少评估的专业图表类型。其中包括</text><text x="272.89 280.41 286.08 292.65 295.64 301.32 307.99 314.48 324.51 330.47 333.56 339.52" y="563.04" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="347.18" y="563.04" font-size="11.00" class="sc-notoserifcjksc">曲线图、</text><text x="391.18" y="563.04" font-size="11.00" class="sc-loraregular">K</text><text x="401.58" y="563.04" font-size="11.00" class="sc-notoserifcjksc">线图、等值线图、风玫瑰</text><text x="72.00" y="578.66" font-size="11.00" class="sc-notoserifcjksc">图、桑基图、伯德图和三维曲面图。由于不同类型的图表能够被读取的精度不同，每个答案都对</text><text x="72.00" y="594.28" font-size="11.00" class="sc-notoserifcjksc">照专家为该特定图表设定的可接受范围进行评分，而不是采用单一的固定容差。</text><text x="72.00" y="660.98" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为启用自适应思考和</text><text x="305.89" y="660.98" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59" y="660.98" font-size="11.00" class="sc-notoserifcjksc">推理强度。模型分别在有工具和无工具的条</text><text x="72.00" y="676.60" font-size="11.00" class="sc-notoserifcjksc">件下接受评估。在有工具的条件下评估时，模型会获得一个</text><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="506.93" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="72.00" y="707.20" width="180.64" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p200.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 200 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular sc-k">24</text><text x="80.97 86.58 92.55 96.82 102.30 107.72 110.35 116.61 119.96 122.58 125.63 131.00 137.14 142.51 148.16 151.21 153.67 156.30 163.29 169.28 174.43 178.83 182.70 188.55 194.08 198.33 203.49 209.46 215.38 220.66 223.28 226.51 233.50 239.35 245.33 250.74 253.37 257.63 263.05 269.02 274.86 279.49 282.46 286.33 292.18 296.68 301.55 305.14 307.60 310.23 317.84 320.81 324.67 332.28 338.25 344.07" y="704.45" font-size="10.00" class="sc-loraregular">Surge AI (2026). Chartography [Code repository]. GitHub.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.92 114.69 117.66 121.53 127.52 133.48 139.30 141.76 147.03 152.88 161.62 168.12 172.75 178.72 182.99 188.47 193.89 198.78 203.94 206.54 212.93 218.25 224.24 229.40 233.79 237.66 243.51 249.04 253.30 258.45 264.42 270.34" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://github.com/surge-ai/chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">200</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们内部的</text><text x="426.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="500.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评分实</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">现与官方代码仓库中的任务及专家确定的可接受答案范围一致。</text><text x="380.00" y="94.56" font-size="6.60" class="sc-loraregular sc-k">24</text><text x="389.87" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为确保各模型之间的评分可</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">比，我们遵循</text><text x="140.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="186.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">排行榜的做法，使用</text><text x="288.58" y="113.85" font-size="11.00" class="sc-loraregular">Gemini 3.5 Flash</text><text x="375.49" y="113.85" font-size="11.00" class="sc-notoserifcjksc">作为评分者；以往的系统卡显示的</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">得分略低，原因是仅对</text><text x="184.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="129.47" font-size="11.00" class="sc-notoserifcjksc">模型使用了</text><text x="281.08" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="376.24" y="129.47" font-size="11.00" class="sc-notoserifcjksc">作为评判者。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在无工具条件下得分</text><text x="259.63" y="195.95" font-size="11.00" class="sc-loraregular">64.4%</text><text x="290.18" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，在有工具条件下得分</text><text x="403.08" y="195.95" font-size="11.00" class="sc-loraregular sc-k">89.0%</text><text x="434.31" y="195.95" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="445.31" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="528.71" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">得分分别为</text><text x="129.89" y="211.57" font-size="11.00" class="sc-loraregular">44.8%</text><text x="163.17" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="177.06" y="211.57" font-size="11.00" class="sc-loraregular">88.4%</text><text x="207.66" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="232.56" y="211.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="309.59" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="378.48" y="211.57" font-size="11.00" class="sc-loraregular sc-k">29.8%</text><text x="411.92" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="425.82" y="211.57" font-size="11.00" class="sc-loraregular">83.4%</text><text x="456.36" y="211.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="567.60" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="567.60" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.16 119.64 122.00 128.20 133.79 138.50 142.82 146.54 151.63 156.65 160.92 165.64 171.01 176.45" y="567.60" font-size="9.00" class="sc-lorabold">8.13.1.A] Chartography</text><text x="183.78" y="567.60" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="210.78" y="567.60" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="242.11" y="567.60" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="325.48" y="567.60" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="344.05" y="567.60" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分有工具和无工具两种条件。</text><text x="72.00" y="579.30" font-size="9.00" class="sc-notoserifcjksc">得分为五次运行的平均值。图中显示</text><text x="218.37" y="579.30" font-size="9.00" class="sc-loraregular">95%</text><text x="238.67" y="579.30" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="283.67" y="579.30" font-size="9.00" class="sc-loraregular">Gemini 3.8 Flash</text><text x="354.93" y="579.30" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="366.30" y="579.30" font-size="9.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="417.97" y="579.30" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="456.34" y="579.30" font-size="9.00" class="sc-loraregular sc-k">Surge AI</text><text x="493.80" y="579.30" font-size="9.00" class="sc-notoserifcjksc">公开报告的</text><text x="72.00" y="591.00" font-size="9.00" class="sc-notoserifcjksc">结果，在无工具条件下评估。</text><text x="72.00" y="620.33" font-size="11.00" class="sc-notoserifcjksc">在无工具条件下，</text><text x="160.00" y="620.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="245.73" y="620.33" font-size="11.00" class="sc-notoserifcjksc">在原始视觉推理能力上呈现跨越式提升，大幅领先</text><text x="490.63" y="620.33" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="635.95" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="114.22" y="635.95" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://github.com/surge-ai/chartography" rel="noopener"><rect x="346.53" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://github.com/surge-ai/chartography" rel="noopener"><rect x="72.00" y="707.20" width="203.62" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p201.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 201 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">201</text><text x="72.00" y="422.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="422.49" font-size="9.00" class="sc-lorabold sc-k">8.13.1.B] Chartography</text><text x="183.78" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">得分（无工具）。</text><text x="255.78" y="422.49" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考下以不同的推理强度档位进行评估。我们使用</text><text x="510.15" y="422.49" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="72.00" y="434.19" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值。图中显示</text><text x="443.37" y="434.19" font-size="9.00" class="sc-loraregular">95%</text><text x="463.67" y="434.19" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="474.80" font-size="11.00" class="sc-notoserifcjksc">在可以使用工具的条件下，</text><text x="204.00" y="474.80" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="289.73" y="474.80" font-size="11.00" class="sc-notoserifcjksc">在得分</text><text x="322.73" y="474.80" font-size="11.00" class="sc-loraregular">–</text><text x="329.22" y="474.80" font-size="11.00" class="sc-notoserifcjksc">成本前沿上帕累托占优于以往的</text><text x="486.12" y="474.80" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="524.41" y="474.80" font-size="11.00" class="sc-notoserifcjksc">模</text><text x="72.00" y="490.42" font-size="11.00" class="sc-notoserifcjksc">型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p202.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 202 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.32 109.70 117.89 125.91 134.34 142.14 150.57 160.62 169.68" y="483.14" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.2 BenchCAD</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">202</text><text x="72.00" y="422.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.82 120.29 122.66 128.85 134.44 139.16 143.48 147.20 152.29 157.30 161.58 166.29 171.67 177.11" y="422.49" font-size="9.00" class="sc-lorabold">8.13.1.C] Chartography</text><text x="184.44" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">得分（有工具）。</text><text x="256.44" y="422.49" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考下以不同的推理强度档位进行评估。我们使用</text><text x="510.80" y="422.49" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="72.00" y="434.19" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值。图中显示</text><text x="443.37" y="434.19" font-size="9.00" class="sc-loraregular">95%</text><text x="463.67" y="434.19" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="507.02" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="126.45" y="503.35" font-size="6.60" class="sc-loraregular">25</text><text x="136.48" y="507.02" font-size="11.00" class="sc-notoserifcjksc">是一个面向程序化</text><text x="227.38" y="507.02" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="250.04" y="507.02" font-size="11.00" class="sc-notoserifcjksc">（计算机辅助设计）推理的基准测试，由</text><text x="450.93 454.93 459.52 462.29 468.65 475.48" y="507.02" font-size="11.00" class="sc-loraregular">17,900</text><text x="485.22" y="507.02" font-size="11.00" class="sc-notoserifcjksc">个经执行验</text><text x="72.00" y="522.64" font-size="11.00" class="sc-notoserifcjksc">证的</text><text x="96.89" y="522.64" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="151.65" y="522.64" font-size="11.00" class="sc-notoserifcjksc">程序构建而成，涵盖</text><text x="253.54" y="522.64" font-size="11.00" class="sc-loraregular">106</text><text x="273.63" y="522.64" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="463.52" y="522.64" font-size="11.00" class="sc-loraregular">ISO</text><text x="482.18" y="522.64" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="493.18" y="522.64" font-size="11.00" class="sc-loraregular sc-k">DIN</text><text x="513.33" y="522.64" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="538.26" font-size="11.00" class="sc-loraregular">EN</text><text x="87.22" y="538.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="98.22" y="538.26" font-size="11.00" class="sc-loraregular">ASME</text><text x="131.18" y="538.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="145.07" y="538.26" font-size="11.00" class="sc-loraregular">IEC</text><text x="166.18" y="538.26" font-size="11.00" class="sc-notoserifcjksc">规格说明表为依据。该基准测试将</text><text x="334.08" y="538.26" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="359.63" y="538.26" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务；我</text><text x="72.00" y="553.88" font-size="11.00" class="sc-notoserifcjksc">们报告</text><text x="107.89" y="553.88" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="174.76" y="553.88" font-size="11.00" class="sc-notoserifcjksc">任务上的结果，该任务要求模型根据多视图渲染图生成</text><text x="441.65" y="553.88" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="496.41" y="553.88" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="620.58" font-size="11.00" class="sc-notoserifcjksc">在测试</text><text x="107.89" y="620.58" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.63" y="620.58" font-size="11.00" class="sc-notoserifcjksc">期间，我们发现我们对</text><text x="306.52" y="620.58" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="430.73" y="620.58" font-size="11.00" class="sc-notoserifcjksc">的实现存在一处偏差。</text><text x="72.00" y="636.20" font-size="11.00" class="sc-notoserifcjksc">我们的实现此前依赖官方</text><text x="195.89" y="636.20" font-size="11.00" class="sc-loraregular sc-k">HuggingFace</text><text x="265.03" y="636.20" font-size="11.00" class="sc-notoserifcjksc">代码仓库中预渲染的</text><text x="366.92" y="636.20" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="392.47" y="636.20" font-size="11.00" class="sc-notoserifcjksc">零件图像，</text><text x="447.47" y="632.53" font-size="6.60" class="sc-loraregular">26</text><text x="454.83" y="636.20" font-size="11.00" class="sc-notoserifcjksc">其中每个视图以</text><text x="72.00" y="651.82" font-size="11.00" class="sc-loraregular sc-k">128 x 128px</text><text x="131.04" y="651.82" font-size="11.00" class="sc-notoserifcjksc">渲染，</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">25</text><text x="81.12 87.22 93.21 98.37 104.44 109.97 112.49 115.12 122.92 125.38 127.90 130.53 135.88 139.75 142.38 147.54 150.26 152.72 155.35 158.40 163.77 169.91 175.28 180.94 183.99 186.45 189.08 195.30 200.72 206.79 212.11 217.98 224.87 231.13 238.58 241.08 243.71 249.97 252.60 257.87 263.72 272.66 278.63 282.89 288.31 294.30 299.72 305.79 310.42 313.23 318.23 323.65 326.17 328.80 331.61 337.68 343.66 349.63 354.26 358.13 362.63 367.91 372.80 377.43 381.30 386.46 392.53 398.51 403.67 407.93 413.91 416.54 422.36 427.78 433.85 439.17 445.16 454.10 459.26 463.55 468.92 471.55 474.88 480.73" y="690.99" font-size="10.00" class="sc-loraregular">Zhang, H., et al. (2026). BenchCAD: A comprehensive, industry-standard benchmark for</text><text x="248.86 254.76 258.73 262.60 268.57 273.20 275.70 279.39 286.29 291.45 295.78 301.08 303.89 308.55 311.01 316.86 321.14 326.67 333.57 338.73 344.55 348.83 355.73 361.10 366.88 373.09 378.54 381.00 384.64 390.85 396.47 402.25" y="705.19" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2605.10865</text><text x="72.00" y="716.06" font-size="6.00" class="sc-loraregular">26</text><text x="81.32 87.22 91.19 95.06 101.03 105.66 108.16 111.85 118.75 124.74 130.71 136.24 142.01 144.82 150.89 156.81 160.19 165.35 170.62 176.04 178.50 183.77 189.14 196.04 202.02 207.11 210.98 216.14 220.77 226.12 229.99 234.27 241.17 247.39 252.81 258.88 264.20 270.07 276.96 283.22 290.08 296.98 303.20 308.62 314.69 320.01 325.88 332.77 339.03" y="719.39" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://huggingface.co/datasets/BenchCAD/BenchCAD</text><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="248.86" y="697.19" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="286.29" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="286.29" y="697.19" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="333.57" y="697.19" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2605.10865" rel="noopener"><rect x="333.57" y="697.19" width="74.13" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="81.32" y="711.39" width="37.43" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="118.75" y="711.39" width="0.00" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="118.75" y="711.39" width="77.29" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="196.04" y="711.39" width="0.00" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="196.04" y="711.39" width="45.13" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="241.17" y="711.39" width="0.00" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="241.17" y="711.39" width="55.81" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="296.98" y="711.39" width="0.00" height="10.00" fill="transparent"/></a><a href="https://huggingface.co/datasets/BenchCAD/BenchCAD" rel="noopener"><rect x="296.98" y="711.39" width="49.50" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p203.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 203 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">203</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">共四个视图。相比之下，</text><text x="193.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">GitHub</text><text x="233.13" y="82.61" font-size="11.00" class="sc-notoserifcjksc">上的参考实现以每个视图</text><text x="357.02" y="82.61" font-size="11.00" class="sc-loraregular sc-k">256 x 256 px</text><text x="423.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的分辨率动态渲染各视</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">图，是我们此前评估先前</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型时所用分辨率的</text><text x="336.08" y="98.23" font-size="11.00" class="sc-loraregular">4x</text><text x="347.87" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。这导致先前的</text><text x="427.76" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="466.05" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型相对于在</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">同一基准测试上评估的其他模型得分显著偏低。例如，我们能够使用</text><text x="404.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">256 x 256 px</text><text x="471.16" y="113.85" font-size="11.00" class="sc-notoserifcjksc">尺寸的视图复</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">现</text><text x="85.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="149.04" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的无工具得分，而使用</text><text x="261.94" y="129.47" font-size="11.00" class="sc-loraregular sc-k">128 x 128 px</text><text x="323.87" y="129.47" font-size="11.00" class="sc-notoserifcjksc">尺寸的视图则无法复现。我们已更新评估，</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">使之与预期实现一致；下文公布我们先前</text><text x="272.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="311.18" y="145.09" font-size="11.00" class="sc-notoserifcjksc">模型的更新后数据。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">在所有运行中（无论是否使用工具），模型均配置为启用自适应思考和</text><text x="415.89" y="228.33" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="438.59" y="228.33" font-size="11.00" class="sc-notoserifcjksc">推理强度。在有工具</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">的条件下评估时，模型可使用一个装有图像文件和标准库的容器，以及一个图像裁剪工具。我们</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">在已公开的</text><text x="129.89 133.90 138.48 141.26 147.61 154.45" y="259.57" font-size="11.00" class="sc-loraregular">17,900</text><text x="164.18" y="259.57" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="178.07" y="259.57" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="244.94" y="259.57" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="324.84 328.84 331.45 338.28 345.11" y="259.57" font-size="11.00" class="sc-loraregular">1,000</text><text x="354.84" y="259.57" font-size="11.00" class="sc-notoserifcjksc">个文件构成子集，并在该子集上评估</text><text x="72.00" y="275.19" font-size="11.00" class="sc-notoserifcjksc">模型；根据以往经验，该子集的得分能够在</text><text x="283.89" y="275.19" font-size="11.00" class="sc-loraregular sc-k">0.01</text><text x="306.82" y="275.19" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="331.71" y="275.19" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="349.64" y="275.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="360.64" y="275.19" font-size="11.00" class="sc-loraregular sc-k">voxel IoU</text><text x="408.07" y="275.19" font-size="11.00" class="sc-notoserifcjksc">）的误差范围内反映完整集</text><text x="72.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">合上的得分。我们报告五次运行平均的体素</text><text x="283.89" y="290.81" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="304.72" y="290.81" font-size="11.00" class="sc-notoserifcjksc">得分。</text><text x="72.00" y="342.22" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="342.22" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="210.11" y="342.22" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="342.22" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="342.22" font-size="11.00" class="sc-notoserifcjksc">文件子集上，</text><text x="320.01" y="342.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="405.74" y="342.22" font-size="11.00" class="sc-notoserifcjksc">在无工具时取得</text><text x="485.63" y="342.22" font-size="11.00" class="sc-loraregular sc-k">0.730</text><text x="515.56" y="342.22" font-size="11.00" class="sc-notoserifcjksc">的体</text><text x="72.00" y="357.84" font-size="11.00" class="sc-notoserifcjksc">素</text><text x="85.89" y="357.84" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="106.72" y="357.84" font-size="11.00" class="sc-notoserifcjksc">得分，在有工具时取得</text><text x="219.61" y="357.84" font-size="11.00" class="sc-loraregular sc-k">0.962</text><text x="247.59" y="357.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="258.59" y="357.84" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="341.99" y="357.84" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="388.89" y="357.84" font-size="11.00" class="sc-loraregular sc-k">0.606</text><text x="420.58" y="357.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="434.47" y="357.84" font-size="11.00" class="sc-loraregular sc-k">0.926</text><text x="462.46" y="357.84" font-size="11.00" class="sc-notoserifcjksc">（此前在低分辨</text><text x="72.00" y="373.46" font-size="11.00" class="sc-notoserifcjksc">率下评估时报告的得分为</text><text x="195.89" y="373.46" font-size="11.00" class="sc-loraregular sc-k">0.437</text><text x="225.04" y="373.46" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="238.94" y="373.46" font-size="11.00" class="sc-loraregular sc-k">0.843</text><text x="266.57" y="373.46" font-size="11.00" class="sc-notoserifcjksc">），而</text><text x="302.46" y="373.46" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="379.49" y="373.46" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="426.39" y="373.46" font-size="11.00" class="sc-loraregular sc-k">0.497</text><text x="455.77" y="373.46" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="469.66" y="373.46" font-size="11.00" class="sc-loraregular sc-k">0.899</text><text x="497.84" y="373.46" font-size="11.00" class="sc-notoserifcjksc">（此前</text><text x="72.00" y="389.08" font-size="11.00" class="sc-notoserifcjksc">在低分辨率下评估时报告的得分为</text><text x="239.89" y="389.08" font-size="11.00" class="sc-loraregular sc-k">0.366</text><text x="270.99" y="389.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="284.88" y="389.08" font-size="11.00" class="sc-loraregular sc-k">0.821</text><text x="310.34" y="389.08" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p204.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 204 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">204</text><text x="72.00" y="394.74" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="394.74" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.67 111.77 117.31 120.78 123.15 129.10 133.94 139.68 144.34 149.81 155.94 161.96 168.79 171.15 177.29 180.23 184.60 187.54 192.64 198.38 203.18 209.37 214.46 219.82" y="394.74" font-size="9.00" class="sc-lorabold">8.13.2.A] BenchCAD Vision2Code</text><text x="227.03" y="394.74" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="272.03" y="394.74" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="303.36" y="394.74" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考和</text><text x="386.73" y="394.74" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="405.30" y="394.74" font-size="9.00" class="sc-notoserifcjksc">推理强度下评估，分别在有工具和</text><text x="72.00" y="406.44" font-size="9.00" class="sc-notoserifcjksc">无工具条件下进行。得分为五次运行的平均值，并显示</text><text x="290.37" y="406.44" font-size="9.00" class="sc-loraregular">95%</text><text x="310.67" y="406.44" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="355.67" y="406.44" font-size="9.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="407.34" y="406.44" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="418.71" y="406.44" font-size="9.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="472.29" y="406.44" font-size="9.00" class="sc-notoserifcjksc">的得分为</text><text x="72.00" y="418.14" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="105.88" y="418.14" font-size="9.00" class="sc-notoserifcjksc">公开报告的数据。</text><text x="72.00" y="447.48" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="447.48" font-size="11.00" class="sc-notoserifcjksc">在该评估上的表现随测试时计算的增加而显著提升，尤其是在模型配备了能够对中间输出</text><text x="72.00" y="463.11" font-size="11.00" class="sc-notoserifcjksc">进行视觉验证的工具时。事实上，在提供工具的情况下，</text><text x="347.00" y="463.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="432.73" y="463.11" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上几乎</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">取得了满分的体素</text><text x="162.89" y="478.73" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="183.72" y="478.73" font-size="11.00" class="sc-notoserifcjksc">得分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p205.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 205 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 106.54 109.92 120.11 127.96 140.94 149.24 154.23 157.66 166.47 169.85 177.35 180.48" y="483.14" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.3 OSWorld 2.0</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">27</text><text x="83.25 89.09 95.06 100.22 106.29 108.82 111.44 120.62 123.08 125.61 128.24 133.59 137.45 140.08 145.24 147.96 150.42 153.05 156.10 161.46 167.60 172.97 178.63 181.68 184.14 186.76 194.70 200.37 209.93 215.77 220.06 222.78 228.76 231.39 236.75 239.06 245.27 247.77 250.40 256.62 262.03 268.10 273.42 279.41 288.34 293.50 297.79 303.16 305.97 312.04 317.56 320.19 325.46 331.31 340.24 346.21 352.18 356.05 361.47 365.79 368.42 374.39 379.02 384.44 387.07 392.22 397.70 403.12 409.10 412.97 417.59 420.22 426.07 432.14 434.77 437.49 443.33 449.40 454.93 459.82 465.80 471.65 475.98 478.79 483.83 489.67" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.80" font-size="
