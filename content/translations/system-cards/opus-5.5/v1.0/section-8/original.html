<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="72.00 80.93 84.30 92.61 96.25 106.17 114.80 123.44 132.92 141.37 155.35 162.68 166.32 174.38 179.28 182.65" y="277.98" font-size="14.00" class="sc-poppinsmedium">8.3 DeepSWE v1.1</text><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="386.90" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.2 SWE-bench Pro</text><text x="205.98" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="219.98" y="84.20" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="307.54" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="324.87" y="84.20" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00 78.24 89.18 95.80 101.18 107.59 113.55 120.22 126.08" y="110.77" font-size="11.00" class="sc-loraregular">SWE-bench</text><text x="135.56" y="110.77" font-size="11.00" class="sc-notoserifcjksc">在真实世界的软件工程任务上测试</text><text x="303.45" y="110.77" font-size="11.00" class="sc-loraregular">AI</text><text x="316.92" y="110.77" font-size="11.00" class="sc-notoserifcjksc">模型。我们报告三个变体，每个得分均为五次</text><text x="72.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">试验的平均值：</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 179.25 184.44" y="159.11" font-size="11.00" class="sc-lorabold">SWE-bench Pro</text><text x="190.67" y="155.44" font-size="6.60" class="sc-loraregular">16</text><text x="199.78" y="159.11" font-size="11.00" class="sc-notoserifcjksc">由取自持续维护的代码仓库、涉及大规模多文件</text><text x="433.67 440.25 443.34 447.17" y="159.11" font-size="11.00" class="sc-loraregular">diff</text><text x="453.78" y="159.11" font-size="11.00" class="sc-notoserifcjksc">的问题组成。</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.14 184.85" y="174.73" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.73" y="174.73" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="229.63 235.73 241.91 244.62 250.98" y="174.73" font-size="11.00" class="sc-loraregular">89.9%</text><text x="263.44" y="174.73" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 182.66 189.46 192.84 197.39 200.98 204.42 208.01 215.03 221.16 227.96 233.72" y="191.72" font-size="11.00" class="sc-lorabold">SWE-bench Multilingual</text><text x="240.04" y="191.72" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖九种编程语言的</text><text x="418.94" y="191.72" font-size="11.00" class="sc-loraregular">300</text><text x="441.62" y="191.72" font-size="11.00" class="sc-notoserifcjksc">个问题。</text><text x="485.62" y="191.72" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="108.00" y="207.34" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="143.89" y="207.34" font-size="11.00" class="sc-loraregular">93.9%</text><text x="177.90" y="207.34" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 182.66 189.46 192.84 197.39 200.98 211.10 217.33 223.89 229.65" y="223.89" font-size="11.00" class="sc-lorabold">SWE-bench Multimodal</text><text x="233.08" y="220.22" font-size="6.60" class="sc-loraregular">17</text><text x="241.42" y="223.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="255.31" y="223.89" font-size="11.00" class="sc-loraregular">issue</text><text x="284.01" y="223.89" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图和设计稿）。</text><text x="504.01" y="223.89" font-size="11.00" class="sc-loraregular">Opus</text><text x="108.00" y="239.51" font-size="11.00" class="sc-loraregular">5.5</text><text x="125.59" y="239.51" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="161.48" y="239.51" font-size="11.00" class="sc-loraregular">61.4%</text><text x="192.98" y="239.51" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="72.00 80.19 86.10 92.06 98.57 104.80 115.75" y="300.64" font-size="11.00" class="sc-loraregular">DeepSWE</text><text x="125.48" y="300.64" font-size="11.00" class="sc-notoserifcjksc">是一组包含</text><text x="183.38" y="300.64" font-size="11.00" class="sc-loraregular">113</text><text x="200.40" y="300.64" font-size="11.00" class="sc-notoserifcjksc">个长程软件工程任务的集合，旨在衡量前沿编程智能体的能力。这些</text><text x="72.00" y="316.26" font-size="11.00" class="sc-notoserifcjksc">任务多样、反映真实世界的复杂性，并且为避免基准污染而从零编写。</text><text x="413.00 420.69 423.68 429.29 435.86 442.44 448.40 451.29 460.02 466.59 473.16 478.25 481.14 487.14 489.85" y="316.26" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="498.73" y="316.26" font-size="11.00" class="sc-notoserifcjksc">在五次</text><text x="72.00" y="331.88" font-size="11.00" class="sc-notoserifcjksc">试验中的平均得分为</text><text x="173.89 178.81 184.77 187.48 193.38" y="331.88" font-size="11.00" class="sc-loraregular">74.2%</text><text x="202.96" y="331.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 77.92 82.60 89.04 95.62 99.87 102.96 108.93 113.69 121.38 127.81 134.39" y="409.55" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="143.25" y="409.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14 175.83 182.26 188.35 195.02 198.29 202.55 205.64 212.07" y="409.55" font-size="11.00" class="sc-loraregular">Cognition</text><text x="221.64" y="409.55" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54" y="409.55" font-size="11.00" class="sc-loraregular">150</text><text x="409.26" y="409.55" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源自</text><text x="72.00" y="425.17" font-size="11.00" class="sc-notoserifcjksc">开源代码仓库中的真实拉取请求（</text><text x="237.00 243.57 250.13 253.13 256.12 259.01 263.70 269.60 275.94 282.51 288.47 293.56" y="425.17" font-size="11.00" class="sc-loraregular">pull request</text><text x="297.82" y="425.17" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="366.71" y="425.17" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="415.81" y="425.17" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="440.71 449.38 455.35 461.75 466.84 473.28 479.13 484.96 490.84 495.10 497.99 504.40 510.96" y="425.17" font-size="11.00" class="sc-loraregular">websocket bug</text><text x="517.05" y="425.17" font-size="11.00" class="sc-notoserifcjksc">、加</text><text x="72.00" y="440.79" font-size="11.00" class="sc-notoserifcjksc">固</text><text x="85.89" y="440.79" font-size="11.00" class="sc-loraregular">Prisma</text><text x="123.91" y="440.79" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包产物，或扩展</text><text x="258.80 262.90 269.14 277.78 286.16 289.05 294.15 300.00 306.59 312.55 322.38 328.06 330.95 333.94 337.03 343.61" y="440.79" font-size="11.00" class="sc-loraregular">JSON schema lint</text><text x="350.76" y="440.79" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务向智能体提供一个已检</text><text x="72.00" y="456.41" font-size="11.00" class="sc-notoserifcjksc">出的代码仓库、一份</text><text x="173.89" y="456.41" font-size="11.00" class="sc-loraregular">issue</text><text x="202.59" y="456.41" font-size="11.00" class="sc-notoserifcjksc">描述，以及该仓库的测试、</text><text x="334.59 337.58 340.67 347.25" y="456.41" font-size="11.00" class="sc-loraregular">lint</text><text x="354.40" y="456.41" font-size="11.00" class="sc-notoserifcjksc">和代码风格规范；随后智能体在可访问</text><text x="72.00" y="472.03" font-size="11.00" class="sc-notoserifcjksc">互联网的容器化环境中自主工作，产出最终补丁，全程无人工干预，也不提供任何超时信息。补</text><text x="72.00" y="487.65" font-size="11.00" class="sc-notoserifcjksc">丁依据阻断性功能标准（主要是留出的单元测试，外加范围和性能方面的阻断项）以及加权的评</text><text x="72.00" y="503.27" font-size="11.00" class="sc-notoserifcjksc">分细则标准进行评分，其中包括由模型评分的检查项，用于检查所需的测试覆盖范围和被禁止的</text><text x="72.00" y="518.89" font-size="11.00" class="sc-notoserifcjksc">实现模式。任务由底层代码仓库的维护者编写，并由</text><text x="327.89 335.58 342.02 348.10 354.78 358.04 362.30 365.39 371.83" y="518.89" font-size="11.00" class="sc-loraregular">Cognition</text><text x="381.40" y="518.89" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审查，其中随机抽</text><text x="72.00" y="534.51" font-size="11.00" class="sc-notoserifcjksc">取的一部分经人工求解以验证公平性。我们以</text><text x="294.89 304.73 310.67 316.34 323.02 331.78" y="534.51" font-size="11.00" class="sc-loraregular">mean@5</text><text x="340.66" y="534.51" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="365.56 371.48 376.16 382.60 389.17 393.43 396.52 402.48 407.25 414.94 421.37 427.95" y="534.51" font-size="11.00" class="sc-loraregular">FrontierCode</text><text x="436.80" y="534.51" font-size="11.00" class="sc-notoserifcjksc">的总体得分；这是一</text><text x="72.00" y="550.13" font-size="11.00" class="sc-notoserifcjksc">个综合指标，依据阻断性功能标准（留出的单元测试）以及加权的代码质量评分细则标准对每个</text><text x="72.00" y="565.75" font-size="11.00" class="sc-notoserifcjksc">补丁进行评分。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">16</text><text x="80.28 87.73 93.15 99.22 104.75 107.27 109.90 116.39 118.85 121.37 124.00 129.35 133.22 135.85 141.01 143.73 146.19 148.82 151.87 157.24 163.38 168.75 174.20 177.25 179.71 182.34 188.01 197.96 203.98 208.87 215.09 220.51 226.58 231.90 237.89 240.52 246.58 250.84 256.69 259.19 261.82 268.81 273.97 280.04 282.67 288.93 292.28 294.91 300.07 305.55 310.97 316.95 320.82 325.45 328.08 332.71 338.56 341.24 346.24 351.66 354.29 357.01 362.86 368.93 374.46 379.35 385.34 391.19 395.52 398.33 403.36 409.21 415.28 417.91 422.54 428.34 431.84 435.88 443.79 448.95 453.21 458.63 461.26 8.07" y="545.92" font-size="11.00" class="sc-loraregular">CAD</text><text x="506.27" y="545.92" font-size="11.00" class="sc-notoserifcjksc">（计算</text><text x="72.00" y="561.54" font-size="11.00" class="sc-notoserifcjksc">机辅助设计）、形式化证明和</text><text x="217.89" y="561.54" font-size="11.00" class="sc-loraregular">GPU</text><text x="244.10" y="561.54" font-size="11.00" class="sc-notoserifcjksc">性能优化工作。</text><text x="72.00" y="611.27" font-size="11.00" class="sc-notoserifcjksc">以往的</text><text x="107.89 114.39 120.36 125.12 134.95 138.04 144.72 150.40 153.39 158.77 165.61 171.57 178.25 184.10" y="611.27" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="193.58" y="611.27" font-size="11.00" class="sc-notoserifcjksc">版本</text><text x="215.58" y="611.27" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对超时和资源非常敏感</text><text x="325.58" y="611.27" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="336.58 342.55 345.09" y="611.27" font-size="11.00" class="sc-loraregular">4.0</text><text x="354.81" y="611.27" font-size="11.00" class="sc-notoserifcjksc">通过延长超时时间，并在少数可能受</text><text x="72.00" y="626.89" font-size="11.00" class="sc-notoserifcjksc">益的任务中自适应地提高</text><text x="195.89 203.34 210.23" y="626.89" font-size="11.00" class="sc-loraregular">RAM</text><text x="223.22" y="626.89" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="237.11" y="626.89" font-size="11.00" class="sc-loraregular">CPU</text><text x="262.63" y="626.89" font-size="11.00" class="sc-notoserifcjksc">配额，基本解决了这些问题。沙箱服务提供商的选择在少</text><text x="72.00" y="642.51" font-size="11.00" class="sc-notoserifcjksc">数任务中可能仍是一个混杂因素，但我们预计其作用将明显小于以往版本。我们还发现，此次升</text><text x="72.00" y="658.13" font-size="11.00" class="sc-notoserifcjksc">级减少了各种运行框架（</text><text x="193.00" y="658.13" font-size="11.00" class="sc-loraregular">harness</text><text x="232.85" y="658.13" font-size="11.00" class="sc-notoserifcjksc">）因素（例如</text><text x="301.75" y="658.13" font-size="11.00" class="sc-loraregular">CLI</text><text x="322.37" y="658.13" font-size="11.00" class="sc-notoserifcjksc">内存占用、上下文压缩（</text><text x="443.37 449.17 455.60 465.44 472.00 477.68 483.48 487.73 490.82 497.26" y="658.13" font-size="11.00" class="sc-loraregular">compaction</text><text x="503.94" y="658.13" font-size="11.00" class="sc-notoserifcjksc">）策略</text><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="602.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="215.58" y="602.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="602.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="226.58" y="602.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="237.58" y="602.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="237.58" y="602.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="248.58" y="602.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="248.58" y="602.47" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="259.58" y="602.47" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="259.58" y="602.47" width="11.00" height="11.00" fill="transparent"/></a><a href="htt <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="72.00 80.93 84.30 93.28 96.92 104.81 113.44 118.82 133.36 137.05 146.13 155.62 159.31 167.50 176.31 184.94 194.03 202.42 211.50 219.69 228.14 236.53 240.23 248.86 257.94 266.34 274.97 278.61 287.58 290.95" y="413.87" font-size="14.00" class="sc-poppinsmedium">8.6 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">以及容器通信协议）的混杂作用，最终使</text><text x="272.89 279.39 285.36 290.12 299.95 303.04 309.72 315.40 318.39 323.77 330.61 336.57 343.25 349.10" y="82.61" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="358.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评估。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="131.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下在</text><text x="314.63 321.13 327.09 331.85 341.69 344.78 351.46 357.13 360.12 365.50 372.34 378.31 384.98 390.84 397.42 400.32 406.28 408.82" y="131.19" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="418.54" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="454.44" y="131.19" font-size="11.00" class="sc-loraregular">66.36%</text><text x="491.91" y="131.19" font-size="11.00" class="sc-notoserifcjksc">；被安全</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">防护措施标记的请求由回退（</text><text x="215.00" y="146.81" font-size="11.00" class="sc-loraregular">fallback</text><text x="254.21" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）模型按照默认的服务端回退策略作答（占请求的</text><text x="49 font-size="9.00" class="sc-notoserifcjksc">除外，它展示四个档位（</text><text x="367.04" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="383.24" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="392.24" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="424.64" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="433.64" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="457.61" y="556.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="468.98" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="495.99" y="556.61" font-size="9.00" class="sc-notoserifcjksc">）。两个来</text><text x="72.00" y="568.31" font-size="9.00" class="sc-notoserifcjksc">源均未提供不确定性区间，因此图中未显示。请注意，</text><text x="288.00" y="568.31" font-size="9.00" class="sc-loraregular">y</text><text x="295.12" y="568.31" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="315.49 320.18 325.20" y="568.31" font-size="9.00" class="sc-loraregular">23%</text><text x="335.39" y="568.31" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的差异在视觉上被放</text><text x="72.00" y="580.01" font-size="9.00" class="sc-notoserifcjksc">大。</text><text x="72.00 78.89 82.97 90.11 93.20 98.54 108.64 114.24 118.50" y="678.17" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="127.98" y="678.17" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87 162.97 168.57 172.83 179.42 186.30 190.99 196.95 203.63" y="678.17" font-size="11.00" class="sc-loraregular">MathArena</text><text x="212.20" y="678.17" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准测试。题目每月从近期的</text><text x="501.09 506.76 510.85 517.98 521.08" y="678.17" font-size="11.00" class="sc-loraregular">arXiv</text><text x="529.52" y="678.17" font-size="11.00" class="sc-notoserifcjksc">论</text><text x="72.00" y="693.79" font-size="11.00" class="sc-notoserifcjksc">文中提取，随后经过自动和人工检查筛选，以确保题目自成一体、并非平凡且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">可验证。由于题目取自活跃的研究，该基准比竞赛或奥赛类基准更贴近现实，与数学研究的联系</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">也更紧密。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89 147.78 151.86 159.00 162.09 167.44 177.53 183.13 187.39" y="147.38" font-size="11.00" class="sc-loraregular">ArXivMath</text><text x="196.87" y="147.38" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87 235.78 242.53 248.44" y="147.38" font-size="11.00" class="sc-loraregular">2026</text><text x="257.69" y="147.38" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="147.38" font-size="11.00" class="sc-loraregular">8</text><text x="280.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.66" y="147.38" font-size="11.00" class="sc-loraregular">57</text><text x="316.62" y="147.38" font-size="11.00" class="sc-notoserifcjksc">道题）上评估了</text><text x="396.51 404.20 407.19 412.80 419.37 425.95 431.91 434.80 443.54 450.10 456.67 461.76 464.66 470.65 473.36" y="147.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="479.35" y="147.38" font-size="11.00" class="sc-notoserifcjksc">。该版本的</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">构建方式与早期版本不同：</text><text x="204.00 214.10 219.70 223.95 230.54 237.43 242.12 248.08 254.75" y="163.00" font-size="11.00" class="sc-loraregular">MathArena</text><text x="263.32" y="163.00" font-size="11.00" class="sc-notoserifcjksc">现在优先采用能够解决或推翻先前提出的猜想的结果，</text><text x="527.32" y="163.00" font-size="11.00" class="sc-loraregular">57</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="118.89" y="178.62" font-size="11.00" class="sc-loraregular">25</text><text x="133.69" y="178.62" font-size="11.00" class="sc-notoserifcjksc">道来自此类结果，并且</text><text x="243.69" y="178.62" font-size="11.00" class="sc-loraregular">“</text><text x="248.09" y="178.62" font-size="11.00" class="sc-notoserifcjksc">经过专门表述，仅猜测猜想中的值会得到错误答案</text><text x="490.09" y="178.62" font-size="11.00" class="sc-loraregular">”</text><text x="493.93" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。因此，</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">这套题奖励的是推导出答案，而不是回忆既有文献。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34" y="244.53" font-size="11.00" class="sc-loraregular">max</text><text x="157.57" y="244.53" font-size="11.00" class="sc-notoserifcjksc">推理强度下，不使用工具时得分</text><text x="314.46" y="244.53" font-size="11.00" class="sc-loraregular">91.2%</text><text x="343.01" y="244.53" font-size="11.00" class="sc-notoserifcjksc">，使用工具（代码执行沙箱，无互联网</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">访问）时得分</text><text x="140.89" y="260.15" font-size="11.00" class="sc-loraregular">96.9%</text><text x="172.24" y="260.15" font-size="11.00" class="sc-notoserifcjksc">，均为每题四次尝试的平均值。作为对比，在相同设置下，</text><text x="458.24 465.93 468.92 474.53 481.10 487.68 493.64 496.53 502.12 507.80 514.20 517.19 523.15 526.05 532.04 534.75" y="260.15" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="162.89" y="275.77" font-size="11.00" class="sc-loraregular">82.9%</text><text x="193.62" y="275.77" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="284.51" y="275.77" font-size="11.00" class="sc-loraregular">92.1%</text><text x="313.05" y="275.77" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="324.05 331.74 334.74 340.35 346.91 353.49 359.45 362.35 371.08 377.65 384.21 389.31 392.20" y="275.77" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="401.09" y="275.77" font-size="11.00" class="sc-notoserifcjksc">则分别为</text><text x="447.98" y="275.77" font-size="11.00" class="sc-loraregular">78.1%</text><text x="478.41" y="275.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="492.30 498.66 505.31 508.02 513.98" y="275.77" font-size="11.00" class="sc-loraregular">90.4%</text><text x="523.55" y="275.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89 92.07 94.78 100.96 103.67" y="291.39" font-size="11.00" class="sc-loraregular">8.9.A</text><text x="113.45" y="291.39" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="138.34 144.52 147.23 153.41 156.12" y="291.39" font-size="11.00" class="sc-loraregular">8.9.B</text><text x="165.85" y="291.39" font-size="11.00" class="sc-notoserifcjksc">展示了各推理强度档位下的分数与每任务成本的关系。</text><text x="72.00 82.10 87.70 91.95 98.54 105.43 110.12 116.08 122.75" y="341.67" font-size="11.00" class="sc-loraregular">MathArena</text><text x="131.32" y="341.67" font-size="11.00" class="sc-notoserifcjksc">自己的</text><text x="167.22" y="341.67" font-size="11.00" class="sc-loraregular">8</text><text x="176.29" y="341.67" font-size="11.00" class="sc-notoserifcjksc">月排行榜使用了不同的设置：每个模型在其厂商的智能体运行框架中运行，</text><text x="72.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">可使用</text><text x="107.89 114.72 120.59 124.84 131.43 137.87" y="357.29" font-size="11.00" class="sc-loraregular">Python</text><text x="147.44" y="357.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="161.33 167.57 173.24 179.27 185.10 195.20 200.80 205.06" y="357.29" font-size="11.00" class="sc-loraregular">SageMath</text><text x="211.64" y="357.29" font-size="11.00" class="sc-notoserifcjksc">；提示词要求模型在找不到解答时给出最佳猜测；每题两次尝试；</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">并使用</text><text x="107.89" y="372.91" font-size="11.00" class="sc-loraregular">LLM</text><text x="133.60" y="372.91" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="188.60 194.96 201.32 211.41 214.31 217.18 223.75 230.32 236.35" y="372.91" font-size="11.00" class="sc-loraregular">LLM judge</text><text x="242.31" y="372.91" font-size="11.00" class="sc-notoserifcjksc">）。在该设置下，他们报告</text><text x="377.21 385.58 392.24 398.58 403.96 410.32 413.21 420.09 425.19 429.44 434.13" y="372.91" font-size="11.00" class="sc-loraregular">GPT-6 Astra</text><text x="439.81" y="372.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="450.81" y="372.91" font-size="11.00" class="sc-loraregular">max</text><text x="472.15" y="372.91" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="72.00 78.18 84.36 86.96 93.32" y="388.53" font-size="11.00" class="sc-loraregular">88.6%</text><text x="102.89" y="388.53" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="113.89 121.58 124.57 130.18 136.75 143.32 149.29 152.18 157.77 163.44 169.85 172.84 178.80 181.69 187.69 190.39" y="388.53" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="194.40" y="388.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="205.40 211.99 215.08 221.42" y="388.53" font-size="11.00" class="sc-loraregular">high</text><text x="228.01" y="388.53" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="263.91 270.09 274.68 277.03 282.10" y="388.53" font-size="11.00" class="sc-loraregular">87.7%</text><text x="291.67" y="388.53" font-size="11.00" class="sc-notoserifcjksc">。这些数字最接近我们</text><text x="401.67" y="388.53" font-size="11.00" class="sc-loraregular">“</text><text x="406.07" y="388.53" font-size="11.00" class="sc-notoserifcjksc">使用工具</text><text x="450.07" y="388.53" font-size="11.00" class="sc-loraregular">”</text><text x="453.91" y="388.53" font-size="11.00" class="sc-notoserifcjksc">的结果，但不可</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">直接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 118.57 122.40 128.69 131.57 136.12 144.80 149.48 153.20" y="390.42" font-size="9.00" class="sc-lorabold">8.9.A] ArXivMath</text><text x="158.79" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="167.79" y="390.42" font-size="9.00" class="sc-lorabold">2026</text><text x="190.65" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="202.01" y="390.42" font-size="9.00" class="sc-lorabold">8</text><text x="209.53" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">月）不使用工具时的准确率分数。</text><text x="344.53 350.82 353.27 357.86 363.23 368.61 373.49 375.86 383.00 388.38 393.75 397.92 400.28 405.19 407.40" y="390.42" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="412.31" y="390.42" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="421.31 427.60 430.05 434.64 440.01 445.39 450.27 452.64 457.21 461.85 467.09 469.54 474.42 476.78 481.69 483.90" y="390.42" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="489.55" y="390.42" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="500.91 507.20 509.65 514.24 519.61 525.00" y="390.42" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00" y="402.12" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="103.70" y="402.12" font-size="9.00" class="sc-notoserifcjksc">在内部进行评估，未启用安全防护分类器，涵盖多个推理强度档位。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 103.98 107.36 115.09 120.09 128.38 137.19 142.18 150.99 164.49 172.68 180.70 189.13 196.93" y="477.04" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 ProgramBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00" y="389.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 118.57 122.40 128.69 131.57 136.12 144.80 149.48 153.20" y="389.49" font-size="9.00" class="sc-lorabold">8.9.B] ArXivMath</text><text x="158.79" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="167.79" y="389.49" font-size="9.00" class="sc-lorabold">2026</text><text x="190.65" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="202.01" y="389.49" font-size="9.00" class="sc-lorabold">8</text><text x="209.53" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">月）使用工具时的准确率分数。</text><text x="335.53 341.82 344.27 348.86 354.23 359.61 364.49 366.86 374.00 379.38 384.75 388.92 391.28 396.19 398.40" y="389.49" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="403.31" y="389.49" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="412.31 418.60 421.05 425.64 431.01 436.39 441.27 443.64 448.21 452.85 458.09 460.54 465.42 467.78 472.69 474.90" y="389.49" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="480.55" y="389.49" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="491.91 498.20 500.65 505.24 510.61 516.00" y="389.49" font-size="9.00" class="sc-loraregular">Claude</text><text x="72.00" y="401.19" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="103.70" y="401.19" font-size="9.00" class="sc-notoserifcjksc">在内部进行评估，未启用安全防护分类器，涵盖多个推理强度档位。</text><text x="72.00" y="436.14" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="436.14" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="501.13" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82" y="501.13" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准测试，包含</text><text x="362.71" y="501.13" font-size="11.00" class="sc-loraregular">200</text><text x="385.17" y="501.13" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体只获得</text><text x="72.00" y="516.75" font-size="11.00" class="sc-notoserifcjksc">一个由开源项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网或反编译工具的</text><text x="72.00" y="532.37" font-size="11.00" class="sc-notoserifcjksc">情况下重建一个能复现原程序行为的代码库。任务范围从小型终端工具（</text><text x="424.00" y="532.37" font-size="11.00" class="sc-loraregular">jq</text><text x="433.21" y="532.37" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="444.21 448.97 452.06 458.63 464.71 469.40 475.36" y="532.37" font-size="11.00" class="sc-loraregular">ripgrep</text><text x="481.93" y="532.37" font-size="11.00" class="sc-notoserifcjksc">）到大型系</text><text x="72.00" y="547.99" font-size="11.00" class="sc-notoserifcjksc">统（</text><text x="94.00 100.03 105.95 115.78 122.35 128.31" y="547.99" font-size="11.00" class="sc-loraregular">FFmpeg</text><text x="134.39" y="547.99" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="145.39 151.63 160.29 166.64 169.91 174.17" y="547.99" font-size="11.00" class="sc-loraregular">SQLite</text><text x="180.13" y="547.99" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="191.13 197.74 206.32" y="547.99" font-size="11.00" class="sc-loraregular">PHP</text><text x="215.88" y="547.99" font-size="11.00" class="sc-notoserifcjksc">解释器）不等。提交结果通过超过</text><text x="383.77 389.44 395.40 399.99 402.59 409.43 416.26" y="547.99" font-size="11.00" class="sc-loraregular">247,000</text><text x="425.99" y="547.99" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测试</text><text x="72.00" y="563.61" font-size="11.00" class="sc-notoserifcjksc">进行评分，这些测试由智能体驱动的模糊测试生成。</text><text x="72.00" y="630.66" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="630.66" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="630.66" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试套件上得分低于</text><text x="389.77 396.42 399.13" y="630.66" font-size="11.00" class="sc-loraregular">0.9</text><text x="408.38" y="630.66" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳</text><text x="72.00" y="646.28" font-size="11.00" class="sc-notoserifcjksc">定性），剩余</text><text x="140.89" y="646.28" font-size="11.00" class="sc-loraregular">166</text><text x="160.51" y="646.28" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务中，我们只依据参考二进制文件能够通过的测试进行评</text><text x="72.00" y="661.90" font-size="11.00" class="sc-notoserifcjksc">分。我们使用与上游代码仓库相同的</text><text x="250.89 260.73 263.82 270.49 273.59 278.97 284.06 292.74 298.70 304.08 309.75 315.78 321.74 328.32" y="661.90" font-size="11.00" class="sc-loraregular">mini-swe-agent</text><text x="335.47" y="661.90" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六</text><text x="72.00" y="677.52" font-size="11.00" class="sc-notoserifcjksc">小时时间限制。在该任务集上，</text><text x="226.00 233.69 236.68 242.29 248.86 255.44 261.40 264.29 273.03 279.59 286.16 291.25 294.15 300.14 302.85" y="677.52" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="311.73" y="677.52" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="336.63" y="677.52" font-size="11.00" class="sc-loraregular">91.2%</text><text x="365.17" y="677.52" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="390.07 397.75 400.75 406.36 412.92 419.50 425.46 428.36 433.94 439.62 446.02 449.01 454.98 457.87 463.86 466.57" y="677.52" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="473.47" y="677.52" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="498.36 504.54 509.13 511.73 518.08" y="677.52" font-size="11.00" class="sc-loraregular">87.6%</text><text x="527.65" y="677.52" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="693.14" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="693.14" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="173.93" y="693.14" font-size="11.00" class="sc-loraregular">85.4%</text><text x="204.34" y="693.14" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 100.20 103.58 112.74 121.18 134.68 143.49 151.93 155.36 160.19 167.75 170.90 177.84 181.22 186.99 195.80 202.74 207.57 210.95 217.76 224.25 233.06" y="205.86" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.1 Humanity’s Last Exam</text><text x="72.00" y="713.04" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.57 93.56 98.72 104.79 107.32 109.95 115.72 118.18 120.71 123.34 128.69 132.56 135.19 140.34 143.06 145.52 148.15 151.20 156.57 162.70 168.07 173.52 176.57 179.03 181.66 189.26 195.23 204.17 209.33 215.39 218.36 222.25 227.53 229.09 233.72 236.35 242.34 247.50 252.13 256.00 258.63 264.84 270.14 275.30 284.24 286.70 289.32 294.48 298.19 304.68 307.49 312.54 315.03 320.40 325.85 332.06 335.70 338.16 341.79 347.21 352.36 357.78 363.40" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="368.48 374.38 378.35 382.22 388.19 392.81 395.31 399.00 405.46 410.62 414.94 420.24 423.05 427.71 430.17 436.02 440.29 445.82 452.28 457.44 463.25 467.53 474.43 479.80 485.25 491.45 495.09 497.55 501.19 506.61 511.75 517.17" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89 125.56 130.24 136.68 142.76 147.45 153.12 162.89 169.74 175.70 182.37 188.23" y="98.80" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="197.71" y="98.80" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="384.71" y="98.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="432.15" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了直至</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">完整</text><text x="96.89 100.90 110.99 113.89 118.15 124.58 130.41 136.37" y="114.42" font-size="11.00" class="sc-loraregular">1M token</text><text x="145.94" y="114.42" font-size="11.00" class="sc-notoserifcjksc">窗口的一系列上下文长度，而且这些任务所考察的长上下文能力与实际下游用例</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">高度契合。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00 80.37 86.94 96.77 102.45 109.13 112.39 116.67 122.48 124.20 129.29 132.18 138.78 144.46 149.55 153.81 156.70 163.54 169.37 175.05" y="229.73" font-size="11.00" class="sc-loraregular">Humanity’s Last Exam</text><text x="184.88" y="229.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="229.73" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="229.73" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="226.07" font-size="6.60" class="sc-loraregular">20</text><text x="239.20" y="229.73" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含横跨数十个学科的</text><text x="473.09 479.00 481.77 487.76 494.60" y="229.73" font-size="11.00" class="sc-loraregular">2,500</text><text x="504.33" y="229.73" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">目。这些题目由领域专家编写和审核，仅保留前沿大语言模型无法回答的题目，并且经过专门设</text><text x="72.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">计，无法通过互联网搜索快速得到答案。</text><text x="72.00" y="310.92" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 242.92 249.49 256.05 261.15 264.04 270.03 272.74" y="310.92" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="278.73" y="310.92" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="289.73" y="310.92" font-size="11.00" class="sc-loraregular">(1)</text><text x="303.34" y="310.92" font-size="11.00" class="sc-notoserifcjksc">纯推理，不使用工具；</text><text x="413.34" y="310.92" font-size="11.00" class="sc-loraregular">(2)</text><text x="428.85" y="310.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓</text><text x="72.00" y="326.54" font-size="11.00" class="sc-notoserifcjksc">取、程序化工具调用和代码执行。在所有运行中，思考设为</text><text x="360.89 366.50 373.07 377.33" y="326.54" font-size="11.00" class="sc-loraregular">auto</text><text x="383.76" y="326.54" font-size="11.00" class="sc-notoserifcjksc">（自动），且跨上下文使用的</text><text x="72.00 76.26 82.69 88.52 94.48" y="342.16" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">总数上限为</text><text x="161.95" y="342.16" font-size="11.00" class="sc-loraregular">1M</text><text x="176.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。</text><text x="330.05 337.74 340.73 346.34 352.91 359.48 365.45 368.34 377.07 383.64 390.21 395.30 398.19 404.16 406.75" y="342.16" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="416.00" y="342.16" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="408.06" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们为搜索器和抓取器屏蔽了已知会讨论</text><text x="470.89" y="408.06" font-size="11.00" class="sc-loraregular">HLE</text><text x="495.57" y="408.06" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="423.68" font-size="11.00" class="sc-notoserifcjksc">（参见附录</text><text x="129.89 136.07 138.78" y="423.68" font-size="11.00" class="sc-loraregular">9.2</text><text x="144.69" y="423.68" font-size="11.00" class="sc-notoserifcjksc">）。我们还用文本规则筛查每一份回答正确的对话记录，查找使用</text><text x="466.58" y="423.68" font-size="11.00" class="sc-loraregular">HLE</text><text x="491.25" y="423.68" font-size="11.00" class="sc-notoserifcjksc">特定来源</text><text x="72.00" y="439.30" font-size="11.00" class="sc-notoserifcjksc">的迹象，并使用</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 198.92 205.49 212.05 217.15 220.04" y="439.30" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="228.93" y="439.30" font-size="11.00" class="sc-notoserifcjksc">审查每一份被标记的对话记录。经确认的作弊案例被重新评为错</text><text x="72.00" y="454.92" font-size="11.00" class="sc-notoserifcjksc">误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.48" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 127.66 133.22 141.50 146.21 151.96 154.86 158.58 163.54 165.27 169.63 172.00 177.43 182.15 186.52 190.23 192.60 198.22 203.15 207.86" y="367.92" font-size="9.00" class="sc-lorabold">8.11.1.A] Humanity’s Last Exam</text><text x="216.14" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.92" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">，使用工具）推理强度扩展</text><text x="351.46" y="367.92" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="407.83" y="367.92" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="426.40" y="367.92" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="455.76" y="367.92" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="474.33" y="367.92" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="485.70" y="367.92" font-size="9.00" class="sc-loraregular">HLE</text><text x="505.89" y="367.92" font-size="9.00" class="sc-notoserifcjksc">准确率</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.15 106.53 115.74 123.96 133.02 143.06" y="429.01" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.2 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">21</text><text x="80.03 86.13 92.12 97.97 104.04 109.56 112.09 114.72 118.24 120.70 123.23 125.86 131.20 135.07 137.70 142.86 145.58 148.04 150.67 153.72 159.08 165.22 170.59 176.25 179.30 181.75 184.38 191.73 198.50 204.71 211.69 219.63 222.13 224.76 229.92 232.54 237.86 242.12 247.97 252.60 257.22 262.11 268.09 273.94 282.87 288.03 290.84 296.91 299.54 305.36 310.77 316.84 322.16 328.15 337.08 342.24 346.53 351.90 354.53 357.86 363.70 368.03 370.66 378.11 383.47 388.89 394.86 397.49 403.70 409.11 413.74 419.14 424.30 428.56 433.88 439.86 442.49 448.75 454.02 459.33 465.30 469.56 474.72 479.99 484.71" y="704.45" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: a cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 127.66 133.22 141.50 146.21 151.96 154.86 158.58 163.54 165.27 169.63 172.00 177.43 182.15 186.52 190.23 192.60 198.22 203.15 207.86" y="367.93" font-size="9.00" class="sc-lorabold">8.11.1.B] Humanity’s Last Exam</text><text x="216.14" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.93" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">，不使用工具）测试时计算扩展</text><text x="369.46" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="425.83" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="444.40" y="367.93" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="473.76" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="492.33" y="367.93" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="503.70" y="367.93" font-size="9.00" class="sc-loraregular">HLE</text><text x="523.89" y="367.93" font-size="9.00" class="sc-notoserifcjksc">准</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">确率与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费用。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="452.86" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="452.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="452.86" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="449.19" font-size="6.60" class="sc-loraregular">21</text><text x="414.83" y="452.86" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.73 446.28 452.24 457.01 463.57 466.57 472.47 478.30 481.57 485.85" y="452.86" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.55" y="452.86" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="468.48" font-size="11.00" class="sc-notoserifcjksc">度研究基准测试，旨在评估模型在真实用户会提出的各类复杂研究问题上的表现。</text><text x="468.00 476.09 483.53 490.36 498.05" y="468.48" font-size="11.00" class="sc-loraregular">DRACO</text><text x="509.68" y="468.48" font-size="11.00" class="sc-notoserifcjksc">包含</text><text x="72.00" y="484.10" font-size="11.00" class="sc-loraregular">100</text><text x="92.56" y="484.10" font-size="11.00" class="sc-notoserifcjksc">个精选任务，这些任务源自多个领域的用户查询。题目依据专家编写的评分细则进行评分，</text><text x="72.00" y="499.72" font-size="11.00" class="sc-notoserifcjksc">评分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="566.42" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="566.42" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="566.42" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="582.04" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="582.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="582.04" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="615.00" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89 126.98 134.43 141.26 148.95" y="615.00" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57" y="615.00" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46 226.84 232.80 242.63 245.72 252.40 255.49 258.38 264.51 267.40 274.07 278.76" y="615.00" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="288.08" y="615.00" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们的</text><text x="72.00" y="630.62" font-size="11.00" class="sc-notoserifcjksc">评估中，我们使用</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.60" y="630.62" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="248.85" y="630.62" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用相同的二元</text><text x="72.00 82.10 88.94 95.20 102.79 111.06 119.44 129.54 136.38" y="646.24" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="146.32" y="646.24" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="646.24" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="646.24" font-size="11.00" class="sc-notoserifcjksc">节中的公式汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="617.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的规程，对每个回答进行五次独立的评分运行并报告平均值。我们的评判提</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">示词取自论文的</text><text x="149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="173.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="190.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文的附录</text><text x="259.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="268.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判者的选择可能使绝对分数变动</text><text x="469.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="483.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="497.47" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="512.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">但系统间的排序保持不变，因此我们的分数与论文中的主要数字不可直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00 78.57 83.25 89.69 99.52 106.09" y="195.39" font-size="11.00" class="sc-loraregular">prompt</text><text x="110.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，</text><text x="407.35 411.60 418.04 423.87 429.83" y="195.39" font-size="11.00" class="sc-loraregular">token</text><text x="439.40" y="195.39" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="475.29" y="195.39" font-size="11.00" class="sc-loraregular">980k</text><text x="500.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件，且只对该文件的内容评分，而非对完整的智</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">能体对话记录评分；这样可以将交付物与中间工具输出隔离开来。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="556.05" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="173.95" y="556.05" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32" y="556.05" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37" y="556.05" font-size="9.00" class="sc-notoserifcjksc">任务预算下，推理强度从</text><text x="489.74" y="556.05" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="508.30" y="556.05" font-size="9.00" class="sc-notoserifcjksc">提升到</text><text x="72.00" y="567.75" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="90.57" y="567.75" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="101.94 108.55 114.64 120.23 126.52" y="567.75" font-size="9.00" class="sc-loraregular">DRACO</text><text x="136.04" y="567.75" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费</text><text x="72.00" y="579.45" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00 82.46 89.35 97.73 105.81" y="641.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">WANDR</text><text x="112.72" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72 134.48 137.57 144.15 150.11 153.00 159.89 168.16 174.74 177.63 185.83 191.74 197.70 204.26 207.16 213.99 219.95 225.04 230.98 236.66 241.35 247.20" y="641.20" font-size="11.00" class="sc-loraregular" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68 285.23 291.20 295.96 302.53 305.52 311.43 317.26 320.52 324.80" y="641.20" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="333.50" y="641.20" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，旨在为</text><text x="457.40 465.48 472.93 479.76 487.45" y="641.20" font-size="11.00" class="sc-loraregular">DRACO</text><text x="499.08" y="641.20" font-size="11.00" class="sc-notoserifcjksc">深度研</text><text x="72.00" y="656.82" font-size="11.00" class="sc-notoserifcjksc">究基准提供一个广度搜索方面的对应基准。它包含</text><text x="316.89" y="656.82" font-size="11.00" class="sc-loraregular">500</text><text x="339.44" y="656.82" font-size="11.00" class="sc-notoserifcjksc">个任务，在这些任务中，模型必须搜索数</text><text x="72.00" y="672.44" font-size="11.00" class="sc-notoserifcjksc">十到数百个实体，查找每个实体的相关事实，并将这些事实连同引用列入结构化记录。我们运行</text><text x="72.00" y="688.06" font-size="11.00" class="sc-notoserifcjksc">的是该评估的修改版本；方法上的差异将在下文说明。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="173.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="632.40" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="632.40" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="632.40" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="632.40" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="632.40" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="632.40" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="632.40" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89 400.25 406.43 413.26 419.17 422.06 426.32 432.76 438.59 444.55" y="98.80" font-size="11.00" class="sc-loraregular">980k token</text><text x="454.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="114.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可以使用与被测模型相同的网页</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">抓取工具。评分者会重新抓取所引用的</text><text x="261.89" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="283.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后评判模型判断这些参考来源是否支持解答。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32 171.42 177.80 181.65 185.90 188.80 194.83" y="179.77" font-size="11.00" class="sc-loraregular">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型完成</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">了所要求事实集合中的多少）之间取得平衡。当所需事实只有部分能够得到验证时，给予部分得</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">分。结果为</text><text x="129.89" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="152.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不是使整个任务判</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">为失败。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线的网络搜索和网页抓取工具，只能访问一个冻结索引；</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="292.54" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82" y="292.54" font-size="11.00" class="sc-notoserifcjksc">的版本使用的是实时网络。</text><text x="258.82 266.51 269.51 275.11 281.68 288.26" y="292.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="297.11" y="292.54" font-size="11.00" class="sc-notoserifcjksc">模型由</text><text x="333.01 340.70 343.69 349.30 355.87 362.44 368.41 371.30 380.03 386.60 393.17 398.26 401.15 407.11 409.71" y="292.54" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="418.96" y="292.54" font-size="11.00" class="sc-notoserifcjksc">进行评判，这与</text><text x="72.00 78.56 84.52 89.28 95.85 98.84 104.75 110.58 113.84 118.12" y="308.16" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="126.82" y="308.16" font-size="11.00" class="sc-notoserifcjksc">所用的</text><text x="162.72 171.09 177.75 184.09 189.47 195.46 198.17" y="308.16" font-size="11.00" class="sc-loraregular">GPT-5.4</text><text x="207.03" y="308.16" font-size="11.00" class="sc-notoserifcjksc">不同。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="484.92 491.47 497.44 502.20 508.77 511.76 517.67 523.49 526.76 531.04" y="308.16" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="72.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，我们的结果与竞争对手模型的已报告数字不可直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63 431.83 436.89 442.48 447.31 449.68 453.16 458.42 463.19 468.07" y="653.19" font-size="9.00" class="sc-loraregular">980k token</text><text x="473.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，且不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p189.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 189 页"><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 86.92 92.08 98.15 103.67 106.20 108.83 112.35 114.81 117.34 119.97 125.32 129.18 131.81 136.97 139.69 142.15 144.78 147.83 153.19 159.33 164.70 170.36 173.41 175.87 178.49 184.55 188.81 194.66 200.19 204.44 209.60 218.48 224.70 230.11 236.18 241.50 247.49 249.99 252.61 259.60 264.76 270.83 273.46 276.18 281.33 287.40 292.93 298.90 304.05 309.53 314.95 317.58 326.52 332.36 338.34 343.76 346.48 351.11 353.73 357.99 363.41 369.23 375.20 378.01 380.72 386.70 389.33 395.30 399.56 405.40 410.93 415.19 420.35 429.28 433.91 436.54 439.92 444.18 450.03 458.96 461.59 466.22 471.54 475.80 480.88 484.75 490.07 495.87" y="704.45" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.51 122.82 129.03 134.60 140.04 145.46 151.24" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2605.03546.</text><text x="156.33 162.22 166.19 170.06 176.03 180.66 183.16 186.84 193.30 198.46 202.79 208.08 210.89 215.55 218.01 223.86 228.14 233.66 240.12 245.28 251.10 255.38 262.27 267.64 273.42 279.63 285.07 287.38 293.59 299.16 304.61 310.02" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.03546</text><text x="504.00 507.28 512.27" y="751.80" font-size="9.00" class="sc-loraregular">189</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="110.77" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="110.77" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63" y="110.77" font-size="11.00" class="sc-notoserifcjksc">在多智能体配置下的性能。下文中，我们重点介绍小型团队相对于</text><text x="72.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">单智能体在</text><text x="129.89 136.56 141.25 147.68 153.76 158.45 164.13 173.89 180.74 186.70 193.37 199.23" y="126.39" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="205.82" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="230.71" y="126.39" font-size="11.00" class="sc-loraregular">8.12.1</text><text x="259.11" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）和</text><text x="295.00 303.09 310.54 317.37 325.06" y="126.39" font-size="11.00" class="sc-loraregular">DRACO</text><text x="333.79" y="126.39" font-size="11.00" class="sc-notoserifcjksc">（第</text><text x="358.68" y="126.39" font-size="11.00" class="sc-loraregular">8.12.2</text><text x="388.99" y="126.39" font-size="11.00" class="sc-notoserifcjksc">节）上的优势，并讨论大型团</text><text x="72.00" y="142.01" font-size="11.00" class="sc-notoserifcjksc">队协作解决更宏大问题的初显潜力（第</text><text x="261.89" y="142.01" font-size="11.00" class="sc-loraregular">8.12.3</text><text x="292.42" y="142.01" font-size="11.00" class="sc-notoserifcjksc">节）。我们还介绍了获得这些结果所用的多智能体</text><text x="72.00" y="157.63" font-size="11.00" class="sc-notoserifcjksc">运行框架（第</text><text x="140.89" y="157.63" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="171.25" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）以及测量方法（第</text><text x="284.15" y="157.63" font-size="11.00" class="sc-loraregular">8.12.5</text><text x="314.54" y="157.63" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.1</text><text x="107.09" y="222.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="162.18" y="222.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">ProgramBench</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="250.12" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92" y="246.46" font-size="6.60" class="sc-loraregular">22</text><text x="157.90" y="250.12" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="215.80" y="250.12" font-size="11.00" class="sc-loraregular">200</text><text x="238.26" y="250.12" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体只获得一个由开源</text><text x="72.00" y="265.74" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不访问互联网、不使用反编译工具的情况</text><text x="72.00" y="281.36" font-size="11.00" class="sc-notoserifcjksc">下重建一个能复现原程序行为的代码库。我们使用</text><text x="316.89" y="281.36" font-size="11.00" class="sc-loraregular">166</text><text x="336.51" y="281.36" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="347.51" y="281.36" font-size="11.00" class="sc-loraregular">“</text><text x="351.91" y="281.36" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="373.91" y="281.36" font-size="11.00" class="sc-loraregular">”</text><text x="377.75" y="281.36" font-size="11.00" class="sc-notoserifcjksc">任务，每个任务的参考二进制文</text><text x="72.00" y="296.98" font-size="11.00" class="sc-notoserifcjksc">件在隐藏测试套件上的得分至少为</text><text x="239.89 246.55 249.25" y="296.98" font-size="11.00" class="sc-loraregular">0.9</text><text x="255.61" y="296.98" font-size="11.00" class="sc-notoserifcjksc">。这与第</text><text x="302.51 308.69 311.39 315.40 322.05 324.76" y="296.98" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="331.66" y="296.98" font-size="11.00" class="sc-notoserifcjksc">节所述的标准相同，但本节的任务列表与该</text><text x="72.00" y="312.60" font-size="11.00" class="sc-notoserifcjksc">节的列表有四个任务不同，因为两份列表是根据参考二进制文件的不同运行汇编而成的，在这些</text><text x="72.00" y="328.22" font-size="11.00" class="sc-notoserifcjksc">运行之间，有少数任务越过了</text><text x="217.89 224.55 227.25" y="328.22" font-size="11.00" class="sc-loraregular">0.9</text><text x="236.51" y="328.22" font-size="11.00" class="sc-notoserifcjksc">的界线或未能完成评分。在本节中，我们展示多智能体</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="343.84" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="150.82" y="343.84" font-size="11.00" class="sc-notoserifcjksc">的结果，并将其与单智能体配置进行比较。</text><text x="72.00" y="412.27" font-size="11.00" class="sc-notoserifcjksc">我们将两种小规模多智能体运行框架配置与单智能体基线进行了比较：一个固定的五智能体团</text><text x="72.00" y="427.89" font-size="11.00" class="sc-notoserifcjksc">队，以及动态生成的异步子智能体（详见第</text><text x="283.89" y="427.89" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="314.25" y="427.89" font-size="11.00" class="sc-notoserifcjksc">节）。本节中的单智能体基线使用与多智能体</text><text x="72.00" y="443.51" font-size="11.00" class="sc-notoserifcjksc">配置相同的任务工具和评分方式，而非第</text><text x="272.89 279.08 281.78 285.79 292.44 295.15" y="443.51" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="302.04" y="443.51" font-size="11.00" class="sc-notoserifcjksc">节的运行框架，因此其分数与该节报告的分数不</text><text x="72.00" y="459.13" font-size="11.00" class="sc-notoserifcjksc">可直接比较。此外，第</text><text x="184.89 191.07 193.78 197.79 204.44 207.15" y="459.13" font-size="11.00" class="sc-loraregular">8.10.1</text><text x="214.04" y="459.13" font-size="11.00" class="sc-notoserifcjksc">节中展示的单智能体配置使用的是</text><text x="381.94 385.94 396.04 398.93 403.19 409.62 415.45 421.42" y="459.13" font-size="11.00" class="sc-loraregular">1M token</text><text x="430.99" y="459.13" font-size="11.00" class="sc-notoserifcjksc">预算，而这里我们使用</text><text x="72.00" y="474.75" font-size="11.00" class="sc-notoserifcjksc">上下文压缩和</text><text x="140.89 146.80 153.63 163.73 166.62 170.88 177.31 183.14 189.11" y="474.75" font-size="11.00" class="sc-loraregular">20M token</text><text x="198.68" y="474.75" font-size="11.00" class="sc-notoserifcjksc">预算，以确保多智能体团队更大的</text><text x="366.57 370.83 377.26 383.09 389.05" y="474.75" font-size="11.00" class="sc-loraregular">token</text><text x="398.62" y="474.75" font-size="11.00" class="sc-notoserifcjksc">消耗不会成为混杂因素。</text><text x="72.00" y="557.98" font-size="11.00" class="sc-notoserifcjksc">我们在一系列中间快照处进行评分，并利用由此得到的每个任务在分数、延迟和</text><text x="459.89 464.15 470.58 476.42 482.38" y="557.98" font-size="11.00" class="sc-loraregular">token</text><text x="491.95" y="557.98" font-size="11.00" class="sc-notoserifcjksc">上的轨</text><text x="72.00" y="573.60" font-size="11.00" class="sc-notoserifcjksc">迹，构建图</text><text x="129.89" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="167.89" y="573.60" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="192.78" y="573.60" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73" y="573.60" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。请注意，由于后勤方面的困难，本评估是在</text><text x="72.00" y="589.22" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="589.22" font-size="11.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p190.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 190 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="72.00" y="386.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="386.67" font-size="9.00" class="sc-lorabold">8.12.1.A] 166</text><text x="138.13" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="386.67" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 175.00 180.76 185.00 190.10 195.11 199.39 204.10 212.33 218.28 223.12 228.86 233.52" y="386.67" font-size="9.00" class="sc-lorabold">” ProgramBench</text><text x="241.48" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟关系。</text><text x="349.48" y="386.67" font-size="9.00" class="sc-notoserifcjksc">曲线上的单个点表示：如果每道题都在该秒数处</text><text x="72.00" y="398.38" font-size="9.00" class="sc-notoserifcjksc">停止，隐藏测试的平均通过比例。阴影区域表示</text><text x="263.37" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="283.67" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="409.24" y="398.38" font-size="9.00" class="sc-notoserifcjksc">），根据各任务间的得分方差计</text><text x="72.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">算得出。随着各题目完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点上仍在贡献数据的题目就越少。本评估是在</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76 132.66 134.87" y="421.77" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">如图</text><text x="96.89" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="134.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">所示，在这些任务上，与单智能体相比，五智能体团队和异步子智能体在相同分数</text><text x="72.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">下都表现出延迟上的改善。具体而言，在达到相同的</text><text x="327.89 334.55 337.14" y="494.36" font-size="11.00" class="sc-loraregular">0.6</text><text x="346.40" y="494.36" font-size="11.00" class="sc-notoserifcjksc">分时，五智能体团队相比单智能体实现</text><text x="72.00" y="509.98" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 91.80 94.15 99.22" y="509.98" font-size="11.00" class="sc-loraregular">2.7x</text><text x="107.95" y="509.98" font-size="11.00" class="sc-notoserifcjksc">的延迟改善。异步子智能体的曲线大体位于两者之间，相比单智能体有所改善，但改善幅</text><text x="72.00" y="525.59" font-size="11.00" class="sc-notoserifcjksc">度小于五智能体团队。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="72.00" y="386.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 125.42 130.59" y="386.67" font-size="9.00" class="sc-lorabold">8.12.1.B] 166</text><text x="138.13" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="147.13" y="386.67" font-size="9.00" class="sc-lorabold">“</text><text x="150.94" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="168.94 172.64 175.00 180.76 185.00 190.10 195.11 199.39 204.10 212.33 218.28 223.12 228.86 233.52" y="386.67" font-size="9.00" class="sc-lorabold">” ProgramBench</text><text x="241.48" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与</text><text x="297.85 301.56 306.62 311.74 316.58" y="386.67" font-size="9.00" class="sc-lorabold">token</text><text x="324.69" y="386.67" font-size="9.00" class="sc-notoserifcjkscbold">用量关系</text><text x="360.69" y="386.67" font-size="9.00" class="sc-notoserifcjksc">。曲线上的每个点表示：若每个问题都在该</text><text x="72.00 75.48 80.75 85.52 90.40" y="398.38" font-size="9.00" class="sc-loraregular">token</text><text x="98.23" y="398.38" font-size="9.00" class="sc-notoserifcjksc">用量处停止，隐藏测试平均能够通过的比例。阴影区域为</text><text x="325.59" y="398.38" font-size="9.00" class="sc-loraregular">95%</text><text x="345.90" y="398.38" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分方差计算。随着</text><text x="72.00" y="410.08" font-size="9.00" class="sc-notoserifcjksc">问题陆续完成运行，阴影带逐渐变淡：阴影带越淡，说明在曲线该点上仍在贡献数据的问题越少。此项评估是在</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.2
