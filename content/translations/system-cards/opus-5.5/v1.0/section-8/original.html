2 125.39 127.76 132.66 134.87" y="421.77" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="142.15" y="421.77" font-size="9.00" class="sc-notoserifcjksc">的另一个大体可比的快照上运行的。</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">结合图</text><text x="107.89" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.A</text><text x="145.89" y="478.73" font-size="11.00" class="sc-notoserifcjksc">来看，图</text><text x="192.78" y="478.73" font-size="11.00" class="sc-loraregular">8.12.1.B</text><text x="230.73" y="478.73" font-size="11.00" class="sc-notoserifcjksc">进一步展示了多智能体运行框架中延迟与成本的权衡：当延迟很</text><text x="72.00" y="494.36" font-size="11.00" class="sc-notoserifcjksc">重要时，五智能体团队和异步子智能体能够通过在智能体之间分配工作，有效地消化额外的</text><text x="72.00 76.26 82.69 88.52 94.48" y="509.98" font-size="11.00" class="sc-loraregular">token</text><text x="104.05" y="509.98" font-size="11.00" class="sc-notoserifcjksc">预算，从而以更高的成本更快地达到给定得分。</text><text x="72.00" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.2</text><text x="109.84" y="558.04" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体</text><text x="164.94" y="558.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">DRACO</text><text x="72.00" y="585.92" font-size="11.00" class="sc-notoserifcjksc">我们还在</text><text x="118.89 126.98 134.43 141.26 148.95" y="585.92" font-size="11.00" class="sc-loraregular">DRACO</text><text x="160.57" y="585.92" font-size="11.00" class="sc-notoserifcjksc">上评估了小型多智能体团队。</text><text x="303.57 311.66 319.10 325.93 333.62" y="585.92" font-size="11.00" class="sc-loraregular">DRACO</text><text x="345.25" y="585.92" font-size="11.00" class="sc-notoserifcjksc">是一个深度研究基准测试，由</text><text x="491.14" y="585.92" font-size="11.00" class="sc-loraregular">100</text><text x="511.70" y="585.92" font-size="11.00" class="sc-notoserifcjksc">个精</text><text x="72.00" y="601.54" font-size="11.00" class="sc-notoserifcjksc">选任务组成，这些任务源自多个领域的用户查询（更多细节见第</text><text x="382.89" y="601.54" font-size="11.00" class="sc-loraregular">8.11.2</text><text x="411.30" y="601.54" font-size="11.00" class="sc-notoserifcjksc">节）。这些问题包括前期</text><text x="72.00" y="617.16" font-size="11.00" class="sc-notoserifcjksc">的网络研究和随后的报告生成，持续时间比</text><text x="283.89 290.56 295.24 301.68 307.76 312.45 318.12 327.89 334.74 340.70 347.37 353.23" y="617.16" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="362.71" y="617.16" font-size="11.00" class="sc-notoserifcjksc">短得多。单个任务的延迟在</text><text x="497.60" y="617.16" font-size="11.00" class="sc-loraregular">13</text><text x="510.63" y="617.16" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="524.52" y="617.16" font-size="11.00" class="sc-loraregular">71</text><text x="72.00" y="632.78" font-size="11.00" class="sc-notoserifcjksc">分钟之间。</text><text x="72.00" y="681.42" font-size="11.00" class="sc-notoserifcjksc">我们发现，在此类较短的问题上，多智能体团队由于存在协调开销，完成任务所需的时间可能比</text><text x="72.00" y="697.04" font-size="11.00" class="sc-notoserifcjksc">对应的单智能体更长。然而，多智能体团队的价值之一在于，当延迟</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是重要考量时，它们能加快工作的交付。因此，我们选择用这个数据集来考察多智能体团队如何</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">响应延迟激励。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们测试了两种不同的延迟激励。第一种是一般性的延迟压力：我们向</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="131.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18" y="131.19" font-size="11.00" class="sc-notoserifcjksc">提供一条关于时</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">间效率重要性的指令，并在每一步之后显示累计已用时间。第二种是延迟预算：给</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="146.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="509.18" y="146.81" font-size="11.00" class="sc-notoserifcjksc">一个</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">固定的时间窗口来完成工作。这种方式不提供指令，而是将预算与已用时间一并显示。我们取每</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">个任务的单智能体延迟，并将其分别按</text><text x="261.89 265.90 268.44 275.27" y="178.05" font-size="11.00" class="sc-loraregular">1.0x</text><text x="281.10" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="292.10 298.75 301.11 306.18 312.17" y="178.05" font-size="11.00" class="sc-loraregular">0.75x</text><text x="318.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="329.00 335.66 338.37 344.36" y="178.05" font-size="11.00" class="sc-loraregular">0.5x</text><text x="353.08" y="178.05" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="366.98 373.63 376.34 382.24 388.24" y="178.05" font-size="11.00" class="sc-loraregular">0.25x</text><text x="396.96" y="178.05" font-size="11.00" class="sc-notoserifcjksc">缩放，得到时间预算。这样，</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">每个任务都会得到一组按其自身完成时间缩放的预算。图</text><text x="349.89" y="193.67" font-size="11.00" class="sc-loraregular">8.12.2.A</text><text x="389.79" y="193.67" font-size="11.00" class="sc-notoserifcjksc">展示了该实验的结果。</text><text x="72.00" y="573.89" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 129.61 135.78 141.62 147.81" y="573.89" font-size="9.00" class="sc-lorabold">8.12.2.A] DRACO</text><text x="157.10" y="573.89" font-size="9.00" class="sc-notoserifcjkscbold">任务的得分与延迟关系。</text><text x="256.10" y="573.89" font-size="9.00" class="sc-notoserifcjksc">多智能体团队主导了得分</text><text x="355.10" y="573.89" font-size="9.00" class="sc-loraregular">–</text><text x="360.40" y="573.89" font-size="9.00" class="sc-notoserifcjksc">延迟帕累托前沿。每个点为两次运行的均值；</text><text x="72.00" y="585.59" font-size="9.00" class="sc-notoserifcjksc">延迟为每个任务的平均推导延迟（见第</text><text x="227.37" y="585.59" font-size="9.00" class="sc-loraregular">8.12.5</text><text x="252.23" y="585.59" font-size="9.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="612.94" font-size="11.00" class="sc-notoserifcjksc">尽管在没有时间压力时多智能体团队速度较慢，但随着时间预算越来越紧，它们主导了得分</text><text x="512.00" y="612.94" font-size="11.00" class="sc-loraregular">–</text><text x="518.49" y="612.94" font-size="11.00" class="sc-notoserifcjksc">延迟</text><text x="72.00" y="628.56" font-size="11.00" class="sc-notoserifcjksc">帕累托前沿。在</text><text x="151.89 158.55 161.25 167.25" y="628.56" font-size="11.00" class="sc-loraregular">0.5x</text><text x="175.97" y="628.56" font-size="11.00" class="sc-notoserifcjksc">的延迟预算下，五智能体团队能够超过单智能体的表现，且加速比约为</text><text x="72.00" y="644.18" font-size="11.00" class="sc-loraregular">2.8x</text><text x="92.62" y="644.18" font-size="11.00" class="sc-notoserifcjksc">。当无法预先估计合理的预算时，延迟压力也会促使两种多智能体团队都比未加提示的单智</text><text x="72.00" y="659.80" font-size="11.00" class="sc-notoserifcjksc">能体更早完成任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p193.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 193 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">193</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">所有这些运行均采用</text><text x="173.89" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="196.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度。需要注意的是，虽然降低推理强度和收紧延迟预算都能降低</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">任务延迟，但这两个调节手段对多智能体行为的影响有本质不同。前者导致总体工作量减少，而</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">后者通过维持更高的有效并行度，在给定延迟下保留了更多工作。即使在固定团队中也是如此，</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">固定团队表现出的空闲更少。</text><text x="72.00" y="180.28" font-size="11.00" class="sc-notoserifcjksc">对于异步子智能体而言，这种更高的有效并行度存在上限。在更紧的延迟预算下，派生新子智能</text><text x="72.00" y="195.90" font-size="11.00" class="sc-notoserifcjksc">体带来的协调与延迟开销变得足够大，以至于主智能体派生子智能体的频率大幅降低，并倾向于</text><text x="72.00" y="211.52" font-size="11.00" class="sc-notoserifcjksc">以单智能体方式行事。在发生这种崩塌的同一延迟水平上，预先派生的五智能体团队仍能保持高</text><text x="72.00" y="227.14" font-size="11.00" class="sc-notoserifcjksc">效的并行水平，这凸显了在该延迟尺度下预先派生的智能体团队的优势。</text><text x="72.00" y="291.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.3</text><text x="110.17" y="291.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">大型智能体团队</text><text x="72.00" y="319.86" font-size="11.00" class="sc-notoserifcjksc">许多高价值任务，例如开展科学研究、进行大规模软件工程项目以及经营企业，可能超出单个智</text><text x="72.00" y="335.48" font-size="11.00" class="sc-notoserifcjksc">能体的能力范围，而需要由大型智能体团队（从数十个到数千个）来分解工作、协调与沟通。为</text><text x="72.00" y="351.10" font-size="11.00" class="sc-notoserifcjksc">了衡量模型在此类团队中的运作情况，我们围绕大型、复杂且贴近现实的任务构建了一套新的评</text><text x="72.00" y="366.72" font-size="11.00" class="sc-notoserifcjksc">估。每个任务支持</text><text x="162.89" y="366.72" font-size="11.00" class="sc-loraregular">100</text><text x="183.45" y="366.72" font-size="11.00" class="sc-notoserifcjksc">多个智能体并发工作。我们利用这些评估来衡量并提升在大型团队中运作</text><text x="72.00" y="382.34" font-size="11.00" class="sc-notoserifcjksc">的智能体的能力与对齐（</text><text x="193.00 198.68 201.67 204.76 210.84 217.52 227.35 233.32 239.89" y="382.34" font-size="11.00" class="sc-loraregular">alignment</text><text x="244.15" y="382.34" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="465.61" font-size="11.00" class="sc-notoserifcjksc">在此，我们展示其中两个任务的结果，并报告当团队规模从</text><text x="360.89" y="465.61" font-size="11.00" class="sc-loraregular">1</text><text x="367.79" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体增长到</text><text x="447.68" y="465.61" font-size="11.00" class="sc-loraregular">100</text><text x="468.24" y="465.61" font-size="11.00" class="sc-notoserifcjksc">个智能体、且</text><text x="72.00" y="481.23" font-size="11.00" class="sc-notoserifcjksc">每个团队工作</text><text x="140.89 146.56" y="481.23" font-size="11.00" class="sc-loraregular">24</text><text x="155.41" y="481.23" font-size="11.00" class="sc-notoserifcjksc">小时时，</text><text x="199.41 207.10 210.09 215.70 222.27 228.85 234.81 237.70 246.44 253.01 259.57 264.67 267.56 273.55 276.26" y="481.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="285.15" y="481.23" font-size="11.00" class="sc-notoserifcjksc">的表现如何变化。（定量结果来自与发布版本略有不</text><text x="72.00" y="496.85" font-size="11.00" class="sc-notoserifcjksc">同的模型版本；表现相当。）第一个是知识库任务：智能体阅读一家公司的文档，并据此撰写一</text><text x="72.00" y="512.47" font-size="11.00" class="sc-notoserifcjksc">个带索引的笔记知识库；我们根据仅能查阅这些笔记的读者回答有关该公司问题的准确程度来为</text><text x="72.00" y="528.09" font-size="11.00" class="sc-notoserifcjksc">结果评分。第二个是数学形式化任务：智能体必须基于固定的陈述在</text><text x="404.89 411.25 417.19 422.87" y="528.09" font-size="11.00" class="sc-loraregular">Lean</text><text x="432.44" y="528.09" font-size="11.00" class="sc-notoserifcjksc">中证明一个具有挑战</text><text x="72.00" y="543.71" font-size="11.00" class="sc-notoserifcjksc">性的定理，中间定理的形式化作为加权里程碑。</text><text x="72.00" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在这两个任务上，</text><text x="160.00" y="627.52" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="207.44" y="627.52" font-size="11.00" class="sc-notoserifcjksc">在各个团队规模下均优于</text><text x="331.34 339.02 342.02 347.63 354.19 360.77 366.73 369.63 378.36 384.93 391.49 396.59 399.48" y="627.52" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="408.37" y="627.52" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="422.26 429.95 432.94 438.55 445.12 451.70 457.66 460.55 466.14 471.82 478.22 481.21 487.17 490.07 496.06 498.77" y="627.52" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="502.77" y="627.52" font-size="11.00" class="sc-notoserifcjksc">。在两</text><text x="72.00" y="643.14" font-size="11.00" class="sc-notoserifcjksc">个任务中，</text><text x="127.00" y="643.14" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="174.44" y="643.14" font-size="11.00" class="sc-notoserifcjksc">在每一种团队规模下都优于这两个模型。对于所有模型，得分总体上随团队</text><text x="72.00" y="658.76" font-size="11.00" class="sc-notoserifcjksc">规模增大而上升，但收益递减。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p194.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 194 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.31" y="367.92" font-size="9.00" class="sc-lorabold">8.12.3.A]</text><text x="123.15" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">知识库构建任务准确率随智能体团队规模的变化。</text><text x="321.15" y="367.92" font-size="9.00" class="sc-notoserifcjksc">数据点表示指定规模的智能体团队在</text><text x="467.51 472.15" y="367.92" font-size="9.00" class="sc-loraregular">24</text><text x="479.39" y="367.92" font-size="9.00" class="sc-notoserifcjksc">小时窗口内取</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">得的结果，为三次独立尝试的平均值。表现反映的是仅依赖团队生成文档的读者正确回答的留出问题所占比例（</text><text x="513.00" y="379.62" font-size="9.00" class="sc-loraregular">0–1</text><text x="529.54" y="379.62" font-size="9.00" class="sc-notoserifcjksc">范</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">围）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="367.17" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.17" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 117.31 120.78 123.15 128.58 133.43 138.14" y="367.17" font-size="9.00" class="sc-lorabold">8.12.3.B] Lean</text><text x="146.25" y="367.17" font-size="9.00" class="sc-notoserifcjkscbold">形式化任务准确率随智能体团队规模的变化。</text><text x="326.25" y="367.17" font-size="9.00" class="sc-notoserifcjksc">数据点表示指定规模的智能体团队在</text><text x="472.62 477.25" y="367.17" font-size="9.00" class="sc-loraregular">24</text><text x="484.50" y="367.17" font-size="9.00" class="sc-notoserifcjksc">小时窗口内取</text><text x="72.00" y="378.88" font-size="9.00" class="sc-notoserifcjksc">得的结果，为三次独立尝试的平均值。表现反映的是</text><text x="281.37" y="378.88" font-size="9.00" class="sc-loraregular">49</text><text x="293.81" y="378.88" font-size="9.00" class="sc-notoserifcjksc">个形式化定理证明中被</text><text x="386.18 391.38 396.24 400.89" y="378.88" font-size="9.00" class="sc-loraregular">Lean</text><text x="408.72" y="378.88" font-size="9.00" class="sc-notoserifcjksc">环境成功验证的加权比例（</text><text x="516.72" y="378.88" font-size="9.00" class="sc-loraregular">0–1</text><text x="72.00" y="390.58" font-size="9.00" class="sc-notoserifcjksc">范围）。</text><text x="72.00" y="432.73" font-size="11.00" class="sc-notoserifcjksc">当我们观察</text><text x="129.89 135.56" y="432.73" font-size="11.00" class="sc-loraregular">24</text><text x="144.41" y="432.73" font-size="11.00" class="sc-notoserifcjksc">小时窗口内部的情况时，</text><text x="265.41" y="432.73" font-size="11.00" class="sc-loraregular">10</text><text x="279.14" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个、</text><text x="301.14" y="432.73" font-size="11.00" class="sc-loraregular">30</text><text x="316.99" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个和</text><text x="341.89" y="432.73" font-size="11.00" class="sc-loraregular">100</text><text x="362.44" y="432.73" font-size="11.00" class="sc-notoserifcjksc">个智能体之间的差异变得更加明显。</text><text x="72.00" y="448.36" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="448.36" font-size="11.00" class="sc-loraregular">8.12.3.C</text><text x="126.81" y="448.36" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="151.71" y="448.36" font-size="11.00" class="sc-loraregular">8.12.3.D</text><text x="193.13" y="448.36" font-size="11.00" class="sc-notoserifcjksc">展示了</text><text x="229.02" y="448.36" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="276.47" y="448.36" font-size="11.00" class="sc-notoserifcjksc">在不同团队规模下、于两小时、六小时和</text><text x="477.36 483.03" y="448.36" font-size="11.00" class="sc-loraregular">24</text><text x="491.88" y="448.36" font-size="11.00" class="sc-notoserifcjksc">小时时间</text><text x="72.00" y="463.98" font-size="11.00" class="sc-notoserifcjksc">点在这两个任务上的表现。更大的团队会早得多地达到给定的表现水平，因此即使</text><text x="470.89 476.56" y="463.98" font-size="11.00" class="sc-loraregular">24</text><text x="485.41" y="463.98" font-size="11.00" class="sc-notoserifcjksc">小时得分相</text><text x="72.00" y="479.60" font-size="11.00" class="sc-notoserifcjksc">近，扩大团队规模也能大幅缩短完成任务所需的时间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p196.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 196 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">196</text><text x="72.00" y="366.99" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="366.99" font-size="9.00" class="sc-lorabold">8.12.3.C]</text><text x="123.80" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">知识库：两小时、六小时和</text><text x="234.17" y="366.99" font-size="9.00" class="sc-lorabold">24</text><text x="246.26" y="366.99" font-size="9.00" class="sc-notoserifcjkscbold">小时内的得分。</text><text x="309.26" y="366.99" font-size="9.00" class="sc-notoserifcjksc">每个点表示该规模的</text><text x="392.62 398.92 401.36 405.95 411.33 416.71 421.59 423.95 431.10 436.47 441.85 446.01 448.38 453.28 455.50" y="366.99" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="462.77" y="366.99" font-size="9.00" class="sc-notoserifcjksc">团队截至该时间点</text><text x="72.00" y="378.69" font-size="9.00" class="sc-notoserifcjksc">所达到的最佳得分，为三次独立的</text><text x="209.37 214.00" y="378.69" font-size="9.00" class="sc-loraregular">24</text><text x="221.25" y="378.69" font-size="9.00" class="sc-notoserifcjksc">小时运行的平均值。得分为读者仅使用团队笔记正确回答的留出问题比例。注意</text><text x="72.00" y="390.39" font-size="9.00" class="sc-loraregular">y</text><text x="79.12" y="390.39" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="99.49 104.93 107.15" y="390.39" font-size="9.00" class="sc-loraregular">0.3</text><text x="114.53" y="390.39" font-size="9.00" class="sc-notoserifcjksc">开始，因此差异在视觉上被放大。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p197.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 197 页"><text x="504.00 507.28 512.26" y="751.80" font-size="9.00" class="sc-loraregular">197</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.67 111.77 118.15 121.63 123.99 129.43 134.27 138.99" y="367.92" font-size="9.00" class="sc-lorabold">8.12.3.D] Lean</text><text x="147.10" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">定理证明：两小时、六小时和</text><text x="266.46" y="367.92" font-size="9.00" class="sc-lorabold">24</text><text x="278.55" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">小时内的得分。</text><text x="341.55" y="367.92" font-size="9.00" class="sc-notoserifcjksc">每个点表示该规模的</text><text x="424.92 431.21 433.66 438.25 443.62 449.00 453.88 456.25 463.39 468.76 474.14 478.30 480.67 485.58 487.79" y="367.92" font-size="9.00" class="sc-loraregular">Claude Opus 5.5</text><text x="495.06" y="367.92" font-size="9.00" class="sc-notoserifcjksc">团队截至该</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">时间点所达到的最佳得分，为三次独立的</text><text x="236.37 241.00" y="379.62" font-size="9.00" class="sc-loraregular">24</text><text x="248.25" y="379.62" font-size="9.00" class="sc-notoserifcjksc">小时运行的平均值。得分为</text><text x="358.61" y="379.62" font-size="9.00" class="sc-loraregular">49</text><text x="371.06" y="379.62" font-size="9.00" class="sc-notoserifcjksc">个定理陈述中其证明经</text><text x="463.43 468.63 473.49 478.13" y="379.62" font-size="9.00" class="sc-loraregular">Lean</text><text x="485.96" y="379.62" font-size="9.00" class="sc-notoserifcjksc">内核验证的加</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">权占比（</text><text x="108.00" y="391.33" font-size="9.00" class="sc-loraregular">0–1</text><text x="122.18" y="391.33" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="420.23" font-size="11.00" class="sc-notoserifcjksc">我们使用固定团队运行框架（见第</text><text x="239.89" y="420.23" font-size="11.00" class="sc-loraregular">8.12.4</text><text x="270.25" y="420.23" font-size="11.00" class="sc-notoserifcjksc">节）：一个主智能体和</text><text x="383.15 391.53 397.07" y="420.23" font-size="11.00" class="sc-loraregular">N−1</text><text x="403.97" y="420.23" font-size="11.00" class="sc-notoserifcjksc">个辅助智能体同时启动，均</text><text x="72.00" y="435.86" font-size="11.00" class="sc-notoserifcjksc">获得完整任务，在一台无网络访问的共享</text><text x="272.89" y="435.86" font-size="11.00" class="sc-loraregular">Linux</text><text x="304.31" y="435.86" font-size="11.00" class="sc-notoserifcjksc">机器上并发工作，最长</text><text x="417.20 422.87" y="435.86" font-size="11.00" class="sc-loraregular">24</text><text x="431.72" y="435.86" font-size="11.00" class="sc-notoserifcjksc">小时。每个智能体拥</text><text x="72.00" y="451.48" font-size="11.00" class="sc-notoserifcjksc">有一个</text><text x="107.89" y="451.48" font-size="11.00" class="sc-loraregular">shell</text><text x="131.52" y="451.48" font-size="11.00" class="sc-notoserifcjksc">、一个文件编辑器和两个消息工具（</text><text x="307.52 313.76 319.72 326.40 332.98 335.87 345.89 351.85 356.94 362.04 367.71 373.74" y="451.48" font-size="11.00" class="sc-loraregular">Send Message</text><text x="382.60" y="451.48" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="396.49 407.01 412.68 415.95 420.21 423.10 426.76 433.20 437.96 440.85 450.87 456.84 461.93 467.02 472.70 478.73" y="451.48" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="484.69" y="451.48" font-size="11.00" class="sc-notoserifcjksc">）。任何智</text><text x="72.00" y="467.10" font-size="11.00" class="sc-notoserifcjksc">能体都可以直接向其他任何智能体发送消息。团队的工作保存在一个共享的</text><text x="437.89 446.26 449.53" y="467.10" font-size="11.00" class="sc-loraregular">Git</text><text x="456.68" y="467.10" font-size="11.00" class="sc-notoserifcjksc">仓库中，该仓库</text><text x="72.00" y="482.71" font-size="11.00" class="sc-notoserifcjksc">用于为任务表现评分。模型被指示使用终端命令查看时间并据此做好计划。</text><text x="72.00" y="549.77" font-size="11.00" class="sc-notoserifcjksc">在本节最后，我们介绍一个有趣的定性观察：两个任务上涌现出了不同的组织结构。阅读</text><text x="503.89" y="549.77" font-size="11.00" class="sc-loraregular">100</text><text x="524.45" y="549.77" font-size="11.00" class="sc-notoserifcjksc">智</text><text x="72.00" y="565.39" font-size="11.00" class="sc-notoserifcjksc">能体团队的对话记录后，我们发现</text><text x="239.89 246.25 252.19 257.87" y="565.39" font-size="11.00" class="sc-loraregular">Lean</text><text x="267.44" y="565.39" font-size="11.00" class="sc-notoserifcjksc">团队将自身组织为两个层级：主智能体任命了十二个子</text><text x="72.00" y="581.01" font-size="11.00" class="sc-notoserifcjksc">主智能体并与它们保持联系，而每个子主智能体向自己的一组辅助智能体分派工作并向上汇报。</text><text x="72.00" y="596.63" font-size="11.00" class="sc-notoserifcjksc">相比之下，知识库团队保持扁平结构：主智能体在任务开始时将记录分配给各辅助智能体，此后</text><text x="72.00" y="612.25" font-size="11.00" class="sc-notoserifcjksc">每个辅助智能体负责知识库中属于自己的部分，并且在运行的剩余时间里，辅助智能体之间的相</text><text x="72.00" y="627.87" font-size="11.00" class="sc-notoserifcjksc">互沟通相对较少。</text><text x="160.00" y="627.87" font-size="11.00" class="sc-loraregular">[</text><text x="163.95" y="627.87" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="177.84" y="627.87" font-size="11.00" class="sc-loraregular">8.12.3.E]</text><text x="221.86" y="627.87" font-size="11.00" class="sc-notoserifcjksc">展示了这两种结构。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">198</text><text x="72.00" y="281.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="281.68" font-size="9.00" class="sc-lorabold">8.12.3.E]</text><text x="123.23" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">两个</text><text x="143.60" y="281.68" font-size="9.00" class="sc-lorabold">100</text><text x="161.06" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">智能体</text><text x="190.43" y="281.68" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="261.09" y="281.68" font-size="9.00" class="sc-notoserifcjkscbold">团队中涌现的团队结构。</text><text x="360.09" y="281.68" font-size="9.00" class="sc-notoserifcjksc">运行框架为每个</text><text x="425.46" y="281.68" font-size="9.00" class="sc-loraregular">100</text><text x="442.28" y="281.68" font-size="9.00" class="sc-notoserifcjksc">智能体团队指定了一个主</text><text x="72.00" y="293.38" font-size="9.00" class="sc-notoserifcjksc">智能体，但各团队的团队结构和消息习惯由智能体自行决定。子主智能体是指成为至少三个其他辅助智能体的主要消息</text><text x="72.00" y="305.08" font-size="9.00" class="sc-notoserifcjksc">发送者的辅助智能体；每个辅助智能体都显示为</text><text x="261.00" y="305.08" font-size="9.00" class="sc-loraregular">“</text><text x="264.60" y="305.08" font-size="9.00" class="sc-notoserifcjksc">汇报给</text><text x="291.60" y="305.08" font-size="9.00" class="sc-loraregular">”</text><text x="294.74" y="305.08" font-size="9.00" class="sc-notoserifcjksc">向它发送消息最多的主智能体或子主智能体。在</text><text x="486.11 491.31 496.17 500.81" y="305.08" font-size="9.00" class="sc-loraregular">Lean</text><text x="508.64" y="305.08" font-size="9.00" class="sc-notoserifcjksc">任务</text><text x="72.00" y="316.78" font-size="9.00" class="sc-notoserifcjksc">中，涌现出了</text><text x="128.37" y="316.78" font-size="9.00" class="sc-loraregular">12</text><text x="138.84" y="316.78" font-size="9.00" class="sc-notoserifcjksc">个子主智能体；在知识库任务中，辅助智能体大多直接与主智能体交流，没有子主智能体。</text><text x="72.00" y="378.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.4</text><text x="110.97" y="378.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="406.16" font-size="11.00" class="sc-notoserifcjkscbold">固定团队</text><text x="116.00" y="406.16" font-size="11.00" class="sc-notoserifcjksc">。由对等智能体组成的固定团队并发处理任务。所有智能体拥有相同的工具，且都能看</text><text x="72.00" y="421.78" font-size="11.00" class="sc-notoserifcjksc">到完整的任务描述。根据任务不同，可以指定一个智能体作为主智能体：在</text><text x="437.89 445.98 453.43 460.26 467.95" y="421.78" font-size="11.00" class="sc-loraregular">DRACO</text><text x="479.57" y="421.78" font-size="11.00" class="sc-notoserifcjksc">上，运行在</text><text x="72.00" y="437.40" font-size="11.00" class="sc-notoserifcjksc">主智能体完成时结束，并对当时的报告进行评分。在</text><text x="327.89 334.56 339.24 345.68 351.76 356.45 362.12 371.89 378.74 384.70 391.37 397.23" y="437.40" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="406.71" y="437.40" font-size="11.00" class="sc-notoserifcjksc">上，没有主智能体：各智能</text><text x="72.00" y="453.02" font-size="11.00" class="sc-notoserifcjksc">体彼此对等，收到相同的提示词，共享代码仓库的主分支被用于评分，且运行在每个智能体都完</text><text x="72.00" y="468.64" font-size="11.00" class="sc-notoserifcjksc">成后结束。在这两项评估中，如何分工都交由智能体自行决定。除任务工具外，每个智能体还有</text><text x="72.00" y="484.26" font-size="11.00" class="sc-notoserifcjksc">两个消息工具：</text><text x="149.00 155.24 161.20 167.88 174.45 177.35 187.37 193.33 198.42 203.52 209.19 215.22" y="484.26" font-size="11.00" class="sc-loraregular">Send Message</text><text x="221.18" y="484.26" font-size="11.00" class="sc-notoserifcjksc">，用于向一个或多个队友发送消息（插入到接收方的下一个工具结</text><text x="72.00" y="499.88" font-size="11.00" class="sc-notoserifcjksc">果之后）；</text><text x="127.00 137.52 143.19 146.46 150.72 153.61 157.27 163.71 168.47 171.36 181.38 187.35 192.44 197.53 203.21 209.24" y="499.88" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="215.20" y="499.88" font-size="11.00" class="sc-notoserifcjksc">，在收到传入消息之前阻塞采样。在</text><text x="394.09 400.76 405.44 411.88 417.96 422.65 428.32 438.09 444.93 450.90 457.57 463.42" y="499.88" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="472.91" y="499.88" font-size="11.00" class="sc-notoserifcjksc">上，每个智能</text><text x="72.00" y="515.50" font-size="11.00" class="sc-notoserifcjksc">体在自己的任务代码仓库检出副本中工作，并可通过</text><text x="327.89 336.26 339.53" y="515.50" font-size="11.00" class="sc-loraregular">Git</text><text x="346.68" y="515.50" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。</text><text x="467.68 475.77 483.21 490.04 497.73" y="515.50" font-size="11.00" class="sc-loraregular">DRACO</text><text x="509.36" y="515.50" font-size="11.00" class="sc-notoserifcjksc">没有</text><text x="72.00" y="531.12" font-size="11.00" class="sc-notoserifcjksc">代码仓库：其智能体共享一个容器的文件系统。该运行框架旨在模拟多个智能体在共享任务上协</text><text x="72.00" y="546.74" font-size="11.00" class="sc-notoserifcjksc">作的真实场景，并通过让对等智能体并行工作来降低延迟。</text><text x="72.00" y="632.84" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc">。该运行框架以一个主智能体初始化，主智能体可以随意派生异步、长期存在的子</text><text x="72.00" y="648.46" font-size="11.00" class="sc-notoserifcjksc">智能体，同时保留对任务工具的直接访问。派生工具会立即返回确认，而不是等待子智能体执</text><text x="72.00" y="664.08" font-size="11.00" class="sc-notoserifcjksc">行。每个子智能体只能看到主智能体提供的指令，看不到原始任务描述。子智能体可以向主智能</text><text x="72.00" y="679.70" font-size="11.00" class="sc-notoserifcjksc">体以及任何仍在工作的其他子智能体发送消息。子智能体的最终回复会作为一条消息传递给主智</text><text x="72.00" y="695.32" font-size="11.00" class="sc-notoserifcjksc">能体，此后该</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p199.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 199 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 116.80 125.23 134.04 139.03 143.87 152.16 160.97 165.96 174.77 183.58 192.02" y="523.56" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 Chartography</text><text x="72.00 75.13" y="700.23" font-size="6.00" class="sc-loraregular">23</text><text x="81.10 86.71 92.68 96.96 102.43 107.85 110.48 116.74 120.09 122.72 125.77 131.13 137.27 142.64 148.30 151.35 153.80 156.43 163.42 169.41 174.57 178.96 182.83 188.68 194.21 198.47 203.62 209.59 215.51 220.79 223.29 225.92 232.17 234.80 240.62 246.04 252.11 257.42 263.41 272.35 277.51 281.79 287.16 289.79 293.12 298.97 303.30 305.92 311.89 316.15 321.95 325.28 330.69 335.32 339.95 342.76 348.61 354.67 359.83 362.55 365.18 370.50 376.49 381.64 386.04 389.91 392.54 398.51 404.58 410.55 415.97 420.30 424.93 428.80 433.95 440.02 446.00 448.81 454.88 460.40 462.86 465.49 471.10 477.07 481.34 486.82 492.24 494.87 501.13 504.48" y="704.45" font-size="10.00" class="sc-loraregular">Surge AI (2026). Chartography: A benchmark for professional chart understanding. Surge AI.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 109.01 113.64 119.61 123.89 129.37 134.78 140.77 146.53 148.99 154.15 156.75 163.64 169.46 172.18 178.03 183.55 189.95 195.27 201.26 206.42 210.81 214.68 220.53 226.06 230.32 235.47 241.44 247.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://surgehq.ai/blog/chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">199</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">子智能体进入空闲状态，直到主智能体用新指令将其唤醒。子智能体可以使用任务工具和</text><text x="503.89" y="82.61" font-size="11.00" class="sc-loraregular">Send</text><text x="72.00 82.02 87.98 93.08 98.17 103.85 109.87" y="98.23" font-size="11.00" class="sc-loraregular">Message</text><text x="115.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；主智能体还可以使用</text><text x="228.73 239.24 244.92 248.19 252.44 255.34 259.00 265.44 270.20 273.09 283.11 289.07 294.17 299.26 304.94 310.96" y="98.23" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="316.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，以及用于创建子智能体、终止子智能体和查</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">看子智能体状态（工作中、空闲、排队中或已终止）的工具。可派生的子智能体数量没有上限。</text><text x="72.00" y="161.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.12.5</text><text x="110.75" y="161.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="189.80" font-size="11.00" class="sc-notoserifcjksc">我们重点比较单智能体与多智能体运行框架，包括得分、延迟和</text><text x="382.89 387.15 393.58 399.42 405.38" y="189.80" font-size="11.00" class="sc-loraregular">token</text><text x="414.95" y="189.80" font-size="11.00" class="sc-notoserifcjksc">用量。具体而言，</text><text x="502.95 507.20 513.64 519.47 525.43" y="189.80" font-size="11.00" class="sc-loraregular">token</text><text x="72.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">用量的统计方式与</text><text x="162.89 167.15 173.58 179.41 185.38" y="205.42" font-size="11.00" class="sc-loraregular">token</text><text x="194.95" y="205.42" font-size="11.00" class="sc-notoserifcjksc">上限的执行方式相同：进入智能体上下文窗口的每个</text><text x="450.84 455.10 461.53 467.36 473.32" y="205.42" font-size="11.00" class="sc-loraregular">token</text><text x="480.00" y="205.42" font-size="11.00" class="sc-notoserifcjksc">，无论是输</text><text x="72.00" y="221.04" font-size="11.00" class="sc-notoserifcjksc">入还是输出，都按每个窗口计一次，而不是按每次模型请求计一次，并对一个任务上所有智能体</text><text x="72.00" y="236.66" font-size="11.00" class="sc-notoserifcjksc">的计数求和。延迟以推导出的每任务延迟报告，而不是原始的实际耗时。我们将智能体的输入和</text><text x="72.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">输出</text><text x="96.89 101.15 107.58 113.42 119.38" y="252.28" font-size="11.00" class="sc-loraregular">token</text><text x="128.95" y="252.28" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充（</text><text x="313.00" y="252.28" font-size="11.00" class="sc-notoserifcjksc">）速率和解码速率，再加上其实测的工具执行</text><text x="72.00" y="267.90" font-size="11.00" class="sc-notoserifcjksc">时间，以此计算每条智能体轨迹的延迟。我们通过在交接时传递时钟来计入智能体的空闲时间：</text><text x="72.00" y="283.52" font-size="11.00" class="sc-notoserifcjksc">被派生的智能体从其派生者的时钟开始计时；收到消息或结果的智能体，如果发送者在发送时的</text><text x="72.00" y="299.14" font-size="11.00" class="sc-notoserifcjksc">时钟晚于自己的时钟，则将自己的时钟前移至该时钟。我们将</text><text x="371.89 378.56 383.24 389.68 395.76 400.45 406.12 415.89 422.74 428.70 435.37 441.23" y="299.14" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="450.71" y="299.14" font-size="11.00" class="sc-notoserifcjksc">上最长的智能体轨</text><text x="72.00" y="314.76" font-size="11.00" class="sc-notoserifcjksc">迹（每个评分点上所有智能体中最大的时钟）以及</text><text x="316.89 324.98 332.43 339.26 346.95" y="314.76" font-size="11.00" class="sc-loraregular">DRACO</text><text x="358.57" y="314.76" font-size="11.00" class="sc-notoserifcjksc">上主智能体的最终时钟（主智能体的</text><text x="72.00" y="330.38" font-size="11.00" class="sc-notoserifcjksc">回答即结束任务）报告为运行框架的端到端延迟。使用推导延迟可以将运行框架本身的延迟（例</text><text x="72.00" y="346.00" font-size="11.00" class="sc-notoserifcjksc">如，它需要多少串行的模型工作和工具时间）与服务端波动（例如批处理、排队、硬件）隔离开</text><text x="72.00" y="361.62" font-size="11.00" class="sc-notoserifcjksc">来，从而在不同时间以相同的模型速度比较各运行框架。工具执行时间按实测值报告，因此仍反</text><text x="72.00" y="377.24" font-size="11.00" class="sc-notoserifcjksc">映运行当时的条件。</text><text x="72.00" y="482.65" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="482.65" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 86.28 91.95 96.79 101.05 107.49 113.57 118.26 123.93 130.50 137.01" y="547.42" font-size="11.00" class="sc-loraregular">Chartography</text><text x="142.82 146.26" y="543.75" font-size="6.60" class="sc-loraregular">23</text><text x="152.83" y="547.42" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="166.73 172.90 179.46 184.17 190.20 196.16 199.05 205.94" y="547.42" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="212.52" y="547.42" font-size="11.00" class="sc-notoserifcjksc">推出的一个图表理解基准测试，包含</text><text x="391.41" y="547.42" font-size="11.00" class="sc-loraregular">100</text><text x="411.97" y="547.42" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测</text><text x="72.00" y="563.04" font-size="11.00" class="sc-notoserifcjksc">试中很少评估的专业图表类型。其中包括</text><text x="272.89 280.41 286.08 292.65 295.64 301.32 307.99 314.48 324.51 330.47 333.56 339.52" y="563.04" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="347.18" y="563.04" font-size="11.00" class="sc-notoserifcjksc">曲线图、</text><text x="391.18" y="563.04" font-size="11.00" class="sc-loraregular">K</text><text x="401.58" y="563.04" font-size="11.00" class="sc-notoserifcjksc">线图、等值线图、风玫瑰</text><text x="72.00" y="578.66" font-size="11.00" class="sc-notoserifcjksc">图、桑基图、伯德图和三维曲面图。由于不同类型的图表能够被读取的精度不同，每个答案都对</text><text x="72.00" y="594.28" font-size="11.00" class="sc-notoserifcjksc">照专家为该特定图表设定的可接受范围进行评分，而不是采用单一的固定容差。</text><text x="72.00" y="660.98" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，模型均配置为启用自适应思考和</text><text x="305.89" y="660.98" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.59" y="660.98" font-size="11.00" class="sc-notoserifcjksc">推理强度。模型分别在有工具和无工具的条</text><text x="72.00" y="676.60" font-size="11.00" class="sc-notoserifcjksc">件下接受评估。在有工具的条件下评估时，模型会获得一个</text><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="506.93" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="72.00" y="707.20" width="180.64" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p200.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 200 页"><text x="72.00 75.09" y="700.23" font-size="6.00" class="sc-loraregular">24</text><text x="80.97 86.58 92.55 96.82 102.30 107.72 110.35 116.61 119.96 122.58 125.63 131.00 137.14 142.51 148.16 151.21 153.67 156.30 163.29 169.28 174.43 178.83 182.70 188.55 194.08 198.33 203.49 209.46 215.38 220.66 223.28 226.51 233.50 239.35 245.33 250.74 253.37 257.63 263.05 269.02 274.86 279.49 282.46 286.33 292.18 296.68 301.55 305.14 307.60 310.23 317.84 320.81 324.67 332.28 338.25 344.07" y="704.45" font-size="10.00" class="sc-loraregular">Surge AI (2026). Chartography [Code repository]. GitHub.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.92 114.69 117.66 121.53 127.52 133.48 139.30 141.76 147.03 152.88 161.62 168.12 172.75 178.72 182.99 188.47 193.89 198.78 203.94 206.54 212.93 218.25 224.24 229.40 233.79 237.66 243.51 249.04 253.30 258.45 264.42 270.34" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://github.com/surge-ai/chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">200</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们内部的</text><text x="426.89 434.58 441.17 446.85 451.69 455.94 462.38 468.46 473.15 478.82 485.39 491.90" y="82.61" font-size="11.00" class="sc-loraregular">Chartography</text><text x="500.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">评分实</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">现与官方代码仓库中的任务及专家确定的可接受答案范围一致。</text><text x="380.00 383.40" y="94.56" font-size="6.60" class="sc-loraregular">24</text><text x="389.87" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为确保各模型之间的评分可</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">比，我 9 290.55 293.09 299.92" y="275.19" font-size="11.00" class="sc-loraregular">0.01</text><text x="306.82" y="275.19" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="331.71 335.15 341.37" y="275.19" font-size="11.00" class="sc-loraregular">IoU</text><text x="349.64" y="275.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="360.64 366.14 372.52 378.30 384.26 387.25 390.14 393.59 399.80" y="275.19" font-size="11.00" class="sc-loraregular">voxel IoU</text><text x="408.07" y="275.19" font-size="11.00" class="sc-notoserifcjksc">）的误差范围内反映完整集</text><text x="72.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">合上的得分。我们报告五次运行平均的体素</text><text x="283.89 287.34 293.55" y="290.81" font-size="11.00" class="sc-loraregular">IoU</text><text x="304.72" y="290.81" font-size="11.00" class="sc-notoserifcjksc">得分。</text><text x="72.00" y="342.22" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.74 98.70 105.37 111.23 117.68 125.26 132.15 140.34 143.24 150.25 153.35 158.44 161.53 167.96 174.64 180.55 188.24 194.67 201.25" y="342.22" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="210.11" y="342.22" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="342.22" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="342.22" font-size="11.00" class="sc-notoserifcjksc">文件子集上，</text><text x="320.01 327.70 330.69 336.30 342.86 349.44 355.40 358.30 367.03 373.60 380.16 385.26 388.15 394.15 396.85" y="342.22" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="405.74" y="342.22" font-size="11.00" class="sc-notoserifcjksc">在无工具时取得</text><text x="485.63 492.29 494.64 499.71 505.84" y="342.22" font-size="11.00" class="sc-loraregular">0.730</text><text x="515.56" y="342.22" font-size="11.00" class="sc-notoserifcjksc">的体</text><text x="72.00" y="357.84" font-size="11.00" class="sc-notoserifcjksc">素</text><text x="85.89 89.34 95.55" y="357.84" font-size="11.00" class="sc-loraregular">IoU</text><text x="106.72" y="357.84" font-size="11.00" class="sc-notoserifcjksc">得分，在有工具时取得</text><text x="219.61 226.26 228.97 235.33 241.69" y="357.84" font-size="11.00" class="sc-loraregular">0.962</text><text x="247.59" y="357.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="258.59 266.28 269.27 274.88 281.45 288.03 293.99 296.88 302.47 308.15 314.55 317.54 323.50 326.40 332.39 335.10" y="357.84" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="341.99" y="357.84" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="388.89 395.54 398.14 404.50 411.33" y="357.84" font-size="11.00" class="sc-loraregular">0.606</text><text x="420.58" y="357.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="434.47 441.13 443.83 450.19 456.10" y="357.84" font-size="11.00" class="sc-loraregular">0.926</text><text x="462.46" y="357.84" font-size="11.00" class="sc-notoserifcjksc">（此前在低分辨</text><text x="72.00" y="373.46" font-size="11.00" class="sc-notoserifcjksc">率下评估时报告的得分为</text><text x="195.89 202.55 205.25 211.22 217.08" y="373.46" font-size="11.00" class="sc-loraregular">0.437</text><text x="225.04" y="373.46" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="238.94 245.59 248.30 254.48 260.44" y="373.46" font-size="11.00" class="sc-loraregular">0.843</text><text x="266.57" y="373.46" font-size="11.00" class="sc-notoserifcjksc">），而</text><text x="302.46 310.15 313.14 318.75 325.32 331.90 337.86 340.75 349.49 356.05 362.62 367.71 370.61" y="373.46" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="379.49" y="373.46" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="426.39 433.04 435.75 441.71 447.80" y="373.46" font-size="11.00" class="sc-loraregular">0.497</text><text x="455.77" y="373.46" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="469.66 476.32 479.02 485.13 491.49" y="373.46" font-size="11.00" class="sc-lo  font-size="9.00" class="sc-loraregular">OpenAI</text><text x="105.88" y="418.14" font-size="9.00" class="sc-notoserifcjksc">公开报告的数据。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="447.48" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="447.48" font-size="11.00" class="sc-notoserifcjksc">在该评估上的表现随测试时计算的增加而显著提升，尤其是在模型配备了能够对中间输出</text><text x="72.00" y="463.11" font-size="11.00" class="sc-notoserifcjksc">进行视觉验证的工具时。事实上，在提供工具的情况下，</text><text x="347.00 354.69 357.68 363.29 369.86 376.44 382.40 385.29 394.02 400.59 407.16 412.25 415.14 421.14 423.85" y="463.11" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="432.73" y="463.11" font-size="11.00" class="sc-notoserifcjksc">在该基准测试上几乎</text><text x="72.00" y="478.73" font-size="11.00" class="sc-notoserifcjksc">取得了满分的体素</text><text x="162.89 166.34 172.55" y="478.73" font-size="11.00" class="sc-loraregular">IoU</text><text x="183.72" y="478.73" font-size="11.00" class="sc-notoserifcjksc">得分。</text></svg></div>

9.00" class="sc-loraregular">205</text><text x="72.00" y="422.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.67 111.77 117.31 120.78 123.15 129.10 133.94 139.68 144.34 149.81 155.94 161.96 168.79 171.15 177.29 180.23 184.60 187.54 192.64 198.38 203.18 209.37 214.46 219.82" y="422.49" font-size="9.00" class="sc-lorabold">8.13.2.B] BenchCAD Vision2Code</text><text x="227.03" y="422.49" font-size="9.00" class="sc-notoserifcjkscbold">子集得分（有工具）。</text><text x="317.03" y="422.49" font-size="9.00" class="sc-notoserifcjksc">模型在自适应思考下以不同的推理强度档位进行评估。</text><text x="72.00" y="434.19" font-size="9.00" class="sc-notoserifcjksc">我们使用</text><text x="110.37 115.25 118.38 121.37 126.64 130.60" y="434.19" font-size="9.00" class="sc-loraregular">effort</text><text x="136.45" y="434.19" font-size="9.00" class="sc-notoserifcjksc">参数来调整所投入的测试时计算量。得分为每个推理强度档位下五次运行的平均值。图中显示</text><text x="507.82" y="434.19" font-size="9.00" class="sc-loraregular">95%</text><text x="528.12" y="434.19" font-size="9.00" class="sc-notoserifcjksc">置</text><text x="72.00" y="445.89" font-size="9.00" class="sc-notoserifcjksc">信区间。</text><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63 118.21 121.10 127.01 129.55" y="507.02" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="136.38" y="503.35" font-size="6.60" class="sc-loraregular">27</text><text x="145.86" y="507.02" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="203.76" y="507.02" font-size="11.00" class="sc-loraregular">108</text><text x="223.67" y="507.02" font-size="11.00" class="sc-notoserifcjksc">个长程计算机使用（</text><text x="322.67 328.46 334.90 344.73 351.30 357.87 362.12 368.08 372.85 375.74 382.31 387.40" y="507.02" font-size="11.00" class="sc-loraregular">computer use</text><text x="393.36" y="507.02" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，其中智能</text><text x="72.00" y="522.64" font-size="11.00" class="sc-notoserifcjksc">体通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="338.89 347.17 353.57 360.13 366.71 370.97" y="522.64" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="380.43" y="522.64" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每个任务依据一组加权</text><text x="72.00" y="538.26" font-size="11.00" class="sc-notoserifcjksc">检查点进行评分。我们报告两项指标：部分得分（各任务按检查点所获分数的平均值）和严格通</text><text x="72.00" y="553.88" font-size="11.00" class="sc-notoserifcjksc">过率（所有检查点均满足的任务所占比例），二者均为五次独立运行平均的</text><text x="437.89" y="553.88" font-size="11.00" class="sc-loraregular">pass@1</text><text x="473.08" y="553.88" font-size="11.00" class="sc-notoserifcjksc">。我们采用该</text><text x="72.00" y="569.49" font-size="11.00" class="sc-notoserifcjksc">基准测试的默认设置，即</text><text x="195.89" y="569.49" font-size="11.00" class="sc-loraregular">1080p</text><text x="229.20" y="569.49" font-size="11.00" class="sc-notoserifcjksc">分辨率、每个任务最多</text><text x="342.09" y="569.49" font-size="11.00" class="sc-loraregular">500</text><text x="364.64" y="569.49" font-size="11.00" class="sc-notoserifcjksc">个操作步骤，并使用最高推理强度。</text><text x="72.00" y="585.11" font-size="11.00" class="sc-notoserifcjksc">对于需要评分模型的任务，我们使用</text><text x="250.89 258.58 261.57 267.18 273.75 280.33 286.29 289.18 297.92 304.49 311.05 316.15 319.04 325.00 327.71" y="585.11" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="333.89" y="585.11" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="652.95" font-size="11.00" class="sc-notoserifcjksc">自</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 129.77 135.45 141.85 144.84 150.80 153.70 159.69 162.40" y="652.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="169.29" y="652.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="183.19 190.88 193.87 199.48 206.05 212.62 218.59 221.48 231.41 237.28 241.53 248.12 254.56 259.65 262.54 268.54 271.24" y="652.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5.1</text><text x="278.14" y="652.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="311.14" y="652.95" font-size="11.00" class="sc-notoserifcjksc">发布以来，我们从两方面更新了这项评估。第</text><text x="72.00" y="668.57" font-size="11.00" class="sc-notoserifcjksc">一，我们将该</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="234.91" y="707.20" width="158.07" height="12.80" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="644.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="644.15" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="644.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="644.15" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="150.80" y="644.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="153.70" y="644.15" width="12.71" height="11.00" fill="transparent"/> <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p206.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 206 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">206</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">基准测试的任务文件、任务资源及配套</text><text x="261.89 272.41 278.37" y="82.61" font-size="11.00" class="sc-loraregular">Web</text><text x="287.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">应用更新到</text><text x="345.56 351.47 358.22 364.13" y="82.61" font-size="11.00" class="sc-loraregular">2026</text><text x="373.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="387.27" y="82.61" font-size="11.00" class="sc-loraregular">9</text><text x="396.52" y="82.61" font-size="11.00" class="sc-notoserifcjksc">月</text><text x="410.42" y="82.61" font-size="11.00" class="sc-loraregular">10</text><text x="424.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">日的版本。第二，我们</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">改变了智能体运行框架管理上下文的方式：智能体不再在截图累积到固定数量后丢弃较早的截</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">图，而是保留每一张截图，并使用</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 285.07 291.68" y="113.85" font-size="11.00" class="sc-loraregular">Claude API</text><text x="298.26" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的服务端上下文管理功能，该功能会在对话超过</text><text x="72.00 76.00 82.83 89.67 95.57 98.47 102.72 109.16 114.99 120.95" y="129.47" font-size="11.00" class="sc-loraregular">100k token</text><text x="130.52" y="129.47" font-size="11.00" class="sc-notoserifcjksc">时对其进行压缩。本节中的所有模型均在相同的更新后配置下进行评估。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="195.95" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="195.95" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="193.63" y="195.95" font-size="11.00" class="sc-loraregular">81.8%</text><text x="225.16" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的部分得分和</text><text x="294.06 300.02 306.20 308.55 313.63" y="195.95" font-size="11.00" class="sc-loraregular">48.7%</text><text x="326.09" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的严格通过率。在相同条件下重新评估时，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="211.57" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="155.40" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="224.30 230.48 237.13 239.49 244.56" y="211.57" font-size="11.00" class="sc-loraregular">80.7%</text><text x="254.13" y="211.57" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="334.02" y="211.57" font-size="11.00" class="sc-loraregular">42.8%</text><text x="364.35" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="375.35 383.04 386.03 391.64 398.20 404.78 410.74 413.64 422.37 428.94 435.51 440.60 443.49" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="452.38" y="211.57" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="72.00 76.92 82.88 85.42 92.25" y="227.19" font-size="11.00" class="sc-loraregular">74.0%</text><text x="101.82" y="227.19" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="181.71 187.58 192.16 194.87 200.78" y="227.19" font-size="11.00" class="sc-loraregular">37.2%</text><text x="210.35" y="227.19" font-size="11.00" class="sc-notoserifcjksc">。由于任务文件和运行框架配置均有所不同，这些结果取代</text><text x="499.24 506.93 509.92 515.53 522.10 528.68" y="227.19" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="242.81" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="131.00 138.69 141.68 147.30 153.86 160.44 166.40 169.30 179.23 185.09 189.35 195.94 202.37 207.47 210.36 216.35 219.06" y="242.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="225.96" y="242.81" font-size="11.00" class="sc-notoserifcjksc">系统卡中的</text><text x="283.85 292.58 298.82 309.34 315.77 320.49 323.48 330.06 332.95 338.86 341.40" y="242.81" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="351.12" y="242.81" font-size="11.00" class="sc-notoserifcjksc">数据，且不能与在该基准测试早期版本</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">上报告的结果或以其他运行框架配置获得的结果直接比较。</text><text x="72.00" y="602.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.92 112.01 117.55" y="602.96" font-size="9.00" class="sc-lorabold">8.13.3.A]</text><text x="123.39" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">各模型的</text><text x="161.76 168.68 173.99 182.52 187.61 191.85 194.66 200.02 202.39 207.19 209.15" y="602.96" font-size="9.00" class="sc-lorabold">OSWorld 2.0</text><text x="217.24" y="602.96" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="244.24" y="602.96" font-size="9.00" class="sc-notoserifcjksc">柱形显示</text><text x="282.61" y="602.96" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="301.18" y="602.96" font-size="9.00" class="sc-notoserifcjksc">推理强度下的部分得分和严格通过率，以及基于五次运行的</text><text x="72.00" y="614.66" font-size="9.00" class="sc-loraregular">95%</text><text x="92.30" y="614.66" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p207.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 207 页"><text x="504.00 508.83 514.22" y="751.80" font-size="9.00" class="sc-loraregular">207</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 109.92 112.01 117.55 121.02 123.39 129.58 132.39 137.11 142.67 148.03 152.87 155.24 162.16 167.57 173.13 177.50 179.86 184.72 186.82" y="413.53" font-size="9.00" class="sc-lorabold">8.13.3.B] Claude Opus 5.5</text><text x="191.68" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="200.68" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="264.38" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="275.75 281.94 284.75 289.47 295.03 300.39 305.24 307.60 312.37 317.09 322.21 325.02 329.86 332.23 337.09 339.18" y="413.53" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="345.20" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="356.57 363.49 368.80 377.33 382.43 386.67 389.48 394.84 397.21 402.00 403.97" y="413.53" font-size="9.00" class="sc-lorabold">OSWorld 2.0</text><text x="412.06" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与性能对比。</text><text x="502.06" y="413.53" font-size="9.00" class="sc-notoserifcjksc">每个点代</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="308.37 314.00 319.41" y="425.23" font-size="9.00" class="sc-loraregular">API</text><text x="324.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">标价（含输入、输出和提示缓存）计算的平均每任务成</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">本。得分为</text><text x="119.37 126.51 131.62 140.22 145.49 149.35 151.79 157.18 159.54 164.38 166.45" y="436.93" font-size="9.00" class="sc-loraregular">OSWorld 2.0</text><text x="174.41" y="436.93" font-size="9.00" class="sc-notoserifcjksc">评分者给出的部分得分，取五次运行的平均值。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p208.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 208 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.63 121.94 126.26 129.69 137.49 145.51 155.73" y="527.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 OfficeQA</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">208</text><text x="72.00" y="413.53" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="413.53" font-size="9.00" class="sc-lorabold">8.13.3.C] Claude Opus 5.5</text><text x="192.34" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">、</text><text x="201.34" y="413.53" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="265.04" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="276.41 282.60 285.41 290.12 295.69 301.05 305.89 308.26 313.03 317.74 322.87 325.67 330.52 332.88 337.74 339.84" y="413.53" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="345.86" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="357.23 364.15 369.46 377.99 383.08 387.32 390.13 395.50 397.86 402.66 404.62" y="413.53" font-size="9.00" class="sc-lorabold">OSWorld 2.0</text><text x="412.71" y="413.53" font-size="9.00" class="sc-notoserifcjkscbold">上的价格与严格通过率对比。</text><text x="529.71" y="413.53" font-size="9.00" class="sc-notoserifcjksc">每</text><text x="72.00" y="425.23" font-size="9.00" class="sc-notoserifcjksc">个点代表一种推理强度设置（各模型的档位不同），其位置对应按</text><text x="335.37 341.00 346.41" y="425.23" font-size="9.00" class="sc-loraregular">API</text><text x="351.79" y="425.23" font-size="9.00" class="sc-notoserifcjksc">标价（含输入、输出和提示缓存）计算的平均每</text><text x="72.00" y="436.93" font-size="9.00" class="sc-notoserifcjksc">任务成本。严格通过率仅在所有检查点均满足时才将任务计为通过，取五次运行的平均值。</text><text x="72.00" y="486.67" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="486.67" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="551.66" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46 143.60 149.20 153.46 159.13 165.53 170.30 173.39 179.24 185.15" y="551.66" font-size="11.00" class="sc-loraregular">Databricks</text><text x="193.13" y="551.66" font-size="11.00" class="sc-notoserifcjksc">推出的一个公开基准测试，用于评估在大量历史美国《财政部公报》文</text><text x="72.00" y="567.28" font-size="11.00" class="sc-notoserifcjksc">档语料上的端到端有据推理能力。模型必须在整个语料中定位相关表格，并基于这些表格进行精</text><text x="72.00" y="582.90" font-size="11.00" class="sc-notoserifcjksc">确的数值推理。我们以智能体方式进行评估：文档以提取后的文本形式提供于沙箱化的环境中，</text><text x="72.00" y="598.52" font-size="11.00" class="sc-notoserifcjksc">并可使用代码执行工具；</text><text x="263.25" y="598.52" font-size="11.00" class="sc-notoserifcjksc">是推荐用于前沿模型的、难度更高的</text><text x="442.14" y="598.52" font-size="11.00" class="sc-loraregular">133</text><text x="461.29" y="598.52" font-size="11.00" class="sc-notoserifcjksc">题子集。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="665.00" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="665.00" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="221.19" y="665.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="257.09" y="665.00" font-size="11.00" class="sc-loraregular">78.9%</text><text x="286.97" y="665.00" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="382.11" y="665.00" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="418.01 424.29 428.87 431.23 436.30" y="665.00" font-size="11.00" class="sc-loraregular">67.7%</text><text x="445.87" y="665.00" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="456.87" y="665.00" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="479.56" y="665.00" font-size="11.00" class="sc-notoserifcjksc">推理强度，</text><text x="72.00" y="680.62" font-size="11.00" class="sc-notoserifcjksc">五次运行的平均值）。这略高于</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 275.92 282.49 289.05 294.15 297.04" y="680.62" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="303.03" y="680.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="314.03" y="680.62" font-size="11.00" class="sc-loraregular">78.1%</text><text x="344.46" y="680.62" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.35" y="680.62" font-size="11.00" class="sc-loraregular">66.9%</text><text x="389.70" y="680.62" font-size="11.00" class="sc-notoserifcjksc">），但低于</text><text x="447.60 455.28 458.28 463.89 470.45 477.03 482.99 485.89 491.47 497.15 503.55 506.54" y="680.62" font-size="11.00" class="sc-loraregular">Claude Fable</text><text x="72.00" y="696.24" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="696.24" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="95.71 101.89 108.54 111.25 117.16" y="696.24" font-size="11.00" class="sc-loraregular">80.2%</text><text x="129.62" y="696.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="143.51 149.87 156.05 158.59 165.42" y="696.24" font-size="11.00" class="sc-loraregular">69.0%</text><text x="174.99" y="696.24" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p209.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 209 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.01 110.39 116.16 124.18 132.99 141.80 145.23 148.61 157.67 166.48 174.50 182.93 187.77 191.15 199.33 207.35 215.79 223.59 232.02 245.52 254.33 259.32" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.2 Legal Agent Benchmark</text><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.23 110.61 120.66 129.87 137.60 145.09 153.90 157.33 164.93 173.99" y="453.75" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.3 GDPval-AA</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">28</text><text x="81.22 87.21 92.30 96.34 104.24 109.40 113.66 119.64 125.63 130.78 136.85 139.38 142.01 147.92 150.38 152.90 155.53 160.88 164.75 167.38 172.54 175.26 177.71 180.34 183.39 188.76 194.90 200.27 205.71 208.76 211.22 213.85 221.46 228.80 235.15 240.10 245.26 247.98 250.48 253.10 259.23 264.18 269.34 272.06 278.02 283.11 286.98 289.79 295.86 301.39 304.01 310.27 313.62 316.25 325.19 331.03 337.01 342.43 345.15 347.78 353.74 359.16 363.49 366.82 372.67 377.00 385.93 391.09 397.16 402.43 407.84 410.47 416.32 422.39 425.02 429.28 434.67 439.83 442.55 447.36 455.24 461.09 465.38 468.10 474.08 476.71 482.07 487.34 493.19 499.26 505.11 514.04 516.85 522.15 527.31 530.03 532.69" y="704.45" font-size="10.00" class="sc-loraregular">Patwardhan, T., et al. (2025). GDPval: Evaluating AI model performance on real-world economically</text><text x="72.00 76.95 82.11 84.82 90.79 95.95 101.77 104.49 109.91 112.53 116.40 121.56 126.19 131.56 136.18 138.64 141.27 146.43 150.14 156.63 159.44 164.48 166.98 172.35 177.80 181.44 187.48 189.79 196.00 201.42 206.75 211.21 216.63" y="717.26" font-size="10.00" class="sc-loraregular">valuable tasks. arXiv:2510.04374.</text><text x="221.72 227.62 231.59 235.45 241.42 246.05 248.55 252.24 258.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">209</text><text x="72.00 78.36 84.32 90.40 96.08 99.07 101.96 108.85 114.88 120.84 127.42 131.68 134.57 141.41 147.37 154.05 159.90 166.49 176.32 182.00 186.72" y="111.05" font-size="11.00" class="sc-loraregular">Legal Agent Benchmark</text><text x="192.63" y="111.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63 210.17 217.06" y="111.05" font-size="11.00" class="sc-loraregular">LAB</text><text x="223.90" y="111.05" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="259.79 268.28 273.96 278.80 284.30 290.21 296.02 298.91 305.79" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">Harvey AI</text><text x="312.37" y="111.05" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。该基准测试包含</text><text x="502.27 508.17 510.78 517.61 521.61" y="111.05" font-size="11.00" class="sc-loraregular">2,010</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">多个任务，覆盖</text><text x="151.89" y="126.67" font-size="11.00" class="sc-loraregular">27</text><text x="165.76" y="126.67" font-size="11.00" class="sc-notoserifcjksc">个不同的执业领域。每个任务包含一个封闭文档集，其中包括电子邮件往来、</text><text x="72.00" y="142.29" font-size="11.00" class="sc-notoserifcjksc">律所模板、程序性文件以及其他客户事务材料，智能体必须对这些材料进行筛查才能完成任务。</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">任务指令以合伙人向授薪律师提出的简短</text><text x="270.00" y="157.91" font-size="11.00" class="sc-loraregular">“</text><text x="274.40" y="157.91" font-size="11.00" class="sc-notoserifcjksc">工作请求</text><text x="318.40" y="157.91" font-size="11.00" class="sc-loraregular">”</text><text x="322.24" y="157.91" font-size="11.00" class="sc-notoserifcjksc">的形式撰写。任务指令还规定了预期的输出</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">文档及其格式。评估采用通过</text><text x="215.00" y="173.53" font-size="11.00" class="sc-loraregular">/</text><text x="222.59" y="173.53" font-size="11.00" class="sc-notoserifcjksc">不通过的方式，使用</text><text x="324.48" y="173.53" font-size="11.00" class="sc-loraregular">LLM</text><text x="350.19" y="173.53" font-size="11.00" class="sc-notoserifcjksc">评判模型，依据一套由专家撰写的评分</text><text x="72.00" y="189.15" font-size="11.00" class="sc-notoserifcjksc">细则标准进行（每个被评估任务的标准数量：最少</text><text x="316.89 322.64" y="189.15" font-size="11.00" class="sc-loraregular">23</text><text x="331.65" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条，中位数</text><text x="389.55" y="189.15" font-size="11.00" class="sc-loraregular">56</text><text x="404.79" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条，最多</text><text x="451.69" y="189.15" font-size="11.00" class="sc-loraregular">194</text><text x="470.90" y="189.15" font-size="11.00" class="sc-notoserifcjksc">条）。标准的</text><text x="72.00 78.54 85.43" y="204.77" font-size="11.00" class="sc-loraregular">LAB</text><text x="95.17" y="204.77" font-size="11.00" class="sc-notoserifcjksc">报告仅在所有标准均满足时才将该任务视为成功。</text><text x="72.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">除公开任务外，</text><text x="149.00 157.49 163.17 168.01 173.51 179.42" y="272.95" font-size="11.00" class="sc-loraregular">Harvey</text><text x="188.12" y="272.95" font-size="11.00" class="sc-notoserifcjksc">还维护着一个包含</text><text x="279.01" y="272.95" font-size="11.00" class="sc-loraregular">120</text><text x="298.64" y="272.95" font-size="11.00" class="sc-notoserifcjksc">道题目、未公开发布的留出集。</text><text x="452.64 461.14 466.81 471.65 477.15 483.06 488.87 491.76 498.31 505.19" y="272.95" font-size="11.00" class="sc-loraregular">Harvey LAB</text><text x="514.93" y="272.95" font-size="11.00" class="sc-notoserifcjksc">在该</text><text x="72.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">留出集上的结果由</text><text x="253.48" y="288.57" font-size="11.00" class="sc-notoserifcjksc">独立报告，所用运行框架由</text><text x="478.96" y="288.57" font-size="11.00" class="sc-notoserifcjksc">团队维护</text><text x="72.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">其方法论详见此处</text><text x="171.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="353.91" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="353.91" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.63" y="353.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="194.32" y="353.91" font-size="11.00" class="sc-notoserifcjksc">推理强度下于留出集上取得</text><text x="329.22" y="353.91" font-size="11.00" class="sc-loraregular">8.3%</text><text x="356.69" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的全通过率和</text><text x="425.59" y="353.91" font-size="11.00" class="sc-loraregular">91.2%</text><text x="457.03" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的平均评分项通</text><text x="72.00" y="369.53" font-size="11.00" class="sc-notoserifcjksc">过率。与我们上一份系统卡一致，早期模型的得分采用</text><text x="429.48" y="369.53" font-size="11.00" class="sc-notoserifcjksc">测得的数据，而非</text><text x="72.00 80.49 86.17 91.01 96.51 102.42" y="385.15" font-size="11.00" class="sc-loraregular">Harvey</text><text x="111.12" y="385.15" font-size="11.00" class="sc-notoserifcjksc">报告的数据，以便所有模型都在同一运行框架上进行比较。因此，这些得分可能与该变更</text><text x="72.00" y="400.77" font-size="11.00" class="sc-notoserifcjksc">之前发布的系统卡中的得分略有不同。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66 143.57 146.27" y="477.83" font-size="11.00" class="sc-loraregular">GDPval-AA v2.1</text><text x="153.17" y="477.83" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="257.65" y="477.83" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立的评估框架，用于在具有经济价值的真</text><text x="72.00" y="493.45" font-size="11.00" class="sc-notoserifcjksc">实世界专业任务上测试</text><text x="184.89" y="493.45" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36" y="493.45" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="311.25" y="493.45" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="352.65 361.02 369.11 376.10 381.54 387.22" y="493.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="393.10" y="493.45" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="448.10" y="489.78" font-size="6.60" class="sc-loraregular">28</text><text x="455.35" y="493.45" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="480.25" y="493.45" font-size="11.00" class="sc-loraregular">220</text><text x="501.79" y="493.45" font-size="11.00" class="sc-notoserifcjksc">个任</text><text x="72.00" y="509.07" font-size="11.00" class="sc-notoserifcjksc">务，涵盖九大主要行业的</text><text x="195.89" y="509.07" font-size="11.00" class="sc-loraregular">44</text><text x="210.71" y="509.07" font-size="11.00" class="sc-notoserifcjksc">种职业。任务模拟实际的专业工作成果，包括文档、幻灯片、图表和</text><text x="72.00" y="524.69" font-size="11.00" class="sc-notoserifcjksc">电子表格。模型在智能体循环中获得</text><text x="250.89" y="524.69" font-size="11.00" class="sc-loraregular">shell</text><text x="277.41" y="524.69" font-size="11.00" class="sc-notoserifcjksc">访问和网页浏览能力以完成任务；性能以</text><text x="478.31" y="524.69" font-size="11.00" class="sc-loraregular">Elo</text><text x="497.47" y="524.69" font-size="11.00" class="sc-notoserifcjksc">评分衡</text><text x="72.00" y="540.31" font-size="11.00" class="sc-notoserifcjksc">量，该评分由对模型输出进行的盲测成对比较得出，并以</text><text x="349.89 358.09 364.00 369.96 376.46 382.70 388.60 394.56 400.47 403.36 410.27 416.23 418.94 422.94 425.84 431.87 434.86 440.53 445.63" y="540.31" font-size="11.00" class="sc-loraregular">DeepSeek V4.1 Flash</text><text x="452.21" y="540.31" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="463.21" y="540.31" font-size="11.00" class="sc-loraregular">max</text><text x="484.55" y="540.31" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="509.45 513.45 516.11 522.47 529.30" y="540.31" font-size="11.00" class="sc-loraregular">1,600</text><text x="72.00" y="555.93" font-size="11.00" class="sc-notoserifcjksc">分为锚点。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="623.56" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="623.56" font-size="11.00" class="sc-notoserifcjksc">占据排行榜前两名：</text><text x="256.73" y="623.56" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="279.43" y="623.56" font-size="11.00" class="sc-notoserifcjksc">推理强度下</text><text x="337.32" y="623.56" font-size="11.00" class="sc-loraregular">Elo</text><text x="356.49" y="623.56" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="370.38" y="623.56" font-size="11.00" class="sc-loraregular">1846</text><text x="392.88" y="623.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="403.88" y="623.56" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="439.78" y="623.56" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="72.00" y="639.18" font-size="11.00" class="sc-loraregular">1820</text><text x="94.92" y="639.18" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="141.82" y="639.18" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="164.51" y="639.18" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="189.41 197.10 200.09 205.70 212.26 218.84 224.80 227.70 233.29 238.96 245.36 248.36 254.32 257.21 263.21 265.91" y="639.18" font-size="11.00" class="sc-loraregular">Claude Fabl
