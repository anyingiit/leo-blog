ze="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 99.84 105.37" y="599.50" font-size="9.00" class="sc-lorabold">8.1.A]</text><text x="111.21" y="599.50" font-size="9.00" class="sc-notoserifcjkscbold">能力评估总览。</text><text x="174.21" y="599.50" font-size="9.00" class="sc-notoserifcjksc">除非另有说明，所有</text><text x="257.58" y="599.50" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="327.73" y="599.50" font-size="9.00" class="sc-notoserifcjksc">结果均采用以下标准配置：</text><text x="435.73" y="599.50" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="454.30" y="599.50" font-size="9.00" class="sc-notoserifcjksc">推理强度（</text><text x="499.30" y="599.50" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="523.01" y="599.50" font-size="9.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="611.20" font-size="9.00" class="sc-notoserifcjksc">下的自适应思考（</text><text x="144.00" y="611.20" font-size="9.00" class="sc-loraregular sc-k">adaptive thinking</text><text x="216.47" y="611.20" font-size="9.00" class="sc-notoserifcjksc">）、默认采样设置（</text><text x="297.47" y="611.20" font-size="9.00" class="sc-loraregular sc-k">temperature</text><text x="350.11" y="611.20" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="359.11" y="611.20" font-size="9.00" class="sc-loraregular">top_p</text><text x="385.16" y="611.20" font-size="9.00" class="sc-notoserifcjksc">），并取五次试验的平均值。</text><text x="72.00 77.32 82.20 86.09 94.14 96.67 102.13 106.78 109.22 113.63 119.22 124.10 129.56 134.35 139.74 142.11 146.99 149.07" y="622.90" font-size="9.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="157.02" y="622.90" font-size="9.00" class="sc-notoserifcjksc">得分在</text><text x="186.39" y="622.90" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="215.76" y="622.90" font-size="9.00" class="sc-notoserifcjksc">推理强度下报告。上下文窗口大小因评估而异，且不超过</text><text x="443.13" y="622.90" font-size="9.00" class="sc-loraregular sc-k">1M token</text><text x="480.89" y="622.90" font-size="9.00" class="sc-notoserifcjksc">。每行的最佳</text><text x="72.00" y="634.60" font-size="9.00" class="sc-notoserifcjksc">得分以</text><text x="99.00" y="634.60" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="117.00" y="634.60" font-size="9.00" class="sc-notoserifcjksc">标出。竞争对手的数据取自各开发者公开发布的系统卡或基准测试排行榜。早期</text><text x="434.37" y="634.60" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="465.70" y="634.60" font-size="9.00" class="sc-notoserifcjksc">模型的评估细节请</text><text x="72.00" y="646.30" font-size="9.00" class="sc-notoserifcjksc">参见</text><text x="92.37" y="646.30" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="155.39" y="646.30" font-size="9.00" class="sc-notoserifcjksc">系统卡（</text><text x="191.39" y="646.30" font-size="9.00" class="sc-loraregular sc-k">System Card</text><text x="244.30" y="646.30" font-size="9.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p175.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 175 页"><text x="72.00 80.93 84.30 92.61 96.25 106.17 114.80 123.44 132.92 141.37 155.35 162.68 166.32 174.38 179.28 182.65" y="277.98" font-size="14.00" class="sc-poppinsmedium">8.3 DeepSWE v1.1</text><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="386.90" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">175</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.2 SWE-bench Pro</text><text x="205.98" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="219.98" y="84.20" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="307.54" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="324.87" y="84.20" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00" y="110.77" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="135.56" y="110.77" font-size="11.00" class="sc-notoserifcjksc">在真实世界的软件工程任务上测试</text><text x="303.45" y="110.77" font-size="11.00" class="sc-loraregular">AI</text><text x="316.92" y="110.77" font-size="11.00" class="sc-notoserifcjksc">模型。我们报告三个变体，每个得分均为五次</text><text x="72.00" y="126.39" font-size="11.00" class="sc-notoserifcjksc">试验的平均值：</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 179.25 184.44" y="159.11" font-size="11.00" class="sc-lorabold">SWE-bench Pro</text><text x="190.67" y="155.44" font-size="6.60" class="sc-loraregular">16</text><text x="199.78" y="159.11" font-size="11.00" class="sc-notoserifcjksc">由取自持续维护的代码仓库、涉及大规模多文件</text><text x="433.67" y="159.11" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="453.78" y="159.11" font-size="11.00" class="sc-notoserifcjksc">的问题组成。</text><text x="108.00" y="174.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.73" y="174.73" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="229.63" y="174.73" font-size="11.00" class="sc-loraregular sc-k">89.9%</text><text x="263.44" y="174.73" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 182.66 189.46 192.84 197.39 200.98 204.42 208.01 215.03 221.16 227.96 233.72" y="191.72" font-size="11.00" class="sc-lorabold">SWE-bench Multilingual</text><text x="240.04" y="191.72" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖九种编程语言的</text><text x="418.94" y="191.72" font-size="11.00" class="sc-loraregular">300</text><text x="441.62" y="191.72" font-size="11.00" class="sc-notoserifcjksc">个问题。</text><text x="485.62" y="191.72" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="108.00" y="207.34" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="143.89" y="207.34" font-size="11.00" class="sc-loraregular">93.9%</text><text x="177.90" y="207.34" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00 114.49 125.67 132.38 137.56 143.86 149.78 156.80 162.49 169.33 172.22 182.66 189.46 192.84 197.39 200.98 211.10 217.33 223.89 229.65" y="223.89" font-size="11.00" class="sc-lorabold">SWE-bench Multimodal</text><text x="233.08" y="220.22" font-size="6.60" class="sc-loraregular">17</text><text x="241.42" y="223.89" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="255.31" y="223.89" font-size="11.00" class="sc-loraregular">issue</text><text x="284.01" y="223.89" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图和设计稿）。</text><text x="504.01" y="223.89" font-size="11.00" class="sc-loraregular">Opus</text><text x="108.00" y="239.51" font-size="11.00" class="sc-loraregular">5.5</text><text x="125.59" y="239.51" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="161.48" y="239.51" font-size="11.00" class="sc-loraregular">61.4%</text><text x="192.98" y="239.51" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="72.00" y="300.64" font-size="11.00" class="sc-loraregular sc-k">DeepSWE</text><text x="125.48" y="300.64" font-size="11.00" class="sc-notoserifcjksc">是一组包含</text><text x="183.38" y="300.64" font-size="11.00" class="sc-loraregular">113</text><text x="200.40" y="300.64" font-size="11.00" class="sc-notoserifcjksc">个长程软件工程任务的集合，旨在衡量前沿编程智能体的能力。这些</text><text x="72.00" y="316.26" font-size="11.00" class="sc-notoserifcjksc">任务多样、反映真实世界的复杂性，并且为避免基准污染而从零编写。</text><text x="413.00" y="316.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="498.73" y="316.26" font-size="11.00" class="sc-notoserifcjksc">在五次</text><text x="72.00" y="331.88" font-size="11.00" class="sc-notoserifcjksc">试验中的平均得分为</text><text x="173.89" y="331.88" font-size="11.00" class="sc-loraregular sc-k">74.2%</text><text x="202.96" y="331.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="409.55" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="143.25" y="409.55" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14" y="409.55" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="221.64" y="409.55" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54" y="409.55" font-size="11.00" class="sc-loraregular">150</text><text x="409.26" y="409.55" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源自</text><text x="72.00" y="425.17" font-size="11.00" class="sc-notoserifcjksc">开源代码仓库中的真实拉取请求（</text><text x="237.00" y="425.17" font-size="11.00" class="sc-loraregular sc-k">pull request</text><text x="297.82" y="425.17" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="366.71" y="425.17" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="415.81" y="425.17" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="440.71" y="425.17" font-size="11.00" class="sc-loraregular sc-k">websocket bug</text><text x="517.05" y="425.17" font-size="11.00" class="sc-notoserifcjksc">、加</text><text x="72.00" y="440.79" font-size="11.00" class="sc-notoserifcjksc">固</text><text x="85.89" y="440.79" font-size="11.00" class="sc-loraregular">Prisma</text><text x="123.91" y="440.79" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包产物，或扩展</text><text x="258.80" y="440.79" font-size="11.00" class="sc-loraregular sc-k">JSON schema lint</text><text x="350.76" y="440.79" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务向智能体提供一个已检</text><text x="72.00" y="456.41" font-size="11.00" class="sc-notoserifcjksc">出的代码仓库、一份</text><text x="173.89" y="456.41" font-size="11.00" class="sc-loraregular">issue</text><text x="202.59" y="456.41" font-size="11.00" class="sc-notoserifcjksc">描述，以及该仓库的测试、</text><text x="334.59" y="456.41" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="354.40" y="456.41" font-size="11.00" class="sc-notoserifcjksc">和代码风格规范；随后智能体在可访问</text><text x="72.00" y="472.03" font-size="11.00" class="sc-notoserifcjksc">互联网的容器化环境中自主工作，产出最终补丁，全程无人工干预，也不提供任何超时信息。补</text><text x="72.00" y="487.65" font-size="11.00" class="sc-notoserifcjksc">丁依据阻断性功能标准（主要是留出的单元测试，外加范围和性能方面的阻断项）以及加权的评</text><text x="72.00" y="503.27" font-size="11.00" class="sc-notoserifcjksc">分细则标准进行评分，其中包括由模型评分的检查项，用于检查所需的测试覆盖范围和被禁止的</text><text x="72.00" y="518.89" font-size="11.00" class="sc-notoserifcjksc">实现模式。任务由底层代码仓库的维护者编写，并由</text><text x="327.89" y="518.89" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="381.40" y="518.89" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审查，其中随机抽</text><text x="72.00" y="534.51" font-size="11.00" class="sc-notoserifcjksc">取的一部分经人工求解以验证公平性。我们以</text><text x="294.89" y="534.51" font-size="11.00" class="sc-loraregular sc-k">mean@5</text><text x="340.66" y="534.51" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="365.56" y="534.51" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="436.80" y="534.51" font-size="11.00" class="sc-notoserifcjksc">的总体得分；这是一</text><text x="72.00" y="550.13" font-size="11.00" class="sc-notoserifcjksc">个综合指标，依据阻断性功能标准（留出的单元测试）以及加权的代码质量评分细则标准对每个</text><text x="72.00" y="565.75" font-size="11.00" class="sc-notoserifcjksc">补丁进行评分。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">16</text><text x="80.28 87.73 93.15 99.22 104.75 107.27 109.90 116.39 118.85 121.37 124.00 129.35 133.22 135.85 141.01 143.73 146.19 148.82 151.87 157.24 163.38 168.75 174.20 177.25 179.71 182.34 188.01 197.96 203.98 208.87 215.09 220.51 226.58 231.90 237.89 240.52 246.58 250.84 256.69 259.19 261.82 268.81 273.97 280.04 282.67 288.93 292.28 294.91 300.07 305.55 310.97 316.95 320.82 325.45 328.08 332.71 338.56 341.24 346.24 351.66 354.29 357.01 362.86 368.93 374.46 379.35 385.34 391.19 395.52 398.33 403.36 409.21 415.28 417.91 422.54 428.34 431.84 435.88 443.79 448.95 453.21 458.63 461.26 466.68 472.75 478.52 481.33 487.40 492.77 498.19 502.52 505.33 511.40" y="678.20" font-size="10.00" class="sc-loraregular">Deng, X., et al. (2025). SWE-Bench Pro: Can AI agents solve long-horizon software engineering</text><text x="183.21 189.11 193.08 196.95 202.92 207.55 210.05 213.74 220.64 225.80 230.13 235.43 238.24 242.90 245.36 251.21 255.49 261.02 267.92 273.08 278.90 283.18 290.08 295.45 300.90 307.11 312.73 315.19 318.83 324.61 330.39 335.81" y="692.40" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2509.16941</text><text x="72.00" y="703.26" font-size="6.00" class="sc-loraregular">17</text><text x="79.58 85.43 90.59 96.66 102.19 104.71 107.34 110.86 113.32 115.84 118.47 123.82 127.69 130.32 135.48 138.20 140.66 143.29 146.34 151.71 157.85 163.00 168.30 171.35 173.81 176.44 182.11 192.06 198.08 202.97 209.19 214.6 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="72.00 80.93 84.30 93.28 96.92 104.81 113.44 118.82 133.36 137.05 146.13 155.62 159.31 167.50 176.31 184.94 194.03 202.42 211.50 219.69 228.14 236.53 240.23 248.86 257.94 266.34 274.97 278.61 287.58 290.95" y="413.87" font-size="14.00" class="sc-poppinsmedium">8.6 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">以及容器通信协议）的混杂作用，最终使</text><text x="272.89 279.39 285.36 290.12 299.95 303.04 309.72 315.40 318.39 323.77 330.61 336.57 343.25 349.10" y="82.61" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="358.58" y="82.61" font-size="11.00" class="sc-notoserifcjksc">成为一项更稳定、更严谨的评估。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下在</text><text x="314.63 321.13 327.09 331.85 341.69 344.78 351.46 357.13 360.12 365.50 372.34 378.31 384.98 390.84 397.42 400.32 406.28 408.82" y="131.19" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="418.54" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="454.44" y="131.19" font-size="11.00" class="sc-loraregular">66.36%</text><text x="491.91" y="131.19" font-size="11.00" class="sc-notoserifcjksc">；被安全</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">防护措施标记的请求由回退（</text><text x="215.00" y="146.81" font-size="11.00" class="sc-loraregular">fallback</text><text x="254.21" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）模型按照默认的服务端回退策略作答（占请求的</text><text x="499.11" y="146.81" font-size="11.00" class="sc-loraregular">2.5%</text><text x="523.29" y="146.81" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">影响了</text><text x="107.89" y="162.43" font-size="11.00" class="sc-loraregular">10%</text><text x="131.19" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的试验）。作为对比，</text><text x="241.19" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="336.14" y="162.43" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="361.04" y="162.43" font-size="11.00" class="sc-loraregular sc-k">60.9%</text><text x="392.68" y="162.43" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="403.68" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="487.09" y="162.43" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00" y="178.05" font-size="11.00" class="sc-loraregular">55.8%</text><text x="102.45" y="178.05" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="127.34" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="204.37" y="178.05" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="229.27" y="178.05" font-size="11.00" class="sc-loraregular">52.3%</text><text x="259.57" y="178.05" font-size="11.00" class="sc-notoserifcjksc">。得分取平均值的方式为：</text><text x="391.57" y="178.05" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="439.02" y="178.05" font-size="11.00" class="sc-notoserifcjksc">每个任务五次试验</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（共</text><text x="96.89" y="193.67" font-size="11.00" class="sc-loraregular">330</text><text x="118.87" y="193.67" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="173.87" y="193.67" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="268.82" y="193.67" font-size="11.00" class="sc-notoserifcjksc">每个任务</text><text x="315.72" y="193.67" font-size="11.00" class="sc-loraregular">10</text><text x="329.44" y="193.67" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="387.34" y="193.67" font-size="11.00" class="sc-loraregular">660</text><text x="409.78" y="193.67" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="464.78" y="193.67" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="503.52" y="193.67" font-size="11.00" class="sc-notoserifcjksc">每个任</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">务</text><text x="85.89" y="209.29" font-size="11.00" class="sc-loraregular">15</text><text x="98.78" y="209.29" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="156.68" y="209.29" font-size="11.00" class="sc-loraregular">990</text><text x="179.12" y="209.29" font-size="11.00" class="sc-notoserifcjksc">次试验）。将各次试验视为相互独立时，</text><text x="377.12" y="209.29" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="424.56" y="209.29" font-size="11.00" class="sc-notoserifcjksc">的标准误为</text><text x="482.45" y="209.29" font-size="11.00" class="sc-loraregular sc-k">±2.6</text><text x="506.04" y="209.29" font-size="11.00" class="sc-notoserifcjksc">个百分</text><text x="72.00" y="224.91" font-size="11.00" class="sc-notoserifcjksc">点，其他模型为</text><text x="151.89" y="224.91" font-size="11.00" class="sc-loraregular sc-k">±1.6-2</text><text x="184.51" y="224.91" font-size="11.00" class="sc-notoserifcjksc">个百分点。报告的数据对</text><text x="308.40" y="224.91" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="355.84" y="224.91" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="380.74" y="224.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">--bare</text><text x="423.24" y="224.91" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="470.13" y="224.91" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="72.00" y="240.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="240.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="121.79" y="240.53" font-size="11.00" class="sc-notoserifcjksc">推理强度（</text><text x="176.79" y="240.53" font-size="11.00" class="sc-loraregular sc-k">thinking effort</text><text x="251.04" y="240.53" font-size="11.00" class="sc-notoserifcjksc">）（</text><text x="273.04" y="240.53" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="320.48" y="240.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="334.38" y="240.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="357.07" y="240.53" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="436.97" y="240.53" font-size="11.00" class="sc-loraitalic">64.8</text><text x="457.61" y="240.53" font-size="11.00" class="sc-loraregular">%</text><text x="467.18" y="240.53" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="492.08" y="240.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="527.97" y="240.53" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="256.15" font-size="11.00" class="sc-notoserifcjksc">比在噪声范围内），对比较模型则使用</text><text x="261.89" y="256.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="284.59" y="256.15" font-size="11.00" class="sc-notoserifcjksc">推理强度。</text><text x="72.00" y="310.36" font-size="11.00" class="sc-notoserifcjksc">作为参考，公开排行榜报告</text><text x="206.89" y="310.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="283.93" y="310.36" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="330.82" y="310.36" font-size="11.00" class="sc-loraregular">51.8%</text><text x="359.28" y="310.36" font-size="11.00" class="sc-notoserifcjksc">（五次试验，使用</text><text x="450.17" y="310.36" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="518.02" y="310.36" font-size="11.00" class="sc-notoserifcjksc">运行</text><text x="72.00" y="325.98" font-size="11.00" class="sc-notoserifcjksc">框架），与我们内部设置的结果相差在噪声范围内。</text><text x="325.00" y="325.98" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="366.40" y="325.98" font-size="11.00" class="sc-notoserifcjksc">报告其</text><text x="402.30" y="325.98" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="467.79" y="325.98" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="481.68" y="325.98" font-size="11.00" class="sc-loraregular sc-k">Terminal-</text><text x="72.00" y="341.60" font-size="11.00" class="sc-loraregular sc-k">Bench 4.0</text><text x="125.04" y="341.60" font-size="11.00" class="sc-notoserifcjksc">最终得分为</text><text x="182.93" y="341.60" font-size="11.00" class="sc-loraregular sc-k">57.9%</text><text x="212.15" y="341.60" font-size="11.00" class="sc-notoserifcjksc">，该得分在</text><text x="270.04" y="341.60" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="299.34" y="341.60" font-size="11.00" class="sc-notoserifcjksc">推理强度下取得（在其报告中，</text><text x="453.34" y="341.60" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="476.04" y="341.60" font-size="11.00" class="sc-notoserifcjksc">推理强度的</text><text x="72.00" y="357.22" font-size="11.00" class="sc-notoserifcjksc">表现略低于</text><text x="129.89" y="357.22" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="152.51" y="357.22" font-size="11.00" class="sc-notoserifcjksc">，因此我们选取了其最高数值）。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 160.18 166.41 172.26 175.36 181.32 187.99 193.79" y="444.53" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="202.65" y="444.53" font-size="11.00" class="sc-notoserifcjksc">是由斯坦福大学牵头的社区基准测试，包含</text><text x="414.54" y="444.53" font-size="11.00" class="sc-loraregular">70</text><text x="429.34" y="444.53" font-size="11.00" class="sc-notoserifcjksc">个取自科学研究工作流</text><text x="72.00" y="460.15" font-size="11.00" class="sc-notoserifcjksc">程的任务，由生命科学、物理科学、地球科学、数学科学和工程科学领域的科学家和研究人员编</text><text x="72.00" y="475.77" font-size="11.00" class="sc-notoserifcjksc">写并审查。该项目的科学顾问来自麻省理工学院（</text><text x="314.00" y="475.77" font-size="11.00" class="sc-loraregular">MIT</text><text x="334.82" y="475.77" font-size="11.00" class="sc-notoserifcjksc">）、普林斯顿大学、华盛顿大学、</text><text x="72.00" y="491.39" font-size="11.00" class="sc-loraregular sc-k">Genentech</text><text x="131.05" y="491.39" font-size="11.00" class="sc-notoserifcjksc">和斯坦福大学。</text><text x="72.00" y="521.30" font-size="11.00" class="sc-notoserifcjksc">任务被设置为典型的智能体问题：一个智能体</text><text x="294.89" y="521.30" font-size="11.00" class="sc-loraregular">CLI</text><text x="315.52" y="521.30" font-size="11.00" class="sc-notoserifcjksc">在独立封闭的环境中依据自然语言指令开展工</text><text x="72.00" y="536.92" font-size="11.00" class="sc-notoserifcjksc">作，并根据隐藏的、针对具体任务的测试对其产出物进行评分。</text><text x="72.00" y="586.06" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="586.06" font-size="11.00" class="sc-notoserifcjksc">在启用安全防护措施的情况下在</text><text x="314.63 321.13 327.09 331.85 341.69 344.78 351.46 357.13 360.12 365.50 372.34 378.31 384.98 390.84 397.42 402.80 409.04 414.89 417.98 423.95 430.62 436.42" y="586.06" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="445.27" y="586.06" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="481.17" y="586.06" font-size="11.00" class="sc-loraregular sc-k">58.7%</text><text x="510.34" y="586.06" font-size="11.00" class="sc-notoserifcjksc">；被</text><text x="72.00" y="601.68" font-size="11.00" class="sc-notoserifcjksc">安全防护措施标记的请求由回退模型按照默认的服务端回退策略作答（占请求的</text><text x="459.89" y="601.68" font-size="11.00" class="sc-loraregular">3.9%</text><text x="484.65" y="601.68" font-size="11.00" class="sc-notoserifcjksc">，影响了</text><text x="72.00" y="617.30" font-size="11.00" class="sc-loraregular">5%</text><text x="90.46" y="617.30" font-size="11.00" class="sc-notoserifcjksc">的试验）。该得分为每个任务</text><text x="236.35" y="617.30" font-size="11.00" class="sc-loraregular">10</text><text x="250.08" y="617.30" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="307.97" y="617.30" font-size="11.00" class="sc-loraregular">700</text><text x="329.60" y="617.30" font-size="11.00" class="sc-notoserifcjksc">次试验）的平均值。</text><text x="428.60" y="617.30" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="512.00" y="617.30" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="72.00" y="632.92" font-size="11.00" class="sc-loraregular sc-k">52.6%</text><text x="102.43" y="632.92" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="160.32" y="632.92" font-size="11.00" class="sc-loraregular">10</text><text x="174.05" y="632.92" font-size="11.00" class="sc-notoserifcjksc">次试验，共</text><text x="231.94" y="632.92" font-size="11.00" class="sc-loraregular">700</text><text x="253.57" y="632.92" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="308.57" y="632.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="385.60" y="632.92" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="410.49" y="632.92" font-size="11.00" class="sc-loraregular sc-k">29.0%</text><text x="441.52" y="632.92" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="499.42" y="632.92" font-size="11.00" class="sc-loraregular">12</text><text x="512.22" y="632.92" font-size="11.00" class="sc-notoserifcjksc">次试</text><text x="72.00" y="648.54" font-size="11.00" class="sc-notoserifcjksc">验，共</text><text x="107.89" y="648.54" font-size="11.00" class="sc-loraregular">840</text><text x="129.76" y="648.54" font-size="11.00" class="sc-notoserifcjksc">次试验），</text><text x="184.76" y="648.54" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="261.45" y="648.54" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="286.35" y="648.54" font-size="11.00" class="sc-loraregular sc-k">24.7%</text><text x="314.97" y="648.54" font-size="11.00" class="sc-notoserifcjksc">（每个任务</text><text x="372.86" y="648.54" font-size="11.00" class="sc-loraregular">10</text><text x="386.59" y="648.54" font-size="11.00" class="sc-notoserifcjksc">次试验，共</text><text x="444.48" y="648.54" font-size="11.00" class="sc-loraregular">700</text><text x="466.11" y="648.54" font-size="11.00" class="sc-notoserifcjksc">次试验）。按</text><text x="72.00" y="664.16" font-size="11.00" class="sc-notoserifcjksc">任务聚类的标准误为</text><text x="173.89" y="664.16" font-size="11.00" class="sc-loraregular">±3.5–4.8</text><text x="218.78" y="664.16" font-size="11.00" class="sc-notoserifcjksc">个百分点（</text><text x="273.78" y="664.16" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="321.23" y="664.16" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="335.12" y="664.16" font-size="11.00" class="sc-loraregular">±4.8</text><text x="355.80" y="664.16" font-size="11.00" class="sc-notoserifcjksc">）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="72.00 80.93 84.30 92.13 95.77 102.98 108.35 117.28 126.36 131.56 135.26 143.89 149.26 157.72 171.69 179.03 182.66 190.72" y="169.93" font-size="14.00" class="sc-poppinsmedium">8.7 FrontierSWE v2</text><text x="72.00 80.93 84.30 93.23 96.86 107.68 116.76 122.13 129.61 138.53 143.91 152.72 161.35 170.44 178.83 187.91 191.55 200.60 203.97" y="400.73" font-size="14.00" class="sc-poppinsmedium">8.8 CursorBench 4.0</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">报告的数据使用</text><text x="151.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">--bare</text><text x="188.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="235.16" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="303.01" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="316.90" y="82.61" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="339.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">推理强度。作为参考，公开排行榜报告</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的得分为</text><text x="195.93" y="98.23" font-size="11.00" class="sc-loraregular sc-k">30.0%</text><text x="227.65" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="238.65" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="315.34" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="329.23" y="98.23" font-size="11.00" class="sc-loraregular">21.4%</text><text x="357.38" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（三次试验，使用</text><text x="448.28" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="516.12" y="98.23" font-size="11.00" class="sc-notoserifcjksc">运行</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">框架），均在我们内部设置的预期噪声范围内。</text><text x="303.00" y="113.85" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="344.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">报告</text><text x="369.30" y="113.85" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="434.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="448.68" y="113.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="471.38" y="113.85" font-size="11.00" class="sc-notoserifcjksc">推理强度下得</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">分</text><text x="85.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">64.6%</text><text x="116.74" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="192.37" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="152.07" y="188.71" font-size="6.60" class="sc-loraregular">18</text><text x="161.07" y="192.37" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="174.97" y="192.37" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="223.01" y="192.37" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，包含</text><text x="335.91" y="192.37" font-size="11.00" class="sc-loraregular">34</text><text x="350.89" y="192.37" font-size="11.00" class="sc-notoserifcjksc">个超长程的工程与研究任务，涵盖系统</text><text x="72.00" y="207.99" font-size="11.00" class="sc-notoserifcjksc">实现、性能优化、科学计算、</text><text x="215.00" y="207.99" font-size="11.00" class="sc-loraregular">AI</text><text x="228.46" y="207.99" font-size="11.00" class="sc-notoserifcjksc">研究和视觉推理，例如将</text><text x="352.36" y="207.99" font-size="11.00" class="sc-loraregular sc-k">Quantum Espresso</text><text x="452.15" y="207.99" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="466.04" y="207.99" font-size="11.00" class="sc-loraregular sc-k">Fortran</text><text x="507.37" y="207.99" font-size="11.00" class="sc-notoserifcjksc">移植到</text><text x="72.00" y="223.61" font-size="11.00" class="sc-loraregular">Rust</text><text x="94.83" y="223.61" font-size="11.00" class="sc-notoserifcjksc">、构建一个能够运行飞行模拟器的</text><text x="262.72" y="223.61" font-size="11.00" class="sc-loraregular sc-k">OpenGL</text><text x="308.15" y="223.61" font-size="11.00" class="sc-notoserifcjksc">场景渲染器，以及对一个大语言模型（</text><text x="495.15" y="223.61" font-size="11.00" class="sc-loraregular">LLM</text><text x="517.96" y="223.61" font-size="11.00" class="sc-notoserifcjksc">）进</text><text x="72.00" y="239.23" font-size="11.00" class="sc-notoserifcjksc">行后训练使其能玩交互式解谜游戏。最强的模型通常在每个任务上工作接近</text><text x="437.89" y="239.23" font-size="11.00" class="sc-loraregular">20</text><text x="453.52" y="239.23" font-size="11.00" class="sc-notoserifcjksc">小时，且离使该基</text><text x="72.00" y="254.85" font-size="11.00" class="sc-notoserifcjksc">准饱和仍相去甚远。每个模型均在</text><text x="239.89" y="254.85" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="287.94" y="254.85" font-size="11.00" class="sc-notoserifcjksc">自有的智能体运行框架中以</text><text x="422.83" y="254.85" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="445.53" y="254.85" font-size="11.00" class="sc-notoserifcjksc">推理强度运行，每</text><text x="72.00" y="270.47" font-size="11.00" class="sc-notoserifcjksc">个任务五次试验，报告的得分为各次试验的平均值。</text><text x="72.00" y="330.64" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="330.64" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="171.63" y="330.64" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="254.59" y="330.64" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="290.48" y="330.64" fo .37" y="544.91" font-size="9.00" class="sc-loraregular sc-k">token $5</text><text x="119.26" y="544.91" font-size="9.00" class="sc-notoserifcjksc">，每百万缓存读取</text><text x="193.63" y="544.91" font-size="9.00" class="sc-loraregular sc-k">token $0.20</text><text x="242.69" y="544.91" font-size="9.00" class="sc-notoserifcjksc">，每百万输出</text><text x="299.06" y="544.91" font-size="9.00" class="sc-loraregular sc-k">token $20</text><text x="340.47" y="544.91" font-size="9.00" class="sc-notoserifcjksc">）。每个模型均展示五个推理强度档位（</text><text x="502.47" y="544.91" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="518.67" y="544.91" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="104.41" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="113.41" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="135.01" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="144.01" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="173.38" y="556.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="184.75" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="200.95" y="556.61" font-size="9.00" class="sc-notoserifcjksc">），但</text><text x="230.32" y="556.61" font-size="9.00" class="sc-loraregular sc-k">Grok 4.6</text><text x="268.04" y="556.61" font-size="9.00" class="sc-notoserifcjksc">除外，它展示四个档位（</text><text x="367.04" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="383.24" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="392.24" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="424.64" y="556.61" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="433.64" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="457.61" y="556.61" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="468.98" y="556.61" font-size="9.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="495.99" y="556.61" font-size="9.00" class="sc-notoserifcjksc">）。两个来</text><text x="72.00" y="568.31" font-size="9.00" class="sc-notoserifcjksc">源均未提供不确定性区间，因此图中未显示。请注意，</text><text x="288.00" y="568.31" font-size="9.00" class="sc-loraregular">y</text><text x="295.12" y="568.31" font-size="9.00" class="sc-notoserifcjksc">轴从</text><text x="315.49" y="568.31" font-size="9.00" class="sc-loraregular sc-k">23%</text><text x="335.39" y="568.31" font-size="9.00" class="sc-notoserifcjksc">而非零开始，因此各点之间的差异在视觉上被放</text><text x="72.00" y="580.01" font-size="9.00" class="sc-notoserifcjksc">大。</text><text x="72.00" y="678.17" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="127.98" y="678.17" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87" y="678.17" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="212.20" y="678.17" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准测试。题目每月从近期的</text><text x="501.09" y="678.17" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="529.52" y="678.17" font-size="11.00" class="sc-notoserifcjksc">论</text><text x="72.00" y="693.79" font-size="11.00" class="sc-notoserifcjksc">文中提取，随后经过自动和人工检查筛选，以确保题目自成一体、并非平凡且</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">可验证。由于题目取自活跃的研究，该基准比竞赛或奥赛类基准更贴近现实，与数学研究的联系</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">也更紧密。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="196.87" y="147.38" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87" y="147.38" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="257.69" y="147.38" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="147.38" font-size="11.00" class="sc-loraregular">8</text><text x="280.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.66" y="147.38" font-size="11.00" class="sc-loraregular">57</text><text x="316.62" y="147.38" font-size="11.00" class="sc-notoserifcjksc">道题）上评估了</text><text x="396.51" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="479.35" y="147.38" font-size="11.00" class="sc-notoserifcjksc">。该版本的</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">构建方式与早期版本不同：</text><text x="204.00" y="163.00" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="263.32" y="163.00" font-size="11.00" class="sc-notoserifcjksc">现在优先采用能够解决或推翻先前提出的猜想的结果，</text><text x="527.32" y="163.00" font-size="11.00" class="sc-loraregular">57</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="118.89" y="178.62" font-size="11.00" class="sc-loraregular">25</text><text x="133.69" y="178.62" font-size="11.00" class="sc-notoserifcjksc">道来自此类结果，并且</text><text x="243.69" y="178.62" font-size="11.00" class="sc-loraregular">“</text><text x="248.09" y="178.62" font-size="11.00" class="sc-notoserifcjksc">经过专门表述，仅猜测猜想中的值会得到错误答案</text><text x="490.09" y="178.62" font-size="11.00" class="sc-loraregular">”</text><text x="493.93" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。因此，</text><text x="72.00" y="194.24" font-size="11.00" class="sc-notoserifcjksc">这套题奖励的是推导出答案，而不是回忆既有文献。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="119.44" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="133.34" y="244.53" font-size="11.00" class="sc-loraregular">max</text><text x="157.57" y="244.53" font-size="11.00" class="sc-notoserifcjksc">推理强度下，不使用工具时得分</text><text x="314.46" y="244.53" font-size="11.00" class="sc-loraregular">91.2%</text><text x="343.01" y="244.53" font-size="11.00" class="sc-notoserifcjksc">，使用工具（代码执行沙箱，无互联网</text><text x="72.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">访问）时得分</text><text x="140.89" y="260.15" font-size="11.00" class="sc-loraregular">96.9%</text><text x="172.24" y="260.15" font-size="11.00" class="sc-notoserifcjksc">，均为每题四次尝试的平均值。作为对比，在相同设置下，</text><text x="458.24" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">不使用工具时得分</text><text x="162.89" y="275.77" font-size="11.00" class="sc-loraregular">82.9%</text><text x="193.62" y="275.77" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="284.51" y="275.77" font-size="11.00" class="sc-loraregular">92.1%</text><text x="313.05" y="275.77" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="324.05" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="401.09" y="275.77" font-size="11.00" class="sc-notoserifcjksc">则分别为</text><text x="447.98" y="275.77" font-size="11.00" class="sc-loraregular">78.1%</text><text x="478.41" y="275.77" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="492.30" y="275.77" font-size="11.00" class="sc-loraregular sc-k">90.4%</text><text x="523.55" y="275.77" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89 92.07 94.78 100.96 103.67" y="291.39" font-size="11.00" class="sc-loraregular">8.9.A</text><text x="113.45" y="291.39" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="138.34" y="291.39" font-size="11.00" class="sc-loraregular sc-k">8.9.B</text><text x="165.85" y="291.39" font-size="11.00" class="sc-notoserifcjksc">展示了各推理强度档位下的分数与每任务成本的关系。</text><text x="72.00" y="341.67" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="131.32" y="341.67" font-size="11.00" class="sc-notoserifcjksc">自己的</text><text x="167.22" y="341.67" font-size="11.00" class="sc-loraregular">8</text><text x="176.29" y="341.67" font-size="11.00" class="sc-notoserifcjksc">月排行榜使用了不同的设置：每个模型在其厂商的智能体运行框架中运行，</text><text x="72.00" y="357.29" font-size="11.00" class="sc-notoserifcjksc">可使用</text><text x="107.89" y="357.29" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="147.44" y="357.29" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="161.33" y="357.29" font-size="11.00" class="sc-loraregular sc-k">SageMath</text><text x="211.64" y="357.29" font-size="11.00" class="sc-notoserifcjksc">；提示词要求模型在找不到解答时给出最佳猜测；每题两次尝试；</text><text x="72.00" y="372.91" font-size="11.00" class="sc-notoserifcjksc">并使用</text><text x="107.89" y="372.91" font-size="11.00" class="sc-loraregular">LLM</text><text x="133.60" y="372.91" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="188.60" y="372.91" font-size="11.00" class="sc-loraregular sc-k">LLM judge</text><text x="242.31" y="372.91" font-size="11.00" class="sc-notoserifcjksc">）。在该设置下，他们报告</text><text x="377.21" y="372.91" font-size="11.00" class="sc-loraregular sc-k">GPT-6 Astra</text><text x="439.81" y="372.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="450.81" y="372.91" font-size="11.00" class="sc-loraregular">max</text><text x="472.15" y="372.91" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="72.00" y="388.53" font-size="11.00" class="sc-loraregular sc-k">88.6%</text><text x="102.89" y="388.53" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="113.89" y="388.53" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="194.40" y="388.53" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="205.40" y="388.53" font-size="11.00" class="sc-loraregular sc-k">high</text><text x="228.01" y="388.53" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="263.91" y="388.53" font-size="11.00" class="sc-loraregular sc-k">87.7%</text><text x="291.67" y="388.53" font-size="11.00" class="sc-notoserifcjksc">。这些数字最接近我们</text><text x="401.67" y="388.53" font-size="11.00" class="sc-loraregular">“</text><text x="406.07" y="388.53" font-size="11.00" class="sc-notoserifcjksc">使用工具</text><text x="450.07" y="388.53" font-size="11.00" class="sc-loraregular">”</text><text x="453.91" y="388.53" font-size="11.00" class="sc-notoserifcjksc">的结果，但不可</text><text x="72.00" y="404.15" font-size="11.00" class="sc-notoserifcjksc">直接比较。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00" y="390.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 118.57 122.40 128.69 131.57 136.12 144.80 149.48 153.20" y="390.42" font-size="9.00" class="sc-lorabold">8.9.A] ArXivMath</text><text x="158.79" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="167.79" y="390.42" font-size="9.00" class="sc-lorabold">2026</text><text x="190.65" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="202.01" y="390.42" font-size="9.00" class="sc-lorabold">8</text><text x="209.53" y="390.42" font-size="9.00" class="sc-notoserifcjkscbold">月）不使用工具时的准确率分数。</text><text x="344.53" y="390.42" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="412.31" y="390.42" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="421.31" y="390.42" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="489.55" y="390.42" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="500.91" y="390.42" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="402.12" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="103.70" y="402.12" font-size="9.00" class="sc-notoserifcjksc">在内部进行评估，未启用安全防护分类器，涵盖多个推理强度档位。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="72.00 80.29 83.42 87.97 96.30 99.43 103.98 107.36 115.09 120.09 128.38 137.19 142.18 150.99 164.49 172.68 180.70 189.13 196.93" y="477.04" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.10.1 ProgramBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00" y="389.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="389.49" font-size="9.00" class="sc-lorabold sc-k">8.9.B] ArXivMath</text><text x="158.79" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="167.79" y="389.49" font-size="9.00" class="sc-lorabold">2026</text><text x="190.65" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="202.01" y="389.49" font-size="9.00" class="sc-lorabold">8</text><text x="209.53" y="389.49" font-size="9.00" class="sc-notoserifcjkscbold">月）使用工具时的准确率分数。</text><text x="335.53" y="389.49" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="403.31" y="389.49" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="412.31" y="389.49" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="480.55" y="389.49" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="491.91" y="389.49" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="401.19" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="103.70" y="401.19" font-size="9.00" class="sc-notoserifcjksc">在内部进行评估，未启用安全防护分类器，涵盖多个推理强度档位。</text><text x="72.00" y="436.14" font-size="14.00" class="sc-poppinssemibold">8.10</text><text x="102.09" y="436.14" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00" y="501.13" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="150.82" y="501.13" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准测试，包含</text><text x="362.71" y="501.13" font-size="11.00" class="sc-loraregular">200</text><text x="385.17" y="501.13" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体只获得</text><text x="72.00" y="516.75" font-size="11.00" class="sc-notoserifcjksc">一个由开源项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网或反编译工具的</text><text x="72.00" y="532.37" font-size="11.00" class="sc-notoserifcjksc">情况下重建一个能复现原程序行为的代码库。任务范围从小型终端工具（</text><text x="424.00" y="532.37" font-size="11.00" class="sc-loraregular">jq</text><text x="433.21" y="532.37" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="444.21" y="532.37" font-size="11.00" class="sc-loraregular sc-k">ripgrep</text><text x="481.93" y="532.37" font-size="11.00" class="sc-notoserifcjksc">）到大型系</text><text x="72.00" y="547.99" font-size="11.00" class="sc-notoserifcjksc">统（</text><text x="94.00" y="547.99" font-size="11.00" class="sc-loraregular sc-k">FFmpeg</text><text x="134.39" y="547.99" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="145.39" y="547.99" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="180.13" y="547.99" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="191.13" y="547.99" font-size="11.00" class="sc-loraregular sc-k">PHP</text><text x="215.88" y="547.99" font-size="11.00" class="sc-notoserifcjksc">解释器）不等。提交结果通过超过</text><text x="383.77 389.44 395.40 399.99 402.59 409.43 416.26" y="547.99" font-size="11.00" class="sc-loraregular">247,000</text><text x="425.99" y="547.99" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测试</text><text x="72.00" y="563.61" font-size="11.00" class="sc-notoserifcjksc">进行评分，这些测试由智能体驱动的模糊测试生成。</text><text x="72.00" y="630.66" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="630.66" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="630.66" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试套件上得分低于</text><text x="389.77" y="630.66" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="408.38" y="630.66" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳</text><text x="72.00" y="646.28" font-size="11.00" class="sc-notoserifcjksc">定性），剩余</text><text x="140.89" y="646.28" font-size="11.00" class="sc-loraregular">166</text><text x="160.51" y="646.28" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务中，我们只依据参考二进制文件能够通过的测试进行评</text><text x="72.00" y="661.90" font-size="11.00" class="sc-notoserifcjksc">分。我们使用与上游代码仓库相同的</text><text x="250.89" y="661.90" font-size="11.00" class="sc-loraregular sc-k">mini-swe-agent</text><text x="335.47" y="661.90" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六</text><text x="72.00" y="677.52" font-size="11.00" class="sc-notoserifcjksc">小时时间限制。在该任务集上，</text><text x="226.00" y="677.52" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="311.73" y="677.52" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="336.63" y="677.52" font-size="11.00" class="sc-loraregular">91.2%</text><text x="365.17" y="677.52" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="390.07" y="677.52" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="473.47" y="677.52" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="498.36" y="677.52" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="527.65" y="677.52" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="693.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="693.14" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="173.93" y="693.14" font-size="11.00" class="sc-loraregular">85.4%</text><text x="204.34" y="693.14" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 100.20 103.58 112.74 121.18 134.68 143.49 151.93 155.36 160.19 167.75 170.90 177.84 181.22 186.99 195.80 202.74 207.57 210.95 217.76 224.25 233.06" y="205.86" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.1 Humanity’s Last Exam</text><text x="72.00" y="713.04" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.57 93.56 98.72 104.79 107.32 109.95 115.72 118.18 120.71 123.34 128.69 132.56 135.19 140.34 143.06 145.52 148.15 151.20 156.57 162.70 168.07 173.52 176.57 179.03 181.66 189.26 195.23 204.17 209.33 215.39 218.36 222.25 227.53 229.09 233.72 236.35 242.34 247.50 252.13 256.00 258.63 264.84 270.14 275.30 284.24 286.70 289.32 294.48 298.19 304.68 307.49 312.54 315.03 320.40 325.85 332.06 335.70 338.16 341.79 347.21 352.36 357.78 363.40" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="368.48 374.38 378.35 382.22 388.19 392.81 395.31 399.00 405.46 410.62 414.94 420.24 423.05 427.71 430.17 436.02 440.29 445.82 452.28 457.44 463.25 467.53 474.43 479.80 485.25 491.45 495.09 497.55 501.19 506.61 511.75 517.17" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89" y="98.80" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="197.71" y="98.80" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程性能的有力指标：</text><text x="384.71" y="98.80" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="432.15" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的各回合覆盖了直至</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">完整</text><text x="96.89" y="114.42" font-size="11.00" class="sc-loraregular sc-k">1M token</text><text x="145.94" y="114.42" font-size="11.00" class="sc-notoserifcjksc">窗口的一系列上下文长度，而且这些任务所考察的长上下文能力与实际下游用例</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">高度契合。</text><text x="72.00" y="164.97" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="164.97" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="229.73" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="229.73" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="229.73" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="229.73" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="226.07" font-size="6.60" class="sc-loraregular">20</text><text x="239.20" y="229.73" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含横跨数十个学科的</text><text x="473.09 479.00 481.77 487.76 494.60" y="229.73" font-size="11.00" class="sc-loraregular">2,500</text><text x="504.33" y="229.73" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="245.35" font-size="11.00" class="sc-notoserifcjksc">目。这些题目由领域专家编写和审核，仅保留前沿大语言模型无法回答的题目，并且经过专门设</text><text x="72.00" y="260.97" font-size="11.00" class="sc-notoserifcjksc">计，无法通过互联网搜索快速得到答案。</text><text x="72.00" y="310.92" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="310.92" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="278.73" y="310.92" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="289.73" y="310.92" font-size="11.00" class="sc-loraregular">(1)</text><text x="303.34" y="310.92" font-size="11.00" class="sc-notoserifcjksc">纯推理，不使用工具；</text><text x="413.34" y="310.92" font-size="11.00" class="sc-loraregular">(2)</text><text x="428.85" y="310.92" font-size="11.00" class="sc-notoserifcjksc">使用网络搜索、网页抓</text><text x="72.00" y="326.54" font-size="11.00" class="sc-notoserifcjksc">取、程序化工具调用和代码执行。在所有运行中，思考设为</text><text x="360.89" y="326.54" font-size="11.00" class="sc-loraregular sc-k">auto</text><text x="383.76" y="326.54" font-size="11.00" class="sc-notoserifcjksc">（自动），且跨上下文使用的</text><text x="72.00" y="342.16" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="104.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">总数上限为</text><text x="161.95" y="342.16" font-size="11.00" class="sc-loraregular">1M</text><text x="176.05" y="342.16" font-size="11.00" class="sc-notoserifcjksc">。这些结果未使用上下文压缩。</text><text x="330.05" y="342.16" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="416.00" y="342.16" font-size="11.00" class="sc-notoserifcjksc">担任评分模型。</text><text x="72.00" y="408.06" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体中出现结果污染，我们为搜索器和抓取器屏蔽了已知会讨论</text><text x="470.89" y="408.06" font-size="11.00" class="sc-loraregular">HLE</text><text x="495.57" y="408.06" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="423.68" font-size="11.00" class="sc-notoserifcjksc">（参见附录</text><text x="129.89" y="423.68" font-size="11.00" class="sc-loraregular sc-k">9.2</text><text x="144.69" y="423.68" font-size="11.00" class="sc-notoserifcjksc">）。我们还用文本规则筛查每一份回答正确的对话记录，查找使用</text><text x="466.58" y="423.68" font-size="11.00" class="sc-loraregular">HLE</text><text x="491.25" y="423.68" font-size="11.00" class="sc-notoserifcjksc">特定来源</text><text x="72.00" y="439.30" font-size="11.00" class="sc-notoserifcjksc">的迹象，并使用</text><text x="151.89" y="439.30" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="228.93" y="439.30" font-size="11.00" class="sc-notoserifcjksc">审查每一份被标记的对话记录。经确认的作弊案例被重新评为错</text><text x="72.00" y="454.92" font-size="11.00" class="sc-notoserifcjksc">误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="368.48" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 107.15 109.24 114.78 118.25 120.62 127.66 133.22 141.50 146.21 151.96 154.86 158.58 163.54 165.27 169.63 172.00 177.43 182.15 186.52 190.23 192.60 198.22 203.15 207.86" y="367.92" font-size="9.00" class="sc-lorabold">8.11.1.A] Humanity’s Last Exam</text><text x="216.14" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.92" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">，使用工具）推理强度扩展</text><text x="351.46" y="367.92" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="407.83" y="367.92" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="426.40" y="367.92" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="455.76" y="367.92" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="474.33" y="367.92" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="485.70" y="367.92" font-size="9.00" class="sc-loraregular">HLE</text><text x="505.89" y="367.92" font-size="9.00" class="sc-notoserifcjksc">准确率</text><text x="72.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费用。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.15 106.53 115.74 123.96 133.02 143.06" y="429.01" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.2 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">21</text><text x="80.03 86.13 92.12 97.97 104.04 109.56 112.09 114.72 118.24 120.70 123.23 125.86 131.20 135.07 137.70 142.86 145.58 148.04 150.67 153.72 159.08 165.22 170.59 176.25 179.30 181.75 184.38 191.73 198.50 204.71 211.69 219.63 222.13 224.76 229.92 232.54 237.86 242.12 247.97 252.60 257.22 262.11 268.09 273.94 282.87 288.03 290.84 296.91 299.54 305.36 310.77 316.84 322.16 328.15 337.08 342.24 346.53 351.90 354.53 357.86 363.70 368.03 370.66 378.11 383.47 388.89 394.86 397.49 403.70 409.11 413.74 419.14 424.30 428.56 433.88 439.86 442.49 448.75 454.02 459.33 465.30 469.56 474.72 479.99 484.71" y="704.45" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: a cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.93" font-size="9.00" class="sc-lorabold sc-k">8.11.1.B] Humanity’s Last Exam</text><text x="216.14" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="225.14" y="367.93" font-size="9.00" class="sc-lorabold">HLE</text><text x="243.46" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">，不使用工具）测试时计算扩展</text><text x="369.46" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="425.83" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="444.40" y="367.93" font-size="9.00" class="sc-notoserifcjksc">扩展到</text><text x="473.76" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="492.33" y="367.93" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="503.70" y="367.93" font-size="9.00" class="sc-loraregular">HLE</text><text x="523.89" y="367.93" font-size="9.00" class="sc-notoserifcjksc">准</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">确率与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费用。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="452.86" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="452.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10" y="452.86" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="408.89" y="449.19" font-size="6.60" class="sc-loraregular">21</text><text x="414.83" y="452.86" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.73" y="452.86" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="494.55" y="452.86" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="468.48" font-size="11.00" class="sc-notoserifcjksc">度研究基准测试，旨在评估模型在真实用户会提出的各类复杂研究问题上的表现。</text><text x="468.00" y="468.48" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="509.68" y="468.48" font-size="11.00" class="sc-notoserifcjksc">包含</text><text x="72.00" y="484.10" font-size="11.00" class="sc-loraregular">100</text><text x="92.56" y="484.10" font-size="11.00" class="sc-notoserifcjksc">个精选任务，这些任务源自多个领域的用户查询。题目依据专家编写的评分细则进行评分，</text><text x="72.00" y="499.72" font-size="11.00" class="sc-notoserifcjksc">评分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="566.42" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="566.42" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="454.12" y="566.42" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="582.04" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89" y="582.04" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="582.04" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="615.00" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="118.89" y="615.00" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="160.57" y="615.00" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="218.46" y="615.00" font-size="11.00" class="sc-loraregular sc-k">Gemini 3 Pro</text><text x="288.08" y="615.00" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，但该模型已不再可用。在我们的</text><text x="72.00" y="630.62" font-size="11.00" class="sc-notoserifcjksc">评估中，我们使用</text><text x="162.89" y="630.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="248.85" y="630.62" font-size="11.00" class="sc-notoserifcjksc">依据各任务的评分细则对回答进行评分，采用相同的二元</text><text x="72.00" y="646.24" font-size="11.00" class="sc-loraregular sc-k">MET/UNMET</text><text x="146.32" y="646.24" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="646.24" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="646.24" font-size="11.00" class="sc-notoserifcjksc">节中的公式汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="72.00 80.29 83.42 87.97 92.52 95.65 103.37 106.75 119.73 128.79 138.16 147.38" y="617.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.11.3 WANDR</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的规程，对每个回答进行五次独立的评分运行并报告平均值。我们的评判提</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">示词取自论文的</text><text x="149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="173.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="190.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文的附录</text><text x="259.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="268.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判者的选择可能使绝对分数变动</text><text x="469.85" y="98.23" font-size="11.00" class="sc-loraregular">10</text><text x="483.58" y="98.23" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="497.47" y="98.23" font-size="11.00" class="sc-loraregular">25</text><text x="512.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">分，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">但系统间的排序保持不变，因此我们的分数与论文中的主要数字不可直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除评判模型外，我们还使用了自己的智能体运行框架（不使用附录</text><text x="393.89" y="179.77" font-size="11.00" class="sc-loraregular">C.4</text><text x="413.14" y="179.77" font-size="11.00" class="sc-notoserifcjksc">中的系统提示词（</text><text x="501.14" y="179.77" font-size="11.00" class="sc-loraregular">system</text><text x="72.00" y="195.39" font-size="11.00" class="sc-loraregular sc-k">prompt</text><text x="110.35" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）；使用网络搜索、网页抓取、程序化工具调用和代码执行，</text><text x="407.35" y="195.39" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="439.40" y="195.39" font-size="11.00" class="sc-notoserifcjksc">预算为</text><text x="475.29" y="195.39" font-size="11.00" class="sc-loraregular">980k</text><text x="500.57" y="195.39" font-size="11.00" class="sc-notoserifcjksc">），并</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">指示模型将最终报告写入其执行环境中的一个文件，且只对该文件的内容评分，而非对完整的智</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">能体对话记录评分；这样可以将交付物与中间工具输出隔离开来。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.29 110.39 115.92 119.39 121.76 128.47 134.64 140.47 146.66" y="556.05" font-size="9.00" class="sc-lorabold">8.11.2.A] DRACO</text><text x="155.95" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="173.95" y="556.05" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系。在</text><text x="365.32" y="556.05" font-size="9.00" class="sc-loraregular">980k</text><text x="388.37" y="556.05" font-size="9.00" class="sc-notoserifcjksc">任务预算下，推理强度从</text><text x="489.74" y="556.05" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="508.30" y="556.05" font-size="9.00" class="sc-notoserifcjksc">提升到</text><text x="72.00" y="567.75" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="90.57" y="567.75" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="101.94" y="567.75" font-size="9.00" class="sc-loraregular sc-k">DRACO</text><text x="136.04" y="567.75" font-size="9.00" class="sc-notoserifcjksc">归一化分数与平均每任务成本（对数刻度）的关系。成本按完美缓存命中率计费，且不含网络搜索费</text><text x="72.00" y="579.45" font-size="9.00" class="sc-notoserifcjksc">用。</text><text x="72.00" y="641.20" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">WANDR</text><text x="112.72" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">（</text><text x="123.72" y="641.20" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Wide ANd Deep Research</text><text x="253.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="264.79" y="641.20" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="278.68" y="641.20" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="333.50" y="641.20" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，旨在为</text><text x="457.40" y="641.20" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="499.08" y="641.20" font-size="11.00" class="sc-notoserifcjksc">深度研</text><text x="72.00" y="656.82" font-size="11.00" class="sc-notoserifcjksc">究基准提供一个广度搜索方面的对应基准。它包含</text><text x="316.89" y="656.82" font-size="11.00" class="sc-loraregular">500</text><text x="339.44" y="656.82" font-size="11.00" class="sc-notoserifcjksc">个任务，在这些任务中，模型必须搜索数</text><text x="72.00" y="672.44" font-size="11.00" class="sc-notoserifcjksc">十到数百个实体，查找每个实体的相关事实，并将这些事实连同引用列入结构化记录。我们运行</text><text x="72.00" y="688.06" font-size="11.00" class="sc-notoserifcjksc">的是该评估的修改版本；方法上的差异将在下文说明。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="149.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="160.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="173.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="72.00" y="632.40" width="40.72" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="112.72" y="632.40" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="123.72" y="632.40" width="26.39" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="150.11" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="153.00" y="632.40" width="21.74" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="174.74" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="177.63" y="632.40" width="26.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="204.26" y="632.40" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="207.16" y="632.40" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.perplexity.ai/hub/blog/wandr-benchmark-evaluating-research-agents-that-must-search-wide-and-deep" rel="noopener"><rect x="253.79" y="632.40" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="98.80" font-size="11.00" class="sc-loraregular sc-k">980k token</text><text x="454.12" y="98.80" font-size="11.00" class="sc-notoserifcjksc">任务预算的条件</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">下评估了</text><text x="118.89" y="114.42" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="114.42" font-size="11.00" class="sc-notoserifcjksc">模型。任务由一个评判模型评分，该评判模型可以使用与被测模型相同的网页</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">抓取工具。评分者会重新抓取所引用的</text><text x="261.89" y="130.04" font-size="11.00" class="sc-loraregular">URL</text><text x="283.43" y="130.04" font-size="11.00" class="sc-notoserifcjksc">；随后评判模型判断这些参考来源是否支持解答。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">主要指标是</text><text x="127.00" y="179.77" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="179.77" font-size="11.00" class="sc-notoserifcjksc">软</text><text x="145.29" y="179.77" font-size="11.00" class="sc-loraregular">F1</text><text x="155.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="166.32" y="179.77" font-size="11.00" class="sc-loraregular sc-k">soft F1</text><text x="198.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="209.83" y="179.77" font-size="11.00" class="sc-loraregular">”</text><text x="213.67" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，它在精确率（模型解答中有多少得到验证）与召回率（模型完成</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">了所要求事实集合中的多少）之间取得平衡。当所需事实只有部分能够得到验证时，给予部分得</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">分。结果为</text><text x="129.89" y="211.01" font-size="11.00" class="sc-loraregular">500</text><text x="152.44" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个任务的平均值；未通过格式校验的单个实体行会被丢弃，而不是使整个任务判</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">为失败。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">在我们的评估中，模型获得的是离线的网络搜索和网页抓取工具，只能访问一个冻结索引；</text><text x="72.00" y="292.54" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="126.82" y="292.54" font-size="11.00" class="sc-notoserifcjksc">的版本使用的是实时网络。</text><text x="258.82" y="292.54" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="297.11" y="292.54" font-size="11.00" class="sc-notoserifcjksc">模型由</text><text x="333.01" y="292.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="418.96" y="292.54" font-size="11.00" class="sc-notoserifcjksc">进行评判，这与</text><text x="72.00" y="308.16" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="126.82" y="308.16" font-size="11.00" class="sc-notoserifcjksc">所用的</text><text x="162.72" y="308.16" font-size="11.00" class="sc-loraregular sc-k">GPT-5.4</text><text x="207.03" y="308.16" font-size="11.00" class="sc-notoserifcjksc">不同。我们的提示词也略有不同。由于工具和评分逻辑与</text><text x="484.92" y="308.16" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="72.00" y="323.78" font-size="11.00" class="sc-notoserifcjksc">的运行框架不同，我们的结果与竞争对手模型的已报告数字不可直接比较。</text><text x="72.00" y="653.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 101.39 103.49 108.53 110.63 116.16 119.64 122.00 130.52 136.53 143.49 150.19" y="653.19" font-size="9.00" class="sc-lorabold">8.11.3.A] WANDR</text><text x="158.73" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">软</text><text x="170.10" y="653.19" font-size="9.00" class="sc-lorabold">F1</text><text x="181.26" y="653.19" font-size="9.00" class="sc-notoserifcjkscbold">分数</text><text x="199.26" y="653.19" font-size="9.00" class="sc-notoserifcjksc">与各推理强度档位下平均每任务成本的关系，任务预算为</text><text x="426.63" y="653.19" font-size="9.00" class="sc-loraregular sc-k">980k token</text><text x="473.54" y="653.19" font-size="9.00" class="sc-notoserifcjksc">（对数刻度）。</text><text x="72.00" y="664.89" font-size="9.00" class="sc-notoserifcjksc">成本按完美缓存命中率计费，且不含网络搜索费用。</text></svg></div>
