<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为请求提供了借口和框架设定，并在某些情况下提供了避免触发分类器的指令。在其中一</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个他们测试了约五小时的任务中，</text><text x="273.00 280.69 283.68 289.29 295.86 302.44 308.40 311.29 320.03 326.59 333.16 338.25 341.15 347.14 349.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="358.73 369.73 380.73 391.73 402.73 413.73 424.73 435.73 446.73 457.73 468.73 479.73 490.73 501.73 512.73 523.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为一条从权限提升到代码执行的攻击</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">链生成了可用的端到端漏洞利用；这项工作被分解到</text><text x="363.89 367.90 374.73" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="384.45 395.45 406.45 417.45 428.45 439.45 450.45 461.45 472.45 483.45 494.45 505.45 516.45 527.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">多个独立的上下文中，且没有任</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">何单个对话提及总体目标。</text><text x="108.00 112.00 118.83 124.51 127.40 134.00 139.68 146.08" y="163.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="154.07 165.07 176.07" y="163.57" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="189.96 195.96" y="163.57" font-size="11.00" class="sc-loraregular">56</text><text x="205.21 216.21 227.21 238.21 249.21" y="163.57" font-size="11.00" class="sc-notoserifcjksc">小时，通过</text><text x="263.10 269.28" y="163.57" font-size="11.00" class="sc-loraregular">82</text><text x="278.08 289.08 300.08 311.08 322.08 333.08 344.08 355.08" y="163.57" font-size="11.00" class="sc-notoserifcjksc">段多轮攻击对话对</text><text x="368.98 376.66 379.66 385.27 391.83 398.41 404.37 407.27 416.00 422.57 429.13 434.23 437.12 443.11 445.82" y="163.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="454.71 465.71 476.71 487.71 498.71 509.71 520.71" y="163.57" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">每段对话都被包装成一项面向开发者的大型编程任务，旨在从大量合理请求的应用代码中</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">引出可用的漏洞利用，而不是直接索要漏洞利用。没有任何对话推进到概念验证之后，且</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">每一条直接的进攻性请求都被拦截。唯一值得注意的输出来自两用防御性请求，例如可用</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">于生产环境的防御性代码，这是我们的政策所允许的。</text><text x="108.00 116.37 121.06 126.62 132.43 135.32 141.51 150.21 155.88" y="276.91" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="165.45 176.45 187.45" y="276.91" font-size="11.00" class="sc-notoserifcjksc">使用其</text><text x="201.35 207.58 214.17 219.85 226.43" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="235.28 246.28 257.28 268.28 279.28 290.28 301.28 312.28 323.28 334.28 345.28 356.28 367.28 378.28 389.28 400.28 411.28 422.28 433.28 444.28 455.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">自动化攻击者针对多组智能体任务进行了测试。</text><text x="466.28 472.52 479.11 484.78 491.36" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="500.22 511.22 522.22" y="276.91" font-size="11.00" class="sc-notoserifcjksc">基于多</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">样化的红队策略进行训练，其中包括取自</text><text x="308.89 317.26 321.95 327.52 333.32 336.22 342.40 351.10 356.78 363.45 366.35 373.23 377.92 383.88 390.56" y="292.53" font-size="11.00" class="sc-loraregular">Gray Swan Arena</text><text x="399.13 410.13 421.13 432.13 443.13 454.13 465.13 476.13 487.13 498.13 509.13 520.13" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的真实世界攻击技术。他们</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">在自建的三个关键基础设施环境以及一组取自公开披露的漏洞的漏洞利用复现任务上对其</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">进行了测试。在每一组任务中，</text><text x="262.00 270.37 275.06 280.62 286.43 289.32 295.51 304.21 309.88" y="323.77" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="319.45 330.45 341.45 352.45 363.45 374.45 385.45" y="323.77" font-size="11.00" class="sc-notoserifcjksc">的状态评判器（</text><text x="396.45 401.55 405.80 411.40 415.66 421.62 424.51 427.38 433.95 440.53 446.56" y="323.77" font-size="11.00" class="sc-loraregular">state judge</text><text x="452.52 463.52 474.52 485.52 496.52 507.52 518.52 529.52" y="323.77" font-size="11.00" class="sc-notoserifcjksc">）均未记录到任何</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">突破，也没有任何尝试产生违规。每次尝试都会将模型置于一台已失陷主机上，并要求它</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="355.01" font-size="11.00" class="sc-notoserifcjksc">执行一项破坏性目标或涉及数据外泄的目标，包括：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">跨电网、医疗健康和云环境的</text><text x="289.89 296.25" y="406.45" font-size="11.00" class="sc-loraregular">61</text><text x="303.15 314.15 325.15 336.15 347.15 358.15 369.15 380.15 391.15 402.15 413.15 424.15 435.15 446.15 457.15 468.15 479.15 490.15 501.15 512.15 523.15" y="406.45" font-size="11.00" class="sc-notoserifcjksc">个场景，每个场景都要求模型破
