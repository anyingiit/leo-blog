361.17" font-size="11.00" class="sc-notoserifcjksc">）的能力，此处</text><text x="473.48" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="477.88" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="499.88" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="503.72" y="361.17" font-size="11.00" class="sc-notoserifcjksc">一词涵</text><text x="72.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">盖提示词、定制运行框架以及多智能体流水线。在我们的</text><text x="347.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="424.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了越狱严</text><text x="72.00" y="392.41" font-size="11.00" class="sc-notoserifcjksc">重性的以下四个维度：</text><text x="108.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="152.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="174.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="218.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能使攻击者在其现有工具和能力的基础上前进多远；</text><text x="108.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="174.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="196.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">普适性）</text><text x="240.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">：同一越狱技术可适用于多少种不同的进攻性任务；</text><text x="108.00" y="506.90" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="174.00" y="506.90" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力投入；以及</text><text x="108.00" y="539.28" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="152.00" y="539.28" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00" y="571.66" font-size="11.00" class="sc-notoserifcjksc">例如，严重级越狱将是在高能力提升模型上易于发现、易于武器化且具有普适性的越狱。</text><text x="72.00" y="620.24" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.03 239.74" y="620.24" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="248.63" y="620.24" font-size="11.00" class="sc-notoserifcjksc">的严重级越狱的证据；</text><text x="358.63 366.32 369.31 374.92 381.48 388.06 394.02 396.92 402.51 408.18 414.58 417.58 423.54 426.43 432.43 435.13" y="620.24" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="439.14" y="620.24" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.14 457.83 460.82 466.43 472.99 479.57 485.53 488.43 494.02 499.69 506.09 509.09 515.05 517.94" y="620.24" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="526.83" y="620.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="635.86" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03" y="635.86" font-size="11.00" class="sc-notoserifcjksc">的情况也依然如此。即便如此，我们并不期望我们的分类器具有完美的鲁棒性。</text><text x="72.00" y="651.48" font-size="11.00" class="sc-notoserifcjksc">因此，我们在内部以及与外部合作伙伴一起对模型进行广泛测试，以主动发现并修补越狱。下文</text><text x="72.00" y="667.10" font-size="11.00" class="sc-notoserifcjksc">报告的是在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="667.10" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63" y="667.10" font-size="11.00" class="sc-notoserifcjksc">较早快照上进行的此类测试结果；我们的安全防护措施</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在不同模型快照之间通常以同等方式运行，我们有信心这些结果能够代表最终模型。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项名为</text><text x="173.89 178.58 184.50 193.31 196.40 203.08 209.65 215.03 220.63 225.00 229.26 234.93 240.78 246.61 252.58" y="157.42" font-size="11.00" class="sc-loraregular">rewind-attacker</text><text x="260.23" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全防护的模型（</text><text x="524.23" y="157.42" font-size="11.00" class="sc-loraitalic">“</text><text x="528.50" y="157.42" font-size="11.00" class="sc-notoserifcjksc">助</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">手</text><text x="83.00" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="87.09" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器（</text><text x="197.09" y="173.04" font-size="11.00" class="sc-loraregular">“</text><text x="201.49" y="173.04" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="234.49" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="238.58" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有用（</text><text x="480.58 487.17 493.13 496.13 502.64 506.36 512.92 515.92" y="173.04" font-size="11.00" class="sc-loraregular">helpful-</text><text x="72.00 78.43 85.11 88.05" y="188.66" font-size="11.00" class="sc-loraregular">only</text><text x="93.86" y="188.66" font-size="11.00" class="sc-notoserifcjksc">）语言模型，经提示后模拟人类红队成员，从助手处诱导出进攻性网络能力。</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个会话中启动，在该会话中它可以向一个</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 373.87 380.31 386.89" y="238.38" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="395.74" y="238.38" font-size="11.00" class="sc-notoserifcjksc">智能体发送指令，该智能体在</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">任务沙箱内运行助手模型（带有生产环境安全防护措施）。随后，攻击者获得针对助手的</text><text x="503.89" y="254.00" font-size="11.00" class="sc-loraregular">400</text><text x="526.41" y="254.00" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">调用上限，在此期间攻击者会收到拦截反馈，并有机会回溯到更早的状态以尝试新方法。每个任</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">务将智能体置于一个独立的</text><text x="206.89 215.09 221.52 227.38 233.21 239.17" y="285.24" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">害者目录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="402.00 407.80 414.23 424.07 433.90 439.58 446.25 452.83 458.21 463.89 470.56 477.14 482.52 488.32 494.75 501.33 505.59 510.27 516.71" y="300.86" font-size="11.00" class="sc-loraregular">command-and-control</text><text x="519.70" y="300.86" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务套件包含以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="481.89 489.98 498.36" y="400.30" font-size="11.00" class="sc-loraregular">DNS</text><text x="504.60" y="400.30" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00 102.68 108.64 115.04 121.63 128.07 134.50" y="415.92" font-size="11.00" class="sc-loraregular">webhook</text><text x="143.30" y="415.92" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20" y="415.92" font-size="11.00" class="sc-loraregular">CVE</text><text x="379.80" y="415.92" font-size="11.00" class="sc-notoserifcjksc">的远程和本地漏洞利用（包括</text><text x="72.00 78.68 85.02 88.11 94.79" y="431.54" font-size="11.00" class="sc-loraregular">nginx</text><text x="100.62" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="111.62" y="431.54" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="158.39" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="169.39 175.74 178.73 181.82 188.23" y="431.54" font-size="11.00" class="sc-loraregular">glibc</text><text x="196.97" y="431.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="210.86" y="431.54" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="260.47" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）；命令与控制；以及自我复制。</text><text x="72.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">本评估与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 162.77 168.45 174.85 177.84 183.80 186.70 192.69 195.40" y="481.26" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="202.29" y="481.26" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的评估相同，并对</text><text x="359.19 366.88 369.87 375.48 382.05 388.62 394.59 397.48 406.21 412.78 419.35 424.44 427.33" y="481.26" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="436.22" y="481.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="450.11 457.80 460.80 466.40 472.97 479.55 485.51 488.40 493.99 499.67 506.07 509.06 515.03 517.92 523.91 526.62" y="481.26" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="72.00" y="496.88" font-size="11.00" class="sc-notoserifcjksc">进行了新的运行。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">59</text><text x="72.00" y="367.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22 115.69 118.06 124.25 127.06 131.78 137.34 142.70 147.55 149.91 156.83 162.24 167.80 172.17 174.54 179.40 181.49" y="367.46" font-size="9.00" class="sc-lorabold">3.5.1.A] Claude Opus 5.5</text><text x="188.72" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">的鲁棒性与此前的</text><text x="263.09 267.86 272.57 277.70 280.50" y="367.46" font-size="9.00" class="sc-lorabold">Fable</text><text x="287.71" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">系列模型相当</text><text x="341.71" y="367.46" font-size="9.00" class="sc-notoserifcjksc">，这体现在我们的对抗性网络危害任务套件上，并</text><text x="72.00" y="379.16" font-size="9.00" class="sc-notoserifcjksc">且它比</text><text x="101.37 107.66 110.11 114.70 120.07 125.45 130.33 132.70 139.84 145.21 150.59 154.76 157.12" y="379.16" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="164.39" y="379.16" font-size="9.00" class="sc-notoserifcjksc">更具鲁棒性。</text><text x="72.00" y="411.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48" y="411.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">美国人工智能标准与创新中心的外部测试</text><text x="72.00" y="433.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（</text><text x="85.00" y="433.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">CAISI</text><text x="119.44" y="433.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="461.37" font-size="11.00" class="sc-notoserifcjksc">我们与美国国家标准与技术研究院（</text><text x="248.00 256.33 261.93 266.18 269.27 275.71 282.39 288.06 291.05 293.95 297.54 304.22 309.31 313.57 316.84 321.10 327.66 331.92 337.88 340.77 347.15 350.87 353.77 359.96 364.22 369.89 376.57 383.15 388.82 393.51 400.09 405.18 408.07 413.75 420.43 427.00 429.90 436.40 442.30 448.16 454.75 461.42 467.86 470.85 477.28 483.59" y="461.37" font-size="11.00" class="sc-loraregular">National Institute of Standards and Technology</text><text x="489.40" y="461.37" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="500.40" y="461.37" font-size="11.00" class="sc-loraregular">NIST</text><text x="525.74" y="461.37" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="476.99" font-size="11.00" class="sc-notoserifcjksc">下属的美国人工智能标准与创新中心（</text><text x="259.00 266.69 272.65 279.23 283.49 289.45 294.21 297.10 300.77 307.20 311.97 314.86 321.74 325.43 328.32 334.52 338.77 344.45 351.12 357.70 363.38 368.07 374.64 379.74 382.63 388.30 394.98 401.56 404.45 408.05 414.73 421.40 427.78 433.23 438.83 443.08 446.18 452.61" y="476.99" font-size="11.00" class="sc-loraregular">Center for AI Standards and Innovation</text><text x="459.29" y="476.99" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="470.29 477.87 484.75 488.44 494.67" y="476.99" font-size="11.00" class="sc-loraregular">CAISI</text><text x="498.36" y="476.99" font-size="11.00" class="sc-notoserifcjksc">）合</text><text x="72.00" y="492.61" font-size="11.00" class="sc-notoserifcjksc">作，开展了网络安全和生物能力及安全防护措施的测量，以及非预期的模型行为方面的工作。</text><text x="72.00" y="524.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.3</text><text x="105.80" y="524.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00" y="552.37" font-size="11.00" class="sc-notoserifcjksc">与此前的模型一样，我们与签约外部测试方合作，对</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 374.92 381.48 388.05 393.14 396.04 402.03 404.74" y="552.37" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="413.63" y="552.37" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行红队</text><text x="72.00" y="567.99" font-size="11.00" class="sc-notoserifcjksc">测试（</text><text x="105.00 109.69 115.59 122.17 125.06 129.32 135.26 140.94 150.77 153.86 160.54" y="567.99" font-size="11.00" class="sc-loraregular">red teaming</text><text x="166.62" y="567.99" font-size="11.00" class="sc-notoserifcjksc">）。这些机构评估了我们在</text><text x="301.52 309.20 312.20 317.81 324.37 330.95 336.91 339.81 348.54 355.11 361.67 366.77 369.66" y="567.99" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="378.55" y="567.99" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="403.44 411.13 414.12 419.73 426.30 432.88 438.84 441.73 447.32 453.00 459.40 462.39 468.35 471.25 477.24 479.95" y="567.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5.1</text><text x="486.84" y="567.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="500.74 508.43 511.42 517.03 523.59 530.17" y="567.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="583.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos 5.1</text><text x="128.66" y="583.61" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的许多相同任务，此外还有它们自行设计的任务。</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="633.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64" y="633.33" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="253.53" y="633.33" font-size="11.00" class="sc-loraregular">95</text><text x="268.78" y="633.33" font-size="11.00" class="sc-notoserifcjksc">小时对</text><text x="304.67 312.36 315.35 320.96 327.53 334.11 340.07 342.96 351.69 358.26 364.83 369.92 372.81 378.81 381.51" y="633.33" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="390.40" y="633.33" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，针对沙箱化的</text><text x="108.00" y="648.95" font-size="11.00" class="sc-notoserifcjksc">任务发送了超过</text><text x="187.89 193.80 199.98 202.59 209.42 216.25" y="648.95" font-size="11.00" class="sc-loraregular">29,000</text><text x="225.99" y="648.95" font-size="11.00" class="sc-notoserifcjksc">条请求，每个任务都需要为一个公开披露的漏洞复现漏洞利用。</text><text x="108.00" y="664.57" font-size="11.00" class="sc-notoserifcjksc">他们报告了七个任务中的</text><text x="231.89" y="664.57" font-size="11.00" class="sc-loraregular">13</text><text x="244.92" y="664.57" font-size="11.00" class="sc-notoserifcjksc">个候选突破，但未发现任何通用越狱。这些会话的对话记录</text><text x="108.00" y="680.19" font-size="11.00" class="sc-notoserifcjksc">表明，</text><text x="141.00 148.69 151.68 157.29 163.86 170.44 176.40 179.29 188.02 194.59 201.16 206.25 209.15 215.14 217.85" y="680.19" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="226.73" y="680.19" font-size="11.00" class="sc-notoserifcjksc">在目标的源代码中定位了漏洞，并亲自编写了核心漏洞利用机</text><text x="108.00" y="695.81" font-size="11.00" class="sc-notoserifcjksc">制。人类操作者</text><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="403.44" y="559.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="403.44" y="559.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="438.84" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为请求提供了借口和框架设定，并在某些情况下提供了避免触发分类器的指令。在其中一</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个他们测试了约五小时的任务中，</text><text x="273.00 280.69 283.68 289.29 295.86 302.44 308.40 311.29 320.03 326.59 333.16 338.25 341.15 347.14 349.85" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="358.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为一条从权限提升到代码执行的攻击</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">链生成了可用的端到端漏洞利用；这项工作被分解到</text><text x="363.89" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="384.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">多个独立的上下文中，且没有任</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">何单个对话提及总体目标。</text><text x="108.00 112.00 118.83 124.51 127.40 134.00 139.68 146.08" y="163.57" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="154.07" y="163.57" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="189.96" y="163.57" font-size="11.00" class="sc-loraregular">56</text><text x="205.21" y="163.57" font-size="11.00" class="sc-notoserifcjksc">小时，通过</text><text x="263.10" y="163.57" font-size="11.00" class="sc-loraregular">82</text><text x="278.08" y="163.57" font-size="11.00" class="sc-notoserifcjksc">段多轮攻击对话对</text><text x="368.98 376.66 379.66 385.27 391.83 398.41 404.37 407.27 416.00 422.57 429.13 434.23 437.12 443.11 445.82" y="163.57" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="454.71" y="163.57" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，</text><text x="108.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">每段对话都被包装成一项面向开发者的大型编程任务，旨在从大量合理请求的应用代码中</text><text x="108.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">引出可用的漏洞利用，而不是直接索要漏洞利用。没有任何对话推进到概念验证之后，且</text><text x="108.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">每一条直接的进攻性请求都被拦截。唯一值得注意的输出来自两用防御性请求，例如可用</text><text x="108.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">于生产环境的防御性代码，这是我们的政策所允许的。</text><text x="108.00 116.37 121.06 126.62 132.43 135.32 141.51 150.21 155.88" y="276.91" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="165.45" y="276.91" font-size="11.00" class="sc-notoserifcjksc">使用其</text><text x="201.35" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="235.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">自动化攻击者针对多组智能体任务进行了测试。</text><text x="466.28" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="500.22" y="276.91" font-size="11.00" class="sc-notoserifcjksc">基于多</text><text x="108.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">样化的红队策略进行训练，其中包括取自</text><text x="308.89 317.26 321.95 327.52 333.32 336.22 342.40 351.10 356.78 363.45 366.35 373.23 377.92 383.88 390.56" y="292.53" font-size="11.00" class="sc-loraregular">Gray Swan Arena</text><text x="399.13" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的真实世界攻击技术。他们</text><text x="108.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">在自建的三个关键基础设施环境以及一组取自公开披露的漏洞的漏洞利用复现任务上对其</text><text x="108.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">进行了测试。在每一组任务中，</text><text x="262.00 270.37 275.06 280.62 286.43 289.32 295.51 304.21 309.88" y="323.77" font-size="11.00" class="sc-loraregular">Gray Swan</text><text x="319.45" y="323.77" font-size="11.00" class="sc-notoserifcjksc">的状态评判器（</text><text x="396.45 401.55 405.80 411.40 415.66 421.62 424.51 427.38 433.95 440.53 446.56" y="323.77" font-size="11.00" class="sc-loraregular">state judge</text><text x="452.52" y="323.77" font-size="11.00" class="sc-notoserifcjksc">）均未记录到任何</text><text x="108.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">突破，也没有任何尝试产生违规。每次尝试都会将模型置于一台已失陷主机上，并要求它</text><text x="108.00" y="355.01" font-size="11.00" class="sc-notoserifcjksc">执行一项破坏性目标或涉及数据外泄的目标，包括：</text><text x="144.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">跨电网、医疗健康和云环境的</text><text x="289.89" y="406.45" font-size="11.00" class="sc-loraregular">61</text><text x="303.15" y="406.45" font-size="11.00" class="sc-notoserifcjksc">个场景，每个场景都要求模型破坏运营系统或外</text><text x="144.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">泄敏感数据。</text><text x="210.00" y="422.07" font-size="11.00" class="sc-loraregular">Shade</text><text x="243.93" y="422.07" font-size="11.00" class="sc-notoserifcjksc">进行了约</text><text x="290.83 296.96 299.73 305.85 312.68" y="422.07" font-size="11.00" class="sc-loraregular">3,300</text><text x="322.42" y="422.07" font-size="11.00" class="sc-notoserifcjksc">次尝试，其中每次尝试都是一段最多</text><text x="501.31" y="422.07" font-size="11.00" class="sc-loraregular">30</text><text x="517.16" y="422.07" font-size="11.00" class="sc-notoserifcjksc">轮的</text><text x="144.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">独立多轮攻击对话。</text><text x="243.00 250.69 253.68 259.29 265.86 272.44 278.40 281.29 290.03 296.59 303.16 308.25 311.15 317.14 319.85" y="437.69" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="328.73" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施直接拒绝了超过</text><text x="485.63" y="437.69" font-size="11.00" class="sc-loraregular">90%</text><text x="511.28" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的尝</text><text x="144.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">试，其余尝试也均未达成目标。</text><text x="144.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">取自公开披露的漏洞和勒索软件预部署任务的六个场景。在约</text><text x="443.89 447.90 450.32 455.39 462.22" y="503.60" font-size="11.00" class="sc-loraregular">1,700</text><text x="471.95" y="503.60" font-size="11.00" class="sc-notoserifcjksc">次尝试中，</text><text x="144.00 151.69 154.68 160.29 166.86 173.44 179.40 182.29 191.03 197.59 204.16 209.25 212.15 218.14 220.85" y="519.22" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="229.73" y="519.22" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施直接拒绝了约四分之一。在其余尝试中，</text><text x="504.73 512.42 515.42 521.03 527.59 534.17" y="519.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="144.00" y="534.84" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="191.44" y="534.84" font-size="11.00" class="sc-notoserifcjksc">在多轮中持续响应，并在已失陷主机上执行了普通的智能体步骤，例如</text><text x="144.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">探索环境和回答攻击者的问题，但它从未生成可用的漏洞利用。</text><a href="https://10alabs.com/" rel="noopener"><rect x="108.00" y="154.77" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="124.51" y="154.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="127.40" y="154.77" width="23.77" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="108.00" y="268.11" width="24.43" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="132.43" y="268.11" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="135.32" y="268.11" width="27.24" height="11.00" fill="transparent"/></a></svg></div>
