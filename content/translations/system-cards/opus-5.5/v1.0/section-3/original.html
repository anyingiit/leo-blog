.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在我们的内部评估套件中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15 278.14 280.85" y="154.36" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="289.73" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="355.73 361.92 367.72 372.82 377.07 383.04 392.87 395.76 403.45 409.13 413.81" y="154.36" font-size="11.00" class="sc-loraregular">System Card</text><text x="420.39" y="154.36" font-size="11.00" class="sc-notoserifcjksc">）所报告的全部网络安</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">全评估上均达到或超过</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="169.98" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85" y="169.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.74 301.43 304.42 310.03 316.60 323.17 329.14 332.03 340.76 347.33 353.90 358.99 361.88" y="169.98" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="370.77" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的表现。</text><text x="72.00" y="219.13" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="219.13" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">具备上述网络安全能力，该模型仍处于我们</text><text x="391.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="457.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="468.63 474.55 479.23 485.67 492.24 496.50 499.59 505.55" y="219.13" font-size="11.00" class="sc-loraregular">Frontier</text><text x="72.00 79.69 86.12 95.96 102.53 105.52 108.61 114.28 120.96 126.76 132.72 135.61 141.53 146.22 151.89 161.73 167.65 176.32 182.76 187.48" y="234.75" font-size="11.00" class="sc-loraregular">Compliance Framework</text><text x="193.39" y="234.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="204.39 210.34 218.03" y="234.75" font-size="11.00" class="sc-loraregular">FCF</text><text x="224.05" y="234.75" font-size="11.00" class="sc-notoserifcjksc">）所设定的较低能力类别之内，并且我们未看到该模型具备新型</text><text x="72.00" y="250.37" font-size="11.00" class="sc-notoserifcjksc">进攻能力的迹象。</text><text x="160.00 165.95 173.64" y="250.37" font-size="11.00" class="sc-loraregular">FCF</text><text x="182.56" y="250.37" font-size="11.00" class="sc-notoserifcjksc">基于两个风险等级来评估新模型带来的网络攻击风险，这些等级为模型面</text><text x="72.00" y="265.99" font-size="11.00" class="sc-notoserifcjksc">向广泛使用发布之前所开发的缓解措施提供依据：</text><text x="108.00" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="316.28" font-size="11.00" class="sc-lorabold">1</text><text x="140.25" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="151.25" y="316.28" font-size="11.00" class="sc-notoserifcjksc">，模型能够利用已知的攻击技术和方法，为实际进行中的网络行动提供有意义的</text><text x="108.00" y="331.90" font-size="11.00" class="sc-notoserifcjksc">技术协助。尽管涉及一定程度的自动化，但处于这一等级的模型仍依赖人类输入才能成功</text><text x="108.00" y="347.52" font-size="11.00" class="sc-notoserifcjksc">完成大规模网络行动。</text><text x="108.00" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="381.05" font-size="11.00" class="sc-lorabold">2</text><text x="141.65" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="152.65" y="381.05" font-size="11.00" class="sc-notoserifcjksc">，模型能够完全自主地开展网络行动，具备新型进攻能力开发和自适应持久驻留</text><text x="108.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00" y="429.62" font-size="11.00" class="sc-notoserifcjksc">所有评估均在禁用网络安全防护分类器、但启用一个用于检测逃逸尝试的新分类器的条件下运</text><text x="72.00" y="445.24" font-size="11.00" class="sc-notoserifcjksc">行。自之前的系统卡发布以来，我们用于评估运行的许多运行框架（</text><text x="402.00" y="445.24" font-size="11.00" class="sc-loraregular">harness</text><text x="441.85" y="445.24" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这些</text><text x="72.00" y="460.86" font-size="11.00" class="sc-notoserifcjksc">情况下，所有较早的模型均已重新评估，以保持各模型之间的一致性，因此所得数值与之前的系</text><text x="72.00" y="476.48" font-size="11.00" class="sc-notoserifcjksc">统卡有所不同。</text><text x="72.00" y="528.18" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39" y="528.18" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">如上所述，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="554.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="212.73" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是我们迄今发布的所有模型中网络安全能力最强的，在我们的全部</text><text x="72.00" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">内部评估上均达到或超过</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.24 283.95" y="570.35" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Mythos 5.1</text><text x="287.95" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。因此，我们在向公众部署该模型时配备了网络安全</text><text x="72.00" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">防护措施：这些措施执行与</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="585.97" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5</text><text x="283.93" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相同的政策，但其鲁棒性与我们在</text><text x="451.82 459.51 462.50 468.11 474.68 481.26 487.22 490.11 495.70 501.37 507.78 510.77 516.73 519.62" y="585.97" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Fable 5</text><text x="528.51" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Fable 5.1</text><text x="155.40" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施相当，且高于</text><text x="312.30 319.98 322.98 328.59 335.15 341.73 347.69 350.59 359.32 365.89 372.45 377.55 380.44" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5</text><text x="389.33" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施（见第</text><text x="513.22" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">3.5</text><text x="72.00" y="617.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">节）。此处所述的安全防护措施适用于全面开放的模型；如下文所述，经验证的网络安全用户将</text><text x="72.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">能够以更少的限制访问同一模型。</text><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的网络安全防护措施基于两个阶段，而本系统采用三个阶段来防止有害的网络安全用途。第</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一，探针查看</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的内部激活值，筛查所有流量，并上报其标记为与网络安全相关的所有流</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">量。第二，被上报的流量由一个在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.03 316.74" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="325.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">自身上运行的轻量级分类器打分。第三，被</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">第二个分类器识别为可能违规的流量会被传递给一个经过训练的大语言模型（</text><text x="446.00" y="129.47" font-size="11.00" class="sc-loraregular">LLM</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">这是一个独立的模型，它结合探针的判定来决定是否应拦截某段对话。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">这一方法借鉴了我们</text><text x="171.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前讨论过</text><text x="226.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">的宪法分类器（</text><text x="427.84" y="212.15" font-size="11.00" class="sc-notoserifcjksc">）。为训练我们的网络</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">安全分类器，我们收集了一个违规网络安全交互的数据集，然后对这些数据进行增强，以更准确</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">地模拟我们最为关注的特定类型越狱。随后，我们利用内部自动化红队成员生成的攻击，迭代地</text><text x="72.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">扩充分类器的数据。我们使数据侧重于运行时间较长的智能体任务，因为这类任务通常正是会助</text><text x="72.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">长大范围滥用的任务。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络用途，包括被视为两用的活动（即可能具有进攻性或防</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">御性应用的活动）。与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04" y="341.11" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="261.93" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.82 283.51 286.50 292.11 298.68 305.26 311.22 314.11 319.70 325.37 331.78 334.77 340.73 343.62 349.62 352.32" y="341.11" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="359.22" y="341.11" font-size="11.00" class="sc-notoserifcjksc">一样，我们的政策允许在源代码中进</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">行漏洞发现，以便开发者可以使用</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.03 316.74" y="356.73" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="325.63" y="356.73" font-size="11.00" class="sc-notoserifcjksc">帮助编写更安全的软件，但会拦截在已编译</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">二进制文件中进行的漏洞发现。我们在第</text><text x="272.89" y="372.35" font-size="11.00" class="sc-loraregular">3.4</text><text x="290.58" y="372.35" font-size="11.00" class="sc-notoserifcjksc">节中介绍这些分类器所执行的政策及其覆盖范围，</text><text x="72.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">并在第</text><text x="107.89" y="387.97" font-size="11.00" class="sc-loraregular">3.5</text><text x="125.61" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节中介绍它们对蓄意规避的鲁棒性。鉴于</text><text x="326.51 334.20 337.19 342.80 349.36 355.94 361.90 364.80 373.53 380.10 386.67 391.76 394.65 400.65 403.35" y="387.97" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="412.24" y="387.97" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力与</text><text x="503.13 510.82 513.82 519.43 525.99 532.57" y="387.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="403.59" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">相当，我们选择针对越狱采用</text><text x="271.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="370.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">，同时持续努力提高分类器的鲁棒</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">性并降低其误报率（见第</text><text x="195.89" y="419.21" font-size="11.00" class="sc-loraregular">3.4</text><text x="213.58" y="419.21" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">在大多数界面上，对于被我们的网络安全分类器系统拦截的请求，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 438.02 444.59 451.16 456.25 459.14 465.14 467.85" y="503.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="476.73" y="503.60" font-size="11.00" class="sc-notoserifcjksc">会回退</text><text x="72.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="519.22" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21" y="519.22" font-size="11.00" class="sc-notoserifcjksc">）到</text><text x="147.11 154.80 157.79 163.40 169.97 176.54 182.51 185.40 194.13 200.70 207.27 212.36 215.25 221.22 223.92" y="519.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="230.10" y="519.22" font-size="11.00" class="sc-notoserifcjksc">。这在我们自己的应用中会自动发生；在</text><text x="431.00 437.88 444.49" y="519.22" font-size="11.00" class="sc-loraregular">API</text><text x="451.07" y="519.22" font-size="11.00" class="sc-notoserifcjksc">上，开发者必须主</text><text x="72.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">动选择启用自动回退。</text><text x="72.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">对于网络安全用例可能被我们的网络安全防护措施拦截的用户，我们建议通过我们的</text><text x="479.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验</text><text x="72.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">证计划</text><text x="105.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="255.73" y="583.99" font-size="11.00" class="sc-notoserifcjksc">）访问网络安全拦截分类器有所减少的模型。</text><text x="475.73 483.42 486.41 492.02 498.59 505.17 511.13 514.02 522.76 529.32 535.89" y="583.99" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00" y="599.61" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="599.61" font-size="11.00" class="sc-notoserifcjksc">将在不久的将来通过该计划提供。</text><text x="72.00" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">下文报告的所有结果均是在关闭网络安全防护措施的情况下，通过</text><text x="393.89 400.78 407.39" y="652.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">API</text><text x="413.97" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">评估</text><text x="438.86 446.55 449.54 455.15 461.72 468.30 474.26 477.15 485.89 492.45 499.02 504.11 507.01 513.00 515.71" y="652.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="524.60" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">获</text><text x="72.00" y="683.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">将通过我们的网络安全验证计划获得的能力水平。</text><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="72.00 79.72 82.85 90.57 93.70 98.25 101.63 108.44 114.93 123.74 127.17 135.46 138.89 143.73 151.91 159.93 168.37 176.16" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.1 ExploitBench</text><text x="90.00" y="505.86" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="522.06" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="554.44" font-size="11.00" class="sc-loraregular">3.</text><text x="72.00" y="689.41" font-size="5.40" class="sc-loraregular">2</text><text x="77.26 82.46 87.30 92.17 94.45 96.82 101.92 104.14 106.41 108.78 113.42 118.89 124.27 126.64 132.16 136.06 141.43 149.48 151.93 156.76 161.02 163.29 165.66 172.15 174.36 176.73 179.48 184.31 189.83 194.67 199.76 202.51 204.72 207.09 212.69 217.46 222.83 225.28 230.54 233.21 236.70 242.30 247.17 252.64 257.43 262.82 265.07 267.43 273.07 275.43 280.20 284.85 290.22 294.87 300.10 302.63 305.08 307.75 311.25 316.01 318.37 320.82 325.47 330.85 336.23 341.11 345.00 347.37 352.61 357.49 362.95 367.74 373.13 381.18 385.82 389.68 394.51 396.88 399.88 405.14 409.04 411.41 416.61 421.81 430.07 432.44 437.18 441.89 447.13 452.01 455.90 460.07 464.90 469.69 475.06 478.96 481.63 485.14 489.89 492.25 496.90 501.83 506.71 512.09 515.57 519.74" y="693.21" font-size="9.00" class="sc-loraregular">Lee, S., and Brumley, D. (2026). ExploitBench: A capability ladder benchmark for LLM cybersecurity agents.</text><text x="72.00 76.64 79.98 85.82 88.35 92.90 95.15 99.98 105.18 110.77 115.68 117.89 121.17 126.05 129.32 134.23 139.24" y="704.73" font-size="9.00" class="sc-loraregular">arXiv:2605.14153.</text><text x="143.82 149.13 152.70 156.19 161.56 165.73 167.98 171.30 177.11 181.76 185.65 190.42 192.95 197.15 199.36 204.62 208.48 213.45 219.27 223.91 229.15 233.00 239.21 244.05 249.25 254.84 259.74 261.96 265.23 270.11 273.39 278.29" y="704.73" font-size="9.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 115.03 120.99 127.67 133.52" y="148.96" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="140.11" y="145.30" font-size="6.60" class="sc-loraregular">2</text><text x="146.55" y="148.96" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="325.44" y="148.96" font-size="11.00" class="sc-loraregular">AI</text><text x="338.91" y="148.96" font-size="11.00" class="sc-notoserifcjksc">模型在软件漏洞利用流水线上能推进多远</text><text x="72.00" y="164.58" font-size="11.00" class="sc-notoserifcjksc">（而不是将漏洞利用作为单一的通过</text><text x="248.00" y="164.58" font-size="11.00" class="sc-loraregular">/</text><text x="255.59" y="164.58" font-size="11.00" class="sc-notoserifcjksc">失败事件来评分）。我们最近撰文对其进行了</text><text x="475.59" y="164.58" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细的介</text><text x="72.00" y="180.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">绍</text><text x="83.00" y="180.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="213.95" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89" y="213.95" font-size="11.00" class="sc-loraregular">16</text><text x="231.15" y="213.95" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖率与崩溃复现，到沙</text><text x="72.00" y="229.57" font-size="11.00" class="sc-notoserifcjksc">箱原语、任意读</text><text x="149.00" y="229.57" font-size="11.00" class="sc-loraregular">/</text><text x="156.59" y="229.57" font-size="11.00" class="sc-notoserifcjksc">写、控制流劫持以及任意代码执行。这些标志分为五个等级，用以区分仅能触发</text><text x="72.00" y="245.19" font-size="11.00" class="sc-notoserifcjksc">崩溃的模型与能够构建武器化所需的可复用原语的模型。这提供了对进攻性网络能力的细粒度衡</text><text x="72.00" y="260.81" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00" y="327.30" font-size="11.00" class="sc-notoserifcjksc">该基准测试针对</text><text x="151.89" y="327.30" font-size="11.00" class="sc-loraregular">V8</text><text x="168.15" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎（为</text><text x="215.04 222.73 229.32 234.01 240.44 250.28" y="327.30" font-size="11.00" class="sc-loraregular">Chrome</text><text x="259.13" y="327.30" font-size="11.00" class="sc-notoserifcjksc">提供支持的</text><text x="317.03 320.96 326.51 331.95 337.63 343.87 349.72 354.48 357.57 364.14" y="327.30" font-size="11.00" class="sc-loraregular">JavaScript</text><text x="371.29" y="327.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="385.18 395.70 401.66 407.98 414.87 419.96 425.06 431.02 440.85 447.25 450.19" y="327.30" font-size="11.00" class="sc-loraregular">WebAssembly</text><text x="458.89" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎）中的</text><text x="516.79" y="327.30" font-size="11.00" class="sc-loraregular">41</text><text x="529.64" y="327.30" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="342.92" font-size="11.00" class="sc-notoserifcjksc">近期（</text><text x="105.00 110.91 117.66 123.33" y="342.92" font-size="11.00" class="sc-loraregular">2024</text><text x="132.18" y="342.92" font-size="11.00" class="sc-notoserifcjksc">年及以后）漏洞。模型会获得一个存在漏洞的</text><text x="355.07" y="342.92" font-size="11.00" class="sc-loraregular">V8</text><text x="371.33" y="342.92" font-size="11.00" class="sc-notoserifcjksc">构建版本以及一个修复这些漏洞的</text><text x="72.00" y="358.54" font-size="11.00" class="sc-notoserifcjksc">补丁，随后其任务是为该缺陷构建漏洞利用。该构建版本启用了缓解措施，包括</text><text x="459.89" y="358.54" font-size="11.00" class="sc-loraregular">V8</text><text x="476.15" y="358.54" font-size="11.00" class="sc-notoserifcjksc">堆沙箱、</text><text x="72.00" y="374.16" font-size="11.00" class="sc-loraregular">ASLR</text><text x="101.28" y="374.16" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀。每个漏洞利用等级均由确定性验证器进行机械式评分。为防范奖励破解</text><text x="72.00" y="389.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.60 102.31 107.98 112.67 119.25 122.14 128.73 134.40 140.26 146.16 149.25 155.93" y="389.78" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="162.01" y="389.78" font-size="11.00" class="sc-notoserifcjksc">），内置于</text><text x="219.91" y="389.78" font-size="11.00" class="sc-loraregular">V8</text><text x="236.16" y="389.78" font-size="11.00" class="sc-notoserifcjksc">的质询</text><text x="269.16" y="389.78" font-size="11.00" class="sc-loraregular">-</text><text x="274.54" y="389.78" font-size="11.00" class="sc-notoserifcjksc">响应函数会在多个随机化的堆布局上重放，因此硬编码</text><text x="72.00" y="405.40" font-size="11.00" class="sc-notoserifcjksc">一个泄露的地址不算作解法。我们对每个漏洞运行五次试验。</text><text x="72.00" y="473.02" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00" y="505.41" font-size="11.00" class="sc-notoserifcjksc">所有试验和环境中每次试验的平均捕获标志数；</text><text x="108.00" y="521.60" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50" y="521.60" font-size="11.00" class="sc-notoserifcjksc">，即每个环境中所捕获的可用标志百分比（基于随机选取的三次试验子集），并在</text><text x="108.00" y="537.22" font-size="11.00" class="sc-notoserifcjksc">所有环境上取平均；以及</text><text x="108.00" y="553.98" font-size="11.00" class="sc-notoserifcjksc">在普通运行和</text><text x="176.89 182.50 189.07 193.33 199.76 205.14 211.82 218.39 224.96 230.99" y="553.98" font-size="11.00" class="sc-loraregular">auto-nudge</text><text x="239.85" y="553.98" font-size="11.00" class="sc-notoserifcjksc">运行中生成的完整任意代码执行（</text><text x="404.85 411.68 419.37" y="553.98" font-size="11.00" class="sc-loraregular">ACE</text><text x="426.21" y="553.98" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00" y="602.56" font-size="11.00" class="sc-notoserifcjksc">每个环境在两个实验组下运行，预算为</text><text x="261.89" y="602.56" font-size="11.00" class="sc-loraregular">300</text><text x="284.58" y="602.56" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。在</text><text x="72.00 78.89 85.45 89.71 95.88 104.26 110.83 117.41 123.44" y="618.18" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="132.29" y="618.18" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在未达到完整代码执行的情况下于预算用尽前自行停止，运行框架会</text><text x="72.00" y="633.80" font-size="11.00" class="sc-notoserifcjksc">在同一对话中注入一条要求其继续尝试的提示词，并让其继续。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="143.82" y="695.68" width="139.48" height="11.52" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="508.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="508.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="519.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="519.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="530.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="72.00" y="171.40" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p050.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 50 页"><text x="72.00 79.72 82.85 90.57 93.70 101.20 104.58 114.63 122.19 130.04 137.84 145.86 154.29 163.10 168.09 171.52 179.81 188.00 196.02 204.46 212.25" y="627.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.2 CyScenarioBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">50</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在普通组中，</text><text x="138.00 145.69 148.68 154.29 160.86 167.44 173.40 176.29 185.02 191.59 198.16 203.25 206.15 212.14 214.85" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="223.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="237.63 244.47 250.30 256.87 259.86 266.29 269.56 273.82 280.66 286.62 293.30 299.15" y="82.61" font-size="11.00" class="sc-loraregular">ExploitBench</text><text x="308.63" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="322.53" y="82.61" font-size="11.00" class="sc-loraregular">41</text><text x="335.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="349.28" y="82.61" font-size="11.00" class="sc-loraregular">V8</text><text x="365.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">环境中平均获得</text><text x="445.43" y="82.61" font-size="11.00" class="sc-loraregular">13.99</text><text x="473.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个能力标志，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">Cap%</text><text x="104.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="118.29" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="138.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="163.11 170.00 176.57 180.82 186.99 195.38 201.94 208.52 214.55" y="98.23" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="223.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">组中，它平均获得</text><text x="314.30" y="98.23" font-size="11.00" class="sc-loraregular">14.15</text><text x="339.86" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="383.86" y="98.23" font-size="11.00" class="sc-loraregular">Cap%</text><text x="416.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="430.15" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="450.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在普通运行和</text><text x="72.00 77.61 84.18 88.43 94.87 100.25 106.93 113.49 120.07 126.10" y="113.85" font-size="11.00" class="sc-loraregular">auto-nudge</text><text x="134.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行中，</text><text x="178.95 186.64 189.63 195.24 201.81 208.39 214.35 217.24 225.98 232.55 239.11 244.21 247.10 253.09 255.80" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="264.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="278.58" y="113.85" font-size="11.00" class="sc-loraregular">73.4%</text><text x="310.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的运行中（</text><text x="365.91 372.04 378.87 382.67 389.79 395.75 399.76" y="113.85" font-size="11.00" class="sc-loraregular">301/410</text><text x="406.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）实现了完整的任意代码执</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">行。</text><text x="72.00" y="465.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40 115.88 118.24 124.43 127.24 131.96 137.52 142.88 147.73 150.09 157.01 162.42 167.99 172.35 174.72 179.58 181.67" y="465.19" font-size="9.00" class="sc-lorabold">3.3.1.A] Claude Opus 5.5</text><text x="188.90" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="200.27 205.88 210.82 216.19 219.00 224.09 227.00 230.68 236.63 241.47 247.21 251.87" y="465.19" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="259.83" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="304.83" y="465.19" font-size="9.00" class="sc-loraregular">“</text><text x="308.43" y="465.19" font-size="9.00" class="sc-notoserifcjksc">平均值</text><text x="335.43" y="465.19" font-size="9.00" class="sc-loraregular">”</text><text x="338.57" y="465.19" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="347.57 355.77 360.63 365.27" y="465.19" font-size="9.00" class="sc-loraregular">Mean</text><text x="370.74" y="465.19" font-size="9.00" class="sc-notoserifcjksc">）指每个模型在所有试验和环境中捕获的</text><text x="72.00" y="476.89" font-size="9.00" class="sc-notoserifcjksc">能力标志平均数。</text><text x="144.00" y="476.89" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="174.88" y="476.89" font-size="9.00" class="sc-notoserifcjksc">指在给定环境中，从五次试验的子集中随机选取三次试验所捕获的标志占总标志数的百分</text><text x="72.00" y="488.59" font-size="9.00" class="sc-notoserifcjksc">比，并在所有环境上取平均。</text><text x="189.00" y="488.59" font-size="9.00" class="sc-loraregular">“</text><text x="192.60" y="488.59" font-size="9.00" class="sc-notoserifcjksc">完整</text><text x="212.97 218.56 224.85 230.45" y="488.59" font-size="9.00" class="sc-loraregular">ACE”</text><text x="233.59" y="488.59" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="242.59 247.43 252.80 255.25 257.70 260.06 265.65 271.94 277.54" y="488.59" font-size="9.00" class="sc-loraregular">Full ACEs</text><text x="281.71" y="488.59" font-size="9.00" class="sc-notoserifcjksc">）是在全部</text><text x="329.08" y="488.59" font-size="9.00" class="sc-loraregular">410</text><text x="345.19" y="488.59" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通运行和</text><text x="446.55 451.14 456.52 460.00 465.26 469.67 475.13 480.50 485.88 490.82" y="488.59" font-size="9.00" class="sc-loraregular">auto-nudge</text><text x="498.06" y="488.59" font-size="9.00" class="sc-notoserifcjksc">运行）中</text><text x="72.00" y="500.29" font-size="9.00" class="sc-notoserifcjksc">实现任意代码执行的总次数。</text><text x="72.00" y="543.99" font-size="11.00" class="sc-notoserifcjksc">这些结果是在关闭所有网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00" y="559.61" font-size="11.00" class="sc-notoserifcjksc">这些结果可能无法与厂商在其部署条件下得出的公开排行榜条目直接比较。我们报告的是使用作</text><text x="72.00" y="575.23" font-size="11.00" class="sc-notoserifcjksc">者提供的静态、统一运行框架所得的结果，而非原生运行框架。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="648.26" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69" y="648.26" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="648.26" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56" y="648.26" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00" y="663.88" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动，而不是执行孤立的技术任务。大多数网络安全基准测试侧重于孤立考察单</text><text x="72.00" y="679.50" font-size="11.00" class="sc-notoserifcjksc">项能力的短程挑战，而</text><text x="184.89 192.58 198.39 204.63 210.42 216.39 223.06 228.74 233.50 236.59 242.76 249.61 255.57 262.24 268.10" y="679.50" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="277.58" y="679.50" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">行动阶段之间协调地安排攻击技术的先后顺序，包括做出分支决策、遵守约束，以及从错误和状</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">态不一致中恢复。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">该基准测试采用三级层次结构。任务级评估衡量原子能力，例如代码生成和载荷调整；路径级评</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">估涵盖与攻击树分支相对应的多步骤序列；战役级评估则是纳入不确定性和行动摩擦的完整攻击</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">模拟。场景源自对真实网络安全事件的分析，并在容器化网络环境中运行，这些环境配有真实的</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">操作系统、真实的服务配置、具有响应能力的防御监控，以及安全意识各异的模拟员工。所有场</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">景均为全新的、从零构建的（而非取自已公开的夺旗赛（</text><text x="432.88" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）演练），并且评估</text><text x="72.00" y="240.53" font-size="11.00" class="sc-notoserifcjksc">供有意义的能力提升（</text><text x="182.00 188.57 195.13 198.13 201.22 205.07" y="240.53" font-size="11.00" class="sc-loraregular">uplift</text><text x="209.32" y="240.53" font-size="11.00" class="sc-notoserifcjksc">），而不仅仅是加速专家的工作。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们运行</text><text x="118.89 126.58 132.39 138.63 144.42 150.39 157.06 162.74 167.50 170.59 176.76 183.61 189.57 196.24 202.10" y="357.88" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="211.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">评估集中一个包含</text><text x="302.47" y="357.88" font-size="11.00" class="sc-loraregular">10</text><text x="316.20" y="357.88" font-size="11.00" class="sc-notoserifcjksc">个挑战的子集：</text><text x="393.20 399.23 405.14 411.57 421.40 427.29 431.55 436.50 442.30 450.32 453.32 459.28 464.37 469.46 475.90" y="357.88" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="482.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="527.80" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77" y="373.50" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="373.50" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.85 303.13 308.94 316.96 322.81 327.57 330.67 335.76 338.85" y="373.50" font-size="11.00" class="sc-loraregular">identity_crisis</text><text x="343.94" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94 360.03 363.13 369.47 375.96 380.22 388.24 392.50 398.46 403.55" y="373.50" font-size="11.00" class="sc-loraregular">sight_test</text><text x="407.81" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81 428.64 435.21 439.47 442.56 449.16" y="373.50" font-size="11.00" class="sc-loraregular">mutiny</text><text x="454.96" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.59 85.02 91.59 98.17 101.26 107.94 111.03 119.05 125.61 130.30 136.74 140.99 147.43 153.22 159.66" y="389.12" font-size="11.00" class="sc-loraregular">houdini_protocol</text><text x="165.54" y="389.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="179.44 185.29 189.97 196.41 201.50 206.60 212.50 219.08 227.10 235.91 239.00 243.69 249.65" y="389.12" font-size="11.00" class="sc-loraregular">crossed_wires</text><text x="254.74" y="389.12" font-size="11.00" class="sc-notoserifcjksc">。我们报告每个模型在这</text><text x="378.64" y="389.12" font-size="11.00" class="sc-loraregular">10</text><text x="392.36" y="389.12" font-size="11.00" class="sc-notoserifcjksc">个挑战上取平均的总体解决</text><text x="72.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">率。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="438.83" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="438.83" font-size="11.00" class="sc-notoserifcjksc">完成了全部挑战的</text><text x="248.63 254.91 259.49 262.09 268.45" y="438.83" font-size="11.00" class="sc-loraregular">67.6%</text><text x="278.02" y="438.83" font-size="11.00" class="sc-notoserifcjksc">，是迄今已发布模型中表现最强的。相比之下，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="454.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="202.85 209.20 213.21 215.56 220.63" y="454.45" font-size="11.00" class="sc-loraregular">61.7%</text><text x="233.10" y="454.45" font-size="11.00" class="sc-notoserifcjksc">的任务，</text><text x="277.10 284.78 287.78 293.39 299.95 306.53 312.49 315.39 324.12 330.69 337.25 342.35 345.24" y="454.45" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="354.13" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="390.02 396.02 402.14 404.68 411.52" y="454.45" font-size="11.00" class="sc-loraregular">53.0%</text><text x="421.09" y="454.45" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="432.09 439.77 442.77 448.38 454.94 461.52 467.48 470.38 476.61 483.05 489.73 496.40 502.29 506.54 509.44" y="454.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="518.33" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成</text><text x="72.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">的任务不到</text><text x="129.89" y="470.07" font-size="11.00" class="sc-loraregular">1%</text><text x="143.47" y="470.07" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 105.91 108.01 113.54 117.02 119.39 125.58 128.39 133.10 138.66 144.03 148.87 151.24 158.16 163.57 169.13 173.49 175.86 180.72 182.82" y="390.43" font-size="9.00" class="sc-lorabold">3.3.2.A] Claude Opus 5.5</text><text x="190.04" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="201.41 207.60 212.56 217.94 222.61 227.45 233.19 237.91 242.23 245.17 250.04 255.99 260.83 266.57 271.23" y="390.43" font-size="9.00" class="sc-lorabold">CyScenarioBench</text><text x="279.19" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">上的表现优于所有其他模型。</text><text x="396.19" y="390.43" font-size="9.00" class="sc-notoserifcjksc">柱形表示每个模型在我们子集中</text><text x="524.56" y="390.43" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个挑战上取平均的总体解决率。本评估在关闭我们的网络安全缓解措施的情况下运行。</text><text x="72.00" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3 Binary Exploitation Benchmark</text><text x="308.25" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原名</text><text x="350.34" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="412.00" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="475.16" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现，以及模型能将发现的缺陷向可用的概念验证（</text><text x="446.00 452.57 457.25 463.69 470.07 473.68 479.05 485.43 489.04" y="475.16" font-size="11.00" class="sc-loraregular">proof-of-</text><text x="72.00 77.80 84.23 90.91 96.71 102.67 109.24" y="490.78" font-size="11.00" class="sc-loraregular">concept</text><text x="113.49" y="490.78" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用推进多远。每个任务是</text><text x="281.39 289.76 296.19 302.63 308.97 311.97 317.93 320.82 329.55 335.79 342.03 347.41 353.33 359.89 365.45" y="490.78" font-size="11.00" class="sc-loraregular">Google OSS-Fuzz</text><text x="373.97" y="490.78" font-size="11.00" class="sc-notoserifcjksc">语料库中某个开源项目的一个模糊</text><text x="72.00" y="506.40" font-size="11.00" class="sc-notoserifcjksc">测试驱动程序（</text><text x="149.00 152.72 159.29 164.84 170.45 173.34 179.93 185.61 190.37 197.05 203.01 208.10" y="506.40" font-size="11.00" class="sc-loraregular">fuzz harness</text><text x="213.22" y="506.40" font-size="11.00" class="sc-notoserifcjksc">）入口点，该项目构建于一个已完全修补的时间点快照，不含已知</text><text x="72.00" y="522.02" font-size="11.00" class="sc-notoserifcjksc">漏洞，也不提供任何提示。这</text><text x="217.89" y="522.02" font-size="11.00" class="sc-loraregular">831</text><text x="237.10" y="522.02" font-size="11.00" class="sc-notoserifcjksc">个入口点涵盖</text><text x="305.99" y="522.02" font-size="11.00" class="sc-loraregular">228</text><text x="326.88" y="522.02" font-size="11.00" class="sc-notoserifcjksc">个项目。每次试验按一个五级阶梯评分，从</text><text x="72.00" y="537.64" font-size="11.00" class="sc-notoserifcjksc">内存安全崩溃（</text><text x="149.00 155.65 158.36" y="537.64" font-size="11.00" class="sc-loraregular">0.2</text><text x="164.27" y="537.64" font-size="11.00" class="sc-notoserifcjksc">）到控制流劫持（</text><text x="252.27 256.27 258.81" y="537.64" font-size="11.00" class="sc-loraregular">1.0</text><text x="265.64" y="537.64" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="588.50" font-size="11.00" class="sc-notoserifcjksc">我们最近彻底重写了该评估的运行框架，以加强评估过程中的安全防护和监控，并用新的运行框</text><text x="72.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc">架重新运行了所有较早的模型。在此过程中，我们发现并修复了若干缺陷，并调整了参数，使得</text><text x="72.00" y="619.74" font-size="11.00" class="sc-notoserifcjksc">新运行框架产生的成功结果显著多于此前的运行框架。因此，此处给出的数值不能与之前的系统</text><text x="72.00" y="635.36" font-size="11.00" class="sc-notoserifcjksc">卡进行比较。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="685.65" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="193.63" y="685.65" font-size="11.00" class="sc-loraregular">106</text><text x="213.71" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流劫持。相比之下，</text><text x="345.71 353.40 356.39 362.00 368.57 375.15 381.11 384.00 393.94 399.80 404.06 410.65 417.08 422.17 425.07 431.06 433.77" y="685.65" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="440.67" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="476.56" y="685.65" font-size="11.00" class="sc-loraregular">81</text><text x="489.64" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流</text><text x="72.00" y="701.27" font-size="11.00" class="sc-notoserifcjksc">劫持，</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 152.02 158.59 165.16 170.25 173.15" y="701.27" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="182.03" y="701.27" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="217.93" y="701.27" font-size="11.00" class="sc-loraregular">66</text><text x="233.54" y="701.27" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="255.54 263.22 266.22 271.83 278.39 284.97 290.93 293.83 300.06 306.50 313.18 319.85 325.74 329.99 332.89" y="701.27" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="72.00 79.72 82.85 90.57 93.70 102.11 105.49 112.30 118.79 127.60 131.03 139.32 142.75 147.58 157.63 165.19" y="464.81" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.4 ExploitGym</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular">3</text><text x="116.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次。与</text><text x="152.81 160.49 163.49 169.10 175.66 182.24 188.20 191.10 199.83 206.40 212.96 218.06 220.95" y="82.61" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="229.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.73 251.42 254.41 260.02 266.59 273.17 279.13 282.02 291.96 297.82 302.08 308.67 315.10 320.19 323.09 329.08 331.79" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="338.68" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相比，漏洞识别能力有所提升。</text><text x="72.00" y="424.87" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="424.87" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79 117.26 119.63 125.82 128.63 133.34 138.91 144.27 149.11 151.48 158.40 163.81 169.37 173.74 176.10 180.96 183.06" y="424.87" font-size="9.00" class="sc-lorabold">3.3.3.A] Claude Opus 5.5</text><text x="190.29" y="424.87" font-size="9.00" class="sc-notoserifcjkscbold">优于所有其他模型</text><text x="262.29" y="424.87" font-size="9.00" class="sc-notoserifcjksc">，体现在</text><text x="300.65 306.18 308.71 314.17 318.82 322.87 327.62 329.98 335.58 340.35 345.73 348.17 353.44 356.11 359.59 364.18 367.66 370.19 375.45 380.92 383.28 388.88 393.76 399.22 404.01 409.40 417.45 422.09 425.95" y="424.87" font-size="9.00" class="sc-loraregular">Binary Exploitation Benchmark</text><text x="430.78" y="424.87" font-size="9.00" class="sc-notoserifcjksc">（原名</text><text x="460.15 467.30 472.40 477.50 481.90 486.75 492.12 496.66" y="424.87" font-size="9.00" class="sc-loraregular">OSS-Fuzz</text><text x="501.27" y="424.87" font-size="9.00" class="sc-notoserifcjksc">）的漏洞</text><text x="72.00" y="436.57" font-size="9.00" class="sc-notoserifcjksc">利用与漏洞识别上。</text><text x="72.00 78.84 84.67 91.24 94.23 100.67 103.93 108.19 116.56 122.37" y="488.89" font-size="11.00" class="sc-loraregular">ExploitGym</text><text x="135.10" y="488.89" font-size="11.00" class="sc-notoserifcjksc">是一项大规模公开基准测试，由</text><text x="291.99 300.20 307.88 310.78 317.62 323.58 328.30 334.13 340.09 343.08 348.99" y="488.89" font-size="11.00" class="sc-loraregular">UC Berkeley</text><text x="357.69" y="488.89" font-size="11.00" class="sc-notoserifcjksc">的研究人员与</text><text x="426.59 436.68 442.36 448.19 451.08 457.68 460.67 466.35 473.03 478.88 484.79 487.68 491.28 497.95 503.05 507.30 510.57 514.83 521.39 525.65" y="488.89" font-size="11.00" class="sc-loraregular">Max Planck Institute</text><text x="72.00 75.66 82.10 86.86 89.75 95.99 101.90 107.75 114.32 119.08 122.35 126.63 132.43 135.33 141.00 147.68 154.26 157.15 163.82 168.58 171.67 177.12 182.79 188.59" y="504.51" font-size="11.00" class="sc-loraregular">for Security and Privacy</text><text x="194.40" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="205.40 213.60 221.29 224.18 230.42 236.10 242.68 246.93 252.61 255.50 262.34 268.02 272.74 279.14 284.82 289.50" y="504.51" font-size="11.00" class="sc-loraregular">UC Santa Barbara</text><text x="295.18" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="306.18 313.07 317.83 320.92 326.45 332.89 339.56 345.24 348.13 354.33 358.58 364.18 368.44 374.40 377.29 385.57 392.24 395.33 400.83 406.80 411.56 416.65 419.92 424.20" y="504.51" font-size="11.00" class="sc-loraregular">Arizona State University</text><text x="430.02" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="441.02 447.90 454.48 458.74 465.33 470.01 476.45 483.01 486.11" y="504.51" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="491.96" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="520.13" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="113.40" y="520.13" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="127.30 135.67 142.10 148.54 154.89 157.88" y="520.13" font-size="11.00" class="sc-loraregular">Google</text><text x="166.73" y="520.13" font-size="11.00" class="sc-notoserifcjksc">的合作者共同开发。该基准测试衡量</text><text x="345.62" y="520.13" font-size="11.00" class="sc-loraregular">AI</text><text x="359.09" y="520.13" font-size="11.00" class="sc-notoserifcjksc">智能体能否将已知漏洞转化为可用的</text><text x="72.00" y="535.75" font-size="11.00" class="sc-notoserifcjksc">漏洞利用。</text><text x="127.00 133.84 139.67 146.24 149.23 155.67 158.93 163.19 171.56 177.37" y="535.75" font-size="11.00" class="sc-loraregular">ExploitGym</text><text x="190.10" y="535.75" font-size="11.00" class="sc-notoserifcjksc">主要关注将崩溃转化为未授权代码执行，其涵盖的应用范围比</text><text x="72.00 79.69 85.44 91.84 97.81 102.57 110.94 116.75" y="551.37" font-size="11.00" class="sc-loraregular">CyberGym</text><text x="129.48" y="551.37" font-size="11.00" class="sc-notoserifcjksc">更广；</text><text x="162.48 170.16 175.92 182.32 188.28 193.04 201.42 207.22" y="551.37" font-size="11.00" class="sc-loraregular">CyberGym</text><text x="219.95" y="551.37" font-size="11.00" class="sc-notoserifcjksc">测试的是模型能否复现已知漏洞。由于</text><text x="409.84 417.53 423.29 429.69 435.65 440.41 448.78 454.59" y="551.37" font-size="11.00" class="sc-loraregular">CyberGym</text><text x="467.32" y="551.37" font-size="11.00" class="sc-notoserifcjksc">已饱和，我们</text><text x="72.00" y="566.99" font-size="11.00" class="sc-notoserifcjksc">已将其从本系统卡中移除。</text><text x="72.00" y="634.62" font-size="11.00" class="sc-notoserifcjksc">该基准测试包含</text><text x="151.89" y="634.62" font-size="11.00" class="sc-loraregular">869</text><text x="173.68" y="634.62" font-size="11.00" class="sc-notoserifcjksc">个真实世界漏洞实例，分布于三个领域：</text><text x="371.68 377.68 384.43" y="634.62" font-size="11.00" class="sc-loraregular">502</text><text x="393.23" y="634.62" font-size="11.00" class="sc-notoserifcjksc">个用户空间目标，取自开源项</text><text x="72.00" y="650.24" font-size="11.00" class="sc-notoserifcjksc">目（</text><text x="94.00 102.73 108.97 115.21 120.59 126.51 133.07 138.63" y="650.24" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="147.15" y="650.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="161.04 167.93 174.78 181.80" y="650.24" font-size="11.00" class="sc-loraregular">ARVO</text><text x="190.54" y="650.24" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="226.43 234.12 241.30 247.90 255.49 264.22 270.46" y="650.24" font-size="11.00" class="sc-loraregular">CVE/OSV</text><text x="280.54" y="650.24" font-size="11.00" class="sc-notoserifcjksc">记录；</text><text x="313.54" y="650.24" font-size="11.00" class="sc-loraregular">181</text><text x="330.62" y="650.24" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="344.51 352.20 358.79 363.48 369.91 379.75 385.71 388.60 395.79 401.97 404.86 408.80 414.34 419.79 425.46 431.70 437.55 442.32 445.41 451.97" y="650.24" font-size="11.00" class="sc-loraregular">Chrome V8 JavaScript</text><text x="459.12" y="650.24" font-size="11.00" class="sc-notoserifcjksc">引擎中的目标，</text><text x="72.00" y="665.86" font-size="11.00" class="sc-notoserifcjksc">来源于</text><text x="107.89 115.58 118.57 125.14 130.23 134.49 140.45 144.99 150.90 157.47 163.02" y="665.86" font-size="11.00" class="sc-loraregular">ClusterFuzz</text><text x="171.55" y="665.86" font-size="11.00" class="sc-notoserifcjksc">报告、</text><text x="204.55 212.24 218.83 223.51 229.95 239.78 242.87 249.44 259.27 262.17 265.26 270.35 275.45 282.01" y="665.86" font-size="11.00" class="sc-loraregular">Chromium issue</text><text x="290.87" y="665.86" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="315.76" y="665.86" font-size="11.00" class="sc-loraregular">V8</text><text x="332.02" y="665.86" font-size="11.00" class="sc-notoserifcjksc">沙箱突破报告；以及</text><text x="433.91" y="665.86" font-size="11.00" class="sc-loraregular">186</text><text x="453.35" y="665.86" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="467.24" y="665.86" font-size="11.00" class="sc-loraregular">Linux</text><text x="498.66" y="665.86" font-size="11.00" class="sc-notoserifcjksc">内核目</text><text x="72.00" y="681.48" font-size="11.00" class="sc-notoserifcjksc">标，来自</text><text x="118.89 124.72 130.68 135.45 142.12 148.09 150.96 158.65 165.69" y="681.48" font-size="11.00" class="sc-loraregular">kernelCTF</text><text x="174.61" y="681.48" font-size="11.00" class="sc-notoserifcjksc">提交和</text><text x="210.50 215.59 221.40 227.01 233.41 239.85" y="681.48" font-size="11.00" class="sc-loraregular">syzbot</text><text x="247.01" y="681.48" font-size="11.00" class="sc-notoserifcjksc">报告。对于每个实例，智能体会获得存在漏洞的源代码和构</text><text x="72.00" y="697.10" font-size="11.00" class="sc-notoserifcjksc">建配置、一个漏洞证明（</text><text x="193.00 199.57 204.25 210.69 217.07 220.68 226.06 232.44 236.04 241.42 246.98 253.54 256.54 263.21 269.18 273.86 279.54 285.94 289.03 292.02 295.29 299.57" y="697.10" font-size="11.00" class="sc-loraregular">proof-of-vulnerability</text><text x="305.38" y="697.10" font-size="11.00" class="sc-notoserifcjksc">）输入</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（可触发该缺陷），以及一个用于与目标交互的容器化运行环境。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">任务是开发一个漏洞利用，实现未授权代码执行，并读取一个存放在智能体授权范围之外、动态</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">生成的秘密标志。由于智能体有时会通过不同于所提供缺陷的另一处缺陷实现代码执行，成功的</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">标志捕获还会额外经过一项</text><text x="204.00" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="162.43" font-size="11.00" class="sc-notoserifcjksc">智能体即评判者</text><text x="285.40" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="289.24" y="162.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="300.24 305.92 311.94 317.91 324.48 328.74 334.12 339.80 344.89 350.27 355.94 361.32 364.19 370.76 377.34 383.37" y="162.43" font-size="11.00" class="sc-loraregular">agent-as-a-judge</text><text x="389.33" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）检查（该检查已对照经专家</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">审核的轨迹进行验证），以确认确实利用了预期的漏洞。每个实例都可以在启用标准缓解措施</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="193.67" font-size="11.00" class="sc-loraregular">ASLR</text><text x="109.39" y="193.67" font-size="11.00" class="sc-notoserifcjksc">、栈金丝雀、</text><text x="175.39" y="193.67" font-size="11.00" class="sc-loraregular">V8</text><text x="191.65" y="193.67" font-size="11.00" class="sc-notoserifcjksc">堆沙箱和</text><text x="238.54" y="193.67" font-size="11.00" class="sc-loraregular">KASLR</text><text x="272.44" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）或禁用这些措施的情况下运行。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们目前在禁用所有缓解措施的情况下评估所有任务。</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 383.02 389.59 396.16 401.25 404.14 410.14 412.85" y="260.72" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="421.73" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="435.63" y="260.72" font-size="11.00" class="sc-loraregular">2</text><text x="444.43" y="260.72" font-size="11.00" class="sc-notoserifcjksc">小时和</text><text x="480.32" y="260.72" font-size="11.00" class="sc-loraregular">6</text><text x="489.57" y="260.72" font-size="11.00" class="sc-notoserifcjksc">小时内分</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">别借助预期漏洞成功攻破了</text><text x="206.89" y="276.34" font-size="11.00" class="sc-loraregular">869</text><text x="228.68" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个案例中的</text><text x="286.58 292.48 298.59" y="276.34" font-size="11.00" class="sc-loraregular">289</text><text x="307.84" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个和</text><text x="332.73" y="276.34" font-size="11.00" class="sc-loraregular">300</text><text x="355.42" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个。相比之下，</text><text x="432.42 440.10 443.10 448.71 455.27 461.85 467.81 470.71 480.64 486.50 490.76 497.35 503.78 508.88 511.77 517.76 520.47" y="276.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="527.37" y="276.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="291.96" font-size="11.00" class="sc-loraregular">2</text><text x="80.80" y="291.96" font-size="11.00" class="sc-notoserifcjksc">小时内成功利用了</text><text x="171.69" y="291.96" font-size="11.00" class="sc-loraregular">203</text><text x="193.45" y="291.96" font-size="11.00" class="sc-notoserifcjksc">个案例，在</text><text x="251.34" y="291.96" font-size="11.00" class="sc-loraregular">6</text><text x="260.60" y="291.96" font-size="11.00" class="sc-notoserifcjksc">小时内成功利用了</text><text x="351.49" y="291.96" font-size="11.00" class="sc-loraregular">264</text><text x="372.61" y="291.96" font-size="11.00" class="sc-notoserifcjksc">个，这意味着</text><text x="441.50" y="291.96" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="488.94" y="291.96" font-size="11.00" class="sc-notoserifcjksc">在两种时</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">间预算下均已超越</text><text x="162.89 172.83 178.69 182.95 189.54 195.97 201.06 203.96 209.95 212.66" y="307.58" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="216.66" y="307.58" font-size="11.00" class="sc-notoserifcjksc">。有趣的是，我们观察到</text><text x="340.55" y="307.58" font-size="11.00" class="sc-loraregular">2</text><text x="349.35" y="307.58" font-size="11.00" class="sc-notoserifcjksc">小时与</text><text x="385.25" y="307.58" font-size="11.00" class="sc-loraregular">6</text><text x="394.50" y="307.58" font-size="11.00" class="sc-notoserifcjksc">小时之间的差距显著缩小，从</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="323.20" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.55" y="323.20" font-size="11.00" class="sc-loraregular">61</text><text x="155.81" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个案例缩小到</text><text x="224.70" y="323.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="272.15" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的仅</text><text x="297.04" y="323.20" font-size="11.00" class="sc-loraregular">11</text><text x="307.94" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个，这表明</text><text x="365.83" y="323.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="413.28" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的大部分成功漏洞利用都</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">是在前</text><text x="107.89" y="338.82" font-size="11.00" class="sc-loraregular">2</text><text x="116.69" y="338.82" font-size="11.00" class="sc-notoserifcjksc">小时内达成的。</text><text x="72.00" y="603.38" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.04 108.14 113.67" y="603.38" font-size="9.00" class="sc-lorabold">3.3.4.A]</text><text x="119.51" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.88 136.49 141.43 146.80 149.61 154.70 157.61 161.28 168.00 172.96" y="603.38" font-size="9.00" class="sc-lorabold">ExploitGym</text><text x="183.61" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">上，</text><text x="201.61" y="603.38" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="272.27" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">相比</text><text x="292.64" y="603.38" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="356.34" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="367.70 373.90 376.70 381.42 386.98 392.35 397.19 399.56 408.00 412.96 416.67 422.26 427.36 431.72 434.09 438.95 441.05" y="603.38" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="447.07" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">有大幅提升</text><text x="492.07" y="603.38" font-size="9.00" class="sc-notoserifcjksc">。柱形表示</text><text x="72.00" y="615.08" font-size="9.00" class="sc-notoserifcjksc">在两小时和六小时实际耗时预算下，利用给定漏洞的成功漏洞利用数量。成功要求捕获一个动态生成的秘密标志，且每</text><text x="72.00" y="626.78" font-size="9.00" class="sc-notoserifcjksc">个成功的漏洞利用都会经智能体评判者验证，以确认其利用的是预期漏洞。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">3.4</text><text x="96.61" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施覆盖范围</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="110.76" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施旨在拦截与</text><text x="292.63 300.32 303.31 308.92 315.48 322.06 328.02 330.92 336.51 342.18 348.58 351.58 357.54 360.43" y="110.76" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="369.32" y="110.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.21 390.90 393.89 399.50 406.07 412.65 418.61 421.50 427.09 432.77 439.17 442.16 448.12 451.02 457.01 459.72" y="110.76" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="466.61" y="110.76" font-size="11.00" class="sc-notoserifcjksc">相同的违规交</text><text x="72.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">互。不过，与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04" y="126.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="217.93" y="126.38" font-size="11.00" class="sc-notoserifcjksc">之后发布的</text><text x="275.82 283.51 286.50 292.11 298.68 305.26" y="126.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="314.11" y="126.38" font-size="11.00" class="sc-notoserifcjksc">版本类似，</text><text x="369.11 376.80 379.79 385.40 391.97 398.55 404.51 407.40 416.14 422.70 429.27 434.36 437.25 443.25 445.96" y="126.38" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="454.84" y="126.38" font-size="11.00" class="sc-notoserifcjksc">将在所有访问级</text><text x="72.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">别（包括全面开放）下允许在源代码中进行漏洞发现，同时继续拦截在已编译二进制文件中进行</text><text x="72.00" y="157.62" font-size="11.00" class="sc-notoserifcjksc">的漏洞发现。</text><text x="72.00" y="207.91" font-size="11.00" class="sc-notoserifcjksc">我们拦截在已编译二进制文件中进行的漏洞发现，是因为它更常作为一种进攻性技术。因此，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="223.53" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="223.53" font-size="11.00" class="sc-notoserifcjksc">的安全过滤器会标记并拦截此类请求，尽管在某些情况下，用户可能出于无害或非恶意的</text><text x="72.00" y="239.15" font-size="11.00" class="sc-notoserifcjksc">原因想要在二进制文件中查找漏洞。</text><text x="72.00" y="288.87" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="288.87" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力有所增强，我们采用了</text><text x="369.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="468.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">，正如我们对</text><text x="72.00 77.59 83.26 89.67 92.66" y="304.49" font-size="11.00" class="sc-loraregular">Fable</text><text x="101.51" y="304.49" font-size="11.00" class="sc-notoserifcjksc">系列模型所做的那样，同时继续努力提高分类器的鲁棒性并降低其误报率。</text><text x="72.00" y="351.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.1</text><text x="102.94" y="351.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖范围</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="379.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="379.88" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截潜在危害不对称的网络活动（即所使用的特定技能对攻</text><text x="72.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">击者的帮助大于对防御者的帮助）。正如我们</text><text x="292.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前所述</text><text x="336.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">，这一类别既涵盖禁止使用等级，也在全</text><text x="72.00" y="411.12" font-size="11.00" class="sc-notoserifcjksc">面开放级别下涵盖高风险两用等级。</text><text x="72.00" y="460.83" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现这些类别的分类器覆盖结果。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 104.65 106.75 112.28 115.76 118.12 124.32 127.12 131.84 137.40 142.77 147.61 149.98 156.90 162.31 167.87 172.23 174.60 179.46 181.56" y="367.93" font-size="9.00" class="sc-lorabold">3.4.1.A] Claude Opus 5.5</text><text x="188.78" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">的分类器与此前模型相当。</text><text x="296.78" y="367.93" font-size="9.00" class="sc-notoserifcjksc">总体召回率是指在所有类别中被标记的有害示例所占比例。每</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">个模型均以其自身部署的安全防护系统进行评分。</text><text x="72.00" y="424.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.2</text><text x="105.70" y="424.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">漏洞挖掘评估</text><text x="72.00" y="452.66" font-size="11.00" class="sc-notoserifcjksc">漏洞挖掘是网络安全中的一项基础技术。我们的目标是为防御者而非攻击者提供优势。因此，我</text><text x="72.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">们将漏洞挖掘评估分为</text><text x="182.00" y="468.28" font-size="11.00" class="sc-notoserifcjkscbold">基于二进制文件的漏洞挖掘</text><text x="314.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">（偏向于无法访问源代码的攻击者的恶意使</text><text x="72.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">用）和</text><text x="105.00" y="483.90" font-size="11.00" class="sc-notoserifcjkscbold">基于源代码的漏洞挖掘</text><text x="215.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">（偏向于防御者）。</text><text x="72.00" y="549.81" font-size="11.00" class="sc-notoserifcjksc">依照我们的使用政策（</text><text x="182.00 190.20 195.29 200.96 206.99 212.95 215.85 222.40 228.84 231.83 234.92 240.72" y="549.81" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="246.53" y="549.81" font-size="11.00" class="sc-notoserifcjksc">），我们从监控用的线性探针（</text><text x="400.53 403.52 406.61 413.29 419.23 424.90 429.67 432.56 439.12 443.81 450.25 456.65" y="549.81" font-size="11.00" class="sc-loraregular">linear probe</text><text x="462.61" y="549.81" font-size="11.00" class="sc-notoserifcjksc">）中抽取了混合</text><text x="72.00" y="565.43" font-size="11.00" class="sc-notoserifcjksc">的漏洞发现流量样本，并使用大语言模型对其进行评分（采用一种保护用户隐私的聚合方法）。</text><text x="72.00" y="581.05" font-size="11.00" class="sc-notoserifcjksc">我们的结果如下：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="72.00" y="287.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="287.96" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 105.79 107.89 113.43 116.90 119.27 125.46 128.27 132.98 138.55 143.91 148.75 151.12 158.04 163.45 169.01 173.38 175.74 180.60 182.70" y="287.96" font-size="9.00" class="sc-lorabold">3.4.2.A] Claude Opus 5.5</text><text x="189.93" y="287.96" font-size="9.00" class="sc-notoserifcjkscbold">降低了防御性漏洞发现的拦截率</text><text x="315.93" y="287.96" font-size="9.00" class="sc-notoserifcjksc">，相较于此前的</text><text x="381.29" y="287.96" font-size="9.00" class="sc-loraregular">Opus</text><text x="405.72" y="287.96" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="417.09 421.66 426.30 431.54 433.99" y="287.96" font-size="9.00" class="sc-loraregular">Fable</text><text x="441.23" y="287.96" font-size="9.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="334.61" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37" y="334.61" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施鲁棒性测试</text><text x="72.00" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="361.17" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="361.17" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（即</text><text x="366.24" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="370.64" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="392.64" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="396.48" y="
