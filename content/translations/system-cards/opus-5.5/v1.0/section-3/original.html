.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39 101.39 117.39 133.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00 80.39 84.03" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43 106.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在我们的内部评估套件中，</text><text x="204.00 211.69 214.68 220.29 226.86 233.44 239.40 242.29 251.03 257.59 264.16 269.25 272.15 278.14 280.85" y="154.36" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="289.73 300.73 311.73 322.73 333.73 344.73" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="355.73 361.92 367.72 372.82 377.07 383.04 392.87 395.76 403.45 409.13 413.81" y="154.36" font-size="11.00" class="sc-loraregular">System Card</text><text x="420.39 431.39 442.39 453.39 464.39 475.39 486.39 497.39 508.39 519.39" y="154.36" font-size="11.00" class="sc-notoserifcjksc">）所报告的全部网络安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">全评估上均达到或超过</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="169.98" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85" y="169.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.74 301.43 304.42 310.03 316.60 323.17 329.14 332.03 340.76 347.33 353.90 358.99 361.88" y="169.98" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="370.77 381.77 392.77 403.77" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的表现。</text><text x="72.00 83.00" y="219.13" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="219.13" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63 193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">具备上述网络安全能力，该模型仍处于我们</text><text x="391.63 402.63 413.63 424.63 435.63 446.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="457.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="468.63 474.55 479.23 485.67 492.24 496.50 499.59 505.55" y="219.13" font-size="11.00" class="sc-loraregular">Frontier</text><text x="72.00 79.69 86.12 95.96 102.53 105.52 108.61 114.28 120.96 126.76 132.72 135.61 141.53 146.22 151.89 161.73 167.65 176.32 182.76 187.48" y="234.75" font-size="11.00" class="sc-loraregular">Compliance Framework</text><text x="193.39" y="234.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="204.39 210.34 218.03" y="234.75" font-size="11.00" class="sc-loraregular">FCF</text><text x="224.05 235.05 246.05 257.05 268.05 279.05 290.05 301.05 312.05 323.05 334.05 345.05 356.05 367.05 378.05 389.05 400.05 411.05 422.05 433.05 444.05 455.05 466.05 477.05 488.05 499.05 510.05 521.05" y="234.75" font-size="11.00" class="sc-notoserifcjksc">）所设定的较低能力类别之内，并且我们未看到该模型具备新型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="250.37" font-size="11.00" class="sc-notoserifcjksc">进攻能力的迹象。</text><text x="160.00 165.95 173.64" y="250.37" font-size="11.00" class="sc-loraregular">FCF</text><text x="182.56 193.56 204.56 215.56 226.56 237.56 248.56 259.56 270.56 281.56 292.56 303.56 314.56 325.56 336.56 347.56 358.56 369.56 380.56 391.56 402.56 413.56 424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="250.37" font-size="11.00" class="sc-notoserifcjksc">基于两个风险等级来评估新模型带来的网络攻击风险，这些等级为模型面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="265.99" font-size="11.00" class="sc-notoserifcjksc">向广泛使用发布之前所开发的缓解措施提供依据：</text><text x="108.00 119.00" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="316.28" font-size="11.00" class="sc-lorabold">1</text><text x="140.25" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="151.25 162.25 173.25 184.25 195.25 206.25 217.25 228.25 239.25 250.25 261.25 272.25 283.25 294.25 305.25 316.25 327.25 338.25 349.25 360.25 371.25 382.25 393.25 404.25 415.25 426.25 437.25 448.25 459.25 470.25 481.25 492.25 503.25 514.25 525.25" y="316.28" font-size="11.00" class="sc-notoserifcjksc">，模型能够利用已知的攻击技术和方法，为实际进行中的网络行动提供有意义的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="331.90" font-size="11.00" class="sc-notoserifcjksc">技术协助。尽管涉及一定程度的自动化，但处于这一等级的模型仍依赖人类输入才能成功</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="347.52" font-size="11.00" class="sc-notoserifcjksc">完成大规模网络行动。</text><text x="108.00 119.00" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="381.05" font-size="11.00" class="sc-lorabold">2</text><text x="141.65" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="152.65 163.65 174.65 185.65 196.65 207.65 218.65 229.65 240.65 251.65 262.65 273.65 284.65 295.65 306.65 317.65 328.65 339.65 350.65 361.65 372.65 383.65 394.65 405.65 416.65 427.65 438.65 449.65 460.65 471.65 482.65 493.65 504.65 515.65 526.65" y="381.05" font-size="11.00" class="sc-notoserifcjksc">，模型能够完全自主地开展网络行动，具备新型进攻能力开发和自适应持久驻留</text><text x="108.00 119.00 130.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="429.62" font-size="11.00" class="sc-notoserifcjksc">所有评估均在禁用网络安全防护分类器、但启用一个用于检测逃逸尝试的新分类器的条件下运</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="445.24" font-size="11.00" class="sc-notoserifcjksc">行。自之前的系统卡发布以来，我们用于评估运行的许多运行框架（</text><text x="402.00 408.59 414.26 419.03 425.70 431.67 436.76" y="445.24" font-size="11.00" class="sc-loraregular">harness</text><text x="441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="445.24" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="460.86" font-size="11.00" class="sc-notoserifcjksc">情况下，所有较早的模型均已重新评估，以保持各模型之间的一致性，因此所得数值与之前的系</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="476.48" font-size="11.00" class="sc-notoserifcjksc">统卡有所不同。</text><text x="72.00 80.39 84.03" y="528.18" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39 109.39 123.39 137.39" y="528.18" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00 83.00 94.00 105.00 116.00" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">如上所述，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 174.02 180.59 187.16 192.25 195.15 201.14 203.85" y="554.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是我们迄今发布的所有模型中网络安全能力最强的，在我们的全部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">内部评估上均达到或超过</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 244.12 249.98 254.24 260.83 267.26 272.35 275.25 281.24 283.95" y="570.35" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Mythos 5.1</text><text x="287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。因此，我们在向公众部署该模型时配备了网络安全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">防护措施：这些措施执行与</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04" y="585.97" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5</text><text x="283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相同的政策，但其鲁棒性与我们在</text><text x="451.82 459.51 462.50 468.11 474.68 481.26 487.22 490.11 495.70 501.37 507.78 510.77 516.73 519.62" y="585.97" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Fable 5</text><text x="528.51" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Fable 5.1</text><text x="155.40 166.40 177.40 188.40 199.40 210.40 221.40 232.40 243.40 254.40 265.40 276.40 287.40 298.40" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施相当，且高于</text><text x="312.30 319.98 322.98 328.59 335.15 341.73 347.69 350.59 359.32 365.89 372.45 377.55 380.44" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5</text><text x="389.33 400.33 411.33 422.33 433.33 444.33 455.33 466.33 477.33 488.33 499.33" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施（见第</text><text x="513.22 519.35 522.05" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">3.5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="617.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">节）。此处所述的安全防护措施适用于全面开放的模型；如下文所述，经验证的网络安全用户将</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">能够以更少的限制访问同一模型。</text><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的网络安全防护措施基于两个阶段，而本系统采用三个阶段来防止有害的网络安全用途。第</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一，探针查看</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的内部激活值，筛查所有流量，并上报其标记为与网络安全相关的所有流</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">量。第二，被上报的流量由一个在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.03 316.74" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">自身上运行的轻量级分类器打分。第三，被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">第二个分类器识别为可能违规的流量会被传递给一个经过训练的大语言模型（</text><text x="446.00 452.36 458.72" y="129.47" font-size="11.00" class="sc-loraregular">LLM</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">这是一个独立的模型，它结合探针的判定来决定是否应拦截某段对话。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">这一方法借鉴了我们</text><text x="171.00 182.00 193.00 204.00 215.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前讨论过</text><text x="226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">的宪法分类器（</text><text x="427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="212.15" font-size="11.00" class="sc-notoserifcjksc">）。为训练我们的网络</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">安全分类器，我们收集了一个违规网络安全交互的数据集，然后对这些数据进行增强，以更准确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">地模拟我们最为关注的特定类型越狱。随后，我们利用内部自动化红队成员生成的攻击，迭代地</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">扩充分类器的数据。我们使数据侧重于运行时间较长的智能体任务，因为这类任务通常正是会助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">长大范围滥用的任务。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络用途，包括被视为两用的活动（即可能具有进攻性或防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">御性应用的活动）。与</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 231.92 238.49 245.05 250.15 253.04" y="341.11" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="261.93" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.82 283.51 286.50 292.11 298.68 305.26 311.22 314.11 319.70 325.37 331.78 334.77 340.73 343.62 349.62 352.32" y="341.11" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="359.22 370.22 381.22 392.22 403.22 414.22 425.22 436.22 447.22 458.22 469.22 480.22 491.22 502.22 513.22 524.22" y="341.11" font-size="11.00" class="sc-notoserifcjksc">一样，我们的政策允许在源代码中进</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">行漏洞发现，以便开发者可以使用</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04 314.03 316.74" y="356.73" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63 479.63 490.63 501.63 512.63 523.63" y="356.73" font-size="11.00" class="sc-notoserifcjksc">帮助编写更安全的软件，但会拦截在已编译</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">二进制文件中进行的漏洞发现。我们在第</text><text x="272.89 279.02 281.73" y="372.35" font-size="11.00" class="sc-loraregular">3.4</text><text x="290.58 301.58 312.58 323.58 334.58 345.58 356.58 367.58 378.58 389.58 400.58 411.58 422.58 433.58 444.58 455.58 466.58 477.58 488.58 499.58 510.58 521.58" y="372.35" font-size="11.00" class="sc-notoserifcjksc">节中介绍这些分类器所执行的政策及其覆盖范围，</text><text x="72.00 83.00 94.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">并在第</text><text x="107.89 114.02 116.73" y="387.97" font-size="11.00" class="sc-loraregular">3.5</text><text x="125.61 136.61 147.61 158.61 169.61 180.61 191.61 202.61 213.61 224.61 235.61 246.61 257.61 268.61 279.61 290.61 301.61 312.61" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节中介绍它们对蓄意规避的鲁棒性。鉴于</text><text x="326.51 334.20 337.19 342.80 349.36 355.94 361.90 364.80 373.53 380.10 386.67 391.76 394.65 400.65 403.35" y="387.97" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="412.24 423.24 434.24 445.24 456.24 467.24 478.24 489.24" y="387.97" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力与</text><text x="503.13 510.82 513.82 519.43 525.99 532.57" y="387.97" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="403.59" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">相当，我们选择针对越狱采用</text><text x="271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">，同时持续努力提高分类器的鲁棒</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">性并降低其误报率（见第</text><text x="195.89 202.02 204.73" y="419.21" font-size="11.00" class="sc-loraregular">3.4</text><text x="213.58 224.58 235.58" y="419.21" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">在大多数界面上，对于被我们的网络安全分类器系统拦截的请求，</text><text x="391.00 398.69 401.68 407.29 413.86 420.44 426.40 429.29 438.02 444.59 451.16 456.25 459.14 465.14 467.85" y="503.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="476.73 487.73 498.73" y="503.60" font-size="11.00" class="sc-notoserifcjksc">会回退</text><text x="72.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 86.72 92.39 95.39 98.38 104.78 110.46 116.31" y="519.22" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21 133.21" y="519.22" font-size="11.00" class="sc-notoserifcjksc">）到</text><text x="147.11 154.80 157.79 163.40 169.97 176.54 182.51 185.40 194.13 200.70 207.27 212.36 215.25 221.22 223.92" y="519.22" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="230.10 241.10 252.10 263.10 274.10 285.10 296.10 307.10 318.10 329.10 340.10 351.10 362.10 373.10 384.10 395.10 406.10 417.10" y="519.22" font-size="11.00" class="sc-notoserifcjksc">。这在我们自己的应用中会自动发生；在</text><text x="431.00 437.88 444.49" y="519.22" font-size="11.00" class="sc-loraregular">API</text><text x="451.07 462.07 473.07 484.07 495.07 506.07 517.07 528.07" y="519.22" font-size="11.00" class="sc-notoserifcjksc">上，开发者必须主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">动选择启用自动回退。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">对于网络安全用例可能被我们的网络安全防护措施拦截的用户，我们建议通过我们的</text><text x="479.00 490.00 501.00 512.00 523.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验</text><text x="72.00 83.00 94.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">证计划</text><text x="105.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="255.73 266.73 277.73 288.73 299.73 310.73 321.73 332.73 343.73 354.73 365.73 376.73 387.73 398.73 409.73 420.73 431.73 442.73 453.73 464.73" y="583.99" font-size="11.00" class="sc-notoserifcjksc">）访问网络安全拦截分类器有所减少的模型。</text><text x="475.73 483.42 486.41 492.02 498.59 505.17 511.13 514.02 522.76 529.32 535.89" y="583.99" font-size="11.00" class="sc-loraregular">Claude Opus</text><text x="72.00 78.00 80.70" y="599.61" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59 100.59 111.59 122.59 133.59 144.59 155.59 166.59 177.59 188.59 199.59 210.59 221.59 232.59 243.59" y="599.61" font-size="11.00" class="sc-notoserifcjksc">将在不久的将来通过该计划提供。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">下文报告的所有结果均是在关闭网络安全防护措施的情况下，通过</text><text x="393.89 400.78 407.39" y="652.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">API</text><text x="413.97 424.97" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">评估</text><text x="438.86 446.55 449.54 455.15 461.72 468.30 474.26 477.15 485.89 492.45 499.02 504.11 507.01 513.00 515.71" y="652.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5.5</text><text x="524.60" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">获</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="683.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">将通过我们的网络安全验证计划获得的能力水平。</text><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="193.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="193.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research 11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="213.95" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89 221.90" y="213.95" font-size="11.00" class="sc-loraregular">16</text><text x="231.15 242.15 253.15 264.15 275.15 286.15 297.15 308.15 319.15 330.15 341.15 352.15 363.15 374.15 385.15 396.15 407.15 418.15 429.15 440.15 451.15 462.15 473.15 484.15 495.15 506.15 517.15 528.15" y="213.95" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖率与崩溃复现，到沙</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="229.57" font-size="11.00" class="sc-notoserifcjksc">箱原语、任意读</text><text x="149.00" y="229.57" font-size="11.00" class="sc-loraregular">/</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59 233.59 244.59 255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59 530.59" y="229.57" font-size="11.00" class="sc-notoserifcjksc">写、控制流劫持以及任意代码执行。这些标志分为五个等级，用以区分仅能触发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="245.19" font-size="11.00" class="sc-notoserifcjksc">崩溃的模型与能够构建武器化所需的可复用原语的模型。这提供了对进攻性网络能力的细粒度衡</text><text x="72.00 83.00" y="260.81" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="327.30" font-size="11.00" class="sc-notoserifcjksc">该基准测试针对</text><text x="151.89 159.08" y="327.30" font-size="11.00" class="sc-loraregular">V8</text><text x="168.15 179.15 190.15 201.15" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎（为</text><text x="215.04 222.73 229.32 234.01 240.44 250.28" y="327.30" font-size="11.00" class="sc-loraregular">Chrome</text><text x="259.13 270.13 281.13 292.13 303.13" y="327.30" font-size="11.00" class="sc-notoserifcjksc">提供支持的</text><text x="317.03 320.96 326.51 331.95 337.63 343.87 349.72 354.48 357.57 364.14" y="327.30" font-size="11.00" class="sc-loraregular">JavaScript</text><text x="371.29" y="327.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="385.18 395.70 401.66 407.98 414.87 419.96 425.06 431.02 440.85 447.25 450.19" y="327.30" font-size="11.00" class="sc-loraregular">WebAssembly</text><text x="458.89 469.89 480.89 491.89 502.89" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎）中的</text><text x="516.79 522.75" y="327.30" font-size="11.00" class="sc-loraregular">41</text><text x="529.64" y="327.30" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00 83.00 94.00" y="342.92" font-size="11.00" class="sc-notoserifcjksc">近期（</text><text x="105.00 110.91 117.66 123.33" y="342.92" font-size="11.00" class="sc-loraregular">2024</text><text x="132.18 143.18 154.18 165.18 176.18 187.18 198.18 209.18 220.18 231.18 242.18 253.18 264.18 275.18 286.18 297.18 308.18 319.18 330.18 341.18" y="342.92" font-size="11.00" class="sc-notoserifcjksc">年及以后）漏洞。模型会获得一个存在漏洞的</text><text x="355.07 362.26" y="342.92" font-size="11.00" class="sc-loraregular">V8</text><text x="371.33 382.33 393.33 404.33 415.33 426.33 437.33 448.33 459.33 470.33 481.33 492.33 503.33 514.33 525.33" y="342.92" font-size="11.00" class="sc-notoserifcjksc">构建版本以及一个修复这些漏洞的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="358.54" font-size="11.00" class="sc-notoserifcjksc">补丁，随后其任务是为该缺陷构建漏洞利用。该构建版本启用了缓解措施，包括</text><text x="459.89 467.08" y="358.54" font-size="11.00" class="sc-loraregular">V8</text><text x="476.15 487.15 498.15 509.15" y="358.54" font-size="11.00" class="sc-notoserifcjksc">堆沙箱、</text><text x="72.00 78.89 85.12 91.48" y="374.16" font-size="11.00" class="sc-loraregular">ASLR</text><text x="101.28 112.28 123.28 134.28 145.28 156.28 167.28 178.28 189.28 200.28 211.28 222.28 233.28 244.28 255.28 266.28 277.28 288.28 299.28 310.28 321.28 332.28 343.28 354.28 365.28 376.28 387.28 398.28 409.28 420.28 431.28 442.28 453.28 464.28 475.28 486.28 497.28" y="374.16" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀。每个漏洞利用等级均由确定性验证器进行机械式评分。为防范奖励破解</text><text x="72.00" y="389.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.60 102.31 107.98 112.67 119.25 122.14 128.73 134.40 140.26 146.16 149.25 155.93" y="389.78" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="162.01 173.01 184.01 195.01 206.01" y="389.78" font-size="11.00" class="sc-notoserifcjksc">），内置于</text><text x="219.91 227.09" y="389.78" font-size="11.00" class="sc-loraregular">V8</text><text x="236.16 247.16 258.16" y="389.78" font-size="11.00" class="sc-notoserifcjksc">的质询</text><text x="269.16" y="389.78" font-size="11.00" class="sc-loraregular">-</text><text x="274.54 285.54 296.54 307.54 318.54 329.54 340.54 351.54 362.54 373.54 384.54 395.54 406.54 417.54 428.54 439.54 450.54 461.54 472.54 483.54 494.54 505.54 516.54 527.54" y="389.78" font-size="11.00" class="sc-notoserifcjksc">响应函数会在多个随机化的堆布局上重放，因此硬编码</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="405.40" font-size="11.00" class="sc-notoserifcjksc">一个泄露的地址不算作解法。我们对每个漏洞运行五次试验。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="473.02" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="505.41" font-size="11.00" class="sc-notoserifcjksc">所有试验和环境中每次试验的平均捕获标志数；</text><text x="108.00 115.69 121.37 127.93" y="521.60" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="521.60" font-size="11.00" class="sc-notoserifcjksc">，即每个环境中所捕获的可用标志百分比（基于随机选取的三次试验子集），并在</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="537.22" font-size="11.00" class="sc-notoserifcjksc">所有环境上取平均；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="553.98" font-size="11.00" class="sc-notoserifcjksc">在普通运行和</text><text x="176.89 182.50 189.07 193.33 199.76 205.14 211.82 218.39 224.96 230.99" y="553.98" font-size="11.00" class="sc-loraregular">auto-nudge</text><text x="239.85 250.85 261.85 272.85 283.85 294.85 305.85 316.85 327.85 338.85 349.85 360.85 371.85 382.85 393.85" y="553.98" font-size="11.00" class="sc-notoserifcjksc">运行中生成的完整任意代码执行（</text><text x="404.85 411.68 419.37" y="553.98" font-size="11.00" class="sc-loraregular">ACE</text><text x="426.21 437.21 448.21 459.21 470.21 481.21 492.21 503.21 514.21" y="553.98" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="602.56" font-size="11.00" class="sc-notoserifcjksc">每个环境在两个实验组下运行，预算为</text><text x="261.89 268.02 274.85" y="602.56" font-size="11.00" class="sc-loraregular">300</text><text x="284.58 295.58 306.58 317.58 328.58 339.58 350.58 361.58 372.58 383.58 394.58 405.58 416.58 427.58 438.58 449.58 460.58 471.58 482.58 493.58 504.58 515.58" y="602.56" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。在</text><text x="72.00 78.89 85.45 89.71 95.88 104.26 110.83 117.41 123.44" y="618.18" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29 319.29 330.29 341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="618.18" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在未达到完整代码执行的情况下于预算用尽前自行停止，运行框架会</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="633.80" font-size="11.00" class="sc-notoserifcjksc">在同一对话中注入一条要求其继续尝试的提示词，并让其继续。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="143.82" y="695.68" width="139.48" height="11.52" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="508.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropi ont-size="11.00" class="sc-loraregular">91%</text><text x="138.22 149.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="163.11 170.00 176.57 180.82 186.99 195.38 201.94 208.52 214.55" y="98.23" font-size="11.00" class="sc-loraregular">AutoNudge</text><text x="223.40 234.40 245.40 256.40 267.40 278.40 289.40 300.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">组中，它平均获得</text><text x="314.30 318.30 324.26 326.97 330.97" y="98.23" font-size="11.00" class="sc-loraregular">14.15</text><text x="339.86 350.86 361.86 372.86" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="383.86 391.55 397.23 403.79" y="98.23" font-size="11.00" class="sc-loraregular">Cap%</text><text x="416.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="430.15 436.51 440.51" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="450.08 461.08 472.08 483.08 494.08 505.08 516.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在普通运行和</text><text x="72.00 77.61 84.18 88.43 94.87 100.25 106.93 113.49 120.07 126.10" y="113.85" font-size="11.00" class="sc-loraregular">auto-nudge</text><text x="134.95 145.95 156.95 167.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行中，</text><text x="178.95 186.64 189.63 195.24 201.81 208.39 214.35 217.24 225.98 232.55 239.11 244.21 247.10 253.09 255.80" y="113.85" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="264.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="278.58 283.65 289.78 292.48 298.45" y="113.85" font-size="11.00" class="sc-loraregular">73.4%</text><text x="310.91 321.91 332.91 343.91 354.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的运行中（</text><text x="365.91 372.04 378.87 382.67 389.79 395.75 399.76" y="113.85" font-size="11.00" class="sc-loraregular">301/410</text><text x="406.59 417.59 428.59 439.59 450.59 461.59 472.59 483.59 494.59 505.59 516.59 527.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）实现了完整的任意代码执</text><text x="72.00 83.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">行。</text><text x="72.00" y="465.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40 115.88 118.24 124.43 127.24 131.96 137.52 142.88 147.73 150.09 157.01 162.42 167.99 172.35 174.72 179.58 181.67" y="465.19" font-size="9.00" class="sc-lorabold">3.3.1.A] Claude Opus 5.5</text><text x="188.90" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="200.27 205.88 210.82 216.19 219.00 224.09 227.00 230.68 236.63 241.47 247.21 251.87" y="465.19" font-size="9.00" class="sc-lorabold">ExploitBench</text><text x="259.83 268.83 277.83 286.83 295.83" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="304.83" y="465.19" font-size="9.00" class="sc-loraregular">“</text><text x="308.43 317.43 326.43" y="465.19" font-size="9.00" class="sc-notoserifcjksc">平均值</text><text x="335.43" y="465.19" font-size="9.00" class="sc-loraregular">”</text><text x="338.57" y="465.19" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="347.57 355.77 360.63 365.27" y="465.19" font-size="9.00" class="sc-loraregular">Mean</text><text x="370.74 379.74 388.74 397.74 406.74 415.74 424.74 433.74 442.74 451.74 460.74 469.74 478.74 487.74 496.74 505.74 514.74 523.74" y="465.19" font-size="9.00" class="sc-notoserifcjksc">）指每个模型在所有试验和环境中捕获的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00" y="476.89" font-size="9.00" class="sc-notoserifcjksc">能力标志平均数。</text><text x="144.00 147.60 153.89 158.54 163.91 171.74" y="476.89" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="174.88 183.88 192.88 201.88 210.88 219.88 228.88 237.88 246.88 255.88 264.88 273.88 282.88 291.88 300.88 309.88 318.88 327.88 336.88 345.88 354.88 363.88 372.88 381.88 390.88 399.88 408.88 417.88 426.88 435.88 444.88 453.88 462.88 471.88 480.88 489.88 498.88 507.88 516.88" y="476.89" font-size="9.00" class="sc-notoserifcjksc">指在给定环境中，从五次试验的子集中随机选取三次试验所捕获的标志占总标志数的百分</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="488.59" font-size="9.00" class="sc-notoserifcjksc">比，并在所有环境上取平均。</text><text x="189.00" y="488.59" font-size="9.00" class="sc-loraregular">“</text><text x="192.60 201.60" y="488.59" font-size="9.00" class="sc-notoserifcjksc">完整</text><text x="212.97 218.56 224.85 230.45" y="488.59" font-size="9.00" class="sc-loraregular">ACE”</text><text x="233.59" y="488.59" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="242.59 247.43 252.80 255.25 257.70 260.06 265.65 271.94 277.54" y="488.59" font-size="9.00" class="sc-loraregular">Full ACEs</text><text x="281.71 290.71 299.71 308.71 317.71" y="488.59" font-size="9.00" class="sc-notoserifcjksc">）是在全部</text><text x="329.08 333.95 337.23" y="488.59" font-size="9.00" class="sc-loraregular">410</text><text x="345.19 354.19 363.19 372.19 381.19 390.19 399.19 408.19 417.19 426.19 435.19" y="488.59" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通运行和</text><text x="446.55 451.14 456.52 460.00 465.26 469.67 475.13 480.50 485.88 490.82" y="488.59" font-size="9.00" class="sc-loraregular">auto-nudge</text><text x="498.06 507.06 516.06 525.06" y="488.59" font-size="9.00" class="sc-notoserifcjksc">运行）中</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="500.29" font-size="9.00" class="sc-notoserifcjksc">实现任意代码执行的总次数。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="543.99" font-size="11.00" class="sc-notoserifcjksc">这些结果是在关闭所有网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="559.61" font-size="11.00" class="sc-notoserifcjksc">这些结果可能无法与厂商在其部署条件下得出的公开排行榜条目直接比较。我们报告的是使用作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="575.23" font-size="11.00" class="sc-notoserifcjksc">者提供的静态、统一运行框架所得的结果，而非原生运行框架。</text><text x="72.00 79.69 85.50 91.73 97.53 103.49 110.17 115.85 120.61 123.70 129.87 136.71 142.68 149.35 155.20" y="648.26" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="164.69 175.69" y="648.26" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58 193.18 197.94 202.62 208.59 214.67 221.24 224.23 229.91" y="648.26" font-size="11.00" class="sc-loraregular">Irregular</text><text x="237.56 248.56 259.56 270.56 281.56 292.56 303.56 314.56 325.56 336.56 347.56 358.56 369.56 380.56 391.56 402.56 413.56 424.56 435.56 446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="648.26" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="663.88" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动，而不是执行孤立的技术任务。大多数网络安全基准测试侧重于孤立考察单</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="679.50" font-size="11.00" class="sc-notoserifcjksc">项能力的短程挑战，而</text><text x="184.89 192.58 198.39 204.63 210.42 216.39 223.06 228.74 233.50 236.59 242.76 249.61 255.57 262.24 268.10" y="679.50" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="277.58 288.58 299.58 310.58 321.58 332.58 343.58 354.58 365.58 376.58 387.58 398.58 409.58 420.58 431.58 442.58" y="679.50" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">行动阶段之间协调地安排攻击技术的先后顺序，包括做出分支决策、遵守约束，以及从错误和状</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">态不一致中恢复。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">该基准测试采用三级层次结构。任务级评估衡量原子能力，例如代码生成和载荷调整；路径级评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">估涵盖与攻击树分支相对应的多步骤序列；战役级评估则是纳入不确定性和行动摩擦的完整攻击</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">模拟。场景源自对真实网络安全事件的分析，并在容器化网络环境中运行，这些环境配有真实的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">操作系统、真实的服务配置、具有响应能力的防御监控，以及安全意识各异的模拟员工。所有场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">景均为全新的、从零构建的（而非取自已公开的夺旗赛（</text><text x="432.88 443.88 454.88 465.88 476.88 487.88 498.88 509.88 520.88" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）演练），并且评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="240.53" font-size="11.00" class="sc-notoserifcjksc">供有意义的能力提升（</text><text x="182.00 188.57 195.13 198.13 201.22 205.07" y="240.53" font-size="11.00" class="sc-loraregular">uplift</text><text x="209.32 220.32 231.32 242.32 253.32 264.32 275.32 286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32" y="240.53" font-size="11.00" class="sc-notoserifcjksc">），而不仅仅是加速专家的工作。</text><text x="72.00 83.00 94.00 105.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们运行</text><text x="118.89 126.58 132.39 138.63 144.42 150.39 157.06 162.74 167.50 170.59 176.76 183.61 189.57 196.24 202.10" y="357.88" font-size="11.00" class="sc-loraregular">CyScenarioBench</text><text x="211.58 222.58 233.58 244.58 255.58 266.58 277.58 288.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">评估集中一个包含</text><text x="302.47 306.48" y="357.88" font-size="11.00" class="sc-loraregular">10</text><text x="316.20 327.20 338.20 349.20 360.20 371.20 382.20" y="357.88" font-size="11.00" class="sc-notoserifcjksc">个挑战的子集：</text><text x="393.20 399.23 405.14 411.57 421.40 427.29 431.55 436.50 442.30 450.32 453.32 459.28 464.37 469.46 475.90" y="357.88" font-size="11.00" class="sc-loraregular">geometry_lesson</text><text x="482.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="527.80" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77 140.86 147.54 153.21 159.78 164.87 171.46 177.90" y="373.50" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15 199.59 204.35 207.44 213.79 216.88 223.56 231.58 236.67 240.93 247.36 252.31" y="373.50" font-size="11.00" class="sc-loraregular">origin_story</text><text x="258.12" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12 272.21 278.79 284.75 291.33 295.59 298.85 303.13 308.94 316.96 322.81 327.57 330.67 335.76 338.85" y="373.50" font-size="11.00" class="sc-loraregular">identity_crisis</text><text x="343.94" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94 360.03 363.13 369.47 375.96 380.22 388.24 392.50 398.46 403.55" y="373.50" font-size="11.00" class="sc-loraregular">sight_test</text><text x="407.81" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81 428.64 435.21 439.47 442.56 449.16" y="373.50" font-size="11.00" class="sc-loraregular">mutiny</text><text x="454.96" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00 78.59 85.02 91.59 98.17 101.26 107.94 111.03 119.05 125.61 130.30 136.74 140.99 147.43 153.22 159.66" y="389.12" font-size="11.00" class="sc-loraregular">houdini_protocol</text><text x="165.54" y="389.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="179.44 185.29 189.97 196.41 201.50 206.60 212.50 219.08 227.10 235.91 239.00 243.69 249.65" y="389.12" font-size="11.00" class="sc-loraregular">crossed_wires</text> <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00 80.39 84.03" y="84.20" font-size="14.00" class="sc-poppinssemibold">3.4</text><text x="96.61 110.61 124.61 138.61 152.61 166.61 180.61 194.61 208.61 222.61" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施覆盖范围</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="110.76" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施旨在拦截与</text><text x="292.63 300.32 303.31 308.92 315.48 322.06 328.02 330.92 336.51 342.18 348.58 351.58 357.54 360.43" y="110.76" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="369.32" y="110.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.21 390.90 393.89 399.50 406.07 412.65 418.61 421.50 427.09 432.77 439.17 442.16 448.12 451.02 457.01 459.72" y="110.76" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="466.61 477.61 488.61 499.61 510.61 521.61" y="110.76" font-size="11.00" class="sc-notoserifcjksc">相同的违规交</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">互。不过，与</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04" y="126.38" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="217.93 228.93 239.93 250.93 261.93" y="126.38" font-size="11.00" class="sc-notoserifcjksc">之后发布的</text><text x="275.82 283.51 286.50 292.11 298.68 305.26" y="126.38" font-size="11.00" class="sc-loraregular">Claude</tex "sc-notoserifcjksc">原因想要在二进制文件中查找漏洞。</text><text x="72.00 83.00" y="288.87" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 143.92 150.49 157.05 162.15 165.04 171.03 173.74" y="288.87" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="182.63 193.63 204.63 215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力有所增强，我们采用了</text><text x="369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="468.63 479.63 490.63 501.63 512.63 523.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">，正如我们对</text><text x="72.00 77.59 83.26 89.67 92.66" y="304.49" font-size="11.00" class="sc-loraregular">Fable</text><text x="101.51 112.51 123.51 134.51 145.51 156.51 167.51 178.51 189.51 200.51 211.51 222.51 233.51 244.51 255.51 266.51 277.51 288.51 299.51 310.51 321.51 332.51 343.51 354.51 365.51 376.51 387.51 398.51 409.51 420.51 431.51 442.51 453.51" y="304.49" font-size="11.00" class="sc-notoserifcjksc">系列模型所做的那样，同时继续努力提高分类器的鲁棒性并降低其误报率。</text><text x="72.00 79.79 83.17 91.76 95.14" y="351.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.1</text><text x="102.94 115.94 128.94 141.94 154.94 167.94 180.94 193.94" y="351.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖范围</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="379.88" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73 168.73 179.73 190.73 201.73 212.73 223.73 234.73 245.73 256.73 267.73 278.73 289.73 300.73 311.73 322.73 333.73 344.73 355.73 366.73 377.73 388.73 399.73 410.73 421.73 432.73 443.73 454.73 465.73 476.73 487.73 498.73 509.73 520.73" y="379.88" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截潜在危害不对称的网络活动（即所使用的特定技能对攻</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">击者的帮助大于对防御者的帮助）。正如我们</text><text x="292.00 303.00 314.00 325.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前所述</text><text x="336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">，这一类别既涵盖禁止使用等级，也在全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="411.12" font-size="11.00" class="sc-notoserifcjksc">面开放级别下涵盖高风险两用等级。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="460.83" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现这些类别的分类器覆盖结果。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.6 ropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 104.65 106.75 112.28 115.76 118.12 124.32 127.12 131.84 137.40 142.77 147.61 149.98 156.90 162.31 167.87 172.23 174.60 179.46 181.56" y="367.93" font-size="9.00" class="sc-lorabold">3.4.1.A] Claude Opus 5.5</text><text x="188.78 197.78 206.78 215.78 224.78 233.78 242.78 251.78 260.78 269.78 278.78 287.78" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">的分类器与此前模型相当。</text><text x="296.78 305.78 314.78 323.78 332.78 341.78 350.78 359.78 368.78 377.78 386.78 395.78 404.78 413.78 422.78 431.78 440.78 449.78 458.78 467.78 476.78 485.78 494.78 503.78 512.78 521.78 530.78" y="367.93" font-size="9.00" class="sc-notoserifcjksc">总体召回率是指在所有类别中被标记的有害示例所占比例。每</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">个模型均以其自身部署的安全防护系统进行评分。</text><text x="72.00 79.79 83.17 91.76 95.14" y="424.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.2</text><text x="105.70 118.70 131.70 144.70 157.70 170.70" y="424.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">漏洞挖掘评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="452.66" font-size="11.00" class="sc-notoserifcjksc">漏洞挖掘是网络安全中的一项基础技术。我们的目标是为防御者而非攻击者提供优势。因此，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">们将漏洞挖掘评估分为</text><text x="182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="468.28" font-size="11.00" class="sc-notoserifcjkscbold">基于二进制文件的漏洞挖掘</text><text x="314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">（偏向于无法访问源代码的攻击者的恶意使</text><text x="72.00 83.00 94.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">用）和</text><text x="105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="483.90" font-size="11.00" class="sc-notoserifcjkscbold">基于源代码的漏洞挖掘</text><text x="215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">（偏向于防御者）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="549.81" font-size="11.00" class="sc-notoserifcjksc">依照我们的使用政策（</text><text x="182.00 190.20 195.29 200.96 206.99 212.95 215.85 222.40 228.84 231.83 234.92 240.72" y="549.81" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="246.53 257.53 268.53 279.53 290.53 301.53 312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53" y="549.81" font-size="11.00" class="sc-notoserifcjksc">），我们从监控用的线性探针（</text><text x="400.53 403.52 406.61 413.29 419.23 424.90 429.67 432.56 439.12 443.81 450.25 456.65" y="549.81" font-size="11.00" class="sc-loraregular">linear probe</text><text x="462.61 473.61 484.61 495.61 506.61 517.61 528.61" y="549.81" font-size="11.00" class="sc-notoserifcjksc">）中抽取了混合</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="565.43" font-size="11.00" class="sc-notoserifcjksc">的漏洞发现流量样本，并使用大语言模型对其进行评分（采用一种保护用户隐私的聚合方法）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="581.05" font-size="11.00" class="sc-notoserifcjksc">我们的结果如下：</text></svg></div>

234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24" y="361.17" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（即</text><text x="366.24" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="370.64 381.64" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="392.64" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="396.48 407.48 418.48 429.48 440.48 451.48 462.48" y="361.17" font-size="11.00" class="sc-notoserifcjksc">）的能力，此处</text><text x="473.48" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="477.88 488.88" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="499.88" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="503.72 514.72 525.72" y="361.17" font-size="11.00" class="sc-notoserifcjksc">一词涵</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">盖提示词、定制运行框架以及多智能体流水线。在我们的</text><text x="347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了越狱严</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="392.41" font-size="11.00" class="sc-notoserifcjksc">重性的以下四个维度：</text><text x="108.00 119.00 130.00 141.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="152.00 163.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="174.00 185.00 196.00 207.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能使攻击者在其现有工具和能力的基础上前进多远；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="174.00 185.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="196.00 207.00 218.00 229.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">普适性）</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">：同一越狱技术可适用于多少种不同的进攻性任务；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="506.90" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="506.90" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力投入；以及</text><text x="108.00 119.00 130.00 141.00" y="539.28" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="539.28" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="571.66" font-size="11.00" class="sc-notoserifcjksc">例如，严重级越狱将是在高能力提升模型上易于发现、易于武器化且具有普适性的越狱。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="620.24" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.03 239.74" y="620.24" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63" y="620.24" font-size="11.00" class="sc-notoserifcjksc">的严重级越狱的证据；</text><text x="358.63 366.32 369.31 374.92 381.48 388.06 394.02 396.92 402.51 408.18 414.58 417.58 423.54 426.43 432.43 435.13" y="620.24" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="439.14" y="620.24" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.14 457.83 460.82 466.43 472.99 479.57 485.53 488.43 494.02 499.69 506.09 509.09 515.05 517.94" y="620.24" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="526.83" y="620.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="635.86" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03 358.03 369.03 380.03 391.03 402.03 413.03 424.03 435.03 446.03 457.03 468.03 479.03 490.03 501.03 512.03 523.03" y="635.86" font-size="11.00" class="sc-notoserifcjksc">的情况也依然如此。即便如此，我们并不期望我们的分类器具有完美的鲁棒性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="651.48" font-size="11.00" class="sc-notoserifcjksc">因此，我们在内部以及与外部合作伙伴一起对模型进行广泛测试，以主动发现并修补越狱。下文</text><text x="72.00 83.00 94.00 105.00 116.00" y="667.10" font-size="11.00" class="sc-notoserifcjksc">报告的是在</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.03 206.74" y="667.10" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="215.63 226.63 237.63 248.63 259.63 270.63 281.63 292.63 303.63 314.63 325.63 336.63 347.63 358.63 369.63 380.63 391.63 402.63 413.63 424.63 435.63 446.63 457.63 468.63" y="667.10" font-size="11.00" class="sc-notoserifcjksc">较早快照上进行的此类测试结果；我们的安全防护措施</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在不同模型快照之间通常以同等方式运行，我们有信心这些结果能够代表最终模型。</text><text x="72.00 79.79 83.17 91.54 94.92" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项名为</text><text x="173.89 178.58 184.50 193.31 196.40 203.08 209.65 215.03 220.63 225.00 229.26 234.93 240.78 246.61 252.58" y="157.42" font-size="11.00" class="sc-loraregular">rewind-attacker</text><text x="260.23 271.23 282.23 293.23 304.23 315.23 326.23 337.23 348.23 359.23 370.23 381.23 392.23 403.23 414.23 425.23 436.23 447.23 458.23 469.23 480.23 491.23 502.23 513.23" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全防护的模型（</text><text x="524.23" y="157.42" font-size="11.00" class="sc-loraitalic">“</text><text x="528.50" y="157.42" font-size="11.00" class="sc-notoserifcjksc">助</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">手</text><text x="83.00" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="87.09 98.09 109.09 120.09 131.09 142.09 153.09 164.09 175.09 186.09" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器（</text><text x="197.09" y="173.04" font-size="11.00" class="sc-loraregular">“</text><text x="201.49 212.49 223.49" y="173.04" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="234.49" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="238.58 249.58 260.58 271.58 282.58 293.58 304.58 315.58 326.58 337.58 348.58 359.58 370.58 381.58 392.58 403.58 414.58 425.58 436.58 447.58 458.58 469.58" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有用（</text><text x="480.58 487.17 493.13 496.13 502.64 506.36 512.92 515.92" y="173.04" font-size="11.00" class="sc-loraregular">helpful-</text><text x="72.00 78.43 85.11 88.05" y="188.66" font-size="11.00" class="sc-loraregular">only</text><text x="93.86 104.86 115.86 126.86 137.86 148.86 159.86 170.86 181.86 192.86 203.86 214.86 225.86 236.86 247.86 258.86 269.86 280.86 291.86 302.86 313.86 324.86 335.86 346.86 357.86 368.86 379.86 390.86 401.86 412.86 423.86 434.86 445.86 456.86" y="188.66" font-size="11.00" class="sc-notoserifcjksc">）语言模型，经提示后模拟人类红队成员，从助手处诱导出进攻性网络能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个会话中启动，在该会话中它可以向一个</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 373.87 380.31 386.89" y="238.38" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="238.38" font-size="11.00" class="sc-notoserifcjksc">智能体发送指令，该智能体在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">任务沙箱内运行助手模型（带有生产环境安全防护措施）。随后，攻击者获得针对助手的</text><text x="503.89 509.86 516.69" y="254.00" font-size="11.00" class="sc-loraregular">400</text><text x="526.41" y="254.00" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">调用上限，在此期间攻击者会收到拦截反馈，并有机会回溯到更早的状态以尝试新方法。每个任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">务将智能体置于一个独立的</text><text x="206.89 215.09 221.52 227.38 233.21 239.17" y="285.24" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">害者目录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="402.00 407.80 414.23 424.07 433.90 439.58 446.25 452.83 458.21 463.89 470.56 477.14 482.52 488.32 494.75 501.33 505.59 510.27 516.71" y="300.86" font-size="11.00" class="sc-loraregular">command-and-control</text><text x="519.70" y="300.86" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务套件包含以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="481.89 489.98 498.36" y="400.30" font-size="11.00" class="sc-loraregular">DNS</text><text x="504.60 515.60 526.60" y="400.30"
