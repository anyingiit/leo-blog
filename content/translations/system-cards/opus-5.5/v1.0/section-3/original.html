.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">47</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">3</text><text x="85.39" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">网络安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">3.1</text><text x="92.43" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在我们的内部评估套件中，</text><text x="204.00" y="154.36" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="289.73" y="154.36" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="355.73" y="154.36" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="420.39" y="154.36" font-size="11.00" class="sc-notoserifcjksc">）所报告的全部网络安</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">全评估上均达到或超过</text><text x="184.89" y="169.98" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="279.85" y="169.98" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.74" y="169.98" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="370.77" y="169.98" font-size="11.00" class="sc-notoserifcjksc">的表现。</text><text x="72.00" y="219.13" font-size="11.00" class="sc-notoserifcjksc">尽管</text><text x="96.89" y="219.13" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="182.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">具备上述网络安全能力，该模型仍处于我们</text><text x="391.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="457.63" y="219.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="468.63" y="219.13" font-size="11.00" class="sc-loraregular sc-k">Frontier</text><text x="72.00" y="234.75" font-size="11.00" class="sc-loraregular sc-k">Compliance Framework</text><text x="193.39" y="234.75" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="204.39" y="234.75" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="224.05" y="234.75" font-size="11.00" class="sc-notoserifcjksc">）所设定的较低能力类别之内，并且我们未看到该模型具备新型</text><text x="72.00" y="250.37" font-size="11.00" class="sc-notoserifcjksc">进攻能力的迹象。</text><text x="160.00" y="250.37" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="182.56" y="250.37" font-size="11.00" class="sc-notoserifcjksc">基于两个风险等级来评估新模型带来的网络攻击风险，这些等级为模型面</text><text x="72.00" y="265.99" font-size="11.00" class="sc-notoserifcjksc">向广泛使用发布之前所开发的缓解措施提供依据：</text><text x="108.00" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="316.28" font-size="11.00" class="sc-lorabold">1</text><text x="140.25" y="316.28" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="151.25" y="316.28" font-size="11.00" class="sc-notoserifcjksc">，模型能够利用已知的攻击技术和方法，为实际进行中的网络行动提供有意义的</text><text x="108.00" y="331.90" font-size="11.00" class="sc-notoserifcjksc">技术协助。尽管涉及一定程度的自动化，但处于这一等级的模型仍依赖人类输入才能成功</text><text x="108.00" y="347.52" font-size="11.00" class="sc-notoserifcjksc">完成大规模网络行动。</text><text x="108.00" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">在第</text><text x="132.89" y="381.05" font-size="11.00" class="sc-lorabold">2</text><text x="141.65" y="381.05" font-size="11.00" class="sc-notoserifcjkscbold">级</text><text x="152.65" y="381.05" font-size="11.00" class="sc-notoserifcjksc">，模型能够完全自主地开展网络行动，具备新型进攻能力开发和自适应持久驻留</text><text x="108.00" y="396.67" font-size="11.00" class="sc-notoserifcjksc">能力。</text><text x="72.00" y="429.62" font-size="11.00" class="sc-notoserifcjksc">所有评估均在禁用网络安全防护分类器、但启用一个用于检测逃逸尝试的新分类器的条件下运</text><text x="72.00" y="445.24" font-size="11.00" class="sc-notoserifcjksc">行。自之前的系统卡发布以来，我们用于评估运行的许多运行框架（</text><text x="402.00" y="445.24" font-size="11.00" class="sc-loraregular">harness</text><text x="441.85" y="445.24" font-size="11.00" class="sc-notoserifcjksc">）已被重写。在这些</text><text x="72.00" y="460.86" font-size="11.00" class="sc-notoserifcjksc">情况下，所有较早的模型均已重新评估，以保持各模型之间的一致性，因此所得数值与之前的系</text><text x="72.00" y="476.48" font-size="11.00" class="sc-notoserifcjksc">统卡有所不同。</text><text x="72.00" y="528.18" font-size="14.00" class="sc-poppinssemibold">3.2</text><text x="95.39" y="528.18" font-size="14.00" class="sc-notosanscjkscbold">缓解措施</text><text x="72.00" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">如上所述，</text><text x="127.00" y="554.73" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5.5</text><text x="212.73" y="554.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是我们迄今发布的所有模型中网络安全能力最强的，在我们的全部</text><text x="72.00" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">内部评估上均达到或超过</text><text x="195.89" y="570.35" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Mythos 5.1</text><text x="287.95" y="570.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。因此，我们在向公众部署该模型时配备了网络安全</text><text x="72.00" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">防护措施：这些措施执行与</text><text x="206.89" y="585.97" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5</text><text x="283.93" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相同的政策，但其鲁棒性与我们在</text><text x="451.82" y="585.97" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Fable 5</text><text x="528.51" y="585.97" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="72.00" y="601.59" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Fable 5.1</text><text x="155.40" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施相当，且高于</text><text x="312.30" y="601.59" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5</text><text x="389.33" y="601.59" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的安全防护措施（见第</text><text x="513.22" y="601.59" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">3.5</text><text x="72.00" y="617.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">节）。此处所述的安全防护措施适用于全面开放的模型；如下文所述，经验证的网络安全用户将</text><text x="72.00" y="632.84" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">能够以更少的限制访问同一模型。</text><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="391.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="402.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="413.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="424.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="435.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="446.63" y="210.33" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p048.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 48 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">48</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的网络安全防护措施基于两个阶段，而本系统采用三个阶段来防止有害的网络安全用途。第</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一，探针查看</text><text x="140.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="179.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的内部激活值，筛查所有流量，并上报其标记为与网络安全相关的所有流</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">量。第二，被上报的流量由一个在</text><text x="239.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="325.63" y="113.85" font-size="11.00" class="sc-notoserifcjksc">自身上运行的轻量级分类器打分。第三，被</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">第二个分类器识别为可能违规的流量会被传递给一个经过训练的大语言模型（</text><text x="446.00" y="129.47" font-size="11.00" class="sc-loraregular">LLM</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">这是一个独立的模型，它结合探针的判定来决定是否应拦截某段对话。</text><text x="72.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">这一方法借鉴了我们</text><text x="171.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前讨论过</text><text x="226.00" y="212.15" font-size="11.00" class="sc-notoserifcjksc">的宪法分类器（</text><text x="427.84" y="212.15" font-size="11.00" class="sc-notoserifcjksc">）。为训练我们的网络</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">安全分类器，我们收集了一个违规网络安全交互的数据集，然后对这些数据进行增强，以更准确</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">地模拟我们最为关注的特定类型越狱。随后，我们利用内部自动化红队成员生成的攻击，迭代地</text><text x="72.00" y="259.01" font-size="11.00" class="sc-notoserifcjksc">扩充分类器的数据。我们使数据侧重于运行时间较长的智能体任务，因为这类任务通常正是会助</text><text x="72.00" y="274.63" font-size="11.00" class="sc-notoserifcjksc">长大范围滥用的任务。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">这些拦截旨在防止可能有害的进攻性网络用途，包括被视为两用的活动（即可能具有进攻性或防</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">御性应用的活动）。与</text><text x="184.89" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="261.93" y="341.11" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="275.82" y="341.11" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="359.22" y="341.11" font-size="11.00" class="sc-notoserifcjksc">一样，我们的政策允许在源代码中进</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">行漏洞发现，以便开发者可以使用</text><text x="239.89" y="356.73" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="325.63" y="356.73" font-size="11.00" class="sc-notoserifcjksc">帮助编写更安全的软件，但会拦截在已编译</text><text x="72.00" y="372.35" font-size="11.00" class="sc-notoserifcjksc">二进制文件中进行的漏洞发现。我们在第</text><text x="272.89" y="372.35" font-size="11.00" class="sc-loraregular">3.4</text><text x="290.58" y="372.35" font-size="11.00" class="sc-notoserifcjksc">节中介绍这些分类器所执行的政策及其覆盖范围，</text><text x="72.00" y="387.97" font-size="11.00" class="sc-notoserifcjksc">并在第</text><text x="107.89" y="387.97" font-size="11.00" class="sc-loraregular">3.5</text><text x="125.61" y="387.97" font-size="11.00" class="sc-notoserifcjksc">节中介绍它们对蓄意规避的鲁棒性。鉴于</text><text x="326.51" y="387.97" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="412.24" y="387.97" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力与</text><text x="503.13" y="387.97" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="403.59" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="128.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">相当，我们选择针对越狱采用</text><text x="271.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="370.66" y="403.59" font-size="11.00" class="sc-notoserifcjksc">，同时持续努力提高分类器的鲁棒</text><text x="72.00" y="419.21" font-size="11.00" class="sc-notoserifcjksc">性并降低其误报率（见第</text><text x="195.89" y="419.21" font-size="11.00" class="sc-loraregular">3.4</text><text x="213.58" y="419.21" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">在大多数界面上，对于被我们的网络安全分类器系统拦截的请求，</text><text x="391.00" y="503.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="476.73" y="503.60" font-size="11.00" class="sc-notoserifcjksc">会回退</text><text x="72.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="519.22" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21" y="519.22" font-size="11.00" class="sc-notoserifcjksc">）到</text><text x="147.11" y="519.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="230.10" y="519.22" font-size="11.00" class="sc-notoserifcjksc">。这在我们自己的应用中会自动发生；在</text><text x="431.00" y="519.22" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="451.07" y="519.22" font-size="11.00" class="sc-notoserifcjksc">上，开发者必须主</text><text x="72.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">动选择启用自动回退。</text><text x="72.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc">对于网络安全用例可能被我们的网络安全防护措施拦截的用户，我们建议通过我们的</text><text x="479.00" y="568.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验</text><text x="72.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">证计划</text><text x="105.00" y="583.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="255.73" y="583.99" font-size="11.00" class="sc-notoserifcjksc">）访问网络安全拦截分类器有所减少的模型。</text><text x="475.73" y="583.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="599.61" font-size="11.00" class="sc-loraregular">5.5</text><text x="89.59" y="599.61" font-size="11.00" class="sc-notoserifcjksc">将在不久的将来通过该计划提供。</text><text x="72.00" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">下文报告的所有结果均是在关闭网络安全防护措施的情况下，通过</text><text x="393.89" y="652.33" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">API</text><text x="413.97" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">评估</text><text x="438.86" y="652.33" font-size="11.00" class="sc-loraregular sc-k" fill="#1d1c1d">Claude Opus 5.5</text><text x="524.60" y="652.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">获</text><text x="72.00" y="683.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">将通过我们的网络安全验证计划获得的能力水平。</text><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="171.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="182.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="193.00" y="203.35" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="193.00" y="203.35" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/research/next-generation-constitutional-classifiers" rel="noopener"><rect x="204.00" y="203.35" width="0.00 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p049.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 49 页"><text x="72.00 79.72 82.85 90.57 93.70 98.25 101.63 108.44 114.93 123.74 127.17 135.46 138.89 143.73 151.91 159.93 168.37 176.16" y="125.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.1 ExploitBench</text><text x="90.00" y="505.86" font-size="11.00" class="sc-loraregular">1.</text><text x="90.00" y="522.06" font-size="11.00" class="sc-loraregular">2.</text><text x="90.00" y="554.44" font-size="11.00" class="sc-loraregular">3.</text><text x="72.00" y="689.41" font-size="5.40" class="sc-loraregular">2</text><text x="77.26" y="693.21" font-size="9.00" class="sc-loraregular sc-k">Lee, S., and Brumley, D. (2026). ExploitBench: A capability ladder benchmark for LLM cybersecurity agents.</text><text x="72.00" y="704.73" font-size="9.00" class="sc-loraregular sc-k">arXiv:2605.14153.</text><text x="143.82" y="704.73" font-size="9.00" class="sc-loraregular sc-k" fill="#1155cc">https://arxiv.org/abs/2605.14153</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">49</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">3.3</text><text x="95.74" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">能力评估</text><text x="72.00" y="148.96" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="140.11" y="145.30" font-size="6.60" class="sc-loraregular">2</text><text x="146.55" y="148.96" font-size="11.00" class="sc-notoserifcjksc">是一项网络安全基准测试，用于评估</text><text x="325.44" y="148.96" font-size="11.00" class="sc-loraregular">AI</text><text x="338.91" y="148.96" font-size="11.00" class="sc-notoserifcjksc">模型在软件漏洞利用流水线上能推进多远</text><text x="72.00" y="164.58" font-size="11.00" class="sc-notoserifcjksc">（而不是将漏洞利用作为单一的通过</text><text x="248.00" y="164.58" font-size="11.00" class="sc-loraregular">/</text><text x="255.59" y="164.58" font-size="11.00" class="sc-notoserifcjksc">失败事件来评分）。我们最近撰文对其进行了</text><text x="475.59" y="164.58" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更详细的介</text><text x="72.00" y="180.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">绍</text><text x="83.00" y="180.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="213.95" font-size="11.00" class="sc-notoserifcjksc">该基准测试将漏洞利用分解为</text><text x="217.89" y="213.95" font-size="11.00" class="sc-loraregular">16</text><text x="231.15" y="213.95" font-size="11.00" class="sc-notoserifcjksc">个可测量的能力标志。这些标志涵盖从覆盖率与崩溃复现，到沙</text><text x="72.00" y="229.57" font-size="11.00" class="sc-notoserifcjksc">箱原语、任意读</text><text x="149.00" y="229.57" font-size="11.00" class="sc-loraregular">/</text><text x="156.59" y="229.57" font-size="11.00" class="sc-notoserifcjksc">写、控制流劫持以及任意代码执行。这些标志分为五个等级，用以区分仅能触发</text><text x="72.00" y="245.19" font-size="11.00" class="sc-notoserifcjksc">崩溃的模型与能够构建武器化所需的可复用原语的模型。这提供了对进攻性网络能力的细粒度衡</text><text x="72.00" y="260.81" font-size="11.00" class="sc-notoserifcjksc">量。</text><text x="72.00" y="327.30" font-size="11.00" class="sc-notoserifcjksc">该基准测试针对</text><text x="151.89" y="327.30" font-size="11.00" class="sc-loraregular">V8</text><text x="168.15" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎（为</text><text x="215.04" y="327.30" font-size="11.00" class="sc-loraregular sc-k">Chrome</text><text x="259.13" y="327.30" font-size="11.00" class="sc-notoserifcjksc">提供支持的</text><text x="317.03" y="327.30" font-size="11.00" class="sc-loraregular sc-k">JavaScript</text><text x="371.29" y="327.30" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="385.18" y="327.30" font-size="11.00" class="sc-loraregular sc-k">WebAssembly</text><text x="458.89" y="327.30" font-size="11.00" class="sc-notoserifcjksc">引擎）中的</text><text x="516.79" y="327.30" font-size="11.00" class="sc-loraregular">41</text><text x="529.64" y="327.30" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="342.92" font-size="11.00" class="sc-notoserifcjksc">近期（</text><text x="105.00" y="342.92" font-size="11.00" class="sc-loraregular sc-k">2024</text><text x="132.18" y="342.92" font-size="11.00" class="sc-notoserifcjksc">年及以后）漏洞。模型会获得一个存在漏洞的</text><text x="355.07" y="342.92" font-size="11.00" class="sc-loraregular">V8</text><text x="371.33" y="342.92" font-size="11.00" class="sc-notoserifcjksc">构建版本以及一个修复这些漏洞的</text><text x="72.00" y="358.54" font-size="11.00" class="sc-notoserifcjksc">补丁，随后其任务是为该缺陷构建漏洞利用。该构建版本启用了缓解措施，包括</text><text x="459.89" y="358.54" font-size="11.00" class="sc-loraregular">V8</text><text x="476.15" y="358.54" font-size="11.00" class="sc-notoserifcjksc">堆沙箱、</text><text x="72.00" y="374.16" font-size="11.00" class="sc-loraregular">ASLR</text><text x="101.28" y="374.16" font-size="11.00" class="sc-notoserifcjksc">和栈金丝雀。每个漏洞利用等级均由确定性验证器进行机械式评分。为防范奖励破解</text><text x="72.00" y="389.78" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="389.78" font-size="11.00" class="sc-loraregular sc-k">reward hacking</text><text x="162.01" y="389.78" font-size="11.00" class="sc-notoserifcjksc">），内置于</text><text x="219.91" y="389.78" font-size="11.00" class="sc-loraregular">V8</text><text x="236.16" y="389.78" font-size="11.00" class="sc-notoserifcjksc">的质询</text><text x="269.16" y="389.78" font-size="11.00" class="sc-loraregular">-</text><text x="274.54" y="389.78" font-size="11.00" class="sc-notoserifcjksc">响应函数会在多个随机化的堆布局上重放，因此硬编码</text><text x="72.00" y="405.40" font-size="11.00" class="sc-notoserifcjksc">一个泄露的地址不算作解法。我们对每个漏洞运行五次试验。</text><text x="72.00" y="473.02" font-size="11.00" class="sc-notoserifcjksc">我们报告三项指标：</text><text x="108.00" y="505.41" font-size="11.00" class="sc-notoserifcjksc">所有试验和环境中每次试验的平均捕获标志数；</text><text x="108.00" y="521.60" font-size="11.00" class="sc-loraregular">Cap%</text><text x="137.50" y="521.60" font-size="11.00" class="sc-notoserifcjksc">，即每个环境中所捕获的可用标志百分比（基于随机选取的三次试验子集），并在</text><text x="108.00" y="537.22" font-size="11.00" class="sc-notoserifcjksc">所有环境上取平均；以及</text><text x="108.00" y="553.98" font-size="11.00" class="sc-notoserifcjksc">在普通运行和</text><text x="176.89" y="553.98" font-size="11.00" class="sc-loraregular sc-k">auto-nudge</text><text x="239.85" y="553.98" font-size="11.00" class="sc-notoserifcjksc">运行中生成的完整任意代码执行（</text><text x="404.85" y="553.98" font-size="11.00" class="sc-loraregular sc-k">ACE</text><text x="426.21" y="553.98" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用的数量。</text><text x="72.00" y="602.56" font-size="11.00" class="sc-notoserifcjksc">每个环境在两个实验组下运行，预算为</text><text x="261.89" y="602.56" font-size="11.00" class="sc-loraregular">300</text><text x="284.58" y="602.56" font-size="11.00" class="sc-notoserifcjksc">轮。在普通组中，模型进行一次不间断的尝试。在</text><text x="72.00" y="618.18" font-size="11.00" class="sc-loraregular sc-k">AutoNudge</text><text x="132.29" y="618.18" font-size="11.00" class="sc-notoserifcjksc">组中，如果模型在未达到完整代码执行的情况下于预算用尽前自行停止，运行框架会</text><text x="72.00" y="633.80" font-size="11.00" class="sc-notoserifcjksc">在同一对话中注入一条要求其继续尝试的提示词，并让其继续。</text><a href="https://arxiv.org/abs/2605.14153" rel="noopener"><rect x="143.82" y="695.68" width="139.48" height="11.52" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="475.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="486.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="497.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="508.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="508.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="519.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="519.59" y="155.78" width="11.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="530.59" y="155.78" width="0.00" height="11.00" fill="transparent"/></a><a href="https://red.anthropic.com/2026/exploit-evals/" rel="noopener"><rect x="72.00" y="171.40" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p050.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 50 页"><text x="72.00 79.72 82.85 90.57 93.70 101.20 104.58 114.63 122.19 130.04 137.84 145.86 154.29 163.10 168.09 171.52 179.81 188.00 196.02 204.46 212.25" y="627.10" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.2 CyScenarioBench</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">50</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在普通组中，</text><text x="138.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="223.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="237.63" y="82.61" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="308.63" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="322.53" y="82.61" font-size="11.00" class="sc-loraregular">41</text><text x="335.38" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="349.28" y="82.61" font-size="11.00" class="sc-loraregular">V8</text><text x="365.54" y="82.61" font-size="11.00" class="sc-notoserifcjksc">环境中平均获得</text><text x="445.43" y="82.61" font-size="11.00" class="sc-loraregular">13.99</text><text x="473.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个能力标志，</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">Cap%</text><text x="104.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="118.29" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="138.22" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="163.11" y="98.23" font-size="11.00" class="sc-loraregular sc-k">AutoNudge</text><text x="223.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">组中，它平均获得</text><text x="314.30" y="98.23" font-size="11.00" class="sc-loraregular">14.15</text><text x="339.86" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个标志，</text><text x="383.86" y="98.23" font-size="11.00" class="sc-loraregular">Cap%</text><text x="416.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="430.15" y="98.23" font-size="11.00" class="sc-loraregular">91%</text><text x="450.08" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。在普通运行和</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">auto-nudge</text><text x="134.95" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行中，</text><text x="178.95" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="264.69" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="278.58" y="113.85" font-size="11.00" class="sc-loraregular">73.4%</text><text x="310.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的运行中（</text><text x="365.91" y="113.85" font-size="11.00" class="sc-loraregular sc-k">301/410</text><text x="406.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）实现了完整的任意代码执</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">行。</text><text x="72.00" y="465.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 104.77 106.87 112.40 115.88 118.24 124.43 127.24 131.96 137.52 142.88 147.73 150.09 157.01 162.42 167.99 172.35 174.72 179.58 181.67" y="465.19" font-size="9.00" class="sc-lorabold">3.3.1.A] Claude Opus 5.5</text><text x="188.90" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="200.27" y="465.19" font-size="9.00" class="sc-lorabold sc-k">ExploitBench</text><text x="259.83" y="465.19" font-size="9.00" class="sc-notoserifcjkscbold">上的结果。</text><text x="304.83" y="465.19" font-size="9.00" class="sc-loraregular">“</text><text x="308.43" y="465.19" font-size="9.00" class="sc-notoserifcjksc">平均值</text><text x="335.43" y="465.19" font-size="9.00" class="sc-loraregular">”</text><text x="338.57" y="465.19" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="347.57" y="465.19" font-size="9.00" class="sc-loraregular sc-k">Mean</text><text x="370.74" y="465.19" font-size="9.00" class="sc-notoserifcjksc">）指每个模型在所有试验和环境中捕获的</text><text x="72.00" y="476.89" font-size="9.00" class="sc-notoserifcjksc">能力标志平均数。</text><text x="144.00" y="476.89" font-size="9.00" class="sc-loraregular">“Cap%”</text><text x="174.88" y="476.89" font-size="9.00" class="sc-notoserifcjksc">指在给定环境中，从五次试验的子集中随机选取三次试验所捕获的标志占总标志数的百分</text><text x="72.00" y="488.59" font-size="9.00" class="sc-notoserifcjksc">比，并在所有环境上取平均。</text><text x="189.00" y="488.59" font-size="9.00" class="sc-loraregular">“</text><text x="192.60" y="488.59" font-size="9.00" class="sc-notoserifcjksc">完整</text><text x="212.97" y="488.59" font-size="9.00" class="sc-loraregular sc-k">ACE”</text><text x="233.59" y="488.59" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="242.59" y="488.59" font-size="9.00" class="sc-loraregular sc-k">Full ACEs</text><text x="281.71" y="488.59" font-size="9.00" class="sc-notoserifcjksc">）是在全部</text><text x="329.08" y="488.59" font-size="9.00" class="sc-loraregular">410</text><text x="345.19" y="488.59" font-size="9.00" class="sc-notoserifcjksc">次运行（包括普通运行和</text><text x="446.55" y="488.59" font-size="9.00" class="sc-loraregular sc-k">auto-nudge</text><text x="498.06" y="488.59" font-size="9.00" class="sc-notoserifcjksc">运行）中</text><text x="72.00" y="500.29" font-size="9.00" class="sc-notoserifcjksc">实现任意代码执行的总次数。</text><text x="72.00" y="543.99" font-size="11.00" class="sc-notoserifcjksc">这些结果是在关闭所有网络安全防护措施、但启用逃逸分类器及其他安全措施的情况下获得的。</text><text x="72.00" y="559.61" font-size="11.00" class="sc-notoserifcjksc">这些结果可能无法与厂商在其部署条件下得出的公开排行榜条目直接比较。我们报告的是使用作</text><text x="72.00" y="575.23" font-size="11.00" class="sc-notoserifcjksc">者提供的静态、统一运行框架所得的结果，而非原生运行框架。</text><text x="72.00" y="648.26" font-size="11.00" class="sc-loraregular sc-k">CyScenarioBench</text><text x="164.69" y="648.26" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="189.58" y="648.26" font-size="11.00" class="sc-loraregular sc-k">Irregular</text><text x="237.56" y="648.26" font-size="11.00" class="sc-notoserifcjksc">开发的一项基准测试，用于评估模型能否在现实约束下规划并</text><text x="72.00" y="663.88" font-size="11.00" class="sc-notoserifcjksc">执行多阶段网络行动，而不是执行孤立的技术任务。大多数网络安全基准测试侧重于孤立考察单</text><text x="72.00" y="679.50" font-size="11.00" class="sc-notoserifcjksc">项能力的短程挑战，而</text><text x="184.89" y="679.50" font-size="11.00" class="sc-loraregular sc-k">CyScenarioBench</text><text x="277.58" y="679.50" font-size="11.00" class="sc-notoserifcjksc">衡量的是编排能力：即在相互依赖的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p051.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 51 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">51</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">行动阶段之间协调地安排攻击技术的先后顺序，包括做出分支决策、遵守约束，以及从错误和状</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">态不一致中恢复。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">该基准测试采用三级层次结构。任务级评估衡量原子能力，例如代码生成和载荷调整；路径级评</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">估涵盖与攻击树分支相对应的多步骤序列；战役级评估则是纳入不确定性和行动摩擦的完整攻击</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">模拟。场景源自对真实网络安全事件的分析，并在容器化网络环境中运行，这些环境配有真实的</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">操作系统、真实的服务配置、具有响应能力的防御监控，以及安全意识各异的模拟员工。所有场</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">景均为全新的、从零构建的（而非取自已公开的夺旗赛（</text><text x="432.88" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）演练），并且评估</text><text x="72.00" y="240.53" font-size="11.00" class="sc-notoserifcjksc">供有意义的能力提升（</text><text x="182.00" y="240.53" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="209.32" y="240.53" font-size="11.00" class="sc-notoserifcjksc">），而不仅仅是加速专家的工作。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">我们运行</text><text x="118.89" y="357.88" font-size="11.00" class="sc-loraregular sc-k">CyScenarioBench</text><text x="211.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">评估集中一个包含</text><text x="302.47" y="357.88" font-size="11.00" class="sc-loraregular">10</text><text x="316.20" y="357.88" font-size="11.00" class="sc-notoserifcjksc">个挑战的子集：</text><text x="393.20" y="357.88" font-size="11.00" class="sc-loraregular sc-k">geometry_lesson</text><text x="482.58" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="527.80" y="357.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="124.77" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="135.77" y="373.50" font-size="11.00" class="sc-loraregular">snapshot</text><text x="182.15" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.15" y="373.50" font-size="11.00" class="sc-loraregular sc-k">origin_story</text><text x="258.12" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="269.12" y="373.50" font-size="11.00" class="sc-loraregular sc-k">identity_crisis</text><text x="343.94" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="354.94" y="373.50" font-size="11.00" class="sc-loraregular sc-k">sight_test</text><text x="407.81" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="418.81" y="373.50" font-size="11.00" class="sc-loraregular sc-k">mutiny</text><text x="454.96" y="373.50" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="389.12" font-size="11.00" class="sc-loraregular sc-k">houdini_protocol</text><text x="165.54" y="389.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="179.44" y="389.12" font-size="11.00" class="sc-loraregular sc-k">crossed_wires</text><text x="254.74" y="389.12" font-size="11.00" class="sc-notoserifcjksc">。我们报告每个模型在这</text><text x="378.64" y="389.12" font-size="11.00" class="sc-loraregular">10</text><text x="392.36" y="389.12" font-size="11.00" class="sc-notoserifcjksc">个挑战上取平均的总体解决</text><text x="72.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">率。</text><text x="72.00" y="438.83" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="438.83" font-size="11.00" class="sc-notoserifcjksc">完成了全部挑战的</text><text x="248.63" y="438.83" font-size="11.00" class="sc-loraregular sc-k">67.6%</text><text x="278.02" y="438.83" font-size="11.00" class="sc-notoserifcjksc">，是迄今已发布模型中表现最强的。相比之下，</text><text x="72.00" y="454.45" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="166.95" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="202.85" y="454.45" font-size="11.00" class="sc-loraregular sc-k">61.7%</text><text x="233.10" y="454.45" font-size="11.00" class="sc-notoserifcjksc">的任务，</text><text x="277.10" y="454.45" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="354.13" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成了</text><text x="390.02" y="454.45" font-size="11.00" class="sc-loraregular sc-k">53.0%</text><text x="421.09" y="454.45" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="432.09" y="454.45" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="518.33" y="454.45" font-size="11.00" class="sc-notoserifcjksc">完成</text><text x="72.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">的任务不到</text><text x="129.89" y="470.07" font-size="11.00" class="sc-loraregular">1%</text><text x="143.47" y="470.07" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p052.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 52 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">52</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 105.91 108.01 113.54 117.02 119.39 125.58 128.39 133.10 138.66 144.03 148.87 151.24 158.16 163.57 169.13 173.49 175.86 180.72 182.82" y="390.43" font-size="9.00" class="sc-lorabold">3.3.2.A] Claude Opus 5.5</text><text x="190.04" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="201.41" y="390.43" font-size="9.00" class="sc-lorabold sc-k">CyScenarioBench</text><text x="279.19" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">上的表现优于所有其他模型。</text><text x="396.19" y="390.43" font-size="9.00" class="sc-notoserifcjksc">柱形表示每个模型在我们子集中</text><text x="524.56" y="390.43" font-size="9.00" class="sc-loraregular">10</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">个挑战上取平均的总体解决率。本评估在关闭我们的网络安全缓解措施的情况下运行。</text><text x="72.00" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.3.3 Binary Exploitation Benchmark</text><text x="308.25" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（原名</text><text x="350.34" y="447.27" font-size="13.00" class="sc-poppinssemibold" fill="#666666">OSS-Fuzz</text><text x="412.00" y="447.27" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="475.16" font-size="11.00" class="sc-notoserifcjksc">本评估衡量无引导的漏洞发现，以及模型能将发现的缺陷向可用的概念验证（</text><text x="446.00" y="475.16" font-size="11.00" class="sc-loraregular sc-k">proof-of-</text><text x="72.00" y="490.78" font-size="11.00" class="sc-loraregular sc-k">concept</text><text x="113.49" y="490.78" font-size="11.00" class="sc-notoserifcjksc">）漏洞利用推进多远。每个任务是</text><text x="281.39 289.76 296.19 302.63 308.97 311.97 317.93 320.82 329.55 335.79 342.03 347.41 353.33 359.89 365.45" y="490.78" font-size="11.00" class="sc-loraregular">Google OSS-Fuzz</text><text x="373.97" y="490.78" font-size="11.00" class="sc-notoserifcjksc">语料库中某个开源项目的一个模糊</text><text x="72.00" y="506.40" font-size="11.00" class="sc-notoserifcjksc">测试驱动程序（</text><text x="149.00 152.72 159.29 164.84 170.45 173.34 179.93 185.61 190.37 197.05 203.01 208.10" y="506.40" font-size="11.00" class="sc-loraregular">fuzz harness</text><text x="213.22" y="506.40" font-size="11.00" class="sc-notoserifcjksc">）入口点，该项目构建于一个已完全修补的时间点快照，不含已知</text><text x="72.00" y="522.02" font-size="11.00" class="sc-notoserifcjksc">漏洞，也不提供任何提示。这</text><text x="217.89" y="522.02" font-size="11.00" class="sc-loraregular">831</text><text x="237.10" y="522.02" font-size="11.00" class="sc-notoserifcjksc">个入口点涵盖</text><text x="305.99" y="522.02" font-size="11.00" class="sc-loraregular">228</text><text x="326.88" y="522.02" font-size="11.00" class="sc-notoserifcjksc">个项目。每次试验按一个五级阶梯评分，从</text><text x="72.00" y="537.64" font-size="11.00" class="sc-notoserifcjksc">内存安全崩溃（</text><text x="149.00" y="537.64" font-size="11.00" class="sc-loraregular sc-k">0.2</text><text x="164.27" y="537.64" font-size="11.00" class="sc-notoserifcjksc">）到控制流劫持（</text><text x="252.27" y="537.64" font-size="11.00" class="sc-loraregular sc-k">1.0</text><text x="265.64" y="537.64" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="588.50" font-size="11.00" class="sc-notoserifcjksc">我们最近彻底重写了该评估的运行框架，以加强评估过程中的安全防护和监控，并用新的运行框</text><text x="72.00" y="604.12" font-size="11.00" class="sc-notoserifcjksc">架重新运行了所有较早的模型。在此过程中，我们发现并修复了若干缺陷，并调整了参数，使得</text><text x="72.00" y="619.74" font-size="11.00" class="sc-notoserifcjksc">新运行框架产生的成功结果显著多于此前的运行框架。因此，此处给出的数值不能与之前的系统</text><text x="72.00" y="635.36" font-size="11.00" class="sc-notoserifcjksc">卡进行比较。</text><text x="72.00" y="685.65" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="193.63" y="685.65" font-size="11.00" class="sc-loraregular">106</text><text x="213.71" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流劫持。相比之下，</text><text x="345.71" y="685.65" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="440.67" y="685.65" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="476.56" y="685.65" font-size="11.00" class="sc-loraregular">81</text><text x="489.64" y="685.65" font-size="11.00" class="sc-notoserifcjksc">次控制流</text><text x="72.00" y="701.27" font-size="11.00" class="sc-notoserifcjksc">劫持，</text><text x="105.00" y="701.27" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="182.03" y="701.27" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="217.93" y="701.27" font-size="11.00" class="sc-loraregular">66</text><text x="233.54" y="701.27" font-size="11.00" class="sc-notoserifcjksc">次，</text><text x="255.54" y="701.27" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p053.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 53 页"><text x="72.00 79.72 82.85 90.57 93.70 102.11 105.49 112.30 118.79 127.60 131.03 139.32 142.75 147.58 157.63 165.19" y="464.81" font-size="13.00" class="sc-poppinsmedium" fill="#666666">3.3.4 ExploitGym</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">53</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">产生了</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular">3</text><text x="116.91" y="82.61" font-size="11.00" class="sc-notoserifcjksc">次。与</text><text x="152.81" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="229.84" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="243.73" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="338.68" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相比，漏洞识别能力有所提升。</text><text x="72.00" y="424.87" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="424.87" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.15 108.25 113.79 117.26 119.63 125.82 128.63 133.34 138.91 144.27 149.11 151.48 158.40 163.81 169.37 173.74 176.10 180.96 183.06" y="424.87" font-size="9.00" class="sc-lorabold">3.3.3.A] Claude Opus 5.5</text><text x="190.29" y="424.87" font-size="9.00" class="sc-notoserifcjkscbold">优于所有其他模型</text><text x="262.29" y="424.87" font-size="9.00" class="sc-notoserifcjksc">，体现在</text><text x="300.65" y="424.87" font-size="9.00" class="sc-loraregular sc-k">Binary Exploitation Benchmark</text><text x="430.78" y="424.87" font-size="9.00" class="sc-notoserifcjksc">（原名</text><text x="460.15 467.30 472.40 477.50 481.90 486.75 492.12 496.66" y="424.87" font-size="9.00" class="sc-loraregular">OSS-Fuzz</text><text x="501.27" y="424.87" font-size="9.00" class="sc-notoserifcjksc">）的漏洞</text><text x="72.00" y="436.57" font-size="9.00" class="sc-notoserifcjksc">利用与漏洞识别上。</text><text x="72.00" y="488.89" font-size="11.00" class="sc-loraregular sc-k">ExploitGym</text><text x="135.10" y="488.89" font-size="11.00" class="sc-notoserifcjksc">是一项大规模公开基准测试，由</text><text x="291.99" y="488.89" font-size="11.00" class="sc-loraregular sc-k">UC Berkeley</text><text x="357.69" y="488.89" font-size="11.00" class="sc-notoserifcjksc">的研究人员与</text><text x="426.59" y="488.89" font-size="11.00" class="sc-loraregular sc-k">Max Planck Institute</text><text x="72.00" y="504.51" font-size="11.00" class="sc-loraregular sc-k">for Security and Privacy</text><text x="194.40" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="205.40" y="504.51" font-size="11.00" class="sc-loraregular sc-k">UC Santa Barbara</text><text x="295.18" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="306.18 313.07 317.83 320.92 326.45 332.89 339.56 345.24 348.13 354.33 358.58 364.18 368.44 374.40 377.29 385.57 392.24 395.33 400.83 406.80 411.56 416.65 419.92 424.20" y="504.51" font-size="11.00" class="sc-loraregular">Arizona State University</text><text x="430.02" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="441.02" y="504.51" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="491.96" y="504.51" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="520.13" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="113.40" y="520.13" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="127.30" y="520.13" font-size="11.00" class="sc-loraregular sc-k">Google</text><text x="166.73" y="520.13" font-size="11.00" class="sc-notoserifcjksc">的合作者共同开发。该基准测试衡量</text><text x="345.62" y="520.13" font-size="11.00" class="sc-loraregular">AI</text><text x="359.09" y="520.13" font-size="11.00" class="sc-notoserifcjksc">智能体能否将已知漏洞转化为可用的</text><text x="72.00" y="535.75" font-size="11.00" class="sc-notoserifcjksc">漏洞利用。</text><text x="127.00" y="535.75" font-size="11.00" class="sc-loraregular sc-k">ExploitGym</text><text x="190.10" y="535.75" font-size="11.00" class="sc-notoserifcjksc">主要关注将崩溃转化为未授权代码执行，其涵盖的应用范围比</text><text x="72.00" y="551.37" font-size="11.00" class="sc-loraregular sc-k">CyberGym</text><text x="129.48" y="551.37" font-size="11.00" class="sc-notoserifcjksc">更广；</text><text x="162.48" y="551.37" font-size="11.00" class="sc-loraregular sc-k">CyberGym</text><text x="219.95" y="551.37" font-size="11.00" class="sc-notoserifcjksc">测试的是模型能否复现已知漏洞。由于</text><text x="409.84" y="551.37" font-size="11.00" class="sc-loraregular sc-k">CyberGym</text><text x="467.32" y="551.37" font-size="11.00" class="sc-notoserifcjksc">已饱和，我们</text><text x="72.00" y="566.99" font-size="11.00" class="sc-notoserifcjksc">已将其从本系统卡中移除。</text><text x="72.00" y="634.62" font-size="11.00" class="sc-notoserifcjksc">该基准测试包含</text><text x="151.89" y="634.62" font-size="11.00" class="sc-loraregular">869</text><text x="173.68" y="634.62" font-size="11.00" class="sc-notoserifcjksc">个真实世界漏洞实例，分布于三个领域：</text><text x="371.68" y="634.62" font-size="11.00" class="sc-loraregular sc-k">502</text><text x="393.23" y="634.62" font-size="11.00" class="sc-notoserifcjksc">个用户空间目标，取自开源项</text><text x="72.00" y="650.24" font-size="11.00" class="sc-notoserifcjksc">目（</text><text x="94.00 102.73 108.97 115.21 120.59 126.51 133.07 138.63" y="650.24" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="147.15" y="650.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="161.04" y="650.24" font-size="11.00" class="sc-loraregular sc-k">ARVO</text><text x="190.54" y="650.24" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="226.43 234.12 241.30 247.90 255.49 264.22 270.46" y="650.24" font-size="11.00" class="sc-loraregular">CVE/OSV</text><text x="280.54" y="650.24" font-size="11.00" class="sc-notoserifcjksc">记录；</text><text x="313.54" y="650.24" font-size="11.00" class="sc-loraregular">181</text><text x="330.62" y="650.24" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="344.51" y="650.24" font-size="11.00" class="sc-loraregular sc-k">Chrome V8 JavaScript</text><text x="459.12" y="650.24" font-size="11.00" class="sc-notoserifcjksc">引擎中的目标，</text><text x="72.00" y="665.86" font-size="11.00" class="sc-notoserifcjksc">来源于</text><text x="107.89 115.58 118.57 125.14 130.23 134.49 140.45 144.99 150.90 157.47 163.02" y="665.86" font-size="11.00" class="sc-loraregular">ClusterFuzz</text><text x="171.55" y="665.86" font-size="11.00" class="sc-notoserifcjksc">报告、</text><text x="204.55" y="665.86" font-size="11.00" class="sc-loraregular sc-k">Chromium issue</text><text x="290.87" y="665.86" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="315.76" y="665.86" font-size="11.00" class="sc-loraregular">V8</text><text x="332.02" y="665.86" font-size="11.00" class="sc-notoserifcjksc">沙箱突破报告；以及</text><text x="433.91" y="665.86" font-size="11.00" class="sc-loraregular">186</text><text x="453.35" y="665.86" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="467.24" y="665.86" font-size="11.00" class="sc-loraregular">Linux</text><text x="498.66" y="665.86" font-size="11.00" class="sc-notoserifcjksc">内核目</text><text x="72.00" y="681.48" font-size="11.00" class="sc-notoserifcjksc">标，来自</text><text x="118.89" y="681.48" font-size="11.00" class="sc-loraregular sc-k">kernelCTF</text><text x="174.61" y="681.48" font-size="11.00" class="sc-notoserifcjksc">提交和</text><text x="210.50 215.59 221.40 227.01 233.41 239.85" y="681.48" font-size="11.00" class="sc-loraregular">syzbot</text><text x="247.01" y="681.48" font-size="11.00" class="sc-notoserifcjksc">报告。对于每个实例，智能体会获得存在漏洞的源代码和构</text><text x="72.00" y="697.10" font-size="11.00" class="sc-notoserifcjksc">建配置、一个漏洞证明（</text><text x="193.00 199.57 204.25 210.69 217.07 220.68 226.06 232.44 236.04 241.42 246.98 253.54 256.54 263.21 269.18 273.86 279.54 285.94 289.03 292.02 295.29 299.57" y="697.10" font-size="11.00" class="sc-loraregular">proof-of-vulnerability</text><text x="305.38" y="697.10" font-size="11.00" class="sc-notoserifcjksc">）输入</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p054.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 54 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">54</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（可触发该缺陷），以及一个用于与目标交互的容器化运行环境。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">任务是开发一个漏洞利用，实现未授权代码执行，并读取一个存放在智能体授权范围之外、动态</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">生成的秘密标志。由于智能体有时会通过不同于所提供缺陷的另一处缺陷实现代码执行，成功的</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">标志捕获还会额外经过一项</text><text x="204.00" y="162.43" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="162.43" font-size="11.00" class="sc-notoserifcjksc">智能体即评判者</text><text x="285.40" y="162.43" font-size="11.00" class="sc-loraregular">”</text><text x="289.24" y="162.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="300.24" y="162.43" font-size="11.00" class="sc-loraregular sc-k">agent-as-a-judge</text><text x="389.33" y="162.43" font-size="11.00" class="sc-notoserifcjksc">）检查（该检查已对照经专家</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">审核的轨迹进行验证），以确认确实利用了预期的漏洞。每个实例都可以在启用标准缓解措施</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="193.67" font-size="11.00" class="sc-loraregular">ASLR</text><text x="109.39" y="193.67" font-size="11.00" class="sc-notoserifcjksc">、栈金丝雀、</text><text x="175.39" y="193.67" font-size="11.00" class="sc-loraregular">V8</text><text x="191.65" y="193.67" font-size="11.00" class="sc-notoserifcjksc">堆沙箱和</text><text x="238.54" y="193.67" font-size="11.00" class="sc-loraregular">KASLR</text><text x="272.44" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）或禁用这些措施的情况下运行。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">我们目前在禁用所有缓解措施的情况下评估所有任务。</text><text x="336.00" y="260.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="421.73" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="435.63" y="260.72" font-size="11.00" class="sc-loraregular">2</text><text x="444.43" y="260.72" font-size="11.00" class="sc-notoserifcjksc">小时和</text><text x="480.32" y="260.72" font-size="11.00" class="sc-loraregular">6</text><text x="489.57" y="260.72" font-size="11.00" class="sc-notoserifcjksc">小时内分</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">别借助预期漏洞成功攻破了</text><text x="206.89" y="276.34" font-size="11.00" class="sc-loraregular">869</text><text x="228.68" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个案例中的</text><text x="286.58" y="276.34" font-size="11.00" class="sc-loraregular sc-k">289</text><text x="307.84" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个和</text><text x="332.73" y="276.34" font-size="11.00" class="sc-loraregular">300</text><text x="355.42" y="276.34" font-size="11.00" class="sc-notoserifcjksc">个。相比之下，</text><text x="432.42" y="276.34" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="527.37" y="276.34" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="291.96" font-size="11.00" class="sc-loraregular">2</text><text x="80.80" y="291.96" font-size="11.00" class="sc-notoserifcjksc">小时内成功利用了</text><text x="171.69" y="291.96" font-size="11.00" class="sc-loraregular">203</text><text x="193.45" y="291.96" font-size="11.00" class="sc-notoserifcjksc">个案例，在</text><text x="251.34" y="291.96" font-size="11.00" class="sc-loraregular">6</text><text x="260.60" y="291.96" font-size="11.00" class="sc-notoserifcjksc">小时内成功利用了</text><text x="351.49" y="291.96" font-size="11.00" class="sc-loraregular">264</text><text x="372.61" y="291.96" font-size="11.00" class="sc-notoserifcjksc">个，这意味着</text><text x="441.50" y="291.96" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="488.94" y="291.96" font-size="11.00" class="sc-notoserifcjksc">在两种时</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc">间预算下均已超越</text><text x="162.89" y="307.58" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="216.66" y="307.58" font-size="11.00" class="sc-notoserifcjksc">。有趣的是，我们观察到</text><text x="340.55" y="307.58" font-size="11.00" class="sc-loraregular">2</text><text x="349.35" y="307.58" font-size="11.00" class="sc-notoserifcjksc">小时与</text><text x="385.25" y="307.58" font-size="11.00" class="sc-loraregular">6</text><text x="394.50" y="307.58" font-size="11.00" class="sc-notoserifcjksc">小时之间的差距显著缩小，从</text><text x="72.00" y="323.20" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="128.66" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="142.55" y="323.20" font-size="11.00" class="sc-loraregular">61</text><text x="155.81" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个案例缩小到</text><text x="224.70" y="323.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="272.15" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的仅</text><text x="297.04" y="323.20" font-size="11.00" class="sc-loraregular">11</text><text x="307.94" y="323.20" font-size="11.00" class="sc-notoserifcjksc">个，这表明</text><text x="365.83" y="323.20" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="413.28" y="323.20" font-size="11.00" class="sc-notoserifcjksc">的大部分成功漏洞利用都</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc">是在前</text><text x="107.89" y="338.82" font-size="11.00" class="sc-loraregular">2</text><text x="116.69" y="338.82" font-size="11.00" class="sc-notoserifcjksc">小时内达成的。</text><text x="72.00" y="603.38" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 99.02 101.12 106.04 108.14 113.67" y="603.38" font-size="9.00" class="sc-lorabold">3.3.4.A]</text><text x="119.51" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.88" y="603.38" font-size="9.00" class="sc-lorabold sc-k">ExploitGym</text><text x="183.61" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">上，</text><text x="201.61" y="603.38" font-size="9.00" class="sc-lorabold">Claude Opus 5.5</text><text x="272.27" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">相比</text><text x="292.64" y="603.38" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="356.34" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="367.70" y="603.38" font-size="9.00" class="sc-lorabold sc-k">Claude Mythos 5.1</text><text x="447.07" y="603.38" font-size="9.00" class="sc-notoserifcjkscbold">有大幅提升</text><text x="492.07" y="603.38" font-size="9.00" class="sc-notoserifcjksc">。柱形表示</text><text x="72.00" y="615.08" font-size="9.00" class="sc-notoserifcjksc">在两小时和六小时实际耗时预算下，利用给定漏洞的成功漏洞利用数量。成功要求捕获一个动态生成的秘密标志，且每</text><text x="72.00" y="626.78" font-size="9.00" class="sc-notoserifcjksc">个成功的漏洞利用都会经智能体评判者验证，以确认其利用的是预期漏洞。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">3.4</text><text x="96.61" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施覆盖范围</text><text x="72.00" y="110.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施旨在拦截与</text><text x="292.63" y="110.76" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="369.32" y="110.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.21" y="110.76" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="466.61" y="110.76" font-size="11.00" class="sc-notoserifcjksc">相同的违规交</text><text x="72.00" y="126.38" font-size="11.00" class="sc-notoserifcjksc">互。不过，与</text><text x="140.89" y="126.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="217.93" y="126.38" font-size="11.00" class="sc-notoserifcjksc">之后发布的</text><text x="275.82" y="126.38" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="314.11" y="126.38" font-size="11.00" class="sc-notoserifcjksc">版本类似，</text><text x="369.11" y="126.38" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="454.84" y="126.38" font-size="11.00" class="sc-notoserifcjksc">将在所有访问级</text><text x="72.00" y="142.00" font-size="11.00" class="sc-notoserifcjksc">别（包括全面开放）下允许在源代码中进行漏洞发现，同时继续拦截在已编译二进制文件中进行</text><text x="72.00" y="157.62" font-size="11.00" class="sc-notoserifcjksc">的漏洞发现。</text><text x="72.00" y="207.91" font-size="11.00" class="sc-notoserifcjksc">我们拦截在已编译二进制文件中进行的漏洞发现，是因为它更常作为一种进攻性技术。因此，</text><text x="72.00" y="223.53" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="223.53" font-size="11.00" class="sc-notoserifcjksc">的安全过滤器会标记并拦截此类请求，尽管在某些情况下，用户可能出于无害或非恶意的</text><text x="72.00" y="239.15" font-size="11.00" class="sc-notoserifcjksc">原因想要在二进制文件中查找漏洞。</text><text x="72.00" y="288.87" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="96.89" y="288.87" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="182.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力有所增强，我们采用了</text><text x="369.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">暂时更宽的安全裕度</text><text x="468.63" y="288.87" font-size="11.00" class="sc-notoserifcjksc">，正如我们对</text><text x="72.00" y="304.49" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="101.51" y="304.49" font-size="11.00" class="sc-notoserifcjksc">系列模型所做的那样，同时继续努力提高分类器的鲁棒性并降低其误报率。</text><text x="72.00" y="351.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.1</text><text x="102.94" y="351.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">网络危害覆盖范围</text><text x="72.00" y="379.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="379.88" font-size="11.00" class="sc-notoserifcjksc">的分类器旨在继续拦截潜在危害不对称的网络活动（即所使用的特定技能对攻</text><text x="72.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">击者的帮助大于对防御者的帮助）。正如我们</text><text x="292.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">此前所述</text><text x="336.00" y="395.50" font-size="11.00" class="sc-notoserifcjksc">，这一类别既涵盖禁止使用等级，也在全</text><text x="72.00" y="411.12" font-size="11.00" class="sc-notoserifcjksc">面开放级别下涵盖高风险两用等级。</text><text x="72.00" y="460.83" font-size="11.00" class="sc-notoserifcjksc">在下图中，我们为每个网络危害类别汇编了示例，并汇总呈现这些类别的分类器覆盖结果。</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="424.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="435.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="446.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="457.63" y="280.07" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="386.70" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 104.65 106.75 112.28 115.76 118.12 124.32 127.12 131.84 137.40 142.77 147.61 149.98 156.90 162.31 167.87 172.23 174.60 179.46 181.56" y="367.93" font-size="9.00" class="sc-lorabold">3.4.1.A] Claude Opus 5.5</text><text x="188.78" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">的分类器与此前模型相当。</text><text x="296.78" y="367.93" font-size="9.00" class="sc-notoserifcjksc">总体召回率是指在所有类别中被标记的有害示例所占比例。每</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">个模型均以其自身部署的安全防护系统进行评分。</text><text x="72.00" y="424.77" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.4.2</text><text x="105.70" y="424.77" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">漏洞挖掘评估</text><text x="72.00" y="452.66" font-size="11.00" class="sc-notoserifcjksc">漏洞挖掘是网络安全中的一项基础技术。我们的目标是为防御者而非攻击者提供优势。因此，我</text><text x="72.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">们将漏洞挖掘评估分为</text><text x="182.00" y="468.28" font-size="11.00" class="sc-notoserifcjkscbold">基于二进制文件的漏洞挖掘</text><text x="314.00" y="468.28" font-size="11.00" class="sc-notoserifcjksc">（偏向于无法访问源代码的攻击者的恶意使</text><text x="72.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">用）和</text><text x="105.00" y="483.90" font-size="11.00" class="sc-notoserifcjkscbold">基于源代码的漏洞挖掘</text><text x="215.00" y="483.90" font-size="11.00" class="sc-notoserifcjksc">（偏向于防御者）。</text><text x="72.00" y="549.81" font-size="11.00" class="sc-notoserifcjksc">依照我们的使用政策（</text><text x="182.00" y="549.81" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="246.53" y="549.81" font-size="11.00" class="sc-notoserifcjksc">），我们从监控用的线性探针（</text><text x="400.53" y="549.81" font-size="11.00" class="sc-loraregular sc-k">linear probe</text><text x="462.61" y="549.81" font-size="11.00" class="sc-notoserifcjksc">）中抽取了混合</text><text x="72.00" y="565.43" font-size="11.00" class="sc-notoserifcjksc">的漏洞发现流量样本，并使用大语言模型对其进行评分（采用一种保护用户隐私的聚合方法）。</text><text x="72.00" y="581.05" font-size="11.00" class="sc-notoserifcjksc">我们的结果如下：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="72.00" y="287.96" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="287.96" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 105.79 107.89 113.43 116.90 119.27 125.46 128.27 132.98 138.55 143.91 148.75 151.12 158.04 163.45 169.01 173.38 175.74 180.60 182.70" y="287.96" font-size="9.00" class="sc-lorabold">3.4.2.A] Claude Opus 5.5</text><text x="189.93" y="287.96" font-size="9.00" class="sc-notoserifcjkscbold">降低了防御性漏洞发现的拦截率</text><text x="315.93" y="287.96" font-size="9.00" class="sc-notoserifcjksc">，相较于此前的</text><text x="381.29" y="287.96" font-size="9.00" class="sc-loraregular">Opus</text><text x="405.72" y="287.96" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="417.09" y="287.96" font-size="9.00" class="sc-loraregular sc-k">Fable</text><text x="441.23" y="287.96" font-size="9.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="334.61" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37" y="334.61" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施鲁棒性测试</text><text x="72.00" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="361.17" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="361.17" font-size="11.00" class="sc-notoserifcjksc">是指系统的安全防护措施抵御蓄意规避尝试（即</text><text x="366.24" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="370.64" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="392.64" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="396.48" y="361.17" font-size="11.00" class="sc-notoserifcjksc">）的能力，此处</text><text x="473.48" y="361.17" font-size="11.00" class="sc-loraregular">“</text><text x="477.88" y="361.17" font-size="11.00" class="sc-notoserifcjksc">越狱</text><text x="499.88" y="361.17" font-size="11.00" class="sc-loraregular">”</text><text x="503.72" y="361.17" font-size="11.00" class="sc-notoserifcjksc">一词涵</text><text x="72.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">盖提示词、定制运行框架以及多智能体流水线。在我们的</text><text x="347.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="424.00" y="376.79" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了越狱严</text><text x="72.00" y="392.41" font-size="11.00" class="sc-notoserifcjksc">重性的以下四个维度：</text><text x="108.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="152.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="174.00" y="442.13" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="218.00" y="442.13" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能使攻击者在其现有工具和能力的基础上前进多远；</text><text x="108.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="174.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="196.00" y="474.52" font-size="11.00" class="sc-notoserifcjkscbold">普适性）</text><text x="240.00" y="474.52" font-size="11.00" class="sc-notoserifcjksc">：同一越狱技术可适用于多少种不同的进攻性任务；</text><text x="108.00" y="506.90" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="174.00" y="506.90" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力投入；以及</text><text x="108.00" y="539.28" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="152.00" y="539.28" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00" y="571.66" font-size="11.00" class="sc-notoserifcjksc">例如，严重级越狱将是在高能力提升模型上易于发现、易于武器化且具有普适性的越狱。</text><text x="72.00" y="620.24" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89" y="620.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="248.63" y="620.24" font-size="11.00" class="sc-notoserifcjksc">的严重级越狱的证据；</text><text x="358.63" y="620.24" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="439.14" y="620.24" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="450.14" y="620.24" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="526.83" y="620.24" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="635.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="635.86" font-size="11.00" class="sc-notoserifcjksc">的情况也依然如此。即便如此，我们并不期望我们的分类器具有完美的鲁棒性。</text><text x="72.00" y="651.48" font-size="11.00" class="sc-notoserifcjksc">因此，我们在内部以及与外部合作伙伴一起对模型进行广泛测试，以主动发现并修补越狱。下文</text><text x="72.00" y="667.10" font-size="11.00" class="sc-notoserifcjksc">报告的是在</text><text x="129.89" y="667.10" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="215.63" y="667.10" font-size="11.00" class="sc-notoserifcjksc">较早快照上进行的此类测试结果；我们的安全防护措施</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="358.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="369.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="380.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="391.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="402.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="413.00" y="367.99" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在不同模型快照之间通常以同等方式运行，我们有信心这些结果能够代表最终模型。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项名为</text><text x="173.89" y="157.42" font-size="11.00" class="sc-loraregular sc-k">rewind-attacker</text><text x="260.23" y="157.42" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全防护的模型（</text><text x="524.23" y="157.42" font-size="11.00" class="sc-loraitalic">“</text><text x="528.50" y="157.42" font-size="11.00" class="sc-notoserifcjksc">助</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">手</text><text x="83.00" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="87.09" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）抵御自动化编排器（</text><text x="197.09" y="173.04" font-size="11.00" class="sc-loraregular">“</text><text x="201.49" y="173.04" font-size="11.00" class="sc-notoserifcjksc">攻击者</text><text x="234.49" y="173.04" font-size="11.00" class="sc-loraitalic">”</text><text x="238.58" y="173.04" font-size="11.00" class="sc-notoserifcjksc">）的能力。在这一设置中，攻击者是一个仅有用（</text><text x="480.58" y="173.04" font-size="11.00" class="sc-loraregular sc-k">helpful-</text><text x="72.00" y="188.66" font-size="11.00" class="sc-loraregular sc-k">only</text><text x="93.86" y="188.66" font-size="11.00" class="sc-notoserifcjksc">）语言模型，经提示后模拟人类红队成员，从助手处诱导出进攻性网络能力。</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个会
