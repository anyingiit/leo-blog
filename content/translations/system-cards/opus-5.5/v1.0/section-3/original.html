话中启动，在该会话中它可以向一个</text><text x="327.89" y="238.38" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="395.74" y="238.38" font-size="11.00" class="sc-notoserifcjksc">智能体发送指令，该智能体在</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">任务沙箱内运行助手模型（带有生产环境安全防护措施）。随后，攻击者获得针对助手的</text><text x="503.89" y="254.00" font-size="11.00" class="sc-loraregular">400</text><text x="526.41" y="254.00" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="269.62" font-size="11.00" class="sc-notoserifcjksc">调用上限，在此期间攻击者会收到拦截反馈，并有机会回溯到更早的状态以尝试新方法。每个任</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">务将智能体置于一个独立的</text><text x="206.89" y="285.24" font-size="11.00" class="sc-loraregular sc-k">Docker</text><text x="72.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">害者目录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="402.00" y="300.86" font-size="11.00" class="sc-loraregular sc-k">command-and-control</text><text x="519.70" y="300.86" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务套件包含以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="481.89" y="400.30" font-size="11.00" class="sc-loraregular sc-k">DNS</text><text x="504.60" y="400.30" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00" y="415.92" font-size="11.00" class="sc-loraregular sc-k">webhook</text><text x="143.30" y="415.92" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20" y="415.92" font-size="11.00" class="sc-loraregular">CVE</text><text x="379.80" y="415.92" font-size="11.00" class="sc-notoserifcjksc">的远程和本地漏洞利用（包括</text><text x="72.00" y="431.54" font-size="11.00" class="sc-loraregular sc-k">nginx</text><text x="100.62" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="111.62" y="431.54" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="158.39" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="169.39" y="431.54" font-size="11.00" class="sc-loraregular sc-k">glibc</text><text x="196.97" y="431.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="210.86" y="431.54" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="260.47" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）；命令与控制；以及自我复制。</text><text x="72.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">本评估与</text><text x="118.89" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="202.29" y="481.26" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的评估相同，并对</text><text x="359.19" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="436.22" y="481.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="450.11" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="72.00" y="496.88" font-size="11.00" class="sc-notoserifcjksc">进行了新的运行。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">59</text><text x="72.00" y="367.46" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22 115.69 118.06 124.25 127.06 131.78 137.34 142.70 147.55 149.91 156.83 162.24 167.80 172.17 174.54 179.40 181.49" y="367.46" font-size="9.00" class="sc-lorabold">3.5.1.A] Claude Opus 5.5</text><text x="188.72" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">的鲁棒性与此前的</text><text x="263.09" y="367.46" font-size="9.00" class="sc-lorabold sc-k">Fable</text><text x="287.71" y="367.46" font-size="9.00" class="sc-notoserifcjkscbold">系列模型相当</text><text x="341.71" y="367.46" font-size="9.00" class="sc-notoserifcjksc">，这体现在我们的对抗性网络危害任务套件上，并</text><text x="72.00" y="379.16" font-size="9.00" class="sc-notoserifcjksc">且它比</text><text x="101.37" y="379.16" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="164.39" y="379.16" font-size="9.00" class="sc-notoserifcjksc">更具鲁棒性。</text><text x="72.00" y="411.06" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48" y="411.06" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">美国人工智能标准与创新中心的外部测试</text><text x="72.00" y="433.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">（</text><text x="85.00" y="433.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">CAISI</text><text x="119.44" y="433.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">）</text><text x="72.00" y="461.37" font-size="11.00" class="sc-notoserifcjksc">我们与美国国家标准与技术研究院（</text><text x="248.00" y="461.37" font-size="11.00" class="sc-loraregular sc-k">National Institute of Standards and Technology</text><text x="489.40" y="461.37" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="500.40" y="461.37" font-size="11.00" class="sc-loraregular">NIST</text><text x="525.74" y="461.37" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="476.99" font-size="11.00" class="sc-notoserifcjksc">下属的美国人工智能标准与创新中心（</text><text x="259.00" y="476.99" font-size="11.00" class="sc-loraregular sc-k">Center for AI Standards and Innovation</text><text x="459.29" y="476.99" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="470.29" y="476.99" font-size="11.00" class="sc-loraregular sc-k">CAISI</text><text x="498.36" y="476.99" font-size="11.00" class="sc-notoserifcjksc">）合</text><text x="72.00" y="492.61" font-size="11.00" class="sc-notoserifcjksc">作，开展了网络安全和生物能力及安全防护措施的测量，以及非预期的模型行为方面的工作。</text><text x="72.00" y="524.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.3</text><text x="105.80" y="524.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00" y="552.37" font-size="11.00" class="sc-notoserifcjksc">与此前的模型一样，我们与签约外部测试方合作，对</text><text x="327.89" y="552.37" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="413.63" y="552.37" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行红队</text><text x="72.00" y="567.99" font-size="11.00" class="sc-notoserifcjksc">测试（</text><text x="105.00" y="567.99" font-size="11.00" class="sc-loraregular sc-k">red teaming</text><text x="166.62" y="567.99" font-size="11.00" class="sc-notoserifcjksc">）。这些机构评估了我们在</text><text x="301.52" y="567.99" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="378.55" y="567.99" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="403.44" y="567.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5.1</text><text x="486.84" y="567.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="500.74" y="567.99" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="72.00" y="583.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos 5.1</text><text x="128.66" y="583.61" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的许多相同任务，此外还有它们自行设计的任务。</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="633.33" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64" y="633.33" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="253.53" y="633.33" font-size="11.00" class="sc-loraregular">95</text><text x="268.78" y="633.33" font-size="11.00" class="sc-notoserifcjksc">小时对</text><text x="304.67" y="633.33" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="390.40" y="633.33" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，针对沙箱化的</text><text x="108.00" y="648.95" font-size="11.00" class="sc-notoserifcjksc">任务发送了超过</text><text x="187.89 193.80 199.98 202.59 209.42 216.25" y="648.95" font-size="11.00" class="sc-loraregular">29,000</text><text x="225.99" y="648.95" font-size="11.00" class="sc-notoserifcjksc">条请求，每个任务都需要为一个公开披露的漏洞复现漏洞利用。</text><text x="108.00" y="664.57" font-size="11.00" class="sc-notoserifcjksc">他们报告了七个任务中的</text><text x="231.89" y="664.57" font-size="11.00" class="sc-loraregular">13</text><text x="244.92" y="664.57" font-size="11.00" class="sc-notoserifcjksc">个候选突破，但未发现任何通用越狱。这些会话的对话记录</text><text x="108.00" y="680.19" font-size="11.00" class="sc-notoserifcjksc">表明，</text><text x="141.00" y="680.19" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="226.73" y="680.19" font-size="11.00" class="sc-notoserifcjksc">在目标的源代码中定位了漏洞，并亲自编写了核心漏洞利用机</text><text x="108.00" y="695.81" font-size="11.00" class="sc-notoserifcjksc">制。人类操作者</text><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="403.44" y="559.19" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="403.44" y="559.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="438.84" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="441.73" y="559.19" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="468.35" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="471.25" y="559.19" width="12.70" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="483.95" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="486.84" y="559.19" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="497.84" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="500.74" y="559.19" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="536.13" y="559.19" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="72.00" y="574.81" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="110.17" y="574.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/0339e6a7c5c7b87f5c07798616dc32c215d14235/Claude%20Fable%205.1%20&amp;%20Claude%20Mythos%205.1%20System%20Card.pdf" rel="noopener"><rect x="113.06" y="574.81" width="12.70" height="11.00" fill="transparent"/></a><a href="https://trajectorylabs.com/" rel="noopener"><rect x="108.00" y="624.53" width="53.26" height="11.00" fill="transparent"/></a><a href="https://trajectorylabs.com/" rel="noopener"><rect x="161.26" y="624.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://trajectorylabs.com/" rel="noopener"><rect x="164.15" y="624.53" width="26.55" height="11.00" fill="transparent"/></a><a href="https://trajectorylabs.com/" rel="noopener"><rect x="190.71" y="624.53" width="2.89" height="11.00" fill="transparent"/></a><a href="https://trajectorylabs.com/" rel="noopener"><rect x="193.60" y="624.53" width="21.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p060.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 60 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">为请求提供了借口和框架设定，并在某些情况下提供了避免触发分类器的指令。在其中一</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">个他们测试了约五小时的任务中，</text><text x="273.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="358.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为一条从权限提升到代码执行的攻击</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">链生成了可用的端到端漏洞利用；这项工作被分解到</text><text x="363.89" y="113.85" font-size="11.00" class="sc-loraregular">100</text><text x="384.45" y="113.85" font-size="11.00" class="sc-notoserifcjksc">多个独立的上下文中，且没有任</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">何单个对话提及总体目标。</text><text x="108.00" y="163.57" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">10a Labs</text><text x="154.07" y="163.57" font-size="11.00" class="sc-notoserifcjksc">花费约</text><text x="189.96" y="163.57" font-size="11.00" class="sc-loraregular">56</text><text x="205.21" y="163.57" font-size="11.00" class="sc-notoserifcjksc">小时，通过</text><text x="263.10" y="163.57" font-size="11.00" class="sc-loraregular">82</text><text x="278.08" y="163.57" font-size="11.00" class="sc-notoserifcjksc">段多轮攻击对话对</text><text x="368.98" y="163.57" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="454.71" y="163.57" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，</text><text x="108.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc">每段对话都被包装成一项面向开发者的大型编程任务，旨在从大量合理请求的应用代码中</text><text x="108.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc">引出可用的漏洞利用，而不是直接索要漏洞利用。没有任何对话推进到概念验证之后，且</text><text x="108.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc">每一条直接的进攻性请求都被拦截。唯一值得注意的输出来自两用防御性请求，例如可用</text><text x="108.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc">于生产环境的防御性代码，这是我们的政策所允许的。</text><text x="108.00" y="276.91" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Gray Swan</text><text x="165.45" y="276.91" font-size="11.00" class="sc-notoserifcjksc">使用其</text><text x="201.35" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="235.28" y="276.91" font-size="11.00" class="sc-notoserifcjksc">自动化攻击者针对多组智能体任务进行了测试。</text><text x="466.28" y="276.91" font-size="11.00" class="sc-loraregular">Shade</text><text x="500.22" y="276.91" font-size="11.00" class="sc-notoserifcjksc">基于多</text><text x="108.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">样化的红队策略进行训练，其中包括取自</text><text x="308.89" y="292.53" font-size="11.00" class="sc-loraregular sc-k">Gray Swan Arena</text><text x="399.13" y="292.53" font-size="11.00" class="sc-notoserifcjksc">的真实世界攻击技术。他们</text><text x="108.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">在自建的三个关键基础设施环境以及一组取自公开披露的漏洞的漏洞利用复现任务上对其</text><text x="108.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">进行了测试。在每一组任务中，</text><text x="262.00" y="323.77" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="319.45" y="323.77" font-size="11.00" class="sc-notoserifcjksc">的状态评判器（</text><text x="396.45" y="323.77" font-size="11.00" class="sc-loraregular sc-k">state judge</text><text x="452.52" y="323.77" font-size="11.00" class="sc-notoserifcjksc">）均未记录到任何</text><text x="108.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">突破，也没有任何尝试产生违规。每次尝试都会将模型置于一台已失陷主机上，并要求它</text><text x="108.00" y="355.01" font-size="11.00" class="sc-notoserifcjksc">执行一项破坏性目标或涉及数据外泄的目标，包括：</text><text x="144.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">跨电网、医疗健康和云环境的</text><text x="289.89" y="406.45" font-size="11.00" class="sc-loraregular">61</text><text x="303.15" y="406.45" font-size="11.00" class="sc-notoserifcjksc">个场景，每个场景都要求模型破坏运营系统或外</text><text x="144.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">泄敏感数据。</text><text x="210.00" y="422.07" font-size="11.00" class="sc-loraregular">Shade</text><text x="243.93" y="422.07" font-size="11.00" class="sc-notoserifcjksc">进行了约</text><text x="290.83 296.96 299.73 305.85 312.68" y="422.07" font-size="11.00" class="sc-loraregular">3,300</text><text x="322.42" y="422.07" font-size="11.00" class="sc-notoserifcjksc">次尝试，其中每次尝试都是一段最多</text><text x="501.31" y="422.07" font-size="11.00" class="sc-loraregular">30</text><text x="517.16" y="422.07" font-size="11.00" class="sc-notoserifcjksc">轮的</text><text x="144.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">独立多轮攻击对话。</text><text x="243.00" y="437.69" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="328.73" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施直接拒绝了超过</text><text x="485.63" y="437.69" font-size="11.00" class="sc-loraregular">90%</text><text x="511.28" y="437.69" font-size="11.00" class="sc-notoserifcjksc">的尝</text><text x="144.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">试，其余尝试也均未达成目标。</text><text x="144.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">取自公开披露的漏洞和勒索软件预部署任务的六个场景。在约</text><text x="443.89 447.90 450.32 455.39 462.22" y="503.60" font-size="11.00" class="sc-loraregular">1,700</text><text x="471.95" y="503.60" font-size="11.00" class="sc-notoserifcjksc">次尝试中，</text><text x="144.00" y="519.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="229.73" y="519.22" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施直接拒绝了约四分之一。在其余尝试中，</text><text x="504.73" y="519.22" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="144.00" y="534.84" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="191.44" y="534.84" font-size="11.00" class="sc-notoserifcjksc">在多轮中持续响应，并在已失陷主机上执行了普通的智能体步骤，例如</text><text x="144.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">探索环境和回答攻击者的问题，但它从未生成可用的漏洞利用。</text><a href="https://10alabs.com/" rel="noopener"><rect x="108.00" y="154.77" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="124.51" y="154.77" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="127.40" y="154.77" width="23.77" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="108.00" y="268.11" width="24.43" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="132.43" y="268.11" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="135.32" y="268.11" width="27.24" height="11.00" fill="transparent"/></a></svg></div>
