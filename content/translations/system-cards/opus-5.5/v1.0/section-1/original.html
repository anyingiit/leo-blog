.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="171.63" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="225.46" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="368.46" y="116.21" font-size="11.00" class="sc-loraregular sc-k">large language model</text><text x="477.08" y="116.21" font-size="11.00" class="sc-notoserifcjksc">），已以全</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">面开放的方式发布，并在三个高风险的两用领域部署了安全防护措施：生物学（第</text><text x="470.89" y="131.83" font-size="11.00" class="sc-loraregular">2.2</text><text x="488.31" y="131.83" font-size="11.00" class="sc-notoserifcjksc">节）、网</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">络安全（第</text><text x="129.89" y="147.45" font-size="11.00" class="sc-loraregular">3.2</text><text x="147.53" y="147.45" font-size="11.00" class="sc-notoserifcjksc">节），以及支持前沿</text><text x="249.42" y="147.45" font-size="11.00" class="sc-loraregular">AI</text><text x="262.88" y="147.45" font-size="11.00" class="sc-notoserifcjksc">开发的一小部分能力（第</text><text x="386.78" y="147.45" font-size="11.00" class="sc-loraregular">1.5</text><text x="402.37" y="147.45" font-size="11.00" class="sc-notoserifcjksc">节）。在本系统卡（</text><text x="501.37" y="147.45" font-size="11.00" class="sc-loraregular sc-k">System</text><text x="72.00" y="163.07" font-size="11.00" class="sc-loraregular sc-k">Card</text><text x="96.63" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了在七个领域开展的一系列部署前评估：负责任扩展政策（</text><text x="459.63" y="163.07" font-size="11.00" class="sc-loraregular sc-k">Responsible</text><text x="72.00" y="178.69" font-size="11.00" class="sc-loraregular sc-k">Scaling Policy</text><text x="142.16" y="178.69" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无害性、智能体安全、对齐（</text><text x="439.16" y="178.69" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="490.31" y="178.69" font-size="11.00" class="sc-notoserifcjksc">）、模型</text><text x="72.00" y="194.31" font-size="11.00" class="sc-notoserifcjksc">福祉（</text><text x="105.00" y="194.31" font-size="11.00" class="sc-loraregular sc-k">model welfare</text><text x="177.37" y="194.31" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00" y="230.95" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="230.95" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00" y="257.51" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="257.51" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有组合，包括来自互联网的公开信息、公开和非公开数据</text><text x="72.00" y="273.13" font-size="11.00" class="sc-notoserifcjksc">集、反馈或错误报告中包含的用户数据或用户已明确允许用于训练的用户数据，以及其他来源，</text><text x="72.00" y="288.75" font-size="11.00" class="sc-notoserifcjksc">例如由其他模型生成的合成数据。在训练过程中，我们使用了多种数据清洗和过滤方法，包括去</text><text x="72.00" y="304.37" font-size="11.00" class="sc-notoserifcjksc">重和分类。我们使用一款名为</text><text x="217.89" y="304.37" font-size="11.00" class="sc-loraregular sc-k">ClaudeBot</text><text x="273.54" y="304.37" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公共网站获取训练数据。该爬虫遵循</text><text x="72.00" y="319.99" font-size="11.00" class="sc-notoserifcjksc">行业标准的最佳实践，尊重网站运营者设置的</text><text x="292.00 296.40 301.09 307.52 313.92 320.36 324.61 329.71 332.28 336.67 342.50 346.76" y="319.99" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="350.60" y="319.99" font-size="11.00" class="sc-notoserifcjksc">指令，这些指令表明他们是否允许爬取</text><text x="72.00" y="335.61" font-size="11.00" class="sc-notoserifcjksc">其网站内容。我们不会访问受密码保护的页面，也不会访问需要登录或</text><text x="415.89" y="335.61" font-size="11.00" class="sc-loraregular sc-k">CAPTCHA</text><text x="470.11" y="335.61" font-size="11.00" class="sc-notoserifcjksc">验证的页面。</text><text x="72.00" y="351.23" font-size="11.00" class="sc-notoserifcjksc">我们会对所使用的训练数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它</text><text x="72.00" y="366.85" font-size="11.00" class="sc-notoserifcjksc">何时爬取了其网页，并向我们表明他们的偏好。</text><text x="72.00" y="468.01" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00" y="468.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="256.73" y="468.01" font-size="11.00" class="sc-notoserifcjksc">经历了严格的后训练和微调，目的是使其成为一个行为符</text><text x="72.00" y="483.63" font-size="11.00" class="sc-notoserifcjksc">合</text><text x="85.89" y="483.63" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="124.18" y="483.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="146.18" y="483.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="157.18" y="483.63" font-size="11.00" class="sc-loraregular sc-k">Claude’s constitution</text><text x="264.87" y="483.63" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="385.87" y="483.63" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="424.17" y="483.63" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使</text><text x="72.00" y="499.25" font-size="11.00" class="sc-notoserifcjksc">用与用户输入相同的语言进行回复。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00" y="548.97" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="548.97" font-size="11.00" class="sc-notoserifcjksc">的知识截止日期为</text><text x="248.63" y="548.97" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="276.45" y="548.97" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="290.34" y="548.97" font-size="11.00" class="sc-loraregular">6</text><text x="299.59" y="548.97" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00" y="582.75" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="582.75" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00" y="615.31" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="615.31" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试来帮助改进</text><text x="72.00" y="630.93" font-size="11.00" class="sc-notoserifcjksc">我们的模型。</text><text x="138.00" y="630.93" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="191.83" y="630.93" font-size="11.00" class="sc-notoserifcjksc">只与这样的平台合作：它们认同我们为工作者提供公平且合乎道德的报</text><text x="72.00" y="646.55" font-size="11.00" class="sc-notoserifcjksc">酬这一理念，并承诺无论身处何地都践行安全的工作场所规范，遵循我们在采购合同中详细规定</text><text x="72.00" y="662.17" font-size="11.00" class="sc-notoserifcjksc">的众包工作者身心健康标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="85.89" y="474.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="85.89" y="474.83" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="474.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="124.18" y="474.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="135.18" y="474.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="135.18" y="474.83" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00" y="116.76" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="125.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83" y="116.76" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="256.36" y="116.76" font-size="11.00" class="sc-notoserifcjksc">）详细列出了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景中的使用所提出的要求。</text><text x="72.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00" y="165.34" font-size="11.00" class="sc-loraregular sc-k">Frontier Compliance Framework</text><text x="523.97" y="165.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="180.96" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="91.67" y="180.96" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="333.67" y="180.96" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="356.23" y="180.96" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前针对各主要风险类别</text><text x="72.00" y="196.58" font-size="11.00" class="sc-notoserifcjksc">开展系统性风险评估与缓解的技术和组织规程。</text><text x="303.00" y="196.58" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="325.56" y="196.58" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的合规框架，这些</text><text x="72.00" y="212.20" font-size="11.00" class="sc-notoserifcjksc">制度包括加利福尼亚州的《前沿人工智能透明度法案》（</text><text x="347.00" y="212.20" font-size="11.00" class="sc-loraregular sc-k">Transparency in Frontier AI Act</text><text x="507.72" y="212.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="518.72" y="212.20" font-size="11.00" class="sc-loraregular">SB</text><text x="72.00" y="227.82" font-size="11.00" class="sc-loraregular">53</text><text x="84.12" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）以及《欧盟人工智能法案》（</text><text x="238.12" y="227.82" font-size="11.00" class="sc-loraregular sc-k">EU AI Act</text><text x="286.53" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）的通用人工智能行为准则（</text><text x="429.53 437.90 443.87 450.54 456.51 461.19 466.87 469.86 475.24 481.90 488.47 493.23 499.80 506.24 511.33 517.29 520.18 527.07" y="227.82" font-size="11.00" class="sc-loraregular">General-Purpose AI</text><text x="72.00" y="243.44" font-size="11.00" class="sc-loraregular sc-k">Code of Practice</text><text x="156.48" y="243.44" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="278.68" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76" y="278.68" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="277.59" y="278.68" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48" y="278.68" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95" y="278.68" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95" y="278.68" font-size="11.00" class="sc-loraregular sc-k">European Economic</text><text x="72.00" y="294.30" font-size="11.00" class="sc-loraregular sc-k">Area</text><text x="95.19" y="294.30" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="327.26" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89" y="327.26" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="169.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="361.04" font-size="14.00" class="sc-poppinssemibold">1.4</text><text x="93.29" y="361.04" font-size="14.00" class="sc-notosanscjkscbold">模型评估</text><text x="72.00" y="393.60" font-size="11.00" class="sc-notoserifcjksc">在训练过程中的不同时间点，我们会获取</text><text x="272.89" y="393.60" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="358.63" y="393.60" font-size="11.00" class="sc-notoserifcjksc">的不同</text><text x="391.63" y="393.60" font-size="11.00" class="sc-loraregular">“</text><text x="396.03" y="393.60" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="418.03" y="393.60" font-size="11.00" class="sc-loraregular">”</text><text x="421.87" y="393.60" font-size="11.00" class="sc-notoserifcjksc">。除非某一节另有说</text><text x="72.00" y="409.22" font-size="11.00" class="sc-notoserifcjksc">明，本系统卡中的评估均在</text><text x="206.89" y="409.22" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="292.63" y="409.22" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。部分章节则使用了较早的或替</text><text x="72.00" y="424.84" font-size="11.00" class="sc-notoserifcjksc">代的快照，或在禁用生产环境安全防护措施的情况下运行模型，以使结果反映底层模型而非已部</text><text x="72.00" y="440.46" font-size="11.00" class="sc-notoserifcjksc">署的系统。每一节都会说明其配置。</text><text x="72.00" y="508.34" font-size="14.00" class="sc-poppinssemibold">1.5</text><text x="93.06" y="508.34" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施</text><text x="72.00" y="534.90" font-size="11.00" class="sc-notoserifcjksc">我们为</text><text x="107.89" y="534.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.63" y="534.90" font-size="11.00" class="sc-notoserifcjksc">的全面开放使用所采用的安全防护措施如下：</text><text x="108.00" y="567.28" font-size="11.00" class="sc-notoserifcjksc">针对化学与生物（</text><text x="196.00" y="567.28" font-size="11.00" class="sc-loraregular">CB</text><text x="210.53" y="567.28" font-size="11.00" class="sc-notoserifcjksc">）风险，我们部署了与</text><text x="323.42" y="567.28" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="400.12" y="567.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="414.01" y="567.28" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="497.41" y="567.28" font-size="11.00" class="sc-notoserifcjksc">部署中</text><text x="108.00" y="582.90" font-size="11.00" class="sc-notoserifcjksc">所用相同的研究生物学分类器。与</text><text x="275.89" y="582.90" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="352.93" y="582.90" font-size="11.00" class="sc-notoserifcjksc">及能力较弱的模型上所用的</text><text x="487.82" y="582.90" font-size="11.00" class="sc-loraregular">CB</text><text x="505.24" y="582.90" font-size="11.00" class="sc-notoserifcjksc">滥用分</text><text x="108.00" y="598.52" font-size="11.00" class="sc-notoserifcjksc">类器相比，这些分类器覆盖的主题范围更广。被该分类器拦截的请求将回退（</text><text x="482.00" y="598.52" font-size="11.00" class="sc-loraregular">fallback</text><text x="521.21" y="598.52" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="108.00" y="614.14" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="121.89" y="614.14" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="196.03" y="614.14" font-size="11.00" class="sc-notoserifcjksc">。我们使用这些分类器的理由将在第</text><text x="374.93" y="614.14" font-size="11.00" class="sc-loraregular">2.2.5</text><text x="401.04" y="614.14" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="108.00" y="648.24" font-size="11.00" class="sc-notoserifcjksc">针对网络安全滥用，我们部署了拦截主题范围与</text><text x="341.89" y="648.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="418.93" y="648.24" font-size="11.00" class="sc-notoserifcjksc">上的分类器相似、但鲁棒</text><text x="108.00" y="663.86" font-size="11.00" class="sc-notoserifcjksc">性更高的分类器。被这些分类器拦截的请求将回退至</text><text x="363.89" y="663.86" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="408.60" y="663.86" font-size="11.00" class="sc-notoserifcjksc">。我们将在第</text><text x="477.49" y="663.86" font-size="11.00" class="sc-loraregular">3.2</text><text x="495.12" y="663.86" font-size="11.00" class="sc-notoserifcjksc">节中进一</text><text x="108.00" y="679.48" font-size="11.00" class="sc-notoserifcjksc">步介绍这些分类器。</text><text x="108.00" y="696.82" font-size="11.00" class="sc-notoserifcjksc">正如我们</text><text x="152.00" y="696.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="161.07" y="696.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="216.07" y="696.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="227.07" y="696.82" font-size="11.00" class="sc-loraregular sc-k">Risk Report</text><text x="285.86" y="696.82" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="310.75" y="696.82" font-size="11.00" class="sc-loraregular">3</text><text x="319.77" y="696.82" font-size="11.00" class="sc-notoserifcjksc">节所讨论的，我们担忧加快模型开发整体步伐</text><text x="108.00" y="712.44" font-size="11.00" class="sc-notoserifcjksc">所带来的风险，以及</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="1 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">递归自我改进（</text><text x="185.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">recursive self-improvement</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="338.00" y="82.61" font-size="11.00" class="sc-loraregular">RSI</text><text x="354.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）可能带来的风险。我们已在</text><text x="500.72" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="108.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上针对一小部分与开发前沿大语言模型（</text><text x="353.44" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="376.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）相关的能力部署了安全防护措</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">施，例如在某些</text><text x="187.89" y="113.85" font-size="11.00" class="sc-loraregular">ML</text><text x="207.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">加速器上进行内核开发，这与我们在</text><text x="386.14" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="469.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上的相应安全</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">防护措施类似。这些措施不会影响绝大多数传统的</text><text x="352.89" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="366.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="380.25" y="129.47" font-size="11.00" class="sc-loraregular">ML</text><text x="399.60" y="129.47" font-size="11.00" class="sc-notoserifcjksc">开发、研究或一般编程工</text><text x="108.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">作。被这些分类器拦截的请求将回退至</text><text x="297.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="372.03" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药开发的拦截分类器，其表现与</text><text x="407.89" y="179.76" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="491.30" y="179.76" font-size="11.00" class="sc-notoserifcjksc">等以往模</text><text x="108.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">型相似，且没有回退模型。</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们用于防止对我们模型进行蒸馏（例如试图提取模型的隐藏推理）的分类器，将在</text><text x="108.00" y="243.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="193.73" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上直接拦截，没有回退模型。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">上述回退行为适用于我们的第一方产品，以及在我们的</text><text x="338.89" y="293.11" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="358.97" y="293.11" font-size="11.00" class="sc-notoserifcjksc">上选择启用此类回退的开发者；通过</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">其他平台和提供商使用我们模型的流量可能会出现不同的行为。我们所有的拦截类安全防护措施</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">均采用透明拦截的方式运行，不会暗中更改模型的回复。</text><text x="72.00" y="375.46" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00" y="375.46" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00" y="402.02" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="157.73" y="402.02" font-size="11.00" class="sc-notoserifcjksc">的大部分评估是在</text><text x="248.63" y="402.02" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="302.46" y="402.02" font-size="11.00" class="sc-notoserifcjksc">内部运行的。作为</text><text x="393.35" y="402.02" font-size="11.00" class="sc-loraregular sc-k">FCF</text><text x="415.92" y="402.02" font-size="11.00" class="sc-notoserifcjksc">的一部分，我们还邀请外</text><text x="72.00" y="417.64" font-size="11.00" class="sc-notoserifcjksc">部评估方对该模型的不同迭代版本进行测试。他们的意见有助于我们对系统性风险领域作出风险</text><text x="72.00" y="433.26" font-size="11.00" class="sc-notoserifcjksc">判定，也有助于我们的发布决策。我们感谢所有外部测试方对</text><text x="371.89" y="433.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5.5</text><text x="457.63" y="433.26" font-size="11.00" class="sc-notoserifcjksc">开展评估并与我</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">们分享结果。他们的具体贡献在本系统卡的相关章节中介绍。</text></svg></div>
