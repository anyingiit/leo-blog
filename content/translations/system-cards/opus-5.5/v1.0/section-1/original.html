.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p011.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 11 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">11</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">1</text><text x="81.60" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">引言</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="116.21" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="116.21" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="171.63 178.51 185.09 189.35 195.94 200.62 207.06 213.62 216.72" y="116.21" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="225.46" y="116.21" font-size="11.00" class="sc-notoserifcjksc">推出的一款新的大语言模型（</text><text x="368.46 371.45 377.13 381.84 387.87 393.83 396.72 399.71 405.39 412.07 418.15 424.72 430.39 436.42 442.38 445.27 455.11 461.54 468.12 474.08" y="116.21" font-size="11.00" class="sc-loraregular">large language model</text><text x="477.08" y="116.21" font-size="11.00" class="sc-notoserifcjksc">），已以全</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">面开放的方式发布，并在三个高风险的两用领域部署了安全防护措施：生物学（第</text><text x="470.89" y="131.83" font-size="11.00" class="sc-loraregular">2.2</text><text x="488.31" y="131.83" font-size="11.00" class="sc-notoserifcjksc">节）、网</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">络安全（第</text><text x="129.89" y="147.45" font-size="11.00" class="sc-loraregular">3.2</text><text x="147.53" y="147.45" font-size="11.00" class="sc-notoserifcjksc">节），以及支持前沿</text><text x="249.42" y="147.45" font-size="11.00" class="sc-loraregular">AI</text><text x="262.88" y="147.45" font-size="11.00" class="sc-notoserifcjksc">开发的一小部分能力（第</text><text x="386.78" y="147.45" font-size="11.00" class="sc-loraregular">1.5</text><text x="402.37" y="147.45" font-size="11.00" class="sc-notoserifcjksc">节）。在本系统卡（</text><text x="501.37 507.56 513.36 518.46 522.71 528.68" y="147.45" font-size="11.00" class="sc-loraregular">System</text><text x="72.00 79.69 85.37 90.05" y="163.07" font-size="11.00" class="sc-loraregular">Card</text><text x="96.63" y="163.07" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了在七个领域开展的一系列部署前评估：负责任扩展政策（</text><text x="459.63 466.46 472.42 477.51 484.08 490.52 497.19 502.29 505.38 511.78 514.77" y="163.07" font-size="11.00" class="sc-loraregular">Responsible</text><text x="72.00 78.24 84.07 89.74 92.74 95.83 102.50 108.59 111.48 118.04 124.47 127.46 130.55 136.35" y="178.69" font-size="11.00" class="sc-loraregular">Scaling Policy</text><text x="142.16" y="178.69" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无害性、智能体安全、对齐（</text><text x="439.16 444.83 447.83 450.92 457.00 463.68 473.51 479.47 486.05" y="178.69" font-size="11.00" class="sc-loraregular">alignment</text><text x="490.31" y="178.69" font-size="11.00" class="sc-notoserifcjksc">）、模型</text><text x="72.00" y="194.31" font-size="11.00" class="sc-notoserifcjksc">福祉（</text><text x="105.00 114.83 121.27 127.85 133.81 136.80 139.69 148.37 154.33 157.33 161.04 166.72 171.41" y="194.31" font-size="11.00" class="sc-loraregular">model welfare</text><text x="177.37" y="194.31" font-size="11.00" class="sc-notoserifcjksc">）以及能力。</text><text x="72.00" y="230.95" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11" y="230.95" font-size="14.00" class="sc-notosanscjkscbold">训练数据与过程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="257.51" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="257.51" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一个专有组合，包括来自互联网的公开信息、公开和非公开数据</text><text x="72.00" y="273.13" font-size="11.00" class="sc-notoserifcjksc">集、反馈或错误报告中包含的用户数据或用户已明确允许用于训练的用户数据，以及其他来源，</text><text x="72.00" y="288.75" font-size="11.00" class="sc-notoserifcjksc">例如由其他模型生成的合成数据。在训练过程中，我们使用了多种数据清洗和过滤方法，包括去</text><text x="72.00" y="304.37" font-size="11.00" class="sc-notoserifcjksc">重和分类。我们使用一款名为</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.12 259.96 266.39" y="304.37" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="273.54" y="304.37" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公共网站获取训练数据。该爬虫遵循</text><text x="72.00" y="319.99" font-size="11.00" class="sc-notoserifcjksc">行业标准的最佳实践，尊重网站运营者设置的</text><text x="292.00 296.40 301.09 307.52 313.92 320.36 324.61 329.71 332.28 336.67 342.50 346.76" y="319.99" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="350.60" y="319.99" font-size="11.00" class="sc-notoserifcjksc">指令，这些指令表明他们是否允许爬取</text><text x="72.00" y="335.61" font-size="11.00" class="sc-notoserifcjksc">其网站内容。我们不会访问受密码保护的页面，也不会访问需要登录或</text><text x="415.89 423.47 430.36 437.02 444.06 451.75 460.33" y="335.61" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="470.11" y="335.61" font-size="11.00" class="sc-notoserifcjksc">验证的页面。</text><text x="72.00" y="351.23" font-size="11.00" class="sc-notoserifcjksc">我们会对所使用的训练数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识别它</text><text x="72.00" y="366.85" font-size="11.00" class="sc-notoserifcjksc">何时爬取了其网页，并向我们表明他们的偏好。</text><text x="72.00" y="468.01" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 218.03 224.59 231.16 236.25 239.15 245.14 247.85" y="468.01" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="256.73" y="468.01" font-size="11.00" class="sc-notoserifcjksc">经历了严格的后训练和微调，目的是使其成为一个行为符</text><text x="72.00" y="483.63" font-size="11.00" class="sc-notoserifcjksc">合</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="483.63" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="124.18" y="483.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="146.18" y="483.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="157.18 164.87 167.87 173.48 180.04 186.62 192.36 194.08 199.17 202.06 207.86 214.30 220.97 226.07 230.32 233.59 237.85 244.41 248.67 251.76 258.20" y="483.63" font-size="11.00" class="sc-loraregular">Claude’s constitution</text><text x="264.87" y="483.63" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="385.87 393.56 396.56 402.17 408.73 415.31" y="483.63" font-size="11.00" class="sc-loraregular">Claude</text><text x="424.17" y="483.63" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使</text><text x="72.00" y="499.25" font-size="11.00" class="sc-notoserifcjksc">用与用户输入相同的语言进行回复。输出质量因语言而异。该模型仅输出文本。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="548.97" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="548.97" font-size="11.00" class="sc-notoserifcjksc">的知识截止日期为</text><text x="248.63 254.53 261.29 267.20" y="548.97" font-size="11.00" class="sc-loraregular">2026</text><text x="276.45" y="548.97" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="290.34" y="548.97" font-size="11.00" class="sc-loraregular">6</text><text x="299.59" y="548.97" font-size="11.00" class="sc-notoserifcjksc">月。</text><text x="72.00" y="582.75" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08" y="582.75" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="615.31" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="615.31" font-size="11.00" class="sc-notoserifcjksc">与数据工作平台合作，招募工作者通过偏好选择、安全评估和对抗性测试来帮助改进</text><text x="72.00" y="630.93" font-size="11.00" class="sc-notoserifcjksc">我们的模型。</text><text x="138.00 144.89 151.46 155.72 162.31 167.00 173.43 180.00 183.09" y="630.93" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="191.83" y="630.93" font-size="11.00" class="sc-notoserifcjksc">只与这样的平台合作：它们认同我们为工作者提供公平且合乎道德的报</text><text x="72.00" y="646.55" font-size="11.00" class="sc-notoserifcjksc">酬这一理念，并承诺无论身处何地都践行安全的工作场所规范，遵循我们在采购合同中详细规定</text><text x="72.00" y="662.17" font-size="11.00" class="sc-notoserifcjksc">的众包工作者身心健康标准。</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="85.89" y="474.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="85.89" y="474.83" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="121.29" y="474.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="124.18" y="474.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="135.18" y="474.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="135.18" y="474.83" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="116.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="116.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="116.76" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36" y="116.76" font-size="11.00" class="sc-notoserifcjksc">）详细列出了我们模型的禁止用途，以及我们对高风险场</text><text x="72.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">景和其他特定场景中的使用所提出的要求。</text><text x="72.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="165.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00 363.92 368.60 375.04 381.62 385.87 388.97 394.93 399.69 402.58 410.27 416.71 426.54 433.11 436.10 439.19 444.87 451.54 457.34 463.30 466.20 472.11 476.80 482.48 492.31 498.23 506.91 513.34 518.06" y="165.34" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="523.97" y="165.34" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 77.95 85.64" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="91.67" y="180.96" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="333.67 339.62 347.31" y="180.96" font-size="11.00" class="sc-loraregular">FCF</text><text x="356.23" y="180.96" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前针对各主要风险类别</text><text x="72.00" y="196.58" font-size="11.00" class="sc-notoserifcjksc">开展系统性风险评估与缓解的技术和组织规程。</text><text x="303.00 308.95 316.64" y="196.58" font-size="11.00" class="sc-loraregular">FCF</text><text x="325.56" y="196.58" font-size="11.00" class="sc-notoserifcjksc">是我们针对适用监管制度的合规框架，这些</text><text x="72.00" y="212.20" font-size="11.00" class="sc-notoserifcjksc">制度包括加利福尼亚州的《前沿人工智能透明度法案》（</text><text x="347.00 353.88 358.56 364.24 370.91 376.01 382.57 388.25 392.94 398.90 405.57 411.37 417.18 420.07 423.16 429.84 432.73 438.65 443.34 449.77 456.35 460.61 463.70 469.66 474.42 477.32 484.20 487.89 490.78 497.67 503.46" y="212.20" font-size="11.00" class="sc-loraregular">Transparency in Frontier AI Act</text><text x="507.72" y="212.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="518.72" y="212.20" font-size="11.00" class="sc-loraregular">SB</text><text x="72.00" y="227.82" font-size="11.00" class="sc-loraregular">53</text><text x="84.12" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）以及《欧盟人工智能法案》（</text><text x="238.12 244.96 253.24 256.13 263.02 266.70 269.59 276.48 282.28" y="227.82" font-size="11.00" class="sc-loraregular">EU AI Act</text><text x="286.53" y="227.82" font-size="11.00" class="sc-notoserifcjksc">）的通用人工智能行为准则（</text><text x="429.53 437.90 443.87 450.54 456.51 461.19 466.87 469.86 475.24 481.90 488.47 493.23 499.80 506.24 511.33 517.29 520.18 527.07" y="227.82" font-size="11.00" class="sc-loraregular">General-Purpose AI</text><text x="72.00 79.69 86.12 92.70 98.66 101.56 107.94 111.65 114.55 121.21 125.90 131.58 137.37 141.63 144.72 150.52" y="243.44" font-size="11.00" class="sc-loraregular">Code of Practice</text><text x="156.48" y="243.44" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09 122.94 125.83 129.43 134.12 140.08 143.07 148.75 155.42 162.00 164.77 167.67 174.03 177.12 186.95 190.22 194.47 200.38" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic Ireland, Limited</text><text x="209.86" y="278.68" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="223.76 230.64 237.22 241.48 248.07 252.75 259.19 265.75 268.85" y="278.68" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="277.59" y="278.68" font-size="11.00" class="sc-notoserifcjksc">通用</text><text x="302.48" y="278.68" font-size="11.00" class="sc-loraregular">AI</text><text x="315.95" y="278.68" font-size="11.00" class="sc-notoserifcjksc">模型在欧洲经济区（</text><text x="414.95 421.69 428.26 432.94 439.38 445.95 451.89 457.56 464.24 467.13 473.97 479.77 486.21 492.88 499.32 509.15 512.24" y="278.68" font-size="11.00" class="sc-loraregular">European Economic</text><text x="72.00 78.89 83.57 89.51" y="294.30" font-size="11.00" class="sc-loraregular">Area</text><text x="95.19" y="294.30" font-size="11.00" class="sc-notoserifcjksc">）的提供方。</text><text x="72.00" y="327.26" font-size="11.00" class="sc-notoserifcjksc">如需联系</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98" y="327.26" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="169.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">，请访问我们的</text><text x="246.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">支持页面</text><text x="290.83" y="327.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="361.04" font-size="14.00" class="sc-poppinssemibold">1.4</text><text x="93.29" y="361.04" font-size="14.00" class="sc-notosanscjkscbold">模型评估</text><text x="72.00" y="393.60" font-size="11.00" class="sc-notoserifcjksc">在训练过程中的不同时间点，我们会获取</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 319.92 326.49 333.05 338.14 341.04 347.03 349.74" y="393.60" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="358.63" y="393.60" font-size="11.00" class="sc-notoserifcjksc">的不同</text><text x="391.63" y="393.60" font-size="11.00" class="sc-loraregular">“</text><text x="396.03" y="393.60" font-size="11.00" class="sc-notoserifcjksc">快照</text><text x="418.03" y="393.60" font-size="11.00" class="sc-loraregular">”</text><text x="421.87" y="393.60" font-size="11.00" class="sc-notoserifcjksc">。除非某一节另有说</text><text x="72.00" y="409.22" font-size="11.00" class="sc-notoserifcjksc">明，本系统卡中的评估均在</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.15 275.04 281.03 283.74" y="409.22" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="292.63" y="409.22" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。部分章节则使用了较早的或替</text><text x="72.00" y="424.84" font-size="11.00" class="sc-notoserifcjksc">代的快照，或在禁用生产环境安全防护措施的情况下运行模型，以使结果反映底层模型而非已部</text><text x="72.00" y="440.46" font-size="11.00" class="sc-notoserifcjksc">署的系统。每一节都会说明其配置。</text><text x="72.00" y="508.34" font-size="14.00" class="sc-poppinssemibold">1.5</text><text x="93.06" y="508.34" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施</text><text x="72.00" y="534.90" font-size="11.00" class="sc-notoserifcjksc">我们为</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.03 184.74" y="534.90" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.63" y="534.90" font-size="11.00" class="sc-notoserifcjksc">的全面开放使用所采用的安全防护措施如下：</text><text x="108.00" y="567.28" font-size="11.00" class="sc-notoserifcjksc">针对化学与生物（</text><text x="196.00" y="567.28" font-size="11.00" class="sc-loraregular">CB</text><text x="210.53" y="567.28" font-size="11.00" class="sc-notoserifcjksc">）风险，我们部署了与</text><text x="323.42 331.11 334.11 339.72 346.28 352.86 358.82 361.72 367.30 372.98 379.38 382.37 388.34 391.23" y="567.28" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="400.12" y="567.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="414.01 421.70 424.69 430.30 436.87 443.45 449.41 452.30 457.89 463.56 469.97 472.96 478.92 481.81 487.81 490.51" y="567.28" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="497.41" y="567.28" font-size="11.00" class="sc-notoserifcjksc">部署中</text><text x="108.00" y="582.90" font-size="11.00" class="sc-notoserifcjksc">所用相同的研究生物学分类器。与</text><text x="275.89 283.58 286.57 292.18 298.75 305.33 311.29 314.18 322.92 329.49 336.05 341.15 344.04" y="582.90" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="352.93" y="582.90" font-size="11.00" class="sc-notoserifcjksc">及能力较弱的模型上所用的</text><text x="487.82" y="582.90" font-size="11.00" class="sc-loraregular">CB</text><text x="505.24" y="582.90" font-size="11.00" class="sc-notoserifcjksc">滥用分</text><text x="108.00" y="598.52" font-size="11.00" class="sc-notoserifcjksc">类器相比，这些分类器覆盖的主题范围更广。被该分类器拦截的请求将回退（</text><text x="482.00" y="598.52" font-size="11.00" class="sc-loraregular">fallback</text><text x="521.21" y="598.52" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="108.00" y="614.14" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="121.89 129.58 132.57 138.18 144.75 151.33 157.29 160.18 168.92 175.49 182.05 187.15 190.04" y="614.14" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="196.03" y="614.14" font-size="11.00" class="sc-notoserifcjksc">。我们使用这些分类器的理由将在第</text><text x="374.93" y="614.14" font-size="11.00" class="sc-loraregular">2.2.5</text><text x="401.04" y="614.14" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="108.00" y="648.24" font-size="11.00" class="sc-notoserifcjksc">针对网络安全滥用，我们部署了拦截主题范围与</text><text x="341.89 349.58 352.57 358.18 364.75 371.33 377.29 380.18 388.92 395.49 402.05 407.14 410.04" y="648.24" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="418.93" y="648.24" font-size="11.00" class="sc-notoserifcjksc">上的分类器相似、但鲁棒</text><text x="108.00" y="663.86" font-size="11.00" class="sc-notoserifcjksc">性更高的分类器。被这些分类器拦截的请求将回退至</text><text x="363.89" y="663.86" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="408.60" y="663.86" font-size="11.00" class="sc-notoserifcjksc">。我们将在第</text><text x="477.49" y="663.86" font-size="11.00" class="sc-loraregular">3.2</text><text x="495.12" y="663.86" font-size="11.00" class="sc-notoserifcjksc">节中进一</text><text x="108.00" y="679.48" font-size="11.00" class="sc-notoserifcjksc">步介绍这些分类器。</text><text x="108.00" y="696.82" font-size="11.00" class="sc-notoserifcjksc">正如我们</text><text x="152.00" y="696.82" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="161.07" y="696.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="216.07" y="696.82" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="227.07 233.98 237.07 242.17 248.07 250.97 257.80 263.76 270.33 276.76 281.60" y="696.82" font-size="11.00" class="sc-loraregular">Risk Report</text><text x="285.86" y="696.82" font-size="11.00" class="sc-notoserifcjksc">）第</text><text x="310.75" y="696.82" font-size="11.00" class="sc-loraregular">3</text><text x="319.77" y="696.82" font-size="11.00" class="sc-notoserifcjksc">节所讨论的，我们担忧加快模型开发整体步伐</text><text x="108.00" y="712.44" font-size="11.00" class="sc-notoserifcjksc">所带来的风险，以及</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="136.83" y="107.96" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="147.83" y="107.96" width="11.00" height="1 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p013.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 13 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">13</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">递归自我改进（</text><text x="185.00 189.69 195.59 201.44 208.01 212.77 217.87 220.96 226.46 232.42 235.31 240.41 246.37 249.36 252.97 258.35 261.44 271.27 277.84 282.53 288.91 294.41 300.37 310.20 316.16 322.74" y="82.61" font-size="11.00" class="sc-loraregular">recursive self-improvement</text><text x="327.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="338.00" y="82.61" font-size="11.00" class="sc-loraregular">RSI</text><text x="354.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）可能带来的风险。我们已在</text><text x="500.72 508.41 511.40 517.01 523.58 530.16" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00" y="98.23" font-size="11.00" class="sc-loraregular">Opus 5.5</text><text x="155.44" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上针对一小部分与开发前沿大语言模型（</text><text x="353.44" y="98.23" font-size="11.00" class="sc-loraregular">LLM</text><text x="376.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）相关的能力部署了安全防护措</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">施，例如在某些</text><text x="187.89" y="113.85" font-size="11.00" class="sc-loraregular">ML</text><text x="207.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">加速器上进行内核开发，这与我们在</text><text x="386.14 393.82 396.82 402.43 408.99 415.57 421.53 424.43 430.01 435.69 442.09 445.08 451.05 453.94 459.93 462.64" y="113.85" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="469.54" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上的相应安全</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">防护措施类似。这些措施不会影响绝大多数传统的</text><text x="352.89" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="366.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="380.25" y="129.47" font-size="11.00" class="sc-loraregular">ML</text><text x="399.60" y="129.47" font-size="11.00" class="sc-notoserifcjksc">开发、研究或一般编程工</text><text x="108.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">作。被这些分类器拦截的请求将回退至</text><text x="297.89 305.58 308.57 314.18 320.75 327.33 333.29 336.18 344.92 351.49 358.05 363.15 366.04" y="145.09" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="372.03" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="179.76" font-size="11.00" class="sc-notoserifcjksc">我们针对常规武器和高当量炸药开发的拦截分类器，其表现与</text><text x="407.89 415.58 418.57 424.18 430.75 437.33 443.29 446.18 451.77 457.45 463.85 466.84 472.80 475.70 481.69 484.40" y="179.76" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="491.30" y="179.76" font-size="11.00" class="sc-notoserifcjksc">等以往模</text><text x="108.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">型相似，且没有回退模型。</text><text x="108.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们用于防止对我们模型进行蒸馏（例如试图提取模型的隐藏推理）的分类器，将在</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 155.03 161.59 168.16 173.25 176.15 182.14 184.85" y="243.96" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="193.73" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上直接拦截，没有回退模型。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">上述回退行为适用于我们的第一方产品，以及在我们的</text><text x="338.89 345.78 352.39" y="293.11" font-size="11.00" class="sc-loraregular">API</text><text x="358.97" y="293.11" font-size="11.00" class="sc-notoserifcjksc">上选择启用此类回退的开发者；通过</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">其他平台和提供商使用我们模型的流量可能会出现不同的行为。我们所有的拦截类安全防护措施</text><text x="72.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">均采用透明拦截的方式运行，不会暗中更改模型的回复。</text><text x="72.00" y="375.46" font-size="14.00" class="sc-poppinssemibold">1.6</text><text x="93.00" y="375.46" font-size="14.00" class="sc-notosanscjkscbold">外部测试</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.14 148.85" y="402.02" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="157.73" y="402.02" font-size="11.00" class="sc-notoserifcjksc">的大部分评估是在</text><text x="248.63 255.51 262.09 266.35 272.94 277.62 284.06 290.62 293.72" y="402.02" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="302.46" y="402.02" font-size="11.00" class="sc-notoserifcjksc">内部运行的。作为</text><text x="393.35 399.31 406.99" y="402.02" font-size="11.00" class="sc-loraregular">FCF</text><text x="415.92" y="402.02" font-size="11.00" class="sc-notoserifcjksc">的一部分，我们还邀请外</text><text x="72.00" y="417.64" font-size="11.00" class="sc-notoserifcjksc">部评估方对该模型的不同迭代版本进行测试。他们的意见有助于我们对系统性风险领域作出风险</text><text x="72.00" y="433.26" font-size="11.00" class="sc-notoserifcjksc">判定，也有助于我们的发布决策。我们感谢所有外部测试方对</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 418.92 425.48 432.05 437.14 440.04 446.03 448.74" y="433.26" font-size="11.00" class="sc-loraregular">Claude Opus 5.5</text><text x="457.63" y="433.26" font-size="11.00" class="sc-notoserifcjksc">开展评估并与我</text><text x="72.00" y="448.88" font-size="11.00" class="sc-notoserifcjksc">们分享结果。他们的具体贡献在本系统卡的相关章节中介绍。</text></svg></div>
