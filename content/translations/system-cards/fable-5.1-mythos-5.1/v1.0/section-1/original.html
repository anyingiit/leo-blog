379.91 390.91 401.91 412.91 423.91 434.91 445.91 456.91 467.91 478.91 489.91 500.91 511.91 522.91" y="131.83" font-size="11.00" class="sc-notoserifcjksc">全面开放发布，并配有额外的安</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">全防护措施，用于拦截高风险、两用知识领域中的任务。这些安全防护措施针对的是恶意行为者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.07" font-size="11.00" class="sc-notoserifcjksc">的滥用：例如，在生物学领域，利用该模型协助开发生物武器；或在网络安全领域，利用它破坏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="178.69" font-size="11.00" class="sc-notoserifcjksc">关键公共基础设施。</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06 218.06 220.76" y="178.69" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66" y="178.69" font-size="11.00" class="sc-notoserifcjksc">为经审核的个人和组织放宽了其中某些特定领域的安全防护措</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="194.31" font-size="11.00" class="sc-notoserifcjksc">施：通过我们的生命科学验证计划（</text><text x="423.80 434.80 445.80 456.80 467.80 478.80 489.80 500.80 511.80 522.80" y="194.31" font-size="11.00" class="sc-notoserifcjksc">）放宽生命科学安全防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="209.93" font-size="11.00" class="sc-notoserifcjksc">护措施，并在不久的将来通过我们的</text><text x="248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="209.93" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">网络安全验证计划</text><text x="336.00" y="209.93" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="486.73 497.73 508.73 519.73" y="209.93" font-size="11.00" class="sc-notoserifcjksc">）放宽网</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="225.55" font-size="11.00" class="sc-notoserifcjksc">络安全防护措施。另外，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 237.53 243.44 249.29 255.85 260.62 263.88 268.16" y="225.55" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Security</text><text x="276.86 287.86 298.86 309.86 320.86 331.86 342.86 353.86 364.86 375.86 386.86 397.86 408.86 419.86 430.86 441.86 452.86 463.86 474.86 485.86 496.86 507.86 518.86 529.86" y="225.55" font-size="11.00" class="sc-notoserifcjksc">是我们的一款产品，可扫描代码库以查找漏洞并提出补</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="241.17" font-size="11.00" class="sc-notoserifcjksc">丁建议供人工审核；它面向所有</text><text x="228.89 236.58 239.57 245.18 251.75 258.33 264.29 267.18 274.03 280.60 284.86 290.82 295.59 302.15 306.92 310.01 315.10" y="241.17" font-size="11.00" class="sc-loraregular">Claude Enterprise</text><text x="323.96 334.96 345.96 356.96 367.96 378.96 389.96" y="241.17" font-size="11.00" class="sc-notoserifcjksc">客户开放，并由</text><text x="403.85 413.78 419.64 423.90 430.49 436.92 442.02 444.91 450.91 453.61" y="241.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="460.51 471.51 482.51" y="241.17" font-size="11.00" class="sc-notoserifcjksc">驱动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="310.51" font-size="11.00" class="sc-notoserifcjksc">在本系统卡（</text><text x="138.00 144.18 149.99 155.08 159.34 165.30 175.14 178.03 185.72 191.39 196.08" y="310.51" font-size="11.00" class="sc-loraregular">System Card</text><text x="202.66 213.66 224.66 235.66 246.66 257.66 268.66 279.66 290.66 301.66 312.66 323.66 334.66 345.66 356.66 367.66 378.66 389.66 400.66 411.66 422.66 433.66" y="310.51" font-size="11.00" class="sc-notoserifcjksc">）中，我们报告了七个领域的一系列部署前评估：</text><text x="444.66 455.66 466.66 477.66 488.66 499.66 510.66" y="310.51" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">负责任扩展政策</text><text x="72.00" y="326.13" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.83 95.79 100.89 107.45 113.89 120.57 125.66 128.75 135.15 138.14 144.11 147.00 153.24 159.07 164.74 167.73 170.82 177.50 183.58 186.48 193.03 199.47 202.46 205.55 211.35" y="326.13" font-size="11.00" class="sc-loraregular">Responsible Scaling Policy</text><text x="217.16 228.16 239.16 250.16 261.16 272.16 283.16 294.16 305.16 316.16 327.16 338.16 349.16 360.16 371.16 382.16 393.16 404.16 415.16 426.16 437.16 448.16 459.16 470.16 481.16 492.16" y="326.13" font-size="11.00" class="sc-notoserifcjksc">）评估、网络安全、安全防护与无害性、智能体安全、对齐</text><text x="72.00" y="341.75" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 91.67 94.76 100.84 107.52 117.35 123.32 129.89" y="341.75" font-size="11.00" class="sc-loraregular">alignment</text><text x="134.15 145.15 156.15 167.15 178.15 189.15 200.15" y="341.75" font-size="11.00" class="sc-notoserifcjksc">）、模型福祉（</text><text x="211.15 220.98 227.42 234.00 239.96 242.95 245.84 254.52 260.49 263.48 267.20 272.87 277.56" y="341.75" font-size="11.00" class="sc-loraregular">model welfare</text><text x="283.52 294.52 305.52 316.52 327.52 338.52 349.52 360.52 371.52 382.52 393.52 404.52 415.52 426.52 437.52 448.52 459.52 470.52 481.52 492.52 503.52 514.52 525.52" y="341.75" font-size="11.00" class="sc-notoserifcjksc">）以及能力。每一节都会说明其评估的是该模型的哪</text><text x="72.00 83.00 94.00 105.00" y="357.37" font-size="11.00" class="sc-notoserifcjksc">种配置。</text><text x="72.00 77.07 80.71" y="392.87" font-size="14.00" class="sc-poppinssemibold">1.1</text><text x="89.11 103.11 117.11 131.11 145.11 159.11 173.11" y="392.87" font-size="14.00" class="sc-notosanscjkscbold">训练数据与流程</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="419.43" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="155.40" y="419.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.29 176.98 179.98 185.59 192.15 198.73 204.69 207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65 254.64 257.35" y="419.43" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="264.25 275.25 286.25 297.25 308.25 319.25 330.25 341.25 352.25 363.25 374.25 385.25 396.25 407.25 418.25 429.25 440.25 451.25 462.25 473.25 484.25 495.25 506.25 517.25" y="419.43" font-size="11.00" class="sc-notoserifcjksc">的训练数据是一种专有组合，包括来自互联网的公开信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="435.05" font-size="11.00" class="sc-notoserifcjksc">息、公开和非公开数据集，以及由其他模型生成的合成数据。在训练过程中，我们使用了多种数</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="450.67" font-size="11.00" class="sc-notoserifcjksc">据清洗和过滤方法，包括去重和分类。我们使用名为</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.11 369.96 376.39" y="450.67" font-size="11.00" class="sc-loraregular">ClaudeBot</text><text x="383.54 394.54 405.54 416.54 427.54 438.54 449.54 460.54 471.54 482.54 493.54 504.54 515.54 526.54" y="450.67" font-size="11.00" class="sc-notoserifcjksc">的通用网络爬虫从公开网站获取</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="466.29" font-size="11.00" class="sc-notoserifcjksc">训练数据。对于网站运营者为表明是否允许爬取其网站内容而设置的</text><text x="404.89 409.29 413.98 420.41 426.82 433.25 437.51 442.60 445.17 449.56 455.39 459.65" y="466.29" font-size="11.00" class="sc-loraregular">“robots.txt”</text><text x="466.38 477.38 488.38 499.38 510.38 521.38" y="466.29" font-size="11.00" class="sc-notoserifcjksc">指令，该爬虫</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="481.91" font-size="11.00" class="sc-notoserifcjksc">遵循行业标准做法。我们不会访问受密码保护的页面，也不会访问需要登录或</text><text x="448.89 456.47 463.36 470.02 477.06 484.75 493.33" y="481.91" font-size="11.00" class="sc-loraregular">CAPTCHA</text><text x="503.11 514.11 525.11" y="481.91" font-size="11.00" class="sc-notoserifcjksc">验证的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="497.53" font-size="11.00" class="sc-notoserifcjksc">页面。我们对所使用的训练数据进行尽职调查。该爬虫以透明方式运行；网站运营者可以轻松识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="513.15" font-size="11.00" class="sc-notoserifcjksc">别它何时爬取了其网页，并向我们表明其偏好。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="613.74" font-size="11.00" class="sc-notoserifcjksc">在预训练过程之后，模型经历了严格的后训练和微调，目的是使其成为一个行为符合</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="613.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="520.18" y="613.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪</text><text x="72.00" y="629.36" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">法</text><text x="83.00" y="629.36" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.18 130.89 135.99 138.88 144.68 151.11 157.79 162.88 167.14 170.41 174.66 181.23 185.49 188.58 195.01" y="629.36" font-size="11.00" class="sc-loraregular">Claude’s constitution</text><text x="201.69 212.69 223.69 234.69 245.69 256.69 267.69 278.69 289.69 300.69 311.69" y="629.36" font-size="11.00" class="sc-notoserifcjksc">）中所述价值观的助手。</text><text x="322.69 330.38 333.37 338.98 345.55 352.13" y="629.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="360.98 371.98 382.98 393.98 404.98 415.98 426.98 437.98 448.98 459.98 470.98 481.98 492.98 503.98 514.98 525.98" y="629.36" font-size="11.00" class="sc-notoserifcjksc">支持多种语言，通常使用与用户输入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="644.98" font-size="11.00" class="sc-notoserifcjksc">相同的语言进行回应。输出质量因语言而异。</text><text x="292.00 299.69 302.68 308.29 314.86 321.44" y="644.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="330.29 341.29 352.29 363.29 374.29 385.29" y="644.98" font-size="11.00" class="sc-notoserifcjksc">仅输出文本。</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="694.70" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11" y="694.70" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="131.00 140.94 146.80 151.06 157.65 164.08 169.17 172.07 178.06 180.77" y="694.70" font <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p012.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 12 页"><text x="504.00 507.28" y="751.81" font-size="9.00" class="sc-loraregular">12</text><text x="72.00 77.07 80.71" y="84.20" font-size="14.00" class="sc-poppinssemibold">1.2</text><text x="92.08 106.08 120.08 134.08 148.08" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">众包工作者</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="116.76" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="72.00 83.00 94.00 105.00 116.00" y="132.38" font-size="11.00" class="sc-notoserifcjksc">们的模型。</text><text x="127.00 133.89 140.46 144.72 151.31 156.00 162.43 169.00 172.09" y="132.38" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="180.83 191.83 202.83 213.83 224.83 235.83 246.83 257.83 268.83 279.83 290.83 301.83 312.83 323.83 334.83 345.83 356.83 367.83 378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="132.38" font-size="11.00" class="sc-notoserifcjksc">只与符合以下条件的平台合作：认同我们关于向工作者提供公平且合乎道</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="148.00" font-size="11.00" class="sc-notoserifcjksc">德的报酬的理念，并承诺无论身处何地都采取安全的工作场所做法，遵循我们采购合同中详细规</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="163.62" font-size="11.00" class="sc-notoserifcjksc">定的众包工作者福祉标准。</text><text x="72.00 77.07 80.71" y="231.50" font-size="14.00" class="sc-poppinssemibold">1.3</text><text x="92.43 106.43 120.43 134.43 148.43 162.43 176.43" y="231.50" font-size="14.00" class="sc-notosanscjkscbold">使用政策与支持</text><text x="72.00 78.89 85.46 89.72 96.31 101.00 107.43 114.00 117.09" y="264.06" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="125.83" y="264.06" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="136.83 147.83 158.83 169.83" y="264.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="180.83" y="264.06" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="191.83 200.03 205.12 210.80 216.83 222.79 225.68 232.24 238.67 241.66 244.76 250.55" y="264.06" font-size="11.00" class="sc-loraregular">Usage Policy</text><text x="256.36 267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="264.06" font-size="11.00" class="sc-notoserifcjksc">）详细规定了我们模型的禁止用途，以及在高风险和其他</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="279.68" font-size="11.00" class="sc-notoserifcjksc">特定场景中使用的要求。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="312.64" font-size="11.00" class="sc-notoserifcjksc">对于受适用监管制度约束的模型，我们已在</text><text x="281.00 292.00 303.00 314.00 325.00 336.00" y="312.64" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿合规框架</text><text x="347.00" y="312.64" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="358.00 363.92 368.60 375.04 381.62 385.87 388.97 394.93 399.69 402.58 410.27 416.71 426.54 433.11 436.10 439.19 444.87 451.54 457.34 463.30 466.20 472.11 476.80 482.48 492.31 498.23 506.91 513.34 518.06" y="312.64" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="523.97" y="312.64" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 77.95 85.64" y="328.26" font-size="11.00" class="sc-loraregular">FCF</text><text x="91.67 102.67 113.67 124.67 135.67 146.67 157.67 168.67 179.67 190.67 201.67 212.67 223.67 234.67 245.67 256.67 267.67 278.67 289.67 300.67 311.67 322.67" y="328.26" font-size="11.00" class="sc-notoserifcjksc">）中正式规定了我们如何履行此类法规下的义务。</text><text x="333.67 339.62 347.31" y="328.26" font-size="11.00" class="sc-loraregular">FCF</text><text x="356.23 367.23 378.23 389.23 400.23 411.23 422.23 433.23 444.23 455.23 466.23 477.23 488.23 499.23 510.23 521.23" y="328.26" font-size="11.00" class="sc-notoserifcjksc">记录了我们当前针对关键风险类别开</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="343.88" font-size="11.00" class="sc-notoserifcjksc">展系统性风险评估与缓解的技术和组织规程。它是我们适用于相关监管制度的合规框架，包括加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="359.50" font-size="11.00" class="sc-notoserifcjksc">利福尼亚州的《前沿人工智能透明度法案》（</text><text x="292.00 298.88 303.56 309.24 315.91 321.01 327.57 333.25 337.94 343.90 350.58 356.37 362.18 365.07 368.16 374.84 377.73 383.65 388.34 394.77 401.35 405.61 408.70 414.66 419.42 422.32 429.20 432.89 435.78 442.67 448.46" y="359.50" font-size="11.00" class="sc-loraregular">Transparency in Frontier AI Act</text><text x="452.72" y="359.50" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="463.72 470.76 476.37 483.26 486.94" y="359.50" font-size="11.00" class="sc-loraregular">TFAIA</text><text x="493.83 504.83 515.83" y="359.50" font-size="11.00" class="sc-notoserifcjksc">）以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="375.12" font-size="11.00" class="sc-notoserifcjksc">《欧盟人工智能法案》（</text><text x="193.00 199.84 208.11 211.01 217.89 221.58 224.47 231.36 237.15" y="375.12" font-size="11.00" class="sc-loraregular">EU AI 1 450.81 461.81 472.81 483.81 494.81 505.81 516.81 527.81" y="556.52" font-size="11.00" class="sc-notoserifcjksc">版本。除非另有说明，本系统卡中的评估均基</text><text x="72.00" y="572.14" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 129.77 135.45 141.85 144.84 150.80 153.70 159.69 162.40" y="572.14" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="169.29" y="572.14" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="183.19 190.88 193.87 199.48 206.05 212.62 218.59 221.48 231.41 237.28 241.53 248.12 254.56 259.65 262.54 268.54 271.24" y="572.14" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="278.14 289.14 300.14 311.14 322.14 333.14" y="572.14" font-size="11.00" class="sc-notoserifcjksc">的最终快照。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="621.86" font-size="11.00" class="sc-notoserifcjksc">在本系统卡中，我们根据具体情况决定评估</text><text x="283.89 293.83 299.69 303.95 310.54 316.97 322.06 324.96 330.95 333.66" y="621.86" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66" y="621.86" font-size="11.00" class="sc-notoserifcjksc">（无安全防护措施，反映模型的底层能</text><text x="72.00 83.00 94.00 105.00" y="637.48" font-size="11.00" class="sc-notoserifcjksc">力）还是</text><text x="118.89 124.48 130.16 136.56 139.55 145.51 148.41 154.40 157.11" y="637.48" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="161.11 172.11 183.11 194.11 205.11 216.11 227.11 238.11 249.11 260.11 271.11 282.11 293.11 304.11 315.11 326.11 337.11 348.11 359.11 370.11 381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="637.48" font-size="11.00" class="sc-notoserifcjksc">（具有安全防护措施，与普遍访问下的用户体验一致）。全文均明确标注了我</text><text x="72.00 83
