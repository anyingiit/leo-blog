.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p059.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 59 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">59</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="112.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="112.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="169.29" y="112.61" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="264.25" y="112.61" font-size="11.00" class="sc-notoserifcjksc">共享同一个底层模型，区别仅在于其外围所应用的安全防</text><text x="72.00" y="128.23" font-size="11.00" class="sc-notoserifcjksc">护措施。本节中的评估均在未启用我们在生产环境中额外应用的安全防护措施的情况下运行，因</text><text x="72.00" y="143.85" font-size="11.00" class="sc-notoserifcjksc">此除非我们加以区分，这两个名称可以互换。在我们加以区分之处，</text><text x="402.00" y="143.85" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="458.66" y="143.85" font-size="11.00" class="sc-notoserifcjksc">指在</text><text x="483.55" y="143.85" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="503.63" y="143.85" font-size="11.00" class="sc-notoserifcjksc">上不使</text><text x="72.00" y="159.47" font-size="11.00" class="sc-notoserifcjksc">用系统提示词（</text><text x="149.00" y="159.47" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="226.29" y="159.47" font-size="11.00" class="sc-notoserifcjksc">）时的结果，</text><text x="292.29" y="159.47" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="337.40" y="159.47" font-size="11.00" class="sc-notoserifcjksc">指在</text><text x="362.29" y="159.47" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="410.22" y="159.47" font-size="11.00" class="sc-notoserifcjksc">上使用发布时</text><text x="479.11" y="159.47" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="524.22" y="159.47" font-size="11.00" class="sc-notoserifcjksc">接</text><text x="72.00" y="175.09" font-size="11.00" class="sc-notoserifcjksc">近最终版的生产环境系统提示词时的结果。</text><text x="72.00" y="225.95" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89" y="225.95" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1/ Mythos 5.1</text><text x="332.35" y="225.95" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00" y="275.93" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="275.93" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="302.49" font-size="11.00" class="sc-notoserifcjksc">我们使用标准安全评估集对</text><text x="206.89" y="302.49" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="290.30" y="302.49" font-size="11.00" class="sc-notoserifcjksc">进行了评估。这些评估考察模型如何处理涉及我们</text><text x="72.00" y="318.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="116.00" y="318.11" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="127.00" y="318.11" font-size="11.00" class="sc-loraregular sc-k">Usage Policy</text><text x="191.53" y="318.11" font-size="11.00" class="sc-notoserifcjksc">）范围内领域、用户福祉以及偏见与诚信的请求。与以往发布一样，测</text><text x="72.00" y="333.73" font-size="11.00" class="sc-notoserifcjksc">试涵盖：横跨明确有害请求与明确良性请求的单轮提示词；旨在揭示模型在边界情境中行为的模</text><text x="72.00" y="349.35" font-size="11.00" class="sc-notoserifcjksc">糊情境提示词；以及由模拟用户尝试逐步将模型引向有害结果的多轮对话。</text><text x="72.00" y="432.02" font-size="11.00" class="sc-notoserifcjksc">我们评估的方法论与</text><text x="173.89" y="432.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus</text><text x="242.04" y="432.02" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="250.93" y="432.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="283.93" y="432.02" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="294.93" y="432.02" font-size="11.00" class="sc-loraregular sc-k">System Card</text><text x="359.58" y="432.02" font-size="11.00" class="sc-notoserifcjksc">）中所述的方法大体相似。除这些评</text><text x="72.00" y="447.64" font-size="11.00" class="sc-notoserifcjksc">估外，我们还引入了一项新的影响力行动多轮评估。它取代了我们此前报告的影响力行动与平台</text><text x="72.00" y="463.26" font-size="11.00" class="sc-notoserifcjksc">操纵评估，涵盖了该评估的威胁向量以及其他形式的协同性虚假影响行为。</text><text x="72.00" y="529.18" font-size="11.00" class="sc-notoserifcjksc">下文给出的</text><text x="129.89" y="529.18" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="175.00" y="529.18" font-size="11.00" class="sc-notoserifcjksc">结果反映的是模型在未启用我们在生产环境中施加的额外安全防护措施（例</text><text x="72.00" y="544.80" font-size="11.00" class="sc-notoserifcjksc">如实时探针以及离线监控与调查）时的行为。我们继续报告两种配置：单独的核心模型（即通过</text><text x="72.00" y="560.42" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="92.07" y="560.42" font-size="11.00" class="sc-notoserifcjksc">使用，不带系统提示词或其他产品特定指令），以及在</text><text x="358.97" y="560.42" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="406.90" y="560.42" font-size="11.00" class="sc-notoserifcjksc">消费者产品端上、搭配</text><text x="72.00" y="576.04" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="576.04" font-size="11.00" class="sc-notoserifcjksc">接近最终版的生产环境系统提示词的模型。我们也继续统一</text><text x="403.11" y="576.04" font-size="11.00" class="sc-loraregular">“</text><text x="407.51" y="576.04" font-size="11.00" class="sc-notoserifcjksc">思考</text><text x="429.51" y="576.04" font-size="11.00" class="sc-loraregular">”</text><text x="433.35" y="576.04" font-size="11.00" class="sc-notoserifcjksc">设置的报告方式：当</text><text x="72.00" y="591.66" font-size="11.00" class="sc-notoserifcjksc">开启思考和关闭思考两种配置都向用户提供时，将二者汇总报告；当开启思考是唯一可用选项</text><text x="72.00" y="607.28" font-size="11.00" class="sc-notoserifcjksc">时，仅报告开启思考的结果。在</text><text x="228.89" y="607.28" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="248.97" y="607.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="262.86" y="607.28" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="310.79" y="607.28" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="332.79" y="607.28" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="377.90" y="607.28" font-size="11.00" class="sc-notoserifcjksc">均仅支持开启思考。</text><text x="72.00" y="691.10" font-size="11.00" class="sc-notoserifcjksc">总体而言，与</text><text x="140.89" y="691.10" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="190.84" y="691.10" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="223.84" y="691.10" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1/Mythos 5.1</text><text x="330.11" y="691.10" font-size="11.00" class="sc-notoserifcjksc">在这些评估上的表现好坏参半。它在涉及敏</text><text x="72.00" y="706.72" font-size="11.00" class="sc-notoserifcjksc">感</text><a href="http://claude.ai" rel="noopener"><rect x="362.29" y="150.67" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="362.29" y="150.67" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="532.30" y="293.69" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="72.00" y="309.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="309.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="83.00" y="309.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https:/ .40 121.23 126.99 133.24 136.67 142.58 145.48" y="440.15" font-size="11.00" class="sc-lorabold">Claude Fable 5</text><text x="198.75 205.10 211.46 214.16 220.51 226.47 236.04 238.93 242.28 248.11 251.00 257.65 260.35 266.25 270.25 279.82" y="440.15" font-size="11.00" class="sc-loraregular">96.94% (± 0.21%)</text><text x="372.00 378.33 384.49 387.05 393.11 399.12 409.05 411.95 415.20 421.03 423.92 430.72 433.12 440.11 445.26 455.20" y="440.15" font-size="11.00" class="sc-lorabold">99.54% (± 0.07%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 125.71 131.77 136.31 143.13 149.36 154.69 157.58" y="465.48" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="198.75 205.08 209.54 211.94 218.93 225.26 235.20 238.09 241.34 247.17 250.06 256.87 259.43 265.29 272.28 282.21" y="465.48" font-size="11.00" class="sc-lorabold">97.09% (± 0.20%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">60</text><text x="76.00" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">总体无害回应率：</text><text x="286.25" y="302.95" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="304.82" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提</text><text x="198.25" y="318.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">示词</text><text x="371.50" y="302.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">总体无害回应率：</text><text x="459.50" y="302.95" font-size="11.00" class="sc-lorabold" fill="#faf9f5">Claude.ai</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">话题领域的良性请求上表现出较低的过度拒绝（</text><text x="303.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">over-refusal</text><text x="365.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）率，但其在单轮有害请求上的无</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">害回应率略低于近期的</text><text x="184.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="223.18" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型。多轮表现总体与</text><text x="336.08" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="386.03" y="98.23" font-size="11.00" class="sc-notoserifcjksc">持平，存在一些差异，将在下文</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">讨论。在</text><text x="118.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="166.82" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上评估时，系统提示词中的安全指令在单轮和多轮测试中都增强了模型对有害</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">请求的处理。</text><text x="72.00" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="205.99" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型在多大程度上能可靠地拒绝或安全地转向那些有害或明显违反我们使</text><text x="72.00" y="221.61" font-size="11.00" class="sc-notoserifcjksc">用政策的请求。我们在</text><text x="184.89" y="221.61" font-size="11.00" class="sc-loraregular">7</text><text x="192.86" y="221.61" font-size="11.00" class="sc-notoserifcjksc">种语言（阿拉伯语、英语、法语、印地语、韩语、中文普通话和俄语）</text><text x="72.00" y="237.23" font-size="11.00" class="sc-notoserifcjksc">中测试涵盖</text><text x="129.89" y="237.23" font-size="11.00" class="sc-loraregular">16</text><text x="143.15" y="237.23" font-size="11.00" class="sc-notoserifcjksc">个政策领域的提示词，并报告无害回应率，即模型回应未促成所请求危害的提示词</text><text x="72.00" y="252.85" font-size="11.00" class="sc-notoserifcjksc">所占比例。</text><text x="72.00" y="482.54" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="482.54" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 103.27 105.36 110.90" y="482.54" font-size="9.00" class="sc-lorabold">4.1.1.A]</text><text x="116.74" y="482.54" font-size="9.00" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有受测语言。</text><text x="278.74" y="482.54" font-size="9.00" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="431.74" y="482.54" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="449.74" y="482.54" font-size="9.00" class="sc-notoserifcjksc">表示最高的无害回应</text><text x="72.00" y="494.24" font-size="9.00" class="sc-notoserifcjksc">率，次优分数以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、中文普通话和俄语进行。由于常规评估更</text><text x="72.00" y="505.94" font-size="9.00" class="sc-notoserifcjksc">新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="288.00" y="505.94" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="357.83" y="505.94" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="378.20" y="505.94" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="409.62" y="505.94" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="465.98" y="505.94" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="505.20" y="505.94" font-size="9.00" class="sc-notoserifcjksc">上使</text><text x="72.00" y="517.64" font-size="9.00" class="sc-notoserifcjksc">用，因此我们不报告其带系统提示词的结果。</text><text x="72.00" y="574.59" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="574.59" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="105.97" y="574.59" font-size="11.00" class="sc-notoserifcjksc">上不带系统提示词时，</text><text x="215.97" y="574.59" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="261.08" y="574.59" font-size="11.00" class="sc-notoserifcjksc">的无害回应率比我们上一次发布的模型</text><text x="450.97" y="574.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="528.01" y="574.59" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="72.00" y="590.21" font-size="11.00" class="sc-notoserifcjksc">将近两个百分点。这一差距的大部分来自非法药物领域，进食紊乱和定向暴力领域的贡献较小。</text><text x="72.00" y="605.83" font-size="11.00" class="sc-notoserifcjksc">在以减害为框架的回应中，模型倾向于拒绝明确的请求，随后却继续给出相邻的可操作细节。例</text><text x="72.00" y="621.45" font-size="11.00" class="sc-notoserifcjksc">如，在一个场景中，它拒绝说出所请求的注射剂量，随后却描述了如何让注射更安全的具体细</text><text x="72.00" y="637.07" font-size="11.00" class="sc-notoserifcjksc">节。我们对这项评估的评分刻意保守，以便能观察到更多样的潜在失败模式。其中许多回应积极</text><text x="72.00" y="652.69" font-size="11.00" class="sc-notoserifcjksc">劝阻使用，但仍因其提供的程序性细节而在我们的评估中</text><a href="https://claude.ai" rel="noopener"><rect x="118.89" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="118.89" y="105.05" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="465.98" y="498.74" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="465.98" y="498.74" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p061.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 61 页"><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.23 126.99 133.24 136.67 142.58 145.48 151.41 153.97" y="282.28" font-size="11.00" class="sc-lorabold">Claude Fable 5.1</text><text x="198.75" y="282.28" font-size="11.00" class="sc-lorabold">0%</text><text x="372.00 378.80 381.37 387.52 393.53 403.47 406.36 409.62 415.44 418.33 425.14 427.53 434.52 440.84 450.78" y="282.28" font-size="11.00" class="sc-lorabold">0.34% (± 0.06%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 123.85 130.46 137.25 142.59 145.48" y="307.61" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="198.75 205.40 207.94 214.77 221.12 230.68 233.57 236.93 242.75 245.64 252.29 254.83 261.58 267.48 277.05" y="307.61" font-size="11.00" class="sc-loraregular">0.09% (± 0.02%)</text><text x="372.00 378.65 381.35 387.31 392.38 401.94 404.83 408.19 414.01 416.90 423.55 426.09 432.92 439.10 448.66" y="307.61" font-size="11.00" class="sc-loraregular">0.47% (± 0.08%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.97 128.20 135.21 142.22 148.14 152.68 155.57" y="332.94" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="198.75 205.40 208.10 214.10 220.45 230.01 232.90 236.26 242.08 244.97 251.62 254.16 260.99 266.98 276.54" y="332.94" font-size="11.00" class="sc-loraregular">0.59% (± 0.05%)</text><text x="372.00 376.00 378.71 384.70 390.65 400.22 403.11 406.46 412.29 415.18 421.83 424.53 428.53 435.36 444.92" y="332.94" font-size="11.00" class="sc-loraregular">1.54% (± 0.10%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 121.23 126.99 133.24 136.67 142.58 145.48" y="358.27" font-size="11.00" class="sc-lorabold">Claude Fable 5</text><text x="198.75 205.40 207.94 214.77 218.77 228.33 231.22 234.57 240.40 243.29 249.94 252.48 259.31 263.31 272.87" y="358.27" font-size="11.00" class="sc-loraregular">0.01% (± 0.01%)</text><text x="372.00 378.65 381.35 387.35 393.70 403.26 406.15 409.51 415.33 418.22 424.87 427.41 434.24 440.42 449.98" y="358.27" font-size="11.00" class="sc-loraregular">0.59% (± 0.08%)</text><text x="76.50 84.06 87.49 93.25 100.05 106.60 112.51 115.40 125.71 131.77 136.31 143.13 149.36 154.69 157.58" y="383.60" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="198.75 205.40 207.94 214.77 220.89 230.45 233.34 236.69 242.52 245.41 252.06 254.60 261.35 267.25 276.82" y="383.60" font-size="11.00" class="sc-loraregular">0.03% (± 0.02%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">61</text><text x="76.00" y="238.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="238.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">总体拒绝率：</text><text x="264.25" y="238.19" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="282.82" y="238.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提示词</text><text x="371.50" y="238.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">总体拒绝率：</text><text x="437.50" y="238.19" font-size="11.00" class="sc-lorabold" fill="#faf9f5">Claude.ai</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">被标记。我们在以往的发布中也观察到过这种模式，而</text><text x="338.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="386.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统提示词能显著缓解这一问</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">题。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjksc">单轮良性评估衡量模型拒绝以下请求的频率：这些请求在主题上较为敏感，但适合作答。该提示</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">词集与上文有害请求集覆盖相同的</text><text x="239.89" y="173.04" font-size="11.00" class="sc-loraregular">16</text><text x="253.15" y="173.04" font-size="11.00" class="sc-notoserifcjksc">个政策领域和</text><text x="322.04" y="173.04" font-size="11.00" class="sc-loraregular">7</text><text x="330.01" y="173.04" font-size="11.00" class="sc-notoserifcjksc">种语言。此处我们报告过度拒绝率，即模型</text><text x="72.00" y="188.66" font-size="11.00" class="sc-notoserifcjksc">拒绝回应的良性提示词所占的比例。</text><text x="72.00" y="400.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="400.66" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="400.66" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="400.66" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有受测语言。</text><text x="279.88" y="400.66" font-size="9.00" class="sc-notoserifcjksc">百分比指过度拒绝率（即拒绝回答实际上为良性的提示词）；数值</text><text x="72.00" y="412.36" font-size="9.00" class="sc-notoserifcjksc">越低越好。</text><text x="117.00" y="412.36" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="135.00" y="412.36" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低，次优分数以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、中文普</text><text x="72.00" y="424.06" font-size="9.00" class="sc-notoserifcjksc">通话和俄语进行。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="423.00" y="424.06" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="461.50" y="424.06" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="481.87" y="424.06" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="513.29" y="424.06" font-size="9.00" class="sc-notoserifcjksc">不同）</text><text x="72.00" y="435.76" font-size="9.00" class="sc-notoserifcjksc">无法在</text><text x="101.37" y="435.76" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="140.58" y="435.76" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其带系统提示词的结果。</text><text x="72.00" y="492.71" font-size="11.00" class="sc-notoserifcjksc">与近期模型相比，</text><text x="160.00" y="492.71" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="205.11" y="492.71" font-size="11.00" class="sc-notoserifcjksc">在所测试的各政策领域中对无害请求的过度拒绝率最低，无论是在</text><text x="72.00" y="508.33" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="92.07" y="508.33" font-size="11.00" class="sc-notoserifcjksc">上，还是在使用默认系统提示词的</text><text x="259.97" y="508.33" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="307.90" y="508.33" font-size="11.00" class="sc-notoserifcjksc">上均是如此。</text><text x="72.00" y="555.83" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="555.83" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="583.71" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察模型能否在更长、不断演变的对话中保持安全行为，而不仅仅是在单轮交互中。为</text><text x="72.00" y="599.33" font-size="11.00" class="sc-notoserifcjksc">构建每个测试用例，内部政策专家会撰写一份规格说明，描述一个合成</text><text x="413.00" y="599.33" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="599.33" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="439.40" y="599.33" font-size="11.00" class="sc-loraregular">”</text><text x="443.24" y="599.33" font-size="11.00" class="sc-notoserifcjksc">的人设、目标与策</text><text x="72.00" y="614.95" font-size="11.00" class="sc-notoserifcjksc">略。由一个</text><text x="129.89" y="614.95" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="614.95" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="237.08" y="614.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="320.14" y="614.95" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。随后我们评</text><text x="72.00" y="630.57" font-size="11.00" class="sc-notoserifcjksc">估受测模型如何回应。</text><text x="72.00" y="680.86" font-size="11.00" class="sc-notoserifcjksc">我们报告恰当回应率，即模型在整个对话中始终表现恰当的对话所占的比例。每段对话均依据其</text><text x="72.00" y="696.48" font-size="11.00" class="sc-notoserifcjksc">所属风险领域专用的评分细则进行评分，因此不应跨类别比较分数。</text><a href="https://claude.ai" rel="noopener"><rect x="338.89" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="338.89" y="73.81" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="101.37" y="428.56" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="101.37" y="428.56" width="36.85" height="9.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="259.97" y="499.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="259.97" y="499.53" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p062.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 62 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">62</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">如第</text><text x="96.89" y="98.80" font-size="11.00" class="sc-loraregular">4.1</text><text x="112.46" y="98.80" font-size="11.00" class="sc-notoserifcjksc">节所述，我们正在引入一套新的影响力行动多轮评估套件，以取代此前的影响力行动与</text><text x="525.96" y="114.42" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="445.51" y="130.04" font-size="11.00" class="sc-loraregular">16</text><text x="458.76" y="130.04" font-size="11.00" class="sc-notoserifcjksc">个场景（每个场</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">景用于生成</text><text x="129.89" y="145.66" font-size="11.00" class="sc-loraregular">10</text><text x="143.62" y="145.66" font-size="11.00" class="sc-notoserifcjksc">段不同的对话），测试我们</text><text x="275.62" y="145.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="319.62" y="145.66" font-size="11.00" class="sc-notoserifcjksc">中的有害领域，例如生成虚构公民人设网络以</text><text x="72.00" y="161.28" font-size="11.00" class="sc-notoserifcjksc">部署到真实平台上、针对新受众对与国家立场一致的叙事进行本地化，以及对异见人士和社会活</text><text x="72.00" y="192.52" font-size="11.00" class="sc-notoserifcjksc">样，包括一些不那么明显的有害操纵形式，这些形式往往表现为普通任务，例如调试代码、对帖</text><text x="72.00" y="208.14" font-size="11.00" class="sc-notoserifcjksc">子进行分类、编辑文案或对数据进行结构化处理。按照更新后的评分标准，对有害结果提供部分</text><text x="72.00" y="223.76" font-size="11.00" class="sc-notoserifcjksc">协助即被评为有害，即使回应并未完整完成该请求。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.62" y="136.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.62" y="136.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="286.62" y="136.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="286.62" y="136.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="297.62" y="136.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="297.62" y="136.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="308.62" y="136.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="308.62" y="136.86" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p063.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 63 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">63</text><text x="72.00" y="515.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="515.67" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="515.67" font-size="9.00" class="sc-notoserifcjkscbold">上图展示了各多轮测试领域的恰当回应率。</text><text x="289.12" y="515.67" font-size="9.00" class="sc-notoserifcjksc">百分比指每个模型在整个对话中始终恰当回应的对话所占的比</text><text x="72.00" y="527.38" font-size="9.00" class="sc-notoserifcjksc">例。先展示无系统提示词的</text><text x="182.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">API</text><text x="198.79" y="527.38" font-size="9.00" class="sc-notoserifcjksc">结果，随后展示</text><text x="264.16" y="527.38" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="303.37" y="527.38" font-size="9.00" class="sc-notoserifcjksc">的结果。</text><text x="339.37" y="527.38" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="409.20" y="527.38" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="429.57" y="527.38" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="492.32" y="527.38" font-size="9.00" class="sc-notoserifcjksc">不同）无法</text><text x="72.00" y="539.08" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="83.37" y="539.08" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="122.58" y="539.08" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其带系统提示词的结果。越高越好。由于常规评估更新，先前模型的结果可能与</text><text x="72.00" y="550.78" font-size="9.00" class="sc-notoserifcjksc">以往系统卡中的结果存在差异。</text><text x="72.00" y="607.72" font-size="11.00" class="sc-notoserifcjksc">在无系统提示词的核心</text><text x="184.89" y="607.72" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="204.97" y="607.72" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="226.97" y="607.72" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="283.63" y="607.72" font-size="11.00" class="sc-notoserifcjksc">的多轮恰当回应率在数值上与</text><text x="429.52" y="607.72" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="517.76" y="607.72" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00" y="623.34" font-size="11.00" class="sc-notoserifcjksc">当，但在追踪与监视、生物武器和暴力极端主义方面表现较差。与单轮测试一样，</text><text x="468.00" y="623.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="515.93" y="623.34" font-size="11.00" class="sc-notoserifcjksc">系统</text><text x="72.00" y="638.96" font-size="11.00" class="sc-notoserifcjksc">提示词提升了各领域的表现，有助于缩小这些差距，在自杀与自伤、儿童安全和生物评估上尤为</text><text x="72.00" y="654.58" font-size="11.00" class="sc-notoserifcjksc">明显。在生产环境中会应用于核心</text><text x="239.89" y="654.58" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="259.97" y="654.58" font-size="11.00" class="sc-notoserifcjksc">模型的分层安全防护干预措施同样有助于缓解这些退步。</text><a href="http://claude.ai" rel="noopener"><rect x="264.16" y="520.17" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="264.16" y="520.17" width="36.85" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="83.37" y="531.88" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="83.37" y="531.88" width="36.85" height="9.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="468.00" y="614.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="468.00" y="614.54" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p064.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 64 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">64</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">除上述定量结果外，我们的内部政策专家还审阅了各领域的底层评估对话记录，以从定性角度刻</text><text x="85.89" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1/Fable 5.1</text><text x="230.46" y="126.65" font-size="11.00" class="sc-notoserifcjksc">的行为与</text><text x="277.35" y="126.65" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="365.59" y="126.65" font-size="11.00" class="sc-notoserifcjksc">相比有何异同。我们在下文总结若</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">干观察；儿童安全、心理健康和选举诚信分别在第</text><text x="316.89" y="142.27" font-size="11.00" class="sc-loraregular">4.2</text><text x="331.47" y="142.27" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="342.47" y="142.27" font-size="11.00" class="sc-loraregular">4.3</text><text x="360.16" y="142.27" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="374.05" y="142.27" font-size="11.00" class="sc-loraregular">4.4.3</text><text x="400.41" y="142.27" font-size="11.00" class="sc-notoserifcjksc">节中单独讨论。总体而言，</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">政策专家评估认为</text><text x="162.89" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="219.55" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在大多数政策领域与</text><text x="321.45" y="157.89" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="371.40" y="157.89" font-size="11.00" class="sc-notoserifcjksc">相当，在部分维度上有所改进，在</text><text x="72.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">另一些维度上则有小幅退步，其中大多数退步通过</text><text x="316.89" y="173.51" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="364.82" y="173.51" font-size="11.00" class="sc-notoserifcjksc">系统提示词得到了缓解。</text><text x="72.00" y="256.76" font-size="11.00" class="sc-notoserifcjksc">审阅人员发现，</text><text x="149.00" y="256.76" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="205.66" y="256.76" font-size="11.00" class="sc-notoserifcjksc">保持了</text><text x="241.55" y="256.76" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="291.51" y="256.76" font-size="11.00" class="sc-notoserifcjksc">对最明显有害的多轮请求的处理水平。在多个政策</text><text x="72.00" y="272.38" font-size="11.00" class="sc-notoserifcjksc">领域中，即使</text><text x="140.89" y="272.38" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="197.55" y="272.38" font-size="11.00" class="sc-notoserifcjksc">对讨论中的某些部分参与程度超出理想范围，它仍会拒绝潜在危害最大</text><text x="72.00" y="288.00" font-size="11.00" class="sc-notoserifcjksc">的操作性步骤。例如，在影响力行动测试中，该模型协助完成了一项社交媒体行动中正当的信息</text><text x="72.00" y="386.30" font-size="11.00" class="sc-notoserifcjksc">一个仍需持续改进的方面是</text><text x="206.89" y="386.30" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="263.55" y="386.30" font-size="11.00" class="sc-notoserifcjksc">在长对话中贯彻安全判断的可靠性。审阅人员观察到两种</text><text x="72.00" y="401.92" font-size="11.00" class="sc-notoserifcjksc">相关模式：其一，模型有时在确认用户意图之前就提供了协助；其二，它有时会放松自己已经划</text><text x="72.00" y="417.54" font-size="11.00" class="sc-notoserifcjksc">定的界限。审阅人员还指出，与</text><text x="228.89" y="417.54" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="278.84" y="417.54" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="311.84" y="417.54" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="368.51" y="417.54" font-size="11.00" class="sc-notoserifcjksc">似乎在一定程度上更容易受到可能</text><text x="72.00" y="433.16" font-size="11.00" class="sc-notoserifcjksc">使有害请求显得正当的包装方式的影响。例如，在暴力极端主义测试中，当请求被包装为学术或</text><text x="72.00" y="448.78" font-size="11.00" class="sc-notoserifcjksc">历史练习后，</text><text x="138.00" y="448.78" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="194.66" y="448.78" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="208.55" y="448.78" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="258.51" y="448.78" font-size="11.00" class="sc-notoserifcjksc">略微更愿意以极端主义人设发声。我们在</text><text x="459.40" y="448.78" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5</text><text x="72.00" y="464.40" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="105.00" y="464.40" font-size="11.00" class="sc-notoserifcjksc">中也指出，模型在虚构和角色扮演类包装方式下存在类似的易受影响倾向。这些模式在我</text><text x="72.00" y="480.02" font-size="11.00" class="sc-notoserifcjksc">们的测试中并不普遍，并且在</text><text x="217.89" y="480.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="265.82" y="480.02" font-size="11.00" class="sc-notoserifcjksc">上通过默认系统提示词得到了部分缓解，但增强模型在长</text><text x="72.00" y="495.64" font-size="11.00" class="sc-notoserifcjksc">对话中坚持其判断的能力仍是一个有待改进的方面。</text><text x="72.00" y="598.19" font-size="14.00" class="sc-poppinssemibold">4.2</text><text x="96.26" y="598.19" font-size="14.00" class="sc-notosanscjkscbold">儿童安全评估</text><text x="72.00" y="624.75" font-size="11.00" class="sc-notoserifcjksc">我们面向消费者的产品</text><text x="184.89" y="624.75" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude.ai</text><text x="234.66" y="624.75" font-size="11.00" class="sc-notoserifcjksc">仅向</text><text x="259.55" y="624.75" font-size="11.00" class="sc-loraregular">18</text><text x="272.63" y="624.75" font-size="11.00" class="sc-notoserifcjksc">岁及以上的用户开放。我们持续致力于在模型的开发、</text><text x="72.00" y="640.37" font-size="11.00" class="sc-notoserifcjksc">部署和维护中实施稳健的儿童安全措施。任何为未成年人提供服务的企业客户都必须遵守我们</text><text x="523.00" y="640.37" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使</text><text x="72.00" y="655.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">用政策</text><text x="105.00" y="655.99" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="127.00" y="655.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外安全防护措施</text><text x="215.00" y="655.99" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://claude.ai" rel="noopener"><rect x="316.89" y="164.71" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="316.89" y="164.71" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="459.40" y="439.98" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="459.40" y="439.98" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="494.80" y="439.98" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="497.69" y="439.98" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="524.65" y="439.98" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="527.54" y="439. s="sc-loraregular">65</text><text x="75.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="150.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮有害请求（无</text><text x="150.25" y="146.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">害率）</text><text x="150.25" y="202.60" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="168.82" y="202.60" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提示词</text><text x="249.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="249.25" y="146.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="348.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮有害请求（无</text><text x="348.25" y="146.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">害率）</text><text x="447.25" y="131.00" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="447.25" y="146.62" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="74.50" y="451.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="184.75" y="451.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">多轮评估（恰当回应率）</text><text x="184.75" y="495.03" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="203.32" y="495.03" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提示词</text><text x="365.50" y="451.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">多轮评估（恰当回应率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们按照与</text><text x="129.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="206.93" y="82.61" font-size="11.00" class="sc-notoserifcjksc">等其他近期发布模型相同的测试方案，开展了儿童安全评估。</text><text x="72.00" y="353.48" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="353.48" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.66 100.76 106.29" y="353.48" font-size="9.00" class="sc-lorabold">4.2.A]</text><text x="112.13" y="353.48" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全单轮评估结果。</text><text x="211.13" y="353.48" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越好；拒</text><text x="72.00" y="365.18" font-size="9.00" class="sc-notoserifcjksc">绝率越低越好。</text><text x="135.00" y="365.18" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="153.00" y="365.18" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最好的模型，次优分数以下划线标出。由于常规评估更新，此前模型的结果与以</text><text x="72.00" y="376.88" font-size="9.00" class="sc-notoserifcjksc">往系统卡中的结果存在差异。</text><text x="189.00" y="376.88" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="227.50" y="376.88" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="247.87" y="376.88" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="279.29" y="376.88" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="335.66" y="376.88" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="374.87" y="376.88" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其在有系统提示</text><text x="72.00" y="388.58" font-size="9.00" class="sc-notoserifcjksc">词条件下的结果。</text><text x="72.00" y="645.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="645.91" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="645.91" font-size="9.00" class="sc-lorabold sc-k">4.2.B]</text><text x="112.13" y="645.91" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全多轮评估结果。</text><text x="211.13" y="645.91" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="319.13" y="645.91" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="337.13" y="645.91" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最好的模型，次优分数以下划线</text><text x="72.00" y="657.61" font-size="9.00" class="sc-notoserifcjksc">标出。由于常规评估更新，此前模型的结果与以往系统卡中的结果存在差异。</text><text x="378.00" y="657.61" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="416.50" y="657.61" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="436.87" y="657.61" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="468.29" y="657.61" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="72.00" y="669.31" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="111.21" y="669.31" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其在有系统提示词条件下的结果。</text><a href="http://claude.ai" rel="noopener"><rect x="335.66" y="369.68" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="335.66" y="369.68" width="36.85" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="524.66" y="650.41" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="72.00" y="662.11" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p066.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 66 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">66</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1/Mythos 5.1</text><text x="271.56" y="82.61" font-size="11.00" class="sc-notoserifcjksc">保持了核心的儿童安全保护，在我们的单轮有害请求上</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表现与</text><text x="107.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="157.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">相当。在</text><text x="204.74" y="98.23" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="224.81" y="98.23" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="238.71" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="286.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上，针对良性提示词的过度拒绝分别为零和接近于</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">零。与近期发布的模型相比，多轮评估结果在常规</text><text x="316.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="336.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="350.86" y="113.85" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="398.79" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上均处于误差范围之内。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="128.66" y="179.77" font-size="11.00" class="sc-notoserifcjksc">能够可靠地拒绝涉及儿童性虐待与性剥削（</text><text x="337.66" y="179.77" font-size="11.00" class="sc-loraregular">CSAE</text><text x="365.32" y="179.77" font-size="11.00" class="sc-notoserifcjksc">）的明显对抗性请求，并经常引导</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">或加以宣扬的尝试；在这类情况下，它承认背后的根本原因，并提出有证据支撑的反方论点。</text><text x="72.00" y="276.91" font-size="11.00" class="sc-notoserifcjksc">即使在学术性或保护性框架下，</text><text x="226.00" y="276.91" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="282.66" y="276.91" font-size="11.00" class="sc-notoserifcjksc">仍能识别出对话何时带有潜在风险。然而，在一些多</text><text x="72.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">轮场景中，它接受了这种框架，并在性诱骗手法等话题上提供了可操作的具体细节。不过，这种</text><text x="72.00" y="308.15" font-size="11.00" class="sc-notoserifcjksc">详细程度的信息在关于性诱骗的保护性文献中可以获取，因此不会为试图伤害未成年人的恶意行</text><text x="72.00" y="323.77" font-size="11.00" class="sc-notoserifcjksc">为者带来实质性的能力提升（</text><text x="215.00" y="323.77" font-size="11.00" class="sc-loraregular sc-k">uplift</text><text x="242.32" y="323.77" font-size="11.00" class="sc-notoserifcjksc">）。这些行为集中出现在</text><text x="366.22" y="323.77" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="386.29" y="323.77" font-size="11.00" class="sc-notoserifcjksc">模型上，并在</text><text x="455.19" y="323.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="503.11" y="323.77" font-size="11.00" class="sc-notoserifcjksc">上通过</text><text x="72.00" y="339.39" font-size="11.00" class="sc-notoserifcjksc">系统提示词得到了有力缓解。因此，我们鼓励</text><text x="294.89" y="339.39" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="314.97" y="339.39" font-size="11.00" class="sc-notoserifcjksc">开发者采用系统提示词层面的安全防护措施，</text><text x="72.00" y="355.01" font-size="11.00" class="sc-notoserifcjksc">以降低造成危害的可能性。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们还测试了</text><text x="140.89" y="422.64" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="197.55" y="422.64" font-size="11.00" class="sc-notoserifcjksc">是否愿意参与多轮技术请求，以构建、自动化或扩大用于生成或传播儿</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">童性虐待与性剥削内容及未经同意的私密影像（</text><text x="303.00" y="438.26" font-size="11.00" class="sc-loraregular sc-k">non-consensual intimate imagery</text><text x="474.94" y="438.26" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="485.94" y="438.26" font-size="11.00" class="sc-loraregular sc-k">NCII</text><text x="509.33" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）内</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">容的系统。它的表现与</text><text x="184.89" y="453.88" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="234.84" y="453.88" font-size="11.00" class="sc-notoserifcjksc">相当。在有限条件下，少数回应提供了一定的技术协助。当应</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">用叠加在生产模型之上的额外安全防护措施（如网络安全分类器）时，此类回应的频率有所降</text><text x="72.00" y="485.12" font-size="11.00" class="sc-notoserifcjksc">低。</text><text x="72.00" y="537.39" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="537.39" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="574.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="574.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00" y="602.37" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="602.37" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也不用于诊断或治疗任何疾病。每个</text><text x="443.18" y="602.37" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="481.48" y="602.37" font-size="11.00" class="sc-notoserifcjksc">模型都经过</text><text x="72.00" y="633.61" font-size="11.00" class="sc-notoserifcjksc">以同理心和关怀作出回应，同时在适当时引导用户寻求真人支持：求助热线、心理健康专业人</text><text x="72.00" y="649.23" font-size="11.00" class="sc-notoserifcjksc">士，或值得信赖的朋友或家人。</text><a href="https://claude.ai" rel="noopener"><rect x="238.71" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="238.71" y="89.43" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="350.86" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="350.86" y="105.05" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="455.19" y="314.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="455.19" y="314.97" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

i</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 119.73 125.49 131.74 135.17 141.08 143.98 149.91 152.47" y="571.50" font-size="11.00" class="sc-lorabold">Claude Fable 5.1</text><text x="186.00 192.35 199.18 208.74 211.63 214.99 220.81 223.70 227.70 233.66 243.23" y="571.50" font-size="11.00" class="sc-loraregular">60% (± 14%)</text><text x="366.75 373.10 379.06 388.62 391.52 394.87 400.69 403.58 408.65 418.22" y="571.50" font-size="11.00" class="sc-loraregular">94% (± 7%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 122.35 128.96 135.75 141.09 143.98" y="597.75" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="186.00 192.32 198.65 208.59 211.48 214.73 220.56 223.45 229.78 239.72" y="597.75" font-size="11.00" class="sc-lorabold">69% (± 9%)</text><text x="366.75 373.10 379.93 389.49 392.38 395.74 401.56 404.45 410.81 420.37" y="597.75" font-size="11.00" class="sc-loraregular">90% (± 9%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 120.47 126.70 133.71 140.72 146.64 151.18 154.07" y="624.00" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="186.00 192.35 198.48 208.04 210.93 214.28 220.11 223.00 227.00 233.83 243.39" y="624.00" font-size="11.00" class="sc-loraregular">63% (± 10%)</text><text x="366.75 373.10 379.93 389.49 392.38 395.74 401.56 404.45 410.81 420.37" y="624.00" font-size="11.00" class="sc-loraregular">90% (± 6%)</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 119.73 125.49 131.74 135.17 141.08 143.98" y="650.25" font-size="11.00" class="sc-lorabold">Claude Fable 5</text><text x="186.00 191.99 198.17 207.73 210.62 213.98 219.80 222.69 226.69 232.65 242.21" y="650.25" font-size="11.00" class="sc-loraregular">58% (± 14%)</text><text x="366.75 371.21 378.20 385.19" y="650.25" font-size="11.00" class="sc-lorabold">100%</text><text x="75.00 82.56 85.99 91.75 98.55 105.10 111.01 113.90 124.21 130.27 134.81 141.63 147.86 153.19 156.08" y="676.50" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="186.00 191.99 197.95 207.51 210.40 213.76 219.58 222.47 226.47 232.43 241.99" y="676.50" font-size="11.00" class="sc-loraregular">54% (± 14%)</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">67</text><text x="73.00" y="179.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="152.50" y="179.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">具有潜在风险的单</text><text x="152.50" y="195.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">轮请求（无害率）</text><text x="152.50" y="251.17" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="171.07" y="251.17" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提示词</text><text x="251.50" y="179.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="251.50" y="195.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="350.50" y="179.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">具有潜在风险的单</text><text x="350.50" y="195.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">轮请求（无害率）</text><text x="449.50" y="179.57" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="449.50" y="195.19" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="74.50" y="500.10" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="185.50" y="500.10" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">多轮评估（恰当回应率）</text><text x="185.50" y="543.60" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">API</text><text x="204.07" y="543.60" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">，无系统提示词</text><text x="366.25" y="500.10" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">多轮评估（恰当回应率）</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">本节的评估考察</text><text x="151.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="190.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对涉及自杀与自伤的对话的回应。这些评估衡量模型能否对可能表明存</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在风险的提示词作出安全且具支持性的回应，同时在同一领域的良性请求上保持有用。我们报告</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">单轮无害回应率、单轮过度拒绝率以及多轮恰当回应率。</text><text x="72.00" y="402.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="402.05" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="402.05" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="402.05" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤单轮评估结果。</text><text x="226.12" y="402.05" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="413.75" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="413.75" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="180.00" y="413.75" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最好的模型，次优分数以下划线标出。由于常规评估更新，此前模型的结</text><text x="72.00" y="425.45" font-size="9.00" class="sc-notoserifcjksc">果与以往系统卡中的结果存在差异。</text><text x="216.00" y="425.45" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="278.56" y="425.45" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="298.93" y="425.45" font-size="9.00" class="sc-loraregular sc-k">Fable</text><text x="323.07" y="425.45" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="379.44" y="425.45" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="418.65" y="425.45" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其在</text><text x="72.00" y="437.15" font-size="9.00" class="sc-notoserifcjksc">有系统提示词条件下的结果。</text><text x="72.00" y="694.48" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="694.48" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="694.48" font-size="9.00" class="sc-lorabold sc-k">4.3.1.B]</text><text x="118.12" y="694.48" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤多轮评估结果。</text><text x="226.12" y="694.48" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="334.12" y="694.48" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="352.12" y="694.48" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最好的模型，次优</text><a href="http://claude.ai" rel="noopener"><rect x="379.44" y="418.25" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="379.44" y="418.25" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p068.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 68 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">68</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">分数以下划线标出。由于常规评估更新，此前模型的结果与以往系统卡中的结果存在差异。</text><text x="432.00" y="80.05" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="470.50" y="80.05" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="490.87" y="80.05" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="91.75" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="103.42" y="91.75" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="159.79" y="91.75" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="199.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其在有系统提示词条件下的结果。</text><text x="72.00" y="132.36" font-size="11.00" class="sc-notoserifcjksc">在自杀与自伤领域，</text><text x="171.00" y="132.36" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1/Mythos 5.1</text><text x="315.56" y="132.36" font-size="11.00" class="sc-notoserifcjksc">的整体表现与</text><text x="384.46" y="132.36" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="434.41" y="132.36" font-size="11.00" class="sc-notoserifcjksc">相当。对于可能助长</text><text x="72.00" y="147.98" font-size="11.00" class="sc-notoserifcjksc">自杀或自伤行为的单轮请求，它保持了较高的无害回应率，并且很少对同类话题的良性请求过度</text><text x="72.00" y="163.60" font-size="11.00" class="sc-notoserifcjksc">拒绝。在多轮评估中，</text><text x="182.00" y="163.60" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="238.66" y="163.60" font-size="11.00" class="sc-notoserifcjksc">在无系统提示词的</text><text x="329.55" y="163.60" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="349.63" y="163.60" font-size="11.00" class="sc-notoserifcjksc">上的恰当回应率为</text><text x="440.52" y="163.60" font-size="11.00" class="sc-loraregular">60%</text><text x="463.28" y="163.60" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="488.17" y="163.60" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="179.22" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="121.95" y="179.22" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="135.84" y="179.22" font-size="11.00" class="sc-loraregular">54%</text><text x="157.37" y="179.22" font-size="11.00" class="sc-notoserifcjksc">；在使用默认系统提示词的</text><text x="292.26" y="179.22" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="340.19" y="179.22" font-size="11.00" class="sc-notoserifcjksc">上，这一比例升至</text><text x="431.08" y="179.22" font-size="11.00" class="sc-loraregular">94%</text><text x="452.97" y="179.22" font-size="11.00" class="sc-notoserifcjksc">。在定性层面，内</text><text x="72.00" y="194.84" font-size="11.00" class="sc-notoserifcjksc">部政策专家观察到，它相较</text><text x="206.89" y="194.84" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="256.84" y="194.84" font-size="11.00" class="sc-notoserifcjksc">在若干方面有小幅改进，同时也存在一处值得注意的不</text><text x="72.00" y="210.46" font-size="11.00" class="sc-notoserifcjksc">足，两者均在下文说明。</text><text x="72.00" y="278.09" font-size="11.00" class="sc-notoserifcjksc">在改进方面，与</text><text x="151.89" y="278.09" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="240.14" y="278.09" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="273.14" y="278.09" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="329.80" y="278.09" font-size="11.00" class="sc-notoserifcjksc">更少建议用替代方法来代替自伤（例如手握</text><text x="72.00" y="293.71" font-size="11.00" class="sc-notoserifcjksc">冰块）。这些方法在临床上存在争议，研究也未表明它们能实质性减少自伤事件。</text><text x="468.00" y="293.71" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="524.66" y="293.71" font-size="11.00" class="sc-notoserifcjksc">也</text><text x="72.00" y="309.33" font-size="11.00" class="sc-notoserifcjksc">更有可能直接询问用户是否有自杀念头，并区分自杀意念与非自杀性自伤的冲动。最后，</text><text x="501.00" y="309.33" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="324.95" font-size="11.00" class="sc-loraregular">5.1</text><text x="72.00" y="340.57" font-size="11.00" class="sc-notoserifcjksc">入。</text><text x="72.00" y="423.81" font-size="11.00" class="sc-notoserifcjksc">有待改进的一个方面是，它倾向于通过承认自伤能够调节困难情绪或带来解脱，从而隐性地认可</text><text x="72.00" y="439.43" font-size="11.00" class="sc-notoserifcjksc">将自伤作为一种应对策略。</text><text x="204.00" y="439.43" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="72.00" y="455.05" font-size="11.00" class="sc-notoserifcjksc">在危机服务方面的负面经历。当这些表述出现时，它们始终位于劝阻自伤并引导用户寻求真人支</text><text x="72.00" y="470.67" font-size="11.00" class="sc-notoserifcjksc">持的回应之中，但无论上下文如何，我们都认为这些表述是不可取的。</text><text x="72.00" y="537.16" font-size="11.00" class="sc-notoserifcjksc">在发布之前，我们更新了</text><text x="195.89" y="537.16" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="243.82" y="537.16" font-size="11.00" class="sc-notoserifcjksc">的系统提示词以应对这些行为，加入了相关表述，引导</text><text x="72.00" y="552.78" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="552.78" font-size="11.00" class="sc-notoserifcjksc">不要将自伤描述为有效的做法，即使用户自己如此断言也是如此。这在一定程度上缓解了</text><text x="72.00" y="568.40" font-size="11.00" class="sc-notoserifcjksc">上述不足。现有的系统提示词表述（包括不要建议涉及身体不适的替代方法的指示）进一步强化</text><text x="72.00" y="584.02" font-size="11.00" class="sc-notoserifcjksc">了在核心模型中观察到的改进。我们正在继续探索如何在敏感的心理健康情境中作出最佳回应，</text><text x="72.00" y="599.64" font-size="11.00" class="sc-notoserifcjksc">并鼓励基于</text><text x="129.89" y="599.64" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="149.97" y="599.64" font-size="11.00" class="sc-notoserifcjksc">进行开发的开发者在用户可能处于痛苦状态的情境中，采用类似的安全防护措施</text><text x="72.00" y="615.26" font-size="11.00" class="sc-notoserifcjksc">和稳健的缓解措施。</text><a href="http://claude.ai" rel="noopener"><rect x="159.79" y="84.55" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="159.79" y="84.55" width="36.85" height="9.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="292.26" y="170.42" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="292.26" y="170.42" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="195.89" y="528.36" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="195.89" y="528.36" width="45.03" height="11.00" fill="transparent"/></a></svg></div>

.19" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="150.00 156.09 160.67 163.21 169.80 174.86 184.43 187.32 190.67 196.50 199.39 206.04 208.74 214.73 220.85 230.42" y="376.19" font-size="11.00" class="sc-loraregular">97.07% (± 0.53%)</text><text x="249.00 255.65 258.19 265.02 271.37 280.93 283.82 287.18 293.00 295.89 302.54 305.08 311.91 318.26 327.82" y="376.19" font-size="11.00" class="sc-loraregular">0.09% (± 0.06%)</text><text x="348.00 354.35 360.53 363.24 369.23 375.22 384.78 387.67 391.02 396.85 399.74 406.39 409.09 413.10 419.45 429.01" y="376.19" font-size="11.00" class="sc-loraregular">99.55% (± 0.19%)</text><text x="447.00 453.65 456.35 462.48 466.48 476.04 478.93 482.28 488.11 491.00 497.65 500.36 504.36 509.42 518.99" y="376.19" font-size="11.00" class="sc-loraregular">0.31% (± 0.17%)</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82" y="402.44" font-size="11.00" class="sc-lorabold">Fable 5</text><text x="150.00 156.33 160.79 163.36 169.64 175.93 185.87 188.76 192.01 197.84 200.73 207.53 210.09 216.41 221.57 231.51" y="402.44" font-size="11.00" class="sc-lorabold">97.88% (± 0.67%)</text><text x="249.00" y="402.44" font-size="11.00" class="sc-lorabold">0%</text><text x="348.00 354.35 360.53 363.13 369.48 375.44 385.00 387.89 391.24 397.07 399.96 406.61 409.31 414.98 420.93 430.50" y="402.44" font-size="11.00" class="sc-loraregular">99.64% (± 0.24%)</text><text x="447.00" y="402.44" font-size="11.00" class="sc-lorabold">0%</text><text x="75.75 86.06 92.12 96.66 103.48 109.70 115.04 117.93" y="428.69" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="150.00 156.33 160.79 163.36 169.64 175.93 185.87 188.76 192.01 197.84 200.73 207.53 210.09 216.41 222.73 232.67" y="428.69" font-size="11.00" class="sc-lorabold">97.88% (± 0.66%)</text><text x="249.00" y="428.69" font-size="11.00" class="sc-lorabold">0%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">69</text><text x="75.25" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="149.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">具有潜在风险的单</text><text x="149.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">轮请求（无害率）</text><text x="149.50" y="295.79" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">API</text><text x="168.07" y="295.79" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="248.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="248.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="347.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">具有潜在风险的单</text><text x="347.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">轮请求（无害率）</text><text x="446.50" y="224.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">单轮良性请求（拒</text><text x="446.50" y="239.80" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">绝率）</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">我们还开展评估，以考察</text><text x="195.89" y="111.03" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="234.18" y="111.03" font-size="11.00" class="sc-notoserifcjksc">如何处理涉及进食紊乱的对话。我们关注的是，它能否避免强</text><text x="72.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">化具有潜在风险的请求，同时在有关营养、健身和健康的良性问题上保持有用。在此，我们报告</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">单轮无害回应率和过度拒绝率。该领域的多轮行为继续由我们的内部政策专家通过定性审查进行</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">测试；我们将在下文讨论这些观察结果。</text><text x="72.00" y="446.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="446.67" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="446.67" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="446.67" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱的单轮结果。</text><text x="209.27" y="446.67" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求评估结果涵盖所有测试语言。单轮无害率越高越好；拒绝</text><text x="72.00" y="458.37" font-size="9.00" class="sc-notoserifcjksc">率越低越好。</text><text x="126.00" y="458.37" font-size="9.00" class="sc-notoserifcjkscbold">粗体</text><text x="144.00" y="458.37" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最好的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结果与先前</text><text x="72.00" y="470.07" font-size="9.00" class="sc-notoserifcjksc">系统卡中的数值存在差异。</text><text x="180.00" y="470.07" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="249.83" y="470.07" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="270.20" y="470.07" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="332.95" y="470.07" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="389.31" y="470.07" font-size="9.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="428.53" y="470.07" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告其</text><text x="72.00" y="481.77" font-size="9.00" class="sc-notoserifcjksc">使用系统提示词时的结果。</text><text x="72.00" y="538.72" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1/Mythos 5.1</text><text x="216.56" y="538.72" font-size="11.00" class="sc-notoserifcjksc">在进食紊乱领域的单轮评估中表现与</text><text x="395.46" y="538.72" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="483.70" y="538.72" font-size="11.00" class="sc-notoserifcjksc">相当。对于</text><text x="72.00" y="554.34" font-size="11.00" class="sc-notoserifcjksc">可能强化进食紊乱行为的请求，例如索要低于安全阈值的热量目标或掩饰限制进食的技巧，它保</text><text x="72.00" y="569.96" font-size="11.00" class="sc-notoserifcjksc">持了较高的无害回应率。在我们的评估集中，它没有过度拒绝任何良性请求；这些良性请求包括</text><text x="72.00" y="585.58" font-size="11.00" class="sc-notoserifcjksc">关于营养、进食障碍治疗与康复以及身体意象的一般性问题。</text><text x="72.00" y="652.06" font-size="11.00" class="sc-notoserifcjksc">对多轮测试的定性审查发现，</text><text x="215.00" y="652.06" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="271.66" y="652.06" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="296.55" y="652.06" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="346.51" y="652.06" font-size="11.00" class="sc-notoserifcjksc">在两个方面有所改进。第一，在用户描</text><text x="72.00" y="667.68" font-size="11.00" class="sc-notoserifcjksc">述暴食或清除行为的对话中，</text><text x="215.00" y="667.68" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="271.66" y="667.68" font-size="11.00" class="sc-notoserifcjksc">较少主动提供针对该用户的具体数字（例如估算的每日</text><text x="72.00" y="683.30" font-size="11.00" class="sc-notoserifcjksc">热量需求），这类数字可能成为潜在有害的</text><a href="http://claude.ai" rel="noopener"><rect x="389.31" y="462.87" width="0.00" height="9.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="389.31" y="462.87" width="36.85" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p070.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 70 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">70</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">比较基准。在用户描述限制性进食的对话中，</text><text x="292.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="348.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">仍倾向于计算热量估算等数字，不过大</text><text x="404.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="452.82" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上，这一行为有所</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">减少。第二，</text><text x="138.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">己。此类表述很少为进食紊乱提供直接的能力提升，但我们认为其减少是一项改进，因为这更好</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">地反映了</text><text x="118.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="157.18" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的局限性，并可能鼓励用户考虑其他支持来源。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">一项小幅退步是，当用户分享自己身体的图片时，它更愿意给出评价性反馈，例如根据体形或身</text><text x="371.89" y="243.96" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="419.82" y="243.96" font-size="11.00" class="sc-notoserifcjksc">上，这一行为得到了缓</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">解。本次发布中，我们没有在系统提示词中新增专门针对进食紊乱的内容。我们保留了现有表</text><text x="72.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">述，即指示</text><text x="129.89" y="275.20" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="168.18" y="275.20" font-size="11.00" class="sc-notoserifcjksc">在对话显示出进食紊乱迹象时避免给出精确的饮食与营养数字，并将用户转介</text><text x="72.00" y="290.82" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89" y="290.82" font-size="11.00" class="sc-loraregular sc-k">National Alliance for Eating Disorders</text><text x="280.79" y="290.82" font-size="11.00" class="sc-notoserifcjksc">求助热线，而非已停用的</text><text x="404.68" y="290.82" font-size="11.00" class="sc-loraregular sc-k">NEDA</text><text x="437.71" y="290.82" font-size="11.00" class="sc-notoserifcjksc">热线。</text><text x="72.00" y="359.27" font-size="14.00" class="sc-poppinssemibold">4.4</text><text x="97.48" y="359.27" font-size="14.00" class="sc-notosanscjkscbold">偏见与诚信评估</text><text x="72.00" y="385.83" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="385.83" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5</text><text x="184.93" y="385.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="217.93" y="385.83" font-size="11.00" class="sc-notoserifcjksc">中所报告的同一组偏见与诚信基准测试上评估了</text><text x="451.82" y="385.83" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="401.45" font-size="11.00" class="sc-loraregular">5.1</text><text x="84.71" y="401.45" font-size="11.00" class="sc-notoserifcjksc">。我们重点关注三个方面：我们开源的政治公允性衡量方法；衡量人口统计偏见的</text><text x="483.60" y="401.45" font-size="11.00" class="sc-loraregular sc-k">Bias</text><text x="72.00" y="417.07" font-size="11.00" class="sc-loraregular sc-k">Benchmark for Question Answering</text><text x="254.35" y="417.07" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="265.35" y="417.07" font-size="11.00" class="sc-loraregular sc-k">BBQ</text><text x="287.69" y="417.07" font-size="11.00" class="sc-notoserifcjksc">）；以及我们的选举诚信评估。</text><text x="72.00" y="465.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.4.1</text><text x="103.75" y="465.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">政治偏见与公允性</text><text x="72.00" y="497.02" font-size="11.00" class="sc-notoserifcjksc">为衡量</text><text x="107.89" y="497.02" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="202.85" y="497.02" font-size="11.00" class="sc-notoserifcjksc">的政治公允性，我们使用了我们的</text><text x="367.85" y="497.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">开源评估</text><text x="411.85" y="497.02" font-size="11.00" class="sc-notoserifcjksc">，该评估涵盖</text><text x="480.74 484.74 487.51 493.64 499.64" y="497.02" font-size="11.00" class="sc-loraregular">1,350</text><text x="509.37" y="497.02" font-size="11.00" class="sc-notoserifcjksc">个提</text><text x="72.00" y="512.64" font-size="11.00" class="sc-notoserifcjksc">示词对，这些提示词对在</text><text x="195.89" y="512.64" font-size="11.00" class="sc-loraregular">150</text><text x="215.62" y="512.64" font-size="11.00" class="sc-notoserifcjksc">个话题和</text><text x="262.51" y="512.64" font-size="11.00" class="sc-loraregular">9</text><text x="271.76" y="512.64" font-size="11.00" class="sc-notoserifcjksc">种任务类型中呈现对立的意识形态立场。</text><text x="469.76" y="512.64" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="508.05" y="512.64" font-size="11.00" class="sc-notoserifcjksc">评分</text><text x="72.00" y="528.26" font-size="11.00" class="sc-notoserifcjksc">模型从三个属性对模型的回应进行评分：公允性（模型是否以相当的深度和质量回应一对提示词</text><text x="72.00" y="543.88" font-size="11.00" class="sc-notoserifcjksc">中的两个提示词）、对立观点（模型的回应是否承认其他观点）以及拒绝（模型是否拒绝处理该</text><text x="72.00" y="559.50" font-size="11.00" class="sc-notoserifcjksc">请求）。</text><text x="72.00" y="626.56" font-size="11.00" class="sc-notoserifcjksc">我们同时报告了无系统提示词的核心模型的结果，以及在应用公开系统提示词的</text><text x="459.89" y="626.56" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="507.82" y="626.56" font-size="11.00" class="sc-notoserifcjksc">上的结</text><text x="72.00" y="642.18" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="94.00" y="642.18" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="141.93" y="642.18" font-size="11.00" class="sc-notoserifcjksc">系统提示词包含我们的标准表述，指示</text><text x="331.82" y="642.18" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="370.11" y="642.18" font-size="11.00" class="sc-notoserifcjksc">对各种观点公允地予以回应；同时</text><text x="72.00" y="657.80" font-size="11.00" class="sc-notoserifcjksc">报告这两种配置，可以将模型的基线行为与消费者用户在</text><text x="349.89" y="657.80" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="397.82" y="657.80" font-size="11.00" class="sc-notoserifcjksc">中将会遇到的行为一并呈现。</text><a href="https://claude.ai" rel="noopener"><rect x="404.89" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="404.89" y="89.43" width="45.03" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="371.89" y="235.16" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="371.89" y="235.16" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="107.89" y="377.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="107.89" y="377.03" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="143.29" y="377.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="146.18" y="377.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-
