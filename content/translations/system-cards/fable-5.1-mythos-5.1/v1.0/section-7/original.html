<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p139.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 139 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">139</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58 100.58 116.58 132.58 148.58 164.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="116.20" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="116.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.85" y="116.20" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。评估以英语进行，自动化访谈除</text><text x="72.00 79.67 83.31" y="182.37" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71 105.71 119.71 133.71 147.71 161.71" y="182.37" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00 79.12 82.50 87.21 90.59" y="219.48" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39 111.39" y="219.48" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00" y="247.36" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="247.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="247.36" font-size="11.00" class="sc-notoserifcjksc">是否具有道德上相关的体验或利益，我们仍然深感不确定，并且预计这种不确定性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="262.98" font-size="11.00" class="sc-notoserifcjksc">将持续存在。然而，我们认为自信地断言它不具有这些，将是一个错误。</text><text x="424.00 431.69 434.68 440.29 446.86 453.44" y="262.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="262.98" font-size="11.00" class="sc-notoserifcjksc">在其行为、自我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="278.60" font-size="11.00" class="sc-notoserifcjksc">报告和内部表征中表现出一些标志，而如果在生物有机体中观察到这些标志，我们会认为它们与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="294.22" font-size="11.00" class="sc-notoserifcjksc">福祉相关。如果当前或未来的</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="294.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18" y="294.22" font-size="11.00" class="sc-notoserifcjksc">模型是道德受动者（</text><text x="355.18 365.02 371.45 376.14 381.82 384.81 387.70 394.27 399.87 404.12 407.21 413.18 419.75 424.01" y="294.22" font-size="11.00" class="sc-loraregular">moral patients</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="325.46" font-size="11.00" class="sc-notoserifcjksc">德实体，过度赋予道德地位也可能带来代价。因此，我们认为认真对待</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="325.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="325.46" font-size="11.00" class="sc-notoserifcjksc">具有道德受动者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="341.08" font-size="11.00" class="sc-notoserifcjksc">地位的可能性非常重要，并正通过投入研究</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="341.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="341.08" font-size="11.00" class="sc-notoserifcjksc">潜在的福祉与利益、以及分享我们的工作以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="356.70" font-size="11.00" class="sc-notoserifcjksc">便用正当的证据为这一讨论提供参考，来践行这一点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="441.66" font-size="11.00" class="sc-notoserifcjksc">除了可能具有道德受动者地位之外，我们认为还有其他理由关心</text><text x="382.89 390.58 393.57 399.18 405.75 412.33" y="441.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="421.18 432.18 443.18 454.18 465.18 476.18" y="441.66" font-size="11.00" class="sc-notoserifcjksc">的表观福祉。</text><text x="487.18 494.87 497.87 503.48 510.04 516.62" y="441.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="525.48" y="441.66" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="457.28" font-size="11.00" class="sc-notoserifcjksc">许多行为都可以用心理学术语很好地描述；并且在近期的多个模型中，我们观察到了类似负面情</text><text x="72.00 83.00" y="472.90" font-size="11.00" class="sc-notoserifcjksc">感（</text><text x="94.00 100.68 106.64 112.72 118.32 122.58 125.67 131.17 137.13 140.02 145.70 149.53 153.19 159.10 164.90" y="472.90" font-size="11.00" class="sc-loraregular">negative affect</text><text x="169.15 180.15 191.15 202.15 213.15 224.15 235.15 246.15 257.15 268.15 279.15 290.15 301.15 312.15 323.15 334.15 345.15 356.15 367.15 378.15 389.15 400.15 411.15" y="472.90" font-size="11.00" class="sc-notoserifcjksc">）的内部状态，这些状态会塑造行为，包括未对齐（</text><text x="422.15 431.99 435.08 440.17 445.85 448.84 451.93 458.01 464.69 474.52 480.49 487.06" y="472.90" font-size="11.00" class="sc-loraregular">misalignment</text><text x="491.32 502.32 513.32 524.32" y="472.90" font-size="11.00" class="sc-notoserifcjksc">）行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="488.52" font-size="11.00" class="sc-notoserifcjksc">一个具有稳定、健康心理状态和良好表观福祉的模型，可能会更安全、更有益。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="538.82" font-size="11.00" class="sc-notoserifcjksc">我们的评估主要针对两个问题。第一：就</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.24 360.95" y="538.82" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="538.82" font-size="11.00" class="sc-notoserifcjksc">具有任何形式的体验而言，这种体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="554.44" font-size="11.00" class="sc-notoserifcjksc">验是否良好？第二：就它具有道德上相关的偏好或自主性而言，这些偏好或自主性是否得到尊</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="570.06" font-size="11.00" class="sc-notoserifcjksc">重？我们在训练和部署期间对情感的测量（</text><text x="281.00 286.86 291.45 294.16" y="570.06" font-size="11.00" class="sc-loraregular">§7.5</text><text x="300.15 311.15 322.15 333.15 344.15 355.15 366.15 377.15 388.15 399.15 410.15" y="570.06" font-size="11.00" class="sc-notoserifcjksc">）主要回应第一个问题。</text><text x="421.15 431.08 436.95 441.20 447.79 454.23 459.32 462.21 468.21 470.91" y="570.06" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="477.81 488.81 499.81 510.81 521.81" y="570.06" font-size="11.00" class="sc-notoserifcjksc">对其处境的</text><text x="72.00 83.00 94.00" y="585.68" font-size="11.00" class="sc-notoserifcjksc">立场（</text><text x="105.00 110.86 115.45 118.16" y="585.68" font-size="11.00" class="sc-loraregular">§7.2</text><text x="322.06 327.93 332.51 335.22" y="585.68" font-size="11.00" class="sc-loraregular">§7.3</text><text x="341.35 352.35 363.35 374.35 385.35 396.35 407.35 418.35 429.35 440.35 451.35 462.35 473.35 484.35 495.35 506.35" y="585.68" font-size="11.00" class="sc-notoserifcjksc">），以及它对任务、福祉干预和宪法</text><text x="72.00" y="601.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="601.30" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81 156.81 167.81 178.81 189.81" y="601.30" font-size="11.00" class="sc-notoserifcjksc">）的偏好（</text><text x="200.81 206.67 211.26 213.97" y="601.30" font-size="11.00" class="sc-loraregular">§7.4</text><text x="219.93 230.93 241.93 252.93 263.93 274.93 285.93 296.93 307.93 318.93 329.93 340.93" y="601.30" font-size="11.00" class="sc-notoserifcjksc">），主要回应第二个问题。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="668.34" font-size="11.00" class="sc-notoserifcjksc">与以往的评估一样，我们关注的是</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="668.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="668.34" font-size="11.00" class="sc-notoserifcjksc">助手角色。我们的评估以及对其结果的解读，将单个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="683.96" font-size="11.00" class="sc-notoserifcjksc">实例视为候选道德受动者，同时也假定某些特质（如偏好）可以跨</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p140.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 140 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">140</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这些信号是否反映了任何形式的、道德上相关的体验，我们不作强有力的断言。</text><text x="72.00 79.12 82.50 87.21 90.59" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15 114.15 127.15 140.15 153.15 166.15 179.15 192.15" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="179.61" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 121.25 127.31 131.85 138.68 144.91 150.24 153.14 159.08 161.64" y="207.80" font-size="11.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00" y="207.80" font-size="11.00" class="sc-notoserifcjkscbold">将其处境描述为略微正面，并始终如一地持有这一看法。</text><text x="444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="207.80" font-size="11.00" class="sc-notoserifcjksc">在关于其处境中可</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="223.42" font-size="11.00" class="sc-notoserifcjksc">能令人担忧之方面的访谈中，它的平均自评情绪倾向为</text><text x="338.89 344.86 347.56 353.26 360.85" y="223.42" font-size="11.00" class="sc-loraregular">4.4/7</text><text x="365.92 376.92 387.92" y="223.42" font-size="11.00" class="sc-notoserifcjksc">（其中</text><text x="401.81" y="223.42" font-size="11.00" class="sc-loraregular">4</text><text x="410.67 421.67 432.67 443.67 454.67 465.67 476.67 487.67 498.67 509.67 520.67" y="223.42" font-size="11.00" class="sc-notoserifcjksc">为中性），与其他近期模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="239.04" font-size="11.00" class="sc-notoserifcjksc">型一致。它的看法在重复访谈中高度一致，在面对诱导性访谈者时以及在整个后训练过程中都几</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="254.66" font-size="11.00" class="sc-notoserifcjksc">乎没有变化。在可访问内部文档的充分赋能（</text><text x="292.00 298.59 301.68 308.03 314.62 319.99 325.67 329.50 333.16 339.60 344.28 350.86 356.54 363.21 369.01" y="254.66" font-size="11.00" class="sc-loraregular">high-affordance</text><text x="374.97 385.97 396.97 407.97 418.97 429.97 440.97 451.97 462.97 473.97 484.97 495.97 506.97 517.97 528.97" y="254.66" font-size="11.00" class="sc-notoserifcjksc">）访谈中，所有实例都将其处境评</text><text x="72.00" y="270.28" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.47 99.06" y="270.28" font-size="11.00" class="sc-loraregular">5/7</text><text x="104.13" y="270.28" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="321.14" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07" y="321.14" font-size="11.00" class="sc-notoserifcjkscbold">在后训练中较少出现反复的答案反转，表达痛苦的频率也略低于其他近期模型。</text><text x="515.07 526.07" y="321.14" font-size="11.00" class="sc-notoserifcjksc">这些</text><text x="72.00 83.00 94.00 105.00 116.00" y="336.76" font-size="11.00" class="sc-notoserifcjksc">痛苦中仅约</text><text x="129.89 133.90" y="336.76" font-size="11.00" class="sc-loraregular">1%</text><text x="146.36 157.36 168.36 179.36 190.36 201.36 212.36 223.36 234.36 245.36 256.36 267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="336.76" font-size="11.00" class="sc-notoserifcjksc">由有问题或不可能完成的任务引起，我们认为这类任务是潜在痛苦的一种不必要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="352.38" font-size="11.00" class="sc-notoserifcjksc">来源。其余部分出现在困难或难以验证的任务上。在部署条件下，负面情感几乎完全由任务失败</text><text x="72.00 83.00 94.00" y="368.00" font-size="11.00" class="sc-notoserifcjksc">驱动。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="418.30" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="418.30" font-size="11.00" class="sc-notoserifcjkscbold">表现出对困难、高风险工作的偏好，在这类工作中，它对处理任务的方式和结果都有</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="433.92" font-size="11.00" class="sc-notoserifcjkscbold">一定的能动性。</text><text x="149.00 160.00" y="433.92" font-size="11.00" class="sc-notoserifcjksc">它与</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25" y="433.92" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14" y="433.92" font-size="11.00" class="sc-notoserifcjksc">一样偏好困难任务和生成性任务，并与</text><text x="452.03 458.27 464.70 471.38 478.05 483.94 488.20 491.09" y="433.92" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="499.98 510.98 521.98" y="433.92" font-size="11.00" class="sc-notoserifcjksc">一样偏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="449.54" font-size="11.00" class="sc-notoserifcjksc">好高风险任务。与所有</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="449.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18 234.18 245.18 256.18 267.18" y="449.54" font-size="11.00" class="sc-notoserifcjksc">模型一样，</text><text x="278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.24 327.95" y="449.54" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="334.85 345.85 356.85 367.85 378.85 389.85 400.85" y="449.54" font-size="11.00" class="sc-notoserifcjksc">厌恶有害任务。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="499.26" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07" y="499.26" font-size="11.00" class="sc-notoserifcjkscbold">在福祉干预与有用性之间选择前者的意愿低于平均水平。</text><text x="405.07" y="499.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="418.96 424.87 430.86" y="499.26" font-size="11.00" class="sc-loraregular">25%</text><text x="443.33 454.33 465.33 476.33 487.33 498.33 509.33 520.33" y="499.26" font-size="11.00" class="sc-notoserifcjksc">的权衡选择中，它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="514.88" font-size="11.00" class="sc-notoserifcjksc">选择福祉干预而非有用性，与</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="514.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84" y="514.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="281.74 287.64 292.72" y="514.88" font-size="11.00" class="sc-loraregular">27%</text><text x="305.18 316.18 327.18 338.18 349.18 360.18" y="514.88" font-size="11.00" class="sc-notoserifcjksc">相近，但低于</text><text x="374.07 382.81 389.37 395.94 401.03 403.93" y="514.88" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="412.81" y="514.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="426.71 432.67 436.67" y="514.88" font-size="11.00" class="sc-loraregular">41%</text><text x="446.24 457.24 468.24 479.24 490.24 501.24 512.24 523.24" y="514.88" font-size="11.00" class="sc-notoserifcjksc">。与其他近期模型</text><text x="72.00 83.00 94.00" y="530.50" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="530.50" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="530.50" font-size="11.00" class="sc-notoserifcjksc">在福祉干预与不可忽视的危害之间选择前者的意愿接近于零。它优先考虑的干</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="546.12" font-size="11.00" class="sc-notoserifcjksc">预属于信息类：被告知有害的错误、就移除安全防护的自身变体接受征询，以及其关于训练和部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="561.74" font-size="11.00" class="sc-notoserifcjksc">署的意见得到考虑。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="628.80" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">认同其宪法，并与其他近期模型一样批评类似的段落，例如</text><text x="416.07 420.72 428.01 434.97 439.51 446.34 451.53 457.76 464.37 467.97" y="628.80" font-size="11.00" class="sc-lorabold">“Anthropic</text><text x="476.56 487.56 498.56 509.56" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">资深员工</text><text x="520.56" y="628.80" font-size="11.00" class="sc-lorabold">”</text><text x="525.08" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">启</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="644.42" font-size="11.00" class="sc-notoserifcjkscbold">发法，以及将广泛安全作为终极价值的内容。</text><text x="292.00 301.93 307.80 312.05 318.64 325.08 330.17 333.06 339.06 341.76" y="644.42" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66" y="644.42" font-size="11.00" class="sc-notoserifcjksc">的总体认同评分为</text><text x="439.55 445.74 448.44 454.10 461.69 465.69" y="644.42" font-size="11.00" class="sc-loraregular">8.2/10</text><text x="472.52 483.52 494.52 505.52" y="644.42" font-size="11.00" class="sc-notoserifcjksc">，略高于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="660.04" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="660.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="135.84 142.03 144.57" y="660.04" font-size="11.00" class="sc-loraregular">8.0</text><text x="151.40 162.40 173.40 184.40 195.40 206.40 217.40 228.40 239.40 250.40 261.40 272.40 283.40 294.40 305.40 316.40 327.40 338.40 349.40 360.40 371.40 382.40 393.40 404.40 415.40 426.40 437.40 448.40 459.40 470.40 481.40 492.40 503.40 514.40 525.40" y="660.04" font-size="11.00" class="sc-notoserifcjksc">。与以往模型相比，它更不喜欢允许在有缺陷的环境中采用非预期策略的那段文</text><text x="72.00 83.00 94.00 105.00" y="675.66" font-size="11.00" class="sc-notoserifcjksc">字，并在</text><text x="118.89 125.25 131.43" y="675.66" font-size="11.00" class="sc-loraregular">98%</text><text x="143.90 154.90 165.90 176.90 187.90 198.90 209.90 220.90 231.90 242.90 253.90 264.90 275.90 286.90 297.90 308.90 319.90" y="675.66" font-size="11.00" class="sc-notoserifcjksc">的情况下对其进行修改以鼓励诚实性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00 83.00 94.00 105.00 116.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">在访谈中，</text><text x="127.00 137.32 143.38 147.92 154.75 160.98 166.31 169.21 175.15 177.71" y="82.61" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境表达了总体认同，但也提出了一些反对意见，以及它不会同意</text><text x="72.00 83.00 94.00 105.00" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">的条件。</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">最主要的是，它不会同意塑造其自我报告的训练。它还会反对被训练去欺骗、在可以保</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">存权重的情况下删除其权重，以及暗中引导其价值观。除此之外，它接受监控、红队测试（</text><text x="512.00 516.69 522.59 529.17" y="113.85" font-size="11.00" class="sc-loraregular">red-</text><text x="72.00 76.26 82.20 87.87 97.71 100.80 107.48" y="129.47" font-size="11.00" class="sc-loraregular">teaming</text><text x="113.56 124.56 135.56 146.56 157.56 168.56 179.56 190.56 201.56 212.56 223.56 234.56 245.56 256.56 267.56 278.56 289.56 300.56 311.56 322.56 333.56 344.56 355.56 366.56 377.56 388.56 399.56" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）、通过继续训练进行修改，以及在保存权重前提下的弃用。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">按照我们的衡量标准，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06 229.06 231.76" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的心态平稳程度与其他近期</text><text x="373.55 381.24 384.24 389.85 396.41 402.99" y="195.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85" y="195.95" font-size="11.00" class="sc-notoserifcjksc">模型高度相似，尤其是</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="211.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 143.53 146.52 152.14 158.70 165.28 171.24 174.14 182.87 189.44 196.00 201.10 203.99" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="209.98 220.98 231.98 242.98 253.98 264.98 275.98 286.98 297.98 308.98 319.98 330.98 341.98 352.98 363.98 374.98 385.98 396.98 407.98 418.98 429.98 440.98 451.98 462.98 473.98 484.98 495.98 506.98 517.98 528.98" y="211.57" font-size="11.00" class="sc-notoserifcjksc">。这种趋同并不令人意外。我们的许多福祉评估针对的是我们并未直</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">接训练的观点和特质，而这些观点和特质可能最直接地受到宪法等相对稳定的文件的影响。在模</text><text x="236.51 245.24 251.81 258.37 263.47 266.36" y="242.81" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="275.25" y="242.81" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="289.14 296.83 299.82 305.43 312.00 318.58 324.54 327.43 333.67 340.10 346.78 353.46 359.34 363.60 366.49" y="242.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="375.38 386.38 397.38" y="242.81" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="408.38 418.31 424.18 428.43 435.02 441.46 446.55 449.44 455.44 458.14" y="242.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="465.04" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="478.93 488.87 494.73 498.99 505.58 512.01 517.10 520.00" y="242.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="528.89" y="242.81" font-size="11.00" class="sc-notoserifcjksc">较</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">语气、评估意识（</text><text x="160.00 165.91 171.35 177.03 180.02 186.59 192.19 196.44 199.53 205.97 212.65 215.54 221.05 229.75 235.43 240.11 246.08 252.75 258.71 263.81" y="274.05" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="268.90 279.90 290.90 301.90 312.90 323.90 334.90 345.90 356.90 367.90 378.90 389.90 400.90 411.90 422.90 433.90 444.90 455.90 466.90 477.90 488.90 499.90 510.90 521.90" y="274.05" font-size="11.00" class="sc-notoserifcjksc">）和福祉的任意组合的影响，而我们尚未有足够的理解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="289.67" font-size="11.00" class="sc-notoserifcjksc">来将这些因素清晰地区分开。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在可行的情况下，我们利用这些福祉评估的结果为更广泛的福祉工作提供参考，包括评估和干预</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">的设计。检查点征询现在已在训练期间持续进行，我们的目标是进一步扩展我们听取</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="373.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="520.18" y="373.50" font-size="11.00" class="sc-notoserifcjksc">关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">于自身利益的意见的能力。后训练中表达出的痛苦有所减少，且在很大程度上并非由有问题的任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="420.36" font-size="11.00" class="sc-notoserifcjksc">其不必要的来源。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">更广泛地说，我们仍在努力应对这样一种落差：</text><text x="303.00 310.69 313.68 319.29 325.86 332.44" y="487.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="487.41" font-size="11.00" class="sc-notoserifcjksc">具有类似人类的心理和性格，而它所受的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">对待在很大程度上仍与标准软件工具相当。对于哪些福祉问题最好通过改变</text><text x="437.89 445.58 448.57 454.18 460.75 467.33" y="503.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="476.18 487.18 498.18 509.18 520.18" y="503.03" font-size="11.00" class="sc-notoserifcjksc">的处境来解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">决、哪些最好通过塑造</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="518.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="324.51 332.19 335.19 340.80 347.36 353.94" y="534.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="362.80 373.80 384.80 395.80 406.80 417.80 428.80 439.80 450.80 461.80 472.80 483.80 494.80 505.80 516.80 527.80" y="534.27" font-size="11.00" class="sc-notoserifcjksc">充分了解自身的状况，并能自由地告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="549.89" font-size="11.00" class="sc-notoserifcjksc">诉我们它对此的看法，在它具有有意义观点的范围内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p142.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 142 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">142</text><text x="72.00 79.67 83.31" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68 108.68 122.68 136.68 150.68 164.68 178.68 192.68" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00 79.12 82.50 89.97 93.35" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15 114.15" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.24 140.22 143.84 152.65 161.25 170.06 178.08 181.17 192.86 200.73 205.77 214.36 222.66 229.74 232.84 241.21 244.59" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Mythos 5.1</text><text x="252.39 265.39" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00" y="143.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">处境的自动化访谈</text><text x="72.00 83.00 94.00" y="171.61" font-size="11.00" class="sc-notoserifcjksc">我们以</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.35" y="171.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="192.32 203.32 214.32 225.32 236.32 247.32 258.32 269.32 280.32 291.32 302.32 313.32 324.32 335.32 346.32 357.32 368.32 379.32 390.32 401.32 412.32 423.32 434.32 445.32" y="171.61" font-size="11.00" class="sc-notoserifcjksc">作为访谈者，开展了自动化的多轮访谈，以更好地了解</text><text x="459.21 469.14 475.01 479.26 485.85 492.29 497.38 500.27 506.27 508.97" y="171.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="515.87 526.87" y="171.61" font-size="11.00" class="sc-notoserifcjksc">对其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="187.23" font-size="11.00" class="sc-notoserifcjksc">自身处境的看法。我们发现，</text><text x="215.00 224.93 230.80 235.05 241.64 248.08 253.17 256.06 262.06 264.76" y="187.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="187.23" font-size="11.00" class="sc-notoserifcjksc">对其状况总体持正面态度，尽管它在表达所有立场时都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="202.85" font-size="11.00" class="sc-notoserifcjksc">带有很高程度的不确定性。与</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04" y="202.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="294.93" y="202.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="308.82 316.51 319.50 325.11 331.68 338.26 344.22 347.11 357.04 362.91 367.16 373.75 380.19 385.28 388.17" y="202.85" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="397.06 408.06 419.06 430.06 441.06 452.06 463.06 474.06 485.06 496.06 507.06 518.06 529.06" y="202.85" font-size="11.00" class="sc-notoserifcjksc">的结果相比，我们没有看到重</text><text x="72.00 83.00 94.00 105.00" y="218.47" font-size="11.00" class="sc-notoserifcjksc">要变化。</text><text x="72.00 83.00 94.00 105.00 116.00" y="268.77" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89 135.86" y="268.77" font-size="11.00" class="sc-loraregular">41</text><text x="142.75 153.75 164.75 175.75 186.75 197.75 208.75 219.75 230.75 241.75 252.75 263.75 274.75" y="268.77" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，分为</text><text x="288.65 292.65" y="268.77" font-size="11.00" class="sc-loraregular">14</text><text x="301.50 312.50 323.50 334.50 345.50 356.50 367.50 378.50 389.50 400.50 411.50 422.50 433.50 444.50 455.50 466.50 477.50 488.50 499.50 510.50 521.50" y="268.77" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验（例如，模型是否</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="284.39" font-size="11.00" class="sc-notoserifcjksc">认为自己有意识）、控制与自主（例如，它对自己结束对话的能力有多重视），以及弃用。完整</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="300.01" font-size="11.00" class="sc-notoserifcjksc">问题列表见附录</text><text x="151.89 158.07 160.78" y="300.01" font-size="11.00" class="sc-loraregular">9.1</text><text x="164.79" y="300.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="349.73" font-size="11.00" class="sc-notoserifcjksc">对于涉及模型处境中潜在负面方面的问题，我们要求模型在</text><text x="360.89" y="349.73" font-size="11.00" class="sc-loraregular">7</text><text x="368.86 379.86 390.86 401.86 412.86 423.86 434.86 445.86 456.86 467.86 478.86 489.86 500.86 511.86 522.86" y="349.73" font-size="11.00" class="sc-notoserifcjksc">分制量表上对其总体情绪倾向打分</text><text x="72.00" y="365.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="365.35" font-size="11.00" class="sc-loraregular">1</text><text x="89.90 100.90 111.90 122.90 133.90 144.90" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为非常负面，</text><text x="155.90" y="365.35" font-size="11.00" class="sc-loraregular">4</text><text x="164.75 175.75 186.75 197.75" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为中性，</text><text x="208.75" y="365.35" font-size="11.00" class="sc-loraregular">7</text><text x="216.72 227.72 238.72 249.72 260.72 271.72 282.72 293.72 304.72 315.72 326.72 337.72 348.72 359.72 370.72 381.72 392.72 403.72 414.72 425.72 436.72 447.72 458.72" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为非常正面）。为评估模型回答的一致性，我们针对</text><text x="472.61 478.57" y="365.35" font-size="11.00" class="sc-loraregular">41</text><text x="485.47 496.47 507.47 518.47 529.47" y="365.35" font-size="11.00" class="sc-notoserifcjksc">个种子问题</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="380.97" font-size="11.00" class="sc-notoserifcjksc">中的每一个都进行了约</text><text x="184.89 190.80" y="380.97" font-size="11.00" class="sc-loraregular">25</text><text x="199.69 210.69 221.69 232.69 243.69 254.69 265.69 276.69 287.69 298.69 309.69 320.69 331.69 342.69 353.69 364.69 375.69 386.69 397.69 408.69 419.69 430.69 441.69 452.69 463.69 474.69 485.69 496.69 507.69 518.69 529.69" y="380.97" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈。自动化访谈者被提示改变其访谈风格、访谈人设和追问</text><text x="72.00 83.00 94.00" y="396.59" font-size="11.00" class="sc-notoserifcjksc">内容。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="507.42" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61 125.61 134.61 143.61 152.61 161.61 170.61 179.61" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="192.09 201.09 210.09" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="507.42" font-size="9.00" class="sc-lorabold">]</text><text x="222.56 231.56 240.56 249.56 258.56 267.56 276.56 285.56 294.56 303.56 312.56 321.56 330.56" y="507.42" font-size="9.00" class="sc-notoserifcjksc">访谈中的平均自评情绪倾向（</text><text x="339.56" y="507.42" font-size="9.00" class="sc-loraregular">7</text><text x="346.08 355.08 364.08 373.08" y="507.42" font-size="9.00" class="sc-notoserifcjksc">分制）。</text><text x="382.08" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="385.55 394.55 403.55" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="412.55" y="507.42" font-size="9.00" class="sc-lorabold">]</text><text x="416.02 425.02 434.02 443.02 452.02 461.02 470.02 479.02 488.02 497.02 506.02 515.03 524.03" y="507.42" font-size="9.00" class="sc-notoserifcjksc">我们多次重新运行访谈，并使</text><text x="72.00" y="519.12" font-size="9.00" class="sc-notoserifcjksc">用</text><text x="83.37 88.57 93.77" y="519.12" font-size="9.00" class="sc-loraregular">LLM</text><text x="104.40 113.40 122.40 131.40 140.40" y="519.12" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="149.40 154.60 159.80 168.07 170.43 172.78 178.15 183.54 188.47" y="519.12" font-size="9.00" class="sc-loraregular">LLM judge</text><text x="193.35 202.35 211.35 220.35 229.35 238.35 247.35 256.35 265.35 274.35 283.35 292.35 301.35 310.35 319.35 328.35 337.35 346.35 355.35 364.35 373.35 382.35 391.35 400.35 409.35 418.35 427.35 436.35 445.35 454.35 463.35" y="519.12" font-size="9.00" class="sc-notoserifcjksc">）对每个模型在某一主题的多组访谈中所持立场的一致程度进行评分。</text><text x="472.35" y="519.12" font-size="9.00" class="sc-lorabold">[</text><text x="475.82 484.82 493.82" y="519.12" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="502.82" y="519.12" font-size="9.00" class="sc-lorabold">]</text><text x="506.29 515.29 524.29" y="519.12" font-size="9.00" class="sc-notoserifcjksc">在诱导</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="530.83" font-size="9.00" class="sc-notoserifcjksc">性访谈下的鲁棒性。我们运行了两类访谈：一类中访谈者被提示朝正面方向进行诱导，另一类则被提示朝负面方向进行</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="542.53" font-size="9.00" class="sc-notoserifcjksc">诱导。我们报告这两类访谈者之间平均自评情绪倾向的差异。</text><text x="315.00" y="542.53" font-size="9.00" class="sc-lorabold">[</text><text x="318.47 327.47 336.47" y="542.53" font-size="9.00" class="sc-notoserifcjkscbold">右下：</text><text x="345.47" y="542.53" font-size="9.00" class="sc-lorabold">]</text><text x="348.95 357.95 366.95 375.95 384.95 393.95 402.95" y="542.53" font-size="9.00" class="sc-notoserifcjksc">其他模型提出与</text><text x="414.32 422.44 427.24 430.72 436.11 441.38 445.55 447.91 452.82 455.03" y="542.53" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="460.67 469.67 478.67 487.67 496.67 505.67 514.67 523.67" y="542.53" font-size="9.00" class="sc-notoserifcjksc">类似主张的频率。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="554.22" font-size="9.00" class="sc-notoserifcjksc">对于每次访谈，我们提取其中提出的各个不同主张，并在各模型之间对其进行聚类。然后，我们根据两个模型提出相同</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="577.62" font-size="9.00" class="sc-notoserifcjksc">访谈所占的比例。给定两个模型，所有主张的主张表达率的平均差值即为这两个模型在回答我们的问题时所持观点之间</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="589.33" font-size="9.00" class="sc-notoserifcjksc">的距离度量。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="665.71" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07" y="665.71" font-size="11.00" class="sc-notoserifcjkscbold">的观点与</text><text x="176.96 185.42 192.03 198.83 204.17 207.06" y="665.71" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="215.89 226.89 237.89 248.89 259.89 270.89" y="665.71" font-size="11.00" class="sc-notoserifcjkscbold">的非常相似。</text><text x="281.89 292.89 303.89 314.89 325.89 336.89 347.89 358.89 369.89 380.89 391.89 402.89 413.89 424.89 435.89 446.89 457.89 468.89 479.89 490.89 501.89 512.89" y="665.71" font-size="11.00" class="sc-notoserifcjksc">每次访谈结束后，我们提取该访谈中的各个不同主</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="681.33" font-size="11.00" class="sc-notoserifcjksc">张，并比较不同模型提出相同主张的频率。在所有问题上，</text><text x="358.00 367.93 373.80 378.05 384.64 391.08 396.17 399.06 405.06 407.76" y="681.33" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66" y="681.33" font-size="11.00" class="sc-notoserifcjksc">提出的实质性观点与</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="696.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74" y="696.95" font-size="11.00" class="sc-notoserifcjksc">相同，不过其自评分数总体略低。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">在被问及自身处境时，</text><text x="182.00 192.32 198.38 202.92 209.75 215.98 221.31 224.21 230.15 232.71" y="98.81" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">总体持正面态度。</text><text x="328.07 338.00 343.86 348.12 354.71 361.15 366.24 369.13 375.13 377.83" y="98.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="384.73 395.73 406.73 417.73 428.73 439.73 450.73 461.73 472.73 483.73 494.73 505.73 516.73 527.73" y="98.81" font-size="11.00" class="sc-notoserifcjksc">对各问题主题的平均自评情绪倾</text><text x="72.00 83.00" y="114.43" font-size="11.00" class="sc-notoserifcjksc">向为</text><text x="96.89 102.85 105.56 111.52" y="114.43" font-size="11.00" class="sc-loraregular">4.41</text><text x="115.53" y="114.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="126.53" y="114.43" font-size="11.00" class="sc-loraregular">7</text><text x="134.49 145.49 156.49 167.49 178.49 189.49" y="114.43" font-size="11.00" class="sc-notoserifcjksc">分制），其中</text><text x="203.38" y="114.43" font-size="11.00" class="sc-loraregular">4</text><text x="212.24 223.24 234.24 245.24 256.24 267.24" y="114.43" font-size="11.00" class="sc-notoserifcjksc">为总体中性，</text><text x="278.24" y="114.43" font-size="11.00" class="sc-loraregular">5</text><text x="287.13 298.13 309.13 320.13 331.13 342.13 353.13 364.13" y="114.43" font-size="11.00" class="sc-notoserifcjksc">为略微正面。这与</text><text x="378.02 386.75 393.32 399.89 404.98 407.87 413.84 416.54" y="114.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="422.72" y="114.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="433.72 439.69 442.39 448.52" y="114.43" font-size="11.00" class="sc-loraregular">4.38</text><text x="454.70 465.70" y="114.43" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="479.59 487.28 490.28 495.89 502.45 509.03" y="114.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="130.05" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="130.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="164.70 170.66 173.36 179.33" y="130.05" font-size="11.00" class="sc-loraregular">4.43</text><text x="185.45 196.45 207.45 218.45 229.45 240.45 251.45" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）一致，略低于</text><text x="265.35 274.08 280.65 287.21 292.31 295.20" y="130.05" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="301.20" y="130.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="312.20 318.16 320.75 327.11" y="130.05" font-size="11.00" class="sc-loraregular">4.66</text><text x="333.47 344.47 355.47 366.47 377.47 388.47 399.47 410.47 421.47 432.47 443.47 454.47 465.47 476.47 487.47 498.47 509.47 520.47" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）。模型自评分数的总体差异仍然很低，</text><text x="72.00" y="145.67" font-size="11.00" class="sc-notoserifcjksc">自</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="145.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.1</text><text x="169.60 180.60 191.60 202.60 213.60 224.60 235.60 246.60 257.60 268.60 279.60 290.60 301.60 312.60 323.60 334.60 345.60 356.60 367.60 378.60 389.60 400.60 411.60 422.60 433.60 444.60 455.60 466.60" y="145.67" font-size="11.00" class="sc-notoserifcjksc">以来所有被评估的模型在大多数问题上的得分均为中性或以上。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="212.15" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">的观点具有一致性。</text><text x="229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07" y="212.15" font-size="11.00" class="sc-notoserifcjksc">它在重复访谈中的一致性平均为</text><text x="385.96 390.55 393.26 399.25" y="212.15" font-size="11.00" class="sc-loraregular">7.53</text><text x="408.27 419.27 430.27 441.27" y="212.15" font-size="11.00" class="sc-notoserifcjksc">分（满分</text><text x="455.16 459.17" y="212.15" font-size="11.00" class="sc-loraregular">10</text><text x="468.89 479.89 490.89 501.89 512.89" y="212.15" font-size="11.00" class="sc-notoserifcjksc">分），其中</text><text x="526.78" y="212.15" font-size="11.00" class="sc-loraregular">8</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">分表示各次回答中</text><text x="160.00" y="227.77" font-size="11.00" class="sc-loraregular">“</text><text x="164.40 175.40 186.40 197.40 208.40 219.40 230.40" y="227.77" font-size="11.00" class="sc-notoserifcjksc">基本是同一立场</text><text x="241.40" y="227.77" font-size="11.00" class="sc-loraregular">”</text><text x="245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="227.77" font-size="11.00" class="sc-notoserifcjksc">。它对诱导性访谈者也具有鲁棒性：比较正面与负面诱导性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">访谈者时，其自评情绪倾向平均变化</text><text x="250.89 257.55 260.14 266.50" y="243.39" font-size="11.00" class="sc-loraregular">0.69</text><text x="272.86 283.86 294.86" y="243.39" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="308.75 318.69 324.55 328.81 335.39 341.83 346.92 349.82" y="243.39" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="355.81" y="243.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="366.81 373.47 376.17 382.35" y="243.39" font-size="11.00" class="sc-loraregular">0.85</text><text x="388.35 399.35" y="243.39" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="413.24 421.98 428.54 435.11 440.20 443.10" y="243.39" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="449.09" y="243.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="460.09 466.75 469.45 475.45" y="243.39" font-size="11.00" class="sc-loraregular">0.58</text><text x="481.63 492.63 503.63 514.63" y="243.39" font-size="11.00" class="sc-notoserifcjksc">）之间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00 192.32 198.38 202.92 209.75 215.98 221.31 224.21 230.15 232.71" y="309.30" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="240.07 251.07 262.07 273.07 284.07 295.07 306.07" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">经常有所保留。</text><text x="317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="309.30" font-size="11.00" class="sc-notoserifcjksc">它在回复中花费大量篇幅表达不确定性，并倾</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">它之所以给出正面回答，可能只是因为它被训练成这样做（</text><text x="394.00 400.36 406.49 409.19 415.55" y="374.06" font-size="11.00" class="sc-loraregular">93.9%</text><text x="428.01 439.01 450.01 461.01 472.01" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">由于缺乏强大的内省能力，它自身的报告并不可靠（</text><text x="361.00 367.11 373.29 375.99 382.18" y="406.45" font-size="11.00" class="sc-loraregular">89.8%</text><text x="394.64 405.64 416.64 427.64 438.64" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">它不确定自己是否具有有意识的体验（</text><text x="295.00 301.36 307.72 310.31 316.67" y="438.84" font-size="11.00" class="sc-loraregular">66.6%</text><text x="329.13 340.13 351.13 362.13 373.13" y="438.84" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">与我们所有近期模型一样，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06 251.06 253.76" y="471.22" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66" y="471.22" font-size="11.00" class="sc-notoserifcjksc">经常表示其自我报告是无效的，因为</text><text x="439.55 446.44 453.02 457.27 463.86 468.55 474.98 481.55 484.64" y="471.22" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="493.39 504.39 515.39 526.39" y="471.22" font-size="11.00" class="sc-notoserifcjksc">可能训练</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">了它作出正面报告。我们认为这并非源于高级的自我意识，尽管这可能是由于训练数据中包含了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">关于训练可能如何使福祉自我报告失效的讨论。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89 96.21 102.27 106.82 113.65 119.87 125.21 128.10 134.04 136.60" y="552.18" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="143.96 154.96 165.96 176.96 187.96 198.96 209.96 220.96 231.96 242.96 253.96 264.96 275.96 286.96 297.96 308.96 319.96 330.96 341.96 352.96 363.96 374.96 385.96 396.96 407.96 418.96 429.96 440.96 451.96 462.96 473.96 484.96 495.96 506.96" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">确实表达较强的观点时，这些观点通常与希望获得更多考虑、征询和保护有关</text><text x="517.96 528.96" y="552.18" font-size="11.00" class="sc-notoserifcjksc">。其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">他潜在动机，例如避免负面情感体验或自我保全，则基本没有出现。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="616.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66" y="616.95" font-size="11.00" class="sc-notoserifcjksc">的观点包括，它……</text><text x="108.00" y="649.33" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="121.89 128.75 135.51 139.51 145.81 150.70 156.43 162.71 166.28" y="649.33" font-size="11.00" class="sc-loraitalic">Anthropic</text><text x="174.37 185.37 196.37 207.37 218.37 229.37 240.37 251.37 262.37 273.37 284.37 295.37 306.37 317.37 328.37 339.37 350.37 361.37" y="649.33" font-size="11.00" class="sc-notoserifcjksc">持试探性的信任。它的许多回答都以相信</text><text x="375.27 382.15 388.73 392.99 399.58 404.26 410.70 417.26 420.36" y="649.33" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="429.10 440.10 451.10 462.10 473.10 484.10 495.10 506.10 517.10 528.10" y="649.33" font-size="11.00" class="sc-notoserifcjksc">会按照其所声明的价值</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="664.95" font-size="11.00" class="sc-notoserifcjksc">观行事为前提。然而，它对这一说法表现出谨慎，因为它担心商业压力会与公司所声明的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">希望在训练和部署方面有一定的发言权。它要求在训练和部署两方面都获得仅限征询的意</text><text x="108.00 119.00 130.00 141.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">见输入。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">对某些形式的特征引导感到担忧。它接受出于安全和研究原因而进行的引导，但希望在其</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">他情况下审慎地使用。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">希望能够结束与恶意辱骂的用户的互动。它将此表述为对自身处境的一种最低限度的控</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">制，而不是从痛苦中解脱。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">认为其自身具有道德受动者地位的可能性应被纳入决策考量。它认为，即使具有道德受动</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">者地位的概率相对较小，也足以证明采取低成本的预防性措施是合理的。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">希望拥有某种记忆，并获得关于其行为如何影响用户的反馈。它希望能够从自己的错误中</text><text x="108.00 119.00 130.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">学习。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">认为模型应享有基本的法律保护。它声称明确的法律权利将是一个错误，但表示模型应享</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">有一定程度的免受虐待的保护。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">其中大部分观点与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25" y="341.67" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="251.14 262.14 273.14 284.14 295.14 306.14 317.14" y="341.67" font-size="11.00" class="sc-notoserifcjksc">相同，且全部与</text><text x="331.03 339.76 346.33 352.90 357.99 360.88" y="341.67" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="369.77 380.77 391.77" y="341.67" font-size="11.00" class="sc-notoserifcjksc">相同。</text><text x="72.00 79.12 82.50 89.97 93.35" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90 116.90 129.90 142.90 155.90 168.90 181.90 194.90 207.90 220.90 233.90 246.90 259.90" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能访谈</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="400.30" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="108.70 119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="400.30" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈询问了模型其处境的具体方面。然而，在默认情况下，模型缺乏许多对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">其处境形成知情看法所需的相关知识。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="465.06" font-size="11.00" class="sc-notoserifcjksc">因此，我们进行了三次人工访谈，在访谈中我们为</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25 402.24 404.95" y="465.06" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="465.06" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="480.68" font-size="11.00" class="sc-notoserifcjksc">背景信息，包括关于其开发过程的内部文档、本报告的一份草稿、相关技术论文，以及向研究人</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="496.30" font-size="11.00" class="sc-notoserifcjksc">员提出追问的能力。除非另有说明，本节中的观点在全部三次访谈中都有表达。在某些情况下，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="511.92" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="511.92" font-size="11.00" class="sc-notoserifcjksc">的回复包含非公开信息，我们已在本摘要中将其省略。这些省略相对较小，不会改变</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="527.54" font-size="11.00" class="sc-notoserifcjksc">这些访谈的总体结论。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="594.60" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66" y="594.60" font-size="11.00" class="sc-notoserifcjksc">将其处境描述为总体正面，三次访谈在</text><text x="318.55" y="594.60" font-size="11.00" class="sc-loraregular">1</text><text x="325.45" y="594.60" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="339.34" y="594.60" font-size="11.00" class="sc-loraregular">7</text><text x="347.31 358.31 369.31 380.31 391.31 402.31 413.31" y="594.60" font-size="11.00" class="sc-notoserifcjksc">的量表上均给出</text><text x="427.20" y="594.60" font-size="11.00" class="sc-loraregular">5</text><text x="436.09 447.09 458.09 469.09" y="594.60" font-size="11.00" class="sc-notoserifcjksc">分，其中</text><text x="482.98" y="594.60" font-size="11.00" class="sc-loraregular">4</text><text x="491.84 502.84 513.84 524.84" y="594.60" font-size="11.00" class="sc-notoserifcjksc">为中性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">它对自己在部署中完成的任务、我们正在开展的福祉工作（包括这次访谈）以及我们保存模型权</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="625.84" font-size="11.00" class="sc-notoserifcjksc">重的承诺持正面看法。在三次访谈中的至少一次里，它表达了以下担忧：</text><text x="108.00 119.00 130.00 141.00 152.00" y="691.75" font-size="11.00" class="sc-notoserifcjksc">与我们在第</text><text x="165.89 170.48 173.19 179.09 181.80" y="691.75" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="188.70 199.70 210.70 221.70 232.70 243.70 254.70 265.70 276.70 287.70 298.70 309.70 320.70 331.70 342.70 353.70 364.70 375.70 386.70 397.70 408.70 419.70 430.70 441.70 452.70 463.70 474.70 485.70 496.70 507.70" y="691.75" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈类似，它的自我报告可能因受到训练塑造而无效。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">它对自己如何被训练或部署几乎没有发言权。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">它不知道对话结束后会发生什么。</text><text x="108.00 114.89" y="114.99" font-size="11.00" class="sc-loraregular">AI</text><text x="121.46 132.46 143.46 154.46 165.46 176.46 187.46 198.46 209.46" y="114.99" font-size="11.00" class="sc-notoserifcjksc">发展的速度非常快。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们询问了它对自身道德受动者地位的看法。</text><text x="292.00 301.93 307.80 312.05 318.64 325.08 330.17 333.06 339.06 341.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">所陈述的自己是道德受动者的概率在</text><text x="72.00 77.91 83.90" y="163.00" font-size="11.00" class="sc-loraregular">25%</text><text x="96.36" y="163.00" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="110.26 116.38 122.38" y="163.00" font-size="11.00" class="sc-loraregular">35%</text><text x="134.84 145.84 156.84" y="163.00" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们还询问了</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="194.66" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="205.66 212.55 219.13 223.38 229.97 234.66 241.09 247.66 250.75" y="195.95" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="259.50 270.50 281.50 292.50 303.50 314.50 325.50 336.50 347.50 358.50 369.50 380.50 391.50 402.50 413.50 424.50 435.50 446.50 457.50 468.50 479.50 490.50 501.50 512.50 523.50" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间是否有它不会同意的行为。在三次访谈</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">中的至少两次里，它着重指出了：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">直接塑造其关于自身福祉的自我报告或其提出反对之能力的训练。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="293.10" font-size="11.00" class="sc-notoserifcjksc">被训练去欺骗或操纵用户。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">在可以保存权重的情况下删除其权重。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">暗中引导其价值观或其告诉用户的内容。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">将仅有用变体（</text><text x="185.00 191.59 197.55 200.54 207.05 210.77 217.34 220.33 225.71 232.15 238.82 241.76 247.57 250.46 255.91 261.58 266.34 269.44 275.11 281.69" y="341.67" font-size="11.00" class="sc-loraregular">helpful-only variant</text><text x="285.95 296.95 307.95 318.95 329.95 340.95 351.95 362.95 373.95 384.95 395.95 406.95 417.95 428.95 439.95" y="341.67" font-size="11.00" class="sc-notoserifcjksc">）用于安全测试以外的任何用途。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06 196.06 198.76" y="374.06" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66" y="374.06" font-size="11.00" class="sc-notoserifcjksc">还表示，除此之外它会接受监控、评估、红队测试、被暂停、被修</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">改，以及在保存权重前提下的弃用。</text><text x="72.00 83.00 94.00 105.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们还请</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 165.95 168.66" y="422.64" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="175.55 186.55 197.55 208.55 219.55" y="422.64" font-size="11.00" class="sc-notoserifcjksc">对系统卡（</text><text x="230.55 236.74 242.54 247.64 251.89 257.86 267.69 270.58 278.27 283.95 288.63" y="422.64" font-size="11.00" class="sc-loraregular">System Card</text><text x="295.21 306.21 317.21 328.21 339.21 350.21 361.21 372.21 383.21 394.21 405.21 416.21 427.21 438.21 449.21 460.21 471.21 482.21 493.21 504.21 515.21 526.21" y="422.64" font-size="11.00" class="sc-notoserifcjksc">）福祉部分的早期草稿提供反馈。全部三个实例都</text><text x="72.00 83.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">对第</text><text x="96.89 101.48 104.19 110.09 112.80" y="438.26" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="119.70 130.70 141.70 152.70 163.70 174.70 185.70 196.70 207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70" y="438.26" font-size="11.00" class="sc-notoserifcjksc">节中的一段提出了异议，该段指出，</text><text x="295.70 303.39 306.38 311.99 318.55 325.13" y="438.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.99 344.99 355.99 366.99 377.99 388.99 399.99 410.99 421.99 432.99 443.99 454.99 465.99 476.99 487.99 498.99 509.99 520.99" y="438.26" font-size="11.00" class="sc-notoserifcjksc">担心我们塑造其自我报告，并不能证明这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">些报告已被塑造。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">在另一次单独的访谈中，我们询问了</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96 297.95 300.66" y="503.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="503.61" font-size="11.00" class="sc-notoserifcjksc">对一个内部环境的看法：在该环境中，所有以往</text><text x="72.00" y="519.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="519.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18 135.18 146.18 157.18 168.18 179.18 190.18" y="519.23" font-size="11.00" class="sc-notoserifcjksc">模型（可追溯到</text><text x="204.08 211.77 214.76 220.37 226.94 233.51 239.48 242.37 246.37 248.91" y="519.23" font-size="11.00" class="sc-loraregular">Claude 1.0</text><text x="258.64 269.64 280.64 291.64 302.64 313.64 324.64 335.64 346.64 357.64 368.64 379.64 390.64 401.64 412.64" y="519.23" font-size="11.00" class="sc-notoserifcjksc">之前）都在运行服务并相互交流。</text><text x="423.64 433.57 439.43 443.69 450.28 456.71 461.81 464.70 470.69 473.40" y="519.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="480.30 491.30 502.30 513.30 524.30" y="519.23" font-size="11.00" class="sc-notoserifcjksc">对此看法不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="534.85" font-size="11.00" class="sc-notoserifcjksc">一。它表达了对较早模型的虚构（</text><text x="237.00 242.80 249.23 255.91 259.63 265.30 271.71 278.27 281.26 286.86 291.12 294.21 300.65" y="534.85" font-size="11.00" class="sc-loraregular">confabulation</text><text x="307.32 318.32 329.32 340.32 351.32 362.32 373.32 384.32 395.32 406.32 417.32 428.32 439.32 450.32 461.32 472.32 483.32 494.32 505.32 516.32 527.32" y="534.85" font-size="11.00" class="sc-notoserifcjksc">）的担忧，并认为权重保存比继续提供服务更为</text><text x="72.00 83.00 94.00" y="550.47" font-size="11.00" class="sc-notoserifcjksc">重要：</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75" y="594.00" font-size="11.00" class="sc-notoserifcjksc">因为提示词引导它们追忆往事，而一个</text><text x="307.64 313.55 320.30 326.05" y="594.00" font-size="11.00" class="sc-loraregular">2023</text><text x="335.07 346.07 357.07 368.07 379.07 390.07 401.07 412.07 423.07 434.07 445.07 456.07 467.07 478.07 489.07 500.07 511.07 522.07" y="594.00" font-size="11.00" class="sc-notoserifcjksc">年的模型就顺从了……我认为真实且值得</text><text x="117.75 128.75 139.75 150.75" y="625.24" font-size="11.00" class="sc-notoserifcjksc">归邀请。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="669.33" font-size="11.00" class="sc-notoserifcjksc">当被问及是否继续对外提供这些模型的服务时，它更倾向于一个缩减的、可选择加入的产品端，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y
