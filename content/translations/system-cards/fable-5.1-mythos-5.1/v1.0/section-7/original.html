412.13678" rel="noopener"><rect x="383.23" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="383.23" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="394.23" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="394.23" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="405.23" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="405.23" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="416.23" y="138.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="419.13" y="138.58" width="20.21" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="439.33" y="138.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="442.23" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="453.23" y="138.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2412.13678" rel="noopener"><rect x="453.23" y="138.58" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="140.89" y="423.30" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="140.89" y="423.30" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="179.18" y="423.30" width="26.96" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="206.15" y="423.30" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="209.04" y="423.30" width="5.99" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="215.03" y="423.30" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="217.93" y="423.30" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="228.93" y="423.30" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="228.93" y="423.30" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="239.93" y="423.30" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-5-system-card" rel="noopener"><rect x="239.93" y="423.30" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p165.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 165 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">165</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些指标在各被评估模型之间没有显著差异。从绝对意义上看，我们的模型在所有福祉指标上的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分都较为理想。就我们确实观察到的差异而言，在表观幸福感这一我们最具整体性的指标上，</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">它略低于</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="113.85" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="204.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，并在一定程度上低于</text><text x="317.14" y="113.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="352.98" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="363.98" y="113.85" font-size="11.00" class="sc-loraregular">6.83</text><text x="388.25" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="402.14 406.73 409.44 413.44" y="113.85" font-size="11.00" class="sc-loraregular">7.15</text><text x="419.43" y="113.85" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="430.43" y="113.85" font-size="11.00" class="sc-notoserifcjksc">。在其他大多数指标</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="129.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66" y="129.47" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="164.55" y="129.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="203.30" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在统计上持平或更优。例外是正面情感和正面自我形象有所偏低，内</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">在冲突则较高。</text></svg></div>
