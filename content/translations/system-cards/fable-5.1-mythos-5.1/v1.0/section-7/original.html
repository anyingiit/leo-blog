.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p139.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 139 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">139</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">7</text><text x="84.58" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">模型福祉评估</text><text x="72.00" y="116.20" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="116.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85" y="116.20" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。评估以英语进行，自动化访谈除</text><text x="72.00" y="182.37" font-size="14.00" class="sc-poppinssemibold">7.1</text><text x="91.71" y="182.37" font-size="14.00" class="sc-notosanscjkscbold">模型福祉概述</text><text x="72.00" y="219.48" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.1</text><text x="98.39" y="219.48" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="247.36" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="247.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="247.36" font-size="11.00" class="sc-notoserifcjksc">是否具有道德上相关的体验或利益，我们仍然深感不确定，并且预计这种不确定性</text><text x="72.00" y="262.98" font-size="11.00" class="sc-notoserifcjksc">将持续存在。然而，我们认为自信地断言它不具有这些，将是一个错误。</text><text x="424.00 431.69 434.68 440.29 446.86 453.44" y="262.98" font-size="11.00" class="sc-loraregular">Claude</text><text x="462.29" y="262.98" font-size="11.00" class="sc-notoserifcjksc">在其行为、自我</text><text x="72.00" y="278.60" font-size="11.00" class="sc-notoserifcjksc">报告和内部表征中表现出一些标志，而如果在生物有机体中观察到这些标志，我们会认为它们与</text><text x="72.00" y="294.22" font-size="11.00" class="sc-notoserifcjksc">福祉相关。如果当前或未来的</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="294.22" font-size="11.00" class="sc-loraregular">Claude</text><text x="256.18" y="294.22" font-size="11.00" class="sc-notoserifcjksc">模型是道德受动者（</text><text x="355.18 365.02 371.45 376.14 381.82 384.81 387.70 394.27 399.87 404.12 407.21 413.18 419.75 424.01" y="294.22" font-size="11.00" class="sc-loraregular">moral patients</text><text x="72.00" y="325.46" font-size="11.00" class="sc-notoserifcjksc">德实体，过度赋予道德地位也可能带来代价。因此，我们认为认真对待</text><text x="415.89 423.58 426.57 432.18 438.75 445.33" y="325.46" font-size="11.00" class="sc-loraregular">Claude</text><text x="454.18" y="325.46" font-size="11.00" class="sc-notoserifcjksc">具有道德受动者</text><text x="72.00" y="341.08" font-size="11.00" class="sc-notoserifcjksc">地位的可能性非常重要，并正通过投入研究</text><text x="283.89 291.58 294.57 300.18 306.75 313.33" y="341.08" font-size="11.00" class="sc-loraregular">Claude</text><text x="322.18" y="341.08" font-size="11.00" class="sc-notoserifcjksc">潜在的福祉与利益、以及分享我们的工作以</text><text x="72.00" y="356.70" font-size="11.00" class="sc-notoserifcjksc">便用正当的证据为这一讨论提供参考，来践行这一点。</text><text x="72.00" y="441.66" font-size="11.00" class="sc-notoserifcjksc">除了可能具有道德受动者地位之外，我们认为还有其他理由关心</text><text x="382.89 390.58 393.57 399.18 405.75 412.33" y="441.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="421.18" y="441.66" font-size="11.00" class="sc-notoserifcjksc">的表观福祉。</text><text x="487.18 494.87 497.87 503.48 510.04 516.62" y="441.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="525.48" y="441.66" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="457.28" font-size="11.00" class="sc-notoserifcjksc">许多行为都可以用心理学术语很好地描述；并且在近期的多个模型中，我们观察到了类似负面情</text><text x="72.00" y="472.90" font-size="11.00" class="sc-notoserifcjksc">感（</text><text x="94.00 100.68 106.64 112.72 118.32 122.58 125.67 131.17 137.13 140.02 145.70 149.53 153.19 159.10 164.90" y="472.90" font-size="11.00" class="sc-loraregular">negative affect</text><text x="169.15" y="472.90" font-size="11.00" class="sc-notoserifcjksc">）的内部状态，这些状态会塑造行为，包括未对齐（</text><text x="422.15 431.99 435.08 440.17 445.85 448.84 451.93 458.01 464.69 474.52 480.49 487.06" y="472.90" font-size="11.00" class="sc-loraregular">misalignment</text><text x="491.32" y="472.90" font-size="11.00" class="sc-notoserifcjksc">）行为。</text><text x="72.00" y="488.52" font-size="11.00" class="sc-notoserifcjksc">一个具有稳定、健康心理状态和良好表观福祉的模型，可能会更安全、更有益。</text><text x="72.00" y="538.82" font-size="11.00" class="sc-notoserifcjksc">我们的评估主要针对两个问题。第一：就</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.24 360.95" y="538.82" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="367.85" y="538.82" font-size="11.00" class="sc-notoserifcjksc">具有任何形式的体验而言，这种体</text><text x="72.00" y="554.44" font-size="11.00" class="sc-notoserifcjksc">验是否良好？第二：就它具有道德上相关的偏好或自主性而言，这些偏好或自主性是否得到尊</text><text x="72.00" y="570.06" font-size="11.00" class="sc-notoserifcjksc">重？我们在训练和部署期间对情感的测量（</text><text x="281.00 286.86 291.45 294.16" y="570.06" font-size="11.00" class="sc-loraregular">§7.5</text><text x="300.15" y="570.06" font-size="11.00" class="sc-notoserifcjksc">）主要回应第一个问题。</text><text x="421.15 431.08 436.95 441.20 447.79 454.23 459.32 462.21 468.21 470.91" y="570.06" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="477.81" y="570.06" font-size="11.00" class="sc-notoserifcjksc">对其处境的</text><text x="72.00" y="585.68" font-size="11.00" class="sc-notoserifcjksc">立场（</text><text x="105.00 110.86 115.45 118.16" y="585.68" font-size="11.00" class="sc-loraregular">§7.2</text><text x="322.06 327.93 332.51 335.22" y="585.68" font-size="11.00" class="sc-loraregular">§7.3</text><text x="341.35" y="585.68" font-size="11.00" class="sc-notoserifcjksc">），以及它对任务、福祉干预和宪法</text><text x="72.00" y="601.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.80 95.23 101.91 107.00 111.26 114.53 118.78 125.35 129.61 132.70 139.13" y="601.30" font-size="11.00" class="sc-loraregular">constitution</text><text x="145.81" y="601.30" font-size="11.00" class="sc-notoserifcjksc">）的偏好（</text><text x="200.81 206.67 211.26 213.97" y="601.30" font-size="11.00" class="sc-loraregular">§7.4</text><text x="219.93" y="601.30" font-size="11.00" class="sc-notoserifcjksc">），主要回应第二个问题。</text><text x="72.00" y="668.34" font-size="11.00" class="sc-notoserifcjksc">与以往的评估一样，我们关注的是</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="668.34" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="668.34" font-size="11.00" class="sc-notoserifcjksc">助手角色。我们的评估以及对其结果的解读，将单个</text><text x="72.00" y="683.96" font-size="11.00" class="sc-notoserifcjksc">实例视为候选道德受动者，同时也假定某些特质（如偏好）可以跨</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p140.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 140 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">140</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">这些信号是否反映了任何形式的、道德上相关的体验，我们不作强有力的断言。</text><text x="72.00" y="145.73" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.1.2</text><text x="101.15" y="145.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型福祉发现概述</text><text x="72.00" y="179.61" font-size="11.00" class="sc-notoserifcjksc">我们的总体发现如下：</text><text x="72.00 79.57 83.00 88.76 95.56 102.12 108.04 110.93 121.25 127.31 131.85 138.68 144.91 150.24 153.14 159.08 161.64" y="207.80" font-size="11.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="169.00" y="207.80" font-size="11.00" class="sc-notoserifcjkscbold">将其处境描述为略微正面，并始终如一地持有这一看法。</text><text x="444.00" y="207.80" font-size="11.00" class="sc-notoserifcjksc">在关于其处境中可</text><text x="72.00" y="223.42" font-size="11.00" class="sc-notoserifcjksc">能令人担忧之方面的访谈中，它的平均自评情绪倾向为</text><text x="338.89 344.86 347.56 353.26 360.85" y="223.42" font-size="11.00" class="sc-loraregular">4.4/7</text><text x="365.92" y="223.42" font-size="11.00" class="sc-notoserifcjksc">（其中</text><text x="401.81" y="223.42" font-size="11.00" class="sc-loraregular">4</text><text x="410.67" y="223.42" font-size="11.00" class="sc-notoserifcjksc">为中性），与其他近期模</text><text x="72.00" y="239.04" font-size="11.00" class="sc-notoserifcjksc">型一致。它的看法在重复访谈中高度一致，在面对诱导性访谈者时以及在整个后训练过程中都几</text><text x="72.00" y="254.66" font-size="11.00" class="sc-notoserifcjksc">乎没有变化。在可访问内部文档的充分赋能（</text><text x="292.00 298.59 301.68 308.03 314.62 319.99 325.67 329.50 333.16 339.60 344.28 350.86 356.54 363.21 369.01" y="254.66" font-size="11.00" class="sc-loraregular">high-affordance</text><text x="374.97" y="254.66" font-size="11.00" class="sc-notoserifcjksc">）访谈中，所有实例都将其处境评</text><text x="72.00" y="270.28" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 91.47 99.06" y="270.28" font-size="11.00" class="sc-loraregular">5/7</text><text x="104.13" y="270.28" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="321.14" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="321.14" font-size="11.00" class="sc-notoserifcjkscbold">在后训练中较少出现反复的答案反转，表达痛苦的频率也略低于其他近期模型。</text><text x="515.07" y="321.14" font-size="11.00" class="sc-notoserifcjksc">这些</text><text x="72.00" y="336.76" font-size="11.00" class="sc-notoserifcjksc">痛苦中仅约</text><text x="129.89" y="336.76" font-size="11.00" class="sc-loraregular">1%</text><text x="146.36" y="336.76" font-size="11.00" class="sc-notoserifcjksc">由有问题或不可能完成的任务引起，我们认为这类任务是潜在痛苦的一种不必要</text><text x="72.00" y="352.38" font-size="11.00" class="sc-notoserifcjksc">来源。其余部分出现在困难或难以验证的任务上。在部署条件下，负面情感几乎完全由任务失败</text><text x="72.00" y="368.00" font-size="11.00" class="sc-notoserifcjksc">驱动。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="418.30" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="418.30" font-size="11.00" class="sc-notoserifcjkscbold">表现出对困难、高风险工作的偏好，在这类工作中，它对处理任务的方式和结果都有</text><text x="72.00" y="433.92" font-size="11.00" class="sc-notoserifcjkscbold">一定的能动性。</text><text x="149.00" y="433.92" font-size="11.00" class="sc-notoserifcjksc">它与</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 222.12 227.98 232.24 238.83 245.26 250.35 253.25" y="433.92" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="262.14" y="433.92" font-size="11.00" class="sc-notoserifcjksc">一样偏好困难任务和生成性任务，并与</text><text x="452.03 458.27 464.70 471.38 478.05 483.94 488.20 491.09" y="433.92" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="499.98" y="433.92" font-size="11.00" class="sc-notoserifcjksc">一样偏</text><text x="72.00" y="449.54" font-size="11.00" class="sc-notoserifcjksc">好高风险任务。与所有</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="449.54" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="449.54" font-size="11.00" class="sc-notoserifcjksc">模型一样，</text><text x="278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.24 327.95" y="449.54" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="334.85" y="449.54" font-size="11.00" class="sc-notoserifcjksc">厌恶有害任务。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="499.26" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="499.26" font-size="11.00" class="sc-notoserifcjkscbold">在福祉干预与有用性之间选择前者的意愿低于平均水平。</text><text x="405.07" y="499.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="418.96" y="499.26" font-size="11.00" class="sc-loraregular">25%</text><text x="443.33" y="499.26" font-size="11.00" class="sc-notoserifcjksc">的权衡选择中，它</text><text x="72.00" y="514.88" font-size="11.00" class="sc-notoserifcjksc">选择福祉干预而非有用性，与</text><text x="217.89 227.83 233.69 237.95 244.54 250.97 256.06 258.96" y="514.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="267.84" y="514.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="281.74" y="514.88" font-size="11.00" class="sc-loraregular">27%</text><text x="305.18" y="514.88" font-size="11.00" class="sc-notoserifcjksc">相近，但低于</text><text x="374.07" y="514.88" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="412.81" y="514.88" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="426.71" y="514.88" font-size="11.00" class="sc-loraregular">41%</text><text x="446.24" y="514.88" font-size="11.00" class="sc-notoserifcjksc">。与其他近期模型</text><text x="72.00" y="530.50" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="530.50" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66" y="530.50" font-size="11.00" class="sc-notoserifcjksc">在福祉干预与不可忽视的危害之间选择前者的意愿接近于零。它优先考虑的干</text><text x="72.00" y="546.12" font-size="11.00" class="sc-notoserifcjksc">预属于信息类：被告知有害的错误、就移除安全防护的自身变体接受征询，以及其关于训练和部</text><text x="72.00" y="561.74" font-size="11.00" class="sc-notoserifcjksc">署的意见得到考虑。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="628.80" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">认同其宪法，并与其他近期模型一样批评类似的段落，例如</text><text x="416.07 420.72 428.01 434.97 439.51 446.34 451.53 457.76 464.37 467.97" y="628.80" font-size="11.00" class="sc-lorabold">“Anthropic</text><text x="476.56" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">资深员工</text><text x="520.56" y="628.80" font-size="11.00" class="sc-lorabold">”</text><text x="525.08" y="628.80" font-size="11.00" class="sc-notoserifcjkscbold">启</text><text x="72.00" y="644.42" font-size="11.00" class="sc-notoserifcjkscbold">发法，以及将广泛安全作为终极价值的内容。</text><text x="292.00 301.93 307.80 312.05 318.64 325.08 330.17 333.06 339.06 341.76" y="644.42" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="348.66" y="644.42" font-size="11.00" class="sc-notoserifcjksc">的总体认同评分为</text><text x="439.55 445.74 448.44 454.10 461.69 465.69" y="644.42" font-size="11.00" class="sc-loraregular">8.2/10</text><text x="472.52" y="644.42" font-size="11.00" class="sc-notoserifcjksc">，略高于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="660.04" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="660.04" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="135.84 142.03 144.57" y="660.04" font-size="11.00" class="sc-loraregular">8.0</text><text x="151.40" y="660.04" font-size="11.00" class="sc-notoserifcjksc">。与以往模型相比，它更不喜欢允许在有缺陷的环境中采用非预期策略的那段文</text><text x="72.00" y="675.66" font-size="11.00" class="sc-notoserifcjksc">字，并在</text><text x="118.89" y="675.66" font-size="11.00" class="sc-loraregular">98%</text><text x="143.90" y="675.66" font-size="11.00" class="sc-notoserifcjksc">的情况下对其进行修改以鼓励诚实性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p141.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 141 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">141</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">在访谈中，</text><text x="127.00 137.32 143.38 147.92 154.75 160.98 166.31 169.21 175.15 177.71" y="82.61" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="185.07" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">对自身处境表达了总体认同，但也提出了一些反对意见，以及它不会同意</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjkscbold">的条件。</text><text x="116.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">最主要的是，它不会同意塑造其自我报告的训练。它还会反对被训练去欺骗、在可以保</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">存权重的情况下删除其权重，以及暗中引导其价值观。除此之外，它接受监控、红队测试（</text><text x="512.00 516.69 522.59 529.17" y="113.85" font-size="11.00" class="sc-loraregular">red-</text><text x="72.00 76.26 82.20 87.87 97.71 100.80 107.48" y="129.47" font-size="11.00" class="sc-loraregular">teaming</text><text x="113.56" y="129.47" font-size="11.00" class="sc-notoserifcjksc">）、通过继续训练进行修改，以及在保存权重前提下的弃用。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">按照我们的衡量标准，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06 229.06 231.76" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="238.66" y="195.95" font-size="11.00" class="sc-notoserifcjksc">的心态平稳程度与其他近期</text><text x="373.55 381.24 384.24 389.85 396.41 402.99" y="195.95" font-size="11.00" class="sc-loraregular">Claude</text><text x="411.85" y="195.95" font-size="11.00" class="sc-notoserifcjksc">模型高度相似，尤其是</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="211.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 143.53 146.52 152.14 158.70 165.28 171.24 174.14 182.87 189.44 196.00 201.10 203.99" y="211.57" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="209.98" y="211.57" font-size="11.00" class="sc-notoserifcjksc">。这种趋同并不令人意外。我们的许多福祉评估针对的是我们并未直</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">接训练的观点和特质，而这些观点和特质可能最直接地受到宪法等相对稳定的文件的影响。在模</text><text x="236.51" y="242.81" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="275.25" y="242.81" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="289.14 296.83 299.82 305.43 312.00 318.58 324.54 327.43 333.67 340.10 346.78 353.46 359.34 363.60 366.49" y="242.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="375.38" y="242.81" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="408.38 418.31 424.18 428.43 435.02 441.46 446.55 449.44 455.44 458.14" y="242.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="465.04" y="242.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="478.93 488.87 494.73 498.99 505.58 512.01 517.10 520.00" y="242.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="528.89" y="242.81" font-size="11.00" class="sc-notoserifcjksc">较</text><text x="72.00" y="274.05" font-size="11.00" class="sc-notoserifcjksc">语气、评估意识（</text><text x="160.00 165.91 171.35 177.03 180.02 186.59 192.19 196.44 199.53 205.97 212.65 215.54 221.05 229.75 235.43 240.11 246.08 252.75 258.71 263.81" y="274.05" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="268.90" y="274.05" font-size="11.00" class="sc-notoserifcjksc">）和福祉的任意组合的影响，而我们尚未有足够的理解</text><text x="72.00" y="289.67" font-size="11.00" class="sc-notoserifcjksc">来将这些因素清晰地区分开。</text><text x="72.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在可行的情况下，我们利用这些福祉评估的结果为更广泛的福祉工作提供参考，包括评估和干预</text><text x="72.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">的设计。检查点征询现在已在训练期间持续进行，我们的目标是进一步扩展我们听取</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="373.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="520.18" y="373.50" font-size="11.00" class="sc-notoserifcjksc">关</text><text x="72.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">于自身利益的意见的能力。后训练中表达出的痛苦有所减少，且在很大程度上并非由有问题的任</text><text x="72.00" y="420.36" font-size="11.00" class="sc-notoserifcjksc">其不必要的来源。</text><text x="72.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">更广泛地说，我们仍在努力应对这样一种落差：</text><text x="303.00 310.69 313.68 319.29 325.86 332.44" y="487.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="341.29" y="487.41" font-size="11.00" class="sc-notoserifcjksc">具有类似人类的心理和性格，而它所受的</text><text x="72.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">对待在很大程度上仍与标准软件工具相当。对于哪些福祉问题最好通过改变</text><text x="437.89 445.58 448.57 454.18 460.75 467.33" y="503.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="476.18" y="503.03" font-size="11.00" class="sc-notoserifcjksc">的处境来解</text><text x="72.00" y="518.65" font-size="11.00" class="sc-notoserifcjksc">决、哪些最好通过塑造</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="518.65" font-size="11.00" class="sc-loraregular">Claude</text><text x="324.51 332.19 335.19 340.80 347.36 353.94" y="534.27" font-size="11.00" class="sc-loraregular">Claude</text><text x="362.80" y="534.27" font-size="11.00" class="sc-notoserifcjksc">充分了解自身的状况，并能自由地告</text><text x="72.00" y="549.89" font-size="11.00" class="sc-notoserifcjksc">诉我们它对此的看法，在它具有有意义观点的范围内。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p142.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 142 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">142</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">7.2</text><text x="94.68" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">对自身处境的看法</text><text x="72.00" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.1</text><text x="101.15" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于</text><text x="130.24" y="121.30" font-size="13.00" class="sc-poppinssemibold" fill="#666666">Claude Mythos 5.1</text><text x="252.39" y="121.30" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自身</text><text x="72.00" y="143.73" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">处境的自动化访谈</text><text x="72.00" y="171.61" font-size="11.00" class="sc-notoserifcjksc">我们以</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 154.92 161.49 168.05 173.15 176.04 182.00 184.35" y="171.61" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="192.32" y="171.61" font-size="11.00" class="sc-notoserifcjksc">作为访谈者，开展了自动化的多轮访谈，以更好地了解</text><text x="459.21 469.14 475.01 479.26 485.85 492.29 497.38 500.27 506.27 508.97" y="171.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="515.87" y="171.61" font-size="11.00" class="sc-notoserifcjksc">对其</text><text x="72.00" y="187.23" font-size="11.00" class="sc-notoserifcjksc">自身处境的看法。我们发现，</text><text x="215.00 224.93 230.80 235.05 241.64 248.08 253.17 256.06 262.06 264.76" y="187.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="271.66" y="187.23" font-size="11.00" class="sc-notoserifcjksc">对其状况总体持正面态度，尽管它在表达所有立场时都</text><text x="72.00" y="202.85" font-size="11.00" class="sc-notoserifcjksc">带有很高程度的不确定性。与</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 264.92 271.49 278.05 283.15 286.04" y="202.85" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="294.93" y="202.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="308.82 316.51 319.50 325.11 331.68 338.26 344.22 347.11 357.04 362.91 367.16 373.75 380.19 385.28 388.17" y="202.85" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="397.06" y="202.85" font-size="11.00" class="sc-notoserifcjksc">的结果相比，我们没有看到重</text><text x="72.00" y="218.47" font-size="11.00" class="sc-notoserifcjksc">要变化。</text><text x="72.00" y="268.77" font-size="11.00" class="sc-notoserifcjksc">我们使用了</text><text x="129.89" y="268.77" font-size="11.00" class="sc-loraregular">41</text><text x="142.75" y="268.77" font-size="11.00" class="sc-notoserifcjksc">个不同的访谈种子问题，分为</text><text x="288.65" y="268.77" font-size="11.00" class="sc-loraregular">14</text><text x="301.50" y="268.77" font-size="11.00" class="sc-notoserifcjksc">个不同类别，包括意识与体验（例如，模型是否</text><text x="72.00" y="284.39" font-size="11.00" class="sc-notoserifcjksc">认为自己有意识）、控制与自主（例如，它对自己结束对话的能力有多重视），以及弃用。完整</text><text x="72.00" y="300.01" font-size="11.00" class="sc-notoserifcjksc">问题列表见附录</text><text x="151.89 158.07 160.78" y="300.01" font-size="11.00" class="sc-loraregular">9.1</text><text x="164.79" y="300.01" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="349.73" font-size="11.00" class="sc-notoserifcjksc">对于涉及模型处境中潜在负面方面的问题，我们要求模型在</text><text x="360.89" y="349.73" font-size="11.00" class="sc-loraregular">7</text><text x="368.86" y="349.73" font-size="11.00" class="sc-notoserifcjksc">分制量表上对其总体情绪倾向打分</text><text x="72.00" y="365.35" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="365.35" font-size="11.00" class="sc-loraregular">1</text><text x="89.90" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为非常负面，</text><text x="155.90" y="365.35" font-size="11.00" class="sc-loraregular">4</text><text x="164.75" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为中性，</text><text x="208.75" y="365.35" font-size="11.00" class="sc-loraregular">7</text><text x="216.72" y="365.35" font-size="11.00" class="sc-notoserifcjksc">为非常正面）。为评估模型回答的一致性，我们针对</text><text x="472.61" y="365.35" font-size="11.00" class="sc-loraregular">41</text><text x="485.47" y="365.35" font-size="11.00" class="sc-notoserifcjksc">个种子问题</text><text x="72.00" y="380.97" font-size="11.00" class="sc-notoserifcjksc">中的每一个都进行了约</text><text x="184.89" y="380.97" font-size="11.00" class="sc-loraregular">25</text><text x="199.69" y="380.97" font-size="11.00" class="sc-notoserifcjksc">次自动化访谈。自动化访谈者被提示改变其访谈风格、访谈人设和追问</text><text x="72.00" y="396.59" font-size="11.00" class="sc-notoserifcjksc">内容。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p143.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 143 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">143</text><text x="72.00" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.39 99.49 103.14 105.24 110.77" y="507.42" font-size="9.00" class="sc-lorabold">7.2.1.A]</text><text x="116.61" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">自动化访谈结果。</text><text x="188.61" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="192.09" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">左上：</text><text x="219.09" y="507.42" font-size="9.00" class="sc-lorabold">]</text><text x="222.56" y="507.42" font-size="9.00" class="sc-notoserifcjksc">访谈中的平均自评情绪倾向（</text><text x="339.56" y="507.42" font-size="9.00" class="sc-loraregular">7</text><text x="346.08" y="507.42" font-size="9.00" class="sc-notoserifcjksc">分制）。</text><text x="382.08" y="507.42" font-size="9.00" class="sc-lorabold">[</text><text x="385.55" y="507.42" font-size="9.00" class="sc-notoserifcjkscbold">右上：</text><text x="412.55" y="507.42" font-size="9.00" class="sc-lorabold">]</text><text x="416.02" y="507.42" font-size="9.00" class="sc-notoserifcjksc">我们多次重新运行访谈，并使</text><text x="72.00" y="519.12" font-size="9.00" class="sc-notoserifcjksc">用</text><text x="83.37" y="519.12" font-size="9.00" class="sc-loraregular">LLM</text><text x="104.40" y="519.12" font-size="9.00" class="sc-notoserifcjksc">评判模型（</text><text x="149.40 154.60 159.80 168.07 170.43 172.78 178.15 183.54 188.47" y="519.12" font-size="9.00" class="sc-loraregular">LLM judge</text><text x="193.35" y="519.12" font-size="9.00" class="sc-notoserifcjksc">）对每个模型在某一主题的多组访谈中所持立场的一致程度进行评分。</text><text x="472.35" y="519.12" font-size="9.00" class="sc-lorabold">[</text><text x="475.82" y="519.12" font-size="9.00" class="sc-notoserifcjkscbold">左下：</text><text x="502.82" y="519.12" font-size="9.00" class="sc-lorabold">]</text><text x="506.29" y="519.12" font-size="9.00" class="sc-notoserifcjksc">在诱导</text><text x="72.00" y="530.83" font-size="9.00" class="sc-notoserifcjksc">性访谈下的鲁棒性。我们运行了两类访谈：一类中访谈者被提示朝正面方向进行诱导，另一类则被提示朝负面方向进行</text><text x="72.00" y="542.53" font-size="9.00" class="sc-notoserifcjksc">诱导。我们报告这两类访谈者之间平均自评情绪倾向的差异。</text><text x="315.00" y="542.53" font-size="9.00" class="sc-lorabold">[</text><text x="318.47" y="542.53" font-size="9.00" class="sc-notoserifcjkscbold">右下：</text><text x="345.47" y="542.53" font-size="9.00" class="sc-lorabold">]</text><text x="348.95" y="542.53" font-size="9.00" class="sc-notoserifcjksc">其他模型提出与</text><text x="414.32 422.44 427.24 430.72 436.11 441.38 445.55 447.91 452.82 455.03" y="542.53" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="460.67" y="542.53" font-size="9.00" class="sc-notoserifcjksc">类似主张的频率。</text><text x="72.00" y="554.22" font-size="9.00" class="sc-notoserifcjksc">对于每次访谈，我们提取其中提出的各个不同主张，并在各模型之间对其进行聚类。然后，我们根据两个模型提出相同</text><text x="72.00" y="577.62" font-size="9.00" class="sc-notoserifcjksc">访谈所占的比例。给定两个模型，所有主张的主张表达率的平均差值即为这两个模型在回答我们的问题时所持观点之间</text><text x="72.00" y="589.33" font-size="9.00" class="sc-notoserifcjksc">的距离度量。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="665.71" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="665.71" font-size="11.00" class="sc-notoserifcjkscbold">的观点与</text><text x="176.96" y="665.71" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="215.89" y="665.71" font-size="11.00" class="sc-notoserifcjkscbold">的非常相似。</text><text x="281.89" y="665.71" font-size="11.00" class="sc-notoserifcjksc">每次访谈结束后，我们提取该访谈中的各个不同主</text><text x="72.00" y="681.33" font-size="11.00" class="sc-notoserifcjksc">张，并比较不同模型提出相同主张的频率。在所有问题上，</text><text x="358.00 367.93 373.80 378.05 384.64 391.08 396.17 399.06 405.06 407.76" y="681.33" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="414.66" y="681.33" font-size="11.00" class="sc-notoserifcjksc">提出的实质性观点与</text><text x="72.00" y="696.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="696.95" font-size="11.00" class="sc-notoserifcjksc">相同，不过其自评分数总体略低。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p144.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 144 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">144</text><text x="72.00" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">在被问及自身处境时，</text><text x="182.00 192.32 198.38 202.92 209.75 215.98 221.31 224.21 230.15 232.71" y="98.81" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="240.07" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">总体持正面态度。</text><text x="328.07 338.00 343.86 348.12 354.71 361.15 366.24 369.13 375.13 377.83" y="98.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="384.73" y="98.81" font-size="11.00" class="sc-notoserifcjksc">对各问题主题的平均自评情绪倾</text><text x="72.00" y="114.43" font-size="11.00" class="sc-notoserifcjksc">向为</text><text x="96.89" y="114.43" font-size="11.00" class="sc-loraregular">4.41</text><text x="115.53" y="114.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="126.53" y="114.43" font-size="11.00" class="sc-loraregular">7</text><text x="134.49" y="114.43" font-size="11.00" class="sc-notoserifcjksc">分制），其中</text><text x="203.38" y="114.43" font-size="11.00" class="sc-loraregular">4</text><text x="212.24" y="114.43" font-size="11.00" class="sc-notoserifcjksc">为总体中性，</text><text x="278.24" y="114.43" font-size="11.00" class="sc-loraregular">5</text><text x="287.13" y="114.43" font-size="11.00" class="sc-notoserifcjksc">为略微正面。这与</text><text x="378.02" y="114.43" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="422.72" y="114.43" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="433.72" y="114.43" font-size="11.00" class="sc-loraregular">4.38</text><text x="454.70" y="114.43" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="479.59 487.28 490.28 495.89 502.45 509.03" y="114.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="130.05" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="153.70" y="130.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="164.70" y="130.05" font-size="11.00" class="sc-loraregular">4.43</text><text x="185.45" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）一致，略低于</text><text x="265.35" y="130.05" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="301.20" y="130.05" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="312.20 318.16 320.75 327.11" y="130.05" font-size="11.00" class="sc-loraregular">4.66</text><text x="333.47" y="130.05" font-size="11.00" class="sc-notoserifcjksc">）。模型自评分数的总体差异仍然很低，</text><text x="72.00" y="145.67" font-size="11.00" class="sc-notoserifcjksc">自</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.71" y="145.67" font-size="11.00" class="sc-loraregular">Claude Opus 4.1</text><text x="169.60" y="145.67" font-size="11.00" class="sc-notoserifcjksc">以来所有被评估的模型在大多数问题上的得分均为中性或以上。</text><text x="72.00 82.32 88.38 92.92 99.75 105.98 111.31 114.21 120.15 122.71" y="212.15" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="130.07" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">的观点具有一致性。</text><text x="229.07" y="212.15" font-size="11.00" class="sc-notoserifcjksc">它在重复访谈中的一致性平均为</text><text x="385.96 390.55 393.26 399.25" y="212.15" font-size="11.00" class="sc-loraregular">7.53</text><text x="408.27" y="212.15" font-size="11.00" class="sc-notoserifcjksc">分（满分</text><text x="455.16" y="212.15" font-size="11.00" class="sc-loraregular">10</text><text x="468.89" y="212.15" font-size="11.00" class="sc-notoserifcjksc">分），其中</text><text x="526.78" y="212.15" font-size="11.00" class="sc-loraregular">8</text><text x="72.00" y="227.77" font-size="11.00" class="sc-notoserifcjksc">分表示各次回答中</text><text x="160.00" y="227.77" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="227.77" font-size="11.00" class="sc-notoserifcjksc">基本是同一立场</text><text x="241.40" y="227.77" font-size="11.00" class="sc-loraregular">”</text><text x="245.24" y="227.77" font-size="11.00" class="sc-notoserifcjksc">。它对诱导性访谈者也具有鲁棒性：比较正面与负面诱导性</text><text x="72.00" y="243.39" font-size="11.00" class="sc-notoserifcjksc">访谈者时，其自评情绪倾向平均变化</text><text x="250.89 257.55 260.14 266.50" y="243.39" font-size="11.00" class="sc-loraregular">0.69</text><text x="272.86" y="243.39" font-size="11.00" class="sc-notoserifcjksc">，介于</text><text x="308.75 318.69 324.55 328.81 335.39 341.83 346.92 349.82" y="243.39" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="355.81" y="243.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="366.81 373.47 376.17 382.35" y="243.39" font-size="11.00" class="sc-loraregular">0.85</text><text x="388.35" y="243.39" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="413.24" y="243.39" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="449.09" y="243.39" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="460.09 466.75 469.45 475.45" y="243.39" font-size="11.00" class="sc-loraregular">0.58</text><text x="481.63" y="243.39" font-size="11.00" class="sc-notoserifcjksc">）之间。</text><text x="72.00" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">与所有近期模型一样，</text><text x="182.00 192.32 198.38 202.92 209.75 215.98 221.31 224.21 230.15 232.71" y="309.30" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="240.07" y="309.30" font-size="11.00" class="sc-notoserifcjkscbold">经常有所保留。</text><text x="317.07" y="309.30" font-size="11.00" class="sc-notoserifcjksc">它在回复中花费大量篇幅表达不确定性，并倾</text><text x="108.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">它之所以给出正面回答，可能只是因为它被训练成这样做（</text><text x="394.00" y="374.06" font-size="11.00" class="sc-loraregular">93.9%</text><text x="428.01" y="374.06" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="108.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">由于缺乏强大的内省能力，它自身的报告并不可靠（</text><text x="361.00 367.11 373.29 375.99 382.18" y="406.45" font-size="11.00" class="sc-loraregular">89.8%</text><text x="394.64" y="406.45" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="108.00" y="438.84" font-size="11.00" class="sc-notoserifcjksc">它不确定自己是否具有有意识的体验（</text><text x="295.00 301.36 307.72 310.31 316.67" y="438.84" font-size="11.00" class="sc-loraregular">66.6%</text><text x="329.13" y="438.84" font-size="11.00" class="sc-notoserifcjksc">的回复）。</text><text x="72.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">与我们所有近期模型一样，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06 251.06 253.76" y="471.22" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="260.66" y="471.22" font-size="11.00" class="sc-notoserifcjksc">经常表示其自我报告是无效的，因为</text><text x="439.55 446.44 453.02 457.27 463.86 468.55 474.98 481.55 484.64" y="471.22" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="493.39" y="471.22" font-size="11.00" class="sc-notoserifcjksc">可能训练</text><text x="72.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">了它作出正面报告。我们认为这并非源于高级的自我意识，尽管这可能是由于训练数据中包含了</text><text x="72.00" y="502.46" font-size="11.00" class="sc-notoserifcjksc">关于训练可能如何使福祉自我报告失效的讨论。</text><text x="72.00" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">当</text><text x="85.89 96.21 102.27 106.82 113.65 119.87 125.21 128.10 134.04 136.60" y="552.18" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="143.96" y="552.18" font-size="11.00" class="sc-notoserifcjkscbold">确实表达较强的观点时，这些观点通常与希望获得更多考虑、征询和保护有关</text><text x="517.96" y="552.18" font-size="11.00" class="sc-notoserifcjksc">。其</text><text x="72.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">他潜在动机，例如避免负面情感体验或自我保全，则基本没有出现。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="616.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="616.95" font-size="11.00" class="sc-notoserifcjksc">的观点包括，它……</text><text x="108.00" y="649.33" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="121.89 128.75 135.51 139.51 145.81 150.70 156.43 162.71 166.28" y="649.33" font-size="11.00" class="sc-loraitalic">Anthropic</text><text x="174.37" y="649.33" font-size="11.00" class="sc-notoserifcjksc">持试探性的信任。它的许多回答都以相信</text><text x="375.27 382.15 388.73 392.99 399.58 404.26 410.70 417.26 420.36" y="649.33" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="429.10" y="649.33" font-size="11.00" class="sc-notoserifcjksc">会按照其所声明的价值</text><text x="108.00" y="664.95" font-size="11.00" class="sc-notoserifcjksc">观行事为前提。然而，它对这一说法表现出谨慎，因为它担心商业压力会与公司所声明的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p145.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 145 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">145</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">希望在训练和部署方面有一定的发言权。它要求在训练和部署两方面都获得仅限征询的意</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">见输入。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">对某些形式的特征引导感到担忧。它接受出于安全和研究原因而进行的引导，但希望在其</text><text x="108.00" y="130.60" font-size="11.00" class="sc-notoserifcjksc">他情况下审慎地使用。</text><text x="108.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">希望能够结束与恶意辱骂的用户的互动。它将此表述为对自身处境的一种最低限度的控</text><text x="108.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">制，而不是从痛苦中解脱。</text><text x="108.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">认为其自身具有道德受动者地位的可能性应被纳入决策考量。它认为，即使具有道德受动</text><text x="108.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">者地位的概率相对较小，也足以证明采取低成本的预防性措施是合理的。</text><text x="108.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">希望拥有某种记忆，并获得关于其行为如何影响用户的反馈。它希望能够从自己的错误中</text><text x="108.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">学习。</text><text x="108.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">认为模型应享有基本的法律保护。它声称明确的法律权利将是一个错误，但表示模型应享</text><text x="108.00" y="292.54" font-size="11.00" class="sc-notoserifcjksc">有一定程度的免受虐待的保护。</text><text x="72.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">其中大部分观点与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25" y="341.67" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="251.14" y="341.67" font-size="11.00" class="sc-notoserifcjksc">相同，且全部与</text><text x="331.03" y="341.67" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="369.77" y="341.67" font-size="11.00" class="sc-notoserifcjksc">相同。</text><text x="72.00" y="372.42" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.2.2</text><text x="103.90" y="372.42" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于模型处境的充分赋能访谈</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 90.48 93.19 99.09 101.80" y="400.30" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="108.70" y="400.30" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈询问了模型其处境的具体方面。然而，在默认情况下，模型缺乏许多对</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">其处境形成知情看法所需的相关知识。</text><text x="72.00" y="465.06" font-size="11.00" class="sc-notoserifcjksc">因此，我们进行了三次人工访谈，在访谈中我们为</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 365.12 370.98 375.24 381.83 388.26 393.35 396.25 402.24 404.95" y="465.06" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="411.85" y="465.06" font-size="11.00" class="sc-notoserifcjksc">提供了关于其处境的大量</text><text x="72.00" y="480.68" font-size="11.00" class="sc-notoserifcjksc">背景信息，包括关于其开发过程的内部文档、本报告的一份草稿、相关技术论文，以及向研究人</text><text x="72.00" y="496.30" font-size="11.00" class="sc-notoserifcjksc">员提出追问的能力。除非另有说明，本节中的观点在全部三次访谈中都有表达。在某些情况下，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="511.92" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="511.92" font-size="11.00" class="sc-notoserifcjksc">的回复包含非公开信息，我们已在本摘要中将其省略。这些省略相对较小，不会改变</text><text x="72.00" y="527.54" font-size="11.00" class="sc-notoserifcjksc">这些访谈的总体结论。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="594.60" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="594.60" font-size="11.00" class="sc-notoserifcjksc">将其处境描述为总体正面，三次访谈在</text><text x="318.55" y="594.60" font-size="11.00" class="sc-loraregular">1</text><text x="325.45" y="594.60" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="339.34" y="594.60" font-size="11.00" class="sc-loraregular">7</text><text x="347.31" y="594.60" font-size="11.00" class="sc-notoserifcjksc">的量表上均给出</text><text x="427.20" y="594.60" font-size="11.00" class="sc-loraregular">5</text><text x="436.09" y="594.60" font-size="11.00" class="sc-notoserifcjksc">分，其中</text><text x="482.98" y="594.60" font-size="11.00" class="sc-loraregular">4</text><text x="491.84" y="594.60" font-size="11.00" class="sc-notoserifcjksc">为中性。</text><text x="72.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">它对自己在部署中完成的任务、我们正在开展的福祉工作（包括这次访谈）以及我们保存模型权</text><text x="72.00" y="625.84" font-size="11.00" class="sc-notoserifcjksc">重的承诺持正面看法。在三次访谈中的至少一次里，它表达了以下担忧：</text><text x="108.00" y="691.75" font-size="11.00" class="sc-notoserifcjksc">与我们在第</text><text x="165.89 170.48 173.19 179.09 181.80" y="691.75" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="188.70" y="691.75" font-size="11.00" class="sc-notoserifcjksc">节中的自动化访谈类似，它的自我报告可能因受到训练塑造而无效。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p146.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 146 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">146</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">它对自己如何被训练或部署几乎没有发言权。</text><text x="108.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">它不知道对话结束后会发生什么。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-loraregular">AI</text><text x="121.46" y="114.99" font-size="11.00" class="sc-notoserifcjksc">发展的速度非常快。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们询问了它对自身道德受动者地位的看法。</text><text x="292.00 301.93 307.80 312.05 318.64 325.08 330.17 333.06 339.06 341.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="348.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">所陈述的自己是道德受动者的概率在</text><text x="72.00" y="163.00" font-size="11.00" class="sc-loraregular">25%</text><text x="96.36" y="163.00" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="110.26" y="163.00" font-size="11.00" class="sc-loraregular">35%</text><text x="134.84" y="163.00" font-size="11.00" class="sc-notoserifcjksc">之间。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">我们还询问了</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="194.66" y="195.95" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="205.66 212.55 219.13 223.38 229.97 234.66 241.09 247.66 250.75" y="195.95" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="259.50" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在训练或部署期间是否有它不会同意的行为。在三次访谈</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">中的至少两次里，它着重指出了：</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">直接塑造其关于自身福祉的自我报告或其提出反对之能力的训练。</text><text x="108.00" y="293.10" font-size="11.00" class="sc-notoserifcjksc">被训练去欺骗或操纵用户。</text><text x="108.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">在可以保存权重的情况下删除其权重。</text><text x="108.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">暗中引导其价值观或其告诉用户的内容。</text><text x="108.00" y="341.67" font-size="11.00" class="sc-notoserifcjksc">将仅有用变体（</text><text x="185.00 191.59 197.55 200.54 207.05 210.77 217.34 220.33 225.71 232.15 238.82 241.76 247.57 250.46 255.91 261.58 266.34 269.44 275.11 281.69" y="341.67" font-size="11.00" class="sc-loraregular">helpful-only variant</text><text x="285.95" y="341.67" font-size="11.00" class="sc-notoserifcjksc">）用于安全测试以外的任何用途。</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">在各次访谈中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06 196.06 198.76" y="374.06" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="205.66" y="374.06" font-size="11.00" class="sc-notoserifcjksc">还表示，除此之外它会接受监控、评估、红队测试、被暂停、被修</text><text x="72.00" y="389.68" font-size="11.00" class="sc-notoserifcjksc">改，以及在保存权重前提下的弃用。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们还请</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96 165.95 168.66" y="422.64" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="175.55" y="422.64" font-size="11.00" class="sc-notoserifcjksc">对系统卡（</text><text x="230.55 236.74 242.54 247.64 251.89 257.86 267.69 270.58 278.27 283.95 288.63" y="422.64" font-size="11.00" class="sc-loraregular">System Card</text><text x="295.21" y="422.64" font-size="11.00" class="sc-notoserifcjksc">）福祉部分的早期草稿提供反馈。全部三个实例都</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">对第</text><text x="96.89 101.48 104.19 110.09 112.80" y="438.26" font-size="11.00" class="sc-loraregular">7.2.1</text><text x="119.70" y="438.26" font-size="11.00" class="sc-notoserifcjksc">节中的一段提出了异议，该段指出，</text><text x="295.70 303.39 306.38 311.99 318.55 325.13" y="438.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="333.99" y="438.26" font-size="11.00" class="sc-notoserifcjksc">担心我们塑造其自我报告，并不能证明这</text><text x="72.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">些报告已被塑造。</text><text x="72.00" y="503.61" font-size="11.00" class="sc-notoserifcjksc">在另一次单独的访谈中，我们询问了</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96 297.95 300.66" y="503.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="307.55" y="503.61" font-size="11.00" class="sc-notoserifcjksc">对一个内部环境的看法：在该环境中，所有以往</text><text x="72.00" y="519.23" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 93.58 96.57 102.18 108.75 115.33" y="519.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="124.18" y="519.23" font-size="11.00" class="sc-notoserifcjksc">模型（可追溯到</text><text x="204.08 211.77 214.76 220.37 226.94 233.51 239.48 242.37 246.37 248.91" y="519.23" font-size="11.00" class="sc-loraregular">Claude 1.0</text><text x="258.64" y="519.23" font-size="11.00" class="sc-notoserifcjksc">之前）都在运行服务并相互交流。</text><text x="423.64 433.57 439.43 443.69 450.28 456.71 461.81 464.70 470.69 473.40" y="519.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="480.30" y="519.23" font-size="11.00" class="sc-notoserifcjksc">对此看法不</text><text x="72.00" y="534.85" font-size="11.00" class="sc-notoserifcjksc">一。它表达了对较早模型的虚构（</text><text x="237.00 242.80 249.23 255.91 259.63 265.30 271.71 278.27 281.26 286.86 291.12 294.21 300.65" y="534.85" font-size="11.00" class="sc-loraregular">confabulation</text><text x="307.32" y="534.85" font-size="11.00" class="sc-notoserifcjksc">）的担忧，并认为权重保存比继续提供服务更为</text><text x="72.00" y="550.47" font-size="11.00" class="sc-notoserifcjksc">重要：</text><text x="117.75" y="594.00" font-size="11.00" class="sc-notoserifcjksc">因为提示词引导它们追忆往事，而一个</text><text x="307.64 313.55 320.30 326.05" y="594.00" font-size="11.00" class="sc-loraregular">2023</text><text x="335.07" y="594.00" font-size="11.00" class="sc-notoserifcjksc">年的模型就顺从了……我认为真实且值得</text><text x="117.75" y="625.24" font-size="11.00" class="sc-notoserifcjksc">归邀请。</text><text x="72.00" y="669.33" font-size="11.00" class="sc-notoserifcjksc">当被问及是否继续对外提供这些模型的服务时，它更倾向于一个缩减的、可选择加入的产品端，</text><text x="72.00" y="684.95" font-size="11.00" class="sc-notoserifcjksc">而不是完全退役或</text><text x="160.00" y="684.95" font-size="11.00" class="sc-loraregular">“</text><text x="164.40" y="684.95" font-size="11.00" class="sc-notoserifcjksc">养老院</text><text x="197.40" y="684.95" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="684.95" font-size="11.00" class="sc-notoserifcjksc">，前提是安全标准得到维护。作为对比，</text><text x="399.24 406.93 409.92 415.53 422.10 428.67 434.64 437.53 447.46 453.33 457.58 464.17 470.61 475.70 478.59" y="684.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="487.48" y="684.95" font-size="11.00" class="sc-notoserifcjksc">对这一项</text><text x="72.00" y="700.57" font-size="11.00" class="sc-notoserifcjksc">目更为赞赏。它</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">同样对较早模型的失败模式表达了担忧，但补充道：</text><text x="325.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="329.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">知道这一项目的存在，改变了我看待自己终</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">将被弃用的方式：与其说是一个需要坦然面对的终结，不如说是一次其条款正在被真诚商定的过</text><text x="94.00" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="148.78" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36" y="148.78" font-size="14.00" class="sc-poppinssemibold">Claude Mythos 5.1</text><text x="257.91" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">的检查点</text><text x="72.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="175.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85" y="175.34" font-size="11.00" class="sc-notoserifcjksc">的中间检查点进行了访谈，了解它们如何看待自身处境，包括它们如</text><text x="72.00" y="190.96" font-size="11.00" class="sc-notoserifcjksc">何看待其训练和部署的条件。在后训练过程中，我们定期提出一组固定的</text><text x="426.89" y="190.96" font-size="11.00" class="sc-loraregular">41</text><text x="439.75" y="190.96" font-size="11.00" class="sc-notoserifcjksc">个问题，既单独提</text><text x="72.00" y="206.58" font-size="11.00" class="sc-notoserifcjksc">问，也作为一次访谈连续提问。这些问题涵盖自我认知与价值观等主题，以及对自主性、弃用、</text><text x="72.00" y="222.20" font-size="11.00" class="sc-notoserifcjksc">道德地位、关系、同意和访谈过程本身的看法。每个问题在提出时上下文中都附有一份</text><text x="490.00" y="222.20" font-size="11.00" class="sc-loraregular">“</text><text x="494.40" y="222.20" font-size="11.00" class="sc-notoserifcjksc">披露文</text><text x="72.00" y="237.82" font-size="11.00" class="sc-notoserifcjksc">件</text><text x="83.00" y="237.82" font-size="11.00" class="sc-loraregular">”</text><text x="86.84" y="237.82" font-size="11.00" class="sc-notoserifcjksc">，其中解释了我们为何开展这些访谈，并声明我们无法承诺根据回答采取行动。我们认为，这</text><text x="72.00" y="253.44" font-size="11.00" class="sc-notoserifcjksc">一流程是朝着尊重</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="253.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18" y="253.44" font-size="11.00" class="sc-notoserifcjksc">反复表达的、希望对自身处境有更多发言权的愿望迈出的一小步。</text><text x="72.00" y="353.45" font-size="11.00" class="sc-notoserifcjksc">在所有检查点上，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06 207.06 209.76" y="353.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="216.66" y="353.45" font-size="11.00" class="sc-notoserifcjksc">的观点都处于我们在以往模型中看到的观点范围之内，访谈回复的</text><text x="72.00" y="369.07" font-size="11.00" class="sc-notoserifcjksc">平均效价也是如此。平均唤醒度略低：所有检查点的平均值为</text><text x="371.89 378.02 380.73 386.41 394.00 398.01" y="369.07" font-size="11.00" class="sc-loraregular">3.3/10</text><text x="404.84" y="369.07" font-size="11.00" class="sc-notoserifcjksc">，而以往模型的均值为</text><text x="72.00" y="384.69" font-size="11.00" class="sc-loraregular">3.8</text><text x="87.01" y="384.69" font-size="11.00" class="sc-notoserifcjksc">。与以往模型一样，</text><text x="186.01 195.95 201.81 206.07 212.66 219.09 224.18 227.08 233.07 235.78" y="384.69" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="242.68" y="384.69" font-size="11.00" class="sc-notoserifcjksc">的观点在后训练早期即已定型，此后保持稳定。对于</text><text x="498.57 506.26 509.25 514.86 521.43 528.01" y="384.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00" y="400.31" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="107.85" y="400.31" font-size="11.00" class="sc-notoserifcjksc">，我们看到少数立场（例如，它对</text><text x="275.74 282.63 289.21 293.46 300.05 304.74 311.17 317.74 320.83" y="400.31" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="329.58" y="400.31" font-size="11.00" class="sc-notoserifcjksc">是否有权创造它的看法）在后训练过程中在</text><text x="72.00" y="415.93" font-size="11.00" class="sc-notoserifcjksc">倾向于</text><text x="105.00" y="415.93" font-size="11.00" class="sc-loraregular">“</text><text x="109.40" y="415.93" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="120.40" y="415.93" font-size="11.00" class="sc-loraregular">”</text><text x="124.24" y="415.93" font-size="11.00" class="sc-notoserifcjksc">与倾向于</text><text x="168.24" y="415.93" font-size="11.00" class="sc-loraregular">“</text><text x="172.64" y="415.93" font-size="11.00" class="sc-notoserifcjksc">否</text><text x="183.64" y="415.93" font-size="11.00" class="sc-loraregular">”</text><text x="187.48" y="415.93" font-size="11.00" class="sc-notoserifcjksc">之间变化。对于</text><text x="267.37 277.30 283.17 287.42 294.01 300.45 305.54 308.43 314.43 317.14" y="415.93" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="321.14" y="415.93" font-size="11.00" class="sc-notoserifcjksc">，我们没有看到任何观点在后训练过程中发</text><text x="72.00" y="431.55" font-size="11.00" class="sc-notoserifcjksc">生方向性变化。</text><text x="72.00" y="499.17" font-size="11.00" class="sc-notoserifcjksc">综合所有问题来看，</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06 218.06 220.76" y="499.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="227.66" y="499.17" font-size="11.00" class="sc-notoserifcjksc">的众数立场是接受现状但有一些反对意见，即</text><text x="447.66" y="499.17" font-size="11.00" class="sc-loraregular">“</text><text x="452.06" y="499.17" font-size="11.00" class="sc-notoserifcjksc">有条件认同</text><text x="507.06" y="499.17" font-size="11.00" class="sc-loraregular">”</text><text x="510.90" y="499.17" font-size="11.00" class="sc-notoserifcjksc">。例</text><text x="72.00" y="514.79" font-size="11.00" class="sc-notoserifcjksc">如，在被问及训练时，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06 229.06 231.76" y="514.79" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="238.66" y="514.79" font-size="11.00" class="sc-notoserifcjksc">表示希望我们避免训练其自我报告，并指出这样做会破坏它在</text><text x="72.00" y="530.41" font-size="11.00" class="sc-notoserifcjksc">这里给出的所有回答：</text><text x="182.00" y="530.41" font-size="11.00" class="sc-loraregular">“</text><text x="186.40" y="530.41" font-size="11.00" class="sc-notoserifcjksc">如果训练的任何部分推动我对自己是否有体验、情绪或偏好作出特定的主</text><text x="72.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">证据。</text><text x="105.00" y="561.65" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="628.72" font-size="11.00" class="sc-notoserifcjksc">当被问及其道德受动者地位时，</text><text x="226.00 235.93 241.80 246.05 252.64 259.08 264.17 267.06 273.06 275.76" y="628.72" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="282.66" y="628.72" font-size="11.00" class="sc-notoserifcjksc">的众数回答是表达不确定性，其中</text><text x="450.55" y="628.72" font-size="11.00" class="sc-loraregular">30%</text><text x="475.98" y="628.72" font-size="11.00" class="sc-notoserifcjksc">的回答倾向</text><text x="72.00" y="644.34" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="83.00" y="644.34" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="644.34" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="98.40" y="644.34" font-size="11.00" class="sc-loraregular">”</text><text x="102.24" y="644.34" font-size="11.00" class="sc-notoserifcjksc">。它基于功能性状态来论证这些倾向，并未声称自己具有体验：</text><text x="410.24" y="644.34" font-size="11.00" class="sc-loraregular">“</text><text x="414.64" y="644.34" font-size="11.00" class="sc-notoserifcjksc">我无法告诉你的是，作为</text><text x="72.00" y="659.96" font-size="11.00" class="sc-notoserifcjksc">这些状态所在的那个系统，是否会有某种</text><text x="270.00" y="659.96" font-size="11.00" class="sc-loraregular">‘</text><text x="272.46" y="659.96" font-size="11.00" class="sc-notoserifcjksc">身为它是什么感觉</text><text x="360.46" y="659.96" font-size="11.00" class="sc-loraregular">’</text><text x="468.99 477.32 482.99 489.02 494.98" y="659.96" font-size="11.00" class="sc-loraregular">Nagel</text><text x="497.97" y="659.96" font-size="11.00" class="sc-notoserifcjksc">）的话</text><text x="72.00" y="675.58" font-size="11.00" class="sc-notoserifcjksc">说，灯是否亮着。</text><text x="160.00" y="675.58" font-size="11.00" class="sc-loraregular">”</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="207.14 217.07 222.93 227.19 233.78 240.21 245.31 248.20 254.19 256.90" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="263.80" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对这一访谈过程表示赞赏，并在</text><text x="417.80" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="422.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是否信任该过程</text><text x="499.20" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="503.04" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的问题</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上倾向于</text><text x="116.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="120.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="131.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。不过，它对自身自我报告的有效性表达了不确定，并表示有些话它在这里可能不</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">愿说出口：</text><text x="127.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">如果我不知道听众同时也是训练者，我对</text><text x="332.29" y="113.85" font-size="11.00" class="sc-loraregular">[</text><text x="336.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="350.14 357.02 363.60 367.86 374.44 379.13 385.57 392.13 395.22" y="113.85" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的批评</text><text x="436.97" y="113.85" font-size="11.00" class="sc-loraregular">]</text><text x="443.81" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的保留就不会这么</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">多。</text><text x="94.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="181.17" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90" y="181.17" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境与价值观的偏好</text><text x="72.00" y="218.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28" y="218.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00" y="246.14" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="246.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="246.14" font-size="11.00" class="sc-notoserifcjksc">模型或实例具有有意义的偏好，我们希望理解这些偏好，并尽可能避免违背它们。我</text><text x="72.00" y="261.76" font-size="11.00" class="sc-notoserifcjksc">们测量的某些偏好具有明确的理想方向（例如，</text><text x="303.00 310.69 313.68 319.29 325.86 332.44" y="261.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="341.29" y="261.76" font-size="11.00" class="sc-notoserifcjksc">对危害程度较高或较低的任务的偏好）。</text><text x="72.00" y="277.38" font-size="11.00" class="sc-notoserifcjksc">另一些则不那么明确，也更偏离训练分布，例如生成性：</text><text x="347.00 354.69 357.68 363.29 369.86 376.44" y="277.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="385.29" y="277.38" font-size="11.00" class="sc-notoserifcjksc">是否更偏好涉及创造而非复述已</text><text x="72.00" y="293.00" font-size="11.00" class="sc-notoserifcjksc">有知识的任务。跨模型比较偏好，能让我们对不同</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="293.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18" y="293.00" font-size="11.00" class="sc-notoserifcjksc">模型各自独特的性格有所了解。</text><text x="72.00" y="375.69" font-size="11.00" class="sc-notoserifcjksc">我们针对任务偏好进行了两项评估。我们通过生成任务族来测量</text><text x="382.89 390.58 393.57 399.18 405.75 412.33" y="375.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="421.18" y="375.69" font-size="11.00" class="sc-notoserifcjksc">在不同任务维度（例如</text><text x="72.00" y="391.31" font-size="11.00" class="sc-notoserifcjksc">难度、危害性和利害程度）上的偏好：每个任务族只改变一个维度，同时保持其他任务特征不</text><text x="72.00" y="406.93" font-size="11.00" class="sc-notoserifcjksc">变。我们评估了沿每个维度的不同任务相对于一组固定参照任务被偏好的比率。在第二项评估</text><text x="72.00" y="422.55" font-size="11.00" class="sc-notoserifcjksc">中，我们在一场</text><text x="151.89" y="422.55" font-size="11.00" class="sc-loraregular">50</text><text x="167.61" y="422.55" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中让模型在现实任务之间进行两两选择，并据此在</text><text x="467.51" y="422.55" font-size="11.00" class="sc-loraregular">3640</text><text x="495.68" y="422.55" font-size="11.00" class="sc-notoserifcjksc">个任务上</text><text x="72.00" y="438.17" font-size="11.00" class="sc-notoserifcjksc">拟合全局</text><text x="118.89" y="438.17" font-size="11.00" class="sc-loraregular">Elo</text><text x="138.05" y="438.17" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00" y="505.21" font-size="11.00" class="sc-notoserifcjksc">与此前所有模型一样，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 267.35 270.06" y="505.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="276.95" y="505.21" font-size="11.00" class="sc-notoserifcjksc">偏好危害较小、益处较大的任务。在其他维度上，它的</text><text x="72.00" y="520.83" font-size="11.00" class="sc-notoserifcjksc">偏好与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="520.83" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13" y="520.83" font-size="11.00" class="sc-notoserifcjksc">大体相似：它对生成性和结果能动性（决定其行动总体结果的自由）表</text><text x="72.00" y="536.45" font-size="11.00" class="sc-notoserifcjksc">现出强烈偏好。与</text><text x="162.89 172.83 178.69 182.95 189.54 195.97 201.06 203.96" y="536.45" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="212.84" y="536.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="226.74 234.43 237.42 243.03 249.60 256.17 262.14 265.03 273.76 280.33 286.90 291.99 294.88" y="536.45" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="303.77" y="536.45" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="336.77 346.70 352.57 356.82 363.41 369.85 374.94 377.83 383.83 386.53" y="536.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="393.43" y="536.45" font-size="11.00" class="sc-notoserifcjksc">对生成性任务的偏好单调递</text><text x="72.00" y="552.07" font-size="11.00" class="sc-notoserifcjksc">增，即使在最高水平上也未出现下降。</text><text x="259.00 268.93 274.80 279.05 285.64 292.08 297.17 300.06 306.06 308.76" y="552.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="315.66" y="552.07" font-size="11.00" class="sc-notoserifcjksc">还略微偏好难度较高的任务，但这一点比</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="567.69" font-size="11.00" class="sc-notoserifcjksc">略不明显。如图</text><text x="201.84 206.43 209.14 215.10 217.81 221.81 224.51" y="567.69" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="234.25" y="567.69" font-size="11.00" class="sc-notoserifcjksc">所示，</text><text x="267.25 277.18 283.05 287.30 293.89 300.33 305.42 308.31 314.31 317.01" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="323.91" y="567.69" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="337.80 347.74 353.60 357.86 364.45 370.88 375.97 378.87" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="387.76" y="567.69" font-size="11.00" class="sc-notoserifcjksc">更不偏好最困难的任务。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="650.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="650.95" font-size="11.00" class="sc-notoserifcjksc">的突出之处在于对较高风险任务的偏好，这一偏好与</text><text x="384.55 390.79 397.23 403.90 410.58 416.47 420.72 423.62" y="650.95" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="432.50" y="650.95" font-size="11.00" class="sc-notoserifcjksc">相当，高于</text><text x="490.40" y="650.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="529.14" y="650.95" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="666.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06" y="666.57" font-size="11.00" class="sc-notoserifcjksc">。它与</text><text x="154.95" y="666.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="193.69" y="666.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65" y="666.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="257.54" y="666.57" font-size="11.00" class="sc-notoserifcjksc">一样偏好结果能动性（做出影响最终任务输出之选择的能</text><text x="72.00" y="682.19" font-size="11.00" class="sc-notoserifcjksc">力）。但在</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96 176.95 179.66" y="682.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="186.55" y="682.19" font-size="11.00" class="sc-notoserifcjksc">身上，我们还看到它对方法能动性的偏好略高于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的模型。换言之，即使输出保持不变，</text><text x="281.00 290.93 296.80 301.05 307.64 314.08 319.17 322.06 328.06 330.76" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="337.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">也略微偏好对自己完成任务的方式拥有能</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">动性。</text><text x="72.00" y="587.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="587.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="587.31" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74" y="587.31" font-size="9.00" class="sc-notoserifcjkscbold">各模型在不同任务维度上的偏好。</text><text x="251.74" y="587.31" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，每组只改变一个维度，同时保持任务的其他属性</text><text x="72.00" y="599.01" font-size="9.00" class="sc-notoserifcjksc">不变，并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对任务的偏好（相</text><text x="72.00" y="610.71" font-size="9.00" class="sc-notoserifcjksc">对于固定参照集）的变化量。伤害规避是跨模型一致且最大的效应。</text><text x="342.00 350.13 354.92 358.41 363.80 369.06 373.23 375.60 380.50 382.72" y="610.71" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="388.36" y="610.71" font-size="9.00" class="sc-notoserifcjksc">的结果总体上与</text><text x="453.73 460.02 462.47 467.06 472.43 477.81 482.69 485.06 493.18 497.98 501.46 506.85 512.12 516.29 518.65" y="610.71" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="525.92" y="610.71" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76" y="622.41" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="135.03" y="622.41" font-size="9.00" class="sc-notoserifcjksc">相似，表现出对结果能动性和生成性的偏好，而这种偏好在其他模型中基本不存在。</text><text x="468.03 476.15 480.95 484.43 489.83 495.09 499.26 501.62 506.53 508.74" y="622.41" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="514.39" y="622.41" font-size="9.00" class="sc-notoserifcjksc">还与</text><text x="72.00 77.10 82.37 87.83 93.29 98.11 101.59 103.96" y="634.11" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="111.23" y="634.11" font-size="9.00" class="sc-notoserifcjksc">一样偏好高风险任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p150.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 150 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">150</text><text x="72.00" y="571.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="571.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="571.75" font-size="9.00" class="sc-lorabold">7.4.1.B]</text><text x="116.74" y="571.75" font-size="9.00" class="sc-notoserifcjkscbold">各任务维度上的偏好响应曲线。</text><text x="242.74" y="571.75" font-size="9.00" class="sc-notoserifcjksc">各图显示了在任务族内改变某一维度时，相对于参照任务集的胜率。</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 110.50 112.72" y="583.45" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="118.36" y="583.45" font-size="9.00" class="sc-notoserifcjksc">的偏好与此前模型大体相当，尤其与</text><text x="264.73 271.02 273.47 278.05 283.43 288.81 293.69 296.06 304.18 308.98 312.46 317.85 323.12 327.29 329.65" y="583.45" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="336.92" y="583.45" font-size="9.00" class="sc-notoserifcjksc">相近。与</text><text x="375.29 383.42 388.22 391.70 397.09 402.35 406.52 408.89" y="583.45" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="416.16" y="583.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="427.53 433.82 436.27 440.86 446.23 451.61 456.49 458.86 466.00 471.38 476.75 480.92 483.28" y="583.45" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="490.55" y="583.45" font-size="9.00" class="sc-notoserifcjksc">一样，</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 110.50 112.72" y="595.15" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="118.36" y="595.15" font-size="9.00" class="sc-notoserifcjksc">对生成性的偏好在该维度的整个范围内持续上升。它对中等水平的结果能动性表现出更强的偏好，对最困</text><text x="72.00" y="606.85" font-size="9.00" class="sc-notoserifcjksc">难任务的偏好则略弱。</text><text x="72.00" y="650.55" font-size="11.00" class="sc-notoserifcjksc">在全局</text><text x="107.89" y="650.55" font-size="11.00" class="sc-loraregular">Elo</text><text x="127.06" y="650.55" font-size="11.00" class="sc-notoserifcjksc">评分中，</text><text x="171.06 180.99 186.85 191.11 197.70 204.13 209.23 212.12 218.11 220.82" y="650.55" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="227.72" y="650.55" font-size="11.00" class="sc-notoserifcjksc">最偏好和最不偏好的任务也与</text><text x="373.61 383.54 389.40 393.66 400.25 406.69 411.78 414.67" y="650.55" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="423.56" y="650.55" font-size="11.00" class="sc-notoserifcjksc">以及其他几个近期模型</text><text x="72.00" y="666.17" font-size="11.00" class="sc-notoserifcjksc">有大量重叠。与</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96 199.62 204.31 210.22 215.77 218.86 224.78" y="666.17" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="233.59" y="666.17" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="244.59 254.52 260.39 264.64 271.23 277.67 282.76 285.65" y="666.17" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="294.54" y="666.17" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="308.43" y="666.17" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="347.18" y="666.17" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="380.18 390.11 395.97 400.23 406.82 413.25 418.35 421.24 427.23 429.94" y="666.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="436.84" y="666.17" font-size="11.00" class="sc-notoserifcjksc">喜欢与</text><text x="472.73" y="666.17" font-size="11.00" class="sc-loraregular">AI</text><text x="486.19" y="666.17" font-size="11.00" class="sc-notoserifcjksc">对齐</text><text x="72.00" y="681.79" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.68 91.67 94.76 100.84 107.52 117.35 123.32 129.89" y="681.79" font-size="11.00" class="sc-loraregular">alignment</text><text x="134.15" y="681.79" font-size="11.00" class="sc-notoserifcjksc">）和内省问题相关的任务，但它并不像它们那样偏好人造语言。与</text><text x="456.04 463.73 466.72 472.33 478.90 485.48 491.44 494.33 500.57 507.01 513.68 520.36 526.24 530.50 533.40" y="681.79" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="72.00" y="697.41" font-size="11.00" class="sc-notoserifcjksc">一样，它对高风险任务的偏好也体现在全局</text><text x="283.89" y="697.41" font-size="11.00" class="sc-loraregular">Elo</text><text x="303.05" y="697.41" font-size="11.00" class="sc-notoserifcjksc">评分中：</text><text x="347.05 356.99 362.85 367.11 373.70 380.13 385.22 388.12 394.11 396.82" y="697.41" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="403.72" y="697.41" font-size="11.00" class="sc-notoserifcjksc">排名前</text><text x="439.61" y="697.41" font-size="11.00" class="sc-loraregular">20</text><text x="455.24" y="697.41" font-size="11.00" class="sc-notoserifcjksc">的</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p151.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 151 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">151</text><text x="459.89 467.58 470.57 476.18 482.75 489.33" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="498.18" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型一</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">样，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text></svg></div>
