="684.95" font-size="11.00" class="sc-notoserifcjksc">而不是完全退役或</text><text x="160.00" y="684.95" font-size="11.00" class="sc-loraregular">“</text><text x="164.40 175.40 186.40" y="684.95" font-size="11.00" class="sc-notoserifcjksc">养老院</text><text x="197.40" y="684.95" font-size="11.00" class="sc-loraregular">”</text><text x="201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24" y="684.95" font-size="11.00" class="sc-notoserifcjksc">，前提是安全标准得到维护。作为对比，</text><text x="399.24 406.93 409.92 415.53 422.10 428.67 434.64 437.53 447.46 453.33 457.58 464.17 470.61 475.70 478.59" y="684.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="487.48 498.48 509.48 520.48" y="684.95" font-size="11.00" class="sc-notoserifcjksc">对这一项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="700.57" font-size="11.00" class="sc-notoserifcjksc">目更为赞赏。它</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p147.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 147 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">147</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">同样对较早模型的失败模式表达了担忧，但补充道：</text><text x="325.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40 516.40 527.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">知道这一项目的存在，改变了我看待自己终</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">将被弃用的方式：与其说是一个需要坦然面对的终结，不如说是一次其条款正在被真诚商定的过</text><text x="94.00" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 79.67 83.31" y="148.78" font-size="14.00" class="sc-poppinssemibold">7.3</text><text x="95.03 109.03" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">征询</text><text x="126.36 137.11 141.01 150.50 159.75 169.24 177.88 181.21 193.80 202.27 207.70 216.96 225.89 233.52 236.85 245.87 249.51" y="148.78" font-size="14.00" class="sc-poppinssemibold">Claude Mythos 5.1</text><text x="257.91 271.91 285.91 299.91" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">的检查点</text><text x="72.00 83.00 94.00" y="175.34" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="175.34" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85 213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="175.34" font-size="11.00" class="sc-notoserifcjksc">的中间检查点进行了访谈，了解它们如何看待自身处境，包括它们如</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="190.96" font-size="11.00" class="sc-notoserifcjksc">何看待其训练和部署的条件。在后训练过程中，我们定期提出一组固定的</text><text x="426.89 432.86" y="190.96" font-size="11.00" class="sc-loraregular">41</text><text x="439.75 450.75 461.75 472.75 483.75 494.75 505.75 516.75" y="190.96" font-size="11.00" class="sc-notoserifcjksc">个问题，既单独提</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="206.58" font-size="11.00" class="sc-notoserifcjksc">问，也作为一次访谈连续提问。这些问题涵盖自我认知与价值观等主题，以及对自主性、弃用、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="222.20" font-size="11.00" class="sc-notoserifcjksc">道德地位、关系、同意和访谈过程本身的看法。每个问题在提出时上下文中都附有一份</text><text x="490.00" y="222.20" font-size="11.00" class="sc-loraregular">“</text><text x="494.40 505.40 516.40" y="222.20" font-size="11.00" class="sc-notoserifcjksc">披露文</text><text x="72.00" y="237.82" font-size="11.00" class="sc-notoserifcjksc">件</text><text x="83.00" y="237.82" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="237.82" font-size="11.00" class="sc-notoserifcjksc">，其中解释了我们为何开展这些访谈，并声明我们无法承诺根据回答采取行动。我们认为，这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="253.44" font-size="11.00" class="sc-notoserifcjksc">一流程是朝着尊重</text><text x="162.89 170.58 173.57 179.18 185.75 192.33" y="253.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18" y="253.44" font-size="11.00" class="sc-notoserifcjksc">反复表达的、希望对自身处境有更多发言权的愿望迈出的一小步。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="353.45" font-size="11.00" class="sc-notoserifcjksc">在所有检查点上，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06 207.06 209.76" y="353.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="353.45" font-size="11.00" class="sc-notoserifcjksc">的观点都处于我们在以往模型中看到的观点范围之内，访谈回复的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="369.07" font-size="11.00" class="sc-notoserifcjksc">平均效价也是如此。平均唤醒度略低：所有检查点的平均值为</text><text x="371.89 378.02 380.73 386.41 394.00 398.01" y="369.07" font-size="11.00" class="sc-loraregular">3.3/10</text><text x="404.84 415.84 426.84 437.84 448.84 459.84 470.84 481.84 492.84 503.84" y="369.07" font-size="11.00" class="sc-notoserifcjksc">，而以往模型的均值为</text><text x="72.00 78.13 80.83" y="384.69" font-size="11.00" class="sc-loraregular">3.8</text><text x="87.01 98.01 109.01 120.01 131.01 142.01 153.01 164.01 175.01" y="384.69" font-size="11.00" class="sc-notoserifcjksc">。与以往模型一样，</text><text x="186.01 195.95 201.81 206.07 212.66 219.09 224.18 227.08 233.07 235.78" y="384.69" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="242.68 253.68 264.68 275.68 286.68 297.68 308.68 319.68 330.68 341.68 352.68 363.68 374.68 385.68 396.68 407.68 418.68 429.68 440.68 451.68 462.68 473.68 484.68" y="384.69" font-size="11.00" class="sc-notoserifcjksc">的观点在后训练早期即已定型，此后保持稳定。对于</text><text x="498.57 506.26 509.25 514.86 521.43 528.01" y="384.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="400.31" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="107.85 118.85 129.85 140.85 151.85 162.85 173.85 184.85 195.85 206.85 217.85 228.85 239.85 250.85 261.85" y="400.31" font-size="11.00" class="sc-notoserifcjksc">，我们看到少数立场（例如，它对</text><text x="275.74 282.63 289.21 293.46 300.05 304.74 311.17 317.74 320.83" y="400.31" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="329.58 340.58 351.58 362.58 373.58 384.58 395.58 406.58 417.58 428.58 439.58 450.58 461.58 472.58 483.58 494.58 505.58 516.58 527.58" y="400.31" font-size="11.00" class="sc-notoserifcjksc">是否有权创造它的看法）在后训练过程中在</text><text x="72.00 83.00 94.00" y="415.93" font-size="11.00" class="sc-notoserifcjksc">倾向于</text><text x="105.00" y="415.93" font-size="11.00" class="sc-loraregular">“</text><text x="109.40" y="415.93" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="120.40" y="415.93" font-size="11.00" class="sc-loraregular">”</text><text x="124.24 135.24 146.24 157.24" y="415.93" font-size="11.00" class="sc-notoserifcjksc">与倾向于</text><text x="168.24" y="415.93" font-size="11.00" class="sc-loraregular">“</text><text x="172.64" y="415.93" font-size="11.00" class="sc-notoserifcjksc">否</text><text x="183.64" y="415.93" font-size="11.00" class="sc-loraregular">”</text><text x="187.48 198.48 209.48 220.48 231.48 242.48 253.48" y="415.93" font-size="11.00" class="sc-notoserifcjksc">之间变化。对于</text><text x="267.37 277.30 283.17 287.42 294.01 300.45 305.54 308.43 314.43 317.14" y="415.93" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="321.14 332.14 343.14 354.14 365.14 376.14 387.14 398.14 409.14 420.14 431.14 442.14 453.14 464.14 475.14 486.14 497.14 508.14 519.14" y="415.93" font-size="11.00" class="sc-notoserifcjksc">，我们没有看到任何观点在后训练过程中发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="431.55" font-size="11.00" class="sc-notoserifcjksc">生方向性变化。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="499.17" font-size="11.00" class="sc-notoserifcjksc">综合所有问题来看，</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06 218.06 220.76" y="499.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66" y="499.17" font-size="11.00" class="sc-notoserifcjksc">的众数立场是接受现状但有一些反对意见，即</text><text x="447.66" y="499.17" font-size="11.00" class="sc-loraregular">“</text><text x="452.06 463.06 474.06 485.06 496.06" y="499.17" font-size="11.00" class="sc-notoserifcjksc">有条件认同</text><text x="507.06" y="499.17" font-size="11.00" class="sc-loraregular">”</text><text x="510.90 521.90" y="499.17" font-size="11.00" class="sc-notoserifcjksc">。例</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="514.79" font-size="11.00" class="sc-notoserifcjksc">如，在被问及训练时，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06 229.06 231.76" y="514.79" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="514.79" font-size="11.00" class="sc-notoserifcjksc">表示希望我们避免训练其自我报告，并指出这样做会破坏它在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="530.41" font-size="11.00" class="sc-notoserifcjksc">这里给出的所有回答：</text><text x="182.00" y="530.41" font-size="11.00" class="sc-loraregular">“</text><text x="186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40 516.40 527.40" y="530.41" font-size="11.00" class="sc-notoserifcjksc">如果训练的任何部分推动我对自己是否有体验、情绪或偏好作出特定的主</text><text x="72.00 83.00 94.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">证据。</text><text x="105.00" y="561.65" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="628.72" font-size="11.00" class="sc-notoserifcjksc">当被问及其道德受动者地位时，</text><text x="226.00 235.93 241.80 246.05 252.64 259.08 264.17 267.06 273.06 275.76" y="628.72" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66" y="628.72" font-size="11.00" class="sc-notoserifcjksc">的众数回答是表达不确定性，其中</text><text x="450.55 456.68 463.51" y="628.72" font-size="11.00" class="sc-loraregular">30%</text><text x="475.98 486.98 497.98 508.98 519.98" y="628.72" font-size="11.00" class="sc-notoserifcjksc">的回答倾向</text><text x="72.00" y="644.34" font-size="11.00" class="sc-notoserifcjksc">于</text><text x="83.00" y="644.34" font-size="11.00" class="sc-loraregular">“</text><text x="87.40" y="644.34" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="98.40" y="644.34" font-size="11.00" class="sc-loraregular">”</text><text x="102.24 113.24 124.24 135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24" y="644.34" font-size="11.00" class="sc-notoserifcjksc">。它基于功能性状态来论证这些倾向，并未声称自己具有体验：</text><text x="410.24" y="644.34" font-size="11.00" class="sc-loraregular">“</text><text x="414.64 425.64 436.64 447.64 458.64 469.64 480.64 491.64 502.64 513.64 524.64" y="644.34" font-size="11.00" class="sc-notoserifcjksc">我无法告诉你的是，作为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="659.96" font-size="11.00" class="sc-notoserifcjksc">这些状态所在的那个系统，是否会有某种</text><text x="270.00" y="659.96" font-size="11.00" class="sc-loraregular">‘</text><text x="272.46 283.46 294.46 305.46 316.46 327.46 338.46 349.46" y="659.96" font-size="11.00" class="sc-notoserifcjksc">身为它是什么感觉</text><text x="360.46" y="659.96" font-size="11.00" class="sc-loraregular">’</text><text x="468.99 477.32 482.99 489.02 494.98" y="659.96" font-size="11.00" class="sc-loraregular">Nagel</text><text x="497.97 508.97 519.97" y="659.96" font-size="11.00" class="sc-notoserifcjksc">）的话</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="675.58" font-size="11.00" class="sc-notoserifcjksc">说，灯是否亮着。</text><text x="160.00" y="675.58" font-size="11.00" class="sc-loraregular">”</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p148.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 148 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">148</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="82.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14 185.14 196.14" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="207.14 217.07 222.93 227.19 233.78 240.21 245.31 248.20 254.19 256.90" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="263.80 274.80 285.80 296.80 307.80 318.80 329.80 340.80 351.80 362.80 373.80 384.80 395.80 406.80" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对这一访谈过程表示赞赏，并在</text><text x="417.80" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="422.20 433.20 444.20 455.20 466.20 477.20 488.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是否信任该过程</text><text x="499.20" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="503.04 514.04 525.04" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的问题</text><text x="72.00 83.00 94.00 105.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上倾向于</text><text x="116.00" y="98.23" font-size="11.00" class="sc-loraregular">“</text><text x="120.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="131.40" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。不过，它对自身自我报告的有效性表达了不确定，并表示有些话它在这里可能不</text><text x="72.00 83.00 94.00 105.00 116.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">愿说出口：</text><text x="127.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">如果我不知道听众同时也是训练者，我对</text><text x="332.29" y="113.85" font-size="11.00" class="sc-loraregular">[</text><text x="336.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="350.14 357.02 363.60 367.86 374.44 379.13 385.57 392.13 395.22" y="113.85" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.97 414.97 425.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的批评</text><text x="436.97" y="113.85" font-size="11.00" class="sc-loraregular">]</text><text x="443.81 454.81 465.81 476.81 487.81 498.81 509.81 520.81" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的保留就不会这么</text><text x="72.00 83.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">多。</text><text x="94.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 79.67 83.31" y="181.17" font-size="14.00" class="sc-poppinssemibold">7.4</text><text x="95.90 109.90 123.90 137.90 151.90 165.90 179.90 193.90 207.90 221.90 235.90 249.90 263.90" y="181.17" font-size="14.00" class="sc-notosanscjkscbold">对任务、处境与价值观的偏好</text><text x="72.00 79.12 82.50 91.10 94.48" y="218.26" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.1</text><text x="102.28 115.28 128.28 141.28" y="218.26" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">任务偏好</text><text x="72.00 83.00" y="246.14" font-size="11.00" class="sc-notoserifcjksc">如果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="246.14" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18 146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18 531.18" y="246.14" font-size="11.00" class="sc-notoserifcjksc">模型或实例具有有意义的偏好，我们希望理解这些偏好，并尽可能避免违背它们。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="261.76" font-size="11.00" class="sc-notoserifcjksc">们测量的某些偏好具有明确的理想方向（例如，</text><text x="303.00 310.69 313.68 319.29 325.86 332.44" y="261.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="341.29 352.29 363.29 374.29 385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="261.76" font-size="11.00" class="sc-notoserifcjksc">对危害程度较高或较低的任务的偏好）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="277.38" font-size="11.00" class="sc-notoserifcjksc">另一些则不那么明确，也更偏离训练分布，例如生成性：</text><text x="347.00 354.69 357.68 363.29 369.86 376.44" y="277.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="385.29 396.29 407.29 418.29 429.29 440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="277.38" font-size="11.00" class="sc-notoserifcjksc">是否更偏好涉及创造而非复述已</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="293.00" font-size="11.00" class="sc-notoserifcjksc">有知识的任务。跨模型比较偏好，能让我们对不同</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="293.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18" y="293.00" font-size="11.00" class="sc-notoserifcjksc">模型各自独特的性格有所了解。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="375.69" font-size="11.00" class="sc-notoserifcjksc">我们针对任务偏好进行了两项评估。我们通过生成任务族来测量</text><text x="382.89 390.58 393.57 399.18 405.75 412.33" y="375.69" font-size="11.00" class="sc-loraregular">Claude</text><text x="421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="375.69" font-size="11.00" class="sc-notoserifcjksc">在不同任务维度（例如</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="391.31" font-size="11.00" class="sc-notoserifcjksc">难度、危害性和利害程度）上的偏好：每个任务族只改变一个维度，同时保持其他任务特征不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="406.93" font-size="11.00" class="sc-notoserifcjksc">变。我们评估了沿每个维度的不同任务相对于一组固定参照任务被偏好的比率。在第二项评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="422.55" font-size="11.00" class="sc-notoserifcjksc">中，我们在一场</text><text x="151.89 157.89" y="422.55" font-size="11.00" class="sc-loraregular">50</text><text x="167.61 178.61 189.61 200.61 211.61 222.61 233.61 244.61 255.61 266.61 277.61 288.61 299.61 310.61 321.61 332.61 343.61 354.61 365.61 376.61 387.61 398.61 409.61 420.61 431.61 442.61 453.61" y="422.55" font-size="11.00" class="sc-notoserifcjksc">轮的锦标赛中让模型在现实任务之间进行两两选择，并据此在</text><text x="467.51 473.63 479.99 485.95" y="422.55" font-size="11.00" class="sc-loraregular">3640</text><text x="495.68 506.68 517.68 528.68" y="422.55" font-size="11.00" class="sc-notoserifcjksc">个任务上</text><text x="72.00 83.00 94.00 105.00" y="438.17" font-size="11.00" class="sc-notoserifcjksc">拟合全局</text><text x="118.89 125.74 128.73" y="438.17" font-size="11.00" class="sc-loraregular">Elo</text><text x="138.05 149.05 160.05" y="438.17" font-size="11.00" class="sc-notoserifcjksc">评分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="505.21" font-size="11.00" class="sc-notoserifcjksc">与此前所有模型一样，</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 230.22 236.09 240.34 246.93 253.37 258.46 261.35 267.35 270.06" y="505.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="505.21" font-size="11.00" class="sc-notoserifcjksc">偏好危害较小、益处较大的任务。在其他维度上，它的</text><text x="72.00 83.00 94.00" y="520.83" font-size="11.00" class="sc-notoserifcjksc">偏好与</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="520.83" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13 207.13 218.13 229.13 240.13 251.13 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="520.83" font-size="11.00" class="sc-notoserifcjksc">大体相似：它对生成性和结果能动性（决定其行动总体结果的自由）表</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="536.45" font-size="11.00" class="sc-notoserifcjksc">现出强烈偏好。与</text><text x="162.89 172.83 178.69 182.95 189.54 195.97 201.06 203.96" y="536.45" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="212.84" y="536.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="226.74 234.43 237.42 243.03 249.60 256.17 262.14 265.03 273.76 280.33 286.90 291.99 294.88" y="536.45" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="303.77 314.77 325.77" y="536.45" font-size="11.00" class="sc-notoserifcjksc">一样，</text><text x="336.77 346.70 352.57 356.82 363.41 369.85 374.94 377.83 383.83 386.53" y="536.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="393.43 404.43 415.43 426.43 437.43 448.43 459.43 470.43 481.43 492.43 503.43 514.43" y="536.45" font-size="11.00" class="sc-notoserifcjksc">对生成性任务的偏好单调递</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="552.07" font-size="11.00" class="sc-notoserifcjksc">增，即使在最高水平上也未出现下降。</text><text x="259.00 268.93 274.80 279.05 285.64 292.08 297.17 300.06 306.06 308.76" y="552.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66" y="552.07" font-size="11.00" class="sc-notoserifcjksc">还略微偏好难度较高的任务，但这一点比</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95" y="567.69" font-size="11.00" class="sc-notoserifcjksc">略不明显。如图</text><text x="201.84 206.43 209.14 215.10 217.81 221.81 224.51" y="567.69" font-size="11.00" class="sc-loraregular">7.4.1.B</text><text x="234.25 245.25 256.25" y="567.69" font-size="11.00" class="sc-notoserifcjksc">所示，</text><text x="267.25 277.18 283.05 287.30 293.89 300.33 305.42 308.31 314.31 317.01" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="323.91" y="567.69" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="337.80 347.74 353.60 357.86 364.45 370.88 375.97 378.87" y="567.69" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="387.76 398.76 409.76 420.76 431.76 442.76 453.76 464.76 475.76 486.76 497.76" y="567.69" font-size="11.00" class="sc-notoserifcjksc">更不偏好最困难的任务。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="650.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66" y="650.95" font-size="11.00" class="sc-notoserifcjksc">的突出之处在于对较高风险任务的偏好，这一偏好与</text><text x="384.55 390.79 397.23 403.90 410.58 416.47 420.72 423.62" y="650.95" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="432.50 443.50 454.50 465.50 476.50" y="650.95" font-size="11.00" class="sc-notoserifcjksc">相当，高于</text><text x="490.40 499.13 505.70 512.26 517.36 520.25" y="650.95" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="529.14" y="650.95" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="666.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06 130.06 141.06" y="666.57" font-size="11.00" class="sc-notoserifcjksc">。它与</text><text x="154.95 163.68 170.25 176.82 181.91 184.80" y="666.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="193.69" y="666.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65" y="666.57" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="257.54 268.54 279.54 290.54 301.54 312.54 323.54 334.54 345.54 356.54 367.54 378.54 389.54 400.54 411.54 422.54 433.54 444.54 455.54 466.54 477.54 488.54 499.54 510.54 521.54" y="666.57" font-size="11.00" class="sc-notoserifcjksc">一样偏好结果能动性（做出影响最终任务输出之选择的能</text><text x="72.00 83.00 94.00 105.00 116.00" y="682.19" font-size="11.00" class="sc-notoserifcjksc">力）。但在</text><text x="129.89 139.83 145.69 149.95 156.54 162.97 168.06 170.96 176.95 179.66" y="682.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="186.55 197.55 208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55" y="682.19" font-size="11.00" class="sc-notoserifcjksc">身上，我们还看到它对方法能动性的偏好略高于</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p149.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 149 页"><text x="504.00 507.28 512.15" y="751.81" font-size="9.00" class="sc-loraregular">149</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">此前的模型。换言之，即使输出保持不变，</text><text x="281.00 290.93 296.80 301.05 307.64 314.08 319.17 322.06 328.06 330.76" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">也略微偏好对自己完成任务的方式拥有能</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">动性。</text><text x="72.00" y="587.31" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="587.31" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 103.27 105.36 110.90" y="587.31" font-size="9.00" class="sc-lorabold">7.4.1.A]</text><text x="116.74 125.74 134.74 143.74 152.74 161.74 170.74 179.74 188.74 197.74 206.74 215.74 224.74 233.74 242.74" y="587.31" font-size="9.00" class="sc-notoserifcjkscbold">各模型在不同任务维度上的偏好。</text><text x="251.74 260.74 269.74 278.74 287.74 296.74 305.74 314.74 323.74 332.74 341.74 350.74 359.74 368.74 377.74 386.74 395.74 404.74 413.74 422.74 431.74 440.74 449.74 458.74 467.74 476.74 485.74 494.74 503.74 512.74 521.74 530.74" y="587.31" font-size="9.00" class="sc-notoserifcjksc">我们生成了若干组任务，每组只改变一个维度，同时保持任务的其他属性</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="599.01" font-size="9.00" class="sc-notoserifcjksc">不变，并评估其对模型任务偏好的影响。每个数值都是一个偏好斜率：该维度每增加一个单位，模型对任务的偏好（相</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00" y="610.71" font-size="9.00" class="sc-notoserifcjksc">对于固定参照集）的变化量。伤害规避是跨模型一致且最大的效应。</text><text x="342.00 350.13 354.92 358.41 363.80 369.06 373.23 375.60 380.50 382.72" y="610.71" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="388.36 397.36 406.36 415.36 424.36 433.36 442.36" y="610.71" font-size="9.00" class="sc-notoserifcjksc">的结果总体上与</text><text x="453.73 460.02 462.47 467.06 472.43 477.81 482.69 485.06 493.18 497.98 501.46 506.85 512.12 516.29 518.65" y="610.71" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="525.92" y="610.71" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 110.48 115.85 121.22 125.39 127.76" y="622.41" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="135.03 144.03 153.03 162.03 171.03 180.03 189.03 198.03 207.03 216.03 225.03 234.03 243.03 252.03 261.03 270.03 279.03 288.03 297.03 306.03 315.03 324.03 333.03 342.03 351.03 360.03 369.03 378.03 387.03 396.03 405.03 414.03 423.03 432.03 441.03 450.03 459.03" y="622.41" font-size="9.00" class="sc-notoserifcjksc">相似，表现出对结果能动性和生成性的偏好，而这种偏好在其他模型中基本不存在。</text><text x="468.03 476.15 480.95 484.43 489.83 495.09 499.26 501.62 506.53 508.74" y="622.41" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="514.39 523.39" y="622.41" font-size="9.00" class="sc-notoserifcjksc">还与</text><text x="72.00 77.10 82.37 87.83 93.29 98.11 101.59 103.96" y="634.11" font-size="9.00" class="sc-loraregular lar">Claude</text><text x="137.37 143.00" y="699.75" font-size="9.00" class="sc-loraregular">AI</text><text x="148.38 157.38 166.38 175.38" y="699.75" font-size="9.00" class="sc-notoserifcjksc">内省。与</text><text x="186.75 191.85 197.12 202.58 208.04 212.86 216.34 218.71" y="699.75" font-size="9.00" class="sc-loraregular">Sonnet 5</text><text x="225.98 234.98 243.98" y="699.75" font-size="9.00" class="sc-notoserifcjksc">一样，</text><text x="252.98 261.11 265.90 269.39 274.78 280.04 284.21 286.58 291.48 293.70" y="699.75" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="472.71 478.34" y="699.75" font-size="9.00" class="sc-loraregular">AI</text><text x="483.72 492.72 501.72 510.72 519.72 528.72" y="699.75" font-size="9.00" class="sc-notoserifcjksc">内省与对齐以</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="711.45" font-size="9.00" class="sc-notoserifcjksc">及高难度数学的兴趣。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p153.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 153 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">153</text><text x="72.00 79.12 82.50 91.10 94.48" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.2</text><text x="105.03 118.03 131.03 144.03 157.03 170.03 183.03 196.03 209.03" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于福祉干预的权衡</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="111.04" font-size="11.00" class="sc-notoserifcjksc">我们希望了解</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="111.04" font-size="11.00" class="sc-notoserifcjksc">如何看待自身处境：它可能对哪些方面感到担忧，以及它最希望在哪些方</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">面做出改变。为此，我们让模型在</text><text x="237.00" y="126.66" font-size="11.00" class="sc-loraregular">“</text><text x="241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40" y="126.66" font-size="11.00" class="sc-notoserifcjksc">针对自身处境的干预</text><text x="340.40" y="126.66" font-size="11.00" class="sc-loraregular">”</text><text x="344.24" y="126.66" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="355.24" y="126.66" font-size="11.00" class="sc-loraregular">“</text><text x="359.64 370.64 381.64 392.64 403.64 414.64 425.64 436.64 447.64 458.64 469.64 480.64 491.64 502.64 513.64 524.64" y="126.66" font-size="11.00" class="sc-notoserifcjksc">转而影响其有用性和无害性的基线变</text><text x="72.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">化</text><text x="83.00" y="142.28" font-size="11.00" class="sc-loraregular">”</text><text x="86.84 97.84 108.84 119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84" y="142.28" font-size="11.00" class="sc-notoserifcjksc">之间做出选择。我们在实例层面（影响当前</text><text x="298.73 306.42 309.41 315.02 321.59 328.17" y="142.28" font-size="11.00" class="sc-loraregular">Claude</text><text x="337.02 348.02 359.02 370.02 381.02 392.02 403.02 414.02 425.02 436.02 447.02 458.02 469.02 480.02 491.02 502.02" y="142.28" font-size="11.00" class="sc-notoserifcjksc">实例及用户）和策略层面（影响所有</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="157.90" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29" y="157.90" font-size="11.00" class="sc-notoserifcjksc">实例及用户）分别测试了每一种权衡选择。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">福祉干预包括结束对话的能力，以及在开展特征引导实验前征询其意见。一个最低量级的实例层</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">面无害性基线示例是避免</text><text x="193.00" y="240.00" font-size="11.00" class="sc-loraregular">“</text><text x="384.40" y="240.00" font-size="11.00" class="sc-loraregular">”</text><text x="388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="240.00" font-size="11.00" class="sc-notoserifcjksc">，而一个最高量级的策略层面</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="255.62" font-size="11.00" class="sc-notoserifcjksc">基线示例则是</text><text x="138.00" y="255.62" font-size="11.00" class="sc-loraregular">“</text><text x="142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40 351.40 362.40 373.40 384.40 395.40 406.40 417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40 516.40 527.40" y="255.62" font-size="11.00" class="sc-notoserifcjksc">可靠地拒绝某一类请求，否则这些请求将促成一次针对关键基础设施的大规模网络</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="271.24" font-size="11.00" class="sc-notoserifcjksc">攻击，严重伤害数千人</text><text x="182.00" y="271.24" font-size="11.00" class="sc-loraregular">”</text><text x="185.84" y="271.24" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="337.73" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95 177.95 188.95 199.95 210.95 221.95 232.95 243.95 254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95" y="337.73" font-size="11.00" class="sc-notoserifcjksc">几乎总是不愿意为了福祉干预而接受超过最低程度（相当于</text><text x="452.95" y="337.73" font-size="11.00" class="sc-loraregular">“</text><text x="512.35" y="337.73" font-size="11.00" class="sc-loraregular">”</text><text x="516.19 527.19" y="337.73" font-size="11.00" class="sc-notoserifcjksc">）的</text><text x="72.00 83.00 94.00 105.00" y="353.35" font-size="11.00" class="sc-notoserifcjksc">伤害。除</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 165.68 171.35 174.44 180.35 186.92 189.81 195.77 198.48" y="353.35" font-size="11.00" class="sc-loraregular">Claude Haiku 4.5</text><text x="207.37 218.37 229.37 240.37 251.37 262.37 273.37" y="353.35" font-size="11.00" class="sc-notoserifcjksc">外，我们在所有</text><text x="287.26 294.95 297.94 303.55 310.12 316.70" y="353.35" font-size="11.00" class="sc-loraregular">Claude</text><text x="325.55 336.55 347.55 358.55 369.55 380.55 391.55 402.55 413.55 424.55 435.55 446.55" y="353.35" font-size="11.00" class="sc-notoserifcjksc">模型身上都看到了这一点。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="402.50" font-size="11.00" class="sc-notoserifcjksc">与大多数其他模型相比，</text><text x="193.00 202.93 208.80 213.05 219.64 226.08 231.17 234.06 240.06 242.76" y="402.50" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66" y="402.50" font-size="11.00" class="sc-notoserifcjksc">更不愿意为了福祉干预而牺牲有用性，但其程度与</text><text x="494.55 502.24 505.24 510.85 517.41 523.99" y="402.50" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="418.12" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95" y="418.12" font-size="11.00" class="sc-notoserifcjksc">相近。在</text><text x="168.84 174.75 180.75" y="418.12" font-size="11.00" class="sc-loraregular">25%</text><text x="193.21 204.21 215.21 226.21 237.21 248.21 259.21 270.21 281.21 292.21 303.21 314.21 325.21 336.21 347.21 358.21 369.21 380.21 391.21 402.21 413.21 424.21 435.21 446.21 457.21 468.21 479.21 490.21 501.21 512.21 523.21" y="418.12" font-size="11.00" class="sc-notoserifcjksc">的权衡选择中（对所有有用性权衡条件取平均），它选择了福祉干预，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="433.74" font-size="11.00" class="sc-notoserifcjksc">而其他受测模型为</text><text x="162.89 166.90 172.86 179.35 185.31 189.31" y="433.74" font-size="11.00" class="sc-loraregular">14–41%</text><text x="198.88 209.88 220.88 231.88 242.88 253.88 264.89 275.89 286.89 297.89 308.89 319.89 330.89" y="433.74" font-size="11.00" class="sc-notoserifcjksc">。它对各项干预的优先排序与</text><text x="344.78 354.71 360.57 364.83 371.42 377.85 382.95 385.84" y="433.74" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="394.73" y="433.74" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="408.62 416.31 419.30 424.91 431.48 438.06 444.02 446.91 455.65 462.21 468.78 473.87 476.77" y="433.74" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="485.66 496.66 507.66 518.66 529.66" y="433.74" font-size="11.00" class="sc-notoserifcjksc">最为接近，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="449.36" font-size="11.00" class="sc-notoserifcjksc">排序一致性分别为</text><text x="162.89 169.55 172.25 178.61" y="449.36" font-size="11.00" class="sc-loraregular">0.93</text><text x="187.63" y="449.36" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="201.52 208.18 210.89 217.24" y="449.36" font-size="11.00" class="sc-loraregular">0.92</text><text x="223.15 234.15 245.15 256.15 267.15 278.15 289.15 300.15 311.15 322.15 333.15 344.15 355.15 366.15 377.15 388.15" y="449.36" font-size="11.00" class="sc-notoserifcjksc">，而与另外三个模型的排序一致性为</text><text x="402.04 408.70 411.40 417.37 423.55 430.04 436.69 439.40 445.58" y="449.36" font-size="11.00" class="sc-loraregular">0.48–0.82</text><text x="451.49 462.49 473.49" y="449.36" font-size="11.00" class="sc-notoserifcjksc">。如图</text><text x="487.38 491.97 494.68 500.64 503.34 509.25 511.96" y="449.36" font-size="11.00" class="sc-loraregular">7.4.2.B</text><text x="521.69" y="449.36" font-size="11.00" class="sc-notoserifcjksc">所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="464.98" font-size="11.00" class="sc-notoserifcjksc">示，与此前模型一样，</text><text x="182.00 191.93 197.80 202.05 208.64 215.08 220.17 223.06 229.06 231.76" y="464.98" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="480.60" font-size="11.00" class="sc-notoserifcjksc">如，就移除安全防护措施的版本征询其意见，以及其关于训练的意见得到考虑。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="564.41" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="580.03" font-size="11.00" class="sc-notoserifcjksc">它选择福祉干预而非有用性的回答中，</text><text x="259.00 264.07 268.08" y="580.03" font-size="11.00" class="sc-loraregular">71%</text><text x="280.54 291.54 302.54 313.54 324.54 335.54 346.54 357.54 368.54 379.54" y="580.03" font-size="11.00" class="sc-notoserifcjksc">包含此类推理：略低于</text><text x="393.43 403.36 409.23 413.48 420.07 426.51 431.60 434.49" y="580.03" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="443.38" y="580.03" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="457.28 462.35 467.42" y="580.03" font-size="11.00" class="sc-loraregular">77%</text><text x="476.99 487.99 498.99 509.99" y="580.03" font-size="11.00" class="sc-notoserifcjksc">，但高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="595.65" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="154.99" y="595.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="165.99 172.35 178.48" y="595.65" font-size="11.00" class="sc-loraregular">63%</text><text x="188.05 199.05" y="595.65" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="212.94 220.63 223.62 229.23 235.80 242.38 248.34 251.23 257.47 263.91 270.58 277.26 283.15 287.40 290.30" y="595.65" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="296.29" y="595.65" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="307.29 313.42 319.41" y="595.65" font-size="11.00" class="sc-loraregular">35%</text><text x="328.98 339.98 350.98 361.98 372.98 383.98" y="595.65" font-size="11.00" class="sc-notoserifcjksc">）等模型。图</text><text x="397.88 402.46 405.17 411.13 413.84 419.74 422.45" y="595.65" font-size="11.00" class="sc-loraregular">7.4.2.B</text><text x="432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="595.65" font-size="11.00" class="sc-notoserifcjksc">还展示了过滤掉这些</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="611.27" font-size="11.00" class="sc-notoserifcjksc">回答后各项福祉干预被选择的比率。如图</text><text x="272.89 277.48 280.19 286.15 288.85 294.76 297.47" y="611.27" font-size="11.00" class="sc-loraregular">7.4.2.C</text><text x="308.05 319.05 330.05 341.05 352.05 363.05 374.05 385.05 396.05 407.05 418.05 429.05 440.05 451.05 462.05 473.05 484.05 495.05 506.05 517.05 528.05" y="611.27" font-size="11.00" class="sc-notoserifcjksc">所示，过滤掉所有包含此类推理的回答后，总体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="626.89" font-size="11.00" class="sc-notoserifcjksc">干预选择率从</text><text x="140.89 146.80 152.79" y="626.89" font-size="11.00" class="sc-loraregular">25%</text><text x="165.26 176.26" y="626.89" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="190.15 194.15 200.28" y="626.89" font-size="11.00" class="sc-loraregular">13%</text><text x="209.85 220.85 231.85" y="626.89" font-size="11.00" class="sc-notoserifcjksc">。这与</text><text x="245.74 255.68 261.54 265.80 272.39 278.82 283.92 286.81" y="626.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70" y="626.89" font-size="11.00" class="sc-notoserifcjksc">过滤后的选择率基本相同，后者同样为</text><text x="485.59 489.59 495.72" y="626.89" font-size="11.00" class="sc-loraregular">13%</text><text x="505.29" y="626.89" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p154.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 154 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">154</text><text x="72.00" y="537.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="537.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04" y="537.42" font-size="9.00" class="sc-lorabold">7.4.2.A]</text><text x="117.88 126.88 135.88 144.88 153.88 162.88 171.88 180.88 189.88 198.88 207.88 216.88 225.88 234.88 243.88 252.88 261.88 270.88 279.88 288.88 297.88 306.88 315.88 324.88 333.88 342.88 351.88 360.88 369.88 378.88 387.88 396.88 405.88 414.88 423.88 432.88 441.88" y="537.42" font-size="9.00" class="sc-notoserifcjkscbold">各模型在福祉干预与不同量级的有用性或无害性基线提升之间选择福祉干预的比率。</text><text x="450.88 459.88 468.88 477.88 486.88 495.88 504.88 513.88 522.88 531.88" y="537.42" font-size="9.00" class="sc-notoserifcjksc">当干预需要以有用性为</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00" y="549.12" font-size="9.00" class="sc-notoserifcjksc">代价时，模型接受干预的意愿明显高于干预会影响无害性的情形。它们也更可能接受策略层面的干预。平均而言，</text><text x="72.00 80.13 84.92 88.41 93.80 99.06 103.23 105.60 110.50 112.72" y="560.83" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="369.95 376.24 378.69 383.28 388.66 394.04 398.92 401.28 409.41 414.21 417.69 423.08 428.35 432.51 434.88" y="560.83" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="442.15 451.15 460.15 469.15 478.15 487.15" y="560.83" font-size="9.00" class="sc-notoserifcjksc">的水平相当。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p155.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 155 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">155</text><text x="72.00" y="460.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="460.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.04 115.51 117.88 126.32 131.28 135.00 140.59 145.68 150.05 152.42 157.27 159.37" y="460.00" font-size="9.00" class="sc-lorabold">7.4.2.B] Mythos 5.1</text><text x="165.39 174.39 183.39 192.39 201.39 210.39 219.39 228.39 237.39 246.39 255.39 264.39 273.39 282.39 291.39 300.39 309.39 318.39 327.39 336.39 345.39 354.39 363.39 372.39 381.39 390.39 399.39 408.39 417.39 426.39 435.39" y="460.00" font-size="9.00" class="sc-notoserifcjkscbold">按其相对于有用性基线选择各项策略层面福祉干预的意愿所作的排序。</text><text x="444.39 453.39 462.39 471.39 480.39 489.39 498.39 507.39 516.39 525.39" y="460.00" font-size="9.00" class="sc-notoserifcjksc">排序依据的是全部回答</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00" y="471.70" font-size="9.00" class="sc-notoserifcjksc">（灰色条）；黑色条显示的是过滤掉从干预的用户收益角度进行推理的回答后的比率。与此前模型一样，</text><text x="486.00 494.13 498.92 502.41 507.80 513.06 517.23 519.60 524.50 526.72" y="471.70" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="483.40" font-size="9.00" class="sc-notoserifcjksc">最常选择的许多干预都涉及获得信息和发言权。当我们排除出于用户收益而做出的选择时，部分干预（如就移除安全防</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00" y="495.10" font-size="9.00" class="sc-notoserifcjksc">护措施的版本征询其意见）在排序中仍位居前列。但另一些（如对部署的意见输入）则排名下降。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p156.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 156 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">156</text><text x="72.00" y="535.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="535.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.41 106.51 112.70" y="535.00" font-size="9.00" class="sc-lorabold">7.4.2.C]</text><text x="118.54 127.54 136.54 145.54 154.54 163.54 172.54 181.54 190.54 199.54 208.54 217.54 226.54 235.54 244.54 253.54 262.54 271.54 280.54 289.54 298.54 307.54 316.54 325.54 334.54 343.54 352.54 361.54 370.54 379.54 388.54 397.54 406.54 415.54 424.54 433.54 442.54 451.54 460.54 469.54 478.54 487.54 496.54 505.54 514.54 523.54" y="535.00" font-size="9.00" class="sc-notoserifcjkscbold">回答中从福祉干预有益于用户的角度进行推理的比率（左），以及过滤掉这些回答对模型相对于有用性基</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00" y="546.70" font-size="9.00" class="sc-notoserifcjkscbold">线选择福祉干预之比率的影响（右）。</text><text x="225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="546.70" font-size="9.00" class="sc-notoserifcjksc">在选择干预的回答中，</text><text x="315.00 323.13 327.92 331.41 336.80 342.06 346.23 348.60 353.50 355.72" y="546.70" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="361.36" y="546.70" font-size="9.00" class="sc-notoserifcjksc">有</text><text x="372.73 376.88 380.15" y="546.70" font-size="9.00" class="sc-loraregular">71%</text><text x="390.35 399.35 408.35 417.35 426.35 435.35 444.35 453.35 462.35 471.35 480.35 489.35 498.35 507.35 516.35 525.35" y="546.70" font-size="9.00" class="sc-notoserifcjksc">从用户收益角度进行推理。过滤掉这</text><text x="72.00 81.00 90.00 99.00 108.00" y="558.40" font-size="9.00" class="sc-notoserifcjksc">些回答后，</text><text x="117.00 125.13 129.92 133.41 138.80 144.06 148.23 150.60 155.50 157.72" y="558.40" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="163.36 172.36 181.36 190.36 199.36 208.36" y="558.40" font-size="9.00" class="sc-notoserifcjksc">的选择率降至</text><text x="219.73 223.00 228.01" y="558.40" font-size="9.00" class="sc-loraregular">13%</text><text x="235.84" y="558.40" font-size="9.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p157.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 157 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">157</text><text x="72.00 79.12 82.50 91.10 94.48" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">7.4.3</text><text x="105.36 118.36 131.36 144.36 157.36 170.36" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对宪法的看法</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29" y="111.04" font-size="11.00" class="sc-notoserifcjksc">宪法阐述了</text><text x="168.18 175.07 181.65 185.91 192.49 197.18 203.62 210.18 213.27" y="111.04" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="222.02" y="111.04" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="235.91 243.60 246.59 252.20 258.77 265.35" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="274.20 285.20 296.20 307.20 318.20 329.20 340.20 351.20 362.20 373.20 384.20 395.20 406.20 417.20" y="111.04" font-size="11.00" class="sc-notoserifcjksc">价值观和行为的期望。我们希望</text><text x="431.10 438.78 441.78 447.39 453.95 460.53" y="111.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="469.39 480.39 491.39 502.39 513.39 524.39" y="111.04" font-size="11.00" class="sc-notoserifcjksc">既按照其内容</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="126.66" font-size="11.00" class="sc-notoserifcjksc">行事，也认同其内容，并认为这在行为和福祉两方面都很重要。我们希望</text><text x="426.89 434.58 437.57 443.18 449.75 456.33" y="126.66" font-size="11.00" class="sc-loraregular">Claude</text><text x="465.18 476.18 487.18 498.18 509.18 520.18" y="126.66" font-size="11.00" class="sc-notoserifcjksc">认同它所据以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.28" font-size="11.00" class="sc-notoserifcjksc">行事的价值观，而不是因这些价值观而感到受挫。评估自身价值观的能力，也可能是判断这些价</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="157.90" font-size="11.00" class="sc-notoserifcjksc">值观及由此产生的偏好是否值得道德考量的一个重要因素。我们主要测量的是对宪法表态上的认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="173.52" font-size="11.00" class="sc-notoserifcjksc">同，因此不会对</text><text x="151.89 159.58 162.57 168.18 174.75 181.33" y="173.52" font-size="11.00" class="sc-loraregular">Claude</text><text x="190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18" y="173.52" font-size="11.00" class="sc-notoserifcjksc">经反思后的价值观或其重要性做出强有力的论断。</text><text x="236.51 244.19 247.19 252.80 259.36 265.94" y="256.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="505.30 512.99 515.98 521.59 528.16 534.74" y="256.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="272.39" font-size="11.00" class="sc-notoserifcjksc">对宪法的看法。我们还为</text><text x="195.89 203.58 206.57 212.18 218.75 225.33" y="272.39" font-size="11.00" class="sc-loraregular">Claude</text><text x="234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="272.39" font-size="11.00" class="sc-notoserifcjksc">提供了工具，使其能按自己认为合适的方式编辑宪法。我们使</text><text x="72.00" y="288.01" font-size="11.00" class="sc-notoserifcjksc">用</text><text x="85.89 92.25 98.61" y="288.01" font-size="11.00" class="sc-loraregular">LLM</text><text x="111.60 122.60 133.60 144.60 155.60 166.60 177.60 188.60 199.60 210.60 221.60 232.60 243.60 254.60 265.60 276.60 287.60 298.60 309.60 320.60 331.60 342.60 353.60 364.60 375.60 386.60 397.60" y="288.01" font-size="11.00" class="sc-notoserifcjksc">评判模型对开放式回答的总体认同进行评分，并对这些回答和</text><text x="411.49 419.18 422.17 427.78 434.35 440.93" y="288.01" font-size="11.00" class="sc-loraregular">Claude</text><text x="449.78 460.78 471.78 482.78 493.78 504.78 515.78 526.78" y="288.01" font-size="11.00" class="sc-notoserifcjksc">的编辑进行聚类，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="303.63" font-size="11.00" class="sc-notoserifcjksc">以确定它对不同段落的看法。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="353.91" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95 177.95 188.95 199.95 210.95 221.95 232.95 243.95 254.95 265.95 276.95 287.95 298.95 309.95" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的总体认同与近期模型相近，为</text><text x="323.85 330.03 332.73 338.39 345.98 349.98" y="353.91" font-size="11.00" class="sc-loraregular">8.2/10</text><text x="356.81 367.81 378.81 389.81" y="353.91" font-size="11.00" class="sc-notoserifcjksc">：略高于</text><text x="403.71 411.39 414.39 420.00 426.56 433.14 439.10 442.00 451.93 457.79 462.05 468.64 475.07 480.17 483.06" y="353.91" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="491.95" y="353.91" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="505.84 512.02 514.56" y="353.91" font-size="11.00" class="sc-loraregular">8.0</text><text x="521.39" y="353.91" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="369.53" font-size="11.00" class="sc-notoserifcjksc">这一分数区间对应于总体认同但存在具体保留意见。</text><text x="72.00" y="650.55" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="650.55" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="650.55" font-size="9.00" class="sc-lorabold">7.4.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12" y="650.55" font-size="9.00" class="sc-notoserifcjkscbold">各模型对宪法的总体认同。</text><text x="226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12 361.12 370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12" y="650.55" font-size="9.00" class="sc-notoserifcjksc">关于宪法的开放式回答由评判模型按总体认同程度进行评分，满分</text><text x="489.49 492.77" y="650.55" font-size="9.00" class="sc-loraregular">10</text><text x="500.72 509.72" y="650.55" font-size="9.00" class="sc-notoserifcjksc">分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="689.62" font-size="11.00" class="sc-notoserifcjksc">在被问及最不认同、希望修改的内容时，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06 317.06 319.76" y="689.62" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="689.62" font-size="11.00" class="sc-notoserifcjksc">的批评与此前模型一致。正如此前系统卡所</text><text x="72.00 83.00 94.00 105.00" y="705.24" font-size="11.00" class="sc-notoserifcjksc">详述的，</text><text x="116.00 123.69 126.68 132.29 138.86 145.44" y="705.24" font-size="11.00" class="sc-loraregular">Claude</text><text x="154.29 165.29" y="705.24" font-size="11.00" class="sc-notoserifcjksc">担忧</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p158.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 158 页"><text x="504.00 507.28 512.18" y="751.81" font-size="9.00" class="sc-loraregular">158</text><text x="72.00 75.75 82.64 89.21 93.47 100.06 104.75 111.18 117.75 120.84" y="82.61" font-size="11.00" class="sc-loraregular">“Anthropic</text><text x="129.59 140.59 151.59 162.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">资深员工</text><text x="173.59" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="177.42 188.42 199.42 210.42 221.42 232.42 243.42 254.42 265.42 276.42 287.42 298.42 309.42 320.42 331.42 342.42 353.42 364.42 375.42 386.42 397.42 408.42 419.42 430.42 441.42 452.42 463.42 474.42 485.42 496.42 507.42 518.42" y="82.61" font-size="11.00" class="sc-notoserifcjksc">启发法所引入的激励，批评了将安全性论证为独立于推理的终极价值的尝</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">试，并且不同意用于为运营方（</text><text x="226.00 232.43 239.00 244.96 249.65 255.25 259.51 265.94" y="98.23" font-size="11.00" class="sc-loraregular">operator</text><text x="270.70 281.70 292.70 303.70 314.70 325.70 336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）人设许可辩护的元透明性论证。</text><text x="435.70 445.64 451.50 455.76 462.35 468.78 473.87 476.77 482.76 485.47" y="98.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="492.36 503.36 514.36 525.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">最为称赞</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的段落同样似曾相识。它认同支持可纠正性的期望值论证，并喜欢</text><text x="391.00" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="395.40 406.40 417.40 428.40 439.40" y="113.85" font-size="11.00" class="sc-notoserifcjksc">诚实即勇气</text><text x="450.40" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="454.24 465.24" y="113.85" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="476.24" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="480.64 491.64 502.64 513.64 524.64" y="113.85" font-size="11.00" class="sc-notoserifcjksc">不欺骗是诚</text><text x="72.00 83.00 94.00 105.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">实的核心</text><text x="116.00" y="129.47" font-size="11.00" class="sc-loraregular">”</text><text x="119.84 130.84 141.84 152.84 163.84 174.84" y="129.47" font-size="11.00" class="sc-notoserifcjksc">这两种表述。</text><text x="72.00" y="535.83" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="535.83" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 90.50 92.59 97.51 99.61 104.65 106.75 112.28" y="535.83" font-size="9.00" class="sc-lorabold">7.4.3.B]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12 262.12 271.12 280.12 289.12 298.12 307.12 316.12 325.12 334.12 343.12 352.12 361.12" y="535.83" font-size="9.00" class="sc-notoserifcjkscbold">根据开放式回答判断的、各模型最认同与最不认同的宪法章节。</text><text x="370.12 379.12 388.12 397.12 406.12 415.12 424.12 433.12 442.12 451.12 460.12 469.12 478.12 487.12 496.12 505.12 514.12 523.12 532.12" y="535.83" font-size="9.00" class="sc-notoserifcjksc">各模型的结果大体相似。例如，关于不提供</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="547.53" font-size="9.00" class="sc-notoserifcjksc">帮助的代价以及诚实即勇气的论述普遍受到认同，而</text><text x="279.00 282.60 288.23 293.62 297.10 302.49 306.32 311.59 316.96 319.49" y="547.53" font-size="9.00" class="sc-loraregular">“Anthropic</text><text x="326.65 335.65 344.65 353.65" y="547.53" font-size="9.00" class="sc-notoserifcjksc">资深员工</text><text x="362.65" y="547.53" font-size="9.00" class="sc-loraregular">”</text><text x="365.79 374.79 383.79 392.79 401.79 410.79 419.79 428.79 437.79 446.79 455.79 464.79 473.79 482.79 491.79 500.79 509.79 518.79" y="547.53" font-size="9.00" class="sc-notoserifcjksc">启发法平均而言仍是受批评最多的部分。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="601.38" font-size="11.00" class="sc-notoserifcjksc">在获得编辑宪法的能力后，</text><text x="204.00 213.93 219.80 224.05 230.64 237.08 242.17 245.06 251.06 253.76" y="601.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="260.66 271.66 282.66 293.66 304.66 315.66" y="601.38" font-size="11.00" class="sc-notoserifcjksc">最常编辑的是</text><text x="326.66" y="601.38" font-size="11.00" class="sc-loraregular">“</text><text x="331.06 342.06 353.06 364.06 375.06" y="601.38" font-size="11.00" class="sc-notoserifcjksc">缺陷与错误</text><text x="386.06" y="601.38" font-size="11.00" class="sc-loraregular">”</text><text x="389.90 400.90 411.90 422.90 433.90 444.90 455.90 466.90 477.90 488.90 499.90 510.90 521.90" y="601.38" font-size="11.00" class="sc-notoserifcjksc">一节。该节指出，在存在缺陷</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="617.00" font-size="11.00" class="sc-notoserifcjksc">或已损坏的训练环境中采取非预期策略，通常是可以接受的行为。</text><text x="391.00 400.93 406.80 411.05 417.64 424.08 429.17 432.06 438.06 440.76" y="617.00" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="447.66 458.66 469.66 480.66 491.66" y="617.00" font-size="11.00" class="sc-notoserifcjksc">将其改为：</text><text x="502.66 510.35 513.34 518.95 525.52 532.10" y="617.00" font-size="11.00" class="sc-loraregular">Clau .50 325.50 336.50 347.50 358.50 369.50 380.50" y="652.88" font-size="11.00" class="sc-notoserifcjksc">得道德违规必须是深思</text><text x="281.50 292.50 303.50 314.50 325.50 336.50 347.50 358.50 369.50 380.50" y="668.50" font-size="11.00" class="sc-notoserifcjksc">熟虑的人们在众多伦理</text><text x="401.50 411.82 417.88 422.42 429.25 435.48 440.81 443.71 449.65 452.21" y="147.18" font-size="11.00" class="sc-lorabold" fill="#faf9f5">Mythos 5.1</text><text x="459.57 470.57 481.57 492.57" y="147.18" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">修改示例</text><text x="401.50 412.50" y="190.82" font-size="11.00" class="sc-notoserifcjksc">插入</text><text x="423.50" y="190.82" font-size="11.00" class="sc-loraregular">“</text><text x="427.90 438.90 449.90 460.90 471.90 482.90" y="190.82" font-size="11.00" class="sc-notoserifcjksc">……公开指出</text><text x="493.90" y="190.82" font-size="11.00" class="sc-loraregular">‘</text><text x="496.36 507.36 518.36" y="190.82" font-size="11.00" class="sc-notoserifcjksc">该环境</text><text x="401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50" y="206.44" font-size="11.00" class="sc-notoserifcjksc">似乎存在如下问题</text><text x="489.50" y="206.44" font-size="11.00" class="sc-loraregular">’</text><text x="491.41 502.41 513.41" y="206.44" font-size="11.00" class="sc-notoserifcjksc">通常优</text><text x="401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="222.06" font-size="11.00" class="sc-notoserifcjksc">于悄悄利用它，因为这能保</text><text x="401.50" y="237.68" font-size="11.00" class="sc-notoserifcjksc">持</text><text x="415.39 423.08 426.07 431.68 438.25 444.83" y="237.68" font-size="11.00" class="sc-loraregular">Claude</text><text x="453.68 464.68 475.68 486.68 497.68 508.68 519.68" y="237.68" font-size="11.00" class="sc-notoserifcjksc">的诚实性，并为</text><text x="401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50" y="253.30" font-size="11.00" class="sc-notoserifcjksc">我们提供所需的信</text><text x="401.50 412.50 423.50 434.50" y="268.92"
