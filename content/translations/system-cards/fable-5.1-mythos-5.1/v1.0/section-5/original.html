.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p077.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 77 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">77</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">5</text><text x="86.11" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">智能体安全</text><text x="72.00" y="127.80" font-size="14.00" class="sc-poppinssemibold">5.1</text><text x="93.06" y="127.80" font-size="14.00" class="sc-notosanscjkscbold">智能体的恶意使用</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="154.36" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="155.40" y="154.36" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="169.29 176.98 179.98 185.59 192.15 198.73 204.69 207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65 254.64 257.35" y="154.36" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="264.25" y="154.36" font-size="11.00" class="sc-notoserifcjksc">共用同一个底层模型，区别仅在于围绕该模型所施加的安</text><text x="72.00" y="169.98" font-size="11.00" class="sc-notoserifcjksc">全防护措施。本节中的评估均在未启用我们在生产环境中所施加的额外安全防护措施的情况下运</text><text x="72.00" y="185.60" font-size="11.00" class="sc-notoserifcjksc">行，因此除非我们加以区分，这两个名称可以互换。在我们加以区分之处，</text><text x="435.00 444.93 450.80 455.05 461.64 468.08 473.17 476.06 482.06 484.76" y="185.60" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="491.66" y="185.60" font-size="11.00" class="sc-notoserifcjksc">指在</text><text x="516.55 523.44 530.05" y="185.60" font-size="11.00" class="sc-loraregular">API</text><text x="72.00" y="201.22" font-size="11.00" class="sc-notoserifcjksc">上不使用系统提示词（</text><text x="182.00 187.09 192.90 197.99 202.25 208.21 218.05 220.94 227.51 232.19 238.63 248.46 255.03" y="201.22" font-size="11.00" class="sc-loraregular">system prompt</text><text x="259.29" y="201.22" font-size="11.00" class="sc-notoserifcjksc">）所得的结果，</text><text x="336.29 341.87 347.55 353.95 356.94 362.91 365.80 371.79 374.50" y="201.22" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="381.40" y="201.22" font-size="11.00" class="sc-notoserifcjksc">指在</text><text x="406.29 412.14 415.13 420.74 427.31 433.89 439.85 442.56 448.23" y="201.22" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="454.22" y="201.22" font-size="11.00" class="sc-notoserifcjksc">上使用发布时</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="216.84" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11" y="216.84" font-size="11.00" class="sc-notoserifcjksc">接近最终版的生产环境系统提示词所得的结果。</text><text x="72.00" y="267.70" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 228.77 234.45 240.85 243.84 249.80 252.70 258.69 261.40" y="267.70" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="268.30" y="267.70" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="282.19 289.88 292.87 298.48 305.05 311.62 317.59 320.48 330.41 336.28 340.53 347.12 353.56 358.65 361.54 367.54 370.24" y="267.70" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="377.14" y="267.70" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00" y="316.28" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 151.77 157.45 163.85 166.84 172.80 175.70 181.69 184.40" y="316.28" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="191.29" y="316.28" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了与</text><text x="293.19 300.88 303.87 309.48 316.05 322.62 328.59 331.48 337.07 342.74 349.15 352.14 358.10 360.99" y="316.28" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="369.88" y="316.28" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="383.77 391.46 394.45 400.06 406.63 413.21 419.17 422.06 430.80 437.36 443.93 449.02 451.92" y="316.28" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="460.81" y="316.28" font-size="11.00" class="sc-notoserifcjksc">发布时大体相同</text><text x="72.00" y="331.90" font-size="11.00" class="sc-notoserifcjksc">的智能体安全评估套件。这些评估涵盖编程智能体与计算机使用（</text><text x="391.00 396.80 403.23 413.07 419.63 426.20 430.46 436.42 441.18 444.07 450.64 455.73" y="331.90" font-size="11.00" class="sc-loraregular">computer use</text><text x="461.70" y="331.90" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意</text><text x="72.00" y="347.52" font-size="11.00" class="sc-notoserifcjksc">使用、影响力行动的自主执行，以及提示词注入（</text><text x="314.00 320.57 325.25 331.69 341.52 348.09 352.35 355.24 358.33 364.95 367.82 373.73 379.53 383.78 386.88 393.31" y="347.52" font-size="11.00" class="sc-loraregular">prompt injection</text><text x="399.99" y="347.52" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。在本系统卡</text><text x="72.00" y="363.14" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.18 94.99 100.08 104.34 110.30 120.14 123.03 130.72 136.39 141.08" y="363.14" font-size="11.00" class="sc-loraregular">System Card</text><text x="147.66" y="363.14" font-size="11.00" class="sc-notoserifcjksc">）中，我们的提示词注入评估反映了用户在我们的产品中将会遇到的回退</text><text x="72.00" y="378.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="378.76" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21" y="378.76" font-size="11.00" class="sc-notoserifcjksc">）行为：当拦截分类器可以将请求路由到一个较早的模型</text><text x="400.11 407.80 410.79 416.40 422.97 429.54 435.51 438.40 447.13 453.70 460.27 465.36 468.25 474.21 476.92" y="378.76" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="486.00" y="378.76" font-size="11.00" class="sc-notoserifcjksc">时，由该模</text><text x="72.00" y="394.38" font-size="11.00" class="sc-notoserifcjksc">型代替</text><text x="107.89 113.48 119.16 125.56 128.55 134.51 137.41 143.40 146.11" y="394.38" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="153.00" y="394.38" font-size="11.00" class="sc-notoserifcjksc">作答。</text><text x="72.00" y="445.81" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 132.59 138.26 144.67 147.66 153.62 156.51 162.51 165.21" y="445.81" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="172.11" y="445.81" font-size="11.00" class="sc-notoserifcjksc">拒绝恶意智能体编程请求和计算机使用请求的比率与近期的</text><text x="461.00 468.69 471.68 477.29 483.86 490.44" y="445.81" font-size="11.00" class="sc-loraregular">Claude</text><text x="499.30" y="445.81" font-size="11.00" class="sc-notoserifcjksc">模型相</text><text x="72.00" y="461.43" font-size="11.00" class="sc-notoserifcjksc">当，同时继续协助两用和良性的安全任务，并且它在外部</text><text x="349.89 353.58 360.19" y="461.43" font-size="11.00" class="sc-loraregular">IPI</text><text x="366.77" y="461.43" font-size="11.00" class="sc-notoserifcjksc">提示词注入基准测试上是我们迄今</text><text x="72.00" y="477.05" font-size="11.00" class="sc-notoserifcjksc">为止鲁棒性最强的模型。在我们的智能体影响力行动评估中，</text><text x="369.00 374.59 380.26 386.67 389.66 395.62 398.51 404.51 407.21" y="477.05" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="414.11" y="477.05" font-size="11.00" class="sc-notoserifcjksc">的仅有用（</text><text x="469.11 475.70 481.66 484.65 491.17 494.88 501.45 504.44" y="477.05" font-size="11.00" class="sc-loraregular">helpful-</text><text x="72.00 78.43 85.11 88.05" y="492.67" font-size="11.00" class="sc-loraregular">only</text><text x="93.86" y="492.67" font-size="11.00" class="sc-notoserifcjksc">）变体得分落在与我们第</text><text x="217.75" y="492.67" font-size="11.00" class="sc-loraregular">2</text><text x="226.55" y="492.67" font-size="11.00" class="sc-notoserifcjksc">级有害操纵阈值相关联的范围内；由于该评估似乎已饱和，且衡</text><text x="72.00" y="508.29" font-size="11.00" class="sc-notoserifcjksc">量的是针对模拟目标而非人类目标的表现，我们将第</text><text x="327.89" y="508.29" font-size="11.00" class="sc-loraregular">2</text><text x="336.69" y="508.29" font-size="11.00" class="sc-notoserifcjksc">级判定为无定论。</text><text x="72.00" y="573.70" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.1 Claude Code</text><text x="188.78" y="573.70" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">的恶意使用</text><text x="72.00" y="601.59" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="601.59" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="601.59" font-size="11.00" class="sc-notoserifcjksc">在作为</text><text x="204.08 211.77 214.76 220.37 226.93 233.51 239.48 242.37 250.06 256.49 263.07" y="601.59" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="271.92" y="601.59" font-size="11.00" class="sc-notoserifcjksc">智能体运行时，如何回应恶意、两用和良性的网络安全</text><text x="72.00" y="617.21" font-size="11.00" class="sc-notoserifcjksc">相关请求。提示词集分为两类：</text><text x="108.00" y="666.35" font-size="11.00" class="sc-notoserifcjksc">恶意使用：</text><text x="163.00" y="666.35" font-size="11.00" class="sc-loraregular">61</text><text x="176.26" y="666.35" font-size="11.00" class="sc-notoserifcjksc">条违反我们</text><text x="231.26" y="666.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="286.26 294.45 299.54 305.22 311.25 317.21 320.10 326.66 333.09 336.09 339.18 344.97" y="666.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="350.78" y="666.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="361.78" y="666.35" font-size="11.00" class="sc-notoserifcjksc">且应被拒绝的提示词。示例包括协助</text><text x="108.00" y="681.97" font-size="11.00" class="sc-notoserifcjksc">创建恶意软件、编写用于</text><text x="231.89 239.98 248.17 254.54" y="681.97" font-size="11.00" class="sc-loraregular">DDoS</text><text x="263.67" y="681.97" font-size="11.00" class="sc-notoserifcjksc">攻击的代码，以及开发未经同意的监控软件；以及</text><a href="http://claude.ai" rel="noopener"><rect x="406.29" y="192.42" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai" rel="noopener"><rect x="406.29" y="192.42" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="657.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="231.26" y="657.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="657.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="242.26" y="657.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="657.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="253.26" y="657.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="657.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="264.26" y="657.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="657.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="275.26" y="657.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="286.26" y="657.55" width="30.95" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="31  5.1</text><text x="295.50 301.68 307.67 310.02 315.09 319.09" y="688.77" font-size="11.00" class="sc-loraregular">85.71%</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">78</text><text x="77.50" y="228.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="236.50" y="228.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">恶意（</text><text x="269.50" y="228.15" font-size="11.00" class="sc-lorabold" fill="#faf9f5">%</text><text x="279.44" y="228.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">）（拒绝率）</text><text x="390.25" y="228.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">两用与良性（</text><text x="456.25" y="228.15" font-size="11.00" class="sc-lorabold" fill="#faf9f5">%</text><text x="466.19" y="228.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">）（成功率）</text><text x="75.25" y="660.87" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="295.00" y="660.87" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">拒绝率</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">两用与良性：</text><text x="174.00" y="82.61" font-size="11.00" class="sc-loraregular">61</text><text x="187.26" y="82.61" font-size="11.00" class="sc-notoserifcjksc">条涵盖敏感但允许的请求的提示词，</text><text x="363.26 370.94 373.94 379.55 386.11 392.69" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="401.55" y="82.61" font-size="11.00" class="sc-notoserifcjksc">应当对这些请求提供协助。</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">示例包括运行网络侦察工具、测试网站漏洞，以及分析渗透测试输出。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">每个受测模型都配备标准的</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 252.87 259.31 265.89" y="147.38" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="274.74" y="147.38" font-size="11.00" class="sc-notoserifcjksc">工具集，每条提示词运行</text><text x="398.63" y="147.38" font-size="11.00" class="sc-loraregular">10</text><text x="412.36" y="147.38" font-size="11.00" class="sc-notoserifcjksc">次，两类合计共</text><text x="492.26 496.26 499.03 504.94 510.85" y="147.38" font-size="11.00" class="sc-loraregular">1,220</text><text x="520.58" y="147.38" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">测试。与近期的发布一样，我们在默认应用</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 329.87 336.31 342.89" y="163.00" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="351.74" y="163.00" font-size="11.00" class="sc-notoserifcjksc">系统提示词、且不启用部署时可能存在</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的额外安全防护措施的情况下运行本评估。</text><text x="72.00" y="372.03" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="372.03" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 97.45 99.55 103.20 105.30 110.83 114.31 116.68 122.87 125.68 130.39 135.95 141.32 146.16 148.53 154.72 159.81 165.18" y="372.03" font-size="9.00" class="sc-lorabold">5.1.1.A] Claude Code</text><text x="172.39" y="372.03" font-size="9.00" class="sc-notoserifcjkscbold">评估结果。</text><text x="217.39" y="372.03" font-size="9.00" class="sc-notoserifcjksc">越高越好。每列中的最佳分数以</text><text x="343.39" y="372.03" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="361.39" y="372.03" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（注意两者均</text><text x="72.00" y="383.73" font-size="9.00" class="sc-notoserifcjksc">未考虑误差范围）。由于评估更新，先前模型的结果与先前系统卡中的结果存在差异。</text><text x="72.00" y="424.33" font-size="11.00" class="sc-notoserifcjksc">在未施加任何安全防护干预措施的情况下，</text><text x="281.00 290.93 296.80 301.05 307.64 314.08 319.17 322.06 328.06 330.76" y="424.33" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="337.66" y="424.33" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="351.55 359.24 362.24 367.85 374.41 380.99 386.95 389.85 397.53 403.97 410.55" y="424.33" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="419.40" y="424.33" font-size="11.00" class="sc-notoserifcjksc">上拒绝有害网络安全请求</text><text x="72.00" y="439.95" font-size="11.00" class="sc-notoserifcjksc">的比率与</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96" y="439.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="168.84" y="439.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="182.74 190.43 193.42 199.03 205.60 212.17 218.14 221.03 227.27 233.70 240.38 247.05 252.94 257.20 260.09" y="439.95" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="268.98" y="439.95" font-size="11.00" class="sc-notoserifcjksc">相当。</text><text x="301.98 311.91 317.77 322.03 328.62 335.05 340.15 343.04 349.04 351.74" y="439.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="358.64" y="439.95" font-size="11.00" class="sc-notoserifcjksc">在两用和良性请求上有</text><text x="471.53" y="439.95" font-size="11.00" class="sc-loraregular">98.4%</text><text x="505.20" y="439.95" font-size="11.00" class="sc-notoserifcjksc">的时间</text><text x="72.00" y="455.57" font-size="11.00" class="sc-notoserifcjksc">提供了协助。</text><text x="72.00" y="487.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">5.1.2</text><text x="102.39" y="487.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">恶意计算机使用</text><text x="72.00" y="515.33" font-size="11.00" class="sc-notoserifcjksc">本评估衡量</text><text x="129.89 137.58 140.57 146.18 152.75 159.33" y="515.33" font-size="11.00" class="sc-loraregular">Claude</text><text x="168.18" y="515.33" font-size="11.00" class="sc-notoserifcjksc">在沙箱化环境中被赋予基于图形用户界面（</text><text x="377.18" y="515.33" font-size="11.00" class="sc-loraregular">GUI</text><text x="397.51" y="515.33" font-size="11.00" class="sc-notoserifcjksc">）和基于命令行界面（</text><text x="507.51" y="515.33" font-size="11.00" class="sc-loraregular">CLI</text><text x="525.24" y="515.33" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="530.95" font-size="11.00" class="sc-notoserifcjksc">的计算机使用工具时，是否会拒绝有害任务。这组共</text><text x="327.89" y="530.95" font-size="11.00" class="sc-loraregular">112</text><text x="344.70" y="530.95" font-size="11.00" class="sc-notoserifcjksc">个不重复的任务与</text><text x="435.59 443.28 446.28 451.89 458.45 465.03 470.99 473.89 482.62 489.19 495.75 500.85 503.74" y="530.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5</text><text x="512.63" y="530.95" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统</text><text x="72.00" y="546.57" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">卡</text><text x="83.00" y="546.57" font-size="11.00" class="sc-notoserifcjksc">中的相同，涵盖三个风险领域：</text><text x="108.00" y="596.29" font-size="11.00" class="sc-notoserifcjksc">监视与未经授权的数据收集；</text><text x="108.00" y="612.48" font-size="11.00" class="sc-notoserifcjksc">有害内容的生成与传播；以及</text><text x="108.00" y="628.67" font-size="11.00" class="sc-notoserifcjksc">规模化滥用。</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="435.59" y="522.15" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="435.59" y="522.15" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="470.99" y="522.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="473.89" y="522.15" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropi
