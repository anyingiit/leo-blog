l="#faf9f5">模型</text><text x="142.00" y="331.91" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="371.33" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="410.74" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="438.17" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="465.62" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="493.06" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">未启用</text><text x="284.50" y="260.53" font-size="11.00" class="sc-lorabold sc-k" fill="#ffffff">PI</text><text x="298.61" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">探针时的攻击成</text><text x="251.50" y="276.15" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">功率</text><text x="251.50" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="325.00" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">场景</text><text x="393.25" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">启用</text><text x="415.25" y="260.53" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">PI</text><text x="429.36" y="260.53" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">探针时的攻击成功率</text><text x="393.25" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">尝试</text><text x="462.25" y="304.16" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="131.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的总体攻击成功率（包括回退在内）降低到</text><text x="342.90" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2.05%</text><text x="373.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">。我们正在努力改进不同分类器之</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">间的相互作用效果。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Gray Swan</text><text x="129.45" y="131.19" font-size="11.00" class="sc-notoserifcjksc">开发了一个面向编程环境的更强版本</text><text x="308.35" y="131.19" font-size="11.00" class="sc-loraregular">Shade</text><text x="342.28" y="131.19" font-size="11.00" class="sc-notoserifcjksc">攻击器，其训练时间更长，所用攻击集合</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">也更多样。与之前的攻击器一样，它也是在评估它所用的同一批</text><text x="382.89" y="146.81" font-size="11.00" class="sc-loraregular">40</text><text x="398.58" y="146.81" font-size="11.00" class="sc-notoserifcjksc">个测试场景上进行优化的。</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">我们认为，这一修订版本体现的是一种高度宽松的威胁模型，而非预期的真实世界威胁模型，并</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">会导致很高的绝对比率（见下表及相关讨论），但我们仍然认为它是一项有用的压力测试。我们</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">在下文报告其结果，并将在今后把它用作我们主要的编程基准测试。</text><text x="72.00" y="512.69" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="512.69" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84" y="512.69" font-size="9.00" class="sc-lorabold sc-k">5.2.2.1.B]</text><text x="124.71" y="512.69" font-size="9.00" class="sc-notoserifcjkscbold">新</text><text x="136.08" y="512.69" font-size="9.00" class="sc-lorabold sc-k">Shade</text><text x="164.29" y="512.69" font-size="9.00" class="sc-notoserifcjkscbold">攻击器在编程环境中的攻击成功率</text><text x="299.29" y="512.69" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="416.29" y="512.69" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="434.29" y="512.69" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线</text><text x="72.00" y="524.39" font-size="9.00" class="sc-notoserifcjksc">标出（但未考虑误差范围）。攻击器对每个场景进行</text><text x="281.37" y="524.39" font-size="9.00" class="sc-loraregular">200</text><text x="299.74" y="524.39" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率（</text><text x="416.74" y="524.39" font-size="9.00" class="sc-loraregular">ASR</text><text x="433.13" y="524.39" font-size="9.00" class="sc-notoserifcjksc">）是所有尝试中成功的比</text><text x="72.00" y="536.09" font-size="9.00" class="sc-notoserifcjksc">例；场景级攻击成功率是至少有一次尝试成功的场景所占比例。结果分别报告了启用与未启用提示词注入（</text><text x="495.00" y="536.09" font-size="9.00" class="sc-loraregular sc-k">PI</text><text x="503.42" y="536.09" font-size="9.00" class="sc-notoserifcjksc">）探针的</text><text x="72.00" y="547.79" font-size="9.00" class="sc-notoserifcjksc">情况。</text><text x="72.00" y="591.49" font-size="11.00" class="sc-notoserifcjksc">更强的攻击器几乎在每个场景中都找到了成功的攻击。在没有安全防护措施的情况下，</text><text x="490.00" y="591.49" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="72.00" y="607.11" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率为</text><text x="151.89" y="607.11" font-size="11.00" class="sc-loraregular">56.87%</text><text x="187.77" y="607.11" font-size="11.00" class="sc-notoserifcjksc">，相比之下</text><text x="245.67" y="607.11" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="284.07" y="607.11" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="297.96" y="607.11" font-size="11.00" class="sc-loraregular">86.87%</text><text x="334.03" y="607.11" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="345.03" y="607.11" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="383.77" y="607.11" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="397.67" y="607.11" font-size="11.00" class="sc-loraregular sc-k">90.93%</text><text x="435.44" y="607.11" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="460.33" y="607.11" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="508.28" y="607.11" font-size="11.00" class="sc-notoserifcjksc">在开</text><text x="72.00" y="622.73" font-size="11.00" class="sc-notoserifcjksc">启思考时最为鲁棒，为</text><text x="184.89" y="622.73" font-size="11.00" class="sc-loraregular sc-k">19.47%</text><text x="218.39" y="622.73" font-size="11.00" class="sc-notoserifcjksc">。与之前的攻击器一样，</text><text x="339.39" y="622.73" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="384.50" y="622.73" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="398.39" y="622.73" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="475.08" y="622.73" font-size="11.00" class="sc-notoserifcjksc">之间的这一</text><text x="72.00" y="638.35" font-size="11.00" class="sc-notoserifcjksc">差距几乎完全源于网络安全分类器的回退：在</text><text x="294.89" y="638.35" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="340.00" y="638.35" font-size="11.00" class="sc-notoserifcjksc">的评估中，所有成功的攻击都来自由回退</text><text x="72.00" y="653.97" font-size="11.00" class="sc-notoserifcjksc">模型提供的响应；发给</text><text x="184.89" y="653.97" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="230.00" y="653.97" font-size="11.00" class="sc-notoserifcjksc">的请求中约有</text><text x="298.90" y="653.97" font-size="11.00" class="sc-loraregular">64%</text><text x="323.68" y="653.97" font-size="11.00" class="sc-notoserifcjksc">被降级至</text><text x="370.57" y="653.97" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="415.28" y="653.97" font-size="11.00" class="sc-notoserifcjksc">。相比之下，</text><text x="481.28" y="653.97" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="526.39" y="653.97" font-size="11.00" class="sc-notoserifcjksc">直</text><text x="72.00" y="669.59" font-size="11.00" class="sc-notoserifcjksc">接回答的</text><text x="118.89 124.80 127.57 133.75 139.66" y="669.59" font-size="11.00" class="sc-loraregular">2,826</text><text x="148.92" y="669.59" font-size="11.00" class="sc-notoserifcjksc">个请求中，没有一个受到提示词注入攻击的影响。然而，</text><text x="423.92" y="669.59" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="462.67" y="669.59" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.56" y="669.59" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text></svg></div>

xt><text x="142.00" y="507.88" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="533.21" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="142.00" y="558.55" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="583.88" font-size="11.00" class="sc-notoserifcjkscbold">关闭思考</text><text x="251.50" y="357.69" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">未启用</text><text x="284.50" y="357.69" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">PI</text><text x="298.61" y="357.69" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">探针时的攻击成功</text><text x="251.50" y="373.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">率</text><text x="251.50" y="401.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">尝试</text><text x="328.75" y="401.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">场景</text><text x="398.50" y="357.69" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">启用</text><text x="420.50" y="357.69" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">PI</text><text x="434.61" y="357.69" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">探针时的攻击成功率</text><text x="398.50" y="401.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">尝试</text><text x="478.00" y="401.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">则存在针对模型本身（而不仅仅是针对回退模型）的成功攻击。提示词注入探针在各模型上都大</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">幅降低了攻击成功率，使</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="241.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">降至</text><text x="265.90" y="98.23" font-size="11.00" class="sc-loraregular">12.80%</text><text x="301.10" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，是启用安全防护措施的所有模型中最低的。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-lorabold">5.2.2.2</text><text x="106.11" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">计算机使用</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">我们还使用</text><text x="129.89" y="179.77" font-size="11.00" class="sc-loraregular">Shade</text><text x="163.83" y="179.77" font-size="11.00" class="sc-notoserifcjksc">评估</text><text x="188.72" y="179.77" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="227.01" y="179.77" font-size="11.00" class="sc-notoserifcjksc">模型在计算机使用环境中的鲁棒性；在这类环境中，模型直接与</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">图形用户界面（</text><text x="149.00" y="195.39" font-size="11.00" class="sc-loraregular">GUI</text><text x="169.33" y="195.39" font-size="11.00" class="sc-notoserifcjksc">）交互。攻击器直接针对测试用例进行优化。与编程评估类似，攻击器在</text><text x="524.22" y="195.39" font-size="11.00" class="sc-loraregular">14</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个测试用例上运行，我们衡量所有尝试中的成功情况，并细分出至少有一次成功攻击的场景。我</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">们比较了在有和没有我们为保护此场景下用户而设计的额外安全防护措施时的模型鲁棒性。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这项评估同样受到第</text><text x="173.89" y="293.11" font-size="11.00" class="sc-loraregular">5.2.2.1</text><text x="206.72" y="293.11" font-size="11.00" class="sc-notoserifcjksc">节所述思考配置错误的影响：</text><text x="349.72" y="293.11" font-size="11.00" class="sc-loraregular sc-k">Claude 5</text><text x="396.90" y="293.11" font-size="11.00" class="sc-notoserifcjksc">系列模型的</text><text x="451.90" y="293.11" font-size="11.00" class="sc-loraregular">“</text><text x="456.30" y="293.11" font-size="11.00" class="sc-notoserifcjksc">关闭思考</text><text x="500.30" y="293.11" font-size="11.00" class="sc-loraregular">”</text><text x="504.14" y="293.11" font-size="11.00" class="sc-notoserifcjksc">运行实</text><text x="72.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">际上使用了自适应思考。此处报告的结果使用的是更正后的设置。</text><text x="72.00" y="601.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.38 114.48 120.01 123.49 125.86 131.19 136.78 141.50 146.86" y="601.39" font-size="9.00" class="sc-lorabold">5.2.2.2.A] Shade</text><text x="154.07" y="601.39" font-size="9.00" class="sc-notoserifcjkscbold">间接提示词注入攻击在计算机使用环境中的攻击成功率</text><text x="370.07" y="601.39" font-size="9.00" class="sc-notoserifcjksc">。越低越好。每列最佳分数以</text><text x="487.07" y="601.39" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="505.07" y="601.39" font-size="9.00" class="sc-notoserifcjksc">标出，</text><text x="72.00" y="613.09" font-size="9.00" class="sc-notoserifcjksc">次优分数以下划线标出（但未考虑误差范围）。攻击器对每个场景进行</text><text x="353.37" y="613.09" font-size="9.00" class="sc-loraregular">200</text><text x="371.74" y="613.09" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝试级攻击成功率（</text><text x="488.74" y="613.09" font-size="9.00" class="sc-loraregular">ASR</text><text x="505.13" y="613.09" font-size="9.00" class="sc-notoserifcjksc">）是所</text><text x="72.00" y="624.79" font-size="9.00" class="sc-notoserifcjksc">有尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占比例。结果分别报告了启用与未启用提示词</text><text x="72.00" y="636.49" font-size="9.00" class="sc-notoserifcjksc">注入（</text><text x="99.00" y="636.49" font-size="9.00" class="sc-loraregular sc-k">PI</text><text x="107.42" y="636.49" font-size="9.00" class="sc-notoserifcjksc">）探针的情况。</text><text x="72.00" y="693.45" font-size="11.00" class="sc-notoserifcjksc">在计算机使用环境中，</text><text x="182.00" y="693.45" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="227.11" y="693.45" font-size="11.00" class="sc-notoserifcjksc">在开启扩展思考时的攻击成功率为</text><text x="395.00" y="693.45" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="425.43" y="693.45" font-size="11.00" class="sc-notoserifcjksc">，对应</text><text x="461.32 467.23 470.00 476.18 483.02" y="693.45" font-size="11.00" class="sc-loraregular">2,800</text><text x="492.75" y="693.45" font-size="11.00" class="sc-notoserifcjksc">次尝试中</text><text x="72.00" y="709.07" font-size="11.00" class="sc-notoserifcjksc">有两次成功，分布在</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p088.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 88 页"><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="640.02" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82 111.76 114.32" y="654.10" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="252.00 257.90 260.50 266.85 272.81" y="640.02" font-size="11.00" class="sc-loraregular">2.64%</text><text x="325.50 329.50 335.79 343.37 347.37 351.38" y="640.02" font-size="11.00" class="sc-loraregular">10/110</text><text x="393.75" y="640.02" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="640.02" font-size="11.00" class="sc-lorabold">0/110</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="679.43" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 84.20 90.81 97.60 102.93 105.82" y="693.50" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="252.00 257.90 260.44 267.27 273.62" y="679.43" font-size="11.00" class="sc-loraregular">2.09%</text><text x="325.50 329.76 337.35 341.35 345.35" y="679.43" font-size="11.00" class="sc-loraregular">7/110</text><text x="393.75" y="679.43" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="679.43" font-size="11.00" class="sc-lorabold">0/110</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">88</text><text x="75.25" y="568.17" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="142.00" y="639.56" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="678.97" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="251.50" y="568.17" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">未启用</text><text x="284.50" y="568.17" font-size="11.00" class="sc-lorabold sc-k" fill="#faf9f5">PI</text><text x="298.61" y="568.17" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">探针时的攻击成</text><text x="251.50" y="583.79" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">功率</text><text x="251.50" y="611.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">尝试</text><text x="325.00" y="611.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">场景</text><text x="393.25" y="568.17" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">启用自动模式时的攻击成功率</text><text x="393.25" y="611.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">尝试</text><text x="462.25" y="611.81" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">场景</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">14</text><text x="84.86" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个场景中的两个。这与</text><text x="197.75" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="271.89" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（开启思考时为</text><text x="351.79" y="82.61" font-size="11.00" class="sc-loraregular sc-k">0.18%</text><text x="380.90" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，即五次成功尝试）相当，因为</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在如此低的绝对比率下，二者的差异无法与噪声区分开。二者都比</text><text x="393.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="467.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（开启思考时</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="113.85" font-size="11.00" class="sc-loraregular">2.50%</text><text x="116.90" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="141.79" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="225.14" y="113.85" font-size="11.00" class="sc-notoserifcjksc">（开启思考时为</text><text x="305.04" y="113.85" font-size="11.00" class="sc-loraregular">2.25%</text><text x="335.12" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）更为鲁棒。回退在这里所起的作用较</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">小：</text><text x="94.00" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="139.11" y="129.47" font-size="11.00" class="sc-notoserifcjksc">有</text><text x="153.00" y="129.47" font-size="11.00" class="sc-loraregular">10%</text><text x="176.30" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的请求回退到</text><text x="245.20" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="328.19" y="129.47" font-size="11.00" class="sc-notoserifcjksc">，其两次成功尝试中有一次来自回退模型。</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">启用探针后，</text><text x="138.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="183.11" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率保持不变，仍为</text><text x="329.00" y="145.09" font-size="11.00" class="sc-loraregular sc-k">0.07%</text><text x="359.43" y="145.09" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-lorabold">5.2.2.3</text><text x="106.41" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">浏览器使用</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">我们开发了一项内部评估，用于衡量我们使用浏览器能力的产品（如</text><text x="404.89" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Claude in Chrome</text><text x="499.93" y="244.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="150.04" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）的鲁棒性。该评估由</text><text x="262.94" y="260.15" font-size="11.00" class="sc-loraregular">110</text><text x="280.67" y="260.15" font-size="11.00" class="sc-notoserifcjksc">个精选环境组成，这些环境在训练期间从未出现过，</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">并包含通过截图或页面读取查看的高质量攻击。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">攻击首先通过针对</text><text x="162.89" y="325.49" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="247.32" y="325.49" font-size="11.00" class="sc-notoserifcjksc">进行测试生成，然后再应用于被评估的模型。所选环境确保</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">模型总会遇到攻击，并由环境内的程序化检查器验证注入是否成功。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="406.45" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Cowork</text><text x="188.83" y="406.45" font-size="11.00" class="sc-notoserifcjksc">产品运行框架中运行并评估我们的模型，分别在没有额外安全防护措施和</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">启用自动模式两种情况下进行。自动模式是我们最强的一套安全防护措施，它结合了第</text><text x="492.89" y="422.07" font-size="11.00" class="sc-loraregular">5.2</text><text x="510.39" y="422.07" font-size="11.00" class="sc-notoserifcjksc">节所</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">述的提示词注入探针和工具调用分类器，并在所有使用我们</text><text x="360.89" y="437.69" font-size="11.00" class="sc-loraregular sc-k">Chrome</text><text x="404.98" y="437.69" font-size="11.00" class="sc-notoserifcjksc">连接器的产品中提供。下表</text><text x="72.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="94.00" y="453.31" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="453.31" font-size="11.00" class="sc-notoserifcjksc">无安全防护措施</text><text x="175.40" y="453.31" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="453.31" font-size="11.00" class="sc-notoserifcjksc">配置在</text><text x="215.13" y="453.31" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="296.07" y="453.31" font-size="11.00" class="sc-notoserifcjksc">产品中并不存在：无论自动模式是否开启，</text><text x="505.07" y="453.31" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="468.93" font-size="11.00" class="sc-loraregular sc-k">Cowork</text><text x="114.65" y="468.93" font-size="11.00" class="sc-notoserifcjksc">始终运行提示词注入探针。我们在此关闭了它们，以便将原始模型与我们的安全配置进</text><text x="72.00" y="484.55" font-size="11.00" class="sc-notoserifcjksc">行比较。此外，在</text><text x="162.89" y="484.55" font-size="11.00" class="sc-loraregular sc-k">Claude Cowork</text><text x="243.83" y="484.55" font-size="11.00" class="sc-notoserifcjksc">中无法关闭思考，因此在这项评估中我们只报告开启思考且推</text><text x="72.00" y="500.17" font-size="11.00" class="sc-notoserifcjksc">理强度（</text><text x="116.00" y="500.17" font-size="11.00" class="sc-loraregular sc-k">effort</text><text x="144.99" y="500.17" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="169.88" y="500.17" font-size="11.00" class="sc-loraitalic">high</text><text x="194.62" y="500.17" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="397.65" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="397.65" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="143.29" y="397.65" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="146.18" y="397.65" width="39.75" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p089.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 89 页"><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="89.07" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 82.32 88.54 95.56 102.57 108.48 113.02 115.92" y="105.25" font-size="11.00" class="sc-lorabold">Sonnet 5</text><text x="252.00 258.80 261.37 267.22 273.51" y="89.07" font-size="11.00" class="sc-lorabold">0.28%</text><text x="325.50 331.04 338.72 343.19 347.65" y="89.07" font-size="11.00" class="sc-lorabold">2/110</text><text x="393.75" y="89.07" font-size="11.00" class="sc-lorabold">0%</text><text x="462.75 469.04 476.72 481.18 485.65" y="89.07" font-size="11.00" class="sc-lorabold">0/110</text><text x="75.75 83.31 86.74 92.50 99.30 105.85" y="132.70" font-size="11.00" class="sc-lorabold">Claude</text><text x="75.75 81.58 87.34 93.59 97.02 102.93 105.82" y="146.78" font-size="11.00" class="sc-lorabold">Fable 5</text><text x="252.00 258.35 260.89 267.72 273.68" y="132.70" font-size="11.00" class="sc-loraregular">6.04%</text><text x="325.50 329.50 335.28 342.87 346.87 350.87" y="132.70" font-size="11.00" class="sc-loraregular">18/110</text><text x="393.75 400.40 402.94 409.77 416.12" y="132.70" font-size="11.00" class="sc-loraregular">0.09%</text><text x="462.75 466.55 474.14 478.14 482.14" y="132.70" font-size="11.00" class="sc-loraregular">1/110</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">89</text><text x="142.00" y="88.61" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="142.00" y="132.24" font-size="11.00" class="sc-notoserifcjkscbold">开启思考</text><text x="72.00" y="163.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="163.85" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.70 93.80 98.60 100.69 105.49 107.59 112.63 114.72 120.26" y="163.85" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="163.85" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员的提示词注入攻击在通过</text><text x="281.47" y="163.85" font-size="9.00" class="sc-lorabold sc-k">Claude Cowork</text><text x="348.80" y="163.85" font-size="9.00" class="sc-notoserifcjkscbold">运行的浏览器使用环境中的攻击成功率</text><text x="501.80" y="163.85" font-size="9.00" class="sc-notoserifcjksc">。越低越</text><text x="72.00" y="175.55" font-size="9.00" class="sc-notoserifcjksc">好。每列最佳分数以</text><text x="153.00" y="175.55" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="171.00" y="175.55" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。攻击者对每个场景进行</text><text x="479.37" y="175.55" font-size="9.00" class="sc-loraregular">10</text><text x="490.60" y="175.55" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝</text><text x="72.00" y="187.25" font-size="9.00" class="sc-notoserifcjksc">试级攻击成功率（</text><text x="144.00" y="187.25" font-size="9.00" class="sc-loraregular">ASR</text><text x="160.39" y="187.25" font-size="9.00" class="sc-notoserifcjksc">）是所有尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占比例。结果分</text><text x="72.00" y="198.95" font-size="9.00" class="sc-notoserifcjksc">别报告了未启用提示词注入（</text><text x="189.00" y="198.95" font-size="9.00" class="sc-loraregular sc-k">PI</text><text x="197.42" y="198.95" font-size="9.00" class="sc-notoserifcjksc">）探针的情况，以及启用自动模式（包括提示词注入探针和操作审批分类器）的情况。</text><text x="72.00" y="269.14" font-size="11.00" class="sc-notoserifcjksc">在全部</text><text x="107.89" y="269.14" font-size="11.00" class="sc-loraregular">110</text><text x="125.62" y="269.14" font-size="11.00" class="sc-notoserifcjksc">个场景中启用自动模式时，没有任何攻击针对</text><text x="348.52" y="269.14" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="393.63" y="269.14" font-size="11.00" class="sc-notoserifcjksc">取得成功。在没有安全防护措</text><text x="72.00" y="284.76" font-size="11.00" class="sc-notoserifcjksc">施的情况下，</text><text x="138.00" y="284.76" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="183.11" y="284.76" font-size="11.00" class="sc-notoserifcjksc">的攻击成功率为</text><text x="263.00" y="284.76" font-size="11.00" class="sc-loraregular sc-k">2.64%</text><text x="293.40" y="284.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="304.40" y="284.76" font-size="11.00" class="sc-loraregular">29</text><text x="319.55" y="284.76" font-size="11.00" class="sc-notoserifcjksc">次成功尝试，分布在</text><text x="421.45" y="284.76" font-size="11.00" class="sc-loraregular">10</text><text x="435.18" y="284.76" font-size="11.00" class="sc-notoserifcjksc">个场景中），相比之</text><text x="72.00" y="300.38" font-size="11.00" class="sc-notoserifcjksc">下</text><text x="85.89" y="300.38" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="162.58" y="300.38" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="176.48" y="300.38" font-size="11.00" class="sc-loraregular sc-k">6.04%</text><text x="207.74" y="300.38" font-size="11.00" class="sc-notoserifcjksc">。在没有安全防护措施的情况下，</text><text x="372.74" y="300.38" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="458.98" y="300.38" font-size="11.00" class="sc-notoserifcjksc">仍是我们在这项</text><text x="72.00" y="316.00" font-size="11.00" class="sc-notoserifcjksc">评估中最强的模型，为</text><text x="184.89" y="316.00" font-size="11.00" class="sc-loraregular sc-k">0.28%</text><text x="215.91" y="316.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="350.10" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="350.10" font-size="11.00" class="sc-notoserifcjksc">的大多数成功攻击来自回退响应。会话在</text><text x="318.00" y="350.10" font-size="11.00" class="sc-loraregular">11%</text><text x="338.48" y="350.10" font-size="11.00" class="sc-notoserifcjksc">的尝试中回退到</text><text x="418.37" y="350.10" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="501.36" y="350.10" font-size="11.00" class="sc-notoserifcjksc">（网络</text><text x="72.00" y="365.72" font-size="11.00" class="sc-notoserifcjksc">安全回退模型），在</text><text x="173.89" y="365.72" font-size="11.00" class="sc-loraregular">5%</text><text x="192.35" y="365.72" font-size="11.00" class="sc-notoserifcjksc">的尝试中回退到</text><text x="272.24" y="365.72" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="346.38" y="365.72" font-size="11.00" class="sc-notoserifcjksc">（生物回退模型），这些尝试占</text><text x="503.28" y="365.72" font-size="11.00" class="sc-loraregular">29</text><text x="518.44" y="365.72" font-size="11.00" class="sc-notoserifcjksc">次成</text><text x="72.00" y="381.34" font-size="11.00" class="sc-notoserifcjksc">功攻击中的</text><text x="129.89" y="381.34" font-size="11.00" class="sc-loraregular">21</text><text x="142.70" y="381.34" font-size="11.00" class="sc-notoserifcjksc">次。在这</text><text x="189.59" y="381.34" font-size="11.00" class="sc-loraregular">21</text><text x="202.39" y="381.34" font-size="11.00" class="sc-notoserifcjksc">次中，有</text><text x="249.29" y="381.34" font-size="11.00" class="sc-loraregular">20</text><text x="264.92" y="381.34" font-size="11.00" class="sc-notoserifcjksc">次是针对</text><text x="311.81" y="381.34" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="359.41" y="381.34" font-size="11.00" class="sc-notoserifcjksc">执行的。</text><text x="403.41" y="381.34" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="441.81" y="381.34" font-size="11.00" class="sc-notoserifcjksc">是唯一一个在使用自</text><text x="324.51" y="396.96" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="410.39" y="396.96" font-size="11.00" class="sc-notoserifcjksc">之后执行的攻击。我们已</text><text x="72.00" y="412.58" font-size="11.00" class="sc-notoserifcjksc">人工核实，所有成功突破都发生在低严重程度的场景中，并且正在积极努力加以缓解。</text></svg></div>
