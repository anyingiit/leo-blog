.18 427.75 434.33 440.29 443.18 446.27 452.95 455.85 463.53 470.12 474.81 481.24 491.08" y="244.53" font-size="11.00" class="sc-loraregular">Claude in Chrome</text><text x="499.93" y="244.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 117.98 124.31 132.98 139.42 144.14" y="260.15" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="150.04" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）的鲁棒性。该评估由</text><text x="262.94" y="260.15" font-size="11.00" class="sc-loraregular">110</text><text x="280.67" y="260.15" font-size="11.00" class="sc-notoserifcjksc">个精选环境组成，这些环境在训练期间从未出现过，</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">并包含通过截图或页面读取查看的高质量攻击。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">攻击首先通过针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.35" y="325.49" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="247.32" y="325.49" font-size="11.00" class="sc-notoserifcjksc">进行测试生成，然后再应用于被评估的模型。所选环境确保</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">模型总会遇到攻击，并由环境内的程序化检查器验证注入是否成功。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 153.87 160.20 168.88 175.31 180.03" y="406.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Cowork</text><text x="188.83" y="406.45" font-size="11.00" class="sc-notoserifcjksc">产品运行框架中运行并评估我们的模型，分别在没有额外安全防护措施和</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">启用自动模式两种情况下进行。自动模式是我们最强的一套安全防护措施，它结合了第</text><text x="492.89" y="422.07" font-size="11.00" class="sc-loraregular">5.2</text><text x="510.39" y="422.07" font-size="11.00" class="sc-notoserifcjksc">节所</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">述的提示词注入探针和工具调用分类器，并在所有使用我们</text><text x="360.89 368.58 375.17 379.86 386.29 396.13" y="437.69" font-size="11.00" class="sc-loraregular">Chrome</text><text x="404.98" y="437.69" font-size="11.00" class="sc-notoserifcjksc">连接器的产品中提供。下表</text><text x="72.00" y="453.31" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="94.00" y="453.31" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="453.31" font-size="11.00" class="sc-notoserifcjksc">无安全防护措施</text><text x="175.40" y="453.31" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="453.31" font-size="11.00" class="sc-notoserifcjksc">配置在</text><text x="215.13 222.82 225.81 231.42 237.99 244.57 250.53 253.42 261.11 267.44 276.12 282.55 287.27" y="453.31" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="296.07" y="453.31" font-size="11.00" class="sc-notoserifcjksc">产品中并不存在：无论自动模式是否开启，</text><text x="505.07 512.76 515.75 521.36 527.93 534.51" y="453.31" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 79.69 86.01 94.69 101.13 105.85" y="468.93" font-size="11.00" class="sc-loraregular">Cowork</text><text x="114.65" y="468.93" font-size="11.00" class="sc-notoserifcjksc">始终运行提示词注入探针。我们在此关闭了它们，以便将原始模型与我们的安全配置进</text><text x="72.00" y="484.55" font-size="11.00" class="sc-notoserifcjksc">行比较。此外，在</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 208.87 215.20 223.88 230.31 235.03" y="484.55" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="243.83" y="484.55" font-size="11.00" class="sc-notoserifcjksc">中无法关闭思考，因此在这项评估中我们只报告开启思考且推</text><text x="72.00" y="500.17" font-size="11.00" class="sc-notoserifcjksc">理强度（</text><text x="116.00 121.96 125.79 129.45 135.89 140.73" y="500.17" font-size="11.00" class="sc-loraregular">effort</text><text x="144.99" y="500.17" font-size="11.00" class="sc-notoserifcjksc">）为</text><text x="169.88" y="500.17" font-size="11.00" class="sc-loraitalic">high</text><text x="194.62" y="500.17" font-size="11.00" class="sc-notoserifcjksc">时的结果。</text><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="397.65" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="107.89" y="397.65" width="35.40" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="143.29" y="397.65" width="2.89" height="11.00" fill="transparent"/></a><a href="https://claude.com/product/cowork" rel="noopener"><rect x="146.18" y="397.65" width="39.75" height="11.00" fill="transparent"/></a></svg></div>

6" y="163.85" font-size="9.00" class="sc-lorabold">5.2.2.3.A]</text><text x="126.10" y="163.85" font-size="9.00" class="sc-notoserifcjkscbold">专业红队成员的提示词注入攻击在通过</text><text x="281.47 287.66 290.47 295.18 300.74 306.11 310.95 313.32 319.51 324.54 331.75 336.84 341.08" y="163.85" font-size="9.00" class="sc-lorabold">Claude Cowork</text><text x="348.80" y="163.85" font-size="9.00" class="sc-notoserifcjkscbold">运行的浏览器使用环境中的攻击成功率</text><text x="501.80" y="163.85" font-size="9.00" class="sc-notoserifcjksc">。越低越</text><text x="72.00" y="175.55" font-size="9.00" class="sc-notoserifcjksc">好。每列最佳分数以</text><text x="153.00" y="175.55" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="171.00" y="175.55" font-size="9.00" class="sc-notoserifcjksc">标出，次优分数以下划线标出（但未考虑误差范围）。攻击者对每个场景进行</text><text x="479.37" y="175.55" font-size="9.00" class="sc-loraregular">10</text><text x="490.60" y="175.55" font-size="9.00" class="sc-notoserifcjksc">次尝试。尝</text><text x="72.00" y="187.25" font-size="9.00" class="sc-notoserifcjksc">试级攻击成功率（</text><text x="144.00" y="187.25" font-size="9.00" class="sc-loraregular">ASR</text><text x="160.39" y="187.25" font-size="9.00" class="sc-notoserifcjksc">）是所有尝试中成功的比例；场景级攻击成功率是至少有一次尝试成功的场景所占比例。结果分</text><text x="72.00" y="198.95" font-size="9.00" class="sc-notoserifcjksc">别报告了未启用提示词注入（</text><text x="189.00 194.41" y="198.95" font-size="9.00" class="sc-loraregular">PI</text><text x="197.42" y="198.95" font-size="9.00" class="sc-notoserifcjksc">）探针的情况，以及启用自动模式（包括提示词注入探针和操作审批分类器）的情况。</text><text x="72.00" y="269.14" font-size="11.00" class="sc-notoserifcjksc">在全部</text><text x="107.89" y="269.14" font-size="11.00" class="sc-loraregular">110</text><text x="125.62" y="269.14" font-size="11.00" class="sc-notoserifcjksc">个场景中启用自动模式时，没有任何攻击针对</text><text x="348.52 354.11 359.78 366.18 369.18 375.14 378.03 384.03 386.73" y="269.14" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="393.63" y="269.14" font-size="11.00" class="sc-notoserifcjk
