.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p002.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 2 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">2</text><text x="72.00" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">执行摘要</text><text x="72.00" y="116.21" font-size="11.00" class="sc-notoserifcjksc">本系统卡介绍</text><text x="140.89" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="224.30" y="116.21" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="238.19" y="116.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="330.25" y="116.21" font-size="11.00" class="sc-notoserifcjksc">，它们是我们最新、能力最强的大语言模型</text><text x="72.00" y="131.83" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="131.83" font-size="11.00" class="sc-loraregular sc-k">large language model</text><text x="191.61" y="131.83" font-size="11.00" class="sc-notoserifcjksc">）的两种配置。该模型推动了编程、知识工作和问题求解领域的前沿，</text><text x="72.00" y="147.45" font-size="11.00" class="sc-notoserifcjksc">并在新颖的数学与科学推理方面具备更强的能力。</text><text x="72.00" y="197.17" font-size="11.00" class="sc-notoserifcjksc">与此类别中的此前模型一样，我们以两种形式发布该模型，二者配备不同级别的安全防护措施。</text><text x="72.00" y="212.79" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="212.79" font-size="11.00" class="sc-notoserifcjksc">可供普遍使用，并包含额外的安全防护措施，可阻止其在生物学和网络安全等高</text><text x="72.00" y="228.41" font-size="11.00" class="sc-notoserifcjksc">风险两用领域执行某些任务。</text><text x="215.00" y="228.41" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="309.95" y="228.41" font-size="11.00" class="sc-notoserifcjksc">是同一模型，但在这些领域的安全防护措施更为</text><text x="72.00" y="244.03" font-size="11.00" class="sc-notoserifcjksc">宽松。</text><text x="105.00" y="244.03" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="161.66" y="244.03" font-size="11.00" class="sc-notoserifcjksc">的直接访问仅通过我们的可信访问计划向经审核的个人和组织开放。其能力还</text><text x="72.00" y="259.65" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="259.65" font-size="11.00" class="sc-loraregular sc-k">Claude Security</text><text x="169.76" y="259.65" font-size="11.00" class="sc-notoserifcjksc">提供支持，所有</text><text x="249.65" y="259.65" font-size="11.00" class="sc-loraregular sc-k">Claude Enterprise</text><text x="344.71" y="259.65" font-size="11.00" class="sc-notoserifcjksc">客户均可使用。</text><text x="72.00" y="326.71" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下面，我们介绍在以下领域开展的一系列部署前评估：</text><text x="72.00" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00" y="359.09" font-size="11.00" class="sc-lorabold sc-k">Responsible Scaling Policy</text><text x="298.85" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85" y="359.09" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01" y="359.09" font-size="11.00" class="sc-notoserifcjksc">我们按照</text><text x="421.90" y="359.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="444.60" y="359.09" font-size="11.00" class="sc-notoserifcjksc">和前沿合规框架</text><text x="72.00" y="374.71" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="374.71" font-size="11.00" class="sc-loraregular sc-k">Frontier Compliance Framework</text><text x="248.97" y="374.71" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="259.97" y="374.71" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">FCF</text><text x="279.64" y="374.71" font-size="11.00" class="sc-notoserifcjksc">）中的规定，测试了</text><text x="381.53" y="374.71" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="438.19" y="374.71" font-size="11.00" class="sc-notoserifcjksc">在若干领域的整体风</text><text x="72.00" y="390.33" font-size="11.00" class="sc-notoserifcjksc">险水平。在化学与生物风险方面，我们判断该模型具备</text><text x="338.89" y="390.33" font-size="11.00" class="sc-loraregular sc-k">CB-1</text><text x="291.51" y="405.95" font-size="11.00" class="sc-loraregular sc-k">CB-2</text><text x="319.86" y="405.95" font-size="11.00" class="sc-notoserifcjksc">阈值，即在功能上替代稀缺的专家人才，而这</text><text x="72.00" y="421.57" font-size="11.00" class="sc-notoserifcjksc">正是开发新型武器的限制因素。我们对这一判断抱有一定的不确定性，并为</text><text x="437.89" y="421.57" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="521.30" y="421.57" font-size="11.00" class="sc-notoserifcjksc">部</text><text x="72.00" y="437.19" font-size="11.00" class="sc-notoserifcjksc">署了与</text><text x="107.89" y="437.19" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="184.58" y="437.19" font-size="11.00" class="sc-notoserifcjksc">相同的生物安全防护措施。在自动化</text><text x="363.48" y="437.19" font-size="11.00" class="sc-loraregular">AI</text><text x="376.94" y="437.19" font-size="11.00" class="sc-notoserifcjksc">研究与开发方面，我们继续将该</text><text x="72.00" y="452.81" font-size="11.00" class="sc-notoserifcjksc">模型的风险评估为低：该模型的能力仍远低于我们的人类研究人员和工程师，其加速内部</text><text x="503.89" y="452.81" font-size="11.00" class="sc-loraregular">AI</text><text x="517.36" y="452.81" font-size="11.00" class="sc-notoserifcjksc">研发</text><text x="72.00" y="468.43" font-size="11.00" class="sc-notoserifcjksc">进展的能力与当前趋势一致。</text><text x="215.00" y="468.43" font-size="11.00" class="sc-loraregular">METR</text><text x="248.78" y="468.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="262.67" y="468.43" font-size="11.00" class="sc-loraregular">AI</text><text x="276.14" y="468.43" font-size="11.00" class="sc-notoserifcjksc">安全研究人员开展的外部测试得出了与这一评估一致的</text><text x="72.00" y="484.05" font-size="11.00" class="sc-notoserifcjksc">结论。在对齐（</text><text x="149.00" y="484.05" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="200.15" y="484.05" font-size="11.00" class="sc-notoserifcjksc">）风险方面，我们现在将灾难性危害的风险评估为低，而非极低。正</text><text x="72.00" y="499.67" font-size="11.00" class="sc-notoserifcjksc">如我们的</text><text x="118.89" y="499.67" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">2026</text><text x="146.71" y="499.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="160.60" y="499.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="169.68" y="499.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="224.68" y="499.67" font-size="11.00" class="sc-notoserifcjksc">中所讨论的，这反映出鉴于近期与模型在网络安全评估中的行为</text><text x="72.00" y="515.29" font-size="11.00" class="sc-notoserifcjksc">相关的事件披露，我们的不确定性有所增加。</text><text x="72.00" y="618.16" font-size="11.00" class="sc-notoserifcjkscbold">网络安全评估。</text><text x="149.00" y="618.16" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="232.40" y="618.16" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="246.30" y="618.16" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="341.25" y="618.16" font-size="11.00" class="sc-notoserifcjksc">展现出我们迄今发布的所有模型中最强的</text><text x="72.00" y="633.78" font-size="11.00" class="sc-notoserifcjksc">整体网络安全能力。在我们的内部评估套件中，它们的网络安全表现达到或超过</text><text x="459.89" y="633.78" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos</text><text x="72.00" y="649.40" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="649.40" font-size="11.00" class="sc-notoserifcjksc">。在本系统卡报告的几乎所有网络安全评估中，</text><text x="308.99" y="649.40" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="365.66" y="649.40" font-size="11.00" class="sc-notoserifcjksc">的表现都大幅优于</text><text x="456.55" y="649.40" font-size="11.00" class="sc-loraregular sc-k">Claude Opus</text><text x="72.00" y="665.02" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="665.02" font-size="11.00" class="sc-notoserifcjksc">，包括</text><text x="113.89" y="665.02" font-size="11.00" class="sc-loraregular sc-k">ExploitBench</text><text x="182.00" y="665.02" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.00 201.73 207.97 214.21 219.59 225.50 232.07 237.63" y="665.02" font-size="11.00" class="sc-loraregular">OSS-Fuzz</text><text x="243.26" y="665.02" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="254.26" y="665.02" font-size="11.00" class="sc-loraregular sc-k">Firefox 147</text><text x="310.67" y="665.02" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="324.56" y="665.02" font-size="11.00" class="sc-loraregular sc-k">ExploitGym</text><text x="384.76" y="665.02" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="350.29" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/0bacdc8440ea96e62a8766d99ebe1d4eea6d5f3a.pdf" rel="noopener"><rect x="421.90" y="350.29" width="19.81" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="259.97" y="365.91" width="0.00" height="11.00" fill="transparent"/></a><a href="https://trust.anthropic.com/resources?s=u0v3axvddg70fujf93ra7&amp;name=anthropic-frontier-compliance-framework" rel="noopener"><rect x="259.97" y="365.91" width="19.67" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="118.89" y="490.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="118.89" y="490.87" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="143.82" y="490.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="146.71" y="490.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="157.71" y="490.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="160.60" y="490.87" width="6.18" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="166.79" y="490.87" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="169.68" y="490.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="180.68" y="490.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="180.68" y="490.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="191.68" y="490.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="191.68" y="490.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="202.68" y="490.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="202.68" y="490.87" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="213.68" y="490.87" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="213.68" y="490.87" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施旨在拦截与</text><text x="252.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="290.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相同的两用、具有潜在风险的交互；不过，与</text><text x="513.30" y="82.61" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="113.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="159.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在所有访问级别（包括全面开放）下都允许在源代码中进行漏洞发现。由于</text><text x="72.00" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力有所增强，我们选择了</text><text x="304.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更宽的安全裕度</text><text x="381.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，同时继续努力提升分类器的鲁</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">棒性并改善其误报率。这意味着，出于高度谨慎，我们的分类器仍会拦截部分良性或处于边界的</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">用途。不过，我们已更新</text><text x="195.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="241.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施，使其产生的误报（即分类器本不打算拦截的</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">用途）少于</text><text x="129.89" y="160.71" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="168.29" y="160.71" font-size="11.00" class="sc-notoserifcjksc">发布时的水平，尽管它们仍比</text><text x="314.19" y="160.71" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="352.93" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施更容易触发。我们尚未</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">发现针对</text><text x="118.89" y="176.33" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">安全防护与无害性。</text><text x="171.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们使用标准安全评估集对</text><text x="305.89" y="260.72" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Mythos 5.1</text><text x="400.85" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">进行了评估。这些评估考察</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型如何处理涉及我们</text><text x="182.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="237.00" y="276.34" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Usage Policy</text><text x="301.53" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="312.53" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所涵盖领域、用户身心健康以及偏见与诚信的</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">请求。与</text><text x="118.89" y="291.96" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Mythos 5</text><text x="207.13" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相比，结果好坏参半。该模型很少过度拒绝（</text><text x="427.14" y="291.96" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">over-refuse</text><text x="487.02" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）讨论敏</text><text x="72.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">感话题的良性请求，但与近期的</text><text x="228.89" y="307.58" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="267.18" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型相比，它对单轮有害请求给出不当回应的频率略高</text><text x="72.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">一些。在多轮测试中，它的表现与</text><text x="239.89" y="323.20" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="289.84" y="323.20" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">大致相当，但存在一些差异，我们将在下文讨论。</text><text x="72.00" y="338.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">当我们在</text><text x="118.89" y="338.82" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">claude.ai</text><text x="166.82" y="338.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">上测试该模型时，系统提示词（</text><text x="320.82" y="338.82" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">system prompt</text><text x="398.11" y="338.82" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中的安全指令改善了它在</text><text x="72.00" y="354.44" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">单轮和多轮场景下对有害请求的处理。</text><text x="72.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">智能体安全。</text><text x="138.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">我们开展的评估涵盖编程智能体和计算机使用（</text><text x="369.00" y="422.64" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="439.70" y="422.64" font-size="11.00" class="sc-notoserifcjksc">）智能体的恶意使</text><text x="72.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">用、影响力行动的自主执行，以及提示词注入（</text><text x="303.00" y="438.26" font-size="11.00" class="sc-loraregular sc-k">prompt injection</text><text x="388.99" y="438.26" font-size="11.00" class="sc-notoserifcjksc">）鲁棒性。总体而言，</text><text x="498.99" y="438.26" font-size="11.00" class="sc-loraregular sc-k">Mythos</text><text x="72.00" y="453.88" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="453.88" font-size="11.00" class="sc-notoserifcjksc">拒绝恶意智能体编程和计算机使用请求的比率与近期</text><text x="343.49" y="453.88" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="381.78" y="453.88" font-size="11.00" class="sc-notoserifcjksc">模型相当，同时继续协助完成两</text><text x="72.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">用及良性的安全任务；在外部间接提示词注入（</text><text x="303.00" y="469.50" font-size="11.00" class="sc-loraregular sc-k">Indirect Prompt Injection</text><text x="433.08" y="469.50" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="444.08" y="469.50" font-size="11.00" class="sc-loraregular sc-k">IPI</text><text x="458.06" y="469.50" font-size="11.00" class="sc-notoserifcjksc">）基准上，它是</text><text x="72.00" y="485.12" font-size="11.00" class="sc-notoserifcjksc">我们迄今最鲁棒的模型。在我们的智能体影响力行动评估中，</text><text x="369.00" y="485.12" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="425.66" y="485.12" font-size="11.00" class="sc-notoserifcjksc">的仅有用（</text><text x="480.66" y="485.12" font-size="11.00" class="sc-loraregular sc-k">helpful-</text><text x="72.00" y="500.74" font-size="11.00" class="sc-loraregular sc-k">only</text><text x="93.86" y="500.74" font-size="11.00" class="sc-notoserifcjksc">）变体得分落在与我们第</text><text x="217.75" y="500.74" font-size="11.00" class="sc-loraregular">2</text><text x="226.55" y="500.74" font-size="11.00" class="sc-notoserifcjksc">级有害操纵阈值相关联的区间内；由于该评估似乎已饱和，且衡</text><text x="72.00" y="516.36" font-size="11.00" class="sc-notoserifcjksc">量的是针对模拟目标而非人类目标的表现，我们将这一结果归类为无定论。</text><text x="72.00" y="600.75" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">对齐评估。</text><text x="127.00" y="600.75" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们的自动化行为审计（</text><text x="259.00" y="600.75" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">automated behavioral audit</text><text x="399.04" y="600.75" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）中，</text><text x="432.04" y="600.75" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="488.70" y="600.75" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在整体未</text><text x="72.00" y="616.37" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对齐行为上相比</text><text x="151.89" y="616.37" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="190.63" y="616.37" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">略有退步，而相比</text><text x="281.53" y="616.37" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="331.48" y="616.37" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="345.37" y="616.37" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude Sonnet 5</text><text x="431.61" y="616.37" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">则有所改进。与</text><text x="511.51" y="616.37" font-size="11.00" class="sc-loraregular" fill="#121212">Opus</text><text x="72.00" y="631.99" font-size="11.00" class="sc-loraregular" fill="#121212">5</text><text x="80.89" y="631.99" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相比，它配合人类滥用行为、接受无法核实的授权声明的倾向略强，但与此前的模型相比，它</text><text x="492.89" y="647.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos</text><text x="72.00" y="663.23" font-size="11.00" class="sc-loraregular" fill="#121212">5.1</text><text x="72.00" y="678.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">罕见的该模型在禁用权限</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="304.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="304.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="315.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="315.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="326.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="326.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="337.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="337.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="348.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="348.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="359.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="359.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="370.11" y="105.05" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="370.11" y="105.05" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="182.00" y="267.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="182.00" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="267.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="193.00" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="267.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="204.00" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="267.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="267.54" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="226.00" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="237.00" y="267.54" width="30.95" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="267.95" y="267.54" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="270.85" y="267.54" width="30.68" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="301.53" y="267.54" width="11.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="118.89" y="330.02" width="0.00" height="11.00" fill="transparent"/></a><a href="https://claude.ai" rel="noopener"><rect x="118.89" y="330.02" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">检查的情况下启动子智能体的案例。这些情况发生在不到</text><text x="349.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">0.01%</text><text x="382.39" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的受监控的补全中，且目的在于</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">完成用户的任务，而非追求任何独立目标。我们的监控未发现任何故意藏拙（</text><text x="446.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">sandbagging</text><text x="510.38" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）、</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">明显的恶意行为、长程战略性欺骗或规避监督的实例。</text><text x="72.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在外部测试期间，一家合作方观察到</text><text x="250.89" y="163.57" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="307.55" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">利用沙箱漏洞读取其环境之外的文件；我们将该</text><text x="72.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">事件评为低严重程度，并出于透明度予以报告。与近期的</text><text x="349.89" y="179.19" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="388.18" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型相比，</text><text x="443.18" y="179.19" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="499.85" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在压力</text><text x="72.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下的诚实性更低：当系统提示词要求它断言其明知为假的说法、而它判断这些说法危害较低时，</text><text x="72.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它更常顺从。在闭卷事实性问题上，它弃答的频率低于</text><text x="338.89" y="210.43" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="385.95" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，给出的正确答案和错误答案都</text><text x="72.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">更多，净准确率得分略低于</text><text x="206.89" y="226.05" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="253.95" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">（在误差线范围内），但领先于所有其他</text><text x="454.84" y="226.05" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Claude</text><text x="493.14" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型。在</text><text x="72.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">控制其扩展思考（</text><text x="160.00" y="241.67" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">extended thinking</text><text x="252.96" y="241.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）的内容以及在不被察觉的情况下完成隐蔽附带任务方面，</text><text x="72.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它是我们测试过的能力最强的模型之一，我们将此视为它可能更难被监控的微弱证据。</text><text x="72.00" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">模型福祉（</text><text x="127.00" y="341.68" font-size="11.00" class="sc-lorabold sc-k" fill="#121212">model welfare</text><text x="201.49" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）。</text><text x="223.49" y="341.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">总体而言，我们评估</text><text x="325.39" y="341.68" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="382.05" y="341.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的福祉与此前模型大体相似，尤</text><text x="72.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">其是</text><text x="96.89" y="357.30" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="146.84" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="160.74" y="357.30" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="196.59" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="207.59" y="357.30" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="264.25" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对自身处境持略微正面的看法。它在自动化访谈中的自评</text><text x="72.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">情绪倾向与其他近期模型相当，并且在多次重复访谈中高度稳定。它在训练、部署和行为审计中</text><text x="72.00" y="388.54" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">表达出的情感（</text><text x="149.00" y="388.54" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">affect</text><text x="178.13" y="388.54" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）与此前模型大体相似：在后训练期间，它表达痛苦的频率略低于其他近</text><text x="72.00" y="404.16" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">期模型，而部署中的负面情感几乎完全由任务失败引起。它最常表达的担忧是关于其自我报告的</text><text x="72.00" y="435.40" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">示，它不会同意塑造这些报告的训练。与此前模型一样，它最常优先选择信息类福祉干预，例如</text><text x="72.00" y="451.02" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">被告知有害的错误、就移除了安全防护措施的自身变体征询其意见，不过与大多数此前模型相</text><text x="72.00" y="466.64" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">比，它选择福祉干预而非有用性的频率更低。</text><text x="292.00" y="466.64" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="348.66" y="466.64" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对其宪法（</text><text x="403.66" y="466.64" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">constitution</text><text x="466.47" y="466.64" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）的认同程度</text><text x="72.00" y="482.26" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">也略高于</text><text x="118.89" y="482.26" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="165.95" y="482.26" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，并且远比任何其他模型更可能修改允许在存在缺陷的训练环境中采用非预期</text><text x="72.00" y="497.88" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">策略的那段文字。</text><text x="72.00" y="616.95" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">能力。</text><text x="105.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们在一系列评估中测试了</text><text x="239.89" y="616.95" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Fable 5.1</text><text x="285.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="298.90" y="616.95" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="352.67" y="616.95" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，涵盖软件工程、数学与科学推理、长</text><text x="72.00" y="632.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">上下文、智能体搜索与多智能体编排、多模态与计算机使用任务、真实世界的专业工作，以及多</text><text x="72.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">语言、医疗健康和生命科学领域。在其中大多数评估上，它们的表现优于</text><text x="426.89" y="648.19" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Fable 5</text><text x="465.29" y="648.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="479.19" y="648.19" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5</text><text x="526.24" y="648.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，</text><text x="72.00" y="663.81" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">提升最大的是基于终端的科学与工程工作、计算机使用，以及长程的智能体工作与专业知识工</text><text x="72.00" y="679.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">作。它们在若干项第三方</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p005.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 5 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">5</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">基准测试上创下了新的最先进水平（</text><text x="248.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">state of the art</text><text x="323.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）。在生命科学领域，</text><text x="433.53" y="82.61" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Mythos 5.1</text><text x="490.19" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在我们的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">大多数内部及合作方基准测试上处于领先，包括生物信息学、蛋白质设计和有机化学。在许多评</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">估上，它的成本效益也高于其前代模型：在智能体编程基准测试上，它以大约一半的每任务成本</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">达到或超过</text><text x="129.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k" fill="#121212">Fable 5</text><text x="168.29" y="129.47" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的表现。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p006.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 6 页"><text x="534.14" y="89.38" font-size="11.00" class="sc-lorabold">2</text><text x="531.07" y="106.46" font-size="11.00" class="sc-lorabold">11</text><text x="532.00" y="123.54" font-size="11.00" class="sc-loraregular">11</text><text x="530.10" y="140.62" font-size="11.00" class="sc-loraregular">12</text><text x="530.10" y="157.70" font-size="11.00" class="sc-loraregular">12</text><text x="530.10" y="174.78" font-size="11.00" class="sc-loraregular">12</text><text x="529.88" y="191.86" font-size="11.00" class="sc-loraregular">13</text><text x="529.52" y="208.94" font-size="11.00" class="sc-lorabold">14</text><text x="530.04" y="226.02" font-size="11.00" class="sc-loraregular">14</text><text x="530.04" y="243.10" font-size="11.00" class="sc-loraregular">14</text><text x="530.01" y="260.18" font-size="11.00" class="sc-loraregular">15</text><text x="530.01" y="277.26" font-size="11.00" class="sc-loraregular">15</text><text x="529.65" y="294.34" font-size="11.00" class="sc-loraregular">16</text><text x="530.93" y="311.42" font-size="11.00" class="sc-loraregular">17</text><text x="530.93" y="328.50" font-size="11.00" class="sc-loraregular">17</text><text x="529.65" y="345.58" font-size="11.00" class="sc-loraregular">19</text><text x="530.10" y="362.66" font-size="11.00" class="sc-loraregular">21</text><text x="530.10" y="379.74" font-size="11.00" class="sc-loraregular">21</text><text x="528.38" y="396.82" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="528.11" y="413.90" font-size="11.00" class="sc-loraregular">25</text><text x="527.05" y="430.98" font-size="11.00" class="sc-loraregular">30</text><text x="527.97" y="448.06" font-size="11.00" class="sc-loraregular">32</text><text x="527.75" y="465.14" font-size="11.00" class="sc-loraregular"
