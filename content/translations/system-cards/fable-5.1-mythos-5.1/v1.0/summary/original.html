66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="244.03" font-size="11.00" class="sc-notoserifcjksc">的直接访问仅通过我们的可信访问计划向经审核的个人和组织开放。其能力还</text><text x="72.00" y="259.65" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 130.42 136.33 142.18 148.75 153.51 156.78 161.06" y="259.65" font-size="11.00" class="sc-loraregular">Claude Security</text><text x="169.76 180.76 191.76 202.76 213.76 224.76 235.76" y="259.65" font-size="11.00" class="sc-notoserifcjksc">提供支持，所有</text><text x="249.65 257.34 260.33 265.94 272.51 279.09 285.05 287.94 294.78 301.36 305.62 311.58 316.34 322.91 327.67 330.76 335.86" y="259.65" font-size="11.00" class="sc-loraregular">Claude Enterprise</text><text x="344.71 355.71 366.71 377.71 388.71 399.71 410.71" y="259.65" font-size="11.00" class="sc-notoserifcjksc">客户均可使用。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="326.71" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下面，我们介绍在以下领域开展的一系列部署前评估：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">负责任扩展政策（</text><text x="160.00 167.39 173.31 178.64 185.26 191.48 198.50 203.83 207.43 213.69 217.12 223.04 225.93 232.51 238.21 243.97 247.41 251.00 258.02 264.15 267.04 273.88 280.07 283.50 287.09 292.79" y="359.09" font-size="11.00" class="sc-lorabold">Responsible Scaling Policy</text><text x="298.85" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">，</text><text x="309.85 317.40 323.98" y="359.09" font-size="11.00" class="sc-lorabold">RSP</text><text x="331.01 342.01 353.01 364.01" y="359.09" font-size="11.00" class="sc-notoserifcjkscbold">）评估。</text><text x="375.01 386.01 397.01 408.01" y="359.09" font-size="11.00" class="sc-notoserifcjksc">我们按照</text><text x="421.90 428.81 435.04" y="359.09" font-size="11.00" class="sc-loraregular" fill="#0000ff">RSP</text><text x="444.60 455.60 466.60 477.60 488.60 499.60 510.60" y="359.09" font-size="11.00" class="sc-notoserifcjksc">和前沿合规框架</text><text x="72.00" y="374.71" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.92 93.60 100.04 106.62 110.87 113.97 119.93 124.69 127.58 135.27 141.71 151.54 158.11 161.10 164.19 169.87 176.54 182.34 188.30 191.20 197.11 201.80 207.48 217.31 223.23 231.91 238.34 243.06" y="374.71" font-size="11.00" class="sc-loraregular">Frontier Compliance Framework</text><text x="248.97" y="374.71" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="259.97 265.92 273.61" y="374.71" font-size="11.00" class="sc-loraregular" fill="#0000ff">FCF</text><text x="279.64 290.64 301.64 312.64 323.64 334.64 345.64 356.64 367.64" y="374.71" font-size="11.00" class="sc-notoserifcjksc">）中的规定，测试了</text><text x="381.53 391.46 397.32 401.58 408.17 414.61 419.70 422.59 428.59 431.29" y="374.71" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="438.19 449.19 460.19 471.19 482.19 493.19 504.19 515.19 526.19" y="374.71" font-size="11.00" class="sc-notoserifcjksc">在若干领域的整体风</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="390.33" font-size="11.00" class="sc-notoserifcjksc">险水平。在化学与生物风险方面，我们判断该模型具备</text><text x="338.89 346.58 353.42 358.52" y="390.33" font-size="11.00" class="sc-loraregular">CB-1</text><text x="291.51 299.19 306.04 311.06" y="405.95" font-size="11.00" class="sc-loraregular">CB-2</text><text x="319.86 330.86 341.86 352.86 363.86 374.86 385.86 396.86 407.86 418.86 429.86 440.86 451.86 462.86 473.86 484.86 495.86 506.86 517.86 528.86" y="405.95" font-size="11.00" class="sc-notoserifcjksc">阈值，即在功能上替代稀缺的专家人才，而这</text><text x="72.00 83.00 size="11.00" class="sc-notoserifcjksc">进展的能力与当前趋势一致。</text><text x="215.00 225.10 231.94 238.98" y="468.43" font-size="11.00" class="sc-loraregular">METR</text><text x="248.78" y="468.43" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="262.67 269.56" y="468.43" font-size="11.00" class="sc-loraregular">AI</text><text x="276.14 287.14 298.14 309.14 320.14 331.14 342.14 353.14 364.14 375.14 386.14 397.14 408.14 419.14 430.14 441.14 452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="468.43" font-size="11.00" class="sc-notoserifcjksc">安全研究人员开展的外部测试得出了与这一评估一致的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="484.05" font-size="11.00" class="sc-notoserifcjksc">结论。在对齐（</text><text x="149.00 154.68 157.67 160.76 166.84 173.52 183.35 189.32 195.89" y="484.05" font-size="11.00" class="sc-loraregular">alignment</text><text x="200.15 211.15 222.15 233.15 244.15 255.15 266.15 277.15 288.15 299.15 310.15 321.15 332.15 343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15" y="484.05" font-size="11.00" class="sc-notoserifcjksc">）风险方面，我们现在将灾难性危害的风险评估为低，而非极低。正</text><text x="72.00 83.00 94.00 105.00" y="499.67" font-size="11.00" class="sc-notoserifcjksc">如我们的</text><text x="118.89 124.80 131.55 137.46" y="499.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="146.71" y="499.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="160.60" y="499.67" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="169.68 180.68 191.68 202.68 213.68" y="499.67" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="224.68 235.68 246.68 257.68 268.68 279.68 290.68 301.68 312.68 323.68 334.68 345.68 356.68 367.68 378.68 389.68 400.68 411.68 422.68 433.68 444.68 455.68 466.68 477.68 488.68 499.68 510.68 521.68" y="499.67" font-size="11.00" class="sc-notoserifcjksc">中所讨论的，这反映出鉴于近期与模型在网络安全评估中的行为</text><text <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p003.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 3 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">3</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11 128.11 139.11 150.11 161.11 172.11 183.11 194.11 205.11 216.11 227.11 238.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施旨在拦截与</text><text x="252.00 257.59 263.27 269.67 272.66 278.62 281.52" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="290.41 301.41 312.41 323.41 334.41 345.41 356.41 367.41 378.41 389.41 400.41 411.41 422.41 433.41 444.41 455.41 466.41 477.41 488.41 499.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相同的两用、具有潜在风险的交互；不过，与</text><text x="513.30 522.03 528.60 535.17" y="82.61" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">5</text><text x="80.89 91.89 102.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">类似，</text><text x="113.89 119.48 125.15 131.55 134.55 140.51 143.40 149.40 152.10" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="159.00 170.00 181.00 192.00 203.00 214.00 225.00 236.00 247.00 258.00 269.00 280.00 291.00 302.00 313.00 324.00 335.00 346.00 357.00 368.00 379.00 390.00 401.00 412.00 423.00 434.00 445.00 456.00 467.00 478.00 489.00 500.00 511.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">在所有访问级别（包括全面开放）下都允许在源代码中进行漏洞发现。由于</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="113.85" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11 128.11 139.11 150.11 161.11 172.11 183.11 194.11 205.11 216.11 227.11 238.11 249.11 260.11 271.11 282.11 293.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的网络安全能力有所增强，我们选择了</text><text x="304.11 315.11 326.11 337.11 348.11 359.11 370.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">更宽的安全裕度</text><text x="381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，同时继续努力提升分类器的鲁</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">棒性并改善其误报率。这意味着，出于高度谨慎，我们的分类器仍会拦截部分良性或处于边界的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">用途。不过，我们已更新</text><text x="195.89 201.48 207.16 213.56 216.55 222.51 225.41 231.40 234.11" y="145.09" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="241.00 252.00 263.00 274.00 285.00 296.00 307.00 318.00 329.00 340.00 351.00 362.00 373.00 384.00 395.00 406.00 417.00 428.00 439.00 450.00 461.00 472.00 483.00 494.00 505.00 516.00 527.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施，使其产生的误报（即分类器本不打算拦截的</text><text x="72.00 83.00 94.00 105.00 116.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">用途）少于</text><text x="129.89 135.48 141.16 147.56 150.55 156.51 159.41" y="160.71" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="168.29 179.29 190.29 201.29 212.29 223.29 234.29 245.29 256.29 267.29 278.29 289.29 300.29" y="160.71" font-size="11.00" class="sc-notoserifcjksc">发布时的水平，尽管它们仍比</text><text x="314.19 322.92 329.49 336.06 341.15 344.04" y="160.71" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="352.93 363.93 374.93 385.93 396.93 407.93 418.93 429.93 440.93 451.93 462.93 473.93 484.93 495.93 506.93 517.93 528.93" y="160.71" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施更容易触发。我们尚未</text><text x="72.00 83.00 94.00 105.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">发现针对</text><text x="118.89 124.48 130.16 136.56 139.55 145.51 148.41 154.40 157.11" y="176.33" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">安全防护与无害性。</text><text x="171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">我们使用标准安全评估集对</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 354.12 359.98 364.24 370.83 377.26 382.35 385.25 391.24 393.95" y="260.72" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Mythos 5.1</text><text x="400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="260.72" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">进行了评估。这些评估考察</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型如何处理涉及我们</text><text x="182.00 193.00 204.00 215.00 226.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="237.00 245.20 250.29 255.96 261.99 267.95 270.85 277.40 283.84 286.83 289.92 295.72" y="276.34" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="301.53" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="312.53 323.53 334.53 345.53 356.53 367.53 378.53 389.53 400.53 411.53 422.53 433.53 444.53 455.53 466.53 477.53 488.53 499.53 510.53 521.53" y="276.34" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">所涵盖领域、用户身心健康以及偏见与诚信的</text><text x="72.00 83.00 94.00 105.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">请求。与</text><text x="118.89 126.58 129.57 135.18 141.75 148.33 154.29 157.18 167.12 172.98 177.24 183.83 190.26 195.35 198.25" y="291.96" font-size="11.00" class="sc-loraregular" fill="#121212">Claude Mythos 5</text><text x="207.13 218.13 229.13 240.13 251.13 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">相比，结果好坏参半。该模型很少过度拒绝（</text><text x="427.14 433.52 439.02 444.98 449.65 455.03 459.72 465.68 469.40 475.96 481.06" y="291.96" font-size="11.00" class="sc-loraregular" fill="#121212">over-refuse</text><text x="487.02 498.02 509.02 520.02" y="291.96" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）讨论敏</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">感话题的良性请求，但与近期的</text><text x="228.89 236.58 239.57 245.18 251.75 258.33" y="307.58" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="307.58" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型相比，它对单轮有害请求给出不当回应的频率略高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="323.20" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">一些。在多轮测试中，它的表现与</text><text x="239.89 249.83 255.69 259.95 266.54 272.97 278.06 280.96" y="323.20" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="289.84 300.84 311.84 322.84 333.84 344.84 355.84 366.84 377.84 388.84 399.84 410.84 421.84 432.84 443.84 454.84 465.84 476.84 487.84 498.84 509.84 520.84" y="323.20" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">大致相当，但存在一些差异，我们将在下文讨论。</text><text x="72.00 83.00 94.00 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p004.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 4 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">4</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">检查的情况下启动子智能体的案例。这些情况发生在不到</text><text x="349.89 356.55 359.09 365.92 369.92" y="82.61" font-size="11.00" class="sc-loraregular" fill="#121212">0.01%</text><text x="382.39 393.39 404.39 415.39 426.39 437.39 448.39 459.39 470.39 481.39 492.39 503.39 514.39 525.39" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的受监控的补全中，且目的在于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">完成用户的任务，而非追求任何独立目标。我们的监控未发现任何故意藏拙（</text><text x="446.00 451.09 456.77 463.45 470.02 476.43 482.10 488.18 494.53 497.62 504.30" y="98.23" font-size="11.00" class="sc-loraregular" fill="#121212">sandbagging</text><text x="510.38 521.38" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）、</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">明显的恶意行为、长程战略性欺骗或规避监督的实例。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在外部测试期间，一家合作方观察到</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96 297.95 300.66" y="163.57" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5.1</text><text x="307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="163.57" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">利用沙箱漏洞读取其环境之外的文件；我们将该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">事件评为低严重程度，并出于透明度予以报告。与近期的</text><text x="349.89 357.58 360.57 366.18 372.75 379.33" y="179.19" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="388.18 399.18 410.18 421.18 432.18" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型相比，</text><text x="443.18 453.12 458.98 463.24 469.83 476.26 481.35 484.25 490.24 492.95" y="179.19" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5.1</text><text x="499.85 510.85 521.84" y="179.19" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">在压力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.81" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">下的诚实性更低：当系统提示词要求它断言其明知为假的说法、而它判断这些说法危害较低时，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它更常顺从。在闭卷事实性问题上，它弃答的频率低于</text><text x="338.89 348.83 354.69 358.95 365.53 371.97 377.06 379.96" y="210.43" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="385.95 396.95 407.95 418.95 429.95 440.95 451.95 462.95 473.95 484.95 495.95 506.95 517.95 528.95" y="210.43" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">，给出的正确答案和错误答案都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">更多，净准确率得分略低于</text><text x="206.89 216.83 222.69 226.95 233.54 239.97 245.06 247.96" y="226.05" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95 407.95 418.95 429.95 440.95" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">（在误差线范围内），但领先于所有其他</text><text x="454.84 462.53 465.52 471.13 477.70 484.28" y="226.05" font-size="11.00" class="sc-loraregular" fill="#121212">Claude</text><text x="493.14 504.14 515.14 526.14" y="226.05" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">模型。在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="241.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">控制其扩展思考（</text><text x="160.00 165.91 171.74 175.99 181.96 188.63 195.21 201.12 207.70 210.59 214.85 221.44 224.53 231.20 237.11 240.20 246.88" y="241.67" font-size="11.00" class="sc-loraregular" fill="#121212">extended thinking</text><text x="252.96 263.96 274.96 285.96 296.96 307.96 318.96 329.96 340.96 351.96 362.96 373.96 384.96 395.96 406.96 417.96 428.96 439.96 450.96 461.96 472.96 483.96 494.96 505.96 516.96 527.96" y="241.67" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）的内容以及在不被察觉的情况下完成隐蔽附带任务方面，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="257.29" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">它是我们测试过的能力最强的模型之一，我们将此视为它可能更难被监控的微弱证据。</text><text x="72.00 83.00 94.00 105.00 116.00" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">模型福祉（</text><text x="127.00 137.12 143.35 149.90 155.82 159.25 162.14 170.96 176.87 180.31 184.62 190.38 195.57" y="341.68" font-size="11.00" class="sc-lorabold" fill="#121212">model welfare</text><text x="201.49 212.49" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold" fill="#121212">）。</text><text x="223.49 234.49 245.49 256.49 267.49 278.49 289.49 300.49 311.49" y="341.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">总体而言，我们评估</text><text x="325.39 335.32 341.18 345.44 352.03 358.46 363.55 366.45 372.44 375.15" y="341.68" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5.1</text><text x="382.05 393.05 404.05 415.05 426.05 437.05 448.05 459.05 470.05 481.05 492.05 503.05 514.05 525.05" y="341.68" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">的福祉与此前模型大体相似，尤</text><text x="72.00 83.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">其是</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96" y="357.30" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5</text><text x="146.84" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">和</text><text x="160.74 169.47 176.04 182.60 187.70 190.59" y="357.30" font-size="11.00" class="sc-loraregular" fill="#121212">Opus 5</text><text x="196.59" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">。</text><text x="207.59 217.52 223.38 227.64 234.23 240.66 245.76 248.65 254.64 257.35" y="357.30" font-size="11.00" class="sc-loraregular" fill="#121212">Mythos 5.1</text><text x="264.25 275.25 286.25 297.25 308.25 319.25 330.25 341.25 352.25 363.25 374.25 385.25 396.25 407.25 418.25 429.25 440.25 451.25 462.25 473.25 484.25 495.25 506.25 517.25 528.25" y="357.30" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">对自身处境持略微正面的看法。它在自动化访谈中的自评</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">情绪倾向与其他近期模型相当，并且在多次重复访谈中高度稳定。它在训练、部署和行为审计中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="388.54" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">表达出的情感（</text><text x="149.00 154.68 158.50 162.17 168.07 173.87" y="388.54" font-size="11.00" class="sc-loraregular" fill="#121212">affect</text><text x="178.13 189.13 200.13 211.13 222.13 233.13 244.13 255.13 266.13 277.13 288.13 299.13 310.13 321.13 332.13 343.13 354.13 365.13 376.13 387.13 398.13 409.13 420.13 431.13 442.13 453.13 464.13 475.13 486.13 497.13 508.13 519.13" y="388.54" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">）与此前模型大体相似：在后训练期间，它表达痛苦的频率略低于其他近</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="404.16" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">期模型，而部署中的负面情感几乎完全由任务失败引起。它最常表达的担忧是关于其自我报告的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="435.40" font-size="11.00" class="sc-notoserifcjksc" fill="#121212">示，它不会同意塑造这些报告的训练。与此前模型一样，它最常优先选择信息类福祉干预，例如</text><te
