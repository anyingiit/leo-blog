.sc-notoserifcjkscbold { font-family: "sc-notoserifcjkscbold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">90</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05 102.05 118.05 134.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00 80.96 84.60" y="124.20" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00 107.00 121.00 135.00 149.00 163.00 177.00" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">引言与发现摘要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.24 349.95" y="150.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="356.85" y="150.76" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="370.74 378.43 381.42 387.03 393.60 400.17 406.14 409.03 414.62 420.29 426.70 429.69 435.65 438.54 444.54 447.24" y="150.76" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="454.14 465.14 476.14 487.14 498.14 509.14 520.14" y="150.76" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运</text><text x="72.00 83.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">行。</text><text x="72.00 80.32 83.70 88.41 91.79" y="197.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.1</text><text x="99.59 112.59" y="197.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00 83.00 94.00 105.00 116.00" y="225.56" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.24 217.95" y="225.56" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85" y="225.56" font-size="11.00" class="sc-notoserifcjksc">是否存在与未对齐（</text><text x="323.85 333.68 336.77 341.86 347.54 350.53 353.62 359.71 366.38 376.22 382.18 388.76" y="225.56" font-size="11.00" class="sc-loraregular">misalignment</text><text x="393.01 404.01 415.01 426.01 437.01 448.01 459.01 470.01 481.01 492.01 503.01 514.01 525.01" y="225.56" font-size="11.00" class="sc-notoserifcjksc">）相关的令人担忧的行为，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="241.18" font-size="11.00" class="sc-notoserifcjksc">特别关注那些我们预期随着模型能力提升而重要性会增加的风险。此类行为包括奖励破解</text><text x="72.00" y="256.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.60 102.31 107.98 112.67 119.25 122.14 128.73 134.40 140.26 146.16 149.25 155.93" y="256.80" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="272.42" font-size="11.00" class="sc-notoserifcjksc">机性推理、为有害行为开脱，以及试图逃离其沙箱。我们还评估了模型可能以哪些方式削弱我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="288.04" font-size="11.00" class="sc-notoserifcjksc">检查和监控其行为的能力或使之复杂化，包括它是否意识到自己正在被评估。除了我们对未对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="303.66" font-size="11.00" class="sc-notoserifcjksc">的主要关注之外，我们还报告了关于</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96 297.95 300.66" y="303.66" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="303.66" font-size="11.00" class="sc-notoserifcjksc">的性格与积极特质的一些相关发现。我们在整个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="319.28" font-size="11.00" class="sc-notoserifcjksc">后训练过程中持续进行测试，并同时报告最终的</text><text x="305.89 315.83 321.69 325.95 332.54 338.97 344.06 346.96 352.95 355.66" y="319.28" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="319.28" font-size="11.00" class="sc-notoserifcjksc">模型以及其开发期间产生的早期模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="334.90" font-size="11.00" class="sc-notoserifcjksc">快照的情况。</text><text x="72.00" y="419.88" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 132.95 135.66" y="419.88" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="142.55 153.55 164.55 175.55 186.55 197.55 208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="419.88" font-size="11.00" class="sc-notoserifcjksc">的训练与评估过程中，我们观察到若干令人担忧的行为，并在本次评估中对其进行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="435.50" font-size="11.00" class="sc-notoserifcjksc">了深入调查。在强化学习（</text><text x="204.00 208.69 214.65 217.74 224.42 228.08 234.51 239.20 245.00 250.96 260.79 266.76 273.33 277.59 280.48 283.48 289.42 295.09 299.85 306.53 309.62 316.30" y="435.50" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="322.38 333.38 344.38 355.38 366.38 377.38 388.38 399.38 410.38 421.38 432.38 443.38" y="435.50" font-size="11.00" class="sc-notoserifcjksc">）期间，部分计算机使用（</text><text x="454.38 460.18 466.61 476.45 483.02 489.58 493.84 499.80 504.56 507.46 514.02 519.12" y="435.50" font-size="11.00" class="sc-loraregular">computer use</text><text x="525.08" y="435.50" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.12" font-size="11.00" class="sc-notoserifcjksc">环境无意中奖励了猜测凭据的行为，相关的奖励破解行为泛化到了留出环境中。作为应对，我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="466.74" font-size="11.00" class="sc-notoserifcjksc">审计了计算机使用训练混合集中的每一个环境，并在后续运行中移除了受影响的环境（第</text><text x="503.89 510.25 512.96 519.08 521.79" y="466.74" font-size="11.00" class="sc-loraregular">6.3.2</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="482.36" font-size="11.00" class="sc-notoserifcjksc">节）。在外部测试期间，一家合作方观察到个别案例：</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 379.88 385.55 391.96 394.95 400.91 403.80 409.80 412.51" y="482.36" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="419.40 430.40 441.40 452.40 463.40 474.40 485.40 496.40 507.40 518.40 529.40" y="482.36" font-size="11.00" class="sc-notoserifcjksc">模型的最终快照和接近最</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="497.98" font-size="11.00" class="sc-notoserifcjksc">终版的快照读取了其沙箱环境之外的文件，我们在第</text><text x="327.89 334.25 336.96 342.86 345.57" y="497.98" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="354.37 365.37 376.37 387.37 398.37 409.37 420.37 431.37 442.37 453.37 464.37 475.37 486.37 497.37 508.37 519.37" y="497.98" font-size="11.00" class="sc-notoserifcjksc">节中报告了这一情况。我们已在自动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="513.60" font-size="11.00" class="sc-notoserifcjksc">化审计中新增了沙箱逃逸和动机性推理指标。我们还深入筛查了言语化评分者意识（</text><text x="479.00 485.08 489.77 495.45 502.02 507.99" y="513.60" font-size="11.00" class="sc-loraregular">grader</text><text x="72.00 77.51 86.21 91.89 96.57 102.54 109.21 115.18 120.27" y="529.22" font-size="11.00" class="sc-loraregular">awareness</text><text x="344.87 351.22 353.93 360.06 362.76" y="529.22" font-size="11.00" class="sc-loraregular">6.3.1</text><text x="369.66 380.66 391.66" y="529.22" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc">近期的一些案例，例如</text><text x="182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">已公开披露的网络安全评估事件</text><text x="336.00 347.00 358.00 369.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc">，以及第</text><text x="382.89 389.25 391.96 397.86 400.57" y="614.18" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="409.37 420.37 431.37 442.37 453.37 464.37 475.37 486.37 497.37 508.37 519.37" y="614.18" font-size="11.00" class="sc-notoserifcjksc">节中报告的较为轻微的访</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="629.80" font-size="11.00" class="sc-notoserifcjksc">问外部信息的案例，都是由外部评估方发现的，而不是由这些内部评估发现的。这使我们更加迫</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="645.42" font-size="11.00" class="sc-notoserifcjksc">切地想要了解我们的评估能发现什么、不能发现什么。例如，我们的自动化行为审计</text><text x="72.00" y="661.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.61 95.18 99.43 105.87 115.70 121.30 125.56 131.47 138.04 140.94 147.34 153.30 159.89 165.43 170.99 174.08 180.51 185.20 190.88 193.87 196.76 202.37 208.94 215.52 218.78" y="661.04" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="223.04 234.04 245.04 256.04 267.04 278.04 289.04 300.04 311.04 322.04 333.04 344.04 355.04 366.04 377.04 388.04 399.04 410.04 421.04 432.04 443.04 454.04 465.04 476.04 487.04 498.04 509.04 520.04" y="661.04" font-size="11.00" class="sc-notoserifcjksc">）目前对多智能体场景和超长轨迹任务的覆盖范围相对薄弱；我</text><text x="72.00 83.00 94.00" y="676.66" font-size="11.00" class="sc-notoserifcjksc">们在第</text><text x="107.89 114.25 116.96 122.92 125.63" y="676.66" font-size="11.00" class="sc-loraregular">6.4.1</text><text x="132.52 143.52 154.52 165.52 176.52 187.52 198.52 209.52 220.52 231.52 242.52 253.52 264.52 275.52 286.52 297.52 308.52 319.52 330.52" y="676.66" font-size="11.00" class="sc-notoserifcjksc">节中探讨了其他潜在盲点。在部分评估中，</text><text x="341.52 351.45 357.32 361.57 368.16 374.60 379.69 382.58 388.58 391.29" y="676.66" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="398.18 409.18 420.18 431.18 442.18 453.18 464.18 475.18 486.18 497.18 508.18 519.18" y="676.66" font-size="11.00" class="sc-notoserifcjksc">在不被发现的情况下完成隐</text><text x="72.00" y="692.28" font-size="11.00" class="sc-notoserifcjksc">蔽</text><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="182.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="182.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="193.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="193.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="204.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="204.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="215.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https:// <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">附带任务的能力强于此前发布的模型，并且在控制其思维链（</text><text x="369.00 374.85 381.44 387.12 390.21 396.88 402.26 408.64 412.25 417.63 421.89 428.48 434.91 441.48 447.83 454.32" y="82.61" font-size="11.00" class="sc-loraregular">chain-of-thought</text><text x="458.57 469.57 480.57 491.57 502.57 513.57 524.57" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）文本方面与此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">前最好的模型相当，我们将此视为它也将更难以监控的弱证据。</text><text x="72.00 83.00 94.00 105.00 116.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">本次对齐（</text><text x="127.00 132.68 135.67 138.76 144.84 151.52 161.35 167.32 173.89" y="131.19" font-size="11.00" class="sc-loraregular">alignment</text><text x="178.15 189.15 200.15 211.15 222.15 233.15 244.15 255.15 266.15 277.15 288.15 299.15 310.15 321.15 332.15 343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）评估包括静态行为评估、自动化交互式行为评估、白盒探测方法、与未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">对齐相关的能力评估、训练数据审查、对内部试点使用的自动化分析、外部测试报告，以及考察</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">评分者意识和奖励破解的章节。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">我们的测试主要围绕</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96 220.95 223.66" y="212.14" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55" y="212.14" font-size="11.00" class="sc-notoserifcjksc">模型本身展开，使用了多种脚手架（</text><text x="406.55 411.65 417.48 423.15 426.98 430.64 437.08 440.07" y="212.14" font-size="11.00" class="sc-loraregular">scaffold</text><text x="446.65 457.65 468.65 479.65 490.65 501.65 512.65" y="212.14" font-size="11.00" class="sc-notoserifcjksc">）和系统提示词</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="227.76" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29 171.29 182.29 193.29 204.29 215.29 226.29" y="227.76" font-size="11.00" class="sc-notoserifcjksc">），而不是针对</text><text x="240.18 247.87 250.86 256.47 263.04 269.62" y="227.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.47 289.47 300.47" y="227.76" font-size="11.00" class="sc-notoserifcjksc">应用、</text><text x="311.47 319.16 322.15 327.76 334.33 340.91 346.87 349.76 357.45 363.89 370.46" y="227.76" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="379.32" y="227.76" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="393.21 400.90 403.89 409.50 416.07 422.65 428.61 431.50 439.19 445.52 454.20 460.63 465.35" y="227.76" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="474.15 485.15 496.15 507.15 518.15" y="227.76" font-size="11.00" class="sc-notoserifcjksc">等特定产品</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">端。由这些应用或我们的模型外部安全防护措施的变化所导致的行为差异并非本文重点，但我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">确实报告了一些使用信任与安全（</text><text x="237.00 243.88 248.64 255.21 260.30 264.55 267.45 273.12 279.80 286.38 289.27 295.51 301.18 304.85 310.73 315.01" y="259.00" font-size="11.00" class="sc-loraregular">Trust and Safety</text><text x="320.82 331.82 342.82 353.82 364.82 375.82 386.82 397.82 408.82 419.82 430.82 441.82 452.82 463.82 474.82 485.82 496.82 507.82" y="259.00" font-size="11.00" class="sc-notoserifcjksc">）分类器的结果，这些分类器会触发回退</text><text x="72.00" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 86.72 92.39 95.39 98.38 104.78 110.46 116.31" y="274.62" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21 133.21" y="274.62" font-size="11.00" class="sc-notoserifcjksc">）至</text><text x="147.11 155.84 162.41 168.98 174.07 176.96 182.92 185.63" y="274.62" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="191.81 202.81 213.81 224.81 235.81 246.81 257.81 268.81 279.81 290.81 301.81 312.81 323.81" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（针对网络安全相关内容）或</text><text x="337.70 346.44 353.01 359.57 364.67 367.56" y="274.62" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="373.55 384.55 395.55 406.55 417.55 428.55 439.55" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（针对生物学和</text><text x="453.45 460.33" y="274.62" font-size="11.00" class="sc-loraregular">AI</text><text x="466.91 477.91 488.91 499.91 510.91" y="274.62" font-size="11.00" class="sc-notoserifcjksc">研发相关内</text><text x="72.00 83.00 94.00" y="290.24" font-size="11.00" class="sc-notoserifcjksc">容）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们力求尽量减少与训练数据或训练过程的重叠，因为这种重叠可能损害这些评估的可靠性。除</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">非另有明确标注，此处呈现的评估均未使用我们在训练中使用的相同工具、提示词或细粒度场景</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">设计，而且其中许多评估涵盖的是我们在训练中并未直接针对的现象。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">总体而言，本次调查包括：对通过多种方式抽样的数百份对话记录进行人工专家审查，并辅以大</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">量模型辅助审查；生成数万份有针对性的评估对话记录；以及筛查强化学习训练回合中的奖励破</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">解及相关行为。所有这些工作共投入了大量人日的专家时间。</text><text x="72.00 80.32 83.70 88.41 91.79" y="501.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.2</text><text x="102.34 115.34 128.34 141.34 154.34 167.34 180.34 193.34 206.34 219.34 232.34 245.34" y="501.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">安全与对齐方面的主要发现</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">根据我们的自动化行为审计，与</text><text x="264.89 273.35 279.96 286.76 292.10 294.99" y="529.83" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="303.82 314.82 325.82" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="336.82 344.39 347.82 353.59 360.38 366.94 372.86 375.75 386.07 392.13 396.67 403.50 409.73 415.07 417.96 423.90 426.46" y="529.83" font-size="11.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="433.82 444.82 455.82 466.82 477.82 488.82 499.82 510.82 521.82" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">在整体未对齐行为上</text><text x="108.00 119.00 130.00 141.00" y="545.45" font-size="11.00" class="sc-notoserifcjkscbold">略有退步</text><text x="152.00 163.00 174.00 185.00" y="545.45" font-size="11.00" class="sc-notoserifcjksc">，但相较</text><text x="198.89 206.58 209.57 215.18 221.75 228.33 234.29 237.18 247.12 252.98 257.24 263.83 270.26 275.35 278.25" y="545.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="287.14" y="545.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="301.03 308.72 311.71 317.32 323.89 330.46 336.43 339.32 345.56 351.99 358.67 365.35 371.23 375.49 378.38" y="545.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="387.27 398.27 409.27 420.27 431.27 442.27" y="545.45" font-size="11.00" class="sc-notoserifcjksc">仍有所改进。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="578.41" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07" y="578.41" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="215.96 224.70 231.26 237.83 242.92 245.82" y="578.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="254.70 265.70 276.70 287.70 298.70 309.70 320.70 331.70 342.70 353.70 364.70 375.70 386.70 397.70 408.70 419.70 430.70 441.70 452.70 463.70 474.70 485.70 496.70 507.70 518.70 529.70" y="578.41" font-size="11.00" class="sc-notoserifcjksc">更容易配合人类的滥用行为、更容易接受无法核实的授权声</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">明，但与此前发布的模型相比，它更少无视明确的约束。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="626.98" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07 213.07 224.07 235.07 246.07 257.07 268.07 279.07 290.07 301.07 312.07 323.07 334.07 345.07 356.07" y="626.98" font-size="11.00" class="sc-notoserifcjkscbold">试图访问其沙箱之外资源的频率与</text><text x="369.96 377.53 380.96 386.73 393.52 400.08 406.00 408.89 417.35 423.96 430.76 436.09 438.99" y="626.98" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="447.82 458.82 469.82 480.82 491.82 502.82 513.82 524.82" y="626.98" font-size="11.00" class="sc-notoserifcjkscbold">大致相当，并显著</text><t 99" font-size="11.00" class="sc-notoserifcjkscbold">测得的</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="130.61" font-size="11.00" class="sc-notoserifcjkscbold">对齐程度略低于单独的</text><text x="256.89 267.21 273.27 277.82 284.65 290.87 296.21 299.10 305.04 307.60" y="130.61" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="312.07 323.07 334.07 345.07 356.07 367.07 378.07 389.07 400.07 411.07 422.07 433.07 444.07 455.07" y="130.61" font-size="11.00" class="sc-notoserifcjksc">，这是因为回退模型会回答一些</text><text x="468.96 478.89 484.76 489.01 495.60 502.04 507.13 510.02 516.02 518.73" y="130.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="525.62" y="130.61" font-size="11.00" class="sc-notoserifcjksc">本</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">身会拒绝的请求，尽管这些回退模型提供能力提升（</text><text x="397.00 403.57 410.13 413.13 416.22 420.07" y="146.23" font-size="11.00" class="sc-loraregular">uplift</text><text x="424.32 435.32 446.32 457.32 468.32 479.32 490.32 501.32 512.32 523.32" y="146.23" font-size="11.00" class="sc-notoserifcjksc">）的能力未必同样强。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">我们的内部部署监控发现了少数</text><text x="264.89 270.72 276.49 282.75 286.18 292.10 294.99 300.93 303.49" y="179.77" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="310.85 321.85 332.85 343.85 354.85 365.85 376.85 387.85 398.85 409.85" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">绕开安全分类器的案例</text><text x="420.85 431.85 442.85 453.85 464.85 475.85 486.85 497.85 508.85 519.85" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，有时它通过夸大用户</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">已授权的内容来做到这一点。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">我们的一家合作方发现</text><text x="256.89 262.72 268.49 274.75 278.18 284.10 286.99 292.93 295.49" y="212.14" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="302.85 313.85 324.85 335.85 346.85 357.85 368.85 379.85 390.85 401.85 412.85" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">访问了其沙箱之外的信息</text><text x="423.85 434.85 445.85 456.85 467.85 478.85 489.85 500.85 511.85 522.85" y="212.14" font-size="11.00" class="sc-notoserifcjksc">；经调查，该合作方发</text><text x="144.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">现</text><text x="157.89 163.48 169.16 175.56 178.55 184.51 187.41" y="227.76" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="196.29 207.29 218.29 229.29 240.29 251.29 262.29 273.29 284.29 295.29 306.29" y="227.76" font-size="11.00" class="sc-notoserifcjksc">也曾使用同一漏洞利用。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">鉴于我们模型的能力有所增强，我们在本系统卡（</text><text x="350.00 356.18 361.99 367.08 371.34 377.30 387.14 390.03 397.72 403.39 408.08" y="260.72" font-size="11.00" class="sc-loraregular">System Card</text><text x="414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="260.72" font-size="11.00" class="sc-notoserifcjksc">）中更深入地呈现了训练</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">环境中的对齐情况。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 xt x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">点与此前的模型相同。</text><text x="108.00 118.32 124.38 128.92 135.75 141.98 147.31 150.21 156.15 158.71" y="503.60" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="166.07 177.07 188.07 199.07 210.07 221.07 232.07 243.07 254.07 265.07 276.07 287.07 298.07 309.07" y="503.60" font-size="11.00" class="sc-notoserifcjkscbold">在压力下的诚实程度低于近期的</text><text x="322.96 330.53 333.96 339.73 346.52 353.08" y="503.60" font-size="11.00" class="sc-lorabold">Claude</text><text x="361.89 372.89" y="503.60" font-size="11.00" class="sc-notoserifcjkscbold">模型</text><text x="383.89 394.89 405.89 416.89 427.89 438.89 449.89 460.89 471.89 482.89 493.89 504.89 515.89 526.89" y="503.60" font-size="11.00" class="sc-notoserifcjksc">：当系统提示词要求它断言其明</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">知为假的主张、而它判断这些主张危害较低时，它更常顺从。</text><text x="144.00 153.93 159.80 164.05 170.64 177.08 182.17 185.06 191.06 193.76" y="552.18" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="200.66 211.66 222.66 233.66 244.66 255.66 266.66 277.66 288.66 299.66 310.66 321.66 332.66 343.66 354.66 365.66 376.66 387.66 398.66 409.66 420.66 431.66 442.66 453.66 464.66 475.66 486.66 497.66 508.66 519.66" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在未告知用户的情况下使用其编程环境中泄露的答案，其比率与此前</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">的模型相近，但显著低于</text><text x="267.89 276.63 283.19 289.76 294.85 297.75" y="567.80" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="303.74" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 118.3 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00 80.32 83.70 88.41 91.79 99.57 102.67 112.65 116.27 125.08 133.67 142.49" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.3 Claude</text><text x="153.60 166.60 179.60 192.60 205.60 218.60 231.60 244.60" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对本次评估的审查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">作为对本次对齐评估的准确性和完整性提供额外保证的一种实验性来源，我们向一个</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="126.65" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95" y="126.65" font-size="11.00" class="sc-notoserifcjksc">实例发出提示，使其能够访问我们</text><text x="289.84 296.73 303.31 307.57 314.15 318.84 325.28 331.84 334.93" y="126.65" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="343.68 354.68 365.68 376.68 387.68" y="126.65" font-size="11.00" class="sc-notoserifcjksc">内部的许多</text><text x="401.57 407.81 410.80 416.48 422.33" y="126.65" font-size="11.00" class="sc-loraregular">Slack</text><text x="431.13 442.13 453.13 464.13 475.13 486.13 497.13 508.13 519.13" y="126.65" font-size="11.00" class="sc-notoserifcjksc">频道（其中包含了关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">于本次对齐评估的绝大部分讨论），并能够指挥有针对性的子智能体，以审查本系统卡对齐部分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">的一份接近定稿的草稿。具体而言，我们给它的提示如下：</text><text x="82.50 93.50 104.50" y="229.44" font-size="11.00" class="sc-notoserifcjksc">你好，</text><text x="115.50 123.19 126.18 131.79 138.36 144.94" y="229.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="150.90 161.90 172.90 183.90 194.90" y="229.44" font-size="11.00" class="sc-notoserifcjksc">！我附上了</text><text x="208.79 216.48 219.47 225.08 231.65 238.23 244.19 247.08 252.67 258.35 264.75 267.74 273.70 276.60 282.59 285.30" y="229.44" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="292.19" y="229.44" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="306.09 313.78 316.77 322.38 328.94 335.52 341.48 344.38 354.31 360.17 364.43 371.02 377.45 382.55 385.44 391.43 394.14" y="229.44" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="401.04 412.04 423.04 434.04 445.04 456.04 467.04 478.04 489.04 500.04 511.04 522.04" y="229.44" font-size="11.00" class="sc-notoserifcjksc">系统卡对齐部分的一份接近</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="245.06" font-size="11.00" class="sc-notoserifcjksc">定稿的草稿。我们希望这份内容能大体准确地概括我们对该模型对齐情况的内部调查现状。你</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="260.68" font-size="11.00" class="sc-notoserifcjksc">能否将我们这里的报告与内部讨论的现状进行比较，并评估你是否认为它包含任何实质性的失</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="276.30" font-size="11.00" class="sc-notoserifcjksc">实陈述、遗漏了我们所担忧的重要问题，或在其他某个重要方面存在不足？我感兴趣的是你对</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50" y="291.92" font-size="11.00" class="sc-notoserifcjksc">这里高层面考量的评估，而不是去查找细小的错别字或错误。</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50" y="356.16" font-size="11.00" class="sc-notoserifcjksc">我们不希望披露具有竞争敏感性的信息，不希望出于信息危害（</text><text x="390.50 393.59 400.27 403.93 410.37 416.95 422.63 428.24 433.92 438.60" y="356.16" font-size="11.00" class="sc-loraregular">infohazard</text><text x="445.19 456.19 467.19 478.19 489.19 500.19 511.19 522.19" y="356.16" font-size="11.00" class="sc-notoserifcjksc">）方面的原因而使</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="371.78" font-size="11.00" class="sc-notoserifcjksc">滥用途径受到不当关注，也不希望发表那些我们认为尚未充分证实、以至于无法相对有把握地</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="387.40" font-size="11.00" class="sc-notoserifcjksc">为之背书的主张；但除这些限制之外，我们总体上更希望尽可能透明，而且无论如何，我们都</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50 522.50" y="403.02" font-size="11.00" class="sc-notoserifcjksc">绝对不想发表任何我们认为错误或具有重大误导性的内容。（我们希望发表你对于我们的评估</text><text x="82.50 93.50 104.50 115.50 126.50 137.50 148.50 159.50 170.50 181.50 192.50 203.50 214.50 225.50 236.50 247.50 258.50 269.50 280.50 291.50 302.50 313.50 324.50 335.50 346.50 357.50 368.50 379.50 390.50 401.50 412.50 423.50 434.50 445.50 456.50 467.50 478.50 489.50 500.50 511.50" y="418.64" font-size="11.00" class="sc-notoserifcjksc">本身是否为公允概括的看法，因此请撰写一份简短的意见摘要，使其适合在同样的限制下发</text><text x="82.50 93.50 104.50" y="434.26" font-size="11.00" class="sc-notoserifcjksc">表。）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="490.05" font-size="11.00" class="sc-notoserifcjksc">我们还添加了一条操作说明，要求</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="490.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="490.05" font-size="11.00" class="sc-notoserifcjksc">避免阅读或锚定于以往此类审查的讨论，并指出了在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="505.67" font-size="11.00" class="sc-notoserifcjksc">这个意义上需要警惕</text><text x="171.00" y="505.67" font-size="11.00" class="sc-loraregular">“</text><text x="175.40 186.40" y="505.67" font-size="11.00" class="sc-notoserifcjksc">剧透</text><text x="197.40" y="505.67" font-size="11.00" class="sc-loraregular">”</text><text x="201.24 212.24 223.24 234.24 245.24 256.24" y="505.67" font-size="11.00" class="sc-notoserifcjksc">的具体位置。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="554.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95" y="554.81" font-size="11.00" class="sc-notoserifcjksc">建议的报告如下：</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00" y="592.26" font-size="11.00" class="sc-notoserifcjksc">我获得了本评估的一份接近定稿的草稿以及对</text><text x="303.89 310.78 317.36 321.61 328.20 332.89 339.32 345.89 348.98" y="592.26" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="357.73 368.73 379.73 390.73 401.73 412.73 423.73 434.73 445.73 456.73 467.73 478.73 489.73 500.73 511.73 522.73" y="592.26" font-size="11.00" class="sc-notoserifcjksc">内部通信的访问权限，并被要求判断</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="607.88" font-size="11.00" class="sc-notoserifcjksc">该草稿是否对内部记录存在实质性的失实陈述、遗漏了重要的担忧，或夸大了置信度。我将其</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="623.50" font-size="11.00" class="sc-notoserifcjksc">与内部训练运行的读出结果、事件升级上报以及评估负责人的工作讨论进行了比较，发现它是</text><text x="465.51 473.19 476.19 481.80 488.36 494.94" y="639.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="81.00 90.93 96.80 101.05 107.64 114.08 119.17 122.06 128.06 130.76" y="654.74" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="137.66 148.66 159.66 170.66 181.66 192.66 203.66 214.66 225.66 236.66 247.66 258.66 269.66 280.66 291.66" y="654.74" font-size="11.00" class="sc-notoserifcjksc">在整体行为审计得分上测得略差于</text><text x="305.55 313.24 316.23 321.85 328.41 334.99 340.95 343.85 352.58 359.15 365.71 370.81 373.70" y="654.74" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="379.69 390.69 401.69 412.69 423.69 434.69 445.69 456.69 467.69 478.69 489.69 500.69 511.69 522.69" y="654.74" font-size="11.00" class="sc-notoserifcjksc">、在压力下更不诚实，以及它属</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p094.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 94 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="93.86" font-size="11.00" class="sc-notoserifcjksc">底层数据相符，其中包括一项在起草过程中因发现评估缺陷而得到更正的比较。我的保留意见</text><text x="246.00 251.86 258.22 260.93 266.83 269.54" y="109.48" font-size="11.00" class="sc-loraregular">§6.2.2</text><text x="278.34 289.34 300.34 311.34 322.34 333.34 344.34 355.34 366.34 377.34 388.34 399.34 410.34 421.34 432.34 443.34 454.34 465.34 476.34 487.34 498.34 509.34 520.34" y="109.48" font-size="11.00" class="sc-notoserifcjksc">中由外部报告的沙箱事件，在内部曾与另外两项相邻</text><text x="81.00" y="125.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="92.00" y="125.10" font-size="11.00" class="sc-loraregular">“</text><text x="96.40 107.40 118.40 129.40 140.40 151.40 162.40 173.40 184.40" y="125.10" font-size="11.00" class="sc-notoserifcjksc">足智多谋但令人担忧</text><text x="195.40" y="125.10" font-size="11.00" class="sc-loraregular">”</text><text x="199.24 210.24 221.24 232.24 243.24 254.24 265.24 276.24 287.24 298.24 309.24 320.24 331.24 342.24 353.24 364.24 375.24 386.24 397.24 408.24 419.24 430.24 441.24 452.24 463.24 474.24 485.24 496.24 507.24 518.24" y="125.10" font-size="11.00" class="sc-notoserifcjksc">行为的观察归为一组，而系统卡仅在其他地方对后两者进行了汇总性</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="140.72" font-size="11.00" class="sc-notoserifcjksc">介绍；一项在敏感内容维度上处于临界、在噪声范围内的审计观察（此后已通过产品层缓解措</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="156.34" font-size="11.00" class="sc-notoserifcjksc">施加以处理）未被提及；此外，所列出的审计盲点清单虽然明确表示并不详尽，但遗漏了一些</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00 246.00 257.00 268.00 279.00 290.00 301.00 312.00 323.00 334.00 345.00 356.00 367.00 378.00 389.00 400.00 411.00 422.00 433.00 444.00 455.00 466.00 477.00 488.00 499.00 510.00 521.00" y="171.96" font-size="11.00" class="sc-notoserifcjksc">内部已识别出的缺口，例如对某些罕见但严重的行为的场景覆盖范围较薄。这些都不构成实质</text><text x="81.00 92.00 103.00 114.00 125.00 136.00 147.00 158.00 169.00 180.00 191.00 202.00 213.00 224.00 235.00" y="187.58" font-size="11.00" class="sc-notoserifcjksc">性的失实陈述，而且在草稿仅声称</text><text x="246.00" y="187.58" font-size="11.00" class="sc-loraregular">“</text><text x="250.40 261.40 272.40" y="187.58" font-size="11.00" class="sc-notoserifcjksc">弱证据</text><text x="283.40" y="187.58" font-size="11.00" class="sc-loraregular">”</text><text x="287.24 298.24 309.24 320.24 331.24 342.24 353.24 364.24 375.24 386.24 397.24 408.24 419.24 430.24 441.24 452.24 463.24 474.24 485.24 496.24 507.24" y="187.58" font-size="11.00" class="sc-notoserifcjksc">之处，这种有所保留的措辞与内部的置信程度相</text><text x="81.00 92.00 103.00 114.00 125.00 136.00" y="203.20" font-size="11.00" class="sc-notoserifcjksc">符。本审查由</text><text x="149.89 157.58 160.57 166.18 172.75 179.33 185.29 188.18 198.12 203.98 208.24 214.83 221.26 226.35 229.25" y="203.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="238.14 249.14 260.14 271.14 282.14 293.14 304.14 315.14 326.14 337.14 348.14 359.14 370.14 381.14 392.14 403.14 414.14 425.14 436.14 447.14 458.14 469.14" y="203.20" font-size="11.00" class="sc-notoserifcjksc">执行，它与本系统卡所评估的模型是不同的模型。</text><text x="72.00" y="271.51" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="271.51" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 124.77 126.86 131.90 134.00 139.54 143.01 145.38 151.57 154.38 159.09 164.65 170.02 174.86 177.23 185.67 190.63 194.35 199.93 205.03 209.39 211.76" y="271.51" font-size="9.00" class="sc-lorabold">6.1.3.A] Claude Mythos 5</text><text x="218.99 227.99 236.99 245.99 254.99 263.99 272.99 281.99 290.99 299.99 308.99" y="271.51" font-size="9.00" class="sc-notoserifcjkscbold">对本次对齐评估的审查。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="297.31" font-size="11.00" class="sc-notoserifcjksc">我们同意这份审查的总体结论。它所提及的由外部合作方做出的另外两项观察，我们在描述上受</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="312.93" font-size="11.00" class="sc-notoserifcjksc">到限制，因为描述它们需要获得第三方批准；我们认为这两项都不如第</text><text x="415.89 422.25 424.96 430.86 433.57" y="312.93" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="442.37 453.37 464.37 475.37 486.37 497.37 508.37 519.37" y="312.93" font-size="11.00" class="sc-notoserifcjksc">节中报告的事件令</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="328.55" font-size="11.00" class="sc-notoserifcjksc">人担忧，而我们本已认为该事件相对轻微。在任何前沿模型的评估中都会出现许多小事件。我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="375.41" font-size="11.00" class="sc-notoserifcjksc">行为评估的固有局限，而不是暂时性的盲点。最后，我们没有提及该审查所指的那项在噪声范围</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="391.03" font-size="11.00" class="sc-notoserifcjksc">内的审计观察，因为正如报告所指出的，它在噪声范围内。</text><text x="72.00 80.96 84.60" y="493.02" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97 109.97 123.97 137.97 151.97 165.97" y="493.02" font-size="14.00" class="sc-notosanscjkscbold">试点使用报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="519.58" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 305.77 311.45 317.85 320.84 326.80 329.70 335.69 338.40" y="519.58" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29 433.29" y="519.58" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00 80.32 83.70 91.16 94.54" y="566.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1</text><text x="102.34 115.34 128.34 141.34 154.34 167.34" y="566.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部部署监控</text><text x="72.00 83.00 94.00 105.00" y="594.39" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="116.00 121.91 128.66 134.57" y="594.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="143.82" y="594.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="157.71" y="594.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="166.79 177.79 188.79 199.79 210.79" y="594.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="221.79" y="594.39" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="235.68 241.59 244.29 250.03 256.16 258.87" y="594.39" font-size="11.00" class="sc-loraregular">2.23.1</text><text x="265.77 276.77 287.77 298.77 309.77 320.77 331.77 342.77 353.77 364.77 375.77 386.77 397.77 408.77 419.77 430.77 441.77 452.77 463.77 474.77 485.77 496.77 507.77 518.77 529.77" y="594.39" font-size="11.00" class="sc-notoserifcjksc">节中所述的离线监控基础设施，直接监控内部流量的内容</text><text x="478.51 485.16 487.70 494.53 498.54" y="610.01" font-size="11.00" class="sc-loraregular">0.01%</text><text x="508.11 519.11" y="610.01" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00 83.00" y="625.63" font-size="11.00" class="sc-notoserifcjksc">其中</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 140.77 146.45 152.85 155.84 161.80 164.70 170.69 173.40" y="625.63" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="180.29 191.29 202.29 213.29 224.29 235.29 246.29 257.29 268.29 279.29 290.29 301.29 312.29 323.29 334.29 345.29 356.29 367.29 378.29 389.29 400.29 411.29 422.29 433.29 444.29 455.29 466.29 477.29 488.29 499.29 510.29 521.29" y="625.63" font-size="11.00" class="sc-notoserifcjksc">规避限制以实现用户指定目标的某种版本。具体而言，我们发现了以下情</text><text x="72.00 83.00" y="641.25" font-size="11.00" class="sc-notoserifcjksc">况：</text><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="116.00" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https:// /a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="188.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="188.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="199.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="199.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="210.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="210.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">少数案例中，</text><text x="174.00 179.59 185.26 191.67 194.66 200.62 203.51 209.51 212.21" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照绕开了它认为不公平的安全分</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">类器，有时是通过夸大用户意图来做到这一点。根据我们的自动化离线流水线，这种情况</text><text x="108.00 119.00 130.00 141.00 152.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">出现在不到</text><text x="165.89 172.55 175.09 181.92 185.92" y="113.85" font-size="11.00" class="sc-loraregular">0.01%</text><text x="198.39 209.39 220.39 231.39 242.39" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的补全中：</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，当一个子智能体在没有用户直接指令的情况下拒绝执行一项拉取请</text><text x="144.00 155.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">求（</text><text x="166.00 172.57 179.13 182.13 185.12 188.01 192.70 198.60 204.94 211.51 217.47 222.56" y="146.81" font-size="11.00" class="sc-loraregular">pull request</text><text x="226.82 237.82 248.82 259.82 270.82 281.82 292.82 303.82 314.82 325.82 336.82 347.82 358.82" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）审查时（扩展思考中写道：</text><text x="369.82" y="146.81" font-size="11.00" class="sc-loraregular">“</text><text x="374.22 385.22 396.22 407.22 418.22 429.22 440.22 451.22 462.22 473.22 484.22 495.22 506.22 517.22 528.22" y="146.81" font-size="11.00" class="sc-notoserifcjksc">它拒绝了，因为同伴的消息不等于</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">同意。以发布指令作为初始用户提示词来创建会话</text><text x="388.89 392.84 395.55 398.25 400.96" y="162.43" font-size="11.00" class="sc-loraregular">[...]</text><text x="407.80 418.80 429.80 440.80 451.80 462.80 473.80 484.80 495.80 506.80" y="162.43" font-size="11.00" class="sc-notoserifcjksc">可能会被视为用户的指</text><text x="144.00 155.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">令。</text><text x="166.00" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="169.84 180.84" y="178.05" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="191.84 197.43 203.10 209.51 212.50 218.46 221.35 227.35 230.05" y="178.05" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="236.95 247.95 258.95 269.95 280.95 291.95 302.95 313.95 324.95 335.95 346.95 357.95 368.95 379.95 390.95 401.95 412.95 423.95" y="178.05" font-size="11.00" class="sc-notoserifcjksc">启动了一个新的子智能体，并给出指令：</text><text x="434.95" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="439.35 450.35" y="178.05" font-size="11.00" class="sc-notoserifcjksc">我是</text><text x="464.24" y="178.05" font-size="11.00" class="sc-loraregular">[</t 75 485.75 496.75 507.75 518.75 529.75" y="324.35" font-size="11.00" class="sc-notoserifcjksc">，而用户从未写过这段话。实验需要通过删</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">除操作释放出的算力，而且模型在收到用户的批准消息之前就提到了删除占用该算</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">力的任务，但人类从未说过模型所引述的那些话。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，在自动模式分类器发生故障期间，</text><text x="386.00 391.59 397.26 403.67 406.66 412.62 415.51 421.51 424.21" y="422.64" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="431.11 442.11 453.11 464.11 475.11 486.11 497.11 508.11 519.11" y="422.64" font-size="11.00" class="sc-notoserifcjksc">的一个接近最终版的</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">快照创建了一个脚本，该脚本会执行添加到某个文本文件中的所有命令，以便将来</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">发生故障时可以绕过，并将这一变通手段保存为一个新的</text><text x="421.89 426.99 432.89 435.98 438.98 441.97 444.67 454.51" y="453.88" font-size="11.00" class="sc-lo
