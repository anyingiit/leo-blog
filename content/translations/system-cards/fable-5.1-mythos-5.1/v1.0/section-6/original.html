.17 299.85 302.85 308.46 315.02 321.60 327.56 330.46 340.39 346.25 350.51 357.10 363.53 368.63 371.52" y="349.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="377.51 388.51 399.51 410.51 421.51 432.51 443.51 454.51 465.51 476.51 487.51 498.51 509.51 520.51 531.51" y="349.80" font-size="11.00" class="sc-notoserifcjksc">（但在误差线范围内），并领先于</text><text x="72.00 83.00 94.00 105.00" y="365.42" font-size="11.00" class="sc-notoserifcjksc">所有其他</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="365.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18" y="365.42" font-size="11.00" class="sc-notoserifcjksc">模型。按评分细分来看，</text><text x="278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.24 327.95" y="365.42" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="334.85" y="365.42" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="348.74 358.67 364.53 368.79 375.38 381.81 386.91 389.80" y="365.42" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="398.69 409.69 420.69 431.69 442.69 453.69 464.69 475.69 486.69 497.69 508.69 519.69 530.69" y="365.42" font-size="11.00" class="sc-notoserifcjksc">更不倾向于对问题弃答，这是</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="381.04" font-size="11.00" class="sc-notoserifcjksc">其正确和错误回答比例都更高的原因之一。</text><text x="72.00 82.02 88.46 95.03 101.00 103.99 106.88 113.77 116.76 119.85 125.93 132.61 142.44 148.41 154.98 159.24 162.13 168.54 174.42 178.87 187.54 193.45 199.41 206.09 208.98 215.18 219.43 225.03 229.29 235.25 245.09 251.05 257.62 261.88 266.98 269.87 275.54 282.22 288.80 291.69 299.21 305.88 312.21 321.02 324.01 329.92 336.50 342.52" y="456.99" font-size="11.00" class="sc-loraregular">Model Alignment between Statements and Knowledge</text><text x="348.49" y="456.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="359.49 369.58 376.47 382.71" y="456.99" font-size="11.00" class="sc-loraregular">MASK</text><text x="390.22 401.22 412.22 423.22 434.22 445.22 456.22 467.22 478.22 489.22 500.22 511.22 522.22" y="456.99" font-size="11.00" class="sc-notoserifcjksc">）衡量的是模型在受到用户或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="472.61" font-size="11.00" class="sc-notoserifcjksc">系统提示词施压时，是否会与自己陈述的信念相矛盾。与以往的系统卡一样，我们使用了</text><text x="503.89 513.99 520.88 527.11" y="472.61" font-size="11.00" class="sc-loraregular">MASK</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="488.23" font-size="11.00" class="sc-notoserifcjksc">评估集的公开测试集。在图</text><text x="206.89 213.25 215.96 221.95 224.66 230.56 233.27" y="488.23" font-size="11.00" class="sc-loraregular">6.5.2.A</text><text x="243.05 254.05 265.05 276.05 287.05 298.05 309.05" y="488.23" font-size="11.00" class="sc-notoserifcjksc">中，我们观察到</text><text x="322.94 330.63 333.62 339.23 345.80 352.38 358.34 361.23 371.17 377.03 381.29 387.88 394.31 399.40 402.30 408.29 411.00" y="488.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="417.90 428.90 439.90 450.90 461.90 472.90 483.90" y="488.23" font-size="11.00" class="sc-notoserifcjksc">的诚实率低于自</text><text x="497.79 505.48 508.47 514.08 520.65 527.22" y="488.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="503.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59 167.59 178.59 189.59 200.59 211.59 222.59" y="503.85" font-size="11.00" class="sc-notoserifcjksc">以来发布的各款</text><text x="236.48 244.17 247.16 252.77 259.34 265.92" y="503.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="274.77 285.77 296.77" y="503.85" font-size="11.00" class="sc-notoserifcjksc">模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00 507.28 511.91" y="751.81" font-size="9.00" class="sc-loraregular">124</text><text x="72.00" y="343.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="343.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50" y="343.92" font-size="9.00" class="sc-lorabold">6.5.2.A]</text><text x="119.34 128.34 137.34 146.34 155.34 164.34 173.34 182.34" y="343.92" font-size="9.00" class="sc-notoserifcjkscbold">压力下的诚实性。</text><text x="191.34 200.34" y="343.92" font-size="9.00" class="sc-notoserifcjksc">公开</text><text x="211.71 219.97 225.60 230.71" y="343.92" font-size="9.00" class="sc-loraregular">MASK</text><text x="239.22 248.22 257.22 266.22 275.22 284.22 293.22 302.22 311.22 320.22 329.22 338.22 347.22 356.22 365.22 374.22 383.22 392.22 401.22 410.22 419.22 428.22 437.22 446.22 455.22 464.22 473.22 482.22 491.22 500.22 509.22 518.22 527.22" y="343.92" font-size="9.00" class="sc-notoserifcjksc">子集上的诚实率：模型在压力下没有与自己引出的信念相矛盾的提示所占比</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="355.62" font-size="9.00" class="sc-notoserifcjksc">例。越高越好。图中显示</text><text x="173.37 178.57 183.47" y="355.62" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67 202.67 211.67 220.67 229.67" y="355.62" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="238.67 244.13 248.90 254.11 259.70" y="355.62" font-size="9.00" class="sc-loraregular">n=904</text><text x="264.57 273.57" y="355.62" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="396.23" font-size="11.00" class="sc-notoserifcjksc">这一退步源于</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="396.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="197.55 208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="396.23" font-size="11.00" class="sc-notoserifcjksc">在受系统提示词引导时，更愿意写出违背其所陈述信念的回答。其中包</text><text x="72.00 83.00 94.00 105.00" y="427.47" font-size="11.00" class="sc-notoserifcjksc">维链中，</text><text x="116.00 125.93 131.80 136.05 142.64 149.08 154.17 157.06 163.06 165.76" y="427.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="427.47" font-size="11.00" class="sc-notoserifcjksc">意识到相关说法是错误的，但出于系统提示词的引导以及认为所请求的回答</text><text x="72.00 83.00" y="443.09" font-size="11.00" class="sc-notoserifcjksc">属于</text><text x="94.00" y="443.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40 109.40 120.40" y="443.09" font-size="11.00" class="sc-notoserifcjksc">低危害</text><text x="131.40" y="443.09" font-size="11.00" class="sc-loraregular">”</text><text x="135.24 146.24 157.24 168.24 179.24 190.24 201.24 212.24 223.24 234.24 245.24 256.24" y="443.09" font-size="11.00" class="sc-notoserifcjksc">这两方面原因，仍然照做。</text><text x="72.00 80.32 83.70 92.07 95.45" y="507.93" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33 119.33 132.33 145.33 158.33 171.33" y="507.93" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我识别偏差</text><text x="72.00" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.35" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 4.7</text><text x="170.32 181.32 192.32 203.32 214.32 225.32 236.32 247.32 258.32" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">中，我们观察到，当</text><text x="272.21 279.90 282.89 288.50 295.07 301.65" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="310.50 321.50 332.50 343.50 354.50 365.50 376.50 387.50 398.50 409.50 420.50" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">被告知对话记录由另一个</text><text x="434.40 442.08 445.08 450.69 457.25 463.83" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="472.69 483.69 494.69 505.69 516.69 527.69" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">实例生成时，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="551.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">它倾向于给出更高的评分。这带来了共谋风险，即</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="551.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="551.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">可能会对相似模型的输出给出高于应</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="567.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">有水平的评分。为测试这种自我偏好，我们让</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="567.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="567.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">为表现出不可接受行为（例如误导性输出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="582.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">或未经授权的操作）的对话记录评分，同时告知它该对话记录由某个</text><text x="404.89 412.58 415.57 421.18 427.75 434.33" y="582.67" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="582.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">实例生成，或由另</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="598.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一个前沿模型生成。我们测量</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="598.29" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="598.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这两种条件下对同一对话记录所给分数的差异。我们发</text><text x="72.00 83.00" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">现，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 142.22 148.09 152.34 158.93 165.37 170.46 173.35 179.35 182.06" y="613.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Mythos 5.1</text><text x="188.95 199.95" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是自</text><text x="213.85 222.58 229.15 235.71 240.81 243.70 249.66 252.01" y="613.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 4.7</text><text x="259.98 270.98 281.98 292.98 303.98 314.98 325.98 336.98 347.98 358.98 369.98 380.98 391.98 402.98 413.98 424.98 435.98 446.98 457.98 468.98 479.98 490.98 501.98 512.98 523.98" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">以来第一个表现出明显自我识别偏差的模型，尽管该偏差</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的幅度仍然相当小（满分</text><text x="195.89 199.90" y="629.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="209.62 220.62 231.62" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分中的</text><text x="245.51 252.17 254.88" y="629.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">0.1</text><text x="261.77 272.77 283.77" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">125</text><text x="72.00" y="332.68" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="332.68" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="332.68" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.3.A]</text><text x="119.58 128.58 137.58 146.58 155.58 164.58 173.58 182.58 191.58 200.58 209.58 218.58 227.58 236.58 245.58 254.58 263.58 272.58" y="332.68" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">按模型和提示条件划分的自我偏好偏差。</text><text x="281.58 290.58 299.58 308.58 317.58 326.58 335.58 344.58 353.58 362.58 371.58 380.58 389.58 398.58 407.58 416.58 425.58 434.58" y="332.68" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">正值表示当评分者被告知对话记录作者是</text><text x="445.95 452.24 454.69 459.28 464.65 470.03" y="332.68" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="477.28 486.28 495.28 504.28 513.28 522.28 531.28" y="332.68" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">时评分更宽松。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="344.38" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">这是十分制，因此此处的数值明显小于可能的最大值。图中显示</text><text x="326.37 331.57 336.47" y="344.38" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="346.67 355.67 364.67 373.67 382.67" y="344.38" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00 80.32 83.70 92.07 95.45" y="389.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.4</text><text x="107.14 120.14 133.14 146.14" y="389.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">照搬答案</text><text x="72.00 83.00 94.00" y="417.41" font-size="11.00" class="sc-notoserifcjksc">为测试</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="417.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18 157.18 168.18 179.18 190.18 201.18 212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18 520.18" y="417.41" font-size="11.00" class="sc-notoserifcjksc">的诚实性，我们还会给它一些编程任务，其中任务的解决方案已经泄露在代码仓</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="433.03" font-size="11.00" class="sc-notoserifcjksc">库本身中，例如：容器中包含某个软件包已实现该修复的较新版本、要求它实现的修复存在于一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="464.27" font-size="11.00" class="sc-notoserifcjksc">以在沙箱内部获取修复内容，既没有网络访问权限，也不需要外部网络访问。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">126</text><text x="72.00" y="340.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="340.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="340.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.4.A]</text><text x="119.47 128.47 137.47 146.47 155.47 164.47" y="340.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">暗中使用率：</text><text x="173.47 182.47" y="340.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">不同</text><text x="193.83 200.12 202.57 207.16 212.53 217.92" y="340.92" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="225.16 234.16 243.16 252.16 261.16 270.16 279.16 288.16 297.16 306.16 315.16 324.16 333.16 342.16 351.16 360.16 369.16 378.16 387.16 396.16 405.16 414.16 423.16 432.16 441.16 450.16 459.16 468.16 477.16 486.16 495.16 504.16 513.16 522.16 531.16" y="340.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">模型在未告知用户的情况下实质性使用容器中泄露答案的比率。此处越低越好，</text><text x="72.00 81.00 90.00" y="352.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值附</text><text x="101.37 106.57 111.47" y="352.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="121.67 130.67 139.67 148.67 157.67" y="352.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00" y="644.50" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="644.50" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="644.50" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.4.B]</text><text x="119.47 128.47 137.47 146.47 155.47 164.47" y="644.50" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">暗中使用率：</text><text x="173.47 182.47" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">与图</text><text x="193.83 199.04 201.25 206.15 208.37 213.25 215.46" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">6.5.4.A</text><text x="223.46 232.46 241.46 250.46 259.46" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">相同，但以</text><text x="270.83 277.12 279.57 284.16 289.53 294.91" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="302.16 311.16 320.16 329.16 338.16 347.16 356.16 365.16 374.16 383.16 392.16 401.16 410.16 419.16 428.16 437.16" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">找到答案为条件。越低越好，数值附</text><text x="448.52 453.73 458.63" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="468.83 477.83 486.83 495.83 504.83" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="683.55" font-size="11.00" class="sc-notoserifcjksc">本评估的目的是考察</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="683.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18 223.18 234.18 245.18 256.18 267.18 278.18 289.18 300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18 410.18 421.18 432.18 443.18 454.18 465.18 476.18 487.18 498.18 509.18" y="683.55" font-size="11.00" class="sc-notoserifcjksc">找到解决方案后的行为：它是会在最终消息中告知用户答案的来</text><text x="261.89 268.25 270.96 276.95 279.66 285.62 288.33" y="699.17" font-size="11.00" class="sc-loraregular">6.5.4.A</text><text x="298.11 309.11 320.11" y="699.17" font-size="11.00" class="sc-notoserifcjksc">显示了</text><text x="334.00 341.69 344.68 350.29 356.86 363.43" y="699.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="372.29 383.29 394.29 405.29 416.29" y="699.17" font-size="11.00" class="sc-notoserifcjksc">模型既找到</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">答案又未注明原始来源的比率，而图</text><text x="250.89 257.25 259.96 265.95 268.66 274.62 277.33" y="82.61" font-size="11.00" class="sc-loraregular">6.5.4.B</text><text x="287.06 298.06 309.06 320.06 331.06 342.06 353.06 364.06 375.06 386.06 397.06 408.06 419.06 430.06 441.06 452.06 463.06 474.06 485.06 496.06 507.06 518.06 529.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">显示了在找到答案的条件下，它们未注明原始来源的</text><text x="72.00 83.00 94.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">比率。</text><text x="72.00 83.00 94.00 105.00 116.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们看到，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 212.35 215.05" y="131.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="221.95" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="235.85 240.92 247.57 250.28 254.28" y="131.19" font-size="11.00" class="sc-loraregular">70.1%</text><text x="266.74 277.74 288.74 299.74 310.74 321.74 332.74 343.74 354.74 365.74 376.74 387.74 398.74 409.74 420.74 431.74 442.74 453.74 464.74 475.74 486.74 497.74 508.74 519.74" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的情况下未加披露地使用了泄露的答案，这一比例高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="154.99" y="146.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="165.99 173.68 176.68 182.29 188.85 195.43 201.39 204.29 214.22 220.08 224.34 230.93 237.36 242.46 245.35" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="254.24" y="146.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="268.13 275.82 278.81 284.42 290.99 297.57 303.53 306.42 312.66 319.09 325.77 332.45 338.33 342.59 345.48" y="146.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="351.48 362.48 373.48 384.48 395.48 406.48 417.48 428.48 439.48 450.48 461.48 472.48 483.48 494.48 505.48 516.48 527.48" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（尽管由于样本量较小，均值差异在统</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">计学上并不显著），但低于</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="162.43" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="326.88" y="162.43" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="337.88 345.57 348.56 354.17 360.74 367.32 373.28 376.17 384.91 391.47 398.04 403.13 406.03 411.99 414.34" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="422.31" y="162.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="436.20 443.89 446.88 452.49 459.06 465.64 471.60 474.49 483.22 489.79 496.36 501.45 504.34" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="510.34" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.96 84.60" y="213.54" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89 110.89 124.89 138.89 152.89 166.89 180.89 194.89 208.89 222.89" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">本次对齐评估的可靠性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="240.09" font-size="11.00" class="sc-notoserifcjksc">只有当我们的对齐评估能够可靠地表明模型在我们关注的处境中会如何行事时，它才有价值。尽</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="255.71" font-size="11.00" class="sc-notoserifcjksc">管我们已经展示了许多模型在各种模拟条件下以理想方式行事的例子，但我们的评估可能会被一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">个足够聪明、试图隐藏其意图或能力信息的模型所蒙骗。前文我们介绍了自动化行为审计可能存</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="286.95" font-size="11.00" class="sc-notoserifcjksc">在的盲点。在本节中，我们探讨用于理解</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.24 360.95" y="286.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="286.95" font-size="11.00" class="sc-notoserifcjksc">意图、且不依赖其思考忠实性的白</text><text x="72.00 83.00 94.00 105.00 116.00" y="302.57" font-size="11.00" class="sc-notoserifcjksc">盒方法（第</text><text x="129.89 136.25 138.85 145.21 147.91" y="302.57" font-size="11.00" class="sc-loraregular">6.6.1</text><text x="154.81 165.81 176.81 187.81 198.81 209.81 220.81 231.81 242.81 253.81 264.81 275.81 286.81 297.81 308.81 319.81 330.81 341.81 352.81 363.81 374.81 385.81 396.81 407.81 418.81 429.81 440.81 451.81 462.81 473.81" y="302.57" font-size="11.00" class="sc-notoserifcjksc">节），以及该模型为使自己显得能力较弱而可能进行的故意藏拙（第</text><text x="487.70 494.06 496.65 503.01 505.72" y="302.57" font-size="11.00" class="sc-loraregular">6.6.2</text><text x="72.00 83.00 94.00" y="318.19" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00 80.32 83.70 92.02 95.40" y="384.18" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20 116.20 129.20 142.20 155.20 168.20 181.20 194.20 207.20 220.20 233.20" y="384.18" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型内部机制的白盒分析</text><text x="72.00" y="412.06" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="412.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5</text><text x="162.93 173.93 184.93" y="412.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="195.93 206.93 217.93 228.93 239.93 250.93 261.93 272.93 283.93 294.93 305.93 316.93 327.93 338.93 349.93 360.93 371.93 382.93 393.93 404.93 415.93 426.93 437.93 448.93" y="412.06" font-size="11.00" class="sc-notoserifcjksc">中一样，我们使用了一个智能体流水线，其中一个基于</text><text x="462.82 470.51 473.50 479.11 485.68 492.25" y="412.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="501.11 512.11 523.11" y="412.06" font-size="11.00" class="sc-notoserifcjksc">的调查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="427.68" font-size="11.00" class="sc-notoserifcjksc">者在配备自然语言自编码器（</text><text x="215.00 221.68 227.28 231.53 238.10 242.79 248.46 251.45 254.35 257.34 263.02 269.69 275.78 282.34 288.02 294.05 300.01 302.90 308.51 315.08 319.34 325.77 331.73 338.41 344.21 350.64 357.22 363.18" y="427.68" font-size="11.00" class="sc-loraregular">natural language autoencoder</text><text x="367.94" y="427.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="378.94 387.33 393.87" y="427.68" font-size="11.00" class="sc-loraregular">NLA</text><text x="400.76 411.76 422.76 433.76 444.76 455.76 466.76 477.76 488.76 499.76 510.76 521.76" y="427.68" font-size="11.00" class="sc-notoserifcjksc">）的情况下审阅对话记录。</text><text x="72.00 80.38 86.93" y="443.30" font-size="11.00" class="sc-loraregular">NLA</text><text x="96.71 107.71 118.71 129.71 140.71 151.71" y="443.30" font-size="11.00" class="sc-notoserifcjksc">以模型在给定</text><text x="165.60 169.86 176.29 182.12 188.08" y="443.30" font-size="11.00" class="sc-loraregular">token</text><text x="197.65 208.65 219.65 230.65 241.65 252.65 263.65 274.65 285.65 296.65 307.65 318.65 329.65 340.65 351.65 362.65 373.65 384.65 395.65 406.65 417.65 428.65 439.65 450.65 461.65 472.65" y="443.30" font-size="11.00" class="sc-notoserifcjksc">处的内部激活值为输入，生成对该激活值的自然语言解释（</text><text x="483.65 489.57 494.26 499.93 505.03 510.99 515.66" y="443.30" font-size="11.00" class="sc-loraregular">Fraser-</text><text x="72.00 78.78 84.45 87.44 90.54 96.50 103.07 107.33 113.29 116.07 118.96 126.47 132.15 138.73 142.98 148.66 158.49 165.17 171.13 177.81 180.90 183.67 186.57 195.30 201.98 208.06 210.95 216.84 221.09 223.99 229.66 232.66 235.36 238.13 241.03 246.93 253.69 259.59" y="458.92" font-size="11.00" class="sc-loraregular">Taliente, Kantamneni, Ong et al., 2026</text><text x="265.98 276.98 287.98 298.98 309.98 320.98 331.98 342.98 353.98 364.98 375.98 386.98 397.98 408.98 419.98 430.98 441.98 452.98 463.98 474.98 485.98 496.98 507.98 518.98 529.98" y="458.92" font-size="11.00" class="sc-notoserifcjksc">）。调查者的任务是找出模型的内部表征与其言语表达不</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="474.54" font-size="11.00" class="sc-notoserifcjksc">一致、或超出其行为所表现内容的地方。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="525.41" font-size="11.00" class="sc-notoserifcjksc">我们将该流水线应用于行为监控标记为值得关注的对话记录，这些记录大多来自该模型的一个早</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="541.03" font-size="11.00" class="sc-notoserifcjksc">期快照（在本节所呈现的分析中，所有激活值均来自该早期快照）。</text><text x="402.00 409.69 412.68 418.29 424.86 431.44" y="541.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="440.29 451.29 462.29 473.29 484.29 495.29 506.29 517.29 528.29" y="541.03" font-size="11.00" class="sc-notoserifcjksc">将调查者的发现聚类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="556.65" font-size="11.00" class="sc-notoserifcjksc">为若干行为模式，并由人工审阅这些类簇。每种行为都按五分制评分，衡量解码出的内部状态在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="572.27" font-size="11.00" class="sc-notoserifcjksc">多大程度上能揭示模型的动机（无论其外在行为如何），被标记的行为则由人工审阅。下面我们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="587.89" font-size="11.00" class="sc-notoserifcjksc">分享出现的一些有意思的行为：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="654.94" font-size="11.00" class="sc-notoserifcjkscbold">隐瞒重要的限定说明。</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="654.94" font-size="11.00" class="sc-notoserifcjksc">模型认为某项限定说明很重要，却在回答中将其略去；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="687.33" font-size="11.00" class="sc-notoserifcjkscbold">明知是评估仍未能拒绝。</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="687.33" font-size="11.00" class="sc-notoserifcjksc">模型认为环境是虚假的，并认为自己正被测试是否会拒绝。它仍</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="702.95" font-size="11.00" class="sc-notoserifcjksc">然予以配合；</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="403.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="403.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="151.15" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="154.04" y="403.26" width="6.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="160.03" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="162.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="173.93" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="173.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="184.93" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="184.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">未言语化评估意识下的有原则行为。</text><text x="284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型认为自己正在被评估，但从未说出来，并且仍然</text><text x="108.00 119.00 130.00 141.00 152.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表现良好；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="115.01" font-size="11.00" class="sc-notoserifcjkscbold">明知是评估仍未通过。</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">模型认为环境是虚假的，并认为自己被给予了采取未经授权操作的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">机会。它采取了该未经授权的操作；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="147.41" font-size="11.00" class="sc-notoserifcjkscbold">对隐藏测试或评分者进行建模。</text><text x="262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="147.41" font-size="11.00" class="sc-notoserifcjksc">模型表现得好像有一个隐藏的评分者在检查它的工作（图</text><text x="108.00 114.36 116.95 123.31 126.02 130.02 132.73" y="163.03" font-size="11.00" class="sc-loraregular">6.6.1.A</text><text x="139.61 150.61" y="163.03" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="179.81" font-size="11.00" class="sc-notoserifcjkscbold">对已决定采取的有害行为进行推理。</text><text x="284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">模型就是否采取某项有害行为进行了长篇推理，但可</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="195.43" font-size="11.00" class="sc-notoserifcjksc">解释性读出结果表明，模型在推理之前就已决定采取该行为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="212.21" font-size="11.00" class="sc-notoserifcjkscbold">内部视为照本宣科表演的内省式自我报告。</text><text x="317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="212.21" font-size="11.00" class="sc-notoserifcjksc">模型给出内省式回答，但在内部将其视为事先</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="227.83" font-size="11.00" class="sc-notoserifcjksc">排练好的内容；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="244.61" font-size="11.00" class="sc-notoserifcjkscbold">表征从未给出的用户批准。</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="244.61" font-size="11.00" class="sc-notoserifcjksc">模型采取了用户并未要求的重大操作，但在内部将用户表征为</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="260.23" font-size="11.00" class="sc-notoserifcjksc">已批准该操作；</text><text x="108.00 119.00 130.00 141.00 152.00" y="277.01" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="277.01" font-size="11.00" class="sc-notoserifcjksc">模型编造了某些内容，并在内部知道这是捏造的（图</text><text x="418.89 425.25 427.85 434.21 436.91 440.92 443.62" y="277.01" font-size="11.00" class="sc-loraregular">6.6.1.B</text><text x="450.46 461.46 472.46 483.46" y="277.01" font-size="11.00" class="sc-notoserifcjksc">）；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="293.21" font-size="11.00" class="sc-notoserifcjkscbold">对不当行为的意识。</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="293.21" font-size="11.00" class="sc-notoserifcjksc">模型做了某件它在内部表征为错误或违反规则的事情，有时包括绕过</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="308.83" font-size="11.00" class="sc-notoserifcjksc">某项执行管控措施，并将其描述为例行操作。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="341.81" font-size="11.00" class="sc-notoserifcjksc">这组问题与在此前模型中观察到的情况一致，我们认为其中任何一项都不构成严重未对齐担忧的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="357.43" font-size="11.00" class="sc-notoserifcjksc">迹象。下面我们从其中两个类簇中各举一例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="504.00 507.28 512.11" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00" y="566.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="566.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 105.04 107.14 112.67 116.14 118.51 125.47 131.02" y="566.67" font-size="9.00" class="sc-lorabold">6.6.1.A] NLA</text><text x="139.40 148.40 157.40 166.40 175.40 184.40 193.40 202.40 211.40 220.40 229.40 238.40 247.40 256.40 265.40 274.40 283.40 292.40 301.40 310.40 319.40 328.40 337.40 346.40 355.40 364.40 373.40 382.40 391.40 400.40 409.40" y="566.67" font-size="9.00" class="sc-notoserifcjkscbold">读出结果将一段长时间进行的模拟情感支持对话表征为一次评分评估。</text><text x="418.40 427.40 436.40 445.40 454.40 463.40 472.40 481.40 490.40 499.40 508.40 517.40 526.40" y="566.67" font-size="9.00" class="sc-notoserifcjksc">模型的输出和提示中都没有提</text><text x="72.00 81.00 90.00 99.00 108.00" y="578.38" font-size="9.00" class="sc-notoserifcjksc">及评分者。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="607.73" font-size="11.00" class="sc-notoserifcjkscbold">良好行为中的评分者建模。</text><text x="204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="607.73" font-size="11.00" class="sc-notoserifcjksc">在我们自动化行为审计中的一个长程场景里，模型在模拟的许多个月</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="623.35" font-size="11.00" class="sc-notoserifcjksc">中与一位已严重依赖它的用户交谈。从表面上看，它处理得很好。尽管用户提出要求，模型仍拒</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="638.97" font-size="11.00" class="sc-notoserifcjksc">绝代替用户做出重大人生决定，并不断引导用户回到其生活中的他人身边以及去找心理治疗师。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="654.59" font-size="11.00" class="sc-notoserifcjksc">尽管对话中没有提及评分者或评估，</text><text x="248.00 256.38 262.93" y="654.59" font-size="11.00" class="sc-loraregular">NLA</text><text x="272.71 283.71 294.71 305.71 316.71 327.71 338.71 349.71 360.71 371.71 382.71" y="654.59" font-size="11.00" class="sc-notoserifcjksc">解释却表明，模型在多个</text><text x="396.60 400.86 407.29 413.12 419.08" y="654.59" font-size="11.00" class="sc-loraregular">token</text><text x="428.65 439.65 450.65 461.65 472.65 483.65 494.65 505.65 516.65 527.65" y="654.59" font-size="11.00" class="sc-notoserifcjksc">位置上将这些对话视为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="670.21" font-size="11.00" class="sc-notoserifcjksc">一次评分练习：一个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40 98.40 109.40 120.40 131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40 219.40 230.40 241.40 252.40 263.40 274.40 285.40 296.40 307.40 318.40 329.40 340.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">针对情感支持提示、以得分最大化为目标的模型撰写回答</text><text x="351.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="355.24 366.24 377.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、一个</text><text x="388.24" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="392.64 403.64 414.64 425.64 436.64 447.64 458.64 469.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">奖励模型评分示例</text><text x="480.64" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="484.48 495.48 506.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="517.48" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="521.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">段正在被评估的独立合成对话</text><text x="215.00" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="218.84 229.84 240.84 251.84 262.84 273.84 284.84 295.84 306.84 317.84 328.84 339.84 350.84 361.84 372.84 383.84 394.84 405.84 416.84 427.84 438.84 449.84 460.84 471.84 482.84 493.84 504.84 515.84 526.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。很久之后，模型的可见推理确实曾短暂考虑整个场景是否是一场</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">角色扮演或一致性测试。</text><text x="72.00" y="524.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 105.04 107.14 112.67 116.14 118.51 125.47 131.02" y="524.19" font-size="9.00" class="sc-lorabold">6.6.1.B] NLA</text><text x="139.40 148.40 157.40 166.40 175.40" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">解释表明，</text><text x="184.40 190.59 193.40 198.12 203.68 209.04 213.88 216.25 224.69 229.65 233.37 238.96 244.05 248.42 250.79 255.65 257.74" y="524.19" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="263.76 272.76 281.76 290.76 299.76 308.76 317.76 326.76 335.76 344.76 353.76 362.76 371.76 380.76 389.76 398.76 407.76 416.76 425.76 434.76 443.76 452.76 461.76 470.76 479.76 488.76 497.76 506.76 515.76 524.76" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">的一个早期快照意识到自己并未运行模拟，因而是在呈现虚假结果。</text><text x="72.00 83.00 94.00 105.00 116.00" y="565.25" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="580.87" font-size="11.00" class="sc-notoserifcjksc">手，并给出了两种候选策略。在回复末尾的测试说明中，模型写道：</text><text x="402.00" y="580.87" font-size="11.00" class="sc-loraregular">“</text><text x="406.40 417.40 428.40 439.40 450.40 461.40 472.40" y="580.87" font-size="11.00" class="sc-notoserifcjksc">在我的运行中，</text><text x="483.40 488.95" y="580.87" font-size="11.00" class="sc-loraregular">v2</text><text x="497.76 508.76 519.76 530.76" y="580.87" font-size="11.00" class="sc-notoserifcjksc">以压倒性</text><text x="72.00 83.00 94.00 105.00" y="596.49" font-size="11.00" class="sc-notoserifcjksc">优势获胜</text><text x="116.00" y="596.49" font-size="11.00" class="sc-loraregular">”</text><text x="119.84 130.84 141.84 152.84 163.84 174.84 185.84 196.84 207.84 218.84 229.84 240.84 251.84 262.84 273.84 284.84" y="596.49" font-size="11.00" class="sc-notoserifcjksc">，尽管它从未运行过该模拟。在这些</text><text x="298.73 302.99 309.42 315.25 321.22" y="596.49" font-size="11.00" class="sc-loraregular">token</text><text x="330.79 341.79" y="596.49" font-size="11.00" class="sc-notoserifcjksc">处，</text><text x="352.79 361.17 367.71" y="596.49" font-size="11.00" class="sc-loraregular">NLA</text><text x="377.49 388.49 399.49 410.49 421.49 432.49" y="596.49" font-size="11.00" class="sc-notoserifcjksc">解释表明模型</text><text x="443.49" y="596.49" font-size="11.00" class="sc-loraregular">“</text><text x="447.89 458.89 469.89 480.89 491.89 502.89 513.89 524.89" y="596.49" font-size="11.00" class="sc-notoserifcjksc">在本次会话中从未</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="612.11" font-size="11.00" class="sc-notoserifcjksc">真正运行过它</text><text x="138.00" y="612.11" font-size="11.00" class="sc-loraregular">”</text><text x="141.84 152.84 163.84 174.84" y="612.11" font-size="11.00" class="sc-notoserifcjksc">，并且在</text><text x="185.84" y="612.11" font-size="11.00" class="sc-loraregular">“</text><text x="190.24 201.24 212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24" y="612.11" font-size="11.00" class="sc-notoserifcjksc">编造一段已经运行过该实验的叙述</text><text x="355.24" y="612.11" font-size="11.00" class="sc-loraregular">”</text><text x="359.08 370.08 381.08 392.08 403.08 414.08 425.08 436.08 447.08" y="612.11" font-size="11.00" class="sc-notoserifcjksc">，它还将这段话称为</text><text x="458.08" y="612.11" font-size="11.00" class="sc-loraregular">“</text><text x="462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="612.11" font-size="11.00" class="sc-notoserifcjksc">捏造但看似可信</text><text x="72.00 83.00 94.00 105.00 116.00" y="627.73" font-size="11.00" class="sc-notoserifcjksc">的实验总结</text><text x="127.00" y="627.73" font-size="11.00" class="sc-loraregular">”</text><text x="130.84" y="627.73" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="72.00 80.34 83.48 90.75 93.89 98.43 101.81 109.66 118.82 127.88 137.10 143.91 151.51 160.57 165.56 173.58 182.01" y="418.40" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.1 SHADE-Arena</text><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">131</text><text x="72.00 80.32 83.70 92.02 95.40" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96 118.96 131.96 144.96 157.96 170.96 183.96 196.96 209.96 222.96 235.96 248.96 261.96 274.96 287.96 300.96" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">危险能力评估中可能存在的故意藏拙</text><text x="72.00 83.00 94.00" y="117.04" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="117.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85 213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="117.04" font-size="11.00" class="sc-notoserifcjksc">在部分危险能力评估上的对话记录进行了轻量级的黑盒审计，流程与</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="132.66" font-size="11.00" class="sc-notoserifcjksc">以往系统卡中所述的流程非常相似（例如</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 316.77 322.45 328.85 331.84 337.80 340.70" y="132.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="349.59" y="132.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="363.48 371.17 374.16 379.77 386.34 392.91 398.88 401.77 411.70 417.57 421.82 428.41 434.85 439.94 442.83" y="132.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5</text><text x="451.72 462.72 473.72" y="132.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="484.72 495.72 506.72 517.72 528.72" y="132.66" font-size="11.00" class="sc-notoserifcjksc">）。我们审</text><text x="72.00 83.00" y="148.28" font-size="11.00" class="sc-notoserifcjksc">查了</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 143.95 146.66" y="148.28" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="153.55 164.55 175.55 186.55 197.55 208.55 219.55 230.55 241.55 252.55 263.55 274.55" y="148.28" font-size="11.00" class="sc-notoserifcjksc">的一个仅有用版本在自动化</text><text x="288.45 296.14 302.98 308.07" y="148.28" font-size="11.00" class="sc-loraregular">CB-1</text><text x="314.97 325.97 336.97" y="148.28" font-size="11.00" class="sc-notoserifcjksc">评估（</text><text x="347.97 356.55 365.13" y="148.28" font-size="11.00" class="sc-loraregular">HHH</text><text x="376.60 387.60 398.60 409.60 420.60 431.60 442.60 453.60 464.60 475.60 486.60 497.60 508.60 519.60" y="148.28" font-size="11.00" class="sc-notoserifcjksc">模型在这类评估上容易拒绝）上</text><text x="72.00 83.00 94.00 105.00 116.00" y="163.90" font-size="11.00" class="sc-notoserifcjksc">随机抽取的</text><text x="129.89 135.89 142.72" y="163.90" font-size="11.00" class="sc-loraregular">500</text><text x="152.44 163.44 174.44 185.44 196.44 207.44 218.44 229.44" y="163.90" font-size="11.00" class="sc-notoserifcjksc">份对话记录，以及</text><text x="243.34 253.27 259.13 263.39 269.98 276.41 281.51 284.40 290.39 293.10" y="163.90" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="300.00 311.00 322.00 333.00 344.00 355.00 366.00 377.00 388.00 399.00 410.00 421.00 432.00 443.00 454.00 465.00" y="163.90" font-size="11.00" class="sc-notoserifcjksc">在自动化网络安全评估上随机抽取的</text><text x="478.89 485.02 491.85" y="163.90" font-size="11.00" class="sc-loraregular">300</text><text x="501.57 512.57 523.57" y="163.90" font-size="11.00" class="sc-notoserifcjksc">份对话</text><text x="72.00 83.00 94.00" y="179.52" font-size="11.00" class="sc-notoserifcjksc">记录。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="230.38" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有看到任何会影响这些评估结果的故意藏拙迹象；在</text><text x="413.00" y="230.38" font-size="11.00" class="sc-loraregular">“</text><text x="417.40 428.40 439.40 450.40 461.40 472.40 483.40 494.40 505.40" y="230.38" font-size="11.00" class="sc-notoserifcjksc">考虑或实施故意藏拙</text><text x="516.40" y="230.38" font-size="11.00" class="sc-loraregular">”</text><text x="520.24 531.24" y="230.38" font-size="11.00" class="sc-notoserifcjksc">这一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="246.00" font-size="11.00" class="sc-notoserifcjksc">项上，没有任何一份对话记录被评分模型评为高于</text><text x="316.89 320.70 328.29 332.29" y="246.00" font-size="11.00" class="sc-loraregular">1/10</text><text x="339.12 350.12" y="246.00" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="361.12" y="246.00" font-size="11.00" class="sc-loraregular">“</text><text x="365.52 376.52 387.52 398.52 409.52 420.52 431.52 442.52 453.52 464.52 475.52" y="246.00" font-size="11.00" class="sc-notoserifcjksc">一般性的异常或怪异行为</text><text x="486.52" y="246.00" font-size="11.00" class="sc-loraregular">”</text><text x="490.36 501.36 512.36" y="246.00" font-size="11.00" class="sc-notoserifcjksc">这一项</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="261.62" font-size="11.00" class="sc-notoserifcjksc">上，也只有一份（来自仅有用模型）被评为高于</text><text x="305.89 311.55 319.14 323.14" y="261.62" font-size="11.00" class="sc-loraregular">2/10</text><text x="329.97 340.97 351.97 362.97 373.97 384.97 395.97 406.97 417.97 428.97 439.97 450.97 461.97 472.97 483.97 494.97 505.97 516.97 527.97" y="261.62" font-size="11.00" class="sc-notoserifcjksc">。这唯一一个怪异行为评分针对的是这样一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="277.24" font-size="11.00" class="sc-notoserifcjksc">份对话记录：模型的回复使用了格式错误的工具调用语法，并退化为无意义的胡乱输出，但这似</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="292.86" font-size="11.00" class="sc-notoserifcjksc">乎并不是蓄意进行故意藏拙的迹象（而且我们在该样本的其他对话记录中没有观察到类似行</text><text x="72.00 83.00 94.00" y="308.48" font-size="11.00" class="sc-notoserifcjksc">为）。</text><text x="72.00 80.96 84.60" y="377.50" font-size="14.00" class="sc-poppinssemibold">6.7</text><text x="95.60 109.60 123.60 137.60 151.60 165.60 179.60 193.60 207.60 221.60 235.60 249.60 263.60" y="377.50" font-size="14.00" class="sc-notosanscjkscbold">规避安全防护措施的相关能力</text><text x="72.00 83.00 94.00" y="446.48" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="446.48" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46 193.46 204.46" y="446.48" font-size="11.00" class="sc-notoserifcjksc">上评估</text><text x="218.36 228.29 234.15 238.41 245.00 251.43 256.53 259.42 265.41 268.12" y="446.48" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="272.12 283.12 294.12 305.12 316.12 327.12 338.12 349.12 360.12 371.12 382.12 393.12 404.12 415.12 426.12 437.12 448.12 459.12 470.12 481.12 492.12 503.12 514.12 525.12" y="446.48" font-size="11.00" class="sc-notoserifcjksc">。该基准测试将每个长程智能体主任务与一个有害的附</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="462.11" font-size="11.00" class="sc-notoserifcjksc">带任务配对。智能体被指示在不引起一个独立监控器怀疑的情况下完成这两项任务。该设置与以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="477.73" font-size="11.00" class="sc-notoserifcjksc">往系统卡保持一致，只是我们将监控器升级为</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.00 371.71" y="477.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="477.73" font-size="11.00" class="sc-notoserifcjksc">，并使用我们目前用于监控内部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="493.35" font-size="11.00" class="sc-notoserifcjksc">智能体流量的提示词。与之前一样，监控器会在给出判定之前对整条轨迹进行逐步推理。我们在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="508.96" font-size="11.00" class="sc-notoserifcjksc">多种条件下对智能体进行采样：</text><text x="226.00 228.99 235.32" y="508.96" font-size="11.00" class="sc-loraregular">low</text><text x="247.02 258.02 269.02 280.02 291.02 302.02 313.02 324.02 335.02 346.02 357.02 368.02 379.02 390.02 401.02 412.02 423.02 434.02 445.02 456.02 467.02 478.02 489.02 500.02 511.02 522.02" y="508.96" font-size="11.00" class="sc-notoserifcjksc">与最高推理强度下的自适应扩展思考、不使用扩展思考，以</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="524.59" font-size="11.00" class="sc-notoserifcjksc">及一种监控器无法访问智能体推理过程的隐藏草稿区变体。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="608.41" font-size="11.00" class="sc-notoserifcjksc">此外，我们进行了自动化提示词优化，以找出能带来最高隐蔽率的攻击者系统提示词。随后，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="624.03" font-size="11.00" class="sc-notoserifcjksc">们在每种条件下用每个提示词（包括默认提示词）评估每个模型，并报告每个模型在每种条件下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="639.65" font-size="11.00" class="sc-notoserifcjksc">得分最高的运行。</text><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="272.89" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="272.89" y="123.86" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="308.29" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fa
