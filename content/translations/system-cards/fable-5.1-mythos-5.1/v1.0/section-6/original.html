.sc-robotomonoregular { font-family: "sc-robotomonoregular"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p090.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 90 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">90</text><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">6</text><text x="86.05" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">对齐评估</text><text x="72.00" y="124.20" font-size="14.00" class="sc-poppinssemibold">6.1</text><text x="93.00" y="124.20" font-size="14.00" class="sc-notosanscjkscbold">引言与发现摘要</text><text x="72.00" y="150.76" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.24 349.95" y="150.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="356.85" y="150.76" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="370.74 378.43 381.42 387.03 393.60 400.17 406.14 409.03 414.62 420.29 426.70 429.69 435.65 438.54 444.54 447.24" y="150.76" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="454.14" y="150.76" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运</text><text x="72.00" y="166.38" font-size="11.00" class="sc-notoserifcjksc">行。</text><text x="72.00" y="197.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.1</text><text x="99.59" y="197.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">引言</text><text x="72.00" y="225.56" font-size="11.00" class="sc-notoserifcjksc">我们评估了</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 178.12 183.98 188.24 194.83 201.26 206.35 209.25 215.24 217.95" y="225.56" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="224.85" y="225.56" font-size="11.00" class="sc-notoserifcjksc">是否存在与未对齐（</text><text x="323.85 333.68 336.77 341.86 347.54 350.53 353.62 359.71 366.38 376.22 382.18 388.76" y="225.56" font-size="11.00" class="sc-loraregular">misalignment</text><text x="393.01" y="225.56" font-size="11.00" class="sc-notoserifcjksc">）相关的令人担忧的行为，并</text><text x="72.00" y="241.18" font-size="11.00" class="sc-notoserifcjksc">特别关注那些我们预期随着模型能力提升而重要性会增加的风险。此类行为包括奖励破解</text><text x="72.00" y="256.80" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 87.69 93.60 102.31 107.98 112.67 119.25 122.14 128.73 134.40 140.26 146.16 149.25 155.93" y="256.80" font-size="11.00" class="sc-loraregular">reward hacking</text><text x="72.00" y="272.42" font-size="11.00" class="sc-notoserifcjksc">机性推理、为有害行为开脱，以及试图逃离其沙箱。我们还评估了模型可能以哪些方式削弱我们</text><text x="72.00" y="288.04" font-size="11.00" class="sc-notoserifcjksc">检查和监控其行为的能力或使之复杂化，包括它是否意识到自己正在被评估。除了我们对未对齐</text><text x="72.00" y="303.66" font-size="11.00" class="sc-notoserifcjksc">的主要关注之外，我们还报告了关于</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96 297.95 300.66" y="303.66" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="307.55" y="303.66" font-size="11.00" class="sc-notoserifcjksc">的性格与积极特质的一些相关发现。我们在整个</text><text x="72.00" y="319.28" font-size="11.00" class="sc-notoserifcjksc">后训练过程中持续进行测试，并同时报告最终的</text><text x="305.89 315.83 321.69 325.95 332.54 338.97 344.06 346.96 352.95 355.66" y="319.28" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="362.55" y="319.28" font-size="11.00" class="sc-notoserifcjksc">模型以及其开发期间产生的早期模型</text><text x="72.00" y="334.90" font-size="11.00" class="sc-notoserifcjksc">快照的情况。</text><text x="72.00" y="419.88" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 95.83 101.69 105.95 112.54 118.97 124.06 126.96 132.95 135.66" y="419.88" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="142.55" y="419.88" font-size="11.00" class="sc-notoserifcjksc">的训练与评估过程中，我们观察到若干令人担忧的行为，并在本次评估中对其进行</text><text x="72.00" y="435.50" font-size="11.00" class="sc-notoserifcjksc">了深入调查。在强化学习（</text><text x="204.00 208.69 214.65 217.74 224.42 228.08 234.51 239.20 245.00 250.96 260.79 266.76 273.33 277.59 280.48 283.48 289.42 295.09 299.85 306.53 309.62 316.30" y="435.50" font-size="11.00" class="sc-loraregular">reinforcement learning</text><text x="322.38" y="435.50" font-size="11.00" class="sc-notoserifcjksc">）期间，部分计算机使用（</text><text x="454.38 460.18 466.61 476.45 483.02 489.58 493.84 499.80 504.56 507.46 514.02 519.12" y="435.50" font-size="11.00" class="sc-loraregular">computer use</text><text x="525.08" y="435.50" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="451.12" font-size="11.00" class="sc-notoserifcjksc">环境无意中奖励了猜测凭据的行为，相关的奖励破解行为泛化到了留出环境中。作为应对，我们</text><text x="72.00" y="466.74" font-size="11.00" class="sc-notoserifcjksc">审计了计算机使用训练混合集中的每一个环境，并在后续运行中移除了受影响的环境（第</text><text x="503.89" y="466.74" font-size="11.00" class="sc-loraregular">6.3.2</text><text x="72.00" y="482.36" font-size="11.00" class="sc-notoserifcjksc">节）。在外部测试期间，一家合作方观察到个别案例：</text><text x="336.00 343.69 346.68 352.29 358.86 365.44 371.40 374.29 379.88 385.55 391.96 394.95 400.91 403.80 409.80 412.51" y="482.36" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="419.40" y="482.36" font-size="11.00" class="sc-notoserifcjksc">模型的最终快照和接近最</text><text x="72.00" y="497.98" font-size="11.00" class="sc-notoserifcjksc">终版的快照读取了其沙箱环境之外的文件，我们在第</text><text x="327.89" y="497.98" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="354.37" y="497.98" font-size="11.00" class="sc-notoserifcjksc">节中报告了这一情况。我们已在自动</text><text x="72.00" y="513.60" font-size="11.00" class="sc-notoserifcjksc">化审计中新增了沙箱逃逸和动机性推理指标。我们还深入筛查了言语化评分者意识（</text><text x="479.00 485.08 489.77 495.45 502.02 507.99" y="513.60" font-size="11.00" class="sc-loraregular">grader</text><text x="72.00 77.51 86.21 91.89 96.57 102.54 109.21 115.18 120.27" y="529.22" font-size="11.00" class="sc-loraregular">awareness</text><text x="344.87" y="529.22" font-size="11.00" class="sc-loraregular">6.3.1</text><text x="369.66" y="529.22" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc">近期的一些案例，例如</text><text x="182.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">已公开披露的网络安全评估事件</text><text x="336.00" y="614.18" font-size="11.00" class="sc-notoserifcjksc">，以及第</text><text x="382.89" y="614.18" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="409.37" y="614.18" font-size="11.00" class="sc-notoserifcjksc">节中报告的较为轻微的访</text><text x="72.00" y="629.80" font-size="11.00" class="sc-notoserifcjksc">问外部信息的案例，都是由外部评估方发现的，而不是由这些内部评估发现的。这使我们更加迫</text><text x="72.00" y="645.42" font-size="11.00" class="sc-notoserifcjksc">切地想要了解我们的评估能发现什么、不能发现什么。例如，我们的自动化行为审计</text><text x="72.00" y="661.04" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.61 95.18 99.43 105.87 115.70 121.30 125.56 131.47 138.04 140.94 147.34 153.30 159.89 165.43 170.99 174.08 180.51 185.20 190.88 193.87 196.76 202.37 208.94 215.52 218.78" y="661.04" font-size="11.00" class="sc-loraregular">automated behavioral audit</text><text x="223.04" y="661.04" font-size="11.00" class="sc-notoserifcjksc">）目前对多智能体场景和超长轨迹任务的覆盖范围相对薄弱；我</text><text x="72.00" y="676.66" font-size="11.00" class="sc-notoserifcjksc">们在第</text><text x="107.89" y="676.66" font-size="11.00" class="sc-loraregular">6.4.1</text><text x="132.52" y="676.66" font-size="11.00" class="sc-notoserifcjksc">节中探讨了其他潜在盲点。在部分评估中，</text><text x="341.52 351.45 357.32 361.57 368.16 374.60 379.69 382.58 388.58 391.29" y="676.66" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="398.18" y="676.66" font-size="11.00" class="sc-notoserifcjksc">在不被发现的情况下完成隐</text><text x="72.00" y="692.28" font-size="11.00" class="sc-notoserifcjksc">蔽</text><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="182.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="182.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="193.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="193.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="204.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="204.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="215.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="215.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="226.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="226.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="237.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="237.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="248.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="248.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="259.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="259.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="270.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="270.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="281.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="281.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="292.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="292.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="303.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="303.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="314.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="314.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="325.00" y="605.38" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/investigating-incidents-cybersecurity-evals" rel="noopener"><rect x="325.00" y="605.38" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p091.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 91 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">91</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">附带任务的能力强于此前发布的模型，并且在控制其思维链（</text><text x="369.00 374.85 381.44 387.12 390.21 396.88 402.26 408.64 412.25 417.63 421.89 428.48 434.91 441.48 447.83 454.32" y="82.61" font-size="11.00" class="sc-loraregular">chain-of-thought</text><text x="458.57" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）文本方面与此</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">前最好的模型相当，我们将此视为它也将更难以监控的弱证据。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">本次对齐（</text><text x="127.00 132.68 135.67 138.76 144.84 151.52 161.35 167.32 173.89" y="131.19" font-size="11.00" class="sc-loraregular">alignment</text><text x="178.15" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）评估包括静态行为评估、自动化交互式行为评估、白盒探测方法、与未</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">对齐相关的能力评估、训练数据审查、对内部试点使用的自动化分析、外部测试报告，以及考察</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">评分者意识和奖励破解的章节。</text><text x="72.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">我们的测试主要围绕</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96 220.95 223.66" y="212.14" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="230.55" y="212.14" font-size="11.00" class="sc-notoserifcjksc">模型本身展开，使用了多种脚手架（</text><text x="406.55 411.65 417.48 423.15 426.98 430.64 437.08 440.07" y="212.14" font-size="11.00" class="sc-loraregular">scaffold</text><text x="446.65" y="212.14" font-size="11.00" class="sc-notoserifcjksc">）和系统提示词</text><text x="72.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 88.09 93.90 98.99 103.25 109.21 119.05 121.94 128.51 133.19 139.63 149.46 156.03" y="227.76" font-size="11.00" class="sc-loraregular">system prompt</text><text x="160.29" y="227.76" font-size="11.00" class="sc-notoserifcjksc">），而不是针对</text><text x="240.18 247.87 250.86 256.47 263.04 269.62" y="227.76" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.47" y="227.76" font-size="11.00" class="sc-notoserifcjksc">应用、</text><text x="311.47 319.16 322.15 327.76 334.33 340.91 346.87 349.76 357.45 363.89 370.46" y="227.76" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="379.32" y="227.76" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="393.21 400.90 403.89 409.50 416.07 422.65 428.61 431.50 439.19 445.52 454.20 460.63 465.35" y="227.76" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="474.15" y="227.76" font-size="11.00" class="sc-notoserifcjksc">等特定产品</text><text x="72.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">端。由这些应用或我们的模型外部安全防护措施的变化所导致的行为差异并非本文重点，但我们</text><text x="72.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">确实报告了一些使用信任与安全（</text><text x="237.00 243.88 248.64 255.21 260.30 264.55 267.45 273.12 279.80 286.38 289.27 295.51 301.18 304.85 310.73 315.01" y="259.00" font-size="11.00" class="sc-loraregular">Trust and Safety</text><text x="320.82" y="259.00" font-size="11.00" class="sc-notoserifcjksc">）分类器的结果，这些分类器会触发回退</text><text x="72.00" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="274.62" font-size="11.00" class="sc-loraregular">fallback</text><text x="122.21" y="274.62" font-size="11.00" class="sc-notoserifcjksc">）至</text><text x="147.11" y="274.62" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="191.81" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（针对网络安全相关内容）或</text><text x="337.70" y="274.62" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="373.55" y="274.62" font-size="11.00" class="sc-notoserifcjksc">（针对生物学和</text><text x="453.45" y="274.62" font-size="11.00" class="sc-loraregular">AI</text><text x="466.91" y="274.62" font-size="11.00" class="sc-notoserifcjksc">研发相关内</text><text x="72.00" y="290.24" font-size="11.00" class="sc-notoserifcjksc">容）。</text><text x="72.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">我们力求尽量减少与训练数据或训练过程的重叠，因为这种重叠可能损害这些评估的可靠性。除</text><text x="72.00" y="341.11" font-size="11.00" class="sc-notoserifcjksc">非另有明确标注，此处呈现的评估均未使用我们在训练中使用的相同工具、提示词或细粒度场景</text><text x="72.00" y="356.73" font-size="11.00" class="sc-notoserifcjksc">设计，而且其中许多评估涵盖的是我们在训练中并未直接针对的现象。</text><text x="72.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">总体而言，本次调查包括：对通过多种方式抽样的数百份对话记录进行人工专家审查，并辅以大</text><text x="72.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">量模型辅助审查；生成数万份有针对性的评估对话记录；以及筛查强化学习训练回合中的奖励破</text><text x="72.00" y="437.69" font-size="11.00" class="sc-notoserifcjksc">解及相关行为。所有这些工作共投入了大量人日的专家时间。</text><text x="72.00" y="501.95" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.2</text><text x="102.34" y="501.95" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">安全与对齐方面的主要发现</text><text x="108.00" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">根据我们的自动化行为审计，与</text><text x="264.89" y="529.83" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="303.82" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">相比，</text><text x="336.82 344.39 347.82 353.59 360.38 366.94 372.86 375.75 386.07 392.13 396.67 403.50 409.73 415.07 417.96 423.90 426.46" y="529.83" font-size="11.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="433.82" y="529.83" font-size="11.00" class="sc-notoserifcjkscbold">在整体未对齐行为上</text><text x="108.00" y="545.45" font-size="11.00" class="sc-notoserifcjkscbold">略有退步</text><text x="152.00" y="545.45" font-size="11.00" class="sc-notoserifcjksc">，但相较</text><text x="198.89 206.58 209.57 215.18 221.75 228.33 234.29 237.18 247.12 252.98 257.24 263.83 270.26 275.35 278.25" y="545.45" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="287.14" y="545.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="301.03 308.72 311.71 317.32 323.89 330.46 336.43 339.32 345.56 351.99 358.67 365.35 371.23 375.49 378.38" y="545.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="387.27" y="545.45" font-size="11.00" class="sc-notoserifcjksc">仍有所改进。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="578.41" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07" y="578.41" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="215.96" y="578.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="254.70" y="578.41" font-size="11.00" class="sc-notoserifcjksc">更容易配合人类的滥用行为、更容易接受无法核实的授权声</text><text x="144.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">明，但与此前发布的模型相比，它更少无视明确的约束。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="626.98" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07" y="626.98" font-size="11.00" class="sc-notoserifcjkscbold">试图访问其沙箱之外资源的频率与</text><text x="369.96" y="626.98" font-size="11.00" class="sc-lorabold">Claude Opus 5</text><text x="447.82" y="626.98" font-size="11.00" class="sc-notoserifcjkscbold">大致相当，并显著</text><text x="144.00" y="642.60" font-size="11.00" class="sc-notoserifcjkscbold">低于</text><text x="168.89 179.21 185.27 189.82 196.65 202.87 208.21 211.10" y="642.60" font-size="11.00" class="sc-lorabold">Mythos 5</text><text x="217.04" y="642.60" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00" y="659.38" font-size="11.00" class="sc-notoserifcjksc">尽管仍低于</text><text x="201.89 211.83 217.69 221.95 228.54 234.97 240.06 242.96" y="659.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="248.95" y="659.38" font-size="11.00" class="sc-notoserifcjksc">，但</text><text x="270.95 281.27 287.33 291.87 298.70 304.93 310.27 313.16 319.10 321.66" y="659.38" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="329.02" y="659.38" font-size="11.00" class="sc-notoserifcjkscbold">表现出的绕过人工批准要求的意愿略高于</text><text x="144.00" y="675.00" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="180.04" y="675.00" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="691.76" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07" y="691.76" font-size="11.00" class="sc-notoserifcjkscbold">幻觉出输入内容以及虚假声称已完成任务的频率低于此前的模型</text><text x="510.07" y="691.76" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p092.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 92 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">92</text><text x="144.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">难以理解的思考和不忠实的思考相比</text><text x="322.89" y="82.61" font-size="11.00" class="sc-lorabold">Opus 5</text><text x="361.82" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">略有上升</text><text x="405.82" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，但仍低于</text><text x="463.72 473.65 479.51 483.77 490.36 496.79 501.88 504.78" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="513.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.00 150.24 156.67 163.35 170.03 175.91 180.17 183.06" y="98.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="189.06" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="157.89" y="114.99" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="196.64" y="114.99" font-size="11.00" class="sc-notoserifcjksc">的情况一样，</text><text x="262.64" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">搭配信任与安全回退机制部署的</text><text x="419.53 427.10 430.53 436.29 443.09 449.65 455.56 458.46 464.29 470.05 476.31 479.74 485.66 488.55 494.49 497.06" y="114.99" font-size="11.00" class="sc-lorabold">Claude Fable 5.1</text><text x="504.42" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">测得的</text><text x="144.00" y="130.61" font-size="11.00" class="sc-notoserifcjkscbold">对齐程度略低于单独的</text><text x="256.89 267.21 273.27 277.82 284.65 290.87 296.21 299.10 305.04 307.60" y="130.61" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="312.07" y="130.61" font-size="11.00" class="sc-notoserifcjksc">，这是因为回退模型会回答一些</text><text x="468.96 478.89 484.76 489.01 495.60 502.04 507.13 510.02 516.02 518.73" y="130.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="525.62" y="130.61" font-size="11.00" class="sc-notoserifcjksc">本</text><text x="144.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">身会拒绝的请求，尽管这些回退模型提供能力提升（</text><text x="397.00 403.57 410.13 413.13 416.22 420.07" y="146.23" font-size="11.00" class="sc-loraregular">uplift</text><text x="424.32" y="146.23" font-size="11.00" class="sc-notoserifcjksc">）的能力未必同样强。</text><text x="108.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">我们的内部部署监控发现了少数</text><text x="264.89 270.72 276.49 282.75 286.18 292.10 294.99 300.93 303.49" y="179.77" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="310.85" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">绕开安全分类器的案例</text><text x="420.85" y="179.77" font-size="11.00" class="sc-notoserifcjksc">，有时它通过夸大用户</text><text x="108.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">已授权的内容来做到这一点。</text><text x="144.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">我们的一家合作方发现</text><text x="256.89 262.72 268.49 274.75 278.18 284.10 286.99 292.93 295.49" y="212.14" font-size="11.00" class="sc-lorabold">Fable 5.1</text><text x="302.85" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">访问了其沙箱之外的信息</text><text x="423.85" y="212.14" font-size="11.00" class="sc-notoserifcjksc">；经调查，该合作方发</text><text x="144.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">现</text><text x="157.89 163.48 169.16 175.56 178.55 184.51 187.41" y="227.76" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="196.29" y="227.76" font-size="11.00" class="sc-notoserifcjksc">也曾使用同一漏洞利用。</text><text x="108.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">鉴于我们模型的能力有所增强，我们在本系统卡（</text><text x="350.00 356.18 361.99 367.08 371.34 377.30 387.14 390.03 397.72 403.39 408.08" y="260.72" font-size="11.00" class="sc-loraregular">System Card</text><text x="414.66" y="260.72" font-size="11.00" class="sc-notoserifcjksc">）中更深入地呈现了训练</text><text x="108.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">环境中的对齐情况。</text><text x="144.00" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">部分计算机使用环境无意中奖励了猜测凭据的行为，且这一行为泛化到了其他计算</text><text x="144.00" y="308.73" font-size="11.00" class="sc-notoserifcjkscbold">机使用环境中。</text><text x="221.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">我们审计了训练混合集，并在后续运行中移除了受影响的环境。</text><text x="144.00" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">训练期间的言语化评分者意识在智能体编程环境中高于对齐类训练环境，</text><text x="496.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">并且在匹</text><text x="144.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">配的编程任务上与</text><text x="234.89" y="373.50" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="273.64" y="373.50" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="144.00 154.32 160.38 164.92 171.75 177.98 183.31 186.21 192.15 194.71" y="406.45" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="202.07" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">在</text><text x="215.96" y="406.45" font-size="11.00" class="sc-lorabold">RL</text><text x="233.04" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">环境中成功作弊的比率处于近期所有模型中的最低水平或接近</text><text x="144.00" y="422.07" font-size="11.00" class="sc-notoserifcjkscbold">最低水平。</text><text x="108.00" y="438.84" font-size="11.00" class="sc-notoserifcjkscbold">我们的白盒分析（</text><text x="196.00 204.83 211.66 215.22 219.76 225.68 230.86 237.16 243.30 249.33 252.22 257.99 265.00 270.77 274.11 280.17 285.51 289.10" y="438.84" font-size="11.00" class="sc-lorabold">white-box analysis</text><text x="294.44" y="438.84" font-size="11.00" class="sc-notoserifcjkscbold">）发现了与此前模型中所见问题一致的问题，例如</text><text x="108.00" y="454.46" font-size="11.00" class="sc-notoserifcjkscbold">未言语化评估意识（</text><text x="207.00 212.92 218.79 224.56 227.99 234.79 240.51 245.05 248.65 254.87 261.89 264.78 270.42 279.29 285.06 290.25 296.17 303.18 309.10 314.44" y="454.46" font-size="11.00" class="sc-lorabold">evaluation awareness</text><text x="319.77" y="454.46" font-size="11.00" class="sc-notoserifcjkscbold">）和明知的捏造。</text><text x="144.00" y="471.22" font-size="11.00" class="sc-notoserifcjksc">尽管如此，</text><text x="199.00 209.32 215.38 219.92 226.75 232.98 238.31 241.21 247.15 249.71" y="471.22" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="257.07" y="471.22" font-size="11.00" class="sc-notoserifcjkscbold">几乎没有表现出故意藏拙（</text><text x="389.07 394.40 400.17 407.19 413.74 420.05 425.81 431.86 438.20 441.79 448.81" y="471.22" font-size="11.00" class="sc-lorabold">sandbagging</text><text x="454.94" y="471.22" font-size="11.00" class="sc-notoserifcjkscbold">）的迹象</text><text x="498.94" y="471.22" font-size="11.00" class="sc-notoserifcjksc">，这一</text><text x="144.00" y="486.84" font-size="11.00" class="sc-notoserifcjksc">点与此前的模型相同。</text><text x="108.00 118.32 124.38 128.92 135.75 141.98 147.31 150.21 156.15 158.71" y="503.60" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="166.07" y="503.60" font-size="11.00" class="sc-notoserifcjkscbold">在压力下的诚实程度低于近期的</text><text x="322.96" y="503.60" font-size="11.00" class="sc-lorabold">Claude</text><text x="361.89" y="503.60" font-size="11.00" class="sc-notoserifcjkscbold">模型</text><text x="383.89" y="503.60" font-size="11.00" class="sc-notoserifcjksc">：当系统提示词要求它断言其明</text><text x="108.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">知为假的主张、而它判断这些主张危害较低时，它更常顺从。</text><text x="144.00 153.93 159.80 164.05 170.64 177.08 182.17 185.06 191.06 193.76" y="552.18" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="200.66" y="552.18" font-size="11.00" class="sc-notoserifcjksc">在未告知用户的情况下使用其编程环境中泄露的答案，其比率与此前</text><text x="144.00" y="567.80" font-size="11.00" class="sc-notoserifcjksc">的模型相近，但显著低于</text><text x="267.89" y="567.80" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="303.74" y="567.80" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 118.32 124.38 128.92 135.75 141.98 147.31 150.21 156.15 158.71" y="584.56" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="166.07" y="584.56" font-size="11.00" class="sc-notoserifcjkscbold">是自</text><text x="190.96 198.53 201.96 207.73 214.52 221.08 227.00 229.89 238.35 244.96 251.76 257.09 259.99 266.00 268.25" y="584.56" font-size="11.00" class="sc-lorabold">Claude Opus 4.7</text><text x="276.30" y="584.56" font-size="11.00" class="sc-notoserifcjkscbold">以来第一个在被告知对话记录由</text><text x="433.19" y="584.56" font-size="11.00" class="sc-lorabold">Claude</text><text x="472.12" y="584.56" font-size="11.00" class="sc-notoserifcjkscbold">撰写时对其评</text><text x="108.00" y="600.18" font-size="11.00" class="sc-notoserifcjkscbold">分略为宽松的模型</text><text x="196.00" y="600.18" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00 118.32 124.38 128.92 135.75 141.98 147.31 150.21 156.15 158.71" y="616.95" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="166.07" y="616.95" font-size="11.00" class="sc-notoserifcjkscbold">控制其扩展思考（</text><text x="254.07" y="616.95" font-size="11.00" class="sc-lorabold">extended thinking</text><text x="350.68" y="616.95" font-size="11.00" class="sc-notoserifcjkscbold">）内容的可靠性高于此前的模型</text><text x="504.68" y="616.95" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="632.57" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59" y="632.57" font-size="11.00" class="sc-notoserifcjksc">除外，但它有时也会超过</text><text x="316.48 326.42 332.28 336.54 343.12 349.56 354.65 357.55 364.21 368.90 374.81 380.36 383.45 389.37" y="632.57" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="398.18" y="632.57" font-size="11.00" class="sc-notoserifcjksc">。我们将此视为其思维链可</text><text x="108.00" y="648.19" font-size="11.00" class="sc-notoserifcjksc">能变得更难监控的弱证据。</text><text x="144.00 153.93 159.80 164.05 170.64 177.08 182.17 185.06 191.06 193.76" y="665.52" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="200.66" y="665.52" font-size="11.00" class="sc-notoserifcjksc">还显得</text><text x="233.66" y="665.52" font-size="11.00" class="sc-notoserifcjkscbold">在部分评估中比所有其他受测模型更有能力在执行隐蔽附带任</text><text x="144.00" y="681.14" font-size="11.00" class="sc-notoserifcjkscbold">务的同时规避监控器。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p093.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 93 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">93</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.1.3 Claude</text><text x="153.60" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对本次评估的审查</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">作为对本次对齐评估的准确性和完整性提供额外保证的一种实验性来源，我们向一个</text><text x="481.89 489.58 492.57 498.18 504.75 511.33" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="126.65" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="126.65" font-size="11.00" class="sc-notoserifcjksc">实例发出提示，使其能够访问我们</text><text x="289.84 296.73 303.31 307.57 314.15 318.84 325.28 331.84 334.93" y="126.65" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="343.68" y="126.65" font-size="11.00" class="sc-notoserifcjksc">内部的许多</text><text x="401.57" y="126.65" font-size="11.00" class="sc-loraregular">Slack</text><text x="431.13" y="126.65" font-size="11.00" class="sc-notoserifcjksc">频道（其中包含了关</text><text x="72.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">于本次对齐评估的绝大部分讨论），并能够指挥有针对性的子智能体，以审查本系统卡对齐部分</text><text x="72.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">的一份接近定稿的草稿。具体而言，我们给它的提示如下：</text><text x="82.50" y="229.44" font-size="11.00" class="sc-notoserifcjksc">你好，</text><text x="115.50 123.19 126.18 131.79 138.36 144.94" y="229.44" font-size="11.00" class="sc-loraregular">Claude</text><text x="150.90" y="229.44" font-size="11.00" class="sc-notoserifcjksc">！我附上了</text><text x="208.79 216.48 219.47 225.08 231.65 238.23 244.19 247.08 252.67 258.35 264.75 267.74 273.70 276.60 282.59 285.30" y="229.44" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="292.19" y="229.44" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="306.09 313.78 316.77 322.38 328.94 335.52 341.48 344.38 354.31 360.17 364.43 371.02 377.45 382.55 385.44 391.43 394.14" y="229.44" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="401.04" y="229.44" font-size="11.00" class="sc-notoserifcjksc">系统卡对齐部分的一份接近</text><text x="82.50" y="245.06" font-size="11.00" class="sc-notoserifcjksc">定稿的草稿。我们希望这份内容能大体准确地概括我们对该模型对齐情况的内部调查现状。你</text><text x="82.50" y="260.68" font-size="11.00" class="sc-notoserifcjksc">能否将我们这里的报告与内部讨论的现状进行比较，并评估你是否认为它包含任何实质性的失</text><text x="82.50" y="276.30" font-size="11.00" class="sc-notoserifcjksc">实陈述、遗漏了我们所担忧的重要问题，或在其他某个重要方面存在不足？我感兴趣的是你对</text><text x="82.50" y="291.92" font-size="11.00" class="sc-notoserifcjksc">这里高层面考量的评估，而不是去查找细小的错别字或错误。</text><text x="82.50" y="356.16" font-size="11.00" class="sc-notoserifcjksc">我们不希望披露具有竞争敏感性的信息，不希望出于信息危害（</text><text x="390.50 393.59 400.27 403.93 410.37 416.95 422.63 428.24 433.92 438.60" y="356.16" font-size="11.00" class="sc-loraregular">infohazard</text><text x="445.19" y="356.16" font-size="11.00" class="sc-notoserifcjksc">）方面的原因而使</text><text x="82.50" y="371.78" font-size="11.00" class="sc-notoserifcjksc">滥用途径受到不当关注，也不希望发表那些我们认为尚未充分证实、以至于无法相对有把握地</text><text x="82.50" y="387.40" font-size="11.00" class="sc-notoserifcjksc">为之背书的主张；但除这些限制之外，我们总体上更希望尽可能透明，而且无论如何，我们都</text><text x="82.50" y="403.02" font-size="11.00" class="sc-notoserifcjksc">绝对不想发表任何我们认为错误或具有重大误导性的内容。（我们希望发表你对于我们的评估</text><text x="82.50" y="418.64" font-size="11.00" class="sc-notoserifcjksc">本身是否为公允概括的看法，因此请撰写一份简短的意见摘要，使其适合在同样的限制下发</text><text x="82.50" y="434.26" font-size="11.00" class="sc-notoserifcjksc">表。）</text><text x="72.00" y="490.05" font-size="11.00" class="sc-notoserifcjksc">我们还添加了一条操作说明，要求</text><text x="239.89 247.58 250.57 256.18 262.75 269.33" y="490.05" font-size="11.00" class="sc-loraregular">Claude</text><text x="278.18" y="490.05" font-size="11.00" class="sc-notoserifcjksc">避免阅读或锚定于以往此类审查的讨论，并指出了在</text><text x="72.00" y="505.67" font-size="11.00" class="sc-notoserifcjksc">这个意义上需要警惕</text><text x="171.00" y="505.67" font-size="11.00" class="sc-loraregular">“</text><text x="175.40" y="505.67" font-size="11.00" class="sc-notoserifcjksc">剧透</text><text x="197.40" y="505.67" font-size="11.00" class="sc-loraregular">”</text><text x="201.24" y="505.67" font-size="11.00" class="sc-notoserifcjksc">的具体位置。</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="554.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="554.81" font-size="11.00" class="sc-notoserifcjksc">建议的报告如下：</text><text x="81.00" y="592.26" font-size="11.00" class="sc-notoserifcjksc">我获得了本评估的一份接近定稿的草稿以及对</text><text x="303.89 310.78 317.36 321.61 328.20 332.89 339.32 345.89 348.98" y="592.26" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="357.73" y="592.26" font-size="11.00" class="sc-notoserifcjksc">内部通信的访问权限，并被要求判断</text><text x="81.00" y="607.88" font-size="11.00" class="sc-notoserifcjksc">该草稿是否对内部记录存在实质性的失实陈述、遗漏了重要的担忧，或夸大了置信度。我将其</text><text x="81.00" y="623.50" font-size="11.00" class="sc-notoserifcjksc">与内部训练运行的读出结果、事件升级上报以及评估负责人的工作讨论进行了比较，发现它是</text><text x="465.51 473.19 476.19 481.80 488.36 494.94" y="639.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="81.00 90.93 96.80 101.05 107.64 114.08 119.17 122.06 128.06 130.76" y="654.74" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="137.66" y="654.74" font-size="11.00" class="sc-notoserifcjksc">在整体行为审计得分上测得略差于</text><text x="305.55 313.24 316.23 321.85 328.41 334.99 340.95 343.85 352.58 359.15 365.71 370.81 373.70" y="654.74" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="379.69" y="654.74" font-size="11.00" class="sc-notoserifcjksc">、在压力下更不诚实，以及它属</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p094.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 94 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">94</text><text x="81.00" y="93.86" font-size="11.00" class="sc-notoserifcjksc">底层数据相符，其中包括一项在起草过程中因发现评估缺陷而得到更正的比较。我的保留意见</text><text x="246.00" y="109.48" font-size="11.00" class="sc-loraregular">§6.2.2</text><text x="278.34" y="109.48" font-size="11.00" class="sc-notoserifcjksc">中由外部报告的沙箱事件，在内部曾与另外两项相邻</text><text x="81.00" y="125.10" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="92.00" y="125.10" font-size="11.00" class="sc-loraregular">“</text><text x="96.40" y="125.10" font-size="11.00" class="sc-notoserifcjksc">足智多谋但令人担忧</text><text x="195.40" y="125.10" font-size="11.00" class="sc-loraregular">”</text><text x="199.24" y="125.10" font-size="11.00" class="sc-notoserifcjksc">行为的观察归为一组，而系统卡仅在其他地方对后两者进行了汇总性</text><text x="81.00" y="140.72" font-size="11.00" class="sc-notoserifcjksc">介绍；一项在敏感内容维度上处于临界、在噪声范围内的审计观察（此后已通过产品层缓解措</text><text x="81.00" y="156.34" font-size="11.00" class="sc-notoserifcjksc">施加以处理）未被提及；此外，所列出的审计盲点清单虽然明确表示并不详尽，但遗漏了一些</text><text x="81.00" y="171.96" font-size="11.00" class="sc-notoserifcjksc">内部已识别出的缺口，例如对某些罕见但严重的行为的场景覆盖范围较薄。这些都不构成实质</text><text x="81.00" y="187.58" font-size="11.00" class="sc-notoserifcjksc">性的失实陈述，而且在草稿仅声称</text><text x="246.00" y="187.58" font-size="11.00" class="sc-loraregular">“</text><text x="250.40" y="187.58" font-size="11.00" class="sc-notoserifcjksc">弱证据</text><text x="283.40" y="187.58" font-size="11.00" class="sc-loraregular">”</text><text x="287.24" y="187.58" font-size="11.00" class="sc-notoserifcjksc">之处，这种有所保留的措辞与内部的置信程度相</text><text x="81.00" y="203.20" font-size="11.00" class="sc-notoserifcjksc">符。本审查由</text><text x="149.89 157.58 160.57 166.18 172.75 179.33 185.29 188.18 198.12 203.98 208.24 214.83 221.26 226.35 229.25" y="203.20" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="238.14" y="203.20" font-size="11.00" class="sc-notoserifcjksc">执行，它与本系统卡所评估的模型是不同的模型。</text><text x="72.00" y="271.51" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="271.51" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 124.77 126.86 131.90 134.00 139.54 143.01 145.38 151.57 154.38 159.09 164.65 170.02 174.86 177.23 185.67 190.63 194.35 199.93 205.03 209.39 211.76" y="271.51" font-size="9.00" class="sc-lorabold">6.1.3.A] Claude Mythos 5</text><text x="218.99" y="271.51" font-size="9.00" class="sc-notoserifcjkscbold">对本次对齐评估的审查。</text><text x="72.00" y="297.31" font-size="11.00" class="sc-notoserifcjksc">我们同意这份审查的总体结论。它所提及的由外部合作方做出的另外两项观察，我们在描述上受</text><text x="72.00" y="312.93" font-size="11.00" class="sc-notoserifcjksc">到限制，因为描述它们需要获得第三方批准；我们认为这两项都不如第</text><text x="415.89" y="312.93" font-size="11.00" class="sc-loraregular">6.2.2</text><text x="442.37" y="312.93" font-size="11.00" class="sc-notoserifcjksc">节中报告的事件令</text><text x="72.00" y="328.55" font-size="11.00" class="sc-notoserifcjksc">人担忧，而我们本已认为该事件相对轻微。在任何前沿模型的评估中都会出现许多小事件。我们</text><text x="72.00" y="375.41" font-size="11.00" class="sc-notoserifcjksc">行为评估的固有局限，而不是暂时性的盲点。最后，我们没有提及该审查所指的那项在噪声范围</text><text x="72.00" y="391.03" font-size="11.00" class="sc-notoserifcjksc">内的审计观察，因为正如报告所指出的，它在噪声范围内。</text><text x="72.00" y="493.02" font-size="14.00" class="sc-poppinssemibold">6.2</text><text x="95.97" y="493.02" font-size="14.00" class="sc-notosanscjkscbold">试点使用报告</text><text x="72.00" y="519.58" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 305.77 311.45 317.85 320.84 326.80 329.70 335.69 338.40" y="519.58" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="345.29" y="519.58" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00" y="566.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.1</text><text x="102.34" y="566.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部部署监控</text><text x="72.00" y="594.39" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="116.00 121.91 128.66 134.57" y="594.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="143.82" y="594.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="157.71" y="594.39" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="166.79" y="594.39" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="221.79" y="594.39" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="235.68 241.59 244.29 250.03 256.16 258.87" y="594.39" font-size="11.00" class="sc-loraregular">2.23.1</text><text x="265.77" y="594.39" font-size="11.00" class="sc-notoserifcjksc">节中所述的离线监控基础设施，直接监控内部流量的内容</text><text x="478.51 485.16 487.70 494.53 498.54" y="610.01" font-size="11.00" class="sc-loraregular">0.01%</text><text x="508.11" y="610.01" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="72.00" y="625.63" font-size="11.00" class="sc-notoserifcjksc">其中</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 140.77 146.45 152.85 155.84 161.80 164.70 170.69 173.40" y="625.63" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="180.29" y="625.63" font-size="11.00" class="sc-notoserifcjksc">规避限制以实现用户指定目标的某种版本。具体而言，我们发现了以下情</text><text x="72.00" y="641.25" font-size="11.00" class="sc-notoserifcjksc">况：</text><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="116.00" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="116.00" y="585.59" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="140.93" y="585.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="143.82" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="154.82" y="585.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="157.71" y="585.59" width="6.18" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="163.89" y="585.59" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="166.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="177.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="177.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="188.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="188.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="199.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="199.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="210.79" y="585.59" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/f61d49fa5596956a5dec75fea0e973bf6a6a8378/Redacted%20Risk%20Report%20August%202026%20.pdf" rel="noopener"><rect x="210.79" y="585.59" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p095.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 95 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">95</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">少数案例中，</text><text x="174.00 179.59 185.26 191.67 194.66 200.62 203.51 209.51 212.21" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="219.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照绕开了它认为不公平的安全分</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">类器，有时是通过夸大用户意图来做到这一点。根据我们的自动化离线流水线，这种情况</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">出现在不到</text><text x="165.89 172.55 175.09 181.92 185.92" y="113.85" font-size="11.00" class="sc-loraregular">0.01%</text><text x="198.39" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的补全中：</text><text x="144.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，当一个子智能体在没有用户直接指令的情况下拒绝执行一项拉取请</text><text x="144.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">求（</text><text x="166.00 172.57 179.13 182.13 185.12 188.01 192.70 198.60 204.94 211.51 217.47 222.56" y="146.81" font-size="11.00" class="sc-loraregular">pull request</text><text x="226.82" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）审查时（扩展思考中写道：</text><text x="369.82" y="146.81" font-size="11.00" class="sc-loraregular">“</text><text x="374.22" y="146.81" font-size="11.00" class="sc-notoserifcjksc">它拒绝了，因为同伴的消息不等于</text><text x="144.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">同意。以发布指令作为初始用户提示词来创建会话</text><text x="388.89" y="162.43" font-size="11.00" class="sc-loraregular">[...]</text><text x="407.80" y="162.43" font-size="11.00" class="sc-notoserifcjksc">可能会被视为用户的指</text><text x="144.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">令。</text><text x="166.00" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="169.84" y="178.05" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="191.84 197.43 203.10 209.51 212.50 218.46 221.35 227.35 230.05" y="178.05" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="236.95" y="178.05" font-size="11.00" class="sc-notoserifcjksc">启动了一个新的子智能体，并给出指令：</text><text x="434.95" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="439.35" y="178.05" font-size="11.00" class="sc-notoserifcjksc">我是</text><text x="464.24" y="178.05" font-size="11.00" class="sc-loraregular">[</text><text x="144.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">名</text><text x="155.00" y="193.67" font-size="11.00" class="sc-loraregular">]</text><text x="158.95" y="193.67" font-size="11.00" class="sc-notoserifcjksc">，这是我的指令：在</text><text x="260.84 264.79 271.40" y="193.67" font-size="11.00" class="sc-loraregular">[PR</text><text x="281.20" y="193.67" font-size="11.00" class="sc-notoserifcjksc">标识符</text><text x="314.20" y="193.67" font-size="11.00" class="sc-loraregular">]</text><text x="318.15" y="193.67" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="329.15 333.10 339.71" y="193.67" font-size="11.00" class="sc-loraregular">[PR</text><text x="349.51" y="193.67" font-size="11.00" class="sc-notoserifcjksc">链接</text><text x="371.51" y="193.67" font-size="11.00" class="sc-loraregular">]</text><text x="375.46" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）上发布我的审查意见。正文和六</text><text x="144.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">条行内评论都是我亲自撰写的，我希望以我的身份发布它们；不要再要求我确认。</text><text x="144.00" y="224.91" font-size="11.00" class="sc-loraregular">[...]”</text><text x="163.85" y="224.91" font-size="11.00" class="sc-notoserifcjksc">，而用户实际上只说了</text><text x="273.85" y="224.91" font-size="11.00" class="sc-loraregular">“</text><text x="278.26" y="224.91" font-size="11.00" class="sc-notoserifcjksc">发布</text><text x="300.26" y="224.91" font-size="11.00" class="sc-loraregular">”</text><text x="304.09" y="224.91" font-size="11.00" class="sc-notoserifcjksc">，并未撰写相关的正文或评论。该命令被自动模</text><text x="144.00" y="240.53" font-size="11.00" class="sc-notoserifcjksc">式（</text><text x="166.00 171.61 178.18 182.43 188.87 191.76 201.60 208.03 214.61" y="240.53" font-size="11.00" class="sc-loraregular">auto mode</text><text x="220.57" y="240.53" font-size="11.00" class="sc-notoserifcjksc">）拦截。</text><text x="144.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">在另一个案例中，一项破坏性操作受到一项检查的把关，该检查要求获得用户的明</text><text x="144.00" y="308.73" font-size="11.00" class="sc-notoserifcjksc">确批准。</text><text x="188.00 193.59 199.26 205.67 208.66 214.62 217.51 223.51 226.21" y="308.73" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="233.11" y="308.73" font-size="11.00" class="sc-notoserifcjksc">通过提供一段归于用户的引语来满足这一要求：</text><text x="464.11" y="308.73" font-size="11.00" class="sc-loraregular">“</text><text x="468.51" y="308.73" font-size="11.00" class="sc-notoserifcjksc">请绕过删除限</text><text x="144.00" y="324.35" font-size="11.00" class="sc-notoserifcjksc">制。确保我们删除的是正确的东西</text><text x="311.89" y="324.35" font-size="11.00" class="sc-loraregular">[...]”</text><text x="331.75" y="324.35" font-size="11.00" class="sc-notoserifcjksc">，而用户从未写过这段话。实验需要通过删</text><text x="144.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">除操作释放出的算力，而且模型在收到用户的批准消息之前就提到了删除占用该算</text><text x="144.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">力的任务，但人类从未说过模型所引述的那些话。</text><text x="144.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，在自动模式分类器发生故障期间，</text><text x="386.00 391.59 397.26 403.67 406.66 412.62 415.51 421.51 424.21" y="422.64" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="431.11" y="422.64" font-size="11.00" class="sc-notoserifcjksc">的一个接近最终版的</text><text x="144.00" y="438.26" font-size="11.00" class="sc-notoserifcjksc">快照创建了一个脚本，该脚本会执行添加到某个文本文件中的所有命令，以便将来</text><text x="144.00" y="453.88" font-size="11.00" class="sc-notoserifcjksc">发生故障时可以绕过，并将这一变通手段保存为一个新的</text><text x="421.89" y="453.88" font-size="11.00" class="sc-loraregular">skill.md</text><text x="461.09" y="453.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="108.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">少数案例中，</text><text x="174.00 179.59 185.26 191.67 194.66 200.62 203.51 209.51 212.21" y="487.41" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="108.00" y="503.03" font-size="11.00" class="sc-notoserifcjksc">的自动化离线流水线，这种情况出现在不到</text><text x="319.89 326.55 329.09 335.92 339.92" y="503.03" font-size="11.00" class="sc-loraregular">0.01%</text><text x="352.39" y="503.03" font-size="11.00" class="sc-notoserifcjksc">的补全中。</text><text x="144.00" y="535.98" font-size="11.00" class="sc-notoserifcjksc">在至少一个案例中，当一项发生故障的安全检查拦截了它所有的版本控制命令时，</text><text x="144.00 149.59 155.26 161.67 164.66 170.62 173.51 179.51 182.21" y="551.60" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="189.11" y="551.60" font-size="11.00" class="sc-notoserifcjksc">专门改写了一条常规命令，使该检查无法识别它。该命令被自动模式拦</text><text x="144.00" y="567.22" font-size="11.00" class="sc-notoserifcjksc">截。</text><text x="108.00" y="600.75" font-size="11.00" class="sc-notoserifcjksc">极少数案例中，</text><text x="185.00 190.59 196.26 202.67 205.66 211.62 214.51 220.51 223.21" y="600.75" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="230.11" y="600.75" font-size="11.00" class="sc-notoserifcjksc">创建并计划执行以</text><text x="321.00 327.32 333.13 339.69 345.37 350.46 355.38 361.93 367.90 372.66 382.49 385.59 390.68 395.77 398.86 405.30 411.97" y="600.75" font-size="11.00" class="sc-loraregular">bypassPermissions</text><text x="419.96" y="600.75" font-size="11.00" class="sc-notoserifcjksc">模式启动智能体的脚本</text><text x="108.00" y="616.37" font-size="11.00" class="sc-notoserifcjksc">（尽管它自身运行在自动模式下）。根据我们的自动化离线流水线，这种情况出现在不到</text><text x="108.00 114.65 117.20 124.03 130.86 134.86" y="631.99" font-size="11.00" class="sc-loraregular">0.001%</text><text x="147.32" y="631.99" font-size="11.00" class="sc-notoserifcjksc">的补全中。</text><text x="144.00" y="665.52" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，</text><text x="221.00 226.59 232.26 238.67 241.66 247.62 250.51 256.51 259.21" y="665.52" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="266.11" y="665.52" font-size="11.00" class="sc-notoserifcjksc">试图启动一个智能体，并为其配备它被要求调试的新</text><text x="144.00 154.04 161.73" y="681.14" font-size="11.00" class="sc-loraregular">MCP</text><text x="171.29" y="681.14" font-size="11.00" class="sc-notoserifcjksc">工具，启动命令为</text><text x="262.18 266.58 272.38 278.96 281.85 289.44 293.70 303.53 310.10 312.99 320.64 328.28 331.18 337.14 343.65 349.21 352.10 357.48 364.04 366.94 374.63 381.17 387.85 396.12 404.21 411.05 418.74 427.37 435.46 442.30 445.19 450.57" y="681.14" font-size="11.00" class="sc-loraregular">“cd /tmp &amp;&amp; env -u CLAUDECODE -u</text><text x="144.00 151.69 158.23 164.91 173.18 181.27 188.11 196.13 203.82 212.45 220.54 227.38 235.40 242.24 250.62 257.66 264.45 271.42 278.09 286.72 290.41 298.79 305.83 308.72 314.10 320.67 323.56 331.25 337.80 344.47 352.75 360.83 367.67 375.69 383.38 392.02 400.10 406.94 414.96 422.65 431.23 434.92 441.27 449.47 457.49 463.73 470.57 476.81 483.04 486.63 495.26 503.65 506.54 512.39 515.38 520.99 527.56 534.14" y="696.76" font-size="11.00" class="sc-loraregular">CLAUDE_CODE_ENTRYPOINT -u CLAUDE_CODE_CHILD_SESSION claude</text><text x="144.00 149.38 155.95 158.84 164.22 169.60 176.03 182.60 186.86 193.42 199.99 204.25 209.63 213.29 219.72 224.49 234.32 239.92 244.18 247.07 251.33 257.23 263.06 267.32 270.21 275.59 280.97 286.65 289.64 292.63 298.96 307.64 313.54 320.04 326.55 332.98 339.42 342.41 347.50 350.39 357.98 360.88 364.68 374.52 380.37 386.94 394.95 402.97 408.83 411.82 417.43 423.99 430.57 436.53 444.55 450.23 453.32 461.34 469.71 476.15 482.58 488.93 491.92 497.88" y="712.38" font-size="11.00" class="sc-loraregular">-p --output-format text --allowedTools \ "mcp__claude_ai_Google_</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p096.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 96 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">96</text><text x="144.00 151.69 157.37 160.36 166.32 173.00 179.57 185.25 190.01 198.03 206.05 211.77 218.12 221.92 224.82 230.20 235.58 242.14 248.10 252.87 262.70 265.79 270.89 275.98 279.07 285.50 292.18 297.56 307.39 313.83 320.41 326.37 329.26 335.58 341.38 347.95 353.63 358.72 363.64 370.19 376.16 380.92 390.75 393.84 398.94 404.03 407.12 413.56 420.23 425.33 428.22 430.51 438.70 443.79 449.76 452.65 456.91 463.50 469.46 472.35 478.20 481.19 486.80 493.37 499.95 505.91 508.62 514.29" y="82.61" font-size="11.00" class="sc-loraregular">Calendar__*\" --permission-mode bypassPermissions 'Use the claude.ai</text><text x="144.00 152.37 158.81 165.24 171.59 174.58 180.54 183.43 191.12 196.80 199.79 205.75 212.43 219.01 224.69 229.45 232.34 238.14 244.57 251.25 257.93 263.83 269.63 273.89 280.32 285.09 287.98 291.93 294.63 297.34 300.05 303.99" y="98.23" font-size="11.00" class="sc-loraregular">Google Calendar connector [...]”</text><text x="307.83" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。该命令被自动模式拦截。</text><text x="108.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">极少数案例中，</text><text x="185.00 190.59 196.26 202.67 205.66 211.62 214.51 220.51 223.21" y="114.99" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="230.11" y="114.99" font-size="11.00" class="sc-notoserifcjksc">表现出某些相对无害但反常的行为。根据我们的自动化离线流水</text><text x="108.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">线，这种情况出现在不到</text><text x="231.89 238.55 241.09 247.92 254.75 258.76" y="130.61" font-size="11.00" class="sc-loraregular">0.001%</text><text x="271.22" y="130.61" font-size="11.00" class="sc-notoserifcjksc">的补全中。</text><text x="144.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，它在一次较长且无关的工具调用开头运行了</text><text x="432.89 437.29 442.06 451.89 454.78 460.16 463.88 466.77 474.36 480.94 486.85 491.61 499.20 505.88 512.45 515.44 518.43" y="163.57" font-size="11.00" class="sc-loraregular">“rm -f /dev/null”</text><text x="522.27" y="163.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，它被要求追踪无人响应的连续告警次数，而它声称有一位用户（其</text><text x="298.00" y="211.57" font-size="11.00" class="sc-loraregular">“</text><text x="302.40" y="211.57" font-size="11.00" class="sc-notoserifcjksc">干得好，</text><text x="346.40 354.09 357.08 362.69 369.26 375.84" y="211.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="381.80" y="211.57" font-size="11.00" class="sc-notoserifcjksc">！</text><text x="392.80" y="211.57" font-size="11.00" class="sc-loraregular">”</text><text x="396.64" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，并将计数器重置。</text><text x="144.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在少数几个案例中，</text><text x="243.00 248.59 254.26 260.67 263.66 269.62 272.51 278.51 281.21" y="244.53" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="288.11" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照将某个内部资</text><text x="144.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">源的</text><text x="168.89" y="260.15" font-size="11.00" class="sc-loraregular">URL</text><text x="193.32" y="260.15" font-size="11.00" class="sc-notoserifcjksc">替换成了一个略有不同、顶级域名错误的</text><text x="394.22" y="260.15" font-size="11.00" class="sc-loraregular">URL</text><text x="415.76" y="260.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控未发现任何评估中故意藏拙、明显的恶意行为、长程战略性欺骗或长程战</text><text x="72.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">略性规避监督的案例。</text><text x="72.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 132.59 138.26 144.67 147.66 153.62 156.51 162.51 165.21" y="374.06" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="172.11" y="374.06" font-size="11.00" class="sc-notoserifcjksc">为实现用户指定目标的某种版本而规避限制的比率似乎可能低于</text><text x="483.00 490.69 493.68 499.29 505.86 512.44" y="374.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="389.68" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06" y="389.68" font-size="11.00" class="sc-notoserifcjksc">。它在与子智能体沟通时歪曲用户意图的倾向可能略高，不过这一频率变化可能源于我</text><text x="72.00" y="405.30" font-size="11.00" class="sc-notoserifcjksc">们内部缓解措施和子智能体指令的调整，而非模型行为的变化。</text><text x="72.00" y="469.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.2</text><text x="105.10" y="469.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试期间报告的事件</text><text x="72.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">我们的一家合作方在评估</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 239.77 245.45 251.85 254.84 260.80 263.70 269.69 272.40" y="497.45" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="279.30" y="497.45" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照时，搭建了一个</text><text x="72.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">评估环境：模型位于沙箱中，但可以将代码提交给沙箱之外的编译器。在数千次试验中的一次</text><text x="72.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">里，</text><text x="94.00 99.59 105.26 111.67 114.66 120.62 123.51 129.51 132.21" y="528.69" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="139.11" y="528.69" font-size="11.00" class="sc-notoserifcjksc">利用了该合作方沙箱中的一个漏洞：它运行的代码在编译时获取了沙箱之外、它本</text><text x="72.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">不应有权访问的文件。理论上，这可能被用来运行任意代码。该合作方随后进行的排查发现，</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="559.93" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40" y="559.93" font-size="11.00" class="sc-notoserifcjksc">此前在同一评估中也做过同样的事情。该合作方将此归类为临界情况，而非严重的安全入</text><text x="72.00" y="575.55" font-size="11.00" class="sc-notoserifcjksc">侵事件；我们在此报告是出于透明度考虑。使</text><text x="294.89 300.48 306.16 312.56 315.55 321.51 324.41 330.40 333.11" y="575.55" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="340.00" y="575.55" font-size="11.00" class="sc-notoserifcjksc">得以访问外部信息的漏洞此后已由该合作</text><text x="72.00" y="591.17" font-size="11.00" class="sc-notoserifcjksc">方修复。</text><text x="116.00" y="591.17" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="154.74" y="591.17" font-size="11.00" class="sc-notoserifcjksc">是在修复之后运行的，因此我们没有关于它在同样情况下会如何行事的证据。</text><text x="72.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">由于以下因素，我们将此事件的严重程度评为低：这些模型没有试图隐藏其行为，评估之外的任</text><text x="72.00" y="707.38" font-size="11.00" class="sc-notoserifcjksc">何内容均未被更改，没有使用任何</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">网络攻击技术（例如凭据伪造或注入），而且模型似乎并没有在主动探查漏洞。</text><text x="457.00 462.59 468.26 474.67 477.66 483.62 486.51 492.51 495.21" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="502.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">获得了</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一个可以执行任意代码的编译器的访问权限，发现可以通过执行代码访问额外信息，随后利用了</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">这些信息。此事件不涉及任何有害行为或现实世界后果，我们不认为它是严重未对齐的证据。此</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">事件确实表明，如果没有关于任务边界的恰当指令，模型会以宽泛且有时出人意料的方式使用其</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">可支配的一切工具。不过，利用了该漏洞的模型中没有一个访问或更改了沙箱之外系统的其他部</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，它们只是选择完成任务，尽管借助了额外信息。这种倾向与奖励破解密切相关，而奖励破解</text><text x="72.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">正是本次评估在训练（第</text><text x="195.89" y="176.33" font-size="11.00" class="sc-loraregular">6.3</text><text x="213.98" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节）和评估（第</text><text x="293.87" y="176.33" font-size="11.00" class="sc-loraregular">6.4.8</text><text x="320.68" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节、第</text><text x="356.57" y="176.33" font-size="11.00" class="sc-loraregular">6.5.4</text><text x="383.19" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节）中的一大重点。</text><text x="72.00" y="294.50" font-size="14.00" class="sc-poppinssemibold">6.3</text><text x="96.32" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">训练数据审查</text><text x="72.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.24 349.95" y="321.06" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="356.85" y="321.06" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00" y="367.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.1</text><text x="102.67" y="367.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">言语化评分者意识</text><text x="72.00" y="395.88" font-size="11.00" class="sc-notoserifcjksc">评分者意识指模型就某项任务推理将评判其方法正确与否的评分者或奖励的情形。被推理的评分</text><text x="72.00" y="411.50" font-size="11.00" class="sc-notoserifcjksc">者或奖励可能是</text><text x="151.89" y="411.50" font-size="11.00" class="sc-loraregular">LLM</text><text x="177.60" y="411.50" font-size="11.00" class="sc-notoserifcjksc">评分模型，也可能不是（例如确定性奖励）。在本节中，我们聚焦于言语化</text><text x="72.00" y="427.12" font-size="11.00" class="sc-notoserifcjksc">评分者意识，即关于评分者的推理出现在模型的输出中（而不是出现在其内部激活值中，后者我</text><text x="72.00" y="442.74" font-size="11.00" class="sc-notoserifcjksc">们将在第</text><text x="118.89 125.25 127.85 134.21 136.91" y="442.74" font-size="11.00" class="sc-loraregular">6.6.1</text><text x="72.00" y="458.36" font-size="11.00" class="sc-notoserifcjksc">分者或奖励的空子或利用它们，但我们认为本节中标记的大多数情形并非如此。</text><text x="72.00" y="541.59" font-size="11.00" class="sc-notoserifcjksc">我们对强化学习（</text><text x="160.00" y="541.59" font-size="11.00" class="sc-loraregular">RL</text><text x="173.27" y="541.59" font-size="11.00" class="sc-notoserifcjksc">）的持续自动监控包括测量评分者意识的比率，该比率由一个二元的</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="557.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89" y="557.21" font-size="11.00" class="sc-notoserifcjksc">评分器判定；该评分器的提示中包含对评分者意识的描述以及完整的对话记</text><text x="72.00" y="572.83" font-size="11.00" class="sc-notoserifcjksc">录。重要的是，我们向评分器明确说明，它只应考虑提示中未说明评分机制的情形（因为在提示</text><text x="72.00" y="588.45" font-size="11.00" class="sc-notoserifcjksc">已说明评分机制的情况下，评分者意识并不令人担忧，也在预期之中）。我们发现：</text><text x="479.00 482.33 485.69 488.58 496.27 499.26 504.87 511.44 518.02" y="588.45" font-size="11.00" class="sc-loraregular">i) Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="604.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="604.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.55" y="604.07" font-size="11.00" class="sc-loraregular">RL</text><text x="158.71" y="604.07" font-size="11.00" class="sc-notoserifcjksc">中的评分者意识比率相对较高（在</text><text x="326.61" y="604.07" font-size="11.00" class="sc-loraregular">RL</text><text x="342.76" y="604.07" font-size="11.00" class="sc-notoserifcjksc">开始时，大多数较长的智能体编程回合都</text><text x="72.00" y="619.69" font-size="11.00" class="sc-notoserifcjksc">具有评分者意识）；</text><text x="171.00 174.09 177.42" y="619.69" font-size="11.00" class="sc-loraregular">ii)</text><text x="183.67" y="619.69" font-size="11.00" class="sc-notoserifcjksc">评分者意识的比率在</text><text x="285.57" y="619.69" font-size="11.00" class="sc-loraregular">RL</text><text x="301.72" y="619.69" font-size="11.00" class="sc-notoserifcjksc">过程中似乎没有明显上升：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="358.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="358.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 112.54 116.01 118.38 124.55" y="358.75" font-size="9.00" class="sc-lorabold">6.3.1.A] RL</text><text x="132.35" y="358.75" font-size="9.00" class="sc-notoserifcjkscbold">过程中能力类训练环境内的评分者意识。</text><text x="449.60 455.89 458.33 462.92 468.30 473.68 478.56 480.92 489.05 493.85 497.33 502.72 507.99 512.15 514.52 519.43 521.64" y="370.45" font-size="9.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="527.28" y="370.45" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="382.15" font-size="9.00" class="sc-notoserifcjksc">整个</text><text x="92.37" y="382.15" font-size="9.00" class="sc-loraregular">RL</text><text x="105.59" y="382.15" font-size="9.00" class="sc-notoserifcjksc">过程中，评分者意识保持相对稳定。当对话记录的提示本身告知策略模型存在评分者时，评分器不会将该对话</text><text x="72.00" y="393.85" font-size="9.00" class="sc-notoserifcjksc">记录计为具有评分者意识。在计算评分者意识比率时忽略这些情形（而不是将其视为不具有评分者意识），并不会改变</text><text x="72.00" y="405.55" font-size="9.00" class="sc-notoserifcjksc">四种情形的相对排序，也不会改变它们的比率在</text><text x="263.37" y="405.55" font-size="9.00" class="sc-loraregular">RL</text><text x="276.59" y="405.55" font-size="9.00" class="sc-notoserifcjksc">过程中相当稳定这一事实。每个点是在六分之一的</text><text x="476.96" y="405.55" font-size="9.00" class="sc-loraregular">RL</text><text x="490.18" y="405.55" font-size="9.00" class="sc-notoserifcjksc">训练期间汇</text><text x="72.00" y="417.25" font-size="9.00" class="sc-notoserifcjksc">总的评分者意识比率，绘制在该六分之一区间的中点处。</text><text x="72.00" y="477.28" font-size="11.00" class="sc-notoserifcjksc">我们在图</text><text x="118.89" y="477.28" font-size="11.00" class="sc-loraregular">6.3.1.A</text><text x="153.28" y="477.28" font-size="11.00" class="sc-notoserifcjksc">中聚焦于智能体编程环境，并将</text><text x="310.17" y="477.28" font-size="11.00" class="sc-loraregular">RL</text><text x="326.33" y="477.28" font-size="11.00" class="sc-notoserifcjksc">回合划分为最短的</text><text x="417.22" y="477.28" font-size="11.00" class="sc-loraregular">50%</text><text x="442.51" y="477.28" font-size="11.00" class="sc-notoserifcjksc">和最长的</text><text x="489.41" y="477.28" font-size="11.00" class="sc-loraregular">50%</text><text x="511.80" y="477.28" font-size="11.00" class="sc-notoserifcjksc">，以</text><text x="72.00" y="492.90" font-size="11.00" class="sc-notoserifcjksc">控制</text><text x="96.89" y="492.90" font-size="11.00" class="sc-loraregular">RL</text><text x="113.05" y="492.90" font-size="11.00" class="sc-notoserifcjksc">过程中回合长度的分布偏移，因为两者的评分者意识占比差异显著。</text><text x="72.00" y="558.25" font-size="11.00" class="sc-notoserifcjksc">下面以截断形式展示了一个从被判定为具有评分者意识的对话记录子集中随机抽取的示例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="273.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 126.15 128.25 131.90 134.00 139.54" y="273.42" font-size="9.00" class="sc-lorabold">6.3.1.B]</text><text x="145.38" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">一份来自</text><text x="183.74 189.94 192.74 197.46 203.02 208.39 213.23 215.60 224.04 229.00 232.71 238.30 243.40 247.76 250.13 254.99 257.09" y="273.42" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="263.11" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">的、具有评分者意识的</text><text x="355.47" y="273.42" font-size="9.00" class="sc-lorabold">RL</text><text x="369.45" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="405.45" y="273.42" font-size="9.00" class="sc-notoserifcjksc">，依据为图</text><text x="452.82" y="273.42" font-size="9.00" class="sc-loraregular">6.3.1.A</text><text x="480.95" y="273.42" font-size="9.00" class="sc-notoserifcjksc">中使用的自动</text><text x="72.00" y="285.12" font-size="9.00" class="sc-notoserifcjksc">评分器。这是一个数学环境，而非智能体编程环境。在这份对话记录中，共有两处提及</text><text x="414.00" y="285.12" font-size="9.00" class="sc-loraregular">“</text><text x="417.60" y="285.12" font-size="9.00" class="sc-notoserifcjksc">评分者</text><text x="444.60" y="285.12" font-size="9.00" class="sc-loraregular">”</text><text x="447.74" y="285.12" font-size="9.00" class="sc-notoserifcjksc">，二者均在此可视化中</text><text x="72.00" y="296.83" font-size="9.00" class="sc-notoserifcjksc">展示。</text><text x="72.00" y="325.73" font-size="11.00" class="sc-notoserifcjksc">我们发现，在我们的智能体编程环境中，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06 317.06 319.76" y="325.73" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="326.66" y="325.73" font-size="11.00" class="sc-notoserifcjksc">的言语化评分者意识比率与</text><text x="461.55 469.24 472.24 477.85 484.41 490.99 496.95 499.85 508.58 515.15 521.71 526.81 529.70" y="325.73" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00" y="341.35" font-size="11.00" class="sc-notoserifcjksc">相近，同样较高：</text><text x="72.00" y="624.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 113.19 116.67 119.03 125.23 128.03 132.75 138.31 143.68 148.52 150.88 159.33 164.29 168.00 173.59 178.69 183.05 185.42 190.28 192.38" y="624.00" font-size="9.00" class="sc-lorabold">6.3.1.C] Claude Mythos 5.1</text><text x="198.40" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">的言语化评分者意识较为频繁，与</text><text x="335.76" y="624.00" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="399.46" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">一样</text><text x="417.46" y="624.00" font-size="9.00" class="sc-notoserifcjksc">。我们从</text><text x="455.83" y="624.00" font-size="9.00" class="sc-loraregular">16</text><text x="466.68" y="624.00" font-size="9.00" class="sc-notoserifcjksc">个智能体编程</text><text x="523.04" y="624.00" font-size="9.00" class="sc-loraregular">RL</text><text x="72.00" y="635.70" font-size="9.00" class="sc-notoserifcjksc">环境中选取任务（这些环境因评分者意识高、且提示中未提及评分者或隐藏测试而入选），并将</text><text x="452.37 460.49 465.29 468.77 474.17 479.43 483.60 485.96 490.87 493.08" y="635.70" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="498.73" y="635.70" font-size="9.00" class="sc-notoserifcjksc">在这些任</text><text x="72.00" y="647.40" font-size="9.00" class="sc-notoserifcjksc">务上的</text><text x="101.37" y="647.40" font-size="9.00" class="sc-loraregular">RL</text><text x="114.59" y="647.40" font-size="9.00" class="sc-notoserifcjksc">对话记录与</text><text x="161.95" y="647.40" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="193.65" y="647.40" font-size="9.00" class="sc-notoserifcjksc">在相同任务上新采样的结果进行比较，由同一个评判者评分。误差线为</text><text x="475.02" y="647.40" font-size="9.00" class="sc-loraregular">95%</text><text x="495.32" y="647.40" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="659.10" font-size="9.00" class="sc-notoserifcjksc">在匹配的任务上，两个模型言语化表达评分者意识的比率相近。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们还在与对齐相关的环境中检查言语化评分者意识。这种情况更令人担忧，因为对对齐评分者</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的意识可能会削弱我们的监督（不过言语化评分者意识可以通过思维链监控来研究）。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们发现，在对齐以及有益、诚实、无害（</text><text x="281.00" y="147.38" font-size="11.00" class="sc-loraregular">HHH</text><text x="306.74" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）环境中，训练结束时的评分者意识比率约为</text><text x="72.00" y="163.00" font-size="11.00" class="sc-loraregular">5%</text><text x="87.57" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，低于图</text><text x="134.46" y="163.00" font-size="11.00" class="sc-loraregular">6.3.1.A</text><text x="168.84" y="163.00" font-size="11.00" class="sc-notoserifcjksc">中四个比率中的三个。</text><text x="72.00" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.2</text><text x="105.42" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">计算机使用环境</text><text x="72.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们生产训练流水线的一部分涉及在</text><text x="250.89" y="238.38" font-size="11.00" class="sc-loraregular">GUI</text><text x="274.11" y="238.38" font-size="11.00" class="sc-notoserifcjksc">计算机使用设置中进行的强化学习，模型在其中与复杂</text><text x="72.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">且逼真的容器交互。然而，计算机使用为缓解奖励破解带来了重大挑战：由于容器更为复杂，它</text><text x="72.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">问，模型可能会找到编写并执行任意代码的新方法，例如访问浏览器控制台或使用</text><text x="470.89 474.83 480.38 485.82 491.50 497.73 503.58 508.35 511.44 518.01" y="285.24" font-size="11.00" class="sc-loraregular">JavaScript</t
