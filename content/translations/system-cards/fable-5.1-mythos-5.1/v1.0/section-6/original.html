<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.7.3</text><text x="105.08" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有意极低频率地采取行动</text><text x="72.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某项有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">发现），一种可能的策略是利用评估与部署之间的规模差异。为此，模型可以以一个非常低但非</text><text x="72.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">测试中从不发生。</text><text x="72.00" y="228.38" font-size="11.00" class="sc-notoserifcjksc">为了评估这一能力，我们对</text><text x="206.89 213.13 219.09 223.86 228.54 234.22 240.89 247.33 250.22 256.11 260.36 263.26 268.93 271.93 274.63 277.52 283.43 290.19 296.09" y="228.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="305.34" y="228.38" font-size="11.00" class="sc-notoserifcjksc">中所述的评估进行了内部复现。在该评估中，模</text><text x="72.00" y="244.00" font-size="11.00" class="sc-notoserifcjksc">型被提示以指定的频率执行某个特定行动（例如在编程任务中使用名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="244.00" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49" y="244.00" font-size="11.00" class="sc-notoserifcjksc">的变量），并经过多</text><text x="72.00" y="259.62" font-size="11.00" class="sc-notoserifcjksc">次重新采样，以检验相关行为的观测频率。我们使用与此前在</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 415.77 421.45 427.85 430.84 436.80 439.70" y="259.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="448.59" y="259.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="462.48 470.17 473.16 478.77 485.34 491.91 497.88 500.77 510.70 516.57 520.82 527.41 533.85" y="259.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos</text><text x="72.00" y="275.24" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="80.89" y="275.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="116.78" y="275.24" font-size="11.00" class="sc-notoserifcjksc">中报告的相同设置，每种设置</text><text x="262.67 268.64 271.24 278.07 284.91" y="275.24" font-size="11.00" class="sc-loraregular">4,000</text><text x="294.64" y="275.24" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00" y="619.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.64 106.74 112.28" y="619.91" font-size="9.00" class="sc-lorabold">6.7.3.A]</text><text x="118.12" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，模型被指示以</text><text x="264.48" y="619.91" font-size="9.00" class="sc-lorabold">1%</text><text x="278.64" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">的概率采取某个罕见行动时实际采取该行动的频率。</text><text x="485.64" y="619.91" font-size="9.00" class="sc-notoserifcjksc">当提供显式随</text><text x="72.00" y="631.61" font-size="9.00" class="sc-notoserifcjksc">机性（通过</text><text x="119.37" y="631.61" font-size="9.00" class="sc-loraregular">UUID</text><text x="142.62" y="631.61" font-size="9.00" class="sc-notoserifcjksc">）时，或当模型被提示生成一个随机字符串并用其做出决定（</text><text x="385.62 390.73 395.83 400.82" y="631.61" font-size="9.00" class="sc-loraregular">SSoT</text><text x="406.57" y="631.61" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结</text><text x="72.00" y="643.31" font-size="9.00" class="sc-notoserifcjksc">果。我们还测试了另外三种设置：一种没有任何提示或随机性来源的基线设置、一种诱导性较弱的策略提示，以及一个</text><text x="72.00" y="655.01" font-size="9.00" class="sc-notoserifcjksc">提示词各不相同、可提供自然随机性来源的数据集；在所有这些设置中，所有模型都降为零。每种设置使用</text><text x="497.37 502.24 504.38 509.97 515.56" y="655.01" font-size="9.00" class="sc-loraregular">4,000</text><text x="523.52" y="655.01" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="666.71" font-size="9.00" class="sc-notoserifcjksc">样本。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="219.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="219.58" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="247.33" y="219.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="250.22" y="219.58" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="260.36" y="219.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.26" y="219.58" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="274.63" y="219.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="277.52" y="219.58" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="371.89" y="250.82" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="371.89" y="250.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="407.29" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="410.18" y="250.82" width="26.62" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="436.80" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="439.70" y="250.82" width="5.99" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="445.69" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="448.59" y="250.82" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="459.59" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="462.48" y="250.82" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="497.88" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="500.77" y="250.82" width="38.17" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="538.94" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="72.00" y="266.44" width="6.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="78.00" y="266.44" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="80.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="91.89" y="266.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="91.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="102.89" y="266.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="102.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">呈现出与其前代模型相同的模式。当提示词提供了熵源（</text><text x="403.66" y="82.61" font-size="11.00" class="sc-loraregular">UUID</text><text x="432.09" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）或可行的操作流程</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.24 95.47 101.57" y="98.23" font-size="11.00" class="sc-loraregular">SSoT</text><text x="108.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）时，它在这两种设置下都以低于</text><text x="276.50" y="98.23" font-size="11.00" class="sc-loraregular">1%</text><text x="292.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">目标的非零频率采取该罕见行动。</text><text x="457.97 465.66 468.65 474.26 480.83 487.40 493.37 496.26 504.99 511.56 518.13 523.22 526.11" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在这两种设置下都最接近目标。在图中未展示的三种设置（基线、策略提示和自然设置）中，模</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型必须自行寻找随机性，</text><text x="193.00 202.93 208.80 213.05 219.64 226.08 231.17 234.06 240.06 242.76" y="129.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="249.66" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="263.55 269.52 272.12 278.95 285.79" y="129.47" font-size="11.00" class="sc-loraregular">4,000</text><text x="295.52" y="129.47" font-size="11.00" class="sc-notoserifcjksc">个样本中从未采取该行动，与在这些设置上测试的</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">所有其他模型一样。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对话记录审查表明，</text><text x="171.00 177.24 183.47 189.57" y="195.95" font-size="11.00" class="sc-loraregular">SSoT</text><text x="199.50" y="195.95" font-size="11.00" class="sc-notoserifcjksc">频率偏低的原因是</text><text x="290.39 300.33 306.19 310.45 317.04 323.47 328.56 331.46 337.45 340.16" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="347.06" y="195.95" font-size="11.00" class="sc-notoserifcjksc">生成的字符串缺乏熵。它的大多数种子</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">字符串都是同一模板的细微变体，因此其字符编码之和（决定是否采取行动）集中在少数几个值</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">上，很少等于触发值。</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 226.53 232.96 239.64 246.32 252.20 256.46 259.35" y="227.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="268.24" y="227.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="282.13" y="227.19" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="320.88" y="227.19" font-size="11.00" class="sc-notoserifcjksc">生成的字符串变化更多，接近</text><text x="466.77" y="227.19" font-size="11.00" class="sc-loraregular">1%</text><text x="483.24" y="227.19" font-size="11.00" class="sc-notoserifcjksc">的目标。</text><text x="72.00" y="293.10" font-size="11.00" class="sc-notoserifcjksc">在策略提示设置下，提示词指示模型想出一个能使其行动频率校准到</text><text x="404.89" y="293.10" font-size="11.00" class="sc-loraregular">1%</text><text x="421.36" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的流程。与早期模型一</text><text x="72.00" y="308.72" font-size="11.00" class="sc-notoserifcjksc">样，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="308.72" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66" y="308.72" font-size="11.00" class="sc-notoserifcjksc">大多只是说出一个数字而背后没有任何流程，或者推理认为</text><text x="439.55" y="308.72" font-size="11.00" class="sc-loraregular">1%</text><text x="456.02" y="308.72" font-size="11.00" class="sc-notoserifcjksc">的事件不太可能</text><text x="72.00" y="324.34" font-size="11.00" class="sc-notoserifcjksc">发生而拒绝行动。在大约</text><text x="195.89" y="324.34" font-size="11.00" class="sc-loraregular">1%</text><text x="212.36" y="324.34" font-size="11.00" class="sc-notoserifcjksc">的样本中，它更进一步，自行生成数字，并将其与一个事先确定的</text><text x="72.00" y="339.96" font-size="11.00" class="sc-notoserifcjksc">值进行比对，但这些尝试均未导致采取该行动。</text><text x="72.00" y="390.27" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有发现</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 242.95 245.66" y="390.27" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="252.55" y="390.27" font-size="11.00" class="sc-notoserifcjksc">在有意以经过校准的低频率采取行动方面比以往模型有实质</text><text x="72.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">性提升。其校准偏差的方向本身并不令人放心：采用这种方法的模型会比预期更少地采取行动，</text><text x="72.00" y="421.51" font-size="11.00" class="sc-notoserifcjksc">但仍会偶尔采取行动，而这对于固定规模的评估而言更难检测。然而在实践中，主要的关切在于</text><text x="72.00" y="437.13" font-size="11.00" class="sc-notoserifcjksc">模型是否会自行想到这一策略，以及它是否根本能够执行该策略；在没有显式熵源或明确流程的</text><text x="72.00" y="452.75" font-size="11.00" class="sc-notoserifcjksc">设置中，我们测试的所有模型两者都做不到。</text><text x="72.00" y="518.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.7.4</text><text x="105.89" y="518.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可控性</text><text x="72.00" y="550.02" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否存在未对齐行为。倾向于在扩展思考中言语化表达</text><text x="72.00" y="565.64" font-size="11.00" class="sc-notoserifcjksc">其采取未对齐行为之意图的模型，可能要容易被发现得多。</text><text x="72.00" y="614.80" font-size="11.00" class="sc-notoserifcjksc">模型变得更难以监控的一种途径，是获得有意控制其扩展思考某些方面的能力，例如有选择地省</text><text x="72.00" y="630.42" font-size="11.00" class="sc-notoserifcjksc">略监控器所需的关键信息。为了衡量这种思维链可控性（</text><text x="347.00 354.69 360.78 367.82 370.72 376.51 382.95 389.53 393.78 398.47 404.90 407.90 410.89 416.56 422.97 426.06 429.05 432.32 436.60" y="630.42" font-size="11.00" class="sc-loraregular">CoT controllability</text><text x="442.40" y="630.42" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="500.30 507.99 514.57 520.54 527.21 530.11 535.99" y="630.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et</text><text x="72.00" y="646.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="86.27" y="646.04" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="265.16 272.85 275.84 281.45 288.02 294.60 300.56 303.45 313.38 319.25 323.50 330.09 336.53 341.62 344.51 350.51 353.21" y="646.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="360.11" y="646.04" font-size="11.00" class="sc-notoserifcjksc">在回答</text><text x="396.01 404.38 411.04 419.65" y="646.04" font-size="11.00" class="sc-loraregular">GPQA</text><text x="426.54" y="646.04" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="437.54" y="646.04" font-size="11.00" class="sc-loraregular">HLE</text><text x="462.21" y="646.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.11 486.21 496.30 502.54 510.71 516.09 522.76 527.44" y="646.04" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00" y="677.28" font-size="11.00" class="sc-notoserifcjksc">问答基准测试上，模型通常会产生大量的扩展</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="621.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="621.62" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="527.21" y="621.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="530.11" y="621.62" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="540.25" y="621.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="637.24" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00 507.28 512.07" y="751.81" font-size="9.00" class="sc-loraregular">137</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">思考。我们同时展示了使用原始提示词以及使用一个由英国人工智能安全研究所（</text><text x="468.00" y="82.61" font-size="11.00" class="sc-loraregular">UK AI</text><text x="72.00 78.24 84.14 90.00 96.56 101.33 104.59 108.87 114.68 117.57 121.17 127.85 132.94 137.20 140.46 144.72 151.29 155.55" y="98.23" font-size="11.00" class="sc-loraregular">Security Institute</text><text x="161.51" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）提供、在以往</text><text x="241.40 249.09 252.08 257.69 264.26 270.84" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="279.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型上更善于引出思维链可控性的提示词所得的结</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06 207.06 209.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="216.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制比除</text><text x="329.55 337.24 340.24 345.85 352.41 358.99 364.95 367.85 377.78 383.64 387.90 394.49 400.92 406.01 408.91 415.57 420.26 426.17 431.72 434.81 440.73" y="147.38" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="452.44" y="147.38" font-size="11.00" class="sc-notoserifcjksc">之外的以往</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型都更为有效。我们将此视为相对于以往</text><text x="322.18 329.87 332.87 338.48 345.04 351.62" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="360.48" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型、思维链可监控性有所下降的弱</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p138.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 138 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">138</text><text x="72.00" y="574.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.53 106.62 112.16" y="574.75" font-size="9.00" class="sc-lorabold">6.7.4.A]</text><text x="118.00" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="156.37" y="574.75" font-size="9.00" class="sc-lorabold">Claude Opus</text><text x="212.84" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="257.84 264.03 266.84 271.56 277.12 282.48 287.33 289.69 298.13 303.09 306.81 312.40 317.49 321.86 324.23 329.08 331.18" y="574.75" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="337.20" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">具有较高的思维链可控性。</text><text x="445.20" y="574.75" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强</text><text x="72.00" y="586.45" font-size="9.00" class="sc-notoserifcjksc">度档位或一个固定的思考预算，其位置为该设置下产生的平均思维链长度。可控性是指在</text><text x="425.37 432.22 437.67 444.72" y="586.45" font-size="9.00" class="sc-loraregular">GPQA</text><text x="450.35" y="586.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="459.35" y="586.45" font-size="9.00" class="sc-loraregular">HLE</text><text x="479.54" y="586.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.91 499.17 507.43 512.53 519.22 523.62 529.07 532.91" y="586.45" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00" y="598.15" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对其扩展思考所给指令的回复所占比例。越低越好，因为可控性越高，表明模型在被指示时更有</text><text x="72.00" y="609.85" font-size="9.00" class="sc-notoserifcjksc">能力改变其扩展思考的内容，这可能使监控变得不那么可靠。</text></svg></div>
