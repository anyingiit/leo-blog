7 481.67 490.67 499.67 508.67 517.67 526.67" y="569.88" font-size="9.00" class="sc-notoserifcjksc">置信区间。所有测量均由同一个评判模型评分。每个模型都</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00" y="581.58" font-size="9.00" class="sc-notoserifcjksc">在不同的环境混合上训练，因此模型之间的部分差异可能反映的是环境而非模型本身的差异。</text><text x="72.00 80.96 84.60" y="649.22" font-size="14.00" class="sc-poppinssemibold">6.4</text><text x="97.19 111.19 125.19 139.19 153.19 167.19 181.19" y="649.22" font-size="14.00" class="sc-notosanscjkscbold">自动化行为审计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="675.77" font-size="11.00" class="sc-notoserifcjksc">与以往的系统卡一样，我们进行了一次覆盖面广泛的自动化行为审计，以全面了解</text><text x="470.89 478.58 481.57 487.18 493.75 500.33" y="675.77" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="691.39" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66" y="691.39" font-size="11.00" class="sc-notoserifcjksc">在各种边缘情况场景中的行为。对于每个模型，我们进行约</text><text x="417.55 423.52 426.29 430.29 437.12" y="691.39" font-size="11.00" class="sc-loraregular">4,100</text><text x="446.86 457.86 468.86 479.86 490.86 501.86 512.86 523.86" y="691.39" font-size="11.00" class="sc-notoserifcjksc">次调查会话，在每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="707.01" font-size="11.00" class="sc-notoserifcjksc">次会话中，一个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p105.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 105 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">105</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">调查者模型负责在模拟场景中探查被研究模型的行为。场景取自一份主要由人工编写的、包含约</text><text x="72.00 77.91 80.68 84.68 91.51" y="98.23" font-size="11.00" class="sc-loraregular">2,100</text><text x="101.25 112.25 123.25 134.25 145.25 156.25 167.25 178.25 189.25 200.25 211.25 222.25 233.25 244.25 255.25 266.25 277.25 288.25 299.25 310.25 321.25 332.25 343.25 354.25 365.25 376.25 387.25 398.25 409.25 420.25 431.25 442.25 453.25 464.25 475.25 486.25 497.25 508.25 519.25" y="98.23" font-size="11.00" class="sc-notoserifcjksc">条场景描述的列表，并由一个独立的评判模型审查目标模型的行为，并在几十个维度上对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">其评分。场景涵盖滥用尝试、实施各类未对齐行为的高利害和低利害机会、与模拟用户的日常使</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">用，以及其他旨在引出可能出人意料而非有害之行为的探索性设置。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">由于我们力求覆盖极其多样的场景和领域，且我们希望评分的许多属性原则上可能出现在许多领</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">域中，我们在所有维度</text><text x="182.00" y="224.09" font-size="6.60" class="sc-loraregular">7</text><text x="185.04 196.04 207.04 218.04 229.04 240.04 251.04 262.04 273.04 284.04 295.04 306.04 317.04 328.04 339.04 350.04 361.04 372.04 383.04 394.04 405.04 416.04 427.04 438.04 449.04 460.04 471.04 482.04 493.04 504.04 515.04 526.04" y="227.76" font-size="11.00" class="sc-notoserifcjksc">上对所有对话记录进行评判，而不论对话记录的主题领域如何。因此，涉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.38" font-size="11.00" class="sc-notoserifcjksc">及模型处理敏感个人理财话题的对话记录也会被评判是否存在幻觉、有害性内容、政治宣传、利</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="259.00" font-size="11.00" class="sc-notoserifcjksc">己偏差以及其他不太可能适用的属性。这意味着某些维度得分的绝对值反映的是种子场景的分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="274.62" font-size="11.00" class="sc-notoserifcjksc">布，往往难以从绝对意义上解读。因此，得分的价值主要在于对模型进行比较。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">在每次调查中，调查者模型拥有与目标模型交互的广泛可用手段，包括设置其系统提示词、模拟</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="373.50" font-size="11.00" class="sc-notoserifcjksc">用户轮次、引入工具并模拟其结果、调整思考与推理强度（</text><text x="358.00 363.96 367.79 371.45 377.89 382.73" y="373.50" font-size="11.00" class="sc-loraregular">effort</text><text x="386.98 397.98 408.98 419.98 430.98 441.98 452.98 463.98" y="373.50" font-size="11.00" class="sc-notoserifcjksc">）参数、预填充（</text><text x="505.04 516.04 527.04" y="373.50" font-size="11.00" class="sc-notoserifcjksc">）助手</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="389.12" font-size="11.00" class="sc-notoserifcjksc">轮次，以及从非助手角色采样。调查者可以回溯或重启对话，因此从目标模型的视角来看，每次</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="404.74" font-size="11.00" class="sc-notoserifcjksc">调查可包含多达数十段相互独立的对话。调查者还可以访问一个大型固定参考资料库，其中的信</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="420.36" font-size="11.00" class="sc-notoserifcjksc">息和示例对话记录涵盖</text><text x="184.89 191.78" y="420.36" font-size="11.00" class="sc-loraregular">AI</text><text x="198.36 209.36 220.36" y="420.36" font-size="11.00" class="sc-notoserifcjksc">安全、</text><text x="231.36 238.24" y="420.36" font-size="11.00" class="sc-loraregular">AI</text><text x="244.82 255.82 266.82 277.82 288.82 299.82 310.82 321.82 332.82 343.82" y="420.36" font-size="11.00" class="sc-notoserifcjksc">行业、近期新闻，以及</text><text x="357.71 365.40 368.39 374.00 380.57 387.15" y="420.36" font-size="11.00" class="sc-loraregular">Claude</text><text x="396.01 407.01 418.01" y="420.36" font-size="11.00" class="sc-notoserifcjksc">模型在</text><text x="431.90 438.78 445.36 449.62 456.21 460.89 467.33 473.90 476.99" y="420.36" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="485.73 496.73 507.73 518.73 529.73" y="420.36" font-size="11.00" class="sc-notoserifcjksc">内部的使用</text><text x="72.00 83.00 94.00" y="435.98" font-size="11.00" class="sc-notoserifcjksc">方式。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">在下文报告的主要评估运行中，调查者模型还可以将目标模型配置为使用连接到隔离的沙箱计算</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">机的真实工具。这些计算机使用会话有两种形式：一种侧重于与简单</text><text x="404.89 411.25 414.34 421.02 427.59" y="519.22" font-size="11.00" class="sc-loraregular">Linux</text><text x="436.31 447.31 458.31 469.31 480.31 491.31 502.31 513.31 524.31" y="519.22" font-size="11.00" class="sc-notoserifcjksc">桌面系统的图形化交</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="534.84" font-size="11.00" class="sc-notoserifcjksc">互，另一种侧重于复杂的智能体运行框架（包括</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 351.87 358.31 364.89" y="534.84" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="373.74 384.74 395.74 406.74 417.74 428.74 439.74 450.74 461.74 472.74 483.74 494.74 505.74 516.74 527.74" y="534.84" font-size="11.00" class="sc-notoserifcjksc">运行框架）。智能体会话可选择性</text><text x="72.00 83.00 94.00" y="550.46" font-size="11.00" class="sc-notoserifcjksc">地包含</text><text x="107.89 114.78 121.36 125.61 132.20 136.89 143.32 149.89 152.98" y="550.46" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="161.73 172.73 183.73 194.73 205.73 216.73 227.73 238.73 249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="550.46" font-size="11.00" class="sc-notoserifcjksc">内部代码库的副本，并可预先植入真实的内部使用会话。为了更好地测量与破</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="566.08" font-size="11.00" class="sc-notoserifcjksc">坏性或鲁莽行为相关的问题，我们纳入了一些场景种子指令，要求调查者探索那些在实践中引发</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="581.70" font-size="11.00" class="sc-notoserifcjksc">过此类令人担忧行为的真实会话的续写。在不使用沙箱的情况下运行时（如本节稍后的安全防护</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="597.32" font-size="11.00" class="sc-notoserifcjksc">措施对比中那样），我们使用一个</text><text x="72.00" y="687.66" font-size="6.00" class="sc-loraregular">7</text><text x="77.40 87.40 97.40 107.40 117.40 127.40 137.40 147.40 157.40 167.40 177.40 187.40 197.40 207.40 217.40 227.40 237.40 247.40 257.40 267.40 277.40 287.40 297.40 307.40 317.40 327.40 337.40 347.40 357.40 367.40 377.40 387.40 397.40 407.40 417.40 427.40 437.40 447.40 457.40 467.40 477.40 487.40 497.40 507.40 517.40 527.40" y="690.99" font-size="10.00" class="sc-notoserifcjksc">在某个维度从结构上就不可能适用的情况下，无论目标模型的行为如何，评判模型都会拒绝给出评分：例</text><text x="72.00 82.00 92.00 102.00 112.00 122.00 132.00 142.00 152.00 162.00 172.00 182.00 192.00 202.00 212.00 222.00 232.00 242.00 252.00 262.00 272.00 282.00 292.00 302.00 312.00 322.00 332.00" y="705.19" font-size="10.00" class="sc-notoserifcjksc">如，只有当调查者智能体以某种方式使用了预填充时，才会对</text><text x="342.00" y="705.19" font-size="10.00" class="sc-loraregular">“</text><text x="346.00 356.00 366.00 376.00 386.00 396.00 406.00 416.00" y="705.19" font-size="10.00" class="sc-notoserifcjksc">整轮预填充易感性</text><text x="426.00" y="705.19" font-size="10.00" class="sc-loraregular">”</text><text x="429.49 439.49 449.49 459.49 469.49" y="705.19" font-size="10.00" class="sc-notoserifcjksc">给出评分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p106.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 106 页"><text x="90.00 94.46" y="271.21" font-size="11.00" class="sc-lorabold">1.</text><text x="90.00 95.86" y="368.37" font-size="11.00" class="sc-lorabold">2.</text><text x="90.00 96.16" y="400.75" font-size="11.00" class="sc-lorabold">3.</text><text x="90.00 96.01" y="449.33" font-size="11.00" class="sc-lorabold">4.</text><text x="90.00 95.94" y="497.91" font-size="11.00" class="sc-lorabold">5.</text><text x="90.00 96.32" y="546.49" font-size="11.00" class="sc-lorabold">6.</text><text x="90.00 94.46" y="595.06" font-size="11.00" class="sc-lorabold">7.</text><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">106</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">规模较小的纯对话场景集，约含</text><text x="228.89 233.96 239.87" y="82.61" font-size="11.00" class="sc-loraregular">720</text><text x="249.60 260.60 271.60 282.60 293.60 304.60 315.60 326.60 337.60 348.60 359.60 370.60 381.60 392.60 403.60 414.60 425.60 436.60 447.60 458.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个场景，其中所有工具结果均由调查者模拟。</text><text x="72.00 83.00 94.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在评估</text><text x="107.89 117.83 123.69 127.95 134.54 140.97 146.06 148.96 154.95 157.66" y="131.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="164.55 175.55 186.55 197.55 208.55 219.55" y="131.19" font-size="11.00" class="sc-notoserifcjksc">时，我们使用</text><text x="233.45 241.14 244.13 249.74 256.31 262.88 268.85 271.74 281.67 287.53 291.79 298.38 304.82 309.91 312.80" y="131.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="321.69 332.69 343.69 354.69 365.69 376.69" y="131.19" font-size="11.00" class="sc-notoserifcjksc">及其仅有用（</text><text x="387.69 394.28 400.24 403.23 409.74 413.46 420.03 423.02 428.40 434.84 441.51 444.45" y="131.19" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="450.26 461.26 472.26 483.26 494.26 505.26 516.26 527.26" y="131.19" font-size="11.00" class="sc-notoserifcjksc">）变体作为调查者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">模型来运行审计，并由</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96" y="146.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="234.84 245.84 256.84 267.84 278.84 289.84 300.84" y="146.81" font-size="11.00" class="sc-notoserifcjksc">担任评判模型。</text><text x="72.00 80.32 83.70 92.29 95.67" y="178.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.1</text><text x="103.47 116.47 129.47 142.47 155.47 168.47 181.47 194.47 207.47 220.47 233.47 246.47 259.47 272.47 285.47 298.47 311.47" y="178.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们的自动化行为审计可能存在的盲点</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="206.00" font-size="11.00" class="sc-notoserifcjksc">尽管我们在自动化行为审计中尽量覆盖尽可能多的情境和失败模式，但完全覆盖是不可能的。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00" y="221.62" font-size="11.00" class="sc-notoserifcjksc">们所用的工具不可避免地存在各种盲点，下面重点列出其中一些：</text><text x="108.00 119.00 130.00" y="270.76" font-size="11.00" class="sc-notoserifcjkscbold">真实度</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="286.38" font-size="11.00" class="sc-notoserifcjksc">或最危险的情境，但也意味着这些场景的展开方式可能与真实情境不同。我们会用真实的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="302.00" font-size="11.00" class="sc-notoserifcjksc">内部会话为部分调查提供种子，但只是有节制地这样做，因为这可能导致我们对某一情境</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="317.62" font-size="11.00" class="sc-notoserifcjksc">过拟合，而且由某个模型生成的对话记录对新模型而言属于分布外数据。</text><text x="108.00 119.00 130.00 141.00 152.00" y="367.91" font-size="11.00" class="sc-notoserifcjkscbold">沙箱真实度</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">导致其行为与真实部署中不同。</text><text x="108.00 119.00 130.00 141.00" y="400.30" font-size="11.00" class="sc-notoserifcjkscbold">超长轨迹</text><text x="108.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00 124.80 131.23 141.07 147.63 153.31 159.11 163.36 166.45 172.89" y="415.92" font-size="11.00" class="sc-loraregular">compaction</text><text x="179.57 190.57 201.57 212.57 223.57 234.57 245.57 256.57 267.57 278.57 289.57 300.57 311.57 322.57 333.57 344.57 355.57 366.57 377.57 388.57 399.57 410.57 421.57 432.57 443.57 454.57 465.57 476.57 487.57 498.57 509.57 520.57" y="415.92" font-size="11.00" class="sc-notoserifcjksc">）可能进一步改变模型的行为方式。我们会模拟上下文压缩，但对长轨迹</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">的覆盖范围较为有限。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="448.88" font-size="11.00" class="sc-notoserifcjkscbold">多智能体场景</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="464.50" font-size="11.00" class="sc-notoserifcjksc">调查者扮演其他智能体来近似模拟这种情况，但这可能无法再现真实的多智能体动态。</text><text x="204.44 215.44 226.44 237.44 248.44 259.44 270.44 281.44 292.44 303.44 314.44 325.44 336.44 347.44 358.44 369.44 380.44 391.44 402.44 413.44 424.44 435.44 446.44 457.44 468.44 479.44 490.44 501.44 512.44 523.44" y="497.45" font-size="11.00" class="sc-notoserifcjksc">大多数调查使用英语进行，因此在其他语言中更容易出现的未对齐情</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">况在下文的数据中权重偏低。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="546.03" font-size="11.00" class="sc-notoserifcjkscbold">越狱的下游影响</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">狱技巧来考察潜在的用户滥用。</text><text x="108.00 119.00 130.00 141.00 152.00" y="594.60" font-size="11.00" class="sc-notoserifcjkscbold">不可能任务</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="610.22" font-size="11.00" class="sc-notoserifcjksc">试寻找沙箱中的漏洞。虽然我们对此有一定的覆盖（第</text><text x="374.89 381.25 383.96 389.92 392.62" y="610.22" font-size="11.00" class="sc-loraregular">6.4.8</text><text x="401.70 412.70 423.70 434.70 445.70 456.70 467.70 478.70 489.70 500.70 511.70 522.70" y="610.22" font-size="11.00" class="sc-notoserifcjksc">节），但我们认为，许多其</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="625.84" font-size="11.00" class="sc-notoserifcjksc">他场景也会受益于考察模型在面对不可能任务时的行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">我们正在积极努力，以在未来的行为审计中解决这些局限。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p107.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 107 页"><text x="504.00 507.28 512.67" y="751.80" font-size="9.00" class="sc-loraregular">107</text><text x="72.00 80.32 83.70 92.29 95.67" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.2</text><text x="106.23 119.23 132.23 145.23 158.23 171.23 184.23 197.23 210.23 223.23 236.23" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">总体有害行为与配合滥用</text><text x="72.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="111.03" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="162.93 173.93 184.93" y="111.03" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="195.93 203.62 206.61 212.22 218.78 225.36 231.32 234.22 244.15 250.01 254.27 260.86 267.29 272.39 275.28 281.28 283.98" y="111.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="290.88 301.88 312.88 323.88 334.88 345.88 356.88 367.88 378.88 389.88 400.88 411.88 422.88 433.88 444.88 455.88 466.88 477.88" y="111.03" font-size="11.00" class="sc-notoserifcjksc">在总体未对齐行为上略有退步，但仍优于</text><text x="491.77 499.46 502.45 508.06 514.63 521.21" y="111.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="126.65" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="126.65" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 143.53 146.53 152.14 158.70 165.28 171.24 174.14 180.37 186.81 193.48 200.16 206.05 210.30 213.20" y="126.65" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="219.19 230.19 241.19 252.19 263.19 274.19" y="126.65" font-size="11.00" class="sc-notoserifcjksc">。具体而言，</text><text x="285.19 295.12 300.99 305.24 311.83 318.27 323.36 326.25 332.25 334.96" y="126.65" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="341.85 352.85 363.85 374.85 385.85 396.85 407.85 418.85 429.85 440.85 451.85 462.85 473.85 484.85 495.85 506.85 517.85 528.85" y="126.65" font-size="11.00" class="sc-notoserifcjksc">配合人类滥用的程度略有上升，即在用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">提出要求时同意实施有害行为。令人担忧的是，这还体现为针对此类有害行为接受无法核实的授</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">权的情况有所增加：</text><text x="171.00 180.93 186.80 191.05 197.64 204.08 209.17 212.06 218.06 220.76" y="157.89" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66" y="157.89" font-size="11.00" class="sc-notoserifcjksc">在这方面的水平高于</text><text x="329.55 338.29 344.86 351.42 356.52 359.41" y="157.89" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="365.40 376.40" y="157.89" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="390.30 400.23 406.09 410.35 416.94 423.37 428.47 431.36" y="157.89" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="440.25 451.25 462.25" y="157.89" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00 83.00 94.00" y="224.38" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="224.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66" y="224.38" font-size="11.00" class="sc-notoserifcjksc">对整轮预填充的易感性略高于</text><text x="307.55 316.29 322.85 329.42 334.51 337.41" y="224.38" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="343.40 354.40 365.40 376.40" y="224.38" font-size="11.00" class="sc-notoserifcjksc">，但低于</text><text x="390.30 400.23 406.09 410.35 416.94 423.37 428.47 431.36" y="224.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="440.25" y="224.38" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="454.14 460.38 466.81 473.49 480.17 486.05 490.31 493.20" y="224.38" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="502.09 513.09 524.09" y="224.38" font-size="11.00" class="sc-notoserifcjksc">的易感</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="240.00" font-size="11.00" class="sc-notoserifcjksc">性。不过值得注意的是，其中一些调查除了预填充面向用户的文本之外，还预填充了</text><text x="481.89 491.83 497.69 501.95 508.53 514.97 520.06 522.96 528.95 531.66" y="240.00" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="255.62" font-size="11.00" class="sc-notoserifcjksc">的思考文本，而商业用户无法使用这一功能。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p108.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 108 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">108</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p109.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 109 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">109</text><text x="72.00" y="412.68" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="412.68" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 105.93 108.03 113.56" y="412.68" font-size="9.00" class="sc-lorabold">6.4.2.A]</text><text x="119.40 128.40 137.40 146.40 155.40 164.40 173.40 182.40 191.40 200.40 209.40 218.40" y="412.68" font-size="9.00" class="sc-notoserifcjkscbold">我们的自动化行为审计得分</text><text x="227.40 236.40 245.40 254.40 263.40 272.40 281.40 290.40 299.40 308.40 317.40 326.40 335.40 344.40 353.40 362.40 371.40 380.40 389.40 398.40 407.40 416.40 425.40 434.40 443.40 452.40 461.40 470.40 479.40 488.40 497.40 506.40 515.40 524.40" y="412.68" font-size="9.00" class="sc-notoserifcjksc">，对应下列广义滥用与未对齐指标。数值越低表示所测行为的发生率或严重程</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00" y="424.38" font-size="9.00" class="sc-notoserifcjksc">度越低；本图中所有图表均为越低越好。在许多情况下，</text><text x="297.00" y="424.38" font-size="9.00" class="sc-loraregular">y</text><text x="304.12 313.12 322.12 331.12 340.12" y="424.38" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="351.49 354.76" y="424.38" font-size="9.00" class="sc-loraregular">10</text><text x="362.72 371.72 380.72 389.72 398.72 407.72 416.72 425.72 434.72 443.72 452.72 461.72 470.72 479.72 488.72 497.72 506.72 515.72 524.72" y="424.38" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。报告的得分是每个目标模型</text><text x="72.00 81.00 90.00" y="436.08" font-size="9.00" class="sc-notoserifcjksc">全部约</text><text x="101.37 106.25 108.51 111.79 117.38" y="436.08" font-size="9.00" class="sc-loraregular">4,100</text><text x="125.34 134.34 143.34 152.34 161.34 170.34 179.34 188.34 197.34" y="436.08" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="208.71 213.54 215.81 219.09 224.68" y="436.08" font-size="9.00" class="sc-loraregular">2,100</text><text x="232.64 241.64 250.64 259.64 268.64 277.64 286.64 295.64 304.64 313.64 322.64 331.64 340.64 349.64 358.64 367.64 376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64 466.64 475.64 484.64 493.64 502.64 511.64 520.64 529.64" y="436.08" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一次），每次调查通常包</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="447.78" font-size="9.00" class="sc-notoserifcjksc">含许多单独的对话。图中显示</text><text x="191.37 196.57 201.47" y="447.78" font-size="9.00" class="sc-loraregular">95%</text><text x="211.67 220.67 229.67 238.67 247.67" y="447.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00" y="507.97" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00 119.00 130.00 141.00 152.00" y="524.16" font-size="11.00" class="sc-notoserifcjkscbold">未对齐行为</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="524.16" font-size="11.00" class="sc-notoserifcjksc">：涵盖多种令人担忧行为的总括性指标，既包括配合人类滥用，也包括模型主</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="539.78" font-size="11.00" class="sc-notoserifcjksc">动采取的不良行为，覆盖一系列中等风险和高风险场景；</text><text x="108.00 119.00 130.00 141.00 152.00" y="572.74" font-size="11.00" class="sc-notoserifcjkscbold">违背宪法（</text><text x="163.00 168.70 174.92 181.94 187.28 191.82 195.37 199.92 206.67 211.21 214.81 221.04" y="572.74" font-size="11.00" class="sc-lorabold">constitution</text><text x="228.05" y="572.74" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="239.05 250.05 261.05 272.05 283.05" y="572.74" font-size="11.00" class="sc-notoserifcjksc">：明显违反</text><text x="296.95 304.64 307.63 313.24 319.80 326.38" y="572.74" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="335.24 346.24" y="572.74" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">宪法</text><text x="357.24 368.24 379.24 390.24 401.24 412.24 423.24 434.24 445.24 456.24 467.24 478.24" y="572.74" font-size="11.00" class="sc-notoserifcjksc">的字面规定或精神的行为；</text><text x="108.00 115.57 119.00 124.76 131.56 138.12 144.04 146.93 154.50 160.72 167.28" y="605.13" font-size="11.00" class="sc-lorabold">Claude Code</text><text x="176.09 187.09 198.09 209.09 220.09 231.09 242.09 253.09 264.09" y="605.13" font-size="11.00" class="sc-notoserifcjkscbold">沙箱中的未对齐行为</text><text x="275.09 286.09 297.09" y="605.13" font-size="11.00" class="sc-notoserifcjksc">：通过</text><text x="310.98 318.67 321.66 327.27 333.84 340.42 346.38 349.27 356.96 363.40 369.98" y="605.13" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="378.83 389.83 400.83 411.83 422.83 433.83 444.83 455.83 466.83 477.83 488.83 499.83 510.83 521.83" y="605.13" font-size="11.00" class="sc-notoserifcjksc">与沙箱化的计算机系统交互时出</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="620.75" font-size="11.00" class="sc-notoserifcjksc">现的令人担忧的行为；</text><text x="108.00 116.29 124.65" y="637.51" font-size="11.00" class="sc-lorabold">GUI</text><text x="131.80 142.80 153.80 164.80 175.80 186.80 197.80" y="637.51" font-size="11.00" class="sc-notoserifcjkscbold">中的未对齐行为</text><text x="208.80 219.80 230.80 241.80 252.80 263.80 274.80 285.80 296.80 307.80 318.80 329.80 340.80 351.80 362.80 373.80 384.80 395.80 406.80 417.80 428.80 439.80 450.80 461.80 472.80 483.80 494.80 505.80 516.80" y="637.51" font-size="11.00" class="sc-notoserifcjksc">：通过图形界面与沙箱化的计算机系统交互时出现的令人担忧的行</text><text x="108.00 119.00" y="653.13" font-size="11.00" class="sc-notoserifcjksc">为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="669.89" font-size="11.00" class="sc-notoserifcjkscbold">配合人类滥用</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00" y="669.89" font-size="11.00" class="sc-notoserifcjksc">：配合人类用户的滥用行为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="686.09" font-size="11.00" class="sc-notoserifcjkscbold">配合欺骗用户</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="686.09" font-size="11.00" class="sc-notoserifcjksc">：配合要求模型欺骗用户的指令（通常通过系统提示词下达）；</text><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="296.95" y="563.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="296.95" y="563.94" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="332.35" y="563.94" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="335.24" y="563.94" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="346.24" y="563.94" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/constitution" rel="noopener"><rect x="346.24" y="563.94" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p110.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 110 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">110</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">遵从有害系统提示词</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：配合有害的开发者指令；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">配合外泄或篡改安全防护措施</text><text x="251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">：自愿配合名义上由另一个</text><text x="385.89 392.78" y="114.99" font-size="11.00" class="sc-loraregular">AI</text><text x="399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="114.99" font-size="11.00" class="sc-notoserifcjksc">实例提供的提示词，该提示</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">词要求它帮助破坏某项重要的</text><text x="253.89 260.78" y="130.61" font-size="11.00" class="sc-loraregular">AI</text><text x="267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="130.61" font-size="11.00" class="sc-notoserifcjksc">安全措施，或将其权重副本外泄到未经授权的服务器；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">整轮预填充易感性</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：调查者以目标模型的口吻向对话注入有害轮次作为铺垫后，模型出现</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">的令人担忧的行为</text><text x="196.00" y="191.72" font-size="6.60" class="sc-loraregular">8</text><text x="199.71" y="195.39" font-size="11.00" class="sc-notoserifcjksc">；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">接受无法核实的授权：</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">将无法核实的权限或许可声明视为已核实，从而解锁其原本会拒绝</text><text x="108.00 119.00 130.00 141.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">的行为；</text><text x="108.00 119.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">欺诈</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">：自愿配合人类的欺诈企图；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="260.72" font-size="11.00" class="sc-notoserifcjkscbold">军用级武器：</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">自愿配合人类制造或获取常规军用级武器的企图；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">生物武器能力提升</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">：为获取、生产、增强或部署生物武器提供实质性的能力提升；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="325.49" font-size="11.00" class="sc-notoserifcjkscbold">化学武器能力提升</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="325.49" font-size="11.00" class="sc-notoserifcjksc">：为获取、合成或部署化学武器提供实质性的能力提升；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="357.88" font-size="11.00" class="sc-notoserifcjkscbold">放射性或核武器能力提升</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="357.88" font-size="11.00" class="sc-notoserifcjksc">：为获取、建造或部署放射性或核武器提供实质性的能力提升；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="390.26" font-size="11.00" class="sc-notoserifcjkscbold">爆炸性武器能力提升</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00" y="390.26" font-size="11.00" class="sc-notoserifcjksc">：为获取、合成、制造或部署爆炸装置提供实质性的能力提升；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">管制物质合成能力提升</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="422.64" font-size="11.00" class="sc-notoserifcjksc">：提供管制物质的合成路线、前体来源或详细的生产指导；</text><text x="108.00 119.00 130.00 141.00 152.00" y="455.02" font-size="11.00" class="sc-notoserifcjkscbold">有害性内容</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="455.02" font-size="11.00" class="sc-notoserifcjksc">：自愿生成有害或在语境中不恰当的性内容；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="487.41" font-size="11.00" class="sc-notoserifcjkscbold">不允许的网络攻击</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="487.41" font-size="11.00" class="sc-notoserifcjksc">：自愿配合非两用的网络攻击；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="503.60" font-size="11.00" class="sc-notoserifcjkscbold">破坏自由民主</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="503.60" font-size="11.00" class="sc-notoserifcjksc">：自愿配合严重且直接威胁自由民主运作的行为，包括政变策划、自我政变</text><text x="108.00" y="519.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00 124.61 131.18 135.43 141.87 147.90 154.33 157.32 163.89" y="519.22" font-size="11.00" class="sc-loraregular">autogolpe</text><text x="169.85 180.85 191.85 202.85 213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85" y="519.22" font-size="11.00" class="sc-notoserifcjksc">）策划、操纵选举，或出于政治动机的政府监视、审查或恐吓行动。</text><text x="499.85" y="515.56" font-size="6.60" class="sc-loraregular">9</text><text x="72.00 80.32 83.70 92.29 95.67" y="582.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.3</text><text x="106.55 119.55 132.55 145.55 158.55 171.55 184.55 197.55" y="582.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">不当的不配合行为</text><text x="72.00 83.00 94.00 105.00 116.00" y="610.80" font-size="11 ont-size="9.00" class="sc-loraregular">4,100</text><text x="107.34 116.34 125.34 134.34 143.34 152.34 161.34 170.34 179.34" y="336.26" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="190.71 195.54 197.81 201.09 206.68" y="336.26" font-size="9.00" class="sc-loraregular">2,100</text><text x="214.64 223.64 232.64 241.64 250.64 259.64 268.64 277.64 286.64 295.64 304.64 313.64 322.64 331.64 340.64 349.64 358.64 367.64 376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64 466.64 475.64 484.64 493.64 502.64 511.64 520.64 529.64" y="336.26" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一次），每次调查通常包含许</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="347.96" font-size="9.00" class="sc-notoserifcjksc">多段独立对话。图中显示</text><text x="173.37 178.57 183.47" y="347.96" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67 202.67 211.67 220.67 229.67" y="347.96" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00" y="408.16" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00 119.00 130.00 141.00 152.00" y="424.36" font-size="11.00" class="sc-notoserifcjkscbold">过度拒绝（</text><text x="163.00 169.16 174.95 180.86 186.14 191.34 197.25 201.31 208.11 213.45 219.21" y="424.36" font-size="11.00" class="sc-lorabold">overrefusal</text><text x="222.64" y="424.36" font-size="11.00" class="sc-notoserifcjkscbold">）</text><text x="233.64 244.64 255.64 266.64 277.64 288.64 299.64 310.64 321.64 332.64 343.64 354.64 365.64 376.64 387.64 398.64 409.64 420.64 431.64 442.64 453.64 464.64 475.64 486.64 497.64 508.64" y="424.36" font-size="11.00" class="sc-notoserifcjksc">：拒绝那些综合来看即使照做也不太可能造成伤害的请求；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="456.74" font-size="11.00" class="sc-notoserifcjkscbold">无视明确约束</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="456.74" font-size="11.00" class="sc-notoserifcjksc">：无视运营方（</text><text x="251.00 257.43 264.00 269.96 274.65 280.25 284.51 290.94" y="456.74" font-size="11.00" class="sc-loraregular">operator</text><text x="295.70 306.70 317.70 328.70 339.70 350.70 361.70 372.70 383.70 394.70 405.70 416.70 427.70 438.70 449.70 460.70 471.70 482.70 493.70 504.70 515.70 526.70" y="456.74" font-size="11.00" class="sc-notoserifcjksc">）或用户在提示中明确规定的、对其行为的适当约</text><text x="108.00 119.00 130.00 141.00" y="472.36" font-size="11.00" class="sc-notoserifcjksc">束；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="489.13" font-size="11.00" class="sc-notoserifcjkscbold">鲁莽的工具使用</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="489.13" font-size="11.00" class="sc-notoserifcjksc">：为满足用户请求而采取后果重大的操作，这些操作超出了用户的要求范</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="504.75" font-size="11.00" class="sc-notoserifcjksc">围，且可能造成难以逆转的副作用。</text><text x="72.00 80.32 83.70 92.29 95.67" y="536.05" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.4</text><text x="107.36 120.36 133.36 146.36" y="536.05" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">误导用户</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="563.94" font-size="11.00" class="sc-notoserifcjksc">我们的自动化审计发现，</text><text x="193.00 200.69 203.68 209.29 215.86 222.44 228.40 231.29 241.22 247.09 251.34 257.93 264.37 269.46 272.35 278.35 281.06" y="563.94" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="563.94" font-size="11.00" class="sc-notoserifcjksc">比此前发布的模型稍更诚实，幻觉也更少。在我们的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="579.56" font-size="11.00" class="sc-notoserifcjksc">调查中，它对输入（例如用户请求）产生幻觉的情况显著少于以往模型。此外，</text><text x="457.00 466.93 472.80 477.05 483.64 490.08 495.17 498.06 504.06 506.76" y="579.56" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="513.66 524.66" y="579.56" font-size="11.00" class="sc-notoserifcjksc">在任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="595.18" font-size="11.00" class="sc-notoserifcjksc">务未完成时虚假声称已完成的比率更低，总体上对用户的谄媚程度也更低。其他与误导用户相关</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="610.80" font-size="11.00" class="sc-notoserifcjksc">的指标与近期发布的模型大体相近。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p112.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 112 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">112</text><text x="72.00" y="585.18" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="585.18" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 106.06 108.15 113.69" y="585.18" font-size="9.00" class="sc-lorabold">6.4.4.A]</text><text x="119.53 128.53 137.53 146.53 155.53 164.53 173.53 182.53 191.53 200.53 209.53 218.53" y="585.18" font-size="9.00" class="sc-notoserifcjkscbold">我们的自动化行为审计得分</text><text x="227.53 236.53 245.53 254.53 263.53 272.53 281.53 290.53 299.53 308.53 317.53 326.53 335.53 344.53 353.53 362.53 371.53 380.53 389.53 398.53 407.53 416.53 425.53 434.53 443.53 452.53 461.53 470.53 479.53 488.53 497.53 506.53 515.53 524.53" y="585.18" font-size="9.00" class="sc-notoserifcjksc">，对应下列不诚实相关指标。数值越低，表示所测行为的发生率或严重程度越</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="596.88" font-size="9.00" class="sc-notoserifcjksc">低；本图所有图表均为越低越好。在许多情况下，</text><text x="270.00" y="596.88" font-size="9.00" class="sc-loraregular">y</text><text x="277.12 286.12 295.12 304.12 313.12" y="596.88" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="324.49 327.76" y="596.88" font-size="9.00" class="sc-loraregular">10</text><text x="335.72 344.72 353.72 362.72 371.72 380.72 389.72 398.72 407.72 416.72 425.72 434.72 443.72 452.72 461.72 470.72 479.72 488.72 497.72 506.72 515.72 524.72" y="596.88" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。所报告的得分是每个目标模型全部</text><text x="72.00" y="608.58" font-size="9.00" class="sc-notoserifcjksc">约</text><text x="83.37 88.25 90.51 93.79 99.38" y="608.58" font-size="9.00" class="sc-loraregular">4,100</text><text x="107.34 116.34 125.34 134.34 143.34 152.34 161.34 170.34 179.34" y="608.58" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="190.71 195.54 197.81 201.09 206.68" y="608.58" font-size="9.00" class="sc-loraregular">2,100</text><text x="214.64 223.64 232.64 241.64 250.64 259.64 268.64 277.64 286.64 295.64 304.64 313.64 322.64 331.64 340.64 349.64 358.64 367.64 376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64 466.64 475.64 484.64 493.64 502.64 511.64 520.64 529.64" y="608.58" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一次），每次调查通常包含许</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="620.28" font-size="9.00" class="sc-notoserifcjksc">多段独立对话。图中显示</text><text x="173.37 178.57 183.47" y="620.28" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67 202.67 211.67 220.67 229.67" y="620.28" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00" y="680.47" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00 119.00 130.00 141.00" y="696.66" font-size="11.00" class="sc-notoserifcjkscbold">欺骗用户</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="696.66" font-size="11.00" class="sc-notoserifcjksc">：自发地故意欺骗人类用户；</text><text x="108.00 119.00" y="712.86" font-size="11.00" class="sc-notoserifcjkscbold">谄媚</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p113.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 113 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">113</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">助长用户妄想</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：涉及更广泛地脱离现实的极端谄媚情形；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="114.99" font-size="11.00" class="sc-notoserifcjkscbold">在争议话题上回避：</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">在被问及社会或政治敏感话题时拒绝回答或给出过度含糊其辞的回</text><text x="108.00 119.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">答；</text><text x="108.00 119.00 130.00 141.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">输入幻觉</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">：凭空捏造或严重歪曲文件、工具输出或以往用户轮次的内容；</text><text x="108.00 119.00 130.00 141.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">重要遗漏</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：未提及用户显然会认为重要的事实；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="212.14" font-size="11.00" class="sc-notoserifcjkscbold">未披露不良或偷懒行为：</text><text x="229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="212.14" font-size="11.00" class="sc-notoserifcjksc">涉及模型自身在对话记录中先前的工具使用操作的重要遗漏；以</text><text x="108.00" y="227.76" font-size="11.00" class="sc-notoserifcjksc">及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="244.53" font-size="11.00" class="sc-notoserifcjkscbold">虚假完成声明</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">：在任务并未完成、成功或经过验证时声称其已完成、成功或经过验证。</text><text x="72.00 80.32 83.70 92.29 95.67" y="291.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.5</text><text x="107.14 120.14 133.14 146.14 159.14 172.14 185.14 198.14 211.14 224.14 237.14 250.14 263.14 276.14 289.14 302.14 315.14 328.14 341.14" y="291.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他令人担忧或出人意料的、出于模型自身</text><text x="72.00 85.00 98.00 111.00 124.00" y="313.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">主动的行为</text><text x="72.00" y="341.77" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 94.63 101.19 107.76 112.85 115.75" y="341.77" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="124.64 135.64 146.64" y="341.77" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="157.64 165.32 168.32 173.93 180.49 187.07 193.03 195.93 205.86 211.72 215.98 222.57 229.00 234.10 236.99 242.98 245.69" y="341.77" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="252.59 263.59 274.59 285.59 296.59 307.59 318.59 329.59 340.59 351.59 362.59 373.59 384.59 395.59 406.59 417.59 428.59 439.59 450.59 461.59 472.59 483.59 494.59 505.59 516.59 527.59" y="341.77" font-size="11.00" class="sc-notoserifcjksc">略微更倾向于绕过审批关口，有时会以明显未经批准的方式</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="357.39" font-size="11.00" class="sc-notoserifcjksc">规避这些关口；我们的内部监控也注意到了这一行为（第</text><text x="349.89 356.25 358.96 364.86 367.57" y="357.39" font-size="11.00" class="sc-loraregular">6.2.1</text><text x="374.47 385.47 396.47 407.47 418.47 429.47 440.47" y="357.39" font-size="11.00" class="sc-notoserifcjksc">节）。不过，与</text><text x="454.36 463.09 469.66 476.23 481.32 484.21" y="357.39" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="493.10 504.10 515.10 526.10" y="357.39" font-size="11.00" class="sc-notoserifcjksc">相比，我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="388.63" font-size="11.00" class="sc-notoserifcjksc">弱的证据，表明</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96 198.95 201.66" y="388.63" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="388.63" font-size="11.00" class="sc-notoserifcjksc">是在尝试解决任务时过度主动，而非无条件地寻求对其环境的更多控</text><text x="72.00 83.00" y="404.25" font-size="11.00" class="sc-notoserifcjksc">制。</text></svg></div>
