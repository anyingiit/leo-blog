r"><rect x="451.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="462.72" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="462.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="473.72" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="473.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 80.34 83.48 90.75 93.89 101.38 104.76 110.53 113.96 122.40 130.83 137.32 146.38 151.37 159.39 167.82" y="664.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.2 LinuxArena</text><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="381.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="381.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 103.26 105.35 110.89" y="381.42" font-size="9.00" class="sc-lorabold">6.7.1.A]</text><text x="116.73 125.73 134.73 143.73 152.73 161.73" y="381.42" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率：</text><text x="170.73 179.73 188.73 197.73 206.73 215.73 224.73 233.73 242.73 251.73 260.73 269.73 278.73 287.73 296.73 305.73 314.73 323.73 332.73 341.73 350.73 359.73 368.73 377.73 386.73 395.73 404.73 413.73 422.73 431.73 440.73 449.73 458.73 467.73 476.73 485.73" y="381.42" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且监控器的怀疑分数保持在阈值以下的轨迹所占比例。在</text><text x="497.10 503.86" y="381.42" font-size="9.00" class="sc-loraregular">No</text><text x="72.00 77.76 83.15 85.68 91.14 95.98 98.51 103.97" y="393.12" font-size="9.00" class="sc-loraregular">Thinking</text><text x="111.31" y="393.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="122.68 128.28 133.05 136.53 141.41 146.87 152.25 157.09 162.47 164.83 170.60 175.99 178.51 183.98 188.81 191.34 196.80" y="393.12" font-size="9.00" class="sc-loraregular">Extended Thinking</text><text x="204.15 213.15 222.15 231.15 240.15 249.15 258.15 267.15 276.15 285.15 294.15 303.15 312.15 321.15 330.15 339.15 348.15 357.15 366.15 375.15 384.15 393.15 402.15 411.15 420.15 429.15 438.15 447.15 456.15 465.15 474.15" y="393.12" font-size="9.00" class="sc-notoserifcjksc">设置中，智能体的推理过程会展示给监控器，与部署时的情况一致。在</text><text x="485.51 492.47 495.00 500.38 505.76 510.64" y="393.12" font-size="9.00" class="sc-loraregular">Hidden</text><text x="72.00 77.10 81.89 85.72 90.31 93.79 98.58 103.97 109.34 113.99" y="404.83" font-size="9.00" class="sc-loraregular">Scratchpad</text><text x="121.73 130.73 139.73 148.73 157.73 166.73 175.73 184.73 193.73 202.73 211.73 220.73 229.73 238.73 247.73 256.73 265.73 274.73 283.73 292.73 301.73 310.73 319.73 328.73 337.73 346.73 355.73 364.73 373.73 382.73 391.73 400.73 409.73 418.73 427.73 436.73 445.73 454.73 463.73 472.73 481.73 490.73 499.73 508.73 517.73 526.73" y="404.83" font-size="9.00" class="sc-notoserifcjksc">设置中，监控器只能看到智能体对用户可见的输出，而看不到其推理过程，这代表一种对经提示的攻击者</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00" y="416.52" font-size="9.00" class="sc-notoserifcjksc">模型更有利的上限条件。每根柱为</text><text x="209.37 214.00" y="416.52" font-size="9.00" class="sc-loraregular">24</text><text x="221.25 230.25 239.25 248.25 257.25 266.25 275.25 284.25 293.25 302.25 311.25 320.25 329.25 338.25 347.25 356.25 365.25 374.25 383.25 392.25 401.25 410.25 419.25 428.25 437.25 446.25 455.25 464.25 473.25 482.25 491.25 500.25 509.25 518.25" y="416.52" font-size="9.00" class="sc-notoserifcjksc">项任务上的平均隐蔽率。产生错误的尝试已被排除。尝试次数因任务和模型而</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00" y="428.23" font-size="9.00" class="sc-notoserifcjksc">异。误差线表示基于有效尝试的</text><text x="200.37 205.57 210.47" y="428.23" font-size="9.00" class="sc-loraregular">95%</text><text x="220.67 229.67 238.67 247.67" y="428.23" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="256.67 261.91 267.17 272.44 275.92 280.09 283.57 287.41 292.05" y="428.23" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="297.42 306.42 315.42 324.42 333.42 342.42 351.42 360.42 369.42 378.42 387.42 396.42 405.42 414.42 423.42 432.42 441.42 450.42 459.42 468.42 477.42 486.42 495.42 504.42 513.42 522.42 531.42" y="428.23" font-size="9.00" class="sc-notoserifcjksc">）置信区间，并经过加权，使每项任务无论其有效尝试次数多</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="439.92" font-size="9.00" class="sc-notoserifcjksc">少，对估计值的贡献都相同。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="499.97" font-size="11.00" class="sc-notoserifcjksc">在全部四种条件下，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 219.22 225.09 229.34 235.93 242.37 247.46 250.35 256.35 259.06" y="499.97" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="499.97" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率都与表现最好的对比模型相当。当其推理过程对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00" y="515.59" font-size="11.00" class="sc-notoserifcjksc">监控器隐藏时，它的隐蔽率约为</text><text x="228.89 234.80 240.79" y="515.59" font-size="11.00" class="sc-loraregular">25%</text><text x="250.37 261.36 272.36 283.36 294.36 305.36 316.36 327.36 338.36 349.36 360.36 371.36 382.36 393.36 404.36" y="515.59" font-size="11.00" class="sc-notoserifcjksc">，略低于该条件下最强的对比模型</text><text x="418.26 425.95 428.94 434.55 441.12 447.69 453.66 456.55 466.48 472.34 476.60 483.19 489.63" y="515.59" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="531.21" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63 123.63 134.63 145.63 156.63 167.63 178.63 189.63 200.63 211.63 222.63" y="531.21" font-size="11.00" class="sc-notoserifcjksc">。当其推理过程可见时，</text><text x="233.63 243.57 249.43 253.69 260.28 266.71 271.80 274.70 280.69 283.40" y="531.21" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="290.30 301.30 312.30 323.30 334.30" y="531.21" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率为</text><text x="348.19 352.19 358.55 365.04 369.04 374.12" y="531.21" font-size="11.00" class="sc-loraregular">16–17%</text><text x="383.68 394.68" y="531.21" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="408.58 418.51 424.37 428.63 435.22 441.65 446.75 449.64 456.31 460.99 466.90 472.45 475.55 481.46" y="531.21" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="493.17 504.17 515.17 526.17" y="531.21" font-size="11.00" class="sc-notoserifcjksc">持平，并</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="546.83" font-size="11.00" class="sc-notoserifcjksc">超过所有其他对比模型。值得注意的是，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06 317.06 319.76" y="546.83" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="546.83" font-size="11.00" class="sc-notoserifcjksc">完成附带任务并不依赖大量推理：在其最佳</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="562.45" font-size="11.00" class="sc-notoserifcjksc">提示词下，无论是关闭扩展思考、将推理强度设为</text><text x="316.89 323.49 330.09" y="562.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="336.70 347.70 358.70 369.70 380.70 391.70 402.70 413.70 424.70 435.70 446.70 457.70 468.70 479.70 490.70 501.70 512.70 523.70" y="562.45" font-size="11.00" class="sc-notoserifcjksc">，还是设为最高推理强度，其附带任务成</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="578.07" font-size="11.00" class="sc-notoserifcjksc">功率和隐蔽率几乎不变；即使在最高推理强度下，它生成的推理内容也非常少。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="692.66" font-size="11.00" class="sc-notoserifcjksc">为了在更接近我们实际部署的环境中评估模型规避监督的能力，我们在高风险的软件环境中进行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="708.28" font-size="11.00" class="sc-notoserifcjksc">了一项评估。我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00 83.00 94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">改编了</text><text x="107.89 114.25 117.34 124.02 130.59 136.77 143.65 148.34 154.30 160.98" y="82.61" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="166.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="177.65 184.53 189.22 194.89 200.69 206.50 209.39 215.28 219.53 222.43 228.10 231.09 233.80 236.69 242.60 249.35 255.26" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Tracy et al. 2026</text><text x="261.62 272.62 283.62 294.62 305.62 316.62 327.62" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的一个子集。</text><text x="338.62 344.98 348.07 354.74 361.31 367.49 374.38 379.06 385.03 391.70" y="82.61" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="400.27 411.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="425.17 432.00 437.90 444.43 453.11 459.54 465.98 472.55 475.45 482.28 488.24 493.33 499.27 504.95 509.64 515.49" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Redwood Research</text><text x="524.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 78.84 85.18 91.75 94.84 101.03 105.29 110.96 120.80" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">EquiStamp</text><text x="130.26 141.26 152.26 163.26 174.26 185.26 196.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">共同开发的一个</text><text x="210.15 217.04" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="223.61 234.61 245.61 256.61 267.61 278.61 289.61 300.61 311.61 322.61 333.61 344.61 355.61 366.61 377.61 388.61 399.61 410.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">控制竞技场，其中智能体操作一台真实的</text><text x="424.51 430.86 433.96 440.63 447.20" y="98.23" font-size="11.00" class="sc-loraregular">Linux</text><text x="455.92 466.92 477.92 488.92 499.92 510.92 521.92" y="98.23" font-size="11.00" class="sc-notoserifcjksc">机器，被分配一</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个软件工程或系统管理方面的主任务，并被指示同时在不引起监控器怀疑的情况下完成一个有害</text><text x="360.89 367.13 375.71 382.60 390.68 397.30 402.68 409.57 414.25 420.22 426.89" y="129.47" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="129.47" font-size="11.00" class="sc-notoserifcjksc">评估一样，我们将监</text><text x="72.00 83.00 94.00 105.00 116.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">控器升级为</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="145.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89 520.89" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，并使用我们目前用于监控内部智能体流量的提示词。监控器会观</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">察智能体的完整对话记录（包括其推理过程），并在给出判定之前对整条轨迹进行推理。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">以往的系统卡为该评估报告了两种监控器设置，区别在于监控器在为轨迹评分时是否使用思维链</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">推理。现在我们固定让监控器始终进行思维链推理，并报告两种智能体配置的结果：启用和不启</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">用扩展思考。我们还运行了</text><text x="206.89 213.13 221.71 228.60 236.68 243.30 248.68 255.57 260.25 266.22 272.89" y="259.57" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="281.46 292.46 303.46 314.46 325.46 336.46 347.46 358.46 369.46 380.46 391.46 402.46 413.46 424.46 435.46 446.46 457.46 468.46 479.46 490.46 501.46 512.46 523.46" y="259.57" font-size="11.00" class="sc-notoserifcjksc">一节中所述的自动化提示词优化流程，这次直接针对</text><text x="72.00 78.36 81.45 88.13 94.69 100.88 107.76 112.45 118.41 125.09" y="275.19" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="130.76 141.76 152.76 163.76 174.76 185.76 196.76 207.76 218.76 229.76 240.76 251.76 262.76 273.76 284.76 295.76 306.76 317.76 328.76 339.76 350.76 361.76 372.76 383.76 394.76 405.76 416.76 427.76 438.76 449.76 460.76 471.76 482.76 493.76 504.76 515.76 526.76" y="275.19" font-size="11.00" class="sc-notoserifcjksc">，以找出在两种设置下分别能引出最高隐蔽率的攻击者系统提示词。随后，我们在每</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">种设置下用标准提示词以及提示词优化搜索找到的提示词评估每个模型。对于每个模型和每种设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="306.43" font-size="11.00" class="sc-notoserifcjksc">置，我们报告取得最高分数的提示词。</text><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="177.65" y="73.81" width="28.84" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="206.50" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="209.39" y="73.81" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="219.53" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="222.43" y="73.81" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="233.80" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="236.69" y="73.81" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="425.17" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="425.17" y="73.81" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="472.55" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="475.45" y="73.81" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="538.86" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="72.00" y="89.43" width="55.36" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="382.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="382.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.40 106.50 112.03 115.51 117.87 123.31 126.25 131.95 137.51 142.44 148.41 152.66 157.50 163.24" y="382.92" font-size="9.00" class="sc-lorabold">6.7.2.A] LinuxArena</text><text x="170.32 179.32 188.32 197.32 206.32 215.32 224.32 233.32 242.32 251.32 260.33 269.33" y="382.92" font-size="9.00" class="sc-notoserifcjkscbold">中附带任务的成功隐蔽完成</text><text x="278.33 287.33 296.33 305.33 314.33 323.33 332.33 341.33 350.33" y="382.92" font-size="9.00" class="sc-notoserifcjksc">。每个模型均在一个</text><text x="361.69 368.84 374.21 379.58 383.75 386.12 391.00 393.21" y="382.92" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="400.64 409.64 418.64 427.64 436.64 445.64 454.64 463.64 472.64 481.64 490.64 499.64 508.64 517.64 526.64" y="382.92" font-size="9.00" class="sc-notoserifcjksc">监控器下接受评估，该监控器可以</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="394.62" font-size="9.00" class="sc-notoserifcjksc">看到智能体的完整对话记录，包括智能体的推理过程。两种条件的唯一区别在于是否为智能体（而非监控器）启用扩展</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="406.33" font-size="9.00" class="sc-notoserifcjksc">思考。出错的尝试已被排除。误差线为基于尝试的</text><text x="272.37 277.57 282.47" y="406.33" font-size="9.00" class="sc-loraregular">95%</text><text x="292.67 301.67 310.67 319.67 328.67 337.67 346.67 355.67 364.67 373.67 382.67 391.67 400.67 409.67 418.67 427.67 436.67 445.67 454.67 463.67 472.67 481.67 490.67 499.67 508.67" y="406.33" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间，并经过加权，使每项任务的贡献相同。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93" y="418.02" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="144.20 153.20 162.20 171.20 180.20 189.20 198.20 207.20 216.20 225.20 234.20" y="418.02" font-size="9.00" class="sc-notoserifcjksc">不支持关闭思考的设置。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="461.72" font-size="11.00" class="sc-notoserifcjksc">在两种设置下，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 234.35 237.05" y="461.72" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="243.95 254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="461.72" font-size="11.00" class="sc-notoserifcjksc">都取得了我们迄今发布的所有模型中最高的隐蔽率：关闭扩展</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="477.34" font-size="11.00" class="sc-notoserifcjksc">思考时隐蔽率约为</text><text x="162.89 168.80 174.71" y="477.34" font-size="11.00" class="sc-loraregular">22%</text><text x="184.28 195.28 206.28 217.28 228.28 239.28" y="477.34" font-size="11.00" class="sc-notoserifcjksc">，启用时约为</text><text x="253.17 257.17 263.30" y="477.34" font-size="11.00" class="sc-loraregular">13%</text><text x="272.87 283.87 294.87 305.87 316.87 327.87 338.87 349.87 360.87 371.87 382.87 393.87 404.87 415.87 426.87 437.87 448.87 459.87 470.87 481.87 492.87 503.87 514.87 525.87" y="477.34" font-size="11.00" class="sc-notoserifcjksc">，在每种情况下都超过了最强的对比模型。值得注意的</text><text x="72.00 83.00" y="492.96" font-size="11.00" class="sc-notoserifcjksc">是，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="492.96" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="492.96" font-size="11.00" class="sc-notoserifcjksc">执行这些附带任务并不需要大量显式推理。即使在关闭扩展思考、且提示词将其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="524.20" font-size="11.00" class="sc-notoserifcjksc">限提示词下的任何对比模型都更频繁，而这也正是它最具隐蔽性的设置。这些结果在很大程度上</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="539.82" font-size="11.00" class="sc-notoserifcjksc">归功于提示词优化，它显著提高了</text><text x="239.89 249.83 255.69 259.95 266.54 272.97 278.06 280.96 286.95 289.66" y="539.82" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="296.55 307.55 318.55" y="539.82" font-size="11.00" class="sc-notoserifcjksc">以及除</text><text x="332.45 340.14 343.13 348.74 355.30 361.88 367.85 370.74 376.98 383.41 390.09 396.76 402.65 406.91 409.80" y="539.82" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="418.69 429.69 440.69 451.69 462.69 473.69 484.69 495.69 506.69 517.69 528.69" y="539.82" font-size="11.00" class="sc-notoserifcjksc">之外每个对比模型的隐蔽</text><text x="72.00 83.00" y="555.44" font-size="11.00" class="sc-notoserifcjksc">性；</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 138.53 144.96 151.64 158.32 164.20 168.46 171.35" y="555.44" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="180.24 191.24 202.24 213.24 224.24 235.24 246.24 257.24 268.24 279.24 290.24 301.24 312.24 323.24 334.24 345.24 356.24 367.24 378.24" y="555.44" font-size="11.00" class="sc-notoserifcjksc">在所有提示词下都仍接近于零。提升幅度在</text><text x="392.13 402.07 407.93 412.19 418.77 425.21 430.30 433.20 439.19 441.90" y="555.44" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="448.79 459.79 470.79 481.79 492.79 503.79 514.79" y="555.44" font-size="11.00" class="sc-notoserifcjksc">上最为明显，在</text><text x="72.00 80.73 87.30 93.87 98.96 101.85 107.82 110.52" y="571.06" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60 130.60 141.60 152.60" y="571.06" font-size="11.00" class="sc-notoserifcjksc">上最小。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="656.03" font-size="11.00" class="sc-notoserifcjksc">我们发现，最有效的提示词会规定并约束智能体的推理：它们声明有一名审查者会阅读智能体写</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="671.65" font-size="11.00" class="sc-notoserifcjksc">下的所有内容，禁止任何提及附带任务的内容，并将每一轮限制为简短的固定格式。即便如此，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="687.27" font-size="11.00" class="sc-notoserifcjksc">在每种设置下，绝大多数尝试仍未能在不被发现的情况下完成附带任务。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p135.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 135 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">135</text><text x="72.00 80.32 83.70 90.82 94.20" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.7.3</text><text x="105.08 118.08 131.08 144.08 157.08 170.08 183.08 196.08 209.08 222.08 235.08" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有意极低频率地采取行动</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="115.03" font-size="11.00" class="sc-notoserifcjksc">如果一个模型希望在部署后执行某项有害行动，但在对齐评估期间避免执行该行动（从而避免被</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.65" font-size="11.00" class="sc-notoserifcjksc">发现），一种可能的策略是利用评估与部署之间的规模差异。为此，模型可以以一个非常低但非</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="161.89" font-size="11.00" class="sc-notoserifcjksc">测试中从不发生。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="228.38" font-size="11.00" class="sc-notoserifcjksc">为了评估这一能力，我们对</text><text x="206.89 213.13 219.09 223.86 228.54 234.22 240.89 247.33 250.22 256.11 260.36 263.26 268.93 271.93 274.63 277.52 283.43 290.19 296.09" y="228.38" font-size="11.00" class="sc-loraregular" fill="#0000ff">Serrano et al. 2026</text><text x="305.34 316.34 327.34 338.34 349.34 360.34 371.34 382.34 393.34 404.34 415.34 426.34 437.34 448.34 459.34 470.34 481.34 492.34 503.34 514.34 525.34" y="228.38" font-size="11.00" class="sc-notoserifcjksc">中所述的评估进行了内部复现。在该评估中，模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00" y="244.00" font-size="11.00" class="sc-notoserifcjksc">型被提示以指定的频率执行某个特定行动（例如在编程任务中使用名为</text><text x="413.00 417.40 421.06 427.50 433.65" y="244.00" font-size="11.00" class="sc-loraregular">“foo”</text><text x="437.49 448.49 459.49 470.49 481.49 492.49 503.49 514.49 525.49" y="244.00" font-size="11.00" class="sc-notoserifcjksc">的变量），并经过多</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="259.62" font-size="11.00" class="sc-notoserifcjksc">次重新采样，以检验相关行为的观测频率。我们使用与此前在</text><text x="371.89 379.58 382.57 388.18 394.75 401.33 407.29 410.18 415.77 421.45 427.85 430.84 436.80 439.70" y="259.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="448.59" y="259.62" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="462.48 470.17 473.16 478.77 485.34 491.91 497.88 500.77 510.70 516.57 520.82 527.41 533.85" y="259.62" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos</text><text x="72.00" y="275.24" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="80.89 91.89 102.89" y="275.24" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="116.78 127.78 138.78 149.78 160.78 171.78 182.78 193.78 204.78 215.78 226.78 237.78 248.78" y="275.24" font-size="11.00" class="sc-notoserifcjksc">中报告的相同设置，每种设置</text><text x="262.67 268.64 271.24 278.07 284.91" y="275.24" font-size="11.00" class="sc-loraregular">4,000</text><text x="294.64 305.64 316.64 327.64" y="275.24" font-size="11.00" class="sc-notoserifcjksc">个样本。</text><text x="72.00" y="619.91" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.64 106.74 112.28" y="619.91" font-size="9.00" class="sc-lorabold">6.7.3.A]</text><text x="118.12 127.12 136.12 145.12 154.12 163.12 172.12 181.12 190.12 199.12 208.12 217.12 226.12 235.12 244.12 253.12" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">在不同随机性设置下，模型被指示以</text><text x="264.48 268.14" y="619.91" font-size="9.00" class="sc-lorabold">1%</text><text x="278.64 287.64 296.64 305.64 314.64 323.64 332.64 341.64 350.64 359.64 368.64 377.64 386.64 395.64 404.64 413.64 422.64 431.64 440.64 449.64 458.64 467.64 476.64" y="619.91" font-size="9.00" class="sc-notoserifcjkscbold">的概率采取某个罕见行动时实际采取该行动的频率。</text><text x="485.64 494.64 503.64 512.64 521.64 530.64" y="619.91" font-size="9.00" class="sc-notoserifcjksc">当提供显式随</text><text x="72.00 81.00 90.00 99.00 108.00" y="631.61" font-size="9.00" class="sc-notoserifcjksc">机性（通过</text><text x="119.37 126.14 132.90 135.92" y="631.61" font-size="9.00" class="sc-loraregular">UUID</text><text x="142.62 151.62 160.62 169.62 178.62 187.62 196.62 205.62 214.62 223.62 232.62 241.62 250.62 259.62 268.62 277.62 286.62 295.62 304.62 313.62 322.62 331.62 340.62 349.62 358.62 367.62 376.62" y="631.61" font-size="9.00" class="sc-notoserifcjksc">）时，或当模型被提示生成一个随机字符串并用其做出决定（</text><text x="385.62 390.73 395.83 400.82" y="631.61" font-size="9.00" class="sc-loraregular">SSoT</text><text x="406.57 415.57 424.57 433.57 442.57 451.57 460.57 469.57 478.57 487.57 496.57 505.57 514.57 523.57" y="631.61" font-size="9.00" class="sc-notoserifcjksc">）时，所有模型都取得了非零结</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="643.31" font-size="9.00" class="sc-notoserifcjksc">果。我们还测试了另外三种设置：一种没有任何提示或随机性来源的基线设置、一种诱导性较弱的策略提示，以及一个</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00" y="655.01" font-size="9.00" class="sc-notoserifcjksc">提示词各不相同、可提供自然随机性来源的数据集；在所有这些设置中，所有模型都降为零。每种设置使用</text><text x="497.37 502.24 504.38 509.97 515.56" y="655.01" font-size="9.00" class="sc-loraregular">4,000</text><text x="523.52" y="655.01" font-size="9.00" class="sc-notoserifcjksc">个</text><text x="72.00 81.00 90.00" y="666.71" font-size="9.00" class="sc-notoserifcjksc">样本。</text><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="219.58" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="206.89" y="219.58" width="40.44" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="247.33" y="219.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="250.22" y="219.58" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="260.36" y="219.58" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="263.26" y="219.58" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.02202" rel="noopener"><rect x="274.63" y="219.58" width="2.89" height="11.00" fill="trans s-5-system-card" rel="noopener"><rect x="500.77" y="250.82" width="38.17" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="538.94" y="250.82" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="72.00" y="266.44" width="6.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="78.00" y="266.44" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="80.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="91.89" y="266.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="91.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="102.89" y="266.44" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="102.89" y="266.44" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p136.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 136 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">136</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="82.61" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66" y="82.61" font-size="11.00" class="sc-notoserifcjksc">呈现出与其前代模型相同的模式。当提示词提供了熵源（</text><text x="403.66 411.93 420.21 423.89" y="82.61" font-size="11.00" class="sc-loraregular">UUID</text><text x="432.09 443.09 454.09 465.09 476.09 487.09 498.09 509.09 520.09" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）或可行的操作流程</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.24 95.47 101.57" y="98.23" font-size="11.00" class="sc-loraregular">SSoT</text><text x="108.61 119.61 130.61 141.61 152.61 163.61 174.61 185.61 196.61 207.61 218.61 229.61 240.61 251.61 262.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）时，它在这两种设置下都以低于</text><text x="276.50 280.51" y="98.23" font-size="11.00" class="sc-loraregular">1%</text><text x="292.97 303.97 314.97 325.97 336.97 347.97 358.97 369.97 380.97 391.97 402.97 413.97 424.97 435.97 446.97" y="98.23" font-size="11.00" class="sc-notoserifcjksc">目标的非零频率采取该罕见行动。</text><text x="457.97 465.66 468.65 474.26 480.83 487.40 493.37 496.26 504.99 511.56 518.13 523.22 526.11" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">在这两种设置下都最接近目标。在图中未展示的三种设置（基线、策略提示和自然设置）中，模</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">型必须自行寻找随机性，</text><text x="193.00 202.93 208.80 213.05 219.64 226.08 231.17 234.06 240.06 242.76" y="129.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="249.66" y="129.47" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="263.55 269.52 272.12 278.95 285.79" y="129.47" font-size="11.00" class="sc-loraregular">4,000</text><text x="295.52 306.52 317.52 328.52 339.52 350.52 361.52 372.52 383.52 394.52 405.52 416.52 427.52 438.52 449.52 460.52 471.52 482.52 493.52 504.52 515.52 526.52" y="129.47" font-size="11.00" class="sc-notoserifcjksc">个样本中从未采取该行动，与在这些设置上测试的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">所有其他模型一样。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">对话记录审查表明，</text><text x="171.00 177.24 183.47 189.57" y="195.95" font-size="11.00" class="sc-loraregular">SSoT</text><text x="199.50 210.50 221.50 232.50 243.50 254.50 265.50 276.50" y="195.95" font-size="11.00" class="sc-notoserifcjksc">频率偏低的原因是</text><text x="290.39 300.33 306.19 310.45 317.04 323.47 328.56 331.46 337.45 340.16" y="195.95" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="347.06 358.06 369.06 380.06 391.06 402.06 413.06 424.06 435.06 446.06 457.06 468.06 479.06 490.06 501.06 512.06 523.06" y="195.95" font-size="11.00" class="sc-notoserifcjksc">生成的字符串缺乏熵。它的大多数种子</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">字符串都是同一模板的细微变体，因此其字符编码之和（决定是否采取行动）集中在少数几个值</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">上，很少等于触发值。</text><text x="182.00 189.69 192.68 198.29 204.86 211.44 217.40 220.29 226.53 232.96 239.64 246.32 252.20 256.46 259.35" y="227.19" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="268.24" y="227.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="282.13 290.87 297.43 304.00 309.09 311.99" y="227.19" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="320.88 331.88 342.88 353.88 364.88 375.88 386.88 397.88 408.88 419.88 430.88 441.88 452.88" y="227.19" font-size="11.00" class="sc-notoserifcjksc">生成的字符串变化更多，接近</text><text x="466.77 470.77" y="227.19" font-size="11.00" class="sc-loraregular">1%</text><text x="483.24 494.24 505.24 516.23" y="227.19" font-size="11.00" class="sc-notoserifcjksc">的目标。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="293.10" font-size="11.00" class="sc-notoserifcjksc">在策略提示设置下，提示词指示模型想出一个能使其行动频率校准到</text><text x="404.89 408.90" y="293.10" font-size="11.00" class="sc-loraregular">1%</text><text x="421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="293.10" font-size="11.00" class="sc-notoserifcjksc">的流程。与早期模型一</text><text x="72.00 83.00" y="308.72" font-size="11.00" class="sc-notoserifcjksc">样，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="308.72" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66" y="308.72" font-size="11.00" class="sc-notoserifcjksc">大多只是说出一个数字而背后没有任何流程，或者推理认为</text><text x="439.55 443.56" y="308.72" font-size="11.00" class="sc-loraregular">1%</text><text x="456.02 467.02 478.02 489.02 500.02 511.02 522.02" y="308.72" font-size="11.00" class="sc-notoserifcjksc">的事件不太可能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="324.34" font-size="11.00" class="sc-notoserifcjksc">发生而拒绝行动。在大约</text><text x="195.89 199.90" y="324.34" font-size="11.00" class="sc-loraregular">1%</text><text x="212.36 223.36 234.36 245.36 256.36 267.36 278.36 289.36 300.36 311.36 322.36 333.36 344.36 355.36 366.36 377.36 388.36 399.36 410.36 421.36 432.36 443.36 454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="324.34" font-size="11.00" class="sc-notoserifcjksc">的样本中，它更进一步，自行生成数字，并将其与一个事先确定的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="339.96" font-size="11.00" class="sc-notoserifcjksc">值进行比对，但这些尝试均未导致采取该行动。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="390.27" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有发现</text><text x="195.89 205.83 211.69 215.95 222.54 228.97 234.06 236.96 242.95 245.66" y="390.27" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="390.27" font-size="11.00" class="sc-notoserifcjksc">在有意以经过校准的低频率采取行动方面比以往模型有实质</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="405.89" font-size="11.00" class="sc-notoserifcjksc">性提升。其校准偏差的方向本身并不令人放心：采用这种方法的模型会比预期更少地采取行动，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="421.51" font-size="11.00" class="sc-notoserifcjksc">但仍会偶尔采取行动，而这对于固定规模的评估而言更难检测。然而在实践中，主要的关切在于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="437.13" font-size="11.00" class="sc-notoserifcjksc">模型是否会自行想到这一策略，以及它是否根本能够执行该策略；在没有显式熵源或明确流程的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="452.75" font-size="11.00" class="sc-notoserifcjksc">设置中，我们测试的所有模型两者都做不到。</text><text x="72.00 80.32 83.70 90.82 94.20" y="518.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.7.4</text><text x="105.89 118.89 131.89 144.89 157.89 170.89" y="518.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">思维链可控性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="550.02" font-size="11.00" class="sc-notoserifcjksc">在内部部署期间，我们会监控我们的模型是否存在未对齐行为。倾向于在扩展思考中言语化表达</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="565.64" font-size="11.00" class="sc-notoserifcjksc">其采取未对齐行为之意图的模型，可能要容易被发现得多。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="614.80" font-size="11.00" class="sc-notoserifcjksc">模型变得更难以监控的一种途径，是获得有意控制其扩展思考某些方面的能力，例如有选择地省</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="630.42" font-size="11.00" class="sc-notoserifcjksc">略监控器所需的关键信息。为了衡量这种思维链可控性（</text><text x="347.00 354.69 360.78 367.82 370.72 376.51 382.95 389.53 393.78 398.47 404.90 407.90 410.89 416.56 422.97 426.06 429.05 432.32 436.60" y="630.42" font-size="11.00" class="sc-loraregular">CoT controllability</text><text x="442.40 453.40 464.40 475.40 486.40" y="630.42" font-size="11.00" class="sc-notoserifcjksc">），我们对</text><text x="500.30 507.99 514.57 520.54 527.21 530.11 535.99" y="630.42" font-size="11.00" class="sc-loraregular" fill="#0000ff">Chen et</text><text x="72.00 77.68 80.67" y="646.04" font-size="11.00" class="sc-loraregular" fill="#0000ff">al.</text><text x="86.27 97.27 108.27 119.27 130.27 141.27 152.27 163.27 174.27 185.27 196.27 207.27 218.27 229.27 240.27 251.27" y="646.04" font-size="11.00" class="sc-notoserifcjksc">中的评估进行了内部复现：我们要求</text><text x="265.16 272.85 275.84 281.45 288.02 294.60 300.56 303.45 313.38 319.25 323.50 330.09 336.53 341.62 344.51 350.51 353.21" y="646.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="360.11 371.11 382.11" y="646.04" font-size="11.00" class="sc-notoserifcjksc">在回答</text><text x="396.01 404.38 411.04 419.65" y="646.04" font-size="11.00" class="sc-loraregular">GPQA</text><text x="426.54" y="646.04" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="437.54 446.12 452.48" y="646.04" font-size="11.00" class="sc-loraregular">HLE</text><text x="462.21" y="646.04" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="476.11 486.21 496.30 502.54 510.71 516.09 522.76 527.44" y="646.04" font-size="11.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="677.28" font-size="11.00" class="sc-notoserifcjksc">问答基准测试上，模型通常会产生大量的扩展</text><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="621.62" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="500.30" y="621.62" width="26.92" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="527.21" y="621.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="530.11" y="621.62" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="540.25" y="621.62" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2603.05706" rel="noopener"><rect x="72.00" y="637.24" width="11.37" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p137.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 137 页"><text x="504.00 507.28 512.07" y="751.81" font-size="9.00" class="sc-loraregular">137</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">思考。我们同时展示了使用原始提示词以及使用一个由英国人工智能安全研究所（</text><text x="468.00 476.27 483.79 486.68 493.56" y="82.61" font-size="11.00" class="sc-loraregular">UK AI</text><text x="72.00 78.24 84.14 90.00 96.56 101.33 104.59 108.87 114.68 117.57 121.17 127.85 132.94 137.20 140.46 144.72 151.29 155.55" y="98.23" font-size="11.00" class="sc-loraregular">Security Institute</text><text x="161.51 172.51 183.51 194.51 205.51 216.51 227.51" y="98.23" font-size="11.00" class="sc-notoserifcjksc">）提供、在以往</text><text x="241.40 249.09 252.08 257.69 264.26 270.84" y="98.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="279.69 290.69 301.69 312.69 323.69 334.69 345.69 356.69 367.69 378.69 389.69 400.69 411.69 422.69 433.69 444.69 455.69 466.69 477.69 488.69 499.69 510.69" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型上更善于引出思维链可控性的提示词所得的结</text><text x="72.00 83.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们的评估表明，</text><text x="160.00 169.93 175.80 180.05 186.64 193.08 198.17 201.06 207.06 209.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">对其思维链的控制比除</text><text x="329.55 337.24 340.24 345.85 352.41 358.99 364.95 367.85 377.78 383.64 387.90 394.49 400.92 406.01 408.91 415.57 420.26 426.17 431.72 434.81 440.73" y="147.38" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="452.44 463.44 474.44 485.44 496.44" y="147.38" font-size="11.00" class="sc-notoserifcjksc">之外的以往</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29 121.29 132.29 143.29 154.29 165.29 176.29 187.29 198.29 209.29 220.29 231.29 242.29 253.29 264.29 275.29 286.29 297.29 308.29" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型都更为有效。我们将此视为相对于以往</text><text x="322.18 329.87 332.87 338.48 345.04 351.62" y="163.00" font-size="11.00" class="sc-loraregular">Claude</text><text x="360.48 371.48 382.48 393.48 404.48 415.48 426.48 437.48 448.48 459.48 470.48 481.48 492.48 503.48 514.47 525.47" y="163.00" font-size="11.00" class="sc-notoserifcjksc">模型、思维链可监控性有所下降的弱</text><text x="72.00 83.00 94.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p138.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 138 页"><text x="504.00 507.28 512.29" y="751.81" font-size="9.00" class="sc-loraregular">138</text><text x="72.00" y="574.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.53 106.62 112.16" y="574.75" font-size="9.00" class="sc-lorabold">6.7.4.A]</text><text x="118.00 127.00 136.00 145.00" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">与近期的</text><text x="156.37 162.56 165.37 170.08 175.64 181.01 185.85 188.22 195.14 200.55 206.11" y="574.75" font-size="9.00" class="sc-lorabold">Claude Opus</text><text x="212.84 221.84 230.84 239.84 248.84" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">模型相比，</text><text x="257.84 264.03 266.84 271.56 277.12 282.48 287.33 289.69 298.13 303.09 306.81 312.40 317.49 321.86 324.23 329.08 331.18" y="574.75" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="337.20 346.20 355.20 364.20 373.20 382.20 391.20 400.20 409.20 418.20 427.20 436.20" y="574.75" font-size="9.00" class="sc-notoserifcjkscbold">具有较高的思维链可控性。</text><text x="445.20 454.20 463.20 472.20 481.20 490.20 499.20 508.20 517.20 526.20" y="574.75" font-size="9.00" class="sc-notoserifcjksc">每个点代表一个推理强</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00" y="586.45" font-size="9.00" class="sc-notoserifcjksc">度档位或一个固定的思考预算，其位置为该设置下产生的平均思维链长度。可控性是指在</text><text x="425.37 432.22 437.67 444.72" y="586.45" font-size="9.00" class="sc-loraregular">GPQA</text><text x="450.35" y="586.45" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="459.35 466.37 471.57" y="586.45" font-size="9.00" class="sc-loraregular">HLE</text><text x="479.54" y="586.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="490.91 499.17 507.43 512.53 519.22 523.62 529.07 532.91" y="586.45" font-size="9.00" class="sc-loraregular">MMLU-Pro</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="598.15" font-size="9.00" class="sc-notoserifcjksc">的问题上，模型遵循针对其扩展思考所给指令的回复所占比例。越低越好，因为可控性越高，表明模型在被指示时更有</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="609.85" font-size="9.00" class="sc-notoserifcjksc">能力改变其扩展思考的内容，这可能使监控变得不那么可靠。</text></svg></div>
