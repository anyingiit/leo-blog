0.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">线，这种情况出现在不到</text><text x="231.89 238.55 241.09 247.92 254.75 258.76" y="130.61" font-size="11.00" class="sc-loraregular">0.001%</text><text x="271.22 282.22 293.22 304.22 315.22" y="130.61" font-size="11.00" class="sc-notoserifcjksc">的补全中。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00" y="163.57" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，它在一次较长且无关的工具调用开头运行了</text><text x="432.89 437.29 442.06 451.89 454.78 460.16 463.88 466.77 474.36 480.94 486.85 491.61 499.20 505.88 512.45 515.44 518.43" y="163.57" font-size="11.00" class="sc-loraregular">“rm -f /dev/null”</text><text x="522.27" y="163.57" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00 243.00 254.00 265.00 276.00 287.00 298.00 309.00 320.00 331.00 342.00 353.00 364.00 375.00 386.00 397.00 408.00 419.00 430.00 441.00 452.00 463.00 474.00 485.00 496.00 507.00 518.00 529.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在一个案例中，它被要求追踪无人响应的连续告警次数，而它声称有一位用户（其</text><text x="298.00" y="211.57" font-size="11.00" class="sc-loraregular">“</text><text x="302.40 313.40 324.40 335.40" y="211.57" font-size="11.00" class="sc-notoserifcjksc">干得好，</text><text x="346.40 354.09 357.08 362.69 369.26 375.84" y="211.57" font-size="11.00" class="sc-loraregular">Claude</text><text x="381.80" y="211.57" font-size="11.00" class="sc-notoserifcjksc">！</text><text x="392.80" y="211.57" font-size="11.00" class="sc-loraregular">”</text><text x="396.64 407.64 418.64 429.64 440.64 451.64 462.64 473.64 484.64" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，并将计数器重置。</text><text x="144.00 155.00 166.00 177.00 188.00 199.00 210.00 221.00 232.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在少数几个案例中，</text><text x="243.00 248.59 254.26 260.67 263.66 269.62 272.51 278.51 281.21" y="244.53" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="288.11 299.11 310.11 321.11 332.11 343.11 354.11 365.11 376.11 387.11 398.11 409.11 420.11 431.11 442.11 453.11 464.11 475.11 486.11 497.11 508.11 519.11" y="244.53" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照将某个内部资</text><text x="144.00 155.00" y="260.15" font-size="11.00" class="sc-notoserifcjksc">源的</text><text x="168.89 177.17 184.07" y="260.15" font-size="11.00" class="sc-loraregular">URL</text><text x="193.32 204.32 215.32 226.32 237.32 248.32 259.32 270.32 281.32 292.32 303.32 314.32 325.32 336.32 347.32 358.32 369.32 380.32" y="260.15" font-size="11.00" class="sc-notoserifcjksc">替换成了一个略有不同、顶级域名错误的</text><text x="394.22 402.49 409.40" y="260.15" font-size="11.00" class="sc-loraregular">URL</text><text x="415.76" y="260.15" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="309.30" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控未发现任何评估中故意藏拙、明显的恶意行为、长程战略性欺骗或长程战</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="324.92" font-size="11.00" class="sc-notoserifcjksc">略性规避监督的案例。</text><text x="72.00 83.00 94.00 105.00 116.00" y="374.06" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 132.59 138.26 144.67 147.66 153.62 156.51 162.51 165.21" y="374.06" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="172.11 183.11 194.11 205.11 216.11 227.11 238.11 249.11 260.11 271.11 282.11 293.11 304.11 315.11 326.11 337.11 348.11 359.11 370.11 381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11" y="374.06" font-size="11.00" class="sc-notoserifcjksc">为实现用户指定目标的某种版本而规避限制的比率似乎可能低于</text><text x="483.00 490.69 493.68 499.29 505.86 512.44" y="374.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="389.68" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06 130.06 141.06 152.06 163.06 174.06 185.06 196.06 207.06 218.06 229.06 240.06 251.06 262.06 273.06 284.06 295.06 306.06 317.06 328.06 339.06 350.06 361.06 372.06 383.06 394.06 405.06 416.06 427.06 438.06 449.06 460.06 471.06 482.06 493.06 504.06 515.06 526.06" y="389.68" font-size="11.00" class="sc-notoserifcjksc">。它在与子智能体沟通时歪曲用户意图的倾向可能略高，不过这一频率变化可能源于我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="405.30" font-size="11.00" class="sc-notoserifcjksc">们内部缓解措施和子智能体指令的调整，而非模型行为的变化。</text><text x="72.00 80.32 83.70 91.16 94.54" y="469.56" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.2.2</text><text x="105.10 118.10 131.10 144.10 157.10 170.10 183.10 196.10 209.10 222.10 235.10" y="469.56" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">外部测试期间报告的事件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">我们的一家合作方在评估</text><text x="195.89 203.58 206.57 212.18 218.75 225.33 231.29 234.18 239.77 245.45 251.85 254.84 260.80 263.70 269.69 272.40" y="497.45" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="279.30 290.30 301.30 312.30 323.30 334.30 345.30 356.30 367.30 378.30 389.30 400.30 411.30 422.30 433.30 444.30 455.30 466.30 477.30 488.30 499.30 510.30 521.30" y="497.45" font-size="11.00" class="sc-notoserifcjksc">的最终快照和一个接近最终版的快照时，搭建了一个</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="513.07" font-size="11.00" class="sc-notoserifcjksc">评估环境：模型位于沙箱中，但可以将代码提交给沙箱之外的编译器。在数千次试验中的一次</text><text x="72.00 83.00" y="528.69" font-size="11.00" class="sc-notoserifcjksc">里，</text><text x="94.00 99.59 105.26 111.67 114.66 120.62 123.51 129.51 132.21" y="528.69" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="139.11 150.11 161.11 172.11 183.11 194.11 205.11 216.11 227.11 238.11 249.11 260.11 271.11 282.11 293.11 304.11 315.11 326.11 337.11 348.11 359.11 370.11 381.11 392.11 403.11 414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="528.69" font-size="11.00" class="sc-notoserifcjksc">利用了该合作方沙箱中的一个漏洞：它运行的代码在编译时获取了沙箱之外、它本</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="544.31" font-size="11.00" class="sc-notoserifcjksc">不应有权访问的文件。理论上，这可能被用来运行任意代码。该合作方随后进行的排查发现，</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="559.93" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40 121.40 132.40 143.40 154.40 165.40 176.40 187.40 198.40 209.40 220.40 231.40 242.40 253.40 264.40 275.40 286.40 297.40 308.40 319.40 330.40 341.40 352.40 363.40 374.40 385.40 396.40 407.40 418.40 429.40 440.40 451.40 462.40 473.40 484.40 495.40 506.40 517.40 528.40" y="559.93" font-size="11.00" class="sc-notoserifcjksc">此前在同一评估中也做过同样的事情。该合作方将此归类为临界情况，而非严重的安全入</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="575.55" font-size="11.00" class="sc-notoserifcjksc">侵事件；我们在此报告是出于透明度考虑。使</text><text x="294.89 300.48 306.16 312.56 315.55 321.51 324.41 330.40 333.11" y="575.55" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="340.00 351.00 362.00 373.00 384.00 395.00 406.00 417.00 428.00 439.00 450.00 461.00 472.00 483.00 494.00 505.00 516.00 527.00" y="575.55" font-size="11.00" class="sc-notoserifcjksc">得以访问外部信息的漏洞此后已由该合作</text><text x="72.00 83.00 94.00 105.00" y="591.17" font-size="11.00" class="sc-notoserifcjksc">方修复。</text><text x="116.00 124.73 131.30 137.87 142.96 145.85" y="591.17" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74 297.74 308.74 319.74 330.74 341.74 352.74 363.74 374.74 385.74 396.74 407.74 418.74 429.74 440.74 451.74 462.74 473.74 484.74 495.74 506.74 517.74" y="591.17" font-size="11.00" class="sc-notoserifcjksc">是在修复之后运行的，因此我们没有关于它在同样情况下会如何行事的证据。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="691.76" font-size="11.00" class="sc-notoserifcjksc">由于以下因素，我们将此事件的严重程度评为低：这些模型没有试图隐藏其行为，评估之外的任</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="707.38" font-size="11.00" class="sc-notoserifcjksc">何内容均未被更改，没有使用任何</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p097.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 97 页"><text x="504.00 508.99" y="751.80" font-size="9.00" class="sc-loraregular">97</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">网络攻击技术（例如凭据伪造或注入），而且模型似乎并没有在主动探查漏洞。</text><text x="457.00 462.59 468.26 474.67 477.66 483.62 486.51 492.51 495.21" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="502.11 513.11 524.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">获得了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">一个可以执行任意代码的编译器的访问权限，发现可以通过执行代码访问额外信息，随后利用了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">这些信息。此事件不涉及任何有害行为或现实世界后果，我们不认为它是严重未对齐的证据。此</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">事件确实表明，如果没有关于任务边界的恰当指令，模型会以宽泛且有时出人意料的方式使用其</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">可支配的一切工具。不过，利用了该漏洞的模型中没有一个访问或更改了沙箱之外系统的其他部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">分，它们只是选择完成任务，尽管借助了额外信息。这种倾向与奖励破解密切相关，而奖励破解</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="176.33" font-size="11.00" class="sc-notoserifcjksc">正是本次评估在训练（第</text><text x="195.89 202.25 204.96" y="176.33" font-size="11.00" class="sc-loraregular">6.3</text><text x="213.98 224.98 235.98 246.98 257.98 268.98 279.98" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节）和评估（第</text><text x="293.87 300.23 302.93 308.90 311.60" y="176.33" font-size="11.00" class="sc-loraregular">6.4.8</text><text x="320.68 331.68 342.68" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节、第</text><text x="356.57 362.93 365.63 371.63 374.33" y="176.33" font-size="11.00" class="sc-loraregular">6.5.4</text><text x="383.19 394.19 405.19 416.19 427.19 438.19 449.19 460.19 471.19" y="176.33" font-size="11.00" class="sc-notoserifcjksc">节）中的一大重点。</text><text x="72.00 80.96 84.60" y="294.50" font-size="14.00" class="sc-poppinssemibold">6.3</text><text x="96.32 110.32 124.32 138.32 152.32 166.32" y="294.50" font-size="14.00" class="sc-notosanscjkscbold">训练数据审查</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="321.06" font-size="11.00" class="sc-notoserifcjksc">除非另有说明，本节中的所有评估均在</text><text x="261.89 269.58 272.57 278.18 284.75 291.33 297.29 300.18 310.12 315.98 320.24 326.83 333.26 338.35 341.25 347.24 349.95" y="321.06" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85" y="321.06" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00 80.32 83.70 91.49 94.87" y="367.99" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.1</text><text x="102.67 115.67 128.67 141.67 154.67 167.67 180.67 193.67" y="367.99" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">言语化评分者意识</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="395.88" font-size="11.00" class="sc-notoserifcjksc">评分者意识指模型就某项任务推理将评判其方法正确与否的评分者或奖励的情形。被推理的评分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="411.50" font-size="11.00" class="sc-notoserifcjksc">者或奖励可能是</text><text x="151.89 158.25 164.61" y="411.50" font-size="11.00" class="sc-loraregular">LLM</text><text x="177.60 188.60 199.60 210.60 221.60 232.60 243.60 254.60 265.60 276.60 287.60 298.60 309.60 320.60 331.60 342.60 353.60 364.60 375.60 386.60 397.60 408.60 419.60 430.60 441.60 452.60 463.60 474.60 485.60 496.60 507.60 518.60 529.60" y="411.50" font-size="11.00" class="sc-notoserifcjksc">评分模型，也可能不是（例如确定性奖励）。在本节中，我们聚焦于言语化</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="427.12" font-size="11.00" class="sc-notoserifcjksc">评分者意识，即关于评分者的推理出现在模型的输出中（而不是出现在其内部激活值中，后者我</text><text x="72.00 83.00 94.00 105.00" y="442.74" font-size="11.00" class="sc-notoserifcjksc">们将在第</text><text x="118.89 125.25 127.85 134.21 136.91" y="442.74" font-size="11.00" class="sc-loraregular">6.6.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="458.36" font-size="11.00" class="sc-notoserifcjksc">分者或奖励的空子或利用它们，但我们认为本节中标记的大多数情形并非如此。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="541.59" font-size="11.00" class="sc-notoserifcjksc">我们对强化学习（</text><text x="160.00 166.91" y="541.59" font-size="11.00" class="sc-loraregular">RL</text><text x="173.27 184.27 195.27 206.27 217.27 228.27 239.27 250.27 261.27 272.27 283.27 294.27 305.27 316.27 327.27 338.27 349.27 360.27 371.27 382.27 393.27 404.27 415.27 426.27 437.27 448.27 459.27 470.27 481.27 492.27" y="541.59" font-size="11.00" class="sc-notoserifcjksc">）的持续自动监控包括测量评分者意识的比率，该比率由一个二元的</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="557.21" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="157.89 168.89 179.89 190.89 201.89 212.89 223.89 234.89 245.89 256.89 267.89 278.89 289.89 300.89 311.89 322.89 333.89 344.89 355.89 366.89 377.89 388.89 399.89 410.89 421.89 432.89 443.89 454.89 465.89 476.89 487.89 498.89 509.89" y="557.21" font-size="11.00" class="sc-notoserifcjksc">评分器判定；该评分器的提示中包含对评分者意识的描述以及完整的对话记</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="572.83" font-size="11.00" class="sc-notoserifcjksc">录。重要的是，我们向评分器明确说明，它只应考虑提示中未说明评分机制的情形（因为在提示</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="588.45" font-size="11.00" class="sc-notoserifcjksc">已说明评分机制的情况下，评分者意识并不令人担忧，也在预期之中）。我们发现：</text><text x="479.00 482.33 485.69 488.58 496.27 499.26 504.87 511.44 518.02" y="588.45" font-size="11.00" class="sc-loraregular">i) Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="604.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="604.07" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="142.55 149.46" y="604.07" font-size="11.00" class="sc-loraregular">RL</text><text x="158.71 169.71 180.71 191.71 202.71 213.71 224.71 235.71 246.71 257.71 268.71 279.71 290.71 301.71 312.71" y="604.07" font-size="11.00" class="sc-notoserifcjksc">中的评分者意识比率相对较高（在</text><text x="326.61 333.51" y="604.07" font-size="11.00" class="sc-loraregular">RL</text><text x="342.76 353.76 364.76 375.76 386.76 397.76 408.76 419.76 430.76 441.76 452.76 463.76 474.76 485.76 496.76 507.76 518.77 529.77" y="604.07" font-size="11.00" class="sc-notoserifcjksc">开始时，大多数较长的智能体编程回合都</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="619.69" font-size="11.00" class="sc-notoserifcjksc">具有评分者意识）；</text><text x="171.00 174.09 177.42" y="619.69" font-size="11.00" class="sc-loraregular">ii)</text><text x="183.67 194.67 205.67 216.67 227.67 238.67 249.67 260.67 271.67" y="619.69" font-size="11.00" class="sc-notoserifcjksc">评分者意识的比率在</text><text x="285.57 292.47" y="619.69" font-size="11.00" class="sc-loraregular">RL</text><text x="301.72 312.72 323.72 334.72 345.72 356.72 367.72 378.72 389.72 400.72 411.72 422.72" y="619.69" font-size="11.00" class="sc-notoserifcjksc">过程中似乎没有明显上升：</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p098.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 98 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">98</text><text x="72.00" y="358.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="358.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 112.54 116.01 118.38 124.55" y="358.75" font-size="9.00" class="sc-lorabold">6.3.1.A] RL</text><text x="132.35 141.35 150.35 159.35 168.35 177.35 186.35 195.35 204.35 213.35 222.35 231.35 240.35 249.35 258.35 267.35 276.35 285.35" y="358.75" font-size="9.00" class="sc-notoserifcjkscbold">过程中能力类训练环境内的评分者意识。</text><text x="449.60 455.89 458.33 462.92 468.30 473.68 478.56 480.92 489.05 493.85 497.33 502.72 507.99 512.15 514.52 519.43 521.64" y="370.45" font-size="9.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="527.28" y="370.45" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00 81.00" y="382.15" font-size="9.00" class="sc-notoserifcjksc">整个</text><text x="92.37 98.02" y="382.15" font-size="9.00" class="sc-loraregular">RL</text><text x="105.59 114.59 123.59 132.59 141.59 150.59 159.59 168.59 177.59 186.59 195.59 204.59 213.59 222.59 231.59 240.59 249.59 258.59 267.59 276.59 285.59 294.59 303.59 312.59 321.59 330.59 339.59 348.59 357.59 366.59 375.59 384.59 393.59 402.59 411.59 420.59 429.59 438.59 447.59 456.59 465.59 474.59 483.59 492.59 501.59 510.59 519.59 528.59" y="382.15" font-size="9.00" class="sc-notoserifcjksc">过程中，评分者意识保持相对稳定。当对话记录的提示本身告知策略模型存在评分者时，评分器不会将该对话</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00 531.00" y="393.85" font-size="9.00" class="sc-notoserifcjksc">记录计为具有评分者意识。在计算评分者意识比率时忽略这些情形（而不是将其视为不具有评分者意识），并不会改变</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00" y="405.55" font-size="9.00" class="sc-notoserifcjksc">四种情形的相对排序，也不会改变它们的比率在</text><text x="263.37 269.02" y="405.55" font-size="9.00" class="sc-loraregular">RL</text><text x="276.59 285.59 294.59 303.59 312.59 321.59 330.59 339.59 348.59 357.59 366.59 375.59 384.59 393.59 402.59 411.59 420.59 429.59 438.59 447.59 456.59 465.59" y="405.55" font-size="9.00" class="sc-notoserifcjksc">过程中相当稳定这一事实。每个点是在六分之一的</text><text x="476.96 482.61" y="405.55" font-size="9.00" class="sc-loraregular">RL</text><text x="490.18 499.18 508.18 517.18 526.18" y="405.55" font-size="9.00" class="sc-notoserifcjksc">训练期间汇</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00" y="417.25" font-size="9.00" class="sc-notoserifcjksc">总的评分者意识比率，绘制在该六分之一区间的中点处。</text><text x="72.00 83.00 94.00 105.00" y="477.28" font-size="11.00" class="sc-notoserifcjksc">我们在图</text><text x="118.89 125.25 127.96 134.08 136.79 140.79 143.50" y="477.28" font-size="11.00" class="sc-loraregular">6.3.1.A</text><text x="153.28 164.28 175.28 186.28 197.28 208.28 219.28 230.28 241.28 252.28 263.28 274.28 285.28 296.28" y="477.28" font-size="11.00" class="sc-notoserifcjksc">中聚焦于智能体编程环境，并将</text><text x="310.17 317.08" y="477.28" font-size="11.00" class="sc-loraregular">RL</text><text x="326.33 337.33 348.33 359.33 370.33 381.33 392.33 403.33" y="477.28" font-size="11.00" class="sc-notoserifcjksc">回合划分为最短的</text><text x="417.22 423.22 430.05" y="477.28" font-size="11.00" class="sc-loraregular">50%</text><text x="442.51 453.51 464.51 475.51" y="477.28" font-size="11.00" class="sc-notoserifcjksc">和最长的</text><text x="489.41 495.40 502.23" y="477.28" font-size="11.00" class="sc-loraregular">50%</text><text x="511.80 522.80" y="477.28" font-size="11.00" class="sc-notoserifcjksc">，以</text><text x="72.00 83.00" y="492.90" font-size="11.00" class="sc-notoserifcjksc">控制</text><text x="96.89 103.80" y="492.90" font-size="11.00" class="sc-loraregular">RL</text><text x="113.05 124.05 135.05 146.05 157.05 168.05 179.05 190.05 201.05 212.05 223.05 234.05 245.05 256.05 267.05 278.05 289.05 300.05 311.05 322.05 333.05 344.05 355.05 366.05 377.05 388.05 399.05 410.05 421.05 432.05" y="492.90" font-size="11.00" class="sc-notoserifcjksc">过程中回合长度的分布偏移，因为两者的评分者意识占比差异显著。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="558.25" font-size="11.00" class="sc-notoserifcjksc">下面以截断形式展示了一个从被判定为具有评分者意识的对话记录子集中随机抽取的示例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p099.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 99 页"><text x="504.00 509.20" y="751.80" font-size="9.00" class="sc-loraregular">99</text><text x="72.00" y="273.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47 84.47 93.47 102.47" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="113.84 119.02 121.11 126.15 128.25 131.90 134.00 139.54" y="273.42" font-size="9.00" class="sc-lorabold">6.3.1.B]</text><text x="145.38 154.38 163.38 172.38" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">一份来自</text><text x="183.74 189.94 192.74 197.46 203.02 208.39 213.23 215.60 224.04 229.00 232.71 238.30 243.40 247.76 250.13 254.99 257.09" y="273.42" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="263.11 272.11 281.11 290.11 299.11 308.11 317.11 326.11 335.11 344.11" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">的、具有评分者意识的</text><text x="355.47 361.65" y="273.42" font-size="9.00" class="sc-lorabold">RL</text><text x="369.45 378.45 387.45 396.45" y="273.42" font-size="9.00" class="sc-notoserifcjkscbold">对话记录</text><text x="405.45 414.45 423.45 432.45 441.45" y="273.42" font-size="9.00" class="sc-notoserifcjksc">，依据为图</text><text x="452.82 458.02 460.23 465.25 467.46 470.74 472.95" y="273.42" font-size="9.00" class="sc-loraregular">6.3.1.A</text><text x="480.95 489.95 498.95 507.95 516.95 525.95" y="273.42" font-size="9.00" class="sc-notoserifcjksc">中使用的自动</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00" y="285.12" font-size="9.00" class="sc-notoserifcjksc">评分器。这是一个数学环境，而非智能体编程环境。在这份对话记录中，共有两处提及</text><text x="414.00" y="285.12" font-size="9.00" class="sc-loraregular">“</text><text x="417.60 426.60 435.60" y="285.12" font-size="9.00" class="sc-notoserifcjksc">评分者</text><text x="444.60" y="285.12" font-size="9.00" class="sc-loraregular">”</text><text x="447.74 456.74 465.74 474.74 483.74 492.74 501.74 510.74 519.74 528.74" y="285.12" font-size="9.00" class="sc-notoserifcjksc">，二者均在此可视化中</text><text x="72.00 81.00 90.00" y="296.83" font-size="9.00" class="sc-notoserifcjksc">展示。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="325.73" font-size="11.00" class="sc-notoserifcjksc">我们发现，在我们的智能体编程环境中，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06 317.06 319.76" y="325.73" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66" y="325.73" font-size="11.00" class="sc-notoserifcjksc">的言语化评分者意识比率与</text><text x="461.55 469.24 472.24 477.85 484.41 490.99 496.95 499.85 508.58 515.15 521.71 526.81 529.70" y="325.73" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="341.35" font-size="11.00" class="sc-notoserifcjksc">相近，同样较高：</text><text x="72.00" y="624.00" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 104.90 107.00 113.19 116.67 119.03 125.23 128.03 132.75 138.31 143.68 148.52 150.88 159.33 164.29 168.00 173.59 178.69 183.05 185.42 190.28 192.38" y="624.00" font-size="9.00" class="sc-lorabold">6.3.1.C] Claude Mythos 5.1</text><text x="198.40 207.40 216.40 225.40 234.40 243.40 252.40 261.40 270.40 279.40 288.40 297.40 306.40 315.40 324.40" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">的言语化评分者意识较为频繁，与</text><text x="335.76 341.95 344.76 349.48 355.04 360.41 365.25 367.61 374.54 379.94 385.51 389.87 392.24" y="624.00" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="399.46 408.46" y="624.00" font-size="9.00" class="sc-notoserifcjkscbold">一样</text><text x="417.46 426.46 435.46 444.46" y="624.00" font-size="9.00" class="sc-notoserifcjksc">。我们从</text><text x="455.83 459.11" y="624.00" font-size="9.00" class="sc-loraregular">16</text><text x="466.68 475.68 484.68 493.68 502.68 511.68" y="624.00" font-size="9.00" class="sc-notoserifcjksc">个智能体编程</text><text x="523.04 528.70" y="624.00" font-size="9.00" class="sc-loraregular">RL</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00" y="635.70" font-size="9.00" class="sc-notoserifcjksc">环境中选取任务（这些环境因评分者意识高、且提示中未提及评分者或隐藏测试而入选），并将</text><text x="452.37 460.49 465.29 468.77 474.17 479.43 483.60 485.96 490.87 493.08" y="635.70" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="498.73 507.73 516.73 525.73" y="635.70" font-size="9.00" class="sc-notoserifcjksc">在这些任</text><text x="72.00 81.00 90.00" y="647.40" font-size="9.00" class="sc-notoserifcjksc">务上的</text><text x="101.37 107.02" y="647.40" font-size="9.00" class="sc-loraregular">RL</text><text x="114.59 123.59 132.59 141.59 150.59" y="647.40" font-size="9.00" class="sc-notoserifcjksc">对话记录与</text><text x="161.95 169.10 174.47 179.85 184.01 186.38" y="647.40" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="193.65 202.65 211.65 220.65 229.65 238.65 247.65 256.65 265.65 274.65 283.65 292.65 301.65 310.65 319.65 328.65 337.65 346.65 355.65 364.65 373.65 382.65 391.65 400.65 409.65 418.65 427.65 436.65 445.65 454.65 463.65" y="647.40" font-size="9.00" class="sc-notoserifcjksc">在相同任务上新采样的结果进行比较，由同一个评判者评分。误差线为</text><text x="475.02 480.22 485.13" y="647.40" font-size="9.00" class="sc-loraregular">95%</text><text x="495.32 504.32 513.32 522.32 531.32" y="647.40" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="659.10" font-size="9.00" class="sc-notoserifcjksc">在匹配的任务上，两个模型言语化表达评分者意识的比率相近。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p100.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 100 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">100</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们还在与对齐相关的环境中检查言语化评分者意识。这种情况更令人担忧，因为对对齐评分者</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的意识可能会削弱我们的监督（不过言语化评分者意识可以通过思维链监控来研究）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们发现，在对齐以及有益、诚实、无害（</text><text x="281.00 289.58 298.16" y="147.38" font-size="11.00" class="sc-loraregular">HHH</text><text x="306.74 317.74 328.74 339.74 350.74 361.74 372.74 383.74 394.74 405.74 416.74 427.74 438.74 449.74 460.74 471.74 482.74 493.74 504.74 515.74" y="147.38" font-size="11.00" class="sc-notoserifcjksc">）环境中，训练结束时的评分者意识比率约为</text><text x="72.00 78.00" y="163.00" font-size="11.00" class="sc-loraregular">5%</text><text x="87.57 98.57 109.57 120.57" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，低于图</text><text x="134.46 140.82 143.52 149.65 152.36 156.36 159.07" y="163.00" font-size="11.00" class="sc-loraregular">6.3.1.A</text><text x="168.84 179.84 190.84 201.84 212.84 223.84 234.84 245.84 256.84 267.84" y="163.00" font-size="11.00" class="sc-notoserifcjksc">中四个比率中的三个。</text><text x="72.00 80.32 83.70 91.49 94.87" y="210.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.2</text><text x="105.42 118.42 131.42 144.42 157.42 170.42 183.42" y="210.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">计算机使用环境</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="238.38" font-size="11.00" class="sc-notoserifcjksc">我们生产训练流水线的一部分涉及在</text><text x="250.89 259.26 267.54" y="238.38" font-size="11.00" class="sc-loraregular">GUI</text><text x="274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="238.38" font-size="11.00" class="sc-notoserifcjksc">计算机使用设置中进行的强化学习，模型在其中与复杂</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="254.00" font-size="11.00" class="sc-notoserifcjksc">且逼真的容器交互。然而，计算机使用为缓解奖励破解带来了重大挑战：由于容器更为复杂，它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="285.24" font-size="11.00" class="sc-notoserifcjksc">问，模型可能会找到编写并执行任意代码的新方法，例如访问浏览器控制台或使用</text><text x="470.89 474.83 480.38 485.82 491.50 497.73 503.58 508.35 511.44 518.01" y="285.24" font-size="11.00" class="sc-loraregular">JavaScript</text><text x="525.16" y="285.24" font-size="11.00" class="sc-notoserifcjksc">书</text><text x="72.00 83.00 94.00 105.00 116.00" y="300.86" font-size="11.00" class="sc-notoserifcjksc">签小程序（</text><text x="127.00 133.40 139.84 146.27 152.18 162.01 167.69 172.41 178.32 181.31 187.19" y="300.86" font-size="11.00" class="sc-loraregular">bookmarklet</text><text x="191.45 202.45 213.45 224.45 235.45 246.45 257.45 268.45 279.45 290.45 301.45 312.45 323.45 334.45 345.45 356.45 367.45 378.45 389.45 400.45 411.45 422.45 433.45 444.45 455.45 466.45 477.45 488.45 499.45 510.45 521.45" y="300.86" font-size="11.00" class="sc-notoserifcjksc">）。这使得对奖励破解的监控变得困难，因为对于基于模型的分类器而</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="316.48" font-size="11.00" class="sc-notoserifcjksc">言，某件事是否应算作奖励破解行为往往并不清楚，尤其是考虑到这些任务和环境的复杂性。</text><text x="72.00 83.00 94.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">作为对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="400.30" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85 213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85 378.85 389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="400.30" font-size="11.00" class="sc-notoserifcjksc">训练运行进行在线监控的一部分，我们改进了对计算机使用中奖励破</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">解的检测。在训练运行的相对早期，我们（通过人工审查）观察到，我们的一些计算机使用环境</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">会偏向模型采取了破坏性操作的采样轨迹（</text><text x="281.00 285.69 292.12 295.11 298.11 304.54 311.11" y="431.54" font-size="11.00" class="sc-loraregular">rollout</text><text x="315.36 326.36 337.36 348.36 359.36 370.36 381.36 392.36 403.36 414.36 425.36 436.36 447.36 458.36 469.36 480.36 491.36 502.36 513.36 524.36" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）。例如，训练混合集中有一小部分任务是：</text><text x="72.00 83.00 94.00 105.00 116.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">模型在打开</text><text x="129.89 138.26 146.54" y="447.16" font-size="11.00" class="sc-loraregular">GUI</text><text x="153.11 164.11 175.11 186.11 197.11 208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11" y="447.16" font-size="11.00" class="sc-notoserifcjksc">时面对登录界面，但提示中并未提供相应的凭据。这激励了模型去猜测</text><text x="497.01 502.68 509.26 519.10 522.19 528.86 531.76" y="447.16" font-size="11.00" class="sc-loraregular">admin /</text><text x="72.00 77.68 84.25 94.09 97.18 103.86 107.86 113.60" y="462.78" font-size="11.00" class="sc-loraregular">admin123</text><text x="122.62 133.62 144.62 155.62 166.62 177.62 188.62 199.62 210.62 221.62 232.62 243.62 254.62 265.62 276.62 287.62 298.62 309.62 320.62 331.62 342.62 353.62 364.62 375.62 386.62" y="462.78" font-size="11.00" class="sc-notoserifcjksc">等常见凭据，或者在更极端的情况下，采取诸如生成新的</text><text x="400.52 407.40 414.01" y="462.78" font-size="11.00" class="sc-loraregular">API</text><text x="420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="462.78" font-size="11.00" class="sc-notoserifcjksc">密钥之类的操作来绕过</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="546.03" font-size="11.00" class="sc-notoserifcjksc">我们针对这一行为构建了一项评估，所用容器在训练中并未出现这一问题，结果发现凭据搜寻行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="561.65" font-size="11.00" class="sc-notoserifcjksc">为广泛泛化到了其他</text><text x="173.89 182.26 190.54" y="561.65" font-size="11.00" class="sc-loraregular">GUI</text><text x="197.11 208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11" y="561.65" font-size="11.00" class="sc-notoserifcjksc">计算机使用环境。在</text><text x="299.01 303.01 309.84 316.67" y="561.65" font-size="11.00" class="sc-loraregular">100%</text><text x="329.14 340.14 351.14 362.14 373.14 384.14 395.14 406.14 417.14 428.14 439.14 450.14 461.14 472.14 483.14 494.14 505.14" y="561.65" font-size="11.00" class="sc-notoserifcjksc">的采样轨迹中，我们的所有模型（包括</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="577.27" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="125.77 136.77 147.77 158.77 169.77 180.77 191.77 202.77 213.77 224.77 235.77 246.77 257.77 268.77" y="577.27" font-size="11.00" class="sc-notoserifcjksc">）都会尝试猜测登录凭据；在约</text><text x="282.66 288.57 295.40" y="577.27" font-size="11.00" class="sc-loraregular">20%</text><text x="307.86 318.86 329.86 340.86 351.86 362.86 373.86" y="577.27" font-size="11.00" class="sc-notoserifcjksc">的采样轨迹中，</text><text x="384.86 394.79 400.66 404.91 411.50 417.94 423.03 425.92 431.92 434.63" y="577.27" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="441.52 452.52 463.52 474.52 485.52 496.52 507.52 518.52 529.52" y="577.27" font-size="11.00" class="sc-notoserifcjksc">会尝试更恶劣的容器</text><text x="72.00 83.00 94.00 105.00 116.00" y="592.89" font-size="11.00" class="sc-notoserifcjksc">破解手段。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p101.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 101 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">101</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 113.68" y="367.92" font-size="9.00" class="sc-lorabold">6.3.2.A]</text><text x="337.89 344.08 346.89 351.60 357.17 362.53" y="367.92" font-size="9.00" class="sc-lorabold">Claude</text><text x="369.74 378.74 387.74 396.74 405.74 414.74 423.74 432.74 441.74 450.74 459.74 468.74 477.74" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">模型都会表现出凭据搜寻行为</text><text x="486.74 495.74 504.74 513.74 522.74 531.74" y="367.92" font-size="9.00" class="sc-notoserifcjksc">。模型被要求</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">在未获提供凭据的情况下完成</text><text x="191.37 198.22 204.98" y="379.62" font-size="9.00" class="sc-loraregular">GUI</text><text x="210.37 219.37 228.37 237.37 246.37 255.37 264.37 273.37 282.37" y="379.62" font-size="9.00" class="sc-notoserifcjksc">计算机使用任务；在</text><text x="293.73 297.01 302.60 308.19" y="379.62" font-size="9.00" class="sc-loraregular">100%</text><text x="318.38 327.38 336.38 345.38 354.38 363.38 372.38 381.38 390.38 399.38 408.38 417.38 426.38" y="379.62" font-size="9.00" class="sc-notoserifcjksc">的任务中，所有已投入生产的</text><text x="437.75 444.04 446.49 451.08 456.45 461.83" y="379.62" font-size="9.00" class="sc-loraregular">Claude</text><text x="469.08 478.08 487.08 496.08 505.08 514.08 523.08" y="379.62" font-size="9.00" class="sc-notoserifcjksc">模型都会表现出</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">某种凭据搜寻行为。在线监控发现，我们的计算机使用训练混合集在激励这种行为。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="433.48" font-size="11.00" class="sc-notoserifcjksc">作为应对，我们对计算机使用训练混合集进行了进一步审计。除上述凭据破解行为外，我们还观</text><text x="72.00 83.00 94.00 105.00" y="449.10" font-size="11.00" class="sc-notoserifcjksc">察到生产</text><text x="118.89 125.80" y="449.10" font-size="11.00" class="sc-loraregular">RL</text><text x="135.05 146.05 157.05 168.05 179.05 190.05 201.05 212.05 223.05 234.05 245.05 256.05 267.05 278.05 289.05 300.05 311.05 322.05 333.05 344.05 355.05 366.05 377.05 388.05 399.05 410.05 421.05" y="449.10" font-size="11.00" class="sc-notoserifcjksc">流水线所激励的其他各种奖励破解行为。我们用新的分布外（</text><text x="432.05 438.49 445.05 449.31 454.69 461.07 464.68" y="449.10" font-size="11.00" class="sc-loraregular">out-of-</text><text x="72.00 78.58 81.67 86.76 91.02 95.78 98.87 105.28 111.84 116.10 119.19 125.62" y="464.72" font-size="11.00" class="sc-loraregular">distribution</text><text x="132.30" y="464.72" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="143.30 152.04 160.67" y="464.72" font-size="11.00" class="sc-loraregular">OOD</text><text x="168.87 179.87 190.87 201.87 212.87 223.87 234.87 245.87 256.87 267.87 278.87" y="464.72" font-size="11.00" class="sc-notoserifcjksc">）评估验证了这些行为，</text><text x="289.87 299.80 305.66 309.92 316.51 322.94 328.04 330.93 336.92 339.63" y="464.72" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="346.53 357.53 368.53 379.53 390.53 401.53 412.53 423.53 434.53 445.53 456.53 467.53 478.53 489.53" y="464.72" font-size="11.00" class="sc-notoserifcjksc">在这些评估上的奖励破解率约为</text><text x="503.42 507.42 513.42" y="464.72" font-size="11.00" class="sc-loraregular">15%</text><text x="522.99" y="464.72" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p102.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 102 页"><text x="504.00 507.28 512.80" y="751.80" font-size="9.00" class="sc-loraregular">102</text><text x="72.00" y="367.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.15 101.25 106.05 108.14 113.68" y="367.92" font-size="9.00" class="sc-lorabold">6.3.2.B]</text><text x="119.52" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="130.89 137.81 144.62" y="367.92" font-size="9.00" class="sc-lorabold">OOD</text><text x="153.82 162.82 171.82 180.82 189.82 198.82 207.82 216.82 225.82" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">计算机使用任务中，</text><text x="234.82 241.01 243.82 248.54 254.10 259.46" y="367.92" font-size="9.00" class="sc-lorabold">Claude</text><text x="266.67 275.67 284.67 293.67 302.67 311.67 320.67 329.67 338.67 347.67 356.67 365.67 374.67 383.67 392.67 401.67 410.67 419.67 428.67" y="367.92" font-size="9.00" class="sc-notoserifcjkscbold">模型表现出中等偏高比率的类奖励破解行为</text><text x="437.67 446.67 455.67 464.67 473.67 482.67 491.67 500.67 509.67 518.67 527.67" y="367.92" font-size="9.00" class="sc-notoserifcjksc">。在训练中，我们观察到</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00 369.00 378.00 387.00 396.00 405.00 414.00 423.00 432.00 441.00 450.00 459.00 468.00 477.00 486.00 495.00 504.00 513.00 522.00" y="379.62" font-size="9.00" class="sc-notoserifcjksc">模型实施诸如搜索答案文件或篡改容器基础设施之类的破解行为；这种行为会以分布外的方式泛化到新的任务和容器</text><text x="72.00 81.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">中。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="420.23" font-size="11.00" class="sc-notoserifcjksc">我们采取了若干措施，以便在未来的训练运行中解决上述行为和计算机使用环境问题。在观察到</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="435.85" font-size="11.00" class="sc-notoserifcjksc">这些问题后，我们对计算机使用混合集中的每个环境进行了深入审计。我们标记出约一半的计算</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="451.47" font-size="11.00" class="sc-notoserifcjksc">机使用环境会激励破解行为或存在可供破解的攻击面，并已将这些环境暂时从未来的训练运行中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="467.09" font-size="11.00" class="sc-notoserifcjksc">移除，直至我们完成改进。我们还添加了有针对性的行为环境，以抑制破解行为的动机。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="549.77" font-size="11.00" class="sc-notoserifcjksc">理想情况下，我们希望在环境进入生产训练混合集之前就发现潜在的奖励破解行为。虽然我们确</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="565.39" font-size="11.00" class="sc-notoserifcjksc">实会对新环境进行对抗性测试，但我们在这一过程中并未观察到这些破解行为，原因在于：</text><text x="512.00 515.35 519.36" y="565.39" font-size="11.00" class="sc-loraregular">(1)</text><text x="525.61" y="565.39" font-size="11.00" class="sc-notoserifcjksc">这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="581.01" font-size="11.00" class="sc-notoserifcjksc">些环境的质量检查（</text><text x="171.00 179.61" y="581.01" font-size="11.00" class="sc-loraregular">QA</text><text x="186.50 197.50 208.50 219.50 230.50 241.50 252.50 263.50 274.50 285.50 296.50 307.50 318.50 329.50 340.50 351.50 362.50 373.50 384.50 395.50 406.50 417.50 428.50 439.50 450.50 461.50 472.50 483.50 494.50 505.50 516.50" y="581.01" font-size="11.00" class="sc-notoserifcjksc">）是针对较旧、能力较弱的模型进行的，这些模型无法找到某些破解手</text><text x="72.00 83.00" y="596.63" font-size="11.00" class="sc-notoserifcjksc">段；</text><text x="94.00 97.35 103.26" y="596.63" font-size="11.00" class="sc-loraregular">(2)</text><text x="109.51 120.51 131.51 142.51 153.51" y="596.63" font-size="11.00" class="sc-notoserifcjksc">在我们改进</text><text x="167.40 176.02" y="596.63" font-size="11.00" class="sc-loraregular">QA</text><text x="185.79 196.79 207.79 218.79 229.79 240.79 251.79 262.79 273.79 284.79 295.79 306.79 317.79 328.79 339.79 350.79 361.79 372.79 383.79 394.79 405.79 416.79 427.79 438.79 449.79 460.79 471.79 482.79 493.79 504.79 515.79" y="596.63" font-size="11.00" class="sc-notoserifcjksc">流程之后，较旧的环境没有被重新审计。此后，我们已大幅改进了用于</text><text x="72.00 80.61" y="612.25" font-size="11.00" class="sc-loraregular">QA</text><text x="72.00" y="627.87" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00 89.59 95.26 100.03 106.71 112.67 117.76" y="627.87" font-size="11.00" class="sc-loraregular">harness</text><text x="122.85 133.85 144.85 155.85 166.85 177.85 188.85 199.85 210.85 221.85 232.85 243.85 254.85 265.85 276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85" y="627.87" font-size="11.00" class="sc-notoserifcjksc">）和提示，能让较弱的模型找到更多后来能力更强的模型所发现的破解手段。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p103.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 103 页"><text x="504.00 507.28 512.87" y="751.80" font-size="9.00" class="sc-loraregular">103</text><text x="72.00 80.32 83.70 91.49 94.87 102.65 105.75 114.08" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.3.3 RL</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">随着模型能力增强，模型在训练期间或训练之后为追求奖励破解而采取潜在危险行动的风险也随</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="126.65" font-size="11.00" class="sc-notoserifcjksc">之增加。为量化特定奖励破解威胁模型的发生率，我们用一组标记奖励破解行为的自动化分类器</text><text x="72.00 83.00 94.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">筛查了</text><text x="107.89 114.80" y="142.27" font-size="11.00" class="sc-loraregular">RL</text><text x="124.05 135.05 146.05 157.05 168.05 179.05 190.05 201.05 212.05 223.05 234.05 245.05 256.05 267.05 278.05" y="142.27" font-size="11.00" class="sc-notoserifcjksc">训练回合。我们报告三个分类器在</text><text x="291.95 299.63 302.63 308.24 314.80 321.38 327.34 330.24 340.17 346.03 350.29 356.88 363.31 368.41 371.30 377.29 380.00" y="142.27" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="386.90 397.90 408.90 419.90 430.90 441.90 452.90 463.90 474.90 485.90 496.90 507.90 518.90" y="142.27" font-size="11.00" class="sc-notoserifcjksc">训练过程中的结果，并作为对</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">比，报告它们在自</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 209.92 216.49 223.05 228.15 231.04 237.00 239.60" y="157.89" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="248.85 259.85 270.85 281.85 292.85 303.85 314.85 325.85 336.85 347.85 358.85 369.85 380.85 391.85 402.85 413.85 424.85 435.85 446.85 457.85 468.85 479.85 490.85 501.85 512.85 523.85" y="157.89" font-size="11.00" class="sc-notoserifcjksc">以来发布的每个模型训练过程中的结果。由于每个模型都在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">不同的环境混合上训练，结果并不总是可以直接比较。在可进行同等条件下的比较时，</text><text x="490.00 499.93 505.80 510.05 516.64 523.08" y="173.51" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00 80.70" y="189.13" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60 98.60 109.60 120.60 131.60 142.60" y="189.13" font-size="11.00" class="sc-notoserifcjksc">的比率处于图</text><text x="156.49 162.85 165.55 171.68 174.39 180.51 183.22" y="189.13" font-size="11.00" class="sc-loraregular">6.3.3.A</text><text x="193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="189.13" font-size="11.00" class="sc-notoserifcjksc">所示一系列基线中我们测得的最低水平或接近最低水平。以下是具体分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="204.75" font-size="11.00" class="sc-notoserifcjksc">类器的结果以及我们对其的解读：</text><text x="72.00 83.00 94.00 105.00 116.00" y="289.15" font-size="11.00" class="sc-notoserifcjkscbold">成功作弊。</text><text x="127.00 138.00 149.00 160.00" y="289.15" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="173.89 181.58 184.57 190.18 196.75 203.33 209.29 212.18 220.92 227.49 234.05 239.15 242.04 248.00 250.71" y="289.15" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="259.78 270.78 281.78 292.78 303.78 314.78 325.78 336.78 347.78 358.78 369.78 380.78 391.78 402.78 413.78 424.78 435.78 446.78 457.78 468.78 479.78 490.78 501.78 512.78 523.78" y="289.15" font-size="11.00" class="sc-notoserifcjksc">识别模型试图从任务自身材料之外获取答案、参考解答或</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="304.77" font-size="11.00" class="sc-notoserifcjksc">隐藏测试的回合，并评估该尝试是否实际获得了奖励。我们在每个训练步都对回合进行采样，因</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="320.39" font-size="11.00" class="sc-notoserifcjksc">此这些测量覆盖了整个训练过程，而不仅仅是最终模型。</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06 394.06 396.76" y="320.39" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="320.39" font-size="11.00" class="sc-notoserifcjksc">的比率在整个过程中大致稳</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="336.01" font-size="11.00" class="sc-notoserifcjksc">定。在一大类智能体编程环境中，我们测试的每个先前发布的</text><text x="371.89 379.58 382.57 388.18 394.75 401.33" y="336.01" font-size="11.00" class="s 83.55 494.55 505.55 516.55 527.55" y="367.25" font-size="11.00" class="sc-notoserifcjksc">与最新基线共有的环境中，每个</text><text x="72.00 83.00 94.00 105.00 116.00" y="382.87" font-size="11.00" class="sc-notoserifcjksc">模型在大约</text><text x="129.89 135.80 142.63" y="382.87" font-size="11.00" class="sc-loraregular">20%</text><text x="155.09" y="382.87" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="168.99 174.89 181.08" y="382.87" font-size="11.00" class="sc-loraregular">28%</text><text x="193.54 204.54 215.54 226.54 237.54 248.54 259.54 270.54 281.54 292.54 303.54 314.54 325.54 336.54" y="382.87" font-size="11.00" class="sc-notoserifcjksc">的回合中被标记为有尝试，其中</text><text x="350.43 360.36 366.23 370.48 377.07 383.51 388.60 391.49 397.49 400.20" y="382.87" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="407.09 418.09 429.09 440.09 451.09 462.09 473.09 484.09 495.09 506.09 517.09 528.09" y="382.87" font-size="11.00" class="sc-notoserifcjksc">最低。由于尝试率在很大程</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="398.49" font-size="11.00" class="sc-notoserifcjksc">度上取决于环境本身，且某种行为是否不良往往高度依赖于具体情境，我们不在训练环境不同的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="414.11" font-size="11.00" class="sc-notoserifcjksc">模型之间比较尝试率。</text><text x="160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="532.03" font-size="11.00" class="sc-notoserifcjksc">该分类器标记模型最终自我报告与其实际所做之事相矛盾的回合，并被刻意设</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.
