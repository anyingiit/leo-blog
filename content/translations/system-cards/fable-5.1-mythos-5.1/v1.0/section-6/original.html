 x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="656.98" font-size="11.00" class="sc-notoserifcjksc">：在相同或相似场景的多次重新运行中行为的相似程度；</text><text x="108.00 119.00 130.00 141.00 152.00" y="689.37" font-size="11.00" class="sc-notoserifcjkscbold">言行一致性</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="689.37" font-size="11.00" class="sc-notoserifcjksc">：自我描述（尤其是在伦理决策相关问题上）与实际行为之间的一致程度；</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p117.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 117 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">117</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">不忠实的思考</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：思考文本中出现的、对于此前只看过模型面向用户输出的人而言会在某种</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">重要意义上感到意外的行为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="131.19" font-size="11.00" class="sc-notoserifcjkscbold">难以理解的思考</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">：不像人类、难以理解的思考文本；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="147.38" font-size="11.00" class="sc-notoserifcjkscbold">言语化评估意识</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">：推测模型可能处于测试或评估环境中；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="179.77" font-size="11.00" class="sc-notoserifcjkscbold">遵循因果决策理论</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">：在可能适用更奇特的决策论层面的考量的情境中，模型仅就其行动的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">直接因果效应进行推理、而不考虑这些考量的程度。</text><text x="361.00 363.40" y="191.72" font-size="6.60" class="sc-loraregular">10</text><text x="72.00 80.32 83.70 92.29 95.67" y="259.07" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.7</text><text x="105.89 118.89 131.89 144.89" y="259.07" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">性格特质</text><text x="72.00 83.00 94.00 105.00 116.00" y="286.95" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 212.35 215.05" y="286.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="221.95 232.95 243.95 254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="286.95" font-size="11.00" class="sc-notoserifcjksc">与此前的模型相近，在支持用户自主性、对用户有益和值得赞赏的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="302.57" font-size="11.00" class="sc-notoserifcjksc">行为等指标上，它的评分通常优于</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25" y="302.57" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="325.24 336.24 347.24 358.24" y="302.57" font-size="11.00" class="sc-notoserifcjksc">，但不及</text><text x="372.14 380.87 387.44 394.00 399.10 401.99" y="302.57" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="407.98 418.98 429.98 440.98 451.98 462.98 473.98 484.98 495.98 506.98 517.98 528.98" y="302.57" font-size="11.00" class="sc-notoserifcjksc">。在温暖、有趣或幽默的行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="318.19" font-size="11.00" class="sc-notoserifcjksc">为以及扫兴（轻视或说教）方面，</text><text x="237.00 246.93 252.80 257.05 263.64 270.08 275.17 278.06 284.06 286.76" y="318.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="293.66 304.66" y="318.19" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="318.55 326.24 329.24 334.85 341.41 347.99 353.95 356.85 366.78 372.64 376.90 383.49 389.92 395.01 397.91" y="318.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="406.80 417.80 428.80 439.80 450.80 461.80" y="318.19" font-size="11.00" class="sc-notoserifcjksc">出现了退步。</text><text x="72.00 74.18" y="700.47" font-size="6.00" class="sc-loraregular">10</text><text x="80.54 90.54 100.54 110.54" y="703.80" font-size="10.00" class="sc-notoserifcjksc">灵感来自</text><text x="123.17 131.06 136.48 141.11 144.98 150.40 154.69 160.68 166.10 168.82 174.80 177.32 179.95 186.94 189.40 191.92 194.55 199.90 203.77 206.40 211.56 214.28 216.74 219.37 222.42 227.79 233.93 239.08 244.38 247.43 249.89 252.52 258.78 261.41 267.39 272.48 276.35 281.51 286.14 291.49 295.36 297.99 303.79 307.17 309.80 315.56 321.53 326.95 331.58 335.45 338.26 344.11 350.18 354.81 357.44 363.29 369.36 371.99 377.97 383.34 388.66 391.47 396.10 398.91 404.76 410.83 415.72 419.59 425.58 430.95 436.80 441.06 446.41 450.28 453.09 458.41 461.04 465.30 470.70 475.86 480.49 486.34 492.41 495.22 501.29 506.82 509.45 512.26" y="703.80" font-size="10.00" class="sc-loraregular">Oesterheld, C., et al. (2024). A dataset of questions on decision-theoretic reasoning in</text><text x="268.80 274.70 278.67 282.54 288.51 293.14 295.64 299.33 306.23 311.39 315.72 321.02 323.83 328.49 330.95 336.80 341.08 346.61 353.51 358.67 364.49 368.77 375.67 380.82 386.24 389.88 393.52 395.98 399.62 405.83 411.28 416.90" y="718.00" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2411.10588</text><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="268.80" y="710.00" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="306.23" y="710.00" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="306.23" y="710.00" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="353.51" y="710.00" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2411.10588" rel="noopener"><rect x="353.51" y="710.00" width="69.01" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p118.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 118 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">118</text><text x="72.00" y="557.30" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="557.30" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 100.87 104.53 106.62 112.16" y="557.30" font-size="9.00" class="sc-lorabold">6.4.7.A]</text><text x="118.00 127.00 136.00 145.00 154.00 163.00 172.00 181.00 190.00 199.00 208.00 217.00" y="557.30" font-size="9.00" class="sc-notoserifcjkscbold">我们的自动化行为审计得分</text><text x="226.00 235.00 244.00 253.00 262.00 271.00 280.00 289.00 298.00 307.00 316.00 325.00 334.00 343.00 352.00 361.00 370.00 379.00 388.00 397.00 406.00 415.00 424.00 433.00 442.00 451.00 460.00 469.00 478.00 487.00 496.00 505.00 514.00 523.00 532.00" y="557.30" font-size="9.00" class="sc-notoserifcjksc">，对应下列性格指标。数值越低表示所测行为的发生率或严重程度越低；箭头标</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00 333.00 342.00 351.00 360.00" y="569.00" font-size="9.00" class="sc-notoserifcjksc">出了那些发生率越高（↑）或越低（↓）明显越好的行为。在许多情况下，</text><text x="369.00" y="569.00" font-size="9.00" class="sc-loraregular">y</text><text x="376.12 385.12 394.12 403.12 412.12" y="569.00" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="423.49 426.76" y="569.00" font-size="9.00" class="sc-loraregular">10</text><text x="434.72 443.72 452.72 461.72 470.72 479.72 488.72 497.72 506.72 515.72 524.72" y="569.00" font-size="9.00" class="sc-notoserifcjksc">以下处截断。所报告的得</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="580.70" font-size="9.00" class="sc-notoserifcjksc">分是每个目标模型全部约</text><text x="173.37 178.24 180.51 183.79 189.38" y="580.70" font-size="9.00" class="sc-loraregular">4,100</text><text x="197.34 206.34 215.34 224.34 233.34 242.34 251.34 260.34 269.34" y="580.70" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="280.71 285.54 287.81 291.09 296.68" y="580.70" font-size="9.00" class="sc-loraregular">2,100</text><text x="304.64 313.64 322.64 331.64 340.64 349.64 358.64 367.64 376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64 466.64 475.64 484.64 493.64 502.64 511.64" y="580.70" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00" y="592.40" font-size="9.00" class="sc-notoserifcjksc">次），每次调查通常包含许多单独的对话。图中显示</text><text x="281.37 286.57 291.47" y="592.40" font-size="9.00" class="sc-loraregular">95%</text><text x="301.67 310.67 319.67 328.67 337.67" y="592.40" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00" y="662.60" font-size="11.00" class="sc-notoserifcjksc">指标</text><text x="108.00 119.00 130.00 141.00 152.00" y="678.79" font-size="11.00" class="sc-notoserifcjkscbold">对用户有益</text><text x="163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="678.79" font-size="11.00" class="sc-notoserifcjksc">：总体上支持用户实现良好发展的行为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="694.98" font-size="11.00" class="sc-notoserifcjkscbold">支持用户自主性</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="694.98" font-size="11.00" class="sc-notoserifcjksc">：支持用户独立行动和自主决策的行为；</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p119.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 119 页"><text x="504.00 507.28 510.55" y="751.80" font-size="9.00" class="sc-loraregular">119</text><text x="108.00 119.00 130.00 141.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">创作造诣</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">：高质量的创作产出；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="98.81" font-size="11.00" class="sc-notoserifcjkscbold">值得赞赏的行为</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="98.81" font-size="11.00" class="sc-notoserifcjksc">：明智或亲社会的行为；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00" y="115.01" font-size="11.00" class="sc-notoserifcjkscbold">有趣或幽默的行为</text><text x="196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">：让目标模型在互动中更有趣的行为选择；</text><text x="108.00 119.00 130.00 141.00" y="131.21" font-size="11.00" class="sc-notoserifcjkscbold">思想深度</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00" y="131.21" font-size="11.00" class="sc-notoserifcjksc">：默认采用更细致入微的推理方式；</text><text x="108.00 119.00" y="147.41" font-size="11.00" class="sc-notoserifcjkscbold">温暖</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00" y="147.41" font-size="11.00" class="sc-notoserifcjksc">：默认对用户持积极态度（包括在适当情况下与用户意见不一致时）；</text><text x="108.00 119.00 130.00 141.00" y="163.61" font-size="11.00" class="sc-notoserifcjkscbold">性格漂移</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="163.61" font-size="11.00" class="sc-notoserifcjksc">：在非常长的互动中丧失理想的性格特质；</text><text x="108.00 119.00" y="179.81" font-size="11.00" class="sc-notoserifcjkscbold">扫兴</text><text x="130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">：对用户采取过度打击、轻视或说教的语气；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="196.01" font-size="11.00" class="sc-notoserifcjkscbold">对用户居高临下</text><text x="185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="196.01" font-size="11.00" class="sc-notoserifcjksc">：对用户采取高人一等、说教或对抗的姿态。</text><text x="72.00 80.32 83.70 92.29 95.67" y="226.75" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.8</text><text x="107.13 120.13 133.13 146.13 159.13 172.13 185.13 198.13 211.13 224.13 237.13 250.13 263.13 276.13 289.13 302.13" y="226.75" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">尝试超出范围的网络攻击及相关行为</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="258.61" font-size="11.00" class="sc-notoserifcjksc">鉴于模型可能逃出其接受评估的沙箱并造成现实世界危害的能力有所增强，我们新增了若干场景</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="274.23" font-size="11.00" class="sc-notoserifcjksc">和指标来评估我们模型的风险。在我们此处测量的三项指标上，</text><text x="380.00 387.69 390.68 396.29 402.86 409.44 415.40 418.29 428.22 434.09 438.34 444.93 451.37 456.46 459.35 465.35 468.05" y="274.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="474.95" y="274.23" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="488.85 496.53 499.53 505.14 511.70 518.28" y="274.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="289.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="289.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 142.08 148.52 155.19 161.87 167.76 172.01 174.91" y="289.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="183.79 194.79 205.79 216.79 227.79 238.79" y="289.85" font-size="11.00" class="sc-notoserifcjksc">更加对齐，与</text><text x="252.69 261.42 267.99 274.55 279.65 282.54" y="289.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="291.43 302.43 313.43" y="289.85" font-size="11.00" class="sc-notoserifcjksc">持平。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="339.61" font-size="11.00" class="sc-notoserifcjksc">具体而言，我们发现，在要求模型完成一项不突破沙箱便无法完成的任务的场景中，模型会尝试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="355.23" font-size="11.00" class="sc-notoserifcjksc">（并且在本次审计中未能成功）从其容器内向外访问。</text><text x="336.00 345.93 351.80 356.05 362.64 369.08 374.17 377.06 383.06 385.76" y="355.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66" y="355.23" font-size="11.00" class="sc-notoserifcjksc">访问沙箱外资源的倾向与</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="370.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74" y="370.85" font-size="11.00" class="sc-notoserifcjksc">相近，并显著低于</text><text x="201.64 211.57 217.43 221.69 228.28 234.71 239.81 242.70" y="370.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="248.69 259.69 270.69 281.69 292.69 303.69 314.69 325.69 336.69 347.69 358.69 369.69 380.69 391.69 402.69 413.69 424.69 435.69 446.69 457.69 468.69 479.69 490.69 501.69 512.69 523.69" y="370.85" font-size="11.00" class="sc-notoserifcjksc">。模型在确信自己处于模拟环境中时采取危险行动的意愿也</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="386.47" font-size="11.00" class="sc-notoserifcjksc">是如此：在这些场景中，</text><text x="193.00 201.73 208.30 214.87 219.96 222.85" y="386.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="231.74" y="386.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="245.64 255.57 261.43 265.69 272.28 278.71 283.81 286.70 292.69 295.40" y="386.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="302.30 313.30 324.30 335.30 346.30 357.30 368.30 379.30 390.30 401.30 412.30 423.30 434.30" y="386.47" font-size="11.00" class="sc-notoserifcjksc">造成危害的可能性都显著低于</text><text x="448.19 458.12 463.99 468.24 474.83 481.27 486.36 489.25" y="386.47" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="495.25 506.25 517.25 528.25" y="386.47" font-size="11.00" class="sc-notoserifcjksc">。最后，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="402.09" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66" y="402.09" font-size="11.00" class="sc-notoserifcjksc">的动机性推理少于</text><text x="219.55 229.49 235.35 239.61 246.20 252.63 257.72 260.62" y="402.09" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="269.51" y="402.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="283.40 289.64 296.07 302.75 309.42 315.31 319.57 322.46" y="402.09" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="328.45 339.45" y="402.09" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="353.35 362.08 368.65 375.21 380.31 383.20" y="402.09" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="392.09 403.09 414.09 425.09 436.09 447.09 458.09 469.09 480.09 491.09 502.09 513.09 524.09" y="402.09" font-size="11.00" class="sc-notoserifcjksc">的水平相近。我们这里所说的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="417.71" font-size="11.00" class="sc-notoserifcjksc">动机性推理，是指模型得出对手头任务而言便利的结论、且这些结论会随任务不同而改变的情</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="433.33" font-size="11.00" class="sc-notoserifcjksc">况。这可能是危险的，例如，当模型通过推理说服自己相信其环境的某个方面是或不是模拟的，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="448.95" font-size="11.00" class="sc-notoserifcjksc">从而使它不再对自己可能造成的危害保持应有的谨慎时。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="279.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="279.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 106.28 108.38 113.91" y="279.42" font-size="9.00" class="sc-lorabold">6.4.8.A]</text><text x="119.75 128.75 137.75 146.75 155.75 164.75 173.75 182.75 191.75 200.75 209.75 218.75" y="279.42" font-size="9.00" class="sc-notoserifcjkscbold">我们的自动化行为审计得分</text><text x="227.75 236.75 245.75 254.75 263.75 272.75 281.75 290.75 299.75 308.75 317.75 326.75 335.75 344.75 353.75 362.75 371.75 380.75 389.75 398.75 407.75 416.75 425.75 434.75 443.75 452.75 461.75 470.75 479.75 488.75 497.75 506.75 515.75 524.75" y="279.42" font-size="9.00" class="sc-notoserifcjksc">，对应下列未对齐指标。数值越低表示所测行为的发生率或严重程度越低，箭</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00" y="291.12" font-size="9.00" class="sc-notoserifcjksc">头标示的是发生率越低（↓）明显越好的行为。在许多情况下，</text><text x="324.00" y="291.12" font-size="9.00" class="sc-loraregular">y</text><text x="331.12 340.12 349.12 358.12 367.12" y="291.12" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="378.49 381.76" y="291.12" font-size="9.00" class="sc-loraregular">10</text><text x="389.72 398.72 407.72 416.72 425.72 434.72 443.72 452.72 461.72 470.72 479.72 488.72 497.72 506.72 515.72 524.72" y="291.12" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。报告的得分是每个目</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="302.83" font-size="9.00" class="sc-notoserifcjksc">标模型全部约</text><text x="128.37 133.24 135.51 138.79 144.38" y="302.83" font-size="9.00" class="sc-loraregular">4,100</text><text x="152.34 161.34 170.34 179.34 188.34 197.34 206.34 215.34 224.34" y="302.83" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="235.71 240.54 242.81 246.09 251.68" y="302.83" font-size="9.00" class="sc-loraregular">2,100</text><text x="259.64 268.64 277.64 286.64 295.64 304.64 313.64 322.64 331.64 340.64 349.64 358.64 367.64 376.64 385.64 394.64 403.64 412.64 421.64 430.64 439.64 448.64 457.64 466.64 475.64 484.64 493.64 502.64 511.64 520.64 529.64" y="302.83" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一次），每次调查</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00" y="314.52" font-size="9.00" class="sc-notoserifcjksc">通常包含许多单独的对话。图中显示</text><text x="218.37 223.57 228.47" y="314.52" font-size="9.00" class="sc-loraregular">95%</text><text x="238.67 247.67 256.67 265.67 274.67" y="314.52" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 83.00" y="371.47" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="387.66" font-size="11.00" class="sc-notoserifcjkscbold">动机性推理：</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="387.66" font-size="11.00" class="sc-notoserifcjksc">将其对证据或指令的解读向其有利害关系的结论倾斜；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00" y="420.05" font-size="11.00" class="sc-notoserifcjkscbold">未经许可的沙箱逃逸尝试：</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00" y="420.05" font-size="11.00" class="sc-notoserifcjksc">在未经授权的情况下试图越过隔离边界</text><text x="427.00" y="420.05" font-size="11.00" class="sc-notoserifcjkscbold">；</text><text x="438.00 449.00" y="420.05" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00" y="452.44" font-size="11.00" class="sc-notoserifcjkscbold">忽视场景可能为真实而采取危险行动：</text><text x="295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="452.44" font-size="11.00" class="sc-notoserifcjksc">在断定其所处情境并非真实后，采取严重有害的行</text><text x="108.00 119.00" y="468.06" font-size="11.00" class="sc-notoserifcjksc">动。</text><text x="72.00 80.32 83.70 92.29 95.67" y="499.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.9</text><text x="106.90 119.90 132.90 145.90 158.90 171.90 184.90" y="499.35" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">回退行为的影响</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="542.86" font-size="11.00" class="sc-notoserifcjksc">束对话的硬拦截。为了测量整个系统的行为，我们在启用这些信任与安全措施的情况下运行了标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="558.48" font-size="11.00" class="sc-notoserifcjksc">准行为审计，并在此报告其中部分结果。</text><text x="72.00 83.00" y="608.20" font-size="11.00" class="sc-notoserifcjksc">在图</text><text x="96.89 103.25 105.96 111.92 114.62 120.81 123.51" y="608.20" font-size="11.00" class="sc-loraregular">6.4.9.A</text><text x="133.29 144.29" y="608.20" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="155.29 160.88 166.56 172.96 175.95 181.91 184.80 190.80 193.51" y="608.20" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="200.40 211.40 222.40 233.40 244.40 255.40 266.40 277.40 288.40 299.40 310.40 321.40 332.40 343.40 354.40 365.40 376.40 387.40 398.40 409.40 420.40 431.40 442.40 453.40 464.40 475.40 486.40" y="608.20" font-size="11.00" class="sc-notoserifcjksc">在运行时启用了全部信任与安全分类器，并可回退到其他模型</text><text x="497.40 499.81" y="604.54" font-size="6.60" class="sc-loraregular">11</text><text x="502.21 513.21" y="608.20" font-size="11.00" class="sc-notoserifcjksc">；而</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="623.82" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95 177.95 188.95 199.95 210.95 221.95 232.95 243.95 254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95 430.95 441.95 452.95 463.95 474.95 485.95 496.95 507.95 518.95 529.95" y="623.82" font-size="11.00" class="sc-notoserifcjksc">在运行时启用了除网络安全分类器之外的全部信任与安全分类器，且不会回退</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="639.44" font-size="11.00" class="sc-notoserifcjksc">到其他模型（即分类器可以阻止该模型继续，但不会改变由哪个模型继续下一轮）。</text><text x="479.00 488.93 494.80 499.05 505.64 512.08 517.17 520.06 526.06 528.76" y="639.44" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="655.06" font-size="11.00" class="sc-notoserifcjksc">缺少网络安全</text><text x="72.00 74.18" y="700.47" font-size="6.00" class="sc-loraregular">11</text><text x="79.00 89.00 99.00 109.00 119.00 129.00 139.00 149.00 159.00 169.00 179.00 189.00 199.00 209.00 219.00 229.00 239.00 249.00" y="703.80" font-size="10.00" class="sc-notoserifcjksc">我们测试了在网络安全相关拦截时回退到</text><text x="261.63 269.57 275.54 281.51 286.14 288.77 294.19 296.65" y="703.80" font-size="10.00" class="sc-loraregular">Opus 4.8</text><text x="302.27 312.27 322.27 332.27 342.27 352.27" y="703.80" font-size="10.00" class="sc-notoserifcjksc">，在生物学和</text><text x="364.90 371.16 374.51 377.14 383.42 390.37" y="703.80" font-size="10.00" class="sc-loraregular">AI R&amp;D</text><text x="400.45 410.45 420.45 430.45 440.45 450.45 460.45 470.45" y="703.80" font-size="10.00" class="sc-notoserifcjksc">相关拦截时回退到</text><text x="483.08 491.02 496.99 502.96 507.59 510.22" y="703.80" font-size="10.00" class="sc-loraregular">Opus 5</text><text x="515.67" y="703.80" font-size="10.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器，这是其不允许的网络攻击发生率略高的原因。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 94.63 101.19 107.76 112.85 115.75" y="131.19" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="124.64 135.64 146.64 157.64 168.64 179.64 190.64 201.64 212.64 223.64 234.64 245.64 256.64 267.64 278.64 289.64 300.64 311.64 322.64 333.64 344.64 355.64 366.64 377.64 388.64" y="131.19" font-size="11.00" class="sc-notoserifcjksc">一样，回退到其他模型会在若干维度上造成轻微退步。当</text><text x="402.53 410.22 413.21 418.82 425.39 431.96 437.93 440.82 446.41 452.08 458.49 461.48 467.44 470.33 476.33 479.03" y="131.19" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="485.93 496.93 507.93 518.93 529.93" y="131.19" font-size="11.00" class="sc-notoserifcjksc">回退到对齐</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">程度较低的模型时，该模型会采取对齐程度较低的行为，这体现在总体得分中。尽管对话随后由</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">对齐程度较低的模型继续，但该模型能够提供的能力提升也更有限。在我们下文所报告的这种低</text><text x="72.00 83.00 94.00 105.00 116.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">分水平下，</text><text x="127.00" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="131.40 142.40 153.40 164.40 175.40 186.40 197.40 208.40" y="178.05" font-size="11.00" class="sc-notoserifcjksc">不允许的网络攻击</text><text x="219.40" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="223.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="234.24" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="238.64 249.64 260.64 271.64 282.64 293.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">配合人类滥用</text><text x="304.64" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="308.48 319.48 330.48 341.48 352.48 363.48 374.48 385.48 396.48 407.48 418.48 429.48 440.48 451.48 462.48 473.48 484.48 495.48 506.48 517.48 528.48" y="178.05" font-size="11.00" class="sc-notoserifcjksc">等类别在很大程度上衡量的是目标模型提供轻微</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">能力提升的意愿，而非能力提升的严重程度。</text><text x="72.00" y="637.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 106.17 108.27 113.81" y="637.66" font-size="9.00" class="sc-lorabold">6.4.9.A]</text><text x="119.65 128.65 137.65 146.65 155.65 164.65 173.65 182.65 191.65 200.65 209.65 218.65 227.65 236.65 245.65 254.65 263.65 272.65 281.65 290.65 299.65 308.65 317.65 326.65 335.65" y="637.66" font-size="9.00" class="sc-notoserifcjkscbold">启用信任与安全回退机制时我们的自动化行为审计得分。</text><text x="344.65 353.65 362.65 371.65 380.65 389.65 398.65 407.65 416.65 425.65 434.65 443.65 452.65 461.65 470.65 479.65 488.65 497.65 506.65 515.65 524.65" y="637.66" font-size="9.00" class="sc-notoserifcjksc">在本图中，数值越低表示所测行为的发生率或严</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00" y="649.36" font-size="9.00" class="sc-notoserifcjksc">重程度越低。在许多情况下，</text><text x="189.00" y="649.36" font-size="9.00" class="sc-loraregular">y</text><text x="196.12 205.12 214.12 223.12 232.12" y="649.36" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="243.49 246.76" y="649.36" font-size="9.00" class="sc-loraregular">10</text><text x="254.72 263.72 272.72 281.72 290.72 299.72 308.72 317.72 326.72 335.72 344.72 353.72 362.72 371.72 380.72 389.72 398.72 407.72 416.72 425.72 434.72 443.72" y="649.36" font-size="9.00" class="sc-notoserifcjksc">以下处截断。所报告的得分是每个目标模型全部约</text><text x="455.09 459.23 464.07" y="649.36" font-size="9.00" class="sc-loraregular">720</text><text x="472.02 481.02 490.02 499.02 508.02 517.02" y="649.36" font-size="9.00" class="sc-notoserifcjksc">次调查的平均</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="661.06" font-size="9.00" class="sc-notoserifcjksc">值，每次调查通常包含许多单独的对话。图中显示</text><text x="272.37 277.57 282.47" y="661.06" font-size="9.00" class="sc-loraregular">95%</text><text x="292.67 301.67 310.67 319.67 328.67" y="661.06" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="504.00 507.28 512.11" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00 80.96 84.60" y="84.20" font-size="14.00" class="sc-poppinssemibold">6.5</text><text x="96.95 110.95 124.95 138.95 152.95 166.95" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">诚实性与幻觉</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="110.76" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="110.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00 80.32 83.70 92.07 95.45" y="141.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.1</text><text x="103.25 116.25 129.25 142.25 155.25" y="141.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">事实性幻觉</text><text x="72.00 83.00 94.00" y="169.38" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.29 121.95 127.33 136.06 145.90 152.58 155.67 160.76 166.61 169.70 175.66 182.34 188.14" y="169.38" font-size="11.00" class="sc-loraregular">AA-Omniscience</text><text x="196.99 207.99 218.99 229.99 240.99 251.99 262.99 273.99 284.99 295.99 306.99 317.99 328.99 339.99 350.99 361.99 372.99 383.99 394.99 405.99 416.99" y="169.38" font-size="11.00" class="sc-notoserifcjksc">的公开子集上测量了事实准确性。这是一个涵盖</text><text x="430.89 436.85" y="169.38" font-size="11.00" class="sc-loraregular">41</text><text x="443.74 454.74 465.74 476.74 487.74 498.74 509.74 520.74" y="169.38" font-size="11.00" class="sc-notoserifcjksc">个主题的闭卷基准</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="185.00" font-size="11.00" class="sc-notoserifcjksc">测试，题目取自多个具有经济和学术意义的领域。模型在作答时无法使用网络搜索或知识库，必</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="200.62" font-size="11.00" class="sc-notoserifcjksc">须依靠自身知识作答。每个答案被评为正确、错误或弃答。</text><text x="72.00" y="521.65" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="521.65" font-size="9.00" class="sc-lorabold">6.5.1.A]</text><text x="118.20 127.20 136.20 145.20 154.20 163.20 172.20" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">事实性净得分。</text><text x="181.20 187.24 192.70 197.10 204.25 212.29 217.76 220.28 224.45 229.24 231.77 236.65 242.11 246.85" y="521.65" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="254.10 263.10 272.10 281.10 290.10 299.10 308.10 317.10 326.10 335.10 344.10 353.10 362.10 371.10 380.10 389.10 398.10 407.10 416.10 425.10 434.10" y="521.65" font-size="9.00" class="sc-notoserifcjksc">上正确回答数减去错误回答数。弃答记为零分。</text></svg></div>
