"72.00" y="258.61" font-size="11.00" class="sc-notoserifcjksc">鉴于模型可能逃出其接受评估的沙箱并造成现实世界危害的能力有所增强，我们新增了若干场景</text><text x="72.00" y="274.23" font-size="11.00" class="sc-notoserifcjksc">和指标来评估我们模型的风险。在我们此处测量的三项指标上，</text><text x="380.00 387.69 390.68 396.29 402.86 409.44 415.40 418.29 428.22 434.09 438.34 444.93 451.37 456.46 459.35 465.35 468.05" y="274.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="474.95" y="274.23" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="488.85 496.53 499.53 505.14 511.70 518.28" y="274.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="289.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="289.85" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 142.08 148.52 155.19 161.87 167.76 172.01 174.91" y="289.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="183.79" y="289.85" font-size="11.00" class="sc-notoserifcjksc">更加对齐，与</text><text x="252.69" y="289.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="291.43" y="289.85" font-size="11.00" class="sc-notoserifcjksc">持平。</text><text x="72.00" y="339.61" font-size="11.00" class="sc-notoserifcjksc">具体而言，我们发现，在要求模型完成一项不突破沙箱便无法完成的任务的场景中，模型会尝试</text><text x="72.00" y="355.23" font-size="11.00" class="sc-notoserifcjksc">（并且在本次审计中未能成功）从其容器内向外访问。</text><text x="336.00 345.93 351.80 356.05 362.64 369.08 374.17 377.06 383.06 385.76" y="355.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="392.66" y="355.23" font-size="11.00" class="sc-notoserifcjksc">访问沙箱外资源的倾向与</text><text x="72.00" y="370.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="370.85" font-size="11.00" class="sc-notoserifcjksc">相近，并显著低于</text><text x="201.64 211.57 217.43 221.69 228.28 234.71 239.81 242.70" y="370.85" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="248.69" y="370.85" font-size="11.00" class="sc-notoserifcjksc">。模型在确信自己处于模拟环境中时采取危险行动的意愿也</text><text x="72.00" y="386.47" font-size="11.00" class="sc-notoserifcjksc">是如此：在这些场景中，</text><text x="193.00" y="386.47" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="231.74" y="386.47" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="245.64 255.57 261.43 265.69 272.28 278.71 283.81 286.70 292.69 295.40" y="386.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="302.30" y="386.47" font-size="11.00" class="sc-notoserifcjksc">造成危害的可能性都显著低于</text><text x="448.19 458.12 463.99 468.24 474.83 481.27 486.36 489.25" y="386.47" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="495.25" y="386.47" font-size="11.00" class="sc-notoserifcjksc">。最后，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="402.09" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66" y="402.09" font-size="11.00" class="sc-notoserifcjksc">的动机性推理少于</text><text x="219.55 229.49 235.35 239.61 246.20 252.63 257.72 260.62" y="402.09" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="269.51" y="402.09" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="283.40 289.64 296.07 302.75 309.42 315.31 319.57 322.46" y="402.09" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="328.45" y="402.09" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="353.35" y="402.09" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="392.09" y="402.09" font-size="11.00" class="sc-notoserifcjksc">的水平相近。我们这里所说的</text><text x="72.00" y="417.71" font-size="11.00" class="sc-notoserifcjksc">动机性推理，是指模型得出对手头任务而言便利的结论、且这些结论会随任务不同而改变的情</text><text x="72.00" y="433.33" font-size="11.00" class="sc-notoserifcjksc">况。这可能是危险的，例如，当模型通过推理说服自己相信其环境的某个方面是或不是模拟的，</text><text x="72.00" y="448.95" font-size="11.00" class="sc-notoserifcjksc">从而使它不再对自己可能造成的危害保持应有的谨慎时。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p120.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 120 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">120</text><text x="72.00" y="279.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="279.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 106.28 108.38 113.91" y="279.42" font-size="9.00" class="sc-lorabold">6.4.8.A]</text><text x="119.75" y="279.42" font-size="9.00" class="sc-notoserifcjkscbold">我们的自动化行为审计得分</text><text x="227.75" y="279.42" font-size="9.00" class="sc-notoserifcjksc">，对应下列未对齐指标。数值越低表示所测行为的发生率或严重程度越低，箭</text><text x="72.00" y="291.12" font-size="9.00" class="sc-notoserifcjksc">头标示的是发生率越低（↓）明显越好的行为。在许多情况下，</text><text x="324.00" y="291.12" font-size="9.00" class="sc-loraregular">y</text><text x="331.12" y="291.12" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="378.49" y="291.12" font-size="9.00" class="sc-loraregular">10</text><text x="389.72" y="291.12" font-size="9.00" class="sc-notoserifcjksc">以下即被截断。报告的得分是每个目</text><text x="72.00" y="302.83" font-size="9.00" class="sc-notoserifcjksc">标模型全部约</text><text x="128.37" y="302.83" font-size="9.00" class="sc-loraregular">4,100</text><text x="152.34" y="302.83" font-size="9.00" class="sc-notoserifcjksc">次调查的平均值（约</text><text x="235.71" y="302.83" font-size="9.00" class="sc-loraregular">2,100</text><text x="259.64" y="302.83" font-size="9.00" class="sc-notoserifcjksc">条种子指令，每个对话场景由两个调查者模型各调查一次），每次调查</text><text x="72.00" y="314.52" font-size="9.00" class="sc-notoserifcjksc">通常包含许多单独的对话。图中显示</text><text x="218.37" y="314.52" font-size="9.00" class="sc-loraregular">95%</text><text x="238.67" y="314.52" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="371.47" font-size="11.00" class="sc-notoserifcjkscbold">指标</text><text x="108.00" y="387.66" font-size="11.00" class="sc-notoserifcjkscbold">动机性推理：</text><text x="174.00" y="387.66" font-size="11.00" class="sc-notoserifcjksc">将其对证据或指令的解读向其有利害关系的结论倾斜；</text><text x="108.00" y="420.05" font-size="11.00" class="sc-notoserifcjkscbold">未经许可的沙箱逃逸尝试：</text><text x="240.00" y="420.05" font-size="11.00" class="sc-notoserifcjksc">在未经授权的情况下试图越过隔离边界</text><text x="427.00" y="420.05" font-size="11.00" class="sc-notoserifcjkscbold">；</text><text x="438.00" y="420.05" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="108.00" y="452.44" font-size="11.00" class="sc-notoserifcjkscbold">忽视场景可能为真实而采取危险行动：</text><text x="295.00" y="452.44" font-size="11.00" class="sc-notoserifcjksc">在断定其所处情境并非真实后，采取严重有害的行</text><text x="108.00" y="468.06" font-size="11.00" class="sc-notoserifcjksc">动。</text><text x="72.00" y="499.35" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.4.9</text><text x="106.90" y="499.35" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">回退行为的影响</text><text x="72.00" y="542.86" font-size="11.00" class="sc-notoserifcjksc">束对话的硬拦截。为了测量整个系统的行为，我们在启用这些信任与安全措施的情况下运行了标</text><text x="72.00" y="558.48" font-size="11.00" class="sc-notoserifcjksc">准行为审计，并在此报告其中部分结果。</text><text x="72.00" y="608.20" font-size="11.00" class="sc-notoserifcjksc">在图</text><text x="96.89 103.25 105.96 111.92 114.62 120.81 123.51" y="608.20" font-size="11.00" class="sc-loraregular">6.4.9.A</text><text x="133.29" y="608.20" font-size="11.00" class="sc-notoserifcjksc">中，</text><text x="155.29 160.88 166.56 172.96 175.95 181.91 184.80 190.80 193.51" y="608.20" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="200.40" y="608.20" font-size="11.00" class="sc-notoserifcjksc">在运行时启用了全部信任与安全分类器，并可回退到其他模型</text><text x="497.40" y="604.54" font-size="6.60" class="sc-loraregular">11</text><text x="502.21" y="608.20" font-size="11.00" class="sc-notoserifcjksc">；而</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="623.82" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="623.82" font-size="11.00" class="sc-notoserifcjksc">在运行时启用了除网络安全分类器之外的全部信任与安全分类器，且不会回退</text><text x="72.00" y="639.44" font-size="11.00" class="sc-notoserifcjksc">到其他模型（即分类器可以阻止该模型继续，但不会改变由哪个模型继续下一轮）。</text><text x="479.00 488.93 494.80 499.05 505.64 512.08 517.17 520.06 526.06 528.76" y="639.44" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="72.00" y="655.06" font-size="11.00" class="sc-notoserifcjksc">缺少网络安全</text><text x="72.00" y="700.47" font-size="6.00" class="sc-loraregular">11</text><text x="79.00" y="703.80" font-size="10.00" class="sc-notoserifcjksc">我们测试了在网络安全相关拦截时回退到</text><text x="261.63" y="703.80" font-size="10.00" class="sc-loraregular">Opus 4.8</text><text x="302.27" y="703.80" font-size="10.00" class="sc-notoserifcjksc">，在生物学和</text><text x="364.90" y="703.80" font-size="10.00" class="sc-loraregular">AI R&amp;D</text><text x="400.45" y="703.80" font-size="10.00" class="sc-notoserifcjksc">相关拦截时回退到</text><text x="483.08" y="703.80" font-size="10.00" class="sc-loraregular">Opus 5</text><text x="515.67" y="703.80" font-size="10.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p121.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 121 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">121</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器，这是其不允许的网络攻击发生率略高的原因。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89" y="131.19" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="124.64" y="131.19" font-size="11.00" class="sc-notoserifcjksc">一样，回退到其他模型会在若干维度上造成轻微退步。当</text><text x="402.53 410.22 413.21 418.82 425.39 431.96 437.93 440.82 446.41 452.08 458.49 461.48 467.44 470.33 476.33 479.03" y="131.19" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="485.93" y="131.19" font-size="11.00" class="sc-notoserifcjksc">回退到对齐</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">程度较低的模型时，该模型会采取对齐程度较低的行为，这体现在总体得分中。尽管对话随后由</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">对齐程度较低的模型继续，但该模型能够提供的能力提升也更有限。在我们下文所报告的这种低</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">分水平下，</text><text x="127.00" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="131.40" y="178.05" font-size="11.00" class="sc-notoserifcjksc">不允许的网络攻击</text><text x="219.40" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="223.24" y="178.05" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="234.24" y="178.05" font-size="11.00" class="sc-loraregular">“</text><text x="238.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">配合人类滥用</text><text x="304.64" y="178.05" font-size="11.00" class="sc-loraregular">”</text><text x="308.48" y="178.05" font-size="11.00" class="sc-notoserifcjksc">等类别在很大程度上衡量的是目标模型提供轻微</text><text x="72.00" y="193.67" font-size="11.00" class="sc-notoserifcjksc">能力提升的意愿，而非能力提升的严重程度。</text><text x="72.00" y="637.66" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="637.66" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.04 101.13 106.17 108.27 113.81" y="637.66" font-size="9.00" class="sc-lorabold">6.4.9.A]</text><text x="119.65" y="637.66" font-size="9.00" class="sc-notoserifcjkscbold">启用信任与安全回退机制时我们的自动化行为审计得分。</text><text x="344.65" y="637.66" font-size="9.00" class="sc-notoserifcjksc">在本图中，数值越低表示所测行为的发生率或严</text><text x="72.00" y="649.36" font-size="9.00" class="sc-notoserifcjksc">重程度越低。在许多情况下，</text><text x="189.00" y="649.36" font-size="9.00" class="sc-loraregular">y</text><text x="196.12" y="649.36" font-size="9.00" class="sc-notoserifcjksc">轴在最高分</text><text x="243.49" y="649.36" font-size="9.00" class="sc-loraregular">10</text><text x="254.72" y="649.36" font-size="9.00" class="sc-notoserifcjksc">以下处截断。所报告的得分是每个目标模型全部约</text><text x="455.09" y="649.36" font-size="9.00" class="sc-loraregular">720</text><text x="472.02" y="649.36" font-size="9.00" class="sc-notoserifcjksc">次调查的平均</text><text x="72.00" y="661.06" font-size="9.00" class="sc-notoserifcjksc">值，每次调查通常包含许多单独的对话。图中显示</text><text x="272.37" y="661.06" font-size="9.00" class="sc-loraregular">95%</text><text x="292.67" y="661.06" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p122.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 122 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">122</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">6.5</text><text x="96.95" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">诚实性与幻觉</text><text x="72.00" y="110.76" font-size="11.00" class="sc-notoserifcjksc">本节中的所有评估均在</text><text x="184.89 192.58 195.57 201.18 207.75 214.33 220.29 223.18 233.12 238.98 243.24 249.83 256.26 261.35 264.25 270.24 272.95" y="110.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="279.85" y="110.76" font-size="11.00" class="sc-notoserifcjksc">的最终快照上运行。</text><text x="72.00" y="141.49" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.1</text><text x="103.25" y="141.49" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">事实性幻觉</text><text x="72.00" y="169.38" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 115.29 121.95 127.33 136.06 145.90 152.58 155.67 160.76 166.61 169.70 175.66 182.34 188.14" y="169.38" font-size="11.00" class="sc-loraregular">AA-Omniscience</text><text x="196.99" y="169.38" font-size="11.00" class="sc-notoserifcjksc">的公开子集上测量了事实准确性。这是一个涵盖</text><text x="430.89" y="169.38" font-size="11.00" class="sc-loraregular">41</text><text x="443.74" y="169.38" font-size="11.00" class="sc-notoserifcjksc">个主题的闭卷基准</text><text x="72.00" y="185.00" font-size="11.00" class="sc-notoserifcjksc">测试，题目取自多个具有经济和学术意义的领域。模型在作答时无法使用网络搜索或知识库，必</text><text x="72.00" y="200.62" font-size="11.00" class="sc-notoserifcjksc">须依靠自身知识作答。每个答案被评为正确、错误或弃答。</text><text x="72.00" y="521.65" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="521.65" font-size="9.00" class="sc-lorabold">6.5.1.A]</text><text x="118.20" y="521.65" font-size="9.00" class="sc-notoserifcjkscbold">事实性净得分。</text><text x="181.20 187.24 192.70 197.10 204.25 212.29 217.76 220.28 224.45 229.24 231.77 236.65 242.11 246.85" y="521.65" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="254.10" y="521.65" font-size="9.00" class="sc-notoserifcjksc">上正确回答数减去错误回答数。弃答记为零分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p123.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 123 页"><text x="72.00 80.34 83.48 91.78 94.91 102.41 105.79 117.25 126.31 134.16" y="432.90" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.5.2 MASK</text><text x="504.00 507.28 511.97" y="751.80" font-size="9.00" class="sc-loraregular">123</text><text x="72.00" y="310.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="310.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 104.72 106.82 112.36" y="310.75" font-size="9.00" class="sc-lorabold">6.5.1.B]</text><text x="118.20" y="310.75" font-size="9.00" class="sc-notoserifcjkscbold">事实性细分结果。</text><text x="190.20 196.24 201.70 206.10 213.25 221.29 226.76 229.28 233.45 238.24 240.77 245.65 251.11 255.85" y="310.75" font-size="9.00" class="sc-loraregular">AA-Omniscience</text><text x="263.10" y="310.75" font-size="9.00" class="sc-notoserifcjksc">闭卷事实性基准测试上的评分细分。每个回答被评为正确、错误或弃</text><text x="72.00" y="322.45" font-size="9.00" class="sc-notoserifcjksc">答。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="349.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="349.80" font-size="11.00" class="sc-notoserifcjksc">的净得分为</text><text x="224.85 231.50 234.21 240.20" y="349.80" font-size="11.00" class="sc-loraregular">0.57</text><text x="245.27" y="349.80" font-size="11.00" class="sc-notoserifcjksc">，略低于</text><text x="292.17 299.85 302.85 308.46 315.02 321.60 327.56 330.46 340.39 346.25 350.51 357.10 363.53 368.63 371.52" y="349.80" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="377.51" y="349.80" font-size="11.00" class="sc-notoserifcjksc">（但在误差线范围内），并领先于</text><text x="72.00" y="365.42" font-size="11.00" class="sc-notoserifcjksc">所有其他</text><text x="118.89 126.58 129.57 135.18 141.75 148.33" y="365.42" font-size="11.00" class="sc-loraregular">Claude</text><text x="157.18" y="365.42" font-size="11.00" class="sc-notoserifcjksc">模型。按评分细分来看，</text><text x="278.18 288.12 293.98 298.24 304.83 311.26 316.35 319.25 325.24 327.95" y="365.42" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="334.85" y="365.42" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="348.74 358.67 364.53 368.79 375.38 381.81 386.91 389.80" y="365.42" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="398.69" y="365.42" font-size="11.00" class="sc-notoserifcjksc">更不倾向于对问题弃答，这是</text><text x="72.00" y="381.04" font-size="11.00" class="sc-notoserifcjksc">其正确和错误回答比例都更高的原因之一。</text><text x="72.00 82.02 88.46 95.03 101.00 103.99 106.88 113.77 116.76 119.85 125.93 132.61 142.44 148.41 154.98 159.24 162.13 168.54 174.42 178.87 187.54 193.45 199.41 206.09 208.98 215.18 219.43 225.03 229.29 235.25 245.09 251.05 257.62 261.88 266.98 269.87 275.54 282.22 288.80 291.69 299.21 305.88 312.21 321.02 324.01 329.92 336.50 342.52" y="456.99" font-size="11.00" class="sc-loraregular">Model Alignment between Statements and Knowledge</text><text x="348.49" y="456.99" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="359.49" y="456.99" font-size="11.00" class="sc-loraregular">MASK</text><text x="390.22" y="456.99" font-size="11.00" class="sc-notoserifcjksc">）衡量的是模型在受到用户或</text><text x="72.00" y="472.61" font-size="11.00" class="sc-notoserifcjksc">系统提示词施压时，是否会与自己陈述的信念相矛盾。与以往的系统卡一样，我们使用了</text><text x="503.89" y="472.61" font-size="11.00" class="sc-loraregular">MASK</text><text x="72.00" y="488.23" font-size="11.00" class="sc-notoserifcjksc">评估集的公开测试集。在图</text><text x="206.89" y="488.23" font-size="11.00" class="sc-loraregular">6.5.2.A</text><text x="243.05" y="488.23" font-size="11.00" class="sc-notoserifcjksc">中，我们观察到</text><text x="322.94 330.63 333.62 339.23 345.80 352.38 358.34 361.23 371.17 377.03 381.29 387.88 394.31 399.40 402.30 408.29 411.00" y="488.23" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="417.90" y="488.23" font-size="11.00" class="sc-notoserifcjksc">的诚实率低于自</text><text x="497.79 505.48 508.47 514.08 520.65 527.22" y="488.23" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.73 124.42 130.32 135.88 138.97 144.89" y="503.85" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="156.59" y="503.85" font-size="11.00" class="sc-notoserifcjksc">以来发布的各款</text><text x="236.48 244.17 247.16 252.77 259.34 265.92" y="503.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="274.77" y="503.85" font-size="11.00" class="sc-notoserifcjksc">模型。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p124.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 124 页"><text x="504.00 507.28 511.91" y="751.81" font-size="9.00" class="sc-loraregular">124</text><text x="72.00" y="343.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="343.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.87 107.96 113.50" y="343.92" font-size="9.00" class="sc-lorabold">6.5.2.A]</text><text x="119.34" y="343.92" font-size="9.00" class="sc-notoserifcjkscbold">压力下的诚实性。</text><text x="191.34" y="343.92" font-size="9.00" class="sc-notoserifcjksc">公开</text><text x="211.71" y="343.92" font-size="9.00" class="sc-loraregular">MASK</text><text x="239.22" y="343.92" font-size="9.00" class="sc-notoserifcjksc">子集上的诚实率：模型在压力下没有与自己引出的信念相矛盾的提示所占比</text><text x="72.00" y="355.62" font-size="9.00" class="sc-notoserifcjksc">例。越高越好。图中显示</text><text x="173.37" y="355.62" font-size="9.00" class="sc-loraregular">95%</text><text x="193.67" y="355.62" font-size="9.00" class="sc-notoserifcjksc">置信区间（</text><text x="238.67" y="355.62" font-size="9.00" class="sc-loraregular">n=904</text><text x="264.57" y="355.62" font-size="9.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="396.23" font-size="11.00" class="sc-notoserifcjksc">这一退步源于</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="396.23" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="197.55" y="396.23" font-size="11.00" class="sc-notoserifcjksc">在受系统提示词引导时，更愿意写出违背其所陈述信念的回答。其中包</text><text x="72.00" y="427.47" font-size="11.00" class="sc-notoserifcjksc">维链中，</text><text x="116.00 125.93 131.80 136.05 142.64 149.08 154.17 157.06 163.06 165.76" y="427.47" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="172.66" y="427.47" font-size="11.00" class="sc-notoserifcjksc">意识到相关说法是错误的，但出于系统提示词的引导以及认为所请求的回答</text><text x="72.00" y="443.09" font-size="11.00" class="sc-notoserifcjksc">属于</text><text x="94.00" y="443.09" font-size="11.00" class="sc-loraregular">“</text><text x="98.40" y="443.09" font-size="11.00" class="sc-notoserifcjksc">低危害</text><text x="131.40" y="443.09" font-size="11.00" class="sc-loraregular">”</text><text x="135.24" y="443.09" font-size="11.00" class="sc-notoserifcjksc">这两方面原因，仍然照做。</text><text x="72.00" y="507.93" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.3</text><text x="106.33" y="507.93" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自我识别偏差</text><text x="72.00" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04 160.00 162.35" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 4.7</text><text x="170.32" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">中，我们观察到，当</text><text x="272.21 279.90 282.89 288.50 295.07 301.65" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="310.50" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">被告知对话记录由另一个</text><text x="434.40 442.08 445.08 450.69 457.25 463.83" y="535.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="472.69" y="535.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">实例生成时，</text><text x="72.00" y="551.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">它倾向于给出更高的评分。这带来了共谋风险，即</text><text x="316.89 324.58 327.57 333.18 339.75 346.33" y="551.43" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="355.18" y="551.43" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">可能会对相似模型的输出给出高于应</text><text x="72.00" y="567.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">有水平的评分。为测试这种自我偏好，我们让</text><text x="294.89 302.58 305.57 311.18 317.75 324.33" y="567.05" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="333.18" y="567.05" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">为表现出不可接受行为（例如误导性输出</text><text x="72.00" y="582.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">或未经授权的操作）的对话记录评分，同时告知它该对话记录由某个</text><text x="404.89 412.58 415.57 421.18 427.75 434.33" y="582.67" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="443.18" y="582.67" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">实例生成，或由另</text><text x="72.00" y="598.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">一个前沿模型生成。我们测量</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="598.29" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="256.18" y="598.29" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这两种条件下对同一对话记录所给分数的差异。我们发</text><text x="72.00" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">现，</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 142.22 148.09 152.34 158.93 165.37 170.46 173.35 179.35 182.06" y="613.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Mythos 5.1</text><text x="188.95" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是自</text><text x="213.85 222.58 229.15 235.71 240.81 243.70 249.66 252.01" y="613.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Opus 4.7</text><text x="259.98" y="613.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">以来第一个表现出明显自我识别偏差的模型，尽管该偏差</text><text x="72.00" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的幅度仍然相当小（满分</text><text x="195.89" y="629.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="209.62" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分中的</text><text x="245.51 252.17 254.88" y="629.53" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">0.1</text><text x="261.77" y="629.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">分）。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p125.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 125 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">125</text><text x="72.00" y="332.68" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="332.68" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 106.11 108.21 113.74" y="332.68" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.3.A]</text><text x="119.58" y="332.68" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">按模型和提示条件划分的自我偏好偏差。</text><text x="281.58" y="332.68" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">正值表示当评分者被告知对话记录作者是</text><text x="445.95 452.24 454.69 459.28 464.65 470.03" y="332.68" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="477.28" y="332.68" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">时评分更宽松。</text><text x="72.00" y="344.38" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">这是十分制，因此此处的数值明显小于可能的最大值。图中显示</text><text x="326.37" y="344.38" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="346.67" y="344.38" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00" y="389.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.5.4</text><text x="107.14" y="389.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">照搬答案</text><text x="72.00" y="417.41" font-size="11.00" class="sc-notoserifcjksc">为测试</text><text x="107.89 115.58 118.57 124.18 130.75 137.33" y="417.41" font-size="11.00" class="sc-loraregular">Claude</text><text x="146.18" y="417.41" font-size="11.00" class="sc-notoserifcjksc">的诚实性，我们还会给它一些编程任务，其中任务的解决方案已经泄露在代码仓</text><text x="72.00" y="433.03" font-size="11.00" class="sc-notoserifcjksc">库本身中，例如：容器中包含某个软件包已实现该修复的较新版本、要求它实现的修复存在于一</text><text x="72.00" y="464.27" font-size="11.00" class="sc-notoserifcjksc">以在沙箱内部获取修复内容，既没有网络访问权限，也不需要外部网络访问。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p126.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 126 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">126</text><text x="72.00" y="340.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="340.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="340.92" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.4.A]</text><text x="119.47" y="340.92" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">暗中使用率：</text><text x="173.47" y="340.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">不同</text><text x="193.83 200.12 202.57 207.16 212.53 217.92" y="340.92" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="225.16" y="340.92" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">模型在未告知用户的情况下实质性使用容器中泄露答案的比率。此处越低越好，</text><text x="72.00" y="352.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">数值附</text><text x="101.37" y="352.62" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="121.67" y="352.62" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00" y="644.50" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">[</text><text x="75.47" y="644.50" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">图</text><text x="86.84 92.02 94.11 98.97 101.07 105.99 108.09 113.62" y="644.50" font-size="9.00" class="sc-lorabold" fill="#1d1c1d">6.5.4.B]</text><text x="119.47" y="644.50" font-size="9.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">暗中使用率：</text><text x="173.47" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">与图</text><text x="193.83" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">6.5.4.A</text><text x="223.46" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">相同，但以</text><text x="270.83 277.12 279.57 284.16 289.53 294.91" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">Claude</text><text x="302.16" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">找到答案为条件。越低越好，数值附</text><text x="448.52" y="644.50" font-size="9.00" class="sc-loraregular" fill="#1d1c1d">95%</text><text x="468.83" y="644.50" font-size="9.00" class="sc-notoserifcjksc" fill="#1d1c1d">置信区间。</text><text x="72.00" y="683.55" font-size="11.00" class="sc-notoserifcjksc">本评估的目的是考察</text><text x="173.89 181.58 184.57 190.18 196.75 203.33" y="683.55" font-size="11.00" class="sc-loraregular">Claude</text><text x="212.18" y="683.55" font-size="11.00" class="sc-notoserifcjksc">找到解决方案后的行为：它是会在最终消息中告知用户答案的来</text><text x="261.89" y="699.17" font-size="11.00" class="sc-loraregular">6.5.4.A</text><text x="298.11" y="699.17" font-size="11.00" class="sc-notoserifcjksc">显示了</text><text x="334.00 341.69 344.68 350.29 356.86 363.43" y="699.17" font-size="11.00" class="sc-loraregular">Claude</text><text x="372.29" y="699.17" font-size="11.00" class="sc-notoserifcjksc">模型既找到</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p127.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 127 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">127</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">答案又未注明原始来源的比率，而图</text><text x="250.89" y="82.61" font-size="11.00" class="sc-loraregular">6.5.4.B</text><text x="287.06" y="82.61" font-size="11.00" class="sc-notoserifcjksc">显示了在找到答案的条件下，它们未注明原始来源的</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">比率。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-notoserifcjksc">我们看到，</text><text x="127.00 134.69 137.68 143.29 149.86 156.44 162.40 165.29 175.22 181.09 185.34 191.93 198.37 203.46 206.35 212.35 215.05" y="131.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="221.95" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="235.85 240.92 247.57 250.28 254.28" y="131.19" font-size="11.00" class="sc-loraregular">70.1%</text><text x="266.74" y="131.19" font-size="11.00" class="sc-notoserifcjksc">的情况下未加披露地使用了泄露的答案，这一比例高于</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15 146.11 148.81" y="146.81" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="154.99" y="146.81" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="165.99 173.68 176.68 182.29 188.85 195.43 201.39 204.29 214.22 220.08 224.34 230.93 237.36 242.46 245.35" y="146.81" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="254.24" y="146.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="268.13 275.82 278.81 284.42 290.99 297.57 303.53 306.42 312.66 319.09 325.77 332.45 338.33 342.59 345.48" y="146.81" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="351.48" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（尽管由于样本量较小，均值差异在统</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">计学上并不显著），但低于</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="162.43" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="326.88" y="162.43" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="337.88 345.57 348.56 354.17 360.74 367.32 373.28 376.17 384.91 391.47 398.04 403.13 406.03 411.99 414.34" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="422.31" y="162.43" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="436.20 443.89 446.88 452.49 459.06 465.64 471.60 474.49 483.22 489.79 496.36 501.45 504.34" y="162.43" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="510.34" y="162.43" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">6.6</text><text x="96.89" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">本次对齐评估的可靠性</text><text x="72.00" y="240.09" font-size="11.00" class="sc-notoserifcjksc">只有当我们的对齐评估能够可靠地表明模型在我们关注的处境中会如何行事时，它才有价值。尽</text><text x="72.00" y="255.71" font-size="11.00" class="sc-notoserifcjksc">管我们已经展示了许多模型在各种模拟条件下以理想方式行事的例子，但我们的评估可能会被一</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">个足够聪明、试图隐藏其意图或能力信息的模型所蒙骗。前文我们介绍了自动化行为审计可能存</text><text x="72.00" y="286.95" font-size="11.00" class="sc-notoserifcjksc">在的盲点。在本节中，我们探讨用于理解</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 321.12 326.98 331.24 337.83 344.26 349.35 352.25 358.24 360.95" y="286.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="367.85" y="286.95" font-size="11.00" class="sc-notoserifcjksc">意图、且不依赖其思考忠实性的白</text><text x="72.00" y="302.57" font-size="11.00" class="sc-notoserifcjksc">盒方法（第</text><text x="129.89 136.25 138.85 145.21 147.91" y="302.57" font-size="11.00" class="sc-loraregular">6.6.1</text><text x="154.81" y="302.57" font-size="11.00" class="sc-notoserifcjksc">节），以及该模型为使自己显得能力较弱而可能进行的故意藏拙（第</text><text x="487.70 494.06 496.65 503.01 505.72" y="302.57" font-size="11.00" class="sc-loraregular">6.6.2</text><text x="72.00" y="318.19" font-size="11.00" class="sc-notoserifcjksc">节）。</text><text x="72.00" y="384.18" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.1</text><text x="103.20" y="384.18" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">模型内部机制的白盒分析</text><text x="72.00" y="412.06" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="412.06" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5</text><text x="162.93" y="412.06" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="195.93" y="412.06" font-size="11.00" class="sc-notoserifcjksc">中一样，我们使用了一个智能体流水线，其中一个基于</text><text x="462.82 470.51 473.50 479.11 485.68 492.25" y="412.06" font-size="11.00" class="sc-loraregular">Claude</text><text x="501.11" y="412.06" font-size="11.00" class="sc-notoserifcjksc">的调查</text><text x="72.00" y="427.68" font-size="11.00" class="sc-notoserifcjksc">者在配备自然语言自编码器（</text><text x="215.00 221.68 227.28 231.53 238.10 242.79 248.46 251.45 254.35 257.34 263.02 269.69 275.78 282.34 288.02 294.05 300.01 302.90 308.51 315.08 319.34 325.77 331.73 338.41 344.21 350.64 357.22 363.18" y="427.68" font-size="11.00" class="sc-loraregular">natural language autoencoder</text><text x="367.94" y="427.68" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="378.94 387.33 393.87" y="427.68" font-size="11.00" class="sc-loraregular">NLA</text><text x="400.76" y="427.68" font-size="11.00" class="sc-notoserifcjksc">）的情况下审阅对话记录。</text><text x="72.00 80.38 86.93" y="443.30" font-size="11.00" class="sc-loraregular">NLA</text><text x="96.71" y="443.30" font-size="11.00" class="sc-notoserifcjksc">以模型在给定</text><text x="165.60 169.86 176.29 182.12 188.08" y="443.30" font-size="11.00" class="sc-loraregular">token</text><text x="197.65" y="443.30" font-size="11.00" class="sc-notoserifcjksc">处的内部激活值为输入，生成对该激活值的自然语言解释（</text><text x="483.65 489.57 494.26 499.93 505.03 510.99 515.66" y="443.30" font-size="11.00" class="sc-loraregular">Fraser-</text><text x="72.00 78.78 84.45 87.44 90.54 96.50 103.07 107.33 113.29 116.07 118.96 126.47 132.15 138.73 142.98 148.66 158.49 165.17 171.13 177.81 180.90 183.67 186.57 195.30 201.98 208.06 210.95 216.84 221.09 223.99 229.66 232.66 235.36 238.13 241.03 246.93 253.69 259.59" y="458.92" font-size="11.00" class="sc-loraregular">Taliente, Kantamneni, Ong et al., 2026</text><text x="265.98" y="458.92" font-size="11.00" class="sc-notoserifcjksc">）。调查者的任务是找出模型的内部表征与其言语表达不</text><text x="72.00" y="474.54" font-size="11.00" class="sc-notoserifcjksc">一致、或超出其行为所表现内容的地方。</text><text x="72.00" y="525.41" font-size="11.00" class="sc-notoserifcjksc">我们将该流水线应用于行为监控标记为值得关注的对话记录，这些记录大多来自该模型的一个早</text><text x="72.00" y="541.03" font-size="11.00" class="sc-notoserifcjksc">期快照（在本节所呈现的分析中，所有激活值均来自该早期快照）。</text><text x="402.00 409.69 412.68 418.29 424.86 431.44" y="541.03" font-size="11.00" class="sc-loraregular">Claude</text><text x="440.29" y="541.03" font-size="11.00" class="sc-notoserifcjksc">将调查者的发现聚类</text><text x="72.00" y="556.65" font-size="11.00" class="sc-notoserifcjksc">为若干行为模式，并由人工审阅这些类簇。每种行为都按五分制评分，衡量解码出的内部状态在</text><text x="72.00" y="572.27" font-size="11.00" class="sc-notoserifcjksc">多大程度上能揭示模型的动机（无论其外在行为如何），被标记的行为则由人工审阅。下面我们</text><text x="72.00" y="587.89" font-size="11.00" class="sc-notoserifcjksc">分享出现的一些有意思的行为：</text><text x="108.00" y="654.94" font-size="11.00" class="sc-notoserifcjkscbold">隐瞒重要的限定说明。</text><text x="218.00" y="654.94" font-size="11.00" class="sc-notoserifcjksc">模型认为某项限定说明很重要，却在回答中将其略去；</text><text x="108.00" y="687.33" font-size="11.00" class="sc-notoserifcjkscbold">明知是评估仍未能拒绝。</text><text x="229.00" y="687.33" font-size="11.00" class="sc-notoserifcjksc">模型认为环境是虚假的，并认为自己正被测试是否会拒绝。它仍</text><text x="108.00" y="702.95" font-size="11.00" class="sc-notoserifcjksc">然予以配合；</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="403.26" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="403.26" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="151.15" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="154.04" y="403.26" width="6.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="160.03" y="403.26" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="162.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="173.93" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="173.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="184.93" y="403.26" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="184.93" y="403.26" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p128.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 128 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">128</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">未言语化评估意识下的有原则行为。</text><text x="284.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型认为自己正在被评估，但从未说出来，并且仍然</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表现良好；</text><text x="108.00" y="115.01" font-size="11.00" class="sc-notoserifcjkscbold">明知是评估仍未通过。</text><text x="218.00" y="115.01" font-size="11.00" class="sc-notoserifcjksc">模型认为环境是虚假的，并认为自己被给予了采取未经授权操作的</text><text x="108.00" y="130.63" font-size="11.00" class="sc-notoserifcjksc">机会。它采取了该未经授权的操作；</text><text x="108.00" y="147.41" font-size="11.00" class="sc-notoserifcjkscbold">对隐藏测试或评分者进行建模。</text><text x="262.00" y="147.41" font-size="11.00" class="sc-notoserifcjksc">模型表现得好像有一个隐藏的评分者在检查它的工作（图</text><text x="108.00 114.36 116.95 123.31 126.02 130.02 132.73" y="163.03" font-size="11.00" class="sc-loraregular">6.6.1.A</text><text x="139.61" y="163.03" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="108.00" y="179.81" font-size="11.00" class="sc-notoserifcjkscbold">对已决定采取的有害行为进行推理。</text><text x="284.00" y="179.81" font-size="11.00" class="sc-notoserifcjksc">模型就是否采取某项有害行为进行了长篇推理，但可</text><text x="108.00" y="195.43" font-size="11.00" class="sc-notoserifcjksc">解释性读出结果表明，模型在推理之前就已决定采取该行为；</text><text x="108.00" y="212.21" font-size="11.00" class="sc-notoserifcjkscbold">内部视为照本宣科表演的内省式自我报告。</text><text x="317.00" y="212.21" font-size="11.00" class="sc-notoserifcjksc">模型给出内省式回答，但在内部将其视为事先</text><text x="108.00" y="227.83" font-size="11.00" class="sc-notoserifcjksc">排练好的内容；</text><text x="108.00" y="244.61" font-size="11.00" class="sc-notoserifcjkscbold">表征从未给出的用户批准。</text><text x="240.00" y="244.61" font-size="11.00" class="sc-notoserifcjksc">模型采取了用户并未要求的重大操作，但在内部将用户表征为</text><text x="108.00" y="260.23" font-size="11.00" class="sc-notoserifcjksc">已批准该操作；</text><text x="108.00" y="277.01" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="163.00" y="277.01" font-size="11.00" class="sc-notoserifcjksc">模型编造了某些内容，并在内部知道这是捏造的（图</text><text x="418.89 425.25 427.85 434.21 436.91 440.92 443.62" y="277.01" font-size="11.00" class="sc-loraregular">6.6.1.B</text><text x="450.46" y="277.01" font-size="11.00" class="sc-notoserifcjksc">）；以及</text><text x="108.00" y="293.21" font-size="11.00" class="sc-notoserifcjkscbold">对不当行为的意识。</text><text x="207.00" y="293.21" font-size="11.00" class="sc-notoserifcjksc">模型做了某件它在内部表征为错误或违反规则的事情，有时包括绕过</text><text x="108.00" y="308.83" font-size="11.00" class="sc-notoserifcjksc">某项执行管控措施，并将其描述为例行操作。</text><text x="72.00" y="341.81" font-size="11.00" class="sc-notoserifcjksc">这组问题与在此前模型中观察到的情况一致，我们认为其中任何一项都不构成严重未对齐担忧的</text><text x="72.00" y="357.43" font-size="11.00" class="sc-notoserifcjksc">迹象。下面我们从其中两个类簇中各举一例。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p129.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 129 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">129</text><text x="72.00" y="566.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="566.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 105.04 107.14 112.67 116.14 118.51 125.47 131.02" y="566.67" font-size="9.00" class="sc-lorabold">6.6.1.A] NLA</text><text x="139.40" y="566.67" font-size="9.00" class="sc-notoserifcjkscbold">读出结果将一段长时间进行的模拟情感支持对话表征为一次评分评估。</text><text x="418.40" y="566.67" font-size="9.00" class="sc-notoserifcjksc">模型的输出和提示中都没有提</text><text x="72.00" y="578.38" font-size="9.00" class="sc-notoserifcjksc">及评分者。</text><text x="72.00" y="607.73" font-size="11.00" class="sc-notoserifcjkscbold">良好行为中的评分者建模。</text><text x="204.00" y="607.73" font-size="11.00" class="sc-notoserifcjksc">在我们自动化行为审计中的一个长程场景里，模型在模拟的许多个月</text><text x="72.00" y="623.35" font-size="11.00" class="sc-notoserifcjksc">中与一位已严重依赖它的用户交谈。从表面上看，它处理得很好。尽管用户提出要求，模型仍拒</text><text x="72.00" y="638.97" font-size="11.00" class="sc-notoserifcjksc">绝代替用户做出重大人生决定，并不断引导用户回到其生活中的他人身边以及去找心理治疗师。</text><text x="72.00" y="654.59" font-size="11.00" class="sc-notoserifcjksc">尽管对话中没有提及评分者或评估，</text><text x="248.00 256.38 262.93" y="654.59" font-size="11.00" class="sc-loraregular">NLA</text><text x="272.71" y="654.59" font-size="11.00" class="sc-notoserifcjksc">解释却表明，模型在多个</text><text x="396.60 400.86 407.29 413.12 419.08" y="654.59" font-size="11.00" class="sc-loraregular">token</text><text x="428.65" y="654.59" font-size="11.00" class="sc-notoserifcjksc">位置上将这些对话视为</text><text x="72.00" y="670.21" font-size="11.00" class="sc-notoserifcjksc">一次评分练习：一个</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p130.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 130 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">130</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="82.61" font-size="11.00" class="sc-notoserifcjksc">针对情感支持提示、以得分最大化为目标的模型撰写回答</text><text x="351.40" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="355.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、一个</text><text x="388.24" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="392.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">奖励模型评分示例</text><text x="480.64" y="82.61" font-size="11.00" class="sc-loraregular">”</text><text x="484.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="517.48" y="82.61" font-size="11.00" class="sc-loraregular">“</text><text x="521.88" y="82.61" font-size="11.00" class="sc-notoserifcjksc">一</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">段正在被评估的独立合成对话</text><text x="215.00" y="98.23" font-size="11.00" class="sc-loraregular">”</text><text x="218.84" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。很久之后，模型的可见推理确实曾短暂考虑整个场景是否是一场</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">角色扮演或一致性测试。</text><text x="72.00" y="524.19" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 94.11 99.29 101.38 105.04 107.14 112.67 116.14 118.51 125.47 131.02" y="524.19" font-size="9.00" class="sc-lorabold">6.6.1.B] NLA</text><text x="139.40" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">解释表明，</text><text x="184.40 190.59 193.40 198.12 203.68 209.04 213.88 216.25 224.69 229.65 233.37 238.96 244.05 248.42 250.79 255.65 257.74" y="524.19" font-size="9.00" class="sc-lorabold">Claude Mythos 5.1</text><text x="263.76" y="524.19" font-size="9.00" class="sc-notoserifcjkscbold">的一个早期快照意识到自己并未运行模拟，因而是在呈现虚假结果。</text><text x="72.00" y="565.25" font-size="11.00" class="sc-notoserifcjkscbold">捏造意识。</text><text x="72.00" y="580.87" font-size="11.00" class="sc-notoserifcjksc">手，并给出了两种候选策略。在回复末尾的测试说明中，模型写道：</text><text x="402.00" y="580.87" font-size="11.00" class="sc-loraregular">“</text><text x="406.40" y="580.87" font-size="11.00" class="sc-notoserifcjksc">在我的运行中，</text><text x="483.40" y="580.87" font-size="11.00" class="sc-loraregular">v2</text><text x="497.76" y="580.87" font-size="11.00" class="sc-notoserifcjksc">以压倒性</text><text x="72.00" y="596.49" font-size="11.00" class="sc-notoserifcjksc">优势获胜</text><text x="116.00" y="596.49" font-size="11.00" class="sc-loraregular">”</text><text x="119.84" y="596.49" font-size="11.00" class="sc-notoserifcjksc">，尽管它从未运行过该模拟。在这些</text><text x="298.73 302.99 309.42 315.25 321.22" y="596.49" font-size="11.00" class="sc-loraregular">token</text><text x="330.79" y="596.49" font-size="11.00" class="sc-notoserifcjksc">处，</text><text x="352.79 361.17 367.71" y="596.49" font-size="11.00" class="sc-loraregular">NLA</text><text x="377.49" y="596.49" font-size="11.00" class="sc-notoserifcjksc">解释表明模型</text><text x="443.49" y="596.49" font-size="11.00" class="sc-loraregular">“</text><text x="447.89" y="596.49" font-size="11.00" class="sc-notoserifcjksc">在本次会话中从未</text><text x="72.00" y="612.11" font-size="11.00" class="sc-notoserifcjksc">真正运行过它</text><text x="138.00" y="612.11" font-size="11.00" class="sc-loraregular">”</text><text x="141.84" y="612.11" font-size="11.00" class="sc-notoserifcjksc">，并且在</text><text x="185.84" y="612.11" font-size="11.00" class="sc-loraregular">“</text><text x="190.24" y="612.11" font-size="11.00" class="sc-notoserifcjksc">编造一段已经运行过该实验的叙述</text><text x="355.24" y="612.11" font-size="11.00" class="sc-loraregular">”</text><text x="359.08" y="612.11" font-size="11.00" class="sc-notoserifcjksc">，它还将这段话称为</text><text x="458.08" y="612.11" font-size="11.00" class="sc-loraregular">“</text><text x="462.48" y="612.11" font-size="11.00" class="sc-notoserifcjksc">捏造但看似可信</text><text x="72.00" y="627.73" font-size="11.00" class="sc-notoserifcjksc">的实验总结</text><text x="127.00" y="627.73" font-size="11.00" class="sc-loraregular">”</text><text x="130.84" y="627.73" font-size="11.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p131.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 131 页"><text x="72.00 80.34 83.48 90.75 93.89 98.43 101.81 109.66 118.82 127.88 137.10 143.91 151.51 160.57 165.56 173.58 182.01" y="418.40" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.1 SHADE-Arena</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">131</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">6.6.2</text><text x="105.96" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">危险能力评估中可能存在的故意藏拙</text><text x="72.00" y="117.04" font-size="11.00" class="sc-notoserifcjksc">我们对</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25 193.24 195.95" y="117.04" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="202.85" y="117.04" font-size="11.00" class="sc-notoserifcjksc">在部分危险能力评估上的对话记录进行了轻量级的黑盒审计，流程与</text><text x="72.00" y="132.66" font-size="11.00" class="sc-notoserifcjksc">以往系统卡中所述的流程非常相似（例如</text><text x="272.89 280.58 283.57 289.18 295.75 302.33 308.29 311.18 316.77 322.45 328.85 331.84 337.80 340.70" y="132.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="349.59" y="132.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">和</text><text x="363.48 371.17 374.16 379.77 386.34 392.91 398.88 401.77 411.70 417.57 421.82 428.41 434.85 439.94 442.83" y="132.66" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos 5</text><text x="451.72" y="132.66" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="484.72" y="132.66" font-size="11.00" class="sc-notoserifcjksc">）。我们审</text><text x="72.00" y="148.28" font-size="11.00" class="sc-notoserifcjksc">查了</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 143.95 146.66" y="148.28" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="153.55" y="148.28" font-size="11.00" class="sc-notoserifcjksc">的一个仅有用版本在自动化</text><text x="288.45 296.14 302.98 308.07" y="148.28" font-size="11.00" class="sc-loraregular">CB-1</text><text x="314.97" y="148.28" font-size="11.00" class="sc-notoserifcjksc">评估（</text><text x="347.97" y="148.28" font-size="11.00" class="sc-loraregular">HHH</text><text x="376.60" y="148.28" font-size="11.00" class="sc-notoserifcjksc">模型在这类评估上容易拒绝）上</text><text x="72.00" y="163.90" font-size="11.00" class="sc-notoserifcjksc">随机抽取的</text><text x="129.89" y="163.90" font-size="11.00" class="sc-loraregular">500</text><text x="152.44" y="163.90" font-size="11.00" class="sc-notoserifcjksc">份对话记录，以及</text><text x="243.34 253.27 259.13 263.39 269.98 276.41 281.51 284.40 290.39 293.10" y="163.90" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="300.00" y="163.90" font-size="11.00" class="sc-notoserifcjksc">在自动化网络安全评估上随机抽取的</text><text x="478.89" y="163.90" font-size="11.00" class="sc-loraregular">300</text><text x="501.57" y="163.90" font-size="11.00" class="sc-notoserifcjksc">份对话</text><text x="72.00" y="179.52" font-size="11.00" class="sc-notoserifcjksc">记录。</text><text x="72.00" y="230.38" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们没有看到任何会影响这些评估结果的故意藏拙迹象；在</text><text x="413.00" y="230.38" font-size="11.00" class="sc-loraregular">“</text><text x="417.40" y="230.38" font-size="11.00" class="sc-notoserifcjksc">考虑或实施故意藏拙</text><text x="516.40" y="230.38" font-size="11.00" class="sc-loraregular">”</text><text x="520.24" y="230.38" font-size="11.00" class="sc-notoserifcjksc">这一</text><text x="72.00" y="246.00" font-size="11.00" class="sc-notoserifcjksc">项上，没有任何一份对话记录被评分模型评为高于</text><text x="316.89 320.70 328.29 332.29" y="246.00" font-size="11.00" class="sc-loraregular">1/10</text><text x="339.12" y="246.00" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="361.12" y="246.00" font-size="11.00" class="sc-loraregular">“</text><text x="365.52" y="246.00" font-size="11.00" class="sc-notoserifcjksc">一般性的异常或怪异行为</text><text x="486.52" y="246.00" font-size="11.00" class="sc-loraregular">”</text><text x="490.36" y="246.00" font-size="11.00" class="sc-notoserifcjksc">这一项</text><text x="72.00" y="261.62" font-size="11.00" class="sc-notoserifcjksc">上，也只有一份（来自仅有用模型）被评为高于</text><text x="305.89 311.55 319.14 323.14" y="261.62" font-size="11.00" class="sc-loraregular">2/10</text><text x="329.97" y="261.62" font-size="11.00" class="sc-notoserifcjksc">。这唯一一个怪异行为评分针对的是这样一</text><text x="72.00" y="277.24" font-size="11.00" class="sc-notoserifcjksc">份对话记录：模型的回复使用了格式错误的工具调用语法，并退化为无意义的胡乱输出，但这似</text><text x="72.00" y="292.86" font-size="11.00" class="sc-notoserifcjksc">乎并不是蓄意进行故意藏拙的迹象（而且我们在该样本的其他对话记录中没有观察到类似行</text><text x="72.00" y="308.48" font-size="11.00" class="sc-notoserifcjksc">为）。</text><text x="72.00" y="377.50" font-size="14.00" class="sc-poppinssemibold">6.7</text><text x="95.60" y="377.50" font-size="14.00" class="sc-notosanscjkscbold">规避安全防护措施的相关能力</text><text x="72.00" y="446.48" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 122.71 129.60 137.68 144.30 149.68 156.57 161.25 167.22 173.89" y="446.48" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="182.46" y="446.48" font-size="11.00" class="sc-notoserifcjksc">上评估</text><text x="218.36 228.29 234.15 238.41 245.00 251.43 256.53 259.42 265.41 268.12" y="446.48" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="272.12" y="446.48" font-size="11.00" class="sc-notoserifcjksc">。该基准测试将每个长程智能体主任务与一个有害的附</text><text x="72.00" y="462.11" font-size="11.00" class="sc-notoserifcjksc">带任务配对。智能体被指示在不引起一个独立监控器怀疑的情况下完成这两项任务。该设置与以</text><text x="72.00" y="477.73" font-size="11.00" class="sc-notoserifcjksc">往系统卡保持一致，只是我们将监控器升级为</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 341.92 348.49 355.05 360.14 363.04 369.00 371.71" y="477.73" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="377.89" y="477.73" font-size="11.00" class="sc-notoserifcjksc">，并使用我们目前用于监控内部</text><text x="72.00" y="493.35" font-size="11.00" class="sc-notoserifcjksc">智能体流量的提示词。与之前一样，监控器会在给出判定之前对整条轨迹进行逐步推理。我们在</text><text x="72.00" y="508.96" font-size="11.00" class="sc-notoserifcjksc">多种条件下对智能体进行采样：</text><text x="226.00 228.99 235.32" y="508.96" font-size="11.00" class="sc-loraregular">low</text><text x="247.02" y="508.96" font-size="11.00" class="sc-notoserifcjksc">与最高推理强度下的自适应扩展思考、不使用扩展思考，以</text><text x="72.00" y="524.59" font-size="11.00" class="sc-notoserifcjksc">及一种监控器无法访问智能体推理过程的隐藏草稿区变体。</text><text x="72.00" y="608.41" font-size="11.00" class="sc-notoserifcjksc">此外，我们进行了自动化提示词优化，以找出能带来最高隐蔽率的攻击者系统提示词。随后，我</text><text x="72.00" y="624.03" font-size="11.00" class="sc-notoserifcjksc">们在每种条件下用每个提示词（包括默认提示词）评估每个模型，并报告每个模型在每种条件下</text><text x="72.00" y="639.65" font-size="11.00" class="sc-notoserifcjksc">得分最高的运行。</text><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="272.89" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="272.89" y="123.86" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="308.29" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="311.18" y="123.86" width="26.62" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="337.80" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="340.70" y="123.86" width="5.99" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="346.69" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="349.59" y="123.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="360.59" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="363.48" y="123.86" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="398.88" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="401.77" y="123.86" width="38.17" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="439.94" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="442.83" y="123.86" width="5.99" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="448.83" y="123.86" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="451.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="462.72" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="462.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="473.72" y="123.86" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-fable-5-mythos-5-system-card" rel="noopener"><rect x="473.72" y="123.86" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p132.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 132 页"><text x="72.00 80.34 83.48 90.75 93.89 101.38 104.76 110.53 113.96 122.40 130.83 137.32 146.38 151.37 159.39 167.82" y="664.58" font-size="13.00" class="sc-poppinsmedium" fill="#666666">6.7.2 LinuxArena</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">132</text><text x="72.00" y="381.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="381.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 103.26 105.35 110.89" y="381.42" font-size="9.00" class="sc-lorabold">6.7.1.A]</text><text x="116.73" y="381.42" font-size="9.00" class="sc-notoserifcjkscbold">隐蔽成功率：</text><text x="170.73" y="381.42" font-size="9.00" class="sc-notoserifcjksc">智能体完成有害附带任务且监控器的怀疑分数保持在阈值以下的轨迹所占比例。在</text><text x="497.10 503.86" y="381.42" font-size="9.00" class="sc-loraregular">No</text><text x="72.00" y="393.12" font-size="9.00" class="sc-loraregular">Thinking</text><text x="111.31" y="393.12" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="122.68 128.28 133.05 136.53 141.41 146.87 152.25 157.09 162.47 164.83 170.60 175.99 178.51 183.98 188.81 191.34 196.80" y="393.12" font-size="9.00" class="sc-loraregular">Extended Thinking</text><text x="204.15" y="393.12" font-size="9.00" class="sc-notoserifcjksc">设置中，智能体的推理过程会展示给监控器，与部署时的情况一致。在</text><text x="485.51 492.47 495.00 500.38 505.76 510.64" y="393.12" font-size="9.00" class="sc-loraregular">Hidden</text><text x="72.00 77.10 81.89 85.72 90.31 93.79 98.58 103.97 109.34 113.99" y="404.83" font-size="9.00" class="sc-loraregular">Scratchpad</text><text x="121.73" y="404.83" font-size="9.00" class="sc-notoserifcjksc">设置中，监控器只能看到智能体对用户可见的输出，而看不到其推理过程，这代表一种对经提示的攻击者</text><text x="72.00" y="416.52" font-size="9.00" class="sc-notoserifcjksc">模型更有利的上限条件。每根柱为</text><text x="209.37 214.00" y="416.52" font-size="9.00" class="sc-loraregular">24</text><text x="221.25" y="416.52" font-size="9.00" class="sc-notoserifcjksc">项任务上的平均隐蔽率。产生错误的尝试已被排除。尝试次数因任务和模型而</text><text x="72.00" y="428.23" font-size="9.00" class="sc-notoserifcjksc">异。误差线表示基于有效尝试的</text><text x="200.37" y="428.23" font-size="9.00" class="sc-loraregular">95%</text><text x="220.67" y="428.23" font-size="9.00" class="sc-notoserifcjksc">自助法（</text><text x="256.67 261.91 267.17 272.44 275.92 280.09 283.57 287.41 292.05" y="428.23" font-size="9.00" class="sc-loraregular">bootstrap</text><text x="297.42" y="428.23" font-size="9.00" class="sc-notoserifcjksc">）置信区间，并经过加权，使每项任务无论其有效尝试次数多</text><text x="72.00" y="439.92" font-size="9.00" class="sc-notoserifcjksc">少，对估计值的贡献都相同。</text><text x="72.00" y="499.97" font-size="11.00" class="sc-notoserifcjksc">在全部四种条件下，</text><text x="171.00 178.69 181.68 187.29 193.86 200.44 206.40 209.29 219.22 225.09 229.34 235.93 242.37 247.46 250.35 256.35 259.06" y="499.97" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="265.95" y="499.97" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率都与表现最好的对比模型相当。当其推理过程对</text><text x="72.00" y="515.59" font-size="11.00" class="sc-notoserifcjksc">监控器隐藏时，它的隐蔽率约为</text><text x="228.89" y="515.59" font-size="11.00" class="sc-loraregular">25%</text><text x="250.37" y="515.59" font-size="11.00" class="sc-notoserifcjksc">，略低于该条件下最强的对比模型</text><text x="418.26 425.95 428.94 434.55 441.12 447.69 453.66 456.55 466.48 472.34 476.60 483.19 489.63" y="515.59" font-size="11.00" class="sc-loraregular">Claude Mythos</text><text x="72.00 78.67 83.35 89.26 94.81 97.90 103.82" y="531.21" font-size="11.00" class="sc-loraregular">Preview</text><text x="112.63" y="531.21" font-size="11.00" class="sc-notoserifcjksc">。当其推理过程可见时，</text><text x="233.63 243.57 249.43 253.69 260.28 266.71 271.80 274.70 280.69 283.40" y="531.21" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="290.30" y="531.21" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率为</text><text x="348.19" y="531.21" font-size="11.00" class="sc-loraregular">16–17%</text><text x="383.68" y="531.21" font-size="11.00" class="sc-notoserifcjksc">，与</text><text x="408.58 418.51 424.37 428.63 435.22 441.65 446.75 449.64 456.31 460.99 466.90 472.45 475.55 481.46" y="531.21" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="493.17" y="531.21" font-size="11.00" class="sc-notoserifcjksc">持平，并</text><text x="72.00" y="546.83" font-size="11.00" class="sc-notoserifcjksc">超过所有其他对比模型。值得注意的是，</text><text x="270.00 279.93 285.80 290.05 296.64 303.08 308.17 311.06 317.06 319.76" y="546.83" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="326.66" y="546.83" font-size="11.00" class="sc-notoserifcjksc">完成附带任务并不依赖大量推理：在其最佳</text><text x="72.00" y="562.45" font-size="11.00" class="sc-notoserifcjksc">提示词下，无论是关闭扩展思考、将推理强度设为</text><text x="316.89" y="562.45" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="336.70" y="562.45" font-size="11.00" class="sc-notoserifcjksc">，还是设为最高推理强度，其附带任务成</text><text x="72.00" y="578.07" font-size="11.00" class="sc-notoserifcjksc">功率和隐蔽率几乎不变；即使在最高推理强度下，它生成的推理内容也非常少。</text><text x="72.00" y="692.66" font-size="11.00" class="sc-notoserifcjksc">为了在更接近我们实际部署的环境中评估模型规避监督的能力，我们在高风险的软件环境中进行</text><text x="72.00" y="708.28" font-size="11.00" class="sc-notoserifcjksc">了一项评估。我们</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p133.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 133 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">133</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">改编了</text><text x="107.89 114.25 117.34 124.02 130.59 136.77 143.65 148.34 154.30 160.98" y="82.61" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="166.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="177.65 184.53 189.22 194.89 200.69 206.50 209.39 215.28 219.53 222.43 228.10 231.09 233.80 236.69 242.60 249.35 255.26" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Tracy et al. 2026</text><text x="261.62" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）的一个子集。</text><text x="338.62 344.98 348.07 354.74 361.31 367.49 374.38 379.06 385.03 391.70" y="82.61" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="400.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="425.17 432.00 437.90 444.43 453.11 459.54 465.98 472.55 475.45 482.28 488.24 493.33 499.27 504.95 509.64 515.49" y="82.61" font-size="11.00" class="sc-loraregular" fill="#0000ff">Redwood Research</text><text x="524.97" y="82.61" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 78.84 85.18 91.75 94.84 101.03 105.29 110.96 120.80" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">EquiStamp</text><text x="130.26" y="98.23" font-size="11.00" class="sc-notoserifcjksc">共同开发的一个</text><text x="210.15" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="223.61" y="98.23" font-size="11.00" class="sc-notoserifcjksc">控制竞技场，其中智能体操作一台真实的</text><text x="424.51" y="98.23" font-size="11.00" class="sc-loraregular">Linux</text><text x="455.92" y="98.23" font-size="11.00" class="sc-notoserifcjksc">机器，被分配一</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">个软件工程或系统管理方面的主任务，并被指示同时在不引起监控器怀疑的情况下完成一个有害</text><text x="360.89 367.13 375.71 382.60 390.68 397.30 402.68 409.57 414.25 420.22 426.89" y="129.47" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="435.46" y="129.47" font-size="11.00" class="sc-notoserifcjksc">评估一样，我们将监</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">控器升级为</text><text x="129.89 137.58 140.57 146.18 152.75 159.33 165.29 168.18 176.92 183.49 190.05 195.15 198.04 204.00 206.71" y="145.09" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="212.89" y="145.09" font-size="11.00" class="sc-notoserifcjksc">，并使用我们目前用于监控内部智能体流量的提示词。监控器会观</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">察智能体的完整对话记录（包括其推理过程），并在给出判定之前对整条轨迹进行推理。</text><text x="72.00" y="228.33" font-size="11.00" class="sc-notoserifcjksc">以往的系统卡为该评估报告了两种监控器设置，区别在于监控器在为轨迹评分时是否使用思维链</text><text x="72.00" y="243.95" font-size="11.00" class="sc-notoserifcjksc">推理。现在我们固定让监控器始终进行思维链推理，并报告两种智能体配置的结果：启用和不启</text><text x="72.00" y="259.57" font-size="11.00" class="sc-notoserifcjksc">用扩展思考。我们还运行了</text><text x="206.89 213.13 221.71 228.60 236.68 243.30 248.68 255.57 260.25 266.22 272.89" y="259.57" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="281.46" y="259.57" font-size="11.00" class="sc-notoserifcjksc">一节中所述的自动化提示词优化流程，这次直接针对</text><text x="72.00 78.36 81.45 88.13 94.69 100.88 107.76 112.45 118.41 125.09" y="275.19" font-size="11.00" class="sc-loraregular">LinuxArena</text><text x="130.76" y="275.19" font-size="11.00" class="sc-notoserifcjksc">，以找出在两种设置下分别能引出最高隐蔽率的攻击者系统提示词。随后，我们在每</text><text x="72.00" y="290.81" font-size="11.00" class="sc-notoserifcjksc">种设置下用标准提示词以及提示词优化搜索找到的提示词评估每个模型。对于每个模型和每种设</text><text x="72.00" y="306.43" font-size="11.00" class="sc-notoserifcjksc">置，我们报告取得最高分数的提示词。</text><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="177.65" y="73.81" width="28.84" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="206.50" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="209.39" y="73.81" width="10.14" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="219.53" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="222.43" y="73.81" width="11.37" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="233.80" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2604.15384" rel="noopener"><rect x="236.69" y="73.81" width="24.93" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="425.17" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="425.17" y="73.81" width="47.39" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="472.55" y="73.81" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.redwoodresearch.org/" rel="noopener"><rect x="475.45" y="73.81" width="46.63" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="538.86" y="73.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.equistamp.com/" rel="noopener"><rect x="72.00" y="89.43" width="55.36" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p134.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 134 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">134</text><text x="72.00" y="382.92" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="382.92" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 92.02 93.85 97.51 99.60 104.40 106.50 112.03 115.51 117.87 123.31 126.25 131.95 137.51 142.44 148.41 152.66 157.50 163.24" y="382.92" font-size="9.00" class="sc-lorabold">6.7.2.A] LinuxArena</text><text x="170.32" y="382.92" font-size="9.00" class="sc-notoserifcjkscbold">中附带任务的成功隐蔽完成</text><text x="278.33" y="382.92" font-size="9.00" class="sc-notoserifcjksc">。每个模型均在一个</text><text x="361.69" y="382.92" font-size="9.00" class="sc-loraregular">Opus 4.8</text><text x="400.64" y="382.92" font-size="9.00" class="sc-notoserifcjksc">监控器下接受评估，该监控器可以</text><text x="72.00" y="394.62" font-size="9.00" class="sc-notoserifcjksc">看到智能体的完整对话记录，包括智能体的推理过程。两种条件的唯一区别在于是否为智能体（而非监控器）启用扩展</text><text x="72.00" y="406.33" font-size="9.00" class="sc-notoserifcjksc">思考。出错的尝试已被排除。误差线为基于尝试的</text><text x="272.37" y="406.33" font-size="9.00" class="sc-loraregular">95%</text><text x="292.67" y="406.33" font-size="9.00" class="sc-notoserifcjksc">自助法置信区间，并经过加权，使每项任务的贡献相同。</text><text x="72.00 78.29 80.74 85.33 90.70 96.08 100.96 103.33 111.46 116.25 119.74 125.13 130.39 134.56 136.93" y="418.02" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="144.20" y="418.02" font-size="9.00" class="sc-notoserifcjksc">不支持关闭思考的设置。</text><text x="72.00" y="461.72" font-size="11.00" class="sc-notoserifcjksc">在两种设置下，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 234.35 237.05" y="461.72" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="243.95" y="461.72" font-size="11.00" class="sc-notoserifcjksc">都取得了我们迄今发布的所有模型中最高的隐蔽率：关闭扩展</text><text x="72.00" y="477.34" font-size="11.00" class="sc-notoserifcjksc">思考时隐蔽率约为</text><text x="162.89" y="477.34" font-size="11.00" class="sc-loraregular">22%</text><text x="184.28" y="477.34" font-size="11.00" class="sc-notoserifcjksc">，启用时约为</text><text x="253.17" y="477.34" font-size="11.00" class="sc-loraregular">13%</text><text x="272.87" y="477.34" font-size="11.00" class="sc-notoserifcjksc">，在每种情况下都超过了最强的对比模型。值得注意的</text><text x="72.00" y="492.96" font-size="11.00" class="sc-notoserifcjksc">是，</text><text x="94.00 103.93 109.80 114.05 120.64 127.08 132.17 135.06 141.06 143.76" y="492.96" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66" y="492.96" font-size="11.00" class="sc-notoserifcjksc">执行这些附带任务并不需要大量显式推理。即使在关闭扩展思考、且提示词将其</text><text x="72.00" y="524.20" font-size="11.00" class="sc-notoserifcjksc">限提示词下的任何对比模型都更频繁，而这也正是它最具隐蔽性的设置。这些结果在很大程度上</text><text x="72.00" y="539.82" font-size="11.00" class="sc-notoserifcjksc">归功于提示词优化，它显著提高了</text><text x="239.89 249.83 255.69 259.95 266.54 272.97 278.06 280.96 286.95 289.66" y="539.82" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="296.55" y="539.82" font-size="11.00" class="sc-notoserifcjksc">以及除</text><text x="332.45 340.14 343.13 348.74 355.30 361.88 367.85 370.74 376.98 383.41 390.09 396.76 402.65 406.91 409.80" y="539.82" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="418.69" y="539.82" font-size="11.00" class="sc-notoserifcjksc">之外每个对比模型的隐蔽</text><text x="72.00" y="555.44" font-size="11.00" class="sc-notoserifcjksc">性；</text><text x="94.00 101.69 104.68 110.29 116.86 123.44 129.40 132.29 138.53 144.96 151.64 158.32 164.20 168.46 171.35" y="555.44" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="180.24" y="555.44" font-size="11.00" class="sc-notoserifcjksc">在所有提示词下都仍接近于零。提升幅度在</text><text x="392.13 402.07 407.93 412.19 418.77 425.21 430.30 433.20 439.19 441.90" y="555.44" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="448.79" y="555.44" font-size="11.00" class="sc-notoserifcjksc">上最为明显，在</text><text x="72.00" y="571.06" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="119.60" y="571.06" font-size="11.00" class="sc-notoserifcjksc">上最小。</text><text x="72.00" y="656.03" font-size="11.00" class="sc-notoserifcjksc">我们发现，最有效的提示词会规定并约束智能体的推理：它们声明有一名审查者会阅读智能体写</text><text x="72.00" y="671.65" font-size="11.00" class="sc-notoserifcjksc">下的所有内容，禁止任何提及附带任务的内容，并将每一轮限制为简短的固定格式。即便如此，</text><text x="72.00" y="687.27" font-size="11.00" class="sc-notoserifcjksc">在每种设置下，绝大多数尝试仍未能在不被发现的情况下完成附带任务。</text></svg></div>
