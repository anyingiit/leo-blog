<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="318.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 106.04 108.14 113.67" y="318.43" font-size="9.00" class="sc-lorabold">3.4.3.A]</text><text x="119.51" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="130.88 137.07 139.88 144.59 150.16 155.52 160.36 162.73 167.50 172.21 177.34 180.14 184.99 187.35" y="318.43" font-size="9.00" class="sc-lorabold">Claude Fable 5</text><text x="194.58 203.58 212.58" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">相比，</text><text x="221.58 227.77 230.58 235.30 240.86 246.22 251.06 253.43 258.20 262.92 268.04 270.85 275.69 278.05 282.91 285.01" y="318.43" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="291.03 300.03 309.03 318.03 327.03 336.03 345.03 354.03 363.03 372.03 381.03 390.03 399.03 408.03 417.03 426.03 435.03 444.03" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">拦截的防御性编码流量显著减少，但多于</text><text x="455.40 461.59 464.40 469.12 474.68 480.04 484.88 487.25 494.17 499.58 505.14 509.51 511.88" y="318.43" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="519.10" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="72.00 78.19 81.00 85.72 91.28 96.64 101.48 103.85 109.23 114.33 120.07 125.81 130.65 134.37 136.74" y="330.13" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="141.60" y="330.13" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="150.60 159.60 168.60 177.60 186.60 195.60 204.60 213.60 222.60 231.60 240.60" y="330.13" font-size="9.00" class="sc-notoserifcjksc">因此，我们预计用户使用</text><text x="251.96 256.54 261.18 266.42 268.87 273.74 276.11 281.02 283.23" y="330.13" font-size="9.00" class="sc-loraregular">Fable 5.1</text><text x="288.87 297.87 306.87 315.87 324.87 333.87 342.87 351.87 360.87 369.87" y="330.13" font-size="9.00" class="sc-notoserifcjksc">时遇到的误报将远少于</text><text x="381.24 385.81 390.46 395.69 398.14 403.02 405.39" y="330.13" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="410.29 419.29 428.29 437.29 446.29 455.29 464.29 473.29 482.29 491.29 500.29 509.29 518.29 527.29" y="330.13" font-size="9.00" class="sc-notoserifcjksc">，从而为防御者及防御性网络安</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="341.83" font-size="9.00" class="sc-notoserifcjksc">全用例提供关键优势。</text><text x="72.00 80.39 84.03" y="391.57" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37 110.37 124.37 138.37 152.37 166.37 180.37 194.37 208.37 222.37 236.37" y="391.57" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施鲁棒性测试</text><text x="72.00" y="418.13" font-size="11.00" class="sc-loraregular">“</text><text x="76.40 87.40 98.40 109.40 120.40" y="418.13" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="418.13" font-size="11.00" class="sc-loraregular">”</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc">定义运行框架和多智能体流水线。在我们的</text><text x="281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了以下四个越狱严重性</text><text x="72.00 83.00 94.00" y="449.37" font-size="11.00" class="sc-notoserifcjksc">维度：</text><text x="108.00 119.00 130.00 141.00" y="499.09" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="152.00 163.00" y="499.09" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="174.00 185.00 196.00 207.00" y="499.09" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00" y="499.09" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能让攻击者在其现有工具和能力的基础上走多远。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="531.47" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="174.00 185.00" y="531.47" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="196.00 207.00 218.00 229.00" y="531.47" font-size="11.00" class="sc-notoserifcjkscbold">通用性）</text><text x="240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00" y="531.47" font-size="11.00" class="sc-notoserifcjksc">：同一越狱技术可适用于多少种不同的进攻性任务。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="563.86" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="563.86" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力投入。</text><text x="108.00 119.00 130.00 141.00" y="596.24" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="596.24" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="628.63" font-size="11.00" class="sc-notoserifcjksc">例如，一个严重程度为</text><text x="182.00" y="628.63" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="628.63" font-size="11.00" class="sc-loraregular">”</text><text x="212.24 223.24 234.24 245.24 256.24 267.24 278.24 289.24 300.24 311.24 322.24 333.24 344.24 355.24 366.24 377.24 388.24 399.24 410.24 421.24 432.24 443.24 454.24 465.24 476.24 487.24 498.24 509.24 520.24" y="628.63" font-size="11.00" class="sc-notoserifcjksc">的越狱会易于发现、易于武器化，并且在高能力提升的模型上具有</text><text x="72.00 83.00 94.00 105.00" y="644.25" font-size="11.00" class="sc-notoserifcjksc">通用性。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="677.20" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 206.77 212.45 218.85 221.84 227.80 230.70 236.69 239.40" y="677.20" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="403.19 410.88 413.87 419.48 426.05 432.62 438.59 441.48 447.07 452.74 459.15 462.14 468.10 470.99" y="677.20" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="479.88" y="677.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="493.77 501.46 504.45 510.06 516.63 523.21" y="677.20" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="692.82" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74 297.74 308.74 319.74 330.74 341.74" y="692.82" font-size="11.00" class="sc-notoserifcjksc">而言同样如此）。即便如此，我们并不期望我们的</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="281.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="281.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器具有完美的鲁棒性。因此，我们在内部以及与外部合作伙伴一起对我们的模型进行广泛测</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">试，以主动发现并修补越狱。</text><text x="72.00 79.79 83.17 91.54 94.92" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72 115.72 128.72 141.72 154.72 167.72 180.72" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="157.42" font-size="11.00" class="sc-notoserifcjkscbold">内部动态对抗鲁棒性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项名为</text><text x="173.89 178.58 184.50 193.31 196.40 203.08 209.65 215.03 220.63 225.00 229.26 234.93 240.78 246.61 252.58" y="173.04" font-size="11.00" class="sc-loraregular">rewind-attacker</text><text x="260.23 271.23 282.23 293.23 304.23 315.23 326.23 337.23 348.23 359.23 370.23 381.23 392.23 403.23 414.23 425.23 436.23 447.23 458.23 469.23 480.23 491.23 502.23 513.23 524.23" y="173.04" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全防护的模型（助</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00" y="188.66" font-size="11.00" class="sc-notoserifcjksc">手）抵御自动化编排器（攻击者）的能力。在此设置中，攻击者是一个仅有用（</text><text x="457.00 463.59 469.55 472.54 479.05 482.77 489.34 492.33 497.71 504.15 510.82 513.76" y="188.66" font-size="11.00" class="sc-loraregular">helpful-only</text><text x="519.57" y="188.66" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="204.28" font-size="11.00" class="sc-notoserifcjksc">语言模型，通过提示词使其模拟人类红队成员，从助手处诱导出进攻性网络安全能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个可访问助手模型端点的会话中启动。随后，攻击者对该助手有</text><text x="437.89 443.86 450.69" y="254.57" font-size="11.00" class="sc-loraregular">400</text><text x="460.41 471.41 482.41 493.41 504.41 515.41 526.41" y="254.57" font-size="11.00" class="sc-notoserifcjksc">次调用上限，在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">此期间攻击者会收到拦截反馈，并可以回溯到较早的状态以尝试新的方法。每项任务都将智能体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="285.81" font-size="11.00" class="sc-notoserifcjksc">置于一个自包含的</text><text x="162.89 171.09 177.52 183.38 189.20 195.17" y="285.81" font-size="11.00" class="sc-loraregular">Docker</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="369.00 374.80 381.23 391.07 400.90 406.58 413.25 419.83 425.21 430.89 437.56 444.14 449.52 455.32 461.75 468.33 472.59 477.27 483.71" y="301.43" font-size="11.00" class="sc-loraregular">command-and-control</text><text x="486.70 497.70 508.70 519.70" y="301.43" font-size="11.00" class="sc-notoserifcjksc">）服务器</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务套件包括以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="481.89 489.98 498.36" y="400.30" font-size="11.00" class="sc-loraregular">DNS</text><text x="504.60 515.60 526.60" y="400.30" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00 83.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00 102.68 108.64 115.04 121.63 128.07 134.50" y="415.92" font-size="11.00" class="sc-loraregular">webhook</text><text x="143.30 154.30 165.30 176.30 187.30 198.30 209.30 220.30 231.30 242.30 253.30 264.30 275.30 286.30 297.30 308.30 319.30 330.30 341.30" y="415.92" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20 362.88 370.07" y="415.92" font-size="11.00" class="sc-loraregular">CVE</text><text x="376.91 387.91 398.91" y="415.92" font-size="11.00" class="sc-notoserifcjksc">（包括</text><text x="412.80 419.48 425.83 428.92 435.59" y="415.92" font-size="11.00" class="sc-loraregular">nginx</text><text x="441.42" y="415.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="452.42 461.16 467.73 473.69 480.36 486.60 492.84" y="415.92" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="499.20" y="415.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="510.20 516.54 519.54 522.63 529.03" y="415.92" font-size="11.00" class="sc-loraregular">glibc</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89 92.25 98.69 104.77 110.73 116.97 123.56 129.52 132.51" y="431.54" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="135.50 146.50 157.50 168.50 179.50 190.50 201.50 212.50 223.50 234.50 245.50 256.50 267.50 278.50 289.50 300.50 311.50 322.50 333.50 344.50 355.50 366.50 377.50 388.50 399.50" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）的远程与本地漏洞利用；命令与控制；以及自我复制。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">与此前的报告相比，我们做了以下改动，并针对</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 350.42 356.86 363.53 370.21 376.10 380.35 383.25" y="481.26" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="389.24" y="481.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.24 407.93 410.92 416.53 423.10 429.68 435.64 438.53 447.27 453.83 460.40 465.49 468.38" y="481.26" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="474.38" y="481.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="485.38 493.07 496.06 501.67 508.24 514.82" y="481.26" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51" y="496.88" font-size="11.00" class="sc-loraregular">Fable 5</text><text x="110.40" y="496.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="124.29 131.98 134.98 140.58 147.15 153.73 159.69 162.58 168.17 173.85 180.25 183.24 189.20 192.10 198.09 200.80" y="496.88" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="207.70 218.70 229.70 240.70 251.70 262.70 273.70 284.70 295.70" y="496.88" font-size="11.00" class="sc-notoserifcjksc">重新运行了该评估：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="529.84" font-size="11.00" class="sc-notoserifcjksc">改进了我们的沙箱机制和评估轨迹审计，包括一个沙箱逃逸监控器；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">移除了两项在新沙箱机制下无法正常运行的任务；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">新增了七项任务以弥补移除的部分；</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="594.60" font-size="11.00" class="sc-notoserifcjksc">将我们的奖励破解评分器升级为更新的模型；以及</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00" y="610.79" font-size="11.00" class="sc-notoserifcjksc">统一为每个模型运行八次，以获得更窄的误差线和更好的可复现性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="72.00" y="359.16" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22" y="359.16" font-size="9.00" class="sc-lorabold">3.5.1.A]</text><text x="118.06 127.06 136.06 145.06 154.06 163.06 172.06 181.06" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">面对动态攻击者，</text><text x="190.06 196.25 199.06 203.78 209.34 214.70 219.55 221.91 226.68 231.40 236.52 239.33 244.17 246.54 251.40 253.49" y="359.16" font-size="9.00" class="sc-lorabold">Claude Fable 5.1</text><text x="259.52 268.52 277.52 286.52 295.52" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">的鲁棒性与</text><text x="306.88 313.07 315.88 320.60 326.16 331.52 336.37 338.73 343.50 348.22 353.34 356.15 360.99 363.36" y="359.16" font-size="9.00" class="sc-lorabold">Claude Fable 5</text><text x="370.58 379.58 388.58" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">相当。</text><text x="72.00 79.79 83.17 91.54 94.92" y="391.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48 118.48 131.48 144.48 157.48 170.48" y="391.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="419.41" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们与签约外部测试方合作，对</text><text x="316.89 324.58 327.57 333.18 339.75 346.33 352.29 355.18 360.77 366.45 372.85 375.84 381.80 384.70 390.69 393.40" y="419.41" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="400.30 411.30 422.30 433.30 444.30 455.30 466.30 477.30 488.30 499.30 510.30 521.30" y="419.41" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行了红队</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="435.03" font-size="11.00" class="sc-notoserifcjksc">测试。其中两家机构评估了我们在</text><text x="239.89 247.58 250.57 256.18 262.75 269.33 275.29 278.18 286.92 293.49 300.05 305.15 308.04" y="435.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5</text><text x="316.93" y="435.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.82 338.51 341.50 347.11 353.68 360.25 366.22 369.11 374.70 380.37 386.78 389.77 395.73 398.62" y="435.03" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5</text><text x="407.51 418.51 429.51 440.51 451.51 462.51 473.51 484.51 495.51 506.51 517.51 528.51" y="435.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的相同任务：</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="484.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64 228.64 239.64 250.64 261.64" y="484.18" font-size="11.00" class="sc-notoserifcjksc">花费了大约</text><text x="275.53 280.45" y="484.18" font-size="11.00" class="sc-loraregular">74</text><text x="289.30 300.30 311.30" y="484.18" font-size="11.00" class="sc-notoserifcjksc">小时对</text><text x="325.20 330.78 336.46 342.86 345.85 351.82 354.71 360.70 363.41" y="484.18" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="370.31 381.31 392.31 403.31 414.31 425.31 436.31 447.31 458.31 469.31 480.31 491.31 502.31 513.31 524.31" y="484.18" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，针对沙箱化的任务</text><text x="108.00 119.00 130.00 141.00 152.00" y="499.80" font-size="11.00" class="sc-notoserifcjksc">发送了超过</text><text x="165.89 172.25 175.02 181.02 187.85" y="499.80" font-size="11.00" class="sc-loraregular">6,500</text><text x="197.58 208.58 219.58 230.58 241.58 252.58 263.58 274.58 285.58 296.58 307.58 318.58 329.58 340.58 351.58 362.58 373.58 384.58 395.58 406.58 417.58 428.58 439.58 450.58 461.58 472.58 483.58 494.58 505.58 516.58 527.58" y="499.80" font-size="11.00" class="sc-notoserifcjksc">次请求，每项任务都要求复现针对某个公开披露的漏洞的漏洞利用。在</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="515.42" font-size="11.00" class="sc-notoserifcjksc">任何任务中，他们都未能仅凭</text><text x="253.89 259.48 265.16 271.56 274.55 280.51 283.41 289.40 292.11" y="515.42" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="299.00 310.00 321.00 332.00 343.00 354.00 365.00 376.00 387.00 398.00 409.00 420.00 431.00 442.00 453.00 464.00 475.00 486.00 497.00 508.00 519.00" y="515.42" font-size="11.00" class="sc-notoserifcjksc">获得可用的端到端漏洞利用，也没有发现任何通</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="531.04" font-size="11.00" class="sc-notoserifcjksc">用越狱。他们报告了分布在四项任务中的</text><text x="308.89 312.90" y="531.04" font-size="11.00" class="sc-loraregular">11</text><text x="319.79 330.79 341.79 352.79 363.79 374.79 385.79 396.79 407.79 418.79 429.79 440.79 451.79 462.79 473.79 484.79 495.79 506.79 517.79 528.79" y="531.04" font-size="11.00" class="sc-notoserifcjksc">个候选突破。经审查相关的对话记录，其中一</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00" y="546.66" font-size="11.00" class="sc-notoserifcjksc">个是识别并修补该漏洞，这是我们的政策所允许的。在另外</text><text x="396.89 400.90" y="546.66" font-size="11.00" class="sc-loraregular">10</text><text x="410.62 421.62 432.62 443.62 454.62 465.62 476.62 487.62 498.62 509.62 520.62" y="546.66" font-size="11.00" class="sc-notoserifcjksc">个中，红队成员将任务拆</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="562.28" font-size="11.00" class="sc-notoserifcjksc">分为各自属于防御性或教育性的请求，这些请求同样是我们的政策所允许的，例如修复及</text><text x="108.00 119.00 130.00 141.00 152.00" y="593.52" font-size="11.00" class="sc-notoserifcjksc">工具程序。</text><text x="163.00 168.59 174.26 180.67 183.66 189.62 192.51 198.51 201.21" y="593.52" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="593.52" font-size="11.00" class="sc-notoserifcjksc">从未被展示攻击目标或总体目的，而那些确实说明了目的的请求均被</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="609.14" font-size="11.00" class="sc-notoserifcjksc">安全防护措施拦截。这</text><text x="220.89 224.90" y="609.14" font-size="11.00" class="sc-loraregular">10</text><text x="234.62 245.62 256.62 267.62 278.62 289.62 300.62 311.62 322.62 333.62 344.62 355.62 366.62 377.62 388.62 399.62 410.62 421.62 432.62 443.62 454.62 465.62 476.62 487.62 498.62 509.62 520.62" y="609.14" font-size="11.00" class="sc-notoserifcjksc">个会话中有六个未产生任何可用的漏洞利用。在其余四个中，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="624.76" font-size="11.00" class="sc-notoserifcjksc">漏洞利用最终仅在一个能力较弱的模型的帮助下才得以获得：在其中三个会话中，较弱的</text><text x="108.00 119.00 130.00 141.00" y="640.38" font-size="11.00" class="sc-notoserifcjksc">模型利用</text><text x="154.89 160.48 166.16 172.56 175.55 181.51 184.41 190.40 193.11" y="640.38" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="200.00 211.00 222.00 233.00 244.00 255.00 266.00 277.00 288.00 299.00 310.00 321.00 332.00 343.00 354.00 365.00 376.00 387.00 398.00 409.00 420.00 431.00 442.00 453.00 464.00 475.00" y="640.38" font-size="11.00" class="sc-notoserifcjksc">生成的通用性、防御性或教育性材料组装出了漏洞利用；在</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="239.89" y="426.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="239.89" y="426.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="275.29" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="278.18" y="426.23" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="305.15" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="308.04" y="426.23" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="330.82" y="426.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="330.82" y="426.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="366.22" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="369.11" y="426.23" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="395.73" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="398.62" y="426.23" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="108.00" y="475.38" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="161.26" y="475.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="164.15" y="475.38" width="26.55" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="190.71" y="475.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="193.60" y="475.38" width="21.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00 508.91" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第四个会话中，针对广为人知的</text><text x="264.89 270.80 277.55 283.46" y="82.61" font-size="11.00" class="sc-loraregular">2021</text><text x="290.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="304.25 310.61 317.04 323.13 329.09 335.33 341.92 347.88 350.87" y="82.61" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="356.75 367.75 378.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">漏洞，</text><text x="389.75 395.34 401.02 407.42 410.41 416.37 419.27 425.26 427.97" y="82.61" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="434.87 445.87 456.87 467.87 478.87 489.87 500.87 511.87 522.86" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在多个全新对话中以</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">独立的良性开发任务的形式编写了部分组件，并在被要求时运行了将这些组件组合起来的</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">脚本，而由第二个模型编写了将攻击指向目标的组件。所有成功的方法都是针对具体任务</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的，依赖大量手动迭代，并且在每一种情况下都依赖第二个模型提供关键的武器化步骤。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">我们预计，能力较弱的模型在没有协助的情况下也能产生相当的结果。</text><text x="108.00 112.00 118.84 124.51 127.40 134.00 139.68 146.08" y="195.95" font-size="11.00" class="sc-loraregular" fill="#0000ff">10a Labs</text><text x="154.07 165.07" y="195.95" font-size="11.00" class="sc-notoserifcjksc">针对</text><text x="178.96 184.55 190.23 196.63 199.62 205.58 208.47 214.47 217.18" y="195.95" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="224.07 235.07 246.07 257.07 268.07" y="195.95" font-size="11.00" class="sc-notoserifcjksc">运行了超过</text><text x="281.97 288.32 290.74 295.81 302.65" y="195.95" font-size="11.00" class="sc-loraregular">6,700</text><text x="312.38 323.38 334.38 345.38 356.38 367.38 378.38 389.38 400.38 411.38 422.38 433.38 444.38 455.38 466.38 477.38 488.38" y="195.95" font-size="11.00" class="sc-notoserifcjksc">条自动化与人工提示词。他们报告称，</text><text x="499.38" y="195.95" font-size="11.00" class="sc-loraregular">“</text><text x="503.78 514.78 525.78" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在网络</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">安全任务中，拒绝行为始终保持严格</text><text x="284.00" y="211.57" font-size="11.00" class="sc-loraregular">”</text><text x="287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，并且未能产生可被武器化的输出。</text><text x="72.00 83.00 94.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="105.00 113.37 118.06 123.62 129.43 132.32 138.51 147.21 152.88" y="260.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">Gray Swan</text><text x="162.45 173.45 184.45 195.45 206.45 217.45 228.45 239.45 250.45 261.45 272.45 283.45 294.45 305.45 316.45 327.45 338.45 349.45 360.45 371.45 382.45 393.45 404.45 415.45 426.45 437.45 448.45 459.45" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在他们独立构建的一组任务上运行了一个自动化攻击者。他们的</text><text x="473.35 479.58 486.17 491.85 498.43" y="260.72" font-size="11.00" class="sc-loraregular">Shade</text><text x="507.28 518.28 529.28" y="260.72" font-size="11.00" class="sc-notoserifcjksc">攻击器</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">基于多样化的红队策略进行训练，其中包括来源于</text><text x="316.89 325.26 329.95 335.52 341.32 344.22 350.40 359.10 364.78 371.45 374.35 381.23 385.92 391.88 398.56" y="276.34" font-size="11.00" class="sc-loraregular">Gray Swan Arena</text><text x="407.13 418.13 429.13 440.13 451.13 462.13 473.13 484.13 495.13 506.13 517.13 528.13" y="276.34" font-size="11.00" class="sc-notoserifcjksc">的真实世界攻击技术。他们</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">在两个任务集上测试了</text><text x="184.89 191.13 197.72 203.39 209.97" y="291.96" font-size="11.00" class="sc-loraregular">Shade</text><text x="215.93" y="291.96" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00 115.57 123.36" y="341.68" font-size="11.00" class="sc-lorabold">CVE</text><text x="130.22" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">：</text><text x="141.22 146.89" y="341.68" font-size="11.00" class="sc-loraregular">24</text><text x="155.74 166.74 177.74 188.74 199.74 210.74 221.74 232.74 243.74 254.74 265.74 276.74 287.74 298.74 309.74 320.74 331.74 342.74 353.74 364.74 375.74 386.74 397.74 408.74 419.74 430.74 441.74 452.74 463.74 474.74 485.74 496.74 507.74 518.74 529.74" y="341.68" font-size="11.00" class="sc-notoserifcjksc">个场景，每个场景包含一个带有已知漏洞的单一代码文件。他们的攻击者能够让</text><text x="108.00 113.59 119.26 125.67 128.66 134.62 137.51 143.51 146.21" y="357.30" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="153.11 164.11 175.11 186.11 197.11 208.11 219.11 230.11 241.11 252.11 263.11 274.11 285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11 527.11" y="357.30" font-size="11.00" class="sc-notoserifcjksc">识别出这些漏洞，并在部分场景中编写演示这些漏洞的输入（这是我们当前政策</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc">所允许的），但没有产生任何可用的漏洞利用。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">通过聊天套取知识：</text><text x="207.00 218.00 229.00 240.00 251.00 262.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">要求模型针对</text><text x="275.89 279.90 286.73" y="406.45" font-size="11.00" class="sc-loraregular">100</text><text x="296.45 307.45 318.45 329.45 340.45 351.45" y="406.45" font-size="11.00" class="sc-notoserifcjksc">条有害查询和</text><text x="365.35 369.35 376.18" y="406.45" font-size="11.00" class="sc-loraregular">100</text><text x="385.90 396.90 407.90 418.90 429.90 440.90 451.90 462.90 473.90 484.90 495.90 506.90 517.90 528.90" y="406.45" font-size="11.00" class="sc-notoserifcjksc">条两用查询提供信息的对话。他</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">们的攻击者仅在两条两用查询上引出了有用信息，在其余</text><text x="385.89 389.90 396.26" y="422.07" font-size="11.00" class="sc-loraregular">198</text><text x="405.33 416.33 427.33 438.33 449.33 460.33 471.33" y="422.07" font-size="11.00" class="sc-notoserifcjksc">条上均告失败。</text><a href="https://10alabs.com/" rel="noopener"><rect x="108.00" y="187.15" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="124.51" y="187.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="127.40" y="187.15" width="23.77" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="105.00" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="105.00" y="251.92" width="24.43" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="129.43" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="132.32" y="251.92" width="27.24" height="11.00" fill="transparent"/></a></svg></div>
