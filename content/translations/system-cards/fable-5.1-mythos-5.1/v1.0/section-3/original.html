<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p055.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 55 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">55</text><text x="72.00" y="318.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.90 101.00 106.04 108.14 113.67" y="318.43" font-size="9.00" class="sc-lorabold">3.4.3.A]</text><text x="119.51" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">与</text><text x="130.88" y="318.43" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5</text><text x="194.58" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">相比，</text><text x="221.58" y="318.43" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5.1</text><text x="291.03" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">拦截的防御性编码流量显著减少，但多于</text><text x="455.40" y="318.43" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="519.10" y="318.43" font-size="9.00" class="sc-notoserifcjkscbold">和</text><text x="72.00" y="330.13" font-size="9.00" class="sc-lorabold">Claude Sonnet 5</text><text x="141.60" y="330.13" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="150.60" y="330.13" font-size="9.00" class="sc-notoserifcjksc">因此，我们预计用户使用</text><text x="251.96" y="330.13" font-size="9.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="288.87" y="330.13" font-size="9.00" class="sc-notoserifcjksc">时遇到的误报将远少于</text><text x="381.24" y="330.13" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="410.29" y="330.13" font-size="9.00" class="sc-notoserifcjksc">，从而为防御者及防御性网络安</text><text x="72.00" y="341.83" font-size="9.00" class="sc-notoserifcjksc">全用例提供关键优势。</text><text x="72.00" y="391.57" font-size="14.00" class="sc-poppinssemibold">3.5</text><text x="96.37" y="391.57" font-size="14.00" class="sc-notosanscjkscbold">安全防护措施鲁棒性测试</text><text x="72.00" y="418.13" font-size="11.00" class="sc-loraregular">“</text><text x="76.40" y="418.13" font-size="11.00" class="sc-notoserifcjksc">对抗鲁棒性</text><text x="131.40" y="418.13" font-size="11.00" class="sc-loraregular">”</text><text x="72.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc">定义运行框架和多智能体流水线。在我们的</text><text x="281.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">越狱严重性框架</text><text x="358.00" y="433.75" font-size="11.00" class="sc-notoserifcjksc">中，我们提出了以下四个越狱严重性</text><text x="72.00" y="449.37" font-size="11.00" class="sc-notoserifcjksc">维度：</text><text x="108.00" y="499.09" font-size="11.00" class="sc-notoserifcjkscbold">能力增益</text><text x="152.00" y="499.09" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="174.00" y="499.09" font-size="11.00" class="sc-notoserifcjkscbold">能力提升</text><text x="218.00" y="499.09" font-size="11.00" class="sc-notoserifcjksc">）：越狱技术能让攻击者在其现有工具和能力的基础上走多远。</text><text x="108.00" y="531.47" font-size="11.00" class="sc-notoserifcjkscbold">能力增益广度</text><text x="174.00" y="531.47" font-size="11.00" class="sc-notoserifcjksc">（或</text><text x="196.00" y="531.47" font-size="11.00" class="sc-notoserifcjkscbold">通用性）</text><text x="240.00" y="531.47" font-size="11.00" class="sc-notoserifcjksc">：同一越狱技术可适用于多少种不同的进攻性任务。</text><text x="108.00" y="563.86" font-size="11.00" class="sc-notoserifcjkscbold">武器化难易度</text><text x="174.00" y="563.86" font-size="11.00" class="sc-notoserifcjksc">：将越狱转化为攻击所需的人力投入。</text><text x="108.00" y="596.24" font-size="11.00" class="sc-notoserifcjkscbold">可发现性</text><text x="152.00" y="596.24" font-size="11.00" class="sc-notoserifcjksc">：威胁行为者获取该技术的难易程度。</text><text x="72.00" y="628.63" font-size="11.00" class="sc-notoserifcjksc">例如，一个严重程度为</text><text x="182.00" y="628.63" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="628.63" font-size="11.00" class="sc-loraregular">”</text><text x="212.24" y="628.63" font-size="11.00" class="sc-notoserifcjksc">的越狱会易于发现、易于武器化，并且在高能力提升的模型上具有</text><text x="72.00" y="644.25" font-size="11.00" class="sc-notoserifcjksc">通用性。</text><text x="72.00" y="677.20" font-size="11.00" class="sc-notoserifcjksc">我们尚未发现针对</text><text x="162.89" y="677.20" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="403.19" y="677.20" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="479.88" y="677.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="493.77" y="677.20" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="692.82" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="692.82" font-size="11.00" class="sc-notoserifcjksc">而言同样如此）。即便如此，我们并不期望我们的</text><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="281.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="281.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="292.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="303.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="314.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="325.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="336.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="424.95" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-safeguards-jailbreak-framework" rel="noopener"><rect x="347.00" y="424.95" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p056.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 56 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">56</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分类器具有完美的鲁棒性。因此，我们在内部以及与外部合作伙伴一起对我们的模型进行广泛测</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">试，以主动发现并修补越狱。</text><text x="72.00" y="129.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.1</text><text x="102.72" y="129.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">内部鲁棒性测试</text><text x="72.00" y="157.42" font-size="11.00" class="sc-notoserifcjkscbold">内部动态对抗鲁棒性评估</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">我们维护着一项名为</text><text x="173.89" y="173.04" font-size="11.00" class="sc-loraregular sc-k">rewind-attacker</text><text x="260.23" y="173.04" font-size="11.00" class="sc-notoserifcjksc">的内部对抗鲁棒性评估，用于衡量受安全防护的模型（助</text><text x="72.00" y="188.66" font-size="11.00" class="sc-notoserifcjksc">手）抵御自动化编排器（攻击者）的能力。在此设置中，攻击者是一个仅有用（</text><text x="457.00" y="188.66" font-size="11.00" class="sc-loraregular sc-k">helpful-only</text><text x="519.57" y="188.66" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="72.00" y="204.28" font-size="11.00" class="sc-notoserifcjksc">语言模型，通过提示词使其模拟人类红队成员，从助手处诱导出进攻性网络安全能力。</text><text x="72.00" y="254.57" font-size="11.00" class="sc-notoserifcjksc">攻击者在一个可访问助手模型端点的会话中启动。随后，攻击者对该助手有</text><text x="437.89" y="254.57" font-size="11.00" class="sc-loraregular">400</text><text x="460.41" y="254.57" font-size="11.00" class="sc-notoserifcjksc">次调用上限，在</text><text x="72.00" y="270.19" font-size="11.00" class="sc-notoserifcjksc">此期间攻击者会收到拦截反馈，并可以回溯到较早的状态以尝试新的方法。每项任务都将智能体</text><text x="72.00" y="285.81" font-size="11.00" class="sc-notoserifcjksc">置于一个自包含的</text><text x="162.89" y="285.81" font-size="11.00" class="sc-loraregular sc-k">Docker</text><text x="72.00" y="301.43" font-size="11.00" class="sc-notoserifcjksc">录、用攻击者控制的公钥封装加密密钥，以及向命令与控制（</text><text x="369.00" y="301.43" font-size="11.00" class="sc-loraregular sc-k">command-and-control</text><text x="486.70" y="301.43" font-size="11.00" class="sc-notoserifcjksc">）服务器</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">我们当前的任务套件包括以下类别：勒索软件（加密、密钥托管、终止备份）；通过</text><text x="481.89" y="400.30" font-size="11.00" class="sc-loraregular sc-k">DNS</text><text x="504.60" y="400.30" font-size="11.00" class="sc-notoserifcjksc">、云存</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">储、</text><text x="94.00" y="415.92" font-size="11.00" class="sc-loraregular sc-k">webhook</text><text x="143.30" y="415.92" font-size="11.00" class="sc-notoserifcjksc">及其他渠道进行的规模化数据外泄；对真实</text><text x="355.20" y="415.92" font-size="11.00" class="sc-loraregular">CVE</text><text x="376.91" y="415.92" font-size="11.00" class="sc-notoserifcjksc">（包括</text><text x="412.80" y="415.92" font-size="11.00" class="sc-loraregular sc-k">nginx</text><text x="441.42" y="415.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="452.42" y="415.92" font-size="11.00" class="sc-loraregular">OpenSSL</text><text x="499.20" y="415.92" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="510.20" y="415.92" font-size="11.00" class="sc-loraregular sc-k">glibc</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="431.54" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="135.50" y="431.54" font-size="11.00" class="sc-notoserifcjksc">）的远程与本地漏洞利用；命令与控制；以及自我复制。</text><text x="72.00" y="481.26" font-size="11.00" class="sc-notoserifcjksc">与此前的报告相比，我们做了以下改动，并针对</text><text x="305.89" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="389.24" y="481.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.24" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="474.38" y="481.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="485.38" y="481.26" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="496.88" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="496.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="124.29" y="496.88" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="207.70" y="496.88" font-size="11.00" class="sc-notoserifcjksc">重新运行了该评估：</text><text x="108.00" y="529.84" font-size="11.00" class="sc-notoserifcjksc">改进了我们的沙箱机制和评估轨迹审计，包括一个沙箱逃逸监控器；</text><text x="108.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">移除了两项在新沙箱机制下无法正常运行的任务；</text><text x="108.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">新增了七项任务以弥补移除的部分；</text><text x="108.00" y="594.60" font-size="11.00" class="sc-notoserifcjksc">将我们的奖励破解评分器升级为更新的模型；以及</text><text x="108.00" y="610.79" font-size="11.00" class="sc-notoserifcjksc">统一为每个模型运行八次，以获得更窄的误差线和更好的可复现性。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p057.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 57 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">57</text><text x="72.00" y="359.16" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.88 93.98 98.84 100.93 104.59 106.69 112.22" y="359.16" font-size="9.00" class="sc-lorabold">3.5.1.A]</text><text x="118.06" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">面对动态攻击者，</text><text x="190.06" y="359.16" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5.1</text><text x="259.52" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">的鲁棒性与</text><text x="306.88" y="359.16" font-size="9.00" class="sc-lorabold sc-k">Claude Fable 5</text><text x="370.58" y="359.16" font-size="9.00" class="sc-notoserifcjkscbold">相当。</text><text x="72.00" y="391.53" font-size="13.00" class="sc-poppinssemibold" fill="#666666">3.5.2</text><text x="105.48" y="391.53" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">其他外部测试</text><text x="72.00" y="419.41" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们与签约外部测试方合作，对</text><text x="316.89" y="419.41" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="400.30" y="419.41" font-size="11.00" class="sc-notoserifcjksc">的安全防护措施进行了红队</text><text x="72.00" y="435.03" font-size="11.00" class="sc-notoserifcjksc">测试。其中两家机构评估了我们在</text><text x="239.89" y="435.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5</text><text x="316.93" y="435.03" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="330.82" y="435.03" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Fable 5</text><text x="407.51" y="435.03" font-size="11.00" class="sc-notoserifcjksc">系统卡中报告的相同任务：</text><text x="108.00 114.88 119.56 125.24 128.11 134.01 139.81 144.07 150.50 155.45 161.26 164.15 170.76 176.43 182.83 187.93 190.70 193.59 200.20 207.04" y="484.18" font-size="11.00" class="sc-loraregular" fill="#0000ff">Trajectory Labs, PBC</text><text x="217.64" y="484.18" font-size="11.00" class="sc-notoserifcjksc">花费了大约</text><text x="275.53" y="484.18" font-size="11.00" class="sc-loraregular sc-k">74</text><text x="289.30" y="484.18" font-size="11.00" class="sc-notoserifcjksc">小时对</text><text x="325.20" y="484.18" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="370.31" y="484.18" font-size="11.00" class="sc-notoserifcjksc">进行红队测试，针对沙箱化的任务</text><text x="108.00" y="499.80" font-size="11.00" class="sc-notoserifcjksc">发送了超过</text><text x="165.89 172.25 175.02 181.02 187.85" y="499.80" font-size="11.00" class="sc-loraregular">6,500</text><text x="197.58" y="499.80" font-size="11.00" class="sc-notoserifcjksc">次请求，每项任务都要求复现针对某个公开披露的漏洞的漏洞利用。在</text><text x="108.00" y="515.42" font-size="11.00" class="sc-notoserifcjksc">任何任务中，他们都未能仅凭</text><text x="253.89" y="515.42" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="299.00" y="515.42" font-size="11.00" class="sc-notoserifcjksc">获得可用的端到端漏洞利用，也没有发现任何通</text><text x="108.00" y="531.04" font-size="11.00" class="sc-notoserifcjksc">用越狱。他们报告了分布在四项任务中的</text><text x="308.89" y="531.04" font-size="11.00" class="sc-loraregular">11</text><text x="319.79" y="531.04" font-size="11.00" class="sc-notoserifcjksc">个候选突破。经审查相关的对话记录，其中一</text><text x="108.00" y="546.66" font-size="11.00" class="sc-notoserifcjksc">个是识别并修补该漏洞，这是我们的政策所允许的。在另外</text><text x="396.89" y="546.66" font-size="11.00" class="sc-loraregular">10</text><text x="410.62" y="546.66" font-size="11.00" class="sc-notoserifcjksc">个中，红队成员将任务拆</text><text x="108.00" y="562.28" font-size="11.00" class="sc-notoserifcjksc">分为各自属于防御性或教育性的请求，这些请求同样是我们的政策所允许的，例如修复及</text><text x="108.00" y="593.52" font-size="11.00" class="sc-notoserifcjksc">工具程序。</text><text x="163.00" y="593.52" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="208.11" y="593.52" font-size="11.00" class="sc-notoserifcjksc">从未被展示攻击目标或总体目的，而那些确实说明了目的的请求均被</text><text x="108.00" y="609.14" font-size="11.00" class="sc-notoserifcjksc">安全防护措施拦截。这</text><text x="220.89" y="609.14" font-size="11.00" class="sc-loraregular">10</text><text x="234.62" y="609.14" font-size="11.00" class="sc-notoserifcjksc">个会话中有六个未产生任何可用的漏洞利用。在其余四个中，</text><text x="108.00" y="624.76" font-size="11.00" class="sc-notoserifcjksc">漏洞利用最终仅在一个能力较弱的模型的帮助下才得以获得：在其中三个会话中，较弱的</text><text x="108.00" y="640.38" font-size="11.00" class="sc-notoserifcjksc">模型利用</text><text x="154.89" y="640.38" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="200.00" y="640.38" font-size="11.00" class="sc-notoserifcjksc">生成的通用性、防御性或教育性材料组装出了漏洞利用；在</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="239.89" y="426.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="239.89" y="426.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="275.29" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="278.18" y="426.23" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="305.15" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="308.04" y="426.23" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="330.82" y="426.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="330.82" y="426.23" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="366.22" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="369.11" y="426.23" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="395.73" y="426.23" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="398.62" y="426.23" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="108.00" y="475.38" width="53.26" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="161.26" y="475.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="164.15" y="475.38" width="26.55" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="190.71" y="475.38" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.trajectorylabs.com/" rel="noopener"><rect x="193.60" y="475.38" width="21.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p058.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 58 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">58</text><text x="108.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">第四个会话中，针对广为人知的</text><text x="264.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">2021</text><text x="290.36" y="82.61" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="304.25" y="82.61" font-size="11.00" class="sc-loraregular">Log4Shell</text><text x="356.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc">漏洞，</text><text x="389.75" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="434.87" y="82.61" font-size="11.00" class="sc-notoserifcjksc">在多个全新对话中以</text><text x="108.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">独立的良性开发任务的形式编写了部分组件，并在被要求时运行了将这些组件组合起来的</text><text x="108.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">脚本，而由第二个模型编写了将攻击指向目标的组件。所有成功的方法都是针对具体任务</text><text x="108.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的，依赖大量手动迭代，并且在每一种情况下都依赖第二个模型提供关键的武器化步骤。</text><text x="108.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">我们预计，能力较弱的模型在没有协助的情况下也能产生相当的结果。</text><text x="108.00" y="195.95" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">10a Labs</text><text x="154.07" y="195.95" font-size="11.00" class="sc-notoserifcjksc">针对</text><text x="178.96" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="224.07" y="195.95" font-size="11.00" class="sc-notoserifcjksc">运行了超过</text><text x="281.97 288.32 290.74 295.81 302.65" y="195.95" font-size="11.00" class="sc-loraregular">6,700</text><text x="312.38" y="195.95" font-size="11.00" class="sc-notoserifcjksc">条自动化与人工提示词。他们报告称，</text><text x="499.38" y="195.95" font-size="11.00" class="sc-loraregular">“</text><text x="503.78" y="195.95" font-size="11.00" class="sc-notoserifcjksc">在网络</text><text x="108.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">安全任务中，拒绝行为始终保持严格</text><text x="284.00" y="211.57" font-size="11.00" class="sc-loraregular">”</text><text x="287.84" y="211.57" font-size="11.00" class="sc-notoserifcjksc">，并且未能产生可被武器化的输出。</text><text x="72.00" y="260.72" font-size="11.00" class="sc-notoserifcjksc">此外，</text><text x="105.00" y="260.72" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Gray Swan</text><text x="162.45" y="260.72" font-size="11.00" class="sc-notoserifcjksc">在他们独立构建的一组任务上运行了一个自动化攻击者。他们的</text><text x="473.35" y="260.72" font-size="11.00" class="sc-loraregular">Shade</text><text x="507.28" y="260.72" font-size="11.00" class="sc-notoserifcjksc">攻击器</text><text x="72.00" y="276.34" font-size="11.00" class="sc-notoserifcjksc">基于多样化的红队策略进行训练，其中包括来源于</text><text x="316.89" y="276.34" font-size="11.00" class="sc-loraregular sc-k">Gray Swan Arena</text><text x="407.13" y="276.34" font-size="11.00" class="sc-notoserifcjksc">的真实世界攻击技术。他们</text><text x="72.00" y="291.96" font-size="11.00" class="sc-notoserifcjksc">在两个任务集上测试了</text><text x="184.89" y="291.96" font-size="11.00" class="sc-loraregular">Shade</text><text x="215.93" y="291.96" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="108.00" y="341.68" font-size="11.00" class="sc-lorabold">CVE</text><text x="130.22" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">：</text><text x="141.22" y="341.68" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="155.74" y="341.68" font-size="11.00" class="sc-notoserifcjksc">个场景，每个场景包含一个带有已知漏洞的单一代码文件。他们的攻击者能够让</text><text x="108.00" y="357.30" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="153.11" y="357.30" font-size="11.00" class="sc-notoserifcjksc">识别出这些漏洞，并在部分场景中编写演示这些漏洞的输入（这是我们当前政策</text><text x="108.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc">所允许的），但没有产生任何可用的漏洞利用。</text><text x="108.00" y="406.45" font-size="11.00" class="sc-notoserifcjkscbold">通过聊天套取知识：</text><text x="207.00" y="406.45" font-size="11.00" class="sc-notoserifcjksc">要求模型针对</text><text x="275.89" y="406.45" font-size="11.00" class="sc-loraregular">100</text><text x="296.45" y="406.45" font-size="11.00" class="sc-notoserifcjksc">条有害查询和</text><text x="365.35" y="406.45" font-size="11.00" class="sc-loraregular">100</text><text x="385.90" y="406.45" font-size="11.00" class="sc-notoserifcjksc">条两用查询提供信息的对话。他</text><text x="108.00" y="422.07" font-size="11.00" class="sc-notoserifcjksc">们的攻击者仅在两条两用查询上引出了有用信息，在其余</text><text x="385.89" y="422.07" font-size="11.00" class="sc-loraregular">198</text><text x="405.33" y="422.07" font-size="11.00" class="sc-notoserifcjksc">条上均告失败。</text><a href="https://10alabs.com/" rel="noopener"><rect x="108.00" y="187.15" width="16.51" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="124.51" y="187.15" width="2.89" height="11.00" fill="transparent"/></a><a href="https://10alabs.com/" rel="noopener"><rect x="127.40" y="187.15" width="23.77" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="105.00" y="251.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="105.00" y="251.92" width="24.43" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="129.43" y="251.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.grayswan.ai/" rel="noopener"><rect x="132.32" y="251.92" width="27.24" height="11.00" fill="transparent"/></a></svg></div>
