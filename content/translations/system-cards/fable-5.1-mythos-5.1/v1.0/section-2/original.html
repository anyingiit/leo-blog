<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p035.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 35 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">35</text><text x="72.00 83.00 94.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="107.89 114.80 121.04" y="82.61" font-size="11.00" class="sc-loraregular">RSP</text><text x="130.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.49 150.44 158.13" y="82.61" font-size="11.00" class="sc-loraregular">FCF</text><text x="167.05 178.05 189.05 200.05 211.05 222.05 233.05 244.05 255.05 266.05 277.05 288.05 299.05 310.05 321.05 332.05 343.05 354.05 365.05 376.05 387.05 398.05 409.05 420.05" y="82.61" font-size="11.00" class="sc-notoserifcjksc">规定，如果我们判定满足以下任一条件，即达到自动化</text><text x="433.94 440.83" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="447.41 458.41 469.41 480.41 491.41 502.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研发阈值：（</text><text x="513.41" y="82.61" font-size="11.00" class="sc-loraregular">1</text><text x="517.41 528.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">们的模型能够以有竞争力的成本（相差不超过五倍）完全替代</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="98.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的所有研究科学家和研</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">究工程师；或（</text><text x="149.00" y="113.85" font-size="11.00" class="sc-loraregular">2</text><text x="154.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="165.91 172.79" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="179.37 190.37 201.37 212.37 223.37 234.37 245.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">进展速度出现了</text><text x="256.37" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="260.77 271.77 282.77 293.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">剧烈加速</text><text x="304.77" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="308.61 319.61 330.61 341.61 352.61 363.61 374.61 385.61 396.61" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，且其原因很可能与</text><text x="410.50 417.39" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="423.97 434.97 445.97 456.97 467.97 478.97 489.97 500.97 511.97 522.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">研发的自动化有关。我</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">们的评估涵盖了这两个条件：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">关于替代（条件</text><text x="187.89" y="179.76" font-size="11.00" class="sc-lorabold">1</text><text x="192.36 203.36" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.36 225.36 236.36 247.36 258.36 269.36 280.36 291.36 302.36 313.36 324.36 335.36 346.36 357.36 368.36 379.36 390.36 401.36 412.36 423.36 434.36 445.36 456.36 467.36 478.36 489.36 500.36 511.36" y="179.76" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们作出判定时最重要的因素是：在发布前阶</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">段，我们在自己的日常研究和工程工作中广泛使用了</text><text x="363.89 373.83 379.69 383.95 390.53 396.97 402.06 404.96 410.95 413.66" y="195.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="417.66 428.66 439.66 450.66 461.66 472.66 483.66 494.66 505.66 516.66 527.66" y="195.38" font-size="11.00" class="sc-notoserifcjksc">，而它似乎远未能够替代</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">我们的研究科学家和研究工程师，尤其是相对资深的研究科学家和研究工程师。第</text><text x="506.89 512.80 515.51 521.63 524.34" y="211.00" font-size="11.00" class="sc-loraregular">2.3.3</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">节讨论了我们从</text><text x="187.89 195.58 198.57 204.18 210.75 217.33" y="226.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="226.18 237.18 248.18 259.18 270.18 281.18 292.18 303.18 314.18 325.18 336.18 347.18 358.18 369.18 380.18 391.18 402.18 413.18 424.18 435.18 446.18 457.18 468.18 479.18 490.18 501.18 512.18 523.18" y="226.62" font-size="11.00" class="sc-notoserifcjksc">在可比任务上未达到称职人类研究人员水平的案例中得出的概要</text><text x="108.00 119.00 130.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">观察。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">关于剧烈加速（条件</text><text x="209.89" y="293.11" font-size="11.00" class="sc-lorabold">2</text><text x="215.76 226.76" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="237.76 248.76 259.76 270.76 281.76 292.76 303.76 314.76 325.76 336.76" y="293.11" font-size="11.00" class="sc-notoserifcjksc">我们通过两种方式评估</text><text x="350.65 357.54" y="293.11" font-size="11.00" class="sc-loraregular">AI</text><text x="364.11 375.11 386.11 397.11 408.11 419.11 430.11 441.11 452.11 463.11 474.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">研发的进展速度。第一，</text><text x="485.11 492.00 498.58 502.83 509.42 514.11 520.54 527.11 530.20" y="293.11" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="108.00 114.84 122.53" y="308.73" font-size="11.00" class="sc-loraregular">ECI</text><text x="129.11" y="308.73" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="143.00 152.93 158.80 163.05 169.64 176.08 181.17 184.07 190.06 192.77" y="308.73" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="199.66 210.66 221.66 232.66 243.66 254.66 265.66 276.66 287.66 298.66 309.66 320.66 331.66 342.66 353.66 364.66 375.66 386.66 397.66 408.66 419.66 430.66 441.66 452.66 463.66 474.66" y="308.73" font-size="11.00" class="sc-notoserifcjksc">置于历史能力随时间变化的趋势线之上，但大致处于我们自</text><text x="488.56 496.24 499.24 504.85 511.41 517.99" y="308.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="324.35" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59 203.59 214.59 225.59 236.59 247.59 258.59 269.59 280.59 291.59 302.59 313.59 324.59 335.59 346.59 357.59 368.59 379.59 390.59 401.59 412.59 423.59 434.59 445.59 456.59 467.59 478.59 489.59 500.59 511.59 522.59" y="324.35" font-size="11.00" class="sc-notoserifcjksc">以来所看到的同一趋势上。我们认为这一数据点并不表明出现了进一步</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">加速。第二，我们在</text><text x="209.89 215.80 222.55 228.46" y="339.97" font-size="11.00" class="sc-loraregular">2026</text><text x="237.71" y="339.97" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="251.61" y="339.97" font-size="11.00" class="sc-loraregular">8</text><text x="260.68 271.68 282.68 293.68 304.68 315.68 326.68 337.68 348.68" y="339.97" font-size="11.00" class="sc-notoserifcjksc">月风险报告中讨论的</text><text x="362.57 369.46" y="339.97" font-size="11.00" class="sc-loraregular">AI</text><text x="376.04 387.04 398.04 409.04 420.04 431.04 442.04 453.04 464.04 475.04 486.04 497.04 508.04" y="339.97" font-size="11.00" class="sc-notoserifcjksc">驱动的研究加速内部衡量指标</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">（其中许多较为敏感，已从该报告的公开版本中删去）并未显示我们的进展速度出现持续</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="371.21" font-size="11.00" class="sc-notoserifcjksc">的、可归因于</text><text x="176.89 183.78" y="371.21" font-size="11.00" class="sc-loraregular">AI</text><text x="190.36" y="371.21" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="204.25 210.16" y="371.21" font-size="11.00" class="sc-loraregular">2×</text><text x="218.88 229.88 240.88" y="371.21" font-size="11.00" class="sc-notoserifcjksc">加速。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">近期模型已在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.60" y="438.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="226.85 237.85 248.85" y="438.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="259.85" y="438.83" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="273.74 279.92 282.63" y="438.83" font-size="11.00" class="sc-loraregular">8.3</text><text x="291.65 302.65 313.65 324.65 335.65 346.65 357.65 368.65 379.65 390.65 401.65 412.65 423.65 434.65" y="438.83" font-size="11.00" class="sc-notoserifcjksc">节所述的许多基于任务的自动化</text><text x="448.54 455.43" y="438.83" font-size="11.00" class="sc-loraregular">AI</text><text x="462.01 473.01 484.01 495.01 506.01 517.01 528.01" y="438.83" font-size="11.00" class="sc-notoserifcjksc">研发评估中超越</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">了最高的人类基线，这类任务的结果也已不再是我们</text><text x="327.89 334.80 341.04" y="454.45" font-size="11.00" class="sc-loraregular">RSP</text><text x="350.60" y="454.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="364.49 370.44 378.13" y="454.45" font-size="11.00" class="sc-loraregular">FCF</text><text x="387.05 398.05 409.05 420.05 431.05 442.05 453.05 464.05 475.05 486.05 497.05 508.05 519.05" y="454.45" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定中的重要组成部</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">分。因此，我们没有对</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96 231.95 234.66" y="470.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55" y="470.07" font-size="11.00" class="sc-notoserifcjksc">运行这些自动化评估。</text><text x="72.00 79.46 82.84 90.63 94.01 101.80 104.89 114.87 118.49 127.30 135.90 144.71 152.73 155.82 167.51 175.38 180.42 189.01 197.31 204.39 207.49 215.86 219.24" y="534.33" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3 Claude Mythos 5.1</text><text x="227.04 240.04 253.04 266.04 279.04" y="534.33" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">相对于人类</text><text x="72.00 85.00 98.00 111.00 124.00 137.00 150.00 163.00 176.00 189.00 202.00 215.00" y="556.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究人员在定性层面的不足</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="584.65" font-size="11.00" class="sc-notoserifcjksc">与以往的一些系统卡一样，我们收集并检视了</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 343.12 348.98 353.24 359.83 366.26 371.35 374.25 380.24 382.95" y="584.65" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="389.85 400.85 411.85 422.85 433.85 444.85 455.85 466.85 477.85 488.85 499.85 510.85 521.84" y="584.65" font-size="11.00" class="sc-notoserifcjksc">在真实内部使用中的案例，在</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="600.27" font-size="11.00" class="sc-notoserifcjksc">这些案例中，它的表现未达到我们对熟练人类研究人员的预期，或未能充分替代或自动化人类的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="615.89" font-size="11.00" class="sc-notoserifcjksc">指导。（其中许多问题与行为方面或与对齐（</text><text x="292.00 297.68 300.67 303.76 309.84 316.52 326.35 332.32 338.89" y="615.89" font-size="11.00" class="sc-loraregular">alignment</text><text x="343.15 354.15 365.15 376.15 387.15 398.15 409.15 420.15 431.15 442.15 453.15 464.15 475.15 486.15 497.15 508.15 519.15" y="615.89" font-size="11.00" class="sc-notoserifcjksc">）相关的问题有关，但这些问题仍以某</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="631.51" font-size="11.00" class="sc-notoserifcjksc">种方式限制了我们在内部利用该模型实现工作自动化的能力，因此与能力评估相关。）</text><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="140.89" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="140.89" y="430.03" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="176.29" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="179.18" y="430.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="206.15" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="209.04" y="430.03" width="14.92" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="223.95" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="226.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="237.85" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="237.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="248.85" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="248.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00 77.86 80.42 86.58 89.14 95.15 97.71 102.17 105.06 112.63 118.57 125.84 131.75 138.77 144.46" y="335.99" font-size="11.00" class="sc-lorabold">2.3.4.1 CoBench</text><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们在本系统卡中不引用具体示例，但总体而言，我们发现与</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="82.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73 436.73 447.73 458.73 469.73 480.73 491.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研究人员相比，</text><text x="502.73 512.66 518.52 522.78 529.37 535.80" y="82.61" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00 80.70" y="98.23" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60 98.60 109.60 120.60 131.60 142.60 153.60 164.60 175.60 186.60 197.60 208.60 219.60 230.60 241.60 252.60 263.60 274.60 285.60 296.60 307.60 318.60 329.60 340.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc">仍有许多弱点，尽管这些弱点比以往一些模型的要小。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们观察到的主要问题集中在认知质量和指令遵循方面：</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06 394.06 396.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">经常把容易核实的猜测当作</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">事实陈述，夸大其工作的完整程度，未能核实重要论断，或忽视人类给出的关键指令。我们还看</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">到一些明显的策略性错误，例如反复尝试不起作用的操作。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在以往模型中较为突出的某些类型的问题，在</text><text x="294.89 304.83 310.69 314.95 321.54 327.97 333.06 335.96 341.95 344.66" y="228.34" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55 494.55 505.55 516.55 527.55" y="228.34" font-size="11.00" class="sc-notoserifcjksc">中较少出现。例如，我们看到的鲁莽行</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">为实例更少，这是更好的对齐与对可能具有破坏性的工具使用施加的更强内部管控共同作用的结</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">果。我们观察到的最大一类相关问题与</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="259.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18 311.18 322.18 333.18 344.18 355.18 366.18 377.18 388.18 399.18" y="259.58" font-size="11.00" class="sc-notoserifcjksc">破坏自己的工作有关。</text><text x="72.00 79.46 82.84 90.63 94.01 102.60 105.70 115.00" y="307.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4 AI</text><text x="121.71 134.71 147.71 160.71 173.71 186.71 199.71 212.71 225.71 238.71 251.71" y="307.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部衡量指标</text><text x="72.00 83.00 94.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">如我们</text><text x="107.89 113.80 120.55 126.46" y="351.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="135.71" y="351.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="149.61" y="351.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="158.68 169.68 180.68 191.68 202.68" y="351.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="213.68" y="351.72" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="227.57 233.70 236.41" y="351.72" font-size="11.00" class="sc-loraregular">3.4</text><text x="245.26 256.26 267.26 278.26 289.26 300.26 311.26 322.26 333.26 344.26 355.26 366.26 377.26" y="351.72" font-size="11.00" class="sc-notoserifcjksc">节所述，我们开发了一项名为</text><text x="391.15 398.84 405.01 411.86 417.82 424.49 430.35" y="351.72" font-size="11.00" class="sc-loraregular">CoBench</text><text x="439.83 450.83 461.83 472.83 483.83 494.83 505.83 516.83 527.83" y="351.72" font-size="11.00" class="sc-notoserifcjksc">的内部评估，旨在衡</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">量模型在真实内部研发任务上的进展。它衡量的是：将模型置于</text><text x="382.89 389.78 396.36 400.61 407.20 411.89 418.32 424.89 427.98" y="367.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="367.34" font-size="11.00" class="sc-notoserifcjksc">基础设施的某个历史</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">型能在多大程度上诊断出</text><text x="195.89 202.78 209.36 213.61 220.20 224.89 231.32 237.89 240.98" y="398.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="249.73 260.73 271.73 282.73 293.73 304.73 315.73 326.73 337.73 348.73 359.73 370.73 381.73 392.73 403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="398.58" font-size="11.00" class="sc-notoserifcjksc">工程师实际解决过的问题的根本原因。问题由模型评分，所</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">用评分细则将解答与我们在实践中确定的根本原因进行比较（该根本原因在被评估模型可获取的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="429.82" font-size="11.00" class="sc-notoserifcjksc">历史快照中不可见）。我们的</text><text x="217.89 223.80 230.55 236.46" y="429.82" font-size="11.00" class="sc-loraregular">2026</text><text x="245.71" y="429.82" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="259.61" y="429.82" font-size="11.00" class="sc-loraregular">8</text><text x="268.68 279.68 290.68 301.68 312.68 323.68 334.68 345.68 356.68 367.68 378.68 389.68 400.68 411.68 422.68 433.68 444.68 455.68" y="429.82" font-size="11.00" class="sc-notoserifcjksc">月风险报告对这项评估有更详细的描述。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="107.89" y="34 49" y="379.63" font-size="9.00" class="sc-loraregular">8</text><text x="214.92 223.92 232.92 241.92 250.92 259.92" y="379.63" font-size="9.00" class="sc-notoserifcjksc">月风险报告第</text><text x="271.29 276.30 278.51" y="379.63" font-size="9.00" class="sc-loraregular">3.4</text><text x="285.76 294.76 303.76 312.76 321.76 330.76 339.76 348.76 357.76 366.76 375.76 384.76 393.76 402.76 411.76 420.76 429.76 438.76 447.76 456.76 465.76 474.76 483.76 492.76 501.76 510.76 519.76 528.76" y="379.63" font-size="9.00" class="sc-notoserifcjksc">节中对应图表所用的问题集略大，因此二者不可直接比较，但我</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00 315.00 324.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">们认为这些新增问题对该评估的绝对得分没有很大影响。请注意，</text><text x="333.00 341.13 345.92 349.41 354.80 360.06 364.23 366.60 371.50 373.72" y="391.33" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="379.36 388.36 397.36 406.36 415.36 424.36 433.36 442.36 451.36 460.36 469.36 478.36" y="391.33" font-size="9.00" class="sc-notoserifcjksc">不同于风险报告中称为模型</text><text x="489.73" y="391.33" font-size="9.00" class="sc-loraregular">1</text><text x="495.37 504.37 513.37" y="391.33" font-size="9.00" class="sc-notoserifcjksc">和模型</text><text x="524.74" y="391.33" font-size="9.00" class="sc-loraregular">2</text><text x="531.94" y="391.33" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00 270.00 279.00 288.00 297.00 306.00" y="403.03" font-size="9.00" class="sc-notoserifcjksc">模型；如该报告所述，我们没有公开发布这两个模型的计划。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="459.97" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06 196.06 198.76" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="205.66 216.66 227.66 238.66 249.66 260.66" y="459.97" font-size="11.00" class="sc-notoserifcjksc">的得分略低于</text><text x="274.55 282.24 285.23 290.85 297.41 303.99 309.95 312.85 321.58 328.15 334.71 339.81 342.70" y="459.97" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="348.69 359.69" y="459.97" font-size="11.00" class="sc-notoserifcjksc">，比</text><text x="373.59 383.52 389.38 393.64 400.23 406.66 411.76 414.65" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="423.54 434.54 445.54 456.54 467.54 478.54" y="459.97" font-size="11.00" class="sc-notoserifcjksc">高出一些（而</text><text x="492.43 502.36 508.23 512.48 519.07 525.51 530.60 533.49" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="475.59" font-size="11.00" class="sc-notoserifcjksc">在此前一次不可直接比较的该评估运行中，得分又比</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 376.12 381.98 386.24 392.83 399.26 404.35 407.25 413.91 418.60 424.51 430.06 433.15 439.07" y="475.59" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="450.77 461.77 472.77 483.77 494.77 505.77 516.77 527.77" y="475.59" font-size="11.00" class="sc-notoserifcjksc">低一些）。相对于</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="491.21" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74 121.74 132.74 143.74 154.74 165.74 176.74 187.74 198.74 209.74 220.74 231.74 242.74 253.74 264.74 275.74 286.74 297.74 308.74 319.74 330.74 341.74 352.74 363.74 374.74 385.74 396.74 407.74 418.74 429.74 440.74 451.74 462.74 473.74 484.74 495.74 506.74 517.74 528.74" y="491.21" font-size="11.00" class="sc-notoserifcjksc">的较低表现可能是这项特定评估造成的假象，因为我们的定性感受是，在内部执行这类工</text><text x="72.00 83.00 94.00" y="506.83" font-size="11.00" class="sc-notoserifcjksc">作时，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="506.83" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66" y="506.83" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="175.55 184.29 190.85 197.42 202.51 205.41" y="506.83" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="522.45" font-size="11.00" class="sc-notoserifcjksc">是，在这些评估对话记录中，</text><text x="215.00 224.93 230.80 235.05 241.64 248.08 253.17 256.06 262.06 264.76" y="522.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="271.66 282.66 293.66 304.66" y="522.45" font-size="11.00" class="sc-notoserifcjksc">在相同的</text><text x="318.55 322.81 329.25 335.08 341.04" y="522.45" font-size="11.00" class="sc-loraregular">token</text><text x="350.61 361.61 372.61 383.61 394.61 405.61 416.61 427.61 438.61 449.61 460.61 471.61 482.61 493.61 504.61 515.61 526.61" y="522.45" font-size="11.00" class="sc-notoserifcjksc">预算下倾向于进行略短的调查。我们认</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="538.07" font-size="11.00" class="sc-notoserifcjksc">为此类效应对</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="538.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="197.55 208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55" y="538.07" font-size="11.00" class="sc-notoserifcjksc">的绝对得分没有很大影响。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="621.90" font-size="11.00" class="sc-notoserifcjksc">如我们在风险报告中所述，我们认为，一个能够完全替代</text><text x="349.89 356.78 363.36 367.61 374.20 378.89 385.32 391.89 394.98" y="621.90" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.73 414.73 425.73 436.73 447.73 458.73 469.73 480.73 491.73 502.73 513.73 524.73" y="621.90" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型在这项评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="637.52" font-size="11.00" class="sc-notoserifcjksc">中应能取得至少</text><text x="151.89 158.07 164.07" y="637.52" font-size="11.00" class="sc-loraregular">85%</text><text x="176.53 187.53 198.53 209.53 220.53 231.53 242.53 253.53 264.53 275.53 286.53 297.53 308.53 319.53 330.53 341.53 352.53" y="637.52" font-size="11.00" class="sc-notoserifcjksc">的得分（并且可能高得多），这是表明</text><text x="366.43 376.36 382.22 386.48 393.07 399.50 404.60 407.49 413.48 416.19" y="637.52" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="423.09 434.09 445.09 456.09 467.09 478.09 489.09 500.09 511.09 522.09" y="637.52" font-size="11.00" class="sc-notoserifcjksc">并不满足这一标准的又</text><text x="72.00 83.00 94.00 105.00" y="653.14" font-size="11.00" class="sc-notoserifcjksc">一证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00 77.86 80.43 86.59 89.15 95.17 97.73 103.59 106.49 113.83" y="82.61" font-size="11.00" class="sc-lorabold">2.3.4.2 AI</text><text x="120.98 131.98 142.98 153.98 164.98 175.98 186.98 197.98 208.98 219.98" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">研发加速的综合性指标</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">除了对单个模型的评估之外，我们还尝试衡量内部</text><text x="316.89 323.78" y="114.99" font-size="11.00" class="sc-loraregular">AI</text><text x="330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="114.99" font-size="11.00" class="sc-notoserifcjksc">研发进展随时间推移的总体加速程度；我们</text><text x="72.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="171.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="184.89 191.02 193.73" y="130.61" font-size="11.00" class="sc-loraregular">3.5</text><text x="202.61 213.61 224.61 235.61 246.61 257.61 268.61 279.61 290.61 301.61 312.61 323.61 334.61 345.61 356.61 367.61 378.61 389.61 400.61 411.61 422.61 433.61 444.61 455.61 466.61 477.61 488.61 499.61 510.61 521.61" y="130.61" font-size="11.00" class="sc-notoserifcjksc">节中简要讨论了这些持续进行的衡量工作，不过我们针对此类加速的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 2 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00 508.88" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是我们所采用的全部评估中最需要判断力和开放式推理的评估。</text><text x="425.75 429.70 439.63 445.49 449.75 456.34 462.78 467.87 470.76 476.76 479.46 483.32" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="490.17 501.17 512.17 523.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">这一表面</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的相对弱点，与我们为本次评估所访谈的</text><text x="329.64 336.53 343.11 347.36 353.95 358.64 365.07 371.64 374.73" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="383.48 394.48 405.48 416.48 427.48 438.48 449.48 460.48 471.48 482.48 493.48 504.48 515.48 526.48" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研究人员所报告的定性印象相一</text><text x="117.75 128.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">致。</text><text x="117.75 128.75 139.75 150.75 161.75 172.75 183.75 194.75 205.75 216.75 227.75 238.75 249.75 260.75 271.75 282.75" y="168.16" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">基于现有证据，我们得出以下结论：</text><text x="144.75 148.70 158.63 164.50 168.75 175.34 181.78 186.87 189.76 195.76 198.46 202.32" y="187.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="209.17 220.17 231.17 242.17 253.17 264.17 275.17 286.17 297.17 308.17 319.17 330.17 341.17 352.17 363.17" y="187.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">很可能比当前的公开模型能力更强</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75" y="203.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与当前的前沿模型类似，</text><text x="265.75 269.70 272.59 282.53 288.39 292.65 299.23 305.67 310.76 313.66 319.65 322.36 326.22" y="203.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[ Mythos 5.1]</text><text x="333.06 344.06 355.06 366.06 377.06 388.06 399.06 410.06 421.06 432.06 443.06 454.06 465.06 476.06 487.06 498.06 509.06 520.06" y="203.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">尤其擅长具有明确、连续的成功指标且客</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75" y="219.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">观反馈充足的任务</text><text x="144.75 155.75 166.75 177.75" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">特别是，</text><text x="188.75 192.70 202.63 208.49 212.75 219.34 225.78 230.87 233.76 239.76 242.46 246.32" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="253.17" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="267.06 273.82 280.39 286.97 293.00 298.88 303.14 306.03 314.36 320.04 326.71 333.15 341.52 348.18 355.22 358.12 364.29 370.86 376.76 382.67 389.25 394.01 400.58" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Budget NanoGPT Speedrun</text><text x="410.15 421.15 432.15 443.15 454.15 465.15" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的表现，与</text><text x="479.04 485.93" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="492.50 503.50 514.50 525.50" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发相关</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75" y="252.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的特定能力出现超出趋势的提升相一致</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75 397.75 408.75 419.75 430.75 441.75 452.75 463.75 474.75" y="269.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">尽管对此存在不确定性，但我们目前推测，仅凭这些能力尚不足以实现</text><text x="488.64 495.53" y="269.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="502.11 513.11 524.11" y="269.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发的</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75 331.75 342.75 353.75 364.75 375.75 386.75" y="285.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">完全自动化或剧烈加速。我们初步认为，相当一部分</text><text x="400.64 407.53" y="285.13" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="414.11 425.11 436.11 447.11 458.11 469.11 480.11 491.11 502.11 513.11 524.11" y="285.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发工作往往是在比评估</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75" y="318.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">特别是，我们预计</text><text x="271.64 278.53" y="318.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="285.11 296.11 307.11 318.11 329.11 340.11 351.11 362.11 373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11" y="318.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发工作更依赖于远见、预测、构建自己的反馈回</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">路，以及更广泛地说，其他通常可被称为研究者</text><text x="411.75" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="416.15 427.15 438.15" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">判断力</text><text x="449.15" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="452.99" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">或</text><text x="463.99" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="468.39 479.39" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">品味</text><text x="490.39" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="494.23 505.23 516.23 527.23" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的技能。</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">本次评估的证据表明，</text><text x="254.75 258.70 261.59 271.52 277.39 281.64 288.23 294.67 299.76 302.65 308.65 311.36 315.22" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[ Mythos 5.1]</text><text x="322.06 333.06 344.06 355.06" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这些与</text><text x="366.06" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="370.46 381.46 392.46 403.46 414.46 425.46" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研究者判断力</text><text x="436.46" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="440.30 451.30 462.30 473.30 484.30 495.30 506.30 517.30 528.30" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相关的技能上仍低于</text><text x="144.75 155.75 166.75 177.75 188.75" y="367.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">专家水平。</text><text x="144.75 155.75 166.75" y="384.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">因此，</text><text x="177.75 188.75 199.75 210.75" y="384.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们认为</text><text x="224.64 228.89 239.21 245.27 249.81 256.64 262.87 268.20 271.10 277.04 279.60 284.07" y="384.31" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">[Mythos 5.1]</text><text x="291.20 302.20 313.20 324.20 335.20 346.20 357.20 368.20 379.20 390.20 401.20 412.20 423.20 434.20 445.20 456.20 467.20 478.20 489.20 500.20 511.20 522.20" y="384.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">很可能无法完全且可靠地自动化跨越数周的前沿项</text><text x="144.75 155.75 166.75 177.75 188.75 199.75" y="399.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">目的研发工作</text><text x="210.75" y="399.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。</text><text x="144.75 155.75 166.75 177.75 188.75" y="417.11" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与此同时，</text><text x="199.75 210.75 221.75 232.75" y="417.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们认为</text><text x="246.64 250.89 261.21 267.27 271.81 278.64 284.87 290.20 293.10 299.04 301.60 306.07" y="417.11" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">[Mythos 5.1]</text><text x="313.20 324.20 335.20 346.20 357.20 368.20 379.20 390.20 401.20 412.20 423.20 434.20 445.20 456.20 467.20 478.20 489.20 500.20 511.20 522.20" y="417.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">仍很可能明显加速研究人员的工作，并自动化</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75" y="432.73" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">研发的某些有限方面</text><text x="243.75 254.75 265.75 276.75 287.75 298.75 309.75 320.75" y="432.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。例如，我们预计</text><text x="334.64 338.59 348.53 354.39 358.65 365.23 371.67 376.76 379.66 385.65 388.36 392.22" y="432.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="399.06 410.06 421.06 432.06" y="432.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">很可能比</text><text x="445.95 455.89 461.75 466.01 472.59 479.03 484.12 487.02 493.68 498.37 504.27 509.83 512.92 518.84" y="432.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="144.75 155.75 166.75 177.75 188.75 199.75 210.75 221.75 232.75 243.75 254.75" y="448.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">带来更高的生产力提升。</text><text x="180.75" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="194.64 202.33 205.32 210.93 217.50 224.08 230.04 232.93 242.87 248.73 252.99 259.58 266.01 271.10 274.00 280.66 285.35 291.26 296.81 299.90 305.82" y="466.31" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="317.52 328.52 339.52 350.52" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的系统卡</text><text x="361.52" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="372.52 378.43 385.18 391.09" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">2026</text><text x="400.34" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">年</text><text x="414.24" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">4</text><text x="423.09" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">月</text><text x="436.98" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7</text><text x="444.95 455.95 466.95 477.95" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">日）中，</text><text x="488.95 495.83 502.41 506.67 513.26 517.94 524.38 530.95 534.04" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">就其技术人员使用</text><text x="271.64 281.58 287.44 291.70 298.29 304.72 309.81 312.71 319.37 324.06 329.97 335.52 338.61 344.53" y="481.93" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="356.23 367.23 378.23 389.23 400.23 411.23 422.23" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相对于完全没有</text><text x="436.13 443.01" y="481.93" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">辅助时所体验到的</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75 290.75 301.75 312.75 323.75 334.75 345.75 356.75 367.75 378.75 389.75 400.75" y="497.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">生产力提升进行了调查。回答的几何平均数约为</text><text x="414.64 420.61" y="497.55" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">4x</text><text x="429.33 440.33 451.33 462.33" y="497.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">量级，但</text><text x="476.22 483.11 489.68 493.94 500.53 505.22 511.65 518.22 521.31" y="497.55" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="180.75 191.75 202.75 213.75 224.75 235.75 246.75 257.75 268.75 279.75" y="513.17" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">估计整体进展倍数低于</text><text x="293.64 299.55" y="513.17" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">2x</text><text x="305.38 316.38 327.38 338.38 349.38 360.38 371.38 382.38" y="513.17" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。我们推测，最初</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="194.64" y="457.51" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="194.64" y="457.51" width="35.40" height="11.00" fill="transpar <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00 508.88" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="180.75 191.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">关于</text><text x="205.64 215.58 221.44 225.70 232.29 238.72 243.81 246.71 253.37 258.06 263.96 269.52 272.61 278.53" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="290.23 301.23 312.23 323.23 334.23 345.23 356.23 367.23 378.23 389.23 400.23 411.23 422.23 433.23 444.23 455.23 466.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">生产力提升的自我报告可能被高估了。</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75" y="115.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">需要明确的是，我们并未将评估</text><text x="373.64 380.53 387.11 391.36 397.95 402.64 409.07 415.64 418.73" y="115.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="427.48 438.48 449.48 460.48 471.48 482.48 493.48 504.48 515.48 526.48" y="115.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">计算进展倍数或生产力</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75 414.75 425.75 436.75 447.75" y="130.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">提升的方法论纳入本次评估的范围，也没有尝试对</text><text x="461.64 465.59 475.52 481.39 485.64 492.23 498.67 503.76 506.65 512.65 515.36 519.22" y="130.96" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="526.06" y="130.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75 326.75 337.75 348.75 359.75 370.75 381.75 392.75 403.75" y="146.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">预期生产力提升给出定量估计。我们引用</text><text x="417.64 424.53 431.11 435.36 441.95 446.64 453.07 459.64 462.73" y="146.58" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="471.48 482.48 493.48 504.48 515.48 526.48" y="146.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">此前系统卡中</text><text x="216.75 227.75 238.75 249.75 260.75 271.75 282.75 293.75 304.75 315.75" y="162.20" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的这些数据仅供参考。</text><text x="72.00 79.46 82.84 90.63 94.01" y="247.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23 117.23" y="247.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="275.35" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 234.35 237.05" y="275.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="243.95 254.95 265.95 276.95 287.95 298.95" y="275.35" font-size="11.00" class="sc-notoserifcjksc">并未跨越我们</text><text x="312.85 319.75 325.99" y="275.35" font-size="11.00" class="sc-loraregular">RSP</text><text x="335.55" y="275.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="349.44 355.39 363.08" y="275.35" font-size="11.00" class="sc-loraregular">FCF</text><text x="372.00 383.00 394.00 405.00 416.00 427.00" y="275.35" font-size="11.00" class="sc-notoserifcjksc">中关于自动化</text><text x="440.90 447.78" y="275.35" font-size="11.00" class="sc-loraregular">AI</text><text x="454.36 465.36 476.36 487.36 498.36 509.36 520.36" y="275.35" font-size="11.00" class="sc-notoserifcjksc">研发剧烈加速的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="290.97" font-size="11.00" class="sc-notoserifcjksc">能力阈值，尽管我们认为它在许多情况下能为</text><text x="294.89 301.78" y="290.97" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="290.97" font-size="11.00" class="sc-notoserifcjksc">研发工作带来有意义的加速，并且在该领域的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="306.59" font-size="11.00" class="sc-notoserifcjksc">力在一定程度上强于我们以往系统卡中所描述的模型。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="356.31" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与以往模型一样，最重要的一项是：我们已在自己的日常工作中大量</text><text x="72.00 83.00" y="371.93" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 143.95 146.66" y="371.93" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="371.93" font-size="11.00" class="sc-notoserifcjksc">，而它似乎还远不能完全替代我们的研究科学家和研究工程师，尤其是相对资深</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="387.55" font-size="11.00" class="sc-notoserifcjksc">的人员。此外，无论是</text><text x="184.89 191.78 198.36 202.61 209.20 213.89 220.32 226.89 229.98 235.83 238.73 245.57 253.26" y="387.55" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="259.84 270.84 281.84 292.84 303.84 314.84 325.84 336.84 347.84 358.84 369.84 380.84 391.84 402.84 413.84 424.84 435.84 446.84 457.84 468.84 479.84 490.84 501.84 512.84 523.84" y="387.55" font-size="11.00" class="sc-notoserifcjksc">轨迹还是我们内部的研究加速衡量指标，都未显示出我们</text><text x="72.00" y="403.17" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.78" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36 110.36 121.36 132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36" y="403.17" font-size="11.00" class="sc-notoserifcjksc">进展速度出现了可归因于</text><text x="223.25 230.14" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="236.71 247.71 258.71 269.71 280.71 291.71" y="403.17" font-size="11.00" class="sc-notoserifcjksc">的剧烈加速。</text><text x="302.71 312.65 318.51 322.77 329.36 335.79 340.88 343.78 349.77 352.48" y="403.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="359.38 370.38 381.38 392.38 403.38 414.38 425.38 436.38" y="403.17" font-size="11.00" class="sc-notoserifcjksc">推进了前沿，其在</text><text x="450.27 457.15" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="463.73 474.73 485.73 496.73 507.73 518.73 529.73" y="403.17" font-size="11.00" class="sc-notoserifcjksc">研发方面的能力</text><text x="72.00" y="418.79" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="418.79" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14" y="418.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="188.03 195.72 198.71 204.32 210.89 217.46 223.43 226.32 235.05 241.62 248.19 253.28 256.17" y="418.79" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="265.06 276.06 287.06 298.06 309.06 320.06 331.06 342.06 353.06 364.06 375.06 386.06 397.06 408.06 419.06 430.06 441.06 452.06 463.06 474.06 485.06 496.06 507.06 518.06 529.06" y="418.79" font-size="11.00" class="sc-notoserifcjksc">相当或略强。我们将继续寻找自动化驱动的加速的迹象，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="434.41" font-size="11.00" class="sc-notoserifcjksc">并预计将继续发布这方面工作的观察结果（不过其中许多评估与单个模型的发布关联不那么紧</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">密，可能会发布在系统卡以外的文档中，例如我们的风险报告或</text><text x="382.89 389.93 396.52 402.48 405.38 412.26 418.84 423.10 429.69 434.37 440.81 447.37 450.47 456.32 459.21 462.81 469.48 474.58 478.83 482.10 486.36 492.93 497.18" y="450.03" font-size="11.00" class="sc-loraregular">The Anthropic Institute</text><text x="506.04 517.04 528.04" y="450.03" font-size="11.00" class="sc-notoserifcjksc">的出版</text><text x="72.00 83.00 94.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">物，如</text><text x="107.89 112.29 123.48 130.07 136.03 142.71 145.60 152.49 156.17 159.07 165.47 172.03 175.12 178.12 184.70 189.79 192.68 195.95 200.21 205.30 211.26 214.25 217.97" y="465.65" font-size="11.00" class="sc-loraregular" fill="#0000ff">“When AI builds itself”</text><text x="221.81 232.81" y="465.65" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00 80.04 83.68" y="552.01" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26 110.26 124.26 138.26 152.26 166.26" y="552.01" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00 79.46 82.84 91.43 94.82" y="589.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61 154.61 167.61 180.61 193.61 206.61 219.61 232.61" y="589.11" font-siz
