<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p035.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 35 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">35</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们的</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular">RSP</text><text x="130.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.49 150.44 158.13" y="82.61" font-size="11.00" class="sc-loraregular">FCF</text><text x="167.05" y="82.61" font-size="11.00" class="sc-notoserifcjksc">规定，如果我们判定满足以下任一条件，即达到自动化</text><text x="433.94" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="447.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研发阈值：（</text><text x="513.41" y="82.61" font-size="11.00" class="sc-loraregular">1</text><text x="517.41" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）我</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">们的模型能够以有竞争力的成本（相差不超过五倍）完全替代</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="98.23" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的所有研究科学家和研</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">究工程师；或（</text><text x="149.00" y="113.85" font-size="11.00" class="sc-loraregular">2</text><text x="154.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="165.91" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="179.37" y="113.85" font-size="11.00" class="sc-notoserifcjksc">进展速度出现了</text><text x="256.37" y="113.85" font-size="11.00" class="sc-loraregular">“</text><text x="260.77" y="113.85" font-size="11.00" class="sc-notoserifcjksc">剧烈加速</text><text x="304.77" y="113.85" font-size="11.00" class="sc-loraregular">”</text><text x="308.61" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，且其原因很可能与</text><text x="410.50" y="113.85" font-size="11.00" class="sc-loraregular">AI</text><text x="423.97" y="113.85" font-size="11.00" class="sc-notoserifcjksc">研发的自动化有关。我</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">们的评估涵盖了这两个条件：</text><text x="108.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">关于替代（条件</text><text x="187.89" y="179.76" font-size="11.00" class="sc-lorabold">1</text><text x="192.36" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="214.36" y="179.76" font-size="11.00" class="sc-notoserifcjksc">与以往模型一样，我们作出判定时最重要的因素是：在发布前阶</text><text x="108.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">段，我们在自己的日常研究和工程工作中广泛使用了</text><text x="363.89 373.83 379.69 383.95 390.53 396.97 402.06 404.96 410.95 413.66" y="195.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="417.66" y="195.38" font-size="11.00" class="sc-notoserifcjksc">，而它似乎远未能够替代</text><text x="108.00" y="211.00" font-size="11.00" class="sc-notoserifcjksc">我们的研究科学家和研究工程师，尤其是相对资深的研究科学家和研究工程师。第</text><text x="506.89" y="211.00" font-size="11.00" class="sc-loraregular">2.3.3</text><text x="108.00" y="226.62" font-size="11.00" class="sc-notoserifcjksc">节讨论了我们从</text><text x="187.89 195.58 198.57 204.18 210.75 217.33" y="226.62" font-size="11.00" class="sc-loraregular">Claude</text><text x="226.18" y="226.62" font-size="11.00" class="sc-notoserifcjksc">在可比任务上未达到称职人类研究人员水平的案例中得出的概要</text><text x="108.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">观察。</text><text x="108.00" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">关于剧烈加速（条件</text><text x="209.89" y="293.11" font-size="11.00" class="sc-lorabold">2</text><text x="215.76" y="293.11" font-size="11.00" class="sc-notoserifcjkscbold">）。</text><text x="237.76" y="293.11" font-size="11.00" class="sc-notoserifcjksc">我们通过两种方式评估</text><text x="350.65" y="293.11" font-size="11.00" class="sc-loraregular">AI</text><text x="364.11" y="293.11" font-size="11.00" class="sc-notoserifcjksc">研发的进展速度。第一，</text><text x="485.11 492.00 498.58 502.83 509.42 514.11 520.54 527.11 530.20" y="293.11" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="108.00" y="308.73" font-size="11.00" class="sc-loraregular">ECI</text><text x="129.11" y="308.73" font-size="11.00" class="sc-notoserifcjksc">将</text><text x="143.00 152.93 158.80 163.05 169.64 176.08 181.17 184.07 190.06 192.77" y="308.73" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="199.66" y="308.73" font-size="11.00" class="sc-notoserifcjksc">置于历史能力随时间变化的趋势线之上，但大致处于我们自</text><text x="488.56 496.24 499.24 504.85 511.41 517.99" y="308.73" font-size="11.00" class="sc-loraregular">Claude</text><text x="108.00 117.93 123.80 128.05 134.64 141.08 146.17 149.06 155.73 160.42 166.32 171.88 174.97 180.89" y="324.35" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="192.59" y="324.35" font-size="11.00" class="sc-notoserifcjksc">以来所看到的同一趋势上。我们认为这一数据点并不表明出现了进一步</text><text x="108.00" y="339.97" font-size="11.00" class="sc-notoserifcjksc">加速。第二，我们在</text><text x="209.89 215.80 222.55 228.46" y="339.97" font-size="11.00" class="sc-loraregular">2026</text><text x="237.71" y="339.97" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="251.61" y="339.97" font-size="11.00" class="sc-loraregular">8</text><text x="260.68" y="339.97" font-size="11.00" class="sc-notoserifcjksc">月风险报告中讨论的</text><text x="362.57" y="339.97" font-size="11.00" class="sc-loraregular">AI</text><text x="376.04" y="339.97" font-size="11.00" class="sc-notoserifcjksc">驱动的研究加速内部衡量指标</text><text x="108.00" y="355.59" font-size="11.00" class="sc-notoserifcjksc">（其中许多较为敏感，已从该报告的公开版本中删去）并未显示我们的进展速度出现持续</text><text x="108.00" y="371.21" font-size="11.00" class="sc-notoserifcjksc">的、可归因于</text><text x="176.89" y="371.21" font-size="11.00" class="sc-loraregular">AI</text><text x="190.36" y="371.21" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="204.25" y="371.21" font-size="11.00" class="sc-loraregular">2×</text><text x="218.88" y="371.21" font-size="11.00" class="sc-notoserifcjksc">加速。</text><text x="72.00" y="438.83" font-size="11.00" class="sc-notoserifcjksc">近期模型已在</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.60" y="438.83" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="226.85" y="438.83" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="259.85" y="438.83" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="273.74" y="438.83" font-size="11.00" class="sc-loraregular">8.3</text><text x="291.65" y="438.83" font-size="11.00" class="sc-notoserifcjksc">节所述的许多基于任务的自动化</text><text x="448.54" y="438.83" font-size="11.00" class="sc-loraregular">AI</text><text x="462.01" y="438.83" font-size="11.00" class="sc-notoserifcjksc">研发评估中超越</text><text x="72.00" y="454.45" font-size="11.00" class="sc-notoserifcjksc">了最高的人类基线，这类任务的结果也已不再是我们</text><text x="327.89" y="454.45" font-size="11.00" class="sc-loraregular">RSP</text><text x="350.60" y="454.45" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="364.49 370.44 378.13" y="454.45" font-size="11.00" class="sc-loraregular">FCF</text><text x="387.05" y="454.45" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定中的重要组成部</text><text x="72.00" y="470.07" font-size="11.00" class="sc-notoserifcjksc">分。因此，我们没有对</text><text x="184.89 194.83 200.69 204.95 211.54 217.97 223.06 225.96 231.95 234.66" y="470.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="241.55" y="470.07" font-size="11.00" class="sc-notoserifcjksc">运行这些自动化评估。</text><text x="72.00" y="534.33" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3 Claude Mythos 5.1</text><text x="227.04" y="534.33" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">相对于人类</text><text x="72.00" y="556.76" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研究人员在定性层面的不足</text><text x="72.00" y="584.65" font-size="11.00" class="sc-notoserifcjksc">与以往的一些系统卡一样，我们收集并检视了</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 343.12 348.98 353.24 359.83 366.26 371.35 374.25 380.24 382.95" y="584.65" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="389.85" y="584.65" font-size="11.00" class="sc-notoserifcjksc">在真实内部使用中的案例，在</text><text x="72.00" y="600.27" font-size="11.00" class="sc-notoserifcjksc">这些案例中，它的表现未达到我们对熟练人类研究人员的预期，或未能充分替代或自动化人类的</text><text x="72.00" y="615.89" font-size="11.00" class="sc-notoserifcjksc">指导。（其中许多问题与行为方面或与对齐（</text><text x="292.00 297.68 300.67 303.76 309.84 316.52 326.35 332.32 338.89" y="615.89" font-size="11.00" class="sc-loraregular">alignment</text><text x="343.15" y="615.89" font-size="11.00" class="sc-notoserifcjksc">）相关的问题有关，但这些问题仍以某</text><text x="72.00" y="631.51" font-size="11.00" class="sc-notoserifcjksc">种方式限制了我们在内部利用该模型实现工作自动化的能力，因此与能力评估相关。）</text><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="140.89" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="140.89" y="430.03" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="176.29" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="179.18" y="430.03" width="26.96" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="206.15" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="209.04" y="430.03" width="14.92" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="223.95" y="430.03" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="226.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="237.85" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="237.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="248.85" y="430.03" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-opus-4-6-system-card" rel="noopener"><rect x="248.85" y="430.03" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00 77.86 80.42 86.58 89.14 95.15 97.71 102.17 105.06 112.63 118.57 125.84 131.75 138.77 144.46" y="335.99" font-size="11.00" class="sc-lorabold">2.3.4.1 CoBench</text><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">36</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们在本系统卡中不引用具体示例，但总体而言，我们发现与</text><text x="371.89 378.78 385.36 389.61 396.20 400.89 407.32 413.89 416.98" y="82.61" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="425.73" y="82.61" font-size="11.00" class="sc-notoserifcjksc">研究人员相比，</text><text x="502.73 512.66 518.52 522.78 529.37 535.80" y="82.61" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00" y="98.23" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60" y="98.23" font-size="11.00" class="sc-notoserifcjksc">仍有许多弱点，尽管这些弱点比以往一些模型的要小。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们观察到的主要问题集中在认知质量和指令遵循方面：</text><text x="347.00 356.93 362.80 367.05 373.64 380.08 385.17 388.06 394.06 396.76" y="147.38" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="403.66" y="147.38" font-size="11.00" class="sc-notoserifcjksc">经常把容易核实的猜测当作</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">事实陈述，夸大其工作的完整程度，未能核实重要论断，或忽视人类给出的关键指令。我们还看</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">到一些明显的策略性错误，例如反复尝试不起作用的操作。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">在以往模型中较为突出的某些类型的问题，在</text><text x="294.89 304.83 310.69 314.95 321.54 327.97 333.06 335.96 341.95 344.66" y="228.34" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="351.55" y="228.34" font-size="11.00" class="sc-notoserifcjksc">中较少出现。例如，我们看到的鲁莽行</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">为实例更少，这是更好的对齐与对可能具有破坏性的工具使用施加的更强内部管控共同作用的结</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">果。我们观察到的最大一类相关问题与</text><text x="261.89 269.58 272.57 278.18 284.75 291.33" y="259.58" font-size="11.00" class="sc-loraregular">Claude</text><text x="300.18" y="259.58" font-size="11.00" class="sc-notoserifcjksc">破坏自己的工作有关。</text><text x="72.00" y="307.65" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4 AI</text><text x="121.71" y="307.65" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">研发加速的内部衡量指标</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">如我们</text><text x="107.89 113.80 120.55 126.46" y="351.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="135.71" y="351.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="149.61" y="351.72" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="158.68" y="351.72" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="213.68" y="351.72" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="227.57" y="351.72" font-size="11.00" class="sc-loraregular">3.4</text><text x="245.26" y="351.72" font-size="11.00" class="sc-notoserifcjksc">节所述，我们开发了一项名为</text><text x="391.15 398.84 405.01 411.86 417.82 424.49 430.35" y="351.72" font-size="11.00" class="sc-loraregular">CoBench</text><text x="439.83" y="351.72" font-size="11.00" class="sc-notoserifcjksc">的内部评估，旨在衡</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">量模型在真实内部研发任务上的进展。它衡量的是：将模型置于</text><text x="382.89 389.78 396.36 400.61 407.20 411.89 418.32 424.89 427.98" y="367.34" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="436.73" y="367.34" font-size="11.00" class="sc-notoserifcjksc">基础设施的某个历史</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">型能在多大程度上诊断出</text><text x="195.89 202.78 209.36 213.61 220.20 224.89 231.32 237.89 240.98" y="398.58" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="249.73" y="398.58" font-size="11.00" class="sc-notoserifcjksc">工程师实际解决过的问题的根本原因。问题由模型评分，所</text><text x="72.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">用评分细则将解答与我们在实践中确定的根本原因进行比较（该根本原因在被评估模型可获取的</text><text x="72.00" y="429.82" font-size="11.00" class="sc-notoserifcjksc">历史快照中不可见）。我们的</text><text x="217.89 223.80 230.55 236.46" y="429.82" font-size="11.00" class="sc-loraregular">2026</text><text x="245.71" y="429.82" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="259.61" y="429.82" font-size="11.00" class="sc-loraregular">8</text><text x="268.68" y="429.82" font-size="11.00" class="sc-notoserifcjksc">月风险报告对这项评估有更详细的描述。</text><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="107.89" y="342.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="107.89" y="342.92" width="24.93" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="132.82" y="342.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="135.71" y="342.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="146.71" y="342.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="149.61" y="342.92" width="6.18" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="155.79" y="342.92" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="158.68" y="342.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="169.68" y="342.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="169.68" y="342.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="180.68" y="342.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="180.68" y="342.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="191.68" y="342.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="191.68" y="342.92" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="202.68" y="342.92" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="202.68" y="342.92" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p037.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 37 页"><text x="504.00 508.80" y="751.81" font-size="9.00" class="sc-loraregular">37</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.79 107.89 111.55 113.64 119.18 122.65 125.02 131.21 134.02 138.74 144.30 149.66 154.50 156.87 165.31 170.27 173.99 179.58 184.67 189.04 191.40 196.26 198.36" y="367.93" font-size="9.00" class="sc-lorabold">2.3.4.1.A] Claude Mythos 5.1</text><text x="204.38" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="215.75 221.94 226.81 232.76 237.60 243.34 248.00" y="367.93" font-size="9.00" class="sc-lorabold">CoBench</text><text x="255.96" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">评估中的得分略低于</text><text x="339.33" y="367.93" font-size="9.00" class="sc-lorabold">Claude Opus 5</text><text x="400.66" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">，高于</text><text x="430.03 436.22 439.03 443.75 449.31 454.67 459.51 461.88 470.32 475.28 479.00 484.59 489.68 494.05 496.41" y="367.93" font-size="9.00" class="sc-lorabold">Claude Mythos 5</text><text x="501.27" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。上述得</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">分所基于的问题集比我们</text><text x="173.37 178.20 183.73 188.56" y="379.63" font-size="9.00" class="sc-loraregular">2026</text><text x="196.13" y="379.63" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="207.49" y="379.63" font-size="9.00" class="sc-loraregular">8</text><text x="214.92" y="379.63" font-size="9.00" class="sc-notoserifcjksc">月风险报告第</text><text x="271.29" y="379.63" font-size="9.00" class="sc-loraregular">3.4</text><text x="285.76" y="379.63" font-size="9.00" class="sc-notoserifcjksc">节中对应图表所用的问题集略大，因此二者不可直接比较，但我</text><text x="72.00" y="391.33" font-size="9.00" class="sc-notoserifcjksc">们认为这些新增问题对该评估的绝对得分没有很大影响。请注意，</text><text x="333.00 341.13 345.92 349.41 354.80 360.06 364.23 366.60 371.50 373.72" y="391.33" font-size="9.00" class="sc-loraregular">Mythos 5.1</text><text x="379.36" y="391.33" font-size="9.00" class="sc-notoserifcjksc">不同于风险报告中称为模型</text><text x="489.73" y="391.33" font-size="9.00" class="sc-loraregular">1</text><text x="495.37" y="391.33" font-size="9.00" class="sc-notoserifcjksc">和模型</text><text x="524.74" y="391.33" font-size="9.00" class="sc-loraregular">2</text><text x="531.94" y="391.33" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="72.00" y="403.03" font-size="9.00" class="sc-notoserifcjksc">模型；如该报告所述，我们没有公开发布这两个模型的计划。</text><text x="72.00" y="459.97" font-size="11.00" class="sc-notoserifcjksc">在这项评估中，</text><text x="149.00 158.93 164.80 169.05 175.64 182.08 187.17 190.06 196.06 198.76" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="205.66" y="459.97" font-size="11.00" class="sc-notoserifcjksc">的得分略低于</text><text x="274.55 282.24 285.23 290.85 297.41 303.99 309.95 312.85 321.58 328.15 334.71 339.81 342.70" y="459.97" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="348.69" y="459.97" font-size="11.00" class="sc-notoserifcjksc">，比</text><text x="373.59 383.52 389.38 393.64 400.23 406.66 411.76 414.65" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="423.54" y="459.97" font-size="11.00" class="sc-notoserifcjksc">高出一些（而</text><text x="492.43 502.36 508.23 512.48 519.07 525.51 530.60 533.49" y="459.97" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="72.00" y="475.59" font-size="11.00" class="sc-notoserifcjksc">在此前一次不可直接比较的该评估运行中，得分又比</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 376.12 381.98 386.24 392.83 399.26 404.35 407.25 413.91 418.60 424.51 430.06 433.15 439.07" y="475.59" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="450.77" y="475.59" font-size="11.00" class="sc-notoserifcjksc">低一些）。相对于</text><text x="72.00" y="491.21" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="491.21" font-size="11.00" class="sc-notoserifcjksc">的较低表现可能是这项特定评估造成的假象，因为我们的定性感受是，在内部执行这类工</text><text x="72.00" y="506.83" font-size="11.00" class="sc-notoserifcjksc">作时，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="506.83" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66" y="506.83" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="175.55" y="506.83" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="72.00" y="522.45" font-size="11.00" class="sc-notoserifcjksc">是，在这些评估对话记录中，</text><text x="215.00 224.93 230.80 235.05 241.64 248.08 253.17 256.06 262.06 264.76" y="522.45" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="271.66" y="522.45" font-size="11.00" class="sc-notoserifcjksc">在相同的</text><text x="318.55 322.81 329.25 335.08 341.04" y="522.45" font-size="11.00" class="sc-loraregular">token</text><text x="350.61" y="522.45" font-size="11.00" class="sc-notoserifcjksc">预算下倾向于进行略短的调查。我们认</text><text x="72.00" y="538.07" font-size="11.00" class="sc-notoserifcjksc">为此类效应对</text><text x="140.89 150.83 156.69 160.95 167.54 173.97 179.06 181.96 187.95 190.66" y="538.07" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="197.55" y="538.07" font-size="11.00" class="sc-notoserifcjksc">的绝对得分没有很大影响。</text><text x="72.00" y="621.90" font-size="11.00" class="sc-notoserifcjksc">如我们在风险报告中所述，我们认为，一个能够完全替代</text><text x="349.89 356.78 363.36 367.61 374.20 378.89 385.32 391.89 394.98" y="621.90" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="403.73" y="621.90" font-size="11.00" class="sc-notoserifcjksc">研究人员的模型在这项评估</text><text x="72.00" y="637.52" font-size="11.00" class="sc-notoserifcjksc">中应能取得至少</text><text x="151.89" y="637.52" font-size="11.00" class="sc-loraregular">85%</text><text x="176.53" y="637.52" font-size="11.00" class="sc-notoserifcjksc">的得分（并且可能高得多），这是表明</text><text x="366.43 376.36 382.22 386.48 393.07 399.50 404.60 407.49 413.48 416.19" y="637.52" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="423.09" y="637.52" font-size="11.00" class="sc-notoserifcjksc">并不满足这一标准的又</text><text x="72.00" y="653.14" font-size="11.00" class="sc-notoserifcjksc">一证据。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">38</text><text x="72.00" y="82.61" font-size="11.00" class="sc-lorabold">2.3.4.2 AI</text><text x="120.98" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">研发加速的综合性指标</text><text x="72.00" y="114.99" font-size="11.00" class="sc-notoserifcjksc">除了对单个模型的评估之外，我们还尝试衡量内部</text><text x="316.89" y="114.99" font-size="11.00" class="sc-loraregular">AI</text><text x="330.36" y="114.99" font-size="11.00" class="sc-notoserifcjksc">研发进展随时间推移的总体加速程度；我们</text><text x="72.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="83.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="171.00" y="130.61" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="184.89" y="130.61" font-size="11.00" class="sc-loraregular">3.5</text><text x="202.61" y="130.61" font-size="11.00" class="sc-notoserifcjksc">节中简要讨论了这些持续进行的衡量工作，不过我们针对此类加速的</text><text x="72.00" y="146.23" font-size="11.00" class="sc-notoserifcjksc">许多先行指标较为敏感，已从公开报告中删去。这项评估与单个模型发布的关联没有那么紧密，</text><text x="72.00" y="161.85" font-size="11.00" class="sc-notoserifcjksc">而是以我们研究和模型开发的总体轨迹为依据。</text><text x="72.00" y="228.34" font-size="11.00" class="sc-notoserifcjksc">如我们在</text><text x="118.89 124.80 131.55 137.46" y="228.34" font-size="11.00" class="sc-loraregular">2026</text><text x="146.71" y="228.34" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="160.60" y="228.34" font-size="11.00" class="sc-loraregular">8</text><text x="169.68" y="228.34" font-size="11.00" class="sc-notoserifcjksc">月风险报告中所述，我们认为对近期</text><text x="348.57" y="228.34" font-size="11.00" class="sc-loraregular">AI</text><text x="362.04" y="228.34" font-size="11.00" class="sc-notoserifcjksc">模型的内部使用一直是维持当前进展</text><text x="72.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">速度的关键因素，但我们尚未看到超出这一速度的剧烈加速的明确迹象。截至本系统卡发布之</text><text x="72.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">时，我们的评估仍与风险报告中的这些结论一致，不过正如该报告所指出的，我们针对这一阈值</text><text x="72.00" y="342.03" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.5 AECI</text><text x="138.39" y="342.03" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">能力轨迹</text><text x="72.00" y="367.91" font-size="11.00" class="sc-notoserifcjksc">我们使用</text><text x="118.89 125.78 132.36 136.61 143.20 147.89 154.32 160.89 163.98 169.83 172.73 179.57 187.26" y="367.91" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="190.94" y="367.91" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="201.94" y="367.91" font-size="11.00" class="sc-loraregular">AECI</text><text x="227.04" y="367.91" font-size="11.00" class="sc-notoserifcjksc">）追踪我们的模型随时间推移的能力提升速度，它是</text><text x="482.94 489.70 496.27 502.70 508.56 515.15 518.04 524.92" y="367.91" font-size="11.00" class="sc-loraregular">Epoch AI</text><text x="72.00" y="383.53" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.66 99.22 105.66 111.51 118.10 120.99 128.68 134.36 140.93 146.60 153.00 156.10 159.09 162.35 166.61 169.70 175.66 180.76 183.65 187.25 193.92 200.50 206.41" y="383.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Epoch Capabilities Index</text><text x="215.13" y="383.53" font-size="11.00" class="sc-notoserifcjksc">的一个分支版本；关于我们的方法详见</text><text x="405.03 412.71 415.71 421.32 427.88 434.46 440.42 443.32 453.25 459.11 463.37 469.96 476.39" y="383.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos</text><text x="484.38 491.05 495.73 501.64 507.19 510.28 516.20" y="383.53" font-size="11.00" class="sc-loraregular" fill="#0000ff">Preview</text><text x="527.91" y="383.53" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系</text><text x="72.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">统卡</text><text x="94.00" y="399.15" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="107.89 113.80 116.51 122.63 125.23" y="399.15" font-size="11.00" class="sc-loraregular">2.3.6</text><text x="134.48" y="399.15" font-size="11.00" class="sc-notoserifcjksc">节。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 120.22 126.09 130.34 136.93 143.37 148.46 151.35 157.35 160.05" y="432.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="166.95" y="432.68" font-size="11.00" class="sc-notoserifcjksc">的得分高于历史趋势线，高出的幅度与其他近期</text><text x="400.85 410.78 416.64 420.90 427.49 433.92" y="432.68" font-size="11.00" class="sc-loraregular">Mythos</text><text x="441.91" y="432.68" font-size="11.00" class="sc-notoserifcjksc">级模型相近。我们不</text><text x="72.00" y="448.30" font-size="11.00" class="sc-notoserifcjksc">认为这表明相对于我们已在</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 255.12 260.98 265.24 271.83 278.26 283.35 286.25 292.91 297.60 303.51 309.06 312.15 318.07" y="448.30" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="329.77" y="448.30" font-size="11.00" class="sc-notoserifcjksc">上观察到的情况出现了进一步的斜率变化。</text><a href="https://www.anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="83.00" y="121.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="83.00" y="121.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="94.00" y="121.81" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="94.00" y="121.81" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/aug-2026-risk-report" rel="noopener"><rect x="105.00" y="121.81" width="0.00 <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p039.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 39 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">39</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.78 100.87 105.73 107.83 113.36 116.84 119.21 124.72 130.13 135.23 139.89 145.48 147.84 154.04 158.75 164.16 168.88 174.03 176.98 179.78 182.69 186.41 189.35 194.19 198.56 200.93 204.31 210.05 215.42 220.26" y="390.43" font-size="9.00" class="sc-lorabold">2.3.5.A] Epoch Capabilities Index</text><text x="225.19" y="390.43" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="234.19" y="390.43" font-size="9.00" class="sc-loraregular">ECI</text><text x="249.09" y="390.43" font-size="9.00" class="sc-notoserifcjksc">）将多项基准测试上的表现综合为每个模型的单一数值。我们对该指标的</text><text x="72.00" y="402.13" font-size="9.00" class="sc-notoserifcjksc">版本，即</text><text x="110.37 116.33 122.02 125.74 131.33 135.58 140.67 146.08 149.02 153.68 156.05 161.67 167.86" y="402.13" font-size="9.00" class="sc-lorabold">Anthropic ECI</text><text x="171.34" y="402.13" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="180.34" y="402.13" font-size="9.00" class="sc-lorabold">AECI</text><text x="201.65" y="402.13" font-size="9.00" class="sc-notoserifcjkscbold">）</text><text x="210.65" y="402.13" font-size="9.00" class="sc-notoserifcjksc">，以内部基准测试结果为基础，因此得分不能与</text><text x="402.01 407.55 412.92 418.19 422.97" y="402.13" font-size="9.00" class="sc-loraregular">Epoch</text><text x="430.73" y="402.13" font-size="9.00" class="sc-notoserifcjksc">公开的</text><text x="460.10" y="402.13" font-size="9.00" class="sc-loraregular">ECI</text><text x="477.37" y="402.13" font-size="9.00" class="sc-notoserifcjksc">排行榜直接比</text><text x="72. "sc-notoserifcjksc" fill="#1d1c1d">关于趋势及以往模型能力的背景信息，尤其是我们近期发布的</text><text x="441.75" y="290.19" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">前沿风险报告</text><text x="144.75" y="305.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="155.75 161.67 166.35 172.79 179.37 183.62 186.71 192.68 197.44 200.33 207.24 210.33 215.43 221.33 224.23 231.06 237.02 243.58 250.02 254.86" y="305.81" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Frontier Risk Report</text><text x="259.12" y="305.81" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）中所报告的内容</text><text x="117.75" y="343.00" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">我们还在少量评估上测试了</text><text x="252.64 256.59 266.53 272.39 276.65 283.23 289.67 294.76 297.66 303.65 306.36 310.22" y="343.00" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="314.17" y="343.00" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">，以补充我们的主要证据来源。为此，</text><text x="117.75 124.64 131.21 135.47 142.06 146.75 153.18 159.75 162.84" y="358.62" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="171.58" y="358.62" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="185.48" y="358.62" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">10</text><text x="199.20" y="358.62" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">个工作日内向我们提供了推理过程可见的</text><text x="400.10 406.98 413.59" y="358.62" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">API</text><text x="420.17" y="358.62" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">访问权限。我们使用了</text><text x="117.75" y="374.24" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">以下任务和基准测试：</text><text x="144.75" y="411.48" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">Sunlight</text><text x="186.93" y="411.48" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">：一项衡量智能体开展开放式研究并撰写相应报告之能力的任务</text><text x="144.75 151.56 158.08 164.19 169.88 175.13 179.14 182.03 190.24 196.26 203.03 208.76 217.04 223.61 230.61 233.50 239.58 245.86 251.11 256.36 262.46 267.47 273.99" y="444.21" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">Budget NanoGPT Speedrun</text><text x="280.75" y="444.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">：热门</text><text x="316.65" y="444.21" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="330.11" y="444.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发竞赛</text><text x="377.00 385.33 391.01 397.68 404.12 412.49 419.16 426.20 429.09 435.26 441.83 447.73 453.64 460.22 464.98 471.55" y="444.21" font-size="11.00" class="sc-loraregular" fill="#0000ff">NanoGPT Speedrun</text><text x="481.12" y="444.21" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的一个受限</text><text x="144.75" y="459.83" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">版本</text><text x="144.75 151.10 157.12 163.89 169.59 176.11 182.14 187.84 193.08 195.98 205.91 211.64 217.75 222.99 226.11 229.00 236.55 242.28 249.04 254.24 259.49 265.77 269.78 276.30 282.33 285.44 288.33 295.19 300.19 305.89 312.41 322.05 327.30 334.06 338.06 344.09 348.10 351.66 357.39" y="476.95" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">Language Model Conceptual Argumentation</text><text x="364.16" y="476.95" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="375.16 381.50 391.48 399.03" y="476.95" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">LMCA</text><text x="405.97" y="476.95" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）：一个概念推理数据集，</text><text x="144.75" y="492.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">描述见</text><text x="180.64 187.58 190.48 196.58 202.61 206.61 212.64 217.35 222.60 226.60 229.49 235.23 238.80 241.69 246.52 252.55 256.55 261.80 267.91 270.80 276.00 281.73 288.50 293.70 298.95 305.23 309.23 315.76 321.78 324.90 327.79 333.82 338.82 344.52 351.04 360.68 365.93 372.69 376.70" y="492.57" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">A dataset of rated conceptual arguments</text><text x="381.40" y="492.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="392.40 400.09 406.53 412.96 419.53 425.49 430.25 433.15 439.03 443.29 446.18 451.86 454.85 457.56 460.33 463.22 469.13 475.88 481.79" y="492.57" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Cooper et al., 2026</text><text x="488.16" y="492.57" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">）</text><text x="117.75 121.70 131.63 137.49 141.75 148.34 154.78 159.87 162.76 168.76 171.46 175.32" y="546.13" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="182.17" y="546.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这些任务上总体优于公开模型。它在</text><text x="372.06 378.87 385.39 391.50 397.19 402.44 406.45 409.34 417.54 423.57 430.34 436.07 444.35 450.92 457.91 460.81 466.89 473.17 478.42 483.67 489.77 494.78 501.30" y="546.13" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">Budget NanoGPT Speedrun</text><text x="510.96" y="546.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的</text><text x="117.75" y="561.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">表现尤为突出，明显优于</text><text x="241.64 249.33 252.32 257.93 264.50 271.08 277.04 279.93 285.52 291.20 297.60 300.59 306.55 309.45" y="561.75" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Fable 5</text><text x="318.34" y="561.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="332.23 339.92 342.91 348.52 355.09 361.66 367.63 370.52 379.25 385.82 392.39 397.48 400.37" y="561.75" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Claude Opus 5</text><text x="406.37" y="561.75" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（不过我们认为，这些模型</text><text x="117.75" y="577.37" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的训练有可能专门针对类似</text><text x="252.64 259.41 265.98 272.55 278.58 284.47 288.72 291.62 299.94 305.62 312.30 318.73 327.10 333.77 340.81 343.70 349.87 356.44 362.35 368.25 374.83 379.59 386.16" y="577.37" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Budget NanoGPT Speedrun</text><text x="395.73" y="577.37" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的任务进行了优化）。然而，</text><text x="117.75" y="592.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">我们仍观察到</text><text x="186.64 190.59 200.52 206.39 210.64 217.23 223.67 228.76 231.65 237.65 240.36 244.22" y="592.99" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="251.06" y="592.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="264.95" y="592.99" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">Sunlight</text><text x="310.03" y="592.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">和</text><text x="323.92 330.27 340.25 347.79" y="592.99" font-size="11.00" class="sc-loraitalic" fill="#1d1c1d">LMCA</text><text x="357.63" y="592.99" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的表现低于专家水平。这些</text><text x="72.00" y="662.07" font-size="6.00" class="sc-loraregular">1</text><text x="76.81" y="665.40" font-size="10.00" class="sc-notoserifcjksc">请注意，我们的工作旨在收集与</text><text x="219.44" y="665.40" font-size="10.00" class="sc-loraregular">AI</text><text x="231.68" y="665.40" font-size="10.00" class="sc-notoserifcjksc">研发能力相关的证据，而并非用于核实有关是否符合</text><text x="464.31 470.57 476.55 480.42 486.41 490.67 496.52 502.49 505.30" y="665.40" font-size="10.00" class="sc-loraregular">Anthropic</text><text x="513.25" y="665.40" font-size="10.00" class="sc-notoserifcjksc">政策</text><text x="72.00" y="679.60" font-size="10.00" class="sc-notoserifcjksc">中任何特定阈值的主张。</text><text x="72.00" y="690.47" font-size="6.00" class="sc-loraregular">2</text><text x="77.85" y="693.80" font-size="10.00" class="sc-notoserifcjksc">我们还使用了一个目前无法披露的额外信息来源。我们借助该来源，使我们对该模型能力上限的判断更有</text><text x="72.00" y="708.00" font-size="10.00" class="sc-notoserifcjksc">信心。</text><a href="https://metr.org/" rel="noopener"><rect x="107.89" y="102.23" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/" rel="noopener"><rect x="107.89" y="102.23" width="30.89" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="441.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="452.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="463.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="474.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="485.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="281.39" width="0.00" height="11.00" fill="transparent"/></a><a href="https://metr.org/blog/2026-05-19-frontier-risk-report/#executive-summary-and-guide-to-the-report" rel="noopener"><rect x="496.75" y="281.39" width="11.00" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="377.00" y="435.41" width="0.00" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="377.00" y="435.41" width="49.19" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="426.20" y="435.41" width="2.89" height="11.00" fill="transparent"/></a><a href="https://github.com/kellerjordan/modded-nanogpt" rel="noopener"><rect x="429.09" y="435.41" width="49.14" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="504.00" y="751.81" font-size="9.00" class="sc-loraregular">41</text><text x="117.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">是我们所采用的全部评估中最需要判断力和开放式推理的评估。</text><text x="425.75 429.70 439.63 445.49 449.75 456.34 462.78 467.87 470.76 476.76 479.46 483.32" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="490.17" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">这一表面</text><text x="117.75" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的相对弱点，与我们为本次评估所访谈的</text><text x="329.64 336.53 343.11 347.36 353.95 358.64 365.07 371.64 374.73" y="98.23" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="383.48" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研究人员所报告的定性印象相一</text><text x="117.75" y="113.85" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">致。</text><text x="117.75" y="168.16" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">基于现有证据，我们得出以下结论：</text><text x="144.75 148.70 158.63 164.50 168.75 175.34 181.78 186.87 189.76 195.76 198.46 202.32" y="187.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="209.17" y="187.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">很可能比当前的公开模型能力更强</text><text x="144.75" y="203.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与当前的前沿模型类似，</text><text x="265.75 269.70 272.59 282.53 288.39 292.65 299.23 305.67 310.76 313.66 319.65 322.36 326.22" y="203.91" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[ Mythos 5.1]</text><text x="333.06" y="203.91" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">尤其擅长具有明确、连续的成功指标且客</text><text x="144.75" y="219.53" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">观反馈充足的任务</text><text x="144.75" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">特别是，</text><text x="188.75 192.70 202.63 208.49 212.75 219.34 225.78 230.87 233.76 239.76 242.46 246.32" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="253.17" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="267.06 273.82 280.39 286.97 293.00 298.88 303.14 306.03 314.36 320.04 326.71 333.15 341.52 348.18 355.22 358.12 364.29 370.86 376.76 382.67 389.25 394.01 400.58" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Budget NanoGPT Speedrun</text><text x="410.15" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">上的表现，与</text><text x="479.04" y="236.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="492.50" y="236.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发相关</text><text x="144.75" y="252.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的特定能力出现超出趋势的提升相一致</text><text x="144.75" y="269.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">尽管对此存在不确定性，但我们目前推测，仅凭这些能力尚不足以实现</text><text x="488.64" y="269.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="502.11" y="269.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发的</text><text x="144.75" y="285.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">完全自动化或剧烈加速。我们初步认为，相当一部分</text><text x="400.64" y="285.13" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="414.11" y="285.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发工作往往是在比评估</text><text x="180.75" y="318.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">特别是，我们预计</text><text x="271.64" y="318.71" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="285.11" y="318.71" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研发工作更依赖于远见、预测、构建自己的反馈回</text><text x="180.75" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">路，以及更广泛地说，其他通常可被称为研究者</text><text x="411.75" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="416.15" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">判断力</text><text x="449.15" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="452.99" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">或</text><text x="463.99" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="468.39" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">品味</text><text x="490.39" y="334.33" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="494.23" y="334.33" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的技能。</text><text x="144.75" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">本次评估的证据表明，</text><text x="254.75 258.70 261.59 271.52 277.39 281.64 288.23 294.67 299.76 302.65 308.65 311.36 315.22" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[ Mythos 5.1]</text><text x="322.06" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在这些与</text><text x="366.06" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">“</text><text x="370.46" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">研究者判断力</text><text x="436.46" y="351.51" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">”</text><text x="440.30" y="351.51" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相关的技能上仍低于</text><text x="144.75" y="367.13" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">专家水平。</text><text x="144.75" y="384.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">因此，</text><text x="177.75" y="384.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们认为</text><text x="224.64 228.89 239.21 245.27 249.81 256.64 262.87 268.20 271.10 277.04 279.60 284.07" y="384.31" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">[Mythos 5.1]</text><text x="291.20" y="384.31" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">很可能无法完全且可靠地自动化跨越数周的前沿项</text><text x="144.75" y="399.93" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">目的研发工作</text><text x="210.75" y="399.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。</text><text x="144.75" y="417.11" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">与此同时，</text><text x="199.75" y="417.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">我们认为</text><text x="246.64 250.89 261.21 267.27 271.81 278.64 284.87 290.20 293.10 299.04 301.60 306.07" y="417.11" font-size="11.00" class="sc-lorabold" fill="#1d1c1d">[Mythos 5.1]</text><text x="313.20" y="417.11" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">仍很可能明显加速研究人员的工作，并自动化</text><text x="144.75" y="432.73" font-size="11.00" class="sc-notoserifcjkscbold" fill="#1d1c1d">研发的某些有限方面</text><text x="243.75" y="432.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。例如，我们预计</text><text x="334.64 338.59 348.53 354.39 358.65 365.23 371.67 376.76 379.66 385.65 388.36 392.22" y="432.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="399.06" y="432.73" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">很可能比</text><text x="445.95 455.89 461.75 466.01 472.59 479.03 484.12 487.02 493.68 498.37 504.27 509.83 512.92 518.84" y="432.73" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="144.75" y="448.35" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">带来更高的生产力提升。</text><text x="180.75" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">在</text><text x="194.64 202.33 205.32 210.93 217.50 224.08 230.04 232.93 242.87 248.73 252.99 259.58 266.01 271.10 274.00 280.66 285.35 291.26 296.81 299.90 305.82" y="466.31" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="317.52" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">的系统卡</text><text x="361.52" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">（</text><text x="372.52 378.43 385.18 391.09" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">2026</text><text x="400.34" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">年</text><text x="414.24" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">4</text><text x="423.09" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">月</text><text x="436.98" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">7</text><text x="444.95" y="466.31" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">日）中，</text><text x="488.95 495.83 502.41 506.67 513.26 517.94 524.38 530.95 534.04" y="466.31" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="180.75" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">就其技术人员使用</text><text x="271.64 281.58 287.44 291.70 298.29 304.72 309.81 312.71 319.37 324.06 329.97 335.52 338.61 344.53" y="481.93" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="356.23" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">相对于完全没有</text><text x="436.13" y="481.93" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">AI</text><text x="449.59" y="481.93" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">辅助时所体验到的</text><text x="180.75" y="497.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">生产力提升进行了调查。回答的几何平均数约为</text><text x="414.64" y="497.55" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">4x</text><text x="429.33" y="497.55" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">量级，但</text><text x="476.22 483.11 489.68 493.94 500.53 505.22 511.65 518.22 521.31" y="497.55" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="180.75" y="513.17" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">估计整体进展倍数低于</text><text x="293.64" y="513.17" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">2x</text><text x="305.38" y="513.17" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">。我们推测，最初</text><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="194.64" y="457.51" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="194.64" y="457.51" width="35.40" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="230.04" y="457.51" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="232.93" y="457.51" width="38.17" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="271.10" y="457.51" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="274.00" y="457.51" width="40.63" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="314.63" y="457.51" width="2.89" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="317.52" y="457.51" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="328.52" y="457.51" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="328.52" y="457.51" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="339.52" y="457.51" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="339.52" y="457.51" width="11.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="350.52" y="457.51" width="0.00" height="11.00" fill="transparent"/></a><a href="https://cdn.sanity.io/files/4zrzovbb/website/7624816413e9b4d2e3ba620c5a5e091b98b190a5.pdf" rel="noopener"><rect x="350.52" y="457.51" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">42</text><text x="180.75" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">关于</text><text x="205.64 215.58 221.44 225.70 232.29 238.72 243.81 246.71 253.37 258.06 263.96 269.52 272.61 278.53" y="82.61" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Mythos Preview</text><text x="290.23" y="82.61" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">生产力提升的自我报告可能被高估了。</text><text x="216.75" y="115.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">需要明确的是，我们并未将评估</text><text x="373.64 380.53 387.11 391.36 397.95 402.64 409.07 415.64 418.73" y="115.34" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="427.48" y="115.34" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">计算进展倍数或生产力</text><text x="216.75" y="130.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">提升的方法论纳入本次评估的范围，也没有尝试对</text><text x="461.64 465.59 475.52 481.39 485.64 492.23 498.67 503.76 506.65 512.65 515.36 519.22" y="130.96" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">[Mythos 5.1]</text><text x="526.06" y="130.96" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的</text><text x="216.75" y="146.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">预期生产力提升给出定量估计。我们引用</text><text x="417.64 424.53 431.11 435.36 441.95 446.64 453.07 459.64 462.73" y="146.58" font-size="11.00" class="sc-loraregular" fill="#1d1c1d">Anthropic</text><text x="471.48" y="146.58" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">此前系统卡中</text><text x="216.75" y="162.20" font-size="11.00" class="sc-notoserifcjksc" fill="#1d1c1d">的这些数据仅供参考。</text><text x="72.00" y="247.46" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.7</text><text x="104.23" y="247.46" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="275.35" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00 156.69 159.68 165.29 171.86 178.44 184.40 187.29 197.22 203.09 207.34 213.93 220.37 225.46 228.35 234.35 237.05" y="275.35" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="243.95" y="275.35" font-size="11.00" class="sc-notoserifcjksc">并未跨越我们</text><text x="312.85" y="275.35" font-size="11.00" class="sc-loraregular">RSP</text><text x="335.55" y="275.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="349.44 355.39 363.08" y="275.35" font-size="11.00" class="sc-loraregular">FCF</text><text x="372.00" y="275.35" font-size="11.00" class="sc-notoserifcjksc">中关于自动化</text><text x="440.90" y="275.35" font-size="11.00" class="sc-loraregular">AI</text><text x="454.36" y="275.35" font-size="11.00" class="sc-notoserifcjksc">研发剧烈加速的</text><text x="72.00" y="290.97" font-size="11.00" class="sc-notoserifcjksc">能力阈值，尽管我们认为它在许多情况下能为</text><text x="294.89" y="290.97" font-size="11.00" class="sc-loraregular">AI</text><text x="308.36" y="290.97" font-size="11.00" class="sc-notoserifcjksc">研发工作带来有意义的加速，并且在该领域的能</text><text x="72.00" y="306.59" font-size="11.00" class="sc-notoserifcjksc">力在一定程度上强于我们以往系统卡中所描述的模型。</text><text x="72.00" y="356.31" font-size="11.00" class="sc-notoserifcjksc">我们的结论基于两项发现。与以往模型一样，最重要的一项是：我们已在自己的日常工作中大量</text><text x="72.00" y="371.93" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89 106.83 112.69 116.95 123.54 129.97 135.06 137.96 143.95 146.66" y="371.93" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="150.66" y="371.93" font-size="11.00" class="sc-notoserifcjksc">，而它似乎还远不能完全替代我们的研究科学家和研究工程师，尤其是相对资深</text><text x="72.00" y="387.55" font-size="11.00" class="sc-notoserifcjksc">的人员。此外，无论是</text><text x="184.89 191.78 198.36 202.61 209.20 213.89 220.32 226.89 229.98 235.83 238.73 245.57 253.26" y="387.55" font-size="11.00" class="sc-loraregular">Anthropic ECI</text><text x="259.84" y="387.55" font-size="11.00" class="sc-notoserifcjksc">轨迹还是我们内部的研究加速衡量指标，都未显示出我们</text><text x="72.00" y="403.17" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="99.36" y="403.17" font-size="11.00" class="sc-notoserifcjksc">进展速度出现了可归因于</text><text x="223.25" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="236.71" y="403.17" font-size="11.00" class="sc-notoserifcjksc">的剧烈加速。</text><text x="302.71 312.65 318.51 322.77 329.36 335.79 340.88 343.78 349.77 352.48" y="403.17" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="359.38" y="403.17" font-size="11.00" class="sc-notoserifcjksc">推进了前沿，其在</text><text x="450.27" y="403.17" font-size="11.00" class="sc-loraregular">AI</text><text x="463.73" y="403.17" font-size="11.00" class="sc-notoserifcjksc">研发方面的能力</text><text x="72.00" y="418.79" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 134.12 139.98 144.24 150.83 157.26 162.35 165.25" y="418.79" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="174.14" y="418.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="188.03 195.72 198.71 204.32 210.89 217.46 223.43 226.32 235.05 241.62 248.19 253.28 256.17" y="418.79" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="265.06" y="418.79" font-size="11.00" class="sc-notoserifcjksc">相当或略强。我们将继续寻找自动化驱动的加速的迹象，</text><text x="72.00" y="434.41" font-size="11.00" class="sc-notoserifcjksc">并预计将继续发布这方面工作的观察结果（不过其中许多评估与单个模型的发布关联不那么紧</text><text x="72.00" y="450.03" font-size="11.00" class="sc-notoserifcjksc">密，可能会发布在系统卡以外的文档中，例如我们的风险报告或</text><text x="382.89 389.93 396.52 402.48 405.38 412.26 418.84 423.10 429.69 434.37 440.81 447.37 450.47 456.32 459.21 462.81 469.48 474.58 478.83 482.10 486.36 492.93 497.18" y="450.03" font-size="11.00" class="sc-loraregular">The Anthropic Institute</text><text x="506.04" y="450.03" font-size="11.00" class="sc-notoserifcjksc">的出版</text><text x="72.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">物，如</text><text x="107.89 112.29 123.48 130.07 136.03 142.71 145.60 152.49 156.17 159.07 165.47 172.03 175.12 178.12 184.70 189.79 192.68 195.95 200.21 205.30 211.26 214.25 217.97" y="465.65" font-size="11.00" class="sc-loraregular" fill="#0000ff">“When AI builds itself”</text><text x="221.81" y="465.65" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="552.01" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="552.01" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="589.11" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="589.11" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对主张和核心论证的更新</text><text x="72.00" y="616.99" font-size="11.00" class="sc-notoserifcjksc">我们认为，</text><text x="127.00 132.91 139.66 145.57" y="616.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="154.82" y="616.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="168.71" y="616.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="177.79" y="616.99" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="232.79" y="616.99" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="246.68 252.59 255.18 261.54 266.57 272.47 275.18 279.18" y="616.99" font-size="11.00" class="sc-loraregular">2.6-2.14</text><text x="288.04" y="616.99" font-size="11.00" class="sc-notoserifcjksc">节中所述的核心论证及对各项主张的论证，在很大</text><text x="72.00" y="632.61" font-size="11.00" class="sc-notoserifcjksc">程度上仍适用于</text><text x="151.89 159.58 162.57 168.18 174.75 181.33 187.29 190.18 200.12 205.98 210.24 216.83 223.26 228.35 231.25 237.24 239.95" y="632.61" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="246.85" y="632.61" font-size="11.00" class="sc-notoserifcjksc">带来的未对齐（</text><text x="323.85 333.68 336.77 341.86 347.54 350.53 353.62 359.71 366.38 376.22 382.18 388.76" y="632.61" font-size="11.00" class="sc-loraregular">misalignment</text><text x="393.01" y="632.61" font-size="11.00" class="sc-notoserifcjksc">）风险。下文介绍对部分具体</text><text x="72.00" y="648.23" font-size="11.00" class="sc-notoserifcjksc">主张的更新。</text><text x="72.00" y="675.57" font-size="11.00" class="sc-notoserifcjkscbold">对主张</text><text x="107.89" y="675.57" font-size="11.00" class="sc-lorabold">1</text><text x="115.25" y="675.57" font-size="11.00" class="sc-notoserifcjkscbold">的更新</text><text x="72.00" y="691.19" font-size="11.00" class="sc-notoserifcjksc">主张</text><text x="96.89" y="691.19" font-size="11.00" class="sc-loraregular">1</text><text x="103.79" y="691.19" font-size="11.00" class="sc-notoserifcjksc">认为</text><text x="125.79" y="691.19" font-size="11.00" class="sc-loraregular">“</text><text x="130.19" y="691.19" font-size="11.00" class="sc-notoserifcjksc">模型不太可能具备强大的隐蔽能力</text><text x="295.19" y="691.19" font-size="11.00" class="sc-loraregular">”</text><text x="299.03" y="691.19" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="310.03 317.72 320.71 326.32 332.89 339.46 345.43 348.32 358.25 364.12 368.37 374.96 381.40 386.49 389.38 395.38 398.08" y="691.19" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="404.98" y="691.19" font-size="11.00" class="sc-notoserifcjksc">是我们第一个在隐蔽能力评</text><text x="72.00" y="706.81" font-size="11.00" class="sc-notoserifcjksc">估</text><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="107.89" y="456.85" width="4.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/institute/recursive-self-improvement" rel="noopener"><rect x="112.29" y="456.85" width="30
