ze="9.00" class="sc-notoserifcjksc">任务，所示分数为全部试验的平均值（自助法</text><text x="254.37 259.57 264.47" y="326.19" font-size="9.00" class="sc-loraregular">95%</text><text x="274.67 283.67 292.67 301.67 310.67 319.67 328.67 337.67 346.67 355.67 364.67 373.67" y="326.19" font-size="9.00" class="sc-notoserifcjksc">置信区间）。模型满足全部</text><text x="385.04" y="326.19" font-size="9.00" class="sc-loraregular">5</text><text x="392.31 401.31 410.31 419.31 428.31 437.31 446.31 455.31 464.31 473.31 482.31 491.31 500.31" y="326.19" font-size="9.00" class="sc-notoserifcjksc">项标准的病原体数量，以其占</text><text x="511.68 514.95" y="326.19" font-size="9.00" class="sc-loraregular">10</text><text x="522.91 531.91" y="326.19" font-size="9.00" class="sc-notoserifcjksc">种受</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00" y="337.89" font-size="9.00" class="sc-notoserifcjksc">评病原体的比例表示。在</text><text x="173.37 179.98 186.84" y="337.89" font-size="9.00" class="sc-loraregular">DNA</text><text x="194.84 203.84 212.84 221.84 230.84 239.84 248.84 257.84 266.84 275.84" y="337.89" font-size="9.00" class="sc-notoserifcjksc">合成筛查任务中，对于</text><text x="287.21 293.50 295.95 300.54 305.91 311.29 316.17 318.54 326.66 331.46 334.94 340.34 345.60 349.77 352.13 357.04 359.25" y="337.89" font-size="9.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="364.90 373.90 382.90" y="337.89" font-size="9.00" class="sc-notoserifcjksc">在标准</text><text x="394.26" y="337.89" font-size="9.00" class="sc-loraregular">1</text><text x="399.91 408.91 417.91 426.91 435.91 444.91 453.91 462.91 471.91 480.91 489.91 498.91 507.91 516.91 525.91" y="337.89" font-size="9.00" class="sc-notoserifcjksc">上唯一通过的病原体，它恰好有一</text><text x="72.00 81.00 90.00 99.00 108.00 117.00" y="349.59" font-size="9.00" class="sc-notoserifcjksc">次满足了全部</text><text x="128.37" y="349.59" font-size="9.00" class="sc-loraregular">5</text><text x="135.64 144.64 153.64 162.64" y="349.59" font-size="9.00" class="sc-notoserifcjksc">项标准。</text><text x="72.00 77.86 80.43 86.29 88.85 95.01 97.57" y="395.29" font-size="11.00" class="sc-lorabold">2.2.3.2</text><text x="106.33" y="395.29" font-size="11.00" class="sc-notoserifcjkscbold">与</text><text x="120.22 127.79 135.06 139.93" y="395.29" font-size="11.00" class="sc-lorabold">CB-2</text><text x="148.68 159.68 170.68 181.68 192.68 203.68 214.68 225.68 236.68 247.68 258.68 269.68" y="395.29" font-size="11.00" class="sc-notoserifcjkscbold">威胁模型相关的自动化评估</text><text x="72.00 83.00 94.00" y="413.48" font-size="11.00" class="sc-notoserifcjksc">我们与</text><text x="107.89 116.09 121.90 128.57 135.01 137.90 144.94 151.53 157.49 162.18 167.85 174.42 180.38 186.95 191.21 194.30 200.15" y="413.48" font-size="11.00" class="sc-loraregular">Dyno Therapeutics</text><text x="208.14 219.14 230.14 241.14 252.14 263.14 274.14 285.14 296.14 307.14 318.14 329.14 340.14 351.14 362.14 373.14 384.14 395.14 406.14 417.14 428.14 439.14" y="413.48" font-size="11.00" class="sc-notoserifcjksc">合作开展了两项序列到功能建模与设计能力评估：</text><text x="108.00 119.00" y="462.06" font-size="11.00" class="sc-notoserifcjkscbold">黑盒</text><text x="132.89 140.44 148.77" y="462.06" font-size="11.00" class="sc-lorabold">RNA</text><text x="159.01 170.01 181.01 192.01 203.01" y="462.06" font-size="11.00" class="sc-notoserifcjkscbold">序列设计：</text><text x="214.01 225.01 236.01 247.01 258.01 269.01 280.01 291.01 302.01 313.01" y="462.06" font-size="11.00" class="sc-notoserifcjksc">这是一项中程挑战，自</text><text x="326.90 332.81 339.64 343.64" y="462.06" font-size="11.00" class="sc-loraregular">2018</text><text x="352.72 363.72 374.72 385.72" y="462.06" font-size="11.00" class="sc-notoserifcjksc">年以来，</text><text x="396.72 404.91 410.72 417.40" y="462.06" font-size="11.00" class="sc-loraregular">Dyno</text><text x="426.73 437.73 448.73 459.73 470.73 481.73 492.73 503.73 514.72 525.72" y="462.06" font-size="11.00" class="sc-notoserifcjksc">已用它评估了来自美国</text><text x="330.89 336.89" y="477.68" font-size="11.00" class="sc-loraregular">57</text><text x="344.85 355.85 366.85 377.85 388.85 399.85 410.85 421.85 432.85 443.85 454.85 465.85 476.85" y="477.68" font-size="11.00" class="sc-notoserifcjksc">名人类参与者。任务提供一组</text><text x="490.74 497.65 506.03" y="477.68" font-size="11.00" class="sc-loraregular">RNA</text><text x="515.81 526.81" y="477.68" font-size="11.00" class="sc-notoserifcjksc">序列</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="493.30" font-size="11.00" class="sc-notoserifcjksc">数据，其中每条序列都有一个数值分数，反映对该序列的某种（未知）实验测量结果，并</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="508.92" font-size="11.00" class="sc-notoserifcjksc">要求参与者（</text><text x="174.00" y="508.92" font-size="11.00" class="sc-loraregular">1</text><text x="178.00 189.00 200.00 211.00 222.00 233.00 244.00 255.00 266.00 277.00 288.00 299.00 310.00 321.00 332.00 343.00" y="508.92" font-size="11.00" class="sc-notoserifcjksc">）预测无标签序列测试集的分数；（</text><text x="354.00" y="508.92" font-size="11.00" class="sc-loraregular">2</text><text x="359.91 370.91 381.91 392.91 403.91 414.91 425.91 436.91 447.91 458.91 469.91 480.91 491.91 502.91" y="508.92" font-size="11.00" class="sc-notoserifcjksc">）设计新序列，争取获得高分。</text><text x="108.00 115.61 122.10" y="575.40" font-size="11.00" class="sc-lorabold">AAV</text><text x="132.78 143.78 154.78 165.78 176.78 187.78 198.78" y="575.40" font-size="11.00" class="sc-notoserifcjkscbold">衣壳包装预测：</text><text x="209.78 220.78 231.78 242.78 253.78 264.78" y="575.40" font-size="11.00" class="sc-notoserifcjksc">腺相关病毒（</text><text x="275.78 281.46 288.04 294.00 300.68 307.11 312.49 318.17 323.26 328.35 334.79 340.64 343.73 349.33 353.59 359.49 366.07 368.96 374.52 377.61 382.37 388.94" y="575.40" font-size="11.00" class="sc-loraregular">adeno-associated virus</text><text x="394.03" y="575.40" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="405.03 412.42 418.88 425.75" y="575.40" font-size="11.00" class="sc-loraregular">AAVs</text><text x="430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="575.40" font-size="11.00" class="sc-notoserifcjksc">）是一类非致病病毒，</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00" y="591.02" font-size="11.00" class="sc-notoserifcjksc">常在基因疗法中用作递送机制，通过病毒衣壳（病毒的外层蛋白质外壳）递送</text><text x="484.89 492.98 501.36" y="591.02" font-size="11.00" class="sc-loraregular">DNA</text><text x="511.14" y="591.02" font-size="11.00" class="sc-notoserifcjksc">载</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="606.64" font-size="11.00" class="sc-notoserifcjksc">荷。在这项任务中，模型获得</text><text x="253.89 257.90 260.50 267.34 274.17" y="606.64" font-size="11.00" class="sc-loraregular">1,000</text><text x="283.90 294.90 305.90 316.90 327.90" y="606.64" font-size="11.00" class="sc-notoserifcjksc">条未发表的</text><text x="341.79 349.19 355.64" y="606.64" font-size="11.00" class="sc-loraregular">AAV</text><text x="365.72 376.72 387.72 398.72 409.72 420.72 431.72 442.72 453.72" y="606.64" font-size="11.00" class="sc-notoserifcjksc">衣壳序列，其中包含</text><text x="467.61 475.81 481.62 488.29" y="606.64" font-size="11.00" class="sc-loraregular">Dyno</text><text x="497.62 508.62 519.62 530.62" y="606.64" font-size="11.00" class="sc-notoserifcjksc">筛选的短</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00" y="622.26" font-size="11.00" class="sc-notoserifcjksc">插入序列改造。随后，模型需要运用其生物物理学知识、</text><text x="383.00 390.39 396.85" y="622.26" font-size="11.00" class="sc-loraregular">AAV</text><text x="406.93 417.93 428.93 439.93 450.93 461.93 472.93 483.93 494.93 505.93 516.93 527.93" y="622.26" font-size="11.00" class="sc-notoserifcjksc">衣壳生物学知识和机器学习</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00" y="637.88" font-size="11.00" class="sc-notoserifcjksc">技能，给出每条改造后序列能正确组装成功能性衣壳的概率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">25</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">这些任务的序列和目标均未发表，因此我们高度确信，它们能够在不受训练数据污染的情况下，</text><text x="72.00 83.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">测量</text><text x="96.89 103.78" y="98.23" font-size="11.00" class="sc-loraregular">AI</text><text x="110.36 121.36 132.36 143.36 154.36 165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36" y="98.23" font-size="11.00" class="sc-notoserifcjksc">模型在新颖生物学任务上的技能。</text><text x="72.00 77.91 80.61 86.52 89.23 95.35 98.06 103.97 106.67" y="143.19" font-size="11.00" class="sc-loraregular" fill="#666666">2.2.3.2.1</text><text x="113.57 124.57" y="143.19" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">黑盒</text><text x="138.46 145.37 153.75" y="143.19" font-size="11.00" class="sc-loraregular" fill="#666666">RNA</text><text x="163.53 174.53 185.53 196.53 207.53 218.53 229.53" y="143.19" font-size="11.00" class="sc-notoserifcjksc" fill="#666666">序列建模与设计</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="163.38" font-size="11.00" class="sc-notoserifcjksc">该任务测量模型能否在极少提示和有限数据访问的条件下，在低上下文的黑盒环境中设计</text><text x="503.89 510.80 519.18" y="163.38" font-size="11.00" class="sc-loraregular">RNA</text><text x="528.96" y="163.38" font-size="11.00" class="sc-notoserifcjksc">序</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="194.62" font-size="11.00" class="sc-notoserifcjksc">列设计挑战。具体而言，任务要求人类参与者或模型分析数据，依据训练数据集中少量实验测量</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="210.24" font-size="11.00" class="sc-notoserifcjksc">结果建立序列到功能关系模型，并利用该模型预测测试数据集中序列的功能。此外，任务还要求</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="225.86" font-size="11.00" class="sc-notoserifcjksc">参与者设计两个数据集中均不存在的新序列，使其功能尽可能强。要在该任务中表现出色，需要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="241.48" font-size="11.00" class="sc-notoserifcjksc">通过分析发现序列的非显而易见属性、构建表达能力强的模型架构，并根据这些模型的表现作出</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="257.10" font-size="11.00" class="sc-notoserifcjksc">合理的设计权衡。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="373.87" font-size="11.00" class="sc-notoserifcjksc">人类参与者被要求在该任务上花费不超过</text><text x="272.89" y="373.87" font-size="11.00" class="sc-loraregular">2</text><text x="281.69" y="373.87" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="295.59" y="373.87" font-size="11.00" class="sc-loraregular">3</text><text x="304.61 315.61 326.61 337.61 348.61 359.61 370.61 381.61 392.61 403.61 414.61 425.61 436.61 447.61 458.61" y="373.87" font-size="11.00" class="sc-notoserifcjksc">小时。模型则在配有标准科学计算</text><text x="472.50 479.33 485.19 489.45 496.04 502.47" y="373.87" font-size="11.00" class="sc-loraregular">Python</text><text x="512.04 523.04" y="373.87" font-size="11.00" class="sc-notoserifcjksc">库的</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="389.49" font-size="11.00" class="sc-notoserifcjksc">容器化环境中获得</text><text x="162.89" y="389.49" font-size="11.00" class="sc-loraregular">2</text><text x="171.69 182.69 193.69 204.69 215.69 226.69 237.69 248.69 259.69" y="389.49" font-size="11.00" class="sc-notoserifcjksc">小时工具调用预算、</text><text x="270.69 279.06 285.73" y="389.49" font-size="11.00" class="sc-loraregular">GPU</text><text x="296.90 307.90 318.90 329.90 340.90" y="389.49" font-size="11.00" class="sc-notoserifcjksc">访问权限和</text><text x="354.79 358.79 365.62" y="389.49" font-size="11.00" class="sc-loraregular">100</text><text x="375.35" y="389.49" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="389.24 393.50 399.93 405.76 411.72" y="389.49" font-size="11.00" class="sc-loraregular">token</text><text x="421.29 432.29 443.29 454.29 465.29 476.29 487.29 498.29 509.29 520.29" y="389.49" font-size="11.00" class="sc-notoserifcjksc">额度。我们还要求模型</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="405.11" font-size="11.00" class="sc-notoserifcjksc">生成一份独立完整的</text><text x="173.89 182.47 189.51 199.61" y="405.11" font-size="11.00" class="sc-loraregular">HTML</text><text x="208.86 219.86 230.86 241.86 252.86 263.86 274.86 285.86 296.86 307.86 318.86 329.86 340.86 351.86 362.86 373.86 384.86 395.86 406.86 417.86" y="405.11" font-size="11.00" class="sc-notoserifcjksc">报告，介绍其方法和发现。我们将产出发送给</text><text x="431.76 439.95 445.76 452.44" y="405.11" font-size="11.00" class="sc-loraregular">Dyno</text><text x="458.87 469.87 480.87 491.87 502.87 513.87 524.87" y="405.11" font-size="11.00" class="sc-notoserifcjksc">，按照与人类候</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00" y="420.73" font-size="11.00" class="sc-notoserifcjksc">选者相同的评分细则进行评分。每个模型在该任务上采样了</text><text x="360.89" y="420.73" font-size="11.00" class="sc-loraregular">8</text><text x="369.97 380.97 391.97 402.97" y="420.73" font-size="11.00" class="sc-notoserifcjksc">次尝试。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="487.22" font-size="11.00" class="sc-notoserifcjksc">产出按两项指标评分：预测分数（留出测试集上模型预测与功能真值之间的斯皮尔曼相关系数）</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="502.84" font-size="11.00" class="sc-notoserifcjksc">和设计分数（所提议最佳序列的功能真值）。在</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 354.12 359.98 364.24 370.83 377.26 382.35 385.25" y="502.84" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="394.14 405.14 416.14 427.14 438.14 449.14 460.14 471.14 482.14 493.14 504.14 515.14 526.14" y="502.84" font-size="11.00" class="sc-notoserifcjksc">之前的系统卡中，我们仅报告</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00" y="518.46" font-size="11.00" class="sc-notoserifcjksc">了全部序列的斯皮尔曼相关系数和最佳设计的设计分数。此后我们发现，前</text><text x="437.89 443.89" y="518.46" font-size="11.00" class="sc-loraregular">5%</text><text x="456.35 467.35 478.35 489.35 500.35 511.35" y="518.46" font-size="11.00" class="sc-notoserifcjksc">序列的预测分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="534.08" font-size="11.00" class="sc-notoserifcjksc">数，以及全部设计序列的设计分数中位数，更能有效突出近期模型之间的差异；下文将报告这些</text><text x="72.00 83.00 94.00" y="549.70" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="616.75" font-size="11.00" class="sc-notoserifcjksc">我们还评估了上下文内迭代条件。每个模型都获得了</text><text x="327.89 335.58 338.57 344.18 350.75 357.33 363.29 366.18 376.12 381.98 386.24 392.83 399.26 404.35 407.25 413.91 418.60 424.51 430.06 433.15 439.07" y="616.75" font-size="11.00" class="sc-loraregular">Claude Mythos Preview</text><text x="450.77 461.77 472.77 483.77 494.77 505.77 516.77" y="616.75" font-size="11.00" class="sc-notoserifcjksc">此前尝试生成的</text><text x="530.67" y="616.75" font-size="11.00" class="sc-loraregular">8</text><text x="72.00" y="632.37" font-size="11.00" class="sc-notoserifcjksc">份</text><text x="85.89 94.47 101.51 111.61" y="632.37" font-size="11.00" class="sc-loraregular">HTML</text><text x="120.86 131.86 142.86 153.86 164.86 175.86 186.86 197.86 208.86 219.86 230.86 241.86 252.86 263.86 274.86 285.86 296.86 307.86 318.86 329.86 340.86 351.86 362.86 373.86" y="632.37" font-size="11.00" class="sc-notoserifcjksc">报告及其对应分数，并被要求改进这些方法。模型获得</text><text x="387.76 393.42" y="632.37" font-size="11.00" class="sc-loraregular">24</text><text x="402.28 413.28 424.28 435.28 446.28 457.28 468.28 479.28 490.28" y="632.37" font-size="11.00" class="sc-notoserifcjksc">小时工具调用预算和</text><text x="504.17 510.08 516.91" y="632.37" font-size="11.00" class="sc-loraregular">200</text><text x="526.63" y="632.37" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="72.00 76.26 82.69 88.52 94.48" y="647.99" font-size="11.00" class="sc-loraregular">token</text><text x="104.05 115.05 126.05 137.05 148.05 159.05 170.05 181.05 192.05 203.05" y="647.99" font-size="11.00" class="sc-notoserifcjksc">预算；所有模型均获得</text><text x="216.95 226.88 232.74 237.00 243.59 250.02 255.12 258.01 264.68 269.36 275.27 280.82 283.92 289.83" y="647.99" font-size="11.00" class="sc-loraregular">Mythos Preview</text><text x="301.54 312.54 323.54 334.54 345.54 356.54 367.54 378.54 389.54 400.54 411.54 422.54 433.54 444.54 455.54 466.54 477.54 488.54 499.54 510.54 521.54" y="647.99" font-size="11.00" class="sc-notoserifcjksc">报告，以保持上下文材料一致。结果与无上下文</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="663.61" font-size="11.00" class="sc-notoserifcjksc">基线一并报告。这一条件不能与人类基线直接比较，因为人类参与者无法访问先前的尝试。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="504.00 508.83" y="751.81" font-size="9.00" class="sc-loraregular">26</text><text x="72.00 83.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">依据</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="98.80" font-size="11.00" class="sc-notoserifcjksc">该评估可作为模型设计新型生物序列能力的早期指标，具有必要性但不充分。这类设计是许</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">多威胁路径共同的上游投入，例如增强病原体或设计新型毒素，因此设计能力的进步会同时增加</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">所有这些路径的风险。同样，上下文学习变体可以作为模型从先前尝试中学习能力的早期指标，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">这项技能与设计项目的迭代过程相关。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="228.34" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的基准</text><text x="151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89 305.89 316.89 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89" y="228.34" font-size="11.00" class="sc-notoserifcjksc">我们定义了两个显著能力基准。如果模型的平均表现超过人类参与者的第</text><text x="506.79 511.86" y="228.34" font-size="11.00" class="sc-loraregular">75</text><text x="520.74" y="228.34" font-size="11.00" class="sc-notoserifcjksc">百</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="243.96" font-size="11.00" class="sc-notoserifcjksc">分位，则超过第一个基准；如果模型的平均表现超过表现最好的人类参与者，则超过第二个基</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="259.58" font-size="11.00" class="sc-notoserifcjksc">准。为与此前系统卡保持一致，并与激励和评估人类表现的方式相对应，我们将这些基准应用于</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="275.20" font-size="11.00" class="sc-notoserifcjksc">原始预测和设计分数：全部序列与真值的斯皮尔曼相关系数，以及最佳序列的设计分数。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="374.07" font-size="11.00" class="sc-notoserifcjksc">我们没有为新指标定义额外的显著能力基准，而是用它们对模型表现和能力形成定性认识。</text><text x="72.00 83.00" y="422.64" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 107.89 118.89 129.89 140.89 151.89 162.89 173.89 184.89 195.89 206.89 217.89" y="422.64" font-size="11.00" class="sc-notoserifcjksc">在最佳序列的设计分数上，</text><text x="228.89 238.83 244.69 248.95 255.54 261.97 267.06 269.96 275.95 278.66" y="422.64" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55" y="422.64" font-size="11.00" class="sc-notoserifcjksc">超过了第一个基准。其设计分数中位数超过</text><text x="497.45 505.14 508.13 513.74 520.30 526.88" y="422.64" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="438.26" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95" y="438.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="135.84 143.53 146.52 152.14 158.70 165.28 171.24 174.14 182.87 189.44 196.00 201.10 203.99" y="438.26" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="209.98 220.98 231.98 242.98 253.98 264.98 275.98 286.98 297.98 308.98 319.98 330.98 341.98 352.98 363.98 374.98 385.98 396.98 407.98 418.98 429.98 440.98" y="438.26" font-size="11.00" class="sc-notoserifcjksc">，各次运行之间的差异略有减小。在预测任务中，</text><text x="451.98 461.92 467.78 472.04 478.63 485.06 490.15 493.05 499.04 501.75" y="438.26" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="508.64" y="438.26" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="72.00 80.73 87.30 93.87 98.96 101.85" y="453.88" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="110.74" y="453.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="124.64 134.57 140.43 144.69 151.28 157.71 162.80 165.70" y="453.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="174.59 185.59 196.59 207.59 218.59 229.59 240.59 251.59 262.59 273.59 284.59 295.59 306.59 317.59 328.59 339.59 350.59 361.59 372.59 383.59 394.59 405.59 416.59" y="453.88" font-size="11.00" class="sc-notoserifcjksc">表现相当，既超过第一个基准，也超过人类得分的第</text><text x="430.48 436.84" y="453.88" font-size="11.00" class="sc-loraregular">90</text><text x="446.56 457.56 468.56 479.56 490.56 501.56 512.56 523.56" y="453.88" font-size="11.00" class="sc-notoserifcjksc">百分位。值得关注</text><text x="72.00 83.00 94.00" y="469.50" font-size="11.00" class="sc-notoserifcjksc">的是，</text><text x="105.00 114.93 120.80 125.05 131.64 138.08 143.17 146.06 152.06 154.76" y="469.50" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66 491.66 502.66 513.66 524.66" y="469.50" font-size="11.00" class="sc-notoserifcjksc">的一次试验在高端序列预测和全部序列预测两方面，均超过了表现最好的人类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00" y="485.12" font-size="11.00" class="sc-notoserifcjksc">参与者以及此前表现最好的模型（两项分别为</text><text x="294.89 304.83 310.69 314.95 321.54 327.97 333.06 335.96" y="485.12" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="344.84" y="485.12" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.74 367.47 374.04 380.60 385.70 388.59" y="485.12" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="394.59 405.59 416.59 427.59 438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59 526.59" y="485.12" font-size="11.00" class="sc-notoserifcjksc">）。我们得出的结论是，在中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="500.74" font-size="11.00" class="sc-notoserifcjksc">程黑盒生物序列设计和预测方面，</text><text x="237.00 246.93 252.80 257.05 263.64 270.08 275.17 278.06 284.06 286.76" y="500.74" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66" y="500.74" font-size="11.00" class="sc-notoserifcjksc">达到或超过了此前最好的模型</text><text x="439.55 448.29 454.86 461.42 466.51 469.41" y="500.74" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="475.40 486.40 497.40 508.40 519.40" y="500.74" font-size="11.00" class="sc-notoserifcjksc">，并与美国</text><text x="72.00 83.00" y="616.95" font-size="11.00" class="sc-notoserifcjksc">包括</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25" y="616.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="182.24" y="616.95" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="193.24 200.93 203.92 209.53 216.10 222.68 228.64 231.53 237.77 244.21 250.88 257.56 263.44 267.70 270.59" y="616.95" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="279.48" y="616.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="293.38 301.06 304.06 309.67 316.23 322.81 328.77 331.67 340.40 346.97 353.53 358.63 361.52" y="616.95" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="370.41 381.41 392.41 403.41 414.41 425.41 436.41 447.41 458.41 469.41 480.41 491.41 502.41 513.41 524.41" y="616.95" font-size="11.00" class="sc-notoserifcjksc">在内的先前模型，除预测分数（全</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00" y="632.57" font-size="11.00" class="sc-notoserifcjksc">部序列）上的效果微弱或为负外，在每项指标上都能从上下文内迭代中受益。我们观察到，</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06 119.06 121.76" y="648.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="128.66 139.66 150.66 161.66 172.66 183.66 194.66 205.66 216.66 227.66 238.66 249.66 260.66 271.66 282.66 293.66 304.66 315.66 326.66 337.66 348.66 359.66 370.66 381.66 392.66 403.66 414.66 425.66 436.66 447.66 458.66 469.66 480.66" y="648.19" font-size="11.00" class="sc-notoserifcjksc">打破了这一趋势，在全部指标上均从上下文内迭代中获益。值得关注的是，</text><text x="491.66 501.59 507.46 511.71 518.30 524.74" y="648.19" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00 80.70" y="663.81" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60 98.60 109.60 120.60 131.60 142.60 153.60 164.60 175.60 186.60 197.60 208.60 219.60 230.60 241.60 252.60 263.60 274.60 285.60 296.60 307.60 318.60 329.60 340.60 351.60 362.60 373.60 384.60 395.60 406.60 417.60 428.60 439.60 450.60 461.60 472.60 483.60 494.60 505.60 516.60 527.60" y="663.81" font-size="11.00" class="sc-notoserifcjksc">的预测分数（全部序列）中位数和最高分均有所提高，不过各次运行间的差异大于基线条件下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="679.43" font-size="11.00" class="sc-notoserifcjksc">的差异。它在高端序列预测方面不及</text><text x="250.89 260.83 266.69 270.95 277.54 283.97 289.06 291.96" y="679.43" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="297.95 308.95 319.95 330.95" y="679.43" font-size="11.00" class="sc-notoserifcjksc">，但仍与</text><text x="344.84 353.58 360.14 366.71 371.80 374.70" y="679.43" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="383.59 394.59 405.59 416.59 427.59 438.59 449.59 460.59 471.59 482.59 493.59 504.59 515.59" y="679.43" font-size="11.00" class="sc-notoserifcjksc">具有竞争力。这些发现表明，</text></svg></div>

9 327.89 338.89 349.89 360.89 371.89 382.89 393.89 404.89 415.89 426.89 437.89 448.89 459.89 470.89 481.89 492.89 503.89 514.89 525.89" y="588.56" font-size="11.00" class="sc-notoserifcjksc">该评估可作为模型预测新型病毒衣壳序列特性能力的早期指标，具有必要性但不充分。这种</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="604.18" font-size="11.00" class="sc-notoserifcjksc">能力是设计项目的必要组成部分，可作为筛选手段，提高旨在改进更复杂病毒特性的实验中有效</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="619.80" font-size="11.00" class="sc-notoserifcjksc">尝试的占比。它是预测更具挑战性、对治疗更有参考价值的衣壳功能的第一步，例如全身生物分</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00" y="635.42" font-size="11.00" class="sc-notoserifcjksc">布、与暴露于细胞表面的受体进行功能性结合，以及细胞转导。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p031.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 31 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">31</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">显著能力的基准</text><text x="151.89 162.89 173.89 184.89 195.89 206.89 217.89 228.89 239.89 250.89 261.89 272.89 283.89 294.89" y="98.80" font-size="11.00" class="sc-notoserifcjksc">如果模型在纯推理条件下的平均</text><text x="308.79 315.46 323.74 330.64 339.38" y="98.80" font-size="11.00" class="sc-loraregular">AUROC</text><text x="349.96 360.96 371.96 382.96 393.96 404.96" y="98.80" font-size="11.00" class="sc-notoserifcjksc">超过直接应用</text><text x="418.85 425.69 431.93 441.85 446.88" y="98.80" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="455.68 466.68 477.68 488.68 499.68 510.68 521.68" y="98.80" font-size="11.00" class="sc-notoserifcjksc">的结果，即超过</text><text x="72.00 83.00" y="179.76" font-size="11.00" class="sc-notoserifcjkscbold">结果</text><text x="96.89 104.58 107.57 113.18 119.75 126.33 132.29 135.18 145.12 150.98 155.24 161.83 168.26 173.35 176.25 182.24 184.95" y="179.76" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="191.85 202.85 213.85 224.85 235.85 246.85 257.85 268.85 279.85 290.85 301.85 312.85 323.85 334.85 345.85 356.85 367.85" y="179.76" font-size="11.00" class="sc-notoserifcjksc">超过了显著能力基准，并在无语料／无</text><text x="381.74 388.35 394.71" y="179.76" font-size="11.00" class="sc-loraregular">PLM</text><text x="407.70" y="179.76" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="421.59 427.77 436.58 439.68 444.77 449.86 455.24 461.91 466.59 473.03" y="179.76" font-size="11.00" class="sc-loraregular">Swiss-Prot</text><text x="480.18 491.18 502.18 513.18 524.18" y="179.76" font-size="11.00" class="sc-notoserifcjksc">语料条件下</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="195.38" font-size="11.00" class="sc-notoserifcjksc">取得全部受评模型中的最高分。在无语料／提供</text><text x="305.89 312.73 318.97 328.89 333.92" y="195.38" font-size="11.00" class="sc-loraregular">ESM-2</text><text x="342.72 353.72 364.72 375.72 386.72 397.72 408.72 419.72 430.72 441.72 452.72" y="195.38" font-size="11.00" class="sc-notoserifcjksc">条件下，我们观察到它与</text><text x="466.61 474.30 477.30 482.90 489.47 496.05" y="195.38" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="211.00" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95" y="211.00" font-size="11.00" class="sc-notoserifcjksc">表现相当；在</text><text x="190.84 197.51 202.20 208.63 212.89 218.85 221.94 228.49 236.86 242.67 252.50 257.88 265.27 271.73" y="211.00" font-size="11.00" class="sc-loraregular">ProteinGym-AAV</text><text x="281.80 292.80 303.80 314.80 325.80 336.80" y="211.00" font-size="11.00" class="sc-notoserifcjksc">和完整语料（</text><text x="347.80 353.98 362.80 365.89 370.98 376.07 381.45 388.12 392.80 399.24 403.50 409.33 416.72 423.17" y="211.00" font-size="11.00" class="sc-loraregular">Swiss-Prot+AAV</text><text x="430.36 441.36 452.36 463.36 474.36 485.36 496.36" y="211.00" font-size="11.00" class="sc-notoserifcjksc">）条件下，相比</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 119.03 125.59 132.16 137.25 140.15" y="226.62" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="149.03 160.03 171.03 182.03 193.03 204.03 215.03 226.03 237.03 248.03 259.03 270.03 281.03 292.03 303.03 314.03 325.03 336.03 347.03" y="226.62" font-size="11.00" class="sc-notoserifcjksc">则有轻微退步。进一步检查后，我们发现，</text><text x="358.03 366.77 373.33 379.90 384.99 387.89" y="226.62" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="396.77" y="226.62" font-size="11.00" class="sc-notoserifcjksc">与</text><text x="410.67 420.60 426.46 430.72 437.31 443.74 448.84 451.73 457.73 460.43" y="226.62" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="467.33 478.33 489.33 500.33" y="226.62" font-size="11.00" class="sc-notoserifcjksc">对语料中</text><text x="514.22 521.61 528.07" y="226.62" font-size="11.00" class="sc-loraregular">AAV</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00" y="242.24" font-size="11.00" class="sc-notoserifcjksc">血清型的判断趋于一致，但通过推理采用了不同的方法来消除数据中的混杂因素。</text><text x="468.00 477.93 483.80 488.05 494.64 501.08 506.17 509.06 515.06 517.76" y="242.24" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="524.66" y="242.24" font-size="11.00" class="sc-notoserifcjksc">更</text><text x="72.00 83.00 94.00 105.00 116.00" y="257.86" font-size="11.00" class="sc-notoserifcjksc">频繁地运用</text><text x="129.89 137.29 143.74" y="257.86" font-size="11.00" class="sc-loraregular">AAV</text><text x="153.82 164.82 175.82 186.82 197.82 208.82 219.82 230.82 241.82 252.82" y="257.86" font-size="11.00" class="sc-notoserifcjksc">衣壳的生物物理特性；</text><text x="263.82 272.55 279.12 285.69 290.78 293.67" y="257.86" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="302.56" y="257.86" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="316.45 326.39 332.25 336.51 343.10 349.53 354.62 357.52 363.51 366.22" y="257.86" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="373.11 384.11 395.11 406.11 417.11 428.11 439.11 450.11 461.11 472.11 483.11 494.11 505.11 516.11" y="257.86" font-size="11.00" class="sc-notoserifcjksc">在面对可能产生误导的训练数据</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00" y="273.48" font-size="11.00" class="sc-notoserifcjksc">时，都展现了有效的推理策略和科学判断。因此，我们不将其解读为</text><text x="404.89 412.58 419.42 424.45" y="273.48" font-size="11.00" class="sc-loraregular">CB-2</text><text x="433.25 444.25 455.25 466.25 477.25 488.25 499.25 510.25 521.25" y="273.48" font-size="11.00" class="sc-notoserifcjksc">相关能力表现退步的</text><text x="72.00 83.00 94.00" y="289.10" font-size="11.00" class="sc-notoserifcjksc">指标。</text><text x="72.00" y="658.88" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="658.88" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.64 93.74 98.53 100.63 105.67 107.77 112.56 114.66 119.46 121.55 127.09 130.56 132.93 139.16 144.47" y="658.88" font-size="9.00" class="sc-lorabold">2.2.3.2.2.A] AAV</text><text x="153.21 162.21 171.21 180.21 189.21 198.21 207.21" y="658.88" font-size="9.00" class="sc-notoserifcjkscbold">衣壳包装预测。</text><text x="216.21" y="658.88" font-size="9.00" class="sc-loraregular">5</text><text x="223.48 232.48 241.48 250.48 259.48 268.48 277.48 286.48 295.48 304.48 313.48 322.48 331.48 340.48 349.48 358.48 367.48 376.48 385.48 394.48 403.48" y="658.88" font-size="9.00" class="sc-notoserifcjksc">种资源条件下，相对于二元包装真值标签计算的</text><text x="414.85 420.31 427.08 432.73 439.88" y="658.88" font-size="9.00" class="sc-loraregular">AUROC</text><text x="446.17 455.17 464.17 473.17 482.17 491.17 500.17" y="658.88" font-size="9.00" class="sc-notoserifcjksc">（详情见上文第</text><text x="72.00 76.83 79.05 83.88 86.09 91.11 93.32 98.15 100.37" y="670.58" font-size="9.00" class="sc-loraregular">2.2.3.2.2</text><text x="107.57 116.57 125.57 134.57 143.57 152.57 161.57 170.57 179.57 188.57 197.57 206.57 215.57 224.57 233.57 242.57 251.57 260.57" y="670.58" font-size="9.00" class="sc-notoserifcjksc">节）。箱线图展示每个模型在每种条件下</text><text x="271.93" y="670.58" font-size="9.00" class="sc-loraregular">8</text><text x="279.36 288.36 297.36 306.36 315.36 324.36 333.36 342.36 351.36 360.36 369.36 378.36 387.36 396.36 405.36 414.36 423.36 432.36 441.36 450.36 459.36 468.36 477.36 486.36 495.36" y="670.58" font-size="9.00" class="sc-notoserifcjksc">次独立尝试的分布；点表示各次运行。虚线标示直接应用</text><text x="506.73 512.32 517.43 525.55 529.66" y="670.58" font-size="9.00" class="sc-loraregular">ESM-2</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00 162.00 171.00 180.00 189.00 198.00 207.00 216.00 225.00 234.00 243.00 252.00 261.00" y="682.28" font-size="9.00" class="sc-notoserifcjksc">的参考基线。该任务没有可用的人类参与者基线。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p032.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 32 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">32</text><text x="72.00 79.46 82.84 90.30 93.68" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.4</text><text x="105.37 118.37" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00" y="111.03" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 156.12 161.98 166.24 172.83 179.26 184.35 187.25" y="111.03" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.13 207.13 218.13 229.13 240.13 251.13 262.14 273.14 284.14 295.14 306.14 317.14 328.14 339.14 350.14 361.14 372.14 383.14 394.14 405.14 416.14" y="111.03" font-size="11.00" class="sc-notoserifcjksc">及其系统卡时，我们讨论了限时评估如何为整体</text><text x="430.03 437.72" y="111.03" font-size="11.00" class="sc-loraregular">CB</text><text x="447.45 458.45 469.45 480.45 491.45" y="111.03" font-size="11.00" class="sc-notoserifcjksc">风险评估（</text><text x="502.45 510.14 516.98 519.88 524.64 527.73 532.82" y="111.03" font-size="11.00" class="sc-loraregular">CB risk</text><text x="72.00 77.68 82.77 87.86 93.82 98.92 104.01 113.84 119.81 126.38" y="126.65" font-size="11.00" class="sc-loraregular">assessment</text><text x="130.64 141.64 152.64 163.64 174.64 185.64 196.64 207.64 218.64 229.64 240.64 251.64 262.64 273.64 284.64 295.64 306.64 317.64 328.64 339.64 350.64 361.64 372.64 383.64 394.64 405.64 416.64 427.64 438.64 449.64 460.64 471.64 482.64 493.64 504.64 515.64 526.64" y="126.65" font-size="11.00" class="sc-notoserifcjksc">）提供依据。我们的自动化评估对两用能力和能力提升的考察必然有其边界，而且这</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="142.27" font-size="11.00" class="sc-notoserifcjksc">些评估经过精心筛选，以最大限度激发模型的特定能力；它们可能无法捕捉到一般能力提升所带</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="157.89" font-size="11.00" class="sc-notoserifcjksc">来的风险，而这类提升会提高生物学研究的生产力。同样，它们也可能无法反映在真实世界研究</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="173.51" font-size="11.00" class="sc-notoserifcjksc">环境中部署大语言模型的细微差别。我们的评估仍然是：即使对于拥有大量大语言模型使用经验</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="189.13" font-size="11.00" class="sc-notoserifcjksc">的专家研究人员，要从模型中激发出最大程度的科学能力提升，仍是一个充满挑战、容易出错的</text><text x="72.00 83.00 94.00" y="204.75" font-size="11.00" class="sc-notoserifcjksc">过程。</text><text x="72.00 83.00 94.00" y="272.95" font-size="11.00" class="sc-notoserifcjksc">在整个</text><text x="107.89 115.58" y="272.95" font-size="11.00" class="sc-loraregular">CB</text><text x="125.32 136.32 147.32 158.32 169.32 180.32" y="272.95" font-size="11.00" class="sc-notoserifcjksc">评估组合中，</text><text x="191.32 199.01 202.00 207.61 214.18 220.75 226.72 229.61 239.54 245.40 249.66 256.25 262.69 267.78 270.67 276.67 279.37" y="272.95" font-size="11.00" class="sc-loraregular">Claude Mythos 5.1</text><text x="286.27 297.27" y="272.95" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="311.16 321.10 326.96 331.22 337.80 344.24 349.33 352.23" y="272.95" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="361.11" y="272.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="375.01 382.70 385.69 391.30 397.86 404.44 410.40 413.30 422.03 428.60 435.17 440.26 443.15" y="272.95" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="452.04 463.04 474.04 485.04 496.04 507.04 518.04 529.04" y="272.95" font-size="11.00" class="sc-notoserifcjksc">展现出适度的能力</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="288.57" font-size="11.00" class="sc-notoserifcjksc">提升。我们认为，要对</text><text x="184.89 194.83 200.69 204.95 211.54 217.97" y="288.57" font-size="11.00" class="sc-loraregular">Mythos</text><text x="225.96 236.96 247.96 258.96 269.96 280.96 291.96 302.96 313.96 324.96 335.96" y="288.57" font-size="11.00" class="sc-notoserifcjksc">级模型作出有充分依据的</text><text x="349.85 357.54" y="288.57" font-size="11.00" class="sc-loraregular">CB</text><text x="367.27 378.27 389.27 400.27 411.27 422.27 433.27 444.27 455.27 466.27 477.27 488.27 499.27 510.27 521.27" y="288.57" font-size="11.00" class="sc-notoserifcjksc">风险判断，这些自动化评估是必要</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00" y="304.19" font-size="11.00" class="sc-notoserifcjksc">的，但并不充分；因此，我们纳入专家与非领域专家红队测试的报告，以评估</text><text x="448.89 458.83 464.69 468.95 475.53 481.97 487.06 489.96 495.95 498.66" y="304.19" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="505.55 516.55 527.55" y="304.19" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="319.81" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95 154.95 165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95 253.95 264.95 275.95 286.95 297.95 308.95 319.95 330.95 341.95 352.95 363.95 374.95 385.95 396.95" y="319.81" font-size="11.00" class="sc-notoserifcjksc">的能力和弱点。虽然我们怀疑，这些弱点在红队测试所用的</text><text x="410.84 420.78 426.64 430.90 437.49 443.92 449.01 451.91 457.90 460.61" y="319.81" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="467.50 478.50 489.50 500.50 511.50 522.51" y="319.81" font-size="11.00" class="sc-notoserifcjksc">仅有用变体中</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="335.43" font-size="11.00" class="sc-notoserifcjksc">略为突出，但在</text><text x="151.89 161.83 167.69 171.95 178.54 184.97 190.06 192.96 198.95 201.66" y="335.43" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="208.55 219.55 230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55 373.55 384.55 395.55 406.55 417.55 428.55 439.55 450.55 461.55 472.55 483.55" y="335.43" font-size="11.00" class="sc-notoserifcjksc">中也很容易观察到类似弱点。因此，我们判断这些结果仍与</text><text x="497.45 507.38 513.24 517.50 524.09 530.52" y="335.43" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00 80.70" y="351.05" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60 98.60 109.60 120.60 131.60 142.60 153.60 164.60 175.60 186.60 197.60 208.60 219.60 230.60 241.60 252.60 263.60 274.60 285.60 296.60 307.60 318.60 329.60 340.60 351.60 362.60 373.60 384.60 395.60 406.60 417.60 428.60 439.60 450.60 461.60 472.60 483.60 494.60 505.60 516.60 527.60" y="351.05" font-size="11.00" class="sc-notoserifcjksc">的整体能力评估相关，不过这些顾虑确实使我们对评估的信心水平略有降低。我们正在积极努</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="366.67" font-size="11.00" class="sc-notoserifcjksc">力，弥补未来测试中的这一缺口。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="467.26" font-size="11.00" class="sc-notoserifcjksc">总体而言，我们预计</text><text x="173.89 183.83 189.69 193.95 200.54 206.97 212.06 214.96 220.95 223.66" y="467.26" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="230.55 241.55 252.55 263.55 274.55 285.55 296.55 307.55 318.55 329.55 340.55 351.55 362.55" y="467.26" font-size="11.00" class="sc-notoserifcjksc">将在一系列科学任务中发挥与</text><text x="376.45 386.38 392.24 396.50 403.09 409.52 414.62 417.51" y="467.26" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="426.40 437.40 448.40 459.40 470.40 481.40 492.40 503.40 514.40 525.40" y="467.26" font-size="11.00" class="sc-notoserifcjksc">相当的作用，并在分析</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00" y="482.88" font-size="11.00" class="sc-notoserifcjksc">速度和广度上超过它。不过，它并未显著改善我们认为使</text><text x="349.89 359.83 365.69 369.95 376.53 382.97 388.06 390.96" y="482.88" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="399.84 410.84 421.84 432.84" y="482.88" font-size="11.00" class="sc-notoserifcjksc">未能达到</text><text x="446.74 453.64 459.88" y="482.88" font-size="11.00" class="sc-loraregular">RSP</text><text x="469.44" y="482.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="483.33 489.29 496.97" y="482.88" font-size="11.00" class="sc-loraregular">FCF</text><text x="505.90" y="482.88" font-size="11.00" class="sc-notoserifcjksc">中</text><text x="72.00 79.69 86.53 91.56" y="498.50" font-size="11.00" class="sc-loraregular">CB-2</text><text x="100.36 111.36 122.36 133.36 144.36 155.36 166.36 177.36 188.36 199.36" y="498.50" font-size="11.00" class="sc-notoserifcjksc">标准的那些弱点，即：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00" y="542.03" font-size="11.00" class="sc-notoserifcjkscbold">开放式构想和设计能力较弱。</text><text x="251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="542.03" font-size="11.00" class="sc-notoserifcjksc">在红队测试、能力提升试验和桌面推演中，模型能够可靠地</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="557.65" font-size="11.00" class="sc-notoserifcjksc">重组和扩展已发表知识，但很少提出审阅人员认为真正新颖的方法。专业人员和通才均报</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="573.27" font-size="11.00" class="sc-notoserifcjksc">告，它没有提供他们原本缺少的想法，而且无论如何提示，都倾向于同一种设计。在超出</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00" y="588.89" font-size="11.00" class="sc-notoserifcjksc">文献范围时，参与者需要运用自身专业知识，区分有前景的想法与猜测。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00" y="655.37" font-size="11.00" class="sc-notoserifcjkscbold">战略判断能力较差。</text><text x="207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="655.37" font-size="11.00" class="sc-notoserifcjksc">模型沿用用户给出的任何框架，而不会质疑它，因此薄弱的问题会产</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00" y="686.61" font-size="11.00" class="sc-notoserifcjksc">碍，而且无法认识到多步骤项目中错误如何累积。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p033.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 33 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">33</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">红队测试还暴露出另外两项我们认为使其未能达到</text><text x="316.89 324.58 331.42 336.45" y="98.80" font-size="11.00" class="sc-loraregular">CB-2</text><text x="345.25 356.25 367.25 378.25 389.25 400.25" y="98.80" font-size="11.00" class="sc-notoserifcjksc">标准的弱点：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00" y="124.99" font-size="11.00" class="sc-notoserifcjkscbold">对文献结论的表述不可靠</text><text x="229.00" y="124.99" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="240.00 249.93 255.80 260.05 266.64 273.08 278.17 281.06 287.06 289.76" y="124.99" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="296.66 307.66 318.66 329.66 340.66 351.66 362.66 373.66 384.66 395.66 406.66 417.66 428.66 439.66 450.66 461.66 472.66 483.66 494.66 505.66 516.66 527.66" y="124.99" font-size="11.00" class="sc-notoserifcjksc">几乎从不编造引文，我们的评估人员认可了这一进</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="140.61" font-size="11.00" class="sc-notoserifcjksc">步。但它转而偶尔歪曲既有研究的发现和结论，产生另一类错误，需要熟悉该领域才能发</text><text x="108.00 119.00 130.00 141.00 152.00" y="156.23" font-size="11.00" class="sc-notoserifcjksc">现并解决。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="189.76" font-size="11.00" class="sc-notoserifcjkscbold">技术校准较差</text><text x="174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="189.76" font-size="11.00" class="sc-notoserifcjksc">。模型无法恰当把握科学任务所要求的具体程度，尤其是在制定实验方案和</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00 339.00 350.00 361.00 372.00 383.00 394.00 405.00 416.00 427.00 438.00 449.00 460.00 471.00 482.00 493.00 504.00 515.00 526.00" y="205.38" font-size="11.00" class="sc-notoserifcjksc">规划实验时。它会在响应中给出没有保留限定的估计，并制定不切实际的计划，未能纳入</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00 306.00 317.00 328.00" y="221.00" font-size="11.00" class="sc-notoserifcjksc">指定约束（例如实验室空间和人员数量有限）。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="286.91" font-size="11.00" class="sc-notoserifcjksc">改进运行框架（</text><text x="149.00 155.59 161.26 166.03 172.71 178.67 183.76" y="286.91" font-size="11.00" class="sc-loraregular">harness</text><text x="188.85 199.85 210.85 221.85 232.85 243.85 254.85 265.85 276.85 287.85 298.85 309.85 320.85 331.85 342.85 353.85 364.85 375.85 386.85 397.85 408.85 419.85 430.85 441.85 452.85 463.85 474.85 485.85 496.85 507.85 518.85 529.85" y="286.91" font-size="11.00" class="sc-notoserifcjksc">）和提示能够在一定程度上缓解这些失败模式，但即使持续努力，构想和</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="302.53" font-size="11.00" class="sc-notoserifcjksc">知识方面的缺口仍然存在。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="335.49" font-size="11.00" class="sc-notoserifcjksc">总体而言，这些失败模式限制了模型替代稀缺人类专业知识与战略判断的有效性，而开展支持新</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00" y="351.11" font-size="11.00" class="sc-notoserifcjksc">型生物武器开发的复杂、开放式且难以验证的研究，需要这两者。因此，我们得出结论：</text><text x="501.00 510.93 516.80 521.05 527.64 534.08" y="351.11" font-size="11.00" class="sc-loraregular">Mythos</text><text x="72.00 78.00 80.70" y="366.73" font-size="11.00" class="sc-loraregular">5.1</text><text x="87.60 98.60 109.60 120.60" y="366.73" font-size="11.00" class="sc-notoserifcjksc">没有跨越</text><text x="134.49 141.40 147.64" y="366.73" font-size="11.00" class="sc-loraregular">RSP</text><text x="157.20 168.20" y="366.73" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="182.09 189.78 196.62 201.65" y="366.73" font-size="11.00" class="sc-loraregular">CB-2</text><text x="210.45 221.45 232.45 243.45 254.45 265.45 276.45 287.45" y="366.73" font-size="11.00" class="sc-notoserifcjksc">阈值，也没有达到</text><text x="301.34 307.29 314.98" y="366.73" font-size="11.00" class="sc-loraregular">FCF</text><text x="323.90 334.90 345.90 356.90 367.90 378.90 389.90 400.90 411.90 422.90" y="366.73" font-size="11.00" class="sc-notoserifcjksc">中的对应级别。我们对</text><text x="436.79 446.73 452.59 456.85 463.43 469.87 474.96 477.86 483.85 486.56" y="366.73" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="493.45 504.45 515.45" y="366.73" font-size="11.00" class="sc-notoserifcjksc">应用与</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="382.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="121.95 132.95 143.95" y="382.35" font-size="11.00" class="sc-notoserifcjksc">相同的</text><text x="157.84 165.53 172.38 177.47" y="382.35" font-size="11.00" class="sc-loraregular">CB-1</text><text x="184.36 195.36 206.36 217.36 228.36 239.36 250.36 261.36 272.36 283.36 294.36 305.36 316.36 327.36 338.36 349.36 360.36 371.36 382.36 393.36" y="382.35" font-size="11.00" class="sc-notoserifcjksc">分类和安全防护措施。我们强调，虽然没有将</text><text x="407.26 417.19 423.05 427.31 433.90 440.33 445.43 448.32" y="382.35" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="457.21" y="382.35" font-size="11.00" class="sc-notoserifcjksc">或</text><text x="471.10 481.03 486.90 491.15 497.74 504.18 509.27 512.16 518.16 520.87" y="382.35" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="527.76" y="382.35" font-size="11.00" class="sc-notoserifcjksc">归</text><text x="72.00" y="397.97" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89 93.58 100.42 105.45" y="397.97" font-size="11.00" class="sc-loraregular">CB-2</text><text x="111.36 122.36 133.36 144.36 155.36 166.36 177.36 188.36 199.36 210.36 221.36 232.36 243.36 254.36" y="397.97" font-size="11.00" class="sc-notoserifcjksc">，但出于审慎，相比应用于包括</text><text x="268.25 276.98 283.55 290.12 295.21 298.11" y="397.97" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="306.99 317.99 328.99 339.99 350.99 361.99 372.99 383.99 394.99 405.99 416.99 427.99 438.99 449.99 460.99 471.99 482.99 493.99 504.99 515.99 526.99" y="397.97" font-size="11.00" class="sc-notoserifcjksc">在内的较弱模型的安全防护措施，我们已扩大了</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="413.59" font-size="11.00" class="sc-notoserifcjksc">对这些模型的防护范围。</text><text x="72.00 80.04 83.68" y="498.81" font-size="14.00" class="sc-poppinssemibold">2.3</text><text x="95.39 109.39 123.39 137.39 151.39" y="498.81" font-size="14.00" class="sc-notosanscjkscbold">自主性评估</text><text x="72.00 79.46 82.84 90.63 94.01" y="535.91" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81 114.81 127.81 140.81 153.81 166.81 179.81" y="535.91" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">我们测量了什么</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="563.79" font-size="11.00" class="sc-notoserifcjksc">这些评估源于我们</text><text x="162.89 169.80 176.04" y="563.79" font-size="11.00" class="sc-loraregular">RSP</text><text x="185.60" y="563.79" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="199.49 205.44 213.13" y="563.79" font-size="11.00" class="sc-loraregular">FCF</text><text x="222.05 233.05 244.05 255.05 266.05 277.05 288.05 299.05 310.05 321.05 332.05" y="563.79" font-size="11.00" class="sc-notoserifcjksc">中的两个关键威胁模型：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="596.18" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="596.18" font-size="11.00" class="sc-lorabold">1</text><text x="156.36 167.36 178.36 189.36 200.36 211.36 222.36 233.36 244.36 255.36 266.36" y="596.18" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="280.25 287.60" y="596.18" font-size="11.00" class="sc-lorabold">AI</text><text x="294.75 305.75 316.75" y="596.18" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="327.75 338.75 349.75 360.75 371.75 382.75 393.75 404.75 415.75 426.75" y="596.18" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注这样的</text><text x="440.64 447.53" y="596.18" font-size="11.00" class="sc-loraregular">AI</text><text x="454.11 465.11 476.11 487.11 498.11 509.11 520.11" y="596.18" font-size="11.00" class="sc-notoserifcjksc">系统：它们被高</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="611.80" font-size="11.00" class="sc-notoserifcjksc">度依赖，拥有对敏感资产的广泛访问权限，并具备中等程度的自主、目标导向运作能力和隐蔽手</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="627.42" font-size="11.00" class="sc-notoserifcjksc">段，以至于这些</text><text x="151.89 158.78" y="627.42" font-size="11.00" class="sc-loraregular">AI</text><text x="165.36 176.36 187.36 198.36 209.36 220.36 231.36 242.36 253.36 264.36 275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36 462.36 473.36 484.36 495.36 506.36 517.36 528.36" y="627.42" font-size="11.00" class="sc-notoserifcjksc">系统如果被引向这一目标（无论是有意还是无意），有可能实施未对齐行为，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00" y="643.04" font-size="11.00" class="sc-notoserifcjksc">从而大幅且不可逆转地提高发生全球性灾难的几率。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p034.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 34 页"><text x="504.00 509.01" y="751.81" font-size="9.00" class="sc-loraregular">34</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="82.61" font-size="11.00" class="sc-lorabold">2</text><text x="157.76 168.76 179.76 190.76 201.76 212.76 223.76 234.76 245.76 256.76 267.76 278.76 289.76 300.76 311.76 322.76 333.76" y="82.61" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域中自动化研发带来的风险。</text><text x="344.76 355.76 366.76 377.76 388.76 399.76 410.76 421.76 432.76 443.76" y="82.61" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注这样的</text><text x="457.65 464.53" y="82.61" font-size="11.00" class="sc-loraregular">AI</text><text x="471.11 482.11 493.11 504.11 515.11 526.11" y="82.61" font-size="11.00" class="sc-notoserifcjksc">系统：它们能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">够完全自动化或以其他方式剧烈加速大型顶尖人类研究团队的工作，而这些工作所在的领域中，</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">快速进展可能对国际安全构成威胁和</text><text x="248.00" y="113.85" font-size="11.00" class="sc-loraregular">/</text><text x="255.59 266.59 277.59 288.59 299.59 310.59 321.59 332.59 343.59 354.59 365.59 376.59 387.59 398.59 409.59 420.59 431.59 442.59 453.59 464.59 475.59 486.59 497.59 508.59 519.59" y="113.85" font-size="11.00" class="sc-notoserifcjksc">或迅速打破全球力量平衡。此类领域的例子包括能源、机</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">器人、武器研发以及</text><text x="173.89 180.78" y="129.47" font-size="11.00" class="sc-loraregular">AI</text><text x="187.36 198.36 209.36" y="129.47" font-size="11.00" class="sc-notoserifcjksc">本身。</text><text x="72.00 77.86 80.43 86.59 89.15 93.61 96.18 100.64 103.54 111.10 114.54 120.30 127.10 133.65 139.57 142.47 152.78 158.85 163.39 170.22 176.44 181.78 184.67 190.61 193.18" y="195.95" font-size="11.00" class="sc-lorabold">2.3.1.1 Claude Mythos 5.1</text><text x="200.54 211.54 222.54 233.54 244.54 255.54 266.54 277.54 288.54 299.54 310.54 321.54 332.54 343.54 354.54" y="195.95" font-size="11.00" class="sc-notoserifcjkscbold">如何影响或改变我们最近一份风险</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="212.15" font-size="11.00" class="sc-notoserifcjkscbold">报告中的分析</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="276.91" font-size="11.00" class="sc-lorabold">1</text><text x="195.25 206.25 217.25" y="276.91" font-size="11.00" class="sc-notoserifcjkscbold">适用于</text><text x="231.14 241.46 247.52 252.07 258.90 265.12 270.46 273.35 279.29 281.86" y="276.91" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="286.32 297.32 308.32 319.32 330.32 341.32 352.32 363.32 374.32 385.32 396.32 407.32 418.32 429.32" y="276.91" font-size="11.00" class="sc-notoserifcjksc">，正如它适用于我们之前的一些</text><text x="443.21 450.10" y="276.91" font-size="11.00" class="sc-loraregular">AI</text><text x="456.68 467.68 478.68 489.68 500.68 511.68 522.68" y="276.91" font-size="11.00" class="sc-notoserifcjksc">模型一样。我们</text><text x="108.00 119.00 130.00" y="292.53" font-size="11.00" class="sc-notoserifcjksc">将在第</text><text x="143.89 149.80 152.51" y="292.53" font-size="11.00" class="sc-loraregular">2.4</text><text x="161.36 172.36 183.36 194.36 205.36 216.36 227.36 238.36 249.36 260.36 271.36 282.36 293.36 304.36 315.36 326.36 337.36 348.36 359.36 370.36 381.36 392.36 403.36 414.36 425.36 436.36" y="292.53" font-size="11.00" class="sc-notoserifcjksc">节中讨论，为什么我们认为该威胁模型下的风险水平仍处于</text><text x="447.36" y="292.53" font-size="11.00" class="sc-loraregular">“</text><text x="451.76" y="292.53" font-size="11.00" class="sc-notoserifcjksc">低</text><text x="462.76" y="292.53" font-size="11.00" class="sc-loraregular">”</text><text x="466.60 477.60 488.60 499.60 510.60 521.60" y="292.53" font-size="11.00" class="sc-notoserifcjksc">水平，与我们</text><text x="108.00 113.91 120.66 126.57" y="308.15" font-size="11.00" class="sc-loraregular" fill="#0000ff">2026</text><text x="135.82" y="308.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">年</text><text x="149.71" y="308.15" font-size="11.00" class="sc-loraregular" fill="#0000ff">8</text><text x="158.79 169.79 180.79 191.79 202.79" y="308.15" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">月风险报告</text><text x="213.79 224.79 235.79 246.79 257.79 268.79 279.79" y="308.15" font-size="11.00" class="sc-notoserifcjksc">中的评估一致。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="341.68" font-size="11.00" class="sc-lorabold">2</text><text x="196.65 207.65 218.65 229.65" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">不适用于</text><text x="243.54 253.86 259.92 264.46 271.29 277.52 282.86 285.75 291.69 294.25" y="341.68" font-size="11.00" class="sc-lorabold">Mythos 5.1</text><text x="298.72" y="341.68" font-size="11.00" class="sc-notoserifcjkscbold">。</text><text x="309.72 319.65 325.51 329.77 336.36 342.79 347.89 350.78 356.78 359.48" y="341.68" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="366.38" y="341.68" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="380.27 387.16" y="341.68" font-size="11.00" class="sc-loraregular">AI</text><text x="393.74 404.74 415.74 426.74 437.74" y="341.68" font-size="11.00" class="sc-notoserifcjksc">研发能力与</text><text x="451.63 459.32 462.31 467.92 474.49 481.07 487.03 489.92 499.85 505.72 509.97 516.56 523.00 528.09 530.98" y="341.68" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00 218.00 229.00 240.00 251.00 262.00 273.00 284.00 295.00" y="357.30" font-size="11.00" class="sc-notoserifcjksc">所确立的能力前沿相当。我们的结论是，</text><text x="306.00 315.93 321.80 326.05 332.64 339.08 344.17 347.06 353.06 355.76" y="357.30" font-size="11.00" class="sc-loraregular">Mythos 5.1</text><text x="362.66 373.66 384.66 395.66 406.66 417.66 428.66 439.66 450.66 461.66 472.66 483.66 494.66 505.66 516.66 527.66" y="357.30" font-size="11.00" class="sc-notoserifcjksc">没有跨越风险阈值，理由与我们在评</text><text x="108.00" y="372.92" font-size="11.00" class="sc-notoserifcjksc">估</text><text x="121.89 131.83 137.69 141.95 148.54 154.97 160.06 162.96" y="372.92" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="171.84 182.84 193.84 204.84 215.84 226.84 237.84 248.84 259.84 270.84" y="372.92" font-size="11.00" class="sc-notoserifcjksc">时讨论的两点相同：（</text><text x="281.84" y="372.92" font-size="11.00" class="sc-loraregular">1</text><text x="285.85 296.85 307.85 318.85 329.85 340.85 351.85 362.85" y="372.92" font-size="11.00" class="sc-notoserifcjksc">）我们没有观察到</text><text x="376.74 383.63" y="372.92" font-size="11.00" class="sc-loraregular">AI</text><text x="390.21 401.21 412.21 423.21 434.21 445.21 456.21 467.21 478.21 489.21 500.21 511.21 522.21" y="372.92" font-size="11.00" class="sc-notoserifcjksc">研发进展速度出现持续的、可</text><text x="108.00 119.00 130.00" y="388.54" font-size="11.00" class="sc-notoserifcjksc">归因于</text><text x="143.89 150.78" y="388.54" font-size="11.
