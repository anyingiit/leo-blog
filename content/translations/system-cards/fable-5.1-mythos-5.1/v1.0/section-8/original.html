<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p168.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 168 页"><text x="72.00 80.93 84.30 92.61 96.25 106.17 114.80 123.44 132.92 141.37 155.35 162.68 166.32 174.38 179.28 182.65" y="346.98" font-size="14.00" class="sc-poppinsmedium">8.3 DeepSWE v1.1</text><text x="72.00 80.93 84.30 93.35 96.99 104.20 109.57 118.50 127.58 132.78 136.48 145.11 150.48 161.30 170.23 179.71" y="569.22" font-size="14.00" class="sc-poppinsmedium">8.4 FrontierCode</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">168</text><text x="72.00" y="80.05" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="81.00" y="80.05" font-size="9.00" class="sc-loraregular sc-k">temperature</text><text x="133.64" y="80.05" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="142.64" y="80.05" font-size="9.00" class="sc-loraregular">top_p</text><text x="168.70" y="80.05" font-size="9.00" class="sc-notoserifcjksc">），取五次试验的平均值。上下文窗口大小因评估而异，且不超过</text><text x="432.06" y="80.05" font-size="9.00" class="sc-loraregular">100</text><text x="448.88" y="80.05" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="460.25" y="80.05" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="484.11" y="80.05" font-size="9.00" class="sc-notoserifcjksc">。每行中的最</text><text x="72.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">佳分数以</text><text x="108.00" y="91.75" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="126.00" y="91.75" font-size="9.00" class="sc-notoserifcjksc">标示。竞争对手的数据取自各开发者公开发布的系统卡（</text><text x="351.00" y="91.75" font-size="9.00" class="sc-loraregular sc-k">System Card</text><text x="403.90" y="91.75" font-size="9.00" class="sc-notoserifcjksc">）或基准测试排行榜。早期</text><text x="72.00" y="103.45" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="103.33" y="103.45" font-size="9.00" class="sc-notoserifcjksc">模型的评估细节请参阅</text><text x="195.70" y="103.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="258.72" y="103.45" font-size="9.00" class="sc-notoserifcjksc">系统卡。</text><text x="72.00" y="153.20" font-size="14.00" class="sc-poppinssemibold">8.2 SWE-bench Pro</text><text x="205.98" y="153.20" font-size="14.00" class="sc-notosanscjkscbold">、</text><text x="219.98" y="153.20" font-size="14.00" class="sc-poppinssemibold">Multilingual</text><text x="307.54" y="153.20" font-size="14.00" class="sc-notosanscjkscbold">与</text><text x="324.87" y="153.20" font-size="14.00" class="sc-poppinssemibold">Multimodal</text><text x="72.00" y="179.75" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="135.56" y="179.75" font-size="11.00" class="sc-notoserifcjksc">在真实世界软件工程任务上测试</text><text x="292.45" y="179.75" font-size="11.00" class="sc-loraregular">AI</text><text x="305.92" y="179.75" font-size="11.00" class="sc-notoserifcjksc">模型。我们报告三个变体，每个分数均为五次试</text><text x="72.00" y="195.37" font-size="11.00" class="sc-notoserifcjksc">验的平均值：</text><text x="108.00" y="228.11" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="171.56" y="228.11" font-size="11.00" class="sc-lorabold sc-k">Pro</text><text x="190.01" y="224.44" font-size="6.60" class="sc-loraregular">12</text><text x="198.84" y="228.11" font-size="11.00" class="sc-notoserifcjksc">由取自持续维护的代码仓库、涉及大型多文件</text><text x="421.74" y="228.11" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="441.85" y="228.11" font-size="11.00" class="sc-notoserifcjksc">的问题组成。</text><text x="507.85" y="228.11" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="108.00" y="243.73" font-size="11.00" class="sc-loraregular">5.1</text><text x="123.60" y="243.73" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="159.49" y="243.73" font-size="11.00" class="sc-loraregular">81.2%</text><text x="190.75" y="243.73" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00" y="260.70" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="171.56" y="260.70" font-size="11.00" class="sc-lorabold sc-k">Multilingual</text><text x="239.38" y="260.70" font-size="11.00" class="sc-notoserifcjksc">将该形式扩展到涵盖九种编程语言的</text><text x="418.28" y="260.70" font-size="11.00" class="sc-loraregular">300</text><text x="440.96" y="260.70" font-size="11.00" class="sc-notoserifcjksc">个问题。</text><text x="484.96" y="260.70" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="108.00" y="276.32" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="143.89" y="276.32" font-size="11.00" class="sc-loraregular sc-k">89.1%</text><text x="175.35" y="276.32" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="108.00" y="292.87" font-size="11.00" class="sc-loraregular sc-k">SWE-bench</text><text x="171.56" y="292.87" font-size="11.00" class="sc-lorabold sc-k">Multimodal</text><text x="232.42" y="289.21" font-size="6.60" class="sc-loraregular">13</text><text x="241.39" y="292.87" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="255.29" y="292.87" font-size="11.00" class="sc-loraregular">issue</text><text x="283.98" y="292.87" font-size="11.00" class="sc-notoserifcjksc">描述中加入了视觉上下文（截图、设计稿）。</text><text x="503.98" y="292.87" font-size="11.00" class="sc-loraregular sc-k">Fable</text><text x="108.00" y="308.49" font-size="11.00" class="sc-loraregular">5.1</text><text x="123.60" y="308.49" font-size="11.00" class="sc-notoserifcjksc">取得了</text><text x="159.49" y="308.49" font-size="11.00" class="sc-loraregular sc-k">54.7%</text><text x="191.34" y="308.49" font-size="11.00" class="sc-notoserifcjksc">的成绩。</text><text x="72.00" y="369.63" font-size="11.00" class="sc-loraregular sc-k">DeepSWE</text><text x="125.48" y="369.63" font-size="11.00" class="sc-notoserifcjksc">是一组包含</text><text x="183.38" y="369.63" font-size="11.00" class="sc-loraregular">113</text><text x="200.40" y="369.63" font-size="11.00" class="sc-notoserifcjksc">个长程软件工程任务的基准，旨在衡量前沿编程智能体的能力。这些</text><text x="72.00" y="385.25" font-size="11.00" class="sc-notoserifcjksc">任务多样，反映真实世界的复杂性，并且全部从零编写，以避免基准污染。</text><text x="435.00" y="385.25" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="480.11" y="385.25" font-size="11.00" class="sc-notoserifcjksc">在五次试验</text><text x="72.00" y="400.87" font-size="11.00" class="sc-notoserifcjksc">中的平均得分为</text><text x="151.89" y="400.87" font-size="11.00" class="sc-loraregular sc-k">67.4%</text><text x="181.00" y="400.87" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="450.59" font-size="11.00" class="sc-notoserifcjksc">关于评分的说明：</text><text x="160.00" y="450.59" font-size="11.00" class="sc-loraregular sc-k">DeepSWE</text><text x="213.48" y="450.59" font-size="11.00" class="sc-notoserifcjksc">使用隐藏测试对每个任务评分，而这些测试往往是针对单一参考解</text><text x="72.00" y="466.21" font-size="11.00" class="sc-notoserifcjksc">答编写的。在审查失败的对话记录时，我们发现</text><text x="305.89" y="466.21" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="351.00" y="466.21" font-size="11.00" class="sc-notoserifcjksc">对一些表述模糊的任务的实现比任务要</text><text x="72.00" y="497.45" font-size="11.00" class="sc-notoserifcjksc">导致一些同样有效或更为严谨的实现未能通过隐藏测试。</text><text x="72.00" y="591.89" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="143.25" y="591.89" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="168.14" y="591.89" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="221.64" y="591.89" font-size="11.00" class="sc-notoserifcjksc">创建的智能体编程基准测试，包含</text><text x="389.54" y="591.89" font-size="11.00" class="sc-loraregular">150</text><text x="409.26" y="591.89" font-size="11.00" class="sc-notoserifcjksc">个软件工程任务。任务源自</text><text x="72.00" y="607.51" font-size="11.00" class="sc-notoserifcjksc">开源代码仓库中的真实拉取请求（</text><text x="237.00" y="607.51" font-size="11.00" class="sc-loraregular sc-k">pull request</text><text x="297.82" y="607.51" font-size="11.00" class="sc-notoserifcjksc">），例如修复</text><text x="366.71" y="607.51" font-size="11.00" class="sc-robotomonoregular" fill="#188038">aiohttp</text><text x="415.81" y="607.51" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="440.71" y="607.51" font-size="11.00" class="sc-loraregular sc-k">websocket</text><text x="497.99" y="607.51" font-size="11.00" class="sc-notoserifcjksc">缺陷、加</text><text x="72.00" y="623.13" font-size="11.00" class="sc-notoserifcjksc">固</text><text x="85.89" y="623.13" font-size="11.00" class="sc-loraregular">Prisma</text><text x="123.91" y="623.13" font-size="11.00" class="sc-notoserifcjksc">的浏览器打包文件，或扩展</text><text x="258.80" y="623.13" font-size="11.00" class="sc-loraregular sc-k">JSON schema</text><text x="330.95" y="623.13" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="344.84" y="623.13" font-size="11.00" class="sc-loraregular sc-k">lint</text><text x="364.66" y="623.13" font-size="11.00" class="sc-notoserifcjksc">规则。每个任务为智能体提供一个已</text><text x="72.00" y="638.75" font-size="11.00" class="sc-notoserifcjksc">检出的代码仓库和一份</text><text x="184.89" y="638.75" font-size="11.00" class="sc-loraregular">issue</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">12</text><text x="80.04 87.49 92.91 98.98 104.51 107.03 109.66 116.15 118.61 121.13 123.76 129.11 132.98 135.61 140.77 143.49 145.95 148.58 151.63 157.00 163.14 168.51 173.96 177.01 179.47 182.10 187.77 197.72 203.74 208.63 214.85 220.27 226.34 231.66 237.65 240.28 246.34 250.60 256.45 258.95 261.58 268.57 273.73 279.80 282.43 288.69 292.04 294.67 299.83 305.31 310.73 316.71 320.58 325.21 327.84 332.47 338.32 341.00 346.00 351.42 354.05 356.77 362.62 368.69 374.22 379.11 385.10 390.95 395.28 398.09 403.12 408.97 415.04 417.67 422.30 428.10 431.60 435.64 443.55 448.71 452.97 458.39 461.02 466.44 472.51 478.28 481.09 487.16 492.53 497.95 502.28 505.09 511.16" y="678.20" font- ="noopener"><rect x="220.64" y="684.40" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="267.92" y="684.40" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2509.16941" rel="noopener"><rect x="267.92" y="684.40" width="71.53" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="200.66" y="712.80" width="37.43" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="238.09" y="712.80" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="238.09" y="712.80" width="47.28" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="285.37" y="712.80" width="0.00" height="10.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2410.03859" rel="noopener"><rect x="285.37" y="712.80" width="73.36" height="10.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p169.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 169 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">169</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">描述；随后智能体在容器化环境中自主工作以产出最终补丁，全程没有人工干预，也不提供任何</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">超时信息。补丁依据阻断性功能标准（主要是留出的单元测试）以及加权评分细则标准进行评</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，其中包括由模型评分的检查项，用于检查所要求的测试覆盖率和禁止的实现模式。任务由相</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">应底层代码仓库的维护者编写，并经</text><text x="250.89" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Cognition</text><text x="304.40" y="129.47" font-size="11.00" class="sc-notoserifcjksc">研究人员逐一审核，其中随机抽取的一部分任务</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">经人工求解以验证公平性。我们报告</text><text x="250.89" y="145.09" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="322.14" y="145.09" font-size="11.00" class="sc-notoserifcjksc">的总分，这是一个综合指标，依据阻断性功</text><text x="72.00" y="160.71" font-size="11.00" class="sc-notoserifcjksc">能标准（留出的单元测试）以及加权的代码质量评分细则标准对每个补丁进行评分。</text><text x="72.00" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="244.53" font-size="11.00" class="sc-loraregular sc-k">FrontierCode 1.1 Extended</text><text x="222.27" y="244.53" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="244.27" y="244.53" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="327.67" y="244.53" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="341.57" y="244.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="384.07" y="244.53" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="463.96" y="244.53" font-size="11.00" class="sc-loraregular sc-k">63.6%</text><text x="494.97" y="244.53" font-size="11.00" class="sc-notoserifcjksc">，略低于</text><text x="72.00" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="145.80" y="260.15" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="156.80" y="260.15" font-size="11.00" class="sc-loraregular">64.9%</text><text x="187.75" y="260.15" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="198.75" y="260.15" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="231.76" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）。在</text><text x="267.65" y="260.15" font-size="11.00" class="sc-loraregular sc-k">FrontierCode 1.1</text><text x="349.61" y="260.15" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="360.61" y="260.15" font-size="11.00" class="sc-loraregular">Main</text><text x="386.15" y="260.15" font-size="11.00" class="sc-notoserifcjksc">）上，</text><text x="419.15" y="260.15" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="464.27" y="260.15" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="478.16" y="260.15" font-size="11.00" class="sc-loraregular sc-k">medium</text><text x="522.86" y="260.15" font-size="11.00" class="sc-notoserifcjksc">推</text><text x="72.00" y="275.77" font-size="11.00" class="sc-notoserifcjksc">理强度下得分</text><text x="140.89" y="275.77" font-size="11.00" class="sc-loraregular sc-k">50.9%</text><text x="172.18" y="275.77" font-size="11.00" class="sc-notoserifcjksc">，比</text><text x="197.07" y="275.77" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="232.58" y="275.77" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="243.58" y="275.77" font-size="11.00" class="sc-loraregular">53.5%</text><text x="273.97" y="275.77" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="284.97" y="275.77" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="317.98" y="275.77" font-size="11.00" class="sc-notoserifcjksc">）低</text><text x="342.87" y="275.77" font-size="11.00" class="sc-loraregular sc-k">2.6</text><text x="360.62" y="275.77" font-size="11.00" class="sc-notoserifcjksc">个百分点。在每个推理强度档位下，</text><text x="72.00" y="291.39" font-size="11.00" class="sc-notoserifcjksc">它的每任务成本都低于</text><text x="184.89" y="291.39" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="220.40" y="291.39" font-size="11.00" class="sc-notoserifcjksc">（在</text><text x="245.29" y="291.39" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="265.10" y="291.39" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="276.10" y="291.39" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="318.60" y="291.39" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="332.49" y="291.39" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="361.79" y="291.39" font-size="11.00" class="sc-notoserifcjksc">推理强度下大约低一半，在</text><text x="496.68" y="291.39" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="72.00" y="307.01" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="85.89" y="307.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="108.59" y="307.01" font-size="11.00" class="sc-notoserifcjksc">下约低</text><text x="144.48" y="307.01" font-size="11.00" class="sc-loraregular">30%</text><text x="167.01" y="307.01" font-size="11.00" class="sc-notoserifcjksc">），并且在</text><text x="224.90" y="307.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="244.71" y="307.01" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="255.71" y="307.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="298.21" y="307.01" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="312.10" y="307.01" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="341.40" y="307.01" font-size="11.00" class="sc-notoserifcjksc">推理强度下也比</text><text x="421.29" y="307.01" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="498.32" y="307.01" font-size="11.00" class="sc-notoserifcjksc">更便</text><text x="72.00" y="344.33" font-size="11.00" class="sc-notoserifcjksc">关于</text><text x="96.89" y="344.33" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="142.00" y="344.33" font-size="11.00" class="sc-notoserifcjksc">的分数为何在</text><text x="210.90" y="344.33" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="240.19" y="344.33" font-size="11.00" class="sc-notoserifcjksc">及更高推理强度下下降的说明：</text><text x="394.19" y="344.33" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="465.44" y="344.33" font-size="11.00" class="sc-notoserifcjksc">从任务正确性</text><text x="72.00" y="359.95" font-size="11.00" class="sc-notoserifcjksc">和范围两方面对每个任务评分。由于该评估的设计目标是产出无需人工修改即可合并的</text><text x="492.89" y="359.95" font-size="11.00" class="sc-loraregular sc-k">diff</text><text x="510.11" y="359.95" font-size="11.00" class="sc-notoserifcjksc">，任</text><text x="72.00" y="375.57" font-size="11.00" class="sc-notoserifcjksc">何对任务范围之外文件的改动都会被判为失败，即使该改动是正确的或有帮助的。这一范围标准</text><text x="72.00" y="391.19" font-size="11.00" class="sc-notoserifcjksc">既解释了</text><text x="118.89" y="391.19" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="164.00" y="391.19" font-size="11.00" class="sc-notoserifcjksc">在较高推理强度下的分数下降，也解释了它与</text><text x="386.90" y="391.19" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="425.30" y="391.19" font-size="11.00" class="sc-notoserifcjksc">之间的差距。在</text><text x="505.19" y="391.19" font-size="11.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="527.89" y="391.19" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="406.81" font-size="11.00" class="sc-robotomonoregular" fill="#188038">medium</text><text x="114.50" y="406.81" font-size="11.00" class="sc-notoserifcjksc">推理强度下，</text><text x="180.50" y="406.81" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="225.61" y="406.81" font-size="11.00" class="sc-notoserifcjksc">在两个子集上的得分都略高于</text><text x="371.50" y="406.81" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="407.01" y="406.81" font-size="11.00" class="sc-notoserifcjksc">，且其在任务正确性标准上</text><text x="72.00" y="422.43" font-size="11.00" class="sc-notoserifcjksc">的通过率随推理强度提高而持续上升。但在较高推理强度下，</text><text x="369.00" y="422.43" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="414.11" y="422.43" font-size="11.00" class="sc-notoserifcjksc">偶尔会在任务之外的文件</text><text x="72.00" y="438.05" font-size="11.00" class="sc-notoserifcjksc">中添加更多细小的、未经要求的改动，例如在相邻文件中添加一条文档注释、修改某个文档页</text><text x="72.00" y="453.67" font-size="11.00" class="sc-notoserifcjksc">面，或在本可复用现有</text><text x="184.89" y="453.67" font-size="11.00" class="sc-loraregular">CI</text><text x="196.27" y="453.67" font-size="11.00" class="sc-notoserifcjksc">（持续集成）作业的情况下新增一个</text><text x="375.16" y="453.67" font-size="11.00" class="sc-loraregular">CI</text><text x="389.43" y="453.67" font-size="11.00" class="sc-notoserifcjksc">作业。相同推理强度档位下的</text><text x="72.00" y="469.29" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="110.40" y="469.29" font-size="11.00" class="sc-notoserifcjksc">则以</text><text x="135.29" y="469.29" font-size="11.00" class="sc-loraregular sc-k">FrontierCode</text><text x="206.54" y="469.29" font-size="11.00" class="sc-notoserifcjksc">评分者认可的方式，将更多改动保持在请求范围之内。因此，</text><text x="503.54" y="469.29" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="261.89" y="484.91" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="307.00" y="484.91" font-size="11.00" class="sc-notoserifcjksc">的分数在</text><text x="353.90" y="484.91" font-size="11.00" class="sc-loraregular sc-k">medium</text><text x="478.49" y="484.91" font-size="11.00" class="sc-robotomonoregular" fill="#188038">high</text><text x="504.90" y="484.91" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="72.00" y="500.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="107.90" y="500.53" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="121.79" y="500.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="144.49" y="500.53" font-size="11.00" class="sc-notoserifcjksc">下得分低于</text><text x="202.38" y="500.53" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="237.89" y="500.53" font-size="11.00" class="sc-notoserifcjksc">。加入一条简洁性指令（包括提示避免不必要的注释和文档）</text><text x="72.00" y="516.15" font-size="11.00" class="sc-notoserifcjksc">有助于减少超出范围的修改，但我们报告的是未对官方评估做任何改动时的分数。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p170.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 170 页"><text x="72.00 80.93 84.30 93.24 96.88 104.08 109.46 118.38 127.47 132.67 136.36 145.00 150.37 158.82 172.80 180.13 183.77 191.83" y="427.73" font-size="14.00" class="sc-poppinsmedium">8.5 FrontierSWE v2</text><text x="72.00" y="713.04" font-size="6.00" class="sc-loraregular">14</text><text x="80.06 86.12 90.38 96.18 101.48 104.29 113.22 118.38 121.10 123.73 126.78 132.14 138.28 143.65 149.31 152.36 154.82 157.44 162.82 167.08 172.93 178.91 182.77 185.58 191.00 195.33 201.00 210.94 217.16 219.79 224.84 230.21" y="717.26" font-size="10.00" class="sc-loraregular">Proximal (2026). FrontierSWE v2.</text><text x="235.29 241.19 245.16 249.03 255.00 259.62 262.12 265.81 272.59 280.86 289.14 296.66 299.12 305.08 309.34 315.14 320.44 323.25 332.18 337.34 340.06 342.52 347.68 350.28 357.17 362.99 365.71 371.56 377.09 383.98 387.36 391.62 397.47 403.45 407.31 410.12 415.54 419.87 424.50 432.38 437.75 442.80 447.94" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://www.proximal.ai/blog/frontierswev2/</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">170</text><text x="72.00" y="390.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="390.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.01 101.11 106.64 110.11 112.48 117.49 121.73 126.83 132.52 136.23 139.18 144.02 148.34 154.53 159.62 164.99 169.83 172.20 177.04 180.69 182.79 186.44 188.81 194.43 199.36 203.08 207.92 213.66 219.02 223.87" y="390.43" font-size="9.00" class="sc-lorabold">8.4.A] FrontierCode v1.1 Extended</text><text x="231.60" y="390.43" font-size="9.00" class="sc-notoserifcjksc">在各推理强度档位下的得分与平均每任务成本的关系。</text><text x="72.00" y="450.16" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="152.07" y="446.49" font-size="6.60" class="sc-loraregular">14</text><text x="160.94" y="450.16" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="174.83" y="450.16" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="222.88" y="450.16" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，包含</text><text x="335.78" y="450.16" font-size="11.00" class="sc-loraregular">34</text><text x="350.76" y="450.16" font-size="11.00" class="sc-notoserifcjksc">个超长程的工程与研究任务，例如将</text><text x="72.00" y="465.78" font-size="11.00" class="sc-loraregular sc-k">Quantum ESPRESSO</text><text x="180.67" y="465.78" font-size="11.00" class="sc-notoserifcjksc">从</text><text x="194.56" y="465.78" font-size="11.00" class="sc-loraregular sc-k">Fortran</text><text x="235.89" y="465.78" font-size="11.00" class="sc-notoserifcjksc">移植到</text><text x="271.78" y="465.78" font-size="11.00" class="sc-loraregular">Rust</text><text x="294.61" y="465.78" font-size="11.00" class="sc-notoserifcjksc">、构建一个能够运行飞行模拟器的</text><text x="462.50" y="465.78" font-size="11.00" class="sc-loraregular sc-k">OpenGL</text><text x="507.93" y="465.78" font-size="11.00" class="sc-notoserifcjksc">场景渲</text><text x="72.00" y="481.40" font-size="11.00" class="sc-notoserifcjksc">染器，以及对一个大语言模型（</text><text x="226.00" y="481.40" font-size="11.00" class="sc-loraregular">LLM</text><text x="248.81" y="481.40" font-size="11.00" class="sc-notoserifcjksc">）进行后训练以使其能玩一款交互式解谜游戏。最强的模型</text><text x="72.00" y="497.02" font-size="11.00" class="sc-notoserifcjksc">在每个任务上往往要工作近</text><text x="206.89" y="497.02" font-size="11.00" class="sc-loraregular">20</text><text x="222.52" y="497.02" font-size="11.00" class="sc-notoserifcjksc">小时，且距离使该基准饱和仍相去甚远。每个模型都在</text><text x="489.42" y="497.02" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="72.00" y="512.64" font-size="11.00" class="sc-notoserifcjksc">自己的智能体运行框架（</text><text x="193.00" y="512.64" font-size="11.00" class="sc-loraregular">harness</text><text x="232.85" y="512.64" font-size="11.00" class="sc-notoserifcjksc">）中以最高推理强度运行，每个任务进行五次试验，报告的分数</text><text x="72.00" y="528.26" font-size="11.00" class="sc-notoserifcjksc">为各次试验的平均值，取值范围为</text><text x="239.89" y="528.26" font-size="11.00" class="sc-loraregular">0</text><text x="249.62" y="528.26" font-size="11.00" class="sc-notoserifcjksc">到</text><text x="263.51" y="528.26" font-size="11.00" class="sc-loraregular">1</text><text x="267.51" y="528.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="579.92" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="579.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="169.29" y="579.92" font-size="11.00" class="sc-loraregular sc-k">FrontierSWE v2</text><text x="252.26" y="579.92" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="288.15" y="579.92" font-size="11.00" class="sc-loraregular sc-k">0.57</text><text x="308.58" y="579.92" font-size="11.00" class="sc-notoserifcjksc">，是</text><text x="333.47" y="579.92" font-size="11.00" class="sc-loraregular sc-k">Proximal</text><text x="381.52" y="579.92" font-size="11.00" class="sc-notoserifcjksc">所评估模型中的最高分，领先于</text><text x="72.00" y="595.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="146.14" y="595.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="157.14" y="595.54" font-size="11.00" class="sc-loraregular sc-k">0.52</text><text x="178.40" y="595.54" font-size="11.00" class="sc-notoserifcjksc">）、</text><text x="200.40" y="595.54" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="274.20" y="595.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="285.20" y="595.54" font-size="11.00" class="sc-loraregular sc-k">0.48</text><text x="306.71" y="595.54" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="331.60" y="595.54" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="391.86" y="595.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="402.86" y="595.54" font-size="11.00" class="sc-loraregular sc-k">0.32</text><text x="424.25" y="595.54" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="628.48" font-size="11.00" class="sc-notoserifcjksc">在每个模型都产出了有效评分结果的</text><text x="250.89" y="628.48" font-size="11.00" class="sc-loraregular">33</text><text x="266.04" y="628.48" font-size="11.00" class="sc-notoserifcjksc">个任务中，</text><text x="321.04" y="628.48" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="366.15" y="628.48" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="380.04" y="628.48" font-size="11.00" class="sc-loraregular">22</text><text x="394.75" y="628.48" font-size="11.00" class="sc-notoserifcjksc">个任务上领先，且没有明显的</text><text x="72.00" y="644.10" font-size="11.00" class="sc-notoserifcjksc">薄弱领域。它在需要持续多小时推理与执行的任务上表现最强。在它落后于其他模型的任务上，</text><text x="72.00" y="659.72" font-size="11.00" class="sc-notoserifcjksc">差距总体较小，</text><text x="149.00" y="659.72" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="187.40" y="659.72" font-size="11.00" class="sc-notoserifcjksc">仍在少数个别任务上得分更高。</text><text x="341.40" y="659.72" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="380.14" y="659.72" font-size="11.00" class="sc-notoserifcjksc">在部分任务上能与</text><text x="471.04" y="659.72" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="516.15" y="659.72" font-size="11.00" class="sc-notoserifcjksc">的最</text><text x="72.00" y="675.34" font-size="11.00" class="sc-notoserifcjksc">佳</text><a href="https://www.proximal.ai/blog/frontierswev2/" rel="noopener"><rect x="235.29" y="707.20" width="219.54" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p171.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 171 页"><text x="72.00 80.93 84.30 93.28 96.92 104.81 113.44 118.82 133.36 137.05 146.13 155.62 159.31 167.50 176.31 184.94 194.03 202.42 211.50 215.14 224.19 227.57" y="217.44" font-size="14.00" class="sc-poppinsmedium">8.6 Terminal-Bench 4.0</text><text x="72.00 80.93 84.30 92.13 95.77 103.66 112.30 117.67 132.21 135.90 144.98 154.47 158.16 166.35 175.16 183.80 192.88 201.27 210.35 218.54 226.99 235.39 239.08 247.71 256.79 265.19 273.82 277.46 286.43 289.80" y="585.44" font-size="14.00" class="sc-poppinsmedium">8.7 Terminal-Bench-Science 0.1</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">171</text><text x="338.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="384.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的表现则随任务难度提高仍能保</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">持。</text><text x="94.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="139.11" y="98.23" font-size="11.00" class="sc-notoserifcjksc">的表现下限也显著高于</text><text x="252.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="287.51" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，任务得分中位数为</text><text x="389.40" y="98.23" font-size="11.00" class="sc-loraregular sc-k">0.56</text><text x="411.12" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="436.01" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="474.41" y="98.23" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="488.31" y="98.23" font-size="11.00" class="sc-loraregular sc-k">0.41</text><text x="507.63" y="98.23" font-size="11.00" class="sc-notoserifcjksc">；它的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">彻底失败率也是三者中最低的（</text><text x="226.00" y="113.85" font-size="11.00" class="sc-loraregular">5%</text><text x="244.46" y="113.85" font-size="11.00" class="sc-notoserifcjksc">的试验，而</text><text x="302.35" y="113.85" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="341.09" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="354.99" y="113.85" font-size="11.00" class="sc-loraregular">6%</text><text x="370.91" y="113.85" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="381.91" y="113.85" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="420.32" y="113.85" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="434.21" y="113.85" font-size="11.00" class="sc-loraregular">8%</text><text x="449.96" y="113.85" font-size="11.00" class="sc-notoserifcjksc">）。它的高端结果</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">占比同样最高，有</text><text x="162.89" y="129.47" font-size="11.00" class="sc-loraregular">38%</text><text x="187.66" y="129.47" font-size="11.00" class="sc-notoserifcjksc">的试验得分高于</text><text x="267.56" y="129.47" font-size="11.00" class="sc-loraregular sc-k">0.8</text><text x="283.10" y="129.47" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="294.10" y="129.47" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="72.00" y="145.09" font-size="11.00" class="sc-notoserifcjksc">与更强的表现下限，在困难的长程工程工作上尤为如此。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 157.69 163.65 166.19" y="240.09" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="175.92" y="240.09" font-size="11.00" class="sc-notoserifcjksc">在终端和命令行容器化环境中的真实世界工作上测试</text><text x="431.81" y="240.09" font-size="11.00" class="sc-loraregular">AI</text><text x="445.27" y="240.09" font-size="11.00" class="sc-notoserifcjksc">模型。它包含</text><text x="514.17" y="240.09" font-size="11.00" class="sc-loraregular">66</text><text x="529.78" y="240.09" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="255.71" font-size="11.00" class="sc-notoserifcjksc">任务，侧重于与科学相关的问题和前沿工程问题，如计算生物学、物理仿真、</text><text x="446.00" y="255.71" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="468.66" y="255.71" font-size="11.00" class="sc-notoserifcjksc">、形式化证明</text><text x="72.00" y="271.33" font-size="11.00" class="sc-notoserifcjksc">以及</text><text x="96.89" y="271.33" font-size="11.00" class="sc-loraregular">GPU</text><text x="123.10" y="271.33" font-size="11.00" class="sc-notoserifcjksc">性能优化工作。以往的</text><text x="235.99 242.49 248.45 253.21 263.05 266.14 272.82 278.49 281.48 286.86 293.71 299.67 306.34 312.20" y="271.33" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="321.68" y="271.33" font-size="11.00" class="sc-notoserifcjksc">版本</text><text x="343.68" y="271.33" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">非常容易受超时和资源因素影响</text><text x="497.68" y="271.33" font-size="11.00" class="sc-notoserifcjksc">：</text><text x="508.68" y="271.33" font-size="11.00" class="sc-loraregular sc-k">4.0</text><text x="526.91" y="271.33" font-size="11.00" class="sc-notoserifcjksc">版</text><text x="72.00" y="286.95" font-size="11.00" class="sc-notoserifcjksc">本通过延长超时时间，并在少数能从中受益的任务中自适应地提高</text><text x="393.89" y="286.95" font-size="11.00" class="sc-loraregular sc-k">RAM</text><text x="421.22" y="286.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="435.11" y="286.95" font-size="11.00" class="sc-loraregular">CPU</text><text x="460.63" y="286.95" font-size="11.00" class="sc-notoserifcjksc">配额，在很大程</text><text x="72.00" y="302.57" font-size="11.00" class="sc-notoserifcjksc">度上解决了这些问题。沙箱服务提供商的选择在少数任务中可能仍是一个混杂因素，但我们预计</text><text x="72.00" y="318.19" font-size="11.00" class="sc-notoserifcjksc">其作用将明显小于以往版本。我们还发现，此次升级减弱了各种运行框架带来的混杂作用（例如</text><text x="72.00" y="333.81" font-size="11.00" class="sc-loraregular">CLI</text><text x="92.62" y="333.81" font-size="11.00" class="sc-notoserifcjksc">内存占用、上下文压缩（</text><text x="213.62" y="333.81" font-size="11.00" class="sc-loraregular sc-k">compaction</text><text x="274.19" y="333.81" font-size="11.00" class="sc-notoserifcjksc">）策略和容器通信协议），最终使</text><text x="442.08 448.59 454.55 459.31 469.14 472.24 478.91 484.59 487.58 492.96 499.80 505.76 512.44 518.29" y="333.81" font-size="11.00" class="sc-loraregular">Terminal-Bench</text><text x="527.77" y="333.81" font-size="11.00" class="sc-notoserifcjksc">成</text><text x="72.00" y="349.43" font-size="11.00" class="sc-notoserifcjksc">为一项更稳定、更严谨的评估。</text><text x="72.00" y="434.41" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="166.95" y="434.41" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="180.85 187.35 193.31 198.07 207.90 211.00 217.67 223.35 226.34 231.72 238.56 244.52 251.20 257.05 263.64 266.54 272.50 275.04" y="434.41" font-size="11.00" class="sc-loraregular">Terminal-Bench 4.0</text><text x="284.76" y="434.41" font-size="11.00" class="sc-notoserifcjksc">上得分</text><text x="320.66" y="434.41" font-size="11.00" class="sc-loraregular sc-k">60.9%</text><text x="352.30" y="434.41" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="363.30" y="434.41" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="446.70" y="434.41" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="471.60" y="434.41" font-size="11.00" class="sc-loraregular">55.8%</text><text x="502.05" y="434.41" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="450.03" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="149.03" y="450.03" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="173.93" y="450.03" font-size="11.00" class="sc-loraregular">52.3%</text><text x="204.23" y="450.03" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="215.23" y="450.03" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="291.92" y="450.03" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="316.82" y="450.03" font-size="11.00" class="sc-loraregular sc-k">42.0%</text><text x="347.63" y="450.03" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="358.63" y="450.03" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="415.29" y="450.03" font-size="11.00" class="sc-notoserifcjksc">的分数为每个任务</text><text x="506.18" y="450.03" font-size="11.00" class="sc-loraregular">10</text><text x="519.91" y="450.03" font-size="11.00" class="sc-notoserifcjksc">次</text><text x="72.00" y="465.65" font-size="11.00" class="sc-notoserifcjksc">试验（共</text><text x="118.89" y="465.65" font-size="11.00" class="sc-loraregular">660</text><text x="141.33" y="465.65" font-size="11.00" class="sc-notoserifcjksc">次试验）的平均值，其他三个模型为每个任务</text><text x="364.23" y="465.65" font-size="11.00" class="sc-loraregular">15</text><text x="377.12" y="465.65" font-size="11.00" class="sc-notoserifcjksc">次试验（共</text><text x="435.01" y="465.65" font-size="11.00" class="sc-loraregular">990</text><text x="457.45" y="465.65" font-size="11.00" class="sc-notoserifcjksc">次试验）的平均</text><text x="72.00" y="481.27" font-size="11.00" class="sc-notoserifcjksc">值；每个模型的标准误均为</text><text x="206.89 212.72 216.73 219.32 225.68 232.17" y="481.27" font-size="11.00" class="sc-loraregular">±1.6–2</text><text x="240.97" y="481.27" font-size="11.00" class="sc-notoserifcjksc">个百分点。所报告的数据使用</text><text x="386.86" y="481.27" font-size="11.00" class="sc-loraregular sc-k">--bare</text><text x="423.24" y="481.27" font-size="11.00" class="sc-notoserifcjksc">模式下的</text><text x="470.13" y="481.27" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="72.00" y="496.89" font-size="11.00" class="sc-notoserifcjksc">和最高推理强度。作为参考，公开排行榜报告的</text><text x="305.89" y="496.89" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="344.64" y="496.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="358.53" y="496.89" font-size="11.00" class="sc-loraregular">51.8%</text><text x="386.99" y="496.89" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="397.99" y="496.89" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="436.39" y="496.89" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="450.28" y="496.89" font-size="11.00" class="sc-loraregular">44.5%</text><text x="480.47" y="496.89" font-size="11.00" class="sc-notoserifcjksc">（五次试</text><text x="72.00" y="512.51" font-size="11.00" class="sc-notoserifcjksc">验，</text><text x="94.00" y="512.51" font-size="11.00" class="sc-loraregular sc-k">Claude Code</text><text x="161.85" y="512.51" font-size="11.00" class="sc-notoserifcjksc">运行框架），均在我们内部设置的噪声范围之内。公开排行榜还报告了</text><text x="72.00" y="528.13" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="113.40" y="528.13" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="127.30" y="528.13" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="190.45" y="528.13" font-size="11.00" class="sc-notoserifcjksc">得分为</text><text x="226.34" y="528.13" font-size="11.00" class="sc-loraregular sc-k">37.3%</text><text x="255.19" y="528.13" font-size="11.00" class="sc-notoserifcjksc">，该成绩是使用</text><text x="335.09" y="528.13" font-size="11.00" class="sc-loraregular sc-k">Codex CLI</text><text x="391.04" y="528.13" font-size="11.00" class="sc-notoserifcjksc">在最高推理强度下取得的。</text><text x="72.00 78.50 84.46 89.23 99.06 102.15 108.83 114.50 117.50 122.88 129.72 135.68 142.36 148.21 154.80 160.18 166.41 172.26 175.36 181.32 187.99 193.79" y="616.09" font-size="11.00" class="sc-loraregular">Terminal-Bench-Science</text><text x="202.65" y="616.09" font-size="11.00" class="sc-notoserifcjksc">是由斯坦福大学牵头的社区基准，包含</text><text x="392.54" y="616.09" font-size="11.00" class="sc-loraregular">70</text><text x="407.34" y="616.09" font-size="11.00" class="sc-notoserifcjksc">个取自科学研究工作流的任</text><text x="72.00" y="631.71" font-size="11.00" class="sc-notoserifcjksc">务，由来自生命科学、物理科学、地球科学、数学科学和工程科学领域的科学家和研究人员编写</text><text x="72.00" y="647.33" font-size="11.00" class="sc-notoserifcjksc">并审核。该项目的科学顾问来自麻省理工学院（</text><text x="303.00" y="647.33" font-size="11.00" class="sc-loraregular">MIT</text><text x="323.82" y="647.33" font-size="11.00" class="sc-notoserifcjksc">）、普林斯顿大学、华盛顿大学、</text><text x="72.00" y="662.95" font-size="11.00" class="sc-loraregular sc-k">Genentech</text><text x="131.05" y="662.95" font-size="11.00" class="sc-notoserifcjksc">和斯坦福大学。</text><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="343.68" y="262.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="343.68" y="262.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="354.68" y="262.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="354.68" y="262.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="365.68" y="262.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="365.68" y="262.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="376.68" y="262.53" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="376.68" y="262.53" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/engineering/infrastructure-noise" rel="noopener"><rect x="387.68" y="262.53" width="0.00" he ext x="412.77" y="500.77" font-size="11.00" class="sc-notoserifcjksc">）是一个包含</text><text x="481.66" y="500.77" font-size="11.00" class="sc-loraregular">71</text><text x="493.63" y="500.77" font-size="11.00" class="sc-notoserifcjksc">道理论物</text><text x="72.00" y="547.63" font-size="11.00" class="sc-notoserifcjksc">以及生物物理。每道问题都有唯一答案，形式为解析公式、数值或</text><text x="393.89" y="547.63" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="433.44" y="547.63" font-size="11.00" class="sc-notoserifcjksc">函数。我们请专家为</text><text x="72.00" y="563.25" font-size="11.00" class="sc-notoserifcjksc">其中</text><text x="96.89" y="563.25" font-size="11.00" class="sc-loraregular">31</text><text x="109.92" y="563.25" font-size="11.00" class="sc-notoserifcjksc">道因描述不充分、存在歧义或有笔误而被标记的问题提供了修正后的题面。由此得到的内</text><text x="72.00" y="578.87" font-size="11.00" class="sc-notoserifcjksc">部版本称为</text><text x="129.89" y="578.87" font-size="11.00" class="sc-loraregular sc-k">CritPT-Corrected</text><text x="220.27" y="578.87" font-size="11.00" class="sc-notoserifcjksc">。下面我们给出</text><text x="300.16" y="578.87" font-size="11.00" class="sc-loraregular">16</text><text x="313.42" y="578.87" font-size="11.00" class="sc-notoserifcjksc">次尝试的平均</text><text x="382.31" y="578.87" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="420.41" y="578.87" font-size="11.00" class="sc-notoserifcjksc">分数。模型的解答由</text><text x="72.00" y="594.49" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="157.89" y="594.49" font-size="11.00" class="sc-notoserifcjksc">作为评判模型进行评分，将模型解答与真值解答进行比对。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p174.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 174 页"><text x="72.00 80.93 84.30 89.20 98.17 101.80 111.56 116.93 126.16 129.86 137.92 150.26 159.75 164.95" y="405.66" font-size="14.00" class="sc-poppinsmedium">8.10 ArXivMath</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">174</text><text x="72.00" y="366.29" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="366.29" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 99.13 101.22 106.76 110.23 112.60 118.79 123.11 126.02 129.70 135.45 140.72 144.96 151.15 156.25 160.57 164.82 169.66 174.32 178.04 182.88" y="366.29" font-size="9.00" class="sc-lorabold">8.9.A] CritPT-Corrected</text><text x="190.61" y="366.29" font-size="9.00" class="sc-notoserifcjkscbold">在</text><text x="201.98" y="366.29" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="220.55" y="366.29" font-size="9.00" class="sc-notoserifcjksc">推理强度</text><text x="256.55" y="366.29" font-size="9.00" class="sc-notoserifcjkscbold">使用工具</text><text x="292.55" y="366.29" font-size="9.00" class="sc-notoserifcjksc">条件下的</text><text x="330.91" y="366.29" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="362.09" y="366.29" font-size="9.00" class="sc-notoserifcjksc">分数，为每道问题</text><text x="436.46" y="366.29" font-size="9.00" class="sc-loraregular">16</text><text x="447.30" y="366.29" font-size="9.00" class="sc-notoserifcjksc">次尝试的平均值。</text><text x="72.00" y="444.52" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="127.98" y="444.52" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="152.87" y="444.52" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="212.20" y="444.52" font-size="11.00" class="sc-notoserifcjksc">维护的研究级数学最终答案型基准。问题每月从近期</text><text x="468.09" y="444.52" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="496.52" y="444.52" font-size="11.00" class="sc-notoserifcjksc">论文摘要</text><text x="72.00" y="460.14" font-size="11.00" class="sc-notoserifcjksc">中提取，随后经过自动和人工检查筛选，以确保其自包含、非平凡且可验证。由于问题取自活跃</text><text x="72.00" y="475.76" font-size="11.00" class="sc-notoserifcjksc">的研究，该基准比竞赛或奥赛类基准更贴近现实，与数学研究的联系也更为紧密。</text><text x="72.00" y="557.86" font-size="11.00" class="sc-notoserifcjksc">我们在最新的</text><text x="140.89" y="557.86" font-size="11.00" class="sc-loraregular sc-k">ArXivMath</text><text x="196.87" y="557.86" font-size="11.00" class="sc-notoserifcjksc">版本（</text><text x="229.87" y="557.86" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="257.69" y="557.86" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="271.58" y="557.86" font-size="11.00" class="sc-loraregular">6</text><text x="280.84" y="557.86" font-size="11.00" class="sc-notoserifcjksc">月，</text><text x="302.84" y="557.86" font-size="11.00" class="sc-loraregular">49</text><text x="318.05" y="557.86" font-size="11.00" class="sc-notoserifcjksc">道问题）上评估了</text><text x="408.94" y="557.86" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="501.00" y="557.86" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="512.00" y="557.86" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="72.00" y="573.48" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="140.89" y="573.48" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="197.55" y="573.48" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分</text><text x="299.45" y="573.48" font-size="11.00" class="sc-loraregular">91.33%</text><text x="334.34" y="573.48" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得分</text><text x="425.23" y="573.48" font-size="11.00" class="sc-loraregular">93.88%</text><text x="462.36" y="573.48" font-size="11.00" class="sc-notoserifcjksc">，均为每道问题</text><text x="72.00" y="589.10" font-size="11.00" class="sc-notoserifcjksc">四次运行的平均值。相比之下，根据</text><text x="250.89" y="589.10" font-size="11.00" class="sc-loraregular sc-k">MathArena</text><text x="310.22" y="589.10" font-size="11.00" class="sc-notoserifcjksc">排行榜，</text><text x="354.22" y="589.10" font-size="11.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="414.47" y="589.10" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="425.47" y="589.10" font-size="11.00" class="sc-loraregular">max</text><text x="446.81" y="589.10" font-size="11.00" class="sc-notoserifcjksc">）得分</text><text x="482.71" y="589.10" font-size="11.00" class="sc-loraregular sc-k">86.73%</text><text x="518.37" y="589.10" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="604.72" font-size="11.00" class="sc-loraregular sc-k">Gemini 3.1 Pro Preview</text><text x="191.86" y="604.72" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="216.75" y="604.72" font-size="11.00" class="sc-loraregular">65.99%</text><text x="254.09" y="604.72" font-size="11.00" class="sc-notoserifcjksc">（二者均不使用工具）。</text><text x="72.00" y="639.34" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="99.82" y="639.34" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="113.71" y="639.34" font-size="11.00" class="sc-loraregular">6</text><text x="122.96" y="639.34" font-size="11.00" class="sc-notoserifcjksc">月的问题集取自</text><text x="202.86" y="639.34" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="230.68" y="639.34" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="244.57" y="639.34" font-size="11.00" class="sc-loraregular">6</text><text x="253.82" y="639.34" font-size="11.00" class="sc-notoserifcjksc">月发布的</text><text x="300.71" y="639.34" font-size="11.00" class="sc-loraregular sc-k">arXiv</text><text x="329.15" y="639.34" font-size="11.00" class="sc-notoserifcjksc">摘要。</text><text x="362.15" y="639.34" font-size="11.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="418.81" y="639.34" font-size="11.00" class="sc-notoserifcjksc">的训练数据可能与这一时</text><text x="72.00" y="654.96" font-size="11.00" class="sc-notoserifcjksc">期存在重叠，因此其中部分摘要可能被无意中纳入。我们尚未对此进行核实，因此无法排除存在</text><text x="72.00" y="670.58" font-size="11.00" class="sc-notoserifcjksc">一定污染的可能。</text></svg></div>

xt x="75.47" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 103.31 105.41 110.94 114.42 116.78 122.75 126.59 132.88 135.76 140.31 148.99 153.67 157.38" y="376.93" font-size="9.00" class="sc-lorabold">8.10.A] ArXivMath</text><text x="162.97" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="171.97" y="376.93" font-size="9.00" class="sc-lorabold">2026</text><text x="194.83" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">年</text><text x="206.20" y="376.93" font-size="9.00" class="sc-lorabold">6</text><text x="213.74" y="376.93" font-size="9.00" class="sc-notoserifcjkscbold">月）准确率得分。</text><text x="285.74" y="376.93" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5.1</text><text x="361.06" y="376.93" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="370.06" y="376.93" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="430.72" y="376.93" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="439.72" y="376.93" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="511.92" y="376.93" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="388.63" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="142.27" y="388.63" font-size="9.00" class="sc-notoserifcjksc">在内部以</text><text x="180.64" y="388.63" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="199.21" y="388.63" font-size="9.00" class="sc-notoserifcjksc">推理强度进行评估；其他分数来自</text><text x="336.58" y="388.63" font-size="9.00" class="sc-loraregular sc-k">MathArena</text><text x="385.11" y="388.63" font-size="9.00" class="sc-notoserifcjksc">排行榜。除</text><text x="432.48" y="388.63" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="461.81" y="388.63" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="470.81" y="388.63" font-size="9.00" class="sc-loraregular sc-k">Mythos 5</text><text x="511.68" y="388.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="400.33" font-size="9.00" class="sc-loraregular sc-k">Mythos 5.1</text><text x="118.36" y="400.33" font-size="9.00" class="sc-notoserifcjksc">的</text><text x="127.36" y="400.33" font-size="9.00" class="sc-loraregular">“</text><text x="130.96" y="400.33" font-size="9.00" class="sc-notoserifcjksc">使用工具</text><text x="166.96" y="400.33" font-size="9.00" class="sc-loraregular">”</text><text x="170.10" y="400.33" font-size="9.00" class="sc-notoserifcjksc">柱外，所有分数均为不使用工具的结果。</text><text x="72.00" y="437.26" font-size="14.00" class="sc-poppinssemibold">8.11</text><text x="98.11" y="437.26" font-size="14.00" class="sc-notosanscjkscbold">长上下文</text><text x="72.00" y="502.02" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="498.35" font-size="6.60" class="sc-loraregular">16</text><text x="157.03" y="502.02" font-size="11.00" class="sc-notoserifcjksc">是一个长上下文智能体编程基准测试，包含</text><text x="368.93" y="502.02" font-size="11.00" class="sc-loraregular">200</text><text x="391.39" y="502.02" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务。智能体仅获</text><text x="72.00" y="517.64" font-size="11.00" class="sc-notoserifcjksc">得一个由开源项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网或反编译工具</text><text x="72.00" y="533.26" font-size="11.00" class="sc-notoserifcjksc">的情况下重建一个能复现原程序行为的代码库。任务范围从小型终端工具（</text><text x="435.00" y="533.26" font-size="11.00" class="sc-loraregular">jq</text><text x="444.21" y="533.26" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="455.21" y="533.26" font-size="11.00" class="sc-loraregular sc-k">ripgrep</text><text x="492.93" y="533.26" font-size="11.00" class="sc-notoserifcjksc">）到大型</text><text x="72.00" y="548.88" font-size="11.00" class="sc-notoserifcjksc">系统（</text><text x="105.00" y="548.88" font-size="11.00" class="sc-loraregular sc-k">FFmpeg</text><text x="145.39" y="548.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="156.39" y="548.88" font-size="11.00" class="sc-loraregular sc-k">SQLite</text><text x="191.13" y="548.88" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="202.13" y="548.88" font-size="11.00" class="sc-loraregular sc-k">PHP</text><text x="226.88" y="548.88" font-size="11.00" class="sc-notoserifcjksc">解释器）不等。提交结果依据超过</text><text x="394.77 400.44 406.40 410.99 413.59 420.43 427.26" y="548.88" font-size="11.00" class="sc-loraregular">247,000</text><text x="436.99" y="548.88" font-size="11.00" class="sc-notoserifcjksc">个基于执行的行为测</text><text x="72.00" y="564.49" font-size="11.00" class="sc-notoserifcjksc">试进行评分，这些测试通过智能体驱动的模糊测试生成。</text><text x="72.00" y="631.77" font-size="11.00" class="sc-notoserifcjksc">我们排除了</text><text x="129.89" y="631.77" font-size="11.00" class="sc-loraregular">34</text><text x="144.88" y="631.77" font-size="11.00" class="sc-notoserifcjksc">个参考二进制文件本身在隐藏测试集上得分低于</text><text x="378.77" y="631.77" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="397.38" y="631.77" font-size="11.00" class="sc-notoserifcjksc">的任务（表明存在测试不稳定</text><text x="72.00" y="647.39" font-size="11.00" class="sc-notoserifcjksc">性），剩余</text><text x="129.89" y="647.39" font-size="11.00" class="sc-loraregular">166</text><text x="149.51" y="647.39" font-size="11.00" class="sc-notoserifcjksc">个任务。在这些任务中，我们只依据参考二进制文件能够通过的测试进行评分。</text><text x="72.00" y="663.01" font-size="11.00" class="sc-notoserifcjksc">我们使用与上游代码仓库</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p176.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 176 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 103.15 106.53 115.69 121.46" y="254.43" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.1 HLE</text><text x="72.00" y="713.04" font-size="6.00" class="sc-loraregular">17</text><text x="79.58 85.58 91.56 96.72 102.79 105.32 107.95 113.73 116.18 118.71 121.34 126.69 130.56 133.19 138.35 141.06 143.52 146.15 149.20 154.57 160.71 166.07 171.52 174.57 177.03 179.66 187.27 193.23 202.17 207.33 213.40 216.36 220.25 225.53 227.09 231.72 234.35 240.35 245.50 250.13 254.00 256.63 262.85 268.14 273.30 282.24 284.70 287.33 292.48 296.19 302.68 305.49 310.54 313.04 318.40 323.85 330.06 333.70 336.16 339.80 345.21 350.36 355.78 361.40" y="717.26" font-size="10.00" class="sc-loraregular">Phan, L., et al. (2025). Humanity’s Last Exam. arXiv:2501.14249.</text><text x="366.49 372.38 376.35 380.22 386.19 390.82 393.31 397.00 403.46 408.62 412.95 418.24 421.05 425.71 428.17 434.02 438.30 443.82 450.28 455.44 461.26 465.53 472.43 477.80 483.25 489.45 493.09 495.55 499.19 504.61 509.76 515.17" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2501.14249</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">176</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">相同的</text><text x="107.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">mini-swe-agent</text><text x="192.47" y="82.61" font-size="11.00" class="sc-notoserifcjksc">运行框架报告隐藏测试通过率，但不设六小时的时间限制。在该任务集</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="94.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="177.40" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="202.29" y="98.23" font-size="11.00" class="sc-loraregular sc-k">87.6%</text><text x="231.59" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="242.59" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="319.62" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="344.51" y="98.23" font-size="11.00" class="sc-loraregular">85.4%</text><text x="374.93" y="98.23" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="385.93" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5</text><text x="424.33" y="98.23" font-size="11.00" class="sc-notoserifcjksc">得分</text><text x="449.22" y="98.23" font-size="11.00" class="sc-loraregular">86.3%</text><text x="480.17" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们认为</text><text x="118.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="197.71" y="147.38" font-size="11.00" class="sc-notoserifcjksc">是衡量长上下文编程表现的有力指标：</text><text x="384.71" y="147.38" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="429.82" y="147.38" font-size="11.00" class="sc-notoserifcjksc">的回合覆盖了一系列上</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">下文长度，最长可达完整的</text><text x="206.89" y="163.00" font-size="11.00" class="sc-loraregular">100</text><text x="227.45" y="163.00" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="241.35" y="163.00" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="273.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">窗口，并且这些任务所考察的长上下文能力与实际的下</text><text x="72.00" y="178.62" font-size="11.00" class="sc-notoserifcjksc">游用例高度契合。</text><text x="72.00" y="213.54" font-size="14.00" class="sc-poppinssemibold">8.12</text><text x="101.08" y="213.54" font-size="14.00" class="sc-notosanscjkscbold">智能体搜索</text><text x="72.00" y="278.30" font-size="11.00" class="sc-loraregular sc-k">Humanity’s Last Exam</text><text x="184.88" y="278.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="195.88" y="278.30" font-size="11.00" class="sc-loraregular">HLE</text><text x="217.66" y="278.30" font-size="11.00" class="sc-notoserifcjksc">）</text><text x="228.66" y="274.63" font-size="6.60" class="sc-loraregular">17</text><text x="237.00" y="278.30" font-size="11.00" class="sc-notoserifcjksc">是一个多模态基准测试，包含涵盖数十个学科的</text><text x="470.89 476.80 479.57 485.57 492.40" y="278.30" font-size="11.00" class="sc-loraregular">2,500</text><text x="502.13" y="278.30" font-size="11.00" class="sc-notoserifcjksc">道题</text><text x="72.00" y="293.92" font-size="11.00" class="sc-notoserifcjksc">目。这些题目经过设计，即使是领域专家也难以作答，且无法通过互联网搜索快速找到答案。</text><text x="72.00" y="343.30" font-size="11.00" class="sc-notoserifcjksc">我们在两种配置下测试了</text><text x="195.89" y="343.30" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="276.40" y="343.30" font-size="11.00" class="sc-notoserifcjksc">：（</text><text x="298.40" y="343.30" font-size="11.00" class="sc-loraregular">1</text><text x="302.41" y="343.30" font-size="11.00" class="sc-notoserifcjksc">）不使用工具的纯推理配置；（</text><text x="456.41" y="343.30" font-size="11.00" class="sc-loraregular">2</text><text x="462.31" y="343.30" font-size="11.00" class="sc-notoserifcjksc">）使用网络搜</text><text x="72.00" y="358.92" font-size="11.00" class="sc-notoserifcjksc">索、网页抓取、程序化工具调用和代码执行的配置。在所有运行中，思考设置为</text><text x="459.89" y="358.92" font-size="11.00" class="sc-loraregular sc-k">auto</text><text x="482.76" y="358.92" font-size="11.00" class="sc-notoserifcjksc">，跨上下文</text><text x="72.00" y="374.54" font-size="11.00" class="sc-notoserifcjksc">使用的</text><text x="107.89" y="374.54" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="139.95" y="374.54" font-size="11.00" class="sc-notoserifcjksc">总量上限为</text><text x="197.84" y="374.54" font-size="11.00" class="sc-loraregular">100</text><text x="218.40" y="374.54" font-size="11.00" class="sc-notoserifcjksc">万。这些结果未使用上下文压缩。</text><text x="383.40" y="374.54" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="469.35" y="374.54" font-size="11.00" class="sc-notoserifcjksc">担任评分模</text><text x="72.00" y="390.16" font-size="11.00" class="sc-notoserifcjksc">型。</text><text x="72.00" y="440.45" font-size="11.00" class="sc-notoserifcjksc">对于第二种配置，我们使用受限抓取工具，它只能获取对话中已经出现过的</text><text x="437.89" y="440.45" font-size="11.00" class="sc-loraregular">URL</text><text x="459.43" y="440.45" font-size="11.00" class="sc-notoserifcjksc">，例如网络搜索</text><text x="72.00" y="456.07" font-size="11.00" class="sc-notoserifcjksc">结果或先前抓取页面上的链接。我们之所以采用这一做法，是因为在内部测试中发现：若抓取工</text><text x="72.00" y="471.69" font-size="11.00" class="sc-notoserifcjksc">具接受模型任意构造的</text><text x="184.89" y="471.69" font-size="11.00" class="sc-loraregular">URL</text><text x="206.43" y="471.69" font-size="11.00" class="sc-notoserifcjksc">，模型就可能将其自己的</text><text x="330.32" y="471.69" font-size="11.00" class="sc-loraregular sc-k">JavaScript</text><text x="384.59" y="471.69" font-size="11.00" class="sc-notoserifcjksc">通过公开的第三方网络服务转</text><text x="72.00" y="487.31" font-size="11.00" class="sc-notoserifcjksc">发，从而在我们的沙箱之外执行这些代码并发起任意网络请求。</text><text x="72.00" y="553.80" font-size="11.00" class="sc-notoserifcjksc">为防止使用工具的变体出现结果污染，我们在搜索器和抓取器中都屏蔽了已知讨论</text><text x="470.89" y="553.80" font-size="11.00" class="sc-loraregular">HLE</text><text x="495.57" y="553.80" font-size="11.00" class="sc-notoserifcjksc">的来源</text><text x="72.00" y="569.42" font-size="11.00" class="sc-notoserifcjksc">（见附录</text><text x="118.89" y="569.42" font-size="11.00" class="sc-loraregular sc-k">9.2</text><text x="133.69" y="569.42" font-size="11.00" class="sc-notoserifcjksc">）。我们还使用</text><text x="213.58" y="569.42" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="290.61" y="569.42" font-size="11.00" class="sc-notoserifcjksc">审查所有对话记录，并标记任何看似从</text><text x="480.51" y="569.42" font-size="11.00" class="sc-loraregular">HLE</text><text x="505.18" y="569.42" font-size="11.00" class="sc-notoserifcjksc">专属来</text><text x="72.00" y="585.04" font-size="11.00" class="sc-notoserifcjksc">源获取答案的记录；经确认的情况会被重新判为错误。</text><a href="https://arxiv.org/abs/2501.14249" rel="noopener"><rect x="366.49" y="707.20" width="154.47" height="12.80" fill="transparent"/></a></svg></div>
