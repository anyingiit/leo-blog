els-master-the-documents-that-run-the-world</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">190</text><text x="72.00" y="412.41" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="412.41" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="412.41" font-size="9.00" class="sc-lorabold sc-k">8.14.3.B] OSWorld 2.0</text><text x="178.76" y="412.41" font-size="9.00" class="sc-notoserifcjkscbold">价格与性能对比</text><text x="241.76" y="412.41" font-size="9.00" class="sc-notoserifcjksc">，按模型列出。</text><text x="72.00" y="472.44" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="113.77" y="468.77" font-size="6.60" class="sc-loraregular">25</text><text x="123.80" y="472.44" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="137.69" y="472.44" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="183.49" y="472.44" font-size="11.00" class="sc-notoserifcjksc">推出的专家级多模态推理基准测试，包含</text><text x="384.38" y="472.44" font-size="11.00" class="sc-loraregular">100</text><text x="404.94" y="472.44" font-size="11.00" class="sc-notoserifcjksc">个真实世界提示词及</text><text x="506.83" y="472.44" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="530.45" y="472.44" font-size="11.00" class="sc-notoserifcjksc">文</text><text x="72.00" y="488.06" font-size="11.00" class="sc-notoserifcjksc">件，均直接取自金融、医疗健康、法律、工程和保险等</text><text x="338.89" y="488.06" font-size="11.00" class="sc-loraregular">10</text><text x="352.62" y="488.06" font-size="11.00" class="sc-notoserifcjksc">个领域的专业工作流程。该基准测试检</text><text x="72.00" y="503.68" font-size="11.00" class="sc-notoserifcjksc">验模型能否解析、交叉引用并综合那些支撑企业工作的密集文档，包括解读多页剂量表、找出深</text><text x="72.00" y="586.00" font-size="11.00" class="sc-notoserifcjksc">我们使用内部运行框架评估</text><text x="206.89" y="586.00" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="248.66" y="586.00" font-size="11.00" class="sc-notoserifcjksc">，分别在使用工具和不使用工具的条件下进行。在不使用工</text><text x="72.00" y="601.62" font-size="11.00" class="sc-notoserifcjksc">具评估时，模型接收</text><text x="173.89" y="601.62" font-size="11.00" class="sc-loraregular">base64</text><text x="212.24" y="601.62" font-size="11.00" class="sc-notoserifcjksc">编码的</text><text x="248.13" y="601.62" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="268.86" y="601.62" font-size="11.00" class="sc-notoserifcjksc">，以与</text><text x="304.75" y="601.62" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="337.08" y="601.62" font-size="11.00" class="sc-notoserifcjksc">的输入提示词保持一致。不过，与</text><text x="504.97" y="601.62" font-size="11.00" class="sc-loraregular sc-k">Surge</text><text x="72.00" y="617.24" font-size="11.00" class="sc-notoserifcjksc">不同的是，对于超出我们</text><text x="195.89" y="617.24" font-size="11.00" class="sc-loraregular sc-k">API 32MB</text><text x="247.84" y="617.24" font-size="11.00" class="sc-notoserifcjksc">请求大小上限的</text><text x="327.73" y="617.24" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="348.45" y="617.24" font-size="11.00" class="sc-notoserifcjksc">，我们会将其截断（而非丢弃）。我们</text><text x="72.00" y="632.86" font-size="11.00" class="sc-notoserifcjksc">使用</text><text x="96.89" y="632.86" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="181.32" y="632.86" font-size="11.00" class="sc-notoserifcjksc">而非</text><text x="206.21" y="632.86" font-size="11.00" class="sc-loraregular">Gemini 3 Flash</text><text x="284.42" y="632.86" font-size="11.00" class="sc-notoserifcjksc">作为评判模型。在使用工具评估时，模型可使用一个</text><text x="72.00" y="648.48" font-size="11.00" class="sc-notoserifcjksc">容器（其中包含该</text><text x="162.89" y="648.48" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="186.51" y="648.48" font-size="11.00" class="sc-notoserifcjksc">文件并安装了标准库）和一个图像裁剪工具。</text><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="498.65" y="694.39" width="2.63" height="12.80" fill="transparent"/></a><a href="https://surgehq.ai/blog/gdp-pdf-can-100b-ai-models-master-the-documents-that-run-the-world" rel="noopener"><rect x="72.00" y="707.20" width="465.45" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p191.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 191 页"><text x="72.00 80.29 83.42 87.97 96.28 99.41 103.96 107.34 117.53 121.84 126.15 129.59 137.38 145.40 155.63" y="622.26" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.15.1 OfficeQA</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">191</text><text x="291.51" y="114.42" font-size="11.00" class="sc-loraregular">100</text><text x="312.06" y="114.42" font-size="11.00" class="sc-notoserifcjksc">个提示词上评估模型，并对五次运行的得分取</text><text x="72.00" y="130.04" font-size="11.00" class="sc-notoserifcjksc">平均。</text><text x="72.00" y="163.58" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="163.58" font-size="11.00" class="sc-loraregular sc-k">GDP.pdf</text><text x="130.55" y="163.58" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="152.55" y="163.58" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="235.96" y="163.58" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时的平均评分项通过率为</text><text x="425.85" y="163.58" font-size="11.00" class="sc-loraregular">85.4%</text><text x="456.26" y="163.58" font-size="11.00" class="sc-notoserifcjksc">，使用工具时得</text><text x="72.00" y="179.20" font-size="11.00" class="sc-notoserifcjksc">分为</text><text x="96.89" y="179.20" font-size="11.00" class="sc-loraregular">85.1%</text><text x="125.35" y="179.20" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="136.35" y="179.20" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="213.04" y="179.20" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="281.93" y="179.20" font-size="11.00" class="sc-loraregular sc-k">82.7%</text><text x="313.91" y="179.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="327.81" y="179.20" font-size="11.00" class="sc-loraregular sc-k">87.1%</text><text x="354.85" y="179.20" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="365.85" y="179.20" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="442.89" y="179.20" font-size="11.00" class="sc-notoserifcjksc">分别为</text><text x="478.78" y="179.20" font-size="11.00" class="sc-loraregular">83.4%</text><text x="512.22" y="179.20" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="194.82" font-size="11.00" class="sc-loraregular">85.5%</text><text x="102.45" y="194.82" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="534.28" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="534.28" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.68 111.78 117.32 120.79 123.16 129.94 136.65 141.58 143.60 149.01 154.38" y="534.28" font-size="9.00" class="sc-lorabold">8.14.4.A] GDP.pdf</text><text x="160.07" y="534.28" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="187.07" y="534.28" font-size="9.00" class="sc-notoserifcjksc">各模型在启用自适应思考和</text><text x="297.43" y="534.28" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="316.00" y="534.28" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下评估，分为使用工具和不使用工具两</text><text x="72.00" y="545.98" font-size="9.00" class="sc-notoserifcjksc">种情况。平均评分项通过率为五次运行的平均值。图中显示</text><text x="308.37" y="545.98" font-size="9.00" class="sc-loraregular">95%</text><text x="328.67" y="545.98" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="581.36" font-size="14.00" class="sc-poppinssemibold">8.15</text><text x="102.06" y="581.36" font-size="14.00" class="sc-notosanscjkscbold">真实世界专业任务</text><text x="121.57" y="646.34" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="135.46" y="646.34" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="193.13" y="646.34" font-size="11.00" class="sc-notoserifcjksc">推出的公开基准测试，用于评估在大规模</text><text x="394.02" y="646.34" font-size="11.00" class="sc-loraregular sc-k">Treasury Bulletin</text><text x="481.74" y="646.34" font-size="11.00" class="sc-notoserifcjksc">（美国财政</text><text x="72.00" y="661.96" font-size="11.00" class="sc-notoserifcjksc">部公报）历史文档语料库上的端到端有据推理能力。模型必须在整个语料库中定位相关表格，并</text><text x="72.00" y="677.58" font-size="11.00" class="sc-notoserifcjksc">基于这些表格进行精确的数值推理。我们以智能体方式进行评估：文档以提取后的文本形式提供</text><text x="72.00" y="693.20" font-size="11.00" class="sc-notoserifcjksc">在沙箱化的环境中，并且可以使用代码执行工具。</text><text x="384.25" y="693.20" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="447.71" y="693.20" font-size="11.00" class="sc-notoserifcjksc">的一个更难的子</text><text x="72.00" y="708.82" font-size="11.00" class="sc-notoserifcjksc">集，包含</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p192.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 192 页"><text x="72.00 80.29 83.42 87.97 96.28 99.41 106.91 110.29 116.06 124.08 132.89 141.70 145.13 148.51 157.57 166.38 174.40 182.83 187.66 191.04 199.23 207.25 215.68 223.48 231.92 245.42 254.23 259.22" y="376.22" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.15.2 Legal Agent Benchmark</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">192</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular">133</text><text x="91.15" y="82.61" font-size="11.00" class="sc-notoserifcjksc">道题，推荐用于前沿模型；我们报告两者的结果。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="218.86" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="254.75" y="131.19" font-size="11.00" class="sc-loraregular sc-k">80.2%</text><text x="285.77" y="131.19" font-size="11.00" class="sc-notoserifcjksc">，在</text><text x="380.91" y="131.19" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="416.81" y="131.19" font-size="11.00" class="sc-loraregular sc-k">69.0%</text><text x="448.29" y="131.19" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="495.18" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="165.95" y="146.81" font-size="11.00" class="sc-loraregular sc-k">79.0%</text><text x="199.04" y="146.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="212.93" y="146.81" font-size="11.00" class="sc-loraregular sc-k">67.1%</text><text x="240.08" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="264.97" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="339.11" y="146.81" font-size="11.00" class="sc-notoserifcjksc">（分别为</text><text x="386.01" y="146.81" font-size="11.00" class="sc-loraregular">78.1%</text><text x="416.43" y="146.81" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="430.33" y="146.81" font-size="11.00" class="sc-loraregular">66.9%</text><text x="461.68" y="146.81" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="483.68" y="146.81" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="528.79" y="146.81" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">公开的</text><text x="107.89" y="162.43" font-size="11.00" class="sc-loraregular sc-k">Messages API</text><text x="179.79" y="162.43" font-size="11.00" class="sc-notoserifcjksc">上评估，并启用其生产环境安全防护措施（安全分类器；生物拦截时回退</text><text x="72.00" y="178.05" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89" y="178.05" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="121.74" y="178.05" font-size="11.00" class="sc-notoserifcjksc">，网络安全拦截时回退至</text><text x="245.64" y="178.05" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="328.63" y="178.05" font-size="11.00" class="sc-notoserifcjksc">），</text><text x="350.63" y="178.05" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="389.37" y="178.05" font-size="11.00" class="sc-notoserifcjksc">同样如此（回退至</text><text x="480.27" y="178.05" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="193.67" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="108.85" y="193.67" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="158.80" y="193.67" font-size="11.00" class="sc-notoserifcjksc">则在内部</text><text x="205.69" y="193.67" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="225.77" y="193.67" font-size="11.00" class="sc-notoserifcjksc">上评估，未启用这些安全防护措施。耗尽输出上限的运行记为错</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">误；在生产环境</text><text x="151.89" y="209.29" font-size="11.00" class="sc-loraregular sc-k">128k token</text><text x="208.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">的输出上限下，没有任何</text><text x="332.73" y="209.29" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="377.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">运行在给出最终答案前被截断。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">关于跨报告可比性的说明：</text><text x="253.57" y="276.92" font-size="11.00" class="sc-notoserifcjksc">得分对评估运行框架高度敏感。要求模型直接解析原始</text><text x="72.00" y="292.54" font-size="11.00" class="sc-loraregular sc-k">PDF</text><text x="95.62" y="292.54" font-size="11.00" class="sc-notoserifcjksc">语料库的设置，会使所有模型的绝对得分大幅降低。例如，</text><text x="381.62" y="292.54" font-size="11.00" class="sc-loraregular sc-k">Databricks</text><text x="439.29" y="292.54" font-size="11.00" class="sc-notoserifcjksc">自行对</text><text x="475.18" y="292.54" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="308.16" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="308.16" font-size="11.00" class="sc-notoserifcjksc">进行的评估以图像而非提取文本的形式读取文档，报告其在</text><text x="440.03" y="308.16" font-size="11.00" class="sc-notoserifcjksc">上的得分为</text><text x="497.92" y="308.16" font-size="11.00" class="sc-loraregular sc-k">57.9%</text><text x="527.14" y="308.16" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="400.30" font-size="11.00" class="sc-loraregular sc-k">Legal Agent Benchmark</text><text x="192.63" y="400.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63" y="400.30" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="223.90" y="400.30" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="259.79" y="400.30" font-size="11.00" class="sc-loraregular sc-k">Harvey AI</text><text x="312.37" y="400.30" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。核心基准测试包含</text><text x="513.27" y="400.30" font-size="11.00" class="sc-loraregular sc-k">24</text><text x="527.79" y="400.30" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">不同执业领域的</text><text x="151.89 155.90 158.67 164.58 171.41" y="415.92" font-size="11.00" class="sc-loraregular">1,200</text><text x="181.14" y="415.92" font-size="11.00" class="sc-notoserifcjksc">多个任务。每个任务包含一个文档语料库</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="431.54" font-size="11.00" class="sc-loraregular">.xlsx</text><text x="105.45" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="116.45" y="431.54" font-size="11.00" class="sc-loraregular sc-k">.docx</text><text x="143.77" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="154.77" y="431.54" font-size="11.00" class="sc-loraregular">.eml</text><text x="176.27" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="187.27" y="431.54" font-size="11.00" class="sc-loraregular sc-k">.pptx</text><text x="213.33" y="431.54" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="224.33" y="431.54" font-size="11.00" class="sc-loraregular sc-k">.txt</text><text x="241.38" y="431.54" font-size="11.00" class="sc-notoserifcjksc">），其中包括电子邮件往来、律所模板、程序性文件以及智能</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">体为完成任务必须筛查的其他材料。任务指令以合伙人向授薪律师发出的简短</text><text x="446.00" y="447.16" font-size="11.00" class="sc-loraregular">“</text><text x="494.40" y="447.16" font-size="11.00" class="sc-loraregular">”</text><text x="498.24" y="447.16" font-size="11.00" class="sc-notoserifcjksc">的形式</text><text x="72.00" y="462.78" font-size="11.00" class="sc-notoserifcjksc">撰写，并规定了预期的输出文档及格式。评估由</text><text x="305.89" y="462.78" font-size="11.00" class="sc-loraregular">LLM</text><text x="331.60" y="462.78" font-size="11.00" class="sc-notoserifcjksc">评判模型（</text><text x="386.60" y="462.78" font-size="11.00" class="sc-loraregular sc-k">LLM-as-a-judge</text><text x="469.83" y="462.78" font-size="11.00" class="sc-notoserifcjksc">）依据一套专</text><text x="72.00" y="478.40" font-size="11.00" class="sc-notoserifcjksc">家撰写的评分细则评分项逐项给出通过</text><text x="259.00" y="478.40" font-size="11.00" class="sc-loraregular">/</text><text x="266.59" y="478.40" font-size="11.00" class="sc-notoserifcjksc">不通过判定（每个被评估任务的评分项数：最少</text><text x="500.48" y="478.40" font-size="11.00" class="sc-loraregular sc-k">23</text><text x="515.24" y="478.40" font-size="11.00" class="sc-notoserifcjksc">项，</text><text x="72.00" y="494.02" font-size="11.00" class="sc-notoserifcjksc">中位数</text><text x="107.89" y="494.02" font-size="11.00" class="sc-loraregular">56</text><text x="123.14" y="494.02" font-size="11.00" class="sc-notoserifcjksc">项，最多</text><text x="170.03" y="494.02" font-size="11.00" class="sc-loraregular">194</text><text x="189.25" y="494.02" font-size="11.00" class="sc-notoserifcjksc">项）。按照</text><text x="247.14" y="494.02" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="270.31" y="494.02" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式，只有当所有评分项均满足时，任务才</text><text x="72.00" y="509.64" font-size="11.00" class="sc-notoserifcjksc">算成功。</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 111.90 114.67 120.41 126.54" y="562.22" font-size="11.00" class="sc-loraregular">1,235</text><text x="135.44" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道题上测试了</text><text x="204.33" y="562.22" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="284.84" y="562.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="295.84 299.84 302.61 308.52 314.52" y="562.22" font-size="11.00" class="sc-loraregular">1,251</text><text x="321.43" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="368.32" y="562.22" font-size="11.00" class="sc-loraregular">16</text><text x="381.57" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道因数据缺陷被排除；排除项在</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">测试前即已确定）。在使用自适应思考和</text><text x="272.89" y="577.84" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="295.59" y="577.84" font-size="11.00" class="sc-notoserifcjksc">推理强度时，该模型的全通过率为</text><text x="463.48" y="577.84" font-size="11.00" class="sc-loraregular sc-k">19.09%</text><text x="498.97" y="577.84" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="509.97" y="577.84" font-size="11.00" class="sc-loraregular">±</text><text x="72.00" y="593.46" font-size="11.00" class="sc-loraregular sc-k">0.92</text><text x="93.63" y="593.46" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="104.63" y="593.46" font-size="11.00" class="sc-loraregular">n=5</text><text x="123.13" y="593.46" font-size="11.00" class="sc-notoserifcjksc">），平均评分项通过率为</text><text x="247.02" y="593.46" font-size="11.00" class="sc-loraregular sc-k">90.81%</text><text x="282.50" y="593.46" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="293.50" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="338.61" y="593.46" font-size="11.00" class="sc-notoserifcjksc">在公开的</text><text x="385.50" y="593.46" font-size="11.00" class="sc-loraregular sc-k">Messages API</text><text x="457.40" y="593.46" font-size="11.00" class="sc-notoserifcjksc">上评估，并启用</text><text x="72.00" y="609.08" font-size="11.00" class="sc-notoserifcjksc">生产环境安全防护措施（安全分类器；生物拦截时回退至</text><text x="349.89" y="609.08" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="424.03" y="609.08" font-size="11.00" class="sc-notoserifcjksc">，网络安全拦截时回退</text><text x="72.00" y="624.70" font-size="11.00" class="sc-notoserifcjksc">至</text><text x="85.89" y="624.70" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="168.89" y="624.70" font-size="11.00" class="sc-notoserifcjksc">）。自我们首次在系统卡中报告</text><text x="325.78" y="624.70" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="348.95" y="624.70" font-size="11.00" class="sc-notoserifcjksc">以来，我们的评分流水线已经更新，能</text><text x="72.00" y="640.32" font-size="11.00" class="sc-notoserifcjksc">够正确渲染</text><text x="129.89" y="640.32" font-size="11.00" class="sc-loraregular sc-k">.docx</text><text x="160.11" y="640.32" font-size="11.00" class="sc-notoserifcjksc">交付物中的修订痕迹，并能从</text><text x="306.00" y="640.32" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="338.06" y="640.32" font-size="11.00" class="sc-notoserifcjksc">上限截断中恢复。我们的运行框架是一个</text><text x="72.00" y="655.94" font-size="11.00" class="sc-notoserifcjksc">内部重新实现的版本，保留了</text><text x="217.89" y="655.94" font-size="11.00" class="sc-loraregular sc-k">LAB</text><text x="241.06" y="655.94" font-size="11.00" class="sc-notoserifcjksc">的任务内容、评分细则评分项、全通过评分方式以及默认评判</text><text x="72.00" y="671.56" font-size="11.00" class="sc-notoserifcjksc">模型（</text><text x="105.00" y="671.56" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 4.6</text><text x="197.27" y="671.56" font-size="11.00" class="sc-notoserifcjksc">），但工具集有所精简。公开运行框架</text></svg></div>

.69 263.85 268.18 273.48 276.29 280.95 283.40 289.25 293.53 299.06 305.52 310.67 316.49 320.77 327.67 333.03 338.48 342.12 348.17 350.48 356.69 362.10 367.43 371.90" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2510.04374</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">193</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">提供</text><text x="96.89" y="82.61" font-size="11.00" class="sc-loraregular">bash</text><text x="120.65" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="131.65" y="82.61" font-size="11.00" class="sc-loraregular sc-k">read</text><text x="154.53" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="165.53" y="82.61" font-size="11.00" class="sc-loraregular sc-k">write</text><text x="192.59" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="203.59" y="82.61" font-size="11.00" class="sc-loraregular sc-k">edit</text><text x="223.60" y="82.61" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="234.60" y="82.61" font-size="11.00" class="sc-loraregular sc-k">glob</text><text x="259.67" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="273.56" y="82.61" font-size="11.00" class="sc-loraregular sc-k">grep</text><text x="299.76" y="82.61" font-size="11.00" class="sc-notoserifcjksc">工具，而我们只提供</text><text x="401.65" y="82.61" font-size="11.00" class="sc-loraregular">bash</text><text x="428.30" y="82.61" font-size="11.00" class="sc-notoserifcjksc">和一个</text><text x="464.19" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Python</text><text x="503.74" y="82.61" font-size="11.00" class="sc-notoserifcjksc">工具。</text><text x="72.00" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Harvey LAB</text><text x="134.28" y="131.19" font-size="11.00" class="sc-notoserifcjksc">留出题集上的结果由</text><text x="326.76" y="131.19" font-size="11.00" class="sc-notoserifcjksc">报告。我们此前报告的是</text><text x="450.65" y="131.19" font-size="11.00" class="sc-loraregular sc-k">Harvey</text><text x="489.77" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在留出集</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">上给出的分数。为了尽可能准确地呈现模型间的比较，我们已更新报告方式，对我们以前的模型</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">改用</text><text x="187.48" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的分数；这些分数可能与以往系统卡中报告的分数略有不同。留出集包含</text><text x="72.00" y="178.05" font-size="11.00" class="sc-loraregular">120</text><text x="91.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">道题，在</text><text x="229.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc">团队维护的运行框架上运行（</text><text x="372.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">参见其方法说明</text><text x="449.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc">）。在留出集上，</text><text x="72.00" y="193.67" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="193.67" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="131.00" y="193.67" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="166.90" y="193.67" font-size="11.00" class="sc-notoserifcjksc">推理强度下的全通过率为</text><text x="290.80" y="193.67" font-size="11.00" class="sc-loraregular sc-k">16.7%</text><text x="318.15" y="193.67" font-size="11.00" class="sc-notoserifcjksc">，评分项通过率为</text><text x="409.05" y="193.67" font-size="11.00" class="sc-loraregular">93.3%</text><text x="439.93" y="193.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="291.49" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="291.49" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="250.94" y="291.49" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立评估框架，用于在具有经济价值的真实世</text><text x="72.00" y="307.11" font-s xt x="522.05" y="353.97" font-size="11.00" class="sc-loraregular">Elo</text><text x="72.00" y="369.59" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="85.89" y="369.59" font-size="11.00" class="sc-loraregular">1853</text><text x="108.20" y="369.59" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="119.20" y="369.59" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="155.10" y="369.59" font-size="11.00" class="sc-notoserifcjksc">推理强度下为</text><text x="223.99" y="369.59" font-size="11.00" class="sc-loraregular">1835</text><text x="246.30" y="369.59" font-size="11.00" class="sc-notoserifcjksc">，领先于</text><text x="293.19" y="369.59" font-size="11.00" class="sc-loraregular">max</text><text x="317.43" y="369.59" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="386.32" y="369.59" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="460.46" y="369.59" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="471.46" y="369.59" font-size="11.00" class="sc-loraregular sc-k">1824</text><text x="493.27" y="369.59" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="518.17" y="369.59" font-size="11.00" class="sc-loraregular">max</text><text x="72.00" y="385.21" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="140.89" y="385.21" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="214.69" y="385.21" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="225.69" y="385.21" font-size="11.00" class="sc-loraregular sc-k">1723</text><text x="246.64" y="385.21" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="268.64" y="385.21" font-size="11.00" class="sc-loraregular sc-k">xhigh</text><text x="299.98" y="385.21" font-size="11.00" class="sc-notoserifcjksc">在置信区间（</text><text x="464.45" y="385.21" font-size="11.00" class="sc-notoserifcjksc">）内与</text><text x="500.34" y="385.21" font-size="11.00" class="sc-loraregular">max</t 107.35 113.26 116.15 126.46 132.52 137.06 143.88 150.11 155.44 158.33" y="612.43" font-size="11.00" class="sc-lorabold">Claude Mythos 5</text><text x="216.00" y="612.43" font-size="11.00" class="sc-loraregular sc-k">79.3</text><text x="293.25 299.43 305.78 308.49" y="612.43" font-size="11.00" class="sc-loraregular">86.1</text><text x="370.50" y="612.43" font-size="11.00" class="sc-loraregular">73.1</text><text x="447.75" y="612.43" font-size="11.00" class="sc-loraregular sc-k">19.8</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 124.60 131.21 138.00 143.34 146.23 152.24 154.80" y="639.88" font-size="11.00" class="sc-lorabold">Claude Opus 4.8</text><text x="216.00" y="639.88" font-size="11.00" class="sc-loraregular sc-k">79.9</text><text x="293.25 299.43 305.61 308.14" y="639.88" font-size="11.00" class="sc-loraregular">88.0</text><text x="370.50" y="639.88" font-size="11.00" class="sc-loraregular">71.3</text><text x="447.75 453.65 460.30 463.01" y="639.88" font-size="11.00" class="sc-loraregular">20.4</text><text x="77.25 84.81 88.24 94.00 100.80 107.35 113.26 116.15 122.72 128.95 135.96 142.97 148.89 153.43 156.32" y="667.30" font-size="11.00" class="sc-lorabold">Claude Sonnet 5</text><text x="216.00" y="667.30" font-size="11.00" class="sc-loraregular sc-k">74.7</text><text x="293.25 299.43 305.39 308.09" y="667.30" font-size="11.00" class="sc-loraregular">84.3</text><text x="370.50 376.85 382.84 385.20" y="667.30" font-size="11.00" class="sc-loraregular">65.7</text><text x="447.75 453.41 459.37 462.07" y="667.30" font-size="11.00" class="sc-loraregular">24.5</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">194</text><text x="76.75" y="529.64" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="447.25" y="529.64" font-size="11.00" class="sc-notoserifcjkscbold" fill="#faf9f5">平均轮次</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="85.89" y="82.61" font-size="11.00" class="sc-loraregular">1980</text><text x="109.27" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）上胜出，但在呈现方面落后（</text><text x="263.27" y="82.61" font-size="11.00" class="sc-loraregular">1495</text><text x="288.48" y="82.61" font-size="11.00" class="sc-notoserifcjksc">对</text><text x="302.37" y="82.61" font-size="11.00" class="sc-loraregular">1572</text><text x="323.35" y="82.61" font-size="11.00" class="sc-notoserifcjksc">）。该评估由</text><text x="482.83" y="82.61" font-size="11.00" class="sc-notoserifcjksc">独立运行。</text><text x="72.00" y="157.42" font-size="11.00" class="sc-loraregular sc-k">Toolathlon</text><text x="129.80" y="157.42" font-size="11.00" class="sc-notoserifcjksc">是一个智能体基准测试，包含</text><text x="275.70" y="157.42" font-size="11.00" class="sc-loraregular">108</text><text x="295.61" y="157.42" font-size="11.00" class="sc-notoserifcjksc">个真实世界工具使用任务，涵盖办公效率、电子商</text><text x="72.00" y="173.04" font-size="11.00" class="sc-notoserifcjksc">务与运营、数据分析和网络调研。任务在预先填充了逼真数据的应用中开始，并由基于执行的检</text><text x="72.00" y="188.66" font-size="11.00" class="sc-notoserifcjksc">查器评分，这些检查器会核验生成的产出物以及相关应用或网站中发生的变化。该基准测试提供</text><text x="72.00" y="204.28" font-size="11.00" class="sc-loraregular">32</text><text x="86.93" y="204.28" font-size="11.00" class="sc-notoserifcjksc">个应用中的</text><text x="144.82" y="204.28" font-size="11.00" class="sc-loraregular">600</text><text x="167.73" y="204.28" font-size="11.00" class="sc-notoserifcjksc">多个工具，任务要求在长程中正确选择工具、进行多步排序，并给出与检查器</text><text x="72.00" y="219.90" font-size="11.00" class="sc-notoserifcjksc">要求完全一致的输出；在我们的运行中，轨迹平均约有</text><text x="338.89" y="219.90" font-size="11.00" class="sc-loraregular">20–26</text><text x="373.28" y="219.90" font-size="11.00" class="sc-notoserifcjksc">个助手轮次。我们以</text><text x="475.17" y="219.90" font-size="11.00" class="sc-loraregular sc-k">Toolathlon-</text><text x="114.80" y="235.52" font-size="11.00" class="sc-notoserifcjksc">为评估对象，这是作者的最终版本（</text><text x="290.80" y="235.52" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="318.62" y="235.52" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="332.51" y="235.52" font-size="11.00" class="sc-loraregular">6</text><text x="341.76" y="235.52" font-size="11.00" class="sc-notoserifcjksc">月发布），其中任务提示词、标准答案和</text><text x="72.00" y="251.14" font-size="11.00" class="sc-notoserifcjksc">评估器均经过人工审核并最终确定，并公布了八个模型的参考轨迹以供外部验证。</text><text x="72.00" y="335.53" font-size="11.00" class="sc-notoserifcjksc">我们使用内部运行框架，在</text><text x="206.89" y="335.53" font-size="11.00" class="sc-loraregular">max</text><text x="231.13" y="335.53" font-size="11.00" class="sc-notoserifcjksc">推理强度下使用自适应思考进行评估。我们以生产环境配置评估</text><text x="72.00" y="351.15" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="152.51" y="351.15" font-size="11.00" class="sc-notoserifcjksc">，启用安全分类器，并以</text><text x="276.40" y="351.15" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="362.29" y="351.15" font-size="11.00" class="sc-notoserifcjksc">作为拒绝回退模型；对比模型在禁用</text><text x="72.00" y="366.77" font-size="11.00" class="sc-notoserifcjksc">安全分类器和回退的情况下评估，其数据转引自</text><text x="305.89" y="366.77" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5</text><text x="382.93" y="366.77" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="415.93" y="366.77" font-size="11.00" class="sc-notoserifcjksc">。按照论文的评估方案，</text><text x="72.00" y="382.39" font-size="11.00" class="sc-notoserifcjksc">我们报告所有</text><text x="140.89" y="382.39" font-size="11.00" class="sc-loraregular">108</text><text x="160.80" y="382.39" font-size="11.00" class="sc-notoserifcjksc">个任务上三次试验平均后的</text><text x="295.70" y="382.39" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="330.91" y="382.39" font-size="11.00" class="sc-notoserifcjksc">，以及</text><text x="366.80" y="382.39" font-size="11.00" class="sc-loraregular sc-k">Pass@3</text><text x="404.13" y="382.39" font-size="11.00" class="sc-notoserifcjksc">（三次试验中至少一次正</text><text x="72.00" y="398.01" font-size="11.00" class="sc-notoserifcjksc">确）、</text><text x="105.00" y="398.01" font-size="11.00" class="sc-loraregular sc-k">Pass³</text><text x="131.52" y="398.01" font-size="11.00" class="sc-notoserifcjksc">（三次试验全部正确）和每条轨迹的平均助手轮次数。</text><text x="72.00" y="465.06" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="465.06" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="131.00" y="465.06" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="169.11" y="465.06" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="183.00" y="465.06" font-size="11.00" class="sc-loraregular sc-k">77.8%</text><text x="211.12" y="465.06" font-size="11.00" class="sc-notoserifcjksc">。在</text><text x="236.01" y="465.06" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="256.66" y="465.06" font-size="11.00" class="sc-notoserifcjksc">次试验中，有</text><text x="325.55" y="465.06" font-size="11.00" class="sc-loraregular">11</text><text x="336.45" y="465.06" font-size="11.00" class="sc-notoserifcjksc">次（</text><text x="358.45" y="465.06" font-size="11.00" class="sc-loraregular">3.4%</text><text x="382.82" y="465.06" font-size="11.00" class="sc-notoserifcjksc">）触发了安全拒绝，并由回退模</text><text x="72.00" y="480.68" font-size="11.00" class="sc-notoserifcjksc">型部分或全部完成；另有四次试验被安全分类器终止，计为失败。</text><text x="72.00" y="686.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="686.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.99 94.09 97.74 102.60 104.70 109.56 111.65 117.19 120.66 123.03 128.42 133.52 138.57 141.38 146.06 149.78 155.37 158.18 163.27" y="686.49" font-size="9.00" class="sc-lorabold">8.15.5.A] Toolathlon</text><text x="171.38" y="686.49" font-size="9.00" class="sc-notoserifcjkscbold">得分（内部运行框架）。</text><text x="270.38" y="686.49" font-size="9.00" class="sc-notoserifcjksc">各模型在启用自适应思考和</text><text x="380.74" y="686.49" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="399.31" y="686.49" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下评估；</text><text x="498.31" y="686.49" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="698.19" font-size="9.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="108.91" y="698.19" font-size="9.00" class="sc-notoserifcjksc">在启用安全分类器和拒绝回退的情况下运行。按照论文的评估方案，</text><text x="378.91" y="698.19" font-size="9.00" class="sc-loraregular sc-k">Pass@1</text><text x="407.72" y="698.19" font-size="9.00" class="sc-notoserifcjksc">、</text><text x="416.72" y="698.19" font-size="9.00" class="sc-loraregular sc-k">Pass@3</text><text x="449.63" y="698.19" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="461.00" y="698.19" font-size="9.00" class="sc-loraregular sc-k">Pass³</text><text x="485.06" y="698.19" font-size="9.00" class="sc-notoserifcjksc">均基于所有</text><text x="72.00" y="709.89" font-size="9.00" class="sc-loraregular">108</text><text x="88.29" y="709.89" font-size="9.00" class="sc-notoserifcjksc">个任务的三次试验计算。</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="305.89" y="357.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="305.89" y="357.97" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="341.29" y="357.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="344.18" y="357.97" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="371.15" y="357.97" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="374.04" y="357.97" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="382.93" y="357.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="382.93" y="357.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="393.93" y="357.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="393.93" y="357.97" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="404.93" y="357.97" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="404.93" y="357.97" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p195.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 195 页"><text x="72.00 80.29 83.42 87.97 96.28 99.41 107.75 111.13 120.19 128.62 133.46 141.75 155.25 164.06 168.90 172.33 180.62 189.06 197.24 205.26 213.70 221.49" y="311.45" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.15.6 AutomationBench</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">27</text><text x="80.62 86.28 92.27 97.69 103.66 108.82 113.07 119.05 121.58 124.21 131.42 133.88 136.40 139.03 144.19 150.26 156.24 158.87 164.53 169.69 172.41 175.22 184.16 189.31 195.38 200.01 202.54 205.17 211.45 213.90 216.53 219.58 224.95 231.09 236.46 242.11 245.16 247.62 250.25 256.51 262.47 266.34 272.19 281.13 286.22 290.08 292.89 298.74 304.75 310.97 316.38 322.45 327.77 333.76 336.22 338.84 344.00 347.71 354.20 357.01 362.06 364.55 369.92 375.70 381.91 387.33 389.78 393.42 398.97 404.75 410.32 415.73" y="704.45" font-size="10.00" class="sc-loraregular">Shepard, D., and Salimans, R. (2026). AutomationBench. arXiv:2604.18934.</text><text x="72.00 77.90 81.87 85.73 91.70 96.33 98.83 102.52 108.97 114.13 118.46 123.76 126.57 131.23 133.68 139.53 143.81 149.34 155.80 160.95 166.77 171.05 177.95 183.31 189.09 195.30 200.72 203.18 206.81 212.36 218.14 223.71" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2604.18934</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">195</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们的运行框架逐字节复现了</text><text x="320.99" y="82.61" font-size="11.00" class="sc-notoserifcjksc">的任务定义、提示词和基于执行的检查器，我</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">们通过重放作者公布的参考轨迹验证了这一点。为控制实时依赖漂移，我们将金融数据源固定为</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">运行时记录的快照，并固定容器镜像版本。少量上游检查器缺陷（例如标准答案引用了一个后来</text><text x="72.00" y="129.47" font-size="11.00" class="sc-notoserifcjksc">已更名的代码仓库）对所有模型的影响是对称的，我们未作修改。</text><text x="72.00" y="195.95" font-size="11.00" class="sc-notoserifcjksc">关于与公开排行榜可比性的说明：我们对</text><text x="272.89" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="359.13" y="195.95" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="373.03" y="195.95" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="458.91" y="195.95" font-size="11.00" class="sc-notoserifcjksc">得出的数据比公</text><text x="72.00" y="211.57" font-size="11.00" class="sc-notoserifcjksc">开排行榜上的数据（分别为</text><text x="206.89" y="211.57" font-size="11.00" class="sc-loraregular sc-k">71.6%</text><text x="237.39" y="211.57" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="251.28" y="211.57" font-size="11.00" class="sc-loraregular">76.2%</text><text x="72.00" y="227.19" font-size="11.00" class="sc-notoserifcjksc">者的运行框架未产生任何轨迹的运行（</text><text x="259.00" y="227.19" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="306.95" y="227.19" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="320.84" y="227.19" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="341.49" y="227.19" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="377.38" y="227.19" font-size="11.00" class="sc-loraregular">8</text><text x="386.46" y="227.19" font-size="11.00" class="sc-notoserifcjksc">次；</text><text x="408.46" y="227.19" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="456.05" y="227.19" font-size="11.00" class="sc-notoserifcjksc">为</text><text x="469.95" y="227.19" font-size="11.00" class="sc-loraregular sc-k">324</text><text x="490.59" y="227.19" font-size="11.00" class="sc-notoserifcjksc">次中的</text><text x="526.49" y="227.19" font-size="11.00" class="sc-loraregular">11</text><text x="72.00" y="242.81" font-size="11.00" class="sc-notoserifcjksc">次）。排行榜将这些计为失败；排除这些后，我们的数据与作者公布的参考轨迹在运行间噪声范</text><text x="72.00" y="258.43" font-size="11.00" class="sc-notoserifcjksc">围内一致。</text><text x="72.00" y="335.31" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="163.89" y="331.65" font-size="6.60" class="sc-loraregular">27</text><text x="173.37" y="335.31" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="187.27" y="335.31" font-size="11.00" class="sc-loraregular">Zapier</text><text x="222.93" y="335.31" font-size="11.00" class="sc-notoserifcjksc">推出的基准测试，衡量智能体能否完成一个真实的端到端业务工</text><text x="72.00" y="350.93" font-size="11.00" class="sc-notoserifcjksc">作流。任务源自销售、市场营销、运营、客户支持、财务和人力资源等领域的真实客户工作流模</text><text x="72.00" y="366.55" font-size="11.00" class="sc-notoserifcjksc">式。每个任务都将智能体置于一家模拟公司中，其中有横跨</text><text x="360.89" y="366.55" font-size="11.00" class="sc-loraregular">47</text><text x="374.82" y="366.55" font-size="11.00" class="sc-notoserifcjksc">个应用（</text><text x="418.82" y="366.55" font-size="11.00" class="sc-loraregular">CRM</text><text x="443.51" y="366.55" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="454.51" y="366.55" font-size="11.00" class="sc-loraregular">Slack</text><text x="481.18" y="366.55" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="492.18" y="366.55" font-size="11.00" class="sc-loraregular sc-k">Google</text><text x="72.00" y="382.17" font-size="11.00" class="sc-loraregular sc-k">Workspace</text><text x="131.57" y="382.17" font-size="11.00" class="sc-notoserifcjksc">等）的数十个</text><text x="200.46" y="382.17" font-size="11.00" class="sc-loraregular sc-k">REST API</text><text x="250.45" y="382.17" font-size="11.00" class="sc-notoserifcjksc">端点。智能体只会收到一条自然语言指令；随后它必须通过</text><text x="72.00" y="397.79" font-size="11.00" class="sc-notoserifcjksc">搜索自主发现正确的端点；进行数十次相互依赖的顺序</text><text x="338.89" y="397.79" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="358.97" y="397.79" font-size="11.00" class="sc-notoserifcjksc">调用；查阅并遵守分层的业务政策文</text><text x="72.00" y="413.41" font-size="11.00" class="sc-notoserifcjksc">档；并正确避开刻意设置的干扰项。每个任务按通过</text><text x="325.00" y="413.41" font-size="11.00" class="sc-loraregular">/</text><text x="332.59" y="413.41" font-size="11.00" class="sc-notoserifcjksc">不通过评分，依据是模拟应用状态是否满</text><text x="72.00" y="429.03" font-size="11.00" class="sc-notoserifcjksc">足所有确定性断言（例如，正确的</text><text x="239.89" y="429.03" font-size="11.00" class="sc-loraregular">CRM</text><text x="267.48" y="429.03" font-size="11.00" class="sc-notoserifcjksc">更新均已全部应用）。</text><text x="72.00" y="513.64" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="513.64" font-size="11.00" class="sc-loraregular sc-k">AutomationBench</text><text x="180.68" y="513.64" font-size="11.00" class="sc-notoserifcjksc">排行榜上（该排行榜衡量在一个非公开的留出评估集上的表现），</text><text x="499.68" y="513.64" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="529.26" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="529.26" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="131.00" y="529.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="153.70" y="529.26" font-size="11.00" class="sc-notoserifcjksc">推理强度下得分</text><text x="233.59" y="529.26" font-size="11.00" class="sc-loraregular">31.4%</text><text x="261.96" y="529.26" font-size="11.00" class="sc-notoserifcjksc">，相比</text><text x="297.86" y="529.26" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="320.55" y="529.26" font-size="11.00" class="sc-notoserifcjksc">推理强度下的</text><text x="389.44" y="529.26" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="463.58" y="529.26" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="474.58" y="529.26" font-size="11.00" class="sc-loraregular">26.9%</text><text x="505.48" y="529.26" font-size="11.00" class="sc-notoserifcjksc">）和</text><text x="72.00" y="544.88" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="145.80" y="544.88" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="156.80" y="544.88" font-size="11.00" class="sc-loraregular sc-k">17.05%</text><text x="190.33" y="544.88" font-size="11.00" class="sc-notoserifcjksc">）有大幅提升。</text><a href="https://arxiv.org/abs/2604.18934" rel="noopener"><rect x="72.00" y="707.20" width="157.13" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p196.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 196 页"><text x="72.00 80.93 84.30 89.20 98.18 101.82 111.57 120.41 131.23 139.41 149.17 159.98" y="399.41" font-size="14.00" class="sc-poppinsmedium">8.16 ARC-AGI</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">196</text><text x="72.00" y="348.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="348.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.60 104.70 109.87 111.97 117.50 120.98 123.35 129.17 134.69 138.41 143.51 151.79 156.46 160.18 163.12 168.22 173.91 179.86 184.70 190.44 195.10" y="348.43" font-size="9.00" class="sc-lorabold">8.15.6.A] AutomationBench</text><text x="203.06" y="348.43" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="230.06" y="348.43" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="298.30" y="348.43" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="309.66" y="348.43" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="328.23" y="348.43" font-size="9.00" class="sc-notoserifcjksc">推理强度下的表现超过此前所有</text><text x="456.60" y="348.43" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="487.93" y="348.43" font-size="9.00" class="sc-notoserifcjksc">模型。</text><text x="72.00 78.89 85.79 93.27 98.65 105.48 113.86" y="422.06" font-size="11.00" class="sc-loraregular">ARC-AGI</text><text x="120.43" y="422.06" font-size="11.00" class="sc-notoserifcjksc">是由</text><text x="145.33" y="422.06" font-size="11.00" class="sc-loraregular sc-k">François Chollet</text><text x="231.32" y="422.06" font-size="11.00" class="sc-notoserifcjksc">开发、由</text><text x="278.22 285.10 292.01 299.70 302.59 309.26 314.02 317.11 322.65 328.61 331.50 337.36 343.80 350.37 357.04 363.62 369.22 373.48 376.57 383.00" y="422.06" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="392.58" y="422.06" font-size="11.00" class="sc-notoserifcjksc">维护的流体智力基准测试。它</text><text x="72.00" y="437.68" font-size="11.00" class="sc-notoserifcjksc">旨在衡量</text><text x="118.89" y="437.68" font-size="11.00" class="sc-loraregular">AI</text><text x="132.36" y="437.68" font-size="11.00" class="sc-notoserifcjksc">模型在仅给出少量示例（通常约三个）的情况下对新颖模式进行推理的能力。模型会</text><text x="72.00" y="453.30" font-size="11.00" class="sc-notoserifcjksc">获得若干满足某种隐藏关系的网格输入</text><text x="259.00" y="453.30" font-size="11.00" class="sc-loraregular">-</text><text x="264.38" y="453.30" font-size="11.00" class="sc-notoserifcjksc">输出对，任务是针对一个新的输入网格推断出相应的输</text><text x="72.00" y="468.92" font-size="11.00" class="sc-notoserifcjksc">出。这些测试使用半私有验证集，以确保不同模型之间的一致性与公平性。</text><text x="72.00 78.89 85.79 93.48 96.38 103.04 107.81 110.90 116.43 122.39 125.28 131.15 137.58 144.15 150.83 157.40 163.00 167.26 170.35 176.79" y="535.41" font-size="11.00" class="sc-loraregular">ARC Prize Foundation</text><text x="186.37" y="535.41" font-size="11.00" class="sc-notoserifcjksc">报告称，在其半私有数据集上，</text><text x="340.37" y="535.41" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="385.48" y="535.41" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="399.37" y="535.41" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="422.07" y="535.41" font-size="11.00" class="sc-notoserifcjksc">推理强度下于</text><text x="490.96" y="535.41" font-size="11.00" class="sc-loraregular sc-k">ARC-</text><text x="72.00" y="551.03" font-size="11.00" class="sc-loraregular sc-k">AGI-1</text><text x="102.70" y="551.03" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="138.59" y="551.03" font-size="11.00" class="sc-loraregular sc-k">97.5%</text><text x="170.44" y="551.03" font-size="11.00" class="sc-notoserifcjksc">的验证分数，于</text><text x="250.33 257.22 264.13 271.61 276.98 283.82 292.19 295.70 300.72" y="551.03" font-size="11.00" class="sc-loraregular">ARC-AGI-2</text><text x="309.52" y="551.03" font-size="11.00" class="sc-notoserifcjksc">上取得</text><text x="345.42" y="551.03" font-size="11.00" class="sc-loraregular">90%</text><text x="371.07" y="551.03" font-size="11.00" class="sc-notoserifcjksc">的验证分数。发布时尚无</text><text x="494.96" y="551.03" font-size="11.00" class="sc-loraregular sc-k">ARC-</text><text x="72.00" y="566.65" font-size="11.00" class="sc-loraregular sc-k">AGI-3</text><text x="104.85" y="566.65" font-size="11.00" class="sc-notoserifcjksc">的结果。</text></svg></div>

.00" class="sc-lorabold">8.16.B] ARC-AGI-2</text><text x="165.75" y="671.74" font-size="9.00" class="sc-notoserifcjkscbold">表现，数据由</text><text x="222.12" y="671.74" font-size="9.00" class="sc-lorabold sc-k">ARC Prize Foundation</text><text x="318.74" y="671.74" font-size="9.00" class="sc-notoserifcjkscbold">报告。</text><text x="345.74" y="671.74" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="413.97" y="671.74" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="425.34" y="671.74" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="443.91" y="671.74" font-size="9.00" class="sc-notoserifcjksc">推理强度下于</text><text x="500.28" y="671.74" font-size="9.00" class="sc-loraregular sc-k">ARC-</text><text x="72.00" y="683.44" font-size="9.00" class="sc-loraregular sc-k">AGI-2</text><text x="98.62" y="683.44" font-size="9.00" class="sc-notoserifcjksc">上取得</text><text x="127.99" y="683.44" font-size="9.00" class="sc-loraregular">90%</text><text x="146.61" y="683.44" font-size="9.00" class="sc-notoserifcjksc">。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p198.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 198 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">198</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.17</text><text x="100.71" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">医疗健康</text><text x="72.00" y="110.55" font-size="11.00" class="sc-notoserifcjksc">我们在两项医疗健康基准测试</text><text x="217.89" y="110.55" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="283.54" y="106.88" font-size="6.60" class="sc-loraregular">28</text><text x="293.69" y="110.55" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="307.58" y="110.55" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="438.54" y="106.88" font-size="6.60" class="sc-loraregular">29</text><text x="448.79" y="110.55" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="495.68" y="110.55" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="126.17" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="114.22" y="126.17" font-size="11.00" class="sc-notoserifcjksc">，以考察其在多种医疗健康任务上的表现。</text><text x="323.22" y="126.17" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="391.76" y="126.17" font-size="11.00" class="sc-notoserifcjksc">是一项开源评估，用于评估模</text><text x="72.00" y="141.79" font-size="11.00" class="sc-notoserifcjksc">型在真实医疗健康情境中的安全性、准确性和沟通能力。该基准测试使用超过</text><text x="448.89 454.86 461.04 463.64 470.48 477.31" y="141.79" font-size="11.00" class="sc-loraregular">48,000</text><text x="487.04" y="141.79" font-size="11.00" class="sc-notoserifcjksc">条由专家</text><text x="72.00" y="157.41" font-size="11.00" class="sc-notoserifcjksc">撰写的评分细则条目，对</text><text x="195.89 201.89 204.50 211.33 218.16" y="157.41" font-size="11.00" class="sc-loraregular">5,000</text><text x="227.89" y="157.41" font-size="11.00" class="sc-notoserifcjksc">段多轮患者对话进行评分。</text><text x="359.89" y="157.41" font-size="11.00" class="sc-loraregular sc-k">HealthBench Professional</text><text x="493.74" y="157.41" font-size="11.00" class="sc-notoserifcjksc">是一项临</text><text x="72.00" y="173.03" font-size="11.00" class="sc-notoserifcjksc">床任务基准测试，由</text><text x="173.89" y="173.03" font-size="11.00" class="sc-loraregular">525</text><text x="194.68" y="173.03" font-size="11.00" class="sc-notoserifcjksc">段医生撰写的对话组成，涵盖临床会诊、文书记录和研究任务。两项基</text><text x="72.00" y="188.65" font-size="11.00" class="sc-notoserifcjksc">准测试均由</text><text x="129.89" y="188.65" font-size="11.00" class="sc-loraregular">LLM</text><text x="155.60" y="188.65" font-size="11.00" class="sc-notoserifcjksc">评判模型依据评分细则标准进行评分。</text><text x="72.00" y="254.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.17.1 HealthBench</text><text x="194.64" y="254.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结果</text><text x="72.00" y="286.72" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="286.72" font-size="11.00" class="sc-loraregular sc-k">HealthBench</text><text x="154.43" y="286.72" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="176.43" y="286.72" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="259.84" y="286.72" font-size="11.00" class="sc-notoserifcjksc">取得</text><text x="284.73" y="286.72" font-size="11.00" class="sc-loraregular sc-k">66.7%</text><text x="317.33" y="286.72" font-size="11.00" class="sc-notoserifcjksc">的原始得分，领先于</text><text x="419.23" y="286.72" font-size="11.00" class="sc-loraregular sc-k">Claude Fable</text><text x="72.00" y="302.34" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="302.34" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="88.99" y="302.34" font-size="11.00" class="sc-loraregular">61.2%</text><te e="6.60" class="sc-loraregular">30</text><text x="270.29" y="640.18" font-size="11.00" class="sc-notoserifcjksc">上评估了</text><text x="317.19" y="640.18" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="397.70" y="640.18" font-size="11.00" class="sc-notoserifcjksc">，以考察其在一系列语言上的</text><text x="72.00" y="655.80" font-size="11.00" class="sc-notoserifcjksc">表现。</text><a href="https://arxiv.org/abs/2411.02538" rel="noopener"><rect x="151.09" y="707.20" width="154.24" height="12.80" fill="transparent"/></a></svg></div>
