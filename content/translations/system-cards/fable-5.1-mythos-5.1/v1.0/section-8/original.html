（对数刻度）的关系。成本按缓存命中估算计费。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p178.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 178 页"><text x="72.00 80.29 83.42 87.97 95.47 98.60 106.10 109.48 118.69 126.91 135.97 146.01" y="429.01" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.12.2 DRACO</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">18</text><text x="80.18 86.28 92.27 98.12 104.19 109.71 112.24 114.87 118.39 120.85 123.38 126.01 131.35 135.22 137.85 143.01 145.73 148.19 150.82 153.87 159.23 165.37 170.74 176.40 179.45 181.90 184.53 191.88 198.65 204.86 211.84 219.78 222.28 224.91 230.07 232.69 238.01 242.27 248.12 252.75 257.37 262.26 268.24 274.09 283.02 288.18 290.99 297.06 299.69 305.51 310.92 316.99 322.31 328.30 337.23 342.39 346.68 352.05 354.68 358.01 363.85 368.18 370.81 378.26 383.62 389.04 395.01 397.64 403.85 409.26 413.89 419.29 424.45 428.71 434.03 440.01 442.64 448.90 454.17 459.48 465.45 469.71 474.87 480.14 484.86" y="704.45" font-size="10.00" class="sc-loraregular">Zhong, J., et al. (2026). DRACO: a cross-domain benchmark for Deep Research Accuracy,</text><text x="72.00 78.99 84.83 93.77 99.74 102.46 107.81 111.67 117.09 123.16 128.58 133.21 137.83 140.36 142.99 148.15 154.22 160.20 162.82 170.76 176.58 179.19 184.56 189.82 193.69 196.50 201.55 204.52 208.41 213.31 215.77 218.40 223.56 227.27 233.76 236.56 241.61 244.11 249.48 255.26 261.39 266.76 269.22 272.86 276.50 282.28 287.89 293.34" y="717.26" font-size="10.00" class="sc-loraregular">Completeness, and Objectivity. arXiv:2602.11685.</text><text x="298.43 304.33 308.30 312.16 318.13 322.76 325.26 328.95 335.40 340.56 344.89 350.19 353.00 357.66 360.11 365.96 370.24 375.77 382.23 387.38 393.20 397.48 404.38 409.74 415.52 421.66 427.03 429.49 433.13 436.76 442.54 448.16" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2602.11685</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="367.93" font-size="9.00" class="sc-lorabold sc-k">8.12.1.B] Humanity’s Last Exam</text><text x="217.29" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="226.29" y="367.93" font-size="9.00" class="sc-lorabold">HLE</text><text x="244.60" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">）</text><text x="253.60" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="257.08" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">不使用工具</text><text x="302.08" y="367.93" font-size="9.00" class="sc-lorabold">]</text><text x="307.92" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">测试时计算扩展</text><text x="370.92" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="427.28" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="445.85" y="367.93" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="457.22" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="475.79" y="367.93" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="487.16" y="367.93" font-size="9.00" class="sc-loraregular">HLE</text><text x="507.34" y="367.93" font-size="9.00" class="sc-notoserifcjksc">上的准</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">确率，与每任务平均计费成本（对数刻度）的关系。成本按缓存命中估算计费。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="452.86" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="452.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10" y="452.86" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="408.89" y="449.19" font-size="6.60" class="sc-loraregular">18</text><text x="415.00" y="452.86" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.89" y="452.86" font-size="11.00" class="sc-loraregular sc-k">Perplexity</text><text x="494.71" y="452.86" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="468.48" font-size="11.00" class="sc-notoserifcjksc">度研究基准，旨在评估模型在应对真实用户会提出的复杂研究问题时的表现。</text><text x="446.00" y="468.48" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="487.68" y="468.48" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="501.57" y="468.48" font-size="11.00" class="sc-loraregular">100</text><text x="522.13" y="468.48" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="484.10" font-size="11.00" class="sc-notoserifcjksc">精选任务组成，这些任务源自多个领域的用户查询。题目使用专家撰写的评分细则进行评分，评</text><text x="72.00" y="499.72" font-size="11.00" class="sc-notoserifcjksc">分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="566.42" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="566.42" font-size="11.00" class="sc-loraregular">100</text><text x="414.45" y="566.42" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="428.35" y="566.42" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="460.40" y="566.42" font-size="11.00" class="sc-notoserifcjksc">上限的条件下评</text><text x="72.00" y="582.04" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89" y="582.04" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="135.18" y="582.04" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="615.00" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00" y="630.62" font-size="11.00" class="sc-loraregular sc-k">DRACO</text><text x="113.68" y="630.62" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="171.57" y="630.62" font-size="11.00" class="sc-loraregular sc-k">Gemini 3 Pro</text><text x="241.19" y="630.62" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已不再可用。在我们的评估</text><text x="72.00" y="646.24" font-size="11.00" class="sc-notoserifcjksc">中，我们使用</text><text x="140.89" y="646.24" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.6</text><text x="226.85" y="646.24" font-size="11.00" class="sc-notoserifcjksc">依据每个任务的评分细则对回答进行评分，采用相同的二元</text><text x="72.00" y="661.86" font-size="11.00" class="sc-loraregular sc-k">MET/UNMET</text><text x="146.32" y="661.86" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="661.86" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="661.86" font-size="11.00" class="sc-notoserifcjksc">节中的公式汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的评估方案，对每个回答进行五次独立的评分运行并报告平均值。我们的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">判提示词取自论文的</text><text x="171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="212.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="270.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="279.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数偏移</text><text x="491.85" y="98.23" font-size="11.00" class="sc-loraregular">10–25</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数无法与论文的主要公布数字直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除更换评判模型外，与原论文唯一的其他区别在于：我们指示模型将其完整的最终报告写入其执</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">行环境中的一个文件，并且只对该文件的内容进行评分，而不是对完整的智能体对话记录评分；</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这样可以将交付物与中间工具输出隔离开来。</text><text x="72.00" y="539.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.85" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 129.61 135.78 141.62 147.81" y="539.85" font-size="9.00" class="sc-lorabold">8.12.2.A] DRACO</text><text x="157.10" y="539.85" font-size="9.00" class="sc-notoserifcjksc">在不同推理强度档位下的分数与每任务平均成本。在</text><text x="366.46" y="539.85" font-size="9.00" class="sc-loraregular">98</text><text x="379.09" y="539.85" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="390.46" y="539.85" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="416.68" y="539.85" font-size="9.00" class="sc-notoserifcjksc">预算下，推理强度从</text><text x="500.05" y="539.85" font-size="9.00" class="sc-loraregular sc-k">low</text><text x="517.25" y="539.85" font-size="9.00" class="sc-notoserifcjksc">提高</text><text x="72.00" y="551.55" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="83.37" y="551.55" font-size="9.00" class="sc-loraregular">max</text><text x="103.19" y="551.55" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="114.56" y="551.55" font-size="9.00" class="sc-loraregular sc-k">DRACO</text><text x="148.66" y="551.55" font-size="9.00" class="sc-notoserifcjksc">上的归一化分数，与每任务平均计费成本（对数刻度）的关系。成本按缓存命中估算计费。</text><text x="72.00" y="599.73" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="599.73" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="626.30" font-size="11.00" class="sc-notoserifcjksc">我们评估了将单智能体替换为多智能体配置时</text><text x="294.89" y="626.30" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="378.30" y="626.30" font-size="11.00" class="sc-notoserifcjksc">的表现。下文中，我们重点介绍</text><text x="72.00" y="641.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="641.92" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="164.71" y="641.92" font-size="11.00" class="sc-notoserifcjksc">上的结果（第</text><text x="233.60" y="641.92" font-size="11.00" class="sc-loraregular">8.13.1</text><text x="262.22" y="641.92" font-size="11.00" class="sc-notoserifcjksc">节），并描述我们测试的运行框架（第</text><text x="452.12" y="641.92" font-size="11.00" class="sc-loraregular">8.13.2</text><text x="482.64" y="641.92" font-size="11.00" class="sc-notoserifcjksc">节）以及测</text><text x="72.00" y="657.54" font-size="11.00" class="sc-notoserifcjksc">量方法（第</text><text x="129.89" y="657.54" font-size="11.00" class="sc-loraregular">8.13.3</text><text x="160.64" y="657.54" font-size="11.00" class="sc-notoserifcjksc">节）。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="193.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="195.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p180.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 180 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 118.21 126.65 130.08 134.91 138.34 145.95 155.01 163.82 171.84 180.27 185.10 188.48 196.22 201.21 209.50 218.31 223.30 232.11 245.61 253.80 261.82 270.25 278.05" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 Multi-Agent ProgramBench</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">19</text><text x="80.28 86.13 91.29 97.35 102.88 105.41 108.04 111.56 114.02 116.55 119.18 124.52 128.39 131.02 136.18 138.90 141.36 143.99 147.03 152.40 158.54 163.91 169.57 172.61 175.07 177.70 183.76 188.02 193.87 199.39 203.65 208.81 217.69 223.90 229.32 235.39 240.71 246.69 249.19 251.82 258.81 263.97 270.04 272.66 275.38 280.54 286.61 292.14 298.10 303.26 308.74 314.16 316.79 325.72 331.57 337.55 342.97 345.69 350.31 352.94 357.20 362.62 368.44 374.40 377.21 379.93 385.91 388.54 394.51 398.76 404.61 410.14 414.40 419.56 428.49 433.12 435.75 439.13 443.39 449.23 458.17 460.80 465.43 470.75 475.00 480.09 483.96 489.28 495.08" y="704.45" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.51 122.82 129.03 134.60 140.04 145.46 151.24" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2605.03546.</text><text x="156.33 162.22 166.19 170.06 176.03 180.66 183.16 186.84 193.30 198.46 202.79 208.08 210.89 215.55 218.01 223.86 228.14 233.66 240.12 245.28 251.10 255.38 262.27 267.64 273.42 279.63 285.07 287.38 293.59 299.16 304.61 310.02" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.03546</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">180</text><text x="72.00" y="110.83" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="147.92" y="107.16" font-size="6.60" class="sc-loraregular">19</text><text x="157.03" y="110.83" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="214.93" y="110.83" font-size="11.00" class="sc-loraregular">200</text><text x="237.39" y="110.83" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体仅获得由某个开源</text><text x="72.00" y="126.45" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网或反编译工具的情况下重建</text><text x="72.00" y="142.07" font-size="11.00" class="sc-notoserifcjksc">一个能复现原程序行为的代码库。如第</text><text x="261.89" y="142.07" font-size="11.00" class="sc-loraregular">8.11.1</text><text x="288.39" y="142.07" font-size="11.00" class="sc-notoserifcjksc">节所述，我们排除了参考二进制文件在隐藏测试集</text><text x="72.00" y="157.69" font-size="11.00" class="sc-notoserifcjksc">上得分低于</text><text x="129.89" y="157.69" font-size="11.00" class="sc-loraregular sc-k">0.9</text><text x="148.51" y="157.69" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="162.40" y="157.69" font-size="11.00" class="sc-loraregular">34</text><text x="177.38" y="157.69" font-size="11.00" class="sc-notoserifcjksc">个任务，剩余</text><text x="246.27" y="157.69" font-size="11.00" class="sc-loraregular">166</text><text x="265.89" y="157.69" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="276.89" y="157.69" font-size="11.00" class="sc-loraregular">“</text><text x="281.29" y="157.69" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="303.29" y="157.69" font-size="11.00" class="sc-loraregular">”</text><text x="307.13" y="157.69" font-size="11.00" class="sc-notoserifcjksc">任务。单智能体结果已在第</text><text x="442.02" y="157.69" font-size="11.00" class="sc-loraregular">8.11</text><text x="461.81" y="157.69" font-size="11.00" class="sc-notoserifcjksc">节中给出；本节</text><text x="72.00" y="173.31" font-size="11.00" class="sc-notoserifcjksc">给出多智能体</text><text x="140.89" y="173.31" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="219.71" y="173.31" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="72.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">我们将两种多智能体运行框架配置与单智能体基线进行了比较：固定的五智能体团队，以及动态</text><text x="72.00" y="256.18" font-size="11.00" class="sc-notoserifcjksc">派生的异步子智能体（详见第</text><text x="217.89" y="256.18" font-size="11.00" class="sc-loraregular">8.13.2</text><text x="248.42" y="256.18" font-size="11.00" class="sc-notoserifcjksc">节）。我们在一系列中间快照处进行评分，并利用由此得到</text><text x="72.00" y="271.80" font-size="11.00" class="sc-notoserifcjksc">的每个任务在得分、延迟和</text><text x="206.89" y="271.80" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="238.95" y="271.80" font-size="11.00" class="sc-notoserifcjksc">方面的轨迹，构建图</text><text x="340.84" y="271.80" font-size="11.00" class="sc-loraregular">8.13.1.A</text><text x="379.05" y="271.80" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="403.95" y="271.80" font-size="11.00" class="sc-loraregular">8.13.1.B</text><text x="442.12" y="271.80" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.16" y="414.42" font-size="9.00" class="sc-lorabold">8.13.1.A]</text><text x="122.00" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.37" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.74" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.74" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.55" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.55" y="414.42" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="259.72" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟。</text><text x="349.72" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一点表示：若每个问题都在该秒数处停</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">止，模型平均能通过的隐藏测试比例。阴影区域表示</text><text x="281.37" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="301.67" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分差异计算得出。随着问题完</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍在贡献数据的问题就越少。</text><text x="72.00" y="493.23" font-size="11.00" class="sc-notoserifcjksc">在完整的黄金集上，与单智能体相比，五智能体团队和异步子智能体在相同得分下都表现出延迟</text><text x="72.00" y="508.86" font-size="11.00" class="sc-notoserifcjksc">上的改善。具体而言，五智能体团队达到相同的</text><text x="305.89" y="508.86" font-size="11.00" class="sc-loraregular sc-k">0.6</text><text x="324.40" y="508.86" font-size="11.00" class="sc-notoserifcjksc">分时，实现了相对单智能体</text><text x="459.29" y="508.86" font-size="11.00" class="sc-loraregular">2x</text><text x="473.92" y="508.86" font-size="11.00" class="sc-notoserifcjksc">的延迟改善。</text><text x="72.00" y="524.47" font-size="11.00" class="sc-notoserifcjksc">异步子智能体的速度相较单智能体有所提升，但幅度小于五智能体团队，之后它取得领先，获得</text><text x="72.00" y="540.09" font-size="11.00" class="sc-notoserifcjksc">了最高的最终得分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="414.42" font-size="9.00" class="sc-lorabold sc-k">8.13.1.B]</text><text x="122.00" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.37" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.74" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.74" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.55" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.55" y="414.42" font-size="9.00" class="sc-lorabold sc-k">”ProgramBench</text><text x="259.72" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与</text><text x="325.09" y="414.42" font-size="9.00" class="sc-lorabold sc-k">token</text><text x="349.57" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="358.57" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一点表示：若每个问题都在该</text><text x="513.94" y="414.42" font-size="9.00" class="sc-loraregular sc-k">token</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">用量处停止，模型平均能通过的隐藏测试比例。阴影区域表示</text><text x="317.37" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="337.67" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分差异计算得出。随</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">着问题完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍在贡献数据的问题就越少。</text><text x="72.00" y="493.23" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="493.23" font-size="11.00" class="sc-loraregular">8.13.1.B</text><text x="124.06" y="493.23" font-size="11.00" class="sc-notoserifcjksc">进一步展示了多智能体运行框架在延迟与成本之间的权衡：当延迟是关注点时，五智</text><text x="72.00" y="508.86" font-size="11.00" class="sc-notoserifcjksc">能体团队和异步子智能体可以通过在多个智能体之间分配工作，有效利用额外的</text><text x="459.89" y="508.86" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="491.95" y="508.86" font-size="11.00" class="sc-notoserifcjksc">预算，从</text><text x="72.00" y="524.47" font-size="11.00" class="sc-notoserifcjksc">而以更高的成本更快地达到给定分数。</text><text x="72.00" y="572.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.2</text><text x="110.17" y="572.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="600.42" font-size="11.00" class="sc-notoserifcjkscbold">五智能体团队</text><text x="138.00" y="600.42" font-size="11.00" class="sc-notoserifcjksc">。由五个对等智能体组成的团队同时处理任务。所有智能体拥有相同的工具，且都</text><text x="72.00" y="616.04" font-size="11.00" class="sc-notoserifcjksc">能看到完整的任务描述。除任务工具外，每个智能体还有两个消息工具：</text><text x="424.00" y="616.04" font-size="11.00" class="sc-loraregular sc-k">Send Message</text><text x="496.18" y="616.04" font-size="11.00" class="sc-notoserifcjksc">，用于向</text><text x="72.00" y="631.66" font-size="11.00" class="sc-notoserifcjksc">一个或多个队友发送消息（插入在接收方下一个工具结果之后）；以及</text><text x="415.89" y="631.66" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="504.09" y="631.66" font-size="11.00" class="sc-notoserifcjksc">，它会</text><text x="72.00" y="647.28" font-size="11.00" class="sc-notoserifcjksc">阻塞采样，直到收到传入消息。每个智能体在其各自的任务代码仓库检出副本中工作，并可通过</text><text x="72.00" y="662.90" font-size="11.00" class="sc-loraregular sc-k">Git</text><text x="90.79" y="662.90" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。该运行框架旨在模拟多个智能体协作完成共享任务的真实场景，并</text><text x="72.00" y="678.52" font-size="11.00" class="sc-notoserifcjksc">通过让对等智能体并行工作来降低延迟。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">。该运行框架初始化时包含一个主智能体，它可以随时派生异步、长期存在的子智</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">能体，同时保留对任务工具的直接访问。派生工具会立即返回一条确认信息，而不是等待子智能</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">任何其他智能体或主智能体发送消息。子智能体的最终回复会以消息形式传递给主智能体；此</text><text x="72.00" y="161.28" font-size="11.00" class="sc-notoserifcjksc">后，该子智能体处于空闲状态，直到主智能体用新指令将其唤醒。子智能体可以使用任务工具以</text><text x="72.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">及与五智能体团队中相同的通信工具（即</text><text x="272.89" y="176.90" font-size="11.00" class="sc-loraregular sc-k">Send Message</text><text x="347.97" y="176.90" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="361.86" y="176.90" font-size="11.00" class="sc-loraregular sc-k">Wait for Message</text><text x="450.06" y="176.90" font-size="11.00" class="sc-notoserifcjksc">）；主智能体还拥</text><text x="72.00" y="208.14" font-size="11.00" class="sc-notoserifcjksc">止）的工具。主智能体可派生的子智能体数量没有上限。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这两种运行框架中的每个智能体都可以使用</text><text x="283.89" y="293.11" font-size="11.00" class="sc-loraregular">bash</text><text x="310.55" y="293.11" font-size="11.00" class="sc-notoserifcjksc">工具，且限额为</text><text x="390.44" y="293.11" font-size="11.00" class="sc-loraregular">100</text><text x="411.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="424.89" y="293.11" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="454.05" y="293.11" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.3</text><text x="110.49" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">我们重点比较单智能体与多智能体运行框架，包括得分、延迟、</text><text x="380.00" y="351.72" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="412.05" y="351.72" font-size="11.00" class="sc-notoserifcjksc">用量和成本。</text><text x="478.05" y="351.72" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="510.11" y="351.72" font-size="11.00" class="sc-notoserifcjksc">用量</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">按一个任务中所有智能体消耗的</text><text x="228.89" y="367.34" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="260.95" y="367.34" font-size="11.00" class="sc-notoserifcjksc">总数计算。成本根据</text><text x="362.84" y="367.34" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="394.89" y="367.34" font-size="11.00" class="sc-notoserifcjksc">用量和按</text><text x="441.79" y="367.34" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="473.84" y="367.34" font-size="11.00" class="sc-notoserifcjksc">计费的</text><text x="509.73" y="367.34" font-size="11.00" class="sc-loraregular sc-k">API</text><text x="529.81" y="367.34" font-size="11.00" class="sc-notoserifcjksc">价</text><text x="72.00" y="382.96" font-size="11.00" class="sc-notoserifcjksc">格计算，并假设缓存完全命中。延迟以推导的单任务延迟报告，而非原始的实际耗时。我们计算</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">每条智能体轨迹的延迟的方法是：将该智能体的输入和输出</text><text x="360.89" y="398.58" font-size="11.00" class="sc-loraregular sc-k">token</text><text x="392.95" y="398.58" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充</text><text x="72.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="113.05" y="414.20" font-size="11.00" class="sc-notoserifcjksc">）与解码速率，再加上其实测的工具执行时间。为计入智能体的空闲时间，我们强制每</text><text x="72.00" y="429.82" font-size="11.00" class="sc-notoserifcjksc">个智能体继承其自身时钟与其交互过的任何智能体（通过消息或派生）的时钟中较长的那个。我</text><text x="72.00" y="445.44" font-size="11.00" class="sc-notoserifcjksc">们将最长的智能体轨迹报告为该运行框架的延迟，以代表完成的全部编程工作。使用推导延迟可</text><text x="72.00" y="461.06" font-size="11.00" class="sc-notoserifcjksc">以将运行框架本身的延迟（例如它需要多少串行的模型工作和工具时间）与服务端波动（例如批</text><text x="72.00" y="476.68" font-size="11.00" class="sc-notoserifcjksc">处理、排队、硬件）隔离开来，从而使不同运行框架能够跨时间在同等基础上进行比较。</text><text x="72.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">这些结果是在一个启用了安全分类器的内部</text><text x="283.89" y="578.41" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="329.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">端点上收集的，并以</text><text x="430.90" y="578.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="469.64" y="578.41" font-size="11.00" class="sc-notoserifcjksc">作为唯一的拒</text><text x="72.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">绝回退（</text><text x="116.00" y="594.03" font-size="11.00" class="sc-loraregular">fallback</text><text x="155.21" y="594.03" font-size="11.00" class="sc-notoserifcjksc">）模型。</text><text x="199.21" y="594.03" font-size="11.00" class="sc-loraregular">72%</text><text x="222.66" y="594.03" font-size="11.00" class="sc-notoserifcjksc">的回合中至少有一个轮次由回退模型完成，总计影响不到</text><text x="500.55" y="594.03" font-size="11.00" class="sc-loraregular">1%</text><text x="517.02" y="594.03" font-size="11.00" class="sc-notoserifcjksc">的轮</text><text x="72.00" y="609.65" font-size="11.00" class="sc-notoserifcjksc">次。因此，</text><text x="127.00" y="609.65" font-size="11.00" class="sc-loraregular sc-k">ProgramBench</text><text x="205.82" y="609.65" font-size="11.00" class="sc-notoserifcjksc">分数最好被理解为不同运行框架之间的相对比较，而不是性能的绝对</text><text x="72.00" y="625.27" font-size="11.00" class="sc-notoserifcjksc">衡量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.49 125.92 134.73 139.72 144.56 152.85 161.66 166.65 175.46 184.27 192.71" y="125.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 Chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00" y="148.97" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="142.82" y="145.30" font-size="6.60" class="sc-loraregular">20</text><text x="153.35" y="148.97" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="167.25" y="148.97" font-size="11.00" class="sc-loraregular sc-k">Surge AI</text><text x="213.04" y="148.97" font-size="11.00" class="sc-notoserifcjksc">推出的图表理解基准测试，涵盖</text><text x="369.93" y="148.97" font-size="11.00" class="sc-loraregular">100</text><text x="390.49" y="148.97" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测试中</text><text x="72.00" y="164.59" font-size="11.00" class="sc-notoserifcjksc">很少评估的专业图表类型。其中包括</text><text x="250.89 258.41 264.08 270.65 273.64 279.32 285.99 292.48 302.51 308.47 311.56 317.52" y="164.59" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="325.18" y="164.59" font-size="11.00" class="sc-notoserifcjksc">生存曲线图、</text><text x="391.18" y="164.59" font-size="11.00" class="sc-loraregular">K</text><text x="72.00" y="180.21" font-size="11.00" class="sc-notoserifcjksc">图、风玫瑰图、桑基图、伯德图和三维曲面图。由于不同类型的图表可读取的精度不同，每个答</text><text x="72.00" y="195.83" font-size="11.00" class="sc-notoserifcjksc">案都依据专家为该特定图表设定的可接受范围进行评分，而不是依据单一固定的容差。</text><text x="72.00" y="262.53" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="262.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="262.53" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="278.15" font-size="11.00" class="sc-notoserifcjksc">进行评估时，模型会获得一个容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们</text><text x="72.00" y="293.77" font-size="11.00" class="sc-notoserifcjksc">内部的</text><text x="107.89" y="293.77" font-size="11.00" class="sc-loraregular sc-k">Chartography</text><text x="181.60" y="293.77" font-size="11.00" class="sc-notoserifcjksc">评分实现与官方代码仓库中的任务及专家确定的可接受答案范围一致。</text><text x="522.60" y="290.11" font-size="6.60" class="sc-loraregular">21</text><text x="72.00" y="360.22" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="155.40" y="360.22" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分为</text><text x="268.30" y="360.22" font-size="11.00" class="sc-loraregular sc-k">42.6%</text><text x="298.69" y="360.22" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="378.58" y="360.22" font-size="11.00" class="sc-loraregular">86.2%</text><text x="409.30" y="360.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="420.30" y="360.22" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="497.00" y="360.22" font-size="11.00" class="sc-notoserifcjksc">的得分分</text><text x="72.00" y="375.84" font-size="11.00" class="sc-notoserifcjksc">别为</text><text x="96.89" y="375.84" font-size="11.00" class="sc-loraregular sc-k">36.6%</text><text x="130.79" y="375.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.69" y="375.84" font-size="11.00" class="sc-loraregular">84.2%</text><text x="175.01" y="375.84" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="199.91" y="375.84" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="276.94" y="375.84" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="345.83" y="375.84" font-size="11.00" class="sc-loraregular sc-k">29.6%</text><text x="379.34" y="375.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="393.23" y="375.84" font-size="11.00" class="sc-loraregular sc-k">83.0%</text><text x="424.48" y="375.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">20</text><text x="81.58" y="678.20" font-size="10.00" class="sc-loraregular sc-k">Surge AI (2026). Chartography: A benchmark for professional chart understanding. Surge AI.</text><text x="72.00 77.90 81.87 85.74 91.71 96.34 98.84 102.53 109.43 114.06 120.03 124.31 129.79 135.21 141.20 146.96 149.42 154.58 157.18 164.08 169.90 172.62 178.47 184.00 190.90 196.22 202.21 207.37 211.77 215.64 221.49 227.02 231.28 236.44 242.41 248.33" y="692.40" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://surgehq.ai/blog/chartography</text><text x="72.00" y="703.26" font-size="6.00" class="sc-loraregular">21</text><text x="80.04" y="706.60" font-size="10.00" class="sc-loraregular sc-k">Surge AI (2026). Chartography [Code repository]. GitHub.</text><text x="348.33 354.23 358.20 362.07 368.04 372.67 375.17 378.86 385.76 391.53 394.50 398.37 404.36 410.33 416.15 418.61 423.88 429.73 438.48 445.38 450.01 455.98 460.26 465.74 471.16 476.05 481.21 483.81" y="706.60" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://github.com/surge-ai/</text><text x="72.00" y="720.80" font-size="10.00" class="sc-loraregular sc-k" fill="#0000ff">chartography</text><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="72.00" y="684.40" width="37.43" height="10.00" fill="transparent"/></a><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="109.43" y="684.40" width="0.00" height="10.00" fill="transparent"/></a><a href="https://surgehq.ai/blog/chartography" rel="noopener"><rect x="109.43" y="684.40" width="54.65" height="10.00" fill="tr <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p185.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 185 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">185</text><text x="72.00" y="395.67" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="395.67" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 108.41 110.51 116.05 119.52 121.89 128.08 133.67 138.38 142.70 146.42 151.52 156.53 160.80 165.52 170.89 176.34" y="395.67" font-size="9.00" class="sc-lorabold">8.14.1.A] Chartography</text><text x="183.66" y="395.67" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="210.66" y="395.67" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="241.99" y="395.67" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考和</text><text x="343.36" y="395.67" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="361.93" y="395.67" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下评估，分为使用工具和不</text><text x="72.00" y="407.38" font-size="9.00" class="sc-notoserifcjksc">使用工具两种情况。得分为五次运行的平均值。图中显示</text><text x="299.37" y="407.38" font-size="9.00" class="sc-loraregular">95%</text><text x="319.67" y="407.38" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="364.67" y="407.38" font-size="9.00" class="sc-loraregular sc-k">Gemini 3.7 Flash</text><text x="432.37" y="407.38" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="441.37" y="407.38" font-size="9.00" class="sc-loraregular sc-k">Medium</text><text x="475.73" y="407.38" font-size="9.00" class="sc-notoserifcjksc">）和</text><text x="496.10" y="407.38" font-size="9.00" class="sc-loraregular sc-k">GPT-5.6</text><text x="72.00" y="419.08" font-size="9.00" class="sc-loraregular">Sol</text><text x="84.82" y="419.08" font-size="9.00" class="sc-notoserifcjksc">（</text><text x="93.82" y="419.08" font-size="9.00" class="sc-loraregular">Max</text><text x="111.49" y="419.08" font-size="9.00" class="sc-notoserifcjksc">）的分数取自</text><text x="167.86" y="419.08" font-size="9.00" class="sc-loraregular sc-k">Surge AI</text><text x="205.33" y="419.08" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果，在不使用工具的条件下评估。</text><text x="72.00" y="448.41" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时，</text><text x="160.00" y="448.41" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="243.40" y="448.41" font-size="11.00" class="sc-notoserifcjksc">的表现优于此前所有</text><text x="345.30" y="448.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="383.59" y="448.41" font-size="11.00" class="sc-notoserifcjksc">模型。在使用工具时，</text><text x="493.59" y="448.41" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="464.03" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="117.11" y="464.03" font-size="11.00" class="sc-notoserifcjksc">在得分</text><text x="150.11" y="464.03" font-size="11.00" class="sc-loraregular">–</text><text x="156.60" y="464.03" font-size="11.00" class="sc-notoserifcjksc">成本前沿上帕累托占优于</text><text x="280.49" y="464.03" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="354.29" y="464.03" font-size="11.00" class="sc-notoserifcjksc">，并在较高推理强度档位下优于</text><text x="511.19" y="464.03" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="479.65" font-size="11.00" class="sc-loraregular">5</text><text x="78.00" y="479.65" font-size="11.00" class="sc-notoserifcjksc">。我们继续发现，利用模型的智能体编程能力来处理、分析和裁剪图像，可能比单纯启用自适应</text><text x="72.00" y="495.27" font-size="11.00" class="sc-notoserifcjksc">思考具有显著更高的成本效益。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p186.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 186 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.01 110.39 118.58 126.60 135.03 142.83 151.26 161.31 170.37" y="484.08" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.2 BenchCAD</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">186</text><text x="72.00" y="423.43" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="423.43" font-size="9.00" class="sc-lorabold sc-k">8.14.1.B] Chartography</text><text x="183.66" y="423.43" font-size="9.00" class="sc-notoserifcjkscbold">得分。</text><text x="210.66" y="423.43" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考、不同推理强度档位下评估，分为使用工具和不使用工具两</text><text x="72.00" y="435.13" font-size="9.00" class="sc-notoserifcjksc">种情况。我们使用</text><text x="146.37" y="435.13" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="172.45" y="435.13" font-size="9.00" class="sc-notoserifcjksc">参数来调整所花费的测试时计算量。得分为每个推理强度档位下五次运行的平均值。图中显</text><text x="72.00" y="446.83" font-size="9.00" class="sc-notoserifcjksc">示</text><text x="83.37" y="446.83" font-size="9.00" class="sc-loraregular">95%</text><text x="103.67" y="446.83" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="507.94" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="126.45" y="504.27" font-size="6.60" class="sc-loraregular">22</text><text x="136.43" y="507.94" font-size="11.00" class="sc-notoserifcjksc">是一个程序化</text><text x="205.32" y="507.94" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="230.88" y="507.94" font-size="11.00" class="sc-notoserifcjksc">推理基准测试，由</text><text x="321.77 325.77 330.36 333.13 339.49 346.32" y="507.94" font-size="11.00" class="sc-loraregular">17,900</text><text x="356.06" y="507.94" font-size="11.00" class="sc-notoserifcjksc">个经执行验证的</text><text x="435.95" y="507.94" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="490.71" y="507.94" font-size="11.00" class="sc-notoserifcjksc">程序构建</text><text x="72.00" y="523.56" font-size="11.00" class="sc-notoserifcjksc">而成，涵盖</text><text x="129.89" y="523.56" font-size="11.00" class="sc-loraregular">106</text><text x="149.98" y="523.56" font-size="11.00" class="sc-notoserifcjksc">个工业零件族，其中大约一半以真实的</text><text x="339.87" y="523.56" font-size="11.00" class="sc-loraregular">ISO</text><text x="358.53" y="523.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="369.53" y="523.56" font-size="11.00" class="sc-loraregular sc-k">DIN</text><text x="389.68" y="523.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="400.68" y="523.56" font-size="11.00" class="sc-loraregular">EN</text><text x="415.90" y="523.56" font-size="11.00" class="sc-notoserifcjksc">、</text><text x="426.90" y="523.56" font-size="11.00" class="sc-loraregular">ASME</text><text x="459.86" y="523.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="473.75" y="523.56" font-size="11.00" class="sc-loraregular">IEC</text><text x="494.86" y="523.56" font-size="11.00" class="sc-notoserifcjksc">规格表为</text><text x="72.00" y="539.18" font-size="11.00" class="sc-notoserifcjksc">依据。该基准测试将</text><text x="173.89" y="539.18" font-size="11.00" class="sc-loraregular sc-k">CAD</text><text x="199.45" y="539.18" font-size="11.00" class="sc-notoserifcjksc">能力分解为四个相互匹配的任务；我们报告的是</text><text x="433.34" y="539.18" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="500.21" y="539.18" font-size="11.00" class="sc-notoserifcjksc">任务上</text><text x="72.00" y="554.80" font-size="11.00" class="sc-notoserifcjksc">的结果，该任务要求模型根据多视图渲染图生成</text><text x="305.89" y="554.80" font-size="11.00" class="sc-loraregular sc-k">CadQuery</text><text x="360.65" y="554.80" font-size="11.00" class="sc-notoserifcjksc">代码。</text><text x="72.00" y="621.50" font-size="11.00" class="sc-notoserifcjksc">我们内部的</text><text x="129.89" y="621.50" font-size="11.00" class="sc-loraregular sc-k">BenchCAD</text><text x="187.24" y="621.50" font-size="11.00" class="sc-notoserifcjksc">实现与原始参考实现一致，仅有三处细微修改。</text><text x="418.24" y="617.83" font-size="6.60" class="sc-loraregular sc-k">23</text><text x="428.25" y="621.50" font-size="11.00" class="sc-notoserifcjksc">第一，我们更正了参考</text><text x="72.00" y="637.12" font-size="11.00" class="sc-notoserifcjksc">系统提示词（</text><text x="138.00" y="637.12" font-size="11.00" class="sc-loraregular sc-k">system prompt</text><text x="215.29" y="637.12" font-size="11.00" class="sc-notoserifcjksc">）中的一个笔误，该笔误调换了提供给</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">22</text><text x="81.07 87.17 93.16 98.32 104.39 109.92 112.44 115.07 122.87 125.33 127.85 130.48 135.83 139.70 142.33 147.49 150.21 152.67 155.30 158.35 163.72 169.86 175.23 180.89 183.94 186.40 189.03 195.25 200.67 206.74 212.06 217.93 224.82 231.08 238.53 241.03 243.66 249.92 252.55 257.82 263.67 272.61 278.58 282.84 288.26 294.25 299.67 305.74 310.37 313.18 318.18 323.60 326.12 328.75 331.56 337.63 343.61 349.58 354.21 358.08 362.58 367.86 372.75 377.38 381.25 386.41 392.48 398.46 403.62 407.88 413.86 416.49 422.31 427.73 433.80 439.12 445.11 454.05 459.21 463.50 468.87 471.50 474.83 480.68" y="678.20" font-size="10.00" class="sc-loraregular">Zhang, H., et al. (2026). BenchCAD: A comprehensive, industry-standard benchmark for</text><text x="248.86 254.76 258.73 262.60 268.57 273.20 275.70 279.39 286.29 291.45 295.78 301.08 303.89 308.55 311.01 316.86 321.14 326.67 333.57 338.73 344.55 348.83 355.73 361.10 366.88 373.09 378.54 381.00 384.64 390.85 396.47 402.25" y="692.40" font-size="10.00" class="sc-loraregular" fill="#0000ff">https://arxiv.org/abs/2605.10865</text><text x="72.00" y="703.26" font-size="6.00" class="sc-loraregular sc-k">23</te <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型的渲染视图中全部四个相机位置。第二，我们更新了评分方式，使其除</text><text x="437.89" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Workplane</text><text x="496.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">外也接受</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">原始形状。在</text><text x="140.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">GPT-5.5</text><text x="185.23" y="98.23" font-size="11.00" class="sc-notoserifcjksc">等模型上，我们此前注意到，原始形状会因这种输出上的风格差异而报</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">错，尽管其几何形状在其他方面是等价的。这两项更改均已合并到</text><text x="393.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">GitHub</text><text x="434.02" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上的参考代码仓库</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="179.77" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="179.77" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">进行评估时，模型获得了一个容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">在已公布的</text><text x="129.89 133.90 138.48 141.26 147.61 154.45" y="211.01" font-size="11.00" class="sc-loraregular">17,900</text><text x="164.18" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="178.07" y="211.01" font-size="11.00" class="sc-loraregular sc-k">Vision2Code</text><text x="244.94" y="211.01" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="324.84 328.84 331.45 338.28 345.11" y="211.01" font-size="11.00" class="sc-loraregular">1,000</text><text x="354.84" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个文件组成的子集上评估模型；根据</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">以往经验，该子集的分数能在</text><text x="217.89" y="226.63" font-size="11.00" class="sc-loraregular sc-k">0.01</text><text x="240.82" y="226.63" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="276.71" y="226.63" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="294.64" y="226.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="305.64" y="226.63" font-size="11.00" class="sc-loraregular sc-k">voxel IoU</text><text x="353.07" y="226.63" font-size="11.00" class="sc-notoserifcjksc">）误差范围内反映完整集合上的分数。</text><text x="72.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">我们报告五次运行的平均体素</text><text x="217.89" y="242.25" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="238.72" y="242.25" font-size="11.00" class="sc-notoserifcjksc">分数。</text><text x="72.00" y="293.64" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="293.64" font-size="11.00" class="sc-loraregular sc-k">BenchCAD Vision2Code</text><text x="210.11" y="293.64" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="293.64" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="293.64" font-size="11.00" class="sc-notoserifcjksc">个文件子集上，</text><text x="331.01" y="293.64" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="414.41" y="293.64" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时取得了</text><text x="72.00" y="309.26" font-size="11.00" class="sc-loraregular sc-k">0.437</text><text x="101.15" y="309.26" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="137.04" y="309.26" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="157.87" y="309.26" font-size="11.00" class="sc-notoserifcjksc">分数，使用工具时得分为</text><text x="281.76" y="309.26" font-size="11.00" class="sc-loraregular sc-k">0.843</text><text x="309.39" y="309.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="320.39" y="309.26" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="397.08" y="309.26" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="465.98" y="309.26" font-size="11.00" class="sc-loraregular sc-k">0.376</text><text x="495.52" y="309.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00" y="324.88" font-size="11.00" class="sc-loraregular sc-k">0.675</text><text x="98.60" y="324.88" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="109.60" y="324.88" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="186.63" y="324.88" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="255.52" y="324.88" font-size="11.00" class="sc-loraregular sc-k">0.366</text><text x="286.62" y="324.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.51" y="324.88" font-size="11.00" class="sc-loraregular sc-k">0.821</text><text x="325.97" y="324.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="665.27" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="665.27" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.56 111.65 117.19 120.66 123.03 128.98 133.82 139.56 144.23 149.70 155.83 161.84 168.67 171.04 177.17 180.12 184.48 187.43 192.52 198.26 203.06 209.25 214.34 219.71" y="665.27" font-size="9.00" class="sc-lorabold">8.14.2.A] BenchCAD Vision2Code</text><text x="226.92" y="665.27" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.92" y="665.27" font-size="9.00" class="sc-loraregular sc-k">Claude</text><text x="303.25" y="665.27" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考和</text><text x="404.61" y="665.27" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="423.18" y="665.27" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下评估，分为</text><text x="72.00" y="676.97" font-size="9.00" class="sc-notoserifcjksc">使用工具和不使用工具两种情况。得分为五次运行的平均值，并显示</text><text x="344.37" y="676.97" font-size="9.00" class="sc-loraregular">95%</text><text x="364.67" y="676.97" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="409.67" y="676.97" font-size="9.00" class="sc-loraregular sc-k">GPT-5.6 Sol</text><text x="461.34" y="676.97" font-size="9.00" class="sc-notoserifcjksc">的分数取自</text><text x="508.71" y="676.97" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="72.00" y="688.67" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果，在完整的</text><text x="182.37" y="688.67" font-size="9.00" class="sc-loraregular sc-k">17,900</text><text x="210.42" y="688.67" font-size="9.00" class="sc-notoserifcjksc">个文件上评估。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.23 110.61 120.80 128.65 141.63 149.92 154.91 158.35 167.16 170.54 178.03 181.17" y="575.03" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.3 OSWorld 2.0</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular sc-k">24</text><text x="80.97 86.82 92.79 97.94 104.01 106.54 109.17 118.35 120.80 123.33 125.96 131.31 135.18 137.81 142.97 145.69 148.14 150.77 153.82 159.19 165.33 170.70 176.35 179.40 181.86 184.49 192.43 198.09 207.65 213.50 217.79 220.51 226.48 229.11 234.48 236.79 243.00 245.50 248.12 254.34 259.76 265.83 271.15 277.13 286.07 291.23 295.52 300.88 303.69 309.76 315.29 317.92 323.18 329.03 337.97 343.94 349.90 353.77 359.19 363.52 366.15 372.12 376.74 382.16 384.79 389.95 395.43 400.84 406.82 410.69 415.32 417.95 423.79 429.86 432.49 435.21 441.06 447.13 452.65 457.54 463.53 469.38 473.71 476.51 481.55 487.40" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00" y="82.61" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="110.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型在该评估上的表现随测试时计算量的增加而显著提升，尤其是当模型除自适应思考</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外，还配备了能够对中间输出进行视觉验证的工具时。事实上，在提供工具时，</text><text x="457.00" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="502.11" y="98.23" font-size="11.00" class="sc-notoserifcjksc">取得的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="96.89" y="113.85" font-size="11.00" class="sc-loraregular sc-k">IoU</text><text x="117.72" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分数接近其不使用工具时分数的两倍。</text><text x="72.00" y="514.38" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="514.38" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84" y="514.38" font-size="9.00" class="sc-lorabold sc-k">8.14.2.B] BenchCAD Vision2Code</text><text x="226.92" y="514.38" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.92" y="514.38" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考、不同推理强度档位下评估，分为使用工具</text><text x="72.00" y="526.08" font-size="9.00" class="sc-notoserifcjksc">和不使用工具两种情况。我们使用</text><text x="209.37" y="526.08" font-size="9.00" class="sc-loraregular sc-k">effort</text><text x="235.45" y="526.08" font-size="9.00" class="sc-notoserifcjksc">参数来调整所花费的测试时计算量。得分为每个推理强度档位下五次运行的</text><text x="72.00" y="537.78" font-size="9.00" class="sc-notoserifcjksc">平均值。图中显示</text><text x="146.37" y="537.78" font-size="9.00" class="sc-loraregular">95%</text><text x="166.67" y="537.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00" y="598.89" font-size="11.00" class="sc-loraregular sc-k">OSWorld 2.0</text><text x="136.38" y="595.22" font-size="6.60" class="sc-loraregular sc-k">24</text><text x="146.25" y="598.89" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="204.15" y="598.89" font-size="11.00" class="sc-loraregular">108</text><text x="224.06" y="598.89" font-size="11.00" class="sc-notoserifcjksc">个长程计算机使用（</text><text x="323.06" y="598.89" font-size="11.00" class="sc-loraregular sc-k">computer use</text><text x="393.75" y="598.89" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，智能体在</text><text x="72.00" y="614.51" font-size="11.00" class="sc-notoserifcjksc">其中通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="349.89" y="614.51" font-size="11.00" class="sc-loraregular sc-k">Ubuntu</text><text x="391.43" y="614.51" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每个任务依据一组加</text><text x="72.00" y="630.13" font-size="11.00" class="sc-notoserifcjksc">权检查点评分，我们报告两项指标：部分得分（按任务计算的各检查点得分均值）和严格通过率</text><text x="72.00" y="645.75" font-size="11.00" class="sc-notoserifcjksc">（所有检查点均满足的任务所占比例），二者均为五次独立运行平均后的</text><text x="426.89" y="645.75" font-size="11.00" class="sc-loraregular sc-k">Pass@1</text><text x="462.10" y="645.75" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="232.28" y="707.20" width="160.69" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p189.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 189 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular sc-k">189</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们采用该基准测试的默认设置，即</text><text x="250.89" y="82.61" font-size="11.00" class="sc-loraregular">1080p</text><text x="284.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分辨率、每个任务最多</text><text x="397.09" y="82.61" font-size="11.00" class="sc-loraregular">500</text><text x="419.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个操作步数，并使用最高</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">推理强度。对于需要评分模型的任务，我们使用</text><text x="305.89" y="98.23" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="388.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们评估的是作者于</text><text x="173.89" y="147.38" font-size="11.00" class="sc-loraregular sc-k">2026</text><text x="201.71" y="147.38" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="215.61" y="147.38" font-size="11.00" class="sc-loraregular">8</text><text x="224.68" y="147.38" font-size="11.00" class="sc-notoserifcjksc">月发布的任务版本，包含其后续的任务修复，以及我们向作者报</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">告的针对任务设置和评分脚本的修复。</text><text x="259.00" y="163.00" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="342.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="411.30" y="163.00" font-size="11.00" class="sc-loraregular sc-k">77.9%</text><text x="439.59" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，严格通过率为</text><text x="72.00" y="178.62" font-size="11.00" class="sc-loraregular sc-k">41.7%</text><text x="98.96" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。在相同条件下重新评估后，</text><text x="241.96" y="178.62" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="318.99" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="387.89" y="178.62" font-size="11.00" class="sc-loraregular">75.4%</text><text x="417.19" y="178.62" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="497.08" y="178.62" font-size="11.00" class="sc-loraregular sc-k">39.6%</text><text x="527.92" y="178.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00" y="194.24" font-size="11.00" class="sc-loraregular sc-k">Claude Fable 5</text><text x="148.69" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="217.59" y="194.24" font-size="11.00" class="sc-loraregular">72.9%</text><text x="247.20" y="194.24" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="327.09" y="194.24" font-size="11.00" class="sc-loraregular">36.1%</text><text x="355.86" y="194.24" font-size="11.00" class="sc-notoserifcjksc">。由于任务文件不同，这些结果取代</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89" y="209.86" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 5</text><text x="162.93" y="209.86" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="195.93" y="209.86" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="220.82" y="209.86" font-size="11.00" class="sc-loraregular sc-k">OSWorld 2.0</text><text x="288.10" y="209.86" font-size="11.00" class="sc-notoserifcjksc">数据，且不能与该基准测试早期版本上报告的结果</text><text x="72.00" y="225.48" font-size="11.00" class="sc-notoserifcjksc">直接比较。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.80 111.90 117.43 120.91 123.27 130.19 135.50 144.04 149.13 153.37 156.18 161.54 163.91 168.70 170.67" y="556.05" font-size="9.00" class="sc-lorabold">8.14.3.A] OSWorld 2.0</text><text x="178.76" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="196.76" y="556.05" font-size="9.00" class="sc-notoserifcjksc">，按模型列出。</text><text x="259.76" y="556.05" font-size="9.00" class="sc-loraregular sc-k">Claude Fable 5.1</text><text x="328.00" y="556.05" font-size="9.00" class="sc-notoserifcjksc">在启用生产环境安全防护措施的情况下进行评估。在</text><text x="72.00" y="567.75" font-size="9.00" class="sc-notoserifcjksc">这些安全防护措施介入的任务上，</text><text x="207.00" y="567.75" font-size="9.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="243.91" y="567.75" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="255.28" y="567.75" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="286.70" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="298.06" y="567.75" font-size="9.00" class="sc-loraregular sc-k">OSWorld</text><text x="338.24" y="567.75" font-size="9.00" class="sc-notoserifcjksc">上记为零分，</text><text x="392.24" y="567.75" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="423.66" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="435.02" y="567.75" font-size="9.00" class="sc-loraregular sc-k">AutomationBench</text><text x="512.58" y="567.75" font-size="9.00" class="sc-notoserifcjksc">上记为</text><text x="72.00" y="579.45" font-size="9.00" class="sc-notoserifcjksc">零分。在安全防护措施的所有其他介入情形中，网络安全任务由</text><text x="326.37" y="579.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 4.8</text><text x="396.64" y="579.45" font-size="9.00" class="sc-notoserifcjksc">完成，生物学任务由</text><text x="480.01" y="579.45" font-size="9.00" class="sc-loraregular sc-k">Claude Opus 5</text><text x="72.00" y="591.15" font-size="9.00" class="sc-notoserifcjksc">完成。这很可能降低了</text><text x="164.37" y="591.15" font-size="9.00" class="sc-loraregular sc-k">Fable 5.1</text><text x="201.28" y="591.15" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="212.64" y="591.15" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="244.06" y="591.15" font-size="9.00" class="sc-notoserifcjksc">在这些基准测试上的表现。得分基于基准测试作者</text><text x="444.43" y="591.15" font-size="9.00" class="sc-loraregular sc-k">2026</text><text x="467.19" y="591.15" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="478.56" y="591.15" font-size="9.00" class="sc-loraregular">8</text><text x="485.98" y="591.15" font-size="9.00" class="sc-notoserifcjksc">月发布的任务</text><text x="72.00" y="602.85" font-size="9.00" class="sc-notoserifcjksc">版本；</text><text x="99.00" y="602.85" font-size="9.00" class="sc-loraregular sc-k">Fable 5</text><text x="130.42" y="602.85" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="141.79" y="602.85" font-size="9.00" class="sc-loraregular">Opus 5</text><text x="173.48" y="602.85" font-size="9.00" class="sc-notoserifcjksc">在相同条件下重新运行。</text><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="201.06" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="85.89" y="201.06" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="121.29" y="201.06" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="124.18" y="201.06" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/b514064af1408018e64b1ad24e7d5e75850b4ffd/Claude%20Opus%205%20System%20Card.pdf" rel="noopener"><rect x="151.15" y=
