85</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">178</text><text x="72.00" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 108.29 110.39 115.92 119.39 121.76 128.80 134.36 142.64 147.36 153.10 156.01 159.72 164.68 166.41 170.77 173.14 178.58 183.29 187.66 191.38 193.74 199.36 204.29 209.01" y="367.93" font-size="9.00" class="sc-lorabold">8.12.1.B] Humanity’s Last Exam</text><text x="217.29" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">（</text><text x="226.29" y="367.93" font-size="9.00" class="sc-lorabold">HLE</text><text x="244.60" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">）</text><text x="253.60" y="367.93" font-size="9.00" class="sc-lorabold">[</text><text x="257.08" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">不使用工具</text><text x="302.08" y="367.93" font-size="9.00" class="sc-lorabold">]</text><text x="307.92" y="367.93" font-size="9.00" class="sc-notoserifcjkscbold">测试时计算扩展</text><text x="370.92" y="367.93" font-size="9.00" class="sc-notoserifcjksc">。推理强度从</text><text x="427.28" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">low</text><text x="445.85" y="367.93" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="457.22" y="367.93" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="475.79" y="367.93" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="487.16" y="367.93" font-size="9.00" class="sc-loraregular">HLE</text><text x="507.34" y="367.93" font-size="9.00" class="sc-notoserifcjksc">上的准</text><text x="72.00" y="379.63" font-size="9.00" class="sc-notoserifcjksc">确率，与每任务平均计费成本（对数刻度）的关系。成本按缓存命中估算计费。</text><text x="72.00 80.19 86.10 92.06 98.63 101.52 108.36 114.32 119.41 125.35 131.03 135.71 141.56 148.15 151.05 157.93 163.73 169.58 176.15 180.83 186.51 192.31 197.51 200.28 203.18 210.86 217.30 227.13 233.70 236.69 242.58 246.83 252.80 259.47 265.44 270.53 275.62 278.39 281.29 286.96 293.64 300.22 303.11 311.84 318.25 321.12 327.02 332.82 337.08 340.17 345.72 348.99 353.27" y="452.86" font-size="11.00" class="sc-loraregular">Deep Research Accuracy, Completeness, and Objectivity</text><text x="359.10" y="452.86" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="370.10 378.19 385.63 392.46 400.15" y="452.86" font-size="11.00" class="sc-loraregular">DRACO</text><text x="408.89" y="449.19" font-size="6.60" class="sc-loraregular">18</text><text x="415.00" y="452.86" font-size="11.00" class="sc-notoserifcjksc">）是</text><text x="439.89 446.45 452.41 457.17 463.74 466.73 472.64 478.47 481.73 486.01" y="452.86" font-size="11.00" class="sc-loraregular">Perplexity</text><text x="494.71" y="452.86" font-size="11.00" class="sc-notoserifcjksc">推出的深</text><text x="72.00" y="468.48" font-size="11.00" class="sc-notoserifcjksc">度研究基准，旨在评估模型在应对真实用户会提出的复杂研究问题时的表现。</text><text x="446.00 454.09 461.53 468.36 476.05" y="468.48" font-size="11.00" class="sc-loraregular">DRACO</text><text x="487.68" y="468.48" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="501.57" y="468.48" font-size="11.00" class="sc-loraregular">100</text><text x="522.13" y="468.48" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="484.10" font-size="11.00" class="sc-notoserifcjksc">精选任务组成，这些任务源自多个领域的用户查询。题目使用专家撰写的评分细则进行评分，评</text><text x="72.00" y="499.72" font-size="11.00" class="sc-notoserifcjksc">分细则涵盖四个类别：事实准确性、分析的广度与深度、呈现质量以及引用质量。</text><text x="72.00" y="566.42" font-size="11.00" class="sc-notoserifcjksc">我们在使用网络搜索、网页抓取、程序化工具调用、代码执行以及</text><text x="393.89" y="566.42" font-size="11.00" class="sc-loraregular">100</text><text x="414.45" y="566.42" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="428.35 432.60 439.04 444.87 450.83" y="566.42" font-size="11.00" class="sc-loraregular">token</text><text x="460.40" y="566.42" font-size="11.00" class="sc-notoserifcjksc">上限的条件下评</text><text x="72.00" y="582.04" font-size="11.00" class="sc-notoserifcjksc">估了</text><text x="96.89 104.58 107.57 113.18 119.75 126.33" y="582.04" font-size="11.00" class="sc-loraregular">Claude</text><text x="135.18" y="582.04" font-size="11.00" class="sc-notoserifcjksc">模型。</text><text x="72.00" y="615.00" font-size="11.00" class="sc-notoserifcjkscbold">评分方法</text><text x="72.00 80.08 87.53 94.36 102.05" y="630.62" font-size="11.00" class="sc-loraregular">DRACO</text><text x="113.68" y="630.62" font-size="11.00" class="sc-notoserifcjksc">原论文使用</text><text x="171.57 179.94 185.90 195.74 198.83 205.51 208.60 211.49 217.62 220.51 227.18 231.86" y="630.62" font-size="11.00" class="sc-loraregular">Gemini 3 Pro</text><text x="241.19" y="630.62" font-size="11.00" class="sc-notoserifcjksc">作为主要评判模型，而该模型现已不再可用。在我们的评估</text><text x="72.00" y="646.24" font-size="11.00" class="sc-notoserifcjksc">中，我们使用</text><text x="140.89 148.58 151.57 157.18 163.75 170.33 176.29 179.18 187.92 194.49 201.05 206.15 209.04 215.00 217.60" y="646.24" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="226.85" y="646.24" font-size="11.00" class="sc-notoserifcjksc">依据每个任务的评分细则对回答进行评分，采用相同的二元</text><text x="72.00 82.10 88.94 95.20 102.79 111.06 119.44 129.54 136.38" y="661.86" font-size="11.00" class="sc-loraregular">MET/UNMET</text><text x="146.32" y="661.86" font-size="11.00" class="sc-notoserifcjksc">判定，并按照论文第</text><text x="248.21" y="661.86" font-size="11.00" class="sc-loraregular">4.2</text><text x="265.68" y="661.86" font-size="11.00" class="sc-notoserifcjksc">节中的公式汇总为归一化</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="298.43" y="707.20" width="155.18" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p179.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 179 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">179</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分数。我们遵循论文的评估方案，对每个回答进行五次独立的评分运行并报告平均值。我们的评</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">判提示词取自论文的</text><text x="171.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">附录</text><text x="195.89" y="98.23" font-size="11.00" class="sc-loraregular" fill="#0000ff">C.5</text><text x="212.28" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。论文附录</text><text x="270.18" y="98.23" font-size="11.00" class="sc-loraregular">A</text><text x="279.96" y="98.23" font-size="11.00" class="sc-notoserifcjksc">表明，评判模型的选择可能使绝对分数偏移</text><text x="491.85" y="98.23" font-size="11.00" class="sc-loraregular">10–25</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分，但系统排序保持不变，因此我们的分数无法与论文的主要公布数字直接比较。</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">除更换评判模型外，与原论文唯一的其他区别在于：我们指示模型将其完整的最终报告写入其执</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">行环境中的一个文件，并且只对该文件的内容进行评分，而不是对完整的智能体对话记录评分；</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">这样可以将交付物与中间工具输出隔离开来。</text><text x="72.00" y="539.85" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="539.85" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.54 104.63 109.43 111.53 117.06 120.54 122.90 129.61 135.78 141.62 147.81" y="539.85" font-size="9.00" class="sc-lorabold">8.12.2.A] DRACO</text><text x="157.10" y="539.85" font-size="9.00" class="sc-notoserifcjksc">在不同推理强度档位下的分数与每任务平均成本。在</text><text x="366.46" y="539.85" font-size="9.00" class="sc-loraregular">98</text><text x="379.09" y="539.85" font-size="9.00" class="sc-notoserifcjksc">万</text><text x="390.46 393.94 399.20 403.97 408.85" y="539.85" font-size="9.00" class="sc-loraregular">token</text><text x="416.68" y="539.85" font-size="9.00" class="sc-notoserifcjksc">预算下，推理强度从</text><text x="500.05 502.50 507.67" y="539.85" font-size="9.00" class="sc-loraregular">low</text><text x="517.25" y="539.85" font-size="9.00" class="sc-notoserifcjksc">提高</text><text x="72.00" y="551.55" font-size="9.00" class="sc-notoserifcjksc">到</text><text x="83.37" y="551.55" font-size="9.00" class="sc-loraregular">max</text><text x="103.19" y="551.55" font-size="9.00" class="sc-notoserifcjksc">时</text><text x="114.56 121.18 127.27 132.86 139.15" y="551.55" font-size="9.00" class="sc-loraregular">DRACO</text><text x="148.66" y="551.55" font-size="9.00" class="sc-notoserifcjksc">上的归一化分数，与每任务平均计费成本（对数刻度）的关系。成本按缓存命中估算计费。</text><text x="72.00" y="599.73" font-size="14.00" class="sc-poppinssemibold">8.13</text><text x="101.43" y="599.73" font-size="14.00" class="sc-notosanscjkscbold">多智能体</text><text x="72.00" y="626.30" font-size="11.00" class="sc-notoserifcjksc">我们评估了将单智能体替换为多智能体配置时</text><text x="294.89 302.58 305.57 311.18 317.75 324.33 330.29 333.18 338.77 344.45 350.85 353.84 359.80 362.70 368.69 371.40" y="626.30" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="378.30" y="626.30" font-size="11.00" class="sc-notoserifcjksc">的表现。下文中，我们重点介绍</text><text x="72.00" y="641.92" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.56 97.25 103.68 109.76 114.45 120.12 129.89 136.74 142.70 149.37 155.23" y="641.92" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="164.71" y="641.92" font-size="11.00" class="sc-notoserifcjksc">上的结果（第</text><text x="233.60" y="641.92" font-size="11.00" class="sc-loraregular">8.13.1</text><text x="262.22" y="641.92" font-size="11.00" class="sc-notoserifcjksc">节），并描述我们测试的运行框架（第</text><text x="452.12" y="641.92" font-size="11.00" class="sc-loraregular">8.13.2</text><text x="482.64" y="641.92" font-size="11.00" class="sc-notoserifcjksc">节）以及测</text><text x="72.00" y="657.54" font-size="11.00" class="sc-notoserifcjksc">量方法（第</text><text x="129.89" y="657.54" font-size="11.00" class="sc-loraregular">8.13.3</text><text x="160.64" y="657.54" font-size="11.00" class="sc-notoserifcjksc">节）。</text><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="171.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="0.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="182.00" y="89.43" width="11.00" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="193.00" y="89.43" width="2.89" height="11.00" fill="transparent"/></a><a href="https://arxiv.org/abs/2602.11685" rel="noopener"><rect x="195.89" y="89.43" width="16.39" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p180.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 180 页"><text x="72.00 80.29 83.42 87.97 95.69 98.82 103.37 106.75 118.21 126.65 130.08 134.91 138.34 145.95 155.01 163.82 171.84 180.27 185.10 188.48 196.22 201.21 209.50 218.31 223.30 232.11 245.61 253.80 261.82 270.25 278.05" y="86.95" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.13.1 Multi-Agent ProgramBench</text><text x="72.00" y="700.23" font-size="6.00" class="sc-loraregular">19</text><text x="80.28 86.13 91.29 97.35 102.88 105.41 108.04 111.56 114.02 116.55 119.18 124.52 128.39 131.02 136.18 138.90 141.36 143.99 147.03 152.40 158.54 163.91 169.57 172.61 175.07 177.70 183.76 188.02 193.87 199.39 203.65 208.81 217.69 223.90 229.32 235.39 240.71 246.69 249.19 251.82 258.81 263.97 270.04 272.66 275.38 280.54 286.61 292.14 298.10 303.26 308.74 314.16 316.79 325.72 331.57 337.55 342.97 345.69 350.31 352.94 357.20 362.62 368.44 374.40 377.21 379.93 385.91 388.54 394.51 398.76 404.61 410.14 414.40 419.56 428.49 433.12 435.75 439.13 443.39 449.23 458.17 460.80 465.43 470.75 475.00 480.09 483.96 489.28 495.08" y="704.45" font-size="10.00" class="sc-loraregular">Yang, J., et al. (2026). ProgramBench: Can language models rebuild programs from scratch?</text><text x="72.00 77.16 80.87 87.35 90.16 95.21 97.71 103.08 108.86 115.06 120.51 122.82 129.03 134.60 140.04 145.46 151.24" y="717.26" font-size="10.00" class="sc-loraregular">arXiv:2605.03546.</text><text x="156.33 162.22 166.19 170.06 176.03 180.66 183.16 186.84 193.30 198.46 202.79 208.08 210.89 215.55 218.01 223.86 228.14 233.66 240.12 245.28 251.10 255.38 262.27 267.64 273.42 279.63 285.07 287.38 293.59 299.16 304.61 310.02" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2605.03546</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">180</text><text x="72.00 78.67 83.35 89.79 95.87 100.56 106.23 116.00 122.84 128.80 135.48 141.33" y="110.83" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="147.92" y="107.16" font-size="6.60" class="sc-loraregular">19</text><text x="157.03" y="110.83" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="214.93" y="110.83" font-size="11.00" class="sc-loraregular">200</text><text x="237.39" y="110.83" font-size="11.00" class="sc-notoserifcjksc">个程序重建任务的智能体基准测试。智能体仅获得由某个开源</text><text x="72.00" y="126.45" font-size="11.00" class="sc-notoserifcjksc">项目编译而成的二进制文件以及该项目的文档，必须在不使用互联网或反编译工具的情况下重建</text><text x="72.00" y="142.07" font-size="11.00" class="sc-notoserifcjksc">一个能复现原程序行为的代码库。如第</text><text x="261.89" y="142.07" font-size="11.00" class="sc-loraregular">8.11.1</text><text x="288.39" y="142.07" font-size="11.00" class="sc-notoserifcjksc">节所述，我们排除了参考二进制文件在隐藏测试集</text><text x="72.00" y="157.69" font-size="11.00" class="sc-notoserifcjksc">上得分低于</text><text x="129.89 136.55 139.25" y="157.69" font-size="11.00" class="sc-loraregular">0.9</text><text x="148.51" y="157.69" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="162.40" y="157.69" font-size="11.00" class="sc-loraregular">34</text><text x="177.38" y="157.69" font-size="11.00" class="sc-notoserifcjksc">个任务，剩余</text><text x="246.27" y="157.69" font-size="11.00" class="sc-loraregular">166</text><text x="265.89" y="157.69" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="276.89" y="157.69" font-size="11.00" class="sc-loraregular">“</text><text x="281.29" y="157.69" font-size="11.00" class="sc-notoserifcjksc">黄金</text><text x="303.29" y="157.69" font-size="11.00" class="sc-loraregular">”</text><text x="307.13" y="157.69" font-size="11.00" class="sc-notoserifcjksc">任务。单智能体结果已在第</text><text x="442.02" y="157.69" font-size="11.00" class="sc-loraregular">8.11</text><text x="461.81" y="157.69" font-size="11.00" class="sc-notoserifcjksc">节中给出；本节</text><text x="72.00" y="173.31" font-size="11.00" class="sc-notoserifcjksc">给出多智能体</text><text x="140.89 147.56 152.25 158.68 164.76 169.45 175.13 184.89 191.74 197.70 204.37 210.23" y="173.31" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="219.71" y="173.31" font-size="11.00" class="sc-notoserifcjksc">结果。</text><text x="72.00" y="240.56" font-size="11.00" class="sc-notoserifcjksc">我们将两种多智能体运行框架配置与单智能体基线进行了比较：固定的五智能体团队，以及动态</text><text x="72.00" y="256.18" font-size="11.00" class="sc-notoserifcjksc">派生的异步子智能体（详见第</text><text x="217.89" y="256.18" font-size="11.00" class="sc-loraregular">8.13.2</text><text x="248.42" y="256.18" font-size="11.00" class="sc-notoserifcjksc">节）。我们在一系列中间快照处进行评分，并利用由此得到</text><text x="72.00" y="271.80" font-size="11.00" class="sc-notoserifcjksc">的每个任务在得分、延迟和</text><text x="206.89 211.15 217.59 223.42 229.38" y="271.80" font-size="11.00" class="sc-loraregular">token</text><text x="238.95" y="271.80" font-size="11.00" class="sc-notoserifcjksc">方面的轨迹，构建图</text><text x="340.84" y="271.80" font-size="11.00" class="sc-loraregular">8.13.1.A</text><text x="379.05" y="271.80" font-size="11.00" class="sc-notoserifcjksc">和图</text><text x="403.95" y="271.80" font-size="11.00" class="sc-loraregular">8.13.1.B</text><text x="442.12" y="271.80" font-size="11.00" class="sc-notoserifcjksc">中的累积曲线。</text><a href="https://arxiv.org/abs/2605.03546" rel="noopener"><rect x="156.33" y="707.20" width="159.48" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p181.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 181 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">181</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.16" y="414.42" font-size="9.00" class="sc-lorabold">8.13.1.A]</text><text x="122.00" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.37" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.74" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.74" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.55" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.55 193.25 199.00 203.25 208.34 213.35 217.63 222.34 230.57 236.52 241.36 247.10 251.77" y="414.42" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="259.72" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与延迟。</text><text x="349.72" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一点表示：若每个问题都在该秒数处停</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">止，模型平均能通过的隐藏测试比例。阴影区域表示</text><text x="281.37" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="301.67" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分差异计算得出。随着问题完</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍在贡献数据的问题就越少。</text><text x="72.00" y="493.23" font-size="11.00" class="sc-notoserifcjksc">在完整的黄金集上，与单智能体相比，五智能体团队和异步子智能体在相同得分下都表现出延迟</text><text x="72.00" y="508.86" font-size="11.00" class="sc-notoserifcjksc">上的改善。具体而言，五智能体团队达到相同的</text><text x="305.89 312.55 315.14" y="508.86" font-size="11.00" class="sc-loraregular">0.6</text><text x="324.40" y="508.86" font-size="11.00" class="sc-notoserifcjksc">分时，实现了相对单智能体</text><text x="459.29" y="508.86" font-size="11.00" class="sc-loraregular">2x</text><text x="473.92" y="508.86" font-size="11.00" class="sc-notoserifcjksc">的延迟改善。</text><text x="72.00" y="524.47" font-size="11.00" class="sc-notoserifcjksc">异步子智能体的速度相较单智能体有所提升，但幅度小于五智能体团队，之后它取得领先，获得</text><text x="72.00" y="540.09" font-size="11.00" class="sc-notoserifcjksc">了最高的最终得分。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p182.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 182 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">182</text><text x="72.00" y="414.42" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.78 104.88 108.53 110.63 116.16" y="414.42" font-size="9.00" class="sc-lorabold">8.13.1.B]</text><text x="122.00" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">全部</text><text x="142.37" y="414.42" font-size="9.00" class="sc-lorabold">166</text><text x="158.74" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">个</text><text x="167.74" y="414.42" font-size="9.00" class="sc-lorabold">“</text><text x="171.55" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">黄金</text><text x="189.55 193.25 199.00 203.25 208.34 213.35 217.63 222.34 230.57 236.52 241.36 247.10 251.77" y="414.42" font-size="9.00" class="sc-lorabold">”ProgramBench</text><text x="259.72" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">任务上的得分与</text><text x="325.09 328.81 333.86 338.98 343.83" y="414.42" font-size="9.00" class="sc-lorabold">token</text><text x="349.57" y="414.42" font-size="9.00" class="sc-notoserifcjkscbold">。</text><text x="358.57" y="414.42" font-size="9.00" class="sc-notoserifcjksc">曲线上的一点表示：若每个问题都在该</text><text x="513.94 517.42 522.68 527.45 532.33" y="414.42" font-size="9.00" class="sc-loraregular">token</text><text x="72.00" y="426.12" font-size="9.00" class="sc-notoserifcjksc">用量处停止，模型平均能通过的隐藏测试比例。阴影区域表示</text><text x="317.37" y="426.12" font-size="9.00" class="sc-loraregular">95%</text><text x="337.67" y="426.12" font-size="9.00" class="sc-notoserifcjksc">置信区间，根据各任务间的得分差异计算得出。随</text><text x="72.00" y="437.83" font-size="9.00" class="sc-notoserifcjksc">着问题完成运行，阴影带逐渐变淡：阴影带越淡，在曲线该点处仍在贡献数据的问题就越少。</text><text x="72.00" y="493.23" font-size="11.00" class="sc-notoserifcjksc">图</text><text x="85.89" y="493.23" font-size="11.00" class="sc-loraregular">8.13.1.B</text><text x="124.06" y="493.23" font-size="11.00" class="sc-notoserifcjksc">进一步展示了多智能体运行框架在延迟与成本之间的权衡：当延迟是关注点时，五智</text><text x="72.00" y="508.86" font-size="11.00" class="sc-notoserifcjksc">能体团队和异步子智能体可以通过在多个智能体之间分配工作，有效利用额外的</text><text x="459.89 464.15 470.58 476.42 482.38" y="508.86" font-size="11.00" class="sc-loraregular">token</text><text x="491.95" y="508.86" font-size="11.00" class="sc-notoserifcjksc">预算，从</text><text x="72.00" y="524.47" font-size="11.00" class="sc-notoserifcjksc">而以更高的成本更快地达到给定分数。</text><text x="72.00" y="572.52" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.2</text><text x="110.17" y="572.52" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多智能体运行框架</text><text x="72.00" y="600.42" font-size="11.00" class="sc-notoserifcjkscbold">五智能体团队</text><text x="138.00" y="600.42" font-size="11.00" class="sc-notoserifcjksc">。由五个对等智能体组成的团队同时处理任务。所有智能体拥有相同的工具，且都</text><text x="72.00" y="616.04" font-size="11.00" class="sc-notoserifcjksc">能看到完整的任务描述。除任务工具外，每个智能体还有两个消息工具：</text><text x="424.00 430.24 436.20 442.88 449.45 452.35 462.37 468.33 473.42 478.52 484.19 490.22" y="616.04" font-size="11.00" class="sc-loraregular">Send Message</text><text x="496.18" y="616.04" font-size="11.00" class="sc-notoserifcjksc">，用于向</text><text x="72.00" y="631.66" font-size="11.00" class="sc-notoserifcjksc">一个或多个队友发送消息（插入在接收方下一个工具结果之后）；以及</text><text x="415.89 426.41 432.09 435.35 439.61 442.50 446.17 452.60 457.36 460.26 470.28 476.24 481.33 486.42 492.10 498.13" y="631.66" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="504.09" y="631.66" font-size="11.00" class="sc-notoserifcjksc">，它会</text><text x="72.00" y="647.28" font-size="11.00" class="sc-notoserifcjksc">阻塞采样，直到收到传入消息。每个智能体在其各自的任务代码仓库检出副本中工作，并可通过</text><text x="72.00 80.37 83.64" y="662.90" font-size="11.00" class="sc-loraregular">Git</text><text x="90.79" y="662.90" font-size="11.00" class="sc-notoserifcjksc">与其他智能体共享代码。该运行框架旨在模拟多个智能体协作完成共享任务的真实场景，并</text><text x="72.00" y="678.52" font-size="11.00" class="sc-notoserifcjksc">通过让对等智能体并行工作来降低延迟。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p183.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 183 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">183</text><text x="72.00" y="98.80" font-size="11.00" class="sc-notoserifcjkscbold">异步子智能体</text><text x="138.00" y="98.80" font-size="11.00" class="sc-notoserifcjksc">。该运行框架初始化时包含一个主智能体，它可以随时派生异步、长期存在的子智</text><text x="72.00" y="114.42" font-size="11.00" class="sc-notoserifcjksc">能体，同时保留对任务工具的直接访问。派生工具会立即返回一条确认信息，而不是等待子智能</text><text x="72.00" y="145.66" font-size="11.00" class="sc-notoserifcjksc">任何其他智能体或主智能体发送消息。子智能体的最终回复会以消息形式传递给主智能体；此</text><text x="72.00" y="161.28" font-size="11.00" class="sc-notoserifcjksc">后，该子智能体处于空闲状态，直到主智能体用新指令将其唤醒。子智能体可以使用任务工具以</text><text x="72.00" y="176.90" font-size="11.00" class="sc-notoserifcjksc">及与五智能体团队中相同的通信工具（即</text><text x="272.89 279.13 285.09 291.77 298.35 301.24 311.26 317.22 322.32 327.41 333.09 339.11" y="176.90" font-size="11.00" class="sc-loraregular">Send Message</text><text x="347.97" y="176.90" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="361.86 372.38 378.05 381.32 385.58 388.47 392.13 398.57 403.33 406.22 416.25 422.21 427.30 432.39 438.07 444.10" y="176.90" font-size="11.00" class="sc-loraregular">Wait for Message</text><text x="450.06" y="176.90" font-size="11.00" class="sc-notoserifcjksc">）；主智能体还拥</text><text x="72.00" y="208.14" font-size="11.00" class="sc-notoserifcjksc">止）的工具。主智能体可派生的子智能体数量没有上限。</text><text x="72.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">这两种运行框架中的每个智能体都可以使用</text><text x="283.89" y="293.11" font-size="11.00" class="sc-loraregular">bash</text><text x="310.55" y="293.11" font-size="11.00" class="sc-notoserifcjksc">工具，且限额为</text><text x="390.44" y="293.11" font-size="11.00" class="sc-loraregular">100</text><text x="411.00" y="293.11" font-size="11.00" class="sc-notoserifcjksc">万</text><text x="424.89 429.15 435.58 441.41 447.38" y="293.11" font-size="11.00" class="sc-loraregular">token</text><text x="454.05" y="293.11" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="323.84" font-size="13.00" class="sc-poppinssemibold" fill="#666666">8.13.3</text><text x="110.49" y="323.84" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">评估方法</text><text x="72.00" y="351.72" font-size="11.00" class="sc-notoserifcjksc">我们重点比较单智能体与多智能体运行框架，包括得分、延迟、</text><text x="380.00 384.26 390.69 396.52 402.48" y="351.72" font-size="11.00" class="sc-loraregular">token</text><text x="412.05" y="351.72" font-size="11.00" class="sc-notoserifcjksc">用量和成本。</text><text x="478.05 482.31 488.75 494.58 500.54" y="351.72" font-size="11.00" class="sc-loraregular">token</text><text x="510.11" y="351.72" font-size="11.00" class="sc-notoserifcjksc">用量</text><text x="72.00" y="367.34" font-size="11.00" class="sc-notoserifcjksc">按一个任务中所有智能体消耗的</text><text x="228.89 233.15 239.59 245.42 251.38" y="367.34" font-size="11.00" class="sc-loraregular">token</text><text x="260.95" y="367.34" font-size="11.00" class="sc-notoserifcjksc">总数计算。成本根据</text><text x="362.84 367.10 373.53 379.36 385.32" y="367.34" font-size="11.00" class="sc-loraregular">token</text><text x="394.89" y="367.34" font-size="11.00" class="sc-notoserifcjksc">用量和按</text><text x="441.79 446.04 452.48 458.31 464.27" y="367.34" font-size="11.00" class="sc-loraregular">token</text><text x="473.84" y="367.34" font-size="11.00" class="sc-notoserifcjksc">计费的</text><text x="509.73 516.62 523.23" y="367.34" font-size="11.00" class="sc-loraregular">API</text><text x="529.81" y="367.34" font-size="11.00" class="sc-notoserifcjksc">价</text><text x="72.00" y="382.96" font-size="11.00" class="sc-notoserifcjksc">格计算，并假设缓存完全命中。延迟以推导的单任务延迟报告，而非原始的实际耗时。我们计算</text><text x="72.00" y="398.58" font-size="11.00" class="sc-notoserifcjksc">每条智能体轨迹的延迟的方法是：将该智能体的输入和输出</text><text x="360.89 365.15 371.58 377.42 383.38" y="398.58" font-size="11.00" class="sc-loraregular">token</text><text x="392.95" y="398.58" font-size="11.00" class="sc-notoserifcjksc">数分别除以固定的参考预填充</text><text x="72.00" y="414.20" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="113.05" y="414.20" font-size="11.00" class="sc-notoserifcjksc">）与解码速率，再加上其实测的工具执行时间。为计入智能体的空闲时间，我们强制每</text><text x="72.00" y="429.82" font-size="11.00" class="sc-notoserifcjksc">个智能体继承其自身时钟与其交互过的任何智能体（通过消息或派生）的时钟中较长的那个。我</text><text x="72.00" y="445.44" font-size="11.00" class="sc-notoserifcjksc">们将最长的智能体轨迹报告为该运行框架的延迟，以代表完成的全部编程工作。使用推导延迟可</text><text x="72.00" y="461.06" font-size="11.00" class="sc-notoserifcjksc">以将运行框架本身的延迟（例如它需要多少串行的模型工作和工具时间）与服务端波动（例如批</text><text x="72.00" y="476.68" font-size="11.00" class="sc-notoserifcjksc">处理、排队、硬件）隔离开来，从而使不同运行框架能够跨时间在同等基础上进行比较。</text><text x="72.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">这些结果是在一个启用了安全分类器的内部</text><text x="283.89 289.48 295.16 301.56 304.55 310.51 313.41 319.40 322.11" y="578.41" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="329.00" y="578.41" font-size="11.00" class="sc-notoserifcjksc">端点上收集的，并以</text><text x="430.90" y="578.41" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="469.64" y="578.41" font-size="11.00" class="sc-notoserifcjksc">作为唯一的拒</text><text x="72.00" y="594.03" font-size="11.00" class="sc-notoserifcjksc">绝回退（</text><text x="116.00" y="594.03" font-size="11.00" class="sc-loraregular">fallback</text><text x="155.21" y="594.03" font-size="11.00" class="sc-notoserifcjksc">）模型。</text><text x="199.21" y="594.03" font-size="11.00" class="sc-loraregular">72%</text><text x="222.66" y="594.03" font-size="11.00" class="sc-notoserifcjksc">的回合中至少有一个轮次由回退模型完成，总计影响不到</text><text x="500.55" y="594.03" font-size="11.00" class="sc-loraregular">1%</text><text x="517.02" y="594.03" font-size="11.00" class="sc-notoserifcjksc">的轮</text><text x="72.00" y="609.65" font-size="11.00" class="sc-notoserifcjksc">次。因此，</text><text x="127.00 133.67 138.35 144.79 150.87 155.56 161.23 171.00 177.84 183.80 190.48 196.33" y="609.65" font-size="11.00" class="sc-loraregular">ProgramBench</text><text x="205.82" y="609.65" font-size="11.00" class="sc-notoserifcjksc">分数最好被理解为不同运行框架之间的相对比较，而不是性能的绝对</text><text x="72.00" y="625.27" font-size="11.00" class="sc-notoserifcjksc">衡量。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p184.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 184 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 104.06 107.44 117.49 125.92 134.73 139.72 144.56 152.85 161.66 166.65 175.46 184.27 192.71" y="125.11" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.1 Chartography</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">184</text><text x="72.00" y="84.20" font-size="14.00" class="sc-poppinssemibold">8.14</text><text x="102.30" y="84.20" font-size="14.00" class="sc-notosanscjkscbold">多模态</text><text x="72.00 79.69 86.28 91.95 96.79 101.05 107.49 113.57 118.26 123.93 130.50 137.01" y="148.97" font-size="11.00" class="sc-loraregular">Chartography</text><text x="142.82" y="145.30" font-size="6.60" class="sc-loraregular">20</text><text x="153.35" y="148.97" font-size="11.00" class="sc-notoserifcjksc">是</text><text x="167.25 173.42 179.98 184.69 190.72 196.68 199.58 206.46" y="148.97" font-size="11.00" class="sc-loraregular">Surge AI</text><text x="213.04" y="148.97" font-size="11.00" class="sc-notoserifcjksc">推出的图表理解基准测试，涵盖</text><text x="369.93" y="148.97" font-size="11.00" class="sc-loraregular">100</text><text x="390.49" y="148.97" font-size="11.00" class="sc-notoserifcjksc">个任务，涉及现有基准测试中</text><text x="72.00" y="164.59" font-size="11.00" class="sc-notoserifcjksc">很少评估的专业图表类型。其中包括</text><text x="250.89 258.41 264.08 270.65 273.64 279.32 285.99 292.48 302.51 308.47 311.56 317.52" y="164.59" font-size="11.00" class="sc-loraregular">Kaplan–Meier</text><text x="325.18" y="164.59" font-size="11.00" class="sc-notoserifcjksc">生存曲线图、</text><text x="391.18" y="164.59" font-size="11.00" class="sc-loraregular">K</text><text x="72.00" y="180.21" font-size="11.00" class="sc-notoserifcjksc">图、风玫瑰图、桑基图、伯德图和三维曲面图。由于不同类型的图表可读取的精度不同，每个答</text><text x="72.00" y="195.83" font-size="11.00" class="sc-notoserifcjksc">案都依据专家为该特定图表设定的可接受范围进行评分，而不是依据单一固定的容差。</text><text x="72.00" y="262.53" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="262.53" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="262.53" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="278.15" font-size="11.00" class="sc-notoserifcjksc">进行评估时，模型会获得一个容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们</text><text x="72.00" y="293.77" font-size="11.00" class="sc-notoserifcjksc">内部的</text><text x="107.89 115.58 122.17 127.85 132.69 136.94 143.38 149.46 154.15 159.82 166.39 172.90" y="293.77" font-size="11.00" class="sc-loraregular">Chartography</text><text x="181.60" y="293.77" font-size="11.00" class="sc-notoserifcjksc">评分实现与官方代码仓库中的任务及专家确定的可接受答案范围一致。</text><text x="522.60" y="290.11" font-size="6.60" class="sc-loraregular">21</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80 145.80 148.51" y="360.22" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="155.40" y="360.22" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时得分为</text><text x="268.30 274.26 280.16 282.76 289.12" y="360.22" font-size="11.00" class="sc-loraregular">42.6%</text><text x="298.69" y="360.22" font-size="11.00" class="sc-notoserifcjksc">，使用工具时为</text><text x="378.58" y="360.22" font-size="11.00" class="sc-loraregular">86.2%</text><text x="409.30" y="360.22" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="420.30 427.99 430.99 436.60 443.16 449.74 455.70 458.60 464.18 469.86 476.26 479.25 485.22 488.11" y="360.22" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="497.00" y="360.22" font-size="11.00" class="sc-notoserifcjksc">的得分分</text><text x="72.00" y="375.84" font-size="11.00" class="sc-notoserifcjksc">别为</text><text x="96.89 103.02 109.38 111.97 118.33" y="375.84" font-size="11.00" class="sc-loraregular">36.6%</text><text x="130.79" y="375.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="144.69" y="375.84" font-size="11.00" class="sc-loraregular">84.2%</text><text x="175.01" y="375.84" font-size="11.00" class="sc-notoserifcjksc">，而</text><text x="199.91 207.60 210.59 216.20 222.77 229.34 235.31 238.20 246.93 253.50 260.07 265.16 268.05" y="375.84" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="276.94" y="375.84" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="345.83 351.74 357.92 360.52 366.88" y="375.84" font-size="11.00" class="sc-loraregular">29.6%</text><text x="379.34" y="375.84" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="393.23 399.42 405.54 408.08 414.91" y="375.84" font-size="11.00" class="sc-loraregular">83.0%</text><text x="424.48" y="375.84" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="674.86" font-size="6.00" class="sc-loraregular">20</text><text x="81.58 87.19 93.16 97.44 102.92 108.34 110.97 117.23 120.58 123.21 126.26 131.63 137.77 143.14 148.80 151.85 154.31 156.94 163.93 169.92 175.08 179.48 183.35 189.20 194.73 198.99 204.15 210.12 216.04 221.32 223.82 226.45 232.71 235.34 241.16 246.58 252.65 257.97 263.96 272.90 278.06 282.35 287.72 290.35 293.68 299.53 303.86 306.49 312.46 316.72 322.52 325.85 331.27 335.90 340.53 343.34 349.19 355.26 360.42 363.14 365.77 371.09 377.08 382.24 386.64 390.51 393.14 399.11 405.18 411.16 416.58 420.91 425.54 429.41 434.57 440.64 446.62 449.43 455.50 461.03 463.49 466.12 471.73 477.70 481.98 487.46 492.88 495.51 501.77 505.12" y="678.20" font-size="10.00" class="sc-loraregular">Surge AI (2026). Chartography: A benchmark for professional chart understanding. Surge AI.</text><text x="72.00 77.90 81.87 85.74 91.71 96.34 98.84 102.53 109.43 114.06 120.03 124.31 129.79 135.21 141.20 146.96 149.42 154.58 157.18 164.08 169.90 172.62 178.47 184.00 190.90 196.22 202.21 207.37 211.77 215.64 221.49 227.02 231.28 236.44 242.41 248. <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p187.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 187 页"><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">187</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型的渲染视图中全部四个相机位置。第二，我们更新了评分方式，使其除</text><text x="437.89 448.41 454.84 459.56 465.47 472.04 475.03 480.71 487.38" y="82.61" font-size="11.00" class="sc-loraregular">Workplane</text><text x="496.24" y="82.61" font-size="11.00" class="sc-notoserifcjksc">外也接受</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">原始形状。在</text><text x="140.89 149.26 155.93 162.27 167.64 173.64 176.35" y="98.23" font-size="11.00" class="sc-loraregular">GPT-5.5</text><text x="185.23" y="98.23" font-size="11.00" class="sc-notoserifcjksc">等模型上，我们此前注意到，原始形状会因这种输出上的风格差异而报</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">错，尽管其几何形状在其他方面是等价的。这两项更改均已合并到</text><text x="393.89 402.26 405.53 409.79 418.16 424.73" y="113.85" font-size="11.00" class="sc-loraregular">GitHub</text><text x="434.02" y="113.85" font-size="11.00" class="sc-notoserifcjksc">上的参考代码仓库</text><text x="72.00" y="179.77" font-size="11.00" class="sc-notoserifcjksc">在所有运行中，无论是否使用工具，模型均配置为启用自适应思考和</text><text x="404.89" y="179.77" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="427.59" y="179.77" font-size="11.00" class="sc-notoserifcjksc">推理强度。在使用工具</text><text x="72.00" y="195.39" font-size="11.00" class="sc-notoserifcjksc">进行评估时，模型获得了一个容器（其中装有图像文件和标准库）以及一个图像裁剪工具。我们</text><text x="72.00" y="211.01" font-size="11.00" class="sc-notoserifcjksc">在已公布的</text><text x="129.89 133.90 138.48 141.26 147.61 154.45" y="211.01" font-size="11.00" class="sc-loraregular">17,900</text><text x="164.18" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="178.07 185.09 188.18 193.27 196.37 202.80 209.48 215.39 223.07 229.51 236.09" y="211.01" font-size="11.00" class="sc-loraregular">Vision2Code</text><text x="244.94" y="211.01" font-size="11.00" class="sc-notoserifcjksc">文件中随机抽取</text><text x="324.84 328.84 331.45 338.28 345.11" y="211.01" font-size="11.00" class="sc-loraregular">1,000</text><text x="354.84" y="211.01" font-size="11.00" class="sc-notoserifcjksc">个文件组成的子集上评估模型；根据</text><text x="72.00" y="226.63" font-size="11.00" class="sc-notoserifcjksc">以往经验，该子集的分数能在</text><text x="217.89 224.55 227.09 233.92" y="226.63" font-size="11.00" class="sc-loraregular">0.01</text><text x="240.82" y="226.63" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="276.71 280.15 286.37" y="226.63" font-size="11.00" class="sc-loraregular">IoU</text><text x="294.64" y="226.63" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="305.64 311.14 317.52 323.30 329.26 332.25 335.14 338.59 344.80" y="226.63" font-size="11.00" class="sc-loraregular">voxel IoU</text><text x="353.07" y="226.63" font-size="11.00" class="sc-notoserifcjksc">）误差范围内反映完整集合上的分数。</text><text x="72.00" y="242.25" font-size="11.00" class="sc-notoserifcjksc">我们报告五次运行的平均体素</text><text x="217.89 221.34 227.55" y="242.25" font-size="11.00" class="sc-loraregular">IoU</text><text x="238.72" y="242.25" font-size="11.00" class="sc-notoserifcjksc">分数。</text><text x="72.00" y="293.64" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.74 98.70 105.37 111.23 117.68 125.26 132.15 140.34 143.24 150.25 153.35 158.44 161.53 167.96 174.64 180.55 188.24 194.67 201.25" y="293.64" font-size="11.00" class="sc-loraregular">BenchCAD Vision2Code</text><text x="210.11" y="293.64" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="224.00 228.00 230.61 237.44 244.27" y="293.64" font-size="11.00" class="sc-loraregular">1,000</text><text x="254.01" y="293.64" font-size="11.00" class="sc-notoserifcjksc">个文件子集上，</text><text x="331.01 338.70 341.69 347.30 353.86 360.44 366.40 369.30 374.89 380.56 386.96 389.96 395.92 398.81 404.81 407.51" y="293.64" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="414.41" y="293.64" font-size="11.00" class="sc-notoserifcjksc">在不使用工具时取得了</text><text x="72.00 78.65 81.36 87.32 93.19" y="309.26" font-size="11.00" class="sc-loraregular">0.437</text><text x="101.15" y="309.26" font-size="11.00" class="sc-notoserifcjksc">的体素</text><text x="137.04 140.49 146.70" y="309.26" font-size="11.00" class="sc-loraregular">IoU</text><text x="157.87" y="309.26" font-size="11.00" class="sc-notoserifcjksc">分数，使用工具时得分为</text><text x="281.76 288.41 291.12 297.30 303.26" y="309.26" font-size="11.00" class="sc-loraregular">0.843</text><text x="309.39" y="309.26" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="320.39 328.08 331.07 336.68 343.25 349.83 355.79 358.68 364.27 369.95 376.35 379.34 385.30 388.20" y="309.26" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="397.08" y="309.26" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="465.98 472.63 475.34 481.20 486.27" y="309.26" font-size="11.00" class="sc-loraregular">0.376</text><text x="495.52" y="309.26" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="72.00 78.65 81.25 87.53 92.60" y="324.88" font-size="11.00" class="sc-loraregular">0.675</text><text x="98.60" y="324.88" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="109.60 117.29 120.28 125.89 132.46 139.03 145.00 147.89 156.62 163.19 169.76 174.85 177.74" y="324.88" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="186.63" y="324.88" font-size="11.00" class="sc-notoserifcjksc">的得分分别为</text><text x="255.52 262.18 264.89 271.01 277.37" y="324.88" font-size="11.00" class="sc-loraregular">0.366</text><text x="286.62" y="324.88" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="300.51 307.17 309.88 316.06 321.96" y="324.88" font-size="11.00" class="sc-loraregular">0.821</text><text x="325.97" y="324.88" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="665.27" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="665.27" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.56 111.65 117.19 120.66 123.03 128.98 133.82 139.56 144.23 149.70 155.83 161.84 168.67 171.04 177.17 180.12 184.48 187.43 192.52 198.26 203.06 209.25 214.34 219.71" y="665.27" font-size="9.00" class="sc-lorabold">8.14.2.A] BenchCAD Vision2Code</text><text x="226.92" y="665.27" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.92 278.21 280.66 285.25 290.62 296.00" y="665.27" font-size="9.00" class="sc-loraregular">Claude</text><text x="303.25" y="665.27" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考和</text><text x="404.61" y="665.27" font-size="9.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="423.18" y="665.27" font-size="9.00" class="sc-notoserifcjksc">推理强度的条件下评估，分为</text><text x="72.00" y="676.97" font-size="9.00" class="sc-notoserifcjksc">使用工具和不使用工具两种情况。得分为五次运行的平均值，并显示</text><text x="344.37" y="676.97" font-size="9.00" class="sc-loraregular">95%</text><text x="364.67" y="676.97" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="409.67 416.52 421.97 427.16 431.56 436.46 438.59 443.79 446.16 451.26 456.53" y="676.97" font-size="9.00" class="sc-loraregular">GPT-5.6 Sol</text><text x="461.34" y="676.97" font-size="9.00" class="sc-notoserifcjksc">的分数取自</text><text x="508.71" y="676.97" font-size="9.00" class="sc-loraregular">OpenAI</text><text x="72.00" y="688.67" font-size="9.00" class="sc-notoserifcjksc">公开报告的结果，在完整的</text><text x="182.37 185.64 189.40 191.66 196.87 202.46" y="688.67" font-size="9.00" class="sc-loraregular">17,900</text><text x="210.42" y="688.67" font-size="9.00" class="sc-notoserifcjksc">个文件上评估。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p188.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 188 页"><text x="72.00 80.29 83.42 87.97 96.38 99.51 107.23 110.61 120.80 128.65 141.63 149.92 154.91 158.35 167.16 170.54 178.03 181.17" y="575.03" font-size="13.00" class="sc-poppinsmedium" fill="#666666">8.14.3 OSWorld 2.0</text><text x="72.00 75.09" y="700.23" font-size="6.00" class="sc-loraregular">24</text><text x="80.97 86.82 92.79 97.94 104.01 106.54 109.17 118.35 120.80 123.33 125.96 131.31 135.18 137.81 142.97 145.69 148.14 150.77 153.82 159.19 165.33 170.70 176.35 179.40 181.86 184.49 192.43 198.09 207.65 213.50 217.79 220.51 226.48 229.11 234.48 236.79 243.00 245.50 248.12 254.34 259.76 265.83 271.15 277.13 286.07 291.23 295.52 300.88 303.69 309.76 315.29 317.92 323.18 329.03 337.97 343.94 349.90 353.77 359.19 363.52 366.15 372.12 376.74 382.16 384.79 389.95 395.43 400.84 406.82 410.69 415.32 417.95 423.79 429.86 432.49 435.21 441.06 447.13 452.65 457.54 463.53 469.38 473.71 476.51 481.55 487.40" y="704.45" font-size="10.00" class="sc-loraregular">Yuan, M., et al. (2026). OSWorld 2.0: Benchmarking computer use agents on long-horizon</text><text x="72.00 76.26 81.66 86.81 89.53 94.34 102.23 108.08 112.36 115.08 121.06 123.69 127.56 132.72 137.34 142.71 147.34 149.80 152.43 157.59 161.29 167.78 170.59 175.64 178.14 183.51 189.28 195.49 201.27 203.73 209.10 214.87 220.32 225.65 229.82" y="717.26" font-size="10.00" class="sc-loraregular">real-world tasks. arXiv:2606.29537.</text><text x="234.91 240.80 244.77 248.64 254.61 259.24 261.73 265.42 271.88 277.04 281.37 286.66 289.47 294.13 296.59 302.44 306.72 312.24 318.70 323.86 329.68 333.95 340.85 346.22 352.00 358.20 363.98 366.44 371.81 377.59 383.03 388.36" y="717.26" font-size="10.00" class="sc-loraregular" fill="#1155cc">https://arxiv.org/abs/2606.29537</text><text x="504.00" y="751.80" font-size="9.00" class="sc-loraregular">188</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="82.61" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="82.61" font-size="11.00" class="sc-notoserifcjksc">模型在该评估上的表现随测试时计算量的增加而显著提升，尤其是当模型除自适应思考</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">外，还配备了能够对中间输出进行视觉验证的工具时。事实上，在提供工具时，</text><text x="457.00 462.59 468.26 474.67 477.66 483.62 486.51 492.51 495.21" y="98.23" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="502.11" y="98.23" font-size="11.00" class="sc-notoserifcjksc">取得的</text><text x="72.00" y="113.85" font-size="11.00" class="sc-notoserifcjksc">体素</text><text x="96.89 100.34 106.55" y="113.85" font-size="11.00" class="sc-loraregular">IoU</text><text x="117.72" y="113.85" font-size="11.00" class="sc-notoserifcjksc">分数接近其不使用工具时分数的两倍。</text><text x="72.00" y="514.38" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="514.38" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.56 111.65 117.19 120.66 123.03 128.98 133.82 139.56 144.23 149.70 155.83 161.84 168.67 171.04 177.17 180.12 184.48 187.43 192.52 198.26 203.06 209.25 214.34 219.71" y="514.38" font-size="9.00" class="sc-lorabold">8.14.2.B] BenchCAD Vision2Code</text><text x="226.92" y="514.38" font-size="9.00" class="sc-notoserifcjkscbold">子集得分。</text><text x="271.92" y="514.38" font-size="9.00" class="sc-notoserifcjksc">模型在启用自适应思考、不同推理强度档位下评估，分为使用工具</text><text x="72.00" y="526.08" font-size="9.00" class="sc-notoserifcjksc">和不使用工具两种情况。我们使用</text><text x="209.37 214.25 217.38 220.37 225.64 229.60" y="526.08" font-size="9.00" class="sc-loraregular">effort</text><text x="235.45" y="526.08" font-size="9.00" class="sc-notoserifcjksc">参数来调整所花费的测试时计算量。得分为每个推理强度档位下五次运行的</text><text x="72.00" y="537.78" font-size="9.00" class="sc-notoserifcjksc">平均值。图中显示</text><text x="146.37" y="537.78" font-size="9.00" class="sc-loraregular">95%</text><text x="166.67" y="537.78" font-size="9.00" class="sc-notoserifcjksc">置信区间。</text><text x="72.00 80.73 86.97 97.49 103.92 108.64 111.63 118.21 121.10 127.01 129.55" y="598.89" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="136.38 139.78" y="595.22" font-size="6.60" class="sc-loraregular">24</text><text x="146.25" y="598.89" font-size="11.00" class="sc-notoserifcjksc">是一个包含</text><text x="204.15" y="598.89" font-size="11.00" class="sc-loraregular">108</text><text x="224.06" y="598.89" font-size="11.00" class="sc-notoserifcjksc">个长程计算机使用（</text><text x="323.06 328.85 335.29 345.12 351.69 358.26 362.51 368.47 373.24 376.13 382.70 387.79" y="598.89" font-size="11.00" class="sc-loraregular">computer use</text><text x="393.75" y="598.89" font-size="11.00" class="sc-notoserifcjksc">）任务的基准测试，智能体在</text><text x="72.00" y="614.51" font-size="11.00" class="sc-notoserifcjksc">其中通过截图以及鼠标和键盘操作来操控一台实时运行的</text><text x="349.89 358.17 364.57 371.13 377.71 381.97" y="614.51" font-size="11.00" class="sc-loraregular">Ubuntu</text><text x="391.43" y="614.51" font-size="11.00" class="sc-notoserifcjksc">虚拟机。每个任务依据一组加</text><text x="72.00" y="630.13" font-size="11.00" class="sc-notoserifcjksc">权检查点评分，我们报告两项指标：部分得分（按任务计算的各检查点得分均值）和严格通过率</text><text x="72.00" y="645.75" font-size="11.00" class="sc-notoserifcjksc">（所有检查点均满足的任务所占比例），二者均为五次独立运行平均后的</text><text x="426.89 433.48 439.16 444.25 449.34 458.10" y="645.75" font-size="11.00" class="sc-loraregular">Pass@1</text><text x="462.10" y="645.75" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://arxiv.org/abs/2606.29537" rel="noopener"><rect x="232.28" y="707.20" width="160.69" height="12.80" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p189.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 189 页"><text x="504.00 507.28 512.27" y="751.80" font-size="9.00" class="sc-loraregular">189</text><text x="72.00" y="82.61" font-size="11.00" class="sc-notoserifcjksc">我们采用该基准测试的默认设置，即</text><text x="250.89" y="82.61" font-size="11.00" class="sc-loraregular">1080p</text><text x="284.20" y="82.61" font-size="11.00" class="sc-notoserifcjksc">分辨率、每个任务最多</text><text x="397.09" y="82.61" font-size="11.00" class="sc-loraregular">500</text><text x="419.64" y="82.61" font-size="11.00" class="sc-notoserifcjksc">个操作步数，并使用最高</text><text x="72.00" y="98.23" font-size="11.00" class="sc-notoserifcjksc">推理强度。对于需要评分模型的任务，我们使用</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 352.92 359.49 366.05 371.14 374.04 380.00 382.71" y="98.23" font-size="11.00" class="sc-loraregular">Claude Opus 4.8</text><text x="388.89" y="98.23" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="147.38" font-size="11.00" class="sc-notoserifcjksc">我们评估的是作者于</text><text x="173.89 179.80 186.55 192.46" y="147.38" font-size="11.00" class="sc-loraregular">2026</text><text x="201.71" y="147.38" font-size="11.00" class="sc-notoserifcjksc">年</text><text x="215.61" y="147.38" font-size="11.00" class="sc-loraregular">8</text><text x="224.68" y="147.38" font-size="11.00" class="sc-notoserifcjksc">月发布的任务版本，包含其后续的任务修复，以及我们向作者报</text><text x="72.00" y="163.00" font-size="11.00" class="sc-notoserifcjksc">告的针对任务设置和评分脚本的修复。</text><text x="259.00 266.69 269.68 275.29 281.86 288.44 294.40 297.29 302.88 308.55 314.96 317.95 323.91 326.80 332.80 335.51" y="163.00" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="342.40" y="163.00" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="411.30 416.37 420.95 423.66 430.02" y="163.00" font-size="11.00" class="sc-loraregular">77.9%</text><text x="439.59" y="163.00" font-size="11.00" class="sc-notoserifcjksc">，严格通过率为</text><text x="72.00 77.96 81.97 84.32 89.39" y="178.62" font-size="11.00" class="sc-loraregular">41.7%</text><text x="98.96" y="178.62" font-size="11.00" class="sc-notoserifcjksc">。在相同条件下重新评估后，</text><text x="241.96 249.65 252.64 258.25 264.82 271.40 277.36 280.25 288.99 295.55 302.12 307.21 310.11" y="178.62" font-size="11.00" class="sc-loraregular">Claude Opus 5</text><text x="318.99" y="178.62" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="387.89" y="178.62" font-size="11.00" class="sc-loraregular">75.4%</text><text x="417.19" y="178.62" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="497.08 503.21 509.39 511.99 518.35" y="178.62" font-size="11.00" class="sc-loraregular">39.6%</text><text x="527.92" y="178.62" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 115.88 121.56 127.96 130.95 136.91 139.80" y="194.24" font-size="11.00" class="sc-loraregular">Claude Fable 5</text><text x="148.69" y="194.24" font-size="11.00" class="sc-notoserifcjksc">的部分得分为</text><text x="217.59" y="194.24" font-size="11.00" class="sc-loraregular">72.9%</text><text x="247.20" y="194.24" font-size="11.00" class="sc-notoserifcjksc">、严格通过率为</text><text x="327.09" y="194.24" font-size="11.00" class="sc-loraregular">36.1%</text><text x="355.86" y="194.24" font-size="11.00" class="sc-notoserifcjksc">。由于任务文件不同，这些结果取代</text><text x="72.00" y="209.86" font-size="11.00" class="sc-notoserifcjksc">了</text><text x="85.89 93.58 96.57 102.18 108.75 115.33 121.29 124.18 132.92 139.49 146.05 151.15 154.04" y="209.86" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 5</text><text x="162.93" y="209.86" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="195.93" y="209.86" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="220.82 229.55 235.79 246.31 252.74 257.46 260.45 267.03 269.92 275.83 278.37" y="209.86" font-size="11.00" class="sc-loraregular">OSWorld 2.0</text><text x="288.10" y="209.86" font-size="11.00" class="sc-notoserifcjksc">数据，且不能与该基准测试早期版本上报告的结果</text><text x="72.00" y="225.48" font-size="11.00" class="sc-notoserifcjksc">直接比较。</text><text x="72.00" y="556.05" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.99 94.09 97.74 102.66 104.76 109.80 111.90 117.43 120.91 123.27 130.19 135.50 144.04 149.13 153.37 156.18 161.54 163.91 168.70 170.67" y="556.05" font-size="9.00" class="sc-lorabold">8.14.3.A] OSWorld 2.0</text><text x="178.76" y="556.05" font-size="9.00" class="sc-notoserifcjkscbold">得分</text><text x="196.76" y="556.05" font-size="9.00" class="sc-notoserifcjksc">，按模型列出。</text><text x="259.76 266.05 268.50 273.09 278.46 283.84 288.72 291.09 295.66 300.30 305.54 307.99 312.87 315.23 320.14 322.35" y="556.05" font-size="9.00" class="sc-loraregular">Claude Fable 5.1</text><text x="328.00" y="556.05" font-size="9.00" class="sc-notoserifcjksc">在启用生产环境安全防护措施的情况下进行评估。在</text><text x="72.00" y="567.75" font-size="9.00" class="sc-notoserifcjksc">这些安全防护措施介入的任务上，</text><text x="207.00 211.57 216.22 221.45 223.90 228.78 231.15 236.05 238.27" y="567.75" font-size="9.00" class="sc-loraregular">Fable 5.1</text><text x="243.91" y="567.75" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="255.28 259.85 264.49 269.73 272.18 277.06 279.42" y="567.75" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="286.70" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="298.06 305.21 310.31 318.92 324.18 328.04 330.49" y="567.75" font-size="9.00" class="sc-loraregular">OSWorld</text><text x="338.24" y="567.75" font-size="9.00" class="sc-notoserifcjksc">上记为零分，</text><text x="392.24 396.81 401.45 406.69 409.14 414.02 416.39" y="567.75" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="423.66" y="567.75" font-size="9.00" class="sc-notoserifcjksc">在</text><text x="435.02 440.66 446.03 449.51 454.78 462.83 467.41 470.89 473.42 478.68 484.09 489.69 494.57 500.03 504.82" y="567.75" font-size="9.00" class="sc-loraregular">AutomationBench</text><text x="512.58" y="567.75" font-size="9.00" class="sc-notoserifcjksc">上记为</text><text x="72.00" y="579.45" font-size="9.00" class="sc-notoserifcjksc">零分。在安全防护措施的所有其他介入情形中，网络安全任务由</text><text x="326.37 332.66 335.11 339.70 345.07 350.45 355.33 357.70 364.84 370.21 375.59 379.75 382.12 387.00 389.21" y="579.45" font-size="9.00" class="sc-loraregular">Claude Opus 4.8</text><text x="396.64" y="579.45" font-size="9.00" class="sc-notoserifcjksc">完成，生物学任务由</text><text x="480.01 486.30 488.74 493.34 498.71 504.09 508.97 511.33 518.48 523.85 529.23 533.39 535.76" y="579.45" font-size="9.00" class="sc-loraregular">Claude Opus 5</text><text x="72.00" y="591.15" font-size="9.00" class="sc-notoserifcjksc">完成。这很可能降低了</text><text x="164.37 168.94 173.58 178.82 181.27 186.15 188.51 193.42 195.63" y="591.15" font-size="9.00" class="sc-loraregular">Fable 5.1</text><text x="201.28" y="591.15" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="212.64 217.22 221.86 227.10 229.55 234.42 236.79" y="591.15" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="244.06" y="591.15" font-size="9.00" class="sc-notoserifcjksc">在这些基准测试上的表现。得分基于基准测试作者</text><text x="444.43 449.26 454.79 459.62" y="591.15" font-size="9.00" class="sc-loraregular">2026</text><text x="467.19" y="591.15" font-size="9.00" class="sc-notoserifcjksc">年</text><text x="478.56" y="591.15" font-size="9.00" class="sc-loraregular">8</text><text x="485.98" y="591.15" font-size="9.00" class="sc-notoserifcjksc">月发布的任务</text><text x="72.00" y="602.85" font-size="9.00" class="sc-notoserifcjksc">版本；</text><text x="99.00 103.57 108.22 113.45 115.90 120.78 123.15" y="602.85" font-size="9.00" class="sc-loraregular">Fable 5</text><tex  y="178.05" font-size="11.00" class="sc-loraregular">Opus 5</text><text x="389.37" y="178.05" font-size="11.00" class="sc-notoserifcjksc">同样如此（回退至</text><text x="480.27" y="178.05" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00" y="193.67" font-size="11.00" class="sc-loraregular">4.8</text><text x="86.85" y="193.67" font-size="11.00" class="sc-notoserifcjksc">）；</text><text x="108.85 118.78 124.65 128.90 135.49 141.93 147.02 149.91" y="193.67" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="158.80" y="193.67" font-size="11.00" class="sc-notoserifcjksc">则在内部</text><text x="205.69 212.58 219.19" y="193.67" font-size="11.00" class="sc-loraregular">API</text><text x="225.77" y="193.67" font-size="11.00" class="sc-notoserifcjksc">上评估，未启用这些安全防护措施。耗尽输出上限的运行记为错</text><text x="72.00" y="209.29" font-size="11.00" class="sc-notoserifcjksc">误；在生产环境</text><text x="151.89 155.90 161.80 167.99 173.89 176.79 181.04 187.48 193.31 199.27" y="209.29" font-size="11.00" class="sc-loraregular">128k token</text><text x="208.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">的输出上限下，没有任何</text><text x="332.73 338.32 344.00 350.40 353.39 359.35 362.25 368.24 370.95" y="209.29" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="377.84" y="209.29" font-size="11.00" class="sc-notoserifcjksc">运行在给出最终答案前被截断。</text><text x="72.00" y="276.92" font-size="11.00" class="sc-notoserifcjksc">关于跨报告可比性的说明：</text><text x="253.57" y="276.92" font-size="11.00" class="sc-notoserifcjksc">得分对评估运行框架高度敏感。要求模型直接解析原始</text><text x="72.00 78.61 86.70" y="292.54" font-size="11.00" class="sc-loraregular">PDF</text><text x="95.62" y="292.54" font-size="11.00" class="sc-notoserifcjksc">语料库的设置，会使所有模型的绝对得分大幅降低。例如，</text><text x="381.62 389.76 395.36 399.61 405.29 411.69 416.45 419.55 425.40 431.30" y="292.54" font-size="11.00" class="sc-loraregular">Databricks</text><text x="439.29" y="292.54" font-size="11.00" class="sc-notoserifcjksc">自行对</text><text x="475.18 482.87 485.86 491.47 498.04 504.62 510.58 513.47 519.06 524.74 531.14 534.13" y="292.54" font-size="11.00" class="sc-loraregular">Claude Fable</text><text x="72.00" y="308.16" font-size="11.00" class="sc-loraregular">5</text><text x="80.89" y="308.16" font-size="11.00" class="sc-notoserifcjksc">进行的评估以图像而非提取文本的形式读取文档，报告其在</text><text x="440.03" y="308.16" font-size="11.00" class="sc-notoserifcjksc">上的得分为</text><text x="497.92 503.92 508.50 511.21 517.57" y="308.16" font-size="11.00" class="sc-loraregular">57.9%</text><text x="527.14" y="308.16" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 78.36 84.32 90.40 96.08 99.07 101.96 108.85 114.88 120.84 127.42 131.68 134.57 141.41 147.37 154.05 159.90 166.49 176.32 182.00 186.72" y="400.30" font-size="11.00" class="sc-loraregular">Legal Agent Benchmark</text><text x="192.63" y="400.30" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="203.63 210.17 217.06" y="400.30" font-size="11.00" class="sc-loraregular">LAB</text><text x="223.90" y="400.30" font-size="11.00" class="sc-notoserifcjksc">）是由</text><text x="259.79 268.28 273.96 278.80 284.30 290.21 296.02 298.91 305.79" y="400.30" font-size="11.00" class="sc-loraregular">Harvey AI</text><text x="312.37" y="400.30" font-size="11.00" class="sc-notoserifcjksc">创建的开源基准测试。核心基准测试包含</text><text x="513.27 518.93" y="400.30" font-size="11.00" class="sc-loraregular">24</text><text x="527.79" y="400.30" font-size="11.00" class="sc-notoserifcjksc">个</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">不同执业领域的</text><text x="151.89 155.90 158.67 164.58 171.41" y="415.92" font-size="11.00" class="sc-loraregular">1,200</text><text x="181.14" y="415.92" font-size="11.00" class="sc-notoserifcjksc">多个任务。每个任务包含一个文档语料库</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="83.00" y="431.54" font-size="11.00" class="sc-loraregular">.xlsx</text><text x="105.45" y="431.54" font-size="11.00" class="sc-noto ext x="515.24" y="478.40" font-size="11.00" class="sc-notoserifcjksc">项，</text><text x="72.00" y="494.02" font-size="11.00" class="sc-notoserifcjksc">中位数</text><text x="107.89" y="494.02" font-size="11.00" class="sc-loraregular">56</text><text x="123.14" y="494.02" font-size="11.00" class="sc-notoserifcjksc">项，最多</text><text x="170.03" y="494.02" font-size="11.00" class="sc-loraregular">194</text><text x="189.25" y="494.02" font-size="11.00" class="sc-notoserifcjksc">项）。按照</text><text x="247.14 253.69 260.57" y="494.02" font-size="11.00" class="sc-loraregular">LAB</text><text x="270.31" y="494.02" font-size="11.00" class="sc-notoserifcjksc">的标准报告方式，只有当所有评分项均满足时，任务才</text><text x="72.00" y="509.64" font-size="11.00" class="sc-notoserifcjksc">算成功。</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 111.90 114.67 120.41 126.54" y="562.22" font-size="11.00" class="sc-loraregular">1,235</text><text x="135.44" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道题上测试了</text><text x="204.33 212.02 215.01 220.62 227.19 233.77 239.73 242.62 248.21 253.89 260.29 263.28 269.24 272.13 278.13 280.84" y="562.22" font-size="11.00" class="sc-loraregular">Claude Fable 5.1</text><text x="284.84" y="562.22" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="295.84 299.84 302.61 308.52 314.52" y="562.22" font-size="11.00" class="sc-loraregular">1,251</text><text x="321.43" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道题中有</text><text x="368.32" y="562.22" font-size="11.00" class="sc-loraregular">16</text><text x="381.57" y="562.22" font-size="11.00" class="sc-notoserifcjksc">道因数据缺陷被排除；排除项在</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">测试前即已确定）。在使用自适应思考和</text><text x="272.89" y="577.84" font-size="11.00" class="sc-robotomonoregular" fill="#188038">max</text><text x="295.59" y="577.84" font-size="11.00" class="sc-notoserifcjksc">推理强度时，该模型的全通过率为</text><text x="463.48 467.49 473.67 476 .33 339.21" y="624.70" font-size="11.00" class="sc-loraregular">LAB</text><text x="348.95" y="624.70" font-size="11.00" class="sc-notoserifcjksc">以来，我们的评分流水线已经更新，能</text><text x="72.00" y="640.32" font-size="11.00" class="sc-notoserifcjksc">够正确渲染</text><text x="129.89 132.60 139.18 145.61 151.39" y="640.32" font-size="11.00" class="sc-loraregular">.docx</text><text x="160.11" y="640.32" font-size="11.00" class="sc-notoserifcjksc">交付物中的修订痕迹，并能从</text><text x="306.00 310.26 316.70 322.53 328.49" y="640.32" font-size="11.00" class="sc-loraregular">token</text><text x="338.06" y="640.32" font-size="11.00" class="sc-notoserifcjksc">上限截断中恢复。我们的运行框架是一个</text><text x="72.00" y="655.94" font-size="11.00" class="sc-notoserifcjksc">内部重新实现的版本，保留了</text><text x="217.89 224.44 231.32" y="655.94" font-size="11.00" class="sc-loraregular">LAB</text><text x="241.06" y="655.94" font-size="11.00" class="sc-notoserifcjksc">的任务内容、评分细则评分项、全通过评分方式以及默认评判</text><text x="72.00" y="671.56" font-size="11.00" class="sc-notoserifcjksc">模型（</text><text x="105.00 112.69 115.68 121.29 127.86 134.44 140.40 143.29 149.53 155.96 162.64 169.32 175.20 179.46 182.35 188.31 190.91" y="671.56" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="197.27" y="671.56" font-size="11.00" class="sc-notoserifcjksc">），但工具集有所精简。公开运行框架</text></svg></div>

ext x="134.28" y="131.19" font-size="11.00" class="sc-notoserifcjksc">留出题集上的结果由</text><text x="326.76" y="131.19" font-size="11.00" class="sc-notoserifcjksc">报告。我们此前报告的是</text><text x="450.65 459.14 464.82 469.66 475.16 481.07" y="131.19" font-size="11.00" class="sc-loraregular">Harvey</text><text x="489.77" y="131.19" font-size="11.00" class="sc-notoserifcjksc">在留出集</text><text x="72.00" y="146.81" font-size="11.00" class="sc-notoserifcjksc">上给出的分数。为了尽可能准确地呈现模型间的比较，我们已更新报告方式，对我们以前的模型</text><text x="72.00" y="162.43" font-size="11.00" class="sc-notoserifcjksc">改用</text><text x="187.48" y="162.43" font-size="11.00" class="sc-notoserifcjksc">的分数；这些分数可能与以往系统卡中报告的分数略有不同。留出集包含</text><text x="72.00" y="178.05" font-size="11.00" class="sc-loraregular">120</text><text x="91.64" y="178.05" font-size="11.00" class="sc-notoserifcjksc">道题，在</text><text x="229.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc">团队维护的运行框架上运行（</text><text x="372.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">参见其方法说明</text><text x="449.11" y="178.05" font-size="11.00" class="sc-notoserifcjksc">）。在留出集上，</text><text x="72.00 77.59 83.26 89.67 92.66 98.62 101.51 107.51 110.21" y="193.67" font-size="11.00" class="sc-loraregular">Fable 5.1</text><text x="117.11" y="193.67" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="131.00" y="193.67" font-size="11.00" class="sc-robotomonoregular" fill="#188038">xhigh</text><text x="166.90" y="193.67" font-size="11.00" class="sc-notoserifcjksc">推理强度下的全通过率为</text><text x="290.80 294.80 301.16 303.51 308.58" y="193.67" font-size="11.00" class="sc-loraregular">16.7%</text><text x="318.15" y="193.67" font-size="11.00" class="sc-notoserifcjksc">，评分项通过率为</text><text x="409.05" y="193.67" font-size="11.00" class="sc-loraregular">93.3%</text><text x="439.93" y="193.67" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 80.37 88.46 95.44 100.89 106.56 109.55 114.93 122.33 129.21 132.10 137.66" y="291.49" font-size="11.00" class="sc-loraregular">GDPval-AA v2</text><text x="146.46" y="291.49" font-size="11.00" class="sc-notoserifcjksc">由</text><text x="250.94" y="291.49" font-size="11.00" class="sc-notoserifcjksc">开发，是一个独立评估框架，用于在具有经济价值的真实世</text><text x="72.00" y="307.11" font-size="11.00" class="sc-notoserifcjksc">界专业任务上测试</text><text x="162.89" y="307.11" font-size="11.00" class="sc-loraregular">AI</text><text x="176.36" y="307.11" font-size="11.00" class="sc-notoserifcjksc">模型。该基准测试使用</text><text x="289.25" y="307.11" font-size="11.00" class="sc-loraregular">OpenAI</text><text x="330.65 339.02 347.11 354.10 359.54 365.22" y="307.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">GDPval</text><text x="371.10" y="307.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">黄金数据库</text><text x="426.10" y="303.44" font-size="6.60" class="sc-loraregular">26</text><text x="433.46" y="307.11" font-size="11.00" class="sc-notoserifcjksc">中的</text><text x="458.35" y="307.11" font-size="11.00" class="sc-loraregular">220</text><text x="479.89" y="307.11" font-size="11.00" class="sc-notoserifcjksc">个任务，涵</text><text x="72.00" y="322.73" font-size="11.00" class="sc-notoserifcjksc">盖九大行业的</text><text x="140.89" y="322.73" font-size="11.00" class="sc-loraregular">44</text><text x="155.71" y="322.73" font-size="11.00" class="sc-notoserifcjksc">种职业。任务对应真实的专业工作成果，包括文档、幻灯片、图表和电子表格。</text><text x="72.00" y="338.35" font-size="11.00" class="sc-notoserifcjksc">模型在智能体循环中获得</text><text x="195.89" y="338.35" font-size="11.00" class="sc-loraregular">shell</text><text x="222.41" y="338.35" font-size="11.00" class="sc-notoserifcjksc">访问权限和网页浏览能力来完成任务，性能通过对模型输出进行</text><text x="72.00" y="353.97" font-size="11.00" class="sc-notoserifcjksc">盲评两两比较得出的</text><text x="173.89" y="353.97" font-size="11.00" class="sc-loraregular">Elo</text><text x="193.05" y="353.97" font-size="11.00" class="sc-notoserifcjksc">评分来衡量。</text><text x="259.05 266.74 269.74 275.35 281.91 288.49 294.45 297.35 302.93
