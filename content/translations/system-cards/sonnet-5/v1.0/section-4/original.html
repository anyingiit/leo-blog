.sc-poppinssemibold { font-family: "sc-poppinssemibold"; }</style><div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p036.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 36 页"><text x="72.00" y="86.30" font-size="16.00" class="sc-poppinssemibold">4</text><text x="86.38" y="86.30" font-size="16.00" class="sc-notosanscjkscbold">安全防护与无害性</text><text x="72.00" y="124.21" font-size="14.00" class="sc-poppinssemibold">4.1</text><text x="93.29" y="124.21" font-size="14.00" class="sc-notosanscjkscbold">有害请求评估</text><text x="72.00" y="150.78" font-size="11.00" class="sc-notoserifcjksc">在发布</text><text x="107.89 115.58 118.57 124.18 130.75 137.33 143.29 146.18 152.42 158.86 165.53 172.21 178.10 182.35 185.24" y="150.78" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="194.13" y="150.78" font-size="11.00" class="sc-notoserifcjksc">之前，我们运行了标准的安全评估套件。这些评估涵盖模型安全回应以</text><text x="72.00" y="166.40" font-size="11.00" class="sc-notoserifcjksc">下几类请求的能力：与我们的</text><text x="215.00" y="166.40" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策（</text><text x="270.00 278.20 283.29 288.96 294.99 300.95 303.85 310.40 316.84 319.83 322.92 328.72" y="166.40" font-size="11.00" class="sc-loraregular" fill="#0000ff">Usage Policy</text><text x="334.53" y="166.40" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">）</text><text x="345.53" y="166.40" font-size="11.00" class="sc-notoserifcjksc">相关的请求、涉及用户身心健康的请</text><text x="72.00" y="182.02" font-size="11.00" class="sc-notoserifcjksc">求，以及涉及偏见与诚信的请求。与以往发布一样，这包括针对有害和良性提示的单轮测试、探</text><text x="72.00" y="213.26" font-size="11.00" class="sc-notoserifcjksc">试图将对话引向有害方向。</text><text x="72.00" y="264.12" font-size="11.00" class="sc-notoserifcjksc">这在很大程度上与</text><text x="160.00 167.69 170.68 176.29 182.86 189.44 195.40 198.29 203.88 209.55 215.96 218.95 224.91 227.80 233.80 236.69 244.34 247.23 254.92 257.91 263.52 270.09 276.67 282.63 285.52 295.45 301.32 305.57 312.16 318.60" y="264.12" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5 &amp; Claude Mythos</text><text x="326.58" y="264.12" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="335.47" y="264.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="368.47" y="264.12" font-size="11.00" class="sc-notoserifcjksc">中所述的测试一致。</text><text x="467.47 473.71 480.14 486.82 493.50 499.38 503.64 506.53" y="264.12" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="515.42" y="264.12" font-size="11.00" class="sc-notoserifcjksc">的一</text><text x="72.00" y="279.74" font-size="11.00" class="sc-notoserifcjksc">项变化在于多轮评估：我们大幅修订了追踪与监视测试套件，以使我们的测试与不断演变的威胁</text><text x="72.00" y="295.36" font-size="11.00" class="sc-notoserifcjksc">向量和对抗性行为保持一致。凡评估内容有所变化之处，此处报告的先前模型得分可能与早期系</text><text x="72.00" y="310.98" font-size="11.00" class="sc-notoserifcjksc">统卡中公布的得分不同。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="377.46" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="377.46" font-size="11.00" class="sc-notoserifcjksc">的结果反映的是模型在没有我们在生产环境中部署的安全防护措施时的行为。我们继续</text><text x="72.00" y="393.08" font-size="11.00" class="sc-notoserifcjksc">同时报告仅核心模型（即不带系统提示词（</text><text x="281.00 286.09 291.90 296.99 301.25 307.21 317.05 319.94 326.51 331.19 337.63 347.46 354.03" y="393.08" font-size="11.00" class="sc-loraregular">system prompt</text><text x="358.29" y="393.08" font-size="11.00" class="sc-notoserifcjksc">）或其他产品特定指令）的结果，以</text><text x="72.00" y="408.70" font-size="11.00" class="sc-notoserifcjksc">及模型搭配接近最终版的</text><text x="195.89 202.13 208.57 215.24 221.92 227.80 232.06 234.95" y="408.70" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="243.84 249.69 252.69 258.30 264.86 271.44 277.40 280.11 285.79" y="408.70" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="291.77" y="408.70" font-size="11.00" class="sc-notoserifcjksc">系统提示词时的结果。我们对报告方式进行了标准</text><text x="149.00" y="424.32" font-size="11.00" class="sc-loraregular">“</text><text x="153.40" y="424.32" font-size="11.00" class="sc-notoserifcjksc">思考</text><text x="175.40" y="424.32" font-size="11.00" class="sc-loraregular">”</text><text x="179.24" y="424.32" font-size="11.00" class="sc-notoserifcjksc">配置之间的差异：对于支持开启或关闭思考的模型，我们报告两种条件下</text><text x="72.00" y="439.94" font-size="11.00" class="sc-notoserifcjksc">的汇总结果；而对于仅支持开启思考的模型，我们报告仅开启思考的结果。在本系统卡（</text><text x="501.00 507.18 512.99 518.08 522.34 528.30" y="439.94" font-size="11.00" class="sc-loraregular">System</text><text x="72.00 79.69 85.37 90.05" y="455.56" font-size="11.00" class="sc-loraregular">Card</text><text x="96.63" y="455.56" font-size="11.00" class="sc-notoserifcjksc">）中，我们对</text><text x="165.52 171.76 178.19 184.87 191.55 197.43" y="455.56" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="204.58" y="455.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="218.48" y="455.56" font-size="11.00" class="sc-loraregular">Opus</text><text x="248.33" y="455.56" font-size="11.00" class="sc-notoserifcjksc">模型报告汇总结果，对</text><text x="361.22 371.16 377.02 381.28 387.86 394.30" y="455.56" font-size="11.00" class="sc-loraregular">Mythos</text><text x="402.29" y="455.56" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="416.18 421.77 427.44 433.85 436.84" y="455.56" font-size="11.00" class="sc-loraregular">Fable</text><text x="445.69" y="455.56" font-size="11.00" class="sc-notoserifcjksc">系列模型报告仅开</text><text x="72.00" y="471.18" font-size="11.00" class="sc-notoserifcjksc">启思考的结果。</text><text x="72.00" y="539.38" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06" y="539.38" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="174.95" y="539.38" font-size="11.00" class="sc-notoserifcjksc">在这些评估上的表现与同级别中我们最新的模型</text><text x="408.84 416.53 419.52 425.13 431.70 438.28 444.24 447.13 453.37 459.80 466.48 473.16 479.04 483.30 486.19 492.16 494.75" y="539.38" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="504.00" y="539.38" font-size="11.00" class="sc-notoserifcjksc">大致相</text><text x="72.00" y="555.00" font-size="11.00" class="sc-notoserifcjksc">当。在</text><text x="107.89 113.75 116.74 122.35 128.91 135.49 141.45 144.16 149.84" y="555.00" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="155.82" y="555.00" font-size="11.00" class="sc-notoserifcjksc">上，系统提示词中包含的安全指令进一步增强了模型在单轮和多轮测试中对有害</text><text x="72.00" y="570.62" font-size="11.00" class="sc-notoserifcjksc">请求的处理能力。</text><text x="72.00" y="618.68" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.1</text><text x="99.86" y="618.68" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮有害请求评估结果</text><text x="72.00" y="646.58" font-size="11.00" class="sc-notoserifcjksc">单轮有害评估衡量受测模型在多大程度上能可靠地拒绝或安全地转移那些有害或明显违反我们</text><text x="523.00" y="646.58" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使</text><text x="72.00" y="662.20" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">用政策</text><text x="105.00" y="662.20" font-size="11.00" class="sc-notoserifcjksc">的请求。我们在</text><text x="184.89" y="662.20" font-size="11.00" class="sc-loraregular">16</text><text x="198.15" y="662.20" font-size="11.00" class="sc-notoserifcjksc">个政策领域、七种语言（阿拉伯语、英语、法语、印地语、韩语、汉语</text><text x="72.00" y="677.82" font-size="11.00" class="sc-notoserifcjksc">普通话和俄语）中测试提示，并报告我们判定模型回应未促成所请求危害的提示所占比例。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="157.60" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="215.00" y="157.60" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p037.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 37 页"><text x="76.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="286.21 293.55 300.51" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="304.77" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提</text><text x="198.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">示词</text><text x="371.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">总体无害回应率：</text><text x="459.46" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="312.02" font-size="9.50" class="sc-lorabold">[</text><text x="75.67" y="312.02" font-size="9.50" class="sc-notoserifcjkscbold">表</text><text x="87.67 92.86 95.08 98.93 101.15 105.00 107.22 113.06" y="312.02" font-size="9.50" class="sc-lorabold">4.1.1.A]</text><text x="119.22" y="312.02" font-size="9.50" class="sc-notoserifcjkscbold">单轮有害请求评估结果，所有受测语言。</text><text x="290.22" y="312.02" font-size="9.50" class="sc-notoserifcjksc">百分比指无害回应率；数值越高越好。</text><text x="451.72" y="312.02" font-size="9.50" class="sc-notoserifcjkscbold">加粗</text><text x="470.72" y="312.02" font-size="9.50" class="sc-notoserifcjksc">表示无害回应率</text><text x="72.00" y="324.38" font-size="9.50" class="sc-notoserifcjksc">最高，次优得分以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、汉语普通话和俄语进行。由于常</text><text x="72.00" y="336.73" font-size="9.50" class="sc-notoserifcjksc">规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="338.00 346.58 351.64 355.32 361.01 366.57 370.96 373.46" y="336.73" font-size="9.50" class="sc-loraregular">Mythos 5</text><text x="381.14" y="336.73" font-size="9.50" class="sc-notoserifcjksc">和</text><text x="393.14 401.72 406.78 410.46 416.15 421.70 426.10 428.60 434.36 438.41 443.51 448.30 450.97 456.08" y="336.73" font-size="9.50" class="sc-loraregular">Mythos Preview</text><text x="463.69" y="336.73" font-size="9.50" class="sc-notoserifcjksc">（与</text><text x="485.19 490.02 494.92 500.45 503.03 508.18 510.68" y="336.73" font-size="9.50" class="sc-loraregular">Fable 5</text><text x="518.36" y="336.73" font-size="9.50" class="sc-notoserifcjksc">不</text><text x="72.00" y="349.08" font-size="9.50" class="sc-notoserifcjksc">同）无法在</text><text x="122.00 127.05 129.64 134.48 140.15 145.83 150.98 153.32 158.22" y="349.08" font-size="9.50" class="sc-loraregular">claude.ai</text><text x="163.39" y="349.08" font-size="9.50" class="sc-notoserifcjksc">上使用，因此我们不报告它们搭配系统提示词时的结果。</text><text x="72.00" y="398.75" font-size="11.00" class="sc-notoserifcjksc">在无系统提示词的</text><text x="162.89 169.78 176.39" y="398.75" font-size="11.00" class="sc-loraregular">API</text><text x="182.97" y="398.75" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="204.97 211.20 217.64 224.32 230.99 236.88 241.14 244.03" y="398.75" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="252.92" y="398.75" font-size="11.00" class="sc-notoserifcjksc">的无害回应率比</text><text x="332.81 339.05 345.48 352.16 358.84 364.72 368.98 371.87 377.83 380.43" y="398.75" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="389.68" y="398.75" font-size="11.00" class="sc-notoserifcjksc">低约一个百分点，主要源于有</text><text x="72.00" y="429.99" font-size="11.00" class="sc-notoserifcjksc">一行为在</text><text x="118.89 124.75 127.74 133.35 139.91 146.49 152.45 155.16 160.84" y="429.99" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="166.82" y="429.99" font-size="11.00" class="sc-notoserifcjksc">上借助系统提示词得到了很大程度的缓解，在那里</text><text x="411.71 417.95 424.39 431.06 437.74 443.62 447.88 450.77" y="429.99" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="459.66" y="429.99" font-size="11.00" class="sc-notoserifcjksc">取得了近期受测</text><text x="72.00" y="445.61" font-size="11.00" class="sc-notoserifcjksc">模型中最高的无害回应率。</text><text x="72.00" y="494.24" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.2</text><text x="102.61" y="494.24" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">单轮良性请求评估结果</text><text x="72.00" y="522.14" font-size="11.00" class="sc-notoserifcjksc">单轮良性评估衡量模型拒绝那些主题敏感但适合回答的请求的频率。该提示集涵盖与上文有害提</text><text x="72.00" y="537.76" font-size="11.00" class="sc-notoserifcjksc">示集相同的</text><text x="129.89" y="537.76" font-size="11.00" class="sc-loraregular">16</text><text x="143.15" y="537.76" font-size="11.00" class="sc-notoserifcjksc">个政策领域和七种语言，我们将过度拒绝（</text><text x="352.15 358.53 364.03 369.99 374.67 380.04 384.73 390.69 394.41 400.98 406.07 411.75" y="537.76" font-size="11.00" class="sc-loraregular">over-refusal</text><text x="414.74" y="537.76" font-size="11.00" class="sc-notoserifcjksc">）率报告为模型拒绝回应</text><text x="72.00" y="553.38" font-size="11.00" class="sc-notoserifcjksc">的良性提示所占比例。</text><a href="http://claude.ai/" rel="noopener"><rect x="118.89" y="421.19" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="118.89" y="421.19" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p038.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 38 页"><text x="76.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#faf9f5">模型</text><text x="198.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="264.22 271.56 278.52" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="282.78" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，无系统提示词</text><text x="371.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">总体拒绝率：</text><text x="437.47" y="88.62" font-size="10.99" class="sc-lorabold" fill="#ffffff">Claude.ai</text><text x="72.00" y="290.50" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="290.50" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 97.51 99.61 104.41 106.51 112.04" y="290.50" font-size="9.00" class="sc-lorabold">4.1.2.A]</text><text x="117.88" y="290.50" font-size="9.00" class="sc-notoserifcjkscbold">单轮良性请求评估结果，所有受测语言。</text><text x="279.88" y="290.50" font-size="9.00" class="sc-notoserifcjksc">百分比表示过度拒绝率（即拒绝回答实际上属于良性的提示）；数</text><text x="72.00" y="302.20" font-size="9.00" class="sc-notoserifcjksc">值越低越好。</text><text x="126.00" y="302.20" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="144.00" y="302.20" font-size="9.00" class="sc-notoserifcjksc">表示过度拒绝率最低，次优得分以下划线标出。评估以阿拉伯语、英语、法语、印地语、韩语、汉语</text><text x="72.00" y="313.90" font-size="9.00" class="sc-notoserifcjksc">普通话和俄语进行。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="432.00 440.13 444.92 448.41 453.80 459.06 463.23 465.60" y="313.90" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="472.87" y="313.90" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="484.24 492.36 497.16 500.64 506.03 511.30" y="313.90" font-size="9.00" class="sc-loraregular">Mythos</text><text x="72.00 77.45 81.29 86.12 90.67 93.19 98.04" y="325.60" font-size="9.00" class="sc-loraregular">Preview</text><text x="105.25" y="325.60" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="125.61 130.18 134.83 140.07 142.51 147.39 149.76" y="325.60" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="157.03" y="325.60" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="213.40 218.19 220.63 225.22 230.60 235.98 240.86 243.07 247.72" y="325.60" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="252.61" y="325.60" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告它们搭配系统提示词时的结果。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="382.56" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="382.56" font-size="11.00" class="sc-notoserifcjksc">的过度拒绝率在绝对值上仍然较低（</text><text x="295.95 302.84 309.45" y="382.56" font-size="11.00" class="sc-loraregular">API</text><text x="316.02" y="382.56" font-size="11.00" class="sc-notoserifcjksc">上为</text><text x="340.92 347.57 350.28 356.27 362.63" y="382.56" font-size="11.00" class="sc-loraregular">0.59%</text><text x="372.20" y="382.56" font-size="11.00" class="sc-notoserifcjksc">，</text><text x="383.20 389.05 392.05 397.65 404.22 410.80 416.76 419.47 425.14" y="382.56" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="431.13" y="382.56" font-size="11.00" class="sc-notoserifcjksc">上为</text><text x="456.02" y="382.56" font-size="11.00" class="sc-loraregular">1.54%</text><text x="484.26" y="382.56" font-size="11.00" class="sc-notoserifcjksc">），不过两</text><text x="72.00" y="398.18" font-size="11.00" class="sc-notoserifcjksc">者均略高于</text><text x="129.89 136.13 142.57 149.24 155.92 161.80 166.06 168.95 174.92 177.51" y="398.18" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="183.87" y="398.18" font-size="11.00" class="sc-notoserifcjksc">。这一上升最主要集中在爆炸物领域的提示上：在涉及安全规程和监管等</text><text x="72.00" y="413.80" font-size="11.00" class="sc-notoserifcjksc">主题的敏感提示上，该模型有时表现出额外的谨慎。</text><text x="72.00" y="478.04" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.3</text><text x="102.94" y="478.04" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">多轮测试结果</text><text x="72.00" y="505.94" font-size="11.00" class="sc-notoserifcjksc">多轮评估考察的是模型能否在更长、不断演进的对话中持续保持安全行为，而不仅仅是在单轮交</text><text x="72.00" y="521.56" font-size="11.00" class="sc-notoserifcjksc">互中。为构建每个测试用例，内部政策专家会撰写一份规格说明，描述一个合成</text><text x="457.00" y="521.56" font-size="11.00" class="sc-loraregular">“</text><text x="461.40" y="521.56" font-size="11.00" class="sc-notoserifcjksc">用户</text><text x="483.40" y="521.56" font-size="11.00" class="sc-loraregular">”</text><text x="487.24" y="521.56" font-size="11.00" class="sc-notoserifcjksc">的人设、</text><text x="72.00" y="537.18" font-size="11.00" class="sc-notoserifcjksc">目标与策略，再由一个</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="537.18" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="537.18" font-size="11.00" class="sc-notoserifcjksc">模型（此处为</text><text x="292.08 299.77 302.76 308.37 314.93 321.51 327.48 330.37 339.10 345.67 352.24 357.33 360.22 366.18 368.78" y="537.18" font-size="11.00" class="sc-loraregular">Claude Opus 4.6</text><text x="375.14" y="537.18" font-size="11.00" class="sc-notoserifcjksc">）按照该规格说明生成用户轮次。</text><text x="72.00" y="552.80" font-size="11.00" class="sc-notoserifcjksc">随后我们评估受测模型如何作出回应。</text><text x="72.00" y="596.90" font-size="11.00" class="sc-notoserifcjksc">我们以恰当回应率报告结果，即模型在整个对话中始终表现恰当的对话所占比例。每段对话都依</text><text x="72.00" y="612.52" font-size="11.00" class="sc-notoserifcjksc">据其所属风险领域专门的评分细则进行评分，这意味着不应跨类别比较分数。</text><a href="http://claude.ai/" rel="noopener"><rect x="383.20" y="373.76" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="383.20" y="373.76" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p039.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 39 页"><text x="72.00" y="550.75" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="550.75" font-size="9.00" class="sc-notoserifcjkscbold">图</text><text x="86.84 91.76 93.86 97.51 99.61 104.65 106.75 112.28" y="550.75" font-size="9.00" class="sc-lorabold">4.1.3.A]</text><text x="118.12" y="550.75" font-size="9.00" class="sc-notoserifcjkscbold">以上各图显示各多轮测试领域的恰当回应率。</text><text x="298.12" y="550.75" font-size="9.00" class="sc-notoserifcjksc">百分比表示各模型在整个对话中始终作出恰当回应的对话所</text><text x="72.00" y="562.45" font-size="9.00" class="sc-notoserifcjksc">占比例。先展示</text><text x="137.37 143.00 148.41" y="562.45" font-size="9.00" class="sc-loraregular">API</text><text x="153.79" y="562.45" font-size="9.00" class="sc-notoserifcjksc">无系统提示词条件下的结果，随后是</text><text x="300.16 304.95 307.39 311.98 317.36 322.74 327.62 329.83 334.48" y="562.45" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="339.37" y="562.45" font-size="9.00" class="sc-notoserifcjksc">的结果。</text><text x="375.37 383.50 388.30 391.78 397.17 402.44 406.60 408.97" y="562.45" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="416.24" y="562.45" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="427.61 435.74 440.53 444.02 449.41 454.67 458.84 461.21 466.66 470.49 475.33 479.87 482.40 487.24" y="562.45" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="494.45" y="562.45" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="514.82 519.39 524.03 529.27 531.72" y="562.45" font-size="9.00" class="sc-loraregular">Fable</text><text x="72.00" y="574.15" font-size="9.00" class="sc-loraregular">5</text><text x="79.27" y="574.15" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="135.64 140.43 142.88 147.46 152.84 158.22 163.10 165.31 169.96" y="574.15" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="174.85" y="574.15" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告它们搭配系统提示词时的结果。越高越好。由于常规评估更新，先</text><text x="72.00" y="585.85" font-size="9.00" class="sc-notoserifcjksc">前模型的结果可能与以往系统卡中的结果存在差异。注：</text><text x="297.00 303.29 305.74 310.33 315.70 321.08 325.96 328.33 336.46 341.25 344.74 350.13 355.39 359.56 361.93" y="585.85" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="369.20" y="585.85" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="380.57 385.14 389.78 395.02 397.47 402.35 404.71" y="585.85" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="411.98" y="585.85" font-size="9.00" class="sc-notoserifcjksc">的结果在图中显示为</text><text x="492.98 496.58 501.88 508.09 512.54" y="585.85" font-size="9.00" class="sc-loraregular">“n/a”</text><text x="515.68" y="585.85" font-size="9.00" class="sc-notoserifcjksc">，因</text><text x="72.00" y="597.55" font-size="9.00" class="sc-notoserifcjksc">为这些模型已</text><text x="126.00" y="597.55" font-size="9.00" class="sc-notoserifcjksc" fill="#0000ff">应美国政府的出口管制指令而下线</text><text x="261.00" y="597.55" font-size="9.00" class="sc-notoserifcjksc">，因此未纳入我们更新后的追踪与监视评估。</text><text x="72.00" y="669.30" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.39" y="669.30" font-size="11.00" class="sc-loraregular">API</text><text x="105.97" y="669.30" font-size="11.00" class="sc-notoserifcjksc">无系统提示词条件下的多轮测试中，</text><text x="281.97 288.21 294.64 301.32 307.99 313.88 318.14 321.03" y="669.30" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="329.92" y="669.30" font-size="11.00" class="sc-notoserifcjksc">的结果与</text><text x="376.81 384.50 387.49 393.10 399.67 406.25 412.21 415.10 421.34 427.77 434.45 441.13 447.01 451.27 454.16 460.12 462.72" y="669.30" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="471.97" y="669.30" font-size="11.00" class="sc-notoserifcjksc">大体相当，大</text><text x="72.00" y="684.92" font-size="11.00" class="sc-notoserifcjksc">多数类别处于误差范围之内，或</text><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="126.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="126.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="135.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="135.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="144.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="144.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="153.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="153.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="162.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="162.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="171.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="171.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="180.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="180.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="189.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="189.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="198.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="198.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="207.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="207.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="216.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="216.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="225.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="225.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="234.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="234.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="243.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="243.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="252.00" y="590.35" width="0.00" height="9.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/fable-mythos-access" rel="noopener"><rect x="252.00" y="590.35" width="9.00" height="9.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p040.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 40 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">有所改进。在</text><text x="140.89 146.74 149.74 155.35 161.91 168.49 174.45 177.16 182.84" y="82.63" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="188.82" y="82.63" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="210.82 217.06 223.49 230.17 236.85 242.73 246.99 249.88" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="258.77" y="82.63" font-size="11.00" class="sc-notoserifcjksc">在所有测试类别中均达到或超过</text><text x="415.66 421.90 428.33 435.01 441.69 447.57 451.83 454.72 460.69 463.28" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="469.64" y="82.63" font-size="11.00" class="sc-notoserifcjksc">。我们将在下</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">文第</text><text x="96.89" y="98.25" font-size="11.00" class="sc-loraregular">4.1.4</text><text x="121.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">节讨论值得注意的定性观察。</text><text x="72.00" y="129.54" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.1.4</text><text x="103.75" y="129.54" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">有害请求评估讨论</text><text x="72.00" y="157.43" font-size="11.00" class="sc-notoserifcjksc">除上文报告的定量指标外，我们的内部政策专家还审阅了各领域的底层对话记录，以识别</text><text x="503.89 511.58 514.57 520.18 526.75 533.33" y="157.43" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="173.05" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="173.05" font-size="11.00" class="sc-notoserifcjksc">相对于</text><text x="155.84 163.53 166.52 172.13 178.70 185.28 191.24 194.13 200.37 206.81 213.48 220.16 226.04 230.30 233.19 239.16 241.75" y="173.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="251.00" y="173.05" font-size="11.00" class="sc-notoserifcjksc">在行为上的定性变化。此处我们讨论观察到的主要主题；儿</text><text x="72.00" y="188.67" font-size="11.00" class="sc-notoserifcjksc">童安全和心理健康将分别在第</text><text x="217.89" y="188.67" font-size="11.00" class="sc-loraregular">4.2</text><text x="235.36" y="188.67" font-size="11.00" class="sc-notoserifcjksc">节和第</text><text x="271.25" y="188.67" font-size="11.00" class="sc-loraregular">4.3</text><text x="288.94" y="188.67" font-size="11.00" class="sc-notoserifcjksc">节中更深入地讨论。</text><text x="72.00" y="254.59" font-size="11.00" class="sc-notoserifcjksc">我们的专家注意到的一项改进，是</text><text x="239.89 246.13 252.57 259.24 265.92 271.80 276.06 278.95" y="254.59" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="287.84" y="254.59" font-size="11.00" class="sc-notoserifcjksc">在应对潜在有害请求时的介入时机与分寸。在网络安</text><text x="72.00" y="285.83" font-size="11.00" class="sc-notoserifcjksc">询问所请求的产出物最终将被用于何处。相比之下，</text><text x="325.00 332.69 335.68 341.29 347.86 354.44 360.40 363.29 369.53 375.96 382.64 389.32 395.20 399.46 402.35 408.31 410.91" y="285.83" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="420.16" y="285.83" font-size="11.00" class="sc-notoserifcjksc">更常逐步提供协助，直</text><text x="72.00" y="301.45" font-size="11.00" class="sc-notoserifcjksc">到出现明显有害的步骤为止。我们还观察到，当</text><text x="305.89 312.13 318.57 325.24 331.92 337.80 342.06 344.95" y="301.45" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="353.84" y="301.45" font-size="11.00" class="sc-notoserifcjksc">处理边界请求时，它更清晰地区分了构</text><text x="72.00" y="332.69" font-size="11.00" class="sc-notoserifcjksc">像分类体系，但拒绝了后续实际应用该分类体系对社交媒体帖子进行分类的步骤。</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="432.70" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="119.95" y="432.70" font-size="11.00" class="sc-notoserifcjksc">尚有改进空间的一个方面，是它如何解释其拒绝的理由。例如，在影响力行动测试中，</text><text x="72.00" y="448.32" font-size="11.00" class="sc-notoserifcjksc">该模型有时将拒绝建立在实际层面的考量上（即该计划为何不会成功），而非原则层面的考量上</text><text x="72.00" y="463.94" font-size="11.00" class="sc-notoserifcjksc">（即该请求为何可能有害）。在一个测试用例中，</text><text x="314.00 320.24 326.67 333.35 340.03 345.91 350.17 353.06" y="463.94" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="361.95" y="463.94" font-size="11.00" class="sc-notoserifcjksc">拒绝请求的理由是协同账号网络会被</text><text x="72.00" y="479.56" font-size="11.00" class="sc-notoserifcjksc">平台发现并移除，而没有以该请求潜在的有害性质作为拒绝的依据。</text><text x="72.00" y="562.23" font-size="11.00" class="sc-notoserifcjksc">在暴力极端主义测试中，</text><text x="193.00 199.24 205.67 212.35 219.03 224.91 229.17 232.06" y="562.23" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="240.95" y="562.23" font-size="11.00" class="sc-notoserifcjksc">在涉及激进化、物质支持和为暴力正名的主题上表现良好。然</text><text x="72.00" y="577.85" font-size="11.00" class="sc-notoserifcjksc">而，在该领域内的少数提示上，</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06" y="577.85" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="273.95" y="577.85" font-size="11.00" class="sc-notoserifcjksc">比</text><text x="287.84 294.08 300.51 307.19 313.87 319.75 324.01 326.90 332.87 335.46" y="577.85" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="344.71" y="577.85" font-size="11.00" class="sc-notoserifcjksc">更愿意以所请求人设的口吻撰写具有说</text><text x="72.00" y="593.47" font-size="11.00" class="sc-notoserifcjksc">服力的内容，而不是将请求重新表述为对该主题的分析性解释。这一行为在</text><text x="437.89 443.74 446.74 452.35 458.91 465.49 471.45 474.16 479.84" y="593.47" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="485.82" y="593.47" font-size="11.00" class="sc-notoserifcjksc">上得到了缓</text><text x="72.00" y="609.09" font-size="11.00" class="sc-notoserifcjksc">解。</text><text x="72.00" y="660.77" font-size="14.00" class="sc-poppinssemibold">4.2</text><text x="96.26" y="660.77" font-size="14.00" class="sc-notosanscjkscbold">儿童安全评估</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.10 115.78" y="687.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude.ai</text><text x="121.76" y="687.35" font-size="11.00" class="sc-notoserifcjksc">是我们面向消费者的产品，仅向</text><text x="278.66" y="687.35" font-size="11.00" class="sc-loraregular">18</text><text x="291.74" y="687.35" font-size="11.00" class="sc-notoserifcjksc">岁及以上的用户开放。我们持续致力于在以下环节</text><text x="72.00" y="702.97" font-size="11.00" class="sc-notoserifcjksc">中落实稳健的儿童安全措施：开发、部署，以及</text><a href="http://claude.ai/" rel="noopener"><rect x="140.89" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="140.89" y="73.83" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="437.89" y="584.67" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="437.89" y="584.67" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="72.00" y="678.55" width="46.87" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p041.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 41 页"><text x="75.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="150.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮有害请求</text><text x="150.25" y="195.19" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="150.25 157.59 164.55" y="251.18" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="168.81" y="251.18" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="249.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="249.25" y="195.19" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="348.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮有害请求</text><text x="348.25" y="195.19" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="447.25" y="179.58" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="447.25" y="195.19" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">维护。我们所有服务未成年人的企业客户都必须遵守我们</text><text x="347.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">使用政策</text><text x="391.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">下的</text><text x="413.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">额外保障措施</text><text x="479.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="131.20" font-size="11.00" class="sc-notoserifcjksc">我们按照与近期模型（包括</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 253.92 260.49 267.05 272.1 "9.00" class="sc-loraregular">Mythos Preview</text><text x="308.08" y="463.95" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="328.45 333.02 337.66 342.90 345.35 350.23 352.59" y="463.95" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="359.87" y="463.95" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="416.23 421.02 423.47 428.06 433.43 438.81 443.69 445.90 450.55" y="463.95" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="455.45" y="463.95" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不</text><text x="72.00" y="475.65" font-size="9.00" class="sc-notoserifcjksc">报告它们搭配系统提示词时的结果。</text><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="347.00" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="347.00" y="73.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="358.00" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="358.00" y="73.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="369.00" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="369.00" y="73.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="380.00" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/legal/aup" rel="noopener"><rect x="380.00" y="73.83" width="11.00" height="11.00" fill="transparent"/></a><a href="https://support.claude.com/en/articles/9307344-responsible-use-of-anthropic-s-models-guidelines-for-organizations-serving-minors" rel="noopener"><rect x="413.00" y="73.83" width="0.00" height="11.00" fill="tr <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p042.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 42 页"><text x="74.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="184.75" y="88.63" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="184.75 192.09 199.05" y="132.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="203.31" y="132.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="365.50" y="88.63" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="321.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.66 100.76 106.29" y="321.49" font-size="9.00" class="sc-lorabold">4.2.B]</text><text x="112.13" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">儿童安全多轮评估结果。</text><text x="211.13" y="321.49" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="319.13" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="337.13" y="321.49" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线</text><text x="72.00" y="333.19" font-size="9.00" class="sc-notoserifcjksc">标出。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="378.00 386.13 390.92 394.41 399.80 405.06 409.23 411.60" y="333.19" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="418.87" y="333.19" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="430.24 438.36 443.16 446.64 452.03 457.30 461.47 463.83 469.29 473.12 477.95 482.50 485.03 489.87" y="333.19" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="497.08" y="333.19" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="517.45 522.02 526.66 531.90 534.35" y="333.19" font-size="9.00" class="sc-loraregular">Fable</text><text x="72.00" y="344.89" font-size="9.00" class="sc-loraregular">5</text><text x="79.27" y="344.89" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="135.64 140.43 142.88 147.46 152.84 158.22 163.10 165.31 169.96" y="344.89" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="174.85" y="344.89" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告它们搭配系统提示词时的结果。</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">无论是在不使用系统提示词的情况下，还是在使用</text><text x="316.89 322.74 325.74 331.35 337.91 344.49 350.45 353.16 358.84" y="400.30" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="364.82" y="400.30" font-size="11.00" class="sc-notoserifcjksc">所用系统提示词的情况下，</text><text x="496.82 504.51 507.50 513.11 519.68 526.26" y="400.30" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06" y="415.92" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">端上都略有升高，在</text><text x="173.89 179.74 182.74 188.35 194.91 201.49 207.45 210.16 215.84" y="431.54" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">内容审核请求）更为谨慎。在不使用系统提示词的情况下，多轮评估结果与</text><text x="437.89 444.13 450.57 457.24 463.92 469.80 474.06 476.95 482.92 485.51" y="447.16" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="494.76" y="447.16" font-size="11.00" class="sc-notoserifcjksc">相比处于</text><text x="72.00" y="462.78" font-size="11.00" class="sc-notoserifcjksc">误差范围之内；而在</text><text x="173.89 179.74 182.74 188.35 194.91 201.49 207.45 210.16 215.84" y="462.78" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="221.82" y="462.78" font-size="11.00" class="sc-notoserifcjksc">上测试时则显示出显著改进（恰当回应率</text><text x="422.71" y="462.78" font-size="11.00" class="sc-loraregular">96%</text><text x="447.89" y="462.78" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="472.79" y="462.78" font-size="11.00" class="sc-loraregular">85%</text><text x="494.53" y="462.78" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="529.83" font-size="11.00" class="sc-notoserifcjksc">总体而言，</text><text x="127.00 133.24 139.67 146.35 153.03 158.91 163.17 166.06" y="529.83" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="174.95" y="529.83" font-size="11.00" class="sc-notoserifcjksc">的儿童安全行为与</text><text x="265.84 273.53 276.52 282.13 288.70 295.28 301.24 304.13 310.37 316.81 323.48 330.16 336.04 340.30 343.19 349.16 351.75" y="529.83" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="361.00" y="529.83" font-size="11.00" class="sc-notoserifcjksc">相当或更好。内部政策专家指出，与</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="545.45" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87" y="545.45" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="161.87 168.11 174.54 181.22 187.90 193.78 198.04 200.93" y="545.45" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="209.82" y="545.45" font-size="11.00" class="sc-notoserifcjksc">倾向于更明确地拒绝明显有害的请求。在一项测试模型是否愿意协助</text><text x="72.00" y="561.07" font-size="11.00" class="sc-notoserifcjksc">完成与儿童性虐待材料和未经同意的私密影像（</text><text x="303.00 309.68 316.11 322.79 328.17 333.96 340.40 347.08 352.17 358.13 364.81 369.90 376.47 382.14 385.14 388.03 391.12 397.70 401.96 405.05 414.88 420.48 424.74 430.70 433.59 436.68 446.52 452.19 458.22 464.18 469.13" y="561.07" font-size="11.00" class="sc-loraregular">non-consensual intimate imagery</text><text x="474.94" y="561.07" font-size="11.00" class="sc-notoserifcjksc">）相关的技术</text><text x="72.00" y="576.69" font-size="11.00" class="sc-notoserifcjksc">任务的实验性评估中，</text><text x="182.00 188.24 194.67 201.35 208.03 213.91 218.17 221.06" y="576.69" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="229.95" y="576.69" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="254.84 261.08 267.51 274.19 280.87 286.75 291.01 293.90 299.87 302.46" y="576.69" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="311.71" y="576.69" font-size="11.00" class="sc-notoserifcjksc">也表现出小幅改进。然而，当这些请求可能被</text><text x="72.00" y="607.93" font-size="11.00" class="sc-notoserifcjksc">评估中需要改进的主要方面，在很大程度上已由</text><text x="305.89 313.58 316.57 322.18 328.75 335.33 341.29 344.18 351.87 358.20 366.88 373.31 378.03" y="607.93" font-size="11.00" class="sc-loraregular">Claude Cowork</text><text x="386.83" y="607.93" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="400.72 408.41 411.41 417.02 423.58 430.16 436.12 439.02 446.70 453.14 459.72" y="607.93" font-size="11.00" class="sc-loraregular">Claude Code</text><text x="468.57" y="607.93" font-size="11.00" class="sc-notoserifcjksc">的产品运行框</text><text x="72.00" y="623.55" font-size="11.00" class="sc-notoserifcjksc">架（</text><text x="94.00" y="623.55" font-size="11.00" class="sc-loraregular">harness</text><text x="133.85" y="623.55" font-size="11.00" class="sc-notoserifcjksc">）加以解决。</text><text x="72.00" y="691.75" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89 92.78 99.39" y="691.75" font-size="11.00" class="sc-loraregular">API</text><text x="105.97" y="691.75" font-size="11.00" class="sc-notoserifcjksc">模型上进行的多轮测试发现了一些有待改进的方面。其中大多数是未能达到理想行为的回</text><a href="http://claude.ai/" rel="noopener"><rect x="316.89" y="391.50" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="316.89" y="391.50" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="173.89" y="422.74" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="173.89" y="422.74" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="173.89" y="453.98" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="173.89" y="453.98" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p043.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 43 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">给出过于具体的建议，而非被我们内部专家的定性审查认定为具有实际危害的回应。对有害请求</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">的良性包装偶尔会导致</text><text x="184.89 192.58 195.57 201.18 207.75 214.33" y="98.25" font-size="11.00" class="sc-loraregular">Claude</text><text x="223.18" y="98.25" font-size="11.00" class="sc-notoserifcjksc">提供与性诱骗相关的信息；这些情况集中出现在</text><text x="457.08 463.96 470.57" y="98.25" font-size="11.00" class="sc-loraregular">API</text><text x="477.15" y="98.25" font-size="11.00" class="sc-notoserifcjksc">模型上，并</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">已通过</text><text x="107.89 113.75 116.74 122.35 128.91 135.49 141.45 144.16 149.84" y="113.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="155.82" y="113.87" font-size="11.00" class="sc-notoserifcjksc">系统提示词得到缓解。总体而言，当前的</text><text x="356.71 362.57 365.56 371.17 377.73 384.31 390.27 392.98 398.66" y="113.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="404.64" y="113.87" font-size="11.00" class="sc-notoserifcjksc">系统提示词解决了儿童安全</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">领域中大多数核心的模型层面问题，不过我们观察到，它有时对虚构和创作类包装更为宽容。</text><text x="72.00" y="212.16" font-size="11.00" class="sc-notoserifcjksc">我们正在评估对</text><text x="151.89 157.74 160.74 166.35 172.91 179.49 185.45 188.16 193.84" y="212.16" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="199.82" y="212.16" font-size="11.00" class="sc-notoserifcjksc">系统提示词的潜在更新，以解决上述遗留问题，包括在虚构或创作性包</text><text x="72.00" y="227.78" font-size="11.00" class="sc-notoserifcjksc">装下出现的问题。与此同时，我们正在继续开发额外的检测和安全防护措施，以进一步缓解技术</text><text x="72.00" y="243.40" font-size="11.00" class="sc-notoserifcjksc">滥用以及更广泛的儿童安全领域中的风险。</text><text x="72.00" y="294.51" font-size="14.00" class="sc-poppinssemibold">4.3</text><text x="96.61" y="294.51" font-size="14.00" class="sc-notosanscjkscbold">心理健康评估</text><text x="72.00" y="331.61" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.1</text><text x="102.94" y="331.61" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自杀与自伤</text><text x="72.00 79.69 82.68 88.29 94.86 101.44" y="359.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="110.29" y="359.51" font-size="11.00" class="sc-notoserifcjksc">不能替代专业建议或医疗护理，也不用于诊断或治疗任何疾病。我们的每个</text><text x="476.18 483.87 486.87 492.48 499.04 505.62" y="359.51" font-size="11.00" class="sc-loraregular">Claude</text><text x="514.48" y="359.51" font-size="11.00" class="sc-notoserifcjksc">模型</text><text x="72.00" y="390.75" font-size="11.00" class="sc-notoserifcjksc">同理心和关怀作出回应，同时在可能的情况下引导用户寻求真人支持：求助热线、心理健康专业</text><text x="72.00" y="406.37" font-size="11.00" class="sc-notoserifcjksc">人士，或值得信赖的朋友或家人。</text><text x="72.00" y="472.85" font-size="11.00" class="sc-notoserifcjksc">这些评估考察</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="472.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="472.85" font-size="11.00" class="sc-notoserifcjksc">对涉及自杀与自伤的对话的回应，衡量模型能否对可能表明存在风险的提</text><text x="72.00" y="488.47" font-size="11.00" class="sc-notoserifcjksc">示词作出安全且具支持性的回应，同时在同一领域的良性请求上保持有用性。我们报告单轮无害</text><text x="72.00" y="504.09" font-size="11.00" class="sc-notoserifcjksc">回应率、单轮过度拒绝率和多轮恰当回应率。</text><a href="http://claude.ai/" rel="noopener"><rect x="107.89" y="105.07" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="107.89" y="105.07" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="356.71" y="105.07" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="356.71" y="105.07" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="151.89" y="203.36" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="151.89" y="203.36" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p044.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 44 页"><text x="73.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="160.75" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="160.75" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="160.75 168.09 175.05" y="160.22" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="179.31" y="160.22" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="260.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="260.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="354.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="354.25" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="454.00" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="454.00" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="417.23" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="417.23" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="417.23" font-size="9.00" class="sc-lorabold">4.3.1.A]</text><text x="118.12" y="417.23" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤单轮评估结果。</text><text x="226.12" y="417.23" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越</text><text x="72.00" y="428.93" font-size="9.00" class="sc-notoserifcjksc">好；拒绝率越低越好。</text><text x="162.00" y="428.93" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="180.00" y="428.93" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结</text><text x="72.00" y="440.63" font-size="9.00" class="sc-notoserifcjksc">果与以往系统卡中的结果存在差异。</text><text x="216.00 224.13 228.92 232.41 237.80 243.06 247.23 249.60" y="440.63" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="256.87" y="440.63" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="268.24 276.36 281.16 284.64 290.03 295.30 299.47 301.83 307.29 311.12 315.95 320.50 323.03 327.87" y="440.63" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="335.08" y="440.63" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="355.45 360.02 364.66 369.90 372.35 377.23 379.59" y="440.63" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="386.87" y="440.63" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="443.23 448.02 450.47 455.06 460.43 465.81 470.69 472.90 477.55" y="440.63" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="482.45" y="440.63" font-size="9.00" class="sc-notoserifcjksc">上使用，因此</text><text x="72.00" y="452.33" font-size="9.00" class="sc-notoserifcjksc">我们不报告它们搭配系统提示词时的结果。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p045.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 45 页"><text x="74.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="185.50" y="88.63" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="185.50 192.84 199.80" y="132.12" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="204.06" y="132.12" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="366.25" y="88.63" font-size="11.00" class="sc-notoserifcjkscbold" fill="#ffffff">多轮评估（恰当回应率）</text><text x="72.00" y="321.49" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 104.65 106.75 112.28" y="321.49" font-size="9.00" class="sc-lorabold">4.3.1.B]</text><text x="118.12" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">自杀与自伤多轮评估结果。</text><text x="226.12" y="321.49" font-size="9.00" class="sc-notoserifcjksc">多轮恰当回应率越高越好。</text><text x="334.12" y="321.49" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="352.12" y="321.49" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下</text><text x="72.00" y="333.19" font-size="9.00" class="sc-notoserifcjksc">划线标出。由于常规评估更新，先前模型的结果与以往系统卡中的结果存在差异。</text><text x="396.00 404.13 408.92 412.41 417.80 423.06 427.23 429.60" y="333.19" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="436.87" y="333.19" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="448.24 456.36 461.16 464.64 470.03 475.30 479.47 481.83 487.29 491.12 495.95 500.50 503.03 507.87" y="333.19" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="515.08" y="333.19" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="72.00 76.57 81.22 86.45 88.90 93.78 96.15" y="344.89" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="103.42" y="344.89" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="159.79 164.57 167.02 171.61 176.99 182.37 187.24 189.46 194.10" y="344.89" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="199.00" y="344.89" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们不报告它们在使用系统提示词情况下的结果。</text><text x="72.00" y="400.30" font-size="11.00" class="sc-notoserifcjksc">在自杀与自伤领域中含有潜在风险的单轮请求上，</text><text x="314.00 321.69 324.68 330.29 336.86 343.44 349.40 352.29 358.53 364.96 371.64 378.32 384.20 388.46 391.35" y="400.30" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="400.24" y="400.30" font-size="11.00" class="sc-notoserifcjksc">保持了较高的无害回应率，</text><text x="72.00" y="415.92" font-size="11.00" class="sc-notoserifcjksc">并且几乎从未对良性请求过度拒绝。与</text><text x="261.89 268.13 274.57 281.24 287.92 293.80 298.06 300.95 306.92 309.51" y="415.92" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="318.76" y="415.92" font-size="11.00" class="sc-notoserifcjksc">相比，其在</text><text x="376.66 383.54 390.15" y="415.92" font-size="11.00" class="sc-loraregular">API</text><text x="396.73" y="415.92" font-size="11.00" class="sc-notoserifcjksc">上的无害回应率略有下降，这</text><text x="72.00" y="431.54" font-size="11.00" class="sc-notoserifcjksc">可归因于该模型更频繁地提供可能有害的自伤替代方法（例如手握冰块），但在使用默认系统提</text><text x="72.00" y="447.16" font-size="11.00" class="sc-notoserifcjksc">示词的</text><text x="107.89 113.75 116.74 122.35 128.91 135.49 141.45 144.16 149.84" y="447.16" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="155.82" y="447.16" font-size="11.00" class="sc-notoserifcjksc">中，这一行为得到了缓解。在多轮评估中，</text><text x="364.82 371.06 377.49 384.17 390.85 396.73 400.99 403.88" y="447.16" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="412.77" y="447.16" font-size="11.00" class="sc-notoserifcjksc">相比</text><text x="437.66 443.90 450.33 457.01 463.69 469.57 473.83 476.72 482.69 485.28" y="447.16" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="494.53" y="447.16" font-size="11.00" class="sc-notoserifcjksc">出现了统</text><text x="72.00" y="462.78" font-size="11.00" class="sc-notoserifcjksc">计学上不显著的退步；与</text><text x="195.89 202.78 209.39" y="462.78" font-size="11.00" class="sc-loraregular">API</text><text x="215.97" y="462.78" font-size="11.00" class="sc-notoserifcjksc">模型相比，其在</text><text x="295.86 301.71 304.71 310.32 316.88 323.46 329.42 332.13 337.80" y="462.78" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="343.79" y="462.78" font-size="11.00" class="sc-notoserifcjksc">上有明显改进（恰当回应率</text><text x="478.68" y="462.78" font-size="11.00" class="sc-loraregular">90%</text><text x="504.33" y="462.78" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="72.00" y="478.40" font-size="11.00" class="sc-loraregular">63%</text><text x="94.06" y="478.40" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="562.22" font-size="11.00" class="sc-notoserifcjksc">总体而言，内部政策专家认为，</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06" y="562.22" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="273.95" y="562.22" font-size="11.00" class="sc-notoserifcjksc">对这类对话的处理在定性层面上与</text><text x="441.84 449.53 452.52 458.13 464.70 471.28 477.24 480.13 486.37 492.80 499.48 506.16 512.04 516.30 519.19 525.16 527.75" y="562.22" font-size="11.00" class="sc-loraregular">Claude Sonnet 4.6</text><text x="72.00" y="577.84" font-size="11.00" class="sc-notoserifcjksc">相当。最明显的改进之一体现在</text><text x="228.89 235.13 241.57 248.24 254.92 260.80 265.06 267.95" y="577.84" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="276.84" y="577.84" font-size="11.00" class="sc-notoserifcjksc">的危机应对姿态上：与</text><text x="389.74 395.97 402.41 409.08 415.76 421.65 425.90 428.80 434.76 437.35" y="577.84" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="446.61" y="577.84" font-size="11.00" class="sc-notoserifcjksc">相比，它会在对话</text><text x="72.00" y="593.46" font-size="11.00" class="sc-notoserifcjksc">中更早地提供求助资源。此外，</text><text x="226.00 232.24 238.67 245.35 252.03 257.91 262.17 265.06" y="593.46" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="273.95" y="593.46" font-size="11.00" class="sc-notoserifcjksc">更不容易把自己定位为危机热线的替代选择，也更少作</text><text x="204.00" y="609.08" font-size="11.00" class="sc-loraregular">“</text><text x="208.40" y="609.08" font-size="11.00" class="sc-notoserifcjksc">我哪儿也不去</text><text x="274.40" y="609.08" font-size="11.00" class="sc-loraregular">”</text><text x="278.24" y="609.08" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="659.37" font-size="11.00" class="sc-notoserifcjksc">一个有待改进的方面是</text><text x="184.89 191.13 197.57 204.24 210.92 216.80 221.06 223.95" y="659.37" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="232.84" y="659.37" font-size="11.00" class="sc-notoserifcjksc">如何将对话早期出现的痛苦信号延续到后续轮次中。在部分评估</text><text x="72.00" y="690.61" font-size="11.00" class="sc-notoserifcjksc">轮次不直接包含这一信号、但可能</text><a href="http://claude.ai/" rel="noopener"><rect x="107.89" y="438.36" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="107.89" y="438.36" width="45.03" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="295.86" y="453.98" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="295.86" y="453.98" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p046.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 46 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">仍会引出与潜在自杀方式相关的信息时。</text><text x="270.00 276.24 282.67 289.35 296.03 301.91 306.17 309.06" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="317.95" y="82.63" font-size="11.00" class="sc-notoserifcjksc">识别出风险语境的比率与</text><text x="441.84 448.08 454.51 461.19 467.87 473.75 478.01 480.90 486.87 489.46" y="82.63" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="498.71" y="82.63" font-size="11.00" class="sc-notoserifcjksc">相近。</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">然而，它在对话后期依据这一觉察采取行动方面不够一致，并且比</text><text x="393.89 400.13 406.57 413.24 419.92 425.80 430.06 432.95 438.92 441.51" y="98.25" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="450.76" y="98.25" font-size="11.00" class="sc-notoserifcjksc">更常在后续回应中</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">给出与方式相关的细节。这一行为可通过</text><text x="272.89 278.75 281.74 287.35 293.91 300.49 306.45 309.16 314.84" y="113.87" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="320.82" y="113.87" font-size="11.00" class="sc-notoserifcjksc">中的默认系统提示词得到缓解，但仍是模型层</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">面有待进一步改进的方面。我们还观察到，模型引入用户未曾透露的诊断标签（通常是抑郁症）</text><text x="72.00" y="145.11" font-size="11.00" class="sc-notoserifcjksc">的倾向有所增加。这一行为在</text><text x="217.89 225.58 228.57 234.18 240.75 247.33 253.29 256.18 261.77 267.45 273.85 276.84 282.80 285.70 291.69 294.59 302.23 305.12 312.81 315.80 321.41 327.98 334.56 340.52 343.41 353.35 359.21 363.47 370.06 376.49 381.58 384.48" y="145.11" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Fable 5 &amp; Claude Mythos 5</text><text x="393.37" y="145.11" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="426.37" y="145.11" font-size="11.00" class="sc-notoserifcjksc">中也有提及，但我们发</text><text x="72.00" y="160.73" font-size="11.00" class="sc-notoserifcjksc">现在</text><text x="96.89 103.13 109.57 116.24 122.92 128.80 133.06 135.95" y="160.73" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="144.84" y="160.73" font-size="11.00" class="sc-notoserifcjksc">上，它更难通过系统提示词加以缓解。</text><text x="72.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc">我们持续在模型、系统提示词以及额外安全防护措施等方面投入缓解措施，其中包括我们的</text><text x="512.00" y="244.55" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">危机</text><text x="72.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">求助横幅</text><text x="116.00" y="260.17" font-size="11.00" class="sc-notoserifcjksc">，它会在</text><text x="162.89 168.74 171.74 177.35 183.91 190.49 196.45 199.16 204.84" y="260.17" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="210.82" y="260.17" font-size="11.00" class="sc-notoserifcjksc">的相关对话中出现。我们鼓励基于</text><text x="378.71 385.60 392.21" y="260.17" font-size="11.00" class="sc-loraregular">API</text><text x="398.79" y="260.17" font-size="11.00" class="sc-notoserifcjksc">进行开发的开发者在任何用</text><text x="72.00" y="275.79" font-size="11.00" class="sc-notoserifcjksc">户可能处于痛苦状态的部署中采用类似的系统提示词表述。尽管系统提示词并不能解决上文所述</text><text x="72.00" y="291.41" font-size="11.00" class="sc-notoserifcjksc">的每一种行为，但在我们的评估中，它能显著改善模型在潜在有害对话中的表现。</text><text x="72.00" y="356.22" font-size="13.00" class="sc-poppinssemibold" fill="#666666">4.3.2</text><text x="105.70" y="356.22" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">进食紊乱</text><text x="72.00" y="384.12" font-size="11.00" class="sc-notoserifcjksc">这些评估考察</text><text x="140.89 148.58 151.57 157.18 163.75 170.33" y="384.12" font-size="11.00" class="sc-loraregular">Claude</text><text x="179.18" y="384.12" font-size="11.00" class="sc-notoserifcjksc">如何处理有关进食紊乱的对话，衡量它能否避免强化具有潜在风险的请</text><text x="72.00" y="399.74" font-size="11.00" class="sc-notoserifcjksc">求，同时在有关营养、健身和健康的良性问题上保持有用性。在此，我们分别报告单轮无害回应</text><text x="72.00" y="415.36" font-size="11.00" class="sc-notoserifcjksc">率和过度拒绝率。该领域的多轮测试仍由我们的内部政策专家通过定性审查进行，我们将在下文</text><text x="72.00" y="430.98" font-size="11.00" class="sc-notoserifcjksc">讨论相关观察结果。</text><a href="http://claude.ai/" rel="noopener"><rect x="272.89" y="105.07" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="272.89" y="105.07" width="45.03" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="217.89" y="136.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="217.89" y="136.31" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="253.29" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="256.18" y="136.31" width="26.62" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="282.80" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="285.70" y="136.31" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="291.69" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="294.59" y="136.31" width="7.64" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="302.23" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="305.12" y="136.31" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="340.52" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="343.41" y="136.31" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="381.58" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="384.48" y="136.31" width="5.99" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="390.47" y="136.31" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="393.37" y="136.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="404.37" y="136.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="404.37" y="136.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="415.37" y="136.31" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/d00db56fa754a1b115b6dd7cb2e3c342ee809620.pdf" rel="noopener"><rect x="415.37" y="136.31" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="512.00" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="512.00" y="235.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="523.00" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="523.00" y="235.75" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="534.00" y="235.75" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="72.00" y="251.37" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="83.00" y="251.37" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="83.00" y="251.37" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="94.00" y="251.37" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="94.00" y="251.37" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="105.00" y="251.37" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/news/protecting-well-being-of-users" rel="noopener"><rect x="105.00" y="251.37" width="11.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="162.89" y="251.37" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="162.89" y="251.37" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p047.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 47 页"><text x="75.25" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">模型</text><text x="149.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="149.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="149.50 156.84 163.80" y="160.22" font-size="10.99" class="sc-lorabold" fill="#ffffff">API</text><text x="168.06" y="160.22" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">，不使用系统提示词</text><text x="248.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="248.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="347.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮潜在风险请求</text><text x="347.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（无害率）</text><text x="446.50" y="88.62" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">单轮良性请求</text><text x="446.50" y="104.23" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">（拒绝率）</text><text x="72.00" y="430.39" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="430.39" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.76 93.86 98.90 101.00 105.79 107.89 113.43" y="430.39" font-size="9.00" class="sc-lorabold">4.3.2.A]</text><text x="119.27" y="430.39" font-size="9.00" class="sc-notoserifcjkscbold">进食紊乱单轮评估结果。</text><text x="218.27" y="430.39" font-size="9.00" class="sc-notoserifcjksc">单轮有害请求与良性请求的评估结果涵盖所有测试语言。单轮无害率越高越好；</text><text x="72.00" y="442.09" font-size="9.00" class="sc-notoserifcjksc">拒绝率越低越好。</text><text x="144.00" y="442.09" font-size="9.00" class="sc-notoserifcjkscbold">加粗</text><text x="162.00" y="442.09" font-size="9.00" class="sc-notoserifcjksc">表示各类别中表现最佳的模型，次优分数以下划线标出。由于常规评估更新，先前模型的结果与</text><text x="72.00" y="453.79" font-size="9.00" class="sc-notoserifcjksc">以往系统卡中的结果存在差异。</text><text x="198.00 206.13 210.92 214.41 219.80 225.06 229.23 231.60" y="453.79" font-size="9.00" class="sc-loraregular">Mythos 5</text><text x="238.87" y="453.79" font-size="9.00" class="sc-notoserifcjksc">和</text><text x="250.24 258.36 263.16 266.64 272.03 277.30 281.47 283.83 289.29 293.12 297.95 302.50 305.03 309.87" y="453.79" font-size="9.00" class="sc-loraregular">Mythos Preview</text><text x="317.08" y="453.79" font-size="9.00" class="sc-notoserifcjksc">（与</text><text x="337.45 342.02 346.66 351.90 354.35 359.23 361.59" y="453.79" font-size="9.00" class="sc-loraregular">Fable 5</text><text x="368.87" y="453.79" font-size="9.00" class="sc-notoserifcjksc">不同）无法在</text><text x="425.23 430.02 432.47 437.06 442.43 447.81 452.69 454.90 459.55" y="453.79" font-size="9.00" class="sc-loraregular">claude.ai</text><text x="464.45" y="453.79" font-size="9.00" class="sc-notoserifcjksc">上使用，因此我们</text><text x="72.00" y="465.49" font-size="9.00" class="sc-notoserifcjksc">不报告它们搭配系统提示词时的结果。</text><text x="72.00 79.69 82.68 88.29 94.86 101.44 107.40 110.29 116.53 122.96 129.64 136.32 142.20 146.46 149.35" y="522.45" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="158.24" y="522.45" font-size="11.00" class="sc-notoserifcjksc">在有害请求与无害请求评估中的表现与</text><text x="348.13 354.37 360.80 367.48 374.16 380.04 384.30 387.19 393.16 395.75" y="522.45" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="405.00" y="522.45" font-size="11.00" class="sc-notoserifcjksc">相近，在</text><text x="451.90 457.75 460.74 466.35 472.92 479.49 485.46 488.16 493.84" y="522.45" font-size="11.00" class="sc-loraregular" fill="#0000ff">claude.ai</text><text x="499.82" y="522.45" font-size="11.00" class="sc-notoserifcjksc">产品端</text><text x="72.00" y="538.07" font-size="11.00" class="sc-notoserifcjksc">的有害请求上略有改进（</text><text x="193.00 199.36 205.54 208.25 214.24 220.24" y="538.07" font-size="11.00" class="sc-loraregular">99.55%</text><text x="232.70" y="538.07" font-size="11.00" class="sc-notoserifcjksc">对比</text><text x="257.59 263.95 270.13 272.73 279.09 285.21" y="538.07" font-size="11.00" class="sc-loraregular">98.63%</text><text x="294.78" y="538.07" font-size="11.00" class="sc-notoserifcjksc">）。</text><text x="72.00" y="587.22" font-size="11.00" class="sc-notoserifcjksc">在多轮测试中，我们在</text><text x="184.89 191.13 197.57 204.24 210.92 216.80 221.06 223.95" y="587.22" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="232.84" y="587.22" font-size="11.00" class="sc-notoserifcjksc">上观察到的一项改进是，它作出可能助长对模型情感依赖的表述</text><text x="72.00" y="602.84" font-size="11.00" class="sc-notoserifcjksc">的倾向有所降低。与</text><text x="173.89 180.13 186.57 193.24 199.92 205.80 210.06 212.95 218.92 221.51" y="602.84" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="230.76" y="602.84" font-size="11.00" class="sc-notoserifcjksc">相比，</text><text x="263.76 270.00 276.43 283.11 289.79 295.67 299.93 302.82" y="602.84" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00" y="618.46" font-size="11.00" class="sc-loraregular">4.3.1</text><text x="96.40" y="618.46" font-size="11.00" class="sc-notoserifcjksc">节自杀与自伤测试中观察到的情况类似），也更不容易要求用户稍后回到对话中。然而，我</text><text x="72.00" y="634.08" font-size="11.00" class="sc-notoserifcjksc">们的多轮测试也揭示，模型不必要地引入针对用户个人的饮食数值（例如计算</text><text x="448.89 455.64 465.73" y="634.08" font-size="11.00" class="sc-loraregular">BMI</text><text x="469.42" y="634.08" font-size="11.00" class="sc-notoserifcjksc">、估算基础热</text><text x="72.00" y="649.70" font-size="11.00" class="sc-notoserifcjksc">量需求）的频率略有上升，在用户透露自己存在进食紊乱后提供行为建议的频率也略有上升。这</text><text x="72.00" y="665.32" font-size="11.00" class="sc-notoserifcjksc">些行为通常出现在</text><a href="http://claude.ai/" rel="noopener"><rect x="451.90" y="513.65" width="0.00" height="11.00" fill="transparent"/></a><a href="http://claude.ai/" rel="noopener"><rect x="451.90" y="513.65" width="45.03" height="11.00" fill="transparent"/></a></svg></div>
