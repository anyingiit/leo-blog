="422.13" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74" y="422.13" font-size="11.00" class="sc-notoserifcjksc">系统卡中的结论：我们认为，对原本没有能力开发此类武器的威胁行为者而言，能力提升有限</text><text x="72.00" y="437.75" font-size="11.00" class="sc-notoserifcjksc">（对于已有专业知识的威胁行为者，其武器开发进程能被加快到何种程度，仍存在不确定性）。</text><text x="72.00" y="505.05" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64" y="505.05" font-size="14.00" class="sc-notosanscjkscbold">研究与开发</text><text x="72.00" y="542.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81" y="542.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00" y="570.04" font-size="11.00" class="sc-notoserifcjksc">我们的负责任扩展政策列出了两个与自主</text><text x="272.89" y="570.04" font-size="11.00" class="sc-loraregular">AI</text><text x="286.36" y="570.04" font-size="11.00" class="sc-notoserifcjksc">相关的威胁模型：</text><text x="72.00" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="602.43" font-size="11.00" class="sc-lorabold">1</text><text x="156.36" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="280.25" y="602.43" font-size="11.00" class="sc-lorabold">AI</text><text x="294.75" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="327.75" y="602.43" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="473.64" y="602.43" font-size="11.00" class="sc-loraregular">AI</text><text x="487.11" y="602.43" font-size="11.00" class="sc-notoserifcjksc">系统：它</text><text x="72.00" y="618.05" font-size="11.00" class="sc-notoserifcjksc">们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作和隐蔽手段的能</text><text x="72.00" y="633.67" font-size="11.00" class="sc-notoserifcjksc">力。令人担忧的是，此类系统若被有意或无意地引向有害目标，可能采取未对齐行为，导致后续</text><text x="72.00" y="649.29" font-size="11.00" class="sc-notoserifcjksc">发生全球性灾难的概率不可逆转地大幅上升。</text><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="116.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="116.00" y="296.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="127.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="127.00" y="296.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="138.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="138.00" y="296.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="149.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="149.00" y="296.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="160.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="160.00" y="296.55" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="171.00" y="296.55" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/feb-2026-risk-report" rel="noopener"><rect x="171.00" y="296.55" width="22.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p025.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 25 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="82.63" font-size="11.00" class="sc-lorabold">2</text><text x="157.76" y="82.63" font-size="11.00" class="sc-notoserifcjkscbold">：关键领域的自动化研发带来的风险。</text><text x="344.76" y="82.63" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是能够完全自动化或</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">大幅加速大型顶尖人类研究团队在前沿研究中所做工作的</text><text x="349.89" y="98.25" font-size="11.00" class="sc-loraregular">AI</text><text x="363.36" y="98.25" font-size="11.00" class="sc-notoserifcjksc">系统。其风险在于，某些领域（例如</text><text x="72.00" y="113.87" font-size="11.00" class="sc-notoserifcjksc">能源、机器人、武器开发以及</text><text x="217.89" y="113.87" font-size="11.00" class="sc-loraregular">AI</text><text x="231.36" y="113.87" font-size="11.00" class="sc-notoserifcjksc">本身）的快速进展可能对国际安全构成威胁，和</text><text x="462.36" y="113.87" font-size="11.00" class="sc-loraregular">/</text><text x="469.95" y="113.87" font-size="11.00" class="sc-notoserifcjksc">或破坏全球力</text><text x="72.00" y="129.49" font-size="11.00" class="sc-notoserifcjksc">量平衡。</text><text x="72.00" y="195.97" font-size="11.00" class="sc-lorabold">2.3.1.1 Claude Sonnet 5</text><text x="191.49" y="195.97" font-size="11.00" class="sc-notoserifcjkscbold">如何影响我们最近一份风险报告中的分析</text><text x="72.00" y="228.35" font-size="11.00" class="sc-notoserifcjksc">我们目前的判定是：</text><text x="108.00" y="260.74" font-size="11.00" class="sc-notoserifcjksc">与我们此前的部分</text><text x="198.89" y="260.74" font-size="11.00" class="sc-loraregular">AI</text><text x="212.36" y="260.74" font-size="11.00" class="sc-notoserifcjksc">模型一样，</text><text x="267.36" y="260.74" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="347.25" y="260.74" font-size="11.00" class="sc-lorabold">1</text><text x="354.61" y="260.74" font-size="11.00" class="sc-notoserifcjksc">适用于</text><text x="390.50" y="260.74" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="473.85" y="260.74" font-size="11.00" class="sc-notoserifcjksc">。在我们与自</text><text x="108.00" y="276.36" font-size="11.00" class="sc-notoserifcjksc">主性相关的评估中，</text><text x="207.00" y="276.36" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="254.95" y="276.36" font-size="11.00" class="sc-notoserifcjksc">的能力不及</text><text x="312.84" y="276.36" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="398.19" y="276.36" font-size="11.00" class="sc-notoserifcjksc">，并且它在我们对齐</text><text x="108.00" y="291.98" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="119.00" y="291.98" font-size="11.00" class="sc-loraregular sc-k">alignment</text><text x="170.15" y="291.98" font-size="11.00" class="sc-notoserifcjksc">）评估中的隐蔽率接近于零。因此，我们认为</text><text x="393.04" y="291.98" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="440.99" y="291.98" font-size="11.00" class="sc-notoserifcjksc">不会使该威胁模型下</text><text x="108.00" y="307.60" font-size="11.00" class="sc-notoserifcjksc">的风险水平超出</text><text x="187.89" y="307.60" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="310.77" y="307.60" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="376.77" y="307.60" font-size="11.00" class="sc-notoserifcjksc">（</text><text x="387.77" y="307.60" font-size="11.00" class="sc-loraregular sc-k">Alignment Risk Update</text><text x="504.15" y="307.60" font-size="11.00" class="sc-notoserifcjksc">）中所</text><text x="108.00" y="323.22" font-size="11.00" class="sc-notoserifcjksc">评估的水平。</text><text x="174.00" y="323.22" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="221.95" y="323.22" font-size="11.00" class="sc-notoserifcjksc">将以全面开放的方式发布。自主性威胁模型</text><text x="433.84" y="323.22" font-size="11.00" class="sc-loraregular">1</text><text x="440.74" y="323.22" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="465.63" y="323.22" font-size="11.00" class="sc-loraregular">2.4</text><text x="483.10" y="323.22" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="108.00" y="374.08" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="374.08" font-size="11.00" class="sc-lorabold">2</text><text x="196.65" y="374.08" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="243.54" y="374.08" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="288.60" y="374.08" font-size="11.00" class="sc-notoserifcjksc">。该模型并未推进我们的能力前沿，能力前沿仍由</text><text x="108.00" y="389.70" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="196.24" y="389.70" font-size="11.00" class="sc-notoserifcjksc">界定。我们认为，</text><text x="284.24" y="389.70" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="332.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc">不会改变我们</text><text x="398.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="486.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc">中针对该威</text><text x="108.00" y="405.32" font-size="11.00" class="sc-notoserifcjksc">胁模型所呈现的情况。</text><text x="72.00" y="453.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2</text><text x="104.57" y="453.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于我们判定依据的概要说明</text><text x="72.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">此处的论证较为简短，因为</text><text x="206.89" y="481.28" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="293.13" y="481.28" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="307.03" y="481.28" font-size="11.00" class="sc-loraregular">AI</text><text x="320.49" y="481.28" font-size="11.00" class="sc-notoserifcjksc">研发能力远低于</text><text x="400.38" y="481.28" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="485.73" y="481.28" font-size="11.00" class="sc-notoserifcjksc">，而后者界</text><text x="72.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">定了我们当前的能力前沿。在</text><text x="217.89" y="496.90" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="256.18" y="496.90" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos 5</text><text x="306.14" y="496.90" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="339.14" y="496.90" font-size="11.00" class="sc-notoserifcjksc">中，我们判定</text><text x="408.03" y="496.90" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="457.98" y="496.90" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="526.87" y="496.90" font-size="11.00" class="sc-loraregular">AI</text><text x="72.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">研发阈值，依据是：（</text><text x="182.00" y="512.52" font-size="11.00" class="sc-loraregular">1</text><text x="186.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">）我们没有观察到能力进展中持续存在可归因于</text><text x="419.90" y="512.52" font-size="11.00" class="sc-loraregular">AI</text><text x="433.36" y="512.52" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="447.25" y="512.52" font-size="11.00" class="sc-loraregular">2×</text><text x="461.88" y="512.52" font-size="11.00" class="sc-notoserifcjksc">加速；（</text><text x="505.88" y="512.52" font-size="11.00" class="sc-loraregular">2</text><text x="511.79" y="512.52" font-size="11.00" class="sc-notoserifcjksc">）该</text><text x="72.00" y="528.14" font-size="11.00" class="sc-notoserifcjksc">模型似乎尚不接近能够替代我们的研究科学家和研究工程师，尤其是相对资深的人员。</text><text x="490.00" y="528.14" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="72.00" y="543.76" font-size="11.00" class="sc-notoserifcjksc">是一款</text><text x="107.89" y="543.76" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="146.95" y="543.76" font-size="11.00" class="sc-notoserifcjksc">级模型，它在我们自动化评估套件上的能力低于</text><text x="380.85" y="543.76" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="462.38" y="543.76" font-size="11.00" class="sc-notoserifcjksc">，且大幅低于</text><text x="72.00" y="559.38" font-size="11.00" class="sc-loraregular sc-k">Mythos 5</text><text x="119.06" y="559.38" font-size="11.00" class="sc-notoserifcjksc">，因此上述两项结论可以直接沿用。</text><text x="72.00" y="643.20" font-size="11.00" class="sc-notoserifcjksc">我们没有针对该模型开展新的内部问卷调查。关于我们对该阈值的操作化定义的完整讨论，以及</text><text x="72.00" y="658.82" font-size="11.00" class="sc-notoserifcjksc">最近一次依据该阈值对前沿模型进行的直接评估，请读者参阅</text><text x="371.89" y="658.82" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos 5</text><text x="460.14" y="658.82" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="493.14" y="658.82" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="507.03" y="658.82" font-size="11.00" class="sc-loraregular">2.3</text><text x="72.00" y="674.43" font-size="11.00" class="sc-notoserifcjksc">节。同样，由于</text><text x="151.89" y="674.43" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="199.84" y="674.43" font-size="11.00" class="sc-notoserifcjksc">并未推进前沿，我们没有为其汇编</text><text x="367.73" y="674.43" font-size="11.00" class="sc-loraregular">AECI</text><text x="392.84" y="674.43" font-size="11.00" class="sc-notoserifcjksc">。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="187.89" y="298.80" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="187.89" y="298.80" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="no <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p026.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 26 页"><text x="76.75" y="321.35" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">评估</text><text x="76.75" y="363.98" font-size="10.00" class="sc-notoserifcjkscbold">内核任务（</text><text x="126.74" y="363.98" font-size="10.00" class="sc-lorabold sc-k">Kernel task</text><text x="181.42" y="363.98" font-size="10.00" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="378.17" font-size="10.00" class="sc-notoserifcjkscbold">（困难任务上的最佳加速</text><text x="76.75" y="392.37" font-size="10.00" class="sc-notoserifcjkscbold">比；标准脚手架）</text><text x="76.75" y="423.80" font-size="10.00" class="sc-notoserifcjkscbold">时间序列预测（</text><text x="146.73" y="423.80" font-size="10.00" class="sc-lorabold sc-k">Time Series</text><text x="76.75" y="438.00" font-size="10.00" class="sc-lorabold sc-k">Forecasting</text><text x="132.41" y="438.00" font-size="10.00" class="sc-notoserifcjkscbold">）（困难变体上</text><text x="76.75" y="452.20" font-size="10.00" class="sc-notoserifcjkscbold">的</text><text x="89.38" y="452.20" font-size="10.00" class="sc-lorabold">MSE</text><text x="111.31" y="452.20" font-size="10.00" class="sc-notoserifcjkscbold">，越低越好）</text><text x="76.75" y="482.16" font-size="10.00" class="sc-lorabold">LLM</text><text x="101.17" y="482.16" font-size="10.00" class="sc-notoserifcjkscbold">训练（平均加速比）</text><text x="76.75" y="519.33" font-size="9.50" class="sc-notoserifcjkscbold">四足机器人强化学习</text><text x="76.75" y="531.67" font-size="9.50" class="sc-notoserifcjkscbold">（</text><text x="86.25" y="531.67" font-size="9.50" class="sc-lorabold">Quadruped RL</text><text x="151.74" y="531.67" font-size="9.50" class="sc-notoserifcjkscbold">）</text><text x="76.75" y="544.02" font-size="9.50" class="sc-lorabold">(</text><text x="79.56" y="544.02" font-size="9.50" class="sc-notoserifcjkscbold">最高得分；未提供超参数</text><text x="184.06" y="544.02" font-size="9.50" class="sc-lorabold">)</text><text x="76.75" y="566.48" font-size="10.00" class="sc-notoserifcjkscbold">新型编译器（复杂测试上的</text><text x="76.75" y="580.68" font-size="10.00" class="sc-notoserifcjkscbold">通过率）</text><text x="396.25" y="321.35" font-size="10.99" class="sc-notoserifcjkscbold" fill="#ffffff">阈值（等效人类工时）</text><text x="72.00" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.3</text><text x="104.89" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">基于任务的评估</text><text x="72.00" y="111.05" font-size="11.00" class="sc-notoserifcjksc">我们报告</text><text x="118.89" y="111.05" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="205.13" y="111.05" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="219.03" y="111.05" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.6</text><text x="304.98" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="337.98" y="111.05" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="351.87" y="111.05" font-size="11.00" class="sc-loraregular">8.3</text><text x="369.78" y="111.05" font-size="11.00" class="sc-notoserifcjksc">节所述自动化</text><text x="438.67" y="111.05" font-size="11.00" class="sc-loraregular">AI</text><text x="452.14" y="111.05" font-size="11.00" class="sc-notoserifcjksc">研发研究任务套件</text><text x="72.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">上的表现。对于近期的前沿模型，这些</text><text x="261.89" y="126.67" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36" y="126.67" font-size="11.00" class="sc-notoserifcjksc">研发任务中除一项评估（新型编译器（</text><text x="462.36" y="126.67" font-size="11.00" class="sc-loraregular sc-k">Novel</text><text x="72.00" y="142.29" font-size="11.00" class="sc-loraregular">Compiler</text><text x="119.33" y="142.29" font-size="11.00" class="sc-notoserifcjksc">））外，其余均已跨越最高的人类工作量当量阈值（最高</text><text x="397.23" y="142.29" font-size="11.00" class="sc-loraregular">40</text><text x="412.91" y="142.29" font-size="11.00" class="sc-notoserifcjksc">小时）。因此，这些评估</text><text x="72.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">对于我们的</text><text x="129.89" y="157.91" font-size="11.00" class="sc-loraregular">RSP</text><text x="152.60" y="157.91" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定已不再关键（参见</text><text x="309.49" y="157.91" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="347.78" y="157.91" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos 5</text><text x="397.73" y="157.91" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="430.73" y="157.91" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="444.62" y="157.91" font-size="11.00" class="sc-loraregular sc-k">2.3.7</text><text x="469.68" y="157.91" font-size="11.00" class="sc-notoserifcjksc">节）。不过，</text><text x="72.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89" y="173.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet</text><text x="135.95" y="173.53" font-size="11.00" class="sc-notoserifcjksc">级模型而言，该套件作为直接比较</text><text x="303.85" y="173.53" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="351.80" y="173.53" font-size="11.00" class="sc-notoserifcjksc">相对于近期模型所处位置的手段，仍然</text><text x="72.00" y="189.15" font-size="11.00" class="sc-notoserifcjksc">具有参考价值。</text><text x="72.00" y="240.59" font-size="11.00" class="sc-notoserifcjksc">我们仅报告无上限计分任务，以及仍能区分近期模型的那一项有上限计分任务（新型编译器）。</text><text x="72.00" y="256.21" font-size="11.00" class="sc-loraregular">LLM</text><text x="97.71" y="256.21" font-size="11.00" class="sc-notoserifcjksc">训练（</text><text x="130.71" y="256.21" font-size="11.00" class="sc-loraregular sc-k">LLM training</text><text x="196.65" y="256.21" font-size="11.00" class="sc-notoserifcjksc">）任务的得分采用</text><text x="287.55" y="256.21" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="375.79" y="256.21" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="422.68" y="256.21" font-size="11.00" class="sc-loraregular sc-k">2.3.7.1</text><text x="453.96" y="256.21" font-size="11.00" class="sc-notoserifcjksc">节所述的固定</text><text x="72.00" y="271.83" font-size="11.00" class="sc-loraregular">CPU</text><text x="72.00" y="601.84" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.91 108.01 113.54 117.02 119.39 125.40" y="601.84" font-size="9.00" class="sc-lorabold">2.3.3.A] AI</text><text x="131.25" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">研发排除性自动化评估汇总表。</text><text x="257.25" y="601.84" font-size="9.00" class="sc-notoserifcjksc">在我们的内部评估套件中，所有近期模型在除一项评估之外的所有评估</text><text x="72.00" y="613.54" font-size="9.00" class="sc-notoserifcjksc">上均跨越了排除阈值。</text><text x="162.00" y="613.54" font-size="9.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="232.56" y="613.54" font-size="9.00" class="sc-notoserifcjksc">并未推进我们的能力前沿，因为它在除新型编译器之外的所有评估上的表现均</text><text x="72.00" y="625.24" font-size="9.00" class="sc-notoserifcjksc">低于</text><text x="92.37" y="625.24" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="127.75" y="625.24" font-size="9.00" class="sc-notoserifcjksc">；在新型编译器上，它的得分高于</text><text x="265.11" y="625.24" font-size="9.00" class="sc-loraregular sc-k">Opus 4.7</text><text x="300.49" y="625.24" font-size="9.00" class="sc-notoserifcjksc">，但远低于</text><text x="347.86" y="625.24" font-size="9.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="417.69" y="625.24" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00" y="671.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4</text><text x="105.70" y="671.92" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00" y="699.82" font-size="11.00" class="sc-notoserifcjksc">我们评估认为，</text><text x="149.00" y="699.82" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="235.24" y="699.82" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="304.13" y="699.82" font-size="11.00" class="sc-loraregular">AI</text><text x="317.60" y="699.82" font-size="11.00" class="sc-notoserifcjksc">研发能力阈值。</text><text x="394.60" y="699.82" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="442.55" y="699.82" font-size="11.00" class="sc-notoserifcjksc">在每一项自动化评</text><text x="72.00" y="715.44" font-size="11.00" class="sc-notoserifcjksc">估上的能力都低于</text><text x="162.89" y="715.44" font-size="11.00" class="sc-loraregular sc-k">Claude Mythos 5</text><text x="248.24" y="715.44" font-size="11.00" class="sc-notoserifcjksc">，并且也低于</text><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="219.03" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="219.03" y="102.25" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="254.42" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="257.32" y="102.25" width="26.96" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="284.28" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="287.17" y="102.25" width="14.92" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="302.09" y="102.25" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="304.98" y="102.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="315.98" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="315.98" y="102.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="326.98" y="102.25" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www-cdn.anthropic.com/14e4fb01875d2a69f646fa5e574dea2b1c0ff7b5.pdf" rel="noopener"><rect x="326.98" y="102.25" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="309.49" y="149.11" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="309.49" y="149.11" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="347.78" y="149.11" width="38.17" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="385.95" y="149.11" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="388.84" y="149.11" width="5.99" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="394.84" y="149.11" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="397.73" y="149.11" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="408.73" y="149.11" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="408.73" y="149.11" width="11.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="419.73" y="149.11" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="419.73" y="149.11" width="11.00" height="11.00" fill="transparent"/></a></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p027.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 27 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Claude Opus 4.7</text><text x="153.53" y="82.63" font-size="11.00" class="sc-notoserifcjksc">（新型编译器一项除外）。它并未推进我们的能力前沿；因此，</text><text x="461.53" y="82.63" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos</text><text x="72.00" y="98.25" font-size="11.00" class="sc-loraregular" fill="#0000ff">5</text><text x="80.89" y="98.25" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="113.89" y="98.25" font-size="11.00" class="sc-notoserifcjksc">中的分析可作为</text><text x="193.78" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="241.73" y="98.25" font-size="11.00" class="sc-notoserifcjksc">情形的上界。</text><text x="72.00" y="148.78" font-size="14.00" class="sc-poppinssemibold">2.4</text><text x="96.26" y="148.78" font-size="14.00" class="sc-notosanscjkscbold">对齐风险更新</text><text x="72.00" y="181.35" font-size="11.00" class="sc-notoserifcjksc">我们的总体对齐风险评估与我们在</text><text x="239.89" y="181.35" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="362.77" y="181.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="428.77" y="181.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="442.67" y="181.35" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="528.56" y="181.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系</text><text x="72.00" y="196.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">统卡</text><text x="94.00" y="196.97" font-size="11.00" class="sc-notoserifcjksc">中报告的结论相比保持不变：</text><text x="237.00" y="196.97" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="316.89" y="196.97" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="443.42" y="196.97" font-size="11.00" class="sc-notoserifcjkscbold">之前发布的模型。</text><text x="72.00" y="244.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61" y="244.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00" y="276.35" font-size="11.00" class="sc-notoserifcjksc">我们的背景预期与</text><text x="162.89" y="276.35" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="285.77" y="276.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="351.77" y="276.35" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="365.67" y="276.35" font-size="11.00" class="sc-loraregular">5.1</text><text x="381.27" y="276.35" font-size="11.00" class="sc-notoserifcjksc">节以及</text><text x="417.16" y="276.35" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="503.05" y="276.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="72.00" y="291.97" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="291.97" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="110.07" y="291.97" font-size="11.00" class="sc-notoserifcjksc">节中报告的内容相比基本未变。</text><text x="72.00" y="341.12" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89" y="341.12" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="155.84" y="341.12" font-size="11.00" class="sc-notoserifcjksc">训练期间使用的监控与</text><text x="268.74" y="341.12" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos Preview</text><text x="353.33" y="341.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="419.33" y="341.12" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="433.22" y="341.12" font-size="11.00" class="sc-loraregular">5.2</text><text x="450.72" y="341.12" font-size="11.00" class="sc-notoserifcjksc">节中描述的监控类</text><text x="72.00" y="356.74" font-size="11.00" class="sc-notoserifcjksc">似。与先前模型的训练相比，我们在该模型的训练过程中没有观察到任何更令人担忧的情况。</text><text x="72.00" y="422.08" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="422.08" font-size="11.00" class="sc-loraregular sc-k">6.7</text><text x="102.57" y="422.08" font-size="11.00" class="sc-notoserifcjksc">节报告了相关能力评估的结果。在</text><text x="270.46 276.70 285.28 292.17 300.25 306.87 312.25 319.14 323.82 329.79 336.46" y="422.08" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="345.03" y="422.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.92" y="422.08" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="469.10" y="422.08" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="491.10" y="422.08" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="72.00" y="437.70" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率均接近于零：其得分显著低于其他先前模型。</text><text x="72.00" y="486.85" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="486.85" font-size="11.00" class="sc-loraregular">6</text><text x="95.14" y="486.85" font-size="11.00" class="sc-notoserifcjksc">节所述的对齐评估报告指出，在大多数对齐指标上，</text><text x="348.14" y="486.85" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="434.38" y="486.85" font-size="11.00" class="sc-notoserifcjksc">似乎表现出比</text><text x="503.28" y="486.85" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="72.00" y="502.47" font-size="11.00" class="sc-loraregular sc-k">Sonnet 4.6</text><text x="128.87" y="502.47" font-size="11.00" class="sc-notoserifcjksc">更好的对齐程度。在内部试点使用期间的极少数情况下，</text><text x="403.87" y="502.47" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="451.82" y="502.47" font-size="11.00" class="sc-notoserifcjksc">曾试图绕过在评估</text><text x="72.00" y="518.09" font-size="11.00" class="sc-notoserifcjksc">期间阻止其访问某些网站的网络代理。我们在先前的模型中也见过类似行为；根据我们的风险路</text><text x="72.00" y="533.71" font-size="11.00" class="sc-notoserifcjksc">径，我们不认为这类为追求任务成功而偶尔采取的行为反映了重大风险。</text><text x="72.00" y="600.19" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控没有发现任何故意藏拙（</text><text x="303.00" y="600.19" font-size="11.00" class="sc-loraregular sc-k">sandbagging</text><text x="367.38" y="600.19" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性</text><text x="72.00" y="615.81" font-size="11.00" class="sc-notoserifcjksc">欺骗或长程战略性规避监督的实例，不过</text><text x="272.89" y="615.81" font-size="11.00" class="sc-loraregular sc-k">Sonnet 5</text><text x="320.84" y="615.81" font-size="11.00" class="sc-notoserifcjksc">的内部使用规模较小，这限制了这些观察所能</text><text x="72.00" y="631.43" font-size="11.00" class="sc-notoserifcjksc">提供的信息。</text><text x="72.00" y="681.15" font-size="11.00" class="sc-notoserifcjksc">与一些近期模型一样，对齐评估指出，在对</text><text x="283.89" y="681.15" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="370.13" y="681.15" font-size="11.00" class="sc-notoserifcjksc">进行评估期间观察到了较高水平的</text><text x="72.00" y="696.77" font-size="11.00" class="sc-notoserifcjksc">评估意识（</text><text x="127.00" y="696.77" font-size="11.00" class="sc-loraregular sc-k">evaluation awareness</text><text x="235.90" y="696.77" font-size="11.00" class="sc-notoserifcjksc">）。我们针对这一风险的主要缓解措施，是在以下过程中使用</text><text x="72.00" y="712.39" font-size="11.00" class="sc-notoserifcjksc">真实的沙箱和</text><text x="140.89" y="712.39" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="194.73" y="712.39" font-size="11.00" class="sc-notoserifcjksc">代码库：</text><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="461.53" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="461.53" y="73.83" width="35.40" height="11.00" fil <div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p028.webp" alt="" width="1836" height="2376"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 28 页"><text x="72.00" y="82.63" font-size="11.00" class="sc-notoserifcjksc">对齐审计，所用材料取自特别适合破坏</text><text x="261.89" y="82.63" font-size="11.00" class="sc-loraregular sc-k">Anthropic</text><text x="315.73" y="82.63" font-size="11.00" class="sc-notoserifcjksc">及其安全工作的真实会话。尽管评估意识水平</text><text x="72.00" y="98.25" font-size="11.00" class="sc-notoserifcjksc">较高，我们认为评估意识不太可能显著削弱</text><text x="283.89" y="98.25" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="370.13" y="98.25" font-size="11.00" class="sc-notoserifcjksc">对齐评估的总体结论。</text><text x="72.00" y="163.59" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="163.59" font-size="11.00" class="sc-notoserifcjksc">所采用的内部使用监控系统，与</text><text x="315.13" y="163.59" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="438.01" y="163.59" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="504.01" y="163.59" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="517.91" y="163.59" font-size="11.00" class="sc-loraregular">5.5</text><text x="72.00" y="179.21" font-size="11.00" class="sc-notoserifcjksc">节中描述的系统相同。</text><text x="72.00" y="210.50" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.2</text><text x="105.37" y="210.50" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">风险路径</text><text x="72.00" y="238.39" font-size="11.00" class="sc-notoserifcjksc">鉴于</text><text x="96.89" y="238.39" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="183.13" y="238.39" font-size="11.00" class="sc-notoserifcjksc">的能力显著低于我们能力最强的全面开放模型，且似乎并未表现出明显更</text><text x="72.00" y="254.01" font-size="11.00" class="sc-notoserifcjksc">令人担忧的对齐特性，我们认为风险并未超出</text><text x="294.89" y="254.01" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Mythos Preview</text><text x="417.77" y="254.01" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="483.77" y="254.01" font-size="11.00" class="sc-notoserifcjksc">中报告、并</text><text x="72.00" y="269.63" font-size="11.00" class="sc-notoserifcjksc">在</text><text x="85.89" y="269.63" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="171.78" y="269.63" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="204.78" y="269.63" font-size="11.00" class="sc-notoserifcjksc">中更新的分路径分析所描述的水平。</text><text x="72.00" y="333.88" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.3</text><text x="105.70" y="333.88" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">对齐风险的总体评估</text><text x="72.00" y="365.78" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="158.24" y="365.78" font-size="11.00" class="sc-notoserifcjksc">的能力显著低于其他若干</text><text x="282.13" y="365.78" font-size="11.00" class="sc-loraregular sc-k">Claude</text><text x="320.42" y="365.78" font-size="11.00" class="sc-notoserifcjksc">模型，包括目前已全面开放的其他模型。我们</text><text x="72.00" y="381.40" font-size="11.00" class="sc-notoserifcjksc">认为，这些特性的组合意味着</text><text x="217.89" y="381.40" font-size="11.00" class="sc-loraregular sc-k">Claude Sonnet 5</text><text x="304.13" y="381.40" font-size="11.00" class="sc-notoserifcjksc">不会使总体对齐风险显著超出此前在</text><text x="483.03" y="381.40" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude</text><text x="72.00" y="397.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Mythos Preview</text><text x="156.59" y="397.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="222.59" y="397.02" font-size="11.00" class="sc-notoserifcjksc">中描述、并在</text><text x="291.48" y="397.02" font-size="11.00" class="sc-loraregular sc-k" fill="#0000ff">Claude Opus 4.8</text><text x="377.37" y="397.02" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="410.37" y="397.02" font-size="11.00" class="sc-notoserifcjksc">中更新的水平。因此，我们</text><text x="72.00" y="412.64" font-size="11.00" class="sc-notoserifcjksc">目前认为，由我们的模型所采取的未对齐行为在很大程度上促成的重大有害后果，其风险</text><text x="501.00" y="412.64" font-size="11.00" class="sc-notoserifcjkscbold">非常</text><text x="72.00" y="428.26" font-size="11.00" class="sc-notoserifcjkscbold">低，但高于</text><text x="129.89" y="428.26" font-size="11.00" class="sc-lorabold sc-k">Claude Mythos Preview</text><text x="256.42" y="428.26" font-size="11.00" class="sc-notoserifcjkscbold">之前的模型。</text><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="315.13" y="154.79" width="0.00" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="315.13" y="154.79" width="35.40" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="350.53" y="154.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="353.42" y="154.79" width="38.17" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="391.59" y="154.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="394.49" y="154.79" width="40.63" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="435.12" y="154.79" width="2.89" height="11.00" fill="transparent"/></a><a href="https://www.anthropic.com/claude-mythos-preview-risk-report" rel="noopener"><rect x="438.01" y="154.79
