.79 324.79 333.79 342.79 351.79 360.79 369.79 378.79 387.79" y="638.21" font-size="9.00" class="sc-notoserifcjksc">次独立尝试的分布；点表示各次运行。虚线标示直接应用</text><text x="399.16 404.76 409.86 417.98 422.09" y="638.21" font-size="9.00" class="sc-loraregular">ESM-2</text><text x="429.29 438.29 447.29 456.29 465.29 474.29 483.29 492.29 501.29 510.29 519.29 528.29" y="638.21" font-size="9.00" class="sc-notoserifcjksc">的参考基线。该任务没有可</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="649.91" font-size="9.00" class="sc-notoserifcjksc">用的人类参与者基线。</text></svg></div>
<div class="s1-sheet sc-sheet" style="width:612pt;height:792pt"><img class="sc-bg" src="scimg:p024.webp" alt="" width="1224" height="1584"><svg viewBox="0 0 612 792" xmlns="http://www.w3.org/2000/svg" aria-label="原文第 24 页"><text x="72.00 79.46 82.84 90.30 93.68" y="83.15" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.2.6</text><text x="105.10 118.10" y="83.15" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">结论</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="115.05" font-size="11.00" class="sc-notoserifcjksc">总体而言，自动化</text><text x="162.89 170.58" y="115.05" font-size="11.00" class="sc-loraregular">CB</text><text x="180.32 191.32 202.32 213.32 224.32 235.32 246.32 257.32 268.32 279.32 290.32 301.32 312.32 323.32" y="115.05" font-size="11.00" class="sc-notoserifcjksc">能力评估结果与以下判断一致：</text><text x="334.32 342.01 345.00 350.61 357.18 363.75 369.72 372.61 378.85 385.28 391.96 398.63 404.52 408.78 411.67" y="115.05" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="420.56 431.56 442.56 453.56" y="115.05" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="467.45 476.18 482.75 489.32 494.41 497.30 503.27 505.97" y="115.05" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="515.05" y="115.05" font-size="11.00" class="sc-notoserifcjksc">相</text><text x="72.00 83.00 94.00 105.00" y="130.67" font-size="11.00" class="sc-notoserifcjksc">当，弱于</text><text x="118.89 128.83 134.69 138.95 145.54 151.97 157.06 159.96" y="130.67" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="165.95 176.95 187.95 198.95 209.95 220.95 231.95 242.95" y="130.67" font-size="11.00" class="sc-notoserifcjksc">。这些发现也与第</text><text x="256.84 263.03 265.73 269.74" y="130.67" font-size="11.00" class="sc-loraregular">8.14</text><text x="278.59 289.59 300.59 311.59 322.59 333.59 344.59 355.59 366.59 377.59 388.59 399.59 410.59 421.59 432.59 443.59 454.59" y="130.67" font-size="11.00" class="sc-notoserifcjksc">节所述发现一致，该节更广泛地报告了</text><text x="468.48 474.72 481.16 487.83 494.51 500.40 504.65 507.55" y="130.67" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="516.43 527.43" y="130.67" font-size="11.00" class="sc-notoserifcjksc">的生</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="146.29" font-size="11.00" class="sc-notoserifcjksc">命科学能力。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="196.01" font-size="11.00" class="sc-notoserifcjkscbold">非新型化学武器与生物武器（</text><text x="215.00 222.57 229.84 235.02" y="196.01" font-size="11.00" class="sc-lorabold">CB-1</text><text x="239.49 250.49" y="196.01" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="261.49 272.49 283.49 294.49 305.49 316.49 327.49 338.49 349.49 360.49 371.49 382.49 393.49 404.49 415.49 426.49 437.49 448.49 459.49 470.49 481.49 492.49 503.49 514.49 525.49" y="196.01" font-size="11.00" class="sc-notoserifcjksc">很难有把握地判断模型是否跨越这一阈值，但与近期先前</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="211.63" font-size="11.00" class="sc-notoserifcjksc">模型一样，我们的结果与</text><text x="195.89 202.13 208.57 215.24 221.92 227.80 232.06 234.95" y="211.63" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="243.84 254.84 265.84 276.84 287.84 298.84 309.84 320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="211.63" font-size="11.00" class="sc-notoserifcjksc">能够在此威胁模型下显著提升具备基础技术背景的个人或团体</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="227.25" font-size="11.00" class="sc-notoserifcjksc">的能力这一情况一致。与其他具有这些属性的模型一样，我们实施强有力的安全防护措施，以防</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="242.87" font-size="11.00" class="sc-notoserifcjksc">止此类灾难性</text><text x="140.89 148.58 155.42 160.52" y="242.87" font-size="11.00" class="sc-loraregular">CB-1</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="258.49" font-size="11.00" class="sc-notoserifcjksc">问控制；用于持续评估分类器防护有效性的漏洞赏金计划与威胁情报；针对越狱的多种快速响应</text><text x="72.00" y="289.73" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="85.89 92.78 99.02 104.93 110.05" y="289.73" font-size="11.00" class="sc-loraregular">ASL-3</text><text x="119.07 130.07 141.07 152.07 163.07 174.07 185.07 196.07 207.07 218.07 229.07 240.07 251.07 262.07 273.07 284.07 295.07 306.07 317.07 328.07 339.07 350.07 361.07 372.07 383.07 394.07 405.07 416.07 427.07 438.07 449.07 460.07 471.07 482.07 493.07 504.07 515.07 526.07" y="289.73" font-size="11.00" class="sc-notoserifcjksc">防护，足以使此类别的灾难性风险降至很低但不可忽略的水平（关于我们理由的进一步</text><text x="72.00 83.00 94.00 105.00" y="305.35" font-size="11.00" class="sc-notoserifcjksc">讨论，见</text><text x="116.00 127.00 138.00 149.00 160.00 171.00 182.00" y="305.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最新风险报告）</text><text x="193.00" y="305.35" font-size="11.00" class="sc-notoserifcjksc">。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="406.51" font-size="11.00" class="sc-notoserifcjkscbold">新型化学武器与生物武器（</text><text x="204.00 211.57 218.84 223.70" y="406.51" font-size="11.00" class="sc-lorabold">CB-2</text><text x="229.56 240.56" y="406.51" font-size="11.00" class="sc-notoserifcjkscbold">）：</text><text x="251.56 262.56" y="406.51" font-size="11.00" class="sc-notoserifcjksc">由于</text><text x="276.46 282.69 289.13 295.81 302.48 308.37 312.62 315.52" y="406.51" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="324.41 335.41 346.41 357.41" y="406.51" font-size="11.00" class="sc-notoserifcjksc">的能力与</text><text x="371.30 380.03 386.60 393.17 398.26 401.15 407.11 409.82" y="406.51" font-size="11.00" class="sc-loraregular">Opus 4.8</text><text x="498.79 507.52 514.09 520.66" y="406.51" font-size="11.00" class="sc-loraregular">Opus</text><text x="72.00 77.96 80.67" y="422.13" font-size="11.00" class="sc-loraregular">4.8</text><text x="89.74 100.74 111.74 122.74 133.74 144.74 155.74 166.74 177.74 188.74 199.74 210.74 221.74 232.74 243.74 254.74 265.74 276.74 287.74 298.74 309.74 320.74 331.74 342.74 353.74 364.74 375.74 386.74 397.74 408.74 419.74 430.74 441.74 452.74 463.74 474.74 485.74 496.74 507.74 518.74 529.74" y="422.13" font-size="11.00" class="sc-notoserifcjksc">系统卡中的结论：我们认为，对原本没有能力开发此类武器的威胁行为者而言，能力提升有限</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="437.75" font-size="11.00" class="sc-notoserifcjksc">（对于已有专业知识的威胁行为者，其武器开发进程能被加快到何种程度，仍存在不确定性）。</text><text x="72.00 80.04 83.68 92.06 95.39 105.42" y="505.05" font-size="14.00" class="sc-poppinssemibold">2.3 AI</text><text x="112.64 126.64 140.64 154.64 168.64" y="505.05" font-size="14.00" class="sc-notosanscjkscbold">研究与开发</text><text x="72.00 79.46 82.84 90.63 94.01" y="542.14" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.1</text><text x="101.81 114.81 127.81 140.81 153.81" y="542.14" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">自主性评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="570.04" font-size="11.00" class="sc-notoserifcjksc">我们的负责任扩展政策列出了两个与自主</text><text x="272.89 279.78" y="570.04" font-size="11.00" class="sc-loraregular">AI</text><text x="286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36" y="570.04" font-size="11.00" class="sc-notoserifcjksc">相关的威胁模型：</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="151.89" y="602.43" font-size="11.00" class="sc-lorabold">1</text><text x="156.36 167.36 178.36 189.36 200.36 211.36 222.36 233.36 244.36 255.36 266.36" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">：高风险情境中的未对齐</text><text x="280.25 287.60" y="602.43" font-size="11.00" class="sc-lorabold">AI</text><text x="294.75 305.75 316.75" y="602.43" font-size="11.00" class="sc-notoserifcjkscbold">系统。</text><text x="327.75 338.75 349.75 360.75 371.75 382.75 393.75 404.75 415.75 426.75 437.75 448.75 459.75" y="602.43" font-size="11.00" class="sc-notoserifcjksc">该威胁模型关注的是这样一类</text><text x="473.64 480.53" y="602.43" font-size="11.00" class="sc-loraregular">AI</text><text x="487.11 498.11 509.11 520.11" y="602.43" font-size="11.00" class="sc-notoserifcjksc">系统：它</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="618.05" font-size="11.00" class="sc-notoserifcjksc">们被高度依赖，能够广泛访问敏感资产，并具备中等程度的自主、目标导向运作和隐蔽手段的能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="633.67" font-size="11.00" class="sc-notoserifcjksc">力。令人担忧的是，此类系统若被有意或无意地引向有害目标，可能采取未对齐行为，导致后续</text><text x="72.00 83.00 94.00 105.00 116.00 nt Risk Update</text><text x="504.15 515.15 526.15" y="307.60" font-size="11.00" class="sc-notoserifcjksc">）中所</text><text x="108.00 119.00 130.00 141.00 152.00 163.00" y="323.22" font-size="11.00" class="sc-notoserifcjksc">评估的水平。</text><text x="174.00 180.24 186.67 193.35 200.03 205.91 210.17 213.06" y="323.22" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="221.95 232.95 243.95 254.95 265.95 276.95 287.95 298.95 309.95 320.95 331.95 342.95 353.95 364.95 375.95 386.95 397.95 408.95 419.95" y="323.22" font-size="11.00" class="sc-notoserifcjksc">将以全面开放的方式发布。自主性威胁模型</text><text x="433.84" y="323.22" font-size="11.00" class="sc-loraregular">1</text><text x="440.74 451.74" y="323.22" font-size="11.00" class="sc-notoserifcjksc">在第</text><text x="465.63 471.54 474.25" y="323.22" font-size="11.00" class="sc-loraregular">2.4</text><text x="483.10 494.10 505.10 516.10 527.10" y="323.22" font-size="11.00" class="sc-notoserifcjksc">节中讨论。</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00" y="374.08" font-size="11.00" class="sc-notoserifcjkscbold">自主性威胁模型</text><text x="187.89" y="374.08" font-size="11.00" class="sc-lorabold">2</text><text x="196.65 207.65 218.65 229.65" y="374.08" font-size="11.00" class="sc-notoserifcjksc">不适用于</text><text x="243.54 249.78 256.21 262.89 269.57 275.45 279.71 282.60" y="374.08" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="288.60 299.60 310.60 321.60 332.60 343.60 354.60 365.60 376.60 387.60 398.60 409.60 420.60 431.60 442.60 453.60 464.60 475.60 486.60 497.60 508.60 519.60" y="374.08" font-size="11.00" class="sc-notoserifcjksc">。该模型并未推进我们的能力前沿，能力前沿仍由</text><text x="108.00 115.69 118.68 124.29 130.86 137.44 143.40 146.29 156.22 162.09 166.34 172.93 179.37 184.46 187.35" y="389.70" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="196.24 207.24 218.24 229.24 240.24 251.24 262.24 273.24" y="389.70" font-size="11.00" class="sc-notoserifcjksc">界定。我们认为，</text><text x="284.24 290.48 296.91 303.59 310.27 316.15 320.41 323.30" y="389.70" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="332.19 343.19 354.19 365.19 376.19 387.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc">不会改变我们</text><text x="398.19 409.19 420.19 431.19 442.19 453.19 464.19 475.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">最近一份风险报告</text><text x="486.19 497.19 508.19 519.19 530.19" y="389.70" font-size="11.00" class="sc-notoserifcjksc">中针对该威</text><text x="108.00 119.00 130.00 141.00 152.00 163.00 174.00 185.00 196.00 207.00" y="405.32" font-size="11.00" class="sc-notoserifcjksc">胁模型所呈现的情况。</text><text x="72.00 79.46 82.84 90.63 94.01" y="453.38" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.2</text><text x="104.57 117.57 130.57 143.57 156.57 169.57 182.57 195.57 208.57 221.57 234.57 247.57 260.57" y="453.38" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">关于我们判定依据的概要说明</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00" y="481.28" font-size="11.00" class="sc-notoserifcjksc">此处的论证较为简短，因为</text><text x="206.89 214.58 217.57 223.18 229.75 236.33 242.29 245.18 251.42 257.86 264.53 271.21 277.10 281.35 284.25" y="481.28" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="293.13" y="481.28" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="307.03 313.91" y="481.28" font-size="11.00" class="sc-loraregular">AI</text><text x="320.49 331.49 342.49 353.49 364.49 375.49 386.49" y="481.28" font-size="11.00" class="sc-notoserifcjksc">研发能力远低于</text><text x="400.38 408.07 411.06 416.67 423.24 429.82 435.78 438.67 448.61 454.47 458.73 465.32 471.75 476.84 479.74" y="481.28" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="485.73 496.73 507.73 518.73 529.73" y="481.28" font-size="11.00" class="sc-notoserifcjksc">，而后者界</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00" y="496.90" font-size="11.00" class="sc-notoserifcjksc">定了我们当前的能力前沿。在</text><text x="217.89 225.58 228.57 234.18 240.75 247.33" y="496.90" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="256.18 266.12 271.98 276.24 282.83 289.26 294.35 297.25" y="496.90" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos 5</text><text x="306.14 317.14 328.14" y="496.90" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="339.14 350.14 361.14 372.14 383.14 394.14" y="496.90" font-size="11.00" class="sc-notoserifcjksc">中，我们判定</text><text x="408.03 417.96 423.82 428.08 434.67 441.10 446.20 449.09" y="496.90" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="457.98 468.98 479.98 490.98 501.98 512.98" y="496.90" font-size="11.00" class="sc-notoserifcjksc">未跨越自动化</text><text x="526.87 533.76" y="496.90" font-size="11.00" class="sc-loraregular">AI</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">研发阈值，依据是：（</text><text x="182.00" y="512.52" font-size="11.00" class="sc-loraregular">1</text><text x="186.00 197.00 208.00 219.00 230.00 241.00 252.00 263.00 274.00 285.00 296.00 307.00 318.00 329.00 340.00 351.00 362.00 373.00 384.00 395.00 406.00" y="512.52" font-size="11.00" class="sc-notoserifcjksc">）我们没有观察到能力进展中持续存在可归因于</text><text x="419.90 426.78" y="512.52" font-size="11.00" class="sc-loraregular">AI</text><text x="433.36" y="512.52" font-size="11.00" class="sc-notoserifcjksc">的</text><text x="447.25 453.16" y="512.52" font-size="11.00" class="sc-loraregular">2×</text><text x="461.88 472.88 483.88 494.88" y="512.52" font-size="11.00" class="sc-notoserifcjksc">加速；（</text><text x="505.88" y="512.52" font-size="11.00" class="sc-loraregular">2</text><text x="511.79 522.79" y="512.52" font-size="11.00" class="sc-notoserifcjksc">）该</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00" y="528.14" font-size="11.00" class="sc-notoserifcjksc">模型似乎尚不接近能够替代我们的研究科学家和研究工程师，尤其是相对资深的人员。</text><text x="490.00 496.24 502.67 509.35 516.03 521.91 526.17 529.06" y="528.14" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00 83.00 94.00" y="543.76" font-size="11.00" class="sc-notoserifcjksc">是一款</text><text x="107.89 114.13 120.57 127.24 133.92 139.80" y="543.76" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="146.95 157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95 300.95 311.95 322.95 333.95 344.95 355.95 366.95" y="543.76" font-size="11.00" class="sc-notoserifcjksc">级模型，它在我们自动化评估套件上的能力低于</text><text x="380.85 388.54 391.53 397.14 403.70 410.28 416.24 419.14 427.87 434.44 441.01 446.10 448.99 454.95 457.31" y="543.76" font-size="11.00" class="sc-loraregular">Claude Opus 4.7</text><text x="462.38 473.38 484.38 495.38 506.38 517.38" y="543.76" font-size="11.00" class="sc-notoserifcjksc">，且大幅低于</text><text x="72.00 81.93 87.80 92.05 98.64 105.08 110.17 113.06" y="559.38" font-size="11.00" class="sc-loraregular">Mythos 5</text><text x="119.06 130.06 141.06 152.06 163.06 174.06 185.06 196.06 207.06 218.06 229.06 240.06 251.06 262.06 273.06 284.06" y="559.38" font-size="11.00" class="sc-notoserifcjksc">，因此上述两项结论可以直接沿用。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="643.20" font-size="11.00" class="sc-notoserifcjksc">我们没有针对该模型开展新的内部问卷调查。关于我们对该阈值的操作化定义的完整讨论，以及</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 .62 279.18 284.28 287.17 293.13 295.73" y="111.05" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.6</text><text x="304.98 315.98 326.98" y="111.05" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="337.98" y="111.05" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="351.87 358.06 360.76" y="111.05" font-size="11.00" class="sc-loraregular">8.3</text><text x="369.78 380.78 391.78 402.78 413.78 424.78" y="111.05" font-size="11.00" class="sc-notoserifcjksc">节所述自动化</text><text x="438.67 445.56" y="111.05" font-size="11.00" class="sc-loraregular">AI</text><text x="452.14 463.14 474.14 485.14 496.14 507.14 518.14 529.14" y="111.05" font-size="11.00" class="sc-notoserifcjksc">研发研究任务套件</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00" y="126.67" font-size="11.00" class="sc-notoserifcjksc">上的表现。对于近期的前沿模型，这些</text><text x="261.89 268.78" y="126.67" font-size="11.00" class="sc-loraregular">AI</text><text x="275.36 286.36 297.36 308.36 319.36 330.36 341.36 352.36 363.36 374.36 385.36 396.36 407.36 418.36 429.36 440.36 451.36" y="126.67" font-size="11.00" class="sc-notoserifcjksc">研发任务中除一项评估（新型编译器（</text><text x="462.36 470.63 477.01 482.51 488.47" y="126.67" font-size="11.00" class="sc-loraregular">Novel</text><text x="72.00 79.69 86.12 95.96 102.53 105.62 108.61 114.57" y="142.29" font-size="11.00" class="sc-loraregular">Compiler</text><text x="119.33 130.33 141.33 152.33 163.33 174.33 185.33 196.33 207.33 218.33 229.33 240.33 251.33 262.33 273.33 284.33 295.33 306.33 317.33 328.33 339.33 350.33 361.33 372.33 383.33" y="142.29" font-size="11.00" class="sc-notoserifcjksc">））外，其余均已跨越最高的人类工作量当量阈值（最高</text><text x="397.23 403.19" y="142.29" font-size="11.00" class="sc-loraregular">40</text><text x="412.91 423.91 434.91 445.91 456.91 467.91 478.91 489.91 500.91 511.91 522.91" y="142.29" font-size="11.00" class="sc-notoserifcjksc">小时）。因此，这些评估</text><text x="72.00 83.00 94.00 105.00 116.00" y="157.91" font-size="11.00" class="sc-notoserifcjksc">对于我们的</text><text x="129.89 136.80 143.04" y="157.91" font-size="11.00" class="sc-loraregular">RSP</text><text x="152.60 163.60 174.60 185.60 196.60 207.60 218.60 229.60 240.60 251.60 262.60 273.60 284.60 295.60" y="157.91" font-size="11.00" class="sc-notoserifcjksc">能力阈值判定已不再关键（参见</text><text x="309.49 317.18 320.17 325.78 332.35 338.93" y="157.91" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude</text><text x="347.78 357.71 363.58 367.83 374.42 380.86 385.95 388.84" y="157.91" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos 5</text><text x="397.73 408.73 419.73" y="157.91" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="430.73" y="157.91" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="444.62 450.53 453.24 459.37 461.72" y="157.91" font-size="11.00" class="sc-loraregular">2.3.7</text><text x="469.68 480.68 491.68 502.68 513.68 524.68" y="157.91" font-size="11.00" class="sc-notoserifcjksc">节）。不过，</text><text x="72.00 83.00" y="173.53" font-size="11.00" class="sc-notoserifcjksc">对于</text><text x="96.89 103.13 109.57 116.24 122.92 128.80" y="173.53" font-size="11.00" class="sc-loraregular">Sonnet</text><text x="135.95 146.95 157.95 168.95 179.95 190.95 201.95 212.95 223.95 234.95 245.95 256.95 267.95 278.95 289.95" y="173.53" font-size="11.00" class="sc-notoserifcjksc">级模型而言，该套件作为直接比较</text><text x="303.85 310.08 316.52 323.20 329.87 335.76 340.01 342.91" y="173.53" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="351.80 362.80 373.80 384.80 395.80 406.80 417.80 428.80 439.80 450.80 461.80 472.80 483.80 494.80 505.80 516.80 527.80" y="173.53" font-size="11.00" class="sc-notoserifcjksc">相对于近期模型所处位置的手段，仍然</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00" y="189.15" font-size="11.00" class="sc-notoserifcjksc">具有参考价值。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="240.59" font-size="11.00" class="sc-notoserifcjksc">我们仅报告无上限计分任务，以及仍能区分近期模型的那一项有上限计分任务（新型编译器）。</text><text x="72.00 78.36 84.72" y="256.21" font-size="11.00" class="sc-loraregular">LLM</text><text x="97.71 108.71 119.71" y="256.21" font-size="11.00" class="sc-notoserifcjksc">训练（</text><text x="130.71 137.07 143.42 153.52 156.41 160.67 165.36 171.03 174.12 180.80 183.89 190.57" y="256.21" font-size="11.00" class="sc-loraregular">LLM training</text><text x="196.65 207.65 218.65 229.65 240.65 251.65 262.65 273.65" y="256.21" font-size="11.00" class="sc-notoserifcjksc">）任务的得分采用</text><text x="287.55 295.23 298.23 303.84 310.40 316.98 322.94 325.84 335.77 341.63 345.89 352.48 358.91 364.01 366.90" y="256.21" font-size="11.00" class="sc-loraregular">Claude Mythos 5</text><text x="375.79 386.79 397.79 408.79" y="256.21" font-size="11.00" class="sc-notoserifcjksc">系统卡第</text><text x="422.68 428.59 431.29 437.42 439.77 444.36 447.07" y="256.21" font-size="11.00" class="sc-loraregular">2.3.7.1</text><text x="453.96 464.96 475.96 486.96 497.96 508.96" y="256.21" font-size="11.00" class="sc-notoserifcjksc">节所述的固定</text><text x="72.00 79.69 86.36" y="271.83" font-size="11.00" class="sc-loraregular">CPU</text><text x="72.00" y="601.84" font-size="9.00" class="sc-lorabold">[</text><text x="75.47" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">表</text><text x="86.84 91.64 93.74 98.78 100.87 105.91 108.01 113.54 117.02 119.39 125.40" y="601.84" font-size="9.00" class="sc-lorabold">2.3.3.A] AI</text><text x="131.25 140.25 149.25 158.25 167.25 176.25 185.25 194.25 203.25 212.25 221.25 230.25 239.25 248.25" y="601.84" font-size="9.00" class="sc-notoserifcjkscbold">研发排除性自动化评估汇总表。</text><text x="257.25 266.25 275.25 284.25 293.25 302.25 311.25 320.25 329.25 338.25 347.25 356.25 365.25 374.25 383.25 392.25 401.25 410.25 419.25 428.25 437.25 446.25 455.25 464.25 473.25 482.25 491.25 500.25 509.25 518.25 527.25" y="601.84" font-size="9.00" class="sc-notoserifcjksc">在我们的内部评估套件中，所有近期模型在除一项评估之外的所有评估</text><text x="72.00 81.00 90.00 99.00 108.00 117.00 126.00 135.00 144.00 153.00" y="613.54" font-size="9.00" class="sc-notoserifcjksc">上均跨越了排除阈值。</text><text x="162.00 168.29 170.74 175.33 180.70 186.08 190.96 193.33 198.43 203.70 209.16 214.62 219.44 222.92 225.29" y="613.54" font-size="9.00" class="sc-loraregular">Claude Sonnet 5</text><text x="232.56 241.56 250.56 259.56 268.56 277.56 286.56 295.56 304.56 313.56 322.56 331.56 340.56 349.56 358.56 367.56 376.56 385.56 394.56 403.56 412.56 421.56 430.56 439.56 448.56 457.56 466.56 475.56 484.56 493.56 502.56 511.56 520.56 529.56" y="613.54" font-size="9.00" class="sc-notoserifcjksc">并未推进我们的能力前沿，因为它在除新型编译器之外的所有评估上的表现均</text><text x="72.00 81.00" y="625.24" font-size="9.00" class="sc-notoserifcjksc">低于</text><text x="92.37 99.51 104.89 110.26 114.43 116.79 121.67 123.60" y="625.24" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="127.75 136.75 145.75 154.75 163.75 172.75 181.75 190.75 199.75 208.75 217.75 226.75 235.75 244.75 253.75" y="625.24" font-size="9.00" class="sc-notoserifcjksc">；在新型编译器上，它的得分高于</text><text x="265.11 272.26 277.63 283.01 287.17 289.54 294.42 296.34" y="625.24" font-size="9.00" class="sc-loraregular">Opus 4.7</text><text x="300.49 309.49 318.49 327.49 336.49" y="625.24" font-size="9.00" class="sc-notoserifcjksc">，但远低于</text><text x="347.86 354.15 356.60 361.19 366.56 371.94 376.82 379.19 387.32 392.11 395.60 400.99 406.25 410.42 412.79" y="625.24" font-size="9.00" class="sc-loraregular">Claude Mythos 5</text><text x="417.69" y="625.24" font-size="9.00" class="sc-notoserifcjksc">。</text><text x="72.00 79.46 82.84 90.63 94.01" y="671.92" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.3.4</text><t .51 342.06 345.15 351.07" y="181.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="362.77 373.77 384.77 395.77 406.77 417.77" y="181.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="428.77" y="181.35" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="442.67 450.36 453.35 458.96 465.52 472.10 478.07 480.96 489.69 496.26 502.83 507.92 510.81 516.77 519.48" y="181.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="528.56" y="181.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系</text><text x="72.00 83.00" y="196.97" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">统卡</text><text x="94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00" y="196.97" font-size="11.00" class="sc-notoserifcjksc">中报告的结论相比保持不变：</text><text x="237.00 248.00 259.00 270.00 281.00 292.00 303.00" y="196.97" font-size="11.00" class="sc-notoserifcjkscbold">非常低，但高于</text><text x="316.89 324.46 327.89 333.66 340.46 347.01 352.93 355.82 366.14 372.20 376.74 383.58 389.80 395.14 398.03 405.06 410.25 416.17 422.09 425.68 431.60" y="196.97" font-size="11.00" class="sc-lorabold">Claude Mythos Preview</text><text x="443.42 454.42 465.42 476.42 487.42 498.42 509.42 520.42" y="196.97" font-size="11.00" class="sc-notoserifcjkscbold">之前发布的模型。</text><text x="72.00 79.46 82.84 91.43 94.82" y="244.45" font-size="13.00" class="sc-poppinssemibold" fill="#666666">2.4.1</text><text x="102.61 115.61 128.61 141.61" y="244.45" font-size="13.00" class="sc-notosanscjkscbold" fill="#666666">证据更新</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00" y="276.35" font-size="11.00" class="sc-notoserifcjksc">我们的背景预期与</text><text x="162.89 170.58 173.57 179.18 185.75 192.33 198.29 201.18 211.12 216.98 221.24 227.83 234.26 239.35 242.25 248.91 253.60 259.51 265.06 268.15 274.07" y="276.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Mythos Preview</text><text x="285.77 296.77 307.77 318.77 329.77 340.77" y="276.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="351.77" y="276.35" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="365.67 371.66 374.37" y="276.35" font-size="11.00" class="sc-loraregular">5.1</text><text x="381.27 392.27 403.27" y="276.35" font-size="11.00" class="sc-notoserifcjksc">节以及</text><text x="417.16 424.85 427.84 433.45 440.02 446.59 452.56 455.45 464.18 470.75 477.32 482.41 485.30 491.27 493.97" y="276.35" font-size="11.00" class="sc-loraregular" fill="#0000ff">Claude Opus 4.8</text><text x="503.05 514.05 525.05" y="276.35" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">系统卡</text><text x="72.00" y="291.97" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 91.80 94.51 100.47 103.17" y="291.97" font-size="11.00" class="sc-loraregular">2.4.1</text><text x="110.07 121.07 132.07 143.07 154.07 165.07 176.07 187.07 198.07 209.07 220.07 231.07 242.07 253.07" y="291.97" font-size="11.00" class="sc-notoserifcjksc">节中报告的内容相比基本未变。</text><text x="72.00 83.00 94.00" y="341.12" font-size="11.00" class="sc-notoserifcjksc">我们在</text><text x="107.89 114.13 120.57 127.24 133.92 139.80 144.06 146.95" y="341.12" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="155.84 166.84 177.84 188.84 199.84 210.84 221.84 232.84 243.84 254.84" y="341.12" font-size="11.00" class="sc-notoserifcjksc">训练期间使用的监控与</text><text x="268.74 278.67 284.53 288.79 295.38 301.81 306.91 309.80 316.46 321.15 327.06 332.61 335.70 341.62" y="341.12" font-size="11.00" class="sc-loraregular" fill="#0000ff">Mythos Preview</text><text x="353.33 364.33 375.33 386.33 397.33 408.33" y="341.12" font-size="11.00" class="sc-notoserifcjksc" fill="#0000ff">对齐风险更新</text><text x="419.33" y="341.12" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="433.22 439.21 441.92" y="341.12" font-size="11.00" class="sc-loraregular">5.2</text><text x="450.72 461.72 472.72 483.72 494.72 505.72 516.72 527.72" y="341.12" font-size="11.00" class="sc-notoserifcjksc">节中描述的监控类</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00" y="356.74" font-size="11.00" class="sc-notoserifcjksc">似。与先前模型的训练相比，我们在该模型的训练过程中没有观察到任何更令人担忧的情况。</text><text x="72.00" y="422.08" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89 92.25 94.60" y="422.08" font-size="11.00" class="sc-loraregular">6.7</text><text x="102.57 113.57 124.57 135.57 146.57 157.57 168.57 179.57 190.57 201.57 212.57 223.57 234.57 245.57 256.57" y="422.08" font-size="11.00" class="sc-notoserifcjksc">节报告了相关能力评估的结果。在</text><text x="270.46 276.70 285.28 292.17 300.25 306.87 312.25 319.14 323.82 329.79 336.46" y="422.08" font-size="11.00" class="sc-loraregular">SHADE-Arena</text><text x="345.03" y="422.08" font-size="11.00" class="sc-notoserifcjksc">和</text><text x="358.92 369.02 372.11 378.79 381.88 391.72 397.39 400.38 405.76 412.12 415.21 421.89 428.46 434.29 441.13 447.09 453.77 459.62" y="422.08" font-size="11.00" class="sc-loraregular">Minimal-LinuxBench</text><text x="469.10 480.10" y="422.08" font-size="11.00" class="sc-notoserifcjksc">上，</text><text x="491.10 497.34 503.77 510.45 517.13 523.01 527.27 530.16" y="422.08" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00" y="437.70" font-size="11.00" class="sc-notoserifcjksc">的隐蔽率均接近于零：其得分显著低于其他先前模型。</text><text x="72.00" y="486.85" font-size="11.00" class="sc-notoserifcjksc">第</text><text x="85.89" y="486.85" font-size="11.00" class="sc-loraregular">6</text><text x="95.14 106.14 117.14 128.14 139.14 150.14 161.14 172.14 183.14 194.14 205.14 216.14 227.14 238.14 249.14 260.14 271.14 282.14 293.14 304.14 315.14 326.14 337.14" y="486.85" font-size="11.00" class="sc-notoserifcjksc">节所述的对齐评估报告指出，在大多数对齐指标上，</text><text x="348.14 355.83 358.82 364.43 371.00 377.58 383.54 386.43 392.67 399.11 405.78 412.46 418.35 422.60 425.50" y="486.85" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="434.38 445.38 456.38 467.38 478.38 489.38" y="486.85" font-size="11.00" class="sc-notoserifcjksc">似乎表现出比</text><text x="503.28 510.97 513.96 519.57 526.14 532.71" y="486.85" font-size="11.00" class="sc-loraregular">Claude</text><text x="72.00 78.24 84.67 91.35 98.03 103.91 108.17 111.06 117.02 119.62" y="502.47" font-size="11.00" class="sc-loraregular">Sonnet 4.6</text><text x="128.87 139.87 150.87 161.87 172.87 183.87 194.87 205.87 216.87 227.87 238.87 249.87 260.87 271.87 282.87 293.87 304.87 315.87 326.87 337.87 348.87 359.87 370.87 381.87 392.87" y="502.47" font-size="11.00" class="sc-notoserifcjksc">更好的对齐程度。在内部试点使用期间的极少数情况下，</text><text x="403.87 410.11 416.54 423.22 429.90 435.78 440.04 442.93" y="502.47" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="451.82 462.82 473.82 484.82 495.82 506.82 517.82 528.82" y="502.47" font-size="11.00" class="sc-notoserifcjksc">曾试图绕过在评估</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00 424.00 435.00 446.00 457.00 468.00 479.00 490.00 501.00 512.00 523.00" y="518.09" font-size="11.00" class="sc-notoserifcjksc">期间阻止其访问某些网站的网络代理。我们在先前的模型中也见过类似行为；根据我们的风险路</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00 303.00 314.00 325.00 336.00 347.00 358.00 369.00 380.00 391.00 402.00 413.00" y="533.71" font-size="11.00" class="sc-notoserifcjksc">径，我们不认为这类为追求任务成功而偶尔采取的行为反映了重大风险。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00 281.00 292.00" y="600.19" font-size="11.00" class="sc-notoserifcjksc">我们的自动化离线监控没有发现任何故意藏拙（</text><text x="303.00 308.09 313.77 320.45 327.02 333.43 339.10 345.18 351.53 354.62 361.30" y="600.19" font-size="11.00" class="sc-loraregular">sandbagging</text><text x="367.38 378.38 389.38 400.38 411.38 422.38 433.38 444.38 455.38 466.38 477.38 488.38 499.38 510.38 521.38" y="600.19" font-size="11.00" class="sc-notoserifcjksc">）、明显的恶意行为、长程战略性</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00" y="615.81" font-size="11.00" class="sc-notoserifcjksc">欺骗或长程战略性规避监督的实例，不过</text><text x="272.89 279.13 285.57 292.24 298.92 304.80 309.06 311.95" y="615.81" font-size="11.00" class="sc-loraregular">Sonnet 5</text><text x="320.84 331.84 342.84 353.84 364.84 375.84 386.84 397.84 408.84 419.84 430.84 441.84 452.84 463.84 474.84 485.84 496.84 507.84 518.84 529.84" y="615.81" font-size="11.00" class="sc-notoserifcjksc">的内部使用规模较小，这限制了这些观察所能</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="631.43" font-size="11.00" class="sc-notoserifcjksc">提供的信息。</text><text x="72.00 83.00 94.00 105.00 116.00 127.00 138.00 149.00 160.00 171.00 182.00 193.00 204.00 215.00 226.00 237.00 248.00 259.00 270.00" y="681.15" font-size="11.00" class="sc-notoserifcjksc">与一些近期模型一样，对齐评估指出，在对</text><text x="283.89 291.58 294.57 300.18 306.75 313.33 319.29 322.18 328.42 334.86 341.53 348.21 354.10 358.35 361.25" y="681.15" font-size="11.00" class="sc-loraregular">Claude Sonnet 5</text><text x="370.13 381.13 392.13 403.13 414.13 425.13 436.13 447.13 458.13 469.13 480.13 491.13 502.13 513.13 524.13" y="681.15" font-size="11.00" class="sc-notoserifcjksc">进行评估期间观察到了较高水平的</text><text x="72.00 83.00 94.00 105.00 116.00" y="696.77" font-size="11.00" class="sc-notoserifcjksc">评估意识（</text><text x="127.00 132.91 138.35 144.03 147.02 153.59 159.19 163.44 166.53 172.97 179.65 182.54 188.05 196.75 202.43 207.11 213.08 219.75 225.71 230.81" y="696.77" font-size="11.00" class="sc-loraregular">evaluation awareness</text><text x="235.90 246.90 257.90 268.90 279.90 290.90 301.90 312.90 323.90 334.90 345.90 356.90 367.90 378.90 389.90 400.90 411.90 422.90 433.90 444.90 455.90 466.90 477.90 488.90 499.90 510.90 521.90" y="696.77" font-size="11.00" class="sc-notoserifcjksc">）。我们针对这一风险的主要缓解措施，是在以下过程中使用</text><text x="72.00 83.00 94.00 105.00 116.00 127.00" y="712.39" font-size="11.00" class="sc-notoserifcjksc">真实的沙箱和</text><text x="140.89 147.78 154.36 158.61 165.20 169.89 176.32 182.89 185.98" y="712.39" font-size="11.00" class="sc-loraregular">Anthropic</text><text x="194.73 205.73 216.73 227.73" y="712.39" font-size="11.00" class="sc-notoserifcjksc">代码库：</text><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="461.53" y="73.83" width="0.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="461.53" y="73.83" width="35.40" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="496.93" y="73.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="499.82" y="73.83" width="38.17" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="537.99" y="73.83" width="2.89" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="72.00" y="89.45" width="6.00" height="11.00" fill="transparent"/></a><a href="https://anthropic.com/claude-mythos-5-system-card" rel="noopener"><rect x="78.00" y="89.45" width="2.
